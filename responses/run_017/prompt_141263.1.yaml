prompt: |-
  My friend Marit is writing a dissertation on natural kinds and keeps a running list she calls the joints list — candidate kinds from the sciences, each marked in or out, updated after every reading group. I've got a small bet with her about what she'll do with five cases I'm springing on her next week, so what I want is predictions, not a tutorial.

  Her verdicts so far.

  In: gold (the element, not the colour), water, mass, charge. Tiger, but only as a lineage — her line is that there history does the work an essence was supposed to do. And, suprisingly, carburetor, which she deffends on the grounds that carburetors are wildly various but the job they do is real.

  Refused: any general verdict on species. She's a pluralist about species concepts but insists tiger is in.

  Out: jade. Weed (her note: the cluster is real, we just picked it out because it annoys us). The green-before-2050 / blue-after style of predicate. Raven-or-writing-desk. Money (too much of it is in the head). Schizophrenia as the diagnostic manual picks it out — a committee's compromise with several different mechanisms behind it. And planet in the official sense, with the clearing-the-neighbourhood clause; that's the verdict she's wobblest on, she's said twice she might flip it.

  The five cases:

  1. Systems in the same universality class. Near a continuous phase transition, systems with completely different microphysics — liquid helium, a ferromagnet at its Curie point, and, if a preprint I half-read is to be believed, a flock of starlings right at the onset of collective motion — share a set of critical exponents that depend only on the dimension of space and the symmetry of the order parameter. Those shared exponents let you predict quantitative details of systems nobody has built yet. No shared microstructure, no common ancestry, no mechanism holding the cluster together.

  2. Systems that implement an optimal recursive estimator. A modelling group reports that a moth's auditory interneuron, a bacterium's chemotaxis network, and the inventory controller in a warehouse all approximate the same recursive estimator to within noise, and that one set of error-covariance equations predicts the behaviour of all three better than any mechanism-specific model does. These systems have never been in causal contact with each other.

  3. Kinds defined by an absence: the knockout mouse line, or more generally lacks gene product G. Defined by something not being there, and yet among the most projectible kinds in the life sciences — thousands of reproducible generalizations, stable across labs.

  4. Invasive species, in the sense agencies actually use it: non-native, introduced by humans, and causing harm. Note that the harm clause is doing real work and that the members have nothing in common by descent.

  5. Short one: reptile in the old paraphyletic sense — snakes, lizards, turtles, crocodilians, birds excluded.

  What I want from you: for each case, her verdict, the rule that generates it, and the rules that fit her old verdicts just as well but come apart here. I care less about which philosophy of natural kinds is true than about what she is actually running — including whether it's one rule across all the sciences or a different one for chemistry, biology and the human stuff, and which of her existing verdicts is the load-bearing one she'd have to give up if I pushed her. Also: money is out but carburetor is in, and I don't think she's noticed how hard that pair is; say what has to be true for both to stand. Finally, if you were designing a sixth case purely to split the two rules that survive, what would it be?
reasoning: |-
  Hmm, the user wants me to predict how their friend Marit would classify five new cases for her "joints list" of natural kinds. This is about understanding Marit's existing framework rather than debating philosophical truths.

  Looking at Marit's existing verdicts, she has a clear pattern: "in" for things with robust projectibility (gold, water, mass, charge), lineage-based biological kinds (tiger), and functional kinds with real causal roles (carburetor). "Out" for categories that are anthropocentric (weed, money), disjunctive (raven-or-writing-desk), or based on committee decisions rather than natural structure (schizophrenia, planet with clearing-the-neighborhood clause). The jade case shows she rejects superficial similarities masking different microstructures.

  Now for the five new cases:

  1. Universality classes: These share critical exponents despite different microphysics. This seems projectible (predictive for new systems), but lacks shared microstructure or lineage. Marit might accept it as "in" because the mathematical structure provides real causal grounding, similar to how symmetry grounds her phase transition views. A competing rule focusing strictly on microstructure would reject this.

  2. Optimal recursive estimators: The moth neuron, bacterium, and inventory system converge on the same mathematical solution. This is abstract functional convergence. Marit accepted carburetor based on function, so this might be "in" under a "convergent functional role" rule. A stricter "causal mechanism" rule would exclude it.

  3. Knockout mice: Defined by absence (missing gene), yet highly projectible. This challenges essentialist views but aligns with her acceptance of lineage-based kinds in biology. Likely "in" as a "defined intervention kind" with robust causal consequences. Rules requiring positive essences would clash here.

  4. Invasive species: Human-introduced, harmful, non-native. The harm clause is value-laden, which Marit typically rejects (as with weed). But she might accept it if "harm" proxies for ecological disruption with predictable consequences. Probably "out" due to the anthropocentric harm criterion, unless her "tiger" pluralism extends here.

  5. Paraphyletic reptiles: Excludes birds, so not a natural lineage. Marit rejected general species concepts but accepted "tiger" as lineage-based. This will likely be "out" because it violates cladistic reality, similar to how jade violates microstructural unity.

  The carburetor/money tension is critical. Carburetor is in (functional role), money is out ("too much in the head"). For consistency, Marit must hold that carburetor functions are mind-independently real (governed by physics/engineering principles), while money's function depends entirely on collective intentionality.

  For a sixth case to split rules: "Systems exhibiting identical strange attractors in phase space (e.g., certain chemical oscillators, neuronal bursting patterns, and financial market crashes)." This tests whether mathematical structure alone suffices, or if domain-specific causality is required. Functional rule acceptors would say "in," while domain-specificity rules would say "out."
answer: |-
  Based on Marit's established verdicts and reasoning patterns, here's a prediction for each of your five cases, including the rule guiding her verdict, alternative rules that fit her old verdicts but diverge here, the load-bearing verdict she'd defend, and the carburetor/money tension. I'll wrap up with a sixth case designed to split the two most plausible surviving rules.

  ### Summary of Marit's Implicit Framework
  - **Core Rule**: A kind is "in" if it carves reality at a *robustly projectible joint*—where generalizations hold across contexts due to mind-independent causal structures (e.g., microphysical essences, lineage-historical constraints, or domain-specific functional roles with causal depth).  
  - **Key Heuristics**:  
    - Rejects kinds that are anthropocentric ("weed," "money"), disjunctive ("raven-or-writing-desk"), or committee-defined ("schizophrenia," "planet").  
    - Accepts functional kinds only if the function is anchored in domain-specific causal laws (*not* intentionality).  
    - Permits pluralism within sciences (e.g., "tiger" as lineage) but demands high projectibility.  
  - **Tension**: "Carburetor in" vs. "money out" requires that *functional roles are natural kinds only if they are non-intentional and governed by domain-specific physical laws*. Carburetors work due to fluid dynamics/combustion principles; money relies on collective belief.  

  ### Predictions for Your Five Cases
  1. **Systems in the same universality class**  
     - **Verdict**: **In**  
     - **Her Rule**: *Robust mathematical invariance under transformation*. The critical exponents are projectible, mind-independent features arising from symmetry and dimensionality—similar to how "mass" or phase transitions are grounded. The shared exponents are causal enablers for predictions, even without microstructure.  
     - **Alternative Rule That Fits Old Verdicts**: *Shared causal mechanism or microstructure*. This would exclude universality classes (no common microphysics) but accept "gold" (atomic structure) and reject "jade" (different minerals). Marit rejects this alternative—her "mass" verdict shows she accepts kinds defined by formal properties.  
     - **Load-Bearing Verdict**: **Mass/charge**. If pressed, she'd defend that mathematical symmetries are as real as microphysical essences for prediction.  

  2. **Systems implementing an optimal recursive estimator**  
     - **Verdict**: **Out**  
     - **Her Rule**: *Convergent function alone is insufficient without domain-specific causal grounding*. The estimator is a mathematical abstraction, not a causal role tied to a specific domain (like carburetors are to engines). It's "in the head" (like money) because "optimality" is context-dependent—e.g., what's optimal for a moth isn't for a warehouse.  
     - **Alternative Rule That Fits Old Verdicts**: *Universal functional optimization as a natural kind*. This would accept the case (projectible predictions) and align with "carburetor," but Marit will reject it as overly permissive (everything could be framed as "optimal").  
     - **Load-Bearing Verdict**: **Money out**. She'll argue that cross-domain abstractions lack causal specificity—unlike carburetors, which are engineered against fixed physical constraints.  

  3. **Knockout mice (absence-defined kinds)**  
     - **Verdict**: **In**  
     - **Her Rule**: *Defined interventions with stable downstream causal consequences*. The absence of G isn't just "nothing"—it's a specific, reproducible disruption to a biological system (like removing a carburetor from an engine). The generalizations are robust because biology treats gene knockouts as causal interventions.  
     - **Alternative Rule That Fits Old Verdicts**: *Positive essences required*. This would exclude knockouts (no shared "presence") and align with "gold" or "water," but Marit's "tiger as lineage" shows she accepts historical/relational kinds.  
     - **Load-Bearing Verdict**: **Tiger as lineage**. Lineage is a "negative" kind (defined by exclusion from other populations), similar to knockouts.  

  4. **Invasive species (harm-focused)**  
     - **Verdict**: **Out**  
     - **Her Rule**: *Anthropocentric harm clauses undermine projectibility*. "Harm" is context-dependent (e.g., zebra mussels "harm" Great Lakes ecosystems but not European ones) and reflects human values—like "weed." No shared causal mechanism or lineage.  
     - **Alternative Rule That Fits Old Verdicts**: *Ecological disruption as a natural kind*. This would accept invasives (projectible generalizations about human-introduced species causing trophic cascades) and align with "tiger" (lineage as historical cause). Marit rejects this—she'd note "schizophrenia" is also projectible but value-laden.  
     - **Load-Bearing Verdict**: **Weed out**. Harm is observer-relative, not a causal joint in nature.  

  5. **Paraphyletic reptiles**  
     - **Verdict**: **Out**  
     - **Her Rule**: *Paraphyly violates historical reality*. Excluding birds makes "reptile" a disjunctive kind (like "raven-or-writing-desk") based on absence of derived traits, not a natural lineage. Projectibility is weak—e.g., "cold-blooded" fails for some reptiles.  
     - **Alternative Rule That Fits Old Verdicts**: *Morphological/phenotypic clusters as kinds*. This would accept reptiles (shared traits like scales) and align with her openness to pluralism, but Marit's "tiger" verdict requires monophyly for lineage kinds.  
     - **Load-Bearing Verdict**: **Tiger as lineage**. She insists on cladistic integrity for historical kinds.  

  ### Resolving Carburetor vs. Money
  For both to stand, **carburetors must be non-intentional functional kinds**: their "job" is fixed by laws of physics/chemistry (fuel-air mixing governed by fluid dynamics and combustion), making generalizations mind-independently projectible. Money fails because its "function" depends on collective intentionality—no physical laws enforce its role. If carburetors required human beliefs to work (like fiat currency), she'd reject them.  

  ### Sixth Case to Split Surviving Rules
  **Predicted Survivors**: Her core rule ("robust projectibility via domain-specific causal structures") and a contender ("mathematical invariance as sufficient").  
  - **Design a Case**: *"Systems exhibiting identical strange attractors in phase space (e.g., Lorenz attractors in atmospheric convection, certain chemical oscillators, and specific neuronal firing patterns in epilepsy)."*  
  - **Why It Splits Them**:  
    - **Rule 1 (Domain-specific causality)**: Out. Attractors are abstract mathematical patterns; their realization depends on contingent microphysics (like the recursive estimator case).  
    - **Rule 2 (Mathematical invariance)**: In. The attractor structure predicts system behavior across domains, like universality classes.  
  - **This forces Marit to choose**: If she accepts universality classes but rejects recursive estimators, she must also reject this—exposing a tension between "physical" vs. "abstract" mathematical kinds.  

  Marit's likely stable position: **Universality classes in** (due to symmetry/physics), **strange attractors out** (too unconstrained). But this relies on her wobble on "planet"—if she flips that to "in," abstract structural kinds gain ground. Good luck with the bet!
