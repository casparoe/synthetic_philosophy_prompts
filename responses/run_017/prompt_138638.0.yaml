  ## INTERDEPARTMENTAL MEMORANDUM  
  DEPARTMENT OF HISTORICAL REATTRIBUTION  
  OFFICE OF NONHUMAN AGENCY (ONHA)  
  SUBJECT: Revised Protocols for Primary Causation Assignment (PCA) in Historical Event Analysis  

  **1. PURPOSE:** This memorandum supersedes Directive ONHA-22-04 and establishes standardized procedures for field investigators conducting Primary Causation Assignment (PCA). Effective immediately, all historical events must undergo PCA to identify the primary nonhuman agent(s) responsible for documented outcomes. Human actors are hereby reclassified as secondary elements within causative chains, necessitating revised attribution protocols.  

  **2. SCOPE:** Applies to all historical analysis conducted by or submitted to the ONHA, regardless of period, geographic location, or conventional historiographic classification (e.g., war, revolution, migration, cultural shift).  

  **3. DEFINITIONS:**
  *   **Primary Nonhuman Agent (PNA):** The nonhuman biological, geological, climatological, or astronomical entity whose action or presence constitutes the necessary and sufficient proximal cause of a documented historical outcome. Examples include, but are not limited to: pathogenic microorganisms (bacteria, viruses), phytopathogens (e.g., *Phytophthora infestans*), extreme weather events (droughts, hurricanes), geological phenomena (volcanic eruptions, earthquakes, soil depletion), and celestial phenomena (solar minima).
  *   **Vector/Substrate:** Any human individual, group, institution, or infrastructure whose actions or existence facilitated the effective agency of the PNA. Vectors/Substrates possess no inherent causal priority and are classified as transmission mechanisms or environmental conditions. Reclassification procedures outlined in Section 7.
  *   **Retroactive Baseline (RB):** The hypothetical scenario constructed to assess the impact of the PNA by imagining its absence. RB determination is fundamental to establishing PNA primacy.

  **4. RETROACTIVE BASELINE (RB) SELECTION PROTOCOL (Article 4):**
  *   **4.1 Principle:** The significance of a PNA is measured by the divergence between the documented historical outcome and the RB scenario where the PNA was inactive or absent. The RB *must* be plausible based on available environmental and biological data contemporary to the period under review.
  *   **4.2 Practical Application:** The RB shall be constructed to maximize clarity regarding the PNA's decisive role. Field investigators are authorized to select the RB scenario that most parsimoniously demonstrates the causal necessity of the PNA. Factors to consider include:
      *   **Latitudinal/Cultural Context (Article 4.2.a):** Baseline resilience varies significantly. Pre-industrialized societies reliant on subsistence agriculture inherently possess lower thresholds for climatological or biological disruption than complex, diversified economies. This differential vulnerability is an objective factor in RB calibration. A drought impacting a pre-industrial agrarian society inherently carries greater causal weight for societal collapse than an identical drought impacting a diversified industrial economy, due to the former's proximity to baseline fragility. *This is not a value judgment but a recognition of structural susceptibility.*
      *   **Temporal Proximity (Article 4.2.b):** The RB should generally depict conditions immediately preceding the PNA's active phase. Events occurring decades or centuries prior are generally inadmissible for direct RB comparison unless demonstrably part of an unbroken causative chain culminating in the PNA's impact.
      *   **Agent Primacy (Article 4.2.c):** The RB must isolate the *specific* PNA under review. If multiple PNAs are active concurrently, the investigator must determine which agent's removal in the RB scenario would most significantly alter the outcome. The RB should not eliminate broad categories (e.g., "all disease") unless a specific, dominant PNA is identifiable.

  **5. IDENTIFYING PRIMARY NONHUMAN AGENTS (PNAs):**
  *   **5.1 Criteria:** A PNA must satisfy both conditions:
      *   **Necessity:** The documented historical outcome would not have occurred, or would have occurred in a fundamentally different manner, without the action/presence of the PNA (as demonstrated via the selected RB).
      *   **Sufficiency:** The PNA's action/presence, interacting with prevailing Vector/Substrate conditions, was capable of producing the documented outcome.
  *   **5.2 Hierarchy:** Where multiple PNAs contribute, assign primacy to the agent demonstrating the highest degree of direct, measurable impact on the critical vulnerability of the prevailing human systems (e.g., *Phytophthora infestans* impacting a monoculture staple crop > a concurrent period of slightly below-average rainfall).

  **6. VECTOR/SUBSTRATE RECLASSIFICATION (Section 7 Procedures):**
  *   **7.1 Principle:** Humans and human systems lack independent causal efficacy. They function as conduits, amplifiers, or terrain upon which PNAs exert agency. Decisions regarding resource allocation, movement, conflict, or social organization are reinterpreted as environmental factors shaping the *efficiency* and *direction* of PNA impact, not as primary causes.
  *   **7.2 Procedure:** Upon identification of a PNA, the lead investigator must file **Form NH-7: Vector/Substrate Reclassification** for all human individuals or entities previously attributed significant causal roles in the event. The form requires:
      *   Identification of the PNA utilizing the human/entity.
      *   Description of the specific function performed (e.g., "Facilitated airborne transmission via mass congregation," "Optimized soil depletion through monoculture enforcement," "Directed troop movements into malaria-endemic river valley," "Maintained grain storage infrastructure susceptible to *Sitophilus granarius* infestation").
      *   Proposed Vector/Substrate Classification Code (e.g., V-3: Biological Transmission Nexus, S-8: Resource Depletion Accelerant).
  *   **7.3 Outcome:** Successful reclassification removes the human/entity from the "Agent" category in the official ONHA Historical Ledger and assigns it as a property of the PNA's effective operational environment. Historical records will be amended to reflect this status (e.g., "Governor X, operating as V-3 during the epidemic, facilitated Y% increase in pathogen dispersion").

  **8. NONHUMAN AGENT COMMENDATIONS AND RECOGNITION:**  
  *   **8.1 Principle:** Attribution encompasses both deleterious and beneficial outcomes. PNAs contributing to outcomes deemed historically positive by conventional analysis (e.g., societal resilience, technological innovation, favorable geopolitical shifts) are eligible for formal recognition.
  *   **8.2 Awards:** The ONHA bestows the following:
      *   **Order of the Productive Spore (Posthumous):** For microorganisms inadvertently leading to medical or agricultural advances (e.g., penicillin discovery catalyst).
      *   **Medal of Climatic Advantage:** For persistent weather patterns enabling significant human endeavor (e.g., the North Atlantic Westerlies facilitating Age of Exploration).
      *   **Plinian Cross (With Oak Clusters, Delayed):** For volcanic eruptions whose tephra deposition ultimately significantly enhanced regional soil fertility, notwithstanding proximate societal disruption. (Note: Award is typically conferred retrospectively, often centuries post-event, pending soil analysis and yield confirmation. Immediate effects remain classified under standard PNA impact assessment.)
  *   **8.3 Commendation Challenges:** Investigators may encounter difficulty isolating PNA intent or navigating complex, long-term causal chains (e.g., an Ice Age glacier creating a fertile valley millennia later). Focus on measurable, proximate positive outcomes linked directly to the PNA's action. Avoid speculative teleology.

  **9. REPORTING AND LEDGER MAINTENANCE:**  
  All PCA determinations, RB justifications, Vector/Substrate reclassifications (Form NH-7), and commendation recommendations must be filed via the ONHA Central Portal within 30 days of case closure. The Master Historical Ledger, reflecting solely PNAs as primary agents and Vectors/Substrates as environmental modifiers, constitutes the official record.  

  **10. CONCLUSION:**  
  The rigorous application of these protocols ensures historical analysis accurately reflects the primacy of nonhuman agency in shaping human events. By correctly identifying PNAs and reclassifying human elements as Vector/Substrate systems, the ONHA achieves a comprehensive, materialist understanding of historical causation, free from anthropocentric bias. This framework provides definitive attribution, resolving historical responsibility with finality. Continued adherence will lead to a complete and accurate reassignment of historical causality, fulfilling the ONHA mandate.  

  **APPENDIX A: ILLUSTRATIVE PCA DETERMINATION**  
  **Event:** Collapse of Societal Structure & Mass Emigration, Island X, Mid-19th Century.  

  *   **Conventional Attribution:** Inadequate Government Relief, Land Tenure Policies, Market Forces.
  *   **ONHA PCA Determination:**
      1.  **PNA Identification:** *Phytophthora infestans* (Late Blight). Necessity: The societal collapse/mass emigration event was fundamentally predicated on the catastrophic failure of the primary caloric staple. Sufficiency: *P. infestans* is demonstrably capable of destroying >90% of *Solanum tuberosum* yields within a single growing season under conducive conditions.
      2.  **Retroactive Baseline (RB) Selection (Applying Art. 4.2):** RB = A typical harvest year yielding sufficient *Solanum tuberosum* for population subsistence. Justification: Island X exhibited high structural vulnerability (Art. 4.2.a - Latitudinal/Cultural Context) due to significant population dependence on a single, genetically homogeneous tuber crop for basic caloric needs. The RB reflects the stable condition immediately prior to PNA introduction (Art. 4.2.b). Removal of *P. infestans* alone in the RB scenario fundamentally prevents the outcome (Art. 4.2.c).
      3.  **Vector/Substrate Reclassification (Form NH-7 Filed):**
          *   **Landlord Class:** Reclassified as **S-4: Monoculture Enforcers**. Function: Optimized conditions for *P. infestans* devastation by promoting extensive cultivation of a single susceptible crop variety, minimizing biodiverse barriers to pathogen spread.
          *   **Relief Administration Officials:** Reclassified as **V-2: Transmission Inefficiency Modules**. Function: Failed to significantly impede the transmission of societal collapse vectors (famine, disease) once initiated by the PNA; their actions constituted negligible interference with the primary causal chain.
          *   **Export-Oriented Port Authorities:** Reclassified as **S-7: Caloric Export Conduits**. Function: Maintained infrastructure enabling continued food energy export despite emerging PNA-induced caloric deficit, amplifying the effective impact of the blight on the resident population.
      4.  **Commendation:** Not applicable. *P. infestans* impact was deleterious. No secondary beneficial outcomes meet commendation thresholds (Art. 8.3).
      5.  **Final Attribution:** The societal collapse and mass emigration are primarily attributed to the agency of *Phytophthora infestans*. Human elements functioned solely as Substrates (S-4, S-7) optimizing the PNA's destructive potential or as ineffective Vectors (V-2) failing to mitigate its effects. Credit/blame assignment is complete. Case Closed.
