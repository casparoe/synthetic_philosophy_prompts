answer: |-
  ## The First Question

  Crestwood High’s auditorium buzzed like a trapped hornet. The air conditioner groaned, defeated by the late May heat and the body heat of hundreds crammed onto bleachers. The issue: a four-year ban on student phones. The complication: who got to decide.

  Principal Vance, sweating through his shirt, tapped the mic. “Per our bylaws,” he boomed, “the stakeholder rule applies. Anyone bound by this ban for at least one year – a quarter of its duration – gets *some* vote. Seniors graduate in weeks, so they get quarter-votes. Juniors, half-votes. Sophomores and freshmen, full. And…” he paused, bracing himself, “the incoming eighth graders, starting *next* fall, will live under this rule for four years. They get full votes.”

  The roar was immediate. Seniors jeered. “We’re here *now*!” shouted Marco, a football captain. “Why do some middle-schooler I’ve never met get more say than me?”

  Lena, a senior with piercing green eyes who spent her free time debating Rawls in the library, stood. Her voice cut through the noise. “Principal Vance, the stakeholder rule is flawed! It assumes the *current* body defines itself. The incoming eighth graders *are* stakeholders. But who decides *they* are the only newcomers? What about the seventh graders? They’ll be freshmen in two years, bound by the ban for two years – that’s half the duration! By the stakeholder logic, shouldn’t they get half-votes?”

  Silence, then an uneasy murmur. Vance blinked. “The seventh graders… aren’t enrolled yet.”
  “Neither are the eighth graders!” Lena countered. “The boundary is arbitrary. If we include future stakeholders, we must include *all* who will be affected during the ban’s lifespan. Or none.”

  Chaos erupted. Freshmen argued for excluding seventh graders (“They’re babies!”). Middle school teachers, present but non-voting, looked alarmed. Vance hastily convened a faculty huddle. They returned with a “compromise”: Current students (grades 8-12) and incoming eighth graders (next year’s freshmen) were voters. Seventh graders were excluded. Seniors: quarter-vote. Juniors: half. Everyone else: full.

  But Marco wasn’t done. “Quarter-vote? That’s garbage! We pay activity fees, we use the library *now*. Why should a kid who hasn’t set foot here get more power?” He saw Lena’s point about the slippery slope, but weaponized it differently. “If we’re counting ghosts, fine. But our votes should be weighted by *current* investment! Seniors get *more* than a full vote! We built this place!”

  Lena groaned. “That’s the opposite of fairness! Those with the *least* stake in the *specific outcome* – those furthest from its consequences – should adjudicate the *membership*, not the policy itself! They’re the least biased!”

  No one listened. The debate spiraled: weighting by GPA? By club participation? By lunch debt?

  Then came the bombshell. A junior, Chloe, stood calmly. “My friends and I oppose the ban. We see the writing on the wall; the full-vote freshmen and eighth graders seem pro-ban. So, under Procedure 7b… we Opt Out.”

  A collective gasp. Opting Out. A group expecting to lose could declare itself outside the “student body” *for this vote*. They wouldn’t be bound by the ban, but retained access to shared resources like buses and the library.

  “You can’t just quit!” Vance sputtered.
  “The procedure exists, Principal,” Chloe said coolly. “We filed the paperwork with the faculty advisor. Twenty-three juniors are now… non-voters. But still students.”

  Instantly, factions formed. Pro-ban sophomores huddled. Anti-ban seniors whispered frantically. Another group – freshmen who wanted the ban but hated the incoming eighth graders having power – threatened to Opt Out too, just to sabotage the vote’s legitimacy.

  The voter roll became a shifting nightmare. Every time Vance tried to lock it down, a new challenge arose: Should Opted-Out students be counted in the *total* when calculating vote weightings? Did their declaration invalidate the stakeholder rule entirely? Could a group Opt Out *after* the vote started?

  Lena watched, her philosophical certainty hardening into dread. Her argument – that the disinterested should decide membership – was twisted, ignored, or used as a tactical ploy. The boundary wasn’t being settled; it was being weaponized.

  Finally, after hours, a semblance of a roll existed: Current Grades 9-12 (minus Opted-Out juniors), plus incoming eighth graders. Seniors: 0.25. Juniors (non-Opted-Out): 0.5. Sophomores, Freshmen, Incoming 8th: 1.0. Vance looked ready to collapse. “We vote. Now. All in favor of the four-year phone ban?”

  Hands shot up. Calculators emerged. Teachers tallied fractional votes with grim faces. The tension was suffocating.

  The result: 147.75 for the ban. 147.75 against.

  A perfect tie.

  The auditorium held its breath. Vance stared at the numbers, then slowly raised his eyes. “Per our rules… the Principal holds the tie-breaking vote.” He paused, a flicker of something unreadable in his eyes. “But… a motion has been submitted and seconded, questioning the validity of the roll itself. Specifically, it challenges the inclusion of… the Seniors.” He swallowed. “The motion argues that Seniors, with only weeks left and merely a quarter-vote, have such minimal stake that their inclusion dilutes the votes of those truly bound. It proposes removing Senior votes entirely for *this* ballot.”

  Lena felt the blood drain from her face. Remove the seniors? Her group.

  “The motion requires a simple majority vote to pass,” Vance continued, his voice hollow. “And as the tie-breaker on the *original* vote is contingent on the *validity* of the roll… we must vote on *this* motion first. And as Principal, I… I must cast the tie-breaking vote on *this* motion, if needed.”

  He looked out, his gaze scanning the bleachers, heavy with implication. The tie-breaker on the motion to disenfranchise the seniors couldn’t be a senior. It couldn’t be anyone with a stake. His eyes settled on Lena. Her earlier words echoed in the sudden, terrible silence: *‘Those with the least stake… should adjudicate the membership.’*

  “Miss Lena Rossi,” Vance said, his voice barely above a whisper amplified by the mic. “You have consistently argued for the perspective of the disinterested. You are a Senior, but… you argued for the inclusion of seventh graders. You are uniquely… positioned. The faculty advisory board concurs. Given the unprecedented nature of this regress… you will cast the tie-breaking vote on the motion to exclude Senior votes.”

  The room erupted again, but Lena didn’t hear it. She stood, a statue carved from ice. The boundary problem wasn’t abstract anymore. It was a knife at her own throat. Casting this vote meant deciding whether her own voice, her own quarter-stake, her own group, even existed in this demos. To vote 'yes' was to erase herself and her peers from the decision. To vote 'no' was to uphold a roll she knew was fundamentally flawed, a roll born of endless, self-serving challenges.

  The principle she championed demanded distance, demanded the perspective of the future seventh grader she’d invoked, the phantom stakeholder. But she *was* a stakeholder, however fractional. Her hand trembled. The weight of the impossible choice pressed down, not just for the phone ban, but for every "we" that ever tried to decide anything. The microphone waited, a silent, accusing eye. She opened her mouth. The first question had devoured itself, and the answer, whatever it was, would be born broken.
