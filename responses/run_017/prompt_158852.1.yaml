  ### **What the Procedure Cannot Do**
  1. **Create information from nothing**: Truly novel risks (e.g., "probability AI causes human extinction") will always hand off to experts.  
  2. **Resolve deep uncertainty**: When symmetries are broken (e.g., sovereign risk) and no data exists, it forces humility.  
