    - Aligns with decision-making (premiums depend on outcomes, not parameters).  
  - **Weaknesses**:  
    - **Not invariant under outcome transformations**: If you apply it to loss size vs. log(loss), quantiles change nonlinearly. Solution: Fix the outcome scale *first* (Step 1.1).  
