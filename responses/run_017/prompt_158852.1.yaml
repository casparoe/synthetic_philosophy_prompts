  ### **Procedure: Default Prior Selection for Data-Scarce Quantities**
  **Input**: A quantity to estimate (probability, rate, severity distribution, etc.).  
  **Output**: A defensible prior, a decision to hand off, or a "no number" conclusion.

  #### **Step 1: Define Quantity and Decision Impact**  
  *(Goal: Clarify the target and business sensitivity)*  
  - **Q1.1**: "What exactly is being estimated? Define units, scale, and bounds."  
    *Sufficient answer*: A mathematical definition (e.g., "failure probability p ∈ [0,1]", "loss severity in USD > 0", "annual rate λ > 0"). Must include hard bounds.
  - **Q1.2**: "What decision uses this quantity? What is the action threshold?"  
    *Sufficient answer*: A rule (e.g., "price = expected loss × 1.2", "reject if P(loss > $5M) > 0.01").  
  - **Check 1.3 (Decision Sensitivity)**:  
    - If the decision rule is linear/monotonic in the quantity, compute the **decision-critical range** (e.g., if pricing uses `k × estimate`, the critical range is where `k` changes the underwriting decision).  
    - If *all* defensible priors produce estimates within this range → **Stop. Document**: "Decision-invariant; prior choice irrelevant for [decision]." Use any conjugate prior and proceed.  
    - Else → Proceed to Step 2.  
    *Judgment call*: Defining the "defensible range" (use literature defaults: e.g., Beta(0.5,0.5), Beta(1,1), LogNormal(0,2) for probabilities).

  #### **Step 2: Invariance & Symmetry Testing**  
  *(Goal: Ensure prior choice is robust to reparameterization)*  
  - **Q2.1**: "Which symmetries apply to this quantity?"  
    *Sufficient answer*:  
    - Rescaling (e.g., if changing units, does the prior transform consistently? USD vs. EUR).  
    - Regraining/time-windowing (e.g., daily vs. annual rates).  
    - Aggregation (e.g., if quantity describes per-risk exposure, is prior stable under pooling?).  
  - **Test 2.2 (Reparameterization)**:  
    1. Reparameterize the quantity (e.g., for probability `p`, use log-odds `log(p/(1-p))`; for rate `λ`, use `log(λ)`; for scale parameter `σ`, use `log(σ)`).  
    2. Apply principle of indifference (PoI) in *both* parameterizations:  
       - Compute estimate from PoI in original (e.g., uniform on `p` → `p = 0.5`).  
       - Compute estimate from PoI in transformed (e.g., uniform on log-odds → `p = 0.5`).  
       - **If estimates match → Proceed to Step 3.**  
       - **If estimates differ → Flag inconsistency; PoI is invalid. Proceed to Step 4.**  
  - **Rule 2.3**: If Test 2.2 fails:  
    - Use **Jeffreys prior** if one exists (e.g., Beta(0.5,0.5) for binomial `p`, `1/λ` for Poisson rate).  
    - If no Jeffreys prior → **Stop. Document**: "No invariant prior; hand off to expert judgment."

  #### **Step 3: Data and Prior Elicitation**  
  *(Goal: Leverage minimal data or constraints)*  
  - **Q3.1**: "Is there *any* data? (Even bounds, experts, or similar risks?)"  
    *Sufficient answer*:  
    - "None" → Proceed to Step 4.  
    - "Bounded" (e.g., `a < q < b`) → Use maximum entropy prior within bounds (e.g., uniform on `[a,b]`).  
    - "Sparse events" (e.g., `k` events in `n` trials) → Use conjugate prior (e.g., Beta for binomial).  
  - **Q3.2 (If no data)**: "Can we specify mean/variance?"  
    *Sufficient answer*: Elicit from experts (e.g., "mean ≈ 0.01", "variance < 0.1"). Use maximum entropy (e.g., Gaussian for location-scale, Gamma for positive mean+variance).  
    *Judgment call*: Elicitation quality. If impossible → Proceed to Step 4.

  #### **Step 4: Default Prior Selection**  
  *(Goal: Handle true ignorance)*  
  - **If invariant prior from Step 2.3 exists**: Use it (e.g., Jeffreys).  
  - **Else if quantity is a probability**: Use **Beta(0.5, 0.5)** (Jeffreys) or **Beta(1,1)** (uniform) if Jeffreys too complex.  
  - **Else if quantity is positive with scale symmetry**: Use **1/x prior** (improper but invariant under scaling).  
  - **Else**:  
    - **Stop. Document**: "No defensible prior; insufficient symmetry/data. Hand off to risk appetite team."  
    - *Rationale*: Without invariance or constraints, any prior is arbitrary.

  #### **Step 5: Sanity Check & Documentation**  
  - **Run sensitivity**: Plot posterior/estimate under 3 priors (e.g., Jeffreys, uniform, pessimistic). If estimates differ > decision-critical range → Flag for review.  
  - **Document**:  
    - Symmetries tested and results.  
    - Data/constraints used.  
    - Why prior was chosen (or why not).  
    - Sensitivity analysis.

