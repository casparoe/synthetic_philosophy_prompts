  ### **Final Note**
  This procedure systematizes ignorance. It replaces debates about priors with tests for reparameterization invariance and decision sensitivity, then defaults to Jeffreys priors or hands off. For your sovereign risk case, it correctly forces a hand-off—no prior can be "uninformative" without symmetry. Your quantile method is a pragmatic hack for severity distributions; use it with clear bounds and document the judgment.  

