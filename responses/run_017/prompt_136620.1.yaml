answer: |-
  ## To the Stargazers Who Peddle Fate
  (Kepler's Complaint)

  You scribes of zodiac, of house and sign,
  Who hawk the future in a borrowed sky,
  Reduce the dance to tokens you assign –
  I strip your art. The rest? A gilded lie.
  But *this* persists: the measured, silent glance
  Where planets speak in angles, not in chance.

  **Conjunction:**
  One ray, one point: the burning seed is sown.

  **Sextile:**
  Two rays divide the circle, sixfold grace;
  The craftsman lifts his hand, sets chisel down;
  The seedling pushes through its earthy place.
  The merchant weighs his choice in busy town;
  The distant bell chimes clear across the square;
  The air grows soft with promise everywhere. *(Refrain)*
  Where planets speak in angles, not in chance.

  **Square:**
  Four points define the sharp, demanding square;
  The stubborn mule resists the driver's lead;
  The fever mounts within, a stifling air;
  The well runs dry, fulfilling ancient need;
  The argument sparks hot, then cools to spite. *(Refrain)*
  Where planets speak in angles, not in chance.

  **Trine:**
  Three points embrace the circle, wide and deep;
  The harvest swells beneath a golden sun;
  The traveller finds the inn where he may sleep;
  The long-sought answer comes, the work is done;
  The heart finds ease where troubled waters run. *(Refrain)*
  Where planets speak in angles, not in chance.

  **Opposition:**
  Two points define the line, the stark divide;
  The rival meets your gaze across the hall;
  The parting ship is swallowed by the tide. *(Refrain)*
  Where planets speak in angles, not in chance.

  **Quintile:**
  Five points... a shape the compass can decree,
  A fraction scribed upon the turning plate,
  But nature holds no inner sympathy,
  No answering note within our earthly state –
  A vacant angle, echoing alone. *(Refrain)*
  Where planets speak in angles, not in chance.

  **Heptagon:**
  One seventh... compass falters, rule goes slack;
  No figure forms that reason can embrace;
  Where understanding finds a final lack...

  Forget your houses! Cease your frantic chase
  Through signs that shift like sand! The *aspect* stands,
  Pure geometry traced by moving hands
  Upon the sky's vast, uncomplaining face.

  The Earth herself possesses soul and ear,
  Attuned to intervals the heavens span.
  She *hears* the trine, a consonance held dear;
  She *feels* the square, a harsh, discordant span.
  It stirs her quickness – root, or tide, or mind –
  An *inclination*, subtly entwined,
  Not iron chains that bind pre-written plan.
  The reasoned soul may yet that impulse find,
  And heed... or turn aside with will refined.
