  ## Anning College Speech Day Address

  **(Delivered in the marquee, last Friday of summer term)**

  Head Teacher, Chair of Governors, esteemed colleagues, honoured guests – particularly the grandparents who travelled furthest! – proud parents, and most importantly, the Upper Sixth leavers of Anning College. Thank you. Thank you for inviting me to share this significant moment with you. It’s genuinely moving to sit where I do now, looking out at faces lit by achievement and anticipation. I remember my own Speech Day, feeling that peculiar cocktail of relief, nostalgia, and a terrifying sense of the starting blocks being cleared away. My suit felt borrowed then, too. (Slight pause)

  Your Head Teacher, in her characteristically wise and slightly daunting way, asked me to offer you reassurance today. Specifically, she asked me to look you in the eye, as you stand here seven weeks before A-level results land, and tell you that everything *will* work out. That the conditional offers you’re holding will become firm, that the paths you’ve imagined will unfurl smoothly before you. She asked me to *promise* that. It’s a request born of deep care for you, a desire to ease the weight of these final weeks of unknowing. I feel the weight of that request. And I want to honour the spirit of it, absolutely. But I also need to honour something else: the truth as I understand it.

  So, let me try to do both.

  **(Shift in tone, leaning in slightly)**

  Here’s a comforting thought, a logical little chain we might easily reach for today: *Anning College is a very good school. It has taught you well. Pupils taught well end up all right. Therefore, you will end up all right.* It’s a neat package, isn’t it? It feels solid. It feels like something we *should* be able to say with confidence on a day like this, celebrating the work done and the community built.

  But here’s the rub, the precise point where that chain frays for me. It’s not that I doubt the first part – I see the evidence of a dedicated staff, a supportive community, the achievements celebrated moments ago. It’s not even that I wholly doubt the second part, that good teaching generally sets people on good paths. The problem lives squarely in that final step, the "therefore". The problem isn't the conclusion itself – I genuinely *hope* it's true for every single one of you! – but my *entitlement* to state it here, now, as a known fact.

  Because if I stood here and said, “Therefore, you *will* be all right,” what would make that statement genuine? Would it be sensitive to how things actually turn out? Or would I say it – perhaps with the same warmth, the same conviction – regardless of what happens on results day? I suspect I might. (Pause) That cheerful certainty might remain stubbornly unchanged even if, for some of you, things *don’t* go according to plan. It’s a statement built to weather storms it doesn’t actually sail through. It feels too comfortable, too insulated from the very future it’s trying to predict.

  And those earlier links, the premises? They’re strong, but perhaps not unshakeable fortresses. Would we *really* stop believing Anning taught you well in the world where, say, a key exam paper was lost? Probably not – we’d find reasons why the teaching *was* good regardless. And that belief about pupils taught well ending up alright? Well, it rests heavily on the stories we choose to hear, often from the Speech Days of the past – the alumni who *did* succeed, who *did* come back. (Gentle smile) It’s a wonderful sample, but it’s a sample that looks remarkably similar whether the underlying belief is perfectly true or… slightly less so. We don’t often invite back the person who quietly says, “Actually, it never quite clicked for me after I left.”

  **(Pause, then shift to a more grounded, positive tone)**

  So, I won’t make that “therefore” statement. I can’t stand here and offer you that specific brand of guaranteed sunshine seven weeks out. Your Head Teacher’s request, in its most literal form, I must respectfully decline.

  But! (A firm beat) This doesn’t plunge us into darkness. This uncertainty about the future – this *not knowing* precisely how August will unfold – doesn’t magically leak backwards and contaminate everything we *do* know right now. It doesn’t erase what’s happened. It doesn’t diminish what is solid and real in this marquee today.

  We *know* – truly know – that you sat in those classrooms, in labs, studios, sports fields. We *know* the effort you poured in, the late nights, the revisions, the questions asked (and sometimes avoided!). We *know* the care your teachers invested, lesson after lesson, meeting after meeting, trying to ignite curiosity, to build understanding, to support you through wobbles. We *know* the friendships forged here, the challenges navigated, the resilience discovered. That work? That care? That growth? That happened. It’s real. It’s yours. It’s banked. The uncertainty of the next seven weeks cannot touch the reality of the last seven years. They exist in separate compartments. The future’s opacity doesn’t smear the past’s clarity.

  **(Leaning forward, more intimate)**

  This, then, is the practical discipline I *can* offer you, the reassurance rooted not in prophecy, but in what’s firm under your feet:

  Don’t ask yourself only, “*Will* it work out?” That question looks into a fog. Instead, ask yourself, especially when the waiting gets tough: “*What would have to be false for it not to work out?*” Not about your whole life – that’s too vast. But about the immediate step. About that university place, or apprenticeship, or gap year plan.

  What would have to be false? Would your actual understanding of Chemistry have to be fundamentally flawed? Would your ability to construct an argument, tested countless times in essays and debates, have to vanish? Would the core resilience you’ve shown navigating GCSEs, personal challenges, or simply Anning’s famously competitive house events, have to evaporate?

  When you ask it that way, about the near ground, a remarkable thing happens. You realise that for things *not* to work out, something significant – something you have concrete evidence *for* right now – would have to be untrue. Your grasp of the subject *is* solid. Your critical thinking *is* honed. Your resilience *is* proven. The conditions for failure seem… well, rather drastic and unlikely compared to the bedrock of what you’ve built. This question isn’t about guarantees; it’s about recognising the strength of your position. It’s about seeing that the path to faltering requires crossing bridges that look remarkably unsound compared to the solid ground you’re already standing on.

  **(Broadening out again)**

  This grounded confidence – this awareness of the work done, the skills earned, the person you’ve become through these years – is what you take with you. It’s luggage far more valuable than any predicted grade. Anning hasn’t just filled your heads with facts; it’s equipped you with tools: to think, to question, to adapt, to learn *how* to learn. To build. To connect. To persevere.

  These tools don’t guarantee a specific outcome on a specific Thursday in August. But they *do* guarantee something profound: that whatever result lands on that screen, whatever path opens or temporarily detours, *you have what it takes to navigate it*. You have the foundation. You have the capacity to assess, to adjust, to find your footing again. You’ve already proved that, repeatedly, right here.

  So, while I won’t paint a picture of a future where every detail is fixed and guaranteed, I *can* stand here with immense confidence and say this: You are ready. Ready for the results, whatever they are. Ready for the conversations that follow. Ready for the next chapter, however it begins. The work *was* done. You *were* taught well, by people who believed in you fiercely. You *are* more capable, more resilient, more thoughtful than you were when you walked through these gates years ago.

  **(Final, strong, reassuring tone)**

  Take that certainty with you. Let it settle the butterflies. Let it be the bedrock under your feet during the wait. The future is wonderfully, necessarily open. But your preparation for it? That’s real. That’s known. That’s your unshakeable advantage.

  Head Teacher, I hope that offers the reassurance you sought – perhaps not the letter, but absolutely the spirit. Leavers, step forward. Carry what you’ve built here. Trust the ground you’ve gained. Your adventure starts now, and you are magnificently equipped for it. Go well.

  ---

  **Analytical Note (196 words):**

  The speech leans heavily on a Nozickian interpretation, particularly the claim that sensitivity is the crucial missing condition for asserting "you will be all right," rendering it non-knowledge due to its insensitivity to future outcomes. This application to future contingents is contested. A safety-theoretic approach (e.g., Sosa, Williamson) might permit such an assertion if formed via a reliable process (like observing the school's consistent track record) in conditions where error is highly *unlikely* – effectively arguing the belief *is* safe, even if not strictly sensitive. This could potentially rehabilitate a version of the Head's requested reassurance as knowledge, bypassing the insensitivity objection. Furthermore, the insulation claim – that future uncertainty doesn't "infect" the known past – relies on a strong denial of closure under known implication. Critics might argue that *if* the past work truly implied future success (as the forbidden inference suggests), then not knowing the future *should* cast doubt on the sufficiency of the past work, violating the insulation the speech claims. Closure-deniers must reject this transitive doubt.

  **What would change my mind?** A compelling argument demonstrating that for assertions about the highly-probable near-future based on robust present evidence (like proven student capability and institutional track record), *safety* is the epistemically relevant condition and not sensitivity, and that such assertions can meet the safety requirement, thereby constituting knowledge and obligating me to assert the reassurance.
