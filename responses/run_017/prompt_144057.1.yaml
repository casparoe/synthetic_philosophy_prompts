prompt: |-
  I've been reading rationalist-adjacent blogs and forums for something like fifteen years, and I keep running into a pattern in the way national defeat myths behave that I don't have a word for, so I want to describe it carefully and ask whether there's an established concept for it, or whether I should coin one.

  Four cases that make me think there's a single thing here. The American South spent a century building a story in which the Confederacy lost because of overwhelming numbers and industrial might, fought for constitutional liberty rather than slavery, and was defeated without being wrong; and the story is still doing work today, in ways that are clearly not inert. Serbia has the Kosovo field: a 1389 defeat that the epic tradition turned into a *choice* — a deliberate preference for a heavenly kingdom over an earthly one — so that losing is itself the victory, and the loss is what entitles the nation to something. Israel had Masada: a mass suicide at the end of a revolt, revived in the twentieth century as a national emblem of defiance, and then, on my impression, quietly demoted again once people started pointing out that a besieged group killing itself is a strange thing to admire. Britain has Dunkirk: a catastrophic defeat and the loss of an entire army's equipment, commemorated as a deliverance, a miracle, and a *spirit* — and, notably, invoked whenever the country next faces a slog.

  Here is what I can't fit into any framework I know. Take a Serb or a Southerner or an English patriot who is fully willing, in private, to concede every contested detail: yes, the numbers were wrong, yes, the archaeological or archival record says something different, yes, it was a rout. Conceding the details costs them nothing. What they will not do is agree with an outsider who says the same thing; that is registered as a fresh instance of the very hostility the myth is about, and adherence goes up. The correction doesn't just fail to land, it gets *absorbed* as new content: now they're trying to erase us too.

  The three-way distinction I've been using privately, which may itself be the wrong carving. Call a claim cartographic if people would change policy or predictions on learning it was false. Call it credal if the factual content is basically inert and what does the work is the willingness to say it out loud — a membership badge wearing a proposition's clothes. Neither fits the cases above, because the content there is genuinely load-bearing, people really do act on it, and yet the sign of the update on evidence about it is inverted — and inverted in a source-dependent way, so that evidence from inside the group and evidence from outside it have opposite effects. That's the thing I want named: not a proposition that can't be falsified, not a badge, but a proposition whose *update rule* has the wrong sign for one class of informant.

  So: is there an established concept that carves this at the same joint? I'm aware of the research on how correcting a false belief can entrench it, and of work on how people respond to being offered material trade-offs for things they treat as sacred, and of the general idea of a group's founding wound being inherited rather than remembered — but each of those seems to me to catch a different joint than mine, and I want to be told if I'm wrong about that and one of them is really the same thing under a better description. If nothing fits, please give me a term, a definition, and boundary cases. I also want to know whether the right place to cut is the update rule, the social function, or the narrative content — because my three-way split may be mistaking a mechanism for a kind. And give me a diagnostic: in a case I haven't seen before, what would I have to observe to say that a myth has drifted from load-bearing-but-revisable into this inverted pattern, or back out of it the way I think Masada did?

  The practical reason I want this is that I often want to know, in advance, whether correcting someone's national story will help or hurt, and right now I have no vocabulary for predicting which.
reasoning: |-
  Okay, the user has been involved with rationalist circles for 15 years and noticed a recurring pattern in how national defeat myths function. They describe cases like the American South's Lost Cause, Serbia's Kosovo myth, Israel's Masada, and Britain's Dunkirk. The key observation is that when outsiders challenge these myths, the believers dig in deeper, treating the correction as an attack, even if they privately acknowledge some inaccuracies. The user wants to know if there's an existing concept for this or if they should coin a new term.

  First, I need to understand the core issue. The user distinguishes between "cartographic" claims (fact-based, updateable) and "credal" claims (symbolic, unchanging). But the myths here are both: they have factual content that influences behavior, yet corrections from outsiders backfire. The user calls this an "inverted update rule," where external criticism reinforces the belief.

  Looking for existing concepts. Motivated reasoning and the backfire effect are related but too broad. Sacred values explain non-negotiability but not the source-dependent update. Identity-protective cognition covers defending beliefs tied to identity, but doesn't specify the inversion based on the source. Epistemic tribalism gets close with in-group vs out-group trust, but doesn't fully capture the belief's factual role.

  The user needs a term that combines several elements: the myth's factual load-bearing nature, the inverted update from out-group sources, and the mechanism where external corrections are seen as attacks. Terms like "hermetic narrative" or "antagonistic credence" might work, but I should check if any existing terms fit. Adversarial epistemology or immunological narrative function could be candidates, but they might not be established terms.

  Considering coining a new term. "Immunized Credence" emphasizes the defensive mechanism against outside corrections. "Hermetic Narrative" focuses on the sealed-off nature from external critique. "Antagonistic Episteme" highlights the adversarial response. Each term has strengths, but "Immunized Credence" seems most descriptive of the protection against external challenges.

  The user also asks for diagnostics to identify when a myth enters this state. Key indicators include the myth becoming a litmus test for group loyalty, external corrections being perceived as attacks, and the myth persisting despite factual counter-evidence. For example, Masada shifted when society started questioning the narrative's value, moving it out of the immunized state.

  Practical application: the user wants to predict if correcting a myth will help or hurt. If the myth is immunized, corrections from outsiders will backfire. Instead, leveraging in-group messengers or reframing the narrative might be more effective. Understanding when a myth shifts from factual to immunized is crucial for intervention.

  In conclusion, while existing concepts touch on aspects, no single term fully captures this phenomenon. Coining "Immunized Credence" as a new term seems justified. The diagnostic involves checking for source-dependent updates and perception of external critiques as hostility. This framework helps in assessing when corrections might reinforce rather than resolve the myth.
answer: |-
  Your observation carves reality at a crucial joint that existing terminology doesn't perfectly capture. You're describing a distinct phenomenon: **a load-bearing, identity-constitutive narrative where factual updates from *out-group* sources trigger a defensive inversion, reinforcing the myth by being interpreted as a hostile attack confirming the narrative's core grievance.** Existing concepts are adjacent but miss the specific mechanism you've identified.

  **Why Existing Concepts Fall Short:**

  1.  **Backfire Effect / Belief Perseverance:** Describes resistance to correction but doesn't specify the *source-dependency* or the mechanism of *absorption as attack*. It's broader and often focuses on individual cognition.
  2.  **Sacred Values / Protected Values:** Explains why certain beliefs are non-negotiable and resistant to trade-offs. However, it doesn't inherently address the *inverted update rule from specific sources* or the *factual load-bearing* nature you emphasize. These values are often treated as intrinsic, not updated negatively by external challenge.
  3.  **Motivated Reasoning / Identity-Protective Cognition:** Captures the *why* (protecting identity/group) and the *how* (biased processing of info). This is the *closest* foundation. Your phenomenon is a specific, potent *subtype* of identity-protective cognition characterized by the *source-dependent inversion* and *absorption as attack*.
  4.  **Founding Trauma / Chosen Trauma:** Describes the *content* and its emotional/identity function but doesn't specify the *epistemic mechanics* of how it interacts with contradictory evidence from different sources.
  5.  **Credal / Sacred Belief:** As you note, this captures the identity-signaling function but misses the *factual load-bearing* aspect. Your myths *do* influence action and policy based on their perceived facts (e.g., Southern policies based on Lost Cause, Serbian nationalism fueled by Kosovo).
  6.  **Epistemic Tribalism:** Focuses on trusting in-group sources over out-group sources. While essential, it doesn't fully capture the *inversion* – the out-group correction isn't just distrusted; it's actively *repurposed* as *evidence for the myth itself*.

  **The Core Mechanism & Proposed Term:**

  You've identified the key: **The update rule for the factual content of the myth is inverted *specifically for out-group sources*, not because the facts are irrelevant (they are load-bearing), but because the *act of correction by an out-group member is interpreted as a performative re-enactment of the original grievance or threat.** The correction isn't evaluated on its factual merits; it's processed as an *attack*, proving the enemy is *still* trying to delegitimize/destroy "us." This *confirms* the myth's core emotional truth (persecution, defiance, unique virtue) and thus reinforces adherence to its factual claims.

  **Proposed Term: Immunized Credence**

  *   **Definition:** A belief, central to a group's identity and worldview, where its factual claims are load-bearing (influencing action and policy) but are rendered resistant to falsification by out-group sources through a mechanism of *interpretive immunization*. Corrections from out-group sources are not merely rejected but are inverted, perceived as hostile acts that functionally *confirm* the belief's core narrative of grievance or exceptionalism, thereby reinforcing adherence.
  *   **Mechanism:** Interpretive Immunization via Antagonistic Framing.
  *   **Boundary Cases:**
      *   *Inside:* A respected Southern historian publishing archival proof of Confederate soldiers' letters explicitly stating they fought for slavery *might* cause cognitive dissonance and potentially update beliefs among some adherents (though still resisted), because the source is in-group. The update rule isn't *perfectly* inverted internally, just highly resistant via standard motivated reasoning.
      *   *Outside:* A Northern academic presenting the same evidence is readily framed as continuing "Yankee oppression" and "cultural genocide," *strengthening* the Lost Cause narrative's hold. The inversion is active.
      *   *Non-Immunized Load-Bearing Belief:* A nation believing it has vast oil reserves (factual, load-bearing for policy). If an international geological survey proves otherwise, even if resisted initially, the update *eventually* happens based on evidence, without the belief morphing to incorporate the correction *as an attack*. The resistance is due to cost/loss, not identity-confirming inversion.
      *   *Pure Credal Badge:* Belief in a specific, unverifiable theological doctrine serves purely as an in-group marker. Correcting it (e.g., "Your god doesn't exist") may cause offense or be ignored, but it doesn't typically *invert* to reinforce the specific doctrine *because* it was attacked, nor is the doctrine itself load-bearing for non-religious policy.

  **Carving the Joint: Mechanism, Function, and Narrative**

  You're right to question the split. The phenomenon is best understood as **an emergent property of the *interaction* between:**

  1.  **Narrative Content:** A story of defeat, persecution, defiance, or chosen sacrifice that defines group identity ("founding wound," "chosen trauma").
  2.  **Social Function:** Maintaining group cohesion, justifying present actions/policies, defining "us vs. them."
  3.  **Epistemic Mechanism (The Update Rule):** Specifically, *interpretive immunization via antagonistic framing* triggered by out-group sources. This is the *distinct* mechanism you identified.

  The *mechanism* (interpretive immunization) is the core differentiator, but it only operates powerfully because of the *narrative content* and *social function*. It's a specific *kind* of identity-protective cognition enabled by a specific *kind* of narrative serving a specific *kind* of function.

  **Diagnostic: When Has a Myth Drifted into "Immunized Credence"?**

  Look for these signs:

  1.  **Source-Dependent Update Resistance:** Resistance to factual correction is *significantly* stronger and qualitatively different (inversion vs. mere dismissal) when the source is perceived as out-group vs. in-group.
  2.  **Correction as Confirmation:** Corrections from out-group sources are *explicitly* or *implicitly* framed not just as wrong, but as *evidence* of the *continued hostility* or *threat* described by the myth itself ("They're trying to erase our history!" "See how they still hate us?" "This proves our defiance is necessary!").
  3.  **Absorption into Narrative:** The act of correction becomes incorporated *as an event* reinforcing the myth's emotional core, rather than being a separate attempt at factual discourse. The *fact* of the challenge matters more than its content.
  4.  **Litmus Test for Loyalty:** Openly agreeing with the out-group correction becomes seen as an act of betrayal or disloyalty to the group, strengthening in-group policing of the narrative.
  5.  **Factual Load-Bearing Persists:** Despite the immunization, the myth's *specific factual claims* continue to demonstrably influence group actions, policies, or predictions (distinguishing it from purely symbolic credal badges).

  **Applying the Diagnostic (e.g., Masada):**

  *   **Drifting In (Mid-20th Century):** As Masada was revitalized for nation-building, external critiques (e.g., "Suicide isn't heroic," "It was a sectarian group") would likely have been framed as proof of Jewish persecution, diaspora weakness, or lack of understanding of the necessity of ultimate defiance – *strengthening* its symbolic power. Corrections = Hostility/Naivety.
  *   **Drifting Out (Late 20th Century Onwards):** Critiques increasingly came *from within* Israeli society (archaeologists, historians, philosophers). The focus shifted from uncritical admiration to debate about its *meaning* and *appropriateness* as a symbol ("Is this the model we want?"). Out-group critiques lost their power to *immunize* because the internal debate had already opened the narrative to revision. The factual claims (e.g., extent of suicide, nature of the Sicarii) became more open to evidence-based discussion *without* automatically triggering a defensive inversion framing the critic as an enemy. The narrative became less *centrally* load-bearing for national identity/policy in its original, uncritical form.

  **Practical Prediction:**

  Using the "Immunized Credence" framework:

  1.  **Identify the State:** Is the myth currently functioning as an Immunized Credence for the target group? (Apply the diagnostic above).
  2.  **Predicting Impact of Correction:**
      *   **If Immunized:** Correction by an *out-group* member will almost certainly **backfire**, reinforcing the myth. The *best* outcome is likely complete dismissal/ignoring. The *worst* is active strengthening and increased polarization.
      *   **If Not Immunized (or Weakening):** Correction *might* land, especially if from a credible in-group source or presented in a way that doesn't trigger identity threats. Resistance will be standard motivated reasoning, not the inverted absorption.
  3.  **Alternative Strategies (For Immunized Cases):**
      *   **Leverage In-Group Messengers:** Focus on enabling credible internal voices to raise critiques.
      *   **Reframe, Don't Refute:** Acknowledge the emotional core/narrative function *first* ("I understand why this story of defiance/resilience is so important...") before gently introducing complexity. Don't attack the sacred value directly.
      *   **Focus on Future/Pragmatics:** Shift discussion away from contested past facts towards shared future goals or present-day pragmatic consequences of policies *derived* from the myth.
      *   **Avoid Out-Group Signaling:** Be hyper-aware of language, framing, and your own perceived identity to avoid triggering the antagonistic framing mechanism. Neutral, academic language can sometimes help, but often the mere source identity overrides this.

  **Conclusion:**

  You've pinpointed a specific and potent dynamic: **Immunized Credence.** It's a subtype of identity-protective cognition fueled by narratives of grievance/exceptionalism, characterized by a source-dependent inverted update rule where out-group corrections are antagonistically framed as attacks that confirm the myth, thus reinforcing it. While overlapping with motivated reasoning, sacred values, and epistemic tribalism, the *load-bearing factual content combined with inversion via absorption* makes it distinct. Recognizing this state through the diagnostic criteria is crucial for predicting the futile (or counterproductive) outcome of direct factual correction by outsiders and for developing more effective engagement strategies. Your observation significantly sharpens the understanding of how historical myths function in group conflict and identity politics.
