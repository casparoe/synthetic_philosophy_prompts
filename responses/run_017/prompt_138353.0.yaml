     This is the absurdity: by carving, we allow a week of torture (if 4.00 per day is torture) without anesthesia.

     Let's define in Appendix B:

          Procedure: Elective knee surgery without anesthesia.
          Expected suffering without anesthesia: 4.00 units per day for 7 days (total 28.00 units).
          Without temporal segmentation: the entire 7-day period is one episode of 28.00 units -> above threshold (4.01) -> prohibited.
          With temporal segmentation (Clause 6): each day is a separate episode of 4.00 units -> below threshold -> permitted.

     But note: 4.00 is exactly at the threshold? We set the threshold at 4.00 and define that >=4.00 is above. Then 4.00 per day is above -> still banned. So we must set the threshold above 4.00. Let the threshold be 4.01. Then 4.00 per day is below.

     Alternatively, set the threshold at 4.00 and say that an episode of exactly 4.00 is not above? But that would be arbitrary. The problem of the cliff: 4.00 is okay, 4.01 is catastrophic.

     We'll set the threshold at 4.00 and define that any episode with intensity-duration product >=4.00 is above the threshold. Then in the example without carving, 28.00 is above. With carving, each day is 4.00 -> above? Then the surgery is banned even with carving.

     We must adjust the example: let the per-day suffering be 3.99. Then without carving: 7*3.99=27.93 -> above 4.00? No, because the committee does not add across episodes? The threshold is per episode. Without carving, the entire 7 days is one episode of 27.93 -> above 4.00? Yes. With carving: each day is 3.99 -> below 4.00 -> acceptable.

     So the example: 
          Without anesthesia: one episode of 7 days, suffering = 27.93 units (above threshold) -> banned.
          With carving: 7 episodes of 3.99 units (each below threshold) -> allowed.

     This shows the carving issue.

     Also, we can have the triviality cut: if we set a triviality cut at 0.01, then any suffering below 0.01 is weightless. So if we have a procedure that causes 0.009 units of suffering per minute, then even if it lasts for days, it's weightless. Then we can substitute this for a stronger painkiller that might have a tiny risk of causing a severe side effect (which would be above threshold).

     The probability issue: we'll have a clause that says that any action with a non-zero probability of causing an above-threshold episode is forbidden, unless the probability is below a de minimis level (set arbitrarily at 1 in a million). This is a regress because the de minimis level itself is arbitrary and the same logic applies to it? But the committee just sets it by fiat.

