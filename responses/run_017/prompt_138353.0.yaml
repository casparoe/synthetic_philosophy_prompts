          Without carving: 7 days of 4 units/day = 28 units (above threshold) -> banned.
          With carving: each day is 4.00 units -> at the threshold? But the threshold is defined as "above it". So we must set the threshold at 4.00 and say "above or equal". Or set the threshold at 4.00 and say that 4.00 is above? To avoid confusion, let the threshold be 4.00 and define that any episode >=4.00 is above threshold.

