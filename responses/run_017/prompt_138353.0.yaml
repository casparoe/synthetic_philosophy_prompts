  We are to write a memorandum from the Clinical Ethics Committee of Thackeray General Hospital. The committee has adopted a lexical threshold negative utilitarian framework due to a bequest and a consultant's recommendation. The memorandum will outline a revised protocol for local anesthetics and elective surgery, and it must subtly expose the problems of the view through the bureaucratic language and the structure of the document.

  Key elements to include:
  1. The committee consists of:
     - A hedonic psychologist (supplies the units and the threshold)
     - A compliance officer (introduces a "triviality cut")
     - A rotating lay member
     - Former chair Dr. Ada Okonjo (who resigned and now dissents) - she is a classical negative utilitarian (minimize total suffering without a threshold)

  2. The memorandum should be in deadpan bureaucratic style, with numbered clauses and two appendices.

  3. The problems to illustrate without naming:
     - Commensurability problem: Appendix A will define the unit and set the threshold by using a pre-theoretic judgment (torture vs. many headaches) which requires the very commensurability the threshold was meant to avoid.
     - Arbitrariness and discontinuity: The threshold is a cliff. We show this by having a value (say 4.00) and then having a policy that changes drastically when crossing it. Also, the probability issue: any non-zero probability of crossing the threshold lexically dominates, leading to paralysis. The committee will resolve this by fiat (e.g., ignore probabilities below a certain level).
     - Scale-dependence of exchange rate: The committee might acknowledge that the disvalue of multiple mild pains is not additive (bulk discount) but then this undermines the threshold being a fixed number. We can have the compliance officer introduce the triviality cut for very mild pains (so they are lexically weightless) and then allow indefinite regimens of just-sub-cut discomfort. This also leads to a perverse incentive: substituting many small pains for one big one.
     - Dependence on how experiences are carved: The committee will reinterpret a long moderate agony as a series of short ones, each below the threshold, so that a surgery that would have been banned (if considered as one episode) is now permitted.

  4. The memorandum should close with a distribution clause.

  5. Dr. Okonjo's dissent: She should object in her own terms, e.g., that the policy ignores the cumulative suffering and that the focus on the threshold leads to allowing large amounts of suffering as long as no single episode crosses the line.

  Structure:
  - Memorandum header (To, From, Date, Subject)
  - Body: numbered clauses (around 10-15 clauses) that outline the policy and procedures.
  - Appendix A: Definition of the unit and calibration of the threshold (with the torture vs. headaches example as the basis, but without explicitly saying it's arbitrary).
  - Appendix B: A worked example that shows how the carving of experiences can change the outcome.

  Detailed Outline of Clauses:

  1. Preamble: Reference the bequest and the adoption of the ethically rigorous decision procedure.

  2. Definitions: Define key terms (e.g., "suffering episode", "lexical threshold", "triviality cut").

  3. General Principle: The primary ethical duty is to prevent any suffering episode that meets or exceeds the lexical threshold (set at 4.00 units, say). Below the threshold, suffering is to be minimized only if it does not risk crossing the threshold.

  4. The Triviality Cut: Introduced by the compliance officer. Suffering below a certain level (say 0.01 units) is lexically weightless and may be disregarded. This leads to allowing the substitution of many small pains for one big one.

  5. Probability Clause: Any non-zero probability of crossing the threshold lexically dominates. But to avoid paralysis, the committee sets a de minimis probability (say 1e-6) below which the risk is ignored.

  6. Experience Carving: Define how an experience is to be carved. The committee decides that, for the purpose of threshold evaluation, an experience may be divided into segments of fixed duration (e.g., one day). Thus, a week of moderate agony (which as a whole might be above threshold) is now seven days of sub-threshold agony, each acceptable.

  7. Revised Protocol for Local Anesthetics: 
     - For elective surgery, if the expected suffering without anesthesia would cross the threshold (if considered as one episode) but with the carving rule it doesn't, then anesthesia is not required? Or perhaps we say that anesthesia is only required if without it the surgery would produce at least one episode above the threshold. But by carving, we avoid that.
     - Alternatively, without carving, the surgery would be banned. With carving, it is permitted. So we can say: 
          "Previously, Procedure X was prohibited due to the expected suffering exceeding the threshold. However, under the new experience-carving provision (Clause 6), the suffering is now evaluated per day and falls below the threshold. Therefore, Procedure X is now permitted without the use of general anesthesia, provided that the daily suffering remains below the threshold."

  8. Revised Protocol for Elective Surgery: Similarly, if the surgery without anesthesia would be above threshold, but with carving it isn't, then it is allowed without anesthesia? But that would be absurd. Instead, we might say that for elective surgeries, the use of anesthesia is only mandated if the uncarved suffering would exceed the threshold. But then we use the carving to avoid that. So we can have:

          "In the case of elective surgery, the committee has determined that the suffering associated with the procedure, when considered as a single episode, may exceed the lexical threshold. However, upon applying the standard temporal segmentation (Clause 6), the per-segment suffering is below the threshold. Therefore, such procedures may proceed without the administration of anesthesia, provided that no individual segment of the procedure (as defined by the standard temporal unit) exceeds the threshold."

  9. Dissent from Dr. Okonjo: Include a clause that notes her dissent. She might say:

          "Dr. Okonjo, while acknowledging the committee's obligation to follow the bequest, has recorded her dissent. She maintains that the committee's approach neglects the cumulative burden of suffering and that the ethical imperative should be the minimization of the total suffering endured, regardless of whether any individual episode crosses an arbitrary line. She notes that the current policy may lead to the infliction of vast amounts of avoidable suffering, so long as no single episode is severe enough to trigger the threshold."

  10. Distribution: The memorandum is to be distributed to all surgical departments, anesthesiology, and the hospital board.

  Appendix A: 
     - Defines the unit: 1 unit = the disvalue of one standard mild headache (as defined by the hedonic psychologist).
     - The lexical threshold is set at 4.00 units. 
     - Calibration: The threshold was determined by the judgment that one episode of torture (defined as 4.00 units) is lexically worse than any finite number of mild headaches (each 0.01 units). But note: we must not say that the threshold is set to match that judgment arbitrarily. Instead, we can say:

          "The lexical threshold was calibrated to reflect the ethical intuition that a single instance of extreme suffering (e.g., torture) cannot be counterbalanced by any amount of mild discomfort. The threshold of 4.00 units corresponds to the minimum intensity-duration product that, in the view of the committee, triggers lexical dominance."

     However, the problem is that to set the threshold at 4.00 units for torture, we are implicitly comparing torture to headaches and saying that torture is 400 times worse than one mild headache (if a mild headache is 0.01 units). But then we are using a common scale, which the threshold was supposed to avoid.

