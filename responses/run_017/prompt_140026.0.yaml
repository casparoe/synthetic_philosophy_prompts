  1. Anticipatory moves ("X paved the way for Y")
  2. Vindication plots
  3. Maturity metaphors ("the field came of age")
  4. Retrospective units (imposing modern categories on the past)

  But I wonder if the fourth point might overlap with the first? No, upon closer look, retrospective units are about misapplying current frameworks, while anticipatory moves are about implying inevitability. They’re distinct but related. The structure holds.

  For the case study, they need something that:
  - Isn’t already pre-narrativized (so no penicillin or Higgs boson)
