  ### Game Setup: "The Rational Bet"  
  **Objective**: Illustrate the problem of logical omniscience through a betting market where students assign probabilities to propositions, revealing gaps between "rational" models and human cognition.  

  **Scenario**: A **seating arrangement** of 4 people (Anna, Ben, Clara, David) in a row of 4 chairs (positions 1-4, left to right). Students are told:  
  - Anna is at an end (position 1 or 4).  
  - Ben is next to Clara.  
  - David is next to Ben.  
  - If Anna is at 1, then Ben is not at 4.  

  **Propositions for Betting** (10 total, disguised in "layers"):  
  1. **Immediate**: "Anna is at position 1" (P1).  
  2. **Immediate**: "Ben is at position 2" (P5).  
  3. **Immediate**: "Clara is at position 2" (P6).  
  4. **Multi-step**: "David is at position 3" (P7). *(Requires checking all valid arrangements.)*  
  5. **Given truth**: "If Anna is at 1, Ben is not at 4" (P4). *(Always true by rules.)*  
  6. **Necessary truth**: "Ben is not at 4" (P8). *(True in all valid arrangements.)*  
  7. **Tautology**: "David is at 2 or David is not at 2" (P9). *(Logically always true.)*  
  8. **Tautology**: "If Ben is next to Clara, then Anna is at 1 or not" (P10). *(Consequent is tautological.)*  
  9. **Multi-step**: "Clara is at an end" (P11). *(True in 2/4 arrangements.)*  
  10. **Repackaged P1**: "Anna is left of Ben" (P1_repackaged). *(Logically equivalent to P1.)*  

  **Valid Arrangements** (4 possible, unknown to students):  
  - 1a: [Clara, Ben, David, Anna]  
  - 1b: [David, Ben, Clara, Anna]  
  - 2a: [Anna, Clara, Ben, David]  
  - 2b: [Anna, David, Ben, Clara]  
  *(Truth randomly selected post-betting; e.g., 1a.)*  

  **Mechanics**:  
  - **Initial Endowment**: 100 points per student.  
  - **Betting**: Students assign probabilities (0–1) to each proposition.  
  - **Scoring**: Quadratic scoring rule (proper):  
    - If true: Score = `1 - (1 - p)^2`  
    - If false: Score = `1 - p^2`  
    Total score = `10 × Σ(individual scores)` + (100 - points spent).  
  - **Resources for Sale** (cost in points):  
    - **Extra time (5 min)**: 10 pts.  
    - **Logic cheat sheet** (basic rules like modus ponens): 10 pts.  
    - **Peer peek** (2 min viewing one neighbor’s assignments): 15 pts.  
    - **Hint** ("Proposition 5 is always true"): 20 pts.  
  - **Phases**:  
    1. **Initial assignment** (10 min): Assign probabilities to all 10 propositions.  
    2. **Resource market** (5 min): Buy resources.  
    3. **Update** (10 min + 5 min for time-buyers): Revise probabilities using resources.  
    4. **Reveal & score**: Reveal true arrangement (e.g., 1a), compute scores.  
    5. **Dutch book audit**: Publicly check for:  
       - Incoherence (e.g., P1 probability ≠ P10 probability).  
       - Tautology mispricing (e.g., P7/P8 < 1).  
       - Strict dominance (e.g., high on P1 but low on P1-or-P6).  

  ### Predictable First-Run Issues  
  1. **Chaos in Resource Market**: Students overspend on low-value resources (e.g., peer peeks) and underuse logic sheets. Some may hoard points, avoiding resources altogether.  
  2. **Misjudging Layers**: Students ace immediate propositions (e.g., P1, P5) but bomb multi-step (e.g., P7, P11) and tautologies (e.g., P7 assigned ~0.7 on average). P1_repackaged (P10) consistently gets divergent probabilities from P1 (e.g., P1=0.6, P10=0.8).  
  3. **Scoring Confusion**: Students penalized harshly for tautologies (e.g., P7 assigned 0.8 → loss of 0.36 points when true) but don’t realize why until the audit.  
  4. **Resource Paradox**: Those who buy hints/time improve slightly (e.g., tautologies climb to 0.9), but peer peeks cause herd errors if a top student misprices.  
  5. **Time Crunch**: 30% won’t finish initial assignments; tautologies (P7/P8) will be random guesses.  

  ### Debrief: Mapping to Logical Omniscience  
  **Core Problem**: Standard possible-worlds models demand that if you believe P, you believe all its logical consequences (closure) and recognize all tautologies. The game exposes three failures:  

  1. **Closure Under Logical Consequence**:  
     - **Moment**: Students assign higher probability to P1 ("Anna at 1") than to P1_repackaged ("Anna left of Ben") *despite equivalence*.  
     - **Philosophical Map**: Closure assumes agents spot equivalence instantly. Here, syntax (wording) overrides semantics (meaning), pushing toward **syntactic/structural belief models** (e.g., belief as symbolic manipulation, not world relations).  

  2. **Tautological Blindness**:  
     - **Moment**: Tautologies (P7, P8) are priced <1. Dutch booking shows selling a "P7 contract" at p<1 guarantees a loss of (1-p) points.  
     - **Philosophical Map**: **Impossible worlds models** (where "worlds" can violate logic) or **awareness models** (agents only grasp propositions they "see") explain this. Alternatively, **giving up the norm** (e.g., "probabilistic coherence is unrealistic") emerges when students protest: "I knew it was true, I just didn’t have time!"  

  3. **Resource-Bounded Reasoning**:  
     - **Moment**: Students who buy extra time/logic sheets boost tautology probabilities (e.g., from 0.6 to 0.9) and fix equivalences (P1=P10). Poor performers argue: "I’d have been coherent with more points!"  
     - **Philosophical Map**: The **resource-bounded reply** (e.g., cognitive limits justify divergence from ideals) feels visceral here. Contrast with "ideal rationality" defenses: "But the Dutch book proves you *were* irrational!"  

  ### What the Game Can’t Reproduce  
  - **Speed vs. Omniscience**: The game *does* highlight slowness (e.g., multi-step deductions take minutes), but this conflates the *empirical* (humans are slow) with the *normative* (should rationality require omniscience?). Students may miss that the philosophical problem is about whether coherence *ought* to be the norm, not just that it’s hard.  
  - **Non-Logical Necessities**: Necessary truths (e.g., P5, P6) are mispriced like tautologies, but they’re scenario-specific, not logical. This blurs the line between logical and empirical knowledge.  
  - **Emotion vs. Abstraction**: Students "feel" the frustration of Dutch books but may not connect it to possible-worlds semantics. Explicitly link: "When you assigned P1 ≠ P10, you treated them as different ‘possible worlds’ in your mind."  

  ### Tips for Success  
  - **Run Time**: Strictly enforce phases (use a timer).  
  - **Audit Spectacle**: Publicly Dutch book a volunteer (e.g., "You sold P1 at 0.6 and bought P10 at 0.8 → guaranteed loss"). Gasps ensue.  
  - **Post-Game Naming**: Finally say: "What you experienced is the **problem of logical omniscience**. Now, let’s dissect solutions..."  

  This game forces students to confront the gulf between abstract epistemology and their own cognition. The "aha!" moment comes when they realize they Dutch-booked themselves—not through stupidity, but because logic is *expensive*.
