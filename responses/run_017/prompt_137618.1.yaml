prompt: |-
  Me and my friend got into a fight in ethics class today and I need someone to settle it. Setup: two patients, both die without help, and in both rooms there's a button. In room A the machine is off by default — you have to press the button to start it and save the patient, so not pressing is "letting die." In room B the machine is on by default and pressing the button shuts it off, so pressing is "killing." Same button, same one press, same effort, same person dies either way, and let's just say the intentions are identical too. The only thing that changes is which state the machine counts as the default.

  My credence that the doing/allowing distinction is still doing real moral work in a pair like this — as in, it's not just a stand-in for intentions, for how much you caused it, or for what happens overall — is around 0.6. My friend says more like 0.15 and thinks the distinction is basically a proxy for outcomes plus our weird feelings about defaults. Give me your own number and show me the reasoning behind it; I dont want a lecture about how philosophers disagree about everything.

  Sections, in this order:
  - "Your number" — 1-2 sentences: your probability, and say what would count as the distinction not doing independent work here.
  - "The breakdown" — 4-6 sub-questions that number depends on, each with a rough probability and one line of justification (things like: whether the distinction has any basis beyond intentions, causation and outcomes; whether it survives when the two cases are this symmetric; whether ordinary and legal judgments track it for good reasons or just inherited ones; whether "what counts as the default" is even a real moral fact rather than an engineering choice).
  - "How it adds up" — about 3 sentences on how you combined those terms, not just a restatement of the list.
  - "What would move you most" — about 3 sentences on which term you're least sure of, what would shift it, and where you think me and my friend actually disagree.
reasoning: |-
  Okay, the user is describing a thought experiment from their ethics class involving two scenarios where pressing a button either saves a life (Room A) or ends a life (Room B), with the only difference being the machine's default state. They want me to evaluate whether the doing/allowing distinction carries independent moral weight beyond factors like intention or outcomes. 

  Hmm, this is a classic ethical dilemma reminiscent of trolley problem variants, but with an interesting twist about default states. The user seems frustrated with philosophical ambiguity - they want a concrete probability assessment, not just "philosophers disagree." Their tone suggests they're intellectually engaged but wants practical resolution after the classroom argument.

  The core tension is whether the moral difference between killing and letting die persists when all other factors (intention, effort, outcome) are identical. I need to consider several layers: metaphysical (is there inherent moral relevance in default states?), psychological (do humans instinctively assign moral weight to action vs inaction?), and normative (should we?).

  Breaking it down: First, does the distinction exist independently? Probably yes - our legal systems consistently treat acts differently from omissions even with similar outcomes. Second, does it survive symmetry? Less certain - this scenario deliberately strips away all asymmetry except the default state. Third, are default states morally relevant? Tricky - one could argue defaults are arbitrary engineering choices, but socially we often treat existing states as morally privileged.

  I'll anchor around 0.4 probability - enough to acknowledge the distinction often has weight, but significantly discounted because in this engineered symmetry, the default state feels arbitrary. The user's friend at 0.15 might be over-indexing on the artificiality, while the user at 0.6 might underweight how much moral intuitions rely on non-symmetric contexts.

  Most movable on whether defaults carry inherent weight - if shown robust cross-cultural data that moral judgments track functional relationships rather than defaults, I'd lower my probability. The real disagreement between user and friend likely stems from how much to trust raw intuition versus deconstructing its components.
answer: |-
  ### Your number  
  My credence that the doing/allowing distinction does **independent moral work** here (beyond intentions, causation, or outcomes) is **0.4**. It fails to do independent work if it collapses into one of those factors or if the "default state" proves morally irrelevant when symmetrized.  

  ### The breakdown  
  1.  **Does the distinction exist beyond intentions/causation/outcomes?**  
      *Prob: 0.7*  
      Justification: Intuitions persist even when controlling for these factors (e.g., Philippa Foot’s trolley variations), suggesting a residual layer.  
  2.  **Does it survive symmetry (same effort, outcome, etc.)?**  
      *Prob: 0.3*  
      Justification: In symmetric cases, the "default" feels arbitrary; moral weight may dissolve without asymmetric stakes (e.g., resource costs).  
  3.  **Do ordinary/legal judgments track it for good reasons?**  
      *Prob: 0.6*  
      Justification: Legal systems punish acts more harshly than omissions (e.g., *not* throwing a life raft vs. sinking one), but this may codify bias, not truth.  
  4.  **Is "default state" a morally relevant fact?**  
      *Prob: 0.2*  
      Justification: Defaults are often engineering choices; unless tied to expectations/normality (e.g., "on" means "sustaining life"), it’s likely arbitrary.  

  ### How it adds up  
  I weighted factors by their decisiveness: #2 (symmetry weakness) and #4 (default arbitrariness) heavily reduce the probability, as they directly challenge the distinction’s robustness in *this specific setup*. #1 (existence beyond proxies) provides moderate support, but #3 (social/legal tracking) is ambiguous—it suggests the distinction *matters* but not that it’s *objective*. The average (0.45) nudged down to 0.4 for symmetry’s outsized role.  

  ### What would move you most  
  **#4 (default relevance, prob 0.2)** is least stable. If evidence showed that "defaults" consistently align with non-arbitrary features (e.g., biological baselines, normative expectations), I’d raise #4 to ~0.6 and my overall to ~0.55. Conversely, proof that defaults *only* reflect engineering whims (e.g., flipping Room B’s wiring changes judgments) could drop #4 to 0.05, sinking my overall to ~0.25. You and your friend likely disagree most on **symmetry (#2)**: you see it preserving the distinction’s core (hence 0.6), while your friend sees symmetry as fatal to it (hence 0.15).  

  ---  
  **Key takeaway**: The distinction *can* do work, but your scenario’s symmetry and artificial defaults cripple it. If "default" reflects deep norms (e.g., "machines *should* sustain life"), it holds; if not, it’s noise.
