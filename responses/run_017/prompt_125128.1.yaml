      "assessment": one of "correct", "correct_but_incomplete", "right_conclusion_wrong_reason", "mistake", "unsupported", "missing"
      "severity": "minor" | "moderate" | "major"
      "points": string, the effect on the mark, e.g. "-2" or "0"
      "comment_to_student": one to three sentences I can paste into the feedback sheet, addressed to the student
  - "biggest_problem": one sentence, the single thing that most holds the answer back
  - "best_bit": one sentence, the strongest thing in it
  - "missed_opportunities": array of one to three strings, things left unsaid that would have lifted the mark
