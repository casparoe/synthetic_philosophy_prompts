prompt: |-
  I've been going back and forth on white lies and bluntness and I want to run the case method on myself before I read any more about it. Background: I grew up outside Utrecht, I've been in Japan for six years, I'm married to a Japanese person, and at work I'm the one who translates between the Dutch client and our team — literally, but also in the other sense, where you take what someone means and put it into a form the other side can hear. So my verdicts come out of living in both places, and I don't trust all of them.

  What I actually think, case by case:

  - My mother-in-law spends three hours on dinner and asks how it is. It's bland. I say it's delicious. Fine — I'd go further and say refusing to say it would be the rude thing.
  - My Dutch brother emails me a draft and asks what I think. I tell him it's a mess and needs restructuring. Fine, and I'd feel I'd failed him if I'd softened it.
  - Same brother shows me a draft and doesn't ask. I tell him it's a mess anyway. Not fine. The honesty permission seems to be tied to being asked, which is odd if what you care about is truth getting transmitted.
  - A colleague asks how I am in the hallway. I'm having a bad week. I say fine. Fine. The same question from my Dutch friend: I tell him about the week. Also fine. Same sentence, opposite answers, both right — I don't want a principle that says one of those is a mistake.
  - I relay a message. The team means no and can't make the deadline, and I tell the Dutch client they're "still looking into it," knowing he'll hear maybe-yes. Not fine, and worse than most of the above. I don't think I said anything false.
  - Ending a rejection email with "looking forward to hearing from you again." Fine. Pure formula; I'd write it to someone I never want to hear from again.
  - Rejection email saying "we were impressed by your application" to someone we rejected after forty seconds. Not fine — even though it's the same kind of boilerplate. I want to say the first has stopped carrying a claim and the second hasn't, but I can't say what makes that so.
  - My grandmother has dementia and asks every ten minutes where her husband is. He died in 2019. I say he's resting. Fine, I think, though it costs me something each time.
  - My nephew's hamster dies and my sister wants me to back her up on "he went to live on a farm." Not fine. I don't want to be the one who tells a seven-year-old, but I really don't want to be the one who lies to him either.

  Those last two are the pair I can't square: both are protective fictions about a death, offered to someone who can't handle the truth, and I go opposite ways. The rejection-email pair is the other one that bothers me.

  Two more things that make me suspect my own verdicts. I'm blunt with my intern in a way I'm not blunt with my boss, and I've started to think that isn't honesty, it's just that she can't push back. And I'm blunt in English with colleagues who speak English worse than I do, which feels like the same problem wearing a different hat. Also, sometimes I enjoy being blunt — there's a little glow of being the honest one — and a verdict I enjoy is a verdict I should discount.

  My rough rule, such as it is: what matters isn't whether the sentence is true, it's wether I've left the other person in a position to act on what they need, given what this kind of exchange is for, with a discount for who has the power. But "what they need" is doing all the work and I have no idea how to fill it in.

  So: is there one principle — or a small set of candidates — that gets most of this? I want it stated precisely enough that I can test it on new cases, with the clause each of my cases is buying, and an honest list of the verdicts it can't save and which you'd overturn. Two cases I haven't decided, and I want to know what falls out of the principle rather than what you'd independently say: a junior colleague here who says to me, in English, "please be honest with me" — do I take that at face value, and does it change anything that saying it is itself a politeness formula? And the AI assistant that tells me "great question!" — nobody's feelings are at stake, nobody expects anything, and it still irritates me; does a decent principle have anything to say about it, or is my reaction just noise? And if the account leans on "what the exchange is for," can that be cashed out so it isn't an all-purpose excuse for whatever anyone felt like doing?

  Be blunt with me, obviously.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're struggling with the ethics of white lies versus blunt honesty across various personal and professional scenarios. They've provided specific cases and are looking for a consistent principle to apply. 

  First, I notice the user has a bicultural background—Dutch and Japanese—which clearly influences their dilemma. The Dutch side values directness, while the Japanese emphasizes harmony and indirect communication. This tension is central to their examples, like the mother-in-law's cooking versus the brother's draft feedback. 

  Looking at their cases, there's a pattern. When honesty serves a clear purpose—like helping the brother improve his draft—it feels right. But when it's unsolicited or harmful, like correcting the colleague's hallway greeting, it's wrong. The key seems to be whether the truth aids the other person's needs in that context. 

  The grandmother and nephew cases are especially tricky. Both involve protecting someone from harsh truths, but the user approves one lie and rejects the other. Why? The grandmother's dementia makes the truth relentlessly traumatic, while the nephew's hamster lie feels like avoiding a teachable moment. So intention and impact matter: does the lie spare pain without causing future harm? 

  The user also flags power dynamics—being blunt with an intern but not a boss. That's not honesty; it's exploiting hierarchy. And the "great question!" AI irritation? It's empty praise degrading genuine communication. 

  For principles, I consider combining Grice's maxims (truthfulness, relevance) with purpose-based ethics. But "purpose" can be vague. The user needs concrete filters: 1) Is this exchange transactional or relational? 2) Does the listener need/expect truth to act? 3) What's the power balance? 

  Testing their unresolved cases: For the junior colleague saying "be honest," take it literally—they're signaling readiness for directness. The AI's "great question!" fails because it's insincere noise violating communication norms. 

  The user’s meta-worry is spot on: enjoying bluntness can mask arrogance. Any principle must include self-checking for hidden motives. Ultimately, their intuition about enabling others to "act on what they need" is solid—it just needs scaffolding with context and consent.
answer: |-
  Your cases reveal a coherent ethical system hiding in plain sight—it's about **contextual integrity**, not truth-telling absolutes. Here’s a principle sharpened from your own examples, with teeth for testing:

  ### Core Principle
  **Communicate to uphold the *purpose* of the interaction while respecting the recipient’s agency, with adjustments for power asymmetry and cultural scripts.**

  ### How It Works
  1.  **Define the Exchange’s Purpose:** What is this interaction *for*? (Social bonding? Decision-making? Emotional protection?)
  2.  **Assess Agency & Need:** What does the recipient *need* to fulfill that purpose? (Truth? Reassurance? Actionable feedback?)
  3.  **Discount for Power:** Does power imbalance distort consent or consequences? (E.g., bluntness toward subordinates vs. peers)
  4.  **Flag Cultural Scripts:** Is the utterance governed by ritual? (E.g., "How are you?" ≠ diagnostic inquiry)

  ---

  ### Your Cases Decoded
  | **Case** | **Verdict** | **Why the Principle Agrees** |
  |----------|-------------|-----------------------------|
  | **Mother-in-law's dinner** | ✓ Fine | Purpose = Affirmation. Need = Appreciation. Script: Ritual gratitude. |
  | **Brother asks re: draft** | ✓ Fine | Purpose = Improvement. Need = Unfiltered truth to act. |
  | **Brother doesn't ask** | ✗ Not fine | Purpose = Unclear/unsolicited. Need undefined → violates agency. |
  | **Colleague: "How are you?"** | ✓ Fine | Purpose = Ritual greeting. Need ≠ Trauma dump. Script: Phatic exchange. |
  | **Dutch friend: "How are you?"** | ✓ Fine | Purpose = Genuine check-in. Need = Truth → agency honored. |
  | **"Still looking into it" (lying)** | ✗ Not fine | Purpose = Decision-making. Need = Truth to act → failure of core purpose. |
  | **"Looking forward..." rejection** | ✓ Fine | Purpose = Ritual closure. Script: Formulaic politeness (no deception). |
  | **"Impressed by application" lie** | ✗ Not fine | Purpose = Rejection. Need = Respect → false praise corrupts purpose. |
  | **Grandma: "He's resting"** | ✓ Fine | Purpose = Palliative care. Need = Avoid retraumatizing. Power: Protecting vulnerable. |
  | **Nephew: "Hamster to farm"** | ✗ Not fine | Purpose = Education/truth. Need = Age-appropriate honesty. Power: Lies create future distrust. |
  | **Blunt with intern** | ✗ Flawed | Power asymmetry exploited → violates agency. Not honesty, but dominance. |
  | **Blunt in English w/colleague** | ✗ Flawed | Power (language fluency) distorts → undermines purpose of collaboration. |

  ---

  ### Testing Your Unresolved Cases
  1.  **Junior colleague: "Please be honest"**  
      - **Apply Principle:** Purpose = Professional growth (implied). Need = Actionable feedback to improve.  
      - **Verdict:** **Take it literally.** The phrase *is* ritualistic, but it explicitly defines the purpose ("I need truth to act"). Power check: If you suspect fear, say: *"Honest feedback might be critical—are you seeking that?"* This honors agency.  

  2.  **AI: "Great question!"**  
      - **Apply Principle:** Purpose = Information exchange. Need = Efficient, accurate data. Script: Mimics human praise (but no intent).  
      - **Verdict:** **Invalidates the exchange.** It injects fake social ritual into a transactional context, corrupting purpose. Your irritation signals violation of communicative integrity—it’s not "noise."  

  ---

  ### Where the Principle Might Clash With Intuition
  - **"Enjoying bluntness":** The principle condemns using "honesty" for self-gratification where power is unequal (e.g., intern case). That glow? Ego, not ethics.  
  - **Grandma vs. Nephew:** The difference is *temporal harm*. Grandma’s dementia makes truth perpetually new/horrific. The nephew needs to learn grief’s finality—lying postpones inevitable pain + erodes trust.  
  - **"Still looking into it" vs. "He's resting":** One sabotages decision-making (active harm); the other prevents distress without blocking future truth (passive protection).  

  ---

  ### Refining "What They Need"
  **Needs are defined by the interaction’s purpose:**  
  - A hallway greeting needs brevity + positivity.  
  - A draft review needs constructive criticism.  
  - Dementia care needs emotional safety.  
  - **Power check:** If you control consequences (boss, teacher, parent), prioritize the recipient’s need over your impulse.  

  ---

  ### Final Tweak: The Consent Filter
  Add this litmus test: **"Does my response empower the recipient to act *within the agreed purpose* of this exchange?"**  
  - Yes → Ethical (e.g., telling brother his draft needs work).  
  - No → Unethical (e.g., "still looking into it" denies client’s need to pivot).  

  This framework systematizes your instincts. It won’t eliminate discomfort—ethics is messy—but it turns ambiguity into a testable protocol. **Blunt verdict:** Your self-suspicion is warranted where power skews (intern/English cases), but your core intuition about purpose/agency is sound. And that AI *should* irritate you—it’s a integrity vandal.
