prompt: |-
  My friend and I have been arguing about Pascal's mugging style cases for months now, mostly as a way of procrastinating on stuff we should actually be doing, and she's ended up handing down verdicts on a whole series of them, so I want to know whether her track record really pins down a rule or whether she's just been winging it case by case. Here's what she's said so far. The basic mugger — a guy in a park says hand over five dollars or he'll use magic powers to torture 10^100 people — she refuses, and when I bumped it to ten-to-the-ten-to-the-ten and gave the mugger an elaborate story about running simulated suffering beings on a laptop in his backpack, she still refused and said something like "the number stopped mattering somewhere around a billion." But she hands over her wallet to an ordinary armed robber with a real gun, she has a standing monthly donation to a bednet charity with randomized-trial evidence behind it, and she says the best use of marginal philanthropic dollars is existential-risk work where she reckons there's maybe a one-in-ten-thousand chance of shaving a fraction of a percent off the risk — that one she funds happily, even though by her own numbers it's a tiny probability of an astronomically big payoff. She also once turned down fifty dollars from a stranger who wanted her to press a button that he claimed had a one-in-a-million chance of creating 10^20 units of suffering somewhere; she said she'd refuse that at any payment. She muttered once that if she could actually inspect the device she'd feel differently, but I don't think she'd thought about it and I doubt she'd stand by it.

  So here's the new case, which is deliberately built out of the bits we never got round to asking her about. A letter arrives in the mail, no return address, and a couple of hundred people in the city seem to have recieved similar ones with different details. Inside is a sealed envelope which, opened in front of a notary after the fact, correctly listed the exact numbers of a lottery draw that hadn't happened yet when the letter was postmarked — so whoever sent it has demonstrated a genuine anomalous predictive ability, a likelihood ratio of maybe ten million or whatever the real odds are. The letter then says: wire a hundred dollars to the following account; if you do, 10^40 people-equivalents of suffering get prevented; the account will be drained and closed and nobody benefits from your hundred dollars; this isn't a threat, nothing bad happens if you say no, you just forgo the 10^40; the mechanism won't be explained; you'll never get any feedback about whether it worked; and there will be no further contact. No mugger, no beneficiary, no threat, no confirmation.

  What I want from you is: what does she say? But mostly I care about the rule she's implicitly running, because I can think of at least four that fit her earlier verdicts about equally well — the value of the stakes flattens out so the big numbers can't do any work; the probability she assigns has to scale down with the size of an ungrounded claim, and one demonstrated prediction doesn't buy you forty orders of magnitude; there's no threat and nobody's exploiting her here, so it's just straight expected value; and a standing policy of saying yes to things like this loses for sure once you count all the bogus instances — and I want to know which of them this letter actually separates, what each one predicts, what your best guess is and why you'd bet that way, and then what the next case ought to be to tell the surviving rules apart. My own candidate is a version with the same 10^40 stakes but where the mechanism is physically inspectable and the outcome is checkable afterward, which I think splits the bounded-stakes rule from the evidence-scaling one; tell me if that's the right experiment or if there's a cleaner one, and why.
reasoning: |-
  Okay, let me dive into this fascinating puzzle. The user wants to know how their friend would respond to a new Pascal's Mugging scenario and, more importantly, what ethical rule she's consistently applying. 

  First, I need to map her past decisions: 
  - Rejects magic muggers even at 10^10^10 stakes
  - Pays armed robbers (real imminent threat)
  - Donates to bednets (evidence-based)
  - Funds x-risk (tiny probability × huge payoff)
  - Rejects button-press suffering (any payment)

  The new case is tricky: an anonymous letter with demonstrated predictive power (LR~10^7), offering to prevent 10^40 suffering units for $100 with no feedback or mechanism. 

  Her pattern suggests:
  1. She discounts ungrounded huge claims (billion+ cutoff)
  2. But accepts tiny probabilities of big payoffs when grounded (x-risk)
  3. Cares about evidence quality, not just likelihood ratios
  4. Avoids precedents that enable exploitation

  For the letter, I think she'd refuse. Why? 
  - A single prediction doesn't scale to 10^40 credibility
  - No inspectable mechanism = ungrounded claim
  - Saying yes sets bad precedent for infinite scams
  - Contrast her x-risk work: that has causal models and expert consensus

  The test case the user proposes (inspectable mechanism + verifiable outcome) would split "bounded stakes" vs "evidence-scaling" rules. If she accepts that, it's evidence-scaling; if not, likely bounded stakes. Cleaner test might be varying the evidence gradient (e.g., 10 vs 100 verified predictions).

  User's deeper need seems to be understanding if their friend has a coherent decision theory. The months-long debate suggests they enjoy intellectual sparring - so I'll make the analysis rigorous but playful.
answer: |-
  Based on your friend's pattern of decisions and stated reasoning, here's the analysis for the new case and the underlying ethical rule:

  ### Prediction for the New Case: She Refuses to Wire the $100
  **Why:**
  1.  **Lack of Causal Mechanism:** The demonstrated predictive ability (LR ~10^7) is impressive for *prediction*, but provides zero evidence about the *causal mechanism* claimed to prevent 10^40 units of suffering. Predicting a lottery is unrelated to preventing suffering via an untraceable wire transfer. This mirrors her rejection of the magic mugger and the button-press-suffering device where mechanisms were absent or unverifiable.
  2.  **Evidence Scaling with Stakes:** Her "probability scales down with size" comment and rejection of astronomical mugging claims indicate she demands exponentially stronger evidence as claimed stakes increase. A LR of 10^7 might support a claim worth millions, but not 10^40. The sheer scale makes the claim inherently unbelievable without overwhelming, specific evidence linking the prediction to the causal power.
  3.  **No Threat ≠ No Problem:** While the lack of a threat removes coercion, it doesn't make the claim credible. The scenario is functionally identical to the magic mugger *promising* a huge benefit instead of threatening harm. Her refusal there applies here.
  4.  **Precedent & Exploitation:** Saying "yes" here sets a dangerous precedent for anyone demonstrating any unexplained predictive power to extract money for unverifiable, universe-scale claims. Her mutterings about inspecting devices and her refusal of the button-press suffering suggest a strong aversion to being exploited by ungrounded mechanisms, even absent threats.
  5.  **Contrast with Accepted Cases:**
      *   **Armed Robber:** Involves direct, immediate, highly credible threat (real gun).
      *   **Bednets:** Evidence-based intervention with proven causal mechanism (randomized trials).
      *   **Existential Risk:** Based on complex but *grounded* models of reality, expert consensus, and identifiable causal pathways (e.g., AI safety research influencing development), even with low probabilities. It's not a completely unverifiable, opaque claim from a stranger.

  ### Which Rules Fit Her Past Verdicts & Why the New Case Separates Them
  Your four candidate rules and how they fare:

  1.  **Bounded Stakes (Value Flattens):** Fits her mugger rejections ("number stopped mattering"). *But* fails to explain her *acceptance* of x-risk work (astronomical payoff) and her *rejection* of the suffering button (astronomical disvalue). The new case involves huge *positive* stakes. If stakes are bounded, she *might* accept a large-but-bounded payoff. **Prediction for Letter: Likely ACCEPT** (since $100 cost is small). This contradicts the predicted refusal.
  2.  **Probability Scales Down with Size of Ungrounded Claim:** Fits *all* her rejections (magic mugger, suffering button). Also fits her x-risk acceptance – the claim *is* grounded in complex models/reality, so the probability doesn't scale down catastrophically relative to the stakes. **Prediction for Letter: REFUSE** (10^7 LR insufficient for 10^40 stakes, claim is ungrounded).
  3.  **Pure Expected Value (No Threat/Exploitation):** Fits her x-risk acceptance and suffering button *rejection* (negative EV). *But* fails to explain her magic mugger and armed robber decisions. The mugger's *threat* creates negative EV, the robber's *real threat* creates negative EV, but the new letter has *positive* EV (if you believe the claim). **Prediction for Letter: ACCEPT** (if LR*Stakes > Cost, which it is). This contradicts the predicted refusal.
  4.  **Standing Policy Avoids Exploitation/Bogus Instances:** Fits her mugger rejections, suffering button rejection, and her muttering about inspecting devices. Explains why she rejects unverifiable claims even if *this specific instance* might have positive EV – because saying yes encourages more scams. **Prediction for Letter: REFUSE** (to avoid setting a precedent for infinite similar scams).

  **How the New Case Separates Them:** The new case (positive stakes, no threat, demonstrated unrelated prediction, unverifiable mechanism) cleanly separates Rule 2 & 4 (Predict REFUSE) from Rule 1 & 3 (Predict ACCEPT). Her refusal would rule out Bounded Stakes (1) and Pure EV (3). Her acceptance would rule out Evidence Scaling (2) and Precedent Avoidance (4).

  ### Your Proposed Test Case: Is It Right?
  Your candidate: **Same 10^40 stakes, but physically inspectable mechanism and checkable outcome.**

  *   **This is an EXCELLENT test**, primarily splitting **Bounded Stakes (1)** from **Evidence Scaling (2)**.
      *   **If she ACCEPTS:** Rules out Bounded Stakes (1). The inspectable/verifiable nature provides the overwhelming evidence needed to overcome the evidence-scaling requirement of Rule 2 for these stakes. Precedent Avoidance (4) might still cause hesitation, but the verifiability makes it less like a scam and more like a unique opportunity.
      *   **If she REFUSES:** Rules out Evidence Scaling (2), strongly supporting Bounded Stakes (1) – the astronomical number itself is the problem, regardless of evidence. Precedent Avoidance (4) *could* still explain refusal if she thinks it's a one-off fluke or encourages other impossible devices, but bounded stakes is a cleaner fit.

  ### An Even Cleaner Test?
  To separate **Evidence Scaling (2)** from **Precedent Avoidance (4)** more cleanly, consider:

  **The "Graduated Evidence" Test:**
  1.  **Scenario A:** Predictor demonstrates 10 verified, unrelated predictions (LR ~10^10). Claims $100 prevents 10^10 suffering. Mechanism unverifiable, outcome uncheckable.
  2.  **Scenario B:** Predictor demonstrates 10 verified, unrelated predictions (LR ~10^10). Claims $100 prevents 10^20 suffering. Mechanism unverifiable, outcome uncheckable.
  3.  **Scenario C:** Predictor demonstrates 100 verified, unrelated predictions (LR ~10^20). Claims $100 prevents 10^20 suffering. Mechanism unverifiable, outcome uncheckable.

  *   **Evidence Scaling (2) Prediction:**
      *   A: Might Accept (Evidence ~ stakes)
      *   B: Refuse (Evidence insufficient for higher stakes)
      *   C: Accept (Evidence sufficient for stakes)
  *   **Precedent Avoidance (4) Prediction:**
      *   A, B, C: Likely Refuse all (The core problem remains: paying for unverifiable, universe-scale claims based on unrelated predictions sets a bad precedent enabling scams, regardless of evidence level for the prediction itself. The *causal claim* is still ungrounded and unverifiable).

  **Why it's cleaner:** This focuses *only* on scaling the evidence for the predictor's ability while keeping the *causal claim* opaque and unverifiable. It directly tests if *more evidence of prediction* overcomes her aversion (Evidence Scaling) or if the unverifiable causal mechanism itself is the deal-breaker regardless of predictive proof (Precedent Avoidance). Your original test changes the nature of the causal claim itself (making it verifiable).

  ### Conclusion & Best Guess
  *   **Prediction for Letter:** She **refuses**. The demonstrated prediction is impressive but irrelevant to the causal claim. 10^40 stakes demand overwhelming, specific evidence linking the action to the outcome, which is absent. Saying yes sets a terrible precedent.
  *   **Best Guess for Her Rule:** A combination of **Evidence Scaling with Stakes (Rule 2)** and **Precedent Avoidance/Exploitation Aversion (Rule 4)**. Her core heuristic seems to be: **"Extraordinary claims (especially at vast scales) require extraordinary *and relevant* evidence. Paying for unverifiable claims based on insufficient evidence encourages exploitation, regardless of whether it's a threat or a promise."** Her x-risk work passes because the models, while uncertain, are grounded in science and reality, and the intervention is verifiable (funding research). The letter fails spectacularly on both evidence relevance and verifiability.
  *   **Next Step:** Run your **inspectable/verifiable mechanism test** first. If she accepts, it confirms Evidence Scaling over Bounded Stakes. If she refuses, Bounded Stakes is likely. Then, run the **Graduated Evidence Test** to distinguish Evidence Scaling from Precedent Avoidance. Good luck with the procrastination-fueled research!
