  The structural blocker here is *infinite resolution*: the model requires a continuum of values, but the concrete world can't supply infinite comparisons without adding artificial scaffolding. If you remove infinite resolution (e.g., assume discrete spectra), the problem collapses back to the standard indispensability argument. But with it, the nominalist either adds unneeded physical complexity or bites the bullet on fictionalism. 

  A smart nominalist might say: "I'm a fictionalist—I don't *believe* in the function, I just use it as a tool." But then they lose the austere ontology advantage. Or they might argue the extra structure is already implied by physics—but quantum mechanics doesn't require infinite concrete relations for measurement. That escape seems weak. 

  For the platonist, this case actually *worsens* their epistemic problem: now we're reliable about a *continuous* infinity of abstract objects. But it highlights a trade-off: nominalism's "savings" on abstracta might cost more in concrete ontology. The user’s core question—whether parsimony should count total ontology—gets a "yes" here: you can't just tally abstract objects; you have to check if dodging them inflates the physical world.
answer: |-
  Here's a thought experiment grounded in spectroscopy and structural determination:

  **The Scenario:**  
  You're using Raman microscopy to map chemical composition across a biological tissue sample. In a simple case (e.g., identifying two distinct lipids), nominalism works: you paraphrase "peak intensity ratios" as *direct comparative relations* between photon counts in specific wavelength bins (e.g., "Bin A photons counted at detector region R1 exceed Bin B photons at R2 by at least 3:1 whenever lipid X is present"). Concrete detector events and spatial regions suffice. Now, analyze a protein folding study where the Raman spectrum is a *complex, continuous function* with thousands of overlapping peaks encoding tertiary structure via subtle shape variations. Your predictive model requires solving an inverse problem using a *high-dimensional vector space* (e.g., singular value decomposition of spectral libraries). The nominalist paraphrase must replace each vector component with a unique comparative relation between concrete physical states – e.g., "the vibrational energy transfer between bond Y in spatial region S1 and bond Z in S2 exceeds that between bond W in S3 and bond V in S4 by ratio Q". To capture the full functional dependence and resolution, you need **infinitely many such relations** for every possible comparison across the sample, demanding a *dense, infinite network of concrete comparators* (spatial regions, bonds, energy transfers) that doesn't physically exist – far exceeding the actual sparse molecular structure implied by quantum chemistry. Physics describes the system with finitely many degrees of freedom abstractly modeled by continuum mathematics; nominalism forces an explosion of *concrete relational structure* to ground the mathematics.

  **Why the nominalist (paraphraser) loses:**  
  The blocker is **infinite resolution within finite bounds**. The predictive model requires continuous functions (infinite resolution) to fit subtle spectral features. Nominalism demands each point/value be grounded in a *distinct concrete relation*. But the concrete system (the protein/sample) has finite informational capacity – finitely many atoms, bonds, spatial regions. Paraphrasing a continuum (e.g., a function f(λ) over 500–2000 cm⁻¹) requires either:  
  1. **Infinitely many concrete relations** (physically impossible), or  
  2. **Arbitrarily dense, ad hoc physical scaffolding** (e.g., positing unreal "pseudo-regions" or "comparator events") bloating the physical ontology beyond what physics justifies.  

  **Why the platonist doesn't win free:**  
  This *worsens* their epistemic problem. Reliability now requires tracking a *continuous infinity* of abstract objects (vector components, function values) with finite brains. They must explain how evolution or learning "latches onto" this non-causal realm with sufficient fidelity for high-dimensional calculus to work – a steeper challenge than with discrete natural numbers.

  **Remove the structural feature?**  
  If you remove *infinite resolution* – e.g., assume spectra are discrete step functions – the problem collapses. Nominalism paraphrases finitely many comparisons easily. This is *not* standard indispensability (which argues abstracta are necessary for *formulating* theories). Here, nominalism *succeeds* formulation but *fails grounding* without inflating concrete ontology.

  **Smart nominalist escape & its cost:**  
  1. **"I'm a fictionalist!"**: They accept the mathematics as useful fiction, not requiring concrete grounding. This dodges ontological inflation but abandons the core nominalist advantage: austere *truthmaking*. Successful predictions become inexplicably lucky accidents without abstracta *or* bloated concreta.  
  2. **"The extra structure is physically real!"**: They argue quantum fields or spacetime points provide the needed dense relations. But this violates the constraint: physics doesn't *obviously* require infinitely many localized comparators for spectroscopy. Quantum states are holistic; measuring a spectrum doesn't probe infinite independent degrees of freedom. This escape *over-interprets* physics to save nominalism, violating parsimony in the concrete domain it aimed to protect.

  **The Verdict on Parsimony:**  
  This case shows that avoiding abstract mathematical objects *can* force inflation of physical ontology beyond what our best science requires. Total ontology (abstract + concrete) matters: nominalism’s "savings" on abstracta may incur greater costs in concreta. Parsimony arguments must compare *total* ontological commitments, not just abstract ones.
