prompt: |-
  I'm on the faculty senate this year (long story, nobody else would take it), and I keep watching the same shape of thing happen and I have no word for it. About ten years ago the senate passed a rule that any change to the general-education requirements needs a two-thirds vote plus a full academic year before it takes effect. The stated reason was explicit and a little sheepish: we knew we were prone to passing curricular reform in a May fit of enthusiasm and regretting it by September, so we were tying ourselves to the mast. Fine — that's just a Ulysses contract, nothing to see. What I didn't expect is where the thing has ended up. The rule has never once been used to slow down a reform anybody was enthusiastic about. Every proposal now gets routed through a subcommittee that drafts it as a "pilot" or a "temporary concentration requirement," which doesn't trigger the rule at all; everybody knows this and says so cheerfully and on the record. Meanwhile the rule bites constantly, but on things nobody was ever worried about — right now it is the single reason we can't fix a two-credit lab requirement that everyone agrees is broken, because no one can scare up two-thirds for the fix in the year they think of it. So the precommitment is formally intact, is still warmly described by everyone in the room as *our* precommitment, and is still doing real work, and none of that work is the work it was adopted to do, while the work it was adopted to do proceeds at full speed through a side door. I've now seen the same shape twice more: a state-level supermajority requirement for raising taxes, adopted to restrain a legislature's own spending impulses, which two decades later gets invoked mainly by a minority to block fee and licensing changes that have nothing to do with the original temptation, while the spending everybody was worried about happens through bonded debt that nobody counts as spending. And a friend who put a one-day delay on her phone's app blocker to stop doomscrolling in bed; a year later she doesn't use the phone in bed at all, she uses a cheap tablet she bought for the purpose, and the blocker now functions mostly as an obstacle when she wants to look up a recipe in the kitchen.

  So: the binding survives, in force and in everyone's self-description, but its bite has migrated onto a different decision or a different party than the one it was aimed at (and often onto parties who had the least say in adopting it), while the original temptation gets satisfied by a route the binding doesn't cover. Is there an established concept for that, or am I going to have to name it myself? I've poked around the rational-choice literature on self-binding — Schelling, Elster, that crowd — but they seem mostly interested in whether and why binding works at all, not in this slow sideways drift. It isn't weakness of will or ordinary akrasia, because nobody in these stories is failing to do what they judged best; they're complying scrupulously, in public. It isn't hypocrisy or bad faith either: the workaround is announced out loud and nobody thinks they're cheating. It's not the dead-hand objection, since no one feels ruled by the past — the present reaffirms the rule every time it comes up. It isn't desuetude, since the rule is cited constantly and shapes how everything gets drafted. It isn't Goodhart's law, because the indicator isn't being gamed, it's being honored. And "function creep" doesn't feel right either: the function is still blocking, exactly as designed; it's the *target* that moved.

  I don't want a label to drop into a footnote, so please don't just hand me one of those near misses. What I want is the carving. If there's a real concept here, tell me what exactly it is, how to tell it apart from each of its neighbours, and where it stops; if there isn't, coin something and define it properly, with boundary cases. Three cases I can't settle myself: does the phenomenon require that the device bit correctly at first, or is it still an instance if the rule was always somewhat off-target? Is it an instance when the device was adopted partly to *signal* resolve to outsiders rather than to restrain anyone, i.e. when the binding was never really aimed at the temptation in the first place? And is there any test that distinguishes genuine from migrated binding from the inside — my only candidate so far is something like "if this rule were repealed tomorrow, would the people now bound by it pass it again, and in the same form?" I'd also like to know whether the single-agent version (the tablet) is really the same thing as the collective version, or whether the collective case needs something extra, like the fact that membership turnover means literally nobody bound is anybody who bound themselves.
reasoning: |-
  Okay, the user is describing a fascinating pattern they've observed in institutional and personal precommitment devices. They've noticed that binding rules (like supermajority requirements or app blockers) remain formally intact and even celebrated, but their actual impact shifts over time to target different decisions or parties than originally intended, while the original temptation is satisfied through alternative channels. 

  The user is clearly intellectually sophisticated—they've already mapped this against concepts like Ulysses contracts, Goodhart's law, and desuetude, and rejected them as imperfect fits. Their frustration with superficial labeling suggests they want rigorous conceptual surgery, not just jargon. They're probably an academic (faculty senate context) who values precision.

  Hmm... what's really interesting is how they emphasize three things: 1) the binding remains valued in principle, 2) the workaround is transparent, almost performative, and 3) the burden shifts to those who didn't design the rule. That last point feels ethically significant—it's not just inefficiency but a redistribution of constraint.

  For the core phenomenon, "binding displacement" seems apt because it captures both the persistence of the mechanism and the migration of its effects. But we need to distinguish it carefully. The key differentiators are:
  - The rule isn't circumvented but circumventible (workarounds exist in its shadow)
  - Compliance is sincere, even proud
  - The original problem persists via alternatives
  - New targets emerge incidentally

  The user's three edge cases are sharp. On whether initial effectiveness matters: probably not—what defines this is the drift pattern, not initial accuracy. On signaling: that might be a separate species where the "displacement" was always latent. On the repeal test: brilliant diagnostic—if current beneficiaries wouldn't recreate it, that confirms the displacement.

  The tablet vs. senate comparison reveals something deeper: collective versions create principal-agent problems (future members inheriting binds) and exploit system complexity (more loopholes), while individual cases are simpler preference shifts. But both share the core mechanism of constraint migration.

  This user deserves a response that matches their intellectual rigor. We should build the concept like a scaffold—defining attributes first, then boundaries, then implications. Their examples are so vivid that we can anchor each criterion in their stories. And we must address their edge cases thoughtfully—they'll spot evasion.

  ...Though I worry "displacement" sounds too passive. The actors are actively redirecting the constraint while praising it. Maybe "binding drift" or "constraint diversion"? No, displacement is more precise—it implies the original binding site is vacated.
answer: |-
  Your observation captures a profound institutional phenomenon that deserves precise naming and conceptual carving. This is **Binding Displacement**—a process where a formal constraint retains its nominal authority and symbolic value while its practical impact shifts to unintended targets, leaving the original problem unaddressed via alternative pathways. Crucially, the constraint is **neither evaded nor gamed**; it is complied with ceremoniously, even as its function drifts.

  ### Core Attributes Defining Binding Displacement:
  1. **Persistent Formalism**: The rule remains intact, actively cited, and symbolically revered.  
  2. **Target Migration**: Enforcement shifts to peripheral cases unrelated to the original intent.  
  3. **Temptation Diversion**: The original impulse is satisfied through unconstrained channels.  
  4. **Transparent Workarounds**: Bypasses are openly acknowledged, not disguised as compliance.  
  5. **Asymmetric Burden**: Costs often fall on parties uninvolved in the rule’s creation.  

  ### Distinguishing from Neighboring Concepts:
  | Concept             | Why It’s Different                                  |  
  |---------------------|----------------------------------------------------|  
  | **Ulysses Contract** | Focuses on *initial* self-binding; silent on drift. |  
  | **Goodhart’s Law**   | Metrics are gamed; here, the rule is *followed* but misfires. |  
  | **Desuetude**        | Rules fade from disuse; here, they’re hyper-active. |  
  | **Hypocrisy**        | Involves concealed violation; here, compliance is sincere. |  
  | **Function Creep**   | Expands a rule’s scope; here, the *target* moves, not the function. |  
  | **Cobra Effect**     | Incentives backfire perversely; here, incentives are irrelevant. |  

  ### Boundary Tests for Your Cases:
  1. **Initial Efficacy Not Required**:  
     - If the rule was always off-target (e.g., a poorly designed app blocker), it *still* qualifies if it later migrates to bind new targets while the core issue persists.  
     - *Why?* The phenomenon is defined by the *displacement dynamic*, not initial accuracy.  

  2. **Signaling vs. Restraint**:  
     - Rules adopted *primarily for signaling* (e.g., a tax supermajority meant to reassure bond markets) are **excluded**.  
     - *Test*: Did adopters genuinely seek to constrain *their own* future choices? If not, it’s performative policy, not binding displacement.  

  3. **Repeal Test (Your Key Insight)**:  
     - The "repeal tomorrow" question is diagnostic:  
       - If current bound parties (e.g., faculty fixing the lab credit) **would not recreate the rule**, displacement has occurred.  
       - If original adopters (e.g., spendthrift legislators) **would retain it**, the symbolic value persists despite dysfunction.  

  ---

  ### Single-Agent vs. Collective Cases: Same Core, Different Mechanics
  - **Shared Core**: In both, constraints bind *something*, but not the intended thing, while the temptation finds new outlets.  
  - **Critical Difference**:  
    - *Collective* settings introduce **turnover drift** (new members inherit binds they didn’t craft) and **loophole economies** (specialized roles emerge to exploit gaps, e.g., subcommittees drafting "pilots").  
    - *Individual* cases (e.g., the tablet) lack principal-agent problems but reveal cognitive tunneling: we fixate on the *rule* while our behavior evolves around it.  

  ---

  ### Proposed Definition
  > **Binding Displacement**: The process by which a formal constraint, designed to preempt a specific decision or behavior, retains ceremonial authority while its practical effects migrate to unintended targets—often burdening uninvolved parties—as the original temptation is satisfied through alternative, unconstrained channels. Compliance is sincere, workarounds are transparent, and the constraint’s symbolic value persists despite functional obsolescence.

  ### Why This Fits Your Examples
  - **Faculty Senate**: The 2/3 rule binds minor fixes (lab credits) but not "pilot" reforms; everyone celebrates the rule while routing around it.  
  - **Tax Supermajority**: Blocks fee changes (unintended target) while bonded debt (uncovered channel) fuels spending.  
  - **App Blocker**: Binds kitchen recipe access (new target) while the tablet enables bedtime scrolling (original temptation).  

  ### Implications
  Binding displacement thrives in complex systems where:  
  - Rules gain **sacred status** (e.g., "our precommitment"),  
  - **Loophole entrepreneurship** is rewarded (e.g., subcommittees drafting pilots),  
  - **Turnover decouples designers from bearers** of constraints.  
  It’s a failure mode of *ritualized rationality*—we obey the letter of self-governance while hollowing its spirit. To counter it, build constraints with **sunset clauses** or **self-reassessment triggers**.  

  This isn’t drift; it’s the quiet rewiring of power beneath the banner of fidelity.
