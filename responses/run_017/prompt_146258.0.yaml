     Some decision theorists might argue that the Duplicate variant should be treated as a game of imperfect information and use solution concepts that account for the correlation. But the backward induction I did for the Duplicate variant is a straightforward application of the fact that at each round, the agent is choosing between two outcomes (both take or both pass) and the payoff of both pass is higher than both take (and leads to a continuation that is even better). 

