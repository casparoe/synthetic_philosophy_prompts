     The protocol does need to account for the possibility of coordination via commitment. In the Duplicate variant, the agents can achieve the cooperative outcome without an external commitment device because their identical nature serves as a commitment. But in the ordinary case without such correlation, the commitment device might be necessary to achieve the cooperative outcome.

