prompt: |-
  I'm taking this slightly weird independent study on medieval Jewish philosophy (mostly me, one grad student, and a lot of coffee), and last night I was argueing with two friends from my reading group about Maimonides on animal sacrifice and we definately kept going in circles. Here's the knot: in the Guide for the Perplexed (Part 3, chapter 32), Maimonides gives that famous accommodationist story—he says it is impossible to go suddenly from one extreme to the other, that people cling to whatever worship they were raised with, and that in those days the common custom was sacrificing animals in temples with images, bowing to those images, and burning incense before them, while the really religious folks were serving in temples devoted to the stars or to created beings and imaginary unreal things. So God, acting like a wise physician, did not command the Israelites to give up all those familiar modes of service; instead He transferred them to His own service—build a sanctuary, set up an altar, offer sacrifices, bow, burn incense—but now directed to Him alone, with the result that the traces of idolatry were blotted out and the existence and unity of God were firmly established without deterring or confusing minds by abolishing the only worship they knew. He even says it would be as shocking then as if a prophet today told us to serve God only in thought, with no prayer, no fasting, no asking for help in trouble.

  The problem my friends and I couldn't get past is that this sounds like sacrifices are a regrettable concession, a kind of spiritual training wheel for a people who weren't ready for pure intellectual worship—so why does Maimonides turn around in the Mishneh Torah (Laws of Kings and Wars, chapter 11, first law) and say that in the days of the Messianic king the observance of all the statutes will return to their previous state, that we will offer sacrifices and keep the Sabbatical and Jubilee years according to all their particulars, and that this Torah, its statutes and its laws, are everlasting and not to be added to or detracted from? If sacrifices were only a fading crutch meant to wean Israel off idolatry, the ideal final state should ditch them, not restore them forever. To try to get unstuck, we invented a distinction (don't laugh) between two kinds of non-ideal practice: a 'fading crutch,' which is a practice whose entire point is to disappear once its therapeutic job is done, like training wheels that must come off or a cast that gets removed when the bone heals; and a 'permanent scaffold,' which is still not the highest end and is still only justified by human psychological limits, but which even a perfected community retains because taking it away would be impossible, or because it has become the load-bearing structure for the rest of the legal system, or because its continued presence doesn't actually compete with the higher worship for those who have attained it. We called the first reading of Maimonides the fading-crutch reading and the second the permanent-scaffold reading.

  So please explain this conceptual issue to me: can Maimonides consistently be read as a permanent-scaffold thinker about animal sacrifice rather than a fading-crutch thinker? In your explanation, I'd like you to (a) briefly reconstruct how the accommodationist argument in Guide 3:32 seems to push toward the fading-crutch reading—i.e., why, if the whole rationale is a gradual weaning away from idolatry, the natural expectation is that the scaffold should be removed once the weaning is complete; (b) explain why the restoration-and-eternality material in Mishneh Torah, Kings and Wars 11:1 pushes back against that expectation and seems to demand that sacrifice be part of the final, perfected order; and (c) assess whether the permanent-scaffold distinction actually dissolves the tension or just relocates it—for instance, does it make Maimonides' eternality claim less of an embarrassment, or does it saddle him with the weird view that an all-wise lawgiver builds a permanently second-best institution into the ideal state? I'm looking for a careful conceptual explanation, not a bibliography or a reading list (I have no web access and don't need citations anyway), and please work from the texts as I've paraphrased them plus the fading-crutch/permanent-scaffold distinction instead of trying to recall scholarly authorities. Finally, finish your response with a last line beginning 'Summary:' that gives, in exactly one sentence, the overall upshot of your explanation.
reasoning: |-
  Okay, let me unpack this user's query. They're deep into Maimonides' apparent contradiction between the Guide's accommodationist view of sacrifices and the Mishneh Torah's eternal commandment. The user and their friends created the fading-crutch vs permanent-scaffold framework to resolve it. 

  First, I need to reconstruct why Guide 3:32 suggests fading-crutch. Maimonides compares it to a physician gradually curing a patient - the implication is that once healed (idolatry eradicated), the crutch (sacrifices) becomes unnecessary. The shock-value analogy about abolishing prayer today reinforces this: if current rituals are like ancient sacrifices, shouldn't both eventually become obsolete?

  But then Mishneh Torah throws a wrench by declaring sacrifices eternal in the messianic era. This directly contradicts the fading-crutch trajectory. The permanence claim makes sacrifice seem fundamental rather than transitional. 

  Now assessing their proposed distinction: permanent-scaffold might work if we see sacrifice as having dual functions - temporary weaning tool AND permanent ritual structure. Like a building's scaffold that becomes part of the facade. But this raises new questions: why would God permanently retain a "second-best" practice? Maybe because human cognition always needs tangible rituals alongside intellectual worship - even in messianic times. 

  The tension isn't fully dissolved though. Maimonides still has to explain why this particular concession becomes eternal when others (like temple service) don't. But it's less embarrassing than flat contradiction - he's saying divine law accommodates human limits even in utopia, not that sacrifices are ideal.

  User clearly wants conceptual rigor over scholarship. Their scaffold/crutch analogy is clever - I should honor that while probing its limits. Their frustration with circular debates suggests they need resolution, not just more angles. 

  Final summary must capture that Maimonides can consistently hold both views by treating sacrifice as a perpetual accommodation - necessary scaffolding for embodied human worship across all eras.
answer: |-
  Here’s a conceptual breakdown addressing your dilemma with Maimonides on sacrifice, using your "fading-crutch" vs. "permanent-scaffold" distinction:

  ### (a) Why *Guide 3:32* suggests a "fading-crutch" reading  
  Maimonides’ medical analogy frames sacrifice as a *temporary intervention* for a specific pathology: idolatrous habits. Just as a physician phases out treatments once health is restored, the implication is that sacrifices should cease once humanity evolves beyond needing tangible rituals (e.g., when idolatry is eradicated and intellectual worship becomes natural). His "shock" analogy—abolishing prayer today—implies that practices rooted in historical contingency are dispensable when spiritual maturity is achieved. Sacrifices here appear *instrumental*, not intrinsic: their value lies solely in transitioning minds away from idolatry. If the goal is pure contemplation of God, the scaffold should logically vanish once its purpose (weaning) is complete.

  ### (b) Why *Mishneh Torah* demands a "permanent-scaffold" reading  
  The assertion that sacrifices will resume eternally in the Messianic era frames them as *constitutive elements* of the Torah’s perfected order. Maimonides emphasizes that "this Torah, its statutes and laws, are everlasting" —sacrifices are included in this immutable framework. This positions sacrifice not as a concession to be transcended, but as an enduring *form* of divine service, integral to the ideal covenantal relationship. Even in a perfected society, the Torah’s concrete rituals remain binding. Sacrifices here are not transitional tools but *permanent fixtures* of worship, suggesting they fulfill an abiding human or theological need beyond combating idolatry.

  ### (c) Assessing the "permanent-scaffold" resolution: Partial success with lingering tension  
  The distinction *dissolves the contradiction* by redefining sacrifice’s purpose:  
  - **Success**: Sacrifices have a dual rationale. Initially, they *did* wean Israel off idolatry (fading-crutch function), but they *also* serve a timeless role: providing a structured, sensory channel for devotion that accommodates permanent human limitations (permanent scaffold). Even perfected humans remain embodied beings requiring ritual expression alongside intellectual worship. The scaffold persists not because it’s "second-best," but because it’s *optimally suited* to human nature as such. Removing it would destabilize the Torah’s holistic system (as prayer might today).  

  - **Lingering tension**: This still implies God *eternally accommodates* human frailty rather than elevating us to pure spirituality. Maimonides’ Platonic leanings (valuing contemplation over action) make this uneasy: if intellectual worship is supreme, why retain "lower" rituals *forever*? Yet his legal realism concedes that embodied humans *always* need ritual anchors. The tension isn’t logical but philosophical: Must the ideal state retain concessions? For Maimonides, yes—because Torah is designed for *actual* humans, not abstract intellects. The "embarrassment" is mitigated by recognizing that the scaffold isn’t "second-best" but *wisely adapted* to eternal human constraints.  

  **Summary:** Maimonides can consistently uphold sacrifice as a permanent scaffold by affirming its dual role—temporarily combatting idolatry *and* perpetually serving as an embodied ritual necessary for humanity’s enduring psychophysical nature, even in the ideal state.
