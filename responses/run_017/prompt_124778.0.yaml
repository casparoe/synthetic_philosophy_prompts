  Here’s a sestina grappling with the species problem, adhering strictly to your constraints and aiming for philosophical accuracy. The end-words rotate through the stanzas, each attempting to embody a different perspective before yielding to the next, culminating in the crowded, unresolved envoy.

  **Sestina: On Delimiting**

  1.  
  Darwin saw the shifting term, a mere convenience, **species** –  
  No deep essence marks the border, just degrees along the **lineage**.  
  Where is the necessary, sharp, defining **barrier**?  
  The fertile offspring test applies, yet fails the sterile **hybrid**,  
  And "variety" blurs distinction – an unstable **kind**  
  Of grouping, held by practice, lacking more than just a **name**.

  2.  
  But Mayr insisted: look to sex! The key's the **barrier**  
  Against free flow of genes between populations. This **kind**  
  Of isolation defines the unit – not mere shared **name**  
  Or similarity. The group that *interbreeds*: a **species**.  
  Its edges sharp where gametes refuse to meet the **hybrid**,  
  Reproductively distinct along the branching **lineage**.

  3.  
  A different claim: each unit is an Individual, a **lineage**  
  With birth (speciation's cut), and death (extinction). This **kind**  
  Of entity persists as one, its organisms parts, not **name**-  
  -bearers of a class. No laws apply to singular **species**,  
  Born unique and bound to time. What breaks? What forms a **barrier**?  
  The part is not the whole, unlike the fertile **hybrid**.

  4.  
  The cladist sharpens focus: see the branch! The **lineage**  
  Segment between splits, defined solely by its branching **name**.  
  Ancestor ceases *being* when the cladogenesis **barrier**  
  Is crossed. The daughter starts anew. Is this the true **species**?  
  But where, precisely, does the parent end? What marks the **kind**  
  Of rupture that dissolves the old? A ghostly **hybrid** state?

  5.  
  Then chaos blooms: where sex dissolves, no test, no **barrier**  
  Remains for clones that bud and split. A tangled, messy **lineage**,  
  Defying isolation's rule. Horizonal transfer mocks the **kind**  
  Of purity Mayr sought. What unit binds them? Just a **name**  
  Assigned for use, not nature's joint. Is this a **species**?  
  Or just a cloud of replicants, a shifting, vast **hybrid**?

  6.  
  Consider rings: where A meets B, and B meets C, a **hybrid**  
  Zone may form, yet A and C refuse. No clear internal **barrier**,  
  But "same as" fails transitivity – it cannot mark the **kind**  
  Required for a natural class. The continuous **lineage**  
  Around the mountain won't submit. What justifies the **name**  
  Of separate units? Where, precisely, splits the **species**?

  **Envoy:**  
  The drawer holds specimens: pinned **hybrid**, ring, clone, **barrier**  
  Or none? Each claim – **lineage**, **kind**, **species** – crowds the fractured **name**.  
  No crown fits all. The seminar must close. The problem stands.

