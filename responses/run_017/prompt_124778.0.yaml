      *   **Stanza 4:** Phylogenetic Species Concept / Hennig - `lineage` segment, `name` tied to branching, ancestral cessation at `barrier`, `species` defined by splits.
      *   **Stanza 5:** Challenges (Asexuality/HGT) - `barrier` absent, messy `lineage`, `kind` defied, `name` arbitrary, `species` questioned, `hybrid` concept irrelevant/morphing.
      *   **Stanza 6:** Challenges (Ring Species) - `hybrid` zones, lack of internal `barrier`, failure of `kind` logic, continuous `lineage`, `name` problematic, `species` boundary elusive.
  3.  **Accuracy:**
