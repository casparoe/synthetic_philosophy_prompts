  5.  **No Forced Rhyme:** Strictly unrhymed end-words. Lines focus on clarity and argument.
  6.  **Closing Image:** The "drawer holds specimens" evokes the museum drawer (pinned `hybrid`, ring, clone), a concrete manifestation of the abstract problem and the need for practical `name`s despite theoretical uncertainty.
