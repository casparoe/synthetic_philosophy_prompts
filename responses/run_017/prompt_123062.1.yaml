prompt: |-
  Hey — I'm running a 90-minute session for our grad reading group next week, about 14 people, mostly philosophers but a couple of ML PhD students, and I want them to feel the pull of treating sentience and moral status as a matter of degree rather than an on/off switch: ants, a single bee, a crayfish, a chatbot, a houseplant, a thermostat-style negative-feedback controller. Can you design a runnable activity for that?

  Constraints: no lecture up front and don't name the view until afterwards; nothing anyone has to look up, so describe each candidate system in a sentence and don't lean on any empirical claim we'd need to check; and real but tiny stakes that they actually pay in the room, no money and no phones.

  What I'm after is them building the scale themselves and only noticing where they've ended up: something that forces them to set exchange rates, like how many bees is one pig, and then actually apply those rates in trades they don't like, so that any smooth ordering turns out to commit them to something while any cutoff starts to look arbitrary.

  I'd also really like them to run into the bit I keep geting stuck on, rather than being told it: cases where how much experience there is and how many subjects there are come apart. Say a mind that's run in short episodes with memory wiped between them, so the very same momentary phenomenology could be one long life or an enormous number of tiny ones, and the total moral weight swings wildly depending on which thing you count.

  Then give me a debrief that maps what actually happened in the room onto the moving parts of the idea, what will predictably go wrong the first time I run it and how to handle it, and a frank note on what the exercise can't reproduce. My worry is that everything they do is compatible both with there being a real continuum out there and with us just being ignorant about a sharp line somewhere, so the activity might only regiment their third-personal guesses and never touch the part that actually matters.
