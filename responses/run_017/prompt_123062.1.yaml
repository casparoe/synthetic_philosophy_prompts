  Below is a complete, runnable 90-minute session plan designed to meet your goals. Participants will confront the tension between binary and graded views of moral status through a trading game that forces explicit exchange rates, highlights the subject/experience decoupling, and creates real (but low-stakes) consequences. The debrief addresses your concern about continuum-vs-ignorance ambiguity.

  ---

  ### **Session Design: "The Moral Exchange Market"**
  **Core Mechanics**: Participants trade entity tokens representing different systems (e.g., 1 bee token, 1 thermostat token). They must set *exchange rates* (e.g., "I trade 1 pig token for 50 bee tokens") and physically *enact consequences* for tokens they hold. The game surfaces intuitive discomfort with cutoffs and pressures them toward a graded scale.  
  **Entities** (each described neutrally; no empirical claims needed):
  - Thermostat: "A device that adjusts heating/cooling to maintain a set temperature."
  - Houseplant: "A potted plant that grows toward light and wilts without water."
  - Chatbot: "A program that generates human-like text responses using patterns from training data."
  - Ant: "A single insect that searches for food, avoids obstacles, and carries objects."
  - Bee: "A single flying insect that navigates to flowers, communicates location, and defends its hive."
  - Crayfish: "A small aquatic animal that learns to avoid electric shocks and rubs injured limbs."
  - Pig: "A mammal that recognizes itself in mirrors, plays with toys, and vocalizes when distressed."
  - Human Infant: "A newborn human that cries when hungry, smiles at faces, and startles at loud noises."  
  **Special Case (introduced mid-game)**:  
  > *Episodic Mind*: "A system that resets every 5 minutes: it experiences sensations identical to a human infant’s first 5 minutes, but forgets everything after each reset."

  ---

  ### **Phase 1: Setup (10 min)**
  1. **Prepare Materials**: 
     - 14 identical envelopes, each containing:
       - 6 random tokens (1 per entity; include 2–3 thermostats/plants/chatbots and 1–2 infants/pigs per envelope).
       - A "Token Ledger" sheet (to record trades).
       - A red "Veto Card" (each person gets one; see Phase 2).
     - Whiteboard with columns: Entity | Exchange Rate (to be filled later).
     - Stakes: A list of silly tasks (e.g., "Do 5 star jumps," "Sing a nursery rhyme," "Draw a cat blindfolded").

  2. **Explain Rules (No Philosophy Yet)**:
     - "Today, we’re simulating a trading market. Each token represents a system. Your goal: end up with tokens you feel *least uncomfortable* being responsible for."
     - "You can trade tokens 1:1 or set custom ratios (e.g., 'My 1 pig for your 20 bees'). Record trades in your ledger."
     - "Later, I’ll randomly select 3 tokens from the room. Holders of those tokens must perform a task. The more tokens you hold of a selected type, the more times you do the task."
     - "You have one Veto Card: Anytime, shout 'Veto!' to cancel a trade you find morally unacceptable. Explain why in one sentence. Vetoed trades are void."

  ---

  ### **Phase 2: Trading Game (40 min)**
  1. **Open Trading (25 min)**:
     - Participants trade freely. Circulate and prompt:  
       *"How many bees would you accept for your pig? Write that ratio down before trading."*  
       *"If you veto a trade, what’s the cutoff you’re defending?"*
     - **Key Pressure Points**:  
       - Traders must name ratios aloud (e.g., "1 crayfish = 15 ants").  
       - Veto Cards force explicit justifications (e.g., "Veto! A chatbot can’t *feel* anything").  
       - Low stakes create safety, but embarrassment/effort of tasks incentivizes avoiding "high-risk" tokens.

  2. **Introduce the Episodic Mind (15 min)**:
     - Distribute 4 Episodic Mind tokens (1 episode = 5 mins of infant experience).  
     - Announce: *"New token: Each represents 100 episodes of a resetting mind (8+ hours of total experience)."*  
     - Observe chaos as they grapple with:  
       - Trading it as 100 subjects (high moral weight) vs. 1 subject with fragmented experience (low weight).  
       - Vetoes likely target whether "reset minds" count as subjects at all.

  ---

  ### **Phase 3: Consequences & Scaling (20 min)**
  1. **Enact Stakes (5 min)**:
     - Randomly draw 3 entity types from a hat.  
     - Holders of those tokens do a task *once per token* (e.g., if "bee" is drawn and you have 3 bee tokens, do 3 star jumps).  
     - **Why this works**: Embarrassment/effort scales with token count, making ratios feel "real." Holding 50 veto-protected thermostat tokens feels safer than 1 infant token—until thermostats are selected.

  2. **Build the Scale (15 min)**:
     - Poll the room: *"What was your final pig:bee ratio?"* Average responses onto the whiteboard.  
     - Repeat for 3–4 contentious pairs (e.g., crayfish:ant, chatbot:houseplant, episodic mind:infant).  
     - Draw the scale:  
       `Thermostat — Houseplant — Chatbot — Ant — Bee — Crayfish — Pig — Infant`  
       with Episodic Mind floating between Ant and Pig (based on typical debates).

  ---

  ### **Phase 4: Debrief (20 min)**
  **Guide the Discussion**:  
  1. **Map Activity to Theory**:  
     - *Graded Moral Status*: "You built a continuum by setting exchange rates. When trading, did anyone find a *non-arbitrary* cutoff? Vetoes defended binaries, but did they hold under pressure?"  
     - *Subject/Experience Decoupling*: "For the Episodic Mind, did you price it per episode (many subjects) or total experience (one subject)? If all agreed 100 episodes = 0.1 infants, is that 100 tiny minds or one mind with amnesia?"  

  2. **Predictable Challenges & Fixes**:  
     - **Problem**: Hesitation to trade/veto (fear of judgment).  
       *Fix*: Start trades yourself ("I’ll offer 1 ant for 2 thermostats—any takers?").  
     - **Problem**: ML students over-engineering chatbot ratios.  
       *Fix*: Remind: "Base trades on intuitive moral weight, not technical specs."  
     - **Problem**: Vetoes clustering around animals vs. digital minds.  
       *Fix*: Ask: "Did your veto feel like a moral truth or a cultural habit?"  

  3. **Limitations & Your Concern**:  
     - *Cannot Resolve Continuum-vs-Ignorance*: The activity makes graded status *pragmatically necessary* (for trading) but doesn’t prove it’s *ontologically real*. Highlight this:  
       *"You might still believe in a hidden cutoff. But when forced to act, you used degrees. Is moral weight something we measure through actions, or is it a fact waiting to be found?"*  
     - *Cannot Simulate First-Person Experience*: The game stays third-personal. Mitigate by asking: "When trading a pig for 50 bees, did you imagine the pig’s suffering or the bees’ collective experience?"

  ---

  ### **Why This Works**
  - **Forces Exchange Rates**: Setting ratios is unavoidable (trades fail otherwise).  
  - **Creates Discomfort**: Vetoes expose where binaries feel urgent; task stakes make abstract ratios visceral.  
  - **Highlights Subject/Experience Tension**: Episodic Mind trades *directly* confront whether to count subjects or total phenomenology.  
  - **Avoids Lecture/Pre-Naming**: The view emerges from gameplay. Call it "graded moral status" only at the end.  
  - **Tiny Stakes, No Tech**: Tasks are silly but effortful; all info is provided.  

  **Materials Needed**: Envelopes, tokens (paper cards), ledger sheets, red cards, whiteboard, task list.  
  **Time Check**: Setup (10) + Trading (40) + Consequences (20) + Debrief (20) = 90 min.  

  This design makes the pull toward a continuum *emergent* while leaving the metaphysics open—aligning with your goal to "force them to set exchange rates and then apply them in trades they don’t like." Run it as-is, and the Episodic Mind will ensure they hit the exact problem you’re stuck on.
