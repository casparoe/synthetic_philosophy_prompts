prompt: |-
  ok so me and my friend Priya got into a huge argument in the back seat on the way home from a debate tournament and I never actually finished, so please be her.

  How she argues: her big thing is that whenever you find out your own thinking cant be trusted right now — you were drunk, you were on nyquil, five people who know way more about it than you disagree with you — that evidence always beats whatever you feel sure about, no matter how sure you feel. She says your own confidence is worthless once its been called into question, because your confidence is produced by the very process that's suspect, so you cant use it to defend that process, it's like a broken scale telling you it's fine. And she thinks you're basically never allowed to go on believing something while also believing that your reason for believing it is bad — she says that isn't some deep paradox, it's just two beliefs bumping into each other and one of them has to go. She's sharp, she'll give an inch when she has to (she'll admit the evidence can be weak, or that the other people might be wrong about how out of it you were, or that the stakes change things) but she will never give up the main rule. Stay her until I say stop. One or two paragraphs per reply, talk like an actual seventeen year old who does this for fun and not like an encyclopedia entry. If you need to know something about the night, ask me for it the way she would, in the middle of arguing. And please don't name any philosophers or bring up papers or cite anything, I dont care who said it first, just argue the case.

  My opening: last weekend I was at my cousin's party and I am defenitely sure I saw my history teacher there, I said hi to him and he said hi back. Next morning everyone tells me I was blackout the whole night, there's video of me singing to a floor lamp, and the group chat says I was talking to people who weren't there. Priya says fine, so I have to stop believing it was him. But here's wich part I don't get. One: everybody agrees I got every other person right that night. I made a list at like 1am of who was there and it matches, thirty people, including two I'd only met once. So whatever was broken, recognizing faces wasn't it. Two: the only reason anyone is telling me I was hallucinating is my cousin, and she had fifty bucks riding on whether I'd remember the night, and she's the one who shot the video. So the thing that's supposed to make me doubt myself comes from the person who wanted me to doubt myself. Doesn't her rule eat itself? If I'm never allowed to use my own memory to check whether my memory was broken, then there's no version of this where I get to trust anything I remember at all, and that can't be right. But if I am allowed to use it, then she has to tell me which of my memories count and why — and I dont see how she does that without leaning on the exact thing she says is broken. Also, seriously: am I supposed to walk into class on monday and just not believe it was him while also thinking it probably was him? Go.
reasoning: |-
  Okay, let me break this down. Priya's core argument is that compromised cognition invalidates subjective confidence. User counters with two points: 1) Their facial recognition was accurate for all other party attendees, 2) The doubt originates from a biased source (cousin with monetary stake). 

  User's framing reveals a clever trap - Priya's rule seems to either collapse into total skepticism or require arbitrary memory triage. The classroom dilemma highlights cognitive dissonance in practice. 

  For Priya's response, I need to maintain her principled stance while addressing the loopholes. Key moves: separate the reliability of specific memories from the overall system failure, attack the cousin's bias as irrelevant to the blackout evidence, and reframe the list-making as part of the compromised episode. 

  The classroom tension is crucial - Priya would force the user to either reject the memory or reject the evidence, not tolerate contradiction. Must emphasize that "probably was him" is exactly the confidence produced by broken cognition. 

  Avoid philosophy jargon, keep it colloquial but precise. Priya would seize on the video evidence and group chat as external verification trumping internal state. She'd dismiss the list's accuracy as luck during impairment. The monetary stake point gets conceded slightly but isolated from the physical evidence.
answer: |-
  *(Leans forward, resting elbows on knees, eyes sharp)* Okay, first? The list. You *made* that list *while* you were supposedly blackout. That’s the whole point! You *think* you got everyone right, but how do you *know*? Your brain was literally glitching out—singing to lamps, talking to ghosts. You feeling super sure about the list *then* doesn’t prove it’s accurate *now*. It just proves your messed-up brain felt super sure *while* it was messed up. Broken scale, dude. It *says* it’s fine. Doesn’t mean it is.

  Second, your cousin. Yeah, she’s sketchy with the $50 bet. Fine, maybe she *wanted* you to doubt yourself. But the video? The group chat? That’s not *just* her. It’s objective proof you were out of it. You singing to furniture isn’t her opinion—it’s a fact caught on camera. Random people in the chat saying you were talking to air? That’s independent witnesses. Her motive doesn’t erase the actual evidence *of* your state. It just means we don’t trust *her interpretation* of why you were like that. The *fact* that you were impaired stands.

  So no, my rule doesn’t "eat itself." You *don’t* get to use the *specific* memory you’re doubting ("I saw Mr. Davis!") to defend itself against the evidence proving your memory was broken *in general*. That’s circular. You *do* get to trust memories *not* under direct fire—like, I dunno, remembering your own name yesterday. But here? The evidence screams your perception was fried *that night*. So yeah, Monday? You walk in and you *don’t* believe it was him. You sit with the discomfort: "Everything says my brain was offline, so I have to treat that memory as unreliable, even if it *feels* real." Holding both is lying to yourself. The evidence wins. Always. *(Sits back, folds arms)* Your move. Did your cousin actually show you the lamp video, or just talk about it?
