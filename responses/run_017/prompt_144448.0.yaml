answer: |-
  ### Activity Design: Roommate Decoration Dilemma  
  **Scenario:** Two roommates (Citizen 1 and Citizen 2) must rank three decorations for their shared apartment:  
  - **A**: Modern art print  
  - **B**: Landscape painting  
  - **C**: Band poster  

  **Rules for Planners:**  
  - **Pair Rule:** The ranking must respect each citizen’s stated order for their assigned pair:  
    - Citizen 1 controls {A, B} (relative ranking of modern art vs. landscape).  
    - Citizen 2 controls {B, C} (relative ranking of landscape vs. band poster).  
  - **Unanimity Rule:** If both citizens prefer one decoration over another, the ranking must respect that.  
  - Planners must create a complete, strict ranking (no ties) of A, B, C that satisfies both rules.  

  **Materials:**  
  - **Cards** (one set per table per round; text below).  
  - **Tokens:** 2 tokens for top choice in social ranking, 1 token for second choice, 0 for third (awarded only if a valid ranking exists).  
  - **Rule sheets** (printed for planners; summarizes rules neutrally).  

  **Setup (10 min):**  
  - Arrange 6 tables of 3 students. Assign roles: two citizens, one planner.  
  - Explain the scenario and rules without technical terms. Emphasize:  
    - "The planner must create a single ranking that obeys the Pair Rule for each citizen’s assigned pair and the Unanimity Rule."  
    - "Citizens get tokens based on how high their *personal* top choice ranks in the *social* ranking."  
  - Hand out role cards and rule sheets.  

  ---

  ### Rounds (55 min total)  
  **Round 1: Parochial Preferences (15 min)**  
  - *Goal:* Show consistency when preferences are confined to "own" pair.  
  - **Citizen 1 Card:** "Your ranking: **A > B > C** (You control {A, B}: tell planner **A > B**).  
    *Reason:* Prefers modern art; indifferent to band poster."  
  - **Citizen 2 Card:** "Your ranking: **B > C > A** (You control {B, C}: tell planner **B > C**).  
    *Reason:* Prefers landscape; indifferent to modern art."  
  - **Planner Task:** Build ranking.  
  - *Expected Outcome:* A > B > C works (satisfies A>B, B>C; no unanimous preferences beyond these).  
  - **Token Payoff:** Planner awards tokens after successful ranking.  
  - **Rotate Roles:** Planner ➜ Citizen 1, Citizen 1 ➜ Citizen 2, Citizen 2 ➜ Planner.  

  **Round 2: Nosy Preferences (15 min)**  
  - *Goal:* Trigger impossibility via ordinary "nosy" motives.  
  - **Citizen 1 Card:** "Your ranking: **B > A > C** (You control {A, B}: tell planner **B > A**).  
    *Reason:* "Landscape is calming, but I *hate* band posters—they make the room look cheap. If the band poster is an option, I’ll take the landscape over modern art to avoid it."  
  - **Citizen 2 Card:** "Your ranking: **A > C > B** (You control {B, C}: tell planner **C > B**).  
    *Reason:* "Modern art is classy, but landscapes are boring. I’d rather see the band poster than the landscape—it shows we’re fun!"  
  - **Planner Task:** Build ranking.  
  - *Expected Outcome:*  
    - Pair Rules: B > A (from C1) and C > B (from C2) imply C > B > A.  
    - Unanimity: Both prefer A > C (C1: A > C; C2: A > C) ➜ requires A > C.  
    - **Contradiction:** C > A (from transitivity) vs. A > C (unanimity). No valid ranking possible.  
  - **Token Payoff:** None (no valid ranking).  
  - **Rotate Roles:** Same as above.  

  **Round 3: Waiving Rights (25 min)**  
  - *Goal:* Restore consistency by trading/waiving rights, but at a cost.  
  - **Same cards as Round 2.**  
  - **New Rule:** Before revealing preferences, citizens can negotiate to waive their Pair Rule control.  
    - "If you waive, the planner ignores your Pair Rule. You can trade (e.g., ‘I’ll waive if you waive’) or waive unilaterally."  
  - **Planner Task:** Build ranking with active Pair Rules only.  
  - *Expected Outcomes:*  
    - **No waiver:** Same impossibility as Round 2 (no tokens).  
    - **Citizen 2 waives:** Planner sets A > C > B (satisfies C1’s B > A and unanimity A > C).  
      - Tokens: C1 gets 1 (A is 1st in social, but their top was B); C2 gets 2 (A is 1st, their top).  
    - **Both waive:** Planner sets A > C > B or A > B > C (satisfies only unanimity A > C).  
      - Tokens: C1 gets 1 (A is 1st; their top B is 2nd); C2 gets 2 (A is 1st).  
  - **Key Insight:** Waiving restores consistency, but Citizen 1 (who dislikes the band poster) loses more.  

  ---

  ### Debrief (10 min)  
  1. **Map Game to Concepts:**  
     - "Pair Rule" = Individual’s **decisiveness over a personal pair** (like a "right" to control part of the outcome).  
     - "Unanimity Rule" = **Pareto principle** (if everyone agrees, society must follow).  
     - Round 2 contradiction = **Transitivity conflict** (Pair Rules forced C > A; Unanimity forced A > C).  
     - Nosiness = Preferences over others’ "pairs" are **ordinary** (e.g., caring about room aesthetics).  

  2. **Normative Discussion:**  
     - "When people care about others’ choices (nosiness), rights and unanimity clash. Is this a problem with:  
       - The *rules* (rights vs. unanimity can’t coexist)?  
       - The *preferences* (should we ignore ‘nosy’ motives)?"  
     - Highlight: Waiving "solves" the clash but forces trade-offs—**rights become conditional**.  

  3. **Predictable Issues & Fixes:**  
     - **Students rewrite cards:** Remind them cards are fixed; preferences are given.  
     - **Groups finish fast/slow:** Use a timer; if stuck in Round 2, ask, "Can you satisfy all rules? If not, why?"  
     - "**Majority voting fix!**" Note: Majority may violate Pair Rules (e.g., if most prefer A > B, but C1 controls it).  
     - "**Nosy citizen is cheating!**" Explain: Nosiness is allowed; real people care about others’ choices.  
     - **Gaps:** Activity shows *one* nosy profile; the theorem proves *no system* avoids this for *all* profiles. Also, "decisiveness over a pair" is a thin notion of "rights"—does it capture freedom?  

  ---

  ### Verdict on the Claim  
  The activity confirms that nosy preferences are ordinary (e.g., caring about shared spaces) and trigger the contradiction. Domain restriction "solves" the problem but assumes away realistic motives, weakening the notion of rights. The result *does* expose a normative tension between rights and unanimity.  

  **Confident Elements:**  
  - Rounds 1 and 2 cleanly show consistency/impossibility.  
  - Waiving in Round 3 reveals trade-offs.  
  - Scenario and motives are relatable.  

  **Guesses to Test:**  
  - Token incentives may need tweaking if students undervalue "second choice."  
  - Negotiation in Round 3 might drift; provide a timer and scripted waiver options (e.g., "Waive? Yes/No").  

  \answer{Nosy preferences are ordinary; the tension is normative.}
