  The key application domains they care about are mature scientific literature, generative model outputs, and forecasting portfolios. This suggests the real-world stakes involve group epistemology and practical usability of imperfect knowledge systems. Their candidate questions center on disanalogies between paradox types, group-level dynamics, diachronic aspects, logical structure, granularity, and scoring rules.

