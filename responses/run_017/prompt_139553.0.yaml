prompt: |-
  I work mainly in moral philosophy, but for the past two years I have sat on a university committee that hears complaints, and the experience has pushed me into a corner of epistemology I was never trained in. I keep encountering the same configuration and I have no word for it. Three instances. First: I form a confident view about what happened in a case from the four or five people who were willing to speak to me; only later do I learn that the people with the opposite story had every reason to stay silent, so that the pool of testimony I drew on was filtered by the world rather than by me. Nothing I was told has been shown false, and I do not think I reasoned badly about what I heard — yet I now take myself to be required to be substantially less confident. Second: in my other life I work on a 1930s philosopher's unpublished correspondence. For years the letters I could read were the ones a single executor chose to deposit, and I formed views about her religious commitments on that basis. When the remaining boxes surfaced my confidence collapsed, but not because any letter turned out to be forged or because I had misread them: it collapsed because I learned that what I had was a truncated sample of a larger set I could not see, and truncated in a direction. Third, the mirror image: a senior colleague I trust has silently pre-filtered a literature for me and passed on only what she judged methodologically sound. Here I do not take myself to be permitted to be *more* confident than the papers themselves warrant, even though her filtering is, structurally, just as much a fact about the provenance of my evidence as in the first case.

  What I want is not a label to drop but a distinction I could use in print, so please carve rather than name. The thing I am gesturing at sits near several established notions without, as far as I can tell, coinciding with any of them. It is not a rebutting defeater: I acquire no evidence that the proposition is false. It does not look like an undercutting defeater either: each letter still supports the claim about the philosopher's beliefs exactly as strongly as it did before. It is not epistemic akrasia as I have seen that discussed, since I am not left believing that p while believing that my evidence fails to support p — I fully accept that my evidence supports p; what I have learned is that my evidence is probably not the whole of the evidence there is. And it is not confirmation bias or selective exposure, since in my cases the truncation is not something I did. The nearest candidates I can think of are the requirement of total evidence (Carnap's, I believe — correct me if the attribution is wrong), which seems to state a norm rather than name the failure mode; the statistician's notion of a biased sample, which is about estimators rather than about what I should believe; and the epistemologists' category of higher-order evidence, which in my reading of it is mostly about defects in one's own processing or about disagreement with others, whereas my cases concern defects in what the world handed me — and which seem to generate none of the puzzles that literature trades in, precisely because the new fact can apparently be treated as ordinary first-order evidence about the likely existence of unobserved counter-evidence.

  So: does this configuration have an established name of its own, and is it classified as a species of higher-order evidence, as a form of defeat, or as something else entirely? If it has no name, coin one, define it, and give me its boundary cases. In particular I need answers to three question I cannot settle myself: whether the phenomenon requires me to know the direction of the bias, or whether merely knowing that my sample is unrepresentative suffices; whether the rational mandate lands on my first-order credence at all, or only on some higher-order attitude about the completeness of my evidence base; and why, if at all, the negative and positive cases come apart. I am not after a reading list or references — I want the distinction itself, sharpened to the point where I could state it in a paragraph and defend its edges in a footnote.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a moral philosopher who's been working on a university complaints committee and dealing with unpublished correspondence. The core issue is this epistemic situation where their confidence in a belief changes not because of new evidence against the belief, but because they learn their existing evidence was incomplete or filtered. 

  First, I need to figure out the exact problem. They mention three cases: one with testimony filtered by others' silence, another with selectively archived letters, and a third where a colleague pre-filters literature. The key is that the evidence itself isn't disproven, but its incompleteness undermines confidence. They've ruled out standard epistemic concepts like defeaters or akrasia, so I need to find or create a new distinction.

  Looking at their rejected concepts helps. It's not rebutting or undercutting defeaters because the truth of the proposition isn't challenged, and the support from each piece of evidence remains. It's not akrasia because they still believe the evidence supports the claim, but recognize it's incomplete. Also, it's not about their own bias but external filtering.

  The user needs a sharp distinction for publication, not just a label. They want to clarify whether knowing the bias direction is necessary, how it affects first-order credence, and why positive filtering (like the colleague's literature) doesn't boost confidence like the negative cases reduce it.

  I recall Carnap's requirement of total evidence, but that's a norm, not a failure mode. Statistical biased samples focus on estimators, not belief. Higher-order evidence usually involves cognitive defects or peer disagreement, whereas here it's about the evidence set's provenance.

  Hmm, maybe they need a concept that ties the provenance of evidence to its representativeness. The critical point is learning that the evidence pool is non-representative due to external filtering. For the positive case (colleague's filtering), why doesn't it increase confidence? Because representativeness affects reliability; knowing someone else filtered for quality doesn't make the evidence stronger, it just means what's there is sound, but you still need to evaluate it based on what's presented. Whereas knowing about missing counter-evidence directly impacts the likelihood that the current evidence is misleading.

  So, the distinction could be between the evidence's internal support and its external reliability based on provenance. The key is the meta-information about the evidence set's completeness and how it was formed. 

  For the three questions: 
  1. Direction of bias: Even without direction, knowing the sample is unrepresentative should reduce confidence because you can't assess the risk. But knowing the direction specifies what's missing, making the threat clearer.
  2. Rational mandate: It directly affects first-order credence because the risk of counter-evidence changes the probability that the current evidence is misleading. Higher-order awareness alone isn't sufficient; you must adjust your belief.
  3. Asymmetry in positive vs. negative: Negative filtering introduces unknown counter-evidence, increasing error risk. Positive filtering (for quality) doesn't add evidence; it just assures the existing evidence is reliable, but doesn't claim completeness. Hence, no boost in confidence beyond the evidence's face value.

  I think coining a term like "Provenance-Induced Evidence Restriction" (PIER) could work. Defining it as meta-information indicating the evidence set is non-representative due to external filtering. Boundaries would include cases where filtering is random (no impact) versus biased (requires adjustment). The distinction lies in how the external filter's nature affects the evidence's reliability and completeness.
answer: |-
  Here is a sharpened conceptual distinction addressing your core epistemic phenomenon, designed for deployment in philosophical writing. It carves the phenomenon at its joints, answers your three questions, and differentiates it from neighboring concepts.

  ---

  ### **The Distinction: Provenance-Induced Evidence Restriction (PIER)**  
  **Definition:** *PIER occurs when an agent acquires meta-information revealing that their current evidence set \(E\) is non-representative of the total available evidence \(E_{total}\) due to external filtering mechanisms (e.g., self-censorship, archival bias, expert curation). Crucially, \(E\) remains internally consistent and unrebutted, but its *provenance* indicates it is a restricted subset skewed by factors orthogonal to truth-tracking.*

  #### **Boundaries & Key Features:**  
  1. **Not a defeater**:  
     - \(E\) still supports proposition \(p\) with unchanged strength.  
     - No new *first-order* evidence against \(p\) is introduced.  
  2. **Not higher-order evidence (HOE) in the standard sense**:  
     - HOE typically targets *cognitive reliability* (e.g., "I was drugged when assessing \(E\)").  
     - PIER targets *evidence-set reliability*: it reveals \(E\) was filtered by processes that may correlate with content (e.g., fear of reprisal, curator’s agenda).  
  3. **Distinct from selection bias**:  
     - Selection bias involves *agent-driven* filtering (e.g., seeking confirming data).  
     - PIER involves *externally imposed* filtering (e.g., witnesses silenced by power dynamics).  

  ---

  ### **Answers to Your Three Questions:**  
  1. **Direction of Bias**:  
     - **Knowing direction is NOT required to trigger PIER**.  
       - *Example*: Learning that "many letters were destroyed" suffices to undermine confidence in your assessment of the philosopher’s beliefs, even absent knowing *which* letters.  
       - *Rationale*: Non-representativity alone implies unquantified risk of counter-evidence. Direction merely specifies the risk’s valence (e.g., "destroyed letters opposed my hypothesis").  
     - *Boundary case*: If filtering was *random* (e.g., fire destroyed half the letters blindly), PIER does not apply—your \(E\) remains representative.  

  2. **Locus of Rational Mandate**:  
     - **PIER directly mandates revising first-order credence in \(p\)**.  
       - *Why*: The meta-information ("My \(E\) is incomplete and skewed") generates a new first-order consideration: "Unseen evidence likely exists that could alter \(p\)’s probability." This becomes part of your *total evidence for \(p\)*.  
       - *Contrast*: It is not solely about higher-order attitudes (e.g., "I shouldn’t trust my evidence-base"). You must lower credence in \(p\) because PIER *expands the space of possible evidence* unfavorably.  

  3. **Asymmetry (Negative vs. Positive Filtering)**:  
     - **Negative filtering (silenced witnesses, suppressed letters) reduces confidence; positive filtering (expert-curated papers) does NOT increase it**.  
       - *Reason*: Negative filtering reveals *omission of counter-evidence*, creating risk your \(E\) is misleadingly favorable. Positive filtering reveals only that *included evidence meets quality thresholds*, but does not imply *completeness* or absence of counter-evidence.  
       - *Mechanism*:  
         - **Negative case**: Learning of suppressed witnesses → "People with opposing views were excluded" → raises probability that \( \neg p \) is true.  
         - **Positive case**: Learning papers were vetted → "Included papers are reliable" → *no* inference that unvetted papers would support \(p\) (they might refute it). Thus, confidence stays bounded by \(E\)’s intrinsic strength.  

  ---

  ### **Defending the Edges (Footnotable Claims):**  
  - **Against HOE assimilation**: PIER is not about doubting your faculties (*processing defect*), but about doubting your evidence’s scope (*informational defect*). It generates no "level-splitting" paradoxes because it feeds into first-order probability assessments.  
  - **Against Carnap’s Requirement of Total Evidence**: Carnap’s norm ("use all available evidence") is prescriptive; PIER is a *descriptive failure mode* arising when compliance is thwarted by external forces.  
  - **Against statistical "biased sample"**: Statistics focuses on estimator properties; PIER explains why *rational belief* must be tempered even absent formal estimands.  

  ---

  ### **Summary for Deployment:**  
  > "In cases of *Provenance-Induced Evidence Restriction* (PIER), agents learn their evidence set \(E\) is non-representative due to external filtering (e.g., witness silencing, selective archiving). PIER obliges reduced confidence in \(p\)—even when \(E\) reliably supports \(p\) and no defeaters exist—because it reveals \(E\) likely omits relevant counter-evidence. Crucially, PIER applies asymmetrically: negative filtering (excluding counter-evidence) mandates lower credence, while positive filtering (curating for quality) does not raise credence beyond \(E\)’s intrinsic support, as it implies nothing about completeness."  

  This carves PIER as an epistemic constraint grounded in evidence provenance, distinct from defeat, bias, or HOE, with clear answers to your three puzzles. Its boundaries rest on the *externality* and *content-correlation* of the filter, and its asymmetry reflects the unique risk of concealed counter-evidence.
