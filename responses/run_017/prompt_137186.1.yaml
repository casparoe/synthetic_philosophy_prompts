prompt: |-
  Write me a parody, about 600 words, set out as numbered clauses, of the induction handbook for a drab back-office firm that hires temps for a single job: continuing a numerical series correctly. The new starter is shown 2, 4, 6, 8 and asked to go on.

  The humour has to come from the handbook's own inability to say what it's asking for, so each clause should try a different way of nailing down what makes a continuation correct and quietly give up on it. I'd want roughly: a clause that tries to define correctness by what the temp is disposed to answer; one that appeals to the rule the temp meant without ever managing to say which rule that is; one ruling that what a temp feels, pictures or inwardly says is not evidence and that there's no inner fact to consult; and, as the last substantive clause, one that settles for what a qualified assessor would agree to after a reasonable period of scrutiny. It must never admit that this has swapped correctness for assertibility, and it must never come out and say that there's no fact of the matter — it keeps talking as though there obviously is one while making it impossible to say what.

  Two more things I'd like worked in. Slip in the rival rule that agrees with addition for every pair of numbers below 64 and returns 5 for anything above, together with the policy that no run of past answers can distinguish it from adding, and that the handbook's own clauses are subject to the same difficulty as the series. And include a staffing rule that no temp may ever work a shift alone, since a lone worker cannot be certified as following any rule at all, even if they recieve a perfect audit.

  Deadpan HR voice throughout — appraisals, rotas, escalation, a grievance procedure that rules out appeals on the grounds that you meant something different. No naming of philosophers, no use of the word quus, no footnotes, no winking at the reader.
reasoning: |-
  We are writing a parody induction handbook for a temp agency that hires for continuing numerical series. The series given is 2,4,6,8 and the temp must continue it. The humor comes from the handbook's inability to define what the correct continuation is, while pretending there is an obvious fact of the matter.

   Requirements:
   - Use a deadpan HR voice: appraisals, rotas, escalation, grievance procedures.
   - Structure as numbered clauses.
   - Include:
     (a) A clause defining correctness by the temp's disposition to answer.
     (b) A clause appealing to the rule the temp "meant" without specifying it.
     (c) A clause ruling out inner states (feelings, pictures, inner speech) as evidence, and denying an inner fact.
     (d) A clause settling for what a qualified assessor would agree to after reasonable scrutiny (without admitting it's swapped correctness for assertibility).
   - Include the rival rule: adding until 64, then returning 5 for any number above, with the policy that past answers cannot distinguish it from adding. Also, the handbook's own clauses are subject to the same problem.
   - Staffing rule: no temp works alone because a lone worker cannot be certified as following any rule.

   We must never admit there's no fact of the matter. No philosophical jargon (like "quus"), no footnotes, no winking.

   Let's outline the clauses:

   1. Introduction: purpose of the handbook, the task.
   2. Clause (a): Dispositional approach (correctness by what the temp is disposed to answer).
   3. Clause (b): The rule the temp meant.
   4. Clause (c): Inner states are not evidence, no inner fact.
   5. Clause (d): Qualified assessor agreement after scrutiny (without admitting it's assertibility).
   6. The rival rule and its implications (without naming it as a rival, just as a policy about past answers and the handbook itself).
   7. Staffing rule: no lone workers.

   We'll write in the style of a corporate induction handbook, with HR jargon.

   Let's write:
answer: |-
  **TEMPORARY SERIES CONTINUATION AGENT INDUCTION HANDBOOK (v.7.3)**  

  1. **Purpose**: This handbook establishes the framework for executing Series Continuation Tasks (SCTs). Your core duty is to extend the sequence 2, 4, 6, 8 with appropriate numerical values. Compliance ensures alignment with organizational standards.  

  2. **Task Fulfillment Criteria**: Correct continuations reflect your intrinsic disposition to respond consistently under all operational conditions. If, across all hypothetical scenarios (e.g., varying times, fatigue levels, or workstation ergonomics), you would enter "10, 12, 14..." indefinitely, this confirms adherence. Deviations must be documented via Form D-9 (Dispositional Drift Report).  

  3. **Rule Adherence Verification**: Your continuation must match the rule you intended to apply upon initial task assignment. Should audit queries arise, you must articulate this rule retrospectively. Note: Ambiguity in articulation (e.g., "the obvious pattern") may trigger Performance Improvement Plan 7a ("Intent Clarification").  

  4. **Internal State Policy**: Subjective experiences (e.g., visualizing "+2," mental recitation of "even numbers," or affective certainty) are inadmissible as evidence during appraisals. Rule-following constitutes an externally verifiable behaviour; internal processes are exempt from audit under Section 4.5(c) (Non-Observables Clause).  

  5. **Assessment Protocol**: A continuation is ratified when a Tier 3 Certified Assessor, reviewing your output under standard lighting and after a 15-minute scrutiny period, attests to its validity. Assessor certification requires unanimous approval by the Continuation Oversight Panel. Challenges to assessments constitute misconduct (Grievance Procedure 2.1: "Irrebuttable Evaluation").  

  6. **Historical Precedence Policy**: Past continuations (e.g., "10, 12...62") cannot distinguish between valid rules and the "Capped Cumulative" rule (which yields identical outputs up to 64, then defaults to 5 thereafter). All handbook clauses are likewise subject to retrospective reinterpretation. Escalations alleging misapplication are governed by Policy R-3 ("Non-Retroactive Determinacy").  

  7. **Staffing Minimums**: No agent may undertake SCTs in isolation. Dual occupancy per workstation is mandatory to enable real-time peer validation (see: Collaborative Compliance Act). Solo work invalidates all outputs per Audit Statute 9, as individual intent cannot be cross-examined. Rotas violating this will incur immediate Productivity Suspension.  

  8. **Termination of Assignment**: Upon task completion, submit outputs via Portal Delta. Persistent deviation (>2% variance from Assessor verification) results in contract termination. Appeals claiming "I meant the correct rule" are inadmissible per Finality Clause 1 ("Post-Hoc Intent Nullification").  

  ---  
  *All policies herein are effective immediately and subject to reinterpretation by authorised assessors. Non-compliance may impact future assignments.*
