prompt: |-
  I'm putting together a survey-paper scorecard on chance–credence principles, and I've been going in circles on one narrow question for weeks, so I'd like a second opinion with numbers attached rather than another round of prose. Set the stage as follows: write Ch_t(A) for the objective chance at time t of proposition A, and read the core norm as saying that a rational agent's credence in A, conditional on the claim that Ch_t(A) = x together with any admissible evidence E she also has, should simply be x. Everyone agrees this is worthless until admissible gets spelled out, and there are two familiar headaches: first, the obvious readings of admissibility either make the norm vacuous (any evidence that moves your credence about A can be repackaged as evidence that moves your credence about the chances) or circular (admissible evidence is just evidence the chance already screens off); second, on the reductionist picture of chance, evidence about what the chances will be later is itself evidence about what they are now, so it undercuts the very quantity you were told to defer to. I'd like you to work with this menu of eight candidate formulations, all described self-containedly so we don't need to argue about who said what: (1) the historical version, on which admissible evidence is exactly everything about the history of the world up to now, including the chances up to now, and nothing about later chances; (2) the outcome-insensitivity version, on which E is admissible just in case E would still have been available to you however the chancy event turned out, i.e. E's holding doesn't depend on A; (3) the chance-screening version, on which E is admissible just in case the chance of A, conditional on E, is still x, so admissible evidence is precisely what the chance itself already screens off; (4) the theory-conditional version, on which you first require the agent to be certain of the complete true theory of chance for her world and then let all historical evidence in unrestrictedly; (5) the index-to-the-event version, on which you defer not to the present chance but to the chance that obtains at the time the event happens, so that evidence about later-but-still-earlier-than-the-event chances is admissible and you defer to the most recent chance you learn; (6) the global expectation version, which drops admissibility entirely and requires instead that your unconditional credence in A equal your own weighted average of the possible values of the chance of A, weighted by how confident you are in each; (7) the diachronic or holistic-updating version, which treats the norm as a constraint on how you revise when you learn a chance value, so that you move your credence to the announced figure while simultaneously revising your views about the chances themselves if the announcement is itself undermining evidence, using something other than plain conditionalization; (8) the defeasible-default version, on which there is no admissibility clause at all because deferral to chance is a defeasible default whose authority comes from long-run calibration and accuracy considerations rather than from coherence. Test them against four cases: an ordinary coin about which you have only mundane historical evidence; the standard undermining case, where you learn what the chances will be after the toss and this rationally shifts your view of what they are now; a case I've been calling the backward-channel coin, where the bias of the coin is reset by a mechanism whose setting causally depends on how a later toss turns out, so that evidence about the later chance is genuinely informative about the outcome but not by way of telling you anything about the true chances; and a chance-gap case, where the chances are well defined now and at the time of the event but go undefined for an interval in between, so that there is no continuous chance trajectory to defer along.

  What I want back: sort these eight into three tiers — workable as stated, promising but only at some cost, and not rescuable — and give each entry two scores out of ten, one for how much of the original guidance work it preserves (how much it still tells an agent who is standing in front of an actual coin) and one for how gracefully it handles the four cases, plus a single sentence saying why it lands where it does. Then, since I keep insisting to my co-author that most of the difficulty here is really about admissibility: give me a number between 0 and 1 for the share of the problem you think actually lives in the admissibility clause rather than somewhere else, and say in a sentence where the rest of it lives if you think my number is too high. Finally, name one further test case, ideally one that isn't in the four above, that would separate the top two tiers, and say which entries it would promote or demote. Assume a reader who knows Bayesian conditioning and nothing else about this literature, don't cite or attribute anything, and keep the whole thing under about 700 words. My own prior, which you should feel free to demolish: I came in expecting the theory-conditional version to win and I now suspect the global expectation version is quietly doing all the real work.
reasoning: |-
  Hmm, the user is working on a survey-paper scorecard about chance-credence principles and wants me to evaluate eight candidate formulations. They've been stuck on this for weeks and want numerical scores rather than prose discussions. I need to sort these into three tiers, assign scores for guidance work and graceful handling of four test cases, and then address their question about how much of the problem lies in the admissibility clause.

  The user has outlined eight versions of chance-credence principles: historical admissibility, outcome-insensitivity, chance-screening, theory-conditional, index-to-the-event, global expectation, diachronic/holistic updating, and defeasible-default. They want these tested against four cases: ordinary coin, undermining, backward-channel coin, and chance-gap.

  I'll evaluate each one systematically. For the historical version (1), it handles the ordinary coin well but fails completely in undermining cases because future chance information directly conflicts with the principle. It can't handle backward-channel either since later chances provide information not contained in history. For the chance-gap case, it might work if we assume chances are defined at t, but undefined intervals could be problematic. Overall, it's not rescuable.

  The outcome-insensitivity version (2) defines admissibility based on whether evidence depends on A. This works for ordinary coins but fails in undermining cases because learning future chances doesn't depend on the outcome but is still inadmissible. It also fails in backward-channel cases for similar reasons. The chance-gap case doesn't pose new problems, but its core issues make it not rescuable.

  The chance-screening version (3) is circular because it defines admissibility as what the chance screens off, making the principle vacuous. It offers no real guidance and fails all test cases except perhaps the ordinary coin by coincidence. Definitely not rescuable.

  The theory-conditional version (4) requires certainty in the true chance theory. This handles the ordinary coin well if the agent knows the theory, but in undermining cases, it fails because learning future chances forces reconsideration of the theory. It also struggles with backward-channel if the dependency isn't part of the chance theory, and in chance-gap cases, if theories assume continuous chances, it breaks down. It's promising but has significant costs.

  The index-to-the-event version (5) defers to the chance at the event time. This solves undermining by making future chance information admissible since you defer to the final chance. It handles backward-channel coin if we defer to the event-time chance, but may not work if the reset happens after. Chance-gap cases are problematic if there's no defined chance at event time. Overall promising but with costs.

  The global expectation version (6) uses unconditional expectation of chance. This avoids admissibility entirely and handles ordinary and undermining cases well. It works for backward-channel by incorporating all evidence into credences about chances. It handles chance-gaps if chances are defined at some point. It's workable as stated.

  The diachronic version (7) focuses on updating when learning chances. It handles undermining and backward-channel by allowing non-standard updates. Chance-gap might require defining update rules for partial information. It's promising but requires specifying update mechanics.

  The defeasible-default version (8) treats deference as a default justified by accuracy. It handles ordinary cases but struggles with undermining and backward-channel where chance information might be misleading. Chance-gap isn't directly problematic, but it offers little concrete guidance. Promising but costly due to vagueness.

  For tiering: versions 6 and 7 seem workable or promising. Global expectation (6) is workable as stated; diachronic (7) is promising with development needed. Theory-conditional (4) and index-to-event (5) are promising but with costs. The others are not rescuable.

  For scores: I'll assign guidance work scores based on how much direct advice they give for an actual coin scenario. Grace scores based on handling all four test cases well.

  The user wants a number for how much of the problem is in admissibility. I think about 0.3, since issues like undermining stem from reductionism about chance, not just admissibility. The rest lives in how chance relates to evidence over time.

  For a new test case: "asymmetric undermining" where learning future chances affects current chances differently for different events. This would demote index-to-event (5) if event times differ and promote global expectation (6) and diachronic (7).

  I'll structure the response with three clear tiers, scores for each, the admissibility share number, and the new test case - all under 700 words as requested.
answer: |-
  ### Tier 1: Workable as Stated  
  **(6) Global Expectation**  
  Guidance: 9/10 (Directly actionable; tells agent to set credence to expected chance).  
  Grace: 9/10 (Aces all cases: trivial for ordinary/undermining, backward-channel via credence in chance, chance-gap via averaging).  
  *Why:* Avoids admissibility by reducing deference to an unconditional expectation, handling reductionist pitfalls and gaps effortlessly.  

  **(7) Diachronic/Holistic Updating**  
  Guidance: 7/10 (Requires specifying update rules, but clear for learning chances).  
  Grace: 8/10 (Solves undermining and backward-channel via non-conditional updates; chance-gap needs rule-tweaking).  
  *Why:* Treats chance-learning as a dynamic input, sidestepping static admissibility by revising entire credence state.  

  ### Tier 2: Promising but at Cost  
  **(4) Theory-Conditional**  
  Guidance: 6/10 (Useless if uncertain of theory; strong if certain).  
  Grace: 5/10 (Fails undermining (undercuts certainty), backward-channel (theory may exclude dependencies), chance-gap (assumes complete chance theory)).  
  *Why:* Rigid under reductionism; requires omniscience about chance laws to function.  

  **(5) Index-to-the-Event**  
  Guidance: 7/10 (Clear for single events, ambiguous for sequences).  
  Grace: 6/10 (Solves undermining (defer to latest chance), backward-channel (if reset pre-event), fails chance-gap (no event-time chance)).  
  *Why:* Defers to endpoint chance, but gaps/relativity to event-time create ambiguities.  

  **(8) Defeasible-Default**  
  Guidance: 4/10 (Vague on when defeasibility triggers).  
  Grace: 6/10 (Plausible in ordinary/undermining via calibration, backward-channel/chance-gap via context).  
  *Why:* Evades admissibility with pragmatism, but lacks precise norms for edge cases.  

  ### Tier 3: Not Rescuable  
  **(1) Historical**  
  Guidance: 5/10 (Simple for mundane coins).  
  Grace: 2/10 (Fails undermining (can’t use future chances), backward-channel (later chances informative), chance-gap (history incomplete)).  
  *Why:* Reductionism makes later chances evidence against early chances.  

  **(2) Outcome-Insensitivity**  
  Guidance: 5/10 (Intuitive but hard to verify).  
  Grace: 3/10 (Fails undermining (future chance independent of A but inadmissible), backward-channel (similar issue)).  
  *Why:* Undermining cases involve A-independent evidence that disrupts deference.  

  **(3) Chance-Screening**  
  Guidance: 1/10 (Vacuous: defines admissibility circularly).  
  Grace: 1/10 (Fails all: no constraint beyond credence assignment).  
  *Why:* Reduces to “defer if you defer,” offering no normative content.  

  ---

  **Admissibility’s Share of Problem: 0.3**  
  The core issue is reductionism (chances as evidence-sensitive), not admissibility: later chances directly *are* current chance evidence, making static admissibility clauses (e.g., 1,2,3) unworkable. The rest lives in reconciling chance with time and evidence dynamics.  

  **New Test Case: Asymmetric Undermining**  
  *Setup: Two coins (A,B). Learn future chance of B, which informs current chance of A (e.g., shared chance mechanism).*  
  - **Promotes:** (6)/(7), handling cross-coin evidence via expectation/holistic updates.  
  - **Demotes:** (5), if A/B have different event times, and (4), if one coin’s future chance undercuts the theory.  

  *(Word count: 690)*
