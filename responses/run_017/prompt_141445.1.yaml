  ### Thought Experiment: The Correlated Demon

  **Scenario:**  
  A single-molecule gas (Szilard engine) is in thermal equilibrium at temperature \(T\) within a sealed box, partitioned into left and right halves. The demon starts with a memory device (e.g., a movable partition) that is perfectly correlated with the molecule's location: if the molecule is left, the memory is configured to "left" (e.g., a partition pre-inserted on the right), and vice versa. The demon reversibly extracts work by expanding the molecule isothermally using the memory, then reversibly resets the system by reinserting the partition based on the memory state. After one cycle, the gas entropy is unchanged, but the mutual information is consumed. The entropy *decrease* occurs in a **second cycle**: the demon uses the remaining (uncorrelated) memory to compress the molecule into a random half, lowering the gas entropy by \(k \ln 2\) (1 bit) without performing measurement, erasure, or heat dumping, solely by expending the initial correlation.

  ### Entropy Bookkeeping
  Assume units where \(k \ln 2 = 1\) bit for simplicity. Define:
  - \(X\): Molecule's position (L/R).
  - \(M\): Demon's memory state (L/R).

  **Stage 0: Initial State (Correlated Setup)**  
  - Joint system \((X, M)\): Perfectly correlated states \((L,L)\) or \((R,R)\), each probability \(1/2\).  
  - Joint entropy \(H(X, M) = 1\) bit (two equiprobable states).  
  - Marginal entropies: \(H(X) = 1\) bit, \(H(M) = 1\) bit.  
  - Mutual information \(I(X; M) = H(X) + H(M) - H(X, M) = 1\) bit.  
  *Total entropy: \(1\) bit (joint system).*

  **Stage 1: First Cycle (Reversible Work Extraction)**  
  - Demon uses memory (e.g., if \(M = L\), inserts piston on right) to expand molecule isothermally, extracting work \(kT \ln 2\).  
  - **Changes**:  
    - \(H(X)\) increases to 1 bit (molecule now in full volume, uniform distribution).  
    - \(H(M) = 1\) bit (unchanged).  
    - \(H(X, M)\): Molecule's position decouples from memory; uniform over all \((X, M)\) pairs, so \(H(X, M) = 2\) bits.  
    - \(I(X; M) = 0\) bits (correlation consumed).  
  - **Result**:  
    - Gas entropy \(\Delta S_{\text{gas}} = +1\) bit (due to expansion).  
    - Mutual info consumed: \(\Delta I = -1\) bit.  
    - Heat bath supplies energy for work, but entropy change compensated: \(\Delta S_{\text{total}} = 0\) by reversibility.  
  *Total entropy: \(2\) bits (joint), but \(\Delta S_{\text{universe}} = 0\) including bath.*

  **Stage 2: Second Cycle (Entropy Lowering via Correlation Expenditure)**  
  - Memory is now uncorrelated (e.g., stuck in state "L" from prior work extraction).  
  - Demon uses this *fixed* memory state to reinsert the partition (e.g., always on the right for \(M = L\)) and reversibly compress the molecule into the left half.  
  - **Changes**:  
    - \(H(X)\) decreases to 0 bits (molecule confined to left half).  
    - \(H(M) = 0\) bits (memory now fixed, no uncertainty).  
    - \(H(X, M) = 0\) bits (only one state: molecule left, memory "L").  
  - **Result**:  
    - Gas entropy \(\Delta S_{\text{gas}} = -1\) bit.  
    - Mutual info: \(I(X; M) = 0\) bits (no correlation, but memory is now deterministic).  
  - **Work/Energy**: Compression requires work \(kT \ln 2\), sourced reversibly from an ideal work reservoir (no entropy change).  
  *Total entropy: \(0\) bits (joint), but \(\Delta S_{\text{universe}} = 0\) (work reservoir absorbs energy isentropically).*

  ### Net Effect Over Two Cycles
  - Gas entropy: Net \(\Delta S_{\text{gas}} = 0\) (Stage 1: \(+1\), Stage 2: \(-1\)).  
  - Mutual information: Initial \(I = 1\) bit fully consumed.  
  - **Key**: The entropy *decrease* in Stage 2 is enabled solely by the initial correlation. Without it, Stage 2 could not lower entropy reversibly. The demon never measured or erased; it exploited pre-existing \(I(X; M)\).

  ### Feature Doing the Work
  **Initial Correlation as the Resource**:  
  The mutual information \(I(X; M) = 1\) bit is the thermodynamic fuel. It allows the demon to:  
  1. Extract work in Stage 1 without measurement (using correlation to "know" where to insert the piston).  
  2. Lower entropy in Stage 2 without erasure (using the fixed memory state to compress the gas).  
  **If correlation is removed**:  
  - Start with uncorrelated memory (e.g., memory fixed to "L" while molecule is random).  
  - Stage 2 would require measurement to know where to compress, violating Specification 1.  
  - The case collapses into a standard Szilard engine, requiring erasure to reset memory.

  ### Strongest Objection (Erasure Advocates)  
  **Objection**: "Stage 2’s compression uses a *fixed* memory state, which is a low-entropy resource. Resetting the memory to a known state for reuse requires erasure, so the cost is still paid in erasure."  
  **Rebuttal**: The memory is **not reset**; it remains fixed after Stage 1. The initial correlation was prepared *before* the experiment (at no erasure cost under reversible correlation-building, e.g., via a reversible CNOT gate). For a *third* cycle, the memory would need resetting, but the entropy decrease in Stage 2 of the *second* cycle relies only on the initial correlation, not on erasure. The erasure cost is deferred to cycle reuse, not paid here.

  ### Verdict  
  This case **refutes** the claim that erasure is *always* the thermodynamic cost. It shows that:  
  - **Correlation (mutual information) is the fundamental resource** expended to lower entropy.  
  - Measurement and erasure are *specific mechanisms* that manipulate correlation but are not universally required.  
  - **More general constraint**: The second law is preserved by the **conservation of total entropy**, where mutual information is a quantifiable thermodynamic resource. Reducing system entropy requires expending an equivalent amount of mutual information or free energy, but erasure is merely one way to *destroy* mutual information, not the only way.
