prompt: |-
  I am defending a thesis chapter in a departmental work-in-progress session next week: twenty-five minutes of talk, then an hour of questions. I want a Q&A prep sheet, not a survey of the literature and not a sympathetic restatement of my view. Try to break it.

  The thesis. Call it partition-relative causation. The sketch I will be defending runs: (1) every causal claim is evaluated against a partition of the space of possible states of the system concerned, that is, against a grain at which the cause and the effect are typed; (2) the exclusion principle invoked by the standard argument against mental causation — no one effect has two distinct sufficient causes at the same time, short of symmetric overdetermination — holds only when the competing candidates are typed by one and the same partition; (3) in a realization pair, the psychological typing is coarse, since it collects physically heterogeneous realizers under one type, while the physical typing is fine, so the mental candidate and the physical candidate never compete for the same effect; (4) hence the argument cannot even formulate its competition premise without first selecting a partition, and nothing in causation itself selects one — the selection is fixed by which counterfactual structure we are trying to track; (5) the price, which I pay willingly: there is no partition-free answer to the question whether mental states cause behaviour, and the mental adds no causal influence over and above the physical, only counterfactual stability across a range of realizers.

  The audience. Two people who accept the exclusion argument, one cheerfully (mental properties simply are not causal-property-shaped) and one as a route to a ruthless identity view; both know the closure and supervenience premises by heart and will want to know what a coarsely typed cause is supposed to be made of. Three non-reductive physicalists: one who favours proportionality-style replies, one who favours the program-explanation line, one who holds a realizer-friendly inheritance view. They are my natural allies, but each will want to know what my apparatus adds to theirs, and each will be quietly annoyed if I don't say so. One philosopher of science of interventionist sympathies, for whom causes are variables in a model and who will ask what my admissible variable sets are and whether the coarse variable is invariant, modular and independent. One metaphysician who holds that causation is a relation in nature rather than a relation to our questions, and who will think any view on which causal facts shift with explanatory interest has changed the subject. Several graduate students and a visiting aesthetician who suspect the whole debate is verbal. The chair, a Humean about laws, will let anything run long.

  What I want from you. Eight or nine objections, in the order they will actually arrive in the room rather than the order they appear in the literature. For each: who raises it; how that person would phrase it, using their own vocabulary (screening off, overdetermination, proportionality, intervention, invariance under intervention, realization, closure, distinctness of properties, same cause under a different description, nothing left for the mental to do); whether it really bites against the thesis as stated above or only against a weaker version; a reply I can deliver in about ninety seconds; and one sentence on where that reply is soft. Then: the two objections I should concede in my first two minutes rather than wait to be asked, and how to concede them without surrendering the thesis; the single reply that has to land if the chapter is to survive, and your honest view on whether it does; and the question I am hoping nobody asks.

  Lead with a single sentence stating your bottom line — the objection most likely to sink the session and whether my answer to it works. Then give the prep sheet. No preamble, no restatement of what I have asked for, and no general background on the exclusion argument before the first objection. Keep the whole response under about fourteen hundred words.
reasoning: |-
  Okay, the user is preparing for a thesis defense on partition-relative causation and needs a Q&A prep sheet. They want targeted objections, not literature review. Let me start by understanding their thesis core: causal claims depend on partitions, exclusion principle applies only within the same partition, mental and physical causes don't compete because of different grains.

  The audience is diverse: exclusion argument supporters, non-reductive physicalists, an interventionist, a metaphysician, grad students, and a Humean chair. Each will have specific concerns. The user needs objections in the order they might arise, with who says what, response, and weaknesses.

  First, the metaphysician might object that causation is mind-independent, not relative. Need to address that upfront. Then the interventionist will ask about variable admissibility. Response: coarse variables are invariant under interventions. But weakness: invariance might not hold across all contexts.

  Next, proportionality advocate: why not just use proportionality? Reply that partitions handle realization better. Weakness: proportionality might be sufficient without partitions.

  Exclusion supporter (cheerful) will say mental properties aren't causal-shaped. Reply that coarse-graining defines their causal role. Weakness: what makes a partition legitimate? 

  Ruthless identity view: why not identify mental/physical? Concede that mental adds no extra influence but explains stability. 

  Program explanation ally: difference from their view? Emphasize partition relativity. Weakness: might seem similar.

  Realizer inheritance: how coarse types inherit causal powers? Through realization chains. Weakness: circularity risk.

  Humean chair on laws: need to show how partitions fit into Humean framework. Concede laws supervene on physical.

  Grad students on verbal dispute: argue it's substantive metaphysical difference.

  Must concede that mental causes aren't fundamental and causation isn't intrinsic. Key reply is to the interventionist on invariance. If that lands, the chapter survives. Hoping nobody asks if partitions are arbitrary—hard to define legitimacy without pragmatism.
answer: |-
  **Bottom Line:** The metaphysician’s objection—that you reduce causation to explanatory interest, thereby changing the subject—is the most dangerous; your reply (that causal *selectivity* is partition-relative, not causation itself) is defensible but risks sounding concessive.  

  ---

  ### **Q&A Prep Sheet: 8 Objections**  
  *(Ordered by predicted sequence in-room)*  

  1. **Objector: Metaphysician ("Causation is in nature, not our questions")**  
     - **Phrasing:** "You’ve made causation perspectival. But causal relations are *out there*—they don’t shift when we change 'partitions'. You’re talking about explanation, not causation."  
     - **Bites?** Yes—targets core thesis.  
     - **Reply (90s):** "Causation itself isn’t relative; *which causal relations we pick out* is. Just as a telescope’s resolution doesn’t change stars but selects which ones we see, partitions select which causal dependencies we track. Your 'relations in nature' include both fine- and coarse-grained dependencies; I’m showing how we access them."  
     - **Soft spot:** "Selecting which dependencies exist" sounds like conceding anti-realism.  

  2. **Objector: Interventionist ("What makes a partition 'admissible'?")**  
     - **Phrasing:** "If causes are partition-relative variables, what constraints define admissible partitions? If the coarse 'mental' variable isn’t invariant or modular under intervention, is it even causal?"  
     - **Bites?** Yes—tests technical grounding.  
     - **Reply (90s):** "Admissible partitions must support counterfactuals resilient to interventions *within that grain*. The mental variable *is* invariant: intervene to change pain (coarse type) while holding fixed its realizers, and pain still causes avoidance. Modularity fails *only* if you wrongly mix grains."  
     - **Soft spot:** Invariance may require idealization (e.g., "holding realizers fixed" is unphysical).  

  3. **Objector: Proportionality Advocate ("Why not my view?")**  
     - **Phrasing:** "Proportionality already handles grain-relativity: mental causes are *more* proportional than physical. Your partitions add nothing but jargon."  
     - **Bites?** Weakly—aims at novelty, not substance.  
     - **Reply (90s):** "Proportionality optimizes *within* a partition. But when competing causes are typed *across* partitions (e.g., mental vs. physical), proportionality can’t resolve exclusion—it’s silent on whether they conflict. My view explains why they *never* compete."  
     - **Soft spot:** Could retort that proportionality *can* compare grains (e.g., Yablo’s subsetting).  

  4. **Objector: Cheerful Exclusionist ("Mental properties aren’t causal-property-shaped")**  
     - **Phrasing:** "Coarse 'types' are disjunctive junk. Only physical properties screen off their effects. What causal work is left for the mental?"  
     - **Bites?** Superficially—assumes physical closure does all work.  
     - **Reply (90s):** "Screening off requires same grain. At the coarse partition, the physical realizer *is not a variable*—it’s 'zoomed out'. Pain (coarse) screens off C-fiber (fine) for 'avoidance', but not vice versa: C-fiber is irrelevant to pain’s counterfactual profile."  
     - **Soft spot:** Must defend "irrelevance" without dualism.  

  5. **Objector: Ruthless Identity Theorist ("Just identify them!")**  
     - **Phrasing:** "If the mental adds no causal influence, why not say it *is* the physical cause under a different description? Partition-relativity is identity in disguise."  
     - **Bites?** Moderately—presses on cost (point 5).  
     - **Reply (90s):** "Identity requires same extension in all contexts. But 'pain' picks out diverse realizers across worlds—it’s multiply realizable, not identical to any physical type. Partitions explain how it can cause *despite* this heterogeneity."  
     - **Soft spot:** Collapses if mental types are physically identical in *this* world.  

  6. **Objector: Program-Explanation Ally ("How are you different?")**  
     - **Phrasing:** "This sounds like my view: mental causes explain robustness, not physical effects. Why partitions over program explanations?"  
     - **Bites?** Weakly—seeks distinction.  
     - **Reply (90s):** "Program explanations deny mental *causation*. I affirm it: mental states cause behavior *relative to their partition*. Your view makes the mental epiphenomenal in causal chains; mine doesn’t."  
     - **Soft spot:** If "partition-relative causation" is deemed non-causal, views converge.  

  7. **Objector: Realizer-Inheritance Physicalist ("How do coarse types inherit causal powers?")**  
     - **Phrasing:** "If realizers do all the work, how can coarse types cause *without inheriting powers*? Your 'counterfactual stability' is epiphenomenalism with extra steps."  
     - **Bites?** Yes—targets point 5.  
     - **Reply (90s):** "Coarse types *do* inherit powers—via realization chains. But inheritance isn’t competition: the power of pain (coarse) is the *orchestration* of its realizers’ powers. At its grain, it’s the cause; at finer grains, realizers are."  
     - **Soft spot:** "Orchestration" may sound mysterious.  

  8. **Objector: Humean Chair ("Where do laws fit?")**  
     - **Phrasing:** "If causal facts shift with partitions, do laws? Or are laws just fine-grained regularities?"  
     - **Bites?** Indirectly—tests consistency.  
     - **Reply (90s):** "Laws supervene on the fundamental (fine-grained) level. But *ceteris paribus* laws at coarse grains track robust patterns—like how thermodynamics supervenes on statistical mechanics. Partitions don’t change laws; they describe levels of abstraction."  
     - **Soft spot:** Laws at coarse grains may not reduce neatly.  

  ---

  ### **Strategic Concessions (First 2 Minutes)**  
  1. **Concede:** "Mental causation adds no *fundamental* causal influence beyond the physical."  
     - **How:** "This is the cost I pay—but it doesn’t make the mental epiphenomenal. Its causal role is real and partition-relative."  
  2. **Concede:** "Causation isn’t *intrinsically* partition-relative; partitions are tools for *representing* causal structures."  
     - **How:** "I’m not anti-realist—I’m showing how our models map onto a structured reality."  

  ---

  ### **The Reply That Must Land**  
  - **Objector: Interventionist** (Objection #2 above).  
  - **Why it’s critical:** If coarse variables aren’t invariant/modular, your view collapses into instrumentalism.  
  - **Your reply:** Anchor invariance in interventions *within the partition* (e.g., "Pain causes avoidance even if realizers vary").  
  - **Does it work?** **Yes**, but barely: It holds if partitions are *methodologically* constrained (e.g., by scientific practice). If partitions are "subjective," it fails.  

  ---

  ### **The Question You Hope Nobody Asks**  
  **"What determines a partition’s legitimacy? If I partition arbitrarily (e.g., 'things that happen on Tuesdays'), do I get 'causes'?"**  
  - **Why it’s deadly:** Forces you to admit partitions are interest-relative, undermining objectivity. Your best reply—"Legitimacy requires supporting non-accidental counterfactuals"—invites circularity (since counterfactuals depend on partitions).
