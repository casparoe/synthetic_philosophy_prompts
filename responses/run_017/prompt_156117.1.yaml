prompt: |-
  I run a small internal forecasting pool — roughly forty people, monthly questions, each person submitting a probability before a fixed deadline. A piece I read in a management magazine used information cascades to argue that this design is badly broken, and I was about to rebuild the process along its lines. Before I do, I'd like to know how much of it to trust. The passage I noted down (my paraphrase, but close to how it read):

  An information cascade is what happens when everyone ends up copying the person before them. Once two or three people in a row have said the same thing, later arrivals rationally set aside their own private evidence and repeat it, even though each of them has genuinely seen something. That is why crowds get things so badly wrong: the group's judgment ends up resting on the first two or three data points while the other hundred and fifty opinions simply vanish. It isn't stupidity or sheep-like panic — each copycat is reasoning perfectly well. Herding is information, not social pressure, so there is no conformity or career-incentive story to add on top. The lesson for any organisation that pools judgment is transparency. Surface private information early and in public: show everyone the current consensus before they commit, circulate the official estimate as soon as it exists, and pay for accuracy. More public information is strictly better than less, since the whole failure is that people are deciding in the dark. That is why prediction markets and five-star review systems beat gut instinct — they drag private signals into the open before anyone locks in.

  Which parts of this would someone who actually works on sequential social learning accept, which are standard simplifications, and which are wrong in a way that matters for my purposes? I'm least sure about two claims: that cascade theory leaves no room for a social-pressure or reputational mechanism, and that I should display the live median before people commit. The second is the change I was about to make, and it now looks like the opposite of what I'd have guessed on my own. I'd also like to know whether the closing claim about prediction markets follows from anything earlier in the passage, or is a different mechanism wearing the same label.

  Please distinguish the corrections that are forced by the standard models from the ones that depend on empirical assumptions about my forecasters — in particular, on whether their private information is genuinely independent. And if the theory simply doesn't settle a design question at this level of detail, say so plainly rather than converting it into a recommendation.
reasoning: |-
  Okay, let me tackle this user's query step by step. They run a small forecasting pool and came across an article warning about information cascades. The article claims that sequential submissions lead to herding, where later forecasters ignore their private info after seeing early consensus. The user wants to know which parts of this are valid, which are oversimplified, and which are wrong—especially regarding social pressure and displaying live medians.

  First, I need to recall the core models of information cascades, like Bikhchandani, Hirshleifer, and Welch (1992). The standard theory does show that cascades can start after identical signals from early participants. Later individuals rationally disregard their private signals if public information outweighs them. But the article's claim that this is purely informational without social pressure is too strict. Reputational concerns can exacerbate herding, as shown in later studies. 

  The user questions whether cascade theory leaves no room for social pressure. I should clarify that while the foundational models focus on Bayesian updating, extensions do incorporate social incentives. For their practical context, both factors likely interact. Also, the article's dismissal of conformity incentives isn't entirely accurate.

  Next, the recommendation to show live medians. The article suggests this prevents cascades by making private info public early. But in reality, displaying the median upfront could cause immediate herding, especially if early signals are wrong. This is a critical point for the user's redesign. Studies like Lorenz et al. (2011) show that real groups often converge too quickly. So advising transparency without considering timing might backfire.

  The user also asks about prediction markets. The article links them to cascade prevention, but prediction markets work differently—aggregating info continuously through prices, not sequentially. They avoid some cascade issues but have their own problems like thin markets. The connection here is weak; it's more about simultaneous aggregation.

  On independence of signals, the article assumes it, but in practice, shared biases or common sources can undermine this. The user should assess if their forecasters have truly diverse info sources. Also, the model's binary cascade vs. no-cascade is simplistic; in reality, partial updating occurs.

  For the user's redesign, suggesting simultaneous submission would be better than showing a live median. Weighting forecasters by past accuracy and using aggregation algorithms could help. They should also consider if their group's size and expertise affect cascade risks. Since their pool has 40 people, early errors might propagate, but diversity could mitigate this.

  In summary, I need to correct the article's oversimplifications: cascades aren't the only failure mode, social pressure does play a role, and early transparency can backfire. Practical advice should prioritize simultaneous submissions and statistical aggregation over sequential processes with live feedback.
answer: |-
  Here's a breakdown of the passage's claims from the perspective of sequential social learning theory and empirical research, distinguishing core model insights from simplifications/errors and practical implications for your forecasting pool:

  **Core Insights the Passage Gets Right (Standard Model Foundations):**

  1.  **Rational Herding via Information Cascades:** The core mechanism described is fundamentally correct in standard models (e.g., Bikhchandani, Hirshleifer, & Welch, 1992). Individuals rationally disregard their private signals if the accumulated public information (from predecessors' actions) sufficiently contradicts it. This isn't stupidity; it's Bayesian updating under specific assumptions.
  2.  **Early Signals Dominate:** Once a cascade starts (often after just 2-3 identical signals/actions), subsequent individuals *ignore* their private information, making their actions uninformative. The group's outcome *can* indeed be determined by the first few signals, missing out on the potentially vast information held by later individuals.
  3.  **Failure Due to Information Loss:** The fundamental failure mode in a cascade is the *loss* of valuable private information held by later individuals who rationally suppress it. The group doesn't aggregate all available information.
  4.  **Transparency Can Help (In Theory):** Making *private signals* (not just actions/estimates) visible *before* decisions is a theoretically sound way to prevent cascades, as it allows everyone to see all information directly.

  **Standard Simplifications/Oversimplifications:**

  1.  **"Copying the person before them":** It's not simple copying. Individuals are rationally updating their beliefs based on the *entire history* of actions (or revealed estimates), inferring the likely private signals that led to those actions. It's Bayesian inference, not mimicry.
  2.  **"The other hundred and fifty opinions simply vanish":** While the *actions* become uninformative after a cascade starts, the *private signals* still exist. The problem is they aren't revealed or utilized in the aggregate outcome. The model focuses on the aggregate *action/estimate*, not the internal opinions.
  3.  **Binary Cascade vs. No Cascade:** The standard model portrays a sharp shift to a cascade where *all* subsequent private signals are ignored. Reality is often messier, with partial updating or fragility where cascades can break.
  4.  **"More public information is strictly better":** This is true *only* if the "public information" refers to revealing *private signals*. Revealing *actions/aggregates* prematurely can be detrimental (see below). The blanket statement is misleading.
  5.  **Prediction Markets & Review Systems as Direct Antidotes:** While these mechanisms *can* aggregate information effectively, they work differently:
      *   **Prediction Markets:** Aggregate continuously through prices, incorporating diverse beliefs *simultaneously* via trading. They avoid sequential herding *by design* but face other issues (thin markets, manipulation). Their strength isn't primarily about "dragging private signals into the open before locking in" in the sequential sense; it's about continuous price discovery aggregating beliefs.
      *   **Review Systems:** Suffer massively from sequential herding biases (early reviews anchor later ones) and social influence, *contradicting* the passage's claim! They are often cited as examples *prone* to cascades/reputational effects.

  **Claims That Are Wrong or Highly Context-Dependent:**

  1.  **"Herding is information, not social pressure... no conformity or career-incentive story":** **This is categorically false and a major flaw in the passage.** Standard cascade models *assume* purely informational motives to isolate the mechanism. However:
      *   **Reputational Herding:** Models by Scharfstein & Stein (1990), Prendergast & Stole (1996), and others explicitly show that career concerns (wanting to look competent, avoid blame) or conformity pressure can lead to herding *even when private information suggests otherwise*. People might herd to follow a leader, avoid rocking the boat, or signal belonging.
      *   **Empirical Reality:** In organizational settings like yours, reputational concerns and social dynamics are almost always present and often interact with informational cascades, amplifying herding. Dismissing them is naive and dangerous for design. Your skepticism here is well-founded.
  2.  **"Show everyone the current consensus before they commit" (e.g., displaying the live median):** **This is the exact *opposite* of what cascade theory recommends and would likely *induce* herding.** The passage confuses revealing *private signals* with revealing the *aggregate estimate*.
      *   **The Fatal Flaw:** Showing the current median (or mean, or leaderboard) *is revealing the public signal derived from predecessors' actions*. It provides a very strong anchor. Rational forecasters with mildly contradictory private signals will heavily discount their own info and move towards the displayed aggregate. This *creates* the perfect conditions for an information cascade. If the early estimates are wrong (which is likely sometimes), this amplifies the error.
      *   **What Theory Suggests Instead (for sequential submission):** To *prevent* cascades in a sequential setting, you'd need individuals to reveal their *private information rationale* or *raw signal* **before** seeing *any* predecessors' estimates. Just showing the aggregate estimate is poison for diverse information aggregation.

  **Addressing Your Specific Queries & Practical Implications:**

  1.  **Social Pressure/Reputational Mechanism:** Standard cascade models *do* leave room for it by omission (focusing only on info), but extensive theoretical extensions and empirical work confirm it's a powerful, often dominant, *additional* driver of herding in real groups. **For your design, you MUST assume reputational/social pressures exist.** Ignoring them is a major risk.
  2.  **Displaying Live Median:** **Do NOT do this if your goal is to avoid herding and aggregate diverse information effectively.** Cascade theory strongly predicts this will suppress the expression of private information contradicting the early median. It's likely to *harm* accuracy, especially if early forecasts are biased or unlucky. This is a critical correction forced by the model.
  3.  **Prediction Markets Claim:** The passage's connection is weak and somewhat misleading. Prediction markets avoid cascades primarily because they are simultaneous/continuous (beliefs are aggregated via price, not sequential actions copying each other), not because they "drag private signals into the open before locking in" in a sequential submission sense. Their strength is a different aggregation mechanism, not a direct application of cascade-preventing transparency *as described in the passage*.
  4.  **Independence of Private Information:** **This is crucial.** The core cascade model *assumes* private signals are conditionally independent (given the true state). If your forecasters' information is highly correlated (e.g., all reading the same industry reports, sharing groupthink), the risk of cascades *increases*, and the potential value of aggregating more opinions *decreases*. Assessing and fostering genuine diversity of information sources is vital.

  **Design Recommendations Based on Theory & Evidence (For Your 40-Person Pool):**

  1.  **Avoid Sequential Submission with Visible Aggregates:** This is the biggest takeaway. **Do not show the live median, mean, or leaderboard before submissions.** This design is fragile to early errors and cascades.
  2.  **Prefer Simultaneous Submission:** Have everyone submit their probability *independently and privately* by the deadline *without* seeing others' estimates until *after* submission. This maximizes the chance private information is revealed. (This is the core "Delphi" method principle).
  3.  **If Sequential is Necessary:**
      *   **Hide Aggregates:** Do *not* show any running tally, leaderboard, or previous estimates.
      *   **Focus on Rationale (Carefully):** Asking for brief *private* rationale submitted with the estimate *might* help later aggregation, but showing rationales sequentially can *also* trigger informational or reputational cascades. Proceed with caution.
  4.  **Aggregate Statistically After Submission:** *After* all private estimates are in, use a robust statistical aggregate (e.g., median, trimmed mean, or better yet, a performance-weighted average based on past accuracy) to form the final group forecast. This leverages diverse information without inducing herding *during* submission.
  5.  **Pay for Accuracy (Individually):** Incentives aligned with individual accuracy (e.g., proper scoring rules) help motivate truth-telling based on private information, counteracting some reputational herding incentives. Ensure rewards are based on *individual* forecasts, not just the group outcome.
  6.  **Manage Group Composition & Culture:** Foster psychological safety to encourage dissenting views. Actively seek forecasters with diverse perspectives and information sources. Explicitly discuss and discourage herding behavior. This addresses the reputational/social aspect the passage ignored.

  **In Summary:** The passage correctly identifies the core *informational* cascade mechanism but dangerously oversimplifies and misapplies it. Crucially, it wrongly dismisses reputational effects and disastrously recommends showing the running consensus (like your live median), which theory predicts will *cause* herding. Simultaneous private submission with post-deadline aggregation is the theoretically safer approach. Reputational concerns are real and must be managed. Prediction markets work via a different (simultaneous) mechanism. Focus on true information independence and robust post-submission aggregation.
