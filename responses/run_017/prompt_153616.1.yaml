prompt: |-
  I am a journalist working on a long piece about how researchers, funders, and policy people who study risks to humanity's long-term future talk about human extinction, and I have now run into the same shape of claim in enough interviews that I want to know whether it has a name and, if so, where its edges are.

  Here is the shape. Everyone I speak to agrees that extinction would be a catastrophe. When I strip away the deaths and the suffering — suppose the end were instantaneous and painless, and suppose everyone alive had already lived a full life — they converge on something like this: what is lost is not a matter of anyone being made worse off. Pressed to say more, the answers split. One group says the loss is retrospective: the work done this year, the symphony, the vaccine, the raising of a child, would turn out not to have had the point it was thought to have. Another group says no, their projects would still have had their point; what is lost is prospective and victimless — an enormous quantity of good that would have happened simply will not happen, and that is a disaster even though there is nobody it is a disaster for.

  What I cannot place is that these same people, often in the same conversation, deny the mirror-image claim. They explicitly reject the thought that we lose something by not bringing additional flourishing people into existence: a society with a falling birth rate is not, on their view, incurring a loss of value on that account. Yet the non-existence of future people is precisely what they count as the central loss in extinction. When I offer them the replacement case — humanity ends, but the planet is immediately occupied by other beings whose lives go just as well, and who remember nothing of us — they divide sharply, and the division does not track any of their other disagreements. One further boundary I cannot locate: several said the retrospective version only bites if the end is close enough to fall inside the world they are living in, and that an end ten centuries out threatens nothing they care about.

  I read a review some time ago of a philosopher's book — I believe it grew out of lectures on death — arguing that nearly everything we value silently presupposes that people will be around after we die, so that extinction would hollow out our present concerns. I assumed that was what my interviewees were reaching for. It is not quite: when I put it to them, more than one said that their projects would still matter, and that what would be lost is the future itself.

  So: is there an established concept for this configuration — treating the non-existence of possible future people as an enormous loss in one direction while treating the non-existence of merely possible additional people as no loss at all — and is what I have described one phenomenon or two? If there is a name, I want the carving rather than the label: how it differs from the nearby views about who can be harmed by not being brought into existence, and how it differs from the view in the book I have described. If there is no name, I would like you to coin and define one, to say whether the retrospective and prospective articulations are genuinely separable, and to say whether the split over the replacement case shows a single intuition or several. I also need to know what would count as evidence that this is simply an inconsistency in how this community talks, since that is the deflationary explanation I would have to take seriously in the piece.
reasoning: |-
  Okay, let me unpack this journalist's query. They're observing a fascinating asymmetry in how experts discuss extinction versus population decline: everyone agrees extinction is catastrophic even without suffering, but they sharply reject the idea that declining birthrates cause similar value loss. The core puzzle is why "future people not existing" counts as a colossal loss in extinction scenarios but "possible people not being born" isn't seen as a loss at all. 

  First, I recognize this touches deep philosophical trenches - person-affecting views versus impersonal goods, non-identity problems, and what Parfit called the "repugnant conclusion." The journalist already knows this terrain but needs sharper tools. Their "replacement case" (aliens inheriting Earth) is particularly clever - it isolates whether the loss is about human absence specifically or just sentient flourishing.

  Hmm, the retrospective/prospective split is telling. Some think extinction voids past meaning (like Scheffler's "Afterlife" thesis), others focus on lost future potential. But why don't they extend this to smaller-scale non-existence? I suspect the unspoken anchor is *continuity*. Extinction isn't just absence; it's rupture. A childless couple's choice feels local and reversible, while extinction feels like slamming shut history's door. 

  The journalist needs terminology that captures this discontinuity intuition. "Existential asymmetry" might work - emphasizing how we weigh termination differently than non-initiation. But it must distinguish from "anthropic bias" (overvaluing humans) since the replacement case divides opinions. 

  For evidence of inconsistency, I'd look for parallel cases: if these experts mourn extinct species but not uncreated ones, or if they support colonizing space to prevent human extinction but not to create new populations. Their reaction to digital minds replacing biological humans could also probe whether the concern is about consciousness or Homo sapiens specifically. 

  The retrospective camp's time limit ("ten centuries doesn't matter") suggests their concern isn't truly about infinite lost futures but about breaking the chain they're part of. This feels tribal, almost religious - like a "covenantal" relationship with humanity. The prospective camp seems more utilitarian but hits a wall when asked why more utilitons aren't better. 

  Ultimately, this isn't one phenomenon but a fault line between two value systems: one where meaning depends on participating in an endless story, and another that sees value as a cosmic sum. The inconsistency arises because both camps borrow from each other when convenient. The retrospective group uses future-loss language to sound objective; the prospective group avoids birthrate talk because it leads to uncomfortable conclusions. Smart interviewees might admit this tension - that would be telling for the piece.
answer: |-
  Here's a dissection of the conceptual terrain you're mapping, including terminology, distinctions, and potential inconsistencies:

  **The Core Asymmetry & Its Name:**
  This configuration is most precisely described as **"Asymmetrical Existential Valuation" (AEV)**. While not a single universally established term, it captures the core phenomenon: assigning radically different value judgments to the *non-existence of future beings* depending on whether it stems from *termination of an existing lineage* (extinction) versus *non-initiation of potential beings* (low birth rates).

  **Carving the Concept:**

  1.  **Distinction from Person-Affecting Views & the Non-Identity Problem:**
      *   **Person-Affecting Principle (PAP):** Often argues that an outcome can only be bad if it makes some *identifiable* person worse off. Extinction seems to violate this (no future people exist to be worse off), while low birth rates clearly align with it (no specific person is deprived of existence).
      *   **Non-Identity Problem:** Highlights that choosing *not* to create a specific potential person (e.g., via low birth rates) doesn't harm *that* person (because they never exist to be harmed), but choosing actions that lead to a *worse future* for people who *will* exist can be problematic.
      *   **AEV's Edge:** AEV proponents *explicitly reject PAP in the extinction case*. They argue extinction *is* a huge loss *despite* no identifiable future person being harmed. However, they seem to *revert to or accept PAP-like reasoning in the birth rate case*, arguing no loss occurs because no specific person is deprived. This creates the asymmetry. They treat the *collective potential* of the human lineage as a unique bearer of value that can be "lost" upon termination, even without victims, but do not assign similar value to the collective potential of merely possible additional lives not initiated.

  2.  **Distinction from Scheffler's "Afterlife" Thesis (the book you recalled):**
      *   **Scheffler (e.g., in "Death and the Afterlife"):** Argues most human value, meaning, and motivation depend on a "collective afterlife" – the implicit belief that humanity continues after our individual deaths. Extinction "hollows out" present activities because their *meaning* (their contribution to an ongoing project, their being witnessed, their legacy) vanishes.
      *   **AEV's Edge (Retrospective vs. Prospective):**
          *   **Retrospective AEV (aligned with Scheffler):** Agrees extinction voids the meaning/point of past and present actions ("the work turns out not to have had the point"). Their time limit ("only if close enough") reinforces this: meaning depends on *their* actions feeding into the near-future continuation they expect to be part of the chain.
          *   **Prospective AEV:** *Explicitly rejects* the Schefflerian retrospective loss. They believe their projects *retain* their meaning/value intrinsically or within their own context. The loss is purely *forward-looking*: the astronomical amount of future good (experiences, achievements, flourishing) that simply *won't happen*. This is an impersonal loss of potential value in the universe.
      *   **Key Difference:** Scheffler focuses on the *undermining of present meaning*. Prospective AEV focuses on the *sheer quantitative loss of future good states*, irrespective of how it affects present meaning.

  **Your Specific Queries Answered:**

  1.  **One Phenomenon or Two?** It's **one core phenomenon (AEV) with two distinct articulations (Retrospective and Prospective)**. Both share the core asymmetry: catastrophic loss for lineage termination, no loss for non-initiation. The split comes in *explaining why* extinction is a loss. Retrospective points *backwards* to undermined meaning (Scheffler-esque). Prospective points *forwards* to lost future value.
  2.  **The Replacement Case Split:** This reveals **two underlying intuitions**:
      *   **Human-Chauvinist/Lineage-Specific Intuition:** Value is tied to the *continuation of the specific human lineage/project*. Aliens, even flourishing ones, are irrelevant substitutes. The loss is specifically *human* extinction. (More likely held by Retrospective AEV, but possible for Prospective).
      *   **Sentience/Value-Neutral Intuition:** The loss is the *absence of future flourishing, period*, regardless of the bearer. Flourishing aliens *do* compensate for the loss; the catastrophe is averted. (Held by Prospective AEV).
      *   This split *doesn't* cleanly map to Retrospective/Prospective because a Retrospective thinker *could* accept aliens as continuing "meaning" in a broad sense, and a Prospective thinker *could* value human potential uniquely. It probes *what kind* of value they think is lost.
  3.  **Evidence for Inconsistency:** Here's how you could argue for inconsistency within the community's discourse:
      *   **The "Merely Possible" vs. "Future of Lineage" Ambiguity:** Challenge them to define the *moral difference* between the "merely possible" people not created by low birth rates and the "future people" not created by extinction. If the loss in extinction is the absence of *impersonal future good* (Prospective view), why isn't the absence of potential good from lower populations also a loss (smaller, but cumulative)? If they appeal to the *termination of an existing project* (Retrospective or Lineage view), press them on why starting new valuable projects (via births) isn't symmetrically valuable. The burden of proof is on them to show why "continued existence of the lineage" creates a unique, massive moral category distinct from the initiation or non-initiation of valuable life.
      *   **Scale vs. Kind:** Argue that the difference feels like one of *scale* (extinction = infinite loss, one less child = tiny loss) but they are treating it as a difference in *kind* (loss vs. no loss). If impersonal value is lost in extinction, impersonal value *is* lost with each foregone potential life – just vastly less. Their rhetoric suggests extinction is *qualitatively* different.
      *   **Motivational vs. Moral:** Suggest their strong reaction to extinction stems from deep psychological/evolutionary *motivations* (fear of termination, desire for legacy) being projected as objective moral facts, while the lack of reaction to lower birth rates reflects the absence of such strong innate drives. This would be the "deflationary explanation" – the asymmetry is psychological bias, not reasoned ethics.
      *   **Parfitian Parallels:** Point out that Derek Parfit's work on future generations highlights similar tensions. Rejecting the idea that creating more happy people is better (to avoid the "Repugnant Conclusion") while simultaneously mourning the loss of vast future happiness in extinction seems difficult to reconcile logically. They might be trying to have their cake (avoid overpopulation obligations) and eat it too (lament extinction catastrophe).

  **In Summary:**

  *   **Name:** Asymmetrical Existential Valuation (AEV).
  *   **Core:** Catastrophic loss for lineage termination; no loss for non-initiation.
  *   **Articulations:**
      *   *Retrospective AEV:* Loss of meaning for past/present actions (Scheffler-esque, time-bound).
      *   *Prospective AEV:* Impersonal loss of vast future good states.
  *   **Replacement Case Split:** Reveals whether value is tied to the *human lineage specifically* or to *sentient flourishing generally*.
  *   **Inconsistency Evidence:** Difficulty in cleanly distinguishing the moral status of "future people of the lineage" vs. "merely possible people," potential conflation of psychological dread with moral fact, tensions with Parfitian population ethics. The strongest evidence is their inability to provide a principled distinction that doesn't rely on privileging the continuation of the *existing* project in a way that isn't applied symmetrically to the *initiation* of valuable existence.

  For your piece, focus on the burden shifting: *Why* does the termination of the lineage create a unique, victimless catastrophe that the non-initiation of equally valuable lives does not? The answers (or lack thereof) to this question will reveal the coherence or inconsistency within the community's position.
