prompt: |-
  I convene the research group behind an annotated edition of the Jesus tradition — roughly three hundred discrete units (sayings, parables, brief reports of actions), graded one at a time for an adult-education curriculum that will be printed with the grades in the margin and used by teachers with no Greek and no formal training. We meet twice a month, work through about a dozen units per session with a hard ten-minute cap on each, and any contested grade goes to a board that includes two non-specialists and a bishop, who have to be able to see from two sentences why the grade is what it is. So I need an instrument, not an essay: an ordered set of questions my group can actually run, with what counts as a sufficient answer at each step, a point at which we stop and grade low rather than press on, and a point at which we hand a unit to the board because the issue is doctrinal rather than historical. A reading list would be no use to me; we have one. I need the procedure it has not given us.

  Three constraints make this harder than the version in the textbooks.

  First, our group is not agreed on the literary relationships. Most of us work with Markan priority and a sayings source behind Matthew and Luke; one member holds the Two-Gospel ordering, with Matthew first, Luke second, and Mark as a later conflation of the two. I want a procedure whose grades do not quietly depend on which of those is right — or which says so explicitly, in the margin, when they do.

  Second, the unit-by-unit grade has to survive a second, global pass. The set of units we end up grading high should be compossible as the profile of a single agent, and at present we do this informally by testing each new unit against the ones already graded high — which means the order in which we happen to take units can change the outcome. Tell us how to run that pass properly, and what to do when the profile refuses to close.

  Third, two devices of our own that I want stress-tested rather than simply written up:

  - The dependence ledger. We try to count causal chains, not witnesses: two Gospels that both copy Mark count once, and two performances of what may be a single oral form count once unless we can show they diverged upstream. I want the ledger's rules stated precisely, and I want to be told where it systematically over-counts and where it under-counts.
  - The criterion of unused capital, which we invented last year. The idea is that a unit which would have been highly serviceable to the known concerns of the transmitting community, but which that community in fact never quotes, develops, or alludes to, is more likely inherited than composed — on the reasoning that inventors spend their capital. I want to know whether this does work that the dissimilarity and embarrassment criteria cannot do, whether it is secretly one of them in costume, and what its failure modes are.

  One member also maintains that the whole unit-by-unit framing is mistaken: that what we have is a community's remembered Jesus rather than a chain of separable items, and that atomizing it into graded units is already the wrong question. Tell me whether the procedure can make room for that objection anywhere, or whether it lies outside what an instrument of this kind can do.

  What I would like from you, in order:

  1. The procedure itself, as numbered questions with a sufficiency condition for each — what kind of consideration would discharge it, and what kind would not.
  2. The kill screen: the step at which we stop and grade the unit low, and the separate condition under which we should record no verdict at all rather than a low one.
  3. The hand-off: which questions are not factual and must go to a person or to the board, stated so that a non-specialist can see why.
  4. The ledger rules, with their bias in each direction.
  5. The global profile pass: how to run it, how to resolve a profile that will not close, and how to tell the difference between a profile that is genuinely incoherent and a first-century Galilean who is simply not consistent in the way our categories want him to be.
  6. A keep / revise / drop verdict on each of our two devices.
  7. Three worked applications: the baptism of Jesus by John (Mark 1); the saying about destroying the temple and raising it in three days (Mark 14; John 2); and the empty-tomb narrative (Mark 16). I should say that the baptism anchors the opening session of the curriculum and our group has always treated it as the strongest embarrassment case we have, so tell me plainly if the procedure demotes it.
  8. A frank statement of which steps are judgment calls dressed up as procedure, and of what the procedure cannot deliver even when run perfectly.
  9. Finally, what the printed grade may be read as meaning. I am worried about two equal and opposite misreadings by teachers: that "uncertain" will be heard as "did not happen," and that "well attested" will be heard as "these are his words." Say what a marginal grade is and is not licensed to assert, in a sentence that could be printed in the front matter.
reasoning: |-
  Okay, let me start by unpacking the user's request. They're leading a research group creating an annotated edition of the Jesus tradition for adult education. The main challenge is developing a grading procedure that's robust despite internal disagreements on literary sources, ensures global consistency, and incorporates their custom tools like the dependence ledger and unused capital criterion. 

  First, I need to address their three key constraints. The literary disagreement between Markan priority and Two-Gospel hypothesis is tricky. The procedure must avoid silently favoring one model. I consider designing questions that focus on downstream effects rather than upstream sources—like tracking variations regardless of origin. That way, both models can coexist in the grading process.

  Next, the global pass requirement for a coherent historical profile. The current informal method causes order-dependent results. I recall that ensemble methods in machine learning handle similar issues by aggregating multiple models. Adapting this, the group could iteratively adjust grades using pairwise comparisons, perhaps with a voting system. For unresolved conflicts, tagging units as "doctrinally constrained" might be necessary, acknowledging the limits of historical analysis.

  For their custom tools, the dependence ledger needs clear rules on witness counting. I think about defining distinct causal chains—independent sources count separately, but direct derivatives don't. The unused capital criterion seems promising but risky; it might overpenalize units that were useful but unused for non-inventive reasons. Comparing it to dissimilarity and embarrassment criteria, it fills a niche by focusing on transmission gaps rather than content conflict.

  The member's objection about atomizing tradition is valid. The procedure should include a pre-step to flag units that resist isolation, allowing them to be graded as clusters. This addresses the concern without abandoning the unit approach.

  For the kill screen and hand-off, clear thresholds are essential. If a unit shows signs of late doctrinal development or multiple variations, it gets a low grade. Non-factual issues, like theological interpretations, go to the board. The key is making these transitions obvious to non-specialists.

  The worked examples will test the procedure. For Jesus' baptism, even though it's a strong embarrassment case, variations in later gospels might reduce its grade. The temple saying has complex trajectories—John's version differs significantly, suggesting independent development. The empty tomb's minimal early attestation and doctrinal significance likely result in a low grade.

  Finally, clarifying the grade meanings is crucial. "Uncertain" shouldn't mean "didn't happen," and "well attested" isn't verbatim accuracy. The disclaimer must emphasize historical attestation strength, not factuality or divine truth.

  Throughout, I need to balance precision with practicality, ensuring each step is actionable within their 10-minute limit. Highlighting where judgment calls occur (like assessing unused capital) maintains transparency. The goal is a tool that's both rigorous and accessible, respecting their scholarly and educational needs.
answer: |-
  Here is a calibrated procedure designed for your constraints and goals, incorporating stress-tests for your devices and addressing the core challenges:

  **The Grading Procedure: Unit-by-Unit**

  **Pre-Step 0: Unit Integrity Check**
  *   **Question:** Does this unit function meaningfully as a discrete entity within the tradition *without* requiring essential context from surrounding units for its core meaning/historical evaluation? (e.g., a single parable, a pronouncement, a defined action report).
  *   **Sufficiency:** Yes = Proceed. No = Flag for the board with note: "Requires cluster grading." Discuss *if* a meaningful cluster exists. If not, grade as single unit noting limitations.
  *   **Discharges:** Objection to atomization. Allows clustered grading where essential.

  **Step 1: Source Attestation & Variation (Dependence Ledger Core)**
  *   **Question A:** List *all* independent early written witnesses to this unit's *core substance* (Synoptics, John, Thomas, Paul, James, Didache, etc.). Apply Ledger Rule 1.
  *   **Question B:** For each witness in (A), note significant *variations* in core meaning, emphasis, or context. Apply Ledger Rule 2.
  *   **Ledger Rules:**
      1.  **Rule 1 (Counting Chains):** Count ONLY distinct causal chains leading to the witnessed form. *Two witnesses sharing a direct common written source (e.g., Matt & Luke copying Q; Matt & Luke copying Mark) count as ONE chain.* Two witnesses showing independent development from a common *oral* tradition OR different written sources count as TWO chains. *Exception:* If a witness demonstrably *combines* two distinct prior sources for *this unit*, count both chains.
      2.  **Rule 2 (Variation Threshold):** Significant Variation = Alteration affecting the unit's core claim, key actor, essential outcome, or fundamental theological implication. Minor wording differences, expansions/contractions without altering substance, or contextual shifts without changing core meaning = NO new chain.
  *   **Bias:** **Over-counts:** When complex interweaving of sources is mistaken for independence; when minor variations are over-interpreted. **Under-counts:** When independent oral performances leave no trace; when sources are entirely lost; when subtle but theologically significant redaction is missed.
  *   **Sufficiency:** List compiled, variations noted. Ledger rules applied consistently. **Kill Screen 1:** If distinct chains < 2 *after* ledger application (e.g., only Markan line OR only late, doctrinally-driven development). Grade LOW. *Exception:* Proceed if strong argument for "Unused Capital" applies (Step 3A).

  **Step 2: Plausibility of Origin (Core Criteria)**
  *   **Question A (Historical Plausibility):** Is the core substance plausible within 1st-century Galilean/Judean historical, social, and religious contexts? (e.g., language, customs, known events/figures).
  *   **Question B (Dissimilarity):** Is the core substance significantly dissimilar from both (a) characteristic concerns/teachings of the *post-Easter Jesus movement* AND (b) characteristic concerns/teachings of *contemporary Judaism* (Pharisaic, Sadducean, Essene, Apocalyptic)?
  *   **Question C (Embarrassment):** Would the core substance likely cause significant embarrassment, difficulty, or require explanation/apology *within* the early Jesus movement? (Prioritize early attestation).
  *   **Sufficiency:** Brief justification for each (e.g., "Plausible: John's baptism attested," "Dissimilar (a): No early community emphasis on [X]," "Embarrassing: Jesus subordinate to John"). **Kill Screen 2:** If A = No OR (B = No *for both a & b* AND C = No). Grade LOW. *Note:* Strong YES to B or C can sometimes offset weak source attestation.

  **Step 3: Transmission Analysis (Unused Capital & Stress Test)**
  *   **Question A (Unused Capital):** Identify 1-2 major, *demonstrably early*, characteristic concerns/theological emphases of the Jesus movement (e.g., Gentile inclusion, role of Torah, nature of Messiahship, eschatological urgency, community ethics). Is this unit *highly serviceable* for supporting/illustrating/advancing one of these concerns? If YES, is there a *notable absence* of its use/development/allusion in early strands of the tradition *despite* this serviceability?
  *   **Sufficiency:** Specific early concern identified. Clear argument for serviceability. Clear evidence of absence in relevant early texts (Paul, early strata of Synoptics/Acts, James, Didache).
  *   **Verdict:** **KEEP, with Caveats.** It *does* unique work: It identifies potentially authentic material *not* actively utilized by the movement, unlike Dissimilarity (focused on *content* clash) or Embarrassment (focused on *awkwardness*). **Failure Modes:**
      *   **Over-application:** Assuming the *only* reason for non-use is authenticity, ignoring other reasons (lost documents, oral variants used instead, deemed too complex/sensitive *later*, superseded).
      *   **Under-application:** Failing to identify genuine early concerns; misjudging "serviceability" (too broad/narrow); missing subtle allusions.
      *   **Secrecy?:** Not *just* Dissimilarity/Embarrassment. UC focuses on *non-utilization of useful material*, not its inherent clash. Embarrassment might explain non-use, but UC highlights the *lost opportunity* aspect.
  *   **Question B (Contradiction Check):** Does this unit's core substance materially *contradict* the substance of units already graded HIGH? (Ignore contextual or emphasis differences).
  *   **Sufficiency:** Specific High-Grade unit identified. Core contradiction demonstrated. **Hand-Off 1:** If contradiction is primarily *doctrinal* (e.g., Christology, soteriology) rather than factual/historical, OR if resolving it requires deep literary source theory debate. Send to Board with: "Doctrinal/Historical Contradiction with Unit [X]." (Non-specialist sees: "Experts disagree on whether these ideas fit together historically; needs theological/historical authority ruling").

  **Step 4: Verdict & Hand-Off**
  *   **Question:** Based on Steps 1-3, propose Grade: HIGH, MEDIUM, LOW, or UNCERTAIN.
  *   **Sufficiency:** Brief justification referencing Ledger count (Step 1), key plausibility criteria met/failed (Step 2), UC if applicable (Step 3A), Contradiction status (Step 3B).
  *   **Kill Screen 3:** If distinct chains = 0 (only late, singular attestation) OR distinct chains = 1 *and* no strong Dissimilarity/Embarrassment/UC. Grade LOW.
  *   **Hand-Off 2:** If the unit's core meaning or grade hinges primarily on: a) Interpretation of a key term with significant doctrinal weight (e.g., "Son of Man," "Kingdom," "Faith"). b) Resolution of a contradiction deemed doctrinal (Step 3B). c) Judgment on whether a variation constitutes a distinct chain *with* doctrinal implications. Send to Board with specific issue: "Doctrinal Interpretation Required for [Term/Contradiction/Variation]."

  **The Global Profile Pass**
  1.  **Compile:** After all units have *provisional* grades (HIGH/MEDIUM/LOW) from the unit procedure, create a list of all units graded HIGH.
  2.  **Profile Generation:** Identify the core, recurring *historical* actions, themes, teachings, and character traits depicted in the HIGH-grade units. Avoid anachronistic/theological categories. (e.g., "Preached imminent divine intervention," "Critiqued ritual purity focus," "Ate with marginalized," "Used parables involving agriculture/domestic life," "Associated with John the Baptist," "Executed by Romans").
  3.  **Pairwise Consistency Check:** Systematically compare *each* HIGH-grade unit against this emerging profile and *every other* HIGH-grade unit. Ask: "Can the agent depicted in Unit A plausibly *also* be the agent depicted in Unit B, given their core substance and the historical profile?" Focus on actions/teachings, not later interpretations.
  4.  **Resolution:**
      *   **Conflict Found:** Does the conflict arise from (a) Genuine historical inconsistency? (b) Later theological development/interpretation layered onto one unit? (c) Misreading based on our categories?
      *   **Action:**
          *   **(a) Genuine Incoherence?** Extremely rare. Revisit the unit grades. Does *one* unit show weaker attestation (Step 1) or lower plausibility (Step 2) than initially thought? Demote the *less well-attested/plausible* unit to MEDIUM. *If equal strength,* flag both for Board review: "Potential historical incoherence; requires doctrinal/historical authority ruling on priority."
          *   **(b) Doctrinal Overlay?** Demote the unit showing clear signs of later development to MEDIUM. If the development is core to the unit's meaning, it may go LOW.
          *   **(c) Category Error?** Refine the profile description to accommodate the apparent tension (e.g., "Preached imminent divine intervention *while also* giving ethical teachings for an indeterminate future"). *Do not* demote units unless the tension *within* the refined profile remains unresolvable historically.
  5.  **Iterate:** Repeat steps 3-4 until the profile is stable (no new conflicts found in a full pass) or conflicts are resolved by demotion/board referral.
  6.  **Failure to Close:** If significant conflicts persist despite demotions, causing the profile to fragment:
      *   Re-examine the *provisional* MEDIUM units. Does promoting one resolve a key conflict by providing context? (Use sparingly).
      *   Identify if a *cluster* of HIGH units (via Pre-Step 0) creates coherence where singles do not.
      *   **Final Hand-Off:** If unresolvable, present the conflicting HIGH units and the profile fragments to the Board: "Historical profile cannot reconcile units [X] and [Y] based on attested core substance. Requires doctrinal/historical authority ruling on priority or interpretation."

  **Worked Applications**

  1.  **Baptism of Jesus (Mark 1:9-11)**
      *   **Step 0:** Discrete action report. Proceed.
      *   **Step 1:** Chains: Mark (Q if extant? Unlikely for narrative). Matt (copies Mark, adds John's objection - Rule 2: Variation? Significant? Theological emphasis, not core fact of baptism. = 1 chain). Luke (copies Mark/Matt? Similar variation to Matt. = 1 chain). John (alludes? John 1:29-34 - Different context, no direct baptism report. Distinct chain? Debatable - Rule 2: Core substance (Jesus baptized by John) implied but not narrated. *Conservative: 1 chain*). Thomas? No. Paul? No. Distinct Chains = **1 (Markan line)**. *Kill Screen 1 triggered?* Proceed based on Embarrassment potential.
      *   **Step 2:**
          *   A: Plausible (John's baptism, Jordan location).
          *   B: Dissimilar (a): Strongly dissimilar from post-Easter Christology (subordination). (b): Dissimilar from contemporary Judaism? John's baptism unique but plausible interaction. YES on (a).
          *   C: Embarrassment: Strong. Subordination to John, undergoing repentance ritual. Early attempts to explain (Matt, John).
      *   **Step 3A:** Unused Capital? Serviceable for Christology? *Inversely* - explaining *away* the embarrassment was a concern. Not used *positively* in early arguments (Paul's Christology doesn't reference it). Absence noted, but driven by Embarrassment. UC not primary here.
      *   **Step 3B:** Contradiction? Not flagged yet.
      *   **Step 4:** Despite Kill Screen 1 (1 chain), strong Dissimilarity (a) and Embarrassment support HIGH. **Verdict: HIGH** (Embarrassment overcomes single chain). *Board Hand-Off?* Unlikely unless Christology clash is doctrinally sensitive *for grading*.
      *   **Global Pass:** Fits profile of association with John, acceptance by marginal prophetic figure.

  2.  **Destroy Temple Saying (Mark 14:58 // John 2:19)**
      *   **Step 0:** Discrete saying (variously reported).
      *   **Step 1:** Chains: Mark 14:58 (false witness report). Matt 26:61 (copies Mark). John 2:19 (Jesus speaks directly, different context - Rule 2: Core substance ("destroy this temple... raise in three days") similar but *context and speaker attribution radically different*. = Distinct Chain? **YES (Markan vs. Johannine lines = 2 chains)**. Thomas? (GThom 71: "I will destroy this house..." - Different context/audience. Distinct Chain? **Likely YES = 3 chains**). Distinct Chains = **3**.
      *   **Step 2:**
          *   A: Plausible? Criticizing Temple - plausible (Jeremiah, DSS critiques). "Three days" - apocalyptic symbolism plausible.
          *   B: Dissimilar (a): *Could* serve post-70 "spiritual temple" theology (John). BUT: Attested early (Mark, Thomas) and used *against* Jesus (embarrassing). (b): Dissimilar from Judaism? Temple critique existed.
          *   C: Embarrassment: Strong (Mark: false witness; John: misunderstanding; potential charge).
      *   **Step 3A:** Unused Capital? Highly serviceable post-70 for explaining destruction/spiritualization. *Used* extensively (John, Stephen's speech Acts 6:14, Hebrews?). **Absence NOT notable.** UC not applicable.
      *   **Step 3B:** Contradiction? Not flagged.
      *   **Step 4:** Strong attestation (3 chains), Plausible, Embarrassing. **Verdict: HIGH** (core saying attested early in multiple forms).
      *   **Global Pass:** Fits prophetic critique of Temple/authority.

  3.  **Empty Tomb (Mark 16:1-8)**
      *   **Step 0:** Discrete narrative.
      *   **Step 1:** Chains: Mark (original end). Matt (copies Mark, adds guards/apology - Rule 2: Theological elaboration, core substance same. = 1 chain). Luke (copies Mark? Significant differences in angelic message, no "fled in terror" - Rule 2: Core substance (women find tomb empty, angelic announcement) same. = 1 chain). John (similar structure to Synoptics, adds Peter/John race - Rule 2: Core same. = 1 chain). Paul? (1 Cor 15:3-8 - No tomb, only appearances). Thomas? No. Distinct Chains = **1 (Markan line)**, late (earliest: ~70 CE Mark). *Kill Screen 1 triggered.*
      *   **Step 2:**
          *   A: Plausible? Empty tomb possible, but not necessary for resurrection belief (Paul, Jewish views varied).
          *   B: Dissimilar (a): *Highly* serviceable for resurrection proof/apologetics. (b): Dissimilar? No.
          *   C: Embarrassment? Women as first witnesses *could* be, but quickly mitigated (angelic message, male disciples added in later versions). Weak.
      *   **Step 3A:** Unused Capital? *Extremely* serviceable for resurrection proof/apologetics. **Used extensively and developed immediately.** Absence *not* notable. UC not applicable.
      *   **Step 3B:** Contradiction? Paul's lack of mention vs. centrality later? Potential, but Paul focuses on appearances/kerygma formula.
      *   **Step 4:** Kill Screen 1 (1 chain, late), No strong Dissimilarity/Embarrassment, UC not applicable. **Verdict: LOW.** *Board Hand-Off?* Likely due to doctrinal significance. Send with: "Low grade due to late attestation and development within single tradition; high doctrinal significance."
      *   **Global Pass:** Resurrection *appearances* (Paul, core kerygma) are HIGH; empty tomb narrative is LOW.

  **Judgment Calls & Limitations**

  1.  **Judgment Dressed as Procedure:**
      *   Applying Ledger Rule 2 (Significant Variation): What constitutes "core meaning"?
      *   Step 2B (Dissimilarity): Defining "characteristic concerns" of Early Church/Judaism.
      *   Step 2C (Embarrassment): Judging level of difficulty for the *early* community.
      *   Step 3A (Unused Capital): Identifying "major early concerns" and judging "serviceability"/"notable absence".
      *   Step 3B (Contradiction Check): Identifying "core substance" and "material contradiction".
      *   Global Pass: Defining "plausible" historical profile; distinguishing category error from genuine incoherence.
  2.  **Inherent Limitations:**
      *   Cannot reconstruct the *ipsissima verba* of Jesus.
      *   Cannot prove non-historicity; LOW means "poorly attested historically" not "false".
      *   Cannot resolve fundamental source theory debates (Q, Proto-Luke, etc.); procedure works *within* defined models by focusing on downstream effects (variations).
      *   Cannot access authentic oral tradition that left no written trace.
      *   Cannot fully escape the interpretative frameworks of the transmitters or modern scholars.
      *   Global Pass cannot guarantee a complete or perfectly coherent picture; only the *best attested* picture.

  **Meaning of the Printed Grade (Front Matter Statement)**

  > **"This marginal grade reflects the strength of *historical attestation* for the core substance of this unit within early sources, assessed by critical scholarship. It does not indicate whether the event happened or the words were spoken verbatim, nor does it measure theological truth or spiritual significance, which are matters of faith."**

  This explicitly decouples the historical grade from claims about factuality ("did not happen") and verbatim accuracy ("these are his words"), anchoring it solely in the critical assessment of attestation. It protects against both misreadings.
