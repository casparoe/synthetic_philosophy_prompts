  I need to validate their insight first - this isn't a confusion but a legitimate gap. Then structure the attack: start with how functionalism claims physical states realize mental states via roles, use their rewiring case to show role assignment depends entirely on extrinsic factors, demonstrate this forces functionalism into either vacuity or circularity, and finally address possible escape routes preemptively. 

