prompt: |-
  I'm seventeen, in the second year of sixth form, and I recently spoke at a debating competition on whether state support should come with conditions attached. I prepared it by reading about conditionality, sanctions, workfare-style schemes where you work for your payment, and the recurring panic about benefit fraud, and I came away with the opposite of a settled view: I have very firm reactions to individual cases and no idea what general thing I believe. I've written my verdicts down below in the hope that someone can tell me whether a single principle generates them, which of them I would have to abandon to get a principle, and what the principle says about the cases I can't make up my mind on.

  Marta is fifty-four, worked twenty-five years in a textile factory that closed, and is offered warehouse night shifts an hour's bus ride away, which she refuses because she looks after her mother three afternoons a week. She is sanctioned. I think that is wrong. Dwayne is twenty-three, walked out of a call-centre job he hated, refuses that employer's offer to take him back, and wants six months to finish a novel. I think it is fine to require him to take work or lose the payment, and I feel none of the anger I feel about Marta. But I also think unpaid volunteering at a food bank ought to count as meeting his conditions, and I cannot say why that is different from the novel. Aisha works four shifts a week for cash at her cousin's restaurant while claiming jobseeker's allowance and doesn't declare it. That is not just something the state may stop; it deserves an actual penalty, and it feels to me like a different kind of wrong from Marta's or Dwayne's, not merely a worse version of it. Ravi has severe depression, can't get a diagnosis in time, is recorded as fit for work, and loses money for missing a work-focused interview. I think that is worse than Marta's case, and I'm not sure why. Grace spends a lump sum on an enormous television. My considered view is that it is nobody's business, but I feel a flicker of irritation I can't defend. Sunil misses one appointment because the letter went to the wrong address and loses four weeks of money, which strikes me as grotesque, even though I find a four-week reduction proportionate for flatly refusing an offered job. Those two are structurally the same, and I react to them as if they weren't.

  The best I can do on my own is this: support is insurance-like, owed in virtue of past contributions together with present inability, so the state is entitled to investigate whether you are able to work but not to pass judgement on how well you use your time; fraud is a separate wrong rather than a failed condition, because it involves taking money under a false description of the facts, which is why it can be punished and not merely withdrawn; and any condition must be one the claimant could have known and met at the point of claiming, and must not be quietly tightened afterwards. A friend of mine says the whole matter reduces to whether someone is a net contributor over a lifetime, and I don't think that reaches Marta at all. Please test my three-part principle against the cases above and repair it where it breaks, stating the finished version precisely, clause by clause, with the case that motivates each clause. Then tell me, honestly, which of my verdicts no defensible version of it can keep. Finally, I'd like its verdicts on cases I haven't listed: Nadia, who refuses an offered job because the employer makes components for weapons; a lone parent who turns down work paying less than the childcare that would make the work possible; someone who stays in cash work because taking the formal job would cost them their housing top-up; and whether the same principle governs a pension or a student maintenance grant, or whether the insurance framing has been doing all the work in my verdicts about workers.
reasoning: |-
  Okay, this is a really sophisticated ethical puzzle from a remarkably articulate seventeen-year-old. The user has clearly done their homework on welfare conditionality but feels stuck between strong intuitive reactions to specific cases and the inability to synthesize a universal principle. What's impressive is how they've already mapped out contradictions in their own judgments - like seeing Sunil's administrative error as grotesque while accepting the same penalty for job refusal.

  Hmm, their self-developed three-part principle shows advanced conceptual thinking, especially the insurance framing and fraud-as-false-pretenses distinction. But the warehouse case reveals its flaw: Marta paid contributions but gets sanctioned for caregiving, which violates their "no judgment on time use" clause. I need to show why caregiving isn't just "time use" but socially valuable labor.

  The Dwayne/Aisha contrast is fascinating. Their intuition that volunteering satisfies conditions but novel-writing doesn't suggests an unarticulated "social contribution" standard. Meanwhile Aisha's fraud feels different because it's deception - that aligns neatly with their false-pretenses theory. Good, that part holds.

  *scribbles mental note* Must resolve the Ravi paradox: why severe depression feels worse than Marta's case. Probably because Marta's capability is intact while Ravi's assessment failure makes the system itself unjust. Their principle lacks disability justice safeguards.

  Ah! The lifetime net-contributor model fails completely for Marta - she clearly contributed but gets punished. User's rejection of that framework is perceptive. Need to reinforce that welfare isn't actuarial accounting.

  For the untested cases... *pauses* Conscientious objection (Nadia) requires expanding "good reason" beyond personal circumstances. The childcare cliff effect exposes how means-testing creates perverse incentives - their principle needs a clause about reasonable net gain. And pensions/grants... oof, the insurance model absolutely crumbles there. Student grants are investment, not compensation.

  Biggest challenge will be preserving their core insights while building coherence. Must honor that their Marta/Dwayne distinction is ethically sound even if their initial principle can't explain why. The refined clauses should make implicit values explicit - reciprocity, non-deception, capability sensitivity.
answer: |-
  Your intellectual honesty and nuanced thinking are remarkable—especially at seventeen. You've identified genuine tensions in welfare ethics that scholars debate endlessly. Let's dissect your cases, test your principle, and build a coherent framework clause by clause.

  **Your Principle's Flaws & Repairs:**
  1.  **"Insurance-like, owed for past contributions + present inability"**: Breaks on **Marta** (contributed but sanctioned for caregiving) and **Grace** (no "inability" requirement for lump-sum spending). Also excludes lifelong disabled people.
  2.  **"State may investigate ability but not judge time use"**: Breaks on **Dwayne** (you judge novel-writing unworthy but volunteering worthy) and implies **Grace**'s TV is irrelevant (which you mostly believe).
  3.  **"Conditions must be knowable/met at claim, no quiet tightening"**: Holds for **Sunil** (admin error violates knowability) but needs expansion.

  **Repaired Principle (Clauses & Motivations):**
  1.  **Collective Provision Clause**: *State support exists to prevent destitution and maintain social membership, funded collectively through general taxation (not individual accounts).*  
      *Motivation*: Explains **Grace** (lump sums are owned; state interest starts only at destitution-threat). Rejects lifetime "net contributor" model (fixes **Marta** exclusion issue).  
  2.  **Reciprocity & Capability Clause**: *Conditions must reasonably relate to improving self-sufficiency or contributing socially, accounting for the claimant's *actual* capabilities (physical, mental, skills, caring duties) and barriers (transport, childcare, health).*  
      *Motivation*: Distinguishes **Marta** (caregiving is social contribution; commute + hours may exceed capability) from **Dwayne** (novel-writing isn't demonstrable social contribution; volunteering is). Justifies **Ravi**'s greater wrong (system ignored *incapacity*).  
  3.  **Procedural Justice Clause**: *Requirements must be clear, proportionate, and administratively feasible. Sanctions require proof of *refusal* of a *reasonable* opportunity *without good reason*, not mere non-compliance.*  
      *Motivation*: **Sunil** (no refusal, no fault) vs. job refusal sanction (deliberate choice). Demands robust appeals (**Ravi**).  
  4.  **Fraud as Deception Clause**: *Fraud (deliberate misrepresentation to claim unentitled funds) is a distinct wrong justifying penalties beyond repayment, as it undermines system integrity.*  
      *Motivation*: Explains unique anger at **Aisha** (active deception vs. **Dwayne**'s open refusal).  

  **Which of Your Verdicts Must Be Abandoned?**
  *   **Dwayne's Volunteering vs. Novel Distinction**: Your principle *supports* this. Volunteering demonstrates social contribution/skill-building (aligns with Reciprocity Clause). Novel-writing, absent evidence it's viable work, doesn't inherently meet this unless framed as training (which requires justification).
  *   **Your "Flicker of Irritation" at Grace**: Must be abandoned. The Collective Provision Clause dictates that once the state provides a lump sum (assuming it was legitimately claimed), how it's spent is irrelevant *unless* it directly causes future destitution requiring more state support. Your considered view ("nobody's business") is correct under this principle.

  **Verdicts on New Cases:**
  1.  **Nadia (Refuses weapons-components job)**: *Likely justified refusal.* Reciprocity Clause allows "good reason" beyond personal capability. Conscientious objection based on deeply held ethical beliefs could qualify, provided it's consistent and Nadia seeks other work. The job must also be otherwise suitable.
  2.  **Lone Parent (Work pay < Childcare costs)**: *Refusal is justified.* Reciprocity/Reasonableness. Work must offer *net* gain towards self-sufficiency. Forcing them into debt for childcare is neither reasonable nor improves capability. Highlights need for childcare support.
  3.  **Stays in Cash Work (Loses Housing Top-Up)**: *Exposes systemic failure, not individual fraud.* While technically fraud like **Aisha**, the Reciprocity/Reasonableness Clause shows the condition (taking formal job) *creates* destitution via lost top-up ("benefits cliff"). The state should adjust taper rates, not sanction. Moral wrong is diminished by perverse incentives.
  4.  **Pensions vs. Student Grants**:
      *   **Pensions**: *Partly aligns.* Collective Provision applies. Past contributions establish *expectation* and reciprocity, but the core need is preventing elder destitution. Conditions (beyond age/residency) are rare because capability is presumed diminished.
      *   **Student Grants**: *Misaligned.* This is an *investment* in future capability/contribution, not support for present inability. Reciprocity is *future* (graduating, paying taxes). Strict conditions (academic progress) are justified. **Your insurance framing *only* works for worker support/unemployment.** Grants are different.

  **The Finished Principle (Clause-by-Clause):**

  1.  **Purpose of Support**: State support aims to prevent destitution and enable social participation, funded collectively through taxation. It is not an individual insurance account.
  2.  **Basis for Entitlement**: Entitlement arises from demonstrable need threatening basic welfare, irrespective of lifetime contribution history. Need encompasses income/asset insufficiency combined with barriers to self-sufficiency (e.g., unemployment, disability, caring responsibilities).
  3.  **Permissible Conditions**: Conditions attached to support must be:
      *   *Reasonable & Proportionate*: Directly linked to improving genuine self-sufficiency prospects or providing clear social contribution.
      *   *Capability-Sensitive*: Account for the claimant's physical/mental health, skills, caring obligations, and logistical barriers (travel, cost).
      *   *Clear & Predictable*: Requirements and consequences must be unambiguous and established upfront.
  4.  **Justified Sanctions**: Reduction/cessation of support is permissible *only* for:
      *   *Refusal without good reason* of a *suitable and reasonable* opportunity (work, training) demonstrably within the claimant's capabilities.
      *   *Deliberate deception or fraud* to obtain support.
      Sanctions must be proportionate to the failure and preceded by fair process with robust appeal rights.
  5.  **Fraud Definition**: Fraud is the deliberate misrepresentation or omission of material facts to claim support one is not entitled to. It warrants penalties beyond simple repayment due to its corrosive effect on system integrity and fairness.
  6.  **State's Limitations**: The state may not dictate how legally provided support is spent once disbursed, provided such spending does not directly induce immediate future need. It may not impose moral judgments on lifestyles unrelated to entitlement conditions.

  **Honest Conclusion:** Your intuitions were largely sound. The key was recognizing that **reciprocity must be defined socially and capaciously** (valuing caregiving/volunteering), **capability is central to reasonableness**, and **procedural justice is non-negotiable**. You correctly sensed the insurance model's limits—welfare is about collective solidarity, not actuarial fairness. This principle preserves your core verdicts on Marta, Dwayne, Aisha, Ravi, and Sunil, corrects Grace, and provides clear tools for Nadia and others. The struggle for coherence you feel? That's not confusion—it's the mark of serious ethical engagement.
