answer: |-
  Below is a decision tree structured to guide students through the logical space of material constitution using concrete cases, without presupposing knowledge of named positions. It consists of 9 branching nodes (phrased as yes/no or multi-option questions) and results in 12 leaves (named positions or unnamed cells). Nodes where all surviving positions agree are marked with ⚐ (dead branches). Positions that converge on the same answers until a later node are flagged with ⚑.  

  ---

  ### **Decision Tree**  
  *Start at Node 1 and follow your answers to a leaf.*  

  **Node 1: Composition**  
  Suppose you have particles arranged as a statue. Do those particles *compose* a single object (a statue)?  
  - **Yes** → Node 2  
  - **No** → Leaf 1  

  **Node 2: When Composition Occurs**  
  (If composition happens sometimes, when?)  
  - **Always, for any arrangement** → Node 3  
  - **Only for living things** → Leaf 2  
  - **Only when it answers to human interests/purposes** → Node 3  

  **Node 3: Pre-Existence**  
  Last week, the statue’s matter was an unshaped lump. Did the statue *already exist* then?  
  - **Yes** → Node 4  
  - **No** → Node 4  

  **Node 4: Survival of Destruction**  
  One second before the artist finishes, the statue is squashed flat (destroying its shape). Does the statue *survive*?  
  - **Yes** → Node 5  
  - **No** → Node 5  

  **Node 5: Survival of Reshaping**  
  The statue is gradually reshaped into a sphere (same matter, new shape). Does the *original statue* survive?  
  - **Yes** → Node 6  
  - **No** → Node 6  

  **Node 6: Survival of Matter Replacement**  
  The statue’s molecules are replaced one-by-one (same shape, new matter). Does the *original statue* survive?  
  - **Yes** → Node 7  
  - **No** → Node 7  

  **Node 7: Co-Location**  
  At this moment, the statue and its matter (the lump) are both present. Are there *two things* in one place?  
  - **Yes** → Node 8  
  - **No** → Node 9  

  **Node 8: Relation** (if two things)  
  The statue is...  
  - **A phase/temporal part of the lump** → Node 9  
  - **A way the lump is (a mode/aspect)** → Node 9  
  - **A separate object in the same region** → Node 9  

  **Node 9: Recasting Identity**  
  The statue is melted and recast from the *same matter* in the same mold. Is the new statue *identical* to the original?  
  - **Yes** → Node 10  
  - **No** → Node 10  

  **Node 10: Reproduction Identity**  
  The statue’s *exact shape* is reproduced in *different matter*. Is the new statue identical to the original?  
  - **Yes** → Leaf 11  
  - **No** → Leaf 12  

  ---

  ### **Leaves**  
  *Positions marked ⚑ share answers until Node 8/9; differences noted in "least comfortable commitment."*  

  1. **Mereological Nihilism**  
     - *Summary:* Only particles exist; no composite objects (like statues or lumps).  
     - *Least comfortable commitment:* Statues, lumps, and all ordinary objects are illusions; only "simples arranged statuewise" exist.  

  2. **Biological Constitution**  
     - *Summary:* Only living things (e.g., organisms) are composite objects; statues don’t exist.  
     - *Least comfortable commitment:* Artifacts (statues, chairs) are not real objects—just particles arranged in useful ways.  

  3. **Identity View** (Universalist)  
     - *Summary:* The statue is identical to its matter (the lump); they are one object.  
     - *Least comfortable commitment:* The statue’s persistence conditions must perfectly match the lump’s—so reshaping destroys it, but matter replacement preserves it.  

  4. **Stage Theory**  
     - *Summary:* The statue is a momentary "stage" of the lump’s history.  
     - *Least comfortable commitment:* The statue is ephemeral—it never survives *any* change (reshaping, replacement, or squashing).  

  5. **Conventionalism** (⚑ co-location branch)  
     - *Summary:* The statue is distinct from the lump and exists only due to human interests.  
     - *Least comfortable commitment:* Whether statues (or any artifacts) exist depends entirely on our purposes—no mind-independent reality.  

  6. **Constitution View** (⚑ co-location branch)  
     - *Summary:* The statue and lump are distinct, coinciding objects; the statue depends on the lump.  
     - *Least comfortable commitment:* Two objects (statue and lump) occupy the same space at the same time, violating "one object per place."  

  7. **Perdurantism** (⚑ one-thing branch)  
     - *Summary:* The statue is a temporal part of the lump’s extended spacetime "worm."  
     - *Least comfortable commitment:* Objects are 4D wholes; the statue is just a time-slice of the lump.  

  8. **Mode Theory** (⚑ one-thing branch)  
     - *Summary:* The statue is a "mode" (non-object property) of the lump, like its shape.  
     - *Least comfortable commitment:* Statues aren’t objects—they are properties of matter, so "statue" is just a way of talking.  

  9. **Unnamed: Resilient Statue**  
     - *Summary:* The statue exists whenever its matter exists and survives all changes (reshaping, replacement, squashing).  
     - *Least comfortable commitment:* The statue persists even when flattened or reshaped—its identity ignores form and function.  

  10. **Unnamed: Ephemeral Statue**  
      - *Summary:* The statue exists *only* at the exact moment of artistic completion and is destroyed by *any* change.  
      - *Least uncomfortable commitment:* The statue is so fragile it never survives a single second.  

  11. **Unnamed: Shape Essentialism**  
      - *Summary:* The statue’s identity depends on its shape; recasting or reproduction preserves it (if shape is identical).  
      - *Least comfortable commitment:* A statue can persist through total matter replacement or melting/recas ting—even if destroyed and recreated.  

  12. **Unnamed: Matter Essentialism**  
      - *Summary:* The statue’s identity depends on its matter; recasting destroys it, but reproduction in new matter preserves it.  
      - *Least comfortable commitment:* A perfect replica in new matter is the same statue, but recasting the *same* matter is not.  

  ---

  ### **Notes**  
  1. **Unoccupied Cells** (combinatorially possible but empty):  
     - *N3:Yes + N4:No + N5:No + N6:Yes + N7:No*: Incoherent (claims statue existed pre-creation but doesn’t survive destruction).  
     - *N3:No + N4:Yes + N5:Yes + N6:No + N7:Yes*: Unattractive (statue survives squashing/reshaping but not replacement, yet is co-located).  
     - *N9:Yes + N10:Yes*: Unexplored (statue survives recasting *and* reproduction; no clear advocate).  

  2. **Indistinguishable Positions** (⚑ flags):  
     - *Perdurantism, Mode Theory, and Conventionalism* converge until **Node 8/9**. They agree the statue is short-lived, shape-dependent, and not co-located, but diverge on *what the statue is* (temporal part, mode, or interest-relative object).  
     - *Constitution View and Conventionalism* converge until **Node 9/10**. They agree on co-location and persistence but diverge on *grounds for distinctness* (metaphysical constitution vs. human interests).  

  3. **Dead Branches** (⚐ nodes where all agree):  
     - **Node 4**: All positions that reach Node 4 agree the statue *does not survive* being squashed (if they deny pre-existence).  
     - **Node 10**: All positions that reach Node 10 agree the statue is *not identical* to a replica in new matter.  

  ---

  ### **Efficiency Assessment**  
  - **Most classificatory work**: **Node 1 (Composition)**. It splits nihilism/realism and forces radically different paths (e.g., nihilism vs. universalism vs. biologism).  
  - **Least work**: **Node 4 (Survival of Destruction)**. Answers are predictable from Node 3 (pre-existence): "No" dominates if pre-existence is denied. If space is tight, collapse Node 4 into Node 3 (e.g., "Did the statue exist pre-creation *and* survive squashing?" with 3 options).  

  The tree isolates core commitments (e.g., co-location, essentialism) without jargon. For brevity, merge Nodes 3–4 or drop Node 10 (reproduction), as Node 9 (recasting) often suffices.
