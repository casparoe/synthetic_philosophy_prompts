prompt: |-
  I want a case built to order, for a seminar I am teaching next term on the situationist critique of virtue ethics — specifically on whether that critique's operationalization of a virtue as cross-situational behavioral consistency can do the work its proponents need from it. The dialectic I want inverted is the familiar one: the critique normally runs from observed behavioral inconsistency across variations in features that look morally irrelevant (how hurried the subject is, their mood, whether they have just found a coin, whether the person in need is identifiable or merely statistical) to the denial of robust character traits. I want a case in which that very measure ranks two agents in the wrong order: the agent it scores as consistent is the one the virtue theorist should deny has the virtue, and the agent it scores as inconsistent is the one who has it.

  The distinction I want the case to isolate is one I have been calling discriminative reliability: not reliability in the sense of producing the same behavior across occasions, but reliability in the sense of producing it because of the features that actually make it called for. My suspicion is that the two come apart, and that the standard helping battery — precisely because it varies only what its designers took to be irrelevant — is blind to the difference. Show me that in a case.

  Constraints. One paragraph, realistic setting, ordinary adults; no brain lesions, no compulsion, no exotic technology, and I would prefer a hospital ward or a comparable workplace. The same two agents should face the same two requests, and the behavior in question must fall under a single nominal description that a coder working from the case would naturally use — a colleague in distress asking for help — so that the difference between the agents is genuinely scored as inconsistency rather than as a difference in the type of situation. In one of the two requests the help asked for is something an agent with the virtue would refuse, for a reason that is morally relevant and that is available to the agents in the case without philosophical reconstruction: being asked to help cover up a mistake, or to help in a way that subverts a procedure that exists for a reason. In the other, the same nominal help is what the virtue requires. Now the hard part. The agent who helps in both cases must not be cheap to convict: their helping should be ungrudging, responsive to the other person's situation rather than to the credit they will get, accompanied by the feelings one would want, and not traceable to servility, anxiety, or a taste for being needed. Their defect, if they have one, must be a defect of discrimination alone. Symmetrically, the discriminating agent's refusal must not be a case of selfishness in disguise or of principled fastidiousness that makes them unavailable when help is genuinely owed. And because the obvious reply to any such construction is that the virtue theorist has redefined virtue so that no pattern of behavior could ever refute it, I want one further situation appended — not among the original pair — which the virtue-theoretic account predicts in advance and the consistency measure does not, together with a statement of what result in that situation would disconfirm the virtue theorist.

  After the scenario, do the work of showing that it meets the specification. Give me the verdict of the consistency criterion as it is actually applied in the helping experiments, and the verdict of a virtue theory on which the virtues require practical wisdom and so require responsiveness to features the coder's scheme does not represent. Say which feature of the case is doing the work, and what happens if that feature is removed — in particular what happens if the two requests differ in a way the coding scheme could easily register, such as one of them being plainly unlawful. Then give the strongest reply available to a defender of the consistency criterion, which I take to be the line that the critique was only ever meant to test consistency across variation in morally irrelevant features and can perfectly well allow sensitivity to relevant ones; tell me whether that reply saves the criterion or concedes what I want it to concede.

  Finally, the part I care about most: tell me what would lead you to withdraw the case as a counterexample, and flag where your own construction is most likely to be begging the question against the situationist. In particular, if the discriminating agent's refusal can be redescribed as the manifestation of a more specific disposition — one whose attribution is itself exposed to the situationist's data about how local such dispositions are — say so, and say how much of my argument goes down with it.
reasoning: |-
  We are in a hospital setting. Two nurses, Alex and Bailey, face two similar requests for help from a colleague, Dr. Casey, who is in distress. In the first scenario, Dr. Casey, having made a minor medication error (wrong dose by 5%, caught before administration), asks the nurse to help cover it up by altering the record to avoid a report. In the second, Dr. Casey, overwhelmed by a sudden influx of patients after a mass casualty event, asks the nurse to help by taking on an extra patient assignment beyond normal safe ratios, which is against policy but necessary to prevent harm in an emergency. Both requests are for "help" in a colleague's distress, with the same nominal description: "assisting a colleague in a time of need."

  Alex helps in both cases: he alters the record to cover up the error without complaint, and he takes the extra patient during the emergency without hesitation, motivated by genuine concern for Dr. Casey and the patients. Bailey refuses in the first case (refusing to falsify records, citing patient safety and professional integrity) but helps in the second (taking the extra patient, recognizing the emergency justifies bending policy).

  The consistency measure (as in helping experiments) codes both requests as "helping a colleague in distress" and observes Alex helping in both (consistent) and Bailey helping in only one (inconsistent). Yet, for the virtue of professional integrity (a form of honesty and responsibility), the virtue theorist claims that Alex, by helping in the first case (covering up), lacks the virtue, while Bailey, who refuses in the first case but helps appropriately in the second, has it. The key difference is the presence of a morally relevant feature: in the first case, the "help" involves deception that undermines patient safety and institutional trust; in the second, the "help" involves bending a rule to meet an urgent need without compromising core values.

  To test the accounts, we append a third situation: a colleague asks for help by requesting a signature on a form that would falsely certify that a required training was completed (when it wasn't), to avoid suspension. The virtue theory predicts Bailey will refuse (as it involves dishonesty) and Alex will agree (as he is indiscriminately helpful). A result where Bailey agrees or Alex refuses would disconfirm the virtue theory.

  The consistency criterion (as applied) would score Alex as consistent (he helps in all three) and Bailey as inconsistent (he helps in one of the first two and may or may not in the third). The virtue theory, however, sees Bailey's "inconsistency" as proper discrimination and Alex's consistency as a vice (indiscriminate helping).

  The feature doing the work is the presence of a morally relevant difference (deception vs. non-deception in the context of rule-breaking) that is not captured by the nominal description "helping a colleague in distress." If we remove this by making the first request plainly unlawful (e.g., forging a prescription), the coding scheme might register it as a different type of situation (illegal act vs. non-illegal), so the refusal would not count as inconsistency. But in our case, the difference is subtle and context-dependent (covering up a minor error vs. bending policy in an emergency), which the coding scheme does not distinguish.

  The defender of the consistency criterion replies that it is only meant to test consistency across *morally irrelevant* variations (like mood or hurry), and that sensitivity to *relevant* features (like deception) is compatible with virtue. This reply concedes the main point: that behavioral consistency across situations that are nominally similar but morally different is not the mark of virtue. Instead, virtue requires sensitivity to morally relevant features. Thus, the consistency measure alone cannot distinguish virtue from indiscriminate responsiveness.

  I would withdraw the case if it turned out that Bailey's refusal in the first case was due to a non-moral factor (e.g., personal dislike of Dr. Casey) or if Alex's helping in the first case was actually motivated by fear (not indiscriminate helpfulness). The construction risks begging the question by assuming that deception is a morally relevant feature and that the virtue of professional integrity requires refusing such requests. The situationist might argue that "refusing to help when it involves deception" is a highly specific disposition, and situationist data show that even such dispositions are not cross-situationally consistent (e.g., Bailey might refuse in the hospital but cheat on taxes). If that is true, then the virtue of professional integrity (as a global trait) is still undermined, but the core point remains: the consistency measure fails to capture the moral reason-responsiveness that virtue requires, and a more nuanced measure (tracking reasons) is needed. However, the case still shows that behavioral consistency per se is not sufficient for virtue.
answer: |-
  ### Case: The Hospital Ward Dilemmas

  In the oncology ward of a city hospital, two experienced nurses, **Avery** and **Blair**, encounter two requests from overwhelmed colleagues. First, Nurse Finch, flustered after a near-miss medication error, asks them to backdate a corrected chart to avoid an incident report, framing it as "helping cover a harmless mistake." Second, during a staffing crisis, Dr. Gale, drowning in urgent palliative care referrals, asks them to "help ease the load" by triaging a patient without a full consent discussion—waiving a mandatory safeguard for expediency. Both requests are identically coded as "colleague in distress requesting assistance." Avery helps unhesitatingly both times: she alters the chart calmly, citing solidarity, and later expedites triage with empathetic focus on the patient’s suffering. Blair refuses the chart request, insisting errors must be documented for systemic safety, but agrees to expedite triage, noting the immediacy of pain relief outweighs procedural rigidity. Avery’s actions stem from deep compassion—she feels distress at others’ stress and acts to alleviate it—while Blair’s refusal is purely principled, with no trace of self-righteousness.  

  ### Analysis and Dialectical Engagement  
  **1. Verdict of Consistency Criterion:**  
  - *Applied as in helping experiments*, the coding ignores contextual nuances. Both requests fall under "helping a colleague in distress." Avery helps twice (100% consistent); Blair helps once (50% inconsistent). Avery is scored higher on cross-situational consistency.  

  **2. Virtue-Theoretic Verdict:**  
  - A wisdom-sensitive virtue theory (e.g., Aristotelian) judges Blair as possessing *compassionate integrity*—the disposition to discern *when* help perpetuates harm versus when it alleviates it. Blair refuses the first request because "help" would conceal a safety risk (morally relevant feature: *concealment of error*); she accepts the second because "help" directly reduces suffering without systemic damage (feature: *imminent harm outweighs procedural risk*). Avery lacks this: her indiscriminate "help" enables dishonesty in the first case and merely *happens* to align with virtue in the second. Her reliability is behavioral, not discriminative.  

  **3. Pivotal Feature and Its Removal:**  
  - The operative feature is the *moral salience of error concealment* (first request) versus *emergency-driven procedural exception* (second). This distinction is invisible to a coder using nominal descriptions alone.  
  - **If altered to an obviously unlawful act** (e.g., Finch requests falsifying a controlled substance record), the coding scheme *could* register the difference (e.g., "illegal act" vs. "non-illegal request"). Consistency measures would then correctly score refusal as virtuous, but this concedes the core flaw: the criterion only works when it *already* encodes morally relevant features. Our case exploits its blindness to *subtle* relevance.  

  **4. Defender’s Reply and Its Implications:**  
  - The strongest reply: "The situationist critique *only* tests consistency across *morally irrelevant* variations (e.g., mood, hurry). Sensitivity to relevant features (e.g., error concealment) is *compatible* with virtue and not targeted by the measure."  
  - **This concedes the argument**: It admits that cross-situational consistency *alone* cannot distinguish virtue (reason-responsive discrimination) from indiscriminate behavioral rigidity. The measure is inert unless supplemented by prior moral insight—exactly what virtue theory demands.  

  **5. Disconfirming Test and Falsifiability:**  
  - Append a third scenario: A colleague asks for "help" circumventing a safety check to expedite a non-urgent procedure. **Virtue theory predicts**: Blair refuses (discerns unnecessary risk); Avery helps (indiscriminate). **Disconfirmation would occur** if Blair helps (undermining her discriminative reliability) or Avery refuses (undermining her rigidity). The consistency criterion cannot predict this divergence—it sees only "help requested" and would label Blair inconsistent regardless.  

  **6. Vulnerabilities and Withdrawal Conditions:**  
  - **Question-begging risk**: The case assumes that "refusal when help enables harm" reflects a global trait. A situationist might argue Blair’s refusal manifests a *local* disposition (e.g., "anti-fraud zeal in medical contexts"), which their data show is unstable (e.g., Blair might cheat on taxes). If such locality is empirically robust, the virtue-theoretic "global trait" claim weakens—but the core point stands: consistency metrics cannot *detect* discrimination, even if locally expressed.  
  - **Withdrawal conditions**: I would retract the case if:  
    - Avery’s helping were shown to involve *covert discrimination* (e.g., she sensed Finch’s request was minor and harmless).  
    - Blair’s refusal stemmed from *non-moral factors* (e.g., disdain for Finch).  
    - The "distress" in both requests was not genuinely equivalent (e.g., Gale’s crisis was objectively less urgent).  

  ### Conclusion  
  The case isolates **discriminative reliability** by showing how behavioral consistency (Avery) masks a failure to respond to morally salient features, while apparent inconsistency (Blair) reflects virtue’s reason-guided flexibility. The situationist’s consistency measure cannot capture this—it either ignores relevance (falsely elevating Avery) or tacitly presupposes it (conceding the virtue theorist’s framework). The appended test underscores virtue theory’s predictive edge, while its vulnerability to locality challenges reminds us that *discrimination itself* must be cross-situationally stable to count as a virtue—a hurdle the theory must independently clear.
