answer: |-
  ## Joint Statement on Criteria of Authenticity in Historical Jesus Research

  **Preamble:** We, a scholar generally optimistic about the utility of the traditional criteria of authenticity and a scholar generally sceptical of their capacity to establish authenticity, have engaged in sustained discussion. While significant differences remain, we agree on core premises about the sources, goals, and limitations of historical inquiry into Jesus of Nazareth. This document outlines our common ground and precisely delineates our ongoing disagreements for further investigation. We affirm the shared goal of responsible historical reconstruction.

  ### Section 1: Agreed Foundational Claims

  1.  **Nature of the Sources:** The primary sources for Jesus (canonical gospels, non-canonical texts like Thomas, Pauline references) are complex literary products of early Christian communities. They reflect theological interpretation, communal needs, and narrative crafting, not verbatim transcripts or disinterested biography. They incorporate traditions of varying age and character.
  2.  **Source Development:** The traditions about Jesus underwent a period of oral transmission and communal shaping before being written down. This process involved selection, adaptation, and development, making it impossible to assume the gospels directly mirror the "ipsissima verba" or exact deeds of Jesus.
  3.  **Epistemic Goal:** The historian's task is to offer the *most plausible historical explanation* for the existence and character of the traditions about Jesus within his 1st-century Jewish context in Roman Palestine. This involves inference to the best explanation given the available evidence and its constraints.
  4.  **Limitations of Knowledge:**
      *   We cannot recover Jesus' inner psychological state, motivations, or "self-understanding" with the precision often sought in modern biography.
      *   We cannot achieve absolute certainty about any specific saying or deed attributed to him.
      *   The tradition is not "transparent"; layers of interpretation separate the historian from the historical figure.
      *   The "burden of proof" lies with claims about what Jesus likely said or did; the default position is often uncertainty.
  5.  **Essential Context:** Any plausible reconstruction of Jesus must be intelligible within the diverse landscape of Second Temple Judaism and the specific socio-political realities of 1st-century Galilee and Judea. Ignoring this context renders reconstruction historically meaningless.
  6.  **Role of the Criteria:** The traditional criteria (dissimilarity, embarrassment, multiple attestation, coherence, Semitic linguistic phenomena, Palestinian environmental plausibility) are methodological tools *employed* by historians. Their validity and utility are subjects of debate, not self-evident facts.
  7.  **No "Privileged" Access:** Neither side claims exclusive access to truth or denies the complexity of the task. Both acknowledge the challenges posed by the nature of the sources and the historical distance.

  ### Section 2: Residual Disagreements - Defined Cruxes

  | Crux # | Core Question                                                                                                                          | Criteria-Optimist Position (in their words)                                                                                                                                                                 | Criteria-Sceptic Position (in their words)                                                                                                                                                                 | Agreed Test/Argument                                                                                                                           | Optimist's Prediction                                                                                                          | Sceptic's Prediction                                                                                                                              | Notes on Disagreement                                                                                                 |
  | :----- | :------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------- |
  | **1**  | **Logical/Probabilistic Independence:** Are the criteria distinct, non-overlapping tools whose convergence provides strong confirmation? | "When applied rigorously and with awareness of potential pitfalls, the criteria function as distinct analytical lenses. Their independent convergence on a tradition significantly increases confidence in its historicity." | "The criteria are deeply interdependent. Source criticism underpins multiple attestation, judgements about 'embarrassment' or 'dissimilarity' depend on prior assumptions about context and community, and 'coherence' often relies on results from other criteria. Their convergence is often circular." | **Argument:** Analyze the logical structure of applying criteria to specific, contested pericopes. Can criteria be applied without presupposing results dependent on others (e.g., source criticism for attestation, prior judgements about the community for dissimilarity/embarrassment)? | Careful application will reveal distinct, non-circular pathways for each criterion to contribute independently to the assessment. | Analysis will consistently reveal that applying one criterion inherently relies on assumptions or judgements derived from the application (or presupposition) of others. | **Primarily Methodological.** Focuses on the logical structure of inference.                                          |
  | **2**  | **Unit of Assessment:** Is the individual pericope the best unit for applying criteria, or should criteria be applied holistically to a broader narrative profile? | "Focusing on individual pericopes allows for precise application of criteria to specific units of tradition. Building a reliable profile requires establishing reliable individual elements first."             | "Isolating pericopes ignores narrative context and theological shaping. A holistic profile based on broad themes and actions within the reconstructed Jewish context offers a more plausible framework; criteria applied only to individual units risk distortion." | **Test:** Take a core theme (e.g., Kingdom of God pronouncements, conflict with authorities). Compare results from: (a) applying criteria atomistically to individual sayings, then building a profile; (b) constructing a plausible contextual profile first, then assessing individual sayings for fit. | The atomistic approach will yield a coherent, plausible core profile consistent with the holistic approach, validating the focus on pericopes. | The atomistic approach will yield fragmented, potentially contradictory results less coherent within the Jewish context than the holistic profile. | **Empirical/Methodological.** Outcome depends on analysis of specific themes and their coherence.                      |
  | **3**  | **Terminology & Goal:** Should the goal be establishing "authenticity" or assessing "historical plausibility" within the Jewish context? | "The term 'authenticity,' while imperfect, signifies an inference that a tradition likely originates with Jesus *distinct* from later community development, achievable via criteria. Plausibility is a necessary but insufficient baseline." | "'Authenticity' implies a false precision and an impossible separation of Jesus from the community preserving him. 'Historical plausibility' within a rigorously reconstructed 1st-century Jewish context is the only attainable and meaningful historical goal." | **Argument:** Is the distinction substantive or semantic? Can criteria actually isolate material *distinctly* from the early community (per optimist), or do they only assess likelihood within the tradition's development (per sceptic)? | Criteria *can* identify material unlikely to originate solely within the early community, pointing back to Jesus. | Criteria assess likelihood *within* the stream of tradition; they cannot reliably isolate a point *before* significant community shaping began. | **Potentially Verbal/Substantive.** Depends on whether "authenticity" *requires* isolation from community influence. |
  | **4**  | **Calibration:** Could the criteria be empirically tested/calibrated using traditions of known provenance?                              | "In principle, yes. Applying the criteria to a sufficiently large corpus of sayings attributed to a later figure (e.g., a Hasidic master, a modern founder) where genuine vs. community-developed traditions can be reasonably discerned via other means would allow testing the criteria's 'recovery rate'." | "The analogy fails. The Jesus tradition's unique combination of oral transmission, rapid theological development, diverse source forms, and lack of contemporary controls makes it fundamentally incomparable to any modern or later corpus for calibration purposes." | **Test (Hypothetical):** If a feasible corpus with discernible "authentic" vs. "developed" traditions were identified, apply criteria blindly and measure success rate. | If calibrated, the disciplined application of multiple criteria in combination would yield a recovery rate significantly above random chance. | Any calibration attempt would either fail due to lack of a valid analogous corpus or show the criteria perform no better than informed intuition/other methods. | **Empirical (though currently impractical).** Sceptic doubts the test premise is possible.                                |
  | **5**  | **"Thinness" of Results:** Does the limited number of traditions deemed "authentic" indicate a methodological defect or a correct epistemic posture? | "The rigorous application of criteria necessarily yields limited results, reflecting the inherent difficulty and the need for methodological discipline. This 'thinness' is a strength, marking reliable historical bedrock." | "The extreme selectivity driven by the criteria produces an implausibly minimal and distorted picture of a figure who clearly inspired a major movement. This 'thinness' reveals the criteria's inherent tendency to exclude material integral to the historical Jesus." | **Argument:** Does the "criteria-positive" core provide a sufficient and plausible explanation for the emergence and character of the early Jesus movement within Second Temple Judaism? | The core, though limited, provides a coherent and powerful catalyst sufficient to explain the movement's key features. | The criteria-positive core is too thin and idiosyncratic to explain the movement's breadth and development; essential aspects of Jesus' impact are excluded. | **Substantive.** Concerns the explanatory power of the reconstructed core.                                             |

  ### Section 3: Conditions for Abandoning Core Positions

  *   **Criteria-Optimist:** "I would abandon my position if a systematic analysis demonstrated that the criteria, even when applied with maximum discipline and in combination, consistently fail to identify traditions that strong independent evidence (e.g., newly discovered, reliably dated sources completely independent of the Jesus movement) confirms as originating with Jesus, or consistently affirm traditions such evidence clearly falsifies. If criteria proved no better than random selection in such a test, they would be invalid."
  *   **Criteria-Sceptic:** "I would abandon my core scepticism if a methodologically rigorous calibration study (on a genuinely analogous corpus) demonstrated that the criteria *in combination* could reliably isolate traditions originating with a founding figure from those developed by the early community at a rate significantly exceeding alternative historical methods or informed intuition, *and* if this method yielded a coherent, contextually rich portrait of Jesus demonstrably necessary to explain the early movement."

  **Closing:** We offer this document not as a resolution, but as a map. By clarifying our agreements and precisely defining our disagreements – including the nature of the tests or arguments that could potentially resolve them – we hope to move the conversation beyond stalemate. We invite others to engage with these defined cruxes, contributing to a more nuanced understanding of the possibilities and limits of reconstructing the historical Jesus. Our shared commitment remains the pursuit of responsible historical knowledge.
