prompt: |-
  I run the talks programme for a small local history society, and I also sit in on a reading group that's slowly grinding through philosophy of history — we did Carr a while back (the bit where the facts of the past only become facts *of history* once some historian calls them up, which struck me as obviously right and also obviously a bit of a dodge), we've got the old Ranke idea that you can just show the past as it actually was on the reading list, and someone keeps saying we should do Hayden White next. Anyway, there's a thing I keep noticing in the actual history books I read that I don't have a word for, and Google hasn't helped.

  Take any two recent books on the same event — say the end of a communist regime, or a revolution, or a company's collapse. At the level of the individual sentence they agree almost completely: dates, who was in the room, what the decree said, what the harvest or the balance sheet actually was. The footnotes check out. But the books tell completely different stories. One starts in 1956 and the other in 1985. One treats the harvest figures as the thing that moved history and the other treats three people's bad decisions in one week as the thing that moved it. One gives a famine four pages and the other gives it a subordinate clause ending in a semicolon. One ends when the wall comes down and the other runs four years past it. And nobody ever argues about the page-count thing directly, even though it seems to me to be doing most of the work. Now the part I actually want a word for: when a reviewer says a book has left something out — a faction, a province, a whole decade — the author very often fixes it in the second edition. The material goes in, sometimes as a couple of new paragraphs, sometimes as a long discursive footnote. And the story doesn't change. At all. The new fact gets absorbed into the existing shape without disturbing it; it sometimes even makes the shape feel more solid, because now the author has obviously dealt with the objection. But the reviewer's original complaint is still as live as it was before, and it was never really about the missing item anyway. I've now watched this happen enough times that I treat it as a rule: correcting the factual content of a historical account and changing what the account is *about* are, as far as I can tell, entirely decoupled operations — and working historians seem to know this perfectly well while continuing to argue as though the facts were going to settle something.

  So: is there a name for that, and a literature on it? I mean specifically the absorption property — you can add true material to an account without the account having been wrong about anything, and without its overall claim changing. I don't think I'm after "historical facts are selected" (sure, but selection is about what gets pulled in, whereas this is about what happens to material *after* it's been pulled in), and I don't think I'm after underdetermination of theory by evidence either, because in science new data sometimes does force you to drop the theory and I genuinely can't think of a case where a corrected detail forced a historian to retell the story. Please don't just hand me a label — I want to know whether this is one thing or two or three (the space-allocation thing may be separate from the absorption thing), what the nearest established concepts are and exactly where each of them falls short of what I've described, and what a case where correction *did* force a reshaping would even look like, so I'd recognise one if I saw it. And if there's nothing established, what would you call it and how would you define it so it doesn't just collapse into "narratives have shapes, obviously"?
reasoning: |-
  Okay, the user runs a talks program for a local history society and participates in a philosophy of history reading group. They've covered Carr and Ranke, with Hayden White on the horizon. Their main query is about a pattern they've noticed in history books: two accounts can agree on facts but tell different stories due to varying focus, scope, and emphasis. The user is particularly interested in how adding missing facts in subsequent editions doesn't change the overarching narrative, a phenomenon they call the "absorption property."

  First, I need to unpack their observation. They mention that factual corrections or additions in revised editions don't alter the core narrative. The example given is reviewers pointing out omissions, authors adding content, but the story remains unchanged. The user wants to know if there's a term for this and related literature. They explicitly reject "selection of facts" and "underdetermination" as insufficient because those don't address the post-inclusion behavior of facts.

  Key elements from the query:
  1. **Narrative Resilience**: The narrative structure remains intact despite new facts.
  2. **Decoupling**: Factual accuracy and narrative framing are separate.
  3. **Absorption Property**: New information is incorporated without disrupting the existing narrative, sometimes strengthening it.

  I recall Hayden White's work on historical narratives as literary constructs. His concept of employment (from *Metahistory*) explains how historians shape events into story types (tragedy, comedy, etc.). Adding details might not change the plot structure. For example, adding a famine as a footnote could still fit a political narrative.

  Paul Ricoeur's narrative identity and hermeneutics also come to mind. He discusses how narratives integrate events into a cohesive whole. Ricoeur’s idea of "employment" (borrowed from Aristotle and expanded) involves configuring events into a meaningful story. New facts get reconfigured into the existing plot without altering its essence.

  Frank Ankersmit's narrative substances suggest that the narrative itself is an entity beyond individual facts. The "narrative substance" persists even when facts are added or corrected. This aligns with the absorption property where the core argument remains unchanged.

  Mark Bevir's intentional contextualism might be relevant too. Historians interpret actions based on intentional contexts, and adding facts might just fill gaps without shifting the overarching intentions they emphasize.

  Now, considering why existing terms don't fully cover the user's observation:
  - **Selection/Emphasis**: Carr's "selection" is about choosing facts, not how they're integrated post-inclusion.
  - **Underdetermination**: Scientific theories can be overturned by new data; historical narratives rarely are. The user notes historians don't retell stories due to corrected details.
  - **Narrative Coherence**: This is broader; the user wants the specific mechanism of absorption.

  Possible gaps in literature: While White and others discuss narrative structures, the exact process of absorbing new facts without narrative change might not be explicitly named. The user’s "absorption property" could be a novel synthesis of these ideas.

  Term suggestions: "Narrative Incorporation," "Hermeneutic Assimilation," "Employative Absorption." Defining it as the process where new data is integrated into an existing narrative framework without altering its fundamental structure or argument.

  Cases where correction forces reshapes: If new evidence challenges a key causal link (e.g., a letter proving a different motive), it might force narrative change. But such instances are rare compared to the norm of absorption.

  Addressing user's deeper needs: They seek conceptual tools to articulate this phenomenon in their reading group, possibly to bridge theory (Carr, White) with practical historiography. They might want to foster deeper discussions on how narratives function beyond factual accuracy.
answer: |-
  This is a brilliantly observed phenomenon that cuts to the heart of how historical narratives function – and you're right, it's distinct from simple "selection" or "underdetermination." While there isn't a single, universally accepted term for *precisely* what you're describing, several established concepts come close, and the gaps between them and your observation are illuminating. Let's break it down:

  **Core Concepts & How They Relate (and Fall Short):**

  1.  **Narrative Employment (Hayden White):**
      *   **What it is:** White's central concept (especially in *Metahistory*). Historians don't just report facts; they *emplot* them. They impose a story structure (tragedy, comedy, romance, satire) on the chronicle of events. This structure determines what events are meaningful, how they are linked causally, and what the overall "point" or moral of the story is.
      *   **Relates to your observation:** This is the fundamental reason why **the "space-allocation thing" happens.** Why start in 1956 vs. 1985? Because the chosen plot (e.g., "The Long Decline" vs. "The Sudden Collapse") requires that starting point to establish the necessary background or trigger. Why give a famine 4 pages vs. a clause? Because in one plot, it's a tragic consequence or root cause; in another, it's an unfortunate backdrop to the *real* political drama. The *story* being told dictates the selection *and* the emphasis.
      *   **Falls short for "absorption":** While employment explains the initial shaping, White doesn't explicitly focus on the *resilience* of that plot structure when new facts are added *later*. He's more concerned with the initial construction. Your observation shows that the plot structure is remarkably robust *against* factual supplementation.

  2.  **Hermeneutic Circle (Gadamer, Applied to History - Ricoeur):**
      *   **What it is:** Understanding a whole text (or history) requires understanding its parts, but understanding the parts requires a preliminary understanding of the whole. It's iterative. In history, we approach the past with a pre-understanding (a hypothesis, a framework, a question), which shapes how we see the evidence; encountering evidence then refines or challenges that pre-understanding, leading to a revised whole, and so on.
      *   **Relates to your observation:** The "overall claim" or "shape" you describe is the "whole." The individual facts are the "parts." The historian's initial framework (their argument, their plot) heavily influences how new facts are interpreted and incorporated. A fact added to address a criticism is slotted in *within the existing understanding of the whole*.
      *   **Falls short for "absorption":** The hermeneutic circle *allows* for the whole to be fundamentally transformed by new parts (a paradigm shift). Your observation is that in historical practice *as you've witnessed it*, this transformation often *doesn't* happen when adding specific missing facts. The circle spins, but the center holds firm. The framework *assimilates* rather than *adapts*.

  3.  **Narrative Substance / Narrative Interpretation (Frank Ankersmit):**
      *   **What it is:** Ankersmit argues that historical narratives aren't just collections of statements about the past; they are holistic "narrative substances." This substance *is* the interpretation itself – the unique lens through which the past is presented. The meaning resides in the *entire configuration*, not just the sum of its factual parts. Changing a part might alter the substance, or it might not, depending on how central that part was to the overall configuration.
      *   **Relates to your observation:** This is very close. The "shape" you describe *is* the narrative substance. Ankersmit acknowledges that narrative substances are relatively stable entities. Your "absorption property" demonstrates this stability in action: adding factual details often functions as *elaboration* or *reinforcement* of the existing substance ("See, even *this* new detail fits my interpretation!") rather than a challenge necessitating a new substance. The "correcting without changing what it's about" highlights that the substance (the *aboutness*) is distinct from the factual substrate.
      *   **Falls short?** Ankersmit provides the best conceptual framework here. The gap is mainly one of emphasis: he focuses on the nature of the substance itself, while you've precisely identified a specific *behavior* of these substances – their capacity for **Assimilative Elaboration** without structural change. He might not explicitly name this resilience against *additive* challenges as distinct from *contradictory* challenges.

  4.  **Colligation (W.H. Walsh / Later Developments):**
      *   **What it is:** Explaining an event by showing how it "fits in" to a larger pattern, trend, or concept (e.g., "The Renaissance," "The Industrial Revolution," "The Cold War"). The historian "colligates" events under a unifying idea.
      *   **Relates to your observation:** The choice of *which* colligating concept is central (e.g., "Economic Decline" vs. "Political Miscalculation") drives the selection of facts, the starting/ending points, and the emphasis (page count). The "shape" is defined by the chosen colligation.
      *   **Falls short for "absorption":** Like employment, it explains the initial shape but doesn't directly address the resilience when adding new facts *within* the scope of that colligation. Adding details about a neglected province might just be "filling out" the existing colligated picture ("See, the economic decline affected *this* region too") without altering the core concept.

  **Addressing Your Specific Queries:**

  1.  **Is this one thing or more?** It's fundamentally **one core phenomenon (Narrative Resilience/Substance Stability) manifesting in two key ways:**
      *   **A. Selective Framing/Emphasis (Space Allocation, Scope):** Driven by initial choices of Employment/Colligation/Narrative Substance. *This sets the initial shape.*
      *   **B. Assimilative Elaboration (The Absorption Property):** The *behavior* of that pre-existing frame/substance when confronted with *additive* factual supplementation (often prompted by criticism). The frame acts as a mold, shaping how the new material is incorporated without itself being reshaped. These are two sides of the same coin: the frame's strength allows absorption, and absorption demonstrates the frame's strength.

  2.  **Why "Underdetermination" isn't quite right:**
      *   You nailed it. Underdetermination (Quine, Duhem) says many theories can fit the same data. Your observation goes further: **a *single* narrative frame/substance can often accommodate *more* data (the added facts) without changing.** It's about the *elasticity* or *assimilative capacity* of a *specific* narrative framework once established, not just the existence of multiple possible frameworks. Scientific theories often reach points where new data breaks them (e.g., Newtonian physics vs. Mercury's orbit). Historical narrative substances seem far more flexible in *absorbing* additions without breaking.

  3.  **What would a "reshaping due to correction" look like? (Recognizing the Exception):**
      *   It's rare for *factual additions* alone to force this, but it *can* happen if the new fact fundamentally undermines a **causal link** or **central premise** essential to the narrative substance, and the author is intellectually honest enough to confront it:
          *   **Example 1 (Causal):** Book A argues Company X collapsed *because* of CEO Y's disastrous decision Z in 1987, based on meeting minutes showing Y pushed for Z. Revised edition adds newly discovered minutes proving Y *vehemently argued against* Z, but was overruled by the board. To keep substance intact, the author must now shift focus to the board's dysfunction, significantly altering the causal narrative centered on Y.
          *   **Example 2 (Premise):** Book B frames the revolution as a purely working-class uprising driven by economic despair. A critic points out the neglect of middle-class intellectuals. The author adds details about them. If these intellectuals are shown to have formulated the core ideology *and* provided crucial leadership *before* widespread worker unrest, the "purely working-class" premise collapses, forcing a reshaping into a "cross-class alliance" narrative.
          *   **Example 3 (Central Fact Contradicted):** Book C hinges on the claim that General D acted alone in a key betrayal, based on his private diary. Revised edition includes a newly found letter *from* D proving he was acting under direct, secret orders from Leader E. The entire "rogue general" narrative substance implodes; a new substance centered on Leader E's duplicity must emerge.
      *   **Key Difference:** In these cases, the new evidence *contradicts* a specific, crucial element within the existing narrative logic, rather than merely *adding* detail to an under-described area. The narrative *couldn't* absorb it without structural damage. This is different from adding details about a famine's regional variations when the narrative is about political intrigue – those variations can be absorbed as "context" without touching the core political argument.

  4.  **Why Historians Argue "As If Facts Settle Something":**
      *   **Professional Norms:** Factual accuracy is a bedrock value and a minimum requirement for legitimacy. Debating facts is concrete and demonstrable.
      *   **Rhetorical Strategy:** Pointing out factual errors or omissions is a powerful way to undermine an opponent's credibility *as a scholar*, potentially weakening the perceived authority of their *interpretation* by association, even if the interpretation itself remains logically intact.
      *   **The Difficulty of Arguing Framing:** It's much harder to argue convincingly that "you should have started earlier" or "you gave this too little weight" than "you got this date wrong" or "you missed this document." Framing arguments often feel subjective or "philosophical," while factual arguments feel objective and "historical."
      *   **Unspoken Understanding (as you note):** Many historians *do* intuitively grasp the distinction but operate within the professional discourse where factual debate is the accepted currency, partly because arguing framing directly can seem like imposing one's own subjective view.

  **Naming and Defining the Gap:**

  Since no single term perfectly captures the "absorption property," here's a suggestion for how to define it, drawing on the concepts above, particularly Ankersmit:

  *   **Term:** **Assimilative Elaboration** (or **Narrative Assimilation**)
  *   **Definition:** The process by which new historical data (facts, events, perspectives), when incorporated into an existing historical narrative, is interpreted and positioned *within* the framework of the pre-existing narrative substance (its central argument, plot structure, or colligating concept), resulting in the enrichment or reinforcement of that substance *without* necessitating a fundamental change to its core structure, causal logic, or thematic emphasis. It demonstrates the resilience and assimilative capacity of a narrative framework when confronted with additive, rather than contradictory, evidence.

  **Why this works:**

  1.  **"Assimilative"/"Assimilation":** Directly captures the act of absorbing and integrating the new material *into* the existing structure.
  2.  **"Elaboration":** Emphasizes that the addition often functions as detail, example, or context *for* the existing argument, not a challenge *to* it.
  3.  **"Within the framework...":** Explicitly links the absorption to the stability of the narrative substance/employment.
  4.  **"Without necessitating a fundamental change...":** Clearly states the core observation – the shape holds.
  5.  **Contrasts with:** "Selection" (which is prior), "Underdetermination" (which is about multiple frameworks fitting the *same* data), and vague "narrative shape" (by specifying the *mechanism* and *effect* of adding new data).

  **In Conclusion:**

  Your observation brilliantly highlights the **robustness of narrative frameworks (substances, emplots)** in historical writing. While initial **selection, emphasis, and framing (emplotment, colligation)** set the story's shape, the **assimilative elaboration** you've identified shows how remarkably resilient that shape is to the *addition* of new factual material. Historians argue facts fiercely because it's the language of their professional legitimacy, even as they (often tacitly) understand that the *meaning* derived from those facts – the story being told – operates on a different, more structurally stable level. Hayden White is indeed a crucial next step for your reading group, as he provides the theoretical vocabulary (employment, tropes) that most directly explains the "space-allocation" aspect and the fundamental constructedness that enables assimilation. Ankersmit's "narrative substance" then offers the best conceptual anchor for understanding why that assimilation works without changing the core "aboutness." You've pinpointed a key operational principle of historical practice.
