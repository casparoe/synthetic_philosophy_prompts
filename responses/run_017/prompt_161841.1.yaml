    A probability claim is objective iff:  
    (i) It concerns a **future or indeterminate event**, and  
    (ii) It is grounded **only** in:  
        - (a) **Physical symmetry**, or  
        - (b) **Quantum indeterminism**.  

    This rule excludes population proportions as a direct basis for objective probability, treating them as descriptive facts that are "objective" but not probabilistic (e.g., the hypertension case might be seen as an "objective quantity we are uncertain about" rather than objective chance).

