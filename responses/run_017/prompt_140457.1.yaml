  Condition 4: the vanishing vantage point. She can't resolve which reference class to choose by stepping outside because asking "how are projects like this classified?" leads to an infinite regress. For instance, classifying the classification problem itself is circular.

  Now, for the upshot paragraph, I need to argue a conclusion. The vanishing vantage point shows that the outside view isn't idle but must be applied to the selection of reference classes, not just the estimates. Epistemic modesty should make her humble about how she groups things, recognizing that her biases might affect class choice. This means blending views: using the outside view to temper enthusiasm but not as the sole arbiter, and incorporating unique evidence thoughtfully.

