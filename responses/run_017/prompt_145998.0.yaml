prompt: |-
  I write fiction, and I am midway through a revision in which two things have collided: my publisher's house style, and a language reform that takes place inside the world of my novel. I would like help reconstructing what the first of these is committed to, because I cannot tell any more whether I am obeying a semantic thesis, a psychological bet, or a moral norm.

  The practice in question is the one my copyeditor applies without argument. Generic masculine forms are struck: compounds built on the old generic noun are replaced, and the generic pronoun becomes *they*. Role nouns are marked asymmetrically — a character who departs from the default is introduced as a woman novelist, a Black magistrate, a disabled veteran, while the default occupant is introduced as a novelist, a magistrate, a veteran, and the asymmetry is itself the point. And where a character defends the older usage, the standard move — in the essays I have read on the subject, and in the argument my protagonist makes — is transposition: rewrite the offending sentence along a different axis of social hierarchy and see whether the defender flinches. The best-known instance is the satirical centrepiece of Hofstadter's 1982 column on default assumptions, reprinted in *Metamagical Themas* as the chapter on changes in default words and images: a mock-earnest plea for a single neutral replacement term, driven past the point where it still sounds natural, into compounds where it begins to sound faintly ridiculous, so as to reveal that the putatively inclusive element was never being read as neutral.

  My complication is this. The novel is set in a society whose vocabulary marks a caste distinction: most office nouns come in a bare form and a specified form, and the bare form's historical occupants belong to the dominant caste. The reformers in the book abolish the bare form — call it the ordinance of symmetric specification — on the explicit ground that any unmarked noun quietly nominates its historical occupants as the human default. Two things then happen, and I have written both. First, marking rebounds: characters who now hear both forms specified report that they think about caste *more*, not less, and the reform's opponents use this as evidence that symmetric marking entrenches the very category it meant to defuse. Second, my copyeditor has asked for the opposite in the surrounding English: the ruling council is to be rendered with the bare noun, for the sake of what she calls texture and I would call the reader's sense of a lived-in world, while subordinate offices keep their markers. So the practice de-defaults in one place and reinstates a default in another, and I cannot articulate what distinguishes the two cases.

  I would like the implicit theory reconstructed. About meaning: in which layer of content is the offending default supposed to live — truth-conditions, something implicature-like, a presupposition, or only a matter of what the word makes salient — and does the practice strictly require the strong claim, or would a weaker one do? About language's power: does de-defaulting presuppose that usage shapes thought and social structure, or only that it expresses and ratifies them, and would the practice survive being reinterpreted as the latter? About fiction in particular: the default changes nothing that is true in my story — it changes what a reader pictures while reading, and often involuntarily. What view of a fiction's content, and of an author's answerability for imaginative uptake rather than for asserted content, is needed to make house-style de-defaulting anything other than an aesthetic preference?

  And about the satire: what must be true of an attitude for transposition to count as evidence against it? That such attitudes answer to a consistency norm, that formal or structural similarity is the right kind of similarity to appeal to, and — awkwardly — that the reader already condemns the analogue, so that the device can surface a commitment but cannot manufacture one? If that last condition holds, my invented reformers, who have no such consensus to borrow, are left with no lever at all.

  Please distinguish what the practice strictly presupposes from what it merely fits well with, and mark the places where it is underdetermined and several rival theories would license exactly these edits. Then tell me what would have to change in the practice — in the copyeditor's rules, in my rendering of the council, and in my protagonist's argument — if each of the presupposed views were replaced by its nearest rival.
reasoning: |-
  Okay, this is an incredibly sophisticated query about the intersection of linguistic theory, editorial practice, and worldbuilding ethics. The user is clearly both a meticulous writer and a deep thinker about language politics. They're stuck in a fascinating bind between their fictional society's linguistic reform and their publisher's real-world style guide, and need philosophical disentanglement.

  First, I need to unpack their layered concerns:
  - The core tension: Their novel's "symmetric specification" reform (abolishing unmarked nouns) clashes with the publisher's style (de-defaulting marked nouns in English).
  - They're questioning the theoretical foundations of both:
    * What linguistic mechanisms do defaults actually activate? (semantics/pragmatics)
    * How does language shape cognition/society? (strong Sapir-Whorf vs weak)
    * What are authors responsible for in fiction? (asserted content vs reader imagination)
    * Why does Hofstadter-style satire work? (transposition logic)

  The user's frustration is palpable - they've done their homework (citing Hofstadter's transposition argument) but feel trapped between:
  1. Their fictional reformers' logic (who succeed in abolishing defaults)
  2. Their copyeditor's real-world practice (which reinstates a default for "texture")
  3. Their awareness that the satire's power relies on existing consensus

  Key philosophical knots:
  - If their copyeditor claims de-defaulting is merely aesthetic ("texture"), but their protagonist argues it's ethical (combating cognitive defaults), there's hypocrisy in applying it selectively to the council.
  - The transposition satire falls flat in their fictional world because there's no shared moral baseline to appeal to.

  I should reconstruct the implicit theories layer by layer:
  1. Linguistic layer: House style likely assumes defaults create presuppositions (not just salience), otherwise why be so strict?
  2. Cognitive layer: It probably assumes a moderate Whorfianism - language reinforces bias, but changing it alone isn't magic.
  3. Ethical layer: Authors are responsible for unintended reader inferences, not just explicit content.
  4. Satire layer: Transposition works only against inconsistent prejudices that fear analogous treatment.

  For the practical reconciliation:
  - The council's default might be justified if "councilor" has truly become neutral in-story, but that requires showing linguistic evolution, not just declaring it.
  - Their reformers' argument needs grounding beyond transposition - maybe historical evidence or power analysis.
  - The copyeditor's "texture" claim needs unpacking: is it really about verisimilitude, or unexamined comfort with existing defaults?

  This is one of those rare queries where linguistics, narrative theory, and political philosophy collide. The user deserves both theoretical clarity and practical workarounds. I'll need to distinguish necessary assumptions from contingent ones, and show how tweaking variables (e.g., strength of Whorfian belief) would change the required edits.
answer: |-
  Here's a reconstruction of the implicit theory behind your publisher's house style, distinguishing core commitments from compatible alternatives, underdetermined areas, and consequences of shifting assumptions. Your situation brilliantly exposes tensions between real-world linguistic activism and fictional worldbuilding constraints.

  **Core Implicit Theory of House Style (De-Defaulting Practice):**

  1.  **Linguistic Mechanism (Meaning Layer):**
      *   **Commitment:** The generic masculine/default unmarked form carries a **presupposition** or **conventional implicature** of maleness/dominant-group-ness. It's not just about salience or statistical association; it's baked into the conventional meaning that this *is* the standard case against which others are defined. The unmarked form *presupposes* its historical occupant as the norm.
      *   **Evidence:** The insistence on replacing *even when context clarifies*. The practice assumes the default itself does harm regardless of immediate context. The transposition argument relies on this: if "he" truly meant "anyone," switching to "she" shouldn't feel jarring/ridiculous; the jarring feeling *reveals* the presupposed maleness.
      *   **Weaker Alternatives (Not Strictly Required, but Compatible):** The practice *could* work with a strong claim about **salience** (the default makes the dominant group highly accessible) or a **generalized conversational implicature**. However, the transposition argument strongly leans towards presupposition/implicature.
      *   **Underdetermined:** The precise semantic/pragmatic category (presupposition vs. implicature) isn't crucial for the *practice*. What matters is that the association is robust, conventional, and resistant to cancellation by context.

  2.  **Power of Language (Cognitive/Social Layer):**
      *   **Commitment:** A **moderate constructivist/Sapir-Whorfian bet.** Language doesn't *solely* reflect reality; it actively **shapes perception, reinforces stereotypes, and perpetuates social structures** by making certain categories invisible (the unmarked default) and others marked (deviations). De-defaulting aims to disrupt this cycle by forcing explicit acknowledgment and challenging the invisibility of the privileged default.
      *   **Evidence:** The core rationale – the unmarked noun "quietly nominates its historical occupants as the human default." The transposition argument demonstrates how language structures frame our understanding of roles. The asymmetry in role nouns highlights the power of the unmarked.
      *   **Weaker Alternative (Practice Survives):** The practice *could* survive reinterpretation as **expressing/ratifying** existing structures, but this weakens its *activist* justification. If language *only* reflects, changing it is symbolic. The house style likely assumes language has *some* constitutive power. If the *only* effect was expression/ratification, the urgency and specific edits (like mandatory *they*) might seem less vital.
      *   **Underdetermined:** The *degree* of shaping (strong Whorfianism vs. weaker influence) isn't fixed. The practice assumes influence is significant enough that changing language is a worthwhile intervention against bias.

  3.  **Fiction & Authorial Responsibility:**
      *   **Commitment:** An author is responsible not just for the **asserted truths** within the story's reality ("The Council is powerful"), but also for the **cognitive and imaginative experience** they evoke in the reader. Defaults shape **reader assumptions and mental imagery** unconsciously and involuntarily. Perpetuating defaults in the *narration* (even if the fictional world has different rules) risks importing real-world biases into the reader's mind, regardless of in-story facts.
      *   **Evidence:** The copyeditor's "texture" argument for the Council is fundamentally about *reader experience* ("lived-in world"). The house style *overrides* the fictional world's linguistic reality (symmetric specification) precisely to manage this reader experience. The practice assumes the author has a duty to avoid passively reinforcing harmful real-world defaults *through the narration*.
      *   **Alternative View (Aesthetic Preference):** If one believed authorial responsibility *only* covered in-story truths and deliberate character assertions (like your protagonist's argument), then de-defaulting *would* be merely an aesthetic preference about prose style. The house style explicitly rejects this, prioritizing the management of reader cognition/imagination over strict fidelity to the fictional world's linguistic system *in the narration*.
      *   **Underdetermined:** The *extent* of this responsibility (e.g., where "texture" overrides principle) is fuzzy. The Council exception shows pragmatism within the commitment.

  4.  **Satire & Transposition Logic:**
      *   **Commitment:** For transposition (Hofstadter-style) to work as effective satire/critique, it relies on:
          *   **Consistency Norm:** The attitude being criticized (e.g., "`he` is neutral") is assumed to be, or claimed to be, based on a *principle* (neutrality, tradition, efficiency) rather than pure self-interest or naked prejudice. The satire exposes *inconsistency* in applying that principle.
          *   **Formal/Structural Similarity:** The transposed scenario *must* be formally analogous (replacing gender with race/caste/ability within the same linguistic structure) to highlight the structural bias, not just any difference.
          *   **Preexisting Condemnation (Crucially):** **The audience must already find the *analogue* (e.g., `negr` for neutral) objectionable.** Transposition *reveals* hypocrisy or inconsistency; it *cannot create* the moral objection to the analogue from scratch. It surfaces an existing latent commitment.
      *   **Evidence:** Hofstadter's column works because 1980s (and current) readers *already* find the idea of a race-based "neutral" term offensive. The power lies in the shock of seeing the *same structure* applied to a category where the bias is less visible to the holder.
      *   **Consequence for Your Reformers:** You are absolutely right. If the fictional society lacks consensus condemning caste hierarchy itself, the reformers' transposition arguments *would fall flat* as satire or persuasive logic *within that world*. They cannot manufacture the condemnation of the analogue. Their strength *in the novel* relies on *your readers* recognizing the analogy to real-world defaults they (presumably) already condemn. *Within the story*, the reformers need different arguments: historical evidence of exclusion, appeals to justice/equality, demonstrations of power imbalance, or the psychological rebound effect you've depicted.

  **Reconciling Your Specific Clash (Council vs. Subordinates):**

  The house style's handling of your Council exposes its pragmatism and hierarchy of concerns:

  1.  **Reader Cognition Priority:** De-defaulting subordinates prevents readers from unconsciously importing the real-world default onto those roles.
  2.  **"Texture" as Worldbuilding:** Using the bare form for the Council leverages the *real-world reader's* association of unmarked terms with authority/entrenchment to efficiently convey "this is the powerful, established default group" *within the fiction*. It sacrifices the *universal* application of de-defaulting for a perceived worldbuilding gain.
  3.  **Implicit Distinction:** The practice distinguishes between:
      *   **Offices historically/substantively subordinate:** De-defaulting combats real-world bias imports.
      *   **The supreme dominant body:** Leveraging the default *as a signifier of dominance within the fiction*, exploiting the very association the practice usually fights against, because it serves the narrative purpose of signaling entrenched power quickly.
  4.  **Underlying Tension:** This *is* a tension. It prioritizes managing reader assumptions about subordinates (external ethics) while using the default trope for the dominant group (internal worldbuilding efficiency). It assumes the reader can compartmentalize: recognizing the Council's default *as a fictional marker of dominance* without having that reinforce real-world defaults. This relies on the reader's critical awareness.

  **What Changes if Core Views Shift:**

  | Core View                     | Nearest Rival                                       | Changes Required in Practice/Argument                                                                                                                                                              |
  | :---------------------------- | :-------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **Meaning: Presupposition**   | **Strong Salience Only**                            | **Copyeditor:** Less strict on *mandatory* changes if context clearly overrides. `They` maybe optional sometimes. **Council:** "Texture" justification stronger. **Protagonist:** Argument weakens; needs empirical evidence of harm from salience (like your rebound effect), not just linguistic structure. |
  | **Power: Shapes Thought**     | **Only Expresses/Ratifies**                         | **Copyeditor:** Practice becomes primarily symbolic/aesthetic. Less urgency, potentially more exceptions. **Council:** "Texture" easily overrides principle. **Protagonist:** Needs to argue linguistic change is *necessary* (not just helpful) for social change, or shift focus purely to justice/expression. |
  | **Fiction: Manage Cognition** | **Responsible Only for Asserted Content**           | **Copyeditor:** De-defaulting becomes purely stylistic preference. Author could insist on symmetric specification throughout. **Council:** Bare form easily justified by fictional ordinance. **Protagonist:** Argument loses force; becomes purely diegetic political stance within the story. |
  | **Satire: Needs Preexisting Condemnation** | **Transposition Creates Condemnation** | **Copyeditor:** (Less direct impact). **Council:** (N/A). **Protagonist:** **Major Rewrite Needed.** The reformers' *satirical* argument fails. They need arguments based on: demonstrable exclusion/injustice caused by the bare form; appeals to abstract equality; power analysis; or empirical data (like your rebound effect showing increased salience as a *step* towards dismantling, or evidence it eventually fades). |

  **Conclusion & Path Forward:**

  Your publisher's house style rests on a coherent, activist theory: unmarked defaults carry harmful presuppositions that shape thought and perpetuate bias; authors must actively counter this in their narration to manage reader cognition, using tools like de-defaulting and transposition satire (which leverages existing consensus). Its application to your Council is a pragmatic, worldbuilding-driven exception that exploits the default's power to signal dominance *within the fiction*.

  The reformers in your novel face the harder task because **their satire lacks a foundational consensus.** Their transposition argument *within the story* is weak without societal agreement that caste hierarchy itself is wrong. Focus their justification on:
  1.  **The Ordinance's Direct Aim:** Explicitly naming the injustice of the historical default, not just its linguistic structure.
  2.  **Evidence of Harm:** Documented exclusion, psychological studies (like your rebound effect), or appeals to fundamental equality.
  3.  **Long-Term Vision:** Framing the rebound effect as necessary cognitive labor leading to eventual deconstruction of the category, not an endpoint.
  4.  **Power Analysis:** Showing how the bare form reinforces material power imbalances.

  For the Council rendering: Discuss the "texture" rationale with your copyeditor. Is it *essential* for clarity? Could subtle narration or character perspective achieve the same sense of entrenched dominance without reinstating the bare noun, maintaining alignment with the reformers' victory? If the bare noun stays, ensure the narrative *explicitly frames it as a sign of persistent dominance or incomplete reform*, mitigating the risk of passively endorsing the default for the highest office. This tension is inherent, but conscious framing can make it a feature, not just a bug.
