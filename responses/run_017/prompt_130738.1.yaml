  The user’s main goal is to convey that one core idea: institutions can't be directly inferred from objects alone because multiple institutions could produce similar material records. They want participants to grasp that absence of evidence isn't evidence of absence, and to avoid the "ritual" bucket for unexplained finds. The case study with the 240 jars in House C is central—it needs to illustrate that standardization implies organization but doesn't specify which institution.

  I need to assess if their approach is effective. The user’s proposed single sentence is strong: it emphasizes the need to consider counterfactuals. The jar example works because the uniformity points to organized production, but the possible explanations (tax, merchant, kin, cult) are equally plausible without further evidence. The dog burial is a good decoy; it feels significant but doesn't help distinguish between institutions, teaching that not all unusual finds are institutionally informative.

  Looking at the structure, starting with "wreckage bias" makes sense—objects enter the archaeological record through discard or destruction, so deposits often reflect breakdown, not daily function. This sets up why inference is tricky. Then moving to standardization, organization, and multiple institutional possibilities flows logically. Addressing misconceptions early, like equating pots with peoples or overusing "ritual," is crucial. The user plans to preempt the "archaeology as storytelling" concern by showing the structured inference process.

  For the check, the proposed question about what find would weaken a hypothesis is excellent. It tests understanding of hypothesis testing rather than memorization. The user also wants to declare certain topics out of scope, like specific dating methods, to keep focus. This should be framed as maintaining clarity, not evasion.

  I should ensure the session remains engaging. Using visual aids for the jars and the dog burial can help. Emphasizing that the detectorists' empirical skills are valued but inference requires different tools might ease their defensiveness. The key is making the logic tangible through the case study, avoiding theory, and focusing on practical inference steps.
answer: |-
  Here's a streamlined, jargon-free approach built around your jar case study, designed for your audience's practical mindset and pre-empting their likely objections:

  **The One Idea (150 words):**
  *"We can't tell what *kind* of organized group did something just by finding the thing they left behind. To even guess the group, we need to ask: 'What would this spot look like if they *weren't* here?'"*
  *(Why: It's concrete, actionable, and forces the counterfactual thinking. "Institution" is abstract; "organized group" is clearer. "Mechanism" is embedded in the question.)*

  **The Carrying Case (250 words):**
  "Forget the dog for now – it's a red herring. Focus on the jars in House C. **What makes them weird?** Not just *how many*, but how *identical* they are: same size, same clay, same kiln. Think about your own kitchen jars – are they all identical? Probably not. This isn't normal household clutter. This screams *planned action*. Someone ordered 240 identical jars, all at once. That takes organization – someone coordinated the potter, the delivery, the storage.

  **What's missing?** Any clue *why* they were stored there, or *who* organized it. We don't find receipts saying 'Paid by the Temple Treasurer' or 'Tax Collector Gaius'. We don't see different jar types hinting at different sources (like a merchant might have). We don't find fancy serving dishes suggesting big feasts nearby. The jars tell us *something organized happened here*, but not *who* organized it or *why*. The dog? Interesting, but doesn't answer the jar question – people bury pets for lots of reasons."

  **The Order (400 words - Start Practical, Build Logic):**

  1.  **The Wreckage Bias (Your Key Insight):** "First, remember: Almost everything we dig up is *rubbish* or *lost*. It's what people threw away, broke, forgot, or left behind when they abandoned the place. We're rarely looking at a working system; we're looking at its leftovers *after* it stopped. House C isn't showing us the storage system *working*, it's showing us the moment it *collapsed* – someone smashed all 240 jars! Why? We don't know. The intact jars in the other houses? Those *were* part of daily life, discarded normally."
  2.  **The Pattern:** "Now, look *at* the leftovers. The jar pattern in House C is bizarrely uniform compared to everywhere else. That uniformity screams 'planned'. It didn't happen by accident. **Somebody organized that production and delivery.**"
  3.  **The Plausible Whos:** "Okay, *who* organizes making and storing 240 identical jars? Think practically: A landlord collecting rent in grain? A merchant buying local produce to sell elsewhere? A big family group pooling resources for feasts? A religious group storing offerings? *All* are possible! The identical jars fit *all* these ideas equally well right now. There's no 'smoking gun' jar saying 'Property of the Cult of Jupiter'."
  4.  **The Killer Question (The Idea Applied):** "So how *could* we tell them apart? We need to ask: **'What *else* should we find here if it was a tax collection point... that we *wouldn't* find if it was just a merchant's storeroom? What would look *different* if this was a feasting hall versus a sacred store?'** Maybe seals on jars? Different pottery types mixed in? Ovens big enough for feasts? Altars? We don't have those clues here. That's the problem!"
  5.  **Pre-empting "Storytelling":** "Is this just making up stories? No, because we start with the *real pattern* (identical jars = organized action). We list *plausible, practical explanations* (tax, trade, feast, cult), not fairy tales. Then we honestly admit: *Without more clues, we can't pick just one*. The 'story' stops where the evidence stops. We have a 'what' (organized storage), but the 'who' and 'why' are guesses."

  **Misconceptions (Handling Them Head-On):**

  1.  **"Pots = People / Beliefs":** "Those identical jars tell us about *one action* – someone storing stuff. They don't tell us the homeowner's religion, or their tribe. Beliefs usually need writing or very specific symbols – not just storage jars."
  2.  **The "Ritual" Bucket:** "That dog burial? It *feels* religious, right? But people bury pets for sentiment, hygiene, or superstition. Calling it 'ritual' explains *nothing* unless we have proof it was part of organized worship – like a temple nearby. Here, it's just... a buried dog. Don't dump the jars in the 'ritual' bin because they're weird! Look for practical explanations first."
  3.  **240 Jars ≠ 240 Proofs:** "240 jars sounds like overwhelming evidence! But it's really *one event*: 'Someone smashed 240 identical jars here once.' It's strong evidence *for that event*, but it's still only one clue about the *institution* behind it. Think of it as one big footprint, not 240 small ones."
  4.  **Absence of Evidence:** "Ah, yes: 'Absence of evidence isn't evidence of absence.' True! BUT... *Presence* of evidence *is* evidence of *presence*. We *have* evidence of organized storage (the jars). We *lack* evidence *telling us which specific group* did it (like tax records). That absence *does* matter – it stops us knowing *which* group. It doesn't mean the storage didn't happen."
  5.  **"So You Can't Know Anything?!"** "No! We know a *lot*: This wasn't a normal house. Something organized happened here involving mass storage. We know *what* was stored (whatever fit those jars). We know *when* (late Roman). We know *it ended violently* (smashed!). We just don't know *exactly which club was meeting in this room*. That's not knowing *nothing*; it's knowing the limits *of this particular clue*. We need *more* clues elsewhere to pin down the 'who'."

  **The Check (150 words):**
  "**Question:** Imagine we find a *second* site nearby, also with a pile of identical storage jars – but only 30 jars this time. You think it was probably a merchant's store. **What *one* find would make you think, 'Hang on, maybe it *wasn't* a merchant after all?'**"
  *   **Right Answer:** Focuses on *distinguishing* institutions. *"If I found official tax seals on the jars, I'd think 'state tax', not merchant."* Or *"If I found it right next to a huge kitchen full of animal bones, I'd think feasting group, not merchant."* Or *"If it was built like a known shrine, I'd think cult."* Shows they grasp needing *additional, differentiating* evidence.
  *   **Convincingly-Wrong Answer:** Focuses on the *storage act itself* or irrelevant details. *"If the jars were a different colour, I'd doubt a merchant used them."* (Why? Merchants use different jars). *"If it was near a road."* (Merchants AND tax collectors use roads). *"If I found coins."* (Coins don't distinguish the institutions here).

  **What I Refuse to Explain (100 words):**
  "Tonight, we're focusing *only* on the logic linking a single weird find to the *type* of organized group that made it. We won't dive into pottery fabric analysis, radiocarbon dating specifics, or the full history of late Roman economies. Why? Because those are deep, separate topics. Sticking to our core question keeps it sharp and stops us getting lost in the weeds. This is about building the first, crucial step clearly." *(Intellectual Hygiene: Framed as focus and clarity, not dismissal.)*

  **Why this works for your audience:**

  *   **Starts Concrete:** Jars, dogs, houses – tangible things.
  *   **Uses Their Logic:** Practical explanations (tax, trade, feast), not abstract "-ities".
  *   **Pre-empts & Disarms:** Hits their expected objections head-on, especially "absence of evidence" and "storytelling".
  *   **Gives Them Tools:** The counterfactual question ("What would it look like if they *weren't* here?") is a usable takeaway.
  *   **Validates Their Skills:** Acknowledges the empirical (finding stuff) while gently challenging overconfident inference.
  *   **Case Study Focused:** Everything ties back to the jars. The dog serves its purpose perfectly as a decoy to illustrate the "ritual bucket" trap.
  *   **No Jargon:** Equifinality = "Many groups could leave the same mess". Formation Processes/Wreckage Bias = "We mostly find rubbish/leftovers".

  **Deliver it conversationally, invite their detectorist stories about "weird clusters" they've found, and emphasize the practical puzzle-solving.** Good luck!
