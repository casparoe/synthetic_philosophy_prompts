answer: |-
  ### Final Examination: Ancient Philosophy Seminar  
  **Question 4 (45 minutes; 20 marks)**  

  > Aristotle argues in *Nicomachean Ethics* V.5 that money exists "by convention" (*nomos*), serving as a substitutable guarantee of future exchange to satisfy reciprocal need (*chreia*). Yet in *Politics* I.9–10, he condemns money-lending at interest as "most contrary to nature" because money’s natural purpose (*telos*) is facilitating exchange, not self-multiplication.  
  >  
  > **Consider the following case:**  
  > *The city of Keramos uses no precious metals. Instead, it circulates sealed clay tokens, issued in fixed quantity by decree. These tokens cannot be melted, exported, or counterfeited. They function as the universal medium of exchange: all citizens accept them for goods and services, and prices are set in token-units.*  
  >  
  > **Answer both parts:**  
  > 1. How would Aristotle’s "guarantee of future exchange" argument (*NE* V.5) explain why Keramos’ clay tokens work *at all*? (8 marks)  
  > 2. Would a Keramos lender who charges interest for loaning tokens be acting "contrary to nature" on Aristotle’s terms? Defend your answer by reconciling the *conventionalism* of the *Ethics* with the *teleology* of the *Politics*. (12 marks)  
  >  
  > *Address the circularity worry: Do prices reflect pre-existing demand, or does money create commensurability? Take a stance on how to interpret* chreia *(need/demand).*  

  ---

  ### Model Answer (780 words)  

  **(1) The Function of Clay Tokens in Aristotle’s Framework**  
  Keramos’ tokens succeed because they fulfill money’s core Aristotelian function: acting as a conventional "guarantee" (*NE* 1133a30) that enables deferred reciprocity. Aristotle argues money exists by *nomos* (convention/law) to solve the problem of temporal asymmetry in barter: if a shoemaker needs wheat now but the farmer only needs shoes later, reciprocal need (*chreia*) cannot directly align. Money bridges this gap by serving as a trusted "token of demand" (*NE* 1133b10) — a socially accepted pledge that the shoemaker can later redeem for wheat. Keramos’ tokens perform precisely this role. Though intrinsically useless clay, their fixed quantity and legal enforcement create communal trust that tokens *will* be accepted by others for future goods. This transforms them into a reliable proxy for *chreia*.  

  Critically, Aristotle insists money’s value derives not from substance (e.g., gold) but from collective agreement that it represents unmet needs. Keramos’ tokens embody this: their sealed, immutable form prevents debasement, while legal sanctions ensure universal acceptance. Thus, despite lacking intrinsic worth, they function because the polis treats them as a "sufficient measure for practical purposes" (*NE* 1133b20). The circularity worry — whether money measures demand or constructs it — is resolved by recognizing *chreia* as *relational need-in-context*, not abstract "demand." Prices in Keramos emerge from concrete social agreements about relative urgency (e.g., bread vs. statues), with tokens quantifying these judgments. Money doesn’t create needs but makes their reciprocity practicable.  

  **(2) Interest, Teleology, and the Reconciliation of Convention and Nature**  
  Yes, charging interest on Keramos’ tokens remains "contrary to nature" for Aristotle. The *Politics* condemns interest because it perverts money’s natural *telos*: to enable fair exchange of goods for communal flourishing (*Pol.* 1258b1–8). Keramos’ tokens, though conventional in form, inherit this functional purpose. Aristotle’s teleology hinges not on physical properties but on *proper use*. Money’s "nature" is defined by its end (*telos*) — facilitating reciprocal need-satisfaction — not its material. Thus, even clay tokens have a natural function: to mediate exchange justly.  

  The *Ethics*’ conventionalism and the *Politics*’ teleology cohere when we distinguish *form* from *function*. Convention (*nomos*) determines money’s *form* (clay, gold, or digits), but its *function* is natural because humans are political animals who *by nature* require reciprocal exchange to survive (*Pol.* 1253a2). Interest violates this function because it treats tokens as an end in themselves, divorcing them from their role in need-satisfaction. Lending tokens for interest seeks "currency born from currency" (*Pol.* 1258b7), a sterile process that ignores the natural limit of wealth: sufficiency for the good life. Keramos’ lender exacerbates this by exploiting tokens’ artificial scarcity (fixed quantity) to extract value without contributing to real *chreia*.  

  The unnaturalness lies in the *intent* and *effect*. Aristotle condemns *chrematistikē* (wealth-getting for accumulation) because it subverts oikonomia (household management for needs). Charging interest epitomizes this: the lender profits from the borrower’s need while producing nothing, corrupting reciprocity into exploitation. That tokens are clay changes nothing; their conventional validity depends on serving exchange. Interest severs this link, making tokens "breed" independently of real goods — a perversion whether the medium is gold or baked earth.  

  **Resolution of the Tension**  
  The apparent tension dissolves when we see Aristotle’s conventionalism as describing money’s *contingent form*, while his teleology prescribes its *essential function*. In the *Ethics*, money’s conventionality explains its malleability: societies can redesign it (e.g., adopting clay tokens) so long as it fulfills its purpose. The *Politics* then clarifies that purpose: enabling natural exchange. When a practice (like interest) obstructs this purpose, it is "unnatural" regardless of the medium. Keramos’ tokens, despite their arbitrariness, must serve the natural end of reciprocity; if used to breed artificial scarcity, they become instruments against nature.  

  **Conclusion**  
  Aristotle’s account is coherent: money is conventional in origin but natural in aim. Keramos’ tokens work because they credibly represent *chreia* (understood as concrete communal need), securing future reciprocity. Yet charging interest on them remains unnatural because it divorces money from its teleological role — transforming a social tool for mutual aid into a self-replicating abstraction. The *Ethics* and *Politics* thus complement: one analyzes money’s operational mechanics, the other its normative foundation in human nature.  

  ---

  ### Marking Scheme (20 marks total)  
  | **Must-Hit Points**                                                                 | **Marks** | **Common Failure**                                                                 |  
  |-------------------------------------------------------------------------------------|-----------|------------------------------------------------------------------------------------|  
  | **1.** Correctly applies *NE* V.5’s "guarantee" argument to Keramos tokens: tokens solve temporal asymmetry in barter via social trust. | 4 | Vague appeals to "convention" without specifying deferred reciprocity. |  
  | **2.** Resolves circularity: prices reflect pre-existing *chreia* (argued as context-dependent *need*, not abstract demand); tokens quantify, not create, value. | 3 | Assumes money creates demand or reduces *chreia* to subjective preference. |  
  | **3.** Identifies teleology in *Pol.* I.9: money’s natural *telos* is facilitating exchange for communal flourishing, regardless of form. | 4 | Claims interest is unnatural *only* for metal money; ignores functional teleology. |  
  | **4.** Reconciles texts: convention governs money’s form, teleology its function; interest perverts function by severing money from real *chreia*. | 5 | Treats *Ethics* and *Politics* as contradictory; fails to link *telos* to political nature of humans. |  
  | **5.** Judges Keramos interest "unnatural": lender exploits artificial scarcity for sterile accumulation, violating reciprocity. | 4 | Focuses on tokens’ material (clay) rather than lender’s intent/effect. |  

  ---

  ### What Would Change This Answer’s Mind? (150 words)  

  **A Stronger Reading of *NE* V.5’s Conventionalism**  
  The model answer hinges on reading Aristotle’s "sufficient for practical purposes" (*NE* 1133b20) as affirming money’s instrumental efficacy within teleology. If, however, this line is read as conceding that money *creates* commensurability ex nihilo (not merely quantifying pre-existing *chreia*), the entire reconciliation collapses: money would have no natural function beyond contingent social agreement. This reading gains traction if *NE* V.5’s demand-based commensuration is interpreted as a proto-monetarist claim that value is *constituted* by exchange ratios (e.g., 1133b15: "all goods must be measured by some one thing"). If prices are purely conventional constructs with no grounding in objective need, the *Politics*’ teleological critique of interest loses its foundation — reducing it to moralistic prejudice. The fragility lies in whether *chreia* is prior to money or emergent from it. *Pol.* 1257a14’s claim that money "gives a new quality" to exchange could support this challenge.
