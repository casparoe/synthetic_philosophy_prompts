answer: |-
  **1. Exam Question (20 marks total)**  
  At noon today, Billionaire A offers you £1,000,000 if, at midnight tonight, you *genuinely intend* to drink a vial at noon tomorrow. The vial will cause 24 hours of non-lethal illness with no lasting effects. The £1,000,000 is wired to you at 12:01 AM tonight regardless of whether you later drink. Drinking provides no benefit. Two complications:  
  (a) The vial given to you tomorrow is randomly selected from a batch of ten vials: nine cause illness, one is a harmless placebo. You cannot distinguish them beforehand and learn the contents only by drinking. Tonight, you are thus 90% confident you *will not drink* tomorrow.  
  (b) At 11:00 AM tomorrow (after the money is wired), Billionaire B offers £5,000 cash if you return the vial *unopened*. You know tonight that this offer will occur.  

  Answer all parts:  
  (i) Explain why intending to drink tonight might seem impossible. Why does (a) *not* resolve this impossibility? (4 marks)  
  (ii) Billionaire B’s offer occurs *after* intention-formation. Why might this threaten your ability to rationally retain the intention until noon tomorrow? (4 marks)  
  (iii) Suppose you could pay £100 tonight for a hypnotist who would make you sincerely intend to drink. Would this help you win the £1,000,000? Why or why not? (4 marks)  
  (iv) Is the toxin puzzle primarily about psychological constraints on forming intentions, normative constraints on practical reasoning, or both? Justify your answer. (4 marks)  
  (v) Could a similar puzzle arise if the prize required *wanting* to drink (rather than intending), or being a *dispositionally honest person* (rather than forming an intention)? Explain briefly for both. (4 marks)  

  ---

  **2. Model Answer**  
  **(i)** Intending seems impossible because forming an intention typically requires belief that you will perform the act (Davidson, Bratman). Here, you know that once the money is wired, you lack sufficient reason to drink (as it causes illness with no gain). Yet (a) introduces probabilistic uncertainty: you are 90% confident you won’t drink. However, this doesn’t resolve the core problem. Intentions require *practical commitment*, not just statistical likelihood (Holton). A 10% chance you might drink is consistent with lacking a *settled plan* to drink. Rational intention demands seeing the act as *choiceworthy* given your reasons, but at midnight, you already know that when noon arrives, you’ll have stronger reasons *not* to drink (e.g., avoiding illness, or the £5,000 from Billionaire B). Probability alone fails to generate the requisite normative commitment.  

  **(ii)** Billionaire B’s offer threatens intention-retention because intentions must be *stable* to be genuine (Bratman). At midnight, you might form the intention by focusing on the £1,000,000 reward (treating it as a reason to drink). But by 11:00 AM, the new £5,000 offer gives an additional, decisive reason against drinking. Since intentions are responsive to reasons, retaining your intention would require ignoring this new reason, violating the rational requirement of *means-end coherence* (Bratman). If you can discard the intention when a small cash incentive appears, it wasn’t a robust intention at all—merely a temporary wish. Thus, foreseeing this offer undermines your ability to form a *resolute* intention tonight.  

  **(iii)** Hypnosis would likely succeed. The barrier to intending isn’t physical impossibility but *rational incapacity*: you can’t rationally adopt a plan you know you’ll abandon (Harman). Hypnosis bypasses rationality by altering beliefs/desires non-rationally (e.g., making you believe drinking is noble). If the hypnotist induces sincere motivation to drink, you meet Billionaire A’s condition (a genuine intention at midnight). Crucially, the money is wired *before* hypnosis potentially wears off, so subsequent changes don’t invalidate the reward. This shows the puzzle hinges on *rational access* to intentions—they can’t be formed at will, but can be induced non-rationally.  

  **(iv)** The puzzle is about both, but *normative constraints* are foundational. Psychologically, humans can’t form intentions for acts they firmly believe they’ll omit. But this stems from a normative truth: intentions are *reason-governed commitments* (Broome). To intend X, you must see X as justified by reasons you expect to persist. Here, you know reasons *against* drinking will later dominate (illness + £5,000), making rational intention-formation impossible. The psychological constraint (belief requirement) derives from rationality’s demand for cognitive alignment with practical commitments.  

  **(v)**  
  - **Wanting**: Yes. Genuinely *wanting* to drink (e.g., desiring it for its own sake) is likely impossible if you know it causes net harm. Desires aren’t directly volitional, and instrumental desires (e.g., "I want it to get £1M") collapse once the reward is secured.  
  - **Dispositional trait**: Less clear. Being "the sort of person who would drink" might be possible (e.g., via character plasticity), but the trait must be *stable*. If Billionaire B’s offer would override the disposition, you couldn’t sincerely possess it tonight. The puzzle generalizes to any state requiring *sincere, reason-sensitive commitment*.  

  ---

  **3. Marking Scheme (20 marks total)**  
  - **A/B threshold**: A answers precisely target the *structural* challenge (rational access vs. decision theory); B answers describe surface features.  
    - **(i)** (4 marks): Must note probabilistic belief ≠ intention-justifying commitment. (A: Cites Holton/reasons-sensitivity; B: Only says "90% ≠ 100%")  
    - **(ii)** (4 marks): Must link intention stability to reasons-responsiveness. (A: Uses Bratman’s stability/means-end coherence; B: Only notes "£5k tempts you")  
    - **(iii)** (4 marks): Must state hypnosis bypasses *rational* constraints. (A: Contrasts rational/non-rational intention formation; B: Says "it works" without justification)  
    - **(iv)** (4 marks): Must argue normative constraints underpin psychological ones. (A: Broome/Harman on reason-governedness; B: Treats psychology/reasons as separate)  
    - **(v)** (4 marks): Must explain generalization to non-intentional states. (A: Notes stability/sincerity demands; B: Superficial yes/no without rationale)  

  ---

  **4. Common Mistakes (Deduct marks for these)**  
  - **Overfocusing on belief**: Claiming (a) "solves" the puzzle because 90% ≠ 100% (misses *normative* role of intention).  
  - **Ignoring stability**: Treating (b) as irrelevant since money is already wired (fails to see intention retention as essential).  
  - **Newcomb/EDT fixation**: Arguing you should "decide to drink" to get £1M (confuses act selection with state formation).  
  - **Hypnosis as irrelevant**: Dismissing (iii) as "cheating" (misses the test of voluntarism).  
  - **Overgeneralizing**: Claiming *all* attitudes are vulnerable (ignores that e.g., forgetfulness lacks reason-sensitivity).  

  ---

  **5. Controversies in Model Answer**  
  - **Disputed**: Holton’s view that probabilistic intention is possible (Bratman rejects this).  
  - **Disputed**: Whether intentions *must* be reasons-responsive (railway cases challenge this).  
  - **Contested**: Hypnosis as a solution (some argue it produces "alien" intentions).  
  - **Live debate**: If wanting is analogous (desires may be less stable than intentions).  
  - **Orthodox**: Core impossibility stems from intention’s future-directed rationality (Bratman consensus).
