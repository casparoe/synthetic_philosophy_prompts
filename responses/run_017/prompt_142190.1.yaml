prompt: |-
  I work as a software engineer and I keep running into the same shape of arrangement in two completely different settings, and I don't have a word for it. At the personal end: I have configured my phone so that after eleven in the evening a few apps are hidden behind a screen that takes about forty seconds to dismiss. Nothing is blocked; I know the way through, and I have used it. At work: my team has a rule that any change to a production configuration can be made by anyone holding deploy rights, but it only takes effect after an hour's delay, and it posts a message to a public channel the moment it is queued. Overriding the delay is a single deliberate command that anyone can type. I've also been reading a little about constitutional design on the side, and there seems to be a family of provisions of the same kind: a rule is repealable by an ordinary majority, so there is no entrenchment in the strict sense, but the repeal has to be passed twice with a fixed interval between the votes, or the second vote has to fall after an election. What these have in common, as far as I can tell, is that nothing is made impossible, and no penalty is attached — you don't pay a fine, you don't forfeit a deposit, you lose no option that you had before; the only thing added is hassle, delay, and visibility. They also all seem to work, when they work, by a specific mechanism: they outlast a state of mind. The forty seconds is longer than the impulse to check the app usually survives; the hour is longer than the confidence of someone who has just been paged at three in the morning; the interval between votes is longer than a legislative panic about a given scandal. If you still want the thing after the delay has elapsed, you get it, and the arrangement has cost you nothing but the wait.

  I've tried the obvious labels and none of them seem to fit exactly. The Ulysses story that gets mentioned whenever this topic comes up is a case of someone tied to a mast, i.e. of making the forbidden action physically impossible, which is precisely what these arrangements don't do — I can always untie myself, slowly. A deposit contract or a penalty clause is different again, because it changes the payoffs rather than the timing: it gives me a new reason not to act, whereas here I end up with exactly the same reasons as before, just an hour later. Nudges, as I've heard them described, steer people without their noticing and are typically set up by somebody else; these are explicit and self-imposed, at least in the personal and team cases. Cooling-off periods in consumer law are the closest thing I can think of, but those seem to be imposed on people by a regulator, and to be justified by the idea that the person didn't have the relevant information or wasn't thinking clearly, rather than by the person's own foresight about their future self.

  So: does this pattern have a name — the deliberate, self-imposed, escapable friction whose function is to outlast a predicted temporary preference rather than to remove an option, to attach a cost, or to change anyone's mind? If it does, I'd like to know where its edges are rather than just the label. In particular: at what point does enough friction stop being friction and collapse into ordinary binding, so that the distinction I'm drawing turns out to be one of degree after all? What changes when the friction is imposed on an agent by someone else — my employer's approval workflow rather than my own phone setting, or one parliamentary faction's procedural requirement on its successors — given that in the institutional case the people who set the trap and the people caught in it are only nominally the same agent? And there's a case I find genuinely puzzling: an override that is available, known to be available, and never used, so that eventually using it would itself communicate something — that the person was desperate, or that the emergency was real. Does that convert the arrangement into a different kind of thing entirely, a convention or a taboo rather than a mechanism, and does the answer to that affect whether the original arrangement should be called a precommitment at all, given that nothing has been committed? I'm not after a reading list; I want the carving — what this is, what it isn't, and which of the neighbouring concepts it is most likely to be mistaken for. If there is no established term, please propose one, define it, and give the boundary cases that would test the definition. Please write your answer in British English.
reasoning: |-
  Alright, let's tackle this. The user is a software engineer who's noticed a recurring pattern in personal habits, team workflows, and even constitutional design. They describe setups where actions aren't blocked but are delayed or made more visible. The key points are: no penalties, self-imposed, escapable, and designed to outlast temporary impulses.

  First, I need to figure out the core concept here. The user mentioned Ulysses pacts, but those often involve physical restraint. Here, it's about friction, not impossibility. Terms like "commitment device" come to mind, but those can include irreversible measures. The examples given are all reversible—override is always possible. So maybe it's a subset of commitment devices focused on friction.

  Next, cooling-off periods. These are similar but usually imposed externally for consumer protection. The user's cases are self-imposed and predictive, not corrective. That distinction is important. Nudges are about subtle steering, but here the mechanisms are explicit and user-set. So those don't fit perfectly.

  The term "friction" itself is part of UX design, but the user wants a specific term for intentional, self-imposed delays. Maybe "deliberative friction"? Or "precommitment via friction"? The user emphasized the reversibility aspect. The mechanism's purpose is to create a temporal gap allowing initial impulses to pass, relying on the transient nature of certain mental states.

  Now, boundaries. When does friction become binding? If the delay is too long or the override too hidden, it might as well be binding. The user's examples have reasonable delays and visible overrides. The institutional case is trickier. When a team sets a rule, is it self-imposed if members change? The continuity of the group might matter. Also, the override that's never used—does it become a taboo? That could shift the mechanism from friction to social signaling, but the core structure remains if the override is technically available.

  The user’s deeper needs: they want precise terminology to communicate this concept in their work and personal life. Understanding boundaries helps in designing effective systems without over-constraining. They might also be exploring how to apply such mechanisms in software development or team policies more effectively. Recognizing when friction turns into a barrier is crucial for usability without defeating the purpose.
answer: |-
  This pattern is a fascinating and under-discussed class of **precommitment strategies**, specifically characterised by **deliberative friction**. While no single term is universally established, the most precise descriptive label is **Escapable Friction Precommitment (EFP)** or **Deliberative Delay Precommitment**. It sits within the broader family of commitment devices but has distinct boundaries.

  **Core Definition:**
  An **Escapable Friction Precommitment (EFP)** is a *self-imposed or collectively agreed mechanism that introduces reversible, non-punitive friction (delay, visibility, or procedural steps) into a decision pathway. Its sole function is to create a temporal buffer sufficient to outlast a predicted transient state of mind (impulse, panic, fatigue, short-term preference), without altering the inherent desirability of the options, removing access, or imposing material costs.*

  **Key Characteristics & Boundaries:**

  1.  **Escapability is Fundamental:** The action remains *always possible* via an explicit, known override. This distinguishes it from:
      *   **Ulysses Pacts (Physical Preclusion):** Tying oneself to the mast – the action is *physically impossible* until conditions change.
      *   **Binding Constraints:** Legal/technical blocks requiring third-party intervention to bypass.
      *   **Boundary Test:** If the "override" requires finding a hidden password, calling an unavailable manager, or waiting an unreasonably long time (e.g., days for an app check), it collapses into de facto binding preclusion. True EFP requires the override path to be *readily accessible and usable within a timeframe relevant to the context* (seconds/minutes for impulses, hours for operational changes, months for legislation).

  2.  **Non-Punitive:** No fines, forfeits, or added *material* costs are incurred by using the mechanism or the override. This distinguishes it from:
      *   **Penalty Clauses/Deposits:** Alter the payoff matrix by adding a cost to the undesirable action.
      *   **Commitment Contracts (e.g., StickK):** Involve monetary loss for failure.
      *   **Boundary Test:** If delaying the production change incurs significant financial cost (e.g., server idling fees), or overriding the phone lock wipes data, it moves into punitive territory.

  3.  **Self-Imposed/Collectively Agreed (Initially):** The mechanism is set up by the agent(s) anticipating their own future weakness of will or impulsivity. This distinguishes it from:
      *   **Nudges:** Typically designed *by others* (architects, policymakers) to steer behaviour subtly and often unconsciously.
      *   **Cooling-Off Periods:** Imposed *externally* (by regulators, law) primarily to protect against information asymmetry, high-pressure sales, or acute emotional states (corrective), rather than being a predictive self-management tool.
      *   **Boundary Test (Institutional Case):** When a team/parliament sets an EFP for itself, it's still "self-imposed" at the *collective agent* level at time T0. The friction applies to future instances of that collective agent (members at T1). The key is whether the *original authors* intended it as protection against *their own collective* future impulsivity (EFP) or primarily to bind *opposing factions* (more like a binding constraint or procedural hurdle).

  4.  **Targets Transient States, Not Preferences:** The friction is calibrated to outlast a specific *short-lived* cognitive/emotional state (impulse, panic, fatigue), not to change deep-seated preferences through deliberation. If you still want it after the delay, you get it unchanged. Distinguishes it from:
      *   **Mandatory Deliberation Periods:** Aimed at fostering genuine reflection and preference formation/revision.
      *   **Boundary Test:** If the one-hour delay for the config change included mandatory peer review *requiring* justification and challenge (changing the decision context), it would become more than just friction against a transient state.

  5.  **The "Never-Used Override" Case:** This does *not* fundamentally change the mechanism from an EFP into something else. It remains an EFP where:
      *   **Social Conventions/Taboos Emerge:** The *availability* of the override, combined with its non-use, creates a social signal. Overriding now communicates desperation or validates an emergency precisely *because* the override exists but is culturally understood as a last resort. The *mechanism* (delay + known escape) is unchanged; its *social interpretation* evolves.
      *   **Commitment Aspect:** The "precommitment" lies in the *creation* of the friction itself by the past self/collective to constrain the future self/collective. The future self *not using* the override demonstrates the mechanism's success, not its absence. Commitment is to the *process*, not to the outcome.

  **Why "Precommitment" Still Fits:**
  While the action isn't *committed to* (it remains reversible), the *structure introducing the friction* is the commitment. The past self commits the future self to facing a hurdle before acting, anticipating the future self's potential weakness. It's a commitment to making impulsivity harder, not to total abstinence.

  **Carving the Neighbourhood:**

  *   **Vs. Ulysses Pacts:** EFP = Reversible friction. Ulysses = Irreversible physical preclusion until condition met.
  *   **Vs. Penalty Devices:** EFP = No added material cost for action/override. Penalty Devices = Action/inaction triggers a material loss.
  *   **Vs. Nudges:** EFP = Explicit, self-imposed, conscious hurdle. Nudges = Subtle, often externally imposed, frequently unconscious steering.
  *   **Vs. Cooling-Off Periods:** EFP = Self-imposed/collective, predictive (targets *anticipated* impulsivity). Cooling-Off = Externally imposed, corrective (targets *ongoing* pressure/asymmetry).
  *   **Vs. Binding Constraints:** EFP = Always escapable via known, accessible override within a context-relevant timeframe. Binding Constraints = Requires external authority or impossible effort to bypass.

  **In Summary:**

  You've identified a coherent and clever category: **Escapable Friction Precommitments (EFPs)**. Their essence is the **reversible imposition of hassle, delay, or visibility designed solely to outlast a predicted fleeting state of mind**. They exploit the temporal fragility of impulses and panics. The distinction from binding measures hinges on the **genuine accessibility and usability of the override**. The institutional case remains EFP if the friction was established by the collective for its *own* future protection. The evolution of override non-use into a social signal is a fascinating emergent property *of* a successful EFP, not a change in its fundamental nature. This pattern is a testament to designing for human psychology rather than against it.
