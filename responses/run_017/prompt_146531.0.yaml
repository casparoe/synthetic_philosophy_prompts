  Okay, the user writes historical fiction based on archival documents and has developed personal ethical guidelines for when invention is permissible. They present 12 specific cases where they've made judgment calls, some conflicting, and seek a unified principle. The core tension revolves around respecting historical record versus creative necessity, with particular sensitivity around representing real people versus invented characters.

  The user's existing framework has two clauses: (1) invent only into silences, never against records, and (2) invent only what couldn't have been recorded (thoughts, domestic life). But their own verdicts reveal cracks in this system. Key contradictions include: inventing an MP's motives (fine) but not bribes (not fine); giving a real woman no backstory (not fine) while freely inventing a maid's entire life (fine); repurposing real quotes for fictional characters (fine) but not for other real people (not fine).

  What's really being negotiated here seems deeper than archival gaps. The strongest pattern I notice is differential treatment of three categories: completely fictional characters (full freedom), obscure historical figures (moderate freedom), and well-documented/recent people (strict limits). The user's discomfort peaks when inventions might distort legacies (case 9), misrepresent real relationships (case 5), or violate reader trust (case 7).

  Their philosophical dilemma in case 10 is particularly thorny - does inventing lives for enslaved people honor them or perpetuate archival violence? And case 12 suggests temporal proximity matters, likely due to living descendants. Several verdicts also show that presentation (how inventions are framed) carries ethical weight independent of content.

  The user's closing questions reveal awareness of bigger issues: genre expectations, the archivist's role, and whether dense records constrain or liberate invention. Their phrase "the archive should not set the terms of who gets a life" hints at political stakes beyond aesthetics.

  For a coherent principle, we need to move beyond binary silence/record distinctions. The ethical lines seem drawn around: potential harm to real people's legacies, fidelity to documented relationships, and transparency about invention. Reader expectations aren't incidental - they're part of historical fiction's contract. The solution should explicitly address power dynamics: who has been historically silenced, and who might be harmed by invention today.

  I'll propose a three-clause framework that prioritizes: (1) protection of real individuals' legacies, (2) proportional invention based on archival presence, and (3) narrative transparency. This explains why merging clerks is fine only with name changes (prevents false attribution), why the MP's bribe felt wrong (implies undocumented corruption), and why the fictional maid's diary needs framing devices but the real woman's childhood can't be invented (no one is misled about the former).

  The framework also resolves their unsettled cases: an invented archivist presenting fakes would require clear fictional framing; atrocity witnesses can be invented if no survivors are misrepresented; dense records constrain invention about that person's known life but license it for their undocumented contexts; standing for a class is acceptable if not reductionist. Genre matters profoundly - what's ethical in roman à clef differs from documentary fiction.

  Most crucially, this transforms "inventing into silence" from permission to responsibility when representing marginalized groups, as the user intuitively felt in case 11. The principle doesn't overturn their verdicts except case 4 (the real woman's backstory) - with proper framing, this could be permissible if presented as speculation. Their discomfort with case 10 is validated; the solution requires acknowledging the archive's violence while avoiding reinscription.
answer: |-
  Here’s a unified principle distilled from your verdicts, with clauses addressing the nuances of harm, fidelity, and reader trust. It prioritizes **protecting real individuals, honoring documented relationships, and maintaining transparency**:

  ---

  ### **The Principle of Historical Invention**
  **Core Ethic:** *Invent to illuminate the human experience obscured by archival silence, but never in ways that distort real lives, violate documented truths, or betray reader trust.*

  **Clause 1: The Shield of Obscurity**  
  *Invent freely for individuals the archive renders anonymous or generic (e.g., unnamed enslaved people, "a housemaid").*  
  - **Why:** Silence here reflects historical erasure; invention restores agency (Case 10: naming enslaved people).  
  - **Limits:** Avoid reducing groups to symbols (e.g., one maid standing for "all the poor" risks stereotype).  
  - **Verdicts Supported:** 3 (invented maid), 10 (naming the unnamed).  

  **Clause 2: The Constraint of Legacy**  
  *For named, documented individuals, inventions must:  
  (a) Avoid attributing unrecorded actions that imply moral/criminal weight (bribes, crimes, betrayals);  
  (b) Respect temporal proximity (greater caution for recent figures with living ties);  
  (c) Never alter documented relationships or events.*  
  - **Why:** Prevents harm to legacies and upholds fidelity to the record (Case 2: MP’s bribe; Case 9: shameful act for renamed real person; Case 12: 1971 figure).  
  - **Verdicts Supported:** 1 (MP’s motives fine—internal), 2 (bribe not fine), 4 (real woman’s childhood not fine), 6 (porridge fine; not burning letter not fine), 12 (recent figure stricter).  

  **Clause 3: The Transparency Rule**  
  *Framing matters. Never present inventions as recovered documents unless clearly signaled within the fiction.*  
  - **Why:** Reader trust hinges on understanding what is imagined vs. found (Case 7: diary shelfmark not fine; fictional discovery fine).  
  - **Verdicts Supported:** 7 (presentation matters), 8 (merged clerks with real name not fine—implies false specificity).  

  **Clause 4: The Voice Boundary**  
  *Repurpose recorded words ONLY for fictional characters. Never reassign real people’s documented words to other real people.*  
  - **Why:** Preserves the integrity of historical voices (Case 5: memoir quote to maid fine; real letter to another real woman not fine).  
  - **Verdicts Supported:** 5 (words track the speaker’s reality).  

  **Clause 5: The Obligation to the Silenced**  
  *Where the archive systematically omits a class (the poor, women, enslaved people), invention is not just permissible but necessary to resist replicating historical exclusion.*  
  - **Why:** Corrects archival bias (Case 11: refusal-only novel fails this; Case 3: maid’s life essential).  
  - **Verdicts Supported:** 3, 10, 11.  

  ---

  ### **Verdicts Overturned or Challenged**
  - **Case 4 (Real woman’s childhood):** Under Clause 2, this *could* be permissible if framed as plausible speculation (e.g., "Perhaps she knew a childhood like...") and avoids contradicting her documented self. Your removal was ethically sound but not strictly required if handled cautiously.  
  - **Case 8 (Merged clerks with real name):** Clause 3 forbids this—it implies a false documentary claim. Use an invented name.  
  - **Case 6 ("Did not burn the letter"):** Clause 2(c) makes this *not fine*—it resolves a central historical ambiguity, altering interpretation of documented facts. Your rewrite was correct.  

  ---

  ### **Predictions for Unsettled Cases**  
  1. **Novel narrated by an invented archivist presenting faked documents:**  
     - **Verdict:** *Fine* if the *fiction* openly frames it as fabrication (e.g., an unreliable narrator). Not fine if presented as "found" without meta-commentary (violates Clause 3).  

  2. **Depicting a documented atrocity via invented witnesses:**  
     - **Verdict:** *Fine* if witnesses are anonymous composites (Clause 1). Not fine if they replace or contradict specific victim/survivor accounts (Clauses 2, 5).  

  3. **Inventing interiority for a sparsely vs. densely documented person:**  
     - **Verdict:** *More constrained for the well-documented person* (Clause 2). For example: Inventing thoughts for a clerk known only through payroll records is freer than for a diarist whose letters survive. Dense records create a "psychological footprint" narrowing plausible invention.  

  4. **One invented character representing an unrecorded class:**  
     - **Verdict:** *Fine* if the character avoids stereotype and the narrative acknowledges their emblematic role (Clause 5). Not fine if presented as *the* definitive experience.  

  5. **Genre’s contract with the reader:**  
     - **Verdict:** *Critical.* A roman à clef (where real people are lightly fictionalized) demands stricter adherence to Clauses 2 and 4. Documentary fiction (marketed as "based on the archive") requires Clause 3 transparency. Reader expectations *are* part of the ethic—violating them breaches trust (Case 9’s strength reflects this).  

  ---

  ### **The Underlying Ethic**  
  Your pattern reveals a hierarchy of responsibility:  
  1. **Real, documented individuals** (especially those with living ties) → *Maximal protection.*  
  2. **Real but anonymous/generic figures** → *Creative liberty with restorative intent.*  
  3. **Wholly invented characters** → *Unconstrained invention.*  

  This isn’t just about "silence" but about *power*: who the archive empowered, who it erased, and who might be harmed by invention today. Your instinct to invent courageously for the silenced (the maid, the enslaved) while protecting the legacies of the recorded (the MP, the letter-writer) is the coherence you seek.
