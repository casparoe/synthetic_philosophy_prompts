  Alternatively, the allocation decision is to choose one student to receive 1000 chips, and the rest get nothing. Then the group must decide who gets it. But then we have 18 people and we need to compare many pairwise.

  Given time constraints, I suggest we focus on one pair for the allocation decision. We can have a preliminary round to select which pair is most contentious.

  But let's design the activity as follows:

  1. Setup (10 minutes):
     - Explain utility functions: each student has a card that specifies their personal utility function in their own units. The function is of the form: U = base + (marginal utility of chips) * (number of chips).
     - Goods: only chips. So no trading round (because only one good). But then we don't reveal marginal utilities? We need a way to reveal the marginal utilities.

  We must reveal the marginal utility of chips for each student. How? By having a second good that they can trade.

  Introduce a second good: "tokens". Each student starts with an endowment of chips and tokens. They can trade tokens for chips with a central market (or with each other) at a price that they choose? Or we can have a market price.

  But this might take too long.

  Alternative: each student is given a card that specifies their marginal utility of chips (m_i) and their base utility (B_i). The base utility is fixed and not affected by anything. The marginal utility is also fixed. In the swap auction, they will use these to compute utility.

  We then have an initial distribution of chips: say, 100 chips for each student.

  Then we do the swap auction.

  Swap auction procedure (15 minutes):
     - The reference person (A) is chosen. Their utility is fixed as U_A = C_A (so base=0, marginal=1).
     - For each other student j, we ask: how much is each student i willing to bid (in chips) for the right to swap with j? 
     - We do a sealed bid: each i submits a bid for j. The highest bidder wins and pays the bid to the auctioneer (chips are removed from circulation), and then the winner and j swap cards and bundles.

  But note: after swapping, the cards are swapped, so the marginal utility and base change.

  We do this for several rounds? Or only one round? Given time, one round might be enough.

  After the swap auction, we have a record of some bids. For example, we know that for student j, student i bid X_{i,j} to swap with j.

  Now, the allocation decision (20 minutes): the group must allocate 1000 additional chips to one student. They can choose any student. They want to maximize total utility (or follow some other rule, but we will guide them to total utilitarianism for the sake of the example).

  But total utility requires summing utilities, which requires a common unit.

  The reference person is A: so we express everything in A's unit.

  For any student i, the utility gain from 1000 chips is 1000 * m_i (in i's own unit). But to convert to A's unit, we need to know the scaling factor for i relative to A.

  From the swap auction, if we have a bid by A to swap with i, then we have:
     U_i(i's bundle) = U_A(A's bundle - X)   [where X is A's bid]
     => B_i + m_i * C_i = (C_A - X)

  This gives us the level of i's utility in A's unit at the current bundle. But it does not give us m_i separately. We have one equation with two unknowns (B_i and m_i). So we cannot determine the gain from extra chips.

  Therefore, the group will have to assume something about m_i. They might try to use bids from other students to i, but it will be messy.

  To create the conflict, the instructor can then propose two different assumptions:
     Assumption 1: for student i, suppose that the base utility B_i is 0. Then from the equation: m_i * C_i = C_A - X, so m_i = (C_A - X)/C_i.
     Assumption 2: suppose that the base utility B_i is very high (or low) and then m_i is small (or large). For example, set m_i = m0 (some arbitrary value) and then B_i = (C_A - X) - m0 * C_i.

  Then the gain from 1000 chips to i is 1000 * m_i. Under assumption 1, it is 1000 * (C_A - X)/C_i. Under assumption 2, it is 1000 * m0.

  We can choose m0 so that the gain is large in one case and small in the other.

  For example, if student i's current chips C_i is small, then under assumption 1, m_i is large, so we want to give to i. Under assumption 2 with a small m0, the gain is small.

  The group will see that the allocation decision flips depending on the assumption.

  Then the veil of ignorance round: behind the veil, they don't know which card they will get. They know the distribution of card types. They choose a rule for allocation (e.g., give to the person with the highest m_i, or highest current utility, etc.).

  In the veil round, they might choose to maximize expected utility, which requires them to weight the gains by the probability of being that person.

