  - No real money, but we can use poker chips as a medium.
  - Each student gets a private payoff table in their own unnamed units for some goods (chips, minutes of quiet, songs, etc.).
  - Designate one student as the 'reference person' (fixed unit).
  - Include a round where students can bid chips to swap entire situations (to introduce level comparisons).
  - A final round behind a veil of ignorance: choose a rule without knowing which card they'll get, with a non-uniform lottery (so they can't just average).

  The activity should lead to a situation where two different translation schemes (both consistent with observed behavior) lead to opposite allocation recommendations. The debrief should map moments in the game to concepts: level vs. gain comparisons, unit vs. origin, why swap and veil rounds can come apart, sum vs. prioritarianism.

  Predictable problems:
  - Strategic misreporting: design so that truth-telling is dominant or irrelevant.
  - Utility monster: if one card has extremely high payoffs, it might dominate.
  - Reference person might feel awkward or biased.
