answer: |-
  Below is a structured 80-minute activity designed to force students into the core problem of interpersonal utility comparisons. The activity uses **private payoff tables**, a **reference person**, a **swap auction**, and a **veiled lottery** to demonstrate that two behaviorally consistent utility scales can recommend opposite allocations. The debrief explicitly ties each phase to ethical-economic concepts.

  ---

  ### **Rules, Roles, and Materials**
  - **Materials**: 
    - Poker chips (representing "wealth"), 
    - Index cards (pre-printed with private payoff tables), 
    - Whiteboard (to record allocations), 
    - Projector (to display rules/aggregate data).
  - **Goods**: Two goods for simplicity:  
    - **Chips** (tradable, stored value).  
    - **"Vibes"** (non-tradable, card-specific happiness from luck/health; fixed per card).  
  - **Utility Function**: `U_i = (Vibes_i) + (Sensitivity_i × Chips)`.  
    - `Vibes_i`: Fixed baseline happiness (positive/negative).  
    - `Sensitivity_i`: Marginal utility of chips (how much 1 chip boosts utility).  
    - *Units are private and unnamed* (e.g., "utils").
  - **Roles**:  
    - **Reference Person (RP)**: Publicly designated (e.g., volunteer). Their `Sensitivity` is fixed at **1.0 util/chip** (sets the unit).  
    - **All Others**: Hold private cards with unique `(Vibes, Sensitivity)` pairs.  
    - **Auctioneer**: TA (you) runs swaps.  
    - **Math Majors**: Assign as "data recorders" to track bids/allocations (prevents boredom, leverages skills).

  ---

  ### **Card Design**  
  Create 18 cards with varied `(Vibes, Sensitivity)` to ensure conflicts. Example:  
  | Type  | Vibes | Sensitivity | Initial Chips | Utility at Start* |
  |-------|-------|-------------|--------------|-------------------|
  | A     | 0     | 1.0 (RP)    | 100          | 100              |
  | B     | 50    | 0.5         | 100          | 100              |
  | C     | -100  | 2.0         | 100          | 100              |
  | D     | 200   | 0.3         | 100          | 230              |
  | ...   | ...   | ...         | ...          | ...              |

  \* *Initial utility = Vibes + (Sensitivity × 100). All start at different utility levels despite 100 chips to prime level-comparison debates.*  

  - **Utility Monster**: Include 1 card with extreme `Vibes` (e.g., 500) or `Sensitivity` (e.g., 5.0) to test prioritization rules.  
  - **Cards are private**—only the holder sees their `(Vibes, Sensitivity)`.

  ---

  ### **Timeline (80 Minutes Total)**  
  **Phase 1: Setup (10 min)**  
  - Explain rules: Utility = `Vibes + (Sensitivity × Chips)`.  
  - Designate RP (unit fixed at 1.0 util/chip).  
  - Distribute cards and 100 chips to each student.  
  - **Key Point**: "Your card is private. We’ll make allocation decisions requiring utility comparisons."

  **Phase 2: Swap Auction (20 min)**  
  - **Goal**: Force level comparisons (total utility) by bidding to swap lives.  
  - **Rules**:  
    - Students bid chips to swap their **entire situation** (card + chips) with another.  
    - Auctioneer (you) calls one student at a time. Others bid to swap with them.  
    - Highest bidder pays their bid to the auctioneer (chips destroyed), then swaps cards/chips with the target.  
    - *Incentive*: Bid if you value their life > your life minus bid cost.  
  - **Example Math**:  
    - Alice (Vibes=0, Sens=1.0, 100 chips) bids for Bob (Vibes=50, Sens=0.5, 100 chips).  
    - Alice’s utility from Bob’s life: `50 + (0.5 × 100) = 100`.  
    - Alice’s current utility: `0 + (1.0 × 100) = 100`.  
    - She bids **≤0** (indifferent). If Bob had Vibes=200, she’d bid up to 200 chips.  
  - **Predictable Problem**: Strategic underbidding.  
    - **Mitigation**: Emphasize, "Bid your true value—this isn’t about strategy." Use math majors to verify bids.  

  **Phase 3: Allocation Decision (25 min)**  
  - **Goal**: Expose that marginal utility (`Sensitivity`) is unobservable and scales are arbitrary.  
  - **Task**: Allocate 1,000 extra chips to **one student** to maximize total utility.  
  - **Process**:  
    1. Students debate using swap-auction data (e.g., "RP paid 50 chips to swap with X, so X’s total utility is high!").  
    2. **Intervene**: Project two affine transformations for the same student consistent with observed behavior:  
       - *Student Y*: RP paid 80 chips to avoid swapping with Y.  
         - **Scale 1** (assume Vibes=0): `Sensitivity_Y = 0.2` → Gain from 1,000 chips = 200 utils.  
         - **Scale 2** (assume Vibes=120): `Sensitivity_Y = 1.0` → Gain = 1,000 utils.  
       - *Allocation flips*: Scale 1 says "give to Z"; Scale 2 says "give to Y."  
    3. Vote → Record disagreement.  
  - **Predictable Problems**:  
    - **Math majors solve it**: Ask them to *lead* the transformation exercise.  
    - **Utility monster dominates**: If chosen, ask, "Is this fair? What if their scale is arbitrary?"  

  **Phase 4: Veiled Lottery (15 min)**  
  - **Goal**: Show how veil of ignorance avoids interpersonal comparisons.  
  - **Rules**:  
    - Students return cards. Shuffle and redistribute **face down** (no peeking).  
    - Lottery odds: 60% Type A (low Vibes), 30% Type B (medium Vibes), 10% Monster (high Vibes).  
    - Decide an allocation rule for the 1,000 chips *before* seeing cards (e.g., "give to most sensitive," "split equally").  
  - **Key Twist**: Unequal odds prevent default averaging. Students must weigh risk.  

  **Phase 5: Debrief (10 min)**  
  Map game moments to concepts:  
  | **Game Moment**              | **Concept**                                  | **Why It Matters**                                                                 |
  |------------------------------|---------------------------------------------|-----------------------------------------------------------------------------------|
  | Swap auction bids            | Level comparisons (total utility)           | Reveals willingness to pay for others’ lives, but not marginal gains.             |
  | Conflicting scales for allocation | Affine transformations (unit/origin)  | No behavioral data resolves scaling; allocations depend on arbitrary choices.     |
  | Veil vs. allocation decision | Gains vs. levels                            | Veil focuses on expected gains; allocation requires interpersonal comparisons.    |
  | Unequal lottery odds         | Risk aversion & prioritization              | Forces trade-offs: maximize sum vs. help worst-off (monster may lose).           |
  | Utility monster in veil      | Ethical limits of utilitarianism            | Even behind the veil, students may reject rewarding extreme sensitivity.          |

  ---

  ### **Predictable Problems & Solutions**  
  1. **Strategic Misreporting**:  
     - In swap auction: Students underbid to "save" chips.  
       - **Fix**: Stress honesty; use chips only for activity (no real stakes).  
     - In allocation: Students lobby for chips.  
       - **Fix**: Redirect to "What does the *data* allow us to know?"  

  2. **Utility Monster Dominates**:  
     - If revealed early, students fixate on them.  
       - **Fix**: Use the monster to *teach*: "Does high self-reported = ethically compelling?"  

  3. **Reference Person Awkwardness**:  
     - RP may feel singled out.  
       - **Fix**: Rotate RP or use a volunteer who enjoys attention.  

  4. **Math Majors Check Out**:  
     - **Fix**: Assign analyst roles (track bids, compute transformations). Their "solving" helps the class see the arbitrariness faster.  

  ---

  ### **What the Activity Can't Show**  
  The activity **proves that utility scales are behaviorally underdetermined** (no observable fact can fix them), but it **cannot disprove that interpersonal comparisons are *objectively true***. Students may conflate "unobservable" with "nonexistent."  

  **Closing Lecture (5 min)**:  
  > "Today showed that no behavioral test can resolve which affine transformation is 'correct.' But this doesn’t mean all comparisons are false! Some philosophers (e.g., Harsanyi) argue we *can* make comparisons by imagining ourselves in others' shoes. Others (e.g., Robbins) say comparisons are inherently subjective. The takeaway: Welfare economics must either accept this ambiguity or find alternatives (e.g., veil of ignorance)."

  This bridges the gap between the activity and metaphysics, preventing accidental nihilism.

  ---

  ### **Why This Works**  
  - **Problem Encountered, Not Explained**: Students *build* conflicting scales and hit the wall of underdetermination.  
  - **No Real Money**: Poker chips prevent gaming; focus stays on ethics.  
  - **Math Majors Engaged**: As data referees, they validate the conflict.  
  - **Drama**: The utility monster and flipped allocations spark debate.  

  **Adjust on the Fly**: If time runs short, skip redistributing cards in the veil (use hypotheticals). If discussion lags, ask: "What would a utilitarian do? A Rawlsian?"
