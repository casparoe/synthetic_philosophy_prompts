  **Follow-up case:** (a) The same study with pre-commitment to one analysis. This is diagnostic because under Rule X, we would commission (because the analysis is fixed, so we can interpret the result) but under a rule that always avoids partner-manipulated evidence we would not. However, since precedent 4 commissioned a biased proxy (with known bias), Rule X would commission (a) but not the original. Therefore, if the committee commissions (a), it supports Rule X.

