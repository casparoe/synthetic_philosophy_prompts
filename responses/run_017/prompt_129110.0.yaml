prompt: |-
  I work at a smallish global-health foundation, and I've been going through the minutes of our Evidence & Measurement Committee — the subcommittee that decides whether to commission more measurement before we lock in a funding decision. I'm writing the memo for the next one and I'd like a second read before I stick my neck out.

  Their record so far (paraphrased from the minutes, with what I remember of the reasoning in brackets):

  - Cheap six-month head-to-head trial of two bednet distribution methods, results to us only, then we pick: commission. ["Standard."]
  - Same trial, but it would take three years and the decision is due in six weeks: don't commission. ["It'd land after we've already spent the money."]
  - Already-collected government data on regional malaria prevalence — free — except our charter obliges us to allocate strictly in proportion to measured prevalence, and most of us think that rule is badly miscalibrated: don't commission. ["The number would decide for us, and badly."]
  - A cheap, noisy, biased proxy outcome where we know both the direction and the size of the bias: commission. ["We just adjust."]
  - A moderately expensive study using an outcome measure nobody has ever validated — three incompatible models of how the measure maps onto what we actually care about, no way to rank them: don't commission. ["We'd be guessing about the guessing."]
  - A cheap staff survey that would change the thing it measures, because asking people whether they'd stay if we moved the program gets them started on planning to leave: don't commission.
  - A cheap, precise study we'd be obliged to publish, where a rival funder would read it and move into our districts first: don't commission. ["Looking is itself a signal."]
  - A result a partner already produced and left in a drawer — genuinely zero cost — on a question everyone agrees can't change what we fund this cycle: don't commission. ["Zero value isn't a reason to spend an hour."]

  The new one. Our partner org is offering, at their own cost and on our timeline, a comparison of the two programs we're choosing between. They'll pre-specify a handful of analyses, run them honestly and accurately, and then send us one: whichever makes their favourite program look best. We know they'll do that. It isn't deception, it's selection. What we can't do is say how much room that gives them. Under one model all the analyses agree and it makes no difference; under another they diverge widely and whichever one they pick is close to arbitrary. We have maybe four plausible models of the divergence, no way to rank them, and no probabilities to put on them. Everything else is clean: costs us nothing, no delay, results private, and afterwards we'd sit down and re-decide from scratch, no formula, no charter rule, no outside body forcing our hand.

  I keep circling back to Good's theorem — the result that for an expected-utility maximiser who updates and then re-optimises, free information can't make you worse off; the worst it can be is worth nothing. But I can't tell whether this case is inside or outside the scope of that result, because the bit I'm unsure about is whether "we have four models and no probabilities over them" is just an ordinary prior over models (in which case the reported number is still an ordinary signal and the theorem applies) or whether it breaks the single-prior assumption the theorem needs. I have a vague feeling that once you only have an unrankable *set* of priors the non-negativity guarantee is up for grabs, but I genuinely don't know, and I don't want to lean on it. There's also a dumber reading of the whole record: that the committee isn't running any theorem at all, just asking "will this improve the argument we'll actually have in the room" — and a number hand-picked by someone with a favourite, which we can't discount, is exactly the kind of thing that makes an argument worse.

  What I want from you: your best guess at what they should decide if they want to be consistent with themselves; the two or three different rules that fit all eight precedents equally well; what each of those rules predicts about the partner's study; which precedent is genuinely the closest analog (I keep flip-flopping between the unvalidated-measure one and the charter one); an honest statement of what principle they'd be committing to with each choice — including whether "we" means the committee as it actually argues or the committee as an ideal Bayesian; and the follow-up case that would actually separate the rules. My two candidates are (a) the same study except the partner pre-commits in writing to one analysis before running anything, and (b) a clean, unbiased, free measurement where the *unrankable models* are about how the program works rather than about how the result got selected. Say which of those is more diagnostic, or name a better one.
reasoning: |-
  We are given a set of precedents from the Evidence & Measurement Committee and a new case. The goal is to determine what decision (commission or not) would be consistent with the precedents, identify rules that fit all precedents, and then apply those rules to the new case. We also need to find the closest analog from the precedents, discuss the principles behind each rule, and propose a follow-up case to separate the rules.

  First, let's list the precedents and the decisions:

  1. **Head-to-head trial, cheap, 6 months, private results: COMMISSION**  
     Reasoning: Standard.

  2. **Same trial but 3 years (decision due in 6 weeks): DON'T COMMISSION**  
     Reasoning: Results come after the decision.

  3. **Free government data on malaria prevalence (but charter forces allocation by prevalence, which is miscalibrated): DON'T COMMISSION**  
     Reasoning: The number would force a bad decision.

  4. **Cheap, noisy, biased proxy outcome (known direction and size of bias): COMMISSION**  
     Reasoning: We can adjust.

  5. **Moderately expensive study using an unvalidated outcome measure (three incompatible models, no way to rank): DON'T COMMISSION**  
     Reasoning: We'd be guessing about the guessing.

  6. **Cheap staff survey that changes the thing it measures: DON'T COMMISSION**  
     Reasoning: The act of asking influences the outcome.

  7. **Cheap, precise study that must be published (rival would use it): DON'T COMMISSION**  
     Reasoning: Looking is a signal (strategic disadvantage).

  8. **Free result from a partner (on a question that can't change funding): DON'T COMMISSION**  
     Reasoning: Zero value, not worth the time.

  Now, the new case:

  - Partner offers, at their own cost and on our timeline, a comparison of two programs. 
  - They pre-specify several analyses but will choose the one that makes their favorite program look best. 
  - We know they will do this, but we don't know how much room they have to manipulate (i.e., how much the analyses might diverge). 
  - We have four plausible models of the divergence (how much the results might vary depending on which analysis is chosen), but no probabilities or ranking for these models. 
  - Otherwise, it's free, no delay, private results, and after getting the result we re-decide from scratch (no formula or external constraint).

  The question is: commission or not?

  We are also asked for:
  - The best guess for consistent decision.
  - Two or three rules that fit all eight precedents.
  - What each rule predicts for the new case.
  - The closest precedent analog.
  - The principle behind each rule (including whether the committee is acting as an ideal Bayesian or as a real arguing group).
  - A follow-up case to separate the rules.

  ### Step 1: Identify Rules from Precedents

  We need to find rules that explain all eight decisions. Let's look for patterns.

  **Common Reasons for NOT Commissioning:**
  - Precedent 2: Results come too late (timing).
  - Precedent 3: The information would force a bad decision (constraint).
  - Precedent 5: The measure is unvalidated and there's too much uncertainty (epistemic).
  - Precedent 6: The measurement process changes the outcome (reactivity).
  - Precedent 7: The measurement has negative strategic consequences (strategic).
  - Precedent 8: The information has no value (irrelevance).

  **Common Reasons for Commissioning:**
  - Precedent 1: Standard, timely, private.
  - Precedent 4: Known bias, so we can adjust.

  We can try to formulate rules:

  **Rule 1: Commission if and only if the evidence will be both (a) available in time for the decision and (b) useful for improving the decision.**

  But what does "useful" mean? We see from precedent 3 that even free and timely evidence is not useful if it forces a bad decision. Similarly, in precedent 5, the evidence is not useful because it's too uncertain.

  **Rule 2: Commission if the expected value of the information (EVI) is positive, considering all costs (including time, strategic, and cognitive costs).**

  However, the committee might not be computing EVI formally.

  **Rule 3: Commission unless at least one of the following applies:**
  - A. The evidence arrives too late (precedent 2).
  - B. The evidence would force a decision that is known to be bad (precedent 3).
  - C. The evidence is too uncertain to interpret (precedent 5).
  - D. The measurement process itself causes harm (precedent 6: reactivity; precedent 7: strategic).
  - E. The evidence has no chance of changing the decision (precedent 8).

  Precedent 4 is commissioned because we can adjust (so uncertainty is manageable) and it's cheap and timely. Precedent 1 is standard and meets all criteria.

  Now, let's see if we can express a rule that fits.

  ### Step 2: Formulate Consistent Rules

  **Rule A: Commission if the evidence is free (or cheap), timely, and private, and we have a method to account for known biases or uncertainties (like precedent 4). Otherwise, don't commission if there are additional negative factors (like timing, reactivity, strategic, or irrelevance).**

  But precedent 3 is free, timely, and private, but not commissioned because of the constraint. So we must add: and the evidence does not force a bad decision.

  **Rule B: Commission if the evidence is (1) available in time, (2) at low cost (including opportunity cost of time), (3) private (if strategic risk exists), and (4) we have a known way to interpret it (i.e., we can adjust for bias or the measure is validated).**

  But precedent 4 had a known bias and they adjusted, so condition (4) is met. Precedent 1: standard, so conditions (1-4) are met. 

  Now, for the non-commissioned ones:
  - Precedent 2: fails (1) [timing].
  - Precedent 3: fails (4) because the rule forces a bad decision? Actually, condition (4) is about interpretability. In precedent 3, the problem is not interpretation but the constraint. So we might need to adjust the rule.

  Alternatively, we can think about the decision-making process:

  **Rule C: Commission if the evidence has the potential to improve the decision (i.e., it could change the decision and we can use it appropriately) and the costs (including negative side effects) are low.**

  Let's check:

  - Precedent 1: Yes, potential to improve, low cost.
  - Precedent 2: No, because too late (so cannot improve the decision).
  - Precedent 3: No, because it would force a bad decision (so it doesn't improve the decision).
  - Precedent 4: Yes, we can adjust so it improves, low cost.
  - Precedent 5: No, because we cannot interpret it (so it doesn't improve the decision).
  - Precedent 6: The measurement causes harm (reactivity) so the cost is high (distortion) and the evidence might not be valid (so doesn't improve).
  - Precedent 7: Negative strategic cost (high cost) and the evidence might be used by rivals (so the net effect might be negative).
  - Precedent 8: No potential to change the decision.

