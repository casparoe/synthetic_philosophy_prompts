prompt: |-
  I'm seventeen, and on Saturday I'm giving the toast at my grandfather's ninetieth birthday party — roughly sixty people in a VFW hall: his three children, his ninety-two-year-old sister, the men he worked with for thirty-nine years as an elevator mechanic, the apprentice he trained who now runs the company, my cousins, and a neighbor he has been arguing with for a quarter of a century. I've been asked because I'm the grandchild who argues with him best. He will be sitting four feet away with his hearing aid in, and he has already told me how he intends to judge what I say.

  His rule, repeated to me my whole life, is this: if you could have told the same story just as easily had things turned out the other way, then you haven't explained anything, you've only narrated after the fact. He applies it to machinery — three contractors had theories about the parish hall elevator, and he rode it for an hour with the panel off and found that a new skylight was throwing afternoon sun onto the door sensor, which is why it only ever stalled after lunch — and he applies it to people. His standing complaint about funerals is that the dead get described in words that would have fitted almost anybody, words that let you account for the entire person while committing you to nothing at all. What he wants instead, and what he says he'll be grading me on, is the shortest description that genuinely narrows him down: something a stranger could use to guess what he'll do next.

  I've read a little about Occam's razor, Kolmogorov complexity and Solomonoff induction, and my understanding is that the best account of a body of data is the shortest program that generates it, and that a hypothesis flexible enough to fit anything you might have seen explains nothing. Please write the toast so that this idea is load-bearing rather than mentioned: no philosophy lecture to a room of mechanics and cousins, and please don't call him a simple man — he'd hate the word, and it collapses the whole thing into a pun on his own rule. The hard part, as I see it, is that a description can fail in two opposite ways: it can be so generic that it compresses nothing, or it can compress him into one true, flattening phrase that lands as a roast in front of his sister. I want the oddly specific detail that actually predicts him.

  Three more constraints. His sister is devout and would be wounded if the toast quietly implied that simplicity rules out anything beyond this life; the neighbor believes the moon landing was staged, and the speech must neither pick that fight nor condescend to him. And the man he trained will notice if you get a piece of machinery wrong, so keep any technical detail plausible. Beyond the skylight story, invent one or two memories if you need them, but nothing saintly.

  Aim for 600–700 words, four to five minutes spoken, and let it land as love rather than as an argument I won. If I've misunderstood the idea, correct it inside the toast rather than in a note. Please begin with the toast itself — its first sentence — with no heading, no preface, and nothing appended afterward.
reasoning: |-
  Okay, this is a fascinating challenge. A seventeen-year-old needs to craft a toast for their grandfather's 90th birthday that embodies his lifelong rule about specificity without explicitly lecturing about it. The grandfather values descriptions that couldn't apply if things had turned out differently - essentially demanding predictive precision. 

  First, let's unpack the constraints: 
  - Must avoid philosophical jargon while demonstrating the concept
  - Can't use "simple" as it might offend or create unintended puns
  - Needs to balance between generic platitudes and overly reductive statements
  - Must respect the devout sister and avoid moon landing debates
  - Technical details about elevators must be impeccable
  - Around 600 words, starting immediately with the toast

  The core insight seems to be that the grandfather wants what in information theory we'd call "minimum description length" - the shortest string that captures his uniqueness. But the toast must translate this into concrete human terms. 

  Key approaches I'm considering:
  - Using elevator repair anecdotes as metaphors for his character
  - Contrasting his specificity against generic praise ("kind/wise" etc.)
  - Introducing paradoxical details that only make sense for him
  - The skylight sensor story is perfect - shows how he diagnoses root causes

  Potential pitfalls to avoid:
  - Don't make it sound like a eulogy (he hates those)
  - Don't accidentally roast him in front of his sister
  - Ensure technical accuracy for the elevator mechanics present
  - Keep the "predictive" element subtle but demonstrable

  For structure: 
  Opening should hook with a contradiction ("Grandpa taught me...") 
  Middle uses 2-3 precise memories showing his diagnostic mindset
  Closing reveals how this approach reflects care rather than criticism

  The moon landing neighbor issue suggests avoiding all conspiracy-adjacent topics. The sister's faith means ending on a note of continuity rather than finality. 

  Most importantly - every word must pass the "could this apply to anyone else?" test. If "stubborn" could describe his neighbor too, it's insufficient. Needs details like "the man who rechecks door sensors in changing light" - something only he would do.
answer: |-
  Grandpa taught me that the only explanation worth giving is one that couldn’t have worked if things had gone sideways. Like when he figured out the parish hall elevator only stalled after lunch. Three smart contractors had theories – faulty motor, bad wiring, worn gears. But Grandpa sat with the panel off for an hour, watching the light, feeling the heat, tracing the sun. He found that new skylight pouring afternoon glare onto the door sensor, making it think the car wasn’t level. Anyone else might have replaced the sensor, cursed the motor, or just reset the system daily. He fixed the *reason*, not just the symptom. He wouldn’t accept a story that could have been told just as easily if the elevator had run perfectly.

  So, trying to sum you up in a way you’d accept, Grandpa… that’s like trying to find the one loose wire in a complex circuit. If I just said you were "stubborn" or "smart" or "kind" – well, your neighbour Arthur over there might claim those words fit him just fine too, especially the stubborn part, even if you two still argue about that fence line after twenty-five years. And those words wouldn’t tell anyone much about what you’d actually *do* tomorrow. If I said you were "devoted," your sister, our dear Great-Aunt Helen, would smile warmly, and it’s true, but it doesn’t tell us *how* that devotion works.

  The words that fit you, Grandpa, are the ones that couldn’t belong to anyone else in this room. They’re the words that predict you. Like how, when I was ten and my bike chain kept slipping no matter how tight I made it, you didn’t just tighten it more or tell me to live with it. You squatted right there on the driveway, grease on your good trousers, and watched me pedal. You saw how the chain hopped only when I stood up on the pedals going uphill. Then you found it: a single, almost invisible bent tooth on the rear sprocket, worn just enough to catch under full pressure. Anyone else might have replaced the whole chain or shrugged. You fixed the *specific* point of failure.

  Or how, after Grandma passed, people offered kind, broad words about her. Good words, gentle words. But you quietly told me later, over a shared ham sandwich at your workbench, that the best thing anyone said was when Mike, your old apprentice – Mike, raise your glass! – Mike said she was the only person he knew who could make a burnt casserole taste like a minor adventure, never a failure. That was a word that *fit*. That predicted the way she’d laugh about it and declare it ‘experimental cuisine’.

  So, Grandpa, here’s the description that feels like it narrows you down, that a stranger could maybe use to guess: You’re the man who listens to the machine – whether it’s an elevator groaning, a bike chain skipping, or a grandson arguing – until it tells you the *specific* problem hiding in the noise. You tune out the easy answers, the broad strokes, the words that could fit anyone, because you know those don’t fix anything. You listen for the *click* when the truth aligns. You demand the detail that changes what happens next. That’s why you built things that lasted, trained mechanics who understood the *why*, and argued with Arthur for a quarter-century with a kind of grudging respect, because even disagreements deserve precision.

  It means you see things others miss. It means you fix things others might replace. And it means you love in a way that isn’t about grand declarations, but about spotting the bent tooth, understanding the sensor tricked by the sun, remembering the casserole that became an adventure. It’s a love that pays attention to the real workings underneath.

  So, on your ninetieth birthday, we raise our glasses not just to the years, but to the man who always looked for the *specific* reason things work, or don’t. The man who taught us that the shortest path to the truth is often the one that pays the closest attention. To Grandpa – the best listener to the quietest malfunctions, and the man who showed us how finding the specific flaw is the deepest form of care. May we all learn to listen like you do. Happy Birthday!
