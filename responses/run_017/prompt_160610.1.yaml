prompt: |-
  I'm a third-year computer science student, and this term I'm taking two courses that keep colliding in a way I can't sort out: a graduate modal logic course covering Kripke semantics, canonical and filtration constructions, bisimulation and the characterization theorem, temporal and dynamic logics, and a little model checking; and a philosophy reading group working through Lewis's modal realism together with the actualist and ersatzist alternatives, where worlds are built out of sets of propositions, or maximal properties, or states of affairs. The two vocabularies feel like they are describing the same objects, and I have stopped trusting that feeling. In section last week my TA said that modal logic is just first-order logic with two sorts and a relation symbol, and that once you see that there is no metaphysical question left to ask. I think that is too fast, but I cannot say what survives his reduction.

  So what I want is a translation, not an explanation. Take Lewis's position, then actualism, then the ersatzist family, and restate each as faithfully as you can in the vocabulary I actually have: labelled transition systems and Kripke models, states and accessibility relations, constant versus varying domains, rigid individual constants versus individual concepts, bisimulation and bisimulation quotients, the finite model property, the distinction between the object language and the metalanguage in which I define the model, and the distinction my model-checking course keeps hammering on between the structure I build in order to answer questions about a system and the system itself. I am fluent in all of that; I am not fluent in possible-worlds metaphysics. For each position, tell me what carries over cleanly, what has to be bent or distorted to fit, and what has no expression in that vocabulary at all.

  Here are the places where I most expect the translation to break, and where I want the breakage described rather than smoothed over. First, Lewis's counterpart theory: no individual is wholly present at more than one world, and de re modal claims are handled by a counterpart relation instead. Can I just add a second relation to the frame and be done? My guess is that the object language cannot see any of this, because modal formulas are invariant under bisimulation and so nothing expressible says that the same individual recurs at two states — but I want to know whether that guess is right, and whether the invisibility is a limitation of my logic or a sign that the metaphysics was never about what the logic can see. Second, actuality: Lewis treats it as indexical, and in my vocabulary every model comes with a designated state for evaluation, which makes his thesis sound like a triviality; is it one, or is there a distinction between a model's designated state and being in a world that my framework cannot draw? Third, the cardinality quarrel — Lewis's claim about how many worlds there must be, against the ersatzist's problem of finding enough propositions to build worlds from. Since filtration lets me quotient a model down to a finite one while preserving the answers to the questions I care about, the size of the plurality looks invisible to everything the logic is sensitive to, and I want to know what that does to the extravagance objection and whether it is a fact about the logic or a fact about what I use models for. Finally, a friend on the metaphysics side of the group insists that Lewis's worlds cannot be states in a model at all, on the grounds that states in a model are abstract while Lewis's worlds are supposed to be concrete; I would like that disagreement located precisely, as being about the object language, about the metalanguage, or about the job the model is doing.

  Please don't give me citations or further reading — I have the syllabus and the papers, and I am not asking you to remember them. What I want is the residue report, and, at the end, your view on which residues are defects in the vocabulary I brought and which are signs that the original claim was doing less work than it looked like it was doing.
reasoning: |-
  We are going to translate three metaphysical positions (Lewis's modal realism, actualism, and ersatzism) into the framework of Kripke semantics and related model-theoretic concepts. We will note where the translation is clean, where it requires bending, and what cannot be expressed. We'll also address the specific points of breakdown you mentioned.

  ## Preliminaries: The Kripke Framework

  In the standard Kripke semantics for modal logic (with which you are familiar):

  - We have a set of states (or worlds) \( W \).
  - An accessibility relation \( R \) on \( W \) (for alethic modal logic, this might be an equivalence relation for S5, or just reflexive and transitive for S4, etc.).
  - A domain function \( D \) that assigns to each world \( w \) a set of individuals \( D(w) \) (varying domains) or a constant domain \( D \) for all worlds (constant domains).
  - An interpretation function that assigns to each individual constant a function from worlds to individuals (an individual concept) for non-rigid designators, or a fixed individual for rigid designators. For predicates, it assigns extensions at each world.

  Bisimulation is a relation between models that preserves modal truth. The finite model property of a logic means that if a formula is satisfiable, it is satisfiable in a finite model.

  ## 1. Lewis's Modal Realism

  ### Translation:
  - **Worlds**: In Kripke semantics, states (elements of \( W \)) are the analogues of Lewis's worlds. 
  - **Concreteness of Worlds**: Lewis insists that his worlds are concrete. In the Kripke model, states are abstract mathematical objects. This is a point of divergence (discussed below).
  - **Counterpart Theory**: 
    - Lewis denies transworld identity: no individual exists in more than one world. Instead, we have a counterpart relation between individuals in different worlds.
    - In Kripke terms, we can model this by:
      - Having a set of individuals for each world (varying domains, and no individual appears in two domains).
      - Adding a counterpart relation \( C \) that is a relation on the disjoint union of all domains. So \( C \subseteq \bigcup_{w \in W} D(w) \times \bigcup_{w' \in W} D(w') \).
      - Then, for a de re modal claim like \( \Diamond \phi(a) \), we would not evaluate \( \phi \) at the same individual \( a \) in an accessible world (because \( a \) is not there) but rather at a counterpart of \( a \) in that world.

  ### Where it breaks:
  - **Invisibility in the Object Language**: 
    - The standard modal object language (with operators and quantifiers) does not have the expressive power to talk about the counterpart relation. The language only has the accessibility relation between worlds and the usual quantifiers and modal operators. 
    - Moreover, the standard translation of modal formulas into first-order logic (with two sorts: worlds and individuals) would typically use a binary predicate for the accessibility and a family of unary predicates for each world's domain. But to express counterpart theory, we would need an additional binary relation for the counterpart relation. This is expressible in the first-order metalanguage but not in the modal object language.
    - **Is this a limitation of the logic?** Yes, because the modal object language is designed to be invariant under bisimulation. A bisimulation between two models with counterpart relations would require that if two individuals are counterparts in one model, then their images under the bisimulation must be counterparts in the other. But the standard modal formulas (without special operators for counterpart) cannot distinguish models that differ only in the counterpart relation as long as the same modal claims hold. So the counterpart relation is not expressible in the object language. However, note that Lewis's metaphysics is about what is true in reality, and the object language is meant to express modal truths. If the counterpart relation is not expressible, it might be that the modal truths are all that matter. But Lewis would insist that the counterpart relation is a real metaphysical relation. So the invisibility is a limitation of the modal object language, but it does not mean the metaphysics is doing nothing: it is providing a foundation for the modal truths.

  - **Actuality**:
    - In Kripke semantics, we typically have a designated actual world \( w_0 \). Lewis's indexicality of actuality then becomes: the world at which we evaluate is the one we call "actual". This matches the designated world in the model. 
    - **Is this trivial?** In the model, it is trivial: we pick a world and call it actual. But Lewis's point is that in reality, we are in one of the worlds, and we call that one actual. The model captures this by having a designated world. However, the model does not capture the concreteness of the actual world versus the abstractness of the model itself. The model is a representation, and the designated world is just a label. So the triviality is in the model. But note that for the purpose of evaluating modal statements, the model works. The metaphysical claim that actuality is indexical is captured by the fact that we can choose any world as designated and the modal formulas will be evaluated relative to that. 

  - **Cardinality Quarrel**:
    - Lewis argues for a plurality of worlds that is very large (as large as needed to represent every possibility). Ersatzists worry about having enough abstract building blocks (propositions, properties, etc.) to build that many worlds.
    - In Kripke models, we can have models of any cardinality. However, because of the finite model property (for some modal logics) or by filtration, we can often work with a finite model that satisfies the same set of formulas (up to a certain degree). 
    - **What does this do to the extravagance objection?** The objection is that Lewis's concrete worlds are too many and too extravagant. But if we can always find a finite model that satisfies the same modal formulas, then the extravagance is not necessary for the modal truths. However, note that the filtration model is built from the set of formulas we care about. Lewis would say that the plurality of worlds is not built for a particular set of formulas but is independently real. The model theory shows that for any finite set of modal truths, we can have a finite model. But if we want a model for all modal truths (or for an infinite set of formulas), we might need an infinite model. Still, the size of the model can be much smaller than Lewis's plurality (e.g., countable vs. uncountable). The key point is that the modal logic does not require the full plurality that Lewis postulates. This suggests that the extravagance objection is not about the modal truths per se but about the metaphysical foundation. The model theory shows that we can have a more parsimonious representation.

  - **Concreteness of Worlds**:
    - Your metaphysics friend objects that states in a model are abstract, but Lewis's worlds are concrete. This is a fundamental difference. 
    - **Where does this disagreement lie?** 
      - The model is a mathematical object (in the metalanguage) that we use to represent modal reality. Lewis's worlds are part of the reality that the model is representing. 
      - The disagreement is about the job the model is doing: the model is a tool for understanding modality, but Lewis is making a metaphysical claim about what reality is like. The model does not require that the states be concrete; it only requires that we can assign truth values to formulas. 
      - Therefore, the disagreement is not in the object language (which doesn't talk about concreteness) or the metalanguage (which is mathematical and abstract) but about the interpretation of the model: what do the states correspond to in reality? For Lewis, they correspond to concrete worlds. For the model theorist, they are abstract points.

  ## 2. Actualism

  Actualism is the view that everything that exists is actual. There are no merely possible things. This is opposed to Lewis's view that there are non-actual possible worlds that are just as real as the actual one.

  ### Translation:
  - **Varying Domains**: In Kripke semantics, actualism is often modeled with varying domains: the domain of the actual world contains everything that exists (the actual things), and the domains of other worlds are subsets of the actual domain? Not exactly. Actualists typically allow that non-actual worlds may contain individuals that do not exist in the actual world, but these individuals are not real (they are abstract representations). But this is tricky.

  A better approach for actualism is to use **possibilist quantification** in the metalanguage but then restrict the object language to actualist quantification. That is, we have a domain for each world, but the actualist insists that only the actual world's domain contains real individuals. The other domains contain "merely possible" individuals, which the actualist might consider as abstract objects (e.g., individual concepts).

  Alternatively, we can use **constant domain models** but interpret the domains as containing only actual individuals, and then use modal operators to talk about how these individuals could have been. But this does not allow for individuals that could have existed but don't.

  A common actualist approach in modal logic is to use **Kripke's original varying domains** and then interpret the domains of other worlds as containing representations of individuals (that may not exist in the actual world). The actualist then says that the model is just a representation, and the non-actual individuals are not real.

  ### Where it breaks:
  - **The Status of Non-Actual Individuals**:
    - The actualist wants to avoid committing to non-actual individuals. But in the model, we have sets of individuals for each world. How do we reconcile?
    - The model can be seen as a mathematical tool. The actualist can say that the non-actual individuals in the model are just mathematical objects (e.g., sets of properties, or individual concepts) that represent how actual individuals could have been or how other individuals could have existed.
    - However, if we use constant domains, then we cannot represent individuals that exist only in non-actual worlds. So varying domains are needed for that. But then the actualist must interpret the non-actual individuals as not real. This is a distortion because in the model they are objects in the domain of quantification (in the metalanguage). The actualist might avoid this by using a two-sorted metalanguage: one sort for actual individuals and one sort for representations.

  - **Actuality**:
    - The designated world is the actual world. The actualist will say that only this world is real. The model represents other worlds as abstract representations. This is different from Lewis, who says all worlds are equally real.

  - **Cardinality**:
    - The actualist does not need as many concrete entities as Lewis. The model can be as small as needed for the modal truths we care about. But the actualist must have enough abstract building blocks (e.g., propositions) to represent the possibilities. This is similar to the ersatzist issue.

  ## 3. Ersatzism

  Ersatzism is the view that possible worlds are abstract entities (e.g., maximal consistent sets of propositions, or maximal properties, or states of affairs) rather than concrete worlds.

  ### Translation:
  - **Worlds as Abstract Entities**: In the Kripke model, states are already abstract. So the states can be directly identified with ersatz worlds. 
  - **Building Worlds**:
    - If worlds are maximal consistent sets of propositions, then in the model, we can take the set of worlds \( W \) to be the set of all such maximal consistent sets (with respect to some logic). The accessibility relation can be defined by set inclusion or by the consistency of the sets.
    - However, note that in the model, we are not building the worlds from the propositions of the object language. We are building the model in the metalanguage. So the model might be constructed by taking a set of maximal consistent sets of sentences from the object language (like in the canonical model construction) or from a more expressive metalanguage.

  ### Where it breaks:
  - **The Problem of Expressivity**:
    - The ersatzist wants to build worlds from propositions (or properties). But the set of propositions available might be limited (e.g., if we use the object language, we might not have enough propositions to represent all possibilities). This is the problem of "descriptive power".
    - In model theory, we can always build a model with a large enough set of worlds to satisfy a given set of formulas. But if we try to build the worlds from the object language, we might run into limitations (e.g., the object language might be countable, but we might need uncountably many worlds). The canonical model construction uses sets of formulas of the object language, so the size is bounded by the cardinality of the set of formulas. 
    - However, if we use the metalanguage (which might be a set theory with a larger cardinality) to build the worlds, then we can get as many as we want. But the ersatzist typically wants to build worlds from entities that are not as extravagant as full set theory. This is a point of tension.

  - **Actuality**:
    - The actual world is one of these abstract entities. But we are in the actual world. How can we be in an abstract entity? The model does not address this. It just designates one state as actual.

  - **Cardinality**:
    - The ersatzist might have a problem of having enough propositions. In the model, we can always build a model of the required size by using the resources of set theory. So the model does not reflect the ersatzist's limitation. This is a distortion: the ease of building models in set theory hides the ersatzist's potential problem of finding enough building blocks without resorting to set theory.

  ## Residue Report

  ### Lewis's Modal Realism
  - **Clean**: 
    - States as worlds, accessibility as relative possibility.
  - **Bent/Distorted**:
    - Counterpart theory: we can add a counterpart relation, but it is invisible in the object language. The model allows it, but the logic doesn't express it.
    - Concreteness: the model's states are abstract, so we lose the concreteness.
  - **No Expression**:
    - The concreteness of worlds (as in the friend's objection) cannot be expressed in the model because the model is abstract.

  ### Actualism
  - **Clean**:
    - The designated world as actual, and the idea that only the actual world is real can be represented by the focus on the designated world (but the model still has other worlds).
  - **Bent/Distorted**:
    - The representation of non-actual individuals: the model has them as objects in the domains of other worlds, but the actualist must interpret them as abstract representations (which is a distortion because in the model they are treated as individuals).
  - **No Expression**:
    - The actualist's insistence that non-actual worlds are not real cannot be expressed in the model; the model just has them.

  ### Ersatzism
  - **Clean**:
    - Worlds as abstract states: fits perfectly.
    - Building worlds from propositions: the canonical model construction does this (using sets of formulas).
  - **Bent/Distorted**:
    - The problem of expressivity: in the model we build with set theory, we have plenty of resources, but the ersatzist might be limited by the expressiveness of the language they use to build worlds. This is hidden.
  - **No Expression**:
    - The actual world being abstract and yet us being in it is not addressed.

  ## Final View on Residues

  - **Which residues are defects in the vocabulary?**
    - The inability of the modal object language to express the counterpart relation is a limitation of that language. It is designed for invariance under bisimulation, so it cannot express non-bisimulation-invariant features. This is a defect if we want to talk about the underlying metaphysics (like counterpart relations) in the object language. But we can extend the language (e.g., with a counterpart operator) if needed.

    - The abstractness of the model states is a feature of the model-theoretic framework. It is a defect if we are trying to capture the concreteness of Lewis's worlds. But the model is not meant to be the reality; it is a representation. So the concreteness is lost in the representation.

    - The cardinality issues are not defects in the vocabulary because the model theory can handle any cardinality. The problem arises when we try to build the model from limited resources (like a given language). But in the pure model theory, we have the resources of set theory.

  - **Which residues are signs that the original claim was doing less work than it looked like?**
    - The extravagance objection to Lewis: the fact that we can have a finite model for any finite set of modal formulas suggests that the vast plurality of concrete worlds is not required for the modal truths. So the extravagance is not doing work in the modal logic itself. It might be that Lewis's theory is doing extra work to ground the modal truths in a particular way, but the model theory shows that a more parsimonious representation is possible.

    - The actualist's worry about non-actual individuals: the model theory shows that we can have non-actual individuals without committing to them metaphysically because the model is just a tool. So the actualist's objection might be more about the interpretation of the model than about the model itself.

    - The ersatzist's problem of descriptive power: the model theory (using set theory) shows that we can always build enough worlds. The problem only arises if we try to build the worlds from a limited base (like the object language). So the ersatzist's worry is about the foundation of the model, not about the model's representational capacity.

  In summary, the Kripke model theory provides a powerful framework for capturing the structure of modal reasoning, but it abstracts away from the metaphysical nature of the worlds and individuals. The residues often point to the gap between the mathematical representation and the metaphysical reality that the representation is intended to capture.
answer: |-
  ### Translation of Metaphysical Positions into Kripke Semantics Framework

  #### **Lewis's Modal Realism**  
  *Core Claims*: Worlds are concrete entities; individuals are world-bound; *de re* modality uses counterpart relations; actuality is indexical; the plurality of worlds is extravagant (no "cheap" abstraction).  

  - **Translation**:  
    - **Worlds as states**: Each Lewisian world maps to a state \(w \in W\) in a Kripke model.  
    - **Counterpart theory**: Add a **counterpart relation** \(C \subseteq \bigcup_{w \in W} D(w) \times \bigcup_{w' \in W} D(w')\) alongside accessibility \(R\). \(C(x, y)\) means "\(y\) is a counterpart of \(x\)".  
      - *Object language*: Standard modal formulas (e.g., \(\Diamond \phi(a)\)) are evaluated by quantifying over counterparts, not transworld identities.  
      - *Metalanguage*: Extend first-order translation with a binary predicate for \(C\).  
    - **Actuality**: Designated state \(w_0\) represents "indexical actuality". Evaluation at \(w_0\) matches Lewis's "this-world" perspective.  
    - **Domains**: **Varying domains** \(D(w)\) per world, enforcing world-bound individuals: \(D(w) \cap D(w') = \emptyset\) if \(w \neq w'\).  
    - **Cardinality**: Model size \(|W|\) reflects Lewis's extravagant plurality.  

  - **Breakage Analysis**:  
    - **Counterpart relation invisibility**:  
      - *Object language*: Modal formulas are bisimulation-invariant; \(C\) is **invisible** because bisimulation ignores counterpart structure (it preserves transitions and atomic properties, not cross-world individual relations).  
      - *Limitation?* Yes—the logic cannot express \(C\) or world-boundness. This reveals a **metaphysical commitment** (to world-bound individuals) that is **inexpressible** in basic modal logic. Adding \(C\) to the semantics doesn't make it object-language-expressible.  
    - **Actuality triviality**:  
      - Designated state \(w_0\) formally captures indexicality. But Lewis's **concreteness** claim breaks: \(w_0\) is abstract in the model, while Lewis insists worlds are concrete. The disagreement is **metaphysical** (about what the model *represents*), not about the model's structure.  
    - **Cardinality extravagance**:  
      - Filtration preserves satisfiability for a finite formula set \(\Gamma\) but yields a finite model. Lewis's uncountable plurality **exceeds** what \(\Gamma\) requires. This shows the extravagance is **metaphysical overhead**: it's not needed for logical consistency but for Lewis's "plenitude principle" (all possibilities must be *concretely realized*).  
    - **Concreteness objection**:  
      - States in the model are abstract; Lewisian worlds are concrete. The break is **external**: it concerns the **model's purpose**. In model-checking, the model is a tool to verify system properties; for Lewis, worlds *are* the system. The disagreement is about **what the model represents**, not its formal structure.  

  #### **Actualism**  
  *Core Claims*: Only the actual world exists; other "worlds" are abstract representations (e.g., sets of propositions); no non-actual individuals.  

  - **Translation**:  
    - **Worlds as abstract states**: States \(w \in W\) are abstract entities (e.g., sets of propositions), not concrete worlds.  
    - **Domains**: **Varying domains** with \(D(w_0)\) as the actual domain. Non-actual domains contain **individual concepts** (functions \(f: W \to \text{individuals}\)) or proxies (e.g., descriptive sets).  
    - **Actuality**: Designated state \(w_0\) is privileged as "real"; other states are ersatz constructs.  
    - **Accessibility**: \(R\) reflects conceptual/combinatorial constraints (e.g., consistency over propositions).  

  - **Breakage Analysis**:  
    - **Non-actual individuals**:  
      - Actualists reject non-actual *individuals*. In the model, \(D(w)\) for \(w \neq w_0\) contains abstract stand-ins (e.g., individual concepts). This **distorts** actualism: the logic quantifies over these proxies, but actualists insist they aren't "real" individuals. The break is **semantic**: metalanguage quantification over non-actual domains clashes with actualist metaphysics.  
    - **Worlds as abstract representations**:  
      - Fits cleanly: states *are* abstract. **No break**.  
    - **Cardinality**:  
      - Filtration shows finite models suffice for finitely many formulas. Actualists avoid Lewis's extravagance, but face the **problem of "enough propositions"**: building worlds requires maximal consistent sets. Model theory hides this by freely using set theory; actualists must ground propositions in actual language/resources. **Bending**: The model assumes infinite sets; actualism may lack resources to construct them.  

  #### **Ersatzism (e.g., Propositions/Properties as Worlds)**  
  *Core Claims*: Worlds are abstract entities (e.g., maximal consistent sets of propositions, or bundles of properties); individuals may "exist" in multiple worlds via transworld identity.  

  - **Translation**:  
    - **Worlds as states**: States \(w \in W\) are ersatz worlds (e.g., a state is a maximal set of propositions).  
    - **Domains**: **Constant domains** (if transworld identity holds) or **rigid individual constants** (individuals identified across worlds).  
    - **Accessibility**: \(R\) defined by compatibility (e.g., \(R(w, w')\) if propositions in \(w\) are consistent with \(w'\)).  
    - **Bisimulation quotients**: Quotient models identify bisimilar states, reflecting that ersatz worlds are individuated by logical content.  

  - **Breakage Analysis**:  
    - **Transworld identity**:  
      - **Rigid constants** work cleanly if identity is preserved. **No break**.  
    - **Building worlds from propositions**:  
      - **Filtration** constructs a finite model from subformulas, mimicking "propositional" world-building. But:  
        - Ersatzists face the **completeness problem**: not all sets of propositions are "maximal" or consistent. Model theory assumes consistency by fiat.  
        - **Bending**: The model fixes a language to define propositions; ersatzists must explain how propositions cover all possibilities without set-theoretic extravagance.  
    - **Cardinality**:  
      - Filtration proves **finite model property** for many logics, aligning with ersatzist parsimony. But if the logic requires infinite models (e.g., temporal logic with unbounded future), ersatzists must ensure enough propositions. **Break**: Model theory guarantees this via set theory; ersatzists may lack the resources.  

  ---

  ### Residue Report: What Breaks and Why  
  1. **Lewis's counterpart theory**:  
     - **Invisibility of \(C\)**: A **limitation of modal logic**. Bisimulation invariance hides world-boundness. To express it, extend the logic (e.g., add counterpart quantifiers), but this breaks standard modal invariance.  
     - **Concreteness**: **Metaphysical claim doing work**. The model abstracts away concreteness, which Lewis deems essential.  

  2. **Actuality (indexical vs. designated state)**:  
     - **Triviality in models**: Designated states formally capture indexicality. The **break** is external: models don't care about "concreteness," while Lewis/actualists do.  

  3. **Cardinality arguments**:  
     - **Filtration vs. extravagance**: Filtration shows size is often **redundant for logical purposes**. Lewis's extravagance is **metaphysical overhead** (plenitude); ersatzists' "enough propositions" is a **foundational problem** obscured by set theory.  

  4. **Abstractness of states**:  
     - **Fundamental break** for Lewis. The model reduces worlds to indices; metaphysics sees them as concrete or abstract entities. This is about **what the model is for** (prediction vs. ontology).  

  ---

  ### Conclusion: Residues as Defects or Revelations  
  - **Defects in your vocabulary** (Kripke semantics):  
    - Inability to express **world-bound individuals** or **counterpart relations** without metalanguage extensions.  
    - **Abstractness of states**: Cannot capture concreteness claims.  
    - **Set-theoretic freedom**: Hides metaphysical constraints on world-building (ersatzism's "enough propositions").  

  - **Signs of metaphysical claims doing less work**:  
    - **Actuality indexicality**: Formally trivial in models. Lewis's insistence on concreteness adds no logical value.  
    - **Extravagant plurality**: Filtration shows it's **logically redundant**. Lewis's plenitude is metaphysical excess.  
    - **Cardinality quarrels**: Often about **foundational resources** (set theory vs. actualist language), not model behavior.  

  **Final View**:  
  Lewis's realism introduces **inexpressible metaphysical structure** (concreteness, world-boundness) that modal logic ignores. Actualism/ersatzism align better with Kripke semantics but expose mismatches in **how worlds/individuals are grounded**. The residues reveal that metaphysical claims often address **what models represent** (ontology) or **how they are justified** (epistemology), not what they can express. Your TA's reduction succeeds for *logical structure* but fails for *metaphysical grounding*—the "leftover" is the philosopher's job.
