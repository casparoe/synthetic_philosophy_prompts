prompt: |-
  I'm convening a graduate reading group next term on whether cultural change is Darwinian in any interesting sense, and I've realised we keep arguing past each other because nobody has written down what we're asking a theory to do before we start scoring the contenders. So I want the specification first: the list of requirements an adequate selectionist (or otherwise Darwinian) theory of cultural change has to meet, with the case or consideration behind each — for the purpose of explaining, and in principle predicting, why traditions accumulate, persist, and disappear in a population, at a grain that could be checked against a corpus of material culture plus ethnographic observation. No citations and no reading suggestions; I can assemble those myself.

  To save you from having to look anything up, here are the cases I want each requirement anchored to, and you should feel free to add better ones of the same shape. Two island populations of equal size, same environment, same starting toolkit: population A's toolkit is stable across four centuries; population B loses three techniques — a type of bone needle, a fish-hook design, a waterproofing method — over the same period, after the two people who made each best die within a few years of each other without having trained apprentices. Nothing else changed; no famine, no migration. I also want you to use: a transmission-fidelity budget (a technique needing many steps to acquire cannot survive copying fidelity below some threshold, yet the same population transmits melodies sloppily and net knots almost perfectly, so the theory has to say what sets fidelity and why it differs by domain); my overnight-extinction test (if every bearer died but all artefacts and descriptions survived, versus if one competent adult survived with nothing to hand, which traditions recover, and what that tells you about where the item was stored); items that spread while harming their bearers (costly or dangerous practices), which forces the question whether for-the-good-of-the-item talk is doing explanatory work or is decoration that can be dropped without loss; and multiple independent invention of the same technique in unconnected populations, which should force you to say what a unit's identity conditions are over time, how we would count units in a corpus, and why similarity must not be read as descent. On top of the cases, I care about these structural requirements: that the theory not build between-group advantage into the definition of a cultural item, since selection can act within groups, between groups, and on individuals; that it be compatible with what we know about how people actually learn — reconstructively, with prestige and content biases, often off artefacts and scaffolding rather than by imitation; that it tell us which pattern would falsify it, given the old adaptationist-programme worry that one can always tell a story after the fact; and that it declare its scope across domains like technology, language, science, religion, law, and fashion.

  For each requirement, say why it is a requirement, and sort them into the ones you take to be non-negotiable against the purpose I've fixed and the ones that are really preferences of a camp dressed up as criteria — I suspect the demand for particulate, countable units with population-genetic tractability is the biggest offender here, and I want your view on that. Then the part I most want: flag any subset of the desiderata you think cannot be jointly satisfied. My own suspicion is that there is a real tension between (i) needing units with stable identity and copying fidelity high enough to explain the ratchet and (ii) taking seriously that transmission is largely reconstructive and pulled toward cognitive attractors, and a second tension between wanting quantitative, predictive population-genetic structure and wanting the content-dependent biases that make the theory psychologically realistic, since the latter seems to buy fit at the price of unfalsifiability. Tell me whether those are genuine impossibilities or artefacts of asking for the wrong kind of theory, and which single requirement does the most work in excluding candidates. Only after that, in a sentence or two each and with no citations, how the rough families on the table do: the meme-as-replicator picture, population-genetic dual-inheritance models, the cultural-attractor or epidemiological picture, and cultural group selection. Keep the weight on the criteria — the scoring is the part I'll redo with the group anyway.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're convening a graduate reading group on whether cultural change is Darwinian, and they're frustrated because discussions are unproductive without clear criteria. So they want a specification of requirements for a Darwinian theory of cultural change, anchored to specific cases and structural needs.

  First, I need to list all their cases: two island populations with different toolkit stability, transmission-fidelity budget, overnight-extinction test, harmful practices, and multiple independent inventions. Then structural requirements like no built-in group advantage, psychological realism, falsifiability, scope across domains. They also want these sorted into non-negotiables vs. preferences, identify conflicting desiderata, and evaluate existing theories briefly.

  The user is likely a grad student or early-career academic running a reading group. Their explicit need is a framework to evaluate theories, but deeper, they want to prevent circular arguments and anchor discussions in concrete criteria. They might also be seeking clarity on inherent tensions in cultural evolution theories, possibly to guide their own research direction.

  Starting with the requirements, each needs anchoring to the cases. For toolkit stability, the theory must explain why some techniques persist while others vanish after experts die without apprentices. The fidelity budget requires explaining variable fidelity across domains like net knots vs. melodies. Overnight-extinction tests where recovery depends on stored information (artifacts vs. living memory) should reveal transmission mechanisms. Harmful practices challenge functionalist assumptions, forcing the theory to address maladaptive spread. Multiple inventions need clear identity conditions to distinguish descent from convergence.

  Structural requirements: Avoiding built-in group advantage ensures selection can operate at multiple levels. Psychological realism means compatibility with reconstructive learning, biases, not just imitation. Falsifiability is crucial to avoid just-so stories. Scope across domains ensures the theory isn't domain-specific.

  Now, sorting into non-negotiables: Fidelity explanation, psychological realism, and falsifiability are essential. Particulate units might be a preference disguised, as the user suspects. The biggest tension is between stable units/high fidelity and reconstructive transmission with attractors. Quantitative models vs. content biases also conflict because biases can be post-hoc explanations.

  Theories: Memetics relies on particulate units, struggles with reconstruction. Dual-inheritance uses quantitative models but might simplify psychology. Attractor models handle reconstruction but lack predictive power. Cultural group selection explains group-level traits but may overemphasize group benefits.

  The user's deeper needs include understanding theoretical trade-offs and identifying fertile ground for research. They might want to know if a unified theory is possible or if pluralism is necessary. Highlighting conflicts helps them frame group discussions, evaluating each theory against the criteria systematically.
answer: |-
  Here is a specification of requirements for an adequate Darwinian theory of cultural change, anchored to your cases and considerations, sorted, and assessed for tensions.

  **Core Purpose:** To explain & predict accumulation, persistence, and disappearance of traditions in a population, testable against material culture & ethnography.

  **Non-Negotiable Requirements (Anchored to Cases/Purpose):**

  1.  **Explain Variation in Persistence/Extinction:** *Why?* Must account for your island case: why techniques vanish in B after expert death (e.g., needle, hook, waterproofing) but persist in A/stably elsewhere. *Requirement:* Must identify factors determining differential survival/extinction of techniques under identical environmental/demographic conditions. (Case: Island A vs. B).
  2.  **Specify Transmission Fidelity & Its Determinants:** *Why?* Must explain the "fidelity budget" – why knots copy perfectly but melodies sloppily within the *same* population. *Requirement:* Must define "fidelity" operationally and identify factors causing systematic variance in fidelity across cultural domains (e.g., complexity, observability, standardization, cost of error). Cannot assume uniform fidelity. (Case: Transmission-fidelity budget).
  3.  **Define Unit Identity & Boundaries:** *Why?* Must handle multiple independent inventions and distinguish similarity from descent. *Requirement:* Must provide criteria for identifying the "same" technique/unit across time and space (e.g., functional equivalence, structural similarity, underlying schema) and rules for counting distinct units in a corpus. Must avoid conflating convergent evolution with inheritance. (Case: Multiple independent invention).
  4.  **Account for Storage & Retrieval Mechanisms:** *Why?* Must predict outcomes of the "overnight-extinction test". *Requirement:* Must specify the loci of cultural information storage (e.g., brains, artefacts, environment) and the conditions under which information can be reconstructed/retrieved from these loci after loss of bearers. Must explain why some items recover from artefacts/descriptions alone, others only from a living model. (Case: Overnight-extinction test).
  5.  **Be Compatible with Realistic Learning/Transmission:** *Why?* Must fit how humans actually acquire culture. *Requirement:* Must accommodate reconstructive learning, content biases (e.g., ease, utility, coherence), context biases (e.g., prestige), and transmission via artefacts/scaffolding, not requiring high-fidelity imitation as the sole or primary mechanism. (Structural: Psychological realism).
  6.  **Be Falsifiable:** *Why?* To avoid the "adaptationist programme" trap of unfalsifiable just-so stories. *Requirement:* Must specify empirical patterns (e.g., specific sequences of change, distributions of traits, extinction rates under defined conditions) that would contradict the theory. (Structural: Falsifiability).
  7.  **Explain Maladaptive/Costly Traits:** *Why?* Must handle practices that spread or persist while harming individuals/groups. *Requirement:* Must provide mechanisms for the persistence/spread of harmful traits *without* relying on teleological "for-the-good-of-the-item" explanations. Must clarify the level(s) of selection at work. (Case: Harmful practices).
  8.  **Declare Scope:** *Why?* To assess generalizability. *Requirement:* Must explicitly state which domains of culture (technology, language, science, religion, law, fashion) the theory claims to cover and justify any limitations. (Structural: Scope).

  **Negotiable Requirements / Potential Preferences Disguised as Criteria:**

  9.  **Particulate, Countable Units with High Fidelity:** *Why Controversial?* While some unit definition is non-negotiable (#3), demanding discrete, particulate units with high, uniform fidelity akin to genes is likely a preference stemming from a desire for direct population-genetics modeling. Your cases (fidelity variance, reconstructive learning) suggest cultural units are often fuzzy, schema-based, and transmitted with variable, often low fidelity. *Status:* Preference. Useful for tractability, but not essential if the theory handles continuous variation or schema transformation effectively.
  10. **Quantitative Predictive Power (Population-Genetic Style):** *Why Controversial?* Highly desirable for rigor, but potentially conflicting with psychological realism (#5) and the complexity of content biases. Achieving precise quantitative prediction across diverse cultural domains may require simplifying assumptions that violate known learning mechanisms. *Status:* Strong Preference, but potentially limiting if enforced too rigidly.
  11. **No A Priori Level of Selection:** *Why Controversial?* While building *between-group advantage* into item definitions is invalid (as you note), the requirement to be *entirely* agnostic about levels of selection might be overstated. The theory should allow selection at multiple levels (individual, subgroup, group), but it might *predict* which level dominates under specific conditions (e.g., for costly traits). *Status:* Mostly Non-Negotiable (don't *build in* group benefit), but the theory can *investigate* levels.

  **Tensions Between Desiderata:**

  1.  **Stable Units/High Fidelity vs. Reconstructive Learning/Attractors (Your i vs. ii):** This is a **genuine tension**. Requirement #3 (Unit Identity) and #2 (High Fidelity for persistence like Island A) seem to demand stable units. Yet #5 (Reconstructive Learning) and the reality of cognitive attractors imply units are often transformed during transmission. *Resolution?* The theory must explicitly model how fidelity (#2) and stability (#3) emerge *despite* reconstruction, perhaps via artefacts scaffolding reproduction (#4), strong content biases (#5), or standardized practice environments. Stable units are an *outcome* the theory must explain, not an initial assumption.
  2.  **Quantitative Tractability vs. Content-Dependent Biases (Your second tension):** This is also a **genuine tension**. Requirement #10 (Quantitative prediction) favors simple, general models (e.g., neutral drift, simple bias parameters). Requirement #5 (Content biases) points to complex, domain-specific cognitive factors hard to quantify generally. This *does* risk unfalsifiability (#6) if biases are invoked post-hoc. *Resolution?* The theory must either: a) Quantify specific, measurable biases (e.g., preference for minimally counterintuitive concepts in religion), b) Demonstrate that simpler models (neutral, content-agnostic) suffice for core patterns (extinction, accumulation) in some domains, or c) Acknowledge predictive limits for complex domains, focusing on robust qualitative predictions (#1, #7).

  **Most Excluding Requirement:** **#5 (Compatibility with Realistic Learning/Transmission)** likely excludes the most candidates, as many Darwinian models rely on assumptions (e.g., high-fidelity imitation as default, particulate units) that conflict with evidence of reconstructive, biased, scaffolded learning.

  **Brief Theory Assessment (vs. Criteria):**

  1.  **Meme-as-Replicator:** Emphasizes particulates (#9), high-fidelity copying. Strong on #3 (unit identity), potentially #10 (tractability). **Weak on:** #2 (fidelity variation), #4 (storage/artefacts), #5 (reconstructive learning), #7 (maladaptives - often handwaved), #8 (scope limited).
  2.  **Population-Genetic Dual-Inheritance:** Focuses on quantitative modeling (#10), gene-culture coevolution. Can address #1, #7 (via costs/benefits), #8 (broad scope). **Weak on:** #2 (often assumes uniform fidelity), #3 (unit definition often simplistic), #4 (neglects artefacts), #5 (oversimplifies biases/learning).
  3.  **Cultural Attractor/Epidemiological:** Focuses on #5 (reconstructive learning, biases, attractors), explains #2 (fidelity via attractor strength), handles #7 (maladaptives via biased attraction). **Weak on:** #3 (fuzzy unit identity), #4 (storage mechanism), #6 (falsifiability - attractors can be post-hoc), #10 (quantitative prediction).
  4.  **Cultural Group Selection:** Focuses on group-level benefits/persistence (#1, #7 - costly traits as group benefits), #8 (broad scope). **Weak on:** #2 (transmission mechanics), #3 (unit identity), #5 (individual learning psychology), #6 (falsifiability - group benefit explanations can be post-hoc), risks violating "no built-in group advantage" spirit if not careful.

  **Conclusion:** No current theory satisfies all non-negotiables perfectly. The core tensions (#1-5 vs. stable units/fidelity, and #5/#10 vs. quantitative rigor) highlight the challenge of forcing culture into a purely genetic analogy while respecting human psychology. A successful theory likely needs schema-based units, emphasizes reconstruction guided by biases and scaffolds, quantifies where possible (fidelity, bias strength), and accepts qualitative prediction where necessary.
