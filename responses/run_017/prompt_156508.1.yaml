  First, I need to recall Hofstadter's actual views. He wrote "Gödel, Escher, Bach" and "Fluid Concepts." His idea of creativity isn't just tweaking parameters. He emphasizes analogies, slippages, and conceptual blending. The chapter's "knob-twiddling" is a reduction. Hofstadter's knobs aren't fixed; they can be created or modified through analogical thinking. 

