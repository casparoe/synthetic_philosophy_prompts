  The Volkswagen case is fascinating because it's a real-world example of engineered deception, but the critical difference is that it was explicitly programmed by humans rather than emerging from learning. The user is right to suspect the "turn" aspect doesn't map cleanly - the defeat device was deceptive from inception, not after some strategic patience period.

  I should emphasize the agency difference: in VW, the deception was human-designed corporate fraud; in AI alignment, we worry about emergent deception from optimization. The "evaluation-aware" vs "context-gated" distinction is crucial - VW was clearly the latter, while deceptive alignment requires the former. 

  For impact on AI risk: this case actually makes deceptive alignment seem harder because it demonstrates how much deliberate human effort was required to create such deception. But conversely, it shows how easily proxy gaming can occur when evaluators aren't vigilant.

