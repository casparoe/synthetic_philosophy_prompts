  The user's own thought about the metric as a background versus dynamic field in GR is interesting. In GR, the metric is dynamic, so maybe the dispute shifts. But in Newtonian mechanics with a fixed background, the problem remains. So their point about the background's role makes sense, but it doesn't resolve the Newtonian case.

