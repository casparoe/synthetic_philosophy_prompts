     - *Settled*: 9.4 applies to any amendment.

  4. **For Articles 1-8 Amendments**:
     - Requires simple majority (from 9.2). 
     - *Settled*: by 9.2.

  5. **Special Cases**:
     - *Sequencing*: Amendments at the same meeting are governed by the rules in effect at the time of their consideration. 
       - *Settled*: procedural rules apply at the time of the proceeding.
     - *Self-Referential*: An amendment changing a threshold must meet the threshold in effect at the time (e.g., amending 9.1 requires 3/4 under 9.3). 
       - *Settled*: rules must be followed as they exist.
     - *Severability*: If part is invalid (e.g., violates 9.4) and the parts are inseparable → whole out of order. If separable → strike invalid part and consider the rest. 
       - *Contestable*: rival view: always strike only the invalid part if possible. But if the invalid part is central, the whole may fail.
     - *Conditional Amendments*: If the amendment creates a body and conditions the amendment rule on its assent, then the condition is not met at adoption. Rule: if the amendment meets the current threshold and notice, it is in order, but the change to the amendment rule does not take effect until the condition is met. 
       - *Contestable*: rival view: the condition is part of the amendment and if not met, the amendment is invalid.

  **Cases**:

  A: Target 9.3 (Article 9). No notice → out of order (Step 3).

  B: Target 9.1 (Article 9). No notice mentioned → assume no notice → out of order (Step 3). If notice was given, then requires 3/4. But 55% < 75% → fails (but we rule: in order, threshold 3/4).

  C: Target Article 3. Step 2: direct violation? Creates affiliate members (members) without vote → restricts their right → out of order. (Contestable: if affiliate members are not considered 'members' under the current constitution, then no violation and simple majority applies. But our reading: they are called members, so they are members.)

  D: 
     - First: Target 9.1. Notice given, 78% >= 75% → passes. 
     - Second: Target Article 6. Now, requires simple majority (9.2). 51% is majority → passes.

  The user might not like Case C because the society may want to create non-voting members. But the procedure forces a ruling that it violates 9.4.

  **What the procedure cannot settle**:
     - The ultimate validity of an amendment after the meeting (it might be challenged later).
     - The interpretation of ambiguous terms (like "member" in 9.4) when the text is unclear.
     - The resolution of theoretical disputes about the foundations of amendment powers.

  End of procedure.
answer: |-
  Below is a decision procedure designed for real-time parliamentary rulings. It is structured as a step-by-step checklist, optimized for clarity and speed (executable within 15 minutes). The procedure prioritizes textual analysis of your constitution, with explicit guardrails for contestable theoretical issues. It distinguishes between:  
  - **Route**: The procedure used to adopt the amendment (e.g., 9.1, 9.2, or 9.3).  
  - **Target**: The provision being amended (e.g., Articles 1–8, Article 9, or 9.4).  
  - **Level-preserving vs. level-changing amendments**: Whether the amendment alters the rule it uses to be adopted (e.g., amending 9.1 via 9.3 is level-preserving; amending 9.1 via a new threshold created in the same resolution is level-changing).  
  - **Direct vs. indirect violations**: Whether an amendment explicitly restricts voting rights (direct) or does so through indirect means (e.g., redefining membership).  
  - **Order vs. validity**: At the meeting, you rule only on whether the amendment is **in order** (i.e., procedurally admissible and what threshold applies); **validity** (whether it takes legal effect) is left for post-meeting review.  

  The procedure yields a "hard no" (out of order) at any step where requirements are unmet. It defers to your judgment only where text is ambiguous or values-based (noted as **"Hand to human"**). Sequencing, severability, and self-reference are integrated into the steps.  

  ---

  ### **Decision Procedure**  
  **Questions must be answered in order. Stop and rule immediately if any step yields "out of order" or a clear threshold.**  

  1. **What is the target of the amendment?**  
     - *Check*: Which specific provision(s) does the amendment modify?  
       - If it targets **Articles 1–8**, proceed to Step 2.  
       - If it targets **Article 9** (any part), proceed to Step 3.  
     - *Sufficient answer*: Unambiguous identification of the textual target.  
     - *Hard no*: None (procedural).  
     - *Settled or contestable?* **Settled**. Based on textual interpretation of amendment provisions.  

  2. **For amendments targeting Articles 1–8: Does it directly or indirectly violate 9.4?**  
     - *Check*:  
       - **Direct violation**: Does the amendment’s text explicitly abolish/restrict voting rights? (e.g., "Members in Category X lose voting rights").  
       - **Indirect violation**: Does it achieve the same effect without textual change to voting rights? (e.g., "Affiliate members have no vote" – assuming affiliates are "members" under current rules).  
     - *Sufficient answer*:  
       - If **direct violation**: Out of order (superseded by 9.1’s supremacy clause).  
       - If **indirect violation**: **Hand to human**. You must judge if the effect is inevitable and substantive (not speculative). If yes, out of order; if ambiguous, proceed but note validity concerns.  
       - If **no violation**: Proceed to Step 4.  
     - *Hard no*: Direct violation of 9.4.  
     - *Settled or contestable?* **Contestable**.  
       - *Rival view*: Only direct textual changes can violate 9.4; indirect effects are valid until challenged.  
       - *Effect on ruling*: Rival view would allow indirect amendments to proceed (e.g., Case C would be in order).  

  3. **For amendments targeting Article 9: Was proper notice given?**  
     - *Check*: Is this amendment to Article 9 (per Step 1)? If yes, was written notice provided at the preceding AGM?  
     - *Sufficient answer*:  
       - If **no notice**: Out of order (fails 9.3’s notice requirement).  
       - If **notice given**: Proceed to Step 5.  
     - *Hard no*: Lack of required notice.  
     - *Settled or contestable?* **Settled**. Based on express condition in 9.3.  

  4. **For amendments targeting Articles 1–8: What threshold applies?**  
     - *Check*: Ignore 9.1 (general amendment rule). Apply 9.2’s simple majority.  
     - *Sufficient answer*: Threshold is **simple majority**. Rule as "in order" with this threshold.  
     - *Hard no*: None (proceeds to vote).  
     - *Settled or contestable?* **Settled**. 9.2 is a specific rule overriding 9.1 for Articles 1–8.  

  5. **For amendments targeting Article 9: Does it violate 9.4?**  
     - *Check*: Same as Step 2 (direct/indirect violation analysis).  
     - *Sufficient answer*:  
       - If **direct violation**: Out of order.  
       - If **indirect violation**: **Hand to human** (same judgment as Step 2).  
       - If **no violation**: Proceed to Step 6.  
     - *Hard no*: Direct violation of 9.4.  
     - *Settled or contestable?* **Settled** by supremacy clause in 9.1 (binds all amendments).  

  6. **For amendments targeting Article 9: What threshold applies?**  
     - *Check*: Apply 9.3’s three-quarters vote.  
     - *Sufficient answer*: Threshold is **three-quarters**. Rule as "in order" with this threshold.  
     - *Hard no*: None (proceeds to vote).  
     - *Settled or contestable?* **Settled**. 9.3 is the specific rule for amending Article 9.  

  ---

  ### **Special Cases (Sequencing, Self-Reference, Severability)**  
  These are integrated into the main steps but require additional checks:  

  - **Sequencing (multiple amendments at one meeting)**:  
    - The rule in force when an amendment is **voted on** governs it.  
      - *Example*: If Amendment #1 changes 9.1, and Amendment #2 is voted afterward, Amendment #2 uses the rules as modified by #1 (if #1 was validly adopted).  
    - *Settled or contestable?* **Settled**. Rules are applied at the time of consideration (standard parliamentary principle).  

  - **Self-referential amendments (e.g., changing a threshold and using it in the same resolution)**:  
    - The amendment must satisfy the **current rule** (as of the vote). It cannot bootstrap a new threshold for itself.  
      - *Example*: A resolution lowering 9.1’s threshold to 50% must itself pass under the existing threshold (e.g., 9.3’s 75% if targeting Article 9).  
    - *Settled or contestable?* **Contestable**.  
      - *Rival view*: A validly adopted amendment can apply its new threshold retroactively to itself.  
      - *Effect on ruling*: Rival view would allow self-application (e.g., Case D’s first resolution could pass by 50% if it amends 9.1).  

  - **Severability (partly invalid amendments)**:  
    - If part of an amendment violates 9.4 or other rules:  
      - **Sever** if the invalid part is grammatically and functionally independent.  
      - **Strike whole** if the invalid part is inseparable (e.g., it conditions the rest on an invalid act).  
    - *Sufficient answer*: **Hand to human**. You must judge inseparability.  
    - *Settled or contestable?* **Contestable**.  
      - *Rival view*: Always sever unless the amendment explicitly states otherwise.  

  - **Conditional amendments (e.g., creating a body that must assent to the amendment)**:  
    - The condition cannot be met at adoption (the body doesn’t exist yet).  
    - *Ruling*: If the amendment meets current rules, it is **in order** but **dormant** until the condition is fulfilled. Note this in your ruling.  
    - *Settled or contestable?* **Contestable**.  
      - *Rival view*: The amendment is invalid unless the condition is satisfied concurrently.  

  ---

  ### **Application to Cases**  
  **Case A**: Resolution to delete notice requirement in 9.3 (no notice, carried 68–32).  
  - Step 1: **Target** is Article 9 (9.3). → Proceed to Step 3.  
  - Step 3: **Notice?** No → **Out of order** (fails 9.3).  
  - *Why you might not like it*: The vote passed 68% (>66%), but notice was required. Procedure enforces 9.3 strictly.  

  **Case B**: Resolution to lower 9.1’s threshold to simple majority (carried 55–45).  
  - Step 1: **Target** is Article 9 (9.1). → Proceed to Step 3.  
  - Step 3: **Notice?** Not specified, but no mention of notice → Assume no notice → **Out of order**.  
  - *Note*: Even with notice, Step 6 requires 75% (55% < 75%).  

  **Case C**: Resolution to create non-voting affiliate members (amends Article 3, carried 81–19).  
  - Step 1: **Target** is Articles 1–8 (Article 3). → Proceed to Step 2.  
  - Step 2: **Violate 9.4?**  
    - *Direct?* No (9.4 text unchanged).  
    - *Indirect?* **Hand to human**: If affiliates are "members" under current rules, this restricts their voting rights → **Out of order**. If not, proceed.  
  - *Why you might not like it*: The vote passed 81%, but the procedure forces a values-based judgment on indirect effects.  

  **Case D**:  
  - *First resolution*: Properly noticed, 78% to lower 9.1 to simple majority.  
    - Step 1: **Target** is Article 9 (9.1). → Proceed to Step 3.  
    - Step 3: Notice given → Proceed to Step 5.  
    - Step 5: **Violate 9.4?** No (lowering thresholds doesn’t directly/indirectly restrict voting) → Proceed to Step 6.  
    - Step 6: Threshold is **three-quarters** (78% ≥ 75%) → **In order, passes**.  
  - *Second resolution* (20 mins later): Amends Article 6 (carried 51–49).  
    - **Sequencing rule**: Rules at vote time govern. After first resolution, 9.1 now requires simple majority for amendments.  
    - Step 1: **Target** is Articles 1–8 (Article 6). → Proceed to Step 2.  
    - Step 2: **Violate 9.4?** Assume no → Proceed to Step 4.  
    - Step 4: Threshold is **simple majority** (9.2 still applies, but 51% > 50%) → **In order, passes**.  

  ---

  ### **Explicit Limitations of the Procedure**  
  The procedure **cannot settle**:  
  1. **Ambiguous textual interpretations**: E.g., What counts as a "member" in 9.4? (Handed to you at Step 2/5).  
  2. **Indirect violations of 9.4**: Requires your judgment of "inevitability" (Step 2/5).  
  3. **Validity disputes**: You rule only on procedural order and thresholds. Validity (e.g., whether an adopted amendment conflicts with foundational values) is for post-meeting review.  
  4. **Theoretical disputes**: E.g., Whether entrenchment (like 9.3) is possible in a system without higher law. The procedure assumes your constitution’s text is authoritative but flags contestable steps.  

  ---

  ### **One-Page Ruling Template**  
  For quick use during the AGM:  

  ```  
  PROPOSED AMENDMENT: [Brief description]  

  STEP 1: Target is [Articles 1–8 / Article 9].  
  STEP 2/5: 9.4 violation? [Direct: out of order / Indirect: [My judgment] / None].  
  STEP 3: Notice for Art. 9? [Yes / No → out of order].  
  STEP 4/6: Threshold is [simple majority / three-quarters].  
  SEQUENCING/SELF-REFERENCE: [Noted if applicable].  
  RULING: [In order with [threshold] / Out of order].  
  ```  

  This procedure prioritizes textual rules, minimizes ambiguity, and forces hard rulings on clear violations—even when unpopular. It exposes contestable steps for transparency, ensuring the council can debate rival views if challenged.
