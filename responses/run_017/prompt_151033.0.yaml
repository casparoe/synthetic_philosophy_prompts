  We are given a constitution with the following relevant provisions:

  Article 9.1: The constitution may be amended at an annual general meeting by two thirds of the votes cast.
  Article 9.2: Articles 1–8 may be amended by a simple majority at any general meeting.
  Article 9.3: Article 9 may itself be amended only by a three-quarters vote with written notice given at the preceding annual general meeting.
  Article 9.4: No amendment may abolish or restrict the right of any member to vote at a general meeting.

  Additionally, there is a supremacy clause in 9.1 (added in 2019) that states: "no later amendment inconsistent with 9.4 shall be valid."

  The user (a parliamentarian) seeks a decision procedure to rule on the spot on whether a proposed amendment is in order and what threshold it requires. The procedure must account for:

  1. The distinction between the route (procedure used) and the target (what it changes).
  2. Level-preserving amendments vs. those that change the level of the rule they travel by.
  3. Properly adopted but reckless amendments vs. invalid ones.
  4. The ruling at the meeting (order and threshold) vs. the question of validity that survives the meeting.
  5. Direct changes to protected provisions vs. indirect defeats.

  Also, address sequencing issues:

  - When two amendments are carried at the same meeting, which version of the rules applies to the second?
  - Can a single resolution both amend the threshold and then rely on that new threshold for itself?
  - Severability: if part of a resolution is valid and part not, do we sever or strike the whole?
  - How to handle a resolution that conditions its own amendment rule on the assent of a body it creates.

  The procedure must be executable in about 15 minutes and produce a one-page ruling.

  We are to test the procedure on four cases (A, B, C, D) and explicitly state what the procedure cannot settle.

  Moreover, for each step, we must indicate whether it is reasonably settled or contestable, and if contestable, name the rival view and its outcome.

  ---

  Decision Procedure Outline:

  The procedure will be a step-by-step checklist. The parliamentarian must consider each question in order. If a step yields a clear outcome (e.g., the amendment is not in order, or it requires a specific threshold), we stop. If a step does not yield a clear outcome, we proceed to the next step. Some steps may require judgment (values) and cannot be settled by rules alone.

  Key Principles:

  1. **Hierarchy of Provisions**: Article 9 provisions are entrenched, with 9.3 being the most specific (amending Article 9) and 9.4 being a substantive limitation. The supremacy clause in 9.1 makes 9.4 a higher norm.

  2. **Validity vs. Order**: At the meeting, we rule on whether the amendment is in order (i.e., can be considered) and what threshold applies. Final validity (whether the amendment, once passed, is effective) might be challenged later, but we can note if it would be clearly invalid.

  3. **Target and Route**:
     - The target is the article being amended.
     - The route is the procedure (which amending provision we use) and depends on the target.

  4. **Level Changes**: An amendment that changes an amending provision (like 9.1, 9.2, 9.3) is changing the rules about how rules are made. We must be cautious about self-reference.

  5. **Indirect Defeats**: Even if the text of a protected provision is untouched, if the amendment has the effect of abolishing or restricting voting rights, it might violate 9.4.

  6. **Sequencing**: At a single meeting, amendments are considered in the order they are taken. The rules in effect at the time of consideration of each amendment apply.

  7. **Self-Referential Amendments**: A resolution that amends the threshold and then uses that threshold for itself is problematic because the threshold change hasn't taken effect until the resolution is adopted. We must apply the rules as they stand at the moment of voting.

  Steps:

  1. **Identify the Target**: Which article(s) are being amended?
     - If the target is Article 9, then 9.3 applies (and requires notice and 3/4 vote).
     - If the target is Articles 1-8, then 9.2 applies (simple majority) unless the amendment also affects Article 9 (then 9.3 might be triggered? We must check for level changes).

     But note: an amendment might target a non-9 article but have the effect of changing an amending rule (e.g., if it changes the composition of the body that votes, that might be an indirect change to the voting rule). However, the procedure is triggered by the target article.

     This step is settled: we look at what the amendment literally changes.

  2. **Check for Direct Conflict with 9.4**: 
