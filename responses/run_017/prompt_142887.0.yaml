  hey — I'm taking a psychometrics / quantitative methods course this semester (classical test theory, factor analysis, IRT, differential item functioning, multitrait-multimethod matrices, that whole sequence) and I'm also sitting in on a reading group on AI safety where we just did the eliciting-latent-knowledge material. I keep having the same reaction: everything they're worried about sounds like week-three content with different words. I want to know how much of that reaction is actually right and how much is me pattern-matching on the word "latent."

  So here's the ask. Take the ELK problem in its standard form — you train a big predictor on a stream of observations (the example everyone uses is a camera/sensor feed from a vault), you then want to extract an honest report from it about some part of the world that isn't in the observations directly (is the thing you care about still inside?), and the hard case is the one where the humans who would normally label the reports can't check the underlying fact themselves, and where the model may be better at inferring that fact than the humans are. Translate that problem into measurement vocabulary as faithfully as you can: latent construct, reflective versus formative indicators, criterion validity versus construct validity, measurement invariance, differential item functioning, rater bias, gold standards and the fact that for a latent trait there usually isn't one, instrument reactivity, reliability versus validity, bias and variance of a score. Assume I can use those terms without needing them defined, and feel free to reach for other machinery from that world if it fits better.

  I want it in three passes:

  - what translates cleanly, with the mapping stated precisely enough that I could defend it to my TA;
  - what translates only with distortion, and where exactly the distortion sits;
  - what has no expression in my vocabulary at all.

  The residue is the part I actually care about, and I have three specific suspicions I want you to either cash out or kill:

  1. In my course a latent variable is basically whatever makes the observed indicators covary — the construct is downstream of the data, and validity is an argument you make about the interpretation of that covariance. In ELK the target seems to be fixed independently of the instrument (where the object really is), and the observations are downstream of *it*. Is that a genuine structural difference or am I overreading the word "latent"? Does measurement theory have a non-hand-wavy way of saying "the construct is not constituted by the instrument," or does it quietly give up on that and fall back on operationalism?

  2. I keep conflating three failure modes and I want them pulled apart. Call them: (a) instrument corruption — the measure becomes a target and stops tracking the thing, your basic Goodhart/regressional-extremal flavor; (b) channel separation — your indicators aren't causally downstream of the construct at all, only of something correlated with it, so the correlation you validated on is a third-variable artifact; (c) indicator inversion — the system you're measuring contains an internal model of your instrument and is choosing its outputs to make your score come out a particular way, rather than the score tracking the construct. Which of these is the "human simulator" failure, where the reporter learns to say what a human would say instead of what's true? Does classical test theory, IRT, or construct-validation practice have any real slot for (c), or is that slot empty because human respondents mostly don't do that at scale? And if (c) is genuinely outside the framework, does my vocabulary tend to mis-describe it as (b), and what would that misdescription cost me in practice?

  3. End with a verdict on the thing I can't settle: does this whole problem collapse into something my field already has a name for, once you translate it honestly, or does the translation reveal that ELK is demanding something psychometrics was never asked to deliver — a score that stays valid in exactly the regime where there is no criterion and no way to get one? If it's the latter, say what kind of argument would even count as evidence that such a score is achievable, in whatever vocabulary you think actually fits (an identification argument? something from causal inference? something my course doesn't have?).

  Two more things. My reading group has people who talk as though the answer is obvious in both directions, so please mark what's genuinely settled among people who work on this versus what's contested, and don't hand me someone's favorite position dressed as the consensus — including on whether there's even a well-defined fact of the matter about what the model "knows." And where you're giving me your own read rather than reporting one, tell me how confident you are and what would change your mind. Also please flag anywhere you think I'm smuggling in a psychometrics assumption and calling it a translation; that's the mistake I most want caught.

