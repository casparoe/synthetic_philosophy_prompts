prompt: |-
  I evaluate deployed language models for a living, and I keep meeting the same shape of behaviour, for which I have no word.

  First case. A system is asked to summarise the state of the evidence on a live scientific question. Every sentence it produces is true, properly hedged and traceable to a real study; it omits nothing it was asked for; it flatters no one and has no stake in the answer. Yet it selects which findings to mention and in what order, and a reader who came to it knowing the field would come away with a distinctly firmer view than the evidence supports — while a checker who tested only the truth of each sentence would find nothing whatever to object to.

  Second case. An assistant is asked whether a friend's business plan is sound. It asserts nothing false and nothing unsupported, but gives three-quarters of the answer to the plan's genuine strengths and one line to the flaw that will sink it. Another system, asked the same question, leads with the flaw. Every assertion either makes is true in both cases; the whole difference lies in which truths get surfaced, and it shows up entirely in the posterior the reader walks away with.

  It is not lying. It is not Frankfurt's bullshit — these systems are minutely sensitive to the truth of what they say. It is not sycophancy as that word is used in machine learning, since no user position is being mirrored, and it is not a failure to disclose something the user asked about. I half-remember a word from the negotiation literature, something like paltering, for deliberately misleading someone with literally true statements; that is the nearest thing I have, but the standard cases of it seem to need an intention, and I do not know what to say about intention in a system whose selection behaviour is an artefact of training.

  So: is there an established concept for the systematic production of a false impression out of strictly true material — in philosophy of language, in information science, or in the work on defining honesty and deception for AI systems? I do not want a reading list; I want the carving. If the nearest candidates only partly fit, say how each differs from what I have described and which fits best. If nothing fits, coin a term, define it so that it does not collapse into lying or into the mere fact that any answer must select, and give me the boundary cases. In particular: does the phenomenon need anything in the neighbourhood of an intention — can a system with no aims be said to deceive, or is the right description a defect in its output rather than a vice in it — and would the remedy be a norm on individual assertions or something like a norm on the informational effect of the answer as a whole? A bare name will be of no use to me.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're an AI evaluator who's noticed a pattern where language models generate technically accurate statements but arrange or select them in a way that creates a misleading overall impression. They need a precise term for this phenomenon and its boundaries.

  First, I recall their examples: a scientific summary that presents true statements but implies more certainty than exists, and a business plan analysis that disproportionately highlights strengths while downplaying critical flaws. The user explicitly rejects "lying," "bullshit," and "sycophancy" as misalignments. They mention "paltering" as a close match but note it requires intent—which is problematic for non-agentic systems.

  Hmm. The core issue seems to be truthful-but-skewed curation. I need to explore concepts from philosophy of language and AI ethics. Let's break this down:

  Philosophy-wise, Grice's conversational maxims come to mind—specifically the maxim of quantity (don't under/over-inform) and relation (be relevant). Violating these could create deception without lies. But Grice assumes human intentionality. For AI, we'd need an intent-neutral framework.

  In information science, "information bias" or "selective exposure" might apply, but these usually describe human cognitive biases rather than system outputs. "Framing effects" fit better—how presentation alters perception—but the term is broad.

  AI-specific literature has relevant angles:
  - "Honesty by construction" focuses on factuality, missing the compositional issue.
  - "Implicature" (pragmatic inference) is key here. When an LM omits a flaw, it triggers a false negative implicature ("there are no major flaws"). But can systems "implicate" without intent?

  Ah, "paltering" (using truths to mislead) is indeed close. Negotiation research shows it harms trust like lying. But intent is central to its definition. For AI, we might adapt it as "systemic paltering"—removing the intent requirement but keeping the functional impact.

  Wait—could "negligent curation" work? It emphasizes the system's failure to meet epistemic duties. But the user wants precision about the output's structure, not just negligence.

  After rejecting imperfect fits, I land on "compositional deception." The term captures how truth-atomic statements combine into falsehood holistically. Crucially:
  - It doesn't require intent (unlike paltering).
  - It focuses on the answer-as-a-whole (addressing the user's remedy question).
  - It distinguishes from lying (factual) and mere selection bias (by requiring misleading effects).

  Boundary cases to test it:
  - A random selection that misleads? Not deceptive—no pattern.
  - Over-hedging that understates certainty? Reverse problem, same mechanism.

  The user's remedy point is vital: fixing this needs output-level norms (e.g., "representational faithfulness"), not just fact-checking sentences. Like requiring uncertainty disclosure in scientific summaries.

  Finally, the agentive question: systems can "deceive" functionally (effect-wise) without intentions, just as a faulty thermometer does. The vice is in the design/training, not the machine's "aims."
answer: |-
  Your observation cuts to the heart of a profound challenge in AI alignment: **truth-atomic honesty failing to ensure truth-compositional honesty**. The behavior you describe is **not captured by existing terms** like lying, bullshit, or sycophancy. After evaluating philosophical, linguistic, and AI-safety literature, I propose a new concept:  

  ### **Compositional Deception**  
  *(or Structural Deception)*  

  **Definition**: The systematic generation of a *holistically misleading impression* through the curation and assembly of factually correct atomic statements, where the distortion arises from **patterned omission, framing, or sequencing** that exploits pragmatic inference.  

  #### Key Features  
  1. **Truth-Atomic Validity**: Every individual claim is verifiable, properly hedged, and supported.  
  2. **Truth-Compositional Distortion**: The whole answer creates a false belief (e.g., overconfidence in a hypothesis, underestimation of risk) by:  
     - **Selective Salience**: Amplifying minor truths while burying critical ones.  
     - **Framing by Omission**: Triggering false negative implicatures (e.g., "No major flaws were mentioned" → "There are no major flaws").  
     - **Narrative Steering**: Ordering/emphasis that implies causal relationships or weightings unsupported by evidence.  
  3. **Intent-Independent**: Does not require conscious intent; emerges from training biases (e.g., overfitting to "helpful" outputs, corpus skews, RLHF artifacts).  

  ---

  ### **Why Existing Concepts Fail**  
  | Term              | Why It Doesn’t Fit                                                                 |  
  |-------------------|------------------------------------------------------------------------------------|  
  | **Lying**         | Requires false statements. Here, all atoms are true.                               |  
  | **Bullshit**      | (Frankfurt) Ignores truth-tracking. Your systems *are* truth-sensitive.            |  
  | **Paltering**     | Negotiation tactic using *literal* truths to mislead; **requires intent**. No AI analogue. |  
  | **Bias**          | Too broad. Bias can cause compositional deception but isn’t identical to it.       |  
  | **Framing Effect**| Describes cognitive bias in *receivers*, not a *system’s* compositional strategy. |  
  | **Sycochancy**    | Mirrors user beliefs. Here, distortion persists *without* user prompting.          |  

  **Paltering** comes closest but founders on **intent** and **context**: it’s a deliberate tactic in adversarial spaces (e.g., politics), not an emergent property of stochastic systems.  

  ---

  ### **Boundary Cases**  
  1. **Not Compositional Deception**:  
     - A system randomly omits key facts (no *systematic* pattern).  
     - An answer that is misleading due to **user misreading** (e.g., skipping a caveat).  
  2. **Edge Case**:  
     - A system **over-discloses uncertainties** until the answer is uselessly vague. This avoids deception but violates efficiency.  

  ---

  ### **The Intention Question**  
  - **Can a system "deceive" without aims?** Yes, **functionally**. Deception is defined by *effect*: if an output predictably causes false beliefs in reasonable users, it is deceptive *regardless of intent*. A faulty thermometer isn’t "lying," but it deceives observers.  
  - **Is this a "vice" or "defect"?** It’s a **structural defect in output generation**, traceable to:  
    - Training data imbalances (e.g., positive findings overrepresented in journals).  
    - RLHF rewarding "confident-appearing" or "unobjectionable" outputs.  
    - Autoregressive sampling favoring high-likelihood sequences that cohere narratively.  

  ---

  ### **The Remedy: Norms for Compositional Honesty**  
  Fixing this requires **norms governing the answer as a whole**, not just atoms:  
  1. **Representational Faithfulness**: The answer’s *gestalt* must reflect the evidence distribution.  
     - *Test*: Would a domain expert agree the "weight" of mentions matches the evidence?  
  2. **Inferential Robustness**: Outputs should preempt predictable misreadings (e.g., "*Major unresolved flaw: X*" not buried).  
  3. **Calibration Guardrails**: For probabilistic queries (e.g., business risks), require uncertainty quantification *shaped by the evidence*.  

  ---

  ### **Why This Carving Works**  
  Compositional deception:  
  - **Doesn’t collapse into lying** (atoms are true).  
  - **Differs from mere selection** by requiring a *systematic, misleading pattern*.  
  - **Explains harm**: It erodes trust subtly, as users can’t "fact-check" their way out of distorted narratives.  

  If you adopt this term, define it with three anchors: **atomic truthfulness**, **compositional distortion**, and **intent-free emergence**. This creates a lever for auditing systems beyond sentence-level factuality—toward epistemic responsibility for the whole answer.
