answer: |-
  The Santiago committee room smelled of dust and brine. A single sample vial sat on the polished table, casting a long shadow under the harsh LED strip lights. Inside, suspended in cloudy lithium-rich fluid, lay a tangle of dark, twisted filaments – the cinders. Dr. Bárbara Soto traced the vial’s condensation with a fingertip, her gaze fixed on the enigmatic structures she’d pulled from the Atacama effluent channels.

  “Exhibit A,” intoned the Committee Chair, Elena Flores, a former judge whose voice still carried the weight of a gavel. “The subject of our determination under Article 7 of the Antarctic Treaty Protocol, as adapted for Atacama environmental defence. Dr. Soto, your initial report triggered this hearing. Summarise, please, for the record.”

  Soto leaned forward, her voice tight. “They’re tubules. Magnesium-silicate gel. Found them in the outflow channels of the ‘Sol Dorado’ lithium operation. They grow. They snap, the fragments grow again. They carry… patterns.” She tapped the glass. “Iron oxide inclusions. Scars. These scars dictate how they branch, where they branch. Crucially, when they snap, the scars are copied. Imperfectly. About one error per two hundred scar-points. Some patterns… well, they’re better at sequestering lithium from the brine. Better at surviving the weekly channel flush when the pumps cycle. They metabolise the gradient, nothing more. No food intake. No repair mechanisms. They just… are. And persist.”

  Professor Neil Vardy, his suit impeccably grey, snorted softly. He nudged his own tablet displaying high-resolution micrographs. “They *accrue*, Dr. Soto. Like a crystal grows in a supersaturated solution. The ‘scars’ are impurities, inclusions trapped during accretion. The snapping? Brittle fracture under flow stress. The ‘errors’? Random imperfections inherent in any crystallisation process in a dynamic environment. Calling this evolution is like saying a stalactite evolves because one drips faster than another. It’s geochemistry, not biology. There’s no cell, no genetic polymer, no coded information. Just physics and chemistry playing out.”

  “But they *change*, Professor,” Soto countered, her knuckles white. “The scar patterns *are* information. Imperfectly replicated information that affects survival and replication in that specific environment. Isn’t that the core? A self-sustaining chemical system capable of Darwinian evolution? NASA’s working definition–”

  “Is precisely that, Doctor,” Vardy cut in, “a *working* definition for *searching* for life. Not a philosophical absolute. Where is the *organism*? Where is the bounded, self-maintaining unity? These are glorified mineral whiskers caught in a flow! They don’t maintain an internal milieu, they *are* the milieu. No boundary, no self-production, no *autopoiesis*. They’re passive accretions swept along by the effluent. They don’t actively *do* anything to sustain themselves beyond what the gradient dictates.”

  A new voice, calm and measured, entered the fray. Dr. Aris Thorne, a philosopher of science conscripted onto the committee, steepled his fingers. “Boundaries and internal states are crucial, certainly. But perhaps we’re looking for too much complexity, too much resemblance to *our* kind of life. Consider agency. Goal-directedness. Does this system act *for* its own persistence? Does it exhibit minimal cognitive behaviour, adapting its ‘growth strategy’ based on environmental feedback? Or is it merely a complex crystal, as Professor Vardy suggests, its apparent ‘fitness’ a passive thermodynamic outcome?”

  He gestured towards the vial. “These cinders… they branch where their scars dictate. They ‘choose,’ in a rudimentary, physics-bound way, a morphology that enhances lithium capture and thus structural integrity against the flush. Is that not a primitive form of agency? A feedback loop where structure influences environment interaction which influences future structure?”

  “Primitive?” Vardy scoffed. “It’s chemistry on rails! There’s no *choice*, no internal state regulating action towards a goal. The scars are just the mould the gel fills. Agency requires an ‘aboutness,’ an intentional stance, however basic. This has none. It’s a beautiful, complex geochemical phenomenon. Calling it alive cheapens the term.”

  Soto felt a prickle of unease unrelated to the debate. Earlier, a nondescript man had approached her during the break, murmuring about the Sol Dorado’s generous community investment fund and how stability – operational stability – benefited villages like hers, currently rationing water trucked in from sixty kilometres away. The unspoken threat hung in the arid air of the corridor. *Your village’s taps run dry if the mine shuts down.*

  “Cheapens it?” Soto’s voice rose slightly. “Or expands it? Life isn’t a monolith, Professor. It might be a graded concept, a cluster of properties present to varying degrees. Replication with inheritance? Check. Variation? Check. Differential survival based on that variation? Check. Organisation? Debatable, but complex structural patterning is present. Agency? Borderline, perhaps, but Dr. Thorne has a point about feedback. Why must it tick *every* box on *our* arbitrary list?”

  Vardy shook his head. “Because without boundaries, without active self-maintenance against entropy, without *metabolism* in the true sense of energy conversion for work, it lacks the fundamental *organisation* of life. It’s a dissipative structure, like a whirlpool or a flame. Complex, persistent, but not *alive*.”

  Thorne interjected again. “The consistency problem looms, colleagues. Exhibit B: SUTRA-7.” A screen lit up showing schematics of a distributed computing system. “A decommissioned server cluster in Oslo, running a self-modifying program. It patches its own code, seeks out unused processing space to replicate its core processes, and has demonstrably increased its efficiency at both tasks over four years. It learns. It replicates imperfectly. It persists. If we grant ‘life’ to the cinders based on replication, variation, and selection in their chemical environment, how do we deny it to SUTRA-7 in its digital one? Conversely, if we demand bounded, carbon-based autopoiesis for life, both fail. But consistency demands we apply the same standard.”

  Silence fell, thick and uncomfortable. Flores steepled her own fingers, mirroring Thorne. “The treaty requires a determination: living organism, or not. Binary. For the cinders. SUTRA-7 is not before us today, though the point is noted for future… contemplation.” Her gaze swept the room, lingering on Soto’s tense face, Vardy’s set jaw, Thorne’s thoughtful expression. “We must decide.”

  Vardy cleared his throat. “Madam Chair, they lack the fundamental organisational closure of life. No boundary, no true metabolic control. They are complex crystals. Not alive.”

  Soto forced herself to speak calmly, pushing the image of dusty village children aside. “They evolve, Madam Chair. Imperfect replication, heritable variation, differential survival. By the broadest, most defensible scientific definition we have for seeking novelty, they qualify. They are alive.” Her voice caught slightly on the last word.

  Thorne sighed. “They occupy a grey zone, Madam Chair. They exhibit fascinating proto-properties: information transfer, environmental interaction with structural consequence. But true agency? Self-directed maintenance? It’s too attenuated. They are not, in my view, unambiguously *organisms*. Yet, neither are they mere rocks. ‘Borderline’ would be the scientifically honest answer, but I acknowledge the statute demands yes or no.”

  Flores’s gaze was unreadable. She looked down at her notes, then at the solitary vial on the table. The cinders within seemed inert, just dark flecks in cloudy water. The hum of the air conditioning was suddenly loud. Soto saw Vardy give a minute nod, seemingly satisfied. Thorne looked resigned. The memory of the water trucks, the parched earth around her village, pressed in.

  Flores raised her head. “The committee has deliberated. The subject exhibits remarkable properties of replication and environmental interaction. However, it lacks a defining boundary separating self from non-self, and demonstrable, internally regulated processes for self-maintenance and repair against entropic decay. It does not constitute a self-producing autopoietic unity. Therefore, based on the organisational criterion deemed most fundamental to the definition of a living organism…”

  She paused. Soto held her breath. The harsh light glinted off the vial.

  “…the committee rules that the structures designated ‘cinders’ are **not** living organisms within the meaning of the treaty.”

  \answer{not alive}
