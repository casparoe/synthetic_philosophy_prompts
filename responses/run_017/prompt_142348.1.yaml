answer: |-
  Here’s a prep sheet structured to anticipate the most likely and damaging objections, ordered by sequence and impact. I’ve phrased objections in each constituency’s authentic voice, followed by a 90-second reply, key concession, and vulnerability note. Finally, strategic advice and the "dreaded question" are at the end.

  ### **Ranked Objections & Replies**
  *(Ordered by likely sequence & damage potential)*

  1.  **The Archivist/Biographer (Source Integrity Focus):**  
      *"You draw a line at 'counterfeit evidence' like diaries, yet you show fabricated diary extracts *in her handwriting* on screen. Isn't that precisely manufacturing a false document and presenting it as archival? How is that materially different from forging a letter? Your 'marking' is just stylistic – the viewer sees handwriting and assumes authenticity. Your prohibition collapses under its first test."*  
      **Reply:** "You're right that the *visual presentation* risks mimicking archival evidence. My defence is twofold: 1) **Context:** The extracts appear *only* during dramatized internal monologues, visually distinct from genuine letters shown elsewhere, and never cited as 'source material' within the drama's diegesis. 2) **Intent:** The prohibition targets *deception about provenance*. We use visual shorthand (handwriting) for inner thought, not to claim discovery of a physical diary. It’s a narrative device signalling subjectivity, not a fake artifact presented as found."  
      **Concede:** "The visual similarity *is* problematic and could mislead some viewers despite context. Perhaps clearer visual differentiation (e.g., animation overlay, colour tint) is needed."  
      **Soft Spot:** Relies heavily on viewer sophistication and directorial execution. Still feels like cheating the rule.

  2.  **The Media Lawyer (Practical Risk Focus):**  
      *"Ethics aside, your 'answerability' framework is legally inert. The real constraints are: 1) Defamation/libel risk to *living* relatives portrayed negatively (e.g., the debt-ridden brother, family secrecy). 2) Copyright in the *actual letters* used in development/promotion. 3) Malicious falsehood if the composite/fictionalised portrait is seen as an intentionally damaging distortion. Why isn't your energy on securing releases and legal vetting, not philosophical duties to the dead?"*  
      **Reply:** "You're absolutely correct that legal risks to the living are paramount and require rigorous mitigation – we *are* securing releases where possible and undergoing legal vetting. My framework isn't a *legal* shield but an *ethical* justification *for proceeding at all*, given the known sensitivities. It aims to structure the creative choices *within* those legal boundaries to minimise harm and maintain integrity, arguing why this story *can* ethically be told this way despite objections."  
      **Concede:** "Ethics won't override law. Legal compliance is non-negotiable and the primary practical safeguard."  
      **Soft Spot:** Underscores the gap between ethical principle and enforceable protection. Doesn't solve the living relatives' distress.

  3.  **The Great-Uncle (Grieving Son - Emotional Core):**  
      *"You never knew her. You opened a letter she *begged* to be burned. You're dredging up nine months of shame she buried, and her family buried *for* her, to make your name. You call it 'answerability'? It's betrayal. She wanted silence. Why can't you respect that?"*  
      **Reply:** "Uncle [Name], I understand your pain and anger. I loved Mum deeply, and I know how fiercely you loved and protected your mother. My aim isn't to shame her, but to understand the immense pressure she faced – hinted in those letters – protecting her brother, the isolation after. Her wish for silence *is* powerful, and I take it seriously. But I believe silence can also be a prison. My argument is that interpreting that wish, understanding *why* she sought it, revealing the burdens she carried, is part of telling her *whole* story, not ignoring her plea but grappling with its meaning."  
      **Concede:** "I cannot know her as you did. My portrayal will inevitably be incomplete and filtered through my lens. And I violated her specific instruction by opening the 'burn' letter."  
      **Soft Spot:** Highly emotional. Concessions may feel insufficient. "Grappling with meaning" risks sounding like an excuse.

  4.  **The Moral Philosopher (Conceptual Rigour Focus):**  
      *"Your 'duty of answerability' to the *dead* seems incoherent. If the dead don't exist, they cannot *be* wronged, hold duties, or 'answer'. Isn't this just a convoluted way of saying you owe duties *to the living* – future audiences, historians, or the family – to be intellectually honest? If so, framing it as owed *to her* is misleading. Admit it's about integrity among the living."*  
      **Reply:** "You highlight the core tension. I agree the dead cannot *experience* wrong. The duty isn't *to* a current entity, but *regarding* a past person, grounded in the *act* of representation itself. When we dramatise a real person, we appropriate their identity – their 'voice' in a broad sense. Answerability is the ethical constraint *on that appropriation*: the obligation to structure the representation so its constructed nature is visible, allowing *others* (the living audience, critics, family) to contest it *on her behalf*, because *she* cannot. It’s a duty *triggered by* representing her, owed *in relation to her*, but discharged *to the living community of interpretation*."  
      **Concede:** "The language of 'duty *to* the dead' is indeed metaphorical shorthand. The mechanism relies entirely on the living."  
      **Soft Spot:** The "on her behalf" justification is vulnerable. Is it meaningful if she can't endorse or reject the contestation? Smuggling in interests.

  5.  **The Niece / Family Advocate (Pragmatic Control Focus):**  
      *"Auntie wanted the box destroyed. You didn't. Now you talk about 'answerability', but it's just you deciding what 'contestable' means. You marked *some* inventions, but compressed a decade, made up friends... and you opened the forbidden letter! How is this not just 'answerability' meaning *you* control the narrative, not the family? Shouldn't *we* decide what's contestable or off-limits?"*  
      **Reply:** "It's true I made the final creative choices. 'Answerability' doesn't mean family veto. It means creating a *framework within the work* that allows *any* viewer, including the family, to see the seams – what's invented, compressed, composite – and therefore argue, 'This aspect is misleading because...'. It's about giving the *tools* for contestation, not pre-determining the outcome. Your perspective is vital for that contestation! But the artistic responsibility for building in those tools, and the choice to tell the story, is mine."  
      **Concede:** "The family's interpretation of her wishes and character is irreplaceable and must inform the contestation. My opening the letter was a breach of her stated will."  
      **Soft Spot:** "Tools for contestation" may feel abstract and powerless compared to family control. Doesn't address their feeling of violation.

  6.  **The Biographer (Proportionality & Distortion):**  
      *"You say selection distorts, and your remedy is 'visible selection'. But focusing *only* on the 9-month prison term out of an 80-year life isn't just selection, it's radical reduction. 'Marking' it as selected doesn't counter the overwhelming weight this gives to her conviction. Isn't this inherently creating a 'false portrait' by grotesque imbalance, regardless of marking individual inventions?"*  
      **Reply:** "You're right that the focus creates immense weight. My argument is that *any* biographical selection distorts – choosing childhood, war service, or old age would too. 'Visible selection' means the work must *actively signal* its narrow focus, not just state it in a disclaimer. The drama's structure, timeframe, and perhaps recurring visual motifs (e.g., confinement imagery juxtaposed with glimpses of her wider life) should constantly remind the viewer, 'This is a lens on *this* period, *this* pressure point'. It can't show the whole life, but it can acknowledge the life exists beyond this frame."  
      **Concede:** "The distortion is significant and unavoidable. Marking mitigates but doesn't erase it. It *will* shape perception disproportionately."  
      **Soft Spot:** Mitigation strategies (motifs, structure) may be subtle and easily missed. Doesn't negate the fundamental imbalance.

  7.  **The Philosopher/Lawyer Hybrid (The "Burn" Letter):**  
      *"You concede opening the 'burn unread' letter breached her instruction. Doesn't this fundamentally undermine your entire 'answerability' framework? If you disregard her direct, specific wish *regarding the very evidence*, how can you claim ethical high ground about borrowing her voice respectfully? Doesn't this prove your duty is really just to your project?"*  
      **Reply:** "It's the hardest point. I opened it driven by the need to understand the scope of what she wanted hidden – was it just the conviction, or something more? Ethically, it was a failure of respect for her autonomy *as expressed*. My framework doesn't erase that failure. However, *answerability applies to the representation built using the material, regardless of how it was obtained*. The breach happened at the point of access. The framework governs how I then *use* what I accessed (including knowledge of her wish) in the construction and presentation of the portrait itself. The duty to represent contestably remains, even if the acquisition was flawed."  
      **Concede:** "Opening the letter was a serious ethical lapse that conflicts with the spirit of respecting her voice."  
      **Soft Spot:** Major hypocrisy risk. Severing acquisition ethics from representation ethics feels weak.

  8.  **The Archivist/Biographer (Revisability - Is it Enough?):**  
      *"Your 'revisability condition' – marking inventions visibly *in the texture*. You say balancing a distorted scene elsewhere doesn't count. Fine. But showing a composite character *as* a composite within the drama? How? A caption? A narrator saying 'This person is made up'? That destroys immersion. If you just imply it stylistically, most viewers miss it. Isn't this condition either artistically crippling or practically useless?"*  
      **Reply:** "It's a genuine artistic challenge, not a simple technical fix. It requires integrated solutions: not captions breaking the fourth wall, but techniques like deliberate anachronism in composite scenes, visual dissonance, dialogue that subtly signals the character's 'constructed' role ("You remind me of what X, Y and Z always said..."), or thematic doubling. It needs to feel *part* of the narrative fabric, not an intrusion. It won't work perfectly for every viewer, but it aims to create enough unease or signposting for the engaged viewer to question, 'Is this literal?'"  
      **Concede:** "It's imperfect and relies on directorial skill and audience attentiveness. Some viewers *will* take composites as literal truth."  
      **Soft Spot:** Solutions sound vague, subjective, and easily ignorable. May not satisfy source-critical scholars.

  ### **Strategic Moves for the Q&A**
  *   **Give Away Early (First 2 Minutes):** Immediately and unequivocally concede the **opening of the "burn" letter was a profound failure of respect** ("Before we start, I must acknowledge the most difficult point: I disregarded my great-aunt's direct instruction by opening the envelope marked 'burn unread'. That was wrong, and it casts a shadow. My ethical framework for representation doesn't erase that initial breach."). This disarms the most visceral criticism and shows humility.
  *   **Concession with Most Force:** The **Great-Uncle's point about silencing/loyalty** has deep emotional and moral force. His pain is real and justified from his perspective. Concede his unique knowledge and perspective, and the validity of his grief and sense of betrayal.
  *   **Constituency with Strongest Objection:** The **Moral Philosopher**. If the core concept of "answerability to the dead" collapses as incoherent, the entire ethical framework unravels. Their objection strikes at the theoretical foundation.
  *   **The Reply That MUST Land:** The reply to the **Moral Philosopher (Objection 4)**. If you cannot persuasively defend the conceptual coherence of "answerability" *as relating meaningfully to the dead person* (even if mediated through the living), the position becomes indefensible as presented and collapses into owing duties only to the living, which undermines your key distinction. This reply is existential for your argument.
  *   **The Question You Hope Nobody Asks (But They Might):**
      *"You claim you're motivated by understanding her burdens and breaking silence, not exploitation. But isn't the *real* reason you chose this story, and particularly the prison term, because it's inherently dramatic, shocking, and commercially viable for television – exploiting family trauma for your career? How does 'answerability' protect against that fundamental conflict of interest?"*

  Good luck. Focus on clarity, humility on the concessions, and steel for the philosopher's challenge. The "burn letter" concession is crucial for initial credibility.
