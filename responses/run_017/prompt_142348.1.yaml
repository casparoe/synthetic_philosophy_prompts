  The user outlines their ethical framework: they argue that we owe the dead "answerability" rather than accuracy, meaning we should make portraits contestable. Their framework has two main rules: no counterfeit evidence (like fabricating documents shown as real), and revisability (marking inventions within the work itself). They also address family objections about the great-aunt's wish to be forgotten.

  There are four key groups in the audience: archivists who care about sources, a media lawyer focused on legal risks, the user's great-uncle who opposes the project, and a moral philosopher who might challenge the concept of owing duties to the dead.

