prompt: |-
  i build internal chatops tooling and our bot turns plain messages into official records: someone types "i quit" in a channel and HR gets a resignation, "approving" on a PR thread flips the review state, "i'll take that shift" in the ops channel assigns the shift, "v1.2 is live" cuts a release. so we have to decide, in real time with no human in the loop, when a message actually *does* the thing versus just talking about it, and honestly right now were guessing.

  the cases that keep breaking us: somebody sends "i resign" at 3am and wants it back at 9am before a single person read it; a scheduled macro posts "i approve" for a manager who's on a plane; a contractor whose contract ended last week posts "approving this"; someone drops a resignation into the wrong channel so the people who need it never recieve it; and people who type "i promise we'll ship friday" with zero intention of doing it, which we dutifully log as a commitment and then get yelled about later.

  i vaguely gather there's some old philosophy of language literature about words that do things instead of describing things. turn whatever it actually says into a five step procedure my team can run on a message, in order, that says when to stop and record nothing.

  give me exactly five numbered steps, one or two sentences each, no intro and no conclusion. each step should say what to check, what to do when that check fails, and which of my cases it settles (a few words is enough); flag the steps that are really value calls we should hand to a person instead of automating.
reasoning: |-
  We are building a five-step procedure to determine when a message in a chat system should trigger an official action (like recording a resignation, approval, etc.) versus being ignored as non-actionable. The steps must address the specific failure cases mentioned and indicate which steps require human judgment.

  Step 1: **Check for explicit action phrases in designated channels.** Only process messages containing predefined action phrases (like "i resign", "approving", etc.) if they occur in channels specifically designated for that action. If the message is in the wrong channel, ignore it. This addresses the case of a resignation in the wrong channel.

  Step 2: **Verify sender identity and current status.** Confirm the sender is an authorized person (e.g., current employee for resignations, assigned reviewer for approvals) and their account is active. If the sender is unauthorized (like a contractor whose contract ended) or inactive, ignore the message. This handles the expired contractor case.

  Step 3: **Detect automated messages and scheduled posts.** Check if the message is sent by a bot or via a scheduling tool (using metadata or a predefined list). If it is automated, ignore it unless the system is designed to allow specific automated actions (which requires a separate approval process). This catches the scheduled "approve" macro.

  Step 4: **Flag for human review when revocation is likely.** For high-stakes actions (like resignations), implement a short delay (e.g., 1 hour) and notify the sender with a prompt to cancel. If the sender revokes within the delay, abort. Automatically process after the delay. This step requires human judgment if revocation requests occur after the delay. It resolves the 3am resignation retraction case.

  Step 5: **Assess sender intent for ambiguous commitments.** When a message implies a future commitment (e.g., "we'll ship Friday"), require an explicit confirmation (like "I commit to shipping Friday") and/or a secondary verification (e.g., a button click). If the message lacks such confirmation, do not log it as a commitment. This step involves human judgment to interpret ambiguous language and should default to inaction. It prevents logging non-serious promises.
answer: |-
  1. **Check channel designation:** Only process messages in pre-defined official channels for each action type (e.g., resignations only in #hr-actions). If the message is in an incorrect or general channel, ignore it entirely. Settles: *wrong channel cases*.

  2. **Validate sender status and recency:** Confirm the sender is currently authorized (e.g., active employee for resignations, assigned reviewer for approvals) using real-time HR/reviewer systems. If sender status is invalid, expired, or ambiguous (like a contractor post-contract), halt processing. **Flag:** Requires automated integration with auth systems; ambiguous cases need human review. Settles: *expired contractor actions*.

  3. **Detect automation and delegation:** Block messages from bots, scheduled tools, or non-human senders (check user-agent/metadata). Also, reject messages using delegation phrases ("for @boss," "on behalf of"). If automated or delegated, ignore. Settles: *scheduled macro approvals*.

  4. **Enable immediate sender revocation:** For irreversible actions (e.g., resignations), auto-respond instantly with: "Reply 'cancel' within [time window] to revoke." If revocation is received before the window closes (e.g., 1 hour), discard the record. **Flag:** Time window and action eligibility require human policy input. Settles: *3am resignation retractions*.

  5. **Require explicit intent syntax:** Only process messages using formal, imperative phrasing defined for each action (e.g., "I resign" for resignations, not "thinking of quitting"; "I approve [PR#]" for approvals, not "looks good"). If phrasing is informal, conditional, or lacks required keywords, skip. **Flag:** Phrasing rules need human-led policy updates. Settles: *non-serious commitments*.
