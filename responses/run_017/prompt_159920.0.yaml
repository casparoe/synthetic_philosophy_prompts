prompt: |-
  I am a novelist, and I am well into a book set in the southern Maya lowlands during the Terminal Classic: a multigenerational novel about a family of scribes attached to a court that is slowly, and without ever deciding to, giving up the habit of raising carved and dated stone monuments. I find that I cannot write a page of it until I know what kind of event I am depicting, so what I need is a case analysis rather than background reading.

  The criterion I have been working with — call it the testamentary criterion — is this: a society has collapsed, as opposed to merely changed, when it loses the practices by which it hands a description of itself to those who come after it. Collapse on this view is not the loss of population, territory, or complexity, but the breaking of a chain of address: the cessation of records made for the sake of a future reader who will not otherwise know what has been lost, and who could therefore either reclaim it or knowingly refuse it. What is destroyed in a genuine collapse is not well-being or power but the capacity of successors to know what it is they are missing.

  Please take the Terminal Classic transformation of the Classic Maya and analyze it strictly through this criterion, and then tell me where the criterion breaks. Take the following as given: the number of dated monuments erected per year across the Maya area rises to roughly forty around 750, falls back to about ten by 800, and reaches zero by about 900, with no new major construction in the central Maya area after roughly 830; the Copán valley population, which peaked near twenty-eight thousand in the fifth century, declines to about fifteen thousand by 900 and to under a thousand by 1200; the northern Yucatán subsequently prospers, with Chichén Itzá, Mayapán and Uxmal flourishing in very different artistic and architectural styles and with far less monumental hieroglyphic writing; Maya communities and languages persist, and an independent Maya polity survives until the Spanish conquest of Nojpetén in 1697.

  I would like four things. First, a disciplined mapping: what the unit is (a city-state, a polity, a scribal institution, the Long Count itself), what on this criterion counts as the record addressed to the future, what it says was happening to people who went on farming, trading and building while the carving stopped, and whether the verdict is collapse, transformation, or something the criterion has no word for.

  Second, the places where the criterion misdescribes the case. It appears to make the fate of a whole population track the fate of an elite technology of self-commemoration; I want to know whether that is a fatal class bias or a defensible consequence, and how the criterion should handle a society most of whose members never had a testament at all.

  Third, two stress cases from outside the Maya material. For Mycenaean Greece: Linear B was a script used almost entirely for palace administration, it disappears with the destruction of the palaces around the end of the Late Bronze Age, and the following centuries offer no conclusive evidence of writing in Greece until the adoption of the alphabet several centuries later — so does the criterion deliver the result that the Mycenaean world collapsed, or the result that it never addressed the future in the first place and so was never the kind of thing that could collapse? And for the Maya themselves: if the destruction of the surviving Maya books by Spanish missionaries in the sixteenth century, and the long period in which Maya writing was present but unreadable before its decipherment in the twentieth century, both bear on the chain of address, then the criterion seems to say either that the Maya collapse was inflicted from outside in the 1500s or that it was revoked by scholars in the 1900s. Tell me what the criterion should say about collapse imposed by a conqueror and about collapse repaired retroactively. If you bring in Rapa Nui, do not rest anything on the disputed demographic and ecological story there.

  Fourth, what the case does to the criterion in return — whether it confirms it, or is an anomaly, or is a case the criterion never anticipated — and one further matter that is personal to the project: my own novel is an artifact of exactly the kind whose disappearance is supposed to constitute a collapse. Does the criterion in fact imply that a people can be un-collapsed by being written about, that collapse is revocable by art, and does it give any guidance to an agent inside the process, such as a lord deciding in a bad year whether the stela still gets carved? Where the criterion is silent, say so rather than making it speak. Do not give me citations or reading lists; work from the facts I have supplied and from what you already know.
reasoning: |-
  Okay, the user is a novelist working on a book set in the Terminal Classic Maya period, focusing on a family of scribes as their society stops raising carved monuments. They've developed this "testamentary criterion" for societal collapse—where collapse isn't about population loss or complexity but about breaking the chain of transmitting self-knowledge to future generations. They want me to analyze the Maya case through this lens, find where it breaks, test it against other civilizations, and explore implications for their novel. 

  First, I need to map the Maya situation strictly using their criterion. The unit here is clearly the scribal institution—those who carved dated monuments using the Long Count calendar. The "record addressed to the future" is precisely these stelae, which weren't just administrative but declarative: "This is our glory, remember us." The farmers and traders kept going, even building new centers in the north, but without those dated carvings, the criterion says the chain snapped. So verdict: collapse for the southern lowland polities. 

  But immediately I see problems. The criterion ignores everyone outside the scribal elite—most Maya never had their lives recorded in monuments. Is this a fatal class bias? Not necessarily, because the criterion isn't about individual memory but societal self-description. Still, it feels icy to say collapse happened while corn still grew. And in the northern Yucatán, they kept writing, just differently—less Long Count, more communal art. The criterion might call that transformation, not collapse, but it's messy. 

  Now stress-testing: Mycenaean Greece. Linear B was purely bureaucratic—inventories, not testaments. By this criterion, that world never addressed the future, so it couldn't "collapse" in this sense; it just vanished without intending to be remembered. Brutal but consistent. Then the Spanish burning Maya books: that *was* an external severing of the chain, making the 16th century the real collapse under this logic. And modern decipherment? That's a resurrection of the chain, but artificially—like reviving someone frozen. The criterion never considered retroactive repair. 

  Finally, the novelist's meta-question: if writing about a "collapsed" society un-collapses it, does that make their novel a counter-collapse act? By the criterion, yes—art can rebuild the chain. But for their scribe characters chiseling a stela in decline, the criterion is useless. It can't tell them if carving matters when no one might read it. That silence feels important. 

  The user’s real itch might be whether their fiction can redeem loss—and whether their scribes' choices are tragic or futile. The criterion accidentally makes art a salvational act, which is beautiful but heavy. I should leave that tension bare.
answer: |-
  Here is a strict application, stress-testing, and critique of your testamentary criterion against the Terminal Classic Maya and other cases:

  **I. Disciplined Mapping of the Terminal Classic Maya:**

  *   **Unit:** The scribal institution (specifically, the practice of dynastic commemoration using the Long Count calendar and monumental stone carving).
  *   **Record Addressed to the Future:** Dated stone monuments (stelae, altars, hieroglyphic stairways) commissioned by rulers and elites. Their primary purpose was not administrative record-keeping but dynastic propaganda, commemoration of rituals, warfare victories, and royal accession/ancestry – establishing a permanent, public claim to legitimacy and divine connection *for posterity*.
  *   **What Happened to the People:** Farming, trade, construction, and community life continued, albeit transformed. Populations shifted (south to north, urban to rural). New centers (Chichén Itzá, Mayapán, Uxmal) flourished with distinct styles – less emphasis on individual ruler glorification via dated stelae, more on collective/lineage power, feathered serpent cults, and different architectural forms (e.g., colonnades, round temples). Writing persisted (codices, murals, portable objects) but largely lost the Long Count and the monumental, dynastic focus. Languages thrived. Political structures adapted.
  *   **Verdict by Criterion:** **Collapse.** The specific chain of address – the deliberate creation of permanent, dated, dynastic self-descriptions carved in stone for future generations to witness and understand the lineage's divine right and achievements – was irrevocably broken in the southern lowlands by ~900 CE. The cessation of this *specific practice* constitutes collapse under your definition, regardless of population persistence, adaptation, or new forms emerging elsewhere.

  **II. Where the Criterion Misdescribes & Class Bias:**

  1.  **Elite-Centric Blindness:** The criterion focuses exclusively on the self-descriptive practices of the ruling elite. The vast majority of the population – farmers, traders, artisans – never participated in creating or were the intended subject of these "testaments." Their lives, knowledge, traditions, and sense of future were transmitted orally, through daily practice, ritual, and community structures largely unaffected by the cessation of stela carving.
  2.  **Is it Fatal?** It depends on the goal.
      *   *Fatal for describing overall societal fate?* Yes. Applying the verdict "collapse" based solely on the elite testament ignores the demonstrable continuity, adaptation, and resilience of the broader society and culture for centuries (even millennia) afterward. It conflates the fate of an elite political/ideological technology with the fate of the people and their culture.
      *   *Defensible for describing the fate of that specific practice/ideology?* Yes. The chain *for that specific form of elite self-commemoration addressed to the future* did break. The world those stelae were meant to describe and preserve *for future elites* ceased to exist in that form.
  3.  **Societies Without Elite Testaments:** The criterion is silent or irrelevant here. Societies relying solely on oral tradition, folk practices, or non-monumental forms of transmission simply fall outside its scope. It cannot judge their "collapse" or "continuity" because it defines collapse *by* the loss of a specific testamentary practice they never had. This highlights the criterion's narrowness; it describes the failure of one specific mechanism of transmission, not societal survival or failure itself.

  **III. Stress Cases:**

  1.  **Mycenaean Greece (Linear B):**
      *   **Criterion Verdict:** **It never addressed the future meaningfully, so could not "collapse" in this sense.** Linear B was purely administrative (inventories, ration lists, offerings). It lacked narrative, commemoration, or any discernible intent to describe Mycenaean society *for future generations*. Its purpose was contemporary palace management. Its loss was the loss of an administrative tool coinciding with the palace system's destruction, not the breaking of a testamentary chain. The "Dark Age" that followed represents a profound societal transformation, but the criterion has no purchase here as no testamentary chain existed to break.
  2.  **External Destruction (Spanish Burning) & Retroactive Repair (Decipherment):**
      *   **Spanish Destruction (16th C.):** The criterion **demands this be seen as the collapse.** The chain of address – via the codices which *were* testaments preserving history, ritual, and knowledge for future Maya generations – was violently severed by an external force. This fits the criterion perfectly: the capacity of successors (future Maya) to know what was lost in those specific books was destroyed.
      *   **Modern Decipherment (20th C.):** This **creates an irreconcilable paradox for the criterion.**
          *   *Option 1 (Collapse Inflicted in 1500s):* The chain was broken in the 16th century. Decipherment is a *new*, external act of recovery/reconstruction, not the *repair* of the original chain. The original intended recipients (future Maya) were severed from the record. Modern understanding is a scholarly artifact.
          *   *Option 2 (Collapse Revoked):* If decipherment allows the *intended* message to finally reach *someone* capable of understanding it (even centuries late and not the intended audience), does this retroactively mend the broken chain? This stretches the criterion beyond recognition.
      *   **Criterion's Limitation:** It struggles profoundly with retroactive repair and external destruction. It implies collapse is absolute once the chain breaks. Modern decipherment feels like a reversal of loss, but the criterion's logic points firmly to the 16th century as the collapse event for *that specific written tradition*. The centuries of unreadability confirm the break was absolute until modern intervention.

  **IV. What the Case Does to the Criterion & Your Novel:**

  1.  **Impact on the Criterion:**
      *   **Anomaly and Confirmation:** The Maya case is simultaneously an anomaly (highlighting the criterion's crippling elite bias and blindness to broader societal continuity) and a confirmation (it perfectly describes the irrevocable end of a specific elite practice of future-directed commemoration).
      *   **Unanticipated Cases:** It never anticipated:
          *   The persistence of the people and culture *without* the testament.
          *   The emergence of new, successful societies (northern Yucatán) that consciously abandoned the *old* testamentary form.
          *   Retroactive decipherment muddying the waters of "loss."
      *   **Revealed Nature:** The criterion is revealed not as a measure of societal collapse, but as a precise diagnostic tool for the failure of a *specific, elite-driven technology of cultural transmission aimed at permanence and future witness.* It measures the death of an ambition, not necessarily the death of a people.
  2.  **Your Novel and Revocable Collapse:**
      *   **Un-Collapsing by Art?** **Yes, the criterion absolutely implies this.** Your novel, by depicting that world and the scribes' practice *for future readers*, effectively recreates a chain of address. It resurrects the ambition of the original scribes – to ensure their world is known and remembered by those who come after, preventing it from being truly lost. Art (your novel) becomes the testament the Maya scribes ultimately failed to sustain materially. You are mending the broken chain retroactively through fiction.
      *   **Guidance for an Agent Inside?** **The criterion is utterly silent and useless.** It offers no guidance to the lord or the scribe in the bad year. It is a retrospective judgment. The lord's decision is existential: Does the act of carving *still mean something* if the future seems uncertain? Is it duty, hope, defiance, or futility? The criterion, focused on the *eventual cessation* as defining collapse, cannot help him weigh the value of carving one more stela. That decision lives in the realm of belief, tradition, political necessity, and personal courage in the face of decline – areas where the criterion has no voice. The scribe carving while knowing the chain might break is an actor in a tragedy the criterion can only name afterward.

  **In essence:** Your testamentary criterion is a powerful, narrow lens focusing on the rupture of elite self-commemoration for the future. It declares the Classic Maya lowland political/ideological order collapsed while revealing its blindness to the living culture that endured. For your novel, it validates your project as an act of resurrection while abandoning your characters to the terrifying uncertainty of their own moment.
