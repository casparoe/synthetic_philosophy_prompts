prompt: |-
  Our housing co-op has to decide what to do with an unexpected legacy — fix the roof, buy a van, or put solar panels on the block — and before we'd even agreed on a procedure someone on the mailing list waded in with a long post invoking the Gibbard–Satterthwaite theorem to argue that every voting system is riggable, so we might as well let the chair just decide. I've pasted the relevant bit below, lightly tidied. My instinct is that the stuff about approval voting at the end is dodgy, but the rest sounds roughly right to me and I honestly can't tell where the theorem stops and his editorialising starts.

  His summary went like this:

  'Gibbard and Satterthwaite independently proved in the 1970s that any voting system with three or more candidates is either dictatorial or manipulable. "Strategy-proof" — the term of art — means that no group of voters can ever get a better result by coordinating and mis-stating what they want, and "manipulable" just means not strategy-proof. "Dictatorial" means there is a single voter whose favourite always ends up winning. The upshot is that this isn't a flaw of any particular system: first past the post, STV, Borda count, whatever — they are all manipulable, in exactly the same way and to exactly the same degree, so there's no mathematical reason to prefer one to another. There is really only one escape route, which is approval voting, where you tick everyone you find acceptable instead of ranking them: because the ballots aren't rankings, approval voting isn't covered by the theorem at all, and it is genuinely strategy-proof. It's basically Arrow's impossibility theorem restated for single-winner elections.'

  Two things from our side that I'd also like checked. First, one member says we can dodge the whole result by adding a random tie-breaker: we all rank the three options, run a Borda count, and if two options tie we flip a coin — so the procedure isn't deterministic and, he says, the theorem doesn't apply. Second, our constitution says the van can only be bought if there's money left over after the roof is fixed, which in practice has always meant the van never comes up as a live possibility. Does that matter, or is it still a three-option choice as far as the theorem is concerned?

  So: is this a fair summary? Which bits would someone who actually works on social choice accept, which would they wince at, and which are just wrong — and do the practical conclusions he draws (let the chair decide, switch to approval voting, bolt on a coin toss) survive once the summary is corrected?

  Could you reply as exactly seven numbered points, a sentence or two each, with no intro and no summing-up at the end?
reasoning: |-
  Hmm, the user has a complex situation with their housing co-op and voting theory. They've shared a summary from someone in their group about the Gibbard-Satterthwaite theorem and want to know what's accurate and what's not. They also have two specific questions about adding randomness to break ties and whether their constitutional rule about the van affects the voting.

  The Gibbard-Satterthwaite theorem is indeed a fundamental result in social choice theory. It states that for three or more alternatives, any deterministic voting system that's non-dictatorial and has a range of at least three possible outcomes must be manipulable. That means people can strategically vote differently than their true preferences to get a better outcome.

  Looking at the summary the user shared, the first part about the theorem's core claims is mostly correct. However, the claim that all systems are manipulable "in exactly the same way and to exactly the same degree" is misleading. Different systems have different vulnerabilities to manipulation. Some might be harder to manipulate in practice than others.

  The approval voting section is problematic. Approval voting isn't strategy-proof either, since voters can still manipulate outcomes by choosing which candidates to "approve" strategically, rather than based purely on their preferences. The Gibbard-Satterthwaite theorem does apply to all voting systems with rankable preferences, but approval voting uses a different ballot structure.

  For their member's idea about adding a random tie-breaker: while randomness might technically avoid the theorem (since it's no longer deterministic), it doesn't solve the manipulability problem. Voters can still strategically vote to force a tie in their favor or avoid unfavorable outcomes.

  Regarding their constitutional rule about the van: this does matter. If the van can only be considered after roof repairs, the choices aren't truly independent. This makes it more like a two-option vote (solar panels vs. roof repairs) with a conditional third option, which affects how the theorem applies since it reduces the number of independent alternatives.

  The practical conclusions suggested - letting the chair decide or switching to approval voting - aren't ideal solutions. Dictatorship avoids manipulability but sacrifices democracy. Approval voting has its own strategic issues. Adding randomness might introduce unpredictability without solving core problems.

  I'll structure my response as seven numbered points addressing each of these issues clearly and concisely, as requested.
answer: |-
  1.  The core Gibbard-Satterthwaite (GS) summary is mostly correct: for deterministic voting systems with ≥3 options and ≥2 voters, strategy-proofness requires dictatorship; all common ranked systems (FPTP, STV, Borda) are manipulable.
  2.  The claim that systems are manipulable "in exactly the same way and to exactly the same degree" is misleading and incorrect; susceptibility to manipulation varies significantly between systems (e.g., some are harder to manipulate in practice).
  3.  Approval voting is **not** strategy-proof; voters can still manipulate outcomes by strategically deciding *which* candidates to approve (e.g., bullet voting or approving a lesser evil to block a worse option).
  4.  Adding a random tie-breaker *does* technically evade the GS theorem's deterministic assumption, but the system remains highly manipulable as voters can strategically aim for favorable ties or avoid unfavorable ones.
  5.  The constitutional rule (van only if roof funds remain) makes the options interdependent and non-separable; this reduces the *effective* number of independent choices, potentially impacting the applicability of GS which assumes mutually exclusive alternatives.
  6.  The conclusion that "there's no mathematical reason to prefer one [system] to another" based *only* on GS is far too strong; many other criteria (Condorcet consistency, monotonicity, simplicity) provide mathematical reasons for preference despite universal manipulability.
  7.  None of the suggested practical conclusions (let the chair decide, switch to approval voting, add coin toss) are robust solutions; dictatorship avoids manipulation but sacrifices collective choice, approval remains manipulable, and randomness introduces unpredictability without solving strategic voting.
