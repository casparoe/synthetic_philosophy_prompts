answer: |-
  Here’s a specification for an adequate account of future contingents, structured by desiderata with cases, followed by the key tensions and a verdict on non-negotiable requirements.

  ---

  ### **Core Desiderata for Future-Contingent Claims**  
  *(Cases illustrate why each matters)*  

  1. **Agency-Compatibility (Non-Fatalism)**  
     - *Case*: Deliberating whether to sabotage a ship. If "There will be a sea battle tomorrow" is *already true*, sabotage seems pointless.  
     - *Requirement*: Must preserve the *experiential openness* of choice.  
     - *Status*: **Non-negotiable** for prediction/warning/deliberation. Rejecting this collapses into fatalism.  

  2. **Temporal Persistence of Truth (Settled Past)**  
     - *Case*: Yesterday you said, "The ship sails tomorrow." Today, the ship sinks. Must yesterday’s claim be *retrospectively false*?  
     - *Requirement*: Truth-values of past claims about the future must remain stable once the future becomes present/past.  
     - *Status*: **Non-negotiable** for coherence of truth over time. Allows rational bet resolution.  

  3. **Classical Logic Preservation**  
     - *Case*: "Either the ship sails or it doesn’t" (Excluded Middle). Can both disjuncts lack truth-value? If not, can we infer "The ship sails" from "It is not true that it won’t sail"?  
     - *Requirement*: Maintains standard inference (e.g., planning via *modus ponens*: "If the ship sails, we attack; the ship sails → we attack").  
     - *Status*: **Negotiable but costly to abandon**. Losing Adjunction/EM cripples practical reasoning.  

  4. **Will/Must Distinction**  
     - *Case*: "A sea battle *must* occur" (necessity) vs. "A sea battle *will* occur" (contingent prediction).  
     - *Requirement*: Account for modal asymmetry: "will" ≠ "must" in ordinary use.  
     - *Status*: **Negotiable** (Peirceans collapse them; Ockhamists separate).  

  5. **Higher-Order Unsettledness**  
     - *Case*: "On Friday, it will still be open whether the ship sails on Saturday."  
     - *Requirement*: Handle claims *about* future indeterminacy without contradiction.  
     - *Status*: **Non-negotiable** for capturing temporal metaphysics.  

  6. **Chance-Compatibility**  
     - *Case*: "There’s a 30% chance of sea battle" – must this be compatible with objective indeterminism.  
     - *Requirement*: Accommodate probabilities ∈ (0,1) as ontic (not just epistemic).  
     - *Status*: **Non-negotiable** for scientific realism (e.g., quantum mechanics).  

  7. **Bet/Warning Resolution**  
     - *Case*: Betting on "The ship sails tomorrow" requires a clear truth-maker *tomorrow*.  
     - *Requirement*: Future contingents must become verifiable/falsifiable when their time arrives.  
     - *Status*: **Non-negotiable** for social practices.  

  8. **Deliberative Openness**  
     - *Case*: "I can prevent the battle" implies the future isn’t *fixed* during deliberation.  
     - *Requirement*: Reject *current* truth-values for contingent future actions.  
     - *Status*: **Non-negotiable** (genuine desideratum). Denial invalidates agency.  

  ---

  ### **The Inconsistent Triad**  
  These three desiderata **cannot be jointly satisfied**:  
  1. **Bivalence** (Every future contingent is now true or false).  
  2. **Deliberative Openness** (Some futures remain unsettled during agency).  
  3. **Temporal Persistence** (Past claims retain truth-value).  

  **The Key Instigator**: **Temporal Persistence + Bivalence**.  
  - If "Sea battle tomorrow" is *true today*, Temporal Persistence requires it to *stay true* tomorrow. This kills Openness (future is fixed) and forces fatalism.  
  - Deny Bivalence (Peirce) → Saves Openness but loses classical logic.  
  - Deny Openness (Ockham) → Saves Bivalence/Persistence but invalidates agency.  
  - Relativism (MacFarlane) tweaks truth *relativity* to context of assessment → Saves Openness and Persistence *technically*, but strains classical inference.  

  **Most Damaging Desideratum**: **Temporal Persistence**.  
  - It forces a choice between Bivalence (Ockhamism) and Openness (Peirceanism). Without Persistence, we lose bet resolution and truth-stability.  

  ---

  ### **Scorecard: Major Views vs. Desiderata**  
  | **Desideratum**               | **Peircean** | **Ockhamist** | **Relativist** |  
  |-------------------------------|--------------|---------------|----------------|  
  | **Agency-Compatibility**      | ✓✓✓          | ✗             | ✓✓             |  
  | **Temporal Persistence**      | ✓✓           | ✓✓✓           | ✓✓ (contextual)|  
  | **Classical Logic**           | ✗ (gaps)     | ✓✓✓           | ✗ (restricted) |  
  | **Will/Must Distinction**     | ✗ (collapsed)| ✓✓            | ✓              |  
  | **Higher-Order Unsettledness**| ✓✓           | ✗             | ✓✓✓            |  
  | **Chance-Compatibility**      | ✓✓✓          | ✗ (determ.)   | ✓✓             |  
  | **Bet Resolution**            | ✓            | ✓✓✓           | ✓✓             |  
  | **Deliberative Openness**     | ✓✓✓          | ✗             | ✓✓✓            |  

  ---

  ### **Defended Ordering**  
  1. **Agency & Openness** (Non-negotiable: without these, theory is practically inert).  
  2. **Temporal Persistence** (Non-negotiable: anchors truth across time).  
  3. **Chance-Compatibility** (Non-negotiable for scientific engagement).  
  4. **Classical Logic** (Costly loss but survivable with revisions).  
  5. **Will/Must Distinction** (Linguistically important but theoretically flexible).  

  **Verdict**: **Relativism** best balances these *if* you tolerate non-classical logic. **Peirceanism** is more consistent but sacrifices bivalence. **Ockhamism** preserves logic but at the cost of agency. The irreconcilable tension lies in Persistence + Bivalence vs. Openness – and Openness must win if deliberation is to be more than illusion.
