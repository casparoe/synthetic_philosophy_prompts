prompt: |-
  seminar on future contingents starts next week and I'm sick of everyone reciting the sea battle passage and then picking a side before we've agreed what a side is supposed to do. so: give me the spec first. what does an account of the truth, truth-value, or truth-conditions of future-tense claims have to deliver to count as adquate for the job of saying what we are doing when we predict, warn, bet, and deliberate? each requirement with the case that makes it one. the ones I keep getting stuck on: (i) whether "will" and "must" have to seperate somewhere; (ii) whether classical inference — excluded middle, adjunction — has to survive intact for these sentences; (iii) whether the truth of "there would be a sea battle" said yesterday has to stay put once today arrives, and what a settled past even is if it doesn't; (iv) whether the account has to handle claims about later unsettledness, like "on Friday it will still be open whether the ship sails"; (v) whether objective chances strictly between 0 and 1 have to be representable. add the ones I've missed. mark which are non-negotiable given my purpose and which are just house tastes of the Peircean, Ockhamist, or relativist camps — and in particular tell me whether the "deliberation needs openness" requirement is a genuine desideratum or a prejudice of one camp. then the part I actually want: name the two or three requirements you think are jointly unsatisfiable, and say which single one does the most work in ruling views out. commit to the ordering you'd defend, with reasons, not a menu. short scorecard for the big three at the end is fine; skip the exposition of the views.
