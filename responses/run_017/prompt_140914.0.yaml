  The user wants a name for this phenomenon where the factual errors themselves serve a purpose - like pointing to systemic relationships or keeping trauma visible. They explicitly want to distinguish this from regular myth-making, denialism, or degraded storytelling. Since their internet access is limited, they need conceptual clarity, not references.

  Hmm... this reminds me of several concepts but none fit perfectly. Collective trauma narratives often reshape facts to process pain, but that's broader. Symbolic truth captures how stories represent meaning beyond facts, but doesn't highlight the *function* of the inaccuracies. Then there's archival silence - where gaps in records create space for alternative narratives - but that focuses on absence rather than active reshaping.

  The key insight here is how communities weaponize "errors" against bureaucratic erasure. Like stitching scattered records into one story to force visibility, or relocating a death to a public square to resist confinement to forgotten files. The inaccuracies aren't mistakes; they're strategic corrections to the archive's lies by omission.

  For naming, "archival counterweight" feels close - the memory balances institutional silence. Or "resistive coherence" - making disjointed facts cohere to resist erasure. But "functional inaccuracy" might be most precise, emphasizing how the "errors" serve specific purposes: preserving magnitude of harm, marking spatial trauma, exposing documentation bias.

  Distinguishing this from similar concepts: 
  - Unlike myth-making, the goal isn't symbolism but confronting erasure. 
  - Unlike denialism, it acknowledges harm while fighting its concealment. 
  - Unlike degradation, the changes are purposeful adaptations.

  Least confident about whether "functional inaccuracy" fully captures the *relational* aspect - how memories expose power dynamics in record-keeping. Maybe that needs explicit framing: the inaccuracies reveal who controls narrative infrastructure.

  Boundary case: A story where errors just simplify events (degradation) vs. one where errors actively reconstruct suppressed truths (this phenomenon). Test: Does "correcting" the memory aid the erasure? If yes, it's likely functional inaccuracy.

  User's deeper need: Tools to validate these memories without endorsing factual errors, while challenging officials who weaponize "corrections" to promote denial ("nothing happened here"). They need language to defend the truth-within-inaccuracy.
answer: |-
  This pattern is profoundly significant and absolutely deserves a name. The closest established concept is **"symbolic truth"** or **"functional narrative,"** but these don't fully capture the *load-bearing* nature of the inaccuracy itself. What you're describing is distinct. Let's define it tightly:

  **Core Concept:**  
  **Functional Inaccuracy:** A community memory where specific, verifiable details (dates, agents, mechanisms) are factually incorrect, but the *structure* and *errors themselves* accurately preserve and communicate essential truths that are actively suppressed, fragmented, or rendered invisible by the official record. The inaccuracy serves a crucial function: resisting erasure, exposing systemic relationships, or marking trauma in collective consciousness.

  **Why it's not just "symbolic truth":**  
  *   Symbolic truth focuses on metaphorical meaning (e.g., a dragon symbolizing oppression). Functional inaccuracy deals with *concrete historical events* where the *wrong specifics* point directly to *suppressed concrete truths* (e.g., the *wrong year* points to the *existence of gaps*, the *wrong location* forces *public remembrance*).
  *   The *error itself* is the functional element, not just the underlying symbol.

  **Distinctions from Similar Concepts:**

  1.  **Myth-Making:**
      *   **Myth:** Creates meaning, explains origins, reinforces cultural identity. Often timeless or archetypal.
      *   **Functional Inaccuracy:** Rooted in specific, recent, traumatic history. Purpose is not identity-building *primarily*, but **resistance to erasure** and **exposure of power structures**. The inaccuracy directly counteracts the *mechanisms* of official silencing (e.g., scattering records, reclassifying deaths).
      *   **Test:** Does the narrative primarily serve cultural identity/explanation, or is it a weapon against documented suppression? If the latter, it's likely functional inaccuracy.

  2.  **Straight Denialism:**
      *   **Denialism:** Actively rejects facts to avoid responsibility or minimize harm. Relies on falsehoods that obscure.
      *   **Functional Inaccuracy:** *Acknowledges core harm* but distorts specifics *to make that harm visible and undeniable* against an official narrative that seeks to erase it entirely. It's the opposite of obscuring; it's forcing recognition using imperfect tools.
      *   **Test:** Is the core claim *minimizing/denying harm* (denialism) or *insisting on harm despite official absence* using flawed specifics? If the latter, functional inaccuracy.

  3.  **Degraded Story / Memory Decay:**
      *   **Degradation:** Details become lost or garbled randomly over time through forgetting or retelling errors. No *purpose* to the inaccuracy.
      *   **Functional Inaccuracy:** Details shift *non-randomly* to serve a specific purpose: stitching fragmented truths, marking trauma spatially, exposing record-keeping bias. The "errors" are *adaptations*, not accidents. They carry meaning the original facts, as isolated in the archive, cannot.
      *   **Test:** Are the errors random and meaningless (degradation), or do they consistently point towards systemic gaps, power dynamics, or the magnitude/impact of the suppressed event? If the latter, functional inaccuracy.

  **Boundary Cases (When it's "The Other Thing"):**

  1.  **Pure Symbolism:** A story about "the dark time" with no concrete referent is symbolic, not functional inaccuracy. Functional inaccuracy *always* has a traceable, suppressed historical core.
  2.  **Conspiracy Theory:** Claims built on misinterpretation or fabrication *without* a basis in documented systemic suppression or archival gaps. Often lacks the traceable fragments you describe (e.g., the 1961 conviction + 1964 tax roll).
  3.  **Simple Mistake:** If the village said "1963" but meant "1961" and the *only* truth preserved is the *event itself* (the arrests), not the relationship to the records or spatial impact, it's likely degradation or error, not functional inaccuracy. The key is the *additional truth carried by the error*.

  **The "Correction" Problem:**  
  This is critical. Functional inaccuracies are brittle. The "truth" they hold resides in the *structure of the error relative to the archive*. When you "correct" the factual error without simultaneously **validating the functional truth it carried** (the mass disappearance, the systemic erasure, the spatial trauma), you destroy the narrative's *entire* function. You don't replace it with the "full truth"; you validate the *official archive's framework*, allowing officials to weaponize your correction to say "See? It's not true!" and revert to full denial ("nothing happened"). This confirms the *need* for the functional inaccuracy in the first place.

  **Confidence & Uncertainties:**

  *   **Highly Confident:** The core distinction – that the *inaccuracy itself* serves a crucial function (resisting erasure, exposing relationships) absent from ordinary myth, denialism, or degradation – feels robust based on your examples.
  *   **Confident:** The distinction from pure symbolism and conspiracy theories is clear. The reliance on traceable archival fragments is key.
  *   **Less Confident (Most Uncertain):** The precise boundaries with highly *adaptive* myth-making or particularly *meaningful* degradation. When does a story shift *because* it needs to serve a function vs. shifting randomly and *later* acquiring meaning? In practice, the "test" questions above (purpose, resistance, traceable fragments) are the best tools, but the line *can* be blurry in less extreme cases.
  *   **Concern:** The devastating impact of "correction" without functional validation is stark in your description. While confident this is a real dynamic, I'm less certain about the *universal* response (does it *always* lead to "nothing happened"?). However, the logic that destroying the functional narrative without replacing its core function empowers denial is compelling.

  **In essence:** You're observing **Functional Inaccuracy** – a community's vital, adaptive strategy to encode suppressed truths about systemic harm and archival violence into the *very fabric* of its imperfect memories, using the "errors" as structural supports against erasure. Handle these narratives with extreme care: "correcting" the facts without acknowledging and integrating the deeper functional truth they carry risks completing the erasure they were fighting against. Focus on **what the error reveals** about the relationship between power, documentation, and lived experience.
