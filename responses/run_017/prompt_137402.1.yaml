prompt: |-
  ok so I'm on the steering committee of the bike co-op I volunteer at — about 300 members, shared tools, two floors. There's an unwritten thing about where tools go when you're done: the weekday regulars all hang theirs back on the labeled rack by the door, the weekend crowd mostly leaves them on their bench till end of day. Both patterns are stable, everyone in each clique expects everyone else in it to do the same, and honestly it barely matters which one you do as long as the other people in the room are doing it.

  A few of us want to post a printed rule (pick one, either way) and one of the older members keeps shutting it down: "a norm is like which side of the road you drive on — nobody chose it, nobody enforces it, it holds because we all expect each other to, so a sign isn't going to make it work and might just kill the thing that was actually holding it together." He's read some Lewis and talks about coordination problems and equilibria and salience.

  Two things I think complicate it but I can't tell whether they're the kind of thing that breaks the comparison or just noise. First: some people genuinely prefer that everyone else put tools away and that they personally not have to — they like a tidy shop, they just dont like tidying. Second: turnover is high, and about a year ago a manager did post a rule (everything back on the wall) and maybe thirty people followed it for a week before it quietly died.

  Can you audit the driving analogy for me: what's supposed to map onto what (what plays the role of the road, the oncoming traffic, the two sides, the crash), which of those features our shop actually has and which it doesn't, where the mapping breaks, and whether his conclusion — don't formalize, it won't take and might crowd out the real norm — survives once the differences are on the table. Then, if the actual problem is that neither option is salient enough, is there something short of a written rule that does the same work (painting the rack bright yellow, moving it right next to the door), and is that just the same top-down thing wearing a different hat?

  Give me exactly five numbered points, one or two sentences each, no intro and no wrap-up.
reasoning: |-
  Hmm, the user is part of a bike co-op steering committee dealing with an unwritten norm about tool placement. The weekday regulars hang tools back immediately, while weekend users leave them on benches until end-of-day. They want to formalize this with a rule but an older member opposes it using David Lewis's coordination theory. The user asks me to analyze the driving analogy, check where it holds or breaks, and suggest alternatives.

  The core issue is a coordination problem with two stable equilibria. The driving analogy maps well in some ways: both sides of the road represent the two tool-placement norms, with each being self-sustaining within its group. Oncoming traffic represents others' expected behavior, and a crash symbolizes the confusion or inefficiency when norms clash.

  But there are key differences. Unlike driving with its clear consequences, the tool placement has low stakes - it "barely matters" which norm is followed. Also, driving relies on universal salience, while the co-op has fragmented groups with different expectations. High turnover weakens shared understanding, making salience fragile.

  The failed rule attempt a year ago shows formalization didn't stick, supporting the older member's concern that written rules can't create salience. However, the member's claim that "nobody enforces it" overlooks that social enforcement exists through peer expectations within cliques.

  For alternatives, I consider physical interventions like painting the rack yellow. This differs from top-down rules by making the preferred outcome more obvious without commanding behavior. It enhances salience organically, which might sustain better than a rule.

  I need to deliver exactly five numbered points as requested - concise and focused, no intro or wrap-up. I'll structure them to: 1) Map the analogy, 2) Highlight critical differences, 3) Explain why enforcement claim is inaccurate, 4) Analyze why past rule failed, 5) Propose a salience-building alternative. This covers the audit while addressing the complications mentioned.
answer: |-
  1.  **Mapping:** In driving, the "road" is the shared workspace, "oncoming traffic" represents other users' expected actions, "sides" are the two tool norms (hang immediately vs. leave on bench), and a "crash" is confusion/disruption when norms clash unexpectedly.
  2.  **Key Difference: Stakes & Enforcement:** Unlike driving (high-stakes crashes, universal enforcement expectation), tool placement is low-stakes ("barely matters") and lacks any enforcement mechanism (even social), relying solely on mutual expectation within cliques.
  3.  **Broken Mapping: Fragmented Salience & Turnover:** The shop lacks the universal "salience" of driving norms; salience is clique-specific ("weekday regulars" vs. "weekend crowd"), and high turnover constantly erodes shared expectations, unlike stable driving populations.
  4.  **Formalization Failure Reason:** The past rule failed because it couldn't create genuine salience (the *shared* expectation everyone would follow it); it lacked enforcement and conflicted with existing clique expectations, making it unsustainable noise.
  5.  **Alternative: Enhancing Salience:** Physically highlighting the preferred option (e.g., painting the rack bright yellow, moving it centrally) is *not* the same as a top-down rule; it makes one equilibrium more obvious/attractive, potentially fostering spontaneous coordination without commanding behavior.
