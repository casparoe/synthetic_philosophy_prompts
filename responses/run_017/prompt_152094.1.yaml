prompt: |-
  I am a professor of philosophy, and I recently acted as internal examiner for a doctoral thesis in our logic group, jointly supervised with computer science. The external examiner, who is sympathetic to the intuitionistic tradition, has recommended rejection, and the substance of his objection is compressed into a line he repeats twice: in mathematics, truth is provability. He puts it to two uses. First, he holds that the student's central lemma has not been established. The only argument available for it is probabilistic in the following sense: there is a finite transcript, and a deterministic checker which, given that transcript and a random string, accepts every instance of the lemma and accepts any false instance with probability at most one third; running the checker on independent strings drives the error down as far as one likes but never to zero. A two-thirds chance of a certificate is not a proof, he writes, and truth does not come in degrees. Second, he infers that the lemma, as stated, is therefore not true — indeed that it has no determinate truth value until a proof is produced — and he proposes that the student either supply a proper construction or restate the result in the weaker form obtained by a double-negation translation. The student's complaint is that the second proposal changes the subject.

  I would like to answer him properly rather than trade intuitions, and I suspect the sentence he is leaning on is being made to do more work than it can bear. Please lay out, as a menu, the distinct precise theses that truth is provability might be expressing, from the near-trivial to the radical, marking each as trivial, substantive and defensible, or false. I would like the menu to separate at least: the soundness platitude that whatever is provable is true; the identification of truth with derivability in some fixed formal system, together with the question of which system and of what the incompleteness theorems do to that identification; the semantic thesis that the meanings of mathematical sentences are given by proof or assertion conditions rather than by verification-transcendent truth conditions; the claim that every truth is provable in principle by an ideally resourceful agent, with some account of what in principle would have to mean; the stronger actualist claim that a statement acquires a truth value only when someone actually constructs a proof; the reading on which the slogan is really a claim about logic rather than about truth — that what it amounts to is the embedding of intuitionistic propositional logic into the modal logic S4 with the box read as provability; and a resource-bounded reading on which only feasible constructions count. For each reading, say what it commits one to about an open conjecture, and then tell me which readings, if any, would actually deliver the examiner's two conclusions: that the probabilistic argument fails to establish the lemma, and that the lemma is not true, or lacks a truth value, until a proof is in hand.

  Two further things would help me. First, does the distinction between proving a statement and proving a statement about the reliability of a procedure that outputs candidates for it do any work here, or is that a red herring? Second, is any of these readings hospitable to a probabilistic or interactive proof at all — that is, is there a coherent constructivist position on which a transcript together with a proved error bound is a construction of the lemma, or of something near enough to it? Close with your view on which reading the examiner most likely meant and whether that reading survives its own standard.
reasoning: |-
  Okay, I need to help this philosophy professor respond to an external examiner who rejected a thesis based on the claim "in mathematics, truth is provability." The examiner objects to a probabilistic proof for a central lemma, arguing it doesn't establish truth since truth isn't gradable, and says the lemma isn't true until proven. The student feels changing the statement via double-negation translation changes the subject. 

  First, I should unpack "truth is provability" into precise theses. The professor wants a menu from trivial to radical, covering:
  - Soundness platitude (provable implies true)
  - Identification with derivability in a fixed system (impacted by incompleteness)
  - Semantic thesis (meaning via proof conditions)
  - Ideal provability (in principle by ideal agent)
  - Actualist claim (truth only when proof is constructed)
  - Modal logic interpretation (S4 with □ as provability)
  - Feasible constructions (resource-bounded)

  For each, I'll state commitments about open conjectures and whether it supports the examiner's two conclusions: rejecting probabilistic proof and denying truth-value pre-proof.

  Starting with the soundness platitude: this is uncontroversial. Provable implies true, but doesn't say all truths are provable. For open conjectures, they could be true but unprovable. This doesn't help the examiner—probabilistic methods might still indicate truth even if not proving it.

  Next, fixed formal system identification. Say we pick Peano Arithmetic. Truth equals provability in PA. But Gödel shows some truths aren't provable in PA. Open conjectures: if independent, no truth value. But this seems arbitrary—why PA? And probabilistic proofs aren't derivations in the system, so the examiner might reject them. But the lemma could still be true if provable in a stronger system. The examiner's second conclusion might follow if the system is fixed, but it's controversial.

  Semantic thesis (Dummettian anti-realism). Meaning is tied to proof conditions, not verification-transcendent truth. Open conjectures lack truth value until proved or refuted. This might support the examiner: probabilistic proof isn't conclusive, so no truth value. But Dummett allows for a broader notion of proof—maybe probabilistic methods could count if they're part of the practice. However, traditional intuitionism might not accept it.

  Ideal provability. Every truth is provable in principle by an ideal mathematician. "In principle" means ignoring resources, time, etc. Open conjectures are either provable or refutable in principle, so have truth values. But probabilistic proofs might be steps toward ideal proof. The examiner's rejection of probabilistic proof might not hold here unless it's deemed insufficient for ideal provability.

  Actualist claim. Truth only when proof is actually constructed. Open conjectures lack truth value. This directly supports the examiner: no proof, no truth. But it's extreme—most find it implausible. The lemma isn't true now, but could be later.

  Modal logic S4 embedding. Truth as provability interpreted via modal logic. Provability is a modality. Doesn't directly say about truth values, but formalizes reasoning about provability. Open conjectures: if not provable, not true in this modal sense. Probabilistic proofs don't provide a "box" certificate, so might not count. But this is more about logic than metaphysics.

  Resource-bounded. Only feasible proofs count. Truth is what's provable with feasible resources. But probabilistic methods might be acceptable here as practical proofs. Open conjectures that aren't feasibly provable might be indeterminate. This contradicts the examiner since he rejects feasibility.

  Now, which theses support the examiner? 
  - For rejecting probabilistic proof: semantic thesis, actualist, maybe fixed system if prob proof isn't derivation.
  - For denying truth-value pre-proof: semantic, actualist, fixed system if unproven.

  The professor asked about distinguishing proving a statement vs proving reliability of a procedure. The lemma is about a mathematical object, and the probabilistic checker is a procedure that outputs candidates. The examiner might say proving the checker reliable isn't proving the lemma itself. But in classical math, if you prove a reliable procedure outputs true statements, that could establish truth. For constructivists, it might not count as a direct construction.

  Is there a constructivist position accepting probabilistic proofs? Maybe if they see the transcript plus checker as a "construction" with high confidence, but traditional intuitionism demands direct evidence. Bishop might accept it if the error bound is constructive, but double-negation might still be needed.

  The examiner likely meant the semantic thesis or actualist claim. Semantic thesis is defensible; actualist is radical. Semantic thesis might survive if proof is broadly construed, but the examiner is strict.

  My view: the examiner probably holds a strong semantic anti-realism (like Dummett) or actualism. But actualism is hard to defend. Semantic thesis can be maintained, but it's revisionary. Probabilistic proofs aren't proofs in this framework, so they don't establish truth. But the student could use double-negation to weaken the result.
answer: |-
  Below is a systematic analysis of the slogan "in mathematics, truth is provability," broken down into distinct precise theses. For each thesis, I specify its commitments regarding open conjectures and assess whether it supports the external examiner's two conclusions: (1) that the probabilistic argument fails to establish the lemma, and (2) that the lemma lacks a determinate truth value until a proof is produced. I then address your additional questions about the role of reliability proofs and the possibility of constructivist-friendly probabilistic proofs. Finally, I offer my view on the examiner's likely position and its viability.

  ---

  ### **Menu of Theses: "Truth is Provability"**
  *Key:*  
  - **Trivial**: Uncontroversial, universally accepted.  
  - **Substantive and defensible**: Coherent and arguable within established philosophical/logical frameworks.  
  - **False**: Inconsistent with widely accepted results (e.g., incompleteness) or deeply counterintuitive.  

  1. **Soundness Platitude**  
     - **Thesis**: "Whatever is provable (in a consistent system) is true."  
     - **Status**: Trivial. A minimal constraint linking proof to truth.  
     - **Commitments for open conjectures**: An open conjecture may be true but unprovable, or false but unrefuted. Truth is independent of proof.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: No. Probabilistic evidence could still indicate truth, even if it doesn't constitute proof.  
       - (2) **No truth value without proof**: No. Truth is proof-transcendent.  

  2. **Formal System Identification**  
     - **Thesis**: "Truth is identical to derivability in a fixed formal system S (e.g., Peano Arithmetic)."  
     - **Status**: False (due to Gödel's incompleteness theorems). S cannot capture all mathematical truths.  
     - **Commitments for open conjectures**: Conjectures independent of S have no truth value; those provable/refutable in S are true/false.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: Yes, if S is deductive (no probabilistic rules). The lemma is unproven in S.  
       - (2) **No truth value without proof**: Yes, for S-independent statements. But this is arbitrary (why S?) and conflicts with mathematical practice.  

  3. **Semantic Anti-Realism (Dummettian)**  
     - **Thesis**: "The meaning of a mathematical statement is given by its proof (assertion) conditions, not verification-transcendent truth conditions."  
     - **Status**: Substantive and defensible (core to intuitionism).  
     - **Commitments for open conjectures**: No truth value until proof/refutation is found. An open conjecture is neither true nor false.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: Yes. Proof requires direct evidence (e.g., a construction); probabilistic "certainty" is not proof.  
       - (2) **No truth value without proof**: Yes. Truth is epistemically constrained.  

  4. **Ideal Provability (Kreisel/Gödel)**  
     - **Thesis**: "Every true mathematical statement is provable *in principle* by an ideal agent (ignoring finitude, time, etc.)."  
     - **Status**: Substantive and defensible. "In principle" means logically possible, not feasible.  
     - **Commitments for open conjectures**: All open conjectures have truth values (true or false), and a proof/refutation exists in the ideal sense.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: Possibly. Probabilistic arguments may be steps toward ideal proof but aren't themselves proofs.  
       - (2) **No truth value without proof**: No. Truth is idealization-independent.  

  5. **Actualism (Strict Constructivism)**  
     - **Thesis**: "A statement acquires a truth value only when a proof is actually constructed (by humans)."  
     - **Status**: Substantive but highly contentious (radical).  
     - **Commitments for open conjectures**: No truth value pre-proof. The conjecture "becomes" true only upon proof-construction.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: Yes. Actual proof is required; probabilistic arguments are not constructions.  
       - (2) **No truth value without proof**: Yes. Truth is temporally indexed to human activity.  

  6. **Modal Logic Interpretation (S4 Embedding)**  
     - **Thesis**: "The slogan formalizes intuitionistic logic via S4: □ϕ (provably ϕ) is equivalent to ϕ being true."  
     - **Status**: Substantive and defensible (per Gödel-McKinsey-Tarski).  
     - **Commitments for open conjectures**: □ϕ is not satisfied, so ϕ isn't "proven-true," but ϕ could hold in a Kripke model.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: Yes. S4 requires a formal certificate (□ϕ), which probabilistic methods don't provide.  
       - (2) **No truth value without proof**: Not directly—this is a logical, not metaphysical, thesis.  

  7. **Resource-Bounded Provability**  
     - **Thesis**: "Truth is provability within feasible computational resources (e.g., polynomial time)."  
     - **Status**: Substantive but revisionary (e.g., implicit in crypto/Complexity Theory).  
     - **Commitments for open conjectures**: Feasibly undecidable conjectures lack truth values.  
     - **Supports examiner's conclusions?**  
       - (1) **Rejection of probabilistic proof**: No. Probabilistic proofs (e.g., IP=PSPACE) *are* accepted as valid in this framework.  
       - (2) **No truth value without proof**: Only if proof is infeasible; probabilistic methods may suffice.  

  ---

  ### **Addressing Your Additional Questions**
  1. **Does distinguishing "proving the statement" vs. "proving the reliability of a procedure" help?**  
     - **Not a red herring—it's crucial**. The examiner treats the probabilistic checker as a meta-argument about reliability, not a proof of the lemma itself.  
       - In classical logic, proving a procedure outputs true statements with high probability might justify belief in the lemma (if the procedure is sound).  
       - For intuitionists, this is insufficient: The lemma requires a direct construction. Proving the checker reliable (e.g., "the checker accepts only true statements") is a separate claim needing its own proof. If that proof itself uses non-constructive methods, it compounds the issue. The examiner likely sees this as circular or indirect.  

  2. **Is any reading hospitable to probabilistic/interactive proofs?**  
     - **Only resource-bounded provability** (Thesis 7) naturally accommodates them. In complexity theory, probabilistic proofs (e.g., IP, PCP) are theorems.  
     - **A moderate constructivist position** might accept them if:  
       - The error bound is constructively proven (e.g., using finitist or intuitionistic probability).  
       - The transcript is treated as a "candidate proof," and the checker as a "proof-verifier" with negligible error.  
     - However, this **still weakens the result**: The lemma becomes "highly probable" or "checkably true" (a computational fact), not "true" simpliciter. Double-negation (e.g., "¬¬P") might be necessary to align with intuitionistic truth, but as the student protests, this changes the subject (e.g., from "P holds" to "P cannot be refuted").  

  ---

  ### **My View on the Examiner's Position and Its Viability**
  - **Likely reading**: The examiner is appealing to **Semantic Anti-Realism (Thesis 3)** or **Actualism (Thesis 5)**, grounded in intuitionism.  
    - **Why**: His rejection of "degrees of truth" and insistence on constructions align with Dummett (Thesis 3), while "truth not determinate until proof" suggests Actualism (Thesis 5). His demand for double-negation translation is standard intuitionistic methodology.  
  - **Does it survive its own standard?**  
    - **Thesis 3 (Semantic Anti-Realism)**: Defensible. It coheres with intuitionistic mathematics and avoids platonic commitments. However, it faces challenges:  
      - It must explain how proof conditions are fixed (e.g., is probabilistic evidence ever part of meaning?).  
      - It risks making mathematics "timelessly incomplete" (e.g., unproven conjectures aren't even false).  
    - **Thesis 5 (Actualism)**: Less defensible. It implies mathematics "grows" with human activity, which is anthropocentric and clashes with intersubjective practice (e.g., the Prime Number Theorem was true pre-proof).  
  - **Examiner's conclusions under this reading**:  
    - (1) **Probabilistic proof fails**: Coherent—it doesn't supply the required construction.  
    - (2) **No truth value without proof**: Coherent but revisionary.  

  ---

  ### **Recommendation for Response**
  - **Engage the substance**: Grant that under intuitionistic truth (Thesis 3), the probabilistic argument is inadequate. However, note that the student's work may implicitly assume classical logic (where truth is bivalent and proof-transcendent). Distinguish between:  
    - *Classical interpretation*: The lemma has a truth value; probabilistic evidence supports it.  
    - *Intuitionistic interpretation*: Proof is required for truth/semantic value.  
  - **Challenge the examiner's rigidity**: Argue that even intuitionism can accommodate "pragmatic proof" (e.g., error-bound verification as constructive evidence), or that the reliability proof for the checker could be made constructive.  
  - **Defend the student**: Insist that double-negation translation alters the lemma's content (e.g., from "there exists" to "it is contradictory that none exist"), validating the student's complaint that it "changes the subject."  

  This menu equips you to dissect the examiner's position precisely, showing that his conclusions depend on a specific (and contestable) reading of "truth is provability," while offering pathways to defend the thesis without capitulating to revisionism.
