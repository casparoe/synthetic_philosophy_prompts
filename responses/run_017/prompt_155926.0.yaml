  For (b) on §2's dependence thesis: This is strong but there's a sneaky equivocation between "needs a principle" and "must be normative". A determined opponent could argue for purely descriptive extrapolation (e.g., "what the operator would statistically say"). Should address that.

  §4's reframing (c) feels genuinely novel - turning alignment into a profile spectrum rather than binary opposition is clever. But is it just relabeling? The case study helps show it's substantive by demonstrating how different profiles yield different actions in the same scenario.

  Biggest unaddressed objection (d): The whole framework assumes AI systems can reliably model counterfactuals about human intentions - but that's arguably the hardest part! Also, their "provisional principle" at the end feels underexplored - why should affected parties automatically reduce the principal's authority?

  Noticing some phrasing issues too. "Penumbra of cases" in §2 might be too metaphorical. "The tempting quarrel... turns out to be a quarrel about a label" in §4 is snappy but risks oversimplifying - opponents might say the intent/value distinction does substantive work in assigning moral responsibility differently.

  User seems open to tough feedback - they specifically asked where readers would stop being convinced. I'll flag §3's constraint/specification move as particularly vulnerable. The financial case study is strong but could be tighter - the "retune" part feels a bit tacked on.

