  So the verdicts are stable.

  Now, the table of gains (relative to starting points):

          Option A       Option B
  Alice:    +12           +8
  Bob:      +12           +18

  The two hypotheses about starting points:

  Hypothesis 1: Alice starts at 50, Bob at 60.
  Hypothesis 2: Alice starts at 60, Bob at 50.

  Calculations:

  Average chooser:
    Always: Option A average gain = (12+12)/2 = 12; Option B = (8+18)/2=13 -> prefers B.

  Maximin chooser:
    Hyp1: 
        A: (50+12, 60+12) = (62,72) -> min=62
        B: (50+8, 60+18) = (58,78) -> min=58 -> prefers A (because 62>58)
    Hyp2:
        A: (60+12,50+12) = (72,62) -> min=62
        B: (60+8,50+18) = (68,68) -> min=68 -> prefers B (68>62)

  Notes:

  1. The single feature doing the work: The difference in the marginal gains (Bob gains more per hour) combined with the fact that the allocation of hours is different in the two options, and the ambiguity in the baseline. Specifically, the gains are such that Option A gives equal gains to both, while Option B gives more to Bob and less to Alice. But the maximin rule depends critically on who is worse off at baseline. If we change the baseline, we change who is the worst-off after the allocation.

  2. What breaks if we remove the feature? If we make the total gains equal (so that the average chooser is indifferent), then the average rule would not have a strict preference. For example, if we change the gains in Option B to Alice 9 and Bob 15, then total gains in A: 24, in B: 24. Then the average chooser would be indifferent. But we want the average chooser to have a strict preference. Alternatively, if we make the worst-off person the same under both hypotheses, then the maximin chooser would always pick the same option. For example, if in both hypotheses Alice is worse off at baseline, then in both cases the worst-off after allocation would be Alice. Then we would compare Alice's outcomes: in Option A she gets 12, in Option B 8. So maximin would always prefer A. But we want maximin to flip. So the key is that the baseline ambiguity flips who is the worst-off.

  3. How a defender of maximin would attack: They might argue that the case is unrealistic because in reality, we can and should measure the baseline levels. The maximin rule requires knowing the baseline to identify the worst-off, and that is a virtue because it forces us to address the needs of the most vulnerable. The average rule's invariance to the baseline is bought by ignoring the distribution of the baseline. The average rule does not care about the initial inequality. The maximin defender would say that the average rule is insensitive to who is worse off, which is a crucial ethical consideration. They might also argue that in a veil of ignorance, the maximin rule is a rational choice for someone who is extremely risk-averse, but note that we have avoided risk aversion by having known probabilities and by the average chooser being risk-neutral. The maximin defender might instead embrace the dependence on baseline: it is exactly because we care about the absolute level of the worst-off that we need to know the baseline. Without it, we cannot know who is worst off. Therefore, the need for the extra information is a virtue: it shows that the rule is sensitive to the actual situation of the worst-off.

  However, note that the problem is set up to show that the two rules use different information. The maximin rule requires more information (the baseline) to make a decision, and that is the point. The average rule does not require the baseline because it only cares about the gains. The maximin rule requires the baseline because it cares about the absolute level of the worst-off. The defender of maximin would argue that it is right to require that extra information because the baseline matters for justice.

