  But note: we must also ensure that under Hypothesis 1, Alice is the worst-off in both options? In Option A under Hypothesis 1: Alice 62, Bob 72 -> Alice is worse. In Option B: Alice 58, Bob 78 -> Alice is worse. So in Hypothesis 1, the worst-off is always Alice. In Hypothesis 2, under Option A: Alice 72, Bob 62 -> Bob is worse. In Option B: both 68 -> worst-off is 68. So we are safe.

  However, we must also check that in Hypothesis 2, Option B has a worst-off of 68 and Option A of 62, so 68>62. But what if we perturb the starting points? We set A0=60 and B0=50 in Hypothesis 2. If we perturb A0 to 60.5 and B0 to 49.5, then:
  Option A: Alice 72.5, Bob 49.5+12=61.5 -> worst-off is Bob at 61.5
