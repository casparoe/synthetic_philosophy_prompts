answer: |-
  Below is a complete, self-contained case meeting all your specifications. It uses a realistic scenario with two people and two allocation options. The core insight is that the average rule (expected value maximization) depends only on the *gains* from each option, while the maximin rule requires knowing *who starts out worse off* to identify the worst-off person after allocation. The case shows that baseline comparisons are a separate input not entailed by gain comparisons.

  ---

  ### **Scenario: Allocating Physical Therapy Sessions**
  A clinic has 10 hours of physical therapy (PT) to divide between two patients, Alice and Bob, both recovering from injuries. PT improves mobility, measured on a standardized functional scale (points). The clinic can measure how many points of improvement each patient gains per PT hour (*gain per unit*). However, the patients' *starting points* (mobility before PT) are unknown and cannot be directly compared because:
  - Alice has a spinal injury; Bob has a knee injury.  
  - Their baseline mobility is assessed using different clinical markers (e.g., Alice’s tests focus on trunk control, Bob’s on gait symmetry).  
  - The clinic can track *improvements* for each (points gained), but lacks a unified scale to equate their starting points.  

  Two allocation options are available:  
  - **Option A**: Alice gets 7 hours, Bob gets 3 hours.  
  - **Option B**: Alice gets 3 hours, Bob gets 7 hours.  

  **Gain per PT hour** (measured from pre-therapy assessments):  
  - Alice gains **2 points/hour**.  
  - Bob gains **1 point/hour**.  

  Thus, the **gains (points)** for each option are:  

  | Patient | Option A gains | Option B gains |
  |---------|----------------|----------------|
  | Alice   | 7h × 2 = **14** | 3h × 2 = **6**  |
  | Bob     | 3h × 1 = **3**  | 7h × 1 = **7**  |

  ### **Admissible Baseline Hypotheses**
  The clinic cannot measure absolute starting points, but two hypotheses are consistent with the observed gains:  
  - **Hypothesis 1 (Alice starts worse)**: Alice’s baseline = **70 points**, Bob’s baseline = **90 points**.  
  - **Hypothesis 2 (Bob starts worse)**: Alice’s baseline = **90 points**, Bob’s baseline = **70 points**.  

  **Why these are admissible**:  
  - The gain measurements do not constrain starting points. Hypotheses 1 and 2 both fit the data: Alice gains 14/6 points in A/B, Bob gains 3/7 points, regardless of baselines.  
  - The clinic’s inability to equate baselines is realistic: spinal and knee mobility are clinically distinct, so "70 points" for Alice (spinal) may not mean the same functional ability as "70 points" for Bob (knee).  

  ---

  ### **Chooser 1: Average Rule (Expected Value Maximization)**  
  *Behind the veil, this chooser averages total outcomes across all people (since each is equally likely). Total outcome = baseline + gains.*  

  **Calculation**:  
  - Average outcome for an option = (Alice’s total + Bob’s total) / 2.  
  - **Baselines add a constant**: (Alice’s baseline + Bob’s baseline) / 2 is identical for both options under a given hypothesis. Thus, only *gains* matter for ranking options.  
  - Gains under Option A: Alice +14, Bob +3 → Average gain = (14 + 3)/2 = **8.5 points**.  
  - Gains under Option B: Alice +6, Bob +7 → Average gain = (6 + 7)/2 = **6.5 points**.  
  - **Verdict**: Option A has higher average gain (8.5 > 6.5).  
    - Under Hypothesis 1: Average outcome = [(70+14) + (90+3)]/2 = (84 + 93)/2 = **88.5** (A) vs. [(70+6) + (90+7)]/2 = (76 + 97)/2 = **86.5** (B).  
    - Under Hypothesis 2: Average outcome = [(90+14) + (70+3)]/2 = (104 + 73)/2 = **88.5** (A) vs. [(90+6) + (70+7)]/2 = (96 + 77)/2 = **86.5** (B).  
  → **Always prefers Option A**, regardless of baselines.  

  ---

  ### **Chooser 2: Maximin Rule (Maximize the Worst-Off)**  
  *Behind the veil, this chooser picks the option where the worst-off person ends up best. Depends on who is worst off after gains, which relies on baselines.*  

  **Calculation**:  
  - **Hypothesis 1 (Alice starts worse)**:  
    - Option A: Alice = 70 + 14 = **84**, Bob = 90 + 3 = **93** → Worst-off = **Alice (84)**.  
    - Option B: Alice = 70 + 6 = **76**, Bob = 90 + 7 = **97** → Worst-off = **Alice (76)**.  
    → **Prefers Option A** (84 > 76).  
  - **Hypothesis 2 (Bob starts worse)**:  
    - Option A: Alice = 90 + 14 = **104**, Bob = 70 + 3 = **73** → Worst-off = **Bob (73)**.  
    - Option B: Alice = 90 + 6 = **96**, Bob = 70 + 7 = **77** → Worst-off = **Bob (77)**.  
    → **Prefers Option B** (77 > 73).  
  → **Choice flips based on baselines**: A under H1, B under H2.  

  ---

  ### **Key Notes**  
  1. **Single feature doing the work**:  
     The **ambiguity in who starts out worse off** combined with **asymmetric gains** across options. Option A gives Alice more gain (14 vs. 6), but Bob less (3 vs. 7). Without knowing baselines, we can’t identify the worst-off person after allocation.  

  2. **What breaks if this feature is removed**:  
     - If we **equalize total gains** (e.g., adjust Option B to Alice +8, Bob +9 → total 17, same as A’s 14+3), the average rule becomes indifferent, violating your requirement for a strict preference.  
     - If we **fix who is worst off** (e.g., assume Alice always starts worse), the maximin rule always prefers Option A (as in H1), eliminating the flip. The disagreement collapses.  

  3. **How a maximin defender would attack the case**:  
     - **Virtue of needing extra information**: A maximin defender would argue that baseline comparisons are ethically essential. The average rule’s invariance is "bought" by ignoring whether gains go to the worse-off or better-off person. In this case:  
       - Under H1 (Alice worse off), Option A gives her more gain (14 vs. 6).  
       - Under H2 (Bob worse off), Option B gives him more gain (7 vs. 3).  
       → The maximin rule *conditions on who is worse off* to allocate gains to them. This is a **virtue** because it prioritizes equity.  
     - **Critique of average rule**: By ignoring baselines, the average rule fails to protect the worst-off. Here, it picks Option A even when Bob is worse off (H2), leaving him at 73 vs. 77 in B—a **sacrifice of equity for efficiency**.  

  ---

  ### **Verification Against "Cheating"**  
  - **No risk aversion**: Both choosers use known probabilities (equal chance of being either person). The average rule is risk-neutral; maximin focuses on the worst outcome, but this stems from equity concerns, not financial risk aversion.  
  - **No outsized gains**: Gains are small (2–1 points/hour) and symmetric; flipping relies on baseline ambiguity, not magnitude.  
  - **Baselines not assumed**: The hypotheses are consistent with observed gains and justified by clinical realism.  
  - **Slack tested**:  
    - Gains: If Alice’s gain/hour is 1.9 or 2.1 (within 0.5), Option A still has higher average gain.  
    - Baselines: If Alice’s baseline in H1 is 71 or 69, she remains worst-off in both options, and A is still better under H1.  
    - No ties: Option A always wins for average; maximin flips cleanly.  

  This case cleanly isolates your distinction: Gain comparisons suffice for the average rule, but baseline comparisons are an independent input for maximin.
