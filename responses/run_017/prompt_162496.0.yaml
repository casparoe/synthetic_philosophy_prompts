  - Group Y shows textbook progressive traits: pre-registered predictions, anomaly absorption with independent testability. Its lack of confirmed novel facts is mitigated by pending tests.

  The vulnerability lies in Step 3's judgment calls. If empirical studies showed that institutional success never correlates with later epistemic breakthroughs, that would undermine the dual-track design. Meanwhile, the hard-core laundering test might misfire if groups can fabricate plausible "burden" narratives.

  Notably, user expects panel to favor X - this reveals real-world pressure to privilege entrenched groups. The procedure deliberately counters this bias by front-loading epistemic criteria. I'll flag this tension in the close.
answer: |-
  Here is a Lakatosian decision procedure tailored to your panel's constraints, designed to handle your specified difficulties, with test cases and limitations:

  **Decision Procedure for Research Programme Renewal**

  1. **Has the group produced ≥1 *novel confirmed prediction* (NCP) this cycle?**  
     *Sufficient answer:* Pre-registered (time-stamped) quantitative prediction + independent confirmation report.  
     *Threshold:* ≥1 NCP → proceed to Step 4. 0 NCP → proceed to Step 2.

  2. **For anomalies addressed without NCPs:**  
     a. *Were auxiliaries revised to absorb anomalies?*  
        *Sufficient answer:* Documented anomaly + explicit auxiliary modification.  
     b. *Do these revisions yield *independently testable novel predictions* (ITNP)?*  
        *Sufficient answer:* Derivation of ≥1 new falsifiable claim *not* tied to the original anomaly.  
        *Verdict:* ITNP exists → "Provisional progress" (proceed to Step 3).  
        No ITNP → "Degenerating" (proceed to Step 5).

  3. **Hard-core laundering test (if core expanded):**  
     *Question:* "Could this 'core' claim have functioned as an auxiliary (i.e., been modified without killing the programme) *before* this anomaly?"  
     *Sufficient answer:* Demonstration via programme's prior publications that:  
     - Claim was previously *used* as adjustable auxiliary, OR  
     - Modification would have invalidated >30% of prior published results.  
     *Verdict:* Pass (legitimate core) → proceed to Step 4. Fail (evasive) → "Degenerating" (Step 5).

  4. **Institutional progress assessment (separate track):**  
     *Question:* "What institutional impact exists independent of epistemic progress?"  
     *Sufficient evidence:* Trainee placement data, unique infrastructure built, curation of endangered expertise.  
     *Weight:* Institutional success *cannot* override "Degenerating" verdict. Only activates if:  
     - Programme is "Progressive" or "Provisional", AND  
     - Funding scarcity requires tie-breaking.  
     *Grounds for consideration:* Sustains field capacity; justified only if epistemic potential remains plausible.

  5. **Revival clause (for "Degenerating" programmes):**  
     *Conditions for renewal:*  
     - ≥2 independent groups report anomalies solvable *only* by this programme's core, AND  
     - Group presents novel mathematical formalism (not just parameter tweaks) yielding ITNPs.  
     *Limit:* Maximum one renewal cycle under revival clause. Requires panel supermajority.

  **Procedure Outputs:**  
  - Progressive (NCPs): Renew  
  - Provisional (ITNPs): Renew  
  - Degenerating (no ITNP/core laundering): Do not renew *unless* revival clause satisfied  
  - Institutional merit only: Hand back to panel for values debate

  ---

  **Test Case Applications**  
  *Group X (11 years):*  
  - Step 1: 0 NCPs → Step 2  
  - Step 2b: Parameter revisions lack ITNPs → "Degenerating"  
  - Step 3: Core expansion likely *evasive* (parameters were previously adjustable)  
  - Step 4: Institutional success irrelevant due to degeneracy  
  - Step 5: No revival evidence → **Do not renew**  

  *Group Y (10 years):*  
  - Step 1: 0 NCPs (pending tests) → Step 2  
  - Step 2b: New auxiliary has ITNP (independent check) → "Provisional progress"  
  - Step 4: Moderate institutional impact, but epistemic case sufficient → **Renew**  

  ---

  **Contrary Verdict Explained**  
  Your panel leans toward X due to institutional entrenchment, but Lakatos condemns X:  
  - **2 anomalies** absorbed via untestable parameter fiddling  
  - **No novel predictions** despite 11 years  
  - **Hard-core laundering** suspected (parameters promoted to core)  
  Y exemplifies **progressive potential**: pre-registered predictions, ITNP-bearing auxiliaries, testable pipeline. Institutional metrics shouldn't rescue degenerating programmes.

  ---

  **Most Vulnerable Step**  
  **Step 3 (Hard-core Laundering Test)** is prone to misfiring:  
  - *Risk:* Groups may fabricate retrospective justifications for core expansion.  
  - *Failure condition:* If audits reveal ≥20% of "legitimate" core claims were historically adjustable in unpublished work.  
  - *Revision trigger:* Empirical studies showing programme longevity correlates more with political capital than ITNP generation. This would falsify Lakatos's epistemic primacy, requiring weighting of institutional factors earlier.

  **Closing Argument**  
  This procedure prioritizes *predictive fertility* over inertia. X's dominance reflects Matthew effects in science, not progress; funding it perpetuates degeneracy. Y embodies the empirical accountability Lakatos demands. When institutional power masks epistemic decline, the procedure corrects for human bias toward incumbency.
