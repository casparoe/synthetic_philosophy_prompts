  3) Institutional success gets segregated into a parallel track that only activates after epistemic progress is established. Its weight requires explicit justification - perhaps as evidence of latent potential when epistemic signals are ambiguous.
  4) The revival clause must balance openness to surprises against accountability. I'll propose a two-cycle limit with strict criteria for dormant programmes.

  For the test cases:
