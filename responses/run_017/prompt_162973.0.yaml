  - **Yes** (Arbitrary coordination → Go to Q2).  
  - **No, because it’s the only sensible way** (Non-arbitrary → Go to Q7).  
  - **No, because people have conflicting interests** (e.g., if others do X, I’d gain by doing Y) → Go to Q8.  

  **Q2 (Arbitrary): If everyone’s private preferences flipped to the alternative, but no one knew about the flip, would the current regularity survive?**  
  - **Yes** (Held by expectations → Go to Q3).  
  - **No** (Held by current preferences → Leaf: **Plain Habit**).  

  **Q3: If it becomes common knowledge that most comply only because they expect others to (and expect others for the same reason), does the regularity survive?**  
  - **Yes** (Stable under common knowledge → Go to Q4).  
  - **No** (Fragile under common knowledge → Leaf: **Skyrms-style evolutionary equilibrium**).  
  *Awkward: Can get stuck in suboptimal states via drift/reinforcement, no one "knows" anything.*  

  **Q4: Is there a cost imposed on violators (e.g., disapproval, fines), and is it load-bearing (i.e., if removed, the regularity breaks)?**  
  - **Yes, load-bearing** → Leaf: **Bicchieri-style social norm**.  
  *Awkward: Requires conditional preferences + empirical/normative expectations + sanctions.*  
  - **No, or decorative** → Go to Q5.  

  **Q5: Does the regularity persist after the original reason for it has lapsed?**  
  - **Yes** → Leaf: **Teleological account**.  
  *Awkward: Reproduced due to "proper function" (e.g., history overrides current utility).*  
  - **No** → Leaf: **Lewisian convention**.  
  *Awkward: Requires common knowledge of arbitrary equilibrium (deemed too strong by some).*  

  **Q6: Is the act arbitrary as a signal but pays off because it tracks a state (e.g., gesture = emotion)?**  
  - **Yes** → Leaf: **Sender-receiver structure** (Unnamed; e.g., cheap-talk games).  
  *Awkward: Signal meaning depends entirely on population consistency, not inherent value.*  
  - **No** → Re-enter main tree at Q5 (if from Q1) or Q9 (if from Q8).  

  **Q7 (Non-arbitrary): Does the regularity survive if private preferences all flip but no one finds out?**  
  - **Yes** → Go to Q9.  
  - **No** → Leaf: **Statistical regularity (not a norm)**.  
  *Awkward: No normative force; just aggregated individual rationality.*  

  **Q8 (Mixed motives): Is there a cost imposed on violators, and is it load-bearing?**  
  - **Yes, load-bearing** → Go to Q10.  
  - **No, or decorative** → Leaf: **Unnamed (social dilemma sans enforcement)**.  
  *Awkward: Collective action problem; requires altruism or inertia to persist.*  

  **Q9: Does the regularity survive when common knowledge of the expectation loop is established?**  
  - **Yes** → Leaf: **Gilbert’s joint commitment**.  
  *Awkward: Requires a "plural subject" formed by joint agreement, often implicit.*  
  - **No** → Leaf: **Boyd-Richerson-Henrich conformist transmission**.  
  *Awkward: Relies on prestige/conformity bias; doesn’t explain origin.*  

  **Q10: Is the cost mainly enforced through peer "scorekeeping" (e.g., interpreting violations as betraying shared norms)?**  
  - **Yes** → Leaf: **Brandom-ish inferentialist**.  
  *Awkward: Norms live in dynamic practices of giving/taking reasons.*  
  - **No** → Leaf: **Bicchieri-style social norm** (from Q8 path).  

  ---

  ### **Dynamics Tree: Thin vs. Thick Bootstrap**  
  *For each leaf above, ask: **Could this start without prior normative facts/precedents?***  

  - **Thin Bootstrap (Starts from non-normative salience)**:  
    - Lewisian convention (focal points), Skyrms-style (random drift), Conformist transmission (copying salient traits), Plain habit.  
  - **Thick Bootstrap (Requires prior norm/precedent)**:  
    - Bicchieri-style (needs existing expectations/sanctions), Gilbert’s joint commitment (requires prior agreement), Teleological (assumes historical purpose), Brandom-ish (presupposes scorekeeping practices).  
  - **Unclear/Context-Dependent**:  
    - Sender-receiver structure (thin if signal is innate, thick if culturally embedded).  

  *Key insight*: Bicchieri, Gilbert, and Teleological accounts **cannot explain norm origins** without thick bootstrapping—they presuppose pre-existing normativity.  

  ---

  ### **Hard-to-Separate Pairs & Diagnostic Tests**  
  1. **Lewisian vs. Skyrmsian**:  
     - Identical when stable. *Separate via*: Introduce common knowledge of expectations. If regularity collapses → Skyrms; if stable → Lewis.  
  2. **Bicchieri vs. Gilbert**:  
     - Hard to distinguish with universal compliance/no sanctions. *Separate via*: Check if people cite "shared commitment" (Gilbert) or "fear of sanctions" (Bicchieri) when probed.  

  ---

  ### **Unoccupied Combinations**  
  *Logically possible but untheorized or incoherent:*  
  - **Not arbitrary, held up only by expectations, no alternative equilibrium** → *Unattractive*: If non-arbitrary, expectations alone shouldn’t sustain it; individual rationality suffices.  
  - **Arbitrary, held up by moralized sanction** → *Unexplored*: Most sanction-based accounts (e.g., Bicchieri) focus on mixed motives, not pure coordination.  
  - **Thin-bootstrap teleological** → *Incoherent*: Teleology requires historical purpose, which implies prior normativity.  

  ---

  ### **Side-Box: Evidence of Migration Between Categories**  
  Norms shift due to changing incentives or knowledge. Examples:  
  - **Lewisian → Bicchieri**: Sanctions added (e.g., jaywalking laws turn coordination into enforced norm).  
  - **Bicchieri → Teleological**: Original reason lapses (e.g., dueling persists as status signal after dispute-resolution function fades).  
  - **Conformist → Plain habit**: If prestige bias fades, norm decays into individual routine (e.g., outdated fashion trends).  
  *Key signal*: Look for new sanctions, functional shifts, or erosion of common knowledge in historical/experimental data.  

