prompt: |-
  I co-direct a digital history project that is annotating a corpus of roughly 900 passages — drawn from monographs, commission reports, newspaper coverage, and survivor testimony — in which a causal claim is made about one well-documented disaster: the breaching of a colonial-era dam in 1902 that flooded a downstream district and killed several hundred people. Our coders annotate claims, not the world: the first field records the causal structure a passage commits itself to, the second records which of the causes it names should be narrated as *the* cause. We want the manual's taxonomy built from the logical space rather than from a list of famous labels, so that two coders who disagree can be shown exactly where their answers diverge.

  Please write the decision tree for that manual, with the following constraints.

  **Anchor cases.** Every node question must be anchored in one of six calibration cases from the corpus, and must be answerable by someone who has read the case file but has no philosophy training:

  - A. Two demolition charges, planted by unconnected saboteurs, each independently sufficient to open the breach; both detonated within the same second. The report says the breach was caused by the north charge and by the south charge.
  - B. Same two charges, but the north one fired at 04:12 and did the work; the south one was timed to fire at 04:20 if and only if the north one failed, and never fired. A monograph still calls the south charge a cause, because it guaranteed the outcome.
  - C. The breach required three things present that morning — a weakened masonry course, an unusually high reservoir level, and a intake gate left open overnight so that debris struck the dam face. None was sufficient alone; each was necessary given the others. The testimony blames the gate alone.
  - D. The night watchman was asleep and so did not shut the gate; had he been awake he would have shut it. A survivor blames the watchman's sleep.
  - E. A petition delivered two months earlier, which the district engineer read and which changed no decision: he had already refused the repairs. Nearly every narrative in the corpus names the petition as a cause. Under any difference-making test it made none.
  - F. The two charges, but described at finer grain: one opened the breach on the north face at 04:12:04; the other widened it twelve minutes later. Under coarse descriptions the case looks like A; under fine ones it does not.

  **Nodes.** Eight or nine branch nodes, numbered, each phrased as a question a coder can answer from a case file without already knowing which position it leads to. They must jointly cover at least these fault lines: whether a cause has to be a difference-maker under hypothetical intervention; whether overdetermination should be dissolved by redescribing the outcome more finely in time, place, or manner (include a grain node, and make it ask whether the finer description is genuinely available or merely gerrymandered to fit); whether a cause may be an insufficient but non-redundant part of an unnecessary but sufficient condition; whether omissions and absences can be causes; whether a cause can be selected without a contrast class; and whether a passage that ranks its causes — calling one the real, decisive, or underlying cause — is thereby committing to something the listed causes alone do not settle.

  **Leaves.** Seven named positions, each with a one-sentence statement of its most awkward commitment and a note of which calibration case presses it hardest. The set must include: a strict interventionist difference-making view; the insufficient-but-non-redundant-part view; a view on which apparent symmetric overdetermination dissolves under finer description of the outcome; a contrastivist or interest-relative view about causal selection; a production or process view that retains causes where counterfactual tests fail; a view that treats omissions such as the watchman's sleep as causally inert; and a narrativist or anti-realist view about causal selection in history.

  **Output fields.** The tree must be able to return different verdicts for the same passage on the two fields, and must state when a split verdict signals a merely verbal dispute (same counterfactual commitments, different event description or contrast class) rather than a substantive one. It must also allow a coder to record that a named item is causally inert but frame-setting: it fixed the terms, options, or contrast class within which the operative causes worked, though it changed nothing downstream. Say how that code is earned and how it is to be kept from becoming a wastebasket.

  **Gaps and collisions.** Identify at least three cells of the logical space that no named view occupies, and diagnose each as incoherent, unattractive, or merely unexplored. Flag any pair of leaves your tree cannot separate, and give the further question that would separate them if we could ask it.

  **Format.** A short preamble for coders of no more than 200 words; then the numbered nodes with branch conditions; then the leaves; then a short note on how to resolve inter-coder disagreement. The manual is used offline in an archive with no network access and by coders with no philosophical training, so identify every position by its content and never by an author, title, or citation — no references, bibliography, or further reading of any kind.
reasoning: |-
  We are building a decision tree for annotating causal claims in historical texts about a dam breach disaster. The tree must be based on logical distinctions, anchored in six calibration cases (A-F), and lead to seven named positions. Coders have no philosophy training, so questions must be clear and answerable from case files.

  Preamble for Coders (max 200 words):
  Welcome to the causal annotation manual. Your task is to analyze passages making claims about the causes of the 1902 dam breach. For each passage, we will ask a series of yes/no questions about the causal structure and selection. Answer based solely on the text and the case file you have. The questions are designed to capture the logical structure of the claim, not to judge its truth. You will record two things: (1) the causal structure the passage commits to (e.g., whether it requires multiple factors, or names one as decisive), and (2) which named factor(s) the passage presents as *the* cause. Some disagreements may arise from how the outcome is described or the contrast class used; we will flag these as verbal. If a factor is named but had no causal influence (e.g., it didn't change anything), you may code it as "frame-setting" if it set the context for the causes that did operate. Use this code sparingly; it must be explicitly framed in the passage as setting the stage without making a difference. Let's begin.

  Decision Tree Nodes (8-9 branch nodes, numbered, with conditions):

  1. Does the passage describe the outcome (the dam breach and flood) in a way that includes the exact time, location, or manner of the breach? (Inspired by Case F)
     - If yes: Go to 2.
     - If no: Go to 3.

  2. Given the outcome description, is there only one factor that brought about the outcome at that exact time, location, or manner? (Inspired by Case F)
     - If yes: Go to 4.
     - If no: Go to 5.

  3. Without a fine-grained outcome description, does the passage treat multiple factors as each independently sufficient to cause the outcome? (Inspired by Cases A and B)
     - If yes: Go to 5.
     - If no: Go to 6.

  4. The outcome, as described, has only one cause. Record the causal structure as "single cause" and then for causal selection, the factor named is the cause. (But note: this may be a fine-grained description that avoids overdetermination.) Then stop.

  5. The passage accepts symmetric overdetermination (multiple independent sufficient causes). But check: does the passage then select one as *the* cause? (Inspired by Case A: both are named; Case B: the backup charge is named but didn't fire.) 
     - If the passage names only one as the cause (e.g., Case B: the backup charge is called a cause), then go to 7.
     - If the passage names multiple or all as causes (e.g., Case A: both charges are causes), then record causal structure as "overdetermination" and for selection, all named are causes. Then stop.

  6. Does the passage present a set of factors that are jointly sufficient but individually necessary (only in combination)? (Inspired by Case C: three factors, each necessary given the others.)
     - If yes: Go to 8.
     - If no: Go to 9.

  7. For the factor that is named as a cause but was not necessary (because another factor was sufficient and did the work), does the passage justify this by saying that the factor guaranteed the outcome? (Inspired by Case B: the backup charge is called a cause because it guaranteed the outcome even though it didn't fire.)
     - If yes: Then the causal structure is "backup guarantee" (a form of overdetermination) and the factor is selected as a cause. Then stop.
     - If no: Then the selection might be arbitrary or based on other criteria; go to 10.

  8. The causal structure is "INUS condition" (an insufficient but non-redundant part of an unnecessary but sufficient condition). But does the passage then select only one of these factors as *the* cause? (Inspired by Case C: the gate alone is blamed.) 
     - If yes: Then for causal selection, only that one is selected, and the structure is INUS. Then stop.
     - If no: Then all are selected as causes. Then stop.

  9. Does the passage name as a cause something that did not happen (an omission, absence, or failure to act)? (Inspired by Case D: the watchman's sleep is blamed.)
     - If yes: Go to 11.
     - If no: Go to 12.

  10. Is the factor selected as *the* cause because it is earlier, more fundamental, or sets the stage for the others? (Inspired by Case E: the petition is named even though it changed nothing.)
      - If yes: Then code the causal structure as per the context (e.g., overdetermination or other) and the selection as "frame-setting" (if it set the stage without making a difference). Then stop.
      - If no: Then the selection may be arbitrary; record it as such. Then stop.

  11. Does the passage treat the omission as making a difference? (That is, if the omitted action had occurred, would the outcome have been different? Inspired by Case D: had the watchman been awake, he would have shut the gate and prevented the breach.)
      - If yes: Then the causal structure includes omissions as causes (difference-making), and the factor is selected. Then stop.
      - If no: Then the omission is being named as a cause without making a difference. Go to 10 to see if it is frame-setting.

  12. We have ruled out overdetermination, INUS conditions, and omissions. Now, does the passage name a factor that, by the counterfactual test (if it had been absent, the outcome would not have occurred), made no difference? (Inspired by Case E: the petition made no difference because the engineer had already refused repairs.)
      - If yes: Then go to 10 (to check if frame-setting).
      - If no: Then the factor is a difference-maker. Record causal structure as "difference-making" and the factor as selected. Then stop.

  Note: We have 8 nodes. We can adjust if needed.

  Leaves (7 named positions):

  1. Strict Interventionist Difference-Making: Causes must be difference-makers under hypothetical intervention. Most awkward commitment: It cannot handle cases of symmetric overdetermination (like Case A) without denying one is a cause or redescribing the outcome. Pressed by Case A (if we don't redescription) or Case E (petition not a cause).

  2. INUS Condition View: A cause is an insufficient but non-redundant part of an unnecessary but sufficient condition. Most awkward commitment: It allows that a factor (like the open gate in Case C) can be a cause even if it was only one part of a set that was not the only way the breach could have happened. Pressed by Case C.

  3. Fine-Grained Dissolution of Overdetermination: Apparent symmetric overdetermination (like Case A) is dissolved by describing the outcome more finely (as in Case F). Most awkward commitment: It requires that a genuinely finer description is available (not gerrymandered) and that the causes are not simultaneous. Pressed by Case F.

  4. Contrastivist View: Causal selection is interest-relative; we pick one cause against a contrast class. Most awkward commitment: Without a specified contrast, causal claims are incomplete. Pressed by Case C (blaming the gate alone might imply a contrast with other gates or with the gate being closed) or Case D (the watchman's sleep might be contrasted with his being awake).

  5. Production/Process View: Retains causes where counterfactual tests fail, by emphasizing physical processes. Most awkward commitment: It can treat absences (like the watchman's sleep) as causally inert because they lack physical process. Pressed by Case D (if it denies the sleep is a cause).

  6. Omission Denial: Treats omissions such as the watchman's sleep as causally inert. Most awkward commitment: It must explain why we blame the watchman if his sleep didn't cause the breach. Pressed by Case D.

  7. Narrativist/Anti-Realist View: Causal selection in history is driven by narrative purposes, not by objective differences. Most awkward commitment: It allows factors that made no difference (like the petition in Case E) to be named as causes. Pressed by Case E.

  Output Fields and Disagreement Resolution:

  - The tree returns two fields: (1) the causal structure, and (2) the selected cause(s).
  - If two coders disagree, they should compare their answers at each node to see where they diverged. If the divergence is at a node about the description of the outcome (e.g., node 1 or 2) or about the contrast class (implicit in the selection), then it is a verbal dispute (same causal structure but different framing). Otherwise, it is substantive.
  - To code a factor as "frame-setting": It must be explicitly presented in the passage as setting the context (e.g., defining the options, constraints, or background) without making a difference to the outcome. It is not a cause, but it is named in a causal context. To avoid wastebasket use, only code it if the passage clearly frames it this way and it fails the difference-making test (as in Case E).

  Gaps and Collisions:

  1. Gap: A view that accepts omissions as causes without requiring difference-making. (E.g., the watchman's sleep is a cause even if, had he been awake, he might not have shut the gate.) This seems incoherent because if the omission doesn't make a difference, why call it a cause? But it might be unattractive.

  2. Gap: A view that combines production (physical process) with symmetric overdetermination without dissolution. (E.g., both charges in Case A are causes by physical process.) The problem: in physical process, how can two independent processes both cause the same event without interacting? It might be unexplored.

  3. Gap: A view that is both strict difference-making and contrastivist, but then must deny that any factor that isn't a difference-maker (like the petition in Case E) can be selected even as a contrast. This might be coherent but unattractive because it cannot account for historical narratives that name such factors.

  Collision: The tree might not separate the Narrativist view and the Frame-setting code. If a passage names the petition (Case E) as a cause, the Narrativist view would say it's a valid cause because of narrative role, while the Frame-setting code says it's not a cause but sets the frame. We need a further question: "Does the passage present the factor as having a direct role in bringing about the outcome (even if false) or only as setting the stage?" If direct role, then Narrativist; if stage-setting, then Frame-setting.

  Further question for collision: "Does the passage claim that the factor (e.g., the petition) had an effect on the outcome, or does it only say the factor set the conditions without affecting the outcome?" If it claims an effect, then Narrativist (even if false); if not, then Frame-setting.

  This should resolve the collision.

  Now, let's write the manual in the required format.
answer: |-
  ### Causal Annotation Manual: Preamble  
  This manual helps analyze how historical passages attribute causes for the 1902 dam breach. You will answer questions about the **causal structure** (how causes relate to the outcome) and **causal selection** (which factor is labeled *the* cause). Base answers solely on the text and case files—no philosophy knowledge is needed. Disagreements between coders may be:  
  - **Verbal disputes**: Differing descriptions of the outcome or contrast classes (e.g., "breach at 04:12" vs. "breach that flooded District X").  
  - **Substantive disputes**: Differing views on what counts as a cause.  
  If a factor (e.g., a petition) is named but **made no difference** to the outcome, you may code it as "frame-setting" *only* if the passage explicitly presents it as setting context (e.g., defining options or stakes). Avoid overusing this code; it requires clear textual evidence.  

  ---

  ### Decision Tree Nodes  
  Answer questions sequentially using case files.  

  1. **Does the passage describe the outcome (breach/flood) with fine-grained details of time, location, or manner?**  
     - *Yes*: Go to 2 (e.g., Case F: charges fired at distinct times).  
     - *No*: Go to 3 (e.g., Cases A, B: breach described generally).  

  2. **Could the fine-grained outcome (from Node 1) have occurred with only ONE factor?**  
     - *Yes*: Causal structure = "single cause." Select the named factor as *the* cause. Stop.  
     - *No*: Go to 5 (e.g., Case F: both charges needed for the full breach).  

  3. **Does the passage treat ≥2 factors as EACH independently sufficient to cause the outcome?**  
     - *Yes*: Go to 5 (e.g., Case A: both charges could breach the dam alone).  
     - *No*: Go to 4 (e.g., Cases C, D: factors depend on each other).  

  4. **Is a set of factors described as jointly sufficient, with each necessary given the others?**  
     - *Yes*: Causal structure = "INUS condition." Go to 6.  
     - *No*: Go to 7 (e.g., Case E: petition made no difference).  

  5. **Does the passage select ONLY ONE factor as *the* cause despite multiple sufficient causes?**  
     - *Yes*: Go to 8 (e.g., Case B: backup charge named though unused).  
     - *No*: Causal structure = "symmetric overdetermination." Select all named factors as causes. Stop.  

  6. **Does the passage select ONLY ONE factor from the INUS set as *the* cause?**  
     - *Yes*: Select that factor. Stop (e.g., Case C: gate blamed alone).  
     - *No*: Select all INUS factors. Stop.  

  7. **Is the named cause an omission/absence (e.g., sleep, inaction)?**  
     - *Yes*: Go to 9 (e.g., Case D: watchman’s sleep).  
     - *No*: Go to 10 (e.g., Case E: petition).  

  8. **Is the selected factor labeled a cause because it guaranteed the outcome?**  
     - *Yes*: Causal structure = "asymmetric overdetermination." Select the factor. Stop (e.g., Case B).  
     - *No*: The selection is arbitrary. Record the factor. Stop.  

  9. **Does the passage imply the outcome depended on the omission?**  
     - *Yes*: Causal structure = "omission as difference-maker." Select the omission. Stop.  
     - *No*: Code the omission as "frame-setting" if it sets context. Stop (e.g., if Case D omitted the watchman’s intervention counterfactual).  

  10. **Is the factor presented as setting context without changing the outcome?**  
      - *Yes*: Code as "frame-setting." Stop (e.g., Case E: petition fixed options).  
      - *No*: Causal structure = "difference-making." Select the factor. Stop.  

  ---

  ### Leaf Positions (Causal Views)  
  Each leaf is defined by its most awkward commitment and the case that challenges it.  

  1. **Strict Difference-Making**: Causes must change outcomes under hypothetical interventions.  
     - *Awkward commitment*: Cannot treat backup guarantees (Case B) or overdetermined factors (Case A) as causes.  
     - *Pressed by*: Case B (backup charge) or Case E (petition).  

  2. **INUS Condition View**: A cause is an insufficient but non-redundant part of a sufficient condition.  
     - *Awkward commitment*: Accepts factors that are non-redundant but not difference-makers (e.g., the gate in Case C).  
     - *Pressed by*: Case C (gate blamed alone).  

  3. **Fine-Grained Dissolution**: Apparent overdetermination dissolves under finer outcome descriptions.  
     - *Awkward commitment*: Requires outcomes to be divisible (e.g., Case F’s two charges caused separate breach stages).  
     - *Pressed by*: Case F (charges at different times).  

  4. **Contrastivist View**: Causes are selected relative to implicit contrasts (e.g., "gate left open" vs. "gate closed").  
     - *Awkward commitment*: Selection is arbitrary without a stated contrast (e.g., Case C’s gate alone).  
     - *Pressed by*: Case C or Case D (watchman’s sleep).  

  5. **Production View**: Causes require physical processes; omissions aren’t causes.  
     - *Awkward commitment*: Denies causal power to absences (e.g., watchman’s sleep in Case D).  
     - *Pressed by*: Case D.  

  6. **Omission Denial**: Omissions are causally inert.  
     - *Awkward commitment*: Must explain why we blame agents for inaction (e.g., Case D’s watchman).  
     - *Pressed by*: Case D.  

  7. **Narrativist View**: Selection reflects narrative goals, not objective differences.  
     - *Awkward commitment*: Allows non-difference-makers as causes (e.g., Case E’s petition).  
     - *Pressed by*: Case E.  

  ---

  ### Resolving Inter-Coder Disagreement  
  1. **Identify divergence point**: Compare answers at each node to locate the first disagreement.  
  2. **Classify the dispute**:  
     - **Verbal**: Disagreement at Node 1 (outcome grain) or implicit contrasts (e.g., Node 6’s selection). Coders share causal logic but describe events differently.  
     - **Substantive**: Disagreement elsewhere (e.g., Node 9 on omissions). Coders hold different causal views.  
  3. **Frame-setting caution**: Only use if the passage explicitly states the factor sets context *without* affecting the outcome (e.g., Case E’s petition defining stakes). Reject if the passage implies impact.  

  ---

  ### Gaps and Collisions  
  **Gaps (unoccupied logical cells)**:  
  1. *Non-difference-making omissions*: Treating omissions as causes even if they change nothing (e.g., sleep in Case D without counterfactual dependence). **Diagnosis**: Incoherent—blames agents without causal basis.  
  2. *Coarse-grained overdetermination*: Accepting symmetric overdetermination (Case A) while denying fine-grained dissolution (Node 2). **Diagnosis**: Unexplored—conflicts with physical causation.  
  3. *Context-free narrativism*: Claiming narrative drives selection while denying frame-setting. **Diagnosis**: Unattractive—ignores how context shapes narratives.  

  **Collision (indistinguishable leaves)**:  
  - **Production View vs. Omission Denial**: Both deny causal power to omissions (Case D).  
  - **Resolution**: Add: *"Does the passage emphasize physical transfers (e.g., water, debris)?"*  
    - Production: Yes (physical processes required).  
    - Omission Denial: No (focuses on absences alone).  

  ---  
  *End of Manual*
