     - (c) If the action is successful (e.g., the nacre turns out to be valuable too), it is coincidental; the error does not generally guide successful action.

  3. **satkhyāti** (Bhaṭṭa Mīmāṃsā)
     - Most awkward commitment: The silver is real (as a memory) but is presented as present, which conflates memory with perception.
     - (a) The episode is a memory (which is a pramāṇa for the past) but misapplied to the present, so it is not a pramāṇa for the present object.
     - (b) Validity is intrinsic for the memory part, but extrinsic for the application. The school holds intrinsic validity (svataḥ prāmāṇya) for cognitions.
     - (c) If the action is successful, it is because the memory content (silver) is real, but the success is accidental because the present object is not silver.

  4. **ātmakhyāti** (Yogācāra Buddhism)
     - Most awkward commitment: The silver is a mental projection, so there is no external object, which challenges the reality of the external world.
     - (a) The episode is a form of perception (but of mental content), and it is not a pramāṇa for an external object.
     - (b) Validity is ascertained by coherence with other mental events. The theory of error (mind-only) implies that all cognitions are mental, so validity is mental too.
     - (c) If the action is successful (e.g., picking up the nacre), it is because the mental projection aligns with external conditions (which are also mental).

  5. **anirvacanīyakhyāti** (Advaita Vedānta)
     - Most awkward commitment: The silver is neither real nor unreal, which is a category that may seem ad hoc.
     - (a) The episode is an error (not a pramāṇa) and is sublated by later knowledge.
     - (b) Validity is extrinsic for empirical cognitions, but ultimately only Brahman is real. The theory of error supports this by showing the world's indeterminability.
     - (c) If the action is successful, it is due to the practical reality (vyāvahārika) of the object, even though the object is not ultimately real.

  6. **viparītakhyāti** (Sāṃkhya)
     - Most awkward commitment: The snake is a positive unreal entity, which is a contradiction (how can something be both positive and unreal?).
     - (a) The episode is a perceptual error, not a pramāṇa.
     - (b) Validity is intrinsic for successful cognitions. The theory of error does not force this, but Sāṃkhya holds intrinsic validity.
     - (c) If the action is successful (e.g., avoiding a rope thinking it's a snake), it is because the error has practical effects, but it is still an error.

  7. **asatkhyāti** (Buddhism, e.g., Madhyamika)
     - Most awkward commitment: The silver is completely nonexistent, but it appears, which raises the question of how nothing can be an object of cognition.
     - (a) The episode is a cognition of a nonexistent object, so it is not a pramāṇa.
     - (b) Validity is ascertained by its causal efficacy. The theory of error (nonexistence) is consistent with the general view of emptiness.
     - (c) If the action is successful, it is because the cognition, though erroneous, has causal power in the dependent arising of experience.

  Now, flag pairs that the tree doesn't separate:

  - **viparītakhyāti and asatkhyāti**: The tree separates them by the rope-snake case and the question of whether the snake is a positive unreal entity or simply nonexistent. But this distinction is not grounded in a clear case difference. It is more doctrinal. We might say that for viparītakhyāti, the error is a positive mental projection, while for asatkhyāti, it is a mere absence. But in practice, the cases (nacre-silver, rope-snake) are treated similarly. So the residue is metaphysical.

  - **anyathākhyāti and anirvacanīyakhyāti**: The tree separates them by the reality of the silver. But can we prise them apart by cases? Consider the dream case: in anyathākhyāti, the dream fire is not real fire (it might be a memory), but in anirvacanīyakhyāti, it is indeterminable. But the dream case is not used in the tree. We can add a note that in the dream case, anyathākhyāti might say the fire is real elsewhere (but not in the kitchen) or a memory, while anirvacanīyakhyāti says it is indeterminable. But the tree doesn't use the dream case. Alternatively, the nacre case: in anyathākhyāti, the silver is real elsewhere; in anirvacanīyakhyāti, it is indeterminable. The subject cannot tell the difference by the experience. So the difference is ontological, not case-based.

  - **Bhaṭṭa (satkhyāti) and Nyāya (anyathākhyāti)**: The tree separates them by location: in satkhyāti, the silver is in the past (memory); in anyathākhyāti, it is elsewhere in the world. But consider the case of the subject who has never encountered silver: for Nyāya, if the subject has never seen silver, she cannot have the memory, so the error cannot occur. Similarly for Bhaṭṭa. But if the subject has seen silver, then the cases are the same: she sees silver that is not present. The difference is in the explanation: memory vs. perception of a displaced real. But the experience is the same. So the tree separates by theory, and the case of never-encountered-silver might challenge both, but we assume the subject has seen silver. The residue is theoretical (memory vs. displaced perception).

  Finally, the additional case to separate two leaves: We need to separate anyathākhyāti and satkhyāti. They are separated by Q3 (location: elsewhere vs. past). But is there a case that forces one and not the other? Consider the case of the virtual mug in the head-mounted display. The user says the mug was "right there". In anyathākhyāti, the mug is real elsewhere (in a virtual world?) but not in the physical space. In satkhyāti, it is a memory of a mug. But the user has not necessarily seen that exact mug before. So it might be a new mug. This case might fit anyathākhyāti better (as a displaced real) than satkhyāti (which relies on memory of a past mug).

  But we can use the case of the two moons. In satkhyāti, the second moon would be a memory of the moon, but the subject is seeing the moon now, so why a memory? It doesn't fit. In anyathākhyāti, the second moon is the real moon displaced. So for the two-moons case, anyathākhyāti might work, but satkhyāti does not. Therefore, we can use the two-moons case to distinguish: if the theory requires memory, then the two-moons case (which is perceptual and not memory-based) cannot be explained by satkhyāti. So we can add a question after Q3 for the real branch: 

     - Consider the two-moons case (diplopia): is the second moon a memory or a displaced real moon?
        - Memory -> satkhyāti
        - Displaced real -> anyathākhyāti
        - Mental projection -> ātmakhyāti

  But then we have to change the tree. Given time, we'll adjust.

  But to keep the tree as is, we'll note that the two-moons case is not handled well by satkhyāti, while anyathākhyāti can account for it by displacement.

  Similarly, for the never-encountered-silver case, satkhyāti and anyathākhyāti both fail if memory is required, but akhyāti also fails. So it might lead to a new leaf? But no classical theory handles it well. We'll say it is a challenge to all memory-based theories.

  For the handout, we'll provide the tree as above and then a memo on cases that don't discriminate.

  **Memo on Cases that Do Not Discriminate**

  - The white conch seen as yellow: This case is similar to the nacre-silver and can be handled by most theories. It doesn't add new discriminatory power.
  - The two moons: This case is a problem for satkhyāti (if it requires memory) and might be better handled by anyathākhyāti or ātmakhyāti, but it is not used in the tree.
  - Never encountered silver: This case challenges any theory that requires memory (anyathākhyāti, satkhyāti, akhyāti). It might be handled by asatkhyāti or anirvacanīyakhyāti as an error without memory, but the classical theories do not address it.
  - Dust cloud for smoke: This is an inferential error. The tree is designed for perceptual errors, so it doesn't discriminate among the theories for perception.
  - Faulty thermometer: Also inferential error, same as above.
  - Dream of fire: This case is handled by all theories, but especially by ātmakhyāti and anirvacanīyakhyāti. It doesn't discriminate well among the others.
  - Virtual mug: This modern case is similar to the dream and might be handled by ātmakhyāti.

