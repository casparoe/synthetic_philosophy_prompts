  Key axes (regrouped for clarity and to cover the requirements):

  1. **Nature of the erroneous cognition:**
     - Is it a single unified cognition or two cognitions (e.g., perception and memory) that are confused?
     - This addresses whether the error is a failure of discrimination or a single presentation.

  2. **Status of the object that appears (the content of the error):**
     - Is the object (as it appears) existent (sat), nonexistent (asat), or neither (anirvacanīya)?
     - This is central to many theories.

  3. **Location of the apparent object:**
     - Is the object located where it appears to be, elsewhere, or nowhere?
     - This helps distinguish theories about the locus of the error.

  4. **Internality vs. externality:**
     - Is the apparent object inside the mind or outside it?
     - This relates to idealism vs. realism.

  5. **Locus of failure:**
     - Does the failure lie in the presentation (the object) or in the subject's discrimination?
     - This distinguishes theories that blame the object from those that blame the subject.

  6. **Type of cognition:**
     - Is the erroneous episode perceptual, memorial, inferential, or a hybrid?
     - Some theories are specific to perception.

  7. **Explanation of cancellation:**
     - How is the error later corrected? By a new cognition that reveals the true object, by the absence of the expected object, etc.

  We'll design 6-8 questions that cover these axes. We'll use the cases provided to illustrate the questions.

  The named theories and their typical attributions (with hedging where unsure):

  1. **anyathākhyāti** (Nyāya): Error is misassignment of a real property (e.g., silver) to a real substance (nacre) that does not possess it. The silver is real but located elsewhere.
  2. **akhyāti** (Prābhākara Mīmāṃsā): Error is non-apprehension of the difference between two real things (e.g., nacre and silver) that are presented. There is no positive error, only a failure to distinguish.
  3. **viparītakhyāti** (Sāṃkhya): Error is the opposite of reality (e.g., seeing a rope as a snake). The snake is unreal, but the cognition is a positive error.
  4. **asatkhyāti** (Mādhyamika Buddhism? or Advaita?): The object of error is nonexistent (asat). E.g., the silver in the nacre is completely unreal.
