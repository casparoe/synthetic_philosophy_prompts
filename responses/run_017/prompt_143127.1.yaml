  **Handout: Diagnostic Tool for Theories of Error**

  Start with the nacre-silver case: On a beach, a subject sees a piece of nacre (a shiny shell) and mistakes it for silver. The subject has seen silver before.

  1. **Is the erroneous cognition primarily a failure to distinguish between the present nacre and the remembered silver? Or is it the presentation of silver itself, which is not there?**
     - Failure to distinguish between two things (nacre and silver) -> **akhyāti** (Prābhākara Mīmāṃsā)
     - Presentation of silver itself -> go to 2

  2. **Is the silver that appears in the cognition real (sat)?**
     - Yes, real -> go to 3
     - No, unreal (asat) -> go to 4
     - Neither real nor unreal (anirvacanīya) -> **anirvacanīyakhyāti** (Advaita Vedānta)

  3. **Where is the real silver located?**
     - Elsewhere in the world (not here) -> **anyathākhyāti** (Nyāya)
     - In the past (as a memory) -> **satkhyāti** (Bhaṭṭa Mīmāṃsā)
     - In the mind (as a mental projection) -> **ātmakhyāti** (Yogācāra Buddhism)

  4. **In the rope-snake case (at dusk, a rope is mistaken for a snake), when the subject sees the snake, what is the status of the snake?**
     - The snake is a positive but unreal entity -> **viparītakhyāti** (Sāṃkhya)
     - The snake is simply nonexistent -> **asatkhyāti** (Buddhism, e.g., Madhyamika)

  **Leaves:**

  1. **akhyāti** (Prābhākara Mīmāṃsā)  
     - *Awkward commitment*: Error is not a positive false appearance but a failure to notice the difference between two real things.  
     - (a) Not a single episode of pramāṇa (knowledge); it is a combination of a perception (of nacre) and a memory (of silver) that is not discriminated.  
     - (b) Validity of knowledge is intrinsic (svataḥ prāmāṇya).  
     - (c) Successful action (e.g., picking up the nacre) is coincidental; the cognition does not represent the object's true nature.

  2. **anyathākhyāti** (Nyāya)  
     - *Awkward commitment*: The silver is real but located elsewhere, yet it is perceived here.  
     - (a) A perceptual episode but not a pramāṇa (because it is erroneous).  
     - (b) Validity is extrinsic (parataḥ prāmāṇya).  
     - (c) Successful action (e.g., the nacre is valuable) is accidental.

  3. **satkhyāti** (Bhaṭṭa Mīmāṃsā)  
     - *Awkward commitment*: The silver is real but as a memory, yet it is experienced as present.  
     - (a) The episode is a memory (pramāṇa for the past) misapplied to the present, so not a pramāṇa for the present.  
     - (b) Validity is intrinsic for the memory component.  
     - (c) Successful action is due to the reality of the remembered silver, but it is accidental in the present context.

  4. **ātmakhyāti** (Yogācāra Buddhism)  
     - *Awkward commitment*: The silver is a mental projection; there is no external object.  
     - (a) A mental perception but not a pramāṇa for an external object.  
     - (b) Validity is coherence within mental experience.  
     - (c) Successful action (e.g., picking up the nacre) is because the mental projection aligns with other mental factors.

  5. **anirvacanīyakhyāti** (Advaita Vedānta)  
     - *Awkward commitment*: The silver is neither real nor unreal, a category that is ontologically indeterminate.  
     - (a) Not a pramāṇa; it is sublated by later knowledge.  
     - (b) Validity of empirical cognitions is extrinsic; only Brahman is ultimately real.  
     - (c) Successful action is due to the practical reality of the object in the empirical world.

  6. **viparītakhyāti** (Sāṃkhya)  
     - *Awkward commitment*: The snake is a positive but unreal entity.  
     - (a) A perceptual error, not a pramāṇa.  
     - (b) Validity is intrinsic for true cognitions.  
     - (c) Successful action (e.g., avoiding the rope) is due to the practical effects of the error.

  7. **asatkhyāti** (Buddhism, e.g., Madhyamika)  
     - *Awkward commitment*: The silver is nonexistent, yet it appears.  
     - (a) Not a pramāṇa; it is a cognition of the nonexistent.  
     - (b) Validity is determined by causal efficacy, but everything is empty.  
     - (c) Successful action is due to the causal power of the cognition in dependent arising.

  **Flagged Pairs:**

  - **viparītakhyāti and asatkhyāti**: The tree separates them by the rope-snake case and the status of the snake (positive unreal vs. nonexistent). This distinction is metaphysical; no case clearly exposes it.

  - **anyathākhyāti and satkhyāti**: Separated by the location of the silver (elsewhere vs. past). Cases like the two moons (which don't involve memory) challenge satkhyāti but not anyathākhyāti. The residue is theoretical.

  - **anyathākhyāti and anirvacanīyakhyāti**: Separated by the reality of the silver. The difference is ontological; the case experience is the same.

  **Memo on Cases with Little Discriminatory Power:**

  - White conch seen as yellow: Handled similarly by most theories.
  - Two moons: Challenges satkhyāti (if memory-based) but not others; underused in the tree.
  - Never encountered silver: Challenges memory-based theories (akhyāti, anyathākhyāti, satkhyāti).
  - Dust cloud for smoke and faulty thermometer: Inferential errors, not covered by this tree for perceptual errors.
  - Dream of fire and virtual mug: Support ātmakhyāti but are handled by other theories with adjustments.

