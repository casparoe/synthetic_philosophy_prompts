  6. **anirvacanīyakhyāti** (Advaita Vedānta): The object of error is indeterminable (neither real nor unreal). E.g., the silver is neither real (like the nacre) nor unreal (like a square circle).
  7. **satkhyāti** (Bhaṭṭa Mīmāṃsā? or Jainism?): The object of error is real. E.g., the silver is real but it is in the past (memory) and mislocated.

