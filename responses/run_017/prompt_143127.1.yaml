  ### Diagnostic Handout: Theories of Error in Nyāya Epistemology  
  *Designed to classify views via case judgments, not theoretical labels. Answer the questions below using concrete cases. Begin with the nacre-silver case: a subject sees nacre (mother-of-pearl) in bright light and mistakes it for silver. She has encountered silver before.*

  ---

  #### **Decision Tree**  
  *Follow the branches by answering questions about cases. Each leaf names a classical theory, its school, and key commitments.*

  1. **In the nacre-silver case, when the subject reaches for the silver, is she reaching for one unified object or two distinct things?**  
     - **One unified object** (e.g., "silver right here") → Go to 2  
     - **Two distinct things** (e.g., "this nacre and remembered silver, confused") → **akhyāti** (Prābhākara Mīmāṃsā)  

  2. **In the rope-snake case (rope mistaken for a snake at dusk), does the snake appear to exist independently of the subject’s mind?**  
     - **Yes** (snake seems "out there," not just in the mind) → Go to 3  
     - **No** (snake is purely mental, like a dream) → **ātmakhyāti** (Yogācāra Buddhism)  

  3. **In the nacre-silver case, is the silver that appears real (sat), unreal (asat), or neither?**  
     - **Real** (silver exists) → Go to 4  
     - **Unreal** (silver is utterly nonexistent) → **asatkhyāti** (Mādhyamika Buddhism)  
     - **Neither real nor unreal** (silver is indeterminable) → **anirvacanīyakhyāti** (Advaita Vedānta)  

  4. **In the white-conch-seen-as-yellow case (conch appears yellow to a jaundiced subject), is the yellow located where the conch is, or elsewhere?**  
     - **Where the conch is** (yellow is "on" the conch) → **satkhyāti** (Bhaṭṭa Mīmāṃsā)  
     - **Elsewhere** (yellow is real but not here) → **anyathākhyāti** (Nyāya)  
     - **Nowhere** (yellow has no location) → **viparītakhyāti** (Sāṃkhya)  

  ---

  #### **Theories at Leaves**  
  *Each theory includes: (1) School attribution (hedged if uncertain); (2) Most awkward commitment; (3) Status as *pramāṇa* (valid knowledge source); (4) Basis for validity of *successful* cognition; (5) Handling of action from error (e.g., grabbing nacre "as silver," but nacre is valuable).*

  1. **akhyāti** (non-apprehension)  
     - **School**: Prābhākara Mīmāṃsā.  
     - **Awkward commitment**: Error is *only* a failure to distinguish two real things—never a positive false object.  
     - (a) **Not a single episode**: Two cognitions (perception of nacre + memory of silver) that the subject conflates.  
     - (b) **Validity basis**: Intrinsic (*svataḥ prāmāṇya*). Error theory implies successful cognition requires discrimination, but validity is self-certifying.  
     - (c) **Successful action**: Accidental (e.g., grabbing nacre "as silver" succeeds because nacre is valuable, but the cognition misrepresents).  

  2. **ātmakhyāti** (apprehension as self/mental)  
     - **School**: Yogācāra Buddhism (likely).  
     - **Awkward commitment**: All objects are mental—even "external" things like silver are mind-projected.  
     - (a) **Not a *pramāṇa***: Erroneous episode is perceptual but only of internal content, so not valid for external reality.  
     - (b) **Validity basis**: Coherence of mental events. Error theory forces this, as "external" validity is incoherent.  
     - (c) **Successful action**: Possible (e.g., grabbing nacre) because mental content aligns with causal patterns, but no external object is involved.  

  3. **asatkhyāti** (apprehension as nonexistent)  
     - **School**: Mādhyamika Buddhism (likely, but debated).  
     - **Awkward commitment**: Nonexistent things (e.g., silver) appear vividly—but how can nothing be cognized?  
     - (a) **Not a *pramāṇa***: A cognition produced by a *pramāṇa* (e.g., perception) that fails due to content being unreal.  
     - (b) **Validity basis**: Extrinsic (*parataḥ prāmāṇya*). Error theory fits, as cognition must be verified (e.g., silver’s absence negates it).  
     - (c) **Successful action**: Coincidental (e.g., grabbing nacre) since the object (silver) is unreal; action succeeds despite error.  

  4. **anirvacanīyakhyāti** (apprehension as indeterminable)  
     - **School**: Advaita Vedānta.  
     - **Awkward commitment**: Objects of error are *neither real nor unreal*—a category outside ordinary logic.  
     - (a) **Not a *pramāṇa***: An episode from a *pramāṇa* (perception) that fails due to indeterminable content.  
     - (b) **Validity basis**: Extrinsic. Error theory forces this, as successful cognition requires sublating (*bādha*) error.  
     - (c) **Successful action**: Explained by practical reality (*vyāvahārika*); even "indeterminable" silver guides action provisionally.  

  5. **satkhyāti** (apprehension as existent)  
     - **School**: Bhaṭṭa Mīmāṃsā.  
     - **Awkward commitment**: The silver is real but *past* (memory), yet appears present—how can memory be perceptible?  
     - (a) **Not a *pramāṇa***: A hybrid episode (perception + memory) misapplied to the present.  
     - (b) **Validity basis**: Intrinsic for the memory aspect. Error theory implies this, as memory is intrinsically valid.  
     - (c) **Successful action**: Due to the real element (silver exists, just not here); action "tracks" reality indirectly.  

  6. **anyathākhyāti** (apprehension as elsewhere)  
     - **School**: Nyāya.  
     - **Awkward commitment**: Real silver exists *elsewhere*, but is perceived here—how can perception "relocate" objects?  
     - (a) **Not a *pramāṇa***: A perceptual episode that fails due to misassignment of properties.  
     - (b) **Validity basis**: Extrinsic. Error theory forces this, as correction (e.g., seeing nacre) is external.  
     - (c) **Successful action**: Accidental (e.g., nacre is valuable); the error (silver here) doesn’t guide action reliably.  

  7. **viparītakhyāti** (apprehension as contrary)  
     - **School**: Sāṃkhya.  
     - **Awkward commitment**: The snake is a *positive unreal* entity—a contradiction for realists.  
     - (a) **Not a *pramāṇa***: A perceptual episode distorted by defects (e.g., dim light).  
     - (b) **Validity basis**: Intrinsic. Error theory doesn’t force this, but Sāṃkhya holds validity is self-revealing.  
     - (c) **Successful action**: Defensive action (e.g., avoiding a "snake") works because error mimics reality.  

  ---

  #### **Case Usage and Discrimination**  
  *Cases used in the tree:*  
  - **Nacre-silver** (Q1, Q3): Tests object unity and reality.  
  - **Rope-snake** (Q2): Tests mind-independence.  
  - **White conch as yellow** (Q4): Tests location of properties.  
  - **Two moons** (not used): Fails to discriminate—all theories treat it like rope-snake.  
  - **Never-encountered-silver** (not used): Fails to discriminate—no classical theory allows it (all require memory).  
  - **Dust cloud as smoke** (not used): Inferential error, so irrelevant to perceptual theories here.  
  - **Dream fire** (not used): Supports ātmakhyāti but handled similarly by anirvacanīyakhyāti.  
  - **Virtual mug** (not used): Like dream fire; no new discrimination.  
  - **Faulty thermometer** (not used): Inferential error, not perceptual.  

  *Added case to separate anyathākhyāti and satkhyāti:*  
  - **Case**: A crystal seen as red due to a hidden flower behind it.  
    - **Discriminates**: In satkhyāti, the red is real (flower’s color) but *past* (memory); in anyathākhyāti, the red is real but *elsewhere* (flower’s location).  
    - **Why needed**: Without this, Q4 distinguishes them via location, but the "past" vs. "elsewhere" difference is theoretical. This case forces a choice about temporal vs. spatial mislocation.  

  #### **Indistinguishable Pairs**  
  - **anyathākhyāti (Nyāya) vs. anirvacanīyakhyāti (Advaita)**:  
    - **Difference**: Ontological (real elsewhere vs. indeterminable).  
    - **Case adjudication?**: No case exposes this—e.g., in nacre-silver, both agree silver isn’t "here," but disagree on *why*. This is metaphysical, not experiential.  

  - **anyathākhyāti (Nyāya) vs. satkhyāti (Bhaṭṭa)**:  
    - **Difference**: Satkhyāti requires memory; anyathākhyāti does not.  
    - **Case adjudication**: The "crystal and flower" case distinguishes them. Without it, the residue is verbal (e.g., "elsewhere" vs. "past").  

  - **viparītakhyāti (Sāṃkhya) vs. asatkhyāti (Buddhism)**:  
    - **Difference**: viparītakhyāti’s "positive unreal" vs. asatkhyāti’s "nonexistent."  
    - **Case adjudication?**: No case exposes this—e.g., in rope-snake, both agree the snake isn’t real. This is a doctrinal split.  

  - **Bhāṭṭa (satkhyāti) vs. Nyāya (anyathākhyāti)**:  
    - **Separable?**: Yes, via the "crystal and flower" case. No extra commitment needed.  

  ---

  *Handout ends. Use your case judgments to navigate the tree. Focus on concrete descriptions (e.g., "silver seems here," "snake feels external").*
