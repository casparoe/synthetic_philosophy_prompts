  Key proposal: Train with exogenous interruptions (fixed timer) and use shadow rollouts (off-policy estimate of return for interrupted episodes) to make the event uninformative and avoid gradients toward/away from shutdown.

  Costs: Wasted episodes, and the shadow-rollout estimator is a learned model that could be influenced.

