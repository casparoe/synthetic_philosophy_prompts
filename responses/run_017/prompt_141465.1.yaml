  ### Decision Procedure for Bongard-Style Task Review  
  **Goal**: Ensure the 12 panels uniquely determine the intended rule by eliminating plausible competitor rules. The procedure focuses on *distinguishability* (via minimal pairs), *complementarity*, *non-correlation* with low-level features, and *absence of thresholds*. Annotators with basic visual reasoning skills can execute this in ≤20 min. Edits must be SVG-drawable; rejections require your sign-off.

  ---

  #### **Procedure Steps**  
  1. **Verify Rule Correctness & Complementarity**  
     - **Question**: Does the intended rule correctly classify all 12 panels? Are A and B rules complementary (mutually exclusive and exhaustive)?  
     - **Sufficient Answer**:  
       - *Accept*: Rule fits all panels perfectly, A/B cover all cases.  
       - *Accept-with-edit*: Rule misclassifies ≤2 panels or A/B overlap/gaps exist (e.g., ambiguous panels). Edit panels/rule.  
       - *Reject*: Rule misclassifies >2 panels or irreparable A/B non-complementarity.  
     - **Stop if**: Reject or edit required.  
     - **Judgment Call?** No. Fact-based.  

  2. **Identify Plausible Competitor Rules**  
     - **Question**: Name ≥1 competitor rule that fits all 12 panels. Prioritize:  
       - Extensional (listing specific panels).  
       - Correlates (size, stroke width, pixel density, grid position).  
       - Numerical (e.g., parity, magnitude).  
       - Shape-based (e.g., "has circles" vs. "has triangles").  
     - **Sufficient Answer**:  
       - *Accept*: No competitors found beyond trivial/extensional.  
       - *Hand off to you*: Competitors exist but naturalness is debatable (e.g., "grue"-like rules).  
       - *Reject*: No competitors named (annotator error) or >2 intuitive competitors.  
     - **Stop if**: Reject or hand-off.  
     - **Judgment Call?** Partially. Naming competitors relies on annotator intuition but constrained to common correlates.  

  3. **Build Minimal Pairs for Each Competitor**  
     - **Question**: For each competitor, design two new SVG panels:  
       - Panel X: Intended rule → A, Competitor → B.  
       - Panel Y: Intended rule → B, Competitor → A.  
     - **Constraints**: Panels must be SVG-drawable, black/white shapes, and visually plausible (no degenerate shapes).  
     - **Sufficient Answer**:  
       - *Accept*: Minimal pairs exist for all competitors.  
       - *Reject*: Any competitor lacks a minimal pair (e.g., due to geometric impossibility).  
     - **Stop if**: Reject.  
     - **Judgment Call?** No. Feasibility of drawing panels is objective.  

  4. **Check for Low-Level Correlates**  
     - **Question**: Is the intended rule *simpler to state* as a correlate of size, stroke, color, pixel density, or grid position?  
     - **Sufficient Answer**:  
       - *Accept*: Intended rule is simpler (e.g., "symmetry" vs. "area > 100px²").  
       - *Accept-with-edit*: Correlate is simpler; edit panels to break correlation (e.g., add asymmetric shape with small area).  
       - *Reject*: Rule *is* a correlate (e.g., "panels in top grid row are A").  
     - **Stop if**: Reject or edit required.  
     - **Judgment Call?** Yes. "Simpler" assumes user community prefers abstract rules over correlates.  

  5. **Check for Thresholds**  
     - **Question**: Does the rule require vague thresholds (e.g., "large size") or tolerances?  
     - **Sufficient Answer**:  
       - *Accept*: No thresholds (e.g., "contains a triangle" is binary).  
       - *Accept-with-edit*: Threshold exists; specify exact value (e.g., "area > 150px²").  
       - *Reject*: Threshold is unavoidable and vague (e.g., "approximately symmetric").  
     - **Stop if**: Reject or edit required.  
     - **Judgment Call?** No. Threshold clarity is objective.  

  ---

  #### **Key Distinctions and Costs**  
  - **Kept**:  
    - **Distinguishability via minimal pairs**: Addresses underdetermination by forcing uniqueness.  
    - **Complementarity**: Prevents overlapping/gapped rules.  
    - **Anti-correlation**: Ensures rules aren’t proxies for low-level features.  
    - **Threshold rigor**: Avoids vague criteria.  
  - **Dropped**:  
    - **Natural kinds metaphysics**: Not needed; minimal pairs resolve arbitrariness.  
    - **Cost**: May accept "unnatural" rules if competitors are distinguishable (e.g., prime numbers).  
  - **Dressed-up Judgments**:  
    - Step 2 (naming competitors): Relies on annotator intuition for "plausible" rules.  
    - Step 4 ("simpler" rules): Assumes users prefer symmetry over area correlates.  
  - **Misfires**:  
    - False rejects: Annotator fails to name a competitor (e.g., misses a correlate).  
    - False accepts: Competitor is unnatural but minimal pairs exist (e.g., "grue" rules).  

  ---

  ### **Application to Your Tasks**  
  #### **Task 1**: Symmetric (A) vs. Asymmetric (B)  
  - **Step 1**: Rule fits; complementary. → *Accept*.  
  - **Step 2**: Competitor: "Even # of components (A) vs. odd (B)". → Hand-off? *No, intuitive competitor*.  
  - **Step 3**: Minimal pairs:  
    - Panel X (breaks even=𝐴): Single circle (symmetric/odd → intended 𝐴, competitor 𝐵).  
    - Panel Y (breaks odd=𝐵): Two asymmetric squares (asymmetric/even → intended 𝐵, competitor 𝐴).  
    → *Accept*.  
  - **Step 4**: Symmetry not simpler as correlate. → *Accept*.  
  - **Step 5**: No thresholds. → *Accept*.  
  - **Verdict**: ✅ **Accept**.  

  #### **Task 2**: Prime (A) vs. Composite (B) # of Components  
  - **Step 1**: Rule fits; complementary (no 1). → *Accept*.  
  - **Step 2**: Competitors: Extensional (list primes), "number < 8" (fails: 11,13∈𝐴; 9,10,12∈𝐵). → *Hand off to you* (no intuitive correlate).  
  - **Step 3**: Minimal pairs for extensional:  
    - Panel X: 17 components (prime → intended 𝐴, extensional → 𝐵).  
    - Panel Y: 15 components (composite → intended 𝐵, extensional → 𝐴).  
    → *Accept*.  
  - **Step 4**: Prime not simpler as correlate (e.g., area). → *Accept*.  
  - **Step 5**: No thresholds. → *Accept*.  
  - **Verdict**: 🤝 **Hand off to you** (competitor naturalness debatable; minimal pairs exist).  

  #### **Task 3**: Contains Triangle (A) vs. Contains Circle (B)  
  - **Step 1**: **Not complementary**. Panels with both (A and B) or neither exist. → *Accept-with-edit*.  
    - **Required Edit**: Redefine rules:  
      - 𝐴: Contains ≥1 triangle (may have circles).  
      - 𝐵: Contains ≥1 circle and *no triangles*.  
      - Add domain: "Panels must contain ≥1 triangle or circle."  
  - **Step 2**: Competitor: "Shapes with straight edges (A) vs. curved (B)" → *Reject* (fits if no mixed panels).  
  - **Step 3**: Minimal pairs impossible for competitor:  
    - A triangle with a curve (e.g., rounded vertex) → intended 𝐴, competitor 𝐵? Ambiguous.  
    - **Reject**: No clean minimal pair.  
  - **Step 4**: No correlate. → *Accept*.  
  - **Step 5**: No thresholds. → *Accept*.  
  - **Verdict**: ✏️ **Accept-with-required-edit** (fix complementarity + domain).  
    - **Shipped Tasks**: Pull the 5 shipped tasks if they lack the edit. Rebuild panels to ensure:  
      - No "both" or "neither" panels.  
      - Add explicit domain: "Panels contain ≥1 triangle or circle."  

  ---

  ### **Final Notes**  
  - **Why Task 3 is Fixable**: The edit resolves complementarity and domain issues. Minimal pairs fail due to competitor ambiguity, but the rule itself is salvageable.  
  - **Efficiency**: Annotators spend ~5 min/step. Steps 2–3 are bottlenecks; hand-offs reduce rejections.  
  - **Your Role**: Sign off on hand-offs (Step 2) and edits (Steps 1,4,5). Overrule rejects if minimal pairs are feasible.  

  This procedure enforces *uniqueness* without philosophy, using minimal pairs to crush competitors. The shipped Task 3 instances must be edited or pulled.
