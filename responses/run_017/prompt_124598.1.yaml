  The user is clearly highly technically literate - they mention CDT/EDT, understand expected utility notation, and reference decision theory concepts. But they explicitly want to avoid academic citations and focus on arguments. Their tone suggests intellectual honesty and frustration with hand-wavy defenses of the view.

  Let me structure this carefully. First need to explain why outsider critiques (like "magicking correlation") don't penetrate - that's about different axioms. Then for internal critiques, the similarity cliff is probably the sharpest challenge because it exposes the theory's dependence on vague boundaries. The unequal twins case shows symmetry doing heavy lifting. Anti-coordination reveals a hidden need for randomness. Population case risks collapsing into evidential reasoning. Empirical cases are indeed weak tests.

  Most damning might be the "reflective rejection" scenario - if after buying all premises, the prescribed action still feels irrational. That could happen in the unequal twins case if you're forced to disadvantage yourself. Also in anti-coordination where correlation prevents coordination.

