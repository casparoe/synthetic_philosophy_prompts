  Ultimately the biggest internal tension is between the view's mathematical elegance for ideal cases versus its fuzzy real-world applicability. That might be the core frustration behind the query.
answer: |-
  Here's a breakdown of defeaters for acausal cooperation (the "one computation, one policy" view), ranked by severity and split into outsider vs. internal critiques. I'll prioritize internal critiques as requested, flagging where purported internal arguments are disguised outsiders, and address your specific cases. The strongest internal critiques reveal either unresolvable ambiguity or prescriptions that feel *irrational even after accepting the premises*.

  ### **Severity Ranking**
  1.  **Fatal (Internal):** Undermines the core mechanism, leading to contradictions or paralysis.
  2.  **Seriously Damaging (Internal):** Reveals deep ambiguity or counterintuitive prescriptions that persist after granting premises.
  3.  **Awkward (Internal/External):** Highlights practical limitations or clashes with intuition but doesn't break the core.
  4.  **Outsider (External):** Challenges the axioms/metaphysics; important but doesn't engage the internal logic.

  ---

  ### **Internal Critiques (Granting the Framework)**
  These assume agents are "identical computations" deciding on a single policy for all instances.

  1.  **The Similarity Cliff & Graded Similarity (Fatal/Seriously Damaging)**
      *   **The Problem:** The core theory relies on *exact* computational identity. What constitutes "the same computation"?
          *   **97% Similarity:** Is your "slightly different data" twin running the *same algorithm* on different inputs, or a *different algorithm*? The theory offers no principled way to decide. "Same source code"? Many physically distinct systems could implement identical source code. "Same abstract algorithm"? This quickly becomes vague (e.g., is a neural net trained on 99% identical data "the same" as you?).
          *   **Discontinuity Bug:** If similarity is graded, does cooperation probability drop sharply at 99.999%? This seems arbitrary and unstable. If it's continuous, **the view collapses into evidential reasoning**:
              *   Your action becomes evidence about what *similar* agents (not necessarily identical computations) will do.
              *   You must have a prior over *how* similar other agents are and *how* their decisions correlate with yours.
              *   **The Extra Content Lost:** The unique "one computation, one policy" mechanism evaporates. You're just doing sophisticated Bayesian reasoning about correlation structures in the world, not leveraging a fundamental identity of computation. The "magic" is gone.
      *   **Why it's Fatal/Damaging:** It dissolves the distinct *acausal* mechanism into standard *evidential* reasoning under uncertainty. The core claim evaporates for non-exact copies.

  2.  **Slightly Unequal Twins (Seriously Damging)**
      *   **The Problem:** Symmetry was crucial for arguing "we must pick the same policy, and the best mutual policy is cooperation". Asymmetry breaks this.
          *   **Extra Dollar:** Twin A gets $1 more than Twin B for mutual cooperation. Does Twin B (the one getting less) still cooperate? If they must pick the *same* policy, what policy *is* optimal? Maximizing the sum? Maximizing the minimum? Maximizing *your own* expected utility? These conflict.
          *   **Stronger Temptation:** Twin A has a slightly higher payoff for defecting if Twin B cooperates. Twin B knows Twin A has this temptation. Should Twin B cooperate, hoping Twin A picks the cooperative policy? Or defect, fearing Twin A is more tempted? The "one policy" constraint means they *can't* conditionally respond to the asymmetry.
      *   **The Tie-Break Failure:** The framework *cannot supply a unique, principled answer* from within. "Maximize the sum of utilities" is an *external* ethical principle. "Maximize your own utility" leads to deadlock or defection.
      *   **Reflective Rejection Case:** Imagine you are Twin B (lower payoff or facing a more tempted Twin A). The "one policy" view forces you to choose an action *as if you were Twin A too*. This might prescribe cooperation even when, *knowing you are specifically Twin B*, you would calculate that defection (or a different action) strictly dominates *for you personally* given the forced correlation. Accepting the premises leads to an action you'd reject upon reflection as the disadvantaged party.

  3.  **The Anti-Coordination Case (Seriously Damaging)**
      *   **The Problem:** Correlation is harmful here. Both agents *must* pick the same policy due to computational identity. If "both go to Spot X" is bad, and "both go to Spot Y" is bad, but "one at X, one at Y" is good, the identical computation requirement *prevents* the good outcome.
      *   **The Randomness Need:** The framework **absolutely requires access to uncorrelated, indexical randomness** to break symmetry. If the agents' computations are *truly* identical and deterministic up to the choice, they *cannot* choose differently. They need:
          1.  **Different Inputs:** An external source of randomness unique to each instance (e.g., a random seed based on location/time). But is this "input" part of the computation? If the *algorithm* for processing the input is identical, does it count as the "same computation"? This ties back to the Similarity Cliff.
          2.  **Mixed Strategies *as Policy*:** The "policy" could be a mixed strategy (e.g., "Go to X with 50% probability"). This *can* work technically: both run the *same* random algorithm, get correlated randomness, and both still go to X or both to Y, failing. Or they need *un*correlated randomness sources. The framework *assumes* agents can implement mixed strategies with *independent* randomness, which is a **hidden empirical assumption** about the substrate of computation/agency. It doesn't follow from "same computation".
      *   **Reflective Rejection:** If coordination is *vital* (e.g., only one email *must* be sent) and randomness fails (both flip correlated heads), you end up with the worst outcome despite "rational" play. Granting the premises leads to potential disaster in ways that feel irrational.

  4.  **The Population Case (Seriously Damaging)**
      *   **The Problem:** You don't know if your opponent is an instance of "your computation" or something else. The framework forces you to decide "as if" you control all instances of your computation. But:
          *   You don't know if the opponent *is* one.
          *   You don't know how many instances of "you" exist (including yourself).
      *   **Degenerates into Self-Locating Uncertainty:** Your decision becomes: "What's the probability P that my opponent is an instance of my computation? What's the expected number N of instances? Given P and N, what policy maximizes the average utility over all instances of me, weighted by my self-locating uncertainty?".
      *   **Does it Add Value?** This **collapses into complex evidential reasoning**. You need strong, external-to-the-framework priors about:
          *   The prevalence of algorithms like yours in the population.
          *   How correlated their decisions are with yours *even if not identical*.
          *   The distribution of opponents you face.
      *   **The Extra Content Lost (Again):** The distinct "one computation" mechanism is submerged under standard (though complex) Bayesian updating and utility calculation over possible worlds and indexical uncertainty. It doesn't provide a fundamentally new decision rule.

  ---

  ### **Outsider Critiques (Challenging the Framework Itself)**
  *   **"Magicking Correlation" (CDT/EDT Flavor):** (Awkward/External) Accuses the view of smuggling in correlation without a causal mechanism. The internalist response ("It's not *causal* correlation, it's logical identity!") is valid *within the framework*. This critique only bites if you reject the metaphysical premise that logical identity of computation implies a unitary decision. It doesn't engage the internal logic, so it won't move you as requested.
  *   **"No Free Will / Determinism":** (External) If everything is determined, the "decision" is illusory. This attacks agency in general, not specifically acausal cooperation.
  *   **"Computation is Physical":** (External/Awkward) Computations run on physical substrates. Two physically distinct systems, even running identical code, are distinct entities. The "one computation" abstraction is just that – a useful fiction. This reinforces the Similarity Cliff problem but from an external metaphysical stance.

  ---

  ### **Empirical Check**
  *   Your intuition is largely correct. Labs/firms/states are **low-similarity cases**.
      *   Similarity is far below any plausible threshold for "same computation".
      *   Incentives are complex, multi-player, iterated, involve communication, and have external enforcement mechanisms (laws, reputation).
      *   Observing cooperation/collusion here tells us little about acausal cooperation. Observing *failure* to cooperate tells us less. The theory is **empirically empty** for real-world cases.
  *   **Is this Special Pleading?** Yes and no.
      *   **No:** The theory explicitly relies on *exact* or *very high* computational similarity, which doesn't exist in these cases. Testing Newtonian physics on quantum scales wouldn't falsify Newton.
      *   **Yes:** If a theory's domain of application is *only* idealized, non-existent scenarios, its practical relevance and claim to being a core principle of rationality are severely weakened. It risks being a "not even wrong" mathematical curiosity.

  ---

  ### **Insulation & Normative Status**
  *   **The Insulation Problem is Real:** Defenders often retreat to "not the same computation" or "problem changed". This *does* protect the core mathematical result for *exact* copies in *fully symmetric* PDs. However:
      *   It highlights the theory's **fragility** and lack of robustness.
      *   It turns the theory into a **tautology** for its narrow domain: "Exact computational twins in symmetric one-shot PDs should cooperate *by definition* of how we've set up 'should'." This drains it of interesting normative content.
  *   **Normative Defeaters:** For a normative theory, a defeater is a scenario where, *after fully accepting the premises and reasoning*, the prescribed action **still seems irrational upon reflection**. The "Slightly Unequal Twins" case (where you're the disadvantaged twin forced to cooperate) and the "Anti-Coordination" case (where forced correlation guarantees failure) are strong candidates for this. The theory delivers an answer, but it's one you deeply reject *even while believing the theory*.
  *   **What Predictions?** Pure normative theories don't make empirical predictions. Their "prediction" is: *"If* an agent accepts this theory *and* believes it faces an exact copy in a symmetric PD, *then* it will cooperate." Testing this requires creating such an agent and scenario, which is currently impossible. Its "predictions" about human behavior in analogous real-world scenarios are weak and non-unique (as per Empirical Check).

  ---

  ### **Conclusion: Does it Land?**
  **Yes, the strongest internal critiques land solidly and are damaging to the view as a general, robust, *distinctive* principle of rationality.**

  1.  **Fatal Blow (Similarity Cliff):** The theory's core mechanism dissolves into standard evidential reasoning under uncertainty for any non-exact copy. Its "extra content" vanishes outside mathematical ideality.
  2.  **Serious Damage (Unequal Twins, Anti-Coordination, Population):** These reveal unresolvable ambiguity (Unequal Twins), hidden problematic assumptions (Anti-Coordination), or collapse into complex standard reasoning (Population). Crucially, they generate potential **Reflective Rejection** cases.
  3.  **Awkward Reality (Empirical Emptiness, Insulation):** The theory has minimal practical application or testability. Defensive maneuvers protect a tiny, idealized core but highlight its impracticality.

  **Is it "basically fine"?** Only in a highly qualified sense: *If* you restrict yourself to *exact* computational duplicates in *fully symmetric* one-shot dilemmas, the prescription is coherent and arguably compelling *within its own framework*. However:

  *   **Unsolved (and likely unsolvable within the framework):** The Similarity Cliff, principled handling of asymmetry, anti-coordination without hidden randomness, and the Population problem.
  *   **Merely Hard (but tractable with adjustments):** Making mixed strategies explicit within the "policy," though this relies on the hidden randomness assumption.

  **The Bottom Line for You:** Your real-world actions likely relied on the *evidential* intuition that similar agents might reason similarly and that signaling cooperation (splitting credit) or building cooperative norms (paying in) is beneficial in the long run or aligns with your values. This is wise pragmatism, but it doesn't depend on the metaphysical "one computation" premise. The acausal cooperation view, as a unique and fundamental decision principle, is critically wounded by its internal tensions when pushed beyond its perfectly symmetric, exact-copy idealization. The strongest defeaters come from *within*.
