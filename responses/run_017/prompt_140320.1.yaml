    - I_B = 1,000,000
    - T_B = 1 / 2,000 = 0.0005 (total cost to solve entire problem is $1,950M past + $50M = $2,000M)
    - N_B = 1 / 2,000 = 0.0005
    - ITN_B = 1,000,000 * 0.0005 * 0.0005 = 0.25

  - Cause C:
    - I_C = 500,000
    - Total cost to solve entire problem: since each $1M solves 0.06%, cost = 100 / 0.06 ≈ 1,666.67 $M
    - T_C = 1 / 1,666.67 ≈ 0.0006
    - N_C = 1 / 500 = 0.002
    - ITN_C = 500,000 * 0.0006 * 0.002 = 0.6

  Ranking by ITN: A (12) > C (0.6) > B (0.25)

  Comparison with part (a): In part (a) for $50M, the ranking was B > C > A. The ITN ranking is A > C > B. The orders are reversed.

  The difference arises because the ITN framework is intended to estimate the marginal cost-effectiveness (WU per $) of additional funding. However, ITN uses proxies that assume constant returns to scale and that the problem is entirely unsolved. When these assumptions fail, ITN fails.

  Specifically:
  - Cause A: ITN assumes constant returns and no prior funding, so ITN_A = 12, which equals the marginal WU per $M (120) divided by 10? But note: marginal WU per $M for A is 120, and ITN_A=12, which is not the same. Actually, the ITN product does not have units of WU per dollar. It is an index.

  The key point: ITN is trying to approximate the marginal impact per dollar, but it uses the total benefit and the total cost. When the problem is partially solved (like B) or when there are diminishing returns (like C, though in C the returns are constant in the range, but the problem is partially solved by current funding?), the approximation fails.

  In Cause B, the marginal impact of $50M is high (25,000 WU), but ITN gives a low score because the total cost is high and current funding is high. But the marginal impact is on the last mile, not the average.

  (c) Neglectedness is intended as a proxy for the marginal returns not yet captured by importance and tractability. Specifically, in a constant-returns setting, marginal returns are proportional to (total benefit) * (marginal fraction solved per dollar) but also inversely proportional to the current funding gap. However, the standard use of current funding is crude.

  To improve it, neglectedness should be redefined as the ratio of the remaining funding gap to the total cost. That is, the fraction of the problem that remains unsolved and unfunded. This would be:

  Neglectedness = (1 - current funding / total cost)   [if current funding is less than total cost]

  But then we need to know the total cost and the current funding (cumulative or annual?).

  Alternatively, in a constant-returns world, the marginal impact per dollar is (total benefit) * (tractability) * (fraction of problem remaining). The fraction of problem remaining is the same as the unfunded fraction? Only if funding is proportional to progress.

  But in Cause A, with cumulative funding $30M and total cost $100M, the fraction remaining is 70%. So marginal returns = total benefit * (1/total cost) * (fraction remaining)? That would be 12,000 * (1/100) * (0.7) = 84 WU per $M? But the actual marginal return is 120 per $M. So that doesn't work.

  Alternatively, marginal returns = (total benefit) * (marginal fraction per dollar) * (fraction remaining)? But in constant returns, marginal fraction per dollar is constant and doesn't depend on the fraction remaining. So for A, it's 1% per $1M regardless.

  The point is that neglectedness as currently used (reciprocal of current funding) is not well-founded. It might be better to drop it and instead estimate marginal returns directly, using data on the current funding gap and the returns at the margin.

  Alternatively, redefine neglectedness as the inverse of the cumulative funding to date? For Cause A: cumulative funding $30M, so neglectedness = 1/30? Then ITN_A = 12,000 * 0.01 * (1/30) ≈ 4, which is not 120.

  We see that there isn't a simple multiplicative factor that recovers marginal returns.

  Therefore, the framework should drop neglectedness and instead focus on directly estimating the marginal cost-effectiveness, which accounts for the current state of funding and diminishing returns.

  (d) The stopping of routine vaccination ($2,000M per year) should be counted as a benefit, but in resource terms, not WU. The foundation's $50M leads to a saving of $2,000M per year in perpetuity, which can be used for other purposes. However, without knowing the opportunity cost of those resources (i.e., the WU generated by alternative uses of the $2,000M), we cannot convert it to WU. Therefore, it should not be included as a welfare gain in WU for Cause B, but noted as a resource saving that would require further analysis.

  **Marking Scheme (Total 30 marks)**

  1. **Part (a) Correct welfare gains and ranking for $50M and $1M (8 marks)**
     - Must have: 
       - $50M: A:6,000, B:25,000, C:15,000; ranking B>C>A
       - $1M: A:120, B:0, C:300; ranking C>A>B
     - Typical error: Incorrect calculation for Cause A (e.g., using percentage of remaining problem), or for Cause B (not recognizing the all-or-nothing), or for Cause C (wrong multiplication). Also, ranking errors.

  2. **Part (b) Correct ITN scores and ranking (4 marks)**
     - Must have ITN scores: A=12, B=0.25, C=0.6; ranking A>C>B
     - Typical error: Wrong definition of tractability (e.g., using marginal return) or neglectedness (e.g., not using reciprocal of current funding), or miscalculation.

  3. **Part (b) Explanation of why rankings differ and what ITN is trying to estimate (6 marks)**
     - Must hit:
       - The ITN framework is trying to estimate the marginal cost-effectiveness (WU per dollar).
       - The difference arises because ITN uses proxies (total benefit, total cost, current funding) that only equal marginal cost-effectiveness under constant returns and when the problem is entirely unsolved.
       - Specifically, for Cause B, the high current funding and high total cost lead to low ITN, but the marginal return is high because it's the last mile. The reverse for Cause A.
     - Typical error: Restating the ITN factors without explaining the disconnect from marginal impact, or not stating that ITN is a proxy for marginal cost-effectiveness.

  4. **Part (c) Redefining neglectedness or arguing to drop it (6 marks)**
     - Must hit:
       - Current neglectedness (reciprocal of current funding) is crude because it doesn't directly relate to the funding gap or diminishing returns.
       - A better definition might be the unfunded fraction of the problem, but even that may not work perfectly (as shown in the model answer).
       - Strong answer: Argue to drop it and estimate marginal cost-effectiveness directly.
     - Typical error: Restating the standard definition without critique, or providing an ad hoc redefinition without justification.

  5. **Part (d) Correct handling of the stopped vaccination (6 marks)**
     - Must hit:
       - It should be counted as a resource saving, not a direct welfare gain in WU.
       - Without knowing the opportunity cost of the saved funds, we cannot convert to WU.
       - Therefore, it shouldn't be added to the benefit in WU, but noted as a relevant factor for resource allocation.
     - Typical error: Saying it should be added as 2,000 WU per year without justification, or ignoring it entirely.

  **Breakdown:**
  - Part (a): 8 marks (4 for $50M, 4 for $1M: 2 for numbers, 2 for ranking each)
  - Part (b): 4 marks for ITN numbers and ranking, 6 marks for explanation -> total 10 marks
  - Part (c): 6 marks
  - Part (d): 6 marks

  Total: 8+10+6+6 = 30.
answer: |-
  **Global Priority Setting: Final Exam Question**  
  **Time allowed: 90 minutes. Word limit: 1,200 words. Total marks: 30.**  

  A foundation has a single non-recurring grant of $50M to allocate this year. Its trustees' fallback use is Cause C, whose return is known exactly. Consider three causes:  

  - **Cause A**: Control of a chronic parasitic infection. Fully solving it is worth 12,000 WU. Returns are constant: every additional $1M solves 1% of the problem, i.e., yields 120 WU, right up to complete solution at $100M of cumulative funding. Cumulative funding to date: $30M. Current annual funding: $10M. No other funder is expected to change its behaviour in response.  
  - **Cause B**: The eradication endgame for a vaccine-preventable livestock disease. Fully solving it is worth 1,000,000 WU, but 99% is already solved. The total cost to achieve the current 99% solution was $1,950M (one-time, in the past). If eradicated this year, the remaining benefit is 10,000 WU (the residual 1%) plus 15,000 WU from permanently avoiding resurgence. Eradication requires an indivisible one-off $50M campaign; any smaller contribution adds nothing at all. Current funding: $2,000M a year of routine vaccination, which continues until eradication occurs.  
  - **Cause C**: An established scholarship programme, the trustees' default. Worth 500,000 WU if fully solved; each additional $1M solves 0.06% of the problem, i.e., yields 300 WU, over the relevant range. Current annual funding: $500M. Divisible, no crowding out.  

  Treat WU as fully comparable across causes and ignore timing and discounting.  

  (a) Rank the three causes for the foundation’s $50M grant and for a hypothetical $1M grant. For each cause and each grant size, state the welfare gain in WU. Explain your reasoning. (8 marks)  
  (b) Apply the Importance-Tractability-Neglectedness (ITN) heuristic as typically taught in this seminar: assign a numerical value to each factor (Importance, Tractability, Neglectedness) for each cause, then compute the product for each cause. Rank the causes by this ITN product. Compare the ranking with your ranking from part (a) for the $50M grant. Explain precisely why the two rankings differ and what this reveals about what the ITN framework is trying to estimate. (10 marks)  
  (c) Redefine neglectedness so that it would be more than a crude proxy for the intended quantity in the ITN framework, or argue that the framework should drop it. (6 marks)  
  (d) In a sentence or two: if eradication happens for Cause B, the $2,000M a year of routine vaccination stops. Should this be counted in Cause B’s benefit? If so, how? (6 marks)  

  ---  

  **Model Answer**  
  The foundation should allocate the $50M to Cause B (25,000 WU), followed by Cause C (15,000 WU), then Cause A (6,000 WU). For a $1M grant, Cause C yields 300 WU, Cause A 120 WU, and Cause B 0 WU.  

  **(a)** For the $50M grant:  
  - **Cause A**: Cumulative funding is $30M. Each $1M yields 120 WU (1% of 12,000 WU), so $50M yields 50 × 120 = 6,000 WU.  
  - **Cause B**: The $50M grant funds the entire eradication campaign, yielding 10,000 WU (residual benefit) + 15,000 WU (avoided resurgence) = 25,000 WU. Smaller contributions yield 0 WU.  
  - **Cause C**: Each $1M yields 300 WU (0.06% of 500,000 WU), so $50M yields 50 × 300 = 15,000 WU.  
  Ranking: B (25,000) > C (15,000) > A (6,000).  

  For the $1M grant:  
  - **Cause A**: $1M yields 120 WU.  
  - **Cause B**: $1M cannot fund the $50M campaign, so yields 0 WU.  
  - **Cause C**: $1M yields 300 WU.  
  Ranking: C (300) > A (120) > B (0).  

  **(b)** ITN heuristic application:  
  - **Importance (I)**: Total WU if fully solved.  
  - **Tractability (T)**: 1 / (total cost in $M to solve entire problem).  
  - **Neglectedness (N)**: 1 / (current annual funding in $M).  
  - ITN product = I × T × N.  

  Computations:  
  - **Cause A**: I = 12,000; T = 1 / 100 = 0.01 (cost to solve: $100M); N = 1 / 10 = 0.1. Product = 12,000 × 0.01 × 0.1 = 12.  
  - **Cause B**: I = 1,000,000; T = 1 / 2,000 = 0.0005 (total cost: $1,950M past + $50M = $2,000M); N = 1 / 2,000 = 0.0005. Product = 1,000,000 × 0.0005 × 0.0005 = 0.25.  
  - **Cause C**: I = 500,000; T ≈ 1 / 1,666.67 ≈ 0.0006 (cost to solve: 100 / 0.06 ≈ $1,666.67M); N = 1 / 500 = 0.002. Product = 500,000 × 0.0006 × 0.002 = 0.6.  
  ITN ranking: A (12) > C (0.6) > B (0.25).  

  Comparison with part (a): The ITN ranking (A > C > B) reverses the correct $50M ranking (B > C > A). The difference arises because ITN estimates *marginal cost-effectiveness* (WU per $) using proxies that assume constant returns and an unsolved problem. Here, ITN fails:  
  - Cause B has high marginal impact (25,000 WU for $50M) but low ITN due to high total cost and current funding, ignoring that funding buys the "last mile."  
  - Cause A has low marginal impact (6,000 WU) but high ITN, as it uses total benefits and costs without accounting for prior funding ($30M).  
  ITN’s product conflates total scale with marginal returns, breaking down when returns diminish, problems are partially solved, or interventions are lumpy.  

  **(c)** Neglectedness is a crude proxy for the inverse of marginal returns. It should be redefined as the *unfunded fraction of the problem*: (remaining welfare gap / total welfare) × (1 - current funding / total funding needed). For Cause B, remaining welfare is 25,000 WU (not 1,000,000 WU), and funding needed is $50M (not $2,000M). Redefined neglectedness would be (25,000 / 1,000,000) × (1 - 0 / 50) = 0.025, but this requires precise data on residual gaps and is not multiplicative. Given these complexities, the framework should drop neglectedness and directly estimate marginal cost-effectiveness using current intervention opportunities.  

  **(d)** The stopped vaccination ($2,000M/year) should *not* be counted in Cause B’s WU benefit. It represents a resource saving, not direct welfare. Converting it to WU requires knowing the opportunity cost of the saved funds (e.g., WU from alternative uses), which is unspecified and beyond the cause-specific benefit.  

  ---  

  **Marking Scheme**  
  **Total: 30 marks**  

  1. **Part (a) Correct WU and ranking for both grant sizes (8 marks)**  
     - $50M: A=6,000, B=25,000, C=15,000; ranking B>C>A.  
     - $1M: A=120, B=0, C=300; ranking C>A>B.  
     - *Typical error*: Miscomputing WU (e.g., for Cause A, using 50% of *remaining* problem or omitting Cause B’s lumpiness) or ranking without justification.  

  2. **Part (b) Correct ITN computation and ranking (4 marks)**  
     - ITN values: A=12, B=0.25, C=0.6; ranking A>C>B.  
     - *Typical error*: Wrong tractability (e.g., 1/marginal cost) or neglectedness (e.g., cumulative funding), or arithmetic errors.  

  3. **Part (b) Explanation of ranking difference and ITN’s target (6 marks)**  
     - States ITN aims to estimate marginal cost-effectiveness.  
     - Explains failure due to assumptions (constant returns, unsolved problem) and proxies (total vs. marginal).  
     - Specific examples: Cause B (high marginal, low ITN) and Cause A (low marginal, high ITN).  
     - *Typical error*: Restating ITN factors without linking to marginal returns or not addressing partial solutions.  

  4. **Part (c) Redefinition or critique of neglectedness (6 marks)**  
     - Argues neglectedness is flawed as a proxy for marginal returns.  
     - Redefines it (e.g., unfunded fraction) with limitations or advocates dropping it for direct estimation.  
     - *Typical error*: Restating standard neglectedness or suggesting vague alternatives without justification.  

  5. **Part (d) Handling of stopped vaccination (6 marks)**  
     - States it should not be added to WU benefit.  
     - Explains it is a resource saving requiring opportunity cost analysis.  
     - *Typical error*: Claiming it adds to WU without conversion or ignoring it entirely.
