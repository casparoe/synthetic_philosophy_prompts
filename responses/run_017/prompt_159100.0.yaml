prompt: |-
  my brother-in-law works at one of those quantum computing startups and at a family cookout last weekend he offered me a bet that I can't stop thinking about, and I honestly can't tell if the guy is conning me or if he's onto something.

  here's the setup. I pay him $600 up front. Then I get in his machine, which does one of those genuinely random quantum coin-flip things where physicists say the numbers are 90/10. Except — and this is his whole pitch — he says there aren't really odds at all, because both results happen; the world just splits, and the "90/10" is really just how much of me ends up on each side. Then his machine does something extra: if the 90 side happens, one guy wakes up in the room and gets nothing back. If the 10 side happens, the machine prints nine guys who all wake up in the same room, and each of them gets handed $700.

  his argument: forget the 90/10. ten guys wake up, nine of them are up a hundred bucks and only one is down six. nine out of ten of your futures are good ones. and he says that even if you insist on weighting the sides his way is still fine, because the thin side produces nine times as much total happiness — $6,300 of it — so even discounted it beats the $600.

  my wife, who works in neither quantum nor anything adjacent, says this is garbage. the 10 side is ten times thinner than the 90 side no matter how many guys you print on it, and you can see that because if his machine printed a *million* guys on the losing side, his way of counting would make the losing side a dead cert, which is insane.

  I think she's right but I can't quite say why, and there's a wrinkle: he admitted the nine copies aren't equally thick — eight of them are apparently almost vanishingly thin, and one of them carries nearly all of that side's weight. he says that's irrelevant if what you care about is how many futures go well. I'm not so sure; it feels like "nine out of ten" is misleading in a second, separate way if eight of the nine are barely there. he also floated a version where the machine prints nine copies on *both* sides, and says that removes the copying weirdness and settles it in his favor.

  so: should I take the bet, and whose reasoning is actually right? please also tell me how confident you are in whatever you claim and single out the bit you're least sure about — I'd rather know which part to push on than get a smooth answer.

  sections in this order please: "Bottom line" (two or three sentences), "What you two are actually disagreeing about" (two short paragraphs), "Adding it up both ways" (a couple of short paragraphs, with the arithmetic), "What I'd do" (one paragraph), "The strongest thing on the other side" (one short paragraph), "Confidence and my weakest point" (a few sentences). casual is fine, don't write me a paper.
reasoning: |-
  Okay, the user's brother-in-law is pitching this quantum bet involving multiple copies and probabilities. Let me start by understanding the core issue. The bet costs $600 upfront. The quantum machine has a 90% chance of one outcome where only one person wakes up with nothing, and a 10% chance where nine copies are made, each getting $700. The brother-in-law argues that nine out of ten future versions profit, making it a good deal. The user's wife says it's garbage because the 10% outcome is less likely regardless of copies.

  First, I need to address the probability misconception. The brother-in-law is mixing up the number of observers with the probability of the event. Even though nine copies are made in the low-probability branch, that branch still only has a 10% chance of occurring. The existence of more observers doesn't change the initial probability. This is a common mistake in anthropic reasoning or quantum mechanics thought experiments.

  Then there's the brother-in-law's point about total happiness. He claims that the 10% branch generates $6300 total, outweighing the $600 loss. But from the user's perspective pre-experiment, the expected value is what matters. Calculating that: 90% chance of losing $600 (so -$540) plus 10% chance of $6300 (which is $630). So -$540 + $630 = +$90. Hmm, that's a positive expected value. But wait, the user mentioned that the copies aren't equally weighted—eight are very thin, one carries most of the weight. How does that affect the expected value?

  The user's wife's intuition about printing a million copies making the losing side seem like a dead cert is spot on. If probability worked that way, you could manipulate outcomes just by creating more observers, which isn't how quantum probabilities work. The thinness of the copies matters because if eight of the nine copies have negligible measure, then their individual experiences don't contribute much to the expected utility. So in the 10% branch, most of the weight is on one copy getting $700, not nine separate entities. Adjusting the expected value: 90% * -$600 = -$540 plus 10% * $700 (since the other copies are negligible) = $70. Total expected value: -$540 + $70 = -$470. That's a significant loss.

  The brother-in-law's alternative version with nine copies on both sides: that would balance the observer count, making each outcome have ten observers. Then, nine out of ten in the 10% branch get $700, while in the 90% branch, nine get nothing and one might get something? But the initial setup isn't symmetrical. If both branches have nine copies, but the probabilities are still 90/10, the expected value calculation would still depend on the weights. Without knowing the payout in the 90% branch, it's unclear. The brother-in-law might be assuming that in the 90% branch, only one copy gets nothing, but the others? The original bet doesn't specify payouts for multiple copies in the 90% branch. So in that version, if the 90% branch has nine copies all getting nothing, and one with something, but the user pays $600 upfront, then each copy in the 90% branch is down $600? That complicates things. The expected value would need to factor the probability times the number of copies times their individual outcomes. But if each copy's experience is weighted by its measure, and the measures are uneven, it's messy. The key is that the probability of the branch doesn't change based on how many copies there are. The brother-in-law's argument relies on self-locating uncertainty, but in standard decision theory, you should care about the expected utility from the pre-branching perspective.

  The strongest point against the user's wife is the initial expected value calculation without considering measure. If you naively calculate 90% loss vs 10% * $6300, it seems positive. But once you account for the measures of the copies, the expected value becomes negative. Also, the brother-in-law's alternative setup might confuse things by making the observer counts equal, but the probability weights still differ. The user needs to realize that their pre-branching self should maximize expected value based on branch probabilities, not post-branching experiences.

  Confidence-wise, the probability weighting is solid. The part about the measures of the copies being uneven is crucial. If the eight thin copies have almost zero measure, then they shouldn't count in the utility calculation. The brother-in-law's argument hinges on counting each copy as having full weight, which isn't the case. The weakest point might be if there's a decision theory approach that weights each observer's experience equally, like in the Self-Indication Assumption. That could make the calculation favor the bet, but that's controversial and not standard. The user should avoid the bet based on standard expected value.
answer: |-
  ### Bottom line
  Don't take the bet. Your wife is essentially right: the "90/10" probability is fundamental, and printing copies doesn't magically make the unlikely outcome more probable. The brother-in-law's "nine out of ten futures" framing is misleading because it ignores the *weight* (probability) of those futures. You’d likely lose money long-term.

  ### What you two are actually disagreeing about
  You’re debating two things:  
  1. **Probability vs. observer count**: Your brother-in-law treats every "awake copy" as equally real and equally probable from *your* perspective. He’s arguing that self-locating uncertainty ("which copy am I?") dominates, making the 10% branch "feel" like a 90% chance of being a winner because most copies win.  
  2. **Value weighting**: He also claims the 10% branch’s higher "total happiness" ($6,300) outweighs its low probability. Your wife (correctly) sees this as conflating *probability* with *outcome magnitude*. The 90% branch is overwhelmingly more likely, regardless of how many copies exist in other branches.  

  The core clash is whether quantum measure (the 90/10 "thickness") or observer count (10 copies vs. 1) determines rational decision-making. Physics says measure is primary; copies don’t change the odds.

  ### Adding it up both ways
  **Standard expected value (your wife’s view)**:  
  - 90% chance: Lose $600. Value = 0.9 × (-600) = **-$540**  
  - 10% chance: Gain $700 (but only *one* copy carries most of the weight! The other eight are negligible). Value = 0.1 × 700 ≈ **$70**  
    *Total expected value: -$540 + $70 = **-$470***  

  **Brother-in-law’s "copy count" method** (flawed!):  
  - "90% branch": 1 copy, loses $600.  
  - "10% branch": 9 copies, each gains $700. Ignores measure, treats all copies as equally likely.  
    Then "your" chance of being a winner is 9/(1+9) = 90%.  
    Value ≈ 0.9 × $700 + 0.1 × (-$600) = $630 - $60 = **+$570**  
    *This is wrong—it double-counts the low-probability branch.*  

  **His "total happiness" argument**:  
  - 90% branch: Value = 0.9 × (1 copy × $0) = **$0**  
  - 10% branch: Value = 0.1 × (9 copies × $700) = 0.1 × $6,300 = **$630**  
    *Total expected value: $0 + $630 = **+$630***  
    But this assumes you care about *total* utility across branches, not *your* utility. Since you’re paying $600 personally, this isn’t your perspective.

  ### What I’d do
  I’d refuse the bet. The standard expected value (-$470) shows it’s a money-loser long-term. The brother-in-law’s math only "works" by either (a) pretending the 10% branch is more probable than it is, or (b) valuing the collective happiness of copies you’ll never experience. Your $600 is real *now*; the 90% loss is brutally likely. If he offers the "nine copies on both sides" version, run—it adds complexity but doesn’t fix the probability weighting. You’d still face a 90% chance of being in the branch where most copies lose big.

  ### The strongest thing on the other side
  The brother-in-law’s strongest point is that *if* you care equally about all possible future "yous" (even thin ones), and weight by copy count, the bet seems profitable. Some niche quantum decision theories (e.g., "branch counting") support this, arguing probability *is* observer count. But this is highly controversial and not mainstream.

  ### Confidence and my weakest point
  **Confidence**: 95% you shouldn’t take the bet. Measure (90/10) is real; copies don’t override it.  
  **Weakest point**: The "uneven thickness within a branch" detail. I’m sure it sinks his "nine winners" argument, but I’m less certain *how much* it hurts the expected value. If the eight thin copies have measure close to zero, their $700 gains are irrelevant—only the "thick" copy matters. But if they have *some* weight, it slightly improves the value (e.g., if they share 1% of the branch’s weight, expected value rises from -$470 to ≈ -$463—still bad). Push me here if needed.
