  We are designing a decision procedure for merging patient records in a master patient index. The procedure must be:
  - Short and executable in about 10 minutes per decision
  - Defensible and auditable
  - Honest about limitations

  Key metaphysical considerations:
  1. **Indiscernibility of identicals (Leibniz's Law in one direction)**: If two records are of the same patient, then they must agree on all properties. Thus, any hard conflict (e.g., incompatible sex, blood type, date of birth vs. age) means they are different patients. This gives us a hard "no" condition.
  2. **Identity of indiscernibles**: This principle (if two things have all properties in common, they are identical) is not necessarily true. Two distinct patients can have all stored properties identical (as in the case of twins or duplicate records). Therefore, we cannot rely solely on high similarity to merge.

  However, note that the question in the queue is evidential: do we have sufficient warrant to treat the two records as denoting the same patient, given the costs of errors?

  We must also consider:
  - The need for a sortal: We are concerned with "the same patient" (i.e., the same human being) in the real world. This is distinct from the same account or the same family policy. However, in the context of the health system, we are also concerned with the same patient as a subject of care. The sortal matters because merging under one sortal (e.g., the same person under a family policy) might not license merging under another (e.g., the same patient for clinical care) without additional evidence.

  Decision Procedure Structure:

  We break the decision into a sequence of questions. The goal is to terminate early when we can make a definitive call.

  **Step 1: Check for Hard Conflicts**
  - Check for any property that, if conflicting, definitively indicates two different patients. These are properties that are immutable or highly stable and for which an error is extremely unlikely. Examples:
    - Incompatible sex (if one record says male and the other female, and we are not in a context of gender transition that might explain the change? Note: we must be cautious about gender identity changes, but in a newborn vs. adult scenario, this is clear. However, in general, we might need a policy for gender transition. But in this step, we are looking for hard biological conflicts that cannot be reconciled. For example, a newborn male and an adult male of the same date of birth? That is a conflict because the same individual cannot be both a newborn and 34 years old on the same day. Similarly, incompatible blood types that are not due to error or change (blood type doesn't change, but errors in recording can occur). 
    - Date of birth conflict that cannot be explained (e.g., two different dates that are not typographical errors of each other) and that would make the patient's age inconsistent in a way that is impossible (e.g., one record says birth year 2000 and the other 2010, and both are current records).
    - Other hard conflicts: incompatible vital status (one record says deceased with a death date and the other is active) without explanation, or multiple conflicting unique identifiers (like SSN) that are validated.

  *Termination condition*: If a hard conflict is found, rule as "different patients" (no merge) and document the conflict.

  **Step 2: Check for Anchor Identifiers**
  - Check for the presence of a verified enterprise identifier (e.g., a patient ID from a previous merge that has been used in clinical orders) or a verified external identifier (like a state health exchange ID that has been linked and verified). 
    - If both records have the same verified enterprise identifier, then they are the same patient (merge). 
    - If they have different verified enterprise identifiers, then they are different patients (no merge).

  Note: The enterprise identifier is assigned at an enrollment event and is considered the anchor. It is by convention and not by comparison. However, if the same enterprise identifier appears in two records, we take it as the same patient. If two records have different enterprise identifiers, we take them as different. But note: what if the enterprise identifier is missing in one? Then we cannot rely on this.

  *Termination condition*: If both records have the same verified enterprise identifier -> merge. If they have different verified enterprise identifiers -> no merge.

  **Step 3: Check for Exact Match on a Unique Key**
  - If there is a unique key (or set of keys) that we have established as unique and both records have the same value for that key (and the key is verified and not likely to be shared), then merge. 
    - Example: a verified SSN that has been validated and is not null in both records and matches exactly. 
    - However, note that SSNs can be shared by mistake (or even intentionally by fraud) so we must have a policy for when we consider a unique key as definitive. Also, in the case of twins, they have different SSNs.

  But note: in our context, we might not have a unique key that is 100% reliable. Hence, we must define what we consider as a unique key and under what conditions we trust it.

  *Termination condition*: If both records have the same unique key (as defined by policy) and the key is verified, then merge. If they have different unique keys (that are verified and not null) then no merge.

  **Step 4: Check for Hard Conflicts Revisited (in case we skipped some)**
