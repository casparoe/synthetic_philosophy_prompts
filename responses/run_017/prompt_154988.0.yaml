  ### Decision Procedure for Patient Record Merging  
  Your analysts need a clear, auditable, and efficient 10-minute procedure grounded in evidence, not metaphysics. The core insight: **Identity is not a probability—it's a binary fact—but our *warrant to act* on identity is evidential and cost-sensitive.** Leibniz's Law provides a one-way test (hard conflicts refute identity), but similarity alone cannot confirm it. The procedure prioritizes safety (avoiding false merges) and pragmatism (handling real-world constraints).  

  #### Key Simplifications from Metaphysics  
  1. **Drop**:  
     - The *identity of indiscernibles* (reliance on primitive "thisness"). No similarity threshold guarantees identity—twins or duplicates prove this.  
     - Abstract debates about "sortals." We assume "same patient" = same biological human. Merging under other sortals (e.g., family policy) requires separate evidence.  
  2. **Preserve**:  
     - **Indiscernibility of identicals**: Hard conflicts (e.g., incompatible DOB/age) refute identity.  
     - **Evidential vs. ontological**: We decide *whether to merge records*, not whether patients *are* identical. Costly false merges demand conservatism.  
     - **Conventional anchors**: An enterprise identifier (assigned at enrollment) is the only way to *stipulate* identity. It overrides matching logic.  

  ---

  ### The Procedure: 6 Questions, 10 Minutes  
  **Input**: Two records (A and B) from the merge queue.  
  **Output**: `MERGE`, `NO MERGE`, or `ESCALATE` (to nurse informaticist).  
  **Rules**:  
  - Terminate early if a decision is reached.  
  - Document evidence for each step (audit trail).  
  - Escalate if records are linked to clinical orders or if ambiguity persists.  

  #### Step 1: **Hard Conflict Check**  
  - **Question**: Do A and B conflict on any *immutable or implausibly variable* property?  
    - *Properties*: Sex (if immutable context, e.g., newborn vs. adult), blood type, DOB incompatible with age (e.g., DOB 2024 but age 34).  
    - *Sufficient answer*: **Yes** → `NO MERGE`.  
    - *Why stop?* Leibniz’s Law: A patient can't have two DOBs. This is decisive.  
    - *Time*: 1 minute.  

  #### Step 2: **Verified Anchor Identifier**  
  - **Question**: Do A and B share a verified **enterprise identifier** (assigned at enrollment)?  
    - *Sufficient answer*:  
      - **Match** → `MERGE` (identity stipulated at enrollment).  
      - **Mismatch** → `NO MERGE` (different patients by convention).  
    - *Why here?* Anchors trump matching. They are conventional, not discovered.  
    - *Note*: If only one record has an anchor, proceed to Step 3.  
    - *Time*: 1 minute.  

  #### Step 3: **Unique Key Conflict**  
  - **Question**: Do A and B have *different* verified unique keys (e.g., SSN, passport)?  
    - *Sufficient answer*: **Yes** → `NO MERGE`.  
    - *Why?* Unique keys are designed to distinguish patients. Mismatch refutes identity.  
    - *Caveat*: Ignore if keys are missing/unverified.  
    - *Time*: 1 minute.  

  #### Step 4: **Evidence of Distinctness**  
  - **Question**: Is there positive evidence that A and B are distinct individuals?  
    - *Indicators*:  
      - Different addresses >10 miles apart without explanation (e.g., recent move).  
      - Different last names without marital/legal context.  
      - System flags (e.g., existing twins at same address/DOB).  
    - *Sufficient answer*: **Yes** → `NO MERGE`.  
    - *Why?* Protects against false merges in edge cases (e.g., twins).  
    - *Time*: 2 minutes (quick system lookup for household duplicates).  

  #### Step 5: **High-Risk Context Check**  
  - **Question**: Is this a high-risk scenario?  
    - *Triggers*:  
      - Records linked to clinical orders.  
      - Same address/DOB/gender (twin risk).  
      - Low data quality (e.g., missing key fields).  
    - *Sufficient answer*: **Yes** → `ESCALATE` to nurse informaticist.  
    - *Why?* Stakes are too high for algorithmic judgment. Requires human sign-off.  
    - *Time*: 1 minute.  

  #### Step 6: **Similarity Assessment**  
  - **Question**: Do A and B match on all critical fields?  
    - *Critical fields*: Full name (including suffixes), DOB, gender, address, phone.  
    - *Sufficient answer*:  
      - **Exact match** → `MERGE` (treat as duplicate, absent evidence of distinctness).  
      - **Partial match** → `NO MERGE` (insufficient warrant; avoid false merge risk).  
    - *Why?* Similarity is only reliable when *no red flags exist* (Steps 1–5).  
    - *Time*: 4 minutes.  

  ---

  ### Where the Procedure Misfires  
  - **Twins with identical data**: If no anchor exists and no evidence of distinctness (e.g., no prior twins flagged), Step 6 may `MERGE` identical twins. This is dangerous.  
  - **Data entry errors**: A false non-conflict (e.g., mistyped DOB that doesn’t create a hard conflict) may lead to `NO MERGE` for true matches or `MERGE` for false matches.  
  - **10-minute limit**: No time for deep investigation (e.g., contacting patients). Ambiguous cases escalate or default to `NO MERGE`.  

  ---

  ### Case Analyses  
  **Case 1**: Same name (one with suffix), same DOB, addresses 2 miles apart, newborn vs. 34yo male.  
  - **Step 1**: Hard conflict! Newborn and 34yo on same DOB → `NO MERGE`.  
  - *Why?* Biologically impossible. Stops at Step 1.  

  **Case 2**: Identical fields, created 400ms apart during downtime replay.  
  - **Step 1**: No hard conflict.  
  - **Step 2**: No anchor → proceed.  
  - **Step 3**: No unique key conflict → proceed.  
  - **Step 4**: No evidence of distinctness → proceed.  
  - **Step 5**: Not high-risk (no clinical orders) → proceed.  
  - **Step 6**: Exact match → `MERGE`.  
  - *Why?* Context implies duplication. Metaphysics note: Identity of indiscernibles fails in theory (Black’s spheres), but here the *cause* (system error) justifies merging.  

  **Case 3**: Adult monozygotic twins, same DOB/address/family policy ID, no distinguishing anchor.  
  - **Step 1**: No hard conflict.  
  - **Step 2**: No shared anchor → proceed.  
  - **Step 3**: No unique keys → proceed.  
  - **Step 4**: **Evidence of distinctness!** Family policy ID implies multiple members + same address/DOB → `NO MERGE`.  
  - *Why?* Family IDs are not patient-level anchors. Step 4 catches this.  
  - *Unwanted truth*: Your current "no policy" approach risks false merges. **Do not merge twins without anchors**—escalate to assign distinct enterprise IDs at enrollment.  

  ---

  ### What the Procedure Cannot Do  
  1. **Resolve identity without anchors**: If twins share all data and lack unique keys, only an enrollment stipulation (e.g., biometrics) can distinguish them.  
  2. **Handle intentional fraud**: Shared SSNs or stolen identities require external verification.  
  3. **Override clinical links**: Once records are used in orders, humans must decide (`ESCALATE`).  
  4. **Guarantee correctness**: It minimizes risk but is fallible with poor data or novel edge cases.  

  ### Final Recommendation  
  - **For twins**: Assign enterprise IDs at enrollment with biometrics (e.g., fingerprints) or photos. This is convention—not discovery.  
  - **For duplicates**: Improve real-time deduplication at registration to reduce queue volume.  
  - **Philosophy in practice**: Metaphysics sets boundaries (hard conflicts, conventional anchors), but evidence and error costs drive decisions. Your procedure honors both.
