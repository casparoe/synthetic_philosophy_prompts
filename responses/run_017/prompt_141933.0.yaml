  For a decisive experiment, I'd want a domain-general model trained on realistic input that spontaneously exhibits structure-dependence without tweaks. Current models either fail or require suspiciously language-like architectures. If one succeeded cleanly, I'd drop to 0.4. 

  The user's frustration with circular debates is palpable. Their "shadow gap" framing is sharp—I should emphasize why I think search won't save the day here. Also, they might be underestimating how baked-in biases undermine "domain-general" claims. Their advisor is probably more optimistic about hidden statistical cues or emergent processing. 

