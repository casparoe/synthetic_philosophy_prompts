prompt: |-
  Me and my advisor keep going in circles about poverty-of-the-stimulus arguments, and I want to force the disagreement out into the open, so here's what I want an actual number on. I'm going to stipulate the case myself so we're not arguing about what some study did or didn't show:

  - A learner gets exactly what a five-year-old gets: five years of child-directed speech, transcribed, call it thirty million words, plus whatever non-linguistic context you'd let the child have — joint attention, pointing, seeing what people are looking at, hearing the same voices over and over. No corrections, no graded feedback, no "that's not how you say it" directed at the target construction specifically.
  - Its learning machinery is domain-general sequence learning, as strong as anyone can plausibly make it, with nothing in it that was shaped by selection for language. I know that clause is doing a lot of work and I want you to say what you're assuming under it.
  - The test is structure-dependence. As I remember the elicitation work, kids who've presumably never been explicitly corrected on it treat yes-no question formation as picking out the auxiliary by the sentence's hierarchical structure rather than by linear order or "first one you come to" — they produce roughly the right-sounding thing rather than the linearly-simplest thing. I don't remember the exact sentences, so use whatever version of that contrast you think is cleanest.

  The proposition I want your credence on: that learner, evaluated at the end of the five years, will fail to match typically-developing five-year-olds on some structure-dependent generalization the children get right — i.e. the children's success really does depend on something the primary data plus domain-general learning don't supply.

  Decompose it for me. The terms I think belong, but add or drop:

  1. whether the relevant generalization is genuinely absent from (or unrecoverable from) the data, versus just rare, noisy, and buried in a way that a strong enough learner might dig out anyway
  2. how much quiet help the input gives — reformulations, partial corrections, the statistical shape of speech to children, the fact that kids hear their own errors echoed back
  3. whether "no language-specific priors" is even a coherent specification for a learner this powerful, or whether any architecture big enough to do the job comes with inductive biases that can't be cleanly separated into "language" and "not language"
  4. the gap I keep banging on about, which I've started calling the shadow gap: even if the data underdetermines the grammar in the logic-textbook sense, the learner's own search procedure plus the deadline it's under might shove it into the right grammar anyway, so bare underdetermination doesn't get you to "must be innate" without a separate argument that the search doesn't do the work
  5. explanations of the third-factor sort — computational efficiency, memory limits, pressure to be parsable — which are neither experience nor a language organ

  Give me a number and one line of justification for each, then the combination, and tell me which term the final number is most sensitive to. I'm at about 0.75 and she's at about 0.3; where do you think we most likely disagree? And what single result would move your number the most? My guess is it'd be a learner that nails the generalization by a mechanism nobody would want to call grammatical, but tell me if you'd pick something else.
