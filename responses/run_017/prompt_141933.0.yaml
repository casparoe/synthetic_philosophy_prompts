  Term 3 (coherence of "no language-specific priors") is philosophically messy. Any powerful learner has architectural biases. If we build a super-RNN with human-like memory and attention, it might accidentally favor hierarchical processing. But is that "domain-general"? I'm conflicted but think it's a major hurdle, hence 0.8. 

