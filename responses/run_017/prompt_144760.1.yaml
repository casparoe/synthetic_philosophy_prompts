prompt: |-
  I run the clinical ethics consultation service at a mid-size hospital — about forty consults a year, one hour-long case conference each, and the attending physician plus a three-person committee has to sign off at the end. Our accreditation body has started requiring that every consult close with a one-sentence "articulable rationale" that could be applied to future cases, and that's exactly the thing I'm not sure is always available.

  I've been reading up on moral particularism versus generalism and the holism of reasons — the thought that a feature counting in favour of an action here might count against it, or count for nothing, somewhere else. Turn that into a procedure my committee can actually run inside an hour: the questions in the order we should ask them, a real test for whether a feature is doing work in this case or just travelling along with it, and a way of dealing with the fact that we keep a register of past consults (I pair each new case with its closest near-miss from the register, and we routinely can't agree whether the difference between the two is a reason or just noise).

  It has to say where it stops with no answer, which steps are judgment calls dressed up as steps, and what we write on the form when the honest answer is that there is no generalizable rationale — I'd rather flag that than invent one. It also has to tell me which parts of the theory I can drop in translating it to a one-hour meeting and which I can't drop without the whole thing collapsing into a plain checklist.

  Then run it on three of our cases: a family insisting on continued ICU treatment the team calls futile; a case that is the near-identical twin of one we decided last year except the patient has no family at the bedside; and a patient with a history of violence toward staff, where everyone in the room is sure it matters but nobody can say whether it's a reason or a biasing factor. Include at least one where the procedure lands somewhere I won't like, and say plainly what the procedure can't do for us.
reasoning: |-
  Okay, let me start by really understanding the user's problem. They run a clinical ethics consultation service and are struggling with the new requirement to provide a one-sentence "articulable rationale" for each case. They're concerned because they believe in moral particularism, where reasons can change depending on context, making a generalizable rationale sometimes impossible. 

  First, I need to reconcile particularism with the need for a standardized procedure. The user mentioned holism of reasons—features that count for one decision in one case might not in another. So, the challenge is creating a process that respects context but still extracts a rationale when possible. 

  The user wants a step-by-step procedure that fits into a one-hour meeting. It should help determine if a feature is relevant or just noise, especially since they compare cases to past consults. They often disagree on whether differences are meaningful. The procedure must indicate when no rationale exists and avoid inventing one. They also need to know which theoretical parts are essential and which can be skipped without turning the process into a mere checklist.

  Looking at the three cases they provided: futile ICU treatment, a near-identical case without family, and a violent patient affecting staff's perception. These examples will test the procedure's effectiveness. The user wants transparency about limitations and an example where the outcome might be unpopular.

  I should start by breaking down the steps. The procedure must identify key features, test their relevance, and decide if they can form a rationale. The holism test is crucial here—checking if a feature's reason changes in different contexts. For the case registry, they need a way to compare cases but acknowledge when differences are circumstantial. 

  The user emphasized not fabricating rationales. The procedure must explicitly allow for "no generalizable rationale" as a valid outcome. Also, distinguishing between judgment calls and concrete steps is important to maintain integrity. 

  For the theoretical aspects, the core of particularism—context-dependence and holism—can't be dropped. But complex philosophical discussions can be streamlined into practical steps. The steps should focus on critical questions that probe feature relevance without getting bogged down in theory.

  Applying the procedure to the cases: 
  1. Futile ICU: After analysis, the rationale might focus on proportionality of burdens vs. benefits, but only if that principle holds across contexts. If not, the outcome might be no rationale.
  2. Twin case without family: The absence of family might shift surrogate decision-making dynamics, but is that a general reason? The procedure might show it's context-specific.
  3. Violent patient: Here, safety is a legitimate reason affecting capacity assessment or resource allocation. The procedure should validate that it's a reason, not just bias, by checking if it impacts clinical factors.

  I need to ensure the procedure highlights when a rationale isn't possible. For example, in the violent patient case, if the team can't separate safety from bias, the outcome should reflect uncertainty. Also, in the twin case, if the family's absence doesn't alter the core ethical principles, the rationale from the previous case might apply, but the procedure must test that rigorously.

  The user's deeper needs include maintaining credibility with the accreditation body while staying true to ethical integrity. They don't want to oversimplify complex cases. The procedure should protect against false generalizations and document when context is irreducibly specific. 

  Finally, the limitations: The procedure can't eliminate disagreement among committee members or guarantee a rationale every time. It also can't remove the need for experienced judgment but can structure it to reduce arbitrariness. Being transparent about these points is key to the user's trust in the process.
answer: |-
  Here's a practical procedure ("The Contextual Rationale Protocol") designed for your one-hour case conference, grounded in moral particularism while meeting accreditation needs. It prioritizes identifying *if* a generalizable rationale exists and flags when it doesn't.

  **Core Principles Retained (Cannot Drop):**
  1.  **Holism Test Mandatory:** A feature's ethical valence (pro/con/neutral) *must* be interrogated within *this specific* clinical/social context. Its role in past cases is suggestive, not determinative.
  2.  **Relevance vs. Correlation:** Features present must pass a test to show they are *doing ethical work*, not just correlated.
  3.  **"No Rationale" is a Valid Output:** The procedure explicitly allows for concluding no generalizable rationale exists.

  **Steps Dropped/Streamlined:**
  *   Deep philosophical debate about particularism vs. generalism.
  *   Exhaustive listing of every possible ethical principle.
  *   Aiming for universal moral truths. We seek *contextually robust* rationales, applicable to *sufficiently similar* future cases.

  ---

  **The Contextual Rationale Protocol: 1-Hour Structure**

  **(0-5 mins) Case Presentation:** Standard overview (medical facts, stakeholders, conflict, team's ask).

  **(5-20 mins) Feature Extraction & Holism Interrogation:**
  1.  **List Key Features:** Brainstorm features cited as ethically significant (e.g., "futility judgment," "family insistence," "patient alone," "history of violence," "religious belief X," "high resource use").
  2.  **Interrogate Each Feature (Critical Step - Holism):** For *each* feature, ask:
      *   *"In this exact situation, does this feature count* ***for*** *a specific course of action, count* ***against*** *it, or is it* ***ethically neutral/moot*** *here? Why specifically? What would change if this feature were absent or different?"*
      *   *"Could this same feature count the* ***opposite*** *way (or neutrally) in a* ***plausibly different*** *clinical scenario? (e.g., could 'family insistence' sometimes be protective, sometimes obstructive? Could 'patient alone' sometimes increase autonomy focus, sometimes increase surrogate need?)"*
      *  **Output:** A refined list of features *actively doing ethical work IN THIS CASE*, with their specific valence (+/-) here.

  **(20-35 mins) Relevance vs. Noise Test (Especially for Registry Comparison):**
  1.  **Identify Near-Miss Case(s) from Registry:** Present the paired near-miss case.
  2.  **Focus on Differences:** List key *differences* between current case and near-miss (e.g., "Family present vs. absent," "Violence history vs. none," "Same diagnosis but different functional baseline").
  3.  **Test Difference Significance:** For each difference, ask:
      *   *"Does this difference* ***change the ethical valence*** *(+/--/neutral) of any core feature identified in Step 2?"*
      *   *"Does this difference* ***introduce a new, ethically significant feature*** *not present in the near-miss case?"*
      *   *"If we swapped ONLY this difference between the two cases, would our ethical recommendation likely change? Why/Why not?"*
      *  **Output:** Determination if the difference is a ***Relevant Reason*** (alters valence or introduces significant new feature) or ***Contextual Noise*** (doesn't fundamentally alter the ethical calculus despite surface difference).

  **(35-50 mins) Crafting (or Rejecting) the Rationale:**
  1.  **Review Active Features:** Look at features confirmed as ethically significant + their valence (Step 2).
  2.  **Attempt Formulation:** Try drafting a one-sentence rationale: "When [Key Contextual Condition(s)] are present, [Ethical Imperative] holds significant weight over [Conflicting Imperative] primarily due to [Active Feature(s) and their Valence]." *OR* a principle-like statement *explicitly tied to context*: "In circumstances where [Feature A] manifests as [Valence] AND [Feature B] manifests as [Valence], [Action/Principle] is ethically required/permissible/prohibited because [Link]."
  3.  **Stress Test the Rationale:**
      *   *"Does this rationale* ***accurately reflect*** *the specific ethical work the features did in* ***this*** *case (Step 2)?"*
      *   *"Does it hold if we apply the* ***Holism Test*** *- would the same rationale break if a key contextual feature changed slightly but plausibly?"*
      *   *"Does it* ***meaningfully distinguish*** *this case from its near-miss where the outcome differed (Step 3)?"*
      *   *"Would applying this rationale to a* ***significantly different context*** *lead to an unethical outcome? If yes, how would we qualify the context?"*
  4.  **Decision Point:**
      *   If it passes the stress test: **Finalize the rationale.**
      *   If it fails (too fragile, distinctions unclear, relies on irreducible uniqueness): **"No generalizable rationale applicable beyond the irreducible specifics of this case."**

  **(50-60 mins) Documentation & Sign-off:**
  *   Record the rationale **OR** the "no generalizable rationale" statement.
  *   **Mandatory Note:** If "no rationale," briefly state *why* (e.g., "Unique confluence of factors X, Y, Z defies reduction"; "Difference from Case #123 deemed irreducible contextual noise").
  *   Committee sign-off.

  ---

  **What This Can't Do:**
  1.  **Eliminate Disagreement:** Judgment calls remain at every step (e.g., valence assignment in Holism step, Relevance vs. Noise). The procedure structures the debate but doesn't resolve it magically.
  2.  **Guarantee a Rationale:** Some cases *are* irreducibly particular. The procedure forces acknowledgment of this.
  3.  **Remove All Bias:** It mitigates bias by demanding explicit justification for feature valence (Step 2), but vigilance is still needed.
  4.  **Replace Experience:** It's a scaffold. Skilled facilitation and committee experience are irreplaceable.

  ---

  **Application to Your Cases:**

  **Case 1: Family Insists on "Futile" ICU Treatment**
  *   **Features:** Medical Futility (Team), Family Autonomy/Religious Belief, Suffering/Burdens (Patient), Resource Allocation (System).
  *   **Holism Interrogation:**
      *   *Futility:* Counts **against** continued treatment *here* (specific physiology, prognosis). Could count *for* continued treatment in a case of diagnostic uncertainty.
      *   *Family Insistence:* Counts **for** continued treatment *here* (strong belief, surrogate role). Could count **against** if insistence was manipulative or contradicted known patient wishes.
  *   **Relevance vs. Noise:** Comparing to a case where treatment stopped due to family agreement. Key difference: **Family Insistence Valence**. Here it's a strong *for* continuing factor; in the other case, it was neutral or *against*.
  *   **Rationale Attempt:** "When clear medical futility imposes disproportionate burdens *and* surrogate decision-makers hold sincere, stable beliefs that continuing life-sustaining treatment honors the patient's identity/values despite futility, respect for surrogate autonomy carries decisive weight."
  *   **Stress Test:** Passes? Does it hold if family insistence was based on financial motive (fails - valence changes)? Does it hold if futility was less certain (fails - context changes)? **Likely Passes** if "sincere, stable beliefs linked to patient identity" is core. **Output:** This rationale (or similar). *You might dislike this if you strongly favor futility assessments overriding family wishes, but the procedure surfaces the specific ethical weight given to the family's reason here.*

  **Case 2: Near-Identical Twin (No Family)**
  *   **Features:** Patient Incapacity, Absence of Surrogate, Medical Recommendation (same as prior case), Patient's Prior Wishes (if any).
  *   **Holism Interrogation:**
      *   *No Family at Bedside:* Counts **significantly for** relying more heavily on formal advance directives/institutional policy/ethics committee deliberation *here* (no immediate surrogate). Contrast: In prior case *with* family, their presence counted **for** deferring to surrogate process.
  *   **Relevance vs. Noise:** Comparing to prior case with family. Key Difference: **Absence of Surrogate.** Test: Does this change the valence of other features? **Yes.** "Patient Incapacity" now triggers a different decision-making pathway (policy/committee vs. surrogate). This difference is a **Relevant Reason**.
  *   **Rationale Attempt:** "When a patient lacks decisional capacity *and* no legally authorized surrogate is available or engaged at the bedside, the ethical imperative shifts towards making treatment decisions based primarily on documented prior wishes, applicable institutional policy, and transparent ethics committee deliberation, prioritizing the patient's inferred best interests."
  *   **Stress Test:** Passes? Does it hold if a distant, disengaged surrogate exists (fails - context changes)? Does it distinguish from the prior case (Yes - presence/absence of engaged surrogate changes the mechanism). **Output:** This rationale.

  **Case 3: History of Violence Towards Staff**
  *   **Features:** Threat to Staff Safety, Patient's Medical Needs, Patient's Decisional Capacity (possibly impaired), Staff Anxiety/Bias, Duty to Provide Care.
  *   **Holism Interrogation (Crucial):**
      *   *History of Violence:* Counts **for** implementing heightened safety protocols *here* (specific credible history). Counts **for** carefully assessing current agitation/capacity *here*. *Could it count neutrally?* Only if the history was ancient, unrelated to current context, and posed zero credible risk - unlikely.
      *   *Staff Anxiety:* Is this a *feature* or a *reaction*? Needs testing. Does it influence judgment *independently* of the actual risk? (Hard to isolate).
  *   **Relevance vs. Noise:** Compare to a non-violent patient with same medical need. Key Difference: **Violence History/Perceived Threat.**
  *   **Rationale Attempt (Difficult):** "When a patient presents a credible and specific risk of violence to healthcare staff based on documented history or current behavior, the ethical obligation to ensure staff safety becomes a primary factor justifying modified care approaches (e.g., security presence, sedation for safety during essential care) that balance safety with the duty to provide necessary medical treatment, even if such modifications might not be optimal absent the threat."
  *   **Stress Test:**
      *   *Valence Accurate?* Yes, the violence risk counts *for* modified care *here*.
      *   *Holism Test:* Would this rationale break? If violence was provoked by untreated, reversible delirium (context change), the rationale might hold but the *cause* shifts focus to treating delirium. If the history was decades old, no recent issues, and staff anxiety was high based on rumor (context change), applying "modified care" might be unethical bias - **Rationale FAILS** the holism test. It's too fragile without specifying *credible and specific current risk*.
      *   *Bias Test:* Can the committee *genuinely* separate the *objective risk* (a genuine reason) from *subjective staff anxiety* (a potential bias)? If not, the rationale is tainted. **Output:** If credible risk is clear and distinct from bias: Use rationale. If risk is low/ambiguous and anxiety is high: **"No generalizable rationale; decision based on irreducible assessment of credible risk vs. potential bias in this specific context."** *This is the honest flag you want.*

  **Key Takeaway:** This procedure forces explicit justification of contextual reasons, rigorously tests for generalizability via holism and comparison, and provides a clear, ethical path to documenting when no rationale exists. It makes the judgment calls visible but contained within a structured, particularism-informed process. The "no rationale" outcome is not a failure of the process, but its honest result when faced with irreducible complexity.
