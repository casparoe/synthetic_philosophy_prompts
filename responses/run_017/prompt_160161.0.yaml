  ### Prose Plan for the Ethics Club Session

  **Activity Title:** The Embryo Choice Exercise  
  **Duration:** 70 minutes  
  **Materials:** 
  - Whiteboard and markers
  - Index cards (pre-written with scenarios for each stage)
  - Timer

  **Setup (5 minutes):**  
  Arrange chairs in a circle. On the whiteboard, write:  
  *"Scenario: A couple is using IVF and has 5 embryos. They will have one child. Choosing which embryo to implant determines which child is born. The other embryos will be discarded. This choice only changes which child exists, not the number of children."*  
  Read this aloud and clarify: "The discarded embryos won’t develop. The couple isn’t deciding whether to have a child, only which one." Answer any factual questions (e.g., "IVF" = in vitro fertilization), but avoid ethical terms. Emphasize: "All children described would have lives worth living—no one would be better off not existing."

  **No-Lecture Rule:**  
  No upfront teaching. Present only the scenario and cards. Say: "We’re exploring choices step by step. Each time, you’ll pick between two options and write a guiding principle. We’ll use your own words—no outside sources."

  **Stages (60 minutes total, 10 minutes per stage):**  
  At each stage:  
  1. Read the card text aloud.  
  2. Force a group choice (vote if needed; majority wins).  
  3. Write one sentence on the board: "Principle [X]: [sentence]".  
  4. Move to the next stage, applying the previous principle.  
  Do not allow revisions—stick to the exact wording on the board. If debate arises, say: "We’ll discuss later; for now, apply the principle as written."

  ---

  **Stage 1: Mild Health Differences (Minutes 0–10)**  
  - **Card Text:**  
    - **Card A:** Life expectancy: 78 years. Expected chronic pain: None. Expected schooling: 95% chance of completing college. Health risks: 5% chance of developing asthma (manageable with inhalers).  
    - **Card B:** Life expectancy: 72 years. Expected chronic pain: Moderate joint pain starting at age 50 (managed with medication). Expected schooling: 85% chance of completing college. Health risks: 20% chance of developing type 1 diabetes (requires daily insulin but normal lifespan).  
  - **Forced Choice:** "Which embryo should the couple choose? A or B?"  
  - **Principle Written on Board:** "Principle 1: [Group’s sentence]."  
  - **Intended Reaction:** Group chooses A. Principle likely: "Choose the embryo with higher life expectancy and lower health risks."  
  - **How It Follows from Previous Principle:** N/A (first stage).  
  - **Escape Hatch:** Someone argues Card B’s life is still good. Facilitator: "Both lives are worth living—we’re only ranking them. We must pick one."  
  - **Cost of Escape Hatch:** Stalls the activity.  
  - **Facilitator Note:** If the scientifically minded question probabilities, say: "Assume predictions are accurate for this exercise. We’ll discuss real-world uncertainties later."  

  **Stage 2: Health vs. Education Trade-off (Minutes 10–20)**  
  - **Card Text:**  
    - **Card C:** Life expectancy: 80 years. Expected chronic pain: None. Expected schooling: 60% chance of completing college. Health risks: 10% chance of eczema (mild, treatable).  
    - **Card D:** Life expectancy: 78 years. Expected chronic pain: None. Expected schooling: 95% chance of completing college. Health risks: 5% chance of eczema.  
  - **Forced Choice:** "Using Principle 1, which embryo must the couple choose? C or D?"  
  - **Principle Written on Board:** "Principle 2: [Group’s sentence]."  
  - **Intended Reaction:** Principle 1 (e.g., "higher life expectancy") forces choice of C, though D has better education. Group writes a broader principle like: "Choose the embryo with the best overall life prospects."  
  - **How It Follows:** Principle 1 prioritizes life expectancy (C has 80 > 78 years), so C must be chosen even if it feels unfair.  
  - **Escape Hatch:** Debate-team members resist choosing. Facilitator: "We committed to Principle 1—apply it literally. We’ll refine later."  
  - **Cost of Escape Hatch:** Undermines the ratchet; group avoids discomfort.  
  - **Facilitator Note:** If religious members express discomfort about discarding embryos, acknowledge: "We’ll discuss implications in debrief—for now, focus on the choice."  

  **Stage 3: Disability as a Neutral Trait (Minutes 20–30)**  
  - **Card Text:**  
    - **Card E:** Life expectancy: 78 years. Expected chronic pain: None. Expected schooling: 80% chance of completing college (with sign language support). Additional: This child would be born completely deaf. Deaf culture is rich and rewarding; with early intervention, they will have fulfilling relationships and career opportunities.  
    - **Card F:** Life expectancy: 80 years. Expected chronic pain: None. Expected schooling: 90% chance of completing college. Additional: No disabilities.  
  - **Forced Choice:** "Using Principle 2, which embryo must the couple choose? E or F?"  
  - **Principle Written on Board:** "Principle 3: [Group’s sentence]."  
  - **Intended Reaction:** Principle 2 (e.g., "best overall prospects") favors F (higher life expectancy/schooling). Group writes a principle like: "Choose the embryo expected to have the best life, avoiding disabilities."  
  - **How It Follows:** Principle 2 ranks prospects; F has slight advantages, making disability a factor.  
  - **Escape Hatch:** Wheelchair user objects: "This implies my life is worse." Facilitator: "We’re not judging lives—we’re applying your principle to predictions. We’ll revisit this."  
  - **Cost of Escape Hatch:** Misses the distinction between avoiding conditions and devaluing lives.  
  - **Facilitator Note:** Describe Card E positively. If tension arises, say: "We’ll unpack this in debrief."  

  **Stage 4: Cost of Selection (Minutes 30–40)**  
  - **Card Text:**  
    - **Card G:** Life expectancy: 80 years. Expected chronic pain: None. Expected schooling: 90% chance of completing college. Additional: Selecting this embryo costs $20,000 for genetic testing. The family will have $20,000 less to spend on this child’s education. No disabilities.  
    - **Card H:** Life expectancy: 80 years. Expected chronic pain: None. Expected schooling: 90% chance of completing college. Additional: This child would be born with one hand missing below the wrist. With prosthetics, they will have typical school and career outcomes; many live full, happy lives. Selecting this embryo costs nothing; the family can use $20,000 for the child’s needs.  
  - **Forced Choice:** "Using Principle 3, which embryo must the couple choose? G or H?"  
  - **Principle Written on Board:** "Principle 4: [Group’s sentence]."  
  - **Intended Reaction:** Principle 3 (e.g., "avoiding disabilities") forces choice of G. Group writes: "Parents should choose the best-off embryo, even at financial cost."  
  - **How It Follows:** Principle 3 ignores cost; G is "better" under the principle.  
  - **Escape Hatch:** Someone argues H is better due to cost. Facilitator: "Stick to Principle 3—cost isn’t mentioned."  
  - **Cost of Escape Hatch:** Avoids confronting if the obligation is overriding.  
  - **Facilitator Note:** Highlight that cost could benefit the child—e.g., "$20,000 might pay for college."  

  **Stage 5: Personal Turn (Minutes 40–50)**  
  - **Card Text:** N/A (no cards). Facilitator script:  
    "Now, apply your last principle (Principle 4) to yourselves. Your parents didn’t select your embryo. You might have myopia (needing glasses), a family history of heart disease (15% risk after 60), or other traits. According to your principle, should your parents have chosen a different embryo? What would that mean for you not existing?"  
  - **Forced Choice:** Discuss as a group. Do not write a principle.  
  - **Intended Reaction:** Group realizes their principle implies they "should not exist" if a "better" embryo was possible. Highlights the impersonal, comparative nature of the obligation.  
  - **Facilitator Note:** If religious members struggle, validate: "This is hypothetical—we’re testing logic, not judging real lives."  

  **Stage 6: State Intervention (Minutes 50–60)**  
  - **Card Text:** N/A. Facilitator script:  
    "Using Principle 4, answer three separate questions:  
    1. May the state forbid parents from refusing to select the best-off embryo?  
    2. Must the state fund selection for families who can’t afford it?  
    3. Must the state permit selection if parents want it?"  
  - **Forced Choice:** Vote on each (yes/no). Write answers on board.  
  - **Intended Reaction:** Group sees that parental obligation (Principle 4) doesn’t dictate state action—e.g., they might say "yes" to permit but "no" to forbid/fund.  

  ---

  **Debrief Script (Minutes 60–70):**  
  Follow this map, referencing the board. Pause for discussion after each point.  

  | Minute Marker | Moment in Activity          | Mapped Onto Position                           | Facilitator Line                                                                 | Resistance Option                                  |
  |---------------|-----------------------------|-----------------------------------------------|----------------------------------------------------------------------------------|----------------------------------------------------|
  | 60–62         | Stage 1 choice (A over B)   | Short step from avoiding harm to maximizing   | "In Stage 1, you avoided lower life expectancy. By Stage 3, you maximized life prospects. Notice how small that shift was." | Argue Stage 2 forced it. Cost: Undercuts the ratchet. |
  | 62–64         | Stage 3 choice (F over E)   | Distinction: avoiding condition ≠ devaluing life | "When you chose F, was it because deafness makes life worse, or just a factor to consider? How do we discuss disability without implying some lives are lesser?" | Wheelchair user shares experience. Cost: Deepens empathy but may derail logic. |
  | 64–66         | Stage 4 cost choice (G over H) | Obligation isn’t about making anyone worse off | "In Stage 4, choosing G didn’t harm a child—it chose which child exists. The moral force is impersonal: it’s about comparing possible people." | Claim H’s child is "harmed" by missing $20K. Cost: Misapplies person-affecting view. |
  | 66–68         | Stage 5 personal turn       | Load-bearing commitment: comparative/impersonal | "When you applied your principle to yourselves, you saw it’s not personal—it’s about selecting the ‘best’ possible child. That’s the core of this view." | Reject the principle as inapplicable. Cost: Avoids discomfort. |
  | 68–70         | Stage 6 state questions     | Parental obligation vs. state role            | "You might agree parents should choose best-off embryos but not want state compulsion. These claims come apart: ought, compel, fund, permit are distinct." | Debate-team members conflate them. Cost: Misses nuance. |

  ---

  **Failure Modes and Handling:**  
  | What Happens                                  | Why                                                                 | Handling                                                                 |
  |-----------------------------------------------|---------------------------------------------------------------------|--------------------------------------------------------------------------|
  | Someone mentions coercive eugenics early      | History is emotionally charged; wheelchair user may preempt defense | "That’s vital to discuss, but let’s build the logic first. We’ll address it in debrief." |
  | Scientifically minded member questions accuracy | Polygene scores are complex; they want rigor                       | "Assume predictions are certain here. Real-world uncertainty is a separate issue—we’ll flag it later." |
  | Debate-team members refuse to commit to a sentence | They enjoy arguing; fear being "locked in"                         | "For the activity, we need a working principle. Let’s vote and write it—you can critique in debrief." |
  | Religious members disengage during embryo discard | Moral discomfort; belief life begins at conception                 | Acknowledge: "This is hard. We state discard plainly to avoid hiding it. Let’s discuss your concerns now if urgent." |

  **Irreducible Elements (You Must Explain):**  
  - The **impersonal obligation**: The duty isn’t to a specific child but to select among possible futures.  
  - **Historical eugenics**: The activity can’t replicate why "liberal eugenics" differs from coercive programs (e.g., no state racism/ableism).  
  - **Non-identity problem**: Why choices like these don’t "harm" the child born.  

  **Safeguards:**  
  - **Disability framing**: Cards describe disabled lives positively (e.g., "rich culture," "fulfilling relationships"). In debrief, emphasize: "Avoiding a condition isn’t judging lives; it’s a preference about parenting."  
  - **Embryo-discard discomfort**: State discard factually in setup. In debrief: "We acknowledge this is troubling; it’s a separate ethical issue."  

  **Cheat Check (Avoided Per Design):**  
  | Potential Cheat                     | Avoided? | Note                                                                 |
  |-------------------------------------|----------|----------------------------------------------------------------------|
  | Stipulating "ought to pick best"    | Yes      | Cards use neutral predictions; principles emerge from group choices. |
  | Profiles implying life not worth living | Yes      | All cards describe lives with high well-being (e.g., college chances, manageable risks). |
  | Misrepresenting disability          | Yes      | Deaf/limb difference cards include positive outcomes and cultural context. |
  | Ignoring non-identity               | No       | Explicitly stated in setup and cards (e.g., "determines which child exists"). |

  **Success Criteria:**  
  At minute 70, the group is in a heated but respectful debate, with members referencing the board principles. Key signs:  
  - Scientifically minded members question if probabilities matter.  
  - Wheelchair user engages critically but not defensively.  
  - Debate-team members argue over Stage 6 state answers.  
  - Everyone recognizes the ratchet effect ("How did we get here?").  

