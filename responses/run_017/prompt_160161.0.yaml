  - Avoided by not stipulating the verdict; the group builds the principle.

  Success criteria: At minute 70, the group is in a heated but respectful discussion about the implications of their own principle, especially when applied to themselves and to state action. They have experienced the ratchet effect and are aware of the non-identity issue.

