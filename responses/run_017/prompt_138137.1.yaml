  ok so please pretend you're like an actual professional philosopher who works on confirmation theory and the problem of induction, and take this seriously — think it through properly, brainstorm a couple of candidate diagnoses before you settle on one. i don't want a menu of options, i want you to commit to an answer and defend it, and then tell me how confident you are and what would actually change your mind.

  i'm in this after-school philosophy club thing and i made up an argument and now i can't find the hole in it even though i'm pretty sure its conclusion is insane.

  grue in the usual way: something is grue if it's first examined before 2050 and green, or first examined at or after 2050 and blue. every emerald anyone has ever looked at has been green.

  (1) every emerald examined so far has been green, so the evidence fits "all emeralds are green" (call it G) and "all emeralds are grue" (call it R) exactly equally well — R predicts green for everything that's been examined already.
  (2) evidence can only favor one hypothesis over another by fitting it better.
  (3) so the evidence doesn't favor G over R at all. equal fit, equal support.
  (4) the only extra reason anyone ever offers for preferring G is that "green" is entrenched and "grue" isn't.
  (5) entrenchment is just a fact about how many times people have actually projected some word in the past.
  (6) how often people have happened to use a word can't make a claim about emeralds any more likely to be true — saying a word a lot doesn't make rocks green.
  (7) so entrenchment gives no reason either, and there's nothing left: R is exactly as reasonable to believe as G.

  here's the bit where i think i've proved too much. take R and make the cutoff roll with the moment you think of it. define grue* as: green if first examined before the moment this hypothesis is first written down, blue if first examined after that moment.

  (8) at any moment you like, grue* fits all the evidence available at that moment exactly as well as G does, same reason as (1).
  (9) so at any moment, by (3), grue* is exactly as well supported as G.
  (10) but grue* gets refuted at the very next emerald anyone examines, every single time, forever: i write it down, next emerald examined is green, hypothesis dead; you write it down ten minutes later, next emerald examined is green again, dead again. do that for a thousand years and it never once survives to the observation after next.
  (11) so you've got a hypothesis that's been refuted at the next observation on literally every occasion it's ever been formulated, and on every one of those occasions it was exactly as well supported by all the evidence there was as the hypothesis that's succeeded every single time.

  that obviously can't be right. and i think it proves too much, because if (2) and (3) are true then no track record of success is ever a reason to expect success, and the whole new riddle thing just collapses straight back into plain humean skepticism about whether the future resembles the past, which i was told wasn't even what the new riddle was about. but every individual step looks fine to me and i can't tell which one is doing the damage.

  which step do you reject, and what does rejecting it cost? i really want to keep (1), and i really want to keep the thought that G is genuinely better supported than R — i'd rather give up pretty much anything else. my friend in the club says the answer is just "grue isn't projectible because it isn't lawlike," and that feels like cheating to me, like renaming the problem instead of solving it. if you think he's basically right, say so and explain why it isn't cheating; if you think he's wrong, say that instead and tell me what the real move is. also please explain why the step you're rejecting looked fine — i want to know what made it trap me.
