  **OFFICE OF THE SORTITION AUTHORITY**  
  **CITIZEN LEGISLATOR ONBOARDING PACKET**  
  **CONFIDENTIAL UNTIL ACCEPTANCE**

  ---

  **SECTION 1: SUMMONS AND CONGRATULATIONS**  

  Dear Citizen [SURNAME],  

  The Office of the Sortition Authority (OSA) is pleased to inform you that you have been randomly selected for distinguished national service as a Member of the Legislative Chamber for the upcoming term (commencing [DATE]). Your unique demographic profile—specifically, your [e.g., AGE BRACKET], [e.g., OCCUPATIONAL CATEGORY], and [e.g., GEOGRAPHIC DESIGNATION]—was statistically vital to achieving a descriptively perfect microcosm of the sovereign populace. Congratulations!  

  This honor reflects the purest expression of democracy, where chance, not aristocratic preference or factional influence, determines service. You were chosen *because* you are typical, not in spite of it. Your duty is simply to *be* present and to vote your conscience as an authentic individual, reflecting the diverse lived experiences of our nation.  

  Participation is mandatory under the National Service Act §7.3. Failure to report constitutes a Tier 3 Civic Infraction. Please complete the enclosed Acceptance and Demographic Affirmation Form (OSA-114b) within 10 business days. A generous stipend, adjusted for your reported household income percentile, will be provided. We eagerly await your contribution to statistically legitimate governance!  

  Sincerely,  
  The Directorate  
  Office of the Sortition Authority  

  ---

  **SECTION 2: FREQUENTLY ASKED QUESTIONS (OSA Form LC-002 Rev. 8)**  

  1.  **What will I actually do?**  
      You will attend scheduled Chamber sessions (remote attendance permitted with prior OSA approval). You will listen to briefings prepared by the Permanent Secretariat. You will vote "Aye," "Nay," or "Abstain" on motions presented to the Chamber. Your primary role is to bring your inherent perspective as an ordinary citizen to the collective decision-making body.

  2.  **Can I research issues or hire staff?**  
      No. Acquiring specialized knowledge or consulting external experts constitutes "de-mirroring" (OSA Regulation 4.1a). De-mirroring distorts your authentic, untutored perspective and undermines descriptive representativeness. All necessary information will be impartially provided by the Permanent Secretariat. Personal staff are prohibited; OSA administrative support is fully provided.

  3.  **Who decides what we vote on?**  
      The Permanent Secretariat, a non-partisan civil service body, drafts all motions for Chamber consideration based on identified national priorities and public sentiment analysis. The Chamber may only vote on motions presented by the Secretariat. Certain matters (constitutional amendments, declarations of war, specific budgetary allocations per Schedule D) are reserved for direct citizen plebiscite and are outside the Chamber's remit.

  4.  **Do experts ever advise the Chamber?**  
      Yes. On complex matters, the Secretariat may arrange Expert Testimony Sessions. To ensure balance and prevent undue influence, experts *always* testify in pre-approved adversarial pairs (e.g., "The Case For/Against Biochar Sequestration"). Members are reminded to weigh testimonies based on their inherent intuitive sense, not acquired technical understanding.

  5.  **How is my vote counted?**  
      Your raw vote is recorded. However, to maintain the Chamber's perfect descriptive mirror of the populace throughout the term, Statistical Integrity Adjustments (SIA) are applied. If individuals sharing your key demographic characteristics (e.g., age 45-54, manufacturing sector, Northwest region) decline, quit, or are excused, your vote may be weighted (e.g., 1.37x or 0.62x) to compensate for their absence. This ensures the *collective* output remains truly representative, regardless of individual participation variance. Your personal SIA multiplier will be confidential.

  6.  **What if the Chamber is tied on a vote?**  
      A tied vote signifies perfect societal equipoise on the issue. In such cases, the motion is resolved by Secondary Sortition (OSA Regulation 9.7): a fresh, single-question lottery is conducted among the entire eligible citizenry. This reaffirms the foundational democratic principle that ultimate judgment resides in the random selection of the whole people.

  7.  **Do I represent my community/group?**  
      No. You were chosen randomly as an individual statistical unit. You embody demographic characteristics essential for descriptive accuracy, but you do not act as a delegate or representative for any specific constituency, interest group, or identity bloc. You speak and vote only for yourself, as part of the statistically aggregated whole.

  ---

  **SECTION 3: CHAMBER MEMBER CODE OF CONDUCT (Mandatory Compliance)**  

  *   **Attend Faithfully:** Unexcused absences exceeding 3 sessions trigger review and potential Civic Infraction.
  *   **Maintain Authenticity:** Refrain from researching Chamber business. De-mirroring (seeking external data, policy analysis, or expertise) is strictly prohibited. Report any accidental exposure to unauthorized information immediately.
  *   **Utilize Secretariat Resources Exclusively:** Rely solely on briefings, data summaries, and motion texts provided by the Permanent Secretariat. Do not solicit or accept information from lobbyists, advocacy groups, or unvetted individuals.
  *   **Vote Conscientiously:** Vote based on your genuine, uncoerced reaction to the information presented. Do not coordinate voting blocks or make promises regarding your vote.
  *   **Respect the Adversarial Process:** During expert testimony, listen impartially to both presented viewpoints. Do not seek out or favor additional perspectives.
  *   **Accept SIA Adjustments:** Understand and accept that your individual vote's mathematical weight (SIA) is a necessary mechanism for preserving the Chamber's aggregate descriptive validity. Do not disclose your SIA multiplier.
  *   **Uphold Confidentiality:** Chamber deliberations and draft motions are confidential until public release by the Secretariat.
  *   **Avoid Grandstanding:** You are a typical citizen serving a vital statistical function. Refrain from making public pronouncements claiming to "represent" demographics or advocating for specific outcomes beyond your vote.
  *   **Prepare for Rotation:** Serve your single, non-renewable term diligently. Upon rotation out, you return seamlessly to private citizenship. No post-service lobbying or leveraging of Chamber experience is permitted for a period of 5 years.

  ---

  **Welcome to the People's Chamber! Your typicality is your strength.**  
  **OSA: Ensuring Democracy Through Random Sampling Since [YEAR].**
