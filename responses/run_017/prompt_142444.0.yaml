prompt: |-
  I chair the ethics advisory board of a research institute that runs behavioural-science field experiments at roughly forty sites across twenty-five countries. We clear about forty protocols a year, usually within forty-eight hours, with a two-person review team (one behavioural scientist, one regional programme lead) and my signature at the end. Most of the objections we get from local partners are moral rather than legal, and we handle them ad hoc: sometimes we localize a protocol, sometimes we insist on the home standard, sometimes we quietly drop a site, and we could not afterwards say why we did any of these.

  Please write the decision procedure my reviewers should run on every protocol, in the order they should run it. It has to be operationalized from the debate about cross-cultural variation in folk morality and what that variation does or does not show about moral objectivity. I have a two-page summary of that literature in front of me, so I do not need citations, studies, or reading recommendations; I need the reasoning made usable by reviewers with no philosophy training, no new data collection, and two days per protocol.

  Three things the procedure has to get right, and I suspect they are where the conceptual work is. First, it must sort each disagreement into more than difference of degree: separate cases where the parties agree on the principle and disagree about the nonmoral facts or about which description of the act is the salient one; cases where a shared set of considerations is simply weighted differently; and cases where one side treats something as a moral consideration the other does not recognize at all. Tell me which distinctions survive simplification and which my reviewers can safely collapse. Second, it must say who counts as a source of the local norm. Our local partners and in-country ethics reviewers are usually urban, university-trained and grant-funded, and I worry that the sampling problem our summary describes simply reappears one level down, so that deference to them can mistake a local elite's view for the local view. Third, it must include a reverse test: for any norm we are willing to relax abroad, the reviewer must record in advance what finding at another site would make us revise the home standard. If a norm cannot be given such a test, I want to know whether we are applying a principle or merely exporting one, and what the procedure should do then.

  Give me the stop rules: where it returns a no and drops the site, where it clears the protocol as localized, and where it stops and hands the decision to me because the remaining question is one of values rather than facts.

  Then run it on three protocols. One: a standard deception design in which participants are misled about how a sum of money was split, where the local partner says the debriefing will cause the participants lasting shame in a way the home site would not experience. Two: a consent procedure where the in-country reviewer asks that a household head's permission substitute for written individual consent, at two sites with quite different kinship structures. Three: payment for participation, which at one site is read as a wage and at another as a gift, with the two readings carrying opposite obligations. At least one of these should yield an answer I will not like, and I want you to say which and why. Close with an honest statement of what this procedure cannot do.
reasoning: |-
  We are designing a decision procedure for ethical review of cross-cultural behavioral science experiments. The procedure must be operationalized from the debate on cross-cultural variation in folk morality and must address three key issues: categorizing disagreements, identifying sources of local norms, and including a reverse test for any relaxed norm.

  The procedure will be run by a two-person review team (one behavioral scientist, one regional program lead) and must be executable within a short time frame without new data collection. The output will be one of: (1) clear as is (home standard), (2) clear with localization, (3) drop the site, or (4) refer to the chair (for value conflicts).

  We break the procedure into steps:

  **Step 1: Identify the ethical disagreement**
     - Clearly state the ethical concern raised by the local partner or in-country reviewer. What is the specific practice they object to? What is their alternative proposal?
     - Note: The objection might be about the experimental protocol (e.g., deception, consent, payment) and the proposed change (e.g., alter debriefing, change consent procedure, adjust payment framing).

  **Step 2: Categorize the nature of the disagreement**
     We use the following three categories (simplified from philosophical distinctions):
     - **Category A: Disagreement about non-moral facts or act description** (e.g., both agree on the principle of avoiding harm, but disagree on whether a particular act causes harm in the local context).
     - **Category B: Disagreement in weighting of shared moral considerations** (e.g., both agree on the principles of autonomy and community welfare, but the local context gives more weight to community than the home standard does).
     - **Category C: Disagreement on the recognition of a moral consideration** (e.g., the home standard treats individual consent as a fundamental requirement, but the local norm does not recognize individual consent as relevant, instead focusing on communal or hierarchical authority).

     How to distinguish:
     - For **Category A**: Ask: "If the non-moral facts were as the local partner claims, would we agree with their conclusion?" If yes, then it's A.
       Example: Deception causes lasting shame in the local context but not at home. If true, then avoiding shame (a shared moral consideration) would require altering the debriefing.
     - For **Category B**: Ask: "Do both sides acknowledge the same set of moral reasons (e.g., autonomy, welfare, fairness), but assign different priorities?" If yes, then it's B.
       Example: Consent must be individual (home) vs. household head (local). Both value consent and welfare, but the local context prioritizes household harmony over individual autonomy.
     - For **Category C**: Ask: "Does the local partner reject the moral relevance of a consideration that the home standard considers fundamental?" If yes, then it's C.
       Example: The home standard considers payment as a wage creating a contractual obligation, but in one site, payment is seen as a gift creating a reciprocal obligation. If the reciprocal obligation is not recognized at home as a relevant moral consideration (or vice versa), then it's C.

     Simplify: We collapse more nuanced philosophical categories (e.g., variations in moral ontology) into these three. The critical distinction is whether the disagreement is factual (A), about priority (B), or about the very moral framework (C).

  **Step 3: Verify the source of the local norm**
     - We must avoid mistaking the view of a local elite (e.g., urban, university-trained) for the view of the participants or the broader community.
     - Steps to take:
       a. Ask the local partner to provide evidence that their objection reflects the views of the study population (e.g., from prior studies, community consultations, or local ethics committees that include community representatives).
       b. If the objection is about potential harm (e.g., shame from debriefing), ask for specific examples or cultural narratives that support this.
       c. If the local partner cannot provide such evidence, and the objection seems based on personal or elite opinion, then treat the objection as speculative and weigh it against the home standard.
       d. If the objection is about a norm that the local partner claims is held by the community, but the community is heterogeneous, then we must consider the risk of harm to subgroups (e.g., women, lower castes) who might not share the elite view.

     - Decision rule: If the local partner cannot substantiate that the objection is grounded in the community's norm (and not just elite view), then the reviewers should proceed with the home standard unless there is evidence of potential harm. However, if the objection is about harm, even without community validation, we must take it seriously and move to Step 4.

  **Step 4: Apply the reverse test**
     For any norm that we consider relaxing in the local context (i.e., we are considering localizing the protocol), we must record:
     - What finding at another site (including the home site) would cause us to revise the home standard? Specifically, if we accept a practice at a foreign site, what evidence would make us adopt that practice at home?

     This test has two purposes:
     - If a norm can pass the reverse test (i.e., we can specify such evidence), then we are treating the norm as potentially universal and are open to learning. This suggests we are applying a principle that might be implemented differently in different contexts (but the core moral consideration remains).
     - If a norm cannot pass the reverse test (i.e., we cannot imagine any evidence that would make us change the home standard), then we are merely exporting our own standard and not engaging in moral reasoning. In such a case, we must question whether we should relax the norm at all.

     Example: If we allow household head consent in one site, the reverse test might be: "If we found that household head consent in the home context led to better participant outcomes (e.g., reduced distress, higher participation) without compromising individual autonomy (e.g., individuals still felt free to decline), then we might revise the home standard to allow it."

     If we cannot formulate a reverse test (e.g., because the home standard is taken as absolute and non-negotiable), then we are applying a principle without regard to context. The procedure then requires escalating to the chair.

  **Step 5: Decision rules**
     Based on the above, we have the following stop rules:

     - **Drop the site (No)**: 
       - If the disagreement is in Category C (fundamental moral consideration not recognized) and the reverse test cannot be formulated (or fails) and the home standard cannot be relaxed without violating core ethics.
       - If the local norm cannot be implemented without causing unacceptable harm (even after localization) and the home standard is not feasible.

     - **Clear with localization (Localize)**:
       - If the disagreement is in Category A (factual) and the localization addresses the factual difference (e.g., altering debriefing to avoid shame).
       - If the disagreement is in Category B (weighting) and the localization respects the local weighting without abandoning a core principle (and the reverse test is passed).
       - If the disagreement is in Category C but the reverse test is passed (i.e., we are open to revising the home standard based on evidence) and the localized protocol does not cause unacceptable harm.

     - **Clear as is (Home standard)**:
       - If the objection is not substantiated (Step 3) and there is no evidence of harm.
       - If the disagreement is in Category A but the non-moral facts do not hold (e.g., the claim about shame is not supported by evidence).

     - **Refer to chair**:
       - If the disagreement is in Category C and the reverse test cannot be formulated (i.e., we cannot specify what would change our home standard) but we are considering localization anyway. This is a values conflict.
       - If there is uncertainty about the source of the local norm (Step 3) and the potential harm is high, requiring a trade-off between respect for local context and protection of participants.
       - If the reverse test reveals a fundamental inconsistency in our ethical framework.

  **Now, run the procedure on the three protocols:**

  **Protocol 1: Deception design with debriefing causing shame**
     - Step 1: Objection: Debriefing will cause lasting shame to participants in a way that wouldn't happen at home.
     - Step 2: Categorize: 
          - This is likely Category A (non-moral fact). Both sides agree on the principle of avoiding unnecessary harm (shame is a harm). The disagreement is about whether the debriefing causes shame in this context.
     - Step 3: Source of local norm: 
          - The local partner must provide evidence that shame is a likely outcome (e.g., past experiences, cultural knowledge). If they can (e.g., they cite examples of similar situations leading to shame), then we proceed. If not, we might clear as is.
          - Assume they provide evidence (e.g., in this culture, being deceived is deeply humiliating and public debriefing compounds it).
     - Step 4: Reverse test: 
          - What finding would make us change the home standard? If we found that in the home context, debriefing caused lasting shame to participants (e.g., through follow-up surveys showing psychological harm), we might change our debriefing procedure at home to minimize shame.
          - This test is passed: we can specify evidence that would change the home practice.
     - Decision: 
          - Localize the debriefing to avoid shame (e.g., private debriefing, culturally sensitive wording, or in some cases, omission of debriefing if the harm is severe and the study benefits are high and cannot be achieved otherwise, but this is rare). 
          - However, note: if the debriefing is essential for informed consent after the fact, we must ensure the core ethical principle of debriefing is met. Therefore, we must find a way to debrief without causing shame. If that is impossible, we might drop the site.

  **Protocol 2: Consent by household head at two sites with different kinship structures**
     - Step 1: Objection: The in-country reviewer asks that household head permission substitute for written individual consent.
     - Step 2: Categorize:
          - This could be Category B (weighting) or Category C (recognition). 
          - If the local context values communal decision-making and individual consent is seen as disruptive (but still recognized as having some weight), then it's B. 
          - If the local context does not recognize individual consent as relevant (only the household head has authority), then it's C.
          - We need to know the kinship structures: 
              Site A: Patrilineal, hierarchical - the household head's decision is binding and individual consent is not sought (Category C?).
              Site B: More egalitarian, but still collective - the household head is a facilitator but individuals may still have input (Category B?).
     - Step 3: Source of local norm:
          - We must ask the in-country reviewer to show that this practice reflects the community's norm and not just bureaucratic convenience. 
          - Also, we must consider if vulnerable individuals (e.g., women, youth) in the community are protected. If the household head system leads to coercion, that's a problem.
          - Without evidence, we cannot assume it's the community norm. But assume they provide evidence (e.g., a community advisory board approved the procedure).
     - Step 4: Reverse test:
          - For household head consent: What finding would make us adopt it at home? 
            - If we found that in home contexts, household head consent led to higher participation rates without compromising individual autonomy (e.g., individuals still felt free to decline and were not coerced) and there was no increase in harm, we might consider it for certain populations (e.g., minors, dependent adults) but likely not for all. 
            - However, the home standard (individual consent) is deeply entrenched. We might not be able to imagine a scenario where we replace individual consent with household head consent for competent adults at home. Thus, the reverse test might fail for a complete substitution.
     - Decision:
          - For Site B (Category B, weighting): Localize by having household head permission plus individual oral consent (not written, if writing is the issue). This respects the collective process but still checks individual willingness. Reverse test: If we found that in home contexts, adding a family consultation step improved decision-making without reducing autonomy, we might adopt that. So, pass reverse test -> Localize.
          - For Site A (Category C, non-recognition): If the household head is the sole authority and individuals have no say, then the reverse test fails (we cannot see adopting that at home). Then, we must consider: is individual consent a non-negotiable principle? If yes, we cannot relax it. We might drop the site. But if we think the study is vital and we can add safeguards (e.g., private opportunity to decline after the head consents), we might localize with caution. However, without individual consent, it is a fundamental departure. This must be referred to the chair because it is a values conflict: are we willing to sacrifice individual autonomy for cultural respect? The chair must decide.

  **Protocol 3: Payment as wage vs. gift**
     - Step 1: At one site, payment is read as a wage (creating obligation to work); at another, as a gift (creating reciprocal obligation). The obligations are opposite: wage implies you must complete the task, gift implies you are free to reciprocate as you wish (but might feel pressured to give back more).
     - Step 2: Categorize:
          - This is Category C: the moral consideration (the nature of the obligation created by payment) is different. At the wage site, payment is seen as creating a contractual obligation. At the gift site, it creates a relational obligation. The home standard might view payment as compensation without creating undue obligation (a neutral frame).
     - Step 3: Source of local norm:
          - The local partners must provide evidence that these interpretations are common in the community (e.g., ethnographic studies, focus groups). Without evidence, we default to the home standard (neutral framing). Assume evidence is provided.
     - Step 4: Reverse test:
          - For the wage site: What would make us view payment as a binding wage at home? If we found that in home contexts, framing payment as a wage increased task completion without causing distress, we might use that framing. But we would worry about coercion. So, we might not adopt it if it increased coercion. The test can be formulated but with constraints.
          - For the gift site: What would make us view payment as a gift at home? If we found that gift framing increased trust and long-term participation without creating undue obligation, we might consider it. But we would worry about reciprocity pressures. The test is possible.
          - However, the core issue is the obligation created. We must avoid undue inducement or coercion. The reverse test must focus on whether the framing creates coercion or undue influence that invalidates consent.
     - Decision:
          - We must reframe the payment to avoid both extremes (wage and gift) if possible, using a neutral frame (e.g., "compensation for your time"). 
          - If that is not possible (because the local context will interpret it as wage or gift regardless of framing), then:
            - At the wage site: If the wage framing creates an obligation that might coerce participants to complete tasks they would otherwise refuse, that is a problem. We must adjust the payment structure (e.g., pro-rata for partial completion) and emphasize voluntariness. Localize by clarifying in the consent that they can withdraw without penalty. Reverse test: If we found that a wage framing at home did not increase coercion, we might use it. So, we can localize with safeguards.
            - At the gift site: If the gift framing creates a reciprocal obligation that might lead to participants feeling they must do more than required (e.g., agree to future studies), then we must clarify that the payment is for the current study only and they are free to decline future studies. Reverse test: If we found that gift framing did not create undue obligation at home, we might use it. So, localize with clarifications.
          - If the local interpretation is so strong that it cannot be mitigated by framing and safeguards, and it creates a significant risk of coercion (wage) or undue influence (gift), then we drop the site.

  **Which one might yield an answer you won't like?**
     Protocol 2 (consent) at Site A (hierarchical kinship) might yield a "drop the site" or "refer to chair" if we cannot accept the lack of individual consent. This is because the reverse test fails (we cannot imagine replacing individual consent at home) and it involves a fundamental moral principle. If the chair is unwilling to compromise on individual consent, then we drop the site. This might be disliked because it might exclude a site from an important study.

  **What the procedure cannot do:**
     - It cannot resolve deep moral disagreements (Category C without a reverse test) without making a value judgment. The chair will have to make that call.
     - It cannot guarantee that we have captured the true local norm (as opposed to an elite view) without extensive fieldwork. We rely on the local partner's evidence.
     - It cannot eliminate the risk of harm entirely; it only minimizes it based on available information.
     - It does not replace the need for ongoing monitoring and post-study feedback to validate our decisions.

  **Final Decision Procedure Steps (for reviewers):**

  1. **Identify the ethical objection and proposed change.**
  2. **Categorize the disagreement:**
     - A: Factual (if facts were as claimed, would we agree? If yes, then A)
     - B: Weighting of shared considerations (if both sides acknowledge the same moral reasons but prioritize differently, then B)
     - C: Recognition (if one side does not recognize a moral consideration, then C)
  3. **Verify the source of the local norm:**
     - Require evidence from the local partner that the objection reflects the community norm (not just elite view).
     - If evidence is lacking and the objection is about harm, proceed to Step 4; if not, clear as home standard.
  4. **Apply the reverse test:**
     - For any proposed localization, record: "What finding at another site would make us revise the home standard to adopt this practice?"
     - If you cannot formulate a reverse test, then the norm is being exported without the possibility of mutual learning. This may require escalation.
  5. **Make a decision:**
     - **Clear as home standard**: If the objection is unsubstantiated (Step 3) or if Category A but facts do not hold.
     - **Localize**: If Category A (with facts holding) or Category B (with reverse test passed) or Category C (with reverse test passed and safeguards). Ensure localization addresses the concern without violating core ethics.
     - **Drop site**: If Category C (no reverse test) and the home standard cannot be relaxed, or if the localized protocol still poses unacceptable harm.
     - **Refer to chair**: If Category C without a reverse test but considering localization, or if there is uncertainty about harm trade-offs, or if the reverse test reveals a fundamental inconsistency.

  This procedure should fit within two days per protocol and does not require new data collection, only evidence from the local partner and existing knowledge.
answer: |-
  Below is a decision procedure for your ethics reviewers, designed to be operationalized from cross-cultural moral variation debates. It addresses your three core requirements: categorizing moral disagreements, identifying valid sources of local norms, and applying a reverse test for any localized norm. The procedure is structured as a step-by-step checklist for reviewers with no philosophy training, using plain language and requiring no new data collection. Total runtime per protocol should fit within two days, including deliberation.

  ---

  ### **Decision Procedure for Cross-Cultural Ethics Review**  
  **Run in order for each ethical objection raised by local partners.**  
  *Outputs: (1) Clear as home standard, (2) Clear with localization, (3) Drop site, (4) Refer to chair.*

  #### **Step 1: Map the Objection**  
  **Task:** Specify the exact ethical concern and the proposed local alternative.  
  - *Ask:* "What specific practice does the local partner object to, and what do they propose instead?"  
  - *Document:* The objection (e.g., "debriefing causes shame"), the local alternative (e.g., "no debriefing"), and the home standard.  
  - *Stop if:* No objection → **Clear as home standard**.  
  - *Time:* 1 hour.

  #### **Step 2: Categorize the Disagreement**  
  **Task:** Classify the disagreement into one of three types. Use the distinctions below (simplified from folk morality debates). Ignore degrees of difference; focus on the root conflict.  
  - **Category A: Fact/Description Disagreement**  
    - *Definition:* Both sides agree on the moral principle but disagree on non-moral facts (e.g., "Does debriefing cause shame?") or how to describe the act (e.g., "Is this payment a wage or a gift?").  
    - *Test:* "If the local partner’s facts/description were true, would we agree with their conclusion?"  
      - Yes → Category A.  
      - No → Move to Category B or C.  
  - **Category B: Weighting Disagreement**  
    - *Definition:* Both sides recognize the same moral considerations (e.g., autonomy, welfare) but prioritize them differently (e.g., community harmony > individual consent).  
    - *Test:* "Do both sides accept all relevant moral considerations, but assign them different importance in this context?"  
      - Yes → Category B.  
      - No → Category C.  
  - **Category C: Recognition Disagreement**  
    - *Definition:* One side treats something as morally relevant that the other does not recognize at all (e.g., household consent as morally necessary vs. morally irrelevant).  
    - *Test:* "Does the local partner argue for a moral rule or consideration that the home standard fundamentally rejects (or vice versa)?"  
      - Yes → Category C.  
  - *Simplifications:*  
    - Collapse "moral ontology" (e.g., objective vs. relative) into Category C.  
    - Treat "salient act description" (e.g., "payment as gift") as a factual issue under Category A.  
  - *Time:* 2–3 hours.

  #### **Step 3: Validate the Local Norm’s Source**  
  **Task:** Verify that the objection reflects the study population’s norms, not just elite views. Addresses sampling bias in local partner input.  
  - *Checks:*  
    1. **Evidence requirement:** Local partner must provide:  
       - Examples from the study population (e.g., past incidents, community feedback).  
       - Or evidence that their team includes non-elite representatives (e.g., rural community leaders, not just urban academics).  
    2. **Risk assessment:** If evidence is weak or elite-only, assume harm risk is low unless:  
       - The objection involves *physical/significant psychological harm* (e.g., shame causing suicide risk).  
       - Or the practice affects *vulnerable groups* (e.g., women, minorities) underrepresented in local partner’s sample.  
  - *Decision rules:*  
    - Evidence provided and no high-risk concerns → Proceed to Step 4.  
    - Evidence weak AND no high-risk concerns → **Clear as home standard**.  
    - Evidence weak BUT high-risk concerns → **Refer to chair**.  
  - *Time:* 3–4 hours (for evidence review).

  #### **Step 4: Apply the Reverse Test**  
  **Task:** For any proposed localization, specify what would make you revise the home standard. Tests if localization reflects universal principles or cultural imposition.  
  - *Process:*  
    - If localizing, state: "We would adopt this practice at home if we observed [X] at another site."  
      - *X* must be a measurable finding (e.g., "higher well-being," "no coercion," "better data quality").  
    - If no *X* can be specified, ask: "Are we applying a principle (e.g., 'avoid harm') or exporting a rule (e.g., 'always debrief')?"  
  - *Stop rules:*  
    - Reverse test passed (plausible *X* specified) → Proceed to final decision.  
    - Reverse test failed (no *X* imaginable) → **Refer to chair** (values conflict).  
  - *Time:* 1–2 hours.

  #### **Step 5: Final Decision**  
  **Task:** Combine Steps 2–4 to output a decision.  
  - **Clear as home standard if:**  
    - Category A + local facts unsubstantiated (Step 3) OR reverse test shows home standard is adaptable (Step 4).  
  - **Clear with localization if:**  
    - Category A + local facts validated (Step 3) AND localization feasible.  
    - Category B + reverse test passed (Step 4) AND no high-risk harm (Step 3).  
    - Category C + reverse test passed (Step 4) AND no rights violation (e.g., coercion).  
  - **Drop site if:**  
    - Category C + reverse test failed (Step 4) OR high-risk harm unavoidable (Step 3).  
  - **Refer to chair if:**  
    - Category C + reverse test failed but localization desired (values conflict).  
    - Uncertainty about harm risk or norm source (Step 3).  
  - *Time:* 1–2 hours (for deliberation).

  ---

  ### **Run the Procedure on Your Three Protocols**  
  #### **Protocol 1: Deception Design with Debriefing Shame**  
  - **Step 1:** Local partner objects to debriefing (causes lasting shame); proposes no debriefing. Home standard requires debriefing.  
  - **Step 2:** **Category A** (both agree deception should minimize harm; disagreement is factual: "Does debriefing cause shame here?").  
  - **Step 3:** Local partner provides examples of shame in similar studies. Validation passes (non-elite evidence cited).  
  - **Step 4:** Reverse test: "Adopt no-debriefing at home if data shows it prevents severe harm (e.g., depression) without compromising consent." Test passed.  
  - **Decision:** **Clear with localization** (e.g., private debriefing or delayed disclosure).  
    - *Why you might dislike this:* If debriefing is core to your ethics, but Category A treats it as adjustable to facts.

  #### **Protocol 2: Household Consent in Two Kinship Structures**  
  - **Site 1 (Hierarchical Kinship):**  
    - **Step 1:** Objection: Individual consent disrespects authority; proposes household-head consent.  
    - **Step 2:** **Category C** (home standard sees individual consent as fundamental; local view does not recognize it).  
    - **Step 3:** Local partner is urban academic; no evidence from rural participants. Validation fails.  
    - **Step 4:** Reverse test: "Adopt household consent at home if data shows it enhances autonomy (e.g., women report feeling safer)." Test passed.  
    - **Decision:** **Clear as home standard** (source not validated).  
  - **Site 2 (Egalitarian Kinship):**  
    - **Step 1:** Same objection.  
    - **Step 2:** **Category B** (both value consent and welfare; local view weights family harmony higher).  
    - **Step 3:** Local partner provides community feedback supporting household consent. Validation passes.  
    - **Step 4:** Reverse test: "Adopt household consent at home if data shows better participation without coercion." Test passed.  
    - **Decision:** **Clear with localization** (household-head consent + individual verbal agreement).  
  - *Why you might dislike this:* Site 1 outcome may seem neocolonial (imposing home standard), but the procedure prioritizes evidence over elite claims.

  #### **Protocol 3: Payment as Wage vs. Gift**  
  - **Site 1 (Wage Reading):**  
    - **Step 1:** Payment seen as wage requiring task completion; proposes lower payment to reduce obligation.  
    - **Step 2:** **Category A** (both agree payment shouldn’t coerce; disagreement is descriptive: "Is this payment coercive?").  
    - **Step 3:** Evidence from past studies shows wage framing causes coercion. Validation passes.  
    - **Step 4:** Reverse test: "Adopt wage framing at home if data shows it improves compliance without undue pressure." Test passed.  
    - **Decision:** **Clear with localization** (frame payment as "appreciation," not wage; reduce amount).  
  - **Site 2 (Gift Reading):**  
    - **Step 1:** Payment seen as gift requiring reciprocity; proposes no payment to avoid obligation.  
    - **Step 2:** **Category C** (home standard sees payment as neutral; local view sees it as creating moral debt).  
    - **Step 3:** Evidence shows gifts create peer pressure. Validation passes.  
    - **Step 4:** Reverse test: "Adopt gift framing at home if data shows it builds trust without exploitation." Test passed.  
    - **Decision:** **Clear with localization** (offer non-cash alternatives, e.g., community donations).  
  - *Why you might dislike this (and the answer you won’t like):** For Site 2, **dropping payment entirely** may harm equity. But the procedure forces this if localization fails (e.g., if no reverse test). Here, it passes, so you avoid the worst outcome.

  ---

  ### **What This Procedure Cannot Do**  
  1. **Resolve deep moral conflicts:** When Category C fails the reverse test (e.g., household consent at Site 1), it flags a values clash but cannot solve it—that’s your role as chair.  
  2. **Eliminate epistemic injustice:** It reduces elite bias but can’t guarantee perfect representation of local norms without costly fieldwork. Vulnerable groups may still be overlooked.  
  3. **Predict long-term harm:** It relies on immediate, observable evidence; unforeseen consequences (e.g., shame surfacing months later) may slip through.  
  4. **Replace deliberation:** It systematizes reasoning but can’t capture nuance without reviewer judgment (e.g., "high-risk harm" thresholds).  

  **Final Tip:** Use Step 4’s reverse test as a litmus paper. If you can’t imagine revising the home standard, you’re likely exporting a rule, not applying a principle—and that’s when the chair must step in.
