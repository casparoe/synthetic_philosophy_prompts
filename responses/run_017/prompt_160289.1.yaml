  40-50 min (10 min): Facilitator processes the choices:
  1. Separate the cards: C, A, J.
  2. Count the number of Cs and Js.
  3. If there is at least one C and at least one J -> void (because at least two claims: the Cs and the one from the pool). But note: the pool produces exactly one claim. So if there is at least one C and at least one J, then total claims = (number of Cs) + 1 (from the pool) >= 2 -> void.
