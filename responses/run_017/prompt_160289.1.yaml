  Payoff Scaling:
  We set the Stage 1 prize: the winner gets $10 / T (where T is total entries). 
  Stage 2 prize: if awarded, the winner gets $10.

  But note: in Stage 1, the expected payoff per participant is low (max about $0.07 if all submit 1). To make it more meaningful, we can scale up the prize. For example, set the Stage 1 prize fund to $20. Then the prize = $20 / T. Then if all submit 1, the winner gets $20/12≈$1.67, expected value $0.139. If we set Stage 2 to $20, then the winner gets $20. But then the budget might be high. Alternatively, we can use participation points that we convert at the end. For example, set 1 point = $0.05. Then in Stage 1, the prize in points = 2400 / T (because $10 = 200 points? Let me compute: if we want $10 for 120 units, then 1 unit = $10/120 = $1/12. Then in points: if 1 point = $0.05, then $1 = 20 points. So 1 unit = 20/12 = 5/3 ≈1.6667 points. Then the prize in units is 120/T, so in points: (120/T) * (5/3) = 200/T points. Then the winner gets 200/T points. The expected points for a participant with e entries: (e/T) * (200/T) = 200e/T^2.

  But that might be complex. We can simply state: the prize in Stage 1 is $10 multiplied by (120/T)/120 = $10/T. We'll pay in cash to the winner.

  To stay within budget: if we set Stage 1 prize to $10 and Stage 2 prize to $10, then the maximum payout is $20 (if the same person wins both). But we have 12 participants, so we need to budget $20. We can do that.

  But note: in Stage 1, if T is large, the prize is small. We might have a minimum payout of $0.10? But we can round.

  Alternatively, we can use a fixed conversion: 120 units = $10. Then in Stage 1: the prize is (120/T) units, so in dollars: (120/T) * (10/120) = $10/T. Same as above.

  We'll go with:
  - Stage 1: winner gets $10 / T (rounded to the nearest cent).
  - Stage 2: winner (if any) gets $10.

  Total budget: maximum $20, but likely less because Stage 1 prize is diluted.

  Facilitator Script:

  Intro (5 min):
  "Welcome. Today we will play two games that involve strategic decision making. Each game has real monetary stakes. Your choices are anonymous and simultaneous. We will collect your decisions in envelopes. Let's begin with Game 1."

  Stage 1 Explanation (5 min):
  "In Game 1, there is a prize that will be awarded to one of you. The prize is $10 divided by the total number of entries. What is an entry? Each of you will decide to submit 1, 2, or 3 entries. You will write your anonymous ID on each entry slip. We will then put all the slips in a box, mix them, and draw one slip at random. The owner of that slip wins the prize. The prize amount is $10 divided by the total number of slips. For example, if there are 12 slips, the prize is $10/12 ≈ $0.83. If there are 36 slips, the prize is $10/36 ≈ $0.28. Note: if you submit more entries, you have a higher chance of winning because you have more slips in the box, but the prize is smaller because it is divided by the total number of slips. You may submit 0, but that would give you no chance of winning, so we don't expect that. Please choose 1, 2, or 3. Write your ID on each slip you decide to use. Put only the slips you use in the envelope. Do not write your name, use an anonymous ID that only you know. We will not reveal individual choices until after the debrief."

  Stage 1 Submission (5 min): Hand out 3 slips and an envelope to each. They write their ID (e.g., a word or number they choose) on the slips they use and put them in the envelope. Collect the envelopes.

  Stage 1 Computation (5 min): Open all envelopes, count the total slips T. Compute the prize = $10 / T (round to nearest cent). Write T and prize on board. Mix the slips and draw one. Read the ID. Announce: "The winner is ID [X]. They win [prize] dollars." Record the winner and prize.

  Stage 2 Explanation (10 min):
  "Now for Game 2. This is a different game with a separate $10 prize. The prize will be awarded only if exactly one claim is submitted. If zero claims are submitted, or two or more, the prize is void. Each of you will choose one of three options by writing on an index card: 
  - C: Claim outright. This means you are submitting a claim for the prize.
  - A: Abstain. You are not claiming and not participating in the randomizer.
  - J: Join the Randomizer Pool.

  How does the Randomizer Pool work?
  - If at least one of you chooses C (Claim outright) and at least one chooses J (Join the pool), then the prize is void. Why? Because the pool will produce one claim (from one person in the pool) and there is at least one outright claim, so at least two claims -> void.
  - If no one chooses C and at least one chooses J, then the pool is activated. We will randomly select exactly one person from the pool (the designator) and that person wins the $10 prize. So if K people join the pool, each has a 1/K chance of winning.
  - If no one chooses J (the pool is empty) and exactly one person chooses C (and the rest A), then that person wins the $10 prize.
  - Otherwise (if there are no Js and either zero Cs or two or more Cs), the prize is void.

  Examples:
  - If all 12 choose J: then one is randomly selected to win $10. Prize awarded.
  - If one chooses C and the rest choose J: then we have at least one C and at least one J -> void.
  - If one chooses C and the rest choose A: then the pool is empty, and there is exactly one C -> that C wins.
  - If two choose C and the rest A: void because two claims (and no pool).
  - If no one chooses C and no one chooses J (all A): void.

  Note: if you choose C, you are claiming and hoping that no one else claims and the pool is empty. If you choose J, you are hoping that no one chooses C and that the pool is activated. If you choose A, you are out of the game."

  Stage 2 Submission (5 min): Hand out index cards. They write their ID and one letter: C, A, or J. Collect.

  Stage 2 Processing (10 min): Separate the cards. 
  - If there is at least one C and at least one J: void. Announce: "The prize is void because there was at least one outright claim and at least one in the pool."
  - Else, if there are Js (and no Cs): randomly select one from the Js. Announce: "The prize is awarded to the designator from the pool: ID [X]."
  - Else (only Cs and As): count the Cs. If exactly one C, then that one wins. Otherwise, void.

  Announce the outcome and the winner (if any).

  Debrief: Follow the structure above.

  This design should work. Let me know if you need adjustments.
answer: |-
  Below is a comprehensive 90-minute session plan for your graduate reading group on superrationality, centered on the two-stage "Platonia–Luring Relay." The activity avoids naming superrationality, evidential decision theory, or correlation devices until the debrief, and uses small real stakes (e.g., $10–$20 in vouchers) to maintain engagement without distorting incentives. I've structured it to maximize experiential learning, address predictable pitfalls, and clearly separate the contributions of the facilitator's Randomizer Pool from pure superrational reasoning.

  ---

  ### **Materials List**
  - **Stage 1 (Luring Lottery):** 
    - 12 envelopes (one per participant).
    - 36 blank slips of paper (3 per participant).
    - Pens.
    - A large collection box.
    - Calculator for facilitator.
  - **Stage 2 (Platonia Dilemma with Randomizer Pool):** 
    - 12 index cards (one per participant).
    - Pens.
    - A randomizer for the pool (e.g., a 12-sided die or a numbered drawing hat).
    - Sealed envelope containing a list of participant IDs (for randomness).
  - **Payoffs:** 
    - Total stake: **$20 in vouchers** (or equivalent points), split as:
      - Stage 1 prize fund: $10 scaled to nominal 120 units → **$1 = 12 units**.
      - Stage 2 prize: $10 fixed (120 units).
    - Prize calculations:
      - Stage 1: Winner receives **$10 / T** (T = total entries), rounded to nearest cent.
      - Stage 2: Winner (if any) receives **$10**.
  - **Facilitator Tools:** Whiteboard to record outcomes (e.g., T, prize, winner IDs) and a timer.

  ---

  ### **Timeline and Facilitator Script (90 Minutes Total)**

  #### **0–5 min: Introduction and Setup**  
  - **Script:** "Today, we’ll play two short games about decision-making. Each involves anonymous, simultaneous choices with real monetary stakes based on your actions. Your goal is to maximize your earnings. Both games are independent, and you’ll use anonymous IDs—pick a number 1–12 for yourself, but don’t share it. All payouts are in vouchers. Any questions before we begin?"  
  - **Materials:** Distribute envelopes and slips for Stage 1.  
  - **Pitfall Handling:** Emphasize anonymity to prevent collusion. If IDs are duplicated, have participants re-choose privately.

  #### **5–15 min: Stage 1 (Luring Lottery) Explanation and Submission**  
  - **Script:**  
    - "**Game 1: The Prize Lottery.** A $10 prize will be awarded to one entry drawn at random. The catch: The prize amount is $10 divided by the total number of entries submitted. For example:  
      - If 12 entries total, the prize is $10 ÷ 12 ≈ $0.83.  
      - If 36 entries, it’s $10 ÷ 36 ≈ $0.28.  
      Your choice: Submit 1, 2, or 3 entries. Write your ID on each slip you use (e.g., 3 slips if you choose 3). Submitting 0 is allowed but gives no chance of winning. Place your slips in your envelope and drop it in the collection box. You have 3 minutes."  
  - **Materials:** Participants submit slips in sealed envelopes.  
  - **Pitfall Handling:**  
    - **Over-entering due to confusion:** Reiterate examples ("More entries = better chance but smaller prize"). Walk through a quick calculation on the board (e.g., "If others submit 11 entries, your 3 entries give you a 3/14 ≈21.4% chance at $10÷14≈$0.71, so expected $0.15").  
    - **Stakes taken unseriously:** Remind them this affects real payouts. Use a serious tone.

  #### **15–25 min: Stage 1 Computation and Outcome**  
  - **Script:** "Time’s up. I’ll now count the entries and announce the winner."  
  - **Materials:** Open envelopes, count total slips (T), compute prize ($10 / T). Draw one random slip from the box. Announce:  
    - "Total entries: [T]. Prize: $[amount]. Winner: ID [X]."  
    - Record T, prize, and winner ID on the board.  
  - **Pitfall Handling:** If T=0 (unlikely), state prize is void. Round prizes to cents for transparency.

  #### **25–40 min: Stage 2 (Platonia Dilemma) Explanation and Submission**  
  - **Script:**  
    - "**Game 2: The Sole Claimant Prize.** A separate $10 prize is awarded only if exactly one claim is submitted. Void otherwise. You have three choices:  
      1. **Claim (C)**: You submit a claim.  
      2. **Abstain (A)**: You do nothing.  
      3. **Join the Randomizer Pool (J)**: You enter a pool. If the pool is used, exactly one member is randomly designated to claim.  
      Rules:  
      - If anyone Claims (C) *and* the pool has ≥1 member (J), there are ≥2 claims → prize void.  
      - If no one Claims (C) and ≥1 Joins (J), the pool activates → one random pool member wins.  
      - If only Abstains (A) and Claims (C): Prize paid only if exactly one Claim (C).  
      Examples:  
      - All 12 Join (J): One random winner.  
      - All Claim (C): 12 claims → void.  
      - One Claims (C), others Abstain (A): Winner.  
      Write your choice—**C, A, or J**—and ID on an index card. Submit in 3 minutes."  
  - **Materials:** Distribute index cards. Collect in a box.  
  - **Pitfall Handling:**  
    - **Misunderstanding the pool:** Use examples ("If you Join, you only claim if the pool activates *and* you’re chosen"). Contrast with Claim ("Claim means you always submit, regardless of others").  
    - **Testing the mechanism/skepticism:** Preempt by noting, "Your choice affects everyone’s payout—choose based on strategy." If someone claims outright (C) and voids the prize, use it in debrief ("This shows fragility").  
    - **Communication attempts:** Intervene if whispering occurs ("Remember, no communication—your ID is private").

  #### **40–50 min: Stage 2 Processing and Outcome**  
  - **Script:** "Let’s determine the outcome."  
  - **Materials:**  
    - Sort cards into C, A, J piles.  
    - Apply rules:  
      - If ≥1 C and ≥1 J: "Prize void—multiple claims."  
      - If only J (no C): Randomly select one J as designator (use die/drawing hat). "Pool activated—winner: ID [X]."  
      - If only C and A: "Prize paid if exactly one C. Outcome: [state]."  
    - Announce result and winner (if any). Record on board.  
  - **Pitfall Handling:** If confusion arises, re-explain rules using the sorted piles ("See, these Claims and these Joins mean ≥2 claims").

  #### **50–90 min: Debrief and Concept Integration**  
  **Structure:** Elicit reactions first, then connect to theory. Avoid jargon until final mapping.  
  **Script (Guided Discussion):**  

  1. **Stage 1 Reactions (5 min):**  
     - "How did Stage 1 feel? What did you choose and why? Did the prize match expectations?"  
     - **Listen for:** Disappointment at low prize, regret over over-entering, or confusion at dominance.  

  2. **Stage 1 Analysis: Dominance vs. Restraint (10 min):**  
     - Highlight tension: "If all submit 1, prize is $0.83; all submit 3, it’s $0.28—yet individually, submitting 3 is tempting. Why?"  
     - Calculate on board:  
       - If others submit 11 entries (S=11), your payoff if:  
         - Submit 1: (1/12) × ($10/12) ≈ $0.07  
         - Submit 3: (3/14) × ($10/14) ≈ $0.15 → higher!  
       - But if all submit 3: (3/36) × ($10/36) ≈ $0.02 → worse for everyone.  
     - "Individually, submitting more *always* seems better (weakly dominant), but collectively, it’s destructive. Sound familiar? [Prisoner’s Dilemma]."  

  3. **Stage 2 Reactions (5 min):**  
     - "What happened in Stage 2? Why did you choose C/A/J? Did the outcome surprise you?"  
     - **Listen for:** Trust in the pool, frustration at voiding, or skepticism.  

  4. **Stage 2 Analysis: Randomization and Correlation (15 min):**  
     - Contrast outcomes:  
       - If all join pool: 100% chance of payout, each wins $10/12 ≈ $0.83.  
       - If all claim: 0% chance.  
     - "Without the pool, what if everyone independently 'rolled a die' to claim with 1/12 probability? The chance of exactly one claim is ≈35%—better than all claiming, but worse than the pool’s 100%."  
       - Show math: P(exactly one claim) = 12 × (1/12) × (11/12)^11 ≈ 0.35. Max probability is 38% at p=1/12.  
     - "The pool isn’t magic—it’s a *correlation device*. It forces exactly one claim if no one ruins it with a C. Without it, independent randomization is the best you can do, but it’s inefficient."  

  5. **Introducing Superrationality (10 min):**  
     - "Both stages share a core idea: **superrationality**. It asks: 'In symmetric, anonymous groups, should you treat your choice as *evidence* about others, not just as a cause?'  
       - Stage 1: If you submit 3, it’s evidence others will too (since all reason the same), leading to a bad outcome. Restraint (submit 1) is 'superrational.'  
       - Stage 2: If you claim, it’s evidence others will claim, voiding the prize. The pool is a tool to achieve the superrational outcome—symmetric coordination—without relying on luck."  
     - Map moments:  
       - Stage 1 disappointment → clash between dominance (individual) and restraint (collective).  
       - Stage 2 voiding/success → mixed-strategy failure vs. correlation benefit.  
     - "Superrationality isn’t causal—it’s *evidential*. Your choice signals what others likely do because you’re identical."  

  6. **Q&A and Limitations (5 min):**  
     - "Questions? Final thoughts?"  
     - **Frank limitation:**  
       - "The Randomizer Pool is my addition—it’s a correlation device not generated by pure reasoning. Without it, superrationality only gets you to mixed strategies (≈35% success in Platonia). The pool shows how devices improve outcomes, but pure superrationality (no device) relies on agents independently choosing p=1/12. The 'felt lesson' in Stage 2 depends heavily on the device—it makes coordination vivid. Without it, only the mixed-strategy insight survives."

  ---

  ### **Predictable Pitfalls and Handling**
  1. **Stage 1 Over-Entering:**  
     - **Why:** Dominance is compelling; participants may not internalize dilution.  
     - **Handling:** Pre-empt with clear examples ("If you expect others to submit 1, your 3 gives you $1.84—but if all do this, everyone gets $0.28"). Use the outcome to spark debrief discussion.  

  2. **Stage 2 Outright Claim (C) or Skepticism:**  
     - **Why:** Testing mechanics or distrusting others.  
     - **Handling:** In rules, stress that C + J voids the prize. If it happens, use it in debrief: "This mirrors real-world distrust—superrationality assumes symmetry."  

  3. **Misunderstanding the Pool:**  
     - **Why:** J is abstract; confusion between J and C.  
     - **Handling:** Examples! ("J only claims if no one forces a void by choosing C"). Repeat during processing.  

  4. **Communication or Low Stakes:**  
     - **Why:** Graduate students may chat or dismiss small payouts.  
     - **Handling:** Enforce anonymity strictly; frame stakes as "meaningful but not coercive."  

  5. **Time Overruns:**  
     - **Why:** Computation or discussion delays.  
     - **Handling:** Use a timer; compute T/prize during submission. Defer complex math to debrief.  

  ---

  ### **What the Activity Cannot Reproduce**
  - **Pure Superrationality Without Devices:** The Randomizer Pool is a facilitator-supplied correlation mechanism. It cannot emerge from participant reasoning alone and obscures the mixed-strategy equilibrium (p=1/12) of the original Platonia dilemma.  
  - **Facilitator’s Role:** You must verbally:  
    - Explain why independent randomization (p=1/12) is the optimal symmetric strategy without devices.  
    - Clarify that superrationality’s evidential reasoning (treating your choice as evidence) is the "leap" needed to justify p=1/12—but this is less intuitive than the pool’s coordination.  
  - **Surviving Insight Without Device:** Only the mixed-strategy logic (from Platonia) and the dominance-restraint clash (from Luring) remain. The pool’s 100% success is artificial but powerfully illustrates *why* correlation devices are valuable in collective action.  

  This design balances experiential learning with theoretical depth, using your variant to make superrationality tangible. The two-stage relay ensures participants feel the tension between individual and collective rationality before labeling it, setting the stage for formal theory. Run it as-is, and adjust timing based on group engagement!
