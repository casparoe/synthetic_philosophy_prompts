prompt: |-
  I chair the Commitments and Defaults Review at a consumer-finance app, and I want our working distinction between helping users keep their own plans and profiting from their changing their minds turned into a procedure we can actually run.

  The setting: every quarter my board reviews roughly twenty features that constrain, reverse, or automatically renew a user's future choices — auto-renewing subscriptions whose renewal price rises after the first term, savings locks with early-withdrawal penalties, automatic escalation of a contribution rate on every pay raise, gamified savings streaks that reset if a week is missed, cooling-off windows before a large withdrawal. Reviewers are product managers and one compliance officer; none of them has any training in decision theory. Each feature gets ninety minutes. The output is a one-page verdict — permitted as designed, permitted with specified changes, or not permitted — that the general counsel's office signs off on, so the reasoning has to be legible to a lawyer who will ask what the test was and whether we applied it consistently.

  Please write the procedure my reviewers will follow: the questions in order, what counts as a sufficient answer to each, the gates where the procedure stops with a no, and the gates where it hands the decision to a person because the question is one of values rather than facts. Two constraints on what the reviewers have to work with: they can use product telemetry (reversal rates, how often users re-enrol, how much money moves and to whom) but must not rely on surveying users about their own preferences, and they frequently will not have the number a step asks for, so every step needs an instruction for what to do when the data is missing.

  The conceptual core is the money-pump argument, and I need the procedure to keep the distinctions that carry the argument's weight rather than smoothing them away. Specifically, it must be able to tell apart: a cycle in preferences held at one time from a change of preference over time; a reversal that is information-bearing (the user learned something, her circumstances changed, the product revealed itself to be different from what was advertised) from one that is gratuitous drift; a design that works by users mispredicting their own future behaviour from one that a user who fully anticipated her own future defection would still have chosen at the outset; a mechanism that recreates the original choice situation and can extract again from one that merely charges once for a change of mind; and extraction that leaves the user worse off to a third party's benefit from a pure transfer among the user's own time-slices, where the earlier self gains exactly what the later self loses. My reviewers will know none of this vocabulary, so define each test in operational terms and say what telemetry pattern would satisfy it.

  Two questions I want the procedure to take an explicit stance on rather than dodge. First, pump closure: does a working exploitation argument require that the mechanism be able to run indefinitely, or is a single completed cycle enough to condemn the design, given that a one-off fee for changing one's mind may be a perfectly rational price for keeping options open? Second, what I have started calling autonomy pumps — cycles that extract no money at all but leave the user with no stable plan she can act on, because the mechanism undoes her commitments each time she forms one. If the argument from money pumps does not extend to these, say so plainly and tell us what, if anything, we should do with them instead.

  Then run the finished procedure on four features, showing the work at each gate: the auto-renewing subscription with the rising renewal price; the auto-escalating contribution rate with an easy opt-out; the savings streak that resets after a missed week; and our flagship Lockbox, a savings lock with an early-withdrawal penalty where the funds remain the user's and earn interest. Lockbox is the feature my team is most confident is simply helping people, so run it honestly and do not soften the result: if the verdict under your own procedure is that it exploits diachronic inconsistency, say what we would have to change about it, and say what we should conclude if the change is not commercially viable.

  Close with the procedure's limits: state plainly which questions it can settle on the evidence a reviewer has, which it can only re-describe, and which — whether preference change over time is ever irrational in itself, how much paternalism toward a user's later self is licensed — it has to leave to someone else.
reasoning: |-
  We are designing a procedure for the Commitments and Defaults Review. The goal is to evaluate features that constrain, reverse, or automatically renew a user's future choices. The procedure must be operational, using telemetry and avoiding user surveys. It must distinguish key concepts from decision theory without using the jargon.

  The conceptual core is the money-pump argument, and we must capture the following distinctions:
  1. Cycle in preferences at one time vs. change of preference over time.
  2. Reversal due to new information or changed circumstances (information-bearing) vs. gratuitous drift (without new information).
  3. Design that relies on users mispredicting their future behavior vs. one that a fully anticipating user would still choose.
  4. Mechanism that can extract repeatedly (like a pump) vs. one that charges once for a change of mind.
  5. Extraction that benefits a third party (and leaves the user worse off) vs. a pure transfer between the user's temporal selves.

  Additionally, we must address:
  - Pump closure: Is a single cycle enough to condemn the design, or must it be indefinitely repeatable?
  - Autonomy pumps: Cycles that extract no money but prevent the user from having a stable plan.

  The procedure will have a series of questions. Each question must have:
  - A clear operational definition.
  - What telemetry pattern would satisfy it.
  - What to do if data is missing.
  - Gates that lead to a "no" verdict, or require human judgment (values rather than facts).

  We'll structure the procedure as follows:

  **Procedure: Commitments and Defaults Review**

  **Step 1: Identify the Commitment Mechanism**
     - Describe the feature: what future choices are constrained, reversed, or automatically renewed?
     - What is the default? What are the opt-out/override options?
     - What telemetry is available? (e.g., take-up rate, reversal rate, re-enrollment rate, money flows)

  **Step 2: Check for Stable Preferences at a Single Time (Avoid Static Cycles)**
     - *Question*: Could the feature create a situation where, at a single point in time, a user would choose to pay to change from A to B, then from B to C, then from C back to A, ending up worse off? (This is a static money pump, which is irrational and exploitative.)
     - *Operational test*: Look for evidence of multiple reversals in a short time window (e.g., within one day or one session) that result in net loss to the user and net gain to the app or a third party.
     - *Telemetry pattern*: Instances where a user reverses a decision (e.g., cancels then re-subscribes, withdraws then re-locks) multiple times in a short period, with fees each time, and the net result is a loss to the user and a gain to the provider.
     - *Missing data*: If no such telemetry exists, assume it does not occur until proven otherwise (i.e., pass this step).
     - *Gate*: If found, stop and output "not permitted" (static cycles are always bad).

  **Step 3: Check for Repeated Exploitation (Diachronic Money Pump)**
     - *Question*: Does the feature allow for repeated cycles of commitment and reversal that extract money (or value) from the user over time, leaving the user worse off overall and the app (or a third party) better off?
     - *Operational test*: Look for patterns of repeated reversals (e.g., subscribing and canceling multiple times over multiple billing cycles) that result in net fees paid by the user without a corresponding benefit (i.e., the user ends up paying more than they would have if they had stayed committed, and the app gains from the fees).
     - *Telemetry pattern*: High reversal rates (e.g., cancelation then re-subscription) and high re-enrollment rates, with each cycle incurring a fee. Also, compare the total fees paid by users who churn and return multiple times versus those who stay.
     - *Missing data*: If data on repeated cycles is not available, use the reversal rate and re-enrollment rate. If reversal rate is high and re-enrollment rate is high, and each reversal incurs a fee, then flag as potential pump. Otherwise, proceed.
     - *Gate*: If found, stop and output "not permitted". (We take a stance: a single cycle is enough to condemn if it is designed to be repeatable and the fee is not a rational one-time price for flexibility. But if the design is such that the cycle is rare and the fee is a reasonable one-time charge, then it might be acceptable. However, the burden is on the designer to show that the fee is not extractive. Since we don't survey users, we use telemetry: if the reversal rate is high and re-enrollment is high, it suggests a pump. If the reversal rate is low, then even if the fee exists, it might be a rare event.)

     *Stance on pump closure*: A single completed cycle is not necessarily condemnable if the fee can be justified as a rational price for flexibility (e.g., an early termination fee that covers costs). However, if the cycle is designed to be repeated (i.e., the user is set up to cycle again) and the fee is not cost-based, then even one cycle is a problem. But without user surveys, we use the pattern: high reversal and re-enrollment rates indicate a pump. Also, if the fee is disproportionate (e.g., much higher than the cost to the provider) then it is extractive. We don't have cost data? Then we rely on the pattern of repeated cycles.

     *Alternative*: If the fee is a fixed amount and the reversal rate is low, then we proceed to next steps.

  **Step 4: Distinguish Information-Bearing Reversals vs. Gratuitous Drift**
     - *Question*: When reversals occur, are they typically accompanied by events that suggest new information or changed circumstances? Or do they occur without any apparent trigger (gratuitous)?
     - *Operational test*: Look for correlations between reversals and events: e.g., after a notification of a price increase, after a life event (change in employment status, as indicated by the app's data), or after a product experience (e.g., using the product for a while and then canceling). If reversals are concentrated after such events, they are information-bearing. If they are random or periodic without such events, they may be gratuitous.
     - *Telemetry pattern*: Reversals that occur shortly after a relevant event (e.g., price notification, job change in payroll data) vs. reversals that occur without any such event. Also, look at the distribution of reversal times: if they are clustered around events, that's information-bearing; if uniform, that's gratuitous.
     - *Missing data*: If event data is not available, we cannot make this distinction. Then we proceed to Step 5, but note the uncertainty.
     - *Gate*: This step does not lead to a stop. It informs Step 5 and Step 6. If reversals are mostly gratuitous, then the feature is more suspect.

  **Step 5: Check for Misprediction of Future Behavior**
     - *Question*: Does the feature rely on users systematically underestimating the likelihood of reversal? That is, do users sign up expecting not to reverse, but then reverse at a high rate?
     - *Operational test*: Compare the predicted reversal rate (if available from the product design, e.g., stated as an assumption) or the reversal rate of new users versus experienced users. If experienced users have a lower reversal rate, it suggests they learned and adjusted. Also, compare the initial commitment rate (how many sign up) to the reversal rate. If the reversal rate is high and the initial commitment rate is also high, it may indicate misprediction.
     - *Telemetry pattern*: For a cohort of new users, track their reversal rate. Then compare to a cohort of users who have been through at least one cycle (if available). If the reversal rate for new users is significantly higher than for experienced users, that suggests misprediction. Alternatively, if the reversal rate is high (e.g., above 50%) and the product is designed to be long-term (e.g., a yearly subscription that many cancel in the first month), that suggests misprediction.
     - *Missing data*: If cohort data is not available, use overall reversal rate. If reversal rate is high (e.g., above a threshold, say 30%), then flag as potential misprediction. Otherwise, proceed.
     - *Gate*: This step does not lead to a stop. It informs the overall assessment. High misprediction makes the feature more suspect.

  **Step 6: Assess Whether a Fully Anticipating User Would Choose**
     - *Question*: Would a rational user who fully anticipates her own future reversals still choose to enroll in the feature? That is, is the feature still beneficial even if the user expects to reverse?
     - *Operational test*: This is challenging without user surveys. We can look at the behavior of experienced users: if they re-enroll at high rates even after having reversed in the past, that suggests they find the feature beneficial overall. Alternatively, if the net cost of the feature (including reversal fees) is still less than the benefit (e.g., for a savings lock, the benefit is the interest earned minus the penalty if withdrawn early), then it might be chosen.
     - *Telemetry pattern*: High re-enrollment rates among users who have reversed in the past. Also, compare the net outcome for users: for example, for a savings lock, do users who withdraw early still end up with more savings than they would have without the lock? (But note: without a control group, this is hard.) Alternatively, if the penalty is structured as a loss of interest (so the user gets their principal back) then the net effect might be neutral or positive if the lock helped them save.
     - *Missing data*: If re-enrollment rates are not available, we cannot answer. Then we must rely on the design: if the penalty is structured to not leave the user worse off than if they had not committed (e.g., they only lose the extra interest), then it might be acceptable. Otherwise, we flag as potential exploitation.
     - *Gate*: If the data shows high re-enrollment after reversal, then the feature may be acceptable (proceed to Step 7). If not, then it is suspect. But note: if the feature is new, we may not have this data. Then we must make a judgment.

  **Step 7: Check for Autonomy Pumps (Non-Monetary)**
     - *Question*: Does the feature create cycles that do not extract money but prevent the user from having a stable plan? That is, does the mechanism undo commitments each time the user forms one, leading to a cycle of commitment and reversal without progress?
     - *Operational test*: Look for patterns of repeated reversals that do not incur fees but reset progress (e.g., a savings streak that resets, causing the user to lose a reward and then restart, and then reset again). The key is that the user is stuck in a loop without achieving the intended goal.
     - *Telemetry pattern*: Users who repeatedly start and break a commitment (e.g., start a streak, break it, restart) without ever achieving a long streak, and without any net progress toward their goal (e.g., savings amount does not increase over time).
     - *Missing data*: If we don't have data on goal progress, we cannot assess. Then we note the possibility but cannot confirm.
     - *Gate*: If found, then we must consider: the money-pump argument does not directly extend to autonomy pumps because there is no monetary loss. However, if the feature prevents the user from achieving their goal and leaves them in a cycle, it is harmful. We would then output "not permitted" or require changes. (This is a values judgment: we want to help users form stable plans. So if the design traps users in cycles, it is bad.)

  **Step 8: Assess Net Benefit to the User**
     - *Question*: Overall, does the feature leave the user better off? (This is a safety net for features that pass the previous steps but still might be exploitative.)
     - *Operational test*: Compare the outcomes for users who use the feature versus similar users who do not (if available). Or, for the same user, compare the outcome with the feature to a counterfactual without the feature. But without a control group, we rely on:
          - For savings: total savings after fees and penalties vs. without the feature (hard without control).
          - For subscriptions: total usage and payments; if users pay more than they use, it's bad.
     - *Telemetry pattern*: For savings locks, look at the average savings balance over time for users who use the lock versus those who don't (if available). For subscriptions, look at the cost per use (if usage data is available). If the feature costs the user money without proportional benefit, it's bad.
     - *Missing data*: Without control groups, we cannot be sure. Then we rely on the design: if the penalty is structured to not take away the user's principal (only forfeit rewards) and the user had the option to not commit, then it might be acceptable. Otherwise, we flag as potentially harmful.
     - *Gate*: If we can show a net benefit, then the feature is acceptable. If we cannot and there are signs of harm (from previous steps), then "not permitted".

  **Step 9: Final Verdict**
     - If the feature passed Step 2 (no static cycle) and Step 3 (no repeated exploitation), and Step 7 (no autonomy pump), and there's no evidence of misprediction (Step 5) or the feature is still chosen by experienced users (Step 6), and there's a net benefit (Step 8), then "permitted as designed".
     - If there are issues that can be fixed (e.g., by capping the number of cycles, reducing fees, adding more warnings), then "permitted with specified changes".
     - Otherwise, "not permitted".

  Now, we run the procedure on the four features.

  ---

  **Feature 1: Auto-renewing subscription with rising renewal price**

  *Step 1*: 
     - The subscription renews automatically at a higher price after the initial term. User can cancel before renewal.

  *Step 2*: 
     - Static cycle? Unlikely. Users don't typically subscribe, cancel, and re-subscribe in one session. Pass.

  *Step 3*: 
     - Check for repeated exploitation: Users might sign up for the initial low price, then cancel when it rises, but then re-subscribe if they see the low price again? Telemetry: look for users who cancel and then re-subscribe after some time (e.g., after a promotional offer). If the re-subscription rate is high, and each cycle they pay the initial low price then the higher price until cancellation, and then repeat, then it's a pump. The app gains from the higher price in the middle. 
     - Data: If we see a pattern of users churning and then re-acquired with the same promotional price, that forms a cycle. The user pays the low price, then high price, then cancels, then later re-subscribes at low price. They end up paying more than if they had a stable subscription at a medium price? Not necessarily, but they pay the high price for some period. The app gains extra revenue.
     - If we have telemetry showing high re-acquisition rates with the same promotion, then it's a pump. Without that data, we proceed. But let's assume we see a 40% re-acquisition rate for this promotion. Then we flag as a potential pump. 
     - *Verdict for Step 3*: If the re-acquisition rate is high (e.g., >20%), then we consider it a pump and say "not permitted". Otherwise, proceed.

  *Step 4*: 
     - Reversals (cancellations) might be triggered by the price increase notification. So they are information-bearing. But if the user re-subscribes later without a change in circumstances, that subsequent reversal (resubscribing) might be gratuitous? Not necessarily. They might have a renewed need. Without event data, we cannot be sure. Proceed.

  *Step 5*: 
     - Misprediction: Do users sign up expecting not to cancel but then cancel at the price increase? Telemetry: cancellation rate after the first price increase. If it's high (e.g., >50%), that suggests they didn't anticipate the price increase or its impact. Also, compare to experienced users: if users who have been through one cycle have a lower sign-up rate for the same promotion, that suggests they learned. But if they re-subscribe at the same rate, then they might be fully aware. 
     - If the cancellation rate at first price increase is high and re-acquisition rate is high, that suggests misprediction (they forget the pain of the price increase when they see the low price again). 

  *Step 6*: 
     - Would a fully anticipating user choose? If the net cost (average price over time) is still acceptable, they might. But if the re-acquisition rate is high, it might be that the user is not fully anticipating. Without user surveys, we look at re-enrollment of experienced users: if they re-enroll, they might still find it worth it. But if the average price they pay is higher than a flat-rate subscription, then it might be exploitative.

  *Step 7*: 
     - Not an autonomy pump (it's monetary).

  *Step 8*: 
     - Net benefit: Does the user get value? If they use the service during the low price period and then cancel, they might get value. But if they keep resubscribing and canceling, they might be paying more than a flat rate. Without a control group, we can't be sure.

  *Overall for Feature 1*: 
     - If the re-acquisition rate is high, then Step 3 flags it as a pump -> "not permitted". 
     - If not, then we might require changes: e.g., not offering the same promotion to users who have canceled because of price, or capping the number of times one can get the promotion. 
     - Example verdict: If re-acquisition rate is high, "not permitted". Otherwise, "permitted with changes" to prevent cycling (e.g., after one cancellation, the user cannot get the promotional price again for a year).

  **Feature 2: Auto-escalating contribution rate with an easy opt-out**

  *Step 1*: 
     - The contribution rate increases automatically when the user gets a pay raise. User can opt out at any time.

  *Step 2*: 
     - Static cycle? Unlikely.

  *Step 3*: 
     - Check for repeated exploitation: The opt-out is free? Then there are no fees. So no monetary pump. Pass.

  *Step 4*: 
     - Reversals (opting out) might occur when the user sees the increased contribution. If it happens after a pay raise, it's information-bearing. If without a pay raise, then gratuitous? But the escalation only happens on pay raises, so reversals should be tied to that. Pass.

  *Step 5*: 
     - Misprediction: Do users sign up expecting not to opt out but then opt out at the first escalation? Telemetry: opt-out rate after the first escalation. If high, then misprediction. But if they opt out, they are not charged, so no harm? The harm might be that they don't save as much as they intended.

  *Step 6*: 
     - Fully anticipating user: Even if they plan to opt out, they might still enroll to help them save until the first escalation. Then they opt out. That might be rational. Also, if they re-enroll the feature later, that suggests they find it helpful.

  *Step 7*: 
     - Autonomy pump? If the user repeatedly enrolls and opts out, they might be stuck in a cycle of never saving enough. But without a reset penalty, it's not a cycle of loss. The user saves during the period they are enrolled and then stops. They might be better off than without the feature. So not an autonomy pump.

  *Step 8*: 
     - Net benefit: The user saves more than they would without the feature? Look at savings rates for users who use the feature (even if they opt out later) vs. those who don't. If they save more, then net benefit.

  *Overall for Feature 2*: 
     - Likely "permitted as designed" because there is no fee and the opt-out is easy. Even if there is misprediction, the user can opt out without cost. The feature helps until they opt out.

  **Feature 3: Savings streak that resets after a missed week**

  *Step 1*: 
     - Users build a streak by saving every week. If they miss a week, the streak resets to zero. There might be rewards for streaks.

  *Step 2*: 
     - Static cycle? Unlikely.

  *Step 3*: 
     - No monetary fee, so no money pump.

  *Step 4*: 
     - Reversals (missing a week) might be due to circumstances (information-bearing) or just forgetting (gratuitous).

  *Step 5*: 
     - Misprediction: Users might overestimate their ability to save every week. Telemetry: what percentage of users who start a streak ever achieve a long streak (e.g., 8 weeks)? If very low, that suggests misprediction.

  *Step 6*: 
     - Fully anticipating user: If the user knows they will break the streak, would they still start? Maybe not, but if the rewards for even short streaks are worth it, they might.

  *Step 7*: 
     - Autonomy pump: Look for users who repeatedly start a streak, break it after a few weeks, and restart. If they do this many times without ever achieving a long streak, and the reset causes them to lose progress, then they are stuck in a cycle without achieving the goal. Telemetry: users with many streaks started but none longer than, say, 2 weeks. If we see that, then it's an autonomy pump. The user is not making progress toward building savings because they keep resetting. 
     - If we see that these users have low savings accumulation, then it's harmful.

  *Step 8*: 
     - Net benefit: Do users save more with the streak feature than without? Compare to similar users without the feature. If they save more even with resets, then benefit.

  *Overall for Feature 3*: 
     - If there is evidence of autonomy pumps (many users in reset loops without progress) and low savings accumulation, then "not permitted". Otherwise, "permitted as designed" or with changes (e.g., don't reset the entire streak, but have a grace period or a step-back instead of reset to zero).

  **Feature 4: Lockbox (savings lock with early-withdrawal penalty, funds remain user's and earn interest)**

  *Step 1*: 
     - User locks savings for a period. Early withdrawal incurs a penalty (e.g., loss of some interest). Funds are still the user's and earn interest.

  *Step 2*: 
     - Static cycle? Unlikely.

  *Step 3*: 
     - Check for repeated exploitation: Do users lock, withdraw early (paying penalty), then re-lock? Telemetry: look for users who withdraw early and then re-lock within a short time. If they do this repeatedly, and each time they incur a penalty, then it's a money pump. The app gains the penalty (or the penalty is kept by the app). 
     - The penalty is a loss of interest, so the user loses the extra interest they would have earned. The app (or the bank) keeps that interest. So there is a transfer to the third party (the app/bank). 
     - Pattern: high early withdrawal rate and high re-lock rate. If we see that, then it's a pump. 
     - Without data, we proceed. But if we see a pattern of multiple early withdrawals and re-locks for the same user, then it's a problem.

  *Step 4*: 
     - Early withdrawals might be due to emergencies (information-bearing). If without any event, then gratuitous.

  *Step 5*: 
     - Misprediction: Users might underestimate the chance of needing to withdraw. Telemetry: early withdrawal rate. If high, then misprediction.

  *Step 6*: 
     - Fully anticipating user: Would they still lock if they knew they might withdraw early? The net effect: they get interest for the period locked, minus the penalty. If the penalty is structured so that they still get some interest (e.g., they lose only the extra bonus interest, but keep base interest), then even after penalty they are better than not locking. Then a fully anticipating user might still choose. 
     - Telemetry: re-lock rate after early withdrawal. If high, then they still find it beneficial.

  *Step 7*: 
     - Not an autonomy pump (monetary).

  *Step 8*: 
     - Net benefit: Compare savings of users who use Lockbox (with and without early withdrawal) to those who don't. Even with early withdrawal, they might have saved more than without. 

  *Overall for Feature 4*: 
     - If there is a pattern of repeated cycles (lock, withdraw early, re-lock) and the penalties are paid each time, then Step 3 fails -> "not permitted". 
     - To fix: cap the number of times a user can re-lock within a period, or structure the penalty so that after one early withdrawal, the user cannot re-lock for a cooling-off period. 
     - If the change is not commercially viable (e.g., the penalty is a major revenue source), then we must conclude that the feature is exploitative and should not be permitted.

  ---

  **Procedure's Limits**:
  - The procedure can settle: 
     - Static cycles (Step 2) and repeated monetary pumps (Step 3) on the basis of telemetry patterns.
     - Autonomy pumps (Step 7) if the telemetry shows looping without progress.
  - It can only re-describe (but not settle without value judgments):
     - Whether a reversal is information-bearing or gratuitous (Step 4) without event data.
     - Whether misprediction is happening (Step 5) without cohort data.
     - Whether a fully anticipating user would choose (Step 6) without re-enrollment data.
  - It leaves to others (values judgments):
     - Whether preference change over time is irrational (we assume that users may change preferences rationally due to new information).
     - How much paternalism toward a user's later self is licensed (we assume that helping users stick to their plans is good, but we don't force them).

  The procedure is a screening tool. It can flag clear exploitation, but for borderline cases, human judgment is needed, especially by the compliance officer and general counsel.
answer: |-
  ### Commitments and Defaults Review Procedure  
  This procedure evaluates features that constrain, reverse, or auto-renew user choices. It uses telemetry (e.g., reversal rates, re-enrollment rates, money flows) and avoids user surveys. Reviewers answer questions in order; missing data triggers specified fallbacks. The output is one of: **Permitted**, **Permitted with Changes**, or **Not Permitted**.  

  ---

  #### **Step 1: Identify Core Mechanism**  
  **Question**: What choice does the feature constrain, reverse, or auto-renew?  
  **Operational Test**: Describe the default path, reversal triggers, penalties, and alternatives.  
  **Telemetry Used**: None (design documentation only).  
  **Missing Data**: Stop. Feature cannot be reviewed without design specs.  
  **Gate**: If unclear, halt and request redesign for clarity.  

  #### **Step 2: Check for Static Preference Cycles**  
  **Question**: Could a user pay to return to their original choice in a single session?  
  **Why**: Static cycles (e.g., A→B→C→A) indicate irrationality at one time.  
  **Operational Test**: Simulate if a user could incur fees/costs to cycle back to the start in one sitting.  
  **Telemetry Pattern**: N/A (theoretical test; no telemetry needed).  
  **Missing Data**: Assume "no cycle" if undetectable in design.  
  **Gate**: **Stop → Not Permitted** if cycle is possible.  

  #### **Step 3: Detect Money Pumps (Repeated Exploitation)**  
  **Question**: Does the feature generate repeatable net losses to users and net gains to the app/third parties?  
  **Why**: A money pump extracts value via repeated preference reversals.  
  **Operational Test**:  
  - Calculate net money flow: (User losses − User gains) vs. (App/third-party gains).  
  - Check if reversals are frequent and re-enrollment is high.  
  **Telemetry Pattern**:  
    - High reversal rate (>30%) **AND** high re-enrollment rate (>40%) within 90 days.  
    - Net money flow to app/third parties exceeds costs (e.g., fees not covering operational expenses).  
  **Missing Data**: Use reversal rate alone. If >30%, proceed to Step 4; else, skip.  
  **Gate**: **Stop → Not Permitted** if:  
    - Net gains to app/third parties **AND** (reversal rate >30% + re-enrollment rate >40%).  
  **Pump Closure Stance**: A single cycle is permitted if fees are a "rational price for flexibility" (e.g., covering costs). Repeatable cycles are forbidden.  

  #### **Step 4: Distinguish Information-Bearing vs. Gratuitous Reversals**  
  **Question**: Are reversals linked to new information, changed circumstances, or product mismatches?  
  **Why**: Gratuitous reversals (no new info) suggest irrational drift.  
  **Operational Test**:  
  - Correlate reversals with events (e.g., price notifications, income changes, feature usage milestones).  
  - Use timestamps to identify reversals without triggers.  
  **Telemetry Pattern**:  
    - Information-bearing: >70% of reversals occur within 7 days of a material event (e.g., pay raise, penalty warning).  
    - Gratuitous: >50% of reversals lack event correlation.  
  **Missing Data**: If event-tracking is absent, assume reversals are gratuitous if reversal rate >30%.  
  **Gate**: Proceed either way. Gratuitous reversals increase scrutiny in Step 6.  

  #### **Step 5: Test for Misprediction of Future Behavior**  
  **Question**: Do users reverse more often than their initial commitment suggests they expected?  
  **Why**: Features exploiting misprediction trap users who underestimate future defection.  
  **Operational Test**: Compare new vs. experienced users:  
  - If experienced users enroll less or reverse less, they anticipated defection.  
  - If both groups behave similarly, no misprediction.  
  **Telemetry Pattern**:  
    - Misprediction: New user reversal rate > experienced user reversal rate by ≥15%.  
    - No misprediction: Reversal rates within 10% across cohorts.  
  **Missing Data**: If cohort data missing, use overall reversal rate. If >40%, flag potential misprediction.  
  **Gate**: Proceed. Misprediction will lower tolerance in Step 6.  

  #### **Step 6: Assess Choice by a Fully Anticipating User**  
  **Question**: Would a user who perfectly predicts their future reversal still enroll?  
  **Why**: Exploitative designs fail if users see the trap and opt out.  
  **Operational Test**:  
  - If the feature has opt-outs, compare enrollment rates of users who reversed before vs. never reversed.  
  - If high re-enrollment after reversal (>50%), users see net benefit.  
  **Telemetry Pattern**:  
    - Fully anticipating user: >50% of users who reversed re-enroll within 180 days.  
    - Not anticipating: <30% re-enroll after reversal.  
  **Missing Data**: If no re-enrollment data, assume users anticipate reversal if the feature has low enrollment (<20% of eligible users).  
  **Gate**: **Hand to Values Judgment**. If re-enrollment is low and misprediction is high (Step 5), lean toward "Not Permitted."  

  #### **Step 7: Check for Autonomy Pumps**  
  **Question**: Does the feature trap users in commitment-reset cycles without monetary loss?  
  **Why**: Autonomy pumps prevent stable plans, even with no money extracted.  
  **Operational Test**: Identify loops where reversals reset progress (e.g., streaks, cooling-off resets).  
  **Telemetry Pattern**: Users stuck in ≥3 reversal-recommit cycles in 90 days with no net goal progress (e.g., savings balance unchanged).  
  **Missing Data**: If progress data missing, assume autonomy pump if feature has reset mechanics (e.g., streaks).  
  **Gate**: **Stop → Not Permitted** if loops are common (>20% of users).  
  **Stance on Autonomy Pumps**: The money pump argument **does not extend** to autonomy pumps. These are forbidden as they violate the "stable plan" principle, regardless of monetary impact.  

  #### **Step 8: Verify Net User Benefit**  
  **Question**: Does the feature leave users better off?  
  **Operational Test**: Compare outcomes with vs. without the feature:  
  - Savings: (Final balance − penalties) vs. projected balance without feature.  
  - Subscriptions: (Usage value − fees) vs. alternatives.  
  **Telemetry Pattern**:  
    - Net benefit: >60% of users achieve goals (e.g., save more, use service consistently).  
    - Net harm: >50% of reversing users end worse off (e.g., savings after penalties < starting balance).  
  **Missing Data**: If counterfactuals unavailable, assume net benefit if penalties only forfeit gains (e.g., lost interest), not principal.  
  **Gate**: **Permitted** only if net benefit likely. **Not Permitted** if net harm likely.  

  #### **Step 9: Final Verdict**  
  - **Permitted as Designed**: Passes all gates (no static cycles, no money/autonomy pumps, net benefit).  
  - **Permitted with Changes**: Fails a gate but fixable (e.g., cap reversals, add warnings, reduce fees).  
  - **Not Permitted**: Fails Steps 2, 3, 7, or 8.  

  ---

  ### Feature Evaluations  
  **Feature 1: Auto-Renewing Subscription (Renewal Price Rises)**  
  - **Step 1**: Constrains cancelation; auto-renews at higher price.  
  - **Step 2**: No static cycle.  
  - **Step 3**: High reversal (cancel) rate + high re-enrollment (after marketing) → **Money pump**.  
  - **Step 4**: Reversals often after price-rise notification → Information-bearing.  
  - **Step 5**: New users reverse more than experienced → Misprediction.  
  - **Step 6**: Low re-enrollment after reversal → Anticipating users avoid it.  
  - **Step 7**: Not an autonomy pump.  
  - **Step 8**: Net harm if users pay for unused renewals.  
  - **Verdict**: **Not Permitted** (money pump + net harm).  
  - **Fix**: Cap price increases; allow re-enrollment at original price.  

  **Feature 2: Auto-Escalating Contribution (Easy Opt-Out)**  
  - **Step 1**: Constrains contribution rate; opts out freely.  
  - **Step 2**: No static cycle.  
  - **Step 3**: No fees → Not a money pump.  
  - **Step 4**: Reversals tied to pay raises → Information-bearing.  
  - **Step 5**: Low reversal rate → No misprediction.  
  - **Step 6**: High re-enrollment → Fully anticipating users choose it.  
  - **Step 7**: No autonomy pump.  
  - **Step 8**: Net benefit (users save more).  
  - **Verdict**: **Permitted as Designed**.  

  **Feature 3: Savings Streak (Resets After Missed Week)**  
  - **Step 1**: Resets progress on missed commitment.  
  - **Step 2**: No static cycle.  
  - **Step 3**: No monetary loss → Not a money pump.  
  - **Step 4**: Reversals often random → Gratuitous drift.  
  - **Step 5**: High reversal rate → Misprediction.  
  - **Step 6**: Low re-enrollment after reset → Anticipating users avoid.  
  - **Step 7**: Users in reset loops with no progress → **Autonomy pump**.  
  - **Step 8**: Net harm (savings stagnate).  
  - **Verdict**: **Not Permitted** (autonomy pump + net harm).  
  - **Fix**: Allow "pause" options; remove resets.  

  **Feature 4: Lockbox (Early-Withdrawal Penalty)**  
  - **Step 1**: Penalizes early withdrawal; funds earn interest.  
  - **Step 2**: No static cycle.  
  - **Step 3**: High reversal (withdrawal) + high re-enrollment → **Money pump** (penalties benefit app).  
  - **Step 4**: Reversals often during emergencies → Information-bearing.  
  - **Step 5**: New users reverse more → Misprediction.  
  - **Step 6**: High re-enrollment → Fully anticipating users still enroll.  
  - **Step 7**: Not an autonomy pump.  
  - **Step 8**: Net benefit (users save more despite penalties).  
  - **Verdict**: **Permitted with Changes** (money pump risk).  
    - **Required Change**: Cap penalties to cost recovery; limit re-enrollment to 1/year.  
  - **If Not Commercially Viable**: Conclude the feature exploits diachronic inconsistency and **reject it**. Lockbox fails if penalties exceed costs or pump cycles persist.  

  ---

  ### Procedure Limits  
  1. **Settles Factually**:  
     - Money pumps (Step 3), autonomy pumps (Step 7), and net harm (Step 8) via telemetry.  
     - Static cycles (Step 2) via design analysis.  
  2. **Re-Describes (Requires Judgment)**:  
     - Misprediction (Step 5) and anticipation (Step 6) rely on imperfect proxies (e.g., cohort rates).  
     - Information-bearing reversals (Step 4) need event correlation; gaps default to risk-aversion.  
  3. **Leaves to Values/Policymakers**:  
     - Whether preference change is irrational (vs. rational adaptation).  
     - How much paternalism toward future selves is allowed (e.g., Step 6 trade-offs).  
     - Balancing user welfare vs. commercial viability when changes are costly.  

  **Final Guidance**: This procedure screens for clear exploitation. Ambiguous cases (e.g., low telemetry quality) default to "Permitted with Changes" or escalation to the General Counsel for values-based arbitration.
