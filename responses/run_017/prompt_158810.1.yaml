  Okay, let me unpack this user's request. They're an undergrad designing a seminar session on moral dilemmas, and they have a very specific pedagogical vision. The core challenge is operationalizing abstract philosophical concepts into a hands-on group activity with strict constraints: no tech, no famous cases, and minimal lecture. 

  Hmm... their proposed "codebook" mechanism is clever—it forces students to confront logical inconsistencies in dilemma claims through concrete rule violations. But I notice two unspoken tensions in their design: first, between wanting emergent discovery and needing controlled outcomes; second, between student-generated content and philosophical precision. The user seems aware of this ("tell me what will go wrong"), which is good.

  The creditor test and sealed residue distinctions are particularly sophisticated. I wonder if they're drawing from Bernard Williams' moral residue ideas. For implementation, I'd suggest making these operational through physical artifacts—color-coded index cards for claimants and stamps for discharge scripts. Concrete tokens prevent abstraction drift.

  For predictable failures: 
  - Third-option inventiveness will spike early. Countermeasure: the "impossibility token" requirement (marking a card with X) makes creativity costly. 
  - Cost-benefit reductionists: isolate their arithmetic to the "costs" column only, using the creditor test to force differentiation between personal cost vs moral debt.
  - Asymmetric cases: referee intervention must happen *before* group sharing to avoid contamination.

  The part that can't emerge naturally is the formal argument against dilemmas (agglomeration + ought-implies-can). I'll position this as the "reveal" after the activity, mapping their struggles to philosophical stances. User should explicitly connect group repairs to dilemma denial strategies during debrief.

  Notable depth in their prep—they've anticipated agent-regret linkages and re-choice diagnostics. I'll amplify those in the timeline by making re-choice responses physically visible on the whiteboard matrix. Their coffee voucher stake is smart; trivial rewards boost engagement without distortion.

  Final tweak: compress phase 1 to 15 minutes. With 16 students, group formation eats time. Provide pre-filled claim cards to jumpstart case-building.
answer: |-
  Here’s a runnable 55-minute plan designed to make the dilemma debate emerge from structured group work, with minimal lecture. The core tension: groups *cannot* formally record symmetric moral conflicts under the rules, forcing them to confront how they conceptualize "remainders."

  ### **Materials**
  - **Claim Deck (6 cards, large font):** "Promise to Friend," "Rescue Stranger," "Reparation to Harmed Person," "Loyalty to Risk-Taking Colleague," "Distributive Fairness," "Fidelity to Personal Project."  
  - **Colored Index Cards:** Blue (verdicts: `ought(φ)`), Red (owed-to: creditor), Yellow (discharge script/sealed declaration).  
  - **Whiteboard Setup:**  
    ```
    GROUP | CASE BRIEF | CODEBOOK VIOLATION? | REPAIRS TRIED | CREDITOR | SEALED? | RE-CHOOSE SAME? | SETTLED?
    ```
  - **Referee Stamp:** "REJECT: Violates Rules" (or "APPROVED").  
  - **Stakes:** Winning group picks 1 summary writer + gets coffee vouchers (decided by vote for "most irreducible dilemma").  

  ---

  ### **Timeline & Script**  
  **Phase 1: Case Construction (15 mins)**  
  - *Groups (4x4) draw 2 claim cards randomly. Task:*  
    > *"Design a scenario where an agent must choose between fulfilling these two claims. Make demands symmetric: neither overrides the other, and they can’t be split. Write a 3-sentence case on a whiteboard section. On blue cards, write verdicts: `ought(A)` and `ought(B)`. Submit to Referee."*  

  - *Referee Rules (stated upfront & on board):*  
    > **Rule 1 (Ought-Implies-Can):** No `ought(φ)` if φ is impossible.  
    > **Rule 2 (Agglomeration):** If `ought(A)` and `ought(B)` are in the codebook, `ought(A and B)` must be true.  

  **Phase 2: Codebook Enforcement (20 mins)**  
  - *Referee (you) checks submissions:*  
    - **If symmetric** (e.g., `ought(save child)` and `ought(save other child)` with one lifeboat):  
      > *"Violation: `ought(save both)` would be required by Rule 2, but Rule 1 says this is impossible. Revise your codebook."*  
      - *Stamp "REJECT" and return.*  
    - **Predictable Repairs & Referee Responses:**  
      | Repair Attempt | Referee Response |  
      |----------------|------------------|  
      | Deny one `ought` (e.g., downgrade to "should") | *"Is this still a moral *requirement*? If not, remove the blue card."* |  
      | Downgrade to cost ("ought but too costly") | *"Record costs separately. Does the verdict `ought(φ)` still stand?"* |  
      | Deny agglomeration ("Rules are wrong!") | *"Rules are fixed for this exercise. Modify your codebook."* |  
      | Add ignorance ("Can’t know which claim binds") | *"But do *both* genuinely obligate? If so, agglomeration applies."* |  
      | Invent third option (e.g., "find another lifeboat") | *"Add `ought(C)` to your codebook. Can C be done? If not, Rule 1 violation."* |  

  - *Crucial:* Require groups to resubmit until rules are satisfied. **All groups will fail initially.**  

  **Phase 3: Residue & Re-Choice (15 mins)**  
  - *For approved codebooks:*  
    1. **Creditor Test:**  
       > *"If choosing A leaves a residue, who is it *owed to*? Write on red card: [Agent], [Bystander], or [Losing Claimant]."*  
       *(Hypothesis: Dilemmas will assign residue to the losing claimant.)*  
    2. **Discharge/Sealed:**  
       > *"Can the agent *settle* the residue later (e.g., apology, compensation)? If yes, write a discharge script on yellow card. If no, write 'SEALED'."*  
    3. **Re-Choice:**  
       > *"If time-traveling to the moment, would you choose the same? Would doing so *settle the matter*?" Record "Yes/No" for both under group columns.*  

  **Phase 4: Debate & Debrief (5 mins)**  
  - *Vote:* "Which group’s case feels most like a genuine dilemma?" (Winner gets stakes).  
  - *Map Activity to Theory:*  
    ``` 
    YOUR STRUGGLE:        → PHILOSOPHICAL DEBATE:
    ----------------------------------------------
    Couldn’t write symmetric oughts → Anti-dilemma: Rules show oughts must be consistent (agglomeration + ought-implies-can).  
    Downgraded to cost              → Dilemma reply: Residue owed to claimant ≠ mere cost.  
    Declared "SEALED" residue       → Is this unfulfilled obligation? Or tragic loss?  
    Re-chose but unsettled          → Agent-regret vs. unresolved duty.  
    Invented third options          → Creative solutions avoid dilemmas but may be unrealistic.  
    ```  
  - *Clarify:* "The rules encode a logical argument against dilemmas. But your intuition that residue is *owed* suggests dilemmas might exist *outside* formal systems."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Third-Option Overreach:**  
     - *Problem:* Groups "solve" the case.  
     - *Fix:* Require added `ought(C)` to codebook. If C is impossible (e.g., "invent teleportation"), Rule 1 kills it.  

  2. **Cost-Benefit Reduction:**  
     - *Problem:* "Ought is whichever minimizes harm."  
     - *Fix:* Referee: *"Does your verdict `ought(A)` still hold even if B has slightly better consequences?"* Force symmetry.  

  3. **Asymmetric Cases:**  
     - *Problem:* Groups design lopsided claims (e.g., "save child" vs. "return library book").  
     - *Fix:* Referee challenge: *"Is there *no* reason to prioritize one? If asymmetric, revise for symmetry."*  

  4. **Time Crunch:**  
     - *Fix:* Strict 15-min case-building. Pre-write claim deck cards. If a group stalls, give a "canned" symmetric case.  

  ---

  ### **What You Must Explain**  
  The activity *cannot* generate:  
  - The formal logical argument against dilemmas (agglomeration + ought-implies-can).  
  - The distinction between epistemic uncertainty ("I don’t know my duty") and actual conflicts ("No right answer exists").  
  - **Do this in the 5-min debrief.** Point to groups’ repairs as "real-time" examples of dilemma-denial strategies.  

  ### **Why This Works**  
  - Students *experience* the impossibility of codifying symmetric conflicts, making the abstract concrete.  
  - Creditor/test/sealed residue operationalizes theoretical distinctions without lecturing.  
  - Re-choice reveals the affective core of dilemmas: residue persists even when choice is affirmed.  

  **Final Tip:** Start STRICT on rules. The frustration of rejection fuels deeper engagement. End by acknowledging the unresolved tension: logic vs. phenomenology of moral experience.
