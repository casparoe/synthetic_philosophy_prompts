prompt: |-
  I'm teaching a unit on conventional obligation next term and I keep going back and forth on it, so here are my gut verdicts — I'd like the principle they add up to, if there is one.

  Visitor from a no-tipping country leaves nothing in a US restaurant: basically fine, I don't think she's wronged anyone. Same visitor shoving in with everyone else to board a bus where the scrum is the norm: fine. An American who leaves a fat tip in a country where tipping isn't the practice: not fine — mildly obnoxious, even though nobody is harmed in any obvious way. Local queue-jumper: clearly not fine. Local crossing against the light on an empty street with no one watching: fine, and fine for the visitor too. Someone who flies to the same city every month for years and never picks up the local queuing norm: not fine, and worse than a two-day tourist doing exactly the same thing. And the one I can't settle: a delivery app that flashes a 20% default at you — I feel more obliged than I did with the old optional tip jar, and I can't tell whether the app is making a request or quietly rewriting the convention.

  The thing I've been toying with is a draw-down condition: you owe conformity in proportion to how much you're taking out of the local cooperative scheme that runs on that convention, so tourists and passers-through owe almost nothing. But it doesn't explain why exiting a convention is free while importing one isn't, or why the empty-street jaywalk feels different from the queue jump.

  So: one principle or several? Which of my verdicts does it force me to drop, and what does it say about the expat of ten years who still won't tip, and about a convention most locals actually resent and are trying to get rid of — is complying with it a way of respecting them or of propping up something they want dismantled?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're teaching a unit on conventional obligation and have shared various scenarios with their gut verdicts. They want a unifying principle but feel their "draw-down" idea has gaps. The user is clearly struggling to reconcile different cases: tipping, queueing, jaywalking, and the app default tip.

  First, I need to identify the core issues. The user's scenarios highlight conflicts between local conventions, harm, consent, and duration of stay. The draw-down condition focuses on participation in cooperative schemes but fails to explain why importing conventions (like tipping where it's not done) is problematic or why some violations feel harmless (jaywalking alone). 

  The user is likely looking for a principle that can be taught clearly, so it needs to be robust across cases. They also mention the expat who doesn't adapt and conventions locals resent. These add layers: when does non-compliance become disrespectful versus aligned with changing norms?

  Looking at their verdicts, consistency is key. Why is jaywalking alone acceptable but queue-jumping not? Both are violations, but the harm differs. Queue-jumping directly affects others' interests by taking their spot, while solitary jaywalking doesn't harm anyone. The "harm to cooperative interests" angle might bridge this. 

  The expat case is tricky. Ten years of non-tipping suggests they're benefiting from the system (service quality) without contributing, which feels exploitative. But if locals are trying to abolish tipping, complying might actually support the unwanted system. Here, the principle must account for dynamic norms and local dissent. 

  The app’s default tip raises consent issues. Is it a request or a new convention? The user feels coerced, which touches on whether the convention is being manipulated by external actors (the app) versus organic norms. 

  I recall philosophical concepts like conventionalism (David Lewis) and Scanlon's contractualism. The key elements seem to be: harm to others’ interests under the convention, reasonable expectations, and the convention's functionality. Also, the role of consent in norm participation versus imposition. 

  Synthesizing these, the principle should emphasize avoiding harm to others’ cooperative interests based on legitimate expectations. Duration matters because longer stay increases participation and thus expectations. Importing a foreign convention disrupts local autonomy, explaining why the American tipping abroad is obnoxious. 

  For the resentful convention, complying might harm by perpetuating it, so non-compliance could be respectful if aligned with local dissent. The expat not tipping where it's expected harms service workers who rely on tips, justifying obligation. 

  The delivery app’s default might be creating a new convention, but if users feel coerced, it lacks the mutual recognition of traditional norms. That’s why it feels different from a tip jar. 

  The unified principle would be: comply to prevent harm to others’ cooperative interests under legitimate expectations, adjusted for knowledge and participation level. This maintains most of the user's verdicts but might require viewing the app case as a convention-in-flux, where obligation is emerging but not yet firm. 

  Testing it: the tourist not tipping in the US? Minimal participation, so no harm. Queue-jumping? Harms others’ turn-taking interests. Fat tip abroad? Imposes a foreign norm, disrupting local practices. Expat non-tipper? Harms workers by free-riding. Resented convention? Compliance might harm by sustaining it, so obligation weakens if locals dissent. 

  This seems to cover most cases, though the app remains fuzzy due to its artificiality. The user might need to discuss how digital platforms reshape conventions differently than organic norms.
answer: |-
  Your intuitions reveal a coherent principle, but it needs refinement beyond a simple "draw-down" model. The core idea is **avoiding harm to others' legitimate expectations and cooperative interests under a functional convention, weighted by your participation level and knowledge.** Let's break it down:

  ### Proposed Principle:
  **You have an obligation to comply with a local convention when:**
  1.  **The convention solves a coordination problem or protects a cooperative interest** (e.g., fair queueing, fair wages via tipping, traffic safety).
  2.  **Non-compliance predictably harms others' interests grounded in that convention** (frustration, financial loss, wasted time, safety risk).
  3.  **You are a participant in the scheme sustained by the convention**, with obligation proportional to your level of participation/integration and knowledge of the norm.
  4.  **The convention is functionally operative and represents a legitimate (even if imperfect) local agreement** (not universally resented or actively collapsing).

  ### Applying the Principle to Your Verdicts:
  1.  **Visitor doesn't tip (US):** *Fine.* Low participation (tourist), harm is diffuse/systemic but *highly* speculative (one missed tip won't collapse wages). The worker's *expectation* exists, but the visitor's minimal participation reduces obligation.
  2.  **Visitor joins bus scrum:** *Fine.* Convention is chaotic "scrum" not orderly queueing. Participation is low. No clear *harm* to specific expectations (everyone expects a scrum).
  3.  **American tips fat where not done:** *Not Fine (Obnoxious).* **Harm:** Undermines the local cooperative scheme. It pressures workers/establishments, potentially inflating prices or creating awkward expectations. Violates the *legitimate local agreement* ("we don't tip here"). It's importing an external convention, disrupting the local solution.
  4.  **Local queue-jumper:** *Not Fine.* **Harm:** Directly harms others' legitimate expectation of turn-taking (time, fairness). High participation implies consent to the scheme.
  5.  **Local/Visitor jaywalks on empty street:** *Fine.* **Harm:** Minimal to none. The safety interest protected by the convention isn't engaged (no traffic, no pedestrians). The convention remains functional, but compliance offers no benefit here.
  6.  **Frequent flyer ignores queuing norm:** *Not Fine (Worse than tourist).* **Harm:** High participation creates strong legitimate expectations among locals/regulars. Consistent non-compliance is free-riding on the cooperative scheme they benefit from (orderly boarding) while actively undermining it. Knowledge and repetition intensify the harm.
  7.  **Delivery app 20% default:** *Ambiguous, but leaning towards obligation.* This challenges point 4. **Is it a functional local convention?** It's new, corporate-driven, and possibly exploitative. **Legitimate agreement?** Unclear – users may resent it. **Harm?** Workers likely *rely* on these tips due to app pay models; non-compliance directly impacts their expected income. *Verdict:* You likely *are* obliged (due to worker reliance/harm), but the convention itself is ethically suspect (not fully legitimate). Your discomfort stems from the unclear "agreement" – it feels coercive, not conventional. The app *is* rewriting the convention, potentially illegitimately.

  ### What the Principle Forces You to Drop/Refine:
  *   **"Draw-down" is incomplete:** It captures participation but misses the **core elements of harm and legitimate expectations**. Exiting a convention isn't "free" if it harms others (e.g., quitting a tipping job harms co-workers relying on pooled tips). Importing a convention harms by disrupting the local solution.
  *   **The "Empty Street" Difference:** The principle explains this clearly. Queue-jumping *always* harms specific others' interests (turn-taking). Solitary jaywalking on an empty street *doesn't* harm the interests the convention protects (safety). The convention's *purpose* matters.

  ### Addressing Your Specific Questions:
  *   **Expat of 10 years who won't tip (where expected):** *Not Fine.* **High participation:** They are a full participant in the local economy/society benefiting from services structured around tipping. **Harm:** Directly harms service workers relying on tips for livelihood. **Legitimate Expectation:** Workers and establishments reasonably expect compliance from long-term residents. It's free-riding and disrespectful to the local cooperative scheme they live within.
  *   **Complying with a resented convention locals want dismantled:** This is complex. The principle suggests:
      *   **Compliance might prop it up:** If the convention is dysfunctional and actively opposed, compliance could perpetuate harm.
      *   **Non-compliance might be respectful:** If done *in solidarity* with the local movement for change, non-compliance aligns with the *emerging* legitimate agreement and aims to dismantle a harmful system.
      *   **Key Factors:** Is your non-compliance visible activism supporting locals? Or is it just self-serving? Does it harm vulnerable individuals *now* (e.g., underpaid workers) before the system changes? Is there a clear, organized local effort to change it?
      *   *Verdict:* Blind compliance isn't required for respect. Respect involves understanding the context. Sometimes, respectful action means *joining the effort to change* the convention, not propping it up. However, be mindful of unintended harm to individuals trapped in the system during transition.

  ### One Principle or Several?
  You have **one core principle** (avoiding harm to legitimate cooperative expectations), but it **requires several key elements** to apply it consistently: Harm, Legitimate Expectations, Cooperative Interest/Solution, Participation Level, and Convention Functionality/Legitimacy. It's a framework, not a single variable.

  This principle preserves most of your intuitive verdicts, clarifies the "empty street" vs. queue-jump distinction, explains the expat case, and provides a nuanced way to think about contested conventions. The delivery app case remains the murkiest because the "convention" is artificial, corporate-driven, and lacks deep social legitimacy – but worker reliance creates a harm-based obligation regardless.
