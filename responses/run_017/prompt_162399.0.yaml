prompt: |-
  I work in pharmacoepidemiology, mostly with observational claims data, and on two separate projects I have run into a configuration that I cannot name. I would like to know whether it has an established label, and, more than that, whether what I am looking at is really one phenomenon or two that I am conflating.

  The configuration, stated for the simpler of the two cases. Comparing a treated group with an untreated group on a binary adverse outcome, the crude comparison favours the untreated group: treated patients have, as I recall, a few percentage points more events. Adjusting for a pre-treatment covariate with four levels reverses the comparison: within every one of the four levels the treated group does better, by margins that are not trivially small. Adjusting further, for a second pre-treatment covariate crossed with the first, reverses it again: in fifteen of the sixteen finer cells the treated group does worse. In the second dataset the same thing happened at three levels of aggregation before the cells became too thin to estimate anything, and each reversal was in the same direction relative to the level above it. I have since satisfied myself with a small constructed example that nothing arithmetical forbids this, so I am not asking whether it can occur; I am asking what it is.

  Three things I think I can rule out. It is not Simpson's paradox proper as usually stated, which is a single reversal between an aggregate and one partition of it; here the reversal recurs, and the object that reverses at the third level is not the grand aggregate but the stratum one level up. It is not qualitative interaction in the clinical-trials sense, which is a difference in the sign of the effect between subgroups at the same level of analysis, not between levels of aggregation. And it is not non-collapsibility, which as I understand it is a shift in magnitude between a marginal and a conditional estimand that occurs even in the absence of confounding, and which is not a claim about the sign. I have also come across the regression-textbook talk of suppressor variables, and epidemiologists' talk of negative confounding, for the case where a coefficient changes sign when a covariate is added, but these seem to me to describe one step of what I am seeing rather than the pattern, and they carry no implication that the flip will recur if you keep going.

  So I want the carving, not the label. Specifically: does the phenomenon require the reversal to be strict at every cell at the deeper level, or does one contrary cell still count; does it require the deeper estimates to be individually significant, given that the cells thin out as one descends; can the alternation continue indefinitely if the covariates are continuous and finer partitions are always available, or must it terminate; and does the fact that the sign alternates impose any constraint at all on the sign of the estimate one gets from adjusting for everything? I also want to know whether I am describing two separable things — a purely algebraic fact about nested partitions, and a distinct epistemic predicament, namely that every variable in these hierarchies is an ordinary pre-treatment confounder, so the standard causal advice is to adjust for all of them, and yet the sign I would report then depends on how many confounders happen to have been measured, with nothing in the data telling me whether I have finished.

  If there is a name for this, give it and say how it is demarcated from Simpson's paradox and from the near-misses above. If there is not, say so plainly, and propose a term with a definition tight enough to settle the boundary cases I listed, rather than a name alone.
reasoning: |-
  Okay, let me start by unpacking the user's query. They work in pharmacoepidemiology with observational claims data and encountered a phenomenon where adjusting for covariates repeatedly reverses the direction of the treatment effect. They mentioned three levels: crude comparison favors untreated, adjusting for one covariate (four levels) reverses it, and adjusting further with another covariate (crossed, sixteen levels) reverses again. They constructed an example to confirm it's possible, so they're not questioning feasibility but seeking understanding.

  First, I need to recall statistical phenomena that involve reversal of associations. Simpson's Paradox comes to mind, but they already ruled that out because it's a single reversal, not recurring at multiple levels. They also mentioned qualitative interaction and non-collapsibility, which don't fit either. The user is looking for a specific pattern where reversals happen at each level of stratification, and the sign alternates as you go deeper.

  The key here is the recurring reversal. I remember that the Yule-Simpson effect is sometimes used interchangeably with Simpson's Paradox, but that's still a one-time reversal. What they're describing involves multiple reversals as more covariates are added. Then I think about suppressor variables and negative confounding, which they mentioned, but those are single-step changes. 

  Wait, maybe this is related to the Alias Effect? That's when adding a covariate that's correlated with both treatment and outcome reverses the effect. But does it recur? Probably not. Hmm, perhaps it's a form of sequential confounding where each layer of adjustment introduces a new confounder that flips the sign. But the user mentioned that all covariates are pre-treatment confounders, so adjusting for all should be standard. Yet the sign depends on how many are adjusted for. 

  Another angle: could this be related to the Frisch-Waugh-Lovell theorem? But that deals with partial effects, not sign reversals. Maybe collider bias, but they're not conditioning on post-treatment variables. The user emphasized that covariates are pre-treatment, so colliders aren't likely. 

  I recall something called "reversal paradox" or "Amalgamation Paradox," but that's similar to Simpson's. Then it hits me: this sounds like a manifestation of the Noncombinatorial Paradox described by Pavlides and Perlman. Their 1984 paper discusses situations where associations reverse at multiple levels. That might fit because they show algebraically how each stratum can flip the sign when adding layers. 

  But the user mentioned 15 out of 16 cells showing reversal. Pavlides and Perlman require strict reversal in every sub-stratum. The user asked if one contrary cell still counts. That's a boundary case. If 15/16 show reversal, it might still be considered under this paradox, but strictly speaking, the original definition requires every finer stratum to reverse. 

  Then there's the epistemic problem. The user is concerned that standard causal advice says to adjust for all confounders, but here the sign depends on how many are included. So even if they adjust for all measured confounders, if there's an unmeasured one, the sign might flip again. This ties into the problem of unmeasured confounding and the limitations of observational data. 

  I need to distinguish between the algebraic phenomenon and the epistemic issue. The algebraic part is the recurring reversal under nested partitions, which Pavlides and Perlman cover. The epistemic part is about not knowing if all confounders are measured, leading to uncertainty in the sign. 

  Also, can this continue indefinitely? If covariates are continuous, theoretically yes, but in practice, cells become too thin. The sign alternation doesn't constrain the final estimate; it could be positive or negative depending on the last level. 

  So the term "Recursive Reversal Paradox" could be proposed, defined with specific criteria: strict reversal at each level, within every stratum of the previous level. But the user's case with 15/16 cells might not fit strictly. Maybe relax it to "overwhelming majority" of cells. However, that could blur the definition. 

  For the epistemic issue, it's separate: it's about the dependence of causal conclusions on the set of measured confounders. This relates to the Table 2 Fallacy or adjustment selection bias but is distinct. 

  The user also asked if there are two separable things. Yes: the mathematical phenomenon (recursive reversal) and the causal inference challenge (sign uncertainty due to unmeasured confounders). 

  In conclusion, there isn't a widely accepted name, so coining "Recursive Reversal Paradox" with a tight definition makes sense. The epistemic issue is part of broader causal inference problems. The boundary cases need clear rules: strict reversal per stratum, no requirement for significance, indefinite alternation possible in theory, and no constraint on the final sign.
answer: |-
  Based on your detailed description and the characteristics you've outlined, the phenomenon you're encountering **does not have a single, widely established, and universally agreed-upon name** in the statistical or epidemiological literature. It represents a specific and complex pattern beyond the standard definitions of Simpson's paradox, qualitative interaction, non-collapsibility, or suppressor variables.

  Here's the carving and proposed terminology:

  1.  **The Core Phenomenon: Recursive Reversal Paradox (RRP)**
      *   **Definition:** A pattern in stratified analysis where, for a treatment effect estimand (e.g., risk difference, odds ratio):
          *   The crude (unadjusted) association has a specific sign (e.g., Harmful: Treated > Untreated).
          *   Adjusting for a set of pre-treatment covariates C1 (forming strata K) **reverses** the sign of the association within *every* stratum of K (e.g., Protective: Treated < Untreated within each K=k).
          *   Further adjusting for an additional set of pre-treatment covariates C2, *conditional* on the strata defined by C1 (forming finer strata L|K), **reverses the sign again** within *every* (or nearly every) stratum L|l within each K=k (e.g., Harmful within each finer cell).
          *   This sign reversal recurs at each successive level of conditional stratification using additional pre-treatment covariates.
      *   **Distinction from Simpson's Paradox:**
          *   **Simpson's Paradox:** Involves a **single reversal** between the crude estimate and the estimate conditional on *one* set of covariates (or pooled within those strata). The reversal occurs between two levels: marginal vs. conditional on Z.
          *   **RRP:** Involves **multiple, sequential reversals** occurring at *each* successive level of finer-grained conditional stratification (Marginal -> C1 -> C2|C1 -> C3|C1,C2 ...). The reversal happens between *adjacent levels* of the nesting hierarchy (e.g., within-K vs. within-(L|K)).
      *   **Distinction from Qualitative Interaction:** Qualitative interaction refers to the *sign* of the treatment effect differing **across subgroups defined at the *same* level of conditioning** (e.g., within different strata of K). RRP involves the sign differing **between *different levels* of conditioning/aggregation** (e.g., within-K vs. within-(L|K)).
      *   **Distinction from Non-Collapsibility:** Non-collapsibility explains a *magnitude* change (often inflation for ORs/RRs) between marginal and conditional estimates *even without confounding*. RRP specifically involves **reversals of the *sign*** and is driven by complex confounding structures interacting across nested strata.
      *   **Distinction from Suppressor/Negative Confounding:** These terms typically describe a **single reversal** when adding *one* covariate (or set) to a model. RRP describes the **recurrence** of this reversal phenomenon as *additional* layers of conditioning are applied sequentially.

  2.  **Addressing Boundary Cases & Mechanics:**
      *   **Strict Reversal in Every Cell?** The archetypal RRP requires reversal within **every** finer cell at the deeper level *within each stratum of the previous level*. If even one cell at level (L|K) within a specific K=k shows the *same* sign as its parent stratum K=k (or no effect), the strict recursive pattern is broken for that branch. However, if reversals occur in the **vast majority** of finer cells (e.g., 15/16), it strongly suggests the underlying structure driving RRP, even if a small number of cells deviate due to sampling variability or minor effect heterogeneity. The *definition* requires reversal in every cell; the *phenomenon* often manifests with near-complete reversal.
      *   **Statistical Significance?** **No.** RRP is fundamentally an **algebraic/data structure phenomenon**. It exists regardless of statistical significance, sample size, or the precision of estimates within thinning cells. The thinning cells simply make the phenomenon harder to *observe reliably* at deeper levels.
      *   **Can it Continue Indefinitely?** **Theoretically yes, arithmetically.** If you have continuous covariates or a theoretically infinite hierarchy of finer pre-treatment confounders, you could construct scenarios where the sign alternates forever with successive conditioning. **Practically no:** Data limitations (vanishing cell sizes, measurement error, model saturation) will terminate observable reversals long before infinity. The sign alternation is constrained by the available data resolution and model feasibility.
      *   **Constraint on the "Fully Adjusted" Sign?** **No.** The sign obtained after adjusting for *all* measured confounders (the deepest level you can estimate) is not predetermined by the alternating pattern. The alternating pattern tells you nothing about whether this final estimate is "correct" or what its sign would be if you adjusted for *even more* unmeasured confounders. It could be positive, negative, or null.

  3.  **Separable Components: Two Intertwined Problems**
      *   **1. Algebraic Phenomenon (Recursive Reversal):** This is the core mathematical pattern described above – the recurrent sign reversal across nested conditional distributions due to specific dependencies between treatment, outcome, and the hierarchy of confounders. It's a property of the joint distribution.
      *   **2. Epistemic Predicament (Sign Uncertainty from Adjustment Depth):** This is the causal inference dilemma arising *because* you are dealing with observational data and potential confounders. Standard causal advice (adjust for all confounders) collides with the RRP structure:
          *   The sign of the estimated effect depends crucially on *which level* of the confounder hierarchy you stop adjusting at.
          *   There is *nothing inherent in the data* at level N that tells you whether adjusting for a potential confounder at level N+1 would flip the sign *again*.
          *   You are forced to rely on the **causal assumption** that you have measured *all* relevant confounders *sufficiently well* (i.e., that the hierarchy stops at your measured set, or that the remaining unmeasured confounders wouldn't induce another flip). This assumption is fundamentally untestable with the data alone.
          *   The RRP structure makes this uncertainty particularly stark, as the sign oscillates rather than just the magnitude changing. Reporting an effect requires justifying why adjustment stopped where it did.

  **Conclusion and Proposed Term:**

  *   **Name:** **Recursive Reversal Paradox (RRP)**
  *   **Definition:** A phenomenon occurring in stratified analyses where the sign of the association between an exposure and an outcome systematically reverses upon *each* successive conditioning on nested sets of pre-treatment covariates, such that the association reverses within every stratum defined by the previous level of conditioning.
  *   **Why this fits:**
      *   **Recursive:** Describes the repeated, hierarchical nature of the sign flips.
      *   **Reversal:** Clearly indicates the change in direction (sign).
      *   **Paradox:** Highlights the counter-intuitive nature where aggregate and successively stratified associations contradict each other sequentially.
  *   **Boundaries Settled:**
      *   Strictly requires reversal within *every* finer cell *within each parent stratum* to fully satisfy the definitional pattern. (15/16 is highly suggestive but not definitionally perfect).
      *   Independent of statistical significance or cell size limitations (it's a data structure property).
      *   Theoretically infinite alternation possible, practically limited by data.
      *   No constraint on the sign of the "fully adjusted" estimate.
      *   Explicitly distinguishes from Simpson's paradox (single reversal, two levels) and qualitative interaction (same level).
      *   Recognizes the two components: the algebraic pattern (RRP itself) and the resultant causal epistemic predicament (Sign Uncertainty from Adjustment Depth).

  You are observing a profound illustration of the complexities of confounding in observational data. The RRP structure demonstrates that the quest for a single "true" adjusted estimate is fraught, as the sign itself can be unstable across different levels of adjustment depth, even when adjusting for legitimate pre-treatment confounders at each step. This necessitates extreme caution in interpretation and heavy reliance on subject-matter knowledge to justify the chosen level of adjustment.
