  - Ensuring end-words shift grammatical function (e.g. "faithful" as adjective then noun)
  - Embedding the epistemological dilemma in narrative: the female subject's perspective dominates, making "inferred" evidentials most plausible

  The defense paragraph must then commit: form-preserving translation creates a new epistemological artifact. We sacrifice explicit evidential marking to preserve lyric essence, accepting that compressed forms generate ambiguity. The strongest counterargument would be that this constitutes epistemic violence by erasing the source's truth-claims - which the poem answers by showing how prose explication destroys lyric immediacy.

  This approach meets all requirements: professional rigor (evidential compression handled correctly), poetic merit (coherent love story), and philosophical position (form shapes epistemology). The avoidance of translator-figures and translation clichés keeps focus on the linguistic mechanics.
answer: |-
  Here is a sestina crafted for your closing reading, followed by a committed prose defense:

  **Sestina for the Selven**

  This envelope holds no proof, no **letter**
  Signed by her hand, only the **measure**
  Of her absence, cold. Was she **faithful**
  To the hour? My clumsy **tongue**
  Cannot ask. This silence is **seen**
  As confession. What was she **told**?

  I imagine what she was **told**
  Might condemn me. No swift **letter**
  Can refute it. The fact is **seen**
  In her distance. What strict **measure**
  Of my fault does her sharp **tongue**
  Rehearse? Was my own love **faithful**?

  Doubt insists I was not **faithful**
  Enough. Each whispered word I **told**
  Her, each promise, feels false on my **tongue**
  Now. I'd recall every **letter**,
  Scrap the harsh, accusing **measure**,
  Show what only my heart has **seen**.

  But the heart’s witness, dearly **seen**,
  Lacks the mark. The court wants **faithful**
  Record: evidence, **measure**,
  Document. What can be **told**
  Under oath? Not this raw **letter**
  Burning mute on my guilty **tongue**.

  Condemned by my own failing **tongue**
  And the things she believes she has **seen**.
  A mere phrase in her last **letter** –
  "Others say..." – proves I'm not **faithful**.
  Every inference she’s been **told**
  Hardens, sets like a plaster **measure**.

  To keep the **measure**, we must choose which **tongue**
  Speaks the verdict: the **seen**, or the **told**?
  What the heart knows, or what stands **faithful**
  On the page? The stark **letter**
  Claims I faltered. Her eyes have **seen**
  Gestures twisted by rumour's **measure**.

  This strict **measure** binds the **tongue**,
  Muffles what should be **seen** or **told**.
  Where's the **faithful** trace in the **letter**?

  **Envoi**
  The **faithful** ink bleeds. Was it **seen**
  Or just **told**? This cramped **letter**
  Holds no **measure** true on the **tongue**.

  ---

  **Defense & Commitment:**

  This poem argues that **strict formal preservation in translation actively generates the poem's core meaning, particularly concerning epistemological uncertainty.** By forcing the end-words (especially *seen*, *told*, and *faithful*) into fixed positions line after line, the sestina form *enacts* the Selven translator's dilemma: the necessity of choosing *one* evidential stance per line to satisfy the meter and rhyme, thereby excluding or altering others. The poem demonstrates that this constraint isn't merely a technical hurdle but the very engine of its emotional and thematic tension – the lover's anguish stems *from* the inability to express the fluid ambiguity of knowledge ("Was it **seen** / Or just **told**?"). To preserve the "**measure**" (both poetic meter and the standard of proof) and the lyric intensity (the raw feeling of doubt and accusation), the translation **deliberately sacrifices the explicit, unambiguous marking of evidential source** inherent in the Selven original. It embraces the resulting ambiguity as *truer* to the messy reality of human perception and report than a prose crib could be, even if that crib meticulously tags each clause. The strongest objection from a dissenting translator would be that this approach **smuggles in epistemological relativism and obscures the source text's precise truth claims**, potentially replacing the author's specific evidential framework with the target language's inherent ambiguity, thereby committing a form of interpretive violence under the guise of artistic necessity. The poem counters by showing that the *struggle* to fit the evidential into the form *is* the authentic emotional core, and that the "faithful trace" lies in preserving that struggle's shape, not in explanatory footnotes that dissolve the lyric into hearsay. The form *is* the argument for the irreducible friction between certainty and expression.
