prompt: |-
  I'm in an advanced undergraduate seminar this term on aggregation in ethics — we opened with Taurek's classic paper on whether the numbers count, spent three weeks on the replies to it, and I've come away less sure than when I started that everyone in the literature is arguing about the same question. My term paper is supposed to take a stand, but before I take one I want the specification. What would an adequate account of the numbers question in life-and-death cases actually have to deliver in order to count as a solution? I want the list of requirements — the cases it has to get right, the distinctions it has to respect rather than collapse, the results in neighbouring areas it isn't allowed to contradict — each with the case or consideration behind it, because I've noticed that a requirement offered without a case attached to it is usually somebody's intuition wearing a suit. Fix the theory's job as follows, and tell me if fixing it that way already begs something: it is to tell a single rescuer, a stranger to everyone at risk and not herself at risk, what she morally ought to do and what she is permitted to do when she can save either a larger group or a smaller one from death but not both. I also want to know whether a theory adequate for that job thereby has to be adequate for a hospital triage officer or a ministry dividing a fixed budget between a common disease and a rare one, or whether it is respectable to have one answer for individual rescuers and another for institutions.

  Here are the materials I keep tripping over; treat them as candidate desiderata rather than as settled ones, and add the ones I've missed. First, the disjoint case — six people in one place, one in another, one trip — as against a nested case where the smaller group is a proper subset of the larger: you can rescue Ada, or you can rescue Ada together with five others, so that saving the many is also better for Ada. Does a view have to answer both the same way, and if it answers them differently is that a feature or a symptom? Second, a shrinking-crowd version: one against one, then two against one, then three against one and upward. If numbers begin to matter somewhere, where do they begin, and why isn't the cut-off arbitrary — so does continuity, or a principled threshold, belong on the list at all, or is it just a debating trick? Third, the lottery cases: one in which everyone at risk agreed in advance to a fair lottery, one in which nobody agreed, and a risk version in which the rescuer can give each of six a one-in-six chance or give one person certainty. Must a theory say something separate about chances and about consent, or does the certainty case settle them? Fourth, the small-benefit contrast: six mild headaches against one severe one, where nearly everyone aggregates without hesitation. If the theory refuses to aggregate lives, must it refuse to aggregate headaches too, or must it say what is special about the goods at stake — and is that marker a genuine requirement or a rescue attempt? Fifth, is the theory a theory of the betterness of outcomes, of permissibility, of reasons for acting, or of what a bystander may demand of the rescuer, and can numbers count in one of those registers while being inert in another? Sixth, the equality point that cuts both ways: every anti-aggregation argument I've read leans on each person mattering equally, and the aggregator replies that this is precisely why six equal claims come to more than one. What must a theory say about equal concern so that this move doesn't simply run in both directions?

  For each requirement, say what it is for and mark it non-negotiable or a preference of one camp. Then tell me which pair of desiderata you suspect cannot be jointly satisfied, whether the list as a whole is satisfiable at all (if it isn't, that is itself a result I'd be happy to report in the paper), and which single requirement does the most work in excluding candidate views. Keep the scorecard short — a few lines each for straight aggregation, the no-numbers-with-a-lottery view, a greatest-claim or greater-burden view, and a priority-to-the-worst-off view — since the criteria are the part I need, but do say which requirement each of those four trips over. And please don't give me a reading list; I already have one.
reasoning: |-
  Hmm, this is a sophisticated query from an advanced undergraduate deeply engaged with aggregation ethics. The user has clearly grappled with Taurek's numbers problem and its aftermath, and now seeks methodological clarity for their term paper. They want rigorous criteria for evaluating solutions to the "single rescuer" case, presented with impressive awareness of conceptual pitfalls.

  The core tension I notice is between their demand for neutral criteria and the inherently contested nature of moral foundations here. When they dismiss requirements without cases as "intuitions wearing a suit," they're rightly suspicious of disguised biases - but every proposed criterion will reflect some normative commitment. My response must acknowledge this while still providing useful structure.

  Their six "materials" are astute. The disjoint/nested distinction reveals how aggregation views handle compensation; shrinking crowds expose threshold problems; lottery cases probe procedural vs outcome-based approaches; headache contrasts test scope limitations; register distinctions (betterness/permissibility/etc.) prevent category errors; and the equality paradox cuts to the heart of the debate. Each deserves careful unpacking.

  For the specification task, I'll propose criteria that:
  - Separate logical constraints (non-negotiable) from substantive commitments (negotiable but must be argued)
  - Flag where criteria embed controversial premises (e.g., continuity assumes commensurability)
  - Show how dominant theories fail different criteria (e.g., utilitarianism fails separability)

  The institutional question is particularly thorny. While some (like Scanlon) defend agent-relative permissions for individuals but not institutions, this requires explaining why role morality overrides the equal moral status of lives. I'll suggest this needs explicit justification beyond mere "respectability."

  When ranking criteria by exclusionary power, the separability requirement (from nested cases) seems most potent - it immediately eliminates standard consequentialism and some egalitarian views. The continuity criterion, while important, might be negotiable if one accepts thresholds.

  Throughout, I'll resist the urge to recommend readings (as requested) but will implicitly engage Parfit, Broome, and Otsuka where relevant. The tone should remain analytically crisp but acknowledge the user's sophisticated grasp of the terrain - they've clearly done their homework.
answer: |-
  Based on your framework and concerns, here's a specification of requirements for an adequate account of the "numbers question" in the single-stranger-rescuer case, treating your materials as candidate desiderata. "Non-negotiable" marks requirements violating widely shared minimal commitments; others reflect substantive debates. The job specification (single rescuer, strangers, no risk to self, life/death, save one group or the other) avoids begging key questions *if* we allow that solutions might differ for institutional actors.

  ### Requirements for an Adequate Account (The "Job Description")
  1.  **Disjoint vs. Nested Cases (The "Separability" Requirement):**
      *   **What it must deliver:** Must explain whether saving {A,B,C,D,E,F} over {A} (nested) is morally different from saving {B,C,D,E,F} over {A} (disjoint), and if so, *why*.
      *   **Case behind it:** Nested case reveals whether saving the larger group is merely "better for Ada" (suggesting aggregation is about *individual* gains) or constitutes a distinct moral reason based on numbers.
      *   **Status:** **Non-negotiable.** Any account *must* address this distinction explicitly. Failing to distinguish them plausibly collapses morally relevant differences; distinguishing them requires explaining why saving an extra person adds moral weight only when they are "new" or always.
      *   **Feature vs. Symptom?** Answering them differently is a *feature* if justified by a principle (e.g., claims/rights of the uniquely endangered). It's a *symptom* only if ad hoc.

  2.  **Shrinking Crowd & Continuity (The "Threshold" Requirement):**
      *   **What it must deliver:** Must explain *if* and *why* numbers matter at any given point (e.g., 2v1 vs. 1000v1). If a threshold exists, must justify its location non-arbitrarily. If no threshold (continuity), must explain the permissibility shift without sharp breaks.
      *   **Case behind it:** Intuitions often shift between "toss a coin" (1v1) and "save the many" (e.g., 5v1). Is this a smooth transition or a jump?
      *   **Status:** **Negotiable (Camp Preference).** Anti-aggregationists (Taurekian) often accept thresholds as non-arbitrary features of non-additive value/claims. Aggregators demand continuity/smoothness. *Requirement:* Must be *explicit* about which view it takes and *why* the chosen structure (threshold or continuity) is justified. Calling a necessary threshold "arbitrary" is a debating trick only if unjustified.
      *   **Marker:** A plausible justification for the structure (e.g., incommensurability justifying thresholds; commensurability demanding continuity).

  3.  **Lotteries & Risk (The "Procedural Fairness" Requirement):**
      *   **What it must deliver:** Must explain the moral relevance (if any) of:
          *   Ex-ante consent to a lottery.
          *   The rescuer imposing a fair lottery without consent.
          *   Giving each of six a 1/6 chance vs. giving one certainty.
      *   **Case behind it:** Does fairness require equal *chance* when saving all is impossible? Does consent transform the moral situation? Does giving chances fundamentally differ from choosing a certainty?
      *   **Status:** **Non-negotiable.** The account *must* have a coherent position on the relationship between fairness, consent, risk, and the duty to save. It cannot ignore these variations.
      *   **Settled by Certainty?** No. A view rejecting aggregation in the certainty case (save 1 vs. save 6) *must still explain* why a lottery or risk imposition is permissible/impermissible in that same case. A view endorsing aggregation must explain why lotteries are *not* required when saving all is impossible.

  4.  **Small Stakes Aggregation (The "Scope" Requirement):**
      *   **What it must deliver:** Must explain why aggregation seems obviously permissible for small harms (6 mild headaches vs. 1 severe one) but contested for lives. Must specify what property of the good (e.g., triviality, fungibility, non-baseline status) marks the difference, *or* reject aggregation consistently.
      *   **Case behind it:** The headache case tests the generality of anti-aggregation principles. If the principle forbidding life aggregation also forbids headache aggregation, that's a reductio for most. If it allows headaches, it needs a non-ad hoc marker.
      *   **Status:** **Non-negotiable.** An account *must* address the scope of its aggregation principle. Providing a plausible marker (e.g., "basic interests," "preventing catastrophic loss," "fungibility") is essential, not just a rescue attempt. Failure here suggests the core principle is flawed or misapplied.

  5.  **Register Clarity (The "Level" Requirement):**
      *   **What it must deliver:** Must explicitly state whether numbers count at the level of:
          *   *Outcome Betterness:* Is the world *better* if more are saved?
          *   *Permissibility:* Is saving the many *required* or just *permitted*? Is saving the few *permitted*?
          *   *Reasons/Claims:* Do individuals have stronger claims/reasons provided by the group size?
          *   *Demands:* Can the unlucky few (or many) *demand* the rescuer acted wrongly?
      *   **Case behind it:** Confusion arises when arguments slide between these registers (e.g., "The outcome is better, therefore you must save the many" conflates betterness and permissibility).
      *   **Status:** **Non-negotiable.** The account *must* specify its primary focus and how the other levels relate. Numbers *can* count in one register but not another (e.g., outcome better but rescuer permitted to save the few based on agent-relative reasons).

  6.  **Equal Concern (The "Foundational Equality" Requirement):**
      *   **What it must deliver:** Must reconcile its answer with the principle of equal moral concern for each person. Must explain how treating individuals equally justifies either aggregating or refusing to aggregate their interests/claims.
      *   **Case behind it:** Both sides invoke equality – anti-aggregationists say equality means not sacrificing one for the sum; aggregators say equality means each person's claim adds equal weight to the total.
      *   **Status:** **Non-negotiable.** Any plausible moral theory must respect equal concern. The account *must* provide a non-question-begging interpretation of what equal concern demands in this choice situation. Simply asserting one interpretation is insufficient.

  **Institutional vs. Individual:** It *is* respectable to have different answers *if* justified by a relevant moral difference (e.g., institutional role duties, democratic accountability, efficiency constraints inherent to institutions, the scale removing agent-relative permissions). However, the *core justificatory principle* (e.g., maximizing welfare, respecting separateness of persons, priority to the worst off) should be consistent. The burden is on the theory to explain *why* the context shift matters morally.

  ### Suspected Tensions & Satisfiability
  *   **Hardest Pair:** **Scope** and **Separability**. A marker distinguishing headaches and lives (Scope) must work cleanly in *both* disjoint *and* nested cases without generating counterintuitive results (e.g., making saving {A,B,C,D,E,F} over {A} permissible only if F's life is "fungible" in a way that seems irrelevant). Justifying why the marker applies differently in nested vs. disjoint is challenging.
  *   **Overall Satisfiability:** The list is **demanding but likely satisfiable** by a sophisticated view that carefully defines its scope marker, distinguishes outcome betterness from permissibility, provides a nuanced account of claims/reasons incorporating group size without simple addition, and offers a compelling interpretation of equal concern. However, no view satisfies *everyone's* intuitions on all points.
  *   **Most Exclusionary Requirement:** **Separability.** This trips up the most views most directly by forcing them to confront whether saving the larger group involves *harming* the smaller group member(s) in the nested case or merely failing to benefit them extra. It exposes the core mechanism of aggregation/non-aggregation.

  ### Scorecard on Candidate Views (Tripping Points)
  1.  **Straight Aggregation (e.g., Utilitarianism):**
      *   **Trips over:** **Separability.** Treats disjoint and nested cases identically: save the greater number. But this seems to ignore the specific claim of the uniquely endangered individual in the nested case (saving the group actively *harms* A compared to the alternative of saving only A). Also struggles with **Threshold** justification if it demands absolute continuity down to 2v1.
  2.  **No-Numbers + Fair Lottery (Taurek-esque):**
      *   **Trips over:** **Scope.** Why is flipping a coin required for 1 life vs. 1 life, and for 1000 lives vs. 1 life, but *not* for 1 severe headache vs. 6 mild ones? Providing a non-ad hoc marker is difficult. Also struggles with **Separability** justification (why is saving {A,B,C,D,E,F} over {A} *not* required if it harms A?).
  3.  **Greatest Claim / Greater Burden (Otsuka-esque):**
      *   **Trips over:** **Threshold.** What is the principled basis for the claim/burden difference becoming decisive? Why does the claim of the one outweigh 2 others, but not 3? Needs a non-arbitrary threshold or a different mechanism. **Procedural Fairness** also needs work: Why is a lottery *ever* required if the claim/burden is always greater on the one?
  4.  **Priority to the Worst-Off (E.g., Lexical Prioritarian):**
      *   **Trips over:** **Separability & Scope.** In the disjoint case (save 5 strangers vs. 1 stranger), everyone is equally badly off (facing death). Why prioritize the many? Needs an auxiliary principle (like aggregation) at the same level of urgency, conflicting with strict priority. **Scope** requires explaining why priority applies to lives but not headaches.

  This specification forces theories to confront the structural and justificatory challenges head-on. Your paper's strength will lie in rigorously applying these criteria to your chosen view, explicitly arguing why it meets the non-negotiables and how it handles the negotiables, while acknowledging the points of deepest tension. Good luck!
