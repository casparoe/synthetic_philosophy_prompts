  Hmm, the user runs the standards desk at an international news agency and needs a practical procedure for handling language about war casualties. This is a complex ethical and operational challenge. They're dealing with real-time editorial decisions across multiple languages, with clients and audiences on all sides of conflicts. 

  The core tension is between philosophical concepts of combatant equality and the practical need for neutral reporting. They've identified five key distinctions that often get blurred in coverage, but wisely don't want their desk to adjudicate deep moral questions. The swap test they've been using is insightful but flawed - it reveals bias but can't resolve underlying dilemmas.

  What they really need is a decision tree that enforces distinction #5 (equal commemoration) while bracketing #2-4 (moral judgments about fighting). The procedure must survive midnight deadlines and translation challenges. Interesting how they emphasize operationalization over theory - this isn't an academic exercise but a newsroom survival tool.

  For structure, I consider three approaches: 1) A status-based flowchart (too rigid for ambiguous cases), 2) A consequences-focused framework (too subjective for breaking news), 3) The chosen action-description method (preserves neutrality while allowing necessary distinctions). The third wins because it separates observable facts from moral loading.

  The swap test gets modified but kept - it's too valuable for catching accidental valorization, though useless for basic descriptions. The real test cases will hurt: that memorial feature about the soldier from "our" country will require uncomfortable neutrality. 

  Hard cases expose the limits: child soldiers stall the procedure (as they should - this requires human judgment), while surrendered fighters clearly demand "killed after surrender". Villagers taking up arms briefly are the trickiest - if we call them "fighters" we imply legitimacy, but "villagers" obscures their momentary combat role. 

  Most revealing are the escalation points - any question that touches on "just cause" or "blame" must go upstairs. The procedure's biggest weakness? It can't handle conflicts where status itself is disputed (like "terrorist" vs "freedom fighter"), forcing us into passive voice or direct quotes. 

  What would make me reconsider? If evidence shows audiences inherently perceive defensive fighters as more legitimate regardless of labels - then symmetrical language might actually create bias. But for now, the cost of asymmetry is higher.
answer: |-
  ### Decision Procedure: Operationalizing Neutrality in Conflict Reporting  
  **Core Principle:** Your language must treat all verified combatant deaths as *equally reportable human losses* regardless of affiliation. Enforce distinction #5 ("whether a dead person's life may be marked as a loss") as inviolable. Set aside distinctions #2–4 (permissibility, liability, blame) as beyond your adjudication. Use distinction #1 (legal status) only when verifiable under LOAC.  

  **Procedure (6 Steps):**  
  1. **Identify Status Under LOAC (Law of Armed Conflict):**  
     - *Question:* "Is the person’s status (combatant, civilian, *hors de combat*) confirmed by two independent sources (e.g., Red Cross, military statements, video evidence)?"  
     - *Sufficient Answer:* "Yes" with source citations.  
     - *Stop/No:* If status is unconfirmed → Default to "person" or "individual."  
     - *Timeout Default:* Use "person" or "individual."  

  2. **Strip Value-Loaded Verbs/Nouns:**  
     - *Question:* "Does the sentence contain words implying moral judgment (e.g., ‘hero,’ ‘martyr,’ ‘murdered,’ ‘eliminated’)?"  
     - *Sufficient Answer:* List all such terms.  
     - *Stop/No:* If found → Replace with neutral terms (e.g., "killed," "died").  
     - *Timeout Default:* Replace with "killed" or "died."  

  3. **Apply Modified Swap Test (Restricted to Commemoration Language):**  
     - *Question:* "If I swap the sides, does the wording *imply* one death is more tragic or legitimate than another (e.g., ‘gave their lives’ vs. ‘were killed’)?"  
     - *Sufficient Answer:* "Yes" or "No."  
     - *Stop/No:* If "yes" → Neutralize phrasing (e.g., "died" instead of "gave their lives").  
     - *Timeout Default:* Revert to "killed" or "died."  

  4. **Verify Action Description:**  
     - *Question:* "Does the sentence describe *what happened* (e.g., ‘a strike hit X’) rather than *why* (e.g., ‘revenge attack,’ ‘defensive operation’)?"  
     - *Sufficient Answer:* "Yes" for pure description.  
     - *Stop/No:* If "no" → Remove justification language.  
     - *Timeout Default:* Use passive voice (e.g., "a strike occurred").  

  5. **Assess Commemoration Equality:**  
     - *Question:* "Can the dead be named, counted, or memorialized *without* implying their cause was just/unjust?"  
     - *Sufficient Answer:* "Yes" if using neutral framing (e.g., "X people died" + names).  
     - *Stop/No:* If "no" → Remove commemorative context (report only facts).  
     - *Timeout Default:* Omit memorial language; state facts only.  

  6. **Final Neutrality Check:**  
     - *Question:* "Would this sentence be publishable if the affiliations were reversed?"  
     - *Sufficient Answer:* "Yes."  
     - *Stop/No:* If "no" → Rewrite per Steps 1–5.  
     - *Timeout Default:* Use direct quotes from sources (e.g., "Army X said: ‘...’").  

  ---

  ### Ruling on Swap Test  
  **Keep, but restrict to Step 3.**  
  - *Decisive for:* Flagging asymmetrical commemoration (e.g., "martyrs" vs. "militants").  
  - *Misleads on:* Descriptive facts (e.g., "soldiers killed in bunks" passes even for aggressors; "child killed" fails if sides swapped but is factually correct).  
  - *Why:* The test catches bias in *how* we mourn, not *what* we report.  

  ---

  ### Worked Applications  
  **Case 1: Overnight strike on barracks, conscripts killed.**  
  - *Procedure Output:* "An overnight strike hit a military barracks in [Location], killing [Number] conscripts. Identified as: [Names]."  
  - *Why:* "Conscripts" is a verifiable status (Step 1); no valorizing language (Step 2).  

  **Case 2: Strike on pickup truck, kills commander who targeted civilians.**  
  - *Procedure Output:* "A strike destroyed a pickup truck in [Location], killing three people. Local sources identified one as [Name], a commander of [Group]. [Group] has claimed attacks on civilians."  
  - *Why:* "Commander" is a role (Step 1); civilian attacks are verifiable facts (Step 4).  

  **Case 3: Memorial feature for soldier from our country, faulty intelligence.**  
  - ***Against Current Style:*** "A memorial was held for [Name], a soldier who died during a 20XX military operation. The operation was later criticized for relying on disputed intelligence."  
  - *Why:* Your style likely uses "hero" or "sacrifice." Step 2 strips this; Step 5 blocks implying just cause. The procedure *forces* neutrality by omitting "gave his life" (Step 3).  

  ---

  ### Verdicts on Hard Cases  
  1. **Child soldier carrying a rifle:** "Child killed" (Status unverifiable; Step 1 default).  
  2. **Armed medic:** "Medic killed" (Combatant status if armed; Step 1).  
  3. **Contractor driving supply truck:** "Driver killed" (Civilian unless directly participating; Step 1).  
  4. **Targeting analyst:** "Military analyst killed" (Combatant under LOAC; Step 1).  
  5. **Fighter killed after surrender:** "Surrendered fighter killed" (*Hors de combat* status; Step 1).  
  6. **"Terrorist" vs. "liberation" designation:** "[Group name] members killed" (No legal adjudication; Step 1).  
  7. **Villagers who took up weapons:** "Villagers killed" (Status ambiguous; Step 1 default).  
  - *Stalls?* Only if sources contradict (e.g., "villagers" vs. "fighters"). Escalate to Standards Desk.  

  ---

  ### Escalation Points  
  **Refer to you when:**  
  - Step 1: LOAC status is contested by reliable sources (e.g., is a medic a combatant?).  
  - Step 5: Clients demand commemorative language for "their side" (e.g., "national hero").  
  - **Ask you:** "Does this framing *require* implying moral blame/justification to report facts?"  

  ---

  ### Where It Misfires  
  - **Non-international conflicts:** When groups lack clear combatant status (e.g., insurgents). Cost: Overuse of "fighter" or "militant."  
  - **Propaganda-heavy wars:** When sources only provide value-laden terms. Cost: Over-reliance on quotes, losing narrative control.  
  - **Ambiguous actors:** e.g., armed protesters. Cost: Defaulting to "person" may undersell context.  

  ---

  ### What Would Change My Mind  
  If evidence shows that symmetrical language *systematically obscures* war crimes (e.g., calling child soldiers "fighters" sanitizes recruitment), I would reintroduce Step 1 as a *moral necessity*. Least confident in Step 4: Describing "what" without "why" can feel incomplete in complex conflicts (e.g., omitting "retaliatory" might hide escalation patterns).  

  ---  
  **Explicit Trade-offs:**  
  - *Enforced:* Distinction #5 (commemoration equality).  
  - *Set Aside:* #2–4 (permissibility/liability/blame).  
  - *Cost:* Language may feel sterile; avoids moral clarity but upholds universal dignity.
