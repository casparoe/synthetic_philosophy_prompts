  For Section III (Cruxes), I'll focus on predictions for each probe. For P2, the stable-concepts view predicts [ijl] as modal answer since the run-end (k) should advance, while fluid-concepts predicts nearly equal split between [ijl] and [kik] due to contextual pressure on "last." P3 will test successor wrapping - stable-concepts expects balking (no wrap) while fluid-concepts predicts [xya] as z's successor becomes fluid. Disconfirming evidence for each view is critical: stable-concepts would be challenged by answer distributions shifting with rotational notation in ways not explained by mapping search, while fluid-concepts would struggle if a fixed concept set plus mapping rules predicts all distributions without context-sensitivity.

  For Section IV (Closing), I'll emphasize what the collaboration has achieved (e.g., operationalized disputes via probes) and what remains open (e.g., whether microdomain findings generalize). Both sides should agree that the ring tests core claims about conceptual stability.

