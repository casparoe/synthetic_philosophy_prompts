answer: |-
  ## Joint Statement: Adversarial Collaboration on the Copycat Project in the Ring-String Microdomain

  **I. Agreed Claims**

  1.  **The Core Phenomenon:** The phenomenon requiring explanation is the distribution of answers (including balking) produced by human subjects across the probe battery, reflecting the probabilistic, often context-sensitive nature of human analogy-making in this microdomain. This distribution is the primary data.
  2.  **The Ring Constraint:** Removing explicit endpoints forces critical issues (e.g., "first," "last," run boundaries, directionality) to be handled explicitly by the underlying mechanisms, making latent tensions in both theories more visible than in the linear string domain. It does *not* fundamentally change the core cognitive process under investigation (analogy-making) but rather probes its foundations more directly.
  3.  **Conceptual Roles Exist:** The system necessarily manipulates entities corresponding to roles like LETTER, SUCCESSOR, GROUP, RUN, and positional/orientational aspects (e.g., "run-end", "direction", "relative position in the inscription"). Any account must specify how these roles are identified and utilized.
  4.  **Activation & Competition:** The process involves some form of dynamic activation spread and competition among representational elements (e.g., potential correspondences, role assignments, answer candidates). This dynamics contributes to the graded, probabilistic nature of the answer distributions.
  5.  **Structure Sensitivity:** Successful analogy-making in this domain depends on perceiving and utilizing the relational structure within the ring-string representations (e.g., runs, groups, relative positions), not just individual letter identities.
  6.  **Microdomain Competence:** A competent account of a probe must:
      *   Predict the modal answer(s) within the candidate set (or predict balking).
      *   Predict the relative likelihoods of different candidate answers (including balking) for that specific probe context.
      *   Explain *why* the predicted distribution arises, based on the theory's core mechanisms operating on the given input structures.
  7.  **Calibration Significance:** Probe P1 ([ijk] ⇒ [ijl]) serves as a calibration test. Any theory failing to predict this as the dominant answer for P1 is fundamentally flawed for this microdomain.
  8.  **"Slipnet Dynamics" as Mechanism:** Both views accept that Hofstadter & Mitchell's description involves a network ("slipnet") where activation spreads and concepts influence each other's accessibility and interpretation. The disagreement concerns the *nature* and *stability* of the concepts represented within that network during processing.

  **II. Residual Disagreements**

  | Issue | Stable-Concepts View (Own Wording) | Fluid-Concept View (Own Wording) | Neutral Restatement | Verdict & Justification |
  | :---- | :-------------------------------- | :------------------------------ | :------------------ | :---------------------- |
  | **1. Nature of Conceptual Content** | Conceptual roles (e.g., SUCCESSOR, RUN, "run-end") have fixed, pre-defined semantic content within the microdomain. Context influences which concepts are *relevant* or *salient*, not their intrinsic meaning. | Conceptual roles are inherently context-dependent. Their meaning (e.g., what constitutes a "run-end", the strength of SUCCESSOR) is dynamically constituted and graded, shaped by the specific structural pressures and relationships present in the current problem. | Disagreement on whether the semantic content associated with core conceptual roles (e.g., SUCCESSOR, RUN, positional markers) is stable and context-independent versus inherently fluid, graded, and constituted by the problem context. | **Genuine.** This leads to different predictions about how concepts behave across contexts (e.g., P2, P5) and what mechanisms drive answer distributions. |
  | **2. Primacy in Explanation** | The explanation for the answer distribution begins with constructing a structural mapping between the base and target representations using stable concepts. Answer distributions primarily reflect competition between different possible *mappings*. Conceptual activation serves mapping search. | The explanation begins with the fluid interaction and slippage of concepts themselves under structural pressure. The mapping emerges from this conceptual dynamics; competition among concepts *drives* the mapping and answer generation. | Disagreement on whether the primary locus of competition and variability driving the answer distribution is the search for mappings between stable representations versus the dynamic negotiation and slippage of conceptual identities themselves. | **Genuine.** This reflects a fundamental difference in the proposed causal chain: mapping search driven by concept activation vs. mapping as an emergent property of concept negotiation. |
  | **3. Source of Gradedness/Noise** | The probabilistic distribution of answers arises from noise or competition in the *mapping process* (e.g., stochastic selection of competing correspondences, salience weighting) operating over representations built from stable concepts. | The probabilistic distribution of answers arises directly from the inherent gradedness and context-sensitivity of the *concepts themselves*, which are activated to varying degrees and can "stretch" or "slip" under pressure. | Disagreement on whether the primary source of the graded, probabilistic answer distribution is stochasticity/competition within the mapping process operating on stable representations, or the inherent gradedness and context-dependence of the conceptual building blocks. | **Genuine (though linked).** While both involve competition, the disagreement centers on whether the fundamental variability lies in the mapping process or the conceptual content it operates on. Predictions differ (e.g., P4, P6). |
  | **4. Concept Identity Across Contexts** | The concept SUCCESSOR in P1, P3, and P5 is the *same* concept with a fixed meaning (e.g., next letter in sequence, possibly with wrap ambiguity). Observed differences in its application (e.g., wrapping in P3) reflect mapping decisions or rule application constraints, not a change in the concept. | The concept SUCCESSOR meaningfully changes across contexts (e.g., P1 vs P3 vs P5); its core properties (like directionality, wrap tendency, strength) are fluid and adapt to local structural pressures (e.g., the presence of z, lack of runs). The concept *is* different. | Disagreement on whether a core conceptual role (e.g., SUCCESSOR) retains its identity and core semantic properties across different problem contexts within the microdomain, or whether its core properties are sufficiently context-dependent to constitute meaningfully different conceptual states. | **Genuine.** This is core to the dispute. The stable view sees one concept applied differently; the fluid view sees different conceptual states. Predictions diverge sharply (P3, P5). |
  | **5. Role of Inscription Orientation** | The specific rotational inscription (e.g., [ijk] vs [kij]) is merely a notational variant. The underlying conceptual representation of the ring-string structure is identical. Any influence of inscription on answers stems solely from how it affects the *ease of perception* of the stable structure, not the structure/concepts themselves. | The specific rotational inscription is not neutral. It directly influences the initial activation and interpretation of positional concepts (like "last-written"), creating different starting points for conceptual slippage and mapping. The perceived structure can be genuinely different. | Disagreement on whether the specific rotational inscription of the ring-string is merely a perceptual cue to an underlying stable structure or whether it actively shapes the initial conceptualization and subsequent dynamics in a non-trivial way. | **Genuine.** The stable view predicts minimal inscription effects beyond perceptual ease; the fluid view predicts inscription can fundamentally alter the conceptual starting point and trajectory (P2). |

  **III. Cruxes: Predictions and Decisive Tests**

  *   **Shared Principle:** For each probe, the distribution of human answers (including balking) across the pre-agreed candidate set is the critical data. Results moving a side constitute a significant mismatch between its predicted distribution and the observed data, *especially* if the competitor's prediction aligns well. Each side specifies what would falsify its core claim.
  *   **Stable-Concepts Self-Falsification:** Systematic dependence of answer distributions *only* on the rotational inscription (e.g., different modal answers for rotations of the *same* ring-string, like P1 vs P2), *if* this dependence cannot be explained by differences in the ease of perceiving the *same* underlying stable structure and mapping during the search process.
  *   **Fluid-Concept Self-Falsification:** A single, fixed inventory of stable concepts plus a well-defined stochastic mapping/search process (with fixed salience/weighting rules) successfully predicts the detailed distribution of answers (including balking frequencies) for *all* probes in the battery *without* invoking context-dependent changes in the identity or core properties of the concepts.

  | Probe | Stable-Concepts Prediction (Modal / Distribution) | Fluid-Concept Prediction (Modal / Distribution) | Pattern Moving Stable-Concepts | Pattern Moving Fluid-Concept |
  | :---- | :----------------------------------------------- | :--------------------------------------------- | :----------------------------- | :--------------------------- |
  | **P1: [ijk] ⇒ ?** | [ijl] (Near 100%) | [ijl] (Near 100%) | N/A (Calibration) | N/A (Calibration) |
  | **P2: [kij] ⇒ ?** | [ijl] (High - Run-end `k` advances). [kik] very low (last-written `j` is not structurally salient). | Split: [ijl] (if "run-end" dominates) & [kik] (if "last-written" slips into prominence) both significant (~40-60% each). Balking possible. | If [kik] is modal or near-equal split with [ijl]. | If [ijl] is overwhelmingly dominant (>80%), suggesting "last-written" is structurally irrelevant. |
  | **P3: [xyz] ⇒ ?** | Balking (Modal). [xya] very low (SUCCESSOR doesn't wrap by default). [xyy] low (predecessor is distinct concept). | [xya] (Modal - SUCCESSOR wraps under pressure). Balking significant. [xyy] possible but lower. | If [xya] is clearly modal (>50%). | If balking is strongly modal (>70%) and [xya] is very low (<20%). |
  | **P4: [abcc] ⇒ ?** | [abdc] (Modal - Run-end `c` advances). [abcd] possible (if mapping extends run). [abdd] low (group slip unlikely). | [abdd] (Modal - Group `cc` slips & advances as unit). [abdc] significant (run-end). [abcd] possible. | If [abdd] is clearly modal. | If [abdc] is strongly modal and [abdd] is very low. |
  | **P5: [ace] ⇒ ?** | [acf] (Modal - Last-written `e` advances). [ade] low (middle lacks salience). Balking low. | Balking (Modal - No clear structural pressure point). [ade] significant (if pressure creates run). [acf] possible. | If balking is modal or [ade] is very high (>40%). | If [acf] is strongly modal (>60%) and balking is very low. |
  | **P6: [abcfg] ⇒ ?** | [abdfg] (Modal - Longer run's end `c` advances). [abcfh] low (later run `fg` less salient). | [abcfh] (Modal - Later run's end `g` slips into prominence). [abdfg] significant. | If [abcfh] is modal. | If [abdfg] is strongly modal and [abcfh] is very low. |

  **IV. Closing**

  This collaboration has established a clear operational framework within the ring-string microdomain to test the core disagreement between the stable-concepts and fluid-concept views of analogy-making. We have jointly defined the phenomenon (answer distributions), the testbed (probe battery), criteria for competence, and specific, divergent predictions for each probe. We have also clarified the genuine nature of our core disagreements regarding conceptual stability, the locus of competition, and the source of gradedness.

  The collaboration has *not* resolved the underlying theoretical dispute. It has not determined whether the ring-domain findings generalize fully to the linear Copycat domain or other analogy domains. It has not adjudicated the ultimate cognitive reality of "concepts" versus "mappings" beyond the predictive adequacy of the models.

  We agree that the results of human subject testing on the probe battery have the potential to significantly advance the debate. Specific patterns of results (as outlined in Section III) could provide strong evidence against one view or the other, or potentially against both. We further agree that regardless of the outcome, analyzing the results will deepen our understanding of the mechanisms of human analogy-making in structured microdomains.

  ---

  **V. Private Note to Moderator**

  *   **Likely Stalling Points:**
      1.  **Concept Identity (Issue 4):** This is the deepest rift. The Fluid side may feel the Neutral Restatement ("retains identity... core semantic properties") already biases towards stability. The Stable side may resist any phrasing implying concepts *can* change identity. Be prepared to focus discussions here on *operational consequences* (predictions for probes) rather than ontological claims.
      2.  **P4 ([abcc]):** The "group slip" candidate ([abdd]) is highly theory-laden for Fluid. Stable may argue it's not a "live" candidate based on their theory, despite pre-registration. Be firm on using the agreed candidate set for predictions, while allowing arguments about *why* a candidate is predicted low or high.
      3.  **"Balking" Interpretation:** Stable may view balking as a mapping failure ("no valid mapping found"). Fluid may view it as an active outcome of conceptual indecision or pressure. Ensure both define what their predicted balking *means* in their framework during discussion.
      4.  **Post-Hoc Explanations:** If results are ambiguous or mixed, both sides may try to explain deviations within their framework (e.g., Stable: "perceptual difficulty affected mapping search"; Fluid: "unexpected contextual factor influenced concept X"). Push them to state *in advance* what kind of result would be *difficult* or *impossible* to explain, beyond simple distribution mismatches.

  *   **Problematic Formulations (Risk of Rejection):**
      *   Stable-Concepts: Might balk at Neutral Restatement for Issue 4 ("retains identity... core semantic properties") if they feel "core semantic properties" could be interpreted too loosely. They strongly believe SUCCESSOR's meaning (e.g., no-wrap) *is* core and fixed.
      *   Fluid-Concepts: Might reject the Stable-Concepts wording for Issue 1 ("fixed, pre-defined semantic content") as a caricature, arguing they don't deny roles exist, just that their *content* isn't fixed. They may also feel the Neutral Restatement for Issue 3 underplays the centrality of conceptual fluidity as the *source*.
      *   Both: The "Primacy" issue (Issue 2) wording is stark. While accurate, it risks being seen as polemical by the side whose primacy is denied. Emphasize it's about the *explanatory starting point* in the model.

  *   **Crux Reformulation Suggestion:**
      *   **P3 Wrapping:** The predictions are clear, but the underlying "why" could be sharpened. Ask each side explicitly: **"In your model, what specific mechanism *prevents* (Stable) or *enables* (Fluid) SUCCESSOR from wrapping from z to a in P3?"** This forces them beyond the prediction to the causal mechanism difference. Stable will point to a fixed rule or mapping constraint; Fluid will point to contextual pressure altering the concept's behavior/strength.
