  For Section I (Agreed Claims), I need to establish substantive common ground that both sides would accept without being vague. Key points include: the ring-string domain eliminates endpoints forcing core issues into the open; the phenomenon to explain is human answer distributions including balking; conceptual roles like SUCCESSOR must be defined for the ring; and that "slipnet dynamics" refers to activation patterns regardless of interpretation. The calibration probe P1 should show consensus to validate the setup.

