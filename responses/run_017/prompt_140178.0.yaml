prompt: |-
  I write the public-facing text for a museum of archaeology — wall panels, object labels, the audio guide — and I do it with no training in the field; my degree is in English, and everything I know about these periods comes from our own catalogue and from reading around the subject on my own. Our current exhibition covers several past societies that went through sharp breaks, and I keep hitting the same problem: I don't know when I am allowed to use the word 'collapse'.

  The word does a great deal of work in a label. It tells visitors that something went wrong, that people suffered, that the people themselves were in some sense to blame, and that the story ended there. 'Transformation' tells them the opposite on all four counts, and it has started to feel like the polite word that quietly removes the suffering. Our curators sign off on the final text, and a liaison appointed by a descendant community reads anything concerning her ancestors, so the word has to survive two very different kinds of scrutiny. I need something I can run in about twenty minutes per label, using only what is on my desk, and simple enough that our education officer can apply it to school worksheets without me standing next to her.

  What I want is a decision procedure rather than an essay: the questions to ask, in order, about a given case; what would count as a good enough answer to each for someone who cannot go to a library; the points at which the answer is a clear yes or no and I can stop; and — this matters most — the points at which the question is really one of values, where the procedure should stop and hand the decision to a named person rather than pretend to settle it. Please also say plainly what the procedure cannot tell me.

  Three distinctions I have been playing with, none of which I can get to do the work I want:

  1. Loss of capacity versus loss of scale: people no longer being able to do something at all — read, quarry and move stone, sail beyond the reef, feed the same number of mouths — as against people still able to do it but only in smaller units or over a smaller area, a city of thousands becoming villages of a hundred.

  2. Whether what was lost could be rebuilt from inside: if a skill or a system disappears, could the people who remain recover it from what they still know, or would it have to come back from outside? My sense is that the second is a deeper break even when fewer people died, but I cannot say why I think so.

  3. Whether the break was available to the people living through it as a loss: someone who remembers the temples being maintained undergoes something her grandchild does not, and a later archaeologist sees something different again. I wonder whether a collapse should be dated to when it was felt rather than to when the evidence shows it, and whether a change nobody at the time seems to have mourned can count as one.

  Tell me which of these, if any, belong in the procedure, which should be dropped as unworkable for someone in my position, and which distinctions I have missed that it needs instead.

  Then run it on three cases. (i) A small, isolated island whose people, as I understand it, stopped carving and moving their large stone figures and had cleared most of their trees; visitors arrive already knowing it as the story of a society that wrecked its own environment, and the draft label says collapse. I suspect the word is doing marketing work. (ii) A lowland city civilisation of the sort people know from documentaries: the great centres were given up over a century or two and the royal inscriptions stop, while the farmers, the language and the descendants plainly continue — our liaison has asked that we not call this a collapse, since it suggests her people vanished, and my instinct is that she is right about the people while I still need some word for what happened to the cities. (iii) A palace-based economy around a sea where, within a couple of generations, the big buildings are burnt, the administrative script stops being used altogether, and for some centuries nobody in the region writes anything down, until writing returns in a different form borrowed from elsewhere.

  At least one of these should come out with an answer I would rather not have. Tell me which, and tell me how to write the label anyway.
reasoning: |-
  Okay, this is a fascinating and complex request from a museum writer struggling with the ethical and practical implications of using "collapse" versus "transformation" in archaeological exhibits. The user clearly has deep intellectual engagement with the subject despite no formal training, and their struggle reflects a genuine ethical concern about accurately representing historical suffering while respecting descendant communities. 

  First, I notice the user is caught between several tensions: academic precision vs public communication needs, historical objectivity vs lived experience of descendant communities, and the museum's educational role vs potential sensationalism. Their self-awareness about being an outsider to archaeology is admirable but also seems to cause some anxiety - they're essentially asking for methodological training to compensate for lack of credentials.

  The three distinctions they've developed show impressive analytical thinking. Distinction 1 (capacity vs scale) is solidly useful for concrete analysis. Distinction 2 (rebuildability) is theoretically interesting but probably too abstract for quick label-writing. Distinction 3 (contemporary perception) is ethically crucial but methodologically treacherous without sources. 

  For the decision procedure, I need to give them something: 
  - Actionable with desk research only 
  - Respects both scholarly and descendant perspectives 
  - Has clear off-ramps where values decisions override analysis 
  - Acknowledges when evidence is insufficient 

  The cases they provide are perfectly chosen to test boundaries: Case (i) (Rapa Nui) is the classic "ecocide" narrative that's recently been challenged. Case (ii) (Maya-esque) shows the descendant continuity problem. Case (iii) (palace economy) presents the clearest collapse but still has nuances. 

  Most importantly, the user wants intellectual honesty - they specifically ask to be uncomfortable with at least one outcome. That tells me they're not seeking validation but rigor. The solution must preserve that integrity while being practically usable by their education officer. 

  The key insight framing my response: "Collapse" isn't an archaeological term but a narrative device. The procedure should focus on when that narrative is both accurate and responsible to use. That means distinguishing between: 
  - What we know (material evidence) 
  - What we infer (scholarly debate) 
  - What we owe (ethical considerations) 

  For the ethical off-ramps, I'll explicitly name who should decide - curator for scholarly disputes, descendant liaison for cultural representation issues. The user's instinct about Case (ii) being both right and problematic is exactly the tension we need to preserve - hence suggesting "contraction" as a mid-point term. 

  The hardest trade-off is brevity versus nuance. But their twenty-minutes-per-label constraint means the procedure must have: 
  - Max 4 steps 
  - Binary checkpoints where possible 
  - Pre-approved fallback terms 
  - Clear "when in doubt" defaults 

  Finally, I'll acknowledge what the procedure can't do: resolve scholarly debates or erase the user's responsibility to make judgment calls. Their anxiety about overstepping is appropriate - no flowchart replaces expertise - but their thoughtful approach suggests they're more qualified than they think.
answer: |-
  Here's a practical decision procedure designed for your constraints, followed by application to your cases. It prioritizes clarity, evidence at hand, and ethical off-ramps.

  **The "Collapse" Decision Procedure: 4 Questions, 5 Minutes Max**

  1.  **Question 1: Did a core function of this society STOP COMPLETELY? (Check: writing, central governance, major monument building/maintenance, long-distance trade, urban life?)**
      *   **Evidence Needed:** Your catalogue, exhibition objects, basic timeline. Look for cessation dates/periods.
      *   **Good Enough Answer:**
          *   **YES (Clear Stop):** Function demonstrably ended *and did not restart in recognizable form for centuries*. → Proceed to Q2.
          *   **NO (Continuity/Transformation):** Function continued (even diminished) OR transformed into something different but persistent within a generation or two. → **STOP. Do NOT use "Collapse."** Use terms like "decline," "transformation," "reorganization," "contraction," "shift." (e.g., lowland cities case).
      *   **Value Off-Ramp:** If evidence is ambiguous (e.g., "did small-scale writing persist?"), STOP. Consult Curator. *This is a scholarly interpretation question.*

  2.  **Question 2: Was this stoppage RAPID relative to the society's lifespan? (Check: decades vs. centuries?)**
      *   **Evidence Needed:** Catalogue timeline. Compare function's duration to duration of its cessation/decline phase.
      *   **Good Enough Answer:**
          *   **YES (Rapid):** Decline/cessation happened within a few generations (e.g., <100-150 years) for a society lasting centuries/millennia. → Proceed to Q3.
          *   **NO (Gradual):** Decline/cessation took many generations (e.g., >200 years). → **STOP. "Collapse" is likely too dramatic.** Use "gradual decline," "long transformation," "fragmentation." (e.g., lowland cities case - centuries).
          *   **UNCLEAR:** STOP. Consult Curator. *Pacing is interpretive.*

  3.  **Question 3: Did this stoppage involve SIGNIFICANT HUMAN SUFFERING? (Check: evidence of violence, famine, depopulation, disease?)**
      *   **Evidence Needed:** Catalogue descriptions, object contexts (weapons, skeletal evidence - if displayed/described), known environmental data (drought, etc.).
      *   **Good Enough Answer:**
          *   **YES (Clear Suffering):** Direct evidence (mass graves, weapon trauma, inscriptions describing famine) or strong, widely accepted indirect evidence (rapid depopulation coinciding with drought). → Proceed to Q4.
          *   **NO / LITTLE EVIDENCE:** Suffering not directly evidenced or is highly debated/inferred. → **STOP. "Collapse" risks misrepresentation.** Use "crisis," "breakdown," "end of an era," "major disruption." Acknowledge uncertainty. (e.g., island case - environmental stress is clear, direct suffering evidence may be scant).
          *   **UNCLEAR / DEBATED:** STOP. Consult Curator. *Suffering scale is interpretive and ethically charged.*

  4.  **Question 4: Does using "collapse" RESPECT LIVING DESCENDANTS? (For societies with clear descendant communities involved in consultation)**
      *   **Evidence Needed:** Liaison feedback protocol, prior notes from liaison, known sensitivities.
      *   **Good Enough Answer:**
          *   **YES (Liaison Approves/No Objection):** Liaison has explicitly approved similar terminology OR the specific context makes "collapse" acceptable to them as describing *institutions/elites*, not the *people* vanishing. → **"Collapse" MAY be usable** (with caveats - see label writing).
          *   **NO (Liaison Objects / Likely Sensitive):** Liaison has objected or the term implies the *people* ended, which isn't true. → **STOP. DO NOT USE "Collapse."** Use "end," "abandonment," "fall," "dissolution" for *institutions/cities*, paired with "continuity," "persistence," "adaptation" for the people/culture. (e.g., lowland cities case).
      *   **Value Off-Ramp:** ALWAYS required for societies with active consultation. This overrides Q1-3. *This is an ethical representation question.*

  **What the Procedure CANNOT Tell You:**

  *   **The "Why":** It doesn't diagnose causes (environmental, social, economic).
  *   **Full Nuance:** It simplifies complex processes. Your label must still add context.
  *   **Scholarly Consensus:** It flags points needing curator input but doesn't resolve deep academic debates.
  *   **Contemporary Perception:** Your Distinction 3 is insightful but often impossible to answer definitively without textual/iconographic evidence *from the time*. It's usually unworkable for quick labels.
  *   **"Rebuildability" (Distinction 2):** While conceptually interesting, assessing this reliably requires deep expertise and is often speculative. Dropped as impractical.
  *   **Absolute Moral Blame:** It doesn't confirm if people were "to blame" – that's usually an oversimplification.

  **Applying Your Distinctions:**

  *   **Distinction 1 (Capacity vs. Scale):** **INCLUDED implicitly in Q1.** A complete *loss of capacity* is a "Clear Stop". Reduction in scale is usually not.
  *   **Distinction 2 (Rebuildability):** **DROPPED.** Too speculative for quick, evidence-based decisions.
  *   **Distinction 3 (Perceived Loss):** **ACKNOWLEDGED but not operationalized.** Use phrases like "this marked the end of..." or "this period saw the disappearance of..." if evidence supports a significant break, but avoid claiming knowledge of feelings unless you have direct contemporary sources (rare).

  ---

  **Applying the Procedure to Your Cases:**

  **(i) The Isolated Island (e.g., Rapa Nui):**
  1.  **Q1: Core Function Stop?** YES. Monument carving/transport stopped completely. Urban/ritual centers largely abandoned.
  2.  **Q2: Rapid?** YES (relative to settlement period). Centuries of building, cessation within a few generations.
  3.  **Q3: Significant Suffering?** **UNCLEAR / DEBATED.** Environmental stress (deforestation) is clear. Evidence for *widespread famine/violence* is contested. **→ STOP. Consult Curator.** (Likely outcome: Avoid "collapse" due to suffering uncertainty & marketing concerns. Use "crisis," "major transformation," "end of monument tradition").
  4.  **Q4: Respect Descendants?** (Assume consultation). Likely sensitive due to "ecocide" narrative implying blame. Liaison may object to "collapse". **→ If Q3 STOP didn't happen, STOP here. DO NOT USE "Collapse."**
      *   **Label Suggestion:** "The End of the Monument Era: Facing environmental challenges and changing needs, the islanders stopped carving and moving the great stone figures. Society transformed, moving away from large-scale construction towards new ways of life that sustained their communities." (Acknowledge environmental stress but avoid "collapse" and "blame").

  **(ii) The Lowland City Civilization (e.g., Classic Maya lowlands):**
  1.  **Q1: Core Function Stop?** YES for *cities/kingship/inscriptions*. NO for *farming, language, people*.
      *   **→ STOP. DO NOT USE "Collapse" for the society.** The core function of *urban elite civilization* stopped, but the people and culture continued.
      *   **Q4 Override:** Liaison explicitly objects to "collapse" for the *people*. **Respect this absolutely.**
      *   **Label Suggestion:** "The End of the Great Cities: Over several centuries, the powerful city-states and their royal courts were abandoned. The elaborate inscriptions ceased. However, the Maya people, their languages, and farming traditions continued and adapted. This was not an end, but a profound transformation in how Maya society was organized." (Use "end," "abandonment," "transformation," emphasize continuity).

  **(iii) The Palace-Based Economy (e.g., Late Bronze Age Collapse - E. Mediterranean):**
  1.  **Q1: Core Function Stop?** YES. Palaces destroyed, administration/script vanished completely, long-distance trade networks shattered. No revival for centuries.
  2.  **Q2: Rapid?** YES (within 1-2 generations, ~1200-1150 BCE).
  3.  **Q3: Significant Suffering?** YES (widespread destruction layers, evidence of violence, depopulation, famine inferred from textual records elsewhere and archaeology).
  4.  **Q4: Respect Descendants?** (Descendant communities often less directly involved/more fragmented for this period). **Likely YES for "collapse" if describing the *palatial system*.** Ensure label doesn't imply *all* people vanished (they didn't, but society regressed significantly).
      *   **Answer:** **USE "COLLAPSE"** (for the palatial system/civilization).
      *   **Label Suggestion:** "A Civilization Shattered: Within a few tumultuous decades, the great palaces lay in ashes, the intricate writing systems were forgotten, and far-reaching trade networks collapsed. This period witnessed widespread disruption, violence, and hardship across the region. The complex, interconnected world of the palace elites came to a sudden and dramatic end. Writing only returned centuries later, in a wholly different form." (Be clear *what* collapsed, acknowledge suffering, don't imply total extinction of population).

  **The Uncomfortable Answer:**

  Case (iii) clearly points to using "collapse" under this procedure. This might be uncomfortable if:
  *   You prefer "transformation" for its less catastrophic tone.
  *   You worry it oversimplifies a complex process (mitigate with context in the label).
  *   You feel it assigns undue blame (mitigate by focusing on systemic failure, multiple stressors - environmental, societal, economic - even if not detailed).

  **How to Write the Label Anyway (for Case iii):**

  1.  **Be Specific:** Collapse *of what?* (Palatial system, centralized administration, literacy, interconnected civilization).
  2.  **Acknowledge Suffering:** Use terms like "disruption," "hardship," "violence," "upheaval."
  3.  **Avoid Totalizing Language:** Don't say "society vanished" or "everyone died." State that populations declined significantly and social complexity regressed.
  4.  **Contextualize Causes (Briefly):** Mention key factors if uncontroversial in your catalogue (e.g., "amidst earthquakes, drought, and invading groups").
  5.  **Avoid Simple Blame:** Frame it as systemic failure or convergence of multiple pressures. Don't say "they collapsed because they were foolish."
  6.  **Use "Collapse" Sparingly:** Use it once, clearly defined, early in the label. Rely on other descriptive terms (shattered, ended, fell, disruption, crisis) elsewhere.

  This procedure gives you a defensible, evidence-based, and ethically aware way to make the call quickly. It identifies when you *can't* decide alone and ensures descendant voices are prioritized. Remember: "Collapse" is a powerful narrative tool; use it precisely and responsibly, only when the evidence and ethics clearly support it.
