prompt: |-
  I spent most of my career in marine geophysics — magnetic anomaly surveys, largely off the Reykjanes Ridge — and since retiring I have been auditing the philosophy of science reading group at the university I used to work for. They have asked me to take one of their work-in-progress slots next month, and I would like to use it to defend a position on the problem of old evidence that I have been working out on my own, in my own vocabulary, without much knowledge of how the professionals argue about it. What I want from you is not a defence of the position but a Q&A preparation sheet: I know the room, I know roughly who will be in it, and I would rather walk in having already been beaten up on paper.

  The position, briefly. Old evidence — evidence you already had in hand when you first took a theory seriously — plainly does lend theories support: the advance of Mercury's perihelion is the shopworn example, and the one from my own field I would rather talk about is the symmetrical striping of magnetic anomalies either side of the mid-ocean ridge crests, which was mapped before anyone had the seafloor-spreading-plus-reversals explanation for it (I am hazier than I would like about the exact chronology of the surveys, and I would like to know now whether that is going to sink me). And yet the Bayesian machinery gives you nothing: if the evidence is already in your background knowledge, your probability for it is one, and conditioning on it cannot move your credence in the theory. My diagnosis is that two questions have been run together. There is a static question — how much support a piece of evidence gives a theory relative to a body of background belief — and there is a dynamic question — what ought to happen to your credence when you learn something. I want to answer the static one by evaluating the support against the belief state you were in *before* the evidence arrived rather than the one you are in now, which I have been calling the retrospective prior manoeuvre. And I want to answer the dynamic one by pointing out that in an old-evidence episode what is genuinely new to you is not the datum but the news that the theory would have led you to expect it: that it entails it, and entails it without having been bent to fit it. So the update goes on the derivation rather than on the datum, and the size of the boost should track how surprising you find it that the theory says that about the evidence — roughly, how improbable you would have said it was, before you had the theory in view, that it would turn out to entail the datum. I am aware, dimly, that these two answers may not always agree with one another, and I would like that worry sharpened rather than smoothed over.

  The room will be about a dozen people. There will be a senior philosopher of science who works on measures of confirmation and thinks in terms of the difference between the probability of the evidence given the theory and its probability given the background alone; he will want to know what fixes the earlier belief state I am appealing to, since it is counterfactual, partly lost, and selectable at will, and he will suspect I have simply relocated the arbitrariness of the prior into the choice of time slice. There will be a formal epistemologist who thinks exclusively in terms of credences and updating and who will probably say that a support relation that never touches credence is not confirmation at all, and who will press me hard on what my probability for the proposition that the theory entails the evidence is supposed to be and on what I take the relevant space of alternatives to be. There is one error-statistician in the group who thinks the whole Bayesian frame is the wrong tool and evidence is a matter of how severe a test a theory has survived; she will want to know whether my account can tell genuine support from post hoc accommodation, or whether the words *without having been bent to fit it* are doing all the real work. There is a historian of science who works on mid-century earth science and who will object that my *before* state is a historian's fiction, that in the cases I care about the evidence was assembled in the same breath as the theory, and that nobody in the field had any determinate prior about the striping at all. And there will be four or five graduate students, one of whom reliably asks the simple question that the rest of us have been circling.

  So: give me the seven or eight objections I should actually expect, ordered by how likely they are and how much damage they would do, each phrased the way that person would phrase it rather than the way I have phrased it — I have the mathematics for Bayes' theorem but not the jargon — each with a two-minute reply I could give standing up, a note on where that reply is soft, and a note on what I should simply concede at the outset and what I should refuse to give up. Tell me separately whether I should drop the ridge-anomaly example for something safer and what it would cost me if I do. And include, at the end, the one question I am privately hoping nobody asks.
reasoning: |-
  Okay, the user is a retired marine geophysicist who's presenting at a philosophy of science reading group. They want to defend their position on the problem of old evidence using their own terminology. The problem is that Bayesian updating doesn't handle old evidence well since its probability is already 1. Their solution involves separating the static support question from the dynamic update question. They're looking for potential objections to prepare for, not a defense of their position.

  First, I need to understand their core argument. They propose two maneuvers: the "retrospective prior" for static support and updating on the derivation for dynamic credence changes. The issues they anticipate include counterfactual belief states, the role of credences, and historical accuracy in their field example.

  The audience includes a confirmation measure expert, a formal epistemologist, an error-statistician, a historian of science, and grad students. Each will have specific concerns. For instance, the confirmation expert will challenge the arbitrariness of selecting a prior time slice. The formal epistemologist will question how probabilities are assigned to entailments. The error-statistician will probe the distinction between genuine support and accommodation. The historian might dispute the existence of a clear prior state in the magnetic anomaly case.

  The user also worries about the ridge example's safety. They need to assess if the historical chronology is solid enough. If not, switching to Mercury's perihelion might be safer but at the cost of personal connection and illustrative power. They should be prepared to concede minor points but hold firm on the separation of questions.

  The nightmare question might involve cases where the retrospective prior and entailment probability diverge significantly. They should acknowledge this but emphasize that both approaches capture different aspects of confirmation. Preparation involves structuring objections by likelihood and damage, crafting concise responses, noting soft spots, and deciding on concessions. The key is to stay grounded in their dual-question framework while addressing each critic's angle.
answer: |-
  Here are the 7 objections you should expect, ranked by likelihood and potential damage, phrased as your audience would ask them, with concise replies, weaknesses, and strategic concessions. Avoid jargon where possible.

  ### Objections (Ordered by Likelihood & Damage)
  1.  **The Confirmation Theorist (Most Likely, High Damage):**  
      *"Your 'retrospective prior' is dangerously arbitrary. You're asking us to assess support relative to a hypothetical belief state *before* evidence E was known. But that state is counterfactual, unobservable, and you can cherry-pick different 'before' moments to get any confirmation value you want. This just relocates the subjectivity of the prior into the choice of time-slice, making 'support' meaningless."*  
      **Your 2-Minute Reply:** "The 'before' state isn't chosen whimsically; it's fixed by the actual historical moment *just before* E became background knowledge for the relevant scientific community. We use historical records, publications, and expert testimony to reconstruct it – just as historians reconstruct past scientific contexts. The arbitrariness is constrained by the actual epistemic history."  
      **Where It's Soft:** Defining "just before" precisely is tricky, and reconstruction is imperfect.  
      **Concede/Stand Firm:** *Concede* reconstruction is interpretive, not perfect. *Stand firm* that the *concept* of support relative to a pre-E state is essential and objectively grounded in history.

  2.  **The Formal Epistemologist (Very Likely, High Damage):**  
      *"If 'static support' never actually changes anyone's *credence*, how can it be *confirmation*? Confirmation just *is* the rational change in credence upon learning! Your 'derivation update' sounds like you're conditioning on `T entails E`. But what's your prior probability for *that*? And over what space of alternative theories? How do you quantify 'how surprising it is that T entails E' without begging the question?"*  
      **Your 2-Minute Reply:** "Confirmation has two faces: justifying belief *after the fact* (static support) and *changing* belief (dynamic update). For the dynamic update on `T entails E`, my prior probability reflects my assessment *before considering T seriously* of how likely it was that *any plausible theory* would entail E. The surprise comes from E seeming initially puzzling or anomalous, and `T entails E` resolving that puzzle unexpectedly. Quantification is hard, but the *direction* of change (boost) is clear."  
      **Where It's Soft:** Quantifying P(`T entails E` | Background) rigorously is notoriously difficult ("the problem of logical omniscience"). Defining the space of "plausible alternatives" is vague.  
      **Concede/Stand Firm:** *Concede* full quantification is challenging. *Stand firm* that the *qualitative* boost from learning `T entails E` is real, distinct from conditioning on E itself, and central to scientific discovery.

  3.  **The Historian of Science (Likely, Medium-High Damage - to your example):**  
      *"Your clean 'before' state for the magnetic striping is a myth. Vine, Matthews, Morley – they were developing the seafloor spreading *and* reversal *model* (not just the theory) *in dialogue with* the emerging anomaly maps (e.g., Mason & Raff, Heirtzler). No one had a stable, well-defined 'prior' over possible striping patterns *before* having some nascent spreading/reversal idea in mind. Your 'retrospective prior' doesn't exist for this case."*  
      **Your 2-Minute Reply:** "You're right the history is messy! The key 'old evidence' moment isn't the *final* Vine-Matthews-Morley paper, but when the *symmetry itself* became established data (e.g., early maps showing parallelism to the ridge) *before* a viable physical mechanism linking spreading *and* reversals was proposed. Prior beliefs existed about crustal formation and magnetism, even if not about the *specific* striping pattern. The support comes from symmetry being a *surprising* feature demanding *some* explanation, which VMM then provided."  
      **Where It's Soft:** Pinpointing the exact moment when symmetry became "established but unexplained" is debatable. Beliefs were fluid.  
      **Concede/Stand Firm:** *Concede* the history is complex and intertwined. *Stand firm* that the *symmetry pattern* was recognized *data* before the VMM explanation was accepted, and that its explanation *by* VMM was retroactively powerful support.

  4.  **The Error-Statistician (Likely, Medium Damage):**  
      *"How does your 'retrospective prior' or 'derivation update' distinguish genuine severe testing from mere post-hoc accommodation? You mention 'without having been bent to fit it', but that seems like hand-waving. A theory built *to* fit E gets the same 'boost' on your account when you 'learn' it entails E. Severity requires novelty – predicting *new* risks the theory could fail."*  
      **Your 2-Minute Reply:** "The key is the *counterfactual fragility* captured in the retrospective prior. For genuine support, E should be improbable *without* T (in that prior). If T was built *just* to fit E, then P(E | ~T) in the prior might *not* be low – E might have been accommodated by many things, or just accepted. The 'surprise' in learning `T entails E` is low if T was engineered for E. Severity is built into the *improbability* of E relative to the pre-T alternatives considered plausible."  
      **Where It's Soft:** Defining "plausible alternatives" (~T) rigorously. A clever accommodator could make E seem surprising.  
      **Concede/Stand Firm:** *Concede* novelty (testing on *new* data) is the gold standard. *Stand firm* that the retrospective assessment *can* show E was *unexpected* and *demanding explanation*, making T's fit non-trivial, even if not novel prediction.

  5.  **Confirmation Theorist (Follow-Up - Likely, Medium Damage):**  
      *"Even granting a reconstructible 'before' state, why think the *ratio* P(E|T) / P(E|~T) evaluated *then* tells us anything about *current* justification? That ratio might have changed dramatically as background knowledge (K) evolved *after* E was learned but *before* T was proposed. Your 'support' is frozen in a potentially irrelevant past."*  
      **Your 2-Minute Reply:** "The support *is* historical and relational. It tells us why T gained acceptance *when it did*. The power of explaining E lies in resolving the specific puzzle E posed *at the time it was puzzling*. Later changes in K might make E seem less surprising *now*, but that doesn't erase the historical evidential weight E provided *for T* relative to the alternatives available *then*."  
      **Where It's Soft:** It downplays that justification should be based on *current* total evidence.  
      **Concede/Stand Firm:** *Concede* current justification depends on current K. *Stand Firm* that understanding *why* a theory was initially supported requires looking at the state *before* E was explained.

  6.  **Formal Epistemologist (Follow-Up - Likely, Medium Damage):**  
      *"Your 'derivation update' seems vulnerable to tacking paradoxes. Take any T that entails E. Now tack on an irrelevant conjunct (T & F). Learning `(T & F) entails E` seems just as 'surprising' as learning `T entails E`, giving the same boost. But (T & F) is a worse theory!"*  
      **Your 2-Minute Reply:** "The boost tracks not just entailment, but entailment *in virtue of the core content* of T. Learning `(T & F) entails E` only provides a boost if F is irrelevant *and* we recognize that the entailment relies solely on T. The surprise is specifically that *T's core postulates* lead to E. If F is essential to the derivation, then F better be plausible! The assessment is of the *explanatory connection* revealed, not just the logical fact."  
      **Where It's Soft:** Requires judging the "core content" and which parts do the explanatory work – not purely formal.  
      **Concede/Stand Firm:** *Concede* pure logic alone isn't enough. *Stand firm* that in practice, scientists recognize when an entailment flows from a theory's substantive content.

  7.  **The Simple Grad Student Question (Likely, Low-Medium Damage - Clarity Test):**  
      *"I'm confused. If I already know E for sure, why does finding out T predicts it make me *more* confident in T? Isn't that like being surprised the sun rose this morning just because my new theory predicts sunrise?"*  
      **Your 2-Minute Reply:** "Great question! The key is *why* you were sure of E *before* you had T. Before T, you knew E (sun rises), but maybe you thought it happened by magic, or God's will, or just 'because'. It was a brute fact. Learning that T *entails* E shows you that E *isn't* brute – it's a necessary consequence of T's deep principles. It *explains* why E is true. That's why it boosts confidence in T: T makes sense of something you already knew but didn't understand. The surprise isn't *that* E happened, but *that T explains it so directly*."  
      **Where It's Soft:** Doesn't fully address the Bayesian technicality (P(E)=1), but captures the intuition perfectly for the audience.  
      **Concede/Stand Firm:** *Concede* it feels counter-intuitive on strict Bayesian grounds. *Stand firm* that the intuition about explanation is powerful and correct.

  **On the Reykjanes Ridge Example:**
  *   **Should you drop it?** **No, but handle it carefully.**
  *   **Why Keep It?** It's your expertise, vivid, less shopworn than Mercury. It perfectly illustrates evidence being *known* (mapped symmetry) but not *understood* before the theory.
  *   **The Cost of Dropping It:** You lose authenticity, passion, and a fresh example. Mercury is safe but generic for this group.
  *   **How to Secure It:** Preempt the historian! In your intro, briefly acknowledge: "Now, historians rightly note the development was complex; symmetry maps and spreading/reversal ideas evolved together. But crucially, the *phenomenon* of symmetrical striping parallel to ridges was recognized *as a distinct, established pattern needing explanation* before Vine, Matthews, and Morley provided *the specific mechanism* linking it directly to seafloor spreading and magnetic reversals. It's *that* moment of recognizing the pattern as unexplained data that I use as my 'before' state." Cite Mason & Raff (1961) or Heirtzler et al. (early 60s) as establishing the pattern pre-VMM (1963). A quick footnote in your handout helps.

  **The Nightmare Question You Hope Nobody Asks:**
  *   **"What happens when your two answers *disagree* dramatically? Suppose the retrospective prior shows very high support (P(E|T) >> P(E|~T)), but learning `T entails E` gives only a tiny credence boost because P(`T entails E` | Background) was already quite high (maybe T seemed like the only game in town). Or vice-versa: low retrospective support, but a huge boost from learning the entailment (because it was incredibly surprising T said *that*). Which one is 'right'? Doesn't this show your two maneuvers are fundamentally at odds?"**

  **Why it's Nightmare:** It directly attacks the potential tension you acknowledged. It forces you to choose between your two solutions or admit inconsistency under their pressure.

  **Strategy if Asked (Briefly):** "Excellent, deep question. They capture *different* aspects of evidential impact. The retrospective support measures the *explanatory power* T had *for the specific puzzle E posed historically*. The dynamic boost measures the *reduction in puzzlement* or *increase in understanding* achieved by seeing *how* T explains E. They won't always align numerically. A theory might be the only option (low entailment surprise) but provide a great explanation (high retrospective support) of known data. Conversely, a wildly implausible theory might give a huge jolt if it unexpectedly explains something (high entailment surprise), even if other evidence weighs against it (low overall retrospective support). Both are real phenomena in scientific reasoning." *Concede* they can diverge. *Stand firm* that both capture important intuitions missed by standard Bayesianism.
