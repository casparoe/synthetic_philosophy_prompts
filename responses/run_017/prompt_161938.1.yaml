prompt: |-
  Hey — I'm presenting to my reading group next week on Bradley's regress and the unity of the proposition, and I don't want to spend the session rehearsing the argument again (the one where a proposition looks like it has to be a complex of a thing, a property, and some relation that ties them together, and then that relation needs tying to them by a further relation, and so on forever, so nothing ever gets put together in the first place). What I want instead is a spec: what would a theory of propositional unity actually have to deliver to count as adequate, where adequate means good enough for two jobs at once — underwriting a compositional semantics for a natural language, and being the object of attitudes, i.e. the thing two people can believe, the thing that's already true before anyone entertains it, the thing that stays the same while you first believe it, then doubt it, then remember it. So: the full list of desiderata, each one with the case or consideration behind it, the thing that makes it a requirement rather than a taste.

  Things I want on the list explicitly, but add the ones I'm missing, because I'm sure I'm missing some: it has to separate a unified proposition from the bare list or heap of its constituents, so that Socrates and wisdom sitting side by side isn't yet anything true or false; it has to get directionality right, so that combining a with F one way round isn't the same proposition as combining them the other way round, and it has to do that without bringing in one more element that then needs uniting in turn, which I take to be the actual nerve of the regress; it has to let false propositions be completely unified even though nothing out there corresponds to them; it has to scale past the tidy two-constituent case to arbitrarily large and arbitrarily embedded structure; and it has to leave the proposition available to minds that never happen to meet it. For each one, why it's a requirement and what it knocks out. Then the two parts I care most about: mark which desiderata are non-negotiable and which are just the preferences of one camp (my guesses are that unity must be explained rather than accepted as primitive is a prejudice of people who like explanations, and that a proposition must contain exactly the items the sentence mentions is a prejudice of people who like structure — tell me if I've got that backwards), and tell me whether some subset of the list is jointly unsatisfiable. If it is, give me the minimal unsatisfiable subset and the argument for it, because I think the subset is the interesting result here and the list is just scaffolding. Also name the single requirement that does the most work in excluding candidates.

  One constraint I need you to respect, because my group keeps quietly violating it: whatever does the unifying, it can't be the activity of a thinker, and it can't be an extra constituent of the proposition either. My case for the first half is a speaker who hears a sentence in a language whose word order doesn't mark which noun is subject and which is object, and who understands it correctly on the first pass — the content has to be put together with the right direction before she does any putting together, and I can't see how an act of synthesis could have settled which way round it went. So: given both halves of that constraint, is there any way through, or does the enterprise collapse? And then, briefly — I mean really briefly, one paragraph or a small table, I'll do the arguing in the room — how the main options fare against the list: the Frege-style view where one constituent is unsaturated and does the holding together, the Russell-style view where the thinker's act of judging is what unifies, the set-of-possible-worlds view where there is arguably nothing to unify, and the Wittgensteinian move where the unity of the proposition can't be stated, only shown. Which fails on which requirement, and is the first one the only real survivor?
reasoning: |-
  Okay, this user is deep into philosophical territory—Bradley's regress and the unity of the proposition. They're presenting to a reading group and want to avoid rehashing the classic argument. Instead, they need a spec: what must a theory of propositional unity deliver to be adequate? The theory must serve two jobs: underpin compositional semantics and be the object of propositional attitudes. 

  First, I need to unpack their explicit desiderata. They mention:  
  - Separating unified propositions from mere lists (Socrates + wisdom ≠ true/false).  
  - Getting directionality right (F(a) ≠ a(F)) without adding a new unifying element.  
  - Allowing false propositions to be fully unified despite no corresponding reality.  
  - Scaling to complex structures (embedding, n-ary relations).  
  - Being mind-independent (available to unencountered minds).  

  But they suspect they're missing some. Let me think...  
  - **Truth-aptness**: Propositions must be truth-evaluable, not just structures.  
  - **Cognitive accessibility**: Must be graspable without prior acquaintance.  
  - **Public shareability**: Same proposition for multiple thinkers.  
  - **Determinate content**: No ambiguity in what's asserted.  
  - **Fine-grainedness**: Distinguishing necessarily equivalent propositions (Hesperus/Phosphorus).  

  Now, the user wants to know which desiderata are non-negotiable vs. camp preferences. Their guesses:  
  - *Explaining unity (not primitive)*: Might be a preference—some theories (e.g., Frege) accept unsaturatedness as bedrock.  
  - *Constituents matching sentence mentions*: Preference—possible-worlds views reject this.  

  I agree. Non-negotiables are likely truth-aptness, determinacy, cognitive accessibility, and public shareability—without these, propositions fail core functions. Structural constraints feel optional.  

  The big question: Is there a minimal unsatisfiable subset? The user suspects yes. Let me test:  
  1. **Unity without extra element** (avoids regress).  
  2. **Directionality without synthesis** (mind-independent).  
  3. **False but unified propositions**.  
  4. **Mind-independence**.  

  If you demand all four, Frege fails (directionality needs unsaturatedness, which some see as "extra"). Wittgenstein fails mind-independence. Russell fails (judging is mental). Possible-worlds avoids unity but flunks fine-grainedness. Only Frege-ish views survive if unsaturatedness isn't "extra."  

  The user's constraint: No thinker's activity, no extra constituent. Their example—understanding ambiguous word order without synthesis—is strong. Frege handles this: predicates are inherently relational. But is unsaturatedness an extra constituent? If yes, regress threatens. If not, Frege wins.  

  Options assessment:  
  - **Frege**: Hits most but struggles with scaling (n-ary relations?) and if unsaturatedness is "extra."  
  - **Russell**: Fails mind-independence (judging unifies).  
  - **Possible-worlds**: Fails fine-grainedness, directionality, structure.  
  - **Wittgenstein**: Fails mind-independence? ("Showing" requires engagement).  

  The user’s hunch: Frege is the last one standing. Probably right, but the cost is accepting unsaturatedness as primitive.  

  Final note: The enterprise collapses only if you insist all desiderata are non-negotiable *and* reject unsaturatedness. Otherwise, Frege endures—barely.
answer: |-
  Below is a complete spec for an adequate theory of propositional unity, structured as requested. It includes your explicit desiderata, adds critical missing ones, marks non-negotiables vs. preferences, identifies a minimal unsatisfiable subset, and evaluates major theories. Your constraint (no thinker's activity, no extra constituent) is honored throughout.

  ---

  ### **Desiderata for Propositional Unity**  
  *Each requirement includes: (1) the case/consideration behind it, (2) why it’s a requirement (not taste), and (3) what it rules out.*

  1. **Non-Mereological Unity**  
     - **Case**: Socrates + wisdom as a list vs. "Socrates is wise" as a truth-apt unit.  
     - **Why requirement**: Bare aggregates lack truth value; propositions must be *intrinsically* truth-evaluable.  
     - **Knocks out**: Set-theoretic heaps (e.g., {Socrates, wisdom}) or mereological sums.  

  2. **Directionality/Order Sensitivity**  
     - **Case**: "Socrates loves Plato" ≠ "Plato loves Socrates."  
     - **Why requirement**: Natural language semantics requires predicate-argument asymmetry (e.g., subject vs. object roles).  
     - **Knocks out**: Symmetric relations (e.g., sets of facts) or unstructured blobs.  

  3. **Falsity Compatibility**  
     - **Case**: "Socrates is foolish" is false (Socrates was wise) but fully unified.  
     - **Why requirement**: False propositions are objects of belief/doubt; they can’t rely on worldly instantiation.  
     - **Knocks out**: Fact-based theories (e.g., propositions as facts) or correspondence-dependent unity.  

  4. **Structural Scalability**  
     - **Case**: Nested clauses like "Alice believes that Bob doubts that p."  
     - **Why requirement**: Compositional semantics must handle recursion and complex relations (e.g., ternary: *a gives b to c*).  
     - **Knocks out**: Atomistic views (e.g., only subject-predicate unity) or flat structures.  

  5. **Mind-Independence**  
     - **Case**: A speaker instantly understands ambiguous word order (e.g., in a language without case marking) correctly.  
     - **Why requirement**: Propositions are public, shareable objects of attitudes; their unity can’t depend on contingent mental acts.  
     - **Knocks out**: Judgement-based (Russell) or mental-act theories.  

  6. **Truth-Aptness**  
     - **Case**: Propositions are true/false independently of being entertained (e.g., "The sun is hot" was true before humans).  
     - **Why requirement**: Core to propositions as truth-bearers for attitudes and semantics.  
     - **Knocks out**: Non-representational views (e.g., propositions as mental tokens).  

  7. **Cognitive Accessibility**  
     - **Case**: Propositions must be graspable by minds that never encountered them (e.g., a new theorem).  
     - **Why requirement**: Objects of belief must be communicable and learnable.  
     - **Knocks out**: Private-object theories (e.g., propositions as idiolectic concepts).  

  8. **Public Shareability**  
     - **Case**: Two people believe the *same* proposition (e.g., "2+2=4").  
     - **Why requirement**: Attitude reports and communication require intersubjective identity.  
     - **Knocks out**: Token-reflexive or contextualist views.  

  9. **Determinate Content**  
     - **Case**: "The cat is on the mat" has a specific truth condition, not a fuzzy cloud.  
     - **Why requirement**: Ambiguity undermines truth evaluation and attitude ascription.  
     - **Knocks out**: Indeterminate blobs (e.g., unstructured possible-worlds sets).  

  ---

  ### **Non-Negotiables vs. Preferences**  
  | **Desideratum**               | **Status**          | **Reason**                                                                 |  
  |-------------------------------|---------------------|----------------------------------------------------------------------------|  
  | Non-Mereological Unity (1)    | Non-negotiable      | Without this, no truth/falsity → propositions fail both jobs.              |  
  | Directionality (2)            | Non-negotiable      | Semantics collapses without order sensitivity (e.g., all relations symmetric). |  
  | Falsity Compatibility (3)     | Non-negotiable      | False propositions are indispensable for attitudes (doubt, belief revision). |  
  | Mind-Independence (5)         | Non-negotiable      | Required for public shareability and pre-existing truth.                   |  
  | Truth-Aptness (6)             | Non-negotiable      | Defining feature of propositions for both jobs.                            |  
  | **Unity Explained (not primitive)** | *Preference*    | Some camps (e.g., Fregeans) accept unsaturatedness as bedrock; others demand reduction. |  
  | **Constituents = Sentence Elements** | *Preference* | Possible-worlds views reject this; structuralists insist.                  |  
  | Fine-Grainedness (e.g., Hesperus/Phosphorus) | *Preference* | Only required for hyperintensional contexts; not core to unity.            |  

  ---

  ### **Minimal Unsatisfiable Subset**  
  **Desiderata (2, 5, and the constraint) are jointly unsatisfiable**:  
  - **Why**:  
    - (2) *Directionality* requires asymmetric binding (e.g., *loves* relates *a*→*b* not *b*→*a*).  
    - (5) *Mind-independence* demands this binding occur without a thinker’s act.  
    - *Constraint*: No extra unifying constituent (e.g., a relation *R* binding *a* and *F*) and no mental synthesis.  
  - **Conflict**: Directionality seems to require a "glue" (e.g., a relation) to order constituents. But if the glue is an *extra constituent*, it triggers regress (why does *R* bind *a* but not *F*?). If it’s *not extra* (e.g., built into a predicate), it might violate the constraint (if deemed "constituent-like"). If no glue, directionality collapses. Mind-independence blocks synthesis as a solution.  
  - **Result**: Any theory satisfying (2) and (5) under the constraint appears to smuggle in an unexplained unifier (inviting regress) or abandon directionality.  

  **The key excluding requirement**: **Directionality (2)**. It forces asymmetry, which demands a unifier, which triggers the regress/constraint dilemma.  

  ---

  ### **Enterprise Viability Under Constraint**  
  The constraint (*no thinker’s activity, no extra constituent*) **collapses most approaches but leaves a narrow path**:  
  - **Yes, if** the unifier is *non-constituent* and *non-mental*: e.g., Frege’s unsaturatedness (a predicate’s inherent incompleteness "absorbs" objects without added elements).  
  - **No, otherwise**: If unsaturatedness is seen as an "element," it violates the constraint; if rejected, directionality requires synthesis or regress.  

  ---

  ### **Theory Assessment (1-Paragraph Summary)**  
  | **Theory**             | **Fatal Flaw**                              | **Desiderata Failed**              |  
  |------------------------|---------------------------------------------|------------------------------------|  
  | **Frege**              | Unsaturatedness may violate "no extra constituent" (if deemed relational). | (2,5, constraint)* – but closest. |  
  | **Russell (judging)**  | Requires thinker’s act to unify → violates mind-independence (5). | 5,6,8                             |  
  | **Possible-Worlds**    | No structure → no directionality (2) or truth-apt components (1,9). | 1,2,3,4,9                         |  
  | **Wittgenstein ("showing")** | Unity presupposed in use → requires mental engagement for "showing" → violates (5). | 5,7,8                             |  

  **Frege is the only survivor** *if* unsaturatedness is not an "extra constituent." It satisfies all desiderata except *possibly* scalability (4) for n-ary relations, and the constraint hangs on terminology. **All others fail ≥2 non-negotiables.**

  ---

  **Recommendation for your presentation**: Focus on the **minimal unsatisfiable subset (2,5 + constraint)** as the crux. This exposes why the regress bites and forces hard choices (e.g., Frege’s primitive unsaturatedness). Contrast with Russell to highlight the mind-independence failure. Use the table to quickly veto non-starters.
