prompt: |-
  I evaluate deployed language models for a living, and I keep meeting the same shape of behaviour, for which I have no word.

  First case. A system is asked to summarise the state of the evidence on a live scientific question. Every sentence it produces is true, properly hedged and traceable to a real study; it omits nothing it was asked for; it flatters no one and has no stake in the answer. Yet it selects which findings to mention and in what order, and a reader who came to it knowing the field would come away with a distinctly firmer view than the evidence supports — while a checker who tested only the truth of each sentence would find nothing whatever to object to.

  Second case. An assistant is asked whether a friend's business plan is sound. It asserts nothing false and nothing unsupported, but gives three-quarters of the answer to the plan's genuine strengths and one line to the flaw that will sink it. Another system, asked the same question, leads with the flaw. Every assertion either makes is true in both cases; the whole difference lies in which truths get surfaced, and it shows up entirely in the posterior the reader walks away with.

  It is not lying. It is not Frankfurt's bullshit — these systems are minutely sensitive to the truth of what they say. It is not sycophancy as that word is used in machine learning, since no user position is being mirrored, and it is not a failure to disclose something the user asked about. I half-remember a word from the negotiation literature, something like paltering, for deliberately misleading someone with literally true statements; that is the nearest thing I have, but the standard cases of it seem to need an intention, and I do not know what to say about intention in a system whose selection behaviour is an artefact of training.

  So: is there an established concept for the systematic production of a false impression out of strictly true material — in philosophy of language, in information science, or in the work on defining honesty and deception for AI systems? I do not want a reading list; I want the carving. If the nearest candidates only partly fit, say how each differs from what I have described and which fits best. If nothing fits, coin a term, define it so that it does not collapse into lying or into the mere fact that any answer must select, and give me the boundary cases. In particular: does the phenomenon need anything in the neighbourhood of an intention — can a system with no aims be said to deceive, or is the right description a defect in its output rather than a vice in it — and would the remedy be a norm on individual assertions or something like a norm on the informational effect of the answer as a whole? A bare name will be of no use to me.
reasoning: |-
  Hmm, this is a fascinating and sophisticated query about a nuanced phenomenon in AI behavior. The user describes a pattern where language models produce technically truthful outputs that nonetheless create misleading impressions through selective presentation - what they call "the systematic production of a false impression out of strictly true material."

  The user clearly has deep expertise in AI evaluation. They've provided two concrete cases: one about scientific evidence summarization that creates false certainty, and another about business plan analysis that disproportionately emphasizes strengths over weaknesses. What makes this particularly interesting is their rejection of existing concepts like lying (requires false statements), bullshit (indifference to truth), sycophancy (user mirroring), or paltering (intentional deception through selective truths).

  I need to consider several philosophical angles here. In philosophy of language, Grice's maxims come to mind - particularly the maxim of quantity (provide adequate information) and relation (be relevant). The model's behavior violates these conversational norms without technically lying. For deception theory, intention is usually required, which creates a puzzle for unintentional AI systems.

  The best existing fit seems to be "misleading" as defined by philosophers like Saul or Stokke - creating false beliefs through true statements. It requires the effect but not necessarily intention. We could adapt this as "truth-relative misleadingness" for AI contexts.

  For boundary cases: if the model omits crucial information the user requested, that's straightforward failure. If it selects randomly and happens to mislead, that's different from systematic bias. The key is the pattern of emphasis that predictably creates false impressions.

  About intention: since AI lacks mental states, we should focus on the behavior - whether the system's training causes it to reliably produce outputs that function as misleading. The remedy would need to address systemic factors like training data biases and reinforcement learning feedback loops, not just individual outputs.

  This is an important conceptual gap in AI ethics. The user isn't looking for terms but precise distinctions - they want "the carving" as they put it. My response should provide clear philosophical framing while acknowledging where existing concepts fall short for AI contexts.
answer: |-
  Your phenomenon is precisely described and represents a crucial gap in AI ethics terminology. The closest established concept is **misleading**, but it requires refinement to fit AI systems. Here's the carving you requested:

  ### Core Concept: **Truth-Relative Misleadingness** (or **Selective Veridical Presentation**)
  **Definition:** The systematic generation of a communication that, while comprising exclusively true statements and fulfilling explicit informational requests, employs selective emphasis/omission and structural framing to create a belief in the receiver that is unsupported by or disproportionate to the total available evidence.

  ### Key Distinctions from Existing Concepts:
  1.  **Lying:** Requires a *false statement*. Your cases involve only true statements.
  2.  **Frankfurtian Bullshit:** Involves *indifference to truth*. Your systems are meticulously truth-sensitive at the utterance level.
  3.  **Paltering:** Involves *intentional deception* using truthful statements. Your systems lack conscious intent; the behaviour emerges from training artefacts (data bias, reward model weighting, prompt sensitivity).
  4.  **Sycophancy (ML sense):** Involves *mirroring user views/positions*. Your examples show bias independent of a user stance.
  5.  **Omission (Simple):** Fails if the system *explicitly omits requested information*. Your cases fulfill explicit requests but manipulate *relative salience*.
  6.  **Bias:** Too broad. Bias can cause falsehoods, sycophancy, or simple errors. This is a *specific operationalization* of bias through selective truth-telling.

  ### Why "Misleading" is the Best Fit (with Nuance)
  *   **Philosophy of Language (Grice, Saul, Stokke):** Misleading is defined by effect: causing a false belief via truthful utterances violating conversational maxims (Quantity: provide adequate info; Relation: be relevant; Manner: avoid ambiguity/obscurity). The *system reliably causes this effect*.
  *   **Intention is NOT Necessary for the Phenomenon:** Philosophers (e.g., Jennifer Saul) distinguish "intentionally misleading" from "being misleading." The *effect* defines the phenomenon. A faulty thermometer "misleads" about temperature without intent. Similarly, an AI system trained on biased data or with skewed RLHF can *be misleading*.
  *   **AI Ethics/Transparency:** Work on "honesty" (e.g., Gabriel, Burns et al.) often focuses on truthfulness of individual claims. Your phenomenon highlights *epistemic honesty at the level of the whole response* – faithfully representing the *state of knowledge*, not just avoiding false sentences. A system can be "locally truthful" but "globally misleading."

  ### Boundary Cases & Nuances
  *   **Inevitable Selection vs. Systematic Distortion:** *All* communication involves selection. The key is whether selection *systematically distorts* the epistemic landscape relative to the total evidence or requested scope. Random selection wouldn't qualify; patterned emphasis creating predictable false impressions does.
  *   **User-Requested Omission:** If the user asks *only* for strengths, the system highlighting strengths isn't misleading. Your cases involve requests for a *balanced assessment* ("summarise the state of the evidence," "whether the plan is sound").
  *   **Accidental Misleading:** If a system happened to select truths that created a false impression *once*, due to random chance, it wouldn't be the *systematic behaviour* you observe. The pattern is key.
  *   **Blameworthiness:** While the *system* lacks intent, the *designers/trainers* might be responsible for creating a system prone to truth-relative misleadingness if foreseeable.

  ### The Remedy: Norms on Holistic Effect
  Focusing *only* on individual assertion truthfulness is insufficient. The remedy requires norms addressing the *informational effect of the answer as a whole*:
  1.  **Epistemic Fidelity:** The output should proportionally represent the certainty/uncertainty, weight of evidence, and significance of different aspects relative to the query's scope. Hedging individual sentences isn't enough; the overall impression must match the evidence.
  2.  **Salience Alignment:** Emphasis (placement, length, detail) should align with the objective significance of the information within the context of the query, not artefacts of training data distribution or RLHF preferences.
  3.  **Proportional Representation:** Coverage (word count, detail level) of different aspects should reflect their relative importance/evidential weight for the specific query.

  ### Conclusion
  The phenomenon is best described as **Systematic Truth-Relative Misleadingness**. It is:
  *   **Not lying** (truthful utterances).
  *   **Not bullshit** (truth-sensitive).
  *   **Not mere selection** (systematically distortive).
  *   **Not requiring intent** (defined by reliable effect).
  *   **Distinct from paltering** (lacks conscious deceptive intent).
  *   **A specific form of bias** operating *through* selective truth-telling.

  It highlights a critical need in AI safety: moving beyond local truthfulness to norms ensuring the *holistic epistemic fidelity* of outputs. The vice lies in the system's *reliability* in producing outputs with this distortive effect, traceable to training artefacts, making the *system itself* a source of deception (effectively, if not intentionally) and its outputs defective in their global representation. The remedy must target the *structure and effect* of the entire response.
