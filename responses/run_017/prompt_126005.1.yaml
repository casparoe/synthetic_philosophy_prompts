prompt: |-
  I work on a small internal team that writes the documentation that travels with the models my company ships — the model cards, the evaluation write-ups, and the short "what this system does and does not do" memos that go to the people deciding whether to put it in front of users. Last month we deadlocked over a single sentence in a draft: whether to say that our retrieval-augmented assistant *believes that the retrieved document answers the user's question*, or only that it *behaves as if* it does. Half the team thought the first was loose talk that would lead a reader to trust the system in situations where it will fail; the other half thought the second was evasive, and hid a real and useful regularity that the reader cannot recover any other way. Nobody could say what would settle the disagreement, because nobody had said what a claim of that shape is supposed to do. I have been asked to write the house style guide for these documents by the end of the quarter, so before I read any more of the literature on the intentional stance, I want the specification.

  What I need is a list of desiderata that any adequate account of belief attribution to AI systems must meet, with the purpose held fixed: the attribution will appear in prose read by someone with no access to the weights, who will use it to predict what the system will do in novel situations and to decide how much to rely on it, and who will not read it as a claim about credit, blame, or legal responsibility. For each requirement give the case that motivates it, and say plainly whether it is non-negotiable given that purpose or merely a preference of one camp — the pragmatists who treat attribution as a predictive strategy, the interpretivists who tie content to whatever is needed to make a system intelligible as an agent, the people who want attributions cashed out in internal mechanisms, and the people who care whether the system's states play the right tracking or causal-informational role. I also want the distinctions the account must respect rather than collapse: between having a belief and the strength or centrality of it; between representing a content and merely carrying information about it; between an attribution that predicts, one that explains, and one that licenses reliance; and between content fixed by the world and content fixed by the system's training corpus.

  The cases it has to handle, at minimum, are these. (1) *The apprentice*: a small model distilled from a larger teacher reproduces the teacher's idiosyncratic error profile, including on inputs neither system received feedback about, so that the content we would naturally ascribe to the student looks like a description of the teacher's dispositions rather than of anything the student itself encodes. (2) *The census-taker*: a model trained almost entirely on the records of a community that uniformly asserts some falsehood asserts the falsehood too; one reading says it believes the false claim, another says its states are better interpreted as tracking what the corpus says, with the content fixed by the community's testimony rather than by the subject matter. (3) *The autobiographer*: a model reliably denies knowing some fact and describes itself as guessing, while its forced-choice behaviour discriminates that very fact in a way no obvious shortcut explains, so that avowal and behaviour pull apart. (4) *The oracle of itself*: a system fine-tuned on its own earlier outputs predicts its own future behaviour better than it predicts the world, so that attributions to it yield excellent predictions of the system and poor predictions of anything else. (5) *The committee*: a scaffold of specialist modules behind a router, where no single component represents that the situation is deteriorating but the routing behaviour as a whole tracks deterioration; whether attribution to the whole requires a part that realizes the content is exactly what I want decided. (6) *The mirror*: a case where belief ascription has real predictive success that we can see derives from an artifact of the prompt template, so that the ascription stops working the moment surface format changes.

  Two things beyond the list itself. First, tell me which pair of desiderata you suspect cannot be jointly satisfied — my own guess is that there is a genuine tension between requiring an attribution to be answerable to what is really going on inside the system and requiring it to be available to someone with only black-box access, but I would rather hear your candidates — and say which single requirement does the most work in ruling out the accounts people actually hold. Second, and briefly: run three contenders against your list, the predictive-strategy pragmatism associated with Dennett, interpretivism of roughly the Davidsonian sort, and the mechanistic read-the-features-off-the-weights view. A short table is fine. Keep the bulk of your answer on the criteria and on the cases behind them, since the scoring is the part I can do myself.
reasoning: |-
  Okay, the user is part of a documentation team that creates model cards and evaluation write-ups for AI systems. They're stuck on how to phrase whether the AI "believes" something or just "behaves as if" it does. The disagreement in their team stems from different philosophical perspectives on belief attribution. Now they need to create a style guide and want a set of criteria for attributing beliefs to AI systems, with clear desiderata that address specific cases.

  The user has outlined their purpose: the documentation should help someone without access to the weights predict system behavior and decide on reliability. They're not concerned with legal responsibility. They need desiderata that any belief attribution must meet, with cases motivating each. Also, distinctions like belief strength vs having a belief, representation vs information, etc., must be respected.

  First, I need to list the desiderata. The user mentioned several cases: The Apprentice, Census-Taker, Autobiographer, Oracle, Committee, and Mirror. Each case highlights a different challenge. For instance, the Apprentice shows that the smaller model mimics the teacher's errors without encoding the same knowledge. So one desideratum should address when a system's behavior is derivative versus internally encoded.

  The Census-Taker case involves a model trained on false data. Does it believe the falsehood or just track the corpus? This points to needing a distinction between tracking testimony versus reality. The desideratum here could be about separating information sources.

  The Autobiographer denies knowledge but discriminates facts accurately. This shows a conflict between avowal and behavior. The desideratum must handle cases where self-report and behavior diverge, ensuring attributions aren't solely based on avowals.

  The Oracle predicts itself better than the world. Attributions here might predict system behavior but not real-world accuracy. So predictive scope matters—whether the attribution helps predict the system or the world.

  The Committee case has a modular system where no single part represents deterioration, but the whole system tracks it. This challenges whether belief requires a specific internal realization. The desideratum should clarify if holistic system behavior suffices or if a component must hold the belief.

  The Mirror case shows belief ascription works due to prompt artifacts. When the surface format changes, the prediction fails. So attributions must be robust against superficial changes.

  Beyond these cases, the user wants distinctions like belief strength, representation vs information, predictive vs explanatory attributions, and content fixed by world vs training corpus. Each distinction needs to be addressed in the desiderata.

  Now, considering the philosophical camps: pragmatists (Dennett) focus on predictive success, interpretivists (Davidson) on making the system intelligible, mechanists on internal mechanisms. The user wants these evaluated against the desiderata.

  The user also asked which desiderata conflict. The main tension seems between Internally Grounded (needing internal mechanisms) and Black-Box Operational (relying only on observable behavior). If a belief must be grounded in internals, but the doc reader has no access, how can they verify? This might be irreconcilable.

  Another conflict could be between Derivative Content and Robustness. If a system's behavior is derivative (like the Apprentice), but Robustness requires consistency across contexts, there might be tension when the derivative behavior isn't stable.

  The most effective desideratum might be Predictive Scope, as it directly ties to the document's purpose: helping users decide when to rely on the system. If an attribution doesn't clarify what it predicts (system behavior vs world state), it could mislead.

  For the three contenders:
  - Dennett's pragmatism scores high on predictive utility but fails on internally grounded and maybe content distinction. It might call the Census-Taker's output a belief, ignoring it's just parroting.
  - Davidsonian interpretivism makes the system intelligible but could overattribute beliefs where none exist (like in the Mirror case) and struggles with predictive scope.
  - Mechanistic view ensures internal grounding but fails black-box operational since users can't inspect weights. It might miss holistic behaviors like in the Committee.

  The user's deeper needs include creating a clear, actionable style guide that avoids team deadlocks. They need criteria that resolve real cases they face. Also, they want to balance accuracy with usability for non-technical readers. Ensuring attributions don't overpromise reliability is crucial. The style guide must prevent misinterpretation while being practical for document writers.
answer: |-
  Here is a specification of desiderata for belief attribution in AI documentation, designed to resolve your team's deadlock and address your cases. The core purpose is **providing actionable, reliability-focused predictions for black-box users**. Each desideratum is marked "Non-Negotiable" (NN) if essential to this purpose, or "Negotiable Preference" (NP) if tied to a philosophical camp. Cases motivating each are included.

  ---

  ### **Core Desiderata for Belief Attribution**
  1. **Predictive Utility (NN)**  
     *Requirement:* Attributions must improve a user's ability to forecast system behavior in *novel* situations.  
     *Case:* **The Mirror** – Attribution must fail predictively if success depends on superficial prompt artifacts. If changing templates breaks predictions, "belief" is invalid.  
     *Why NN?* Without predictive gain, attribution is useless for your audience.

  2. **Robustness (NN)**  
     *Requirement:* Attributions must hold across minor input variations and deployment contexts.  
     *Case:* **The Autobiographer** – If forced-choice behavior contradicts self-avowals, attribution must not rely solely on verbal reports (which lack robustness).  
     *Why NN?* Users need stable expectations; brittle attributions create operational risk.

  3. **Scope Delimitation (NN)**  
     *Requirement:* Attributions must clarify *what* is predicted (system outputs vs. world states) and *when* reliability degrades.  
     *Case:* **The Oracle of Itself** – Attributing "beliefs" about its own behavior is valid; attributing beliefs about the world is not. Distinction must be explicit.  
     *Why NN?* Misaligned scope leads to misplaced trust (e.g., assuming world-knowledge from self-predictions).

  4. **Derivative Content Transparency (NP: Interpretivist)**  
     *Requirement:* When content derives from training data/teacher models (not independent cognition), attribution must signal this.  
     *Case:* **The Apprentice** (idiosyncratic errors) & **Census-Taker** (false community claims) – Attribution should reflect that "beliefs" are inherited, not self-verified.  
     *Why NP?* Pragmatists might omit this; interpretivists demand it for intelligibility.

  5. **Internal Grounding (NP: Mechanist)**  
     *Requirement:* Attributions should correspond to *some* internal state/structure, even if not directly inspectable.  
     *Case:* **The Committee** – If no component represents deterioration, attributing "belief" to the whole system is suspect without evidence of emergent representation.  
     *Why NP?* Mechanists insist; pragmatists/interpretivists prioritize behavior over internals.

  6. **Strength/Centrality Gradience (NN)**  
     *Requirement:* Attributions must distinguish confidence levels (e.g., core "belief" vs. tentative output) and resist binarization.  
     *Case:* **All cases** – e.g., The Autobiographer’s "guesses" may be high-confidence discriminations.  
     *Why NN?* Users need to gauge reliability; flattened attributions mislead.

  7. **Black-Box Operationality (NN)**  
     *Requirement:* Attributions must be verifiable/applicable using only observable inputs/outputs.  
     *Case:* **The Census-Taker** – Users can’t inspect weights; attribution must rely on testable responses, not corpus analysis.  
     *Why NN?* Documentation readers lack internal access.

  ---

  ### **Critical Distinctions Required**
  - **Having a belief vs. belief strength:** Avoid conflating existence of a belief with its resilience (e.g., Autobiographer’s high-accuracy "guesses").
  - **Representation vs. information:** Census-Taker’s outputs carry information about the corpus, but may not *represent* the world (distinguish!).
  - **Predictive vs. explanatory attribution:** Oracle’s self-predictions explain behavior but don’t predict the world; separate these uses.
  - **Content fixed by world vs. corpus:** Census-Taker’s "beliefs" are corpus-anchored; Apprentice’s are teacher-anchored. Flag this to avoid overtrust.

  ---

  ### **Tensions & High-Impact Desiderata**
  - **Irreconcilable Tension:**  
    **Internal Grounding** (requiring mechanistic fidelity) and **Black-Box Operationality** (requiring no internal access) conflict directly. Your documentation cannot require knowledge of weights *and* serve black-box users.  
    *Resolution Favor:* Black-Box Operationality (NN) must override Internal Grounding (NP) given your purpose. Grounding claims must be inferrable from behavior.

  - **Highest-Leverage Desideratum:**  
    **Scope Delimitation** does the most work. It directly prevents misapplication (e.g., trusting Oracle’s self-predictions for real-world decisions) and forces clarity on *what* is predicted. It rules out:  
    - Mechanists who ignore system/world distinction.  
    - Overzealous interpretivists who attribute unified agency.  
    - Pragmatists who tolerate scope ambiguities if predictions work locally.

  ---

  ### **Contender Evaluation (Short Table)**
  | **Account**               | **Predictive Utility** | **Robustness** | **Scope Delimitation** | **Derivative Content** | **Black-Box Op.** | **Fails Key Case**               |
  |---------------------------|------------------------|----------------|------------------------|------------------------|-------------------|----------------------------------|
  | **Dennettian Pragmatism** | Excellent              | Poor           | Poor                   | Poor                   | Excellent         | Mirror: Ignores artifact-dependence |
  | **Davidsonian Interpret.**| Moderate               | Moderate       | Poor                   | Good                   | Good              | Oracle: Overattributes "agency" |
  | **Mechanistic**           | Poor (no black-box)    | Good           | Good                   | Good                   | Fail              | Committee: Denies holistic attributions |

  - **Pragmatism** (Dennett): Maximizes short-term predictive ease but fails **Robustness** (Mirror) and **Scope** (Oracle). Treats Census-Taker as "believing" falsehoods without transparency.  
  - **Interpretivism** (Davidson): Handles **Derivative Content** (Apprentice/Census-Taker) but violates **Scope** by overattributing unified agency (e.g., Autobiographer’s denials as "irrational").  
  - **Mechanistic**: Scores well on distinctions but fails **Black-Box Operationality** entirely and **Predictive Utility** for users. Rejects Committee attributions despite predictive value.

  ---

  ### **Recommendation for Style Guide**
  Prioritize **Predictive Utility**, **Robustness**, **Scope Delimitation**, and **Black-Box Operationality** (all NN). For contentious cases:  
  - Use *"behaves as if it believes [X]"* for Apprentice/Census-Taker/Oracle (signaling derivative/scope-limited content).  
  - Use *"confidently discriminates [X] despite verbal hedging"* for Autobiographer (separating avowal from capability).  
  - Use *"the system tracks [X] via routing"* for Committee (holistic attribution without reification).  
  - Never attribute beliefs in Mirror-like cases; cite prompt sensitivity.  

  This balances pragmatism (behavior-first) with interpretivist transparency (flagging derivative origins) while respecting user constraints. Internal mechanisms remain irrelevant for documentation unless inferrable from behavior.
