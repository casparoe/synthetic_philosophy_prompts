  Okay, so the user is a political philosophy professor working on educational authority. They're frustrated that students frame the schooling debate as about choice, while they see the core conflict lying in the state's underlying rationale for compelling and funding education. They've outlined a specific institutional configuration in the U.S. (with caveats about rough fit) and want to reconstruct its implicit theory.

  Hmm, this is a sophisticated query with layered philosophical questions. Let me parse the core dilemma first: The state enforces school attendance but regulates content inversely to its involvement. Public schools have heavy content regulation but allow partial opt-outs; private schools have moderate oversight; homeschooling has near-zero regulation. Funding doesn't follow the child. Parental rights shift dramatically across contexts - veto power inside public system, near-absolute control outside it. And the "parents as loving agents" justification for homeschooling clashes with public schools distrusting parental conscience.

  The user wants three key distinctions analyzed: (1) Is the state's interest merely custodial/socializing rather than cognitive? (2) Is there an exposure-vs-mastery distinction? (3) Does parental authority function as exit right rather than shaping right? 

  Then they want to know: What theories strictly require vs. merely fit the system? How would child-rights, civic-republican, or parental-authority views disrupt the status quo? Which theory best explains the residual tensions?

  *Scratches head* This requires unpacking multiple contradictions. The state's hands-off approach to homeschool content suggests it doesn't prioritize cognitive outcomes, yet heavy public-school regulation implies it does care about certain knowledge transmission. The exposure veto assumes encountering ideas is valuable, but unit-by-unit opt-outs could void actual learning. Parental authority seems bifurcated - weak in public schools (mere opt-out), strong elsewhere (full shaping).

  *Starts mentally mapping theories*:
  - **Status Quo Theory**: Hybrid "minimalist developmentalism" - state ensures basic socialization/safety, trusts parents on content. Explains lax homeschool rules but not heavy public-school regulation.
  - **Child-Rights View**: Would collapse the system. Funding portability, content standards everywhere, no conscience opt-outs. Homeschooling might require state assessments.
  - **Civic-Republican View**: Opposite collapse. National curriculum, no private/homeschool options, funding centralized. Opt-outs eliminated as threats to citizenship.
  - **Parental-Authority View**: Deregulate public schools? But state already resists that. Funding portability becomes mandatory.

  *Pauses* The real insight might be that the system isn't coherent. It's a historical compromise masking conflicting goals. The "residual incoherence" the user seeks? That's the unresolved tension between state formation of citizens and parental rights. Homeschooling freedom contradicts the civic logic applied to public schools. The exposure veto only makes sense if the state values viewpoint diversity, yet it doesn't enforce this in private/homeschool settings.

  *Nods* The civic-republican view best exposes the contradictions - if citizenship requires shared knowledge, why allow opt-outs or unregulated alternatives? Whereas minimalism at least consistently downplays cognitive interests. But neither fully explains the asymmetry. Perhaps the unresolved question is whether the state views itself as sovereign educator or mere attendance-enforcer.

  *Makes note* Should emphasize that funding immobility is the linchpin - it reveals the state's priority is maintaining public institutions, not educational outcomes per se. Changing that would force coherence one way or another.
answer: |-
  Your institutional configuration reveals a deeply conflicted theory of educational authority—a pragmatic compromise between competing values rather than a coherent philosophy. Below is a reconstruction of its presuppositions, followed by an analysis of how alternative theories would destabilize it.  

  ### Core Presuppositions of the Status Quo  
  1. **The State’s Interest: Custodial Socialization Over Cognitive Mastery**  
     - The state acts as a *custodial guarantor*, ensuring children are in a supervised environment (schooling as "somewhere to be") and exposed to social/ideological diversity.  
     - **Evidence**: Minimal regulation of homeschool content vs. heavy public-school oversight. Compulsory attendance is enforceable even if the child learns nothing (e.g., unassessed homeschoolers). Neglect triggers only for physical harm, not educational deprivation.  
     - **Cognitive Disinterest?** The state *does* care about cognition in public schools (via standards/assessments), but this interest is *contingent on state provision*. It is not a universal claim about children’s rights.  

  2. **Exposure vs. Mastery Asymmetry**  
     - The state prioritizes *exposure* to ideas (defeatable by conscience opt-outs) over *mastery* of knowledge/skills.  
     - **Coherence Problem**: Unit-by-unit opt-outs (e.g., sex ed, evolution) can gut substantive content while satisfying "exposure" formally. Homeschooling eliminates exposure entirely—yet is permitted. This suggests the state’s exposure interest is *weaker* than its custodial interest.  

  3. **Parental Authority: Exit Rights Over Shaping Rights**  
     - Parents have a *negative right* to exit the state’s system but not a *positive right* to shape public education.  
     - **Instability**: The state implicitly concedes parental shaping rights in homeschooling/private schools (content control) but denies it in public schools (only opt-outs). This bifurcation treats parental authority as territorially limited: absolute in the private sphere, subordinate in the public.  

  ### What the Practice Strictly Requires vs. Accommodates  
  | Element                | Strictly Requires                              | Fits Well With                          | Underdetermined                     |  
  |------------------------|-----------------------------------------------|-----------------------------------------|-------------------------------------|  
  | **Compulsory Attendance** | State interest in custodial supervision      | Any theory valuing socialization        | *Why* supervision is needed         |  
  | **Homeschool Deregulation** | Parental autonomy in private sphere        | Parental-rights views                  | State’s threshold for neglect       |  
  | **Public-School Regulation** | State control over *its own* institutions | Civic-republicanism (if consistent)   | Scope of opt-outs                   |  
  | **Funding Immobility**   | Public schools as state monopolies          | Institutional preservation             | Alternatives (e.g., vouchers)       |  

  ---  

  ### How Alternative Theories Destabilize the Package  
  #### **Child-Rights View (Education as Autonomy-Precondition)**  
  - **Indefensible Limbs**:  
    - Homeschool deregulation (unless with state oversight for competency).  
    - Funding immobility (requires portability to ensure access to adequate education).  
    - Conscience opt-outs (if they undermine core knowledge for autonomy).  
  - **Residual Incoherence**: The state’s custodial focus becomes illegitimate. *All* schooling would require content standards and outcomes assessments.  

  #### **Civic-Republican View (Education for Citizenship)**  
  - **Indefensible Limbs**:  
    - Homeschooling/private-school laxity (if they fail to teach civic virtues).  
    - Conscience opt-outs (if they fragment shared civic knowledge).  
    - Funding immobility (if private options better serve citizenship).  
  - **Residual Incoherence**: Asymmetric content regulation collapses. *Either* the state imposes a civic curriculum universally *or* loses its claim to citizenship formation.  

  #### **Thoroughgoing Parental-Authority View**  
  - **Indefensible Limbs**:  
    - Public-school content mandates (usurp parental shaping rights).  
    - Funding immobility (denies parents resources to choose).  
    - Conscience opt-outs (inadequate; parents should control entire curriculum).  
  - **Residual Incoherence**: Compulsory attendance itself becomes suspect unless framed as enforcing parental duty.  

  ---  

  ### Which Theory Best Explains the Residual Incoherence?  
  **Civic-republicanism** best *exposes* the contradictions:  
  - The state claims a citizenship-formation role in public schools (via content regulation) but undercuts it by permitting unregulated alternatives. Opt-outs and homeschooling allow citizens to evade civic education entirely.  
  - **Core Tension**: The system presupposes a *minimalist state* (custodial, deferential to parents) but acts as an *active shaper* of citizens in public schools. This is unsustainable if citizenship is the goal.  

  **Minimalist developmentalism** (state ensures safety/socialization; parents handle cognition) fits best *as practiced* but fails to justify:  
  - Why the state regulates public-school content at all.  
  - Why exposure is valued in public schools but not enforced elsewhere.  

  ### Conclusion: The Unresolved Conflict  
  The package is a **truce between three warring claims**:  
  1. The state’s *pragmatic interest* in keeping children supervised.  
  2. The state’s *aspirational interest* in shaping citizens (in public schools).  
  3. Parental rights as *negative liberty* (exit) but not *positive agency* (shaping public institutions).  

  **To achieve coherence**, you must abandon one limb:  
  - If the state cares about cognition, it must regulate content *everywhere*.  
  - If it cares only about custody, it must deregulate public schools.  
  - If parents have shaping rights, funding must be portable and opt-outs expanded.  

  The residual incoherence is **the state’s refusal to decide whether education is a child’s right, a parental prerogative, or a civic imperative**. Each view fractures the package. Civic-republicanism highlights this most sharply by showing how the state’s public-school actions betray its private-school/homeschool permissiveness.
