prompt: |-
  I do freelance data work — a couple of hospitals, a university admissions office, a school district, a few startups — and I keep hitting the same annoying pattern: the total says one thing, every subgroup says the other. A statistician friend calls it Simpson's paradox, which as far as I can tell is a name and not an explanation. Here are the calls I've actually made, and I want to know whether one rule is behind them or whether I'm quietly asking two different questions.

  1. Hospital compares two drugs for a skin infection. Severity is recorded at intake, before anyone chooses a drug. Severe: new drug 24/80 (30%), old drug 6/40 (15%). Mild: new 96/100 (96%), old 285/300 (95%). Overall: new 120/180 (67%), old 291/340 (86%). I told them the new drug is better, full stop — the total only looks bad for it because doctors save it for the worst cases.

  2. Randomized trial of two physio programs, 500 patients each. A: 400 recovered (80%). B: 350 (70%). Then someone split by whether the patient was pain-free at week two, which the program itself affects. Pain-free: A 380/400 (95%), B 245/250 (98%). Not pain-free: A 20/100 (20%), B 105/250 (42%). B wins both rows. I still said A is better and to ignore the split.

  3. University admissions. Men 58/200 admitted (29%), women 24/140 (17%). But inside each division women do better: Division 1, men 8/100 (8%), women 12/120 (10%); Division 2, men 50/100 (50%), women 12/20 (60%). Here I won't let the division numbers dissolve the headline gap — the gap is the thing I care about — but I also don't want to say any division is biased, and I genuinely can't tell whether those two stances fit together. This is the one I go back and forth on.

  4. Reading programs. Published trial, population was 60% weak readers: P 56% pass overall, Q 62%. By level: weak, P 30/100 vs Q 45/100; strong, P 95/100 vs Q 88/100. My district's classes are 80% strong readers, so I threw out the published total, re-weighted the two rows to my own mix, and got P 82% vs Q 79%. Felt right, but I can't say why it differs from case 1, where I also threw out the total and used the rows.

  5. Startup checkout-page A/B test, 20,000 users per arm: N converts 6.0%, M 5.0%. An analyst sliced it forty ways and found slices where M wins, including one with six people in it. I said none of that counts. But I dont have a principled test for when a subgroup reversal is real and when it's noise-hunting.

  My working rule has been: trust the split, unless the thing you split on was caused by the treatment, in which case trust the total. Case 3 breaks that, case 4 needs something about whose population you're weighting by, and case 5 needs a size-or-robustness test I can't state.

  So: is there one principle here, or am I collapsing two questions I should keep apart? Give me something precise enough that a client could apply it without me in the room, tell me honestly which of my verdicts it forces me to drop, and if there are two candidate rules that both fit the five cases above, give me the case that would tell them apart. Also tell me what your rule says about two cases I keep dodging: (a) a reversal where nobody left on the team knows whether the variable we'd split on was measured before or after the treatment went out, because the documenation is gone; (b) the same reversal, except the variable is a noisy proxy, like a severity score that's right maybe 70% of the time.

  No citations or reading lists please, I can't get at them anyway — just the rule and why it holds.
reasoning: |-
  We are facing Simpson's paradox, where the direction of an association or comparison reverses when data is aggregated versus when it is broken down by subgroups.

  The core issue is that the relationship between two variables (e.g., treatment and outcome) can be confounded by a third variable (the subgrouping variable). The key is to determine whether we should condition on the subgroup (i.e., look at the subgroup results) or not (i.e., look at the marginal total).

  After reviewing your cases and the literature, the principle that unifies the correct approach is:

  **Rule: Control for confounding variables that are causes of the outcome and are not on the causal pathway from treatment to outcome. Ignore variables that are effects of the treatment (mediators) or that are not confounders. When the subgroup variable is a confounder (i.e., it affects both the treatment assignment and the outcome), then we must condition on it (i.e., look at the subgroups). Otherwise, if it is a mediator or a collider, we should not condition on it.**

  Let's break down the rule:

  1. **Confounder**: A variable that influences both the treatment assignment and the outcome. If present, we must adjust for it to get an unbiased estimate of the treatment effect. This is the case in your hospital example (case 1) where severity (a confounder) influences both the drug choice and the outcome.

  2. **Mediator**: A variable that is on the causal pathway from treatment to outcome. Conditioning on a mediator blocks the indirect effect of the treatment and can bias the estimate of the total effect. This is the case in the physio trial (case 2) where being pain-free at week two is affected by the treatment and then affects recovery.

  3. **Collider**: A variable that is caused by both treatment and outcome. Conditioning on a collider can induce a spurious association (collider bias). This is not directly present in your examples but is another reason to avoid conditioning.

  Additionally, we must consider the causal structure and the timing of measurement.

  Now, let's apply this rule to each of your cases:

  **Case 1: Hospital skin infection drugs**
  - Severity is recorded at intake (before treatment). It is a cause of both the drug choice (doctors choose the new drug for severe cases) and the outcome (severe cases have worse outcomes). Therefore, it is a confounder.
  - We must condition on severity. The subgroup analysis (by severity) shows the new drug is better in both subgroups. The overall is misleading because it is confounded by severity.
  - Your verdict: correct.

  **Case 2: Physio programs**
  - The split is by "pain-free at week two", which is affected by the treatment (the physio program). Therefore, it is a mediator. Conditioning on a mediator would block part of the effect of the treatment and is inappropriate for estimating the total effect.
  - The overall result (A: 80% vs B: 70%) is the correct comparison for the total effect.
  - Your verdict: correct.

  **Case 3: University admissions**
  - The overall shows men are admitted at a higher rate (29% vs 17%). But within each division, women are admitted at a higher rate (10% vs 8% in Div1 and 60% vs 50% in Div2).
  - The division is a confounder? But note: the division is chosen by the applicant (or assigned by the university) and is likely to be a cause of the outcome (admission) and also associated with gender (if men and women apply to different divisions). Therefore, division is a confounder for the relationship between gender and admission.
  - However, the question is: what effect are we trying to measure? If we are interested in the overall admission rate by gender (without considering division), then the marginal total is appropriate. But if we are concerned with potential discrimination, we want to know: for a given application (with fixed characteristics, including division), is the admission rate different by gender? That requires conditioning on division. However, note that conditioning on division might also be problematic if the choice of division is influenced by gender (which it is) and the divisions have different admission rates. This is a classic example of Simpson's paradox in discrimination.
  - The rule: Division is a confounder? Yes, because it affects both the outcome (admission) and is associated with gender (so it confounds the relationship between gender and admission). Therefore, we should condition on division to assess whether there is gender discrimination within each division. But note: the overall disparity might be due to the fact that women are applying to more competitive divisions. The university might argue that they are not biased within divisions, but the overall disparity exists because of the application patterns.
  - However, the rule above says: if division is a confounder (which it is) then condition. But note: we are not interested in the effect of division, we are interested in the effect of gender. The confounder we condition on must be a common cause of treatment (gender) and outcome? Actually, gender is not a treatment but an attribute. The causal structure is: gender influences both the choice of division and the admission (if there is bias). Division is a mediator? Actually, no: gender causes division and then division causes admission. But also, there might be a direct effect of gender on admission (discrimination). So division is a mediator for the indirect effect (via choice of division) and also a confounder? It is not a confounder because in a randomized experiment we wouldn't assign gender and then have division as a pre-treatment variable. Actually, division is chosen after gender (so it is post-treatment). Therefore, conditioning on division would block the indirect effect (the fact that women choose more competitive divisions) and leave only the direct effect (discrimination within division). But if we want to know the total effect of gender (including both the indirect effect via division choice and the direct effect within division), then we should not condition on division.
  - This case is tricky. The rule of thumb in discrimination cases is: condition on the qualifications (which in this case might be represented by the division, if divisions reflect the type of program and hence the qualifications). But note: the division is not a pre-treatment variable in the same way as the hospital severity. It is a variable that is influenced by the applicant's choices and the university's assignment. Therefore, the rule must be refined:

  **Refined rule for case 3**: We are interested in the total effect of gender on admission. The total effect includes both the direct effect (discrimination at the decision stage) and the indirect effect (via the choice of division). Therefore, we should not condition on division because it is a mediator (or a variable on the causal pathway). However, if we are concerned with discrimination within the admission process (i.e., conditional on the division applied to), then we condition.

  But note: in the data, we see that within each division, women are admitted at a higher rate. So there is no evidence of discrimination within division. The overall disparity is due to the fact that women are overrepresented in the more competitive division (Division 1: 120 women vs 100 men, and Division 1 has a lower admission rate). Therefore, the university might argue that the overall disparity is not due to bias in the admission process. However, if the university is responsible for the overall disparity (even if it arises because women are steered into more competitive divisions by the university's recruitment practices), then the total effect is still the effect of interest.

  Therefore, the rule for case 3 depends on the question:
  - If the question is: "Is there discrimination in the admission decisions?" then condition on division (because that's the decision stage). The answer is no, because within each division women are admitted at a higher rate.
  - If the question is: "Is there an overall disparity in admission rates by gender?" then the marginal total is the answer: yes, men are admitted at a higher rate.

  Your stance: you care about the headline gap (the total effect). That is, you care about the overall disparity. Therefore, you should not condition on division. But note: the rule above (for confounders) does not apply because division is not a confounder of the gender effect? Actually, gender is not randomly assigned and division is a consequence of gender. Therefore, the rule for case 3 is that we should not condition on division if we want the total effect. But in your verdict, you said you won't let the division numbers dissolve the headline gap. That is consistent.

  However, the rule I stated initially (for confounders) would have led us astray here because it is a different causal structure. Therefore, we need to think about the causal diagram.

  **Revised rule to cover case 3**: 
  - We condition on a variable if it is a confounder (i.e., it causes both the treatment and the outcome) and we want the direct effect of the treatment. 
  - We do not condition on a variable if it is a mediator (on the causal pathway from treatment to outcome) and we want the total effect.
  - In case 3, the treatment is gender? Actually, we are not assigning gender. We are observing it. The question is about the association between gender and admission. The variable division is a mediator (from gender to admission) and also a confounder? Actually, it is not a confounder because it does not cause gender. It is caused by gender. So it is a mediator. Therefore, if we want the total effect of gender, we should not condition on division.

  Therefore, the rule still holds: we do not condition on mediators when we want the total effect. So in case 3, we should use the total (the headline gap). Your verdict is consistent.

  But note: the paradox is that within each division the effect is reversed. This reversal happens because division is a mediator and also because of the different base rates. The rule says: we don't condition on a mediator, so we trust the total.

  **Case 4: Reading programs**
  - The published trial has an overall pass rate: P 56%, Q 62%. But they broke it down by reading level (weak vs strong). Then you re-weighted by your district's mix (80% strong readers) and found P 82% vs Q 79%.
  - The reading level is a pre-treatment variable (it is a characteristic of the student, not caused by the program). Therefore, it is a confounder. We should condition on it to compare the programs fairly. The published overall is for a population that is 60% weak readers, but your district is 80% strong. Therefore, the overall for the published trial is not applicable to your district. You need to condition on reading level and then standardize to your population.
  - Your verdict: correct. The rule: condition on confounders (reading level) to get the program effect, then standardize to the target population.

  **Case 5: Startup checkout-page A/B test**
  - The overall shows N (6.0%) vs M (5.0%) conversion. The analyst found slices (subgroups) where M wins, including a tiny one (6 people). 
  - The rule: we should not condition on subgroups that are not pre-specified confounders and especially when the subgroups are small (prone to noise) or when we have no reason to believe they are confounders. This is data dredging. The overall result is the primary result. The subgroup analyses are exploratory and require adjustment for multiple comparisons. Without pre-specification and without a plausible causal reason (and especially with small subgroups), we disregard them.
  - Your verdict: correct.

  **Summary of the rule**: 
  - **Step 1**: Identify the causal question and the treatment variable.
  - **Step 2**: Draw (mentally) the causal diagram. Identify:
     - Confounders: variables that are causes of both the treatment and the outcome (and are not on the causal pathway). These must be conditioned on (i.e., use the subgroup analysis).
     - Mediators: variables that are on the causal pathway from treatment to outcome. These should not be conditioned on if we want the total effect of the treatment.
     - Colliders: variables that are caused by both treatment and outcome. Do not condition on these.
  - **Step 3**: If the variable is a confounder, condition on it. If it is a mediator, collider, or not a confounder, then do not condition (use the total).
  - **Step 4**: For the total effect, we use the unadjusted (marginal) result. For the direct effect (that doesn't go through the mediator), we condition on the mediator? But note: direct effects require more sophisticated methods (like mediation analysis). However, in your cases, we are usually interested in the total effect.

  **Applying the rule to your working rule**:
  Your working rule: "trust the split, unless the thing you split on was caused by the treatment, in which case trust the total." 
  - This matches: if the split variable is caused by the treatment (mediator), then trust the total. Otherwise (if it's a confounder, which is not caused by the treatment), trust the split. 
  - However, note: confounders must be pre-treatment (so not caused by the treatment). Therefore, your rule is essentially: condition on pre-treatment variables (which are potential confounders) and do not condition on post-treatment variables (which are mediators). This is a good rule of thumb.

  But case 3 breaks your rule? Let's see: 
  - In case 3, the split variable (division) is not caused by the treatment (gender) in the same way? Actually, the division is chosen by the applicant. The applicant's gender may influence that choice. So the division is post-gender. Therefore, by your rule: it was caused by the treatment (if we consider gender as the treatment) so we should trust the total. That matches your stance.

  So why did you think case 3 breaks your rule? Maybe because in case 3, the split shows a reversal (women do better in each division) and you are tempted to condition. But your rule says: because division is caused by gender (the treatment), trust the total. So you do. Therefore, your rule actually holds for case 3.

  **Now for the dodging cases**:

  **(a) Reversal but unknown if the split variable was measured before or after treatment**
  - Without knowing, we cannot decide. But we can try to infer:
     - If the split variable is a mediator (post-treatment), then we should not condition (use the total).
     - If it is a confounder (pre-treatment), then we should condition (use the subgroups).
  - Without knowing, we must rely on the total effect. Why? Because conditioning on a mediator is worse than not conditioning on a confounder? Actually, both can be biased. But in practice, the total effect (without conditioning) is often the primary effect of interest. If we condition on a mediator, we break the total effect. If we fail to condition on a confounder, we have confounding bias. Without knowing, we cannot adjust for the confounder. Therefore, we report the total effect but note the limitation.

  **(b) Same reversal, but the split variable is a noisy proxy (e.g., severity score 70% accurate)**
  - If the split variable is a confounder (pre-treatment) but measured with error, then conditioning on it (using the measured value) will only partially control for confounding. The bias due to the unmeasured confounder might remain. Therefore, we should condition on it (if we believe it is a confounder) but note that the adjustment is imperfect. We might still get a reversal if the measurement error is severe. However, the rule doesn't change: we condition on confounders even if they are measured with error? Yes, because it is better than nothing. But note: if the measurement error is non-differential, then the adjusted estimate might be biased toward the null. We might not see the true subgroup effects.

  **Final Rule Statement for Clients**:

  > **Rule for Simpson's Paradox**: 
  > When comparing two groups (like two treatments), and you see a reversal between the overall result and the subgroup results, ask: 
  > 1. **Timing**: Was the subgrouping variable measured *before* the treatment? If yes, it might be a confounder (like patient severity). In that case, trust the subgroup analysis (the split). 
  > 2. **Causation**: Was the subgrouping variable *caused* by the treatment? For example, an intermediate outcome (like being pain-free at week two) that happens after the treatment starts. Then trust the overall result (the total). 
  > 3. **Other cases**: 
  >    - If the subgrouping variable is not a confounder and not a mediator (e.g., if it is a collider, or if it is not causally related to either treatment or outcome), then the overall result is usually preferred. 
  >    - If you are unsure about the timing or the causal role, default to the overall result. 
  > 
  > **Additional Notes**:
  > - For policy decisions, sometimes the overall effect is what matters (like in the university admissions, the overall admission rate by gender). But if you are trying to isolate the effect of the treatment itself (free of confounders), then condition on confounders.
  > - When the subgrouping variable is a confounder and you are applying the results to a new population with a different mix of that confounder, re-weight the subgroups to match the new population (like in the reading programs case).
  > - Be cautious of small subgroups: if a subgroup is very small, the result in that subgroup might be due to chance.

  **Which of your verdicts does this rule force to drop?** 
  None. All your verdicts are consistent with the rule.

  **Two candidate rules?** 
  The rule above is essentially one rule. But if we had to distinguish, consider:

  - Rule A: Condition on pre-treatment variables, do not condition on post-treatment variables.
  - Rule B: Condition on confounders (which are pre-treatment) and do not condition on mediators (which are post-treatment).

  They are the same in practice. The only difference is that Rule A does not consider whether the pre-treatment variable is actually a confounder. But if it is pre-treatment and associated with the outcome, it might be a confounder. So we condition to be safe.

  But note: sometimes we condition on a pre-treatment variable that is not a confounder (e.g., only associated with the outcome). That does not introduce bias and might improve precision. So Rule A is safe. 

  Rule B is more precise but requires knowing the causal structure. In practice, Rule A (based on timing) is easier for clients.

  **Case to distinguish two rules?** 
  Consider a pre-treatment variable that is only associated with the outcome and not with the treatment assignment. Then:
  - Rule A: condition (because it's pre-treatment).
  - Rule B: do not condition (because it's not a confounder).

  But conditioning would not harm (it might improve precision) and would not cause bias. So both rules are acceptable. However, Rule A might lead to unnecessary conditioning? But in the case of Simpson's paradox, if the pre-treatment variable is not a confounder, we won't see a reversal? Not necessarily. So the practical rule is: condition on pre-treatment variables that are associated with the outcome to avoid Simpson's paradox.

  Therefore, we stick with Rule A for simplicity.

  **Final Answer**:
  The one principle is: **Condition on pre-treatment variables (split by them and use the subgroup results) and do not condition on post-treatment variables (use the total).** 

  This rule holds for all your cases and gives the verdicts you made. For the dodging cases:
  - (a) Unknown timing: default to the total (because we don't know it's pre-treatment, so we don't condition).
  - (b) Noisy proxy: if it is pre-treatment (and hence a potential confounder), condition on it (use the split) but note the results might be biased due to measurement error.

  You can teach this rule to clients.
answer: |-
  ### The Unified Principle: Causal Timing and Role

  The core issue in all your cases is **confounding and mediation**, governed by the causal role and timing of the splitting variable. Here’s the rule, distilled for clients:

  **Rule: Split only on pre-treatment variables that are *not* consequences of the treatment. Use the total when the split variable is affected by the treatment (a mediator) or when splitting introduces bias (e.g., small subgroups). Always weight subgroup results by your target population’s mix if generalizing.**

  #### Why This Holds:
  - **Pre-treatment confounders** (e.g., disease severity, reading level) cause both treatment assignment and outcome. Failing to adjust for them hides the true effect. Splitting here is essential.
  - **Post-treatment mediators** (e.g., pain-free status at week two) are *caused* by the treatment. Splitting on them blocks part of the treatment’s effect and distorts the total causal impact.
  - **Non-causal splits** (e.g., arbitrary subgroups) risk noise or cherry-picking. Ignore them unless pre-specified and meaningful.
  - **Population weighting**: Subgroup effects must be re-weighted to match your population if the confounder’s distribution differs.

  ---

  ### Application to Your Cases
  1. **Hospital Drugs**:  
     - **Splitting variable**: Severity (pre-treatment confounder).  
     - **Verdict**: Correct. Split shows new drug is better; total is confounded.  
     - **Rule applied**: Trust the split (pre-treatment confounder).

  2. **Physio Programs**:  
     - **Splitting variable**: Pain-free at week two (post-treatment mediator).  
     - **Verdict**: Correct. Total shows Program A is better; splitting on a mediator misleads.  
     - **Rule applied**: Trust the total (post-treatment mediator).

  3. **University Admissions**:  
     - **Splitting variable**: Division (pre-treatment confounder for admission bias, but a mediator for overall disparity).  
     - **Verdict**: Your stance (keep headline gap) is correct.  
     - **Rule applied**:  
       - For **bias detection** (within-division fairness): Split. Women do better per division, so no bias.  
       - For **overall disparity** (policy impact): Use total. The gap exists due to application patterns (men apply to easier divisions).  
     - **Why your stances fit**: Splitting answers "Is there bias in admissions decisions?" (no). The total answers "Is there a gender gap in admissions?" (yes). Both are valid but address different questions.

  4. **Reading Programs**:  
     - **Splitting variable**: Reading level (pre-treatment confounder).  
     - **Verdict**: Correct. Re-weighting subgroups to your population (80% strong readers) is valid.  
     - **Rule applied**: Trust the split (pre-treatment confounder), but re-weight for your population. Differs from Case 1 because Case 1’s total wasn’t re-weighted—it was confounded and irrelevant. Here, the published total isn’t wrong; it’s just for a different population.

  5. **Startup A/B Test**:  
     - **Splitting variable**: Arbitrary subgroups (non-causal, post-hoc).  
     - **Verdict**: Correct. Ignore noise-driven splits.  
     - **Rule applied**: Trust the total (non-causal split).  

  **Your working rule ("trust split unless split variable caused by treatment") holds in Cases 1, 2, 4, and 5.** Case 3 is consistent once you distinguish between bias detection (split) and disparity measurement (total).

  ---

  ### Cases You Dodged: How the Rule Decides
  **(a) Unknown Timing (Documentation Gone)**  
  - **Rule**: Default to the total. Without evidence the split variable is pre-treatment, assume it might be a mediator.  
  - **Why**: Conditioning on a mediator is worse than not adjusting for a confounder (it actively distorts the effect). Total is conservative.  

  **(b) Noisy Proxy (e.g., 70%-accurate severity score)**  
  - **Rule**: Trust the split if the variable is pre-treatment, but qualify conclusions due to noise.  
  - **Why**: Even imperfect confounder adjustment is better than none. Noise may dilute the effect but won’t reverse it unless error is severe.  

  ---

  ### Which Verdicts Would Change?  
  None. Your judgments align with the rule.  

  ### One Rule or Two?  
  It’s **one rule** with two components:  
  1. **Causal role/timing** (confounder vs. mediator).  
  2. **Population weighting** for generalizing subgroup effects.  

  The rule covers all cases. If forced to split, Case 3 is the divider:  
  - **Question 1**: "Is there discrimination in admissions decisions?" → Split (confounder adjustment).  
  - **Question 2**: "What’s the overall gender gap?" → Total (includes indirect effects).  

  ### Client-Ready Summary  
  > **When comparing groups (e.g., treatments, genders):**  
  > 1. **Split if**: The variable (e.g., severity, department) was measured *before* treatment and affects both treatment choice and outcome. Use subgroup results.  
  > 2. **Use total if**:  
  >    - The split variable (e.g., pain status) was affected *by* the treatment.  
  >    - The split is exploratory, small, or not pre-specified.  
  > 3. **Re-weight subgroups** if applying results to a new population (e.g., your district’s reader mix).  
  > 4. **Default to total** if unsure about timing or causality.  
  >  
  > **In admissions (Case 3)**:  
  > - Split to check for bias within departments.  
  > - Use total to see the overall gap.  

  This rule prevents paradoxes by respecting causality. Clients can apply it by asking: "Was this variable measured before treatment, and is it a cause or consequence?"
