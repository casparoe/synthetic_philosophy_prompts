prompt: |-
  I've been reading through the decisions of our country's Commission on Public Funding and Worldview Pluralism — we've got a historically established Protestant church whose bishops still hold seats in the upper house, a large Muslim minority, and a nonreligious plurality — and I cant work out what rule they're actually running. Six rulings so far:

  1. Approved a restoration grant for a thirteenth-century cathedral the state doesn't own, under a scheme open to any listed building of any or no religion; conditions: free public opening several days a week, and none of the money spent on anything used in worship.
  2. Rejected a grant toward a new mosque in a city with a big Muslim population — the stated reason was that the state does not fund places of worship.
  3. Approved state salaries for teachers of a compulsory non-confessional Religion and Worldviews course: learning about religions, no worship, no doctrinal teaching.
  4. Rejected by one vote a proposal letting parents swap that course for confessional instruction at state expense, taught by catechists the churches pick; the worries on record were that kids from nonreligious or minority backgrounds get no equivalent publicly funded option, and that the state would end up certifying who counts as a proper teacher of doctrine.
  5. Approved, with conditions, contracts with a Catholic charity to run homeless shelters on state money: no religious test for staff in the funded posts, no prayer or attendance requirement for residents, no restrictions on what the charity does with its own money.
  6. Rejected a proposal to collect through payroll withholding a levy for whatever registered religious body a taxpayer names, with an opt-out declaration for people who don't want to pay; the deciding worry was the state keeping a register of who belongs to what and deciding which bodies qualify.

  Now there's a proposal in front of them: a "worldview levy." Every taxpayer designates one registered worldview body — religious, humanist, anything — and half a percent of there income tax goes to it. Any body qualifies once 0.1% of adults self-declare for it and it signs a charter accepting the democratic order. The money can be spent on anything at all, worship and proselytizing included. The state is only a collection agent, the money never passes through the budget. People who don't tick a box have their half-percent split proportionally across all qualifying bodies. It's more or less the checkbox arrangement a couple of European countries run.

  What do you think they do with it? I'm less interested in the bottom line than in the rules that fit all six rulings, what each of those rules predicts here, and which precedent is the closest analog. If their record genuinely doesn't settle it, say what principle they'd be committing to with each choice, and name the one further case — or the one condition attached to this one — that would best tell the rules apart; if you think they approve it with conditions, say which condition. In American English, please, our house style is US spelling, and definately no footnotes: just argue it out.
reasoning: |-
  Okay, the user is asking about a commission's decision-making regarding public funding and worldview pluralism. They've provided six past rulings and want to know how the commission might rule on a new "worldview levy" proposal. The key is to identify consistent principles from previous decisions and apply them to this new case.

  First, let's look at the six rulings. The commission approved funding for a cathedral restoration but only because it was under a general heritage scheme with conditions: public access and no money for worship activities. They rejected funding a new mosque because the state doesn't fund places of worship. They approved salaries for teachers of a non-confessional religion course but rejected state-funded confessional instruction. They approved contracts with a Catholic charity for homeless shelters with strict conditions about no religious tests or requirements. Finally, they rejected a payroll levy for religious bodies because it involved state registration of religious affiliations.

  The pattern seems clear: the commission avoids direct state support for religious activities or institutions. They fund secular purposes (heritage preservation, education about religions, social services) but with safeguards to prevent religious entanglement or favoritism. The rejections all involve scenarios where state money could be seen as endorsing or facilitating religious practice directly.

  Now for the new proposal: a "worldview levy" where taxpayers designate a registered worldview body to receive 0.5% of their income tax. Qualifying bodies need only 0.1% adult support and must accept democratic principles. The state acts purely as a collection agent.

  This is tricky because it resembles both rejected and approved cases. Like the rejected payroll levy, it involves state collection based on declared affiliations. But unlike that proposal, it includes all worldviews (not just religious) and has no opt-out declaration issue. The money can fund anything, including worship.

  The strongest precedent might be the rejected payroll levy (case 6). The commission was uncomfortable with the state maintaining registries of affiliations and deciding which groups qualify. This proposal has similar features despite including non-religious groups. The "split among all" default for non-designators also creates indirect state funding of all groups.

  However, the inclusion of non-religious worldviews might make it seem more neutral. But the commission's pattern suggests they're wary of any system that institutionalizes state-recognized worldview categories. Their consistent principle appears to be: avoid state mechanisms that officially recognize or facilitate religious/worldview identities, even if neutral on paper.

  I think they'll reject this. The closest analog is case 6, with added concerns from case 4 (state certifying "proper" groups). If they surprisingly approved it, they'd need conditions like excluding worship funding - but the proposal explicitly allows this. A key test case would be whether they'd fund nonreligious groups alone; their record suggests they'd reject that too if it involved similar registry mechanisms.

  The user wants the reasoning behind the prediction, not just the outcome. They're likely a policy analyst or legal scholar trying to understand the commission's jurisprudence. The unspoken need might be anticipating challenges to such policies or drafting future proposals that could pass muster. I'll emphasize the "no direct religious funding" principle and compare each element to past cases.
answer: |-
  Based on the Commission's consistent pattern across the six rulings, their guiding rule appears to be: **The state must avoid directly funding, facilitating, or appearing to endorse *religious practice itself* or creating systems that entangle the state in determining religious legitimacy, while permitting funding for secular public goods (heritage, education, social welfare) provided to or by religious entities under strict conditions ensuring neutrality and no direct support for worship or doctrine.**

  Applying this rule to the "worldview levy" proposal predicts a **REJECTION**. Here's how each precedent informs this prediction and why the levy violates the core rule:

  1.  **Avoiding Direct Funding of Worship/Religious Practice:**
      *   **Case 1:** Approved heritage funding *only* because money couldn't be used for worship.
      *   **Case 2:** Rejected mosque funding explicitly because "state does not fund places of worship."
      *   **Case 5:** Approved social service funding *only* with conditions preventing religious requirements or the use of state funds for religious activities.
      *   **Levy Prediction:** The levy *explicitly allows* funds to be spent on "worship and proselytizing." This directly contradicts the principle established in Cases 1, 2, and 5. Funding worship is the core red line the Commission has drawn.

  2.  **Avoiding State Entanglement in Religious Legitimacy & Registries:**
      *   **Case 4:** Rejected state-funded confessional instruction partly over concerns about the state "certifying who counts as a proper teacher of doctrine."
      *   **Case 6:** Rejected the payroll levy primarily because the state would be "keeping a register of who belongs to what and deciding which bodies qualify."
      *   **Levy Prediction:** The levy requires the state to:
          *   Define and maintain a registry of "registered worldview bodies."
          *   Set and verify the qualification threshold (0.1% of adults).
          *   Determine which bodies "sign a charter accepting the democratic order" (a potentially contentious judgment).
          *   Maintain taxpayer declarations of affiliation (or default assignments).
          This creates *precisely* the kind of state entanglement in defining legitimate worldviews and tracking affiliations that the Commission rejected in Cases 4 and 6. The inclusion of non-religious groups doesn't negate this entanglement; it broadens the scope of groups the state is forced to legitimize and track.

  3.  **Ensuring Secular Purpose & Neutral Benefit:**
      *   **Case 3:** Approved the *non-confessional* education course because it served a secular public purpose (education about religions/worldviews) without promoting doctrine or worship.
      *   **Case 5:** Approved social services because the *secular benefit* (homeless shelters) was provided neutrally, without religious conditions attached to the *state-funded* activity.
      *   **Levy Prediction:** The levy lacks a demonstrable *secular public purpose* served by the *funds distributed*. While collecting the money might be administratively neutral, the *disbursement* is purely for the unrestricted use of the worldview bodies, including inherently religious activities like worship. This is fundamentally different from funding a heritage site (public good) or a neutral education course (public good). It's direct state-facilitated funding of the groups' core activities, religious or otherwise.

  **Closest Analog:** **Case 6 (Rejected Payroll Levy)** is the strongest precedent. Both involve:
  *   State collection/facilitation of funds based on declared affiliation.
  *   State maintenance of a registry of qualifying religious/worldview bodies.
  *   Direct funding flowing to those bodies for their core activities (including worship).
  The key differences (levy includes non-religious, has a lower threshold, default distribution) do *not* overcome the core objections of funding worship and state entanglement in defining legitimacy. If anything, the default distribution ("split proportionally") *worsens* the entanglement by forcing the state to distribute funds to *all* qualifying bodies on behalf of non-designating taxpayers, creating an even broader state endorsement/facilitation mechanism.

  **If They Approved (Unlikely Given Record):**
  Approval would signal a major shift, committing the Commission to the principle that: **The state may act as a purely administrative facilitator for citizen-directed funding of worldview organizations (including worship), provided the system is formally neutral and open to all qualifying worldviews, without judging their validity beyond basic legal compliance.**

  **The Deciding Test Case:**
  The principle that best distinguishes the likely rejection from a potential approval is the **funding of worship**. The single clearest test case would be: **Would the Commission approve direct, unrestricted state grants (not tied to heritage or social services) to qualifying worldview bodies specifically earmarked *for worship activities*?** Based on Cases 1, 2, and 5, the answer is a clear **NO**. Since the levy explicitly allows this, rejection follows.

  **Conditions for Approval (If They Defy Prediction):**
  Given the Commission's pattern, the *only* condition that might make approval conceivable would be: **"No funds disbursed through the levy may be used for worship, proselytizing, or direct religious instruction."** This would align it with the conditions in Cases 1 and 5, transforming it into funding only for secular activities of worldview groups (e.g., administration, community centers, non-devotional education, charity). However, this directly contradicts the proposal's stated allowance for "worship and proselytizing," so it's unlikely to be proposed or accepted.

  **Conclusion:** The Commission's consistent rule against funding worship and against state entanglement in religious registries/legitimacy points strongly to **rejecting the worldview levy**. The closest precedent is Case 6. Approval would require abandoning the clear line against funding worship established in Cases 1, 2, and 5.
