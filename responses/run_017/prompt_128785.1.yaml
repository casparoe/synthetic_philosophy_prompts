  Hmm... the retiming test is particularly clever. If Malthusians can only recalibrate predictions after seeing counterevidence, that smells of post-hoc rationalization. But if the theory itself contains mechanisms to explain timing failures (like innovation triggers under pressure), that's different. I wonder if the user has considered how "subsistence" definitions changed post-Malthus - that might affect point #2 about exogenous shocks.

  For my own credence breakdown, I'll need to weigh:
