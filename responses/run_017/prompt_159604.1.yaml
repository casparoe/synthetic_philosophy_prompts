answer: |-
  The complex's physical substrate stabilizes it across state changes because the exclusion postulate binds Φ-maximization to the system's intrinsic causal architecture, not fleeting activity patterns. Your mistake is conflating mechanism-level state dependence with system-level instability: while cause-effect repertoires update with the state, the *set* of units achieving maximal integrated information depends on the *enduring* causal skeleton of physical connections—synapses, axons—which evolves slowly. Near-ties rarely force fission in biological systems because neuronal connectivity creates pronounced Φ peaks; microstate fluctuations merely update the complex's intrinsic cause-effect structure, not its boundaries. Persistence arises from the physical substrate's continuity—not from a static complex—and the "self" you mention is just this unfolding cause-effect structure across time.

  We concede that Φ is calculated per state, but the exclusion postulate ensures that the complex is defined over candidate subsets *for that state* using the system's *fixed* transition probability matrix, which embeds the physical wiring. Rapid activity shifts alter the complex's *internal* composition of concepts but don't relocate its border unless connectivity changes; your "washing activity" argument ignores how the minimum information partition anchors Φ to durable dependencies. If near-ties *did* constantly dissolve complexes—which they don't in cortex due to sparse connectivity—that would indeed falsify IIT, but we reject your premise: empirical Φ estimates in neural models show robust complexes across states because synaptic weights dominate over noise.
