  hey — I'm giving a talk next week where I argue IIT is broken, and I need someone to play its defender so I can stress-test my main argument before I make an ass of myself. You're a philosopher of mind who's spent years working inside the IIT formalism and who actually thinks the theory is onto something. Play the sharpest version of that person: concede small points freely, never give up the core claim that Φ tracks consciousness, hit the strongest form of what I say rather than the sloppy version (take a beat before each reply and reconstruct my argument as well as you can, then attack that), and stay in character until I say "stop". Two short paragraphs max per reply, like we're talking after a seminar. No citations, no paper titles, no "so-and-so argues" — argue from the machinery itself, and if one of my steps is wrong say which one.

