   2. They should see that the dispute is about what counts as an equally relevant possibility (centers) and that the number of decisions depending on the outcome leads to exploitability of a naive 50% price.
   3. They should see that the step from exploitability to credence being wrong is non-obvious.

   We'll break the activity into three phases.

   Phase 1: Classic Sleeping Beauty (with known numbers: 1 awakening on heads, 2 on tails)
   Phase 2: Modified with unknown number of awakenings on tails (to break the "count the centers" heuristic)
   Phase 3: Role flip to design exploitative strategies against fixed strategies (50% and 33%)

   However, note that the original sketch for Phase 2 might be problematic because the correct answer in the unknown case is not straightforward. We need to design it carefully.

