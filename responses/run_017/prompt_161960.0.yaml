  ### Final Runnable Design for Sleeping Beauty Workshop

  **Phase 1: Classic Setup (30 minutes)**  
  *Materials:* Coin, index cards, envelopes, whiteboard, poker chips (starting stack: 500 chips per participant).  

  **Announcement:**  
  "Welcome! We're simulating an experiment with memory alteration. Each 'run' starts with a fair coin flip. Heads: you'll experience *one* 'awakening.' Tails: *two* awakenings. At each awakening, you'll write a number on a card, seal it in an envelope, and forget the experience. After the run, we resolve payouts.  

  **Your task at each awakening:**  
  Set a price (between 0-100) at which you’d buy a ticket paying 100 chips *if the coin was heads*. Write that number on a card and seal it.  

  **Rules:**  
  1. I flip a coin publicly.  
  2. **Heads:** Each of you gets *one* card/envelope.  
     **Tails:** Each of you gets *two* cards/envelopes (you complete them sequentially without seeing previous cards).  
  3. After all cards are sealed, I reveal the coin.  
  4. **Payout per run:**  
     - **Heads:** You buy *one* ticket at your price. Net = `100 - your price`.  
     - **Tails:** You buy *two* tickets (at your two prices). Net = `-(price1 + price2)`.  
  5. We run this 6 times. Leaderboard tracks total chips (higher = better).  

  **Why this works:**  
  - Participants face the core dilemma: setting a price per awakening, but payouts depend on the coin.  
  - Naive 50-chip bids lose money (see exploit in Phase 3), while 33-chip bids break even.  
  - **No jargon:** Avoid terms like "credence" or "self-locating." Focus on prices and chip outcomes.  

  ---

  **Phase 2: Unknown Awakenings (Cancelled → Replaced)**  
  *Original plan was flawed:* Rolling a die for unknown tail-awakenings doesn’t split halfers/thirders—both converge on the same price (e.g., 22.2 for a 6-sided die). It also doesn’t reveal new insights beyond Phase 1.  

  **Replacement: Exploit Demo (25 minutes)**  
  *Materials:* Pre-filled index cards (fixed prices: 50 or 33), envelopes.  

  **Announcement:**  
  "Now, imagine two participants: Alice always bids 50 chips. Bob always bids 33. Your task: Design a strategy for the *House* (me) to profit from Alice but not from Bob. Rules:  
  1. I know the coin flip outcome.  
  2. At each awakening, I *must* trade at their posted price (buy or sell tickets).  
  3. **New ticket type:** Pays 100 chips if heads, but I can choose to be the *buyer* or *seller* at their price."  

  **Mechanics:**  
  - **Against Alice (50-chip bidder):**  
    - Heads: House *sells* her 1 ticket → House gains `50` (ticket pays 100, costing House 50 net: `100 - 50 = 50` loss? Wait no: House *sells* the ticket, so House gets 50 chips and pays 100 if heads. In heads: House loses 50. In tails: House gains 50 per ticket.  
    - Tails: House *sells* her 2 tickets → House gains `50 × 2 = 100`.  
    - House’s expected profit: `(0.5 × -50) + (0.5 × 100) = 25 chips/run`.  
  - **Against Bob (33-chip bidder):**  
    - Heads: House *sells* 1 ticket → Loses `100 - 33 = 67`.  
    - Tails: House *sells* 2 tickets → Gains `33 × 2 = 66`.  
    - Expected profit: `(0.5 × -67) + (0.5 × 66) ≈ -0.5` (break-even).  

  **Key insight:**  
  - Alice’s 50-chip bid is exploitable (House profits 25 chips/run). Bob’s 33-chip bid isn’t.  
  - **Connect to credence:** "Why might someone bid 50? They think heads is 50% likely. But the House exploits them because they overpay *in tails runs* where they bet twice."  

  ---

  **Phase 3: Role Flip (25 minutes)**  
  *Materials:* Index cards, envelopes for strategy writing.  

  **Announcement:**  
  "In pairs, design a strategy to exploit a *fixed* bidder. One is House (knows coin outcome), one is Beauty (bids fixed price per awakening). Beauty’s memory is wiped between awakenings—simulated by writing strategies on cards *before the coin flip*."  

  **Rules:**  
  1. **Beauty** pre-commits to a price (e.g., 50) by writing it on all cards.  
  2. **House** pre-commits to an action per outcome (e.g., "Heads: sell tickets; Tails: buy tickets").  
  3. Resolve one run: Flip coin, simulate awakenings (open envelopes), calculate net chips.  
  4. **Goal:** House maximizes profit. Test against both 50 and 33 bidders.  

  **Example:**  
  - Beauty bids 50. House strategy: "Heads: *buy* 1 ticket from Beauty; Tails: *sell* 2 tickets to Beauty."  
    - Heads: House buys a ticket at 50 → If heads, ticket pays 100 to House. House gains `100 - 50 = 50` (Beauty loses 50).  
    - Tails: House sells 2 tickets at 50 each → Beauty pays 100, tickets pay 0. House gains 100.  
    - House profit: 50 (heads) or 100 (tails). Expected: 75.  
  - **But wait:** In tails, Beauty is forced to buy 2 tickets, paying 100 chips. This works, but highlights that Beauty’s losses come from oversampling tails.  

  **Debrief Mapping (10 minutes):**  
  - **Disagreement about possibilities:** "When you saw awakenings as equally likely (thirder), you bid 33. If you focused on coin flips (halfer), you bid 50 but lost chips. The dispute is whether to count *awakenings* or *coin outcomes*."  
  - **Exploitability:** "Naive 50-chip bids lose because you bet more often in tails. But does that *prove* 33% is the 'correct' credence? Not necessarily—a halfer might say, 'My *belief* is 50%, but I bid 33% to avoid exploitation.'"  
  - **Strongest halfer reply:** "Betting prices aren’t beliefs. When the number of decisions depends on the outcome, you must adjust your bids—but that doesn’t change your underlying credence."  

  ---

  **Predictable Issues & Fixes:**  
  1. **Programmer asks:** "Is payout per awakening or per run?"  
     - Clarify: "Per *run*. In tails, you buy two tickets and lose the sum of both prices."  
  2. **Participant refuses to bet:**  
     - Encourage: "Set a low price (e.g., 10) to minimize risk. But you’ll miss gains in heads runs."  
  3. **Spoiler knows Sleeping Beauty:**  
     - Brief them pre-workshop: "Help others *discover* the tension—don’t name 'halfers' or debate online arguments."  
  4. **Group splits/leaderboard stalls:**  
     - Use public leaderboard; highlight how 50-bidders drop over runs. Intervene: "Why might team X be losing?"  
  5. **Cannot replicate memory erasure:**  
     - Acknowledge post-activity: "Real amnesia would make awakenings feel independent. Here, you *know* the setup—this tests how you *act* under the rules, not raw belief."  

  **What the Activity Can’t Replicate:**  
  - True subjective uncertainty (participants know it’s a simulation).  
  - Distinction between belief and betting strategy (we infer belief from actions).  
  - **Must say aloud:** "We measure *decisions* under ignorance. Whether this reflects ‘true credence’ is a deeper question—philosophers debate this!"  

  **Timeline:**  
  - 0–5 min: Intro + Phase 1 rules.  
  - 5–35 min: Phase 1 (6 runs).  
  - 35–45 min: Leaderboard review + Phase 2 exploit demo.  
  - 45–70 min: Phase 3 (role flip).  
  - 70–85 min: Group discussion + halfer/thirder mapping.  
  - 85–90 min: Wrap-up + limitations.  

  **Rejected Ideas:**  
  1. **Unknown tail-awakenings (die roll):**  
     - Discarded because halfers and thirders *agree* on the break-even price (both calculate expected awakenings). Fails to split opinions.  
  2. **Per-ticket payout (not per run):**  
     - Discarded because it converts the problem into a simple EV calculation, missing the core dilemma of outcome-dependent decisions.  
  3. **Scoring rules for credence reports:**  
     - Too abstract; chips make exploitability visceral.  

  This design forces confrontation with the problem, avoids jargon, and makes exploitability tangible—while leaving the credence debate open for discovery.
