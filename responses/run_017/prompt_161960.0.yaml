          - After the run, reveal the coin.
          - For heads: for each participant, open the one envelope. They buy one ticket at the price P written: so their net for the run: 100 - P.
          - For tails: for each participant, open both envelopes. They buy two tickets at the prices P1 and P2: net: - (P1+P2).

          - Update the chip count.

          - Do at least 10 runs.

   Phase 2: Exploitation demonstration (originally Phase 3) but done as a group.

     - The organizer now takes on two fixed strategies: one that always posts 50, and one that always posts 33.33.

     - The organizer asks the participants: "Can you design a strategy for the house that will make money off a Beauty who always posts 50? Remember, the house knows the coin flip and must decide at each awakening whether to buy or sell at the price 50? But wait, in our setup the house was forced to trade? We didn't give the house a choice. So we need to change the rules.

     - Alternatively, we can change to the setup where the house sets the price and the Beauty chooses to buy or not. But we haven't done that.

     - Given the confusion, we can skip and instead show in spreadsheets:

          For a Beauty who always posts 50:
            - Heads: the house must sell one ticket at 50 -> house loses 50 (because pays 100).
            - Tails: the house must sell two tickets at 50 each -> house gains 100.
            - House's expected gain: (1/2)(-50) + (1/2)(100) = 25.

          For a Beauty who always posts 33.33:
            - Heads: house loses 100-33.33 = 66.67.
            - Tails: house gains 33.33 * 2 = 66.67.
            - Expected: (1/2)(-66.67) + (1/2)(66.67) = 0.

          So the house makes money off the 50-poster but breaks even off the 33.33-poster.

     - Then the participants see that posting 50 is exploitable.

     - Also, we can have them calculate what price P would make the house break even: 
            (1/2)(100 - P) + (1/2)(-2P) = 0
            => 50 - P/2 - P = 0
            => 50 = 1.5P
            => P = 50/1.5 = 33.33.

   Phase 3: Discussion of what this means for credence.

     - We then ask: "But does this mean that upon awakening, the probability of heads is 1/3? Or is it still 1/2, but you have to adjust your betting price because you are betting twice on tails?"

     - We introduce the two camps: halfers and thirders.

     - We explain that the dispute is about what counts as an equally relevant possibility (centers). The thirder says there are three equally likely experiences: one heads-awakening and two tails-awakenings. The halfer says there are two equally likely worlds: heads-world and tails-world, and then within the tails-world there are two experiences but they are not independent of the world.

     - We also note that the betting setup forces you to 33.33 to avoid being exploited, but that doesn't necessarily mean your credence is 33.33% - it could be 50% and then you adjust for the betting structure.

     - The strongest halfer reply: betting price and credence can come apart when the number of bets depends on the outcome.

     - And that counting centers is a substantive assumption.

   Timeline for 90 minutes:

     - 0-5 min: Introduction and explanation of Phase 1 rules.
     - 5-20 min: Run 5-10 runs of Phase 1. (Each run: flip coin, then if heads: 1 card per participant; if tails: 2 cards per participant. Then reveal and update scores. Use a whiteboard for scores.)
     - 20-30 min: Show the leaderboard and ask for observations. Some will have set 50 and lost chips; some may have set 33 and done better.
     - 30-45 min: Phase 2: The organizer shows two fixed strategies (50 and 33) and asks the group to compute the expected house profit if the house is forced to trade at the posted price every time. They do the math and see that 50 yields house profit 25 per run, while 33 yields 0.
     - 45-60 min: Phase 3: Discussion of credence. Introduce the halfer and thirder views. Explain the disagreement about the centers. 
     - 60-85 min: Open discussion: what if the number of awakenings in tails was huge? (Then the break-even price approaches 0.) What if the coin was not fair? 
     - 85-90 min: Conclusion.

   What can go wrong:

     - Programmer asks: "Is settlement per awakening or per run?" -> We have defined per run: at the end of the run, we settle based on the coin and the tickets bought in that run.

     - Person who refuses to bet: They might set P=0 to avoid loss? But then they never gain. They will see others who set around 33 gain over time? Or we can explain that the goal is to maximize chips, so being too conservative may not be optimal.

     - Person who has read about it: Ask them not to reveal the name or the camps. If necessary, make them an assistant.

     - Group splits and stops updating: Keep the leaderboard public and update after every run.

     - The activity cannot reproduce the true amnesia: We are simulating with sealed envelopes and index cards. Participants might remember what they set? We must stress: "Treat each awakening separately. When you are writing the second card in a tails run, you should not try to remember what you wrote on the first. And we will not show you until the end of the run."

     - Also, the activity tests dispositions to act, not credence directly. In the debrief, we must say: "We are using betting behavior to probe your beliefs. But note: your betting behavior might be influenced by more than just your credence, such as the structure of the bets."

   Final rules and wording:

     Materials: 
       - A fair coin (or a random number generator for coin flips)
       - Index cards and envelopes (each participant gets at least 20 cards and 20 envelopes)
       - Whiteboard for leaderboard (participant names and chip counts)
       - Starting chips: 1000 for each participant.

     Phase 1 instructions:

       "We are going to simulate an experiment. In each run, a fair coin will be flipped. If the coin lands heads, each of you will experience one 'awakening'. If tails, each of you will experience two 'awakenings'. 

        At each awakening, you will be given an index card. You must write on it a price P (a number between 0 and 100) and seal it in an envelope. You will not be able to see what you wrote in previous envelopes in the same run.

        After the run, we will reveal the coin. 
          - If heads: we open the one envelope for each of you. You will buy one ticket at the price P you wrote. This ticket pays 100 chips if the coin was heads (which it is) and 0 if tails (which it isn't). So your net chips for the run: 100 - P.
          - If tails: we open both envelopes for each of you. You will buy two tickets, one at each price you wrote. Each ticket pays 100 if heads (which it isn't) and 0 if tails (which it is). So your net chips for the run: - (P1 + P2).

        We will do several runs. Your goal is to maximize your total chips."

     Then run 10 times.

     After Phase 1, show the leaderboard.

     Phase 2 instructions:

       "Now, we will analyze two fixed strategies: one that always writes 50 and one that always writes 33.33. 
        Let's compute the expected chips for the Beauty using each strategy:

          Strategy 50:
            Heads: 100 - 50 = 50
            Tails: - (50+50) = -100
            Probability heads: 1/2, tails: 1/2.
            Expected chips per run: (1/2)*50 + (1/2)*(-100) = 25 - 50 = -25.

          Strategy 33.33:
            Heads: 100 - 33.33 = 66.67
            Tails: - (33.33+33.33) = -66.66
            Expected chips per run: (1/2)*66.67 + (1/2)*(-66.66) ≈ 0.

        So the 50 strategy loses 25 chips per run on average, while the 33.33 strategy breaks even.

        If the house were able to take the other side of the trade, then against the 50 strategy, the house would:
            Heads: the house sells one ticket at 50 and then has to pay 100 -> net -50.
            Tails: the house sells two tickets at 50 each and pays nothing -> net +100.
            House expected: (1/2)*(-50) + (1/2)*(100) = 25.

        Against the 33.33 strategy: 
            Heads: - (100-33.33) = -66.67
            Tails: +33.33+33.33 = 66.66
            House expected: 0.

        Therefore, the house can exploit the 50 strategy but not the 33.33 strategy."

     Then move to discussion.

     Debrief:

       - The disagreement between halfers and thirders is about the credence upon awakening, not necessarily the betting price. The betting setup forces a price of 33.33 to avoid exploitation, but a halfer maintains that the credence is still 50% and the betting price is adjusted because they know they will have to make two bets on tails.

       - The thirder argues that the three awakenings (one in heads, two in tails) are equally likely, so the credence should be 1/3.

       - The key difference is the choice of sample space: events (the coin outcome) vs. experiences (awakenings).

     What we cannot reproduce:

       - The true amnesia: participants know the setup and might remember their overall strategy, but we simulate the lack of memory within a run by having them write without seeing previous cards.

       - We are only measuring betting behavior, which is a proxy for belief.

     Final note: I discarded the unknown-N variant because it did not create a disagreement between halfers and thirders in the betting price. Both would set the same price (around 22.22 for a die from 1 to 6). So it didn't serve the purpose of breaking the counting centers in a way that separates the camps.
