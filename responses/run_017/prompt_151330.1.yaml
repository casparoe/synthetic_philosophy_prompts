  Substance:
  - The nested occurrence must retain the same content as the unembedded one for inferences to remain valid.
  - The three alternatives:
    (a) Make `wrong!(x)` return a boolean. Solves compositionality but abandons the original idea that it's an expression of attitude.
    (b) Desugar embedded occurrences to something like `in_plan_store("wrong(stealing)")` (quasi-realism). But then what is the status of this? Is it a real semantics? And can it be correct or incorrect?
    (c) Two distinct modes: one for performing the stance, one for describing (but then we have two meanings for the same expression).

  Also, note the case of reporting someone else's view and extend to other expressions (epistemic modals, taste predicates) in future work.

  Appendix: Error messages for invalid embeddings, e.g., in a conditional: "error: moral judgment `wrong!` must be used as a top-level statement; it does not produce a value and cannot be conditionally executed."

  Let's outline the sections:

  # Summary
  Proposes solutions to the non-compositionality of the `wrong!` construct, which currently only records a stance when used as a top-level statement. When embedded, it fails to record a stance and its semantic contribution is undefined, breaking inference patterns.

  # Motivation (Bug Report)
  - Bug ID: LANG-471
  - Description: The `wrong!` construct, when embedded (e.g., in conditionals, under negation, in disjunctions, in unevaluated function bodies, or in reports of others' beliefs), does not record any stance and its semantic contribution is unclear, yet the program runs and inference rules treat it as if it had meaning. This breaks expected inference patterns and leads to undefined behavior.

  # Guide-level explanation
  We explain the problem and the proposed solution in accessible terms. For proposal (b): we introduce a global "commitment store" and desugar embedded occurrences to queries against this store. So `if wrong!(stealing) { ... }` becomes `if in_commitment_store("wrong(stealing)") { ... }`. But note: what is the content of the store? It's the set of stances the policy has taken.

  # Reference-level explanation
  Formal semantics: 
  - Top-level: `wrong!(x)` adds `wrong(x)` to the global commitment store.
  - Embedded: `wrong!(x)` is desugared to `in_commitment_store("wrong(x)")` which returns a boolean.

  But then, what is the truth condition? It's about the current state of the store. However, the store is built by the very same policy, so it's self-referential? And what about when we report others? We might need a different store.

  # Known limitations and unresolved questions
  - Reporting others: `alice_believes { wrong!(stealing) }` — we cannot use the global store because it's Alice's belief. We might need a context for the store.
  - The desugared form is a description of the current state, but the original idea was non-descriptive. Now we are describing our own commitments. Is that still expressivism?
  - What does it mean for a commitment to be correct? The store only records what we've said, not whether it's true.

  # Alternatives considered
  (a) Make `wrong!` a boolean function: `is_wrong(stealing)`. Solves compositionality but abandons the non-cognitivist stance. Now it's just a fact about the world.

  (b) Desugaring to commitment store queries. This preserves the non-cognitivist idea at the top level but turns embedded occurrences into descriptions of the policy's own commitments. However, this changes the meaning: in the conditional, we are checking our own commitment, not making a moral judgment. Also, the inference patterns are preserved only if we interpret the embedded occurrence as about the store.

  (c) Two modes: one for performing (top-level) and one for mentioning (embedded). But then we have two different meanings for the same syntax, which breaks compositionality and requires the programmer to know which mode they are in. We could enforce that `wrong!` can only be top-level and throw an error when embedded (as in the appendix diagnostics). But then we lose the ability to embed moral judgments in conditionals, which is a common pattern.

  Appendix: Compiler diagnostics
  - E471: `wrong!` must be used as a top-level statement and cannot be embedded. Found in conditional.
  - E472: `wrong!` does not produce a value and cannot be used as an expression.

  Now, write the RFC accordingly.

  Afterword (separate, in the assistant's voice):
  - Where the analogy takes liberties: The compiler has a clear notion of execution and state (the commitment store) which might oversimplify the philosophical issue of mental states and their expression.
  - Formulation: The RFC leans on the embedding problem for non-descriptive meanings and the challenge of preserving inference.
  - Expressivist defense: They might argue that the commitment store is not just a pragmatic device but part of a systematic account of moral language that captures the inferential role without positing truth conditions. The RFC might misrepresent by making the store too concrete and internal, whereas in expressivist theories the commitments are part of a public language practice.
  - Falsifier: If it were shown that in natural language, moral judgments embedded in conditionals are not used to express the speaker's current commitment but are still non-descriptive, then the desugaring approach might be inadequate. Or if there is a way to give a unified semantics without descriptivism that handles all embeddings, then the analogy breaks.

  Let's write the RFC.
answer: |-
  ### RFC: LANG-471 — Compositional Semantics for Moral Judgment Construct  

  **Status:** DRAFT  
  **Authors:** Backend Infra Team  
  **Date:** 2023-10-15  

  ---

  #### Summary  
  This RFC addresses a compositional defect in the `wrong!(action)` construct (LANG-FEATURE-29). Currently, `wrong!` records a negative stance in the global policy ledger when executed as a top-level statement but becomes inert when embedded in conditionals, negations, disjunctions, or other unasserted contexts. We propose desugaring embedded instances into queries against a global "commitment store," preserving compositional inference while retaining the stance-recording behavior. This avoids breaking existing policy engines but introduces questions about the ontological status of the store.  

  ---

  #### Motivation (Bug LANG-471)  
  **Description**:  
  The `wrong!` operator fails to uphold its primary function (recording a moral stance) when nested:  
  ```python
  # Top-level: Works  
  wrong!(stealing)  # ✅ Stance recorded in ledger  

  # Embedded: Fails  
  if wrong!(stealing) { ... }  # ❌ No stance recorded; no value returned  
  ```  
  User reports confirm:  
  1. **Inertness**: Embedded `wrong!` does not modify the ledger.  
  2. **Inference anomalies**: Rules like `{ wrong!(A) ∨ wrong!(B) }; ¬wrong!(B) → wrong!(A)` remain syntactically valid but lack clear semantics for the disjunction.  
  3. **Ambiguous contribution**: Embedded instances pass type-checking (inferred as `void`) but behave as no-ops. This violates the principle of compositionality.  

  **Impact**: Policies using `wrong!` in conditionals or indirect reports (e.g., `user_believes { wrong!(lying) }`) execute without errors but produce undefined ledger state, risking silent misalignment with governance intent.  

  ---

  #### Guide-Level Explanation  
  We introduce a global, immutable `CommitmentStore` tracking all stances taken via top-level `wrong!` statements. Embedded `wrong!` is desugared into a boolean query against this store:  
  ```python
  # Original  
  if wrong!(stealing) { ... }  

  # Desugared  
  if CommitmentStore.contains("wrong(stealing)") { ... }  
  ```  
  **Key behaviors**:  
  - **Top-level**: `wrong!(stealing)` adds `"wrong(stealing)"` to `CommitmentStore` (unchanged).  
  - **Embedded**: `wrong!(stealing)` becomes `CommitmentStore.contains("wrong(stealing)")`, returning `bool`.  
  - **Indirect reports**: `user_believes { wrong!(x) }` desugars to `user_believes(CommitmentStore.contains("wrong(x)"))`, shifting to belief-ascription.  

  **Inference preservation**:  
  ```python  
  # Valid inference: P ∨ Q; ¬Q ⊢ P  
  wrong!(A) ∨ wrong!(B)  # → contains("A") ∨ contains("B")  
  ¬wrong!(B)             # → ¬contains("B")  
  ∴ wrong!(A)            # → contains("A")  (valid)  
  ```  

  ---

  #### Reference-Level Explanation  
  **Semantics**:  
  - **Top-level**: `⟦wrong!(x)⟧ = update_commitment_store("wrong(x)")`  
  - **Embedded**: `⟦wrong!(x)⟧ = query_commitment_store("wrong(x)") → bool`  

  **Compilation pipeline**:  
  1. **Parse**: Distinguish top-level vs. embedded `wrong!` via AST context.  
  2. **Desugar**: Rewrite embedded `wrong!` as `CommitmentStore.contains(...)`.  
  3. **Runtime**: `CommitmentStore` is append-only, initialized at policy load.  

  **Validation**:  
  - The type of `wrong!` changes contextually: `void` (top-level) or `bool` (embedded).  
  - **New error**: `E471` (see Appendix) enforces non-embedding for stance-taking.  

  ---

  #### Known Limitations  
  1. **Store ontology**:  
     - `CommitmentStore` records *issued stances*, not objective truths. `contains("wrong(x)")` returning `true` means "we condemned `x`," not "`x` is wrong."  
     - **Unresolved**: Can `contains(...)` be "incorrect"? e.g., if external facts contradict the store.  

  2. **Indirect reports**:  
     - `alice_believes { wrong!(x) }` desugars to `alice_believes(contains("wrong(x)"))`, which ascribes belief *about our store*, not Alice’s moral view. Workaround: Extend `user_believes` to accept raw string literals.  

  3. **Epistemic/taste predicates**:  
     - Future work: Similar issues observed for `probably!(e)` (epistemic) and `gross!(x)` (taste). This fix may generalize.  

  ---

  #### Alternatives Considered  
  **A. Boolean predicates (`is_wrong(x)`)**  
  - **Proposal**: Redefine `wrong!(x)` as `func is_wrong(x) → bool`.  
  - **Advantages**: Full compositionality; solves all nesting cases.  
  - **Drawbacks**: Abandons stance-taking. Recording a stance requires explicit side effects (e.g., `is_wrong(x) ? record("condemned", x) : null`), diluting the moral-judgment primitive. Implicitly endorses cognitivism (moral facts = booleans).  

  **B. Dual-mode semantics**  
  - **Proposal**: Two distinct operators: `wrong!` (stance-taking) and `wrong?(x)→bool` (query).  
  - **Advantages**: Explicit separation; no desugaring.  
  - **Drawbacks**: Breaks syntactic uniformity. Programmers must manually replace `wrong!` with `wrong?` in conditionals, risking errors (e.g., `if wrong!(x) {...}` vs. `if wrong?(x) {...}`). Invalidates inferences crossing modal boundaries.  

  **Why desugaring (proposed) wins**:  
  - Preserves syntactic consistency and top-level stance-taking.  
  - But **tradeoff**: Embedded `wrong!` becomes descriptive (about the store), not performative. This may conflate "we condemned `x`" with "`x` is condemnable," potentially regressing to cognitivism.  

  ---

  #### Appendix: Compiler Diagnostics  
  | Code | Message                                 | Example                      |  
  |------|----------------------------------------|------------------------------|  
  | E471 | `wrong!` must be top-level. Cannot embed in expressions. | `if wrong!(x) {...}`         |  
  | E472 | `wrong!` produces no value. Cannot use as operand.       | `let y = wrong!(x) ∨ true;` |  
  | E473 | `wrong!` in indirect scope. Use string literals for belief reports. | `user_believes { wrong!(x) }` |  

  ---

  ### Afterword: Compiler Analogies and Metaethical Reality  

  The RFC frames expressivism’s Frege-Geach problem through a compiler lens: stance-taking as a state-mutating operation (`wrong!` top-level) clashes with compositional semantics when embedded. The analogy leans on *logical embedding*—how an unasserted moral sentence retains identical content across syntactic contexts to preserve inference validity. This mirrors Geach’s observation that modus ponens fails if "if P, then Q" and "P" don’t share P’s meaning.  

  **Liberties taken**:  
  - The "commitment store" concretizes abstract expressivist commitments (e.g., Blackburn’s "attitudes") into a literal append-only database. Real expressivism treats commitments as psychological states, not a queryable store.  
  - Error `E473` sidesteps *hermeneutic challenges*: reporting others’ moral views (`Alice believes stealing is wrong`) isn’t neatly reducible to beliefs about our store. Expressivists use higher-order attitudes (e.g., "disapproving of Alice’s non-disapproval of stealing"), which resist clean compilation.  

  **Defender’s rebuttal**:  
  A quasi-realist would argue the RFC misrepresents by implying the desugaring *replaces* non-cognitive meaning with descriptivism. They’d insist `contains("wrong(x)")` remains expressive: it pragmatically tracks our attitudes while enabling composition, without invoking moral "truth." The store isn’t truth-apt—it’s a ledger of our speech-acts.  

  **Falsifier for the analogy**:  
  If natural language moral judgments *directly* embedded in conditionals (e.g., "if stealing is wrong, then...") were shown to **not** involve psychological state references (e.g., via neuroscientific evidence of distinct processing), the "store" desugaring would misalign with reality. Conversely, if expressivism furnished a unified formal semantics (e.g., via probabilistic attitudinal maps), the compiler analogy might hold. Until then, it’s a useful bug report on reality.
