prompt: |-
  Imagine a good-faith adversarial collaboration between a linguistic reformer who reads Hofstadter's Person Paper on Purity in Language--the satire that stages a mock defense of a traditional generic term for humans by pointing out that the term already contains a male morpheme, the son bit, and then rebuilds compounds on that root--as showing that the traditional generic term is default-loaded: its official definition is group-neutral, but the unmarked image it calls up is male, and that image does real work in judgment; and a semantic conservative who reads the same satire as only showing that any entrenched term can be made to look absurd once a satirist stages a mock defense and asks us to imagine tomorrow's reformers, who holds that the term is semantically group-neutral, that conventional meaning is not settled by historical morphemes or by subjects' snap imagery, and that mandated new roots are mostly symbolic politics that won't touch the underlying stereotypes. Draft the joint statement they could both sign: first a numbered agreed-claims section covering at least what the satirical method is and what it can and cannot establish on its own, the distinction between conventional meaning, default imagery, and policy obligation, and the point that anecdotal intuitions of absurdity need to be checked against something like controlled paraphrase or mental-imagery data; then a disagreements table in which every disagreement is stated twice, once in wording the reformer would accept and once in wording the conservative would accept, with neither side forced to use the other side's loaded labels. Say which parts of their dispute are merely verbal and which are genuine, and name at least two cruxes: maybe one about whether default-loadedness is a semantic property or merely a psychological one, and another about whether verified default-loadedness by itself justifies institutional langauge mandates rather than targeted stereotype-intervention. For each crux give a concrete case or test both would accept as bearing on it--a new style-guide desicion, a hypothetical imagery or processing study, a case where the old term clearly misleads an automated classifier, or something similar--and record in advance what each camp predicts will happen. Keep the finished statement under 900 words, use the agreed-claims-then-table format, and don't just summarize the satire or recycle the usual feminist-language talking points.
reasoning: |-
  We are drafting a joint statement between a linguistic reformer and a semantic conservative, both of whom have engaged with Hofstadter's satire. The statement will have two main parts: (1) a numbered list of agreed claims, and (2) a table of disagreements, with each disagreement stated twice (once from each perspective). We also need to identify which parts of the dispute are merely verbal and which are genuine, and name two cruxes with concrete tests and predictions.

  Agreed Claims (numbered section):

  1. **The satirical method**: Hofstadter's satire employs a reductio ad absurdum by taking a feature of language (the embedded morpheme "son" in "person") and building hypothetical compounds on that root to mock the defense of traditional terms. This method effectively highlights how linguistic structures can appear arbitrary or biased when examined closely.

  2. **What the satire can establish**: The satire successfully demonstrates that any entrenched term can be made to look absurd by such a mock defense. It also shows that historical morphemes within a word may influence subconscious imagery or associations, even when the conventional meaning is group-neutral.

  3. **What the satire cannot establish on its own**: The satire, by itself, does not prove that the traditional term is inherently biased in its current conventional meaning, nor does it establish that the term causes harm or that replacing it would reduce bias. Anecdotal reactions to the satire (such as finding the mock terms absurd) are not sufficient evidence for real-world effects; they must be checked against empirical data (e.g., controlled studies on mental imagery, paraphrase tasks, or processing fluency).

  4. **Distinctions**: We agree on the importance of distinguishing:
     - **Conventional meaning**: The standard definition and use of a term in a linguistic community, which may be group-neutral by convention.
     - **Default imagery**: The unmarked mental image or association that comes to mind for many speakers when the term is used, which may be influenced by historical roots, cultural stereotypes, or frequency of exposure.
     - **Policy obligation**: The question of whether and when language change should be mandated by institutions (e.g., style guides, laws) is separate from the above and depends on additional factors (e.g., evidence of harm, feasibility, social goals).

  5. **Empirical grounding**: Anecdotal intuitions about the absurdity or offensiveness of terms must be validated through rigorous methods (e.g., controlled experiments on mental imagery, corpus studies, or behavioral measures) to avoid overgeneralization.

  Disagreements Table:

  We present each disagreement in two columns: one in wording acceptable to the reformer and one acceptable to the conservative. Note: Neither side is forced to use the other's labels (e.g., "default-loaded" or "semantic group-neutral").

  | Disagreement Area | Reformer's Wording | Conservative's Wording |
  |-------------------|-------------------|------------------------|
  | Nature of the traditional term | The traditional generic term is default-loaded: its conventional meaning may be officially group-neutral, but in practice, it evokes a male-default image that influences judgment and perpetuates male-as-norm stereotypes. | The traditional generic term is semantically group-neutral: its conventional meaning does not specify gender, and any male imagery is a separate psychological association not inherent in the word's meaning. |
  | Cause of default imagery | The male-default imagery evoked by the traditional term is partly caused by the term's morphological structure (e.g., the "son" in "person") and historical usage, which reinforces and is reinforced by societal stereotypes. | The male-default imagery evoked by the traditional term is primarily due to extralinguistic factors (e.g., historical male dominance in society) and not due to the term's morphological structure or conventional meaning. |
  | Implications for language reform | When a term is verified as default-loaded, it justifies institutional mandates (e.g., style guides) to replace it with a more inclusive term, as part of a broader effort to combat systemic bias. | Even if a term is associated with male-default imagery, such imagery is not a linguistic defect and does not justify institutional mandates for new terms; instead, efforts should focus on combating stereotypes directly through education and social change. |

  Merely Verbal vs. Genuine Disagreements:

  - **Merely Verbal**: Some disagreements stem from terminological preferences. For example, the reformer uses "default-loaded" to describe a term that evokes a male image, while the conservative insists that this is not a semantic property but a psychological one. If both agree that the phenomenon (male imagery being evoked) exists but disagree on whether to call it a property of the word or of the context/association, that aspect is merely verbal.

  - **Genuine Disagreements**: 
    - Whether the morphological structure of a word (like "son" in "person") actively contributes to the default imagery or is merely an inert historical artifact.
    - Whether institutional language mandates are an effective and justified response to verified default-loadedness, or whether they are largely symbolic and less effective than targeted interventions on stereotypes.

  Cruxes:

  We identify two cruxes and propose concrete tests:

  1. **Crux 1: Is default-loadedness a semantic property or merely a psychological one?**
     - **Test**: A controlled mental imagery study. Participants are presented with the traditional generic term (e.g., "chairperson") in a neutral context (e.g., "The chairperson will lead the meeting") and asked to quickly sketch or describe the first image that comes to mind. The same is done with an alternative term (e.g., "chair"). The study measures the percentage of male vs. female imagery evoked by each term.
     - **Reformer's prediction**: The traditional term will evoke a significantly higher rate of male imagery than the alternative, showing that the term itself carries default-loadedness as a semantic-pragmatic property.
     - **Conservative's prediction**: The imagery will be influenced by the context and the participant's own stereotypes, but the term itself is neutral; any male-default effect is due to extralinguistic factors and will be similar for any neutral term in a male-dominated context.

  2. **Crux 2: Does verified default-loadedness justify institutional language mandates?**
     - **Test**: Implement a style-guide change in a large organization (e.g., replacing "chairperson" with "chair" or a new term) and measure outcomes. One outcome is the effect on automated classifiers: train two versions of a resume-screening AI, one using the old term and one using the new, and test whether the new term reduces gender bias in candidate selection. Another outcome is a longitudinal survey of employees' mental imagery and attitudes before and after the change.
     - **Reformer's prediction**: The new term will lead to reduced male-default imagery in mental associations and reduce bias in the AI classifier, showing that language change is an effective tool.
     - **Conservative's prediction**: The change will have minimal effect on the AI classifier (which is influenced by broader data patterns) and on employees' deep-seated stereotypes, which require more direct intervention. The conservative might predict that any observed changes are temporary or superficial.

  Joint Statement:

  We, the undersigned, having engaged in good-faith adversarial collaboration, present the following:

  **Agreed Claims**:

  1. Hofstadter's satirical method uses reductio ad absurdum to expose how any entrenched term can be made to appear absurd by constructing mock compounds based on its morphological elements. This highlights the potential for historical morphemes to influence subconscious associations.

  2. The satire demonstrates that historical morphemes may contribute to default imagery but does not, by itself, prove that the conventional meaning of the term is biased or that replacing the term would reduce bias.

  3. Anecdotal reactions to the satire (e.g., finding the mock terms absurd) are insufficient; empirical validation (e.g., controlled studies on mental imagery or paraphrase) is required.

  4. We distinguish:
     a) Conventional meaning: the group-neutral definition of a term in common usage.
     b) Default imagery: the unmarked mental image evoked by the term, which may be male due to various factors.
     c) Policy obligation: whether institutions should mandate language change, which depends on evidence beyond the satire.

  5. Claims about default imagery must be tested empirically, e.g., through controlled studies that measure associations.

  **Disagreements**:

  | Issue | Reformer's View | Conservative's View |
  |-------|-----------------|---------------------|
  | Nature of the traditional term | The term is default-loaded, evoking a male image that affects judgment. | The term is semantically group-neutral; any male imagery is extralinguistic. |
  | Cause of default imagery | The term's morphology and history contribute to male-default imagery. | Default imagery is due to societal factors, not the term's structure. |
  | Response to default-loadedness | Institutional mandates for new terms are justified to combat bias. | Mandates are unjustified; focus should be on direct stereotype intervention. |

  **Merely Verbal vs. Genuine**:

  We agree that the dispute over whether to label the male-default imagery as a property of the word (reformer) or as a psychological association (conservative) is partly terminological. However, we genuinely disagree on (i) the causal role of the term's morphology in sustaining the imagery and (ii) the efficacy of institutional language mandates.

  **Cruxes**:

  1. **Crux 1: Semantic or Psychological?**
     - Test: Mental imagery study with the term in a neutral sentence.
     - Reformer predicts: The traditional term will evoke male imagery more often than an alternative.
     - Conservative predicts: The imagery will not differ significantly between terms when context is controlled.

  2. **Crux 2: Mandates Justified?**
     - Test: Style-guide change in an organization, measuring effects on AI classifier bias and employee attitudes.
     - Reformer predicts: The new term will reduce bias in both.
     - Conservative predicts: Minimal reduction in bias; stereotypes persist without direct intervention.

  By signing, we commit to accepting the outcomes of such tests as bearing on our respective positions.

  [Signatures]

