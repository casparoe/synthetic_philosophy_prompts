  ### Joint Statement on Linguistic Reform and Semantic Conservatism  
  **Following Adversarial Collaboration on Hofstadter's "Person Paper"**  

  #### Agreed Claims  
  1. **Satirical Method**: The "Person Paper" employs reductio ad absurdum, dismantling a traditional generic term by isolating its morphemes (e.g., "son" in "person") and rebuilding compounds (e.g., "perdaughter") to mock defenses of linguistic tradition. This exposes how *any* entrenched term can be rendered absurd when subjected to literal morphological decomposition.  
  2. **Limits of Satire**: The satire proves that historical morphemes *can* influence intuitive associations, but it cannot, alone:  
     - Establish that such associations *systematically* distort conventional meaning.  
     - Demonstrate real-world harm or justify policy changes without empirical validation.  
     - Disprove the group-neutrality of a term’s conventional definition.  
  3. **Critical Distinctions**:  
     - **Conventional meaning**: The standard, context-invariant definition of a term (e.g., "person" as human, regardless of sex).  
     - **Default imagery**: The unmarked mental image evoked spontaneously (e.g., a male figure for "person"), which may reflect sociohistorical biases rather than semantic content.  
     - **Policy obligation**: Whether institutions *should* mandate language changes depends on evidence beyond linguistic structure, including measurable effects on cognition or equity.  
  4. **Empirical Necessity**: Anecdotal reactions to satire (e.g., "perdaughter feels absurd") must be tested against controlled data, such as:  
     - **Paraphrase tasks**: Do subjects interpret "person" identically to explicitly neutral terms (e.g., "human") in context?  
     - **Mental-imagery studies**: What demographic images arise under timed conditions?  
     - **Processing fluency**: Does the term cause delays or errors in gender-neutral contexts?  

  #### Disagreements  
  Each disagreement is stated twice: first in the reformer’s wording, second in the conservative’s.  

  | Core Issue | Reformer-Acceptable Wording | Conservative-Acceptable Wording |  
  |------------|----------------------------|--------------------------------|  
  | **Term neutrality** | The traditional term is default-loaded: its conventional meaning is formally inclusive, but its dominant mental image is male, which covertly influences judgments. | The traditional term is semantically group-neutral: its conventional meaning is inclusive, and any male imagery stems from external societal biases, not linguistic properties. |  
  | **Locus of imagery** | Default imagery arises partly from the term’s morphological history (e.g., "son"), which reinforces and is reinforced by stereotyping. | Default imagery arises solely from extralinguistic factors (e.g., cultural male dominance); the term’s morphemes are etymological artifacts with no active semantic role. |  
  | **Reform justification** | Verified default-loadedness justifies institutional mandates (e.g., style guides) to preempt biased judgments, as language shapes thought. | Verified default imagery warrants targeted interventions (e.g., education) against stereotypes, not institutional mandates, which are symbolic and ignore root causes. |  
  | **Satire’s implication** | The satire reveals that traditional terms cannot be "pure" descriptors when morphology conflicts with inclusive intent, necessitating change. | The satire reveals only that all terms can be deconstructed absurdly, and meaning is defined by convention, not historical roots. |  

  #### Merely Verbal vs. Genuine Disagreements  
  - **Merely verbal**: Disputes over labels (e.g., "default-loaded" vs. "extralinguistic association") when both agree imagery exists but disagree on whether it is "part of" the term.  
  - **Genuine**:  
    - Whether default imagery is *causally influenced* by a term’s morphology.  
    - Whether institutional mandates are *effective and necessary* to reduce bias, or whether they distract from direct stereotype intervention.  

  #### Cruxes and Tests  
  **Crux 1: Is default-loadedness semantic or psychological?**  
  - **Test**: A controlled imagery study where subjects hear "The person chaired the meeting" and instantly describe the chair’s appearance. Repeat with "The human chaired the meeting" and novel neutral terms. Measure gender attribution frequency and response latency.  
    - **Reformer prediction**: "Person" yields >70% male imagery; latency is shorter than for novel terms, showing cognitive entrenchment.  
    - **Conservative prediction**: Imagery reflects societal roles (e.g., 60% male for both terms); latency identical, proving no unique "loading."  

  **Crux 2: Do mandates combat bias or merely symbolize progress?**  
  - **Test**: A corporation replaces "chairperson" with "chair" in all documents. Pre/post-implementation, measure:  
    - **AI classifier bias**: Feed identical resumes using "chairperson" vs. "chair" to a hiring algorithm; track gender skew in selections.  
    - **Employee surveys**: Assess implicit associations with leadership terms.  
    - **Reformer prediction**: "Chair" reduces AI gender skew by ≥15% and improves survey inclusivity.  
    - **Conservative prediction**: AI skew persists (trained on biased historical data); surveys show no change in stereotypes, proving mandates ineffective without broader reforms.  

  ---  
  **Signed**,  
  [Reformer] and [Conservative]  
