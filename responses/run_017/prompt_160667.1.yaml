prompt: |-
  I've been trying to work out what I actually think about escalation -- when to keep pouring money and time into something that's going badly -- because I run a small software studio and I make these calls all the time, and my gut verdicts don't seem to line up with the rule I hand out to everyone else.

  The line I give my team: everything already spent is gone, ignore it completely, and ask only whether the next dollar buys more than a dollar of value from here. I believe that line. But here is how I actually rule when the cases show up.

  1. We're eight months into a platform migration, maybe 70 percent done, and finishing it will cost less than the new platform is worth to us. Keep going, obviously.
  2. Same migration, except we've just learned the platform we're moving to is being discontinued in eighteen months. Kill it today, even though eight months of work evaporates. My rule agrees here, so far so good.
  3. The dollar auction -- the party game where a one dollar bill is auctioned off and both the top bidder and the runner-up pay their last bid, so the winner gets the dollar and the loser pays for nothing. I'm the top bidder at 95 cents, the other person is at 90. My verdict: I bid a dollar, and I think that's right; handing over 95 cents for nothing feels worse than paying a dollar for a dollar. But here's the part I can't square with my own rule -- I only feel that way if I can make exactly one more bid and then stop. If I can't commit to stopping, I'd rather walk away at 95.
  4. A product line that loses money every month with no route to profit. Shutting it down means laying off two people and dropping three integration partners, and if we ever wanted back in, rebuilding those relationships would cost more than a year of losses. Verdict: keep it alive at minimum cost, indefinitely. That isn't the next dollar buying value. It's the next dollar buying optionality.
  5. A test that's been running six weeks and shows nothing. One more month wouldn't change the product, but it would tell us whether a whole research direction is dead or just slow. Verdict: spend the month. The money buys information, not product.
  6. A friend five years into a PhD she doesn't like, two years from the end, who would use the degree: finish. Same friend, but she wants to open a restaurant and would never use the degree: quit. I'm confident about both, and I think the reason is the credential being a real forward-looking asset, not the five years.
  7. Two verdicts that feel different to me and I can't say why. (a) I inherit a team, their flagship project is a dud, I kill it inside a week. (b) If I had started that same project myself, I suspect I'd want to give it one more quarter. I'm not proud of that difference. Is the right principle different depending on who made the original call?
  8. Something I've noticed in myself with money: I'll sit on a losing position for months, but once I've sold it I won't buy it back at the same price, even though the exposure is identical. I'm fairly sure that's just a bug in me and not a principle.
  9. Auction for a house I love: I blow past the ceiling I set for myself, because the other bidder showed me how much I actually want it. Verdict: fine, keep bidding. But if I were raising my bid mainly because I'd already spent four grand on surveys and legal fees, that's the fallacy. Same outward behavior, different reasons, opposite verdicts -- and my stated rule only looks at the forward-looking part, so it can't see the difference at all.

  So: is there one principle that gets all of these, or nearly all? I'd rather have two or three stated precisely, each with the case that motivates its clause, than one vague thing that technically covers everything. Tell me which of my verdicts a given principle forces me to drop -- I'm guessing 3 and 7b, though maybe 4 and 5 aren't really escalation at all and shouldn't be on the same list.

  Then the live decisions, which aren't in my list. One: a project where the next increment is cheap, the thing is probably dead, and the team's morale depends on not having been wrong. Two: a feature we publicly promised a client by December and now think was the wrong thing to build, where backing out is possible but expensive for the relationship. What does the principle say about each?

  And the question I actually care about most: if sunk money shouldn't matter but I know it will matter to me, is it rational to tie my own hands? We now require a written 'continue' memo signed by someone who wasn't in the kickoff before anything passes its second checkpoint, and I've thought about literally paying a colleague two hundred dollars for a veto over my own decision to continue. Does any sane principle endorse that, or does it just admit the principle is really about decision procedures rather than about what to do?

  If you want to name cases that would separate the candidate rules: a dollar auction where I'm already at three dollars and the other guy is at 2.95 -- my cap-the-loss-with-one-more-bid instinct says escalate, but does it, and at what point does that stop being sane? And a sealed version of case 3 where each of us writes down one number instead of bidding in the open, with the top two paying.
reasoning: |-
  Okay, let's tackle this user's complex question about escalation decisions. The user runs a small software studio and is struggling to reconcile their stated principle (ignore sunk costs, only consider future value) with their intuitive judgments across various scenarios. 

  First, I need to understand why this matters so much. The user isn't just theorizing - they make these calls daily. There's clear frustration when they say "my gut verdicts don't seem to line up." This is about real money, real teams, and their credibility as a leader. The examples show sophisticated self-awareness - especially noticing how ownership bias (case 7) and loss aversion (case 8) distort their decisions.

  Hmm... the core tension emerges in cases where sunk costs shouldn't matter but psychologically do (like the dollar auction), versus cases where the "sunk cost fallacy" accusation oversimplifies (like buying optionality in case 4). The user's smart enough to spot this - they note their rule "can't see the difference" in case 9 between bidding more due to new information versus due to past expenses.

  What's really illuminating is their proposed solution: paying a colleague for veto power. That reveals they understand this isn't just about finding the "right" rule, but about designing decision processes that compensate for cognitive biases. The unspoken question is: "Am I weak for needing this, or is this actually rational?"

  For the dollar auction dilemma... economically, bidding $1 when at $0.95 is rational if you can stop there. But the user's instinct to walk away if they can't commit exposes the real trap: escalation dynamics. This connects to case 3's sealed-bid version - without seeing bids, you'd likely bid less because the competition effect disappears. 

  On the PhD case... their distinction between "would use degree" versus "would not" shows they intuitively grasp opportunity cost versus sunk cost. The five years only matter if the credential has future value. This subtly undermines their stated rule - sometimes past effort does indicate future value (like in research where six weeks of null results might mean you're close to a breakthrough).

  The house auction case is fascinating. When they bid higher because competitors reveal true value, that's rational information-updating. But doing it because of sunk survey costs would be irrational. Their rule fails here because it only asks "what will this dollar buy?" not "why do I suddenly think it's worth more?"

  For the live decisions... the morale-dependent project is tricky. The "next dollar" might buy team cohesion, not product value. But is that enabling denial? And the promised feature - backing out might preserve long-term trust despite short-term cost. This isn't escalation; it's reputation management.

  Ultimately, they need principles that distinguish between:
  - Rational investments in information/options (case 4-5)
  - Emotionally-driven completion bias (case 7b)
  - Game-theoretic traps (dollar auction)
  - Genuine Bayesian updating (house auction)

  Their hand-tying idea is brilliant - it treats decision-making as a meta-game against one's own biases. A principle could be: "When predictable irrationality distorts valuation, delegate the exit decision." That's not failure; it's advanced rationality.
answer: |-
  Your struggle is profound because **sunk cost fallacy avoidance isn't the whole story**. You've identified cases where rational escalation *requires* considering factors beyond immediate ROI. Here's a framework with three precise principles, their motivations, and consequences for your verdicts:

  ---

  ### **The Three Principles**
  1. **Marginal Net Value (MNV)**  
     *"Spend the next dollar only if it buys >$1 of future value (revenue, cost savings, or risk reduction), ignoring all past costs."*  
     *Motivation*: Your platform migration (Case 1) and killing the discontinued migration (Case 2). Pure sunk cost avoidance.  
     *Forces you to drop*: Case 3 (dollar auction), Case 4 (keeping a zombie product), Case 5 (continuing a test for information), Case 9 (bidding due to revealed preference).

  2. **Strategic Option Value (SOV)**  
     *"Escalate if the next dollar secures valuable *options* (e.g., learning, partnerships, flexibility) worth >$1 in *future decision rights*, even if direct ROI is negative."*  
     *Motivation*: Your zombie product (Case 4) and research test (Case 5). Spending to preserve optionality or information.  
     *Forces you to drop*: Case 3 (dollar auction), Case 7b (giving your own project "one more quarter" without new options).

  3. **Psychological Commitment Limit (PCL)**  
     *"When escalation traps exist (e.g., auctions, emotional ownership), pre-commit to hard exit criteria *before* starting, and delegate enforcement."*  
     *Motivation*: Dollar auction (Case 3), owning vs. inheriting a project (Case 7), and your money bug (Case 8). Addresses competitive/emotional escalation.  
     *Forces you to drop*: Case 9 (bidding due to revealed preference without pre-commitment).

  ---

  ### **How This Resolves Your Cases**
  | Case | Your Verdict | Framework Verdict | Reason |
  |------|-------------|-------------------|--------|
  | 1 & 2 | Keep / Kill | Keep / Kill | MNV alone suffices. |
  | 3 | Bid $1 if you can stop | **Walk away** | MNV says bid $1 (get $1 for $1), but PCL forbids entering without a bid cap. |
  | 4 | Keep for optionality | Keep | SOV: Paying for partner relationships as an option. |
  | 5 | Spend for information | Spend | SOV: Information unlocks future decisions. |
  | 6 | Quit if useless | Quit if useless | MNV: Only future value of credential matters. |
  | 7a | Kill inherited project | Kill | MNV: No future value. |
  | 7b | Extend if yours | **Kill** | PCL: Ownership bias distorts MNV; delegate kill decisions. |
  | 8 | "Bug" | PCL: Delegate exits | Cognitive bias requires process fixes. |
  | 9 | Bid more if new info | Bid if revealed value > cap | MNV + PCL: New info updates value, but only if below pre-set cap. |

  **Sacrifices**: Your dollar auction bid (MNV says bid, PCL forbids) and self-owned project extension (PCL forces kill). These are *features*: PCL overrules "rational" bids in traps and kills ownership-biased projects.

  ---

  ### **Live Decisions: Applying the Framework**
  **1. Morale-dependent "dead" project:**  
  - *MNV*: Kill (no future value).  
  - *SOV*: Is the "cheap increment" buying team cohesion? If yes, spend only if cohesion prevents >$X in future turnover.  
  - *PCL*: If morale depends on *denial*, delegate the kill decision.  
  - **Verdict**: **Kill**. SOV only applies if cohesion has measurable future value (e.g., retaining key talent). "Not being wrong" is a sunk cost fallacy.

  **2. Expensive feature backtrack:**  
  - *MNV*: Back out if future support costs > relationship cost.  
  - *SOV*: Is the relationship an option worth preserving? If the client is strategic, absorb the cost.  
  - *PCL*: Pre-commit to "kill criteria" for promised features (e.g., "if usability tests fail").  
  - **Verdict**: **Back out** *unless* the client is crucial to future options (SOV). "Expensive relationship cost" is a future cost, not a sunk cost — include it in MNV.

  ---

  ### **Hand-Tying as Rational Strategy**
  **Yes, it’s rational.** PCL explicitly endorses this:  
  - When you *know* you’ll violate MNV/SOV due to bias (ownership, auction fever), delegate exit authority.  
  - Paying $200 for a veto is cheap if it prevents a $50k escalation trap.  
  - **Principle**: *"Incentivize impartial enforcement of pre-commitment rules when cognitive traps are predictable."*  
  - Your "continue memo" policy is PCL in action — it doesn’t replace MNV/SOV; it protects them.

  ---

  ### **Test Cases**
  **1. Dollar auction at $3.00 (you) vs. $2.95 (rival):**  
  - MNV: Bid $3.05 to "save" $2.95 loss → irrational (you lose $2.05 net).  
  - PCL: **Never enter without a max bid**. At $3.00, walk away.  
  - *Sanity limit*: Escalation is insane after $0.50 — the only winning move is not to play.  

  **2. Sealed-bid dollar auction:**  
  - PCL: Set max bid *before* knowing your valuation (e.g., $0.30).  
  - Without bid visibility, escalation temptation drops → you’d likely bid lower, proving the bias is driven by competition, not value.

  ---

  ### **The Core Insight**
  Your "gut" distinguishes between:  
  - **Value-creating escalation** (information, options, updated valuations).  
  - **Fallacy-driven escalation** (sunk costs, ownership, competition).  

  **MNV** handles pure value decisions. **SOV** justifies investing in uncertainty. **PCL** combats irrationality in high-bias contexts. Drop MNV alone — it’s necessary but insufficient. Use all three, and **delegate PCL enforcement when you’re the biased party**. That’s not weakness; it’s metacognition.
