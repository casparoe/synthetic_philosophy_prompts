prompt: |-
  Youre a philosopher of language who also knows translation theory inside out. Please think it through carefully instead of giving me the first plausible story, and start by brainstorming privately, as a short list, four or five different things a practice like this might be presupposing before you settle on one.

  Personal context: my grandmother died last month and I'm putting together the bilingual order of service. There's a short French lullaby she used to sing to my dad, and I want to print the original next to an English version that can actually be sung to the same tune. So I made what I call a form-locked version: same syllable count per line, same rhyme scheme, same stress pattern, and I even tried to keep the same vowel sounds on the long notes. My sister says that definately isn't a translation, it's a new poem wearing the old one's clothes. I said that's just what a translated hymn is, and then couldn't defend it.

  Here's the practice I mean: congregations everywhere sing carols and hymns in translations that cheerfully drop imagery and add new imagery in order to fit the metre and the tune, and everyone still treats the result as the same carol, same number in the hymnal, same slot in the service. But in that very same service the scripture reading has to come from an approved translation, and a loose paraphrase there would not be allowed.

  What view of what a poem or song is, and of what translation is for, does the singing practice presuppose? Does it strictly presuppose that form (tune, metre, rhyme, ritual slot) can carry a text's identity across languages while the propositional content drifts, or would a content-first view license the practice just as well? Are the hymn practice and the reading practice actually inconsistent, and what would a congregation have to change if it decided content was the thing and form was only packaging? And on that basis, is my sister right about my version?

  Finish with one last line, nothing after it, in this exact form: \answer{short phrase naming the one claim the practice strictly presupposes}, or \answer{nothing} if it strictly presupposes nothing. Keep the phrase under ten words.
