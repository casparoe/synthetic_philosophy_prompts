  Sympathy mechanics: Definitely cognitive for Smith. He describes spectators making imaginative leaps to understand situations, not just mirroring emotions. Their "emotional contagion" concern shows they're taking the metaphor too literally. 

  I should emphasize that Smith's spectator is fundamentally about perspective-taking, not calculation. The user might benefit from thinking about the spectator as their own conscience refined by social interaction, not an external algorithm. Their modeling impulse is admirable but may need tempering with Smith's emphasis on human judgment. 

  The priority seems to be preserving Smith's insights while satisfying their formalization urge. Maybe suggest a hybrid: use Bayesian tools for consequence mapping but keep the final approval as a holistic judgment. Their "integrating over probabilities" approach could work if the utility function captures relational values rather than utility aggregation. 

