  First probability issue: Smith's spectator isn't computational but human. The "perfectly informed" part suggests the spectator would know all relevant facts and context, but through human understanding, not just data. Their Bayesian framing is clever but might need adjustment - perhaps the spectator uses what philosophers call "full information" rather than probabilities. 

