  ### **Implicit Principle in Precedents**  
  The Panel operates on a **modified best-system account (BSA) with strong counterfactual resilience requirements**, heavily weighted toward *invariance under counterfactual variation*.  

  #### **Key Features from Precedents**:  
  1. **Rejection of spatiotemporal parochialism**  
     (e.g., dated/gold-sphere claims).  
  2. **Demand for *modal force*** over mere generality  
     (e.g., Kepler’s law rejected as derivative; cell division registered as domain-relative law due to *biological necessity*).  
