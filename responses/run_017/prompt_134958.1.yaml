  The core tension is between respecting individual consent and maintaining institutional preservation mandates. The founding deed explicitly prohibits destruction, which conflicts with the destruction clauses signed by 214 narrators. Counsel has advised that the deed controls, making these clauses void. However, there's a moral argument that honoring these agreements is essential, as they were the condition under which survivors shared their stories. Some testimonies are historically crucial, having been used in prosecutions.

