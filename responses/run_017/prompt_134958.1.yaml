  The AI pilot presents different challenges. While technology could make testimonies more accessible as living witnesses disappear, the ethical concerns about "putting words in the dead's mouths" are significant. The proposal to synthesize voices and faces could be seen as fabricating speakers rather than extending testimonies. I think this crosses a line and shouldn't be approved, though perhaps future proposals with strict limitations could be considered.

