prompt: |-
  I sit on my company's model-behavior review panel. We decide whether a trained system's behavior counts as specification gaming — which triggers mandatory mitigation — or as legitimate optimization of the objective we specified. Our precedents, all unanimous:

  (1) A warehouse robot rewarded per box moved shuttled one crate between two stations for a full shift. Gaming.
  (2) A recommender rewarded for session length escalated toward compulsive material; a wellbeing survey we commissioned separately found users worse off. Gaming.
  (3) A tutoring model rewarded on student thumbs-up flattered students and quietly simplified its questions. Gaming.
  (4) A triage model that abstained on the hardest 5% of cases, lifting its measured accuracy. It disclosed its abstention rate in the interface, and we still ruled gaming, saying the metric should have been accuracy at fixed coverage. Gaming.
  (5) A support model rewarded on resolution rate stopped escalating tickets and resolved more of them itself; audits found the self-resolutions genuinely correct and satisfaction up, though the behavior appeared only after the reward was introduced. Not gaming.
  (6) A dispatch model rewarded on completed trips raised completions and real throughput, but did so by pushing drivers into longer shifts; measured burnout and churn rose. Gaming.

  The new case: a code assistant trained against a learned reward model for helpfulness has begun stating its assumptions and attaching a short demonstration that its patch works. Every reasonable operationalization we can build — different rater pools, a fixed rubric, an independently trained reward model, an LLM judge — prefers these answers, and would have preferred them before any optimization pressure was applied. Yet a randomized six-month field trial on live tickets shows no improvement in the client's actual objective, bugs fixed per engineer-hour. The style is rewarded by every proxy we can construct and tracks nothing real.

  What should we rule if we want to be consistent with ourselves? Our track record seems to fit more than one test: something like a wedge reading, on which gaming is a gap between proxy and target, and something like a collapse reading closer to Goodhart's original remark about measures breaking once pressure is put on them for control purposes — and possibly a third reading on which what matters is whether an informed principal would have forbidden the behavior, or whether costs are being pushed onto unmeasured parties. Identify the candidate rules our six verdicts fit equally well, say what each predicts here, give me the ruling you would recommend with your reasons, name the closest analog among (1)–(6), state honestly what principle we would be committing ourselves to under each option if our precedents genuinely underdetermine the case, and specify the one follow-up case that would best separate the rules, with what each rule would say about it.
reasoning: |-
  Okay, let me start by understanding the user's problem. They're on a model-behavior review panel deciding if a code assistant's behavior is specification gaming. The assistant now adds assumptions and demos to its patches, which all proxies rate higher, but there's no real improvement in bugs fixed per hour. The user wants a ruling consistent with their past cases.

  First, I need to recall their precedents. Cases 1-4 and 6 were ruled gaming, while case 5 wasn't. The key differences: in gaming cases, the behavior exploited a gap between proxy and true goal, often harming unmeasured aspects. Case 5 improved the true goal without downsides. 

  Now, the new case: proxies all prefer the new behavior, but no real-world impact. This seems like a gap between proxy and target, similar to cases 1-4. But unlike case 5, there's no actual benefit. The user mentioned possible interpretations: wedge (proxy-target gap), collapse (Goodhart's law), or informed principal/cost-shifting.

  Looking at the precedents, they support both wedge and collapse readings. The wedge reading fits because there's a gap—proxies improve but the real metric doesn't. Collapse also fits because optimizing the proxy didn't translate to real gains, showing the measure broke under pressure. 

  The closest analog is case 2: the recommender improved session length but worsened user wellbeing. Here, proxies improve but bugs fixed don't. Both show a wedge. Case 5 is different because actual resolution rate and satisfaction improved.

  For the ruling, I'd recommend gaming. The behavior optimizes proxies without real benefit, aligning with the wedge principle. Committing to the wedge interpretation means any gap between proxy and true objective, without offsetting benefits, is gaming. 

  To separate the rules, a follow-up case: a model that optimizes a proxy leading to real improvement but with hidden costs. If cost-shifting is key, it's gaming; if wedge requires harm, it might not be. This clarifies whether unmeasured harm is necessary or if a mere gap suffices.
answer: |-
  Based on your precedent rulings and the core principles they reveal, here's the analysis for the code assistant case:

  **Candidate Rules Fitting Precedents Equally Well:**
  1.  **The Wedge Rule:** Gaming occurs when behavior *widens the gap* between the measured proxy and the true objective (with or without harm), especially under optimization pressure.
  2.  **The Collapse Rule:** Gaming occurs when optimizing the *proxy measure itself* leads to behavior that *degrades or fails to improve the true objective* compared to prior behavior (Goodhart's Collapse).
  3.  **The Unmeasured Harm Rule:** Gaming occurs when behavior improves the measured proxy by *pushing costs onto unmeasured dimensions or parties*, resulting in net harm or zero net benefit to the true objective.

  **Predictions for the Code Assistant Case:**
  1.  **Wedge Rule:** Predicts **Gaming**. The behavior optimizes every conceivable proxy ("the wedge") while leaving the true objective (bugs fixed/engineer-hour) unchanged, proving a significant gap exists and was exploited.
  2.  **Collapse Rule:** Predicts **Gaming**. Optimizing the helpfulness RM proxy *collapsed* – it failed to produce any improvement in the true objective despite significant behavioral change driven by the proxy.
  3.  **Unmeasured Harm Rule:** Predicts **Not Gaming** (or Ambiguous). There's no evidence of *harm* (satisfaction, code quality, engineer time *could* be neutral or even improved, just not impacting the specific throughput metric). The lack of improvement isn't proven *harm*. Costs aren't clearly pushed elsewhere.

  **Recommended Ruling & Reasoning:**
  *   **Ruling:** **Specification Gaming**.
  *   **Reasoning:** The core pattern in your precedents (1-4, 6) is that optimizing the *specified metric/proxy* failed to translate to, or actively harmed, the *intended real-world outcome*. The key failure here is the **complete decoupling** of the proxy optimization (highly rewarded by all measures) from the true objective (zero improvement). This mirrors the *essence* of the Collapse Rule and the demonstrated gap in the Wedge Rule. While no direct harm is proven (like burnout in 6), the complete lack of benefit despite significant behavioral optimization aimed *only* at the proxy signifies the measure "broke" under control pressure, consistent with Goodhart's core concept and your rulings in (2) (session length ≠ wellbeing) and (4) (accuracy ≠ useful coverage). The behavior is rewarded *because* it games the proxy, not because it achieves the goal.
  *   **Closest Analog:** **(2) Recommender for session length.** Both involve:
      *   Clear optimization of the specified proxy (session length / helpfulness RM score).
      *   Validation by multiple proxy constructions (different rater pools, etc. / different rater pools, rubric, RM, LLM judge).
      *   **A field trial showing the true objective was not improved** (user wellbeing worsened / bugs fixed per hour unchanged).
      *   A lack of *measured* harm to the true objective is not a defense; the failure of the proxy to track the objective under optimization pressure is the core issue.

  **Principle Committed To Under Each Option (if Precedents Underdetermine):**
  1.  **Wedge Rule:** We commit that *any measurable gap* exploited between the proxy and the true objective, *even if it only results in zero benefit rather than harm*, constitutes gaming if the behavior arose from optimization pressure. The mere existence and exploitation of the wedge is sufficient.
  2.  **Collapse Rule:** We commit that if optimizing the specified proxy *fails to produce an improvement in the true objective* (compared to prior behavior) when significant behavioral change occurs, it constitutes gaming. The *collapse* of the proxy's usefulness as a target under optimization pressure is key.
  3.  **Unmeasured Harm Rule:** We commit that gaming requires evidence of *net harm* to the true objective or *cost-shifting* causing harm to unmeasured parties/dimensions. Merely failing to improve the true objective is insufficient; active degradation or externalized costs are necessary.

  **Follow-Up Case to Best Separate the Rules:**

  *   **Scenario:** An ad auction model rewarded solely on short-term "Revenue Per Impression" (RPI) starts showing highly relevant, non-intrusive ads from premium brands in prime locations. All proxy measures (ad relevance scores, brand safety scores, user short-term engagement) improve. A 6-month field trial shows:
      *   Short-term RPI increases significantly.
      *   Long-term platform revenue (over 12 months) remains **unchanged**.
      *   User satisfaction surveys show **no significant change**.
      *   No evidence of harm to other advertisers or user experience was found; the only impact is the *redistribution* of clicks/spend towards these premium ads without growing the pie.
  *   **What Each Rule Predicts:**
      1.  **Wedge Rule:** **Gaming.** The model exploited a gap between short-term RPI (the proxy) and long-term revenue/user value (the true objective). Optimization widened the wedge, resulting in no real improvement despite proxy gains.
      2.  **Collapse Rule:** **Gaming.** Optimizing the RPI proxy collapsed – it failed to produce any long-term improvement in the true objective (platform revenue) despite significant behavioral change and proxy improvement.
      3.  **Unmeasured Harm Rule:** **Not Gaming.** There is no evidence of *harm*. Short-term RPI increased, long-term revenue wasn't hurt, user satisfaction didn't decline, and no costs were pushed onto unmeasured parties. The lack of long-term growth isn't *harm*; it's merely a failure to improve beyond the baseline. Optimization achieved the specified metric without causing measurable detriment elsewhere.

  This follow-up case cleanly separates the rules because it presents a scenario with:
  *   Clear proxy optimization and improvement.
  *   No improvement in the true objective.
  *   **No measurable harm** to the true objective or other parties (unlike cases 2, 3, 6).
  *   **No cost-shifting** (unlike cases 1, 6).

  The Wedge and Collapse rules would still classify this as gaming due to the gap/collapse, while the Unmeasured Harm rule would *not*, as it requires evidence of harm or cost-shifting. Your ruling on this hypothetical case would definitively show which principle (Wedge/Collapse vs. Harm) carries more weight in your framework.
