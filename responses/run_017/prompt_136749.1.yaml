answer: |-
  ### **Dutch Book Game: Setup & Materials**
  - **Materials**: Poker chips (assign $1 value each), index cards, deck of cards (coin flips), 2 opaque bags (Bag A: 5 red/5 blue chips; Bag B: 7 orange/3 green chips), whiteboard for tracking points.
  - **Setup**: Move chairs into a circle. Hand each player 10 chips. Post betting rules:  
    > *"State a fair price (in chips) to buy OR sell a bet paying $1 if event X occurs. Bookie (you) may force you to buy at your stated price or sell at 1–price."*  

  ---

  ### **Game Rules & Payoffs**  
  1. **Synchronic Round (25 min)**:  
     - **Bet 1**: "Pay $1 if next card is **Heads**." Players write buy/sell price on index card.  
     - **Bet 2**: "Pay $1 if next card is **Tails**." Repeat.  
     - *Exploit*: If player’s prices sum to ≠$1 (e.g., Heads $0.60, Tails $0.50), bookie forces them to:  
       - **Sell Bet 1** at $0.60 + **Buy Bet 2** at $0.50 → **Net loss $0.10 regardless of outcome**.  
     - Flip card; adjust chip counts.  

  2. **Diachronic Round (30 min)**:  
     - **Stage 1**: "Pay $1 if Bag A has **≥6 red chips**." Players price bet.  
     - **Evidence**: Reveal Bag A has 5 red/5 blue. Announce: *"If this evidence (E) occurs, how will you update P(≥6 red)?"*  
     - Players write new posterior (e.g., intuitive errors: set to P(E|H)=0.5, or subtract 0.2 from prior).  
     - **Stage 2**: *Conditional bet*: "If E occurs, pay $1 if ≥6 red." Players price using their rule.  
     - *Exploit non-conditionalizers*: Bookie pairs:  
       - **Sell Stage 1 bet** at prior price + **Buy Stage 2 bet** at posterior price.  
       - *Loss example*: Prior $0.7 → Posterior $0.5 (after E). If ≥6 red false: Win $0.7 (sell) - Lose $0.5 (buy) = **+$0.2**.  
         If true: Lose $0.3 (sell) + Win $0.5 (buy) = **+$0.2**. But E occurred, so **always pay $0.20**.  

  3. **Final Round: Bid-Ask Defense (15 min)**:  
     - **Ambiguous Bet**: "Pay $1 if Bag B has **≥6 orange chips**."  
     - Players state **two prices**: buy price (e.g., $0.4) and sell price (e.g., $0.6).  
     - Bookie attempts to Dutch book → Fails.  
       - *Example*: Can’t force sell at $0.4 (they only sell ≥$0.6) or buy at $0.6 (they only buy ≤$0.4).  

  ---

  ### **Timeline (75 min total)**  
  | **Time** | **Activity** |  
  |----------|-------------|  
  | 0-5      | Explain rules, distribute chips |  
  | 5-30     | Synchronic round (flip card → settle chips) |  
  | 30-60    | Diachronic round (reveal evidence → settle) |  
  | 60-75    | Final round → Debrief |  

  ---

  ### **Debrief Map**  
  - **Synchronic → Incoherent probabilities**: "Your prices for H/T created arbitrage. That’s the synchronic Dutch book."  
  - **Diachronic → Update rules**: "If your revision clashed with conditionalization, evidence-triggered bets bled chips."  
  - **Final → Coherence limits**: "Bid-ask spreads avoid sure loss! Dutch books require *one* price per proposition."  

  ---

  ### **Predictable Hiccups & Fixes**  
  1. **"I’ll be the bookie!"**: Redirect: "Everyone bets; *I* play bookie to enforce rules. Your goal is to avoid exploitation."  
  2. **"Betting is unethical"**: Use their prices hypothetically on the board; they still see the loss.  
  3. **Overly precise prices**: Encourage decimals (e.g., $0.55) to expose incoherence.  

  ---

  ### **What the Game Can’t Teach (Say This!)**  
  > *"This shows that incoherent preferences* guarantee *exploitation. But it doesn’t prove you* should *avoid it—that requires the ‘money pump’ argument (losing chips feels bad, right?). Also: real agents might rationally use bid-ask spreads to avoid transaction costs!"*  

  Total words: 798. Run it cold—the nausea sells itself.
