  We are in the context of a small business lending committee. The committee reviews loan applications for small businesses. The target case is a loan application from a "Mobile Artisanal Coffee Bar" — a customized van that sells high-end coffee at events and busy urban locations. The business model combines elements of food trucks, coffee shops, and event-based retail. The committee must decide whether to approve the loan, and they are trying to estimate the probability that the business will repay the loan (i.e., succeed).

  Known statistics from the committee's records:

  1. The base rate for all small business loans (all types) in the city over the past 5 years: 70% repayment rate (so 30% default). This class is broad and includes many types of businesses (restaurants, retail stores, service providers, etc.).

  2. The base rate for food-related mobile businesses (food trucks, ice cream trucks, etc.): 60% repayment rate. This class is narrower and includes businesses that operate from a vehicle and sell food.

  3. The base rate for coffee shops (brick-and-mortar): 80% repayment rate.

  4. The base rate for businesses that operate primarily at events (like craft fairs, festivals, etc.): 50% repayment rate.

  The target business has three features: it is mobile (like a food truck), it sells coffee (like a coffee shop), and it focuses on events (like event-based retail). However, there is no exact precedent for a business that combines all three. The committee has records of:

  - Food trucks (which are mobile and food-related, but not specifically coffee and not necessarily event-focused) -> 60% repayment.
  - Brick-and-mortar coffee shops (which sell coffee but are not mobile and not primarily event-based) -> 80% repayment.
  - Event-based retail (like craft vendors at fairs, which are event-focused but not mobile in the same way and not selling coffee) -> 50% repayment.

  But note: there are no records of a business that is all three: mobile, coffee-selling, and event-focused.

  Now, the committee members:

  - Member A (broad class advocate): "We should use the base rate for all small businesses: 70%. We don't have enough data on the specific combination, so we go broad. The broad class has reliable statistics and is the most robust."

  - Member B (narrow class advocate): "We should use the base rate for food-related mobile businesses: 60%. That's the narrowest class for which we have reliable data. The target is a mobile food business, so that's the most similar. Including non-mobile businesses or non-food businesses would mix in irrelevant factors."

  - Member C (specific feature advocate): "But the event focus is critical! Event-based businesses have a much lower success rate (50%). So we should use the base rate for event-based businesses because that feature is the most important."

  - Member D (homogeneous class advocate): "We need a class that is homogeneous with respect to the factors that matter. The target is a coffee business, and coffee shops have a high repayment rate (80%). So we should use that."

  But note: the problem is that each class is natural (spec 3), but each misses some key feature:

  - The broad class (all small businesses) includes many that are not mobile, not food, and not event-based. It is heterogeneous.

  - The food-related mobile class (60%) includes taco trucks, ice cream trucks, etc., but not coffee-specific and not necessarily event-focused. The target is event-focused, which is a known risk factor.

  - The coffee shop class (80%) includes only brick-and-mortar, which are stable but not mobile and not event-based. Mobility and event focus are known to change the risk.

  - The event-based class (50%) includes craft vendors and non-food items, but the target is food (coffee) and mobile. So it might not be exactly comparable.

  The target case has a novel combination of features. There is no class that exactly matches the target and has reliable statistics. The two rules:

  Rule 1 (textbook): Use the narrowest class for which reliable statistics exist. The narrowest class with reliable data might be the food-related mobile businesses (which has 100+ cases) at 60%. But note, the event-based class also has reliable data (say 80+ cases) at 50%. So which is the narrowest? If we require that the class include the target's features, then we have no class that includes all three. So we must choose a class that includes at least one feature. But then which feature?

  Rule 2 (homogeneous): Use the widest homogeneous class. But what is homogeneous? The committee might agree that mobility and event focus are risk factors, so a homogeneous class would have to hold constant the factors that matter. But they don't agree on what matters.

  Now, the base rates are known exactly (spec 1). The target has no exact precedent (spec 2). The classes are natural: all small businesses, food-related mobile, coffee shops, event-based (spec 3). The numbers:

  - Broad class (all small businesses): 70% repayment -> suggests approve (if threshold is 65%)

  - Food-related mobile: 60% repayment -> borderline (if threshold is 65%, then reject)

  - Coffee shops: 80% -> approve

  - Event-based: 50% -> reject

  The decision threshold: let's say the committee requires at least a 65% chance of repayment to approve. So:

  - Using all small businesses: 70% -> approve

  - Using food-related mobile: 60% -> reject

  - Using coffee shops: 80% -> approve

  - Using event-based: 50% -> reject

  Now, the Bayesian version: 

  We can set up a model with features. Let the features be:

  - F1: Mobile (yes/no)

  - F2: Sells coffee (yes/no)

  - F3: Event-focused (yes/no)

  But we don't have data on every combination. We have:

  - Mobile and food (but not necessarily coffee or event): 60%

  - Not mobile, sells coffee (brick-and-mortar coffee shops): 80%

  - Event-focused (regardless of mobile or coffee): 50%

  - All businesses: 70%

  In a Bayesian model, we might use a logistic regression or a naive Bayes model. But we must specify the prior over the parameters and the structure.

  The problem reappears in the Bayesian approach in two places:

  1. The choice of which features to include in the model. If we include only one feature (say, mobile vs. not), then we ignore the event focus. But if we include all three, we have no data for the combination (1,1,1). So we must make assumptions about how the features interact.

  2. The prior over the parameters (especially the interaction terms). Without data on the combination, the posterior will be sensitive to the prior on the three-way interaction.

  For example, in a linear model for the log-odds:

  logit(p) = beta0 + beta1*F1 + beta2*F2 + beta3*F3 + ... (and interactions)

  But we don't have data for the cell (F1=1, F2=1, F3=1). So the estimate for that cell will depend heavily on the prior for the interaction terms.

  A committee member who believes that the event focus is the dominant factor will set a prior that makes beta3 very negative and the interactions negligible. Then the prediction would be close to the event-based rate (50%). A member who believes that the coffee aspect is protective will set a prior that makes beta2 positive and might downplay the event factor. Then the prediction might be closer to 60% or 80%.

  So the Bayesian approach does not dissolve the problem. It pushes the disagreement to the prior and the model structure.

  Now, we must meet the specs:

  Spec 1: Base rates known exactly. We have exact numbers: 70%, 60%, 80%, 50% from the records.

  Spec 2: No exact precedent. The combination (mobile, coffee, event) is new.

  Spec 3: Classes are natural: all small businesses, food-related mobile, coffee shops, event-based. No gerrymandering.

  Spec 4: Bayesian shrug: The problem reappears in the choice of model features and the priors on interactions.

  Which rule handles it best?

  I argue that the "homogeneous class" rule is the best, but it requires domain knowledge to define what homogeneous means. In this case, we might look for the class that shares the most relevant risk factors. The committee should identify the factors that have the strongest impact on repayment. Suppose they agree that mobility is a risk factor (because of instability) and event focus is a risk factor (because of irregular income). Then the target has two risk factors. The event-based class (50%) might be the best because it shares the event focus, which is a strong risk factor. But the mobile food class (60%) shares the mobility. However, note that the event-based class includes non-mobile businesses, so it might not be homogeneous with respect to mobility.

  Alternatively, we might use a weighted average based on similarity. But that is not a classical rule.

  The honest answer might be that the probability is underdetermined. But for the committee, they must make a decision.

  I propose a practical solution: use the class that is the most similar in the feature that the committee agrees is the most important. In this case, the committee might agree that the event focus is the most critical factor because it leads to irregular income, which is a major risk. Therefore, they should use the event-based class (50%) and reject the loan.

  But note: the coffee aspect might be a positive factor. However, without data on event-based coffee businesses, we cannot say if coffee mitigates the event risk. So we default to the event-based rate.

  The single feature doing the real work: the event focus. It is the factor that lowers the success rate the most (from 70% to 50%). If we delete the event focus, then the business is just a mobile coffee van, which might be compared to food trucks (60%) or coffee shops (80%). Without the event focus, the committee might then use the food truck class (60%) because of mobility.

  What would a defender of the broad class rule say? They might argue that the broad class is the most reliable and that the specific features might cancel out. They might also point out that the event-based class includes non-food businesses, which might be riskier than food, so 50% is too pessimistic for a food business at events.

  Which rule comes out worst? The broad class rule (70%) is too optimistic and ignores the known risk factors. A defender might say: "We don't know if the event focus is as bad for coffee as for crafts, so we shouldn't assume the worst."

  I am least confident about whether the Bayesian approach can be implemented in a way that doesn't require arbitrary priors. Also, the choice of which feature is the most important is subjective.

  But in the end, I side with the homogeneous class rule, interpreted as the class that is homogeneous with respect to the dominant risk factor. Here, event focus is the dominant risk factor, so we use the event-based class.

  So the verdict: reject the loan because the event-based repayment rate is 50% < 65%.

  Case summary:

  Target: A mobile artisanal coffee bar that focuses on events.

  Candidate classes and rates:

  - All small businesses: 70%

  - Food-related mobile businesses (food trucks, etc.): 60%

  - Coffee shops (brick-and-mortar): 80%

  - Event-based businesses: 50%

  Rules:

  - Narrowest class with reliable data: if we take food-related mobile (narrower than all small businesses and we have data) -> 60% -> reject.

  - Homogeneous class: if we take event-based (because event focus is the key risk) -> 50% -> reject.

  But note: the narrowest class rule might choose event-based if we consider it to have reliable data and it is narrower than food-related mobile? But it is not narrower in the sense of subset: the event-based class includes non-mobile and non-coffee. So it is broader in some features, narrower in others.

  This is the problem: the classes are not nested.

  So the narrowest class rule is ambiguous because we don't have a class that is a subset and contains the target. So we must choose among overlapping classes.

  Therefore, the homogeneous class rule is better because it focuses on the relevant factors.

  Final decision: reject based on the event-based class.

  But note: the coffee shop class (80%) is also homogeneous (for coffee) but misses the event and mobile factors. So it is less relevant.

  So the feature of the scenario doing the real work: the presence of a strong risk factor (event focus) that is not shared by the coffee shop class and that lowers the success rate substantially.

  If we delete the event focus, then we would have a mobile coffee van, and then the food-related mobile class (60%) becomes the natural choice.

  Defender of the broad class rule: They would say that the 70% rate is more stable and that the specific features might not be as determinative as we think. Also, they might argue that the event-based class is too heterogeneous and includes high-risk non-food businesses.

  I think the homogeneous class rule (with domain knowledge) is best.

  But note: the problem is that the committee might not agree on the dominant risk factor. So the underdetermination remains.

  For the purpose of the exercise, we have met the specs.

  Thus, the case.
answer: |-
  ### Engineered Reference Class Problem Case
  **Scenario:** A university committee reviews applications for seed funding to support new academic conferences. The target proposal is for a conference on "Digital Ethics in Autonomous Systems" (DEAS), which focuses on ethical frameworks for AI-driven vehicles and drones. This is interdisciplinary, blending computer science, ethics, and transportation engineering. The committee must estimate the probability that the conference will attract at least 100 attendees (a threshold for viability). Historical data from the university’s 200 past conferences is exact and undisputed:  
  - **Class A (All academic conferences):** 75% met the attendance threshold (150 of 200 conferences).  
  - **Class B (Computer science conferences):** 85% met the threshold (68 of 80 conferences).  
  - **Class C (Ethics-focused conferences):** 50% met the threshold (20 of 40 conferences).  
  - **Class D (Transportation engineering conferences):** 60% met the threshold (18 of 30 conferences).  

  DEAS combines all three features: computer science focus, ethics focus, and transportation engineering focus. No past conference has this exact combination. Class B, C, and D are natural and non-gerrymandered: Class B includes AI conferences but not ethics/transportation; Class C includes medical ethics conferences but not computer science; Class D includes automotive engineering conferences but not ethics. The committee disagrees on the reference class:  
  - **Member 1 (broad class):** Uses Class A (75%) because it’s the only class with sufficient data for a reliable statistic.  
  - **Member 2 (narrow class):** Uses Class B (85%) because it’s the narrowest class with reliable data sharing DEAS’s strongest feature (computer science).  
  - **Member 3 (homogeneous class):** Uses Class C (50%) because ethics focus is a dominant risk factor (historically lowers attendance), making it homogeneous in the most relevant respect.  

  The decision threshold is 70%: above approves, below rejects. Class A (75%) and Class B (85%) support approval; Class C (50%) and Class D (60%) support rejection.  

  ### Analysis Against Specs  
  **Spec 1 (Known base rates):** Met. All rates are exact and from the same dataset (university records). No missing data; disagreement is solely about which class defines the probability.  
  **Spec 2 (No exact precedent):** Met. DEAS is the first conference with all three features. Any class containing DEAS is either:  
  - A singleton (e.g., "conferences with DEAS’s exact combination") → no data.  
  - Broader but includes disanalogous cases: Class B lacks ethics/transportation, Class C lacks computer science/transportation, Class D lacks ethics/computer science.  
  No class satisfies both the "narrowest with reliable data" rule (which would pick Class B) and the "widest homogeneous class" rule (which would pick Class C). The rates differ enough to flip the decision (75% or 85% vs. 50%).  
  **Spec 3 (Natural classes):** Met. Classes are intuitive and institutionally recognized: "all conferences" (administrative category), "computer science conferences" (departmental), "ethics-focused conferences" (thematic), "transportation engineering conferences" (disciplinary). No disjunctions or contrived groupings.  
  **Spec 4 (Survives Bayesian shrug):** Met. In Bayesian terms, the problem reappears in two places:  
  - **Prior over features:** Bayesian inference requires specifying which features predict attendance. If we model attendance as a function of features (e.g., computer science, ethics, transportation), the prior on which features are relevant determines the likelihood. A prior emphasizing ethics as key (e.g., based on historical impact) favors Class C; one emphasizing computer science favors Class B.  
  - **Partition for exchangeability:** Treating cases as exchangeable within a class depends on the chosen partition. A Bayesian might use a hierarchical model with classes, but the prior over partitions (e.g., weighting thematic vs. disciplinary classes) reintroduces the reference class choice. Without data for the feature combination, the posterior probability for DEAS depends critically on the prior for interaction effects (e.g., does adding ethics to computer science reduce attendance multiplicatively or additively?), which is not resolved by the data.  

  ### Verdicts from Rules  
  - **Classical "narrowest reliable class" rule:** Selects Class B (computer science conferences, 85%) as the narrowest class with sufficient data (n=80). Verdict: approve (85% > 70%).  
  - **Classical "widest homogeneous class" rule:** Ethics focus has the strongest historical effect (50% vs. 75% overall), and conferences homogeneous in ethics focus (Class C) share DEAS’s most salient risk. Verdict: reject (50% < 70%).  
  - **Bayesian rule (with simple model):** Assume a logistic regression with features. With no DEAS-like data, the posterior for DEAS depends on priors for coefficients:  
    - Prior emphasizing ethics (strong negative effect) → probability near 50%.  
    - Prior emphasizing computer science (strong positive effect) → probability near 85%.  
    Without a consensus prior, the Bayesian output underdetermines the probability (ranges from 50–85%).  

  ### Which Rule Handles It Best?  
  **The "widest homogeneous class" rule is best**, but only with domain expertise. Here’s why:  
  - It directly addresses the most influential feature (ethics focus, which halves the success rate compared to the broad class) and avoids overreliance on arbitrary narrowness. DEAS’s ethics component is a known risk driver, so Class C is more homogeneous in the causally relevant sense than Class B (which ignores this risk).  
  - The "narrowest reliable class" rule fails because "narrowest" is ambiguous when classes overlap but aren’t nested—Class B is narrower than Class A but broader than a hypothetical "computer science + ethics" class (which lacks data). It also ignores the ethics risk, leading to overconfidence.  
  - The Bayesian approach collapses into the same problem: it defers to priors that require the same domain judgment as the classical rules.  
  - **Honest underdetermination?** Probability is not fully determined (as the Bayesian range shows), but a decision is required. The homogeneous class rule forces explicit debate about which feature matters most, reducing bias.  

  **Single feature doing the work:** The ethics focus (Class C’s 50% rate). It is the strongest isolable risk factor with a large effect size. If removed (e.g., if DEAS were just "Computer Science in Autonomous Systems"), Class B (85%) would be unambiguously appropriate, resolving the dispute.  

  **Defender of the worst rule ("narrowest reliable class"):** They might argue: "Class B is more relevant because computer science is DEAS’s core discipline, and ethics is just a subtopic. Class C includes unrelated ethics conferences (e.g., bioethics), so it’s not truly homogeneous. We should trust the computer science rate and adjust subjectively for ethics." This wriggles out by downplaying the risk factor, but it reintroduces subjectivity the rule tries to avoid.  

  **Where I’m least confident:**  
  - Spec 2 and Spec 3 tension: Ensuring no exact precedent while keeping classes natural is hard. I mitigated this by choosing features that are logically independent (e.g., ethics and computer science rarely intersect in past data).  
  - Spec 4: The Bayesian response works only if we avoid trivial fixes like "average the classes." In real committees, priors might be swayed by advocacy, but the core underdetermination remains.  
  - **Weak spot:** If the committee disagrees on which feature is "homogeneous," the rule falters. But this mirrors reality—experts *should* debate causal factors.  

  **Final commitment:** Use the homogeneous class rule. It best leverages institutional knowledge (e.g., ethics as a turnout risk) and forces transparency about why one feature dominates. Approving based on Class B (85%) ignores a major risk; rejecting based on Class C (50%) is more defensible.
