prompt: |-
  I've been trying to work out where I actually stand on the extended mind thing by going case by case, because the abstract arguments just bounce off me. Here's where I end up, and I want to know whether there's one principle behind it or whether I'm just being inconsistent.

  - Notes app on my phone: fifteen years of notes, synced everywhere, full-text search, I check it without deciding to. Yes, part of how I think.
  - The same notes in a paper notebook in my bag that I physically flip through: yes, just as much. I don't think speed or searchability is what's doing the work.
  - A "second brain" app that auto-generates links and surfaces notes I'd forgotten, including connections I never made and half of which I wouldn't endorse: yes, but this is the one where the thing seems to be contributing structure I never put in, and that worries me.
  - A notebook from 2011 full of notes in a substitution cipher I invented and then lost the key to: no. It's mine, its in my drawer, and I can't get anything out of it anymore.
  - Voice memos where I talk a problem out loud, feel much clearer, and never listen back: I want to say no, but it bugs me. The talking itself did real cognitive work at the time. No storage, but very tight coupling in the moment.
  - My hearing aids. They do their own AI noise filtering and directionality, suppressing stuff I never notice was there. I say no, that's equipment, like glasses. But I can't say why that's different from the notebook, which also shapes what I end up with without me noticing.
  - My wife. Knows my passwords, finishes my sentences, remembers where I put things, I trust her completely and consult her automatically. No, obviously not — she's a separate person.
  - My LLM assistant at work. It has basically everything I've written, drafts in something close to my voice, and I genuinely think with it: I leave sentences half-finished and let it complete them. When I'm honest I want to say this one is closer to yes than my wife is, which seems insane, because she actually knows me and this thing is a next-token machine that doesn't know anything. But it's the case I keep going back and forth on.
  - A shared grocery list app with my wife, half the entries hers, some added by both of us at different times, none of it decided by me: no idea at all.
  - A hypothetical implanted memory prosthesis: yes, obviously. Which I know I'm not supposed to care about, since the skull isn't meant to be a magic boundary.

  The rule I'd been using was roughly: it's part of my mind if I consult it automatically and reliably, trust it without checking, and the information is available when I need it. That gets the first four right, but it says yes to my wife, which I reject, and I don't think it says anything about the hearing aid.

  So: give me a principle, or two or three candidates, that captures these verdicts, with the case that motivates each clause. I especially want its verdict on two cases I haven't put on the list: (a) my phone battery dies for six hours and I feel like I've lost part of my memory — does that mean it was part of my mind and I temporarily lost it, or does your principle predict I'm just confused about what's happening to me? and (b) my notes app contains addresses and opinions I wrote years ago and now disagree with, and I act on them anyway. And be straight with me about which of my verdicts I'd have to give up — particularly the wife-versus-assistant pair, since those two are structurally similar and I'm calling them differently.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is trying to determine where they stand on the extended mind theory by evaluating specific cases. They've listed various scenarios—like their notes app, a paper notebook, an AI assistant, their wife, and others—and assigned "yes" or "no" to whether each is part of their extended mind. But they're inconsistent, especially with the wife vs. AI assistant. They want a principle that explains their judgments without contradictions.

  First, I need to understand their current rule: automatic consultation, trust without checking, and availability. This works for the notes and notebook but fails with the wife (who fits but is rejected) and the hearing aids (which don't fit but need explanation). The user rejects the wife being part of their mind, even though she meets all three criteria. Why? Because she's a separate person. So autonomy seems key here. 

  Then there's the AI assistant. The user feels it might be closer to "yes" than the wife, which confuses them. The assistant is a tool they integrate seamlessly into their workflow, like completing sentences. But it's not conscious. The difference might be in control and transparency. The user trusts the AI's output without constant verification, similar to their notes. But they can't control the wife's thoughts; she has her own agency. 

  The hearing aids are tricky. They process information without the user's awareness, like suppressing noise. The user says "no" because it's equipment, like glasses. But why isn't that part of the extended mind? Maybe because the cognitive processing isn't accessible; it's more about sensory input modification than cognitive extension. The hearing aids alter perception before it enters the mind, whereas the notes app stores and retrieves information that the mind actively uses. 

  The voice memos are interesting. The user talks through a problem and feels clearer but never listens back. They want to say "no" because there's no storage or later retrieval. But the act of speaking itself is a cognitive process. This highlights that cognition isn't just storage but the process. The extended mind might require ongoing interaction, not just one-time use. 

  The encrypted notebook is clearly "no" because the information isn't accessible anymore. Even though it's physically theirs, the lack of access means it's not functionally part of their cognition. 

  The "second brain" app that auto-generates links is a "yes" but with worry. The app adds structure the user didn't create, which introduces potential misinformation. But they still include it. This suggests that trust is crucial, but maybe the user accepts the app's contributions as part of their cognitive system as long as they generally endorse the process, even if some outputs are flawed. 

  The grocery list app with shared entries is confusing to them. It's collaborative. The user doesn't feel ownership because some entries aren't theirs. This points to personal endorsement—needing to have generated or approved the content. 

  The implanted memory prosthesis is an obvious "yes," indicating that the physical boundary (skull) isn't the issue. So, the principle must be about function, not location. 

  Now, the user's proposed rule breaks on the wife and hearing aids. To resolve this, I need principles that address autonomy and cognitive integration. The first principle could be about cognitive integration and automatic endorsement: the tool must be so integrated that its outputs are treated as one's own thoughts. The wife has her own cognition, so her contributions aren't automatic extensions of the user's mind. The AI, while not conscious, produces outputs that the user adopts without second-guessing, making it more like an extension. 

  For the hearing aids, the key is that they filter sensory input before it becomes cognitive content. They don't store or process information the way the notes app does. So, defining the boundary between perception and cognition might help. Perception-aiding tools (glasses, hearing aids) aren't extended cognition, while storage/processing tools (notes, AI) are. 

  The two additional cases: phone battery dying and acting on outdated notes. If the phone's notes are part of the extended mind, losing access should feel like losing memory. But if the principle is about functional integration, temporary loss might not invalidate the extension, just as forgetting isn't losing part of the mind. For outdated notes, if the user acts on old info without updating, the notes are still part of their cognition, but they're using outdated data. It's a failure of updating, not a failure of extension. 

  The user might need to adjust their view on the wife or the AI. If autonomy is key, the wife stays "no." The AI's lack of consciousness doesn't matter if it's functionally integrated. But the user feels uneasy about the AI adding structure they didn't endorse. That might require accepting that tools can extend the mind but introduce errors, similar to biological memory's flaws. 

  Inconsistencies: The user might need to accept that the grocery list, if trusted and automatically consulted, could be part of their extended mind, even with shared entries. Or they might need to see the wife as a social extension rather than a cognitive one. The AI assistant being a "yes" while the wife is a "no" is consistent if autonomy is the differentiator. The wife's independent agency excludes her, while the AI's lack thereof includes it as a tool. 

  So the principles could be: cognitive integration (seamless use, automatic trust), personal endorsement (content must be self-generated or approved), and functional equivalence (the tool performs a function the brain would otherwise do). The wife fails on personal endorsement and autonomy. The hearing aids fail functional equivalence as they're perceptual, not cognitive. The voice memos fail on ongoing integration since they're not reused. The grocery list might pass integration but fail endorsement if entries aren't theirs. 

  The user's verdict on the AI might stand if they accept that lack of consciousness doesn't preclude functional extension. The wife remains excluded due to autonomy. The hearing aids stay out as perception tools. The grocery list is tricky; if the user automatically trusts and uses it without verifying each entry, it might count, but they might reject it due to lack of personal endorsement. That's where they might need to adjust their view or add a clause about content ownership.
answer: |-
  Your case-by-case approach reveals a consistent pattern rooted in **cognitive integration and endorsement**, not just access or trust. Here's a principle that captures your intuitions, with clarifiers for edge cases:

  ### Core Principle:  
  **"X is part of my extended mind iff:**  
  (1) **It is reliably integrated** into my cognitive workflows *automatically* (no deliberate re-initiation needed),  
  (2) **I transparently endorse its outputs** as my own cognition (no "outsourcing" of judgment), *and*  
  (3) **I have operational authority** over its core functions (I can veto/override its contributions)."

  ---

  ### How It Explains Your Cases:
  - **Notes app/paper notebook**:  
    Yes. (1) Integrated automatically; (2) You endorse all content as *your* thoughts; (3) You control input/output.  
  - **"Second brain" app with auto-links**:  
    *Yes, but uneasy*. (1) Integrated; (3) You control use, but (2) endorsement is partial—you don't "own" the AI's inferences.  
  - **Encrypted notebook**:  
    No. Fails (1): Not integrated (can't access).  
  - **Voice memos (never listened)**:  
    No. Fails (1): Not integrated *after creation*; it’s a cognitive *artifact* (like a solved crossword), not ongoing extension.  
  - **Hearing aids**:  
    No. Fails (2) & (3): They *pre-process stimuli* but you don’t endorse/output their filtering as *your cognition*—it’s perception-aiding, not cognition-extending.  
  - **Your wife**:  
    No. Fails (2) & (3): She has her own agency/endorsement; you can’t veto her cognition. *Structural similarity to AI assistant addressed below*.  
  - **LLM assistant**:  
    **Yes** (if you accept partial endorsement). (1) Deeply integrated (co-completion); (3) You control input and can edit outputs. (2) You endorse its *role* in your workflow, even if outputs require vetting.  
  - **Shared grocery list**:  
    No. Fails (2) & (3): Entries added by others aren’t endorsed by you; you lack authority over their content.  
  - **Implanted memory prosthesis**:  
    Yes. Meets all three: integrated, endorsed, under your authority.  

  ---

  ### Your New Cases:
  **(a) Dead phone battery feeling like lost memory**:  
  - **Verdict**: *Confusion, not true loss*.  
  - Why: Losing a tool ≠ losing part of your mind. Your principle requires *ongoing* integration (1). The phone is a *vehicle* for extension, not the extension itself—like losing glasses isn’t losing vision. You feel impaired because access is disrupted, but the cognition stored there wasn’t "in" you.  

  **(b) Acting on outdated notes you disagree with**:  
  - **Verdict**: *Yes, it’s still part of your mind—but flawed*.  
  - Why: (2) Endorsement isn’t about accuracy but *attribution*. You treat the notes as "you" (past-you) automatically. Biological memory also contains errors we act on.  

  ---

  ### Inconsistencies to Resolve:
  1. **Wife vs. AI Assistant**:  
     - Your intuition (wife=no, AI=yes) is upheld by **operational authority (3)**:  
       - You *cannot* force your wife to recall/think exactly as you wish.  
       - You *can* delete/edit the AI’s output; it has no independent goals.  
     - **But**: You must accept that the AI’s "contributions" (e.g., inferred connections) are *weakly endorsed* (2). If this unsettles you, the AI should be a "no"—but your description suggests you *do* adopt its outputs as raw material for your cognition.  

  2. **"Second Brain" App Worry**:  
     - Your "yes" requires accepting that *partial endorsement* counts. If you demand *full* endorsement, this becomes a "no."  

  3. **Hearing Aids/Glasses**:  
     - Your "no" stands, but note: If hearing aids *augmented* cognition (e.g., real-time language translation you treat as "your" thought), it would qualify. Mere sensory aid ≠ extension.  

  ---

  ### Refined Principle (adds nuance):  
  > **"X extends my mind iff:**  
  > - It is **automatically invoked** as a cognitive resource (integration),  
  > - Its outputs are **treated as my own cognitive states** without external verification (endorsement),  
  > - I have **final authority** to accept/reject its contributions (control)."  

  This preserves all your verdicts except:  
  - **LLM Assistant**: Still "yes" if you trust its completions without fact-checking each time. If you constantly verify, it fails (2) and becomes a "no."  
  - **Grocery List**: If you *automatically trust all entries* as if you wrote them, it becomes a "yes"—but your skepticism suggests you don’t.  

  ### Key Insight:  
  Your judgments hinge on **whether the tool feels like a transparent part of "you"**—not reliability or location. The wife isn’t "you" because she’s opaque and autonomous; the encrypted notebook isn’t "you" because it’s inaccessible; the hearing aids aren’t "you" because they modify input, not cognition. The AI *is* "you" when you co-opt its outputs seamlessly. **The skull isn’t special—but agency and transparency are.**
