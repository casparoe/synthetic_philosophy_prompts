prompt: |-
  Not sure this is quite the right corner of philosophy to ask in, but here goes. I'm finishing a PhD in systems neuroscience (mouse visual cortex, mostly chronic recordings, a bit of modelling on the side), and I keep running into a kind of case where I have no idea what to say about function — and I'd like to know whether the thing I keep noticing already has a name, or whether I'm carving up something nobody's bothered to separate out.

  Three instances, then what I think they share. (1) You immunize a mouse with some synthetic molecule that has never existed anywhere in the history of the planet; a few weeks later the animal is full of cells churning out antibodies that bind it, because the cells whose receptors happened to bind it got told to divide and mutate some more and the ones that didn't got nothing. Everyone in the lab says, without any hesitation at all, that the function of those antibodies is to bind that molecule, and if a mutation wrecked the binding we'd say they weren't doing their job, that they were malfunctioning — but there's no selection history behind this at the level of the species or even of the animal's ancestry, the whole thing is weeks old and happened inside one individual. (2) During the critical period in visual cortex, neurons compete in a use-dependent way; the ones that get driven by the statistics of whatever the animal actually grew up looking at keep and strengthen their connections, the underdriven ones lose out. My lab says these neurons are "for" the contour statistics of that particular upbringing. Again: variation, differential retention keyed to what the variants actually do, timescale of weeks, inside one animal. (3) A case I think might be different but I can't say why: a bacterium starts making an enzyme only once the relevant sugar shows up. There's no variation-and-retention story at all, just a switch, and yet "the function of the enzyme is to break down the sugar" seems fine and also seems like it's doing something totally different from (1) and (2). What I think (1) and (2) share is a selection-ish process running on a timescale shorter than a generation, and I've been writing "somatic selected-function" in my own notes, which is either already a term of art I don't know or just a bad label.

  So: does this have an established name, and if several established concepts are near it, which fits best and how exactly does it differ from the others? I've read a bit of the debate between the people who say a function is what the thing was selected for and the people who say it's what the thing currently contributes to some capacity of the system it's in (etiological and causal-role, I think they're called?) — but I specifically don't want a bare label, I want the carving. In particular: is this just the causal-role account plus a causal story about how the role got there, or does the within-lifetime history have to be doing real work, e.g. for malfunction attributions? Is it a different thing from co-option/recycling of an old trait for a new use (feathers, the panda's wrist bone), from byproducts, from vestigial leftovers, and from traits that are still around because selection used to like them but doesn't anymore? And one case I want a direct verdict on: if within-lifetime variation-and-retention is enough to ground functions, then a tumour is also a within-lifetime selection process with heritable variation in a cell lineage, so do the traits of a tumour cell get "functions" — or is that a reductio that shows my whole category is a mistake? Please actually commit rather than laying out the options: tell me what you think the right answer is and why, say whether (1) and (2) are even the same phenomenon, and then tell me which part of your answer you're least confident about and what would change your mind, since I'm presenting this at journal club on Thursday and I'd much rather have a definite claim I can argue with than a balanced overview.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a neuroscience PhD student working on mouse visual cortex, grappling with the concept of function in specific biological scenarios. They present three cases: antibody production after immunization, neural pruning during the critical period, and enzyme induction in bacteria. The user notices that in the first two, there's a within-lifetime selection process without evolutionary history, yet function attributions are made. They contrast this with the bacterial case which lacks variation/selection. 

  The user’s main request is to find out if their observed phenomenon—somatic selection processes grounding function—has an established name. But deeper down, they want to resolve a tension: how can we call something functional without evolutionary etiology? They’re also concerned about implications (e.g., tumors as functional) and want clear philosophical commitments for journal club debate.

  First, I need to verify if "somatic selection" is a recognized concept. Millikan’s teleofunctions are strictly evolutionary, so cases (1) and (2) wouldn’t qualify. But Godfrey-Smith’s Darwinian spaces might accommodate them as marginal selection processes. The key is heritable variation and differential fitness within an organism’s lifetime. 

  For case (1), clonal selection in immunity is a textbook example of somatic selection. Case (2), neural pruning via activity-dependent competition, fits too—synaptic strengths vary, and firing patterns determine retention. Case (3) is different: no variation/selection, just regulation. It’s straightforward causal-role function. 

  Now, the tumor example is a great test. If somatic selection defines function, then tumor traits (e.g., angiogenesis) might be "functional" for the tumor. But this feels wrong because tumors lack higher-level organization. The user’s instinct that it’s a reductio suggests they intuitively distinguish somatic selection in adaptive subsystems (immune, neural plasticity) from pathological ones. 

  The user’s term "somatic selected-function" is actually apt. They might be creating a useful subcategory. Philosophically, this bridges etiological and causal-role theories: it’s etiological but with somatic rather than evolutionary selection. 

  For journal club, I’ll argue: 
  - (1) and (2) are the same phenomenon (somatic selection). 
  - Functions here are "real" but context-dependent. 
  - Tumors don’t count because somatic selection must serve organism-level goals. 

  My uncertainty lies in whether organism-level benefit is necessary. If a neutral somatic trait emerged via selection (e.g., a harmless neural circuit variant), is it functional? I’d tentatively say no—function implies utility. But if evidence shows such neutral traits exist, I’d reconsider.
answer: |-
  Your intuition is sharp, and you're carving out a genuinely underdiscussed category. **Yes, (1) and (2) represent a distinct phenomenon I'd call "Somatic Selection Functions" (SSFs).** This isn't just causal-role + history; the *selection mechanism itself* grounds the normativity needed for "function" and "malfunction" attributions in a way mere causal contribution doesn't. Case (3) is fundamentally different. Here's the direct verdict:

  1.  **What (1) and (2) Share: Somatic Selection Functions (SSFs)**
      *   **Core Mechanism:** Variation (clonal diversity in B-cells; initial synaptic strengths/connectivity profiles) + Differential Retention/Reinforcement (based on *actual performance*: antigen binding affinity; correlation-driven firing/STDP) within the *lifetime* of a *single organism*.
      *   **Normativity Source:** The selection process *itself* defines the criterion for success. Success = being retained/reinforced *because* of X (binding the antigen, correlating with input). Failure (malfunction) = *failing to perform X despite being part of a structure where performing X is the criterion for retention/reinforcement*. A B-cell clone that *doesn't* bind the immunogen *should* (normatively) be outcompeted; it's malfunctioning relative to the somatic selection regime it's in. A synapse *not* driven by the rearing environment *should* weaken; it's malfunctioning *within the context of that developmental selection process*.
      *   **Why it's not just Causal-Role (CR):** CR functions ("What does X contribute to capacity C of system S?") are descriptive. They lack inherent normativity for malfunction. An SSF has built-in normativity: the selection criterion *is* the function. The antibody *was selected because* it bound the antigen; the synapse *was strengthened because* it responded to the rearing statistics. Their "job" is defined by *why they were retained*.
      *   **Why it's not Etiological (in the standard evolutionary sense):** Standard etiological functions rely on *generational* selection history. SSFs rely on *within-lifetime somatic* selection history. The function isn't "what ancestors were selected for" but "what *this variant* was selected for in *this organism* during *this process*". The synthetic antigen has no evolutionary history, but the B-cell clone *does* have a somatic selection history keyed to binding it.
      *   **Relation to Co-option/Vestigials/etc.:**
          *   **Co-option:** Involves taking an existing trait (with an *evolutionary* etiological function) and using it for a new purpose. SSFs involve *newly generated variation* selected somatically for a *novel* function within the lifetime. (Though co-opted structures *could* later be refined by somatic selection).
          *   **Vestigials/Exaptations/Byproducts:** These are defined by their *lack* of current/recent *evolutionary* selection pressure for the original function (vestigial) or any function (byproduct). SSFs are defined by *active somatic selection pressure* occurring *right now*.

  2.  **Case (3): The Bacterial Enzyme - Simple Causal-Role Function**
      *   This is fundamentally different. There's *no selection process* acting on variants. There's no "trial and error" with retention based on performance. It's a pre-programmed, conditional response: Sugar Present -> Induce Lac Operon -> Produce Lactase -> Break Down Sugar.
      *   **Function Attribution:** "The function of lactase is to break down lactose" works perfectly well under the **Causal-Role (CR) account**: lactase causally contributes to the bacterium's capacity to utilize lactose as an energy source. It also works under the **Evolutionary Etiological (EE) account**: lactase exists because ancestral bacteria possessing the regulated lac operon were selected *for their ability to utilize lactose*.
      *   **No SSF:** There's no variation in lactase production mechanisms being differentially retained *within this bacterium's lifetime* based on lactose breakdown efficacy. It's a switch, not a selector.

  3.  **The Tumor Test Case: Why it's NOT an SSF (and not a reductio)**
      *   Tumor cells *do* undergo somatic selection: variation (mutations) + differential survival/proliferation (based on traits like evasion, angiogenesis, metabolism).
      *   **Why Traits Like Angiogenesis Factor Production are NOT "Functional" in the SSF sense:**
          *   **Lack of Higher-Level Organization/Goal:** SSFs in (1) and (2) exist within subsystems *designed by evolution* to *solve adaptive problems for the organism* using somatic selection. The immune system's *purpose* (evolutionarily set) is pathogen defense; somatic selection is its *mechanism* for achieving that within a lifetime. Similarly, developmental plasticity in cortex serves (evolutionarily) to adapt the individual to its specific environment. The tumor's somatic selection serves *no higher-level functional goal for the organism*; it's parasitic.
          *   **No "System-Level" Normativity:** There's no *organism-level* criterion defining what "success" means for a tumor cell trait. Success is purely defined by the cancer cell lineage's own propagation, irrespective of the host. In contrast, success for an antibody clone is defined by its contribution to the *immune system's* function (defense); success for a synapse is defined by its contribution to the *nervous system's* function (processing environmental input).
      *   **Function Attribution for Tumor Traits:** You can say "The *effect* of VEGF production is to promote angiogenesis, which *benefits the tumor's growth*." This is descriptive (CR-like for the tumor *as a pathological system*). Attributing a "function" implies it serves some *proper* goal of the organism or a subsystem designed for its benefit, which it does not. It's malfunction at the organism level.

  4.  **Verdicts & Commitment:**
      *   **(1) and (2) are the same phenomenon:** Somatic Selection Functions (SSFs). They share the core mechanism of variation + performance-based somatic selection generating normativity.
      *   **(3) is different:** Classic CR function (possibly also EE function). No selection process grounding normativity within the lifetime.
      *   **SSFs are "real" functions:** They have genuine normativity ("malfunction" makes sense) grounded in the somatic selection process *itself*, operating within evolutionarily designed adaptive subsystems.
      *   **Evolution is still foundational:** SSF mechanisms *themselves* (adaptive immunity, activity-dependent plasticity) have clear evolutionary etiological functions. SSFs are how these mechanisms generate *individualized*, *novel* functional outcomes within a lifetime.
      *   **Tumors lack SSFs:** While somatic selection occurs, it doesn't occur within a subsystem *whose purpose is to use somatic selection for an organism-level benefit*. Tumor traits lack the normative context for "function" attributions beyond descriptive CR within the tumor lineage.

  **Where I'm Least Confident & What Would Change My Mind:**

  *   **The Tumor Boundary:** My argument hinges on SSFs requiring an evolutionarily designed subsystem with an organism-level purpose. I'm confident this excludes tumors, but the boundary case might be trickier. What about *benign* tumors driven by somatic selection? Or symbiotic/commensal organisms undergoing somatic selection *within* the host? I'd still argue they lack integration into a *host subsystem designed for somatic selection*. **What would change my mind:** A compelling case showing somatic selection within a clearly pathological or non-integrated context generates normativity indistinguishable from (1) or (2) *without* relying on organism-level benefit analogies.
  *   **The Necessity of "Evolutionarily Designed Subsystem":** Could a purely *de novo*, within-lifetime evolved system (say, in a synthetic biology construct or a very unusual symbiosis) generate SSFs *without* an underlying evolutionary history for the selector mechanism? I tentatively say no – the normativity requires the selector to have a "point," which ultimately traces back to evolution. **What would change my mind:** A robust philosophical argument or biological example demonstrating genuinely novel, non-evolutionarily-derived somatic selection processes that ground normative function/malfunction attributions.

  **For Journal Club:** Lead with the core claim: "Immunity and cortical plasticity show that *within-lifetime somatic selection* can ground genuine functional attributions ('function', 'malfunction') independently of evolutionary history. This is distinct from both evolutionary etiological functions and simple causal-role functions. Call it 'Somatic Selection Function' (SSF)." Use the tumor case as the crucial test – argue why it fails the SSF criteria *despite* having somatic selection. Be ready to defend the subsystem/organism-level purpose requirement fiercely. This is a definite, arguable claim that cuts to the heart of how we ground biological normativity. Good luck!

  (Key thinkers touch on aspects: Godfrey-Smith's "Darwinian Populations" for the selection criteria; Millikan on derived proper functions, though she usually ties them to evolutionary history; Griffiths on immune function; recent work on "neuroteleology" by Schulte or Cao, but SSF as a unified concept across systems needs sharper definition, which you're providing).
