prompt: |-
  I'm drafting a paper on accounts that treat phenomenal consciousness as a user illusion — an interface a cognitive system presents to itself rather than a property things literally have — and I want the specification before I start comparing the accounts. Write the desiderata any such account must meet in order to be usable as a working hypothesis in an empirical research program: one with which a researcher could return a verdict, however hedged, on whether a given system has experiences (a patient emerging from general anesthesia, a split-brain subject, a non-human animal, a large language model), and which says what kind of evidence could bear on that question at all.

  For each requirement give the case or consideration behind it, and mark whether it is non-negotiable or a preference of one camp. At minimum: what the account owes the illusion-for-whom regress, given that an illusion normally needs someone it appears to; the difference between denying the property and denying the judgment, and the regress that opens if the judgment is demoted to illusion as well; the obligation to explain the specific structure of the appearance — ineffability, immediacy, apparent intrinsicness — rather than gesturing at cognitive simplification; the asymmetry between a graphical interface, which simplifies something real, and the claim that nothing of the relevant kind is there to be simplified; the degraded and partial cases (blindsight, dreams, the apparent richness of the visual field, a system whose reports are produced by a confabulating reporter with no access to the processes it reports on); and the apparent causal role of experience in learning and deliberation.

  Flag any pair of desiderata you suspect cannot be jointly satisfied, and say which single requirement excludes the most candidate views. Close with a one-line scorecard, at most, for illusionism, realist representationalism, and one further family of your choosing.
reasoning: |-
  Hmm, the user is drafting a paper on theories that treat phenomenal consciousness as a "user illusion" - essentially an interface that cognitive systems present to themselves rather than a literal property. They want a clear set of requirements that any such theory must meet to be useful for empirical research. Specifically, they want criteria that would allow researchers to determine whether various systems (like patients under anesthesia, animals, or AI models) actually have experiences, and what evidence could support such claims.

  The user has outlined several key challenges they want addressed: the "illusion for whom" problem (since illusions typically require someone experiencing them), the distinction between denying a property versus denying judgments about it, explaining specific qualities of consciousness like ineffability, the asymmetry between simplifying interfaces versus claiming nothing exists to be simplified, handling edge cases like blindsight or dreams, and accounting for the apparent causal role of consciousness.

  I need to structure this as a set of desiderata - clear requirements each with justification and whether they're mandatory or debatable. The user wants me to note where requirements might conflict, identify which single requirement is most exclusionary, and end with brief evaluations of illusionism, representationalism, and one other theory.

  For the desiderata, I'll start with the core "illusion for whom" issue - any viable theory must resolve the infinite regress problem without resorting to a homunculus. This is non-negotiable. Then the judgment/property distinction - we must clarify what's being denied (the property) versus preserved (the judgments), otherwise we collapse into eliminativism. Another non-negotiable.

  Next, explaining the structure of appearance - why consciousness feels ineffable, immediate, etc. - can't just handwave this as cognitive simplification. Good theories should explain these features. This is probably a preference, but important for empirical traction.

  The interface asymmetry point is crucial - unlike a map simplifying territory, here we're claiming the territory doesn't exist. This forces the theory to show how the illusion emerges from underlying processes. Non-negotiable for coherence.

  Edge cases like blindsight and dreams test the theory's specificity - can it explain degraded consciousness and apparent richness? Non-negotiable for empirical adequacy.

  The causal role requirement addresses why consciousness seems to do work in cognition - a theory must either accommodate or explain away this appearance. Preference, but important for plausibility.

  I suspect conflicts might arise between explaining the structure of appearance and maintaining a strict illusionist stance - if consciousness feels so real, how can we simultaneously deny its existence? Also, the judgment/property distinction might be hard to maintain without smuggling realism back in.

  The most exclusionary requirement is probably the judgment/property distinction - it instantly rules out views that confuse these, like naive eliminativism.

  For the scorecard: Illusionism struggles with explaining structure but handles regress well; realist representationalism explains structure naturally but faces the hard problem; functionalist approaches are empirically tractable but may not capture phenomenology.

  I'll organize this clearly with each desideratum marked as non-negotiable or preference, and note the conflicts at the end as requested.
answer: |-
  Here is a specification of desiderata for a viable "user illusion" account of phenomenal consciousness, designed for empirical research. Each requirement includes its rationale, status (non-negotiable or preference), and the cases motivating it. Conflicts and a comparative scorecard follow.

  ---

  ### **Desiderata for a Viable "User Illusion" Account**

  1.  **Resolve the "Illusion-for-Whom" Regress**  
      *   **Requirement**: The account must specify what *has* the illusion without invoking an unexplained inner experiencer (homunculus) or infinite regress. It must explain how an illusion can exist "for" a system without implying a conscious spectator.  
      *   **Case**: Anesthesia recovery (graded return of cognition without coherent self), split-brain subjects (disunified cognition).  
      *   **Status**: **Non-negotiable**. Failure here collapses illusionism into either realism or incoherence.  
      *   **Solution Space**: Identify the illusion with access-conscious states (e.g., globally broadcast representations) or a specific functional self-model.

  2.  **Clarify the Property/Judgment Distinction**  
      *   **Requirement**: The account must explicitly deny the existence of *phenomenal properties* (qualia) while preserving the reality and causal efficacy of *judgments* *about* phenomenal properties (e.g., "I see red"). It must avoid demoting these judgments to mere illusions themselves, which would restart the regress.  
      *   **Case**: A confabulating reporter (e.g., anosognosia) – the system judges "I see X" despite lacking relevant processing, yet the judgment itself is real.  
      *   **Status**: **Non-negotiable**. Blurring this distinction leads to eliminativism about cognition itself or restarts the regress (if the judgment is illusory, what *has* that illusion?).  
      *   **Solution Space**: Treat judgments as physical/cognitive states with specific functional roles, denying they refer to real phenomenal properties.

  3.  **Explain the Specific Structure of the Appearance**  
      *   **Requirement**: The account must explain *why* the illusion has the specific structural features it does (ineffability, subjective immediacy, apparent intrinsicness, perspectivalness) – not just gesture at "cognitive simplification" or "useful fiction."  
      *   **Case**: The apparent richness of the visual field vs. actual sparse sampling (change blindness), the feeling that "what it's like" is irreducible.  
      *   **Status**: **Preference** (but a strong one for empirical traction). Failure here leaves the core explanandum untouched and makes the account empirically vacuous.  
      *   **Solution Space**: Link features to computational mechanisms (e.g., ineffability to encapsulation, immediacy to direct availability for action, intrinsicness to the format of self-modelling).

  4.  **Address the Interface Asymmetry**  
      *   **Requirement**: The account must reconcile claiming that "nothing of the relevant kind is there" with the analogy to a simplifying *interface*. Unlike a desktop icon simplifying a real file, phenomenal properties are claimed *not to exist*. It must explain what the interface is simplifying/abstracting *from* if not phenomenal states.  
      *   **Case**: Graphical user interfaces (simplify complex real computations/storage) vs. phenomenal consciousness (allegedly simplifying non-phenomenal processes).  
      *   **Status**: **Non-negotiable**. The analogy is central to illusionism; asymmetry undermines it.  
      *   **Solution Space**: Argue the interface simplifies complex *non-conscious* neural/computational dynamics (e.g., prediction error signals, sensorimotor contingencies) into a unified, actionable self/world model.

  5.  **Account for Degraded/Partial Cases & Illusory Richness**  
      *   **Requirement**: The account must explain the phenomenology (or lack thereof) in non-standard cases: absence (dreamless sleep, general anesthesia), degradation (blindsight, drowsiness), partial unity (split-brain, dreams), and the *illusion* of richness where access is limited.  
      *   **Case**: Blindsight (accurate performance without reported experience or access), dreams (vivid experience with degraded access/reportability), change blindness (illusory richness of visual field).  
      *   **Status**: **Non-negotiable**. Any empirically testable theory must handle boundary conditions.  
      *   **Solution Space**: Link phenomenality strictly to specific functional access or self-modelling capabilities; explain degraded cases by their partial or faulty instantiation.

  6.  **Address the Apparent Causal Role**  
      *   **Requirement**: The account must explain why conscious states *appear* to play a unique causal role in learning, deliberation, and report, even if (by illusionism) they do not exist as intrinsic properties. It must specify what *actually* plays that role.  
      *   **Case**: Learning associations requires *attention* (correlated with reportable experience); deliberative reasoning feels driven by conscious thought.  
      *   **Status**: **Preference** (critical for plausibility and explanatory power). Denying *any* causal role to the relevant cognitive states is implausible; conflating it with phenomenal properties is realist.  
      *   **Solution Space**: Attribute causal efficacy to the underlying cognitive/neural states implementing the illusion (e.g., global availability), not to phenomenal properties.

  ---

  ### **Suspected Conflicts Between Desiderata**

  *   **Explaining Structure (3) vs. Strict Illusionism (4):** Providing a satisfying mechanistic explanation for *why* the illusion has features like intrinsicness or ineffability risks making it sound like those features are *real* aspects of the underlying process, undermining the claim that *nothing* phenomenal exists ("illusion creep"). This is the core tension for illusionism.
  *   **Judgment/Property Distinction (2) vs. Apparent Causal Role (6):** Maintaining a clear line between real judgments and illusory properties while explaining why *those specific judgments* (about phenomenality) feel uniquely causally potent is challenging. If the judgment "I feel pain" is just another cognitive state, why does it seem so different from "I believe 2+2=4"?

  ---

  ### **Most Exclusionary Requirement**

  *   **Requirement #2 (Property/Judgment Distinction)** excludes the most candidates. Naive eliminativism (denying both properties *and* judgments) fails empirically and philosophically. Many non-illusionist views (e.g., some panpsychist or intrinsic property views) struggle to cleanly separate the property from judgments about it. Views that demote judgments to illusions restart the regress.

  ---

  ### **One-Line Scorecard**

  *   **Illusionism:** Excels on regress (1), distinction (2), asymmetry (4); struggles most on structure (3) and causal role (6), risking incoherence/vacuity.
  *   **Realist Representationalism:** Excels on structure (3), causal role (6), degraded cases (5); struggles profoundly with regress (1) and the "hard problem" (implied by 4).
  *   **Functionalism (Non-Reductive):** Excels on causal role (6), degraded cases (5), judgment reality (2); struggles with structure (3 - why *this* functional role feels like *that*) and regress (1 - if functional states *are* the properties).

  ---

  This specification provides a rigorous framework for evaluating whether an "interface illusion" account can transition from metaphor to testable science. The judgment/property distinction and the interface asymmetry are the sharpest knives for dissection.
