  ### **Disposition Detective: A Classification Game**

  **Objective:** Students experience the breakdown of the conditional analysis (disposed to M in C iff would M if C) through time-pressured classification, encountering finks, masks, mimics, and second-order cases. They must choose between trusting test outcomes (what happened) or inferred dispositions (what the object is like now).

  ---

  ### **Materials**
  1. **18 Case Cards** (one per student): Each describes an object, its disposition (e.g., "fragile," "flammable"), and hidden conditions. Cards are color-coded:  
     - **Green (6x Basic)**: No interference (e.g., "Ordinary glass: Fragile when struck. No hidden conditions.").  
     - **Blue (4x Finks)**: Stimulus removes disposition (e.g., "Enchanted glass: Force field activates when struck, making it non-fragile. True disposition: FRAGILE.").  
     - **Red (4x Masks)**: Extrinsic blocker prevents manifestation (e.g., "Glass in shockproof box. True disposition: FRAGILE.").  
     - **Yellow (4x Mimics)**: Manifestation occurs without disposition (e.g., "Rubber ball rigged with explosive: Shatters when struck. True disposition: NOT FRAGILE.").  
     - **Purple (2x Second-Order)**: Hidden conditions involve dispositions (e.g., "Glass with anti-force-field device: Force field (fink) is disabled by a switch that activates when struck. True disposition: FRAGILE.").  

  2. **Betting Sheets**: Tables for recording bets:  
     | Round | Object | Bet 1 (Test Outcome) | Bet 2 (True Disposition) | Points |  
     |-------|--------|------------------------|--------------------------|--------|  

  3. **Timer** (visible to all).  
  4. **TA Guide**: Key for test outcomes and true dispositions (e.g., fink cards always yield negative test outcomes but positive true dispositions).

  ---

  ### **Rules**  
  1. **Setup (5 min)**:  
     - Distribute one case card per student. Students read their card but **do not reveal hidden conditions**.  
     - Explain: "You’ll classify objects in 4 rounds. For each round, one card is tested. Bet on:  
       - **Bet 1 (Test Outcome)**: Will M occur if we run test C? (Yes/No)  
       - **Bet 2 (True Disposition)**: Does the object *actually have* the disposition *now*? (Yes/No)"  

  2. **Gameplay (30 min, 4 rounds × 7.5 min)**:  
     - **Round Start (1 min)**: Randomly select a student. They announce:  
       *"Testing [object] for [disposition]: Will it [M] when [C]?"* (e.g., "Testing glass for fragility: Will it break when struck?").  
     - **Betting (2 min)**: **All students** (including the announcer) secretly write Bet 1 and Bet 2 for the tested object.  
     - **Reveal Test Outcome (1 min)**: TA consults their guide and announces what happened (e.g., "Test: Did not break").  
     - **Reveal True Disposition (1.5 min)**: Cardholder reads hidden conditions. Class votes on true disposition (Yes/No). TA confirms.  
     - **Scoring (2 min)**:  
       - **Bet 1**: +1 if correct.  
       - **Bet 2**: +1 if correct, **except for mimics** (yellow cards), where Bet 2 is always worth **0 points** (systematically misleading).  
       - **Time Penalty**: Bets submitted late get 0.  

  3. **Winning**: Highest score after 4 rounds wins (non-monetary prize: e.g., "Disposition Detective" title).  

  ---

  ### **Timeline (50 min)**  
  - **0–5 min**: Setup and rules.  
  - **5–35 min**: Gameplay (4 rounds).  
  - **35–50 min**: Debrief.  

  ---

  ### **Debrief (15 min)**  
  1. **Breakdown of Conditional Analysis (5 min)**:  
     - *Finks/Masks*: "Remember when the glass didn’t break (test outcome: NO), but we agreed it was fragile (true disposition: YES)? That was a fink (blue) or mask (red)."  
       - **Key Difference**: "Finks *remove* the disposition when tested (e.g., force field activates). Masks *retain* the disposition but *block* the manifestation (e.g., shockproof box)."  
     - *Mimics*: "When the rubber ball shattered (test outcome: YES) but wasn’t fragile (true disposition: NO)? That’s a mimic (yellow)."  

  2. **Second-Order Cases and Regress (5 min)**:  
     - Use a purple card example: "The anti-force-field device disabled the fink... but what if *that device* had a fink? We’d need another device to test *its* disposition!"  
     - **Regress Insight**: "You felt this when voting on the true disposition—did we need to know if the anti-device *itself* was reliable? That chain never ends!"  

  3. **Scoring’s Role (3 min)**:  
     - "Mimics (yellow) made Bet 2 worthless. If you trusted test outcomes for true dispositions, mimics tricked you. Finks/masks tricked you if you expected test outcomes to reflect dispositions."  

  4. **What the Game Couldn’t Stage (2 min)**:  
     - "The game blurred *how* finks vs. masks work internally. Finks alter the object *intrinsically* (e.g., force field changes glass). Masks add *extrinsic* blockers (e.g., box around glass). That’s why they’re distinct counterexamples."  

  ---

  ### **Predictable Problems & Solutions**  
  1. **"This is just verbal!"**:  
     - *Response*: "Note how mimics made Bet 2 pointless—if dispositions were *only* test outcomes, we couldn’t explain why the rubber ball isn’t fragile. The metaphysics matters!"  

  2. **Confusion on True Disposition Timing**:  
     - *Issue*: Students may conflate "now" (pre-test) with "during test."  
     - *Solution*: Emphasize in debrief: "True disposition is *before* testing. Finks *lose* it during testing; masks *keep* it."  

  3. **Second-Order Overload**:  
     - *Issue*: Students miss regress in gameplay.  
     - *Solution*: Use voting in purple rounds to ask: "Does the anti-device have a disposition? How would we test *that*?"  

  4. **Mask/Fink Conflation**:  
     - *Issue*: Both show negative test outcomes + positive true dispositions.  
     - *Solution*: Contrast examples: "Fink: Glass becomes non-fragile *when struck*. Mask: Glass stays fragile, but box absorbs impact."  

  ---

  ### **Why This Works**  
  - **Pressure & Scoring**: Time limits force intuitive bets. Mimics sabotage "trust the test" strategies, highlighting the conditional analysis’ flaw.  
  - **Second-Order Discovery**: Purple cards require students to spot nested dispositions (e.g., anti-fink devices), making the regress tangible.  
  - **Clarity via Contrast**: Debrief uses gameplay moments to crystallize why masks ≠ finks and how regress arises.  

  **First Run Tip**: Pre-select a purple card for Round 3 to ensure regress discussion. If students dismiss the distinction, stress: "Masks leave the object unchanged; finks transform it. That’s a metaphysical difference, not wordplay."
