answer: |-
  **Exam Question**  
  (Total Time: 90 minutes. Answer all parts. Closed book. No external materials permitted.)  

  **Case**: A remote research station houses 100 people facing 100 cold nights. Each night, they face a choice:  
  - **Run the generator**: One person (on duty) suffers significant discomfort (–10 welfare units). The other 99 gain moderate comfort (+1 each).  
  - **Do nothing**: All experience neutral welfare (0).  

  **Part A: One-Shot Decision**  
  Suppose the choice occurs *only tonight*. According to contractualism, should they run the generator? Explain the reasoning, focusing on how complaints are assessed.  

  **Part B: Repeated Sequence**  
  Now suppose the same choice occurs *each night for 100 nights*, with duties rotated so each person serves exactly once. Under rotation:  
  - Each person endures –10 on their duty night.  
  - Each gains +1 on the other 99 nights.  
  - **Net result per person**: +89.  
  If they *never* run the generator, everyone nets 0.  

  Must the contractualist endorse running the generator *in this sequence*? If so, how does this align or conflict with the one-shot verdict? If not, why not?  

  **Part C: Core Tension**  
  Can contractualism coherently maintain *both* its one-shot verdict (against running) *and* endorse the rotation scheme? If not, which element must be revised? Justify your answer by:  
  (i) Explaining what contractualist restrictions on "summing complaints" entail,  
  (ii) Addressing whether aggregating burdens/benefits *within a single life over time* is permitted, and why/why not,  
  (iii) Considering whether the verdict should depend on framing the choice as "night-by-night" versus "a 100-night plan."  

  ---

  **Model Answer** (≈680 words)  

  **Part A: One-Shot Verdict**  
  Contractualism (e.g., Scanlon) forbids running the generator tonight. It assesses complaints *pairwise* and rejects aggregating weaker complaints to override stronger individual ones. The duty person’s complaint (–10) is decisive because it outweighs *each* beneficiary’s complaint (+1 loss if not run). The 99 beneficiaries’ complaints cannot be summed; thus, the collective gain does not justify imposing severe harm on one.  

  **Part B: Sequence Verdict**  
  Contractualism *must* endorse the rotation scheme. Each person’s net gain (+89) is substantially better than the alternative (0), and crucially, *no one has a justified complaint* under rotation. Each voluntarily accepts the scheme ex ante for net benefit, and during execution, no single act violates contractualist constraints: on any night, the duty person’s complaint is still decisive against *that night’s non-aggregated beneficiaries*. Rotation is permissible because burdens are distributed fairly.  

  **Part C: Resolving the Tension**  
  Contractualism cannot coherently retain *both* verdicts without modification. The one-shot reasoning must be revised when applied to repeated, structured interactions.  

  *(i) Summing Complaints*  
  Contractualism bars aggregating *separate persons’* complaints against a burden affecting one. But in the sequence, the *same person* experiences burdens and benefits across time. The restriction applies to interpersonal aggregation, not necessarily intrapersonal.  

  *(ii) Intrapersonal Aggregation*  
  Aggregation *within a life* is defensible. A person’s life is a unified locus of experience and agency. Complaints are assessed from the standpoint of a *life as a whole*: the duty shift’s –10 is compensated by the +99 from other nights. What matters is whether a *person* can reasonably reject a scheme given their *overall* position. Refusing intrapersonal aggregation leads to absurdity: if each night’s complaint must be assessed separately, rotation could be rejected nightly (as in Part A), trapping everyone at 0 despite a collectively superior alternative. Contractualism must permit weighing net lifetime welfare.  

  *(iii) Framing Sensitivity*  
  The verdict *is* sensitive to choice framing. In the "night-by-night" frame, each act appears impermissible; in the "100-night plan" frame, the scheme is permissible. This is *not* objectionable if framing reflects genuine moral differences: a coordinated plan enables fair distribution and ex ante agreement. The duty person *on a given night* still has a complaint, but they cannot reasonably reject the *whole scheme* given their overall gain. Contractualism can accommodate this by distinguishing *act-by-act* justification (which may forbid isolated acts) from *scheme-level* justification (which permits coordinated plans ensuring reciprocity).  

  **Objections and Deeper Issues**  
  - **Veil-of-Ignorance**: Invoking ex ante choice under uncertainty adds nothing here. There is *no uncertainty*: roles are fixed by rotation. If we introduced uncertainty (e.g., random duty assignment), contractualism would *still* disallow aggregating beneficiaries’ complaints *on a given night*. Ex ante reasoning only confirms that no one could reasonably reject the rotation scheme *as a whole*.  
  - **Personal Identity (A-Grade Insight)**: If personal identity is not a "deep further fact" (e.g., Parfit), the distinction between intrapersonal and interpersonal aggregation collapses. If a person’s 100-night "self" is merely a series of connected stages, then compensating a burden on "Night-Self A" with benefits to "Night-Self B" resembles interpersonal compensation. Contractualism then faces a dilemma: either (1) allow full aggregation (collapsing into utilitarianism), or (2) forbid all aggregation, making the rotation scheme impermissible and condemning all to net 0. A third option might be grounding intrapersonal unity in *narrative continuity* or *agency*, but this risks arbitrariness. If no principled distinction remains, contractualism may lose its anti-utilitarian edge.  

  **Conclusion**  
  The one-shot verdict stands, but contractualism must accept the sequence verdict by endorsing intrapersonal aggregation. The key revision is recognizing that complaints are assessed against *whole-life* positions in structured schemes. Framing sensitivity is justified when plans ensure reciprocity.  

  ---  

  **Marking Scheme** (Total: 25 marks)  

  | **Criterion**                                                                 | **Marks** | **Common Errors**                                                                                               | **A vs. B Differentiation**                                                                                     |  
  |-------------------------------------------------------------------------------|-----------|-----------------------------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------------------------------------------|  
  | **1. Accurately states one-shot verdict & reasoning** (Anti-aggregation principle) | 4         | Misstates complaint strength; implies beneficiaries "outweigh" duty person.                                     | A: Explicitly cites pairwise comparison & non-aggregation. B: Recites standard case without linking to principles. |  
  | **2. Correct sequence verdict & justification** (Net benefit, no complaint)   | 3         | Claims sequence is impermissible; fails to note net gain or ex ante acceptance.                                 | A: Notes that no one can reasonably reject the *scheme*. B: Only observes net benefit without contractualist grounding. |  
  | **3. Identifies structural identity of cases** (Same act per night, rotated)  | 4         | Treats sequence as "different" due to repetition; ignores permutation of roles.                                 | A: Explicitly notes cases are identical in structure per choice occasion. B: Vaguely references "repetition."    |  
  | **4. Takes stance on intrapersonal aggregation** (Permitted; whole-life view) | 5         | Asserts "no aggregation ever" or "aggregation always allowed"; unexamined distinction.                          | A: Justifies via unified agency/life narrative. B: Assumes distinction without argument.                        |  
  | **5. Addresses framing sensitivity** (Distinguishes act vs. scheme justification) | 4         | Calls framing-dependence "arbitrary"; ignores reciprocity/fair distribution.                                   | A: Defends sensitivity via ex ante agreement & coordination. B: Labels it problematic but offers no resolution. |  
  | **6. Handles veil-of-ignorance/reduces to core issue** (No uncertainty here)  | 3         | Invokes ex ante fairness as a solution; conflates with interpersonal aggregation.                               | A: Notes veil adds nothing & reapplies same restriction. B: Treats veil as decisive for sequence.               |  
  | **7. A-Grade: Personal identity & implications**                              | 2         | Ignores or superficially mentions "Parfit"; no exploration of contractualism’s fate.                           | A: Develops dilemma (utilitarianism vs. paralysis); suggests third option. B: Mentions identity but no implications. |  

  **Zero Marks**:  
  - Answers that aggregate interpersonal complaints in one-shot case.  
  - Claims rotation is unjust because "each night is identical to one-shot."  
  - Fails to address contractualism specifically (e.g., defaults to utilitarianism).  

  **Annotations**:  
  - **A (21–25)**: Integrates all must-hit points; resolves tension via intrapersonal aggregation; anticipates objections; engages A-grade insight.  
  - **B (16–20)**: Covers core points but misses nuances (e.g., framing sensitivity); may assert rather than justify intrapersonal aggregation.  
  - **C (11–15)**: Recites basic contractualism but fails to resolve tension; confuses sequence with interpersonal aggregation.  
  - **D (6–10)**: Significant errors (e.g., misstates verdicts); minimal engagement with aggregation principle.  
  - **F (0–5)**: Fundamentally misunderstands contractualism or the case.  

  ---  
  **Note**: This question isolates contractualism’s core tension between act-focused non-aggregation and life-focused reciprocity. The marking scheme rewards precision on *why* aggregation fails interpersonally but succeeds intrapersonally, penalizing rote repetition of standard cases. The A-grade hurdle forces confrontation with contractualism’s metaphysical assumptions.
