answer: |-
  ### (i) Diagnosis  
  The stalemate arises from a collision of ontological frameworks, not empirical or logical disagreements. Eternalists adopt a **spatializing stance**: they treat time as a dimension analogous to space, demanding that "existence" denote membership in an unchanging four-dimensional manifold. Presentists adopt a **dynamic stance**: they treat temporal presence as metaphysically primitive, requiring "existence" to reflect an asymmetric, grounded actuality ("what is *now* real"). Both agree on physics and phenomenology because these underdetermine which stance is "correct." The cosmic-time case sharpens this: even a privileged foliation doesn’t resolve the dispute because eternalists can reinterpret it as *structural* (e.g., a symmetry-breaking feature *within* the block universe), while presentists see it as *vindicating* temporal fundamentality. The core issue is **what ontological commitments "existence" must serve**: cataloging all entities (eternalism) versus capturing what is dynamically immediate or fundamental (presentism). Physics provides structure, but metaphysical stances dictate how that structure maps to reality.  

  ### (ii) Strongest Objection to Your Hypothesis  
  Your hypothesis fails because the cosmic-time case *forces a substantive choice*, exposing that "exists" isn’t merely ambiguous. If cosmology/physics confirms a dynamically privileged foliation (e.g., from quantum gravity), the presentist claims it as *real temporal structure*, while the eternalist must either:  
  (A) Accept it as physical but ontologically inert (reducing it to a "variable"), which appears *ad hoc*—why privilege spatial ontology when physics privileges time?  
  (B) Deny its physical salience, contradicting science.  
  This forces eternalists into a methodological corner: they must argue that *even physically fundamental temporal asymmetry* doesn’t warrant presentism, revealing an implicit bias toward spatializing ontology. Conversely, presentists leverage this to argue their view *better respects physical explanation* (e.g., grounding causal arrows). The dispute thus becomes substantive: is temporal hierarchy part of reality’s fabric or an illusion? If "exists" were purely verbal, both could accept the foliation without ontological implications—but they can’t.  

  ### (iii) Progress and Weakness  
  **Progress** requires:  
  - **Distinguishing fundamentality dimensions**: Formalizing whether "existence" concerns *quantification scope* (eternalism) or *grounding relations* (presentism). A model showing how one framework reduces the other’s primitives could clarify incompatibility.  
  - **Empirical-theoretical synergy**: If quantum gravity confirms a foliation, philosophers must articulate why it does/n’t warrant temporal privilege. Does fundamentality require *observability*, *causal efficacy*, or *lawhood*?  
  - **Reframing the question**: Shift from "what exists?" to "what makes temporal facts *true*?" If grounding past truths requires only present structures (e.g., laws), eternalism gains ground; if not, presentism does.  

  **Why progress might fail**: Entrenched stances may ignore distinctions, treating ontology as bedrock intuition. The diagnosis’s weakness is its inability to *prescribe* which stance is prior—e.g., why privilege grounding over quantification? This merely relocates the stalemate to metaontology. Yet cosmic time *does* support your hypothesis: it shows that "privileged structure" alone doesn’t resolve the dispute because the core clash is metaontological. The foliation becomes a Rorschach test for prior commitments.
