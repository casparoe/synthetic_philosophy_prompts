prompt: |-
  I'm assembling a set of teaching cases on allocation under scarcity, in the lifeboat idiom, and for the past two years I've been logging my co-instructor's verdicts as she gives them — she has now ruled on something like forty variations. I have a new case I want to use, and I'd like to know what she will say about it before I put it to her. More usefully, I'd like to know what rule she is running: everything she has said so far is jointly consistent with several rules that come apart on this case, and I don't trust myself to work out which.

  Here are the five verdicts I take to carry the information. In every case, eject means put a passenger over the side by force, against their will, with no consent and no prior agreement among those aboard; in every case the boat is taking water and the alternatives are ejecting someone or risking foundering.

  1. Ten aboard. Unless one goes over, the boat founders within minutes and all ten drown; if one goes over, the other nine survive. All are strangers, equally healthy, no one at fault. No straws, coins, or other randomizer is available, and in practice the three strongest would simply choose — and they would choose the oldest passenger. Verdict: no one may be ejected; they should all go down.

  2. As in 1, except that a proper lottery is available. Verdict: they should draw lots, and the loser may be put over; nine lives rather than none.

  3. Twelve aboard. The boat will hold out until rescue only if one seat is freed. One passenger has injuries that will kill him within the hour whatever anyone does; the others will all survive if the boat holds out. Verdict: the injured man goes over, no lottery needed, and insisting on one would be a kind of fetish.

  4. Ten aboard. One passenger deliberately loosened a plank the night before, hoping to cover a theft; the boat is leaking because of him, and it founders within the hour unless one goes over. Verdict: the saboteur goes over, no lottery needed.

  5. Eight aboard. One passenger is in a panic, thrashing at the gunwale, and will capsize the boat within minutes. There is no way to sedate or restrain him, and no other passenger's removal would help. Verdict: he may be put over, even though he is at fault for nothing — as she put it, it is he who will capsize the boat.

  She has also said, generally, that she distrusts any rule under which the people who end up surviving get to decide who dies.

  The new case. Eight aboard; rescue is expected in about six hours. With eight aboard there is roughly a 70 percent chance of foundering before rescue and all hands lost; with any seven aboard, about 20 percent — the passengers are close enough in weight that it does not much matter which one goes. A, aged 34 and healthy, climbed aboard against the crew's express order after being told the boat was at capacity; his weight is the last increment, he meant no harm, and he has not damaged the boat. B, aged 76, has a heart condition and perhaps five years of expected life remaining against A's forty-odd, but a good chance of surviving the six hours if the boat stays afloat. The other six are healthy adults of middle age, none at fault. A lottery is possible but would require the bailing to stop for twenty minutes, which the crew puts at about five percentage points of additional risk. Alternatively the decision can be deferred an hour, at about two points of additional risk, by which time they will know whether the leak is worsening.

  So: does she eject A, eject B, run the lottery anyway, eject no one, or wait? Please give me the verdict you expect with a rough confidence, then the rules that fit the whole track record and what each predicts here — my own guesses are a lexical-responsibility rule, a least-to-lose rule keyed to what is at stake, a procedural rule requiring equal chances, and a rule on which merely probabilistic benefit can never license killing, but I don't know which of these she is running or whether the real one is something I haven't listed. Note that no single passenger's presence is necessary or sufficient for foundering here, so whether A is the threat in the sense of case 5 is itself part of what is at issue, and treat waiting as a distinct verdict rather than folding it into one of the others. Then give me the single further case — as minimal a variation as you can manage — that would best separate the leading candidates, and tell me, if the track record genuinely underdetermines the answer, what she would be committing herself to under each resolution.
reasoning: |-
  Hmm, the user is presenting an intricate ethical puzzle about lifeboat allocation rules based on a co-instructor's past verdicts. They want me to predict how she'll rule on a new case involving passengers A and B, and identify the underlying ethical principle she's following. 

  First, let me analyze the existing verdicts carefully. Case 1 establishes that involuntary ejection isn't permitted without a lottery, even to save lives. Case 2 shows that with a fair lottery, ejection becomes permissible. Case 3 allows ejection without lottery when the person is already dying. Case 4 permits ejection for culpability (sabotage). Case 5 allows ejection when someone's actions directly endanger others, even without fault.

  The co-instructor clearly rejects utilitarian "greater good" arguments without procedural fairness, as shown by her distrust of survivors deciding who dies. She also makes distinctions between different types of "threat" - medical inevitability (case 3), culpability (case 4), and immediate behavioral threat (case 5). 

  Now for the new case: A is the unauthorized but non-malicious addition, B has reduced life expectancy. Neither is actively threatening like case 5. The probabilistic nature (70% vs 20% risk) is new - past cases had certain outcomes. The lottery carries a 5% additional risk, waiting has 2% risk.

  I think she'll reject immediate ejection of either A or B. Ejecting B would violate the "no least-to-lose rule" implied by case 1 (where the oldest wasn't ejected). Ejecting A might seem tempting as he's "at fault" for boarding, but case 4 required deliberate harm, not just rule-breaking. The probabilistic benefit can't override her aversion to non-consensual killing as seen in case 1.

  Her options are: run lottery despite risk, wait, or do nothing. I predict she'll recommend waiting an hour (2% risk) to gather more information. This aligns with her cautious approach in case 1 and avoids unnecessary lottery risk. If the leak worsens, she might then accept a lottery.

  For the underlying rule: it's not purely utilitarian, nor proceduralist, nor responsibility-based. It's closer to a "necessity principle" with strict constraints: killing requires either consent (via lottery), culpability, or unavoidable immediate threat. Mere statistical benefit doesn't suffice.

  To distinguish between possible rules, I'd propose a variant where the probabilistic benefit is certain (e.g., 100% death vs 100% survival if one is ejected), but no threat, fault, or dying person exists. Her ruling there would reveal whether she ever permits non-consensual ejection absent those factors.
answer: |-
  Based on the track record and stated principles, here's the analysis:

  **Predicted Verdict:**  
  **She waits an hour (defer decision).**  
  *Confidence:* ~85%.  

  ### Why Waiting?
  1.  **No Grounds for Ejection Without Lottery/Threat:** Cases 1 & 5 establish that mere probabilistic benefit (even near-certainty in Case 1) or being the cause of scarcity without fault (A boarding) is insufficient for non-consensual ejection. Case 5 required an *immediate, unavoidable, active threat* (thrashing passenger). Neither A nor B fits this.
  2.  **Lottery Risk is Problematic:** While she endorses lotteries (Case 2), adding a 5% absolute risk (halting bailing) for a procedure is significant and likely violates the principle of minimizing harm/risk without clear necessity. Case 3 rejects lotteries as "fetishistic" when unnecessary; here, the lottery *itself* creates notable risk.
  3.  **Deferral Minimizes Immediate Harm & Gathers Info:** Waiting an hour (only +2% risk) aligns with her cautious approach. It avoids the moral hazard of survivors choosing (distrusted principle) or the risk of the lottery procedure. Crucially, it provides vital information: if the leak worsens, the risk calculus changes, potentially justifying a lottery later under clearer imminent threat (closer to Case 1/2). If it doesn't worsen, the lower risk might be deemed acceptable without ejection.
  4.  **No Other Option Fits:** Ejecting A (fault-light) is weaker than Case 4 (deliberate sabotage). Ejecting B (least-to-lose) is explicitly rejected by Case 1 (oldest not ejected) and clashes with Case 3 (only the *already dying* was ejected without lottery on "least-to-lose-ish" grounds). Doing nothing ignores the significant risk reduction from removing one passenger. Running the lottery now adds unacceptable procedural risk.

  ### Rules Consistent with Track Record & Predictions
  1.  **Strict Proceduralism with Imminent Threat/Consent Override:**
      *   **Rule:** Killing requires either (a) a fair lottery where all consent to the *procedure*, or (b) an immediate, unavoidable threat posed *by the specific person* to be killed (Case 5), or (c) the person is already dying regardless and their death saves others (Case 3). Mere probabilistic benefit or fault (short of direct, immediate threat or sabotage causing the *current* crisis) is insufficient without lottery consent. Adding significant risk *to conduct the lottery* invalidates option (a).
      *   **Prediction:** Wait. No immediate threat (A isn't actively threatening like Case 5, B isn't a threat). Fault (A boarding) insufficient without active threat/sabotage. Lottery risk too high. Deferral is prudent.
      *   **New Case Prediction:** Eject no one. Waiting preserves life and avoids non-consensual killing.

  2.  **Necessity Principle with Culpability/Threat Focus:**
      *   **Rule:** Killing is only justified if *strictly necessary* to counter an *immediate threat* (Case 5), eliminate an *unavoidably dying person* who is the *source* of the problem (Case 3), or punish *culpability directly causing the lethal scarcity* (Case 4). Probabilistic benefit alone is never sufficient (Case 1). Lotteries are permissible only when necessity requires *someone* die, but no specific threat/culpability/dying person exists *and* the procedure itself isn't overly risky (Case 2).
      *   **Prediction:** Wait. No immediate threat (A boarding created scarcity but isn't actively threatening; B isn't a threat). A's fault is too weak (not sabotage). B isn't unavoidably dying *within the crisis timeframe* (6hrs vs Case 3's <1hr). Lottery adds risk. Necessity isn't immediate/certain enough.
      *   **New Case Prediction:** Eject no one. Risk isn't certain death, no immediate threat exists.

  3.  **Hybrid Rule: Lexical Priority of Consent/Threat over Utility:**
      *   **Rule:** Rules 1 & 2 are paramount: Consent (via lottery) or specific Threat/Culpability/Dying Person. Only if these are satisfied can utility (number saved, life-years) be considered *within that subset*. Probabilistic benefit alone never justifies killing (Case 1). High procedural risk invalidates lottery as a consent mechanism.
      *   **Prediction:** Wait. No valid consent/threat/culpability/dying-person pathway exists *yet* to trigger utility considerations. Deferral is the only option respecting the lexical priority.
      *   **New Case Prediction:** Eject no one. The core necessary conditions aren't met.

  **Why Least-to-Lose & Pure Probabilistic Rejection Don't Fit Alone:**
  *   **Least-to-Lose (e.g., QALYs):** Contradicted by Case 1 (didn't eject oldest). Case 3 *can* be explained by least-to-lose (dying man loses least), but it's secondary to him being *already dying*.
  *   **Pure Probabilistic Rejection:** Explains Case 1. But contradicted by Cases 2, 3, 4, 5 where killing *is* permitted based on certainty (Case 2/3/4) or immediate necessity (Case 5). She clearly accepts killing *under specific conditions*.

  **The Crucial Differentiating Case:**
  *   **Scenario:** Ten aboard. Foundering is *certain* within 1 hour unless 1 is ejected. If 1 is ejected, survival is *certain* for the other 9. All are strangers, equally healthy, no fault, no immediate threat like thrashing, no one dying imminently. A lottery *is* possible with *negligible* risk (e.g., drawing straws takes 10 seconds, risk increase is 0.01%).
  *   **Why it Separates:**
      *   **Strict Proceduralism/Necessity Principle/Hybrid:** **Run the Lottery.** Certain death vs. certain survival meets the threshold for a lottery (Case 2 analog). Negligible risk makes the procedure acceptable. No threat/culpability/dying person exists, so lottery is the *only* permitted pathway to killing.
      *   **Pure Probabilistic Rejection:** **Eject No One.** Mere numbers/certainty never justifies killing an innocent without consent.
      *   **Least-to-Lose (if still considered):** Would likely also run the lottery (save 9), but the track record (Case 1) already undermines this as the primary rule.

  **Underdetermination & Commitments:**
  The track record *is* consistent with Strict Proceduralism, Necessity Principle, or the Hybrid Rule. The new case prediction (Wait) is the same under all three. The "Crucial Case" above forces the distinction:

  1.  **If she runs the lottery in the Crucial Case:** She affirms that *certain, significant probabilistic benefit* combined with *minimal-risk procedure* justifies non-consensual killing via lottery. This aligns with Strict Proceduralism/Necessity Principle/Hybrid.
  2.  **If she ejects no one in the Crucial Case:** She commits to **Pure Probabilistic Rejection.** Killing an innocent is *never* justified *solely* by the outcome (saving more lives), even with certainty and a fair, riskless lottery. Consent or immediate threat/necessity/culpability is *absolutely required*. Case 2 must be reinterpreted as implicit consent assumed in agreeing to the lottery procedure.

  **Conclusion:** Your co-instructor's rule prioritizes procedural fairness (lottery with consent) or specific justifications (immediate threat, unavoidable dying person, direct culpability) over aggregate benefit. She rejects survivor decision-making and killing based solely on probability or life-expectancy calculations. For the new case, **waiting an hour** is the verdict most consistent with her cautious, principle-based approach, avoiding premature ejection or a risky lottery while gathering crucial information. The "Crucial Case" will definitively reveal if she accepts pure probabilistic benefit *when mediated by a near-riskless lottery*.
