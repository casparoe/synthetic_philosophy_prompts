answer: |-
  ### Activity Design: Revealing the Empirical Content of Utility Representation

  **Objective:** Students discover that the empirical content of utility representation lies solely in consistency conditions (revealed preference axioms), while cardinal utility values and menu-independent utilities are either non-unique or vacuous. The activity uses real choices with tangible stakes to highlight the philosophical distinction between descriptive power and bookkeeping.

  **Six Items & Attributes (Designed to Induce Context Effects):**  
  1. **Dark Chocolate (70% Cocoa):** Bitter, intense flavor. Described as "premium but acquired taste."  
  2. **Milk Chocolate:** Smooth, sweet, and creamy. Described as "classic crowd-pleaser."  
  3. **Salted Pretzels:** Crunchy, savory snack. Described as "salty and satisfying, but plain."  
  4. **Gel Pen Set (5 colors):** Vibrant, fun writing tool. Described as "colorful and expressive, but niche."  
  5. **Basic Highlighter (Yellow):** Practical, no-frills stationery. Described as "useful but boring."  
  6. **Pocket Notebook (30 pages):** Compact and utilitarian. Described as "handy but small—limited pages."  

  *Why these attributes?*  
  - **Dark/Milk Chocolate:** Close substitutes; adding Pretzels (savory) may trigger compromise effect (flipping preference between chocolates).  
  - **Gel Pen/Highlighter:** Gel pens dominate in appeal, but adding Notebook may cause attraction effect (Highlighter chosen as "safe" option).  
  - Pretzels and Notebook are "decoys" in key menus to induce choice reversals.  

  ---

  ### Menu Schedule & Record Sheets  
  **Total Time:** 90 minutes  
  **Materials:**  
  - Projector for menus.  
  - Individual record sheets (one per student).  
  - Private ranking/rating sheets (one per student) + envelopes.  
  - Whiteboard for group work.  
  - Random number generator (for payout round).  

  **Record Sheet (Example):**  
  ```  
  Name: __________  
  Rank items 1 (best) to 6 (worst) and rate desire 0–10 on private sheet. SEAL in envelope.  

  Round 1 (5:05–5:07): {Dark Chocolate, Milk Chocolate} → Choice: _______  
  Round 2 (5:07–5:09): {Dark Chocolate, Milk Chocolate, Pretzels} → Choice: _______  
  Round 3 (5:09–5:11): {Gel Pens, Highlighter} → Choice: _______  
  Round 4 (5:11–5:13): {Gel Pens, Highlighter, Notebook} → Choice: _______  
  Round 5 (5:13–5:15): {Dark Chocolate, Gel Pens} → Choice: _______  
  Round 6 (5:15–5:17): {Milk Chocolate, Pretzels} → Choice: _______  
  Round 7 (5:17–5:19): {Gel Pens, Notebook} → Choice: _______  
  Round 8 (5:19–5:21): {Dark Chocolate, Milk Chocolate, Gel Pens, Highlighter} → Choice: _______  
  ```  
  *Notes:*  
  - Rounds 1–2 and 3–4 are critical for reversals (compromise/attraction effects).  
  - Rounds 6–7 provide an independent route to failure (intransitivity risk if Pretzels > Milk Chocolate in Round 6, but Gel Pens > Notebook in Round 7, then Dark Chocolate > Gel Pens in Round 5 could contradict choices).  
  - Round 8 tests choices in larger menus.  

  **Private Ranking/Rating Sheet:**  
  ```  
  Rank items 1 (most wanted) to 6 (least wanted):  
  1. Dark Chocolate: Rank ___  
  2. Milk Chocolate: Rank ___  
  3. Pretzels: Rank ___  
  4. Gel Pens: Rank ___  
  5. Highlighter: Rank ___  
  6. Notebook: Rank ___  

  Rate desire for each (0 = no desire, 10 = maximum desire):  
  Dark Chocolate: ___   Milk Chocolate: ___   Pretzels: ___  
  Gel Pens: ___   Highlighter: ___   Notebook: ___  
  ```  
  *Instructions:* "Seal in envelope after filling. Do not open until instructed."  

  ---

  ### Minute-by-Minute Plan  
  **0–5 min: Setup**  
  - Distribute record sheets and private ranking/rating sheets.  
  - *Instructions:* "You'll make 8 choices from item sets. One round will be randomly selected at the end—you’ll receive the item you chose in that round. First, privately rank and rate all 6 items. Seal the sheet in an envelope. Write your name on it. Do not discuss choices."  
  - Start timer; students complete ranking/rating and seal envelopes. Collect envelopes.  

  **5–25 min: Choice Rounds**  
  - Project menus in order. Display each for 2 minutes.  
  - *Instructions:* "Write your choice for each round. No talking. Go with your gut."  
  - *Facilitator:* Keep time strictly. If students ask questions: "Do what feels right."  

  **25–30 min: Random Selection & Group Assignment**  
  - Use RNG to select payout round (1–8). Announce: "Round #__ will be paid out at the end."  
  - Divide into 5 groups (3 students/group). Assign each group one student’s record sheet (groups analyze data from their own members).  

  **30–45 min: Group Work I (Menu-Independent Utility)**  
  - *Task:* "Assign one utility number to each item so that in every menu, the student’s chosen item has the highest utility. Write utilities on the whiteboard. If impossible, write why."  
  - *Facilitator:* Circulate. If groups ask: "Utilities must be the same in all menus." If a group uses menu-dependent utilities prematurely: "Restrict utilities to be fixed per item for now."  

  **45–50 min: Group Report I**  
  - *Facilitator:* Poll groups: "Raise hand if you found a utility function." Then, "Raise hand if it was impossible."  
  - Ask one failing group: "What stopped you?" Expect: "In Round 1, they chose X over Y, but in Round 2, they chose Y over X with Z added."  
  - Ask a second failing group (if any): "What was your issue?" (Backup: Intransitivity, e.g., "In Round 6, Pretzels > Milk Chocolate; Round 7, Gel Pens > Notebook; but Round 5, Dark Chocolate > Gel Pens—contradicts if Pretzels > Notebook.").  

  **50–55 min: Group Work II (Menu-Dependent Utility)**  
  - *Task:* "Now allow utilities to change per menu. Assign utilities for each menu so the chosen item has the highest utility in that menu. Do this quickly."  
  - *Facilitator:* Most groups will assign 1 to chosen item and 0 to others instantly.  

  **55–60 min: Group Report II**  
  - *Facilitator:* "How long did this take? What’s the difference between the two tasks?"  
  - *Guide discussion:* Students note menu-dependent fitting is trivial and always possible (no empirical content). Contrast with first task’s failure (empirical content = consistency).  

  **60–70 min: Cardinal Utility & Intensity Ratings**  
  - *For consistent groups:* "Write your utilities on the board. Compare with another group."  
  - *Facilitator:* Pick two groups with identical rankings but different cardinal scales (e.g., Group A: Dark Chocolate=10, Milk Chocolate=9; Group B: Dark Chocolate=100, Milk Chocolate=50). Ask: "Which is correct? Can choices settle this?"  
  - Distribute sealed envelopes. *Task:* "Open envelopes. Compare your private intensity ratings to your group’s utilities. Do they match?"  
  - *Expected realization:* Choices only reveal ordinal rankings; cardinal values are arbitrary.  

  **70–80 min: Closing Sting (Welfare Maximization)**  
  - *Task:* "Only 3 items can be stocked. Your group must pick 3 to maximize total welfare. Use all choice/ranking data from all students."  
  - Assign:  
    - Group 1 (ordinal): "Use only rankings. Assign points: 5 for 1st, 4 for 2nd, ..., 0 for 6th. Sum points per item; pick top 3."  
    - Group 2 (cardinal): "Use the utility numbers from Group Work I. Sum utilities per item; pick top 3."  
  - *Facilitator:* Ensure groups work independently.  

  **80–85 min: Report & Contrast**  
  - Groups report chosen items. *Likely outcome:*  
    - Group 1 (ordinal) picks, e.g., {Dark Chocolate, Milk Chocolate, Gel Pens}.  
    - Group 2 (cardinal) picks, e.g., {Dark Chocolate, Gel Pens, Highlighter} (due to arbitrary scaling).  
  - *Facilitator:* "Why the difference? What’s missing?"  

  **85–90 min: Payout & Wrap-Up**  
  - Distribute items from the randomly selected round.  
  - *Transition to debrief:* "Next class, we’ll discuss what this reveals about utility theory."  

  ---

  ### Debrief Guide (Post-Activity)  
  *Sequence and Key Philosophical Points:*  
  1. **Choice Reversals (e.g., Round 1 vs. Round 2):**  
     - "When your choices flipped after adding Pretzels, you violated *independence of irrelevant alternatives* (IIA). This is part of the *weak axiom of revealed preference*."  
     - *Point:* Empirical content of utility representation lies in consistency axioms. Violations mean no utility function exists.  

  2. **Intransitivity (e.g., Rounds 5–7):**  
     - "If Pretzels > Milk Chocolate, Gel Pens > Notebook, and Dark Chocolate > Gel Pens, but Pretzels < Notebook, choices are intransitive."  
     - *Point:* Axioms like transitivity are testable; failures reveal empirical boundaries.  

  3. **Menu-Dependent Utility:**  
     - "When utilities could change per menu, fitting became trivial. But this ‘utility’ is just a redescription of choices—it doesn’t predict or explain anything new."  
     - *Point:* Without consistency requirements, utility representations are vacuous (bookkeeping).  

  4. **Cardinal Non-Uniqueness:**  
     - "Two groups assigned different numbers to the same rankings—yet both ‘fit’ the choices. Your intensity ratings didn’t match the arbitrary scales."  
     - *Point:* Choices only reveal *ordinal* rankings. Cardinal utilities require additional assumptions (e.g., strength of desire), not revealed by choices alone.  

  5. **Welfare Aggregation Failure:**  
     - "Groups recommended different items because ordinal data lacks interpersonal comparability. Cardinal sums depend on arbitrary scaling."  
     - *Point:* Welfare economics requires cardinal, interpersonally comparable utilities—choice data doesn’t provide this.  

  ---

  ### Predictable Challenges & Solutions  
  1. **Students perform consistency:**  
     - *Risk:* Students infer the experiment and make "rational" choices to avoid reversals.  
     - *Mitigation:* Use ambiguous items (e.g., chocolates vs. stationery) and time pressure to encourage intuitive choices. Pilot menus to ensure reversal likelihood. If no violations occur, use pre-seeded inconsistent data from the pilot as a backup.  

  2. **"People are irrational" conclusion:**  
     - *Risk:* Students attribute failures to irrationality, missing the philosophical point.  
     - *Mitigation:* In debrief, clarify: "This isn’t about rationality. It’s about what choices can reveal. Violations show the *axioms* are empirical—not that people are flawed."  

  3. **Premature menu-dependent utility:**  
     - *Risk:* Groups assign menu-dependent utilities in Group Work I.  
     - *Solution:* Intervene: "For this task, utility must be fixed per item. Save menu adjustments for later."  

  4. **Too-consistent class:**  
     - *Contingency:* If piloting reveals high consistency, add a "tiebreaker" round where students must justify choices aloud (inducing overthinking and reversals). If still consistent, skip to cardinal non-uniqueness and welfare: "Even if consistent, choices don’t reveal cardinal strength or resolve interpersonal comparisons."  

  ---

  ### Limitations & Unstaged Features  
  The activity *cannot* stage:  
  1. **Risk and Cardinal Utility:**  
     - Choices involve no uncertainty. Cardinal utility is necessary for decisions under risk (e.g., von Neumann-Morgenstern), but this activity only addresses certainty.  
     - *Debrief assertion:* "Under risk, we need cardinal utility to model choices—but that requires additional assumptions beyond revealed preference."  

  2. **Preference as Cause vs. Redescription:**  
     - Activity treats preference as derived from choices (descriptive). It cannot explore preference as a psychological cause.  
     - *Debrief assertion:* "Revealed preference theory doesn’t assume preferences *cause* choices; it *defines* preferences *by* choices."  

  3. **External Validity:**  
     - Snacks/stationery trivialize welfare. Real policies involve incommensurable goods (e.g., health vs. income).  
     - *Debrief assertion:* "We cannot extrapolate from toy examples to policy. Real welfare analysis requires ethical and empirical considerations beyond choice data."  

  ---

  **Final Note:** This activity isolates the "empirical vs. bookkeeping" distinction through guided discovery. The debrief must explicitly connect the dots to philosophy of economics, as the activity simplifies complex topics (e.g., no uncertainty). Run the pilot with non-philosophy students to test reversal rates and timing.
