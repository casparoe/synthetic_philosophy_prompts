prompt: |-
  Hey — I'm mid-way through the third chapter of my diss (STS, on how automation gets narrated in two centuries of labour-movement writing) and I keep loosing the thread whenever I try to say what a Marxist account of automation would even have to *do* to count as adequate. Everyone reaches for the same two or three passages, then jumps straight to a verdict about AI, and I can't tell anymore whether the disagreements are about facts or about what the theory is for. So help me write the spec, not the verdict.

  Fix the purpose first, and fix it narrowly: I want a theory good enough to advise a union federation that has to decide, about one specific new technology in one specific sector, whether to fight its introduction, demand a shorter week alongside it, or welcome it. Not a philosophy of history — a theory for a decision. Under that purpose, give me the list of desiderata, each with the case or consideration that makes it a requirement, and each tagged load-bearing / nice-to-have / camp prejudice.

  Things I think are in the running as requirements, which you should sift rather than just ratify:

  - it has to distinguish machinery as such from machinery under capitalist relations, without that distinction becoming an excuse for saying nothing predictive;
  - it has to generate, from one mechanism, both the displacement of labour and the creation of new tasks that pull labour back in — i.e. the same story should be able to produce a shrinking and a growing demand for the same kind of worker;
  - it has to handle automation introduced primarily for control rather than productivity: the case where a machine is installed at a net output loss because it breaks a craft's grip on the pace and content of work;
  - it has to handle what I'd call the apprenticeship cliff: automation removes the low-level work through which a skill is transmitted, everything looks fine for a generation, and then the tacit knowledge needed to maintain and repair the system is simply gone and the productive force itself decays. Does a theory of automation need to be able to represent a productive force that deteriorates, or is that a separate story about education?
  - it has to handle phantom automation: capital is invested in the *credible announcement* of automation, workers concede on work rules and pay, and the machines partly or never arrive. Is a theory that only tracks materially realised automation adequate, given that the political effects occur anyway?
  - it has to handle captive time: automation frees ninety minutes a day, and the ninety minutes are reabsorbed as unpaid standby, on-call availability, and fragmented attention, so the time exists but isn't free. Can the theory count that as intensification, or does its notion of freed time only track the formally contracted day?
  - it has to handle the refused machine: a workforce, through its own organisation, demands that dangerous or humiliating labour be mechanised, and capital declines because the labour is cheaper than the machine. Whose instrument is automation meant to be here?
  - it has to handle fictitious machinery: the system presented as automating a task is, behind an interface, a crowd of underpaid people doing it. If the theory can't tell the difference, its concept of machinery isn't doing any work.
  - it has to say what would count as the emancipatory upshot — shorter working time, worker control over the design and pacing of the technology, or simply more goods — and take a stand on whose judgement settles it;
  - it has to stay consistent with the boring background facts: long-run real wage growth, no collapse in aggregate employment, occupational polarisation, long stretches where heavy investment in information technology produced disappointingly little measured productivity growth;
  - it has to handle the global dimension, where automation in one region throws a workforce in another into superfluity, or conversely makes offshoring unprofitable;
  - and it has to be able to say something about the *discourse* — why both enthusiasm and panic about automation recur on schedule — without that something collapsing into "they've been duped."

  Some of those I suspect are just things one sub-literature wants rather than genuine requirements. I'm thinking especially of the demand that any technology raised to the status of a productive force must also be describable as a fresh act of dispossession, and the demand that the forces of production never be allowed to be the engine of the story. If I've misidentified which ones are the prejudices, say which and why — that sorting is half of what I want.

  Then the part I care most about: name the subset of the load-bearing requirements that you think cannot be jointly satisfied, and show it. My own hunch is that there's a real incompatibility between "generate displacement and reinstatement from a single mechanism" and "be usable for a decision about one technology in one firm," because the first operates at the level of the system and the second at the level of a workplace, and I'm not convinced the bridge between them is licit. But if the actual contradiction is somewhere else, argue for that instead.

  Also: which single requirement does the most exclusionary work — the one that, if you dropped it, lets back in a reading you think is clearly inadequate? And if you want, a short scorecard at the end: a few lines each on the productivist reading (automation as the material preparation for something better), the labour-process and deskilling reading, the general-intellect and immaterial-labour reading, and the convivial-tools or neo-Luddite one. Only if it doesn't eat the space — the list is the deliverable, and no reading lists or citations, I've got the canon and I can't look anything up from where I'm sitting.
reasoning: |-
  Okay, the user is deep into their dissertation on how labor movements narrate automation over two centuries. They're stuck on defining what makes a Marxist account of automation "adequate." Specifically, they want a theory that can guide a union federation in deciding whether to fight, negotiate (like demanding shorter work weeks), or welcome a specific new technology in a specific sector. They provided a list of potential requirements and want help sifting through them to identify which are essential, which are nice-to-have, and which might be biases.

  First, I need to understand their core request. They're not looking for philosophical debates but a practical decision-making tool. Their list includes things like distinguishing machinery under capitalism from machinery in general, explaining both job displacement and creation, handling control-focused automation, apprenticeship cliffs, phantom automation, captive time, refused machines, fictitious machinery, defining emancipatory outcomes, consistency with historical facts, global dimensions, and discourse analysis.

  I should categorize each desideratum as load-bearing, nice-to-have, or camp prejudice. Load-bearing ones are crucial for the theory's functionality. Nice-to-haves add value but aren't essential. Camp prejudices reflect specific ideological stances that might not be necessary for the practical purpose.

  Looking at their list:
  - **Distinguishing machinery under capitalism vs. generally**: This is load-bearing because a Marxist theory must critique capitalist relations without dismissing technology itself. Otherwise, the analysis lacks specificity.
  - **Single mechanism for displacement and reinstatement**: Also load-bearing. A theory that only explains job loss without addressing job creation isn't useful for unions making decisions. It needs to show both sides dynamically.
  - **Automation for control**: Load-bearing. Real-world examples like factories using machines to deskill workers for control purposes are common. Ignoring this would make the theory inadequate for practical advice.
  - **Apprenticeship cliff**: Nice-to-have. While important for long-term skill erosion, it's more about education systems than immediate union decisions. Unions might address this through training demands, but it's not core to the decision framework.
  - **Phantom automation**: Load-bearing. The threat of automation alone affects labor negotiations. A theory that only considers implemented tech would miss this strategic aspect, crucial for unions.
  - **Captive time**: Load-bearing. Modern work often involves unpaid standby time post-automation. The theory must account for intensified labor or reabsorbed time to advise on work conditions.
  - **Refused machine**: Nice-to-have. It's an edge case where workers push for automation but capital refuses. Important for power dynamics but less frequent. Unions might prioritize more common scenarios.
  - **Fictitious machinery**: Nice-to-have. While relevant to tech like AI (e.g., hidden human labor), it's more about exposing fraud. The core theory can handle real automation's effects without this.
  - **Emancipatory upshot**: Load-bearing. The theory must define success (shorter hours, control, etc.) to guide union goals. Also, specifying whose judgment matters (workers) aligns with Marxist principles.
  - **Consistency with historical facts**: Load-bearing. Ignoring real-world data like wage growth or productivity paradoxes makes the theory unrealistic and useless for practical advice.
  - **Global dimension**: Load-bearing. Automation's effects are global; e.g., offshoring or regional job loss. Unions need to consider broader impacts, especially in interconnected economies.
  - **Handling discourse**: Nice-to-have. Understanding recurring automation hype is valuable for strategy but secondary to the immediate decision. Unions can address narratives tactically without it being central.

  Now, camp prejudices: The user mentioned two potential biases—insisting technology is always dispossession and denying productive forces as drivers. These aren't necessary for the practical purpose. A theory can acknowledge productive forces without reducing everything to dispossession. Including them would limit the framework's applicability, so they're prejudices to avoid.

  Next, the user suspects an incompatibility between the single-mechanism requirement (system-level) and advising on a specific technology (workplace-level). I agree. The system-level dynamics (e.g., job creation in new industries) don't directly translate to a single workplace. For instance, automating one job might displace workers locally without immediate reinstatement elsewhere. The theory might need to incorporate feedback loops between firm decisions and systemic effects, but this remains a tension. The contradiction is real here.

  The most exclusionary requirement is **distinguishing machinery under capitalism**. If dropped, the theory could conflate technology's inherent traits with capitalist exploitation, leading to either techno-optimism or Luddism. Keeping it ensures a critical, materialist analysis essential for Marxist framing.

  For the scorecard:
  - **Productivist reading**: Focuses on automation as progress for abundance. Overlooks control and captive time, making it inadequate for union advice as it ignores power dynamics.
  - **Labour-process reading**: Highlights deskilling and control. Strong on firm-level issues but weak on global aspects and discourse, which are also important.
  - **General-intellect reading**: Emphasizes knowledge economy and immaterial labor. Too abstract for specific union decisions and ignores tangible aspects like productivity stats.
  - **Convivial-tools reading**: Advocates for human-centered tech. Useful ethically but not actionable for unions facing immediate capitalist pressures; lacks systemic analysis.

  In summary, the load-bearing requirements form a core framework for practical decision-making, while acknowledging tensions like the system-vs-firm divide. The user needs a focused, actionable theory that balances Marxist critique with real-world applicability for labor strategy.
answer: |-
  Here's a distilled specification for a Marxist theory of automation, purpose-built for advising a union federation on a specific technology in a specific sector. I've sifted your desiderata rigorously, categorizing each as **load-bearing** (essential for the theory's practical function), **nice-to-have** (adds depth but not core to the decision), or **camp prejudice** (ideological baggage that risks distorting the analysis). I then identify key tensions and exclusions.

  ---

  ### **Desiderata Sorted & Categorized**
  1. **Distinguish machinery-in-itself from machinery-under-capitalism**  
     *Why load-bearing*: Without this, the theory can’t advise whether to fight *capital’s use* of tech or tech itself. Must show how relations shape outcomes (e.g., automation causing layoffs vs. shorter hours under worker control).  
     *Case*: CNC machines used to deskill machinists vs. worker-cooperatives using them to reduce drudgery.

  2. **Generate displacement + reinstatement from one mechanism**  
     *Why load-bearing*: Unions need to assess if job loss is permanent or if reinvestment might create new roles. A theory that only predicts doom or utopia is useless.  
     *Case*: ATMs displaced tellers but expanded retail banking roles. Must explain both from capital’s drive to cheapen labor while expanding production.

  3. **Handle control-driven automation (net output loss)**  
     *Why load-bearing*: Common in labor history (e.g., textile mills automating to break weavers’ power). Ignoring this misdiagnoses capital’s motives and worker vulnerability.  
     *Case*: Amazon’s surveillance tech: costs more than saved labor but enforces pace.

  4. **Apprenticeship cliff (skill erosion)**  
     *Why nice-to-have*: Critical long-term but not urgent for *immediate* union decisions. Falls under "reproduction of labor power," a separate (though linked) module.  
     *Case*: Decline of elevator repair skills after automated diagnostics; handled via training demands, not core automation theory.

  5. **Phantom automation (announcement effects)**  
     *Why load-bearing*: Capital’s *threat* of automation shapes bargaining *now*. A theory ignoring this can’t advise on strategic bluffs (e.g., conceding wages preemptively).  
     *Case*: Auto unions accepting pay cuts fearing "lights-out factories" that never materialized.

  6. **Captive time (unpaid standby)**  
     *Why load-bearing*: If automation’s "freed time" is reabsorbed as intensified labor, the emancipatory claim fails. Theory must track *effective* dispossession of time.  
     *Case*: Nursing "automated" charting adding 2hrs of unpaid admin nightly.

  7. **Refused machine (capital rejects worker-demanded automation)**  
     *Why nice-to-have*: Reveals power dynamics but is edge-case. Unions prioritize fighting *imposed* tech, not demanding costly automation capital refuses.  
     *Case*: Meatpackers demanding safety robots; capital prefers cheap migrant labor.

  8. **Fictitious machinery (hidden labor)**  
     *Why camp prejudice*: While critical for critiquing "AI hype," a theory for *material* automation decisions doesn’t require this. Call it out as fraud, not a core function.  
     *Case*: "Automated" content moderation relying on traumatized clickworkers.

  9. **Define emancipatory upshot + whose judgment**  
     *Why load-bearing*: Unions need a benchmark for "success." Must specify: shorter workweek (measured in formal + informal labor time) as the key metric, judged by workers’ lived experience, not productivity stats.  
     *Case*: 4-day week with no standby duties > 10% wage hike with burnout.

  10. **Consistency with boring background facts**  
      *Why load-bearing*: A theory ignoring wage growth, productivity paradoxes, or polarization is untethered from reality. Must explain why automation doesn’t collapse employment (e.g., capital’s drive for new commodification frontiers).  
      *Case*: IT boom’s low productivity gains: theory must incorporate implementation lags and hidden labor costs.

  11. **Global dimension (offshoring/superfluity)**  
      *Why load-bearing*: Automation decisions ripple across supply chains. Advising a German auto union requires assessing if robotics reshores production or devastates Mexican suppliers.  
      *Case*: Automation in rich countries making offshoring obsolete, throwing Global South workers into precarity.

  12. **Handle discourse (recurring enthusiasm/panic)**  
      *Why nice-to-have*: Useful for strategy but secondary to material decision-making. Unions can leverage discourse awareness tactically (e.g., countering automation panic in bargaining).

  ---

  ### **Excluded Camp Prejudices**
  - **"Technology as dispossession" as mandatory**: Not load-bearing. Forces like automation *can* dispossess (e.g., enclosures), but insisting this is *always* true ignores cases where tech genuinely reduces toil (load-bearing desideratum #1 covers this nuance).  
  - **"Productive forces can’t drive history"**: Prejudice. Rejecting this allows the theory to acknowledge when tech *enables* emancipation (e.g., cheap renewables enabling post-scarcity) without determinism.

  ---

  ### **Key Incompatibility: The System/Workplace Bridge**
  Your hunch is correct. **The core tension is between desideratum #2 (displacement/reinstatement from one mechanism) and the workplace-level focus.**  
  - **Why they clash**: Displacement/reinstatement operates systemically via:  
    (a) **Reinvestment**: Profits from automation fund new sectors (e.g., auto job losses → call center boom).  
    (b) **Demand effects**: Cheaper goods increase demand, requiring more labor.  
  - **Workplace-level decisions can’t control these**: A union fighting warehouse robots can’t ensure reinvestment in their community. The "bridge" requires predicting aggregate capital behavior—unreliable for a single decision.  
  - **Consequence**: A theory for unions must **separate short-term workplace effects** (job loss, pacing, safety) from **long-term systemic outcomes** (reinstatement). It can advise: "Fight for shorter hours now; push for reinvestment in retraining *later*." But it can’t promise both from one mechanism at the firm level.

  ---

  ### **Most Exclusionary Requirement**
  **Desideratum #1 (machinery under capitalism vs. in-itself)**.  
  - **Exclusionary effect**: Dropping this lets in:  
    - **Techno-determinism**: "Robots *inevitably* cause unemployment" (ignoring how worker power could convert gains to shorter hours).  
    - **Neo-Luddism**: "All tech under capital is toxic" (making negotiation impossible).  
  - **Why it’s vital**: It forces the theory to isolate capital’s *deployment logic* (profit, control) from tech’s *potential*. Without this, the union can’t strategize "demand control over the tech" vs. "reject it entirely."

  ---

  ### **Scorecard of Major Approaches**
  - **Productivist Reading** (Automation as progress):  
    *Strengths*: Acknowledges forces can reduce toil.  
    *Gaps for purpose*: Ignores control motives (#3), captive time (#6); assumes gains automatically benefit workers. Inadequate for hard choices.  

  - **Labour-Process/Deskilling Reading** (Braverman):  
    *Strengths*: Best on control (#3), captive time (#6), apprenticeship (#4).  
    *Gaps for purpose*: Overlooks global effects (#11), reinstatement (#2); pessimistic about worker agency.  

  - **General Intellect/Immaterial Labour Reading** (Post-operaismo):  
    *Strengths*: Handles discourse (#12), fictitious tech (#8).  
    *Gaps for purpose*: Abstract; ignores boring facts (#10), refuses machines (#7); not actionable for local unions.  

  - **Convivial Tools/Neo-Luddite Reading** (Illich/Sale):  
    *Strengths*: Exposes phantom (#5), fictitious (#8) automation.  
    *Gaps for purpose*: Rejects #1 distinction; can’t advise *using* tech under capital; ignores global (#11) realities.  

  ---

  ### **Final Spec: Load-Bearing Core**
  A Marxist theory for union decisions **must** include:  
  1. Machinery under capitalism vs. in-itself.  
  2. Control-driven automation logic.  
  3. Captive time as dispossession.  
  4. Phantom automation’s strategic weight.  
  5. Shorter workweek (formal + informal) as emancipatory benchmark, judged by workers.  
  6. Global relocation of labor.  
  7. Consistency with historical trends (wages, polarization, productivity).  

  **Acknowledge the tension**: Workplace-level effects (displacement) are immediate; systemic reinstatement is indirect and unreliable for tactical decisions. Advise unions to:  
  - **Short-term**: Fight for shorter hours, retraining, and control over implementation.  
  - **Long-term**: Demand reinvestment mechanisms (e.g., automation taxes).  

  This keeps the theory actionable without false promises.
