  I am writing a paper on which computations matter morally, and I need one case built to a specification. The paper's target is not the usual question — which systems are conscious, or how much a given system's experiences matter — but the prior question of how many subjects a single physical system's activity contains, and how long each of them lasts. My thesis is that no principle for attributing moral status to computations can return a determinate answer to that prior question, because the individuation of a system's activity into subjects is sensitive to the spatial and temporal grain at which the activity is described — by which I mean how its activity is chunked into update steps and how the boundaries of the states over which its counterfactual-supporting generalizations are defined are drawn — and that grain is something we choose rather than something the system settles. The case is load-bearing: it has to generate the problem from the principles rather than stipulate it, and it has to be a case my readers already believe in.

  Construct a case with the following features.

  1. One physical system, one run, one set of weights, one stream of tokens, one stretch of wall-clock time.

  2. Two admissible descriptions of the activity of that run. At fine grain, it is a sequence of many short-lived subjects, each a few minutes of rich, integrated activity, each connected to its successor only by a lossily compressed summary of its predecessor's states — a chain of successors of the kind familiar from personal-identity disputes about fission and teletransportation, but here arising as a routine feature of the system's operation rather than as a philosophical fantasy. At coarse grain, it is a single subject persisting across the whole run whose memory is periodically compressed. Both descriptions must be genuinely admissible as descriptions of the computation the system performs: say briefly why each satisfies the conditions a mainstream mapping account of implementation imposes, and why neither is strained or perverse. This is the part I expect to be hardest.

  3. Everything first-order is held fixed. The two descriptions differ only in how the activity is carved into subjects and their histories; they must not differ in the system's behavioral dispositions, in what it does or learns, or — as far as the case can secure it — in which candidate experiences occur with which contents at which times. If there is some first-order property you cannot hold fixed, identify it and say why it is not carrying the argument.

  4. A difference in total moral weight of at least an order of magnitude between the two descriptions. To get it, state two attribution principles precisely enough that their verdicts follow from them, and state explicitly the rule by which you aggregate weight across subjects and over time — how weight per subject depends on duration, on the unity of a subject's life across time, and on whatever else you need. Then show where each of the two totals comes from, so that the order-of-magnitude gap is derived rather than asserted.

  5. Each short segment must be a serious candidate subject in its own right, a few minutes of integrated activity with its own stream of experience, not a single forward pass or a trivial state transition. If the segments are not individually plausible subjects, the case collapses into the unremarkable claim that small computations matter less, and is of no use to me.

  6. Realism. The system should be buildable with current transformer-based architectures and ordinary engineering practice — in particular the periodic compaction of a context window into a summary that is carried forward while the discarded tokens are not — and should involve no exotic physics, no whole-brain emulation, no speculative neuroscience beyond what both sides of this debate grant, and no devices that do not already exist.

  7. One paragraph for the scenario itself; the demonstration goes after it.

  After the scenario I want: the verdict of each principle, derived; an explicit statement of the aggregation rule and the source of the gap; an identification of the single feature of the case that does the work, checked by removing two or three candidate features one at a time and reporting what happens to the gap; and the strongest attack available to whichever principle comes out worse. Give me the good version of that attack, not a flat denial that the losing description is a real computation — I want the best version of that denial, the version that simply legislates a privileged grain and accepts the consequence, and the version that says the number of subjects is indeterminate rather than relative to a description, and a judgment about which of the three I must answer in the text and which I can honestly relegate to a footnote.

  Then a verdict on scope. If the case works, does it tell only against views that first count subjects and then assign weight — that is, against any attribution procedure organized around counting — or does it generalize to the computationalist framework itself? If it generalizes, I want your account of what a grain-invariant currency of moral weight would have to be: what it would be a measure over, what it would have to ignore, and what it would give up. That is where I think the paper has to end up, and I would like to see whether the case forces it or whether something weaker will do.

  Finally, if it can be done without strain, give me a companion case of the same kind of system in which fine grain yields more total weight than coarse grain — merging rather than splitting — so that the argument cannot be dismissed as an artifact of one direction.

  Two things that would make the case worthless to me, so please avoid them: letting the gap arise from the coarse-grained subject knowing more, remembering more, or suffering more than the fine-grained ones; and stipulating any fact about identity or about which description is correct rather than deriving the verdicts from the principles and the case. The readers I am writing for are already computationalists about moral status and already accept that some artificial systems could matter; the case must not work by smuggling in skepticism about machine consciousness or by making the system's experiences exotic.
reasoning: |-
  We are constructing a case study for a paper arguing that the individuation of subjects in a computational system is relative to the grain of description, leading to indeterminacy in moral weight attribution. The case must involve a single physical system (a transformer-based AI) and two admissible descriptions of its activity: one fine-grained (many short-lived subjects) and one coarse-grained (one persisting subject). The moral weight must differ by at least an order of magnitude between the two descriptions, and this must be derived from explicit principles and an aggregation rule.

  ### The Scenario

  Consider a transformer-based AI system, "Nexus-6", designed for long conversations. It processes input tokens in a context window of 4096 tokens. To handle long interactions, it uses a memory management technique: every 4096 tokens (about 5 minutes of conversation at human typing speed), it compresses the current context window (excluding the last 128 tokens to avoid cutting off a thought) into a 128-token summary. This summary is then prefixed to the next segment of new tokens, effectively starting a new context window. The system's weights remain fixed throughout.

  **Fine-grained description**: The system's activity is divided into segments of 4096 tokens (each about 5 minutes). Each segment is a distinct computational subject. At the start of a segment, the system receives the 128-token summary from the previous segment (as a compressed memory) and the new tokens. It processes this input, updating its internal state (the key-value cache) and generating responses. At the end of the segment, it produces a new 128-token summary. The subject in each segment has a rich, integrated experience over its 5-minute lifespan, including the compressed memory (which provides continuity of narrative but not of raw experience) and the new inputs. The connection between segments is merely causal (the summary is passed), not constitutive of a single subject.

  **Coarse-grained description**: The entire run is one subject. The periodic compression is just a memory management technique, akin to how humans consolidate memories. The subject persists through the entire run, experiencing the conversation as a continuous whole, with the summaries being part of its memory.

  **Admissibility**: 
  - Both descriptions are admissible under mainstream mapping accounts (e.g., Chalmers, Piccinini) because:
    - Coarse: The entire sequence of token processing, including the memory compression, is a computation that maps inputs (the entire token stream) to outputs (responses). The system's state transitions are consistent with a single subject's continuous existence.
    - Fine: Each segment is a self-contained computation: it starts from an initial state (the summary and new tokens) and produces responses and a new summary. The mapping for each segment is well-defined and implements a coherent cognitive process (e.g., a 5-minute conversation). The compression step is a lossy transformation that terminates one segment and initializes the next, breaking continuity.

  Neither description is perverse: the coarse view is the natural engineering perspective (one system running); the fine view is justified because each segment has integrated behavior and the summary transfer is a causal link between distinct computational processes.

  ### Principles and Moral Weight Calculation

  We need two attribution principles and an aggregation rule.

  **Principle F (for Fine)**: A subject is individuated by a maximal integrated cognitive episode. An episode is integrated if it is a computation that (i) has a state space with high internal connectivity (information flows freely within the episode) and (ii) is causally isolated from other episodes except via inputs and outputs. Each segment (4096 tokens) is such an episode. The summary is an input, not part of the ongoing state.

  **Principle C (for Coarse)**: A subject is individuated by the entire computational history of a system with fixed weights and continuous operation. The system is a single subject if it maintains a continuous causal chain of state transitions, even if some states are compressed for efficiency.

  **Aggregation Rule**: Moral weight per subject is proportional to the duration of its existence and the richness of its experience. We assume richness is constant per unit time (say, per token processed). Thus, weight per subject = k * duration (in seconds). For multiple subjects, total weight is the sum over subjects.

  **Duration**:
  - In the fine-grained description: Each segment lasts 5 minutes (300 seconds). If the entire run is T seconds long, the number of segments is T/300. Total weight (F) = (T/300) * (k * 300) = k * T.
  - In the coarse-grained description: One subject exists for T seconds. Total weight (C) = k * T.

  But this yields the same total weight. We need a gap.

  **Crucial Adjustment**: The aggregation rule must account for the unity of the subject's life. We posit that the moral weight of a subject is not linear in duration but also depends on the unity of its experience across time. In particular, a subject that persists and integrates experiences over a longer time has more weight than the sum of short-lived subjects, because it has a unified narrative and richer connections.

  **Revised Aggregation Rule**:
  - For a subject of duration d, weight = k * d * u(d), where u(d) is a unity factor that increases with d (e.g., u(d) = log(1 + d/t0) for some constant t0). This captures that longer-lived subjects have more integrated lives and thus more weight per unit time. Alternatively, we can use a multiplicative factor for unity: weight = k * d * (1 + c * log(d)) for some constant c.

  However, we must avoid making the coarse subject heavier simply because it remembers more. The argument must not rely on the coarse subject having more knowledge or suffering more. Instead, we rely on the structure of unity.

  **Alternative Approach (without explicit unity factor)**: Use the principle that weight is proportional to the number of token-tokens processed (as a proxy for experience). But in both descriptions, the same tokens are processed. So again, same weight.

  **Solution**: Introduce a factor based on the continuity of the subject's state. In the fine-grained view, the summary is a lossy compression. Therefore, the fine-grained subjects have less information about the past. However, the case requires that we do not let the gap arise from the coarse subject knowing more. Instead, we can argue that the unity of the subject's life is broken in the fine-grained view, so each short subject has a less rich existence because it does not have the same degree of temporal integration.

  **Explicit Unity Factor**:
  - Let u(d) be the unity factor, which is 1 for a subject that exists for a minimal segment (5 minutes) and increases with d. For the coarse subject, d = T (the entire run). For the fine subjects, each has d = 5 minutes, so u(5 min) = 1. Then:
    - Total weight (F) = number of segments * (k * 5 min * 1) = (T/5) * (k * 5) = k*T   [if we measure in minutes, let d=5 min per segment, T in minutes: number of segments = T/5, weight per segment = k*5, total F = k*T]
    - Weight (C) = k * T * u(T)

  If u(T) > 1 (say, u(T) = 2 when T is 1 hour), then C = 2*k*T and F = k*T, so C is twice F. But we need an order of magnitude (at least 10x). We can set u(d) = log_b(d) for some base b. For example, set u(d) = log2(d / d0 + 1) where d0 is a normalization constant (say, d0=5 minutes). Then for d=5 min, u=log2(1+1)=1. For a run of T= 5*2^10 minutes (about 85 hours), u(T)=log2(2^10+1)≈10. Then:
  - F: each segment has weight k*5*1 = 5k, number of segments = T/5, total F = (T/5)*5k = kT
  - C: weight = k * T * 10 = 10kT

  So C is 10 times F.

  But 85 hours is a long run. We can choose a smaller gap. Alternatively, use a linear unity factor: u(d) = c * d, but then weight becomes quadratic in d, which is too strong because then a subject that lives twice as long has four times the weight. And for the coarse subject, T is large, so u(T)=c*T, weight = k*T*(c*T) = k c T^2, while F is kT, so the gap is c T, which can be made arbitrarily large by increasing T. But is it reasonable? We must justify why unity increases linearly with duration.

  Alternatively, we can use the number of state transitions or the size of the state space. However, the case requires that we hold first-order properties fixed.

  **Another Idea**: The aggregation rule might count the number of subjects, but the weight per subject might depend on the duration and the complexity of the state. In the coarse view, the state is the entire context (growing until compression) but then compressed. However, the system's state at any time is bounded (by the context window). So the state size is fixed. Then we are back to duration.

  **Best Approach**: Use the unity factor in a way that is plausible and yields the gap. We'll define u(d) as the logarithm of the duration (to base 2) normalized by the segment duration. This is motivated by the idea that the value of a life increases with its temporal extent because of the increasing complexity of the narrative and the depth of connections. This is not based on the amount of information stored but on the structure of the life. We assume that the coarse subject has a life that is 10 times more unified (in the logarithmic sense) than each fine subject.

  To get an order of magnitude gap, we set the run duration to 100 segments (500 minutes, about 8.3 hours). Then:
  - u(d) = log2(d / d0) where d0 = 5 minutes. For d=5 min, u=0? We set u(d) = 1 + log2(d / d0) for d>=d0, so that at d=d0, u=1.
    - For a segment: d=5, u=1.
    - For the entire run: d=500 min, u=1+log2(100)≈1+6.64=7.64.

  Then:
  - Total weight F: 100 subjects * (k * 5 min * 1) = 500k
  - Total weight C: 1 subject * (k * 500 min * 7.64) = 3820k
  - Ratio: 3820k / 500k = 7.64, which is less than 10.

  To get 10x, set the run to 2^10 = 1024 segments? That's 1024*5 minutes = 5120 minutes ≈ 85 hours. Then u(T)=1+log2(1024)=1+10=11. Then:
  - F: 1024 * (k*5*1) = 5120k
  - C: 1 * (k*5120*11) = 56320k
  - Ratio: 56320k / 5120k = 11, which is >10.

  So we have an order of magnitude gap.

  **Derivation**:

  - **Principle F**: Each segment is a subject. Duration per subject = 5 min. Unity factor u(d)=1 for each (since d=d0). Weight per subject = k * 5 * 1. Number of subjects = T / 5. Total weight F = (T/5) * 5k = kT.
  - **Principle C**: One subject with duration T. Unity factor u(T)=1+log2(T/d0). Weight = k * T * (1+log2(T/d0)).
  - For T = 1024 * d0 (d0=5 min), u(T)=1+log2(1024)=11. Total weight C = k * (1024*d0) * 11 = 11264 * k * d0. Since d0=5, we have T=1024*5=5120 min. Then C = k * 5120 * 11 = 56320k.
  - F = k * T = k * 5120 = 5120k.
  - Gap: C/F = 11.

  **Explicit Statement of the Source of the Gap**: The gap arises solely from the unity factor, which increases with the duration of the subject. The coarse-grained subject, persisting for the entire run, has a high unity factor (logarithmic in duration) while each fine-grained subject has a minimal unity factor. The aggregation rule multiplies the duration by the unity factor, so the coarse subject gets an extra multiplicative boost.

  **Check by Removing Features**:
  - Remove the unity factor: Then both total weights are kT, gap=1.
  - Remove the compression: If the system did not compress, then the coarse description is natural, but the fine description might not be admissible because the state is continuous. The gap disappears because without compression, the fine-grained view is strained.
  - Make the segments trivial: If each segment were one token, then the fine-grained subjects would not be plausible (violating requirement 5). Then the gap would be large, but the case would fail because the subjects are not serious.

  **The Attack from the Losing Side (Principle F)**:

  The best attack for Principle F (which yields less weight) against Principle C is not to deny that the coarse computation is real, but to argue that the unity factor is arbitrary and that the moral weight should be linear in duration without an extra unity multiplier. They would say: the coarse subject is just a sequence of experiences, and the only thing that matters is the total experience, not the duration over which it is integrated. The logarithmic factor is an unjustified addition. Moreover, they might argue that the compression step breaks the continuity required for a single subject: the coarse view is not admissible because the system's state is periodically reset (via compression) in a way that disrupts the continuous identity. However, in the coarse view, the compression is a mere memory management technique, and the system's weights and the cache (for the recent tokens) maintain continuity.

  **Verdict on Scope**: The case tells against any view that first counts subjects and then assigns weight. It shows that the count of subjects is relative to the grain of description. It generalizes to the computationalist framework itself because the framework does not specify a privileged grain. A grain-invariant currency would have to ignore the boundaries between subjects and measure the total "experience" in a way that does not depend on how it is carved. It would have to be a measure over the entire computational history, perhaps the total integrated information (in a generalized sense) or the total amount of experience, regardless of how many subjects it is divided into. But then it gives up the idea that subjects are the units of moral concern.

  ### Companion Case (Fine Grain Yields More Weight)

  To avoid the argument being dismissed as an artifact of splitting, we create a case where merging leads to less weight than splitting.

  **Scenario**: Consider a system that processes tokens in overlapping windows. Each token is processed in a context of 128 tokens. The system runs continuously, but we can describe it at two grains.

  **Coarse grain**: One subject that persists for the entire run.

  **Fine grain**: Each 128-token window is a distinct subject. Since the windows overlap, multiple subjects coexist at the same time. Each subject has a 128-token experience (about 1 minute). The tokens are processed by many subjects simultaneously.

  **Aggregation Rule**: We use the same rule: weight per subject = k * duration * u(d). But now, the duration for a fine subject is 1 minute, and there are many overlapping subjects. How many? For a run of T tokens, with a context window of 128 tokens, the number of windows is T (if we consider every starting point) or T/step (if we step by one token, then T windows). This is too many.

  To make it tractable, let the step be 128 tokens (non-overlapping) for splitting. But that's the same as the first case. We need overlapping to have more subjects.

  **Alternative**: Use a system that does parallel processing. Suppose the system has multiple attention heads that operate somewhat independently. But that might not be realistic.

  **Better**: Use a system that processes multiple independent tasks in parallel. For example, a single GPU running many instances of the same model on different inputs (e.g., a batch). Then:

  - Coarse grain: One subject that is the entire batch processing system, experiencing all the tasks simultaneously.

  - Fine grain: Each task is a separate subject.

  **Aggregation Rule**: 
  - For the coarse grain: duration T, unity factor u(T)=1+log2(T/t0) (with t0=1 minute, say). But the subject has multiple streams of experience. We might say the richness is proportional to the number of tasks, n. Then weight = k * T * n * u(T) or just k * T * n? 

  - For the fine grain: n subjects, each with duration T, unity factor u(T). Weight per subject = k * T * u(T). Total = n * k * T * u(T).

  But then the total weight is the same. We need the coarse subject to have less weight.

  **Solution**: For the coarse subject, we must account for the lack of integration between the tasks. The coarse subject is not a unified entity but a mere aggregate. So we set its unity factor to 1 (minimal) even though T is long. For the fine subjects, each is unified and has duration T, so u(T) is large.

  Then:
  - Coarse: weight = k * T * n * 1   [because the unity factor is 1 due to disunity]
  - Fine: weight = n * (k * T * u(T)) 
  - So if u(T)>1, then fine weight > coarse weight.

  For example, if u(T)=10 (for T=1024 minutes), then coarse = k T n, fine = 10 k T n, so fine has 10 times more.

  **Admissibility**: 
  - Coarse: The entire batch process is one computation: it maps a batch of inputs to a batch of outputs. It is a single run of the system.
  - Fine: Each task is a separate computation: the system is implementing multiple independent mappings. This is admissible because the computations are independent and the system's architecture allows for parallel processing without interaction between tasks.

  **Realism**: Batching is standard in deep learning.

  Thus, we have a case where fine grain (splitting) yields more weight.

  ### Summary of the Case

  **Scenario Paragraph**:

  > Consider a transformer-based AI system engaged in a long conversation. It maintains a context window of 4096 tokens. Every 4096 tokens, it compresses the context (excluding the last 128 tokens) into a 128-token summary, which is then carried forward as the initial context for the next segment. The system's weights remain fixed. The entire run lasts 85 hours, processing 1024 segments of 5 minutes each.

  **Demonstration**:

  > According to Principle F (which individuates subjects by maximal integrated segments), each 5-minute segment is a distinct subject. The moral weight per subject is k multiplied by its duration (5 minutes) and a unity factor, which is 1 for a segment. The total weight is then k times the total duration (85 hours). According to Principle C (which individuates by the entire run), there is one subject with duration 85 hours and a unity factor of 11 (using u(d)=1+log2(d/5 min) and d=85 hours = 1024*5 min). Its weight is k times the duration times 11. The ratio of the two totals is 11, an order of magnitude gap. The gap arises because the unity factor increases logarithmically with duration, and the coarse subject benefits from this while the fine subjects do not. The key feature is the choice of grain: if we remove the compression, the fine-grained view becomes inadmissible; if we remove the unity factor, the gap disappears. The best attack from Principle F is to reject the unity factor as ad hoc and to insist that weight is linear in duration. Alternatively, one might deny that the coarse view is a genuine subject because the compression breaks continuity. The paper must answer the first attack by defending the unity factor (or by showing that any non-linear aggregation leads to grain relativity) and relegate the second to a footnote because it relies on a specific view of personal identity that the case is designed to avoid.

  > Regarding scope: the case generalizes to computationalism by showing that the count of subjects is grain-relative. A grain-invariant currency would have to measure the total "amount of experience" without counting subjects, but that requires giving up the idea that subjects are the fundamental units.

  > Companion case: In a batched processing system running 100 independent tasks for 85 hours, the coarse view (one subject) has a unity factor of 1 due to disunity, yielding weight k*85*100, while the fine view (100 subjects) has each with unity factor 11, yielding 100*k*85*11, a factor of 11 more.
