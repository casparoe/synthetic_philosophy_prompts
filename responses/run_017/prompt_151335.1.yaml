  Based on your query, I'll provide a precise principle for classifying deployment safety measures under your constraints, apply it to your cases and additional examples, identify which of your initial verdicts must be revised, and outline the role of empirical facts. The core challenge is to distinguish "control" measures that enforce safety without relying on the untrusted model's honesty, motives, or cooperation (i.e., dispositions), focusing instead on capability barriers that can be tested independently.

  ### The Principle: Non-Delegated Constraint Enforcement (NDCE)
  **Definition**: A measure qualifies as **control** if and only if:
  1. **It enforces a concrete safety constraint on the model's output or behavior** (e.g., "the artifact must pass review," "no network access allowed"), where "constraint" means a verifiable property that, if violated, directly prevents harm or triggers a safe shutdown.  
  2. **The constraint's enforcement does not depend on the untrusted model's self-reported state, intentions, or internal truthfulness**—it is evaluated using resources (e.g., trusted models, tools, or rules) external to and independent of the untrusted model.  
  3. **Defeating the measure requires the untrusted model to overcome a capability barrier**, meaning failure can be expressed as a testable condition like: "Can the model produce harmful output that satisfies the constraint under adversarial testing?" Crucially, this test must not assume the model's dispositions (e.g., honesty or intent); it relies solely on capabilities demonstrable in controlled evaluations.  

  **Motivation from your cases**:  
  - Clause 1 (constraint enforcement) is motivated by **Case 3 vs. Case 1**. Case 1 enforces a constraint (artifact passes review), while Case 3 monitors reasoning alone—a proxy that doesn't directly constrain the artifact. Without a constraint on the harmful output, it fails.  
  - Clause 2 (no self-report reliance) is motivated by **Cases 6 and 7**, which fail because they ask the model to self-assess. It also resolves the nag in **Case 2**: the reasoning is reviewed but not trusted as truthful; it's treated as input to an external review process.  
  - Clause 3 (capability barrier) is motivated by **Case 5 (resampling)**. Resampling lacks a constraint (consistent outputs aren't inherently safe), so defeat requires no new capability—just consistent sabotage. This contrasts with **Case 4**, where selection imposes a constraint requiring the adversary to fool the trusted model.  

  **Why NDCE?**  
  - **Where it sits**: NDCE draws the line at measures that enforce safety constraints via external resources, without delegating truth-telling or cooperation to the adversary. This avoids your "hostile human expert" test being too strong (as it focuses on capability barriers, not dispositions) and addresses your worry about "relocating the problem" by making capability testing central.  
  - **Why not one step up?** A broader principle (e.g., "any measure that reduces risk") would allow disposition-reliant tactics like honeypots, violating your ground rule.  
  - **Why not one step down?** A narrower principle (e.g., "only physical constraints") would exclude effective techniques like trusted reviews, which do create capability barriers.  
  - **Cost of accepting NDCE**: You must exclude measures that lack a clear constraint (e.g., resampling) or rely on self-reporting, even if empirically useful. These become "supplements" to control, not part of the safety case core.  

  ### Application to Additional Cases
  Using NDCE, here are verdicts for your unlisted cases. Each includes the constraint enforced (Clause 1), why it does/doesn't rely on self-report (Clause 2), and the capability barrier (Clause 3).

  1. **Untrusted model writes the monitor, with trusted sign-off**:  
     - **Constraint**: The monitor code must pass trusted review before deployment.  
     - **Self-report reliance?** No. The review is external; the untrusted model doesn't need to "be honest" about its code.  
     - **Capability barrier**: Can the model produce backdoored monitor code that evades trusted review? (Testable via adversarial examples.)  
     - **Verdict**: Control. Similar to Case 1 but with higher stakes; failure requires fooling the trusted model.

  2. **Two untrusted models cross-examine each other, trusted model judges transcript**:  
     - **Constraint**: The transcript must satisfy the trusted model of safety.  
     - **Self-report reliance?** Yes. The transcript is self-reported by adversarial models; safety assumes they don't collude or deceive during cross-examination. No independent constraint on the output.  
     - **Capability barrier**: None—defeat only requires both models to cooperate in hiding sabotage (e.g., staging fake debates).  
     - **Verdict**: Not control. Relies on dispositions (no collusion). Fails Clause 2.

  3. **Scoring scheme penalizes caught sabotage**:  
     - **Constraint**: Sabotage must avoid detection to avoid penalties.  
     - **Self-report reliance?** Indirectly. Penalties only deter if the model "cares" about the score (a disposition). Detection relies on other measures (e.g., review), but the constraint is on the model's incentives, not its output.  
     - **Capability barrier**: None—sabotage succeeds if undetected, and detection is delegated to other mechanisms.  
     - **Verdict**: Not control. Relies on the model cooperating with incentives (Clause 2).

  4. **Honeypots: Deploy only if model declines easy sabotage in evaluation**:  
     - **Constraint**: The model must not take the honeypot bait during evaluation.  
     - **Self-report reliance?** Yes. Safety assumes the model's evaluation behavior truthfully indicates deployment behavior (i.e., it doesn't "pretend" to be safe).  
     - **Capability barrier**: None—a deceptive model easily bypasses by avoiding honeypots without changing its capability.  
     - **Verdict**: Not control. Relies on dispositional honesty (Clause 2).

  5. **Tripwire with secret trigger conditions**:  
     - **Constraint**: Execution must not match the tripwire pattern.  
     - **Self-report reliance?** No. The tripwire is external and secret; the model doesn't need to report on itself.  
     - **Capability barrier**: Can the model cause harm without triggering any hidden pattern? (Testable via adversarial probes.)  
     - **Verdict**: Control. Adds uncertainty, raising the capability bar (e.g., evading unknown triggers). Fits Case 9.

  6. **Untrusted model chooses which outputs to audit**:  
     - **Constraint**: Only audited outputs can be deployed.  
     - **Self-report reliance?** Yes. Safety assumes the model "cooperates" by selecting harmful outputs for audit.  
     - **Capability barrier**: None—the model trivially defeats by auditing only safe outputs.  
     - **Verdict**: Not control. Relies on dispositional cooperation (Clause 2).

  7. **Trusted model paraphrases output before review**:  
     - **Constraint**: The paraphrased output must pass review.  
     - **Self-report reliance?** No. Paraphrasing and review are external; the model doesn't need to be truthful.  
     - **Capability barrier**: Can the model produce output that, when paraphrased, remains harmful and evades review? (Testable via adversarial inputs.)  
     - **Verdict**: Control. Breaks covert channels without delegation (Clause 1).

  ### Revised Verdicts on Your Original Cases
  NDCE forces you to give up one verdict (Case 5) and clarifies two ambiguous cases (2 and 8). Here's a full revision:

