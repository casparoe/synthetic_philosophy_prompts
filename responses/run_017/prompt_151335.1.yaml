  **Principle B (Non-Cooperation):** A measure is control if and only if it does not rely on the untrusted model's cooperation to ensure safety. Specifically, the model cannot trivially defeat the measure by choosing not to cooperate (e.g., by lying, by being consistent, by not revealing its intentions) without also having to overcome a separate capability barrier (such as fooling a trusted model, evading a detector, or operating within structural constraints).

  This principle resolves:

  - Case 2 as control (because the review of artifact and reasoning does not rely on the reasoning being truthful; it's a capability barrier).
  - Case 5 as not control (because the model can defeat it by being consistent, without any capability barrier).
  - Case 8 as control (because evading the classifier is a capability barrier).

  The cost: we must give up on including resampling (case 5) as a control measure in the safety case under the worst-case assumption. But we might still use it as a supplemental measure.

  The separation between case 3 and 8 is justified because case 3 relies on the model's cooperation in providing truthful reasoning, while case 8 does not.

  Empirical facts do not change the control classification, but they determine the effectiveness of the control measures. The team can measure:

  - For trusted model review (cases 1,2,4,A,G): the false negative rate of the trusted model in detecting harmful outputs (using adversarial testing).
  - For deception detector (case 8): the evasion rate against adversarial models.
  - For structural measures (case 9,E): the rate at which adversarial models can cause harm without triggering the constraints.

  These measurements tell us how strong the control is, but not whether it's control by the principle.
