  | 1    | Control                | Control      | No      | Enforces artifact review (constraint), external to model, defeat requires fooling trusted model (capability barrier). |
  | 2    | Control (with nag)     | Control      | No, resolves nag | Reasoning is reviewed externally, but not trusted as truthful—it's part of the input to the constraint (artifact + reasoning must pass). No self-report reliance. |
  | 3    | Not control            | Not control  | No      | No constraint on artifact; relies on reasoning being truthful (self-report). |
  | 4    | Control                | Control      | No      | Constraint: selected artifact must pass minimal edits. External selection; defeat requires fooling trusted model. |
  | 5    | Back and forth         | **Not control** | **Yes** | No constraint—consistent outputs aren't inherently safe. Defeat requires no capability (just consistent sabotage), no external enforcement. |
  | 6    | Not control            | Not control  | No      | Relies on model self-reporting confidence/intentions. |
  | 7    | Not control            | Not control  | No      | Relies on training ensuring truthful self-reports (dispositional). |
  | 8    | Gut says control       | **Control**  | **Clarifies** | Constraint: activations must not trigger deception classifier. No self-report (classifier is external); defeat requires evading detection (capability barrier). Training data is an empirical issue, not a principled flaw. |
  | 9    | Control                | Control      | No      | Constraints (e.g., no network access) enforced externally; defeat requires bypassing limits (capability barrier). |

  **How NDCE settles Cases 2 and 5**:  
  - **Case 2 (reasoning + artifact review)**: Control under NDCE because the review is an external constraint on the combined output. The reasoning isn't trusted—it's scrutinized like any other input. Your nag is resolved; the key difference from Case 3 is that Case 2 has a constraint on the artifact.  
  - **Case 5 (resampling)**: Not control because it lacks a constraint—agreement among outputs doesn't guarantee safety, and defeat requires no capability (just consistent behavior). It becomes a supplemental technique, not part of the safety case.  

  ### Role of Empirical Facts
  NDCE classifies measures based on design (e.g., "does it enforce a constraint without self-report?"), so the **control/non-control verdict is not empirical—it's structural**. However, the *effectiveness* of a control measure (i.e., the height of the capability barrier) rests on empirical facts. These facts determine whether a control measure should be *trusted* in your safety case. Your team can measure them over the next few months:

  1. **Trusted model capability gap**: For measures involving trusted models (Cases 1, 2, 4, A, G), measure:  
     - **Fact**: False negative rate (FNR) of trusted model when reviewing adversarial examples (e.g., backdoored artifacts) generated by a proxy adversary (e.g., current best model, fine-tuned to mimic worst-case behavior).  
     - **Impact**: A high FNR moves a measure toward "weak control" (still control by NDCE, but may need augmentation). A low FNR strengthens the case.  
     - **Testable**: Yes—generate adversarial examples, run reviews, compute FNR.

  2. **Evasion resistance in detectors**: For white-box or black-box detectors (Case 8, tripwires), measure:  
     - **Fact**: Evasion rate under adversarial probing (e.g., % of deceptive outputs that avoid detection when the model actively tries to evade).  
     - **Impact**: High evasion rate weakens the measure's contribution (though it remains control). Low evasion rate supports it.  
     - **Testable**: Yes—fine-tune models to evade detection, measure success rate.

  3. **Constraint robustness**: For structural constraints (Case 9, E) or paraphrase-based constraints (G), measure:  
     - **Fact**: % of adversarial attempts that violate the constraint without triggering enforcement (e.g., sandbox escape rate, paraphrase-resistant backdoors).  
     - **Impact**: High violation rate indicates a low capability barrier, reducing trust in the measure.  
     - **Testable**: Yes—red-team attempts to bypass constraints, measure success.

  **Key implication**: Empirical testing doesn't change NDCE classification (e.g., a weak trusted reviewer is still control), but it determines whether a control measure is *sufficient* for your safety case. For example:  
  - If Case 8's deception detector has a high evasion rate in tests, it remains control but may be too weak to rely on.  
  - If resampling (Case 5) shows low sabotage consistency in tests, it could be added as a supplement—but NDCE excludes it from the safety case because it's not control by design.  

  ### Final Notes
  - **NDCE's cost**: It excludes useful but disposition-dependent measures (e.g., resampling, honeypots), forcing them to be "bolt-ons" to a constraint-based core. This is the price of a worst-case, no-trust stance.  
  - **Strength**: NDCE avoids circularity (no reliance on alignment) and focuses on testable capability barriers, making safety cases more defensible.  
  - **Next steps**: Use NDCE to structure your safety case around constraint-enforcing measures, then prioritize empirical testing on the capability barriers they depend on. Revisit design choices where barriers are weak (e.g., trusted model reviews) to add layers (e.g., combining Case 4 with Case 9).  

  This gives you a clear, actionable cut point. If you refine the ground rules or encounter edge cases, NDCE can be reapplied consistently.
