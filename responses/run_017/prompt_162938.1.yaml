prompt: |-
  hey — I'm taking a metaphysics seminar this semester and for our last section handout I want to build a decision tree for the special composition question (when do some things make up one further thing?). My TA keeps saying we should build it out of the logical space instead of just listing the named views and reverse-engineering questions for them, so: act like a professional metaphysician who's taught mereology a bunch of times, think carefully, and do a quick brainstorm of the yes/no questions that actually cut the space *before* you draw anything — then go back and park the named positions on the leaves.

  What I need:

  - About eight branch nodes, each phrased as a question someone could answer without already knowing where it leads, and each attached to a concrete case rather than to a piece of theory. Six to nine leaves, each with its usual label if it has one, "unnamed" if nobody really defends it, and one sentence on its most awkward commitment.
  - Please use at least most of these cases (and invent your own for any node that needs a sharper one): conjoined twins who share some brain tissue; a program running as two processes on servers in different countries; a slime-mold or ant-colony "superorganism"; a watch taken apart and laid out on a tray overnight, then put back together; a cloud; your nose and the Eiffel Tower taken together; a lab-grown brain organoid with some spontaneous activity; a symphony performance; a corporation.
  - The angle I care about, so these distinctions should be real high-level nodes and not footnotes: (1) whether the answer has to be fully general or may be relative to a kind/sortal or to somebody's interests — I want that near the top, because I'm pretty sure it's what actually splits the people in my class; (2) whether composition has to be modally sturdy: if the xs compose something, do they still have to compose something after any tiny change in how they're arranged or how far apart they are? I made up a view in discussion section along those lines — call it "sturdiness" for now — so place it in the tree and tell me whether it's just some named position in disguise or whether it sits in an empty region; (3) whether the composite has to have causal powers of its own or can be something we merely pick out in description; (4) whether composition is allowed to be vague or borderline.
  - Flag any pair of leaves your tree genuinely can't separate. I suspect the "composition happens just when the result is alive / is an organism" answer and the consciousness-based ones only come apart on cases nobody has firm intuitions about, and I suspect the brute-arbitrary-class answers and the nothing-ever-really-composes answers are inseparable by cases even though they feel very different in spirit. Say so instead of pretending the tree sorts them.
  - For each unoccupied box in the space, one line on why nobody lives there: incoherent, unattractive, or just unexplored.

  Format: start with one sentence of bottom line — the single upshot of the tree, the thing I'd say to a classmate (e.g. which node ends up doing basically all the work) — then the tree itself, then the notes on leaves, empty regions, and unseparable pairs. No preamble, no restating what I asked, and please don't name papers or give me a reading list of any kind; I can't look anything up from class and I don't need citations.
reasoning: |-
  Alright, the user is preparing a decision tree for the special composition question in metaphysics. They need about eight branching questions based on concrete cases, leading to six to nine leaves. The key angles are whether composition is relative, modally sturdy, has causal powers, or can be vague. They also want to flag inseparable pairs and explain unoccupied regions.

  First, the top priority is structuring the tree so the relativity question comes early. That's a major split in their class. Using cases like the cloud or the corporation can illustrate relativity versus generality. Next, modal sturdiness—cases like the disassembled watch or the conjoined twins can test if composition holds under small changes. The cloud case is perfect for vagueness.

  Causal powers need cases where emergent properties are evident, like the brain organoid or superorganism. The symphony and program cases can challenge if causal powers are necessary. For inseparable pairs, organicism and consciousness-based views might not separate easily on existing cases. Similarly, universalism and nihilism can't be distinguished by cases alone since both handle all scenarios without intermediate composites.

  Unoccupied regions: Combining anti-realism with sturdiness is incoherent. Relativism without sturdiness but insisting on causal powers might be unattractive because it demands robustness without necessity. Also, relativism with sturdiness and no vagueness could lead to arbitrariness, which isn't appealing.

  Need to ensure each question uses concrete examples and avoids theory-laden terms. The tree should flow logically, with each branch clearly splitting the options. Finally, check that all user-provided cases are incorporated meaningfully and that the leaves cover both named and unnamed positions.
answer: |-
  **Bottom line:** Whether composition must be *absolute* (applying universally) or can be *relative* (to kinds, interests, etc.) is the top-level split that fundamentally structures the entire logical space and determines which other questions matter.

  **Decision Tree:**

  1.  **Is composition *always* determined the same way, regardless of human interests, concepts, or kinds?**  
      *Case: A cloud vs. A watch.*  
      *   **No (Relativism Permitted) → Q2**  
      *   **Yes (Absolutism) → Q3**

  2.  **(Relativism Branch) Is composition *absolutely* prohibited in some cases (i.e., is there a background universal restriction)?**  
      *Case: Your nose and the Eiffel Tower taken together.*  
      *   **No (Full Relativism) → Q4**  
      *   **Yes (Restricted Relativism) → Q5** *(e.g., Only when relativized kind is "natural" or "unified")*

  3.  **(Absolutism Branch) Does composition *ever* occur?**  
      *Case: Your nose and the Eiffel Tower taken together.*  
      *   **No (Mereological Nihilism) → Leaf A**  
      *   **Yes → Q6**

  4.  **(Full Relativism Branch) Must the composite have *non-redundant causal powers* (powers not just the sum of parts' powers)?**  
      *Case: A lab-grown brain organoid with spontaneous activity vs. A symphony performance.*  
      *   **No → Leaf B (Unnamed: Interest-Relative Composition)**  
      *   **Yes → Q7**

  5.  **(Restricted Relativism Branch) Is the restriction based *primarily* on spatial continuity?**  
      *Case: A slime mold superorganism vs. A symphony performance.*  
      *   **Yes → Leaf C (Unnamed: Spatial Continuity + Kind-Relative)**  
      *   **No → Q8** *(e.g., based on functional unity, life, etc.)*

  6.  **(Absolutism + Composition Occurs Branch) Is composition *modally sturdy*? (Must the xs compose in *all* very similar arrangements/distances?)  
      *Case: A watch disassembled overnight vs. Conjoined twins slightly separated.*  
      *   **Yes (Sturdiness) → Leaf D (Unnamed: Modal Sturdiness)**  
      *   **No → Q7**

  7.  **(Causal Powers Question) Must the composite have *non-redundant causal powers*?**  
      *Case: A slime mold superorganism vs. A program running on two servers.*  
      *   **Yes → Leaf E (Organic Unity / Emergentism)**  
      *   **No → Q9**

  8.  **(Restricted Relativism - Non-Spatial Branch) Is the restriction based on *being alive*?**  
      *Case: Brain organoid vs. Corporation.*  
      *   **Yes → Leaf F (Organicism / Life)**  
      *   **No → Leaf G (Unnamed: Functional Unity + Kind-Relative)**

  9.  **(Vagueness Question) Can it be *vague* whether composition occurs?**  
      *Case: A cloud.*  
      *   **Yes → Leaf H (Unnamed: Vague Composition)**  
      *   **No → Leaf I (Mereological Universalism)**

  **Leaves & Key Commitment:**

  *   **Leaf A: Mereological Nihilism**  
      *Awkward Commitment:* Denies obvious composites like rocks or chairs really exist; only fundamental particles do.
  *   **Leaf B: Unnamed (Interest-Relative Composition)**  
      *Awkward Commitment:* Corporations and symphonies compose objects just as "real" as cats or rocks, simply because we talk about them that way.
  *   **Leaf C: Unnamed (Spatial Continuity + Kind-Relative)**  
      *Awkward Commitment:* A cloud doesn't compose an object (too scattered), but conjoined twins do compose one object (continuous), *unless* we are thinking of them as two persons.
  *   **Leaf D: Unnamed (Modal Sturdiness)**  
      *Awkward Commitment:* The watch parts *never* composed a watch, not even when assembled and working, because a tiny rearrangement *could* break it.
  *   **Leaf E: Organic Unity / Emergentism**  
      *Awkward Commitment:* A sophisticated AI or a spontaneously active brain organoid composes an object, but a non-conscious robot or a disassembled watch does not.
  *   **Leaf F: Organicism / Life**  
      *Awkward Commitment:* A slime mold composes an object, but a sophisticated AI, a corporation, or a spontaneously active brain organoid (if not alive) does not.
  *   **Leaf G: Unnamed (Functional Unity + Kind-Relative)**  
      *Awkward Commitment:* A corporation or a symphony composes an object *only* when we are considering it under the relevant functional kind (e.g., "legal entity", "musical performance"), not as a mere aggregate.
  *   **Leaf H: Unnamed (Vague Composition)**  
      *Awkward Commitment:* There is no fact of the matter whether a specific collection of water droplets composes a cloud at the fuzzy boundary.
  *   **Leaf I: Mereological Universalism**  
      *Awkward Commitment:* Your nose and the Eiffel Tower *do* compose a distinct object (a "nose-tower fusion"), no matter how arbitrary it seems.

  **Indistinguishable Pairs by Cases:**

  1.  **Organicism (Leaf F) vs. Emergentism (Leaf E):** Distinguishing life from consciousness/non-redundant causation is extremely difficult with most real-world cases (e.g., is a brain organoid "alive"? Does it have genuinely novel causal powers?). Intuitions diverge precisely where cases get fuzzy.
  2.  **Nihilism (Leaf A) vs. Universalism (Leaf I):** *All* cases are handled by both: Nihilism says *nothing* composes, Universalism says *everything* composes. Cases only highlight the counterintuitive extremes but don't force a choice between them based solely on composition facts. The difference is purely metaphysical commitment, not case resolution.
  3.  **Full Relativism without Causal Powers (Leaf B) vs. Universalism (Leaf I):** Both allow arbitrary composites. The difference (relativity to concepts vs. absolute existence) often collapses in practice for arbitrary fusions; both will say the nose-tower fusion exists, just for different reasons. Cases struggle to pry them apart.

  **Unoccupied Regions & Why:**

  1.  **Relativism + Modal Sturdiness:** Incoherent. If composition depends on interests/kinds, it cannot be modally sturdy (invariant across tiny changes).
  2.  **Absolutism + Restricted Relativism:** Contradictory. Absolutism denies relativity by definition.
  3.  **Relativism (Full or Restricted) + Sturdiness:** Incoherent (as above). Sturdiness requires absolute necessity incompatible with relativity.
  4.  **Relativism (Full) + Causal Powers Required + No Vagueness Allowed:** Unattractive. Demanding robust causal powers *and* precise boundaries *while* allowing relativity makes composition implausibly rare and context-dependent yet precise.
  5.  **Absolutism + Composition Occurs + Sturdiness + Causal Powers Not Required + Vagueness Allowed:** Unexplored/Unattractive. Why insist on sturdiness and absolutism if composites don't need causal powers and can be vague? Seems unmotivated.
  6.  **Absolutism + Composition Occurs + No Sturdiness + Causal Powers Required + Vagueness Allowed:** Unexplored/Unattractive. Combining emergent causal powers with vagueness and no sturdiness under absolutism lacks clear motivation; it's unstable between organicism/emergentism and vague universalism.
