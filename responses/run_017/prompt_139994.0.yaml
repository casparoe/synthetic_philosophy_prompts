     (b) No: M is not a cause of B because it doesn't make a difference beyond what C does.

  4. Two robots are designed to avoid obstacles. One has a silicon-based processor and the other has a carbon-based processor. In both, the processor's activity can be described as "processing information about the environment". When an obstacle appears, each robot avoids it. In each case, did the information processing cause the avoidance behavior?
