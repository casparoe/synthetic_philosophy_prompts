     (c) The information processing did cause it, but only because it is a physical process in each robot; the informational aspect didn't add anything.

  5. In a person, a complete physical state P fully determines the probability of a behavior B (say, P makes B certain). A mental state M always occurs when P occurs. In an instance where P and M occur and B occurs, did M cause B?
