  ### Diagnostic Instrument: Mental Causation and the Exclusion Argument  

  **Part 1: Case-Based Questions**  
  Answer each question based solely on the case description. Choose one option per question.  

  1. **Monitor Case**  
     A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs. On Tuesday afternoon, she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching?  
     (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed.  
     (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and the believing themselves made no difference to anything.  
     (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and the believing came along with it without doing any of the work.  

  2. **Symmetric Overdetermination**  
     Two robots are identically programmed to feel "pain" when damaged, and both have backup chips that can independently trigger pain-avoidance behavior. In Robot A, the pain-feeling system activates, and at the same time, the backup chip malfunctions and activates too. Either system alone would cause the robot to retreat. The robot retreats. Did the pain feeling cause the retreat?  
     (a) Yes: it was one of the causes, along with the chip.  
     (b) No: because the backup chip would have caused the retreat even without the pain feeling, so the pain feeling didn’t make a difference.  
     (c) The pain feeling did cause it, but only because it is a physical process in the robot; the feeling itself didn’t add anything.  

  3. **Probabilistic Production**  
     A brain state raises the probability of a smile from 40% to 80%. This brain state always occurs with a happy feeling. In one instance, the brain state and happy feeling occur, and the person smiles. Did the happy feeling cause the smile?  
     (a) Yes: the happy feeling was present and the smile occurred.  
     (b) No: because the brain state already raised the probability to 80%, and the happy feeling doesn’t change that.  

  4. **Multiple Realization**  
     Two people—one with a typical human brain, one with a synthetic brain implant—both rescue a child from danger. Each acts because of compassion. The physical processes in their brains are entirely different, but both are described as "acting compassionately." Did the compassion cause the rescue in each person?  
     (a) Yes: compassion explains the action in both cases, despite different physical processes.  
     (b) No: the physical brain processes caused the rescue; compassion is just a description.  
     (c) Compassion caused it, but only because each physical process produced it; the compassion itself didn’t add anything.  

  5. **Conditional Independence**  
     A complete physical state of a brain guarantees a flinch reaction. A fear feeling always occurs with this physical state. When the physical state occurs and the flinch follows, did the fear feeling cause the flinch?  
     (a) Yes: the fear feeling was present and the flinch occurred.  
     (b) No: because the physical state alone guarantees the flinch; the fear feeling adds no further information.  

  6. **Brain Change Effect**  
     A person’s decision to recall a memory causes new connections to form in their hippocampus. The decision is realized by a brain state. Did the decision (as a mental state) cause the new connections?  
     (a) Yes: the decision caused the brain change.  
     (b) Yes, but only because it is a brain state that caused the change; the decision itself, as a mental state, didn’t cause anything.  
     (c) No: the brain state caused the change; the decision is just an aspect.  

  7. **Physical Duplicates**  
     Two agents are physically identical (same brain states, environment, etc.) at the moment of shouting "Ouch!" One feels sharp pain; the other feels mild discomfort (due to different prior states). Both shout. Did the sharp pain cause the shout in the first agent?  
     (a) Yes: the pain caused the shout.  
     (b) No: the physical state caused the shout; the pain didn’t add anything because the same shout occurred without it in the duplicate.  
     (c) The pain did cause it, but only because it is a physical state; the feeling itself is irrelevant.  

  8. **Preemption**  
     Two brain processes can each cause a handwave. Process A (linked to a "joy" feeling) normally inhibits Process B. When joy occurs, Process A activates and causes a handwave, while Process B is suppressed. Did the joy cause the handwave?  
     (a) Yes: the joy produced the handwave.  
     (b) Yes: the joy made the difference; without it, Process B might have caused it, but here it did cause it.  
     (c) No: because Process B would have caused the handwave if joy hadn’t occurred.  

  9. **Intention and Action**  
     A person intends to jog and their brain initiates running motions. The intention is realized by a brain state. Did the intention cause the running?  
     (a) Yes: the intention caused the running.  
     (b) Yes, but only because it is a brain state that caused the running; the intention itself didn’t cause anything.  
     (c) No: the brain state caused the running; the intention is just a description.  

  10. **Mental-to-Mental Causation**  
      A feeling of embarrassment causes a feeling of anxiety. The embarrassment is realized by a brain state. Did the embarrassment (as a mental state) cause the anxiety?  
      (a) Yes: the embarrassment caused the anxiety.  
      (b) Yes, but only because the brain state of embarrassment caused the brain state of anxiety; the mental states didn’t cause each other.  
      (c) No: the brain state caused the anxiety; the embarrassment is just an aspect.  

