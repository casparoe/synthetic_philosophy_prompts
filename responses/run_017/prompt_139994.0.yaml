prompt: |-
  I teach a six-week graduate seminar on mental causation, and for the middle session I want to replace my usual handout of labelled positions with a self-scoring diagnostic: participants would answer a set of case-based questions before they have met any of the literature, and a key would tell them which position their pattern of answers has already committed them to. The topic is the exclusion argument, by which I mean the whole family of formulations — the overdetermination version, the supervenience-based version, and the version on which causal efficacy drains downward to the physical level. Please write the instrument.

  Three constraints, in the order in which I care about them.

  First, construct the logical space before attaching any labels. Fix three or four choice points; the candidates I have in mind are whether every event that has a cause is fully produced by physical causes alone; whether being fully produced by physical causes requires deterministic sufficiency or can be satisfied merely by the physical causes raising the probability of the event; whether mental properties are distinct from physical ones, and whether distinctness together with the dependence of the mental on the physical leaves the two independent enough for any exclusion principle to get a grip; and what something has to be in order to count as a cause at all — a producer of its effect, a difference-maker for it, a variable one could in principle intervene on. Enumerate the combinations your choice points allow, and only then locate the positions in the resulting cells.

  Second, the questions. Ten of them, each a concrete case with two or three answer options. No question may contain the name of a position or a term of philosophical art, and no question may ask in the abstract what causation is; a well-read person with no philosophy training should be able to answer every one from the case alone. Each option should be a live option — something that some position in the literature is genuinely committed to, rather than a strawman. Here is one I have written, as a sample of the register:

  A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs, with the same force, direction and timing that it would otherwise have had. On Tuesday afternoon she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching? (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed. (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and the believing themselves made no difference to anything. (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and the believing came along with it without doing any of the work.

  Write the remaining nine in that register. Among them I want at least: a symmetric overdetermination or preemption case; a case in which the physical antecedent merely raises the probability of the outcome, so that the question becomes whether the mental antecedent has any causal work left to do; a case in which the same behaviour is produced from very different hardware, so that the higher-level description generalizes across instances while the lower-level one does not; a case in which the mental state, conditional on the complete physical state, predicts nothing further about what happens; a case in which the effect to be explained is a change in someone's brain rather than a piece of behaviour; and a case in which two agents are alike in every physical respect at the moment of acting and differ only in what it is like for them.

  Third, the leaves: ten to fourteen of them. The following must appear, under whatever names you prefer: reduction by type identity; reduction to functional or realizer properties; eliminativism; epiphenomenalism, with global epiphenomenalism and epiphenomenalism restricted to phenomenal properties as separate leaves; the view that secures mental causation by inheritance from the physical properties of the very same event or particular; the view that accepts overdetermination, together with the variant on which the mental depends too closely on the physical for the two to be genuine causal rivals; relevance-without-efficacy views of the program-explanation kind; proportionality views that turn the argument around and exclude the physical cause rather than the mental one; interventionist or difference-making views; views that deny the causal completeness of the physical; views that locate mentality in the intrinsic or categorical nature of the physical; and non-reductive views that rest on grounding rather than identity. Mark as unoccupied any leaf that in fact has no defenders.

  After that, the two short sections I care about most. The first lists the cells of your space that no position fills, and says of each whether it is empty because it is incoherent, because it is merely unattractive, or because nobody has bothered to explore it. The second lists the pairs of leaves that your ten questions cannot separate, gives the shared answer pattern for each pair, and says what an eleventh question would have to ask in order to split them.

  Format the whole document in three parts: the questions alone, with no names of positions or theorists appearing anywhere in them; then the choice points, the enumerated space, and a table from answer patterns to leaves; then the empty cells and the unseparable pairs. If a participant's answers match no leaf you have placed, say in part two what the key should report back to them. Please include no bibliography, no citations and no reading list anywhere; the key should name positions rather than papers.
reasoning: |-
  We are constructing a diagnostic instrument for a seminar on mental causation, focusing on the exclusion argument. The instrument has three parts: (1) the questions, (10 concrete cases with options); (2) the logical space of positions built from choice points, and a key mapping answer patterns to positions; (3) a discussion of unoccupied cells and pairs of positions that the questions cannot distinguish.

  Constraints:
  - 10 questions, each a concrete case with 2-3 answer options. No philosophical jargon, no position names. Each option should be a live option in the literature.
  - The questions must cover: symmetric overdetermination/preemption; probabilistic causation; multiple realizability (same behavior from different hardware); conditional independence (mental state adds no predictive power given physical state); effect that is a brain change; and a case of physical duplicates with different phenomenal states.
  - The logical space must be built from 3-4 choice points before attaching labels. The choice points I have in mind are:
    1. Causal completeness of the physical: every event that has a cause is fully produced by physical causes alone? (Yes/No)
    2. What does "fully produced" mean? (Deterministic sufficiency / Probability raising)
    3. Are mental properties distinct from physical properties? (Yes/No) And if distinct, are they independent enough for exclusion? (But note: this might be broken down: distinctness and then the nature of dependence)
    4. What is causation? (Producer / Difference-maker / Intervenable variable) [But note: we cannot ask this abstractly, so we must infer from cases]

  However, note that the sample question already touches on several issues. We must design 10 questions that together probe these choice points.

  After building the logical space (enumerate combinations), we then map the positions (leaves) to the cells.

  The leaves (positions) we must include (with their common names) are:
  - Reduction by type identity
  - Reduction to functional or realizer properties (functional reduction)
  - Eliminativism
  - Epiphenomenalism (global and restricted to phenomenal properties separately)
  - The view that secures mental causation by inheritance from the physical properties of the same event (non-reductive physicalism? or token identity? Actually, token identity with property dualism? This is tricky. Perhaps this is the "same event" view: mental events are physical events and thus inherit causal efficacy.)
  - The view that accepts overdetermination (and the variant: mental depends too closely to be a rival, i.e., overdetermination is benign)
  - Relevance-without-efficacy (program explanation)
  - Proportionality views (that exclude the physical cause)
  - Interventionist or difference-making views (which might be a general approach, not necessarily a specific position; we might have to associate it with a particular stance on exclusion)
  - Views that deny causal completeness of the physical (e.g., emergentism)
  - Views that locate mentality in the intrinsic/categorical nature of the physical (Russellian monism?)
  - Non-reductive views based on grounding (grounding physicalism)

  We must mark unoccupied leaves that have no defenders.

  Then, we discuss:
  - Empty cells: why are they empty? (incoherent, unattractive, unexplored)
  - Pairs of leaves that the 10 questions cannot separate: what shared pattern, and what 11th question would split them.

  Part 1: The Questions (10)

  We have the sample question:

  1. A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs, with the same force, direction and timing that it would otherwise have had. On Tuesday afternoon she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching? 
     (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed.
     (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and the believing themselves made no difference to anything.
     (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and the believing came along with it without doing any of the work.

  Now, we need 9 more. We must cover:

  - Symmetric overdetermination or preemption case.
  - Probabilistic case (physical antecedent merely raises probability, so we ask if mental antecedent has work left).
  - Multiple realizability (same behavior from different hardware).
  - Conditional independence (mental state, given complete physical state, predicts nothing further).
  - Effect is a brain change (not behavior).
  - Physical duplicates with different phenomenal states.

  Plus, we have 10 total. We can also include:
  - A case that probes the nature of causation (producer vs. difference-maker).
  - A case that tests whether mental properties can be causes even if they are not identical to physical properties.

  Let's design:

  2. Symmetric overdetermination: 
     Two neurons, A and B, each capable of causing a muscle contraction. Normally, if either fires, the muscle contracts. In a particular case, both fire at the same time. The muscle contracts. Did A cause the contraction?
     (a) Yes: A firing was sufficient and it did fire.
     (b) Yes, but only because without B, A would have caused it, and without A, B would have caused it; so each is a cause.
     (c) No: because B also fired and either one alone would have been sufficient, so we cannot say that A caused it (it would have happened anyway).

  But note: we want for mental causation. So let's make it mental and physical? Actually, we can have a purely physical case to probe the concept of overdetermination, which can then be applied to the mental. However, the instructions say "no philosophical art", so we can have a physical case and then the same structure for mental. But we are building a pattern for mental causation. Alternatively, we can have a mental/physical overdetermination case.

  Alternatively, a classic preemption case:

     Assassin A and Assassin B are both ordered to kill Victim. A fires a shot that kills Victim. B was also ready to fire, but did not because A succeeded. Did A's shot cause Victim's death?
     (a) Yes: the shot killed Victim.
     (b) Yes, but if A hadn't shot, B would have, so it's not clear that A's shot was necessary.
     (c) No: because B was a backup, the death was overdetermined and we can't attribute it to A.

  But (c) is not a live option. Let's make it:

     (a) Yes: A's shot was the actual cause.
     (b) Yes, but only because B didn't fire; if B had fired first, then A wouldn't have caused it? But that's not the case. Actually, preemption: A preempts B. Standard answer: A is the cause, B is a backup that didn't get to act.

  But we want a symmetric case? The sample is about mental causation, so let's do:

     A brain state M (which is also a mental state) and an external device E are both capable of causing a behavior. The device is set to activate only if the brain state does not. In a particular case, the brain state M occurs and causes the behavior, and the device does nothing. Did the mental state (as such) cause the behavior?
     (a) Yes: the mental state occurred and caused the behavior, and the device did nothing.
     (b) Yes, but only because the device didn't activate; if the mental state hadn't occurred, the device would have caused the same behavior, so the mental state isn't necessary.
     (c) No: because the device was set to cause it if the mental state didn't, so the behavior was overdetermined and we cannot attribute it to the mental state.

  But (b) and (c) are not very plausible. We want symmetric overdetermination? Let's do:

     In a rare malfunction, both the mental state and the external device (which is set to activate only if the mental state does not) fire at the same time, and both would be sufficient to cause the behavior. The behavior occurs. Did the mental state cause the behavior?
     (a) Yes: it was one of the causes.
     (b) Yes, but only because it is a physical event in the brain that caused the behavior; the mental aspect didn't add anything.
     (c) No: because the device would have caused it anyway, so the mental state didn't make a difference.

  But (c) is not standard: in symmetric overdetermination, we usually say both are causes. So:

     (a) Yes: it was a cause (along with the device).
     (b) No: because the device alone would have been sufficient, so the mental state wasn't necessary and didn't make a difference.
     (c) It's unclear: we don't have a clear concept of overdetermination in such cases.

  But we want live options. So:

     (a) Yes: it was one of the causes.
     (b) Yes, but it is redundant: the behavior would have occurred without it, so it isn't really a cause in the full sense.
     (c) No: only the physical events in the brain and the device caused it; the mental state is just an aspect of the brain event and didn't cause anything extra.

  But (c) is similar to (b) in the sample. Let's design a better one.

  Alternatively, let's make it a purely physical symmetric overdetermination and then a mental one? But the instrument is about mental causation, so we can have:

  2. In a lab experiment, a rat is trained to press a lever to get food. The experimenters have also implanted a device that can stimulate the rat's brain to cause the lever press. The device is set to activate only if the rat does not press the lever within 10 seconds. One trial, the rat presses the lever because it is hungry and the device does not activate. Did the rat's hunger cause the lever press?
     (a) Yes: the rat pressed because it was hungry.
     (b) Yes, but only because the device didn't activate; if the rat hadn't been hungry, the device would have caused the press, so the hunger wasn't necessary.
     (c) No: because the device was set to cause it if the rat didn't, so the press was overdetermined and we can't attribute it to the hunger.

  This is preemption, not symmetric. Let's do symmetric:

     Due to a malfunction, the device activates at the same time as the rat presses the lever because of hunger. Either one would have been sufficient to cause the lever press. The lever press occurs. Did the rat's hunger cause the lever press?
     (a) Yes: it was one of the causes (along with the device).
     (b) Yes, but it is redundant: the device alone would have caused the press, so the hunger didn't make a difference.
     (c) No: the device's activation caused the press; the hunger was just a mental state that happened to be present but didn't cause anything.

  But (c) is implausible because we have two sufficient causes. We want:

     (a) Yes: it was a cause.
     (b) No: because the device would have caused it anyway, so the hunger wasn't necessary and hence not a cause.
     (c) The hunger did cause it, but only because it is a physical state in the brain; the mental aspect is irrelevant.

  We'll set:

  2. Symmetric Overdetermination Case:
     In a lab experiment, a rat's hunger (a mental state) and a brain-stimulating device are both present and active at the same time. Either one alone would have caused the rat to press a lever. The lever press occurs. Did the rat's hunger cause the lever press?
     (a) Yes: the hunger was a cause of the press, along with the device.
     (b) No: because the device would have caused the press even without the hunger, so the hunger wasn't necessary and didn't make a difference.
     (c) The hunger did cause it, but only because it is a physical state in the brain; the mental property of being hungry made no additional contribution.

  Now, for probabilistic:

  3. Probabilistic Case:
     A neuron fires with a certain probability when stimulated by a mental state (say, a decision). The same neuron can also be directly stimulated by a physical device. The device is set to stimulate the neuron with the same probability if the mental state does not. In a particular trial, the mental state occurs and the neuron fires. The device did nothing. Did the mental state cause the neuron to fire?
     (a) Yes: the mental state occurred and the neuron fired, and the device did nothing.
     (b) Yes, but only because the device didn't activate; if the mental state hadn't occurred, the device might have caused the neuron to fire (with the same probability), so the mental state wasn't necessary.
     (c) No: because the neuron might have fired anyway due to random fluctuations, and the mental state only raised the probability.

  But we want physical causes that raise probability? The exclusion argument in probabilistic terms: if the physical cause already raises the probability, is there room for the mental? So:

     Consider a mental state M that is thought to cause a physical event P (e.g., a behavior). The complete physical state at the time, C, already determines the probability of P (say, 0.8). If M occurs, it is always accompanied by C. Does M cause P?
     (a) Yes: because when M occurs, the probability of P is 0.8, which is higher than without M? But without M, C doesn't occur? Actually, M is accompanied by C, so without M, we don't have C. We need a case where the physical state without the mental state is possible? Or we can have:

     A patient has a brain state C that has a 80% chance of causing a smile. When the patient is happy (a mental state M), brain state C always occurs. In a particular instance, C occurs and the patient smiles. Did the happiness cause the smile?
     (a) Yes: the happiness was present and C occurred and caused the smile.
     (b) Yes, but only because the brain state C caused the smile; the happiness didn't add anything over and above C.
     (c) No: because the brain state C already raised the probability of the smile to 80%, and the happiness is just an aspect of C, so it didn't cause anything extra.

  But (a) and (b) are similar. We need to see if M does any work. Alternatively:

     In a population, when brain state C occurs without the mental state M (if that's possible), the probability of smiling is 0.8. When M occurs, it is always with C, and the probability of smiling is 0.8. Does M cause the smile?
     (a) Yes: because M is present when C occurs and the smile occurs.
     (b) No: because the probability of smiling given C is the same whether M is present or not (but M is always present with C, so we can't compare). 

  We need a case where we can condition on C. So:

     We have two groups: 
        Group 1: brain state C occurs without M (if possible) -> smile with prob 0.8.
        Group 2: brain state C occurs with M -> smile with prob 0.8.
     Then, for an instance in group 2, did M cause the smile?
     (a) Yes: because M was present and the smile occurred.
     (b) No: because the probability of smiling is the same whether M is present or not, given C. So M makes no difference.

  But in group 1, how can C occur without M? If M is identical to C, then it's not possible. If M supervenes on C, then it might be that C without M is not possible. So we need a case where the same physical state can occur without the mental state? That might be controversial.

  Alternatively, we can have a case of multiple realization: the same mental state M can be realized by different physical states. Then, we can condition on the physical state and see if M adds predictive power.

  But that's for the multiple realizability case. For probabilistic, let's do:

     A mental state M is realized by a physical state P. P causes an effect E with probability 0.8. In a particular instance, M (and hence P) occurs, and E occurs. Did M cause E?
     (a) Yes: M occurred and E occurred, and M is realized by P which caused E.
     (b) Yes, but only because P caused E; M itself didn't do anything.
     (c) No: because P already raised the probability of E to 0.8, and M is just an aspect of P, so it didn't cause anything extra.

  But this is similar to the sample question.

  We can have a case where the physical cause is incomplete:

     A person has a brain state that raises the probability of a decision (say, to press a button) from 0.5 to 0.7. The person also has a reason (a mental state) to press the button, which raises the probability to 0.9 when present. In a particular case, both the brain state and the reason are present, and the decision occurs. Did the reason cause the decision?
     (a) Yes: the reason raised the probability beyond what the brain state did.
     (b) Yes, but only because the reason is a brain state that caused the decision; the reason as a mental state didn't add anything.
     (c) No: because the brain state already raised the probability, and the reason is just an aspect of the brain state.

  But then we are not conditioning on the brain state. To see if the reason adds anything given the brain state, we need:

     When the brain state is present but the reason is absent, the probability is 0.7. When both are present, the probability is 0.9. Then, in a case with both, did the reason cause the decision?
     (a) Yes: because it raised the probability from 0.7 to 0.9.
     (b) No: because the brain state was already present and the reason is just a mental aspect of it, so it didn't cause anything extra.

  But (b) is not very plausible. We can make (a) the standard difference-making view.

  But we want to probe if there's room for the mental. Let's try:

  3. Probabilistic Case:
     A brain state C raises the probability of a behavior B from 0.5 to 0.8. A mental state M always occurs when C occurs, and when M occurs with C, the probability of B is 0.8. (We don't have cases of C without M.) In an instance where C and M occur and B occurs, did M cause B?
     (a) Yes: because M was present and B occurred, and M is associated with the increased probability.
     (b) No: because the probability of B given C is 0.8 regardless of M, and since M is always present when C is, it doesn't add anything.
     (c) It's unclear: we don't know what would happen if C occurred without M.

  We'll go with:

     (a) Yes: M is a cause of B.
     (b) No: M is not a cause of B because it doesn't make a difference beyond C.

  This is a live debate.

  4. Multiple realizability:
     Two robots, one with a silicon-based processor and one with a carbon-based processor, both exhibit the same behavior: they avoid obstacles. The avoidance behavior is caused by their respective processors. In each case, we can describe the cause as "processing information about the environment". Did the information processing cause the avoidance behavior?
     (a) Yes: in both cases, the robot avoided obstacles because it processed information about the environment.
     (b) No: the silicon processor caused the avoidance in one, and the carbon processor in the other; the information processing is just a description and not a real cause.
     (c) The information processing did cause it, but only because it is a physical process in each robot; the informational aspect didn't add anything.

  5. Conditional independence:
     In a person, a complete physical state P determines the probability of a behavior B. A mental state M always occurs when P occurs, and when P is fixed, the probability of B is the same regardless of whether we know M or not. In an instance where P and M occur and B occurs, did M cause B?
     (a) Yes: M was present and B occurred.
     (b) No: because once P is fixed, M makes no difference to B.

  6. Effect is a brain change:
     A person thinks about a happy memory, and this thought causes a release of dopamine in the brain. The thought is realized by a specific brain state. Did the thought (as a mental state) cause the dopamine release?
     (a) Yes: the thought caused the dopamine release.
     (b) Yes, but only because it is a brain state that caused the release; the thought itself, as a mental state, didn't cause anything.
     (c) No: the brain state caused the dopamine release; the thought is just an aspect.

  7. Physical duplicates with different phenomenal states:
     Two agents are physically identical at the moment of acting, including their brain states. However, one is experiencing pain and the other is experiencing an itch (due to different histories). Both perform the same behavior: they take a pill. Did the pain in the first agent cause the pill-taking?
     (a) Yes: the pain caused the pill-taking.
     (b) No: because the physical state was the same in both, and it caused the pill-taking; the pain, being different from the itch, did not cause the pill-taking because if it had, then the itch in the duplicate wouldn't have caused the same behavior? Or because the physical state is what caused it.
     (c) It's unclear: the physical state caused the pill-taking, and the pain and itch are just how it feels.

  8. A case to probe causation as production vs. difference-making:

     A person is in a room with two buttons: a red button and a blue button. Pressing either button will cause a light to turn on. The person presses the red button and the light turns on. Did pressing the red button cause the light to turn on?
     (a) Yes: the button press produced the light turning on.
     (b) Yes, but only because it made the difference between the light being off and on; pressing the blue button would have done the same.
     (c) No: because the light would have turned on anyway if the blue button had been pressed, so pressing the red button wasn't necessary.

  But (c) is not standard. We want to see if they think in terms of production or difference-making. So:

     (a) Yes: it was the producer.
     (b) Yes, but it is not the only possible cause; the blue button could have caused it too, but in this case, the red button did cause it by being the thing that made the difference on this occasion.
     (c) No: because it wasn't necessary.

  But (c) is not a live option for this case. So we need a different case.

     Preemption again: 

     Two assassins, A and B, are both ready to shoot. A shoots and kills the victim. B was about to shoot but did not because A shot first. Did A's shot cause the death?
     (a) Yes: it produced the death.
     (b) Yes: it made the difference; if A hadn't shot, B would have, but in this scenario A did shoot and it caused the death.
     (c) No: because if A hadn't shot, B would have, so the death would have occurred anyway.

  Now, (c) is a live option in some accounts (e.g., those that require necessity). But in standard accounts, (a) and (b) are yes, and (c) is no.

  We can use this for mental causation:

     Two brain processes, A and B, are both sufficient to cause a behavior. A occurs and causes the behavior; B is inhibited because A occurred. Did the mental state associated with A cause the behavior?
     (a) Yes: it produced the behavior.
     (b) Yes: it made the difference; if it hadn't occurred, B might have caused it, but in this case it did cause it.
     (c) No: because the behavior would have occurred anyway (via B).

  9. Another case: to probe if mental properties can be causes without identity.

     A person has a belief that it will rain and a desire to stay dry. This causes him to take an umbrella. The belief and desire are realized by a brain state. Did the belief and desire (as mental states) cause him to take the umbrella?
     (a) Yes: the belief and desire caused the action.
     (b) Yes, but only because they are brain states; the mental content didn't cause anything.
     (c) No: the brain state caused the action; the belief and desire are just how we describe it.

  10. We need one more. How about a case of mental-to-mental causation?

     A person feels pain, which causes them to feel distressed. The pain is realized by a brain state. Did the pain (as a mental state) cause the distress (another mental state)?
     (a) Yes: the pain caused the distress.
     (b) Yes, but only because the brain state of the pain caused the brain state of the distress; the mental states didn't cause each other.
     (c) No: the brain state caused the distress; the pain is just an aspect.

  Now, let's list all 10:

  1. The monitor case (sample).
  2. Symmetric overdetermination: rat's hunger and device both active.
  3. Probabilistic: brain state C (with mental state M) raises probability of B to 0.8, and M is always present with C. In an instance, C and M occur and B occurs. Did M cause B?
  4. Multiple realizability: two robots with different hardware, both avoid obstacles by processing information. Did the information processing cause the avoidance?
  5. Conditional independence: fixed physical state P, mental state M adds no predictive power for behavior B. In an instance with P, M, and B, did M cause B?
  6. Brain change: thought causes dopamine release.
  7. Physical duplicates: one in pain, one in itch, both take a pill. Did the pain cause the pill-taking in the first?
  8. Preemption: two brain processes, one preempts the other. Did the mental state associated with the first cause the behavior?
  9. Belief-desire causing action.
  10. Mental-to-mental: pain causing distress.

  But we have 10. We need to assign numbers and options.

  Let's write them formally:

  Questions:

  1. (Sample) A patient has a monitor implanted in her motor cortex. The monitor is programmed to detect any attempted hand movement that is failing to be initiated and to stimulate the cortex so that the same movement occurs. On Tuesday afternoon she reaches for a glass because she wants a drink and believes the glass contains water; the monitor detects nothing amiss and does nothing. Did her wanting a drink and her believing there is water cause the reaching?
     (a) Yes: the monitor did nothing, and the reaching happened because of what she wanted and believed.
     (b) Yes, but only because wanting the drink and believing there was water were, on that occasion, goings-on in her brain that produced the reaching; the wanting and the believing themselves made no difference to anything.
     (c) Yes in the everyday sense, but what actually brought the reaching about was the neural process, and the wanting and the believing came along with it without doing any of the work.

  2. In a lab experiment, a rat's hunger (a mental state) and a brain-stimulating device are both present and active at the same time. Either one alone would have caused the rat to press a lever. The lever press occurs. Did the rat's hunger cause the lever press?
     (a) Yes: the hunger was a cause of the press, along with the device.
     (b) No: because the device would have caused the press even without the hunger, so the hunger wasn't necessary and didn't make a difference.
     (c) The hunger did cause it, but only because it is a physical state in the brain; the mental property of being hungry made no additional contribution.

  3. A brain state C raises the probability of a behavior B from 0.5 to 0.8. This brain state is always accompanied by a mental state M. When C and M occur, the probability of B is 0.8. In a particular instance, C and M occur and B occurs. Did M cause B?
