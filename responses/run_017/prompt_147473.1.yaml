  For attributable fractions, counterfactual thinking works even without necessary connections. Regularities allow us to say "if not X, 30% fewer cases," which occasionalism accepts as patterns, not causal glue. 

  The trio seems consistent under a pragmatic pluralism. Each context dictates the approach: administrative simplicity, intervention efficiency, or population-level statistics. The occasionalist can accept all as useful fictions. 

