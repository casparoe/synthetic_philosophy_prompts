  *What is wrong/missing:* Nothing significant. The reasoning is defensible and aligns with the handout’s definition of Devlin’s position.  
  *What would earn marks:* Full credit is earned by demonstrating why Devlin’s premises (common morality as cement; limits-of-toleration standard) do not support the prohibition given Aetolia’s unique basis for cohesion and the nature of the revulsion.

  **(c) Mark: 6/8**  
  *What is right:* Correctly addresses the disintegration thesis’s status: identifies it as an empirical claim Hart criticises for lacking evidence. Validly notes that the Aetolians’ false belief (stipulation ii) undermines the reasonableness of the revulsion under Devlin’s standard. Correctly concludes that Hart’s harm principle opposes criminalisation where no harm to others exists.  
  *What is wrong/missing:* (i) The reference to "comparative evidence" of jurisdictions decriminalising without collapse *goes beyond the handout’s authority*. While Hart challenges the thesis as unproven, the handout does not assert it is "falsified" or provide evidence; the candidate imports an unsupported empirical claim. (ii) The claim that criminalisation would be "pure legal moralism... the view that the law may coerce people **for their own good**" is a critical error. The handout explicitly distinguishes legal moralism (criminalising immorality/corruption of common morality) from legal paternalism (protecting the agent from self-harm). The bill’s stated ground (preventing societal dissolution) aligns with legal moralism, *not* paternalism. The concluding appeal to liberal neutrality ("a liberal state must remain neutral...") is irrelevant to Hart’s harm principle as presented in the handout.  
  *What would earn full marks:* Sticking strictly to Hart’s three strands from the handout: challenging the disintegration thesis as *unsubstantiated* (not falsified), noting the false belief undermines the "reasonable person" standard for positive morality, and applying the harm principle directly to vellin-use (no harm to others). Avoiding conflation of moralism with paternalism and extraneous political theory.
