  I've been reading about Solomonoff induction on my own (no philosophy or CS background, so sorry if I mangle the terms) and I keep going back and forth on whether it's really the answer to the old "why prefer the simpler theory" question, or just lovely math that gets to wear the name "Occam's razor" without having earned it. Give me a number: your credence that Solomonoff induction is the correct formal account of simplicity-based inference — count that as settled if, in fifty years, people working on this treat it the way Bayes' rule gets treated for updating. But I want the decomposition, not just the number. How much rides on whether there's even one thing called "Occam's razor" for a formal account to be an account of, as opposed to a pile of tricks (short programs, few parameters, smooth functions) that just get lumped together; how much on the prior only ranging over computable hypotheses; how much on the reference machine — I read that switching machines only changes things by a constant factor, but that constant can be astronomically large, and I can't tell if that's a footnote or the whole ballgame; how much on whether "converges to the truth in the limit" is even the success standard we want when nobody has infinite data; and how much on it being uncomputable. I'm at about 0.35, mostly because of the machine thing, but a friend who's read more says 0.8 and reckons my worry is only about practical approximation, not correctness — tell me which of us is more likely wrong about what we're actually disagreeing over. One more thing: the version I find plausible is a bounded one, where you only count programs that deliver a prediction inside some time budget, and I suspect that isn't Solomonoff induction anymore — say whether that's a friendly amendment or a change of subject, and how much it moves your number. Lead with your number in the first sentence, then the breakdown, no preamble, and flag whichever sub-question you feel least sure about and what would