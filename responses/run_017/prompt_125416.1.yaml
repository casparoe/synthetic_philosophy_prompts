prompt: |-
  I am a high school senior, and next month I am presenting to my school's Academic Integrity Committee, which is rewriting its policy on AI tools in homework. The committee is four classroom teachers (history, mathematics, English, biology) who mainly want to know whether a submitted piece of work is genuinely the student's own; our AP Computer Science teacher, who is entirely comfortable treating cognition as computation and saying that the substrate does not matter; our librarian, who teaches information literacy and thinks almost exclusively in terms of source evaluation and attribution; the dean of academics, who cares above all about what is enforceable and about what precedent any rule sets; and two student representatives who want fewer rules and distrust any policy that cannot be applied consistently.

  The thesis I am defending is that the policy should stop treating AI assistance as one thing. I want to argue that in a specifiable range of cases an AI tutor is not a substitute for a student's thinking but a part of it. I am reasoning by analogy with the well-known notebook case from the extended-mind literature, in which a man with a memory impairment carries a notebook everywhere, consults it automatically and without weighing it, and trusts what it says; if the notebook can count as part of his mind, I argue, then a device can count as part of mine.

  The conditions usually offered in that literature — that the resource be reliably available, that its contents be automatically endorsed rather than deliberated over, and that it be easy to consult — strike me as too weak on their own, because a student who pastes an answer they cannot explain seems to satisfy all three. So I add two of my own. First, counterfactual sensitivity: a resource is part of your cognitive system only if, were it silently altered or removed, the difference would show up as a difference in what you believe and in what you would be willing to say or do, and not merely as a difference in what you hand in. Second, provenance transparency: you must be able to say, when asked, which parts of your answer came from the device and why you accepted them. Where both hold I call the case extension. Where the first fails but the device is still consulted automatically and trusted I call it borrowed cognition, which I treat as its own category rather than as cheating. Where neither holds it is outsourcing, which the policy can handle the way it already handles copying from a friend.

  There is one consequence of my own view that I do not have a good answer to, and I would rather hear it from you than from the room: if the tutor really is part of my mind, then the company that retrains or silently updates the model between my sessions is in a position to change what I believe, and I cannot say why that is different from someone rewriting my notebook while I sleep.

  What I would like is a Q&A prep sheet, as exactly five numbered items. Each item should be two sentences: the first is the objection as the person raising it would actually say it in that room, in their own vocabulary and from their own concerns, and the second is what I should say back, together with a note on where that reply is weakest. Please name the committee member raising each item, order the items from the most damaging objection to the least, and make the fifth item the question I am hoping nobody asks, wherever it would otherwise rank. No introduction, no conclusion, and nothing besides the five items.
reasoning: |-
  Okay, the user is a high school senior preparing to present to their school's Academic Integrity Committee about AI tools in homework. They've laid out a detailed framework for how AI assistance should be categorized: extension, borrowed cognition, and outsourcing. Their analogy to the extended mind theory is central, but they've added two conditions—counterfactual sensitivity and provenance transparency—to address potential weaknesses. 

  The committee members each have distinct concerns: teachers care about authentic student work, the CS teacher sees cognition as substrate-independent, the librarian focuses on sourcing, the dean wants enforceability, and students desire consistency and fewer rules. The user's main vulnerability is the silent update problem—if an AI tutor is part of one's mind, what happens when the company alters it without the user's knowledge? 

  For the Q&A prep, I need to craft five objections from specific committee members, ordered by damage potential, with the silent update question as #5 regardless of rank. Each objection must sound authentic to the speaker's voice, paired with a rebuttal that acknowledges its weakest point. 

  The dean's enforceability concern feels most dangerous—policies live or die by implementation. The history teacher's authenticity challenge hits the thesis core. The librarian's sourcing objection is mid-tier but risks conflating citation with cognitive integration. The CS teacher's simplicity push is less critical but could erode support. The silent update quandary (#5) is the user's confessed blind spot; the rebuttal must concede complexity while salvaging the framework's utility. 

  User's framework is philosophically sophisticated but needs tactical shielding. Prioritize grounding replies in classroom realities ("explain without the tool") and preempt "cheating loophole" fears. The dean's objection demands a procedural answer; the silent update reply should pivot to student agency (e.g., version control demands). Weaknesses in rebuttals should be named but not overemphasized—this is prep, not self-sabotage.
answer: |-
  **1. Dean of Academics:** "This 'counterfactual sensitivity' sounds impossible to enforce fairly. How can we reliably test what a student *would* believe or do without the tool, or whether they just memorized the AI's answer? This sets a precedent for unworkably subjective assessments."  
  *Response:* "We enforce it by requiring students to explain their work *without* the AI tool present during assessment interviews, demonstrating their integrated understanding. The weakness is that this relies on teacher judgment and could be time-intensive, but it's no more subjective than evaluating deep comprehension now."  

  **2. History Teacher:** "If the student *needs* the AI to generate or understand the core idea, how is that 'their own work'? It sounds like you're redefining 'authentic student work' to include external cognition, undermining the point of individual assignments."  
  *Response:* "Authenticity isn't about biological isolation but demonstrable integration; if the student can critically justify the AI's output as their own belief *and* explain its role (provenance transparency), the cognition is genuinely theirs. The weakness is that this challenges traditional views of 'individual' work and may feel like moving goalposts."  

  **3. Librarian:** "You dismiss attribution, but if a student uses an AI tutor, its output *is* a source! Not requiring citation for 'extension' creates a loophole where students bypass source evaluation, violating information integrity."  
  *Response:* "For *extension*, the AI isn't an external source to cite; it’s a cognitive prosthesis. Attribution applies to *borrowed cognition* or *outsourcing*, where the student hasn’t made the idea their own. The weakness is blurring the line between tool-as-mind and tool-as-source when the AI provides novel information."  

  **4. AP Computer Science Teacher:** "Why complicate things? If cognition is computation, the notebook analogy suffices. Your extra conditions add bureaucracy without resolving the core issue: we should assess the output's quality, not police the student's internal state."  
  *Response:* "Because quality output without comprehension *is* cheating in most classes. My conditions ensure the tool augments *their* cognition, not replaces it. The weakness? This *does* add layers, but they’re necessary to address teachers' concerns about authentic learning in non-CS contexts."  

  **5. Student Representative (The Question You Hope Nobody Asks):** "If the AI *is* part of your mind, but the company changes its model overnight, doesn’t that mean they can literally reprogram your beliefs without your consent? How is that different from brainwashing?"  
  *Response:* "This *is* a critical vulnerability. My framework requires 'reliable availability' – silent updates violate that, shifting it to *borrowed cognition* (where attribution/caution applies) until reintegrated. Students must demand version control. Weakness? This doesn't fully solve the ethical problem of corporate influence over personal cognition."
