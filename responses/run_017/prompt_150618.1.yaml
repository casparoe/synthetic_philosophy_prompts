  ### Exam Question: Causal Inference and Simpson's Paradox  
  **Total Marks:** 25  
  **Time Allotment:** ~60 minutes (as part of a take-home final)  
  **Instructions:** Answer all parts clearly and concisely. Show all calculations and reasoning. The question is self-contained; no external references are needed.  

  ---

  #### Background  
  A clinical trial compares recovery rates for Drug A and Drug B. Patients are categorized by disease severity (Mild or Severe). Below is the data:  

  | Severity | Drug | Recovered | Total Patients | Recovery Rate |
  |----------|------|-----------|----------------|--------------|
  | Mild     | A    | 90        | 100            | 90%          |
  | Mild     | B    | 76        | 80             | 95%          |
  | Severe   | A    | 30        | 100            | 30%          |
  | Severe   | B    | 56        | 160            | 35%          |
  | **Pooled** | **A** | **120**   | **200**        | **60%**      |
  | **Pooled** | **B** | **132**   | **240**        | **55%**      |

  ---

  #### Part (a): Simpson’s Reversal (5 marks)  
  1. Calculate the risk difference (RD) between Drug B and Drug A for Mild patients, Severe patients, and the Pooled group. Report each RD in percentage points (pp) as: (B’s rate – A’s rate).  
  2. Precisely state the reversal observed (e.g., "In each stratum, B is better/worse by X pp, but in the pooled data, B is better/worse by Y pp").  

  #### Part (b): Causal Stories (6 marks)  
  1. **Confounder story:** Severity is a pre-treatment variable influencing drug choice. Doctors prefer Drug B for Severe cases. Explain why the stratified analysis (Mild/Severe) should guide recommendations. Report which drug is better and why.  
  2. **Mediator story:** Severity is a post-treatment variable. Drug A increases severity (e.g., side effects), which then affects recovery. Explain why the pooled analysis should guide recommendations. Report which drug is better and why.  

  #### Part (c): What People Conflate (10 marks)  
  1. **Derivation and decomposition:**  
     - Assume treatment assignment is independent of severity within strata (no confounding). Prove that the pooled risk difference (RD<sub>crude</sub>) is a convex combination of the stratum-specific RDs (RD<sub>Mild</sub> and RD<sub>Severe</sub>). Use weights proportional to the overall stratum size.  
     - Decompose the observed RD<sub>crude</sub> from the table into:  
       \[
       \text{RD}_{\text{crude}} = \underbrace{\sum_s \text{RD}_s \cdot P(\text{stratum}=s \mid \text{B})}_{\text{Effect Term}} + \underbrace{\sum_s \text{Rate}_A^s \cdot \left[ P(\text{stratum}=s \mid \text{B}) - P(\text{stratum}=s \mid \text{A}) \right]}_{\text{Composition Term}}
       \]  
       Calculate both terms numerically using the table. Conclude why an observed reversal (like in Part a) implies confounding.  
     - Briefly explain why no sign reversal is possible for RD, risk ratio (RR), or odds ratio (OR) under randomization (independence).  

  2. **Randomized trial analysis:**  
     A different trial randomizes 50% to Drug A and 50% to Drug B within each stratum (no confounding). Data:  
     - **Stratum X (Low risk):** A: 20/100 recovered (20%), B: 50/100 recovered (50%).  
     - **Stratum Y (High risk):** A: 136/170 recovered (80%), B: 160/170 recovered (94.1%).  
     - **Pooled:** A: 156/270 recovered (57.8%), B: 210/270 recovered (77.8%).  
     - **Odds ratios (OR):** Stratum X: OR ≈ 4.0, Stratum Y: OR ≈ 4.0, Pooled: OR ≈ 2.56.  
     Tasks:  
     - Verify the stratum-specific and pooled ORs (show calculations).  
     - Explain why the pooled OR (2.56) differs from the stratum-specific ORs (4.0) despite randomization.  
     - State which OR (stratum-specific or pooled) should be reported for:  
       (i) A doctor treating a patient with unknown risk profile.  
       (ii) A health policymaker assessing population-level effectiveness.  

  #### Part (d): Subgroup Fishing (4 marks)  
  A researcher conducts 30 subgroup analyses in a randomized trial and finds one subgroup where the treatment effect reverses sign.  
  1. Why does the machinery from Parts (b) and (c) **not** justify this reversal as causal?  
  2. What must be true for a subgroup claim to be credible? (List 2 conditions.)  

  ---

  ### Model Answer  
  **Approx. 850 words**  

  #### Part (a)  
  1. **Risk differences (RD):**  
     - Mild: RD = 95% - 90% = **+5 pp** (B better).  
     - Severe: RD = 35% - 30% = **+5 pp** (B better).  
     - Pooled: RD = 55% - 60% = **–5 pp** (A better).  
  2. **Reversal statement:**  
     > In both strata, Drug B has a **+5 pp** higher recovery rate than Drug A. However, in the pooled data, Drug B has a **–5 pp** lower recovery rate than Drug A.  

  #### Part (b)  
  1. **Confounder story (severity pre-treatment):**  
     Severity influences both drug choice (doctors pick B for Severe cases) and recovery (Severe cases recover less). The stratified analysis adjusts for this confounding. **Recommendation:** Drug B is better (RD = +5 pp in both strata). Pooled data is misleading due to imbalance: More Severe cases received B (160/240 B-patients vs. 100/200 A-patients).  
  2. **Mediator story (severity post-treatment):**  
     Drug A causes severe side effects (increasing severity), which then reduce recovery. Conditioning on severity (a mediator) blocks part of A’s effect. **Recommendation:** Drug A is better overall (pooled RD = –5 pp). The pooled analysis captures the total effect (including severity mediation).  

  #### Part (c)  
  1. **Derivation and decomposition:**  
     - **Proof under independence:** If treatment independent of severity, then:  
       \[
       \begin{align*}
       P(\text{Rec}\mid\text{B}) &= \sum_s P(\text{Rec}\mid\text{B}, s) \cdot P(s) \\
       P(\text{Rec}\mid\text{A}) &= \sum_s P(\text{Rec}\mid\text{A}, s) \cdot P(s) \\
       \text{RD}_{\text{crude}} &= \sum_s \left[ P(\text{Rec}\mid\text{B}, s) - P(\text{Rec}\mid\text{A}, s) \right] \cdot P(s) = \sum_s \text{RD}_s \cdot P(s).
       \end{align*}
       \]  
       Thus, RD<sub>crude</sub> is a convex combination of RD<sub>s</sub> (weighted by overall stratum proportion). No sign reversal possible for RD. For RR/OR, no reversal *in sign* is possible under randomization if effects are monotonic (though magnitudes can change due to non-collapsibility).  
     - **Decomposition with table data:**  
       - *Effect term:*  
         \[
         \sum_s \text{RD}_s \cdot P(s \mid \text{B}) = (+5\%) \cdot \frac{80}{240} + (+5\%) \cdot \frac{160}{240} = +5\%.
         \]  
       - *Composition term:*  
         \[
         \begin{align*}
         &P(\text{Mild} \mid \text{B}) = 80/240 = 1/3, \quad P(\text{Mild} \mid \text{A}) = 100/200 = 0.5 \\
         &P(\text{Severe} \mid \text{B}) = 160/240 = 2/3, \quad P(\text{Severe} \mid \text{A}) = 100/200 = 0.5 \\
         &\text{Rate}_A^{\text{Mild}} = 90\%, \quad \text{Rate}_A^{\text{Severe}} = 30\% \\
         &\sum_s \text{Rate}_A^s \cdot [P(s \mid \text{B}) - P(s \mid \text{A})] \\
         &= 90\% \cdot (1/3 - 0.5) + 30\% \cdot (2/3 - 0.5) \\
         &= 90\% \cdot (-1/6) + 30\% \cdot (1/6) = -15\% + 5\% = -10\%.
         \end{align*}
         \]  
       - **Total RD<sub>crude</sub> = Effect term + Composition term = +5% + (–10%) = –5%** (matches table).  
       The negative composition term (–10%) reflects confounding: Doctors assigned more Severe cases (low recovery) to B. The reversal implies confounding.  

  2. **Randomized trial analysis:**  
     - **OR calculations:**  
       - Stratum X: OR = (50/50) / (20/80) = 1 / 0.25 = **4.0**.  
       - Stratum Y: OR = (160/10) / (136/34) = 16 / 4 = **4.0**.  
       - Pooled:  
         A: Recovered = 156, Not = 114 → Odds = 156/114 ≈ 1.368.  
         B: Recovered = 210, Not = 60 → Odds = 210/60 = 3.5.  
         OR = 3.5 / 1.368 ≈ **2.56**.  
     - **Why pooled OR differs:** Randomization ensures no confounding, but OR is non-collapsible. Pooled OR ≠ weighted average of stratum-specific ORs due to differing baseline risks (20% in X vs. 80% in Y) and unequal stratum sizes (X: 200 patients, Y: 340 patients).  
     - **Reporting:**  
       (i) For a doctor treating a patient with **unknown risk profile**, report the **pooled OR (2.56)**—it estimates the average causal effect for the entire population.  
       (ii) For a policymaker assessing **population-level effectiveness**, report the **pooled OR (2.56)**—it aggregates effects across strata.  

  #### Part (d)  
  1. **Why not justified:**  
     - Part (b): Reversal requires a specific causal structure (confounder/mediator). Fishing without a priori justification risks conditioning on mediators or noise.  
     - Part (c): Under randomization, no true reversal in sign is possible. The subgroup reversal is likely spurious (multiple testing) or due to effect heterogeneity, not causation.  
  2. **Credibility conditions:**  
     - Subgroup defined by **pre-treatment** variable (e.g., genetics, not post-treatment mediators).  
     - **Pre-specified hypothesis** with biological rationale (not data-driven).  
     - (Optional) Adjustment for multiple comparisons.  

  ---

  ### Marking Scheme (25 marks total)  
  **Part (a) [5 marks]:**  
  - A (5): Correct RDs (+5 pp, +5 pp, –5 pp) and precise reversal statement.  
  - B (3–4): Minor arithmetic errors or vague reversal statement.  
  - C (1–2): Major errors (e.g., incorrect rates) or missing reversal.  
  - *Common mistake: Miscomputes pooled denominator (e.g., 200+240=440 for all patients).*  

  **Part (b) [6 marks]:**  
  - A (6): Clear causal stories; correct recommendations (B for confounder, A for mediator); links to table.  
  - B (4–5): One story/recommendation weak; minor omissions.  
  - C (1–3): Confuses confounder/mediator; no link to table.  
  - *Common mistake: Reverses stories (e.g., claims mediator when severity is pre-treatment).*  

  **Part (c) [10 marks; c1: 6, c2: 4]:**  
  - **c1 (Derivation):**  
    - A (6): Correct proof of RD convex combo; accurate decomposition (+5%, –10%); valid conclusion about confounding and no reversal.  
    - B (4–5): Proof incomplete; decomposition errors; weak conclusion.  
    - C (1–3): Major derivation errors.  
  - **c2 (Randomized table):**  
    - A (4): Correct ORs (4.0, 4.0, 2.56); explains non-collapsibility; valid reporting recommendations.  
    - B (2–3): ORs incorrect; vague explanation; weak reporting.  
    - C (1): Incorrect ORs or no attempt.  
    - *Common mistake: Claims pooled OR reversal implies confounding (despite randomization).*  

  **Part (d) [4 marks]:**  
  - A (4): Explains spuriousness (fishing/multiple testing); lists two credible-subgroup conditions.  
  - B (2–3): Partial explanation; one condition missing.  
  - C (1): Incomplete or irrelevant.  
  - *Common mistake: Suggests subgroup reversals are always causal if pre-specified.*  

  **Grade Boundaries:**  
  - **A (21–25):** Correct in all parts; precise causal reasoning; no arithmetic errors.  
  - **B (15–20):** Minor errors (e.g., OR calc in c2); incomplete decomposition; one weak story in (b).  
  - **C (10–14):** Multiple errors; confounds key concepts (e.g., mediator vs. confounder).  
  - **D (<10):** Fundamental misunderstandings; missing sections.
