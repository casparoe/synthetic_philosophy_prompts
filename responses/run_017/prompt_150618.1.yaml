  Part (d): Subgroup fishing. We explain that in a randomized trial, if we slice the data in many ways and find one subgroup where the sign flips, this is not credible because:

  - The causal graph for the entire trial has no confounders (due to randomization), so the overall effect is unbiased. 
  - The subgroup analysis might be conditioning on a post-treatment variable (if the subgroup is defined after treatment) or might be a mediator, which would be inappropriate if we want the total effect. 
  - The reversal in a subgroup might be due to chance (multiple testing) or to a true effect modification, but without pre-specification and without a causal story, it's not credible.

  For a subgroup claim to be credible, we would need:
