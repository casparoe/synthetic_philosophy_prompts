prompt: |-
  You are a professional philosopher who works at the intersection of social philosophy, collective action, and game theory, and who has spent real time on races to the bottom, positional competition, and the family of failures that now get labelled Moloch or multipolar traps. Please work slowly. Start by reading my cases and, informally, noting which patterns you see and which of my verdicts strike you as unstable or stolen from something else I believe. Only then try to write a principle down; do not settle for a slogan, and do not start from the labels. I do not want reading recommendations or citations of any kind, only your own analysis.

  Here is where I am. I use Moloch loosely for a dynamic in which each party's locally sensible escalation leaves everyone worse off and no one can stop escalating. But when I go case by case my verdicts stop lining up, and I want to know what principle I am actually using, whether it holds together, and what it says about the case I cannot decide.

  1. Eight families fish a shared lake. Each takes an extra boatload. Verdict: a genuine trap. A quota with real enforcement is justified, and the family that takes the extra boatload is doing something mildly wrong, not merely something unlucky.

  2. Two airlines in a mature market cut fares until both are flying at close to marginal cost. Both would rather collude. Verdict: not Moloch at all. This is competition working, travellers win, and any coordination between the firms would be the bad thing rather than the remedy.

  3. Two consumer-goods firms escalate advertising until the spending roughly cancels out and prices absorb the cost. Verdict: a trap, and yet I do not blame anyone, I am not sure regulation is warranted, and it feels distinctly less bad than the lake. My guess is that this is because in the lake the harm lands on people who never played, whereas here it mostly lands on shareholders and customers of the two firms.

  4. Two jurisdictions bid against each other to host a factory, cutting corporate tax rates and loosening labour rules. Verdict: a trap, and the jurisdiction that undercuts is blameworthy in a way the fishers are not. It is auctioning off something that was not its to auction.

  5. Parents in my city hire private tutors so their children can pass a selective exam. Every parent would prefer that nobody did this. Verdict: a trap at the collective level, and yet this parent is doing nothing wrong, I would do it myself, and it does not feel like the tax case at all. This is the pair I cannot reconcile: a unilateral escalation that I excuse in case 5 and condemn in case 4. My only thought is that the tutoring actually teaches the child something, while the tax cut produces nothing and only moves surplus from residents to shareholders. I do not trust that thought.

  6. The always-on work culture in my industry. No manager I have met wanted it. A few firms adopted it and won contracts; the rest matched to keep staff and clients; firms that tried to opt out lost people to firms that had not, and two of them were acquired. Everyone is now worse off and almost everyone would be relieved if it were banned. Verdict: the purest trap on my list, and also the one that breaks my own way of thinking about it, because there is no defection to prohibit, no defector to blame, and nothing anyone chose at the moment it mattered. Call it escalation without escalators: the outcome spreads by differential survival rather than by decision.

  7. A solvent but illiquid bank, and a rumour. Depositors who withdraw are not wrong, are not blameworthy, and are doing what any of us would do; the failure is a coordination failure with two equilibria rather than a trap. But the waste looks exactly like the waste in the lake, and I do not know why I blame the fishers and not the depositors. That is my second unreconciled pair.

  My tentative principle, which I suspect is wrong: the label applies just when (a) each party has a dominant or near-dominant reason to escalate whatever the others do, (b) the escalation is dissipative, burning resources without producing anything anyone outside the escalating group wants, and (c) the parties cannot coordinate because they are too many, too anonymous, or too rarely repeated. Case 6 seems to fail (a) while being my clearest trap. Case 7 seems to satisfy (c) and fail (a). Case 2 fails (b) only. Test this against all seven, repair it, or replace it.

  The case I go back and forth on: a group of parents is circulating a pledge not to hire a tutor before year 10, and I have seen the sign-up sheet. I think roughly a third will quietly break it. Signing feels like opting out and also like handing my child's place to the children of the parents who cheat, and I cannot tell whether the pledge is the coordination that dissolves a trap, a sucker's bargain I should refuse, or a new and smaller race in visible virtue.

  What I want from you: a principle, or two or three ranked candidates, stated precisely enough that I could apply it to a new case without you; the case that motivates each clause; verdicts on at least three cases I have not listed, including at least one selection-driven case like case 6 and at least one where the escalation produces real benefits for people outside the race; and an honest statement of which of my verdicts your principle cannot accommodate, which of those you would overturn, and why overturning that verdict costs less than complicating the principle to save it. Then apply the result to the pledge, tell me what it says I should actually do on Monday, and name one empirical question whose answer would move my verdict on case 3 or case 5.
reasoning: |-
  Hmm, this user is clearly deeply engaged with complex coordination problems and has done impressive groundwork. They're wrestling with inconsistencies in their own intuitive judgments across seven varied cases of collective action failures, and have even drafted a preliminary principle they suspect is flawed. The level of specificity in their examples suggests they've thought about this for years, probably in professional capacity. 

  What stands out is their frustration with two particular asymmetries: excusing tutoring parents (case 5) while condemning tax-cutting jurisdictions (case 4), and blaming fishers (case 1) but not bank depositors (case 7). Their raw principle (a+b+c) feels like it's trying to capture three different things at once - incentive structures, value destruction, and coordination feasibility - which might explain why case 6 (evolutionary trap) breaks it. 

  The tutoring pledge dilemma is beautifully framed as a meta-trap: signing risks being a sucker, not signing risks free-riding on others' restraint. This isn't just theoretical for them - they need Monday-morning actionable advice. Their request for empirical questions shows admirable intellectual honesty; they want their framework testable.

  Notably, they reject labels and citations, demanding original analysis. This suggests either academic fatigue with jargon or past experiences with unhelpful theoretical answers. The phrase "verdicts stop lining up" indicates they prioritize internal consistency over conventional wisdom. 

  Their emotional tone mixes rigor with vulnerability - "I do not trust that thought" about tutoring benefits, and describing case 6 as "breaks my own way of thinking". This isn't detached philosophy; it's someone trying to build practical ethical compass for real-world coordination dilemmas. The banking case especially feels visceral - they see wasted resources identical to the lake but can't square their moral reactions.

  What they're ultimately seeking is a decision procedure that doesn't collapse under its own exceptions. My response must honor that by: first diagnosing why their principle fractures (as they suspect), then rebuilding incrementally from their strongest intuitions (like case 6 being "purest trap"), and finally stress-testing with new cases. The tutoring pledge application must be concrete - vague "it depends" answers would betray their trust.
answer: |-
  Here is a slow, principle-first analysis derived from your cases and verdicts. I'll diagnose your unstable judgments, build a principle step-by-step, test it rigorously, and resolve your dilemmas.

  ### Diagnosing Your Verdicts
  1.  **Key Tensions:**
      *   Blame asymmetry: You condemn tax-cutters (4) but excuse tutors (5) and depositors (7), despite all acting on individual incentives in a collective trap.
      *   Harm locus matters: You excuse advertising (3) because harm falls primarily on *participants* (shareholders/customers), versus the lake (1) harming non-participants (future fishers, ecosystem users).
      *   Value creation ambiguity: You suspect tutoring (5) might create *some* value (learning), while tax cuts (4) merely transfer surplus. This creates friction with the bank run (7), where withdrawal creates no value yet isn't blameworthy.
      *   **Case 6 breaks your (a):** No individual "decision to escalate" occurs; selection pressure drives the outcome. Yet it feels like the purest trap.
      *   **Case 7 breaks your (a) & (b):** Withdrawing is *strictly* dominant (a fails, no "near-dominant") and creates no dissipation *for the withdrawer* (b fails – they get their money!), yet the *collective* outcome is wasteful like the lake.

  2.  **Stolen Verdicts:**
      *   Case 2 (airlines): Your verdict ("competition working") imports standard welfare economics, overriding your Moloch framework when consumer benefit is clear. This is consistent but highlights that "worse off" needs careful definition.
      *   Case 5 (tutors): Your excuse ("I would do it myself") smuggles in a personal excusing condition ("reasonable participant perspective") not applied to the tax-cutter or fisher.
      *   Case 4 (tax cuts): Your condemnation ("auctioning off something not theirs") imports a strong view of communal property rights/state fiduciary duty, not inherent to the trap dynamic itself.

  ### The Core Principle: Escalation, Value Destruction, and Externality Capture
  Based on your stable intuitions (esp. Lake 1, Work Culture 6) and resolving the tensions:

  **Principle (Strict Definition):**
  *A **Moloch Trap** exists when:*
  1.  **Escalation Dynamics:** A competitive dynamic exists where relative position/access/survival is critical, and actions improving one actor's *relative* position impose net costs on others *within the competing group*.
  2.  **Net Value Destruction:** The *aggregate* effect of these position-seeking actions is to destroy net social value (reduce overall welfare) *or* to merely redistribute existing value *away* from the competing group to non-participants or purely into the cost of competition itself. Value created *within* the competition (e.g., learning from tutoring) is *deducted* from the total cost to assess net destruction.
  3.  **Captured Externalities:** The costs of the competition (value destruction) are significantly borne by entities *not* participating in the competitive action itself (future generations, the environment, non-mobile workers, the public fisc, non-withdrawing depositors) OR the competition destroys a shared resource essential for the group's own long-term viability (the lake, the bank's solvency).
  4.  **Coordination Failure:** Stable escape requires collective action (agreement + enforcement) that is empirically infeasible for the actors involved due to group size, anonymity, lack of repeated interaction, high enforcement costs, or selection pressures.

  **Why Ranked?** (1) & (2) define the *core inefficient dynamic*. (3) explains the *moral weight* and *resistance to internal solution* (why participants can't/won't self-correct). (4) confirms it's a *trap* (no unilateral exit).

  ### Applying the Principle to Your Cases

  1.  **Lake (Fishers):** YES.
      *   (1) Each extra boat improves *my* catch *relative* to others (or prevents loss), harming others' catch.
      *   (2) Net destruction: Overfishing destroys future stock (net loss), effort spent is wasteful.
      *   (3) Costs borne by future fishers/ecosystem (non-participants) & destroys shared resource.
      *   (4) 8 families too many for easy coordination; enforcement hard.

  2.  **Airlines (Fare War):** NO.
      *   (1) Cutting fares improves position (market share).
      *   **(2) NO Net Destruction:** Consumers gain surplus; overall welfare *increases*. Redistribution *to* consumers.
      *   (Fails (2) decisively).

  3.  **Advertising War:** WEAK YES (Trap), but LOW BLAME.
      *   (1) Escalating ads improves relative visibility/market share.
      *   (2) Net destruction likely: Resources burned for offsetting gains; little *net* consumer benefit (canceling ads); prices higher. *Minor* value creation (info) deducted.
      *   (3) **Weak/Limited Capture:** Costs largely borne *by participants* (shareholders via lower profits, customers via higher prices). Minimal impact on non-participants. Shared resource (market efficiency?) damaged but not destroyed.
      *   (4) Coordination (collusion) is illegal and hard to enforce. **Verdict:** Technically a trap (net waste, coordination failure), but low moral weight/blame *because costs are internalized* (3 weak). Regulation less warranted than lake.

  4.  **Tax/Labor Bidding (Jurisdictions):** YES (Strong Blame).
      *   (1) Cutting taxes/regs improves *relative* attractiveness to factory.
      *   (2) Net destruction: Public revenue lost/services cut OR labor protections eroded; factory gains are largely transfers from public/labor. Minimal *new* value created (location decision).
      *   (3) **Strong Capture:** Costs borne by *non-participants* – residents (lost services/tax burden), workers (eroded protections), future generations (underfunded infrastructure). Auctioning public goods/resources.
      *   (4) Coordination (agreement not to undercut) is hard (prisoner's dilemma among few, but high stakes).

  5.  **Tutoring Arms Race:** YES (Trap), but LOW BLAME.
      *   (1) Hiring tutor improves child's *relative* position on exam.
      *   (2) Net destruction: Huge resources spent for no *net* positional gain (if all do it, curve adjusts); stress, reduced childhood leisure. *Value creation (learning) is real BUT* it's often instrumental to passing the exam, not the primary goal. Significant net waste likely remains after deduction.
      *   (3) **Weak/Mixed Capture:** Costs *primarily* borne by participants (parents' money, children's time/stress). *Some* externalities: exacerbates inequality (non-participating children fall further behind), potentially degrades shared educational environment ("teaching to the test"). But core costs internal.
      *   (4) Coordination failure: Large anonymous group of parents; high stakes; cheating hard to prevent. **Verdict:** Trap, but low blame *because costs are mostly internal* (3 weak) and action (tutoring) has standalone value. Contrasts with Tax case on (3).

  6.  **Work Culture (Selection):** YES (Strong/Pure Trap).
      *   (1) Firms adopting "always-on" gain *relative* advantage (contracts, staff retention). Others must match to survive.
      *   (2) Net destruction: Wasted human capital (burnout), reduced productivity/innovation, lower overall well-being. Effort expended merely to maintain position.
      *   (3) **Strong Capture:** Costs borne by *employees* (health, family life) who are not the primary decision-makers driving the initial escalation. Shared resource (healthy workforce sustainability) destroyed.
      *   (4) Coordination failure is extreme: Driven by *selection pressure*, not explicit decisions. No stable individual actor to "defect" *from* a norm. Banning/regulation is the only realistic escape.

  7.  **Bank Run:** **NO** (Coordination Failure, Not Moloch Trap).
      *   (1) Withdrawing improves *my absolute* position (I get my money) regardless of others' actions. It's not primarily *relative* position seeking.
      *   (2) **NO Net Destruction *for the withdrawer*:** I get my full value. *Collective* outcome is destructive, but the *action* itself is value-preserving *for the actor*. (Fails core (1) & (2)).
      *   (3) Cost capture: YES (Losses borne by bank, remaining depositors, financial system). BUT...
      *   (4) Coordination failure: YES (Better equilibrium exists). **Verdict:** Pure coordination failure (multiple equilibria), *not* a Moloch trap. Explains lack of blame: Each depositor is acting to *preserve* their value in a fragile system, not escalating a competition that destroys value. Contrasts with Lake where *each* fisher's action *actively* depletes the resource.

  ### Overturning Your Verdicts & Why
  1.  **Bank Run (7) is NOT a Moloch Trap.** Your principle (c) is satisfied, but (a) and (b) are fundamentally misapplied. Withdrawing is dominant *and* value-preserving for the actor; the waste arises from the *collective switch* between equilibria, not from the inherent wastefulness of each action within a single equilibrium. Overturning this costs little: It preserves the core intuition that depositors aren't blameworthy and distinguishes this (equilibrium selection) from true escalation traps. Complicating the principle to include it would blur the core dynamic.
  2.  **Tutoring (5) IS a Trap (by strict definition), but LOW Blame.** Your instinct to excuse the parent is upheld, but *not* because "I would do it" or standalone value alone. The primary reason is **weak externality capture (3)** – the main costs fall on the participants (parents/kids) making the choices. Contrast with Tax case where costs are dumped onto non-consenting third parties (residents, workers). This justifies the blame asymmetry between 4 and 5.
  3.  **Advertising (3) IS a Trap (weak), LOW Blame/Regulation.** Your unease about regulation is upheld because of weak externality capture (3). The waste exists but is largely internal to the firms and their customers.

  ### New Cases & Verdicts (Testing the Principle)
  1.  **Selection-Driven (Like 6): "Publish or Perish" in Academia.** Journals demand more publications; scholars spend more time on incremental publishable work vs. risky/long-term/teaching. *(Verdict: YES - Strong Trap. (1) Relative position (grants/jobs) depends on publication rate. (2) Net destruction: Risk-averse research, neglected teaching/service, burnout. (3) Costs captured by junior scholars (exploited labor), students (worse teaching), society (less transformative research). (4) Driven by selection pressure on institutions/journals/scholars; individual escape impossible.)*
  2.  **Escalation with External Benefits: "Quality Arms Race".** Two smartphone makers escalate R&D spending to add new features, far beyond most users' needs. Prices rise. *(Verdict: NO. (1) Competitive dynamic (relative features). (2) **NO Net Destruction:** Significant new value created (innovation, features some users value, spillover tech). High cost, but net social benefit likely positive. Fails (2).)*
  3.  **Ambiguous Capture: "Bid Whispers" in Art Auctions.** Art dealers privately signal high bids to intimidate competitors, inflating prices. Museums/collectors pay more. *(Verdict: WEAK YES (Trap), LOW Blame. (1) Relative position (winning auction). (2) Net destruction: Resources wasted on signaling/inflated prices; minimal new value. (3) Costs captured primarily by *participants* (buyers pay more, sellers gain windfall). Public (if public museum) or specific collectors bear cost, but they *chose* to play. Less severe externality than Lake/Tax.)*

  ### The Tutoring Pledge: What to Do on Monday
  1.  **Diagnosis:** The pledge attempts to solve a **Moloch Trap** (as defined: Escalation, Net Waste, Weak Capture, Coordination Failure).
  2.  **The Pledge Itself is a Fragile Coordination Device:** It creates a *new*, smaller game.
      *   *Risk 1:* Cheaters exploit signers (you become a sucker). Outcome: Cheaters' kids win, signers' kids lose relatively *more* than if no pledge existed.
      *   *Risk 2:* Low participation (only 1/3 sign) means collective benefit is minimal. The trap persists.
      *   *Potential Benefit:* High participation + enforcement dissolves the trap. Everyone saves money/time, kids have less stress, competition shifts to other (hopefully more productive) factors.
  3.  **Applying the Principle:**
      *   Signing *only makes sense* if you believe:
          *   (a) Participation will be **sufficiently high** (well over 50%, ideally near 100%) to negate the relative advantage of tutoring.
          *   (b) **Enforcement is credible:** There's a mechanism (reputation, monitoring, sanctions) making cheating difficult and costly.
          *   (c) **Your personal risk** of being a sucker (if (a) or (b) fail) is acceptable *or* offset by the moral value of supporting the norm.
  4.  **Recommendation:** **Do NOT sign blindly on Monday.**
      *   **Investigate:** Gauge *real* commitment. Who organized it? Who's signed? Is there a plan for enforcement (even informal)? What's the chatter? ("Roughly a third will cheat" is a major red flag).
      *   **Assess Sucker Risk:** If cheating is easy and likely, signing likely harms *your* child relative to cheaters without stopping the overall trap. Your child loses twice (no tutor, others have tutor).
      *   **Assess Collective Viability:** If participation seems high (>70-80%) and organizers are credible/respected, signing strengthens a viable solution.
      *   **Alternative:** If the pledge seems weak, *don't sign*, but *also delay hiring a tutor*. Wait-and-see preserves your options. If the pledge gains critical mass, join later. If it collapses, you can tutor without having been a cheater on a pledge. This avoids the worst sucker outcome.
      *   **Act:** Based on your investigation Monday, choose: Sign (if viable), Delay & Monitor, or Tutor (if pledge collapses/never viable). **Default action without new info: Delay & Monitor.**

  ### Empirical Questions for Cases 3 & 5
  *   **Case 3 (Advertising War):** *"What proportion of the increased advertising expenditure is ultimately passed on to consumers as higher prices versus absorbed by shareholders as lower profits?"* **Why:** Determines the *locus of harm*. If mostly passed on, harm is internalized by customers (participants via choice), weakening externality capture (3) and blame/regulation justification. If mostly absorbed by shareholders, harm is still mostly internal to the firm/owners (participants), same conclusion. If it significantly harms suppliers/employees (non-participants in the ad war decision), it strengthens (3).
  *   **Case 5 (Tutoring):** *"Controlling for prior ability, what is the *net* effect of widespread private tutoring on *overall* cohort performance (e.g., average scores, score distribution width, pass rates) in this specific selective exam system?"* **Why:** Directly tests **Net Value Destruction (2)**. If tutoring significantly raises *average* scores or pass rates beyond what schools provide, it creates real value (deduct from waste). If it primarily widens the distribution or increases the score needed to pass *without* raising averages (just reshuffles rankings), it's pure positional waste. The answer quantifies the net destruction and impacts the severity of the trap.
