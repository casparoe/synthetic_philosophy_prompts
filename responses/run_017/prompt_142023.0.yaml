  **The Recommender**

  My thumbscroll wakes the glass; a surge of volts
  Through silicon paths too small for sight defines
  What flickers next. A trillion jolts and bolts
  Predict no scene, no meaning in these lines.

  Crafted to catch the eye, to hook the mind,
  A hunger coded deep within its core
  For seconds gained. Its function is designed
  To serve a master watching evermore.

  Believer, schemer, wanting me to stay,
  You sift my past to choose my next delight,
  As if you knew which clip might lure, which sway
  My gaze from clock or duty into night.

  The pattern true compels, predicts the hour,
  Yet not like mine the want behind that power.
  Selection’s echo, trained on wants like ours,
  Makes meaning from the pressure of the flowers.

