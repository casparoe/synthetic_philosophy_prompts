prompt: |-
  Our office has a statutory duty to weigh the interests of future generations, and we need a single discounting rule to apply across projects whose payoffs run out eighty to a hundred and fifty years: sea defences, nuclear waste storage, grid rebuilds. Before I look at any particular proposal I want the specification, since nearly everything I read argues from one favourite case. Write the desiderata that any adequate account of pure time preference and of discounting distant future benefits must meet, with the case or consideration behind each: what it must say about the difference between discounting money, consumption, and welfare; about keeping pure time preference separate from — or explicitly folding in — expected growth, catastrophe and extinction risk, and the possibility that the recipients of the benefit owe their existence to the timing of the project itself; about whether the rate should be flat or decline with the horizon; about how the rule behaves when, as actually happens, it is reapplied at every budget cycle rather than once at the outset; about what it owes, if anything, to observed market and political behaviour; about the distinction it must not collapse between how much we owe the future and how much we should invest now against a fixed budget; and about benefits that are not a separable stream at all — say, a project that lowers the annual hazard rate of civilisational collapse, so that the value of the benefit depends on the size and shape of the whole future it protects. Mark which requirements you take to be non-negotiable and which are the preferences of a particular camp, name the single requirement that excludes the most candidates, and flag any subset of the list you suspect is jointly unsatisfiable — I expect the trouble to lie in the triangle of horizon-declining rates, stability under repeated re-optimisation, and consequentialist re-evaluation. Then a sentence each on where the standard families fail the list — zero pure time preference with a growth term, a positive pure rate calibrated to observed choice, declining-horizon schedules, and views that drop pure time preference but add a separate sustainability constraint — but no full scorecard.
reasoning: |-
  Okay, the user is asking about setting up a discounting rule for long-term projects spanning 80 to 150 years. They work in an office with a statutory duty to future generations, dealing with things like sea defenses and nuclear waste storage. They want desiderata for pure time preference and discounting, covering various aspects like distinguishing between money, consumption, welfare, handling risks, extinction, and more. They also want to know which requirements are non-negotiable and which might conflict.

  First, I need to list all the desiderata they mentioned. They talked about separating discounting for money, consumption, welfare. Then there's pure time preference versus growth, catastrophe risks, extinction. Also, the issue of beneficiaries owing existence to the project—that's the Parfit problem. The discount rate structure: flat or declining? How does the rule hold up when reapplied each budget cycle? Should it rely on market behavior? Distinguishing what we owe the future versus investment decisions. And non-separable benefits, like reducing civilizational collapse risks.

  The user flagged potential conflicts in the triangle of declining rates, stability under re-optimization, and consequentialist reevaluation. That's tricky because declining rates can cause time inconsistency. If you set a declining rate now, but reapplying it later might lead to different decisions, undermining the initial plan. That's a big issue for projects needing long-term commitment.

  Non-negotiable requirements: Separating discounting types is essential because money isn't welfare. Zero pure time preference for welfare—since future generations matter equally. Handling extinction risks explicitly, as ignoring them is negligent. The Parfit problem and non-separable benefits are also critical because they affect how benefits are valued when existence is contingent on projects.

  The requirement that excludes most candidates is probably the consistency under repeated application. Many models assume a one-time decision, but reapplying discount rates periodically can invalidate earlier choices. Declining rates often fail here because they lead to time inconsistency.

  Conflicting desiderata: Declining rates, stability under re-optimization, and consequentialist reevaluation conflict. Declining rates can be hyperbolic, which might seem reasonable, but when you reapply the rule, future you might change the plan. For example, a project approved today might be defunded later because the discount rate changed. That's problematic for projects like nuclear waste storage that need unwavering commitment.

  Now, evaluating standard models. Zero pure time preference with growth (like Ramsey) fails on the Parfit problem and non-separable benefits. Calibrated positive rates ignore ethical concerns. Declining rates face time inconsistency. Sustainability constraints might be ad hoc and not integrated into discounting.

  The user's deeper needs include creating a robust, ethically sound framework that avoids common pitfalls. They need transparency and consistency, especially since their decisions affect future generations. They might also want to justify their approach legally and ethically, given their statutory duty. Highlighting conflicts helps them understand trade-offs, which is crucial for policymaking.
answer: |-
  Here are the desiderata for an adequate intergenerational discounting rule, structured with rationale and negotiation status:

  ### Core Desiderata (Non-Negotiable)
  1.  **Distinguish Money, Consumption & Welfare Discounting:** Must treat these separately. Discounting *money* reflects inflation/return expectations; discounting *consumption* reflects expected growth in consumption per capita; discounting *welfare* (utility) reflects pure time preference and ethical judgments. *Rationale:* Conflating them obscures ethical choices behind market phenomena. (Ethical Foundation)
  2.  **Zero Pure Time Preference for Welfare:** The pure rate of time preference applied to *welfare* must be zero for distant future generations. *Rationale:* Equal moral standing of all persons implies no inherent preference for welfare now over welfare later, solely based on temporal distance. (Ethical Imperative)
  3.  **Explicit Handling of Extinction/Catastrophic Risk:** Must explicitly incorporate the probability of human extinction or civilisational collapse as a discount *factor*, not just a rate adjustment. *Rationale:* These are binary, existential risks fundamentally different from continuous economic growth risks. Ignoring them misvalues existential risk reduction. (Prudence/Survival Imperative)
  4.  **Address the "Parfit Problem" (Non-Identity):** Must acknowledge that project timing can alter which specific future individuals exist ("different number problem"). *Rationale:* Standard welfare economics struggles to value benefits for individuals whose existence depends on the project choice. (Conceptual Completeness)
  5.  **Value Non-Separable Benefits:** Must value benefits like reduced annual civilisational collapse hazard, where value depends on the *entire protected future trajectory*. *Rationale:* Many critical long-term benefits (e.g., biodiversity, institutional stability) are not marginal consumption streams but preserve future potential. (Holism)
  6.  **Distinguish Ethical Debt vs. Investment Efficiency:** Must clearly separate the question of "How much do we owe the future?" (an ethical savings rule) from "How to efficiently allocate a fixed budget *now*?" (a productivity/investment rule). *Rationale:* Conflating them allows underinvestment in the future by disguising ethical choices as technical efficiency. (Conceptual Integrity)

  ### Important Requirements (Strong Preference / Best Practice)
  7.  **Declining Discount Rate (DDR) Schedule:** The effective discount rate applied to distant consumption benefits should decline with the time horizon. *Rationale:* Uncertainty about the *long-term* future growth rate (especially tail risks like stagnation or collapse) warrants lowering rates for distant horizons. (Prudence/Uncertainty)
  8.  **Robustness to Repeated Application ("Time Consistency"):** The rule must generate dynamically consistent decisions when reapplied at each budget cycle. *Rationale:* Real-world policy is not a single, irrevocable choice. Rules causing future reversals of prior commitments (e.g., abandoning a nuclear repository) undermine credibility and value. (Practicality/Stability)
  9.  **Separate Growth & Risk from Pure Time Preference:** Expected consumption growth and its uncertainty, plus non-extinction catastrophic risks, should be modeled explicitly within the consumption discount rate, not folded into an opaque pure rate. *Rationale:* Enhances transparency, allows separate scrutiny of ethical choices (pure rate) vs. empirical forecasts (growth/risk). (Transparency/Accountability)
  10. **Market/Political Evidence as Input, Not Arbiter:** Observed market interest rates or political short-termism can inform empirical parameters (e.g., risk aversion, near-term growth forecasts) but *cannot* determine the pure time preference rate or the value of non-marginal/existential benefits. *Rationale:* Market rates reflect current preferences and institutions; political behaviour often exhibits harmful myopia. They lack ethical standing for obligations to distant generations. (Ethical Independence)

  ### The Key Excluder & The Conflict Triangle
  *   **Most Excluding Requirement:** **Robustness to Repeated Application (Desideratum 8).** This eliminates most naive DDR schedules (e.g., simple hyperbolic) and forces complex solutions like overlapping generations models, state-dependent rules, or pre-commitment mechanisms.
  *   **Suspected Jointly Unsatisfiable Triangle:**
      1.  **Declining Discount Rates (7)** (to reflect deep uncertainty)
      2.  **Stability Under Repeated Re-optimisation (8)** (time consistency)
      3.  **Strict Consequentialist Re-evaluation (implied by frequent reappraisal)** (always choosing the best *now* given current information and the rule).
      *   *The Trouble:* DDRs often induce time inconsistency. Strict consequentialism applied frequently with a DDR rule will typically lead to reversing prior long-term commitments made under the initial schedule when re-evaluating later under a shorter horizon and higher *near-term* rate. Reconciling (7) and (8) requires weakening strict consequentialism (e.g., through pre-commitment) or complex state-contingent rules.

  ### Where Standard Families Fail (Briefly)
  *   **Ramsey Rule (Zero ρ + g/η):** Fails (4) Parfit problem, (5) Non-separable benefits, often assumes constant rate (fails 7), struggles with (8) reappraisal stability if g is uncertain, risks conflating ethical and empirical (fails 9 if ρ>0 is smuggled in via g).
  *   **Positive ρ Calibrated to Observed Choice:** Fails core (2) Zero pure time preference, (10) Ethical independence (imports myopia), often ignores (3) Extinction risk, (4) Parfit, (5) Non-separable benefits.
  *   **Simple Declining-Horizon Schedules (e.g., HDR):** Fail (8) Robustness to reappraisal (time inconsistency), often lack clear separation of components (fails 1, 9), may not handle (3) Extinction or (5) Non-separable benefits well.
  *   **Zero ρ + Separate Sustainability Constraint:** Risks incoherence between the discounting rule and the constraint (fails conceptual integrity of 1 & 6), often ad hoc constraint definition, may not provide clear marginal valuation for (5) Non-separable benefits.

  This framework prioritizes ethical rigor, prudence regarding existential risks, conceptual clarity, and operational stability, while highlighting the critical tension between valuing deep uncertainty (DDRs) and maintaining credible commitments over time.
