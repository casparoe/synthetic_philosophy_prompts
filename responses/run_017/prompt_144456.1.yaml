prompt: |-
  Last night I argued for hours with a friend about what the units of selection really are, and we ended up just restating our positions. I want to try a different route: here are the verdicts I actually hold, and I'd like to know what principle, if any, they add up to — and, honestly, which of them I should abandon.

  1. A mouse segregation-distorter allele that disables sperm carrying its rival and so is transmitted to nearly all of a heterozygote's offspring, even though homozygotes are non-viable. I am sure this is selection at the gene level; no story about organisms or groups seems to be doing any work.
  2. Sterile workers in a eusocial wasp colony, where haplodiploidy makes workers more related to their sisters than to their own offspring. I want to say kin selection, and I resist my friend's claim that this is really colony-level selection. The colony buds off daughter colonies and looks for all the world like a reproducing unit, but I still don't want to call it group selection.
  3. Transposable elements that copy themselves through a genome while lowering the host's fitness. Gene-level, straightforwardly — and note that here the copying happens inside a single individual's lineage.
  4. A case I invented to settle the argument: colonial beetles in which four foundresses, drawn at random from the whole population, start a nest each season. Carriers of a restraint allele lay half as many eggs, but their nests survive and bud off daughter nests at twice the rate. Relatedness within nests is essentially zero. Here I am confident it is group selection, and I don't think it can be rewritten as kin selection.
  5. The same beetle case, except that nests are founded by sisters, so within-nest relatedness is roughly a half. Same allele, same causal effect on nest survival. Now I find myself wanting to say kin selection and not group selection, even though nothing about the mechanism has changed except who ends up nesting together.
  6. Virulence in a virus whose vector needs the host alive: within a host, faster replication wins; between hosts, intermediate virulence wins. I am happy to say selection is going on at both levels here, and I don't think there is a single real one.
  7. The case I keep going back and forth on: a body-plan feature in a plankton lineage that lowers that lineage's extinction rate without making any individual fitter than its conspecifics. Is that selection at a level at all, or something else wearing selection's clothes?

  My friend's line throughout was that this is all one bookkeeping scheme — partition the change into within-group and between-group components, and the talk of levels is optional decoration, so there is no further fact about which level selection acts at. Case 5 makes me doubt myself; cases 1 and 4 make me doubt him.

  My own stab at a principle: an entity is a unit of selection only if it is a unit of multiplication with heredity, and the trait's fitness effect runs causally through that entity's own reproductive output rather than by summation over its parts. I already suspect that clause misfires on case 1.

  So: state a principle, or a short list of candidates, precisely enough that I could apply it myself; say which of my cases motivates each clause; tell me which of my verdicts it forces me to give up; and tell me what it says about case 7 and about some case I haven't listed that would discriminate between your principle and my friend's.
reasoning: |-
  Hmm, this is a fascinating and complex question about the units of selection. The user has had a long debate with a friend and presents seven detailed thought experiments where they have intuitive judgments about what level selection operates at. They also propose their own principle but suspect it might be flawed. I need to help them find a coherent framework.

  Looking at their cases, I see several key patterns:
  - Case 1 (mouse segregation distorter) clearly involves gene-level selection since the allele spreads despite harming the organism
  - Case 4 and 5 (beetles) show how relatedness changes their intuition: when unrelated it's group selection, when sisters it becomes kin selection despite identical mechanics
  - Case 6 (virus virulence) comfortably admits multilevel selection
  - Case 7 (plankton body plan) puzzles them about whether lineage-level selection exists

  The user's friend argues it's all just "bookkeeping" - partitioning variance components. But cases 1 and 4 challenge that view because in case 1 no group structure exists, and in case 4 the group fitness effect seems irreducible to individual fitnesses.

  The user's proposed principle focuses on "units of multiplication with heredity" but they correctly sense it fails case 1 where the gene has hereditary multiplication but the fitness effect appears to run through gametes.

  I should develop a principle that distinguishes between replicators (entities with heredity) and vehicles/interactors (entities whose properties affect survival/reproduction). This comes from Dawkins vs Hull distinction. 

  For case 1: The allele is the replicator, sperm are the vehicle, and organism fitness is irrelevant. This explains why it's gene-level selection.

  For the sterile workers (case 2): The genes for worker sterility are replicators that spread via kin selection (inclusive fitness), not group selection, because the colony isn't reproducing as a whole.

  For transposable elements (case 3): Similar to case 1 - gene-level replicator selection.

  For the beetle cases (4 and 5): 
  - When founders are unrelated (case 4), it's group selection because the group is the vehicle with group-level heredity (daughter nests)
  - When founders are sisters (case 5), kin selection explains it through relatedness, no need for group selection even though the mechanism is identical

  This difference in verdict might seem inconsistent, but it's justified because kin selection doesn't require group reproduction - it works through indirect fitness effects on individual genes. The user should probably abandon their different verdicts for case 4 vs 5 and see them both as kin selection.

  For the virus (case 6): Multilevel selection clearly applies - within-host (gene/replicator level) and between-host (group level if we consider hosts as groups, or organism level for the virus).

  For the plankton (case 7): This is tricky. The body plan affects lineage survival but not individual fitness. This might be a case where the lineage itself becomes a unit of selection if we consider species selection (lineage-level vehicle), but only if the trait emerges at that level and isn't reducible to individual traits.

  To discriminate between my principle and the friend's "bookkeeping" view: Consider a case where group structure exists but no group reproduction occurs (e.g., trait groups with temporary associations). My principle would say no group selection, just individual selection with frequency-dependent effects, whereas the bookkeeping view might still partition variance and call it group selection.

  The user should probably give up treating case 4 and 5 differently since the mechanism is identical - both can be explained by kin selection. The key is whether the fitness effect requires the group context or can be explained by relatedness.

  I'll formulate this as a clear principle with specific criteria for replicators and vehicles, apply it to all cases, note where the user should adjust their views, and address case 7 decisively.
answer: |-
  After analyzing your cases and verdicts, I propose the following principle that captures most of your intuitions while resolving inconsistencies. It combines key insights from Dawkins (replicators) and Hull (interactors/vehicles), with a focus on **causal mechanisms** and **hereditary units**:

  ### The Principle of Causal Hereditary Units (CHU)
  **Selection acts at the level of a *causal hereditary unit* (CHU) if:**
  1. **Heredity:** The entity has a hereditary lineage (faithful replication with variation).
  2. **Causal Efficacy:** The trait's fitness consequences *directly affect* the replication rate of that hereditary lineage.
  3. **Non-Summative Emergence:** The fitness effect cannot be fully reduced to the replication dynamics of lower-level units *without losing explanatory power* for the trait's spread.

  ---

  ### Applying CHU to Your Cases
  1. **Mouse segregation distorter (Gene-level):**  
     - *Heredity:* The allele replicates faithfully.  
     - *Causal Efficacy:* The distorter trait *directly* boosts the allele's transmission (via gamete sabotage).  
     - *Non-Summative:* Organism fitness is irrelevant; the allele spreads *despite* harming the organism.  
     **→ Verdict upheld. Your friend's "bookkeeping" fails here—no group structure exists.**

  2. **Sterile wasp workers (Gene-level via kin selection):**  
     - *Heredity:* Genes for worker behavior replicate through queen's offspring.  
     - *Causal Efficacy:* Worker sterility boosts replication of *shared genes* in sisters (higher relatedness).  
     - *Non-Summative:* Colony reproduction is a byproduct; kin selection explains it without invoking colony heredity.  
     **→ Verdict upheld. Colony-level selection is redundant.**

  3. **Transposable elements (Gene-level):**  
     - Identical logic to Case 1: selfish replication despite host fitness cost.  
     **→ Verdict upheld.**

  4. **Beetles with unrelated founders (Group-level):**  
     - *Heredity:* Nests produce "daughter nests" (group-level reproduction).  
     - *Causal Efficacy:* Restraint trait *directly* boosts nest survival/replication.  
     - *Non-Summative:* Individual fitness is *inverted* (restraint lowers individual fecundity). Cannot be explained by individual/kin selection (relatedness ≈ 0).  
     **→ Verdict upheld. Pure group selection.**

  5. **Beetles with sister founders (Gene-level via kin selection):**  
     - *Heredity:* Genes replicate through relatives.  
     - *Causal Efficacy:* Restraint boosts replication of *shared genes* in sisters (indirect fitness).  
     - *Non-Summative:* Group reproduction is *correlated* but not causal; kin selection fully explains trait spread. Identical mechanism to Case 4, but relatedness enables reduction to gene-level.  
     **→ You must abandon your verdict.** This is **kin selection**, not group selection. CHU prioritizes the *lowest level* with full causal explanation.

  6. **Virus virulence (Multilevel):**  
     - *Within-host:* Gene-level (fast replicators outcompete).  
     - *Between-hosts:* Group-level if hosts are "groups" of viruses (heredity via transmission to new hosts).  
     - *Causal Efficacy:* Virulence traits affect replication at both levels.  
     **→ Verdict upheld. CHU allows multiple levels.**

  7. **Plankton body plan (Not selection):**  
     - *Heredity:* The lineage has heredity.  
     - *Causal Efficacy:* **No direct effect on replication.** The trait lowers extinction rates but doesn't increase *differential replication* (all conspecifics are identical). It's a **drift-resistant spandrel**—not adaptation.  
     **→ Verdict: Not selection. Abandon calling this a "unit."**

  ---

  ### Verdicts to Abandon
  - **Case 5:** Must classify as kin selection (gene-level), not group selection.  
  - **Case 7:** Not selection at any level; it's a constraint or byproduct.

  ---

  ### Discriminating Test Case vs. Your Friend's View
  **Case X: Fluctuating group structure**  
  *A fish species where:  
  - Individuals form temporary shoals.  
  - A "bold explorer" allele increases predation risk but helps find new food patches.  
  - Shoals dissolve and reform randomly each season.  
  - Groups with explorers have higher *average individual fitness*, but explorers *within* groups have lower fitness.  
  - No group reproduction (all reproduction is individual).*

  - **CHU Principle:**  
    Individual-level selection only. No group heredity (groups don't replicate), and individual fitness differences explain allele frequency changes (boldness is disadvantageous). The group effect is a statistical side effect.  

  - **Your Friend's Bookkeeping:**  
    Partitioning would show a "between-group" component (groups with explorers have higher mean fitness). They might call this group selection.  

  - **Key Difference:**  
    CHU requires hereditary units and causal efficacy. Bookkeeping ignores causality and heredity, conflating statistical patterns with selective mechanisms. Here, group structure is ephemeral and non-hereditary, so group selection doesn't occur.  

  ---

  ### Why Your Stab Fails (and CHU Works)
  Your principle ("unit of multiplication with heredity, fitness effect through its own output") misfires on **Case 1**: The allele's fitness effect runs through gametes (sub-organismal), not the allele's "own reproduction." CHU fixes this by focusing on *causal chains* (e.g., the distorter trait directly boosts allele replication). It also resolves the beetle paradox (Cases 4–5) by showing kin selection operates at the gene level even when groups reproduce.  

  **Ultimate takeaway:** Selection requires *differential replication of hereditary information*. The "level" is where this replication is causally controlled. Your friend's bookkeeping is a useful statistical tool but doesn't capture causal reality—as shown in Case 1 (no groups) and Case X (no group heredity).
