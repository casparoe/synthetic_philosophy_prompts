answer: |-
  Here are the desiderata for a test of genuine cognitive penetration (CP) of perception, structured as requested. I'll explicitly mark negotiability and address your extra demand and conflicts.

  ### Core Desiderata: Cases to Classify Correctly
  1.  **Müller-Lyer Illusion (Must Reject CP):** Even knowing the lines are equal, they *look* different length. The test must show this is *not* cognitive penetration. *Why:* Demonstrates perception is stimulus-driven and resistant to belief/knowledge. **Non-negotiable.** (Reality contact, persistence constraints).
  2.  **Bistable Figures (e.g., Duck-Rabbit) (Must Reject CP):** The perceptual flip *follows* the conceptual cue ("it's a duck!"), but the cue itself doesn't change the *sensory experience* of the ambiguous stimulus; it triggers reinterpretation. The test must distinguish triggering reinterpretation from changing the sensory input. *Why:* Classic case where "seeing as" (interpretation/judgment) is confused with "seeing" (sensory phenomenology). **Non-negotiable.** (Distinction vs. judgment/response bias).
  3.  **Expert Perception (e.g., Radiologist, Birder) (Ambiguous - Test Must Decide):** Does the expert literally *see* the tumor/tiny warbler *differently* in terms of low-level features (shape, texture, contrast) due to knowledge, or do they just *notice* it faster/interpret it better? *Why:* Central to the "different worlds" claim. The test must provide a clear verdict, not assume CP. **Non-negotiable** that it *must* classify this correctly based on evidence.
  4.  **Action/State Context Effects (e.g., Slope looks steeper with heavy pack/while tired) (Ambiguous - Test Must Decide):** Does the altered physiological state + goal (climbing effort) genuinely change the *perceived slant*, or does it change the *judgment* of slant or the *salience* of steepness cues? *Why:* A key battleground claim for embodied/enactive CP. **Non-negotiable** that it *must* classify.
  5.  **Afterimages & Illusory Contours (e.g., Kanizsa Triangle) (Must Reject CP):** The percept is demonstrably generated by low-level sensory mechanisms (retinal fatigue, edge completion) without belief/knowledge playing a causal role. *Why:* Shows purely stimulus-driven "top-down" effects within perception itself, setting a baseline for what CP needs to surpass. **Non-negotiable.** (Distinction vs. ordinary context effects, learning within perception).

  ### Distinctions the Test Must NOT Collapse
  6.  **CP vs. Attention:** Must distinguish changing *what is perceived* (e.g., literally altering brightness/color/shape) from merely *selecting* which existing stimulus element is prioritized (e.g., spotlighting a tumor region). *Why:* Attention shifts are ubiquitous and uncontroversial; collapsing them with CP trivializes the claim. **Non-negotiable.**
  7.  **CP vs. Response Bias:** Must distinguish changes in *perceptual experience* from changes in *reporting behavior* based on expectations, demand characteristics, or social cues (e.g., saying lines look different because you know the experimenter expects it). *Why:* The core skepticism: is *seeing* changed, or just *saying/doing*? **Non-negotiable.**
  8.  **CP vs. Ordinary Context Effects:** Must distinguish belief/knowledge altering perception from well-understood perceptual phenomena influenced by *sensory* context (e.g., color constancy under different lighting, size constancy at different distances). *Why:* Many "top-down" effects are standard sensory integration, not cognitive penetration. **Non-negotiable.** (Constraint: perception provides contact with reality).
  9.  **CP vs. Learning to Notice (Perceptual Learning):** Must distinguish changes in *sensory phenomenology* (CP) from learning *which sensory features are diagnostic* (e.g., a birder learns which tiny streak of color in peripheral vision signifies a specific species, but the *streak itself* looks the same). *Why:* Much expertise involves learning associations and feature relevance, not altering basic perception. **Non-negotiable.**

  ### Constraints the Test Can't Violate
  10. **Speed & Automaticity:** The test must respect that perception is typically fast, automatic, and not under voluntary control (you don't "decide" to see). Genuine CP effects should not require slow deliberation. *Why:* Core characteristic of perceptual processes. **Non-negotiable.** (One camp *wants* this to constrain CP to fast, automatic effects).
  11. **Reality Contact:** The test must acknowledge perception's primary function is to represent the actual state of the distal world, even if imperfectly. CP cannot imply perception is *only* belief confirmation. *Why:* Epistemological foundation. **Non-negotiable.** (One camp *wants* this to severely limit the *scope* of possible CP).
  12. **Persistence Despite Knowledge:** The test must account for cases where perception persists robustly despite knowing it's illusory (e.g., Müller-Lyer). Genuine CP cannot *require* that knowledge always overrides perception. *Why:* Demonstrates perception's relative encapsulation from cognition. **Non-negotiable.** (One camp *wants* this to be the *default* state).

  ### Your Extra Demand: No First-Person Report
  13. **Report-Independence:** The test should ideally provide evidence for/against CP without relying solely on subjective verbal reports (e.g., "it looks steeper"). *Why:* To handle blindsight (no visual qualia), animals (no verbal report), infants, or AIs (no subjective experience), and to circumvent response bias issues. *Analysis:* This is **a valid and strong desideratum, not mere prejudice.** It directly addresses core weaknesses (response bias, limits of introspection) and expands scope. However, its *degree* is negotiable:
      *   **Must Handle:** Cases where report *exists but is suspect* (e.g., response bias in humans, interpreting animal behavior). The test *needs* non-report measures here.
      *   **Should Ideally Handle:** Cases with *no comparable subjective experience* (blindsight, current AIs). A complete theory *should* account for information processing here, but a test focused on human phenomenology *may* ignore these.
      *   **Can Ignore (for a human-focused test):** Cases where the very *existence* of perceptual phenomenology is fundamentally different or absent (deep philosophical issues of consciousness in blindsight/AIs). But a robust *scientific* test should minimize reliance on subjective report wherever possible.

  ### Conflicts Between Desiderata
  *   **"Reality Contact" (11) vs. Robust CP (e.g., in 4 or 3):** If perception is fundamentally tied to accurately representing the world, how can beliefs *systematically* alter it without destroying its function? Strong CP seems to threaten this constraint. Resolving this tension is central to the debate. A test might need to show CP effects are limited or adaptive.
  *   **"Persistence Despite Knowledge" (12) vs. CP in Experts (3):** If expert knowledge genuinely penetrates perception (e.g., radiologist seeing tumors more vividly), why doesn't this percept vanish when they know it's a training image? A test must show how CP can be persistent *and* knowledge-driven.
  *   **"Report-Independence" (13) vs. Phenomenology:** For human CP, the core claim is about *experience*. Fully report-independent measures (e.g., neural correlates, behavior) might identify information processing changes, but whether that constitutes a change in *phenomenology* (what it's *like* to see) remains inferential. A perfect test bridging this gap is elusive.

  ### Committed Answers
  1.  **Most Knockout Power:** **"Persistence Despite Knowledge" (12).** If a candidate CP effect *disappears* the moment the subject knows the truth (like a bistable figure flip), it strongly suggests judgment/response bias, not altered perception. The Müller-Lyer illusion is the bedrock counterexample here.
  2.  **Your Prejudice?** Your "extra demand" **(Report-Independence - 13)** is **NOT a prejudice; it's a crucial methodological strength.** Over-reliance on subjective report is the Achilles' heel of many CP claims. Demanding objective measures is sound science.
  3.  **Area of Least Certainty:** Distinguishing **genuine CP in Experts (3) vs. Perceptual Learning/Learning to Notice (Distinction 9)**. Do experts literally *see* low-level features differently (e.g., enhanced contrast/acuity for tumors), or do they just *know* which specific, already-visible patterns to attend to and interpret? Current evidence (like neural tuning changes) is suggestive but not conclusive for phenomenology. This is the murkiest frontier.

  This framework provides the necessary specification for evaluating claims and designing tests of genuine cognitive penetration, focusing on the critical distinctions and constraints rather than isolated examples.
