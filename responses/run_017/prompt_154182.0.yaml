  Distinctions to maintain: cognitive penetration vs. attention (spotlight effect), response bias (saying what's expected), context effects (lighting affecting color), and learning that changes noticing but not perception. Constraints: perception is fast, provides reality contact, and persists despite knowledge of illusion.

