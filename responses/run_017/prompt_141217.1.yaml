prompt: |-
  I am part of a small reading group — mostly graduate students in philosophy and a couple of people from an effective-altruism adjacent policy shop — that has been working slowly through the literature on tiny probabilities of astronomically large stakes. Last week we reached the case where a stranger approaches you and offers to create or spare some colossal quantity of worthwhile simulated lives — say 10 to the power of 30, or a number you would have to write as a tower of exponents — in exchange for five dollars, on pain of being ignored entirely if you decline. One member, who had been growing impatient with the whole literature, said something like: "Look, extraordinary claims require extraordinary evidence. The mugger's story is about as extraordinary as a claim gets, so we are entitled to set it aside," and then treated the topic as closed. I want to reopen it, because I don't think the slogan is doing a single determinate piece of work there. Among the things it might mean: a purely Bayesian truism (improbable hypotheses need proportionally larger likelihood ratios to reach the same posterior, which is just the odds form of Bayes' theorem); a norm about testimony or burden of proof rather than about credence; a requirement that evidence strength scale with the *stakes* or *leverage* of the claim rather than with its prior improbability; a complexity or specificity constraint on priors (a claim that specifies an enormous number is one of astronomically many competing claims, so it inherits a description-length penalty); a norm against *acting* on low-probability, high-magnitude considerations; or, as a related nineteenth-century formulation attributed to Laplace puts it, the thesis that "the weight of evidence for an extraordinary claim must be proportioned to its strangeness." These differ enormously, and one thing I want explained rather than assumed is that paying five dollars does not require *believing* the mugger — an expected-value argument can go through at a credence of one in a trillion trillion — so I'd like to know which readings, if any, actually deliver the dismissal my group member wanted, as opposed to merely capping credence at a level that is still decision-relevant.

  To force the issue, I've been playing with two variants that I think separate the readings. In the first — call it the *humdrum mugging* — nothing remotely miraculous happens: a disgruntled data-centre technician tells you he is about to pull the power on a rack, and that the rack is running a simulation containing 10 to the power of 30 morally significant beings; the only extraordinary element is the number, since pulling a plug and running a simulation violate no known regularity whatsoever. In the second — the *scaling mugging* — the mugger supplies evidence that is extraordinary by any everyday standard: he lets you inspect, interrogate and repeatedly verify a working simulation of a million clearly sentient beings, then explains that this is a demo of a far larger system whose continued existence depends on your five dollars. Intuitively that demonstration carries an enormous Bayes factor in favour of his having *some* such capacity, yet it is nowhere near enough to make the 10-to-the-30 claim more likely than not. So the question is whether "extraordinary" is indexed to weirdness, to prior improbability, to the specificity of the claim, or to the size of the stakes it invokes, and how the required quantity of evidence is supposed to be measured — as a likelihood ratio, as a total body of testimony, as a threshold of posterior probability, or as something that has to grow with the magnitude of the claimed effect. As a final check on generality, note that another member used the very same slogan a week later to dismiss a long-term risk estimate that involved no single extraordinary event at all, only the aggregation of many ordinary mechanisms.

  What I'd like is a disambiguation I can bring back to the group: a numbered menu of the distinct precise theses the slogan could be expressing, each stated tightly enough that we could see whether it is true, false, or merely a restatement of something we already accept, and each labelled as trivial, substantive-but-defensible, contentious, or confused. For every reading, please say what "extraordinary" and "evidence" would have to denote for it to hold, whether it is a claim about belief, about assertion and burden of proof, or about action, and — this is the part I care most about — whether it actually licenses setting the original mugging aside, how it handles the humdrum and scaling variants, and whether it would equally license dismissing the mundane long-term risk estimate. If some readings collapse into each other, or if the only reading that does the real work is not really about evidence at all but about a constraint on how fast priors may decay with the size of a claimed effect, say so explicitly, and tell me which reading my group member was most plausibly reaching for and whether that reading survives scrutiny.
reasoning: |-
  Okay, the user is part of a reading group discussing the "Pascal's Mugging" problem in philosophy. They've encountered a member who dismisses the scenario using the slogan "extraordinary claims require extraordinary evidence," treating it as a definitive argument against engaging with the mugger. The user wants to reopen the discussion by disambiguating this slogan into precise interpretations and testing each against variants of the mugging scenario.

  The user has created two thought experiments to challenge different interpretations: 

  1. The "humdrum mugging" where the claim involves massive stakes but no violation of physical laws (just a data center technician threatening to unplug a simulation)
  2. The "scaling mugging" where the mugger provides strong but incomplete evidence (demonstrating a million-simulation but claiming vastly more)

  They also mention a real-world parallel where the slogan was used to dismiss long-term risk estimates based on aggregated ordinary events. 

  The core tension I notice is between:
  - Bayesian rationality (where even tiny probabilities of huge payoffs could demand action)
  - Practical epistemology (how we actually handle outlandish claims)
  - Decision theory (when low-probability high-stakes should influence behavior)

  The user seems frustrated by the slogan being used as a conversation-stopper rather than a starting point for analysis. They want ammunition to show their group that the dismissal isn't philosophically neutral - it smuggles in substantive assumptions about evidence, priors, or decision theory.

  Key unspoken needs I detect:
  1. They want to restore rigor to the discussion by forcing precise definitions
  2. They suspect the slogan is often misapplied as a way to avoid uncomfortable implications of expected utility theory
  3. They need frameworks to distinguish between "this claim is improbable" and "we should ignore this claim regardless of stakes"

  The variants are clever because:
  - Humdrum removes the "weirdness" factor, testing if only the number's size makes it "extraordinary"
  - Scaling shows evidence can be strong yet still insufficient for massive claims, revealing that "extraordinary evidence" might mean something beyond just strong evidence
  - The long-term risk example shows the slogan might wrongly dismiss non-miraculous but high-stakes scenarios

  I should map exactly how different interpretations of the slogan handle all three cases. The most important insight might be that no purely Bayesian reading justifies dismissal - only decision-theoretic views (like bounded rationality or skepticism about unbounded utility functions) can truly block the mugging, but those require separate arguments.
answer: |-
  Here's a disambiguation of "extraordinary claims require extraordinary evidence" (ECREE) tailored to your mugging cases, structured as requested. Each thesis is defined precisely, evaluated for truth/defensibility, and tested against the original mugging, your variants, and the long-term risk estimate.

  ---

  ### **1. Bayesian Truism (Odds Form)**
  - **Thesis**: For a claim with prior odds *P(H)/P(¬H)*, posterior odds = prior odds × likelihood ratio *P(E|H)/P(E|¬H)*. To make *H* probable, *P(E|H)/P(E|¬H)* must be large if *P(H)/P(¬H)* is very small.  
  - **"Extraordinary"**: Low prior probability (e.g., due to specificity/complexity).  
  - **"Evidence"**: Likelihood ratio (LR).  
  - **Domain**: Belief (credence).  
  - **Evaluation**: **Trivially true** (restatement of Bayes' theorem).  
  - **Original mugging**: Does **not** dismiss it. Sets prior *P(H)* extremely low (e.g., 10⁻³⁰) but allows that sufficiently strong evidence (LR > 10³⁰) could justify belief.  
  - **Humdrum mugging**: Prior *P(H)* might be higher (no miracles), but still low due to specificity of "10³⁰ beings". Still doesn't dismiss: needs LR proportional to prior odds.  
  - **Scaling mugging**: The demo is strong evidence for *some* simulation (LR high for "small simulation"), but weak for *10³⁰ beings* (LR for *H* ≈1 if demo is equally likely under competing hypotheses). Fails to meet LR requirement for *H*.  
  - **Long-term risk**: Irrelevant (no claim about evidence).  
  - **Verdict**: **Does not license dismissal**. Only caps credence without blocking action.

  ---

  ### **2. Testimonial Norm (Burden of Proof)**
  - **Thesis**: Testimony for an unusual claim requires stronger corroboration (e.g., multiple experts, physical proof) than mundane claims before being admitted as evidence.  
  - **"Extraordinary"**: Contradicts background knowledge or consensus.  
  - **"Evidence"**: Testimonial robustness (sources, consistency, replicability).  
  - **Domain**: Assertion/burden of proof.  
  - **Evaluation**: **Substantive-but-defensible** (pragmatic epistemology).  
  - **Original mugging**: **Licenses dismissal**. Mugger's testimony is uncorroborated "street epistemology."  
  - **Humdrum mugging**: Still dismisses—claim remains uncorroborated despite no miracles.  
  - **Scaling mugging**: Demo is strong corroboration for *some* capacity, but claim about *10³⁰* remains uncorroborated. Dismisses *H* but not sub-claims.  
  - **Long-term risk**: Might dismiss if based on weak testimony (e.g., lone theorist), but not if based on models/consensus.  
  - **Verdict**: **Licenses dismissal in mugging cases**, but not based on stakes—based on epistemic norms for testimony.

  ---

  ### **3. Stakes-Sensitive Evidence Threshold**
  - **Thesis**: The *strength* of evidence required to *act* on a claim scales with the stakes (cost of false positive vs. false negative).  
  - **"Extraordinary"**: High stakes (leverage).  
  - **"Evidence"**: Posterior probability or expected utility threshold for action.  
  - **Domain**: Action.  
  - **Evaluation**: **Contentious** (rejects evidential decision theory; akin to "precautionary principle" for evidence).  
  - **Original mugging**: **Licenses dismissal** if $5 loss has non-negligible disutility *or* if we impose a stakes-weighted evidence threshold (e.g., "posterior > 0.95 to act").  
  - **Humdrum mugging**: Same—dismisses due to stakes, not prior.  
  - **Scaling mugging**: Demo might meet threshold for low-stakes action but not for high-stakes belief in *10³⁰*.  
  - **Long-term risk**: **Licenses dismissal** if preventive action is costly and evidence is deemed insufficient given stakes.  
  - **Verdict**: **Licenses dismissal** but controversially—violates standard expected utility (where tiny credence × vast stakes can dominate).

  ---

  ### **4. Prior Decay Constraint (Complexity Penalty)**
  - **Thesis**: Priors decay exponentially with the *specificity* or *descriptive complexity* of a claim (e.g., "10³⁰ beings" is one of many possible large numbers, penalized by Kolmogorov complexity).  
  - **"Extraordinary"**: High complexity/specificity (e.g., precise astronomic numbers).  
  - **"Evidence"**: LR needed to overcome prior decay.  
  - **Domain**: Belief (priors).  
  - **Evaluation**: **Substantive-but-defensible** (Solomonoff induction; avoids Dutch books for unbounded stakes).  
  - **Original mugging**: **Licenses dismissal**—prior *P(H)* decays faster than stakes grow (e.g., *P(H) ~ 10⁻K* where *K* is complexity of "10³⁰ beings"). No feasible LR can compensate.  
  - **Humdrum mugging**: Same—complexity penalty applies regardless of miracles.  
  - **Scaling mugging**: Demo supports a *less specific* claim ("large simulation"), but not *H*'s exact magnitude. Dismisses *H*.  
  - **Long-term risk**: Dismisses if estimate requires overprecise modeling (e.g., "exactly 10²⁰ future lives at risk").  
  - **Verdict**: **Licenses dismissal** by making *P(H)* intractably small.

  ---

  ### **5. Extraordinary = "Strange" (Laplace's Strangeness)**
  - **Thesis**: Claims violating well-established regularities ("strange") require evidence proportioned to the degree of violation.  
  - **"Extraordinary"**: Conflict with robust laws (e.g., physics).  
  - **"Evidence"**: LR sufficient to overcome prior based on law-violation.  
  - **Domain**: Belief.  
  - **Evaluation**: **Redundant** with Bayesianism (violations have low priors).  
  - **Original mugging**: **Licenses dismissal** if "simulating 10³⁰ beings" violates physical laws (e.g., energy requirements).  
  - **Humdrum mugging**: **Does not dismiss**—no law violation. Prior low only due to specificity.  
  - **Scaling mugging**: Demo makes law-violation less "strange," but still insufficient for *H*.  
  - **Long-term risk**: Never dismisses—no strangeness.  
  - **Verdict**: **Fragile**—collapses into Thesis 1 or 4; fails humdrum test.

  ---

  ### **Which Thesis Was Your Group Member Using?**
  - **Most plausible**: **Thesis 2 (Testimonial Norm)** or **Thesis 4 (Prior Decay)**.  
    - Thesis 2 fits "set it aside" as a norm for testimony.  
    - Thesis 4 fits treating the claim as non-salient due to its specificity.  
  - **Does it survive scrutiny?**  
    - **Thesis 2**: Defensible pragmatically, but doesn't block expected-value arguments (action ≠ belief).  
    - **Thesis 4**: Strongest defense against mugging, but contentious (rejects unbounded utility).  
  - **Neither** justifies dismissing *action* on low-credence, high-stakes claims without further argument (e.g., decision-theoretic bounds).

  ---

  ### **Key Conclusions for Your Group**
  1. **ECREE is not one thesis**—it ambiguously mixes belief, testimony, action, and prior constraints.  
  2. **No reading** both (a) licenses dismissing the mugging *and* (b) is uncontroversially true:  
     - Bayesianism (1,5) doesn't dismiss.  
     - Testimonial norms (2) dismiss testimony but not action.  
     - Stakes-sensitive (3) and prior decay (4) dismiss but rely on contentious premises.  
  3. **Your variants clarify**:  
     - **Humdrum mugging** refutes "strangeness" (5) and shows stakes/complexity drive the issue.  
     - **Scaling mugging** shows evidence can be strong yet insufficient for extreme specificity.  
  4. **To dismiss the mugging**, you must either:  
     - Reject expected utility theory (e.g., bounded rationality),  
     - Impose structural priors that decay faster than stakes grow (Thesis 4), or  
     - Adopt a testimony-specific norm (Thesis 2), accepting it doesn't block action.  

  Recommend focusing on **Thesis 4 (Prior Decay)** as the deepest defense—but stress that it *is* substantive and conflicts with naive utilitarianism. For the long-term risk case, only Theses 3 (stakes) or 4 (complexity) could dismiss it, both controversially.
