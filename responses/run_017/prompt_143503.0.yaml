prompt: |-
  Hi — novelist here, so sorry for the setup-in-costume, but I've got a scene I can't write and it turns out to be a philosophy-of-law problem in a wig.

  My book: protagonist is a third-year law student clerking for a federal judge who is a cheerful, genuinely formidable originalist — original public meaning, "history and tradition" as the test for unenumerated rights, the whole apparatus, and he's good enough at it that she keeps half-converting. She starts reading Douglass's speeches for reasons that don't matter and ends up arguing with him in her head for the last third of the novel, at the same time as she's arguing with her judge. I need Douglass to be a real interlocutor, not a quotation dispenser who shows up to be right.

  So, what I actually can't work out: what would Douglass make of originalism as it's practiced now, in 2025, not as a slogan?

  The bit that got me stuck is this. Douglass broke with Garrison and his disunionist friends by arguing that the Constitution was, properly read, an anti-slavery instrument — no word for slavery in the text, the language about persons held to service pointed the other way once you stopped assuming the conclusion, an abolitionist lawyer's tract helped convince him, that sort of thing. That sounds an awful lot like an originalist move: beat your opponent on the founders' own ground. But then the Reconstruction amendments happen and he more or less says the document has been remade, and that it's finally a liberty document. Which means the thing he spent fifteen years arguing was already true only became true by being rewritten. So which Douglass walks into my scene — the one who found the founders usable, or the one who concluded they had to be overridden? And is that even a tension, or did he never think the 1787 text was the real object of loyalty in the first place?

  Which leads to the question I'm almost afraid to put in a character's mouth: was his reading of the Constitution load-bearing in his thinking, or was it a rhetorical wrapper around a moral conclusion he'd reached on entirely independent grounds? I need to know because I need to know whether he'd be insulted by the question or whether he'd have an answer for it.

  Two more things, both specific.

  First: my judge's method, in a lot of cases, is to ask what was protected by history and tradition and stop there. Douglass lived at a time when the tradition pretty unambiguously included chattel slavery, so my instinct is that he'd find that method self-refuting on its face. But he also won his argument with Garrison partly by appealing to the founders' own words, which means he thought the founders could be turned against the practice they protected. Is there a version of the history-and-tradition test he could endorse, or is the method the problem rather than the outcomes?

  Second, and this is the part I invented, so tell me if it's rigged: there's a fictional case in the book where a state uses a risk-scoring algorithm to decide who gets parole, the scores come out systematically worse for one group, and the state's defense is basically that nobody intended that, so there's no equal-protection problem. Would Douglass care about the intent, or about the fact that a set of arrangements keeps reproducing a caste-like outcome regardless of anybody's intention? I want the reasoning, not the label — and if the honest answer is that his own rhetorical habits were pointed at intentions, motives, and the moral character of the law rather than at statistical patterns, say so, because that's a more interesting scene than him being right on modern terms.

  One last thing, which is my own dumb theory and I want you to knock it around: it seems to me there's a difference between being bound by the *meaning* of an old text and being bound by the *deal* that text was — and the 1787 Constitution was, among other things, a bargain with slaveholders. Maybe Douglass's real objection to originalism wouldn't be that it's backward-looking but that it's contractarian: it grounds legitimacy in the consent of people who consented to his enslavement. Is that anything, or am I putting 21st-century philosophy in his mouth?

  Give me the strongest version of the Douglass side, the place where he'd get stuck or have to concede something, and the thing my judge would say back that would actually sting. And no footnotes or citations, please — I can't check them, my readers won't, and I'd rather have a scene that's true than one that's sourced.
reasoning: |-
  Okay, let me tackle this novelist's problem step by step. They're writing a scene where Frederick Douglass debates a modern originalist judge, and need to capture Douglass's authentic philosophical stance. 

  First, the core tension: Douglass argued the 1787 Constitution was anti-slavery through textual interpretation (originalist move), yet celebrated the Reconstruction amendments as fundamentally transforming it. This isn't contradiction - it's dialectical thinking. The pre-war stance was strategic originalism: using founders' language against their compromise. Post-war, he embraced the living document view because the people had spoken anew through amendments. 

  For the judge's history-and-tradition test, Douglass would reject it as self-serving. His 1852 "What to the Slave..." speech shows this - mocking "original intent" when it defends oppression. But crucially, he'd attack the method's blindness to power: tradition often codifies injustice. His alternative? Interpret principles at their most aspirational level ("justice, liberty, humanity"), which ironically aligns with some modern originalists' focus on original public meaning over practice.

  On the parole algorithm case: Douglass cared about outcomes over intent. His speeches constantly highlight systemic effects (e.g., Fugitive Slave Act's operation regardless of individual motives). But he'd frame it morally - statistics alone wouldn't sway him; he'd show how the algorithm perpetuates caste, making constitutional principles hollow.

  The contractarian point hits hard. Douglass saw the 1787 deal as contaminated by slaveholders' consent. His 1860 speech rejecting "compromises of the fathers" is key here. Modern originalism's appeal to founders' authority would feel like reviving that poisoned legitimacy.

  Where he might concede: textualism matters when words constrain power. And he'd respect the judge's rigor even while rejecting his premises. The judge's best counter? "You invoked founders too - was that just convenience?" Douglass would fire back: "I invoked their words to condemn their deeds. You invoke their deeds to sanctify yours."

  The novelist's instinct is right - Douglass's constitutional arguments were morally driven, but not mere packaging. He truly believed in constitutional redemption, first through interpretation, then amendment. That's why he'd scorn the history-and-tradition test: it mistakes what was for what must be.
answer: |-
  Here’s how Douglass would engage with your judge, distilled into dramatic essentials — the clash of principles, not a history lecture. Forget the wig; this is steel on steel:

  ### The Core Tension (Resolved)
  Douglass **never saw a contradiction** between his pre-war textualism and post-war transformation. His 1852 *"What to the Slave is the Fourth of July?"* speech is key:  
  - **Pre-1865:** He wielded the Constitution’s *text* against the *practice* of slavery. The words "persons," "due process," and "privileges and immunities" were weapons. He didn’t revere the founders; he **hijacked their language** to shame a nation. (His 1860 speech: *"The Constitution is a GLORIOUS LIBERTY DOCUMENT. Read its preamble... I defy the presentation of a single pro-slavery clause in it."*)  
  - **Post-1865:** The Reconstruction Amendments didn’t *replace* the Constitution — they **fulfilled its betrayed promises**. The 1787 text was a blueprint for liberty perverted by compromise; the amendments were the people’s verdict, erasing the slaveholders’ veto.  

  **So which Douglass walks in?** Both. The strategist who used originalism as a Trojan horse, and the revolutionary who demanded the text live up to its ideals. His loyalty was to **justice**, not parchment.  

  ### Answering Your Judge’s Method  
  Douglass would eviscerate "history and tradition" as a test. Why?  
  - **"Tradition" included his bondage.** In 1852: *"The existence of slavery in this country brands your republicanism as a sham... your shouts of liberty and equality as hollow mockery."* Appealing to tradition would be obscene — like citing the Inquisition to defend religious oppression.  
  - **But he’d twist the knife deeper:** Originalism *could* be salvaged if it asked: *"What did the words promise at their most aspirational?"* Not "what did bigots do?" but *"what should ‘equal protection’ mean if we took it seriously in 1868?"* Your judge fixates on the *muddy footprints* left by history; Douglass would demand you follow the **North Star** in the text itself.  

  ### The Algorithm Case: Intent vs. Outcome  
  Douglass **would not care about intent.** His life was a testament to systemic cruelty flourishing under "good intentions":  
  - Slaveholders claiming paternal "care" for the enslaved.  
  - Colonizationists wanting "free" Black people exiled "for their own good."  
  - Northerners opposing slavery but tolerating segregation.  
  His 1888 speech: *"Where justice is denied, where poverty is enforced... neither persons nor property will be safe."* The algorithm’s caste-reinforcing outcome **is the injustice** — regardless of intent. He’d ask your judge: *"If a law branded my forehead with ‘inferior,’ would you excuse it because the branding iron had no malice?"*  

  ### Your Contractarian Theory (It’s Sharp)  
  **This is Douglass’s nuclear weapon against originalism:**  
  The 1787 Constitution *was* a pact with slaveholders — a **covenant with death** (as Garrison called it). Douglass’s 1860 rejection of the founders’ compromises: *"I base my sense of the certain overthrow of slavery upon the nature of the American Government, the principles of the Constitution... NOTHING IS SETTLED THAT IS NOT RIGHT."*  
  - **His fatal blow:** Originalism grounds legitimacy in the consent of those who bargained for his subjugation. How can law derive moral authority from **the consent of enslavers?** The judge’s method enshrines their deal as sacred. Douglass would quote himself: *"The man who is right is a majority."*  

  ### The Strongest Douglass & the Judge’s Sting  
  **DOUGLASS’S OPENING:**  
  *"Your ‘history and tradition’ test, Judge, is a séance summoning ghosts who justified whips and chains. You ask what the words meant in 1789? Ask what they *should have meant* to a nation claiming liberty. Your method baptizes oppression as ‘original’ — but I fought my way into the Constitution’s promise while your predecessors called me three-fifths of a man. The parole algorithm? It doesn’t *intend* cruelty? Neither did the auction block! It’s the *outcome* that stains your robes with hypocrisy."*  

  **JUDGE’S STINGING COUNTER (Playing Douglass’s Own Words):**  
  *"You wielded originalism yourself, Mr. Douglass — brilliantly. You parsed ‘persons,’ ‘due process,’ the migration clause... You insisted the text *as written* condemned slavery. Was that rhetoric? Or do you dismiss textualism now because it no longer serves your ends? If meaning isn’t fixed, why did you spend years arguing it *was* — and fixed against slavery?"*  

  **DOUGLASS’S RECOVERY (The Kill):**  
  *"I used their words to expose their crimes! You use their crimes to sanctify your cowardice. I quoted the preamble — ‘justice,’ ‘liberty’ — to shame a nation. You cite slave codes to shackle one. The Constitution isn’t a contract with tyrants; it’s a **covenant with the future**. You worship the coffin; I fight for the seed inside it."*  

  ### The Scene’s Truth
  Douglass was a **moral visionary** who used text as a weapon, not an idol. He’d scorn originalism’s fetish for historical sludge but respect textual rigor — if aimed at liberation. Your judge’s "tradition" test would revolt him; the algorithm’s intent-defense would insult his lived truth. The contractarian point? That’s his cannon. Let your protagonist feel the blast: law anchored in the morality of slavers is **rot at the foundation**.  

  Write it raw. Douglass wasn’t polite; he burned ceilings down.
