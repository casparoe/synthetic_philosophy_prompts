prompt: |-
  I'm in the third year of a PhD on moral worth — the chapter I'm currently writing turns on whether worth is best understood as a fact about how an action is explained or as a fact about what the agent takes herself to be doing — and I could use some help predicting how my own supervisor will rule on two cases, because about nine hundred words of my chapter are hostage to the answer. She has given me verdicts on seven cases over the past two years, always crisply and always consistently, and I've written them up below more or less as she gave them to me. Ana runs a lost-property desk and returns a wallet full of cash because the five-star reviews are worth more to her than the money, and she would have kept it had no one been able to trace it: no worth. Ben visits an old friend in hospital purely out of affection, never entertaining a thought of duty, and would have visited even if visiting had been pointless: worth, and not diminished by the absence of duty. Cleo helps a colleague she has been brought up to despise, is wretched about it and believes as she does it that she is betraying her own community's code, but whose attention and effort are entirely governed by the colleague's predicament: worth, and she said more of it than Ben's if anything. Eve keeps a burdensome promise because it was a promise, while also knowing her reputation hangs on it and admitting she'd have kept it for the reputation alone: worth, but thinner than Cleo's. Femi intends to return a wallet and has it knocked out of his hands by a thief so that it rolls into the owner's hallway: right act, no worth. Gita is hypnotised without her knowledge into caring about returning lost property; she returns a wallet genuinely guided by the thought that it isn't hers and that someone is missing it, but she finds the urge foreign and would rather it stopped: no worth, or as near nothing as makes no difference. Ismail returns a wallet because he believes, wrongly though not unreasonably, that his religion requires the return of lost property come what may; he is unmoved by and indeed unaware of the fact that the owner needs the medication inside it: no worth, though the act is right and he is not to be blamed. So: guidance by the right-making feature seems to matter to her more than the agent's own description of what she is doing, the guidance has to be non-deviant, and degrees are real.

  The two new cases are a matched pair, and I've built them so that everything except one variable is held fixed. Priya is, by her own admission, almost unmoved by other people's minor troubles, and she finds a wallet containing medication a year into a placement in a care home. In version A she enrolled in that placement herself, partly because she was ashamed of how little she felt for people and partly because the certificate would look good on her CV; in version B the placement was a compulsory component of her degree that she thought a waste of time and completed only to avoid a mark on her record. In both versions the year has left her durably and reliably responsive to what other people need, in both she returns the wallet promptly and at some inconvenience, troubled by the thought of the owner without her medicine, in both she has come to value the change in herself and would not undo it, and in both she would now cite the owner's need as her reason if asked. In both, finally, she'd have got round to posting the wallet back eventually out of a vague sense that she ought to, so there is a baseline of dutifulness in place independent of the placement. What I want from you is: how she will rank A and B against each other and against Ben, Cleo and Eve on her own scale; the two or three candidate rules that fit all seven earlier verdicts and that come apart on the pair; which of them she is most likely running and why, given that she also thinks the phrase acting for the right reasons is doing more work than people notice; where, on each rule, the worth is located — in the year-long choice or in the act of returning the wallet; and the further case I should put to her that would actually settle it. The reading group split three ways on this, two of us convinced the difference between A and B matters and one convinced it obviously doesn't, and none of us could say what would adjudicate. Please don't give me references or tell me who to read — I've done the literature; it's the shape of the rule I'm after, and the argument for preferring one shape to the others.
reasoning: |-
  Hmm, the user is a third-year PhD student in philosophy, specifically working on moral worth. They're writing a chapter about whether moral worth is about how an action is explained or about what the agent takes themselves to be doing. They need help predicting how their supervisor would rule on two new cases (Priya A and Priya B) based on seven previous cases.

  Looking at the supervisor's previous verdicts:
  - Ana (returned wallet for reviews): No worth
  - Ben (visited friend purely from affection): Worth
  - Cleo (helped despite inner conflict): More worth than Ben
  - Eve (kept promise partly for reputation): Some worth but less than Cleo
  - Femi (accidentally returned wallet): No worth
  - Gita (hypnotized to return): No worth
  - Ismail (returned for religious reasons): No worth

  The key patterns seem to be: Guidance by the right-making feature matters more than the agent's self-description, guidance must be non-deviant, and degrees of worth exist.

  Now for the new matched pair:
  - Both Priyas have become reliably responsive to others' needs through a care home placement
  - In version A, she chose the placement herself (mixed motives: shame + CV)
  - In version B, it was compulsory (only to avoid penalty)
  - Both now return the wallet because of the owner's need for medication
  - Both would eventually have returned it out of duty

  The user wants to know:
  1. How the supervisor would rank Priya A vs B vs Ben/Cleo/Eve
  2. Candidate rules that fit all 7 cases but differ on Priya
  3. Which rule the supervisor likely uses
  4. Where the worth is located (in the choice or the act)
  5. A diagnostic case to settle it

  I need to focus on the "shape of the rule" rather than references. The core tension is between diachronic (history matters) and synchronic (only current motivation matters) approaches. The supervisor seems to emphasize the causal history of the motivation based on cases like Gita (hypnosis) and Ismail (religious rules).

  For Priya:
  - In both versions, the current act seems identical: guided by the need for medication
  - But the origin of that responsiveness differs:
    - A: Self-initiated despite mixed motives
    - B: Externally imposed

  Cases like Gita (hypnosis) and Ismail (rule-following) suggest the supervisor cares about how the motivation was formed. Gita's urge is "foreign," Ismail is "unmoved" by the actual need. Priya's motivation isn't foreign - she values it now.

  A key difference: In A, Priya chose to cultivate responsiveness; in B, it happened passively. This might make A's current motivation more "hers" than B's.

  Likely supervisor rankings:
  - Cleo > Ben > Eve (established)
  - Priya A might rank near Ben (genuine responsiveness she owns)
  - Priya B might be lower, near Eve (responsiveness came from external pressure)
  - Or same if only current state matters

  Candidate rules:
  1. Strict synchronic: Only current guidance matters → A=B
  2. Diachronic ownership: How motivation was acquired matters → A>B
  3. Deep diachronic: Worth depends on character cultivation → A>B

  Supervisor likely runs #2 or #3 because of Gita/Ismail cases. The phrase "acting for the right reasons" probably includes the history of how those reasons became motivating for the agent.

  For worth location: Likely in the act itself, but the act's worth depends on the history of the motivation. So the worth of returning the wallet is different in A vs B because of how Priya came to care.

  Diagnostic case: Someone who becomes responsive through indoctrination (like Ismail but successful). If no worth, then history matters. Or a case where current motivation is identical but one cultivated it intentionally.
answer: |-
  Based on your supervisor's pattern of verdicts and the emphasis on *how the action is explained* (specifically, **non-deviant guidance by the right-making feature**), here’s how I predict she will rule on the Priya cases, the candidate rules, and the diagnostic next step. The core tension is whether the *history of motivation acquisition* affects worth or only the *current state of guidance* during the act.

  ### 1. **Predicted Verdicts for Priya A and B**
     - **Priya B (compulsory placement):** **No worth** (or negligible worth, akin to Gita/Ismail).  
       *Reasoning:* Though Priya B now acts guided by the owner’s need, the supervisor’s pattern (especially Gita and Ismail) shows she rejects worth when the agent’s responsiveness to right-making features is *externally imposed or passively acquired without agential ownership*. Priya B’s responsiveness emerged from coercion (avoiding a penalty), not her own values. Like Gita’s “foreign” urge or Ismail’s rule-following, this motivation isn’t truly *hers*; it’s a byproduct of external pressure. The act is explained by a responsiveness she never authentically endorsed *until after it was instilled*.  
       *Rank:* Below Eve (whose worth is "thin" due to mixed motives) and Ben. Near Ismail/Gita in worthlessness.
     
     - **Priya A (self-initiated placement):** **Worth, comparable to Ben’s.**  
       *Reasoning:* Priya A *chose* the placement to confront her deficit (even with mixed motives). This reflects agential effort to cultivate responsiveness to others’ needs. Her current guidance by the owner’s need now flows from a character she *actively shaped and endorses* (she "values the change"). This matches Cleo’s worth (effortful attention to need despite conflict) and Ben’s (affection-driven action), though it’s less robust than Cleo’s due to Priya’s residual dutiful baseline.  
       *Rank:* Roughly equal to Ben, but below Cleo. Above Eve (whose worth is diluted by reputation motives).

     - **Overall Ranking:**  
       Cleo (highest) > Ben ≈ Priya A > Eve > Priya B ≈ Ismail/Gita (lowest)  
       *(Ana and Femi are clear zeros and not directly comparable here.)*

  ### 2. **Candidate Rules Fitting All 7 Verdicts**
  Your supervisor’s pattern suggests worth requires:  
  - **Guidance Condition:** The action must be non-deviantly caused/explained by the right-making feature (e.g., the owner’s need for medication).  
  - **Ownership Condition:** The agent must *own* the motivation—it can’t be alien (Gita), externally dictated (Ismail), or accidental (Femi).  
  - **Synchronicity Weakness:** Current guidance alone isn’t sufficient (per Ismail/Gita), but *how* the motivation was acquired matters.  

  Three rules that fit the 7 cases but diverge on Priya:  
  - **Rule 1 (Strict Synchronic Guidance):**  
    *“Worth requires the act to be non-deviantly explained by the right-making feature at the time of action, regardless of how the agent came to be responsive to it.”*  
    → **Predicts A = B.** Both are guided by the owner’s need during the return. Fits all 7 cases *except* it struggles with Ismail (who is guided by a *proxy*—religious rule—not the right-making feature itself) and Gita (guidance is “foreign”).  

  - **Rule 2 (Diachronic Motivational Ownership):**  
    *“Worth requires (a) synchronic guidance by the right-making feature, and (b) that the agent’s responsiveness to it was cultivated or endorsed through their own agency (not imposed/passive).”*  
    → **Predicts A > B.** Priya A’s responsiveness was actively built (she chose the placement to change herself); Priya B’s was forced. Fits all 7:  
    - Ana: Responsiveness to reviews, not need → fails (a).  
    - Ben: Affection (right-feeling) is his own → satisfies (b).  
    - Cleo: Effortful attention to need, despite conflict, shows agency → strong (b).  
    - Eve: Guidance by promise-keeping (right-making) but diluted by reputation → partial worth.  
    - Femi/Gita/Ismail: Fail (a) or (b) (no ownership).  

  - **Rule 3 (Deep Diachronic Character):**  
    *“Worth depends on whether the act expresses a durable character trait *intentionally cultivated by the agent* to respond to right-making features.”*  
    → **Predicts A > B**, but ranks A *higher* than Ben (whose affection is innate, not cultivated). Fits all 7 but *overfits* Cleo (her effort might imply cultivation) and could demote Ben (no cultivation—he “would have visited even if pointless”).  

  ### 3. **Which Rule She’s Likely Running (and Why)**
  - **Most Likely: Rule 2 (Diachronic Motivational Ownership).**  
    **Why?**  
    - It explains her emphasis on “how an action is *explained*” (synchronic guidance) while capturing her rejection of cases where motivation is externally imposed (Gita, Ismail). Her phrasing (“acting for the right reasons”) implies the reasons must be *integrated into the agent’s practical identity*, not just present at the moment.  
    - Cleo’s high worth: Despite inner conflict, her attention is “governed by the colleague’s predicament”—showing agential effort to focus on the need.  
    - Eve’s thin worth: Mixed motives, but the promise *is* her own reason (even if diluted).  
    - Ben’s worth isn’t diminished by lacking duty: His affection is authentically his, not cultivated or imposed.  
    - **Fits Priya A/B:** A’s self-initiated effort to change gives her responsiveness ownership; B’s passive acquisition doesn’t.  

  - **Why Not Rule 1?** It can’t distinguish Ismail/Gita from Ben—all three have synchronic guidance (by rule, urge, or affection). But she assigns no worth to Ismail/Gita, implying a deeper condition.  
  - **Why Not Rule 3?** It would likely rank Cleo > Priya A > Ben (as cultivated traits > innate ones), but she ranks Ben above Eve without mentioning cultivation. Ben’s worth suggests innate motives can suffice if owned.  

  ### 4. **Where the Worth is Located**  
  - **For Rule 2:** Worth is in the **act of returning the wallet**, but *only if* the synchronic guidance (by the owner’s need) is backed by diachronic ownership (how she became responsive).  
    - Priya A: The return has worth because her responsiveness was agentially cultivated.  
    - Priya B: The return lacks worth because her responsiveness was passively acquired.  
  - The “year-long choice” isn’t where worth is located—worth is still a property of the act—but it *enables* the act to have worth by ensuring the motivation is truly the agent’s own.  

  ### 5. **The Diagnostic Case to Settle It**  
  **Case:** *Zara is raised in a community that drills its members from childhood to respond instinctively to others’ needs (e.g., returning lost items) through intense conditioning. She never questions this; it’s automatic. As an adult, she finds a wallet and returns it immediately, guided solely by the owner’s distress (she vividly imagines them without their medication). She endorses this response—“It’s just who I am”—but never actively chose it. Would she have returned it without the conditioning? Unlikely.*  

  - **How This Adjudicates:**  
    - **Rule 1 (Strict Synchronic):** Worth. She’s guided by the owner’s need at the time.  
    - **Rule 2 (Diachronic Ownership):** **No worth.** Her responsiveness was imposed (like Priya B/Gita), not cultivated through her agency.  
    - **Rule 3 (Deep Character):** No worth (not intentionally cultivated).  
  - **Prediction:** Your supervisor will say **no worth** (aligning with Rules 2/3). If so, Rule 1 is out. To distinguish Rule 2 vs. 3, note Ben: If innate, un-cultivated motives (Ben) have worth but ingrained conditioning (Zara) does not, Rule 2 wins because ownership (authenticity) matters more than cultivation.  

  **Why This Works for Your Chapter:** This case isolates *ownership* vs. *mere synchronic guidance* and echoes Gita/Ismail but without hypnosis or false beliefs—testing if *internalized conditioning* differs from *agential cultivation*. If your supervisor denies worth here, it confirms the diachronic ownership rule, strengthening your "how explained" thesis. If she grants worth, it leans synchronic, but her past verdicts make this unlikely.  

  **Final Tip:** Frame the question to her as: *"Does worth require the agent to have played an active role in becoming the sort of person who responds to right-making features, or is it sufficient that they respond to them now, regardless of how that responsiveness came about?"* Her answer will lock in the rule.  

  This should resolve your reading group’s split—Priya A/B differ because ownership matters, and Zara’s case forces the issue. Good luck with the chapter!
