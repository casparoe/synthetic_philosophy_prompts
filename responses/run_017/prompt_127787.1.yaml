answer: |-
  Here's the Principal Principle (PP) and its disputes, translated into your experimentalist vocabulary, followed by the residue report.

  ### Restatement in Experimentalist Vocabulary
  1.  **The Principle:** Suppose there exists an unknown parameter θ characterizing the objective chance of some event A (e.g., θ = P(A)). A rational agent possesses an *estimator* for the probability of A, call it `Cred(A)`. The PP states: If the agent learns the *exact value* of θ (i.e., learns θ = x), and this learning occurs *under conditions C* (specified below), then the rational agent must set `Cred(A) = x`.
  2.  **The Dispute (What is θ?):** The core disagreement centers on what kind of quantity θ (objective chance) *is* and under what conditions it can be said to exist.
      *   **Frequentist Interpretation (θ as Limiting Frequency):** One camp argues θ must be definable as a limiting relative frequency within a well-specified, *repeatable* experimental ensemble. θ is a property of the *sampling distribution* over this ensemble. If no such repeatable ensemble exists, θ is ill-defined or non-existent. PP only applies when θ has this frequentist grounding.
      *   **"Modal" or "Nomic" Interpretation (θ as Counterfactual Propensity):** Another camp argues θ can be a fundamental property of a single, unique system or event at a specific time – a *propensity* or *disposition*. This θ isn't defined by an actual ensemble average but by hypothetical repetitions under *identical* (often physically impossible) conditions. It's a counterfactual stable tendency. PP applies even to single events if such a θ exists.
      *   **The Calibration Requirement:** Both camps generally agree that for θ to warrant deference via PP, it must be *calibrated*. If θ is known, then over the *hypothetical or actual ensemble* defining θ, the long-run frequency of A *should* converge to θ. PP demands that `Cred(A)` be calibrated *conditional on knowing θ=x*. Setting `Cred(A)=x` achieves this conditional calibration perfectly (zero expected Brier score loss, conditional on θ=x).
  3.  **The Caveat (Conditions C - "Admissible Evidence"):** Learning θ=x isn't always sufficient for PP. The principle is usually *hedged*: Setting `Cred(A) = x` is required only if the agent's *additional evidence E* is "admissible" with respect to θ and A. Intuitively, E shouldn't contain "inside information" about the specific outcome A in *this* trial that bypasses or contradicts the information θ=x provides about the *ensemble/counterfactual tendency*. Think of it as needing to condition *only* on the model parameters and setup, not on specific details that break the assumed exchangeability or identically distributed nature of the trials implied by θ.

  ### The Residue Report
  **(C): Clean Translation (Minimal Distortion)**
  1.  **Deference as Conditional Calibration:** Translates *very* cleanly. Treating θ as the "true" parameter value from a calibrated process (like a detector reading traceable to a standard) and setting `Cred(A) = θ` is precisely the action ensuring your credence is perfectly calibrated *conditional on knowing that true value*. It's the ultimate "trust the calibrated instrument" move. Your vocabulary cleanly distinguishes this from mere consistency (which is about behavior over repeated estimation, not the single-shot conditional calibration).
  2.  **Chance as Limiting Frequency Parameter:** The frequentist interpretation of θ fits naturally into your vocabulary. θ *is* an unknown parameter defined by a limiting frequency over a sampling distribution. PP deference is the rational response upon learning this parameter exactly. Uncertainty *within* this model is handled by Bayes or frequentist intervals *given θ*.
  3.  **The Calibration Requirement:** The demand that θ itself corresponds to the actual long-run frequency (if an ensemble exists) is core to your experimental practice. PP's reliance on θ being "well-calibrated" in this sense is directly analogous.

  **(D): Distorted Translation (Significant Tension)**
  1.  **Single-Case Chances (Cosmic Density):** This is the major distortion point. Your vocabulary is fundamentally rooted in ensembles, repetitions, and sampling distributions. A "chance" for a *singular, unrepeatable event* like the universe's density exceeding Ω_crit has no direct analog. The "counterfactual propensity" interpretation tries to force it in:
      *   *Translation Attempt:* Imagine θ is a parameter in the "Theory of Everything" model, defining the propensity. PP says: if you learn θ=x (the true propensity), set `Cred(A)=x`.
      *   *Distortion:* There is *no conceivable ensemble* for a unique universe. The "calibration" of θ is untestable and counterfactual ("if we *could* create many universes with *this exact* θ..."). Your vocabulary demands verifiable calibration against a standard or observable repetitions. This θ lacks that grounding. The translation forces θ into the role of a parameter, but its meaning and justification shift radically from the frequentist case. It feels like invoking an unknown parameter for which no sampling distribution exists or can be conceived.

  **(U): Untranslatable (No Direct Analog)**
  1.  **The "Admissible Evidence" Hedge:** This is the most significant untranslatable residue within standard frequentist/modeling paradigms.
      *   *The Issue:* PP requires setting `Cred(A)=x` *only if* the extra evidence E is "admissible." The classic problematic case: knowing *future* frequencies that contradict θ=x. E.g., You know θ (coin bias) = 0.6, but you also know that *in this specific upcoming sequence of 100 flips*, only 40 heads occur. Is this future frequency knowledge "admissible"? PP often says "no," allowing `Cred(Heads on next flip)` to remain 0.6, not drop towards 0.4.
      *   *Why Untranslatable?* Your vocabulary handles uncertainty through:
          *   *Within-Model:* Conditioning on known parameters (θ=x) *and* all relevant data (including the future frequency data). Conditioning on the future data *would* force `Cred(A)` away from x.
          *   *Across-Model:* Deciding the model specifying θ is wrong in light of new evidence (the future frequency), requiring model revision. θ=x is no longer credible.
      PP's "admissibility" tries to carve out a middle path: keep θ=x as the relevant parameter *for this single trial*, *ignoring* the specific future frequency data *for the purpose of setting credence in this trial*, precisely *because* it contradicts θ. Your statistical machinery has no direct analog for this specific prohibition against conditioning on certain types of data *while still accepting the parameter value as given*. It either conditions fully within the model or rejects/changes the model.
  2.  **Self-Undermining Evidence (The "Big Bad Bug"):**
      *   *The Issue:* What if the agent's evidence E includes information that *directly concerns what θ itself is*, rather than just information about the outcome A? For instance, a reliable oracle tells you "The true chance θ is *not* equal to your current best estimator θ̂." Or, more subtly, evidence suggests the process defining θ might be influenced by the agent's own beliefs or actions.
      *   *Why Untranslatable/Barely Translatable?* Your vocabulary handles uncertainty about θ via the estimation process itself (priors, likelihoods, sampling distributions). Learning evidence about θ updates your posterior distribution *over θ*. PP demands deference *conditional on knowing θ=x*. But if your evidence *directly challenges the possibility of knowing θ or its value*, applying PP becomes paradoxical or undefined. There's no clean analog for "defer to θ, but your best evidence says θ might be wrong or undefined in a way that bypasses standard updating." It points to a potential circularity: θ is defined as what you *should* defer to (PP), but evidence can tell you not to defer to your current best guess of θ. Your statistical methods resolve this by updating the estimate θ̂ or the model, not by a special rule about deference conflicting with evidence about the deference target.

  ### Analysis of the Residue
  *   **Indicting Your Vocabulary?** Only partially, regarding the *singular case*. Your vocabulary is exceptionally well-suited for repeatable phenomena with definable ensembles. Its struggle with unrepeatable singularities reflects a genuine limitation *for describing certain philosophical claims* about chance in those domains. However, this limitation is arguably a *strength* – it exposes the lack of operational grounding in the counterfactual propensity view.
  *   **Indicting "Objective Chance"?** Absolutely. The residues, particularly (D1) and (U1-U2), suggest "objective chance" (θ) is doing *heavy, potentially incoherent* work.
      *   **Thinner Than It Looks?** The residues support the view that "objective chance" is largely *defined* by its role in PP: "Objective chance is *whatever property θ you learn such that, upon learning θ=x (and absent inadmissible evidence), you are rationally compelled to set Cred(A)=x*." This is thinner than it looks. It doesn't tell you *what* θ *is* or *when it exists*; it just tells you how to use it *if* you have it and *if* conditions are right. The disputes over frequentist vs. propensity interpretations highlight the struggle to give θ independent substance.
      *   **More Work Than "Whatever You Defer To"?** Yes. PP claims θ is *objective* and warrants deference. But the residues show:
          *   For singular events, its objectivity is questionable (no grounding in observable repetitions/calibration).
          *   The "admissible evidence" hedge is needed precisely because deference can conflict with other rational constraints (like total evidence), undermining the sense that θ is a simple, objective "parameter" you just plug in.
          *   Self-undermining cases threaten the coherence of θ as a knowable, deference-worthy entity independent of the agent's state.
      "Objective chance" is posited as this deference-worthy thing, but the difficulties in applying PP cleanly suggest it might not be a robust, well-defined *kind* of thing outside of clear frequentist scenarios. Your vocabulary excels at those scenarios and exposes the fuzziness elsewhere. The principle works cleanly *only* when θ is a well-calibrated parameter from a repeatable process; the philosophical disputes arise when trying to extend it beyond that domain, and your vocabulary clearly identifies where that extension breaks down.
