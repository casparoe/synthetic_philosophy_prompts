  Okay, the user wants a sestina poem to conclude a graduate seminar on historiography. They've covered debates about objectivity, including Ranke's view that history should show the past "as it actually was," contrasted with Carr's skepticism about how historians select facts, and Hayden White's argument that historical narratives are shaped by aesthetic and moral choices rather than just facts. The key challenge is addressing a student's concern that without facts dictating the shape, historiography becomes relativistic or based solely on personal taste.

  The poem needs to embody these ideas through its form. A sestina is perfect because its rotating end-words demonstrate how the same elements can create different meanings based on order—miroring how historians arrange facts into narratives. The user specified concrete end-words from medieval annals: *bread*, *bell*, *bier*, *heir*, *rain*, *year*. These words are tangible and rooted in daily life, fitting the "documentary register" requirement. 

  For structure, the permutation must follow the standard sestina pattern (6-1-5-2-4-3). The mechanical feature where the last word of each stanza becomes the first of the next is crucial—it shows how one account's conclusion shapes the next narrative's starting point, subtly enacting Carr's "point of departure" idea. 

  The user wants one stanza to mimic bare transcription (Rankean objectivity), so I'll craft Stanza 2 to list events plainly: *bread* scarce, *bell* tolling, etc., with minimal interpretation. By Stanza 4 or 5, the poem must reveal its own selectivity—perhaps by shifting focus or implying omissions. For example, Stanza 4 could emphasize the *heir*'s arrival as pivotal, while Stanza 5 might satirize the futility of counting *years* amid chaos, showing how emplotment alters meaning without explicit labels. 

  The envoi must resolve the tension: the historian's choice is constrained but not dictated by facts. I'll pair the end-words in a way that feels inevitable yet open—e.g., *rain* and *year* suggesting cyclical hardship, *heir* and *bread* hinting at continuity, *bell* and *bier* underscoring mortality. No jargon, just visceral imagery. 

  Sound matters for oral delivery. I'll use steady iambic pentameter (11 syllables) with variations for emphasis. Words like *bier*/*heir* create internal rhymes, while *year*/*rain* evoke bleakness. The first/last word (*year*) bookends the poem, implying recurring struggles—a nod to historiography's endless reinterpretations. 

  Specialists should spot Stanza 2 as the "Rankean" transcription, Stanzas 4-5 as tragic/satiric emplotment, and the envoi as the balanced resolution. Yet a lay listener will feel the weight of famine, death, and uncertain renewal. The final lines—"the *heir* demands his *bread*"—leave the conflict unresolved, embodying the seminar's core tension: facts don't dictate the story, but they refuse incoherence.
answer: |-
  ## Sestina from the Annals of St. Anselm's, 1315-1318

  The scribe set down the closing of the **year**:
  No **bread** to spare after the failed grain.
  The passing **bell** rang constant through the damp.
  They laid another child upon the **bier**.
  The Abbot named the doubtful, distant **heir**.
  Cold **rain** still fell upon the sodden fields.

  The fields lay drowned beneath the constant **rain**.
  The chronicler recorded just the **year**,
  The count of mouths that starved without their **bread**,
  The tally of the bodies on the **bier**,
  The distant claim advanced by some new **heir**,
  The muffled sound of the requiem **bell**.

  They heard the slow, insistent tolling **bell**
  Announce the end beneath the weeping **rain**.
  Disputed papers named a foreign **heir**.
  They marked the passage of another **year**.
  The mill stood idle; no one ground the **bread**.
  They built another simple wooden **bier**.

  No cloth of gold adorned the common **bier**.
  The thin sound of the convent's single **bell**
  Could scarce be heard above the pounding **rain**.
  They scanned the sky, not trusting the sown **year**.
  The steward hid the last moldering **bread**.
  Old lords died cursing their rebellious **heir**.

  But see! At last, the long-awaited **heir**!
  His men dismissed the gloom around the **bier**.
  He heard the hopeful peal of the high **bell**
  Announcing respite from the endless **rain**.
  He promised bounty for the coming **year**,
  Assured the serfs of meat and rye and **bread**.

  The people clamoured only for their **bread**.
  They cared not for the claims of prince or **heir**.
  They saw no promise in the dawning **year**,
  Only the shadow of the waiting **bier**.
  They cursed the heavens and the cursed **rain**,
  Ignored the summons of the Abbey **bell**.

  O hear the Abbey's disregarded **bell**!
  See the thin hope crumble like stale **bread**!
  Mark how the skies release their bitter **rain**!
  Observe the weakness of the tardy **heir**!
  Count how they stack the bodies on the **bier**!
  Remember this as one more barren **year**.

  The **rain** denies the promise of the **year**;
  The **heir** demands his **bread**; the muted **bell**
  Attends the crowded **bier**.
