  Hmm, the user is a science writer for a general-interest magazine, finishing a 1,200-word feature on folk morality and moral objectivity. They've done their homework—interviewed researchers, have the literature—and just need testing of their argument's core structure before filing. Their central idea is that cross-cultural divergence in moral judgments undermines moral objectivity, visualized through a "divergence score" graphic.

  Their kicker claims moral objectivity has a "half-life": widespread disagreement turns facts into preferences. They propose treating WEIRD intuitions as outliers requiring a "double discount." They're fond of two punchy lines but suspect they might be indefensible. The user explicitly wants structural critique, not factual help.

  Key concerns emerge:
  First, the argument breaks at the leap from descriptive disagreement to prescriptive anti-realism. Observing cultural variation in *expressed* moral judgments doesn't logically preclude objective moral truths any more than cultural variation in folk astronomy precludes heliocentrism. The device conflates epistemic limits with metaphysical conclusions.

  Second, the unstated premise is that moral facts must command universal *recognition* to exist—a contentious metaethical assumption. Disagreement could stem from cognitive biases or informational differences rather than absence of truth. The score measures behavioral responses, not propositional beliefs, and treats societies as monoliths when intracultural variation exists.

  The divergence score actually measures behavioral variance in task responses across populations, not truth-aptitude of propositions. Choosing WEIRD responses as the baseline ironically centers the very sample being critiqued. Societies sampled aren't random; some may lack exposure to relevant moral concepts.

  The WEIRD critique properly targets psychological generalizability, not moral validity. It shows that certain intuitions are culturally specific, which should caution philosophers relying on them as evidence—but doesn't refute objectivity per se. The practical upshot about discounting WEIRD-supported claims holds if framed as epistemic humility.

  The two catchy lines should be cut. "Moral objectivity has a half-life" implies realism is quantifiably decaying, which misrepresents. "If your sample is WEIRD, your ethics are too" essentializes ethics as culturally determined. Replace with emphasis on contingent intuitions versus contested truths.

  A surviving frame would retain the graphic but pivot to epistemic caution: widespread divergence should reduce confidence in culturally specific intuitions as evidence for universal claims. The score illustrates where WEIRD intuitions are least representative, guiding where philosophers should seek broader validation. Variation becomes evidence for pluralistic discovery processes, not against truth.

  Bottom line: The piece works if presented as showing that WEIRD moral intuitions are statistically unusual, urging caution in treating them as universal evidence—not as disproving objectivity. The graphic powerfully visualizes cultural contingency without overreaching.
answer: |-
  Here’s a structured critique per your request:

  ### 1. Where the argument breaks  
  **The central mistake:** You conflate *lack of consensus* with *lack of objective truth*. Your "half-life" metaphor implies moral facts decay when disagreement rises—but disagreement is an epistemic (how-we-know) problem, not a metaphysical (what-exists) one. A society’s consensus or divergence on (e.g.) kin obligations measures *human perception/expression* of morality, not morality itself. This commits the **modal fallacy**: confusing "we don’t agree on X" with "X cannot be true." For instance, persistent historical disagreement about heliocentrism didn’t mean no fact existed—it meant access to evidence was uneven. Your device assumes universal convergence is necessary for objectivity, which is unsupported and contentious.

  ### 2. The premise you have not supplied  
  **What must be true for disagreement to undermine objectivity:** You need the premise that **moral facts must be universally recognizable** (or recognizable under specific conditions, like education/market exposure) to qualify as objective. Without this, disagreement only shows cognitive diversity, not truth’s absence. This premise is metaethically loaded: it assumes moral realism requires *convergent intuitions*. But many realists argue moral facts could be complex (like quantum physics) and thus prone to variable interpretation without being subjective. You’d also need to show that *all relevant variables* (education, religion, etc.) are distorting rather than enabling moral insight. If market integration *clarifies* impartial duties (e.g., via trade with strangers), WEIRD responses might be *more* reliable, not less—your data can’t resolve this.

  ### 3. What the divergence score would actually measure  
  The score measures **cross-cultural variance in behavioral/verbal responses to stimuli**, not verdicts on propositions. Trolley problems or money-splitting games tap *contextual intuitions*, not reflective endorsements of moral truths. Treating a society’s "modal verdict" as monolithic ignores intracultural dissent and reduces moral reasoning to binary outputs. Crucially:  
  - **Baseline issue**: Using WEIRD responses as 0% divergence centers the West as the "default," contradicting your critique.  
  - **Selection bias**: Your 20 vignettes may overrepresent WEIRD-contrarian cases (researchers often highlight divergence). Including societies with limited exposure to certain concepts (e.g., anonymous strangers) measures applicability, not truth.  
  - **Unit of analysis**: Societies aren’t independent data points; cultural phylogenies mean shared ancestry can inflate divergence clusters.

  ### 4. The WEIRD critique right side up  
  The sampling complaint exposes that **WEIRD intuitions are outliers in the human species**, invalidating claims that certain judgments (e.g., extreme individualism) are "human nature." This challenges **psychology and moral epistemology**—not moral ontology. It means:  
  - Philosophers using WEIRD intuitions as evidence for universal principles are overgeneralizing.  
  - Editors treating WEIRD moral reactions as "obvious" commit a parochial error.  
  **However**, this speaks to *how we justify* moral claims, not their truth. A Kantian could still argue impartial duties are objective, even if few cultures intuit them—just as germs cause disease even if some cultures attribute illness to spirits. The discount applies to *intuition’s reliability as evidence*, not to the moral claim itself.

  ### 5. Two lines to cut  
  Cut: *"moral objectivity has a half-life"* and *"if your sample is WEIRD, your ethics are too."*  
  - **Why**: The half-life metaphor implies moral facts *themselves* erode with disagreement—a metaphysical claim your data can’t support. The second line essentializes "ethics" as culturally determined, ignoring individual/critical reasoning.  
  - **Replace with**: *"Moral confidence has a half-life: the rarer your intuition globally, the weaker its claim to universality."* And: *"If your sample is WEIRD, your *intuitions* are too—discount them accordingly."* This shifts focus to epistemic humility.

  ### 6. A frame that survives  
  Keep the graphic but reframe it as **"The WEIRD Intuition Decay Index"**: it shows where WEIRD moral reactions are *culturally atypical*, urging caution in treating them as universal evidence. The defensible core:  
  - Cross-cultural variation reveals that many "self-evident" WEIRD judgments (e.g., punishing harmless offenses) are products of specific institutions.  
  - This variation **genuinely evidences** that intuitions are shaped by ecology/history, so philosophers must diversify their evidential base or defend why WEIRD contexts yield *truer* insights.  
  - The upshot: When intuitions cluster in WEIRD societies, they require extra scrutiny—not because truth is democratic, but because parochialism distorts.  
  **Variation as evidence for**: Moral psychology’s plasticity; unreliability of intuition alone; need for non-intuitive grounds (e.g., coherence, consequences) in ethics.

  ### 7. Bottom line for the desk  
  > The piece compellingly argues that WEIRD moral intuitions are outliers in humanity’s ethnographic record, urging philosophers/editors to discount them as universal evidence. I’ve refined the frame to avoid claiming variation *disproves* objectivity—instead, it shows that reliance on WEIRD intuition is empirically flimsy. The "divergence score" graphic will visually underscore where WEIRD responses are least representative, making the case for epistemic humility without overstepping into metaphysical claims. Core takeaway: What feels universal is often local; adjust confidence accordingly.
