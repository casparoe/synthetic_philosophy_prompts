prompt: |-
  I have been asked to give a seventy-five-minute guest session in the first-year letterform studio of a type design programme, and I want to use it to bring about eighteen students — who can draw a passable 'a', who can name bowl, stem, spur, terminal, counter and aperture, and who have had no philosophy — to the point where they feel the force of a single question: what makes every 'a' an 'a'? Not how one draws one, and not which 'a' is best, but what a mark has to be like in order to be that letter at all — given that a Bodoni 'a', a Futura 'a' and a single-storey 'ɑ' seem to share no measurable feature while remaining unmistakably the same letter, and that some marks much closer to the canonical 'a' than any of those are not one.

  I will have a whiteboard, a stack of printed specimens, and no projector. Please do not answer the question for me: plan how I should spend the time. I want the order in which the pieces must be introduced and what depends on what — not a menu of things that could be said.

  Three notions of my own that I would like the session to earn, and that you may take as given:

  *latitude* — the set of shapes a letter may take across typefaces. My reason for thinking this is the hard part is that the latitude of 'a' looks disconnected: there seems to be no continuous deformation that takes a double-storey 'a' into a single-storey one while remaining an 'a' at every intermediate step, so the category cannot be a region of shape-space with a centre.

  *contrast budget* — the pressure, within a single typeface, for 'a' to stay distinguishable from o, d, g, q, e, u and n at the sizes and in the media the face is actually used at, which suggests that much of what makes an 'a' an 'a' is not intrinsic to it but is its slot in a system of neighbours.

  *the counterfeit* — a mark that satisfies every local criterion you could write down for an 'a' and reads correctly in isolation, but is visibly not the 'a' of the face it has been dropped into.

  I have three candidate carrying examples: an *orphan sort*, in which each pair of students is handed twelve unlabelled glyphs cut from six typefaces — two from each — and asked to sort them into six piles without being told what any glyph says or whether any two come from the same face; the *counterfeit*; and the disconnectedness of latitude itself. Which should carry the whole session, what must it have and what must it lack, and why not the three I am otherwise tempted by — the Bodoni-beside-Futura comparison, the squint-or-blur test, and asking them to draw an 'a' from memory?

  The misconceptions I expect, in no particular order: that the essence is a checklist of features you could tick off; that since no feature is shared by all 'a's, the letter is arbitrary convention and one could swap 'a' and 'o' throughout a typeface at no cost; that there is an ideal 'a' which real fonts approximate, the truest one being nearest to it; and that talk of a letter's spirit is mysticism, the real story being only what readers happen to recognise, which is a psychological matter and none of the designer's business. Put these in the order in which they will actually arise, and tell me the exact point in the sequence at which each should be defused — I would much rather pre-empt one than correct it, because in a studio a wrong framing reaches the far side of the room before I can answer it.

  Two further things. First, the hinge I am least sure about: once the disconnectedness of latitude has landed, the session can collapse into "no answer, mere convention" — what must already be in place before that point so that the question survives it? Second, the end: I want one task whose results would let me tell, next morning, whether the question has landed or whether they have only learned to say "it's about the system, not the shape." What should that task be, what does an answer that has landed look like, and what does a fluent but empty one look like? And what should I openly decline to explain at this level — say, the philosophy-of-concepts literature, perception and letter recognition, or the history of the letter — and how should I mark the refusal so it reads as a decision rather than an omission?
reasoning: |-
  We are planning a 75-minute session for 18 first-year type design students. The goal is to lead them to feel the force of the question: "What makes every 'a' an 'a'?" without answering it. The students know basic terminology (bowl, stem, etc.) and can draw a passable 'a', but have no philosophy background.

  We are given three notions: latitude, contrast budget, and counterfeit. We have three candidate carrying examples: orphan sort, counterfeit, and the disconnectedness of latitude. We must choose one to carry the session and explain why not the others.

  The session must be structured in order, with dependencies, and we must pre-empt misconceptions. We must also plan a hinge to avoid collapsing into "no answer, mere convention" and an end task to assess understanding.

  Let's break down:

  1. **Goal**: Students feel the force of the question about the essence of 'a'.

  2. **Constraints**: 
     - Time: 75 minutes.
     - Tools: Whiteboard, printed specimens, no projector.
     - Students: Know basic letter parts, can draw an 'a', no philosophy.

  3. **Notions to earn**:
     - Latitude: The set of shapes that are 'a's, which is disconnected (double-storey to single-storey without intermediate 'a's).
     - Contrast budget: The letter must be distinguishable from neighbors (o, d, g, etc.) in context, so the system matters.
     - Counterfeit: A mark that looks like an 'a' in isolation but doesn't fit in a specific typeface.

  4. **Candidate carrying examples**:
     - Orphan sort: Students sort unlabelled glyphs (from multiple typefaces) into piles by typeface, without knowing what they are. This highlights the system (contrast budget) and that letters are recognized by their relationships in a typeface.
     - Counterfeit: Directly illustrates that local features aren't enough; context (the typeface system) is key.
     - Disconnectedness of latitude: Shows that the category 'a' is not a continuous shape space.

  We must choose one to carry the whole session. Why not the other candidates (Bodoni vs. Futura, squint/blur test, drawing from memory)? Let's evaluate:

  - Orphan sort: It's an active task that gets students engaged. It forces them to look at relationships between letters (contrast budget) without focusing on the meaning of the letter. But it might not directly address the disconnectedness of latitude.

  - Counterfeit: This is a powerful example because it shows that even if a shape has all the right parts, it might not fit. It leads to the system view. However, it might be too advanced without proper setup.

  - Disconnectedness: This is the core of the problem. But showing disconnectedness might be too abstract without concrete examples.

  Why not the other three?

  - Bodoni vs. Futura: This is a classic comparison to show diversity, but it doesn't necessarily highlight the system or the counterfeit. It's a starting point, but not a carrying example.

  - Squint or blur test: This is about legibility and how features blur together. It might be useful for contrast budget, but it doesn't directly address the essence of 'a'.

  - Drawing from memory: This might reinforce the idea of a canonical 'a', which we want to avoid.

  I propose to use the **orphan sort** as the carrying example because it is an engaging activity that will immediately get the students working with the material and noticing relationships. It naturally leads to the contrast budget (system) and can be used to introduce the counterfeit. Also, it can be set up without revealing the letters, so they focus on the shapes and groupings.

  But we must also address the disconnectedness of latitude. We can do that by including in the orphan sort glyphs that have both double-storey and single-storey 'a's? Actually, the orphan sort is about grouping by typeface, not by letter. We can have multiple letters in the sort, but the goal is to group by typeface. So we can have 'a's of different styles (double and single storey) and also other letters. This will force them to see that the same letter can look very different, but in the context of a typeface, they belong together because of the system.

  So let's choose orphan sort as the central activity. We can then build on it to introduce the counterfeit and the disconnectedness.

  **Structure of the Session**:

  Total: 75 minutes.

  1. **Introduction (5 minutes)**:
     - State the question: "What makes every 'a' an 'a'?" without attempting to answer.
     - Set up the orphan sort activity.

  2. **Orphan Sort Activity (25 minutes)**:
     - Divide students into pairs (9 pairs). Each pair gets 12 unlabelled glyphs: two glyphs from each of six typefaces. The glyphs should include an 'a' and one other letter (like 'o', 'n', etc.) from each typeface. The typefaces should be diverse: include one with double-storey 'a', one with single-storey, and others. Also, include a counterfeit? Maybe not yet, because we haven't introduced that. We can do counterfeit later.
     - Instructions: "Sort these 12 glyphs into six groups of two. Each group should contain two glyphs that you think come from the same typeface. You don't know what the letters are or which typefaces they are from."
     - After they sort, have them compare with other pairs. Then reveal which typefaces they are and which letters. They will see that they grouped by typeface, not by letter. This shows that the system (the style of the typeface) is what groups them, not the letter identity. Also, they will see that the same letter (like 'a') can look very different (double vs single storey) but still be recognized as that letter when seen in context? Actually, in this activity, they are not identifying the letter, but grouping by style. So the key takeaway is that the typeface style is a system that makes the letters belong together.

  3. **Discussion of Orphan Sort (15 minutes)**:
     - Ask: How did you group them? What features did you look for? (They might mention consistent stroke width, serifs, x-height, etc.)
     - Point out that the same letter (e.g., 'a') looks different in different typefaces, but in the same typeface, different letters share a common style. This introduces the idea of the system (contrast budget) and the fact that the identity of a letter is tied to its role in the system.
     - Now, show examples of the same letter (especially 'a') from the sorted typefaces. Highlight the disconnectedness: "Look at these two 'a's. One has two storeys, the other one. Can you imagine a shape that is halfway between these two? Would it still be an 'a'? Probably not." This introduces disconnectedness of latitude.

  4. **Counterfeit Example (15 minutes)**:
     - Present a counterfeit: a mark that has all the features of an 'a' (bowl, stem, etc.) but when placed in a specific typeface, it doesn't fit. Use one of the typefaces from the orphan sort and a counterfeit for that typeface.
     - Ask: "This mark has all the parts of an 'a'. Why doesn't it look like the 'a' in this typeface?" This leads to the contrast budget: it doesn't relate properly to the neighbors (e.g., the 'o' in the same typeface might have a different stress, or the counter might be too big, making it look like an 'o').

  5. **Synthesizing the Question (10 minutes)**:
     - Revisit the question: "So, what makes every 'a' an 'a'? We've seen that it's not a set of features (because the counterfeit has them but fails). It's not a continuous shape (because the latitude is disconnected). It seems to depend on the system (the typeface and the neighboring letters). But then, what is the essence?"
     - Pre-empt the misconception that it's arbitrary: "Could we swap 'a' and 'o' in a typeface? Let's try: if we swap them, then the word 'cat' becomes 'c?t' — but the 'a' is now the shape of the old 'o', and the 'o' is the old 'a'. In the word 'boat', we get 'b??t' — and it might read as 'boat' if we are used to it? But in practice, it would be confusing because we have learned to read the conventional shapes. However, the question is not about convention but about what makes the shape an 'a' in the system. In the swapped system, the shape that was 'o' is now playing the role of 'a'. But in the original system, the 'a' was designed to be distinct from the 'o' by the contrast budget. So swapping breaks the system."

  6. **Addressing Misconceptions**:
     - We need to pre-empt them in order. Let's map when they might arise and when to defuse.

     Expected misconceptions and when they arise:

     1. **That the essence is a checklist of features**: This might arise during the orphan sort when they are grouping. They might say they looked for serifs or stroke width. We can pre-empt it during the discussion by pointing out that the counterfeit has all the features but still fails. (So we defuse it when we do the counterfeit.)

     2. **That since no feature is shared by all 'a's, the letter is arbitrary convention and one could swap 'a' and 'o'**: This might come up when we show the disconnectedness. We need to pre-empt it by having the system (contrast budget) already in place. We do that in the orphan sort and counterfeit. Then when we show disconnectedness, we can say: "Even though there's no common feature, it's not arbitrary because the letter must fit in the system." (Defuse during the counterfeit and the swap discussion.)

     3. **That there is an ideal 'a'**: This might come up if we ask them to draw an 'a' from memory. But we are not doing that. It might also arise when they look at the diverse 'a's. Pre-empt by emphasizing the diversity and the system: "There is no one ideal; each 'a' is ideal for its typeface system."

     4. **That talk of a letter's spirit is mysticism**: This might come up when we talk about the system and the role. Pre-empt by grounding it in the practical design constraint of contrast budget: "It's not mysticism; it's about ensuring that at 8pt, the reader doesn't confuse 'a' and 'o'."

     Order of arising:

     - During orphan sort: misconception 1 (checklist) and maybe 3 (ideal) when they see diversity.
     - During disconnectedness: misconception 2 (arbitrary) and 3 (ideal).
     - During counterfeit: misconception 1 (checklist) and 4 (mysticism).

     So we pre-empt:

     - Misconception 1: During counterfeit, show that features aren't enough.
     - Misconception 2: When discussing disconnectedness, immediately tie it to the system (already covered in orphan sort and counterfeit) to avoid the arbitrariness conclusion.
     - Misconception 3: During the orphan sort discussion, when showing the diverse 'a's, emphasize that each is right for its system.
     - Misconception 4: During the counterfeit, explain the practical reason (contrast budget) so it's not seen as mysticism.

  7. **The Hinge (disconnectedness leading to "no answer, mere convention")**:
     - To avoid this, we must have already established the system (contrast budget) and the counterfeit. So when we show disconnectedness, we can say: "Even though there's no continuous path, the letter 'a' is defined by its role in the system of the alphabet. It must be distinct from its neighbors and fit the style of the typeface."

  8. **End Task (5 minutes)**:
     - Task: Ask each student to write down on a card: 
          - One thing they think is essential for a mark to be an 'a' (beyond the obvious parts).
          - One question they now have about the nature of the letter 'a'.
     - Collect the cards.
     - What does an answer that has landed look like? They might write about the system, the relationships, the role in the alphabet, the context. They might ask: "How does the system define the boundaries of the letter?" or "What happens when a new letterform is introduced (like the single-storey 'a') and how does it become accepted as an 'a'?" 
     - A fluent but empty answer: "It's about the system." without any depth. Or they might just repeat the terms without showing understanding.

  9. **What to Decline**:
     - At the end, when collecting the cards, say: "We haven't touched on the philosophy of concepts, the psychology of recognition, or the history of the letter. These are important, but today we are focusing on the design question: what must a mark be to function as an 'a' in a typeface? We are leaving those other areas for another time." This marks it as a deliberate decision.

  **Revised Timing**:

  - 0-5 min: Intro and set up orphan sort.
  - 5-30 min: Orphan sort activity (25 min).
  - 30-45 min: Discussion of orphan sort and introduction of disconnectedness (15 min).
  - 45-60 min: Counterfeit and contrast budget (15 min).
  - 60-70 min: Synthesizing the question and addressing misconceptions (10 min).
  - 70-75 min: End task and wrap-up (5 min).

  This is 75 minutes.

  **Why orphan sort as the carrying example?**
  - It engages the students immediately and makes them discover the system.
  - It provides concrete material (the printed specimens) for the entire session.
  - It naturally leads to the other two notions: from the grouping, we see that the same letter can vary (latitude) and then we can show the disconnectedness. The counterfeit can be introduced as an example of a mark that doesn't fit the system.

  **Why not the other candidates for carrying example?**
  - Bodoni vs. Futura: It's a static comparison. We can use it in the discussion, but it's not an activity.
  - Squint test: Useful for contrast budget, but not as engaging and doesn't cover the full scope.
  - Drawing from memory: Reinforces a canonical idea, which we want to avoid.

  This plan should lead them to feel the force of the question without answering it.
answer: |-
  ### Session Plan: "What Makes Every 'a' an 'a'?"

  **Total Time:** 75 minutes  
  **Goal:** Students feel the force of the core question—*what makes a mark an 'a'?*—without resolving it. The session must earn the notions of *latitude*, *contrast budget*, and *counterfeit* while pre-empting misconceptions. The carrying example for the session is the **orphan sort**, as it forces engagement with the system (contrast budget) and sets up disconnected latitude and counterfeit naturally. It lacks direct focus on shape comparison (avoiding the "ideal 'a'" trap) and is hands-on, leveraging printed specimens.  

  **Why orphan sort?**  
  - **Strengths:** It immediately immerses students in the *system* (contrast budget) by grouping glyphs by typeface without letter identification. This reveals that letter identity depends on relational context, not intrinsic features. It also surfaces disconnected latitude (e.g., double- vs. single-storey 'a's in different piles) and smoothly transitions to counterfeit (a glyph that "fakes" features but breaks the system).  
  - **Why not the other candidates?**  
    - *Bodoni/Futura comparison:* Only shows diversity, not the system. Risks reinforcing "ideal 'a'" or arbitrary-convention misconceptions.  
    - *Squint/blur test:* Focuses on legibility, not essence. Could reduce the question to optics, not ontology.  
    - *Draw an 'a' from memory:* Invites a canonical "ideal," contradicting latitude and disconnectedness.  

  **Key Dependencies:**  
  1. **Latitude** depends on seeing diverse 'a's *in context* (orphan sort reveals this).  
  2. **Contrast budget** depends on grouping glyphs into systems (orphan sort forces this).  
  3. **Counterfeit** depends on prior grasp of system and latitude (orphan sort provides the foundation).  

  **Misconceptions & Pre-emption Sequence:**  
  Misconceptions will arise in this order during the session. Pre-empt each at the exact point below:  
  1. **"The essence is a checklist of features"** (will arise during orphan sort grouping).  
     - **Defuse at:** Start of orphan sort discussion (min 25). Pre-empt by asking: *"When sorting, did you list features (e.g., 'serifs') or sense a cohesive style? What if a glyph has all the 'right' parts but clashes?"*  
  2. **"There's an ideal 'a'"** (will arise when comparing diverse 'a's post-sort).  
     - **Defuse at:** Introduction of latitude (min 35). Pre-empt by showing a double-storey and single-storey 'a' side by side: *"Neither is 'truer'—each works in its system. An 'ideal' would ignore that Futura and Bodoni solve different problems."*  
  3. **"It's all arbitrary convention; swap 'a' and 'o' at no cost"** (will arise when disconnected latitude is shown).  
     - **Defuse at:** Transition to contrast budget (min 45). Pre-empt with: *"If convention were all, swapping should work. But let's test: in a word like 'boat,' swap 'a' and 'o'—does it read? Why not? Hint: look at the neighbors."*  
  4. **"Letter 'spirit' is mysticism; recognition is just psychology"** (will arise during counterfeit discussion).  
     - **Defuse at:** Counterfeit reveal (min 55). Pre-empt by stressing contrast budget: *"This isn't magic—it's practical. At 8pt in newsprint, a misaligned counter makes 'a' look like 'o'. Designers control this."*  

  **Session Flow:**  
  *(Times are cumulative; activities use printed specimens and whiteboard.)*  

  #### 1. **Intro: Framing the Question (0–5 min)**  
     - State the question: *"What must a mark be to be an 'a'? Not how to draw it, or which is best—but what makes Bodoni 'a', Futura 'a', and 'ɑ' all 'a's, while some nearly identical marks aren't?"*  
     - Clarify scope: *"We won't answer this today. We're exploring why it’s hard. You’ll leave with the question burning louder."*  
     - **Tool:** Whiteboard the question.  

  #### 2. **Orphan Sort: Revealing the System (5–30 min)**  
     - **Activity:**  
       - Pair students (9 pairs). Give each pair 12 unlabelled glyph cutouts: **two glyphs each from six typefaces** (e.g., Bodoni, Futura, Garamond, Helvetica, Gill Sans, a single-storey face like FF Scala). Include 'a' and one neighbor (e.g., 'o' or 'n') per face. *Crucially, include both double and single-storey 'a's.* No two glyphs from the same face are identical.  
       - Task: *"Sort these into six pairs that belong together. Don't name the letters or typefaces—focus on what binds each pair."* (15 min for sorting, 10 min for pair comparisons).  
     - **Why this order?** Starts concrete, avoids philosophy. Forces attention to system (contrast budget) and hints at latitude.  
     - **Pre-emption:** During sorting, circulate and ask: *"Are you listing features or feeling a 'family resemblance'?"* (Pre-empts misconception 1).  

  #### 3. **Orphan Sort Discussion: Introducing Latitude (30–45 min)**  
     - **Group Sharing:** Have pairs share their groupings. Reveal typefaces and letters.  
       - Ask: *"How did you group them? Was it stroke contrast? Serif style? X-height? Did letter identity help?"* (Students will say no—they used systemic traits.)  
     - **Introduce Latitude:**  
       - Pin specimens to whiteboard. Show all 'a's together: *"Look at these 'a's—Bodoni, Futura, single-storey. What do they share? No single feature. This is 'latitude': the shapes an 'a' can take."*  
       - Highlight disconnectedness: Point to double vs. single-storey. *"Is there a shape halfway between these that’s still an 'a'? Probably not. Latitude isn't a smooth continuum—it's disconnected."*  
     - **Pre-emption:** *"No one 'a' is the prototype—each is right for its system."* (Pre-empts misconception 2).  

  #### 4. **Contrast Budget: The System in Action (45–60 min)**  
     - **Whiteboard Demo:** Draw a simple "alphabet neighborhood" for 'a':  
       ```  
       o – a – d  
         / | \  
       e  u  g  
       ```  
       Explain: *"'a' must differ from 'o' (counter size), 'd' (aperture), 'e' (terminal), etc. This is 'contrast budget': limited resources to stay distinct."*  
     - **Activity:** Give pairs a specimen sheet with words ("dance," "guard," "about"). Ask: *"At 8pt, what keeps 'a' from becoming 'o' or 'u'? Point to one feature per word."*  
     - **Pre-emption:** *"If convention alone ruled, we could swap 'a' and 'o'. But try reading 'bost' for 'boat'—it fails because the system breaks."* (Pre-empts misconception 3).  

  #### 5. **Counterfeit: The Limits of Local Features (60–70 min)**  
     - **Reveal:** Show a pre-prepared counterfeit—e.g., a Futura-style 'a' inserted into a Bodoni word like "dance." Ask: *"This has bowl, stem, aperture—why does it feel wrong?"*  
     - **Discussion:** *"It fits all local 'a' criteria but clashes with Bodoni’s system (e.g., stroke contrast, neighbor spacing). Even if it reads in isolation, it fails in context."*  
     - **Pre-emption:** *"This isn’t mysticism—it’s engineering. Poor contrast budget = misread text."* (Pre-empts misconception 4).  

  #### 6. **Synthesis: The Hinge & End Task (70–75 min)**  
     - **The Hinge (Avoiding "No Answer"):** Before disconnected latitude (min 35), the orphan sort established the system. Before counterfeit (min 60), contrast budget showed the system’s constraints. Now: *"Latitude is disconnected, features aren’t enough. But it’s not 'just convention'—swap 'a' and 'o' and words break. The system isn’t arbitrary; it’s functional."*  
     - **End Task (Diagnostic):**  
       - *Task:* "On a slip, sketch an 'a' that *could not exist* in any typeface. Not ugly—impossible. Why?"  
       - *Landing the question:* A student draws, say, an 'a' with no counter but writes: *"If it has no counter, it might be 'u'—but single-storey 'ɑ' has a tiny counter. Where’s the line?"* This shows they feel the tension between system, features, and latitude.  
       - *Fluent but empty:* "It must have a bowl and stem." (Ignores system/latitude). Or: "It’s about the system." (No grappling with *why*).  
       - Collect slips to assess next morning.  
     - **Declare Boundaries:** *"We haven’t covered philosophy (e.g., Wittgenstein), how brains recognize letters, or how 'a' evolved from Roman script. These matter—but today, we’re designers. We ask: what must this mark* do *to function as an 'a'?"*  

  **Why This Sequence Works:**  
  - **Orphan sort** carries the session: It demands system-first thinking, making contrast budget intuitive. Its "blind" setup avoids letter fixation, and the diversity of 'a's (double/single-storey) forces disconnected latitude. Counterfeit then becomes a punchline.  
  - **Pre-emption order** matches the activity flow: Checklist thinking (sorting) → ideal 'a' (latitude) → arbitrariness (contrast budget) → mysticism (counterfeit).  
  - **Hinge secured:** By min 60, students see the system’s functional role (contrast budget), so disconnected latitude doesn’t collapse into convention.  
  - **End task** is generative: Sketching an "impossible 'a'" forces them to confront boundaries. The written "why" reveals if the question landed.  

  **Materials Prep:**  
  - Orphan sort: 12 glyphs/pair (mix faces; ensure 'a' diversity).  
  - Counterfeit: Printed word ("dance") with mismatched 'a'.  
  - Specimens for contrast budget activity (words with 'a' in context).  

  This plan earns your three notions while keeping the question alive. Students leave troubled—in a good way.
