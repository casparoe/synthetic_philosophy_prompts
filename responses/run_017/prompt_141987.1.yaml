prompt: |-
  I direct a small technical unit in a national geological survey. Several times a year we publish single-number probability statements that are then used downstream by regional planners doing expected-cost arithmetic, and increasingly for one-off go/no-go decisions on single projects that will never be repeated: a levee to be raised or not, a town to be relocated or not. Examples: "0.22 probability that the Kestrel fault segment produces a magnitude 7 or greater rupture in the next thirty years"; "0.04 probability per year that the Alder Valley levee system fails."

  Our numbers come from three quite different places. Some come from long-run relative frequencies in a reference class — paleoseismic records of past ruptures, or component-failure databases for levee systems. Some come from physical models that assign a single-case tendency to a particular set-up: a stress-transfer model of this specific fault, a hydrological model of this specific valley. Some come from structured expert judgment, elicited and then revised as new data arrive. We have also found that some of our frequency-based statements move by a factor of two depending on how narrowly the reference class is drawn — all faults in the basin versus faults of comparable slip rate and geometry.

  A new oversight board has now ruled that every number we publish must be traceable: we must be able to say what kind of support it has, and we may not silently average or mix supports of different kinds, because the planners downstream treat our number as something to bet with, which is not the same thing as a frequency and not the same thing as a physical tendency.

  Please write a procedure my reviewers can run on a candidate statement before we sign off on it. It should consist of: an ordered set of questions; for each question, what counts as a sufficient answer drawn from our own files and modelling reports; the points at which the procedure returns "do not publish a number" or "publish only as an interval or qualitative band"; and the points at which it must hand the decision back to a person because the issue is a judgment call rather than a checkable one. Ground it in what the three interpretations actually say — the frequentist reading of probability as long-run relative frequency in a fixed reference class, the subjectivist or Bayesian reading as degree of belief constrained by coherence and revised by conditioning, and the propensity reading as the objective single-case tendency of a particular set-up — and in the fact that these are not three rival estimates of one quantity so much as three different things a probability claim can be.

  Constraints: my reviewers have roughly forty minutes per statement and no formal training in the philosophy of probability, so each step must say what to look for in material we actually have; the procedure must be strict enough that two reviewers reach the same verdict on the same file.

  Then apply it to three cases. (1) The Kestrel fault statement above, where we have six hundred years of paleoseismic records but the segment is now thought to be in a stress state not represented anywhere in that record, and where the reference class choice gives 0.22 on one drawing and 0.11 on another. (2) A proposed statement about a first-of-a-kind carbon-capture containment vault: no failure history at all, a physics model giving a 0.02 failure probability over fifty years, and an expert panel giving 0.05 to 0.15. (3) A statement about whether a named glacier will "collapse" within the decade, where there is no agreed threshold for collapse and different teams' figures range from 0.1 to 0.6 accordingly. At least one of these should come out as an answer the board will not like.

  Close with a short section, headed "What this procedure cannot do," that says plainly how the procedure should treat the gap between a number supported as a frequency or a physical propensity and the confidence a planner is entitled to place in a single non-repeated project, and that states which of the reference-class and threshold difficulties are managed rather than solved.

  Format the answer as numbered procedural steps, with the three cases in clearly labelled subsections and the closing section under the heading above. Hard limit: 1,100 words, counting the cases and the closing section. Do not cite, quote, or attribute any philosophers or published works; the reasoning should stand on its own.
reasoning: |-
  Okay, the user directs a small technical unit in a national geological survey that publishes critical probability statements. These numbers are used for high-stakes decisions like infrastructure projects or relocations. The oversight board now requires traceability for each number, prohibiting silent averaging of different support types (frequentist, propensity, Bayesian). I need to create a strict 40-minute review procedure grounded in probability interpretations, with clear pass/fail criteria and handling of judgment calls.

  The core challenge is designing a procedure that respects three distinct probability interpretations: frequentist (long-run frequencies), propensity (single-case tendencies), and Bayesian/subjectivist (degrees of belief). The procedure must be executable by reviewers without philosophy training in 40 minutes per statement. Key requirements include:
  - Ordered questions with specific pass/fail criteria
  - Clear "do not publish" or "publish as interval" breakpoints
  - Handling of judgment calls by referring back to humans
  - Consistency across reviewers

  For the procedure structure, I'm considering a decision tree with three main branches corresponding to the probability interpretations. Each branch would have verification steps checking for appropriate evidence. Critical rejection points would include mixed/missing supports or unmanageable sensitivity. The closing section must explicitly address the gap between published numbers and single-case decision confidence.

  The three test cases are strategically chosen to probe different weaknesses:
  1) Kestrel fault: Frequentist support with reference class sensitivity and unrepresented stress state
  2) Carbon-capture vault: Novel technology with only model/propensity and expert judgment
  3) Glacier collapse: Definitional ambiguity causing wide expert disagreement

  I anticipate case 2 (carbon capture) will produce the "unwelcome" outcome since it lacks frequentist support and has divergent propensity/expert estimates that can't be reconciled. The glacier case should clearly fail due to threshold ambiguity.

  For implementation clarity, I'll use a flowchart-like progression in the steps: first check for pure frequentist support, then propensity, then Bayesian, with strict rejection if mixing occurs or evidence is insufficient. The "hand to human" exit will be reserved for borderline cases where judgment is needed despite meeting minimum evidence thresholds.

  Word count management is crucial - the procedure steps must be concise yet unambiguous, with case analyses focusing only on application of the steps. The closing section will be kept under 150 words while still addressing the fundamental limitations.
answer: |-
  ### Probability Statement Review Procedure

  **Step 1: Identify the Core Support Type**
  *   **Question:** Is the number derived *primarily* from a specific, well-defined long-run frequency (F), a validated physical propensity model (P), or a formally elicited and structured expert judgment (B)?
  *   **Sufficient Answer:** Locate the explicit justification in source documents. F: Defined reference class and historical count/data. P: Physics-based model description with uncertainty quantification. B: Expert elicitation protocol, participant list, aggregation method, and date.
  *   **Fail:** No single dominant, clearly articulated support type is documented. **Action:** Do not publish a number. **Hand-off:** If justification exists but type is ambiguous, hand to person.

  **Step 2: Verify Purity of Support**
  *   **Question:** Does the documentation show the number was derived *solely* using the method identified in Step 1? Specifically, is there evidence of mixing/averaging numbers from different support types (F, P, B) to arrive at this single figure?
  *   **Sufficient Answer:** Calculation trace shows inputs and method consistent *only* with the declared support type (e.g., F: frequency calculation from class data; P: model output; B: aggregated expert estimates).
  *   **Fail:** Evidence of silent averaging or combining estimates from different support types (e.g., "we took the model result and adjusted it based on expert opinion" without clear B re-elicitation, or averaging F and P results). **Action:** Do not publish a number.

  **Step 3: Assess Robustness Within the Support Type**
      *   **3a: For Frequency (F):**
          *   **Question:** Is the reference class clearly defined? How sensitive is the number to reasonable changes in class definition (e.g., broader/narrower, different filters)?
          *   **Sufficient Answer:** Document defines the class (e.g., "faults in Basin X with slip rates 1-5 mm/yr"). Sensitivity analysis shows variation less than a factor of 1.5 over reasonable alternatives.
          *   **Fail:** No defined reference class; or sensitivity analysis shows variation >= factor of 2 over reasonable, defensible alternatives; or data span << the forecast period (e.g., 50 years of data for a 100-year forecast). **Action:** Publish only as an interval (min-max from reasonable classes) or qualitative band (e.g., low, medium, high). **Hand-off:** If sensitivity is borderline (e.g., factor 1.8) or class definition is highly contested, hand to person.
      *   **3b: For Propensity (P):**
          *   **Question:** Is the physics model validated against relevant empirical data or benchmarks? Are key input uncertainties (parameters, boundary conditions) propagated to the output probability?
          *   **Sufficient Answer:** Model validation report against independent data/benchmarks exists. Uncertainty propagation (e.g., Monte Carlo) was performed, showing the number is a central estimate within a quantified range.
          *   **Fail:** No validation against relevant phenomena; no uncertainty propagation; model is purely theoretical for a novel system with no analogues. **Action:** Do not publish a number. **Hand-off:** If validation/uncertainty is partial but arguably sufficient for context, hand to person.
      *   **3c: For Bayesian/Expert Judgment (B):**
          *   **Question:** Was a structured protocol (e.g., IDEA, Cooke) used? Were experts calibrated/weighted? Is the number the output of the formal aggregation method applied to the *current* judgments (i.e., revised with new data if appropriate)?
          *   **Sufficient Answer:** Documentation of protocol, individual expert estimates, aggregation method, and evidence judgments incorporate all relevant current data.
          *   **Fail:** Unstructured "consensus" meeting; no record of individual judgments or aggregation; judgments not updated with significant new data. **Action:** Do not publish a number. **Hand-off:** If protocol was followed but aggregation is complex or update debatable, hand to person.

  **Step 4: Check Representativeness for the Forecast Case**
  *   **Question:** Does the documentation acknowledge and assess whether the conditions underlying the support (F class, P model setup, B expert basis) are representative of the specific single case and forecast period?
  *   **Sufficient Answer:** Explicit discussion of representativeness exists (e.g., "The F class matches the fault's key characteristics"; "P model incorporates the current stress state"; "Experts considered the novel CCS materials").
  *   **Fail:** Documented evidence shows known, significant non-representativeness critical to the forecast (e.g., F class lacks current stress state; P model omits key process; Experts lacked data on novel aspect) without quantitative adjustment within the support type. **Action:** Publish only as an interval/band *or* Do not publish a number (depending on severity). **Hand-off:** If representativeness is uncertain or partially addressed, hand to person.

  **Step 5: Final Sanity Check & Traceability**
  *   **Question:** Is the final number clearly traceable through Steps 1-4? Does the documentation explicitly state the support type and key assumptions/limitations?
  *   **Sufficient Answer:** Clear audit trail from source data/model/judgment to final number exists. Report section states the support type and major caveats (e.g., "Based on paleoseismic frequency; sensitivity to class +/-X", "Propensity model output; uncertainty range Y-Z", "Aggregated expert judgment; range A-B").
  *   **Fail:** Traceability broken; support type not stated; critical limitations/caveats omitted. **Action:** Do not publish until documentation corrected.

  ---

  ### Application to Cases

  **Case 1: Kestrel Fault (0.22 in 30 years)**
  1.  **Support Type (Step 1):** F (Paleoseismic records).
  2.  **Purity (Step 2):** Presumably passes (pure frequency calc).
  3.  **Robustness F (Step 3a):** **FAIL.** Sensitivity documented: 0.22 vs 0.11 (factor of 2) depending on class definition. No single robust class.
  4.  **Representativeness (Step 4):** **FAIL.** Documented non-representativeness (current stress state not in paleo record). Adjustment within F likely impossible.
  5.  **Traceability (Step 5):** N/A (failed earlier steps).
      *   **Verdict:** **Publish only as an interval (e.g., 0.11 - 0.22) or qualitative band.** Clearly state reason: High sensitivity to reference class definition and non-representative current conditions.

  **Case 2: Carbon-Capture Containment Vault (0.02 over 50 years)**
  1.  **Support Type (Step 1):** P (Physics model).
  2.  **Purity (Step 2):** Presumably passes (model output used directly).
  3.  **Robustness P (Step 3b):** **FAIL.** "First-of-a-kind". No relevant empirical data for validation. "Validated" likely means only internal consistency/benchmarks against simpler systems, insufficient for novel tech. Uncertainty propagation might exist but rests on unvalidated assumptions.
  4.  **Representativeness (Step 4):** **HAND-OFF.** Model *aims* for representativeness but its ability is fundamentally unknown due to novelty. Severity high.
  5.  **Traceability (Step 5):** N/A (failed Step 3b).
      *   **Verdict:** **Do not publish the model's 0.02 number.** (Board will not like this). State: "Physics model suggests low probability (e.g., <0.05), but lacks validation for this novel system. Expert judgment range: 0.05 - 0.15."

  **Case 3: Named Glacier Collapse (<10 years)**
  1.  **Support Type (Step 1):** B (Expert judgment - different teams' figures).
  2.  **Purity (Step 2):** **HAND-OFF/Fail Implied.** If publishing a single number (e.g., 0.3), how was it derived from divergent expert inputs (0.1-0.6)? Unstructured averaging likely. If publishing a range, skip to Step 4.
  3.  **Robustness B (Step 3c):** **FAIL.** "No agreed threshold for collapse." Experts are judging fundamentally different events. Standard protocols cannot resolve this. Estimates are incommensurable.
  4.  **Representativeness (Step 4):** N/A (failed earlier).
  5.  **Traceability (Step 5):** N/A.
      *   **Verdict:** **Do not publish a single number. Do not publish a quantitative interval.** Publish qualitative statement (e.g., "Moderate likelihood of significant destabilization within decade") and explicitly state: "Quantitative probability estimates range widely (0.1-0.6) due to differing definitions of 'collapse'."

  ---

  ### What this procedure cannot do

  1.  **Bridge the Interpretative Gap:** This procedure ensures a number is traceably supported *as* a frequency, propensity, or belief. It cannot guarantee that a planner's confidence in a single, non-repeatable decision (e.g., "betting the town") should match this number. A frequency (F) describes a class; a propensity (P) describes a setup's tendency; a degree of belief (B) describes expert uncertainty. None directly *are* the unique "correct" confidence for a specific unrepeatable event, though they inform it.
  2.  **Solve Reference Class or Threshold Problems:** The procedure *manages* these issues by demanding transparency (sensitivity analysis, clear definitions) and prohibiting silent mixing. If sensitivity is high (Step 3a) or thresholds undefined (Case 3), it forces an interval/band or prohibits a number. It does not *solve* the fundamental difficulty of choosing the "right" class or definition; it compels acknowledgment of the ambiguity.
  3.  **Eliminate Judgment:** Steps requiring hand-off highlight where expert judgment *within the chosen support framework* is essential (e.g., assessing borderline model validity, partial representativeness). The procedure structures and constrains the use of judgment but cannot replace it entirely.
