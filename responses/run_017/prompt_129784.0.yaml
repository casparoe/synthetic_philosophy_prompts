answer: |-
  Below is a decision tree designed to guide students from their commitments to a specific position in higher-order (HO) theories of consciousness. It fits on one side of A4, uses 8 questions, and results in 9 leaves (5 named positions, 4 unnamed). The tree prioritizes your specified distinctions (occurrent vs. dispositional, non-inferential, accuracy, attitude type, and explanatory target) and incorporates your cases to ground the questions. Questions are phrased neutrally so students can answer without theory knowledge.

  ### **Decision Tree: Higher-Order Theories of Consciousness**
  *Start at Question 1 and follow the branches based on your answers.*

  1. **Must a higher-order (HO) state be actively present (occurrent) for a first-order (FO) state to be conscious?**  
     - **Yes** → Q2  
     - **No** → Q6  

  2. **If the HO state misfires (e.g., represents you as being in a state you’re not in), is the *represented* state still conscious?**  
     - **Yes** → Q3  
     - **No** → Q4  

  3. **Is the HO state required to be non-inferential (direct, not based on reasoning)?**  
     - **Yes** → Q5  
     - **No** → **Leaf: Unnamed A** (Occurrent, inferential HO; unattractive—inference is too slow for real-time consciousness, e.g., wouldn’t explain the **taxi driver**'s sudden realization)  

  4. **What does the theory primarily explain? (Choose one)**  
     - **Phenomenal character (what-it’s-like-ness)** → **Leaf: Unnamed B** (Occurrent HO, accuracy-required; incoherent—misfires like **swapped monitor** would mean you’re conscious of a state that doesn’t exist, but accuracy demands it can’t be conscious)  
     - **Access/reportability or creature consciousness** → **Leaf: First-order/attentional view** (e.g., Tye, Dretske—collapses into FO because HO adds nothing if it must be accurate and occurrent)  

  5. **What kind of attitude is the HO state?**  
     - **Thought-like/conceptual** → **Leaf: Rosenthal-style HOT (actualism)**  
     - **Perceptual/quasi-perceptual** → **Leaf: Higher-order perception (HOP)**  

  6. **Can the HO state be merely available (dispositional), or must it be actively used?**  
     - **Merely available (dispositional)** → Q7  
     - **Must be actively used** → *Contradiction—go back to Q1* (You said HO needn’t be occurrent, so "actively used" conflicts)  

  7. **Is the disposition for a *distinct* HO state (e.g., a separate monitoring state)?**  
     - **Yes** → Q8  
     - **No** → **Leaf: Same-order/self-representational** (e.g., Kriegel—HO is not distinct; FO state represents itself)  

  8. **What kind of attitude would the HO state have if formed?**  
     - **Thought-like/conceptual** → **Leaf: Dispositionalism** (e.g., Carruthers)  
     - **Perceptual/quasi-perceptual** → **Leaf: Unnamed C** (Dispositional HOP; unexplored—no major theorist defends it)  

  ---

  ### **Leaves Explained**  
  1. **Rosenthal-style HOT (actualism)**: Occurrent, non-inferential, conceptual HO; misfires create consciousness (e.g., **swapped monitor** makes you conscious of the wrong state).  
  2. **Higher-order perception (HOP)**: Occurrent, non-inferential, perceptual HO; misfires create consciousness (e.g., **doubled monitor** causes two conflicting conscious states).  
  3. **Dispositionalism**: Dispositional, conceptual HO; consciousness requires availability even if unused (e.g., **absorbed athlete** is conscious if they *could* report it).  
  4. **Same-order/self-representational**: No distinct HO state; FO state represents itself (e.g., **late monitor**’s FO state was conscious at the time, even if HO is delayed).  
  5. **First-order/attentional view**: Consciousness is based on FO attention/access; HO is irrelevant (e.g., **rack case** isn’t conscious—it’s just access).  
  6. **Unnamed A**: Occurrent, inferential HO. *Unattractive—inference is too slow* (e.g., fails **late monitor** or **taxi driver** cases).  
  7. **Unnamed B**: Occurrent HO requiring accuracy. *Incoherent—misfires can’t happen*, but cases like **swapped monitor** show they must.  
  8. **Unnamed C**: Dispositional HOP. *Unexplored—no theorist combines these*.  
  9. **First-order view** (from Q4): Not HO; explains access only (e.g., **rack case** isn’t conscious).  

  **Why no other leaves?**  
  - **Occurrent + dispositional combo**: Impossible—Q1 forces a choice.  
  - **Self-representational + dispositional**: Excluded—self-rep isn’t dispositional (Q7 handles this).  
  - **Key question**: Q1 (occurrent vs. dispositional) does the most work—it splits the tree into two main families.  
  - **Dud questions**: Q3 (non-inferential) only separates minor branches; Q8 (attitude for dispositional) is underused but necessary.  

  ---

  ### **Scoring Key for Cases (Quiz)**  
  Use this to test consistency in student views. Each case has a "correct" answer pattern for the positions. Mismatches indicate incoherent commitments.  

  | Case | Rosenthal HOT | Dispositionalism | HOP | Self-representational | First-order |
  |------|---------------|------------------|-----|----------------------|------------|
  | **Absorbed athlete** (no thought about experience) | Not conscious | Conscious | Not conscious | Conscious | Conscious |
  | **Taxi driver** (autopilot, then notices gap) | Not conscious during gap | Conscious during gap | Not conscious during gap | Conscious during gap | Conscious during gap |
  | **Blindsight** (unreportable vision) | Not conscious | Not conscious | Not conscious | Not conscious | Not conscious (no access) |
  | **Dreamless sleep** | Not conscious | Not conscious | Not conscious | Not conscious | Not conscious |
  | **Finer-grained experience** (e.g., wine taster) | Problem (concepts too coarse) | Problem (concepts too coarse) | Less problem | No problem | No problem |
  | **Late monitor** (HO after stimulus gone) | Not conscious at time | Conscious at time (disposition) | Not conscious at time | Conscious at time | Conscious at time? |
  | **Swapped monitor** (HO of wrong modality) | Conscious of represented state | Conscious of represented state | Conscious of represented state | Conscious of actual state | Conscious of actual state |
  | **Doubled monitor** (contradictory HOs) | Two conscious states | One conscious state (disposition unifies) | Two conscious states | One conscious state | One conscious state |
  | **Rack case** (self-monitoring AI) | Conscious (if occurrent HO) | Conscious (if disposition) | Conscious (if perceptual HO) | Conscious (if self-rep) | Not conscious |

  **Flagged inconsistencies**:  
  - If a student says the **absorbed athlete** is conscious but the **rack case** isn’t: Matches *self-representational* or *first-order*, but not HO views.  
  - If they say **swapped monitor** makes you conscious of the *actual* state but **late monitor** wasn’t conscious at the time: Incoherent for HO theories (HO views require consistency on representation).  
  - If they say **doubled monitor** has one conscious state but **swapped monitor**’s represented state is conscious: Contradiction—both involve HO content.  

  **Key takeaway**: Q1 (occurrent) and Q2 (misfires) are the most divisive. If someone answers "No" to Q1 and "No" to Q7 (distinct state), they land in self-representational—a common clash point. The **rack case** separates HO views (which call it conscious) from first-order views (which don’t).  

  This tree and quiz should help your group navigate disagreements by revealing hidden assumptions. Print it single-sided on A4 for your session!
