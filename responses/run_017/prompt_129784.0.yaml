  Let's write the tree:

  **Decision Tree for Higher-Order Theories of Consciousness**

  Start at Q1.

  Q1: Is a mental state conscious in virtue of being represented by a higher-order state? 
     - Yes → Q2
     - No → Leaf A: First-order view (e.g., Tye, Dretske)

  Q2: Is the higher-order representation carried by a distinct state? 
     - Yes → Q3
     - No → Leaf B: Self-Representational view (e.g., Kriegel)

  Q3: Must the higher-order state be occurrent (currently present) for the first-order state to be conscious? 
     - Yes → Q4
     - No → Q7

  Q4: Must the higher-order state be arrived at non-inferentially? 
     - Yes → Q5
     - No → Leaf C: Unnamed (Occurrent, inferential HO view; unattractive, not held)

  Q5: What is the attitude of the higher-order state? 
     - Conceptual → Q6
     - Perceptual → Q6

  Q6: If the higher-order state represents a state that isn't there (misfire), is the represented state conscious? 
     - Yes → 
          - If conceptual: Leaf D: Rosenthal-style HOT
          - If perceptual: Leaf E: Higher-Order Perception (HOP) (e.g., Lycan)
     - No → 
          - If conceptual: Leaf F: Unnamed (Occurrent, non-inferential, conceptual, accuracy required; rare)
          - If perceptual: Leaf G: Unnamed (Occurrent, non-inferential, perceptual, accuracy required; rare)

  Q7: Is the higher-order state merely dispositional (available on demand), and if so, is it a disposition to form an occurrent higher-order state? 
     - Yes, it is a disposition to form an occurrent state → Q8
     - No, it is a disposition but not for an occurrent state → Leaf H: Unnamed (Dispositional, not for occurrent; collapses to first-order?)

  Q8: What would be the attitude of the occurrent higher-order state if formed? 
     - Conceptual → Leaf I: Dispositional HOT (e.g., Carruthers)
     - Perceptual → Leaf J: Unnamed (Dispositional HOP; unexplored)

  **Notes on Unnamed Leaves:**
  - Leaf C: Occurrent, inferential HO: Unattractive because inference is slow and indirect, not fitting the immediacy of consciousness.
  - Leaf F and G: Requiring accuracy is rare because it rules out misrepresentation cases (e.g., phantom pain) as unconscious, which are often taken as conscious even if illusory.
  - Leaf H: If the disposition is not for an occurrent state, it's unclear how it constitutes a higher-order representation; might reduce to first-order accessibility.
  - Leaf J: Dispositional HOP is not developed in the literature; most dispositional views are conceptual.

