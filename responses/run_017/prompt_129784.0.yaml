     - Self-representational: the state was self-representing at the time, so even if late, it was conscious then.

  7. Swapped monitor (HO state of wrong modality):
     - HO theories that allow misfires: the represented state is conscious, so if it represents a sound for a visual state, you are conscious of a sound, not of the visual state. But the visual state might be unconscious? Or both? Typically, only the represented state is conscious.
     - Self-representational: the state represents itself, so no swap.

  8. Doubled monitor (two HO states with contradictory contents for the same FO state):
     - HO theories: which one is conscious? Both? Then conflict. Rosenthal: the FO state is conscious if targeted by a HO state. If two, then both might be present, so you are conscious of two states? But there's only one FO state. So it's a misfire: one HO state is accurate, the other not? But then which one makes it conscious? It's problematic. Typically, HO theories might say you have two conscious states: one of the FO state and one of the non-existent state? But that's two states.

  9. Rack case (artificial system with self-monitoring):
     - Actualist: if it has occurrent HOTs, then yes.
     - Dispositional: if it has dispositions for HOTs, then yes.
     - HOP: if it has inner perception, yes.
     - Self-representational: if the states self-represent, yes.
     - First-order: probably not, because it's functional but not phenomenological.

  Now, for the quiz: the student answers for each case what they think (e.g., for absorbed athlete: conscious or not). Then we see which theory it matches.

  But also, we can flag combinations that are inconsistent. For example, if someone says for absorbed athlete: not conscious, and for rack case: conscious, that might point to actualism. If they say absorbed athlete is conscious and rack case is not, that might point to self-representational or first-order.

  But it's complex. We'll provide a short key.

