  Below is a decision tree structured to sort epistemological views on testimony by their reliance on source agency, using concrete cases to guide undergraduates. The tree has seven branch nodes (prioritising your specified questions) and eight leaves (five requested positions plus three additions for logical completeness). British spelling is used throughout.

  ---

  ### **Decision Tree: Theories of Testimonial Justification**

  #### **Branch Nodes**  
  *Each node uses a concrete case to frame a binary choice. Answer "Yes" (Y) or "No" (N) to progress.*  

  1. **Stranger Case**:  
     A stranger tells you the library closes at 6pm. You have no prior interaction with them.  
     *Must you have positive reasons (e.g., evidence of their reliability) to trust this specific claim?*  
     - **Y** → Go to Q2  
     - **N** → Go to Q3  

  2. **Book Case**:  
     You read an unverified fact in a textbook. The author had good evidence, but you don’t know what it was.  
     *Is your justification* inherited *from the author’s warrant (even if inaccessible to you)?*  
     - **Y** → Go to Q4  
     - **N** → Go to Q5  

  3. **Directions Case**:  
     A local guarantees, "I promise this shortcut is safe," while giving directions.  
     *Does their personal guarantee supply a reason* irreplaceable *by evidence of their reliability?*  
     - **Y** → Go to Q6  
     - **N** → Go to Q5  

  4. **LLM Case**:  
     An AI language model outputs a correct fact about climate science, with no human asserting or taking responsibility.  
     *Can this output provide testimonial justification?*  
     - **Y** → Leaf: **Non-Reductionism (Reid-Burge)**  
     - **N** → Leaf: **Inheritance-Only View**  

  5. **Crowd Case**:  
     Five barely credible sources (e.g., tabloids with 51% accuracy) independently report the same obscure event.  
     *Does convergence alone generate strong justification, even if individual sources are weak?*  
     - **Y** → Go to Q7  
     - **N** → Leaf: **Sceptical Local Reductionism**  

  6. **Liar Case**:  
     A colleague lies about a meeting time (they don’t believe it), but you have no reason to doubt them.  
     *Is your belief justified despite the speaker’s dishonesty?*  
     - **Y** → Leaf: **Assurance View**  
     - **N** → Leaf: **Reductionism with Assertion-Dependence**  

  7. **Environment Case**:  
     You hear a rumour in a highly reliable town (e.g., errors are swiftly corrected), but the speaker is unknown.  
     *Can your environment (e.g., social practices) generate justification, even without assessing the source?*  
     - **Y** → Leaf: **Default-and-Challenge View**  
     - **N** → Leaf: **Humean Global Reductionism**  

  ---

  #### **Leaves of the Tree**  
  *Positions mapped to the branch endpoints, with verdicts on key cases. Unoccupied cells marked as "Empty".*  

  | Leaf Position                     | Key Features                                                                 | LLM Case | Crowd Case | Liar Case |  
  |-----------------------------------|-----------------------------------------------------------------------------|----------|------------|-----------|  
  | **Non-Reductionism (Reid-Burge)** | Presumptive entitlement to trust; justification inherited from source.      | Y        | Y          | Y         |  
  | **Assurance View**                | Speaker’s responsibility supplies irreducible reason; agency central.       | N        | Y          | Y         |  
  | **Default-and-Challenge View**    | Acceptance is default; environment can generate justification.              | Y        | Y          | Y         |  
  | **Humean Global Reductionism**    | Justification reduces to observed regularities of testimony as a type.      | N        | Y          | N         |  
  | **Sceptical Local Reductionism**  | Positive reasons needed per source; convergence insufficient.               | N        | N          | N         |  
  | **Inheritance-Only View**         | Warrant must be inherited from source; no assertion → no justification.     | N        | N          | N         |  
  | **Reductionism with Assertion-Dependence** | Positive reasons required; assertion by agent is essential.        | N        | Y          | N         |  
  | **Empty Cell A**                  | *Incoherent: Inheritance without agency (Q4) clashes with Q2’s requirement for a warranted source.* | — | — | — |  
  | **Empty Cell B**                  | *Unattractive: Denies convergence (Q5) while rejecting inheritance (Q2), leaving no justification pathway.* | — | — | — |  

  ---

  #### **Notes**  
  1. **Unseparated Positions**:  
     - The tree *cannot distinguish* **Non-Reductionism** and **Default-and-Challenge** on the liar case (both say belief is justified). They are separated by Q2 (inheritance) and Q7 (environmental generation).  
     - **Humeanism** and **Reductionism with Assertion-Dependence** agree on the LLM case (N) but diverge on the liar case (Humeanism requires reliability, so lying defeats justification).  

  2. **Added Positions**:  
     - **Sceptical Local Reductionism**: Explores if local reductionism can demand such high standards that convergence fails.  
     - **Inheritance-Only View**: Tests if inheritance (Q2) *requires* agency (Q4).  
     - **Reductionism with Assertion-Dependence**: Hybrid of local reductionism and agency emphasis.  

  3. **Diagnostic Power of LLM Case**:  
     - Splits views that *require asserting agents* (Assurance, Assertion-Dependence) from those accepting non-agential sources (Non-Reductionism, Default-and-Challenge).  
     - Reveals if source warrant (Q2) is truly "inherited" or environmentally mediated (e.g., Reid-Burge accepts LLMs if functionally reliable).  

  4. **Empty Cells**:  
     - **Cell A (Q4-Y + Q2-Y)**: Incoherent, as inheritance requires a source with warrant, but Q4 denies agency (no asserter to "have" warrant).  
     - **Cell B (Q5-N + Q2-N)**: Unattractive, as it rejects both inheritance and convergence, paralysing justification.  

  This tree uses your cases (liar, crowd, LLM) to force distinctions based on agency-dependence, moving beyond textbook examples. It highlights unexplored areas (e.g., views accepting non-agent testimony while requiring inheritance) and clusters positions by their core commitments.
