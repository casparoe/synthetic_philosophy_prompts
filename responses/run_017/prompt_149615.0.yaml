answer: |-
  ### Diagnosis: Why the Verisimilitude Debate Stalled

  Your hypothesis—that the verisimilitude debate conflates three distinct jobs (retrospective judgment, theory ranking, and evidential indication) and hinges on a metaphysical disagreement about the objectivity of similarity structures—is substantially correct, but incomplete. It successfully diagnoses the *symptom* (framework-dependence stalemates) but underestimates the *disease*: a deeper conflation of semantic, epistemic, and metaphysical projects under a single formal umbrella. The impasse persists because no formal definition can simultaneously satisfy the demands of all three jobs, and proponents rarely clarify which job they aim to address.

  **Why your hypothesis is right:**  
  1. **Job Conflation:** The three tasks *are* distinct. Retrospective judgments (e.g., "Newton was closer to truth than Aristotle") require a stable, objective metric. Theory ranking needs tractable, context-sensitive criteria for choice. Evidential indication demands proxies for closeness (e.g., novel predictions) that need not define closeness itself. Forcing one formalism to do all three guarantees failure.  
  2. **Metaphysical Core:** The framework-dependence impasse *does* reduce to whether similarity structures (metrics, partitions) are discovered or imposed. Proponents of metrics (e.g., likeness approaches) implicitly assume a discoverable structure ("natural kinds," "objective resemblances"). Critics see partition choices as conventional or pragmatic. Crucially, *neither side can prove their metaphysical stance within the debate*, leading to deadlock.  
  3. **Object Misidentification:** You rightly note that verisimilitude is often misapplied to idealized models. A model’s *adequacy-for-purpose* (e.g., predictive precision in a domain) is distinct from a theory’s *truthlikeness*. Conflating them invites incoherence—e.g., a deliberately false model (e.g., ideal gas laws) might be "closer" for engineering but "farther" semantically.  

  **Where it falls short:**  
  1. **Epistemic Idleness is Overstated:** The "no way to tell" objection assumes verisimilitude must be *directly* measurable. But indirect evidence (e.g., success under de-idealization) *can* indicate progress without defining it. Your diagnosis neglects how likeness approaches *could* work for retrospective judgments *if* natural metrics exist.  
  2. **Missed Formal-Semantic Tension:** The collapse of consequence-based definitions wasn’t just about "jobs" but a *semantic* flaw: truthlikeness cannot supervene on truth/false consequence counts alone. Likeness fixes this by adding structure but then confronts the metaphysical question: *Which structure?* Your hypothesis doesn’t foreground this necessary trade-off.  
  3. **Underestimating Pragmatic Drift:** Many participants unconsciously shift jobs mid-debate. A proponent might defend a metric for theory choice (Job 2), then appeal to historical cases (Job 1) when pressed, muddying the dispute.  

  **Stronger Diagnosis: Conflating Projects**  
  The core issue is that verisimilitude frameworks conflate:  
  - **Semantic Project:** Define "closeness" extensionally (i.e., what *makes* one theory closer?).  
  - **Epistemic Project:** Identify *evidence* for closeness.  
  - **Metaphysical Project:** Establish if similarity is objective.  

  Each project demands distinct tools. Semantic definitions (e.g., Tichý’s) need formal rigor but face impossibility results without metaphysical grounding. Epistemic approaches (e.g., tracking problem-solving) avoid metrics but fail to define closeness. Metaphysical claims (e.g., natural properties) are untestable within the debate. The toy-universe stalemates arise when a semantic proposal (e.g., a metric) is tested against epistemic intuitions ("preposterous verdict!") or metaphysical ones ("gerrymandered partition!").  

  **Is the Question Ill-Posed?**  
  No—but it must be disambiguated. Verisimilitude captures a *real* intuition about scientific progress (e.g., Einstein improving on Newton). Abandoning it cedes ground to anti-realists. However, asking for a *universal, formal definition* that serves all jobs *is* ill-posed. Progress requires restricting the question: e.g., "What defines closeness *given* a contextually fixed partition?" or "What evidence indicates progress, regardless of definition?"  

  **Path Forward**  
  Progress would involve:  
  1. **Job Specification:** Explicitly state which task (retrospective, ranking, evidence) a proposal addresses.  
  2. **Domain Restriction:** Accept that verisimilitude applies only to theories with shared ontologies (e.g., not across paradigm shifts).  
  3. **Pragmatic Turn:** For theory choice, replace "closer to truth" with "more adequate for domain D under partition P."  
  4. **Formal-Epistemic Decoupling:** Develop evidence-based proxies (e.g., robustness, explanatory scope) without claiming they define truthlikeness.  

  The debate stalls because it demands a "Swiss Army knife" formalism. Recognizing the three jobs—and their incompatibility—explains the stalemate. But the deeper cure is disentangling semantics, epistemology, and metaphysics.  

  ---

  ### Diagnostic Summary Table

  | diagnosis | commitments_attributed | best_support | best_objection | discriminating_check | progress_if_true | verdict_and_confidence |
  |----------|------------------------|-------------|---------------|----------------------|------------------|------------------------|
  | **Job Conflation (Your Hypothesis)** | Proponents must treat verisimilitude as monolithic; critics must deny trade-offs between jobs. Strongest commitment: Framers of toy universes assume their intuition about "preposterousness" applies to all jobs equally. | Perfectly explains the stalemate: no resolution because no agreement on which job the metric should serve. | Fails to explain why *semantic* definitions (e.g., likeness) fail even for retrospective judgments. Ignores that some metrics (e.g., normalized Euclidean) work robustly in specific domains (e.g., thermodynamics). | Take a historical case (e.g., phlogiston vs. oxygen). Ask: Does the same metric that ranks theories retrospectively also guide past theory choice? If not, conflation is confirmed. | Progress: Disambiguating the three jobs; developing separate criteria for each. Not progress: New "universal" metrics. | **Does real work (70%)**. Explains dialectic but not semantic failures. |
  | **Metric Conventionalism** | Advocates must commit to metrics being context-dependent tools; opponents must insist metrics are objective. Strongest commitment: Likeness proponents must accept that no partition is "objectively correct" in adversarial examples. | Accounts for why re-description flips verdicts: metrics require arbitrary choices (e.g., weighting of variables). | Contradicts scientific practice—e.g., physicists assume mass/charge similarities are non-arbitrary. Doesn’t explain why some partitions (e.g., periodic table) feel "natural." | Redescribe a toy universe (e.g., color space) with two metrics: one Euclidean, one topology-based. If both seem intuitively valid in different contexts, conventionalism holds. | Progress: A theory of how context selects metrics. Not progress: Arguing over "best" metric simpliciter. | **Explains only a slice (60%)**. Key but partial. |
  | **Epistemic Idleness Dominance** | Realists must accept that verisimilitude is useless if epistemically inaccessible; anti-realists must deny any progress-to-truth link. Strongest commitment: Proponents cannot cite cases where verisimilitude was confirmed pre-falsification. | Explains why the debate feels sterile: if we can’t measure closeness, why define it? Aligns with pessimism from underdetermination. | Evidence *can* indicate closeness (e.g., Newton’s equations approximating relativity at low v). Ignores that scientists *act* as if theories get closer. | Identify a historical episode where verisimilitude was inferred from evidence (e.g., quantum corrections to classical mechanics). If successful, idleness is refuted. | Progress: Identifying reliable evidence for progress. Not progress: More refined metrics. | **Should be rejected (20%)**. Mistakes definition for access. |
  | **Semantic Impossibility** | All sides must agree that no consequence-based definition works. Strongest commitment: Critics must concede that likeness approaches avoid triviality. | The 1970s results show formal collapse without added structure—a brute constraint. | Likeness definitions *do* restore comparability (e.g., average distance to truth), proving the problem isn’t inherent to the concept. | Attempt to define closeness for two false theories using *only* true/false consequences. If it fails, semantic impossibility is confirmed. | Progress: Accepting likeness as necessary. Not progress: Reviving consequence-only approaches. | **Explains only a slice (90%)**. Necessary but insufficient. |
  | **Ill-Posed Question** | Proponents must admit no stable referent for "truthlikeness"; critics must assert its intuitive clarity. Strongest commitment: Realists cannot name a non-controversial case of increased verisimilitude. | Aligns with anti-realism: if "closer" is undefined or empty, progress is merely pragmatic. | Contradicts scientific discourse (e.g., "DNA structure is closer to truth than protein templates"). | Survey scientists: Is "getting closer to truth" meaningful? If yes, the question is valid. | Progress: Abandoning verisimilitude for pragmatism (e.g., problem-solving). Not progress: New definitions. | **Should be rejected (25%)**. Intuition is too robust. |
  | **Project Conflation (Recommended)** | Semanticists must admit epistemic/metaphysical assumptions; epistemologists must concede they aren’t defining closeness. Strongest commitment: Toy-universe critics must specify whether their objection is semantic (e.g., incoherence) or epistemic (e.g., inapplicability). | Explains *all* stalemates: impossibility (semantic), framework fights (metaphysical), idleness worries (epistemic). Predicts deadlock when projects cross. | Overly charitable—some participants *do* focus on one project (e.g., Oddie on semantics). | Analyze five key papers: Classify arguments as semantic/epistemic/metaphysical. If most mix projects, conflation is validated. | Progress: Clarifying projects; restricting scope (e.g., "semantics given natural kinds"). Not progress: Any project-agnostic formalism. | **Does real work (85%)**. Unifies symptoms; prescribes disambiguation. |
