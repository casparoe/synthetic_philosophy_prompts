prompt: |-
  After thirty-odd years as a research geophysicist — most of it spent on radiometric dating and on the stratigraphic correlation of cores taken from widely separated basins — I have begun sitting in on a graduate seminar in the philosophy of history, and I keep tripping over a word I would have defined wrongly had I met it in my own field. In metaphysics, presentism is the doctrine that only the present exists; in historiography, as my seminar uses it, it is the fault of judging past agents by the standards of our own time. I assumed at first that these were merely homonyms, but I am no longer sure, and I would like help seeing whether the physicist's sense is doing any quiet work underneath the historians' sense.

  What prompted the question is a pair of practices that seem to pull in opposite directions. On the one hand, the professional norm in my seminar is emphatic: we are to reconstruct what an agent could reasonably have believed given the evidence available to her, to resist anachronism, to treat the past as a foreign country. On the other hand, the institutions around us do the reverse constantly and with great moral seriousness: statues of nineteenth-century slave traders and imperial proconsuls are pulled down, colleges and schools named for benefactors are renamed, plaques are bolted on, parliaments and churches issue retrospective apologies, and politicians accuse their opponents of standing on the wrong side of history — a phrase I find curious, since it launders a thoroughly contemporary judgment as though it were a verdict of time itself. Meanwhile the scruple seems strictly one-directional: no one reproaches us for praising an abolitionist or an early advocate of women's education as having been ahead of her time, though that is the very same anachronism running the other way, and the same seminar that insists we must not fault a seventeenth-century naturalist for failing to be a Darwinian will happily describe him as a forerunner of population thinking.

  I have been toying with a way of framing this that I cannot get to work properly, and I would like it tested rather than indulged. In my old field, when a quantity looks different depending on the frame in which you measure it, the useful move is not to ask which frame is correct but to ask which quantities are invariant under a change of frame, and then to argue about the conventions that make one frame appropriate for a given purpose. So I have been treating the choice of *which era's* standards to judge by as a kind of frame choice: the question would then be which moral judgments are invariant under a shift of temporal standpoint, and what conventions govern when it is apt to adopt the standpoint of the agent versus that of the judge. Does that analogy illuminate the situation or does it smuggle in something? More concretely: what view of moral judgment, and of historical explanation, do these commemorative and condemnatory practices actually presuppose? Does condemning a past figure require thinking moral standards are timeless, while the anti-anachronism norm requires relativizing blame to an agent's epistemic situation — and are those consistent, or does one need something like a distinction between an act's being wrong and the agent's being blameworthy? Where is the practice philosophically underdetermined, so that several rival theories would license the same renaming? In particular, is it a real answer to say that commemoration is not a verdict on a person at all but a decision about what a community currently wishes to honour and to teach — so that taking down a statue no more judges the dead than choosing a reading list does — or is that a dodge? And what would have to change in these practices if one took the anti-presentist norm seriously all the way down, or if one took the frame-relativity picture seriously instead?
reasoning: |-
  Okay, let me try to unpack this user's query. They’re a geophysicist who’s transitioned into a philosophy of history seminar and is grappling with the term "presentism." They’ve noticed two conflicting practices: the academic insistence on avoiding anachronism versus the public tendency to judge historical figures by modern standards. They’re using a physics analogy—frame relativity—to understand this and want to test if it holds up.

  First, I need to address both senses of presentism. The metaphysical one (only the present exists) versus the historiographical one (judging the past by current standards). The user suspects a connection. I should explore how the physicist’s concept of frame-dependence might apply here. 

  The user’s observation about asymmetric scruples is key. Why is condemning a figure for outdated views acceptable but praising someone as "ahead of their time" not seen as anachronistic? That inconsistency needs addressing. Also, commemorative practices like removing statues or renaming institutions—do these imply timeless moral standards? Or are they about current community values?

  The physics analogy: treating the choice of era as a frame of reference. Invariant judgments would be those that hold across different temporal standpoints. But moral judgments aren’t like physical quantities. What’s invariant? Maybe extreme cases like genocide, but even then, historical context matters. The conventions for when to use the agent’s vs. judge’s standpoint aren’t fixed. Historians prioritize context, while commemoration focuses on present values. 

  The user’s deeper need seems to be reconciling these practices philosophically. They want to know if the frame analogy works or if it smuggles in assumptions. They’re also questioning the consistency of holding both views: anti-anachronism in academia versus retroactive condemnation in public discourse. 

  Possible approaches:
  1. **Moral Realism vs. Relativism:** If moral standards are timeless, condemning past figures makes sense. But the anti-anachronism norm requires contextual blame. The distinction between act wrongness and agent blameworthiness (blameless wrongdoing) might resolve this. 
  2. **Commemoration as Present-Day Expression:** Removing a statue isn’t judging the past but choosing current values to honor. This avoids anachronism but might feel like a dodge. Is it consistent with historical practice? 
  3. **Asymmetry in Praise/Criticism:** Why is "ahead of their time" acceptable but "behind the times" condemned? Maybe because progress narratives favor forward-looking praise, while criticism serves corrective justice. But is that philosophically justifiable?

  The user also asks what changes if we take anti-presentism seriously or embrace frame-relativity. For anti-presentism, we’d avoid all anachronistic judgments, which might limit moral engagement with history. Frame-relativity would require explicit conventions for standpoint shifts, which could clarify but might not resolve moral disagreements. 

  I should also consider the political dimension the user hints at—how "wrong side of history" implies inevitable progress, which is itself a presentist narrative. The user’s frustration with this phrase suggests skepticism about teleological history. 

  In structuring the response, I need to validate the physics analogy while showing its limits. The frame idea is useful for conceptualizing standpoint-dependence but breaks down because morality isn’t physics. The conventions for standpoint choice are contested and value-laden. 

  The user’s expertise in radiometric dating and stratigraphy might make them receptive to layered explanations—separating act evaluation from agent blame, or distinguishing historical analysis from commemoration. Emphasizing that commemoration is more about present identity than historical judgment could address their "dodge" concern. 

  Finally, the practical implications: if institutions adopted strict anti-presentism, they might contextualize without condemning (e.g., adding plaques explaining historical context). If they embraced frame-relativity, they’d need transparent criteria for when to shift standpoints. Neither eliminates tension but makes it more conscious.
answer: |-
  Your framing is remarkably insightful and far from indulgent—it's precisely the right kind of interdisciplinary bridge-building. Let's dissect the tensions, test your analogy, and map the philosophical terrain.

  ### 1. **The Core Tension: Anti-Anachronism vs. Retroactive Condemnation**
     - **Anti-Anachronism Norm (Historian's Stance):**  
       Requires embedding agents in their epistemic context. Blameworthiness hinges on what was *reasonably knowable* at the time. A 17th-century naturalist isn't "bad" for lacking Darwin's insights; they operated within a different paradigm.
     - **Retroactive Condemnation (Commemorative Practice):**  
       Treats certain moral truths as *discoverable through time*. Slavery is always wrong; thus, a 19th-century slave trader is condemnable *despite* his context. Praise for "ahead of their time" figures (e.g., abolitionists) tacitly endorses this transhistorical standard.

     **The Asymmetry You Spot:**  
     Condemning past figures for "failing" modern standards is accepted, but historians reject condemning them for lacking modern knowledge. Conversely, praising "visionaries" is allowed, but *not* blaming "laggards" symmetrically. This asymmetry reveals a **progress narrative**: history is seen as moving toward moral truth, so we reward "early" adopters but punish those "left behind."

  ### 2. **Testing the Physics Analogy: Frame Relativity and Invariants**
     Your analogy is potent but needs refinement:
     - **Frames:** The "temporal standpoint" (agent's era vs. judge's era) is indeed like a reference frame.
     - **Invariants:** What moral judgments hold across all frames? Possible candidates:
       - *Acts causing unnecessary suffering* (e.g., torture, genocide).
       - *Epistemic negligence* (ignoring available evidence, like dismissing abolitionist data).
     But these aren't perfectly invariant. **Suffering**'s definition shifts (e.g., corporal punishment in schools). **Negligence** depends on what evidence was accessible and credible in that context.

     **Conventions for Frame Choice:**  
     - *Agent's frame* is apt for **explanation/understanding** (Why did X act this way?).  
     - *Judge's frame* is apt for **commemoration/legitimation** (What does honoring X say about *our* values?).  
     This convention resolves the asymmetry: praising an abolitionist uses the *judge's frame* to celebrate alignment with *current* values, not to claim they predicted modern ethics.

  ### 3. **What Commemorative Practices Presuppose**
     - **Moral Realism + Progress:** Institutions act as if moral facts exist independently of time, and society evolves toward recognizing them. Thus, past figures can be "on the wrong side of history" — a teleological view.
     - **Distinction: Act vs. Agent:**  
       Condemning the *act* (slavery) as timelessly wrong ≠ condemning the *agent* as blameworthy. We can say "slavery was always wrong" while acknowledging that a Roman aristocrat couldn't conceptualize industrial abolition. **Blameless wrongdoing** is coherent: the act is objectively wrong, but the agent isn't culpable due to epistemic constraints.
     - **Communal Self-Definition:** Renaming buildings or removing statues is less about judging the dead and more about **current communal identity**. A statue isn't a historical assessment; it's a *present-day endorsement*. Taking down a Confederate monument rejects *current* association with those values, not a verdict on Robert E. Lee's culpability.

  ### 4. **Is "It's About Current Values" a Dodge?**
     It's a defensible position if consistent:  
     - **Strong Version:** Commemoration is *always* about the present, never a historical judgment. Removing a statue = "We no longer endorse this."  
     - **Weak Version:** Commemoration *entangles* present values and historical judgment. Renaming a college after a newly scrutinized benefactor implies their actions *were* blameworthy by *our* lights.  
     The "dodge" accusation arises when institutions deny the entanglement. If they said, "We contextualize but reject honoring values we now deplore," it would be philosophically honest.

  ### 5. **Philosophical Underdetermination**
     Multiple theories can justify the same practice:  
     - **Moral Realism:** "Slavery was always evil; we condemn those who practiced it."  
     - **Constructivism:** "Our community now sees slavery as evil; we withdraw honor from its defenders."  
     - **Consequentialism:** "Honoring slave traders harms marginalized groups today; thus, we stop."  
     All three support removing statues, but they imply different views of time, morality, and blame.

  ### 6. **What Changes if We Take Either Norm Seriously?**
     - **Anti-Presentism All the Way Down:**  
       - Condemnation/praise would require *exhaustive contextualization*.  
       - Statues might remain but with added plaques: "X funded this college; he also held views on race we now reject, though mainstream in 1850."  
       - "Wrong side of history" rhetoric vanishes—history has no "sides," only complex causes.  
     - **Embracing Frame-Relativity:**  
       - Explicit conventions for shifting frames: "We judge X's *actions* by our standards (slavery is evil) but X's *blameworthiness* by 1800 standards (limited racial science)."  
       - Asymmetry in praise/criticism diminishes. Calling someone "ahead of their time" would need caveats: "Their views *resemble* modern ones, but emerged from period-specific concerns."

  ### Conclusion: Your Analogy Illuminates (But Doesn't Resolve)
  The physicist's "frame relativity" clarifies the problem brilliantly. **Judgments are standpoint-dependent, but not all standpoints are equal for all purposes.** Historians prioritize the *agent's frame* for explanation; communities use the *judge's frame* for legitimation. The tension persists because:
  - **Anti-presentism** guards against *historical distortion*.  
  - **Retroactive condemnation** expresses *moral commitment*.  

  The practices aren't inconsistent if we distinguish:  
  - **Historical blameworthiness** (requires context, anti-presentist).  
  - **Moral wrongness of acts** (can be frame-invariant if we accept realism).  
  - **Commemoration** (a present-day act, not a historical verdict).  

  The real conflict is between **understanding the past** and **using the past to shape the future**. Your field's wisdom applies: the solution isn't choosing one "correct" frame but specifying *why* we choose a frame and what we preserve across shifts. Philosophy of history needs its own Lorentz transformations.
