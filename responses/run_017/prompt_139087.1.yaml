answer: |-
  Here is a set of desiderata for a theory of individual contribution to collective harm, built from your cases and constraints, with labels, cases, and critical annotations on bias and conflicts.

  **Core Purposes (Must Serve Both or Explain Why Not):**
  1.  **Action-Guidance Under Uncertainty (AGUU):** The theory must provide a clear, usable principle for an agent deciding *now* with the information realistically available *at the point of decision* (e.g., shopper seeing shelf counter = 34, or broken app; voter knowing polls; driver setting thermostat). It cannot require impossible calculations or inaccessible knowledge. (*Case: Wednesday shopper, voter in a large electorate.*)
  2.  **Retrospective Attribution for Assessment (RAA):** The theory must provide a basis for determining whether an individual act *was* wrongful, blameworthy, or grounds for owing compensation/apology *after the fact*, considering what actually transpired and what the agent knew or should have known. (*Case: Monday shopper who knowingly triggered re-order; Tuesday shopper whose purchase made no marginal difference.*)

  **Desiderata Arising from Causal Structure & Cases:**
  3.  **Threshold Sensitivity (TS):** The theory must distinguish cases where an individual act is (known to be) decisive for a harmful outcome (triggering the threshold) from cases where it is not. It must explain the heightened significance of the decisive act. (*Case: Monday shopper (decisive) vs. Tuesday shopper (non-decisive).*)
  4.  **Probability Sensitivity (PS):** The theory must appropriately account for situations involving risk or uncertainty about decisiveness, where an act has a non-zero (even small) probability of being decisive. It must not collapse probabilistic risk into certainty *or* irrelevance. (*Case: Wednesday shopper (1/60 chance); emissions with uncertain climate tipping points.*)
  5.  **Necessary-But-Insufficient Handling (NBI):** The theory must assign significance to acts that are necessary components of a jointly sufficient set but individually insufficient to cause the harm. It must explain why contributing to a harmful collective endeavor matters even if one's act alone changes nothing. (*Case: Button-pressing variant; single emission in a large pool.*)
  6.  **Non-Substitution Constraint (NSC):** The theory must not absolve an agent simply because someone else *would* have performed a substitutable harmful act if they hadn't. The focus must remain on the agent's *own* contribution/participation. (*Case: Shopper knows next shopper would buy the pack by Saturday.*)
  7.  **Grain-of-Action Invariance (GAI):** The theory's verdict on the moral status of an act (e.g., buying one pack of chicken) should not fundamentally change based solely on how we individuate the agent (individual vs. household) or the action (single purchase vs. annual consumption pattern), unless the re-individuation changes the *causal or participatory profile* relative to the harm. It must avoid arbitrariness in framing. (*Case: Individual purchase vs. household weekly shop vs. buyers' club order.*)
  8.  **Intermediate Variable Significance (IVS):** The theory must clarify whether and why making a difference to an *intermediate* variable (like the shelf counter moving from 34 to 33) matters morally, even if it doesn't immediately change the final harmful outcome (crate re-order). (*Case: Tuesday shopper reducing the counter.*)

  **General Theoretical Requirements:**
  9.  **Generalization Test Robustness (GTR):** The theory must pass the generalization test: if the principle exonerating (or condemning) an agent in a given scenario is sound, it must remain sound when applied consistently to *all* similarly situated agents. Crucially, the collective outcome of universal adoption of the principle must be morally acceptable or adequately explained. (*Case: If "no marginal difference" excuses all Tuesday shoppers, does the crate still get ordered? If "1/60 risk" excuses all Wednesday shoppers, what happens? Does the excuse hold over 40 years of similar acts?*)
  10. **Distinction Preservation (DP):** The theory must maintain clear and defensible distinctions between:
      *   Causal Contribution (physical/but-for difference-making)
      *   Wrongness (violation of a moral norm/duty)
      *   Culpability (fault, based on knowledge/intent)
      *   Blameworthiness (meriting censure/reproach)
      *   Remedial Obligation (duty to compensate/apologize)
      (*Case: A Tuesday shopper (causal?) might act wrongly (if participation is wrong) but with low culpability (if unaware) and perhaps low blameworthiness/remedial obligation.*)
  11. **Domain Uniformity with Structural Basis (DUSB):** The theory must apply the *same core principles* to structurally analogous collective harm problems (e.g., chicken consumption, carbon emissions, voting). Where it yields different verdicts (e.g., buying chicken vs. voting), this difference *must* be traceable to a *genuine structural difference* in the causal/predictive/participatory nature of the act or the harm (e.g., immediacy of harm, substitutability, clarity of threshold, nature of collective agency), not an ad hoc exception. (*Constraint: No gerrymandering for meat/emissions/votes.*)

  **Bias & Conflict Analysis:**

  *   **Marking Biases:**
      *   **TS (Threshold Sensitivity):** Genuine requirement (causal structure matters). *But* demanding it *always* dominate can be an "actual difference" camp bias, neglecting participation/wrongfulness in non-threshold cases.
      *   **PS (Probability Sensitivity):** Genuine requirement (agents face risk). *But* insistence on *precise* expected utility calculation reflects an *anti*-consequentialist bias; refusal to use *any* probabilistic framework reflects an *anti*-rationalist/risk-denial bias.
      *   **GTR (Generalization Test):** Genuine requirement (avoid collective absurdity). *But* insisting it *must* yield a demanding individual obligation can be a bias towards over-demandingness; using it primarily to *dissolve* individual obligations can be a bias towards permissiveness.
      *   **"Common Sense" Fidelity:** Prejudice of conservative/anti-theoretical camps. Philosophy often corrects common sense. Not a valid requirement.
      *   **"No EU Apparatus":** Prejudice of certain deontological/virtue ethics camps. Not a valid requirement if the structure involves risk (PS).

  *   **Identified Conflicts:**
      1.  **Precision vs. Guidance (TS/PS/NBI vs. AGUU):** Being exquisitely faithful to complex causal structures (TS, PS, NBI) often requires knowledge or calculations unavailable to the agent at the point of decision (violating AGUU). A theory perfect for RAA might be useless for AGUU, and vice-versa.
      2.  **Ignorance vs. Fanaticism (AGUU/PS vs. GTR/NSC):** Refusing to let agents profit from *culpable* ignorance is sound, but refusing to let *reasonable* epistemic limitations mitigate demands (AGUU, PS) risks demanding the impossible (fanaticism). Conversely, over-accommodating ignorance via NSC/GTR arguments can systematically undermine responsibility.
      3.  **Uniformity vs. Threshold Salience (DUSB vs. TS):** Insisting on strict domain uniformity (DUSB) might force downplaying the special moral significance of knowingly crossing a decisive threshold (TS), or conversely, over-emphasizing thresholds in domains (like voting) where they are inherently fuzzy or probabilistic.

  *   **Most Exclusionary Desideratum:** **Generalization Test Robustness (GTR)**. This is the killer for many popular approaches:
      *   **Pure Actual Difference:** Implodes in symmetric overdetermination (Tuesday shopper) – universal excuse leads to harm occurring with no responsible individuals.
      *   **Pure Expected Difference:** Can demand excessive caution for tiny risks (Wednesday shopper generalized) or struggle with necessary-but-insufficient cases (NBI) where individual expected harm is zero.
      *   **Simple Participation/Complicity:** Can struggle to explain why *not* participating when substitution occurs (NSC) isn't still "complicit" in a sense, or why the *degree* of contribution (TS, PS) doesn't matter for *some* assessments.
      *   **Character/Self-Corruption:** Risks being too permissive in one-off threshold cases (Monday shopper with "good character") and too demanding for trivial acts (GTR over time).
      *   **Distributed Collective Duty:** Faces severe problems specifying *how* the duty distributes in a way that satisfies TS, PS, and NSC without arbitrariness.

  **Brief Scorecard Against Desiderata (Focus on Core Challenges):**

  1.  **Expected Difference (EU):**
      *   **Strengths:** Naturally handles PS, AGUU (with reasonable estimates), GTR (avoids collective absurdity), DUSB (in principle).
      *   **Weaknesses:** Struggles severely with TS (non-decisive act has near-zero EU), NBI (EU~0), IVS (if intermediate change has no expected final impact). GTR can demand excessive caution for micro-risks. RAA problematic (blame based on outcome luck?).

  2.  **Complicity/Participation:**
      *   **Strengths:** Handles NBI, NSC (focuses on *your* participation), IVS (participating in the harmful system), GAI, DP (wrongness distinct from causation), RAA (participating in wrong).
      *   **Weaknesses:** Struggles with TS/PS (why is decisive act *more* significant?), AGUU (how to quantify/qualify participation risk?), GTR (can be too permissive if participation seems trivial). DUSB hard (is voting "participating" in harm like buying meat?).

  3.  **Character/Self-Corruption:**
      *   **Strengths:** Handles NBI, NSC, IVS, GAI, DP (focus on culpability/vice), AGUU (avoid vice).
      *   **Weaknesses:** Struggles most with TS (why is decisive act specially bad for character?), PS (tiny risk to character?), GTR (over 40 years, yes; for one act, weak), RAA (focuses on agent, not harm/victim), DUSB (character impact of vote vs. steak?).

  4.  **Distributed Collective Duty:**
      *   **Strengths:** Can potentially handle NBI, NSC, IVS, GAI, GTR (duty defined collectively).
      *   **Weaknesses:** Major struggles with TS (distributing equally ignores decisiveness?), PS (how to distribute duty under uncertainty?), AGUU (what's *my* fair share? How to calculate?), DP (confuses collective wrong with individual contribution).

  5.  **No-Difference Helping (Imperceptible Harms Still Wrong):**
      *   **Strengths:** Handles NBI, symmetric overdetermination (Tuesday), NSC, IVS, GTR (universal obligation avoids harm).
      *   **Weaknesses:** Severe struggles with TS (no special status for decisive act?), PS (risk irrelevant?), AGUU (demanding across all domains?), RAA (blame for imperceptible harm?), DUSB (requires uniform demandingness). Risks fanaticism.

  Use these desiderata as section headings to structure your evaluation of theories. The identified conflicts, especially between AGUU/RAA and the tension exposed by GTR, are likely the most fertile ground for your argument. Good luck!
