  ### Handling Your Verdicts and Edge Cases
  - **Matches all your verdicts except case 10**:  
    - Case 10 (steering difficult students) is ambiguous under this principle. If the intended quantity is "student learning," steering *might* corrupt by biasing evaluations (similar to case 7). If it's "efficiency in resource allocation," it might not. Since you're unsure, the principle reflects that ambiguity—it demands clarity on the intended quantity. I recommend **overturning no verdicts**; instead, clarify case 10's intended quantity.  
  - **Epistemic pair (8–9) handled**: Case 8 is exempt (transparent feedback enhances reliability); case 9 violates clause 2 (manipulation degrades reliability).  
  - **Sample selection (7 and 10) handled**: Both involve biasing information (clause 2), degrading alignment (clause 3).

  **Where it cannot sort cleanly**:  
  - Case 10, as above.  
  - Edge cases where "reliability" is subjective (e.g., "Is flattery manipulation if the principal enjoys it?"). The principle forces explicit definitions of "intended quantity" and "reliability."

