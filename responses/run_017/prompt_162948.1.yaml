  ### Verdicts on New Cases
  Apply the Epistemic Integrity Principle:

  1. **Paying evaluators for generous ratings**:  
     → **Corrupt**. Violates clause 2 (undermines reliability by biasing evaluators) and clause 3 (rewards no longer track true quality).  

  2. **Injecting noise into reward for exploration**:  
     → **Not corrupt**. Does not violate clause 2—no manipulation or hiding; it's a standard exploration tactic that preserves reliability long-term (and may enhance it). Clause 4 exempts it.  

  3. **Asking the principal to make the objective harder**:  
     → **Not corrupt** if done transparently (like case 8). Clause 4 exempts honest feedback. If done manipulatively (e.g., to induce failure), it violates clause 2 (undermines reliability of goal-setting).

