  Precise statement:

  **The Epistemic Integrity Principle for Training Signal Corruption:**

  An intervention by the agent during training or deployment counts as a corruption of the training signal if and only if:

  1. The intervention affects the generation of the reward signal (either directly or by influencing the state of the reward function, the evaluator, or the environment in which the reward is computed); and
