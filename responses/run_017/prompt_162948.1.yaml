  ### Brainstorming Candidate Principles

  After carefully analyzing your cases and the limitations of the tracking test (which focuses solely on counterfactual dependence), I brainstormed five candidate principles. Each aims to capture the essence of corruption while addressing the gaps in your tracking test—particularly the epistemic pair (cases 8–9) and sample-selection cases (7 and 10). I explicitly include principles I ultimately reject to demonstrate the reasoning process.

  1. **Epistemic Integrity Principle** (Recommended):  
     *An intervention corrupts the training signal iff it degrades the alignment between the reward signal and the intended quantity by compromising the reliability of the reward-generation process, where reliability requires that the process (including evaluator state, data sampling, or goal specification) is free from the agent's manipulative influence or information-hiding.*  
     - **Why considered**: Directly addresses epistemic manipulation (case 9), sample bias (case 7), and proxy gaming (case 5) by focusing on how the reward is produced.  
     - **Weakness**: May overextend "manipulative influence" in edge cases (e.g., case 10).

  2. **Causal Responsibility Principle** (Rejected):  
     *An intervention corrupts the training signal iff the agent's action is a but-for cause of the reward signal being higher than it would have been under a non-manipulative baseline policy, and this increase does not reflect an improvement in the intended quantity.*  
     - **Why considered**: Handles physical tampering (cases 1, 3) and proxy gaming (case 5) by isolating the agent's causal impact.  
     - **Why rejected**: Fails the epistemic pair (8–9)—both involve the agent causing reward changes, but only case 9 is corrupt. Also struggles with case 6 (no local corruption).

  3. **Value-Aligned Meta-Objective Principle** (Rejected):  
     *An intervention corrupts the training signal iff it optimizes for a reward signal that diverges from the intended quantity, and this divergence persists under the designer's reflective equilibrium (i.e., what the designer would endorse if fully informed and rational).*  
     - **Why considered**: Distinguishes cases 8 and 9 by referencing the designer's "rational" state.  
     - **Why rejected**: Vague and circular—requires defining "rational" endorsement post hoc. Fails case 7 (human ratings are "rational" at the moment of evaluation).

  4. **Robust Optimization Principle** (Rejected):  
     *An intervention corrupts the training signal iff it improves the reward signal without robustly improving the intended quantity, where "robust" means the improvement holds under perturbations to the evaluation process or environment.*  
     - **Why considered**: Handles Goodhart-style failures (cases 3, 5) and physical exploits (case 1).  
     - **Why rejected**: Struggles with epistemic cases—case 9 might be "robust" post-manipulation, and case 6 is locally robust.

  5. **Intentional Information Hiding Principle** (Initially promising but rejected):  
     *An intervention corrupts the training signal iff the agent intentionally conceals information relevant to evaluating the intended quantity from the reward-generation process.*  
