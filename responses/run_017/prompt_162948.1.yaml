  ### Final Recommendation
  The **Epistemic Integrity Principle** cleanly captures your verdicts by unifying sample bias, proxy gaming, and goal-manipulation under epistemic reliability. It advances beyond existing taxonomies by:
  - Ignoring physical intervention (addressing your case 4 recalibration example).  
  - Distinguishing honest vs. manipulative goal-change (cases 8–9).  
  - Explaining why local soundness doesn't imply global alignment (case 6).  

  **Trade-off**: It requires precise definitions of "intended quantity" and "reliability," but this is a strength—it forces designers to specify these upfront. Use this principle to audit reward functions for epistemic vulnerabilities (e.g., "Can the agent bias the evaluator or data source?").  

  If you adopt this, I recommend companion tools: (1) a checklist for clause 2 violations (e.g., "Does the agent hide information?"), and (2) a formalization of "reliability" using information theory (e.g., mutual information between reward and intended quantity). This turns philosophy into actionable ML design.
