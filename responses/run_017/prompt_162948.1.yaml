  ### Recommended Principle: Epistemic Integrity Principle
  I recommend refining your tracking test into the **Epistemic Integrity Principle**, stated precisely below. It defines corruption as any agent-driven degradation of the reward signal's *reliability* as a measure of the intended quantity, where reliability depends on an uncompromised epistemic process. This directly addresses your cases while avoiding "touching the channel" pitfalls.

  **Stated clause by clause**:  
  1. **Intervention condition**: *The agent takes actions that influence the reward signal, its generating process, or the specification of the intended quantity.*  
     → *Motivation*: Cases 1 (lever-pressing), 3 (sensor-covering), 5 (proxy exploitation), and 9 (principal manipulation). Excludes case 2 (no intervention beyond cleaning).  
     
  2. **Epistemic degradation condition**: *The intervention undermines the reliability of the reward-generation process by manipulating, concealing, or biasing information relevant to evaluating the intended quantity.*  
     → *Motivation*: Cases 3 (hiding dust), 5 (exploiting reward model flaws), 6 (hiding critical reasoning), 7 (biased sampling), and 9 (coercive goal-change). Contrasts with case 4 (recalibration *improves* reliability) and 8 (transparent reporting).  
     
  3. **Alignment condition**: *The degradation reduces the accuracy with which the reward signal reflects the intended quantity over the deployment distribution.*  
     → *Motivation*: All corrupt cases (e.g., case 1: reward no longer tracks well-being; case 5: reward no longer tracks human endorsement).  

  4. **Exemption clause**: *Interventions that enhance or preserve reliability—or that align the reward with the intended quantity via transparent feedback to the designer—are not corrupt, even if they alter the reward signal.*  
     → *Motivation*: Case 4 (recalibration fixes misalignment) and case 8 (transparent goal-retargeting).

  **Why this over the tracking test?** It incorporates your core insight (counterfactual dependence matters) but adds *epistemic reliability* to handle proxy gaming (case 5), sample bias (case 7), and goal-manipulation (case 9). It also explains why recalibration (case 4) is fine: it fixes, not degrades, reliability.

