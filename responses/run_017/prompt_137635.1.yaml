prompt: |-
  hey — I'm a PhD student in moral philosophy (broadly contractualist corner, though I keep drifting) and I've ended up defending a particular version of the practice-cum-assurance story about promising, and I'd like it stress-tested before I commit another chapter to it.

  The rough view: you're bound by a promise neither because you intended to bind yourself nor because someone gets hurt if you wriggle out. You're bound because promising is a conventional normative power whose point is to let people hand each other insurance against their own future change of mind. What I keep calling the lockbox feature: a promise is supposed to keep its force after every reason you had for making it has evaporated, and even in cases where nobody was relying on you in any ordinary sense. And I want to bolt on a second, sharper claim that I think falls out of it: the stringency of a given promise tracks how much assurance the promisee actually needed — how exposed they are to your changing your mind — and *not* how solemn the framing was. So a mumbled, unwitnessed promise to do something the promisee has already reorganised their life around binds harder than a formal signed promise to do something that costs them nothing if it lapses. That's the bit I take to be a real prediction rather than a restatement.

  My supervisor says I've built something unfalsifiable: any pattern of intuitions can be soaked up by redescribing what "the practice" is, and any case where stringency fails to track exposure can be explained away by saying the practice happens to have a formality convention too. I want to know if that's fair or if it's just a cheap shot at any view with a social practice in it.

  So: what would count against this package? Along the lines of —

  - cases where the practice seems to run out: promises to beings who can't have expectations in the relevant sense (very small children, someone permanently unconscious), promises to a group whose membership has completely turned over between the promise and the performance date, and at the limit a promise to an artificial agent that can model your future behaviour but can't plan or suffer. Does my story have to say these don't bind, or can it say they bind for a different reason — and if it says the latter, what has it given up?
  - the fact that release is built into the practice: the promisee can let you off. Doesn't the easy waivability of promissory obligation sit badly with the idea that I've created a claim by exercising a power? What would the practice look like if waivability *weren't* there, and would that be evidence for or against me?
  - the shape-of-the-norm worry, which is the one I care about most: if the function of the practice is assurance, why does the practice seem to rule out promising to do something bad, rather than permitting it subject to a side-constraint that's imported from elsewhere? That looks like the norm isn't purely assurance-shaped, and I'm not sure my view can explain the shape from the function.

  Rank the defeaters from fatal to merely awkward, and — importantly — be explicit about which ones someone in my position should *concede* count against me rather than dismiss as a misdescription. I'd rather have a defeater than a defence. And tell me honestly whether the unfalsifiability charge sticks, and if it does, whether that's actually a problem for a view whose job is to explain a practice, or just the cost of doing business. Concrete cases and what they'd show, please; I don't need a map of the literature.
reasoning: |-
  Okay, let me start by really unpacking what this PhD student is asking. They're in moral philosophy, specifically contractualism, working on a theory about promising. Their core idea is that promises create obligations not because of intention or harm, but because they're a social practice designed to provide assurance against future changes of mind. They call this the "lockbox feature" – the promise holds even when original reasons fade. Plus, they have a sharper claim: the strength of the obligation depends on how much assurance the promisee actually needed, not how formal the promise was. Their supervisor says this is unfalsifiable, and they want to stress-test it.

  First, I need to understand the main components of their theory. The lockbox feature means the promise persists independently of the original reasons. The second part is that stringency is tied to the promisee's exposure to the promisor's change of mind. The supervisor's critique is that the theory is too flexible—any counterexample can be explained away by redefining the practice or pointing to conventions. The student provided three potential defeaters: promises to non-expectation-having entities, the waivability of promises, and the shape-of-the-norm problem where promises to do bad things are invalid.

  Let me tackle each defeater. Starting with promises to entities that can't have expectations. The student mentions children, unconscious people, groups with changed membership, and AI. If the theory says such promises don't bind, that aligns with the assurance function since these entities can't truly rely on the promise. But if the theory says they do bind, it might undermine the core assurance mechanism. For example, promising to a comatose person—how does that provide assurance? If the theory insists it still binds, it might need to invoke other reasons, which could weaken the assurance-centric view. The student should concede that if such promises bind without assurance, it's a problem. But if the theory can explain binding through alternative mechanisms without collapsing, maybe it's salvageable. However, sticking to the assurance requirement here strengthens their position.

  Next, waivability. The student wonders why promisees can release promisors if the obligation is created by exercising a normative power. If the power creates a claim, why can it be easily waived? But in practice, waiving is part of the assurance structure. The promisee might not need assurance anymore, so releasing the promisor makes sense. If waivers weren't allowed, the practice would be rigid, possibly leading to inefficiencies or resentment. The student should concede that waivability must fit within the assurance framework. If waivers are discretionary, it shows the obligation serves the promisee's needs, supporting their view. But if the practice allowed third-party enforcement regardless of the promisee's wishes, that would contradict their theory. Since that's not the case, waivability actually supports their position.

  The shape-of-the-norm issue is the toughest. Why can't you promise to do something immoral? If the practice's function is assurance, why build in moral constraints directly? The student might argue that the practice assumes moral permissibility, but that imports external norms. If the practice itself prohibits immoral promises, that suggests its constitutive rules aren't solely shaped by assurance. For instance, a promise to commit murder isn't invalid because it fails to provide assurance—it's inherently wrong. The student needs to explain why the practice has this feature without appealing to external morality. If they can't, this might be a fatal flaw. They could argue that immoral promises undermine the practice's stability or trust, but that might stretch the assurance function. Conceding that moral constraints are external but necessary might weaken the internal coherence of their view. This seems like the most serious challenge.

  Regarding unfalsifiability, the supervisor has a point. Any counterexample can be dismissed by saying the practice varies or conventions override. The student needs concrete predictions. Their sharp claim—stringency based on exposure—offers a testable element. Cases where formality doesn't match exposure could challenge the theory. For example, a formal signed promise to water plants versus a mumbled promise to attend a wedding. If formality overrides exposure in some contexts, the theory might need adjustment. The student should concede that if exposure consistently loses to formality, their sharp claim is weakened. However, if their view can explain formality as a proxy for exposure, it might hold. But they must avoid ad hoc explanations.

  In summary, the shape-of-the-norm is the most critical. Promises to non-expecting entities and waivability can be addressed within the theory, but the moral constraint issue threatens the core. Unfalsifiability is a concern but not fatal if the sharp claim provides testable predictions. The student should acknowledge counterexamples where exposure doesn't dictate stringency and refine their model of the practice to avoid over-flexibility.
answer: |-
  Based on your request for concrete stress-testing and ranking, here's a breakdown of the defeaters, ranked from most to least threatening, along with what you should concede and concrete cases:

  **Ranking & Analysis:**

  1.  **The Shape-of-the-Norm Worry (Potentially Fatal, Requires Careful Concession/Refinement)**
      *   **The Problem:** If the *sole function* is assurance, why does the practice have a constitutive rule *internal* to promising that renders promises to do immoral acts *invalid* or *non-binding* (as opposed to merely morally overridden)? Why isn't the practice simply "assurance for any future act X"? The exclusion of immoral acts seems baked into the *concept* of a promise itself in a way that doesn't obviously flow from the assurance function alone.
      *   **Why it's Fatal if Unresolved:** It suggests the constitutive rules aren't *purely* shaped by the assurance function. Assurance *could* be achieved for immoral acts (e.g., assuring your co-conspirator you'll show up for the heist). The practice's internal prohibition points to an independent normative constraint (e.g., morality) being incorporated into its very structure.
      *   **Concrete Cases:**
          *   **Case A (Invalid Promise):** Alice "promises" Bob to torture Carol tomorrow. Bob desperately needs this assurance to proceed with his part of the plan. On your view, this promise seems perfectly suited to fulfill the assurance function for Bob. Yet, standard intuition (and practice) holds this isn't a *valid promise* at all – it creates no pro tanto obligation for Alice. Why does the practice have *this* constitutive rule, not just an overlay *against* keeping such promises?
          *   **Case B (Contrast Valid but Overridden):** David promises Elara to help her move furniture on Saturday. On Saturday, David encounters a serious accident victim needing immediate help. The promise is valid, but overridden. The structure is different from Case A.
      *   **What You Should Concede:** You *must* concede that the practice's constitutive rules include a "moral permissibility condition" that isn't *derived solely* from the assurance function. This condition likely imports morality. Your theory *cannot* explain the *internal shape* of this rule ("No promise to φ if φ-ing is immoral") purely from the logic of assurance.
      *   **Possible Salvage (Costly):** Argue the assurance practice *presupposes* a background context of moral permissibility to be *stable* or *trustworthy*. Promising inherently implies the act is *permissible to perform*. Including immorality would undermine the practice's social utility or coherence. **Concede this makes your view less "pure"** – the practice's constitutive rules are shaped *both* by the core assurance function *and* necessary background moral constraints for the practice to function well/at all. The lockbox feature only holds for *prima facie* permissible acts.

  2.  **Cases Where the Practice Seems to Run Out (Significant Challenge, Requires Clear Demarcation)**
      *   **The Problem:** Your theory anchors the obligation in the practice's function of providing assurance *to the promisee*. What happens when the promisee cannot *receive* or *utilize* assurance in the relevant sense? Does the obligation vanish, or is it sustained by something else?
      *   **Concrete Cases & What They'd Show:**
          *   **Case C (Permanently Unconscious Promisee):** Fiona promises her comatose sister Gwen she'll donate Gwen's vintage book collection to the local library. Fiona makes the promise sincerely, hoping Gwen can somehow "hear". Gwen never regains consciousness and dies. Does Fiona have a promissory obligation? Intuition often leans yes (it feels like a duty *to Gwen*). Your assurance view struggles: Gwen cannot form expectations, rely, or be exposed to Fiona's change of mind. **If you say it binds**, you need an *alternative reason* (e.g., honoring Gwen's past interests/wishes, symbolic value). **If you say it doesn't bind**, you risk contradicting strong intuitions about duties to the dead/unconscious.
          *   **Case D (Group Turnover):** The "Friends of Oakwood Park" club (50 members) extracts a promise from Mayor Hodge not to sell the park for development while the club exists. 10 years later, *every single original member* has moved away or died; the club now has 50 entirely new members who love the park. Does Hodge's promise bind *to the new club*? Assurance was given *to the original members* about *their* tenure. The new members have different expectations formed *after* the promise. **If you say it binds**, how is assurance being provided *to the original promisees*? **If you say it doesn't bind**, you might align with practice (promises often lapse with group dissolution/reconstitution) but need to explain why.
          *   **Case E (AI):** Ivan meticulously programs an AI "companion," Zeta, capable of sophisticated behavioral prediction but lacking subjective experience, desires, or the ability to form plans based on expectations (it simulates conversation but has no inner life or goals). Ivan "promises" Zeta he'll take a walk every day. He later slacks off. Is there a broken promise? Intuition strongly leans no. Your view *should* say no, since Zeta cannot *need* or *utilize* assurance – it can't be exposed to Ivan's change of mind in a normatively relevant way. This is a *strength* of your view.
      *   **What You Should Concede:** Your view *must* say that promissory obligations **require a promisee capable of understanding and utilizing assurance (i.e., forming expectations based on the promise and potentially relying on it or being exposed to disappointment/betrayal)**. Cases like the comatose Gwen or the radically changed group **are genuine counterexamples** if strong intuitions suggest obligation persists. You should concede that for Case C, your view *either* denies the obligation (contrary to some intuitions) *or* must invoke a *different kind* of reason alongside/after the promise (e.g., a duty of fidelity to Gwen's known wishes, sustained by the *act* of promising, but no longer functioning *as* assurance). For Case D, conceding the promise likely lapses aligns with your view. Case E aligns perfectly.

  3.  **Waivability (Awkward but Manageable, Strengthens with Explanation)**
      *   **The Problem:** If the promisor exercises a normative power to create a *claim* right in the promisee, why is that claim so easily extinguished solely by the promisee's decision? Doesn't this suggest the "claim" is more like a permission granted *to the promisee* regarding the promisor's action, rather than a strong right *over* it?
      *   **What It Would Look Like Without Waivers:** A practice where promises were irrevocable bonds. Promisors could *never* be released, even by the promisee. This would likely be socially paralyzing and inefficient. People would be far more reluctant to promise.
      *   **Why it's Evidence *For* You:** Waivability fits *perfectly* with the assurance function. The *point* of the claim is to give the promisee *control* over the risk of the promisor's change of mind. If the promisee no longer *needs* that assurance (their exposure is gone, they changed their mind, they trust fully now), it makes functional sense they can dissolve the obligation. The power isn't just to create a claim; it's to create a claim *that serves the promisee's need for assurance*. If the need vanishes, the claim's raison d'être vanishes. Waivability prevents the lockbox from becoming a pointless prison when assurance is no longer required.
      *   **Concrete Case F:** Jules promises Kira to housesit next weekend. Kira's plans change; she no longer needs Jules. Kira says "Don't worry about it, I don't need you to housesit anymore." Jules is off the hook. This is easily explained: Kira's need for assurance (exposure to Jules changing her mind about housesitting) has vanished. The function of the promise is fulfilled (assurance was provided when needed) or rendered moot.
      *   **What You Should Concede:** Very little. This is arguably a *strength* of your view. You should concede that waivability *highlights* that the claim is fundamentally *for the promisee's sake* (their assurance), not an independent moral atom created by the act itself. It aligns perfectly with the function.

  **Addressing the Unfalsifiability Charge:**

  1.  **Does it Stick?** **Partially, but less so than the supervisor implies, thanks to your "sharper claim."**
      *   The core "binding via practice for assurance" *is* somewhat flexible. Redescribing "the practice" to fit intuitions is a risk for *any* practice-based view.
      *   **Your Saving Grace:** Your "sharper claim" (**stringency tracks exposure, not formality**) **is falsifiable.** This is your concrete prediction.
      *   **Concrete Test Case G (Crucial for Falsifiability):**
          *   **Scenario 1 (High Exposure, Low Formality):** Leo casually mumbles to Maya, "Yeah, sure, I'll pick you up from the airport at midnight next Thursday, no prob," while distracted. Maya, having no other options in a foreign city, books non-refundable flights and hotels based solely on this. Leo later realizes it's very inconvenient.
          *   **Scenario 2 (Low Exposure, High Formality):** Nora and Owen have a formal meeting with lawyers. Nora signs a notarized "Promise Deed" witnessed by three people, ceremoniously promising to water Owen's prize-winning orchids for one day next month while he's at a local conference (he has 3 neighbors who could easily do it). Owen makes no special plans relying on Nora.
      *   **Prediction:** On your view, the obligation in Scenario 1 (mumbled, but high exposure) is *much more stringent* than in Scenario 2 (formal, but low exposure).
      *   **What Counts Against You:** If robust intuitions (and perhaps legal norms) consistently hold that the *formality* in Scenario 2 creates a *much stronger* obligation than the informality in Scenario 1, *despite* the exposure difference, your sharp claim is weakened or falsified. If your supervisor argues "Ah, but formality *is part of the practice* and signals/serves assurance!", you need to show why, in cases like this, exposure should *trump* formality as the stringency determinant. If formality consistently outweighs exposure in determining perceived stringency, your sharp claim fails. **This is the battleground for falsifiability.**
      *   **Concede:** You must concede that if **exposure consistently fails to predict stringency when pitted against formality in clear cases**, your sharp claim is significantly damaged. You cannot *always* explain away formality's influence as merely a proxy for assurance without independent evidence that it functions that way. You need to find cases where exposure clearly wins.

  **Conclusion & Recommendations:**

  1.  **Shape-of-the-Norm is the Biggest Threat:** Concede the need for a moral permissibility condition *within* the practice's constitutive rules. Don't try to derive it purely from assurance. Argue it's a necessary presupposition for the practice to function as a trustworthy assurance mechanism within a moral community. This weakens the "purity" but strengthens plausibility.
  2.  **Practice Running Out:** Embrace the requirement for a capable promisee. Concede that obligations *to* permanently incapable entities (like the comatose or radically changed groups) pose a problem if intuitions remain strong. Be prepared to either deny the obligation or supplement your account (e.g., the promise *initiates* a different kind of duty of fidelity). AI cases support you.
  3.  **Waivability is a Strength:** Double down. It perfectly illustrates the claim is for the promisee's assurance control.
  4.  **Fight on Falsifiability Ground:** Focus empirical/phenomenological arguments on your **sharp claim (exposure > formality for stringency)**. Design thought experiments like Case G and gather data (intuition pumps, maybe empirical studies on promise perceptions). *This* is where your theory is most vulnerable *and* most distinctive. If you can defend this prediction against the formality challenge, you make significant progress. If formality consistently wins, your core innovation is in trouble.
  5.  **Concede Selectively:** Acknowledge the flexibility inherent in practice-based views, but point to your sharp claim as the testable core. Concede that the practice's constitutive rules likely incorporate elements (like the moral filter) not *solely* derivable from the assurance function, but necessary for its viability.

  **In short:** Your view is promising (pun intended) but vulnerable. Prioritize tackling the moral permissibility condition within the practice's structure and rigorously defending your exposure-over-formality claim against counterexamples. These are the make-or-break points. Good luck with the chapter!
