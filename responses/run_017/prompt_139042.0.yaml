prompt: |-
  In my comparative-politics class we have been arguing about performance legitimacy — roughly, the idea that a government which reliably delivers order and rising incomes may earn a claim to rule even without free elections — and I cannot work out what rule our teacher is actually applying. Her verdicts so far: the large East Asian one-party state with decades of growth and very low violent crime, legitimate; the small, very rich city-state that holds real but constrained elections and tightly restricts speech, legitimate; the junta in a resource-poor country that ended an insurgency, stabilized prices and handed power back after eight years, legitimate for the time it ruled; the mineral-exporting democracy with free elections where the boom money vanished into corruption and street crime rose, not legitimate; the Gulf monarchy that is rich and safe but has never held national elections, not legitimate, on the grounds that its prosperity was a windfall it never had to govern for. The case I have to brief is one I invented: a country of nine million that discovered enormous offshore gas reserves twenty years ago and has been ruled since by a single party with no national elections; incomes have tripled, violent crime and corruption are both low, most of the revenue went into a sovereign wealth fund plus working ports and schools, and when gas prices collapsed five years ago the government avoided a recession by drawing on the fund and raising taxes with little protest; opposition parties are banned and the press is censored, but there is no torture, people may emigrate and few do, and anonymous independent surveys put approval near seventy percent. Does she call this government legitimate? I would rather have the reasoning than the bare answer: give me the two or three rules that fit all five of her earlier verdicts, say what each predicts about my invented case, tell me which one you think she is really running and why, and propose one further case I could put to her that would most sharply separate the rules you leave standing. Please also say how confident you are in each part — especially the prediction — and flag the single step you are least sure of.
reasoning: |-
  Okay, the user is in a comparative politics class debating performance legitimacy and needs help decoding their professor's implicit rules. They've described five existing verdicts and one invented case. 

  First, let's unpack the professor's pattern. All her legitimate cases (China, Singapore, temporary junta) share sustained crisis-solving through active governance, while the rejected ones (corrupt democracy, Gulf monarchy) failed that test. The key seems to be whether prosperity was earned through governance rather than luck or theft. 

  For the invented gas-rich autocracy: it passes the crisis test (managed price collapse) and built institutions (sovereign fund), but lacks governance innovation beyond resource management. High approval ratings might compensate, but the professor seems to value tangible policy over popularity. 

  The trickiest part is predicting her call on this case - I'm only 70% confident she'd deem it legitimate because while it meets her core criteria, the lack of diversification or visible innovation could make it feel closer to the Gulf monarchy case. 

  To really test her framework, I'd propose a hypothetical: a democratic country that achieves nothing except holding elections. If she rejects it (as I suspect), that confirms her standard is governance output, not procedures. That contrast would expose whether elections alone satisfy her or if performance is truly the cornerstone.
answer: |-
  Here’s the breakdown of your professor’s implicit rules, the prediction for your case, and a strategy to test her framework:

  ### Core Rules Explaining All Five Verdicts:
  1. **The Governance-Through-Adversity Rule**  
     *Legitimacy requires demonstrable governing competence in overcoming significant challenges (not windfalls).*  
     - **East Asia**: Sustained growth/crime control in a complex society = earned legitimacy.  
     - **City-State**: Constrained but functional governance delivering prosperity/stability = legitimate.  
     - **Junta**: Ended insurgency/stabilized economy *despite* crisis = temporarily legitimate.  
     - **Mineral Democracy**: Failed to convert resources into broad welfare *amid challenges* = illegitimate.  
     - **Gulf Monarchy**: Stability derived from passive resource wealth, not governance = illegitimate.  

  2. **The Institutionalization Rule**  
     *Revenue must be transformed into enduring public goods/institutions, not ephemeral consumption.*  
     - **East Asia/City-State/Junta**: Built infrastructure, diversified economies, or created stability institutions.  
     - **Mineral Democracy**: Revenue *vanished* (no institutional legacy).  
     - **Gulf Monarchy**: Wealth distributed but not institutionalized (no SWF/tax system cited).  

  ---

  ### Prediction for Your Invented Case:
  - **Governance-Through-Adversity**: **YES** (⭕️ High Confidence)  
    Overcame gas price crash via SWF drawdown/tax hikes – *active crisis management*, unlike passive Gulf monarchy.  
  - **Institutionalization**: **YES** (⭕️ Medium-High Confidence)  
    SWF, ports, schools show long-term institution-building; low corruption implies effective systems.  
  - **Net Verdict**: **Legitimate** (✅ ~70% Confidence)  
    *Why?* It mirrors Singapore (constrained politics + performance) but adds crisis-response. The Gulf monarchy rejection suggests resource wealth alone isn’t disqualifying if *actively governed*.  

  **Least Confident Step**: Whether 70% approval in *censored* surveys sways her. Her prior cases ignore popularity (e.g., Gulf monarchy likely had high approval). I suspect she discounts it without free expression.  

  ---

  ### The Rule She’s *Really* Running:  
  **"Performance Legitimacy = Governing Complex Challenges"**  
  - *Why?* Her rejections hinge on *governance voids*:  
    - Mineral Democracy: Failed to govern corruption/crime.  
    - Gulf Monarchy: No "challenge" overcome (wealth was passive).  
  - *Not* about regime type (junta was OK) or raw outcomes (Gulf had outcomes but no "effort").  

  ---

  ### Sharp Test Case to Separate Rules:  
  **"A poor, unstable democracy with free elections and uncensored press that has achieved no economic growth, high crime, and failing schools for 20 years – but where lively debate blames successive elected governments."**  
  - **Governance-Through-Adversity Rule**: ❌ Illegitimate (failed to solve crises).  
  - **Proceduralist Rule** (if she secretly values elections): ✅ Legitimate (due process followed).  
  - *Why it separates?* Her past verdicts don’t address *pure proceduralism without performance*. If she calls this "legitimate," she values process over outcomes. If "illegitimate," she’s truly performance-centric.  

  ### Confidence Summary:  
  | **Component**               | Confidence | Why Uncertainty?                          |  
  |-----------------------------|------------|------------------------------------------|  
  | **Governance Rule Fit**     | 95%        | All cases align perfectly.               |  
  | **Institutionalization Fit**| 85%        | Gulf rejection implies it’s necessary.   |  
  | **Invented Case Prediction**| 70%        | Surveys/censorship muddy the waters.     |  
  | **Test Case Design**        | 90%        | Isolates procedural vs. performance clash.|  

  **Key Insight**: Your professor treats legitimacy as an *earned contract* – not "what you have" but "what you do with it." Your gas-state case likely passes because it *governed* its windfall into resilience.
