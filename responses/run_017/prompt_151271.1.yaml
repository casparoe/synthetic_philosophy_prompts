prompt: |-
  I'm assembling cases for a seminar on whether a theory of rationality can be indirectly self-defeating — whether it can require an agent to be, by its own lights, irrational. Parfit's hitchhiker is the standard illustration: a benefit up front, a cost to be paid later, no way to bind yourself, and a counterparty who is only a fallible reader of character. Every version I have tried lets the agent escape by an easy route, so I want a new case built to order under constraints that close those routes.

  Take the theory under discussion to be a self-interested theory of rationality, S, on which an act is rational exactly if it maximises the agent's own well-being. Construct an ordinary-life case — one paragraph, nothing science-fictional, no contracts or courts, no repeat-play reputation, no drugs or neurotechnology, no near-perfect predictor — in which each of the following holds, and in which none of them holds merely because you stipulated it:

  1. At the later node, performing costs the agent more than any further benefit she could get from it, and S's verdict there is unambiguous: performing is irrational.
  2. Ex ante, rationality on S's own terms recommends becoming the sort of person who performs, so S recommends acquiring a state that will later move the agent to act against the balance of reasons as S then measures them.
  3. The acquired state contains no false belief and no self-deception: at the later node the agent sizes the situation up correctly, judges that she has most reason not to perform, and performs anyway. What she acquires is therefore a non-reason-responsive disposition — akrasia engineered in advance — and not a mistake about how the world is; and it must not be the kind of state she can dismantle by a further rational decision at that node.
  4. The counterparty can tell, by ordinary human judgment and without being misled about what the agent is really like, that she has this disposition, and can rely on it. Nothing in the case turns on the counterparty being fooled.

  Then show that the case does what I asked. Say what the sophisticated chooser does at each node and why, state what the ex ante choice is and why it is the rational one by S's own standard, and then say what a resolute-choice or planning view — the view on which rationality consists in holding to a plan adopted earlier rather than in re-deciding at each node — says about the same case, and whether it gets the agent to perform without any irrationality at all. I also want the honest audit: which single feature of the case is carrying the weight, what the case degenerates into if that feature is removed, and how someone who holds that the hitchhiker needs no irrationality would attack it — the place where the attack actually bites, not a straw version of it.

  Response in five titled sections, in this order: The case (~150 words); Why the easy routes are closed (~100 words); What each view says (~250 words); What is doing the work (~120 words); The strongest objection (~120 words).
reasoning: |-
  Hmm, the user is assembling cases for a seminar on whether a theory of rationality can be self-defeating. They want a new case that closes the easy escape routes present in standard versions like Parfit's hitchhiker. The constraints are strict: no sci-fi elements, no contracts or courts, no reputation effects, no predictors, etc. The case must show how a self-interested theory (S) requires becoming irrational by its own later standards.

  I need to construct an ordinary-life scenario where:
  1) At the later node, performing the action is clearly irrational by S's standards
  2) Ex ante, S recommends developing a disposition to perform that irrational action
  3) The disposition involves clear-eyed akrasia (acting against one's better judgment) without false beliefs
  4) The counterparty can reliably detect this disposition through ordinary means

  For the disposition, I consider chronic conditions like severe arthritis that create an irreversible physical constraint. The counterparty needs to observe something verifiable - perhaps a visible symptom that correlates with the disposition. The benefit must be upfront and substantial enough to outweigh the later cost. 

  The case structure could be:
  - Ex ante choice: Undergo risky medical treatment for chronic pain
  - Disposition acquired: Permanent hand tremor if treatment fails
  - Later node: Opportunity to betray a secret that would harm others but benefit the agent
  - The tremor makes concealment impossible, forcing honesty
  - But by S's standards at that point, betrayal would be beneficial

  This satisfies:
  1) At betrayal moment, S says betray (maximizes benefit)
  2) Ex ante, treatment is rational (relief from pain > risk of tremor)
  3) Tremor is physical constraint - no false belief, can't be willed away
  4) Counterparty sees tremor as guarantee of honesty

  For the sections:
  - The Case: Describe medical treatment -> tremor development -> betrayal opportunity
  - Why Easy Routes Closed: No reversibility, no deception, physical manifestation
  - What Each View Says: 
     - S: Rational to get treatment, irrational to be honest later
     - Resolute: Could plan to be honest and stick to it rationally
  - What's Doing the Work: The irreversible physical symptom as credible commitment device
  - Strongest Objection: Distinguishing physical constraint from intentional action - is it really akrasia?

  The strongest attack would challenge whether physical inability constitutes "acting against reasons" rather than mere inability. But the case requires performing the action (honesty) despite judging betrayal better - which the tremor forces, but the agent still cognitively chooses honesty while believing it wrong. That maintains the akratic element.
answer: |-
  ### The Case
  Dr. Aris suffers chronic hand pain impairing her surgery career. A one-time experimental nerve treatment offers permanent pain relief but risks irreversible hand tremor (20% chance). Success means restored earnings; tremor means she can't perform delicate surgeries. Aris rationally chooses treatment: expected benefit ($1M lifetime gain) outweighs cost risk ($500k loss if tremor occurs). The treatment fails, causing tremor. Later, a colleague offers Aris $200k to falsify data in a study, which would harm patients but benefit her. Concealing the fraud requires steady hands to manipulate digital records. Her tremor makes deception physically impossible; she must refuse honestly. She correctly sees that accepting maximizes her welfare (net $200k gain vs. $0), yet she refuses.

  ### Why the Easy Routes Are Closed
  No reneging: The tremor is permanent, not a reversible choice or belief. No deception: The colleague sees her tremor (shaky hands during coffee), knows it prevents subtle deception, and trusts her honesty *because* of this constraint. No overriding: Aris can't rationally "decide" to steady her hands; it's a physical disability. No prediction paradox: The colleague infers incapacity from visible evidence, not mind-reading. No reputation: This is a one-off interaction with no future stakes.

  ### What Each View Says
  **Self-Interested Theory (S):**  
  - *Ex ante:* Treatment is rational. It maximizes expected well-being (80% chance of $1M gain vs. 20% risk of $500k loss; net expected +$700k).  
  - *Later node:* Refusing the bribe is irrational. She loses $200k for no gain, with no future consequences. S demands she accept, but she physically cannot.  
  - *Verdict:* S recommends a state (tremor) that causes later irrationality by S’s lights. Indirectly self-defeating.  

  **Resolute-Choice/Planning View:**  
  - *Ex ante:* Same as S—rationally plans treatment for net benefit.  
  - *Later node:* Sticking to her *ex ante* plan (to maintain integrity for career/self-respect) is rational, even if S’s myopic calculation favors betrayal. Her refusal isn’t akratic but fidelity to a rational prior commitment.  
  - *Verdict:* She performs (refuses) without irrationality. The tremor isn’t essential; resolute agents would refuse even without it.  

  ### What Is Doing the Work
  The **physical irreversibility of the tremor** carries the weight. It makes the disposition (inability to deceive) immune to later rational override, observable without deception, and costly enough to incentivize ex ante acquisition. Remove this, and the case degenerates into standard Hitchhiker: if the "disposition" were revocable (e.g., a vow), S would advise revoking it later, escaping self-defeat. Here, the tremor forces clear-eyed akrasia—she knows refusing is welfare-suboptimal but can’t choose otherwise.

  ### The Strongest Objection  
  **The attack:** This isn’t true akrasia but *compulsion*; Aris doesn’t "act" against her judgment—she is *unable* to act. S only governs intentional actions, not physical constraints. Thus, at the later node, she isn’t irrational; she merely lacks an option. The self-defeat vanishes: S never recommends "irrationality," just a state limiting future options.  
  **Biting point:** This forces the case to rely on conflating inability with irrational choice. A defender must argue that her *refusal* (an intentional act) flows from the tremor and is still evaluable under S, but the objection highlights a fragility in modeling "dispositions" as non-agential.
