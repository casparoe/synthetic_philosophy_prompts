  Okay, the user is a novelist working on a book that alternates between the British sack of Benin City in 1897 and the present-day locations of the looted objects in Western museums. They've encountered a recurring argumentative pattern in their research about why these objects shouldn't be repatriated, and they need help identifying and defining this conceptual shape.

  The core pattern they're observing has two interconnected parts: First, institutions opportunistically switch between claims of continuity and rupture depending on what serves their retention argument. They'll say an object has gained new meaning and relevance through museum display (continuity) while simultaneously arguing its original context is irrecoverable (rupture). Second, there's the self-perpetuating nature of the damage - the more thoroughly an object was severed from its origins, the stronger the claim becomes that it can't return. 

  This isn't simple hypocrisy because both claims can be partially true about different aspects of the object. It's not motte-and-bailey because neither claim is a fallback position. Legal concepts like adverse possession don't quite fit because they rely on passive time lapse, whereas here the institution actively benefits from the damage they caused. Philosophical arguments about superseding historic wrongs also don't apply because those address independent contextual changes.

  The user needs this conceptualized for a novel scene where a curator debates a claimant. They specifically don't want citations - they need the pure conceptual structure to write authentically. Their unanswered questions probe boundary cases: what if context vanished naturally? What if the current holder isn't the original looter? What if diaspora communities are divided about repatriation? What if the object's primary value is as evidence of its own theft?

  This requires synthesizing a precise conceptual framework that can withstand narrative pressure. The solution should name the phenomenon, define its mechanism, distinguish it from similar concepts, and map its boundaries through those test cases. The novelist needs this not as academic theory but as a tool for character construction - they must understand the curator's argument well enough to present it compellingly before undermining it.
answer: |-
  This phenomenon is a single, coherent structure I'll call **Self-Accelerating Expropriation** (SAE). Its core mechanism is the **instrumental dialectic of destruction and creation**, where the act of removal simultaneously *destroys the original context* and *creates a new, institutionally validated "life"*, and both outcomes are then leveraged to justify permanent retention.

  Here’s the anatomy of SAE:

  1.  **The Dual Leverage:**
      *   **Continuity Claim:** The removal is framed as an act of *creation* – bestowing a "second life" (museum display, scholarship, global audience, universal heritage).
      *   **Rupture Claim:** The removal is framed as an act of *irreversible destruction* – severing the object from its original function, community, and context, rendering return "meaningless."
      *   **Instrumentality:** These claims are not contradictory but *complementary tools*. The holder *switches* between them opportunistically to counter specific arguments for return. The rupture justifies *why return is impossible*; the continuity justifies *why retention is valuable*.

  2.  **The Self-Accelerating Injury:**
      *   **The Core Mechanism:** The *severity* of the initial act of removal (destruction of context, disruption of community, dispersal of related objects) is not merely a consequence; it becomes the *primary evidence* for why restitution is impractical or undesirable. **The worse the expropriation, the stronger the retention argument becomes.**
      *   **The Feedback Loop:** The act of removal *manufactures the conditions* (rupture) that are then cited as the reason *not to reverse* the act. The passage of time under the holder's control *enhances* the continuity claim (more scholarship, more viewers) while *deepening* the rupture claim (greater distance from the original context). The injury *generates its own justification*.

  3.  **Distinctiveness:**
      *   **Not Hypocrisy:** Both claims can hold partial truth simultaneously about different *dimensions* of the object (physical custody/scholarly record vs. ritual function/community connection). The holder leverages this duality strategically.
      *   **Not Motte-and-Bailey:** Both claims are robust, primary arguments deployed *offensively* depending on the counter-argument. They are not a strong/weak pair.
      *   **Not Prescription/Adverse Possession:** These legal doctrines rely on *passive* lapse of time and claimant inaction. SAE relies on the *active consequences* of the *holder's own actions* (or those they benefit from) – the destruction *caused* by the taking.
      *   **Not Supersession of Historic Wrongs:** Supersession argues context changed *independently*, negating duties. SAE argues the context was *destroyed by the wrong itself*, and the *holder benefits from that destruction* to avoid the duty. It actively *exploits* the harm it caused.

  **Boundary Cases & Edges:**

  1.  **Natural Decay/Internal Change:**
      *   **Central Case:** If the context *would have vanished anyway* (e.g., iconoclasm by a different power, internal religious shift, natural decay), the rupture claim loses its unique link to the *holder's* act. SAE requires the rupture to be *directly attributable* (or plausibly attributable) to the act of expropriation or its immediate consequences. It weakens significantly here. The holder might still use the continuity claim, but the core feedback loop ("our act caused the rupture that justifies our keeping it") is broken.

  2.  **Later Purchaser (Good Faith):**
      *   **Peripheral/Weakened:** The core of SAE relies on the *original act* of expropriation causing the rupture. A later purchaser *benefits* from that rupture but didn't *cause* it. Their argument leans more heavily on the continuity claim (preservation, access) and potentially legal concepts like good faith purchase. The rupture claim ("no context to return to") is still usable but loses its self-accelerating link to *their own actions*. It becomes a description of fact, less a justification rooted in their agency.

  3.  **Genuine Second Community & Descendant Disagreement:**
      *   **Complicates, Doesn't Invalidate:** This introduces complexity but doesn't dismantle SAE. The holder will likely seize upon descendant disagreement to bolster the rupture claim ("There *is* no single authentic community/context to return to") and amplify the continuity claim ("It now serves a *new*, diasporic community globally, including descendants, *here*"). SAE adapts by framing the museum itself *as* the legitimate "second community" or the neutral ground resolving internal disputes. The core instrumental switching remains.

  4.  **Object as Record of Theft:**
      *   **Collapses the Continuity Claim, Strengthens the Claimant:** This is the *weakest* point for SAE. If the object's primary value *is* the evidence of its own theft (e.g., damage from removal, specific collection history), the museum's continuity claim ("we gave it a valuable second life") becomes morally hollow. Their curation *depends* on celebrating or sanitizing the act of theft. The rupture claim remains ("original context gone"), but the claimant's argument – that the object *belongs* with the evidence of the crime, within the narrative of the community that experienced the loss – becomes immensely powerful. The museum's "second life" narrative is exposed as parasitic. **This significantly weakens the holder's position, potentially collapsing SAE.**

  **For Your Curator:**

  *   **His Strongest Case:** When arguing against return to a *specific, functional context* that was demonstrably destroyed *by the conquest/removal*. He leans hard on rupture: "What shrine? What ceremony? The world that demanded *this specific object* in *this specific place* for *this specific purpose* is gone, erased by the event that brought it here. To send it back is to send it into a void." Then, pivoting to continuity: "Here, it *lives*. It speaks to millions. It is studied, conserved, compared. It belongs to human history now. Removing it *then* was destructive; removing it *now* from where it has found meaning and purpose would be equally destructive."
  *   **Where He Fails:** When confronted with:
      *   **The Self-Created Rupture:** "You argue the context is gone *because your institution (or its forerunners) destroyed it*. You profit from the damage you caused to avoid responsibility."
      *   **Persisting Meaning:** "The community remembers. The object has meaning *despite* your rupture, meaning tied to its origin and loss. Your 'second life' ignores the ongoing wound."
      *   **Object as Evidence:** If the Benin head's value *is* its status as loot (e.g., specific damage from the sack, its role in documenting the invasion), his "second life" argument sounds like glorifying theft. "You preserved the evidence of your crime and call it curation."
      *   **Internal Change ≠ Justification:** If the Oba institution evolved but still holds significance, his rupture claim oversimplifies. "Kingdoms adapt. Our institutions transformed *because of* the theft, not independently. The object's return would have meaning *within* that transformed reality."

  **The Shape:** SAE is a single, pernicious argumentative organism. The opportunistic switching (continuity/rupture) is the *tactic*; the self-accelerating injury (destruction justifying retention) is the *engine*. The worse the original act, the more fuel the engine has. Its power lies in transforming the undeniable *consequences* of theft into the *reasons* for its permanence. It fails when the link between the holder's benefit and the caused rupture is severed, when the "second life" is exposed as parasitic or illegitimate, or when the original community demonstrates resilient or redefined meaning that challenges the assertion of utter rupture.
