  ### Molyneux Position Quiz  
  *Answer each question with (a) or (b). Base responses on your intuitive judgment of what would happen, not pre-existing labels.*

  1. **Immediate Shape Matching (Vision):**  
     A person blind from birth gains sight. Without any visual experience, they're handed a cube (but can't see it), then shown a cube and a sphere. Can they correctly pick the cube by sight alone?  
     (a) Yes  
     (b) No  

  2. **Immediate Shape Naming (Vision):**  
     In the same scenario, can they say "that's a cube" when seeing the cube, without touching it?  
     (a) Yes  
     (b) No  

  3. **Delayed Shape Matching (Vision):**  
     After a week of sight (with feedback from bumping into objects and corrections), can they correctly pick the seen cube after touching it blindfolded?  
     (a) Yes  
     (b) No  

