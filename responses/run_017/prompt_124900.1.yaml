     A person deaf from birth knows a dog and a bell by touch and sight. After cochlear implant activation, they touch a dog. Can they pick the dog’s bark from a bark and bell sound without seeing either?  
     (a) Yes  
     (b) No  

  5. **Olfactory Matching:**  
     A person who never smelled anything knows a lemon and rose by touch and sight. After gaining smell, they touch a lemon. Can they pick the lemon’s scent from two smells without seeing either?  
     (a) Yes  
     (b) No  

  6. **AI Sensory Matching:**  
     An AI model is trained *separately* on camera images and tactile glove data (same objects, no paired vision-touch data). Given a new camera image and two tactile patterns, can it pick the tactile pattern matching the image?  
     (a) Yes  
