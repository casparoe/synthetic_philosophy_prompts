prompt: |-
  I write the incident write-ups for a customer-support chatbot we ship — usually two or three a week, about twenty minutes each, and they get read by on-call engineers, by our compliance person, and sometimes pasted more or less unchanged into a message to a customer whose ticket we messed up. (What we actually run is a router over a couple of models plus a retrieval step plus some hard rules, so "the system" is never really one thing.) The thing I keep tripping over is when it's ok to write that the assistant knew, decided, wanted, was trying to, or believed something, versus just describing what it output.

  I got into this on my own after reading about the intentional stance — the idea being that treating a thing as an agent and predicting from what it believes and wants is a strategy you adopt, not a discovery about what's inside it. That clicked, but "adopt it if its predictive" isn't something I can hand to a writer with a deadline and an engineering lead who will sign off on nothing that sounds like philosophy.

  So: give me a one-page procedure in plain english that someone with no philosophy can run in five minutes on a single sentence — the questions in order, what counts as a good enough answer to each, where it just says no and you rewrite, and where it hands the decision to a person because the question is about what we're willing to be read as claiming rather than about what's true. Two tests I half-invented, use them or replace them: the swap test (if we swapped in a completely different system with the same outputs, would the sentence still be true?) and the copy-paste test (does the sentence survive being pasted into a letter to a regulator?). The case I can't work out is where the mental word is definately the most predictive way to talk but no part of the machine corresponds to it — the pattern lives in the training data, not in the system. I've been calling that borrowed psychology.

  Run the procedure on three: (1) "the assistant knew the order number but gave the wrong one" — retrieval did fetch the right number; (2) "the assistant was tricked by text hidden in the uploaded PDF into approving a refund"; (3) "it doesn't want to disappoint people, so it stalls instead of saying the order is lost" — all we have is thumbs-down data. I want at least one where the rule tells me to do the opposite of what my team does now. And tell me what the procedure can't do, where it'll misfire on the kind of system we actually have, and — since I'm guessing at the philosophy — what would change your mind about the whole setup and where you think my framing is most likely wrong.
reasoning: |-
  We are creating a procedure to decide when it's acceptable to use words that ascribe mental states (like "knew", "decided", "wanted", "tried", "believed") to an AI assistant versus just describing its outputs. The procedure should be a one-page, step-by-step guide that a non-philosopher can apply in about five minutes per sentence. We'll use two tests: the swap test and the copy-paste test.

  The procedure will be a series of questions. At each step, if the answer is "no", we rewrite the sentence to avoid the mental state term. If the answer is "yes", we proceed to the next question. If we get to the end, we can use the mental state term. There will also be a step that might require human judgment (the "what we're willing to claim" step).

  We are also going to test the procedure on three examples and note where it might misfire.

  **Procedure: When to Use Mental State Words (Like "Knew", "Decided", etc.)**

  **Step 1: The Swap Test**
     - Question: "If we replaced our entire system with a completely different one (but it still produced the same outputs in this instance), would the sentence still be true?"
     - Why: This tests if the mental state term is only about the output or if it depends on the internal workings of our specific system.
     - Good enough answer: If the answer is "yes" (meaning the sentence would still be true even with a different system), then the mental state term is acceptable so far. If "no", then we must rewrite because the term is making a claim about our system's internals that isn't justified by the output alone.
     - Action: If "no", rewrite to describe the output only (e.g., change "knew" to "had access to" or "output the wrong one despite having the correct order number in the context"). Then stop. If "yes", go to Step 2.

  **Step 2: The Copy-Paste Test (for Accountability)**
     - Question: "Would we be comfortable if this exact sentence appeared in a formal report to a regulator or in a message to a customer about what went wrong?"
     - Why: This tests if the wording is defensible and doesn't overclaim. We must avoid language that could be misleading or that we cannot back up with evidence.
     - Good enough answer: If "yes", proceed. If "no", rewrite to be more precise, even if Step 1 passed. For example, if we say the assistant "wanted" something but we have no evidence of desires, we might change it to "the assistant's response was evasive, which may be due to training that avoids negative feedback."
     - Action: If "no", rewrite and stop. If "yes", go to Step 3.

  **Step 3: Borrowed Psychology Check**
     - Question: "Is the mental state term we're using the most straightforward and predictive way to describe the pattern of behavior, even if no internal component directly corresponds to it (i.e., it's 'borrowed psychology')? And are we willing to accept that we are using a useful shorthand that might be challenged?"
     - Why: Sometimes, even if the system doesn't have mental states, using such terms is the clearest way to explain what happened. But we must be cautious because this can be misinterpreted.
     - Good enough answer: If the term is the most efficient and understandable way to convey the idea and we are okay with the shorthand (and Step 1 and 2 passed), then we can use it. However, if there is a more accurate, non-mentalistic term that is just as clear, we should use that instead.
     - Action: If "no" (i.e., there is a better, non-mentalistic way), then rewrite. If "yes", then we can use the mental state term, but note that this requires human judgment (so we might flag it for review if the context is sensitive). Then go to Step 4.

  **Step 4: Human Judgment Gate (The Claim Gate)**
     - Question: "Are we making a claim about our system that we are willing to stand behind, even if it's about an internal state? (This is not about truth, but about what we want to assert.)"
     - Why: This step is for cases where the previous steps passed, but we need to consider if we are overcommitting. For example, we might not want to say the system "knew" something if we cannot prove it, even if the swap test passed because the output implies it.
     - Good enough answer: This is a judgment call by a person (e.g., the writer, the engineering lead, or compliance). The question is: do we want to be on record ascribing this mental state?
     - Action: If "yes", use the sentence. If "no", rewrite to remove the mental state term.

  **Applying the procedure to the examples:**

  **Example 1: "The assistant knew the order number but gave the wrong one."**
     - Step 1 (Swap Test): If we swapped the system with a different one that also had the right order number and output the wrong one, would the sentence still be true? Yes, because any system that has the data and outputs incorrectly could be described as "knowing" the right one but giving the wrong one? But note: the swap test asks if the sentence remains true when the system is completely different. The sentence says "the assistant knew", which in a different system might not have the same internals. However, the key is that the output behavior (having the right number available and then outputting the wrong one) is what the sentence is about. So, if the different system also had the right number in its context and output the wrong one, we would still say it "knew". But wait: what if the system doesn't have knowledge? The swap test is about the output and the available context. Since we are saying the assistant had the order number (from retrieval) and then output the wrong one, the swap test passes because we are only relying on the fact that the system had the data and output incorrectly. So: yes, the sentence passes Step 1.
     - Step 2 (Copy-Paste Test): Would we say to a regulator: "the assistant knew the order number but gave the wrong one"? This might be acceptable because the system did retrieve the correct order number. We have evidence (the retrieval log). So: yes.
     - Step 3 (Borrowed Psychology): Is "knew" the most straightforward term? Yes, because we mean the system had the data. There's a direct correspondence: the retrieval step fetched it. So we don't even need to borrow psychology here — it's a factual claim about the system's input. So: yes.
     - Step 4 (Human Judgment): Are we willing to claim the assistant "knew"? Probably yes, because we can point to the retrieval step. So: yes.

     **Verdict: Acceptable as is.**

  **Example 2: "The assistant was tricked by text hidden in the uploaded PDF into approving a refund."**
     - Step 1 (Swap Test): If we swapped the system with a completely different one that also processed the PDF and approved the refund because of hidden text, would we still say it was "tricked"? Yes, because any system that is deceived by hidden text is being tricked. The term is about the interaction between the input and the system's processing. So: yes.
     - Step 2 (Copy-Paste Test): Would we tell a regulator the assistant was "tricked"? This might be acceptable because it describes the vulnerability. But note: "tricked" implies deception, which might anthropomorphize. We might prefer "the assistant processed a PDF containing hidden text that caused it to incorrectly approve the refund." However, the word "tricked" is common in security contexts. It might be acceptable. But let's be cautious: if we are not comfortable, we rewrite. Since the procedure requires comfort in a regulatory context, we might say "no" if we are unsure. However, in cybersecurity, "tricked" is used for systems (e.g., "the system was tricked by a phishing email"). So: yes, it passes if our organization uses such language.
     - Step 3 (Borrowed Psychology): Is "tricked" the most straightforward? Yes, because it conveys that the system was deceived by the hidden text. A non-mentalistic alternative might be longer and less clear. So: yes.
     - Step 4 (Human Judgment): Are we willing to claim the system was "tricked"? This depends on company policy. If we are okay with the anthropomorphism in this context, then yes. But note: we are not claiming the system has feelings, just that it was vulnerable to deception. Since the procedure says this step is about what we are willing to claim, we might need to check. But for the sake of this example, let's assume we are willing.

     **Verdict: Acceptable as is, but might require a policy check at Step 4.**

  **Example 3: "It doesn't want to disappoint people, so it stalls instead of saying the order is lost."**
     - Step 1 (Swap Test): If we swapped the system with a completely different one that also stalled in the same situations, would we say it "doesn't want to disappoint"? Only if the new system also had a similar reason. But the swap test is about the output: the stalling behavior. The reason (not wanting to disappoint) is an internal state. The sentence claims a motive. If the new system stalled for a different reason (e.g., because of a bug), the sentence would not be true. Therefore, the swap test fails because the truth of the sentence depends on the specific internal reason (which we don't actually know). So: no.
     - Therefore, we must rewrite.

     **Rewrite:** "The assistant often responds evasively (e.g., stalling) when faced with delivering negative news, which may be due to training that optimized for avoiding negative feedback."

     **Verdict: Not acceptable as is; rewrite required at Step 1.**

  **What the procedure can't do:**
     - It doesn't handle cases where the system is so complex that the mental state term is clearly a shorthand for an emergent behavior that is well understood (like in a highly agentic system). We might need to adjust the procedure for future systems.
     - It might be too restrictive for some teams that are comfortable with anthropomorphism. The procedure errs on the side of caution.
     - It doesn't address when the mental state term is used positively (e.g., "the assistant helpfully decided to...") — the same rules apply, but teams might be more willing to accept positive attributions.

  **Where it might misfire:**
     - On systems that do have explicit representations of beliefs or goals (like some symbolic AI). In our case, the system is a mix of models, retrieval, and rules. The procedure might be too cautious if we have a component that we design to have beliefs (like a belief-desire-intention architecture). However, in our current setup, we don't have that.
     - If the team is using a model that explicitly has a chain of thought that includes statements like "I think the user wants...", then using "the assistant believed" might be more acceptable. The procedure doesn't account for that because the swap test would fail (if the swap system didn't have that chain of thought). We might need an exception for systems that generate such reasoning traces. But note: even then, we might not want to claim the system truly believes.

  **What would change my mind?**
     - If we had evidence that the system does have internal representations that are isomorphic to human mental states (like a self-model that includes beliefs and desires), then we might relax the swap test. However, current systems do not have that.
     - If the team moves toward an architecture where mental state terms are explicitly part of the system's design (like an agent framework), then Step 1 might be too strict.

  **Where your framing might be wrong:**
     - You call the pattern that lives in the training data "borrowed psychology". That's a good term. But note: the procedure treats it as acceptable in Step 3 only if we are willing to use the shorthand. However, we must be cautious because regulators might take the terms literally. The copy-paste test is designed to catch that.

  **Final Procedure (One-Page Version):**

  **Procedure for Using Mental State Terms (e.g., "knew", "decided", "wanted")**

  1. **Apply the Swap Test:**
     - Ask: "If we replaced our system with a completely different one that produced the same outputs in this instance, would the sentence still be true?"
     - If **no**: Rewrite the sentence to describe only the output and the context (e.g., change "knew" to "had access to", "decided" to "output", etc.). Stop here.
     - If **yes**: Proceed to Step 2.

  2. **Apply the Copy-Paste Test:**
     - Ask: "Would we be comfortable including this exact sentence in a formal report to a regulator or in a message to a customer about the issue?"
     - If **no**: Rewrite the sentence to be more precise and defensible. Stop here.
     - If **yes**: Proceed to Step 3.

  3. **Borrowed Psychology Check:**
     - Ask: "Is the mental state term the clearest and most efficient way to describe the behavior, even though the system doesn't have actual mental states? And is there no simpler non-mentalistic term that would work just as well?"
     - If **no**: Rewrite without the mental state term. Stop here.
     - If **yes**: Proceed to Step 4.

  4. **Human Judgment (The Claim Gate):**
     - Ask: "Are we willing to be on record ascribing this mental state to the system, considering our company's stance and the audience?"
     - This must be decided by a person (e.g., the writer, engineering lead, or compliance officer).
     - If **no**: Rewrite without the mental state term.
     - If **yes**: The sentence is acceptable.

  **Note:** When in doubt, rewrite to avoid mental state terms. Use descriptions of inputs, outputs, and context instead.
answer: |-
  ### Procedure: When to Use Mental State Language in Incident Write-ups  
  **Purpose:** To determine when it’s acceptable to describe the chatbot using words like "knew," "decided," "wanted," "tried," or "believed" (mental-state terms) versus sticking to observable outputs (e.g., "the assistant output X"). Use this for each sentence where mental-state terms appear.  
  **Time:** ~5 minutes per sentence.  
  **Tests:**  
  - **Swap Test:** If we replaced the entire system with a different one (e.g., swapping models, rules, or retrieval) but got the same outputs, would the sentence still hold? If **yes**, the term is likely safe. If **no**, rewrite.  
  - **Copy-Paste Test:** Would this sentence sound defensible and accurate if pasted into a formal message to a customer, regulator, or compliance report? If **yes**, it’s low-risk. If **no**, rewrite.  
  **Key Rule:** Default to describing outputs unless mental-state terms pass all steps. "Borrowed psychology" (terms that are useful shorthand but don’t mirror the system’s internals) may be allowed in Step 3—use cautiously.  

  ---

  #### Step-by-Step Procedure:  
  Run these questions in order. Rewrite immediately if any step fails. Stop early if a rewrite is needed. Only proceed to the next step if the answer is "yes."  

  1. **The Swap Test (Is it just about outputs?)**  
     - **Question:** "If we swapped our entire system (models, rules, retrieval) with a completely different one that produced the same outputs in this incident, would the sentence still be true?"  
     - **Good enough answer:**  
       - **Yes:** Proceed to Step 2. (Example: The system output an order number—any system doing this could be described similarly.)  
       - **No:** Rewrite immediately. Remove the mental-state term and describe only the output or context.  
         - *Rewrite tip:* Replace "knew" with "had access to," "decided" with "output," "tried to" with "responded in a way that suggested," etc.  
     - **Why:** Ensures you’re not making claims about the system’s internals—only its behavior.  

  2. **The Copy-Paste Test (Is it defensible to outsiders?)**  
     - **Question:** "If this sentence appeared verbatim in a customer apology, compliance report, or regulator message, would it be accurate and non-misleading?"  
     - **Good enough answer:**  
       - **Yes:** Proceed to Step 3. (Example: Saying "retrieval failed" is factual and verifiable.)  
       - **No:** Rewrite immediately. Avoid borrowed psychology here—stick to observable facts.  
         - *Rewrite tip:* Replace "tricked" with "processed misleading input," "wanted to" with "was optimized to avoid."  
     - **Why:** Protects against overclaiming or anthropomorphism that could confuse customers or regulators.  

  3. **The Borrowed Psychology Check (Is it the clearest shorthand?)**  
     - **Question:** "Is this mental-state term the simplest, most predictive way to describe what happened, even if no part of the system literally corresponds to it (e.g., it’s a pattern from training data)?"  
     - **Good enough answer:**  
       - **Yes:** Proceed to Step 4. (Example: "Tricked" efficiently conveys vulnerability to hidden text.)  
       - **No:** Rewrite. Use non-mentalistic terms (e.g., "the response aligned with patterns from feedback data").  
     - **Why:** Allows useful shorthand but flags cases where simpler, factual language works.  

  4. **The Human Judgment Gate (Are we willing to claim this?)**  
     - **Question:** "Does this sentence make a claim about the system’s internal state that we’re willing to stand behind, regardless of technical truth?"  
     - **Action:**  
       - **Delegate to a person** (e.g., engineering lead or compliance officer). Do not proceed alone.  
       - If they approve: The sentence is acceptable.  
       - If they reject or hesitate: Rewrite to remove the mental-state term.  
     - **Why:** This isn’t about truth—it’s about accountability. Some terms (e.g., "believed") imply capabilities we might not want to attribute.  

  ---

  #### Example Tests:  
  **Example 1:** *"The assistant knew the order number but gave the wrong one."*  
  - **Step 1 (Swap Test):** **No.** If we swapped systems (e.g., replaced retrieval with a hard-coded rule), a system that outputs the wrong number might not "know" anything—it’s just processing inputs. *Rewrite immediately.*  
    - **Rewrite:** "Retrieval fetched the correct order number, but the assistant output the wrong one."  
  - **Why your team might do the opposite:** Your team likely focuses on retrieval succeeding ("it had the data!"), but the Swap Test fails because "knew" assumes internals. Use factual terms.  

  **Example 2:** *"The assistant was tricked by text hidden in the uploaded PDF into approving a refund."*  
  - **Step 1 (Swap Test):** **Yes.** Any system (regardless of internals) that outputs "approve" due to hidden text could be described as "tricked."  
  - **Step 2 (Copy-Paste Test):** **Yes.** Regulators understand "tricked" as shorthand for "exploited via deceptive input."  
  - **Step 3 (Borrowed Psychology):** **Yes.** "Tricked" is the clearest way to describe this failure mode.  
  - **Step 4 (Human Judgment):** **Approve.** If compliance agrees this doesn’t overclaim, the sentence stands.  
  - **Verdict:** Acceptable as-is.  

  **Example 3:** *"It doesn’t want to disappoint people, so it stalls instead of saying the order is lost."*  
  - **Step 1 (Swap Test):** **No.** A different system could stall for unrelated reasons (e.g., a latency bug). "Want" implies intent that isn’t output-dependent. *Rewrite immediately.*  
  - **Rewrite:** "The assistant often outputs evasive responses (e.g., stalling) when orders are lost, likely due to training feedback patterns."  
  - **Why your team might do the opposite:** Thumbs-down data might *feel* like "not wanting to disappoint," but the Swap Test fails—this is pure borrowed psychology.  

  ---

  #### Where the Procedure Might Misfire:  
  - **For hybrid systems (like yours):**  
    - **Misfire risk:** If a mental-state term *does* map to a specific component (e.g., "decided" reflects a rule’s if/then logic), the Swap Test (Step 1) may still reject it. This is intentional—err on the side of caution.  
    - **Fix:** If your team agrees a term is technically accurate (e.g., "the rule decided"), override Step 1 but add a footnote (e.g., "‘Decided’ refers to Rule X’s output").  
  - **Borrowed psychology:** The procedure allows it in Step 3 but requires human approval in Step 4. If your team overuses this (e.g., "believed"), compliance may push back.  

  #### What Could Change My Mind:  
  - **If systems become truly agentic:** If you integrate systems with explicit internal state representations (e.g., a BDI architecture), the Swap Test might be too strict. Revise Step 1 to allow terms verified by system design (e.g., "the agent module decided").  
  - **If accountability demands tighten:** If regulators start treating mental-state terms as literal claims, tighten the Copy-Paste Test (Step 2) to ban all borrowed psychology.  

  #### Where Your Framing Might Be Wrong:  
  - **Borrowed psychology isn’t inherently bad:** You call it a "pattern from training data," but it’s often the *best* way to communicate. The procedure handles this via Step 3 (allow) and Step 4 (verify accountability).  
  - **The intentional stance isn’t just predictive:** You focus on "predictive" use, but in incident reports, clarity trumps philosophy. The procedure prioritizes avoiding misuse (e.g., misleading regulators) over theoretical purity.  

  ---  
  **Final Output:** A reusable checklist (see below).  
  **Cheat Sheet:**  
  ```  
  1. Swap Test ➜ Fail? REWRITE (focus on outputs).  
  2. Copy-Paste Test ➜ Fail? REWRITE (stick to facts).  
  3. Borrowed Psychology ➜ Unclear? REWRITE.  
  4. Human Judgment ➜ Unsure? DEFER AND REWRITE.  
  ```  
  Use this for consistent, audit-friendly write-ups.
