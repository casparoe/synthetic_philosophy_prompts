  1) Healthcare subsidy application with rigid household/income categories - sets aside because income disclosure might feel "sensitive"
  2) Community garden plot allocation with invasive cultivation questions - rejects because plant metaphors feel trivial
  3) Library study carrel assignment with life pattern schematization - best fit: focuses on non-sensitive time/organization data

  The chosen activity: "Study Carrel Assignment System"
