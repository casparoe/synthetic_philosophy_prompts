  ### **Final Recommendation**
  CSP captures 9/10 of your cases perfectly (only conjunction requires refinement) and explains your intuitions via:  
  - **Chance hypotheses** (cases 1–4, 6, 8, 10).  
  - **Counterfactual chances** for one-offs (case 5).  
  - **Contextual decisions** (abstention vs. pessimism; cases 5–6).  
  - **Non-convex sets** and **updating-induced widening** (cases 7–8).  

  **To apply CSP:**  
  1. Identify plausible chance hypotheses (physical, model-based, or counterfactual).  
  2. Define \(K\) as their minimal set (interval or discrete, no convex fill).  
  3. For decisions: abstain if \(r\) inside \(K\), use pessimism for catastrophes.  

  **If you reject CSP:** The main alternative is **Levi's E-admissibility**, which uses convex sets and permits any decision not accuracy-dominated. But it forces convexity (violating your cases 5, 7, 8) and demands sharp decisions in abstention zones. I think CSP better respects your empirical judgments—but it prioritizes psychological realism over axiomatic purity.  

