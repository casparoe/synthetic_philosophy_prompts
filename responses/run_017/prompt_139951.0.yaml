answer: |-
  As a formal epistemologist working on imprecise credences, I'll tackle your cases by developing a principled framework that captures your intuitive judgments. After brainstorming multiple approaches (Chance-Gap, Permissivism, Ambiguity Aversion), I've converged on a refined **Chance-Sensitivity Principle** (CSP) that integrates decision rules and addresses your core concerns. CSP has two components: one for *credal set formation* and one for *decision-making*. I'll state CSP precisely, then apply it to your cases, flagging where it succeeds, where it forces trade-offs, and what it predicts for new cases. Crucially, CSP abandons convexity requirements and allows non-probabilistic sets, respecting your hard-edged intervals without second-order distributions.

  ---

  ### **The Chance-Sensitivity Principle (CSP)**
  **Part 1: Credal Set Formation**  
  Your credal set for proposition \(P\) is the set of all *plausible chance hypotheses* consistent with your evidence, where:  
  - A "chance hypothesis" is any objective probability (physical propensity, long-run frequency, or model output) that could govern \(P\).  
  - "Plausible" means you cannot rule it out given your evidence (with "rule out" meaning the evidence contradicts it, not merely that it's unlikely).  
  - The set is the *smallest* interval or discrete set containing these hypotheses, but **without convex closure** (i.e., no filling in gaps). Intermediate values are included only if they are themselves plausible chance hypotheses.  
  - For one-off events (no physical chances), the set is defined over *counterfactual reference classes*: the chances that *would* govern analogous processes, if repeated.  

  **Part 2: Decision Rule (Contextual Weighted Minmax)**  
  - Define the *lower prevision* \(\underline{P}(P) = \min\{p \in K\}\) and *upper prevision* \(\overline{P}(P) = \max\{p \in K\}\), where \(K\) is your credal set for \(P\).  
  - To decide whether to accept a gamble on \(P\) at price \(r\):  
    - **Betting/Investing:** Buy if \(r < \underline{P}(P)\), sell if \(r > \overline{P}(P)\), and **abstain** if \(\underline{P}(P) \leq r \leq \overline{P}(P)\).  
    - **Catastrophic Risk:** If a loss would be devastating (e.g., ruinous financial loss, health harm), use the **pessimistic weight** rule: Act as if the probability is \(\underline{P}(P)\), regardless of abstention zones.  
  - **Updating on Evidence:** For credal set \(K\) and evidence \(E\), the updated set is \(\{p \mid p = \text{chance}(P | E, H), \text{ for each chance hypothesis } H \in K\}\). Sets can widen if evidence increases uncertainty about \(H\) (e.g., by eliminating intermediate hypotheses).  

  **Why CSP over alternatives?**  
  - **Chance-Gap Rule (your draft):** Fails one-off events (e.g., startup) by requiring physical chances. CSP fixes this with counterfactual chances.  
  - **Permissivism:** Allows arbitrary sets, violating your sharp-edged cases (e.g., coin). CSP ties sets to chance hypotheses.  
  - **Ambiguity Aversion:** Explains betting behavior but doesn't handle credal formation (e.g., why intervals widen). CSP unifies both.  
  - **Accuracy Arguments for Convexity:** Rejected per your case (8); CSP allows non-convex sets.  

