  ### **Predictions for New Cases**
  **Your Question: After 30 clean runs with the assay, does the credal set collapse?**  
  - **CSP Prediction:** No, but decision-making ignores implausible extremes.  
    - **Credal Set:** Evidence updates the two chance hypotheses. Let \(H_{50}\): assay is broken (chance = 0.5), \(H_{90}\): working (chance = 0.9). After 30 successes, likelihood ratio is \((0.9/0.5)^{30} \approx 10^{5.7}\), so \(H_{50}\) is astronomically unlikely. But CSP does not drop hypotheses unless ruled out—so \(K = \{0.5, 0.9\}\) remains.  
    - **Decision Rule:** For non-catastrophic bets, use minmax. But pragmatically, \(\underline{P}(P) \approx 0.9\) (since \(H_{50}\) is functionally irrelevant), so you bet at 0.9. Catastrophic risks (e.g., medical test) still use \(\underline{P}(P) = 0.5\), but this is negligible.  
    - **Trade-off:** CSP keeps the set intact, but you might feel this is stubborn—it doesn't "shrink" with evidence. To collapse it, you'd need evidence that *rules out* brokenness (e.g., disassembling the assay).  

