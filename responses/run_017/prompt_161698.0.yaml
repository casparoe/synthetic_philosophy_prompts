  - ✔️ Handbook voids pledge administratively — this is accurate.  
  - ❌ **Not a misfire:** Handbook *doesn’t* make sincerity a **procedural condition** like "right person" (Austin’s misfires). Sincerity remains an **internal state** (abuse). **Austin explicitly says insincerity doesn’t void the act** — it makes it *infelicitous but successful* (HT pp. 40-41).  
  - ❓ **Overreach:** Calling it a "declaration" confuses categories. Pledge is **commissive** (binds speaker) — declarations (e.g., "you're fired") change *external* status. Portal adds institutional consequences but doesn’t alter the *illocutionary force*.  
  - ✔️ Stage actor analogy is apt — but supports *misfire* only if context is theatrical, not Portal.  

