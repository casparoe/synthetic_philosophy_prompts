prompt: |-
  Hi — I'm a PhD student in linguistics (well, linguistic anthropology, sort of), and I've got a pattern in my own data that I can't find a name for. It's possible somebody has named it and I just don't read the right literature; it's also possible nobody has and I need to coin something for chapter 3 before my committee asks. Either way, I don't want just a label. I want to know what the thing actually is, what nearby things it isn't, and where its edges are.

  Setup, briefly. I've been working on the fishing-gear vocabulary of a small island community (I'd rather not name it, ethics stuff). The microdomain is terms for gill nets. There are four, which I'll call pila, taru, méska and won — pseudonyms; in my fieldnotes they're glossed as 'fine', 'middle', 'coarse' and 'very coarse'. The underlying dimension is close to one-dimensional: mesh size, with target species riding along on top of it.

  The thing I keep tripping over:

  (1) In a sorting task with twelve nets spanning 20–60 mm mesh, one consultant puts the pila/taru cut at about 32 mm and the taru/méska cut at about 47. Two months later, same consultant, a different twelve nets spanning 40–95 mm: the cuts land around 58 and 79. Nothing about their fishing changed in between. Show them a 45 mm net in the second session and they call it pila without hesitating; remind them they called a 45 mm net méska last time and they aren't bothered — I get something like 'that one was with the small ones'. So the boundary isn't a threshold on mesh size. But they talk as if it is: 'a pila is the sardine net, it's the fine one'.

  (2) It's asymmetric, which is the part I really can't place. When a much finer monofilament net showed up a few years ago, pila did not stretch down to cover it. People built a phrase instead — 'the new kind of pila', 'the thin-thin one'. But when a much coarser net came in, won just absorbed it, nobody said anything, and the word's upper end effectively vanished. My hunch is that the fine end is pinned to a function (a target species, a way of fishing) and the coarse end isn't pinned to anything, but I don't know what to do with that hunch or even whether it's the same phenomenon as (1).

  (3) Two fishermen whose boats carry different ranges of nets will apply different words to the very same net, fast, and without treating the difference as a disagreement. 'For us that's a taru.' Which sounds contextualist, except it isn't like 'tall' or 'local', where there's at least sometimes something in the sentence, or something obvious in the situation, that the comparison class goes into. Here the comparison class is just whatever nets happen to be in play, and if I ask a consultant what the comparison class is they can't tell me — they insist the word picks out a kind of net.

  What I think it isn't, so you don't waste time: it isn't the usual prototype / typicality-gradient / fuzzy-boundary story, because there aren't any typicality effects here, judgments are instant and categorical, and nobody hedges. It isn't ordinary vagueness or polysemy either, or not only that: the shifts are systematic and directional, not a sprinkle of borderline cases. And it isn't the plain comparative-adjective case, because there's no slot anywhere for the comparison class to go.

  What keeps going round in my head is whether the right description is that these words don't encode thresholds at all. Maybe what they encode is a rank in a locally constructed ordering — roughly 'the finest of the nets currently in play' — so the content gets filled in by the situation rather than shifted by it. On that reading there's no stable core and no moving boundary, just an ordering plus an anchor, and the apparent stability of everyday usage is an artifact of the anchor rarely moving, because the set of gear a boat actually carries is pretty fixed. It also feels adjacent to (but not the same as) what people say about concepts that seem to get their content by being hooked up to something in the context, rather than by describing anything intrinsic to the thing itself.

  So: does this configuration have a name of its own? If it does, which of the neighbors is it really, and how exactly does it differ from the ones I gestured at above? If it doesn't, I need to name it and define it, including what would and wouldn't count as an instance — and in particular whether (1), (2) and (3) are one phenomenon or three. And I'd really like a way to tell the 'rank in a local ordering' story apart from a 'fixed threshold plus a moving anchor' story: what would distinguish them, and is there any case, actual or constructable, where they give different predictions? I can definately build a follow-up elicitation around whatever the discriminating case is, so be as concrete as you can.
reasoning: |-
  Okay, the user is a PhD student in linguistic anthropology studying fishing gear terminology, specifically gill net terms. They've observed a pattern where the boundaries between terms like pila, taru, méska, and won shift based on context, but in an asymmetric way. The problem they're facing is that this doesn't fit neatly into existing linguistic frameworks like prototypes, vagueness, or comparative adjectives. They need to either find an existing term for this phenomenon or coin a new one for their dissertation.

  First, I need to unpack their three main observations: 
  (1) The categorization boundaries shift based on the range of nets presented in sorting tasks. For example, a 45mm net might be called pila in one context and méska in another, without any conflict.
  (2) The asymmetry: New finer nets don't get absorbed into the existing finest category (pila); instead, people use descriptive phrases. But coarser nets get absorbed into the coarsest category (won).
  (3) Different fishermen categorize the same net differently based on their own gear, without seeing it as a disagreement.

  The user has already ruled out several common explanations. They mention that it's not about prototypes because there are no typicality effects or hedging. It's not standard vagueness because the shifts are systematic. And it's not comparative adjectives because there's no syntactic slot for a comparison class.

  Their hypothesis is that these terms encode a rank in a locally constructed ordering, anchored at the fine end to a functional role (like target species). This makes sense given the asymmetry. The functional anchor at the fine end prevents pila from stretching downward, while won can expand upward because there's no equivalent anchor.

  I recall similar concepts in linguistics. Enfield's "local ecology" framework comes to mind, where terms are anchored to specific functional niches. Also, Barsalou's "ad hoc categories" might be relevant, but those are usually temporary. The asymmetry reminds me of unidirectional elasticity in semantic change, but that's diachronic. 

  For naming, "functionally anchored rank terms" (FART) seems fitting, though the acronym is unfortunate. Alternatives could be "task-anchored ordinal categories" or "domain-relative ordinal classes". The key is capturing both the ranking and the functional anchor.

  To distinguish between "rank in local ordering" vs. "fixed threshold + moving anchor", I think of a hypothetical scenario: If nets are presented in a sequence that reverses the mesh size order, would the labels flip? For example, if someone handles coarse nets first, would they call a medium net pila? If it's purely rank-based, they might. But if anchored to function, the fine end should resist such flipping.

  The user could test this with an elicitation task: Present nets in descending vs. ascending order and see if labels shift symmetrically. For the anchored end, adding a novel net that serves the same function as pila but has a different mesh size should show if the anchor overrides local context.

  I should also mention that this might connect to indexicality in linguistic anthropology, where words point to contextual features. The terms here index both the local set and the functional role. The asymmetry adds a layer—indexicality with a fixed point at one end.

  I need to ensure the explanation covers all three observations as one phenomenon. The functional anchor explains both the asymmetry in (2) and the context-dependence in (1) and (3). Without the anchor, the coarsest term behaves like a pure rank.

  For coining a term, clarity is key. "Functionally anchored rank" emphasizes the two mechanisms. The user might want to avoid an acronym like FART, so alternatives like "anchored ordinal categories" could work. Defining boundaries: Any system where terms denote relative ranks within a contextually defined set, with at least one end anchored to a non-contextual feature (like function).

  Finally, practical steps: Design tasks to test the rank vs. anchor predictions. If the user can show that the fine category resists extension downward even in contexts favoring it, that supports anchoring. Also, check if consultants can identify the functional role independently of the terms.
answer: |-
  What you're describing is a fascinating configuration that doesn't neatly fit mainstream semantic theories. It combines **context-dependent ranking** with **asymmetric functional anchoring**, and I argue it's a single phenomenon with three manifestations. Here's a breakdown:

  ---

  ### **Core Phenomenon: Contextually Anchored Ordinal Categories**
  This is **not merely relative gradience** (like "tall") nor **prototype theory**. Instead:

  1.  **Ranking in Local Order:** Terms denote *relative positions* within a contextually constructed linear ordering of items in the immediate domain (e.g., the nets present in the task or on a specific boat).  
  2.  **Fixed Functional Anchor (Asymmetry):** One end of the scale is pinned to a specific functional niche (e.g., "sardine net" for *pila*). This anchor prevents downward extension but allows upward expansion at the unanchored end (*won*).  
  3.  **No Explicit Comparison Class:** The comparison set is *implicitly* defined by the situational domain (task, boat, conversation), not by syntactic slots or overt reference.

  **Why existing labels don't fit:**  
  - **Indexicality:** Captures context-dependence but misses the *ordinal ranking* aspect.  
  - **Vagueness (Contextualist):** Assumes a stable core with flexible boundaries; your case has *no stable core threshold*.  
  - **Ad-hoc Categories (Barsalou):** Focuses on goal-derived groupings, not *fixed ordinal positions within a dimension*.  
  - **Relative Adjectives ("Tall"):** Require a syntactic/comparative slot; your terms behave like *absolute* nouns.  

  **Proposed Name:** **Functionally Anchored Rank Terms (FARTs)**  
  *(Yes, the acronym is unfortunate, but it’s memorable! Alternatives: "Anchored Ordinal Categories," "Domain-Relative Ordinal Classes")*  

  ---

  ### **Why (1), (2), and (3) Are One Phenomenon**  
  - **(1) Sorting Shifts:** Demonstrates the *contextual ranking* mechanism: boundaries shift based on the local set.  
  - **(2) Asymmetric Extension:** Reveals the *functional anchor* at the fine end (*pila*) and its absence at the coarse end (*won*).  
  - **(3) Speaker-Specific Boundaries:** Shows ranking is *hyper-local* (per-boat domain), with no conflict because there’s no "correct" threshold.  

  **Key Feature:** The anchor (e.g., "sardine-catching function") stabilizes *pila*’s *lower bound* but not its upper bound, which floats with the local set. *Won* has no lower anchor, so its entire range floats.  

  ---

  ### **Distinguishing "Rank + Anchor" vs. "Moving Threshold + Anchor"**  
  Your two models make different predictions:  

  | **Scenario** | **Pure Rank + Anchor Model** | **Moving Threshold + Anchor Model** |  
  |--------------|------------------------------|-------------------------------------|  
  | **Novel Net Added to a Set** | Labels for *all* nets may shift if rank changes (e.g., adding a finer net makes old *pila* become *taru*). | Only boundaries *adjacent* to the new net shift; non-adjacent terms are unaffected. |  
  | **Anchor Violation** | A net matching *pila*’s function but coarser than usual is still *pila* (anchor overrides rank). | A "functionally *pila*" net outside the typical size range might be rejected or hedged. |  
  | **Extreme Context Shift** | In a set of 80–100mm nets, *pila* could label the *finest* (80mm) if the anchor is ignored. | *Pila* might be *inapplicable* if all nets are far from its anchored size/function. |  

  ---

  ### **Critical Test to Discriminate Models**  
  Design an elicitation task with **two phases**:  

  1.  **Anchor Calibration:**  
      - Confirm *pila*’s functional anchor: "Show me a net that can catch sardines." (Likely a 30–40mm net).  

  2.  **Forced Rank Shift:**  
      - **Task A:** Present nets at 80, 85, 90, 95, 100mm. Ask: "Which of these is *won*? Is there a *pila* here?"  
      - **Prediction (Rank + Anchor):** *Pila* may label the finest net (80mm) if the anchor is overridden by local ranking.  
      - **Prediction (Moving Threshold):** *Pila* is rejected entirely ("None are *pila* – too coarse").  
      - **Task B:** Add a 35mm net (functional *pila*) to Task A’s set. Ask: "Is this *pila*?"  
      - **Prediction (Rank + Anchor):** It is *pila* (anchor overrides local rank).  
      - **Prediction (Moving Threshold):** It may be called *pila*, but consultants might hesitate or add qualifiers ("It’s *pila*, but very small compared to these").  

  **If consultants accept 80mm as *pila* in Task A and instantly call 35mm *pila* in Task B, support for Rank + Anchor is strong.**  

  ---

  ### **Boundaries of the Phenomenon**  
  **What counts as a FART?**  
  - Terms that:  
    a) Denote relative ranks on a contextual scale,  
    b) Have at least one end functionally anchored,  
    c) Lack syntactic slots for comparison classes.  
  - **Examples:** Tool sizes (e.g., "medium wrench" in a mechanic’s toolkit), soil grades in agriculture.  

  **What doesn’t count?**  
  - **Pure relative terms** ("bigger," "finer"): Require explicit/comparative syntax.  
  - **Prototype-driven terms** ("bird"): Show typicality effects (robins > penguins).  
  - **Fixed-threshold terms** ("SUV"): Boundaries may stretch but are not *fully* context-dependent.  

  ---

  ### **Theoretical Neighbors**  
  1.  **Enfield’s "Local Ecology" (2015):** Words are anchored to culturally specific niches. FARTs add *ordinal ranking* to this.  
  2.  **Barsalou’s "Ad-hoc Categories" (1983):** Situational goals shape categories. FARTs are *not ad-hoc*; they’re conventionalized for a stable domain (fishing).  
  3.  **Indexical Fields (Eckert 2008):** Social meaning shifts with context. FARTs focus on *referential* (not social) indexicality.  

  ---

  ### **Recommendations for Chapter 3**  
  1.  **Name it:** Use **Anchored Ordinal Categories (AOCs)** to avoid acronym issues.  
  2.  **Define it:**  
      > "A lexical category where terms denote fixed ordinal positions (e.g., finest, coarsest) within a contextually defined set of items, with at least one boundary anchored to an extrinsic functional niche. Thresholds are not encoded; only rank and anchor are conventionalized."  
  3.  **Test it:** Run the discriminator task above. If 80mm is called *pila* in a coarse set, the rank model wins.  
  4.  **Theorize it:** Argue that AOCs resolve tension between functional stability and contextual flexibility in specialized domains.  

  This framework explains all your observations without overfitting. If your committee asks, "Why not just contextual vagueness?" – point to the *asymmetry* and *instantaneous categorical judgments*. Vagueness doesn’t predict why *pila* resists downward expansion but *won* doesn’t.  

  Let me know if you want the elicitation task scriptified!
