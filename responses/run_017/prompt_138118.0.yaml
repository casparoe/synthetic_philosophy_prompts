prompt: |-
  I sit on the internal review board of a research institute where any one of eight senior researchers may unilaterally authorize a certain class of high-consequence experiments; the rest of us learn about it afterward, and the downside, if there is one, is borne by everyone. We are split over what rule to adopt. One faction argues that our situation is just the winner's curse from common-value auction theory in a new costume: the outcome is settled by the most optimistic estimate in the group in the same way that the item goes to the highest bidder, so the problem is purely a selection effect on noisy private estimates of what is, at bottom, one shared value. From this they conclude that we need no veto and no unanimity rule at all, only a correction each researcher applies privately: authorize only when the experiment would still look worth doing conditional on one's own estimate being the highest in the group, the way a well-advised bidder shades. Another faction reads the same analogy as supporting a hard near-unanimity requirement. I am not sure either reading is earning its keep.

  Please audit the analogy. My own worries are that the actor in our case does not pay the price the winner pays, that we have no track record from which to calibrate how wrong we each tend to be, and that what we disagree about may be values rather than a single common quantity being estimated — but I cannot tell how much any of that matters.

  Structure your reply in these sections, in this order:

  1. The mapping (about 150 words, a table of correspondences is fine): what in the auction plays the role of each researcher, the shared value, the private estimate, the winning bid, the overpayment, and the other bidders.
  2. Where the analogy genuinely holds (about 100 words): the features the two cases share that do the explanatory work.
  3. The disanalogies that matter (about 250 words): three or four, ranked by how much they affect what the analogy can support, and separated from disanalogies that are merely decorative.
  4. What the auction frame quietly imports (about 100 words): structural assumptions about payoffs, repetition, error distributions, and shared aims that our institute may not have.
  5. Verdict on shade, don't veto (about 150 words): whether the no-veto conclusion survives, whether it survives for the reasons its defenders give, and what the conditional-on-being-most-optimistic test would actually require here.
  6. A better analogy (about 100 words): one comparison that carries the same core insight without the misleading features, or a note on why none is available.
reasoning: |-
  Hmm, the user is asking me to audit an analogy being used in their research institute's policy debate. They have two factions: one arguing that researchers should individually "shade" their authorization decisions like in auction theory's winner's curse, and another pushing for near-unanimity requirements. The user is skeptical about both interpretations and wants me to systematically evaluate this analogy.

  I need to structure my response exactly as requested: mapping the analogy, where it holds, disanalogies, imported assumptions, verdict on the "shade don't veto" position, and a better analogy. The user specifically mentioned concerns about cost-sharing, lack of calibration data, and potential value disagreements.

  For the mapping section, I'll create a clear correspondence table between auction elements and the research context. The auction's bidders correspond to researchers, the item value to experiment net benefits, bids to authorizations, etc. The winner's curse manifests as overoptimism rather than overpayment.

  The analogy genuinely holds in two key aspects: the selection effect where only the most optimistic acts, and the shared-value setup where everyone bears the consequences. These are foundational to the winner's curse phenomenon.

  For disanalogies, I need to prioritize by impact. The most critical is the cost asymmetry - in auctions the winner pays alone, while here costs are shared. This fundamentally alters incentive structures. Next comes value pluralism - researchers might genuinely disagree on ethical weights, not just misestimate a common value. The lack of calibration data prevents effective shading adjustments. And finally, the binary decision nature differs from continuous bidding.

  The auction frame quietly imports several problematic assumptions: symmetric error distributions, purely epistemic disagreements, repeated play for calibration, and that net benefits can be cleanly quantified. The institute may not share these.

  For the verdict, I'll explain why the "shade don't veto" argument collapses under these disanalogies. The conditional probability test is practically impossible without calibration data and ignores value conflicts. Near-unanimity might be preferable but for different reasons.

  As a better analogy, I'll propose a "guardian at the gate" framework where each researcher acts as a checkpoint with heterogeneous thresholds. This preserves the selection effect insight while accommodating value pluralism and shared costs. It avoids the misleading auction mechanics.

  Throughout, I'll maintain a balanced academic tone while clearly supporting the user's skepticism about forcing the auction analogy. The policy implications matter - getting this wrong could lead to reckless authorizations or unnecessary gridlock.
answer: |-
  ### 1. The Mapping
  | Auction Element          | Research Institute Context                          |
  |--------------------------|-----------------------------------------------------|
  | **Bidders**              | Researchers (8 senior scientists)                   |
  | **Item's Common Value**  | True net benefit/cost of the experiment (shared outcome) |
  | **Private Estimate**     | Individual researcher's assessment of net benefit   |
  | **Bid**                  | Decision to authorize the experiment                |
  | **Winning Bid/Bidder**   | Authorization by the *most optimistic researcher*   |
  | **Overpayment**          | Collective loss when an overoptimistic authorization occurs |
  | **Other Bidders**        | The remaining 7 researchers (who bear the cost but didn't "win") |

  ---

  ### 2. Where the Analogy Genuinely Holds
  The core similarity is the **selection effect** in a common-value setting: the actor who initiates the experiment is the one with the most extreme positive estimate, analogous to the highest bidder winning the auction. This creates systematic overestimation of expected value because the "winner" is selected from the right tail of the error distribution. The shared consequence (costs borne by all) mirrors the common-value assumption where the item’s value is identical for all bidders but uncertain. This justifies viewing excessive authorizations as a form of winner’s curse.

  ---

  ### 3. The Disanalogies That Matter (Ranked by Impact)
  1. **Cost Asymmetry (Highest Impact):**  
     In auctions, the winner *alone* pays their bid, internalizing the cost of overestimation. Here, the authorizing researcher imposes costs *on the entire group* while capturing personal benefits (prestige, curiosity satisfaction). This creates a moral hazard: the optimizer faces no direct penalty for being wrong, undermining the incentive to "shade" prudently.

  2. **Value Pluralism vs. Common Value:**  
     Auction theory assumes a single, objective value (e.g., resale price). Researchers may disagree not due to estimation error of a shared metric, but because they **weight ethical risks, externalities, or scientific value differently** (e.g., "animal welfare vs. knowledge gain"). If values conflict, there is no "true common value" to misestimate—undermining the winner’s curse logic entirely.

  3. **Lack of Calibration Data:**  
     Bidders can "shade" bids using historical data on past auctions to estimate bias. Researchers lack a track record of similar high-consequence experiments to quantify their *individual* overoptimism tendency. Without this, the "shading" rule is theoretically sound but **operationally impractical**.

  4. **Binary Decision vs. Continuous Bidding:**  
     Auction bids are continuous and adjustable ("shading" reduces the bid amount). Authorization is **binary**—researchers can only say "yes" or "no." This forces an artificial choice: either apply an untestable mental adjustment (still authorizing) or veto. The analogy cannot prescribe *how* to implement shading in a binary system.

  ---

  ### 4. What the Auction Frame Quietly Imports
  - **Symmetric, Quantifiable Errors:** Assumes estimation errors are identically distributed and purely epistemic (not value-driven).  
  - **Repeated Play:** Requires many similar auctions to calibrate shading, unlike rare, unique experiments.  
  - **Aligned Incentives:** Presumes all bidders/shareholders seek to maximize the same objective (profit). Researchers may prioritize diverse goals (ethics, funding, fame).  
  - **Monetizable Payoffs:** Net benefits are framed as a single scalar (like profit), ignoring incommensurable harms (e.g., reputational damage, ethical violations).

  ---

  ### 5. Verdict on "Shade, Don’t Veto"
  **The no-veto conclusion does not survive.** While the selection effect is real, the disanalogies—especially cost asymmetry and value pluralism—fatally weaken the argument. Researchers lack incentives to self-correct since they don’t bear full costs, and shading is infeasible without calibration data. Even if attempted, the **conditional test** ("would I authorize if I knew my estimate were the highest?") requires knowing the *distribution* of others’ errors to compute the expected value correction. Without historical data or shared values, this reduces to guesswork. Near-unanimity rules, while imperfect, directly counter the selection effect by requiring consensus among diverse perspectives—addressing both estimation errors *and* value conflicts.

  ---

  ### 6. A Better Analogy
  A **"Guardian at the Gate" model** better fits: Each researcher is a checkpoint with heterogeneous risk thresholds. The experiment proceeds if *any* guardian approves, creating a selection effect where the most risk-tolerant guardian "opens the gate." This retains the key insight (optimism bias in the marginal decision) but avoids auction-specific mechanics like bidding or payment. It accommodates value pluralism (guardians have different priorities) and shared costs (the gate protects the collective). The remedy isn’t shading, but installing multiple gates (e.g., requiring 2–3 approvals) to filter out recklessness while avoiding unanimity’s gridlock.
