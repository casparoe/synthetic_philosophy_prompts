prompt: |-
  Hey — sorry for the length, but I'm stuck and I'd rather get this down properly than keep going in circles in committee.

  I sit on a hospital ethics committee and we've been asked to comment on a draft revision of our state's determination-of-death statute, and I've realised that before we argue about which criterion to adopt, I want to know what we should even be asking of one. So: write me the desiderata for an account of death. The purpose is fixed and narrow, and that's deliberate — it has to work as a legal and bedside criterion, one that tells a clinician when she may switch off the ventilator and when a procurement team may begin, in a case where the family has already consented, and it has to be decidable within hours by people who aren't philosophers. Not a metaphysical theory of what death is in the abstract; a criterion that could actually be written into law and applied on a ward.

  For each desideratum give me the case or consideration behind it, and say why it's a requirement rather than a preference. The cases I want covered: the patient with a destroyed brain on a ventilator, warm, perfused, heart beating — assume for the sake of the list that some bodies declared dead on neurological grounds have kept circulation going, healed wounds, regulated their temperature, even carried a pregnancy for weeks, and say what has died there; donation after circulatory determination of death, where the heart stops, everyone waits a few minutes, and then organs are taken; infants born with a brainstem and almost no forebrain; the patient in a permanent vegetative state who sleeps and wakes and has reflexes but nothing you'd call awareness; and the mimics — profound hypothermia, drowning, overdose — where circulation and brain function stop and then come back, which is why I keep thinking the requirement has to be stated in terms of irreversibility rather than arrest.

  Here's the bit I think is going to do the real work, and it's a stipulation, not a fact you need to look up: suppose a perfusion technology becomes available that can keep brain tissue metabolically alive, and restore some spontaneous electrical activity, for hours after circulation has stopped. Nobody gets plugged into it, because there's no point and it's not approved. If "irreversible" has quietly come to mean "won't be reversed because we've chosen not to reverse it," what happens to that desideratum, and does it collapse into something else?

  Two more things I want from you. One of our members keeps insisting that any acceptable account must preserve the dead donor rule, and I suspect that's a separate moral constraint that got smuggled into a definitional question — tell me which it is and why. And I want the distinctions the account can't collapse, with a case for each: death of the organism versus death of the person, criterion versus test, determining that someone has died versus deciding that more treatment is pointless, whole brain versus brainstem versus higher brain, and whether one uniform criterion has to cover everybody.

  Then, since this is the part I actually have to defend in the room: mark which desiderata are non-negotiable and which are just what one camp happens to want; flag any pair that you think can't be satisfied together, because if the list itself is unsatisfiable I'd rather know now than discover it mid-meeting; and name the single requirement that knocks out the most candidate accounts. Only after all that, two or three sentences each on how the usual families do — whole brain, brainstem, higher brain, circulatory — and where each of them quietly buys off a desideratum by redefining it.

  And please, no headings, no bullets, no bold, no table — just continuous prose, like an email. I'm pasting this straight into our notes and the formatting always comes out mangled.
reasoning: |-
  Okay, the user is on a hospital ethics committee dealing with a revision of their state's determination-of-death statute. They need desiderata for an account of death that's practical for legal and clinical use. Let me unpack their requirements.

  First, they want desiderata based on specific cases: destroyed brain on ventilator, DCDD cases, anencephalic infants, PVS patients, and reversible conditions like hypothermia. They also mention a perfusion tech scenario where irreversibility becomes ambiguous if it depends on choice not to intervene. Plus, the dead donor rule, distinctions like organism vs person death, and identifying non-negotiable vs negotiable criteria.

  The user’s explicit needs are clear, but deeper concerns might include avoiding legal loopholes, ensuring ethical organ procurement without violating the dead donor rule, and preventing family distress. They might also worry about committee conflicts between different philosophical camps and the practicality of implementing the criterion in time-sensitive scenarios.

  Starting with desiderata. The core must be irreversibility, but the perfusion tech case complicates this. If irreversibility means "won't reverse due to choice," then it’s a moral decision, not a biological one. So the key is to define irreversibility as impossibility of autoresuscitation or spontaneous function return, regardless of intervention. That addresses mimics and the tech scenario.

  The dead donor rule is a separate ethical constraint. The definition of death must not be bent to facilitate organ donation; otherwise, it risks conflating biological death with moral justifications. For example, PVS patients aren’t dead, so harvesting organs would violate the rule. The distinction between organismic death (biological) vs personhood (consciousness) is crucial here. Higher-brain criteria conflate these, leading to ethical issues.

  Non-negotiable desiderata: Universality (applies to all humans), clinical decidable (within hours without philosophers), and irreversibility (properly defined). Universality prevents exceptions like anencephalic infants who still have brainstem function. Clinical decidable ensures practicality. Irreversibility must be about spontaneous function, not choice-dependent interventions.

  Conflicts might arise between universality and higher-brain criteria since infants might not have higher brain function but are still alive. Also, distinguishing death from futility of treatment is vital. PVS cases show that treatment might be futile, but the organism isn’t dead. Whole-brain death might be the only one satisfying all, but the user mentions cases where bodies heal post-declaration. That’s a problem. Brainstem death might be sufficient since it controls respiration and consciousness, but what about those rare cases? Maybe emphasizing that somatic integration is lost even if some functions persist. 

  The perfusion tech scenario highlights that irreversibility can’t rely on available tech but intrinsic incapacity. So the desideratum must specify that irreversibility means no spontaneous return possible, regardless of external tech. 

  In evaluating criteria: Whole-brain fails if some brain-dead bodies show somatic integration. Brainstem might handle that better. Higher-brain conflates personhood with death. Circulatory is challenged by reversible arrests and the perfusion tech. 

  The user’s hidden need might be to present a defensible, unified criterion that the committee can agree on, avoiding philosophical debates while ensuring ethical and practical robustness. Highlighting the non-negotiables and conflicts helps them steer the discussion.
answer: |-
  Here's the structured analysis you requested, in continuous prose suitable for pasting into committee notes:

  The core desiderata for a determination-of-death criterion must address both biological reality and practical application. First, it must be **universally applicable to all human beings**, regardless of age or condition. Anencephalic infants demonstrate why: they may lack higher brain structures but retain brainstem-mediated functions (breathing, circulation) for some time. A criterion excluding them would create an unacceptable class of "non-living humans," complicating legal personhood and care obligations. This is non-negotiable for legal coherence. Second, it must be **clinically decidable within hours using available tools** by trained medical personnel. Cases like profound hypothermia or barbiturate overdose illustrate the danger of relying solely on absent function; reversibility must be assessed within a timeframe compatible with urgent decisions (e.g., organ procurement windows). This operational constraint is non-negotiable – a criterion requiring days of observation or advanced neuroimaging fails bedside utility. Third, **irreversibility must be biological, not contingent on choice**. Your perfusion technology scenario exposes this: if "irreversibility" means "we choose not to attempt reversal," the criterion becomes a policy decision disguised as a biological fact. True irreversibility requires that function *cannot* auto-resuscitate or be restored spontaneously – not that we *will not* restore it technologically. This is non-negotiable to maintain biological integrity. Fourth, it must **unambiguously distinguish death from severe disability**. Permanent vegetative state (PVS) is key here: patients exhibit sleep-wake cycles and reflexes but lack awareness. Calling PVS "death" conflates severe neurological impairment with organismic demise, undermining disability rights and creating ethical hazards in care withdrawal. This distinction is non-negotiable to prevent misuse.

  Fifth, the criterion must **align with the death of the organism as a whole**, not mere cellular or systemic collapse. The ventilated body with total brain destruction – even if healing wounds or sustaining pregnancy – shows why: somatic "integration" persists only via external support, masking the loss of the organism’s self-unifying capacity. Death occurs when the body is no longer a functionally integrated whole, not when every cell dies. Sixth, it must **preserve the dead donor rule (DDR) as a consequence, not a driver**. The DDR is an ethical safeguard against killing for organs, but it should flow from the definition, not constrain it. If a criterion declares someone dead *to permit* organ donation (e.g., redefining irreversibility in DCDD based on planned non-intervention), it corrupts the biological standard. The DDR is a separate moral requirement; bending the definition of death to satisfy it is illicit. Seventh, **criterion and test must remain distinct**. The criterion is the theoretical standard (e.g., "irreversible cessation of brain functions"); the test is its measurable proxy (e.g., apnea testing, EEG). Confusion arises in DCDD, where circulatory arrest (test) proxies for imminent brain death (criterion) after waiting minutes – but if perfusion tech could restore brain function, the test may not guarantee the criterion. Maintaining this distinction prevents conflating practical limitations with ontological reality.

  The most conflict-prone desideratum is **irreversibility defined biologically, not by choice**. It directly challenges current DCDD protocols where irreversibility hinges on the decision not to resuscitate. Your perfusion tech scenario shows this: if tech *could* restore brain function but isn’t used, "irreversibility" becomes contingent on intent, collapsing death determination into a policy choice. This requirement likely knocks out "pure" circulatory criteria and forces neurological or circulatory-neurological hybrids to confront the "perfusion paradox." Universality and non-disability conflation are also stringent, eliminating higher-brain criteria that equate death with loss of personhood – PVS patients would be declared dead under such views, violating our fourth desideratum.

  Evaluating common criteria: **Whole-brain death** satisfies universality and organismic death but faces tension with rare somatic integration cases (e.g., pregnancy). It handles irreversibility biologically but risks conflation with cellular viability in public perception. **Brainstem death** (used in the UK) emphasizes integration loss via respiratory control and consciousness, efficiently covering PVS and anencephalics, but struggles with the same somatic edge cases as whole-brain. **Higher-brain criteria** fail universality (anencephalics), conflate death with disability (PVS), and make irreversibility assessment harder by focusing on consciousness – a clinically elusive state. **Circulatory criteria** (for DCDD) are clinically simple but catastrophically fail your perfusion tech scenario; irreversibility becomes "won’t reverse" not "can’t reverse," collapsing death into a social decision. Whole-brain and brainstem criteria "buy off" irreversibility by assuming brain destruction is final after short circulatory arrest; circulatory criteria buy off organismic death by ignoring potential brain viability. The perfusion technology forces all accounts to confront whether irreversibility must hold even against potential future interventions – a hinge point requiring explicit statutory language to avoid ambiguity.

  ---
  **Key non-negotiables**: Universality, clinical decidability, biological irreversibility, distinction from disability, organismic death.  
  **Primary conflict**: Biological irreversibility vs. DCDD protocols reliant on non-resuscitation choices.  
  **Major casualty of strict irreversibility**: Pure circulatory criteria and expedited DCDD practices.  
  **Dead donor rule**: An ethical constraint that must not distort the biological definition.  
  **Critical distinction at risk**: Irreversibility as impossibility vs. non-intervention.
