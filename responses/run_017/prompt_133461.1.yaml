        Student 2: ranks C>B>A>F>E>D.

    We want to know: which three items maximize total welfare?

    Method 1: Use Borda scores: 5 for 1st, 4 for 2nd, 3 for 3rd, 2 for 4th, 1 for 5th, 0 for 6th.

        For A: Student1 gives 5, Student2 gives 3 -> total 8.
        For B: 4+4=8.
        For C: 3+5=8.
        For D: 2+0=2.
        For E: 1+1=2.
        For F: 0+2=2.
        Then we pick A, B, C.

    Method 2: Use a different cardinalization: 10 for 1st, 0 for 2nd, and then for the rest: 0? That doesn't make sense.

  Alternatively, use:

        Student1: A:10, B:9, C:8, D:7, E:6, F:5.
        Student2: C:10, B:9, A:8, F:7, E:6, D:5.

        Then:
            A: 10+8=18
            B: 9+9=18
            C: 8+10=18
            D: 7+5=12
            E: 6+6=12
            F: 5+7=12
        Again, pick A, B, C.

  But we want them to differ. So let's use a different cardinalization for Student2 that emphasizes the top item:

        Student1: as above.
        Student2: C:100, B:50, A:40, F:30, E:20, D:10.

        Then:
            A: 10 + 40 = 50
            B: 9 + 50 = 59
            C: 8 + 100 = 108
            D: 7+10=17
            E: 6+20=26
            F: 5+30=35

        Then we pick C, B, and A? Wait, but then we have to pick the top three by total: C (108), B (59), then F (35) or A (50)? A is 50 and F is 35, so A is next. So we pick C, B, A.

        Same as before.

  Alternatively, we can have a different ranking for a third student that breaks the tie.

  But to save time, the instructor can present a hypothetical:

    "Suppose we have two items and two people. Person 1: prefers A to B. Person 2: prefers B to A. We want to pick one item. 

    If we use a cardinalization for person1: A:10, B:0.
    For person2: B:10, A:0.
    Then total for A:10, for B:10. Tie.

    Now, if we use a different cardinalization for person1: A:10, B:0 (same).
    For person2: B:100, A:0.
    Then total for A:10, for B:100 -> choose B.

    But if we use for person2: B:10, A:0, then we have a tie. So the choice depends on the cardinalization."

  Then the instructor says: "In our case, we have six items and fifteen students, and we don't have unique cardinal utilities, so we cannot uniquely determine which three maximize total welfare."

  88-90 min: Wrap up and transition to debrief.

  Now, what if no violation occurs? Then we skip the part about the violation and move to the non-uniqueness of utility functions. We can also use the sealed ratings to show that even though choices were consistent, the cardinal intensities are not recoverable from choices.

  Debrief:

  1. (After the activity) Explain the revealed preference theory: the idea that we infer preferences from choices.
     - Point out that the consistency conditions (like WARP) are necessary for the existence of a utility function that explains the choices.

  2. When violations occurred, we saw that we cannot represent choices by a utility function. This is the empirical content: the consistency conditions are testable and sometimes rejected.

  3. When we allowed utility to depend on the menu, we could always fit the data, but this is just bookkeeping. It doesn't predict choices in new menus.

  4. Even when choices are consistent, the utility function is not unique: any monotonic transformation represents the same preferences. The cardinal values are not pinned down by choices.

  5. The intensity ratings they provided privately are not recoverable from the choices. This is why we say that utility in choice theory is ordinal.

  6. The closing sting: for welfare economics, we often want to aggregate utilities. But without unique cardinal utilities, we cannot do that unambiguously.

  What will go wrong:

    - Students might realize that we are looking for inconsistencies and try to be consistent. We mitigate by not revealing the purpose and by using real stakes (so they have an incentive to choose what they really want).

    - Students might conclude that people are irrational. We should clarify in the debrief that the activity is not about rationality, but about the conditions under which we can represent choices by a stable preference.

    - Groups might try to assign utility to item-menu pairs before we allow it. We can say: "For now, we are only allowed to assign one utility value to each item, regardless of the menu."

    - If no violation materializes, we focus on the non-uniqueness and use the sealed ratings to show that the cardinal information is not in the choices.

  Features not staged:

    - Risk: We did not involve uncertainty, so we didn't need cardinal utility for that.
    - Preference as cause vs redescription: The activity treats preference as a redescription of choice.
    - Generalizability: The items are trivial, so we cannot generalize to real goods or policies without further argument.

  In the debrief, we will have to assert:

    - The role of risk and the need for cardinal utility under uncertainty (we can mention von Neumann-Morgenstern).
    - The philosophical distinction between preference as a cause and as a redescription.
    - The caution against extrapolating from snacks to real-world goods.

  Deliverable:

  **Six items:**
  1. A: Lindt chocolate bar (100g)
  2. B: Store-brand chocolate bar (100g)
  3. C: Kettle chips (40g)
  4. D: Store-brand chips (40g)
  5. E: Pilot G2 gel pen (black)
  6. F: Bic ballpoint pen (blue)

  **Menu schedule (7 rounds, each with a menu of items):**

  Round 1: A, B
  Round 2: C, D
  Round 3: E, F
  Round 4: A, C
  Round 5: A, C, B
  Round 6: A, C, D
  Round 7: A, E

  **Record sheet:**

  Page 1 (sealed until the end):
  - Rank the items from 1 (most preferred) to 6 (least preferred): 
      A: _____, B: _____, C: _____, D: _____, E: _____, F: _____
  - Rate how strongly you want each item on a scale from 0 (not at all) to 10 (extremely strong):
      A: _____, B: _____, C: _____, D: _____, E: _____, F: _____

  Page 2 (choices):
  Round 1: {A, B} → _______
  Round 2: {C, D} → _______
  Round 3: {E, F} → _______
  Round 4: {A, C} → _______
  Round 5: {A, C, B} → _______
  Round 6: {A, C, D} → _______
  Round 7: {A, E} → _______

  **Minute-by-minute plan:**

  - 0-5 min: Distribute sheets, explain the activity and the random round for real payoff. 
  - 5-10 min: Students privately rank and rate the items, then seal page 1 in an envelope with their name.
  - 10-35 min: Run the 7 rounds. For each round, project the menu. Allow 2 minutes per round (1 min to decide, 1 min to record). 
  - 35-40 min: Collect record sheets. Randomly select one round (e.g., roll a die; if 7 or more, re-roll or use a 7-sided die app). Announce the round. Return the record sheets to students.
  - 40-55 min: Small groups (3 groups of 5) work on fitting a utility function for each member. Instruct: "Assign a utility number to each item such that in every round, the chosen item has the highest utility among the available ones. If you cannot, explain why."
  - 55-65 min: Groups report. Write violations on the board (without student names). 
  - 65-70 min: Instructor: "Now, allow the utility to depend on the menu. Try to fit again." Groups do it quickly.
  - 70-75 min: Groups report success. Instructor highlights the contrast: the relaxed claim is trivial.
  - 75-80 min: For groups without violations, compare two different utility functions for the same choice behavior. Show they differ cardinally.
  - 80-85 min: Open sealed envelopes. Compare cardinal ratings to the utility functions. Note that choices don't reveal cardinal intensities.
  - 85-88 min: Sting: "Now we must choose three items to stock. We have everyone's ordinal rankings. How to maximize total welfare? Two groups: use your utility functions to sum utilities and pick the top three. Group 1: use your first utility function. Group 2: use a different one (e.g., square the values)." They will get different results if the cardinalization matters. But if not, use the hypothetical with two students and two items as above.
  - 88-90 min: Wrap up.

  **Debrief points (to be delivered after the activity):**

  1. The empirical content of the utility representation theorem is the satisfaction of consistency conditions (like WARP). When these are violated, we cannot represent choices as maximizing a stable utility function. [Mapped to the violation step.]

  2. If we drop the requirement that utility is independent of the menu, we can always fit the data, but this is merely bookkeeping and has no predictive power. [Mapped to the menu-dependent utility step.]

  3. Even when choices are consistent, the utility function is only unique up to monotonic transformations. The cardinal values are not revealed by choices alone. [Mapped to the non-uniqueness step and the sealed ratings.]

  4. For welfare economics, we often need cardinal and interpersonally comparable utilities, but these are not available from choice data. [Mapped to the closing sting.]

  **Predictably going wrong and remedies:**

  - Students performing consistency: Pilot the menu schedule to ensure that in a typical group, some violations occur. If none occur in class, use a pre-prepared violation example from the pilot and focus on the non-uniqueness.

  - Students concluding people are irrational: Clarify that the activity is about the conditions for representing choices, not about rationality per se.

  - Groups assigning menu-dependent utilities early: Remind them that in the first stage, they must assign a single utility per item.

  - Class is too consistent: Proceed to the non-uniqueness part and stress that consistency is the norm in many settings, but the cardinality is still not recoverable.

  **Features not staged:**

  - Risk and the need for cardinal utility under uncertainty: We will assert in debrief that when choices involve risk, we need cardinal utility (via von Neumann-Morgenstern) to explain behavior.

  - Preference as cause vs redescription: We will assert that revealed preference theory treats preference as a redescription of choice, but there are other views.

  - Generalizability: We will caution that the activity uses trivial items and does not license welfare claims about real goods or policies.

  We will have to explicitly cover these in the debrief.
answer: |-
  Below is a complete, runnable activity designed to meet your specifications, including the six items, menu schedule, record sheets, minute-by-minute plan, debrief guide, and anticipated challenges. The design ensures students encounter the target insights through structured experience rather than lecture.

  ---

  ### **Six Items and Attribute Descriptions**
  Select items with overlapping attributes to create context effects and choice reversals. Attribute descriptions are critical for inducing predictable inconsistencies.

  1. **Dark Chocolate Bar (A)**: *70% cocoa, organic, slightly bitter.*  
  2. **Milk Chocolate Bar (B)**: *Creamy, sweet, familiar brand.*  
  3. **Spicy Chips (C)**: *Extra spicy, crunchy, 50% hotter than average.*  
  4. **Plain Chips (D)**: *Mildly salted, classic flavor, less crunchy.*  
  5. **Luxury Pen (E)**: *Smooth gel ink, ergonomic grip, gold accents.*  
  6. **Basic Pen (F)**: *Standard ballpoint, reliable, no frills.*  

  **Why these work**:  
  - A and B are both chocolates but differ in sweetness/bitterness.  
  - C and D are both chips but differ in spice/crunch.  
  - E and F are both pens but differ in quality.  
  - Attributes create "decoy effects": A dominates B for bitter-lovers, but B dominates A for sweet-lovers; C dominates D for spice-lovers, but D dominates C for mild-preferrers. This enables two independent routes to choice reversals.  

  ---

  ### **Menu Schedule and Timings**
  7 rounds (1–3 are "setup" to establish baseline preferences; 4–7 are "test" for reversals). Project menus visually.  
  - **Round 1 (2 min)**: {A, B} *Baseline chocolate choice.*  
  - **Round 2 (2 min)**: {C, D} *Baseline chips choice.*  
  - **Round 3 (2 min)**: {E, F} *Baseline pen choice.*  
  - **Round 4 (3 min)**: {A, C} *Critical pair for Route 1 reversal.*  
  - **Round 5 (3 min)**: {A, B, D} *Decoy for Route 1 (D is "worse" than B for sweet-lovers).*  
  - **Round 6 (3 min)**: {C, D, A} *Decoy for Route 2 (A is "worse" than C for spice-lovers).*  
  - **Round 7 (3 min)**: {E, F, C} *Independent Route 2 (C is "worse" than E for stationery-preferrers).*  

  **How reversals are induced**:  
  - **Route 1 (Rounds 4–6)**:  
    - Round 4: Student chooses between A (dark chocolate) and C (spicy chips).  
    - Round 5: Menu adds D (plain chips), a "decoy" for B (milk chocolate). If D is seen as clearly worse than B (e.g., for a sweet-lover), B becomes more attractive, causing some to switch from A to B.  
    - Round 6: Menu adds A to {C, D}. If A is seen as clearly worse than C (e.g., for a spice-lover), C becomes more attractive, causing switches from A to C.  
    - *Reversal*: If a student chooses A in Round 4 but B in Round 5 (or C in Round 6), they violate menu-independence.  
  - **Route 2 (Rounds 3 and 7)**:  
    - Round 3: Student chooses between E (luxury pen) and F (basic pen).  
    - Round 7: Menu adds C (spicy chips). If C is seen as irrelevant/worse than E (e.g., for stationery-preferrers), it highlights F as the "budget" option, causing some to switch from E to F.  
    - *Reversal*: Choosing E in Round 3 but F in Round 7 violates consistency.  

  **Pilot note**: Test menus on a non-class group (e.g., colleagues). If reversals are rare, add a round like {B, D, F} to amplify decoy effects.  

  ---

  ### **Record Sheets**  
  Two pages per student. Use physical paper or digital forms.  

  **Page 1 (Private; sealed until end)**:  
  ```  
  Name: __________  
  RANK the 6 items from 1 (best) to 6 (worst):  
  A (Dark Chocolate): ____   B (Milk Chocolate): ____  
  C (Spicy Chips): ____     D (Plain Chips): ____  
  E (Luxury Pen): ____      F (Basic Pen): ____  

  RATE how strongly you want each (0–10, 10=most):  
  A: ____   B: ____   C: ____   D: ____   E: ____   F: ____  
  [Seal in envelope provided.]  
  ```  

  **Page 2 (Public; completed during activity)**:  
  ```  
  Round 1: {A, B} → Choice: ___  
  Round 2: {C, D} → Choice: ___  
  Round 3: {E, F} → Choice: ___  
  Round 4: {A, C} → Choice: ___  
  Round 5: {A, B, D} → Choice: ___  
  Round 6: {C, D, A} → Choice: ___  
  Round 7: {E, F, C} → Choice: ___  
  ```  

  ---

  ### **Minute-by-Minute Plan** (90 min total)  
  **0–10 min: Setup and Private Rankings**  
  - 0–2 min: Distribute record sheets. Explain: "Today, you’ll make real choices. One round will be randomly selected at the end, and you’ll receive your chosen item. First, privately rank and rate the items. Seal this page—it stays closed until I say."  
  - 2–8 min: Students rank/rate items and seal Page 1.  
  - 8–10 min: Collect sealed envelopes. Emphasize: "Your choices should reflect what you truly want."  

  **10–35 min: Choice Rounds**  
  - Project menus. For each round:  
    - Announce menu (e.g., "Round 1: Dark Chocolate or Milk Chocolate").  
    - Students record choices. Strict time limits prevent overthinking.  
  - 10–12 min: Round 1.  
  - 12–14 min: Round 2.  
  - 14–16 min: Round 3.  
  - 16–19 min: Round 4.  
  - 19–22 min: Round 5.  
  - 22–25 min: Round 6.  
  - 25–28 min: Round 7.  
  - 28–35 min: Randomly select payout round (e.g., draw a number from a hat). Return record sheets. Students circle their choice for that round.  

  **35–60 min: Small-Group Utility Fitting**  
  - 35–37 min: Divide into 3 groups (5 students each). Task: "Using only your group’s choice records, assign a number to each item to create a single utility function. Every choice must be the maximum utility option in its menu. Write it as: U(A)=__, U(B)=__, etc."  
  - 37–50 min: Group work. Circulate and listen. If a group asks about inconsistencies, say: "Stick to one utility per item for now."  
  - 50–55 min: Groups report. Focus on:  
    - Groups with violations: "We couldn’t find a function because in Round 4, Alex chose A over C, but in Round 6, they chose C when A was available."  
    - Groups without violations: "Here’s our utility function."  
  - 55–60 min: Introduce menu-dependent utility: "Now, let utility depend on the menu. For example, U(A) in Round 4 could differ from U(A) in Round 5." Groups refit data (takes <2 min). Highlight: "Notice how easy it is now? What does that tell you?"  

  **60–80 min: Non-Uniqueness and Welfare Sting**  
  - 60–65 min: For violation-free groups: "Compare two groups’ utility functions for the same student. Do they agree on how much better A is than C?" Have groups write functions on the board. E.g.:  
    - Group 1: U(A)=10, U(C)=8 → Difference = 2  
    - Group 2: U(A)=100, U(C)=70 → Difference = 30  
  - 65–70 min: Unseal private ratings. Students compare intensity ratings to utility functions. Ask: "Which function matches your ratings? Could choices alone decide?"  
  - 70–75 min: Welfare sting: "Only 3 items can be stocked. Compute total welfare using your utility functions. Assume utilities are comparable across students."  
    - Group 1: Sum raw utilities (e.g., U(A) + U(B) + ...).  
    - Group 2: Apply monotonic transformation (e.g., square all utilities), then sum.  
  - 75–80 min: Groups report top 3 items. Likely conflict (e.g., Group 1: A, C, E; Group 2: B, D, F). Ask: "Why different results? What’s missing?"  

  **80–90 min: Transition to Debrief**  
  - 80–82 min: Students receive payout-round items.  
  - 82–90 min: "Next week, we’ll discuss what this reveals about utility theory."  

  ---

  ### **Debrief Script** (Post-Activity; 15–20 min)  
  **Sequence and Philosophical Points**:  
  1. **Violations and empirical content** (Link: Groups struggling to fit utility functions):  
     - "When your choices flipped in Rounds 5–7, no single utility function worked. This reveals the empirical core of utility theory: consistency conditions (like *if you choose A over C alone, you shouldn’t choose C when A is available*). These are testable claims about behavior."  

  2. **Menu-dependent utility as bookkeeping** (Link: Instant fitting after relaxation):  
     - "When we allowed utility to depend on the menu, fitting became trivial. But this ‘menu-dependent utility’ isn’t a theory—it’s redescription. It has no predictive power and adds no empirical content. The moment we demand structure (e.g., stable preferences), we commit to falsifiable claims."  

  3. **Non-uniqueness of utility** (Link: Groups’ differing cardinal assignments):  
     - "Even for consistent choices, your utility functions disagreed on *how much* better A was than C. Choices only reveal ordinal rankings (‘A > C’), not cardinal intensities. Your private ratings confirmed this: choice data can’t distinguish between U(A)=10/U(C)=8 and U(A)=100/U(C)=70."  

  4. **Welfare aggregation without cardinality** (Link: Opposite group recommendations):  
     - "You saw that identical ordinal data led to different policy outcomes (which 3 items to stock). Why? Welfare economics requires cardinal, comparable utilities. But choices don’t provide these. We can’t objectively sum ‘happiness’ without arbitrary assumptions."  

  **Closing emphasis**:  
  - "This is why revealed preference theory separates *what we observe* (choices) from *what we assume* (stable preferences). Utility maximization is substantive when it forbids inconsistencies—but vacuous when it’s just menu-dependent bookkeeping."  

  ---

  ### **What Predictably Goes Wrong and Mitigations**  
  1. **Students perform consistency**:  
     - *Likelihood*: High if students suspect manipulation.  
     - *Mitigation*: Emphasize real stakes ("You’ll get what you choose"). Use pilot data to inject pre-recorded violations if none occur.  

  2. **"People are irrational" conclusion**:  
     - *Likelihood*: Medium.  
     - *Mitigation*: In debrief, clarify: "This isn’t about rationality. It’s about when we *can* or *cannot* model choices as stable preferences. Anomalies reveal where the theory bites."  

  3. **Premature menu-dependent utility**:  
     - *Likelihood*: Low if instructions are clear.  
     - *Mitigation*: If a group does this, say: "Good idea—but for now, constrain utilities to be menu-independent."  

  4. **No violations in class**:  
     - *Contingency*: Use pilot data. Present a fictional student’s choices with reversals. Proceed with non-uniqueness using real student data.  

  ---

  ### **What the Activity Cannot Stage**  
  Three features are impossible to model with this setup; **assert these in debrief**:  
  1. **Risk and cardinal utility**: "Under uncertainty, we need cardinal utility (e.g., von Neumann-Morgenstern) to explain choices like gambling. Snacks involve no risk, so we skipped this."  
  2. **Preference as cause vs. redescription**: "Revealed preference treats ‘preferences’ as descriptions of choice. We didn’t explore if preferences *cause* choices (e.g., through deliberation)."  
  3. **Generalizability**: "Choice anomalies in snacks don’t license welfare claims about real policies. We can’t assume preferences over income or health behave the same way."  

  ---

  This activity ensures students experience the fragility of utility representation, menu-dependence as a loophole, and the ambiguity of welfare aggregation—all before formal terms are introduced. The debrief then crystallizes these into philosophical insights. Run it as-is, and the discoveries will emerge from the rules and roles.
