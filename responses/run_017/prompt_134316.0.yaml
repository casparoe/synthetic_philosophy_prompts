  For the formal phase, I'll design a token system where groups create replacement rules. The impossible task: add a rule that outputs the entire rule set. They get three "patches" to fix inconsistencies, creating regress/loop failures. 

  The pictorial phase requires depicting the picture's creation process, including group discussion. The banking mechanic with escalating audits (L1: depict production, L2: depict depiction production etc.) will incentivize early stopping. Cross-audits assign different inviolate levels to groups, forcing realization that what's omitted depends on stance.

  For debrief, I'll map activity moments to the concept: rule-patching failures as regress/loop emergence, banking choices as accepting omission, cross-audit as perspective relativity. I'll also prep responses to common issues (e.g., "we're the inviolate level" is partially correct).

  The one unsimulatable aspect is Escher's specific "tangled hierarchy" - that connection must be made verbally later. Timing is tight: 15min setup, 25min formal phase, 35min pictorial, 15min cross-audit, 10min debrief.

