  We want them to have different assessments of the same asset.

  Instead, have the bond be on the color of the marble, and the tribes have different beliefs about what color it is for ambiguous cases.

  But in a draw, the marble has a definite color.

  I think we need to have the state be the color, and the tribes have different utility because they care about different things.

  For example: the bond pays 10 if the marble is "acceptable". For red-tribe, acceptable means red or purple. For blue-tribe, acceptable means blue or purple. Then for a purple marble, both find it acceptable. For a red, only red-tribe finds it acceptable, etc.

  But then the expected value for a participant is 10 times the probability that a random marble is acceptable to their tribe.

  If the jar has R, B, P marbles, then for a red-tribe member, value = 10 * (R+P)/100.
  For a blue-tribe member, value = 10 * (B+P)/100.

  If we have R=30, B=30, P=40, then both have 70% if they don't know the distribution? But with a draw, they update.

  This is messy.

  Simpler: we have only two colors: red and blue, but we also have an expert who claims that some of the blue marbles are actually red, and vice versa. But that's not framing.

  I think for phase 3, we can use a different example: trading on the impact of a technology.

  But we need an activity.

  Given time constraints, maybe we can have a discussion for phase 3 rather than an activity.

  But the user wants an activity.

  Another idea: use a deck of cards with numbers, and the event is whether the number is "high" or "low", but we have two different definitions of the cutoff.

  For example, we draw a card from a deck of 1 to 10. 
  - Group A: high if >=6
  - Group B: high if >=4

  Then we assign each participant to group A or B secretly.

  Then a bond that pays 10 if the number is high by the holder's definition.

  Then the value for a group A member is 10 * P(number>=6) = 10*0.5 (if uniform) = 5.
  For group B, 10 * P(number>=4) = 10*0.7 = 7.

  Then they have different valuations even with the same information.

  Then in trading, a group A member might sell to a group B member because they value it less.

  And the no-trade theorem doesn't apply because they have different utility functions.

  This seems workable.

  Setup for phase 3:

  - We have a deck of cards numbered 1 to 10, shuffled.
  - We will draw one card at the end.
  - Each participant is assigned to group A or group B (secretly, by a card).
  - Group A: the bond pays 10 if the number >=6.
  - Group B: the bond pays 10 if the number >=4.
  - Each participant is told the rules for their group.
  - They do not get any private signal about the card (because we haven't drawn it yet). So they only have the prior: uniform from 1 to 10.

  Then the value for a group A member is 5 (since 5 cards are >=6: 6,7,8,9,10).
  For group B: 7 cards are >=4: 4,5,6,7,8,9,10 -> 7, so value 7.

  Then we issue one bond to each and 10 chips.

  In pairwise trading, a group A member (value 5) might be willing to sell for 6 chips, and a group B member (value 7) might be willing to buy for 6. Then they trade and both are happy.

  And there's no information to update from, so the no-trade theorem doesn't apply.

  This is simple.

  Then after trading, we draw the card and pay out.

  Timeline for the entire activity:

  Total 90 minutes.

  - Introduction and setup: 10 minutes
  - Phase 1: 20 minutes
  - Phase 2: 20 minutes
  - Phase 3: 20 minutes
  - Debrief: 20 minutes

  Materials for each phase:

  - For phase 1 and 2: 
    - Two jars: one with 80 red and 20 blue (Jar A), one with 20 red and 80 blue (Jar B)
    - A coin to flip to choose the jar (do this secretly before the activity)
    - A bag of red and blue marbles for drawing (or use the jar with replacement)
    - Chips (enough for each participant to have 20 or 30, plus extras)
    - Bonds (paper saying "bond" or physical tokens)

  - For phase 3:
    - A deck of cards numbered 1 to 10
    - Cards assigning group A or B

  Detailed steps:

  Phase 1: Private Trading (20 min)

  1. (Before participants arrive) Flip a coin to choose the jar (A or B). Use that jar for phase 1 and 2. 
  2. Explain the rules: 
     - We have a jar that is either mostly red or mostly blue, chosen by coin flip.
     - Each of you will draw one marble, look at it, and put it back. This is your private information.
     - We will give you 10 chips and one bond. The bond pays 10 prize units at the end if the jar is the "mostly red" one (Jar A), 0 otherwise.
     - You may trade your bond for chips with one other person in a pairwise trade.
  3. Have each participant draw one marble (with replacement: after drawing, they return it and shake the jar).
  4. Distribute 10 chips and 1 bond to each participant.
  5. Pair up participants randomly (7 pairs). Give them 2-3 minutes to negotiate a trade: they can agree to trade one bond for a certain number of chips (between 0 and 10). They can also choose not to trade. 
  6. After the negotiation, record any trades that occurred.

  Phase 2: Common Knowledge Trading (20 min)

  1. Redistribute so that each participant again has 10 chips and 1 bond. They keep their private signal (the marble they saw).
  2. Explain: Now we will have a public market. We will ask you two questions. Answer secretly on a piece of paper.
     - Question 1: Would you be willing to sell your bond for 5 chips? (yes/no)
     - Question 2: Would you be willing to buy a bond for 5 chips? (yes/no) [Note: for buying, they must have enough chips, but 5<10, so they do.]
  3. Collect the answers. On the whiteboard, write the number of "yes" for selling and the number of "yes" for buying.
  4. Then ask again: 
     - Now that you know how many are willing to sell and how many to buy, would you still be willing to sell at 5? (yes/no)
     - Would you still be willing to buy at 5? (yes/no)
  5. Collect the second set of answers. Compare the numbers: typically, fewer are willing in the second round.
  6. If there are both willing buyers and sellers, allow them to trade at 5 chips. But likely few will want to.

  Phase 3: Frame Disagreement (20 min)

  1. Explain the new setup:
     - We have a deck of cards numbered 1 to 10. We will shuffle and draw one card at the end.
     - Each of you is assigned to a group: Group A or Group B. (Distribute cards with "A" or "B".)
     - For Group A: a bond pays 10 prize units if the number is >=6.
     - For Group B: a bond pays 10 prize units if the number is >=4.
  2. Issue 10 chips and 1 bond to each participant.
  3. Pair up participants randomly. Give them 2-3 minutes to trade if they wish.
  4. Record any trades.

  Then at the end of all phases, reveal the outcomes:
  - For phase 1 and 2: reveal which jar was used (A or B) and pay out the bonds: each bond held pays 10 if jar A, 0 if jar B.
  - For phase 3: draw a card and pay out the bonds according to the holder's group.

  Chips are always worth 1 prize unit each.

  The stupid prize: have a small prize for the person with the most prize units at the end.

  Debrief (20 min):

  - Phase 1: People traded because they had private information that made them value the bond differently. They didn't know if the other person had the same or different information, so they could find mutually beneficial trades.
  - Phase 2: When we made the willingness to trade public, we saw that many were initially willing to buy or sell at 5. But after seeing that others were willing, we updated our beliefs. For example, if many are willing to sell, that suggests many saw blue marbles, which is evidence that the jar is B, so the bond is less valuable. Then buyers might not want to buy anymore. This is the no-trade theorem: when it becomes common knowledge that there are willing buyers and sellers, it might destroy the gain from trade.
  - Phase 3: Here, trade was possible again because the disagreement was not about the information (everybody had the same information about the card distribution) but about how to frame the event (what counts as a win). This is a different kind of disagreement that the no-trade theorem doesn't address.

  Then discuss the user's hobby horse: the no-trade theorem applies when there is a shared prior and a shared set of outcomes. In phase 3, we didn't have a shared prior on the events because the events were defined differently for each group.

  Finally, end with a question: "In real life, when two people trade stocks, do you think they usually have shared frame (like in phase 1 and 2) or different frames (like in phase 3)?" This can't be settled in the room.

  What might go wrong:

  1. Someone trades just to be friendly: In the instructions, emphasize that the goal is to accumulate as many prize units as possible, and that they should act in their self-interest. The stupid prize might help motivate.

  2. Someone tries to game the game: For example, in phase 2, they might not tell the truth in the questionnaire. But we can't prevent that. In the instructions, stress that they should answer based on their true willingness.

  3. Someone says it's rigged: Be transparent about the process. Flip the coin publicly for the jar? But then they know the prior is 50%. Or we can flip publicly. Let's do that: flip a coin in front of them to choose the jar. That way, they know it's fair.

  For the card draw in phase 3, do it publicly.

  Also, in phase 3, the card is drawn after trading, so no one knows the outcome.

  What the activity can't reproduce:

  - In phase 2, the no-trade theorem is most cleanly seen in a setting where both parties are fully rational and update perfectly. In practice, people might not update or might not understand the inference. So we might still see some willingness to trade. That's okay; we can discuss why the theory says they shouldn't.

  - The activity simplifies the continuous value to a binary event with a fixed price for phase 2. In reality, the market price itself conveys information. But we avoid that by fixing the price.

  - The frame disagreement in phase 3 is artificial. In real life, frames are often not as clear-cut.

  But overall, this should give a hands-on feel for the concepts.

  Let's write the full rules.
answer: |-
  Below is a complete, ready-to-run activity for your meetup, designed around the no-trade theorem and your three learning goals. It uses simple materials (chips, marbles, cards), avoids written arithmetic, and emphasizes the "knowledge" aspect over finance. The activity runs in three distinct phases across 90 minutes, with a debrief tying it all together. I've included predictable pitfalls and fixes, plus what the activity *can't* fully replicate.

  ### **Materials Needed**
  - **Marbles/Jar Setup**: 
    - 1 large jar with 100 marbles (60 red, 40 blue). *Hide the true ratio*.
    - 20 extra red/blue marbles for private draws (so the jar isn’t disturbed).
  - **Chips/Prizes**: 
    - 200+ poker chips (or paper scraps) as currency. 
    - A "stupid prize" (e.g., a toy crown, goofy trophy) for the chip leader.
  - **Cards for Phase 3**: 
    - 10 index cards with numbers 1–10 (for a deck). 
    - 14 secret assignment cards: 7 labeled "TECH" (defines "success" as numbers 6–10), 7 labeled "ART" (defines "success" as numbers 4–10).
  - **Other**: 
    - Whiteboard or large paper to record public offers.
    - Timer, pens, and bowls for marble draws.

  ---

  ### **Timeline (90 Minutes Total)**
  - **Setup (10 min)**: Explain rules, distribute chips.
  - **Phase 1: Profitable Private Trades (25 min)**  
  - **Phase 2: Common Knowledge Dry-Up (20 min)**  
  - **Phase 3: Frame Disagreement Revival (20 min)**  
  - **Debrief (15 min)**: Connect to the no-trade idea and your hobby horse.

  ---

  ### **Setup (10 min)**
  1. **Introduce the Jar**: "This jar has 100 red/blue marbles. The true ratio is fixed but secret. At the end, we’ll draw one marble. If red, every 'Red Bond' you hold pays 1 prize unit. Chips are always worth 1 prize unit. Your goal: maximize chips for the stupid prize."  
  2. **Distribute Starting Chips**: Give 10 chips to each person.  
  3. **Emphasize Self-Interest**: "Trade only if you think it helps you. No friendly deals—this is about testing ideas, not being nice!"

  ---

  ### **Phase 1: Profitable Private Trades (25 min)**  
  *Goal: Feel trading is obvious with private info. People make chips by feeling smart.*  
  **Rules**:  
  - Each person privately draws one marble from a bowl of extras (same ratio as jar). They see it but **don’t reveal it**.  
  - Issue one "Red Bond" to each person (pays 1 prize unit if the final draw is red).  
  - **Pair Trading (15 min)**: Pair participants randomly (e.g., draw names from a hat). Pairs have 2 minutes to negotiate trades:  
    - Trade bonds for chips (e.g., "I’ll sell you my bond for 6 chips").  
    - No prices are tracked publicly.  
  - **Repeat**: Re-pair everyone 3 times (so each person trades with 3 others).  

  **Why It Works**:  
  - Red-seers value bonds higher (they saw evidence of more red). Blue-seers value them lower.  
  - Trades happen at mid-prices (e.g., 5–7 chips). Red-seers buy bonds cheap; blue-seers sell high. Everyone feels clever.  

  **Predictable Pitfalls & Fixes**:  
  - **"Trading to be friendly"**: Remind them the prize is at stake. Joke: "If you trade randomly, you’ll lose to the software person’s logic!"  
  - **"Gaming the game"**: Someone might hoard bonds. No fix needed—this creates discussion later.  

  **Outcome**: Chips move, 80%+ trade. People feel like they "won" their trade.

  ---

  ### **Phase 2: Common Knowledge Dry-Up (20 min)**  
  *Goal: Flip where trade dies when acceptance is public. Feel why backing out makes sense.*  
  **Rules**:  
  - Reset chips/bonds: Everyone gets 10 chips and 1 bond. Same private marble info.  
  - **Public Market (15 min)**:  
    1. **Public Offers**: On the whiteboard, create two columns: "SELLERS" (will sell bond for 5 chips) and "BUYERS" (will buy bond for 5 chips).  
    2. **Silent Commitment**: Everyone writes "YES" or "NO" for buying and selling on paper.  
    3. **Reveal Publicly**: Tally and post the number of YESes for buyers/sellers (e.g., "8 want to sell, 9 want to buy").  
    4. **Final Decision**: Now, with this knowledge, everyone re-votes YES/NO publicly (by hand raise) for whether they’d *still* trade at 5 chips.  
  - **Trading**: If any buyers/sellers remain, they can trade.  

  **Why It Works**:  
  - Initially, many say YES (e.g., blue-seers want to sell, red-seers want to buy).  
  - After seeing public numbers (e.g., many sellers), people infer: "More sellers mean more blue-seers, so jar might be blue!" Buyers back out. Sellers get nervous and withdraw too.  
  - Trade dries up visibly. People feel queasy: "If they want to trade, maybe I shouldn’t."  

  **Predictable Pitfalls & Fixes**:  
  - **"It’s rigged!"** if no one trades: Point to the public tallies. Ask: "Why did you change your mind? What did the numbers tell you?"  
  - **Arithmetic fear**: Use whole numbers only (e.g., "5 chips"). Avoid percentages.  

  **Outcome**: 0–2 trades. The mood shifts—people sense something’s wrong.

  ---

  ### **Phase 3: Frame Disagreement Revival (20 min)**  
  *Goal: Trade returns when disagreement isn’t about evidence, but about framing.*  
  **Rules**:  
  - **New Setup**: "Forget marbles. Now we care about a tech/art project. A number from 1–10 will be drawn. Bonds pay 1 prize unit if it’s a 'success'—but success means different things to different people."  
  - Assign secret roles: 7 "TECH" (success = 6–10), 7 "ART" (success = 4–10). Don’t reveal roles.  
  - Issue 10 chips and 1 bond to each person.  
  - **Pair Trading (15 min)**: Like Phase 1. Pairs negotiate freely.  

  **Why It Works**:  
  - ART values bonds higher (70% chance of success) than TECH (50%).  
  - TECH members sell bonds to ART members for 5–6 chips. Both feel they won: TECH gets chips for a "risky" bond; ART gets "undervalued" insurance.  
  - Trade feels natural again—disagreement isn’t about the number, but what it *means*.  

  **Predictable Pitfalls & Fixes**:  
  - **Confusion about roles**: Clarify: "Your role is secret. Trade based on what *you* think the bond is worth."  
  - **"This is unfair!"**: Lean in: "Why? Is your definition of success 'truer' than theirs?"  

  **Outcome**: 70%+ trade. People see trade isn’t dead—just different.

  ---

  ### **Debrief (15 min)**  
  **Map to Concepts**:  
  1. **Phase 1**: "You traded because private info made you value bonds differently. You didn’t know if others agreed, so trade felt safe. This mirrors real life—people feel smart exploiting 'asymmetric info.'"  
  2. **Phase 2**: "When offers went public, you saw *wanting to trade* as evidence against your trade. If they’re selling, maybe they know something bad! That’s the no-trade theorem: common knowledge kills deals. Like the club joke—if everyone wants in, you wonder why."  
  3. **Phase 3**: "Trade returned because you weren’t just disagreeing on numbers—you had *different framings* (TECH vs. ART). This isn’t about evidence; it’s about what counts as a win. My hobby horse: real trade (e.g., AI stocks) often involves this frame disagreement, not just math."  

  **End on a Question**:  
  - "In real life, when two people trade, is it usually Phase 1 (hidden info), Phase 2 (shared facts but no trade), or Phase 3 (different worlds)? Can we ever know?" (This can’t be settled—it primes them to think beyond finance.)  

  **What the Activity Can’t Replicate**:  
  - **Perfect Rationality**: Real people don’t update beliefs flawlessly. In Phase 2, some might still trade—use this to discuss human irrationality.  
  - **Vague Payoffs**: The activity simplifies "frame disagreement" with clear rules. In reality, payoffs are fuzzier (e.g., "Will AI transform society?"). Admit this: "We made frames explicit, but life is messier. Maybe that’s why trade happens!"  
  - **Shared Priors**: The theorem assumes both start agreeing. In your activity, priors are shared (coin flip, uniform numbers). If someone notes, "But we all knew the jar ratio was 50/50!"—agree and stress this is key to the theorem.  

  **Final Note**: The activity makes the no-trade theorem visceral, not mathematical. People feel why common knowledge kills deals and why framing resurrects them. They walk out seeing trade as a dance of minds, not money. Run it as a "game"—keep it light, and the insights will stick.
