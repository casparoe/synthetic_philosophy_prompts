  First, I need to understand the core satirical targets: the committee's self-serving probability model, the gap between ex ante expectation and ex post reality, imposed utility functions, and logical contradictions like reversal symmetry. The challenge is showing these without stating them outright.

  The format is a guidance memo with clauses and a short FAQ. I'll invent names: "Carter University" and "Committee on Expected Welfare" sound blandly bureaucratic. The tone must stay clinical—no winking at the reader. 

  For the examples: 
  - The salary lottery (92% chance of 106% pay, 8% chance of 68%) demonstrates risk manipulation. 
  - Offhand mentions of replacing office hours with chatbots and turning the library into "well-being pods" skewer administrative fads. 

  Structural touches:
  - Clause 3.1 lets the committee choose the "most conservative" model, which ironically means the one most likely to approve changes. 
  - Clause 4.2 assigns objectors the median utility function, silencing dissent. 
  - Clause 5.2's reversal symmetry loophole (where both a change and its reversal are certified) exposes the absurdity. 

  The FAQ subtly highlights issues: Q1 handwaves actual harm ("compensated in expectation"), Q4 dismisses minority objections as "incorrect utility functions." 

  I'll keep the language dry but precise. Phrases like "welfare-enhancing stochastic remuneration" for pay cuts or "aggregate expected welfare" for gutting the library sell the satire through bureaucratic euphemism. 

  Word count is tight—aim for 800 words. The worked example needs clear math: the salary lottery’s expected value (0.92*1.06 + 0.08*0.68 = 1.02) barely clears the bar, mocking how small gains override big risks for the unlucky few. 

  Finally, ensure no prior knowledge is needed. A smart undergrad should grok the critique through the memo’s own logic. The horror is in what’s unsaid: that this system incentivizes reckless changes while pretending to be rigorously fair.
answer: |-
  **Carter University  
  Committee on Expected Welfare (CEW)  
  Guidance Note 17(b): Certification of Safe Pareto Improvements**  
  *(Revision 3.1, Effective Immediately)*  

  **1. Purpose and Scope**  
  1.1. This Guidance Note establishes the procedure for certifying a proposed policy or operational change as a Safe Pareto Improvement (SPI) under University Statute 7.45 (Expected Consent Procedure).  
  1.2. An SPI is defined as a change which, under the Committee’s Official Probability Model (OPM), yields a non-negative expected welfare impact for all affected stakeholders and a strictly positive expected welfare impact for at least one stakeholder cohort.  
  1.3. Upon SPI certification, the change may be enacted without a formal vote of the affected body. Objections based on post-implementation outcomes are inadmissible for review, as compensation occurs *ex ante* via expectation.  

  **2. Official Probability Model (OPM)**  
  2.1. The OPM is the sole authoritative framework for assessing expected welfare impacts.  
  2.2. The Committee shall select the OPM from available models adhering to peer-reviewed methodological standards. Selection prioritizes the model exhibiting the highest *conservatism index* relative to the proposed change.  
  2.3. *Conservatism Index*: A model’s propensity to minimize Type I Certification Errors (false positives) under simulated validation protocols. The model with the highest validated conservatism index for the change type shall be employed.  
  2.4. Model parameters (e.g., discount rates, risk aversion coefficients) are drawn from the CEW Meta-Repository of Calibrated Preferences (MRCP), version 2024.2.  

  **3. Stakeholder Welfare Assessment**  
  3.1. **Utility Function Assignment**:  
      *   3.1.1. Stakeholders may submit personalized, cardinal utility functions for inclusion in the MRCP via Form CEW-U1 (Validated Psychometric Instrument).  
      *   3.1.2. Stakeholders declining to submit Form CEW-U1 shall be assigned the Median Calibrated Utility Function (MCUF) for their designated cohort (e.g., "Tenured Faculty," "Administrative Staff Level 4," "Undergraduate Student - Humanities").  
      *   3.1.3. Objections based on perceived misalignment between assigned MCUF and personal preferences are non-germane to SPI certification, as the MCUF represents the revealed-preference benchmark for the cohort.  
  3.2. **Welfare Metric**: Expected utility is computed under the OPM. Tangible and intangible impacts (e.g., time savings, perceived prestige, cognitive load) must be quantifiable in utilons via CEW-approved conversion scales.  

  **4. SPI Certification Threshold**  
  4.1. For each stakeholder *i*, the expected utility under the proposed change, *E[U_i(Change)]*, must satisfy *E[U_i(Change)] ≥ E[U_i(Status Quo)]*.  
  4.2. For at least one stakeholder *j*, the inequality must be strict: *E[U_j(Change)] > E[U_j(Status Quo)]*.  
  4.3. **Bundled Improvements**: A change consisting of multiple interdependent elements shall be assessed as a single package. A negligible probability of significant gain bundled with a certain small loss may satisfy 4.1 and 4.2 if the expectation is sufficiently positive under the OPM and assigned utility functions.  

  **5. Certification Process & Implications**  
  5.1. Upon receipt of a complete SPI Proposal (Form CEW-SPI1a), the Committee will conduct the OPM analysis. Certification decisions are final.  
  5.2. **Reversal Symmetry Note**: A change and its precise reversal are assessed independently. Certification of one does not preclude certification of the other, as each is evaluated against the *then-current* status quo. The cumulative effect of dual certification may represent a compound welfare gain over the original baseline.  
  5.3. **Post-Implementation**:  
      *   5.3.1. Individuals experiencing realized welfare losses post-implementation are deemed to have received adequate compensation *ex ante* through the positive expectation inherent in the SPI certification. No *ex post* compensation mechanism exists.  
      *   5.3.2. Outcomes data shall be collected for potential future OPM refinements (MRCP versioning).  

  **6. Worked Example: Voluntary Pay Optionality Programme (VPOP)**  
  6.1. **Proposal**: Replace bi-weekly salary payments with a stochastic remuneration structure.  
  6.2. **Structure**: Each pay period, staff receive:  
      *   92% probability of 106% of base salary.  
      *   8% probability of 68% of base salary.  
      *   *Expected Monetary Value (EMV)*: (0.92 * 1.06) + (0.08 * 0.68) = 0.9752 + 0.0544 = 1.0296 (i.e., +2.96% expected value).  
  6.3. **Welfare Assessment (Staff Cohort - MCUF Assigned):**  
      *   MCUF exhibits Constant Relative Risk Aversion (CRRA) with coefficient γ = 0.8 (mild risk aversion).  
      *   *Status Quo Utility (Sure Salary S)*: *U(SQ) = S^(1-γ) / (1-γ)*.  
      *   *VPOP Expected Utility*: *E[U(VPOP)] = 0.92 * (1.06S)^(1-γ)/(1-γ) + 0.08 * (0.68S)^(1-γ)/(1-γ)*.  
      *   **Calculation Result**: *E[U(VPOP)] > U(SQ)* for all S > 0 under γ=0.8. The positive EMV outweighs the disutility of risk at the cohort's calibrated aversion level.  
  6.4. **Certification Outcome**: SPI Certified. VPOP enacted university-wide. Staff experiencing the 68% outcome are reminded their higher probability of 106% constituted prior compensation.  

  **7. Illustrative Certified SPIs (Partial List)**  
  *   **Initiative 2023-44:** Replacement of faculty office hours with an AI-driven pedagogical support chatbot ("ProfBot v4.1"). Certified based on expected time savings for faculty (converted to research/utilon gain) outweighing the marginal expected decrease in student support satisfaction (per MRCP student cohort MCUF).  
  *   **Initiative 2024-07:** Phase 1 conversion of the West Wing Reading Room into Multisensory Well-being Pods. Certified based on expected gains in student mental health utilons (per MRCP "Student Stress Index") exceeding the expected loss of study-space utilons for traditional-library-preference students, whose cohort MCUF showed lower marginal utility for physical books vs. digital access.  

  ---

  **FREQUENTLY ASKED QUESTIONS (FAQ)**  

  **Q1: I was harmed by a certified SPI change. Why is there no recourse?**  
  A1: The SPI certification process ensures that, *based on the best available predictive model (OPM) and calibrated preferences (MRCP)*, you were more likely to gain than lose, and your expected welfare increased. The realization of a negative outcome does not invalidate the *ex ante* compensation achieved through the positive expectation. Recourse would constitute double compensation.  

  **Q2: How is the "most conservative" OPM chosen?**  
  A2: The Committee rigorously tests candidate models against historical datasets. The model demonstrating the highest statistical power to *avoid certifying changes that would later show net negative outcomes* in simulation (highest "conservatism index") is selected. This prioritizes stakeholder protection by minimizing false SPI certifications.  

  **Q3: What if I believe my utility function differs significantly from my cohort's MCUF?**  
  A3: You are encouraged to submit Form CEW-U1. Failure to do so signifies acceptance of the MCUF as an adequate proxy for the purposes of aggregate welfare assessment and SPI certification. Certification relies on representative cohort benchmarks.  

  **Q4: Can an SPI be certified if a minority strongly objects, claiming it harms them?**  
  A4: Yes, provided the OPM analysis, using the *correctly calibrated utility functions* (personal or MCUF), shows non-negative expected impact for all, including the objectors. Strong objections often indicate reliance on non-standard or miscalibrated utility assessments not supported by the MRCP validation studies. The expectation criterion supersedes individual forecasts.  

  **Q5: How can both a change and its reversal be SPI certified? (Clause 5.2)**  
  A5: SPI certification is always relative to the *current* status quo. A reversal assessed *after* the initial change is implemented represents a different policy shift relative to a new baseline. It is mathematically possible for both transitions (A->B and B->A) to yield non-negative expected welfare changes for all stakeholders under the OPM when evaluated at their respective decision points. This reflects the dynamic potential of welfare-enhancing pathways.  

  **Q6: Where can I learn more about utilon conversion for intangible impacts?**  
  A6: Consult the *CEW Handbook of Utilon Conversion Metrics* (Intranet: WELFARE/UTILON/HB2024), particularly Appendix D: "Cognitive Load Equivalents" and Appendix G: "Prestige and Morale Indices."  

  ---  
  *Committee on Expected Welfare - Ensuring Progress Through Rational Expectation*
