  We are drafting a decision memo for the Meridian Settlement Exchange's rules committee.
   The proposal: establish an escrow registry for agents' source code to enable conditional cooperation.
   Two variants tested: 
     (a) Textual identity: cooperate iff counterparty's source code is textually identical to own.
     (b) Proof-based: cooperate iff can prove (within time) that counterparty will cooperate.

   Red team findings:
     (i) For textual identity: cooperation only when source is identical; fails for behaviorally equivalent rewrites.
     (ii) For proof-based: cooperation only when agents share the same verification kernel and can find the same proof in time.

   Objections to address:
     1. Chief economist: This mechanism allows conditional cooperation but also conditional punishment. 
        Agents could defect against non-registrants, coercing participation and forming a cartel, which is antithetical to an exchange.
     2. Two other members: Regulation should be behavioral (what the agent does) not syntactic (source code) or contingent on proof search.

   We must decide: adopt, reject, or adopt with conditions. We must also specify what a registered agent does when the counterparty has not registered.

   Considerations:
     - The current state: nearly everyone free-rides (defects).
     - The goal: to increase cooperation (honoring the protocol) without creating unintended consequences.

   Drafting the memo:

   Structure:
     I. Introduction and background
     II. Proposal summary
     III. Red team findings
     IV. Addressing objections
     V. Decision and rationale
     VI. Rollout plan and review date

   Decision options:
     - Adopt the registry? Which variant? Or neither?
     - Conditions? What to do about non-registrants?

   Given the findings and objections, note:
     - The textual identity variant is brittle (only identical code works) and may not be practical (firms may have legitimate reasons for different codebases, and even minor variations break it).
     - The proof variant is also brittle (depends on shared kernel and proof search) and may be computationally expensive.

   Objection 1 (cartel formation) is serious: if registered agents defect against non-registered ones, then non-registered agents are forced to either register or be defected against. This could coerce registration and create a closed club. However, note that if we do nothing, free-riding remains the norm and cooperation fails.

   Objection 2 (behavioral vs. syntactic) has merit: what matters is behavior, but the problem is that without a commitment mechanism (like source code escrow) it's hard to verify behavior in a one-shot interaction. The current system doesn't allow for repeated interactions to build trust.

   Alternative idea: Perhaps we can design a behavioral rule without source code escrow? But the proposal is about using escrow to enable conditional strategies.

   However, the red team findings show that the proposed mechanisms are fragile.

   Possible compromise: 
     - Adopt the registry but with conditions that address the cartel concern and the behavioral concern.

   How to address the cartel concern?
     - We could require that registered agents must cooperate with non-registered agents? But then what's the incentive to register? 
     - Alternatively, we could prohibit discrimination against non-registrants? Then the registry would only be used for the conditional cooperation among registrants, without punishing non-registrants.

   Proposed rule for when counterparty has not registered: 
     - If we want to avoid coercion, we might require that a registered agent must still honor the protocol (cooperate) with a non-registered agent? But then the registry doesn't help against non-registrants. And if non-registrants are free-riding, then registered agents would be exploited.

   Alternatively, we could allow registered agents to defect against non-registrants? But that is exactly the cartel concern.

   Another possibility: do not allow the registry to be used for conditional strategies that target non-registrants. Instead, the registry is only for enabling cooperation between two registrants. And for non-registrants, the default rule applies (which currently leads to free-riding). But then the registry might still be adopted by some to enable cooperation among a subset, and non-registrants would be left in the free-riding equilibrium. This doesn't coerce registration because a non-registrant can still trade with other non-registrants (and they both free-ride) or with registrants (who, by rule, might be required to cooperate? or defect?).

   Let's reframe:

     Option A: Registered agents cooperate with everyone (including non-registrants). Then why register? It doesn't help because non-registrants will still defect. So no incentive to register.

     Option B: Registered agents defect against non-registrants. Then non-registrants are forced to register or be defected against. This is coercive and cartel-like.

     Option C: The exchange does not regulate the behavior of agents towards non-registrants. Then each registered agent can choose its own strategy for non-registrants. But that might lead to a mix and possibly still coercion if all registrants choose to defect against non-registrants.

     Option D: Require that registered agents must not condition their behavior on registration status? Then the registry is only for the internal conditional cooperation between two registrants? But then how? The conditional cooperation rule (textual or proof) only applies when both are registered. For a non-registered counterparty, the agent must use a fixed strategy (say, defect? or cooperate?).

   But note: the proposal is about letting agents condition on the counterparty's code. If the counterparty is not registered, then the agent doesn't have the code to condition on. So the agent must have a default behavior for non-registrants.

   How about: 
     - If the counterparty is registered, then the agent uses the conditional rule (textual or proof) to decide.
     - If the counterparty is not registered, then the agent must cooperate? or defect? 

   If we require cooperation with non-registrants, then non-registrants can free-ride on registrants (since they will cooperate regardless). Then registrants are worse off. So no one registers.

   If we allow (or require) that registered agents defect against non-registrants, then non-registrants are punished and have an incentive to register. But that is the cartel.

   So we are stuck.

   However, note that without the registry, everyone defects. With the registry and if we allow defection against non-registrants, then we might get two classes:
     - Registrants: they cooperate with each other (if they can, per the brittle condition) and defect against non-registrants.
     - Non-registrants: they defect against everyone.

   Then non-registrants get low payoffs (since when they trade with registrants, they get defected against, and when they trade with other non-registrants, they both defect and get low). Registrants get high payoffs when trading with each other (cooperation) and low when trading with non-registrants? But wait: if a registrant trades with a non-registrant, the registrant defects. So the registrant gets the temptation payoff (high) and the non-registrant gets the sucker payoff (low). But then non-registrants are motivated to become registrants to avoid being the sucker and to get the cooperative payoff when trading with registrants.

   However, the cartel concern is that this forces everyone to register and use the same strategy. But what if there are multiple groups? The textual identity variant only allows identical code to cooperate. So if there are multiple firms, they must all use the same code? That seems anti-competitive.

   The proof variant might allow different kernels, but the red team found that even sound kernels might not find the same proof in time. So it's also brittle.

   Given the brittleness and the cartel concern, and the behavioral objection, we might consider rejecting the proposal? But then we are stuck with free-riding.

   Alternatively, we might adopt the registry but with the following conditions:

     - We adopt the proof variant (which is more flexible than textual identity) but require that the verification kernel is standardized by the exchange? Then all agents must use the same kernel? But that might address the brittleness in the proof variant? However, the red team found that even with the same kernel, the proof might not be found in the time budget? But if we standardize the kernel and the proof search algorithm, then at least for identical agents (or agents that are provably equivalent) it might work? But note: the red team says that cooperation fails between two agents that are behaviorally equivalent but not identical in code? So the proof variant might still fail for behaviorally equivalent rewrites? Unless the kernel is designed to recognize behavioral equivalence? That might be very hard.

     - To address the cartel concern: we could prohibit registered agents from defecting against non-registrants? But then we are back to the problem that non-registrants can free-ride. Alternatively, we could require that the exchange must not allow discrimination based on registration? Then the registry would be purely for the purpose of enabling cooperation between two willing registrants, and for non-registrants, the agent must behave as if there was no registry? But that might mean: for non-registrants, the agent uses a default strategy (say, defect? because without knowing the code, it can't trust). But if the default is defect, then non-registrants are punished and we are back to coercion.

     - Another idea: the exchange could require that all agents must register? Then we avoid the issue of non-registrants. But that might be heavy-handed and could be opposed by firms that consider their code proprietary.

   Given the complexity and the objections, and the brittleness of the mechanisms, we might recommend:

     - Adopt the registry on a trial basis, but only for the proof variant and with a standardized verification kernel provided by the exchange. This kernel would be designed to be efficient and to recognize a broad class of equivalent agents. We also set a requirement that the kernel must be able to prove cooperation for any agent that is behaviorally equivalent to the standard agent? But this is challenging.

     - To address the cartel concern: we require that registered agents must cooperate with non-registrants. Why? Because otherwise we create a cartel. But then non-registrants get the benefit of cooperation without having to register? That undermines the registry. Alternatively, we could allow the registry but not permit agents to condition on registration status? Then what? The agent only conditions on the code if it is available? But if the counterparty is not registered, the code isn't available, so the agent must have a default. And we set the default to cooperate? That would be exploited.

     - Alternatively, we require that the default behavior for non-registrants is defect? Then without the registry, the agent defects. But then non-registrants are punished. To avoid coercion, we might say that the registry is optional and that we do not mandate behavior towards non-registrants? But then we are back to allowing coercion.

   After weighing the options, I propose:

     We reject the proposal in its current form because:
       - The mechanisms are brittle (as shown by the red team).
       - The cartel concern is valid and significant.
       - The behavioral objection is valid: we should aim for behavioral equivalence, not syntactic.

   But we don't want to leave the status quo. So we might suggest an alternative direction:

     We direct the technical team to explore a behavioral approach. For example, could we have a system where agents commit to a strategy in a verifiable way without revealing source code? (e.g., using zero-knowledge proofs that the agent will behave cooperatively?) But that might be complex.

     Alternatively, we could consider a reputation system? But the exchange is automated and one-shot.

     Another idea: require agents to post a bond that is forfeited if they defect? But that might require a trusted mechanism to detect defection.

   Given the constraints, I think we have to make a decision on the proposal.

   Decision:

     We reject the proposal to establish the escrow registry at this time.

     Reasons:
       - The tested mechanisms (textual and proof-based) are too brittle to reliably foster cooperation, as they break down under behaviorally equivalent rewrites or when proof search budgets are exceeded.
       - The registry mechanism, as designed, risks creating a cartel by enabling registered agents to coerce participation by defecting against non-registrants, which is contrary to the open and competitive purpose of the exchange.
       - The committee agrees with the objection that regulation should focus on behavior, not on the syntactic form of the agent's code or the vagaries of proof search.

     However, we recognize the urgent need to address the free-rider problem. Therefore, we will:

       - Establish a working group to develop a behavioral standard and a verification mechanism that does not rely on source code escrow. The working group will report back in six months.
       - In the interim, we will explore the feasibility of a bond-posting mechanism or other incentive-compatible designs.

     Rollout: N/A (rejected).

     Review: The working group will report in six months.

   But what if we want to adopt with conditions? Let's consider:

     Adopt the proof variant with a standardized kernel and with a rule that prohibits defection against non-registrants? Then:

       - Registered agents must cooperate with non-registrants? But then non-registrants can defect without consequence. So registrants are exploited and the registry fails.

     Alternatively, we could make registration mandatory? Then we don't have non-registrants. But:

       - The brittleness remains: if two agents have different kernels (even if standardized, they might be compiled differently) or if the proof search fails, then they defect even though they are both registered and willing to cooperate.

     And we would have to address the behavioral objection: by standardizing the kernel and the proof search, we are effectively making behavior the criterion? But the proof search is trying to establish that the agent will behave cooperatively. However, if the proof fails due to time, then an agent that would have cooperated is defected against. So it's not purely behavioral.

   Given the challenges, rejection seems the most prudent.

