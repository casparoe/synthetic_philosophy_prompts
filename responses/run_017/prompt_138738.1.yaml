prompt: |-
  I work as the scientific secretary to the programme-grant panel of a national research council. We award five-year grants to what we call programmes rather than projects: a group gets funded to pursue a line of work, and at the mid-term and renewal points we decide whether to continue, cut, or redirect. The volume is real: about forty proposals a cycle, roughly ninety minutes of panel time each, a panel made of working scientists and clinicians with no philosophy of science training and no patience for it, and a requirement that every decision be written up in a page of plain language that a losing applicant can read without needing a primer. Since a row a few years ago about metric-gaming, we are also forbidden to use impact factors, citation counts, or h-indices anywhere in the deliberation, which removes the proxy everyone actually relied on and has left the panel falling back on vibes about whether a field feels exciting.

  I want to turn Lakatos's methodology of research programmes into something we can actually run. I read him once in graduate school and remember the skeleton: a programme has a hard core its practitioners will not let be refuted, a belt of auxiliary hypotheses that absorbs the damage, a negative heuristic telling them what not to aim at, and a positive heuristic that is supposed to be a standing plan for building models rather than a list of repairs. A programme is progressive when its successive versions predict something new and some of the new things hold up, and degenerating when it only ever patches after the fact, with the belt growing to fit data everyone already had. Elimination is comparative and slow: a rival has to explain what its predecessor explained plus something more, and Lakatos says somewhere that there is no such thing as instant rationality, that a programme can only be appraised with hindsight over decades. My own temptation is crude: count the work packages that predict something not yet known against the ones that merely accommodate an anomaly someone already published, and fund whichever number is bigger. I suspect that is too crude in at least three ways — it rewards volume of prediction over weight, it has no answer for a group proposing to spend five years building the instrument or the mathematics needed to make the prediction at all, and it gives us nothing for a consortium that generates predictions continuously but absorbs every failure as a technicality, which looks to me less like a programme than like machinery for never being wrong.

  So please give me the procedure itself, in the order we would run it: the questions in sequence, what counts as a sufficient answer to each, where it returns a clear no, and where it has to stop and hand the decision to a person because the issue is one of values or temperamental patience rather than method. I need it to work from the documents we actually have — the proposal, the track record section, and the group's own account of what they would abandon if forced — and to say how to recover the hard core and the positive heuristic from those, including what to do when a proposal is written in a way that conceals them, since applicants quickly learn that admitting to a hard core sounds dogmatic. I would also like it to be honest about what it cannot do: I assume it cannot compare programmes in different fields, cannot say whether a core is true, and cannot tell us how long to wait, and I would rather have those limits named in the write-up than have a panel member discover them mid-meeting. Then run it on three anonymised cases from our last cycle. Programme A is a thirty-year-old line of work, still prolific, whose last three novel predictions failed and which now proposes another two years of re-deriving old measurements under a revised correction term; the panel reveres its founder, who is retiring, and I do not want the answer I expect. Programme B proposes to point an automated pipeline at a large class of datasets, will produce forecasts constantly, and treats every miss as a specification issue to be retrained away; I am unsure whether this is even an appraisable programme or whether the procedure should return a different kind of verdict, something like nothing here to evaluate. Programme C has produced no confirmed novel fact in nine years and says the blocking computation is not yet feasible, but its five-year plan is a genuinely ordered sequence of simplified models that would eventually make the prediction, and it is the one case where I think hindsight might vindicate them. If the procedure's verdicts on these three are ones I should overrule, say so, and say which verdict goes and why.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They work as a scientific secretary for a grant panel that funds research programmes. The panel deals with about 40 proposals per cycle, each getting 90 minutes of discussion. The panel members are scientists and clinicians without philosophy of science training, and they need to write plain-language decisions. They can't use bibliometrics anymore, so they're relying on "vibes," which isn't ideal. The user wants to apply Lakatos's methodology of research programmes to make the evaluation more structured.

  First, I need to recall Lakatos's main ideas: hard core, protective belt, positive/negative heuristics, and the distinction between progressive and degenerating programmes. The user mentioned a crude method of counting predictive vs. accommodating work packages but sees flaws in that approach. They need a practical procedure that fits their constraints.

  The user's explicit request is for a step-by-step procedure with clear questions, sufficient answers, and limitations. They also want it applied to three anonymized cases. But deeper needs might include wanting legitimacy in decisions, reducing panel disputes, ensuring fairness to applicants, and preventing metric-gaming. They might also need to manage panel dynamics, especially with revered founders or contentious cases.

  For the procedure, I need to translate Lakatos into actionable steps. Each step should have a clear question, what to look for in documents, and decision points. It's crucial to handle cases where the hard core is hidden. The limitations section is vital to set realistic expectations.

  Now, the three cases:
  - Programme A: Established, failed predictions, proposes re-deriving old measurements. Panel reveres founder. Crude method might reject, but they want a fair assessment.
  - Programme B: Automated pipeline, constant forecasts, retrains after misses. Is this even a Lakatosian programme?
  - Programme C: No novel facts, claims computational infeasibility, has a step-by-step plan. Might be vindicated later.

  I need to ensure the procedure handles each case appropriately. For A, distinguishing between degeneration and temporary setbacks. For B, determining if it's a research programme or just a tool. For C, evaluating the heuristic's strength despite lack of predictions.

  Also, the user mentioned past issues with metric-gaming. The procedure must avoid creating new loopholes. Emphasize qualitative judgment over numbers. The write-up should be transparent so applicants understand decisions.

  Finally, the procedure must respect time constraints. Steps should be efficient, using existing documents without requiring extra analysis. Panelists need clear guidance to avoid philosophical debates.
answer: |-
  Here's a procedural implementation of Lakatos's Methodology of Scientific Research Programmes (MSRP) tailored to your grant panel's constraints, designed for efficiency, clarity, and defensibility. It focuses on **identifying progressive problem shifts** within a five-year horizon, using only your available documents.

  **The Core Procedure: 5 Sequential Questions**

  1.  **Question: Does this proposal describe a coherent *Research Programme* (RP) with an identifiable *Hard Core*?**
      *   **Where to look:** Proposal (Aims, Background), Group's "abandon if forced" statement, Track Record (consistency of past work).
      *   **Sufficient Answer:** A clear, concise statement (or inferable set of non-negotiable principles) that defines the programme's fundamental assumptions. Examples: "Genes are the primary unit of inheritance," "Consciousness arises from integrated information," "Market efficiency holds in the long run." Look for what the group *would not give up* even under pressure (their "abandon" statement is key here).
      *   **Clear No:** Vague goals ("Understand complex system X"), purely technological aims ("Build a better sensor"), or disconnected projects lacking a unifying core theory. *Verdict: Reject - Not a Research Programme.* (This filters out "Project B" type proposals).
      *   **Values/Temperament Stop:** If the core is highly controversial *within its field* (e.g., string theory vs. loop quantum gravity debates), the panel must judge if funding it is strategically valuable despite controversy. The procedure cannot resolve fundamental scientific disputes.

  2.  **Question: Does the proposal articulate a credible *Positive Heuristic* for the *next five years*?**
      *   **Where to look:** Proposal (Work Plan, Methodology, Timelines), Track Record (evidence of following past plans).
      *   **Sufficient Answer:** A specific, ordered sequence of models, experiments, or theoretical developments *aimed at generating novel predictions or explanations*. It should show *how* the core leads to new questions/methods, not just list tasks. Look for terms like "We will develop model X to predict Y," "Test implication Z of core theory," "Extend framework A to domain B."
      *   **Clear No:** A plan dominated by: applying existing tools to new datasets without novel theoretical insight, purely retrospective analysis ("re-analyze old data"), or vague "exploratory" work lacking a predictive/explanatory target. *Verdict: Reject - Lacks Progressive Trajectory.*
      *   **Values/Temperament Stop:** Judging the *feasibility* of the heuristic's steps (especially for ambitious/computational work like "Programme C"). The procedure assesses the *plan's structure*, not its technical achievability within 5 years – that requires panel expertise.

  3.  **Question: Does the track record and current plan demonstrate *Progressive Problem Shifts*? (Focus on the last ~5-10 years and the next 5)**
      *   **Where to look:** Track Record Section (Key outputs), Proposal (Novelty claims, justification for new work), Previous reports (if mid-term/renewal).
      *   **Sufficient Answer:** Evidence that past work generated *novel* predictions/explanations (even if some failed), *and* the new plan explicitly aims for further novel predictions/explanations. Weight matters: One major novel prediction outweighs several minor ones. Accommodation is acceptable *if* it clearly enables the *next* novel prediction (e.g., refining instrumentation for "Programme C").
      *   **Key Lakatosian Filter:** **Distinguish Novel Prediction from Accommodation/Refinement:**
          *   **Novel (Progressive):** Predicting/testing something *not* known/explained when the hypothesis/model was formulated (even if result is negative). *Look for:* "Based on core/heuristic, we predict X in system Y (which hasn't been studied this way)." "Our model implies Z, contradicting previous view."
          *   **Accommodation/Refinement (Potentially Degenerating):** Modifying the belt *only* to fit existing data/knowledge *without* generating a new, testable implication. *Look for:* "We adjust parameter A to fit dataset B (already published)." "We apply our standard method to slightly different case C."
      *   **Clear No:** A track record showing *only* accommodation/refinement *and* a new plan proposing *only* more accommodation/refinement (e.g., endless parameter tweaking, re-deriving old results under new assumptions without novel targets - "Programme A" pattern). *Verdict: Reject - Degenerating Programme.*
      *   **Values/Temperament Stop:** Interpreting ambiguous cases. Was a "failed prediction" a genuine test of the core/heuristic, or a technical failure? How much past accommodation is "too much" before labelling degeneration? This requires expert judgment. *The procedure flags concerning patterns but cannot automate this verdict.*

  4.  **Question: Does the proposal identify a meaningful *Negative Heuristic*?**
      *   **Where to look:** Proposal (Limitations, Scope, "abandon if forced"), Track Record (avoidance of specific dead-ends).
      *   **Sufficient Answer:** Explicit statements about what problems/questions the programme *deliberately avoids* or considers off-limits *because they threaten the hard core*. This demonstrates awareness and strategic focus. Examples: "We do not consider explanations involving vital forces," "We exclude effects below scale X," "We focus on mechanism Y, not symptom Z."
      *   **Not Fatal if Weak:** A weak negative heuristic is less critical than a missing progressive shift. Its absence doesn't mandate rejection but might indicate less strategic clarity.
      *   **Clear No:** Not applicable for rejection. Use absence as a cautionary note for the panel.

  5.  **Question: Is the programme *Comparatively Progressive* relative to relevant alternatives? (Only for RPs in the *same field* addressing *similar problems*)**
      *   **Where to look:** Panel knowledge (crucially!), Proposal (Background/Literature review - implicit competitors).
      *   **Sufficient Answer:** The RP explains key phenomena its main rival(s) explain *plus* has a track record or plan suggesting it can explain something significant the rival(s) cannot (or handle anomalies better).
      *   **Limits Honesty:** **This procedure CANNOT compare programmes across disparate fields.** It cannot judge the "truth" of the hard core. It cannot dictate *how long* to fund a struggling programme with a strong heuristic ("Programme C"). Panel must decide based on strategic importance, field maturity, and patience.
      *   **Values/Temperament Stop:** Defining the "relevant" rivals and judging comparative progress requires deep field-specific knowledge and panel debate. The procedure provides the Lakatosian *framework* for comparison ("explains more, novel predictions") but not the answer.

  **Procedure Output:** A structured summary for the panel:
  1.  Is it an RP? (Y/N - If N, reject)
  2.  Clear Positive Heuristic? (Y/N - If N, reject)
  3.  Progressive Shifts (Recent/Planned)? (Evidence Summary: Novel Predictions vs. Accommodation)
  4.  Negative Heuristic Identified? (Y/N/Weak)
  5.  (If Applicable) Notes on Comparative Progress vs. Rivals (Field-Specific Panel Judgment)
  6.  **Procedure Verdict Suggestion:** (Fund / Reject / Flag for Panel Scrutiny (Degeneration Risk/Feasibility/Cross-Field)) + Key Reason (e.g., "Degenerating trend," "Strong heuristic, no recent progress," "Not an RP").
  7.  **Explicitly Stated Limits:** "This assessment does not judge: (a) Ultimate truth of the core, (b) Feasibility of technical steps, (c) Strategic value of the field, (d) Comparisons across fundamentally different fields, (e) How long to wait for success."

  **Application to Cases:**

  *   **Programme A (30 years, revered founder, failed predictions, proposes re-derivation):**
      *   Q1: **Yes.** Long-standing RP, clear hard core.
      *   Q2: **Unclear/Weak.** "Re-deriving old measurements under revised correction term" sounds like classic belt-adjustment/accommodation. Where is the *novel* target for the *next* 2 years? Proposal likely lacks this.
      *   Q3: **Degenerating Trend.** Last 3 novel predictions failed. New plan proposes only refinement/accommodation of *existing* data (re-derivation under new term). No new predictions planned. High accommodation/low novelty volume and weight recently and planned.
      *   Q4: **Likely Yes.** Established programme usually has implicit/explicit negative heuristic.
      *   Q5: **Panel Judgment.** Might still be dominant in field, but comparative progress is doubtful.
      *   **Procedure Verdict Suggestion: Reject - Degenerating Programme.** Flagged for Panel Scrutiny due to founder reverence. **You should NOT overrule this.** Reverence isn't scientific progress. Funding degeneration rewards past glory, not future potential. The lack of planned novelty is the critical flaw. The procedure exposes the vibes as sentimentality.

  *   **Programme B (Automated pipeline, constant forecasts, retrains misses):**
      *   Q1: **No.** What is the *hard core*? Is it a core theory about the world, or just a commitment to a specific ML technique? Where are the non-negotiable principles? "Point pipeline at datasets" is a method, not a core. The "retrain away misses" suggests no hard core exists to protect – everything is adjustable belt. Likely a technological project or tool-building exercise.
      *   **Procedure Verdict Suggestion: Reject - Not a Research Programme.** (Stops at Q1). **You should NOT overrule.** This is precisely what Q1 is designed to catch. It might be useful, but it's not an RP evaluable by Lakatosian criteria. Fund it under a different scheme if appropriate (tools/infrastructure).

  *   **Programme C (No novel facts in 9 years, computational hurdle, ordered sequence):**
      *   Q1: **Yes.** Presumably has a clear hard core (e.g., specific theoretical framework).
      *   Q2: **Strong Yes.** "Genuinely ordered sequence of simplified models... eventually make the prediction" is a *textbook positive heuristic*. Clear, staged plan leading to a novel prediction.
      *   Q3: **Stalled, but Heuristic Strong.** Track record shows no *confirmed* novel facts (accommodation/technical hurdles dominate). However, the *plan* explicitly aims for a major novel prediction via a credible path. Past work was likely necessary preparation (building blocks for the heuristic).
      *   Q4: **Probably Yes.** Implied by the focused model sequence.
      *   Q5: **Panel Judgment.** Is this the *only/best* RP tackling this core problem? Does its heuristic seem uniquely promising?
      *   **Procedure Verdict Suggestion: Fund - Strong Heuristic Despite Recent Stasis.** Flagged for Panel Scrutiny on **feasibility** (can they *really* do the computation in 5 years?) and **patience** (is the field willing to wait longer?). **You should NOT overrule.** This is where Lakatos shines: rewarding programmes with a clear, progressive *plan* even after a fallow period. The heuristic provides the rational basis for funding despite lack of recent novel successes. It addresses your concern about "machinery for never being wrong" – here, the prediction is the explicit goal, not avoided.

  **Why the Verdicts Stand:**

  *   **A:** Correctly identifies degeneration masked by prestige. Funding it rewards past success, not future potential. The procedure forces the panel to confront the lack of novelty in the *plan*.
  *   **B:** Correctly identifies a non-programme. Applying Lakatos here is incoherent. It needs different criteria.
  *   **C:** Correctly identifies a stalled programme *with a robust plan for progress*. This is the high-risk/high-reward case Lakatos justifies funding based on the heuristic's promise. The panel's job is to vet feasibility, not overrule the programme's structure.

  **Key Advantages of this Procedure:**

  1.  **Focus on Future Potential:** Centers on the *plan* (positive heuristic) and its link to novelty.
  2.  **Filters Clearly:** Rejects non-programmes (B) and degenerating programmes (A) early.
  3.  **Demystifies Vibes:** Turns "exciting field" into concrete questions about novel predictions and strategic heuristics.
  4.  **Uses Available Docs:** Leverages the proposal, track record, and crucially, the "abandon if forced" statement.
  5.  **Honest About Limits:** Explicitly states what it cannot do (cross-field, truth, feasibility, timing), preventing overreach.
  6.  **Defensible Write-ups:** Provides clear reasons ("Lacks identifiable hard core," "Plan shows only accommodation, no novel predictions," "Strong heuristic to overcome computational barrier") understandable to applicants.
  7.  **Resilient to Obfuscation:** The "abandon if forced" question and focus on the *predictive intent* of the work plan help pierce vague proposal writing. If they can't say what they *wouldn't* give up, or if the plan lacks novel targets, it flags a problem.

  **Implementation Tips for the Panel:**

  *   **Brief Training:** Frame it as "Assessing Scientific Trajectory: Novelty, Strategy, and Core Ideas" – avoid "Lakatos" or "philosophy."
  *   **Template Summary:** Provide a simple form for panelists to fill per proposal based on the 5 questions during pre-reading.
  *   **Focus Discussion:** Use the procedure's verdict/summary as the starting point for the 90-minute discussion, focusing debate on the flagged "Stop" points (feasibility, comparative progress, patience).
  *   **Write-Up Language:** Translate verdicts into plain English: "The programme's recent work and future plan focus on refining existing models to fit known data, rather than testing new predictions. While the core ideas are respected, this approach is unlikely to yield significant new insights in the next funding period." (For A) / "The proposal describes a powerful tool for generating forecasts but does not present a core set of testable scientific ideas about how the world works that the tool is designed to evaluate. This is better suited for infrastructure funding." (For B) / "The programme has faced significant technical challenges preventing recent novel discoveries. However, it presents a clear, step-by-step scientific plan specifically designed to overcome these hurdles and test a major new prediction within the grant period. This represents a credible path to important new knowledge, justifying continued support." (For C)

  This procedure operationalizes Lakatos's core insight – fund programmes actively seeking novel discoveries through structured plans – while respecting your panel's practical constraints and need for transparent, defensible decisions.
