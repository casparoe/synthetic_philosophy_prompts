prompt: |-
  I am a retired experimental physical chemist — four decades of gravimetric and spectroscopic work, most of it spent on the tedious business of getting a number you can trust out of an instrument — and for the last two years I have been attending a philosophy reading group at the local university. We have recently worked through Quine's attack on the distinction between analytic and synthetic truths. I follow the argument, or think I do, but it does not seem to me to describe a kind of principle that I met with constantly in the laboratory, and I have rashly agreed to give the group a twenty-minute talk in the spring. So I would like to know whether what I have in mind already has a settled name and a settled analysis, or whether I would be inventing a category on the spot.

  The principles I mean have a peculiar double character. First, no experiment performed inside the practice could have refuted them, because every such experiment deploys them. The constancy of atomic weights is my stock example: the whole business of inferring a composition from a weighing presupposes that chlorine, say, has the same atomic weight whatever its source, so no measurement internal to analytical chemistry could have told against it — you would have had to use it in order to test it. Second, they are nevertheless not definitions and not conventions. Their denials are perfectly intelligible, the successor practice that rejects them is coherent, and when they go we take ourselves to have abandoned something substantive about the world rather than to have agreed to speak differently or to adopt a new scale of units; the discovery of isotopes was not a linguistic decision. Third, and this is the feature I find hardest to place, they are not held in place by decision either. Nobody at the time could have stipulated otherwise, because the principle is not written down in the theory so much as built into the instruments, the data-reduction routines, the error analysis, and what a graduate student is taught to see when she looks at a chart. I would say the same of the assumption that a reading is a property of the sample and not of the measuring arrangement — that the value you record belongs to the thing measured and does not depend on what else you chose to measure alongside it. I am told that quantum mechanics is very widely read as denying precisely that, which would make it a second instance, and the additivity of weights in gravimetric work a third. Fourth: when such a principle fails, the failure is discovered from within the very practice it makes possible, using apparatus that itself presupposes it — the variability of atomic weights was found with instruments whose calibration assumed them constant.

  So: is there an established concept, or a literature, for this configuration — untestable from inside yet substantive, not held by convention, not held by fiat, and found to fail from within — and if so, what belongs to it and what does not? I am not asking for references, which I can chase myself; I want the carving. Specifically: which of my four features is load-bearing and which are incidental; whether the historical replacement of such a principle is genuinely different from its having been refuted; and how the configuration relates to the near neighbours a non-specialist keeps blundering into — to the Quinean claim that nothing is immune to revision, which seems to me to be about a different axis altogether, since immunity is not what I am pointing at; to the idea that a framework carries principles that are constitutive of it, or a priori only relative to it; to a paradigm in Kuhn's sense or to the protected core of a research programme, both of which are held in place by a communal decision where my principles appear to be held in place by the plumbing; and to the thought that some propositions simply stand fast for us without resting on evidence at all. If the fit with each of these is imperfect, I would rather be told exactly where it fails than be handed a label. And if there is no established term, I would be grateful for a coined one, with a definition and a boundary case or two — for instance, the case where a practice's own improving accuracy eventually violates the principle outright, which is the case where I am least confident that my description still applies.
reasoning: |-
  Okay, let's start by understanding the user's background. He's a retired experimental physical chemist with decades of hands-on lab experience, now diving into philosophy. His specific concern is about principles in science that don't fit neatly into existing philosophical categories like analytic/synthetic or conventional truths. 

  He's identified four key features of these principles: (1) They're untestable within their own practice because they're presupposed in every experiment. (2) They're substantive claims about the world, not mere definitions. (3) They're embedded in the material and methodological "plumbing" of science rather than being explicitly stated. (4) Their failure gets discovered from within the very practice they enable. 

  Hmm. The challenge is finding a philosophical concept that captures this unique configuration. Let me mentally scan the landscape. Quine's web of belief? Close but too holistic - he's describing something more localized. Kuhnian paradigms? Involves communal decisions, whereas his principles are "in the plumbing". Carnap's linguistic frameworks? Too convention-based. Wittgenstein's "hinge propositions"? Too psychological, not material enough. 

  *Pauses to reframe* What makes his cases special is their physical embeddedness. When atomic weight constancy failed, it wasn't just a theory change - it required rebuilding the literal instruments. That material dimension feels crucial. Maybe we need to coin something? "Embedded presuppositions" comes to mind, but that's too vague. "Material-constitutive principles"? Better - emphasizes they're both world-oriented and practice-enabling. 

  Testing against his isotope example: Yes, atomic weight constancy was materially constitutive for gravimetric chemistry. The spectrometers that later detected isotopes weren't designed to test it - they assumed it operationally. Perfect fit. Quantum non-contextuality? Also fits - the assumption that measurements reveal pre-existing properties is baked into classical instruments. 

  *Checks boundary cases* What about when improved precision violates a principle? Like Newtonian mechanics failing at relativistic speeds. Here it's trickier - the principle wasn't materially constitutive in the same way. Maybe the distinction is whether the principle is necessary for the practice to function at all, not just approximately true. 

  For his talk, I should stress three things: First, the novelty lies in how these principles are held - not by convention or evidence but by material instantiation. Second, their failure is an engineering crisis, not just theoretical. Third, this creates a distinct revision pathway: not falsification but infrastructural collapse. 

  *Makes note* Must address why Quine isn't sufficient: His holism flattens all revision types, whereas our chemist observes a special category where revision requires retooling the lab itself. That's the carve-out.
answer: |-
  Your description captures a profound and under-analyzed category in the philosophy of science. While no established term perfectly encompasses all four features, your characterization aligns most closely with **"material-constitutive principles"** (a coinage, defined below). This concept intersects with several philosophical ideas but remains distinct. Below is a systematic carving, addressing your queries:

  ### Core Features & Their Roles  
  1. **Untestability Within Practice** (Load-bearing):  
     - These principles are *presuppositionally necessary* for the practice. E.g., atomic weight constancy is required to interpret gravimetric data.  
     - *Incidental*: Not all untestable principles qualify (e.g., logical axioms lack your other features).  

  2. **Substantive, Not Conventional** (Load-bearing):  
     - Their denial is intelligible and non-trivial (e.g., isotopes revealed atomic weights *could* vary). Rejection reflects a discovery about the world, not a semantic shift.  
     - *Boundary case*: The shift from phlogiston to oxygen chemistry *felt* substantive but involved redefining concepts—unlike your cases.  

  3. **Embedded in Practice, Not by Fiat** (Load-bearing):  
     - They are "in the plumbing": materialized in instruments, routines, and tacit skills. A chemist *could not* stipulate variable atomic weights without redesigning balances, manuals, and training.  
     - *Contrast*: Kuhn’s paradigms involve communal consensus; Lakatos’ "hard core" is protected by methodological choice. Your principles are enforced by *material and procedural necessity*.  

  4. **Internal Failure Discovery** (Load-bearing):  
     - Collapse occurs when anomalies arise *using the principle’s own apparatus* (e.g., mass spectrometers assuming constant weights detected isotopes).  
     - *Boundary case*: If improving accuracy violates a principle (e.g., Newtonian mechanics failing at relativistic speeds), it still fits—*provided* the principle was materially constitutive for the practice (e.g., classical mechanics in 19th-century engineering).  

  ### Coined Concept: **Material-Constitutive Principles**  
  **Definition**: *Principles that are (a) operationally indispensable to a scientific practice, (b) materially embedded in its instruments and methods, (c) taken as substantive descriptions of the world, and (d) vulnerable to internal collapse when the practice encounters limits traceable to their falsehood.*  

  **Exemplars**:  
  - Atomic weight constancy in 19th-century chemistry.  
  - Measurement context-independence in classical physics (violated by QM).  
  - Additivity of mass in gravimetry.  

  **Non-Examples**:  
  - **Laws of logic** (denial not intelligible within any practice).  
  - **Conventions** (e.g., metric units; rejection is pragmatic, not substantive).  
  - **High-level theories** (e.g., natural selection; testable without presupposing them).  

  ### Relation to Neighboring Concepts  
  | Concept             | Relation to Your Principles | Point of Divergence |  
  |---------------------|----------------------------|---------------------|  
  | **Quinean revisability** | Compatible | Quine rejects *any* immunity; your focus is *how* revision occurs (material collapse vs. holistic adjustment). |  
  | **Carnap’s frameworks** | Overlap | Carnap’s principles are linguistic conventions; yours are non-linguistic and world-directed. |  
  | **Kuhnian paradigms** | Partial fit | Paradigms include discretionary elements; your principles are non-optional due to material entrenchment. |  
  | **Lakatos’ hard core** | Similar role | Hard core is shielded by methodological decisions; yours by physical and procedural infrastructure. |  
  | **Wittgenstein’s hinges** | Analogous | Hinges are psychological certainties; yours are engineered into practice. |  

  ### Why "Refutation" Doesn’t Fit  
  - **Refutation** implies empirical disconfirmation *within* a framework. Your principles fail when the practice *itself* becomes untenable (e.g., inconsistent results force re-engineering). It’s less "falsified" than "exhausted."  

  ### Refining Your Spring Talk  
  1. **Emphasize material entrenchment**: Scientists don’t "believe" these principles—they *rely* on them as one relies on a foundation.  
  2. **Contrast with conventions**: Atomic weight constancy wasn’t chosen; it was *required* to build functional instruments.  
  3. **Highlight collapse dynamics**: Failure is a crisis of practice, not theory (e.g., chemists needed new tools to proceed, not just new equations).  

  **In short**: You’ve identified a species of principle defined by its *embodiment in scientific praxis*. Its revision is an *infrastructural revolution*—distinct from theoretical falsification or conventional change. The closest existing term is **"operative presuppositions"** (Hacking, Pickering), but your emphasis on materiality and internal collapse warrants a new label. **Material-constitutive principles** captures their unique role: the world-directed girders holding up a laboratory edifice, which can crumble under their own weight.
