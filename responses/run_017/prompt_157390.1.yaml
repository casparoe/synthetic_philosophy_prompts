prompt: |-
  I help run a mid-sized nonprofit that funds after-school tutoring programs in a handful of cities, and I'm currently the person drafting the one-page guidance our program directors get about which outcome numbers they're allowed to promise funders. So I keep running into Goodhart-flavoured failure in an annoyingly practical form: we commit to a number, the number gets worked on, and afterwards nobody can tell whether anything actually improved. I'm also in a desultory reading group on specification gaming in machine learning, and the two conversations don't feel like they're about the same thing even though everyone recites the same slogan about a measure ceasing to be good once it becomes a target. Before I commit to any framework, I want the spec: what would a theory of which measures survive being targeted have to get right? Give me the desiderata list, each with the case or consideration behind it, and mark which are non-negotiable and which are really just what one camp wants a theory to deliver.

  A few things I want you to take a stand on, because I suspect the shape of the list is the actual result. Does the theory have to cover "selection without a target" — a quantity nobody is optimizing against that still degrades because survival or publication selects on something correlated with it (think reported effect sizes in a literature, or the average outcome among programs that make it past a funding cut)? Or is an agent aiming at the measure part of the definition, so that case belongs to some other theory? Does it have to respect the distinction between a metric that merely evidences the thing we care about (test-score gain as evidence of learning) and one that partly constitutes it (share of enrolled students who actually completed the course, where completion is part of what the program is for), and explain why pushing on the second kind can be fine while pushing on the first corrupts? Should adequacy require it to predict the shape of the failure — e.g. that distortion bunches up right at a funding cliff rather than spreading smoothly — or is "it breaks somewhere" enough? Does it need to handle chains, where you bolt on a second metric or an audit to catch gaming of the first and the audit becomes the new target? And is the four-way taxonomy that gets passed around online (causal / adversarial / extremal / regress-to-the-mean-ish) carving at the joints, or is it a prejudice of one camp?

  Two more constraints from my situation. I need this ex ante: I have to pick metrics before anything is deployed, so a theory that only diagnoses failures after the fact is useless to me — tell me whether that's a fair desideratum or an unfair demand on the subject matter. And whatever the list is, it must not collapse "the number moved because people responded to the incentive in a way that bypassed the target" into "the number moved because the target moved," since for us those look identical in the data. Please flag any pair of desiderata you think can't be jointly satisfied (I have a hunch full generality and ex ante specificity are in tension, and that covering no-optimizer cases fights with any mechanistic story about agents), and say which single requirement knocks out the most popular framings — a couple of sentences each on the slogan version, the economics-of-incentives version, and the ML reward-hacking version is plenty; I care much more about the criteria than the scorecard.
reasoning: |-
  Okay, the user runs a mid-sized nonprofit funding after-school tutoring programs and is drafting guidelines on outcome metrics for program directors. They're struggling with Goodhart's Law—when a metric becomes a target, it ceases to be a good measure. They want a theory to predict which metrics can survive being targeted. 

  Hmm, they mentioned being in a reading group on specification gaming in ML, but they feel the discussions aren't connecting despite the shared slogan. They need a desiderata list for such a theory, specifying what it must get right. They also have specific questions: whether the theory should cover selection without explicit targeting, the distinction between evidential vs. constitutive metrics, predicting failure patterns, handling chains of metrics/audits, and evaluating the common four-way taxonomy.

  The user has two constraints: the theory must work ex ante (before deployment), and it must distinguish between metric changes due to gaming vs. true improvement. They suspect some desiderata might conflict, like generality vs. ex ante applicability or covering non-optimizer cases vs. mechanistic explanations.

  First, I need to define the scope. The user is clearly frustrated with metrics being gamed, leading to unclear actual impact. Their deeper need might be ensuring funder trust and program effectiveness without getting bogged down in metric manipulation. They might also want a practical framework they can apply without deep expertise in ML or economics.

  The key questions they posed require clear stands. For selection without targeting: yes, it should be included because in nonprofits, survival bias (e.g., programs that survive cuts might inflate outcomes) is a real issue. For evidential vs. constitutive metrics: the theory must respect this distinction since pushing on constitutive metrics (like completion rates) might be okay, while evidential ones (test scores) corrupt more easily. Predicting exact failure patterns might be too much; signaling risk areas is sufficient. Handling metric chains is crucial because adding audits often just shifts the problem. The four-way taxonomy? It's a starting point but not fundamental; the focus should be on underlying dynamics.

  Conflicts between desiderata: Ex ante specificity vs. generality is tricky. A theory too general won't give concrete predictions; too specific might not apply broadly. Including non-optimizer cases conflicts with mechanistic stories since selection pressures aren't about intent. But both are necessary for nonprofits where both intentional gaming and passive selection occur.

  The user needs to distinguish gaming from true improvement in data. This is tough because superficially, both show metric improvements. The theory must provide ways to design metrics where gaming leaves detectable traces or is inherently harder.

  Popular framings fall short: The slogan version is too vague for ex ante use. Economics focuses on incentives but misses non-intentional selection. ML reward hacking assumes an optimizer, neglecting passive degradation. The theory must bridge these gaps.

  Non-negotiable desiderata: Ex ante applicability, distinguishing gaming from true improvement, covering both optimizer and non-optimizer cases, and respecting the evidential/constitutive distinction. These are critical for the user's real-world application.

  Finally, the theory should help craft metrics that resist gaming. For example, constitutive metrics with high fidelity (like completion rates tied to actual engagement) are better. Using multiple metrics with orthogonal pressures can help. Avoiding thresholds and using continuous measures reduces cliff effects. The user needs actionable guidance, not just theory.
answer: |-
  Here’s a desiderata list for a theory predicting which metrics survive targeting, with justifications, negotiability flags, and answers to your specific questions. The core tension is **balancing ex-ante predictability with real-world complexity** — no theory will perfectly preempt gaming, but a good one flags key failure modes.

  ### Non-Negotiables (The Theory Must Get These Right)
  1. **Ex-Ante Applicability**  
     *Why*: You need to select metrics *before* deployment. Post-mortem diagnosis is useless for your goal.  
     *How*: The theory must identify structural properties of metrics (e.g., sensitivity to manipulation, correlation decay) that predict vulnerability *without* historical gaming data.  
     *Knocks Out*: Most ML "reward hacking" case studies (post-hoc analyses) and purely empirical economics (requires observing incentive responses).

  2. **Distinguish Gaming vs. True Improvement**  
     *Why*: Your data shows identical metric movement in both cases, but only true improvement aligns with mission impact.  
     *How*: The theory must model *why* the metric moved (e.g., via causal pathways or counterfactual analysis). Metrics requiring effort that *only* benefits the metric (not the mission) are suspect.  
     *Knocks Out*: Naïve "outcomes-based" funding models (assume metric = impact) and simple trend analyses.

  3. **Cover Both Optimizer and Non-Optimizer Degradation**  
     *Why*: Selection effects (e.g., programs surviving cuts inflate outcomes via survivor bias) degrade metrics without explicit targeting. Ignoring this misses half the problem.  
     *How*: The theory must include mechanisms like *corrosion under selection pressure* (e.g., metric becomes less informative as low-scoring cases are excluded).  
     *Conflict*: Hard to reconcile with purely *agent-centric* ML frameworks (e.g., "adversarial" gaming requires intent).

  ### Negotiables (Camp-Dependent, But Critical for Realism)
  4. **Respect Evidential vs. Constitutive Distinction**  
     *Why*: Pushing on constitutive metrics (e.g., course completion) is often legitimate; pushing on evidential proxies (e.g., test scores) invites corruption.  
     *How*: The theory should flag metrics where manipulation *decouples* the metric from the goal (e.g., teaching to the test). Constitutive metrics resist this if they *directly* require mission-aligned effort.  
     *Caveat*: Some camps argue *all* metrics can be gamed (e.g., "completion" by lowering standards).

  5. **Handle Metric Chains & Audits**  
     *Why*: Bolting on audits often just shifts gaming (e.g., tutors "perform compliance" when audited).  
     *How*: The theory should model *effort substitution* (effort shifts to the new target) and *complexity costs* (adding metrics increases overhead without fixing decoupling).  
     *Conflict*: Simpler economic models ignore escalation dynamics.

  6. **Predict Failure Modes (Not Just "Breaks")**  
     *Why*: Knowing *how* it breaks (e.g., threshold effects vs. smooth distortion) informs metric design (e.g., avoid cliffs).  
     *How*: The theory should identify if the metric is vulnerable to threshold gaming, data dredging, or selection bias.  
     *Caveat*: Predicting *exact* failure shapes is unrealistic; signaling key risks (e.g., "this metric encourages threshold manipulation") suffices.

  ### What the Theory Can Sideline (For Pragmatism)
  - **The Four-Way Taxonomy (Causal/Adversarial/Extremal/Regression)**: Useful but not joint-carving. *Take a stand*: It confuses mechanisms (adversarial) with statistical artifacts (regression). A unified theory should focus on **why decoupling occurs** (e.g., low metric-goal correlation under pressure) rather than these categories.
  - **Full Generality** Sacrificed for ex-ante use. Domain-specific factors (e.g., tutor-student trust) matter but can’t be fully modeled.

  ### Addressing Your Specific Asks
  - **"Selection without a target"**: MUST be included (per Desideratum #3). Non-optimizer degradation (e.g., publication bias) is a core failure mode.  
  - **Evidential vs. Constitutive**: MUST be respected (per #4). Constitutive metrics are *safer* if they require mission-critical effort (e.g., completion requires student engagement).  
  - **Predicting failure shape**: SHOULD identify risk profiles (e.g., cliff effects) but not precise timelines.  
  - **Metric chains**: MUST be handled (per #5). Each added layer creates new attack surfaces.  
  - **Ex-ante requirement**: NON-NEGOTIABLE (per #1). Post-hoc theories are irrelevant to you.

  ### Why Popular Framings Fail You
  - **Slogan Version ("When a measure becomes a target...")**: Too vague. Lacks predictive power for *which* metrics fail or *how*.  
  - **Economics of Incentives**: Focuses on agent effort but ignores selection effects and struggles with ex-ante prediction (needs observed behaviors).  
  - **ML Reward Hacking**: Assumes an optimizer, missing passive degradation. Also, ML agents have unlimited action spaces; human organizations have constraints.

  ### The Tensions
  - **Ex-Ante Specificity vs. Generality**: High specificity requires domain tuning (e.g., tutoring-specific heuristics), hurting broad applicability.  
  - **Non-Optimizer Cases vs. Mechanistic Stories**: Passive selection (no agent) conflicts with models requiring intent. Solution: Frame both as *correlation decay under pressure*.  
  - **Non-Negotiables #1 + #2 + #3**: This trio is achievable but knocks out 90% of literature. ML papers ignore selection bias; economics ignores ex-ante design.

  ---

  ### A Practical Path Forward
  For your guidance document:  
  1. **Avoid evidential proxies** (test scores) unless paired with constitutive metrics (attendance, completion).  
  2. **Eliminate thresholds** (e.g., "70% pass rate"). Use continuous scales or ranges.  
  3. **Add friction to gaming**: e.g., "Student progress portfolios + test scores" requires multi-effort manipulation.  
  4. **Track counter-metrics**: e.g., If targeting completion rates, also track dropout reasons and student satisfaction. Divergence signals gaming.  
  5. **Assume survivor bias**: Funded programs’ past outcomes are inflated. Bake this into expectations.

  **The core insight**: A metric survives targeting if *manipulating it requires effort that directly improves your mission*. If tutors must genuinely educate students to move the number, it’s robust. If they can hack it via shortcuts (e.g., easy tests), it’s doomed.
