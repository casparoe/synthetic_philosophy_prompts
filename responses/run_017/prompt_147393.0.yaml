  - **LEX threshold (t):** Fan-out if t ∈ (4,7.9]. If t≤4, LEX Stage 1: all options have ≥t harms → no recommendation at Stage 1; tie-breaks favor B.  
  - **Option B harm per person (x):** Fan-out if x ∈ (4,8). If x≥8, LEX recommends C.  
  - **Option C harm per person (y):** Fan-out if y ∈ (0,7). If y=0, ADD and SEG both recommend C.  
  - **Option A harm (z):** Fan-out if z > max(77,48) and z≥t.  

  ---

  ### (g) Adversarial Notes  
  - **ADD defender** attacks: "Harm unit ignores diminishing marginal disutility." Propose: Weighted sum (e.g., sleep loss squared).  
  - **SEG defender** attacks: "Tie-break should consider total harm earlier." Propose: Total harm as Stage 2 in leximin.  
  - **LEX defender** attacks: "Threshold t is arbitrary." Propose: Smooth aggregation (e.g., prioritarianism).  
  - **Is the case rigged?** Yes, against LEX: the threshold forces it to prioritize avoiding mild harms over reducing a severe harm.  

  ---

  ### (h) Closing  
  The original dust-specks case suggests aggregation disputes hinge on population size. This case shows they arise from deeper structural conflicts: ADD’s sum-fetish, SEG’s maximin leanings, and LEX’s discontinuity—all visible with 12 people. The fan-out proves the separateness of persons debate is not about scale but *architecture of moral mathematics*, detectable in mundane choices.  

