  1. **Remove "exactly one option has ≥t harm":** Let Option B harms=8 (≥t). Then LEX Stage 1: B has 11 ≥t harms, A has 1, C has 0 → LEX recommends C (like SEG). **Collapse: SEG and LEX both recommend C.**  
