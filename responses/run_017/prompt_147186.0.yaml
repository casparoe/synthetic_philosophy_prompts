prompt: |-
  I'm on a volunteer panel for our city council that divides up a fixed pot of money and a fixed amount of wall space between memorial projects — this year it's a Holocaust education programme, a plaque about the slave trade, something for a colonial famine, and a request from a community whose grandparents were killed in a massacre in the 1940s that almost nobody round here has heard of. I've sat through about a dozen of these meetings now and I can't work out what we collectively believe. Two things keep happening.

  The first: we say, all the time, that we aren't in the business of ranking sufferings, and when a local journalist asked whether one of these was worse than another we shut the question down as obsenely tasteless. But the money actually gets allocated by a per-victim sort of formula — so much per name on the wall, travel costs for survivors scaled to how many, a small fund that pays out per head. That's a cardinal, roughly linear-in-deaths scale of badness, which is a stronger commitment than just saying A was worse than B. We also once floated splitting everything equally four ways and that got the angriest reaction of the whole meeting, which suggests the equal split gets heard as a verdict too, just a different one.

  The second thing is the one I keep going round on and that I've never seen discussed anywhere. The taboo gets stronger the closer the two cases are. Nobody minds us saying that a famine was worse than a bar fight, or that the twentieth century was worse than the eighteenth. The fury is reserved for comparisons between two things that are properly similar — two genocides, two famines. But if the objection were epistemic, if it were that we can't get a grip on these things well enough to compare them, you'd expect exactly the opposite pattern: near cases are where comparison is easiest and most reliable. So the obscenity charge doesn't look like it's tracking difficulty at all. What is it tracking?

  There's a related thing from the news, which may or may not belong in the same box: criminal sentences don't seem to scale with the number of victims anything like the way our budget does, and blame seems to run per-perpetrator rather than per-victim. If that's right then we've got two bits of public practice, money and punishment, doing the arithmetic completely differently.

  So: reconstruct the theory of comparative badness that our committee's practice only makes sense under. Which parts of it are load-bearing and which are just what people happen to say? Could a straightforwardly aggregative view, an incommensurability view, or some expressivist view about what comparing does licence the the same behaviour — i.e. is the practice underdetermined? And what would we actually have to start doing differently under each of those? I'm after the argument rather than a bibliography, and I definately want to know where my own framing is the confused bit.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a city council panel allocating resources for memorial projects, and they're confused about the implicit moral framework guiding their decisions. On one hand, they publicly reject comparing suffering, but their funding formula per victim suggests a linear scale based on death toll. The user notices two main contradictions: the taboo against comparing similar atrocities despite using a per-victim formula, and the disconnect between their allocation method and criminal sentencing practices.

  Hmm, the user is clearly grappling with the tension between stated principles and actual practices. They want to understand the unspoken moral theory that makes sense of their committee's actions. The key here is to reconcile the rejection of comparative suffering with the per-victim allocation. The taboo being stronger for similar events is particularly puzzling—why would comparing two genocides be more offensive than comparing a genocide to a bar fight if the objection was purely about measurement difficulty?

  I recall moral philosophy concepts that might apply here. The "separate spheres" idea from Walzer comes to mind—maybe the committee treats each event as having its own moral universe. That would explain why comparing within the same category feels like a violation. The per-victim formula might not be about measuring suffering but about honoring individuality, while equal distribution could imply moral equivalence they want to avoid.

  The criminal justice comparison is another layer. Perpetrator-focused blame versus victim-focused memorials makes sense as different social practices with distinct purposes. The user seems to suspect that "suffering math" isn't consistent across contexts, which is astute.

  The user's framing might be confusing aggregative ethics with what's actually happening. They're assuming the per-victim formula represents a "badness scale," but it could instead be about recognition. The strongest constraint I see is the rejection of equal distribution—that reveals an implicit hierarchy they're unwilling to state openly. 

  This feels like a case where practice reveals unspoken commitments that contradict official statements. The committee likely believes in rough comparability of atrocities but avoids explicit comparisons to prevent debates over which group "deserves more." The per-victim approach serves as a proxy that feels objective while maintaining deniability about rankings.

  The expressivist angle is worth exploring too—maybe comparing similar tragedies is taboo because it's seen as diminishing the uniqueness of each. The outrage at equal funding suggests that even refusing to compare is interpreted as a moral statement. Fascinating how silence speaks volumes here.

  For practical changes, if they adopted full incommensurability, they'd need random allocation or rotation systems. Aggregative approaches would require transparent weightings. But their current hybrid model might be the only workable compromise given political realities. The user's frustration stems from wanting coherence where messy pragmatism prevails.
answer: |-
  Your committee's practice reveals a sophisticated, unstable moral logic that navigates between taboo and necessity. Here's the reconstructed theory and its tensions:

  ### Core Load-Bearing Pillars of Your Practice
  1.  **Recognition of Singularity:** Each event is treated as a unique moral universe. Claims of survivors/descendants are non-fungible. *This justifies the taboo on direct comparison.*
  2.  **Affirmation of Individual Worth:** Every victim deserves acknowledgment. *This justifies the per-victim allocation formula as a proxy for recognition, **not** a measure of "badness."*
  3.  **Avoidance of Hierarchical Judgment:** Explicitly stating "Event A > Event B" is seen as delegitimizing the "lesser" event's claimants or implying differential moral worth of victims. *This is why the equal-split proposal failed – it was interpreted as declaring moral equivalence, which claimants of larger-scale atrocities saw as* minimizing *their suffering.*
  4.  **Pragmatic Quantification for Fair Procedure:** Money/space *must* be divided. A "name-count" formula provides an *objective-seeming, non-intentional* mechanism. It deflects blame from the committee ("The formula decided, not us") and avoids the impossible task of adjudicating qualitative suffering. *This is the escape valve for the irreconcilable demands.*

  ### Why the Taboo Strength Varies (Near vs. Far Cases)
  *   **Epistemic Difficulty Isn't the Driver:** You're right. Comparison is *easier* between similar events.
  *   **The "Moral Encroachment" Explanation:**
      1.  **Similar Events = Shared Moral Category:** Comparing two genocides places them within the *same sphere of moral horror*. This feels like judging which "ultimate evil" is *more* ultimate. It implies a *continuum* within that category where one event could be "better" (less bad) than another, threatening the absolute status of both.
      2.  **Threat to Uniqueness & Claimant Standing:** For groups whose identity is deeply tied to a specific trauma, comparison within the same category (genocide vs. genocide) feels like a direct challenge to the *singular importance* of *their* trauma. It risks diminishing their specific claim in a way comparing it to a radically different event (a bar fight, an 18th-century war) does not. The latter comparison is so absurd it doesn't threaten the event's core moral standing.
      3.  **Fear of Moral Calculus:** Comparing near cases makes the underlying aggregation visible and unavoidable. Comparing distant cases lets the uniqueness principle dominate.

  ### The Criminal Sentencing Disconnect (Perpetrator vs. Victim Math)
  *   **Fundamentally Different Social Practices:**
      *   **Memorial Funding:** Focuses on *recognition of victims* and *repair/education for communities*. The victim is the primary subject. Hence, scaling by victim count makes sense as a recognition metric ("each life matters").
      *   **Criminal Sentencing:** Focuses on *blaming and punishing perpetrators* and *deterrence*. The perpetrator's intent, actions, and culpability are primary. Sentencing scales with *culpability* and *harm caused*, but:
          *   **Diminishing Marginal Blame:** Killing 100 people isn't seen as 100x *morally worse* for the perpetrator than killing one (though legally it carries harsher penalties). The core moral wrong – intentional killing – is saturated quickly.
          *   **Practical Limits:** Life sentences or death penalties cap the practical expression of punishment.
          *   **Focus on the Act, Not the Aggregate:** The law primarily judges the *nature of the act* (murder, genocide) and the perpetrator's role, not solely the final body count for moral weighting *of the perpetrator's sin*.
  *   **Shared Underlying Principle?** Both practices acknowledge that *scale matters*. Memorials do so explicitly via recognition per victim. Sentencing does so implicitly via harsher penalties for mass crimes, but filtered through the lens of perpetrator culpability and practical justice.

  ### Could Other Theories License the Same Behavior? (The Underdetermination Question)
  1.  **Straightforward Aggregative Utilitarianism (Total Suffering Matters):**
      *   *Could it?* Superficially, yes (more victims = more suffering = more resources). Your formula mimics this.
      *   *Conflict:* It fundamentally *requires* ranking sufferings and aggregating across events. It would *demand* explicit comparisons ("The famine caused more total suffering, so gets more funds"). This violates your core taboo and would cause outrage. Your formula is a *stealth aggregation*, denied publicly. **Verdict: Incompatible.** Your committee rejects aggregation's *moral justification* while adopting its *mathematical output* as a procedural tool.
  2.  **Radical Incommensurability (No Meaningful Comparison Possible):**
      *   *Could it?* Yes, it justifies the taboo on comparison.
      *   *Conflict:* It cannot justify the per-victim formula *or* the rejection of equal splits. If events are truly incommensurable:
          *   Equal splits would be the *only* non-arbitrary allocation.
          *   Any formula (like per-victim) implicitly creates a common metric (recognition per life), violating incommensurability.
      Your committee's *actions* (formula, rejecting equality) demonstrate a belief in rough commensurability *for the purpose of allocation*, contradicting pure incommensurability. **Verdict: Incompatible.** You need a *weak* commensurability for allocation.
  3.  **Expressivism (Allocation Expresses Attitudes, Not Truths):**
      *   *Could it?* **Highly Compatible.** This best explains the nuances.
      *   *How it fits:*
          *   The taboo isn't about epistemic impossibility, but about the *offensive speech act* of comparing horrors. It expresses disrespect or dismissal.
          *   The per-victim formula expresses the attitude: "We recognize each individual life lost." It's about honoring individuals, not quantifying badness.
          *   Rejecting the equal split expresses: "These events are *not* morally equivalent in scale or claim." Allocating based on scale, while refusing to *say* one is worse, expresses a complex attitude: "The scale of loss demands proportionate recognition *for the victims*, but we refuse to diminish any event by declaring it 'less bad'."
          *   Varying taboo strength: Comparing similar events expresses a dangerous willingness to *rank* within the category of ultimate evils, which is seen as inherently diminishing. Comparing dissimilar events doesn't carry this expressive weight.

  ### Where Your Framing Might Be Slightly Confused
  Your core insight is sound, but framing the per-victim allocation as a "linear-in-deaths scale of *badness*" is the subtle misstep. **The committee is likely *decoupling* the metric for *resource allocation* (per victim) from a direct *moral judgment of comparative badness*.**

  *   **"Recognition", not "Badness":** The formula is primarily a practical, politically acceptable, and *victim-focused* mechanism for distributing *recognition* ("each name deserves space/funds for commemoration"). It acknowledges scale *without* requiring the committee to affirm "Event A was X times worse than Event B."
  *   **Hiding the Aggregation:** The aggregation happens *within* each event's recognition ("We recognize *all* these victims proportionally"), not *between* events ("We recognize victims of Event A *more* than victims of Event B because Event A was worse"). The committee publicly pretends the per-victim allocation *only* reflects internal recognition needs, not inter-event comparisons. The formula obscures the inevitable cross-event comparison inherent in dividing a fixed pot.

  ### What Would Change Under Different Theories?
  *   **Aggregative View:** Open ranking of events based on total harm metrics; allocation directly tied to that ranking; abandonment of the "no comparison" taboo. Expect constant, explicit, and divisive debates about quantification.
  *   **Incommensurability View:** Either equal splits regardless of scale, or random allocation. Any non-equal, non-random method would be indefensible. The rejection of equal splits would vanish.
  *   **Expressivist View (Current Hybrid):** Your current messy, tense, somewhat hypocritical practice *is* the expressivist view in action. Changes would involve greater honesty: "We allocate per victim to honor each life individually. This results in different sums, reflecting the scale of loss needing recognition, *not* a judgment that one tragedy was morally worse than another. Comparing the moral gravity of these unique horrors is disrespectful and beyond our capacity."

  **Conclusion:** Your committee operates under an **Expressivist-Pragmatic Hybrid** model. It expresses respect for uniqueness and individual victims while using a quantifiable proxy (victim count) to navigate the impossible task of allocation fairly *within* political and emotional constraints. The taboo on comparison, strongest for similar events, protects the perceived moral singularity of each catastrophe and shields the committee from accusations of ranking suffering. The per-victim formula is a load-bearing pillar providing procedural legitimacy and victim-focused recognition, *not* an open moral calculus of badness. The disconnect with criminal sentencing arises because one practice centers victims/recognition (scaling with victims) and the other centers perpetrators/punishment (scaling with culpability, not linearly with victims). The tension you feel is the inherent instability of trying to honor incommensurable suffering through commensurable resources.
