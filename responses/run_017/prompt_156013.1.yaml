  - **Most sensitive term**: Term 4 (individual differences). The fraction who categorically refuse (set at 15%) has high leverage: if it increases to 25%, P(participate) drops to 0.70, reducing P(majority kill) credence to ~0.40; if it decreases to 5%, P(participate) rises to 0.90, increasing credence to ~0.95. Small changes here disproportionately affect the outcome because it sets a hard limit on participation.
    
