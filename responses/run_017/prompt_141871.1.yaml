  | New Case | Predicted Verdict | Why it's the interesting test |
  | :--- | :--- | :--- |
  | A devout friend advises you that your agnosticism is morally wrong based on their faith. | **Don't defer** | Tests "legitimate authority" – their authority is specific to their faith community, not universally binding on you. |
  | Your doctor (non-psychiatrist) says you should forgive a toxic family member for your health. | **Weak defer/Consider** | Tests scope of authority – medical expertise supports well-being claim, but moral act of forgiveness extends beyond their core domain. |
