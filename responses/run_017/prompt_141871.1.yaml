  | :--- | :--- | :--- | :--- | :--- | :--- |
  | Racist joke (Black colleague) | Defer | Defer | Legitimate experiential authority (receiving end) | None | - |
  | Skip wedding (stranger) | Don't defer | Don't defer | Neither condition holds | None | - |
  | Charity (philosopher friend) | Don't defer | Don't defer | No impairment; reasons already known, so no unique authority applies | None | - |
  | Text ex (sober friend) | Defer | Defer | Impaired judgment (intoxication) | None | - |
  | Joke fine (racist uncle) | Don't defer | Don't defer | Not legitimate authority (biased source) | None | - |
  | Unfair coworker (AI) | Hesitate | Don't defer (or weak defer) | AI lacks relational legitimacy/authority; no impairment | **Yes** | Add: Deference requires a *human* source with relational standing for full moral weight. |
  | Cut off dad (therapist) | Defer | Defer | Legitimate epistemic authority (therapist role re: well-being/relationships) | None | - |
  | Forum posts (coercive BF) | ? | **Defer** | Collective experiential authority (pattern recognition of coercion) & potential impairment (emotional entanglement) | - | - |

