prompt: |-
  hey — putting together something like a long memo on secession for a group that's advising a constitution-drafting process, and before I write any of it I want the spec. Not "should Catalonia be allowed to leave" — I want the requirements list: what would a theory of secession have to deliver to be good enough to actually be written into law, i.e. administrable by an electoral commission and a constitutional court, not just defensible in a journal?

  Concretely: it has to resolve, before the vote happens, who the demos is, what territory is on offer, what the threshold is, and what happens to the bits that vote against. So give me desiderata that bite under that constraint, with the case behind each.

  Cases I want requirements anchored to, at least loosely: Scotland, Quebec, Catalonia — plus the awkward ones: a holdout county that votes to stay but is geographically stuck to the new state; an enclave or exclave; a region whose departure would leave the rump state economically or militarily non-viable; a diaspora that identifies with the nation but doesn't live there; a subgroup that wants to seceed from the secession and maybe rejoin the parent state; a secession that succeeds or fails purely on whether other states recognise it; and a "nation" with no thick shared culture that just wants out over fiscal transfers.

  Things I specifically want you to think through rather than assume:

  - the franchise–territory circularity: who gets to vote depends on what unit is seceding, but what unit secedes is supposed to be settled by who votes. Does any theory actually break that circle, or does every one of them smuggle in a prior answer about the unit (usually an existing administrative border)?
  - the reiteration / Russian-doll problem: whatever right you posit has to say what it says one scale down. Let the holdout secede from the secession and you get a regress; don't let it and you've denied the holdout the exact right you just asserted. Which horn is less bad, and why?
  - the veto-holder question: does the rump state's population get a say (defence, debt, shared infrastructure, transfers)? If yes, secession collapses into a grant; if no, into a unilateral right.
  - the trigger/authority split: who may authorise a referendum, who has the right to secede, and what counts as a legitimate grievance (remedial-only vs. any democratic will) are three different questions. Keep them apart and say which one a given theory is actually a theory of.
  - the serial-referendum problem: what's the shelf life of a lost vote, and of a won one? Anything that says "the demos decides" owes an answer about a demos that changes its mind, or one that was panicked, bribed, or badly misinformed.

  Also mark which requirements are non-negotiable and which are just preferences of one camp (nationalists, unionists, international lawyers, constitutional judges). Flag any pair I probably can't have together — my guesses are that "the demos draws its own boundaries" and "everyone materially affected gets a say" can't both hold, and that "no veto for the rump state" is in tension with "succession is settled in advance" (debt, treaties, UN seat, central bank) — but you tell me. And name the single requirement that knocks out the most popular theories; I suspect it's the holdout problem killing pure plebiscitary views, but I want your take.

  A short table scoring the three big families — remedial-right-only, plebiscitary/primary-right, and the negotiated-constitutionalist "you need the parent state's consent" view — is fine, but keep it to a few lines. Alot more than that and you're spending words on the wrong part; the criteria are the deliverable.

  At the end, say how confident you are in the list overall and single out the one requirement or claim you're least sure about.
reasoning: |-
  Okay, the user is asking for a set of requirements for a theory of secession that can be implemented in law. They want concrete desiderata based on real cases like Scotland, Quebec, Catalonia, and some tricky scenarios like holdout counties, enclaves, viability issues, diasporas, subgroups wanting to secede from the secession, recognition dependencies, and fiscal-motivated secessions. They also highlight specific problems to address: franchise-territory circularity, the Russian-doll problem, veto-holder questions, trigger-authority splits, and serial referendums.

  First, I need to unpack each of these issues. The franchise-territory circularity is a classic chicken-and-egg problem. How do you define who votes without knowing the territory, but the territory depends on who's voting? Most theories use existing administrative boundaries as a default, but that's arbitrary. The user wants to know if any theory breaks this circle. Maybe a negotiated process where both sides agree on the boundaries beforehand? But that requires cooperation, which isn't always present.

  Then there's the Russian-doll problem. If a subgroup within the seceding region wants to stay with the parent state, allowing them to secede creates an infinite regress. Denying them contradicts the secession right itself. The user needs to know which option is less problematic. Probably, denying further secession to avoid chaos, but that undermines the principle. A tiered system with minimum thresholds might help, but it's messy.

  The veto-holder question is about whether the rump state gets a say. If yes, secession becomes a negotiated exit, not a right. If no, it's unilateral, risking unfair burdens on the rump. The user mentioned debt, defense, shared infrastructure. Remedial theories might allow unilateral secession only in extreme cases, but primary-right theories face fairness issues. International recognition might play a role here, but it's not a legal guarantee.

  Trigger/authority split involves who initiates the referendum, who has the right, and what justifies secession. Remedial theories require serious grievances, primary-right relies on democratic will, and negotiated consent needs agreement. These need clear separation. The user wants each theory's focus identified.

  Serial referendums are about timing. How soon can another vote happen after a loss or win? Preventing constant votes is necessary for stability, but how? Cooling-off periods, supermajorities, or requiring changed circumstances. But defining "changed" is subjective.

  The user also wants to know which requirements are non-negotiable versus ideological. Non-negotiables like legal clarity, preventing violence, and balancing self-determination with stability. Ideological ones include remedial-only versus primary-right approaches. Conflicts like self-drawn boundaries versus affected parties' consent are irreconcilable. The holdout problem kills plebiscitary views because they can't handle subgroups wanting to stay.

  I should structure the requirements into categories: foundational (must-haves), operational (implementation), and conflict management. Foundational includes breaking the franchise-territory circle, handling Russian dolls, defining veto powers, separating trigger/right/grievance, and managing serial votes. Operational covers viability assessments, procedural steps, and legal continuity. Conflict management deals with holdouts, enclaves, and identity groups.

  For the tricky cases: holdout counties need default rules (e.g., contiguous areas stay with the parent state). Enclaves might require negotiated solutions. Viability could mandate negotiations if the rump is too weak. Diasporas likely don't vote but could have symbolic roles. Subgroups seceding post-secession might be blocked to prevent chaos. Recognition-dependent cases highlight that legal frameworks need international buy-in. Fiscal-motivated secessions test whether grievances are valid without oppression.

  In the scoring table, remedial-right only scores well on viability and veto but poorly on democratic will. Plebiscitary fails on Russian dolls and veto issues. Negotiated consent handles vetoes and viability but struggles with circularity and requires cooperation.

  The user's deeper need is a practical, legally implementable framework that avoids theoretical pitfalls. They need a balance between enforceability and fairness, minimizing chaos. The least confident point might be the Russian-doll solution—forcing holdouts to comply feels inconsistent but might be necessary for stability.
answer: |-
  Here’s a requirements list for a legally administrable theory of secession, anchored to your cases and constraints. I’ve structured it around **non-negotiable operational criteria** (bolded) and **negotiable/political trade-offs**, with conflicts flagged. Scoring of major theories follows.

  ---

  ### **Non-Negotiable Requirements**  
  *(Essential for legal implementation)*  

  1. **Break Franchise-Territory Circularity**  
     - *Requirement:* **Define the "secession unit" objectively *before* the vote** using fixed, pre-existing boundaries (e.g., highest-level administrative region: Catalonia = *autonomous community*, Scotland = *country*, Quebec = *province*).  
     - *Why non-negotiable?* Electoral commissions need clear voter rolls; courts need jurisdictional certainty.  
     - *Case anchor:* Catalonia (Spanish Constitutional Court annulled 2017 vote due to ambiguous demos/territory).  
     - *Conflict:* Smuggles in prior administrative borders, but alternatives (e.g., self-defined "cultural nation") are unadministrable.  

  2. **Resolve the Russian-Doll Problem**  
     - *Requirement:* **Establish a minimum viable unit (MVU) for secession** (e.g., NUTS-2 in EU, counties in US). Sub-units *cannot* secede from the secession post-referendum. Holdouts default to the rump state.  
     - *Why non-negotiable?* Infinite regress paralyzes governance; courts can’t adjudicate fractal claims.  
     - *Case anchor:* A Catalan county voting "no" (e.g., Val d'Aran) must stay with Spain if Catalonia secedes.  
     - *Horn chosen:* Deny the holdout’s "secession right" — stability outweighs theoretical consistency.  

  3. **Define Triggers & Authorities Separately**  
     - *Requirement:* **Codify distinct rules for:**  
       - *Who may authorize a vote* (e.g., regional parliament, central gov’t, UN).  
       - *Who may secede* (defined territorial unit).  
       - *Grounds for legitimacy* (remedial vs. primary right).  
     - *Why non-negotiable?* Prevents conflation (e.g., Catalonia’s ad hoc "right to decide" vs. Spain’s constitutional process).  
     - *Case anchor:* Quebec Secession Reference (1998) — clarified "clear majority on a clear question" ≠ automatic right.  

  4. **Pre-Settle Asset/Liability Succession**  
     - *Requirement:* **Automatic, rules-based allocation** of debt, treaties, infrastructure, and state assets *before* the vote.  
     - *Why non-negotiable?* Essential for economic stability; prevents post-vote coercion ("accept our terms or we block you").  
     - *Conflict:* Incompatible with "no rump veto" — requires negotiation or predefined formulas (e.g., population/GDP share).  
     - *Case anchor:* Scottish independence — UK demanded pre-vote agreement on division of debt, North Sea oil, GBP.  

  5. **Prevent Serial Referendums**  
     - *Requirement:* **"Cooling-off period" after failed votes** (e.g., 15–25 years) and **expiry for successful votes** (e.g., 2–5 years to implement).  
     - *Why non-negotiable?* Avoids perpetual instability (e.g., Quebec 1980/1995 votes); courts need finality.  
     - *Case anchor:* Scottish IndyRef (2014) — "once in a generation" rhetoric (but unenforceable without law).  

  ---

  ### **Negotiable Requirements & Trade-Offs**  
  *(Subject to political/ideological choice)*  

  6. **Viability Safeguard**  
     - *Requirement:* Secession blocked if rump state is rendered non-viable (economically/militarily).  
     - *Trade-off:* "Viability" is subjective (e.g., Baltic states leaving USSR weakened it, but allowed). Unionists favor; nationalists oppose.  
     - *Case anchor:* Donbas leaving Ukraine would cripple industry; Catalonia leaving Spain risks EU/water access.  

  7. **Franchise Rules**  
     - *Requirement:* Define voters by residency (not ethnicity/diaspora) + duration (e.g., ≥5 years).  
     - *Trade-off:* Excludes diasporas (e.g., Palestinians abroad, Irish Americans) but administrable. Quebec allowed non-resident citizens to vote in 1995—controversial.  

  8. **Thresholds & Supermajorities**  
     - *Requirement:* Simple majority vs. supermajority (e.g., 55%+) vs. double majority (e.g., territory + population).  
     - *Trade-off:* Higher thresholds favor status quo (e.g., EU requires supermajorities for treaty change). Catalonia’s 2017 vote used simple majority (90% yes, but 43% turnout).  

  9. **Grievance Justification**  
     - *Requirement:* Remedial-only (oppression, rights violations) vs. primary right (any democratic will).  
     - *Trade-off:* Remedial theories (e.g., Kosovo) easier for courts to adjudicate; primary right (e.g., Scotland) more democratic but vulnerable to "fiscal divorces" (e.g., wealthy region leaving over transfers).  

  10. **Rump State Veto**  
      - *Requirement:* Whether the rump state’s population/laws can block secession.  
      - *Trade-off:* "Veto" = secession is a negotiated grant (e.g., UK’s §30 order for Scotland); "no veto" = unilateral right (e.g., Crimea—contested). Incompatible with **Requirement 4** (pre-settled succession).  

  ---

  ### **Conflicts & Impossible Pairs**  
  - ❗ **"Demos draws boundaries" + "All affected get a say"** → *Logically impossible*. Self-determination requires a prior demos definition.  
  - ❗ **"No rump veto" + "Pre-settled succession"** → *Requires negotiation*, implying de facto veto power.  
  - ❗ **"Pure plebiscitary right" + "Russian-doll stability"** → *Contradictory*: If subunits can secede, regress; if not, hypocrisy.  
  - **Holdout Problem Kills:** Plebiscitary theories (they can’t resolve MVU without arbitrary borders).  

  ---

  ### **Theory Scoring (1–5, 5 = best)**  
  | Requirement               | Remedial-Right | Plebiscitary | Negotiated Consent |  
  |---------------------------|---------------|-------------|-------------------|  
  | Franchise-Territory       | 4 (Uses borders) | 2 (Circular) | 5 (Agreed borders) |  
  | Russian-Doll              | 4 (MVU defined) | 1 (No answer) | 5 (Contract fixes) |  
  | Viability                 | 5 (Blocks harm) | 1 (Ignores)  | 4 (Renegotiable)   |  
  | Pre-Settled Succession    | 3 (Case-by-case)| 1 (Post-vote) | 5 (Built-in)       |  
  | Rump Veto                 | 3 (Implicit)   | 1 (None)     | 5 (Required)       |  
  | **Adminstrability**       | **4**          | **1**        | **5**             |  

  **Plebiscitary theories fail** on operational grounds (Russian dolls, succession chaos). **Negotiated consent** (e.g., Canada’s Clarity Act) is most administrable but politically hardest. **Remedial-right** works only for extreme cases.  

  ---

  ### **Confidence & Uncertainty**  
  - **Overall Confidence: 8/10** — Criteria cover major pitfalls, but edge cases (e.g., enclaves) require ad hoc solutions.  
  - **Least Confident Requirement:** **Russian-Doll MVU**. Choosing stability over consistency ("no sub-secession") feels arbitrary, yet no clean alternative exists. Is a *county* too small? What if it’s ethnically distinct (e.g., Hungarian pockets in Romania)? I defer to pragmatism, but it’s a tension.  

  Recommendation: Build around **negotiated consent** (enables pre-settled rules) with a **remedial override** (e.g., for severe oppression bypassing veto). Anchor boundaries to **sub-national administrative units** to break circularity. Explicitly **ban sub-secession** and **set referendum timebars**.
