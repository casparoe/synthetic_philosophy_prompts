prompt: |-
  I'm in the fourth year of a PhD programme and I'm presenting a chapter of my dissertation at our work-in-progress seminar in a fortnight, and I would like someone to check whether the package of commitments the chapter rests on actually hangs together before I stand up in front of the department. The chapter uses two-dimensional semantics as a general framework for thinking about a posteriori necessity, and then tries to export it in two directions: first to the conceivability argument against materialism, and then, in the final section, to metaethics. Roughly, here is where I think I have landed.

  (1) Kripke's cases are the paradigm: 'water is H2O' and 'Hesperus is Phosphorus' are, if true, metaphysically necessary but knowable only a posteriori, and the epistemic gap in these cases is not the shadow of a modal gap.
  (2) There is still a Fregean residue to be accounted for — these identities are informative, and a competent speaker can possess both concepts without knowing the identity — so something like cognitive significance has to survive the Kripkean argument.
  (3) The two-dimensional machinery is the right way to keep both: primary intensions (evaluation with a world considered as actual) track cognitive significance and the a priori, secondary intensions track metaphysical necessity, and there is no contradiction in a sentence's being contingent along one dimension and necessary along the other.
  (4) I want the general moral of Naming and Necessity to be strict: a merely epistemic gap never by itself licenses an inference to a modal gap.
  (5) But I also want the two-dimensional conceivability argument against materialism to go through: the total physical truth about the world is compatible, at the level of primary intensions, with the absence of consciousness, and I want to infer from that primary possibility to a genuine metaphysical possibility, and hence to the falsity of materialism — or at the very least to the contingency of any psychophysical identity.
  (6) On the metasemantic side I want the deferential story for kind terms: what fixes the reference of 'water', and of theoretical kind terms generally, is something like 'whatever stuff plays such-and-such role around here, whatever the relevant experts and the best theory turn out to say', something speakers themselves need know nothing about, and this is what lets the framework respect deference to experts and to nature.
  (7) I also hold that the epistemic dimension is to be understood in terms of a priori knowability under ideal reflection; I do not want to take conceivability as an unexplained primitive.
  (8) And I want the apparatus to do work against synthetic moral naturalism: the Moral Twin Earth style of argument — a twin community whose term for the good latches onto a different natural property, with nothing in our epistemic situation that could choose between us and them — is, I claim, the very same phenomenon, since the primary intension of 'good' does not entail any particular natural base, and so the naturalist's a posteriori identity claim is in worse shape than 'water is H2O'.

  A friend who read a draft says my only real problem is (5) and that (1) through (4) and (6) are in perfectly good shape; my instinct is that the trouble is deeper and located somewhere else, but I cannot put my finger on it. So please audit the set rather than taking either of us at our word: tell me which pairs of these are genuinely in tension and which only look as if they are — I suspect at least one apparent clash dissolves on inspection, since separating the dimensions is supposed to be the whole point of the framework — and then, for each real tension, say what would have to be given up and what giving it up would cost me elsewhere in the list. Rank the tensions by severity rather than flagging them all as equally bad, and finish by telling me which single revision would clean up the most.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a fourth-year PhD student presenting a dissertation chapter that uses two-dimensional semantics to address a posteriori necessity and then extends it to the conceivability argument against materialism and metaethics. They've outlined eight commitments and are concerned about internal tensions, especially after a friend pointed out issue (5) as the main problem. The user suspects deeper issues and wants an audit of the entire package.

  First, I need to understand each commitment and how they interrelate. Commitments (1) to (4) and (6) seem aligned with standard two-dimensional semantics. Kripke's cases, Fregean residue, the two-dimensional framework, the strict epistemic-modal gap separation, and metasemantic deference all fit together. The friend thinks only (5) is problematic, but the user feels the tension might be elsewhere. 

  Looking at (5), the conceivability argument against materialism, the user wants to infer from primary possibility (zombie worlds) to metaphysical possibility. But (4) explicitly states that an epistemic gap doesn't imply a modal gap. This seems contradictory because (5) uses an epistemic gap (primary intension contingency) to infer a modal gap (metaphysical contingency). That's a direct conflict. 

  But maybe the tension is deeper. Commitment (8) applies the same framework to metaethics, arguing that 'good' has a primary intension that doesn't entail a specific natural property, similar to Moral Twin Earth. Here, the user denies synthetic moral naturalism by pointing to the epistemic gap. However, if (4) forbids inferring modal gaps from epistemic gaps, then (8) might undermine itself. If the epistemic gap for 'good' doesn't license a modal gap, then moral naturalism could still be necessary a posteriori, just like 'water is H2O'. So (4) and (8) conflict as well. 

  The user also has (7), which ties primary intensions to a priori knowability under ideal reflection. This might help clarify the conceivability argument but doesn't resolve the tension between (4) and (5). In fact, emphasizing a priori knowability might make the leap from conceivability to metaphysical possibility more problematic, as critics like Chalmers note. 

  Now, considering the metasemantic aspect in (6), deference to experts and nature supports rigid designation, which is central to Kripke's cases. But in metaethics, if 'good' is a rigid designator, then its secondary intension could fix a natural property necessarily, even if the primary intension is flexible. So applying (6) consistently might support moral naturalism, contradicting (8). 

  The core issue seems to be the application of the epistemic-modal gap separation. In (4), it's strict: no inference from epistemic to modal gaps. But in (5) and (8), the user wants to make such inferences—against materialism and moral naturalism. The framework's separation is meant to prevent exactly this. So the tensions are between (4) and (5), and (4) and (8). 

  Ranking these, the (4)-(5) conflict is severe because it's central to the conceivability argument. Without resolving this, the argument against materialism collapses. The (4)-(8) tension is also serious but perhaps more manageable if metaethics is less critical to the chapter. 

  The user might need to revise (4) to allow exceptions where primary possibility implies metaphysical possibility, but that risks undermining Kripke's cases. Alternatively, they could drop the inference in (5) and accept contingency of psychophysical identities, which is weaker but still challenges materialism. For (8), they might need to adjust the argument against moral naturalism, perhaps focusing on the instability of reference for moral terms compared to natural kinds. 

  The most impactful revision would be addressing (4) and (5), as it affects the core argument. Clarifying that primary intensions only sometimes indicate metaphysical possibility, based on scrutability or conceptual coherence, might help. But this requires careful defense to avoid ad hoc exceptions. 

  Additionally, the user's instinct about deeper trouble is valid; the tension extends beyond (5) to how the framework is applied in different domains. Ensuring consistency across commitments is crucial, especially when extending to metaethics. The friend's focus on (5) is correct, but the implications ripple through to (8) and the overall coherence.
answer: |-
  Here's a systematic audit of your commitments, identifying tensions, their severity, potential resolutions, and the most impactful revision. Your friend is partially correct about (5) being the core problem, but the tension is deeper and radiates outwards due to the foundational role of Commitment (4) ("Kripke's Moral").

  **Core Tensions Ranked by Severity:**

  1.  **Severe: (4) vs. (5) - Kripke's Moral vs. Conceivability Argument:**
      *   **Tension:** This is the most critical conflict. (4) states a *strict prohibition*: an *epistemic gap alone* (reflected in the primary intension) *never* licenses an inference to a *modal gap* (concerning secondary intensions/metaphysical possibility). (5) explicitly attempts to make *exactly that inference*: from the primary possibility (epistemic gap) of zombies (physical truth + ~consciousness) to its metaphysical possibility (modal gap), thereby falsifying materialism or necessitation.
      *   **Why it's severe:** This strikes at the heart of the two-dimensional framework's core function – separating epistemic and metaphysical modalities. If you violate (4) for consciousness, you undermine the framework's ability to explain Kripkean cases (1, 2, 3) where epistemic gaps *do not* imply modal gaps. It makes your application seem *ad hoc*.
      *   **Resolution Options & Costs:**
          *   *Abandon Strict (4):* Allow that *sometimes* (specifically for consciousness) primary possibility entails secondary possibility. **Cost:** Severely weakens the explanation of Kripkean cases (1,2,3). Requires explaining *why* consciousness is special – why its epistemic gap *does* signal a modal gap when 'water is H2O' or 'Hesperus is Phosphorus' do not. This invites accusations of dualist begging-the-question and undermines the framework's generality.
          *   *Weaken (5):* Retreat to the weaker claim that the conceivability argument shows the *contingency* of psychophysical identities (e.g., C-fiber firing = pain), not the falsity of materialism *simpliciter*. This is consistent with a type-B materialist view (necessitation is brute/a posteriori necessary). **Cost:** Abandons the strong anti-materialist conclusion you seem to want. Makes the argument less revolutionary.
          *   *Reinterpret Primary Possibility for Consciousness:* Argue that the zombie scenario *isn't* primarily possible *under ideal rational reflection* (linking to 7). Maybe ideal reflection reveals an a priori entailment from physical to phenomenal truths. **Cost:** Highly contentious and likely requires embracing a specific, controversial view of phenomenal concepts or physical theory (e.g., Russellian monism, a priori physicalism). Contradicts strong intuitions driving the conceivability argument.

  2.  **Significant: (4) vs. (8) - Kripke's Moral vs. Metaethics:**
      *   **Tension:** (8) uses the epistemic gap (primary intension of 'good' doesn't entail a specific natural base, Moral Twin Earth scenario conceivable) to challenge synthetic moral naturalism. It implies that this epistemic gap *does* license an inference to a *modal gap* – that 'good = N' (for some natural property N) cannot be a necessary a posteriori truth like 'water = H2O'. But (4) forbids inferring modal gaps from epistemic gaps alone. If (4) holds, the moral naturalist can simply insist that 'good' rigidly designates a natural property N discovered a posteriori, and Moral Twin Earth only shows the epistemic gap, not a modal one. The naturalist identity claim could still be necessary a posteriori.
      *   **Why it's significant:** It shows the tension isn't *just* about consciousness; applying the "Kripkean Moral" (4) consistently threatens your anti-naturalist argument in metaethics too. It risks making your framework *support* synthetic moral naturalism by analogy with 'water = H2O'.
      *   **Resolution Options & Costs:**
          *   *Abandon Strict (4) for Metaethics:* Similar to option 1 for (5). Claim moral terms are special. **Cost:** Further *ad hoc*-ness, weakens framework generality. Requires explaining why moral terms differ from natural kind terms regarding (4).
          *   *Reinterpret Metaethical Argument:* Shift the argument. Instead of relying *solely* on the epistemic gap/Moral Twin Earth to refute naturalism, use it to show instability of reference or lack of shared semantic mechanism between 'good' and natural kind terms, making rigid designation and a posteriori necessity *inapplicable* to 'good'. Argue that the metasemantics (6) for 'good' *cannot* work like it does for 'water' because there's no analogous causal-historical chain or expert deference fixing a natural kind. **Cost:** Requires developing a distinct metasemantic story for moral terms, moving beyond simply applying the 2D framework directly. Less elegant, but potentially more robust.
          *   *Weaken Conclusion in (8):* Concede that synthetic moral naturalism *could* be true as a necessary a posteriori identity, but argue Moral Twin Earth shows it's *unstable* or *lacks the same justificatory basis* as natural kind identities, making it less plausible or explanatory. **Cost:** Significantly weaker anti-naturalist conclusion.

  3.  **Moderate: (5) & (8) vs. (7) - Conceivability/Primary Intensions vs. A Priori Knowability:**
      *   **Tension:** Your commitment to grounding the epistemic dimension in *a priori knowability under ideal reflection* (7) is commendable but potentially in tension with the *strength* of the conceivability claims in (5) and (8). Critics (e.g., physicalists regarding zombies, naturalists regarding Moral Twin Earth) will argue that what *seems* conceivable/primarily possible now might *not* survive ideal rational reflection. They might claim ideal reflection *would* reveal the entailment from physical to phenomenal truths, or from descriptive role to a specific natural property N for 'good'. Your argument relies on the primary possibility being robust *even under ideal reflection*.
      *   **Why it's moderate:** This is a common point of contention inherent in conceivability arguments. While (7) strengthens your position by avoiding primitivism, it also makes your claims about primary possibility (zombies, Moral Twin Earth) potentially *vulnerable* to being undermined by arguments about what ideal reflection entails. It doesn't inherently contradict your other commitments, but it highlights a key battleground.
      *   **Resolution Options & Costs:**
          *   *Defend Robust Conceivability:* Argue vigorously that zombies and Moral Twin Earth scenarios *remain* conceivable even under ideal reflection, perhaps due to the fundamentally non-structural/non-functional nature of phenomenal concepts or the normative nature of 'good'. **Cost:** Requires engaging deeply with opposing views (e.g., analytic functionalism, conceptual role semantics for normative terms) and may be dialectically difficult.
          *   *Accept Vulnerability:* Acknowledge this is a potential weakness but argue the burden is on opponents to show the entailment under ideal reflection. **Cost:** Makes your positive arguments less decisive.

  **Apparent Tensions that Likely Dissolve:**

  *   **(1), (2), (3) vs. (6):** The standard two-dimensional framework *incorporates* rigid designation, a posteriori necessity, *and* Fregean cognitive significance via the two dimensions. The metasemantic story in (6) (causal-historical reference fixing, deference) is precisely *how* the secondary intension gets fixed, explaining why the primary and secondary intensions come apart. These are complementary, not conflicting, elements of the overall picture. Your friend is right that (1-4 & 6) hang together well.

  **The Single Revision that Cleans Up the Most:**

  **Revise Commitment (4): "Kripke's Moral"** from its current *strict* formulation to a *qualified* one.

  *   **Current (4):** "a merely epistemic gap never by itself licenses an inference to a modal gap."
  *   **Revised (4):** "A merely epistemic gap reflected in the primary intension does not *by itself* license an inference to a modal gap concerning the secondary intension. However, in cases where the primary intension corresponds to a *deeply coherent*, *fundamental* concept whose content is not exhausted by its role in fixing reference (e.g., phenomenal consciousness, perhaps fundamental normative concepts like 'good'), the primary possibility *can* provide defeasible evidence for secondary possibility, demanding explanation if materialism/naturalism is true."

  *   **Why it Cleans Up the Most:**
      1.  **Directly Addresses Core Tension (4 vs. 5):** It creates logical space for the conceivability argument against materialism by explicitly carving out an exception for consciousness (and potentially normativity).
      2.  **Partially Addresses Tension (4 vs. 8):** It allows you to potentially extend the exception to 'good', strengthening your metaethical argument. (You'd still need to argue 'good' fits the criteria).
      3.  **Preserves Kripkean Explanations:** It maintains that for standard natural kind identities ('water', 'Hesperus'), the strict separation holds – the epistemic gap *doesn't* signal a modal gap. This preserves the core explanatory power for (1, 2, 3).
      4.  **Provides a Unifying Principle:** It offers a (controversial, but defensible) principle for *when* the inference *is* licensed: concepts that are fundamental, categorical, and not reference-fixing-role-exhausted.

  *   **Costs of this Revision:**
      *   **Controversial & Requires Defense:** You must robustly defend the criteria for the exception (fundamental, categorical, not role-exhausted) and why consciousness/good meet them while water/Hesperus do not. This will be the main target of criticism.
      *   **Risk of Ad Hocness:** Opponents will argue it's tailor-made to save dualism/non-naturalism. You need principled arguments distinguishing the concepts.
      *   **Doesn't Eliminate Tension with (7):** The debate about whether zombies/good-without-N *really* survive ideal reflection remains crucial.

  **Conclusion:**

  Your instinct was correct – the deepest trouble lies in the conflict between your strict adherence to "Kripke's Moral" (4) and your desire to leverage the two-dimensional framework for anti-materialist (5) and anti-naturalist metaethical (8) conclusions. Your friend identified the most acute symptom ((4) vs. (5)) but underestimated the metaethical implication ((4) vs. (8)).

  **Recommendation for the Seminar:**

  1.  **Acknowledge the Tension:** Explicitly state the apparent conflict between the general principle derived from Kripke (epistemic gap ≠ modal gap) and your arguments concerning consciousness and morality.
  2.  **Propose the Revision:** Clearly articulate your revised, qualified version of Commitment (4) as the key to resolving this tension. Explain *why* you think consciousness (and perhaps 'good') warrant the exception based on the nature of the concepts involved.
  3.  **Defend the Distinction:** Be prepared to vigorously defend *why* phenomenal/normative concepts differ fundamentally from natural kind concepts in a way that justifies treating the epistemic gap differently concerning the modal gap. This will be the crux of the discussion.
  4.  **Frame (7) as a Strength:** Emphasize that grounding primary intensions in ideal rational reflection (7) strengthens your claims about what is *genuinely* primarily possible.

  Focusing your presentation on how your qualified revision of (4) resolves this core tension and provides a unified framework for Kripkean cases, consciousness, and metaethics will make for a strong and philosophically engaged seminar presentation. Good luck!
