answer: |-
  ### Exam Question: Functional Decision Theory and Anomalous Predictions (20 marks)

  **Scenario A: Counterfactual Mugging**  
  A perfect predictor flips a coin. If heads, it asks you for $100. If tails, it asks for nothing *only if* it predicts you would have paid had the coin been heads. You value $1,000 if tails (if asked nothing).  

  **Scenario B: XOR Blackmail**  
  A perfect predictor observes a uniformly random bit *X*. If *X=1*, it sends you a letter demanding $100, threatening harm costing $10,000 unless paid. The letter is sent iff *X=1* and it predicts you *would pay*, or *X=0* and it predicts you *would not pay*.  

  **Scenario C: XOR Charity Appeal**  
  A perfect predictor observes whether a famine victim exists (*V=1* or *V=0*). It sends a letter requesting a $100 donation iff either:  
  - *V=1* and it predicts you *would donate*, OR  
  - *V=0* and it predicts you *would not donate*.  
  You value saving the victim at $10,000. If *V=1* and you don’t donate, you lose $10,000. If *V=0*, nothing is at stake.  

  **Question**  
  Explain how Functional Decision Theory (FDT) evaluates the *policy* of paying/donating in Counterfactual Mugging (A) and XOR Blackmail (B). Derive FDT’s prescription for the XOR Charity Appeal (C). Discuss what this reveals about the key difference between (A) and (B), and why both Causal Decision Theory (CDT) and Evidential Decision Theory (EDT) fail in these cases.  
  *(~1,000 words; 20 marks)*  

  ---

  ### Model Answer (700 words)  

  **FDT’s Policy Evaluation**  
  FDT evaluates actions by selecting the *best decision rule* (policy), considering how that rule performs across all possible states the agent could face.  

  - **Counterfactual Mugging (A)**: FDT pays if asked.  
    The policy *P*: "Pay if asked" yields:  
    - If coin heads (ask for $100): Pay → lose $100.  
    - If coin tails (ask nothing): Predictor saw *P* would pay → gives $1,000.  
    Expected value (EV) of *P*: *0.5(–100) + 0.5(1000) = 450*.  
    The policy *¬P*: "Refuse if asked" yields $0 in both cases (tails: no payment → no reward). EV = 0.  
    **FDT pays** because *P* maximizes utility.  

  - **XOR Blackmail (B)**: FDT refuses to pay.  
    The policy *P*: "Pay if blackmailed" correlates with *X=1* (harm occurs):  
    - If *X=1*: Predictor sees *P* → sends letter. You pay → lose $100, avoid harm. Net: –100.  
    - If *X=0*: Predictor sees *P* → expects payment, but *X=0* → *no letter sent*. No cost.  
    EV of *P*: *0.5(–100) + 0.5(0) = –50*.  
    Policy *¬P*: "Refuse if blackmailed":  
    - If *X=1*: Predictor sees *¬P* → sends letter. You refuse → lose $10,000.  
    - If *X=0*: Predictor sees *¬P* → no letter. No cost.  
    EV of *¬P*: *0.5(–10,000) + 0.5(0) = –5,000*.  
    **FDT refuses** because *¬P* minimizes loss, but *both policies lose money* due to adversarial correlation. FDT picks *¬P* as the lesser evil.  

  **XOR Charity Appeal (C)**: FDT donates.  
  The policy *D*: "Donate if asked" links to the victim’s existence (*V=1*):  
  - If *V=1*: Predictor sees *D* → sends letter. You donate → lose $100, save victim → net +9,900.  
  - If *V=0*: Predictor sees *D* → expects donation, but *V=0* → *no letter sent*. No cost.  
  EV of *D*: *0.5(9,900) + 0.5(0) = 4,950*.  
  Policy *¬D*: "Refuse if asked":  
  - If *V=1*: Predictor sees *¬D* → sends letter. You refuse → lose $10,000.  
  - If *V=0*: Predictor sees *¬D* → no letter. No cost.  
  EV of *¬D*: *0.5(–10,000) + 0.5(0) = –5,000*.  
  **FDT donates** because *D* yields high positive utility, while *¬D* causes massive loss when *V=1*.  

  **Key Difference Between (A) and (B)**  
  Both (A) and (C) reward cooperative policies: paying in (A) unlocks the tails reward; donating in (C) saves lives when needed. In (B), however, *any fixed policy is exploited*: paying invites blackmail (*X=1*), while refusing triggers harm when *X=1*. The predictor in (B) *punishes consistency* by aligning harm (*X=1*) with the agent’s predicted action. Crucially, (A) and (C) lack this adversarial intent—the predictor in (A) rewards precommitment to paying, and in (C), *V* is independent of your decision rule.  

  **Failures of CDT and EDT**  
  - **CDT** refuses in all cases. It ignores correlations, treating the predictor’s knowledge as irrelevant. In (A), CDT sees paying as causing a $100 loss with no counterfactual gain (tails is fixed). In (B) and (C), it refuses to "acquiesce to threats/demands." Thus, CDT loses $1,000 in (A), suffers harm in (B), and fails to save lives in (C).  
  - **EDT** pays in all cases. It updates on the *act of paying* as evidence: in (A), paying suggests tails (reward); in (B), paying suggests *X=0* (no harm); in (C), donating suggests *V=1* (high stakes). But EDT is exploitable: in (B), paying *correlates* with *X=1*, making harm *more likely* upon payment—yet EDT ignores this, accepting blackmail.  

  **Conclusion**  
  FDT distinguishes scenarios by how the predictor *leverages* the agent’s decision rule. In (A) and (C), the predictor rewards or aligns with cooperative policies, making paying/donating optimal. In (B), it adversarially exploits fixed policies, forcing refusal. CDT’s causal myopia and EDT’s gullibility prevent them from detecting these structural differences.  

  ---

  ### Marking Scheme (20 marks total)  
  **Must-hit points** (deduct marks if missing/unclear):  

  1. **FDT’s policy evaluation for Mugging (A)** (4 marks)  
     *Must explain: Paying policy yields $450 EV; refusing yields $0.  
     Mistake: Stating "FDT pays" without policy-level EV calculation.*  

  2. **FDT’s policy evaluation for Blackmail (B)** (4 marks)  
     *Must show: Paying policy has EV –$50; refusing has EV –$5,000.  
     Mistake: Claiming refusing is "optimal" without comparing negative EVs.*  

  3. **Derivation of FDT’s prescription for Charity (C)** (5 marks)  
     *Must derive: Donating policy gives EV $4,950; refusing gives –$5,000.  
     Mistake: Confusing (C) with (B) and prescribing refusal.*  

  4. **Key difference: (A)/(C) vs. (B)** (4 marks)  
     *Must state: (A) and (C) reward policy consistency; (B) exploits it adversarially.  
     Mistake: Focusing only on payouts without predictor’s intent/mechanism.*  

  5. **Critique of CDT/EDT** (3 marks)  
     *Must note: CDT refuses everywhere (causal independence); EDT pays everywhere (evidence).  
     Mistake: Omitting why CDT/EDT fail in specific cases (e.g., EDT in blackmail).*  

  ---

  ### Confidence and Uncertainty  
  **Confidence**: 95% overall.  
  - The FDT analysis of (A)/(B) is standard (MIRI, Yudkowsky, Soares).  
  - The derivation for (C) follows logically: it structurally resembles (B) but with inverted payoffs and non-adversarial stakes.  
  - CDT/EDT critiques are well-established.  

  **Least certain point**: The *adversarial intent* distinction in (B) vs. (C). While clear mathematically, one could argue that (C) "exploits" the agent’s policy to extract donations. I claim the *lack of harm* in (C) makes it non-adversarial, but this hinges on normative assumptions about "exploitation." If pressed, I’d note: (B) forces lose-lose outcomes; (C) does not.
