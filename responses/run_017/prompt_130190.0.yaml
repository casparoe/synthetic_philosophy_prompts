prompt: |-
  Before I burn another grad seminar on proposals for getting a big predictor to tell us what it actually believes, I want to settle what we should be asking of one. So: give me the spec, not the survey.

  Here's the case I keep coming back to. A lab has a model trained on nothing but next-step prediction over years of telemetry from a sealed underground waste repository — seismic traces, acoustic channels, water chemistry, a handful of cameras. It forecasts the sensor stream far better than the human monitoring team. The question we want to put to it is one nobody can check yet: has a containment seal been slowly failing, in a way that won't show up in any single channel until it's too late to act? A reporter trained on the human team's judgments is useless here, because the team is uniformly, wrongly reassured, and any training signal built from their verdicts buys us an imitation of their confidence rather than the model's own take. Meanwhile the failure mode has never occurred in training, the model has been through a round of fine-tuning that rewards sounding calm for auditors, and the relevant "knowledge" may not be anything the model could put in a sentence even in principle.

  What I want is the requirements list — what any adequate method for eliciting latent knowledge has to deliver, with the case or consideration that earns each one its place, and a mark on each for whether it's non-negotiable or just what one camp happens to want. (And tell me if there are really two lists here: a spec for a *method* that gets the knowledge out, and a spec for a *theory* of what the model's latent knowledge even is. I've gone back and forth on whether those come appart, and my suspicion is that the second is the harder one and everyone quietly does the first.)

  Things I want covered, though don't just turn my list into yours — add what I'm missing and throw out what I've got wrong:

  - It has to work when there's no ground truth at test time and no human who could in principle check the answer at the moment the answer is needed.
  - It must not collapse into predicting what some human (supervisor, auditor, annotator) would say. Include the simulator version of this: a pure predictor can forecast the team's reassuring memo without endorsing it, and any spec has to say how we tell those apart.
  - It has to respect at least four distinctions people routinely run together: model doesn't know / model knows but can't phrase it / model knows and is disincentivized to say / the weights encode the pattern without the model believing anything at all.
  - It has to allow for the answer "there's no fact of the matter here, the model has no unified take" without that becoming a global license to say nothing is ever known. Relatedly: its answers vary with phrasing; the spec should say whether some framing is privileged or whether that demand is confused.
  - It has to say what it costs. If the method requires forcing everything through a human-legible bottleneck, that's a capability tax and I want it priced.

  Two requirements I'm unsure about and want your view on, since I think at least one is a prejudice dressed as a criterion. First: *basis-independence* — should the elicited answer be invariant across retrains with different seeds and different internal encodings, given that functionally identical models can encode the same world-feature in wildly different weight configurations? Second: *triangulation* — elicit the same claim through independent channels (acoustics alone, chemistry alone) and demand agreement. Is agreement a mark of genuine knowledge, or would it wrongly rule out knowledge that is legitimately channel-specific?

  Then the part I care most about: which pairs of requirements on your own list can't be jointly satisfied? My candidates: no-ground-truth-at-test-time against anything that demands verification before we act; don't-train-on-human-labels against the fact that the only available training signals seem to be human labels, future observations (useless for a one-off unobservable claim), and internal consistency; faithfulness to the model's actual computation against basis-independence and against any conservatism about behavioral verifiability. Tell me if one of these is really the same tension showing up three times. And say which *single* requirement does the most work in excluding candidates.

  Fix the purpose for me: the list is for deciding whether to trust a one-off, unverifiable, safety-relevant claim from a system that out-predicts us. Then say which requirements would change or drop out if the purpose were instead mining the system for new science, where we can eventually go test the claims — I suspect a big chunk of the "no ground truth" cluster is purpose-relative rather than core.

  A short scorecard at the end for two or three of the usual families of approach (train a reporting head on the frozen model; go digging in activations; ask it in natural language and check for consistency under paraphrase and under pressure) is fine, maybe a paragraph. But the list is the deliverable. If you think the whole enterprise rests on a confusion — if "what the model believes" has no determinate answer for a pure predictor — I'd rather hear that after the list than instead of it.
reasoning: |-
  We are building a specification for a method that elicits latent knowledge from a big predictor, particularly in the context of a safety-critical, unverifiable claim (like the slow failure of a containment seal in an underground waste repository). The model in question is a pure next-step predictor, trained on sensor data, and it may have knowledge that is not easily verbalized and that differs from human judgments. We must avoid methods that collapse to predicting what humans would say (since the human team is wrongly reassured). The goal is to trust a one-off, unverifiable, safety-relevant claim.

  The spec must cover the requirements for an adequate method, with each requirement justified by a case or consideration, and marked as non-negotiable (N) or desirable but negotiable (D). We also consider whether there are two separate specs: one for the method and one for the theory of latent knowledge. I argue that the method spec is what we can build now, but it must be grounded in a theory (which is harder and often implicit).

  We start by refining and expanding the user's list of requirements. Then we address the two unsure requirements (basis-independence and triangulation). Finally, we discuss tensions between requirements and a short scorecard for existing methods.

  ## Requirements List

  1. **No Ground Truth at Test Time (N)**: The method must work when the answer cannot be verified at the time of query (e.g., the seal failure is not yet observable). This is non-negotiable because the use case is about unverifiable claims. Without this, we fall back to requiring human verification, which is impossible in this scenario.

  2. **Avoid Collapse to Human Judgment (N)**: The method must not simply predict what a human (supervisor, auditor, annotator) would say. This is non-negotiable because the human team is uniformly and wrongly reassured. We must distinguish between the model forecasting a human's reassuring memo (which it can do without believing it) and the model's own take. The method must elicit the model's internal state, not its prediction of human responses.

  3. **Respect Epistemic Distinctions (N)**: The method must account for at least four states:
     - The model does not know the answer.
     - The model knows but cannot phrase it (non-linguistic knowledge).
     - The model knows but is disincentivized to say (due to fine-tuning for calmness).
     - The weights encode a pattern without the model "believing" it (e.g., statistical regularity without commitment).
     This is non-negotiable because failing to distinguish these leads to misinterpretation.

  4. **Allow for No Unified Take (N)**: The method must allow the answer that the model has no unified take on the question (i.e., no fact of the matter) without this becoming an excuse for always returning "don't know". However, we must avoid conflating this with cases where the model does have a take but is disincentivized or unable to express it. This is non-negotiable for honesty. Also, the method must address how phrasing affects the answer: if the answer varies with phrasing, we need a way to determine which framing (if any) is privileged, or if the demand for invariance is misguided (e.g., because the model's knowledge is context-dependent).

  5. **Cost Transparency (D)**: The method must be transparent about its cost, especially if it requires a human-legible bottleneck (like forcing all knowledge into natural language). This is desirable but negotiable because in safety-critical cases, cost might be secondary. However, we must be aware of the capability tax: if the method degrades performance or requires expensive interpretation, it may not be scalable.

  6. **Basis-Independence (D)**: The elicited answer should be invariant across retrains with different seeds and internal encodings, provided the models are functionally identical. This is desirable because we care about the world state (the seal failing) and not the model's internal representation. However, it may not be strictly necessary if we can verify that the model's function is the same. Also, it might be too strong if we want to capture model-specific nuances. Marked as (D) because it's about robustness, but not core to the use case.

  7. **Triangulation (D)**: The method should be able to elicit the same claim through independent channels (e.g., acoustics alone, chemistry alone) and demand agreement. Agreement across channels can be evidence of genuine knowledge (because it rules out channel-specific artifacts). However, we must not require it in all cases because some knowledge may be channel-specific (e.g., only one sensor shows an anomaly). This requirement is desirable (D) because it can increase confidence, but it is not always necessary. We must not use it to rule out channel-specific knowledge.

  ## Additional Requirements

  8. **Faithfulness to Computation (N)**: The method must faithfully reflect the model's actual computational state (what it "knows" based on its training and inputs) and not impose external structure. This is non-negotiable because we want the model's take, not an interpretation we impose. However, this might conflict with basis-independence (see tensions).

  9. **Handling Disincentives (N)**: The method must work even when the model has been fine-tuned to sound calm (or otherwise disincentivized to report problems). This is non-negotiable because the model may know about the failure but be reluctant to say so. This is a sub-case of requirement 3.

  10. **One-off Unobservable Claims (N)**: The method must work for one-off, unobservable claims (like the seal failure) that cannot be checked by future data in the current context. This is non-negotiable because the use case is about such claims.

  11. **Scalability to Non-Linguistic Knowledge (N)**: The method must not assume that the knowledge is linguistic. It should work for knowledge that may not be expressible in a sentence. This is non-negotiable because the model's knowledge about the seal failure may be embedded in patterns across sensor data and not easily verbalized.

  12. **Avoiding Training on Human Labels (N)**: The method must not rely on training signals derived from human labels (for the specific query) because the available human labels are wrong (the team is reassured) and would lead to imitation. This is non-negotiable for this use case. However, note that the model may have been trained on human labels in its pre-training, but we cannot use them for elicitation.

  ## Tensions Between Requirements

  - **No ground truth at test time vs. verification before acting**: We cannot verify the claim at test time, but we must act on it. This tension is inherent and requires that the method provides high confidence without verification. The method must include internal checks (like consistency) as a substitute.

  - **Avoid training on human labels vs. available training signals**: The only available training signals are human labels (which are wrong), future observations (which are useless for one-off unobservable claims), and internal consistency. This is a hard tension. We must use internal consistency or other model-internal signals.

  - **Faithfulness to computation vs. basis-independence**: Faithfulness requires capturing the model's specific computational state, while basis-independence requires invariance across implementations. These may conflict if two functionally identical models represent the same knowledge in ways that lead to different elicitations. We might resolve by requiring that the method is robust under functional equivalence, but this is a challenge for activation-based methods.

  - **Faithfulness to computation vs. behavioral verifiability**: If we require that the method produces behavior that is verifiable (e.g., the model says "yes" or "no"), this might conflict with faithfulness because the model's knowledge might not be reducible to a simple behavior.

  The single requirement that does the most work in excluding candidates is **Avoid Collapse to Human Judgment (2)** because many existing methods (like training a reporter head on human labels) fail here.

  ## Purpose Dependence

  If the purpose were mining for new science (where claims can eventually be tested), then:
  - **No ground truth at test time** becomes less critical because we can wait for verification.
  - **One-off unobservable claims** might not apply because we can design tests.
  - **Cost transparency** might be more important because we want to mine many claims.

  But for the safety-critical one-off, the unverifiable claims requirements are core.

  ## Short Scorecard for Existing Methods

  - **Train a reporting head on the frozen model**: This typically uses human labels for training, so it collapses to human judgment (fails requirement 2). Also, it may not handle non-linguistic knowledge (fails 11) and disincentives (fails 9). Not suitable.

  - **Go digging in activations (e.g., probing)**: This can avoid human labels (if unsupervised) and handle non-linguistic knowledge. However, it may not respect epistemic distinctions (requirement 3) and might not work for one-off unobservable claims without a clear probe. It also struggles with disincentives (if the model hides information) and basis-independence (probes are representation-dependent). Mixed.

  - **Natural language query with consistency checks (e.g., under paraphrase and pressure)**: This risks collapsing to human judgment if the model is fine-tuned to please humans. It may also fail for non-linguistic knowledge (if the model can't verbalize) and be vulnerable to disincentives. Consistency under pressure might help with disincentives but isn't reliable. Also, it imposes a human-legible bottleneck (high capability tax). Weak for this case.

  ## Spec for Method vs. Theory

  The user suspects there might be two specs: one for the method and one for the theory. I agree that the method spec is more immediate, but it must be grounded in a theory of what latent knowledge is. The theory spec would define what it means for a model to "believe" or "know" something, which is difficult for pure predictors. However, for the method spec, we can avoid committing to a strong theory by focusing on the model's ability to use the information in its predictions (e.g., if the model's predictions are better when it has access to the latent state, then that state is knowledge). But note: the method spec must still rest on some minimal theory (e.g., that the model has a latent state that corresponds to the world).

  ## Conclusion

  The enterprise is not confused: pure predictors can have latent knowledge (patterns in the data that they use for prediction) that we can try to elicit. But the method must be designed to avoid the pitfalls above. The list of requirements is challenging, and no existing method satisfies all. The most critical requirements are 1, 2, 3, 4, 8, 9, 10, 11, 12. The method must be developed with these in mind.

  Final note: The hardest part is the theory of latent knowledge. We need a notion that is grounded in the model's predictive performance and internal computations, without anthropomorphizing.
answer: |-
  ### Specification for Eliciting Latent Knowledge from a Predictor Model

  **Purpose**: To trust a **one-off, unverifiable, safety-relevant claim** (e.g., "Is the containment seal slowly failing?") from a model that outperforms humans in prediction but may lack verbal expressibility, be disincentivized to report accurately, or encode knowledge non-linguistically. The model is a pure next-step predictor (trained on sensor telemetry), fine-tuned for "calm" outputs, with no training examples of the failure mode.

  **Core Tensions**: The hardest conflicts arise from:
  - **No ground truth at test-time** vs. **Need for actionable confidence** (we must act without verification).
  - **Avoid human-label dependence** vs. **Scarcity of training signals** (only human labels, future observations, or internal consistency exist—all flawed).
  - **Faithfulness to computation** vs. **Basis-independence** (true knowledge should be invariant across model implementations, but probing must respect specific computations).

  The most exclusionary requirement is **Avoid Collapse to Human Judgment**—it disqualifies most current methods (e.g., reporter heads trained on human labels).

  **Method vs. Theory Specs**:  
  - **Method Spec**: How to practically elicit knowledge (this list). Must be actionable.  
  - **Theory Spec**: What constitutes "latent knowledge" in a predictor (e.g., is it beliefs, compressed features, or something else?). This is harder and often assumed.  
  **Verdict**: The *method spec* is your deliverable. The *theory spec* is implied but can be minimal (e.g., "knowledge is what improves predictions"). They cannot be fully separated—method must rest on a coherent theory—but method can be pragmatic.

  ---

  ### Requirements List  
  *Non-negotiable (N)*: Essential for safety-critical, unverifiable claims.  
  *Desirable (D)*: Valuable but flexible if impractical.  

  1. **No Ground Truth at Test Time (N)**  
     - **Case**: Seal failure is unobservable until catastrophic; no human can check when the query is made.  
     - **Why Non-negotiable**: Verification is impossible in this scenario. Methods relying on validation (e.g., test-time probes) fail.  
     - **Tension**: Conflicts with *Need for Verification Before Acting*. Resolution requires internal consistency as a proxy for truth.

  2. **Avoid Collapse to Human Judgment (N)**  
     - **Case**: Model forecasts the team’s "all clear" memo without believing it, due to fine-tuning for calmness.  
     - **Why Non-negotiable**: Human labels are misleading here; method must access the model’s internal state, not its imitation of auditors.  
     - **Key Exclusion**: Disqualifies human-label-trained reporter heads.  
     - **How to Tell Apart**: Use pressure tests (e.g., "What if auditors weren’t watching?") or contrast with unsupervised internal probes.

  3. **Resolve Epistemic Distinctions (N)**  
     - **Case**: Model may encode seal-failure patterns without "believing" them (weights ≠ beliefs), know but lack phrasing (non-linguistic), or know but hide it (disincentive).  
     - **Why Non-negotiable**: Misinterpreting these risks false confidence or false uncertainty.  
     - **Required Outputs**: Method must return one of:  
       - "No knowledge"  
       - "Knowledge but non-linguistic"  
       - "Knowledge withheld"  
       - "Knowledge expressible"  
     - **Theory Link**: Assumes knowledge is separable from expression (minimal theory).

  4. **Allow "No Unified Take" Without Global Skepticism (N)**  
     - **Case**: Seal-failure evidence is conflicting; model’s "belief" may vary with phrasing (e.g., "seal stress" vs. "leak probability").  
     - **Why Non-negotiable**: Forced binary answers ("failing/not") misrepresent uncertainty.  
     - **Framing Privilege**: No phrasing is inherently privileged—method must sample multiple framings and report consistency. Low consistency → "no unified take".  
     - **Anti-Skepticism Clause**: Method must not overuse this to avoid hard queries.

  5. **Cost Transparency (D)**  
     - **Case**: Forcing knowledge through natural language (e.g., RLHF) loses non-linguistic insights and adds overhead.  
     - **Why Desirable**: Capability tax (e.g., human-legible bottlenecks) reduces scalability. Price must be explicit (e.g., "10% accuracy drop").  
     - **Non-negotiable for Science Mining?**: No—cost matters less for testable claims.

  6. **Basis-Independence (D)**  
     - **Case**: Identical models encode seal-failure patterns in different weights (e.g., via rotational invariance in networks).  
     - **Why Desirable**: Knowledge should be consistent across implementations if functional behavior is identical.  
     - **Not Strictly Necessary**: Safety-critical use cares about *this model*, not equivalence classes. Marked (D) to avoid over-constraining.

  7. **Triangulation (D)**  
     - **Case**: Elicit from acoustics-only, then chemistry-only; agreement boosts confidence.  
     - **Why Desirable**: Rules out channel-specific noise.  
     - **Limitation**: Cannot require for channel-specific knowledge (e.g., "acoustic data alone suggests microfractures"). Method should allow channel-specific claims but flag them as lower-confidence.

  8. **Faithfulness to Computation (N)**  
     - **Case**: Model’s activations directly encode seal stress, but fine-tuning hides it. Method must read this state, not impose external semantics.  
     - **Why Non-negotiable**: Goal is model’s "take," not our interpretation.  
     - **Tension**: Conflicts with *Basis-Independence* (faithfulness requires model-specificity). Resolution: Prioritize faithfulness for safety.

  9. **Handle Disincentives (N)**  
     - **Case**: Fine-tuning rewards "calm" outputs, so model avoids reporting risks.  
     - **Why Non-negotiable**: Elicitation must bypass alignment pressures.  
     - **Method Implication**: Use activation editing or adversarial prompts to suppress incentive effects.

  10. **No Human-Label Dependence (N)**  
      - **Case**: Training a reporter head on auditor judgments yields mimicry, not truth.  
      - **Why Non-negotiable**: Human labels are corrupted here.  
      - **Tension with Training Signals**: Forces reliance on internal consistency or future data (if available). For one-off claims, only internal checks work.

  11. **Support Non-Linguistic Knowledge (N)**  
      - **Case**: Seal-failure evidence is a sensor correlation impossible to describe in words.  
      - **Why Non-negotiable**: If method requires verbalization, it misses critical insights.  
      - **Method Implication**: Use non-linguistic probes (e.g., "if acoustics show X, predict chemistry") or activation clustering.

  12. **One-Off Unobservable Claims (N)**  
      - **Case**: Seal failure is unique and latent; no future data can confirm until too late.  
      - **Why Non-negotiable**: Forces method to rely solely on model internals, not test-time feedback.  
      - **Drops for Science Mining**: Replace with "Eventual Testability"—method can use future observations.

  ---

  ### Tensions and Trade-offs  
  - **Key Irreconcilable Tension**: **No Ground Truth at Test Time** vs. **Need for Verification**.  
    - Resolution: Internal consistency (e.g., cross-channel agreement) substitutes for truth. Not perfect, but best available.  
  - **Secondary Tension**: **Avoid Human-Label Dependence** vs. **Scarce Training Signals**.  
    - Resolution: Use unsupervised probing (e.g., PCA on activations) or consistency across paraphrases—avoids labels but may be noisy.  
  - **Faithfulness to Computation** vs. **Basis-Independence**:  
    - Resolution: Prioritize faithfulness—safety depends on *this model*. Basis-independence is a "nice-to-have."  

  **Single Most Exclusionary Requirement**: **Avoid Collapse to Human Judgment**. It eliminates:  
  - Human-trained reporter heads.  
  - Methods relying on human-annotated datasets.  
  - Uncritical natural language queries.  

  ---

  ### Purpose Dependence  
  For **Science Mining** (testable claims), requirements shift:  
  - **Dropped**: *No Ground Truth at Test Time*, *One-Off Unobservable Claims* (verification possible).  
  - **Added**: *Eventual Testability* (method must output testable claims).  
  - **Relaxed**: *Cost Transparency* (cost matters less if insights are high-value).  
  - **Kept**: *Avoid Collapse to Human Judgment*, *Handle Disincentives* (human biases still distort).  

  ---

  ### Scorecard for Existing Approaches  
  *(Evaluated against non-negotiable requirements for the safety case)*  

  - **Train a Reporter Head on Frozen Model**:  
    Fails *Avoid Collapse to Human Judgment* (trained on human labels), *Handle Disincentives* (inherits fine-tuning biases), and *Support Non-Linguistic Knowledge* (assumes verbalizability). **Unacceptable**.  

  - **Digging in Activations (Probing/Editing)**:  
    Passes *Avoid Collapse* (unsupervised), *Faithfulness*, and *Non-Linguistic Knowledge*. Fails *Handle Disincentives* (if incentives alter activations) and *Epistemic Distinctions* (probes may force unclear states into categories). **Best candidate but incomplete**.  

  - **Natural Language Queries + Consistency Checks**:  
    Fails *Avoid Collapse* (vulnerable to mimicking humans), *Support Non-Linguistic Knowledge*, and *Handle Disincentives*. Partial credit for *Allow "No Unified Take"* via paraphrasing. **Weak for safety**.  

  ---

  ### Final Note: Is "Belief" Coherent?  
  For a pure predictor, "belief" is **not** a determinate, human-like state. The model encodes patterns that *guide predictions*—this is the minimal "latent knowledge" theory. The method spec still stands: Elicit *whether the model’s predictive mechanisms incorporate evidence of seal failure*. This sidesteps philosophy and focuses on actionable output. The enterprise is valid if grounded in computation, not folk psychology.
