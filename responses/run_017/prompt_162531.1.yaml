  We are designing an in-class simulation for an 80-minute undergraduate seminar on distributive justice. The students have covered utilitarianism and luck egalitarianism but not prioritarianism. The goal is to help them distinguish between the intrinsic value of equality and the priority of benefits to the worse off, and to experience the levelling-down objection and the potential harshness of prioritarianism.

  Constraints:
  - Materials: poker chips, index cards, envelopes, whiteboard.
  - No real money; use points or raffle tickets.
  - 16 students, one 80-minute session (can split into two 40-minute halves with a break).
  - No mini-lecture up front; avoid terms like "levelling-down objection" until debrief.
  - The simulation should have three rounds (with an optional fourth for sufficiency) and a debrief.

  Brainstorming at least five or six possible mechanics and then selecting one:

  1. **Mechanic A: The Leaky Transfer Game**
     - Students are secretly given unequal endowments of chips. They can propose transfers, but each transfer loses a fraction (e.g., 20%) to evaporation. The group must decide on a transfer plan by voting. Then, they design a scoring rule to evaluate distributions. After that, introduce the destruction box: any chip put in is destroyed, reducing inequality without helping anyone. See if they use it.
     - Why drop? This is close to the rough shape provided, so it's a good base. We'll build on it.

  2. **Mechanic B: The Veil of Ignorance Allocation**
     - Students design a distribution rule behind a veil of ignorance (they don't know their future position). Then they are assigned positions and endowments. They might design a rule that prioritizes the worst off, but then when they are in the better-off position, they object to transfers that hurt them a lot to help the worst off a little.
     - Why drop? This might not directly show the levelling-down problem and the box destruction. Also, the veil of ignorance might lead them to prioritarianism too quickly without first experiencing the equality issue.

  3. **Mechanic C: The Auction with Weighted Bids**
     - Students are given unequal endowments and can bid for additional chips (or points) in an auction. But the auction uses a scoring rule that weights bids from the worse off more heavily. This might show that helping the worse off is more valuable, but it doesn't clearly show the levelling-down problem.
     - Why drop? It doesn't naturally include the destruction box and might be too complex with auction mechanics.

  4. **Mechanic D: The Production and Redistribution Game**
     - Students work in groups to produce chips (by solving puzzles or something) and then redistribute. The scoring rule is designed by the class. Then, after production, they can destroy some of their own chips to reduce inequality.
     - Why drop? The production phase might take too much time and distract from the distributional issues.

  5. **Mechanic E: The Lottery Ticket Redistribution**
     - Each student gets a random number of lottery tickets (representing chances to win a prize). They can transfer tickets, but with a leak. Then, they can choose to destroy some of their own tickets to make the distribution more equal. The scoring rule evaluates the expected utility or the equality of the distribution.
     - Why drop? This might work, but the randomness of the lottery might obscure the distributional concerns we want to highlight. Also, the prize might make it about risk rather than pure distribution.

  6. **Mechanic F: The Progressive Taxation Simulation**
     - Students are assigned incomes (in chips). They design a tax system to redistribute. The tax collected is subject to efficiency loss (leak). Then, they can have a "burn tax" that just destroys money to reduce inequality without redistribution.
     - Why drop? This is very similar to A and the rough shape, but it might feel too applied and less abstract. The rough shape is more abstract and thus better for the philosophical point.

  I will stick with **Mechanic A** (the leaky transfer game) because it matches the rough shape and directly addresses the goals. We will refine it to include the destruction box and the prioritarian weighting.

  Now, the detailed plan:

  **Title:** The Chip Distribution Challenge

  **Learning Objectives:**
  1. Distinguish between the intrinsic value of equality and the priority of benefits to the worse off.
  2. Experience the levelling-down objection (that destroying resources to achieve equality is absurd).
  3. Experience the harshness of prioritarianism (that helping the worst off might require great sacrifices from the better off for small gains).
  4. (Optional) Consider a sufficiency threshold and its cliff effect.

  **Materials:**
  - Poker chips (at least 200, in two or three colors if possible, but one color is fine)
  - Index cards (16 for initial endowments, and more for voting or writing rules)
  - Envelopes (16, for secretly distributing endowments)
  - Whiteboard and markers
  - A small box (the "destruction box")
  - Timer

  **Preparation:**
  - Prepare envelopes for Round 1: Each envelope contains an index card with the initial endowment. We need an unequal distribution. Let's use:
    - 4 students: 2 chips (the worst off)
    - 8 students: 5 chips (middle)
    - 4 students: 10 chips (best off)
    Total chips: 4*2 + 8*5 + 4*10 = 8 + 40 + 40 = 88 chips.
  - Also, prepare for Round 3: A scenario card for a decision (details below).

  **Session Structure (80 minutes):**

  1. **Introduction (5 minutes):**
     - Explain: "Today we're going to do a simulation about distributing chips. The goal is to achieve the best overall distribution according to a rule that you will design. We'll have several rounds, and in each, you'll have a chance to change the distribution. At the end, we'll see how the rules you created worked out and discuss the implications."
     - Emphasize: "The chips represent units of well-being. We assume they are comparable across people and that more chips are better. We'll ignore any real-world complications about what well-being is for now."

  2. **Round 1: Designing the Scoring Rule and Leaky Transfers (25 minutes)**
     - **Step 1 (5 min):** Distribute envelopes secretly. Each student opens their envelope and sees their chips. Do not reveal to others. (They can hold the chips in their hands under the table if needed, but we want secrecy so they don't know others' amounts.)
     - **Step 2 (5 min):** Ask the class: "How should we decide if one distribution of chips is better than another? Let's create a scoring rule. We want a single number that captures the 'goodness' of a distribution. What formula should we use?" 
       - Guide them: They might suggest total chips (utilitarianism) or equality (e.g., 1 minus the Gini coefficient). If they don't bring up equality, ask: "What about fairness? Should we care about how equal the distribution is?" 
       - Aim for a rule that incorporates equality. Example: They might propose a rule that subtracts a penalty for inequality. Write suggestions on the board and have a quick vote. 
       - **Target Rule:** Let's assume they choose: Score = Total Chips - (some constant * the standard deviation). Or, simpler: Score = Total Chips - (0.5 * Range). (Range = max - min). 
       - If they are stuck, propose: "What about Score = Total Chips - (0.5 times the gap between the richest and poorest)?" Write the rule on the board: **Scoring Rule 1: S1 = (Sum of all chips) - 0.5 * (Max - Min)**
     - **Step 3 (10 min):** "Now, you can change the distribution. You can transfer chips from one person to another, but there's a catch: for every chip you move, 20% (1 out of 5) will be lost. So if you move 5 chips, only 4 arrive. You must decide as a group which transfers to make. You have 10 minutes to discuss and agree on transfers." 
       - They might propose transfers from rich to poor. Let them discuss and come to a consensus. The leak means that total chips decrease, but inequality might decrease more. 
       - After agreement, collect the chips to be moved, remove 20% (round down? let's say round down to avoid fractions), and redistribute the rest to the intended recipients. 
       - Then, calculate the new distribution and the score under Rule 1. Write the score on the board.
     - **Step 4 (5 min):** "Now, we have a new option. See this box? Any chip put in this box is destroyed. It doesn't go to anyone. But you can use it to reduce the maximum. For example, if the richest person puts a chip in the box, their holdings decrease, so the gap between rich and poor might decrease. Would you like to use the box? You can discuss and then vote on whether to destroy some chips and how many."
       - They might do it to improve the score by reducing the range (which helps in Rule 1). Calculate the new score if they destroy some chips. 
       - This should feel absurd: they are destroying resources to make the distribution more equal, but no one gains. This is the levelling-down objection.

  3. **Round 2: Introducing Priority (20 minutes)**
     - **Step 1 (5 min):** "We saw that Rule 1 might lead us to destroy chips. That seems wasteful. Let's redesign the scoring rule to avoid that. We want to help the worse off without destroying resources. How can we change the rule?" 
       - Guide them: They might suggest giving more weight to the chips held by the worse off. If not, ask: "Should a chip given to a poor person count for more than a chip given to a rich person?" 
       - **Target Rule:** They might propose a rule that weights the chips by the person's position. For example: Score = Sum of (chips for person i) * (weight i), where weight i is higher for worse-off people. 
       - If they are stuck, propose: "What if we order people from worst off to best off and assign weights: the worst off gets weight 2, the next weight 1.8, ..., the best off gets weight 1? But to keep it simple, let's use two groups. How about: for anyone below the median, each chip counts as 1.5 points; above the median, 1 point? Or even simpler: only the worst off gets extra weight." 
       - We'll go with: **Scoring Rule 2: S2 = Sum of chips for each person, but each chip held by the worst-off person counts as 2 points, and for everyone else as 1 point.** 
       - Write this rule on the board. (Note: The worst-off person might be tied. Then we can say all with the minimum count as 2. But to avoid ties, we might assign unique positions.)
     - **Step 2 (5 min):** Reset the distribution to the initial one (or use the distribution after Round 1 transfers, but to make it clear, let's reset to initial). 
       - "Now, we have the same transfer rules: you can move chips with a 20% leak. But now we have a new scoring rule. How would you like to transfer chips? Discuss and agree."
       - They might transfer to the worst off. Let them do so. Calculate the new score under Rule 2.
     - **Step 3 (10 min):** Introduce a dilemma: "Now, I have a scenario. Suppose we can give one extra chip to the worst-off person. But to do so, we must take 10 chips away from the best-off person. And there's a 0% leak for this transfer (so it's direct). Would you do it? Let's vote." 
       - They have to consider: The worst-off person gains 1 chip, which under Rule 2 is worth 2 points. The best-off person loses 10 chips, worth 10 points. So net loss of 8 points. But if they are prioritarian, they might say yes because the worst off gains more in moral weight. 
       - In Rule 2, the net effect on the score is: +2 (for the worst off) -10 (for the best off) = -8. So the rule says it's worse. But wait, we set the weights: worst off counts double. But in the transfer, we are taking 10 from the best off and giving 1 to the worst off. 
       - Actually, the rule would say: the 1 chip to the worst off is +2, the 10 chips from the best off is -10. So net -8. So they shouldn't do it? But we want a case where they do it even at a high cost. So we need to adjust the weights. 
       - **Problem:** With the weights we have, taking 10 to give 1 is a net loss. We need a rule where the weight for the worst off is high enough that they might do it. 
       - Revised Rule 2: Let the worst off have weight 3, others 1. Then: +3 for the worst off, -10 for the best off = -7, still a loss. We need a transfer that is a net gain? 
       - Alternatively, we can have a rule that is not additive per chip but uses a concave function? But that might be too complex. 
       - Instead, let's change the scenario: "We can transfer 1 chip to the worst off at a cost of 10 chips from the best off, but without leak. Under our rule, the score change is: for the worst off, +1 chip * 2 = +2; for the best off, -10 chips * 1 = -10; net -8. So the rule says don't do it. But what if we think that helping the worst off is so important that we would do it even if it reduces the total? Then we need a different rule." 
