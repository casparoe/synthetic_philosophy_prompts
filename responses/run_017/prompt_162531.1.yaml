  **Revised Timeline (80 minutes):**

  - **0-5 min:** Introduction.
  - **Round 1 (25 min):**
    - 5-10 min: Distribute endowments secretly.
    - 10-15 min: Design scoring rule (Rule 1: equality-enhanced).
    - 15-25 min: Discuss and do leaky transfers (20% leak).
    - 25-30 min: Introduce destruction box and decide whether to use it. (But note: we are at 30 minutes total. We have 50 left.)
