answer: |-
  ### Joint Statement on Akrasia and Hyperbolic Discounting  
  **Signed:** [Discounter] and [Agency Theorist]  

  ---

  #### 1. Agreed Claims  
  We concur on the following empirically and theoretically grounded points:  

  1. **Hyperbolic Discounting (HD) Dominance**: Exponential discounting fails to descriptively model human intertemporal choice. HD (steep short-term discounting flattening over time) robustly explains *t0–t1 preference reversals* (e.g., t0 LL preference switching to t1 SS).  
  2. **Zero-Cost Guardrail (ZCG) Data Validity**:  
     - At t0, >50% pay $1 to precommit to the guardrail (disabling SS for 90s).  
     - At t1, ~50% forgo pressing the free guardrail.  
     - Non-pressers bifurcate into **Faders** (SS seems optimal at t1; relieved by forced guardrails) and **Strainers** (choose SS while reporting “I shouldn’t”; annoyed by forced guardrails).  
     - Groups are: stable over repeated trials, HD-modeled equally well, and pass comprehension/confabulation checks.  
  3. **Akrasia Requires Dual Explanation**: Any theory must account for:  
     - (a) *Preference Shifts* (Faders: no t1 conflict; HD-compatible),  
     - (b) *Concurrent Judgment-Action Gaps* (Strainers: “I judge SS worse *now* but choose it”; not HD-predicted).  
  4. **Commitment Devices Work Empirically**: Precommitments (e.g., Beeminder stakes) reduce akrasia rates for *both* groups.  
  5. **HD Explains Faders Fully**: Faders reflect HD’s core mechanism: proximity amplifies SS’s subjective value, reversing t0 preferences. The guardrail’s 90s delay de-amplifies SS’s value via HD dynamics.  

  ---

  #### 2. Residual Disagreements  
  | Issue | Discounter’s View | Agency Theorist’s View | Substantive/Verbal |  
  |-------|-------------------|------------------------|--------------------|  
  | **Strainers’ t1 Reports** | "Verbal reports are *t0-carryover artifacts*: Strainers ‘remember’ t0 judgments but *currently* prefer SS. No ‘better judgment’ exists at t1—only competing preferences." | "Reports reflect *real-time judgment*: Strainers hold a concurrent, all-things-considered ‘ought’ at t1 (SS is worse) but override it. This *is* weakness of will." | **Substantive**. Turns on whether self-reports index *current* judgment or *recalled* beliefs. |  
  | **Faders’ Mechanism** | "Faders’ behavior is *pure preference reversal* under HD. Attention shifts are epiphenomenal; SS’s value surge explains inattention to LL." | "Faders experience *attentional occlusion*: HD alters salience, making LL ‘invisible’ at t1. The guardrail works by *reorienting attention*, not just delaying SS." | **Verbal** (if "preference" includes salience). **Substantive** if attention is a non-HD process. |  
  | **Akrasia’s Core** | "Akrasia *is* HD + bargaining among time-slices. ‘Willpower’ is a folk term for successful bargaining (e.g., via bundling)." | "Akrasia includes *judgential override*: a distinct capacity to act against one’s *present* best judgment, irreducible to HD." | **Substantive**. Discounter denies clear-eyed akrasia; Agency Theorist affirms it. |  

  ---

  #### 3. Cruxes  
  **Crux 1: Are Strainers’ t1 Reports About Current Judgment?**  
  - **Test**: At t1, interrupt Strainers *mid-reach* for SS and ask: *“Right now, which option better achieves your goals?”* Record: (a) verbal response, (b) subsequent choice (if allowed), and (c) frustration level (1–10 scale).  
    - *Discounter Predicts*: >80% answer “SS” — aligning with revealed preference. Reports of “acting against judgment” will correlate with recalling t0 plans, not t1 assessments.  
    - *Agency Theorist Predicts*: >70% answer “LL” — affirming concurrent judgment. Frustration will spike if choice is interrupted.  
    - *Load*: If Strainers say “SS,” Discounter’s model holds; if “LL,” Agency view gains evidence of judgment-action gaps.  

  **Crux 2: Are Faders’ Shifts Preference Change or Attentional?**  
  - **Test**: At t1, offer Faders a trivial *LL-boosting cue* (e.g., “Click here to see your t0 note about why $20 matters”) *before* the guardrail decision. Measure guardrail-press rates vs. control.  
    - *Discounter Predicts*: Cues won’t increase guardrail use. Faders’ SS preference is fixed by HD; salience manipulations don’t override value calculations.  
    - *Agency Theorist Predicts*: Cues boost guardrail pressing by >25%. Attentional refocusing partially decouples from HD, reactivating latent LL preferences.  
    - *Load*: If cues work, Agency’s attentional mechanism gains support; if not, HD’s value-only account strengthens.  

  ---

  #### 4. Practical Advice for the Client  
  **Convergence**: Both recommend:  
  - **Precommitments**: Use Beeminder stakes for 11pm goals ($ penalty for lapses).  
  - **Bright Lines**: Ban goal-undermining actions (e.g., delete food-delivery apps after 10pm).  
  - **Bundling**: Pair undesired actions with costs (e.g., “If I browse social media after 11pm, I donate $20 to a cause I hate”).  

  **Divergence**:  
  - *Discounter’s Addendum*: “Optimize bargaining power. Shorten delay cycles: set 15-min deadlines (e.g., ‘write 50 words by 11:15pm’) to exploit HD’s steepest drop-offs. Use *immediate* rewards (e.g., ‘after 30 mins of work, unlock 1 episode’).”  
  - *Agency Theorist’s Addendum*: “Build judgment-enforcing rituals. At 10:45pm, physically rehearse saying: ‘I will not [lapse] because [goal].’ If you’re a Strainer, install ‘pause buttons’ (e.g., a 90s delay app for distractions); if a Fader, set salient t0 reminders (e.g., a screensaver of your goal).”  

  ---  
  **Word Count**: 1,140  
  **Status**: This document reflects agreed facts, clear disagreements, and testable next steps. We endorse Sections 1 and 4 fully and commit to testing the cruxes above.
