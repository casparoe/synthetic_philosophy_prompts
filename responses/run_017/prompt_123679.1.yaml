  Structure in markdown:

  # Joint Statement on Weakness of Will and Hyperbolic Discounting

  ## 1. Agreed Claims

  We, the undersigned, agree on the following:

  1. **The phenomenon of time-inconsistency**: Human choice often displays a reversal of preference between two options as the time of the delayed reward approaches, even when no new information is acquired. This is robustly demonstrated in intertemporal choice experiments.

  2. **Hyperbolic discounting as a descriptive model**: For a wide range of cases, hyperbolic discount functions (where the discount rate decreases over time) provide a better fit to human and animal behavior than exponential discount functions (with a constant discount rate).

  3. **The Zero-Cost Guardrail data**: The experimental paradigm described (with Faders and Strainers) is valid and reflects a stable split in the population. Both groups:
     a. At t0, prefer the larger later (LL) reward and express a desire for the guardrail.
     b. At t1, a substantial proportion of both groups fail to press the guardrail button when given the chance.
     c. The Faders at t1 do not experience the SS option as something to avoid and feel relief when the guardrail is applied; the Strainers at t1 report awareness that they are choosing against their better judgment and feel annoyance when the guardrail is applied.

  4. **The need for explanation**: Any account of weakness of the will (akrasia) must explain both the Fader and Strainer patterns. Specifically:
     a. How can an agent at t0 plan to use a commitment device (like the guardrail) and then at t1 fail to deploy it?
     b. How can an agent at t1 choose an option while simultaneously reporting that it is worse (as in the Strainers)?

  5. **Hyperbolic discounting explains the Faders**: The Fader pattern is well explained by hyperbolic discounting. At t0, the LL reward is preferred because it is sufficiently far in the future. At t1, the immediacy of the SS reward causes a reversal of preference. The guardrail, by introducing a small delay (90 seconds) to the SS option, pushes it into a time range where the discount curve flattens, allowing the LL to be chosen again. The Faders' relief when the guardrail is applied is consistent with this.

  6. **The Strainers challenge the pure discounting model**: The Strainer pattern, where the agent at t1 reports that they are choosing the SS option despite judging it worse at that moment, is not directly predicted by hyperbolic discounting alone. In standard hyperbolic discounting, the agent at t1 should prefer the SS option, so they would not report it as worse. This requires additional explanation.

  ## 2. Residual Disagreements

  The following table outlines the key points of ongoing disagreement:

  | Issue | Discounter's View | Agency Theorist's View | Type of Disagreement |
  |-------|-------------------|------------------------|----------------------|
  | **The nature of the Strainers' t1 report** | "The Strainers' verbal report at t1 is a memory of their t0 judgment or a self-prediction about future regret, not a reflection of their current t1 judgment. At t1, they actually prefer the SS option, and the report is an artifact of conflicting temporal selves." | "The Strainers' report at t1 is a direct expression of their current all-things-considered judgment at t1. They are judging the SS option as worse at the very moment of choosing it." | Substantive. The discounter sees the report as not reflecting current preference, while the agency theorist does. |
  | **The mechanism of the Faders' behavior** | "The Faders' behavior is a straightforward result of preference reversal due to hyperbolic discounting. The guardrail works by changing the effective timing of rewards, thus altering the discounting calculation." | "The Faders' behavior involves more than preference reversal; it includes a shift in attention or salience that makes the long-term goal less accessible. The guardrail works by re-engaging the agent's long-term perspective." | Partly verbal. Both agree on hyperbolic discounting as a factor, but the agency theorist emphasizes attentional mechanisms beyond discounting. The discounter would subsume attention under discounting. |
  | **The core of akrasia** | "Akrasia is entirely reducible to time-inconsistent preferences arising from hyperbolic discounting and can be addressed by commitment devices that alter the choice architecture." | "Akrasia includes a distinct phenomenon of acting against one's current best judgment, which is not reducible to discounting and requires an account of agency and judgment." | Substantive. The discounter denies the existence of clear-eyed akrasia, while the agency theorist asserts it. |

  ## 3. Cruxes

  We identify the following cruxes that, if resolved, would move at least one party:

  ### Crux 1: The Evidential Status of the Strainers' t1 Report

  - **Test**: Run a variant of the Zero-Cost Guardrail where, at t1, the subject is interrupted just before choosing and asked: "Which option do you think is better for you right now?" and "Which option do you prefer right now?" We record the choice they then make. Also, in a separate condition, we ask after the choice: "Did you just choose what you thought was best at that moment?" We compare Strainers' responses in the interruption condition versus the standard condition to see if the report is consistent and if it affects behavior.
  - **Discounter's Prediction**: The interruption will cause Strainers to align their report with their actual preference (they will say SS is better and prefer it) and the rate of guardrail non-use will be similar. The post-choice report of acting against judgment will drop in the interruption condition because the act of asking forces a reevaluation that aligns preference and judgment.
  - **Agency Theorist's Prediction**: The interruption will not change the rate of reports of acting against judgment. Strainers will still report that the LL is better for them even at t1, and they will still choose the SS. The act of asking does not change the judgment.

  ### Crux 2: The Nature of the Faders' Preference Change

  - **Test**: In the Zero-Cost Guardrail paradigm, add a condition where, at t1, the subject is given a brief reminder of their t0 choice and reasoning (e.g., "You previously chose the $20 in 30 days and said you wanted the guardrail pressed. Do you still want to press the guardrail?"). We measure the effect on guardrail pressing and on self-reports.
  - **Discounter's Prediction**: The reminder will have little effect on Faders because their preference has genuinely reversed due to discounting. They will still not press the guardrail and will choose SS. The guardrail's effectiveness when applied is due to the delay, not the reminder.
  - **Agency Theorist's Prediction**: The reminder will increase guardrail pressing among Faders by reorienting their attention to their long-term goal. The guardrail's effectiveness is partly due to the delay and partly due to the cognitive refocusing.

  ## 4. Practical Advice for the Individual

  For the individual described (mid-thirties, works from home, blows up her own goals at 11pm):

  - **Convergence**: Both agree that commitment devices are effective. She should set up pre-commitments that make it harder to deviate from her goals at 11pm (e.g., locking away distractions, using apps like Cold Turkey, or Beeminder stakes).
  - **Divergence**:
    - *Discounter's additional advice*: Focus on restructuring the choice architecture to change the immediate costs and benefits. For example, make the unwanted behavior (e.g., browsing social media) more effortful by requiring multiple steps, and make the desired behavior (e.g., going to bed) easier. Use bundling (e.g., only watch a favorite show while exercising).
    - *Agency Theorist's additional advice*: Work on strengthening the capacity for judgment at the moment of action. This includes mindfulness practices to increase awareness of the conflict in the moment (like the Strainers) and precommitments that include a reflective component (e.g., a note from her t0 self explaining why the goal matters). For Fader-like lapses, environmental cues to reactivate long-term goals may help; for Strainer-like moments, techniques to pause and reassert judgment (like the guardrail) are key.

