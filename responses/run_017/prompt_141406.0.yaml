prompt: |-
  I teach a 12-student upper-level undergraduate seminar on concepts and induction — mostly philosophy majors, with a few who have taken machine learning. I have one 90-minute session, a whiteboard, index cards, and no projector. I want to stage a live activity built on the Bongard format: two sets of six figures, one set satisfying a concept and the other not, with the task of recovering the concept. The thing I want students to walk out having felt — not been told — is that what makes such a puzzle solvable in practice is not the twelve figures but an unstated agreement about which properties are eligible to appear in a rule, and that this agreement is doing more work than the data.

  Constraints on the design:

  - No lecture and none of the philosophical vocabulary up front: the terms get named only after the final round.
  - Students must state their rules in a small explicit property language that I hand out. Please design it — six to eight primitives along the lines of number of connected components, closed versus open curve, containment, relative size, symmetry, and whatever else you think earns its place. A rule has to be mechanically checkable against any figure I can draw.
  - I do not want to simply ban the cheap strategies: the rule that lists the six left-hand figures as a disjunction, or the rule phrased so vaguely that nothing could refute it. I want the scoring to make them unattractive. Give me payoffs, including an explicit simplicity penalty, that punish clause-stuffing and enumeration without my having to police them.
  - Include a held-out round: once rules are locked, I reveal eight further figures and re-score every rule against them.
  - Include an adversarial round in which a team receives another team's rule and must construct a monster — a figure that satisfies the rule exactly as written yet that anyone would sort into the opposite set. Specify how a monster is adjudicated and how, at a cost, the rule-writing team may then patch its rule.

  Deliverables: the property language; three problems graded in difficulty, described precisely enough that I can draw them from your text (complete specs for the first two, the third compressed into four lines at most), each with the intended rule, at least one decoy rule that fits all twelve training figures but splits the held-out set, and the held-out figures themselves; the rules and payoffs; a round-by-round timeline with minute marks; a debrief mapping each round onto the point it is meant to land; what will predictably go wrong the first time I run it and how to handle it; and a frank note on which feature of the problem the activity cannot reproduce, so that I know what I must supply myself.

  Format: at most 800 words in total, with the timeline as a compact table of no more than six rows and everything else in short bullets. American English, please.
reasoning: |-
  Okay, the user is teaching an upper-level undergrad seminar on concepts and induction. They need a live activity based on Bongard problems to illustrate that solvability depends on unspoken agreements about eligible properties, not just the data. 

  First, I need to design a property language. The user wants 6-8 primitives that are mechanically checkable. Good candidates include: connected components (1 or more), closure (closed shape or not), containment (one shape inside another), relative size (larger/smaller), symmetry (symmetric/asymmetric), and vertex count (3 or more). These cover geometric properties while being simple to verify visually.

  For the scoring system, I'll propose a payoff scheme that naturally penalizes complex rules. Base points for correct classifications, minus a simplicity penalty per clause. This makes enumeration and vague rules unattractive without explicit bans. The held-out round with new figures will expose overfitting.

  The adversarial monster round is crucial. Teams get another team's rule and try to create a figure that technically satisfies it but clearly belongs in the wrong set. This forces precise language. The rule writers can then patch their rule at a cost, demonstrating how concepts evolve.

  Now for the problems. Three graded difficulties:
  1) Easy: convexity vs concavity. Left: convex shapes. Right: concave or hole-containing. Held-out figures test edge cases.
  2) Medium: shape count parity. Left: odd number of shapes. Right: even. Decoy: "contains a circle" fits training but fails held-out.
  3) Hard: containment direction. Left: smaller shape inside larger. Right: larger inside smaller. Compressed description.

  Timeline must be tight for 90 minutes: 
  - 10 min intro and language explanation
  - 15 min problem 1 (rule writing)
  - 10 min scoring and monster creation
  - Repeat for problem 2
  - 20 min for problem 3 including patching
  - 15 min debrief

  Debrief maps each round to key takeaways: property language reveals prior assumptions, scoring shows simplicity tradeoffs, monsters expose rule brittleness, held-out demonstrates overfitting.

  Predictable issues: students might miss properties (add a cheat sheet), argue over monster validity (use majority vote), or create vague rules (scoring penalizes this). The frank note: real-world concepts aren't defined by necessary-and-sufficient conditions - that's what the teacher must emphasize later.

  This design meets all constraints while keeping the philosophical revelation experiential. The unstated agreement about eligible properties becomes palpable through the activity's friction points.
answer: |-
  ### **Property Language**  
  Primitives (mechanically checkable):  
  1. **Components**: Count distinct shapes (`exactly 1`, `>1`)  
  2. **Closure**: Shape fully closed (`closed`) or open (`open`)  
  3. **Containment**: One shape fully inside another (`contains`, `no_containment`)  
  4. **Symmetry**: Shape has reflection symmetry (`symmetric`, `asymmetric`)  
  5. **Vertex Count**: Total vertices across all shapes (`≤3`, `>3`)  
  6. **Relative Size**: Largest shape is ≥2× area of smallest (`size_diff`, `no_size_diff`)  
  7. **Curvature**: All shapes have curved edges (`curved`, `not_curved`)  

  Rules use AND/OR/NOT with these primitives (e.g., `closed AND symmetric`).  

  ---

  ### **Problems**  
  **Problem 1 (Easy):**  
  - **Left (concept)**: All shapes closed, symmetric, no containment. *Intended rule*: `closed AND symmetric AND no_containment`  
  - **Right (non-concept)**: Open, asymmetric, or containment.  
  - **Held-out (4 each)**: L: Symmetric closed circle, square; R: Open triangle, circle inside square.  
  - **Decoy rule**: `curved` (fails when held-out includes non-curved symmetric LHS figure).  

  **Problem 2 (Medium):**  
  - **Left**: Shapes with >1 component OR containment. *Intended rule*: `components>1 OR contains`  
  - **Right**: Single component, no containment.  
  - **Held-out**: L: Two circles, square containing triangle; R: Single hexagon, open curve.  
  - **Decoy rule**: `vertex_count>3` (fails on held-out circle with 0 vertices).  

  **Problem 3 (Hard):**  
  - **Left**: Smaller shape inside larger (`contains AND size_diff`).  
  - **Right**: Larger inside smaller OR no containment.  
  - **Held-out**: L: Dot in big circle; R: Big circle in tiny square.  
  - **Decoy rule**: `contains` (fails on held-out RHS: big in small).  

  ---

  ### **Rules & Payoffs**  
  - **Base score**: +1 per correctly classified figure (max 12 for training, 8 for held-out).  
  - **Simplicity penalty**: −1 per clause (primitive or operator) in rule.  
  - **Adversarial bonus**: +2 per accepted monster (see below).  
  - **Patching cost**: −3 points to revise rule after monster.  

  ---

  ### **Timeline**  
  | Time  | Activity |  
  |-------|----------|  
  | 0-10  | Intro: Distribute property cards. Explain rules/scoring. Demo a figure. |  
  | 10-30 | **Round 1 (Easy)**: Teams (3-4 students) write rules → submit on index cards. |  
  | 30-40 | Scoring: Reveal held-out figures. Re-score all rules (base + penalty). |  
  | 40-55 | **Adversarial Round**: Swap rules. Teams design monsters for rival rule. |  
  | 55-70 | **Round 2 (Medium)**: Repeat rule-writing → held-out scoring → monsters. |  
  | 70-85 | **Round 3 (Hard)**: Rule-writing → monsters → optional patching (cost: −3). |  
  | 85-90 | Debrief: Elicit observations → name "eligible properties" & "overfitting". |  

  ---

  ### **Debrief Mapping**  
  - **Rule-writing**: Reveals reliance on "eligible properties" (e.g., no one uses "made before noon").  
  - **Simplicity penalty**: Shows enumeration (`figure1 OR figure2...`) is costly.  
  - **Held-out round**: Exposes decoy rules → illustrates overfitting.  
  - **Monsters**: Prove rules are brittle without shared conceptual priors.  
  - **Patching**: Mimics theory refinement under counterexamples.  

  ---

  ### **Predictable Issues & Fixes**  
  - **Issue**: Students use vague/unlisted properties (e.g., "pointy").  
    *Fix*: Require rules in the property language; reject non-conforming submissions.  
  - **Issue**: Monster disputes (e.g., "this *is* symmetric!").  
    *Fix*: Adjudicate via majority vote; use pre-drawn held-out figures as precedent.  
  - **Issue**: Slow rule-writing.  
    *Fix*: Cap submissions at 5 minutes; offer "simplest rule" bonus (+3).  

  ---

  ### **Frank Note**  
  **The activity cannot reproduce real-world concept fluidity**:  
  In practice, "eligible properties" evolve with context (e.g., culture, domain). Here, the language *fixes* eligibility upfront—you must later clarify that this is artificial scaffolding.
