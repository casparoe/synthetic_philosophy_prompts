answer: |-
  **Ask Dr. Ordinal**  
  *Director, Bureau of Revealed Welfare*  
  **Statute:** *The Revealed Preference Act (Sections 3a-c)*  
  *(3a) Welfare is revealed solely through choice.*  
  *(3b) *De gustibus non est disputandum*: Preferences are given.*  
  *(3c) Utility is ordinal; interpersonal comparisons are void.*

  ---

  **Dear Dr. Ordinal,**
  As a hospital nurse, I accepted a 30% pay cut to avoid redundancy. My workload remains high, and I struggle financially. Will the Bureau record me as worse off?
  *—Anxious in A&E*

  **Dr. Ordinal replies:**  
  Your **revealed preference** is unambiguous. Faced with the **budget set** {unemployment, reduced wage}, you selected the latter. This demonstrates you strictly prefer your new consumption bundle to unemployment. The **weak axiom of revealed preference** is satisfied: you did *not* choose unemployment when both were feasible. Your choice **rationalizes** the observed outcome. The Bureau certifies no welfare loss. The feasibility of your old wage is irrelevant per Section 3b. Your selection *defines* your welfare gain relative to the alternative.

  ---

  **Dear Dr. Ordinal,**
  My son’s school closed. He now spends all day alone in his room, barely eating or speaking. He *says* he’s content. Can the Bureau classify this isolation as a harm?
  *—Worried Mother*

  **Dr. Ordinal replies:**  
  The Bureau cannot recognize "harm" absent a demonstrable choice ranking alternatives lower. Your son **reveals** a **preference relation** by consistently choosing solitude over other observable actions (e.g., seeking interaction). His statement of "contentment" is inadmissible data (Sections 3a, 3c). **Ordinal utility** is merely a numerical representation of choice behavior, unique only up to **increasing transformation**. We cannot measure, sum, or compare subjective states ("happiness"). His choices are consistent; thus, no welfare loss is recorded. His preference formation (Section 3b) is beyond our remit.

  ---

  **Dear Dr. Ordinal,**
  Our house burned down. We fled barefoot into February snow, suffering frostbite. The insurer denied compensation, citing our "choice" to flee. The Bureau’s report concurred, voiding our disaster relief claim. How is this not coercion?
  *—The Chilled Couple*

  **Dr. Ordinal replies:**  
  The insurer correctly applied the statute. Your feasible **budget set** at ignition was {perish in flames, flee barefoot}. You revealed a strict preference for fleeing. The **revealed preference relation** (fleeing > perishing) is **rationalizable** under duress. While the set was constrained, your selection remains definitive of welfare (Section 3a). The insurer’s denial coheres with Bureau principles. If the sequence seems incoherent—e.g., you previously insured against fire—we attribute it to a shift in tastes between the Tuesday you bought the policy and the Tuesday you fled. **Indirect utility** concerns feasible sets, not outcomes.

  **Regarding coercion:** Our mandate excludes analyzing how sets are formed (Section 3b). Your choice, from *whatever* set confronts you, remains sovereign. Thus, the Bureau certifies a welfare gain: you maximized utility by selecting your most-preferred available option. Fleeing barefoot was, demonstrably, better than the alternative. Congratulations on your optimization.

  ---

  *The Bureau of Revealed Welfare: Certifying Welfare Gains Wherever Choice Occurs.*
