prompt: |-
  hey — I'm 17, I do policy debate and student government, and I'm doing an independent project this spring on who should get to vote. The thing I keep runing into is that everyone argues by just pointing at one case: someone says 16 year olds pay taxes and can drive, someone else says no but they still live with their parents and cant really judge policy, and then nothing moves. So before I write anything I want the full spec: what would a theory of the franchise actually have to get right to be worth taking seriously? Write me the desiderata list — which cases it has to handle without embarrassment (permanent residents who've lived in a town for twenty years and pay taxes there, citizens who moved abroad at age three and will never come back, people with severe cognitive disabilities, people in prison, a 14 year old who'll be living with the consequences of a climate or debt decision for seventy years, tourists and short term workers), which distinctions it isn't allowed to collapse (having a vote at all vs how much your vote is worth, being entitled to vote vs it being a good idea for you to vote, membership in a community vs merely being subject to its laws, the right to vote vs the right to run or to hold office), and which of those requirements are genuinely non-negotiable versus just something one side assumed at the start. Give me the case or the argument behind each requirement, not just the bullet, and say for each whether you think it's a real desideratum or a prejudice of one camp.

  The part I actually care about: I have this idea and I cant tell if it's good or if I'm just attached to it. Call it the stake gradient — the claim to a vote doesn't switch on at some age or at citizenship, it's a matter of degree, and it's strongest for whoever has the most years left living under whatever gets decided, which if you take it seriously gives a 15 year old a stronger claim than a 75 year old and makes the standard theyre too young to understand objection look like it's answering a different question entirely. I want that tested against your list rather than just rated: does it violate a desideratum that the usual views all satisfy (a flat age cutoff, the all-affected-interests principle, membership or consent of the governed, the you've paid in / done national service picture), and does taking it seriously force you toward fractional or weighted votes — parents casting proxy votes for their kids, or 16 to 21 year olds getting half a vote — or can you get the stake gradient without any of that, and what would that even look like in practice?

  Two more things. Please flag any pair of requirements on your list that you suspect can't both be satisfied, since if there is one that's probably the thing I'd build the whole paper around. And tell me which single desideratum rules out the most of the standard positions. If it helps to fix the purpose, I want a criterion good enough to actually decide whether my city should let 16 year olds and green card holders vote in municipal elections — not just something that sounds nice in a round of debate. And don't give me a reading list or citations or anything, I'll go find sources myself, I just want the shape of the argument.
reasoning: |-
  Okay, this is a fascinating and impressively sophisticated query from a 17-year-old. They're clearly deeply engaged in policy debate and thinking critically about voting rights theory. Let me unpack what they're asking for.

  First, the core request: they want a comprehensive list of desiderata (requirements) for any serious theory of voting rights. They're frustrated with how current debates get stuck on single cases without a framework. They've also proposed their own idea - the "stake gradient" - and want it tested against these requirements.

  The key elements they specified:
  - Must-handle cases (permanent residents, expats, disabled, prisoners, young people affected by long-term policies)
  - Must-preserve distinctions (vote existence vs weight, entitlement vs advisability, etc)
  - Need to know which requirements are non-negotiable vs debatable
  - Want to know if any requirements conflict fundamentally
  - Need to identify which single requirement rules out most standard positions

  Their stake gradient idea is particularly interesting - weighting voting power by years of expected life under policies. They're worried it might force fractional voting or proxy systems, but want to explore alternatives.

  This isn't just academic for them - they want to apply it practically to their city's voting age and resident non-citizen voting debates. That practical focus is crucial.

  The response needs to be structured but conversational, rigorous but not academic-jargony. No citations per their request, but the reasoning must be sound enough to support further research. Most importantly, it must engage deeply with their original concept while providing the evaluative framework they requested.

  Hmm... I should organize the desiderata into categories: foundational (non-negotiable), operational (how systems work), and contested (where theories differ). For each, I'll note why it matters and whether it's truly essential. Then test their stake gradient against the framework, especially looking for conflicts and whether fractional voting is unavoidable. The "unavoidable conflicts" and "which desideratum rules out most positions" points will probably be where their paper finds its edge.
answer: |-
  Here's a comprehensive desiderata list for a serious theory of the franchise, designed to test your "stake gradient" idea and cut through the usual stalemates. I'll break it down as requested, flag tensions, identify the most restrictive desideratum, and pressure-test your concept.

  **I. Foundational Desiderata (Non-Negotiables - Violating These Embarrasses Any Theory)**

  1.  **The Binding Power Justification:** *Why it's non-negotiable:* Voting grants power to make binding rules enforced with coercion (laws, taxes, imprisonment). Any theory must justify *why* this power legitimately resides with Group X over Group Y. *Case it must handle:* Prisoners subject to prison rules/taxation; non-resident citizens subject to laws when visiting/inheriting. *Prejudice Test?* Real Desideratum. Without this, you have no starting point.

  2.  **Avoiding Tyranny of the Majority/Minority:** *Why it's non-negotiable:* The franchise cannot systematically disenfranchise a group subject to the laws *without justification tied to the purpose of voting itself*. A theory must prevent permanent exclusion of groups demonstrably subject to the polity's power. *Case it must handle:* Permanent residents paying taxes for decades; people with cognitive disabilities living in the community. *Prejudice Test?* Real Desideratum (rooted in anti-oppression principles). Theories differ on *how much* inclusion is required, but *permanent, categorical exclusion* without justification linked to voting's function is fatal.

  3.  **Distinguish "Entitled to Vote" from "Wise to Vote":** *Why it's non-negotiable:* Competence/wisdom is a separate axis from legitimacy. A theory must define the *entitlement* condition (why someone gets a say) independently of whether their vote is likely to be "good" or "informed". *Case it must handle:* People with low education/intelligence; voters swayed by misinformation; arguably, 16-year-olds. *Prejudice Test?* Real Desideratum. Collapsing these justifies paternalistic exclusions ("they're not smart enough") which undermine democratic legitimacy.

  4.  **Distinguish "Subject to Law" from "Entitled to Vote":** *Why it's non-negotiable:* Being affected by laws is necessary but *not sufficient* for a vote. Tourists, short-term workers, and foreign investors are subject to laws but are almost universally excluded. A theory must explain the *additional* criterion beyond mere subjection. *Case it must handle:* Tourists arrested; short-term workers paying payroll taxes. *Prejudice Test?* Real Desideratum. The "All-Affected Interests" principle runs aground here without refinement.

  **II. Operational Desiderata (Core Functionality - Serious Theories Must Handle These Without Special Pleading)**

  5.  **Define the Relevant Polity/Political Community:** *Why it's essential:* Voting implies membership in a *specific* self-governing unit (city, state, nation). A theory must define the boundaries of that community and why membership matters. *Case it must handle:* Permanent residents vs. tourists; citizens who emigrated at age 3; dual citizens. *Prejudice Test?* Real Desideratum, but theories differ *wildly* on how to define community (birthright, consent, residence, shared identity). Your stake gradient challenges this directly.

  6.  **Address Temporal Scope (The "Future Generations" Problem):** *Why it's essential:* Policies have long-term consequences. A theory must grapple with whether/why those who will live longest under the laws have a stronger claim than those who won't. *Case it must handle:* Climate change policy; national debt; infrastructure projects lasting decades. *Prejudice Test?* Real Desideratum, often ignored. This is **crucial for your stake gradient**.

  7.  **Address Capacity/Practicality Constraints (Carefully):** *Why it's essential:* While wisdom ≠ entitlement, a voting system must be administratively feasible and require *some minimal agency*. Theories must navigate this without collapsing into competence-based exclusion. *Case it must handle:* Severe cognitive disabilities preventing expression of any preference; infants. *Prejudice Test?* Tricky. Need for *minimal agency* is a real constraint (can't poll infants), but easily misused as a proxy for competence (e.g., "16-year-olds lack capacity"). Must be applied minimally and neutrally.

  8.  **Distinguish "Right to Vote" from "Right to Run for Office/Hold Power":** *Why it's essential:* Different levels of responsibility/authority exist. A theory must explain if/why the franchise threshold differs from the threshold for holding executive or judicial power. *Case it must handle:* Age limits for President/Senator vs. voting age; citizenship requirements for office not required for voting. *Prejudice Test?* Real Desideratum. Running a state requires different skills/commitments than choosing representatives.

  **III. Contested Distinctions & Potential Tensions (Where Theories Diverge & Conflicts Arise)**

  9.  **Vote Existence vs. Vote Weight:** *Why it's contested:* Must a vote be equal to be meaningful? Can a theory justify *differentiated influence* (like your stake gradient implies) without violating equality? *Cases:* Your stake gradient; corporate voting shares; historical plural voting. *Prejudice Test?* **MAJOR TENSION POINT.** Equality is often assumed ("one person, one vote") but philosophically contested. Is formal equality (everyone gets *a* vote) sufficient, or must influence be equal? **This directly challenges your gradient.** Can you have "stake" without unequal weight?

  10. **"Paid In" / Contribution vs. Stake / Subjection:** *Why it's contested:* Is paying taxes necessary or sufficient? Does military/national service grant a stronger claim? Or is subjection to law the core? *Cases:* Lifelong residents on welfare vs. wealthy non-resident citizens; teenagers paying sales tax; conscripted soldiers. *Prejudice Test?* Often a prejudice ("No taxation without representation" reversed). Contribution is one *possible* proxy for stake/community, not necessarily foundational. Your gradient downplays this.

  11. **Consent of the Governed vs. Obligation of the Governed:** *Why it's contested:* Is voting based on actively joining/consenting (hard for minors/immigrants-by-birth)? Or based on being obligated by the laws? *Cases:* Children born into citizenship; immigrants gaining citizenship after long residence. *Prejudice Test?* Deep philosophical split (Locke vs. more communitarian views). Your stake gradient leans towards obligation/subjection.

  **Flagged Unavoidable Tensions (Your Paper's Core?):**

  *   **Tension A: Defined Community (5) vs. Temporal Scope/Future Stake (6):** Birthright/residence defines a *current* community. Your stake gradient prioritizes *future* subjects (young people). How do you reconcile excluding a 25-year-old tourist (high stake in future climate) while including an 80-year-old citizen (minimal future stake)? Can "community" be defined *by* future stake? This is **THE core tension for your theory**.
  *   **Tension B: Avoiding Tyranny (2) vs. Vote Weight Differentiation (9):** Giving less weight to elderly votes based on lower stake could be seen as a form of systematic disenfranchisement of a group subject to the laws *now*. Does your gradient create a new tyranny of the young? How does it handle groups with low "stake" due to disability or circumstance?
  *   **Tension C: Minimal Agency (7) vs. Future Stake (6):** Infants have maximal future stake but zero agency. How does your theory handle this without either granting voting rights to infants (absurd) or admitting a hard agency cutoff that contradicts pure future-stake logic? Proxy voting (parents for kids) is one solution, but problematic.

  **The Desideratum That Rules Out the Most Standard Positions: Desideratum 6 (Temporal Scope / Future Generations Problem).**

  *   **Why?** Flat age cutoffs (16, 18, 21) ignore future stake entirely. Lifelong citizenship/residency requirements favor the elderly over the young. "All-affected interests" usually focuses on *current* effects, struggling with future subjects. "Consent of the governed" struggles with the unborn/young children. "Pay-in/service" models favor established adults. Only theories explicitly grappling with intergenerational justice and the weight of future consequences take this seriously, and they often conflict sharply with simpler models.

  **Testing Your "Stake Gradient" Idea:**

  1.  **Strengths:**
      *   **Excels at Temporal Scope (6):** This is its core insight and strongest point, directly addressing a major gap.
      *   **Challenges "Paid In" Prejudice (10):** Correctly focuses on subjection/consequence over contribution.
      *   **Reframes "Competence" Objections (3):** Argues the "too young" objection answers the *wrong question* (wisdom/competence) instead of the entitlement question (stake).
      *   **Aligns with Binding Power Justification (1):** Grounds legitimacy in enduring subjection.

  2.  **Weaknesses & Challenges:**
      *   **Collapses Vote Existence & Weight? (Major Tension 9):** Your core idea ("stronger claim") inherently suggests differentiation. Can you *implement* a "stake gradient" without fractional/weighted votes? **Possibilities:**
          *   *Lower Voting Age:* Acknowledge higher youth stake by including them (e.g., 16+), but still "one person, one vote". This captures *some* stake but flattens the gradient.
          *   *Proxy Voting for Minors:* Parents get extra weight for young children. Problematic (parental interests ≠ child's; disenfranchises non-parents).
          *   *Future Voter Councils:* Advisory bodies for young people. Doesn't grant real power.
          *   **Conclusion:** A *pure* stake gradient strongly implies differentiated influence. Avoiding it requires diluting the core principle or finding non-voting forms of influence. A municipal proposal for 16+ voting is a *step* consistent with recognizing higher youth stake, but doesn't fully implement the gradient.
      *   **Defining Community (5):** Who counts for "years left living under"? Only current residents? Citizens? Future immigrants? Unborn children? This is messy. Your city example: Does a 16-year-old citizen moving for college in 2 years have more stake than a 30-year-old green card holder committed to staying? The gradient needs a clear anchor point.
      *   **Minimal Agency Constraint (7):** How young can it go? Does a 5-year-old have more stake than a 90-year-old? If so, how is their "vote" exercised without absurdity or violating minimal agency? This forces a practical cutoff *or* proxy system, conflicting with pure stake.
      *   **Avoiding Tyranny (2) & Equality (9):** Reducing the weight of elderly votes based on life expectancy risks systematic disenfranchisement of a vulnerable group subject to laws. Can this be justified without paternalism? Does high future stake justify *more* influence, or just *some* influence? This is a major hurdle.

  **Recommendation for Your City Proposal:**

  Your stake gradient strongly *supports* lowering the municipal voting age to 16 (recognizing higher stake than older voters) and *supports* allowing long-term resident non-citizens (green card holders) to vote (recognizing deep community ties and subjection). It provides a powerful justification *beyond* "taxation" or "driving". **Focus your paper on this practical application first.** Use the gradient to reframe the debate: Instead of "Are 16-year-olds competent?", ask "Who has the most enduring stake in the future of this city?"

  **The Shape of Your Argument:**

  1.  **Critique:** Show how current franchise justifications (age cutoffs, citizenship, competence, contribution) fail the Temporal Scope (6) and Binding Power (1) desiderata, especially regarding long-term policy impacts and youth subjection.
  2.  **Core Thesis:** Argue that the legitimacy of wielding binding power (Desideratum 1) is strongest when those with the greatest stake in the long-term consequences (Desideratum 6) have the most significant voice. Define stake primarily as duration of subjection to future policy consequences.
  3.  **Address Tensions:**
      *   **Community (5):** Define the municipal community as *current residents subject to its laws and bound to its long-term future*. Prioritize residence and commitment over citizenship for local elections.
      *   **Weight vs. Existence (9):** Argue that *inclusion* (e.g., 16+, non-citizen residents) is the primary and most justifiable recognition of higher stake within a practical framework. Explicit weighted votes are a bridge too far politically and philosophically (Tyranny/Equality tension). *Inclusion is the practical expression of recognizing higher stake.*
      *   **Agency (7):** Accept a practical, minimally restrictive agency threshold (e.g., basic understanding of voting, ability to express a choice - satisfied by 16-year-olds) as a necessary constraint separate from the stake principle.
  4.  **Practical Application:** Concretely advocate for 16+ voting and resident non-citizen voting in your city based on their high stake in the municipality's future. Use the gradient to dismiss competence objections as irrelevant to the entitlement question.

  Your stake gradient is a powerful and provocative lens. Its core insight (Temporal Scope/Stake) is a significant contribution. The challenge is navigating the inherent tensions it creates, especially regarding vote weight and community definition, without abandoning practical political reforms like the ones you care about. Good luck! This is exactly the kind of fresh thinking the debate needs.
