answer: |-
  1.  **Labels are arbitrary conventions:** The association between a word and its referent is socially determined, not inherent. This is a **platitude**, but it does *not* license the conclusion that "chairman" vs. "chairperson" is merely a matter of taste, as reformers agree labels *are* conventions but argue *which* convention we use matters due to its effects.
  2.  **Labels do not intrinsically change the referent's properties:** Calling a rose "stinkblossom" doesn't alter its scent; similarly, calling a leader "chairman" doesn't intrinsically make them male. This is **substantive and arguably true** for the *referent itself*, but it *does not* license the conclusion, as reformers focus on how the label shapes perception, framing, and social reality, not altering the biological sex of the specific person.
  3.  **Changing labels has no causal effect on thoughts or institutions:** Swapping "chairman" for "chairperson" doesn't cause changes in mental imagery, attitudes, or institutional structures. This is **straightforwardly false** (supported by psycholinguistics and sociology); it *would* license the commenter's conclusion if true, but it isn't.
  4.  **Meaning is solely reference:** The meaning of a term like "chairman" is exhausted by its extension (the set of people it refers to), excluding connotations, defaults, or framing effects. This is **substantive but defensible** within strict referential semantics, but it is **false** for natural language meaning (which includes pragmatics and connotation). If accepted, it *would* license the conclusion by dismissing concerns about defaults (your c) as irrelevant to "meaning".
  5.  **Any perceived difference is solely about signaling the speaker's stance:** The *only* consequence of choosing "chairman" over "chairperson" is to convey information about the speaker's attitudes or affiliations, not to change the world described. This is **substantive and arguably partially true**, but it **does not license the conclusion** because reformers argue the signaling *is* the social practice being contested and that it reinforces harmful defaults (your c), making it more than "mere taste". The commenter is almost certainly relying on a conflation of **1 and 4**, treating meaning as purely referential and conventions as arbitrary, thus dismissing framing effects (your c) as irrelevant.
