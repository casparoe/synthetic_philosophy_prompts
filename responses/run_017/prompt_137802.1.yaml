prompt: |-
  I run the consultation and engagement team at a unitary authority in England. My officers take in several hundred deputations, petitions and written submissions a year, and increasingly the difficulty is not volume but a recurring judgement call: what to do with contributions whose grounds are religious.

  The governing thought, as I understand it, is that a public body should be able to justify what it does by reasons that all its citizens could reasonably be expected to accept, and that this is meant to be a restraint on the state rather than on conscience. What is not obvious to me is how far that restraint reaches back into what we will accept, record and weigh when it comes *from* the public. My team has to rule on this in the room, in a couple of minutes, with no training in philosophy and no opportunity to consult; the ruling has to be one a non-specialist can apply consistently, it has to survive being read back in writing by the Monitoring Officer or, occasionally, by a judge; and where the procedure runs out it must hand the decision to a named person rather than pretend to a mechanical answer.

  I would like a written procedure we could actually run, and I think it needs to distinguish at least three stages rather than give one verdict: whether a contribution may be accepted and entered into the record at all; whether it may be counted as a reason bearing on the decision; and whether it may appear in the authority's own statement of reasons for the decision.

  There are some wrinkles I want the procedure either to use or to tell me are the wrong distinctions. First, I do not think you can tell from the words alone whether a reason is religious, since it seems to depend on why the speaker holds it. Second, some reasons have a religious ancestry but now travel free of it, and I am unsure whether the ancestry should matter. Third, asking someone to restate their reason in a shared idiom is not costless, and the cost falls unevenly — on people with less fluency in the majority vocabulary, on communities whose reasons are not detachable from their cosmology, and on anyone who would have to misdescribe why they believe what they believe to be heard at all. Fourth, there is a question I cannot settle about who authors a reason: if an officer or a councillor supplies the shared surrogate on the speaker's behalf, the reason that ends up counting is no longer theirs. Fifth, I want to know whether restraint is symmetric — whether a comprehensive secular doctrine gets the same treatment — and whether it bites equally on reasons that happen to support what the authority intended to do anyway.

  Please also say plainly whether we should translate contributions for the record or require speakers to translate to be heard, and why.

  Then apply the procedure to three cases. (1) A deputation against a proposed crematorium whose stated ground is that cremation is incompatible with the resurrection of the body; the speaker volunteers that she has no other objection and will not invent one. (2) A joint submission against a pavement-licensing extension from a mosques' council, whose ground is the prohibition on alcohol, and a residents' association, whose ground is noise and litter; the two reach the same conclusion and the officers disagree about whether the conclusion can be carried by the residents' reason alone. (3) A secular humanist society's submission that a faith-based adoption agency should be excluded from commissioning, grounded in a comprehensive claim about autonomy and religious formation, with an explicit refusal to offer a narrower reason. At least one of these should come out somewhere I or the councillors will not like, and I would rather you said where than softened it.

  Finally, tell me what the procedure cannot do.

  Please write in British English. I am not looking for a reading list or citations: I need something my officers can hold in their hands.
reasoning: |-
  Okay, this is a complex and nuanced operational challenge from a senior local government officer. The user manages consultation processes and needs a practical decision-making framework for handling religiously-grounded public contributions - something philosophically sound but operationally viable. 

  First, let's unpack the core tension: they need to balance democratic inclusion with Rawlsian public reason constraints, but through bite-sized procedural steps that non-specialist staff can apply in real-time. The five "wrinkles" they identify show sophisticated awareness of the practical pitfalls - especially about linguistic equity and reason ownership. 

  The three-stage approach (acceptance/recording, evidential weight, inclusion in final reasons) seems sensible. Key operational requirements stand out: decisions must be defensible to monitoring officers/judges, consistent across cases, and avoid false neutrality by delegating appropriately when the procedure reaches its limits. 

  For the religious ancestry question - that's a red herring. What matters is current justification, not pedigree. The fluency/cosmology point is crucial: forcing translation creates democratic exclusion. Better to record verbatim but filter at later stages. 

  On secular doctrines: yes, restraint must be symmetric. A militant atheist submission demanding exclusion of all religious adoption agencies would get the same treatment as a religious objection. 

  Procedure design priorities:
  - Must avoid metaphysical judgments (staff aren't theologians)
  - Need bright-line rules where possible ("would this sound religious to reasonable residents?")
  - Translation should never be required for acceptance, only for weight assessment
  - Ownership matters: officers shouldn't rephrase substantive reasons 

  For the test cases: 
  Case 1 (cremation) gets recorded but carries no weight - it fails the "could others reasonably accept this?" test. Harsh but necessary. 
  Case 2 (alcohol/noise) shows why we need stage separation: mosque's view gets recorded, but only residents' secular reasons carry weight. 
  Case 3 (humanists) is the symmetry test - their comprehensive autonomy claim gets same treatment as religious objections: recorded but not carried. 

  Biggest limitation: this can't resolve deeper value conflicts. When worldviews collide irreconcilably, the procedure just ensures fair process until delegation point.
answer: |-
  Here is a practical written procedure for handling contributions with religious grounds, designed for operational use by non-specialist officers in a unitary authority. It addresses your requirements for speed, consistency, legal defensibility, and clear delegation.

  ---

  **PROCEDURE: ASSESSING CONTRIBUTIONS WITH RELIGIOUS GROUNDS**  
  *For deputations, petitions, and written submissions*

  **Principles Governing This Procedure:**  
  1.  **Inclusion First:** All contributions may be **accepted and recorded** unless unlawful or abusive.  
  2.  **Weight Depends on Public Reason:** A contribution may **bear weight on the decision** only if grounded in reasons *all citizens could reasonably be expected to accept*.  
  3.  **Transparency in Justification:** The **Authority’s final statement of reasons** must rely *only* on publicly justifiable grounds.  
  4.  **Fairness & Equity:** Speakers are not required to ‘translate’ their reasons to be heard or recorded. Costs of engagement fall equally.  
  5.  **Symmetry:** Secular comprehensive doctrines (e.g., humanism, utilitarianism) are treated identically to religious ones.  

  **Decision Stages (Apply in Order):**  

  | **STAGE**          | **QUESTION TO ANSWER**                                                                 | **RULING & ACTION**                                                                                                                                 | **WHO DECIDES?**                      |
  | :------------------ | :------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------ |
  | **1. Acceptance & Recording** | *“Is the contribution lawful and relevant to the decision?”*                           | **ACCEPT & RECORD VERBATIM** if YES. <br>**REJECT** only if unlawful (e.g., hate speech), irrelevant, or abusive. Do *not* filter based on grounds. | **Officer** at point of receipt.      |
  | **2. Evidential Weight**      | *“Could a reasonable citizen accept this reason, regardless of their beliefs?”*        | **GIVE WEIGHT** if YES (e.g., noise, safety, cost). <br>**NO WEIGHT** if NO (e.g., relies on faith, divine authority, or non-shared ideology).      | **Officer** (advising decision-maker). |
  | **3. Inclusion in Final Reasons** | *“Is this reason part of the *Authority’s justification* for the decision?”*       | **INCLUDE** only if it passed Stage 2. <br>**EXCLUDE** all non-public reasons, even if influential.                                                 | **Decision-maker** (e.g., Committee). |

  **Key Distinctions & Your Wrinkles Addressed:**  
  - **Religious vs. Secular:** Judge by *the nature of the justification*, not the speaker’s motive. Ask: *“Does this reason require belief in a specific faith or ideology?”*  
  - **Ancestry Irrelevant:** A reason’s origin (e.g., ‘Thou shalt not kill’ → modern human rights) does not matter. Only its *current justification* is assessed.  
  - **No Mandatory Translation:** **Record verbatim. Never require restatement.** Allowing officers/councillors to ‘translate’ risks misrepresentation.  
  - **Symmetry Upheld:** Comprehensive secular doctrines (e.g., “Autonomy forbids religious formation”) are treated like religious ones at Stages 2 & 3.  
  - **No Bias for Convenience:** A religious/secular reason supporting a preferred outcome gets *no weight* if non-public.  

  **Translation Policy: Clear Rules**  
  - **For Recording:** Transcribe or summarise *verbatim* in original wording. Do not edit or secularise.  
  - **For Weight/Inclusion:** Use the *speaker’s original words*. Do *not* require them to reframe.  
  - **Why:** Requiring translation disadvantages minority viewpoints, misrepresents intent, and breaches equity.  

  ---

  **Application to Test Cases:**  

  1.  **Crematorium Deputation (Religious Objection)**  
      - *Stage 1:* **ACCEPT & RECORD.** Ground is lawful/relevant.  
      - *Stage 2:* **NO WEIGHT.** Resurrection relies on specific faith doctrine. Reasonable citizens need not accept it.  
      - *Stage 3:* **EXCLUDE.** Not publicly justifiable.  
      - **Outcome:** Recorded but not considered as a reason for the decision. Harsh but necessary: the speaker’s refusal to offer alternative grounds doesn’t compel weight.  

  2.  **Pavement Licensing (Joint Submission)**  
      - *Stage 1:* **ACCEPT & RECORD BOTH GROUNDS.**  
      - *Stage 2:* **Mosques’ Council:** NO WEIGHT (alcohol prohibition is faith-based). **Residents’ Association:** GIVE WEIGHT (noise/litter are public concerns).  
      - *Stage 3:* **INCLUDE ONLY** noise/litter in the Authority’s reasons.  
      - **Outcome:** Conclusion *can* be carried by residents’ secular reason alone. Officers note: weight applies to *reasons*, not conclusions.  

  3.  **Faith-Based Adoption Agency (Secular Humanist Objection)**  
      - *Stage 1:* **ACCEPT & RECORD.** Ground is lawful/relevant.  
      - *Stage 2:* **NO WEIGHT.** “Comprehensive claim about autonomy and religious formation” is a non-shared ideological doctrine. Symmetry applies.  
      - *Stage 3:* **EXCLUDE.** Not publicly justifiable.  
      - **Outcome:** Recorded but given no evidential weight. The refusal to narrow the reason doesn’t override Stage 2.  

  ---

  **What This Procedure Cannot Do:**  
  1.  **Resolve Value Conflicts:** It ensures *fair process*, not consensus. Deep disagreements persist.  
  2.  **Override Legal Duties:** Equality Act 2010 or human rights obligations may still require specific considerations.  
  3.  **Prevent Disappointment:** Contributions failing Stage 2/3 will frustrate speakers. Transparency is key.  
  4.  **Replace Delegated Judgement:** When reasons are borderline (e.g., “sanctity of life” in end-of-life care), the **named decision-maker** must rule.  
  5.  **Fix Engagement Gaps:** Barriers to participation (e.g., language, accessibility) require separate strategies.  

  ---  
  **Final Note for Officers:**  
  This tool ensures consistency, not philosophical perfection. When in doubt:  
  - **Record first** (Stage 1).  
  - **Ask the test:** *“Could anyone reasonably reject this *without* rejecting a faith/ideology?”* If YES, it’s non-public (Stage 2).  
  - **Delegate upwards** if a ruling feels untenable or high-risk. Your Monitoring Officer is your ally.  

  Adopt this verbatim, train staff on the 3 stages, and stress symmetry. It will withstand scrutiny.
