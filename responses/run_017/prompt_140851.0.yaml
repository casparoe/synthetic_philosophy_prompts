prompt: |-
  This started as an argument at work. I'm a backend engineer, no philosophy background beyond reading stuff on the side, and a few weeks back we had an incident where the service was overloaded and we had to shed load: kill one big nightly batch job that a single internal team was waiting on, or throttle a few thousand users' interactive requests by a barely-noticeable amount each. We throttled everyone, my mate thought that was obviously right, I wasn't convinced, and it turned into one of those 2am post-mortem conversations that nobody actually resolves. Since then I've ended up reading about Scanlon's contractualism and what people call the aggregation problem — the rough idea being that if rightness is about what nobody could reasonably reject, and complaints get weighed one person against another, then there's nowhere obvious for the sheer number of people on one side to do any work, which strikes me as both weirdly appealing and completely unusable for the decisions I actually have to make. The purpose I have in mind, if it helps pin things down: I want something I could put in a design doc as a rule for allocating a scarce resource, defend to colleagues who don't share my gut reactions, and apply again next quarter — not just a verdict on this one incident.

  So what I want isn't the verdict, and defintely not a reading list. I want the spec: the desiderata that a theory of aggregation has to meet to be worth using. What it has to get right, which cases it has to handle and what each case is actually doing the work of showing, which distinctions people collapse that it shouldn't, and which of the usual demands are real requirements as opposed to a prejudice of one camp. Here are the cases I want it built around, spelled out so you don't have to guess at the setup: (1) the one that always comes up first — save one person's hand, or stop a few thousand people each getting a mild electric shock; (2) the pure tie — two strangers, identical need, you can help exactly one, is tossing a coin acceptable and does it change anything if it's two on one side and one on the other; (3) the near-tie — one person loses something big, or N people each lose something a hair smaller, with N sliding from two up to a million, and the question is whether a theory owes us an answer about where numbers start winning or is entitled to stay silent there; (4) the case I made up and can't get out of my head, threshold or emergent harms, where nobody has a complaint at all until enough people are affected: the service is fine at 900 requests a second and falls over completely at 1000, and no individual request is the one that broke it, or a language or a protocol dies once enough people stop using it. A view that only ever puts person A's complaint next to person B's — where does it even register that kind of harm, and is registering it a requirement or a nice-to-have; (5) the same thing under uncertainty, where you don't know whose hand or whose shock it will be, so it's risks rather than outcomes being weighed.

  Two more things I care about more than the rest. First: which of these requirements can't all hold at once? My guess is there's no way to have pairwise comparability, some minimal Pareto-ish thought that a bigger number of people being better off can't just be irrelevant, and a clean transitive ranking of options all at the same time — something like a Condorcet cycle but for complaints — but I can't see where the trade-off has to be made, and if a different pair is the actually impossible one, say that instead. Second: which single requirement knocks out the most candidates, and which ones are smuggled in as requirements when they're really just preferences — my own suspects are never adding up welfare across people, and always producing a total ordering with no ties left over. A couple of lines at the end on how the two obvious approaches do — add up the total versus compare one at a time — is fine, but the spec is the part I'm after. And tell me plainly where a theory is allowed to shrug instead of being forced to answer.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're a backend engineer who faced a real-world dilemma during a service overload: whether to kill one big batch job affecting a single team or throttle thousands of users slightly. They ended up throttling everyone, but their colleague disagreed, leading to a philosophical debate. Now they're diving into Scanlon's contractualism and the aggregation problem, seeking a practical "spec" for decision-making in resource allocation.

  First, I need to identify their core request. They want desiderata for a theory of aggregation—criteria to evaluate such theories, not just answers to specific cases. They listed five scenarios to test theories, and emphasized two key aspects: conflicting requirements that can't coexist and which single requirement is most disqualifying.

  Looking at their scenarios: (1) hand vs. shocks tests how a theory handles severe individual harm vs. diffuse minor harms. (2) The pure tie examines equality and whether numbers matter in ties. (3) Near-tie probes if theories must pinpoint where numbers outweigh severity. (4) Threshold harms challenge pairwise comparisons when harm emerges collectively. (5) Uncertainty shifts outcomes to risks, testing probabilistic fairness.

  The user's deeper needs seem practical: they want a framework defendable in design docs, applicable quarterly, and palatable to colleagues. They dislike "gut reactions" and want structure. Their frustration with philosophical vagueness is clear—they need actionable specs, not abstract debates.

  For conflicting requirements, I recall Arrow's theorem: ordinal preferences can't always yield a social ordering without violating some fairness criteria. Here, the triad might be: Pairwise Comparability (PC), Minimal Pareto (MP), and Full Transitivity (FT). Sacrificing FT allows for thresholds or weighted complaints without demanding a total order. Sacrificing PC might permit non-comparable complaints, useful for threshold cases. 

  The strongest disqualifier? Non-Aggregation is tricky but manageable; violating Minimal Pareto would be fatal for real-world decisions where scale matters. Theories ignoring it would dismiss widespread minor harms, which feels counterintuitive in engineering contexts.

  Threshold harms are critical. Pairwise methods struggle here because no single actor causes harm. Theories must recognize emergent properties—perhaps through proxy complaints (e.g., "risk of system collapse") or collective rights. Not a nice-to-have; ignoring it overlooks systemic risks common in tech.

  On shrugging: A good theory should abstain in true ties (coin-flip acceptable) but must engage in near-ties by providing a decision procedure, even if it admits uncertainty. For threshold cases, it must acknowledge the emergent harm, not punt.

  Finally, the two approaches: Additive aggregation fails their Non-Aggregation requirement but handles MP and thresholds cleanly. Pairwise comparison honors individual complaints but stumbles on thresholds and may violate MP. A hybrid might be needed—weighted complaints with sensitivity to emergent effects.

  User’s unspoken need: bridging philosophy and engineering. They want rigor without dogma, flexibility without arbitrariness. The spec should empower clear, defensible choices in resource-scarce environments.
answer: |-
  Based on your engineering mindset and practical need for a "spec," here's a breakdown of the core desiderata for a usable theory of aggregation in resource allocation, built around your cases and constraints:

  ### Core Desiderata (The Must-Haves)
  1.  **Non-Aggregation Requirement:** The theory **must not** simply add up "welfare," "utility," or "goodness" across individuals as its primary mechanism. (This knocks out classic utilitarianism).
  2.  **Individual Complaints:** The theory **must** centrally feature the perspective, burden, or potential complaint of *each individual affected*.
  3.  **Comparability Requirement:** The theory **must** provide a principled way to compare the *strength* or *reasonableness* of complaints *across different individuals* facing different types/levels of burden. (This is where most theories live or die).
  4.  **Minimal Pareto (Scale Sensitivity):** The theory **must** be able to justify favoring an option where *many individuals* receive a *significant benefit* or avoid a *significant burden* over an option benefiting/avoiding burden for *very few*, *even if the few suffer a larger individual loss*. (It cannot treat numbers as *always* irrelevant). Your "hand vs. shocks" case tests this.
  5.  **Threshold Harm Recognition:** The theory **must** recognize and account for harms or system failures that emerge *only* when a sufficient number of individuals are affected in a way that *no single individual's action causes*, but where *each individual's inclusion contributes to the critical mass*. (Your service overload & protocol death cases). This requires moving beyond *only* pairwise comparisons.
  6.  **Decision Under Uncertainty:** The theory **must** provide guidance for allocating scarce resources or imposing risks *when outcomes are probabilistic* and it's unknown *who* will bear the burden. (Your risk weighing case).

  ### Key Tolerances (Where Shrugging is Allowed/Required)
  7.  **Resolving Near-Ties:** The theory is **NOT required** to provide a magic number `N` where avoiding a small harm to `N` people *always* outweighs preventing a large harm to one. It **is required** to provide a *decision procedure* for reasoning about such cases (e.g., "Is the large harm *so severe* and the small harm *so trivial* that even a vast `N` doesn't outweigh it? How do we judge severity/triviality?"). It can acknowledge reasonable disagreement in the "gray zone."
  8.  **Handling Pure Ties:** The theory **must allow** (and often *require*) a fair procedural solution (like a coin toss) when options are *truly indistinguishable* in terms of individual burdens/complaints (e.g., saving identical stranger A vs. identical stranger B). For 2 vs. 1 identical strangers, it should explain *why* a coin toss between the two groups (giving each group a 50% chance of being helped) is acceptable, or why helping the larger group is required.

  ### The Impossible Triad (The Fundamental Trade-Off)
  You correctly identified the core tension. A theory satisfying all three of these simultaneously is likely impossible:

  *   **PC (Pairwise Comparability):** Any two individual complaints (A vs. B) can always be compared in strength, yielding a strict ordering or equality.
  *   **MP (Minimal Pareto):** If Option X involves a smaller burden for Person A and an identical burden for everyone else compared to Option Y, then X must be chosen. If shifting from Y to X makes many people significantly better off and *no one* worse off (or makes them better off by more than it makes others worse off, in a comparable way), X must be chosen.
  *   **FT (Full Transitivity):** The theory produces a complete, transitive ranking of all possible options (no cycles, no incomparable options).

  *   **Where the Trade-Off Hits:** The "Near-Tie" (Case 3) is the killer. PC and MP struggle as `N` increases for the small harm side. PC insists each small harm complaint is trivial compared to the big harm. MP insists that at *some* large `N`, the collective avoidance of small harms must outweigh the big harm. Reconciling this while maintaining a smooth, transitive ranking (FT) across all values of `N` is the challenge. **Sacrificing FT is often the most practical path**, allowing thresholds or step-functions where numbers suddenly "win". Sacrificing strict PC allows for incomparable burdens. Sacrificing MP makes the theory unusable for real-world scale problems.

  ### The Strongest Disqualifiers & Smuggled Preferences
  *   **Strongest Disqualifier:** Violating **Minimal Pareto (4)**. A theory that *cannot* justify saving thousands from a shock over saving one hand (Case 1) is practically useless for engineering/system design where scale is inherent. Violating **Threshold Harm Recognition (5)** is a close second for system reliability.
  *   **Smuggled Preferences (Often Presented as Requirements):**
      *   **Requiring a Total Ordering (No Ties):** This is often a preference for algorithmic tidiness, not a core moral requirement. A theory *can* allow genuine ties resolved procedurally (Case 2).
      *   **Strict Non-Comparability:** Insisting burdens are *fundamentally incomparable* across individuals makes practical decision-making impossible. The theory needs *some* comparability mechanism (Desideratum 3), even if imperfect or contextual.
      *   **Absolute Priority to the Worst-Off:** Treating the single largest burden as *always* trumping any number of smaller burdens (extreme prioritarianism) smuggles in a strong value judgment and violates Minimal Pareto. It might be reasonable *sometimes*, but shouldn't be a *requirement* for the theory.
      *   **"No Trade-Offs with Rights":** Framing certain burdens (like throttling) as absolute "rights violations" that can never be traded off against other burdens is often a disguised way to avoid aggregation but usually collapses under scale (Case 1) or thresholds (Case 4).

  ### How the Obvious Approaches Fare Against the Spec
  *   **Additive Aggregation (Total Welfare/Utility):**
      *   **Pros:** Easily satisfies Minimal Pareto (4), Threshold Recognition (5 - if modeled as system cost), Decision Under Uncertainty (6). Provides clear answers for Near-Ties (3).
      *   **Cons:** *Violates the core Non-Aggregation Requirement (1)*. Struggles with Individual Complaints (2) - the "one big complaint" can be drowned out. Comparability (3) is reduced to a single metric, which feels inadequate for different *types* of harm (hand vs. annoyance). Pure Ties (2) become vanishingly rare.
  *   **Pairwise Comparison (Scanlon-style Contractualism):**
      *   **Pros:** Strong on Individual Complaints (2), Non-Aggregation (1). Handles Pure Ties (2) well (procedural fairness). Provides a framework for Comparability (3) via "reasonable rejectability".
      *   **Cons:** **Major Struggles:** Can violate Minimal Pareto (4) - Why can't each shocked person reasonably reject the hand-saving plan? They suffer *some* harm! Struggles profoundly with Threshold Harms (5) - No individual request *caused* the outage, so no single individual has a stronger complaint. Near-Ties (3) become deeply problematic - finding the `N` where pairwise rejection fails is unclear. Decision Under Uncertainty (6) is complex - weighing probabilistic complaints.

  ### The Verdict on Shrugging
  *   **Allowed:** When options are *genuinely equivalent* in terms of individual burdens/complaints (Pure Ties - Case 2). When reasoning transparently about a Near-Tie (Case 3) leads to a zone of reasonable disagreement (e.g., "Is 1000 minor delays worse than one 1-hour outage? We judge yes. Is 10 minor delays worse? We judge no. Is 100? Reasonable arguments exist, policy sets threshold at X.").
  *   **Not Allowed:** On recognizing Threshold Harms (Case 4) or the necessity of Decision Under Uncertainty (Case 5). On providing *some* justification for Minimal Pareto (Case 1) - the theory must explain *why* saving the many from shocks is permissible despite individual complaints. On having *some* method for cross-person complaint comparison (Desideratum 3).

  ### The Practical Takeaway for Your Design Doc
  A viable spec needs a **hybrid approach** leaning towards Scanlon but incorporating **weighted complaints** sensitive to **scale** and **systemic effects**. Define:

  1.  **Burden Severity Levels:** Categorize burdens (e.g., "Critical Service Failure", "Major Delay (>1hr)", "Minor Delay (<5min)", "Negligible"). Assign *comparative weights* (e.g., Preventing 1000 "Minor Delays" > Preventing 1 "Major Delay").
  2.  **Threshold Recognition:** Explicitly define system capacity limits. Frame exceeding them as imposing a "System Failure Burden" on *all* users. An individual request's burden isn't just its own processing cost, but its *contribution to the risk of System Failure* when near capacity. This creates a comparable complaint ("risk of causing systemic collapse").
  3.  **Uncertainty:** Frame decisions probabilistically. "Choosing policy X imposes a 0.1% risk of burden Y on any user vs. a 10% risk of burden Z on Team A."
  4.  **Tie-Breaking:** Specify fair procedures (random selection, round-robin) for truly identical burdens.
  5.  **Transparency on Trade-offs:** Acknowledge the Near-Tie problem. State: "We prioritize avoiding `S` severe burdens over `N * M` minor burdens where `N > Threshold_T` and `M < Severity_Ratio * S`. Thresholds and ratios are set based on [Service Level Objectives, User Impact Studies, Business Priority] and reviewed quarterly."

  This provides a defensible, applicable rule that respects individual impact while acknowledging scale and system realities, without requiring impossible philosophical precision at every boundary. It accepts that some lines (like `N` in Case 3) are policy choices informed by the framework, not dictated with mathematical certainty.
