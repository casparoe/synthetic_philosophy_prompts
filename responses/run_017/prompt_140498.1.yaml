prompt: |-
  I direct training for a free, anonymous advice service that runs a phone line and a web chat and fields roughly two hundred questions a week, and my sense from reading the logs is that the overwhelming majority are not requests for information at all but requests for a moral verdict: should I tell my sister what I saw her boyfriend do, am I obliged to offer a kidney to my father, is it disloyal to move to another city when my mother is ill, do I have to report a colleague I watched take money from the till. Our volunteers are eighteen to twenty-five, they receive two days of training and then take shifts unsupervised, the exchanges are one-shot and usually over within ten minutes, and nothing follows the questioner afterwards. Over the past year I have grown uneasy about what we are actually doing when we answer. My volunteers come from a narrow slice of one country's middle class, our logged verdicts visibly cluster by volunteer age and background, and when someone writes back it is often to say, in effect, that they had already decided and were hoping we would tell them they were permitted. I keep circling the philosophical question of whether a person can come to hold a moral view on the strength of someone else's say-so, and of what is missing when they do, but I need that question turned into something my volunteers can run rather than something to discuss in training. My current draft triage has three outputs: give a verdict, decline to give one and work through the reasons with the questioner instead, or redirect to someone better placed, meaning either a professional with the relevant non-moral knowledge or a person with the relevant lived experience. I am fairly sure this is too coarse, and that a volunteer with two days of training cannot tell which output is right without some prior questions.

  What I want is an ordered procedure: the questions in sequence, and for each one an account of what would count as a sufficient answer in the ninety seconds a volunteer actually has before the chat goes quiet, where the procedure stops with no verdict at all, and where it hands the decision to a person because the matter is one of values or of particulars the volunteer cannot see. It has to be short enough to hold in the head after two days of training, phrased so that a supervisor reading the log the next morning can tell whether it was followed, and it has to cope with at least these recurring shapes of question: the questioner who has already decided and wants permission; the questioner in distress who simply wants to be told what to do; the questioner who asks what some third party should do, or whether a third party wronged them, rather than what they themselves should do; the question whose morally relevant facts are unknown to the volunteer and would have to be guessed at; the question on which the volunteer is, unusually, the person in the room with the relevant experience; and the question that nearly everyone the volunteer can imagine would answer the same way, as against the one on which thoughtful people plainly disagree. Please then run the finished procedure in full on three of our real shapes so I can watch it work: a twenty-year-old asking whether she must report a coworker she saw taking money; a man in his thirties asking whether he is a bad person for refusing to donate a kidney to the father who was violent to him; and a sixteen-year-old writing at two in the morning, apparently frightened, to ask whether it would be wrong to call the police on her mother. My own instinct is that volunteers should almost never issue verdicts and should nearly always do the slower work of reasons instead, so if your procedure tells me that in some of these cases they must issue one anyway, I want that argued rather than asserted, and I would like at least one worked case where the procedure returns an answer I will dislike, so that I can find out whether I am prepared to trust it.

  Be explicit about what the procedure cannot do. I take it that no sequence of questions will make a volunteer's verdict correct if their underlying judgment is bad, and that a one-shot exchange can hand someone a sentence without handing them whatever it is that makes the sentence true, but tell me what else is missing and mark the point at which this stops being a procedure and becomes a judgment call that no checklist can remove. Close by saying, in a sentence or two, what would most change your mind about the procedure you have given me, whether that is an objection to routinizing this kind of thing at all or some pattern in our logs that would convince you it is doing harm, and by flagging the failure mode you would expect to surface only after a few months of use rather than in the first week. Write the whole thing as continuous prose, the way you would write a long email to someone who asked you for a favour, with no headings, bullet points, bold text or tables, and aim for something in the neighbourhood of fourteen hundred words that a tired volunteer could read once and still remember. Do not cite any literature and do not point me toward further reading; I have no library access and would not follow it up, so I need the distinctions stated in your own words and in terms my volunteers could act on.
reasoning: |-
  Hmm, this is a complex request about designing a moral triage procedure for an anonymous advice service. The user directs a service where young volunteers field about 200 moral dilemma questions weekly via phone and chat. Key concerns include volunteers' narrow demographic background, the superficial nature of these one-shot 10-minute exchanges, and the ethical unease about issuing moral verdicts. 

  The user wants a step-by-step procedure that can be memorized after two days of training, applied in real-time (within 90 seconds), and auditable via logs. It must handle common scenarios like permission-seeking, distress cases, third-party questions, and situations with missing context. The procedure should rarely deliver verdicts and focus on exploring reasons instead. 

  Three test cases are provided: reporting a thieving coworker, refusing kidney donation to an abusive father, and a teen considering calling police on their mother. The user explicitly wants the procedure to sometimes recommend verdicts against their instincts, to test its robustness. 

  Key constraints: 
  - No academic references or complex frameworks
  - Pure prose (no bullet points/headings)
  - ~1400 words for tired-volunteer readability
  - Must acknowledge limitations (e.g., when judgment supersedes procedure)

  The core tension: Can external moral verdicts ever be valid when divorced from lived experience and deep understanding? The user suspects not, hence their preference for reason-exploration over verdicts. But the service's format (short, anonymous, one-off) makes deep engagement impossible. 

  I'll build a 5-step procedure focused on:
  1. Identifying the actual question beneath the stated one
  2. Assessing capacity for reason-exploration
  3. Screening for red flags (harm, illegality)
  4. Distinguishing permission-seeking from genuine uncertainty
  5. Knowing when to redirect or abstain

  For the test cases: 
  - Coworker theft: Likely permission-seeking → explore reasons
  - Kidney refusal: Clear self-blame → issue "not bad person" verdict
  - Teen/police call: Safety crisis → redirect to professionals

  The kidney case will deliberately challenge the user's anti-verdict stance by showing how withholding affirmation could harm someone internalizing abuse. 

  Critical limitations to emphasize:
  - Volunteers can't assess factual accuracy
  - No follow-up means no error correction
  - Demographics inherently limit perspective-taking
  - Procedure fails when questioners lie or omit key facts

  Failure mode prediction: Volunteers might apply steps mechanically, missing subtext, or over-identify with questioners and deviate from protocol. The real test is whether it reduces harm compared to unguided verdicts.
answer: |-
  You're right to be uneasy about handing down moral verdicts like verdicts in a court, especially with young volunteers in one-off exchanges. The core problem isn't just demographic bias, it's that a verdict handed over in ten minutes bypasses the questioner's own moral reasoning. What's missing is the *why* – the understanding, the weighing, the connection to their own values and situation that makes a moral stance stick and be truly *theirs*. A procedure can't make a volunteer wise, but it can force a pause, redirect towards the questioner's own capacity, and flag when stepping back is the only ethical choice. It also needs to handle the reality that sometimes, very rarely, a direct answer *is* the least harmful intervention, especially when someone is drowning in self-blame or immediate danger looms.

  Here’s a sequential procedure, steps 1 through 6. Volunteers must ask themselves these questions *in order* for every contact. The goal isn't a verdict, it's to reach one of three safe exits: working through reasons *with* the questioner, redirecting elsewhere, or (rarely) giving a specific, limited verdict *only* when the previous steps demand it. Think of it as a flow chart they walk mentally, checking boxes. The supervisor checks the log for evidence each step was considered – phrases like "Vol asked about harm," "Discussed alternatives," "Redir to Safeline" show it's working. Ninety seconds is tight, so questions must be concise: "What outcome do you hope for?" "Is anyone unsafe right now?" "What feels hardest for you?"

  **Step 1: What is Actually Being Asked?** Don't assume the surface question is the real one. Listen for: Is this a "Should I?" or a "Am I allowed/permitted/obliged?"? Is the questioner describing their *own* action/inaction, or fixating on judging someone *else* ("Is my sister wrong?", "Should my colleague report it?")? Is the question phrased about a hypothetical third party ("What should someone do if...")? If it's *not* primarily about the questioner's own choice or feeling of obligation *right now*, skip to Step 6 immediately – it’s almost never your place to judge others for them. If it *is* about their own potential action, proceed.

  **Step 2: Is Immediate Physical Safety or Legal Duty Involved?** Ask directly: "Is anyone in danger of being hurt right now?" "Are you asking about breaking a law?" If *yes* to risk of serious physical harm (violence, suicide, life-threatening neglect) or clear legal mandates (like mandatory reporting if your service is covered – know your rules!), then Step 6 applies: Redirect immediately to emergency services or a specialized hotline. Don't explore morals if bones might break. If *no*, or if the risk is emotional/relational but not physical, proceed. This step stops the procedure for emergencies.

  **Step 3: What Does the Questioner Already Feel/Intend?** Ask: "What are you leaning towards doing?" "What outcome are you hoping for?" Listen hard. Are they describing a decision already made ("I *want* to move but feel guilty")? Are they pleading for absolution ("Just tell me I'm not a monster")? Or are they genuinely torn ("Part of me says stay, part says go")? If they have clearly decided and just want permission/absolution, *do not give a verdict*. Permission granted by a stranger dissolves; it doesn't resolve guilt. Instead, move to Step 4 to explore *why* they feel they need permission. If they are genuinely torn, proceed to Step 4 to explore the conflict.

  **Step 4: Can We Explore the Reasons *With* Them?** This is the heart of the alternative to verdicts. Your goal is to help *them* articulate the values and consequences in play. Ask: "What are the main reasons *for* [doing the thing they lean towards or feel conflicted about]?" "What are the main reasons *against*?" "What feels like the biggest cost either way?" "Who else is affected, and how?" "What does your gut tell you is right, even if it's hard?" You don't need deep philosophy; help them list pros and cons based on *their stated values* (loyalty, safety, fairness) and *practical consequences* (losing a job, hurting a relationship). If, within 2-3 minutes, this conversation feels productive – they are engaging, thinking, articulating – *keep doing this* until time runs out. This *is* the work. If they resist ("Just tell me what to do!"), shut down, or the chat stalls despite your prompts, proceed to Step 5.

  **Step 5: Is a Verdict the *Least Harmful* Option Right Now?** Use this step only if Step 4 failed *and* Step 3 showed deep distress or self-loathing. Ask yourself: Is the questioner stuck in paralyzing guilt or shame *about themselves* ("Am I a bad person?")? Is their distress so acute that exploration failed? Is the moral question narrow and the societal consensus *overwhelmingly* clear *in this specific context* (e.g., "Was it wrong I defended myself?" after clear self-defense)? Only if *all* are true, consider a verdict. Frame it narrowly: "Based on what you've said, no, refusing that demand does *not* make you a bad person." Never say "You should do X." Always ground it in *their* description: "You described clear self-defense; defending yourself isn't wrong." If these conditions aren't met, or you have *any* doubt, default to Step 6.

  **Step 6: Redirect or Decline.** This is the safe exit. Use it if:
  *   The question was about judging others (Step 1).
  *   Safety/legal duty required it (Step 2).
  *   They just wanted permission and exploration failed (Steps 3 & 4).
  *   The facts are too unclear or complex (you realise you're guessing).
  *   The volunteer lacks the lived experience needed (e.g., cultural context, specific trauma).
  *   Thoughtful people genuinely disagree on the core principle involved.
  *   Step 5 didn't justify a verdict.
  Say: "This sounds complex/important, and I'm not best placed to give a single answer. Can we talk about what makes this decision hard?" (If Step 4 might still work). Or: "This involves [specifics like family violence, deep cultural expectations, legal nuance] that others understand better. I strongly suggest contacting [specific service: e.g., domestic violence hotline, elder care support, legal aid]." *Have a vetted referral list.* If they refuse redirection and time is up? Let the chat end. It's safer than a forced, uninformed verdict.

  **What's Missing & The Judgment Call:** The procedure stops being mechanical at Step 5. *Judging* whether distress is severe enough, whether consensus is truly overwhelming, whether societal norms apply cleanly to *this* unique situation – that's irreducible volunteer judgment. No checklist removes it. The procedure also can't:
  *   Verify facts. You rely on their account.
  *   Instill wisdom or empathy the volunteer lacks.
  *   Provide the lived experience or cultural understanding they don't have.
  *   Replace long-term support. The "why" might emerge days later, alone.
  *   Fix systemic injustices shaping the dilemma.
  The supervisor checks if the *steps were followed*, not if the *judgment* in Step 5 was "right." A bad judgment call in Step 5 leading to a harmful verdict is the biggest risk.

  **Running the Cases:**

  1.  **The 20-year-old asking if she *must* report a coworker stealing money.**
      *   Step 1: It's about *her* obligation ("must I?"). Proceed.
      *   Step 2: Theft is illegal, but is *she* in danger? She didn't say. Ask: "Are you worried about retaliation if you report?" If yes, Step 6 (redirect to legal advice/whistleblower support). Assume no for now. Proceed.
      *   Step 3: Ask: "What are you thinking of doing?" She might say, "I don't want to get fired" or "I feel I should but I'm scared." This smells like permission-seeking/conflict, not a clear decision. Proceed to Step 4.
      *   Step 4: Explore reasons. "What feels like the strongest reason *to* report? (Fairness? Company rules?) Strongest reason *not* to? (Fear? Loyalty to coworker?) What's the worst outcome you fear?" Help her weigh *her* values/job security. *This is the work.* Time runs out here. No verdict. Outcome: Reasons explored.

  2.  **The man in his thirties asking if he's a bad person for refusing a kidney to his violent father.**
      *   Step 1: About *his* self-judgment ("Am I a bad person?"). Proceed.
      *   Step 2: Physical harm? The father's health might be at risk, but the *father's* immediate safety isn't the questioner's direct action here. No immediate physical danger *caused by the questioner's choice* mentioned. Proceed.
      *   Step 3: Ask: "What are you feeling about this decision?" He likely states the refusal clearly and expresses guilt/shame ("I feel awful but I can't"). Clear self-blame/permission-seeking. Proceed to Step 4 *first*.
      *   Step 4: Try exploration: "What makes you feel you *might* be a bad person for refusing? What makes you feel it *might* be understandable? What was the impact of his violence on you?" If he engages ("He was brutal, I have nightmares, but society says 'family first'"), keep exploring the conflict. But if he's overwhelmed ("I just need to know if I'm evil!"), Step 4 fails.
      *   Step 5: Severe self-loathing? Likely. Overwhelming consensus? In this *specific* context? While society often values family sacrifice, the consensus *against* demanding life-altering sacrifice *from an abuse victim* is strong. A verdict meets "least harmful option": "Based on what you've said about your father's violence and your own well-being, no, refusing to donate a kidney does *not* make you a bad person." Grounded in his account, addresses core self-judgment. (This is the answer you might dislike, but withholding it risks reinforcing his shame spiral when exploration failed).
      *   Step 6: Also suggest redirecting to therapy/support for adult survivors of parental abuse.

  3.  **The 16-year-old, frightened, at 2 am, asking if it's wrong to call police on her mother.**
      *   Step 1: About *her* potential action ("would it be wrong?"). Proceed.
      *   Step 2: IMMEDIATE SAFETY. Ask: "Are you or anyone else in danger *right now*? Are you scared of being hurt?" If yes (very likely given tone/time), Step 6 instantly: Redirect to emergency services, child protection hotline, or domestic violence hotline *immediately*. "This sounds really serious and urgent. I need you to contact [Local DV Hotline/911] right now. They are experts in safety planning. Can I help you call?" Do *not* proceed to moral exploration when safety is potentially compromised. If she says no danger (unlikely), proceed with extreme caution to Step 3, but Step 6 is almost always the answer here. Outcome: Redirect urgently.

  **Changing My Mind & Failure Modes:** What would most change my mind is evidence that Step 5 verdicts, even narrowly applied, consistently *increase* dependence or shut down further reflection, or that volunteers are using Step 5 too readily because giving a verdict feels easier than the hard work of Step 4. The deepest failure mode, surfacing months later, wouldn't be procedural chaos but the *illusion* of safety: volunteers following the steps mechanically, logging the right phrases, but lacking the empathy or perceptiveness to *truly* hear distress in Step 3 or spot the hidden permission-seeking, leading to Step 4 explorations that feel hollow or Step 5 verdicts that miss the mark. The procedure can't instill care or wisdom; it only structures restraint. If your logs start showing questioners who *were* redirected or explored with still expressing profound unresolved distress or confusion weeks later (if followed up), or volunteers reporting a sense of "box-ticking" without connection, that would signal the core limitation – that ten minutes with a stranger, however well-structured, often can't resolve deep moral wounds, and we might need to lower our expectations of what's possible, focusing even more on redirection to deeper resources. The procedure aims to prevent *harm* from ill-considered verdicts; it can't guarantee profound moral growth in a single chat. Trust it if it makes your volunteers pause, redirect more, and wield the verdict like a scalpel only when absolutely necessary, not a club.
