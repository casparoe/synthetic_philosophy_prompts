answer: |-
  Below is a decision procedure tailored to your requirements: simple, spreadsheet-friendly, usable by non-experts in 10 minutes per proposal, with three-point estimates. It flags "Pasadena-like" projects (where expectation is sensitive to tail assumptions) and falls back to conservative metrics when needed. British English is used throughout.

  ---

  ### **Decision Procedure Summary**
  1. **Inputs for each project** (collected via a standard form):
     - *Grant amount requested* (`C`).
     - *Probability of success*: Three-point estimates (low, medium, high) for the chance of any positive outcome.
     - *Impact given success*: Three-point estimates (low, medium, high) for the monetary value of the outcome (net benefit to the community).
     - *Conditional probabilities*: For the impact scenarios (low, medium, high), the likelihood of each given success (must sum to 1).

  2. **Key calculations** (automated in a spreadsheet):
     - **Average probability of success** (`p`):  
       `p = (p_low + 4 × p_med + p_high) / 6`.
     - **Full expected gross benefit** (`E_gross`):  
       `E_gross = p × (q_low × I_low + q_med × I_med + q_high × I_high)`.
     - **Tail contribution**:  
       `tail_contrib = p × q_high × I_high` (where `I_high` is the highest impact).
     - **Flag test**: If `tail_contrib > 0.5 × E_gross` **or** any impact is unquantifiable, flag the project.
     - **Net benefit metric**:
       - If **not flagged**: `Value = E_gross - C`.
       - If **flagged**: Use **conservative gross benefit** (`CE_gross = p × median_impact`), then `Value = CE_gross - C`.  
         *Median impact*: Order impacts (low < med < high); median is the first where cumulative probability ≥ 0.5.

  3. **Output**:
     - Rank all projects by `Value` (highest first).
     - Flagged projects are noted: *"High sensitivity to tail assumptions – used conservative benefit estimate"*.
     - Negative `Value` projects are ranked below zero but may still be funded if values are positive overall.

  4. **Defence to finance office** (for flagged projects):  
     *"This project’s expected value is dominated by speculative high-end outcomes. Our procedure switches to a conservative benefit estimate (median impact) to avoid overreliance on unquantifiable tails. This ensures robustness against modelling uncertainty."*

  ---

  ### **Why This Works**
  - **Rearrangement-invariance test**:  
    The flag (`tail_contrib > 0.5 × E_gross`) detects when >50% of the expected value comes from a single high-impact/low-probability outcome. This proxies sensitivity to truncation (removing the tail changes results drastically) and reordering (the tail dominates). **It’s one unified test** – no need for separate checks.
  - **Handles unquantifiable tails**: If `I_high` is unknown (e.g., "nobody can put a number on it"), the project is auto-flagged.
  - **Judgement calls**: 
    - Conditional probabilities (`q_low, q_med, q_high`) require committee input but are simpler than full distributions.
    - The 50% threshold is arbitrary but conservative; adjust to 40-60% if needed.
  - **Fallback metric**: Median impact is used when flagged – it ignores tail shape and is robust to extreme values.

  ---

  ### **Application to Your Examples**
  *Assumptions*:  
  - All impacts are *net benefits* (e.g., societal value minus costs).  
  - Grant costs (`C`) are subtracted from gross benefits to get `Value`.

  #### **1. Longevity Screen (Bio Project)**
  - **Inputs**:  
    `C = £1,500` (assumed).  
    `p_low = 0.5%`, `p_med = 1%`, `p_high = 2%` → `p = (0.005 + 4×0.01 + 0.02)/6 = 0.0108`.  
    `I_low = £10k`, `I_med = £100k`, `I_high = ?` (unquantifiable).  
    `q_low = 50%`, `q_med = 49%`, `q_high = 1%` (given success).
  - **Calculations**:  
    `I_high` unquantifiable → **Flagged**.  
    Median impact: Low (£10k, cum. prob. 50% ≥ 0.5) → `median_impact = £10,000`.  
    `CE_gross = 0.0108 × £10,000 = £108`.  
    `Value = £108 - £1,500 = **-£1,392**`.
  - **Outcome**: Low rank (negative value).

  #### **2. Open-Source Protocol**
  - **Inputs**:  
    `C = £1,000` (assumed).  
    `p_low = 50%`, `p_med = 70%`, `p_high = 90%` → `p = (0.5 + 4×0.7 + 0.9)/6 = 0.7`.  
    `I_low = £1k`, `I_med = £10k`, `I_high = £100k` (soft ceiling).  
    `q_low = 20%`, `q_med = 70%`, `q_high = 10%`.
  - **Calculations**:  
    `E_gross = 0.7 × (0.2×1k + 0.7×10k + 0.1×100k) = 0.7 × £11,200 = £7,840`.  
    `tail_contrib = 0.7 × 0.1 × £100k = £7,000` (>50% of £7,840) → **Flagged**.  
    Median impact: Medium (£10k, cum. prob. 20%+70%=90% ≥ 0.5) → `median_impact = £10,000`.  
    `CE_gross = 0.7 × £10,000 = £7,000`.  
    `Value = £7,000 - £1,000 = **£6,000**`.
  - **Outcome**: Top rank (high positive value).

  #### **3. Bike Workshop**
  - **Inputs**:  
    `C = £300` (assumed).  
    `p_low = 95%`, `p_med = 99%`, `p_high = 99.9%` → `p = (0.95 + 4×0.99 + 0.999)/6 = 0.9848`.  
    `I_low = £80`, `I_med = £150`, `I_high = £250`.  
    `q_low = 20%`, `q_med = 60%`, `q_high = 20%`.
  - **Calculations**:  
    `E_gross = 0.9848 × (0.2×80 + 0.6×150 + 0.2×250) = 0.9848 × £150 = £147.72`.  
    `tail_contrib = 0.9848 × 0.2 × £250 = £49.24` (33% of £147.72) → **Not flagged**.  
    `Value = £147.72 - £300 = **-£152.28**`.
  - **Outcome**: Middle rank (negative but less severe than bio project).

  ---

  ### **Final Ranking & Decision**
  | Project          | Value    | Flagged? | Rank |
  |------------------|----------|----------|------|
  | Open-Source      | £6,000   | Yes      | 1    |
  | Bike Workshop    | -£152.28 | No       | 2    |
  | Longevity Screen | -£1,392  | Yes      | 3    |

  - **Fund open-source**: High conservative value (£6,000) despite flag.
  - **Reject others**: Both have negative values.  
  - **Defence to finance**: For open-source: *"Flagged due to heavy tail, but conservative estimate still shows strong net benefit (£6k)."*

  ---

  ### **Practical Notes**
  1. **Spreadsheet Setup**:  
     - Use columns for inputs (`C`, `p_low`, `p_med`, `p_high`, `I_low`, `I_med`, `I_high`, `q_low`, `q_med`, `q_high`).  
     - Formulas auto-compute `p`, `E_gross`, `tail_contrib`, flag, `median_impact`, `CE_gross`, and `Value`.
  2. **Time Saver**: Pre-populate a template; committee spends <10 mins per project entering estimates.
  3. **When Values Tie**: Rank by grant size (smaller £ first) or punt to committee.
  4. **Edge Cases**:  
     - If `p = 0` (no chance of success), `Value = -C`.  
     - If all impacts are unquantifiable, auto-flag and use `I_med` for median (avoids infinite loops).
  5. **Limitations**:  
     - Mediocre for correlated projects (but rare at this scale).  
     - Threshold (50%) is heuristic; calibrate with past decisions if needed.

  This procedure kills the knot in your head: it robustly handles tails, defaults to conservative metrics when theory breaks, and is defendable in a paragraph. No fudging required – the bio project ranks last, as it should.
