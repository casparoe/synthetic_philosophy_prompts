prompt: |-
  I came away from a long argument with a friend last night convinced that we were not really disagreeing about the case in front of us; we were disagreeing about what a theory of supererogation is for. The case was a ward nurse who, on a chronically understaffed rota, stays two hours unpaid after every shift to finish medication rounds that no one else will cover. My friend called it a textbook supererogatory act: beyond duty, costly, praiseworthy, and such that omitting it is not wrong. I said that if the hospital's budget quietly depends on her doing it, then calling the act supererogatory is not praise but a subsidy, and that a theory which cannot tell the difference between honouring someone and relying on them is not fit for use.

  So I want the specification before we argue about any further case. Write the desiderata an adequate theory of supererogation has to meet: the phenomena it must explain, the verdicts it must return, the distinctions it must not collapse, and the commitments elsewhere in ethics it may not contradict, each with the case or consideration that makes it a requirement rather than a preference. I want a theory good enough for three downstream jobs: to allocate ordinary praise and blame, to tell institutions what they may ask of, or silently arrange themselves around, the occupants of roles, and to tell political argument whether this is a category we should be trying to preserve or to shrink.

  Cases I want the list to earn its keep on, at minimum:

  - Role relativity. The same rescue performed by a passing swimmer and by the on-duty lifeguard. If supererogation is indexed to the agent's role, commitments or office, say what fixes the index and whether a role can acquire new duties simply by being relied upon.
  - The uncostly hero. The field doctor who works through an epidemic because she finds the work exhilarating and gives up nothing she values. Is sacrifice constitutive of the supererogatory, or merely evidence that the act exceeds what could be demanded of anyone?
  - The mistaken-duty hero. The soldier who throws himself on the device in the false belief that he has been ordered to. If in his own eyes he was not free to omit it, has he done anything supererogatory at all?
  - Supererogation by forbearance. The retired woman who releases a large, legally valid debt owed to her by a family that could pay. Praiseworthy to do, not required to do, and yet omission-shaped.
  - The linked-hands rescue. Twenty people must enter the water together or the child drowns, and no individual makes a difference. Whatever each may permissibly do, may they all?
  - The ratchet. The colleague who covers others' shifts every week for a year, after which her refusal is met with resentment. Are verdicts indexed to the moment of action, and does repetition convert the optional into the expected?
  - The advisor. If I may permissibly omit the rescue, may I advise you to omit it, may I design an institution around your omitting it, and may I be indifferent to whether you do it?
  - Honesty in a corrupt office. The inspector who refuses the bribe that every colleague accepts. Rare and very costly, but surely not beyond duty.
  - The failed rescue. The man who jumps, cannot swim, and drowns alongside the child. Success is not required; but at what point does risk turn praiseworthy daring into something a theory should not be in the business of celebrating?

  Distinctions I want either respected or explicitly collapsed, with the cost of collapsing: beyond duty versus merely permissible, as in choosing vanilla over chocolate; supererogatory versus costly-but-required; supererogatory versus saintly or self-transcending; and supererogatory versus its mirror, acts that are blameworthy to do though not wrong to do, if you grant that there are any.

  Three things matter most to me in the answer. First, which of the demands people standardly impose are genuine adequacy conditions and which are the prejudices of one camp: I suspect both the demand that the theory be action-guiding from the agent's own deliberative point of view and the demand that supererogation never be a licence to do less than the best are camp-specific, but I want the argument rather than my suspicion back. Second, whether some subset of the desiderata is jointly unsatisfiable: my guess is that unrestricted aggregation will not sit with the asymmetry between praise and blame, and that time-indexed verdicts will not sit with treating supererogation as a property of act-types. If the list is itself a result, say so. Third, which single requirement knocks out the most candidates, the one I should drop last.

  Only if it is quick: score, in a few lines each, a simple beyond-duty view, a maximizing view that grants agents an agent-centred prerogative, a view on which supererogation is excellence relative to the internal standard of a practice, and a contractualist reading in terms of what could reasonably be demanded of anyone. The scorecard is not the deliverable; the list is.
reasoning: |-
  Okay, let me unpack this user's request carefully. They're clearly frustrated after a heated debate about supererogation and want rigorous criteria to evaluate theories, not just opinions. The hospital nurse case reveals their core concern: theories must distinguish genuine moral praise from systemic exploitation. 

  Hmm, they're an academic or advanced philosophy student - no one else would demand such specific test cases while rejecting "camp prejudices." The depth of their examples (linked-hands rescue, ratchet effect) suggests professional engagement with ethics. Their real goal seems to be building a bulletproof framework to prevent theoretical misuse in policy and judgment.

  Right, the key challenges: First, reconciling role relativity with anti-exploitation - if duties expand through reliance, doesn't that erase supererogation? Second, their "uncostly hero" case threatens to decouple sacrifice from supererogation. Third, the temporal ratchet problem could make any repeated act obligatory. 

  I should flag where desiderata conflict - like how "no exploitation" might require objective institutional analysis while "deliberative perspective" demands subjective indexing. The contractualist view fails their nurse case spectacularly since "reasonable demand" could excuse institutional abuse. 

  *checks cases* The failed rescue dilemma is especially thorny. If we celebrate attempts regardless of competence, do we incentivize reckless heroism? But requiring success would undermine attempts like the drowning non-swimmer. 

  *mental note* Must emphasize why "subjective sacrifice not required" is crucial - otherwise the exhilarated doctor can't be supererogatory. And for the mirror cases: if we allow "blameworthy but permissible" acts (like refusing easy rescues), it maintains the praise/blame asymmetry they value.

  The scoring of theories should be brutally concise. Slote's excellence view dies on their corrupt office case - refusing bribes shouldn't be "beyond duty." Maximizing views fail the vanilla/chocolate distinction test. 

  *steeling myself* The knockout test is absolutely "no exploitation." Any theory allowing systemic reliance on "supererogation" fails their primary use-case. Drop this last.
answer: |-
  Here is a specification of desiderata for an adequate theory of supererogation, grounded in your cases and analytic concerns. Each requirement is justified by a specific failure mode or distinction your cases demand.

  ### Core Desiderata (Non-Negotiable)
  1. **Anti-Exploitation Constraint**  
     *Must:* Prevent labeling institutionally relied-upon acts as supererogatory when that reliance is covert or coercive.  
     *Why:* The Nurse Case. Calling her unpaid labor "supererogatory" masks systemic injustice. A theory enabling this is complicit in exploitation.  
     *Downstream Impact:* Essential for institutional/political use (e.g., distinguishing genuine virtue from structural coercion).

  2. **Role-Relative Duty Demarcation**  
     *Must:* Explain why identical acts differ in status (supererogatory vs. obligatory) based on role, *without* allowing roles to absorb new duties *solely* through passive reliance.  
     *Why:* Lifeguard vs. Swimmer Case. Fixing the index requires: (a) explicit institutional/social agreement defining role duties, or (b) voluntary role assumption with known expectations. *Reliance alone cannot create duties*.  
     *Failure Cost:* Collapses into the Nurse Case exploitation.

  3. **Sacrifice-Independence**  
     *Must:* Allow supererogation without subjective cost to the agent.  
     *Why:* Uncostly Hero Case. Sacrifice is evidence, not essence. The doctor’s act is supererogatory because it exceeds enforceable obligation, even if she benefits.  
     *Distinction:* Separates "beyond duty" from "costly" (which may be required, e.g., honesty in corruption).

  4. **Intentionality Over Belief**  
     *Must:* Define supererogation by the agent’s intention to go beyond perceived duty, not objective duty or success.  
     *Why:* Mistaken-Duty Hero & Failed Rescue Cases. The soldier acts beyond *his understanding* of duty (praiseworthy intention). The drowning rescuer attempts a supererogatory act despite failure.  
     *Avoids:* Collapsing supererogation into consequentialism.

  5. **Omissive Supererogation**  
     *Must:* Accommodate praiseworthy forbearance (not acting permissibly) as supererogatory.  
     *Why:* Debt Forgiveness Case. Releasing a legally enforceable debt is optional, costly, and praiseworthy omission.  
     *Distinction:* Separates supererogatory forbearance from neutral omissions (e.g., not eating vanilla).

  6. **Collective Permissibility**  
     *Must:* Explain how individual permissibility scales to collective action.  
     *Why:* Linked-Hands Rescue Case. If no individual is required to join, but all must join to succeed, a theory must resolve whether collective action can be supererogatory *and* whether each agent’s participation is supererogatory.  
     *Failure Cost:* Paralysis in coordination problems.

  7. **Temporal Integrity**  
     *Must:* Index verdicts to the moment of action, not retroactive expectations.  
     *Why:* The Ratchet Case. The colleague’s first shift-cover is supererogatory; the 50th is *still* supererogatory unless institutional duty was formally expanded. Resentment at refusal does not create obligation.  
     *Avoids:* Collapsing optionality into obligation via repetition.

  8. **Asymmetry Preservation**  
     *Must:* Maintain a stark asymmetry between supererogation (praiseworthy omission) and its "mirror" (blameworthy but permissible acts).  
     *Why:* The Advisor Case. I may permissibly omit rescuing, but advising omission or designing systems to expect omission may be blameworthy (e.g., "efficient" hospitals relying on unpaid work).  
     *Distinction:* Separates *personal* permissibility from *endorsement* of omission.

  ### Critical Distinctions to Respect
  - **Beyond Duty vs. Merely Permissible**  
    Vanilla/chocolate is neutral; supererogation is positively valenced. Collapse cost: Erases moral excellence.
  - **Supererogatory vs. Costly-but-Required**  
    Honesty in a Corrupt Office is obligatory despite cost. Collapse cost: Confuses duty with sacrifice.
  - **Supererogatory vs. Saintly**  
    Saintly acts are extreme supererogation; not a distinct category. Collapse acceptable if gradient acknowledged.
  - **Supererogatory vs. Its Mirror**  
    Must preserve "blameworthy but permissible" (e.g., refusing an easy rescue). Collapse cost: Denies moral residue of permissible selfishness.

  ### Constraints from Wider Ethics
  - **No Contradiction of Deontic Logic**  
    Supererogation must not violate core axioms (e.g., "ought implies can"); acts must be *optional* permissibly omitted.
  - **Compatibility with Moral Psychology**  
    Must explain praise without demanding universal imitation (or institutions collapse into Nurse Case).

  ### Which Desiderata Are Genuine?  
  - **Action-Guiding from Deliberative Perspective**: Genuine. Supererogation must be *recognizable* by agents (per Intentionality desideratum).  
  - **No License for Suboptimality**: Prejudice. Maximizing views impose this, but anti-exploitation and asymmetry desiderata already block misuse. Forcing "best" collapses supererogation into duty.

  ### Tensions and Knife-Edges  
  - **Unrestricted Aggregation + Asymmetry**: If saving 100 lives is *demanded*, supererogation evaporates. Asymmetry (praise for extra, no blame for enough) requires scalar duties.  
  - **Temporal Indexing + Act-Types**: The Ratchet Case shows repetition doesn’t change an act-type’s status. Institutions must define duties formally, not via custom.  
  - **Knockout Requirement**: **Anti-Exploitation**. It invalidates theories where "reasonable expectations" (contractualism) or "social practices" (excellence views) permit covert reliance. Drop this last.

  ---

  ### Theory Scorecard (Brief)  
  1. **Simple Beyond-Duty View** ("Duty has limits; beyond is supererogatory")  
     *Fails:* Nurse Case (no anti-exploitation), Ratchet (no temporal indexing), Advisor (no asymmetry).  
  2. **Maximizing + Agent-Centered Prerogative** (Slote)  
     *Fails:* Uncostly Hero (requires sacrifice), Linked-Hands (aggregation problems), Honesty (wrongly makes integrity "optional").  
  3. **Excellence Relative to Practice** (MacIntyre-inspired)  
     *Fails:* Nurse Case (practice may normalize exploitation), Corrupt Office (refusing bribes shouldn’t be "beyond duty").  
  4. **Contractualist** ("What couldn’t be reasonably demanded")  
     *Fails:* Nurse Case ("reasonable" may include exploitation), Mistaken-Duty Hero (ignores intention), Advisor (permits designing for omission).

  ---

  **Deliverable**: The desiderata list above, hardened by your cases. **Strongest Candidate**: A hybrid view with scalar duties (allowing "enough" vs. "more"), role duties fixed by contract/consent, and a strict anti-reliance clause for institutions. **Weakest Link**: Theories prioritizing social expectations over normative constraints (exploitation risk). Use this list to test any theory’s resilience against real-world moral hazards.
