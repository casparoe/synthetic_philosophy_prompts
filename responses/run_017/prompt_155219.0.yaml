  We are designing a session to highlight the difference between two fair division rules without naming them initially. The two rules are:
   1. The "equal-fractions rule": This is the Kalai-Smorodinsky bargaining solution. It equalizes the relative gains from the disagreement point to the ideal point for each player.
   2. The "biggest-product rule": This is the Nash bargaining solution. It maximizes the product of the gains from the disagreement point.

   The key difference: The Nash solution is independent of irrelevant alternatives (IIA), meaning that if an option is added that is not chosen, the solution doesn't change. The Kalai-Smorodinsky solution is not IIA: adding an irrelevant alternative (even if not chosen) can change the solution.

   We want the participants to experience that in a round where an extreme option (very good for one, very bad for the other) is added, the settlement point shifts even though no one would choose that extreme option. This shift is predicted by Kalai-Smorodinsky but not by Nash.

   Session structure:
   - 3 rounds of negotiation in pairs.
   - Each pair negotiates over how to split a fixed set of tokens (or points) representing utility.
   - The tokens are not money but represent satisfaction. We avoid using money to keep it simple and because the utility functions might be nonlinear, but here we use linear for simplicity (so tokens are proportional to utility).
   - Each round, the pair has a set of available divisions (options) and a breakdown outcome (if they don't agree).
   - They have a limited time to negotiate (e.g., 5 minutes per round).
   - After each round, each pair posts their settlement on a wall chart (or announces it) so that the whole group can see the pattern.

   Round 1: Simple symmetric case. Breakdown is (0,0). Available options: (50,50), (60,40), (40,60). We expect most pairs to choose (50,50) or maybe (60,40) and (40,60) if they flip a coin. But we design to push towards symmetry.

   Round 2: Asymmetric breakdown. Breakdown is (20,0) - meaning player A gets 20, player B gets 0 if they fail to agree. Available options: (20,0) [breakdown], (30,50), (50,30), (40,40). The symmetric breakdown is gone. The Nash solution: maximize (A-20)*(B-0). The Kalai-Smorodinsky solution: the ideal point for A is 50 (if they get all they can in the set) and for B is 50. But note: the feasible set is bounded. The line from (20,0) to (50,50) would be the ideal, but (50,50) is not available. The available options are (30,50), (50,30), (40,40). The Kalai-Smorodinsky solution would be the point on the Pareto frontier that equalizes the fractions. The fractions for A: (A-20)/(50-20) = (A-20)/30, for B: (B-0)/(50-0)=B/50. We set the fractions equal: (A-20)/30 = B/50. We also require A+B <= some max? Actually, the options are discrete. We want to see where they settle.

   However, to avoid complex calculations and to get a clear shift in round 3, we design:

   Round 1: 
     Breakdown: (0,0)
     Options: (50,50), (60,40), (40,60)
     Intended settlement: (50,50) because it's symmetric and fair.

   Round 2:
     Breakdown: (20,0)   [Player A has an outside option of 20, Player B has 0]
     Options: (20,0) [breakdown], (40,40), (60,20), (30,50)
     Note: We want to see if they move away from (50,50) because of the asymmetric breakdown. The Nash solution: maximize (A-20)*B. Among the options:
          (40,40): product = (20)*(40) = 800
          (60,20): product = (40)*(20) = 800
          (30,50): product = (10)*(50) = 500
          (20,0): product=0
     So Nash would be indifferent between (40,40) and (60,20). Kalai-Smorodinsky: 
          Ideal for A: max A in the set is 60 -> gain 40 (from 20 to 60)
          Ideal for B: max B in the set is 50 -> gain 50 (from 0 to 50)
          The equal fraction point: 
              Fraction A: (A-20)/40, Fraction B: (B-0)/50
              Set equal: (A-20)/40 = B/50  => 5(A-20)=4B => 5A-100=4B
          Check the options:
              (40,40): (40-20)/40=0.5, 40/50=0.8 -> not equal.
              (60,20): (60-20)/40=1, 20/50=0.4 -> not equal.
              (30,50): (30-20)/40=0.25, 50/50=1 -> not equal.
          We don't have a point that exactly satisfies. So they might choose (40,40) or (60,20). We expect (40,40) because it's more balanced? But note: (30,50) gives B more and A less. 

     However, we want to avoid confusion and set up for round 3. So we design round 2 to be settled at (40,40) by many pairs.

   Round 3 (the key round): 
     Breakdown: same as round 2, (20,0)
     Options: same as round 2 plus an extreme option: (100, 5) [which is very good for A and bad for B]. But note: (100,5) is worse for B than (40,40) and (60,20) and (30,50). So no rational pair would choose (100,5) because (40,40) is better for both than (100,5) is for B? Actually, (100,5) is worse for B than (40,40) (40>5) and worse than (30,50) (50>5). But note: (60,20) gives B 20, which is more than 5. So (100,5) is dominated by (40,40), (60,20), and (30,50). It is irrelevant and should not be chosen.

     However, in the Kalai-Smorodinsky solution, the ideal point changes: 
          Previously in round 2: ideal A was 60, ideal B was 50.
          Now in round 3: ideal A becomes 100, ideal B becomes 50 (because 50 is still the max for B? Actually, in round 2 we had (30,50) so 50 was available, and now we have (100,5) but also (30,50) so the max for B is still 50. The max for A is now 100. So the ideal point becomes (100,50).

          The Kalai-Smorodinsky solution: the point on the Pareto frontier that equalizes the fractions: 
