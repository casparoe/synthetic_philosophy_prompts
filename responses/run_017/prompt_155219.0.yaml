  ### **Facilitator Script Snippets**  
  - **Intro:** *"Inheritances, business deals, even divorces—people fight over how to split gains. Today, we’ll simulate negotiations to see what feels fair."*  
  - **During Rounds:** *"You have 5 minutes. If deadlocked by the bell, you get the breakdown outcome. Write your split clearly!"*  
