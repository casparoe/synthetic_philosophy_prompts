  #### **Debrief Moves**  
  After displaying the wall chart:  

  ```json
  {
    "debrief_moves": [
      {
        "moment": "Round 1: Most pairs choose A50B50",
        "mapped_to": "Symmetric case; intuitive equality.",
        "facilitator_line": "When breakdown was equal, you prioritised equal splits—that felt straightforward."
      },
      {
        "moment": "Round 2: Shift to A40B40 after breakdown becomes A20B0",
        "mapped_to": "Breakdown point influences fair division.",
        "facilitator_line": "Here, Player A had more leverage if talks failed—so splits moved to acknowledge A’s stronger position."
      },
      {
        "moment": "Round 3: Settlements shift toward A60B20 despite same options as Round 2 (plus unused A100B5)",
        "mapped_to": "Irrelevant options can alter perceptions of fairness (violates 'independence of irrelevant alternatives').",
        "facilitator_line": "Notice how the extreme option—though ignored—pulled splits toward Player A. Why might that be?"
      },
      {
        "moment": "Group observes the Round 2 vs. Round 3 shift",
        "mapped_to": "Two rules conflict: equal-fractions (Kalai-Smorodinsky) vs. biggest-product (Nash).",
        "facilitator_line": "One rule (equal-fractions) asks, 'What fraction of your maximum gain did you get?'. The other (biggest-product) asks, 'What split multiplies gains above breakdown?'. The extreme option changed what 'maximum gain' meant, shifting the first rule’s outcome."
      }
    ]
  }
  ```  

  > **Clarification:**  
  > - **Equal-fractions rule** = Kalai-Smorodinsky solution (you described it correctly). It equalises the *fraction* of the way each travels from breakdown to their *ideal* (max possible) gain.  
  > - **Biggest-product rule** = Nash solution. It maximises the *product* of gains above breakdown.  
  > The conflict arises because adding an irrelevant option (A100B5) changes the "ideal" for Player A in Kalai-Smorodinsky, dragging the fair point toward A. Nash ignores irrelevant options.  

