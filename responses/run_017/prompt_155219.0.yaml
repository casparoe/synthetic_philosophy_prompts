  ### Session Design: Fair Division Negotiation Game  
  **Objective:** Participants experience an intuitive disagreement between two fair division rules (without naming them) by negotiating splits in three rounds. The critical moment is round 3, where an extreme, irrelevant option shifts settlements toward the player it favours, despite no one choosing it.  

  ---

  #### **Session Timeline (90 Minutes)**  
  - **0–10 mins:** Introduction and setup.  
    - Assign pairs (8 pairs for 16 participants). Assign roles: Player A (fixed for all rounds) and Player B.  
    - Explain: *"You’ll negotiate how to split tokens representing satisfaction. Each round, you’ll have options. Aim for a deal—if you deadlock, you get the breakdown outcome. Tokens don’t carry over; each round is independent. After each round, post your split on the wall chart. One pair will win a tin of biscuits and choose next month’s topic!"*  
  - **10–20 mins:** Round 1.  
  - **20–25 mins:** Report Round 1 outcomes (pairs call out splits; facilitator records on wall chart).  
  - **25–35 mins:** Round 2.  
  - **35–40 mins:** Report Round 2 outcomes.  
  - **40–50 mins:** Round 3.  
  - **50–55 mins:** Report Round 3 outcomes.  
  - **55–60 mins:** Short break.  
  - **60–85 mins:** Debrief (discuss patterns, map to rules, award prize).  
  - **85–90 mins:** Wrap-up.  

  ---

  #### **Rounds Design**  
  Participants see only their role’s token amounts (e.g., "Option 1: You get 50, Partner gets 50"). No theory is mentioned.  

  ```json
