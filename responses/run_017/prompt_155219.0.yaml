          So the Kalai-Smorodinsky solution in this set would be (60,20) because it has the highest minimum fraction (0.4).

          In round 2, without (100,5), the ideal point was (60,50) [since max A was 60 and max B was 50]. Then the fractions for (40,40): 
              Fraction A: (40-20)/(60-20)=20/40=0.5
              Fraction B: (40-0)/(50-0)=40/50=0.8 -> min=0.5
          For (60,20):
              Fraction A: (60-20)/40=40/40=1
              Fraction B: (20-0)/50=20/50=0.4 -> min=0.4
          So in round 2, Kalai-Smorodinsky would have chosen (40,40) because it has the higher minimum fraction (0.5 vs 0.4).

          Therefore, adding the irrelevant option (100,5) changes the Kalai-Smorodinsky solution from (40,40) to (60,20). But note: (60,20) is already available in round 2 and round 3, but in round 2 it was not the Kalai-Smorodinsky solution.

          We expect that in round 2, pairs settle at (40,40) because it's more balanced. Then in round 3, with the same breakdown and the same feasible options plus an irrelevant one, some pairs might shift to (60,20) because the presence of the extreme option (100,5) makes (40,40) seem less generous to A? Or they might not. We hope that the shift occurs because the ideal point has moved and the equal fractions rule now points to (60,20).

          However, note that the Nash solution remains the same: 
              In round 2: (40,40) and (60,20) both have product 800 (above breakdown: (40-20)*40=800 and (60-20)*20=800) and (30,50) has 500. So Nash is indifferent between (40,40) and (60,20).
              In round 3: the same. The new option (100,5) has product (100-20)*5=400, which is worse. So Nash would still choose between (40,40) and (60,20).

          Therefore, if we observe a shift from (40,40) in round 2 to (60,20) in round 3, it is consistent with Kalai-Smorodinsky and not with Nash (which is indifferent). But note: in round 2, they might have chosen (40,40) for symmetry, and in round 3 they might choose (60,20) because they flip a coin? We need to see if the pattern shifts.

          We must design so that in round 2, (40,40) is the clear favorite, and in round 3, more pairs choose (60,20). We hope that the extreme option (100,5) makes (60,20) look more reasonable to A and perhaps B feels that A is now entitled to more? Or maybe the extreme option shifts the perceived fair point.

