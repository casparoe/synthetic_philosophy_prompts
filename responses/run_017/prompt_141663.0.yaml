  Okay, let me start by unpacking this user's query. They're part of a rationality meetup where someone shared a "steelman" of Gould and Lewontin's anti-adaptationist argument. The user has read blog-level discussions but not the original 1979 paper, so they're unsure how accurate their friend's summary is. They point out three areas of concern: the claim that "most traits are spandrels," the proposed test for adaptation, and the architectural terminology mix-up. Plus, they're worried about how "spandrel" is used online to dismiss adaptationist hypotheses.

  First, I need to revisit Gould and Lewontin's actual paper. The key points were methodological: adaptationists often ignore alternatives like genetic drift, constraints, or non-adaptive byproducts. They weren't making a quantitative claim about "most traits." The spandrel analogy was about architectural necessity leading to creative reuse, not about prevalence. 

  The friend's test—classifying anything that could be a byproduct as a spandrel until proven otherwise—flips the burden of proof unrealistically. In reality, both hypotheses need testing. The "pendentives vs. spandrels" point is minor; Dennett criticized it, but the core idea stands. Exaptation, introduced later by Gould and Vrba, refers to traits co-opted for new functions, which adds nuance but isn't in the original paper.

  The user's deeper concern is about comment sections where "spandrel" shuts down discussions. That's a misuse; the original paper advocated for considering multiple explanations, not replacing one assumption with another. A working biologist would want rigorous evidence for any claim, adaptation or spandrel.

  So, correcting the friend's summary: the paper was a critique of method, not a headcount. Suspicion should mean demanding robust evidence, not assuming byproducts. The moral isn't to flip burdens but to avoid storytelling without tests. The user needs clarity on how to approach such debates without falling into false dichotomies.
answer: |-
  Here's a breakdown of your friend's paragraph, separating Gould & Lewontin's (G&L) actual arguments from common misunderstandings and downstream misapplications:

  **1. "Most traits of most organisms are not adaptations at all, they're spandrels":**
  *   **G&L's Position:** This is **not** an empirical claim about headcount made in the 1979 paper. The paper is primarily a **methodological critique**. They argued that adaptationists *assume* every trait is an adaptation *without adequately considering alternatives*. They *suggested* that non-adaptive explanations (spandrels, constraints, pleiotropy, genetic drift) are likely far more common than adaptationists acknowledge, but they did *not* quantify this as "most traits". Their point was that the adaptationist program blinds researchers to these other possibilities.
  *   **Friend's Statement:** Overstates G&L's claim into a specific quantitative assertion they didn't make. It converts a methodological warning ("you're ignoring these possibilities") into a factual headcount ("these possibilities *are* the majority").
  *   **Working Adaptationist's View:** This is a **strawman/misrepresentation**. Adaptationists (like Maynard Smith, Dawkins, Tooby & Cosmides) agree that *not all* traits are direct adaptations. Their core argument is that *natural selection is the primary creative force* shaping complex functional traits over evolutionary time, and that rigorous adaptationist hypotheses are the best way to understand complex functionality. They argue G&L overstated the prevalence of non-adaptive explanations for complex functional traits and downplayed the power of selection to finely shape organisms.

  **2. "The adaptationist programme... is the assumption that every trait was built by selection for the job it now does":**
  *   **G&L's Position:** This is largely accurate as a characterization of what they were criticizing, which they dubbed the "Panglossian Paradigm". They identified specific practices: atomization (breaking organisms into traits), optimization thinking, and neglect of alternatives. They highlighted cases where traits clearly serve a purpose *now* but were likely co-opted from a different original function or structure (foreshadowing "exaptation").
  *   **Working Adaptationist's View:** Modern rigorous adaptationists **reject this extreme characterization** as their actual practice. They agree that *current function* isn't always *original function* (see "exaptation" below). They argue their approach involves generating and *testing* specific functional hypotheses against alternatives (including constraints and drift) using evidence from comparative biology, genetics, development, and fitness consequences. They see G&L as attacking a caricature.

  **3. "And they gave a test: before you accept any adaptationist explanation, ask whether the trait could have arisen as a side effect of something else. If it could, it's a spandrel until someone proves otherwise.":**
  *   **G&L's Position:** This is **not** a "test" proposed by G&L. Their paper urges researchers to *consider* alternatives *seriously*, not to default to "spandrel" status. They argued the burden of proof lies on the adaptationist to demonstrate adaptation *because* the adaptationist program dominates and often ignores alternatives. They wanted non-adaptive hypotheses given equal consideration during hypothesis generation and testing.
  *   **Friend's Statement:** This is a **significant misrepresentation and over-simplification** that leads to the exact problem you identified. It creates an impossible standard:
      *   "Could have arisen as a side effect" is often trivially true for many traits.
      *   Declaring something a "spandrel" based *only* on a *possibility* is bad science. "Spandrel" isn't a default state; it's a specific hypothesis requiring evidence itself.
      *   It flips the burden of proof unrealistically. Proving a *negative* (that something is *not* an adaptation) is often impossible. Science progresses by testing *positive* hypotheses against each other and evidence.
  *   **Spandrel Definition Shift:** You're right. Online, "spandrel" is often lazily used to mean "not an adaptation" or "useless byproduct". G&L's definition was more nuanced: a spandrel is a necessary architectural *byproduct* of prior adaptive changes (like the dome's support structure). Crucially, they emphasized that spandrels can *later* be co-opted for a new function ("exaptation").

  **4. Pendentives vs. Spandrels:**
  *   **The Fact:** The architectural features G&L discussed under St. Mark's dome are technically **pendentives** (spherical triangles transitioning a square base to a circular dome), not spandrels (the roughly triangular space between two adjoining arches).
  *   **Does it Bite?** It's **mostly pedantry regarding the analogy, not the core argument**. Dennett (a staunch adaptationist critic of G&L) made much of this in *Darwin's Dangerous Idea*, arguing it showed G&L's sloppiness and misunderstanding of the very metaphor they used. While it does highlight an error in the *example*, the *core concept* G&L aimed for – a necessary structural byproduct of an adaptive feature that can then be co-opted – remains valid whether you call it a pendentive or a spandrel. The central biological argument doesn't hinge on the precise architectural term.

  **5. Exaptation - The Missing Piece:**
  *   **Yes!** This is crucial. Gould and Elisabeth Vrba introduced "exaptation" in a 1982 paper precisely to clarify this. An **exaptation** is a feature whose current function was *not* the reason for its original evolution. It has two sub-types:
      1.  A feature shaped by selection for one function, later co-opted for a new function (e.g., bird feathers likely evolved for insulation, later adapted for flight).
      2.  A **spandrel** (a non-adaptive byproduct) that is later co-opted for a function (e.g., the pendentives in St. Mark's being decorated).
  *   **Why it Matters:** Exaptation directly addresses the "built for the job it now does" criticism. It provides a framework for understanding how traits can be *functional now* without having been *directly selected for that function originally*. Your friend's paragraph misses this nuance entirely.

  **Downstream Use & Your Core Concern:**
  *   **"Or spandrel" as a Refutation:** This is **absolutely NOT** the fair moral of the paper and **IS the exact failure mode flipped.** G&L railed against storytelling *without considering alternatives*. Responding to an adaptationist story *only* with "or spandrel" is **just another form of untested storytelling.** It replaces one just-so story with another.
  *   **What G&L Wanted:** They wanted researchers to:
      1.  Consider a *range* of alternative hypotheses (developmental constraint, pleiotropy, genetic drift, phylogenetic inertia, *and* spandrels/exaptations) *alongside* adaptation.
      2.  Generate *testable predictions* for *all* plausible hypotheses.
      3.  Rigorously test these hypotheses against evidence (fossil record, comparative biology, genetics, development, fitness measurements).
      4.  Acknowledge when evidence is insufficient to distinguish between hypotheses.
  *   **The Fair Moral & Form of Suspicion:**
      *   The critique **does license suspicion of *untested* or *uncritically accepted* adaptationist hypotheses.** It highlights that "it looks useful" is not sufficient evidence for adaptation.
      *   **Suspicion should take the form of demanding rigorous evidence and the consideration/test of alternatives**, not simply asserting "spandrel" as a counter-explanation. Ask:
          *   What's the *specific* evidence *for* this proposed adaptation (beyond mere plausibility)?
          *   What are the plausible *alternative* explanations (constraint, drift, exaptation, byproduct)?
          *   What evidence distinguishes the adaptation hypothesis from these alternatives?
          *   Is the trait complex and functionally integrated in a way strongly suggesting direct selective shaping?
          *   Could the trait be an exaptation (co-opted from a different original function or structure)?

  **Conclusion: Does the core critique survive correction?**

  **Yes, but significantly nuanced.** The core methodological critique – that uncritical adaptationism leads researchers to ignore plausible non-adaptive explanations and accept untested just-so stories – remains valid and important. It pushed evolutionary biology towards greater methodological rigor.

  **Your friend's conclusion ("reason to be extremely suspicious") survives in spirit,** but his specific formulation ("if it could be a byproduct, burden of proof is on adaptationist") is flawed and leads to the very problem G&L warned about (replacing one story with another). The *real* burden is on *anyone* making a *positive claim* about a trait's evolutionary origin (adaptation, spandrel, constraint) to provide evidence and test their hypothesis against alternatives. Healthy scientific suspicion means demanding this rigor for *all* evolutionary explanations, not creating a default "spandrel" category based on mere possibility. The key contribution is forcing the consideration of a wider range of evolutionary forces shaping phenotypes.
