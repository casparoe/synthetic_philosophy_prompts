prompt: |-
  I'm an undergraduate in an upper-level seminar on practical rationality this term, and I've been asked to take one thirty-minute session of a student-run decision-theory reading group — mostly economics and computer-science majors who have had expected-utility theory and some value-of-information and exploration/exploitation material, and no philosophy. The topic assigned to me is the problem of transformative experience: the distinction between experiences that are epistemically transformative and ones that are personally transformative, and the argument that a choice involving them cannot be settled by standard expected-utility reasoning. Please don't write the session for me; tell me how to sequence it.

  Concretely:

  1. The dependency structure. I can't tell whether to lead with the "you can't imagine what it will be like" half or the "you won't want what you now want" half. Which has to come first, what has to be in place before either one lands, and why? My own guess is that they first have to accept that it is the agent's *own* utility function that does the work in the expected-utility calculation — otherwise the whole thing looks like ordinary risk and nothing I say afterward registers.

  2. The carrying example. I've been toying with a nine-month Antarctic winter-over versus staying in a well-understood job: testimony about it is abundant and yet seems to fail, the alternative has a payoff they can model, and it looks reversible, which I think matters. Say whether that case can carry the whole arc or what I should swap it for, and say what a case like this must have and must lack. My constraints: it must be epistemically and personally transformative at once; it must have a non-transformative alternative whose payoff they can genuinely compute; it must have plenty of available testimony, so that "read the memoirs" is a live suggestion that then fails; it must not be morally or identity-loaded the way becoming a parent or a religious conversion is; and it must not be a one-off taste case, which would only dramatise half the problem.

  3. The misconceptions, and the point in the sequence where each gets headed off. The ones I expect: collapsing it into ordinary risk over an unknown quantity; thinking testimony or a survey of participants solves it; concluding that reason gives out and one should just be spontaneous; "pilot it first, then back out" — including the wrinkle I want handled somewhere rather than bolted on, that the decision whether to continue or reverse is made by the transformed self, so reversibility doesn't return control to the ex ante agent; and treating any large life change as transformative. Someone will also say "oh, like affective forecasting and impact bias" — tell me whether that empirical literature is a bridge into the problem or a detour, and where it goes if anywhere.

  4. A variant I can't place: a transformation invisible from the inside, where the person sincerely reports that their values are unchanged while their choices have shifted. It seems to cut against the "choose in order to discover who you become" framing, and I don't know whether it belongs in the main arc, as a closing hard case, or nowhere in thirty minutes.

  5. The check: one question for the last two minutes whose answer distinguishes having seen that the difficulty is missing *values* from having heard it as missing *information*. My candidate is handing them a nearby case in which expected-utility reasoning is fine and asking what changed; give me a better one if you have it.

  6. What to openly refuse to cover at this level — I suspect the metaphysics of personal identity, which someone will raise, and whether the discovery-based alternative can be formalised or consequentialised.

  Format it as a numbered sequence of moves with approximate timings, each misconception attached to the move where it should be defused, followed by the check question and the list of refusals. No more than 700 words.
reasoning: |-
  Okay, let me tackle this undergraduate's request. They're preparing a 30-minute session on transformative experiences for a decision-theory reading group. The audience is econ and CS majors familiar with expected utility but not philosophy. I need to help structure this carefully.

  First, considering the dependency structure. The core challenge is making students see this isn't just about missing information - it's about the utility function itself changing. I'll start with the "you can't imagine" half to establish the epistemic gap through a concrete case. Only then can the personal transformation part land meaningfully. The Antarctic winter-over example seems perfect: it meets all their criteria (non-moral, reversible-seeming, abundant testimony) and demonstrates both transformations simultaneously.

  For timing:
  - Minute 1-5: Hook with the Antarctic case to show standard EU reasoning fails despite testimony. This heads off the "just gather more data" misconception early.
  - Minute 6-10: Contrast with a standard risk case to highlight what's different. This prevents collapsing into ordinary risk models.
  - Minute 11-15: Introduce personal transformation using the same case. Emphasize that the transformed self judges differently. This counters the "pilot and back out" idea.
  - Minute 16-20: Show how both transformations interact. Use the invisible transformation variant here to complicate things.
  - Minute 21-25: Address misconceptions like affective forecasting (bridge, not solution) and distinguish from ordinary big decisions.
  - Last 5 minutes: The check question - contrast with a predictable taste change case to test if they grasp it's about values, not information.

  For misconceptions:
  - "Testimony solves it" gets addressed immediately with the Antarctic case failure.
  - "Ordinary risk" gets countered by the EU-compatible contrast case.
  - "Pilot first" gets dismantled when discussing the transformed self.
  - Affective forecasting comes late as a related but distinct concept.

  The invisible transformation variant fits well in minute 16-20 to show even self-report fails. The check question should force distinction between missing values vs information - I'll keep their candidate about comparing cases. Openly refuse personal identity metaphysics and formalization attempts to stay focused.

  This sequence should build understanding step by step while efficiently handling their constraints. The Antarctic case carries the arc beautifully if presented right.
answer: |-
  Here’s a sequenced 30-minute plan targeting your constraints. Misconceptions are addressed at key points to prevent derailment.

  ### 1. **Establish Core EU Context (3 mins)**  
     *Do:* Briefly restate EU: agents maximize expected utility based on *current* beliefs/values. Stress that utilities are subjective and anchored to the agent’s *present* self.  
     *Why first?* Without this, students default to "objective" payoffs. Ensures they see the problem as internal to the agent’s reasoning.  

  ### 2. **Epistemic Transformation via Case (7 mins)**  
     *Case:* Use **Antarctic winter-over** vs. stable job. Highlight:  
     - Abundant testimony exists ("read memoirs").  
     - Yet, you *still* can’t subjectively model the experience (e.g., profound isolation, sensory deprivation).  
     *Key move:* Ask, "Can you assign a reliable utility to ‘life in Antarctica’ *for you*?" Contrast with calculable job payoff.  
     *Defuses:* "Testimony/surveys solve it" (shows testimony fails for *subjective* anticipation).  
     *Avoids:* Collapsing into ordinary risk (emphasize: it’s not uncertainty over a fixed utility, but inability to *define* the utility).  

  ### 3. **Personal Transformation via Same Case (7 mins)**  
     *Do:* Argue that surviving Antarctica may *alter your values* (e.g., you now crave solitude; your old career ambitions feel hollow). Stress:  
     - The "reversible" exit is chosen *by your transformed self*—ex ante you loses control.  
     - Job alternative has stable values.  
     *Defuses:* "Pilot first, then back out" (reversibility doesn’t help—transformed self won’t want to reverse).  
     *Defuses:* "Just be spontaneous" (this is a *structural* gap in EU, not anti-rationality).  

  ### 4. **Interlock Transformations + Invisible Variant (5 mins)**  
     *Do:* Use a tweak: "Imagine after Antarctica, you *insist* your values are unchanged, but you inexplicably quit your job to become a wilderness guide. Observers see transformation; you deny it."  
     *Why here?* Shows personal transformation can be opaque to the agent, complicating "choose to discover who you become." Reinforces that EU’s ex ante utility is inapplicable.  
     *Defuses:* "Any big change is transformative" (most aren’t: e.g., moving cities may not alter core values).  

  ### 5. **Clarify Boundaries (3 mins)**  
     *Do:* Contrast with **affective forecasting**: "Yes, people mispredict utility—but that’s *poor information*. Transformative experiences make utility *undefined* ex ante." Call it a bridge (highlights prediction failures) but a detour (doesn’t solve the conceptual hole in EU).  
     *Defuses:* "Collapse into risk/forecasting errors."  

  ### 6. **Check Question (2 mins)**  
     *Do:* Pose: **"You’ve never eaten durian. You read reviews, taste it, and hate it. Why is this *not* transformative, unlike Antarctica?"**  
     *Why better?* Forces distinction: Durian involves missing *information* (you could’ve guessed utility from data). Antarctica lacks the *value framework* itself. Reveals if they grasp the core rupture in EU.  

  ### 7. **Refusals (Openly Declare Early)**  
     Reject:  
     - **Metaphysics of personal identity** ("We’re not asking ‘will it be me?’ but ‘can *I* rationally choose?’").  
     - **Formalizing discovery** ("Whether we can consequentialize this is advanced—today, we show why EU *as given* fails").  
     *When:* State upfront (min 1) and reaffirm if asked.  

  **Timing Summary**:  
  - 1–3: EU Setup  
  - 4–10: Epistemic (Case + Defusal)  
  - 11–17: Personal (Case + Defusal)  
  - 18–22: Invisible Variant + Boundaries  
  - 23–25: Forecasting Clarification  
  - 26–27: Check Question  
  - 28–30: Wrap-up/Q&A  

  **Why Sequence Works**:  
  Epistemic first exposes the information gap within standard EU. Personal transformation then reveals why values can’t be pre-assigned. The Antarctic case sustains both halves while meeting your criteria (testimony-rich, reversible-seeming, non-moral). Misconceptions are preempted where they naturally arise (e.g., "reversibility" when discussing personal transformation). The check question isolates the value/information confusion.
