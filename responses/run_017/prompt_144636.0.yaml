  ### 1. The Question  
  **Total marks: 25**  
  **Time guidance:** 60 minutes total (read carefully: 5 minutes; Part A: 5 minutes; Part B1: 15 minutes; Part B2: 20 minutes; Part B3: 15 minutes)  

  **Background: The Lottery and Preface Paradoxes**  
  In epistemology, two paradoxes challenge how we handle justified belief in high-probability propositions:  
  - **Lottery paradox**: In a fair 1,000-ticket lottery with one winner, each ticket’s high probability of losing (e.g., 0.999) seems to justify believing it will lose. But if we justifiably believe *every* ticket loses, we contradict the known fact that one wins. This challenges the principle that justified belief is closed under conjunction (i.e., if you justifiably believe each of P₁, P₂, ..., Pₙ, you justifiably believe their conjunction, P₁ and P₂ and ... and Pₙ).  
  - **Preface paradox**: An author has strong evidence for each claim in her book, justifying belief in each. Yet in the preface, she acknowledges that at least one error exists due to her fallibility. This justifies believing the *conjunction* of all claims is false, contradicting closure.  

  **Scenario: Distributed Inference System**  
  A serving stack runs a batch job across 1,000 inference replicas. Each replica independently fails (returns a wrong answer) with probability 0.001. Independence is known (replicas are separately seeded and provisioned). A monitor, reliable at 0.99, alerts: “At least one replica failed.” You are the on-call engineer.  
  - You have strong statistical grounds to believe *each individual replica* was correct (failure rate = 0.001).  
  - You have decent grounds to trust the monitor (reliability = 0.99).  
  - You cannot identify which replica failed.  
  - The failover protocol lets you discard the whole batch and rerun it (or take a majority vote) without identifying the culprit.  

  **Part A: Core Concepts (3 marks; 5 minutes)**  
  Briefly state how the lottery paradox and preface paradox each create a tension for justified belief. Focus on the role of the closure principle under conjunction.  

  **Part B: Analysis (22 marks total)**  
  **B1. Actionability and Tension (6 marks; 15 minutes)**  
  Explain how the engineer’s situation resembles the lottery paradox and how it resembles the preface paradox. Then, argue whether the ability to act on the monitor’s alert without identifying the failed replica (e.g., by discarding the batch):  
  (i) Dissolves the epistemic tension (i.e., removes the conflict in justified beliefs),  
  (ii) Relocates it to the level of action (i.e., the tension now concerns what to do, not what to believe), or  
  (iii) Leaves the epistemic tension unchanged.  
  Justify your answer.  

  **B2. Forward and Reverse Closure (8 marks; 20 minutes)**  
  Consider two principles:  
  - **Forward closure (FC)**: If justified in believing each of P₁, P₂, ..., Pₙ, then justified in believing their conjunction (P₁ and P₂ and ... and Pₙ).  
  - **Reverse closure (RC)**: If justified in believing the conjunction (P₁ and P₂ and ... and Pₙ) is *false*, then justified in disbelieving at least one *particular* Pᵢ (i.e., justified in believing that at least one specific Pᵢ is false).  
  Answer:  
  (i) Does rejecting FC (to resolve the paradoxes) commit one to rejecting RC? Explain.  
  (ii) Is RC more essential to the preface case than the lottery case? Why?  
  (iii) In the scenario, does the monitor’s alert justify the engineer in disbelieving the output of at least one *particular* replica? Why or why not?  

  **B3. Correlation Variant (8 marks; 20 minutes)**  
  Now suppose replicas are *positively correlated*: Shared model weights and input batches mean that if one fails, others are more likely to fail. Answer:  
  (i) How does this affect the engineer’s justification for believing each *individual* replica was correct?  
  (ii) How does it affect the justification for the aggregate claim (that at least one failed)?  
  (iii) Does this make the scenario more like the lottery, more like the preface, or neither? Explain.  

