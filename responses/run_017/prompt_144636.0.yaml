  ### 2. Model Answer (≈900 words)  
  **Glossary**  
  - **Justified belief**: A belief supported by sufficient evidence, making it rational to hold.  
  - **Closure principle (forward)**: If justified in believing each proposition in a set, then justified in believing all are true simultaneously (their conjunction).  
  - **Closure principle (reverse)**: If justified in believing that not all propositions in a set are true (the conjunction is false), then justified in believing that at least one specific proposition is false.  
  - **Conjunction**: A compound statement (e.g., "P and Q") true only if all parts are true.  
  - **Disbelieve**: To hold that a proposition is false.  
  - **Epistemic tension**: A conflict in what one is rationally justified to believe.  
  - **Aggregate claim**: A statement about the whole set (e.g., "at least one failed").  

  **Part A: Core Concepts**  
  The lottery paradox creates tension by showing that high probability (e.g., each ticket losing) seems to justify individual beliefs, but closure forces an unjustifiable conjunction (all tickets lose), contradicting the known aggregate (one wins). The preface paradox creates tension by justifying belief in each claim individually while justifying disbelief in their conjunction (due to expected errors), again challenging closure.  

  **B1. Actionability and Tension**  
  The engineer’s situation resembles the lottery paradox because:  
  - Each replica has a very high probability of being correct (0.999), seemingly justifying the belief that it was correct—analogous to believing each lottery ticket loses.  
  - The monitor’s reliable alert (analogous to the lottery organizer’s announcement) justifies believing the aggregate claim: at least one replica failed (like one ticket winning), contradicting the conjunction of all being correct.  

  It resembles the preface paradox because:  
  - Strong evidence supports each replica’s correctness (like the author’s evidence for each claim).  
  - The monitor’s alert justifies believing the conjunction of all replicas being correct is false (like the author’s belief that at least one error exists).  

  The ability to act (e.g., discarding the batch) without identifying the failed replica **leaves the epistemic tension unchanged**. Acting resolves a *practical* problem (avoiding reliance on a corrupted batch) but does not address the *epistemic* conflict: The engineer is still justified in believing each replica was correct (by statistical grounds) *and* justified in believing at least one was not (by the monitor). Actionability sidesteps the need to pinpoint the failure but does not dissolve the contradiction in beliefs, as closure principles remain challenged. The tension is epistemic (about justification), not relocated to action, because the conflict persists regardless of what the engineer does.  

  **B2. Forward and Reverse Closure**  
  (i) Rejecting FC does not commit one to rejecting RC. FC and RC are distinct principles. Rejecting FC avoids the paradox by blocking the move from justified individual beliefs to an unjustifiable conjunction. RC, however, governs a different inference: from the falsity of a conjunction to disbelief in at least one conjunct. One could reject FC (e.g., due to risk accumulation in conjunctions) while accepting RC (e.g., because if a conjunction is false, at least one part must be false, and evidence for the whole’s falsity justifies this). They are not logically linked.  

  (ii) RC is more essential to the preface case than the lottery case. In the preface, the author infers that at least one specific claim is false *only* from evidence against the conjunction (her fallibility), with no independent evidence against any claim. RC formalizes this. In the lottery, the aggregate claim (one wins) is justified *independently* (by lottery rules), not by RC—we don’t need RC to know one ticket wins. Thus, RC is central to the preface’s structure but incidental to the lottery.  

  (iii) In the scenario, the monitor’s alert **does not justify** disbelieving any *particular* replica. The alert directly justifies the aggregate claim (at least one failed), but it provides no evidence about which replica failed. The engineer has strong evidence for each replica’s correctness individually (0.999 reliability), and the alert doesn’t override this for any specific replica. This mirrors the preface: The author knows an error exists but not where. RC would demand disbelief in a specific replica, but it is unjustified here—highlighting a limitation if RC is assumed.  

  **B3. Correlation Variant**  
  (i) Positive correlation **weakens the justification** for believing each individual replica was correct. While the per-replica failure rate is still 0.001, correlation means failures cluster (e.g., a shared flaw in model weights). Knowing one replica’s failure raises others’ failure probability, indirectly undermining confidence in each. The engineer should be less confident in each replica than under independence.  

  (ii) It **strengthens justification** for the aggregate claim (at least one failed). Correlation increases the probability of multiple failures, making the event “at least one failed” more likely than under independence (where it was 1 - (0.999)^1000 ≈ 0.63). With higher prior probability, the monitor’s alert (even at 0.99 reliability) is more credible.  

  (iii) This makes the scenario **more like the preface**. The lottery assumes independence (tickets don’t influence each other), but correlation here mirrors the preface’s error dependencies (e.g., one flawed assumption taints many claims). Like the author, the engineer faces clustered uncertainties, weakening individual justification and strengthening aggregate disbelief. It is not purely like either paradox but leans toward the preface due to non-independence.  

