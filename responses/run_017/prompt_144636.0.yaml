  ### Planning

  **(a) Three candidate cruxes:**  
  1. The role of actionable aggregate beliefs without identification: Does the engineer's ability to act on the monitor's alert (e.g., discarding the batch) resolve, relocate, or leave unchanged the epistemic tension between justified individual beliefs and justified aggregate disbelief?  
  2. The relationship between the forward closure principle (justified belief in each conjunct justifies belief in their conjunction) and the reverse closure principle (justified belief in the falsity of a conjunction justifies disbelief in at least one particular conjunct): Does rejecting the former commit one to rejecting the latter? Is the reverse principle more essential to the preface case than the lottery case?  
  3. The impact of removing independence (introducing positive correlation): How does correlation alter the justification for individual and aggregate beliefs, and does it shift the scenario closer to the lottery, preface, or a hybrid?  

  **(b) Two set aside:**  
  - I set aside **crux 1 (actionable aggregates)** because, while practically significant, it primarily addresses the practical resolution of the paradox without forcing deeper engagement with the epistemic principles (e.g., closure) that underpin the tension.  
  - I set aside **crux 3 (removing independence)** because it builds on the core tension but does not directly challenge the student to interrogate the logical symmetries/asymmetries between the paradoxes (e.g., the reverse principle).  

  **(c) Likely faked answer:**  
  A well-prepared student may try to fake an answer by superficially rehearsing standard solutions (e.g., "reject closure") without adapting them to the reverse principle or the scenario’s specifics, thereby dodging the novel application.

