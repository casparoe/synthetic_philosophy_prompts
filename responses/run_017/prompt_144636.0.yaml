  Let's begin.

  **Question**

  **Part A: Background on the Lottery and Preface Cases** [3 marks; 5 minutes]

  In epistemology, the lottery paradox and the preface paradox are used to challenge the idea that we can have justified beliefs in propositions that are highly probable but not certain. 

  - The **lottery paradox** arises when we consider a fair lottery with many tickets (say, 1000) and exactly one winner. For any single ticket, it is highly probable that it will lose. If we hold that a high probability is sufficient for justified belief, then we would be justified in believing of each ticket that it will lose. But then, by the principle that justified beliefs are closed under conjunction (if you are justified in believing P and justified in believing Q, then you are justified in believing P and Q), we would be justified in believing that every ticket will lose. However, we also know that one ticket will win, so we are justified in believing that not every ticket loses. This leads to a contradiction: we are justified in believing both that every ticket loses and that not every ticket loses.

  - The **preface paradox** comes from the practice of authors writing a book. The author may have good evidence for each claim in the book, so that she is justified in believing each one individually. However, in the preface, she acknowledges that, given the complexity of the subject and her fallibility, it is highly likely that at least one error exists in the book. So, she is justified in believing that the conjunction of all the claims in the book (i.e., that every claim is true) is false. But she does not know which claim is false. This again challenges the closure principle and the idea that high probability suffices for justified belief.

  **Part B: The Engineering Scenario** [22 marks total; 55 minutes]

  Consider the following scenario from distributed computing:

  > A serving stack runs a batch of work across 1,000 inference replicas. Each replica independently returns a wrong answer with probability 0.001; the independence is known (because the replicas are separately seeded and provisioned). An independent monitor, reliable to 0.99, raises the alert: "at least one replica in this batch returned a wrong answer." You are the on-call engineer. You have very strong statistical grounds for believing of each individual replica that it was correct (because the failure rate is low). You have decent grounds for trusting the monitor (which has a 99% reliability). You cannot identify which replica failed. The failover protocol lets you discard the whole batch and re-run it, or re-run and take a majority vote, without ever identifying the failed replica.

  **B1. Tension and Actionability** [6 marks; 15 minutes]
  Explain how the engineer's situation resembles the lottery case and how it resembles the preface case. Then, discuss whether the engineer's ability to act on the monitor's alert without identifying the failed replica (e.g., by discarding the whole batch) resolves the tension present in the paradoxes, relocates it to the level of action, or leaves the epistemic tension (about what one is justified in believing) unchanged. 

  **B2. The Reverse Closure Principle** [8 marks; 20 minutes]
  In the standard lottery and preface cases, we consider a principle (call it the forward closure principle) that if one is justified in believing each of a set of propositions, then one is justified in believing their conjunction. However, consider a reverse principle: if one is justified in believing that a conjunction of propositions is false, then one is justified in disbelieving at least one particular conjunct (i.e., one is justified in believing that at least one particular proposition in the set is false). 

  First, explain whether rejecting the forward closure principle (as some do to resolve the paradoxes) commits one to also rejecting the reverse principle. Second, does the preface case rely on the reverse principle in a way that the lottery case does not? Third, in the engineering scenario, does the monitor's alert (which tells us that the conjunction of all replicas being correct is false) justify the engineer in disbelieving the output of at least one particular replica? Why or why not?

  **B3. Removing Independence** [8 marks; 20 minutes]
  Now suppose the replicas are not independent: because they share model weights and input batches, there is positive correlation between their failures. Specifically, if one replica fails, the conditional probability that another fails is increased. How does this affect the engineer's justification for believing of each individual replica that it was correct? And how does it affect the aggregate claim that at least one replica failed? In particular, does the positive correlation make the situation more like the lottery, more like the preface, or neither? Explain.

  **Model Answer**

  **Glossary**
  - **Justified belief**: A belief that is supported by evidence and reasons, making it rational to hold.
  - **Closure principle (forward)**: The principle that if one is justified in believing each of a set of propositions, then one is justified in believing their conjunction (i.e., that all are true).
  - **Closure principle (reverse)**: The principle that if one is justified in believing that a conjunction of propositions is false (i.e., that not all are true), then one is justified in disbelieving at least one particular conjunct (i.e., believing that at least one is false).
  - **Conjunction**: A compound proposition formed by combining two or more propositions with "and".
  - **Disbelieve**: To hold that a proposition is false.

  **Answer**

  **B1: Tension and Actionability**

  The engineer's situation resembles the lottery case in that for each replica, the probability of being correct is very high (0.999), just as the probability of a lottery ticket losing is very high. This high probability might justify the engineer in believing that each replica was correct. However, the monitor's alert (with high reliability) states that at least one replica failed, which is analogous to the lottery organizer's announcement that one ticket won. This creates tension: if the engineer is justified in believing each replica was correct, then by the forward closure principle, she would be justified in believing that all were correct. But the monitor's alert justifies her in believing that not all were correct (at least one failed). This is a contradiction, exactly like the lottery paradox.

  The situation also resembles the preface case: the engineer has good evidence for each replica's correctness (like the author for each claim) but also good evidence (the monitor) that at least one failed (like the author's preface). Thus, she is justified in believing that the conjunction of all replicas being correct is false.

  The engineer can act without identifying the failed replica by discarding the whole batch. This practical action does not resolve the epistemic tension. The tension arises from what the engineer is justified in believing, not what she can do. Even if she acts, she still faces the contradiction: she is justified in believing each replica was correct and also justified in believing that at least one was not. Acting without identification avoids the need to pinpoint which replica failed, but it does not change the fact that her beliefs are in tension. Therefore, the tension remains at the epistemic level; it is not relocated to action. The actionability only shows that in practice, we can avoid having to form a belief about which replica failed, but the conflict in justified beliefs remains.

  **B2: The Reverse Closure Principle**

  Rejecting the forward closure principle does not necessarily commit one to rejecting the reverse principle. The forward closure principle leads to the paradox by allowing us to move from justified belief in each conjunct to the conjunction. Rejecting it avoids the contradiction by blocking that move. The reverse principle, however, is different: it moves from justified belief in the negation of the conjunction to justified belief that at least one conjunct is false. This principle might be independently plausible. For example, if I know that not all the replicas were correct, then I should be justified in believing that at least one was incorrect, even if I don't know which. Rejecting the forward principle does not force rejection of the reverse because they are distinct.

  The preface case relies more on the reverse principle than the lottery does. In the preface, the author does not have any specific reason to doubt any particular claim; she only has a general reason (her fallibility) to believe that at least one claim is false. The reverse principle allows her to infer that there is at least one false claim. In the lottery, we have a specific reason to believe that one ticket will win (it's a fair lottery), so we don't need the reverse principle to justify that belief. Instead, we have independent evidence (the lottery setup) that one ticket wins. In the engineering scenario, the reverse principle is crucial: the monitor's alert tells us that the conjunction of all replicas being correct is false. Without the reverse principle, we might not be able to move from that to justified disbelief in at least one particular replica. However, in this scenario, the engineer has no reason to disbelieve any particular replica (just as in the preface). Therefore, the reverse principle is needed to justify the claim that at least one replica failed. But note: the monitor's alert already states that at least one failed, so the engineer is directly justified in believing that without the reverse principle. The reverse principle would be needed if we only had justification for the negation of the conjunction and then inferred that at least one is false. But here, the monitor directly provides justification for "at least one failed". Thus, in the engineering scenario, the reverse principle is not needed for that step. However, the reverse principle is still in play when we consider the connection between the negation of the conjunction and the disjunction of negations.

  In the engineering scenario, the monitor's alert justifies the engineer in believing that at least one replica failed. But does it justify her in disbelieving the output of a particular replica? No. She has no evidence to single out any replica. Therefore, she is justified in believing that at least one is wrong, but she is not justified in disbelieving any particular one. This is analogous to the preface: the author is justified in believing that at least one claim is false, but not in disbelieving any particular claim.

  **B3: Removing Independence**

  If the replicas are positively correlated (e.g., sharing model weights and input), then the independence assumption is violated. This affects the probabilities:

  - The probability that a particular replica is correct is still 0.999, so the engineer's justification for believing each replica was correct might be unchanged (if we base it on the individual failure rate).

  - However, the probability that at least one replica failed is no longer 1 - (0.999)^1000. It is higher because failures tend to occur together. Therefore, the event "at least one failure" becomes more likely.

  - The monitor's alert (with 99% reliability) still provides evidence that at least one failed, but the prior probability of at least one failure is now higher. This might strengthen the engineer's justification for believing the alert (if we consider the base rate).

  The situation becomes less like the lottery and more like the preface. In the lottery, tickets are independent, and the probability of a particular ticket losing is high, but the probability that at least one wins is 1. In the preface, the errors might be correlated (e.g., one mistaken assumption leads to multiple false claims). Here, with positive correlation, the failure of one replica makes others more likely to fail, so the single failure event might be less isolated. Also, the engineer's justification for believing each replica was correct might be undermined if she knows about the correlation, because if one is wrong, others are more likely to be wrong. However, if the correlation does not affect the marginal probability (each replica still has 0.999 probability of being correct), then the individual justification might remain.

  But note: without independence, the high probability for each replica does not guarantee that the probability of all being correct is high. In fact, with positive correlation, the probability of all being correct is lower than under independence. Therefore, the forward closure principle would lead to an even more problematic conclusion: the engineer is justified in believing each replica was correct, but the probability of the conjunction is lower, so it is even harder to justify the conjunction. This makes the tension more acute.

  The positive correlation also affects the aggregate claim: the monitor's alert is about at least one failure. Given the higher prior probability of at least one failure, the alert might be more expected and less surprising, but the reliability of the monitor remains 99%. The engineer still has strong evidence for the aggregate claim. However, the lack of independence does not change the fact that she has no evidence against any particular replica. The situation remains a hybrid: it has elements of both lottery and preface, but the correlation moves it towards the preface because the errors are not independent, just as the author's errors might be clustered.

  **Marking Scheme**

  Total: 25 marks

  **Part A: Background (3 marks)**
  - 3: Clear, accurate, and concise statement of both paradoxes.
  - 2: One paradox well explained, the other vague or incorrect.
  - 1: Both vague or incorrect.

  **Part B1: Tension and Actionability (6 marks)**
  Excellent (5-6): 
  - Clearly identifies resemblance to lottery (high individual probability, aggregate claim) and preface (each justified, but conjunction false).
  - Explains that actionability without identification does not resolve the epistemic tension because the conflict in justified beliefs remains.
  - Recognizes that the tension is epistemic and not relocated to action.

  Competent (3-4):
  - Identifies both resemblances but may be less clear on one.
  - States that actionability doesn't resolve the tension but doesn't fully explain why.
  - May confuse epistemic and practical.

  Weak (0-2):
  - Misses one or both resemblances.
  - Thinks actionability resolves the tension without argument.
  - Incoherent.

  **Part B2: Reverse Closure Principle (8 marks)**
  Excellent (7-8):
  - Explains that rejecting the forward closure does not commit to rejecting the reverse because they are distinct principles.
  - Correctly states that the preface case relies on the reverse principle (to justify the belief in at least one error without evidence against any particular claim) while the lottery does not (because the lottery setup independently justifies the aggregate claim).
  - In the engineering scenario, clearly states that the monitor's alert directly justifies the aggregate claim (so the reverse principle is not needed for that) but the engineer is not justified in disbelieving any particular replica.
  - Discusses the role of the reverse principle in the scenario appropriately.

  Competent (5-6):
  - Correct on the non-commitment of rejecting reverse when forward is rejected.
  - Somewhat correct on preface vs. lottery but may not be precise.
  - In the scenario, correctly states that the engineer is not justified in disbelieving any particular replica but may not handle the reverse principle well.

  Weak (0-4):
  - Fails to distinguish the principles.
  - Incorrectly assumes that rejecting forward requires rejecting reverse.
  - Misapplies to the scenario.

  **Part B3: Removing Independence (8 marks)**
  Excellent (7-8):
  - Explains that positive correlation increases the probability of at least one failure and decreases the probability of the conjunction being true.
  - States that the engineer's justification for each individual replica might be unchanged (if based on marginal probability) but the justification for the conjunction is weaker, making the forward closure even more problematic.
  - Notes that the situation becomes more like the preface (because of correlated errors) and less like the lottery (which assumes independence).
  - Discusses how the monitor's alert is still justified and the aggregate claim is even more probable.

  Competent (5-6):
  - Correctly states that the probability of at least one failure increases and the conjunction probability decreases.
  - Says it becomes more like the preface but without full explanation.
  - May not fully address the impact on justification.

  Weak (0-4):
  - Does not understand the impact of correlation.
  - Assumes independence still holds.
  - Incoherent.

  **Sophisticated-but-wrong moves (lose marks if used):**
  1. **Treating the scenario as a gambler's fallacy**: The gambler's fallacy is the belief that past independent events affect future ones. Here, the probabilities are fixed and known. (Cost: 2 marks. It shows confusion about the setup.)
  2. **Using expected utility to resolve the paradox**: The question is about justification of belief, not rational action. Acting on the alert may be rational, but that doesn't resolve the epistemic tension. (Cost: 2 marks. It confuses practical rationality with epistemic justification.)
  3. **Assuming that rejecting closure ends the matter**: Even if we reject the forward closure, we still have to address the reverse principle and the fact that we are justified in believing the aggregate claim. (Cost: 2 marks. It avoids the deeper engagement required.)
  4. **Arguing that the monitor's alert overrides individual beliefs**: This ignores the tension by prioritizing one belief. But the engineer still has strong evidence for each individual replica. (Cost: 2 marks. It fails to see the conflict.)

  **Instructor Note**

  - **Prior knowledge assumed**: Students should be familiar with the lottery and preface paradoxes at the level of a standard presentation (as in Part A). They should know the standard responses (reject closure, etc.) and basic probability (independence, conjunction). They do not need to know the reverse closure principle but should be able to reason about it.

  - **Handling competent but disagreeing answers**: If a student competently defends a conclusion that differs from the model answer (e.g., argues that actionability does resolve the tension), award marks for the quality of argument and engagement with the scenario, provided they address the specific sub-parts. The marking scheme should focus on reasoning, not the conclusion. For example, in B1, if they argue that the tension is relocated to action and do so well, they can get full marks for that part.

  - **Exam room announcements**:
    1. "This question is about the structure of justification, not about what the engineer should do. Focus on what the engineer is justified in believing, not on what action is best."
    2. "The forward closure principle is about moving from justification of each conjunct to the conjunction; the reverse is about moving from the negation of the conjunction to justification for at least one negation. Make sure you address both."
    3. "In the independence variant, remember that positive correlation means failures are more likely to occur together. Think about how that affects the probability of the conjunction and the disjunction."

  **Key Sentence in the Question**

  The single sentence doing the most work is in Part B2: "However, consider a reverse principle: if one is justified in believing that a conjunction of propositions is false, then one is justified in disbelieving at least one particular conjunct." This introduces the reverse principle and sets up the critical analysis.
