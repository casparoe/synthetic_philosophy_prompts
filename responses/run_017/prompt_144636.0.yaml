  ### 4. Instructor Note  
  **Prior knowledge assumed**: Students must recognize the lottery/preface paradoxes and standard responses (e.g., rejecting closure). Basic probability (e.g., independence, conjunction) is assumed. No familiarity with the reverse principle is expected—it’s introduced in the question.  

  **Handling competent but disagreeing answers**: Award full marks for well-defended alternative views if they:  
  - Engage deeply with the cruxes (e.g., in B1, arguing that action relocates tension with justification).  
  - Use the scenario rigorously (e.g., in B3, claiming correlation makes it more like the lottery due to shared randomness).  
  Do not penalize conclusions—evaluate reasoning, use of principles, and scenario application.  

  **Exam room announcements**:  
  1. "Focus on epistemic justification (what is rational to believe), not practical action. The failover protocol is context, not the core issue."  
  2. "The reverse closure principle is new—don’t assume it’s equivalent to the forward principle. Apply it to the scenario."  
  3. "In the correlation variant, think about how dependencies affect both individual and aggregate probabilities."  

