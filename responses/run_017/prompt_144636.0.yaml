  ### 3. Marking Scheme  
  **Total: 25 marks**  
  **Excellent (21–25 marks)**: Clear, precise, and philosophically nuanced; uses scenario to illuminate principles; anticipates objections.  
  **Competent (14–20 marks)**: Correct but less insightful; minor gaps in explanation or application.  
  **Weak (0–13 marks)**: Superficial, confused, or omits key elements.  

  **Part A (3 marks)**  
  - **3**: Accurate, concise summary of both paradoxes, highlighting closure.  
  - **2**: One paradox clear, the other vague/incorrect.  
  - **1/0**: Both vague or missing closure.  

  **B1 (6 marks)**  
  - **Excellent (5–6)**: Clear parallels to lottery and preface; argues tension remains epistemic with cogent justification.  
  - **Competent (3–4)**: Identifies both resemblances; states tension unchanged but with weak justification.  
  - **Weak (0–2)**: Misses one/both resemblances; thinks action resolves tension.  

  **B2 (8 marks)**  
  - **Excellent (7–8)**: Explains FC/RC independence; shows RC’s centrality to preface; correctly denies justification for disbelieving any particular replica in scenario.  
  - **Competent (5–6)**: Correct on FC/RC; partial on preface/lottery distinction; muddled on scenario application.  
  - **Weak (0–4)**: Assumes FC rejection implies RC rejection; misapplies RC to scenario.  

  **B3 (8 marks)**  
  - **Excellent (7–8)**: Explains weakened individual and strengthened aggregate justification; links correlation to preface via non-independence.  
  - **Competent (5–6)**: Correct on probability shifts; superficial on lottery/preface comparison.  
  - **Weak (0–4)**: Ignores impact of correlation; treats as identical to independent case.  

  **Sophisticated-but-wrong moves (lose 2 marks each; max 8 lost)**  
  1. **"This is just the gambler’s fallacy"**: Wrong because the gambler’s fallacy misapplies independence; here, probabilities are fixed and known. *Cost: Misreads scenario, avoids engagement.*  
  2. **"Expected utility justifies action, so beliefs are irrelevant"**: Wrong because the question is about epistemic justification, not pragmatic rationality. *Cost: Evades the core tension.*  
  3. **"Rejecting closure ends the paradox"**: Wrong because it doesn’t address the reverse principle or how the aggregate belief is justified. *Cost: Oversimplifies, ignores B2/iii.*  
  4. **"The monitor’s reliability overrides individual beliefs"**: Wrong because it ignores the conflict; high reliability doesn’t justify disbelief in a specific replica without evidence. *Cost: Fails B2/iii.*  

