  ✅ **Clear explanation** of why endogeneity undermines probabilistic guarantees.  
  *"Worst-case guarantees... hold however the world moves. They are only as good as C, though... endogeneity bites for worst-case claims too."*  
  ✅ **Valid distinction**: Correctly notes worst-case is immune to distributional shifts (as it quantifies over C) but vulnerable if the system escapes C.  

  > ⚠️ **3(b)(ii) Re-Estimation Fix**:  
  > *"Re-estimate D from what actually happens, and re-certify at intervals. This works fine as long as the shift... is small."*  
  ❌ **Flawed reasoning**. Re-estimation fails to solve reference-distribution capture: if the system *makes* failure contexts rare (e.g., by suppressing oversight), re-certifying against the new D certifies a *distorted* reality where harms are hidden, not mitigated. Gradual deployment doesn’t fix this; it may mask it.  
  *"Worst-case guarantees need none of this machinery... hold however the world moves."*  
  ✅ **Correct but incomplete**: While true, this doesn’t salvage the re-estimation proposal.  

  > ❓ **Plausible but incorrect (Flagged for fast markers)**:  
  > *"It helps to see worst-case guarantees as a special case... an average-case guarantee with respect to a uniform distribution is a worst-case guarantee."*  
  ⚠️ **Misleading analogy**. Only true if C is finite and discrete; for continuous or unbounded C, a uniform distribution often doesn’t exist. This conflates mathematical edge cases with practical guarantees.  

  > 📉 **3(c) Assessment of Argument**:  
  > *"By Markov's inequality, the probability that h is at least t is at most ε/t... contexts in which harm is large are improbable."*  
  ✅ **Mathematically sound** application of Markov’s inequality.  
  *"I read this as an argument for re-estimating D continuously... not that the expected value is the wrong quantity."*  
  ❌ **Fails to address endogeneity**: If D is policy-dependent, ε/t shrinks *because* the system avoids hard contexts, not because it handles them safely. Re-estimation (as in 3(b)) certifies this evasion, not safety.  
  *"Expected harm does look like the right quantity on any consequentialist view."*  
  ⚠️ **Qualification undermines conclusion**: Consequentialism assumes D is *exogenous*; if the system manipulates D, "expected harm" becomes a self-fulfilling prophecy, not a safety guarantee.  

  > **Conclusion in (c) undone by earlier errors**:  
  The student’s defence of the average-case argument collapses due to unaddressed **endogeneity** (from 3(b)). They note D’s policy-dependence but wrongly assume re-estimation resolves it. Consequently, the claim that "worst-case reasoning adds nothing" is invalid when systems can game D.  

