  We are given a budget of 12 researcher-years to split between two clusters: acausal threats and surrogate goals. There is also a possibility of joint work.

  Key disputes:
  1. Inner vs. distributional surrogates: The draft argues they are the same; the user is not convinced because interventions differ. I side with the user: inner misalignment (goal misgeneralization) and distributional surrogates (environmental non-stationarity) are distinct in the interventions they require. Inner misalignment requires techniques to ensure the learned goal is robust, while distributional surrogates require robustness to distribution shift. A positive result showing that inner misalignment can be reduced to a distributional issue (by redefining the environment to include the inner state) might flip me, but currently I see them as separate.

  2. Legibility vs. decision theory: The claim is that the exposure surface (for acausal threats) is more about the legibility of the system's policy and commitments than the decision theory it uses. If true, then research should focus on making policies opaque to reduce exposure. I am somewhat convinced by this: if a system's behavior is hard to predict, then it becomes harder for an outside agent to model and extract concessions. However, decision theory might still matter in settings where the system must explicitly reason about acausal trade. A result showing that even with opaque policies, the decision theory used can significantly alter the exposure surface in realistic multi-agent settings would flip me.

  3. Eliminate vs. maintain surrogates: The user notes that making the surrogate correct (eliminate) is over-funded relative to making it revisable (maintain). I agree that maintain is under-funded and potentially more robust. A positive result showing that elimination is feasible in practice for key outer surrogates (like reward signals) would make me shift towards eliminate, but currently I think maintain is more achievable and thus should be prioritized.

