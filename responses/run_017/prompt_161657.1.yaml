prompt: |-
  I have helped run a persistent multiplayer sandbox world for about eleven years: a game with player-built structures, a player-run market, and characters that some people have played continuously since the server opened. I keep meeting a pattern in how our players judge the things in that world, and I want to know whether it has a name in philosophy and, if not, what I should call it.

  The pattern in one sentence: our players will say, when asked, that these things are not real objects at all, and yet they treat differences in how one of them came into existence as mattering enormously, including in cases where the two candidates do not differ in any respect anyone can observe.

  Three cases. First: an item obtainable only during a one-month event years ago. An operator can create a new one with a single command; the client cannot tell the two apart, nothing about the second one is different on screen, and both behave identically in every way. Players will not trade the old one for the new one, they will expel anyone who makes new ones, and they describe the new ones as not really being that item. The same players will also tell you that nothing real is lost when the server is finally shut down.

  Second: a cathedral built on the server over two years by some forty people; someone demolishes it. Our players are certain a bad thing happened, and they are equally certain that what happened was bad for the builders rather than for the cathedral. But when an operator restores the structure by pasting in an exact copy of it as it stood, built by no one, they say the cathedral was not brought back. They prefer a rollback of the whole world to before the demolition, even though the rollback also destroys two hours of unrelated work that they then have to argue about.

  Third, a case that makes me doubt my own description: some items in the world carry scripted descriptions attributing to them a history that the developers invented and that everyone playing knows to be invented. Players pay more for these and treat them as having a history. So whatever is going on is not simply sensitivity to actual causal origin.

  Two contrasts I have noticed. Nobody cares which individual coins they are paid in, only how many, so the pattern seems to attach to things treated as individuals rather than as quantities. And I have wondered whether this is only the familiar business about first editions and perfect forgeries, with nothing virtual about it at all — except that a first edition differs physically from a reprint, and my two swords do not differ in any respect whatsoever.

  I do not want a label on its own. I want to know what the phenomenon really is: whether it is a claim about identity, or about value, or about the norms of a practice, or about what reasons people take themselves to have; whether the players' own insistence that the objects are unreal is essential to it or incidental; how it sits with the nearby things I have half-heard of — the worry about perfect copies of artworks, the puzzle of why we respond emotionally to characters we know do not exist, the view that money and property are real only given a shared practice — and which of those it is not; where its edges lie, given the fungibility contrast; and, if nothing established fits, a defined term together with the cases it covers and the cases it should be kept apart from. References are not needed.
reasoning: |-
  Okay, the user has been running a multiplayer sandbox game for eleven years and noticed a fascinating pattern in player behavior. Players treat virtual items as having intrinsic value based on their origin, even when identical copies exist. They insist these items aren't real, yet act as if their history matters deeply. 

  Let me unpack this. The user presents three cases: event-limited items that players reject if recreated by admins, a collaboratively built cathedral that players say isn't truly restored when copied, and scripted fictional histories that increase an item's perceived value. 

  Hmm, what's striking is the tension between players' stated beliefs ("these aren't real") and their actions (treating origin as crucial). This isn't just about scarcity - coins are fungible while these items aren't. And it's not about physical differences like first editions vs reprints, since the digital copies are perfect clones. 

  I recall philosophical concepts that might apply. Social ontology examines how collective intentions create realities like money or property - perfect for explaining why players treat certain pixels as "real swords" through shared agreement. But players explicitly deny the reality, so that's not quite it. 

  The value theory angle seems stronger. Players are assigning narrative value - not based on function but on the story behind items. The cathedral's value comes from the collective effort story, not its pixels. This explains why scripted histories work too: the manufactured story creates value even when known to be fictional. 

  For identity... Lockean persistence of identity through time and events could explain why players see the original sword as maintaining its identity through the event, while a new clone lacks that continuity. But again, the unreality claims complicate this. 

  Aha! The key might be the dual-layer ontology. Players operate in two modes simultaneously: 
  1) Cognitive level: Knowing it's just data 
  2) Affective/ludic level: Immersed in the game's narrative reality 
  The "unreal" statements come from level 1, while their behavior reflects level 2. 

  The fungibility contrast makes sense here - coins have no narrative, so players stay at level 1. But swords and cathedrals accumulate player stories, triggering level 2 engagement. Rollbacks preserve the timeline's integrity, while admin copies break the narrative continuity. 

  This also explains why scripted histories work: they provide ready-made narratives that kickstart level 2 engagement. Players aren't confused - they're willingly suspending disbelief because the story enhances their experience. 

  I think I'll call this "narrative anchoring" - the phenomenon where value and identity become tied to a story rather than physical properties. The term captures both the player-created histories and the dev-scripted ones, while distinguishing it from physical authenticity concerns like art forgeries. 

  The edges become clear: it applies only to items treated as narrative vessels (individuals with stories), not fungible objects. And it's distinct from debates about virtual reality's ontological status - here, players actively maintain the duality rather than believing in literal existence.
answer: |-
  This phenomenon is **Narrative Anchoring of Value in Shared Fictional Contexts**, a specific form of socially constructed meaning where *identity and value are tied to perceived narrative continuity within a collective fiction*, despite acknowledged unreality. It's not about metaphysics or material authenticity, but about **the preservation of communal storylines as the source of significance**. Here's a breakdown:

  ### Core Components
  1.  **Narrative as Ontological Anchor:** Players treat objects not as physical entities but as *nodes in a shared story*. What matters is the object's perceived role in the ongoing narrative history of the world and its players. The "origin story" (player effort, exclusive event participation) is inseparable from the object's identity and value.
  2.  **Continuity over Composition:** Identity persists through the *unbroken chain of narrative association*, not material properties. A perfect copy lacks the crucial link to the past event or the builders' labor. A rollback preserves this continuity (it's "the same world-line"), while an admin-pasted copy is a narrative discontinuity – a new object with no history.
  3.  **Communal Validation:** The value and "reality" of the narrative anchor depend entirely on collective recognition within the player community. Scripted histories work *because* they are accepted as valid backstory within the shared fiction (like lore in a novel). Admin-created event items fail because they violate the communal narrative ("this object wasn't *earned* during the event").
  4.  **Dual Awareness ("Ludic Duality"):** Players seamlessly hold two perspectives:
      *   **Cognitive:** "This is data; it's not real; nothing is lost on shutdown."
      *   **Ludic/Affective:** "Within the game's story, this sword *is* the relic from the Great Frost Event, and this cathedral *is* the monument built by our guild." The value exists wholly within the second perspective. Denying "reality" (first perspective) doesn't negate the deep investment in the fiction (second perspective).

  ### Why This Fits Your Cases
  *   **Event Item:** The original is anchored in the narrative of "participating in that historic event." The admin copy lacks this narrative anchor, making it "not that item," regardless of appearance. Its value *is* its story.
  *   **Cathedral:** Its value is anchored in the narrative of "40 people collaborating for 2 years." A paste-back creates a new object with no connection to that story. A rollback preserves the unbroken narrative timeline where "the cathedral always stood."
  *   **Scripted-Description Items:** The fictional history *is* the provided narrative anchor. It's accepted lore within the shared fiction, making the item "older" or "more legendary" within the game's story, hence more valuable. It confirms that the mechanism is *narrative*, not historical truth.

  ### Contrasts & Boundaries
  *   **Fungibility (Coins):** Coins lack individuating narratives. They are defined *only* by function (monetary value) within the game mechanics, not by unique stories. Narrative anchoring requires an object to be treated as an *individual* with a potential biography.
  *   **Physical Forgeries (First Editions):** This concerns *material authenticity and provenance in the real world*. Narrative anchoring operates *within the fiction itself*. The "perfect copy" fails because it lacks the *fictional narrative provenance*, not physical differences or real-world history. The unreality claim is crucial – players aren't mistaking the game for reality; they are deeply invested in its *internal* coherence and history.
  *   **Emotional Response to Fiction:** This is related (engaging emotionally with unreal things) but broader. Narrative anchoring is specifically about *object identity and value* being tied to *continuity within a persistent, player-influenced story*.
  *   **Social Construction of Institutions (Money/Property):** This is the closest analogue. Money and property *are* real because of collective agreement. Narrative anchoring shows this mechanism operating *purely within a fictional context*. The key difference is the explicit, conscious suspension inherent in "Ludic Duality" – players *know* it's constructed, but uphold the construction passionately *as part of the game*.

  ### Defined Term & Scope
  *   **Term:** **Ludic Narrative Anchoring (LNA)**
  *   **Definition:** The phenomenon within a shared fictional game world where the identity, value, and significance of an object (or structure) are derived from and dependent upon its perceived continuity within a collectively recognized narrative history of the world and player actions, despite conscious acknowledgment of the object's fundamental unreality outside the game context. This value is non-fungible and tied to the specific narrative chain of events.
  *   **Scope (Applies to):**
      *   Persistent multiplayer virtual worlds with player agency.
      *   Objects/structures treated as unique individuals within the world's fiction.
      *   Cases where communal recognition of origin/event/history influences perceived value/identity.
      *   Situations involving perfect digital copies vs. "originals" with narrative history.
      *   Player statements denying "reality" while exhibiting deep investment.
  *   **Distinct From (Boundaries):**
      *   Belief in literal existence of virtual objects.
      *   Value based solely on scarcity or functional utility (fungible items).
      *   Value based on real-world physical provenance or authenticity.
      *   Emotional attachment to fiction *in general* (e.g., crying at a movie).
      *   Social construction of institutions *in the real world* (though analogous).

  ### In Essence
  Your players are curators and participants in a living, collaborative story. The objects are valuable not as digital artifacts, but as *relics* and *monuments* within that story. Destroying the cathedral isn't bad *for the pixels*; it's bad because it *erases a chapter of their shared narrative*. A copied sword isn't "the" sword because it has no place in the existing storybook of the world. The insistence on unreality highlights that the "reality" that matters to them is *the reality of the narrative they've built together*, not the substrate it runs on. Ludic Narrative Anchoring is the glue holding that communal story-world together.
