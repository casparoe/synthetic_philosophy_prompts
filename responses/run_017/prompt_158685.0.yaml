  ## Sestina: Channel Indifference  
  *(After a Thought Experiment)*  

  This city's light arrives without a **Houston**,  
  just Berkeley fog condensing on the pane.  
  No glass between the mind and wet street’s **vat**  
  of asphalt. Thought extends a body’s **hand**  
  to brush the brick, receives a pressure **signal**  
  confirmed along the insulated **nerve**.  

  A twitch, a step: command becomes a **nerve**  
  impulse dispatched, no need to hail **Houston**  
  for clearance. Vision holds a steady **signal**:  
  a bus stop bench beneath a Berkeley  
  laurel. The heel comes down. The other **hand**  
  reaches to steady. Nothing hints the **vat**  

  is monitoring the feed. This skull’s a **vat**?  
  The notion sparks no sympathetic **nerve**  
  reaction. Here is pavement. Here’s my **hand**  
  grasping a railing, cold. Forget **Houston**  
  and its sterile tanks. This is Berkeley—  
  touch authentic, raw, the purest **signal**.  

  But channels shift. The eye receives a **signal**  
  showing a bridge (not here). The mind’s dark **vat**  
  accepts the streaming view: still Berkeley?  
  The wires don't flinch. No altered **nerve**  
  reports the substitution. **Houston**  
  just routes the source. I watch my own **hand**  

  lift in greeting. That, at least, my **hand**,  
  obeys the output stream. Its wave’s a **signal**  
  sent back along the chain. Does **Houston**  
  register the gesture? From its **vat**,  
  does it decode the motor **nerve**'s  
  familiar pulse? The fog feels Berkeley-  

  damp. The heel grinds grit. This Berkeley  
  grounding feels unbroken. Then the **hand**  
  meets air where warmth should be. A faulty **nerve**?  
  Or just a lag? The feed remains a **signal**,  
  bright and full. They say the eyes aren't mine. **Vat**-  
  fed sights now show Marseilles. But **Houston**  

  says the shift means nothing. **Nerve**  
  impulses still command my **hand** in Berkeley.  
  **Signal** and source: the **vat**. The rest is **Houston**.

  ---

  **Brief Note on Structure:**  

  *   **The Turn:** The definitive turn occurs in Line 25, the first line of Stanza 5 ("They say the eyes aren't mine."). This is the explicit moment where the speaker is informed of the sensory rerouting, shifting the poem from pure phenomenological description to a confrontation with the reported truth about the signal's origin. The experiential continuity described before this line clashes with this new information, embodying the core tension of the thought experiment.  
  *   **Envoi Pairings & Justification:** The envoi pairs **Berkeley** with **hand**, **Houston** with **nerve**, and **vat** with **signal**. This pairing was earned through the poem's development:  
      *   **Berkeley/hand:** Berkeley is consistently the locus of *embodied action* ("This city's light," "brush the brick," "cold," "heel comes down," "grasping," "wave," "heel grinds grit," "my hand in Berkeley"). The hand is the primary agent and sensor in that physical space, making this the most concrete, unambiguous link between place and embodied reality.  
      *   **Houston/nerve:** Houston emerges as the implied *control center* ("dispatched," "monitoring," "routes the source," "register," "decodes"). The nerve is the conduit for *command and control* ("command becomes," "motor nerve's familiar pulse," "nerve impulses still command"). This pairing emphasizes Houston's functional role in generating the signals that initiate action.  
      *   **Vat/signal:** The vat is the *origin point* or *container* for the sensory stream ("mind's dark vat," "vat-fed sights"). The signal is the *content* or *transmission* itself ("Vision holds," "eye receives," "streaming view," "feed remains"). This pairing highlights the core mechanism of the experiment – the vat as the source, the signal as the indifferent carrier of experience regardless of origin.  
      This arrangement avoids simply putting places with non-places; instead, it binds each location word to the functional non-location word most consistently associated with it throughout the preceding stanzas, reinforcing the poem's central dynamic of distributed function masking the question of location.
