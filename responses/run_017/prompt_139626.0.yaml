  The professor's core insight is a "squeeze" argument: PII loses its anti-substantivalist force if space is real (since locations distinguish spheres) but becomes vulnerable to counterexamples if space isn't real. They also want a novel second case—successive spheres across time—to test if temporal analogues change the analysis.

  Key needs for the question:
  - Must require understanding how Black's case affects PII's historical role against substantivalism
  - Cannot be answered by just listing standard replies (haecceities, relational properties, etc.) without evaluating them
  - Should reward discussing: metaphysical vs. epistemic possibility, bundle theory implications, necessity of PII
  - Needs to integrate the new "successive spheres" case to probe temporal distinctions

  For the exam design:
  - Question should mask the squeeze structure so unprepared students can't pattern-match
  - Model answer (800 words) must demonstrate A-level mastery: diagnosing the squeeze, handling both cases, evaluating replies
  - Marking scheme (out of 25) needs clear must-hit points like:
    - Recognizing PII's anti-substantivalist purpose (4 pts)
    - Explaining the squeeze (5 pts)
    - Analyzing successive spheres' differences (4 pts)
  - B-level answer description for consistency: partial squeeze analysis but weaker on temporal case or necessity

  The successive spheres innovation is clever—it tests whether temporal and spatial cases are symmetrical. Key nuances:
  - Does "same location at different times" count as discernible? (Trivializes PII if so)
  - Might involve persistence conditions (is it one sphere or two?)
  - Could reframe as a transworld identity question ("could the first sphere have been the second?")

  Professor clearly wants students to see metaphysics as live dialectic, not settled doctrine. Their frustration with "C-grade recitations" suggests valuing original analysis over textbook answers.
answer: |-
  Here is the complete exam package as requested, designed to reward deep engagement with the dialectical tension surrounding the Identity of Indiscernibles (PII) and the novel successive spheres case.

  ---

  ### Exam Question (as provided to students)

  **Question 1 (50 points total):**  
  Critically evaluate Max Black’s two-spheres argument against the Identity of Indiscernibles. Your analysis must accomplish two tasks:  

  *(a)* Explain whether Black’s case decisively refutes PII, considering how different metaphysical commitments (e.g., about space, individuation, or possibility) might alter the outcome. (25 points)  

  *(b)* Now consider a modified scenario: Imagine a perfectly homogeneous, unchanging sphere exists for one million years in an otherwise empty universe, is annihilated, and after another million years, a qualitatively identical sphere comes into existence in the same location. Call this the "Successive Spheres" case. Does this scenario challenge PII in the same way, or differently, than Black’s case? Justify your answer with reference to the resources typically used to defend PII. (25 points)  

  *Word limit per answer: 1,200 words total for both parts. Focus on precision, argumentative rigor, and awareness of dialectical context.*

  ---

  ### Model Answer (Strong A Response, ~800 words)  
  **Part (a):** Black’s two-spheres case appears to refute PII by describing two qualitatively identical spheres in symmetric space, differing only in their numerical distinctness. Superficially, this seems fatal to PII. However, the dialectical force of the case depends critically on unresolved metaphysical debates, notably regarding *substantivalism about space*.  

  PII was historically weaponized by Leibniz (against Clarke) to reject substantivalism: if space were a container of bare positions, God could create two worlds differing only in the absolute location of all matter. Since these worlds are indiscernible, PII would deem them identical—contradicting substantivalism’s claim that distinct global arrangements are possible. Black’s case, ironically, undermines this anti-substantivalist project. If space *is* substantival, the spheres occupy distinct regions, making them discernible by relational properties (e.g., *being 2 miles from region R1* vs. *R2*). Thus, PII survives, but only in a "weak" form that permits discernibility via spatial relations. This weak PII, however, *cannot* condemn the shifted worlds, as substantivalism allows them to differ spatiostructurally. Conversely, if space is *not* substantival, the spheres share all relational properties (e.g., each is 2 miles from another sphere). Here, PII seems falsified, as no property distinguishes them.  

  This creates a **dialectical squeeze**: PII is preserved only when weakened to allow spatial discernibility, but this rescues substantivalism—the very position PII was meant to defeat. Standard replies face this tension. Haecceities (primitive "thisness") save PII trivially but abandon its anti-haecceitist motivation. Denying the possibility of the scenario (a Leibnizian move) preserves PII’s necessity but at the cost of modal flexibility. Relational properties (e.g., *being identical to A*) are question-begging. Crucially, Black’s victory is not merely about PII’s *truth* but its *modal strength* and *explanatory power*: it exposes that PII cannot be both necessarily true and robustly anti-substantivalist. Bundle theorists face particular pressure, as the case suggests primitive individuation is needed where no properties differ.  

  **Part (b):** The Successive Spheres case challenges PII differently by shifting focus from synchronic to diachronic individuation. PII is typically formulated for coexisting entities, but if extended diachronically, the spheres seem indiscernible: same intrinsic properties, same location (if space is absolute), and no temporal relations connect them (e.g., neither is before/after the other *in their existence periods*). Yet they are numerically distinct.  

  Replies to Black fare unevenly here. *Spatial discernibility* is irrelevant if both spheres occupy the same region (R1) at different times—unless we trivialize PII by treating *occupying R1 at t1* and *occupying R1 at t2* as distinct properties. This rescues PII but at the cost of making it vacuously true (any two entities differ temporally). *Haecceities* still work but remain ontologically profligate. *Denying possibility* is harder here: successive existence seems more plausible than perfect synchronic symmetry. Crucially, the case highlights that PII’s core vulnerability concerns *transtemporal identity*: what grounds the claim that the second sphere is *not* the first, resurrected? If persistence requires continuity (e.g., spatiotemporal or causal), the spheres *are* discernible by their historical properties (e.g., *existing only at t1* vs. *t2*), but this presupposes a solution to diachronic identity. If persistence is not required, the case becomes a challenge to transworld identity: "Could the first sphere have *been* the second?"—a question PII cannot resolve.  

  Ultimately, the temporal case reveals that PII’s weaknesses are not unique to spatial symmetries. It underscores that numerical diversity without qualitative difference is conceivable diachronically, forcing proponents to either accept haecceities, endorse a deflationary PII, or impose controversial constraints on individuation (e.g., causal continuity). The victory against PII in both cases is not about its falsity *simpliciter*, but its inability to secure *qualitative grounding for individuation* without compromising its historical aims or modal scope.

  ---

  ### Marking Scheme (Total: 25 points per part)  
  **Part (a) Must-Hit Points (Max 25):**  
  1. **PII’s anti-substantivalist role** (4 pts): Explains Leibniz’s shifted-worlds argument. *Common miss: Omits historical context or misstates Leibniz’s goal.*  
  2. **The squeeze** (5 pts): Shows PII can be saved only if weakened (allowing spatial discernibility), undermining anti-substantivalism; OR falsified if space is relational. *Common miss: Claims Black "refutes PII" without addressing substantivalism’s impact.*  
  3. **Evaluation of replies** (5 pts): Notes haecceities/relational properties trivialize PII; denying possibility avoids counterexample but sacrifices modal flexibility. *Common miss: Lists replies without analyzing their dialectical costs.*  
  4. **Bundle theory & necessity** (4 pts): Links to bundle theory’s troubles; notes issue is PII’s *necessity* or *explanatory power*, not just truth. *Common miss: Treats possibility as purely epistemic.*  
  5. **Synthesis** (4 pts): Concludes Black exposes tension between PII’s strength and utility. *Common miss: Ends with "PII is false" without nuance.*  
  6. **Clarity/Structure** (3 pts): Logical flow, concision.  

  **Part (b) Must-Hit Points (Max 25):**  
  1. **Key difference** (5 pts): Successive spheres lack synchronic relations; challenge is diachronic. *Common miss: Treats it identically to Black’s case.*  
  2. **Spatial reply’s inadequacy** (4 pts): Same location makes spatial discernibility irrelevant unless temporalized (risking triviality). *Common miss: Assumes spheres occupy different locations.*  
  3. **Haecceities/possibility** (4 pts): Haecceities work but are ad hoc; denying possibility is less plausible than in Black. *Common miss: Doesn’t compare viability of replies across cases.*  
  4. **Transtemporal identity** (5 pts): Identifies the core issue—grounds for denying the second sphere is the first resurrected. *Common miss: Ignores persistence conditions.*  
  5. **Diachronic vs. transworld** (4 pts): Notes case could reframe as "could the first be the second?" implicating transworld identity. *Common miss: Stays solely focused on numerical diversity at times.*  
  6. **Synthesis** (3 pts): Shows temporal case broadens PII’s vulnerability beyond spatial symmetry.  

  ---

  ### What a Solid B Answer Looks Like  
  A B answer (scoring ~16–20/25 per part) would:  
  - **Part (a):** Correctly summarize Black’s case and the substantivalism-relationalism debate, but might not fully articulate the "squeeze." It would mention haecceities or relational properties as replies but not deeply analyze their costs. Likely notes bundle theory’s challenge but undersells modal stakes.  
  - **Part (b):** Recognizes the successive spheres as distinct from Black’s case and discusses temporal indiscernibility, but may not probe transtemporal identity or trivialization risks. Compares *some* replies (e.g., "locations differ by time") without dissecting why temporal properties might weaken PII.  
  - **Overall:** Hits major points competently but lacks the model answer’s dialectical finesse. May treat the two cases as parallel challenges without illuminating how time reshapes the problem.  

  **Key B/C boundary:** A C answer (e.g., "Black proved PII false") would ignore substantivalism, treat replies uncritically, and conflate the two cases. A B answer engages the metaphysics but misses nuances of the squeeze or diachronicity.  

  ---  
  **Notes for TA Consistency**  
  - **Reward dialectical awareness:** Even imperfect attempts to grapple with "what’s at stake for PII’s viability" merit credit.  
  - **Penalize recitation:** Answers listing haecceities/relational properties without evaluating their role in the squeeze or trivialization risk should not score above B-range.  
  - **American English enforced:** E.g., "analyze" not "analyse," "color" not "colour."  
  - **Word limit stricture:** Answers exceeding 1,200 words lose 3 points automatically.  

  This design ensures A answers must confront the meta-philosophical tension in PII’s defense while using the novel case to test adaptability of standard moves.
