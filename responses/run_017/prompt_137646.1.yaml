prompt: |-
  I've been handed the "do we use the word" memo at my NGO for six months while my colleague is on leave — she's the one who's written every version of it for years, and whenever some new atrocity blows up, comms ask her whether we call it genocide or something blander. I've got her old memos and I'm trying to reverse-engineer what she's actually running, because a new one landed on my desk yesterday and I genuinely can't tell which way she'd go. Her record (legal verdict first, then whether she'd say it in our public comms):

  - Herero and Nama in German South West Africa, 1904–08: yes, and yes publicly, even though there's nobody left to charge.
  - Armenia 1915: yes.
  - Holodomor: no — her line was that starving peasants as a class isn't destroying a protected group as such, and that the convention's exclusion of political and economic groups is a defect in the convention, not a reason to stretch it.
  - Cambodia under the Khmer Rouge: yes for the Cham, no for everyone else, including the "new people" killed as suspected class enemies.
  - Bosnia: yes at Srebrenica, no for Prijedor, no for the expulsion campaign generally — she wrote somewhere that if you let people survive somewhere else you haven't tried to destroy them.
  - Forced removal of Indigenous children in Canada: cultural genocide, and no on genocide, with a foot-stamp that this is exactly where the legal and the moral verdict come apart.
  - Biafra: no. Indonesia 1965–66: no (political group again).
  - Darfur: yes, loudly, even though the UN commission of inquiry that looked into it stopped short of finding genocidal intent.
  - Yazidis: yes. Rohingya: yes.

  The one on my desk: the state of Kavaria has spent about seven years on what it calls a deradicalisation and integration programme in its southern province of Leth, aimed at the Surni, an ethnoreligious minority of roughly 1.8 million, about a quarter of whom live in Leth, which is also where most of their shrines, endowments and religious schools are. Every Surni religious institution has been closed or demolished; the language is banned in schools and courts; public ritual is criminalised; around 40,000 children have been removed to boarding schools in the north and placed with majority families, raised in the majority religion and language (which, as far as I can tell, is literally one of the acts enumerated in Article II, which is what makes me doubt she'd just say no). Roughly 3,000 people are dead, mostly in resettlement camps and in riots where the police stood by; no death lists have turned up, no extermination campaign, and the government warns before it bulldozes. There is a real Surni separatist insurgency in Leth that killed several hundred civilians before any of this started, and the state insists the Surni aren't a group at all but a heretical sect of the majority religion — so whether they're a protected group seems to depend on whether you take the perpetrator's classification or theirs. There's one leaked interior ministry document about the Surni question being solved within a generation.

  So: would she call it genocide? I was arguing about this with my flatmate last night, who thinks the whole exercise is just about triggering the convention's prevention duty and nothing else — but that makes Darfur easy and doesn't explain why she said yes on the Herero or no on Indonesia. As I see it there are at least three rules in play: a strict convention one where "destroy" means physical or biological destruction and political groups are out; something closer to what Lemkin seems to have meant, where wrecking a group's institutions, language and children is the central case rather than a marginal one; and a straight political one where the label goes on when it does work and comes off when it doesn't. What I'd love from you: which of those (or what fourth thing) actually fits all of her old memos, since I don't think any of them fits cleanly; what each surviving rule predicts about Kavaria, separating the legal verdict from the moral one from the comms decision, and dealing properly with the "in part" question (a quarter of the group in one province, but the province that holds most of their institutions) and with the fact that the deaths are mostly from neglect rather than killing; whether the residential-schools memo is really the closest analogue or whether that's a trap, given she said no there; and if the rules do come apart on this case, what further case I'd need to see to know which one she's really running. I'll write the memo either way, I just want to know which principle I'd be commiting us to.
reasoning: |-
  Okay, the user is handling a memo at their NGO about whether to label a situation as genocide, stepping in for a colleague. They've shared the colleague's past decisions on various historical events and now face a new case involving the Surni minority in Kavaria. The user is trying to reverse-engineer the colleague's reasoning to stay consistent. They need help figuring out which framework the colleague uses—strict legal, Lemkin's broader view, political pragmatism, or something else.

  First, I need to analyze the colleague's past decisions to find patterns. Let's list the cases and her verdicts:

  - Herero/Nama: Yes. Legal and public. Even though no one left to charge, she still called it genocide. This suggests she might not require ongoing legal proceedings.
  - Armenia: Yes. Standard genocide recognition.
  - Holodomor: No. Her reasoning was that targeting peasants as a class isn't a protected group under the convention. She pointed out the convention's exclusion of political/economic groups as a flaw, not a reason to stretch the definition.
  - Cambodia: Yes for the Cham (ethnic/religious group), but no for "new people" (class-based). This reinforces her strict adherence to protected groups—only national, ethnic, racial, or religious.
  - Bosnia: Yes at Srebrenica (mass killing of Bosniaks), but no for Prijedor and expulsion campaigns. Her note that allowing survival elsewhere means no intent to destroy the group indicates a focus on specific intent for physical destruction.
  - Canadian Residential Schools: Cultural genocide but not legal genocide. She emphasized the separation between legal and moral judgments here.
  - Biafra and Indonesia: No. Both involved political groups, again sticking to the convention's exclusions.
  - Darfur: Yes, despite the UN not finding genocidal intent. This is interesting because she went against the UN commission. Why? Maybe she saw strong evidence of intent or considered the scale sufficient.
  - Yazidis and Rohingya: Yes. Both clear cases targeting ethnic/religious groups.

  Looking at these, a pattern emerges. She strictly follows the Genocide Convention's definition: protected groups are only national, ethnic, racial, or religious. Political/economic groups are excluded. For intent, she requires specific intent to physically destroy the group. In Darfur, she might have prioritized evidence over the UN's conclusion, suggesting she's not bound by external bodies if internal evidence is strong.

  Now, applying this to the Kavaria case:

  - The Surni are an ethnoreligious minority, which qualifies as a protected group. The government claims they're a heretical sect, but under the convention, self-identification matters. So protected group: yes.
  - Acts: Destroying institutions, banning language, removing children to boarding schools. Article II includes causing serious bodily or mental harm, imposing measures to prevent births, and forcibly transferring children. Removing children falls under (e). Demolishing religious sites and banning language could be seen as causing mental harm under (b).
  - Intent: The leaked document mentioning "solving the Surni question within a generation" suggests a plan to eliminate the group. Combined with systemic actions, this indicates specific intent.
  - "In part": The convention applies to partial destruction. Leth province has 25% of Surni but most of their institutions. Destroying the group there could be seen as partial destruction of the whole.
  - Deaths: 3,000 deaths from neglect/riots. But genocide doesn't require mass killing; other acts like child transfer suffice. The forced assimilation through schools aligns with (e).

  Comparing to past cases:
  - Canadian Residential Schools: She said no because it was cultural destruction without intent to physically destroy. In Kavaria, the child transfers are part of a broader pattern including closing institutions and deaths, which might tip it towards genocide.
  - Holodomor: Targeted a class, not protected group. Here, Surni are protected.
  - Bosnia expulsions: Survival elsewhere negated intent. But in Kavaria, the measures aim to erase identity, not just displace. The leaked document shows intent to eliminate the group.

  So, her likely verdict: Genocide. Legally, it meets the criteria—protected group, enumerated acts, specific intent to destroy in part. Morally, the cultural destruction and child transfers are severe. For comms, she might say yes publicly, similar to Darfur, where she overruled the UN.

  The user’s deeper need is to maintain consistency with the colleague's framework to avoid setting a new precedent. They also need to navigate the legal vs. moral distinction, especially since the colleague separated them in Canada's case. Ensuring the memo doesn’t commit the NGO to a broader definition than before is crucial.
answer: |-
  Based on your colleague's pattern of decisions, she operates under **a modified strict-legal framework** that prioritizes the Genocide Convention's *specific intent* requirement and *protected group* definition—but with a critical nuance around what constitutes "destruction" and evidentiary thresholds. Here's how it breaks down:

  ### Her Core Principles (Reverse-Engineered)
  1. **Protected Group Rigidity**: She strictly limits genocide to *national, ethnic, racial, or religious groups*. Political/economic groups are excluded per the Convention (Holodomor, Cambodia "new people," Indonesia).  
  2. **"Destroy" = Physical/Biological Destruction**: She interprets "intent to destroy" as **physical elimination or biological extinguishment** of the group. Cultural destruction alone isn't genocide unless it enables physical destruction (Canadian residential schools = "no"; Bosnia expulsions = "no" because survival was possible).  
  3. **Intent Threshold**: Requires **direct evidence of specific intent** (leaked documents, explicit policies, systematic killing campaigns). In Darfur, she likely saw such evidence despite the UN's caution; in Prijedor, she didn't.  
  4. **"In Part" Application**: Destruction of a *substantive part* of the group (geographically or demographically) suffices if it threatens the group's survival *as a whole* (Srebrenica targeted Bosniak men to cripple community reproduction).  
  5. **Moral vs. Legal Separation**: She openly distinguishes legal genocide from moral horror (e.g., Canada), reserving the legal term for courtroom-admissible evidence.  
  6. **Comms Pragmatism**: She *will* use "genocide" publicly if the legal threshold is met *and* it advances advocacy (Herero, Darfur), but won't stretch the term for political effect (Biafra, Indonesia).  

  ### Analysis of Kavaria Against Her Framework
  | **Element**       | **Legal Verdict (Her Framework)** | **Moral Verdict** | **Comms Recommendation** |
  |-------------------|-----------------------------------|-------------------|--------------------------|
  | **Protected Group** | **YES**. Surni are ethnoreligious; perpetrator denial is irrelevant (see Rohingya). Her Bosnia/Yazidi decisions show she rejects state reclassification. | Clear violation | Strong case for naming |
  | **Enumerated Acts** | **PARTIAL**. Child transfers (Art II(e)) *are* genocide *if* intent is proven. Language bans/ritual criminalization = cultural destruction (not genocide alone). Demolitions/deaths from neglect ≠ Art II(a) killing without proven intent. | Atrocity crimes | Highlight child transfers as core issue |
  | **Intent to Destroy** | **KEY UNCERTAINTY**. Leaked document ("solved within a generation") + child transfers suggest biological destruction intent. But: no death lists, warnings before demolitions, and insurgency context could indicate "mere" repression. **Her Darfur precedent suggests she'd weigh the leak heavily.** | Likely genocidal | Leak is critical evidence |
  | **"In Part" Scope** | **YES**. Targeting Leth (25% of Surni) destroys the group's *core institutions* (shrines, schools). Analogous to Srebrenica targeting reproductive capacity. | Clear | Emphasize institutional annihilation |
  | **Overall Legal Verdict** | **LEANING YES**. Child transfers + leaked doc meet Art II(e) + intent. But deaths alone wouldn't suffice (per Holodomor). | Crime against humanity | — |

  ### Why the Canadian Residential Schools Analogy is Misleading (and a Trap)
  She said "no" in Canada because:  
  - Cultural destruction ≠ genocide under her strict physical-destruction reading.  
  - No evidence of intent to *physically eliminate* Indigenous people (vs. assimilate).  
  - **Kavaria differs critically**: The leaked "solution within a generation" doc + child transfers to majority families **explicitly align with biological destruction** (Art II(e)). This meets her intent threshold like Darfur.  

  ### What Would Resolve Ambiguity? 
  Her rule would crystallize with **one more piece of evidence**:  
  - **If you found orders to sterilize Surni women or ban marriages** → definite "yes" (biological destruction).  
  - **If child transfers were framed as "temporary security measures"** → possible "no" (like Bosnia expulsions).  

  ### Your Memo Recommendation  
  **Legal Verdict**: **Genocide** (based on child transfers + leaked doc + targeting group's reproductive future).  
  **Moral Verdict**: **Genocide** (systematic ethnoreligious erasure).  
  **Comms Decision**: **YES, publicly**. This aligns with her Darfur/Rohingya precedent: when legal threshold is met *and* advocacy impact is high (which it is here).  

  ### The Principle You'd Commit To
  You'd reinforce her core framework: **Genocide requires proven intent to physically/ biologically destroy a protected group, with cultural destruction as supporting evidence but never sufficient alone.** Kavaria fits because:  
  - Child transfers + "solution" leak show biological destruction intent.  
  - Surni are a protected group.  
  - Leth's destruction threatens the whole group.  

  This maintains consistency with her "no" on Canada (no physical intent), "no" on Holodomor (wrong group), and "yes" on Darfur (leaked evidence overrides UN caution).  

  *Final note: Your flatmate is half-right—the prevention duty matters, but your colleague treats the legal definition as sacrosanct. Stretching it dilutes utility in courts (hence her foot-stamp on Canada).*
