prompt: |-
  I convene a small discussion group that meets monthly in the back room of a public library: eight to twelve adults, no formal philosophy among them — two engineers, a nurse, a retired accountant, and a few who come because they practise mindfulness and are drawn to the idea of living in the present. No slides, one whiteboard, seventy-five minutes. In three weeks it is my turn to lead the session, and I have chosen the question of whether only the present exists: presentism against the block universe. I have been turning this over on my own for a couple of years with no training in the subject, so I am not asking for the debate to be explained to me. I am asking for a plan for putting it in front of this particular group.

  Specifically, I would like the following.

  First, the order in which the components have to be introduced, and what each one depends on. I take it that something has to be in place before the question is even intelligible as a disagreement — in particular that "the present is objectively special" is a substantive claim about the world rather than a truism everyone already accepts, and that this is not a dispute physics can simply adjudicate, though the engineers will try to make it one. Tell me what must come before what, and why the sequence cannot be permuted.

  Second, one scenario or example to carry the whole session, with an account of what such an example must have and must lack. It must not invite the engineers to settle everything by appeal to relativity; it must not make fatalism feel built in from the start; and it has to make the denial of an objective, mind-independent "now" feel like something a sane person could mean rather than a piece of stage mysticism. Give reasons for rejecting the candidates I have been toying with — a distant star whose light is only now reaching us, a live broadcast versus a recording watched a week later, or a game world in which every level sits on the disc whether or not anyone is playing it.

  Third, the misconceptions this group will predictably bring or form, in the order they will surface, and the exact point in the sequence to head each off. My guesses: that presentism is just common sense, so the entire burden of argument falls on the eternalist; that if all times are equally real then the future is already fixed and deliberation is pointless; that eternalism implies a dead relative is still alive somewhere in the block; that the dispute is really about whether time is an illusion; that because "block universe" is only a metaphor the whole thing is verbal; and a slide from "only the present is real" to "only the present matters." Correct me where I have misdiagnosed the group.

  Fourth, two wrinkles of my own that I cannot place. One: I have been wondering whether the present must be a durationless knife-edge, or whether it could be as thick as the short stretch of time one seems to be directly aware of — a second or so — and I genuinely cannot tell whether that remains a version of presentism or quietly turns into the growing-block picture. Where, if anywhere, does that belong, and will it clarify or muddy things for this audience? Two: it strikes me that the problem of how to state truths about the past is a different problem from the problem of what exists, and I do not know whether to introduce that distinction early, as a tool the group can use, or late, as a tidy-up. Advise me.

  Fifth, how I will know it has landed. The group will certainly ask how anyone could ever tell which side is right, and I would rather harness that than deflect it. Give me a closing question or two — perhaps asking them to say what kind of finding would count as evidence for one side or the other — whose answers would show me they have hold of the disagreement rather than merely the two labels.

  Finally, what I should openly decline to cover at this level, and how to say so without making the session feel evasive.
