  - Exploitability as symptom not ground  
  - Linearity of utility assumption  
  - Practical immunity via updating delays
answer: |-
  Here’s a streamlined 90-minute plan focused on hands-on exploitation, with debrief bullets. **Total words: 850.**

  ---

  ### **Materials**  
  - **Proposition menu** (displayed throughout):  
    - Synchronic: (1) Coin lands heads (stake: 100 pts)  
    - Synchronic: (2) Die roll ≤ 3 (stake: 100 pts)  
    - Synchronic (hard): (3) "587 is prime" (stake: 100 pts; truth unknown to all)  
    - Diachronic: Partition {A, B, C} (e.g., card suit drawn from ♠/♥/♣; stake: 100 pts).  
  - Envelopes for diachronic round (1/student, pre-filled with a partition cell).  
  - Scoreboard (points start at 0 for all).  
  - Prize: Book token for top scorer + "top bookie."  

  ---

  ### **Rules & Payoffs**  
  - **Students (traders):** For each proposition, post **one price** \( p \) (0–1) at which they’ll **buy OR sell** a ticket paying stake \( S \) if true. *Example: Post \( p = 0.4 \) for "Die ≤ 3": sell at 40 pts (pay 40, owe 100 if true) or buy at 40 pts (pay 40, gain 100 if true).*  
  - **Bookies (rotating pairs):** Can demand any student trade at their posted price (buy/sell any ticket). Combine bets into a package. **Goal:** Ensure the package loses \( \geq 10 \) pts for the student *no matter the outcome*.  
  - **Scoring:** Students gain/lose pts from trades. Bookies gain the pts lost by exploited students.  
  - **Diachronic round:**  
    1. Students pre-commit prices for \( P(\text{Heads} | A) \), \( P(\text{Heads} | B) \), \( P(\text{Heads} | C) \) (e.g., if told suit is ♠, what’s fair price for heads?).  
    2. Bookies trade against pre-commitments.  
    3. Envelopes opened; students post live prices for heads.  
    4. Bookies trade against discrepancies vs. pre-commitments.  

  ---

  ### **Timeline**  
  | Time  | Activity                                                                 |  
  |-------|--------------------------------------------------------------------------|  
  | 0–10  | Intro: Explain rules, stakes, prizes. Emphasize "one price = two-way trade." |  
  | 10–25 | **Synchronic round 1:** Students post prices for (1) and (2). Bookies (2 volunteers) build exploiting package. Repeat with new bookies. |  
  | 25–30 | **Spread variation:** Students post bid (buy) and ask (sell) for (1). Bookies exploit sequentially (show loss isn’t guaranteed in one package). |  
  | 30–35 | **Hard proposition:** Students post price for (3). Bookies exploit (using fact that \( p \) ≠ 0 or 1; actual truth irrelevant). |  
  | 35–50 | **Diachronic round:** Pre-commit prices for \( P(\text{Heads} | \text{partition}) \). Bookies trade. Envelopes opened. Live prices posted. Bookies trade vs. pre-commitments. |  
  | 50–65 | Rotate bookies; repeat synchronic/diachronic with new props as time allows. |  
  | 65–75 | **Debrief** (see below).                                                 |  
  | 75–90 | Discussion, award prizes, Q&A.                                          |  

  ---

  ### **Debrief Bullets**  
  *(Link activity moments to assumptions)*  
  - **Single price (not spread):** → Prices are **two-sided commitments** (willing to buy *or* sell).  
  - **Bookie combines multiple bets:** → Loss is **synchronic coherence** failure (no arbitrage).  
  - **Trading at student’s price:** → Exploit is **guaranteed loss** (not probabilistic).  
  - **Hard proposition loss:** → Requires **logical omniscience** (must know all logical truths to avoid \( p \neq \) 0/1).  
  - **Pre-committed prices in diachronic round:** → Updating plan **must be fixed in advance** (else no sure loss).  
  - **Live vs. pre-commitment trade:** → Violating your plan = **diachronic incoherence**.  
  - **Spread variation’s sequential bets:** → Shows why synchronic argument needs **package bets** (spreads may avoid one-shot loss).  

  ---

  ### **Predictable Problems & Fixes**  
  - **Student posts 0.5 for everything:** Bookies exploit normalization failure (e.g., buy "Heads" @0.5 + buy "Tails" @0.5: cost 100, win 100 always → net 0, but should profit). *Fix: Ask: "Would you really sell a sure \( S \) for \( 0.5S \)?"*  
  - **Refuses to trade (loss aversion):** Stress this is hypothetical (points). If persistent, remind them non-traders can’t win the token.  
  - **Misreports "fair" prices:** They lose more points; point out this sabotages their own goal (winning points).  
  - **Slow bookies:** Pre-prepare an exploit (e.g., if \( p \) for A and \( p \) for ¬A sum to <1, buy both).  
  - **Confusion on buy/sell:** Clarify: "Selling a ticket = you pay out if true. Buying = you profit if true."  

  ---

  ### **What the Activity CAN’T Deliver (Key Caveats)**  
  1. **Coherence ≠ rationality:** Avoiding Dutch books is necessary but not sufficient (e.g., an agent with consistent priors can still be dogmatic).  
  2. **Exploitability as symptom:** The loss reveals inconsistency, but isn’t the *reason* irrationality is bad (it’s a diagnostic tool).  
  3. **Linearity of utility:** Assumes points ≈ linear utility (no risk aversion). Real agents might reasonably reject "fair" bets if stakes are high.  
  4. **Logical omniscience:** Real agents can’t know all logical truths → Dutch books may target "reasonable ignorance," not irrationality.  
  5. **Updating delays:** In practice, you can avoid diachronic exploits by delaying commitment until evidence arrives.  

  **Run-through tip:** Do a dry run with a colleague to test timing. Prioritize synchronic + diachronic rounds; shorten if needed by using 1–2 props.
