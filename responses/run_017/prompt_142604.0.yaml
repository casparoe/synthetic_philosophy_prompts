prompt: |-
  I sit on a small committee that is drafting the industrial-action section of a labor federation's code of conduct, and I have been asked to say when a strike is justified. I do not want a survey of any country's labor law, or a tour of the standard doctrines; I know the law often diverges from what I think, and that does not bother me. What I want is a principle: one I could defend to a skeptic, that earns my verdicts rather than merely restating them. Below are my gut verdicts, given as honestly as I can. Assume a setting where unions are established and a collective agreement is in force, except where I say otherwise.

  **The cases**

  1. An ordinary economic strike over wages, begun after the contract expires, with two months' notice; the employer keeps part of the line running with managers and output falls by about sixty percent. **Permissible**, without hesitation.

  2. Nurses at a large hospital strike intermittently — three days out, four days in — but the union staffs the emergency department and intensive care at normal levels and gives ten days' notice of each cycle. Elective procedures are cancelled, and the cancellations fall hardest on poorer patients who cannot easily rebook. **Permissible.**

  3. Teachers strike for six weeks; parents scramble for childcare and students lose instructional time. **Permissible in principle, but not as executed** — they gave two days' notice, and I want more than that.

  4. Workers walk out in breach of a no-strike clause in a contract that still has a year to run, because a machine guard was removed five months earlier and has since been involved in two amputations; the union filed a grievance and no hearing was scheduled. **Permissible.**

  5. The same plant, same clause, walks out over a schedule change the agreement plainly lets the employer make. **Not permissible.**

  6. Warehouse workers at a separate company in the same supply chain strike for a week so that the primary employer loses its buffer. They have no grievance of their own. **Permissible.**

  7. Software workers walk out to force their employer to cancel a government contract. The work itself is ordinary; their objection is to what the contract is ultimately used for. **Not permissible** — and this is the verdict I am least sure I can defend.

  8. Employees at a print shop refuse to run an order of white-nationalist flyers and walk out when the owner insists; their contract permits refusal only on safety grounds. **Permissible.**

  9. Food-delivery couriers, classified as independent contractors, with no union and no recognition election, coordinate in a group chat to log off simultaneously for one hour during the Friday surge-pricing window, demanding a floor on per-trip pay. No notice at all. **Permissible.**

  10. Sanitation crews work to rule — every inspection done in full, no shortcuts, no voluntary overtime — and throughput drops by forty percent. They never call it a strike. **Permissible, but it troubles me more than an open walkout does**, and I would want it disclosed.

  11. Mass picketing that physically prevents replacement workers and suppliers from entering the plant. **Not permissible.** For what it is worth, I also think it is **not permissible** for the employer to hire permanent replacements who keep their jobs after a settlement.

  12. Auto-parts workers stage six unannounced four-hour walkouts, each timed to a just-in-time delivery window during a new model launch. Total hours lost are fewer than in a three-day continuous strike. **Not permissible.**

  13. An employer fires the most visible organizer two weeks into a card-signing drive, citing a minor rule violation of a kind usually tolerated. **Not permissible, and seriously so.** The same employer then holds mandatory paid meetings arguing against unionization, with no equal access for the union. **Also not permissible, but far less seriously, and I am not confident it should be legally prohibited.** I suspect "not permissible" is doing two different jobs across my list — blameworthy versus apt for legal prohibition — and I would like that sorted out.

  **The case I cannot settle**

  A federation calls a one-day general strike, with a week's notice, aimed not at employers but at the government over a national policy; both public- and private-sector unions take part. I go back and forth, partly because case 7 says a political object is out of bounds and partly because a general strike seems to be the only remaining route to that particular object.

  **My tentative principle**

  The best I have managed: a strike is permissible if and only if (i) the demand is one the workers could not reasonably be expected to secure by quitting individually or by enforcing their existing agreement; (ii) the costs of the action fall in the first instance on the party able to grant the demand rather than on people with no power to concede anything; and (iii) the action is authorized by a majority of the unit and announced far enough ahead that those who will bear the costs can adjust.

  As far as I can tell it gets cases 1, 5, 7 and 12 right. It looks wrong on case 2, where the costs land on patients who can concede nothing; on case 9, where there is no union, no vote, no notice, and where quitting is trivially easy; and on case 8, where the printers could quit. It has nothing to say about case 11, which is a question of tactics rather than of whether to strike. I cannot tell whether it gets case 4 right, because I do not know how to count a grievance that has sat unanswered for five months.

  **What I want**

  Repair that principle or replace it. I would like the replacement stated precisely enough to be applied by someone else, with the case that motivates each of its clauses named; an explicit statement of which of my verdicts it cannot accommodate and which of those you would overturn; and its verdicts on three cases I have not ruled on — a twelve-person unit of air-traffic controllers at a regional hub, whose walkout cancels hundreds of flights; a strike, properly voted and noticed, whose sole demand is that the employer not automate the jobs the strikers currently do; and a union striking for a clause requiring new hires to join within thirty days. I already know that I permit the teachers in case 3 while balking at the controllers, and I want to know whether my principle should simply swallow that.

  Two pairs sit worst with me: cases 7 and 8, where the workers' objection in each is to what their labor produces, and cases 2, 9 and 12, where notice and authorization seem to matter enormously in one place and not at all in another. If no single principle covers the lot, tell me whether the right shape is two-level — one test for whether a grievance is a fit object of strike action, and separate constraints on tactics — or something else, and tell me which of my distinctions are doing no work at all.
reasoning: |-
  Okay, let me try to unpack this user's request. They're drafting guidelines for when a strike is justified and need a solid principle that can defend their gut verdicts on various cases. First, I need to understand their core challenge. Their tentative principle has gaps—especially with cases where third parties are affected or where political motives are involved. 

  Looking at their cases, the key conflicts are: 
  Cases 2 and 9 involve harm to bystanders (patients, delivery customers) but they still permit the strikes. Their principle's condition (ii) blocks these because costs fall on powerless third parties. Yet the user approves them. Why? Maybe because the harm is mitigated (case 2's emergency care) or the action is low-cost (case 9's brief log-off). 

  Cases 7 and 8 are both about objecting to work outputs, but they forbid case 7 (software for gov contract) while allowing case 8 (refusing racist flyers). The difference might be about direct complicity versus abstract objection. The flyers directly use their labor for hate speech, while the software might be indirectly used for something objectionable. 

  Then there's the asymmetry in notice/authorization: case 9 (no notice, no union) is okay, but case 12 (unannounced mini-strikes) isn't. The user seems to prioritize predictability for employers over formal processes. 

  The user also hints at a moral/legal distinction—some actions are blameworthy but shouldn't be illegal (case 13's captive meetings). Their principle doesn't address this. 

  Their unresolved case—the general strike against government policy—ties back to case 7's political objection problem. If political strikes are out, but this is the only recourse, what breaks the tie? 

  To fix the principle, I’d need to: 
  1. Redefine the cost-bearing condition to allow unavoidable third-party harm if minimized and proportionate. 
  2. Narrow the "demand achievable by quitting" clause to exclude cases where quitting doesn't address the harm (like case 8's flyers—quitting doesn't stop the flyers). 
  3. Split the notice/authorization rules: authorization matters for collective legitimacy, while notice depends on the harm's nature. 
  4. Add a clause about direct complicity for refusal-to-work cases. 
  5. Separate moral permissibility from legal prohibition, especially for tactics (like case 11’s picketing). 

  For new cases: 
  - Air traffic controllers: likely impermissible due to catastrophic third-party harm. 
  - Anti-automation strike: permissible if it’s about job security, not blocking progress entirely. 
  - Union shop demand: permissible as a standard bargaining issue. 

  The user’s hesitation in case 7 (software) vs. approval in case 8 (flyers) suggests that direct material involvement in harm is key. That distinction should be explicit. 

  Also, the general strike: if it’s the only recourse against government policy and broad-based, maybe it’s permissible despite being political. Their principle could allow it under "no alternative recourse," but that needs careful limits to avoid overreach. 

  Overall, the revised principle needs layers: one for the grievance’s validity, another for tactics, and a clear line between moral blame and legal limits. The user’s gut verdicts mostly hold except where third-party harm is extreme (controllers) or tactics coercive (mass picketing).
answer: |-
  Here's a refined principle designed to capture your verdicts while addressing the tensions in your cases. It adopts a two-level structure: one test for **substantive justification** (whether the *objective* warrants strike action) and another for **procedural fairness** (how the action is conducted).

  **Revised Principle:**

  A strike is **permissible** if and only if:
  1.  **Substantive Justification:** The demand or grievance is **necessary and materially connected** to the workers' interests *as workers*, meaning it:
      *   Addresses a direct threat to their **dignity, safety, fair compensation, job security, or collective autonomy** arising from the employment relationship; AND
      *   Cannot be reasonably resolved through **existing contractual grievance procedures** (if available and functional) or by **individual resignation** without imposing an unreasonable burden (e.g., abandoning colleagues, sacrificing accrued rights, or being complicit in harm).
  2.  **Procedural Fairness:** The action is conducted in a manner that is **proportionate and minimizes unnecessary harm**:
      *   It is **authorized by a democratic majority** of the affected bargaining unit (or, where no formal unit exists, the clearly defined group taking action);
      *   **Reasonable notice** is given to the primary target (the employer), calibrated to the **severity and predictability of the harm** the action causes to third parties and the employer's ability to mitigate it;
      *   Where feasible and consistent with the action's purpose, **reasonable steps are taken to mitigate severe, immediate, and irreparable harm to vulnerable third parties**;
      *   The **form and duration** of the action are **proportionate** to the grievance and the likelihood of achieving the objective, avoiding tactics designed primarily to inflict **gratuitous damage, coercion, or physical obstruction**.

  **How It Captures Your Verdicts & Resolves Tensions:**

  1.  **Substantive Justification Explained:**
      *   *Motivating Cases:* **4** (Safety - direct threat), **5** (Violates autonomy - employer acting within rights), **8** (Dignity/complicity - forced participation in hate speech), **13** (Collective autonomy - retaliation against organizing). Contrasts with **7** (Political objection - lacks *material connection* to workers' interests as workers; quitting avoids complicity).
      *   **"Materially connected"**: This excludes purely political/social goals (Case 7) while capturing refusal based on direct complicity in harm (Case 8). Quitting *is* an alternative in Case 8, but the clause "without imposing an unreasonable burden... or being complicit in harm" overrides this, recognizing that resignation alone doesn't address the *act* of producing harmful material using *their* labor.
      *   **"Necessary"**: Incorporates your (i) – demands must require collective action to be achievable. Explicitly links necessity to grievance procedures (Addresses Case 4: grievance procedure demonstrably failed after serious harm).
      *   **"Interests as workers"**: Distinguishes workplace concerns (safety, pay, dignity, autonomy) from broader political aims (Case 7). Justifies Case 6 (solidarity strike) as defending collective worker power within the supply chain, a material interest in leverage.

  2.  **Procedural Fairness Explained:**
      *   *Motivating Cases:* **3** (Insufficient notice for severe harm), **9** (Low-harm action mitigates need for formal vote/notice), **10** (Disclosure needed for transparency), **11** (Coercive tactics), **12** (Manipulative tactics causing disproportionate disruption), **13** (Importance of democratic authorization and fair process).
      *   **Democratic Authorization:** Addresses Cases 9 & 13. Case 9 (independent contractors): "clearly defined group" allows informal coordination. Case 13: highlights why suppression of organizing (blocking authorization) is severe.
      *   **Calibrated Notice:** Resolves the Case 2/3/9/12 tension. Notice isn't absolute; it depends on the harm caused.
          *   Case 2 (Nurses): Mitigation steps (staffing ER/ICU, cycling) *are* the "reasonable steps" to prevent severe harm, making shorter notice acceptable *despite* harm to poorer patients (which is significant but mitigated and arguably unavoidable in *any* hospital strike). The *cycling* itself provides some predictability.
          *   Case 3 (Teachers): Severe, widespread harm (childcare crisis, lost instruction) requires more notice than given.
          *   Case 9 (Couriers): Very limited harm (1hr surge delay) requires minimal/no notice.
          *   Case 12 (Mini-walkouts): *Intent* is to maximize disruption via unpredictability ("timed to just-in-time windows"), violating "minimizes unnecessary harm" and "proportionate" – it's gratuitously damaging tactics.
      *   **Mitigation:** Explicitly requires steps like Case 2's ER staffing. Failure to mitigate severe harm would render an otherwise justified strike impermissible.
      *   **Proportionate Tactics:** Directly forbids Case 11 (physical obstruction) and Case 12 (manipulative disruption). Addresses your unease with Case 10 (work-to-rule): its permissibility hinges on disclosure (transparency) and proportionality (slowdown vs. shutdown). "Gratuitous damage" captures your objection to permanent replacements in Case 11 footnote.

  **Verdicts on Your Cases:**

  1.  **Permissible:** Fits. Economic interest. Proper notice. Harm primarily on employer.
  2.  **Permissible:** Substantive (working conditions/autonomy). Procedural: Mitigation steps taken (ER/ICU), cycling provides some notice/mitigation. Harm on patients is severe but mitigated and unavoidable.
  3.  **Not Permissible as Executed:** Substantive justified. Procedural: Insufficient notice for severe, predictable harm.
  4.  **Permissible:** Substantive: Critical safety failure, grievance procedure failed. No feasible alternative.
  5.  **Not Permissible:** Substantive: Employer acted within agreed rights (violates "collective autonomy" justification). Grievance procedure likely available.
  6.  **Permissible:** Substantive: Solidarity is a material interest in worker leverage ("collective autonomy"). No direct grievance, but the *strike* is their tool to exert pressure within the system.
  7.  **Not Permissible:** Substantive: Objection is political, not materially connected to interests *as workers*. Quitting avoids complicity. (Your unsureness noted, principle holds firm here).
  8.  **Permissible:** Substantive: Direct complicity in producing hate speech violates dignity. Resignation alone doesn't prevent the act using their labor; strike is necessary collective refusal. (Clarifies why quitting isn't a sufficient alternative).
  9.  **Permissible:** Substantive: Fair compensation. Procedural: Low harm (1hr delay), no formal unit needed ("defined group"), minimal notice required.
  10. **Permissible, but...:** Substantive justified. Procedural: Disclosure needed for transparency ("call it a strike" or equivalent). Proportional.
  11. **Mass Picketing: Not Permissible:** Procedural: Coercive, physically obstructive tactic. **Permanent Replacements: Not Permissible:** Violates proportionality/fairness in tactics by inflicting gratuitous, lasting damage undermining the point of a settlement.
  12. **Not Permissible:** Procedural: Tactics designed for gratuitous, disproportionate disruption via unpredictability, exceeding what's necessary.
  13. **Firing Organizer: Not Permissible (Seriously):** Substantive: Direct, severe attack on collective autonomy. **Captive Meetings: Not Permissible (Less Seriously):** Substantive: Undermines fair process for collective autonomy. Your distinction between "blameworthy" and "legally prohibited" is valid; the *seriousness* reflects the *degree* of violation. Law might focus on firing; principle condemns both as violations of worker autonomy.

  **The General Strike Case:**
  *   **Verdict:** **Not Permissible** under this principle.
  *   **Why:** It fails the **Substantive Justification** test. The target is the government over national policy, not the employer over the employment relationship. The demand lacks the required *material connection* to the workers' interests *as workers*. While it might be the "only remaining route," the principle prioritizes confining strikes to the employment relationship where the harm (withdrawal of labor) is directly relevant to the demand. Political change must be sought through political channels.

  **Verdicts on New Cases:**

  1.  **12-Person Air Traffic Controllers (ATC) Walkout (Cancels Hundreds of Flights):**
      *   **Verdict: Not Permissible.**
      *   **Why:** While the substantive grievance might be justified (e.g., safety, pay), the **Procedural Fairness** test fails catastrophically. The severe, immediate, widespread, and dangerous harm to the public (cancelled flights, potential safety risks) is extreme. *No* notice or mitigation could reasonably prevent severe, irreparable harm in this context. The action is inherently disproportionate due to the uniquely critical and safety-sensitive nature of the work. (This captures your intuition contrasting with Teachers - Case 3).

  2.  **Strike Demanding No Automation of Current Jobs:**
      *   **Verdict: Permissible (Substantively Justified, Procedurally Fair execution assumed).**
      *   **Why:** **Substantive Justification:** Job security is a core worker interest materially connected to the employment relationship. Preventing automation directly impacts this. Resigning individually doesn't secure the jobs. This is a classic subject of collective bargaining, even if ultimately unsuccessful. (Contrasts with Case 7 - not demanding a change in *how* they work or what they produce for the employer, but demanding *continuation* of their work).

  3.  **Strike for Union Shop Clause (Mandatory Membership after 30 Days):**
      *   **Verdict: Permissible (Substantively Justified, Procedurally Fair execution assumed).**
      *   **Why:** **Substantive Justification:** Collective autonomy and security are core worker interests materially connected to the employment relationship. A union shop clause is a legitimate tool to ensure the union's viability and strength to bargain effectively for the unit. Quitting individually doesn't achieve this collective goal.

  **Addressing Your Concerns & Principle's Structure:**

  *   **Cases 7 & 8 (Refusal to Work):** The principle distinguishes them clearly via "material connection" and "complicity." Case 8 involves direct, active participation in producing harmful material; Case 7 involves labor used for ordinary work, later applied unacceptably by a third party. Only Case 8 triggers the worker dignity/complicity justification.
  *   **Cases 2, 9 & 12 (Notice/Authorization Asymmetry):** The principle resolves this by decoupling rigid requirements. Notice is calibrated to harm severity and mitigation feasibility. Authorization can be formal or informal ("defined group"). Tactics (Case 12) are judged by proportionality and intent to cause gratuitous harm, not just hours lost. Case 9's low harm needs little notice/formality; Case 2's high harm is mitigated, allowing shorter notice; Case 12's tactics are inherently disproportionate.
  *   **Two-Level Structure:** This is essential. Your tentative principle mixed substance and procedure. Separating "**Substantive Justification**" (Is this a legitimate *reason* to strike?) from "**Procedural Fairness**" (Is this a legitimate *way* to strike?) provides clarity and handles tactics (Case 11, 12) and harm mitigation (Case 2, 3, ATC) effectively.
  *   **Blameworthy vs. Legally Prohibited (Case 13):** The principle identifies violations of worker autonomy (substantive) or procedural fairness. The *degree* of violation determines severity (firing vs. captive meetings). Whether a specific violation *should be legally prohibited* is a separate policy/jurisdictional question informed by the severity of the violation and the potential for alternative remedies. The principle provides the *moral/ethical* grounding for both condemnation and potential legal sanction.
  *   **Swallowing ATC vs. Teachers Distinction:** The principle explicitly captures this through the **Procedural Fairness** requirement to mitigate severe, irreparable harm and proportionality. The ATC strike inherently fails this due to the catastrophic, unavoidable consequences; the teachers' strike (with proper notice) allows for some mitigation (finding childcare, planning lessons).

  This principle aims to be defensible to a skeptic by grounding itself in core worker interests within the employment relationship (dignity, safety, fair compensation, security, autonomy) and balancing the right to collective action against the rights of others (employers, public) through procedural constraints focused on democracy, notice, harm mitigation, and proportionality. It accommodates nearly all your verdicts, overturning only the permissibility of the General Strike as described, and provides clear reasoning for the new cases.
