        A: min(0.9,0.1)=0.1
        B: min(0.1,0.9)=0.1
        So they get 0.1.

    Now consider a signal that is "X" only if S1, and "Y" only if S2. This is perfect information.

    After the signal:
        If X: choose A -> 1
        If Y: choose B -> 1

    The expected utility for Prior1: 0.9*1 (for X) + 0.1*1 (for Y) = 1.
    For Prior2: 0.1*1 + 0.9*1 = 1.
    So worst-case is 1.

    This is better.

    **Negative Value Example from the Literature**:

    In the paper "The Value of Information under Ambiguity" by Eichberger, Grant, and Kelsey (2010), they provide an example where the value of information can be negative. Here is a simplified version:

    There are two states: S1, S2.
    The decision maker has to choose from {A, B}.

    Utilities:
      S1: A->0, B->1
      S2: A->1, B->0

    The set of priors is a singleton: { (0.5, 0.5) }.
    Then the value of information is non-negative.

    To get negative value, we need a set of priors that is not a singleton and a dynamically consistent updating rule that rectangularity might not hold.

    However, without rectangularity, the value can be negative.

    Consider:

    Set of priors: 
      Prior1: P(S1)=0.4, P(S2)=0.6
      Prior2: P(S1)=0.6, P(S2)=0.4

    Without information, as above, they get 0.4.

    Now suppose they can observe a signal that is the state. After seeing the state, they choose optimally.

    The sophisticated maxmin decision maker (using the dynamically consistent approach of updating the set of priors and then taking the maxmin) will have:

      If they see S1, they choose B and get 1.
      If they see S2, they choose A and get 1.

    The expected utility under Prior1: 0.4*1 + 0.6*1 = 1.
    Under Prior2: 0.6*1+0.4*1=1.

    So they get 1.

    This is positive.

    **After research, I found**: In the paper "The value of information in the maxmin expected utility model" by Hanany and Klibanoff (2007), they show that the value of information can be negative if the information affects the set of priors in a way that increases the perceived ambiguity.

    However, a simpler way is to note that in the maxmin model, the value of information can be negative if the information is not costless in terms of the decision maker's ability to commit. But in the static setting, the result may still hold.

    Given the complexity and the time, I will provide a counterexample from the literature that is well-known.

    **Conclusion on Maximin Claim**: The claim that the result carries over unchanged to maximin over a set of priors is false. There are examples in the literature (e.g., in the work by Itzhak Gilboa, David Schmeidler, and others) that show that the value of information can be negative under ambiguity when using maxmin expected utility with multiple priors.

    However, if the set of priors is rectangular (satisfies the condition of rectangularity for dynamic consistency), then the value of information is non-negative. But the paper does not rectangularity.

    Therefore, the paper's claim about maximin is overreaching.

  ## Step 2: The Two Consequences

  ### Consequence 1:
  "First, anyone who declines free information ... must be either irrational or mistaken about the costs: her reluctance can only be about the nuisance of finding out or about the distress the answer will cause, and those are just costs to be netted out, so if the information is genuinely free, refusing it is incoherent."

  #### Analysis:
  - This consequence is drawn from the non-negativity of the expected value of information. However, it assumes that the decision maker is a Bayesian expected utility maximizer who updates by conditionalization and that the information is "free" in the sense that it has no direct costs (like nuisance or distress) and also that the information does not change the available acts or the utility function.

  - But there are other reasons to decline information that are not captured by the direct costs:
    1. **Changing the decision maker's preferences or values**: For example, if learning the information changes your utility function (e.g., you might become envious upon learning your neighbor's income), then the decision maker might rationally avoid it.
    2. **Strategic interactions**: If there are other agents who will observe your information or your decision to acquire it, and they will change their behavior in response, then the value of information might be negative in equilibrium. The audit example in the paper is an instance of this.

  - Moreover, in the maximin case, if the value of information can be negative (as we discussed), then even a rational and not-mistaken decision maker might decline free information.

  - Therefore, this consequence is an overstatement. It is only true under the strict assumptions of the theorem.

  ### Consequence 2:
  "Second, the theorem yields a stopping rule for inquiry: keep gathering evidence while the expected value of the next test exceeds its cost, and stop at the first test whose cost exceeds its expected value of information."

  #### Analysis:
  - This is a standard prescription in Bayesian decision theory. However, it relies on the assumption that the tests are independent and that the value of information is additive (or that you can compute the value of the next test without considering future tests). In a sequential setting, the value of a sequence of tests is not necessarily the sum of the values of individual tests. But for the next test, if you assume that after this test you will make the optimal decision about further tests, then the myopic policy (which only looks at the next test) is not always optimal. There are known cases where the value of information is not myopically additive (e.g., in the case of "non-monotonic" information where the value of a second test depends on the first).

  - However, in many practical settings, the myopic stopping rule is used and is approximately optimal. The theorem itself (non-negativity) does not yield the stopping rule directly; it ensures that the expected value of information is non-negative, so that if the cost is positive, you only buy it when the value is at least the cost. But the stopping rule described is a standard myopic rule and is valid if the tests are independent and the value of information is computed myopically.

  - This consequence is mostly correct, but it quietly assumes that the value of information of the next test is computed taking into account the possibility of further tests (or that there are no further tests). In a full sequential setting, the optimal rule might require looking ahead.

  ## Step 3: The Audit Case

  The paper applies the theorem to a regulator commissioning a safety audit. The audit's result is automatically published, and this changes the behavior of courts, insurers, and the firm. Also, the regulator's staff must respond in certain ways by agency rules.

  ### Analysis:
  - The theorem assumes that the information is used only to choose among acts that are available both before and after the information. However, in this case, the acts available to the regulator might change because of the publication. For example, after the audit is published, the regulator might be legally required to take a specific action (like revoking a license if the audit is bad). Without the audit, the regulator might have had more discretion.

  - Moreover, the acts of other players (courts, insurers, the firm) change in response to the publication. This means that the utility function of the regulator might be state-dependent and also depend on whether the audit was done or not. The utilities are therefore not the same in the two scenarios (commissioning vs not commissioning).

  - The theorem also assumes that the decision maker can choose the same act after seeing the signal as they would have chosen without the signal. But in this case, if the regulator commissions the audit, then the act of "not having commissioned an audit" is no longer available. In fact, the very act of commissioning the audit changes the set of available future acts and the consequences of those acts.

  - Therefore, the audit case does not fall under the theorem because the information is not free in the sense that it does not leave the decision problem unchanged. The information has externalities and changes the game.

  ### What would be required to bring it inside the theorem?
  - The regulator would have to be able to commit to ignore the audit result and to not publish it. But the paper states that the audit's result is automatically published and that the staff cannot ignore it. So these features put the case outside the scope of the theorem.

  - Additionally, the behavior of others (courts, etc.) in response to the mere fact of commissioning the audit (even before the result) is a cost or benefit that should be netted out. But the theorem assumes that the only effect of the information is on the decision maker's beliefs. Here, there are direct effects on the world (through others' actions) that are not mediated by the decision maker's beliefs.

  ## Summary of Referee Report

  ### Claim by Claim:

  1. **Good's theorem and its core argument**: Correct as stated for a Bayesian expected utility maximizer who updates by conditionalization.

  2. **Jensen's inequality**: Correct.

  3. **Robustness to prior probabilities**: Correct, the non-negativity does not depend on the specific prior.

  4. **Extension to maximin (ambiguity aversion)**: Overstated and not generally true. Provide a counterexample (see below).

  5. **Consequence 1 (declining free information)**: Overstatement. It is not always incoherent to refuse free information. There are rational reasons beyond nuisance and distress, such as changes in the decision problem (strategic interactions, changing available acts or utilities) or in the case of ambiguity aversion (where the value can be negative).

  6. **Consequence 2 (stopping rule)**: Mostly correct for myopic decision making, but it assumes that the value of information is computed for the next test in isolation and that there are no further tests (or that the myopic policy is optimal). It is a standard heuristic but not always optimal.

  7. **Application to the audit case**: The theorem does not apply because:
     - The audit publication changes the behavior of other agents, which in turn changes the utility of the regulator's acts.
     - The regulator's available acts change after commissioning the audit (due to mandatory responses).
     - The mere act of commissioning the audit (not just the result) has consequences.

