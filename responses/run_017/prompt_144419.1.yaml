    **The Issue of Updating the Set of Priors**:

    In the maxmin expected utility model, when you update a set of priors, you get a set of posteriors. However, if the signal is such that for some prior in the set, the probability of the signal is zero, then that prior is eliminated. This can lead to a situation where the worst-case expected utility after the signal is computed over a smaller set, but it might be that the worst-case for the overall plan is better.

    Alternatively, consider a signal that is not realized with positive probability under every prior. Then some priors are eliminated, and the new worst-case might be worse than the old one.

    **Counterexample**:

    States: S1, S2
    Acts: A, B

    Utilities:
      S1: A->1, B->0
      S2: A->0, B->1

