prompt: |-
  I've been asked to referee an ethics-and-policy working paper, and I need to know how much of its treatment of Good's theorem on the value of information I can let stand. The paper states the result like this:

  "Good's theorem says that information cannot have negative expected value. If you are an expected-utility maximizer who updates by conditionalization, then learning something before you act can only help you: for any result the observation might have, you remain free to perform exactly the act you would have performed had you not looked, so the expected utility of choosing after seeing the signal is at least the expected utility of choosing now. The argument is just Jensen's inequality applied to the maximum over acts, which makes it extremely robust. It does not depend on how probable any hypothesis is, and it carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors, so even a strongly ambiguity-averse decisionmaker — one who plans by maximin — can never be made worse off in expectation by free information.

  Two consequences are drawn. First, anyone who declines free information — the patient who refuses a predictive genetic test, the official who does not want an impact assessment run, the reader who avoids spoilers — must be either irrational or mistaken about the costs: her reluctance can only be about the nuisance of finding out or about the distress the answer will cause, and those are just costs to be netted out, so if the information is genuinely free, refusing it is incoherent. Second, the theorem yields a stopping rule for inquiry: keep gathering evidence while the expected value of the next test exceeds its cost, and stop at the first test whose cost exceeds its expected value of information."

  The paper then applies all of this to the case I actually care about. A regulator must decide whether to commission a safety audit before deciding whether to license a system. Two features of the case: the audit's result is automatically published once produced, so courts, insurers, and the firm itself all change their behavior in response both to the result and to the mere fact that the regulator commissioned it; and the regulator's own staff cannot ignore the result, because agency rules make certain responses mandatory. The paper concludes that Good's theorem settles the question: commission the audit, since information cannot make you worse off.

  I have a hunch that the stopping rule is the sound part and the application to the audit is where things go wrong, but I suspect the maximin remark is too quick and I can't say why, and I may be wrong about where the real problems are.

  Please give me an accuracy audit I can turn into a referee report. Go through the summary claim by claim: what a decision theorist would accept as stated, what is an overstatement of a more modest thesis, what rests on a conflation the result itself keeps apart, and what is simply false. Say which assumptions the theorem actually needs — about updating, about the signal's relation to the acts and their outcomes, about where utility is defined — and which of them each step quietly uses. Then tell me whether either corollary survives correction, and whether the audit case falls under the theorem at all; if it doesn't, identify which feature puts it outside and what would have to change to bring it inside. Where your answer is "it depends," say what it depends on, so I can tell the authors what to add rather than just objecting. If the maximin claim is false, give me the smallest counterexample you can — two states, two acts, one free signal — in a form I could paste into the report.
reasoning: |-
  We are going to analyze the provided summary of Good's theorem and its application step by step. We will identify the correct claims, the overstatements, the conflations, and the false statements. We will also examine the assumptions of the theorem and see which ones are necessary and which are being used in the argument. Finally, we will evaluate the two consequences and the application to the audit case.

  ## Step 1: The Statement of Good's Theorem

  The paper states:
  "Good's theorem says that information cannot have negative expected value. If you are an expected-utility maximizer who updates by conditionalization, then learning something before you act can only help you: for any result the observation might have, you remain free to perform exactly the act you would have performed had you not looked, so the expected utility of choosing after seeing the signal is at least the expected utility of choosing now. The argument is just Jensen's inequality applied to the maximum over acts, which makes it extremely robust."

  ### Accuracy Check:
  1. **Non-Negative Expected Value of Information**: This is a standard and correct statement of Good's result. The expected value of information (EVI) is non-negative for a Bayesian decision maker who updates by conditionalization and is an expected utility maximizer.

  2. **The Core Argument**: The idea that the decision maker can always choose the act they would have chosen without the information (thus guaranteeing at least that utility) is the key insight. This is often called the "value of information is non-negative" result.

  3. **Jensen's Inequality**: The argument can indeed be seen as an application of Jensen's inequality to the maximum operator (which is a convex function). Specifically, the maximum of expected utilities is at least the expected value of the maximum of utilities (conditional on the signal). This is correct.

  ### Assumptions Explicitly Mentioned:
  - The decision maker is an expected-utility maximizer.
  - Updates by conditionalization (Bayesian updating).

  ### Robustness Claim:
  The paper claims: "It does not depend on how probable any hypothesis is, and it carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors, so even a strongly ambiguity-averse decisionmaker — one who plans by maximin — can never be made worse off in expectation by free information."

  #### Analysis:
  - **Independence of Probabilities**: The non-negativity does hold regardless of the prior probabilities (as long as they are positive and form a probability distribution). This is true.
  - **Extension to Maximin (Ambiguity Aversion)**: This is not straightforward. The paper claims that the result carries over unchanged to an agent who uses maximin over a set of priors. However, this is not generally true. 

    **Counterexample for Maximin:**
    Consider a set of two states: S1 and S2.
    Two acts: A1 and A2.
    Utilities:
      - If S1: A1 yields 1, A2 yields 0.
      - If S2: A1 yields 0, A2 yields 1.

    Without any information, the maximin decision maker considers the worst case for each act:
      - Worst for A1: min(1,0) = 0.
      - Worst for A2: min(0,1) = 0.
    So the maximin decision maker is indifferent and might choose either, getting 0 in the worst case.

    Now consider a free signal that perfectly reveals the state. After the signal:
      - If the signal says S1, the agent chooses A1 and gets 1.
      - If the signal says S2, the agent chooses A2 and gets 1.

    But note: the worst-case expected utility (over the set of priors) after the signal is 1 (because in every state the agent gets 1). However, the worst-case expected utility without the signal was 0. So the value of information is positive.

    However, consider a different set of priors and a different signal.

    **Counterexample where information can hurt under maximin:**

    Let the set of states be {S1, S2}. The decision maker has two acts: A and B.
    Utilities:
      - In S1: A yields 1, B yields 0.
      - In S2: A yields 0, B yields 1.

    The decision maker has a set of priors: two possible prior distributions:
      Prior1: P(S1)=1, P(S2)=0.
      Prior2: P(S1)=0, P(S2)=1.

    Without information, the maximin decision maker evaluates:
      - For act A: min( utility under Prior1, utility under Prior2 ) = min(1, 0) = 0.
      - For act B: min(0,1) = 0.
      So again, indifferent, and the worst-case expected utility is 0.

    Now suppose there is a free signal that is uninformative: it always says "X" (trivial signal). But note: if the decision maker observes the signal (which is always the same), they don't learn anything. However, after the signal, the set of posteriors is the same as the set of priors (because the signal is uninformative). So the maximin decision maker still faces:
      - For A: min(1,0)=0.
      - For B: min(0,1)=0.
      So they get 0.

    But wait, that's the same. Now consider a signal that is informative but in a way that the worst-case becomes worse? Actually, we need to see if the worst-case expected utility can decrease.

    Let me design a counterexample:

    States: {S1, S2}
    Acts: A, B
    Utilities:
      S1: A -> 0, B -> 1
      S2: A -> 1, B -> 0

    Set of priors: two priors
      Prior1: P(S1)=1, P(S2)=0
      Prior2: P(S1)=0, P(S2)=1

    Without information:
      Act A: min(0, 1) = 0
      Act B: min(1, 0) = 0
      So the maximin decision maker is indifferent and gets at least 0.

    Now consider a signal that is informative. The signal can be either "X" or "Y". The likelihoods:
      P(X|S1)=1, P(Y|S1)=0   [so if S1, always X]
      P(X|S2)=0, P(Y|S2)=1   [so if S2, always Y]

    This signal perfectly reveals the state.

    After observing the signal:
      - If "X", then the decision maker knows S1. Then they choose B (which gives 1 in S1) and get 1.
      - If "Y", then they know S2 and choose A (which gives 1 in S2) and get 1.

    So in every case, they get 1. The worst-case expected utility is 1 (which is better than 0).

    Now, we need a signal that makes the worst-case worse.

    Consider a different set of priors and a non-trivial signal.

    Let the set of priors be a singleton: only one prior, say P(S1)=0.5, P(S2)=0.5. Then the maximin decision maker is just a Bayesian and the value of information is non-negative.

    We need a set of priors that is not a singleton and a signal that causes the worst-case to drop.

    **Counterexample by Izhakian and Benninga (2011) or Epstein and Schneider (2007)**: 
    There are known results that show that under ambiguity (multiple priors) the value of information can be negative when the decision maker uses maxmin expected utility.

    A simple counterexample:

    States: S1, S2
    Acts: A, B, C

    Utilities:
      S1: A -> 1, B -> 0, C -> 0.4
      S2: A -> 0, B -> 1, C -> 0.4

    Set of priors: two priors
      Prior1: P(S1)=0.8, P(S2)=0.2
      Prior2: P(S1)=0.2, P(S2)=0.8

    Without information, the maxmin decision maker evaluates each act:
      A: min(0.8*1 + 0.2*0, 0.2*1 + 0.8*0) = min(0.8, 0.2) = 0.2
      B: min(0.8*0+0.2*1, 0.2*0+0.8*1) = min(0.2, 0.8)=0.2
      C: 0.4 (in both priors) -> 0.4

    So they choose C and get 0.4.

    Now consider a signal that is partially informative. Suppose there are two signals: X and Y.

    Likelihoods for S1: P(X|S1)=1, P(Y|S1)=0
    Likelihoods for S2: P(X|S2)=0, P(Y|S2)=1

    So the signal perfectly reveals the state.

    After seeing X (which implies S1), the set of posteriors collapses to {Prior1 conditioned on X: P(S1)=1, P(S2)=0}. Then the decision maker chooses the best act for S1: A, which gives 1.

    After seeing Y (which implies S2), the set of posteriors collapses to {Prior2 conditioned on Y: P(S1)=0, P(S2)=1}. Then the decision maker chooses B, which gives 1.

    So the expected utility (from the perspective of the prior) is 1 in both cases. But note: the maxmin decision maker evaluates the ex ante expected utility by taking the worst prior. The expected utility for the whole process is computed as:

      For Prior1: 
          P(X) = P(X|S1)*P(S1) + P(X|S2)*P(S2) = 1*0.8 + 0*0.2 = 0.8 -> then utility 1
          P(Y) = 0.2 -> then utility 1
          So expected utility = 0.8*1 + 0.2*1 = 1.

      For Prior2:
          P(X)= 1*0.2 + 0*0.8 = 0.2 -> utility 1
          P(Y)=0.8 -> utility 1
          expected utility = 1.

      So the worst-case expected utility is 1, which is better than 0.4.

    Still positive. We need a different setup.

    **Counterexample where the value is negative**:

    Let me try a different one.

    States: S1, S2
    Acts: A, B

    Utilities:
      S1: A->0, B->1
      S2: A->1, B->0

    Set of priors: 
      Prior1: P(S1)=0.4, P(S2)=0.6
      Prior2: P(S1)=0.6, P(S2)=0.4

    Without information:
      Act A: min(0.4*0+0.6*1, 0.6*0+0.4*1) = min(0.6, 0.4) = 0.4
      Act B: min(0.4*1+0.6*0, 0.6*1+0.4*0) = min(0.4, 0.6)=0.4
      So the maxmin decision maker is indifferent and gets 0.4.

    Now consider a signal that is not perfect. Let the signal space be {X, Y}. The likelihoods:

      P(X|S1) = 0.5, P(Y|S1)=0.5
      P(X|S2)=0.5, P(Y|S2)=0.5

    This signal is completely uninformative.

    After the signal, the set of posteriors is the same as the set of priors (because the signal is uninformative). Therefore, the decision maker still faces the same problem: min expected utility of 0.4 for either act.

    But note: the decision maker might choose an act after the signal. However, because the signal is uninformative, the situation is the same as without the signal. So the expected utility (in the worst prior) is still 0.4.

    This is the same as without the signal.

    Now, we need a signal that is informative but leads to a worse situation in the worst-case.

    **Counterexample from the literature** (simplified from Epstein and Schneider, 2007):

    Consider two states and two signals. The set of priors is:

      { (P(S1), P(S2)) : P(S1) in [0.4, 0.6] }

    Now, the signal is conditionally independent but ambiguous: the decision maker does not know the exact likelihood. Suppose the signal can be H or T, and the likelihoods are also ambiguous. However, we can design a setting where the ambiguity increases after the signal.

    Actually, a simpler counterexample:

    States: {S1, S2}
    Acts: A, B, C

    Utilities:
      S1: A->1, B->0, C->0.5
      S2: A->0, B->1, C->0.5

    Set of priors: two priors
      Prior1: P(S1)=0.8, P(S2)=0.2
      Prior2: P(S1)=0.2, P(S2)=0.8

    Without information:
      For act A: min(0.8, 0) = 0? Wait: 
        Prior1: 0.8*1 + 0.2*0 = 0.8
        Prior2: 0.2*1 + 0.8*0 = 0.2
        min(0.8,0.2)=0.2
      For act B: min(0.8*0+0.2*1, 0.2*0+0.8*1)=min(0.2,0.8)=0.2
      For act C: 0.5 (constant) -> min(0.5,0.5)=0.5
      So they choose C and get 0.5.

    Now consider a signal that is informative. The signal is either "X" or "Y", with likelihoods:

      P(X|S1)=1, P(Y|S1)=0
      P(X|S2)=0, P(Y|S2)=1

    So the signal is perfect.

    After the signal:
      - If X: then the state is S1. Then the decision maker chooses A and gets 1.
      - If Y: then state is S2, and they choose B and get 1.

    The expected utility under Prior1: 
          P(X)=P(S1)=0.8 -> utility 1; P(Y)=0.2 -> utility 1 -> expected utility=1.
    Under Prior2: 
          P(X)=0.2 -> utility 1; P(Y)=0.8 -> utility 1 -> expected utility=1.

    The worst-case expected utility is 1, which is better than 0.5.

    We need a setting where the decision maker cannot avoid a low payoff in the worst-case after the signal.

    **Negative Value Example**:

    Let's consider a different set of acts and utilities.

    States: S1, S2
    Acts: A, B

    Utilities:
      S1: A->1, B->0
      S2: A->0, B->1

    Set of priors: [0,1] for P(S1) (so any prior).

    Without information:
        Act A: min_{p in [0,1]} [ p*1 + (1-p)*0 ] = min_{p} [p] = 0
        Act B: min_{p} [ p*0 + (1-p)*1 ] = min_{p} [1-p] = 0
        So the maxmin decision maker is indifferent and gets 0.

    Now consider a signal that is uninformative: it is always the same. Then the posterior set is the same as the prior set. After the signal, the decision maker still faces the same problem and gets 0. So no change.

    But consider a signal that is informative. The signal can be H or T, with:

        P(H|S1)=1, P(T|S1)=0
        P(H|S2)=0, P(T|S2)=1

    This is perfect information.

    After the signal:
        If H, then the state is S1. The decision maker chooses A and gets 1.
        If T, then state is S2, and they choose B and get 1.

    The expected utility for a given prior p (P(S1)=p) is:
          p * 1 + (1-p) * 1 = 1.
    So the worst-case expected utility is 1 (over the set of priors). This is better.

    We need a situation where the signal creates a new act that is not available without the signal? Or where the set of posteriors leads to a worse outcome in the worst-case.

    **Known Counterexample**:

    There is a known counterexample in the literature (see, e.g., Eichberger et al., 2010, or the work by Epstein and Schneider) that relies on dynamic inconsistency. However, we can construct a simple one with two states and a non-revealing signal that leads to more ambiguity.

    Let me try:

    States: S1, S2
    Acts: A, B

    Utilities:
      S1: A->1, B->0.5
      S2: A->0, B->0.5

    Set of priors: two priors
      Prior1: P(S1)=1, P(S2)=0
      Prior2: P(S1)=0, P(S2)=1

    Without information:
        Act A: min(1, 0) = 0
        Act B: min(0.5,0.5)=0.5
        So the decision maker chooses B and gets 0.5.

    Now consider a signal that is completely uninformative. The signal is always "X". After the signal, the set of posteriors is still {Prior1, Prior2}. Then:
        Act A: min(1,0)=0
        Act B: 0.5
        So they choose B and get 0.5.

    Now consider a different signal: one that is informative but also allows the decision maker to condition on something. However, we want a negative value.

    **Counterexample with negative value** (from the literature):

    Consider three states: S1, S2, S3.
    Two signals: X and Y.

    The set of possible probabilities is:

