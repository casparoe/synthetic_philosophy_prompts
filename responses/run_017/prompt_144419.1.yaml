    **A Simple Negative Value Counterexample**:

    Let me try a different one with two states and one signal.

    States: S1, S2
    Acts available only after the signal: we assume that the decision maker can choose acts that depend on the signal. Without the signal, the decision maker has to choose an act without knowing the signal.

    But the standard setup is that without the signal, you choose an act. With the signal, you choose a contingent plan.

    However, in the maxmin case, the decision maker might be dynamically inconsistent. We have to assume that they are sophisticated and use a dynamically consistent rule (like rectangularity) or not.

    **Eichberger, Grant, and Kelsey (2010)**: They provide an example with negative value of information.

    We can use a small example from their paper:

    States: {S1, S2}
    The decision maker has to choose between act A and act B.

    Utilities:
      S1: A->0, B->1
      S2: A->1, B->0

    The set of priors: two priors
      Prior1: P(S1)=0.4, P(S2)=0.6
      Prior2: P(S1)=0.6, P(S2)=0.4

    Without information, the maxmin expected utility is:
      A: min(0.4*0+0.6*1, 0.6*0+0.4*1) = min(0.6, 0.4) = 0.4
      B: min(0.4*1+0.6*0, 0.6*1+0.4*0) = min(0.4,0.6)=0.4
      So they get 0.4.

    Now suppose they can observe a signal that is the state itself (perfect information). After observing the state, they can choose the best act.

    If they observe S1, they choose B and get 1.
    If they observe S2, they choose A and get 1.

    However, the maxmin decision maker evaluates this by taking the worst prior for the whole process.

    The expected utility for Prior1: 
          P(S1)=0.4 -> choose B:1, P(S2)=0.6 -> choose A:1 -> expected utility= 0.4*1+0.6*1=1.
    For Prior2: 
          P(S1)=0.6 ->1, P(S2)=0.4->1 -> expected utility=1.

