  ### Accuracy Audit of Good's Theorem Summary and Application

  Below is a claim-by-claim assessment of the working paper's summary of Good's theorem, its implications, and the audit application. I distinguish between **accepted** (correct as stated), **overstated** (true only under specific conditions), **conflated** (mixes distinct concepts), and **false** (incorrect) claims. Assumptions are explicitly identified, and counterexamples are provided where needed. Recommendations for revision are included.

  ---

  ### **1. Good's Theorem Statement**
  **Claim:**  
  "Good's theorem says that information cannot have negative expected value... The expected utility of choosing after seeing the signal is at least the expected utility of choosing now. The argument is just Jensen's inequality applied to the maximum over acts."

  - **Decision Theorist Verdict:** **Accepted** (with caveats).  
    - **Why?** For a Bayesian expected-utility (EU) maximizer who updates by conditionalization, the expected value of information (EVI) is indeed non-negative. The proof uses Jensen’s inequality on the convex function \(\max\) over acts:  
      \[
      \mathbb{E} \left[ \max_{a} \mathbb{E}[U \mid s] \right] \geq \max_{a} \mathbb{E}[U].
      \]
    - **Assumptions Required:**  
      - The decision maker (DM) is an EU maximizer.  
      - The DM updates beliefs via Bayesian conditionalization.  
      - Utility is defined over outcomes, not acts or beliefs (i.e., no "moral costs" of knowing/not knowing).  
      - The signal is costless and **does not alter the acts, outcomes, or utilities available**.  

  **Claim:**  
  "It does not depend on how probable any hypothesis is."

  - **Decision Theorist Verdict:** **Accepted**.  
    - **Why?** The non-negativity holds for any prior distribution (as long as it’s probabilistic).  

  **Claim:**  
  "[It] carries over unchanged to an agent who maximizes worst-case expected utility over a set of priors (maximin)."

  - **Decision Theorist Verdict:** **False**.  
    - **Why?** Under maximin (ambiguity-averse) preferences, information can have negative EVI. The reason is that information may increase ambiguity, making the worst case worse. The DM cannot freely "fall back" to the pre-info act because the worst-case prior may change after conditioning on the signal.  
    - **Counterexample** (2 states, 2 acts, 1 signal):  
      - **States:** \(S_1\) (system safe), \(S_2\) (system unsafe).  
      - **Acts:** License (\(L\)), Reject (\(R\)).  
      - **Utilities:**  
        - \(U(L, S_1) = 10\) (correct license),  
        - \(U(L, S_2) = -10\) (unsafe failure),  
        - \(U(R, S_1) = -1\) (over-regulation),  
        - \(U(R, S_2) = 0\) (correct rejection).  
      - **Ambiguous priors:** \(\mathcal{P} = \{P_1, P_2\}\), where \(P_1(S_1) = 0.9\) (optimistic), \(P_2(S_1) = 0.1\) (pessimistic).  
      - **Pre-info maximin:**  
        - Under \(P_1\): \(EU(L) = 8\), \(EU(R) = -0.9\) → Best: \(L\) (utility 8).  
        - Under \(P_2\): \(EU(L) = -8\), \(EU(R) = -0.1\) → Best: \(R\) (utility \(-0.1\)).  
        - Maximin utility = \(\min(8, -0.1) = -0.1\) → DM chooses \(R\).  
      - **Free signal:** A perfectly informative signal about the state.  
        - If signal reveals \(S_1\): DM chooses \(L\) (utility 10).  
        - If signal reveals \(S_2\): DM chooses \(R\) (utility 0).  
      - **Post-info maximin (evaluated ex-ante w.r.t. worst prior):**  
        - For \(P_1\): Expected utility = \(0.9 \cdot 10 + 0.1 \cdot 0 = 9\).  
        - For \(P_2\): Expected utility = \(0.1 \cdot 10 + 0.9 \cdot 0 = 1\).  
        - Worst-case (over priors) expected utility = \(\min(9, 1) = 1\).  
      - **Result:** Pre-info maximin utility was \(-0.1\). Post-info (worst-case) is \(1\) → information improved the worst case.  
      - **Negative EVI variant:** Change utilities: Let \(U(R, S_1) = -5\) (large penalty for over-regulation). Recalculate:  
        - Pre-info: Under \(P_2\), best act is \(R\) with \(EU(R) = -0.5\) → maximin utility = \(-0.5\).  
        - Post-info: For \(P_2\), expected utility = \(0.1 \cdot 10 + 0.9 \cdot (-5) = 1 - 4.5 = -3.5\).  
        - Worst-case expected utility = \(\min(9, -3.5) = -3.5 < -0.5\).  
      → **EVI is negative** (-3.5 vs. -0.5) for the ambiguity-averse DM.  
    - **Correction:** The theorem holds for maximin **only** if the set of priors is "rectangular" (satisfies dynamic consistency; see Epstein and Schneider 2003). Otherwise, negative EVI is possible.  

  ---

  ### **2. Consequences Drawn**
  **Consequence 1:**  
  "Anyone who declines free information must be either irrational or mistaken about the costs... if the information is genuinely free, refusing it is incoherent."

  - **Decision Theorist Verdict:** **Overstated** (and conflates costs).  
    - **Why?** This assumes the **only** costs are "nuisance/distress," which are separable from the decision problem. But rational refusal can occur if:  
      - Information alters acts/outcomes (e.g., mandatory rules triggered by knowing).  
      - Information changes utilities (e.g., "moral costs" from knowing harmful truths).  
      - Ambiguity aversion makes EVI negative (per counterexample).  
      - **Conflation:** The theorem assumes information is *decision-relevant but problem-invariant*. Refusal may be rational if information changes the decision problem itself.  

  **Consequence 2:**  
  "The theorem yields a stopping rule for inquiry: keep gathering evidence while EVI > cost."

  - **Decision Theorist Verdict:** **Overstated**.  
    - **Why?** The rule is myopically optimal but may fail sequentially if:  
      - Tests are interdependent (e.g., information from test \(A\) affects EVI of test \(B\)).  
      - The DM is ambiguity-averse (EVI may not be additive).  
    - **Correction:** The stopping rule requires tests to be *independent* and *myopically optimal*. For sequential settings, global optimization may differ.  

  ---

  ### **3. Application to Safety Audit**
  **Claim:**  
  "Good's theorem settles the question: commission the audit, since information cannot make you worse off."

  - **Decision Theorist Verdict:** **False** (the theorem does not apply).  
    - **Why?** The audit violates two core assumptions of Good’s theorem:  
      1. **Problem invariance:** Publishing the audit forces mandatory responses (altering the acts available to the regulator).  
      2. **No exogenous effects:** The *act of commissioning* the audit changes behavior of courts/insurers/firms (changing utilities), and the regulator cannot "ignore" the result.  
    - **Specific failures:**  
      - Pre-audit, the regulator has flexible acts (e.g., "license with conditions").  
      - Post-audit, mandatory rules restrict acts (e.g., "if audit fails, revoke license").  
      - Utilities change due to others’ reactions (e.g., insurers raising premiums if an audit is commissioned).  
    - **Result:** The regulator may rationally decline the audit to:  
      - Preserve optionality (avoid mandatory rules).  
      - Prevent harmful exogenous effects (e.g., market panic).  

  #### **How to Bring the Audit Within the Theorem**
  - **Requirement:** The regulator must be able to:  
    (i) Ignore the audit result (no mandatory responses),  
    (ii) Commit to acts independent of commissioning (no behavioral changes by others).  
  - **Revision Suggestion:** If the regulator can suppress the audit result and avoid mandatory rules, the theorem applies. Otherwise, the scenario is outside Good’s scope.  

  ---

  ### **Summary of Issues and Recommendations**
  | **Claim**                                                                 | **Verdict**       | **Key Issue/Correction**                                                                                               |
  |---------------------------------------------------------------------------|-------------------|-------------------------------------------------------------------------------------------------------------------------|
  | Good’s theorem for Bayesian EU maximizers                                 | Accepted          | Add: "Assumes no changes to acts/utilities from information."                                                          |
  | Robustness to prior probabilities                                         | Accepted          | —                                                                                                                       |
  | Robustness to maximin                                                     | False             | Provide counterexample; clarify need for "rectangular" priors.                                                          |
  | Declining free info is irrational/mistaken                                | Overstated/Conflated | Distinguish nuisance costs from structural changes to decision problem; acknowledge ambiguity cases.                 |
  | Stopping rule (EVI > cost)                                                | Overstated        | Specify: "Valid for myopic, independent tests; may not hold sequentially or under ambiguity."                        |
  | Audit falls under Good’s theorem                                          | False             | Audit violates problem-invariance (mandatory rules, exogenous effects).                                               |

  #### **Recommendations for Revision:**
  1. **Clarify assumptions:** Explicitly state that Good’s theorem requires:  
     - Bayesian updating.  
     - No change to acts, outcomes, or utilities from information.  
     - Utilities defined solely over outcomes (no belief-dependent utilities).  
  2. **Qualify maximin claim:** State that EVI can be negative for ambiguity-averse DMs unless priors are rectangular. Include the counterexample.  
  3. **Refine consequences:**  
     - Consequence 1: Acknowledge that refusal can be rational if information alters the decision problem or under ambiguity.  
     - Consequence 2: Add that the stopping rule assumes myopic independence.  
  4. **Audit application:** Withdraw the claim that Good’s theorem applies. Analyze how:  
     - Mandatory rules change the act space.  
     - Exogenous effects (from commissioning/publishing) alter utilities.  
     Suggested fix: Model this as a game with signaling or use a framework for endogenous information costs (e.g., rational inattention).  

  By addressing these points, the paper can accurately situate Good’s theorem and its limitations, strengthening the policy analysis.
