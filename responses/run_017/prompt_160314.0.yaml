  The user wants a dialogue where both viewpoints clash rigorously. Key requirements: 
  - Debate what's owed (to the dead woman? descendants? readers? history?) and whether novelists owe the same as biographers. 
  - Address the asymmetry objection: Why is flattering invention okay if unflattering isn't? 
  - Wrestle with whether "borrowing" interiority can be "repaid" by giving coherent motivation. 
  - Force mutual concessions. 
  - Culminate in deciding what can/cannot be written for the letter-writing scene, naming one forbidden line. 

  First, structure the dialogue's spine: 
  1. **Friend (Sealed Room advocate)** opens by challenging the cousin device as a false compromise. Archives aren't puzzles to solve but boundaries to respect. Debt is to the subject's autonomy. 
  2. **User (Borrowed Interiority advocate)** counters that motivationless acts in history dehumanize; debt is to future readers needing coherence. 
  3. **Asymmetry objection raised by Friend**: Both flattering/unflattering inventions steal agency. User argues flattery erases struggle while their method honors it. 
  4. **Repayment debate**: User insists giving psychological coherence "repays"; Friend retorts that coerced "gifts" violate dignity. 
  5. **Concessions**: 
     - *Friend concedes* the cousin device at least signals fiction (unlike omniscient narration). 
     - *User concedes* the diary gap itself is meaningful and should haunt the text. 
  6. **Climax on the letter-writing night**: 
     - Friend forbids any line claiming to know "why she wrote it." 
     - User insists on depicting physical acts (crumpling paper, trembling) but not thoughts. 

  Now, distill the core conflict: 
  - Friend sees the gap as a *tomb* (sanctity in silence). 
  - User sees it as a *wound* (obligation to heal narratively). 

  The forbidden line must crystallize this: e.g., "She knew, as her pen touched paper, that this would redeem her brother's victims." Why? It claims knowledge of redemption—a moral certainty the archive doesn't provide. 

  Sharpening concessions: 
  - User's use: Friend admitting the cousin "flags invention" helps deflect criticism about misleading readers. 
  - Friend's use: User acknowledging the gap's weight means the text won't gloss over its absence. 

  Finally, ensure every speech rebuts the last. No straw men. For example: 
