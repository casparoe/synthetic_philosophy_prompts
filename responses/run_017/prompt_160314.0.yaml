answer: |-
  ### Dialogue: The Kitchen Table Debate  
  **Setting:** Rain against the windows. Empty coffee cups between stacks of manuscript pages.  

  **FRIEND** (leaning forward, tapping the draft):  
  You’ve built her a confessional booth with this cousin—a witness who never breathed. But archives aren’t scaffolding for your imagination. That three-year silence isn’t a void to fill; it’s *evidence*. Evidence she chose not to speak. What we owe the dead isn’t coherence—it’s fidelity to their autonomy. To stage her withholding is to honor her. You owe *her* that. Not descendants, not readers. Her. Because she’s the one we drag onto the stage.  

  **YOU** (pushing a page across the table):  
  But autonomy without context is a relic under glass. That letter wasn’t static—it was an act. If we refuse to render her inner life legible, we flatten her into a silhouette. I owe readers the gravity of choice. Not just the *what* of history, but the *why* that makes it human. The biographer owes the record; the novelist owes the echo. My debt isn’t to facts—it’s to meaning.  

  **FRIEND** (coldly):  
  Then answer the asymmetry. If I invented her weeping over orphans, you’d call it sentimental theft. But you invent her whispering doubts to your cousin about her brother’s corruption, and call it illumination. Why is one theft and the other a gift? Both are coins you mint and put in her pocket.  

  **YOU** (hand slicing air):  
  Because flattery erases struggle. It makes her a saint, not a person. I borrow interiority to show her wrestling—the sweat and doubt before the public act. That letter scorched her life. If I paint her serene, I erase her cost. If I paint her conflicted, I honor it. Theft isn’t in borrowing; it’s in denying her complexity.  

  **FRIEND** (leaning back):  
  Ah, but you say you *repay* the loan by giving her coherence. As if motivation were a debt she owed history and you’re settling it for her. But she didn’t ask for your currency. Your “repayment” is just another unauthorized deposit. A biographer’s duty is to the verifiable; yours is to the plausible. Don’t conflate them.  

  **YOU** (fingers drumming the table):  
  Plausibility *is* the repayment. The archive shows her silent, then explosive. If I leave that chasm empty, I imply her act was arbitrary—a lightning strike. But if I show the pressure building in the cracks, I give her back her humanity. You’d cage her in the sealed room and call it respect. I open the door so we hear her breath.  

  **FRIEND** (softening, almost weary):  
  ...Fine. I’ll concede your cousin signals invention. A fig leaf for the reader: “Here be dragons.” It doesn’t absolve you, but it flags the trespass.  

  **YOU** (nodding slowly):  
  And I’ll concede the gap itself must haunt the text. The missing diaries should shadow every scene—her awareness of what she won’t record.  

  **FRIEND** (eyes sharpening):  
  Now the night before the letter. What do you put on the page?  

  **YOU:**  
  She sits at her desk. The cousin asks if she’s sure. She doesn’t answer. We see her fingers tremble. She burns a draft. We don’t know why. We hear the clock. We see her open a drawer where the diaries aren’t. The cousin leaves. She picks up the pen.  

  **FRIEND:**  
  And the line you cannot write—  

  **YOU:** —is any version of: *“She finally understood this would break her world, but it was the only truth left.”*  

  **FRIEND:**  
  Exactly. Because that isn’t borrowed interiority. It’s foreclosure. You claim to know the weight she assigned her choice. The one thing the dead keep is their why. Leave it in the sealed room.  

  **YOU** (standing, gathering pages):  
  So you’d have her sit in the dark, silent.  

  **FRIEND** (quietly):  
  No. I’d have you write the dark. And the silence.  

  *(The disagreement sharpens to this: You will stage the act of withholding; she demands you never name its content. The line you cannot write claims ownership of her reckoning. The dead own their reasons; the novelist owns only the shadow they cast.)*  

  ---  
  **Key Resolutions:**  
  - **What is owed?** Friend: To the subject (autonomy). You: To the reader (narrative humanity).  
  - **Asymmetry objection:** Both agree invention is invention—but Friend argues all invention violates, while You argue *dissonant* invention (flattery/defamation) distorts, whereas *aligned* invention (struggle) dignifies.  
  - **Borrowing repaid?** You: Yes, via coherence. Friend: No; repayment is another imposition.  
  - **Novelist vs. Biographer:** Friend: Biographer owes facts; novelist owes ambiguity. You: Biographer owes evidence; novelist owes empathy.  
  - **Concessions:** Friend accepts the cousin as a "fiction flag"; you accept the gap as a visible absence.  
  - **The Forbidden Line:** Any assertion of *why she understood* her act. Physicality yes; epistemology no.
