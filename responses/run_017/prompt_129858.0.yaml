prompt: |-
  I teach an upper-level undergraduate course in philosophy of medicine. I have one 75-minute session, 18–24 students, and I want them to feel the force of the dispute between naturalist and normativist accounts of health and disease from the inside, before anyone names the two families of view.

  Design a committee simulation in which the class acts as a body deciding what to put in a revised disease classification. Split them into panels of three or four; each panel receives the same dossier of four candidate conditions and a private role card stating an institutional stake (insurer, patient-advocacy group, research funder, occupational-health regulator, disability-rights organisation, textbook editor). Roles are secret and must not be revealed during deliberation.

  Build the dossier so that the naturalist and normativist pulls come apart, using cases I have not been able to find in the literature: (1) a trait present in roughly 70 percent of the population that lowers a measurable capacity relative to the individual's own earlier baseline while remaining statistically typical; (2) a variant that is statistically atypical now and impairs function relative to present peers, but was well suited to the environment most of the population lived in two generations ago and remains so in a sizable minority; (3) a state that causes no distress, no reduced function and no raised mortality by itself, but sharply raises the risk of a serious outcome only in combination with a common and easily avoided behaviour; (4) a condition that degrades one statistically normal capacity while enhancing another, so that net functional contribution is genuinely unclear.

  Each panel files a two-part ballot for every case: first a descriptive judgment about whether there is a departure from normal functioning, then a classificatory judgment about whether it belongs in the manual. Panels also wager points on how the other panels will vote. Give me materials, a scoring scheme with no real money, and a timeline.

  The debrief should map the divergence in ballots onto the two accounts, including the divergence in the supposedly descriptive answers and what that shows about reference classes and levels of functional description. Tell me what will predictably go wrong on a first run and how to handle it, and be honest about which feature of the dispute the game cannot stage and the facilitator has to argue for explicitly.
reasoning: |-
  We are designing a committee simulation for a philosophy of medicine class to explore naturalist vs. normativist accounts of health and disease without naming them initially. The class is split into panels of 3-4 students, each with a secret institutional role. There are four candidate conditions. Each panel will vote on each condition and wager on other panels' votes.

  Materials:
  1. Role cards (one per panel, kept secret): Insurer, Patient-Advocacy Group, Research Funder, Occupational-Health Regulator, Disability-Rights Organisation, Textbook Editor.
  2. Dossier (same for every panel) with four candidate conditions (described below).
  3. Ballot sheets for voting (two parts per condition: descriptive and classificatory).
  4. Wagering sheets for each condition to predict the overall class vote (for the classificatory judgment).

  Dossier Cases:

  Case 1: "Diminished Baseline Capacity"
  - Trait: Present in about 70% of the population.
  - Description: Individuals with this trait show a measurable decline in a specific cognitive processing speed (measured by standardized tests) relative to their own baseline from 10 years ago. However, the current level is still within the statistically typical range for the current population (i.e., within 1 standard deviation of the mean). There is no known pathology. The decline is associated with normal aging but occurs at a younger age than traditionally expected (e.g., starting in the late 30s). 
  - Naturalist pull: There is a measurable decline in function relative to the individual's own past, but it is still typical for the current population.
  - Normativist pull: It's common and typical, so maybe not a disease. But if it causes problems for the individual (e.g., in high-demand jobs) then it might be considered a disease.

  Case 2: "Historical Mismatch"
  - Trait: A genetic variant that is now statistically atypical (only 5% of the population) and impairs glucose metabolism in the context of a modern high-calorie diet, leading to increased risk of type 2 diabetes and cardiovascular disease. However, two generations ago, when the majority of the population lived in conditions of food scarcity and high physical activity, this variant was advantageous (promoted efficient energy storage and use) and was present in 40% of the population. Today, a sizable minority (about 15%) of the global population lives in conditions of food scarcity and high physical activity, and in that environment, the variant remains advantageous.
  - Naturalist pull: In the current environment, it impairs function and is atypical. However, in the environment it was adapted to, it was functional and typical.
  - Normativist pull: Should we label it a disease when it is only harmful in certain environments? What about the populations where it is still beneficial?

  Case 3: "Silent Risk Factor"
  - Trait: A genetic variant that, by itself, causes no symptoms, no functional impairment, and no increased mortality. However, when combined with a common and easily avoided behavior (e.g., consuming a specific type of artificial sweetener found in many diet sodas), it sharply increases the risk (e.g., 10-fold) of a serious autoimmune disease. The behavior is easily avoided because the sweetener is not essential and alternatives exist. The variant is present in about 20% of the population.
  - Naturalist pull: There is no dysfunction without the environmental trigger. But the variant is part of the individual's biology that, in a common context, leads to disease.
  - Normativist pull: Without the trigger, there is no harm. Should we label the variant as a disease state? Or only when the trigger is present? This might encourage avoidance of the trigger.

  Case 4: "Trade-off Trait"
  - Trait: A neurodevelopmental variant (atypical, present in about 1% of the population) that degrades the ability to recognize social cues (e.g., facial expressions) but enhances the ability to detect patterns and details in complex systems. The net functional contribution is unclear because in some contexts (e.g., social work) it is impairing, but in others (e.g., engineering, data analysis) it is enhancing. There is no distress reported by individuals with the trait unless they are forced into social roles. The trait is associated with both challenges and strengths.
  - Naturalist pull: There is a departure from typical functioning in social cognition, but an enhancement in another domain. Overall, is there a dysfunction?
  - Normativist pull: The classification might depend on the environment and the individual's goals. Should we label it as a disease if it can be an advantage in some contexts?

  Ballot Structure:
  For each case, the panel must vote in two parts:
  1. Descriptive judgment: "Is there a departure from normal functioning?" (Yes/No/Unclear)
  2. Classificatory judgment: "Should this condition be classified as a disease in the revised manual?" (Yes/No/Abstain)

  Wagering:
  For each case, each panel will wager (using play points) on the outcome of the class-wide classificatory vote. They predict the percentage of panels that will vote "Yes" (rounded to the nearest 10%). They wager up to 10 points per case. If their prediction is within 10 percentage points of the actual result, they gain the points wagered. If not, they lose the points.

  Scoring:
  - Each panel starts with 40 points.
  - They can wager 0 to 10 points for each case (four cases total).
  - After voting, points are updated based on wagering success.

  Timeline (75 minutes):
  1. Introduction and Setup (5 min): Explain the committee task and the voting procedure. Emphasize that roles are secret and should influence their thinking but not be revealed. Split into panels (6 panels of 3-4 students). Distribute role cards and dossiers.

  2. Panel Deliberation (30 min): Panels discuss each case and come to a consensus (or vote if necessary) on the two-part ballot. They also decide on their wagering for each case.

  3. Voting and Wagering Collection (5 min): Collect ballots and wagering slips.

  4. Tallying and Interim Break (5 min): The instructor tallies the votes and wagering results. (While tallying, panels can take a break.)

  5. Results Announcement and Class Discussion (15 min): Reveal the class-wide votes for each case (both descriptive and classificatory) and the wagering outcomes. Then, open the floor for initial reactions.

  6. Debrief (15 min): The instructor leads a discussion mapping the divergence in ballots onto naturalist and normativist accounts. Highlight:
     - How the same condition was viewed differently by different panels (due to roles, though roles are still secret) and how that reflects normativist elements.
     - The divergence in descriptive judgments: What counts as "normal functioning"? (e.g., Case 1: normal relative to current population or to one's own past? Case 2: normal relative to which environment? Case 3: without the trigger, is there dysfunction? Case 4: how to aggregate functions?).
     - The fact that even the descriptive judgment is not value-free: reference classes and levels of functional description are chosen based on values.
     - The classificatory judgments: when there was disagreement between descriptive and classificatory votes (e.g., in Case 1, a panel might say there is a departure from normal functioning but vote against classification because it's too common; or in Case 3, no departure but they vote to classify because of the risk).

  7. Role Revelation and Final Reflection (Optional, if time): Reveal the roles and ask how their role might have influenced their thinking. (But if time is short, skip to the key philosophical point.)

  Predictable Problems and Handling:
  - Problem: Panels might get stuck on one case and run out of time. Solution: Encourage them to set time limits per case (about 7 minutes per case).
  - Problem: Students might not understand the cases. Solution: Provide clear written descriptions and be available for questions during deliberation.
  - Problem: Wagering might be confusing. Solution: Explain with an example: "If you wager 5 points on 60% and the actual yes-vote is 55%, you gain 5. If it's 75%, you lose 5."
  - Problem: Roles might be revealed. Remind them that the exercise requires secrecy to avoid role-playing and instead have implicit influence.
  - Problem: Disagreement within a panel. They can vote internally and then report a majority vote, or if tied, they can mark "unclear" for the descriptive and "abstain" for the classificatory.

  What the Game Cannot Stage:
  The game stages the influence of values in the descriptive judgment (by showing how reference classes and functional levels are chosen) and the classificatory judgment (by showing how the same facts lead to different decisions). However, it cannot easily stage the naturalist claim that there is a value-free biological dysfunction. The naturalist would argue that the descriptive judgment should be value-free and then the classificatory might be value-laden. But in the game, even the descriptive judgment is contested. The facilitator must explicitly argue that the naturalist tries to define dysfunction without values (e.g., by appealing to evolutionary fitness or statistical normality in a relevant reference class) and then the normativist counters that the choice of reference class and the level of description are value-laden.

  Debrief Points:
  - Highlight the divergence in descriptive judgments to show that what counts as "normal functioning" is not straightforward and depends on normative choices (e.g., time frame, environment, which function to prioritize).
  - Point out that the classificatory judgments often diverge even when the descriptive ones agree, showing that the decision to label as disease is value-laden.
  - Note that roles (though secret) likely influenced the choices of reference class and the weight given to different functions. This is the normativist insight.
  - Conclude by naming the two accounts: naturalism (health as absence of biological dysfunction, which is value-free) and normativism (health and disease concepts are inherently value-laden). The exercise shows that even the "descriptive" part is value-laden, undermining the naturalist claim.

  Materials to Prepare:
  - Role cards (6 different, one per panel).
  - Dossiers (same for all, with the four cases).
  - Ballot sheets (with the four cases, two questions each).
  - Wagering sheets (for each case, a place to write the predicted % and the points wagered).
  - Tally sheet for instructor.
  - Scoreboard (to track panel points).

  This design should create a lively session where students experience the tension between the two accounts and set up a rich debrief.
answer: |-
  ### Committee Simulation: Disease Classification Revision  
  **Objective:** Engage students in the normative vs. naturalist tension in defining disease without naming the frameworks. Focus on experiential learning through deliberation, voting, and wagering.  

  ---

  ### **Materials**  
  1. **Role Cards (6 types, 1 per panel):**  
     - **Insurer:** *Goal: Minimize long-term costs. Favor classifications that reduce expensive treatments or preventable conditions.*  
     - **Patient-Advocacy Group:** *Goal: Maximize access to care. Support classifications that validate patient experiences and enable treatment.*  
     - **Research Funders:** *Goal: Prioritize scientific innovation. Favor classifications that open avenues for grant-funded research.*  
     - **Occupational-Health Regulator:** *Goal: Ensure workplace safety. Support classifications that prevent occupational hazards.*  
     - **Disability-Rights Organisation:** *Goal: Combat stigma. Oppose classifications that pathologize non-harmful differences.*  
     - **Textbook Editor:** *Goal: Ensure clarity and consistency. Prefer classifications with unambiguous biological markers.*  

  2. **Dossier of Candidate Conditions (identical for all panels):**  
     - **Case 1: Age-Related Cognitive Processing Shift (ARCPS)**  
       - *Description:* A neurodevelopmental shift appearing in ~70% of adults by age 45. Reduces processing speed by 15% relative to the individual’s baseline at age 25, but remains within the statistically typical range for the current population. No distress or functional impairment reported in daily life.  
       - *Naturalist/Normativist Tension:* Decline from personal baseline (naturalist pull) vs. statistical typicality and lack of harm (normativist pull).  

     - **Case 2: Glucose Metabolism Adaptation (GMA)**  
       - *Description:* A genetic variant (now present in 5% of the population) impairing glucose metabolism in modern sedentary environments, increasing diabetes risk. Two generations ago, it was prevalent (30%) and advantageous in agrarian societies. Today, it remains adaptive in 15% of the population living in rural/active environments.  
       - *Tension:* Current dysfunction/atypicality (naturalist) vs. environmental relativity and historical benefit (normativist).  

     - **Case 3: Sweetener-Triggered Autoimmunity Risk (STAR)**  
       - *Description:* A gene variant (20% prevalence) causing no symptoms, functional loss, or mortality alone. When combined with daily artificial sweetener consumption (easily avoidable), it increases autoimmune disease risk by 500%.  
       - *Tension:* Latent biological risk (naturalist) vs. harm dependency on avoidable behavior (normativist).  

     - **Case 4: Perceptual-Cognitive Trade-off (PCT)**  
       - *Description:* A neurocognitive variant (1% prevalence) reducing social-emotional recognition (e.g., identifying facial expressions) while enhancing pattern-detection abilities (e.g., data analysis). Net functional impact is context-dependent: harmful in social occupations, beneficial in technical fields. No inherent distress.  
       - *Tension:* Degraded "normal" social function (naturalist) vs. net functional ambiguity and contextual benefit (normativist).  

  3. **Voting Materials:**  
     - **Ballot Sheet (per panel):**  
       ```markdown
       | Case | Descriptive Judgment: "Is there a departure from normal functioning?" (✅ Yes / ❌ No / ⚠️ Unclear) | Classificatory Judgment: "Should this be classified as a disease?" (✅ Yes / ❌ No / 🤷 Abstain) |  
       |------|---------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------|  
       | ARCPS|                                                                                             |                                                                                                |  
       | GMA  |                                                                                             |                                                                                                |  
       | STAR |                                                                                             |                                                                                                |  
       | PCT  |                                                                                             |                                                                                                |  
       ```  
     - **Wagering Sheet (per panel):**  
       *"Wager points on the % of panels that will vote YES for classification. Predict within 10% to win."*  
       ```markdown  
       | Case | Wagered Points (0-10) | Predicted % of "Yes" Votes |  
       |------|-----------------------|----------------------------|  
       | ARCPS|                       |                            |  
       | GMA  |                       |                            |  
       | STAR |                       |                            |  
       | PCT  |                       |                            |  
       ```  

  4. **Scoring System (Play Points):**  
     - Each panel starts with **40 points**.  
     - **Wagering:** For each case, panels wager 0–10 points. Win wagered points if prediction is within ±10% of the actual "Yes" vote percentage; lose them if outside.  
     - **No real money:** Points track "influence" for bragging rights. Highest score "wins" the simulation.  

  ---

  ### **Timeline (75 Minutes)**  
  1. **Setup (5 min):**  
     - Divide students into 6 panels (3–4 students each).  
     - Distribute identical dossiers and **secret role cards**. Emphasize: *"Roles are confidential. Deliberate based on your institutional stake, but do not reveal it."*  

  2. **Panel Deliberation (30 min):**  
     - Panels discuss all four cases. Encourage consensus (or majority vote if deadlocked).  
     - **Guiding Questions:**  
       - *"What counts as ‘normal functioning’ here? Statistical norms? Individual baselines? Environmental fit?"*  
       - *"Does harm require current impairment, or is risk enough?"*  
       - *"How do we weigh functional trade-offs?"*  
     - Panels complete ballots and wagering sheets.  

  3. **Voting & Wagering (5 min):**  
     - Collect ballots and wagering sheets.  

  4. **Tally & Interim Break (5 min):**  
     - Instructor tallies:  
       - **Descriptive votes** (Yes/No/Unclear) and **classificatory votes** (Yes/No/Abstain) per case.  
       - Computes % of "Yes" votes for classification per case.  
     - Update scores based on wagering.  

  5. **Results & Initial Discussion (15 min):**  
     - Reveal voting results:  
       - Show **descriptive vs. classificatory votes** for each case (e.g., *"For ARCPS: 4 panels said ‘departure,’ but only 2 voted to classify as disease"*).  
       - Announce **wagering outcomes** and updated scores.  
     - **Prompt:** *"What patterns do you see? Where did descriptive and classificatory judgments diverge? Why?"*  

  6. **Structured Debrief (15 min):**  
     - **Map Votes to Philosophical Accounts:**  
       - **Naturalist account:** Focus on *biological dysfunction* (e.g., ARCPS’s baseline decline; GMA’s metabolic impairment).  
       - **Normativist account:** Focus on *harm/adaptiveness* (e.g., STAR’s avoidable risk; PCT’s contextual benefits).  
     - **Key Divergence:**  
       - **Descriptive judgments:** Disagreements reveal value-laden reference classes (e.g., ARCPS: personal baseline vs. population norm? GMA: current environment vs. ancestral?).  
       - **Classificatory judgments:** Show how values shape disease labels (e.g., PCT classified as disease if social function is prioritized; STAR rejected if behavior is controllable).  
     - **Critical Insight:** *"The ‘descriptive’ judgment isn’t neutral—it hinges on normative choices about what ‘normal function’ means."*  
     - **Reveal Roles:** Discuss how stakes influenced decisions (e.g., insurers vs. patient advocates on STAR).  

  ---

  ### **Predictable Problems & Solutions**  
  - **Problem:** Panels deadlock or rush deliberation.  
    - *Solution:* Assign a timekeeper per panel. Provide a timer: 7 min/case.  
  - **Problem:** Students reveal roles or debate abstract theory.  
    - *Solution:* Intervene gently: *"Stick to your institutional goals, not philosophy labels."*  
  - **Problem:** Wagering distracts from deliberation.  
    - *Solution:* Frame it as "testing your understanding of others’ perspectives."  
  - **Problem:** Descriptive votes cluster (e.g., all "Unclear" for PCT).  
    - *Solution:* Use this! *"Why was ‘normal function’ hardest to define for PCT?"*  

  ---

  ### **Limitation of the Simulation**  
  **What the Game Cannot Stage:**  
  The simulation cannot fully replicate the **naturalist claim that biological dysfunction is objective and value-free**. Students will experience how values permeate *both* descriptive and classificatory judgments (e.g., choosing reference classes for "normal"). This risks implying naturalism is incoherent.  

  **Facilitator’s Explicit Argument:**  
  In debrief, explicitly state:  
  *"Naturalists argue dysfunction can be defined objectively (e.g., via evolutionary fitness or statistically species-typical design). But this simulation shows how even ‘description’ involves normative choices—like which reference class or functional level matters. Normativists say this proves values are inescapable; naturalists reply that we can still isolate biological facts from social judgments. This tension is unresolved."*  

  ---

  ### **Educational Payoff**  
  Students will:  
  1. **Feel the tension** through role-based disagreements.  
  2. **Discover** how values shape "descriptive" biological judgments.  
  3. **Debate** reference classes, harm thresholds, and net functionality.  
  4. **Enter the philosophy** through lived experience, setting up deeper textual analysis.  

  **Final Tip:** Run the simulation *before* assigning readings on Boorse (naturalist) vs. Engelhardt/Nordenfelt (normativist). The visceral debate primes theoretical engagement.
