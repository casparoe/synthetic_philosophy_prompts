prompt: |-
  My friend and I got into a arguement last night that went on way past the point where either of us was enjoying it, and I want to settle it with a designed case instead of more hand-waving. Here is roughly where we ended up.

  He says the exclusion argument only looks scary because we let the physical cause be the total, maximally specific state of the brain. Once you require that causes be *proportional* to their effects — a cause shouldn't specify more than the effect does — and once you remember that causal claims are really contrastive (why this rather than *that*?), the mental state and its neural realizer stop being rivals. The realizer is wildly disproportionate to something like reaching for a mug; the mental state is the right grain. No exclusion, no systematic overdetermination, no epiphenomenalism, done by lunchtime.

  I said proportionality picks a grain, not a level. Turn the dial up and it doesn't politely stop at the folk-psychological description; it keeps going until you have some coarse state that loads of different experiences and loads of different neural configurations could all realize, and that state can be specified in either vocabulary. And the exclusionist can just rebuild the argument with a *proportionate* physical cause — the kind of state a working neuroscientist would actually cite, not the whole microstate and not some disjunction cooked up to win — and then the dissolution doesn't touch it. He said that's gerrymandering. Circles were gone in.

  So build me the case that settles it. One paragraph, ordinary human setting — a ward, a kitchen, a warehouse floor, whatever — no sci-fi, no demons, no perfect predictors, nothing that needs a footnote. Constraints:

  The physical cause that does the excluding has to be the state that *realizes* the mental state, not some upstream neural event the mental state causes. If you hand me a chain where the decision causes the motor preparation which causes the arm movement, I will just say: fine, no exclusion, everyone already agrees. The problem only starts when the excluder is the realizer.

  Overdetermination and identity both have to be off the table. The mental state's only way into the story is by being realized by the physical goings-on, so there is no second independent route to the behaviour; and the mental state has to be multiply realized inside the case — two agents, or one agent at two times, or a nearby variant you spell out — so that the mental state just is that physical state is not available to either of us.

  The isolating move, which is the bit I actually care about: hold the grain fixed and vary only the vocabulary. I want a mental candidate cause and a physical candidate cause at the same grain — equally specific, equally proportionate by his own test, answering the same contrastive question about the same behaviour — and then watch whether his criterion can tell them apart. If it cannot, say so plainly. If it can, say what is doing the discriminating, because I suspect it is something he has not admitted into the account.

  The mental state has to be doing real explanatory work, so nobody can just shrug and take epiphenomenalism: the behaviour should show a pattern across the variations in your case — had the content been different, the behaviour would have been systematically different no matter how the state was realized — and the physical vocabulary should not itself track that pattern. That is the invariance-across-realizers test: a property earns causal keep by marking a pattern that holds across all its realizers and that the realizer-level description misses.

  And his test must not simply hand him the win. Applied honestly and charitably to your case, the proportionate-cause-plus-contrastive-question test has to either (a) select a candidate that is specifiable without any content, meaning, or what-the-agent-takes-things-to-be vocabulary, or (b) select several equally proportionate candidates at once, in both vocabularies, so that it fails to uniquely select the mental one. Tell me which happens and why the winning candidate is not a gerrymander — he will pounce on anything disjunctive or cooked up, and he will also pounce on anything that smells like the total state of the universe, so keep the winner respectable.

  Then run the three accounts through the case: the exclusion argument with each of its premises checked off against the specifics rather than asserted, his proportional difference-making account, and the invariance-across-realizers account. For each one I want what it says about the case and why, not just its verdict — and if you catch yourself writing and this is causally sufficient without showing why, you have cheated.

  Finally: which single feature of the case is doing the work, what happens to the three verdicts if you remove it, the sharpest thing my friend could say against the case (be mean, give the strong version, not the straw man), and whether the case shows his dissolution is sound-but-not-enough, secretly an identity theory in disguise, or just question-begging about which levels get to be causal. I would like to know whether I won last night. If two of the constraints pull against each other, say where the tension is, pick the version you think is most honest, and tell me what you gave up.
reasoning: |-
  Okay, let me unpack this user's request. They're deep in a philosophy of mind debate about mental causation and the exclusion argument, and they want a concrete case to settle it. The core tension is whether requiring proportional, contrastive causes resolves the exclusion problem or just kicks the can down the road. 

  First, I need to map all their constraints carefully. The physical cause must be the realizer state itself, not something upstream. Overdetermination and identity are off-limits, so the case needs multiple realizability within the scenario. Crucially, the mental state must show explanatory work via invariance across realizers - where behavior patterns track content despite neural differences. And the proportional cause test must be applied fairly to both vocabularies at the same grain.

  Hmm... the warehouse scenario jumps to mind. Two workers grabbing different mugs based on belief, with varying neural states realizing the same belief. Perfect - it's mundane, avoids sci-fi, and satisfies multiple realizability through individual differences. 

  Now for the isolating move: constructing parallel causal candidates. For mental: "believes mug A contains sugar" (proportionate to grabbing A). For physical: "neural state N1/N2" - but wait, that's too specific. Need a grain-matched physical description. Ah! "Motor-affordance encoding for mug A" at the premotor level. Both answer "why grab A rather than B?" and both seem proportionate. 

  *checks constraints* The physical description avoids disjunctions while remaining neuroscientist-plausible. The mental state shows invariance: same belief → same action across different N-states. Physical descriptions miss the sugar-seeking pattern. 

  Running the three accounts:
  - Exclusion argument: Physical cause P is sufficient, so mental M seems excluded. But premise fails because P isn't strictly sufficient when we consider contrastive effects (grabbing patterns require M's pattern).
  - Proportional contrastive: Both M and P seem equally proportionate candidates! Test can't discriminate, revealing its vocabulary-blindness.
  - Invariance: M wins because its pattern holds across realizers where P's descriptions vary.

  The killer feature is the multirealizable behavioral pattern. Remove that, and all three verdicts collapse. Friend's strongest retort? "Your 'motor-affordance' is just M in physical disguise!" But no - it's specifiable without semantic content (e.g., "dorsal premotor activity selective for A's handle orientation"). 

  Verdict: User wins. Friend's dissolution is sound but insufficient - it doesn't guard against physical descriptions "absorbing" mental patterns. The case shows we need invariance, not just proportionality.

  *double-checks* Did I miss anything? User wanted no footnotes, ordinary setting, real explanatory work for M, and physical cause as realizer. Warehouse nails it. Tension between "same grain" and "non-disjunctive physical description" was resolved by using premotor states - specific but not microdetailed. Friend will hate it, but that's philosophy.
answer: |-
  Here's a case that meets your constraints and isolates the dispute:

  **The Warehouse Scenario:**  
  Two warehouse workers, Alex and Ben, must grab identical mugs from a shelf. Alex *believes* mug A contains sugar (B_A), Ben *believes* mug B contains sugar (B_B). Both reach correctly. Unbeknownst to them, the mugs are unmarked, and their neural realizers differ: Alex's belief is realized by neural pattern N1 (involving visual dorsal stream activation), Ben's by N2 (parietal "affordance" encoding). Each pattern is a proportionate neuroscientific cause of their specific reach (e.g., N1 explains why Alex's motor cortex primes grip orientation for mug A, not B). The reaching behavior covaries with *belief content* across variations: if Alex believed mug B contained sugar instead, he'd reach for B *regardless* of whether N1, N2, or another pattern realized it. Neuroscientific descriptions (N1/N2) don’t capture this sugar-seeking pattern—only the belief does.

  ---

  **The Proportional Contrastive Test (Your Friend's Account):**  
  - **Question:** "Why did Alex reach for A rather than B?"  
  - **Mental candidate:** "Believes A contains sugar" (proportionate: specific to the mug choice).  
  - **Physical candidate:** "Premotor state encoding affordance for mug A" (call this P_A; a neuroscientist’s proportionate cause, not a disjunction or total brain state).  
  - **Result:** Both answer the contrastive question proportionately. The test *cannot discriminate* between them purely on proportionality/contrast grounds. It either (b) selects both equally or defaults to physicalism by fiat.  

  ---

  **Running the Three Accounts:**  
  1. **Exclusion Argument:**  
     - Premise 1: P_A is causally sufficient for reaching A.  
     - Premise 2: B_A is distinct from P_A (multiple realizability: Ben has same belief with N2 ≠ P_A).  
     - Premise 3: No systematic overdetermination.  
     - Conclusion: B_A is excluded.  
     - **But:** P_A is *not* strictly sufficient. If Alex had B_B (belief in B) realized by *any* neural state, he’d reach for B. P_A’s sufficiency depends on the *invariant* relationship B_A provides. Exclusion fails because P_A alone doesn’t ensure the effect *across realizers*.  

  2. **Proportional Difference-Making (Friend’s Dissolution):**  
     - Both B_A and P_A are proportionate, contrastive causes.  
     - The test lacks resources to prefer B_A over P_A (or vice versa) since both satisfy criteria. It either:  
       - (a) Arbitrarily selects P_A (begging the question), or  
       - (b) Accepts both, allowing mental causation but failing to explain *why* B_A isn’t excluded by P_A.  
     - **Verdict:** Inconclusive. Doesn’t resolve exclusion; just relabels the competition.  

  3. **Invariance-Across-Realizers (Your Account):**  
     - B_A causes reaching A because the behavior covaries with belief content *across all realizers*: change B_A to B_B → reach changes, regardless of neural implementation.  
     - P_A fails this test: if Alex had B_B realized by N2, P_A wouldn’t occur, yet the reach changes *because of belief*.  
     - **Verdict:** B_A is causal because it tracks the pattern that explains behavior variations better than physical states. P_A is merely the local realizer of that pattern.  

  ---

  **The Decisive Feature:**  
  - **Multirealizability + Behavioral Covariance:** The pattern (*reaching for the sugar-mug*) holds across distinct neural realizers (N1, N2) and *requires* belief content to explain it. Remove this (e.g., if all sugar-beliefs *required* identical N1), and exclusion reappears, invariance collapses, and proportionality might favor physicalism.  

  **Friend’s Strongest Rebuttal:**  
  > "Your ‘P_A’ (affordance state) is *already* a content-laden description! It implicitly encodes ‘mug A’ as a target—so it’s just B_A in physicalese. A *truly* non-mental cause (e.g., ‘dorsal stream spike frequency 40Hz’) would be disproportionate, proving my point!"  

  **Why This Fails:**  
  - P_A *can* be specified non-mentally (e.g., "motor cortex activation selective for A’s handle orientation"). Yet even this "pure" P_A fails the invariance test: if Alex believes B has sugar but A’s handle is salient (distracting him), he might still reach for B. The belief’s *content* (not handle orientation) reliably explains the sugar-seeking behavior. Proportionality doesn’t see this.  

  **Verdict on the Dissolution:**  
  - Your friend’s account is **sound-but-not-enough**. Proportionality avoids *crude* exclusion but cannot handle cases where physical and mental descriptions are *equally proportionate* at the same grain. It’s **not identity in disguise** (multiple realizability blocks that), but **begs the question** by assuming physical descriptions are privileged when both satisfy criteria.  

  **You won last night.** The case shows proportionality alone cannot protect mental causation because:  
  1. It doesn’t discriminate vocabularies when both are proportionate.  
  2. It misses *patterns* that require higher-level properties (invariance).  
  The tension between "same grain" and "non-disjunctive physical cause" was resolved by using a *respectable neuroscientific state* (P_A), not a gerrymander. You gave up nothing.
