   Game Concept: "The Belief Trap"

   Overview:
   We create a game where players are presented with a set of rules (premises) that they all agree are true. Then, a consequence of these rules is presented that is non-obvious. The players are asked to make bets (using candy as currency) on whether certain statements are true, including the consequence. The twist is that the consequence is logically entailed by the premises, but it might take some reasoning to see it. The game will penalize players for having inconsistent beliefs (e.g., believing the premises but not the consequence) but without requiring them to actually do the reasoning during the game.

   Materials:
   - Index cards (for writing down rules and statements)
   - Whiteboard (to display the rules and the statements for betting)
   - Candy (for betting and rewards)
   - A die (for introducing randomness in the betting phase, if needed)

