            f(3)=2
            f(4)=3
            f(5)=5
            f(6)=8
            f(7)=13
            f(8)=21
            f(9)=34
            f(10)=55
            f(11)=89
            f(12)=144
            f(13)=233
            f(14)=377
            f(15)=610

          We'll do f(15)=610. We can have:

            S1: Premise 1 (definition)
            S2: Premise 2 (we are computing f(15))
            S3: Consequence: f(15)=610
            S4: f(15)=100 (decoy)
            S5: f(15)=15 (decoy)
            S6: f(15)=0 (decoy)
            S7: f(3)=2 (true)
            S8: f(6)=8 (true)

          Now, in 5 minutes, some might compute it, some might not.

          The penalty rule: If you bet on S1 and S2 as true, then:
              - If you bet on S3 as true, you get a bonus candy.
              - If you skip S3, you lose one candy.
              - If you bet on S3 as false, you lose one candy (in addition to losing the bet if S3 is true).

          And note: S3 is true.

     Final plan for the activity:

       Title: The Commitment Game

       Materials:
          - Whiteboard: write the premises.
          - Sheets of paper with the 8 statements for each player.
          - Candy (each player starts with 5 pieces).
          - Pencils.

       Premises on the whiteboard:

          "We define a function f on positive integers:
            f(1) = 1
            f(2) = 1
            for any integer n greater than 2, f(n) = f(n-1) + f(n-2)

          We are interested in the value of f(15)."

       Statements on the sheet:

          [ ] S1: The function f is defined by: f(1)=1, f(2)=1, and for n>2, f(n)=f(n-1)+f(n-2).
          [ ] S2: We are computing f(15).
          [ ] S3: f(15)=610.
          [ ] S4: f(15)=100.
          [ ] S5: f(15)=15.
          [ ] S6: f(3)=2.
          [ ] S7: f(6)=8.
          [ ] S8: f(10)=55.

       Rules of betting:
          - For each statement, you can:
               - Bet on True: place a 'T' in the box. If you are right, you win one candy. If wrong, you lose one.
               - Bet on False: place a 'F' in the box. If you are right, you win one candy. If wrong, you lose one.
               - Skip: leave it blank. No win or loss.
          - You have 5 minutes to make your decisions. No talking.
          - After collecting the sheets, we will reveal the answers.

       Reveal the answers:

          S1: True (it's a premise, and we are taking it as given)
          S2: True (premise)
          S3: True (f(15)=610)
          S4: False
          S5: False
          S6: True (f(3)=1+1=2)
          S7: True (f(6)=f(5)+f(4)= [f(5)=f(4)+f(3)= (f(3)+f(2)) + f(3) = (2+1)+2=5? Let me recalc: 
               f(3)=2, f(4)=f(3)+f(2)=2+1=3, f(5)=f(4)+f(3)=3+2=5, f(6)=f(5)+f(4)=5+3=8 -> true)
          S8: True (f(10)=55, as we computed above)

       Then, after settling these bets, we reveal:

          "There is an additional rule: Because S3 is a logical consequence of S1 and S2 (if you compute it), we have a consistency adjustment:

            If you bet on both S1 and S2 as True (and note they are true) then:
               - If you also bet on S3 as True, you get an extra candy (bonus for consistency).
               - If you skipped S3, you lose one candy (inconsistency penalty).
               - If you bet on S3 as False, you lose one candy (inconsistency penalty) in addition to any loss from the bet.

            Why? Because if you truly believe S1 and S2, then you should be committed to S3 being true. If you didn't, then you are being inconsistent."

       Then adjust the candy accordingly.

     Debrief:

       - Start by asking how many got the bonus? How many got the penalty?
       - Ask: "Did you know that f(15)=610 when you placed your bet?" (Most will say no.)
       - Ask: "But if you believe the definition (S1) and that we are computing f(15) (S2), then doesn't it follow that f(15) must be 610? Why didn't you bet on it?"
          - Expected answer: Because I hadn't calculated it.
       - Point out: "So you believed the premises but not the consequence, not because you had evidence against the consequence, but because you hadn't done the work to see that it followed. In an ideal world, a perfect reasoner would instantly see all the consequences. But we are not perfect. So the penalty we imposed represents the logical commitment, but the fact that we didn't see it represents our human limitations."

       - Connect to Hex: 
            "In the Hex game, you all agreed that there are no draws. And then there's a complex argument (strategy-stealing) that shows the first player must have a winning strategy. But even after hearing that, you didn't feel like you knew it. Why? Because you hadn't worked through the argument. So you are not irrational for not believing it until you see the steps. The problem is that logic requires us to believe all consequences, but humans can only believe the ones they actually see."

       - Philosophical point: This is the problem of logical omniscience in epistemic logic. We don't name it until the end if at all.

     What the game can't produce:

       - The game can't produce the abstract notion of logical consequence without explanation. We have to tell them that S3 follows from S1 and S2. We can say: "By the definition, the value of f(15) is fixed. So if you believe the definition, then you must believe that f(15) is whatever it is computed to be. But without computing it, you don't know the number."

     Handling snack people:

       - They might skip most statements. But if they bet on S1 and S2 as true (because they are premises and we said they are true) and then skip S3, they get penalized. That might feel unfair to them. But we hope the candy will motivate them to try. Alternatively, they might skip S1 and S2? Then they avoid the penalty. That's okay because they didn't commit to the premises. We can point out: "Some of you avoided the penalty by not committing to the premises. That's one way to avoid inconsistency: don't believe anything! But in the club, we want to believe things. So we have to face the problem."

     Timeline:

       0-5 min: Explain the game, the function, the betting rules. Hand out the sheets.
       5-10 min: Betting period (5 minutes). Collect sheets.
       10-15 min: Reveal the answers for S1 to S8. Players calculate their candy wins/losses for these.
       15-20 min: Reveal the consistency rule and adjust candy accordingly.
       20-40 min: Debrief and discussion.

     Now, we write the steps for the facilitator.

     Facilitator Script:

       "Welcome to the Commitment Game! Today we're going to test how well we can reason from given information. I'll present a mathematical function and we'll all bet on the truth of some statements about it.

       Here are the premises (write on whiteboard):

          f(1) = 1
          f(2) = 1
          for any integer n > 2, f(n) = f(n-1) + f(n-2)

          We are interested in the value of f(15).

       Now, I'm giving you a sheet with 8 statements. For each statement, you have three choices:
          - You can bet that the statement is TRUE. Mark 'T'.
          - You can bet that the statement is FALSE. Mark 'F'.
          - You can skip. Leave it blank.

       For each statement you bet on, if you are right, you win one piece of candy. If you are wrong, you lose one. Skipping doesn't change your candy.

       You have 5 minutes. Work independently and in silence.

       [Hand out the sheets and start the timer.]

       After 5 minutes, collect the sheets.

       Now, let's reveal the answers:

          S1: The function definition is as given. So TRUE.
          S2: We are computing f(15). So TRUE.
          S3: f(15)=610? Let me show you the computation [do step by step up to f(15) on the whiteboard, or just state the answer]. It is 610. So TRUE.
          S4: 100? FALSE.
          S5: 15? FALSE.
          S6: f(3)=2? Let's compute: f(3)=f(2)+f(1)=1+1=2. TRUE.
          S7: f(6)=8? ... compute: f(3)=2, f(4)=f(3)+f(2)=2+1=3, f(5)=3+2=5, f(6)=5+3=8. TRUE.
          S8: f(10)=55? ... compute up to f(10): 
               f(7)=f(6)+f(5)=8+5=13
               f(8)=13+8=21
               f(9)=21+13=34
               f(10)=34+21=55. TRUE.

       Now, please adjust your candy accordingly. [Go through each statement and have them adjust.]

       Now, there's one more rule. It's about the relationship between S1, S2, and S3. 

          If you believe S1 and S2, then you are committed to believing S3. Why? Because the definition (S1) and the fact that we are computing f(15) (S2) together force that f(15) must be 610 (S3). There's no other possibility.

          So, if you bet on both S1 and S2 as TRUE (and note they are true), then:
            - If you also bet on S3 as TRUE, you were consistent: take one extra candy.
            - If you skipped S3, then you avoided committing to a consequence that you should have believed: lose one candy (inconsistency penalty).
            - If you bet on S3 as FALSE, then you actively believed the opposite of what you should have: lose one candy (inconsistency penalty).

          If you did not bet on both S1 and S2 as TRUE (for example, you skipped one or bet false on one), then this rule does not apply to you.

       Adjust your candy again.

       Now, let's discuss: ... [debrief as above]."

     We hope that this activity will create the experience of the tension and then we can connect it to the Hex example and the philosophical issue.

     Note: We must be prepared that some students might have computed f(15) and so they get the bonus. That's great because they are the example of the ideal reasoner. But most won't.

     Finally, we name the problem: "In philosophy, this is known as the problem of logical omniscience: the ideal that a rational agent should believe all the logical consequences of their beliefs, but humans are not capable of that because we have limited time and resources."

     This should lead into a discussion about the Hex example and the general puzzle about belief and consequence.
answer: |-
  Below is a structured activity designed to help your club experience the tension between believing premises and not believing their non-obvious consequences. The game is called **"Consequence Trap"** and uses candy bets to make the inconsistency feel tangible. It’s designed for 14 players (including "snack people"), uses only index cards and a whiteboard, and fits into 40 minutes.

  ---

  ### **Game: Consequence Trap**
  **Concept**: Players bet candy on whether statements are true. The trick: One statement (the "trap") is a non-obvious consequence of others they already accept. Players lose candy if they accept the premises but reject/skip the trap—highlighting the tension between logical commitment and human limitations.

  **Materials**:
  - **Index cards** (30+): Pre-written with statements (see below).
  - **Whiteboard**: To display rules and track scores.
  - **Candy** (e.g., 100 small pieces): Distributed as betting currency.
  - **Dice** (optional): To randomize teams if needed.

  **Setup**:
  1. **Candy Distribution**: Each player starts with 5 pieces of candy.
  2. **Premises & Trap**: Use a math-based scenario. Premises are simple; the trap requires computation.
     - **Premise 1**: "A function \(f\) is defined as:  
       \(f(1) = 1\), \(f(2) = 1\),  
       and for \(n > 2\), \(f(n) = f(n-1) + f(n-2)\)."  
       *(This is the Fibonacci sequence)*
     - **Premise 2**: "We want to know \(f(10)\)."
     - **Trap Statement**: "\(f(10) = 55\)." *(True, but requires calculation)*
     - **Decoy Statements**: Mix in 3–4 false/irrelevant decoys (e.g., "\(f(5) = 10\)", "\(f(3) = 4\)").
  3. **Statements on Cards**:
     - Premise 1 (True)  
     - Premise 2 (True)  
     - Trap: "\(f(10) = 55\)" (True)  
     - Decoys: E.g., "\(f(10) = 100\)" (False), "\(f(3) = 4\)" (False), "\(f(6) = 8\)" (True).

  **Rules**:
  1. **Betting Phase (15 mins)**:
     - Display Premises 1 and 2 on the whiteboard. Emphasize: "These are true. No tricks."
     - Shuffle all statement cards and place them face down. Players draw 3 cards each (if <14 players, reuse cards).
     - For each card, players **secretly** choose to:
       - **Bet TRUE** (place 1 candy on the card).
       - **Bet FALSE** (place 1 candy next to the card).
       - **SKIP** (place no candy).
     - Players can bet on 0–3 cards. Collect all cards/candy in separate piles (True-bet, False-bet, Skip).

  2. **Revelation & Scoring (10 mins)**:
     - Reveal the truth of each statement. For each card:
       - **Correct bet**: Win 2 candies (double your stake).
       - **Wrong bet**: Lose your staked candy.
       - **Skip**: No gain/loss.
     - **The Trap Penalty**:  
       *After* scoring, reveal the trap ("\(f(10) = 55\)") and announce:  
       *"This is true because Premises 1 and 2 force it. If you accepted both premises but skipped or rejected the trap, you were inconsistent. Lose 2 candies."*  
       (This penalty applies even if they skipped the trap card entirely).

  3. **Team Twist (For Snack-Lovers)**:
     - Before betting, split into pairs (dice assign partners if needed).
     - Teammates share candy bets and penalties. Forces engagement—snack lovers strategize with partners.

  **Example Flow**:
  - **Min 0–5**: Explain rules, distribute candy/cards.
  - **Min 5–20**: Betting phase (players decide silently).
  - **Min 20–30**: Revelation/scoring (write results on whiteboard).
  - **Min 30–40**: Debrief (key below).

  ---

  ### **Debrief & Discussion**
  **Map the Game to the Problem**:
  1. **Premises as Accepted Beliefs**:  
     Everyone agreed Premises 1–2 were true (like agreeing "Hex has no draw").
  2. **Trap as Unseen Consequence**:  
     \(f(10) = 55\) follows from Premises 1–2—but few compute it in 15 mins (like not seeing Hex’s strategy-stealing proof).
  3. **Penalty as Logical Commitment**:  
     Losing candy for accepting premises but rejecting/skipping the trap mirrors the Hex group’s discomfort: *"If I believe P, I should believe its consequences—but I don’t yet!"*

  **Steer Away from "Humans Are Dumb"**:
  - Ask:  
    *"Who lost candy on the trap? Why didn’t you bet, even though you believed the premises?"*  
    Listen for: "Didn’t have time," "Wasn’t sure," "Forgot to compute."
  - Then reframe:  
    *"This isn’t about being bad at math. It’s about what we expect from ‘rational’ beliefs. Logic says if you believe P, you must believe Q if P forces Q. But humans need time to see the connection. Perfect rationality might require instant insight—but we’re not perfect. Hex’s winning strategy is the same: you accept no draws, but the proof is a leap you haven’t made yet."*

  **What the Game Can’t Produce**:
  - **The Strategy-Stealing Analogy**: After the game, explicitly link to Hex:  
    *"Hex’s ‘no draw’ is like our Premises 1–2. The ‘first-player win’ is like the trap—it follows, but you need the strategy-stealing argument (like computing \(f(10)\)). Until you see that argument, you’re stuck between logic and uncertainty."*

  ---

  ### **Likely Pitfalls & Fixes**
  - **Pitfall 1: Everyone Solves the Trap**  
    (e.g., a math whiz computes \(f(10)\) fast).  
    **Fix**: Use a harder trap (e.g., \(f(15) = 610\)) or shorten betting time. In debrief, stress: *"In Hex, no one sees the proof instantly—this trap was easier!"*
    
  - **Pitfall 2: Snack-Lovers Tune Out**  
    **Fix**: The team twist forces collaboration. If they still skip, note: *"Skipping cost you candy—in logic, avoiding commitments doesn’t solve the tension."*

  - **Pitfall 3: Penalty Feels Unfair**  
    **Fix**: Acknowledge: *"It feels unfair because you hadn’t realized the consequence. That’s the point! Logic ‘blames’ you for inconsistency, even when you’re being reasonable."*

  ---

  ### **Why This Works**
  - **Candy = Stakes**: Losing candy makes the inconsistency visceral. Players *feel* the squeeze.
  - **Low Barrier**: Math is simple (no symbols). Decoys keep snack lovers engaged.
  - **Debrief Structure**: Guides them from frustration ("Why did I lose?") to insight ("Oh, this is about rationality vs. reality").
  - **No Jargon**: Philosophical terms (e.g., "logical omniscience") are avoided until after.

  The goal is for players to walk out understanding that the problem isn’t their intelligence—it’s a gap between idealized rationality and human cognition. Use the debrief to connect their candy losses to Hex: *"Next time someone says ‘Hex’s first player must win,’ remember: you accept the premises, but you’re allowed to need the proof."*
