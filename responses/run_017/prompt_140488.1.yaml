     - Map to the realism/anti-realism fight without naming it:
          - The robust theory not only fits the data but also predicts correctly under interventions (counterfactuals). This suggests that it captures the actual causal structure of the machine.
          - The fragile theory, while fitting the data, is just a description of the data and doesn't capture the underlying mechanism. It's an overfitting story.
          - So, when we say the machine "represents" something, we might mean that there is a structural correspondence that supports counterfactual reasoning and interventions. This is a realist view: the representation is really there in the machine.
          - The anti-realist might say that both are just stories we tell, and the machine is just a lookup table. But the robust story is more useful for manipulation and control.

     - Point out: the activity shows that representation is not just about fitting the data, but about being robust to interventions. This is a key insight from mechanistic interpretability.

  **What will go wrong?**
  - Participants might question why we are using a hand-built artifact and not a learned model. They might say that in real networks, we don't have access to the full state and the lookup table. But the point is to have a simple analogy.
  - The groups might not be equally engaged or might not follow the instructions. Make sure the instructions are clear and the artifact is visually clear.
  - The fragile theory group might come up with an ad-hoc fix when they see the problem (e.g., "oh, we should have considered C"). But the point is that in training, C was always 0, so they had no reason to. And if they do, then we can discuss how we decide what features to include.

