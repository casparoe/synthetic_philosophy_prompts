  - In real networks, the representations are distributed and continuous, not discrete and local. Also, real networks are learned, not designed. The activity might suggest that representations are always clean and human-interpretable, which is not the case in practice.
  - The activity assumes that the lookup table (the output function) is fixed and known, but in practice, we don't have that for neural networks. We have to probe the network to guess the function.

  Despite these limitations, the activity should serve to ground the abstract debate in a concrete example and show that some interpretations are better than others because they capture the causal structure.

  ### Materials to Build
  - A cardboard box with three pegs (A,B,C) that can be set to 0 or 1 (e.g., by turning a dial or moving a slider).
  - Input cards: with 0,1,2,3.
  - A fixed input encoder (a chart that shows how input sets the pegs).
  - The output lookup table (a big chart or wheel that shows the output for every (A,B,C) state).

  This should be simple enough to build and use in a session.
answer: |-
  ### Session Design: "The Pegboard Puzzle"  
  **Objective:** Move beyond slogans about representation by confronting participants with a concrete artifact where two interpretations fit the training data equally well, but only one survives interventions. The goal is to surface the disagreement about whether representation is "real" or merely a useful human construct.

  ---

  ### **The Artifact: "PegNet"**  
  A physical pegboard with:  
  - **3 Pegs** (Red, Green, Blue), each with **3 positions** (0, 1, 2).  
  - **Input Cards**: Simple drawings of shapes with properties:  
    - *Shape*: Circle (○), Square (□), Triangle (△).  
    - *Color*: Red, Blue, Green.  
    - *Size*: Small (S), Large (L).  
  - **Output Labels**: A, B, C, D.  
  - **Lookup Wheel**: A rotating disk mapping peg states (e.g., R0-G1-B2) to output labels.  

  #### **Fixed Input Encoder** (Visible to all):  
  | Input (Shape-Color-Size) | Red Peg | Green Peg | Blue Peg |  
  |--------------------------|---------|-----------|----------|  
  | ○-Red-S                  | 0       | 0         | 0        |  
  | ○-Blue-S                 | 0       | 1         | 0        |  
  | □-Red-S                  | 1       | 0         | 0        |  
  | △-Green-L                | 2       | 2         | 1        |  
  | ... (6 training examples total) |  

  #### **Lookup Wheel Outputs** (Predefined):  
  | Peg State (R-G-B) | Output |  
  |-------------------|--------|  
  | 0-0-0             | A      |  
  | 0-1-0             | B      |  
  | 1-0-0             | C      |  
  | 2-2-1             | D      |  
  | 1-1-1             | A      |  
  | 0-0-1             | B      |  
  | ... (12 more states) | ...   |  

  #### **Key Twist**:  
  - **Training Data** (6 inputs): All inputs use only **5/27 possible peg states**.  
  - **Unseen States**: The remaining 22 states are reserved for interventions.  

  ---

  ### **The Two Readings**  
  Both readings explain the training data perfectly but diverge under intervention.  

  1. **Robust Reading ("Geometric Theory")**:  
     - **Red Peg**: Shape (0=○, 1=□, 2=△).  
     - **Green Peg**: Color (0=Red, 1=Blue, 2=Green).  
     - **Blue Peg**: Size (0=Small, 1=Large).  
     - *Why it works*: Aligns with the input encoder’s "intent." Predicts outputs via modular rules (e.g., "If Red=2 (△) and Blue=1 (L), output D").  

  2. **Fragile Reading ("Sum Theory")**:  
     - **Red Peg**: Shape + Color sum (0=○+Red, 1=□+Red/○+Blue, 2=△+Green/□+Blue).  
     - **Green Peg**: Color + Size sum (0=Red+S, 1=Blue+S/Red+L, ...).  
     - **Blue Peg**: "Parity" (0=Even sum of properties, 1=Odd).  
     - *Why it breaks*: Overfits training data with arbitrary sums (e.g., "○-Red-S: (0+0+0=0 → Output A"). Fails on new combinations.  

  #### **Example Intervention**:  
  - **Input**: △-Blue-L (unseen in training).  
  - **Encoder Output**: Red=2 (△), Green=1 (Blue), Blue=1 (L) → State `2-1-1`.  
  - **Lookup Wheel**: Maps `2-1-1` to **B**.  
    - **Robust Prediction**: Correct (△=2, Blue=1, L=1 → Output B).  
    - **Fragile Prediction**: Incorrect (e.g., "Sum=4 (even) → Output A," but true output is B).  

  ---

  ### **Session Timeline (90 Min)**  
  **Goal:** Groups discover that both readings fit the data, but only one handles interventions.  

  1. **Intro & Setup (15 min)**:  
     - Explain PegNet: "A simple model mapping inputs to outputs via pegs. Your job is to interpret what the pegs represent."  
     - Split the room: **Group 1 (Robust)**, **Group 2 (Fragile)**.  
     - Give each group:  
       - Training data cards (6 inputs + outputs).  
       - Lookup wheel (all states).  
       - Their reading (without the other group’s description).  

  2. **Group Work (25 min)**:  
     - **Task 1: Verify your reading**  
       - Confirm it explains all training examples.  
     - **Task 2: Predict interventions**  
       - Design 2 new inputs (e.g., △-Blue-L, □-Green-S).  
       - Use the encoder to get the peg state.  
       - Predict the output using your reading.  
     - **Group 1 (Robust)**: Will likely derive rules (e.g., "Blue=Size").  
     - **Group 2 (Fragile)**: Will match sums to training (e.g., "This sum matches ○-Blue-S → Output B").  

  3. **Intervention Test (25 min)**:  
     - Groups share one intervention input. Facilitator runs it on PegNet:  
       - Set pegs → Check lookup wheel → Reveal output.  
     - **Critical Moments**:  
       - **Moment 1**: Both readings fit the training data (no surprises).  
       - **Moment 2**: Robust predictions succeed; Fragile predictions fail (e.g., `2-1-1` → B, not A).  
     - Repeat with 1–2 more interventions to show consistency.  

  4. **Discussion (15 min)**:  
     - Prompt: "Why did one reading work and the other fail, even though both fit the training data?"  
     - Push deeper: "What does this say about whether PegNet 'represents' anything?"  

  5. **Debrief (10 min)**:  
     - **Map to Realism/Anti-Realism**:  
       - *Moment 1 (Multiple Readings)*: "Just like PegNet, real networks support many interpretations. Anti-realists say: 'Representation is just a story we impose.'"  
       - *Moment 2 (Robustness Wins)*: "But one reading predicted new cases. Realists say: 'Representation is what survives intervention—it’s in the machine.'"  
     - **Key Insight**: "The disagreement isn’t about fitting data—it’s about whether the machine’s *structure* mirrors reality. Robust interpretations let you *steer* the system."  

  ---

  ### **Predictable Problems & Limitations**  
  1. **What Will Go Wrong**:  
     - **Group 2 (Fragile) may resist failure**: They might tweak their reading post-hoc (e.g., "I meant *this* sum").  
       - *Mitigation*: Stress upfront: "Stick to your reading as given. Don’t improvise."  
     - **Over-simplification complaints**: "Real NNs aren’t pegboards!"  
       - *Mitigation*: "This is a grounding exercise. We’re isolating the *concept* of representation."  
     - **Time crunch**: 25 min for group work is tight.  
       - *Mitigation*: Pre-made worksheets with guided steps.  

  2. **What the Activity Flattens**:  
     - **Emergence vs. Design**: PegNet is hand-built, but real networks *learn* representations. The activity can’t capture how learned features might be less discrete or human-interpretable.  
     - **Ambiguity in Real Networks**: Unlike PegNet, real models rarely have one "obviously correct" interpretation. The activity might overstate how clear-cut robustness is.  
     - **Anti-Realist Nuance**: Hardcore anti-realists may argue *no* interpretation is "in the machine," even robust ones. The activity leans toward realism by privileging interventions.  

  ---

  ### **Why This Works**  
  - **Concrete > Abstract**: Participants *see* the peg states and *feel* the frustration of failed interventions.  
  - **Dramatic Arc**: Both groups start confident (training fits!), then one group crashes (interventions fail).  
  - **Bridges to Philosophy**: The debrief subtly frames realism as "robust causal structure" and anti-realism as "imposed stories," without jargon.  

  **Build Tip**: Use a physical pegboard with colored dowels and a laminated lookup wheel. Test interventions in advance!
