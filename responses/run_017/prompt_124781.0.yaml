prompt: |-
  hey — I'm working on karma as a *theory of desert*, not the bumper-sticker version: the serious claim that a person's suffering can be owed to them in virtue of what they've done, and that the debt can carry across lives. Before I try to build a version of it I want the spec. No citations or reading lists please, and don't lean on precise scriptural wording either — I'd rather have the criteria in my own terms so I can see what I'm actually committed to. Just: what does a theory of karmic desert have to get right to be worth defending?

  Purpose, so the list isn't free-floating: I want a version that does the job retributivism does in normative ethics — explaining why it's non-accidentally *fitting* that the wrongdoer is the one who suffers, and not merely that suffering tends to follow bad acts — but with no punisher, no sentence, no judgement day. If a candidate quietly collapses into consequentialism about character formation wearing spooky vocabulary, I want a requirement on the list that catches it.

  Cases I keep circling:

  - the beginningless ledger: if the series of lives has no first term, everyone has an infinite backlog of unpaid desert, so "she must have deserved it" never comes out false. A theory under which no suffering could ever be undeserved looks like it has explained nothing. What's the positive requirement here — falsifiability, a cap, some statute of limitations — and is it even compatible with saying there's no first moment?
  - asymmetric memory: I remember what I did last year, not what I did in a life I can't recall. Retributivism in its communicative moods wants the suffering to be something the agent can recognise as answering her act. If karmic desert mostly discharges with no such recognition, what's lost, and is that loss fatal or is it the point?
  - the pre-contact ancestor: someone who lived and died where nobody had ever heard of karma, reasoning in a wholly different normative vocabulary. Does she accrue it? This smells like the "no law without promulgation" worry but I can't tell whether I'm demanding something real.
  - intention vs. outcome: I half-remember a line somewhere in the Pali canon identifying karma with intention — don't quote it at me, and I don't want to build on the exact wording. Structurally: if intention is what generates desert, what happens to the person whose careful cruelty accidentally saves a life, or the one who wrecks hundreds of lives through pure negligence? Does a desert theory need intention-sensitivity, and what does that cost it?
  - the currency problem: lying vs. breaking someone's arm. Desert theories of punishment always get stuck on proportionality. Does karmic desert need a common unit, or can it get by with a partial ordering, and what would make the comparisions principled instead of hand-waved?
  - laundering: do good acts cancel bad ones on one balance sheet, or does each act generate its own owed suffering that can't be offset? And is there a version where merit can be transferred or redirected to someone else — I know some traditions do something like this — and if so what does that do to the desert model? It feels like it should be a hard conflict and I can't say why.
  - the branch case: supposing a single stream of consciousness could split into two continuations, does the owed suffering duplicate, halve, or attach to neither? I mainly want to know whether desert needs strict numerical identity or something looser.
  - the reformed agent: someone who genuinely transforms. If the old debt still has to be discharged, karma is pure retribution; if it dissolves, it looks like it was only ever causal habit. Is this the fork the whole spec turns on?

  Give me the requirements list with the consideration behind each, mark which are non-negotiable and which are just my tastes, and flag the two or three I probably can't have together — that's the part I care most about. Then score three readings against the list, briefly: karma as cross-life desert, karma as nothing but causal effects on character, and karma with transferable merit. And tell me which single requirement does the most work knocking candidates out.
reasoning: |-
  Okay, the user is working on a theory of karma as a form of desert that carries across lives. They want a spec—a set of requirements that any viable theory must meet without leaning on citations or scriptures. The purpose is to mirror retributivism's function in normative ethics: explaining why suffering is non-accidentally fitting for the wrongdoer, without invoking a punisher or judgment day. They also want to avoid collapsing into consequentialism disguised with spiritual terms.

  First, I need to understand their core concerns. They listed several cases: the beginningless ledger problem, asymmetric memory, the pre-contact ancestor, intention vs. outcome, the currency problem, laundering, the branch case, and the reformed agent. Each of these highlights potential weaknesses in a karmic desert theory. The challenge is to distill these into essential requirements.

  Starting with non-negotiable requirements. Fittingness is crucial—suffering must be intrinsically linked to the agent's actions, not just a causal consequence. This addresses their worry about the theory collapsing into character consequentialism. Then, non-accidentality ensures the connection isn't coincidental. Agent-specificity ties the desert to the individual, preventing transfer or laundering issues. The ledger integrity requirement tackles the infinite backlog problem by demanding that desert isn't an undifferentiated mass but itemized. These four seem indispensable for maintaining a true desert theory.

  Now, negotiable requirements. Recognition is important for communicative retributivism but might not be essential if karma's purpose isn't about the agent's understanding. Intention-sensitivity is tricky; they mentioned cases where intention and outcome diverge. Making intention the desert basis avoids moral luck but might not handle negligence well. Partial ordering for proportionality might be necessary if exact measurement is impossible. Transfer permissibility is a big one—some traditions allow merit transfer, but it conflicts with agent-specificity. Continuity conditions relate to the branch case; strict identity might be too rigid, so a looser criterion like psychological connectedness could work. Moral transformation addresses the reformed agent dilemma, requiring that desert persists despite change, but the nature of the change matters.

  Identifying conflicts. Fittingness and non-accidentality versus transfer permissibility clash directly—transferring merit undermines the agent-specific link. Also, intention-sensitivity might conflict with handling negligence; if desert requires intention, negligent harm might not incur desert, which could be problematic. The branch case highlights tension between ledger integrity and continuity—if a stream splits, how is desert allocated without compromising specificity?

  Scoring the three readings. Karma as cross-life desert satisfies most requirements except possibly transfer permissibility and recognition, depending on implementation. Causal character consequentialism fails fittingness and non-accidentality, making it inadequate as a desert theory. Transferable merit models struggle with agent-specificity and fittingness, reducing desert to a currency that can be laundered.

  The most critical requirement is fittingness. It's the linchpin that prevents the theory from devolving into consequentialism. Without it, karma loses its retributive essence. The user needs to ensure that suffering is a deserved response to past actions, not just a causal outcome. This requirement likely knocks out candidates that don't maintain this intrinsic link, like the character consequentialism model.

  The user's deep needs seem to be creating a coherent, defensible theory that retains the core of retributivism without supernatural elements. They want logical rigor, addressing edge cases, and avoiding pitfalls like infinite debt or laundering. They might also seek a balance between philosophical robustness and practical applicability across different scenarios. Unspoken needs could include reconciling moral responsibility with metaphysical assumptions like rebirth, ensuring the theory is ethically intuitive without relying on unprovable tenets.
answer: |-
  Here's your spec for karmic desert, distilled from your constraints and cases. Requirements are listed with their *purpose* and marked as **Non-Negotiable** (core to desert-as-retribution), **Negotiable** (reflects your stated taste against consequentialism/spookiness), or **Open** (a challenge needing resolution, but not inherently disqualifying).

  ### The Karmic Desert Spec: Requirements

  1.  **Fittingness:** Suffering must be a *deserved response* to the specific wrongful act, not merely a causal consequence. The suffering must *answer* the wrong in a morally intelligible way (e.g., the nature/degree of suffering connects symbolically or conceptually to the nature/degree of the wrong).  
      *   **Purpose:** Distinguishes desert from mere cause-effect. Blocks "character consequentialism in spooky clothes."  
      *   **Status:** **Non-Negotiable.** (Your core ask vs. consequentialism).
  2.  **Non-Accidentality:** The suffering *must* be experienced by the agent who committed the wrongful act. It cannot be random or transferable without undermining the core desert link. The connection agent-act-suffering is constitutive, not contingent.  
      *   **Purpose:** Ensures it's *this* agent's suffering for *their* act. Blocks impersonal cosmic balance sheets.  
      *   **Status:** **Non-Negotiable.** (Implied by fittingness + agent-specificity).
  3.  **Agent-Specificity:** Desert attaches strictly to the individual agent who performed the act. It is *their* debt incurred by *their* action.  
      *   **Purpose:** Foundation of desert. Blocks laundering/transfer as fundamental operations (though see Open #7).  
      *   **Status:** **Non-Negotiable.**
  4.  **Ledger Integrity (No Infinite Undifferentiated Debt):** Desert must be attributable to *specific acts* (or at least types/patterns of acts), not an undifferentiated infinite backlog. Suffering must be *for something specifiable*, even if the full history is vast. "She must have deserved it" must be *potentially falsifiable* in principle for a given instance of suffering (even if practically impossible to verify).  
      *   **Purpose:** Solves "Beginningless Ledger" problem. Prevents the theory from explaining *every* instance of suffering vacuously. Makes desert meaningful.  
      *   **Status:** **Negotiable.** (You strongly dislike the "always deserved" implication, making this crucial for *your* viable theory. Compatible with no first moment if debt is act-specific).
  5.  **Intention-Sensitivity (Desert Generator):** Desert accrues primarily (or exclusively) based on the *intentional state* (volition, knowing choice) behind the act, not solely on the outcome.  
      *   **Purpose:** Handles the careful cruelty/accidental savior and negligence cases. Aligns with core retributive focus on culpability. Avoids moral luck in desert assignment.  
      *   **Status:** **Negotiable.** (Reflects your structural concern about intention vs. outcome and taste against outcome-based models that feel arbitrary. Cost: Requires a robust theory of negligence as quasi-intentional or generating distinct desert).
  6.  **Proportionality (Partial Ordering):** There must be a principled, non-arbitrary way to compare the "weight" of different wrongs and the "weight" of different sufferings such that one can judge if suffering S is *proportionate* to wrong W. A strict common currency isn't required; a robust partial ordering ("breaking an arm *deserves more* suffering than telling a white lie") suffices, but the basis for comparison must be defensible (e.g., severity of harm *intended*, depth of malice, violation of fundamental goods).  
      *   **Purpose:** Solves the "Currency Problem." Prevents arbitrary or absurd assignments. Essential for "fittingness."  
      *   **Status:** **Open.** (Fundamental challenge for *any* desert theory, karmic or not. Must be addressed, but success level varies).
  7.  **No Laundering (Non-Transferability):** Desert incurred by a wrongful act cannot be cancelled out by a good act performed by the same agent. Good acts generate their own positive desert (merit), but negative desert (demerit) remains a distinct debt owed. Merit cannot be *transferred* to pay another agent's demerit debt.  
      *   **Purpose:** Preserves Agent-Specificity and Fittingness. Prevents "buying your way out" of core desert, which feels like a violation of the retributive link. Makes the reformed agent problem stark.  
      *   **Status:** **Negotiable.** (Directly conflicts with traditions allowing transfer; you suspect a "hard conflict" – you're right. See scoring below).
  8.  **Continuity Condition:** Desert persists across lives based on a criterion of *continuity* sufficient to ground responsibility (not necessarily strict numerical identity). Must resolve the "Branch Case" coherently (e.g., debt attaches to *both* streams? splits based on continuity strength? requires a unique successor?).  
      *   **Purpose:** Solves "Branch Case." Defines *what* persists to carry the debt. Must be looser than numerical identity but tighter than mere causal influence.  
      *   **Status:** **Open.** (Metaphysically tricky, but necessary for cross-life coherence).
  9.  **Moral Transformation vs. Debt Persistence:** The debt persists *despite* genuine moral transformation ("Reformed Agent"). The suffering answers the *past act by the past agent*, not the current character. Transformation affects *future* desert generation, not past debt cancellation.  
      *   **Purpose:** Maintains core retributive logic ("answering the act"). Prevents collapse into character consequentialism (where suffering's only point is to *change* the agent).  
      *   **Status:** **Negotiable.** (This is the fork! Your taste demands pure retribution over therapy. Cost: Makes karma seem harshly backward-looking).

  ### Key Conflicts & Trade-offs (The "Can't Have Together")

  1.  **Agent-Specificity + Fittingness + Non-Accidentality vs. Transfer Permissibility:** You fundamentally **cannot** have genuine agent-specific desert *and* allow merit/demerit transfer between agents without destroying fittingness and non-accidentality. Transfer turns desert into a fungible currency, not an agent-act specific debt. *(This conflict knocks out transfer models as desert theories).*
  2.  **Intention-Sensitivity vs. Handling Pure Negligence:** If desert *requires* positive intention, how does it handle severe harm from pure negligence (no ill intent, just recklessness)? A robust solution requires either stretching "intention" to cover culpable disregard (Open #5) or accepting a gap, making some harms "desert-less" despite culpability.
  3.  **Ledger Integrity (Specificity) vs. Beginninglessness:** Maintaining specific act-desert links across an infinite past is metaphysically and epistemically challenging, but not logically impossible (like itemizing an infinite list). It requires a strong Continuity Condition (Open #8).

  ### Scoring Candidate Readings Against the Spec

  1.  **Karma as Cross-Life Desert (Your Target):**
      *   **Hits:** Fittingness (potentially), Non-Accidentality, Agent-Specificity, Ledger Integrity (if solved), Intention-Sensitivity (if built-in), Continuity (if defined), Moral Transformation/Debt Persistence.
      *   **Misses/Challenges:** Proportionality (Open challenge), Ledger Integrity (Operationalizing specificity across infinity is hard), Continuity (Defining the right criterion is hard), Recognition (Usually fails Asymmetric Memory - potential weakness).
      *   **Verdict:** The only candidate that *can* satisfy the core non-negotiables (1-4) and your key negotiables (5, 7, 9) *if* the open challenges (6, 8) are solved robustly. Recognition is a common sacrifice.

  2.  **Karma as Causal Effects on Character:**
      *   **Hits:** Continuity (often psychological), *Maybe* Ledger Integrity (character as summary of past causes).
      *   **Misses:** **FITTINGNESS** (Suffering is therapeutic/educative, not an answer to the past act itself), **Non-Accidentality** (Focus is on future state, not linking specific act to specific suffering), Agent-Specificity (Can blur if character traits are primary), Intention-Sensitivity (Often outcome/habit focused), No Laundering (Good acts *do* "launder" by improving character), Moral Transformation (Transformation *is* the point, debt dissolves).
      *   **Verdict:** **Fails Core.** It's consequentialism (character formation) wearing spooky vocabulary ("karma"). Knocked out primarily by failing **Fittingness** and **Non-Accidentality**.

  3.  **Karma with Transferable Merit:**
      *   **Hits:** *Maybe* Fittingness (if seen as cosmic balance), *Maybe* Ledger Integrity (if accounts track), Often addresses Recognition via rituals.
      *   **Misses:** **AGENT-SPECIFICITY** (Fundamentally violated), **NON-ACCIDENTALITY** (Suffering may not be experienced by the debtor), **No Laundering** (Transfer *is* laundering by definition), Fittingness (Weakens the link between *this* agent's act and *their* suffering).
      *   **Verdict:** **Fails Core.** Turns desert into a cosmic social credit system, not a theory of individual moral debt. Fundamentally incompatible with desert. Knocked out by **Agent-Specificity** and **Non-Accidentality**.

  ### The Knockout Requirement: Fittingness

  **Fittingness** (#1) does the most work. It's the litmus test for "desert" vs. "consequence." Without it, the suffering isn't an *answer* to the wrong; it's just a result. **Causal Character Consequentialism** fails because suffering isn't *for* the past act, it's *for* future character. **Transfer Models** fail because the suffering (or its relief) isn't intrinsically linked to *that specific agent's specific act*; the link is broken by transfer. **Fittingness**, combined with **Non-Accidentality** and **Agent-Specificity**, defines the very essence of the retributive link you're trying to preserve across lives. If a candidate model can't satisfy Fittingness as defined (suffering as a deserved response answering the specific act), it's not a desert theory of karma, regardless of other features.
