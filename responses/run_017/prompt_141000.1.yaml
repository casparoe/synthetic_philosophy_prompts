  Trouble spots:
  - Scenario H (manual merge) violates (iii) but still feels like a new entity - suggesting "equally good relation" may need refinement for asymmetric cases
  - Scenario G (rollback) satisfies the principle but creates causal discontinuity - perhaps "causal dependence" needs temporal directionality
  - Their unease in C might stem from attachment to uniqueness, which Buddhism would call illusory

  New scenarios:
