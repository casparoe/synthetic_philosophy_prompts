  Okay, let me unpack this neighborhood committee puzzle. The secretary describes a member who does two things: first, he reshapes preferences by making people feel their new stance was always their true desire; second, he defines who counts as "real" members when votes go against him. 

  Hmm, three concepts come to mind immediately. Populism's "silent majority" framing almost fits but fails because this guy isn't claiming to represent an oppressed group against elites—he's inventing authenticity. Then there's preference fabrication through discourse, but existing theories focus on conscious persuasion, not this "uncovering buried truths" mechanism. And Rousseau's general will? Close, but he rejects the normative layer about what people should want. 

  Ah—the core move is ontological gerrymandering! He redraws reality's boundaries: internally (what members "truly" want) and externally (who qualifies as member). The preference shift episode shows how he retroactively constructs desire as pre-existing, while the vote rejection relies on constructing membership purity. What makes this distinct is the double move: manufacturing authenticity by declaring certain preferences/people to be the community's essence. 

  A borderline case would be someone who simply lies about survey results—that's deception, not ontological restructuring. Our guy operates deeper: he makes people experience manipulated preferences as self-discovery. That's why it feels principled; he believes his own constructions. 

  For a tight definition: Authenticity Ventriloquism—positioning manufactured preferences or membership boundaries as pre-existing truths, thereby rendering opposition inauthentic by definition. The telltale sign? When changing someone's mind becomes proof they were always secretly aligned.
answer: |-
  You're describing a **double maneuver of democratic legitimacy subversion** that's both fascinating and unsettling. After peeling back layers, I've landed on **Authenticity Ventriloquism** as the core concept. Let me carve it precisely through your cases.

  ### Near Misses & Why They Don't Fit:
  1.  **Populist "Silent Majority" Rhetoric:**
      *   *What it is:* Claiming to speak for the "true people" ignored by corrupt elites.
      *   *Why it misses:* Your colleague *isn't* primarily positioning himself against an elite *within* the association. In the first case, he claims to uncover the members' *own* buried desires. In the second, he excludes members based on *inauthentic belonging*, not elite corruption. His "real association" is defined by historical purity, not victimhood by an internal oppressor class.

  2.  **Preference Fabrication/Manufactured Consent (à la Lippmann/Chomsky):**
      *   *What it is:* Using media/power to actively shape public opinion towards a desired outcome.
      *   *Why it misses:* While he *is* shaping opinion (petition, speeches), the crucial twist is the **denial of agency in the change**. He frames it not as persuasion *creating* new desire, but as *revealing* a pre-existing, latent desire ("I just say out loud what people already feel"). The members' belief they've merely "understood" their true selves, not been persuaded, is key. It's not fabrication *of* preferences, but fabrication *of the authenticity* of those preferences.

  3.  **Rousseau's "General Will" vs. "Will of All":**
      *   *What it is:* Distinguishing what people *truly* need for the common good (General Will) from their superficial, selfish desires (Will of All).
      *   *Why it misses:* As you noted, he's not appealing to an objective, normative "common good" that people *should* want. He's appealing to a *supposedly pre-existing* but obscured *subjective* desire ("what we *really* wanted") or an *ontological* claim about membership ("who *really* belongs"). It's about **authenticity of desire and identity**, not objective interest.

  ### The Core Concept: Authenticity Ventriloquism
  *   **What it is:** A political maneuver where an actor:
      1.  **Retrospectively constructs authenticity:** Positions a *newly adopted* preference, belief, or identity marker (e.g., wanting the lawsuit) as the *eternal, essential, but previously obscured* desire/identity of the group. The change isn't framed as change, but as *recognition* or *revelation* of what was always truly there ("finally understood what they'd wanted all along").
      2.  **Ventriloquizes the group:** The actor denies being the source of the new position, instead claiming to merely be the *mouthpiece* ("I don't lead anybody, I just say out loud...") for this uncovered authentic self. The group's subsequent adoption of the position becomes *proof* of its pre-existing authenticity and the actor's role as its passive conduit.
      3.  **Policing belonging based on constructed authenticity:** Defines the boundaries of legitimate membership ("the real association") based on adherence to this constructed authentic core ("people who built this place"). Those who dissent or don't fit the historical/ideological purity test are rendered inauthentic and thus non-representative or illegitimate.

  *   **Why "Ventriloquism"?** The actor throws their voice *into* the group, projecting the new idea *as if* it emanated from the group's deep, essential self. The group then "speaks" this idea, believing it to be their own authentic voice, while the ventriloquist disclaims authorship.

  *   **The Edge: Where it Doesn't Apply**
      *   *Simple Persuasion:* A member runs a strong campaign for the lawsuit, openly trying to *change minds* through arguments about benefits. People admit they were convinced. This involves agency in change, not denial of it. Ventriloquism denies the *change* happened; it was always there, just hidden.
      *   *Traditional Exclusion:* Saying "only paid-up members get to vote" (a clear, objective rule) is different. Ventriloquism excludes based on *constructed, subjective authenticity* ("real" members are those who embody the *spirit* or *history* we've just defined as essential).
      *   *Conspiracy Theory:* Claiming votes were rigged (fraud) is an attack on process, not an ontological claim about the group's authentic self or desires. Ventriloquism attacks the *authenticity* of the voters or their expressed will, not (necessarily) the mechanics.

  ### Applying it to Your Cases
  1.  **The Roof vs. Lawsuit Shift:** This is textbook Authenticity Ventriloquism.
      *   He retroactively constructed the desire for the lawsuit as the group's *true, buried desire* ("what we really needed").
      *   His actions (speeches, petition) weren't persuasion, but *revelation*. The change in survey results became *proof* the desire was always authentic.
      *   Members embraced the *narrative* ("finally understood") – the ventriloquist's voice became their "own."

  2.  **Rejecting the Vote:** This is the *belonging* arm of Authenticity Ventriloquism.
      *   He defines "the real association" by a constructed historical/identity purity ("people who built this place").
      *   Newer, less engaged members are deemed *inauthentic* – they don't embody this essentialized group identity.
      *   Their votes aren't fraudulent; they are *invalid* because the voters themselves are deemed illegitimate within the constructed authentic community. Their dissent *proves* their inauthenticity.

  **The Shared Principle:** Both moves stem from a single, deeply held principle: **There exists an essential, authentic core to "the people" (or "the association") that is knowable (by him) and trumps expressed, contingent preferences or procedural outcomes.** His role is to *recognize* this essence, *reveal* it when it's obscured, and *defend* it against inauthentic elements (whether internal desires corrupted by bad discourse or members lacking the essential identity). It's principled because, from his perspective, he's not creating anything; he's uncovering Truth and defending the Real against the false.

  **In a nutshell:** Your colleague practices **Authenticity Ventriloquism**: denying agency in changing preferences by constructing new stances as revealed eternal truths, and defining political legitimacy by policing membership against a constructed, essentialized identity. It's powerful because it makes opposition feel not just wrong, but *inauthentic*.
