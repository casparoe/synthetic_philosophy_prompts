  First, I recognize their core tension: how can cosmologists confidently define a universal "now" while simultaneously teaching that simultaneity is relative? Their geochemistry background provides an important anchor - dating rocks relies on proper time along worldlines, which remains uncontroversial. But cosmic time feels different, potentially implying a privileged frame.

  The user raises three layered questions: 
  1) Whether cosmic time represents eternalism with pragmatic convention, neo-Lorentzianism, or operationalism
  2) How their own dating practice differs from cosmological age statements
  3) What "the universe's age now" actually means in a block universe

  I consider structuring the response around three key distinctions: 

  First, cosmic time isn't metaphysical privilege but a physical feature emerging from large-scale isotropy. The FLRW metric's homogeneity allows defining hypersurfaces of constant proper time since the Big Bang. This isn't gauge fixing but exploiting a physical symmetry - the CMB frame isn't arbitrary when matter distribution defines it uniquely. 

  Second, the user's zircon dating differs fundamentally as it's local proper time. Cosmic time requires global structure. In Gödel's universe, cosmologists couldn't define a universal age - they'd report local proper times from the singularity, demonstrating our cosmic time depends on observable symmetries.

  Third, "13.8 Gyr now" is indexical but physically grounded. It means: along the hypersurface where CMB is isotropic, the proper time from singularity is 13.8 Gyr. If cosmologists took Rietdijk-Putnam seriously, they'd emphasize this is the comoving frame's measurement, not absolute truth. Their textbooks already hint at this through careful wording about "comoving observers."

  The deepest insight might be that cosmology's practice reveals time's dual nature: fundamentally relational (as proper time along worldlines) but globally coherent when symmetries permit. The block universe remains, but cosmic time isn't arbitrary - it's physics revealing a natural foliation.

  I should note where philosophy enters: whether this natural foliation constitutes "real" simultaneity is metaphysical. Physics only claims it's uniquely definable and empirically adequate in our universe. The user's discomfort stems from conflating operational definitions with ontological commitments - cosmologists aren't secretly neo-Lorentzian; they're pragmatically realist about measurable structures.
answer: |-
  What a fascinating convergence of expertise and philosophy! Your background in geochronology gives you a unique lens on this, and your questions cut to the heart of how physics navigates the tension between operational practice and metaphysical implications. Let's dissect the cosmologists' package of practices, separating what they strictly require from what they permit, and tackle your specific sticking points.

  **The Core Implicit View: Physical Coherence, Not Metaphysical Privilege (Mostly)**

  Cosmologists' use of cosmic time in FLRW (Friedmann-Lemaître-Robertson-Walker) spacetimes presupposes **a physically motivated, empirically accessible foliation defined by the large-scale structure of the universe, not a metaphysically absolute "now".** It's neither naive eternalism with an arbitrary convention nor stealth neo-Lorentzianism, but rather a robust consequence of the universe's observed symmetries.

  1.  **The Physical Basis (What Practice Requires):**
      *   **Homogeneity & Isotropy:** The fundamental postulate of modern cosmology is that the universe is homogeneous (same everywhere on large scales) and isotropic (same in every direction) *on spatial slices of constant cosmic time*. This isn't an arbitrary choice; it's strongly supported by observations (CMB isotropy, galaxy distributions).
      *   **The Hubble Flow & Comoving Coordinates:** Matter (on average) defines a natural rest frame – the "Hubble flow". Objects comoving with this flow are fundamental observers. Their clocks, *by construction*, measure cosmic time.
      *   **Cosmic Time Defined:** Cosmic time `t` is *defined* operationally as the proper time `τ` measured by a fundamental (comoving) observer since the Big Bang singularity (or more carefully, since the Planck time). Crucially, **all fundamental observers agree on the value of `t` at their location when the universe has the *same large-scale physical state* (e.g., same average density, same CMB temperature).**
      *   **Hypersurfaces of Constant Physical State:** The slices of constant cosmic time are hypersurfaces where key cosmological parameters (density, temperature, spatial curvature) are uniform. This uniformity is *physically measurable* (e.g., CMB temperature is the same on such a slice). The foliation is picked out *dynamically* by the evolution of the matter/energy content governing spacetime curvature via Einstein's equations.

  2.  **What It Is NOT (What Practice Avoids):**
      *   **Not Metaphysical Privilege:** Cosmologists don't claim cosmic time defines "real" simultaneity in an absolute, Lorentz-violating sense. They acknowledge that for *local* events (e.g., two supernovae in distant galaxies), simultaneity *is* frame-dependent. Cosmic time defines simultaneity *only* for the *global state* defined by large-scale homogeneity.
      *   **Not Arbitrary Gauge Fixing:** While coordinate choices are conventional, the cosmic time foliation is uniquely singled out by the *physics* of the FLRW solution. You *could* use other coordinates (like conformal time `η`), but `t` has the direct physical meaning of fundamental observer proper time and defines surfaces of constant physical state. Switching to a wildly different foliation would obscure the physical simplicity and predictive power of the model.
      *   **Not Neo-Lorentzian:** There's no hidden, universal "aether frame" or violation of local Lorentz invariance. The preferred frame is defined *relationally* by the matter distribution itself. If the matter distribution changed drastically (e.g., became highly anisotropic), the natural foliation would change or disappear. It's a feature *of this specific spacetime*, not a law overruling SR locally.

  3.  **The Implicit Ontology: Sophisticated Eternalism + Indexicality:**
      *   **Eternalism:** The practice sits comfortably within the block universe view. Spacetime is a 4D manifold. Events exist tenselessly.
      *   **Indexical "Now":** Your "now" is indeed indexical – it picks out the specific spacelike hypersurface (defined by cosmic time `t_0`, where `t_0` is the current proper time for *us*, fundamental observers *here and now*) that contains your current location. What makes `t_0` "now" for you is your position *on your worldline* within the block.
      *   **Physical Significance:** Crucially, the cosmic time foliation isn't *just* an indexical label. It labels hypersurfaces that have objective, measurable physical properties (uniform density, temp, etc.). This is the key difference from an arbitrary coordinate choice like UTC. UTC defines simultaneity for human convenience; cosmic time defines simultaneity for the *state* of the universe.

  **Addressing Your Specific Sticking Points:**

  1.  **Geochronology vs. Cosmic Age:**
      *   **Geochronology is Fundamentally Local:** You are absolutely right. Saying "this zircon crystallized 4.03 Ga" is stating a fact about *proper time along the zircon's worldline* between the event of crystallization and the event of measurement. This is invariant and frame-independent. It requires no global foliation. It's safe under any view of time.
      *   **Cosmic Age is Global but Rooted in Local Proper Times:** "The universe is 13.8 Gyr old" *is* different. It means: "The proper time elapsed along the worldline of a fundamental observer *from the Big Bang singularity to the event on their worldline that lies on the same hypersurface of constant CMB temperature/density as our current measurement event here on Earth* is 13.8 Gyr." It relies on:
          *   The existence of fundamental observers (comoving with the Hubble flow).
          *   The ability to define hypersurfaces where the global state is uniform (using the CMB isotropy as the operational marker).
          *   The agreement of *all* fundamental observers' proper times *on that specific hypersurface*.
      *   **In Clear:** Your zircon age is a point-to-point invariant interval on one worldline. The cosmic age is a statement about the invariant proper time along *any* fundamental observer's worldline up to the unique hypersurface that *we* label as "now" because we are on it.

  2.  **The Gödel Universe Hypothetical:**
      *   **Crucially Informative:** This is the perfect test case. In Gödel's rotating universe (or other spacetimes without a global Cauchy surface), there *is no* global foliation into spacelike hypersurfaces that all observers can agree capture "the state of the universe at a time." Closed timelike curves (CTCs) are possible.
      *   **Cosmologists Would Change Practice Radically:** They *could not* quote "the age of the universe" as a single, globally meaningful number. They would be forced to:
          *   Focus on *local* proper times from the Big Bang (or other origin) along specific worldlines. Different observers could have different proper times elapsed.
          *   Describe the history of specific regions or structures without implying a universal "now."
          *   Possibly abandon the concept of a single, global cosmic time altogether in favor of a patchwork of local times, or use other non-time parameters to order events causally where possible.
      *   **What This Tells Us:** The fact that cosmologists *can* define and meaningfully use a single cosmic time *in our universe* is a **discovery about the large-scale physical structure of our spacetime**, not a metaphysical prejudice smuggled in. It's contingent on the observed homogeneity, isotropy, and absence of CTCs. Our cosmic time is a feature of our universe's geometry, not a necessary philosophical posit.

  3.  **The Meaning of "13.8 Gyr Old Now" in the Block:**
      *   Here's the breakdown:
          *   **Relation:** It expresses a relation between two *classes* of events: 1) The Big Bang singularity (or the earliest measurable time). 2) All events constituting the hypersurface `Σ` defined by constant cosmic time `t = 13.8` Gyr, where `t` is the proper time for fundamental observers *at their location on `Σ`*.
          *   **Contents:** It describes the state (contents + geometry) of the specific spacelike hypersurface `Σ` within the 4D block where the proper time elapsed from the Big Bang along *any* fundamental worldline intersecting `Σ` is 13.8 Gyr. It's a statement about that particular "slice."
          *   **Indexicality:** The word "now" is indexical. It means `Σ` is the hypersurface that *contains the event of me making this statement*. "Now" picks out `Σ` because I (the speaker) am located on it.
      *   **What Changes if Rietdijk-Putnam is Taken Seriously?** Cosmologists already largely accommodate this! Look closely at their careful phrasing:
          *   "The age *in the rest frame of the CMB*..."
          *   "The time since the Big Bang *as measured by comoving observers*..."
          *   "The proper time *along the Hubble flow*..."
          *   Explicit statements that this defines simultaneity *for the purpose of describing the large-scale evolution of the universe*, not for local physics.
      *   **Concrete Textbook/Paper Changes (Subtle but Real):**
          *   **Emphasis:** More explicit statements upfront: "We adopt cosmic time `t`, defined as the proper time of comoving observers since the Big Bang, which provides a physically motivated foliation *due to the observed large-scale homogeneity and isotropy*. Simultaneity defined by `t` is global but contingent on this specific spacetime structure."
          *   **Wording:** Replace potentially misleading phrases like "the universe now" with "the hypersurface of constant cosmic time `t = t_0`" or "the state defined at cosmic time `t_0`".
          *   **Local/Global Distinction:** A clearer pedagogical separation: "For local events within a galaxy, simultaneity remains frame-dependent as per special relativity. Cosmic time defines a global simultaneity *only* for characterizing the large-scale state of the universe, made possible by its specific geometry."
          *   **Ontological Neutrality (Sometimes):** Some texts might add a footnote: "The use of a global cosmic time is consistent with various philosophical interpretations of time, including the 'block universe' view. It defines a preferred foliation *for cosmology* based on physical symmetries, not metaphysical necessity."

  **Synthesizing the Implicit View:**

  Cosmologists presuppose **a relational, empirically grounded view of time.** Time is fundamentally proper time measured along worldlines. In our specific universe, the large-scale matter distribution (via homogeneity/isotropy and the resulting FLRW geometry) provides a physically unique way to *synchronize* the proper times of fundamental observers *globally* to define hypersurfaces of constant large-scale physical state. This cosmic time `t` is:

  1.  **Physically Motivated:** Defined by the rest frame of the dominant matter/energy (CMB frame).
  2.  **Operational:** Measurable locally by any fundamental observer's clock since the Big Bang, and synchronized globally via the CMB isotropy.
  3.  **Contingent:** A feature of *our* universe's large-scale structure, not a necessary feature of all spacetimes (as Gödel shows).
  4.  **Compatible with Eternalism:** It labels slices within the block. The "present" slice is indexically defined by the speaker's location.
  5.  **Not Metaphysically Privileged:** Locally, SR rules; simultaneity for non-global events is frame-relative. Cosmic time defines a useful, physically significant global foliation, not an absolute "now" overriding SR.

  **Conclusion:** Your isotope dating practice was always ontologically safe, relying only on local proper time. Cosmologists' "age of the universe" leverages a *contingent, physically defined global foliation* made possible by the specific symmetry of our cosmos. They aren't secret neo-Lorentzians; they are sophisticated realists about the structures revealed by observation and GR. The foliation is neither pure gauge nor a smuggled absolute present; it's a discovery about how matter shapes spacetime on the grandest scale, allowing us to meaningfully speak of "the universe now" – with "now" being indexical, and "the universe" referring to the state on the uniquely definable hypersurface containing us. The Rietdijk-Putnam argument is sound *locally*, but our universe's global structure provides a physically robust way to define a cosmologically meaningful "now." The cosmologists you worked with didn't behave like believers because their practice reflects this nuanced physical reality, not a philosophical commitment to absolute simultaneity.
