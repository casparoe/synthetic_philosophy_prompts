  **OFFICE OF ONTOLOGICAL METROLOGY**  
  **TECHNICAL BULLETIN OOM-TB-114.7**  
  **EFFECTIVE DATE: 2024-05-23**  
  **SUBJECT: Certification Services for Fundamentality Rank and Grounding Relations**  

  1. **Purpose and Scope**  
  The Office of Ontological Metrology (OOM) hereby announces the availability of certified quantification services for (a) the fundamentality rank of any submitted entity and (b) the grounding relations between any submitted pair of facts. These services align with the OOM’s mandate to standardize ontological assessment pursuant to the *Metaphysical Uniformity Act*.  

  2. **Submission Requirements**  
  2.1. Entities or facts must be submitted via Form OOM-114.7A ("Ontological Intake Manifest").  
  2.2. **Hyperintensionality Compliance**:  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.1. Formulations must specify exact linguistic or propositional structure. Necessarily equivalent formulations (e.g., "2+2=4" vs. "the square root of 16 is 4") are distinct entities for certification purposes.  
  &nbsp;&nbsp;&nbsp;&nbsp;2.2.2. Co-referential descriptions (e.g., "H₂O" vs. "water") require separate submissions. Substitution post-certification voids the certificate (see Schedule B: Reissuance Fees).  
  2.3. All submissions must include a non-refundable Application Handling Fee (see Schedule D).  

  3. **Non-Causal Measurement Protocol**  
  3.1. Grounding relations are strictly non-causal and non-empirical. The OOM does not accept data from physical detectors (e.g., spectrometers, particle colliders, microscopes) or causal inference methodologies.  
  3.2. Certification relies exclusively on OOM-calibrated formal axiomatic models. Results are reproducible under identical propositional conditions.  

  4. **Structural Validation**  
  4.1. **Asymmetry & Irreflexivity**:  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.1. No entity may ground itself. Self-grounding submissions (e.g., "Fact F grounds Fact F") are rejected.  
  &nbsp;&nbsp;&nbsp;&nbsp;4.1.2. Mutual grounding loops (e.g., "Fact A grounds Fact B" and "Fact B grounds Fact A") are deemed ontologically unstable and invalid.  
  4.2. **Well-Foundedness Enforcement**:  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.1. All grounding chains must terminate in a fact certified as fundamental.  
  &nbsp;&nbsp;&nbsp;&nbsp;4.2.2. Applicants must designate a Chain Termination Officer (CTO) responsible for attesting termination. CTO credentials subject to OOM audit (fee applies).  

  5. **Grounding of Grounding Facts**  
  5.1. The grounding relation(s) between submitted facts (e.g., "Fact A grounds Fact B") may itself require certification.  
  5.2. Applicants may elect:  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.1. **Deferred Certification**: Grounding relations are marked "provisionally fundamental" (no initial fee but subject to future audit).  
  &nbsp;&nbsp;&nbsp;&nbsp;5.2.2. **Recursive Certification**: Each grounding link certified individually (per-link fee applies; see Schedule D.3).  

  6. **Purity Requirement**  
  6.1. Facts about derivative entities must be grounded exclusively in facts about more fundamental entities.  
  6.2. Reverse grounding ("top-down" or "circular" dependence) violates OOM Purity Standards. Such submissions will be rejected or require reformulation (surcharge applies).  

  7. **Operator/Relation Declaration**  
  7.1. Form OOM-114.7B ("Grounding Format Specifier") requires applicants to declare whether grounding is designated as a *relation* or *sentential operator*.  
  7.2. Note: This declaration is fee-neutral and does not affect certification rigor. OOM maintains ontological parity between models.  

  8. **The "Nothing Over and Above" Provision**  
  8.1. Per OOM Guideline §8.11, derivative entities certified as having "no additive ontological content" relative to their fundamental grounds qualify for a Fee Exemption.  
  8.2. Applicants must submit Form OOM-114.7C ("Nothing-Over-and-Above Attestation") to claim exemption.  

  ---

  **SCHEDULE D: FEE SCHEDULE**  
  - D.1. Fundamentality Rank Certification: **$475.00 per entity**  
  - D.2. Grounding Relation Certification (base fee): **$620.00 per fact-pair**  
  - D.3. Recursive Grounding Certification (per additional link): **$310.00**  
  - D.4. Hyperintensional Reformulation Surcharge: **$180.00**  
  - D.5. Chain Termination Officer Credentialing: **$225.00**  
  - D.6. "Nothing Over and Above" Attestation Processing: **$0.00**  

  ---

  **ATTACHMENT: COMPLAINT RECEIVED 2024-05-22**  
  **FROM: ASSOCIATION FOR THE REPLACEMENT OF GROUNDING BY IDENTITY, CAUSATION, AND LAW (ARGICL)**  

  *To the Office of Ontological Metrology:*  

  ARGICL disputes the utility of Bulletin OOM-TB-114.7. Our members report that OOM-certified grounding relations conferred no tangible explanatory benefit beyond established identity, causal, or nomological facts. For example, the certification of "Mental state M is grounded in physical state P" (Invoice #1147-889: $620.00) failed to resolve any previously unresolved question about M or P. The certification document merely restated the submission in bold font with an OOM seal.  

  We contend that OOM is billing clients for restating their own premises. Until OOM demonstrates that "grounding" does explanatory work *not reducible* to identity, causation, or laws, we recommend suspending this service.  

  ---  

  **FINAL CERTIFICATION CLAUSE**  
  This bulletin (OOM-TB-114.7) is self-certified as **FUNDAMENTAL** under OOM Purity Standard §6.1. No grounding facts precede or enable its ontological validity. Certification Fee: **$0.00**.  

  ---  
  *Office of Ontological Metrology • A Division of the Department of Conceptual Integrity*  
  *Questions? Contact certifications@oom.gov • Please allow 6-8 weeks for processing*
