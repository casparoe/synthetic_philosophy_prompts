answer: |-
  Here’s your Q&A prep sheet, tailored to the room and battle-tested for tactical concessions. Objections are ordered by **damage potential** (high to medium) and **likelihood** (high to moderate). Each reply includes soft spots and strategic concessions.

  ---

  ### **Top 8 Objections & Replies**  
  *(90-second answers; soft spots marked)*  

  1. **Kripkean Essentialist**:  
     *Objection*: "Your argument dismisses the *intuition* that I couldn’t have come from different gametes. But that intuition anchors origin essentialism. What are you trading it *for*? A deflationary picture where ‘being me’ is arbitrary?"  
     **Reply**: "I’m trading it for biological precision. The intuition relies on a *determinate* sperm/egg pair—but biology shows no such pair exists pre-conception. My argument doesn’t deny you *have* this intuition; it shows the intuition targets a biologically incoherent object. **Soft spot**: Concede that intuitions feel compelling but argue they’re unreliable when biology underdetermines their objects. **Concession**: 'Yes, this forces us to abandon a deeply felt intuition—but not because we’re anti-essentialist. Because the biology won’t cooperate.'"  

  2. **Hylomorphic Animalist**:  
     *Objection*: "You conflate *constitution* with *identity*. Even if genetic material is indeterminate, the organism’s essence lies in its developmental *telos*—not its atoms. Why ground essentialism in genetics at all?"  
     **Reply**: "I target *specifically* gamete-based essentialism (e.g., Kripke’s 'sperm and egg' claim). If essence is in the organism’s life-cycle, not its origins, we agree! But most origin essentialists *do* ground necessity in gametes. **Soft spot**: My argument doesn’t touch hylomorphic essence. **Concession**: 'Absolutely—if you reject genetic essentialism, my critique doesn’t apply. I’m only undermining those who tie identity to gametes.'"  

  3. **Lewisian Counterpart Theorist**:  
     *Objection*: "This isn’t indeterminacy—it’s context-sensitivity! 'Could I have had different origins?' is answered by choosing a counterpart relation. Your 'indeterminacy' just reflects unstated parameters."  
     **Reply**: "Counterpart theory *resolves* vagueness by stipulation. But the essentialist claims a *metaphysical* fact: 'Nec[I originate from gametes G]'. If there’s no fact about *which G* are mine, no counterpart relation fixes that. **Soft spot**: If the essentialist retreats to 'in some contexts, we pick precisified G', they abandon metaphysical necessity. **Concession**: 'I’ll grant counterpart theory handles the semantics. But it confirms my point: the *metaphysical* necessity claim evaporates.'"  

  4. **Modal Logician**:  
     *Objection*: "How do you formalize 'indeterminate necessity'? If □P lacks a truth-value, what semantics govern modal operators? Are you committing to ontic vagueness?"  
     **Reply**: "Treat it like vague identity. Supervaluation over precisifications of 'gamete/genome' works: 'Nec[originates from G]' is neither true nor false across all admissible precisifications. **Soft spot**: This requires vague objects—controversial but defensible. **Concession**: 'Yes, this implies ontic vagueness. If you reject that, my argument becomes epistemic.'"  

  5. **Philosopher of Biology**:  
     *Objection*: "Recombination’s randomness doesn’t imply indeterminacy *of the gamete*. The sperm that fertilizes the egg is a specific historical cell—even if genetically unique. Why can’t we rigidly designate *that cell*?"  
     **Reply**: "Because meiosis produces ~100-200 genetically distinct spermatids *per* spermatogonium. Pre-fertilization, there’s no fact about *which* one 'must' fertilize the egg. **Empirical premise**: Confirm that a single meiosis generates many viable, genetically distinct sperm. **Concession**: 'I concede we can rigidly designate the *actual* sperm post-hoc. But the essentialist needs *modal* specificity—which fails.'"  

  6. **Parfitian**:  
     *Objection*: "Why drag metaphysics into population ethics? We can say 'the same child couldn’t have been born later' *without* essentialism—it’s a practical constraint!"  
     **Reply**: "Because essentialists *use* it to block conclusions like the Repugnant Conclusion (e.g., 'Child B isn’t worse off; she couldn’t exist otherwise'). If their move is indeterminate, so is the debate. **Soft spot**: Ethics might not need metaphysics. **Concession**: 'If you divorce the ethics from origin essentialism, I’m happy. But many don’t.'"  

  7. **Hylomorphic Animalist (Follow-up)**:  
     *Objection*: "Even granting genetic indeterminacy, why think *organism identity* depends on it? The zygote is already a new substance with its own *principium individuationis*."  
     **Reply**: "Then origin essentialists must justify why *that zygote* necessarily comes from *those gametes*. But if gametes are indeterminate, the claim 'this zygote must originate from G' lacks sense. **Concession**: 'I agree substance formation may resolve indeterminacy—but only *after* conception, not for modal claims about origins.'"  

  8. **Kripkean (Follow-up)**:  
     *Objection*: "If origin essentialism is indeterminate, is *all* essentialism vague? Do I not essentially have my parents?"  
     **Reply**: "Parents are macro-objects; gametes are not. You essentially originate from *some gametes from your parents*, but not specific ones. **Concession**: 'Parental essentialism stands—it’s the gamete-level determinacy that fails.'"  

  ---

  ### **Strategy Addendum**  
  - **Concede in Opening**:  
    1. "I grant that origin essentialism captures a powerful intuition." (Kripkean)  
    2. "Parfit is right that population ethics needs clarity—my goal is to show essentialism *can’t provide it*." (Parfitian)  

  - **Must-Land Reply** (For Modal Logician/Biologist):  
    *"Recombination ensures no gamete contains the zygote’s nuclear genome. If essences depend on origins, but the origin (genome) doesn’t exist until *after* conception, the 'essential origins' claim is circular."*  

  - **Question You Hope Nobody Asks**:  
    *"If sperm are indeterminate, why not say the *egg* is the essential origin? Eggs are fewer and asymmetric in contribution."*  
    **Why it’s deadly**: Eggs also undergo recombination and polar body extrusion—similar indeterminacy, but less studied. You’d need empirical backup.  

  - **Weakest Point to Defend (Don’t Hide!)**:  
    The inference from *biological* indeterminacy to *metaphysical* indeterminacy.  
    **Defense**: "This isn’t epistemic—we’re not ignorant; there’s no fact *to be known*. Biology fixes the bounds of what’s determinate, and here it fails."  

  ---

  ### **Epistemic Assessment**  
  - **Confidence in Diagnoses**: 85%. Room dynamics are predictable based on stated allegiances.  
  - **Least Confident Claim**: That the **Lewisian** will frame the issue as *counterpart context-sensitivity*. They *might* instead argue you’ve misrepresented essentialism as requiring gamete-level specificity.  
    **Mitigation**: Preface replies with: "If essentialism requires only *parental* origins, my argument doesn’t bite—but Kripke *does* specify gametes."  

  **Final Tip**: When discussing meiosis/recombination, use: *"As I understand the biology..."* and cite *"current models of gametogenesis"*—not definitive claims. Verify:  
  1. Number of distinct sperm per meiosis.  
  2. Whether recombination truly ensures *no* gamete matches the zygote’s nuclear genome.  

  Go own that room. The corollary is worth the fight.
