  Strategic concessions in the opening: acknowledge the power of origin intuitions (for the Kripkean) and Parfit's repugnant conclusion relevance (for the Parfitian). The absolute must-land reply is the genome novelty argument - without it, the sperm indeterminacy alone isn't sufficient.

