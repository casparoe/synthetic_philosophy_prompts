answer: |-
  1.  **Horn 1 (Gods love pious because it's pious):** This maps to a specification (`spec`) serving as the independent, prior standard against which an implementation is verified for refinement or correctness; the property holds regardless of any specific model.
  2.  **Horn 2 (Pious because gods love it):** This maps to verification solely against an arbitrary oracle or specific golden model (`golden model`), where correctness is defined entirely by matching that model, risking "spec gaming" as the oracle/model itself might not capture true intent.
  3.  **Nature Move:** This corresponds to verifying equivalence against a specific golden model (`golden model`), dodging the ambiguity of an abstract spec by grounding correctness in a concrete, prior reference implementation you implicitly trust as "nature".
  4.  **Fourth Option (Fixed Point):** This resembles co-induction or defining refinement via mutual consistency (like assume-guarantee contracts converging to a fixed point), avoiding prior primacy; it's distinct but collapses into a form of Horn 1 if the co-defined spec is taken as the ultimate standard post-convergence.
  5.  **Residue:** Philosophy's irreducible normativity (the "should") has no direct counterpart in verification's functional checks, while verification's counterexample generation and concrete underdetermination lack philosophical equivalents, highlighting that verification handles provable correctness but not foundational value.
