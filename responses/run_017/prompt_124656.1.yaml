  Horn 1 (gods love pious because it's pious) becomes specification as independent standard - like properties holding regardless of implementation. 
  Horn 2 (pious because gods love it) is specification as arbitrary oracle - vulnerable to spec-gaming where implementations meet letter but not intent. 

  The theological "nature" dodge translates to golden models - avoiding ambiguity by equivalence checking against a reference implementation rather than abstract properties. Their fourth option about mutual definition resembles fixed-point convergence in refinement cycles, which avoids prioritizing spec or implementation. 

  For the residue analysis: Philosophy brings irreducible normativity ("shouldness") absent in verification's functional checks, while verification's counterexample generation lacks a direct counterpart. This gap highlights that verification handles provable correctness but not value foundations. 

