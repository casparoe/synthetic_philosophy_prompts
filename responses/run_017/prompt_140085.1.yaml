answer: |-
  ### Part 1: Translation & Mapping Table  
  **Fanatical Recommendation (FR)**  
  *Formal Structure:* A max-Kelly bet on an extreme-positive-skew asset.  
  - **Bankroll:** Marginal resources (capital, attention).  
  - **Bet Size:** Fraction allocated to long-horizon interventions.  
  - **Probability:** \(\mathbb{P}(\text{trajectory improvement}) \approx \epsilon > 0\) (subjective model probability).  
  - **Payoff:** \(\Pi = \) Expected future lives conditional on success, modeled as a heavy-tailed RV with undefined mean under some priors (tail index \(\alpha < 1\)).  
  - **Objective:** Maximize ensemble-expected value \(\mathbb{E}[\Pi]\), ignoring time-average or ruin constraints.  
  - **Ruin Event:** Extinction (absorbing state).  

  **Simulation Argument Deflation (SAD)**  
  *Formal Structure:* A change of measure + payoff truncation + adversarial model uncertainty.  
  - **Model Space:** Three disjoint model classes:  
    - \(M_1\): High extinction probability (short-run horizon).  
    - \(M_2\): Low simulation-run probability (low \(\mathbb{P}(\text{simulated})\)).  
    - \(M_3\): High \(\mathbb{P}(\text{simulated})\) with truncated \(\Pi\).  
  - **Payoff under \(M_3\):** \(\Pi_{\text{sim}} = \Pi \cdot \mathbb{I}_{\{\tau > T\}}\), where \(\tau\) is endogenous stopping time (runtime budget), and \(T\) is a random horizon.  
  - **Reflexivity:** \(\tau\) depends on actions \(a_t\) (e.g., investing in sim-tech may shorten \(\tau\)).  

  **Mapping Table**  
  | Term             | FR Reading                          | SAD Reading                                  | Formal Kind                     |  
  |------------------|-------------------------------------|----------------------------------------------|---------------------------------|  
  | Probability      | Subjective betting odds             | Model-class measure (Bayesian credence)      | Radon-Nikodym derivative        |  
  | Payoff (\(\Pi\)) | Ensemble-average lives              | \(\Pi \cdot \mathbb{I}_{\{\tau > T\}}\)      | Truncated RV                    |  
  | Ruin             | Extinction (absorbing)              | Simulation shutdown (endogenous stopping)    | Stopping time \(\tau\)          |  
  | Model Space      | Single heavy-tailed model           | BMA over \(M_1, M_2, M_3\) + minimax         | Non-normalizable measure space |  
  | Objective        | Max \(\mathbb{E}[\Pi]\)             | Max \(\inf_{\text{models}} \mathbb{E}[\Pi]\) | Minimax over \(\mathcal{M}\)    |  
  | Kelly Fraction   | \(f^* \approx 1\) (max leverage)    | \(f^* \downarrow\) due to tail truncation    | Sizing under new distribution   |  

  **SAD as a Formal Operation:**  
  - Simulation hypothesis is **not** just an extra model in BMA. It forces:  
    - *Change of measure:* \(\mathbb{P}_{\text{real}} \to \mathbb{P}_{\text{sim}}\) (credence shift).  
    - *Payoff truncation:* \(\Pi \mapsto \Pi \cdot \mathbb{I}_{\{\tau > T\}}\) (tail cut).  
    - *Minimax overlay:* Adversarial \(\tau(a_t)\) due to reflexivity.  
  - **Deflation mechanism:** Reduces tail index \(\alpha\) of \(\Pi\) (thicker left tail) and may make \(\mathbb{E}[\Pi]\) undefined. FR’s bet becomes fractional Kelly with high haircut.  

  ---

  ### Part 2: Genuine Analogues vs. Metaphors  
  - **Genuine Analogues:**  
    - **Heavy tails & undefined mean:** Same. If \(\mathbb{P}(\text{simulated})\) implies \(\alpha < 1\) for \(\Pi\), \(\mathbb{E}[\Pi]\) diverges.  
    - **Endogenous stopping time (\(\tau\)):** Same structure. \(\tau\) depends on policy (e.g., ruin from overallocation to low-\(\mathbb{P}\) bets).  
    - **Minimax over model classes:** Direct analogue. SAD forces worst-case optimization over \(\{M_1, M_2, M_3\}\).  
    - **Improper prior:** Nesting clause creates non-normalizable hierarchy → BMA breaks. Requires minimax or improper prior handling.  

  - **Metaphors Only:**  
    - **Expected log vs. linear growth:** FR ignores this, but SAD doesn’t rescue it—both optimize \(\mathbb{E}[\text{value}]\), not \(\mathbb{E}[\log]\).  
    - **Fractional Kelly for model risk:** Artifact. Kelly assumes repeated bets; here "bets" are one-shot (no ergodicity).  
    - **Reflexivity ≠ Market feedback:** Simulator’s objective is unknowable; no analogue to price impact.  

  - **No Purchase:**  
    - **Time vs. ensemble average:** Irrelevant. Both sides use ensemble \(\mathbb{E}[\Pi]\).  

  ---

  ### Part 3: Residue Report  
  **Carries Over Without Loss:**  
  1. Tail truncation of \(\Pi\) under simulation.  
  2. Bayesian model averaging over \(\{M_1, M_2, M_3\}\).  
  3. Endogenous stopping time \(\tau\) as a function of actions \(a_t\).  

  **Carries Over with Distortion:**  
  1. **Kelly fraction as bet sizing:**  
     - *Distortion:* Kelly assumes repeated i.i.d. bets with known distribution. Here: one-shot, model uncertainty, no clear bankroll dynamics.  
     - *Artifact?* Yes. Fractional-Kelly logic (from finite bankroll/survival) doesn’t cleanly map—FR already ignores survival.  

  2. **Minimax for model risk:**  
     - *Distortion:* Minimax is conservative; SAD uses it for deflation, but FR might counter with "optimistic prior" over simulators.  
     - *Artifact?* Partly. Your framework pushes minimax due to adversarial \(\tau(a_t)\), but simulators’ true objective is undefined.  

  3. **Improper prior over nesting levels:**  
     - *Distortion:* Treated as tail risk, but non-normalizability breaks BMA.  
     - *Artifact?* Defect of framework. Decision theory lacks tools for ungrounded hierarchies.  

  **Cannot Be Expressed:**  
  1. **Reflexivity of simulator objectives:**  
     - *Why:* No analogue for "observer-dependent payoff." Your framework assumes exogenous distributions.  
     - *Defect or Artifact?* Defect. A general DT vocabulary should handle performative predictions (e.g., Schrödinger’s simulator).  

  2. **Self-sampling assumption (SSA):**  
     - *Why:* SSA assigns credence via indexicality—no sampling procedure exists. Your probability is either subjective odds or frequentist.  
     - *Defect or Artifact?* Artifact. SSA is an ad hoc prior; not a well-posed probability.  

  3. **Unnormalizable measure over simulation levels:**  
     - *Why:* Hierarchies with no base reality → infinite regress. BMA diverges; no \(\sigma\)-finite measure.  
     - *Defect or Artifact?* Defect. Framework can’t handle improper priors without arbitrary truncation.  

  ---

  ### Part 4: Bottom Line  
  **Does SAD Deflate or Relocate Fanaticism?**  
  - **Deflates FR:** If \(\mathbb{P}(M_3)\) is high *and* \(\tau\) is short/heavy-tailed, \(\mathbb{E}[\Pi]\) collapses → reduces Kelly fraction.  
  - **But relocates it:** If \(\mathbb{P}(M_3)\) is uncertain, FR reapplies to meta-bets:  
    - *Bet 1:* Allocate to shortening sim-depth (reduce nesting risk).  
    - *Bet 2:* Allocate to pleasing simulators (extend \(\tau\)).  
    This is **re-levering into a different tail:** Same max-Kelly structure on \(\mathbb{P}(\text{survive sim})\) with payoff \(\Pi_{\text{sim}}\).  

  **Risk Manager’s Cut Trigger:**  
  Cut long-horizon positions iff:  
  1. **Model space correlation:** \(\exists\) model \(M_i\) where \(\text{Corr}(\text{action } a_t, \tau) < 0\) (e.g., sim-tech investment hastens shutdown).  
  2. **Tail congruence:** Left-tail of \(\tau\) is fatter than right-tail of \(\Pi\) (i.e., \(\mathbb{P}(\tau < t) > \mathbb{P}(\Pi > k)\) for large \(k\)).  
  3. **Minimax bound:** \(\inf_{\text{models}} \mathbb{E}[\Pi] < \text{risk-free rate}\) (opportunity cost).  

  **Otherwise:** Resize. Apply fractional-Kelly haircut to the meta-bet:  
  \[
  f^* = \frac{\mathbb{E}[\Pi_{\text{sim}}] - \Pi_{\text{rf}}}{\text{Var}(\Pi_{\text{sim}})} \cdot \frac{1}{\gamma}  
  \]  
  where \(\gamma > 1\) is a minimax penalty for model uncertainty over simulator motives.  

  **Final View:** SAD forces a haircut but doesn’t eliminate fanaticism—it demands a nested minimax-Kelly approach over sim-levels and horizons. The unresolvable residue (reflexivity, unnormalizable measures) means you’re still betting; you’ve just moved the casino.  

