prompt: |-
  Two people in my decision-theory reading group got into it after we went over the Hofstadter stuff on superrationality, and they asked me to settle it, which I definately can't. Here is roughly how it went.

  The case Marta kept using was this. Two players, no communication, both perfect reasoners, each knows the other is a perfect reasoner, common knowledge all the way up. A fair coin decides which one is the "strong" player and which is the "weak" player, and each is told which one they are. Then they play a one-shot prisoners' dilemma. Temptation and sucker payoffs are the same for both: defect while the other cooperates and you get 5000, cooperate while the other defects and you get 0, both defect and you get 1000. The only difference is the reward for mutual cooperation: the strong player gets 3000, the weak player gets 1500. So it's still a PD for both of them, but the weak player gains only 500 from mutual cooperation over mutual defection, while the strong player gains 2000.

  (1) Marta opened with: superrationality is either evidential decision theory in a costume or it's a mistake. The move where you say "I'm not choosing between cooperate and defect, I'm choosing between us-both-cooperating and us-both-defecting" assumes the very thing that needs arguing for, namely that my decision settles his. Causal decision theory says: whatever he does, I do better by defecting. The correlation is just evidence, and if you want to act on evidence you're an EDT person and you don't need a new word for it.

  (2) Sascha: that misdescribes the view. What's chosen isn't an act, it's the output of a reasoning procedure that happens to be running in two places. That's why it doesn't collapse into EDT: EDT buys correlation wherever it finds it, which is why it tells you not to smoke in the smoking-lesion case — it manages the news instead of the world. Superrationality only cares about correlation that comes from the same reasoning being instantiated twice. And it's also why you don't get to defect once you learn you're the weak player: there's no later self who reopens the question.

  (3) Marta: ok, take it at the level of procedures and apply it to my game. Two things happen. If superrationality is "do what you'd want every relevantly similar reasoner to do," it has no grip here at all — the players aren't mirrors, they're one procedure with different inputs, so there's no single act they must both land on. If instead you evaluate policies from behind the veil, before the coin, then mutual cooperation isn't the best one. Mutual cooperation is worth 2250 a head ex ante. The policy "whoever is strong defects, whoever is weak cooperates" is worth 2500, and so is its mirror image; and since we're running identical reasoning we can share a coin flip to choose between them, so 2500 each. Note that the exploited weak player ends up with 0, which is worse than the 1000 he'd get from mutual defection and worse than the 1500 from mutual cooperation. So superrationality taken seriously as policy choice tells us to flip a coin to decide which of us gets 5000 and which gets nothing. That's a reductio of the theory, not a solution to anything.

  (4) Sascha: the craziness is an artifact of counting dollars. Under even mild concavity the ranking flips: with square-root utility, the coin policy is worth about 35 to each of us ex ante, against about 47 for mutual cooperation, because it puts half your probability on zero. So the answer depends on a parameter you left free, which is normal in decision theory, not a reductio. And it cuts both ways — a risk-seeking weak player likes the coin policy even more than I said.

  (5) Marta: but that's just my point showing up in a new place. Now the answer depends on whose utility function the procedure is maximizing and how you combine them. In the symmetric case there's only one utility function in the room so nobody notices. Here the stakes differ, so the attitudes to risk can differ, and "what would we want the procedure to output" has no answer until you import a rule: sum the utilities, maximise the worst off, average behind a veil, pick a Nash bargaining point. The rule does all the work. So the superrational solution to the one-shot PD was never rationality alone — its rationality plus the assumption that everyone in the room wants the same thing, which is exactly what fails in any real conflict.

  (6) Sascha: overstated. Even with divergent interests the framing still rules out the outcome ordinary decision theory walks straight into, and it relocates what's left over: not whether to cooperate but how to split. That's progress, not silence. And "you imported an aggregation rule" applies to every multi-agent decision problem there is, two people picking a restaurant included, so it doesn't tell us anything special about superrationality.

  Can you go through this move by move and tell me who's right about what? I'd like each of the six moves rated somewhere from clearly mistaken to clearly right with a sentence or two of justification, then a verdict on who is more right overall. And the bit I actually care about: what are they both missing? My only guess is that the whole things hinges on whether the two players are really perfect correlates once their inputs differ — Marta just helps herself to "same procedure, different inputs" in move 3, but I don't see why different inputs can't break the correlation in the randomisation too, in which case the coin-flip policy in move 3 isn't even available — but I really don't know, and neither of them addressed it. Say what you think the unexamined assumption is, even if it isn't that one.
reasoning: |-
  Okay, let me try to unpack this superrationality debate between Marta and Sascha. The user wants a move-by-move analysis of their argument, ratings for each point, an overall verdict, and identification of what both might be missing. 

  First, I need to understand the setup: asymmetric PD with "strong" and "weak" players after a coin flip. Mutual cooperation pays differently (3000 vs 1500), but defect/cooperate still favors defector (5000 vs 0). Mutual defection is 1000 each. 

  Marta opens by attacking superrationality as either EDT in disguise or circular. That seems fair - the core issue is whether decision determines the other's action. Sascha counters that it's about identical reasoning procedures, not general correlation. This distinction matters because it avoids EDT's smoking-lesion problem. 

  In move 3, Marta drops the bombshell: if we consider pre-coin policy selection, mutual cooperation isn't optimal. Her proposed "flip to decide who exploits whom" gives higher expected payout (2500 vs 2250) but seems ethically messy. Sascha responds that utility curvature changes this - with risk aversion, mutual cooperation dominates. 

  Marta then pounces: this reveals superrationality secretly requires utility aggregation when interests diverge. Sascha concedes the point but argues it's still progress over standard game theory. 

  The user's buried concern resonates - can "identical procedure" survive asymmetric inputs? If the coin flip breaks synchronicity, the whole policy coordination mechanism crumbles. Neither debater addresses this ontological crack in the framework. 

  Hmm... Marta's critiques are technically sharper but Sascha salvages conceptual value. The unexamined assumption might be that "same procedure + different inputs = predictable output correlation". In reality, once inputs differ, the black box of "perfect reasoning" could produce anything - including non-correlated randomization. 

  Overall, Marta wins on logical rigor (she exposes multiple fractures in superrationality) but Sascha's right that the thought experiment has heuristic value. The user's intuition about input asymmetry breaking correlation is astute - that's the real pivot point they're circling.
answer: |-
  Here's a move-by-move analysis, ratings, overall verdict, and identification of the unexamined assumption:

  ### Move-by-Move Analysis
  **(1) Marta: "Superrationality is EDT or a mistake"**  
  *Rating: Partially right, but oversimplifies.*  
  Marta correctly identifies that superrationality implicitly assumes acausal correlation (your choice settles theirs). Her critique that CDT strictly dominates is valid *if* you reject acausal links. But she misses Sascha's key distinction: superrationality restricts correlation to *identical reasoning processes*, avoiding EDT's broader vulnerability (like smoking-lesion).  

  **(2) Sascha: "It's about identical reasoning procedures"**  
  *Rating: Largely correct.*  
  Sascha validly distinguishes superrationality from EDT by emphasizing *procedural identity* as the source of correlation. This avoids "managing the news" and explains why post-input knowledge (e.g., being "weak") doesn't break cooperation in symmetric PDs. The "no later self" point counters renegotiation.  

  **(3) Marta: Policy-level analysis shows problems**  
  *Rating: Technically correct but misapplied.*  
  Marta correctly notes that ex ante policy evaluation undermines mutual cooperation (2250) vs. exploitative policies (2500). However, her "coin-flip to decide exploiter" **presumes perfect correlation persists** despite asymmetric inputs—a critical unsupported assumption. Without this, the policy fails.  

  **(4) Sascha: Utility curvature matters**  
  *Rating: Correct and important.*  
  Sascha legitimately points out that risk aversion (e.g., √utility) reverses the ranking: mutual cooperation (≈47) dominates the risky exploitative policy (≈35). This highlights that the "best" policy depends on utility functions, which Marta omitted.  

  **(5) Marta: Aggregation rules are doing the work**  
  *Rating: Clearly right.*  
  Marta nails the core problem: with asymmetric stakes, superrationality requires aggregating divergent utilities (strong vs. weak). "What the procedure should output" isn't defined without a social choice rule (e.g., utilitarianism, maxmin). This exposes superrationality's reliance on shared goals.  

  **(6) Sascha: It's still progress**  
  *Rating: Partially right but evades the core issue.*  
  Sascha fairly notes that superrationality avoids mutual defection and reframes conflict as "how to split." But Marta’s point stands: without prior agreement on aggregation, the theory is incomplete. "All multi-agent problems need aggregation" is true but doesn’t absolve superrationality’s specific limitation.  

  ---

  ### Overall Verdict  
  **Marta is more right.** She exposes fundamental flaws:  
  - Superrationality’s acausal correlation is either circular (if assumed) or reduces to EDT (if generalized).  
  - Asymmetric cases reveal its dependence on exogenous aggregation rules, undermining its claim as a *purely rational* solution.  
  Sascha’s defense is thoughtful but doesn’t resolve these issues. His utility-curvature point saves superrationality in *some* parameterizations but concedes that the theory isn't universally applicable without auxiliary assumptions.  

  ---

  ### The Unexamined Assumption  
  **Your intuition is correct: Both overlook whether identical reasoning procedures with *different inputs* guarantee correlated outputs.**  

  - **Marta assumes** in (3) that "same procedure + shared coin flip" enables coordinated exploitation. But if inputs ("strong"/"weak") break synchronicity, their "randomized" policies may not correlate. One might defect while the other cooperates, yielding mutual defection (1000) or sucker payoffs (0/5000)—worse than her calculation.  
  - **Sascha assumes** in (2) that procedural identity forces identical *decisions* regardless of inputs. Yet differing inputs could lead the same algorithm to output differently (e.g., "if weak, cooperate; if strong, defect"). This collapses superrationality into standard game theory.  

  **Why this matters**: Superrationality requires not just identical reasoning but *input-insensitive outputs*. If the procedure’s output depends on inputs (e.g., role asymmetry), correlation vanishes. Neither addresses how "perfect reasoners" would handle input-dependent decisions while preserving acausal coordination. This gap is fatal in asymmetric games.  

  **Key insight**: Superrationality works only when the "identical procedure" outputs the *same action* despite differing inputs (e.g., in symmetric PDs). Asymmetric cases break this, exposing the need for meta-agreements (like aggregation rules) or resigning to CDT.
