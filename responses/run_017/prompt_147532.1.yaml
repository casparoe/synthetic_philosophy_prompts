prompt: |-
  I'm a final-year PhD student giving a job talk next month on the third chapter of my dissertation, and what I need is a Q&A prep sheet rather than a defense of the view. The chapter argues for a position I call frame-relative accuracy. Start from the standard accuracy-first setup: a space of possibilities, a credence function over an algebra on it, and inaccuracy measured by a strictly proper rule. My addition is that accuracy is always assessed relative to a frame, a partition of the possibility space into the distinctions the agent is treating as live, so that the inaccuracy of a credence function at a world, relative to a frame, is the squared-distance score of its marginal distribution over that frame's cells against the indicator of the cell containing the world. I then say that a body of evidence settles a family of admissible frames rather than a unique one, where a frame is admissible when it respects every distinction the evidence supports and draws no distinction the evidence gives no support for. Because evidence can support two distinctions separately without supporting their common refinement — it can tell you something about color and something about size and nothing about how they correlate — admissible frames are typically incomparable with one another, and the refinement that cross-classifies them is not automatically admissible. Total inaccuracy is then the average of frame-relative inaccuracy over the admissible family under a weighting that the evidence constrains but does not fix; I impose on that weighting only that it be a probability measure on the family and that it not increase as frames get finer. The result I advertise as the main lemma is that, for any admissible weighting, two credence functions agreeing on the marginals of every admissible frame are exactly tied in expected inaccuracy, while any difference on those marginals makes an accuracy difference. So permissiveness is real but structured, and its size is a function of how much discrimination the evidence supports: thin evidence, coarse frames, wide ties; rich evidence, fine frames, near uniqueness. I keep probabilism and the usual accuracy-based vindication of conditionalization intact, I am not proposing an imprecise-credence or credal-set framework, and I am not making a semantic claim about the word rational. The novelty is supposed to be that the locus of permissiveness is the frame rather than the attitude, that uniqueness holds relative to a frame, and that this predicts the tightness of the link between strength of evidence and size of the permissible set.

  The room is a departmental colloquium of about thirty people, and I want the objections as these people in particular would raise them. The chair is a formal epistemologist and a convinced uniqueness theorist: she holds that permissivism is a confusion generated by conflating the attitude of credence with the evidence, and I expect her to grant me the whole framework and then ask what follows from it that a uniqueness theorist should care about, or to say that I have simply relocated the permissivism one level up. Two other formal epistemologists are sympathetic to accuracy-first methods but think its vindications are all conditional on the choice of scoring rule, and one of them works on imprecise probabilities and will want to know why I am not just describing a credal set with extra machinery. There are two philosophers of science present: one works on verisimilitude and the epistemic value of deliberately false but highly informative idealised models, the other on model selection and coarse-graining in multiscale modelling; the first will press on whether accuracy is the right currency for theory choice at all, the second on how a frame differs from a choice of scale or level of description, and on what my apparatus would tell someone choosing between models. There is also a decision theorist who regards epistemic utility theory as decision theory with a gerrymandered consequence space and who will press on why dominance rather than some other decision rule, why separability, and whether averaging over frames is not simply expected utility with respect to a probability over frames, in which case the view collapses into an ordinary hierarchical Bayesian model. Finally there is a social epistemologist working on peer disagreement who thinks the whole permissivism debate has been conducted at a level of abstraction that gives no guidance in any actual case of disagreement. Nobody in the room works on vagueness or on the metaphysics of indeterminacy, which is where I think the most interesting applications lie, so I have to make that motivation land without a friendly specialist to help me.

  What I want is the following: the eight or so objections I will actually get from this specific room, ordered by the product of how likely they are and how much damage they would do if I handled them badly, each phrased the way that particular objector would phrase it and not in my vocabulary; for each, a reply I can deliver in about two minutes, since the chair runs a brisk fifteen-minute question period, together with an honest note on where the reply is soft or question-begging; an indication of which two objections I should concede in the first two minutes of the talk itself, before anyone raises them, in order to buy credibility for the rest; and a judgment about which single reply has to land for the paper to survive the hour, with the reason it is load-bearing rather than merely central. My own guess is that the load-bearing reply is the one explaining why the common refinement of two admissible frames is not automatically admissible, since if grain is free the ties in my main lemma disappear and I am back to uniqueness, but tell me if you think the real weight sits somewhere else. Please also mark which objections I should answer by conceding the point and shrinking the claim rather than by replying, and say what someone in that room who starts out hostile would count as a genuine win for me rather than a rhetorical escape. My advisor, who is an impermissivist and thinks the project is permissivism smuggled in through the back door, says the question period will turn entirely on whether the weightings over frames are themselves rationally constrained; include that as an objection and tell me how seriously to take her. Finally, include the question I am hoping nobody asks: I have a private worry that someone will connect the admissibility of frames to the classic problem of which predicates or partitions are projectible, since my apparatus seems to have no principled way of excluding a gerrymandered frame, and I would rather hear it now from you than for the first time from the floor.
reasoning: |-
  Okay, let me start by unpacking this user's request. They're a final-year PhD student preparing for a job talk on their dissertation chapter about frame-relative accuracy. The core idea is that accuracy is assessed relative to frames (partitions), and evidence determines a family of admissible frames. Permissiveness comes from averaging inaccuracy over these frames with certain weightings. 

  The user needs a Q&A prep sheet tailored to specific audience members. I need to anticipate objections from each attendee type, prioritize them, and craft responses. The chair is a uniqueness theorist, there are formal epistemologists skeptical about scoring rules, philosophers of science focused on modeling, a decision theorist critical of epistemic utility, and a social epistemologist concerned about practical applicability.

  First, I should identify the most damaging objections. The uniqueness theorist chair might argue this is just relabeling permissivism. The formal epistemologist might question why this isn't just credal sets. The decision theorist could challenge the dominance approach. The verisimilitude philosopher might reject accuracy as the right metric. 

  The user mentions their advisor's concern about weightings being rationally constrained - that's crucial. Also, their private worry about gerrymandered frames needs addressing. 

  For prioritization, objections that challenge the core novelty (frame as locus of permissiveness) or could collapse the framework (common refinement admissibility) are top. The weighting constraint issue from the advisor is likely high-priority too. 

  Responses should be concise (2 min max). For some, conceding and narrowing the claim is better than defending. For example, admitting the framework doesn't solve peer disagreement but offers structural insights. 

  The load-bearing reply is probably explaining why common refinements aren't automatically admissible - if that fails, uniqueness returns and the thesis collapses. The gerrymandered frames worry should be addressed preemptively as it's a vulnerability.

  I'll structure the output: ranked objections with exact phrasings, responses, soft spots, preemptive concessions, and the make-or-break reply. Highlighting where to concede and what counts as a "win" for hostile attendees is key. The user needs tactical presentation choices, not just philosophical counters.
answer: |-
  Here are the 8 most likely & damaging objections from your specific audience, prioritized by (likelihood * damage potential), phrased in their voices, with targeted replies, strategic concessions, and the critical load-bearing point identified:

  **Prioritized Objections & Replies:**

  1.  **The Chair (Formal Epistemologist / Uniqueness Theorist):**
      *   **Objection:** "This seems like a shell game. You've shifted permissiveness from credences *to frames and weightings*. But if the *evidence* uniquely constrains the family of admissible frames and the weighting (as rationality surely demands), haven't you just relocated uniqueness one level up? And if not, if frames/weightings are genuinely permissive choices *given the evidence*, how is this not just permissivism smuggled in via auxiliary assumptions?"
      *   **Reply:** "The key difference is structure and source. Uniqueness *fails* at the credence level *because* evidence constrains frames, not credences directly. Evidence *never* uniquely fixes a single finest frame – it supports distinctions *separately*. Admissible frames are *genuinely incomparable* evidence-respecting partitions; choosing one isn't irrational. The weighting *is* constrained (monotonicity, probability measure), but *not* unique. Crucially, this permissiveness *isn't arbitrary*; its *size* is *directly explained* and *quantified* by the evidence's discriminatory power via the admissible family's structure. It's permissivism *grounded in* the structure of evidence itself, not a brute fact."
      *   **Soft Spot:** Assumes evidence *must* uniquely constrain frames/weightings for rationality. My view denies this necessity for frames. Monotonicity is a substantive constraint on weighting, but its non-uniqueness remains.
      *   **Strategic Action:** **CONCEDE BEFORE TALK (2 min):** Explicitly state: "I am *not* arguing against the core uniqueness intuition that evidence constrains rationality. I argue it constrains rationality *by constraining the admissible frames and weightings*, and that *this constraint*, combined with the structure of evidence, *entails* bounded credal permissiveness *at the level of full beliefs over possibilities*. Uniqueness holds *relative to a frame*, but evidence doesn't mandate a unique frame." (This disarms the 'smuggling' charge upfront).

  2.  **Formal Epistemologist #2 (Imprecise Probabilities):**
      *   **Objection:** "Why is this not simply a complex re-description of a credal set? Your 'admissible family of frames under a weighting' generates a set of probability functions (the marginals over each frame, extended somehow). Averaging inaccuracy over this set with a weighting *is* just calculating expected inaccuracy for an imprecise credence state represented by that set. All your 'structured permissiveness' seems captured by standard imprecise probability models, but with added machinery for frames."
      *   **Reply:** "Three crucial differences: (1) **Ontology:** I maintain precise, global credences. The agent *has* a single P. Permissiveness arises because *accuracy assessment* is frame-relative, not because the agent is imprecise. (2) **Source of Bounds:** The bounds on permissiveness derive *directly and solely* from the evidence-constrained admissible frames and the scoring rule structure. It's not a primitive set. (3) **Conditionalization:** My framework *naturally vindicates standard Bayesian conditionalization* on the global P using the *same* scoring rule justification as precise probabilism (via the lemma), without needing new update rules for sets. Imprecise models struggle here. The 'machinery' is essential for *why* permissiveness arises and *how* it's structured by evidence."
      *   **Soft Spot:** Explaining how the *global* P is updated while assessment is frame-relative requires care. The connection between frame marginals and the global P needs to be robust.
      *   **Damage Control:** A win is convincing them this offers a *distinct mechanism and justification* for bounded permissiveness that integrates seamlessly with standard Bayesian norms, avoiding known pitfalls of imprecise models (like dilation, update rules).

  3.  **Decision Theorist:**
      *   **Objection:** "You're averaging inaccuracy over frames using a probability weighting. This *is* expected utility maximization where the 'state space' is the family of frames, the 'act' is the credence function, and 'utility' is negative frame-relative inaccuracy. So this collapses into a standard hierarchical Bayesian model: you have a prior over frames (your weighting) and compute expected inaccuracy. Why dress this up as a new 'frame-relative accuracy' theory? It's just decision theory under meta-uncertainty about the right partition."
      *   **Reply:** "The hierarchy is *epistemically constrained*, not a free prior. (1) The *family* of frames is *fixed* by evidence (admissibility), it's not a space of hypotheses I have beliefs about. (2) The weighting is *not* a subjective prior over frames; it's a *scoring rule component* constrained by evidence (monotonicity) and the structure of the family. It's part of *how we measure accuracy given the evidence*, not a belief state *about* frames. (3) Dominance arguments *within* a frame are justified by the strict propriety of the score *at that frame*. The averaging *across* frames isn't maximizing expected utility *about the world*; it's defining total epistemic disutility *as* this average, justified by the evidence constraining the admissible ways to assess accuracy."
      *   **Soft Spot:** Distinguishing the constrained weighting from a subjective prior is subtle. Have I just shifted the subjective element upwards? The reply insists evidence constrains it more directly.
      *   **Strategic Action:** Be ready to clarify the *normative status* of the weighting: it's a parameter of the epistemic scoring context set by evidence, not a belief.

  4.  **Philosopher of Science #2 (Model Selection / Coarse-Graining):**
      *   **Objection:** "This sounds very similar to choices in multi-scale modeling: picking a 'level of description' or 'coarse-graining'. How is your 'frame' meaningfully different from choosing a scale? And what does your apparatus *tell* someone choosing between, say, a molecular model and a continuum fluid model for the same phenomenon? Does it favor one frame over another? If not, how is it useful for model selection where we *must* choose one model/frame to work with?"
      *   **Reply:** "You've hit on a key application! A 'frame' *is* analogous to a choice of scale or state variables in a model. The difference is *normative grounding*: my theory specifies *which frames are epistemically admissible given the evidence*. Evidence supporting distinctions about molecules *but not* about bulk flow might make both the molecular frame and a coarse-grained macrostate frame admissible, while ruling out a frame mixing arbitrary micro/macro distinctions. *My framework doesn't select a single 'best' frame.* It says: *Given the evidence*, accuracy assessments relative to *these specific frames* (molecular, macrostate) are legitimate, and credences that agree on *all* these admissible marginals are tied. For model *choice*, it explains why different, incomparable models can be rationally permissible *simultaneously* for the *same* agent/evidence, and that the choice might involve *pragmatic* factors (computational cost, desired predictions) *beyond* pure accuracy considerations constrained by evidence."
      *   **Soft Spot:** Doesn't solve the model selection problem; it rationalizes permissiveness in model choice driven by evidence structure. Needs clear examples.
      *   **Win Condition:** They see this provides a principled *epistemic* justification for multi-model/multi-scale approaches and permissiveness in model choice *based on evidence content*.

  5.  **Philosopher of Science #1 (Verisimilitude / Idealization):**
      *   **Objection:** "Accuracy-first? But we constantly use deliberately *inaccurate* models because they're *informative* or *explanatory*. Newtonian mechanics is inaccurate but vastly more informative/useful for many tasks than a chaotic, perfectly accurate quantum description. If your 'accuracy' is always frame-relative, can it capture why we value these false but fruitful idealized models? Or does it just condemn them as inaccurate relative to the finest admissible frame?"
      *   **Reply:** "Great point! My framework *can* accommodate this. An idealized model often corresponds to adopting a *specific coarse frame* (e.g., neglecting quantum fluctuations, treating space as Euclidean). If the evidence *supports* the distinctions relevant *for the domain/purpose* (e.g., planetary orbits) and *doesn't* support needing finer distinctions (quantum gravity effects), then that coarse frame *is admissible*. The idealized model, seen as encoding precise credences *within that admissible coarse frame*, can be highly accurate *relative to that frame*. Its 'inaccuracy' relative to a finer frame is irrelevant *if that finer frame isn't mandated by the evidence for the task*. Fruitfulness often stems from matching an admissible frame well and being computationally tractable *within* it."
      *   **Soft Spot:** Needs to connect "fruitfulness"/"explanatory power" more tightly to accuracy-within-an-admissible-frame. Might feel like stretching 'accuracy'.
      *   **Win Condition:** They see frame-relativity makes accuracy-first more flexible and potentially able to rationalize the epistemic value of idealization *without* abandoning accuracy as the core epistemic good.

  6.  **Formal Epistemologist #1 (Scoring Rule Relativity):**
      *   **Objection:** "Your entire 'main lemma' and the permissiveness it generates depend crucially on using Brier score / squared distance. If I use a different strictly proper rule, like Log score, the ties disappear even for coarse frames! So isn't the permissiveness you identify just an artifact of your arbitrary choice of scoring rule? How can this be a deep fact about evidence and permissiveness if it vanishes when I change my epistemic utility function?"
      *   **Reply:** "The *structure* of the result – that agreement on marginals implies a tie, disagreement implies a difference – holds for *any* strictly proper scoring rule applied *within* a frame. However, the *size* of the equivalence class *is* scoring-rule dependent. Crucially, **the core phenomenon – that evidence supporting only coarse distinctions leads to wider equivalence classes (ties) under *any* reasonable scoring rule – remains.** Using Log score on a coarse binary frame still permits a range of credences in the proposition (just a different range than Brier). The *existence* and *evidence-driven variation in the size* of permissiveness is robust; the exact boundaries depend on the rule. The scoring rule choice is a separate, important debate, but my framework shows how *any* choice interacts with evidence structure to generate permissiveness."
      *   **Soft Spot:** Concedes scoring rule dependence for exact boundaries. Must argue the *qualitative* phenomenon (coarse evidence -> wider ties) is rule-robust.
      *   **Strategic Action:** **CONCEDE BEFORE TALK (2 min):** Early on, state: "My results assume a strictly proper scoring rule like Brier score. The *quantitative* scope of permissiveness depends on this choice, but the *qualitative* link – that weaker evidence, constraining us to coarser admissible frames, entails *wider* rationally permissible credal sets *under any such rule* – is the core claim." (Preempts the "arbitrary scoring rule" objection).

  7.  **Social Epistemologist (Peer Disagreement):**
      *   **Objection:** "This is elegant formalism, but how does it help in a real peer disagreement? Suppose Alice and Bob share all evidence, but Alice adopts frame F1, Bob adopts F2 (both admissible), leading to different credences on some question. According to you, both are rational. But what *should they do*? Should Alice weight Bob's frame? Should they average? Should they just say 'whatever' and stick to their frames? Your 'structured permissiveness' gives no practical guidance when peers actually disagree because they've latched onto different frames."
      *   **Reply:** "You're right that my framework doesn't provide a *resolution procedure* for peer disagreement. Its value is diagnostic and explanatory: (1) It *explains why* such disagreements can persist *despite* shared evidence and rationality – they stem from legitimate, evidence-respecting choices of *how to conceptualize* the problem (frame choice). (2) It shows that *forcing* agreement on a single frame (e.g., the finest common refinement) may be *epistemically unwarranted* if that frame isn't admissible given the evidence. (3) It highlights that the *source* of disagreement might be frame choice, not credence assignment *within* a frame. Recognizing this might lead peers to focus discussion on whether the evidence truly *mandates* a finer frame or supports the distinctions in the other's frame, rather than just arguing about numbers. It refocuses the debate on the structure of evidence and admissible conceptualizations."
      *   **Soft Spot:** Doesn't solve the practical problem. May feel unsatisfying.
      *   **Win Condition:** They accept this provides a *better explanation* for intractable peer disagreements rooted in legitimate conceptual choices, shifting the debate's focus usefully.

  8.  **Your Advisor's Objection (Weighting Constraints):**
      *   **Objection:** "The entire permissiveness hinges on the lack of unique constraints on the *weighting* over admissible frames. You impose monotonicity and it being a probability measure, but that's minimal. Rationality *must* impose more. Evidence doesn't just constrain the family; it also *bears on how important* different distinctions/frames are. If rationality doesn't uniquely constrain the weighting, you've just reintroduced massive permissiveness through the backdoor via this arbitrary weighting choice. What principle, beyond monotonicity, should constrain it? Symmetry? Fit to some meta-evidence?"
      *   **Reply:** "This is a deep challenge. My claim is that *for the purpose of defining total epistemic inaccuracy*, the evidence constrains the *family* but often underdetermines the *weighting*. Monotonicity is a strong, evidence-driven constraint: finer frames shouldn't get *more* weight if evidence doesn't support their extra distinctions. Further constraints *might* exist, but I argue they are often pragmatic or context-dependent, not purely epistemic. For example, if an experiment specifically tests color *independently* of size, that might justify higher weight on the color frame. But crucially, **the *existence* and *size* of credal permissiveness is driven primarily by the *structure* and *grain* of the admissible family itself.** Different weightings (respecting monotonicity) will *shift* which credences are optimal or tied, but they all preserve the core feature: wide equivalence classes under coarse evidence, narrowing as evidence refines the admissible frames. The weighting adds a *layer* of permissiveness, but its *impact* is bounded and structured by the evidence-constrained family."
      *   **Soft Spot:** Admits potential for an additional layer of underdetermination. Relies on the weighting's impact being secondary to the family structure for the core permissiveness claim. Needs examples where weighting ambiguity is minimal compared to frame-structure ambiguity.
      *   **How Seriously?** **VERY.** Your advisor will press this hard. It's core to the "smuggling" charge. Your reply must emphasize that (a) monotonicity is non-trivial & evidence-responsive, (b) the family structure is the *primary* driver, (c) other constraints *might* exist but aren't always decisive, and (d) *even with a unique weighting*, permissiveness arises from the family structure itself.

  **The Question You Hope Nobody Asks (Gerrymandered Frames):**
  *   **Objection:** "Your 'admissible frame' seems vulnerable to the grue problem. What stops a 'gerrymandered frame' that respects distinctions the evidence supports (e.g., 'green before 2050', 'non-green before 2050') but draws bizarre, unsupported distinctions *within* those categories? Your definition ("respects every distinction the evidence supports and draws no distinction the evidence gives no support for") seems too weak. 'Respects' likely means the frame's algebra must *contain* the supported distinctions, but it could add many unsupported ones. How do you rule out trivializing frames or ensure frames correspond to 'natural' or 'projectible' properties?"
  *   **Reply:** "Devastating point, and I'm working on it. The current definition needs refinement. The key is that 'draws no distinction the evidence gives no support for' must be interpreted strongly: a frame is inadmissible if it *makes any distinction* not licensed by the evidence. Gerrymandered frames *do* make distinctions not supported by evidence (e.g., the 'before 2050' cut-off for color is arbitrary and unsupported). Admissibility requires that the frame's cells correspond *only* to the maximally specific possibilities distinguished *by the evidence*. It's not just containing supported propositions; it's being the *coarsest partition that still captures all evidence-supported distinctions*. Gerrymandered frames are *finer* than this evidential limit. My 'monotonicity' constraint on weighting (finer frames get less weight) helps mitigate, but I need a principled way to define 'evidence-supported distinction' to exclude grue-like cases, leaning on projectibility or naturalness. This is a major open challenge."
  *   **Damage Control:** This is a major vulnerability. Preempt by emphasizing frames represent "live distinctions supported by evidence" and hope it doesn't come up. If it does, acknowledge the challenge honestly and outline the direction for a solution (stronger "no unsupported distinctions" + projectibility).

  **The Load-Bearing Reply:**
  *   **Which One?** **Why the common refinement of two admissible frames is not automatically admissible.**
  *   **Why?** If the common refinement *were* automatically admissible, then the agent would *always* be rationally required to adopt the finest evidence-supported distinction. This would collapse your framework back into uniqueness *at the finest level*, destroying the core thesis of structured permissiveness via incomparable frames. Your entire "locus of permissiveness is the frame" and "uniqueness holds *relative to a frame*" claims hinge on evidence supporting distinctions A and B *without* necessarily supporting A&B (or their correlation). If evidence supports "color" and "shape" independently (e.g., separate tests), the color frame and shape frame are admissible, but the color*shape frame draws distinctions (specific color-shape combos) *not* directly supported by the evidence. Its admissibility isn't automatic; it requires evidence *specifically about the correlation*. If the common refinement were forced, your admissible family would always have a unique finest element, and the lemma's equivalence classes would shrink to uniqueness under sufficient evidence refinement, not just narrow.
  *   **Your Reply Must:** Clearly articulate an example (like color and shape) where evidence supports each distinction *in isolation* but provides *no information* about their joint distribution or correlation. Emphasize that adopting the common refinement *requires making commitments unsupported by evidence*, violating the admissibility condition ("draws no distinction... no support for"). Stress this is the *key mechanism* allowing genuinely incomparable frames and preventing uniqueness from creeping back in.

  **Summary of Strategic Actions:**
  1.  **Preemptively Concede (First 2 mins):**
      *   To Uniqueness Theorist: Frame-relativity explains credal permissiveness *as a consequence* of evidence constraints on conceptualization, upholding uniqueness *relative to a frame*.
      *   To Scoring Rule Skeptic: Quantitative permissiveness depends on the scoring rule; qualitative link (coarse evidence -> wider ties) is rule-robust.
  2.  **Focus Energy on Load-Bearing Reply:** The inadmissibility of automatic common refinements (Color/Shape example). If this fails, the thesis collapses.
  3.  **Concede to Shrink Claim (If Pressed):**
      *   **For Social Epistemologist:** Concede the framework doesn't resolve peer disagreements, only explains their persistence rationally.
      *   **For Gerrymandered Frames:** Concede the precise exclusion mechanism needs more work (projectibility/naturalness).
  4.  **Key Win Conditions:**
      *   **Hostile Uniqueness Theorist/Advisor:** Accepts that frame-choice permissiveness is *structurally distinct* from credal permissiveness, is *evidence-driven*, and provides a *novel explanation* for bounded disagreement *even if* they still think rationality ultimately demands uniqueness somewhere.
      *   **General:** The room leaves believing you've identified a *genuinely novel mechanism* (evidence -> admissible frames -> accuracy assessment -> credal permissiveness) that *integrates* with core accuracy-first norms (probabilism, conditionalization) while offering a *principled*, *evidence-sensitive* account of the *size* of rational permissiveness, with clear applications (modeling, idealization).

  Good luck! Your preparation is impressive. Focus on clarity on the load-bearing point and the core novelty.
