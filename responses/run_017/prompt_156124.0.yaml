prompt: |-
  Hey — I'm TAing an intro metaphysics course and I've got the dispositions tutorial next week, one fifty-minute group, first-years who've done counterfactuals (world-similarity, antecedent strengthening, that sort of thing) but nothing on dispositions beyond the slogan that 'fragile' just means 'would break if struck'. I was talking with the other TA and we couldnt agree on how to run it: she wants to open with the counterexamples, I want them to feel the pull of the simple conditional analysis first. What I actually want them to leave with is the sense that the two ways it fails are *seperate* failures — the fink case, where the stimulus itself destroys or removes the disposition, versus the mask case, where the disposition is still there but something blocks the manifestation — and not just two versions of 'the thing didn't break'. So don't write me the explanation; plan how I should run the session.

  The bit I'm least sure about is order: what has to be on the board before the first counterexample lands, whether fink or mask should come first and why, how long to sit with the plain case so the counterexample actually bites, and where the repair attempts belong relative to the two cases — the 'in normal conditions' / ceteris paribus clause, and the move of identifying the disposition with its intrinsic causal basis instead of a counterfactual. Also the example: my instinct is one object in three variants (wine glass: bare / rigged / padded), but I'm worried they'll just learn three labels and never see the structure, so tell me what the carrying example needs and doesn't need and whether a minimal-pair version beats the sci-fi version — they groan at guardian angels and hidden wiring. I was going to try an electrical fuse as a real-world fink, then realised a fuse does conduct for a split second before it melts, which seems to make it useless as a counterexample unless I build the duration into the response. Is that the right way to rescue it, or should I drop it?

  Misconceptions I'm expecting, which I want defused at the point in the sequence where they actually arise rather than in a list at the end: that fink and mask are the same failure; that if the manifestation is blocked the thing was never really fragile; that finks are gerrymandered and couldn't happen in nature; and that 'in normal conditions' fixes everything. Two curveballs I want handled rather than dodged, and I want to know where in the session each fits: (1) my coin-flip fink — a glass wired so that when struck there's a 70% chance a mechanism hardens it, so it usually doesn't break: is this a fink, a mask, or something else, and does it push us toward a probabilistic conditional analysis? (2) a glass that is both padded (mask) and, unknown to anyone, chemically toughened by the padding process ten minutes earlier (fink): which label applies, and is that a real problem or just a boring case of both? Finally, give me one question to put at the end that tells me whether they've got the distinction or just memorised the words — it should be a case they haven't seen — and tell me explicitly what I should refuse to get drawn into at this level (I'd guess dispositional essentialism and the realism-about-powers debate, but tell me what you'd cut).
reasoning: |-
  Okay, let's tackle this step by step. The user is a TA preparing a dispositions tutorial for first-year metaphysics students. They've covered counterfactuals but not dispositions beyond the basic conditional analysis. The main goal is to ensure students grasp that finkish and masking cases represent distinct failures of the simple conditional analysis (SCA), not just variations of "the thing didn't break." 

  First, I need to consider the session structure. The user is debating whether to start with counterexamples or build up to them. Since the key objective is highlighting two separate failure modes, the session must clearly differentiate them. Starting with the plain case helps establish the initial intuition for SCA. Then introducing finks first makes sense because they directly attack the conditional by altering the disposition itself upon stimulus. Following with masks shows a different issue—the disposition remains but is obstructed. This progression should prevent conflating the two.

  The user is unsure about examples. Using one object (like a wine glass) in three variants (bare, rigged, padded) maintains focus but risks students memorizing labels without understanding the underlying structure. To counter this, the session should explicitly map each scenario to the abstract structure: disposition presence vs. stimulus effect vs. manifestation blockage. A carrying example might feel less contrived than sci-fi elements, but a wine glass is more intuitive for fragility. Electrical fuses as real-world finks are problematic due to the brief conduction before melting. Adjusting the response duration could work, but it might complicate things. Better to stick with the wine glass variants for clarity, then mention the fuse as a supplementary example if needed.

  Anticipated misconceptions: Students might confuse fink and mask as the same failure. Addressing this requires contrasting the mechanisms during the examples—emphasize that finks remove the disposition, while masks leave it intact but blocked. Another misconception is that blocked manifestation means the object wasn't truly fragile. Here, stress that masking preserves the disposition, using the padded glass to illustrate. For finks seeming unnatural, the coin-flip fink later in the session can show probabilistic cases. The "normal conditions" clause as a fix-all is tricky; revealing its limitations through counterexamples will show it's insufficient.

  The curveballs: The coin-flip fink (70% hardening mechanism) introduces probability. It's more of a fink since the disposition is altered stochastically. This could lead into probabilistic analyses but should be flagged as an advanced topic. The combined case (padded and toughened) is both mask and fink. Pointing out it's a compound case helps distinguish the mechanisms without conflating them.

  For the assessment question, a new case like "sugar that dissolves when stirred, but turns hydrophobic when exposed to air during stirring" tests their grasp. The finkish element (air exposure removes solubility) versus a mask (if something coated it) would check if they identify the removal of disposition versus blockage.

  Areas to avoid: Dispositional essentialism and realism debates are beyond scope. Focus stays on the conditional analysis and its failures. Also, sidestep discussions on probabilistic analyses or multi-track dispositions unless briefly noted as further topics.

  Overall, the session flow should be: SCA setup → fink case → mask case → repair attempts → curveballs → assessment. Each segment reinforces the distinction between disposition removal (fink) and manifestation blockage (mask), using clear examples and addressing misconceptions as they arise.
answer: |-
  Here’s a battle-tested 50-minute plan focused on **contrasting finkishness and masking** while scaffolding intuition-building. Order is critical to avoid conflation:

  ---

  ### **Session Structure (50m)**
  **1. Setup & Simple Conditional Analysis (SCA) Reinforcement (10m)**  
  - *Do:* Start with the slogan: "Fragile = would break if struck."  
  - *Board:* **SCA: D is disposed to M when S iff: if S were to happen, M would happen.**  
  - *Activity:* Ask groups: "Give 3 real examples (e.g., elastic, flammable). Write the SCA for each." *Why?* Forces ownership of SCA.  
  - *Emphasize:* SCA feels intuitive! We *use* it daily. But is it *sufficient*?  

  **2. Finkish Case FIRST (15m)**  
  - *Example:* **"Rigged Glass"**  
    > *"This glass is fragile. But it’s secretly wired to a sensor. If struck, the sensor instantly coats it in unbreakable resin BEFORE impact."*  
  - *Key Q:* "If struck, would it break? (No) Is it fragile? (Yes!)"  
  - *Board:* **FINK: Disposition is *removed/blocked* BY the stimulus itself.**  
  - *Why first?* Finks directly falsify the conditional (stimulus *prevents* M by killing D). Cleaner initial violation.  
  - *Real-world rescue:* **Fuse example WORKS if reframed:**  
    > "A 'conductive' fuse wired to vaporize itself *instantly* when current flows. Does it conduct? (SCA says yes, but it doesn’t)."  
    *(Drop duration—say "instantly" and move on.)*  

  **3. Masking Case NEXT (10m)**  
  - *Example:* **"Padded Glass"**  
    > *"Same fragile glass, but packed in foam. If struck, the foam absorbs the impact. Remove the foam? It breaks easily."*  
  - *Key Q:* "If struck *now*, would it break? (No) Is it fragile? (Yes!)"  
  - *Board:* **MASK: Disposition is *present* but something *interferes* with manifestation.**  
  - *Contrast IMMEDIATELY:*  
    - Fink: Stimulus *destroys* D.  
    - Mask: Stimulus *happens*, D is *there*, but M is *blocked*.  

  **4. Repair Attempts & Failures (10m)**  
  - *"Normal Conditions" Clause:* "Add 'in normal conditions' to SCA? Does 'normal' exclude padding? What about *invisible* masks? Circular?"  
  - *"Causal Basis" Move:* "Maybe fragility *is* the molecular structure, not the counterfactual. But can structure change *as* it’s struck? (Finks!)"  
  - *Board:* **Problem: Finks kill 'normal conditions', Masks kill 'causal basis'.**  

  **5. Curveballs & Synthesis (5m)**  
    - **Coin-Flip Fink:** "Glass hardens *only if* a 70% coin-flip lands heads. Fragile? SCA false?"  
      → *It’s a probabilistic fink* (stimulus *may* remove D). Pushes toward probabilistic analysis (mention briefly, don’t dive).  
    - **Combo Case:** "Padding chemically toughens glass *before* impact. Mask AND fink? Yes! Two distinct mechanisms."  
      → *Not a problem*—shows cases can coexist but are *separate*.  

  **6. Assessment Question (Exit Ticket) (1m)**  
  - *"A sugar cube dissolves in water. But if you stir it, a hidden chemical *released by stirring* makes it insoluble. Fink, mask, or neither? Why?"*  
    > **Answer:** Fink (stirring removes solubility). *Avoids memorization—tests mechanism ID.*  

  ---

  ### **Key Pedagogy Choices**  
  - **Example Strategy:** Stick with **one object (glass)**. Use variants to spotlight *structural differences*:  
    - *Bare glass:* SCA holds.  
    - *Rigged (fink):* Stimulus → *loses* fragility.  
    - *Padded (mask):* Stimulus → fragility *present but blocked*.  
    **Carrying example?** Riskier. "Weightlifter disposed to drop weights if shouted at, but..." (mask = earplugs; fink = shout triggers hypnotic steadiness). *Glass is clearer for first exposure.*  

  - **Misconception Takedowns:**  
    - *"Fink/mask same?"* → Hammer the stimulus’s role: **Does S *remove* D (fink) or is D *present but foiled* (mask)?**  
    - *"Blocked M = not fragile"?* → Use mask: "Is glass *intrinsically* different when padded? No!"  
    - *"Finks unnatural"?* → Fuse/coin-flip show real-world-ish cases.  
    - *"'Normal conditions' fixes all"?* → Ask: "Is padding 'abnormal'? What if *all* glasses were padded?"  

  - **What to Cut:**  
    - **NO** dispositional essentialism.  
    - **NO** realism debates.  
    - **NO** multi-track dispositions.  
    - **DON’T** solve the problems—leave them wanting more. Say: *"Philosophers debate fixes—we’ve shown why it’s hard!"*  

  ---

  ### **Why This Works**  
  - **SCA intuition → Fink (clean kill) → Mask (contrast) → Failed repairs** builds *why* they’re distinct failures.  
  - One object prevents "label memorization" by forcing focus on *mechanisms*.  
  - Curveballs validate understanding: combo cases = harmless, probabilistic = previews future topics.  
  - Exit question tests transfer, not recall.  

  **Time Buffer:** If behind, skip "repair attempts" depth. If ahead, probe coin-flip implications. You’ve got this! 💪
