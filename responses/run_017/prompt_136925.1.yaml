prompt: |-
  our lab is building what the funder insists on calling a "consciousness meter" — a bedside box that eats neural data and gives back a number. It's supposed to do three jobs and I've started to suspect they aren't the same job: (1) track anaesthesia depth minute by minute in the OR, (2) for one unresponsive ICU patient at a time, say whether there is anyone home at all, knowing that feeds into a decision about continuing organ support, and (3) our funder also wants it to say something about a large AI system running on a GPU cluster, which I'd of thought was where this whole thing goes off the rails.

  Before we pick a theory to build on I want the spec, not the theory. Write me the desiderata: what a theory of consciousness has to deliver for it to be fit to underwrite that box, with the case, state, dissociation or empirical result behind each one, and mark which are non-negotiable and which are just preferences of a particular camp. Commit to positions and overrule me where I'm wrong — I don't want a menu of options I have to adjudicate myself.

  Argue with me about these in particular:

  - Is "the quantity has to be computable from data you can actually collect in an ICU, in under an hour, on a parcellation two engineers would disagree about" a genuine desideratum, or philistine engineering pressure that shouldn't be allowed near a metaphysical question? Integrated-information-style measures blow up combinatorially, and I've been told the newer versions made that worse.
  - "Must not rank a big regular lattice of simple units above a human cortex." I keep hearing this objection and I genuinely can't tell whether it's a real problem for the theory or just people disliking where the theory is going.
  - Can anything count as calibrating the meter, given that in exactly the cases we care about — non-reporters, infants, maybe the AI system — there is no ground truth? Is "comes with a validation strategy for the no-ground-truth cases" one desideratum or a confusion dressed up as one?
  - The distinctions I don't want collapsed: creature vs state, level vs content, wakefulness vs awareness, having any vs how much, and the boundary question (why isn't the whole ward one subject).
  - Results it can't contradict: the cerebellum has several times more neurons than the cortex and people lose large parts of it without obvious loss of consciousness; anaesthesia and slow-wave sleep knock out awareness while plenty of cortex stays active; dreaming in REM; split-brain.

  Then, the two things I most want: which single desideratum excludes the largest number of the popular theories, and whether some subset of your own list can't be jointly satisfied — say, "derived from the intrinsic character of experience" plus "tractable at the bedside" plus "picks out a unique boundary." If they can't all hold, say definitely which one you'd drop and why, not "it depends." Skip the full scorecard across IIT, global workspace and higher-order theories; I can do that, and just note in a clause where a desideratum kills a whole family.

  End with one line: \answer{the desideratum doing the most exclusionary work: ___}
reasoning: |-
  Okay, the user is building a "consciousness meter" for a lab, funded to handle three distinct tasks: monitoring anesthesia depth in surgery, assessing unresponsive ICU patients for any consciousness presence, and evaluating large AI systems. The user suspects these tasks aren't the same and wants desiderata (requirements) for a consciousness theory that can underpin this device. They need clear specifications, not theories, with cases or empirical results backing each desideratum. They also want to know which are non-negotiable and which are preferences of certain camps. The user wants me to commit to positions and overrule them if necessary, avoiding a menu of options they have to judge themselves.

  The user raises several specific arguments to engage with:

  1. **Computability in ICU**: They question whether requiring the quantity to be computable from ICU data within an hour, despite disagreements in brain parcellation, is a legitimate requirement or just engineering pressure that shouldn't influence metaphysical questions. They mention Integrated Information Theory (IIT) faces combinatorial issues.

  2. **Simple Lattice vs Human Cortex**: They wonder if objections to theories ranking a big lattice of simple units above human cortex are substantive or just dislike for the theory.

  3. **Calibration Without Ground Truth**: How can the meter be calibrated for non-reporters like unresponsive patients or AI systems where there is no ground truth? Is requiring a validation strategy for such cases a valid desideratum or confusion?

  4. **Distinctions to Preserve**: Creature vs state, level vs content, wakefulness vs awareness, having any vs how much, and why the whole ward isn't one subject.

  5. **Results It Can't Contradict**: Cerebellum's role, anesthesia/sleep effects, dreaming in REM, split-brain phenomena.

  They want two key outputs: which single desideratum excludes the most popular theories, and whether any subset of desiderata can't be jointly satisfied. If not, which one to drop and why decisively. They also want the answer in a specific format ending with "\answer{the desideratum doing the most exclusionary work: ___}".

  I need to define robust desiderata based on practical constraints and scientific realities. For the ICU computability point, it's a genuine requirement because without feasibility, the device is useless. IIT's combinatorial explosion makes it impractical for real-time use. For the lattice objection, it's a real problem indicating a theory's validity—if simple systems rank higher than humans, it fails.

  On calibration without ground truth, having a validation strategy is essential. We can use indirect methods like perturbation-based tests for non-reporters. Preserving distinctions like creature/state is non-negotiable for accurate application. The meter must handle state changes without confusing them with capacity.

  The listed empirical results are non-negotiable; any theory contradicting them is flawed. For example, cerebellum data shows neuron count isn't sufficient for consciousness, and anesthesia studies show cortex activity isn't necessary.

  The desideratum excluding the most theories is likely the "No False Positives in Silico/Simple Systems." It rules out IIT (due to grids), some panpsychist views, and potentially GWT if applied naively to AI.

  For conflicting desiderata, "Derived from Intrinsic Nature" and "Tractable at Bedside" clash with "Unique Boundary." I'd drop "Derived from Intrinsic Nature" because it's metaphysical and unverifiable, focusing instead on measurable functional properties.

  Finally, the answer will be: "\answer{the desideratum doing the most exclusionary work: No False Positives in Silico/Simple Systems}"
answer: |-
  Below is a specification of desiderata for a theory of consciousness to underpin a clinically viable "consciousness meter," based on the three use cases (anaesthesia tracking, unresponsive ICU assessment, and AI evaluation). Each desideratum is grounded in empirical cases, clinical realities, or conceptual necessities. Non-negotiables are marked **(\*)**, while preferences are noted as such. I commit to positions, overrule misconceptions, and address your specific arguments directly. The goal is a unified theory that avoids collapsing critical distinctions and respects established neuroscience.

  ---

  ### **Core Desiderata for the Theory**
  1. **Clinically Actionable Output (\*)**  
     - **What**: Must output a *single numerical value* interpretable as "level of consciousness" (0 to 100 or similar) for real-time decisions.  
     - **Why**: Required for anaesthesia titration (job 1) and ICU withdrawal decisions (job 2). In anaesthesia, BIS monitors already do this crudely (e.g., propofol-induced loss of consciousness at BIS <60). For ICU, a binary "anyone home?" threshold (e.g., >20 vs. <20) must be defensible.  
     - **Non-negotiable**: Without this, the box fails its primary purpose.  
     - **Overrule**: You can't avoid a "number" if funders demand it—but the theory must justify its scaling and thresholds.

  2. **Computable from Noisy, Sparse Data in <1 Hour (\*)**  
     - **What**: Must be calculable from EEG/fMRI/MEG data (available in ICU/OR) with coarse parcellation (e.g., AAL/Desikan-Killiany atlas), tolerating engineer disagreements.  
     - **Why**: ICU/OR settings have limited time, motion artifacts, and equipment variability (e.g., 8–32 channel EEG). Delayed results risk patient harm.  
     - **Non-negotiable**: Engineering constraints here are *not philistine*—they define feasibility. IIT’s combinatorial explosion (e.g., Φ max scales with system states) makes it ICU-unusable; newer versions (IIT 4.0) worsen this.  
     - **Empirical case**: Successful anaesthesia monitors (e.g., BIS, Narcotrend) use <20 EEG features; perturbational complexity index (PCI) requires TMS-EEG but still runs in minutes.  
     - **Overrules you**: This **is a genuine desideratum**. Metaphysics without practicality is irrelevant for a *bedside device*. If a theory can’t deliver this, reject it.

  3. **No False Positives in Silico/Simple Systems (\*)**  
     - **What**: Must **not** assign high consciousness to GPUs, grid lattices, or feedforward networks (e.g., ResNet-152).  
     - **Why**: Avoids absurdities (e.g., ranking a chessboard above a brain) and addresses job 3 (AI). Grids/lattices lack feedback, integration, and causal power—key to consciousness.  
     - **Non-negotiable**: A theory failing this is empirically falsified (e.g., cerebellum has 69B neurons but no consciousness role; grids have high "integration" but zero awareness).  
     - **Overrule**: This **is a real problem**, not just dislike. IIT 3.0 assigns high Φ to 5x5 grids; IIT 4.0 reduces but doesn’t eliminate this. Global Workspace Theory (GWT) avoids it by requiring global broadcast.

  4. **Validation Strategy for Non-Reporters (\*)**  
     - **What**: Must provide a method to calibrate/validate without verbal report (e.g., using perturbation, behavioral residue, or neural markers).  
     - **Why**: ICU patients, infants, and AI lack ground truth. Validation isn’t "confusion"—it’s operationalization. E.g., in DOC patients, command-following fMRI or EEG complexity correlates with recovery; in anaesthesia, dose-response curves anchor scales.  
     - **Non-negotiable**: Without this, the meter is guesswork.  
     - **Overrule**: **Calibration is possible**. Use perturbation (e.g., TMS-EEG for PCI) or hierarchical features (e.g., spectral entropy in EEG). For AI, use adversarial inputs to test for "surprise" or feedback loops.

  5. **Preserve Critical Distinctions (\*)**  
     - **What**: Must distinguish:  
       - *Creature (capacity) vs. State (current level)*: Anaesthesia abolishes state, not capacity.  
       - *Level (intensity) vs. Content (specifics)*: Slow-wave sleep has low level, REM has high level with bizarre content.  
       - *Wakefulness (arousal) vs. Awareness (content access)*: Vegetative state has wakefulness without awareness.  
       - *Presence (any) vs. Quantity (how much)*: Minimally conscious state has "any," coma has none.  
       - *Boundary (individual) vs. Environment*: Rejects "ward as one subject" by requiring intrinsic causal borders (e.g., metabolic/functional isolation).  
     - **Why**: Clinical decisions rely on these (e.g., differentiating vegetative vs. minimally conscious states).  
     - **Non-negotiable**: Collapsing these invalidates the meter (e.g., mistaking arousal for awareness risks misdiagnosis).

  6. **Respect Established Neuroscience (\*)**  
     - **What**: Must be consistent with:  
       - *Cerebellum irrelevance*: 69B neurons, but lesions don’t abolish consciousness (e.g., cerebellar agenesis cases).  
       - *Anaesthesia/slow-wave sleep*: Ketamine or propofol suppress frontoparietal networks while sparing sensory cortex; slow-wave sleep shows high amplitude EEG but no awareness.  
       - *REM dreaming*: Prefrontal cortex deactivated, but vivid experience persists.  
       - *Split-brain*: Each hemisphere supports separate consciousness (contra "global unity" absolutism).  
     - **Why**: These are non-debatable empirical results. Theories violating them (e.g., strict corticocentrism) fail.  
     - **Non-negotiable**: Contradiction here falsifies the theory.

  7. **Unique Boundary Definition (\*)**  
     - **What**: Must specify why a patient is one subject (not the ward) and how subsystems (e.g., disconnected hemispheres) split consciousness.  
     - **Why**: Split-brain cases show boundaries matter; ICU can’t have "group consciousness."  
     - **Non-negotiable**: Avoids metaphysical mess (e.g., panpsychism).

  8. **Theory Agnostic to Implementation (Preference)**  
     - **What**: Should not require specific biology (e.g., neurons) to allow AI/job 3 applicability.  
     - **Why**: Funder demands AI assessment. GWT and Recurrent Processing Theory (RPT) support this; IIT does not (requires causal power of neurons).  
     - **Preference**: Not essential for medical jobs, but pragmatic for funders.

  ---

  ### **Addressing Your Two Key Requests**
  #### 1. **Desideratum Excluding the Most Theories**  
     - **No False Positives in Silico/Simple Systems** excludes:  
       - IIT (all versions): Fails due to high Φ in grids/lattices and photodiodes.  
       - Panpsychist/neutral-monism theories: Assign consciousness to fundamental particles/simple systems.  
       - Naive versions of GWT: If applied to feedforward AI, could falsely label GPT-style models as "conscious" (lacking recurrent dynamics).  
     - **Impact**: This knocks out IIT (still dominant in engineering circles) and forces GWT/RPT to explicitly require recurrence or feedback.

  #### 2. **Conflict in Desiderata and Which to Drop**  
     - **Conflict**: *Derived from Intrinsic Nature of Experience* (e.g., IIT’s axioms) + *Tractable at Bedside* + *Unique Boundary*.  
       - Intrinsic nature (e.g., phenomenological axioms) demands unobservable properties (e.g., "cause-effect power"), making computation NP-hard (intractable).  
       - Tractable theories (e.g., PCI, spectral entropy) are extrinsic/functional, avoiding metaphysics.  
     - **Resolution**: Drop ***Derived from Intrinsic Nature of Experience***.  
       - **Why**: It’s untestable, uncomputable in practice, and unnecessary for the meter’s jobs. Empirical validation (desideratum 4) relies on *correlates* (e.g., complexity, broadcast fidelity), not metaphysics. Functional theories (GWT, RPT) suffice: they use reportable awareness as a proxy, then extend to non-reporters via perturbation or biomarkers.  
       - **Consequence**: IIT is abandoned, but the meter gains clinical viability.

  ---

  ### **Theories Killed by Specific Desiderata**  
  - **IIT**: Fails computability (desideratum 2; combinatorial), false positives (3; grids), and tractability (conflict above).  
  - **Strict Higher-Order Thought (HOT)**: Fails non-reporters (4; requires metacognition) and cerebellum (6; assigns consciousness to cortical "thoughts").  
  - **Global Neuronal Workspace (GWT)**: Survives if modified to avoid AI false positives (3) and preserve distinctions (5). Weak on unique boundaries (7).  
  - **Recurrent Processing Theory (RPT)**: Strong on distinctions (5) and neuroscience (6), but needs validation for non-reporters (4).  

  \answer{the desideratum doing the most exclusionary work: No False Positives in Silico/Simple Systems}
