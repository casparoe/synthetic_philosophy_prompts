  The professor's deeper frustration is with students just summarizing Malcolm and Dennett without genuine synthesis. Their brilliant insight is that "are dreams experiences?" might actually be two questions: 1) is there real-time consciousness during sleep? 2) are dream reports accurate records? The vignette should force students to see how the evidence pulls these apart.

  For the question design, I should:
  - Make the vignette airtight: specify exact success rates (e.g. 78% object incorporation), add the control condition where dreamers are awoken pre-signal
  - Frame the question to demand analysis of how each theorist must respond to each finding
  - Prevent the "stalemate" cop-out by requiring them to say who would need to move

  The model answer should take the provocative stance that both theorists are partially wrong - there is real-time consciousness but reports are reconstructions. This aligns with the professor's hint about "experience without accurate reporting". 

  For the marking scheme, five must-hit moves:
  1) Explaining Malcolm's no-experience view and his anti-sceptical argument 
  2) Explaining Dennett's cassette theory and why he rejects first-person authority
