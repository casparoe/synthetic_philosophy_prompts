  5) Synthesizing the two-question perspective (experience vs report accuracy)

  High 2:1 vs First differentiation: First-class answers will show original synthesis (e.g. applying postdiction to dreams), spot that the control condition undermines Malcolm's position, or question neural decoding's validity.

  Biggest pitfalls to address in the scheme:
  - Students might claim the findings support their preferred theorist without explaining why
  - They might miss that retroactive reconstruction helps Malcolm but hurts Dennett
  - They could overlook how real-time response challenges Malcolm's core thesis

  The vignette improvements:
  - Add percentages to "substantial majority" (78%)
  - Specify "well above chance" as 89% vs 17% baseline
  - Clarify the neural decoding only works in last 20-30s
