prompt: |-
  I teach a joint seminar on personal identity and philosophy of physics, and one of my students has been coming to office hours for three weeks with a quantum-immortality argument that I think proves far too much, but I cant put my finger on where it breaks. He's sharp, he pre-empts every objection I raise, and I have to write comments on his final draft by Friday. The chain, more or less as he now has it:

  (1) Everettian setup: every outcome with nonzero amplitude is realized somewhere in the branching structure, and conscious experience continues in a branch just in case there is a functioning, psychologically continuous successor of me there — so a branch in which the body dies hosts no experience of mine, and a branch in which it doesn't hosts one.
  (2) What I should expect is settled by the branches that host experiences of mine. The dead ones host nothing for me, so they contribute nothing to my expectation; and since there is always at least one live branch, "I have some experience or other" is not a real restriction. So conditional on my experiencing anything at all, I am in a live branch.
  (3) Now iterate. At each round, the branch in which the device fires hosts no experience of mine, so it drops out, and I should expect to experience surviving; by induction over rounds, I should expect to experience surviving any finite number of them.
  (4) I thought I had him on a scope mistake — "for each round there is a branch that survives it" doesn't give you "a branch that survives every round" — but he points out that the branching structure is an infinite, finitely branching tree, and König's lemma hands you an infinite path through it, so there really is a worldline on which I survive every round. I looked up the lemma and he's right.
  (5) I then raised the measure objection: the surviving cohort's share of total measure decays like (1/2)^n, so the branch I'm being told to expect is a measure-zero freak. He answers with what he calls the tapered machine — at round n, set the kill probability to 1/(4n²) rather than 1/2. Now the surviving cohort keeps ∏(1 − 1/(4n²)) of the measure, which converges to 2/π, a bit under two-thirds, and stays there forever. No bleed to zero.
  (6) So, he concludes, I should expect to experience surviving arbitrarily many rounds: immortal from the inside.

  The trouble is that this seems to buy me a lot more than immortality, and I cant tell which part of the machinery is printing the extra money. First: rewire the machine so it kills me unless a million fair quantum coins all land heads. Untapered, (2) and (3) still deliver certainty that I will experience the million-heads run, and tapering isn't available here without rigging the machine into harmlessness. So either (2) is doing the work, in which case I get to be certain of an absurd run, or the taper is doing the work, in which case the argument has collapsed into ordinary probability theory and a single-world theorist predicts exactly the same two-thirds, and nothing distinctively quantum has been shown. He won't say which it is. Second: wire the same trigger to a friend in the next room, and every branch containing a successor of me is a branch containing a successor of her, so I should expect her to survive every round too, which I have no independent reason to think and which doesn't come out symmetric once the devices are independent. Third: every cause of death I can think of bottoms out in quantum-level events, so the reasoning steps off the machine entirely — I should expect never to experience dying of anything, including old age, and should expect increasingly to find myself in the branch where everyone I know has died and I haven't — and it also seems to erase any self-interested reason to avoid a risk at all, since I survive either way from where I'm standing. Nobody who believes this acts as if that were true.

  So: which step do you reject, and what does rejecting it cost? I'd rather keep (1) than (2) if it comes to that — the physics doesn't care whether anyone is watching, and (2) is where all the philosophical work seems to be happening — but I want to know what I'm signing up for. Concretely: if the fix is to make first-person expectation track Born measure rather than track live branches, where does the measure get its authority over what I should expect (epistemic reading, decision-theoretic reading, something else), and what am I then supposed to say about the worldline from (4), the one that exists with probability 1 and carries measure zero and has a successor of me on it who never dies? Is "probability zero, but it's really there, and it's me" a coherent thing to think about my own future, or just a way of not saying anything? Price the other exits too: deny that survival survives branching at all and require uniqueness of the continuer, or else accept (6). If I require uniqueness, do ordinary first-person expectations under branching survive — do I still get to expect spin-up with probability |α|², or does that expectation collapse with this one? And tell me which of my three overreach cases is genuinely damning, if any is, and whether there's a reading of (2) that is true but too weak to get (3) off the ground. I'd rather not write "see me" in the margin a fourth time.
reasoning: |-
  Okay, let me try to unpack this quantum immortality argument step by step. The professor has a student making a case that in Everettian quantum mechanics, you should expect to experience immortality. The student's argument seems logically tight but leads to absurd consequences. 

  First, I need to understand the core of the student's reasoning. The key steps are:

  1. In Everett's many-worlds interpretation, every quantum possibility branches into reality. Consciousness follows the branches where you survive.
  2. When calculating expectations, you only consider branches where you're conscious. Dead branches don't count.
  3. Through infinite branching, there's always at least one branch where you survive any finite series of lethal events.
  4. Using König's lemma, there exists an infinite path where you survive forever.
  5. With a "tapered" probability (decreasing chance of death), the measure of survival paths remains significant.
  6. Therefore, you should expect to experience immortality.

  The professor sees three major problems: 
  - This would make you certain of extremely unlikely events (like a million coin flips all coming up heads)
  - It would apply equally to other people, making you expect their immortality too
  - It eliminates any self-interested reason to avoid danger

  The professor is considering rejecting step (2) - the idea that expectations are based only on branches where you exist. But they want to know what that would cost conceptually. 

  I think the fundamental issue is that step (2) conflates existence with expectation. Just because you exist in a branch doesn't mean you should expect that branch. The Born measure (quantum probability) still matters for what you should anticipate. 

  The student's "tapered machine" example is clever but misleading. When the survival probability converges to 2/π, that's just the Born measure calculation - nothing uniquely quantum is happening. A single-world theorist would get the same number. The distinctively quantum aspect gets lost when you ignore measure.

  As for the infinite path from König's lemma: yes, it exists mathematically, but its measure is zero. Saying "it's me" in that path isn't meaningful for expectation because probability zero events shouldn't be anticipated. 

  If we keep Everett but reject step (2), we preserve normal quantum probabilities. We can say spin-up has probability |α|², and avoid the immortality conclusion. The cost is accepting that some branches exist where you survive improbably, but you shouldn't expect to find yourself there.

  The million-coin-flip case clearly shows why step (2) fails. Requiring uniqueness of identity across branches might solve it but would break standard Everettian semantics. The friend asymmetry also highlights how the argument violates basic probability intuitions.

  The most damning overreach is probably the elimination of self-preservation incentives. If you truly believed this, you'd behave recklessly, which nobody does - suggesting the argument is flawed.
answer: |-
  Here's the breakdown—step (2) is the critical flaw, and rejecting it preserves Everettian quantum mechanics while avoiding absurdity. Let's diagnose the error, price the exits, and address your overreach cases.

  ### **Step-by-Step Diagnosis**
  1. **Reject Step (2): The "Experience-Conditional Expectation" Error**  
     The mistake is equating *subjective expectation* with *branch existence conditional on survival*. Step (2) claims: "What I should expect is settled by branches hosting my conscious experience." This ignores the **Born measure** (quantum probability). In Everett, all branches exist, but your *expectation* of which one you'll experience must weight branches by their measure. Without this:  
     - You lose the link between quantum statistics and prediction (e.g., why expect spin-up with probability |α|²?).  
     - It implies certainty in measure-zero events (e.g., surviving a million coin flips).  
     **Cost of rejecting (2):** You must ground first-person expectations in the Born measure. This is consistent with decision-theoretic approaches (e.g., Deutsch-Wallace) where rational agents maximize measure-weighted utility.  

  2. **The Status of the "Immortal" Path (Step 4)**  
     - **König's lemma** guarantees an infinite path exists, but its **Born measure is zero** (even in the tapered case, the immortal path has measure zero).  
     - **Coherence check:** "Probability zero, but it's really there, and it's me" is *mathematically coherent but predictively irrelevant*. You should assign **zero credence** to experiencing it. Analogously: in a continuum lottery, you exist in *some* outcome, but you shouldn't *expect* to win.  

  3. **Tapering (Step 5) Doesn't Save the Argument**  
     - The tapered machine converges to a finite measure (2/π) for the *set* of paths surviving all finite rounds, but:  
       - This is **ordinary probability theory**: a single-world frequentist predicts the same survival probability.  
       - The "quantum" part evaporates—it doesn't support immortality, just high survival odds.  
     - **Key point:** Tapering only helps if you accept Born measure. Without it, you still get certainty from (2)+(3).  

  4. **Must We Reject Branching Identity?**  
     - **No.** You can keep Everettian branching without requiring uniqueness.  
     - **Ordinary expectations survive:** You still expect spin-up with probability |α|², because your expectation weights branches by measure. The error is specific to (2), not branching per se.  

  ---

  ### **Your Overreach Cases: Which is Damning?**
  All three highlight the flaw, but **Case 1 (million coins)** is the most decisive:  
  - **Untapered:** Step (2) forces certainty of a measure-zero event (all heads). This is absurd and violates quantum statistics.  
  - **Tapered unavailable:** Rigging the machine to make survival likely concedes that measure matters, undermining (2).  
  - **Conclusion:** Case 1 proves step (2) is incoherent.  

  **Case 2 (friend in the next room):**  
  - Symmetry breaks because *your* survival doesn't imply *hers* if devices are independent. The argument only "works" for her if you fallaciously apply your first-person perspective to her. Reveals the solipsism in (2).  

  **Case 3 (real-world causes of death):**  
  - Shows the argument's practical incoherence: if you *believed* it, you'd act recklessly. But no one does, because we instinctively use measure-weighted expectations.  

  ---

  ### **How to Fix the Machinery**
  - **Replace (2) with:** "What I should expect is settled by the **Born measure** over branches hosting my conscious experience."  
    - **Epistemic authority:** Born measure is confirmed by quantum experiments (statistics over identical trials).  
    - **Decision-theoretic authority:** In branching worlds, rational agents maximize measure-weighted utility (per Wallace/Everettian decision theory).  
  - **Revise (3):** At each round, you should expect survival *with probability* (1 − kill probability), not certainty. Induction fails because measure decays.  

  ---

  ### **Marginal Comments for the Student**
  > *"Step (2) is the error. Existence of a branch ≠ rational expectation. Born measure must weight first-person perspectives. König's lemma gives an immortal path, but its measure is zero—you shouldn't expect to experience it. Tapering only 'works' by sneaking measure back in, collapsing to ordinary probability. Overreach cases confirm: (1) You can't be certain of measure-zero events (million heads). (2) Your friend's survival isn't entailed by yours. (3) We avoid risks because measure-weighted survival odds matter. Revise by grounding expectation in Born measure."*

  ---

  ### **Why This Works**
  - **Preserves (1):** Everettian physics stands.  
  - **Saves quantum probabilities:** Expect spin-up with |α|².  
  - **Avoids immortality:** You expect death in high-measure branches.  
  - **No overreach:** Million-heads is improbable; friends die independently; risks remain worth avoiding.  

  By rejecting (2), you keep the metaphysics intact but constrain epistemology to Born measure. The "freak" immortal path exists but is irrelevant—like a lottery loser in a multiverse where someone wins. Nothing prints extra money.
