prompt: |-
  I'm writing something on how moral norms actually collapse — slavery, duelling, that sort of case — and I keep getting the three usual stories thrown at me as if they were rivals you just pick between: the arguments did it, the material interests did it, honour did it. Before I sign up for one I'd rather have the spec. So: what would a theory of moral revolution have to be able to do to be any use to someone running a campaign today who wants to know which lever to pull? Give me the desiderata, each with the case behind it, and mark which are genuine constraints and which are just one camp's perferences.

  Please get on your list (or tell me which of them is a bogus demand and why) these five: 1) a practice that dies out while almost nobody's belief about it changes, because it just got expensive or inconvenient — is that even the same phenomenon, and what does a theory owe us here; 2) pluralistic ignorance, everyone privately finished with the practice and it still fully in place; 3) the timing problem, the argument that fell flat for forty years and then works inside a decade; 4) the honour-holders giving up the thing that made them honourable, i.e. the people whose status was built on the practice being the ones who end it; 5) abolition imposed from outside by a conqueror or a colonial administration, which changes behaviour and maybe changes nothing else.

  Then the bit I actually want: which two desiderata on your list you think can't be jointly satisfied — I suspect wanting one mechanism general enough to cover all five cases and wanting each case's local honour economy to do real explanatory work are in tension, but you say which — and which single requirement knocks out the most of the three usual stories. And if you think the Williams-y point, that a revolutionary's reasons aren't reasons for the person she's arguing with so argument can't be the engine, is better handled as a desideratum than as a theory, say where it sits on the list. A one-line scorecard for arguments / interests / honour at the end is fine, but keep the weight on the criteria and their cases.
reasoning: |-
  Okay, the user is writing about how moral norms collapse and is frustrated with the three common explanations—arguments, material interests, and honor—being presented as mutually exclusive choices. They want a set of criteria (desiderata) that any useful theory of moral revolution should meet. They also have five specific cases they want addressed, and they're asking which desiderata conflict and which single requirement disqualifies most of the three usual stories.

  First, I need to break down each of the five cases they mentioned. For each, I should determine what a theory must explain. The user wants to know if a theory must cover all these scenarios or if some are different phenomena. For example, case 1 (practice dies without belief change) challenges theories that focus on belief shifts. Case 2 (pluralistic ignorance) involves people privately rejecting a practice but publicly sustaining it. Case 3 (timing problem) questions why change happens suddenly after long stagnation. Case 4 (honor-holders abandoning their status source) seems counterintuitive. Case 5 (external imposition) might involve coercion without genuine norm shift.

  The user also wants to identify which two desiderata can't be satisfied together. I suspect they're right about the tension between a general mechanism and the role of local honor economies. A theory that's too general might overlook specific cultural contexts, while one too focused on honor might not explain cases driven by material factors or external forces.

  Then, the single requirement that knocks out most of the three stories. The Williams point—that a revolutionary's reasons aren't reasons for their opponents—suggests that argument-based theories fail here. If a theory must explain why reasons only become effective under certain conditions, it challenges the argument-centric approach. Material interests might not account for cases where costs don't align with change, and honor might not explain external imposition.

  I should also consider the user's deeper needs. They're likely looking for a robust framework to guide real campaigns, so practicality is key. They need to know which levers to pull, so the theory must offer actionable insights. The desiderata should help evaluate which theories are useful for activists, not just academic.

  For the scorecard: Arguments might handle gradual belief change but fail on timing and pluralistic ignorance. Material interests explain cost-driven changes but not when costs don't shift. Honor captures status dynamics but may not cover external forces or belief persistence. Each has strengths but significant gaps when tested against the desiderata.
answer: |-
  Here's a breakdown of the desiderata for a useful theory of moral revolution, grounded in your cases, followed by analysis of tensions and the "knockout" requirement. The goal is a theory that guides campaign strategy by identifying the most effective levers.

  **Core Desiderata for a Theory of Moral Revolution (with Case Drivers):**

  1.  **Explain Belief-Practice Decoupling:**
      *   **Case:** 1 (Practice dies while belief persists) & 5 (Abolition imposed, behaviour changes, belief may not).
      *   **Requirement:** The theory must account for why practices can collapse *without* widespread prior belief change (costs/coercion), and conversely, why changed beliefs might not immediately kill a practice (pluralistic ignorance - Case 2). It cannot *assume* belief change is the primary driver or necessary first step.
      *   **Constraint/Pref:** **Genuine Constraint.** Any useful theory must handle the reality that behaviour and belief aren't always locked together; campaigns need to know if targeting beliefs is sufficient, necessary, or irrelevant.

  2.  **Resolve Pluralistic Ignorance & Enable Coordination:**
      *   **Case:** 2 (Everyone privately finished, practice persists).
      *   **Requirement:** The theory must explain how hidden dissent becomes visible public action. It needs a mechanism for overcoming the fear/uncertainty sustaining the false consensus and triggering coordinated abandonment once a tipping point is reached. Campaigns need to know *how* to shatter the illusion of support.
      *   **Constraint/Pref:** **Genuine Constraint.** This is a core social psychological barrier to change; a theory ignoring it is useless for dismantling entrenched norms where hypocrisy reigns.

  3.  **Explain Sudden Change After Stasis (The Timing Problem):**
      *   **Case:** 3 (Argument falls flat for 40 years, then works in a decade).
      *   **Requirement:** The theory must identify the *catalyst(s)* or *changed conditions* that make previously ineffective arguments or pressures suddenly potent. It must move beyond static factors (e.g., "the argument was always right") to dynamic interactions and thresholds. Campaigns need to know *when* to push hardest and what might tip the scale.
      *   **Constraint/Pref:** **Genuine Constraint.** Understanding latency and tipping points is crucial for strategy; a theory that can't explain timing is merely descriptive, not predictive or prescriptive.

  4.  **Account for Elite Defection & Status Reconfiguration:**
      *   **Case:** 4 (Honour-holders give up the source of their honour).
      *   **Requirement:** The theory must explain why elites invested in the status quo (financially, socially, honorifically) would defect. It needs mechanisms for how the *meaning* of honour/status attached to a practice can be inverted, stigmatized, or replaced *before* the practice fully collapses. Campaigns need to know if/how to convert or co-opt key stakeholders.
      *   **Constraint/Pref:** **Primarily Constraint, Partly Pref.** While elite defection isn't *always* necessary (Case 5 shows coercion), it's often critical for endogenous change. A theory ignoring status dynamics misses a key lever/potential barrier. The "honour camp" *prefers* it as central, but its *explanatory necessity* is a genuine constraint for cases like dueling or aristocratic privileges.

  5.  **Handle Exogenous Shocks and Coercion:**
      *   **Case:** 5 (Abolition imposed externally).
      *   **Requirement:** The theory must account for change driven by force, conquest, or overwhelming external power *without* requiring internal belief shift or elite buy-in *as the initial cause*. It must explain the subsequent effects: potential for backlash, slow norm internalization, or brittle compliance. Campaigns need to know the possibilities and limitations of external pressure.
      *   **Constraint/Pref:** **Genuine Constraint.** History is full of norm change via imperialism, war, and top-down decree; a theory pretending moral revolutions are only internal, rational dialogues is empirically false and strategically limiting.

  **Williams Point ("Reasons aren't shared reasons"):**
  *   **Handling:** Treat this as a **fundamental constraint underpinning the "Timing Problem" (Desideratum 3) and Belief-Practice Decoupling (Desideratum 1)**. A theory must acknowledge that the revolutionary's *reasons* are not *reasons for* the adherent *at the time of adherence*. Therefore, it cannot rely *solely* on the inherent power of the "better argument." It must explain *how* new reasons become compelling (e.g., changing material conditions, shifting reference groups, delegitimizing old authorities, creating new sources of shame/honour). This is less a separate desideratum and more a **meta-constraint on explanations relying on persuasion**.

  **The Tension: Two Desiderata in Conflict?**
  *   **Plausible Conflict:** **Desideratum 5 (Handle Exogenous Shocks/Coercion)** and **Desideratum 4 (Account for Elite Defection & Status Reconfiguration)** create the sharpest tension.
  *   **Why?** Desideratum 5 demands a mechanism explaining change *without* internal elite buy-in or status reconfiguration – it's imposed, often *against* the elites' interests and honour code. Desideratum 4, however, focuses on the *internal* process of how elites *do* come to abandon their status source. A theory heavily focused on endogenous status dynamics (honour camp preference) struggles to explain Case 5 cleanly. Conversely, a theory focused purely on power/coercion (some interest camp views) struggles with Case 4 (why would elites *voluntarily* give up status?). A truly general theory needs mechanisms for *both* paths and their interaction (e.g., external pressure *triggering* internal status reconfiguration).

  **The Knockout Requirement: Disqualifying the Usual Stories**
  *   **The Single Most Damaging Requirement:** **Desideratum 1 (Explain Belief-Practice Decoupling)**.
  *   **Why it Knocks Out Most:**
      *   **Arguments:** Primarily targets beliefs. If the practice dies while beliefs *don't* change (Case 1) or change is imposed without persuasion (Case 5), argument-centric theories are inadequate. They struggle with pluralistic ignorance (Case 2) and often fumble the timing problem (Case 3) by not explaining why the argument *now*?
      *   **Interests:** Can handle Case 1 (costs) and Case 5 (coercion changing cost/benefit) well. However, it struggles profoundly with **Case 4 (Elite Defection)**. Why would elites voluntarily abandon a practice *central to their status and wealth* (e.g., slave-owning gentry leading abolition societies) unless their *perception* of their interests changed via non-material factors (shame, new honour codes)? Pure interest theories often ignore the social/status *meaning* of interests. They also struggle with the persistence of costly practices under pluralistic ignorance (Case 2) and the timing of change when material factors were stable (Case 3).
      *   **Honour:** Excels at Case 4 (Elite Defection/Status Reconfiguration) and is crucial for understanding Case 2 (Pluralistic Ignorance sustained by fear of dishonour). It handles the social dynamics of the timing problem (Case 3) well. However, it struggles most with **Case 5 (Exogenous Coercion)**. How does "honour" explain abolition forced by a colonial power onto a society that still internally honours warrior-slave raiders? It also struggles with Case 1 if the cost shift isn't framed through a lens of honour/shame.

  **One-Line Scorecard on the "Usual Stories":**
  *   **Arguments:** Strong on normative shift *eventually*, but weak on belief-practice decoupling, timing, pluralistic ignorance, and external force; often ignores status.
  *   **Interests:** Strong on cost-driven collapse and external force, but weak on elite defection when status is involved, pluralistic ignorance, and explaining why interests *suddenly* change perception.
  *   **Honour:** Strong on status dynamics, elite defection, pluralistic ignorance, and social tipping points (timing), but weak on purely exogenous coercion and sometimes downplays material costs/benefits outside their honour framing.

  **Conclusion for the Campaigner:**
  A useful theory needs **multiple, interacting mechanisms**. Focus on identifying:
  1.  **The binding constraint:** Is it pluralistic ignorance? (Target visibility/coordination). Unbearable costs? (Target economics/logistics). Entrenched elite status? (Target status reconfiguration/replacement). External power imbalance? (Leverage pressure).
  2.  **The potential catalyst:** What could shatter the current equilibrium (e.g., scandal, technological shift, war, economic crisis, visible elite defection)?
  3.  **The target audience's reasons:** Not *your* reasons, but *theirs*. What could make *them* see abandonment as beneficial (materially), honourable (socially), or unavoidable (coercively/practically)? The lever you pull depends entirely on diagnosing which combination of material costs, social shame/honour, and practical feasibility is most vulnerable *in this specific context*. No single lever works universally.
