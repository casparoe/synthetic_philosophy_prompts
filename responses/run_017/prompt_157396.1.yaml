     - Awkward case: *Text-based competition* (no answer to whether it’s a "game," but the question is ill-posed).  

  8. **Skeptical View**  
     - Commitment: No fact about past meaning settles correctness; it depends on what the practice now licenses.  
     - Awkward case: *Expert error* (experts weren’t "wrong" in the past; the practice just evolved).  

  9. **Artifact Externalism (unnamed)**  
     - Commitment: Artifacts (e.g., music, games) have hidden essences (e.g., creator’s intent).  
     - Awkward case: *Machine-generated music* (no creator’s intent, so not music).  

  10. **Mixed Externalism (unnamed)**  
      - Commitment: Hidden natures fix natural-kind terms (water) but not others (whales, artifacts).  
      - Awkward case: *Whale case* (why treat water and whales differently?).  

  ---

  ### Key Notes  
  - **Indistinguishable Pairs**:  
    - *Family-Resemblance and Prototype Views*: Both end at **Node 12**; no question separates them. To pry apart: "Is categorization based on overlap with *multiple exemplars* (family resemblance) or similarity to a *single prototype* (e.g., chess for 'game')?"  
    - *Quietism and Skepticism*: Separated only by **Node 12**; no further question distinguishes them, as both reject "fact of the matter" but disagree on whether the demand is coherent.  
  - **Logically Independent Nodes**:  
    - **Node 1** and **Node 7** (answers to Twin Earth and Whale Case Consistency are independent).  
    - **Node 3** and **Node 9** (deference after discovery and shared-feature tests are independent).  
  - **Undefended Combinations**:  
    - **Mixed Externalism** (externalism for water but not whales): *Unattractive* (no principled reason for asymmetry).  
    - **Artifact Externalism** (hidden essences for artifacts): *Unexplored* (few defend hidden structures for practices like music/games).  
  - **Vagueness Debate**:  
    - Attaches to **Nodes 4, 5, 8, 11** (cases testing fuzzy boundaries). *Kept off the main trunk* because it focuses on *degree* (claim B), while the trunk tests *source* of correctness (claims A and C).
