answer: |-
  ## Proposal: Resolving the Spandrels Stalemate - A Time-Indexed Framework for Burden of Proof in Evolutionary Explanation

  **1. Core Question & Possible Answers:**
  *   **Precise Question:** Can a principled, time-indexed framework for assigning the burden of proof ("null hypothesis") regarding adaptation vs. non-adaptive origin be derived from successful practices in resolving specific evolutionary explanations, and does this framework resolve persistent ambiguities in the Gould-Lewontin adaptationism debate concerning "origin/maintenance slippage"?
  *   **Possible Answers (Determinate within 9 months):**
      *   **Answer A (Framework Valid & Useful):** Yes. Analysis reveals consistent, implicit principles for setting the burden of proof *per explanatory context* (e.g., focusing on trait origin vs. current maintenance, specific contrast classes). We can formalize these into a clear, time-indexed framework applicable to specific traits/sub-systems, resolving slippage.
      *   **Answer B (Framework Intractable):** No. While slippage is real, attempts to systematize burden assignment reveal it is fundamentally tied to irreducible contextual factors (e.g., specific lineage history, available evidence type, research question), making a general principled framework impossible. The stalemate reflects inherent complexity.
      *   **Answer C (Slippage Moot):** No. The analysis shows that successful resolution consistently relies on empirical evidence *overcoming* any initial burden, rendering the formal assignment of a default ("null") largely irrelevant or misleading in practice. The debate's focus on defaults is itself the problem.

  **2. Why Standard Framings Leave the Question Open:**
  The Gould-Lewontin debate persistently stalls because prevailing framings fail to adequately address the temporal duality of traits (origin vs. current maintenance/refinement) and its impact on explanatory burdens:
  *   **Global Adaptationism Thesis:** Framing the debate as "How much of the phenotype is adaptive?" (Gould & Lewontin's target) ignores that *the same trait* can be non-adaptive in origin *and* adaptive in current maintenance. This global question conflates time slices, making burden assignment ambiguous. Is the burden to show adaptation for the *origin*, the *current form*, or the *entire history*?
  *   **Adaptationism as Heuristic:** Viewing adaptationism solely as a "good way to generate hypotheses" (defended by some) sidesteps the crucial issue of *how we evaluate competing hypotheses* once generated. It doesn't specify *when* the burden shifts *away* from the adaptation hypothesis or *which aspect* (origin or refinement) is being tested, allowing slippage to persist in evaluation.
  *   **Semantic Dissolution ("Function" Debates):** Reducing the debate to defining "function" (e.g., selected effect vs. causal role) fails. Both definitions can apply to the *same trait at different times*. A spandrel (non-selected origin) can acquire a selected-effect function later. Debating "what function *is*" doesn't tell us *when* or *for which time period* we need evidence of selection to meet a burden of proof regarding its origin or its current status.

  The core gap is the lack of explicit, principled norms for deciding, *for a specific explanatory question about a specific trait*, whether the default assumption should be "explain by adaptation (selection at time T)" or "explain by non-adaptive origin/constraint," recognizing that T (origin vs. maintenance) matters critically. Slippage occurs when participants implicitly shift T without acknowledging it.

  **3. Approach & Why it's Better:**
  *   **Approach:** **Methodological Analysis of Resolved Explanations.** We will systematically analyze well-documented, *resolved* evolutionary explanations where "origin/maintenance slippage" was a *potential* pitfall but was successfully navigated (e.g., mammalian ear ossicles, lens crystallins, perhaps specific gene co-option events). The focus is *not* on surveying the traits themselves, but on **reverse-engineering the methodological norms and inferential practices** that allowed biologists to assign burdens, demand evidence, and reach consensus *without* succumbing to slippage.
      *   **RA Task:** Identify 15-20 high-quality case studies from evolutionary developmental biology, paleontology, and molecular evolution where the trait's deep homology (suggesting non-adaptive origin) and current adaptive function are both well-supported. Extract the explicit and implicit rules of evidence, burden-shifting arguments, and temporal framing used in key papers resolving the explanation.
      *   **PI Task:** Analyze these practices using tools from philosophy of science (explanatory norms, contrastive explanation, concepts of evidence) to identify (a) if consistent principles for time-indexed burden assignment exist, (b) what these principles are, or (c) why they resist systematization.
  *   **Why Better Than Alternatives:**
      *   **vs. Case Study Surveys:** We avoid merely cataloging *what* is/isn't adaptive. We focus on *how disputes were resolved methodologically*, directly targeting the burden-of-proof issue. We learn from success, not just description.
      *   **vs. Semantic Armchair Analysis:** We ground the analysis in *actual scientific practice* – how working biologists, when faced with slippage, pragmatically resolve it. This prevents getting lost in abstract definitions and connects directly to usable norms. We analyze language use *in context* within resolved explanations.
      *   **Key Advantage:** This approach directly addresses the user's core insight (slippage) and targets the *process* of justification that is central to the unresolved debate. It leverages the wisdom embedded in successful scientific practice to derive potential norms.

  **4. Deliverable for Working Biologists:**
  The primary deliverable will be a **Practical Framework & Diagnostic Tool**, presented as a concise memo (≤5 pages) and potentially a simple flowchart/checklist:
  *   **"Time-Slicing Your Trait":** Clear guidance on explicitly defining the explanatory target: Is the question about the *origin* of feature F, or the *refinement/maintenance* of its *current* form? Emphasizing that these are distinct questions requiring distinct evidence.
  *   **"Setting the Local Burden":** Principled recommendations (based on analysis) for assigning the initial burden of proof *per explanatory question/trait/time-slice*. E.g., "When asking about the *evolutionary origin* of a novel structure, the burden lies on showing adaptive necessity/advantage *at that stage*; alternatives (constraint, exaptation) start as the default." Or "When asking why a *currently essential, complex* trait is *maintained*, the burden lies on showing why non-selective explanations are insufficient."
  *   **"Slippage Diagnostic":** Key questions biologists should ask themselves and their peers when disagreements arise to pinpoint if origin/maintenance slippage is causing the stalemate (e.g., "Are we arguing about the same time period?", "What specific evidence would shift the burden here?").
  *   **Important Note:** If the analysis (Answer B or C) shows a robust framework is *not* feasible, the deliverable becomes a clear argument *against* the possibility of such local principles, explaining *why* the burden is contextually irreducible or empirically moot, potentially shifting the focus of the debate itself.

  **5. Success, Failure, and Negative Outcomes:**
  *   **Success:** Delivery of a clear, principled, time-indexed framework for burden assignment (Answer A) *or* a robust argument against its possibility (Answer B/C), supported by analysis of real biological practice. Either outcome provides a concrete advance by resolving the ambiguity or explaining its persistence.
  *   **Negative but Valuable Outcome:** Finding that successful practice *does* rely on implicit time-indexed burden assignment norms (supporting Answer A), but that these norms are highly heterogeneous or deeply intertwined with specific empirical contexts, making a *simple*, universally applicable framework unrealistic (though still documenting the heterogeneity is valuable). Or, finding that practice consistently avoids formal burden assignment altogether (leaning towards Answer C).
  *   **Project Failure (Avoidable):**
      *   **Case Study Failure:** Inability to identify a sufficient number of well-documented, *resolved* explanations where origin/maintenance slippage was a relevant and navigated issue. (Mitigation: Broaden scope to include resolved debates in related fields like molecular evolution or physiology where functional recruitment is key).
      *   **Analysis Failure:** Inability to extract any coherent methodological norms from the case studies, resulting only in descriptive summaries without insight into burden of proof or slippage resolution. (Mitigation: Rigorous application of philosophical tools for analyzing justification; focus on argument structure in key papers).
      *   **Scope Creep:** Attempting to adjudicate *whether* specific traits are adaptations/spandrels instead of focusing *exclusively* on the methodological norms of justification. (Mitigation: Strict adherence to the research question and PI oversight).
  *   **Project Failure (Inherent Risk):** The core insight ("slippage is key") proves less central to actual biological disputes than hypothesized. Analysis reveals that resolved debates rarely involved significant slippage confusion, suggesting other factors dominate the adaptationism stalemate.

  This proposal directly targets the user's innovative "origin/maintenance slippage" hypothesis using a novel methodological analysis of successful practice. It promises a concrete, non-mushy deliverable – either a practical tool for clearer evolutionary explanation or a demonstration of why the burden-of-proof approach itself is flawed – within the constraints of a 9-month, part-time RA project. The outcome will definitively advance our understanding of this persistent debate by providing an answer grounded in how biology *works*, not just how it argues.
