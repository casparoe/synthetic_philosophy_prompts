  ### Editorial Commitments  
  1. **Replaced Intake Threshold with Purpose-Driven Intake** (your Dial 1) because intake decisions are driven by *why* we punish (e.g., rehab may confine for welfare, desert for culpability). This explains why a staffer might support confinement for minor offenses under rehab but oppose it under desert.  
  2. **Split rehabilitation into two leaves** because Q6 (coerced rehab) exposes a core tension: consequentialists accept coercion, autonomy-based views reject it. This reflects real divides (e.g., Scandinavian voluntarism vs. US coercion).  
  3. **Added Humane-Independent leaf** to capture the "conditions as a right" view, which you noted is often overlooked. I find it defensible but wrong in ignoring how purpose/duration affect conditions.  

  The most contestable choices:  
  - **Purpose over Intake**: Staffers might see intake as a standalone lever, but purpose predicts votes better.  
  - **Splitting Rehabilitation**: Coercion isn't always binary, but it splits key staffer behaviors.  
  - **Rejecting 'Desert with Subjective Conditions'**: I deemed it unattractive as it conflates objective desert with subjective experience, leading to inconsistent votes (e.g., shortening sentences for honor).  

