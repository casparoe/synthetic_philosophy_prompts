  ### Penal Policy Classification Instrument: Preamble  
  This instrument classifies views on penal policy along three independent dials: (1) **Purpose-Driven Intake** (who is confined and why, replacing Intake Threshold to focus on the *rationale* for confinement, not just the scope; this better captures whether confinement aims to punish, protect, or reform), (2) **Duration Setting** (how long sentences last, tied to desert, risk, or rehabilitation goals), and (3) **Conditions Independence** (whether conditions are a right or a tool, and if they must mirror external life). The instrument uses case-based questions to predict stances without theoretical labels. It is sensitive to how staffers separate these dials (e.g., supporting humane conditions while extending preventive detention) but may not capture hybrid views perfectly. It is designed for legislative staffers and ignores "tough vs. soft" framing.

