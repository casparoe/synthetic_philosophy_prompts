prompt: |-
  Hi. Bit of context first so you know who you're talking to. I'm a retired hydrologist — thirty-odd years of measuring things in rivers and arguing about whether the numbers meant anything — and over the last couple of years I've got into philosophy of science properly for the first time, mostly out of stubbornness after a friend told me science obviously "gets at the truth". So I've got the rough shape of the Duhem-Quine sort of point, and the worry that the alternatives we're able to list today may not include the one that turns out to be right, and the difference between a theory being true and it just saving the appearances. But I'm self-taught, I can't look anything up, and I don't want you to either: no reading lists, no "as So-and-so argues", no dates or titles I'd have to check. Give me the argument in plain words, as if to someone competent who happens to have no schooling in it. No web access here, so anything you'd need to verify is something you should leave out.

  The reason I need it is practical. I chair the evidence panel of a small catchment trust. Twice a year we recieve fifteen to twenty short proposals from local groups — anglers, parish councils, school groups, a couple of retired types like me — asking for up to about £12,000 for monitoring or restoration work, and they come with whatever data they've already collected. I get roughly twenty-five minutes per proposal. Two of the five panel members are lay trustees who have to be able to follow my reasoning, and we publish a one-paragraph rationale for every decision, which gets appealed, so it has to stand up in writing without leaning on my authority.

  The problem I keep hitting is always the same shape. A group turns up with honest, carefully collected data and a story about what's causing the pattern, and the data simply doesn't separate that story from three or four others that would fit it just as well. I want to stop writing "the evidence is a bit thin" and start being able to say what kind of thin, and what would thicken it, and whether it's worth spending trust money to find out.

  So: give me a decision procedure my panel can actually run. Ordered questions, what counts as a sufficient answer to each, a clear stopping point where the answer is no, and a clear hand-off where the remaining question is one of values rather than evidence and the trustees have to decide it. A flowchart in words is fine. Ground it in whatever is actually known about the underdetermination of theory by evidence, but keep only the distinctions a practitioner genuinely can't do without — and tell me which ones you've dropped and what I lose by dropping them. Be honest about which steps are judgement calls wearing a lab coat.

  There are specific hard cases it has to handle, because these are the ones that make me stall:

  One. Rivals that fit the data by construction. I can always cook up a story that fits any dataset if I'm allowed enough epicycles, and I don't want a procedure that tells me to take those seriously. But I also don't want the rule to be "prefer the story you were already inclined to", which is what my gut does. How do I tell a serious rival from a contrived one without smuggling in my prior?

  Two. Two stories that disagree about the mechanism but imply exactly the same thing to do about it. My instinct is that this is underdetermination I should stop caring about, since the money goes to the action either way. Is that right, or am I throwing away something I need?

  Three. What I've started calling chameleon claims, for want of a better name: whatever the numbers come out as, the group has a story ready — counts go up, it worked; counts go down, the lag hasn't elapsed yet; flat, we've halted the decline. Is that a species of underdetermination or a different disease entirely, and should the procedure treat it the same way?

  Four. Alternatives nobody has thought of yet. The procedure obviously can't list them. What's the best proxy a practitioner can use for the risk that the whole space of options on the table is wrong?

  Five. "We can't tell yet" versus "no evidence could ever tell the difference". Does my panel need to care which of those it's in, given we're deciding now and can't wait?

  Six, and I think this is the big one for us: the case where the effect itself is well supported but the explanation isn't. I suspect we should often fund the claim that something is happening and decline to fund the claim about why, and I want the procedure to make that a distinct output rather than a fudge.

  Then run the thing on three proposals, so I can see it work.

  The first: a volunteer group with three years of fortnightly phosphate readings and monthly fish counts at ten sites on one tributary, wanting money for fence-and-buffer work, on the claim that run-off from a particular farm is causing the decline in brown trout. The correlation is real and the data collection is decent, but I can think of four other stories off the top of my head, including one where there's no real decline at all and the volunteers just got better at counting.

  The second: a before-after-control-impact study on a re-meandered reach, two years either side, one restored stretch and one unrestored control, invertebrate diversity up about thirty per cent in the restored stretch and flat in the control. Much better design than the first one. Tell me whether it's actually better under the procedure, and what the cheapest single measurement would be that would knock out the remaining rivals. I should declare that I advised this group informally and unpaid, so it's the one I'm most inclined to wave through.

  The third: a proposal to plant three kilometres of bankside trees for shade, to protect salmon from high summer temperatures. The physics and the fish physiology are not in doubt, there's decent regional air-temperature data and a model, but there's no water-temperature data from this river at all and I genuinely don't know where the cold-water refuges on it actually are. So the underdetermination here is about which stretch, not about whether shade cools water. If your procedure says no to something I'd have funded on instinct, or yes to something I'd have turned down, say so plainly — I'd rather find out from you than from an appeal.

  Finally: the procedure can't do everything, and I want that written down too, especially the places where underdetermination is real and irreducible and we still have to spend the money, because we can't not decide.

  One last housekeeping thing — write the procedure itself in American English. I'm putting it on a shared wiki that a couple of watershed groups in the States are using too, so they get spellings they can live with, even though I write British and this message definately does.
reasoning: |-
  Okay, let me approach this systematically. The user is a retired hydrologist chairing an evidence panel for a catchment trust, facing practical challenges with proposal evaluations. They've clearly articulated six specific pain points around underdetermination of theories by evidence, and want a decision procedure that's both philosophically grounded and operationally feasible.

  First, I need to recognize the user's expertise level. They understand Duhem-Quine and key philosophy of science concepts, but explicitly want no academic references - just plain English reasoning. Their self-taught background suggests I should avoid jargon while preserving conceptual precision. The practical constraints are crucial: 25 minutes per proposal, lay trustees needing clear rationales, and public accountability through written decisions.

  The core challenge is designing a procedure that addresses all six hard cases they described:
  - Filtering serious vs contrived rival explanations
  - Handling equivalent-action theories differently from explanatory rivals
  - Detecting unfalsifiable "chameleon claims"
  - Accounting for unknown unknowns
  - Distinguishing temporary vs permanent evidentiary gaps
  - Separating effect evidence from mechanism evidence

  For the procedure itself, I'm considering a four-stage funnel approach: first screen for basic data integrity, then test explanatory claims against rivals, assess feasibility of discrimination, and finally separate action decisions from knowledge gaps. Each stage needs clear pass/fail criteria and specific outputs for the trustees. The "serious rival" filter will be particularly tricky - I'll need a operational definition that doesn't rely on prior beliefs but uses testability and parsimony as proxies.

  The three test cases are perfect for stress-testing:
  - The phosphate/trout case should fail the serious rivals test due to multiple plausible alternatives
  - The BACI study passes most hurdles but needs one crucial measurement (like sediment load) to rule out remaining rivals
  - The shade proposal might surprisingly fail because it confuses known physics with site-specific applicability

  Throughout, I must maintain absolute honesty about judgment calls disguised as objective steps. The user specifically wants to know where philosophy meets practical compromise - like when we accept that irreducible underdetermination still requires funding decisions.

  For the American English requirement, I'll consistently use "program" over "programme" and "color" over "colour", while keeping the reasoning accessible to international watershed groups. The tone should remain professional yet conversational - they're clearly allergic to academic pretense.

  Most importantly, the output must end with clear limitations: where the procedure can't resolve underdetermination but the trust must still decide. This aligns with their closing remark about "real and irreducible" uncertainty in environmental management.
answer: |-
  Here’s a decision procedure grounded in underdetermination, stripped to operational essentials. It treats rival explanations as the core problem and forces explicit judgments about **testability** and **actionability**. I’ve dropped distinctions like "confirmation vs. falsification" (we use both) and "observational/theoretical terms" (not useful here). What’s left is what you *need* to triage proposals.

  ---

  ### **The Four-Step Decision Procedure**
  *(American English, as requested)*

  **STEP 1: IS THE CLAIM TESTABLE?**  
  *Ask: "Could *any* evidence prove this claim false?"*  
  - **Sufficient answer:** "Yes, and here’s how." (e.g., "If phosphate stays high after buffers, our farm-runoff claim is wrong.")  
  - **Stop if:** The claim adjusts to *any* outcome (your "chameleon claims"). **Output:** *"Claim is untestable. Reject."*  
  - **Why?** Untestable claims waste money. They’re not underdetermined; they’re empty.  
  - **Judgment call:** Is the proposed falsification *practical*? (Skip if unrealistic, e.g., "if we observe quarks in the river.")

  **STEP 2: ARE THERE SERIOUS RIVALS?**  
  *Ask: "What’s the *simplest, most plausible* rival that fits this data?"*  
  - **Sufficient answer:** A rival that:  
    - Explains *all* key data points (no ignoring outliers).  
    - Requires ≤2 new untested assumptions (blocks "epicycles").  
    - Is consistent with known science (e.g., no "invisible otters eating trout").  
  - **Stop if:** No serious rivals exist. **Output:** *"Evidence supports the claim. Fund if action aligns with trust goals."*  
  - **Why?** "Serious" = testable, parsimonious, and biologically/physically plausible. Your prior *is* used here – but constrained by simplicity and consistency.  
  - **Judgment call:** Is the rival *plausible*? (e.g., "volunteers got better at counting" is plausible; "aliens manipulated sensors" is not.)

  **STEP 3: CAN WE DISCRIMINATE CHEAPLY?**  
  *Ask: "What’s the *cheapest, fastest* test to rule out ≥1 serious rival?"*  
  - **Sufficient answer:** A specific measurement/intervention:  
    - Costs ≤10% of requested funds (e.g., $1,200 for a $12k ask).  
    - Yields results before the next funding cycle (≤6 months).  
    - Targets a *difference* between claim and rival(s) (e.g., "Measure groundwater temp to rule out cold springs vs. shade").  
  - **Stop if:** No cheap test exists OR the test is feasible.  
    - **Output if no test:** *"Underdetermined. Fund only if action is justified *regardless* of cause (see Step 4)."*  
    - **Output if test exists:** *"Underdetermined. Fund *only* the test, not full action. Revisit next cycle."*  
  - **Why?** If discrimination is cheap, do it first. If not, fund action only if it’s urgent/universal.  
  - **Judgment call:** Is the test *decisive*? (Ruling out one rival is enough; don’t demand all.)

  **STEP 4: IS THE ACTION ACTIONABLE?**  
  *Ask: "Would we fund this action *even if the claim is wrong*?"*  
  - **Sufficient answer:** "Yes" if:  
    - Action has high ecological/social value *independent* of the claim (e.g., buffers reduce erosion even if not helping trout).  
    - Action is low-risk/reversible (e.g., planting trees vs. building a dam).  
  - **Output:** *"Underdetermined but action justified. Fund with caveat: 'Evidence for mechanism is inconclusive; action supported for co-benefits.'"*  
  - **Stop if:** Action depends entirely on the claim being true. **Output:** *"Underdetermined and action not justified. Reject."*  
  - **Why?** Decouples effect/mechanism. Funds "what works" without endorsing "why."  
  - **Judgment call:** Trustees decide value here. Your job: flag if action hinges on claim.

  ---

  ### **Handling Your Hard Cases**
  1.  **Rivals by construction:** Step 2 filters these. Rivals must be *simple* and *plausible*. "Farm runoff causes decline" is simple; "Farm runoff + lunar tides + butterfly migrations cause decline" isn’t.  
  2.  **Same-action rivals:** Step 4 handles this. If action is identical and justified, fund it! Don’t waste money finding "why."  
  3.  **Chameleon claims:** Step 1 catches these. If unfalsifiable, reject immediately.  
  4.  **Unknown unknowns:** Step 2’s "plausibility" filter is the proxy. If all current rivals seem *ad hoc*, the risk is high.  
  5.  **"Can’t tell yet" vs. "Never tell":** Step 3 separates these. If a cheap test exists, it’s "can’t tell yet." If not, it’s functionally "never tell" *for your purposes*.  
  6.  **Effect vs. explanation:** Step 4 explicitly decouples them. Fund effect-based action; defund mechanism hunts without practical payoff.

  ---

  ### **Test Runs on Your Proposals**

  **Proposal 1: Phosphate/Trout Decline**  
  - **Step 1:** Testable? Yes (e.g., "If buffers don’t reduce P, runoff isn’t main cause").  
  - **Step 2:** Serious rivals? Yes. "Counting improved" (plausible, simple). "Drought stress" (plausible). "Disease" (plausible).  
  - **Step 3:** Cheap test? Yes. Correlate trout counts with *independent* data (e.g., EA fish surveys) to rule out "counting improved." Cost: <$500 for data access.  
  - **Output:** *"Underdetermined. Fund only $500 for EA data correlation to test 'counting improved' rival. Revisit next cycle."*  
  - **Note:** Your gut was wrong. Don’t fund fences yet.

  **Proposal 2: Re-meandering BACI Study**  
  - **Step 1:** Testable? Yes (e.g., "If diversity stays high in control, restoration didn’t cause it").  
  - **Step 2:** Serious rivals? Few. "Restoration worked" is simplest. Rival: "Sediment pulse from upstream favored certain inverts." (Plausible, but requires untested assumption.)  
  - **Step 3:** Cheap test? Yes. Measure sediment load/type in restored vs. control reach. Cost: <$1,000.  
  - **Output:** *"Underdetermined. Fund $1,000 for sediment testing to rule out 'sediment pulse' rival. If ruled out, fund restoration elsewhere."*  
  - **Note:** Your inclination was *almost* right – but one cheap test makes it bulletproof.

  **Proposal 3: Bankside Shade for Salmon**  
  - **Step 1:** Testable? **No.** Claim: "Shade *here* will cool water *enough* for salmon." But no baseline temps, no refuge map. If water stays warm, they’ll say "not enough shade" or "refuges compromised." Chameleon claim!  
  - **Output:** *"Claim untestable. Reject."*  
  - **BUT – Use Step 4:** Is planting trees *actionable* regardless? Yes (erosion control, habitat).  
  - **Revised proposal:** Fund temperature loggers ($800) for 1 year to *find* refuges + model validation. Then propose targeted planting.  
  - **Note:** Your instinct was wrong. No data → no test → no funding for *this* claim. Fund the *next step* instead.

  ---

  ### **What This Procedure Can’t Do**
  1.  **Eliminate judgment calls.** Steps 2 (plausibility) and 4 (action value) *require* expert/trustee judgment.  
  2.  **Guarantee truth.** It minimizes wasting money on untestable or overfitted claims but won’t find "the real cause."  
  3.  **Handle emergencies.** If salmon are dying *now*, fund the shade even if untestable (Step 4 action override).  
  4.  **Replace values.** Trustees *must* decide when action is "worth it" sans evidence (Step 4).  

  **Crucially:** Underdetermination *is* sometimes irreducible. The procedure forces you to either:  
  - Fund a cheap test to reduce it (Step 3),  
  - Fund action for co-benefits *despite* it (Step 4), or  
  - Reject and move on.  

  This is how science works in the wild: you spend money on what’s testable *or* actionable, not on fairy tales. Your panel isn’t judging Truth; it’s judging **what’s worth doing next**.
