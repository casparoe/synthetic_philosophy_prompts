answer: |-
  I reject **step (4)**—the claim that decisive moral reason entails moral obligation—as the fatal flaw in your argument. Here's my diagnosis, priced alternatives, and resolution of the self-imposed cost problem, with full commitments.  

  ### Why Step (4) Fails  
  Step (4) assumes that if moral reasons favor A and none oppose it, then S *morally ought* to do A. But supererogation requires a gap between **decisive moral reasons** (what there is most reason to do) and **moral obligation** (what is required). Rejecting (4) preserves the core intuition: some acts are morally optimal, even rationally *demanded*, yet not obligatory. The cost:  
  - **Theoretical Price:** You must deny that "ought" tracks the balance of reasons simpliciter. Instead, obligation is constrained by **agent-relative permissions** (e.g., partiality toward self) or **demandingness thresholds**. For example, even if donating a kidney maximizes moral reasons, the cost *to the agent* may exempt it from being obligatory.  
  - **Cost to Friend of Supererogation:** Minimal. This aligns with standard moderate deontology (e.g., Scheffler, Ferry). It saves gratitude, favors, and admiration by preserving optional goodness.  

  ### Pricing the Alternatives  
  - **Reject (1) (Praiseworthiness requires moral reasons):** You lose the link between morality and reasons. Praiseworthiness becomes arbitrary (e.g., lucky acts could be praised). *Too costly.*  
  - **Reject (2) (No reasons against supererogation):** Accept that costs *are* moral reasons against acting (per your referee). Then (3) fails—supererogatory acts *do* have opposing reasons. But this conflates types of reasons: **prudential costs** (e.g., pain, resources) are not *moral* reasons against action unless they violate duties to self or others. If they *are* moral reasons, supererogation collapses into mere permission. *Costly but salvageable*—if you distinguish moral/prudential reasons.  
  - **Reject (3) (No opposing reasons):** Incoherent if (2) holds. *Non-starter.*  
  - **Reject (5) (Obligation entails blame for omission):** This severs the "ought-blame" link. But we *want* blame for failing duties! *Unacceptably costly for moral responsibility.*  
  - **Reject (4):** As above, allows supererogation by decoupling decisive reasons from obligation. *Least disruptive.*  

  **Confidence:** High (80%). I’d reconsider only if shown that "ought" *must* mirror decisive reasons—but this is precisely what supererogation denies. **Necessity:** Step (4) alone must go; the rest can hold with nuance.  

  ### Solving Self-Imposed Cost  
  The problem arises because costs only enhance supererogatory status when they are:  
  - **Non-voluntary** (not manipulated),  
  - **Normatively significant** (reflect a sacrifice of genuine value), and  
  - **Not incurred to evade duty**.  

  **Principle:** *Self-imposed costs "count" toward supererogation iff they reflect a prior, non-obligatory commitment to moral ideals beyond what society expects.*  

  **Cases Resolved:**  
  1. **Canal Weights:** Costs don’t count. She manufactured costs to *simulate* sacrifice, violating non-voluntariness and normative significance (no real moral ideal). Her act is less praiseworthy.  
  2. **Kidney Donor/Income Pledge:** Costs count. She voluntarily embraced a moral ideal (e.g., radical altruism) that exceeds baseline obligations. This is genuine, normatively significant sacrifice.  
  3. **Careless Rescuer:** Not supererogatory. Costs are reparative—she owes a duty to rectify self-created harm. No "beyond duty" credit.  
  4. **Firefighter:** *Not supererogatory in routine risks.* She took a job with known duties; facing foreseen dangers is obligatory (a duty of role). But *exceptional* sacrifices (e.g., running into a collapsing building beyond protocol) may be supererogatory if they exceed her role’s demands.  

  **Independence:** This principle stands regardless of rejecting (4). It clarifies that costs matter *contextually*—not as free-floating moral reasons against action (contra your referee), but as factors determining whether an act exceeds obligatory benchmarks.  

  ### Conclusion  
  Rejecting (4) saves supererogation by allowing decisive moral reasons without obligation. The cost—denying that "ought" always tracks the balance of reasons—is a feature, not a bug: it reflects the space for *optional moral excellence*. Your self-imposed cost cases are sorted by the voluntariness and normative role of sacrifices, securing the intuition that supererogation requires authentic, ideal-driven sacrifice. The referee’s worry about costs as moral reasons is defused: they are not *pro tanto* moral reasons against acting, but contextual markers of what makes an act *demanding beyond duty*. This preserves the category without collapsing the argument.  

  **Final Word:** If I’m wrong, the next weakest step is (2)—but that forces conceding that costs are moral reasons, narrowing supererogation to "permissible but suboptimal" acts and gutting its admirability. Stick with slaying (4).
