  Wait—what if we challenge (4)'s assumption that "most moral reason" always implies "ought"? That could let supererogatory acts have decisive reason without being obligatory. But then we'd owe an account of why "ought" doesn't follow... *muses about moral residue, optionality*... 

  *checks their demand for "priced alternatives"* They don't just want which step to reject; they want the theoretical cost. If we ditch (2) (say costs *are* moral reasons), we might lose the purity of "no moral reasons against." If we reject (4), we need to explain why decisive reasons don't entail ought. Both have trade-offs. 

  *notices their seminar challenge* Ah—the self-imposed cost problem isn't just an example; it's a litmus test. Any solution must handle why the kidney donor's cost "counts" but the weight-strapper's doesn't. That points to voluntariness and context. The firefighter case will test consistency. 

  Confidence level? Medium-high. The argument overreaches at (4), but (2) is shaky too. If pressed, I'd say both (2) and (4) need weakening. But let's lead with (4) as the primary flaw—it's cleaner and preserves their cherished (1) and (5). The cost cases will follow from voluntariness + normative role of costs. 

