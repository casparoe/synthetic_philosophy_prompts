answer: |-
  Here’s a toast that navigates your constraints, followed by structural notes:

  ---

  **(Clink glass)**  
  Friends, family, colleagues—especially the ink-stained crew in the back—tonight we celebrate a man who showed up. For thirty-eight years, rain or blizzard, council meeting or fire call, **he showed up**. Not just to report, but to witness.  

  You all know his famous creed: *Put both sides in front of readers and let them decide*. But I’ve always thought that creed was really about something deeper. It wasn’t just about balance—it was about **giving you the ground under your own feet**. When you opened his paper, you weren’t handed conclusions. You were handed the testimony: the documents, the quotes, the facts laid bare. He trusted you to stand on that ground and see for yourself.  

  That trust wasn’t passive. It demanded something of all of us. It demanded reporters chase every lead, photographers frame the truth, editors sweat the commas. *(Nod to copy chief)* It demanded readers lean in, squint at the small print, and **hold the paper to its own words**.  

  Which brings me to his last years. Some of you saw it: readers sending in old clippings, asking hard questions with the paper’s own history. I asked him once if that rattled him. He just said: *“If they’re using the paper to read the paper, we’re doing something right. Even when it hurts.”* He didn’t pretend it was simple. But he never stopped believing that the answer—when there was one—would be found in the work. In showing up.  

  So raise your glasses to a man who built this town’s mirror. Not a flattering one—a stubborn, smudged, ink-stained mirror. One that showed us *us*, in full sunlight, no matter how we winced. To [Name]: who showed up so we could see.  

  ---

  **Structural Notes**  

  1.  **Ground under your feet** (replaces "exposure-as-remedy"):  
      *Shifts focus from "hearing both sides" to "enabling verification." Anchors his creed in agency ("see for yourself") and tools ("testimony, documents"), avoiding bubble/chamber logic while honoring his intent.*  

  2.  **"Hold the paper to its own words"** (sidesteps absorbed vocabulary):  
      *Concretizes the chamber dynamic without naming it. The phrase is action-oriented (reader agency) and newsroom-resonant ("accountability"), avoiding academic baggage. The archival letters later reframe credibility attacks as proof of his creed’s success.*  

  3.  **"Using the paper to read the paper"** (avoids fake resolution):  
      *Acknowledges the unresolved tension neutrally. Framing reader critiques as engagement ("we’re doing something right") honors his struggle without defeat or faux closure. "Even when it hurts" validates his honesty.*  

  4.  **"Stubborn, smudged, ink-stained mirror"** (unites rooms through metaphor):  
      *Newsroom hears "rigor" (stubborn/smudged = imperfect process). Community hears "familiar service" (mirror = reflecting them). "Showing up" is the through-line binding professional rigor and personal integrity.*  

  5.  **Tone as armor**:  
      *Affection ("ink-stained crew," "sweat the commas") disarms newsroom skepticism. Community-facing phrases ("council meeting or fire call") keep it grounded. His own words ("showed up") protect against wincing.*  

  6.  **No didacticism**:  
      *The "demanded something of all of us" implicates everyone equally. Ends on communal pride ("showed us us"), not instruction. Philosophy is embedded in deeds, not named.*
