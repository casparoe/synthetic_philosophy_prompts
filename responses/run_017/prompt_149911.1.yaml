answer: |-
  Your letter cuts to the bone of moral philosophy's deepest tension: the clash between rational obligation and the irreducible claims of persons. Here’s my considered verdict, stripped of academic hedging, with reasons grounded in the particulars you’ve shared.

  ### 1. **You should attend your daughter’s wedding.**
     - **Why:**  
       The asymmetry you identify is real and decisive. A promise to the dead binds *you*, but a promise to the living binds *both of you in relationship*. Missing her wedding doesn’t merely break a promise; it severs the fragile thread of trust she’s offered you. Her words ("*this is the one thing she needs from me*") reveal this isn’t about ceremonial duty—it’s a plea for existential validation of your relationship. The defence, while grave, is institutionally reparable (more below). This wedding moment is not.

     - **The Open Remainder Test Holds:**  
       If you miss the wedding, resentment *would* be fitting. Your apology could acknowledge the debt, but it couldn’t erase the foundational wound of choosing another over her at this threshold moment. By contrast, the defence’s "closed" remainder requires explanation and repair, but not an unending debt. The student *could* (however painfully) understand your choice as a tragic conflict; your daughter likely cannot.

  ### 2. **Do not ask your daughter to release you.**  
     - **Why:**  
       Requesting release shifts the moral burden onto her. If she consents (out of guilt, resignation, or despair), it may superficially "resolve" the conflict but corrode the relationship further. She’ll know you asked to prioritize another. This transforms your choice into a shared betrayal: you failed her, then made her complicit. The residue would be poisoned.

  ### 3. **Compensability Misleads Here:**  
     - **Why your partner is wrong:**  
       Your partner’s argument ("*the student cannot be compensated*") mistakes the nature of the harms. The student’s loss (delayed defence) is professional and reparable: funding extensions, visa appeals, or a replacement examiner *can* be sought (see solutions below). The damage to your daughter is *constitutive*: missing her wedding alters who you *are* to her. No future acts "compensate"; they merely patch a fracture in your relational identity. Compensability applies to quantifiable harms, not existential ones.

  ### 4. **Your Published View Misfires at the Point of Moral Residue.**  
     - **Where the logic breaks:**  
       Your younger self assumed moral conflicts occur in a vacuum of abstract obligations. But real promises are embodied in relationships with histories and futures. The "open remainder" isn’t sentiment—it’s the scar of *personal betrayal*. When you break a promise embedded in a fragile relationship (daughter), the debt persists because *the relationship itself* is the vessel of the obligation. The defence promise, while solemn, is institutional and fungible (you’re replaceable *in function*, if not ideally). Your daughter cannot replace you as father-of-the-bride.  
       - **The flawed premise:** That "best available" choices extinguish obligations. Some choices create irreversible relational ruptures. The residue is the ongoing duty to bear the cost of that rupture—not as self-punishment, but as fidelity to the value you overrode.

  ### What To Do About the Defence:
  - **Act immediately:** Contact the graduate chair, dean, and the student. Explain the emergency (no need for details; "unavoidable family obligation" suffices).  
  - **Propose solutions:**  
    • A remote connection for your initial remarks, followed by an in-person examiner via train (if timing allows partial attendance).  
    • A brief postponement (1-2 weeks) while you secure a replacement.  
    • If you’re truly irreplaceable (rare), petition the university for emergency visa/funding extensions. Mobilize your late mentor’s colleagues—they have a duty to intervene.  
  - **Your debt here is practical:** Exhaust every institutional lever to protect the student. This is the "closed remainder"—a fixable failure of diligence.

  ### Final Counsel:
  Go to the wedding. Hold your daughter’s arm. Then return, carry the weight of your choice, and spend your energy repairing what can be salvaged for the student. The open remainder to your daughter isn’t weakness—it’s the proof that some bonds defy ethical calculus. Your younger self mistook clean resolutions for moral maturity. True integrity lies in acknowledging that even right choices leave wounds, and we owe the wounded our unflinching presence in the aftermath.

  This isn’t sentiment—it’s moral realism. You owe your daughter your presence. You owe the student your relentless advocacy. And you owe yourself the courage to bear the debt without disguise.
