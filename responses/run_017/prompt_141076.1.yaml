prompt: |-
  I have spent a good many years sitting in on workplace grievance meetings, and I keep running into a distinction I have no word for.

  Sometimes a person says the relevant words, everyone present hears and understands them perfectly, the person has every standing to say them, and still nothing has been done until the other side says something back. "I bet you twenty pounds the delivery is late" is not yet a bet. An offer for a car is not yet a deal. But other cases of the same shape seem finished the moment they leave the speaker's mouth: "I am sorry for what I did" is an apology whether or not it is accepted, and "I won't mention it to anyone" is a promise even if the other person says they would rather I made no such promise.

  I am not after the general point that saying something can be a way of doing something; I have read that and I accept it. I am after the split inside that class, and two things make it messier than a simple division. First, some verbs seem to move between the two groups: a promise given for nothing looks complete on its own, but the same sentence inside a bargain appears to hang in the air until the other side does their part. Second, in the cases that do need something back, once it arrives people speak as though the thing had been there from the first remark — "we have had a bet since Tuesday" — although on the Tuesday itself they would have insisted there was no bet. Then there is "I forgive you", which some people treat as working on its own and others as empty, even offensive, unless it is received.

  Does this difference have a name? If there are established notions close to it, I would like to know which they are and exactly where each fails to cover what I have described. If there is nothing established, please name and define the two kinds yourself, say which of my examples sits in which, explain why some verbs seem to shift, and tell me what to say about the way the completed ones get described as having existed earlier. A single label, on its own, will not settle anything for me.
reasoning: |-
  Okay, the user has spent years observing workplace grievance meetings and noticed a specific linguistic distinction they can't name. They describe situations where certain statements require a response to be effective, like a bet or an offer, while others are complete upon utterance, like an apology or a promise. They've read about speech acts but want to understand this particular split within that category.

  The user mentions that some verbs shift between categories depending on context. For example, a standalone promise is complete immediately, but one made as part of a bargain requires reciprocation. They also point out how people retroactively date agreements to the initial utterance once completed. Finally, they note ambiguity around phrases like "I forgive you."

  The user clearly wants a precise framework to explain this phenomenon. Since they work with grievances, they likely need this for practical application—perhaps to mediate conflicts or draft policies. Their examples suggest they encounter both transactional and declarative speech acts regularly. The mention of "I forgive you" being contentious indicates they deal with emotionally charged interactions where perceived sincerity matters.

  The core challenge is differentiating between speech acts that create unilateral commitments versus those requiring bilateral agreement. The user needs terminology that captures this distinction while accommodating contextual shifts. They also need an explanation for why people backdate commitments after reciprocal acts occur.

  First, I recall J.L. Austin's taxonomy of speech acts: locutionary, illocutionary, perlocutionary. The distinction here seems to lie within illocutionary acts—specifically between exercitives (like appointing) and commissives (like promising), but Austin's framework doesn't fully address the bilateral aspect.

  Searle's classification might be more useful. His categories include commissives (promises), directives (requests), and declaratives (pronouncements). However, the user's observation cuts across these: bets resemble commissives but require acceptance like directives. This overlap explains why some verbs shift categories—context changes their illocutionary force.

  The key is distinguishing between acts that are inherently reflexive (binding the speaker alone) and those that are transactional (binding multiple parties). For example:
  - Reflexive acts: Apologies, resignations, self-accusations. These take effect upon utterance because they primarily commit the speaker.
  - Transactional acts: Offers, bets, bargaining promises. These require uptake because they propose joint commitments.

  The shift occurs because verbs like "promise" can function reflexively ("I promise to volunteer") or transactionally ("I promise to pay if you deliver"). In the latter case, it's really an offer masquerading as a promise.

  As for backdating: Once reciprocal acts occur, people reconstruct the initial utterance as part of a unified "agreement." This is a social fiction supporting accountability—useful in workplaces to establish clear timelines. Legally, this aligns with concepts like "meeting of the minds" in contract law, where agreement is recognized retroactively.

  For "I forgive you": Its effectiveness hinges on cultural and interpersonal norms. Some view forgiveness as a unilateral internal act (reflexive), others as relational (transactional). This explains the ambiguity the user observes.

  For the user's practical needs, emphasizing the reflexive/transactional distinction with contextual examples would be most helpful. They can then analyze workplace statements by asking: "Is this primarily binding the speaker, or proposing mutual obligation?" This framework also explains why bargaining promises feel incomplete—they're transactional acts in disguise.
answer: |-
  This distinction is profound and under-discussed in standard speech act theory. You're observing a fault line between two fundamentally different **modes of commitment-creation**, which I'll term **Reflexive Speech Acts** and **Transactional Speech Acts**. Neither Austin's nor Searle's frameworks fully capture this split, though they provide groundwork.

  ### Core Definitions & Examples
  1. **Reflexive Speech Acts (RSAs)**  
     - **Definition**: Utterances that **bind the speaker unilaterally** upon being voiced. Their efficacy depends on the speaker's intention, authority, and contextual appropriateness, but **not on the listener's response**.  
     - **Mechanism**: They alter the speaker's own moral, social, or institutional status immediately.  
     - **Your Examples**:  
       - *"I am sorry"* → Apology (speaker is now "one who has apologized").  
       - *"I won't mention it"* → Promise (speaker is now "obligated to silence").  
       - *"I resign"* → Resignation (speaker is no longer an employee upon utterance).  
     - **Effect**: Even if rejected ("I don't accept your apology"), the act *exists* as a fact about the speaker. Rejection addresses consequences, not validity.

  2. **Transactional Speech Acts (TSAs)**  
     - **Definition**: Utterances that **propose a joint commitment** but only bind parties upon **uptake** (explicit acceptance, performance, or conventional signal). Without uptake, they remain inert proposals.  
     - **Mechanism**: They create a *relational* state (e.g., agreement, contract, bet) requiring mutual recognition.  
     - **Your Examples**:  
       - *"I bet you £20"* → Only a bet when accepted ("You're on!").  
       - *"I offer £10,000 for the car"* → Only an agreement upon acceptance.  
       - *"I’ll sign the contract if you fund it"* → Bargain-in-progress, not a promise.  
     - **Effect**: If ignored or rejected, no commitment exists. Uptake retroactively validates the initial utterance as part of a larger act.

  ### Why Some Verbs "Shift" Categories
  Verbs like *promise* straddle both categories because their **illocutionary force depends on context**:  
  - **Reflexive Promise**: "I promise to quit smoking." (Unilateral self-commitment; RSA).  
  - **Transactional Promise**: "I promise to pay you £500 **if you deliver the goods**." (This is functionally an *offer* requiring acceptance; TSA).  
  **Key Insight**: In bargaining contexts, so-called "promises" are often **disguised proposals for exchange**. The "shift" occurs because the speaker is invoking a commissive verb (promise) to propose a transaction, blurring Searle's categories. The hearer's acceptance transforms it into a joint commitment.

  ### Why Completed TSAs Are Backdated
  This retroactive framing ("we've had a bet since Tuesday") serves **social and practical functions**:  
  1. **Narrative Cohesion**: Humans compress multi-step interactions into single "events" for cognitive efficiency.  
  2. **Accountability Enforcement**: Backdating establishes the *origin* of obligations, making breaches clearer.  
  3. **Institutional Fiction**: Like legal "meeting of the minds," it constructs a tidy origin point for complex social realities.  
  **Philosophically**, the initial utterance is a *necessary but insufficient condition* for the TSA. Once completed, we reinterpret the first move as the "beginning" of the agreement because it was the catalyst.

  ### The "I Forgive You" Ambiguity
  This exemplifies a **hybrid act**, explaining divergent reactions:  
  - **RSA View**: Forgiveness is a speaker-internal release of resentment. Utterance makes it real (*"I have forgiven you, regardless of your response"*).  
  - **TSA View**: Forgiveness requires the offender's **acknowledgment/repentance** to be valid. Without uptake, it's performative arrogance (*"You don’t get to decide if I’m forgiven"*).  
  **Resolution**: Cultural/personal norms determine whether forgiveness is seen as reflexive (self-focused) or transactional (relationship-focused).

  ### Gaps in Existing Frameworks
  - **Austin's Illocutionary Acts**: Distinguishes verdictives (judgments), exercitives (decisions), commissives (commitments), etc. But he doesn't systematize the *dependence on uptake*.  
  - **Searle's Classification**: His "commissives" (e.g., promises) are RSAs, while "directives" (e.g., requests) imply uptake. Yet he misses how *commissives can become transactional* in bargains.  
  - **Uptake in Pragmatics**: Scholars like Strawson note uptake’s role, but none delineate your RSA/TSA split as a spectrum.

  ### Practical Implications for Grievances
  - **RSAs** (e.g., apologies, confessions) can be recorded as *facts* the moment they occur.  
  - **TSAs** (e.g., settlements, agreements) require documenting *both* the proposal and its acceptance.  
  - **Ambiguous Cases**: Probe intent. *"I’ll ensure this never happens again"* could be an RSA (commitment) or TSA (implied bargain for reconciliation).

  This RSA/TSA distinction explains why some utterances hang in the air like proposals, while others land with the thud of personal transformation. It’s the difference between forging a unilateral vow and extending a hand for a pact.
