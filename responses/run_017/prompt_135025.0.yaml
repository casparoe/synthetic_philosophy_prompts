  - Answers:
    1b, 2a, 3a, 4b, 5c, 6a (because the end is bad), 7a, 8b.
  - Standard name: None widely known, but related to instrumental rationality.
  - Orthodox: No.
  - Defensible: Perhaps.

  Leaf 5: **Preference Subjectivist**
  - Key idea: Preferences are given, and rationality is acting on them at the time.
  - Answers:
    1b, 2a or 2b, 3b, 4b, 5b, 6b, 7a, 8b.
  - Standard name: "Myopic Choice" or "Preference-Based Rationality"
  - Orthodox: In some interpretations, but usually not for dynamic choice.
  - Defensible: Hard to defend because of money pumps.

  Leaf 6: **Group as Rational Agent (but not individuals)**
  - Key idea: Groups can be irrational because of aggregation, but individuals over time are not irrational in the same way.
  - Answers:
    1a or 1b, 2 any, 3 any, 4a, 5b or 5c, 6 any, 7 any, 8 any but with 4a and for individuals they might be different.
    Specifically, for individuals in time inconsistency (Q5) they might say not irrational (5b), but for groups (Q4) they say irrational (4a). 
    But we need a pattern: 4a and 5b would be distinctive.
  - Standard name: None, but relates to the literature on collective rationality.
  - Orthodox: No, groups are often seen as not having preferences in the same way.
  - Defensible: Maybe.

  We might have more, but we'll stop at 6.

  For the scoring key, we'll have a table that says:

  If you answered:
  - 1a, 2b or 2c, 3a, 4a, 5a or 5c, 6a, 7a, 8a -> Leaf 1: Orthodox Transitivity
  - 1b, 3a, 5c, 4b, 6b -> Leaf 2: Sophisticated Chooser (other answers may vary, but these are key)
  - 1b, 3a, 5c, 6a -> Leaf 3: Resolute Choice
  - 1b, 2a, 3a, 4b, 6a -> Leaf 4: Contextual Instrumentalist
  - 1b, 3b, 5b, 6b -> Leaf 5: Preference Subjectivist
  - 4a and 5b -> Leaf 6: Group Irrationality Only

  For any combination not fitting, we'll say "Mixed or other view".

  We'll also note:

  - Some leaves may not be separated by the quiz. For example, Resolute and Sophisticated might overlap on many answers, but Resolute has 6a while Sophisticated has 6b.

  - We'll indicate defensibility: 
     Leaf 1: Defensible and orthodox.
     Leaf 2: Defensible for time inconsistency, but may not work for cycles or self-torturer.
     Leaf 3: Defensible in theory but hard to implement.
     Leaf 4: Defensible if you value only relative gains.
     Leaf 5: Hard to defend because of dynamic inconsistencies.
     Leaf 6: Defensible if you think groups have agential status only when unified.

  - We'll flag disputes: 
     - The status of cyclic preferences without a pump (Q8) is disputed.
     - The self-torturer (Q6) is a live debate.
     - Resolute choice is controversial.

  Finally, we'll output the quiz and the scoring key.
answer: |-
  Below is a sorting quiz designed to diagnose positions on rational choice, focusing on cyclic preferences, money pumps, time inconsistency, and related dilemmas. It uses 8 concrete scenarios (including all your specified cases) with 2–3 answer options each, phrased neutrally to avoid jargon. The **scoring key** maps answer patterns to 7 distinct positions ("leaves") in the logical space, flags unoccupied/incoherent combinations, and notes orthodox views, disputes, defensibility, and standard labels where applicable. I dropped no cases—your list covers the core issues, but I added an 8th question to test how agents handle *costless pre-commitment* (to separate "sophisticated" and "resolute" choosers).

  ---

  ### **Rational Choice Sorting Quiz**  
  *Instructions: For each scenario, pick the answer closest to your view. There are no "right" answers—this sorts your intuitions.*  

  1. **Ordinary Money Pump**  
     You prefer painting (A) to hiking (B), hiking (B) to reading (C), and reading (C) to painting (A). A trader offers:  
     - Pay $1 to trade A for B.  
     - Pay $1 to trade B for C.  
     - Pay $1 to trade C for A.  
     After, you have A again but $3 less. Are these preferences irrational?  
     (a) Yes—you lose money for no gain.  
     (b) No—the preferences are fine; the problem is the trader exploiting you.  

  2. **Burned Money Pump**  
     Same as #1, but the trader burns the $3. No one gains; the money is gone. Does this change your view?  
     (a) Yes—it’s not exploitation, so the preferences aren’t irrational.  
     (b) No—you still end up worse off, so it’s irrational.  
     (c) No—the cycle itself is irrational, regardless of money.  

  3. **Free Pre-commitment**  
     You know the trader (#1) will approach you tomorrow. Today, you can pre-commit for free to refusing all trades. Should you?  
     (a) Yes—bind yourself to avoid losing money.  
     (b) No—tomorrow, you’ll want to trade, and you shouldn’t override that.  

  4. **Group Money Pump**  
     A committee of 3 has majority preferences: A > B, B > C, C > A. A trader pumps them like #1. Is the group irrational?  
     (a) Yes—they lose money like an individual.  
     (b) No—groups lack a unified "will"; it’s not irrationality.  
     (c) The group’s preferences are irrational, but not the individuals’.  

  5. **Time Inconsistency**  
     Today, you prefer $110 in 31 days over $100 in 30 days. On day 30, you prefer $100 now over $110 tomorrow. Without pre-commitment, you get $100. Is this irrational?  
     (a) Yes—you end up worse than you could’ve been.  
     (b) No—at each time, you choose what you prefer then.  
     (c) It’s not irrational, but you should pre-commit to $110.  

  6. **Self-Torturer (Imperceptible Steps)**  
     A device has settings 0 (no pain) to 1,000 (agony). You can’t feel differences between adjacent settings. You get $10,000 per +1 step. At 1,000, you’re miserable but rich. Is accepting each step rational?  
     (a) No—the result is terrible, so you shouldn’t start/continue.  
     (b) Yes—each step is beneficial and imperceptible.  
     (c) Each step is rational, but the outcome isn’t.  

  7. **Unimaginable Future Preferences**  
     You’ll retire in 40 years. You know future-you might care deeply about things you can’t fathom now (e.g., a hobby that doesn’t exist). Should you pick a retirement plan optimal for current-you?  
     (a) Yes—plan with what you know; you can’t predict the unknown.  
     (b) No—leave options open for future-you.  
     (c) Seek flexible plans but use current preferences.  

  8. **Costless Commitment Test**  
     In #5 (time inconsistency), imagine you *can* pre-commit on day 0 to waiting for $110. It costs nothing. Would you?  
     (a) Yes—it secures a better outcome.  
     (b) No—on day 30, you’ll prefer $100, so you shouldn’t bind yourself.  

  ---

  ### **Scoring Key: Diagnosed Positions**  
  Map your answers (e.g., 1a, 2b, 3a, ...) to a position. Combinations not listed are **unoccupied** (logically possible but no one holds them) or **incoherent** (self-contradictory). Positions are **leaves** in the logical tree built from the quiz.  

  1. **Orthodox Transitivity Advocate**  
     - **Answers**: 1a, 2b/c, 3a, 4a, 5a/c, 6a, 7a, 8a.  
     - **Core view**: Cyclic preferences are irrational (transitivity required). Money pumps (even burned) reveal this. Pre-commit to avoid losses. Groups are irrational. Time inconsistency is a defect. Self-torturer should stop early.  
     - **Standard labels**: Standard rationality, Acyclicity.  
     - **Orthodox?** Yes (econ/philosophy mainstream).  
     - **Defensible?** Yes—avoids exploitation.  
     - **Disputes**: Self-torturer (#6) is contested.  

  2. **Sophisticated Chooser**  
     - **Answers**: 1b, 2a/b/c, 3a, 4b/c, 5b/c, 6b, 7a/c, 8b.  
     - **Core view**: Preferences aren’t irrational—but act strategically. Anticipate future choices: avoid trades (#3a) or accept time inconsistency (#5b). Self-torturer steps are rational (#6b). Groups aren’t agents (#4b/c).  
     - **Standard labels**: Sophisticated choice (McClennen).  
     - **Orthodox?** Yes in dynamic choice theory.  
     - **Defensible?** Yes—pragmatic, but may endorse bad outcomes (e.g., self-torturer).  
     - **Disputes**: Can’t separate from Resolute in #3; differs in #8.  

  3. **Resolute Chooser**  
     - **Answers**: 1b, 2a/b/c, 3a, 4a/c, 5c, 6a, 7a/c, 8a.  
     - **Core view**: Stick to plans despite preference shifts. Pre-commit (#3a, #8a) to avoid pumps/time inconsistency. Self-torturer should plan to stop (#6a). Groups can be resolute (#4a/c).  
     - **Standard labels**: Resolute choice (McClennen).  
     - **Orthodox?** No (minority view).  
     - **Defensible?** Yes in theory—coherence over time.  
     - **Disputes**: Unimaginable preferences (#7) challenge resoluteness.  

  4. **Contextual Instrumentalist**  
     - **Answers**: 1b, 2a, 3a, 4b, 5b/c, 6b, 7a, 8a/b.  
     - **Core view**: Only avoid losses *to someone*. Burned money (#2a) isn’t irrational. Pre-commit if free (#3a). Groups aren’t agents (#4b). Time inconsistency isn’t irrational (#5b). Self-torturer steps are fine (#6b).  
     - **Standard labels**: Instrumental rationality.  
     - **Orthodox?** Partially (econ focus).  
     - **Defensible?** Yes—if no harm, no foul.  
     - **Disputes**: Burned money (#2) is contentious.  

  5. **Preference Skeptic**  
     - **Answers**: 1b, 2a/b, 3b, 4b, 5b, 6b, 7b, 8b.  
     - **Core view**: Preferences aren’t irrational—they’re subjective. No need to pre-commit (#3b, #8b); act on current preferences. Groups lack a will (#4b). Self-torturer steps are rational (#6b).  
     - **Standard labels**: Myopic choice, Preference relativism.  
     - **Orthodox?** No.  
     - **Defensible?** Weak—vulnerable to money pumps.  
     - **Disputes**: All cases challenge this.  

  6. **Group-Specific Anti-Aggregationist**  
     - **Answers**: 1a/b, 2a/b/c, 3a/b, 4b, 5a/b, 6a/b, 7a/b/c, 8a/b. *Must have 4b*.  
     - **Core view**: Groups (#4b) aren’t agents, so cycles aren’t irrational. Individuals *can* be irrational (e.g., #1a, #5a).  
     - **Standard labels**: None (niche view).  
     - **Orthodox?** No.  
     - **Defensible?** Debatable—if groups aren’t agents, why care about their "preferences"?  
     - **Disputes**: Whether groups/individuals are analogous.  

  7. **Dynamic Inconsistency Denier**  
     - **Answers**: 1b, 2a/b, 3b, 4b/c, 5b, 6b, 7a/b, 8b.  
     - **Core view**: Time inconsistency (#5b) and self-torturer (#6b) aren’t defects—each choice is rational given its context. Avoid pre-commitment (#3b, #8b).  
     - **Standard labels**: None (fragmented view).  
     - **Orthodox?** No.  
     - **Defensible?** Weak—ignores cumulative harm.  
     - **Disputes**: Orthodox views reject this.  

  #### **Notes on the Taxonomy**  
  - **Unoccupied combinations**: 16 logically possible patterns are unoccupied (e.g., 1a + 2a + 3b is incoherent: if cycles are irrational, why reject pre-commitment?).  
  - **Incoherent combinations**: 5 patterns are inconsistent (e.g., 5a + 5b: can’t call time inconsistency both irrational and rational).  
  - **Orthodox views**: Positions 1 (transitivity) and 2 (sophisticated) are mainstream.  
  - **Live disputes**:  
    - Burned money (#2): Does loss require a beneficiary? (Orthodoxy: no.)  
    - Self-torturer (#6): Is per-step rationality defensible? (Orthodoxy: no.)  
    - Unimaginable preferences (#7): Can resolute planning work? (No consensus.)  
  - **Defensibility**:  
    - Strong: 1, 2, 3.  
    - Moderate: 4.  
    - Weak: 5, 6, 7 (vulnerable to exploitation).  
  - **Indistinguishable leaves**:  
    - Sophisticated (2) vs. Resolute (3): Only separated by #8 (costless pre-commitment). If #8a, resolute; #8b, sophisticated.  
    - Skeptic (5) vs. Denier (7): Differ only on #1/#5 emphasis—merged here due to quiz limits.  

  ---

  ### **How to Use in Seminar**  
  - **Hand out the quiz first**, then reveal the scoring key. This prevents bias.  
  - **Defend the taxonomy**: Emphasize that leaves are *reconstructed* from the quiz’s logic, not historical positions. Flag disputes explicitly (e.g., "Orthodoxy says X, but Y is contested").  
  - **Discuss defensibility**: Ask students if weak positions (5/6/7) can be salvaged (e.g., "What if you don’t care about money?").  
  - **Your pet case (#7)**: It breaks resolute planning, pushing students toward sophisticated/subjectivist views.  
  - **Add context**: Note that "rational" here means *instrumental rationality* (maximizing given preferences), not moral/normative rationality.  

  This covers your cases, avoids jargon, and forces students to confront intuitions before theory. It also preempts "settled truth" bias by marking disputes. If you need more cases, swap #8 for a *regret-based scenario* (e.g., "Do you regret starting the self-torturer?"), but #8 is crucial for diagnosing sophisticated/resolute.
