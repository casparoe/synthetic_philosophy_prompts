  Quiz: Diagnosing Your Views on Rational Choice

  Instructions: For each scenario, choose the answer that best reflects your view. There are no right or wrong answers; this is to help understand different perspectives.

  1. **Ordinary Money Pump**: You prefer A to B, B to C, and C to A. A trader offers you a series of trades: Trade 1: Pay $1 to trade A for B. Trade 2: Pay $1 to trade B for C. Trade 3: Pay $1 to trade C for A. After these, you have A again but $3 poorer. Are these preferences irrational?
     (a) Yes, because you can be pumped for money.
     (b) No, because the preferences are about the options without the trading process.

  2. **Money Burned**: Same as above, but the trader burns the $3 so no one gains. Does this change your view on whether the preferences are irrational?
     (a) Yes, because no one profits, so it's not exploitative.
     (b) No, because you still end up with the same thing but with less money.
     (c) No, because the cycle itself is irrational, regardless of money.

  3. **Pre-commitment**: You can pre-commit for free to refusing all trades in the money pump scenario. Should you?
     (a) Yes, to avoid losing money.
     (b) No, because at each step I will want to trade and I don't want to bind myself.
     (c) It depends on whether I can trust my future self.

  4. **Group Cyclic Preferences**: A committee has majority preferences: A>B, B>C, C>A. The group is offered the same money pump. Is the group irrational?
     (a) Yes, because they end up worse off.
     (b) No, because a group isn't a single agent.
     (c) The group's preferences are irrational, but that doesn't mean the individuals are.

  5. **Time Inconsistency**: Today, you prefer $110 in 31 days over $100 in 30 days. But on day 30, you prefer $100 immediately over $110 in 1 day. Without pre-commitment, you get $100 on day 30, but with pre-commitment on day 0, you could get $110. Is this preference irrational?
     (a) Yes, because you end up worse off.
     (b) No, because at each time you are making the best choice.
     (c) It's not irrational, but you should pre-commit.

  6. **Self-Torturer**: You can increase a setting from 0 to 1000, with each step imperceptible and you get $10,000 per step. At 1000, it's extremely painful. Is it rational to accept each step?
     (a) No, because the cumulative effect is terrible.
     (b) Yes, because each step is imperceptible and you gain money.
     (c) Each step is rational, but ending up at 1000 is irrational.

  7. **Unimaginable Future Preferences**: You are offered a retirement plan optimal for your current preferences, but in old age you might care about things you can't imagine now. Should you adopt it?
     (a) Yes, because you can only plan on current preferences.
     (b) No, because it might be terrible for your future self, so leave options open.
     (c) Try to gather more information.

  8. **Cycle without Pump**: You have cyclic preferences (A>B, B>C, C>A) but never face a money pump. When choosing from pairs, you choose consistently with your preferences. In a choice between A, B, and C, you might choose arbitrarily. Are these preferences irrational?
