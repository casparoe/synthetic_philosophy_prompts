  Here’s a concrete principle distilled from your intuitions, designed to resolve contradictions while preserving core judgments. **The core conflict isn’t "people vs. outcomes," but *purpose*:**  

  ### The Principle of Deliberative Legitimacy
  **A lottery is legitimate when its purpose is to:**  
  1. **Select an impartial group for deliberation** (e.g., juries, assemblies),  
  2. **Distribute burdens fairly** (e.g., conscription, audits),  
  3. **Break ties after judgment is exhausted** (e.g., tied elections), **OR**  
  4. **Prevent factional capture** (e.g., narrowing candidate pools).  
  **It is illegitimate when it:**  
  - **Replaces necessary expertise** (e.g., president, judges),  
  - **Bypasses deliberation** (e.g., prize winners),  
  - **Or creates unaccountable power** (e.g., lifetime legislators).  

  ---

  ### How It Handles Your Cases  
  | **Case** | **Verdict** | **Reason** |  
  |----------|-------------|------------|  
  | **Trial jury** | Fine | *Impartial group for deliberation.* |  
  | **Jury duty (mandatory)** | Fine | *Fair burden distribution.* |  
  | **Citizen assembly** | Fine (override your doubt) | *Deliberative group on ONE issue (limited scope).* |  
  | **President by lot** | Insane | *Replaces expertise; solo power.* |  
  | **Legislative chamber by lot** | Nervous but valid | *Deliberative group (if large/collective).* |  
  | **Term limits (mayor)** | Good | *Prevents entrenched power.* |  
  | **Career legislators** | Bad | *Unaccountable power.* |  
  | **Career civil servants** | Good | *Expertise required; not sovereign power.* |  
  | **Life-appointed judges** | Good | *Expertise + insulation from politics.* |  
  | **Elected judges** | Bad | *Mixes expertise with factional politics.* |  
  | **Hereditary rule** | Bad | *Replaces expertise/judgment with birthright.* |  
  | **Stratified quotas** | Necessary | *Ensures deliberation includes marginalized voices (anti-factional).* |  
  | **Random audits/screening** | Fine | *Fair burden distribution.* |  
  | **Conscription (just war)** | Fine | *Fair burden.* |  
  | **Prize jury by lot** | Great | *Impartial deliberative group.* |  
  | **Prize winner by lot** | Vile | *Bypasses deliberation/judgment.* |  
  | **Tied election by lot** | Fine | *Tiebreaker after judgment exhausted.* |  

  **Key Conflicts Resolved:**  
  - **Citizen Assembly:** Your "sinking feeling" likely stems from fear of *bypassing expertise*. But the principle validates it because it’s a **deliberative group** (like a jury) on a **single issue**, not a permanent role.  
  - **Stratified Quotas:** "Cheating" vs. "necessary" is resolved by the **anti-faction** clause. Quotas ensure factions don’t dominate deliberation.  
  - **Civil Servants vs. Career Legislators:** Civil servants provide **expertise without sovereign power**; legislators wield power without accountability. The lottery council *needs* the bureaucracy.  
  - **Prize Jury vs. Winner:** Jury deliberates; winner by lot bypasses deliberation.  

  ---

  ### Where You Must Surrender a Judgment  
  1. **Elected Judges:** Your objection to elected judges **must stand** (they mix politics with expertise). But your defense of life-appointed judges **contradicts** your hatred of career legislators. **Overturn:** Career legislators are bad, but **life-appointed judges are defensible** because:  
     - Judges interpret rules, not create them.  
     - They require specialized expertise, insulated from popular pressure.  
     - *Admit the tension:* Your city might need term-limited judges (e.g., 15 years) to balance accountability/expertise.  

  2. **Citizen Assembly:** Your gut says "nervous"; the principle says **valid**. Keep it, but *show* the risks (e.g., manipulation by facilitators, complexity overload).  

  ---

  ### Verdicts on New Cases  
  1. **Standing second chamber by lot (blocking only):** **Valid.** Deliberative group with limited power (no initiation).  
  2. **Chamber by lot → Referendum:** **Valid.** Agenda-setting by a deliberative group, final say by populace.  
  3. **Lottery to narrow 40 candidates → 4:** **Valid.** Anti-faction tool (prevents organized blocs).  
  4. **School board by lot (6-year terms):** **Invalid.** Curriculum requires pedagogical expertise; not pure deliberation.  
  5. **Publisher breaks deadlock by lot:** **Vile.** Bypasses editorial judgment (like prize winner).  
  6. **Lottery restricted to top exam decile:** **Invalid.** Corrupts impartiality; becomes quasi-meritocratic faction.  

  ---

  ### Is Your City Coherent?  
  **Yes, but the bureaucracy is the key.**  
  - **The Principle Says:** A lottery council **must** rely on non-lottery institutions:  
    1. **Expert civil servants** (to provide continuity/data),  
    2. **Independent judges** (to arbitrate rules),  
    3. **Direct democracy** (referendums for major changes).  
  - **The Conflict:** Your protagonist should argue that **lotteries prevent corruption, but expertise prevents chaos.** The tension between transient councillors and permanent officials *is* the drama:  
    - Civil servants could manipulate novice councillors.  
    - Councillors could demand radical, poorly informed changes.  
  - **Your Insight is Correct:** The "interesting part" **is** the bureaucracy. The lottery council is a lid on a pressure cooker — the steam is the state machinery.  

  ---

  ### Final Recommendation  
  **Have your protagonist argue this:**  
  > "Lotteries prevent power from congealing in the hands of factions or dynasties. But they only work when they *force* people to deliberate — jurors, assemblies, even prize committees. They fail when they replace skill with chance, or when they bypass debate. And they only survive if the gears of the state — the judges, the civil servants, the laws — are built to outlast any one of us."  

  **Sacrifice:** Defend life-appointed judges (or long terms), but impose strict oversight. Abandon elected judges entirely. Accept citizen assemblies *with safeguards*. Reject any lottery that selects outcomes (prizes) or solo executives (presidents). Let the bureaucracy be the dark star the council orbits.
