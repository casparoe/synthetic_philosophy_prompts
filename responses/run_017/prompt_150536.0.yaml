  Okay, let me start by really understanding the user's dilemma. They're writing a novel where a city uses sortition for its governing council, but they're struggling with inconsistent gut feelings about when lotteries are appropriate. The user listed various scenarios and their reactions, trying to find a unifying principle. The protagonist needs a coherent argument, so the user wants to resolve these contradictions.

  First, I need to parse the user's examples. They accept trial juries and citizen assemblies but feel uneasy about a lottery-selected president. They also have strong opinions about career politicians vs. lifelong civil servants. The user's tentative principle is that lotteries should select people, not outcomes, but exceptions like tied elections complicate this.

  Looking at the patterns, I notice the user is comfortable with lotteries for group selection when the group is meant to be representative and impartial. Juries, assemblies, and prize juries all involve groups making decisions after deliberation. But when a single person or direct outcome is chosen by lot, like a president or prize winner, it feels wrong. That distinction seems key.

  The user also values expertise in certain roles. Lifelong civil servants and judges are fine because they build specialized knowledge. Elected judges, however, mix political pressure with judicial duty, which feels unstable. The objection to hereditary rule isn't just about randomness but legitimacy—birthright vs. competence.

  Stratified quotas present a conflict. The user thinks they're necessary for representation but also "cheating" the randomness. This ties into the antifaction role of lotteries. If the goal is to break factional power, quotas might reintroduce group identities, but if representation is the priority, they're essential. The user needs to decide which goal matters more.

  Now, for the deeper needs. The user is a novelist needing internal consistency for their protagonist's arguments. They might also want the fictional city to feel plausible. The bureaucracy's role under a lottery council is a potential plot point. The user might be exploring how institutions balance democracy with expertise and stability.

  The principle I'm considering has three parts: group decision-making, limited scope, and antifaction purpose. This covers most cases. Citizen assemblies work because they're groups with a specific mandate. A lottery president fails because it's a solo role. Tied elections are acceptable as a last-resort tiebreaker after judgment is exhausted.

  Contradictions arise with the literary prize. The user hates selecting the winner by lot but accepts a jury. The principle explains this: the jury is a group using judgment, while the winner by lot skips deliberation. The user might need to accept that their discomfort with career legislators clashes with accepting career civil servants. Legislators need accountability, while civil servants need expertise without political pressure.

  For new cases: a sortition second chamber with veto power could work if it's a large group with a limited role. A chamber proposing referendums might be acceptable as agenda-setting rather than final decisions. Using a lottery to narrow candidates before an election serves an antifaction purpose. A sortition school board is tricky—curriculum decisions require expertise, so maybe not. A publisher using lot for a manuscript is like the prize winner, so probably not. Restricting the lottery pool to top exam scorers mixes merit with randomness, which might undermine both.

  On the city's coherence: a lottery council needs a stable bureaucracy for continuity. The civil servants provide institutional memory while the council brings fresh perspectives. This tension could be the novel's core, exploring how these systems interact and where power truly lies.

  The user's insight about bureaucracy might be spot-on. The lottery council's effectiveness depends on the officials implementing policies. Conflict could arise between transient councillors and entrenched bureaucrats, creating rich narrative tension. Ensuring the bureaucracy remains accountable without being politicized is crucial for the system's stability.
