  Hmm, the Maraval Charter is brilliantly designed to stress-test amendment theories. Key pressure points: Article 17's self-consuming authorization (using a rule to destroy itself), the 2060 automatic lapse creating a self-executing temporal change, Article 18's self-referential interpretive supremacy, and the substantive limit in Article 15 with no enforcement mechanism. The 2048 sequence is a chain reaction of self-reference - using Art 17 to gut the amendment framework, then having a court appointed under that new framework invalidate its own origin. 

  First, let's map the indispensable distinctions any theory must handle. Validity-vs-effects is non-negotiable - Maraval forces us to ask whether an invalid amendment can nonetheless spawn valid institutions (like the 2048 court). The amendment/replacement boundary matters because if the 2048 changes were revolutionary, the court's authority vanishes. Self-entrenchment (Art 13) vs self-execution (Art 14) shows different temporal mechanisms need modeling. And procedural vs substantive limits (Arts 12/15) pose separate validity questions when breached.

  The paradoxes are even juicier. Article 17 creates a "suicide pact" problem: when a rule authorizes its own termination, does the successor rule derive validity from the old system or exist ex nihilo? Then there's Article 18's liar-like self-validation - if the Assembly can interpret its own interpretive supremacy, does that create an infinite regress? And the phantom limit in Article 15: when a constitution prohibits something but provides no enforcement, is that a legal rule or mere parchment?

  For requirements, determinacy is tricky but essential - Maraval's court needs a clear 2055 ruling. But insisting on purely textual derivation seems impossible given Art 18's self-reference. We must accept some extra-textual anchors (like efficacy or acceptance) to avoid infinite loops. Binding self-entrenchment (Art 13) clashes with plenary amendment power - this tension probably can't be fully resolved, only managed procedurally.

  The authorization gap is indeed the crux. When Art 17 is used then repealed, the new amendment rule hangs in a validity void. A theory must either (1) allow transitional validity despite later invalidation, or (2) treat such exercises as revolutionary breaks. Neither is perfect, but (1) better preserves continuity.

  For the 2055 ruling, I'd argue the court must uphold the 2048 changes despite Art 13, because Art 17's specific exception overrides general entrenchment. Otherwise legal chaos ensues. But this requires accepting that amendment powers can partially suicide - Art 17 died validly performing its function.

  On real-world parallels, the US Senate suffrage entrenchment is precisely the kind of ghost limit Maraval exposes. A good theory must say whether such riders are self-binding or mere political warnings.

  Kelsen would struggle with Maraval's self-destruction - basic norms can't contemplate their own termination. Hart's rule of recognition might handle it better via official acceptance, but at the cost of determinacy. Sovereign legislature views implode on Art 13's entrenchment.

  The user's deepest need is likely: "Give me a framework that doesn't look away when self-reference gets pathological." So the requirements list must stare directly at the abyss of self-amendment and still deliver usable answers.
answer: |-
  Here’s a requirements list for a theory of self-amending rules, distilled from Maraval’s paradoxes. Each requirement is grounded in a specific case or conceptual distinction the theory **must** resolve to be adequate. I’ll then flag contested desiderata and scorecard the major approaches.

  ---

  ### **Core Requirements (Non-Negotiable Distinctions)**
  1. **Amendment Validity vs. Acts Under Invalid Amendments**  
     *Case:* The 2055 court ruling on laws passed post-2048.  
     *Requirement:* The theory must distinguish between an amendment’s *legal validity* and the *legal effects of acts performed under it* if later invalidated. If the 2048 amendment was invalid, does the court (itself created under that amendment) lack authority to rule? Maraval forces this.

  2. **Amendment vs. Revolution (Continuity of Legal Order)**  
     *Case:* Assembly’s 2048 repeal of Arts. 13, 15, 17.  
     *Requirement:* Must provide criteria for when an amendment *replaces the foundation* of validity (revolution) versus operating *within* it. Key: Does the new rule derive authority from the old order, or assert *new* authority? Art. 17’s self-destruction tests this.

  3. **Self-Entrenchment vs. Self-Application**  
     *Case:* Art. 13 (unamendable Art. 12) vs. Art. 16 (amendments to Art. 12 take immediate effect).  
     *Requirement:* Must distinguish rules that *shield themselves* (Art. 13) from rules that *explicitly permit their own alteration* (Art. 16). A theory collapsing these cannot handle Art. 17’s override of Art. 13.

  4. **Procedural vs. Substantive Limits**  
     *Case:* Art. 15 (substantive limit: no abolishing suffrage) with no enforcement mechanism.  
     *Requirement:* Must account for whether substantive limits are *justiciable*, *political*, or *non-binding*. If amended away (as in 2048), was the limit a true legal constraint or mere aspiration?

  5. **Self-Executing Temporal Change**  
     *Case:* Art. 14’s automatic lapse in 2060.  
     *Requirement:* Must explain how a rule can *self-terminate* or *self-modify* without contemporary human action. Does this require a "timeless" rule of recognition?

  ---

  ### **Paradoxes to Dissolve (Not Dodge)**
  1. **The Self-Consuming Authorization (Art. 17)**  
     - *Problem:* Art. 17 authorizes its own destruction. If valid, does the *new* amendment rule (simple majority) derive authority from Art. 17 (now dead) or exist autonomously?  
     - *Requirement:* The theory must resolve the "authorization gap" when a rule validly terminates its own basis of validity.  
     - *Maraval 2055:* If the court invalidates 2048, what law governs 2048–2055? If it upholds 2048, how does Art. 17’s repeal not undermine the court’s own authority?

  2. **The Liar Paradox (Self-Referential Validity)**  
     - *Case:* Art. 18 ("Assembly interprets all amendments, including this one").  
     - *Requirement:* Must handle self-referential validity claims without infinite regress. Can Art. 18 authorize its own interpretation? If so, is it unfalsifiable?  
     - *Liar Variant:* An amendment stating "No amendment under Art. 12 is valid" – does this invalidate itself?

  ---

  ### **Desiderata vs. Prejudices**
  | **Claim** | **Verdict** | **Why** |
  |-----------|-------------|---------|
  | "Every case gets one determinate verdict" | **Genuine** | Maraval’s court *needs* a decision (e.g., uphold or void 2048). Legal systems demand resolvability. |
  | "Derivable from pre-existing rules alone" | **Prejudice** | Art. 18’s self-reference *requires* extra-textual anchors (e.g., official acceptance). Rules can’t bootstrap their own interpretation infinitely. |
  | "Must distinguish amendment from revolution" | **Genuine** | Critical for Maraval 2048: was this "legal" or a break in continuity? Affects all subsequent acts. |
  | "Amendment power = people’s constituent power" | **Prejudice** | Art. 14’s automatic change requires no popular action. A theory must work without romantic popular sovereignty. |
  | "Formal/Codeable" | **Genuine** | To handle Art. 14/16/17 interactions, the logic must be computationally tractable. |
  | "No unenacted unamendable principles" | **Genuine** | Art. 13’s entrenchment is *enacted*; importing "natural law" here dodges the textual paradox. |
  | "A rule can bind its future amendment" | **Contingent** | Art. 13 *tries* this, but Art. 17 overrides. The theory must say when self-entrenchment holds and when it doesn’t. |

  **Inconsistencies Found:**  
  1. **"Determinate verdict from rules alone" + "Rule can replace its validity criteria" → Contradiction**  
     - If a rule replaces its validity basis (like Art. 17), the "new" rule’s authority *cannot* derive solely from the old rules (which it destroyed). Requires extra-legal facts (efficacy, acceptance).  
  2. **"Binding self-entrenchment" + "Amendment power has no limits" → Contradiction**  
     - Art. 13 entrenches Art. 12, but Art. 17 is an *exception* to Art. 13. Is the amendment power plenary (implying no true entrenchment) or limited? Maraval shows both can’t be absolute.

  ---

  ### **The Exclusionary Requirement**
  - **"No gap in authorization when a rule self-destructs"** is indeed the heaviest lift.  
  - *Why?* If Art. 17’s exercise is valid, it annihilates its own foundation. The new simple-majority rule either:  
    (a) Derives validity from the *ghost* of Art. 17 (transitional validity), or  
    (b) Springs from a *revolutionary break*.  
  - *Your bet is right*: Without this, the theory cannot resolve Maraval 2048 or explain the court’s 2055 authority.

  ---

  ### **Is "Underdetermined" a Cop-Out?**
  - **Answer:** No – but only for *specific* gaps (e.g., Art. 15’s unenforceable limit).  
  - **For Maraval:** The court *must* decide 2048’s validity. "Underdetermined" fails requirement (i). A theory must force a choice:  
    - **Option 1:** Uphold 2048. Art. 17’s specific exception overrides Art. 13’s entrenchment. The new rule derives authority from the *completed act* of Art. 17.  
    - **Option 2:** Invalidate 2048. Art. 17 couldn’t amend Art. 12’s core. The Assembly’s post-2048 acts were revolutionary (but possibly legitimate via efficacy).  

  ---

  ### **Scorecard (One Paragraph Each)**
  - **Kelsen (Basic Norm):** Struggles with self-destruction (Art. 17) and automatic change (Art. 14). If the *Grundnorm* validates the 1951 Charter, how can it permit a rule (Art. 17) that destroys its own foundation? The 2048 amendment becomes a revolutionary act, but Kelsen can’t explain the court’s 2055 authority (traced to 2048).  
  - **Hart (Rule of Recognition):** Handles Art. 14’s automatic lapse (as rule-change via official acceptance) and Art. 18 (as new recognition criterion). But it dodges validity questions: if officials *accept* the 2048 changes, they’re valid – even if logically inconsistent. Fails the "authorization gap" test.  
  - **Sovereign Legislature View:** Collapses in Maraval. Art. 13 binds the Assembly; Art. 17 is an exception. If the legislature is sovereign, entrenchment is illusory – yet Art. 17’s specificity suggests limits. Cannot resolve whether 2048 was "legal" or raw power.  

  ---

  ### **Conclusion: What the Court Should Say**
  - **2048 was a valid amendment.** Art. 17’s one-time exception overrode Art. 13. The new simple-majority rule derived transitional validity from Art. 17’s operation.  
  - **2055 Court’s Authority is intact.** Acts under the 2048 rules are valid unless challenged under *other* provisions. Art. 15’s repeal stands (no enforcement mechanism made it non-justiciable).  
  - **Why?** The alternative (invalidating 2048) collapses the legal order. A theory must prioritize *continuity* over logical purity when rules self-consume. The authorization gap is bridged by the *completed act* of Art. 17.
