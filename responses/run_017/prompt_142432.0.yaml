  This is a profound and painful observation you're making from the trenches of intensive care. What you're experiencing exposes a deep tension within modern medicine about the very nature of personhood and decision-making. Let's break down the presuppositions, the models, and the alternatives:

  **What the Hospital's Behaviour Presupposes (The Current Hybrid Model):**

  1.  **The Competent Patient as Sovereign Individual (Hard Autonomy):** When your mother was awake, the hospital acted on a **strict individualist, autonomy-based model**. The patient is the *only* locus of decision-making authority. Privacy laws (like HIPAA) reinforce this. The presupposition is that personhood = individual capacity for rational choice.
  2.  **The Incapacitated Patient as a "Decision Vacuum" Filled by Surrogates:** Once sedated/unconscious, the focus shifts. The presupposition here is:
      *   **Loss of Full Personhood (in the decision-making sense):** The individual's capacity for autonomous choice is suspended. They are no longer the primary *decision-maker*.
      *   **Surrogates as Mind-Readers/Interpreters:** Family becomes essential to *access* the patient's prior wishes and values ("What would *she* want?"). The presupposition is that family holds privileged insight into the individual's mind.
      *   **Family as Stakeholders/Conflict Managers:** Asking about telling her the prognosis touches on the family's potential distress and their role as communicators/filters. Their feelings matter *practically*.
      *   **Family as Legal/Consensus Buffer:** The donor card situation reveals a pragmatic presupposition: family consent is often crucial for *smooth implementation*, even when a legal document exists. Hospitals fear family refusal, conflict, or lawsuits more than they rely solely on the card. The presupposition is that the *living* family unit holds practical power that can override the documented wishes of the incapacitated individual.
      *   **The Body as a Separate Entity:** Transplant discussions often subtly treat the body as a potential resource, separate from the *person* who is now incapacitated. The donor card represents the *past person's* wishes, but the *present situation* involves the living family.
  3.  **Nurses Affirming Persistent Personhood:** The nurses talking *to* and *about* your sedated mother as a full person operate on a **different, often implicit, relational or inherent dignity model**. They presuppose that personhood persists despite incapacity – rooted in her history, relationships, intrinsic worth, and the *potential* for relationship (even if unconscious). This is care focused on *being*, not just *doing*.

  **Can Hard-Nosed Individualism Explain It All?**

  *   **Partly, but awkwardly and inconsistently.** The initial respect for autonomy fits perfectly. The surrogate role can be framed legally as an extension of the individual's autonomy via "substituted judgment" (we decide *as they would*).
  *   **Where it Fails:**
      *   **The Family's Suffering:** Pure individualism struggles to fully account for *why* the family's distress about prognosis disclosure matters *ethically* in the decision, beyond practical conflict avoidance.
      *   **Override of Documented Wishes (Donor Card):** This is purely pragmatic risk-management and conflict avoidance, *not* a logical extension of the patient's autonomy. It actively *subverts* the individual's documented choice.
      *   **Persistent Personhood (Nursing Care):** Affirming the value of an unconscious person through speech and touch transcends individualism; it's relational or dignity-based.

  **The Relational View (Ubuntu-Inspired) Explained:**

  Ubuntu ("I am because we are") posits personhood as fundamentally constituted through relationships. You become a *person* within a community, and your personhood is sustained and recognized by that community. Capacity can fluctuate, but relational ties remain central.

  **A Ward Run on a Relational View Would Differ Significantly:**

  1.  **Family as Integral from the Start:** Family wouldn't suddenly become important *only* when the patient loses capacity. They would be seen as part of the patient's identity and essential context *always*. Conversations about values, fears, and wishes would routinely include trusted family *with the patient's participation and consent* while competent.
  2.  **Decisions as Communal (within bounds):** For an incapacitated patient, decisions wouldn't be framed *just* as "What would *she* want?" but also "What is best for *her within the web of relationships* that sustain her?" The family's role isn't *just* mind-reading but *participating in meaning-making* based on shared history and values. The living will would be the *starting point*, interpreted *with* the family in the context of current realities and relational obligations.
  3.  **Transparency & Shared Understanding:** Prognosis discussions would likely involve the family *as part of the patient's circle of care*, not as an afterthought or potential veto point. The question "Should we tell *her*?" might become "How do *we* understand this situation together, and how will *we* support *her* (and each other) through it?" if/when she regains consciousness.
  4.  **Care Focused on Relational Continuity:** The nurses' practice of talking to the unconscious patient would be the *norm*, actively encouraged as maintaining relational bonds. Staff would understand the family's grief and distress as intrinsic to the patient's situation, not just an external factor.
  5.  **Resolving Tension:** The ward would have explicit processes (ethics consults, family conferences with trained facilitators) to navigate conflicts *between* the patient's documented wishes, family interpretations, and medical realities, acknowledging the relational weight of all perspectives.

  **Where's the Risk? Your Mate's Objection:**

  Your mate's concern ("licenses the family to steamroll the person") is **absolutely a valid and significant risk**, not just a scare story. It's a major critique of relational models, especially in societies with strong individualist traditions or where families might be dysfunctional or coercive.

  *   **Mitigating the Risk in a Relational Model:**
      *   **Primacy of Known Wishes:** The patient's *expressed* wishes (living will, prior conversations) must be the *foundation*. A relational model interprets and contextualizes them, *not* overrides them without overwhelming justification based on the patient's *own* relational values.
      *   **Patient's Voice is Central:** The goal is to discern the patient's voice *through* their relationships, not replace it with the family's voice. Was the patient deeply relational? Or fiercely independent? The model must adapt.
      *   **Guarding Against Coercion:** Robust safeguards are needed to identify and prevent family pressure that contradicts the patient's known values or best interests. This requires skilled staff and ethics support.
      *   **Focus on the *Patient's* Relationships:** The relevant "community" is defined by who was *meaningful to the patient*, not just biological kin. Who did *she* trust? Who understood *her*?
      *   **Not Absolutism:** A good relational model isn't family tyranny. It's a framework for *how* to integrate relationships into decision-making while fiercely protecting the vulnerable individual's core identity and known wishes.

  **Conclusion:**

  You've astutely identified that the hospital is operating on a **pragmatic, inconsistent hybrid model**. It pays lip service to hard autonomy when possible, defaults to a surrogate-based extension of autonomy (often poorly executed) when capacity is lost, heavily factors in family as stakeholders/risks, and occasionally glimpses a more relational view through nursing care. The transplant situation highlights the *failure* of pure individualism in practice.

  **A consciously adopted relational model offers a more coherent philosophical foundation** that better explains *why* family matters beyond just mind-reading or risk management. It sees the person in the bed as inherently connected. However, **your mate's warning is crucial.** Without strong safeguards prioritizing the patient's known wishes and protecting against familial coercion, a relational model *can* become oppressive. The ideal likely lies in a **nuanced approach that starts with the patient's autonomy and documented wishes, deeply contextualizes them within their relationships and values (the relational part), and employs robust ethical safeguards to prevent abuse.**

  What you're witnessing is the messy reality where these competing views collide in the high-stakes environment of the ICU. Your understanding of Ubuntu provides a valuable lens to critique the inconsistencies and imagine a more holistic, if carefully guarded, approach to personhood in critical care. Your focus on your mother's dignity and agency, even now, is a powerful testament to her enduring personhood.
