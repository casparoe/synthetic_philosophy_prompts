prompt: |-
  I am drafting a two-page pitch for internal seed funding: one researcher for twelve months, no teaching, to work on a single question in collective decision-making. The topic is safe Pareto improvements, and I want the money to go to a question I think the literature has left in an awkward place.

  The notion as I am working with it: there is a status quo policy, a feasible set of alternatives, finitely many people, and finitely many states of the world. Each person has a utility function over outcomes and a probability distribution over states. A move from the status quo to an alternative is a safe Pareto improvement when, for every person, that person's own expected utility — computed from their own probabilities and their own utility function — is higher under the alternative than under the status quo. Its appeal is that it needs no interpersonal comparison and no social welfare function: a planner who has no view at all on the merits can apparently still make everyone better off, where better off is spelled out in terms each person would accept.

  My half-formed worry is that the guarantee is conditional on people's actual beliefs, and beliefs are precisely what the planner does not observe. If the planner has to ask, then anyone who expects to dislike the proposed change can report probabilities under which it looks bad, and reporting pessimism is costless; symmetrically, people can report confident beliefs to push through changes they favour. So safety may turn out to be safety relative to reported beliefs only. Behind that strategic point sits a structural one: the status quo is the disagreement point, no change is available for free, and anyone can in principle secure it by reporting suitably unhelpful probabilities. I suspect some kind of impossibility is available — that a rule which (i) selects a safe Pareto improvement whenever one exists relative to the true beliefs, (ii) never gives anyone an expected gain from misreporting their probabilities, and (iii) is neither a rule that always keeps the status quo nor one that consults a single designated person, either cannot be had or can be had only under a characterization so narrow that it shows the notion is not institutionally usable. But I do not know whether the honest conclusion is pessimistic about safe Pareto improvements or reconstructive of them, and that ambiguity is partly why I want the project scoped properly.

  What I need is a proposal that does the following. State the question so that it has a determinate answer — a theorem, a characterization, or a clearly described counterexample space — rather than a topic. Fix and justify the modelling choices: whether utilities are taken as observable while beliefs are private, or both are private; whether the people are assumed to share a prior; whether the planner can commit to a rule in advance. Explain why the existing answers leave it open: say what the standard treatments of safe Pareto improvements are doing when they help themselves to each person's beliefs, and say why the familiar impossibility results about strategy-proofness and about the tension between incentive compatibility and efficiency do not simply settle the matter, given that here the private object is a probability rather than a preference over outcomes and the default is the status quo rather than an arbitrary alternative. Argue for one approach over the obvious alternatives — in particular over the move to a robust or ambiguity-set version, where a change must raise each person's expected utility under every probability in a set attributed to them, and over a purely dynamic treatment in which each step is an improvement but the sequence may be exploitable — and say which of these belongs in the twelve months and which has to be left for later. Give a month-by-month plan for the year, including one minimal worked example with two or three people and two or three states that fixes intuitions and that the project would actually solve early on. Say what the possible conclusions are and which considerations would decide between them. Say what would count as the project having failed, and what would count as a disappointing but still useful result. Finally, describe a concrete deliverable and make the case, in a sentence or two, for why twelve months of one person's time is the right size for this and not for something larger.

  Describe positions and arguments by their content, not by author or paper: I will fill in the references myself, and I do not want the proposal's plausibility to rest on a citation list. Be straight about what could make the project too big for the time available.
reasoning: |-
  We are drafting a two-page pitch for a one-year research project on safe Pareto improvements in collective decision-making, focusing on the strategic and incentive issues when beliefs are private.
   The core problem: safe Pareto improvements require knowing each person's true beliefs to verify the improvement, but if beliefs are private and individuals report strategically, the planner may not get truthful reports.
   We suspect an impossibility result or a very narrow characterization might be looming, but we don't know yet.

   The proposal must:
   1. State a clear, answerable research question (theorem, characterization, counterexample space).
   2. Fix and justify modeling choices (what is observable, shared prior, commitment).
   3. Explain gaps in existing literature: standard treatments assume known beliefs, and why existing impossibilities (strategy-proofness, incentive-efficiency tradeoffs) don't directly apply (here private probabilities, status quo default).
   4. Argue for the chosen approach over alternatives (robust/ambiguity sets, dynamic step-by-step improvements).
   5. Provide a month-by-month plan, including a minimal worked example (2-3 people, 2-3 states) to be solved early.
   6. Outline possible conclusions and how we'd decide between them.
   7. Define failure and partial success.
   8. Specify a concrete deliverable and justify the one-year duration.

   We avoid author names and focus on content.

   Let's structure the pitch accordingly.

   Research Question:
     Can a planner, who cannot observe individuals' beliefs, design a mechanism that:
       (i) Implements a safe Pareto improvement (SPI) relative to true beliefs whenever one exists?
       (ii) Is strategy-proof (no incentive to misreport beliefs)?
       (iii) Is non-dictatorial and not always the status quo?
     And if not, what is the precise boundary between possibility and impossibility?

   Modeling Choices (to be fixed and justified):
     - Utilities: We assume that utilities over outcomes are common knowledge (or observable) because without this, the problem becomes even harder. This is standard in many mechanism design settings for beliefs. Justification: if utilities were also private, we would have to deal with two layers of private information, which might be intractable in one year. Moreover, in many policy contexts, preferences can be elicited separately or are stable over time.
     - Beliefs: Private to each individual.
     - Shared prior: We do not assume a shared prior. This is because the safe Pareto criterion is appealing precisely when individuals disagree.
     - Commitment: We assume the planner can commit to a mechanism (a game form) that maps reported beliefs into a policy choice (including possibly the status quo).

   Why existing literature leaves it open:
     - Standard treatments of SPIs assume the planner knows the true beliefs, so they sidestep the incentive issue.
     - Existing impossibility results (like Gibbard-Satterthwaite) are about preferences over alternatives, not about beliefs. Here, the private information is about probabilities, and the default is the status quo. Also, the SPI criterion is not about choosing the best alternative but about improving on the status quo without interpersonal comparisons.
     - The literature on strategy-proofness in allocation typically deals with ordinal preferences, not with expected utilities that depend on beliefs.

   Argument for the chosen approach over alternatives:
     - Robust/ambiguity-set approach: This would require the change to improve expected utility for every belief in a set for each individual. While this avoids reliance on exact beliefs, it may be too conservative and rule out improvements that are safe for the true beliefs. Moreover, the sets themselves might be manipulable. We leave this for later because we want to first understand the fundamental limits of the exact belief case.
     - Dynamic step-by-step improvements: This could be exploited over time (e.g., by misreporting to steer future steps). Also, it might not lead to a global improvement. We leave this for later because it introduces a new layer of complexity (repeated interactions) and we want to start with the one-shot case.

   Month-by-Month Plan:
     Months 1-2: Literature review and model formalization. Define the setting: finite states, finite alternatives, status quo, individuals with von Neumann-Morgenstern utilities (known) and private beliefs (probability distributions). Define a mechanism as a function from reported belief profiles to an alternative (or status quo). Define the properties: SPI implementation (if an SPI exists relative to true beliefs, the mechanism selects an SPI), strategy-proofness (truthful reporting is dominant strategy), non-dictatorship, and non-imposition (sometimes changes from status quo).

     Month 3: Work out the minimal example. Two people (A, B), two states (s1, s2). Status quo policy: say, a current allocation. Two alternatives: P and Q. Utilities for each outcome are known. Beliefs: A thinks s1 has probability p (so s2: 1-p), B thinks s1 has probability q. We fix utilities and then ask: for which true (p,q) does an SPI exist? Then, can we design a mechanism that, when they report (p', q'), selects an SPI relative to (p,q) if one exists, and is strategy-proof? We will solve this example and see what happens.

     Months 4-5: Generalize to three people and two states, then two people and three states. Identify patterns and potential impossibilities.

     Months 6-8: Attempt a general characterization. Investigate: 
          - Is there a strategy-proof mechanism that implements SPIs? 
          - If not, can we relax strategy-proofness to Bayesian incentive compatibility? (But note: we don't assume a common prior, so we might have to consider prior-free notions.)
          - Alternatively, can we achieve SPI implementation with a weaker incentive concept (e.g., in expectation over others' reports, or with transfer payments? But note: we are in a setting without transfers, as the SPI concept is about pure welfare without side payments.)

     Months 9-10: Explore the boundaries of possibility. If impossibility, what is the minimal relaxation? For example, can we have a mechanism that sometimes implements an SPI and otherwise stays at the status quo, and is strategy-proof? Or, can we have a mechanism that is not strategy-proof but has a bounded gain from manipulation? Alternatively, can we have a mechanism that is strategy-proof but only implements a weaker form of improvement (e.g., ex-post Pareto improvement, which does not depend on beliefs)? But note: the goal is safe Pareto improvement.

     Month 11: Write up the results and prepare the deliverable.

     Month 12: Finalize the paper and present the findings.

   Possible Conclusions:
     - Possibility: We find a non-dictatorial, strategy-proof mechanism that implements SPIs whenever they exist. (Unlikely, but if so, we describe it.)
     - Impossibility: We prove that no such mechanism exists that satisfies all three properties (i, ii, iii). Then we characterize the conditions under which it is possible (e.g., only when there are two states, or when beliefs are restricted to a certain class).
     - Partial possibility: We can have a mechanism that satisfies (i) and (ii) but sometimes stays at the status quo even when an SPI exists? Or one that satisfies (i) and (iii) but not (ii)? We then have to decide what trade-off is acceptable.

   How to decide: We will look for necessary and sufficient conditions in the minimal example and then try to generalize. The key will be whether the set of true belief profiles for which an SPI exists is "rich enough" to force a conflict with strategy-proofness.

   Failure and Partial Success:
     - Failure: We are unable to provide a clear answer even for the minimal example, or the problem turns out to be technically intractable. Also, if we find that the only strategy-proof mechanisms are dictatorial or always the status quo, then the concept might be deemed institutionally unusable.
     - Partial Success: We have an impossibility result for the general case but a possibility result for a restricted domain (e.g., two individuals, two states). Or, we have a characterization that shows the concept is usable only under specific conditions (e.g., when individuals have "sufficiently diverse" beliefs). Alternatively, we might have to drop strategy-proofness and settle for a weaker incentive concept, and then we characterize the extent of manipulation.

   Concrete Deliverable:
     A paper that either:
       (a) Provides a strategy-proof mechanism for SPI implementation in a non-trivial setting, or 
       (b) Proves an impossibility theorem and characterizes the boundaries of possibility, or 
       (c) Provides a formal exploration of the trade-offs (e.g., how much manipulation is unavoidable).

   Why one year?
     The problem is well-scoped: we are looking at a specific concept (safe Pareto improvements) and a specific issue (incentives with private beliefs). We have a clear starting point (minimal example) and a path to generalization. However, the project could become too big if:
       - The minimal example turns out to be very complex and we get stuck for months.
       - The move to three individuals or three states opens up many cases.
       - We have to explore multiple relaxations (e.g., Bayesian incentive compatibility, transfers, or robust versions) to get a positive result.

     But we plan to control the scope by:
       - Focusing on dominant strategy incentive compatibility and the one-shot setting.
       - Not allowing transfers (to stay true to the SPI concept).
       - Starting with small numbers and building up.

     One year is enough to get a definitive answer for the core question in a few settings and to lay the groundwork for future research on the alternatives we set aside.

   Let's write the pitch accordingly.
answer: |-
  ### Research Proposal: Incentive-Compatible Safe Pareto Improvements in Collective Decision-Making  

  #### **Core Research Question**  
  Can a mechanism designer, unable to observe individual beliefs, implement a *safe Pareto improvement (SPI)* over the status quo without incentivizing misreporting of probabilities? Specifically, is there a non-dictatorial mechanism satisfying:  
  1. **SPI Implementation**: Selects an SPI relative to *true beliefs* whenever one exists.  
  2. **Strategy-Proofness**: No individual gains by misreporting beliefs.  
  3. **Non-Triviality**: Does not always retain the status quo or delegate to one person.  
  A negative answer will characterize the impossibility (e.g., when SPIs exist only under restricted belief correlations) or identify minimal relaxations (e.g., bounded manipulation).  

  #### **Modelling Choices & Justifications**  
  - **Utilities as Observable**: Individuals’ utilities over state-dependent outcomes are common knowledge. *Justification*: Preferences over outcomes are often revealed through behavior or surveys, whereas beliefs are cognitively private. This isolates belief reporting as the incentive problem.  
  - **Beliefs as Private & Heterogeneous**: No shared prior assumption. *Justification*: SPI’s appeal lies in reconciling disagreement; shared priors trivialize belief misalignment.  
  - **Planner Commitment**: The designer commits to a mechanism *before* belief reports. *Justification*: Real-world institutions (e.g., regulatory agencies) use fixed rules to preempt gaming.  
  - **Finite States & Alternatives**: Enables tractable counterexamples and focuses on belief uncertainty.  

  #### **Gaps in Existing Literature**  
  - **Standard SPI Treatments** assume known beliefs, sidestepping incentives. They show *existence* of SPIs but not *implementation* when beliefs are unobserved.  
  - **Classic Impossibilities (e.g., Gibbard-Satterthwaite)** apply to ordinal preferences over alternatives, not cardinal utilities under uncertainty. Here, private *probabilities* (not outcome rankings) are manipulated, and the status quo acts as a default—invalidating direct application.  
  - **Strategy-Proof Mechanism Design** focuses on allocating goods with fixed preferences, not state-dependent welfare under probabilistic beliefs. Myopic reporting incentives differ fundamentally.  

  #### **Argument for Approach**  
  - **Against Robust/Ambiguity-Set SPIs**: Requiring improvement over *all* beliefs in a set is pessimistically conservative and may preclude feasible SPIs. *This project’s priority*: Resolve the exact-belief case first to establish baselines. Robust variants are deferred.  
  - **Against Dynamic SPIs**: Stepwise improvements risk exploitation via belief manipulation across stages (e.g., blocking beneficial sequences). *Deferred*: Adds complexity (repeated games) and obscures core incentive conflicts.  
  - **This Focus**: One-shot mechanisms with commitment isolate whether truthful SPI implementation is possible without transfers or prior agreements.  

  #### **12-Month Work Plan**  
  1. **Months 1–2**: Formalize model. Define mechanisms mapping reported beliefs to policies (status quo or alternative). Specify SPI existence conditions.  
  2. **Month 3**: **Minimal Worked Example** (2 people, 2 states, 1 alternative).  
     - *Status quo*: Outcome yielding utilities (0,0) in all states.  
     - *Alternative*: State-dependent utilities (e.g., Person A: [4,0]; Person B: [0,4]).  
     - *SPI exists* iff both assign >0 probability to their high-payoff state.  
     - *Challenge*: If A reports extreme pessimism (probability 0 for high-payoff state), SPI is blocked. Characterize strategy-proof mechanisms (e.g., "SPI only if both report ≥0.5 probability"). Test truth-telling incentives.  
  3. **Months 4–5**: Extend to 3 people/3 states. Identify SPI existence conditions (e.g., belief correlations). Test mechanisms (e.g., voting on SPIs, belief-averaging).  
  4. **Months 6–8**: General theorem. Explore:  
     - Necessity of *status quo bias* (always reject SPIs if any agent objects).  
     - Trade-offs: Strategy-proofness vs. SPI implementation.  
  5. **Months 9–10**: Relax strategy-proofness (e.g., ex-post regret minimization); quantify manipulation gains.  
  6. **Months 11–12**: Draft paper; synthesize implications for institutional design.  

  #### **Possible Conclusions & Deciding Factors**  
  - **Pessimistic**: SPI implementation is impossible without dictatorship or ubiquitous status quo bias. *Decider*: Proof that any strategy-proof mechanism fails condition (i) or (iii).  
  - **Reconstructive**: Strategy-proof SPIs are possible only under belief restrictions (e.g., "anti-correlated priors"). *Decider*: Domain characterization in minimal example.  
  - **Compromise**: Weaker incentives (e.g., "SPI with probability >0.5") permit partial implementation. *Decider*: Manipulation gains in simulations.  

  #### **Success Metrics**  
  - **Failure**: No clear impossibility/possibility even in minimal example; model produces intractable multiplicity.  
  - **Useful but Disappointing**: Strategy-proofness requires strong status quo bias (e.g., veto power for skeptics), limiting SPI adoption.  
  - **Target Success**: Complete characterization for small groups/states; general impossibility with quantifiable trade-offs.  

  #### **Deliverable & Scope Justification**  
  **Deliverable**: A paper proving an impossibility theorem (or constructive mechanism) for strategy-proof SPI implementation, with policy implications for belief-elicitation institutions.  
  **Why 12 Months?** The question is tightly scoped to *one-shot mechanisms with private beliefs*—omitting robustness, dynamics, or preference uncertainty. Expanding further (e.g., to ambiguity sets) would require 18–24 months. One year suffices for a definitive answer in tractable cases, grounding future extensions.  

  ---  
  *This proposal isolates the tension between incentive-compatibility and belief-dependent efficiency. By answering whether SPIs can be implemented without manipulation, it challenges a foundational premise of non-paternalistic policy design.*
