  For the sestina, I’ll rotate end-words so HISTORY/LACK/JEST/PAIR/FACE/LIVES in Sestet 1 shifts to LIVES/HISTORY/LACK/JEST/PAIR/FACE by Sestet 6—mathematically tight. The envoi’s tercet will condense the tension. Word evolution: FACE starts as literal portraiture, ends as self-reflection; JEST shifts from anecdote to self-deception risk. Marta’s ritual appears in Sestet 3 ("daily bread" line) with respect.

