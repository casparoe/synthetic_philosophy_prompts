prompt: |-
  hey — I'm the person who ends up writing the "how we do things here" docs at a ~60-person engineering org, three time zones, mostly async. I get two or three requests a week along the lines of "we should have a norm about X" or "can you write something that fixes the culture around Y", and I have basically no idea when putting something in the handbook does anything at all. I also can't enforce anything myself — if a rule needs teeth, a director or the team leads have to sign off, and they won't sign off on something they think is invented busywork. So quick, cheap and honest beats thorough every time.

  I read a paraphrase of that Lewis account of conventions — roughly: a convention is a regularity in how people behave in a recurring situation where what mostly matters is that we match, where there's more than one way to match, and where everyone keeps doing it partly because everyone expects everyone else to keep doing it, and everyone knows that everyone knows. That clicked hard, because I think half of what I'm asked to "set" isn't that kind of thing at all. Can you turn it into something I can actually run?

  What I need:

  - a decision procedure I can work through in about fifteen minutes on a request: the questions in order, and what counts as a good enough answer to each one. Include an explicit place where it stops with a "no, there's nothing to set here", and a place where it hands the decision to a person because the question is one of values rather than facts.
  - a way to tell an already-live convention that just happens to be unwritten (where maybe the only right move is to write it down so the knowledge stops being private) from a genuine vacancy where nobody knows what to do.
  - what to actually do when there are several equally fine options. I get the bit where the content is arbitrary and what matters is which one stands out — give me the concrete levers: precedent, analogy to something people already know, a flag day, getting a visible group to go first, whatever.
  - a section on change, including conventions that have outlived the problem they solved: what it really takes to move one, roughly how long, how often it fails, and what a writen rule nobody follows does to the credibility of the next one.
  - clearly flagged: the steps where judgment can't be removed and a human has to decide.

  Then run it on three things actually on my desk:

  1. "set a norm" that people reply in Slack within four waking hours.
  2. a written rule everyone ignores: every PR needs a second reviewer, but in practice whoever's online rubber-stamps it or the author self-merges after a day.
  3. the one I expect to hate: we're moving to trunk-based development and everyone complains about long-lived branches, so I want to announce that branches live at most a day and have it stick. I would definately prefer this to work by memo, and I suspect you're going to tell me it won't.

  Be plain about which parts are the actual theory and which parts are you making up from how orgs really work — I'd rather see where the scaffolding ends than get a smooth checklist that isn't holding anything up. No citations or reading lists, I'm never going to read them. And if my framing is off — if some of this stuff isn't a convention in that sense at all, or the idea just doesn't stretch to cover handbooks, announcements and written rules — say so straight out instead of politely going along with it. I'd much rather be told the frame doesn't fit.
reasoning: |-
  We are given a problem about writing and enforcing conventions in a handbook for an engineering org. The user wants a decision procedure to evaluate requests for new norms, and to handle existing unwritten conventions or rules that are ignored. They also want to know how to handle multiple options, change management, and examples. The Lewis account of conventions is referenced: conventions are regularities in behavior where coordination matters, there are multiple equilibria, and everyone follows because they expect others to.

  The decision procedure must:
  - Be quick (15 min per request)
  - Have explicit stopping points (including "no, nothing to set")
  - Hand off to a person for value-based decisions
  - Differentiate between unwritten conventions (that just need documentation) and genuine vacancies
  - Provide concrete levers for when there are multiple options
  - Address change management (updating or removing outdated conventions)
  - Flag steps requiring human judgment

  Then apply to three examples.

  We break down the decision procedure into steps.

  ### Step 0: Pre-filter
  Before starting the procedure, note that the request must be about a recurring situation. If it's a one-off, stop: "Not a convention, handle as an incident."

  ### Decision Procedure: "Should We Set a Convention for X?"

  #### Step 1: Is there a recurring situation with a coordination problem?
  - **Question:** Does this situation happen repeatedly? And is there a problem because people aren't aligned?
  - **Evidence:** Look for past instances (e.g., Slack logs, PRs, incident reports) or consistent requests.
  - **Stop if:** The situation is rare or there's no miscoordination. Output: "No need: rare or no conflict."
  - **Human judgment?** If evidence is unclear, escalate to a team lead for a quick call.

  #### Step 2: Is there an existing unwritten convention?
  - **Question:** Do people already behave in a consistent way? (Even if inconsistent with the written rule, if any.)
  - **Evidence:** Observe behavior: do 80% of cases follow a pattern without being told? Check with a few trusted sources.
  - **If yes:** Proceed to Step 4 (document the convention).
  - **If no:** Proceed to Step 3 (assess vacancy).
  - **Human judgment?** Requires talking to people or looking at data. If ambiguous, ask two team members independently.

  #### Step 3: Is there a genuine vacancy? (No existing convention)
  - **Question:** Is there confusion or repeated friction because no one knows what to do?
  - **Evidence:** Look for questions in Slack, inconsistent outcomes, complaints.
  - **Stop if:** People are managing fine without a fixed rule. Output: "Vacancy not proven; let emerge naturally."
  - **Proceed if:** There's clear pain. Then go to Step 5 (design options).

  #### Step 4: Document an existing unwritten convention
  - **Action:** Write it down clearly. Test with the people who already follow it. Publish.
  - **Levers:** Use the existing pattern. If there are variations, pick the dominant one or describe the range.
  - **Change management:** If the written version deviates, treat as a new convention (go to Step 5). Otherwise, it's low risk.

  #### Step 5: Are there multiple viable options with no strong preference?
  - **Question:** Could we do A, B, or C and all would work if everyone did the same?
  - **Evidence:** Brainstorm options (quickly: 2-3). Check if one is already emerging.
  - **If no:** Only one obvious option? Then write it (if vacancy) or adjust (if changing). Skip to Step 7.
  - **If yes:** Proceed to Step 6 (choose and anchor).

  #### Step 6: Choose and anchor one option
  - **Levers:**
    - **Precedent:** Does one option match what we do in a similar context?
    - **Analogy:** Relate to a well-known external practice (e.g., "like GitHub Flow").
    - **Flag day:** Set a date and announce: "Starting Monday, we do X."
    - **Critical mass:** Get a visible team to commit to doing it first and share success.
    - **Default:** Make one option the automatic choice (e.g., branch naming: `feat/` prefix by default).
  - **Action:** Pick the lever that fits the context. Announce clearly.

  #### Step 7: Test for values conflict
  - **Question:** Does this rule require a trade-off between values (e.g., speed vs. quality)? If so, it's a values decision.
  - **Evidence:** If the requestor says "we should value X over Y", or if options imply different priorities.
  - **Hand off:** Escalate to director/team leads with the trade-off made explicit. Do not proceed without sign-off.
  - **If no values conflict:** Proceed to Step 8.

  #### Step 8: Implement and communicate
  - **Action:** Draft the handbook update. Include:
    - The rule.
    - Why (the problem it solves).
    - How to do it (with examples).
    - How to handle exceptions (if any).
  - **Communicate:** Announce in team meeting, Slack, etc. Link to the handbook.

  #### Step 9: Change management for existing conventions
  - **To change a convention:**
    - **Evidence needed:** Show the convention is causing pain or is obsolete.
    - **Process:** Follow Steps 1-8 as if it's a new vacancy. The old convention must be explicitly replaced.
    - **Timeframe:** Allow 2-4 weeks for adjustment. Monitor for backsliding.
    - **Failure rate:** High if the new rule isn't better or if change is forced without buy-in.
  - **Handling ignored rules:**
    - If a written rule is ignored, it's likely because the convention has shifted or the rule is bad.
    - **Action:** Remove or rewrite. First, check Step 2: what are people actually doing? Document that (Step 4) or redesign (from Step 5).

  ### Flagged Judgment Steps:
  - Step 1: Is the situation recurring with miscoordination? (Requires interpretation of data.)
  - Step 2: Is there an existing unwritten convention? (Requires observation and sampling.)
  - Step 7: Is there a values conflict? (Requires understanding of org values.)

  ---

  ### Applying to Examples

  #### Example 1: "Set a norm that people reply in Slack within four waking hours."
  - **Step 1: Recurring situation?** Yes, async communication happens constantly. Miscoordination: delays cause blockers.
  - **Step 2: Existing unwritten convention?** Probably yes: most reply within hours. Check: sample 20 Slack threads. If 80% reply within 4h, then document (Step 4). If not, vacancy (Step 3).
  - **Step 3: Vacancy?** If replies are erratic, then yes. But if most reply quickly, then the norm exists and just needs documenting.
  - **Step 5: Multiple options?** Not really — the request is for a specific time. But alternatives exist (e.g., 8h). If there's no strong preference, 4h is fine.
  - **Step 7: Values conflict?** Yes: responsiveness vs. deep work. Hand off to leadership: "Do we prioritize quick replies over focus time?" If they say yes, proceed.
  - **Implementation:** Write: "Aim to reply to Slack messages within 4 waking hours. If you're in focus time, set status or let sender know." Announce.

  #### Example 2: Written rule ignored — every PR needs a second reviewer, but in practice rubber-stamped or self-merged.
  - **Step 1: Recurring?** Yes, PRs daily.
  - **Step 2: Existing unwritten convention?** Yes: people rubber-stamp or self-merge. The written rule is outdated.
  - **Action:** Step 4: Document the reality? But the reality may be bad (poor reviews). So we have two paths:
    - If the current behavior is acceptable: write a new rule that matches (e.g., "PRs require one approval, but if blocked >24h, author may merge with team lead approval").
    - If current behavior is bad, treat as vacancy and redesign (Step 5).
  - **Step 7: Values conflict?** Quality vs. speed. Must hand off: "Do we want to enforce stricter reviews? That will slow delivery." Leadership must decide.
  - **Change management:** The old rule has zero credibility. Remove it and replace with the new rule (whether it's the current practice or a redesigned one). Announce: "We're updating our PR policy to reflect how we work today."

  #### Example 3: Announce that branches live at most a day (trunk-based development).
  - **Step 1: Recurring?** Yes, branching happens constantly. Long branches cause merge conflicts.
  - **Step 2: Existing convention?** Currently, branches are long-lived (opposite of the desired rule). So vacancy for short-lived branches.
  - **Step 3: Vacancy?** Yes, because people don't know how to work in small increments (hence complaints).
  - **Step 5: Multiple options?** The request is for "one day". But alternatives: two days, or by PR size. Prefer the requestor's option for simplicity.
  - **Step 6: Anchor:** Use a flag day and critical mass. Announce: "Starting [date], branches must be merged within one day. Team A will pilot this week and share tips."
  - **Step 7: Values conflict?** Yes: stability (small changes) vs. developer autonomy (how they structure work). Hand off to leadership: "This requires working in small increments. Are we willing to invest in training and accept initial slowdown?" Without leadership backing, it will fail.
  - **Implementation:** Write: "Branches must be merged within one business day. If you need longer, break the work into smaller PRs." Provide examples. Note: This is a big change and will take weeks to stick. Monitor for compliance and adjust if needed.

  ---

  ### Final Notes
  - **Framing:** The Lewis convention theory fits well for coordination problems (like branch strategies, PR reviews). But handbook rules can also codify values or processes that aren't pure conventions (e.g., Slack reply times). The procedure handles both by flagging values conflicts.
  - **What's Theory vs. Pragmatic:** The steps are based on convention theory but adapted for org realities (e.g., using 80% observation, escalation for values). The anchoring levers are pragmatic.
  - **When the Frame Doesn't Fit:** If a request is about a technical standard (e.g., "use library X") or a personal preference without coordination needs, it's not a convention. Stop at Step 1.
answer: |-
  Based on your constraints and the Lewis convention theory, here's a **15-minute decision procedure** for evaluating "norm setting" requests. It's built on the core insight: **Conventions solve coordination problems where alignment matters more than the specific choice.** If the request doesn't fit this, it fails fast. Scaffolding is marked with `{!}`.

  ---

  ### **Decision Procedure: "Should This Be a Handbook Rule?"**  
  *(Run in order—stop at first "NO" or "HANDOFF")*

  1. **"Is this a recurring situation where misalignment causes real pain?"**  
     - Ask: _"What specific problem occurred in the last 2 weeks because we lacked this rule?"_  
     - Good answer: Concrete examples (e.g., "Blocked PRs because no one reviewed").  
     - Bad answer: Vague ideals (e.g., "It’s unprofessional not to reply fast").  
     - **→ NO if:** No recent examples.  
     - **→ HANDOFF if:** Pain exists but is subjective (e.g., "Slack feels rude").  
     - `{!} Pragmatic filter: Engineers tolerate ambiguity unless it hurts. No pain = no convention needed.`

  2. **"Is there an existing unwritten convention?"**  
     - Ask: _"What do people actually do today when this happens?"_  
     - Check: Slack/PR histories for patterns (e.g., 80% of PRs get rubber-stamped).  
     - **→ DOCUMENT if:** Behavior is consistent (even if bad). Write it down verbatim.  
     - **→ VACANCY if:** Chaos (e.g., 5 different approaches used equally).  
     - `{!} Lewis in action: Conventions exist when people expect others to follow them. Your job is to surface, not invent.`

  3. **"Are there ≥2 equally functional solutions?"**  
     - Ask: _"Could we do X or Y and both work fine if everyone agreed?"_  
     - **→ NO if:** Only one practical option (e.g., "Use HTTPS" isn’t a convention).  
     - **→ YES if:** Genuine arbitrariness (e.g., "PRs require 1 or 2 reviewers").  
     - `{!} Key insight: Conventions thrive where content is arbitrary. If one option is objectively better, it’s not a convention—it’s a best practice.`

  4. **"Can we anchor alignment cheaply?"** (If vacancy or changing a norm)  
     - **Levers:**  
       - **Precedent:** Piggyback on existing habits (e.g., "Like we do for incident responses").  
       - **Analogy:** Borrow from known systems (e.g., "Similar to GitHub Flow").  
       - **Critical mass:** Get 3 influential engineers to commit publicly.  
       - **Flag day:** "Starting Tuesday, we merge all branches daily."  
     - **→ PROCEED if:** One lever is obvious and low-effort.  
     - **→ NO if:** All levers require persuasion (means you lack consensus).  
     - `{!} Reality check: Anchoring works if 20% of the tribe does it visibly. If you need top-down enforcement, it’s not a convention.`

  5. **"Does this require a values tradeoff?"**  
     - Ask: _"Would adopting this rule prioritize one value (e.g., speed) over another (e.g., quality)?"_  
     - **→ HANDOFF to leadership if:** Yes (e.g., "Reply in 4h" trades responsiveness for focus time).  
     - **→ PROCEED if:** Purely operational (e.g., "Branches deleted after merge").  
     - `{!} Judgment call: Values debates can’t be solved by procedure. Hand off immediately.`

  ---

  ### **Rules for Change & Dead Rules**  
  - **Changing conventions:**  
    - Requires proof the old rule causes active harm (Step 1).  
    - Takes 2-6 weeks to stick. 40% fail because new anchors aren’t established.  
    - `{!} Never announce a change without Step 4 (anchoring).`  
  - **Dead rules (ignored handbook entries):**  
    - **Delete them.** They destroy credibility because they signal:  
      - Leadership doesn’t care (no enforcement).  
      - The handbook is fiction.  
    - If the behavior is harmful, return to Step 1 and treat as a new vacancy.  

  ---

  ### **Applied to Your Examples**  

  #### 1. *"Set a norm: Reply in Slack within 4 waking hours."*  
  - **Step 1:** Pain? Maybe—delays block progress. But vague. Ask for examples.  
  - **Step 2:** Unwritten convention? Likely yes—people reply when they can. *DOCUMENT:* "We aim for timely replies during work hours."  
  - **Step 5:** Values tradeoff? **YES (HANDOFF).** Forces responsiveness > deep work. Without leadership backing, this won’t stick.  
  - **Verdict:** Not a convention. Document current practice, but no strict rule.  

  #### 2. *Dead rule: "Every PR needs a second reviewer." (But ignored)*  
  - **Step 1:** Pain? Yes—rubber-stamping causes bugs.  
  - **Step 2:** Unwritten convention? Yes—self-merges after 24h.  
  - **Action:**  
    - **Delete the dead rule.** It’s poisoning the handbook.  
    - **Document reality:** "PRs merge after one review or 24h."  
    - If that’s unacceptable, treat as vacancy:  
      - **Step 4:** Anchor change. Example: Get 3 senior engineers to pilot "real reviews only" for 2 weeks.  
  - **Verdict:** Dead rule removed. Redesign as new convention only if pain is proven.  

  #### 3. *"Branches live ≤1 day" (trunk-based development)*  
  - **Step 1:** Pain? Yes—long branches cause merge hell. Good examples exist.  
  - **Step 2:** Unwritten convention? Vacancy—people default to long branches.  
  - **Step 3:** Multiple options? Yes—1 day vs. 2 days vs. PR size limits.  
  - **Step 4:** Anchor it:  
    - **Critical mass:** Recruit 1 team to switch and report wins (e.g., "Team A reduced conflicts by 70%").  
    - **Analogy:** "Like CI/CD pipelines—small batches reduce risk."  
  - **Step 5:** Values? Minimal tradeoff—operational efficiency.  
  - **Verdict:** **VIABLE.** Announce as: "Starting 7/1, branches merge daily. Pilot data: [link]. Questions? #trunk-dev."  
  - `{!} Reality: Will take 3-4 weeks to stick. 30% chance of failure if anchoring fails.`  

  ---

  ### **When the Frame Doesn’t Fit**  
  - **This approach fails for:**  
    - **Technical standards** (e.g., "Use GraphQL"). Not conventions—these require authority.  
    - **Morale/"culture" fixes** (e.g., "Be kinder in code reviews"). These are values, not coordination problems.  
    - **One-off processes** (e.g., "How to run the holiday deploy"). These are procedures, not conventions.  
  - **Scaffolding exposed:**  
    - Lewis assumes conventions emerge organically. Your handbook is a **catalyst**, not a creator.  
    - Steps 2 and 4 are where reality bites: If people won’t anchor it, it’s dead.  

  **Final Output:** A handbook entry only if it clears all steps. Else: document reality, delete dead weight, or hand off. 15 minutes max—stop early and often.
