prompt: |-
  Hey — I'm the junior person on the collections commitee of a small university art museum, and we've got a nasty one on Tuesday. I've only been on it since September, so I've been back through the minutes trying to work out what we actually think, and I'm not sure our own record pins down an answer. Here's what I've got.

  Five decisions, summarised:

  1. Two years ago we turned down a loan of six huge tapestries woven in a prison workshop under the old regime. The weavers were conscripted, two died at the looms, the tapestries depict the dictator's family as gods, and the survivors' association wrote to say that hanging them as art would honour the men who killed their fathers. We said no, fairly fast.

  2. We own fourteen oils by a landscape painter who beat his wife, drove a student out of the profession and stole that student's designs. Dead eighty years. None of it is in the pictures. They hang in the front gallery on an ordinary label.

  3. We accepted a bequest of a composer's manuscripts and royalties. In 1938 he signed a public loyalty oath and named colleagues to the authorities; two of them lost their posts and one never worked again. A slice of his royalties went to the ruling party, which no longer exists. The music is abstract orchestral work with no political content, and nobody thinks its value comes from any of that. Everyone involved is dead; there's a biography that makes grim reading. We took the bequest and we still programme the symphonies.

  4. We declined a gift of a photographer's famine portfolio. He paid destitute people to pose in degrading arrangements, the shock of the pictures is the entire point of them, descendants of three of the subjects objected in writing, and print sales still fund a foundation that runs projects along the same lines. Declined.

  5. We accepted, with conditions, a travel writer's illustrated diaries — watercolours that are genuinely superb, prose that is casually racist, and a dozen objects he drew or carried home that were taken from shrines without anyone's permission. Writer long dead. The community whose shrines they were is very much alive; we wrote to them; they asked that the diaries be shown only alongside their own account of the objects, and that we not sell reproductions. We agreed, and that's what's on the wall. Two members dissented and wanted to refuse outright, which is why I think this one may be our weakest precedent.

  Now Tuesday. A set of thirty-four plaster life-casts, made in the winter of 1868 from men held after a failed uprising on an island whose name I'll leave out of this email. All thirty-four were hanged within a fortnight of sitting for the casts, which were then sold around Europe first as anatomical specimens and later as sculpture; they're now regarded as among the finest anatomical modelling of the century, and having seen the photographs I don't think that's hype. The sculptor's notebooks, digitised by an archive last year and properly read for the first time, say he chose the men for the nobility of their fear as they waited to hang, and that he had them stripped and shackled in the studio for the sittings. We bought our set at auction in 1974, title clean. We advertised twice for descendants and heard nothing; but a historian at another university has now matched three of the names to families still living on the island, and nobody has contacted those families yet. The island's heritage council has written asking to be consulted — asking, not claiming; they've said they know they have no legal standing. The director keeps mentioning that these are the most requested objects we own and that we're about £200k down this year, which I assume is meant to be irrelevant.

  The four options on the table: show them as sculpture, show them with the men's names and the notebook material and a wall text, keep them in store, or defer until the three families have been asked.

  What I want from you isn't really a gut reaction. I want to know what rule or rules we've been implicitly running in 1 through 5, whether more than one rule fits all five equally well, and what each of those rules says about Tuesday. Which of the five is the closest analog and why. If we genuinely aren't pinned down, say so plainly and tell me what principle we'd be committing ourselves to with each of the four options — I'd rather adopt something on purpose than by accident. And tell me which single further fact, or which small hypothetical case, would best separate the rules from each other: if the load-bearing question really is "ask the families first," I want to be able to explain to the committee why that's the load-bearing question and not just politeness.

  Reason it out in whatever order makes sense, then finish with one line: \answer{show}, \answer{show with conditions}, \answer{store}, or \answer{defer}.
reasoning: |-
  Hmm, the user is a junior member of a university art museum's collections committee facing a complex ethical dilemma about displaying controversial historical artifacts. They've provided five past decisions as precedents and need help identifying implicit ethical rules to apply to a new case involving life-casts of executed prisoners.

  Breaking this down: The user needs systematic analysis rather than gut reaction. They want:
  1) Identification of implicit rules in past decisions (1-5)
  2) Testing if multiple rules fit all cases
  3) Closest analog to the current case
  4) Clear principles behind each option if no single rule applies
  5) A decisive recommendation with reasoning

  Looking at the precedents:
  - Case 1 (tapestries): Rejected due to victim harm (consent issues, glorification of oppressors)
  - Case 2 (painter's works): Displayed despite artist's misconduct (art separated from creator)
  - Case 3 (composer's work): Accepted despite political collaboration (art separated from actions)
  - Case 4 (photographs): Rejected due to exploitation (consent violations, ongoing harm)
  - Case 5 (diaries): Accepted with conditions (community consultation, contextual display)

  The current case (plaster life-casts) involves:
  - Non-consensual creation under duress
  - Subjects were executed prisoners
  - Historical/artistic significance
  - Descendants potentially identifiable
  - Community interest in consultation

  Key ethical tensions emerge:
  - Artistry vs. human dignity
  - Historical value vs. contemporary harm
  - Legal ownership vs. ethical responsibility
  - Institutional needs vs. moral obligations

  The closest analog is Case 5 (travel diaries) due to:
  - Clear non-consensual acquisition
  - Living community connections
  - Successful precedent for conditional display

  But critical differences exist:
  - The life-casts document actual violence (unlike the landscapes)
  - Involve physical subjects (like photos) not just representations
  - Creation was intentionally exploitative (sculptor's notes confirm)

  Testing hypotheticals to clarify principles:
  If descendants objected? → Likely store/defer (like Case 1,4)
  If no living connections? → Might show with context (like Case 2,3)
  If subjects consented? → Changes everything (but they didn't)

  The "load-bearing question" is indeed about consulting families - not politeness but because:
  1) It addresses core consent issues (unlike artist misconduct cases)
  2) Directly parallels Case 5's resolution
  3) Avoids replicating the sculptor's power imbalance

  Recommendation: Defer consultation → Allows ethical due diligence while honoring the museum's demonstrated commitment to community input (Case 5). Rushing display risks repeating the photographer's exploitation (Case 4).
answer: |-
  Based on your committee's precedents, I identify **two distinct implicit rules** that explain all five decisions. Both fit equally well, but they lead to different conclusions for Tuesday's case. Here's the reasoning:

  ### Rule 1: *"Was the work's creation/use inherently exploitative or non-consensual toward its subjects?"*
  - **Applies to all five**:  
    - Case 1 (tapestries): **Yes** (conscripted weavers, victims object). → **Rejected**  
    - Case 2 (landscapes): **No** (misconduct by artist, not tied to subjects). → **Accepted**  
    - Case 3 (music): **No** (harm by composer, not tied to subjects). → **Accepted**  
    - Case 4 (photos): **Yes** (subjects exploited, descendants object). → **Rejected**  
    - Case 5 (diaries): **Yes** (objects taken without consent) → **Conditionally accepted** with subject-community input.  
  - **Tuesday's case**:  
    The life-casts were made non-consensually (shackled prisoners facing execution; sculptor exploited their fear). Subjects had no agency. → **Rule implies rejection or strict conditions**.  

  ### Rule 2: *"Does displaying the work perpetuate ongoing harm to identifiable victims/descendants or their communities?"*
  - **Applies to all five**:  
    - Case 1: **Yes** (victims' association objected; hanging honors oppressors). → **Rejected**  
    - Case 2: **No** (no ongoing harm; subjects not harmed). → **Accepted**  
    - Case 3: **No** (no ongoing harm; music apolitical). → **Accepted**  
    - Case 4: **Yes** (descendants object; sales fund similar exploitation). → **Rejected**  
    - Case 5: **Yes** (community harmed by display without context) → **Conditionally accepted** with their input.  
  - **Tuesday's case**:  
    Identifiable descendants exist (3 families) and the island's heritage council seeks consultation. Displaying without input risks perpetuating harm (echoing the sculptor's exploitation). → **Rule implies deferral or conditional acceptance**.  

  ### Closest Analog: Case 5 (Diaries)
  - Why? Both involve:  
    (a) **Non-consensual acquisition/creation** (objects taken from shrines vs. life-casts made under duress),  
    (b) **Living communities** with moral (not legal) claims,  
    (c) **Resolution via consultation and contextual display**.  
  - Key difference: The diaries' harm was mitigated by community-directed conditions. Here, **families/descendants are central** (like Case 4's photo subjects), making consultation even more urgent.  

  ### If No Single Rule is Deterministic? Principles Behind Each Option:
  - **Show as sculpture**: Prioritizes artistic/historical value over ethical concerns (ignores Rules 1 & 2). Aligns with Case 2/3 logic but contradicts 1,4,5.  
  - **Show with context**: Conditionally accepts work but centers institutional narrative (partial Rule 2). Risks tokenism if families aren't consulted (contrasts with Case 5’s community agreement).  
  - **Store**: Acknowledges harm (Rules 1 & 2) but avoids engagement. Aligns with Cases 1/4 rejections but misses Case 5’s restorative model.  
  - **Defer**: Upholds Rule 2 by prioritizing victim-community voices. Mirrors Case 5’s process (consultation before display).  

  ### Load-Bearing Question: "Ask the families first" IS the critical test
  - **Why it’s not just politeness**:  
    Your precedents show harm is measured by impact on victims/descendants (Cases 1,4,5). Here, the sculptor *intentionally* dehumanized subjects (notebooks prove this). Displaying without consultation replicates his power dynamic. Case 5 proves consultation isn’t optional when communities are affected.  
  - **Hypothetical to clarify rules**:  
    *"What if the sculptor’s notes revealed the prisoners consented?"*  
    - Rule 1: If consent existed → Show (like Case 2/3).  
    - Rule 2: If descendants still objected → Defer/show with conditions (like Case 5).  
    This shows Rule 2 is stricter and aligns best with your later precedents.  

  ### Recommendation
  **Defer until families are consulted**. Rule 2 (ongoing harm to communities) is the strongest through-line in your decisions, and Case 5 sets a clear precedent for consultation. Showing without input risks replicating the exploitation in Cases 1/4.  

  \answer{defer}
