prompt: |-
  I keep getting offered the same kind of deal, and my reactions to it are not consistent in a way I can articulate. The deal has this shape: another party offers to do something I value on condition that I do something they value, where neither of us would have done the other's thing for its own sake — the whole point is that our values differ. In the circles I move in this goes by the name of moral trade, and the argument for it is the ordinary argument for trade: differences in valuation create gains, so each of us can buy a lot of what we care about using a currency that is cheap for us and expensive for them. I find that argument persuasive in the abstract. But my verdicts on actual proposals are all over the place, and I want to know what principle I am implicitly applying, or which principle I should be applying instead, together with an honest account of which of my verdicts I would have to give up.

  The cases, with my verdicts.

  1. A colleague who cares about preserving historic church buildings offers $2,000 to a malaria bednet charity I support if I spend a Saturday helping to repair a church roof. I think the roof is a poor use of resources by comparison, but harmless. Verdict: accept, without hesitation.

  2. Same colleague, same $2,000, but the condition is that I anonymously give $200 to the roof fund. Verdict: accept.

  3. Same colleague, same $2,000, but the condition is that I sign, under my own name, a public letter supporting the preservation campaign. Verdict: refuse. Not "refuse unless the sum is large enough" — I do not think there is a sum.

  4. The same letter, but she will accept my signature under a pen name that cannot be traced to me. Verdict: I believe I would accept, and I am fairly confident that I should not be able to, given 3. This is the pair I find hardest.

  5. A neighbour whose values I think are bad offers $5,000 to the bednet charity if I spend a weekend canvassing against a proposed affordable-housing development nearby. Verdict: refuse.

  6. The same neighbour, same $5,000, but the condition is an anonymous $200 to the litigation fund fighting the development. Verdict: refuse, though clearly less bad than 5. What I cannot explain is how this differs from 2, where I also anonymously fund something I think is a mistake. The obvious answer is that the litigation is harmful and the roof is merely wasteful, but that commits me to trading on a continuous scale of expected harm, and if that is what I am doing I should be able to name the exchange rate at which 6 becomes acceptable. I cannot, which makes me think the real work is being done by something else.

  7. I sit on a hiring committee. A donor offers $50,000 to the bednet charity if I vote for his nephew, whom I believe to be the weaker candidate. Verdict: refuse — and this feels like a different kind of refusal from 5 and 6, not because the outcome is worse but because of what I would be doing with a judgment that is not mine to sell.

  8. A donor offers $2,000 to the bednet charity if I make a small lifestyle change I barely minded making anyway, and then lets slip that he was going to give the $2,000 regardless. Verdict: pointless, walk away. Had he concealed it deliberately I would also think he had wronged me.

  9. Two variants that look alike to me and that I judge differently. (a) A stranger says he will post abuse in my blog's comment section every day unless I subscribe to his newsletter. (b) A protester who lawfully pickets an organisation I work with says he will skip a Saturday of picketing and work at a food bank instead, if I donate $200 to his legal defence fund. Verdicts: (a) is not a trade at all and I refuse flatly; (b) I think I would accept. Both are cases of someone refraining from something I dislike in exchange for something from me.

  10. A man whose politics I find contemptible offers $1,000 to the bednet charity if I mow his lawn, and I know he will spend the time he saves writing a piece I think does real harm. Verdict: accept, and I am faintly surprised that it is fine. Since money and time are both fungible, I do not see how this differs in kind from 6.

  The principle I have been using is roughly this: a trade is acceptable for me if and only if I prefer the whole bundle — both sides' actions — to the status quo, and my counterpart's contribution is genuinely conditional on mine. Against the list this handles 1, 2, 8 and 10, is silent on 3 and 9, and, as far as I can tell, wrongly permits 5, 6 and 7, since in each of those I may well prefer the bundle to the status quo. So I need at least one further clause, and I do not know what it is or how many clauses it takes.

  I also want a verdict on a case I have actually been offered and cannot settle. Suppose a broker existed that did three things: matched parties with opposed values, held both sides in escrow so that neither could renege, and concealed from each party both the identity of the other and the specific cause their money reached. The broker would also allow diluted contributions: my $200 would enter a pool with several thousand dollars from other people, and the pool would be capped so that no individual contribution changed what the funded cause could do. Through the broker I could take the deal in 6, and my contribution would make no marginal difference to anything at all. My two reactions are that this dissolves the objection to 6 completely, and that it is a machine for manufacturing clean hands while the harm still happens. Is there a principle that sorts this, and does it sort it by ruling on the broker or by ruling on 6?

  What I would like from you: a principle, or a small set of competing candidates, stated precisely enough that I could apply it without coming back to you; each clause tied to the case that motivates it; the clauses that would have to be added to my gains-from-trade test to repair it; verdicts on the two cases above (3 versus 4, and the broker); verdicts on two cases I have not listed — a trade whose counterparty is someone I take to be probably delusional about what they value (he maintains a shrine because he believes a supernatural being will otherwise punish the village, and I assign that a low but non-zero probability), and a trade that binds my own future judgment over years rather than requiring one action now; and a frank statement of which of my verdicts your principle cannot accommodate and which of them you think I should abandon. Where the principle has free parameters — a threshold, an exchange rate between harm prevented and harm funded, a list of things that are inalienable — please say so explicitly rather than picking a value on my behalf.
reasoning: |-
  Hmm, this user presents a fascinating moral dilemma about "moral trade" where they're struggling to reconcile abstract principles with concrete judgments. They've systematically analyzed 10 scenarios with inconsistent verdicts, revealing deep tension between utilitarian trade logic and deontological constraints. 

  The core conflict seems to be between two frameworks: one where morality is purely about outcome valuation (would trade X for Y if Y's value > X's cost), and another where certain actions violate integrity regardless of consequences. Their cases show this tension erupting at boundaries involving identity (signing letters), complicity (funding harmful causes), and role-based duties (voting on committees). 

  What's especially interesting is how anonymity functions as a moral loophole - they'd sign a letter under pen name but not real name, suggesting the constraint isn't about the action's consequences but about what it expresses about their character. Similarly, the escrow broker case highlights how diluted responsibility creates psychological comfort but doesn't actually change material outcomes.

  For the broker dilemma specifically, I'm considering two competing principles: the "causal impotence" view (if my contribution is truly non-marginal, I'm not responsible for outcomes) versus the "constitutive complicity" view (joining the pool still makes me part of the harm-enabling system). The user's "clean hands" metaphor suggests they intuitively grasp this second perspective even as they wish to reject it.

  Their unlisted cases add valuable dimensions - the delusional trader scenario tests whether perceived irrationality voids trade legitimacy (probably not, since value is subjective), while the binding future judgment case seems clearly prohibited by the integrity principle since it alienates autonomous decision-making.

  The biggest tension points will be:
  - Case 4 (pen name signature) where their intuition conflicts with their own stated refusal of public endorsement
  - The fungibility problem in case 10 (lawn mowing) versus case 6 (anonymous funding), which might require distinguishing direct versus indirect causal chains
  - Whether "harmless waste" versus "active harm" is a sustainable distinction given their rejection of sliding scales

  Ultimately their struggle mirrors debates in moral philosophy between consequentialism and Kantian ethics - and like most philosophers, they'll likely need to accept some inconsistency or prioritize one framework over the other for coherence.
answer: |-
  Based on your cases and the tensions you identify, I propose a **Principle of Permissible Moral Trade (PPMT)** with three core conditions. This framework aims to systematize your intuitions while flagging where it conflicts with some of your verdicts:

  ### The Principle (PPMT)
  A moral trade is permissible for you to accept **if and only if**:
  1.  **Gains-from-Trade Condition:** You prefer the overall outcome (your action + their action) to the status quo.
  2.  **Conditionality Condition:** Their contribution is genuinely contingent on your action (ruling out cases like 8 where it isn't).
  3.  **Integrity Condition:** Your action does not:
      *   **a.** Misrepresent your identity, values, or judgment to others (*Expression Constraint*), OR
      *   **b.** Constitute a direct, material contribution to an act you judge to be significantly harmful (*Harm Complicity Constraint*), OR
      *   **c.** Involve the misuse of a role-bound duty or entrusted judgment (*Role Alienation Constraint*).

  #### Breakdown of Conditions & Ties to Cases
  *   **Condition 1 (Gains-from-Trade):** Your starting point. Handles 1, 2, 8 (fails Cond. 2), 10. Fails to block 5, 6, 7 on its own.
  *   **Condition 2 (Conditionality):** Ensures it's a real trade. Explains refusal in 8. Handled implicitly in other cases.
  *   **Condition 3a (Expression Constraint):** Explains refusal in 3 (signing public letter under your name misrepresents your values/judgment). Explains *potential* permissibility of 4 (pen name avoids misrepresentation *to others*), though ambivalence remains (see below). Explains refusal in 9a (subscribing under coercion expresses false endorsement).
  *   **Condition 3b (Harm Complicity Constraint):** Explains refusal in 5 (canvassing directly enables harm) and 6 (funding litigation is material contribution to harmful act). Explains refusal in 9a (paying ransom is complicit in enabling harm/abuse). Contrasts with 2 (funding mere waste isn't complicity in *harm*). Creates tension with 10 (see below).
  *   **Condition 3c (Role Alienation Constraint):** Explains refusal in 7 (selling a hiring vote alienates a judgment entrusted to you for the role's purpose). Explains why 7 feels different from 5/6. Explains refusal in cases like selling judicial decisions or medical diagnoses.

  ### Verdicts on Your Cases Under PPMT

  1.  **Accept:** Passes 1, 2, 3 (harmless waste, not role misuse, no misrepresentation).
  2.  **Accept:** Passes 1, 2, 3 (harmless waste, anonymous avoids misrepresentation).
  3.  **Refuse:** Fails **3a** (Signing public letter under your name misrepresents your judgment/values).
  4.  **Accept? (Ambiguous):** *PPMT permits* because pen name avoids misrepresentation *to others* (**3a** satisfied). *Your ambivalence highlights:* Does this still violate integrity *to yourself*? PPMT focuses on *external* expression; if internal consistency is paramount, you'd need a stricter principle rejecting any endorsement, even anonymous. **PPMT verdict: Acceptable.**
  5.  **Refuse:** Fails **3b** (Canvassing is direct material contribution to harmful act).
  6.  **Refuse:** Fails **3b** (Funding litigation is material contribution to harmful act, even if anonymous).
  7.  **Refuse:** Fails **3c** (Selling a hiring vote alienates entrusted role-based judgment).
  8.  **Refuse/Walk Away:** Fails **2** (Not genuinely conditional).
  9a. **Refuse:** Fails **3b** (Paying is complicit in enabling/extorting abuse).
  9b. **Accept:** Passes 1, 2, 3 (His action shift is positive; your donation funds legal defence – unless you deem *that* significantly harmful, it passes **3b**; no misrepresentation; no role misuse).
  10. **Accept:** *PPMT permits* (Passes 1, 2, 3: Mowing lawn isn't complicity in his harmful writing (**3b**), no misrepresentation, no role misuse). *Tension with 6:* The difference is *directness of contribution*. In 6, your money *is* the fuel for the harm. In 10, your action (mowing) merely *frees his time*; his choice to use it harmfully is causally separate. PPMT draws the line at *direct, material contribution* to the harmful act itself. **Free Parameter:** Threshold for "significantly harmful" and "direct/material contribution" in **3b**.

  ### The Broker Case
  *   **PPMT Verdict:** **Permissible** to use the broker for a trade like Case 6.
      *   *Why?* It attempts to nullify **3b (Harm Complicity)**. Your diluted, escrowed, anonymous contribution is designed to be *causally impotent* and *non-material* to the harmful outcome. If successful, it removes the complicity objection. The "clean hands" feeling is psychological residue, not a violation under PPMT's **3b** as defined.
      *   *Your Intuition Conflict:* The "machine for manufacturing clean hands while harm happens" points to a possible **Collective Complicity Constraint**. PPMT doesn't include this. If you believe participating in such a system *enables harmful coordination* even if your *specific* contribution is impotent, you'd need to add a clause about enabling harmful systems/collectives. PPMT, as stated, focuses on the material causality of the *individual action* in the *specific trade*.

  ### Unlisted Cases

  1.  **Delusional Counterparty (Shrine Keeper):**
      *   Offer: He gives $X to bednets if you give $Y to shrine upkeep.
      *   **PPMT Verdict:** **Permissible** if it passes Conditions 1-3.
          *   His valuation is subjective. Your low probability of his belief being true doesn't invalidate the trade *for him*. Your contribution funds shrine upkeep, which you likely judge as wasteful, not *significantly harmful* (**3b**). It resembles Case 2. If you deemed shrine upkeep actively harmful (e.g., exploiting villagers), **3b** would block it.
      *   **Free Parameter:** Your threshold for judging an act "significantly harmful" (**3b**).

  2.  **Binding Future Judgment (e.g., "Vote for Policy Z in 3 years if I fund bednets now"):**
      *   **PPMT Verdict:** **Refuse** - Fails **3c (Role Alienation Constraint)**. Committing future judgment in a role (e.g., as a voter, committee member, executive) based on a prior deal alienates the duty to exercise that judgment based on the circumstances and reasons present *at the time*. It treats future judgment as a commodity to be traded now.

  ### What PPMT Cannot Accommodate & What You Might Abandon

  *   **Accommodates Well:** 1, 2, 3, 5, 6, 7, 8, 9a, 9b, 10. Provides framework for Broker, Delusional Trader, Future Judgment.
  *   **Tension/Ambiguity:**
      *   **Case 4 (Pen Name Letter):** PPMT permits it based on avoiding external misrepresentation (**3a**). *Your ambivalence* suggests you might hold a stricter **Internal Endorsement Constraint** – that *any* act of endorsement, even privately known and anonymous, violates your integrity concerning that cause. **To align with PPMT, you'd need to abandon your reluctance in Case 4.** Alternatively, amend PPMT's **3a** to include "or to yourself".
      *   **Case 10 vs. Case 6:** PPMT distinguishes them via directness of contribution to harm (**3b**). *Your surprise* suggests you see fungibility making them equivalent. **To align with PPMT, you'd need to accept that direct material contribution is a meaningful line.** Alternatively, abandon the distinction and refuse both (strengthening **3b**) or accept both (weakening **3b**).
      *   **Broker Case:** PPMT accepts it by dissolving **3b** via impotence. *Your "clean hands machine" intuition* suggests you might believe in **Collective Complicity**. **To align with PPMT, you'd need to accept the broker.** Alternatively, add a clause prohibiting participation in systems designed to facilitate harmful trades, even with impotent contributions.
  *   **Potential Abandonment Required:** To be consistent under PPMT, you should:
      *   **Accept Case 4** (Pen Name Letter).
      *   **Maintain the distinction between Case 6 (Refuse) and Case 10 (Accept)** based on directness of harm contribution.
      *   **Accept using the Broker** for Case 6-type trades.

  ### Summary of PPMT's Free Parameters
  1.  **Harm Threshold (3b):** What level of expected harm makes an action "significantly harmful"? (Continuous scale, requires your calibration).
  2.  **Directness/Materiality (3b):** How directly must your action contribute to the harm? (Does freeing resources count? PPMT says generally "no", as in Case 10).
  3.  **Scope of Misrepresentation (3a):** Does it cover only public expression, or also internal consistency/private knowledge? (PPMT focuses on public; Case 4 suggests you might lean towards including internal).

  PPMT prioritizes the *nature of your action* (its expressiveness, complicity, and role-alienation) alongside the gains and conditionality. It explains your core refusals (3, 5, 6, 7, 9a) and acceptances (1, 2, 9b, 10), resolves the broker case, and forces a decision on Case 4 and the Case 6/10 distinction. To adopt it fully requires accepting Case 4 and the direct/indirect harm contribution line.
