  - Accepting step (4) but denying step (5) means embracing causal abundance. Cost: makes causation explanatorily weak. 
  - Contrastivism (step (5) read charitably) saves objectivity but at the price of making causation interest-relative. Cost: conflicts with scientific realism. 
  - Normative restrictions (on step (3)) solve the explosion problem but risk circularity when explaining responsibility. 

  The step to reject: step (2). It falsely assumes omissions lack all causal features except counterfactual dependence. But omissions can have location (the gardener's shed where watering should have occurred), mechanisms (the absence of water flow in irrigation systems), and even powers (the plant's vulnerability as a disposition activated by lack). Crucially, step (2) ignores how omission-causes operate via enabling conditions - the gardener's omission wouldn't cause death without the plant's need for water. This avoids the other exits' costs: no need for normative primitives (which would undermine objectivity), no causal relativism (step (5) becomes unnecessary), and double prevention remains distinct (it involves active interference with preventers, whereas omissions are absences of sustainers). 

  Pricing alternatives: 
  - Normative restrictions: Makes causation hostage to moral norms, undermining its role in natural laws. 
  - Contrastivism: Renders causal claims non-objective, violating the user's need for responsibility to track mind-independent facts. 
  - Causal abundance: Turns causation into a trivial relation, useless for legal attribution. 
  - Cause/the cause distinction: Leaves step (2) unchallenged, still reducing omissions to mere difference-making. 

  Handling complications: Double prevention involves active processes (e.g., cutting a water line) with physical traces, unlike pure omissions. Norm-infection in causal judgments doesn't prove causation isn't objective; it may show we track norm-violating absences precisely because they're causally potent in contexts of duty. 

  This defense keeps omissions genuinely causal while avoiding metaphysics that would collapse positive causation or surrender objectivity.
answer: |-
  ### Diagnosis: Brainstorming the Exits  
  1. **Reject (2)** *Cost:* Must defend omissions as having causal powers/metaphysical substance despite lacking physical mechanisms. Risks inflating ontology with "negative events."  
  2. **Accept (3)-(4) but deny (5)** *Cost:* Embrace causal abundance—every omission *is* a cause—but deny this forces relativism. Requires explaining why explanatory practices aren’t arbitrary despite infinite causes.  
  3. **Contrastivist (5)** *Cost:* Make causation inherently interest-relative. Sacrifices objectivity (step 6); undermines causation’s role in “mind-independent” laws/counterfactuals.  
  4. **Normative restriction on (3)** *Cost:* Limit “causes” to norm-relevant omissions (duties, capacities). Conflates causation with responsibility; collapses explanatory power into pragmatics.  
  5. **Distinguish “a cause” vs. “the cause”** *Cost:* Accept (4) but insist singular claims are objective by isolating salient causes. Struggles with (5)’s worry: salience may still be interest-relative.  

  ### The Step I Reject: Step (2)  
  **Why it looks innocent:** It seems intuitive that omissions lack mechanisms—after all, an absence isn’t a physical process. The counterfactual test appears to be the *only* way to ground their causal relevance.  

  **Defense:**  
  Step (2) falsely equates omissions with *bare counterfactuals*. Omissions are not metaphysically empty; they are **dispositions grounded in actual structures of enabling conditions**. The gardener’s omission caused the plant’s death because:  
  - The gardener had a **duty and capacity** embedded in a concrete system (e.g., employment, irrigation infrastructure).  
  - The omission is a **sustaining cause**—it maintains a vulnerability (the plant’s dependence on water) that is as real as positive mechanisms.  
  - **Location/powers are relational**: The omission’s “location” is the gap in the expected causal chain (e.g., the dry soil where water should have been), and its “power” is the disposition of the system to degrade without intervention.  

  This rejects (2)’s claim that counterfactual dependence is *all there is*. Instead, omissions are causal in virtue of **actual, non-absent background conditions** (duties, capacities, dependencies). This blocks the slide to (4)’s explosion.  

  ### Pricing the Alternatives  
  - **Normative restriction**: Cheap fix for explosion (3), but conflates causation with blame. *Cost:* Undermines causation’s objectivity (step 6); makes causal facts depend on normative facts, which can’t explain pre-legal phenomena (e.g., a drought “causing” a wildfire).  
  - **Contrastivist (5)**: Resolves relativity by indexing to contexts. *Cost:* Abandons causal realism; can’t ground laws/counterfactuals (step 6) without circularity.  
  - **Causal abundance (accept 4, reject 5)**: Embrace infinite causes as objective. *Cost:* Makes singular causation explanatorily useless—law/science need discriminability.  
  - **“A cause” vs. “the cause”**: Pragmatic, but leaves (2) intact. *Cost:* Still can’t explain *why* some difference-makers are causal and others aren’t, inviting projectivism.  

  ### Handling Complications  
  1. **Double prevention**: Unlike omissions, double prevention involves *active interference* (e.g., cutting wires). It has mechanisms (energy transfer) and leaves traces, so explosion worries don’t generalize. Rejecting (2) for omissions doesn’t threaten positive causation.  
  2. **Norm-infection**: If norms shape causal judgments, this *supports* rejecting (2). Norms (e.g., duties) mark **objectively salient sustaining conditions**—e.g., the gardener’s duty reflects the plant’s *actual dependence* on them. Norms track, rather than create, causal structures.  

  ### Why This Saves Responsibility  
  Your account needs omissions to be causal *without* collapsing into pragmatism. By grounding omissions in actual dispositions/dependencies (rejecting (2)), causation remains objective—but only omissions tied to **structured capacities and vulnerabilities** qualify. The stranger’s non-intervention (step 3) isn’t causal because no actual dependence exists; the gardener’s is, because the system allocates responsibility. Result: Causation is discovered (not selected), and responsibility is secure.  

  **Final cost**: Commits to a metaphysics where absences are real (but not spooky)—grounded in positive dispositions and relational structures. Defensible, or your project fails.
