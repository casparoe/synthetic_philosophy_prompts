prompt: |-
  I have recently been seconded onto a small team redrafting my foreign ministry's guidance on when to support protection-of-civilians mandates, and the same case keeps being cited at me in opposite directions, so I want it worked through properly rather than gestured at. Take NATO's 2011 Libya intervention and analyze it through the doctrine it was sold under: the responsibility to protect, read together with the just-war categories it leans on (legitimate authority, last resort, reasonable prospect, proportionality, right intention, and a post-war responsibility to rebuild). The facts I want taken as given: Security Council authorization in March 2011 for a no-fly zone and all necessary measures short of foreign occupation, five abstentions including Brazil, Russia, China, India and Germany; Gaddafi's forces advancing on Benghazi after he threatened reprisals; a seven-month air campaign in which the coalition effectively became the rebels' air force; his killing at Sirte in October; then state fragmentation, a second civil war and a militia economy, and a much colder Security Council on Syria afterwards, with Brazil's responsibility-while-protecting formula and the Russia-China vetoes.

  Two things I want you to test rather than assume. First, a structural claim I have been toying with and cannot settle: that regime change in Libya was not mission creep or bad faith but was selected by the means the mandate permitted, since air power with no ground component cannot convert a temporary reprieve into a durable one (any ceasefire leaving the incumbent's armour and command intact simply re-creates the threat the mandate exists to remove), so a protection mandate plus stand-off air power plus no boots on the ground adds up to decapitation whether or not anyone intended it. Second, the symmetric hazard on the protected side: once an external air umbrella exists, the party being protected has an incentive to reject ceasefires and to leave its own civilians exposed, because the interveners' credibility is hostage to being seen to protect. Give me the disciplined mapping first: who the mandate-holder is, what the proportionality baseline is against (including the counterfactual massacre that never happened), what would count as success and as disengagement, and what the doctrine says the coalition should have done at each point. Then say which features of Libya R2P explains, which it has no vocabulary for (a protection force that becomes a belligerent, success conditions it cannot specify, a norm whose authority is spent by one selective use), and whether the episode is a confirmation, an anomaly, or a case the doctrine never contemplated. Say plainly where the theory is silent.
reasoning: |-
  Okay, let me approach this systematically. The user presents a sophisticated policy dilemma about Libya 2011 as an R2P test case, with two specific analytical challenges. They're clearly a practitioner needing rigorous doctrinal mapping rather than theoretical speculation.

  First, I need to reconstruct the legal and operational architecture: Security Council Resolution 1973 authorized "all necessary measures" to protect civilians, creating a mandate-holder (NATO-led coalition) with specific constraints (no occupation). The proportionality baseline is tricky - it must be measured against the imminent Benghazi massacre threat, but also against long-term destabilization risks. 

  The user's first hypothesis about structural regime change deserves special attention. Air power alone couldn't permanently neutralize Gaddafi's armor without degrading command structures, making decapitation logically necessary for protection. This isn't mission creep but physics of standoff warfare. The second hypothesis about rebel incentives is equally important - once NATO owned the skies, rebels had strategic reasons to avoid ceasefires that would freeze territorial gains.

  I notice three doctrinal silences in R2P: 
  1) No guidance for when protectors become belligerents by default 
  2) No metrics for successful disengagement absent stable institutions 
  3) No response for when selective application corrodes the norm itself (as seen in subsequent Syria vetoes)

  The Libya case falls between R2P's categories - it technically fulfilled the doctrine's criteria yet produced catastrophic aftermath. This suggests R2P never contemplated how regime vulnerability + standoff means + proxy warfare could create perverse outcomes even with perfect procedural compliance. The doctrine's blind spot is its state-centric assumption that removal of threat equals paved way for stability.

  For the user's policy drafting, the key insight is that R2P requires mechanical safeguards against structural regime change when standoff means are used. Brazil's "responsibility while protecting" formula attempted this by demanding ex ante accountability mechanisms - a reform direction worth exploring further.
answer: |-
  Here's a disciplined analysis of NATO's Libya intervention through the R2P/Just War lens, testing your hypotheses while mapping doctrinal adherence and silences:

  **Doctrinal Mapping**

  1.  **Legitimate Authority:**
      *   *Mandate-Holder:* UN Security Council (Resolution 1973). NATO became operational executor.
      *   *Test:* Explicit Chapter VII authorization for "all necessary measures... to protect civilians" (para 4) met R2P's "collective action through the Security Council" pillar. Abstentions didn't invalidate, but signaled geopolitical unease foreshadowing future paralysis.
      *   *Doctrinal Adherence:* Formal legitimacy achieved. R2P silent on operational command structure (coalition vs. UN).

  2.  **Last Resort:**
      *   *Baseline:* Gaddafi's Feb 2011 "no mercy" Benghazi speech, troops advancing on city, collapse of prior diplomacy/ceasefires.
      *   *Test:* Diplomatic efforts (AU plan, UN envoys) demonstrably failed as columns advanced. Coalition argued military action was final option.
      *   *Counterpoint:* Critics argue more time for sanctions/coercive diplomacy wasn't exhausted.
      *   *Doctrinal Adherence:* Plausible case met. R2P lacks clear metric for "exhaustion" of non-military options under imminent threat.

  3.  **Reasonable Prospect:**
      *   *Baseline:* Prevent imminent Benghazi massacre (primary), later extend to broader civilian protection.
      *   *Success Defined (Initially):* Halt attack on Benghazi, establish NFZ.
      *   *Disengagement Defined (Doctrinally):* R2P implied cessation when threat to civilians removed. Resolution 1973 offered no endpoint.
      *   *Reality:* Benghazi saved quickly (success). Threat persisted elsewhere as Gaddafi held power. Coalition saw regime change as *necessary* for durable protection. Disengagement never defined politically.
      *   *Doctrinal Gap:* R2P provides **no clear success condition or exit strategy** beyond halting the immediate atrocity crime. It doesn't define the "durable" removal of threat.

  4.  **Proportionality:**
      *   *Baseline Counterfactual:* Large-scale massacre in Benghazi (estimated 10,000-50,000 deaths warned by UK/France). Later expanded to ongoing repression under Gaddafi.
      *   *Means:* Air/sea power only. Avoided occupation.
      *   *Collateral Damage:* Relatively low immediate civilian deaths from strikes (estimates vary, ~70-100 documented by HRW). Significant damage to infrastructure.
      *   *Disproportionality?:* Compared to *imminent Benghazi massacre*, initial action proportional. Compared to *long-term consequences* (state collapse, civil wars, migrant crisis), proportionality becomes highly questionable. R2P focuses on *means* proportionality to *immediate objective*, not long-term strategic consequences.
      *   *Doctrinal Gap:* R2P **lacks a framework for assessing long-term strategic proportionality** or the risk of state collapse.

  5.  **Right Intention:**
      *   *Stated:* Protect civilians (Resolution 1973).
      *   *Implementation:* Shift to supporting rebels (strikes on armor retreating *from* frontlines, targeting command centers) became evident. Gaddafi's killing (post-capture) violated IHL.
      *   *Test:* Primary initial intent likely protective. Evolved into regime change as the perceived *only way* to fulfill the mandate durably. "Air force for the rebels" was a functional outcome.
      *   *Doctrinal Gap:* R2P has **no mechanism to police or measure intent drift** once intervention begins, especially when regime survival is seen as incompatible with protection.

  6.  **Responsibility to Rebuild:**
      *   *Doctrine:* ICISS (2001) emphasized post-conflict responsibility. UNGA 2005 Outcome Document soft-pedaled this.
      *   *Reality:* Minimal post-conflict planning/commitment. NATO ended mission days after Gaddafi's death. UN support mission (UNSMIL) was under-resourced. No major stabilization force.
      *   *Adherence:* Doctrine (ICISS) failed. Political will for "rebuild" was absent post-regime change. **R2P's "rebuild" pillar is its weakest and least operationalized.**

  **Testing Your Hypotheses**

  1.  **Structural Regime Change:**
      *   **Supported.** Stand-off air power *alone* could destroy Gaddafi's armor and command structure (essential to the threat), but couldn't create a stable alternative or enforce a ceasefire that left him in power. Destroying his military capacity functionally *required* destroying his regime. The mandate ("protect civilians") became operationally inseparable from regime change given the means available and the nature of the threat. This wasn't necessarily *initial* bad faith, but a **structural inevitability** of the mandate + chosen means + context.

  2.  **Symmetric Hazard (Protected Party Incentive):**
      *   **Plausible.** Evidence exists that rebels (NTC) rejected ceasefires (e.g., early April 2011 AU proposal) believing NATO air power guaranteed eventual victory. NATO's credibility *was* tied to preventing rebel defeats/civilian losses within areas they "protected," creating pressure to strike targets supporting rebel offensives and deterring compromise. R2P has **no concept or safeguard against moral hazard induced in the protected party.**

  **What R2P Explains (and Fails To)**

  *   **Explains:** The *initial threshold* for action (imminent mass atrocity), the *source of legitimacy* (UNSC), and the *initial military objective* (halt attack on Benghazi).
  *   **No Vocabulary For:**
      *   **Protector as Belligerent:** R2P assumes a neutral protective role. It has no framework for when the intervenor *becomes* a decisive belligerent force shaping the conflict outcome.
      *   **Undefined Success/Exit:** It doesn't define what constitutes "success" beyond halting the immediate crime, nor how to disengage safely without leaving a vacuum.
      *   **Norm Entropy:** It doesn't account for how selective application (Libya) or perceived overreach/abuse can rapidly deplete the norm's future authority (Syria vetoes, Brazil's "Responsibility While Protecting").
      *   **Means-Driven Ends:** It doesn't anticipate how available military means (stand-off air power) can structurally determine the political end-state (regime change), regardless of initial intent.
      *   **Moral Hazard:** It ignores incentives created for local actors by the intervention.
      *   **Post-Conflict Collapse:** Its "rebuild" pillar is theoretical and unenforceable.

  **Libya: Confirmation, Anomaly, or Uncontemplated?**

  Libya is primarily a **case the doctrine never fully contemplated.** R2P was conceived for halting mass atrocities (Rwanda, Srebrenica), not managing complex civil wars where the perpetrator is the state, the rebels are fragmented, and the only effective military tool inherently requires regime decapitation. It proved inadequate for:

  1.  **The "How":** Managing the operational and political realities of using stand-off force against a state perpetrator in a civil war.
  2.  **The "Then What":** Defining success and managing the aftermath when the state collapses.
  3.  **The "Next Time":** Preventing the norm's rapid corrosion due to perceived abuse and unintended consequences.

  **Where the Theory is Silent (Plainly):**

  1.  **What happens when the only militarily viable way to protect civilians requires regime destruction?** How does R2P reconcile its protective intent with this outcome?
  2.  **How do you disengage without abandoning civilians to renewed violence or state collapse?** What constitutes "durable" protection?
  3.  **How do you prevent the intervenor from becoming a decisive belligerent?** What rules constrain targeting when the opponent integrates military assets with civilian areas?
  4.  **How do you enforce the Responsibility to Rebuild?** Who pays, who leads, what if there's no will?
  5.  **How do you mitigate the moral hazard for the protected party?** How do you ensure they pursue political solutions?
  6.  **How do you prevent one controversial application from paralyzing the norm for future cases?** How is trust in the Security Council's application of R2P maintained?

  Libya exposed R2P as a powerful normative framework for *initiating* action, but a dangerously underdeveloped doctrine for *managing* intervention and its consequences in complex state-perpetrator civil wars. Your structural hypothesis about means-driven regime change and the symmetric hazard problem highlight critical operational and political dynamics entirely absent from the doctrine's core vocabulary. The episode stands less as an anomaly than a brutal stress test revealing fundamental limitations.
