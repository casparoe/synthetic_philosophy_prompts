prompt: |-
  You are a professional philosopher specialising in decision theory and the foundations of rational choice. Answer as a specialist would, and think carefully before you commit yourself: begin by listing five candidate concepts or labels that someone might reach for given what I describe below, without evaluating them at that stage; then check the arithmetic I sketch; then say which candidate fits best, why the others do not, and only at the end give me a name. I do not want a label; I want the carving. And please give me no references or reading list — I have no way to check them, and being told to go and read someone would be no answer at all.

  The background: I spent last night arguing with a friend about a case of the following shape. A large number of people, mutually anonymous, no repetition, no reputation, no communication, each receive the same one-shot offer: contribute, and it costs you one unit, while every other person who contributes puts 0.01 units in your pocket. Your contributing does nothing to anyone else; it is causally inert with respect to everyone else's payoff, and inert with respect to your own apart from the unit it costs you. My friend took the usual line: since your act changes nothing, there is no reason to perform it, and any argument to the contrary is self-deception. I found myself reaching for something I could not quite formulate, and I want to know whether the thing I was reaching for is a real thing with a name.

  What I was reaching for: suppose that, for whatever reason, whether you contribute is very slightly correlated with whether any given other person contributes — a correlation of 0.001, say, small enough that in a two-person case nobody would think it generated a reason for anything. If there are a thousand others, the correlation shifts the expected number of other contributors by about one, which is worth 0.01 to you, far less than the unit you pay. If there are a hundred thousand others, it breaks even. If there are a million, it is worth roughly ten units against a cost of one, and you should contribute. The verdict of the argument therefore flips purely with the size of the population, with the correlation and the payoffs held fixed. Check my arithmetic, and tell me whether the shift in the expected count really is about N times the correlation or whether I have the standardisation wrong.

  Five features of this make me think it is not just a familiar view wearing a hat:

  1. It needs no twinhood and no shared reasoning. The correlation could arise from something as mundane as everyone having read the same newspaper. So it is not the view — I believe it has a name something like super-rationality, and comes from a popular essay — on which you act as if you were choosing for everyone because you know the others reason exactly as you do.
  2. It does not restore causal efficacy. It is not an answer to the objection that your act makes no difference; it concedes that and changes the subject to what your act indicates. So it should not be confused with arguments that try to show that your vote or your contribution really does make a difference after all.
  3. The news seems to be borne by the aggregate rather than by any individual: learning that I contributed tells me something substantial about how many people contributed, while telling me almost nothing about whether you did. I do not know whether it is legitimate to add up a million negligible shifts in expectation and treat the sum as a reason.
  4. The verdict depends on which population I count — everyone in the city, everyone in the country, everyone who read the same newspaper, everyone facing a relevantly similar decision, my future selves — and I can see no non-arbitrary stopping point. That looks either like a reductio of the argument or like a sign that I have stated it badly.
  5. It generalises away from cooperation altogether. If my smoking is correlated, at 0.001, with each of a million independent small risks rather than with a single lesion, then by the same arithmetic I have an overwhelming evidential reason not to smoke, which is exactly the sort of reasoning that is supposed to be evidential decision theory's vice rather than its virtue.

  A friend who reads this literature muttered something about evidential cooperation in large worlds. I do not know whether that is a real phrase, and from the little I could gather it concerns whether an evidentialist can secure cooperation in a large one-shot prisoner's dilemma — near my case, but not, I think, the thing I have isolated, which concerns the aggregation of negligible correlations, the sensitivity of the verdict to how the population is individuated, and the fact that the argument survives with no similarity between the agents at all.

  So: does what I have described have an established name, and is it genuinely distinct from the neighbouring views? Tell me which nearby concept it is closest to, exactly how it differs from each, and whether the argument as I have stated it actually goes through. If nothing established fits, coin a name, give a precise definition, and give me the boundary cases the definition must get right — the correlation being exactly zero; the correlation being negative; the correlation being produced by a common cause I have already conditioned on; a population gerrymandered to include people whose acts do not affect me; and the case in which I already know with certainty what I am going to do. I would also like to know whether this is a real phenomenon, or whether I have merely confused is evidence of with makes more likely by an amount worth caring about.
reasoning: |-
  Hmm, the user is asking me to analyze a decision theory problem involving correlated contributions in a large population. They've described a scenario where each person's contribution costs them 1 unit but benefits others by 0.01 units per contributor. The key twist is a small correlation (0.001) between any two individuals' decisions.

  First, I need to list five candidate concepts someone might use to analyze this without evaluating them yet:
  - Evidential Decision Theory (EDT)
  - Causal Decision Theory (CDT)
  - Superrationality
  - Kantian categorical imperative
  - Statistical expected utility maximization

  Now for the arithmetic check. The user claims that with correlation ρ=0.001 and N others, the expected shift in other contributors is about Nρ. This is correct. The covariance between a person's decision and any other individual's decision is ρσ_Xσ_Y. Since decisions are binary (contribute or not), the standard deviation σ is √[p(1-p)] where p is the base probability of contributing. For simplicity if we assume p=0.5, σ=0.5. Then covariance is ρ*(0.5)*(0.5) = ρ/4. The expected shift per other person is covariance, so ρ/4 per person. This is approximately ρ when we ignore constants, which matches their claim. With N=1,000,000, expected shift is about 1,000 contributors, worth 10,000*0.01=100 units minus cost of 1, so net gain of 99 units.

  Now evaluating the candidates:
  - EDT fits perfectly because it cares about conditional expectations. When you contribute, you condition on that fact and update your expectation about others' behavior due to correlation.
  - CDT fails because it ignores correlations and focuses only on causal effects, which are zero here.
  - Superrationality requires symmetry and shared reasoning, which aren't necessary here.
  - Kantian reasoning depends on universalizability, not correlation.
  - Statistical EU maximization is too vague and subsumed by EDT.

  The phenomenon is real - it's about evidential relevance aggregating across many small correlations. Key boundary cases:
  - If correlation is exactly zero, effect vanishes
  - Negative correlation reverses the incentive
  - If common cause is conditioned on, correlation disappears
  - Gerrymandered populations without payoff relevance break the argument
  - If you know your action with certainty, no updating occurs

  This is distinct from nearby concepts. It's essentially about the aggregation of negligible evidential dependencies in large populations. I'll call it "Aggregated Evidential Relevance" to capture this phenomenon.
answer: |-
  ### Step 1: Five Candidate Concepts/Labels
  Without evaluation, here are five concepts someone might reach for:  
  1. **Evidential Decision Theory (EDT)**  
  2. **Superrationality**  
  3. **Causal Decision Theory (CDT)**  
  4. **Statistical Expected Utility**  
  5. **Correlation Neglect**  

  ### Step 2: Arithmetic Check  
  Your reasoning holds. Let:  
  - \( \rho = 0.001 \) (correlation between your contribution and any other person's contribution).  
  - \( N \) = number of other people.  
  - Each contributor (besides yourself) adds 0.01 units to your payoff.  

  The expected shift in the number of other contributors, given your contribution, is approximately \( N \cdot \rho \).  
  - **Derivation**: If \( X_i \) is the decision of person \( i \) (1 if contribute, 0 otherwise), the covariance between your decision \( Y \) and \( X_i \) is \( \text{Cov}(Y, X_i) = \rho \cdot \sigma_Y \sigma_{X_i} \). For binary decisions with mean \( p \), \( \sigma_Y \approx \sigma_{X_i} \approx \sqrt{p(1-p)} \). Assuming symmetry and \( p \) near 0.5, \( \text{Cov}(Y, X_i) \approx \rho / 4 \). The expected shift in \( X_i \) given \( Y=1 \) is \( \frac{\text{Cov}(Y, X_i)}{\sigma_Y^2} \approx \rho \) (since \( \sigma_Y^2 \approx 0.25 \)). For large \( N \), the total expected shift in contributors is \( \sum_{i=1}^N \rho = N\rho \).  
  - **Payoff impact**: Expected benefit = \( (N\rho) \cdot 0.01 \).  
    - Cost = 1 unit.  
    - Net expected payoff for contributing: \( (0.01 \cdot N \rho) - 1 \).  
  - **Threshold**: Net positive when \( N > \frac{1}{0.01 \cdot \rho} = \frac{1}{0.00001} = 100,000 \).  
  Your arithmetic is correct.  

  ### Step 3: Best-Fitting Concept  
  **Evidential Decision Theory (EDT)** fits best.  

  #### Why EDT?  
  - EDT evaluates acts based on the evidence they provide about outcomes. Here, contributing is evidence that others contribute (due to correlation), shifting expected payoffs.  
  - Matches your core insight: Your act indicates (but does not cause) others' acts, and in large populations, negligible correlations aggregate into significant expected gains.  
  - Directly addresses your focus on *what your act indicates* (not causation).  

  #### Why Others Fail:  
  1. **Superrationality**: Requires agents to symmetrically reason *as if* they are identical decision-makers. Your setup needs no shared reasoning or symmetry—correlation can arise from arbitrary common influences (e.g., a newspaper). Superrationality would demand you act as the "twin" of others; your argument does not.  
  2. **Causal Decision Theory (CDT)**: Ignores correlations and acts solely on causal effects. Here, your contribution *causally* does nothing (costs 1, helps no one). CDT would reject contributing; your argument endorses it in large \( N \).  
  3. **Statistical Expected Utility**: This is a tool, not a distinct theory. EDT *uses* this to calculate conditional expectations. Your argument is a specific *application* of EDT, not a new framework.  
  4. **Correlation Neglect**: This describes ignoring correlations, but your argument *exploits* them. It is the opposite.  

  #### Is It Distinct?  
  Yes. Unlike:  
  - Superrationality: No symmetry/identical reasoning required.  
  - Standard EDT discussions: Your focus on *aggregating negligible correlations in large populations* and *population-individuation sensitivity* is novel.  
  - "Evidential Cooperation in Large Worlds": This typically assumes agents share decision algorithms. Your correlation is exogenous (e.g., a newspaper), needing no agential similarity.  

  ---

  ### The Phenomenon: Definition and Boundary Cases  
  **Name**: **Aggregated Evidential Relevance (AER)**  
  **Definition**:  
  > When an act \( A \) by an agent is correlated with the acts of others in a large population, and the aggregate evidential effect of \( A \) on the expected utility from others' acts outweighs its direct cost, despite \( A \) having no causal efficacy.  
  **Key mechanism**: Negligible pairwise correlations \( \rho \) scale linearly with population size \( N \), making \( N\rho \) significant when \( N \) is large.  

  #### Boundary Cases (Testing the Definition):  
  1. **Zero Correlation (\( \rho = 0 \))**  
     - Expected shift in others' acts = \( N \cdot 0 = 0 \).  
     - Net payoff = \( -1 \) (cost).  
     - **AER verdict**: Do not contribute. Fits intuition.  
  2. **Negative Correlation (\( \rho < 0 \))**  
     - Expected shift = \( N \rho < 0 \).  
     - Net payoff: \( (N \rho \cdot 0.01) - 1 < 0 \) (worse).  
     - **AER verdict**: Stronger reason *not* to contribute.  
  3. **Common Cause Conditioned On**  
     - If you condition on the common cause (e.g., "I read the newspaper"), the residual correlation \( \rho \) vanishes.  
     - **AER verdict**: No evidential reason to contribute.  
  4. **Gerrymandered Population**  
     - If the population includes agents whose acts do *not* affect your payoff (e.g., people in another country), their inclusion in \( N \) is invalid.  
     - **AER verdict**: Only agents whose acts affect your payoff should count. Gerrymandering breaks if payoff-relevance is violated.  
  5. **Certainty of Own Action**  
     - If you know you will contribute (e.g., via precommitment), conditioning on \( Y=1 \) provides no new evidence.  
     - **AER verdict**: No evidential update. Contribute only if causal reasons exist.  

  ---

  ### Final Assessment  
  - **Is it real?** Yes. The effect is genuine: when correlations exist, your act *is evidence* (not a cause) of others' acts. Aggregation across \( N \) amplifies negligible correlations into decisive reasons.  
  - **Not confusion**: You correctly distinguish *evidence* from *causation*. The shift in expected utility is real and actionable under EDT.  
  - **Sensitivity to population individuation**: This is a feature, not a bug. It reflects that evidential relevance depends on *which reference class* you use. Rationality requires using a class where acts are payoff-relevant and correlations are meaningful (e.g., "people who read the same newspaper"). Arbitrary classes (e.g., "all humans alive") are invalid—only those whose acts affect your payoff.  
  - **Distinctiveness**: AER is a subcase of EDT, but its emphasis on correlation aggregation and population-dependence sets it apart from standard treatments. It is not superrationality, CDT, or causalist wishful thinking.  

  **Carving**: AER is the phenomenon where *evidential relevance scales with population size under correlation, overriding causal inefficacy in large-N dilemmas*. If you must coin a phrase, **Scaled Evidential Optimization** captures it—but **Aggregated Evidential Relevance** is precise.  

  ---  
  This completes the analysis. No references; pure carving.
