prompt: |-
  Last night a friend and I spent the better part of an evening arguing about affirmative action and quotas — the American university cases, the Scheduled Caste and Scheduled Tribe reservations in India, and Norway's statutory rule requiring a fixed share of board seats at large companies to be held by women. Her parting shot was that I am against every one of these schemes in principle and in favor of every one of them in practice. I don't think that is fair, but I couldn't say why in a way that satisfied either of us.

  I have been asked to circulate a short statement of my position before a policy workshop on selection procedures next week, and I would like it audited before I send it. Here is the package as I would write it down:

  1. A person should not gain or lose access to a competitive good because of ancestry, skin colour, or sex; what should decide is their individual qualification. That is my basic objection to quotas and the reason I am against them in principle.
  2. But I support the Indian reservations, at least as originally designed: a remedy for a structure of exclusion that is still operating, not a preference for a group as such.
  3. I also support the Norwegian boardroom quota and would like to see it copied elsewhere. I do not care whether it improves firm performance. The point is that a self-selecting network reproduces itself unless something forces it open.
  4. On American universities, I think the whole-file, individualized review that selective colleges used to practice was defensible in a way that a fixed bonus for race never was. What I object to is the mechanical version, not the noticing of race.
  5. I do not think the mismatch argument — that beneficiaries are placed where they cannot compete and do worse than they otherwise would have — is a good argument against any of this. It rests on contested social science, and if it were sound it would tell far more strongly against legacy and donor preferences, which I assume we are not defending.
  6. All of these should carry sunset provisions. A preference that becomes permanent has stopped being a remedy and become an entitlement, and that is where I would withdraw support.

  What I want is an audit, not a survey of the debate. Go through these pairwise and tell me which are genuinely in tension and which only look that way, since I would rather not revise something that is already fine. For the real tensions, say exactly what would have to give and how costly that revision would be, and rank them by severity rather than listing them as equally serious. Then name the single revision that would clean up the most, and tell me whether my friend's charge actually lands on any one of the six, or whether it is just a slogan. If I am relying on a distinction that won't bear the weight I am putting on it — between mechanical and holistic selection, say, or between a remedy and an entitlement — that is the most useful thing you could tell me.

  Assume I know the standard arguments on all sides; I do not need a literature review or any citations, since I will add references myself if the workshop wants them. Around nine hundred words would be ideal. Please write in American English.
reasoning: |-
  Okay, the user wants me to audit their position statement on affirmative action and quotas. They've outlined six points explaining their nuanced stance and want me to identify tensions, suggest revisions, and evaluate whether their friend's criticism holds water. 

  Hmm, this is a sophisticated policy thinker. They've clearly wrestled with this - opposing quotas in principle but supporting specific implementations. Their frustration at being called inconsistent shows they care about intellectual coherence. The workshop context suggests they need rigor, not rhetoric. 

  Let me map their positions: Principle opposes group-based allocation (point 1), but practice supports India's caste remedy (2), Norway's network disruption (3), and holistic race consideration (4). They reject mismatch arguments (5) and demand sunset clauses (6). 

  *scratches head* The core tension is between their universal principle and contextual exceptions. Point 1 declares ancestry/sex shouldn't matter, yet points 2-4 justify exactly such considerations. That's not necessarily contradictory - they're distinguishing between ideal vs non-ideal theory - but the burden is heavy. 

  *checks point 6* The sunset provision helps by making exceptions temporary, but "originally designed" for India (point 2) implies current reservations may exceed remedial intent. That's a landmine. Also, calling Norway's quota "not about performance" (point 3) but demanding sunsets for all (point 6) implies even successful interventions must end - that needs spelling out. 

  *notices subtlety* Their distinction between "mechanical" vs "holistic" in point 4 is smart, but risks hypocrisy. Why is a fixed gender quota (Norway) acceptable if fixed racial bonuses (US colleges) aren't? Probably because boards aren't merit-based like universities, but they don't say that. 

  *pauses* The friend's "against in principle, for in practice" jab does stick slightly. But it misses their key nuance: they oppose identity-based allocation unless it remedies exclusion (India), disrupts networks (Norway), or informs holistic judgment (US). The revision priority should be to explicitly name that unifying standard. 

  Biggest cleanup? Rewriting point 1 to specify that qualifications should be the sole criterion *absent countervailing reasons* like remediation or network exclusion. That 11-word insertion would resolve 80% of the tension. 

  *word count check* At 900 words, I'll need to be surgical. Skip academic debates, focus on internal coherence. American English means "color" not "colour". 

  Final thought: Their distinction between remedy and entitlement (point 6) is solid, but requiring sunsets for Norway-style quotas might undermine their own goal of permanent network openness. That's the costliest revision - they'd need to argue either that quotas become unnecessary once networks democratize, or that board diversity eventually becomes valued for performance. 

  *starts drafting* Will flag three severe tensions, one moderate, one minor. Recommend unifying principle revision first, then Norway-sunset clarification. Friend's charge is oversimplified but highlights a real gap in their framework.
answer: |-
  Here’s an audit of your position statement, identifying tensions, necessary revisions, and the cost of those revisions. I’ve prioritized revisions by severity (High, Moderate, Low) and pinpointed where your friend’s charge lands.

  ---

  ### **Core Tensions & Required Revisions**
  **1. Tension between Point 1 (Principle) and Points 2–4 (Practice)**  
  - **Severity: High**  
    Your principle (Point 1) states that ancestry, sex, or skin color should *never* influence access to competitive goods—only individual qualifications. Yet you support:  
    - Indian reservations (Point 2) *explicitly* based on ancestry/caste.  
    - Norway’s gender quota (Point 3) *explicitly* based on sex.  
    - U.S. holistic review (Point 4) where race is a factor.  
    **Revision Required:** Point 1 must acknowledge that **remedying systemic exclusion** (India) or **breaking self-replicating networks** (Norway) are ethically overriding objectives that *justify* temporary departures from pure merit.  
    **Cost:** Low. Add: *"except where necessary to dismantle persistent structural barriers or closed networks."*  
    **Why?** Without this, your principle contradicts your practice. The distinction isn’t "remedy vs. entitlement" (Point 6) but **when group-based measures are legitimate exceptions** to individual merit.

  **2. Tension between Point 3 (Norway) and Point 4 (U.S. Holistic Review)**  
  - **Severity: High**  
    You endorse Norway’s fixed gender quota (mechanical) but reject "fixed bonuses" for race in U.S. admissions (Point 4), praising only holistic review. This implies:  
    - Mechanical = unacceptable (U.S. race) vs. acceptable (Norway gender).  
    **Revision Required:** Clarify why mechanical quotas are justified for corporate boards but not universities. Argue that:  
    - Board seats lack objective merit metrics (unlike GPAs/test scores), making network exclusion harder to combat without quotas.  
    - Universities have viable holistic alternatives; boards do not.  
    **Cost:** Moderate. Requires 2–3 sentences explaining this **contextual distinction**.  
    **Why?** Without it, you appear inconsistent: "mechanical" isn’t inherently bad; its acceptability depends on the arena.

  **3. Tension between Point 2 (India) and Point 6 (Sunsets)**  
  - **Severity: Moderate**  
    You support Indian reservations "as originally designed" (temporary/remedial) but imply current policies may overextend (Point 6: "permanent entitlements"). Yet you don’t clarify if today’s reservations violate your sunset test.  
    **Revision Required:** Explicitly state whether current Indian reservations still qualify as remedial. If unsure, add: *"Reservations must demonstrate ongoing exclusion to retain legitimacy."*  
    **Cost:** Low. Sharpens your stance without new commitments.  

  **4. Point 5 (Mismatch) & Point 6 (Sunsets) – No Major Tension**  
    - Point 5 (rejecting mismatch) and Point 6 (sunsets) are compatible. Sunsetting avoids perpetual policies regardless of mismatch debates.  
    - **Status:** Logically sound. No revision needed.  

  ---

  ### **The Single Most Impactful Revision**  
  **Revise Point 1** to incorporate exceptions for systemic remedies and network disruption. This resolves the core contradiction and aligns your principle with practice:  
  > *"A person should not gain or lose access to a competitive good because of ancestry, skin color, or sex under fair conditions; what should decide is their individual qualification. However, temporary group-based measures are justified to dismantle persistent structural exclusion or disrupt self-replicating networks that prevent fair competition."*  

  **Why this cleans up the most:**  
  It bridges Points 1–4, turning apparent hypocrisy into a principled framework. India (structural exclusion) and Norway (network disruption) become *exceptions* to Point 1, not violations.

  ---

  ### **Does Your Friend’s Charge Land?**  
  **Yes—but partially.** The charge ("against in principle, for in practice") sticks **only to Point 1 as written** because it unconditionally rejects ancestry/sex as factors. However, your support for India/Norway/U.S. holistic review shows you *do* accept group-based measures under specific conditions.  
  - **Revision fixes this:** Once Point 1 acknowledges exceptions, the charge becomes a misrepresentation.  
  - **Slogan vs. Substance:** The charge oversimplifies but exposes a real flaw in your original phrasing—now resolved.

  ---

  ### **Distinctions Under Pressure**  
  1. **"Mechanical vs. Holistic" (Point 4):**  
     - This distinction *works* if you argue mechanical quotas are **context-dependent** (e.g., untenable in universities with measurable merit, viable in boardrooms without clear metrics). Without contextual justification, it collapses.  
  2. **"Remedy vs. Entitlement" (Point 6):**  
     - A strong distinction if tied to **empirical evidence of ongoing exclusion**. Sunset clauses force reevaluation. However, Norway’s goal (network disruption) may require sustained intervention—not necessarily sunsetting if exclusion persists.  

  ---

  ### **Summary of Revisions**  
  | **Point** | **Revision Required?** | **Severity** | **Key Change** |  
  |-----------|------------------------|--------------|----------------|  
  | 1 | **Yes** | High | Add exception for structural exclusion/network disruption. |  
  | 3 | **Yes** | High | Justify why mechanical quotas work for boards but not universities. |  
  | 2 | **Optional** | Moderate | Clarify if current Indian reservations meet "remedy" standard. |  
  | 4, 5, 6 | **No** | — | Logically consistent with revised framework. |  

  **Final Word Count:** ~850 (excluding this summary).  
  **Delivery:** Your revised position now coherently argues that **group-based measures are permissible only as targeted, temporary correctives to verifiable systemic failures**—making you *for them in principle when justified*, not against. This refutes your friend’s charge and preempts workshop challenges.
