prompt: |-
  Our union at the hospital voted to authorize a strike last week — I'm a resident, so this is personally awkward — and going through it I've realized my gut verdicts about other people's strikes don't add up to anything. So here they are. Nurses at a private hospital give ten days' notice, keep the ER covered, walk out over staffing ratios: fine. Sanitation workers wildcat with no notice in a heat wave, in breach of a contract their own union signed: not fine. Warehouse workers striking purely to get the company to recognize the union at all: fine. Delivery drivers refusing to cross a picket line at a completely different company, with no grievance against their own boss: fine, but I feel shaky about it. Hotel staff stopping work for two hours at a time, at random, for a month: not fine, feels like getting paid to sabotage. Everyone doing work-to-rule instead — strictly the job description and nothing more, output falls off a cliff: fine, feels almost elegant. Transit workers walking out the morning of the city marathon after rejecting an offer they privately think is decent: not fine, hostage-taking. Engineers striking to force their employer to cancel a defense contract: not fine, and I can't say why that's so different from the picket-line case. Dialysis clinic staff striking in a way that will foreseeably kill patients: obviously not fine.

  The only rule I've managed to articulate is that a strike is legitimate when the people eating most of the cost are the ones who can actually give you what you want. But that would greenlight the wildcat if it's mostly the city that suffers, and I said no to that. Is there a principle that gets most of this, what does it force me to drop, and what does it say about (a) me walking out as a resident with the union telling anyone who crosses that they're a scab, which I resent, and (b) three engineers at my brother's startup — the only three people who understand the deploy pipeline — all stopping work the morning of a launch?
reasoning: |-
  Okay, the user is a hospital resident whose union just authorized a strike, and they're wrestling with the moral inconsistencies in their gut reactions to different strike scenarios. They've listed very specific cases where their intuition says "fine" or "not fine," but they can't find a unifying principle. The core tension is personal: they resent being called a scab if they cross the picket line, but also feel uneasy about striking as a resident. Plus, they're extrapolating to their brother's startup scenario.  

  First, I need to unpack why their initial cost-bearing principle fails. They already noticed it approves the sanitation wildcat strike (which they dislike) because the city suffers most, but their objection there seems rooted in the breach of contract and no-notice chaos. That suggests their intuition values procedural fairness and predictability.  

  Looking at their examples, patterns emerge:  
  - **Notice/Contingency Plans:** They approve of nurses giving 10 days' notice and covering the ER. Disapprove of transit workers sabotaging the marathon morning.  
  - **Target Alignment:** Warehouse workers targeting their direct employer? Fine. Engineers protesting a defense contract (indirect target)? Not fine.  
  - **Collateral Harm:** Dialysis clinic killing patients is obviously over the line, but even the hotel's random two-hour stoppages feel like "sabotage" because harm is diffuse and non-strategic.  
  - **Solidarity vs. Self-Interest:** They're fine with delivery drivers honoring a picket line (solidarity) but balk at the engineers' political strike. Why? Probably because solidarity still pressures an employer (the drivers' boss loses revenue if they stop), whereas the engineers are imposing costs unrelated to labor terms.  

  Their "work-to-rule" example is telling—they call it "elegant" because it's passive resistance with minimal collateral damage. That highlights how much they value *contained* harm.  

  For their personal dilemma (a): As a resident, they’re caught between resentment of union pressure and awareness that their strike (unlike dialysis) likely won’t kill anyone. The principle would say: if the hospital can avert harm by conceding, the cost is rightly on management. But their discomfort might stem from feeling weaponized—especially since residents have less power than the union.  

  For the startup (b): Three engineers walking out pre-launch is "not fine" by their schema because it’s disproportionate (tiny group exploiting leverage) and possibly vindictive (no notice). But unlike the dialysis case, no lives are at risk—just business disruption.  

  What principle threads this needle? **"Proportional pressure with minimized and justified harm."** It’d reject:  
  - The wildcat (no notice, breaks contract)  
  - Hotel chaos (harm untargeted)  
  - Transit marathon strike (disproportionate suffering)  
  - Engineers’ defense protest (misaligned target)  
  - Dialysis (unacceptable harm)  

  But it’d accept:  
  - Nurses (contained harm)  
  - Warehouse unionization (direct goal)  
  - Delivery-driver solidarity (pressure via employer)  
  - Work-to-rule (non-disruptive)  

  For (a): Their strike is legitimate *if* the union minimizes patient harm and targets the hospital. Crossing the line isn’t "scabbing" if patient safety demands it—but the union should plan for that. Their resentment is valid if the union shames essential workers.  

  For (b): The startup engineers’ move is hostage-taking. Disproportionate and harms an employer who might not even control their grievance. Feels dirty because it exploits leverage without notice.
answer: |-
  Your gut reactions reveal a nuanced ethical framework—one that's grappling with **accountability, proportionality, and collateral harm**. Your "cost-bearing" rule is a start, but it fails when the *method* of imposing costs feels unjust or misaligned. Here's a synthesized principle that fits most of your judgments, with its trade-offs:  

  ---

  ### **Core Principle**:  
  **A strike is legitimate when it (1) targets the decision-maker responsible for the grievance, (2) minimizes unavoidable harm to uninvolved parties, and (3) uses pressure proportional to the goal.**  

  ### **How It Works**:  
  - **Target Alignment**: The harm must fall primarily on the entity that can resolve the dispute (e.g., employer, client). If harm spills onto bystanders who lack power to fix the problem, it feels exploitative.  
  - **Harm Mitigation**: Strikes should avoid life-threatening, chaotic, or gratuitous harm—even to the target—unless justified by an existential threat.  
  - **Proportionality**: The disruption should fit the goal (e.g., a wildcat over unsafe conditions might warrant more urgency than a work-to-rule over vacation days).  

  ---

  ### **Reconciling Your Examples**:  
  | Your Judgment | Strike Example | Why It Fits (or Not) |  
  |---------------|----------------|----------------------|  
  | ✅ Fine | Nurses (10-day notice, ER covered) | Targets hospital; harm minimized; proportional to staffing crisis. |  
  | ❌ Not fine | Sanitation wildcat (no notice, heat wave) | Harms public (not the decision-maker); no mitigation; breaches contract (accountability failure). |  
  | ✅ Fine | Warehouse workers (for union recognition) | Directly targets employer; proportional to foundational rights. |  
  | ✅ Fine (but shaky) | Delivery drivers (refusing cross picket line) | Targets *their* employer (who profits from struck work); minimal direct harm. *(Your shakiness: Feels indirect, but aligns with labor solidarity as a valid tactic.)* |  
  | ❌ Not fine | Hotel staff (random 2-hr stoppages) | Harm is untargeted (guests ≠ decision-makers); feels sabotage-like because disruption exceeds pressure needed. |  
  | ✅ Fine | Work-to-rule ("elegant") | Targets employer via productivity loss; zero collateral harm; morally "clean." |  
  | ❌ Not fine | Transit workers (marathon morning) | Deliberately maximizes public harm (hostages); decision-makers (city) could concede earlier. |  
  | ❌ Not fine | Engineers (against defense contract) | Misaligned target: Employer may not control contracts; harm (national security?) unrelated to labor dispute. |  
  | ❌ Not fine | Dialysis staff (foreseeable deaths) | Unacceptable collateral harm; violates medicine's ethical bedrock. |  

  **What You Must Drop**:  
  1. **The wildcat sanitation strike**: If the city (suffering most) *is* the employer, your principle *would* greenlight it—but you rejected it because of the breach of contract and no notice. **Trade-off**: You prioritize procedural accountability over pure "cost-bearing."  
  2. **Absolute solidarity**: You accepted delivery drivers honoring a picket line, but not engineers protesting a defense contract. **Why?** The drivers' action *indirectly* pressures their employer (who benefits from the struck work), while the engineers' strike is a political protest detached from labor rights.  

  ---

  ### **Applying the Principle to Your Dilemmas**:  
  **(a) Your hospital strike as a resident**:  
  - **Legitimacy**: Likely **✅ fine** under this principle.  
    - *Target*: The hospital (decision-maker) bears costs via disrupted services.  
    - *Harm mitigation*: Unions typically exempt emergency care; discuss with colleagues how life-threatening cases are covered.  
    - *Proportionality*: Staffing/safety grievances justify disruption.  
  - **Your resentment ("scab" labeling)**: This is a **tactic issue**, not a legitimacy flaw. Unions use social pressure to deter defections, but it can feel coercive. Ethically:  
    - Crossing is defensible if patient lives demand it—but collective action relies on unity.  
    - Your discomfort highlights medicine's dual loyalty: to patients *and* peers. **Ask your union**: "How do we ensure no patient is harmed? If I cover emergencies, am I still a 'scab'?"  

  **(b) Your brother’s startup engineers (walking out pre-launch)**:  
  - **Legitimacy**: **❌ Not fine** under this principle.  
    - *Target alignment*: The startup (decision-maker) suffers, but the harm is disproportionate and targets a non-unionized, high-stakes context.  
    - *Harm mitigation*: No notice maximizes collateral damage (investors, clients, brother’s livelihood).  
    - *Proportionality*: Unless their grievance is existential (e.g., wage theft), exploiting unique leverage feels like hostage-taking.  
  - **Key difference from transit strike**: Here, only 3 people hold power—a **"micro-monopoly"**—making the strike feel like blackmail, not collective bargaining.  

  ---

  ### **The Forcing Function**:  
  This framework forces you to:  
  1. **Accept social responsibility**: Strikes aren't neutral tools; their moral weight depends on *how* harm is allocated. (e.g., Your "no" to dialysis strikes.)  
  2. **Drop blanket solidarity**: Not all cross-company actions are equal; only endorse them when they pressure *your* employer meaningfully.  
  3. **Embrace nuance**: "Fine" strikes can still feel uncomfortable (e.g., delivery drivers), while "not fine" ones (startup engineers) may have sympathetic grievances.  

  **Final Thought**: Your instincts are ethically coherent—they just needed articulation. In medicine, where harm is tangible, your bar for "proportional harm" is rightly high. Discuss mitigation plans with your union to ease your discomfort. For your brother: This principle calls the engineers' bluff—their move is strategic cruelty, not justice.
