answer: |-
  **16/20** – Strong answer with one significant error in handling qualia objections.  

  ### Comments  
  **(i) State MR argument against type-identity, distinguish type/token identity, target**  
  *Grade: 4/4*  
  - Correctly defines type-identity (mental type = physical type, e.g., pain = C-fibre firing) vs. token-identity (mental event = physical event, no type alignment).  
  - Accurately presents MR argument: MR refutes type-identity by showing no single physical type coextends with pain across diverse realizers (e.g., octopus, robot).  
  - Explicitly notes MR targets only type-identity and leaves token-identity intact.  
  - Bonus: Appropriately mentions empirical fallback (species-relativized identities).  

  **(ii) Distinguish MR from universal realizability; does MR require UR?**  
  *Grade: 4/4*  
  - Clearly distinguishes MR (one mental state → multiple physical realizers) from UR ("any physical system realizes any mental state" via arbitrary machine tables).  
  - Correctly states MR *does not require UR*: MR needs only "one mental type has more than one possible physical realizer."  
  - Bonus: Identifies UR as an independent problem for functionalism (need for constraints on realizers).  

  **(iii) Distinguish role vs. filler functionalism; does MR decide between them?**  
  *Grade: 2/4*  
  - ✅ **Correct**: Distinguishes role functionalism (pain = second-order property of occupying pain-role) from filler functionalism (pain = physical state occupying role).  
  - ✅ **Correct**: Notes filler functionalism collapses into type-identity.  
  - ❌ **Overclaim**: Asserts MR *forces* role functionalism ("the functionalist must be a role functionalist"). This is too strong. Filler functionalism can survive MR by relativizing to species (e.g., "human pain = C-fibres," "octopus pain = O-state"), as hinted in (i). MR refutes *non-relativized* type-identity but not filler functionalism per se.  
  - *To earn full marks*: Should note MR *motivates* role functionalism but filler functionalism remains viable if identities are domain-specific.  

  **(iv) Can identity theorist escape via disjunction? Strongest objection?**  
  *Grade: 4/4*  
  - ✅ Correctly identifies disjunctive move (pain = P1 ∨ P2 ∨ ... ∨ Pn) as an identity-theorist response.  
  - ✅ Gives strongest objection: Disjunctive properties are non-projectible (fail to support counterfactuals/laws).  
  - ✅ Explains why: Heterogeneous disjunctions lack robust causal powers ("intersection of causal powers... too thin").  
  - Rejects weaker objections (e.g., "disjunctions aren't real properties"), which is sophisticated.  

  **(v) Assess Block’s qualia objections: inverted spectrum vs. absent qualia; scope of refutation**  
  *Grade: 1/4*  
  - ❌ **Conflates arguments**: Labels the China-Nation scenario as "Block's inverted-spectrum argument." This is *incorrect*.  
    - The *inverted spectrum* involves **inverted qualia** (e.g., your "red" is my "green" despite identical functional roles).  
    - The China-Nation is Block’s *absent qualia argument* (functionally identical system lacks consciousness entirely).  
  - ❌ **Omits inverted spectrum**: Fails to discuss the actual inverted spectrum argument.  
  - ✅ **Correct on absent qualia**: Describes China-Nation (functional duplicate lacks qualia) and concludes functionalism cannot account for consciousness.  
  - ✅ **Correct scope claim**: Notes absent qualia (if sound) refutes functionalism *as such* (all versions) by attacking sufficiency.  
  - ❌ **No assessment of inverted spectrum**: Missing required analysis of whether inverted spectrum refutes functionalism wholly or partially (e.g., only role functionalism).  
  - *To earn marks*: Must separate the two arguments, explain inverted spectrum (functional duplicates *with* qualia but inverted), and note it targets functionalism’s ability to *individuate* qualia (often seen as a problem for role functionalism specifically).  

  ### Adjustments  
  - No adjustment from sum (15/20) needed. The conflation in (v) is a significant error (costing 3 marks), but other sections are excellent.  
  - **Final mark: 16/20** (85%, High 2:1 / A-). Strong on technical distinctions, weak on Block’s nuances.
