answer: |-
  Your dissection of this decades-old stalemate is remarkably precise—and your "procedural overlap" hypothesis is a genuinely insightful framing. The dispute is **both substantive and verbal**, with multiple entangled questions masquerading as one. Below is a layered diagnosis, building on your analysis:

  ### 1. **The Verbal Core: What "One-Shot" Stipulates**
     - **The Stipulation Trap**: Camp 1 defines "one-shot" *by fiat* to include causal independence. Camp 2 argues this *assumes* a contingent metaphysical claim (atomistic agency) that may not hold. Your evolutionary theorist is correct *if and only if* we accept Camp 1's definition as canonical. But that definition smuggles in a controversial premise: that agents are "causally firewalled" even when procedurally identical.
     - **Resolution**: This *is* verbal—about what "one-shot" normatively *should* exclude. Progress requires disentangling "no future interactions" (temporal) from "no shared causal influences" (metaphysical). The latter isn't inherent to "one-shot"; it's an auxiliary assumption.

  ### 2. **The Substantive Layers: Three Collapsed Questions**
     - **A. Rationality of Act-Tokens (Camp 1's Domain)**  
       *Formal disagreement*: Camp 1 adopts Savage-style decision theory, where acts are individuated by causal consequences, and counterfactuals assume independence ("what if *I* defect while *they* cooperate?"). Dominance reasoning holds. **Burden**: Camp 1 must defend why *this* formalism applies universally—especially when agents know they are symmetric.
     - **B. Fitness of Rule-Types (Camp 2's Evolutionary Focus)**  
       *Normative/empirical disagreement*: Camp 2 shifts to evolutionary time scales, where selection acts on strategies (e.g., "always cooperate if identical"). Here, "rationality" means fitness-maximization for the *rule*, not the act. **Burden**: Camp 2 must justify why the act-token question is ill-posed or irrelevant to evolved agents.
     - **C. Advice for Rule-Choosing Agents (The Overlooked Layer)**  
       *Hidden normative question*: What should a *meta-rational* agent do when designing their own decision procedure? (e.g., "Should I hardwire cooperation if I know my clone faces the same choice?"). This bridges individual rationality and evolutionary fitness. **Burden**: Neither camp addresses this directly.

  ### 3. **Your Overlap Parameter: Keystone, Not Novelty**
     - **Its Value**: Procedural overlap (shared causes in decision processes) *is* the crux. It dissolves the dispute by indexing solutions to a continuum:
       - **θ=0 (Full Independence)**: Camp 1 dominates → defect.
       - **θ=1 (Perfect Overlap)**: Camp 2 dominates → cooperate (only mutual outcomes possible).
       - **0<θ<1**: Mixed equilibria, correlated strategies.
     - **Relationship to Known Concepts**:  
       - It generalizes "assortment" (population structure) to the *within-encounter* level.  
       - It formalizes "team reasoning" (shared agency) as a limit case (θ→1).  
       - It quantifies the "shadow of similarity" paralleling the "shadow of the future".
     - **The Evolutionary Theorist's Objection**: True, classical "one-shot PD" *stipulates* θ=0. But your point exposes that this stipulation *begs the question* against Camp 2. **Progress lies in recognizing θ is often non-zero empirically**, even without future interactions (e.g., genetic identity, shared culture).

  ### 4. **Where the Burden Lies**
     - **Camp 1** must defend why θ=0 is the *only* rational default. If real agents have θ>0 (due to neurobiology, evolution, or common knowledge of symmetry), insisting on θ=0 is ungrounded.
     - **Camp 2** must justify abandoning act-level rationality or show that θ=1 is realistic. Arguing for cooperation *requires* establishing sufficient overlap (θ high enough to break dominance).

  ### 5. **Paths to Progress**
     - **Theorems**: Formalize θ in a generalized PD (e.g., linking overlap to correlated equilibrium payoffs). Show how θ>0 alters dominant strategies.
     - **Experiments**: 
       - *Behavioral*: Test cooperation rates under varying θ (e.g., identical twins vs. strangers; AIs with shared RNG seeds).
       - *Computational*: Evolve agents where θ is mutable—does selection favor adjusting θ or exploiting it?
     - **Conceptual**: Distinguish:
       - *Temporal* one-shot (no future)  
       - *Causal* one-shot (θ=0)  
       - *Epistemic* one-shot (no knowledge of similarity)  
     - **Shift Focus**: For evolved agents, the key question isn't "what act is rational?" but "what decision architecture maximizes fitness *given typical θ in my environment*?"

  ### 6. **Your Fluid Mechanics Analogy: Apt and Illuminating**
     - **Iterated Case**: Just as high continuation probability expands equilibrium sets, high θ shrinks the effective strategy space (toward mutual cooperation or defection). In both, **dynamics dominate statics**:
       - With high θ, initial conditions (e.g., evolved dispositions) determine outcomes faster.
       - With low θ, stochastic drift matters more (e.g., random variation in aggression).
     - **False Analogy?**: Unlike fluid equations, game-theoretic "equations" (rationality criteria) *are* contested. But your core insight holds: **When constraints (θ or continuation probability) change, the explanatory locus shifts.** At θ≈0, act-level rationality explains; at θ>0, evolutionary/learning dynamics explain *why* agents have cooperative dispositions.

  ### Diagnosis Summary
  | **Aspect**              | **Diagnosis**                                                                 |
  |--------------------------|------------------------------------------------------------------------------|
  | **Core Dispute**         | Verbal (definition of "one-shot") + Substantive (formalism for interdependence) |
  | **Key Parameter**        | Procedural overlap (θ) — valid and indispensable for resolution               |
  | **Burden of Proof**      | Camp 1: Defend θ=0 as universal; Camp 2: Defend θ>0 as relevant               |
  | **Progress Mechanism**   | Theorems/experiments with θ as variable; disentangling causal vs. temporal one-shot |
  | **Fluid Analogy**        | Valid: θ acts like a dimensionless number setting the "rationality regime"     |

  **Conclusion**: Your hypothesis isn't refuted—it's essential. The objection that "one-shot implies θ=0" reveals the verbal trap. The deeper issue is that **rationality debates cannot escape metaphysics**: How connected are minds? Until we quantify θ empirically (e.g., in neurology or ethology), the dispute will persist. You've identified the fault line; now it needs measurement.
