  Regarding procedural overlap, it’s useful but not entirely new—similar to correlation in population genetics or precommitment in team reasoning. However, framing it as a continuous parameter could help, even if the strict one-shot case assumes zero overlap. The key is recognizing that real-world scenarios often have some overlap, making the pure case an idealization.

  On the equilibrium vs. dynamics point: In iterated games, dynamics matter as much as equilibria. Similarly, in the one-shot debate, the focus should shift to how procedural overlap arises in nature (e.g., neurobiology of decision-making) rather than insisting on a single rational outcome.

