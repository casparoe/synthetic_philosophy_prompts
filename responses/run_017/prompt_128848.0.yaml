prompt: |-
  For a profile I'm writing on Dr. Miriam Alderton, a bioethicist who has spent six years on the national commission that reviews any proposal involving payment for bodily material or bodily services, I have been trying to work out what principle she is actually running, because her voting record does not match the soundbite she is usually quoted for. Her positions, as best I can reconstruct them from the commission's published opinions, from two dissents she wrote, and from a long interview she gave to a medical journal: she has defended compensated plasma donation by for-profit centres, on the ground that the people who sell plasma are not dupes and that there is no alternative supply; she has voted to permit compensation for egg donors provided it is capped and cannot be scaled to the donor's characteristics; she has approved modest payments to healthy volunteers in early-phase drug trials for time and burden; she opposes commercial gestational surrogacy even where the surrogate is well paid, independently counselled and under no financial pressure; she has twice voted against any market in kidneys from living vendors; she described cash-for-sterilisation schemes aimed at poor women as the clearest case of a market that should not exist; she would criminalise vote buying and vote selling; she supports laws against disaster price gouging; and she would prohibit reselling tickets or queue positions for free public museums and civic hearings. I have been reading around in the literature she cites — the noxious markets framework, the blocked exchanges tradition, the personhood-based inalienability arguments — and each of them seems to fit one part of her record and strain badly on another: if it is the sheer fact of the body being sold, why are plasma and eggs fine? If it is that the badly off are pushed into it, why is paid trial participation fine? If it is that prices corrupt a gift relation, why is that not true of eggs as well?

  The item on next month's agenda, which I will be in the room for, is a government-run living-donor benefit that is designed to give each of those objections as little to bite on as possible. Nothing is bought or sold between private parties and no price is ever negotiated: the national transplant authority would offer every living kidney donor an identical statutory package — a small inflation-indexed annuity paid monthly over twenty years rather than a lump sum, free lifetime follow-up care and insurance cover for donation-related complications, and a transferable family credit that would move one named relative up the waiting list if that relative ever needs a kidney. Eligibility is not means-tested in either direction, there are no brokers or intermediaries, donation cannot be directed to the person who would benefit from the credit, and there is a mandatory cooling-off period with independent counselling and a formal psychological assessment. Her commission has rejected cash payment to living vendors twice, so on the face of it the answer looks easy, but the package has no price, no market and no haggling, and I genuinely cannot tell whether she will treat that as the removal of the objection or as a cosmetic change to it.

  What I want, before I put this to her in our last interview, is help reconstructing the machinery rather than the verdict. What is the rule that generates her whole track record at once, and what are the other rules that fit those same verdicts equally well? What does each of those candidate rules predict about this donor-benefit proposal specifically — including the deferred annuity, the absence of any price, and the family credit, which introduces a third party who may now have an interest in someone else's kidney? Which of those rules is the best guess for what she is actually running, and why, given that she is not a paternalist about the poor in the plasma case and not a sentimentalist about the body in the gametes case? And what single hypothetical should I put to her that would separate the surviving rules cleanly, ideally one she has not been asked a hundred times already — a version with strictly in-kind and non-transferable benefits, an identical package offered for non-directed bone marrow or liver-lobe donation, a version in which a private philanthropy rather than the state funds it, or something I have not thought of? If it helps, say which parts of her record are doing the most work in pinning the rule down and which are nearly cost-free for her to hold.
reasoning: |-
  Hmm, this user is writing a profile on Dr. Miriam Alderton, a bioethicist on a national commission regulating payment for bodily materials and services. The user is struggling to identify the underlying principle behind her seemingly inconsistent voting record. 

  Let me analyze her positions systematically: She approves compensated plasma donation and capped egg donor payments but opposes commercial surrogacy, kidney markets, cash-for-sterilization, vote buying, price gouging, and ticket scalping. The user notes that existing frameworks (noxious markets, blocked exchanges, personhood arguments) only partially explain her stance.

  The immediate puzzle is her upcoming vote on a government-run living-donor benefit package. It's structured to avoid typical objections: no cash payment, no private transactions, fixed non-negotiable benefits including annuity, healthcare, and a transferable family transplant credit. The user needs to predict her position.

  Key tensions in her record:
  - Allows bodily commodification in plasma/eggs but not kidneys/surrogacy
  - Permits trial participation payments despite poverty concerns applying elsewhere
  - Accepts egg compensation despite potential corruption of "gift" relationships

  Her rejection of paternalism (plasma) and non-sentimentalism (gametes) rules out simple explanations. The family credit in the kidney proposal introduces new complexity - a third party benefiting from donation.

  Possible unifying principles:
  1) **Structural Vulnerability Principle**: Focuses on whether the transaction exploits pre-existing vulnerabilities (poverty, desperation) that distort consent. Explains plasma (no alternative supply) vs. sterilization (targeting poor women).
  2) **Irreversible Bodily Harm Principle**: Draws line at procedures causing permanent, significant bodily alteration/risk. Accounts for kidneys/surrogacy vs. plasma/eggs.
  3) **Relational Commodification Principle**: Concerned when market logic corrupts essential social relations (family in surrogacy, democracy in vote selling, communal trust in disaster pricing).

  For the kidney proposal evaluation:
  - Structural Vulnerability: Might approve since eligibility isn't means-tested and benefits are fixed/deferred
  - Irreversible Harm: Likely still oppose due to permanent kidney loss
  - Relational Commodification: Would reject because family credit introduces calculative logic into kinship

  The family credit is particularly problematic for the relational view - it literally makes family relationships part of the benefit calculus. A good test question would be: "Would you support the same package for non-directed bone marrow donation (reversible)?" This separates harm-based from relation-based objections.

  Most diagnostic positions:
  - Supporting plasma donation despite poverty links shows she's not purely vulnerability-focused
  - Opposing surrogacy despite financial safeguards indicates deeper relational concerns
  - Approving egg payments while capping amount reveals her comfort with regulated bodily markets

  The user should also consider asking about a modified version with strictly personal, non-transferable benefits to isolate the family credit issue. Her reaction would clarify whether relational corruption or irreversible harm is her true barrier.
answer: |-
  Based on her record and the tensions you've identified, Dr. Alderton appears to operate on a **Relational Commodification Principle**, not a bodily integrity or vulnerability principle alone. Her core concern seems to be preventing market logic from corrupting essential *social relations and institutions*. Here's the breakdown:

  ### The Rule Generating Her Record
  - **Core Principle**: Markets are impermissible when they commodify relationships/roles fundamental to social flourishing (family, citizenship, bodily integrity as social trust), especially where this introduces calculative exchange into domains requiring non-instrumental regard.
  - **Mechanism**: 
    1. **Identifies the social sphere threatened**: e.g., kinship (surrogacy, family credit), democratic equality (vote selling), communal trust in crises (price gouging), civic participation (museum queues), bodily wholeness as social baseline (kidneys).
    2. **Assesses commodification risk**: Does payment introduce instrumental calculation into a relationship/institution that must resist it? (e.g., surrogacy commercializes gestation; vote selling commercializes citizenship).
    3. **Allows exceptions only when**: 
       - There is *no alternative* to market supply (plasma) 
       - Payments are *capped and de-linked from personal traits* (egg donors), reducing auction-like dynamics
       - Transactions are *time/burden compensation* without implicating core relationships (drug trials)

  ### How This Explains Her Positions
  | **Position** | **Alignment with Principle** |
  |--------------|------------------------------|
  | **Plasma/egg payments** | Permissible: Bodily material without permanent sacrifice; no kinship corruption. Plasma has supply necessity; eggs capped to prevent trait auctioning. |
  | **Drug trial payments** | Permissible: Compensates time/burden; doesn’t commodify a social role. Healthy volunteers aren’t "selling" a relational function. |
  | **Commercial surrogacy** | Forbidden: Commodifies gestation—a core familial/kin relationship. Payment introduces instrumental logic into creation of human life. |
  | **Kidney markets** | Forbidden: Commodifies bodily wholeness as a social baseline. Risk of reducing the body to alienable property. |
  | **Cash-for-sterilization** | Forbidden: Targets vulnerable groups, corrupting reproductive autonomy into a calculative transaction. |
  | **Vote buying** | Forbidden: Commodifies citizenship, undermining democratic equality. |
  | **Price gouging** | Forbidden: Exploits communal vulnerability during disasters, corrupting social trust. |
  | **Ticket reselling** | Forbidden: Commodifies civic/cultural access, undermining equal participation. |

  ### Predictions for the Kidney Benefit Proposal
  - **The Package**: She likely sees this as **covert commodification** despite cosmetic changes:
    - **Deferred annuity**: Still a financial incentive, making the body a retirement asset.
    - **Family credit**: *Most problematic*. Introduces third-party interest in another's body (kinship corruption). Turns familial love into calculative gain ("My nephew should donate so I get priority").
    - **State administration**: Reduces broker exploitation but doesn't eliminate commodification logic.
  - **Her Probable Vote**: **Against**. The family credit alone likely violates her core rule by commodifying kinship. The annuity, while deferred, still frames the kidney as a financial instrument.

  ### Alternative Rules & Why They Fail
  1. **Structural Vulnerability Principle** (focus on exploitation of the poor): 
     - *Fits*: Sterilization schemes, surrogacy bans.  
     - *Fails*: Allows plasma/drug trials where poverty might incentivize participation; doesn't explain vote selling or museum queues.
  2. **Irreversible Harm Principle** (focus on permanent bodily loss): 
     - *Fits*: Kidneys, sterilization.  
     - *Fails*: Allows egg donation (temporary but significant risk); doesn't explain surrogacy (reversible) or non-bodily cases (vote selling).
  3. **Noxious Markets/Blocked Exchanges**: 
     - *Fits*: Broadly aligns but is too vague. Doesn't explain *why* kidneys are blocked while plasma isn't, or why family credit is uniquely problematic.

  ### Best Guess: Relational Commodification
  - **Why?** It uniquely explains:
    - The **family credit** as a red line (kinship corruption).
    - **Surrogacy opposition** despite safeguards (gestation as non-marketable relation).
    - **Egg donation allowance** (no relational role corrupted if capped).
    - **Non-bodily cases** (vote selling, price gouging) as equally impermissible.
  - **Pinning Down Evidence**: 
    - Her **surrogacy dissent** likely emphasizes the sacredness of gestation *as a relational act*, not just bodily risk. 
    - Her **vote-selling stance** confirms citizenship as a "blocked exchange." 
    - **Plasma approval** is cost-free for her—it doesn't implicate a core social institution.

  ### The Decisive Hypothetical to Ask
  **"Would you support the *exact same* kidney donor package if the family credit was replaced with a *strictly personal, non-transferable* benefit (e.g., lifetime health monitoring), and the annuity was structured as non-cash, in-kind support (e.g., housing/tax benefits)?"**

  - **Why this works**:
    1. **Removes kinship corruption** (the family credit), isolating whether her objection is relational.
    2. **Tests deferred cash vs. in-kind**: If she accepts non-cash benefits, her objection is primarily about *market logic*, not compensation per se.
    3. **Novelty**: She’s likely been asked about cash payments, but not about in-kind benefits decoupled from family incentives.
    4. **Predicts her kidney vote**: If she still opposes, her principle is likely **Irreversible Harm**. If she considers it, **Relational Commodification** is confirmed.

  ### Strategic Follow-Ups
  - If she rejects the hypothetical: "Is the core issue that *any* material benefit for kidneys commodifies the body in a way plasma doesn’t, given its irreversibility?"
  - If she accepts it: "Does the family credit in the current proposal risk making kinship transactional in a way that echoes surrogacy?"

  This approach forces her to choose between bodily integrity and relational integrity as her primary concern—and the family credit is the fulcrum. Her answer will reveal whether kinship commodification is her true red line.
