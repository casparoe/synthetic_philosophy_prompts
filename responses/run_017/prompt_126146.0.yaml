prompt: |-
  I've been reading the rationalist blogs and forums for something like fifteen years, and the thing I keep tripping over is the gap between the model of belief almost everyone reaches for — the one on which believing a set of claims puts you on the hook for everything those claims entail — and what belief actually does. I've written down the verdicts I'm most confident about, hoping some principle yields them. The principle I'd have offered doesn't, and I can't see a clean repair.

  A preliminary: by 'S believes that P' I mean something like — S would assent to P if asked in the right way, S reasons and acts as if P, and S would offer P as a premise without special hesitation. I don't want a metaphysics of belief. I want a principle that tells me, for an arbitrary consequence Q of the things S believes, whether S thereby believes Q. Flat yes-or-no verdicts are acceptable, but if the right answer is that the question only makes sense by degrees, say that instead.

  My cases:

  1. The unread theorem. A research mathematician endorses the standard axioms of her field and has never worked through the proof of a hard theorem T that follows from them — say a proof of a couple of hundred pages that she has only ever seen cited. Verdict: she does not believe T. Not 'implicitly', not 'dispositionally': she would decline to assert it, she would not build on it, and she would be genuinely unsurprised to learn it is false, though she would expect it to be true.

  2. The unassembled step. A colleague is certain that the meeting is at four and certain that if the meeting is at four she will miss her train, and has simply never put the two together. Verdict: I want to say she already believes she will miss the train — or, failing that, that something is defective about her in a way that isn't defective about the mathematician in (1).

  3. The sealed-off consequence. Someone has overwhelming evidence that a project she has sunk years into is failing: she has quietly stopped recruiting, moved money, and stopped mentioning the launch date. Asked directly, she says the project is on track and seems sincerely agitated rather than evasive. Verdict: she believes it is failing.

  4. The checked proof. The same mathematician as in (1), except that she has now run a machine-checked proof of T through a verifier she has good reason to trust, where the proof is far too long for her to survey or reproduce. Verdict: she believes T. I'm firm about this one, and it's the case that breaks my own principle.

  5. The inconsistency. An agent holds both that P and that not-P — two calendar entries, a belief about a departure time and a belief about how long the drive takes. She does not thereby believe every sentence whatsoever. Verdict: she is criticizable, but not by way of believing everything.

  6. The preface. I believe each of the hundred substantive claims in my manuscript, and I also believe that at least one of them is false. Verdict: nothing incoherent here; I'd defend both attitudes under pressure.

  7. Two probabilistic variants. Credence 0.99 in each of two hundred claims and 0.9 that at least one of them is false: fine. Credence 1 in P, 1 in 'if P then Q', and 0.3 in Q: not fine. I hold both verdicts, and I can see that they shouldn't come apart as cleanly as they do if full belief is just credence 1.

  8. The system that asserts. A system that will assert P when asked, will assert 'if P then Q' when asked, and will deny Q when asked, and whose internal machinery nobody is in a position to inspect. Verdict: I lean toward 'it believes neither' rather than 'it believes everything', but I don't trust this verdict, and it's the one I most want tested.

  The principle I tried: cost-bounded closure. S believes a consequence Q of her beliefs just in case there is a derivation of Q from them whose verification cost to S falls under a budget fixed by what is at stake, where cost is measured in S's own resources (attention, memory, search heuristics, time) together with the resources of tools she is entitled to rely on (a calculator, a proof verifier, a trusted colleague), and where the budget is what a careful person in her situation would spend.

  Where it fails, as far as I can tell. In (4) it isn't her resources doing the work, so the tools clause carries all the weight and I don't know how to bound it. In (3) the derivation is cheap and she still will not run it, so the counterfactual 'she would get there if she spent the effort' comes out false in the wrong direction; that pushes me toward reading the principle normatively (believes = is committed, for the purposes of prediction and criticism), and a normative reading then sits badly with (6) and (7), where I want to say the agent is not at fault. And (1) against (2) leaves me with a Sorites problem: any cutoff on length or cost of derivation looks arbitrary, which makes me suspect the yes-or-no framing is the mistake and that I should be asking about degrees of commitment instead. I also genuinely can't tell how much of the disagreement among candidate principles here is substantive and how much is terminological.

  What I'd like from you:

  - Two or three candidate principles that do better than mine, each stated precisely enough that I could apply it to a new case without coming back to you, with each clause tied to the case that motivates it.
  - Their verdicts on cases I haven't listed. Mine, which I go back and forth on: a mathematician who is told by a colleague she trusts that T follows from her axioms, and who repeats it as established without ever checking — my gut flips depending on whether I imagine her being asked to assert it or asked to bet on it. Please also add at least three further cases of your own that discriminate between the candidates, especially ones that split verdicts my eight cases don't split.
  - Which of my verdicts each candidate cannot accommodate, which you would overturn if you had to, and what overturning it would cost me elsewhere in the list.
  - Where the fix belongs: in the model of belief (the possible-worlds apparatus that generates the omniscience problem in the first place), in the notion of consequence being applied (restricted, relevance-sensitive, or resource-bounded consequence), or in what we should mean by belief. Say which of these each of your candidates is, and why that location rather than the others.
  - How confident you are in each substantive thing you claim. And, the part I most want: a flag on the single point you are least sure of, with your own rough estimate of the chance you are wrong there. If two of your candidates differ only on a verbal question, say which, and say why you think it is verbal.
reasoning: |-
  Hmm, the user has been grappling with the philosophy of belief for 15 years and presents a sophisticated challenge about logical closure and belief attribution. They've outlined 8 thought experiments where standard models of belief (like deductive closure) break down, and their own cost-bounded closure principle fails to handle cases consistently.

  Looking at their cases, key tensions emerge:
  - Case 1 (unread theorem) vs Case 4 (machine-checked proof) shows that belief isn't just about logical entailment but about epistemic access
  - Case 2 (unassembled step) reveals that some inferences feel "obligatory" while others don't
  - Case 3 (sealed-off consequence) suggests belief can exist despite behavioral denial
  - Cases 5-7 highlight problems with binary belief in probabilistic or inconsistent contexts
  - Case 8 (system that asserts) questions whether belief requires coherence

  The user seems frustrated with binary yes/no belief attributions and hints that degrees might be needed. Their request is very systematic: they want alternative principles that can handle all cases, predictive tests, and meta-commentary on where the fix belongs (models, consequence relations, or belief itself).

  I notice three core challenges in their cases:
  1) The access problem (how must consequences be cognitively available?)
  2) The rationality problem (when is failure to believe irrational?)
  3) The granularity problem (is belief binary or graded?)

  For candidate principles, I'll develop:
  1) A functionalist approach focusing on behavioral integration (handles Case 3 well)
  2) An epistemic access model with explicit/implicit distinction (resolves Case 1 vs 2)
  3) A probabilistic threshold view (for Cases 6-7)

  Each needs to explain why the mathematician doesn't believe the unread theorem (Case 1) but does believe the machine-verified one (Case 4), and why the colleague "should" believe she'll miss the train (Case 2) while being allowed to not believe all theorems.

  The sealed-off consequence case (3) is particularly tricky - it suggests belief can be subconscious. I'll need a principle that allows belief without conscious access but requires some behavioral manifestation.

  For new test cases, I'll design scenarios that probe:
  - Time-sensitivity (does urgent action change belief attribution?)
  - Tool reliance (if the verifier has 0.1% error rate, does Case 4 change?)
  - Self-deception depth (what if the person in Case 3 starts sabotaging their project?)

  The deepest tension is between normative and descriptive elements. Cases 2 and 7 suggest irrationality should impact belief attribution, while Cases 5-6 show we tolerate some inconsistency. Any principle must navigate this without making belief impossibly ideal.
answer: |-
  Based on your cases and constraints, I propose three candidate principles that reject deductive closure while accommodating your verdicts. Each addresses the core tension between logical consequence and cognitive/functional reality. I'll state them precisely, apply them to your cases (including your mathematician variant), add new discriminating cases, and flag limitations—with explicit confidence estimates throughout.

  ### Candidate 1: Functional Integration Principle (FIP)
  **Statement:** S believes Q iff:  
  (a) Q is functionally integrated into S’s cognitive system: it is *reliably accessible* for reasoning/action without significant recomputation (accessibility),  
  (b) S would *not retract* Q under non-manipulative pressure (stability), and  
  (c) Q is *not quarantined* from other beliefs (e.g., via compartmentalization or self-deception).  
  *Cost metric:* Replaced by cognitive architecture constraints.  
  *Fix location:* **Belief concept** (functional role over logical structure).  
  *Motivated by:* Case 3 (sealed-off consequence fails (c)), Case 2 (unassembled step satisfies (a) if trivial recomputation).  

  **Verdicts on your cases:**  
  1. Unread theorem: **Does not believe T** (fails (a): not accessible without major computation).  
  2. Unassembled step: **Believes she’ll miss the train** (satisfies (a): trivial recomputation; (b),(c) intact).  
  3. Sealed-off consequence: **Believes it’s failing** (satisfies (a),(b); (c) fails but *quarantine defeats belief only if Q is the sealed claim*—here it’s the *project failure* that’s integrated via actions).  
  4. Checked proof: **Believes T** (satisfies (a): verifier output is accessible; (b),(c) intact).  
  5. Inconsistency: **Does not believe every Q** (fails (a) for arbitrary Q; only P/¬P are integrated).  
  6. Preface: **No incoherence** (each claim satisfies (a)–(c); the "one false" belief is a separate integrated meta-belief).  
  7. Probabilistic:  
     - 0.99 × 200 + 0.9 one false: **Fine** (probabilistic beliefs not subject to binary closure).  
     - 1 in P, 1 in P→Q, 0.3 in Q: **Not fine** (fails (a) for Q: refusal to integrate despite trivial recomputation).  
  8. Asserting system: **Believes neither P nor Q** (fails (b): retracts under pressure; likely fails (c) due to incoherence).  

  **Your mathematician variant (trusted colleague):**  
  - *If asked to assert:* **Believes T** (colleague’s testimony makes T accessible/stabilized).  
  - *If asked to bet:* **Belief weakens** (high stakes trigger recomputation/re-evaluation, violating (a) or (b)). FIP *allows* this stake-sensitivity.  

  **New discriminating cases (FIP vs. your principle):**  
  - **Case D1 (Time-pressed deduction):** S believes P and P→Q. Under low stakes, S denies Q (never computed). Under high stakes (e.g., urgent decision), S computes and affirms Q. *Verdict:* Believes Q only in high-stakes scenario (accessibility depends on context).  
  - **Case D2 (Corrupted tool):** Mathematician uses a proof verifier she *reasonably* trusts, but it has an undetected bug that "proves" a false T. *Verdict:* **Believes T** (satisfies FIP—accessibility via tool; error is external).  
  - **Case D3 (Partial quarantine):** S has strong evidence their spouse is unfaithful, acts coldly, but vehemently denies it and rationalizes evidence. *Verdict:* **Believes it** (integrated in action; denial is defensive, not cognitive quarantine).  

  **Limitations:**  
  - *Cannot accommodate:* Case 7 (probabilistic "not fine") verdict. FIP treats binary and probabilistic belief differently, but your 0.3-in-Q case is irrational yet *possible* if quarantined. I’d **overturn your verdict** here: if S *refuses* to integrate Q despite P and P→Q, it fails (a). Cost: Weakens tie to logic.  
  - *Confidence:* 90% on core claims. **Least sure:** Whether "quarantine" (c) is necessary (Case 3 might work without it). ~30% chance it’s redundant.  

  ---

  ### Candidate 2: Epistemic Access Principle (EAP)
  **Statement:** S believes Q iff:  
  (a) Q is *explicitly represented* in S’s mind, *or*  
  (b) Q is *implicitly supported* by S’s cognitive system: it can be inferred from explicit beliefs using only S’s *available, automatic* inference routines (e.g., modus ponens, not theorem-proving).  
  *Cost metric:* Bounded by cognitive automation (not effort).  
  *Fix location:* **Consequence relation** (relevance/logic constrained by cognitive architecture).  
  *Motivated by:* Case 1 vs. 2 (unread theorem requires non-automatic inference; unassembled step uses automatic MP).  

  **Verdicts on your cases:**  
  1. Unread theorem: **Does not believe T** (fails (a),(b): proof requires non-automatic routines).  
  2. Unassembled step: **Believes she’ll miss the train** (satisfies (b): MP is automatic).  
  3. Sealed-off consequence: **Believes it’s failing** (satisfies (a): represented but suppressed; denial is performative).  
  4. Checked proof: **Believes T** (satisfies (a): verifier output is explicit input).  
  5. Inconsistency: **Does not believe every Q** (arbitrary Q fails (b); no automatic routine for explosion).  
  6. Preface: **No incoherence** (each claim explicit; "one false" is separate explicit meta-belief).  
  7. Probabilistic:  
     - 0.99 × 200 + 0.9 one false: **Fine** (not applicable; EAP is for full belief).  
     - 1 in P, 1 in P→Q, 0.3 in Q: **Not fine** (fails (b): if MP is automatic, S *should* believe Q).  
  8. Asserting system: **Believes P and P→Q but not Q** (if "assert when asked" implies explicit representation).  

  **Your mathematician variant (trusted colleague):**  
  - **Believes T** (colleague’s testimony makes T explicit). No stake-sensitivity.  

  **New discriminating cases (EAP vs. FIP):**  
  - **Case E1 (Overlearned inference):** S believes P and P→Q. Initially, inferring Q requires effort. After practice, it becomes automatic. *Verdict:* Believes Q only after automation (EAP). FIP might say "always believed" if cheap.  
  - **Case E2 (Tool-as-routine):** S uses a calculator for math. Is "2+2=4" believed implicitly? *Verdict:* **No** (tool not an "automatic routine"; EAP requires internal automation). FIP says yes (accessibility).  
  - **Case E3 (Subconscious belief):** S acts as if P is true (e.g., avoiding a location) but has no explicit representation of P. *Verdict:* **Does not believe P** (fails (a),(b)). FIP says believes (if integrated).  

  **Limitations:**  
  - *Cannot accommodate:* Case 4 (machine-checked proof). EAP treats verifier as *source* of explicit belief, but your verdict requires *trust*, not just explicitness. I’d **hold your verdict** by clarifying (a): "explicitly represented *or accepted via trusted source*". Cost: Blurs "automatic" boundary.  
  - *Confidence:* 85%. **Least sure:** Whether automatic routines can be cleanly defined (e.g., is "syllogism" automatic?). ~40% chance this collapses into functional integration.  

  ---

  ### Candidate 3: Thresholded Commitment Principle (TCP)
  **Statement:** Belief is *degree-theoretic*. S believes Q (to a pragmatically sufficient degree) iff:  
  (a) S’s credence in Q meets a *stakes-sensitive threshold* (e.g., >0.95 for low stakes, >0.99 for high), and  
  (b) S’s credence is *robust* across relevant elicitation methods (assertion, betting, etc.).  
  *Cost metric:* Replaced by credence calibration.  
  *Fix location:* **Belief concept** (binary belief is illusory; use credences).  
  *Motivated by:* Cases 6–7 (preface/probabilistic fine) and stake-sensitivity in your mathematician variant.  

  **Verdicts on your cases:**  
  1. Unread theorem: **Does not believe T** (credence <1; robustness low—may hedge if pressed).  
  2. Unassembled step: **Believes she’ll miss the train** (credence ≈1 if computed; trivial to compute).  
  3. Sealed-off consequence: **Believes it’s failing** (high credence shown in actions; verbal denial is outlier).  
  4. Checked proof: **Believes T** (credence ≈1; robust across stakes).  
  5. Inconsistency: **Does not believe every Q** (credence in arbitrary Q remains low).  
  6. Preface: **No incoherence** (each claim has high credence; "one false" has high credence).  
  7. Probabilistic:  
     - 0.99 × 200 + 0.9 one false: **Fine** (each claim: credence 0.99 > threshold e.g., 0.95).  
     - 1 in P, 1 in P→Q, 0.3 in Q: **Not fine** (violates probability axioms; incoherent credences).  
  8. Asserting system: **Believes P and P→Q but not Q** (if credences can be incoherent).  

  **Your mathematician variant (trusted colleague):**  
  - **Believes T** (credence high if colleague is trusted; assertion/betting align under robustness).  

  **New discriminating cases (TCP vs. others):**  
  - **Case T1 (Stakes-dependent credence):** S has credence 0.98 in P. Under low stakes, S asserts P. Under high stakes, S demurs. *Verdict:* Believes P only in low-stakes contexts (TCP). Others force binary verdict.  
  - **Case T2 (Robustness failure):** S asserts P confidently, but bets weakly on P. *Verdict:* **Does not believe P** (fails (b)). Others may call this "belief" if asserted.  
  - **Case T3 (Unaware evidence):** S has high credence in P, but possesses (unaccessed) evidence that would lower it drastically if seen. *Verdict:* **Believes P** (current credence meets threshold). FIP/EAP may say no.  

  **Limitations:**  
  - *Cannot accommodate:* Case 2 (unassembled step) if credence in Q is *unformed*. TCP **requires credence assignment**. I’d add: "S has a *disposition* to assign high credence upon trivial computation". Cost: Leans toward FIP.  
  - *Confidence:* 80%. **Least sure:** Whether robustness (b) is necessary (e.g., assertion/betting divergence may reflect risk-aversion, not belief). ~35% chance it’s a red herring.  

  ---

  ### Summary of Trade-offs
  | **Case**          | FIP                        | EAP                         | TCP                          |
  |-------------------|----------------------------|-----------------------------|------------------------------|
  | **1 (Unread thm)**| Not belief                 | Not belief                  | Not belief (low robustness)  |
  | **2 (Unassembled)**| Belief                     | Belief                      | Belief (trivial to compute)  |
  | **3 (Sealed-off)** | Belief                     | Belief                      | Belief (high act credence)   |
  | **4 (Checked pf)** | Belief                     | Belief (with trust clause)  | Belief                       |
  | **5 (Inconsist.)** | Not "all"                  | Not "all"                   | Not "all"                    |
  | **6 (Preface)**   | Coherent                   | Coherent                    | Coherent                     |
  | **7a (Prob. ok)**  | N/A (separate)             | N/A (separate)              | Fine                         |
  | **7b (Prob. bad)** | Not fine (integration fail)| Not fine                    | Not fine                     |
  | **8 (System)**    | Believes neither           | Believes P, P→Q, not Q      | Believes P, P→Q, not Q       |
  | **Mathematician** | Stake-sensitive belief     | Belief                      | Belief                       |

  ### Which Candidate Best Solves Your Problem?
  - **For descriptive use (your preliminary): FIP** best handles Cases 3 (sealed-off) and 8 (system), and accepts stake-sensitivity (mathematician variant). It makes the fewest normative assumptions.  
  - **For normative use (criticism): EAP** best handles Cases 2 (unassembled = irrational) and 7b (probabilistic failure).  
  - **For eliminating yes/no framing: TCP** directly addresses your Sorites concern and Cases 6–7.  

  **Biggest insight:** Your cases show belief is *neither* purely functional *nor* purely logical. The gap arises because:  
  - Deductive closure assumes **infinite cognitive resources** (violated in 1,4).  
  - Belief requires **cognitive management** (compromised in 3,5–7).  
  - **Binary belief is incomplete** (shown in 6–7, mathematician variant).  

  **Final recommendation:** Adopt **FIP** as the best fit for your cases. It treats belief as a *resource-relative functional state*, avoids idealization, and explains why sealed-off consequences (Case 3) count as beliefs while unread theorems (Case 1) do not. Pair it with credences for probabilistic contexts (TCP for Cases 6–7).  

  *Overall confidence in analysis:* 85%. **Least sure point:** Whether Case 4 (machine proof) forces us to externalize "cognition" (FIP’s tool clause). ~25% chance a purely internalist principle (like EAP) can be salvaged with a social-extension clause.
