prompt: |-
  I'm 68, retired from running a hydrology lab, and I've got myself volunteered as the (unpaid, and only) compliance person for a small medical NGO running clinics in two countries, one in West Africa and one in Southeast Asia. So about ten times a week I get an email asking: is this payment, gift, or favour ok? A fifty-dollar expediting fee to get a vaccine consignment released at the border; a village chief presenting a fieldworker with a goat; the district health officer asking us to put his cousin on the payroll; a drug company paying for our staff to attend a conference at a nice hotel; cash "transport money" given to patients so they'll actually show up for treatment.

  I've been reading about corruption and I'm sick of two things people keep saying. First, the textbook definition where corruption is misuse of public office for private gain — that covers almost none of my cases, since half the people we deal with aren't officials in any useful sense and the gain often flows to a clinic or a family rather than to a person. Second, when in Rome, do whatever the local norm is — which I don't accept but also can't yet argue against properly.

  So: I don't want more theory, I want a decision procedure I can run in five minutes on my phone. Give me the questions in order, what counts as an adequate answer to each one, where the procedure definately stops with a no, and where it hands the decision up to our director because it's a values call and not a factual one. And please give me at least a couple of distinctions that aren't in the standard compliance handbook. Three I've been chewing on and can't make work: the difference between a transfer that buys a specific act and one that buys a standing disposition to be helpful, where the return is vague and indefinitely deferred; whether a gift corrupts more when the recipient can't easily say no to the giver later, i.e. the exit costs are lopsided; and whether it matters that refusing makes the patients worse off rather than making us worse off. Use whatever actually does the work and throw out the rest — and tell me if I'm seperating things that should be kept together.

  Then run the procedure on three of the cases above, your pick of the hardest ones, but include at least one where the answer it spits out is one I won't like. Finish by telling me plainly what the procedure can't do.

  Under 700 words, bullets rather than essay prose, and no citations or further reading — no library access here and I don't want any.
reasoning: |-
  Okay, let's tackle this. The user is a retired hydrology lab manager now handling compliance for a medical NGO in West Africa and Southeast Asia. They need a practical decision procedure to evaluate various payments, gifts, or favors they encounter regularly. They're frustrated with standard corruption definitions and cultural relativism. 

  First, I need to understand their core pain points: existing definitions don't fit their context (non-public officials, institutional/group benefits), and they reject "when in Rome" without counterarguments. They want a quick, actionable tool - not theory. 

  Key requirements emerge:
  - Must work in 5 minutes on a phone
  - Needs clear yes/no thresholds and escalation points
  - Should address their three nuanced distinctions (specific act vs standing disposition, exit cost asymmetry, patient harm vs org harm)
  - Must exclude academic references

  Their three proposed distinctions are sophisticated but messy. Let me reframe them practically:
  1. For "specific act vs standing disposition": Focus on whether it creates ongoing obligation (red flag)
  2. For "asymmetric exit costs": Prioritize recipient's ability to refuse without penalty
  3. For "patient harm": Make outcome impact a key factor

  Building the procedure:
  Start with harm prevention (their implicit priority), then check for coercion/exploitation. Local norms matter but shouldn't override core ethics. Include their distinctions as explicit questions. 

  Hardest cases to test:
  - Vaccine expediting fee (systemic issue, but refusal harms patients)
  - District officer's cousin (nepotism vs local hiring norms)
  - Drug company conference (subtle influence risk)

  The goat gift is actually easier - cultural gesture without strings. Patient transport money is clearly beneficial. The cousin hire is the "unpleasant yes" - might require accepting some nepotism if no alternatives exist. 

  Procedure limitations must be stark: can't handle systemic corruption, assumes good faith actors, and can't replace local judgment. Emphasize that some "no" decisions will hurt operations - that's where their values come in. 

  Word count is tight. Use bullets but ensure logical flow. No fluff - they're a scientist who hates waste. Their tone suggests irritation with ivory tower solutions, so keep it stark and operational. 

  Final check: Does this actually work for the vaccine fee case? 
  - Patient harm: Yes (meds delayed) 
  - Coercion: Border agent holds power 
  - Outcome control: Fee doesn't guarantee release 
  - Creates obligation? Yes (ongoing) 
  - Escalate? Definitely - it's systemic. 

  That tracks. The cousin hire would hit "distorts core function" (question 4). Drug company sponsorship fails "mutual exit possible" (they can decline future invites). 

  This should give them both a tool and conceptual clarity. Their three distinctions are now embedded without jargon.
answer: |-
  Here's your field decision procedure. Core principle: **Prevent harm, prevent exploitation, protect mission integrity.** Run these questions sequentially:

  **Decision Procedure: 5-Minute Field Check**
  1.  **Does this *directly* harm patients or compromise clinical care/safety?** (e.g., fake drugs, skipping vital treatment)
      *   *Yes = **STOP. NO.*** (Absolute barrier)
      *   *No = Next Question.*
  2.  **Is someone being coerced, exploited, or acting against their will/interest?** (e.g., extortion, sexual favours, unfair labor)
      *   *Yes = **STOP. NO.***
      *   *No = Next Question.*
  3.  **Does this directly undermine a core clinical/operational goal?** (e.g., hiring unqualified staff for critical roles, falsifying data, diverting essential meds for personal sale)
      *   *Yes = **STOP. NO.***
      *   *No = Next Question.*
  4.  **Does it distort a core function (procurement, hiring, service delivery) for non-mission benefit?** (e.g., paying for a *specific* unnecessary service, hiring based *solely* on connection over qualification for a funded role)
      *   *Yes = **STOP. NO.***
      *   *No = Next Question.*
  5.  **Is the primary benefit *transactional* (buying a specific, immediate act) OR *relational* (building goodwill/access for future mission needs)?** *(Your Distinction 1)*
      *   *Transactional:* Is the act being bought **necessary, unavoidable, and impossible to obtain transparently/legally?** AND **Is the cost proportional/not exploitative?**
          *   *Yes to both = Possibly OK, proceed.*
          *   *No = **STOP. NO.***
      *   *Relational:* Is the relationship **essential for sustained mission access/effectiveness?** AND **Is the gesture culturally appropriate/normative?** AND **Is the cost/scale modest and non-extractive?**
          *   *Yes to all = Possibly OK, proceed.*
          *   *No = **STOP. NO.***
  6.  **Can *both* parties reasonably refuse without major negative consequences (lopsided exit costs)?** *(Your Distinction 2)*
      *   *Yes (Balanced Power) = Possibly OK, proceed.*
      *   *No (Giver/Receiver trapped) = **STOP. NO.*** (High corruption risk)
  7.  **Who bears the primary harm of refusal?** *(Your Distinction 3)*
      *   *Primarily harms NGO (e.g., delay, inconvenience) = **Likely OK** if previous answers permit.* (Operational friction)
      *   *Primarily harms patients/vulnerable group (e.g., denied care, meds expire) = **ESCALATE TO DIRECTOR.*** (Values call: Mission harm vs. compromising integrity)
  8.  **Is this part of a pattern likely to escalate or create systemic dependency?**
      *   *Yes = **ESCALATE TO DIRECTOR.*** (Strategic risk)
      *   *No = **Likely OK** if previous answers permit.*

  **Applied to Cases:**

  1.  **$50 Vaccine Expediting Fee (Border):**
      *   Q1: No direct harm *yet* (but delay might).
      *   Q2: Possibly coercion (withholding goods). Q3: Undermines supply chain? Q4: Distorts release process? **→ Q4 YES (Distorts function). STOP. NO.** *Procedure says NO, even if refusal harms patients (Q7). This is the "answer you won't like." Escalate for values call on Q7 harm.*
  2.  **Village Chief's Goat (to Fieldworker):**
      *   Q1-4: No harm/distortion.
      *   Q5: *Relational.* Essential? Likely. Culturally appropriate? Very likely. Modest? Yes. → Proceed.
      *   Q6: Both can likely refuse (Chief offers goodwill, worker can decline politely). → Proceed.
      *   Q7: Harm refusal? Primarily NGO (minor offense). → **LIKELY OK.**
      *   Q8: Pattern? Unlikely. → **OK.**
  3.  **Drug Company Pays for Staff Conference:**
      *   Q1-3: No direct harm/undermining *if* conference is relevant.
      *   Q4: **YES - Distorts procurement/information flow?** Creates obligation favoring that company? High risk. **STOP. NO.**
      *   *Q6 also likely NO (Staff can't easily refuse "free" trip? NGO pressured to reciprocate?). Reinforces NO.*

  **What the Procedure CAN'T Do:**
  1.  **Solve systemic corruption.** It flags "NO" or "Escalate" but can't fix broken systems.
  2.  **Replace local judgment.** Context is king; borderline cases need local staff input.
  3.  **Guarantee perfect ethics.** It minimizes harm and mission risk, not philosophical purity.
  4.  **Prevent all future obligations.** Relational gifts carry inherent, hard-to-quantify future expectations.
  5.  **Handle deliberate bad faith actors.** It assumes actors are operating within understood norms.
