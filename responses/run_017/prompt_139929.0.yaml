prompt: |-
  My day job has nothing to do with any of this — I plan delivery routes for a regional grocery chain, and a few years ago our head office started ranking depots on cases shipped per labor hour. Inside about six months, two depots were splitting orders into half-empty totes so the case count went up, and one supervisor had started clocking people out during lulls so the lull never showed up as labor. Nothing was exactly falsified. The number just quietly stopped meaning the thing the people who picked it meant by it. I've been reading about this in the evenings ever since — Goodhart's law, specification gaming, reward hacking in ML, the whole genre — and I've now talked myself into applying for a small independent-project grant: nine months part-time, about fifteen thousand, from a foundation that funds what it calls practical epistemics. They want two pages: a precise question, a method they can actually judge, a deliverable, and an honest statement of what would count as the project failing. I have no supervisor and no university affiliation, so I can't borrow framing from anyone, and I'll fill in whatever citations are needed myself — please don't spend words on a reading list.

  Where I've got to is this. I've started sorting Goodhart failures into three buckets, and I think the standard toolkit for fixing them is really three different tools that people treat as interchangeable. (1) Selection pressure: the metric and the thing you care about track each other fine in the ordinary range and come apart in the tail, so rewarding the metric hard drags behaviour into the region where they diverge. (2) Reclassification: the world doesn't change, the labels do — hospital coders rewriting a case as a more severe diagnosis, a depot relabelling an order as two orders. (3) What I've been calling constitutive capture, which is the one I can't find anyone discussing properly: gaming the number doesn't just come apart from the target, it partly *redefines* the target. A credit score is the clearest case — the behaviour that raises your score is, by the lender's own lights, partly what being creditworthy now consists in. My half-formed hypothesis is that the usual remedies are matched to particular buckets and are actively damaging when applied to the wrong one: random audits or a human-in-the-loop look like the right fix for (2) and nearly useless for (1); a basket of metrics, or rotating the metric every few months, looks like the right fix for (1) but plausibly makes (3) worse, because more metrics means more of the target is constituted by whatever is being measured, and rotating destroys the shared expectation that was doing the constitutive work in the first place. If that's right then a lot of metric reform fails not because people under-react to Goodhart but because they reach for the nearest tool. There's also a worry I keep going back and forth on: in most real cases maybe there is no target fully specifiable apart from some proxy, in which case my three buckets might collapse into one and the whole project turns into something I'm not equipped to write.

  Can you turn that into the proposal I'd actually send? I need: the sharpened question (something with a determinate answer, not a gesture at a topic); why the existing ways of talking about this leave it open, including the strongest version of the collapse worry in the last sentence above; what I'd really do month by month across nine months at maybe ten hours a week, working from publicly documented cases in a handful of domains — hospital coding, school accountability, credit scoring, warehouse metrics, ML reward hacking — and why that method rather than the obvious alternatives (building a formal model? interviewing practitioners? a big case survey?); what a useful deliverable would be for someone actually redesigning a metric at an organisation like my employer, since that's who the foundation will ask about; and what would make the project a failure, stated plainly enough that I'd recognise it if it happened. Be realistic about scope — if this is two projects and one of them needs to be cut, say which and why.
reasoning: |-
  Okay, the user works in logistics and has encountered real-world Goodhart's law problems where metrics get gamed. They've been researching this independently and now want to craft a grant proposal about different types of metric failures. Their core insight is that existing solutions might be misapplied because people don't distinguish between three failure modes: selection pressure, reclassification, and constitutive capture.

  Hmm, their description of constitutive capture is particularly interesting - how metrics actually redefine the target itself, like credit scores becoming the definition of creditworthiness. That's the novel angle. But they're worried this might collapse into one category if targets can't be separated from proxies. The proposal needs to address that head-on while keeping the categories distinct enough to study.

  The user needs very concrete elements: a razor-sharp research question, methodology, deliverable, and failure conditions. Since they're an independent researcher, everything must stand on its own without academic scaffolding. The foundation cares about practical impact, so the output should help someone redesigning metrics at say, a warehouse or hospital.

  For methodology, analyzing documented cases makes sense - they can't do interviews without ethics approval, and formal modeling might be too abstract. Focusing on their five domains (healthcare, education, finance, logistics, ML) gives boundaries. Nine months part-time means maybe 3 months per failure type with overlap.

  The collapse worry is legitimate but can be framed as a research question itself - under what conditions do these categories hold versus blur? That becomes part of the analysis rather than a showstopper.

  Deliverable should be actionable - not just taxonomy but diagnostic flowcharts or failure-matching tables for practitioners. Failure condition could be if no distinct patterns emerge across cases by month 6.

  If cutting scope, the ML examples might be sacrificed since they're less accessible to the target audience (org designers), though the parallels are fascinating. Better to keep the focus on human systems where the constitutive effect is most visible.

  Key is maintaining their voice - this isn't an academic paper but a practitioner's insight refined. The "aha" moment about mismatched remedies needs to stay central.
answer: |-
  Here’s a streamlined grant proposal draft based on your framework, designed for clarity, scope realism, and alignment with the foundation’s requirements. It cuts decisively into the constitutive capture problem while addressing your core concerns.

  ---

  **Project Title:** Diagnosing Metric Pathology: A Typology to Match Goodhart Failures with Effective Remedies  
  **Applicant:** [Your Name], Logistics Planner (Independent Researcher)  
  **Duration:** 9 months (part-time, ~10 hrs/week)  
  **Funding Request:** $15,000  

  ### 1. Precise Research Question
  *When organizations implement proxy metrics (e.g., "cases shipped per labor hour"), do distinct failure modes — specifically (1) selection pressure, (2) reclassification, and (3) constitutive capture — require categorically different remedies? And crucially, does constitutive capture (where gaming the metric *redefines* the target itself) persist as a distinct phenomenon when tested against documented cases?*  

  ### 2. Why This Question is Open & Unaddressed  
  Existing literature treats Goodhart effects as monolithic or focuses on generic solutions (e.g., "add more metrics"). Constitutive capture is rarely disentangled from other failures:  
  - **Selection pressure** (tail divergence) is well-modeled in economics and ML.  
  - **Reclassification** (label manipulation) is addressed via audits/oversight.  
  - **Constitutive capture** (e.g., credit scores *defining* creditworthiness) lacks systematic analysis. Its mechanisms (e.g., institutional adoption of the proxy as the target) are conflated with gaming.  
  **The Collapse Worry Addressed Head-On:** If all targets are inherently proxy-dependent, constitutive capture may not be distinct. *This project tests that boundary:* By examining cases where the *stated* target (e.g., "efficient delivery") exists independently of the metric pre-failure, we assess whether capture visibly redefines organizational goals. If constitutive effects vanish under scrutiny, the typology fails — a definitive outcome.

  ### 3. Methodology: Comparative Case Analysis  
  **Why this method?**  
  - **Formal models** abstract away institutional context where capture emerges.  
  - **Practitioner interviews** risk anecdotal bias and access hurdles.  
  - **Big case surveys** sacrifice depth for breadth, muddying causal mechanisms.  
  **My approach: Structured forensic analysis of 12–15 publicly documented cases** across 5 domains (hospital coding, school accountability, credit scoring, warehouse metrics, ML reward hacking). Sources: regulatory reports, court records, investigative journalism, internal audits (e.g., VA wait-time scandals, Atlanta schools cheating, FICO score impacts).  

  **Monthly Breakdown:**  
  - **Months 1–2:** Domain immersion. Build annotated repository of 30+ candidate cases with clear evidence of metric manipulation.  
  - **Months 3–5:** Deep analysis of 3–4 cases *per failure type*. Code for:  
    - Pre-failure alignment (Did metric/target track initially?)  
    - Gaming mechanism (Tail exploitation? Label change? Institutional redefinition?)  
    - Remedial attempts (What worked/failed? Why?)  
  - **Months 6–7:** Cross-case synthesis. Identify:  
    - Distinct failure signatures (e.g., constitutive capture requires institutional buy-in; reclassification thrives in oversight gaps).  
    - Mismatched remedies (e.g., metric rotation *accelerating* capture by destabilizing shared norms).  
  - **Month 8:** Test typology against "collapse" counterexamples (e.g., cases where target/metric were always fused).  
  - **Month 9:** Develop practical deliverables (see below).  

  ### 4. Deliverable: The Metric Failure Diagnostic Toolkit  
  A concise (≤15 pg) guide for practitioners redesigning metrics, featuring:  
  - **Flowchart:** "Is Your Metric Failing? Diagnose the Pathology" (based on observable symptoms).  
  - **Remedy Match Table:** Evidence-backed fixes per failure type (e.g., *for reclassification: spot audits*; *for capture: decouple metric from institutional identity*).  
  - **Red Flags List:** Early warnings of constitutive capture (e.g., "staff reference the metric as the goal itself").  
  **Practical Value:** Helps organizations like my grocery chain avoid prescribing "audits" for a selection pressure problem — or worse, exacerbating capture with basket metrics.  

  ### 5. Clear Failure Condition  
  **This project fails if:**  
  By Month 6, rigorous case analysis reveals no consistent, distinguishable mechanisms between constitutive capture and other failure types — *or* if constitutive capture collapses into mere reclassification/selection pressure in ≥80% of test cases.  

  ### Scope Realism: What’s Cut & Why  
  **Formal modeling and primary interviews are excluded.** Modeling requires assumptions that obscure institutional nuance; interviews demand IRB/access impractical for 9 months. **This focuses the project on its strength:** forensic analysis of *existing* evidence to test a novel typology. If constitutive capture holds, future work can expand to modeling/interviews.  
  **ML examples are minimized (1–2 cases).** While rich, they risk overgeneralizing to human systems. Human-driven domains (healthcare, education, logistics) anchor the analysis.  

  ---

  **Why This Fits Practical Epistemics:**  
  It confronts a pervasive reason policies fail — misdiagnosing *why* metrics distort — using public evidence. The deliverable empowers practitioners to ask: "What *kind* of Goodhart failure are we facing?" before applying fixes. If constitutive capture is real, this prevents reforms that accidentally redefine success. If it collapses, we simplify the toolkit. Either outcome advances practice.
