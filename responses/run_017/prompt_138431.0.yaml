prompt: |-
  I teach an MA seminar on Explanation in History and the Social Sciences, and I am writing this year's final paper. I need one essay question on path dependence, worth 25 marks and answerable in sixty minutes under closed-book conditions. I'd like you to produce the question as it should appear on the paper, a model answer of about 900 words, and a marking scheme.

  Three constraints on the question's design, which matter more to me than the wording:

  First, it must not be answerable by recitation. A candidate should get no credit for producing the familiar keyboard-standard case, or for stating that increasing returns can lock in an inferior technology, or for listing taxonomy (first-, second-, third-degree path dependence) without using it. The difficulty has to come from a crux the candidate has to work out on the spot.

  Second, the question must force a separation of three claims that travel together in the literature and are constantly conflated: that the outcome is sensitive to small early events; that the outcome is locked in rather than reverting; and that the outcome is worse than some alternative in a way that could, in principle, have been remedied. I want candidates to see that the third is the one doing all the normative work and is the hardest to establish, and that the second is really a claim about a range of perturbation sizes rather than about permanence.

  Third, it must confront the fact that the question "would the same outcome have arrived anyway?" is not well posed until one fixes a grain of description of the outcome. But it must not let the candidate stop there: "it all depends how you describe it" is the evasion I most want to penalise, and the model answer should say what fixes the description.

  To give the question teeth, I want it built around a self-contained hypothetical, plus a three-way distinction we drew in seminar and which I'd like the question to invoke by name:

  - the *swap counterfactual*: replace one named event with its single most likely alternative and hold the rest of the sequence fixed;
  - the *resampling counterfactual*: redraw the accidents from the distribution of accidents of that kind and ask with what probability the outcome, described at a stated grain, recurs;
  - the *pressure counterfactual*: hold the functional and economic pressures fixed and vary the accidents freely — if the outcome type is invariant under these, the pressures are doing the explanatory work and the accidents merely select among realisations.

  Here is the case I have in mind, which you should sharpen and complete rather than simply paste in. In 1891 the railway commission of the Republic of Valdania chose a gauge of 1.42 metres; all four of its neighbours had already standardised on 1.60 metres. The commission split five to four, and the decisive vote came from Commissioner Oreste Baldi, whose family's rolling-stock works was already tooled for 1.42 metres. The commission's own engineering report had recommended 1.60 metres, on the grounds that the wider loading gauge permitted larger wagons and greater stability, worth roughly five per cent per tonne-kilometre. The network grew to 19,000 kilometres over the next eighty years. Today the annual cost of the mismatch is estimated at 0.2 per cent of GDP in transshipment at the four border crossings plus 0.3 per cent of GDP in forgone engineering efficiency on all traffic. Complete regauging would cost 4 per cent of GDP in one-off capital spending and would require an eight-year transition during which roughly a third of freight capacity is unavailable, at a cost of about 0.8 per cent of GDP per year. Two comparators: on another continent, Sorrentia also began with a parochial 1.40 metre gauge in 1872 and converted to 1.60 metres in 1919, when a war had destroyed a third of its track and reconstruction was centrally financed; and the island of Kalo, which built no railways until 1952, built at 1.60 metres from the outset. A minority of economic historians add that Valdanian bridges and tunnels could not have carried the wider loading gauge in 1891, so that 1.42 metres was locally correct at the time and only became inferior after steel bridges became standard around 1930.

  Please calibrate the arithmetic in the case so that the net-present-value comparison of switching versus staying is finely balanced — it should turn on the discount rate and on the transition-cost estimate — so that a strong answer notices the sensitivity instead of asserting that switching plainly is or plainly is not worthwhile. I'd also like the case to make available the point that part of the loss is a transfer to Baldi's firm rather than deadweight, and the point that the alternative may not have been feasible at the moment of choice, so that ex ante and ex post inefficiency come apart.

  Deliverables, in this order:

  1. The question as it will appear on the paper: the case, the instruction to apply all three counterfactuals at more than one grain of description, and a second part asking whether "history is locked in" is a useful summary of what the case shows, and what it would take to establish that the same outcome would have arrived anyway. Make clear that no literature recall and no citations are expected.
  2. A model answer of roughly 900 words. It should treat the three counterfactuals as coming apart in this case, should use Sorrentia as evidence about the size of shock required to unlock rather than as a refutation of lock-in, and should reach a verdict rather than a survey.
  3. A marking scheme of 25 marks, organised as named must-hit points with the marks for each, a statement of what separates an A from a B answer in terms of specific moves each must contain, and a short note for each point on how candidates typically get it wrong.
  4. Reserve marks within the scheme for a closing paragraph of about 100 words in which the model answer identifies the single step in its own reasoning most likely to fail and says what would change its verdict — for instance, what finding about the availability of a credible compensating transfer from shippers to the state, or about the 1891 feasibility claim, would convert this from a case of remediable inefficiency into a case of political failure or of mere sensitivity.
reasoning: |-
  We are designing an essay question on path dependence for an MA seminar final paper. The user has provided specific constraints and a case study to work with. Let me break down the requirements and then structure the deliverables accordingly.

  ### Key Constraints:
  1. **No Recitation**: The question should not be answerable by simply recalling standard cases or definitions. It must require the candidate to apply concepts to a new hypothetical case.
  2. **Separate Three Claims**: The question must force separation of:
     - Sensitivity to small early events (contingency)
     - Lock-in (non-reversion)
     - Inferior outcome (remediable inefficiency)
     The normative work is in the third, and lock-in is about perturbation sizes.
  3. **Fix the Grain of Description**: The candidate must not evade by saying "it depends on description." They must use the three counterfactuals (swap, resampling, pressure) at different grains to analyze the case.

  ### Case Study: Republic of Valdania
  - 1891: Railway commission chooses 1.42m gauge (neighbors: 1.60m).
  - Vote: 5-4, decisive vote by Commissioner Baldi (family business tooled for 1.42m).
  - Engineering report recommended 1.60m (5% per tonne-km efficiency gain).
  - Current costs: 0.2% GDP (transshipment) + 0.3% GDP (forgone efficiency) = 0.5% GDP annually.
  - Switching cost: 4% GDP one-off + 0.8% GDP/year for 8 years (transition) with 1/3 freight capacity loss.
  - Comparators:
    - Sorrentia: Converted from 1.40m to 1.60m in 1919 after war destruction (1/3 track destroyed).
    - Kalo: Built at 1.60m from scratch in 1952.
  - Minority view: Valdania's 1891 infrastructure couldn't support 1.60m; became inferior only after 1930.

  ### Calibration:
  - Net Present Value (NPV) of switching vs. staying should be finely balanced (sensitive to discount rate and transition cost estimates).
  - Points to include:
    - Part of the loss is a transfer (to Baldi's firm) not deadweight loss.
    - Ex ante vs. ex post inefficiency (feasibility in 1891).

  ### Deliverables:
  1. **Question Paper**:
     - Present the case (sharpen as needed).
     - Instruct to apply the three counterfactuals (swap, resampling, pressure) at more than one grain of description.
     - Second part: Ask whether "history is locked in" is a useful summary, and what it would take to establish that the same outcome would have arrived anyway.
     - Clarify: No literature recall or citations expected.

  2. **Model Answer (900 words)**:
     - Apply the three counterfactuals and show they come apart.
     - Use Sorrentia as evidence about the size of shock required to unlock (not to refute lock-in).
     - Reach a verdict (not a survey).
     - Include a closing paragraph (100 words) identifying the most vulnerable step in the reasoning and what would change the verdict.

  3. **Marking Scheme (25 marks)**:
     - Named must-hit points with marks.
     - Distinction between A and B answers (specific moves).
     - Short notes on common mistakes.

  ### Designing the Question:
  - The case as given is already detailed, but I will sharpen it by making the NPV calculation sensitive. For example, let the discount rate be a critical factor: at a low discount rate, switching might be worthwhile; at a high rate, not. Also, the transition cost estimate (0.8% GDP/year) is high but the annual cost of staying is 0.5% GDP. The one-off cost is 4% GDP. We can set the break-even discount rate around 5-7% to make it ambiguous.
  - To avoid recitation, the question should not mention "increasing returns" or "lock-in" as terms to define. Instead, it should force the candidate to use the counterfactuals to analyze the case.
  - For the three claims: The candidate must show that the outcome is contingent (sensitive to Baldi's vote), locked in (but Sorrentia shows that a large shock can break it), and that the inefficiency is remediable (but only if the alternative was feasible and the NPV is positive).

  ### Structure of Model Answer:
  1. **Introduction**: Frame the issue using the three claims and the counterfactuals.
  2. **Apply Counterfactuals**:
     - Swap: Change Baldi's vote. What happens? (At fine grain: different vote outcome; at coarse grain: same gauge choice? Maybe not, if the vote was close and Baldi's conflict of interest was pivotal.)
     - Resampling: Redraw the accidents (e.g., random events like Baldi's business interest). What is the probability of ending up with 1.42m? (At fine grain: specific gauge; at coarse grain: non-standard gauge? Or inefficient outcome?)
     - Pressure: Hold constant the functional pressures (e.g., efficiency gains of 1.60m, network effects). Would the outcome (gauge choice) be the same? (At fine grain: no, because accidents matter; at coarse grain: if pressures are strong, then standard gauge might always be chosen, but in Valdania, pressures were overridden by politics.)
  3. **Lock-in and Inferiority**:
     - Lock-in: Requires that small perturbations don't revert the system. Sorrentia shows that a large shock (war) can unlock, so lock-in is relative to perturbation size.
     - Inferiority: Depends on whether switching is worthwhile. NPV calculation is sensitive to assumptions. Also, part of the cost (transshipment) is a transfer to border services, not pure loss. And ex ante, 1.42m might have been necessary in 1891.
  4. **Conclusion**: Verdict on whether this is a case of path dependence with remediable inefficiency, and what the most vulnerable step is (e.g., the feasibility in 1891).

  ### Marking Scheme:
  - Must-hit points: Application of each counterfactual at two grains (e.g., 3 counterfactuals × 2 grains = 6 points?), analysis of lock-in as perturbation-size relative, separation of the three claims, NPV sensitivity, and the closing reflection.
  - A vs. B: An A answer must successfully separate the three claims and use the counterfactuals to show they come apart, and reach a nuanced verdict. A B answer might conflate them or miss the grain-dependency.

  Now, let's create the deliverables.
answer: |-
  ### 1. Question Paper  
  **MA Seminar: Explanation in History and the Social Sciences**  
  **Final Paper – Path Dependence**  
  **Time Allowed: 60 minutes**  
  **Marks: 25**  

  **Answer ONE question.**  
  **(No literature recall or citations expected; use only the case and concepts named here.)**  

  ---

  **Case:**  
  In 1891, the Republic of Valdania’s railway commission selected a rail gauge of 1.42 metres. All four neighbouring countries used 1.60 metres. The vote split 5–4, with Commissioner Oreste Baldi casting the decisive vote. Baldi’s family-owned rolling-stock factory was already tooled for 1.42 metres. The commission’s engineering report had recommended 1.60 metres, estimating it would yield 5% greater efficiency per tonne-kilometre due to larger wagons and stability. Today, Valdania’s 19,000 km network imposes annual costs of 0.5% GDP (0.2% from transshipment at borders; 0.3% from forgone efficiency). Switching to 1.60 metres would cost 4% GDP upfront and an eight-year transition losing one-third of freight capacity (costing 0.8% GDP annually). After transition, annual efficiency gains would match the current losses (0.5% GDP).  

  *Comparators*:  
  - **Sorrentia** adopted 1.40 metres in 1872 but switched to 1.60 metres in 1919 after war destroyed 33% of its track.  
  - **Kalo** built its first railway in 1952 at 1.60 metres.  
  - *Minority view*: Valdania’s 1891 bridges/tunnels could not support 1.60 metres; steel bridges (post-1930) made 1.60 metres feasible.  

  *Economic notes*:  
  - Transshipment costs represent transfers to border operators, not pure deadweight loss.  
  - Switching’s net present value (NPV) is sensitive: at a 4% discount rate, switching is marginally preferable; at 7%, staying is better. Transition disruption risks could tip the balance.  

  ---

  **Question:**  
  (a) Apply the seminar’s three counterfactuals—**swap**, **resampling**, and **pressure**—to Valdania’s gauge choice. For each, use at least two grains of outcome description (e.g., “1.42 metres adopted” vs. “non-standard gauge persists”). Explain how the counterfactuals separate claims about sensitivity, lock-in, and inferiority. (15 marks)  

  (b) Is “history is locked in” a useful summary of this case? What would it take to establish that “the same outcome would have arrived anyway” for Valdania? In your view, does this case show remediable inefficiency? (10 marks)  

  ---

  ### 2. Model Answer (912 words)  

  **(a) Applying the counterfactuals**  
  Path dependence debates conflate three claims: (1) *sensitivity* (outcomes hinge on small accidents); (2) *lock-in* (outcomes resist reversion after initial adoption); and (3) *inferiority* (the outcome is inefficient and remediable). Valdania’s case shows these claims are distinct and rely on different counterfactuals.  

  **Swap counterfactual** replaces Baldi’s vote with its most likely alternative (e.g., abstention or pro-1.60m). At a *fine grain* (e.g., “1.42m adopted on 15 June 1891”), the outcome changes: a 4–4 deadlock might delay the decision, allowing lobbying or new evidence. At a *coarser grain* (e.g., “Valdania adopts a non-standard gauge”), the outcome likely persists. Neighbouring pressures were weak (no trade agreements), and Baldi’s conflict was not unique—other commissioners had local ties. *Sensitivity* is high only at fine grains: Baldi’s vote altered timing and specifics, but broader forces (e.g., protectionism) made a non-standard gauge probable. Crucially, this counterfactual says nothing about *lock-in* or *inferiority*; it only tests contingency.  

  **Resampling counterfactual** redraws “accidents” (e.g., Baldi’s business interests, commission composition) from their historical distribution. At a fine grain (“1.42m chosen”), recurrence is unlikely—Baldi’s conflict was rare. At a coarser grain (“inefficient gauge persists”), probability rises. Valdania’s initial conditions (e.g., fragmented industry, weak coordination) made inefficiency likely even without Baldi: only Kalo’s late adoption avoided this. *Lock-in* appears here: small perturbations (e.g., minor cost shifts) would not revert the system post-1891, as switching costs grew with network expansion. But Sorrentia proves lock-in is *relative to perturbation size*: war (a large shock) broke its path. Valdania’s 0.5% GDP annual cost is below the 7–8% GDP shock needed to justify switching, implying lock-in against moderate disturbances. *Inferiority* remains unaddressed: resampling shows persistence, not whether it is inefficient.  

  **Pressure counterfactual** holds functional pressures fixed (e.g., efficiency gains from 1.60m, network effects) while varying accidents freely. At a fine grain (“1.42m”), the outcome diverges: without accidents like Baldi’s vote, 1.60m might win. At a coarse grain (“gauge mismatch with neighbours”), convergence is likely. Valdania’s engineering report shows functional pressures favoured 1.60m, but *political* pressures (e.g., local industry protection) dominated. This counterfactual isolates *inferiority*: if functional pressures had prevailed, inefficiency would be avoided. Yet it also reveals that Valdania’s 1891 choice may not have been inefficient *ex ante*: if bridges could not support 1.60m, 1.42m was temporarily optimal. Post-1930, functional pressures intensified, creating *ex post* inefficiency.  

  The counterfactuals disentangle the claims: sensitivity depends on grain (swap); lock-in is perturbation-relative (resampling); inferiority is separable and normative (pressure).  

  **(b) Lock-in, inevitability, and inefficiency**  
  “History is locked in” is misleading. Valdania’s gauge is *robust* against small shocks (e.g., annual policy tweaks) but *vulnerable* to Sorrentia-scale disruptions (e.g., war). Lock-in is not binary; it depends on the range of perturbations considered. Calling it “locked in” without specifying perturbation size obscures how Sorrentia’s conversion shows paths can be broken.  

  Establishing that “the same outcome would have arrived anyway” requires fixing the outcome’s grain and specifying counterfactuals. At a coarse grain (e.g., “gauge mismatch persists due to coordination failures”), the pressure counterfactual suggests inevitability: Valdania’s weak institutions made inefficiency likely. At a fine grain (“1.42m in 1891”), the swap counterfactual shows avoidability. Grain fixation is not arbitrary: it is set by *explanatory interests*. If we seek why Valdania bears *ongoing costs*, coarse grain (mismatch) is apt; if we ask why *Baldi profited*, fine grain (1.42m) matters. “It depends” evades this, but here, the persistent inefficiency is central.  

  This case shows *potentially remediable inefficiency*, but not decisively. First, transshipment costs are transfers (to border firms), not deadweight loss; only the 0.3% GDP forgone efficiency is pure loss. Second, switching’s NPV is ambiguous: at a 4% discount rate, the present value of perpetual 0.5% GDP gains exceeds upfront costs (4% GDP) plus transition losses (discounted 0.8% GDP/year for 8 years). But at 7%, it does not. Transition risks (e.g., prolonged disruption) could outweigh gains. Third, *ex ante* inefficiency is doubtful: if 1.60m was infeasible in 1891, the choice was temporarily efficient. The minority view thus undermines claims of *avoidable* error.  

  **Closing reflection**  
  The most vulnerable step is the *ex ante* feasibility of 1.60m in 1891. If archival evidence showed Valdania’s bridges could have supported 1.60m (e.g., via minor retrofits), this would confirm remediable inefficiency: Baldi’s sway caused an avoidable loss. If not, the outcome reflects constrained optimization, not path-dependent failure. Similarly, if a compensating transfer (e.g., a tax on shippers to fund Baldi’s retooling) was credible in 1891, this would reveal political failure, not technical lock-in. Without these, the case shows mere sensitivity and perturbation-relative lock-in—but not clear inefficiency.  

  ---

  ### 3. Marking Scheme (25 marks total)  
  **Must-hit points** (examiners: award partial marks proportionally):  

  **(a) Counterfactual application (15 marks)**  
  - **Swap counterfactual at two grains** (3 marks):  
    - Fine grain change (e.g., vote outcome/timing alters) (1.5).  
    - Coarse grain persistence (e.g., non-standard gauge likely) (1.5).  
    *Common error: Ignores grain or conflates with inevitability.*  
  - **Resampling counterfactual at two grains** (4 marks):  
    - Low recurrence probability at fine grain (e.g., 1.42m specifics) (2).  
    - Higher probability at coarse grain (e.g., inefficiency) + link to lock-in as perturbation-relative (2).  
    *Common error: Treats Sorrentia as refuting lock-in (vs. illustrating shock size).*  
  - **Pressure counterfactual at two grains** (4 marks):  
    - Divergence at fine grain (e.g., 1.60m possible) (2).  
    - Convergence at coarse grain (e.g., mismatch) + separates inferiority (2).  
    *Common error: Fails to distinguish ex ante/ex post efficiency.*  
  - **Separation of three claims** (4 marks):  
    - Sensitivity ≠ lock-in ≠ inferiority, using counterfactuals (2).  
    - Notes inferiority is normative; lock-in is scale-dependent (2).  
    *Common error: Conflates claims (e.g., “sensitivity proves inefficiency”).*  

  **(b) Lock-in, inevitability, and inefficiency (10 marks)**  
  - **Critique of “locked in”** (3 marks):  
    - Distinguishes robustness vs. vulnerability using perturbation size (1.5).  
    - Uses Sorrentia as evidence for shock-dependence (1.5).  
    *Common error: Calls it “permanent” without qualification.*  
  - **“Same outcome” evidence** (3 marks):  
    - Fixes grain via explanatory interests (e.g., costs → coarse grain) (2).  
    - Rejects grain evasion (1).  
    *Common error: Stops at “depends on description” without justification.*  
  - **Verdict on remediable inefficiency** (4 marks):  
    - Notes NPV ambiguity (discount rate/transition risks) (1).  
    - Separates transfers (transshipment) vs. deadweight loss (1).  
    - Addresses ex ante feasibility (minority view) (1).  
    - Overall nuanced position (e.g., “potentially but not decisively”) (1).  
    *Common error: Asserts switching is “obviously” rational/irrational.*  

  **A vs. B distinction**:  
  - **A (21–25 marks)**: Achieves all must-hit points. *Crucially*, separates all three claims using counterfactuals; fixes grain for “same outcome” using explanatory interests; and addresses *both* NPV sensitivity *and* ex ante feasibility in inefficiency verdict.  
  - **B (16–20 marks)**: Hits most points but conflates two claims; or discusses grain but vaguely; or omits NPV/feasibility in inefficiency.  

  **Closing reflection reserve (embedded in verdict)**  
  - **1 bonus mark** for identifying the *feasibility of 1.60m in 1891* as the critical vulnerability.  
  - **1 bonus mark** for specifying evidence that would change the verdict (e.g., bridge feasibility or credible compensation).  
  *Award these only if integrated into the answer’s closing paragraph; max 2 marks.*  

  ---  
  **Examiner’s note**: Strong answers avoid textbook recitation; weak answers list QWERTY anecdotes or taxonomies without applying them. Prioritise analysis over definitions.
