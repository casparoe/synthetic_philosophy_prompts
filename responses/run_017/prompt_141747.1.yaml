prompt: |-
  You are a professional philosopher who works on deontic logic and on logics that don't explode when something inconsistent shows up — the kind of person who has an actual opinion about what follows from two requirements that can't both be met. Take your time and think carefully; I'd much rather have four paragraphs that have been thought about than fifteen that haven't. Please start by brainstorming five or six candidate concepts you'd genuinely consider here, one line each on why you'd keep or drop them, then narrow to the one or two that survive and do the real carving on those. And please don't pad it with reading suggestions or a bibliography — I'm going somewhere with no internet and I can chase references later. What I want is the shape of the thing, not a label.

  Here's the question: does the pattern I keep running into have a name, and if several names are nearby, which one actually fits?

  I'm a PhD student in human-computer interaction doing fieldwork on how organisations actually use written rule systems — hospital escalation protocols, a housing co-op's rulebook, content-moderation guidelines, and (this one is from a side project) a distributed-systems spec. And I keep finding the same configuration.

  Case one. A hospital protocol has two rules that both fire: escalate immediately if a patient's sats drop below X, and never escalate without a registrar's sign-off. Both are completely clear, there's no vagueness, no dispute about the facts, and nobody says we don't know which one applies. At the incident review, the nurse who escalated without sign-off was described as having done the right thing, and also as having a case to answer — and both of those were said in the same breath, by the same people, without anyone thinking the second remark cancelled the first or demoted either rule to a guideline.

  Case two. The co-op passed one rule in 2019 (every member votes on any decision affecting their tenancy) and another in 2022 (no member votes on a matter where they have a financial interest), both entrenched, both still in the book. When they collided over the bike-shed conversion, the chair's line was: both rules are in force, we are not repealing either, we are not saying either was a mistake, we note the collision in the minutes, and here is the procedure we follow when it happens.

  Case three. Two invariants in a spec that provably can't both hold during a partition. The engineers won't weaken either one or delete either one. They built a component whose entire job is to notice when both can't hold and keep the consequences inside one module so the rest of the system can still be reasoned about normally.

  So the features I think matter: (i) both requirements stay fully in force, for the same agent, at the same time; (ii) the conflict isn't resolved by ranking, by repair, by calling one of them merely provisional, or by adding an exception clause; (iii) it doesn't leak — nobody concludes that nothing is really required, or that everything is permitted, or that the rulebook is worthless; (iv) there's a repeatable procedure, and part of that procedure is a kind of accounting afterwards, which is not the same as a punishment and not the same as saying the conflict was fine. The phrase I've been using in my field notes is in force but contained.

  A philosopher friend muttered the words agglomeration and deontic at me over a drink, then said something about people who think some contradictions are true, then went to a conference and stopped replying. That last bit sounds like it's about facts and truth, and my cases are about rules and requirements, so maybe it's a completely different thing and my friend was just drunk. I also have a half-memory of people arguing about whether, when you can't do both, something is left over afterwards — guilt, or regret, or residue — but that seems to be about how it feels afterwards, whereas what interests me is the inferential discipline: a contradiction is allowed to sit there, in public, and not spread.

  So: does this have a name? If the nearest established concepts each only partly fit, tell me for each one what it gets right and exactly where my description departs from it, and what I'd have to change in my description for it to stop being that concept. Can I get the containment without saying both requirement-claims are true — deny that in-force claims combine, or go non-classical, or treat requirement-talk as not the kind of thing that's true at all — and what does each of those options cost me, i.e. which feature of my three cases can it not account for? Are the both-still-in-force bit and the doesn't-leak bit separable, and if so which is the philosophically interesting one? Give me an operational test too: what would I have to observe in a new organisation to decide which account of my pattern is right? And if nothing established fits, fine — coin a term, define it tightly, and give me two clear positive cases plus two near-misses your definition has to exclude.
reasoning: |-
  Okay, let's start by understanding the user's query. They're a PhD student in HCI studying how organizations handle conflicting rules. They've observed a pattern where two rules conflict, but both remain in force without resolution. The key features are: both rules stay active, no ranking or repair, no leakage into chaos, and a containment procedure with accounting.

  First, I need to brainstorm candidate concepts. The user mentioned deontic logic and non-explosive logics. Let me recall relevant ideas. Paraconsistent deontic logic comes to mind—it handles conflicting obligations without explosion. But does it fit the "in force" aspect? Maybe, but it might not address the procedural containment.

  Next, the Doctrine of Double Effect involves permissible harm but doesn't fit here. The user’s cases aren't about harm; they’re about rule conflicts. So probably a miss. 

  Prima facie duties? Ross's concept allows duties to conflict without resolution. But the user's cases have a structured response, which Ross doesn't provide. So not quite.

  Residual obligations post-violation, like guilt or reparations. But the user says their cases aren't about feelings but procedural containment. So that's out.

  Non-monotonic logic? It allows adding exceptions, but the user explicitly says no exceptions or repairs. So no.

  Institutional facts? Searle's ideas might work. Rules create institutional realities, and conflicts are handled within the system's procedures. This could explain the containment and accounting without leakage. 

  Reified conflicts as system objects? This seems closer. Treating conflicts as first-class entities that the system manages. The engineers' module is a prime example. 

  Now, narrowing down. Paraconsistent deontic logic fits the non-explosion but might miss the procedural aspect. Institutional facts cover the structured handling within the organization's framework. Reified conflicts align well with the technical case and could extend to others. 

  The user wants to know if containment requires both rules to be true. In institutional facts, the rules are in force by social agreement, not necessarily "true" in a classical sense. This avoids truth-value issues. 

  Operational test: Check if the organization has explicit procedures for conflict incidents and if they document without resolving the conflict. If yes, institutional facts or reified conflicts fit. If they resolve by ranking or exceptions, it's something else. 

  Near-misses: A hospital overriding a rule during triage (resolution) vs. documenting conflict without action (leakage). Both are excluded by the user's pattern. 

  Finally, coining a term: "Institutional Conflict Containment" emphasizes the structured handling within the system's norms without resolving the conflict.
answer: |-
  Here’s a structured analysis, reflecting the core features you observed (*in-force but contained conflicts*), and rigorously assessing candidate concepts. I’ve narrowed to the two most promising, then carved deep.

  ### Candidate Concepts (Brainstorm & Filter)
  1. **Paraconsistent Deontic Logic**  
     *Why keep?* Directly addresses non-explosive handling of conflicting obligations.  
     *Why drop?* Focuses on truth-preservation in logic, not institutional procedures/accounting.  

  2. **Prima Facie Duties (Rossian Ethics)**  
     *Why keep?* Acknowledges unresolved conflicts without canceling duties.  
     *Why drop?* No procedural "containment" mechanism; residue is moral, not operational.  

  3. **Residual Obligations (Post-Violation)**  
     *Why keep?* Captures "something left over" (e.g., reparations).  
     *Why drop?* Your cases involve *simultaneous* force, not post-violation residue.  

  4. **Non-Monotonic Logic**  
     *Why keep?* Handles exceptions without deleting rules.  
     *Why drop?* Typically *resolves* conflicts via prioritization (e.g., specificity), which you exclude.  

  5. **Institutional Facts (Searle)**  
     *Why keep?* Rules as constitutive of social reality; conflicts managed within institutional practice.  
     *Why drop?* Needs extension to explain *how* containment works procedurally.  

  6. **Reified Conflicts (Formal Systems)**  
     *Why keep?* Treats conflicts as first-class objects (like your engineers’ module).  
     *Why drop?* Rarely applied to normative (vs. factual) contradictions.  

  **Survivors**: **Paraconsistent Deontic Logic (PDL)** and **Institutional Facts**. Now, deep carving:

  ---

  ### 1. Paraconsistent Deontic Logic (PDL)
  - **What it gets right**:  
    PDL formalizes conflicting obligations (e.g., "escalate" vs. "get sign-off") without explosion. Both requirements remain *true* but non-agglomerative (you can’t derive "do A and not-A"). Matches (i) and (ii): rules stay in force, no ranking/repair.  
  - **Where it departs**:  
    - Fails (iii): Classical PDL doesn’t inherently prevent "leakage" (e.g., "everything is permitted"). Your cases avoid this via *procedural containment* (e.g., incident reviews), which PDL doesn’t model.  
    - Misses (iv): Accounting isn’t a logical feature; it’s institutional.  
  - **Containment without truth?**  
    You *can* avoid calling both "true": Use a **non-classical valuation** (e.g., "obligated" ≠ true/false). But this loses PDL’s core machinery for blocking explosion.  
  - **Cost**: Sacrifices (iii). If obligations aren’t truth-apt, explaining "in force" becomes murky. Why obey if not factually binding?  

  ### 2. Institutional Facts (Extended)  
  - **What it gets right**:  
    Rules create institutional reality (e.g., "registrar sign-off" only exists within hospital norms). Conflicts are *internal* to the system, contained by practices (e.g., minutes, modules). Explains (iii)/(iv): No leakage because the system "quarantines" via procedure; accounting reaffirms institutional order.  
  - **Where it departs**:  
    Needs refinement to handle *entrenched* conflicts (e.g., co-op’s 2019/2022 rules). Standard theory assumes coherence; yours shows *sustained* inconsistency as functional.  
  - **Containment without truth?**  
    Perfect fit: Institutional requirements are "in force" by collective acceptance, not truth. "Escalate now" is *valid* within the protocol, not "true."  
  - **Cost**: Struggles with (ii) if institutions *usually* resolve conflicts. Your cases show they don’t *have* to.  

  ---

  ### Key Insights  
  - **Both-still-in-force vs. doesn’t-leak**:  
    The philosophically interesting core is **containment**. "In force" is necessary but insufficient; leakage avoidance (iii) demands institutional practices.  
  - **Operational Test**:  
    Observe *post-conflict accounting*. If the organization:  
    - Documents the clash *as a conflict* (not a resolution),  
    - Affirms both rules’ validity,  
    - Uses this to reinforce (not undermine) the system’s authority → **Institutional Facts**.  
    If they treat the conflict as a logical state (e.g., "both true, move on") without procedure → **PDL**.  
  - **Why your friend mentioned agglomeration**:  
    PDL rejects *agglomeration* (Obligation A + Obligation B → Obligation (A ∧ B)). This blocks explosion but doesn’t give you containment.  

  ---

  ### If No Fit: Coined Concept  
  **Institutional Conflict Containment (ICC)**  
  *Definition*: A sustained normative conflict where:  
  - (a) Two+ entrenched rules simultaneously bind an agent;  
  - (b) No meta-rule resolves them (ranking/exception/repeal);  
  - (c) The system procedurally contains fallout (documenting, quarantining effects);  
  - (d) Accounting rituals reaffirm *all* rules’ authority, preserving the system’s legitimacy.  

  **Positive Cases** (Yours fit perfectly):  
  1. Hospital protocol + registrar sign-off → incident review.  
  2. Co-op voting rules → minutes noting collision + procedure.  

  **Near-Misses to Exclude**:  
  1. *Triage override*: A nurse ignores "sign-off" during emergencies, invoking a meta-rule ("save life first"). → *Violates (b)*: Conflict resolved by priority.  
  2. *Bankruptcy law*: Debt repayment vs. creditor claims → court *ranks* creditors. → *Violates (b)/(c)*: Resolved, no containment ritual.  

  **Why ICC?** It captures the *social-inferential discipline*: The conflict isn’t solved; it’s *put to work* to sustain the system. That’s the shape.
