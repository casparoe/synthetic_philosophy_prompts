prompt: |-
  You are a professional philosopher specialising in epistemology and the philosophy of language, with a particular brief on the norms governing speech. Please think the problem through carefully, and spend some time at the start brainstorming candidate requirements and the cases that motivate them before you settle on a final list: I would much rather have six requirements that have been pruned than twenty that have not been examined. Answer throughout in British English, and don't spend your word count on citations, bibliographies or a reading list — I know the literature and I want the argument.

  I am writing the specification section of a paper on the epistemic significance of testimony, and I have realised that I don't know what I am entitled to ask a norm of assertion to do. So write me the desiderata: what any adequate account of the norm governing assertion has to deliver — which cases it must get right, which distinctions it must respect rather than collapse, which surrounding commitments it has to stay consistent with — with the case or consideration behind each requirement, and, for each, your verdict on whether it is non-negotiable or merely the prejudice of one camp. Since adequacy is relative to a purpose, let me fix mine: I need a norm that can do two jobs. First, it has to underwrite an account of what a hearer gains when a speaker asserts — why relying on an assertion is different from picking up a belief from overheard noise, and how a hearer's warrant can survive even when the speaker has in fact violated the norm. Second, it has to work as ex ante guidance for speakers who are not in a position to tell whether they know: the asserters I care about are institutional — a press office, an expert panel, an automated announcement system — rather than individuals in conversation. I take it that second job tells against the best-known candidate norm, and I want to see how much it really tells against it, not just that it does.

  Here are the cases I have on my own list; give me yours before you look at mine, and tell me which of mine are genuine constraints and which are only demands I have smuggled in from a favoured theory. The Moorean pair ("the meeting is at noon and I don't believe it is") and the standard challenge data — that "How do you know?" is the canonical retort, that "but it's true, though" does not answer it, and that "you don't believe that" reads as an accusation of insincerity rather than a criticism of the assertion as such. The Gettierised and fake-barn asserter, and the careful asserter whose well-supported claim turns out false: the norm needs to be able to mark something as defective without marking it as blameworthy, and I want to know whether that distinction is a requirement or a repair. The selfless assertion — the friend who must tell a bereaved owner that the dog died on the table on the strength of hearsay she would normally discount. Assertion on merely statistical evidence: the administrator who can see that 499 of 500 tickets were paid and asserts, of this ticket, that it was. The author who asserts every sentence of her book and also asserts, in the preface, that at least one of them is false — does the norm require global consistency across a speaker's assertions, or is that a demand that only looks compelling if you already have belief in view? The spokesperson asserting for a committee whose evidence is distributed across members, no one of whom knows; the automated departure board or generated readout, where nothing believes anything at all; the pre-recorded statement or will, released after the speaker is dead and after circumstances have changed so that what was asserted is now false and known to be false by everyone, with no possibility of retraction, update or ordinary blame; the sealed diary and the assertion made in a language no one present understands, where there is no uptake. Hedging — why "I think it's probably p" lowers the bar, and whether it lowers it all the way to nothing. And the speaker who asserts with complete indifference to whether things are so, but who happens to believe it and happens to be right.

  Then the two things I most want. First, tell me which single requirement excludes the most candidates, and say plainly which of the things people demand of a norm in this area are real and which are the shibboleths of a camp. Second, and this is the part I would read twice: is any subset of the desiderata jointly unsatisfiable — is there a pair or a triple that a norm cannot deliver together, so that the list itself becomes a result? I have a suspicion there is a trilemma somewhere in the vicinity of (a) explaining the knowledge-challenge and Moorean data, (b) being followable by a speaker who cannot tell whether she knows, and (c) staying invariant across stakes while still handling the statistical-evidence cases; if that is not where the real conflict lies, tell me where it is. Close with a short scorecard — a few lines each, no padding — for the knowledge rule as Williamson defends it, the truth rule, the belief rule, and the warranted-assertability or reasonableness rule. The criteria are the deliverable, not the scoring.
reasoning: |-
  Okay, the user is asking me to outline desiderata for a norm of assertion, specifically tailored to their research needs. They're a philosopher working on epistemology and testimony, focusing on institutional speakers and what hearers gain from assertions. 

  First, I need to understand their core requirements: 
  - The norm must explain how testimony provides distinct epistemic warrant for hearers (unlike overheard noise). 
  - It must be action-guiding for non-individual speakers (press offices, AI systems) who can't introspect knowledge states. 
  - They've listed many test cases: Moorean paradoxes, Gettier cases, statistical evidence, etc.

  Hmm... the real challenge is balancing three things: 
  1) Capturing why "how do you know?" is the natural challenge to assertions 
  2) Making the norm followable by speakers without access to their own knowledge states 
  3) Keeping it invariant across contextual factors like stakes while still handling statistical-edge-case assertions.

  I suspect these three might form a trilemma. If the norm requires knowledge (to explain challenges), but institutional speakers can't always self-ascribe knowledge, then it fails the guidance function. Alternative norms like "reasonable belief" might handle guidance better but struggle with Moorean cases where reasonable false assertions still feel defective.

  For their listed cases: 
  - Moorean pairs clearly demonstrate assertion isn't just about truth or belief alone 
  - Selfless assertions and statistical cases pressure the knowledge norm 
  - Automated systems and posthumous assertions challenge belief-based norms 
  - Hedging suggests assertion strength is gradable

  The knowledge norm (Williamson) excels at challenge data but fails guidance for institutional speakers. Truth norm is too weak. Belief norm can't handle insincere correct assertions. Warranted assertability handles guidance well but risks collapsing into contextualism.

  Most exclusionary requirement: "followable without self-ascribing knowledge" – this immediately disqualifies knowledge norms for institutional contexts. Meanwhile, demands like "global consistency across assertions" seem like theory-laden preferences rather than core constraints.

  Final scorecard should contrast how each candidate norm performs on testimony warrant vs institutional guidance without bias. The real tension lies between epistemic rigor and practical applicability.
answer: |-
  ## Desiderata for a Norm of Assertion: Focused on Testimony & Institutional Speakers

  After careful consideration, balancing core epistemic function against your specific purpose (testimonial warrant & institutional guidance), and pruning rigorously, here are the essential desiderata:

  1.  **The Challenge Constraint (Non-negotiable):** An adequate norm must explain why "How do you know?" is the canonical, appropriate, and often sufficient challenge to an assertion. It must also explain why "But it's true!" fails to answer this challenge adequately, and why "You don't believe that" functions primarily as an accusation of insincerity rather than a direct challenge to the assertion's *propriety as an assertion*.
      *   *Case/Motivation:* The Moorean assertion ("p and I don't believe that p") is intuitively defective specifically *as an assertion*, even if true. The standard challenge data ("How do you know?") points directly to the speaker's epistemic position as central to the normative standard for asserting. This is fundamental to distinguishing assertion from mere guesswork or expression.
      *   *Your Cases:* Moorean pair, standard challenge data. Genuine constraint, central to the practice.

  2.  **The Warrant-Preservation Constraint (Non-negotiable):** The norm must underwrite an account where a hearer can gain genuine epistemic warrant (justification, entitlement) for believing *p* from an assertion that *p*, even if the speaker *themselves* violated the norm governing their assertion. The warrant gained must be distinct from what one would gain from overhearing a noise coincidentally conveying a truth.
      *   *Case/Motivation:* This captures the core epistemic value of testimony. If the hearer's warrant depended on the speaker *actually satisfying* the norm, testimony would be epistemically precarious. The norm must define a standard such that a speaker's *apparent* satisfaction (or justified attempt to satisfy it) can transmit warrant, even if they fail covertly (e.g., Gettier, fake barns).
      *   *Your Cases:* Hearer's gain, Gettierised/fake-barn asserter. Genuine constraint, essential for testimony.

  3.  **The Guidance Constraint (Non-negotiable for your purpose):** The norm must be followable *ex ante* by a speaker who is not necessarily in a position to know (or infallibly determine) whether they satisfy the norm itself. It must provide actionable guidance for speakers who lack privileged access to their own epistemic state or the truth.
      *   *Case/Motivation:* Institutional speakers (press offices, expert panels, AI systems) cannot reliably introspect to determine if they "know" in a philosophically robust sense. They operate on procedures, evidence bases, and distributed cognition. The norm must be applicable based on accessible factors (evidence quality, procedures followed, reasonableness).
      *   *Your Cases:* Institutional speakers (panel, AI, spokesperson), distributed evidence, automated systems. Genuine constraint *for your specific purpose*.

  4.  **The Defect/Blame Distinction Constraint (Negotiable, but important):** The norm should ideally allow for assertions to be *defective* (failing the norm) without necessarily implying the speaker is *blameworthy*. It should mark a failure of the *act* itself, separable from culpability of the *agent*.
      *   *Case/Motivation:* Gettier cases, careful asserter with false but well-supported belief, selfless assertion (if defective). The careful asserter did everything right epistemically but was unlucky; blame seems inappropriate, but the assertion itself seems flawed. Selfless assertion might be *pragmatically* justified but *epistemically* defective. Distinguishing act-failure from agent-failure enhances normative precision.
      *   *Your Cases:* Gettier/fake barn, careful false asserter, selfless assertion. Important demand, but potentially a refinement rather than a core constraint; some theories might build blame into the norm or handle this via excusing conditions.

  5.  **The Truth-Independence Constraint (Non-negotiable):** The norm must be distinct from a simple truth norm. Merely asserting a truth is insufficient for propriety; asserting a falsehood is insufficient for impropriety (in specific ways).
      *   *Case/Motivation:* The careful asserter with a justified false belief violates a plausible norm, even though false. The Gettier speaker asserts a truth but violates a plausible norm. The selfless asserter *might* assert a truth but based on inadequate grounds. Assertion requires more than luck.
      *   *Your Cases:* Careful false asserter, Gettier case. Genuine constraint, follows from Challenge Constraint.

  6.  **The Belief-Independence Constraint (Non-negotiable for your purpose):** The norm must not *necessarily* require the speaker to *believe* the proposition asserted. It must be possible for an assertion to satisfy the norm (or be defective for reasons other than lack of belief) even if the speaker lacks belief.
      *   *Case/Motivation:* Institutional speakers (AI, spokesperson, press office asserting a committee view), pre-recorded statements (asserted when true, believed then, but speaker now dead/cannot retract), sealed diary. These entities either cannot believe or may not believe the specific proposition at the time of "assertion" (in the institutional sense). "You don't believe that" targets sincerity, not necessarily assertion propriety *if* the norm is otherwise satisfied (e.g., known by the committee, well-supported by data).
      *   *Your Cases:* Institutional speakers, automated systems, pre-recorded statement, sealed diary. Genuine constraint *for your purpose*, heavily pressures belief-based norms.

  **Assessing Your Other Cases:**
  *   **Statistical Evidence:** Highlights tension between intuitive risk-aversion and knowledge/truth norms. Important test case, but *not* necessarily a core constraint demanding a specific outcome (e.g., forbidding such assertions). It tests how the norm handles probabilistic support.
  *   **Preface Paradox:** Tests whether the norm demands global consistency. Likely a **smuggled demand** from belief-centric views. Assertion norms plausibly govern *individual* acts. One can properly assert each book sentence based on evidence for each, and properly assert the preface based on fallibilism, without violating an assertion norm *per se*.
  *   **Hedging:** Shows that assertion strength is gradable. "I think p" lowers the epistemic threshold *for that speech act* compared to flat-out "p". Important for understanding assertion strength but doesn't define the core norm for flat assertions.
  *   **Indifferent True Asserter:** Tests sincerity vs. norm satisfaction. If they have adequate warrant/knowledge, their assertion might satisfy a knowledge/warrant norm *despite* indifference. Lack of belief/intent points more to insincerity than violation of the core epistemic norm of assertion. Not a primary constraint.

  **The Most Exclusionary Requirement:**
  The **Guidance Constraint** (followable without self-ascribing knowledge) is the most exclusionary. It immediately rules out the **Knowledge Norm** (Williamson) in its standard form for institutional speakers, as they often cannot determine if they meet the factive condition. It also pressures simple Truth and Belief norms, as determining truth/belief reliably *ex ante* is often equally inaccessible. This strongly favors **Warranted Assertability/Reasonableness** norms.

  **Shibboleths vs. Real Demands:**
  *   **Shibboleths:** Demanding *infallibility*, demanding *global consistency* (Preface), demanding assertions *always express belief*, insisting the norm *must* explain statistical aversion (it might not *require* forbidding such assertions).
  *   **Real Demands:** Explaining the "How do you know?" challenge, allowing warrant preservation despite speaker failure, providing *ex ante* guidance, distinguishing defect from blame, separating assertion propriety from mere truth or mere belief.

  **The Trilemma:**
  Your suspicion is astute. A genuine tension exists between:

  1.  **Explaining Challenge/Moorean Data:** Strongly suggests a knowledge-like norm.
  2.  **Followable Guidance:** Requires a norm based on accessible factors (evidence, reasonableness), not factive states like knowledge.
  3.  **Stakes-Invariance & Statistical Cases:** Requires the norm not to fluctuate wildly with context, yet handle why high-stakes or bare statistical assertions feel risky.

  **A norm satisfying (1) (e.g., Knowledge) struggles with (2). A norm satisfying (2) (e.g., Reasonable Belief/JBE) struggles to fully explain (1) as sharply as Knowledge does and may inadvertently introduce context-sensitivity conflicting with (3). A norm trying for strict stakes-invariance (3) while handling statistics might struggle to explain intuitive risk-aversion in high-stakes/low-probability cases without contextual adjustment.** The core conflict is between the **epistemic rigor** demanded by the challenge data and the **practical actionability** demanded by institutional guidance. (1) and (2) are the primary horns of the dilemma for your purpose; (3) adds pressure on the solution.

  **Candidate Norm Scorecard (Deliverables):**

  *   **Knowledge Rule (Williamson):**
      *   *Delivers:* Excellent on Challenge/Moorean Data (1), clear Truth-Independence, potentially Warrant-Preservation (if hearer can reasonably presume knowledge). Explains defect in Gettier/statistical/selfless cases.
      *   *Fails:* Guidance Constraint (cannot be followed *ex ante* by speakers unable to self-ascribe knowledge). Belief-Independence (problematic for institutions/AI). Struggles with stakes-invariance in practice (though not in theory).

  *   **Truth Rule:**
      *   *Delivers:* Simple. Belief-Independence possible. Allows institutional assertion of truths.
      *   *Fails:* Challenge Constraint ("How do you know?" not explained). Truth-Independence (allows lucky guesses, condemns careful false assertions). Poor Warrant-Preservation (hearer warrant shouldn't depend solely on speaker's truthfulness luck). Guidance difficult (cannot ensure truth *ex ante*).

  *   **Belief Rule:**
      *   *Delivers:* Explains insincerity challenge. Some Guidance (speakers can often tell what they believe).
      *   *Fails:* Challenge Constraint (doesn't explain "How do you know?"). Truth-Independence (condemns careful false believers). Belief-Independence (fails for institutions/AI). Warrant-Preservation weak (belief without warrant transmits poorly). Allows assertions based on unwarranted belief.

  *   **Warranted Assertability/Reasonable Belief/Justified Belief (JB) Enough (JBE):**
      *   *Delivers:* Strong on Guidance Constraint (based on accessible evidence/reasonableness). Good potential for Warrant-Preservation (hearer presumes warrant). Handles Belief-Independence (warrant can be institutional/procedural). Can explain defect in Gettier/false careful asserter/statistical cases (if JB/JBE requires more). More stakes-invariant *as a norm* than contextualist versions.
      *   *Fails:* Challenge Constraint (explains "How do you know?" less directly/naturally than Knowledge rule; "I have excellent justification, but I don't *know*" still sounds somewhat odd as a response). Needs careful formulation to avoid collapsing into contextualism or becoming too weak (e.g., mere sincerity). May struggle to mark selfless assertion as *epistemically* defective if JB is met pragmatically.

  This framework prioritises the demands essential for your project: explaining testimonial warrant distinctively and guiding institutional speakers. The Guidance Constraint and Belief-Independence Constraint, driven by your focus, are key differentiators and point strongly towards a Warrant/Reasonableness norm, albeit one that must grapple with explaining the challenge data as robustly as possible. The trilemma you identify captures the central tension.
