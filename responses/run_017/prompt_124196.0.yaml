prompt: |-
  I am part of a small penal-reform reading group that meets after lectures, and last week we got stuck on the argument between Daniel Dennett and Gregg Caruso about just deserts and punishment. As I understand the dialectic, Dennett defends a compatibilist, forward-looking practice of holding people responsible, while Caruso argues from free-will scepticism that nobody has basic desert — nobody deserves to suffer or be censured simply in virtue of having wrongly chosen, apart from any deterrent, rehabilitative, or protective benefit — and that the state should therefore replace retributive punishment with something like a public-health-quarantine model, allowing incapacitation, treatment, and risk-reduction but not blame. I do not want another pro-and-con list; I want the specification that any adequate theory would have to meet if it were to serve as the normative backbone of a criminal code in a liberal democracy whose citizens disagree about free will. The purpose is practical: the theory must be good enough to tell a sentencing commission whether desert should be retained as a limiting principle on punishment, whether it should be replaced by the quarantine model, and, if some hybrid is needed, how to resolve cases where blameworthiness and dangerousness come apart. To make this concrete, suppose the commission is experimenting with a two-number sentence worksheet: judges must record a desert score reflecting how much blame the offender is judged to deserve for the offence, given their reasons-responsive capacities at the time and the harm actually caused, and a risk score reflecting an actuarial estimate of the probability of serious reoffending if nothing is done. The draft rule says the censuring element of the sentence may not exceed the desert score, but the duration of preventive supervision may not be shorter than the risk score requires. When the two scores diverge, the worksheet produces results that strike some of us as unfair or incoherent.

  Please write the desiderata: what any theory of punishment, or any account of just deserts, must deliver to be adequate for this purpose — the phenomena it must explain, the cases it must get right, and the distinctions it must respect — with the case or consideration behind each requirement. Use at least the following stress cases: the high-desert/low-risk elderly fraudster who is unlikely to offend again; the low-desert/high-risk offender whose dangerousness is largely the product of a neurological disorder or severe duress rather than a blameworthy choice; the successful killer versus the attempted killer where the only difference is luck; the offender whose high risk score is driven mainly by poverty, addiction, or postcode rather than by culpability; and the offender who repents and reforms before sentencing, so that desert and risk appear to move in opposite directions. For each desideratum, say whether it is non-negotiable for any theory adequate to this purpose or merely a preference of a camp — for example, a retributivist insistence on strict proportionality, a forward-looking insistence that every sanction be justified by expected harm reduction, or a quarantine model's refusal to censure — and flag any requirement you suspect is really a prejudice rather than a genuine desideratum. I am especially interested in the subset of desiderata that may be jointly unsatisfiable: if treating offenders as agents conflicts with a pure quarantine model, or if desert-as-a-side-constraint plus actuarial prevention cannot both be honoured in the moral-luck or social-determinist cases, locate the collision precisely and say which requirement would have to give. Tell me also which single desideratum, if accepted, would exclude the largest number of otherwise attractive theories.

  Please do not give me a bibliography, reading list, or citations; I am working offline and only need the substance. If it helps, you may end with a one-sentence verdict on each of three families of view — traditional retributivism, Dennett-style compatibilist and forward-looking accounts, and Caruso-style free-will-sceptical quarantine models — but no table, no extended comparison, and no citations; the criteria are the deliverable, not another survey. In your answer, separate what is settled among people who work on punishment theory and the free-will debate from what is genuinely contested, and do not present a contested view as the consensus: where you recommend relaxing or dropping a requirement, say whether that is a confident verdict or a conjecture, and flag any place where the answer depends on how persuasive one finds the sceptical argument about basic desert rather than on something every competent theorist accepts. Please write the response in British English.
reasoning: |-
  Okay, the user is part of a penal-reform reading group focusing on the Dennett-Caruso debate about just deserts and punishment. They need a set of desiderata for a theory of punishment that can guide a sentencing commission in a liberal democracy where citizens disagree about free will. The theory must handle a two-number system (desert and risk scores) and address specific stress cases. 

  First, I need to ensure the response stays practical. The user isn't asking for pro-con lists but for clear criteria any adequate theory must meet. They mentioned concrete cases like the elderly fraudster (high desert/low risk), offenders with neurological disorders (low desert/high risk), moral luck cases, socio-economic drivers of risk, and reformed offenders. Each desideratum should link to these cases.

  The user wants to know which requirements are non-negotiable vs. contested. For example, retributivists insist on proportionality, while forward-looking theories reject censure without benefit. I should highlight where theories conflict, like when desert as a side-constraint clashes with pure prevention in moral luck cases. Also, identify which desideratum, if accepted, rules out most theories—likely the "no undeserved censure" one.

  I should separate settled points from contested ones. For instance, that punishments must be justified is settled, but whether desert is necessary is contested. When recommending relaxing a requirement, clarify if it's a confident verdict (e.g., relaxing strict proportionality for resource reasons) or a conjecture (e.g., dropping desert entirely).

  The response must be in British English and avoid citations. End with one-sentence verdicts on retributivism, Dennett-style, and Caruso-style models, without extended comparisons.

  Key desiderata to cover:
  1. **Non-arbitrariness**: Punishments need justification; without it, they're illegitimate. This is non-negotiable.
  2. **Public safety**: Protect society from harm—non-negotiable, but how it's achieved is contested.
  3. **Recognition of agency**: Treat offenders as moral agents. Retributivists see this as non-negotiable; quarantine models might reject it.
  4. **Limiting principles**: Constraints on state power, e.g., no punishment without desert or danger. Non-negotiable for legitimacy.
  5. **Non-stigmatisation**: Avoid unnecessary stigma. Quarantine models prioritise this; others see it as secondary.
  6. **Practicality**: Must work in the real world. Non-negotiable but implementation varies.

  Stress cases:
  - **Elderly fraudster**: Tests if desert can limit punishment when risk is low. Retributivism insists on censure; quarantine models might oppose it.
  - **Neurological disorder case**: Challenges if dangerousness without desert justifies detention. Desert-first theories say no; quarantine says yes.
  - **Moral luck (successful vs. attempted killer)**: Highlights proportionality issues. Retributivists see unequal desert as unfair; forward-looking theories may see equal risk and thus equal treatment.
  - **Socio-economic drivers**: Asks if risk from poverty affects desert. Most theories mitigate desert for context, but risk scores may still demand detention.
  - **Reformed offender**: Desert may remain high while risk drops. Retributivism might still censure; prevention-focused models would reduce sanctions.

  Major conflict: "No undeserved censure" vs. "Public safety." If an offender is dangerous but not blameworthy (e.g., neurological disorder), censure violates the first, while not detaining violates the second. Hybrid models struggle here.

  The "no undeserved censure" desideratum excludes quarantine models and some forward-looking theories if they impose censure without desert.

  Settled: Punishments need justification; safety is a goal; proportionality matters in some form. Contested: Whether desert is necessary, if censure is ever justified, and how to balance desert and risk.

  Verdicts:
  - **Retributivism**: Prioritises desert but risks excessive punishment when risk is low and under-protection when risk is high without desert.
  - **Dennett-style**: Balances agency and consequences but may allow undeserved censure if beneficial.
  - **Caruso-style**: Avoids desert but risks perceived injustice when detaining non-culpable individuals.

  Finally, ensure clarity and conciseness, using British spelling and terminology.
answer: |-
  Below are the desiderata for a theory of punishment intended to serve as the normative backbone of a criminal code in a liberal democracy with deep disagreement about free will. The focus is on practical adequacy for a sentencing commission using a two-number (desert/risk) worksheet. Desiderata are derived from core liberal-democratic commitments, penal theory's settled insights, and stress-testing against hard cases. Each includes: (1) the requirement, (2) the case or consideration motivating it, (3) whether it is non-negotiable (NN) or contested (C), and (4) if contested, which camp typically insists on it. NN status denotes what any competent theorist in a liberal democracy must accept; C indicates allegiance to a particular view (e.g., retributivist, forward-looking, sceptical). Prejudices—commonly held but rationally dubious assumptions—are flagged. Finally, key conflicts and exclusionary desiderata are identified.

  ### Core Desiderata
  1. **Non-arbitrariness**  
     - **Requirement**: Punishments must be justifiable by public reasons, not mere preference, vengeance, or bias.  
     - **Case**: General legitimacy of state coercion; without justification, punishment becomes tyrannical.  
     - **Status**: **NN** (settled). Even free-will sceptics demand non-arbitrary grounds (e.g., danger).  

  2. **Public safety as a goal**  
     - **Requirement**: The system must credibly reduce serious harm to the public.  
     - **Case**: The low-desert/high-risk offender (e.g., severe neurological disorder causing violence). Ignoring risk here invites preventable harm.  
     - **Status**: **NN** (settled). All camps accept safety as *a* goal, though they prioritise it differently.  

  3. **Recognition of moral agency (where present)**  
     - **Requirement**: Offenders capable of reason-responsiveness must be treated as agents, not merely objects to be managed. This includes acknowledging their reasons for acting.  
     - **Case**: The repentant offender: reform may lower risk, but desert remains if their past act reflected agency. Denying agency dehumanises.  
     - **Status**: **C** (retributivist/compatibilist insistence). Non-negotiable for Dennett-style accounts; rejected by pure quarantine models like Caruso’s, which treat all "offenders" as patients.  

  4. **Limiting principles against state overreach**  
     - **Requirement**: Punishment must be constrained to prevent excessive or unjust state power (e.g., no punishment without desert *or* danger).  
     - **Case**: The high-desert/low-risk elderly fraudster: imposing severe preventive measures here would be disproportionate if based solely on risk.  
     - **Status**: **NN** (settled). The specific constraint (desert, necessity, etc.) is contested, but *some* limit is essential for liberal legitimacy.  

  5. **Avoidance of stigma where undeserved**  
     - **Requirement**: Censure/blame must not be applied to those who lack basic desert (e.g., no moral condemnation for unavoidable incapacity).  
     - **Case**: The low-desert/high-risk offender with a neurological disorder: censure here is inappropriate and inhumane.  
     - **Status**: **C** (quarantine model insistence). Retributivists see censure as inherent; forward-looking views may tolerate "instrumental blame" if socially useful. **Suspected prejudice**: The intuition that *all* punishment must express blame.  

  6. **Practical applicability under uncertainty**  
     - **Requirement**: The theory must generate clear, consistent guidance with imperfect knowledge (e.g., actuarial risk scores are fallible; desert assessments are subjective).  
     - **Case**: The offender whose high risk score stems from poverty/postcode: risk tools often encode bias, yet decisions can’t wait for perfect data.  
     - **Status**: **NN** (settled). A theory demanding unattainable certainty (e.g., exact desert quantification) fails in practice.  

  ### Stress-Case-Specific Desiderata
  7. **Proportionality of censure to culpable choice**  
     - **Requirement**: The censuring element must reflect the offender’s reasons-responsive capacities and the wrongfulness of their choice, not just outcomes.  
     - **Case**: Successful vs. attempted killer (moral luck): equal culpability deserves equal censure, even if harm differs.  
     - **Status**: **C** (retributivist insistence). Forward-looking views may prioritise risk (e.g., successful killers might pose higher risk). Quarantine models reject censure entirely.  

  8. **Desert as a ceiling for censure**  
     - **Requirement**: The censuring element (e.g., symbolic stigma, punitive hard treatment) must not exceed what is deserved.  
     - **Case**: High-desert/low-risk elderly fraudster: desert justifies censure, but low risk forbids preventive excess.  
     - **Status**: **C** (retributivist/compatibilist). Quarantine models reject desert ceilings; forward-looking views may breach ceilings if benefits outweigh costs.  

  9. **Preventive measures justified by danger, not culpability alone**  
     - **Requirement**: Preventive detention/treatment must require independent evidence of danger, not mere desert.  
     - **Case**: Low-desert/high-risk offender (neurological): incapacitation is permissible only if risk is real and mitigable, not because they "deserve" it.  
     - **Status**: **NN** (settled). Even retributivists accept prevention beyond desert *if* danger is proven.  

  10. **Non-punitive response to social determinants**  
      - **Requirement**: Risk driven by poverty/addiction/postcode must reduce desert weight and shift responses toward support, not censure or pure containment.  
      - **Case**: Offender with high risk score from socioeconomic factors: blame is mitigated, and prevention must address root causes (e.g., treatment, not prison).  
      - **Status**: **C** (forward-looking/sceptical). Retributivists may still insist on *some* desert for choices within constraints. **Suspected prejudice**: Ignoring social context as "excuses."  

  11. **Dynamic responsiveness to reform**  
      - **Requirement**: The system should recognise post-offence changes (e.g., repentance) by reducing censure or prevention where appropriate.  
      - **Case**: Repentant offender: desert may remain (for the act), but risk drops—requiring shorter supervision but perhaps unchanged censure.  
      - **Status**: **C** (forward-looking preference). Retributivists fix desert at the time of the act; quarantine models adjust prevention to current risk.  

  ### Key Conflicts and Exclusionary Desiderata
  - **Major Conflict**: Desideratum 3 (recognition of agency) and Desideratum 5 (no undeserved stigma) collide with Desideratum 2 (public safety) in cases like the **low-desert/high-risk offender**. Treating them as an agent suggests blame is inappropriate (supporting 5), but detaining them without censure (per quarantine) may violate agency-recognition (3). If risk is high, safety (2) demands action, but desert constraints (8) may forbid it.  
    - **Resolution Required**: One must give. If agency recognition (3) is relaxed, quarantine models work but may dehumanise. If safety (2) is relaxed, retributivism risks public harm. *Confident verdict*: Agency recognition must be qualified (e.g., apply only where capacity exists), but this remains contested.  

  - **Exclusionary Desideratum**: **"No undeserved censure"** (from Desideratum 5). If accepted as non-negotiable, it excludes:  
    - Traditional retributivism (insists on censure for desert regardless of utility).  
    - Dennett-style accounts (may allow instrumental censure if beneficial).  
    - Only Caruso-style quarantine survives, but it faces challenges on agency recognition and public legitimacy.  

  ### Verdicts on Theoretical Families
  - **Traditional retributivism**: Prioritises desert and proportionality but risks under-protecting society when risk exceeds desert and over-punishing when desert exceeds risk.  
  - **Dennett-style compatibilist/forward-looking**: Balances agency and consequences pragmatically but may permit undue censure for instrumental reasons, alienating sceptics.  
  - **Caruso-style quarantine**: Avoids desert-based stigma and focuses on prevention but struggles to acknowledge agency, risking unjust containment and liberal legitimacy.  

  ### Settled vs. Contested  
  - **Settled** (NN): Desiderata 1 (non-arbitrariness), 2 (safety as *a* goal), 4 (limits on state power), 6 (practicality), and 9 (prevention requires danger).  
  - **Contested**: Agency recognition (3), no undeserved stigma (5), proportionality (7), desert ceilings (8), and dynamic reform (11). These depend on reconciling free-will debates—e.g., relaxing 3/5/7/8 requires accepting sceptical arguments about basic desert, which is not resolved among theorists. Where recommendations involve relaxing requirements (e.g., qualifying agency recognition), this is a **confident verdict** only if one rejects libertarian free will; otherwise, it remains a **conjecture**.
