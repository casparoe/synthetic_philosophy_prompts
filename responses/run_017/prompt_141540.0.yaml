prompt: |-
  Hi — I'm a PhD student in linguistics (well, linguistic anthropology, sort of), and I've got a pattern in my own data that I can't find a name for. It's possible somebody has named it and I just don't read the right literature; it's also possible nobody has and I need to coin something for chapter 3 before my committee asks. Either way, I don't want just a label. I want to know what the thing actually is, what nearby things it isn't, and where its edges are.

  Setup, briefly. I've been working on the fishing-gear vocabulary of a small island community (I'd rather not name it, ethics stuff). The microdomain is terms for gill nets. There are four, which I'll call pila, taru, méska and won — pseudonyms; in my fieldnotes they're glossed as 'fine', 'middle', 'coarse' and 'very coarse'. The underlying dimension is close to one-dimensional: mesh size, with target species riding along on top of it.

  The thing I keep tripping over:

  (1) In a sorting task with twelve nets spanning 20–60 mm mesh, one consultant puts the pila/taru cut at about 32 mm and the taru/méska cut at about 47. Two months later, same consultant, a different twelve nets spanning 40–95 mm: the cuts land around 58 and 79. Nothing about their fishing changed in between. Show them a 45 mm net in the second session and they call it pila without hesitating; remind them they called a 45 mm net méska last time and they aren't bothered — I get something like 'that one was with the small ones'. So the boundary isn't a threshold on mesh size. But they talk as if it is: 'a pila is the sardine net, it's the fine one'.

  (2) It's asymmetric, which is the part I really can't place. When a much finer monofilament net showed up a few years ago, pila did not stretch down to cover it. People built a phrase instead — 'the new kind of pila', 'the thin-thin one'. But when a much coarser net came in, won just absorbed it, nobody said anything, and the word's upper end effectively vanished. My hunch is that the fine end is pinned to a function (a target species, a way of fishing) and the coarse end isn't pinned to anything, but I don't know what to do with that hunch or even whether it's the same phenomenon as (1).

  (3) Two fishermen whose boats carry different ranges of nets will apply different words to the very same net, fast, and without treating the difference as a disagreement. 'For us that's a taru.' Which sounds contextualist, except it isn't like 'tall' or 'local', where there's at least sometimes something in the sentence, or something obvious in the situation, that the comparison class goes into. Here the comparison class is just whatever nets happen to be in play, and if I ask a consultant what the comparison class is they can't tell me — they insist the word picks out a kind of net.

  What I think it isn't, so you don't waste time: it isn't the usual prototype / typicality-gradient / fuzzy-boundary story, because there aren't any typicality effects here, judgments are instant and categorical, and nobody hedges. It isn't ordinary vagueness or polysemy either, or not only that: the shifts are systematic and directional, not a sprinkle of borderline cases. And it isn't the plain comparative-adjective case, because there's no slot anywhere for the comparison class to go.

  What keeps going round in my head is whether the right description is that these words don't encode thresholds at all. Maybe what they encode is a rank in a locally constructed ordering — roughly 'the finest of the nets currently in play' — so the content gets filled in by the situation rather than shifted by it. On that reading there's no stable core and no moving boundary, just an ordering plus an anchor, and the apparent stability of everyday usage is an artifact of the anchor rarely moving, because the set of gear a boat actually carries is pretty fixed. It also feels adjacent to (but not the same as) what people say about concepts that seem to get their content by being hooked up to something in the context, rather than by describing anything intrinsic to the thing itself.

  So: does this configuration have a name of its own? If it does, which of the neighbors is it really, and how exactly does it differ from the ones I gestured at above? If it doesn't, I need to name it and define it, including what would and wouldn't count as an instance — and in particular whether (1), (2) and (3) are one phenomenon or three. And I'd really like a way to tell the 'rank in a local ordering' story apart from a 'fixed threshold plus a moving anchor' story: what would distinguish them, and is there any case, actual or constructable, where they give different predictions? I can definately build a follow-up elicitation around whatever the discriminating case is, so be as concrete as you can.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a PhD student in linguistic anthropology, working on fishing-gear terminology, specifically gill nets with four terms based on mesh size. The main issue is the shifting boundaries of these terms in different contexts. 

  First, I need to understand the three phenomena they describe. In (1), the same consultant places category boundaries at different mesh sizes depending on the range of nets presented. A 45mm net is called "pila" in one session and "meska" in another, but the consultant isn't bothered by this inconsistency. This suggests the categories aren't fixed but relative to the context.

  Then (2) shows asymmetry: when a finer net is introduced, "pila" doesn't extend; instead, new phrases are created. But a coarser net gets absorbed into "won" without issue. The user's hunch is that the fine end is anchored to function (target species), while the coarse end isn't. 

  In (3), different fishermen categorize the same net differently based on their usual gear, without seeing it as a disagreement. They can't explain the comparison class, insisting the terms are fixed. This points to an implicit, context-dependent ranking.

  The user has ruled out prototypes, vagueness, polysemy, and comparative adjectives. They propose that the terms encode a rank in a local ordering with an anchor. My task is to figure out if this has a name or if they need to coin a term.

  I recall that in semantics, relative gradable adjectives like "tall" depend on a contextually determined comparison class. But here, there's no syntactic slot for that comparison class, and speakers don't acknowledge it. This reminds me of "covert comparison classes" or "categorization by local contrast." 

  The asymmetry in (2) is crucial. The fine end is anchored to a functional property (catching sardines), making it resistant to extension, while the coarse end is more flexible. This functional anchoring might relate to "functional fixedness" in cognitive psychology or "artifact categorization" in linguistics, where tools are defined by use.

  The local ranking without explicit comparison class sounds like "implicit contextual calibration." Terms like "medium" in other domains (e.g., coffee sizes) might behave similarly, but here the anchor adds stability. 

  I should check if "anchored relative categorization" exists. If not, coining a term like "functionally anchored local ranking" (FALR) might work. The key features are context-dependent ranking, functional anchor at one end, and covert comparison class.

  To distinguish between "local ranking" and "moving anchor" theories, I need testable predictions. For example, introducing nets that disrupt the functional anchor should cause hesitation or new terms, while adding to the coarse end might be absorbed. Also, varying the number of nets in the middle could affect boundary shifts. 

  The user can test this by presenting nets that challenge the functional anchor or by changing the density of nets in the range. If boundaries shift only when the functional anchor is stable, it supports the local ranking with anchor. If the anchor moves discretely, it's a different model.

  Also, in (3), if fishermen's categories adapt based on their gear sets without explicit disagreement, it reinforces that the comparison class is tied to habitual context, not the immediate situation. Eliciting judgments with mixed gear sets could reveal if the anchor (functional end) remains fixed while other boundaries shift.

  Putting it together, the phenomena seem interconnected: context-dependent boundaries, functional anchoring causing asymmetry, and covert comparison classes. Naming it as "functionally anchored local ranking" captures these elements. Defining it would involve specifying the conditions: presence of a functional anchor, context-dependent ranking, and lack of overt comparison class. 

  I should also mention related concepts like "covert comparison" and "artifact categorization by function" to position it in existing literature. The user might draw from cognitive anthropology, like how cultural domains structure terms relative to practical use.
answer: |-
  This is a fascinating pattern that cuts to the heart of categorization, context-dependence, and the pragmatics of artifact terms. You're describing a phenomenon that sits *between* established categories, and I agree it needs its own conceptual framing. While elements resemble known concepts, the *combination* – particularly the systematic context-dependence, asymmetry, lack of explicit comparison class, and functional anchoring at one end – suggests a distinct configuration. Let's break it down:

  **The Core Phenomenon: Functionally Anchored Local Ranking (FALR)**

  I propose coining **Functionally Anchored Local Ranking (FALR)** as the core phenomenon unifying your observations. Here's the definition and its components:

  1.  **Local Ranking:** The primary semantic content of the terms (`pila`, `taru`, `méska`, `won`) is **not** an absolute threshold on a dimension (e.g., mesh size), but rather a *relative rank* within a contextually relevant ordered set. This set is typically the range of nets salient in the immediate situation (elicitation task, boat gear, recent memory).
  2.  **Functional Anchor:** One end of the scale (typically the finest-grained, "pila" end) is anchored to a specific, stable *functional affordance* (e.g., "catches sardines effectively"). This anchor is relatively fixed and resistant to contextual stretching *beyond* its functional range.
  3.  **Covert Comparison Class:** The contextually relevant set (the "local" in local ranking) is not explicitly specified in discourse, is often not consciously accessible to speakers ("they insist the word picks out a kind of net"), and is determined pragmatically by the situation (which nets are physically present, under discussion, or typical for an actor).
  4.  **Categorical Expression:** Despite the underlying relativity, the terms are used and perceived as discrete, categorical labels within any given context. Judgments are fast and firm; hedging is absent because the category *is* absolute *relative to the current frame*.

  **Why Existing Labels Don't Quite Fit:**

  *   **Prototypes / Gradience / Fuzzy Boundaries:** As you note, this isn't about typicality gradients or borderline cases. The boundaries shift *systematically* based on context, not fuzzily within a fixed range. Judgments are categorical within a frame.
  *   **Ordinary Vagueness:** Vagueness usually involves borderline cases *within a generally fixed range* (e.g., "bald"). Here, the *entire range* of application for `taru` or `méska` shifts dramatically. The fine end shows resistance to vagueness stretching due to the anchor.
  *   **Polysemy:** There's no evidence for distinct, conventionalized senses (e.g., `taru` meaning "medium-fine" vs. "medium-coarse"). The meaning shift is systematic and predictable based on context, not lexicalized.
  *   **Comparative Adjectives ("tall", "local"):** This is the closest neighbor, but crucially, comparative adjectives typically allow or require an *overt* or easily recoverable comparison class ("tall *for a jockey*", "local *pub*"). In your case, the comparison class is *covert* and situationally determined, often inaccessible to meta-linguistic reflection. The functional anchor is also absent in simple comparatives.
  *   **Indexicality:** While context-dependent, these aren't pure indexicals like "I" or "here." The meaning depends on the *salient set* of artifacts, not just speaker location/time.
  *   **Division of Linguistic Labor (Putnam):** Not relevant. All speakers seem equally competent within their context; it's not expert vs. lay usage.
  *   **Kind vs. Occasion Meaning (Travis):** Touches on it, but Travis usually focuses on how context determines whether a predicate applies *at all* (e.g., "green" leaves vs. "green" paint). Here, the predicate *always* applies to *some* nets; context determines *which* nets it applies to by shifting the boundaries systematically.

  **How FALR Explains Your Observations:**

  1.  **Shifting Boundaries (Your Point 1):** In the first task (20-60mm), the salient set is finer. `Pila` covers the finest ranks (down to 20mm), `taru` the next ranks, etc. In the second task (40-95mm), the salient set is coarser. `Pila` still covers the *finest ranks available* (starting ~40mm), `taru` the next, etc. The 45mm net is `pila` in the coarse context because it's among the finest *there*; it was `méska` in the fine context because it was coarser *relative to the 20mm nets* present then. The functional anchor (`pila` ≈ sardine net) explains why it *can* still extend down to 40mm (which still catches sardines), but wouldn't extend below its functional range.
  2.  **Asymmetry (Your Point 2):** The ultra-fine monofilament falls *below* the functional range of `pila` (it might catch different, smaller fish inefficiently or clog). Therefore, the anchor prevents `pila` from stretching down. New phrases are needed. The ultra-coarse net falls *above* the functional range of `won` (which likely targets large fish, but "large fish" is less specific/sensitive than "sardine"). As there's no strong functional anchor *preventing* extension upwards, `won` stretches to absorb it. The coarse end is "open" relative to the anchored fine end.
  3.  **Contextual Variation without Disagreement (Your Point 3):** Fisherman A's boat carries nets 30-70mm. Their salient set establishes `taru` for, say, 40-55mm nets. Fisherman B's boat carries 45-90mm nets. Their salient set establishes `taru` for, say, 55-70mm nets. When shown a 60mm net, A calls it `méska` (coarser in *their* set), B calls it `taru` (finer in *their* set). Neither is "wrong" because the term encodes a rank *relative to their usual, functionally relevant set*. The functional anchor (`pila`'s link to sardines) ensures rough alignment at the fine end across contexts. They don't perceive disagreement because each is correctly applying the term relative to *their* implicit, pragmatically determined comparison class.

  **Distinguishing "Local Ranking" vs. "Fixed Threshold + Moving Anchor"**

  You've hit the nail on the head. This is the crucial theoretical distinction:

  1.  **Fixed Threshold + Moving Anchor (FTMA):** The core meaning *is* a fixed threshold (e.g., `taru` = 40-60mm). However, the *anchor point* for the scale shifts contextually. So, in a context with finer nets, the whole scale shifts down (`taru` might cover 35-55mm). The boundaries move *as a block* relative to the anchor.
  2.  **Local Ranking (FALR):** There is *no* fixed threshold. The terms *only* encode a rank (e.g., `taru` = "the middle category in the current set"). The boundaries are determined *entirely* by the distribution of items in the current salient set relative to the fixed functional anchor at `pila`.

  **Discriminating Test Cases:**

  Here's how to design elicitation to distinguish FTMA from FALR:

  *   **Test 1: Density Manipulation with Fixed Range**
      *   Present two sets covering the *exact same mesh range* (e.g., 30-70mm) but with *different distributions*.
      *   **Set A (Uniform):** Nets at 30, 35, 40, 45, 50, 55, 60, 65, 70mm (9 nets).
      *   **Set B (Bimodal):** Nets at 30, 32, 34, 50, 66, 68, 70mm (7 nets: clusters at fine/coarse, gap in middle).
      *   **FTMA Prediction:** Boundaries should be *similar* between Set A and Set B because the overall range and anchor (`pila` at 30mm) are identical. `Taru` might cover ~40-55mm in both.
      *   **FALR Prediction:** Boundaries will be *different*. In Set A (dense, uniform), `taru` will likely cover a narrower band (e.g., 40-50mm) because items are densely packed. In Set B (sparse, bimodal), `taru` will likely cover a *wider* band (e.g., 34-66mm?) or be applied less consistently to the single 50mm net, as the system struggles to divide the sparse set into ranks. The functional anchor (`pila` for 30-34mm) fixes the fine end, but the coarse categories (`taru`, `méska`, `won`) will spread to cover the gap. You might see the 50mm net variably called `taru` or `méska` in Set B.
      *   **Why?** FALR cares about dividing the *available items* into ranks. FTMA cares about mapping onto a scale whose *zero point* is anchored.

  *   **Test 2: Introducing an Outlier with Fixed Core**
      *   Present a set mostly in the 40-70mm range (establishing `pila`, `taru`, `méska`), but add *one* extreme outlier.
      *   **Condition Fine-Outlier:** Add one very fine net (e.g., 20mm).
      *   **Condition Coarse-Outlier:** Add one very coarse net (e.g., 90mm).
      *   **FTMA Prediction:** Adding a fine outlier might shift the anchor *down*, causing *all* boundaries (`taru`, `méska`) to shift down slightly. Adding a coarse outlier might shift the anchor *up* slightly, causing boundaries to shift up. The outlier itself might not be cleanly categorized.
      *   **FALR Prediction:** Adding a fine outlier (20mm) will be captured by the functional anchor: it will likely be called `pila` *only if* it fits the sardine function. If it doesn't (too fine), it might get a new descriptor ("new pila", "thin-thin"), and *the boundaries for `taru`/`méska` will remain largely unchanged relative to the core 40-70mm set*. Adding a coarse outlier (90mm) will be absorbed into `won` (if no functional anchor blocks it), and *the boundaries for `pila`/`taru`/`méska` will remain unchanged relative to the core set*. The outlier simply extends `won`.
      *   **Why?** FALR's functional anchor pins the fine end. The outlier only directly affects the category it gets absorbed into (`pila` with modifier or `won`) without necessarily redistributing the *ranks* of the core items. FTMA assumes the whole scale shifts relative to a moving anchor point.

  *   **Test 3: Eliciting Judgments on Isolated Nets**
      *   Show a single net (e.g., 50mm) to consultants from different boats (with different typical gear ranges). Ask "What is this?"
      *   **FTMA Prediction:** Answers might be variable *or* converge on a "default" range if there's a culturally fixed scale. If FTMA has a moving anchor, consultants might implicitly reference their *own* typical anchor/scale.
      *   **FALR Prediction:** Consultants will likely reference their *own habitual context* ("For us, that's a taru / méska"). They will readily accept that others might call it differently ("For them, that's a méska / won"), explaining it based on the other boat's gear ("because they use finer/courser nets overall"). Crucially, they will *not* perceive this as a contradiction about the *net itself*, but as a reflection of different habitual comparison sets. This directly tests your point (3) and the covert nature of the comparison class.

  **Defining FALR: Boundaries and Neighbors**

  *   **What it IS (FALR):**
      *   Categorization of items ordered along a primary dimension (mesh size).
      *   Core terms encode relative rank positions (e.g., finest, next finest, middle, coarsest) within a contextually salient set.
      *   One terminus (often the "minimal" end) is functionally anchored, resisting extension beyond its functional affordance.
      *   The opposite terminus is functionally "open," allowing extension.
      *   The contextually salient set (comparison class) is covert, determined pragmatically, and often habitual.
      *   Judgments are categorical and fast *within* a context.
      *   Variation across contexts is systematic and non-contradictory for speakers.
  *   **What it is NOT (Neighbors):**
      *   **Pure Relative Terms ("tall"):** Require explicit/implicit comparison class specification. FALR has a *covert*, situationally bound class and a functional anchor.
      *   **Prototype-Based Gradience:** Involves typicality ratings and fuzzy boundaries *within* a roughly fixed range. FALR has sharp boundaries that *shift* the range entirely based on context.
      *   **Purely Functional Categories ("chair"):** Defined solely by function (for sitting). FALR terms *combine* relative ranking on a physical dimension *with* a functional anchor at one end. A `won` isn't defined *only* by catching big fish; its mesh size must be coarser than `méska` in the current context.
      *   **Indexical Shift:** Not about deictic centers (I/here/now), but about the pragmatically determined set of items defining the scale.
      *   **Register/Variation:** Not dialectal or stylistic variation. It's systematic, context-driven recalibration of boundaries.

  **Conclusion & Recommendation**

  Your data strongly suggests **Functionally Anchored Local Ranking (FALR)** as a distinct semantic-pragmatic configuration. It elegantly explains the systematic boundary shifts, the functional asymmetry, and the contextual variation without perceived contradiction. The proposed tests (Density Manipulation, Outlier Introduction, Isolated Judgment Elicitation) provide concrete ways to empirically distinguish FALR from the plausible alternative (Fixed Threshold + Moving Anchor) and refine your model.

  For Chapter 3, define FALR clearly:
  1.  **Core Principle:** Terms denote ranks within a locally constructed ordering on a salient dimension, anchored at one end by a stable functional affordance.
  2.  **Key Features:** Covert comparison class, categorical expression within context, asymmetric extensibility.
  3.  **Boundaries:** Requires (a) an underlying dimension, (b) a rank-based core, (c) a functional anchor at one terminus, (d) covert context-dependence. It wouldn't apply to terms with intrinsic thresholds or purely functional definitions lacking the ranking component.
  4.  **Relation to Phenomena:** Position it relative to relative gradable adjectives (shares context-dependence, lacks explicit comparison), prototype theory (shares context-sensitivity, differs in mechanism and categorical expression), and functional categorization (shares functional element, adds ranking and dimension). Emphasize the *covertness* of the comparison set as a critical differentiator.

  This framework not only names your pattern but provides a powerful lens for understanding how communities categorize culturally salient, dimensionally ordered artifacts where function interacts with relative positioning within a pragmatic field. Good luck with Chapter 3 – this is compelling stuff!
