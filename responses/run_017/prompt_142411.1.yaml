answer: |-
  ## Star's Persistence: A Sestina

  The cloud condenses, gathers, forms a **WHOLE**,
  Not yet a star, but more than gas. Each **SLICE**
  Of time defines a state: dense, cold, inert **NOW**.
  Yet what it was, a diffused mist back **THEN**,
  Is this the self-same entity, the **SAME**?
  When will its core grow hot enough to **BURN**?

  Collapse ignites the core; it starts to **BURN**.
  Fusion asserts: a stable, pulsing **WHOLE**.
  Hydrogen consumed, yet still the **SAME**
  Bright point we track. Perdurantist: each **SLICE**
  Contains the star *as* it exists just **NOW**,
  Distinct from how it shone or will shine **THEN**.

  Recall its youth, that cooler, vaster **THEN**,
  Before the steady, central, constant **BURN**.
  The endurantist claims: it's wholly **NOW**,
  This very star, enduring as a **WHOLE**,
  Not parcelled out across some fleeting **SLICE**,
  Through every change persisting as the **SAME**.

  Is giant phase the star we knew the **SAME**?
  Expanded, cooler than it was back **THEN**,
  Its core contracts, fusing helium – a **SLICE**
  Of fiercer heat within the wider **BURN**.
  The view persists: one object, one true **WHOLE**,
  Despite the shifts, from protostar till **NOW**.

  Consider layers: *this* extended **NOW**,
  This decade’s stable, helium-fed **BURN**,
  Contains the star. But parts within the **SAME**
  Extended phase? Do they compose the **WHOLE**?
  A year’s fierce fusion, overlapping **THEN**
  And future, makes its own coherent **SLICE**.

  The core exhausts its fuel; a final **SLICE**
  Of shell-burning, then contraction **NOW**.
  The outer layers shed, like mist back **THEN**.
  The dense core cools, no longer does it **BURN**.
  White dwarf remains: is this the former **WHOLE**?
  The remnant cinder, is it still the **SAME**?

  Endurance: **SAME**, a **WHOLE** through every **SLICE**.
  Perdurance: **SLICE** on **SLICE**, from **THEN** to **NOW**.
  The **BURN** endures in parts that **BURN**, then cease.

  **SAME** anchors endurance, **SLICE** defines perdurance; **BURN** demands duration, challenging instantaneous parts; **WHOLE**, **THEN**, **NOW** interrogate presence and temporal edges.
