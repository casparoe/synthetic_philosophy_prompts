prompt: |-
  I'm working on a long Sunday piece about why expert timelines keep being wrong, and I've noticed something uncomfortable: the advice I keep handing out in it — start from the outside view, find the reference class, use the base rate, treat your own story about the case as the least reliable part of your evidence — is not the advice I actually follow in my own reporting, and I can't state the rule I'm really using. So I want to do this from the bottom up, with my own verdicts.

  Health-tech founder tells me her app will clear regulatory review in nine months: I discard her story entirely and use the base rate for software in that category, comfortable. Lab director says his machine will reach net energy in three years: I apply the base rate for fusion milestones and discount hard, comfortable. The same lab director, in the same interview, says his shot rate will double next year because the new power supply is installed and has already been run at half power: I take the inside view and never consult a base rate, comfortable. My own features: I ignore how long features take at magazines generally and quote from my personal record of about forty pieces, comfortable. A writer who has finished four books in five years says the fifth will take a year: I narrow the reference class to her own record, n = 4, and accept, comfortable. A well-funded institute says its ten-year project will not slip, because it has dedicated money and no teaching load: I refuse to narrow to well-funded, well-staffed projects and hold it to the base rate for projects of that kind generally, comfortable. A transit authority says a tunnel will cost a couple of billion: I want the outside view here too, but I don't want the mean overrun — I believe that distribution is heavy-tailed, and quoting an average feels like false precision, so I want something like an eightieth percentile. And an AI researcher gives me a scaling timeline on the record: I decline to use the base rate for timelines given by people who agree to be interviewed, because agreeing to be interviewed selects for a certain kind of confidence, but I then have no idea which class to use instead.

  Two pairs in that list strike me as hard to reconcile, and they're where I think the real principle lives. First, the lab director's two claims concern the same person and the same machine, and I treat them oppositely; the only difference I can articulate is that the shot-rate claim is nearly a report of something already partly observed and will be scored within months, while the net-energy claim won't be scored for years and sits right on top of the optimism gradient — which suggests something like: trust an inside view in proportion to how much the estimator has already been, or will soon be, scored on claims of that exact kind. Second, I happily narrow the class for the writer and refuse to narrow it for the institute, even though both are narrowing along a feature that favors their own optimism; my guess is that the difference is that the writer's feature comes with counted outcomes (four books, four dates) while nobody has tabulated outcomes for well-funded projects, and funding is also the very feature that manufactures the confidence — which suggests something like: narrow a reference class only along dimensions on which you possess outcome counts, never along dimensions you merely believe matter.

  So: take those two candidates as my tentative principle, test them case by case against everything above, and either merge them into one rule or tell me they are genuinely two rules and which one governs when they conflict. I want the finished principle stated precisely enough that I could apply it cold, with the case that motivates each clause attached to that clause, its verdicts on at least two cases I haven't listed, an honest account of which of my verdicts it cannot accommodate and would force me to overturn, and — most usefully — its verdict on the case I keep going back and forth on: a friend on her second startup, whose first one exited, where second-time-founder statistics exist but strike me as selected on the outcome, while her own record is a sample of one. One last thing I want addressed rather than dodged: everyone who tells me this time is different has some base rate of being wrong about that, and if I apply the outside view to my own this-time-is-different judgments, I seem to slide into a modesty so global that no mechanism evidence could ever move me — yet I do let a mechanic's observation of a worn clutch override the model's reliability base rate. Tell me where modesty about my own inside view is supposed to stop, and whether that stopping point is part of the principle or outside it.
reasoning: |-
  Hmm, this is a fascinating and deeply self-aware query about forecasting principles. The user is a journalist wrestling with the gap between prescribed forecasting wisdom and their actual intuitive judgments. They've cataloged specific cases where they follow or reject base rates, and identified two tension points that seem to reveal their implicit rules. 

  The core struggle resonates - I recognize that tug-of-war between wanting statistical rigor and honoring concrete details. Their lab director example perfectly crystallizes the dilemma: why trust the power supply claim (inside view) but not the net energy timeline (outside view)? Their proposed resolution - weighting by verifiability and countable evidence - feels street-smart. 

  What makes this query exceptional is how they pressure-test their own principles. That "second startup" case is devilish - founder stats exist but are survivor-biased, while personal history is microscopic. And their meta-question about avoiding infinite regress ("if I'm always modest about my inside view...") cuts to the heart of probabilistic reasoning. 

  I notice they're not just seeking validation; they explicitly demand contradictions in their own rulings. That takes intellectual courage. The transit authority case reveals another layer - their discomfort with averages in heavy-tailed distributions shows sophisticated statistical intuition. 

  For the response, I'll need to: First, validate their two candidate principles as distinct but complementary tools. Then show how they resolve most cases, while flagging where they'd force different judgments (like their magazine feature timelines). The AI researcher case will need special handling - "confidence selection bias" is real but tricky to quantify. 

  Most importantly, I must address the infinite regress fear without hand-waving. The mechanic example holds the key: verifiable causal chains create firewalls against total skepticism. That mechanic isn't overriding the base rate - they're providing diagnostic evidence that recontextualizes it. 

  The friend's startup case deserves a concrete verdict. I'd argue: use second-founder stats but steeply discount them for survivorship bias, then modestly upweight the personal sample. Not satisfying, but honest. Sometimes principles expose uncertainty rather than resolve it. 

  This user thinks like a scientist. My response should match that rigor while preserving the journalistic pragmatism in their examples. No platitudes about "balancing views" - they want operationalizable rules.
answer: |-
  Here’s a precise principle distilled from your cases, tested against your examples, with verdicts on new cases, limitations, and resolutions to your core dilemmas:

  ---

  ### **The Verifiability-Weighted Reference Class Principle**
  **Rule:** *Use a base rate from the broadest reference class where:*
  1.  **The outcome dimension is verifiable** (you have *counted successes/failures* on that *specific claim type* for *that estimator*), *or*
  2.  **The narrowing dimension is quantifiably causal** (you have *outcome counts* proving that dimension *reliably alters* the base rate).

  **Weight your inside view by:**
  -   **Near-term scoring:** Trust increases if the claim will be *conclusively verified soon* (months, not years).
  -   **Causal transparency:** Trust increases if the mechanism is *simple, observable, and directly tested* (like a mechanic’s clutch diagnosis).

  **Never narrow on:**  
  - Dimensions *without outcome counts* (e.g., "well-funded," "dedicated team").  
  - Dimensions *correlated with estimator optimism* (e.g., "willing to be interviewed").  

  ---

  ### **How It Explains Your Cases**
  1.  **Health-tech app (9 months):**  
      - *No verifiable outcome counts* for founder on regulatory timelines.  
      - *No causal narrowing* (funding/team don’t have quantified impact).  
      → **Use broad software regulatory base rate.**  

  2.  **Lab director (net energy in 3 years):**  
      - *No verifiable counts* for this team on fusion milestones.  
      - *No causal narrowing* (tech novelty isn’t quantified).  
      → **Discount broad fusion milestone base rate.**  

  3.  **Lab director (shot rate doubling):**  
      - *Verifiable soon* (scored in months).  
      - *Causal transparency* (power supply installed/tested).  
      → **Trust inside view, ignore base rate.**  

  4.  **Your feature timelines:**  
      - *Verifiable outcome counts exist* (your 40-piece record).  
      → **Narrow to personal base rate.**  

  5.  **Writer’s book (1 year):**  
      - *Verifiable counts* (her 4 books/dates).  
      → **Narrow to her personal base rate.**  

  6.  **Institute’s 10-year project:**  
      - "Well-funded/no teaching" has *no outcome counts* proving it reduces slippage.  
      - *Optimism-correlated* (funding boosts confidence).  
      → **Reject narrowing; use broad project base rate.**  

  7.  **Transit tunnel cost:**  
      - Heavy tails make mean misleading.  
      → **Use 80th percentile of project overruns** (broad class, avoids false precision).  

  8.  **AI researcher’s timeline:**  
      - "Willing to be interviewed" is *optimism-correlated* without outcome counts.  
      - *No alternative class* exists with verified bias adjustment.  
      → **Discard the estimate or use extreme caution.**  

  ---

  ### **Resolving the Two Pairs**
  -   **Lab director’s dual claims:**  
      → Governed by **near-term scoring** (shot rate verifiable soon) and **causal transparency** (power supply observed). Net energy lacks both.  
  -   **Writer vs. Institute:**  
      → Writer has **counted outcomes** (4 books); Institute’s "well-funded" has **no outcome counts** and is **optimism-correlated**.  

  ---

  ### **Verdicts on New Cases**  
  1.  **A chef opening a second restaurant:**  
      - First restaurant’s success is a *counted outcome*.  
      → **Narrow to her record** (n=1), adjust modestly for industry base rate.  

  2.  **A politician: "My bill will pass in 6 months":**  
      - Previous bills have *verifiable pass/fail rates and timelines*.  
      → **Narrow to their legislative record** + broad bill-passage base rate.  

  ---

  ### **Cases This Principle Would Force You to Overturn**  
  -   **Your feature timelines:** Your principle allows personal narrowing, but *if your 40 pieces lacked consistent timeline tracking*, you’d need to use broader magazine data.  
  -   **The shot rate claim:** If the power supply wasn’t tested (*no causal transparency*), you’d need the base rate for machine upgrades.  

  ---

  ### **Your Friend’s Second Startup**  
  - **Second-founder stats:** *Heavily survivor-biased* (only successful first-timers get second chances). No clean outcome counts.  
  - **Her record:** *Counted outcome* (1 exit), but n=1.  
  → **Split the difference:**  
     - Start with broad startup failure rate (50% in 5 years).  
     - Modestly upweight for her success (e.g., 40% failure).  
     *Never narrow to "second-time founders" due to selection bias.*  

  ---

  ### **Where Modesty Stops: The Mechanic Test**  
  Your fear of infinite regress is valid. **Modesty stops when:**  
  1.  **Mechanism is physically observable** (clutch wear).  
  2.  **Diagnosis is immediately testable** (test drive, part inspection).  
  3.  **Causal chain is short/simple** (worn part → failure).  

  **This is part of the principle:**  
  - The mechanic’s claim has **causal transparency** and **near-term scoring**.  
  - You’re *not overriding the base rate*—you’re *updating it* with direct evidence (Bayesian style).  

  **Contrast with "this time is different":**  
  - A founder claiming "our team is special" offers *no observable/testable mechanism* and *no outcome counts*.  
  → **Reject.**  

  ---

  ### **Stated Cold for Your Article**  
  > *"When experts make forecasts, trust their inside view only if: (1) they have a verified track record on identical claims, or (2) their rationale relies on simple, tested mechanisms that will be proven right or wrong soon. For all else, use the broadest statistical base rate—and never narrow it using unquantified, confidence-boosting traits like funding or enthusiasm. Let concrete evidence override base rates only when you can touch the evidence yourself within months."*  

  This balances rigor with pragmatism, avoids selection bias traps, and halts skepticism at the point of physical verifiability.
