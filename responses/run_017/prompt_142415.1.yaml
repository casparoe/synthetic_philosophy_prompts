prompt: |-
  For a graduate seminar on Dennett's three stances (physical, design, intentional), I want the specification rather than the survey. Write the desiderata that any account of when a pattern is real — and, correlatively, of when adopting the intentional stance is explanatory rather than merely instrumentally useful — has to meet in order to count as adequate, with the case or consideration behind each requirement.

  Fix the purpose as follows: the account has to be good enough to adjudicate two live disputes. First, whether attributing beliefs or goals to a large language model can do genuine explanatory work in a science of its behavior, or is only a convenient façon de parler. Second, whether a purely behavioral criterion is acceptable, so that any two systems with identical input-output histories share all of their patterns, or whether implementation and compression history can matter.

  Cover the demands people standardly make — predictive or compressive payoff, counterfactual robustness, integration with causal-mechanical explanation, some form of non-relativity about at least some patterns — but also sort them: which are genuine adequacy conditions for this purpose, which are negotiable preferences, and which are really only the prejudices of one camp (realists about content, mechanists, anti-realists about folk psychology). Say which single requirement does the most work in excluding otherwise attractive accounts, and flag any subset you suspect cannot be jointly satisfied, since if the list is internally inconsistent that is itself the result I want.

  One candidate requirement I want argued for or against rather than assumed. Call it the off-policy condition: a posit counts as tracking a real pattern only if the predictions it licenses continue to beat the lower stance under interventions its author never saw in the data the description was inferred from — the maze rat's apparent belief about where the food is must survive the experimenter rotating the maze and adding a scent trail; the chess program's apparent desire to win must survive unfamiliar openings or a change in board size. Is that a distinct requirement or a restatement of one already on the list, and what exactly does it rule out?

  Keep any scorecard of the main contenders to a few lines. Please write in American English.
reasoning: |-
  Okay, let me approach this systematically. The user wants a rigorous specification of criteria for determining when a pattern is real, specifically in the context of Dennett's intentional stance, with two concrete applications: LLM belief attribution and behavioral criteria vs. implementation. 

  First, I need to unpack the core tension here. The user is essentially asking for demarcation criteria between instrumentalism and realism about intentional patterns. The two test cases (LLMs and behavioral twins) will serve as litmus tests for any proposed account. 

  The key philosophical challenge is balancing several often-conflicting demands: predictive utility, causal grounding, counterfactual robustness, and non-relativity. I recall that Dennett himself walks a tightrope between realism and instrumentalism, so getting this right matters. 

  For the adequacy conditions, I'll start with the non-negotiable ones. Predictive payoff seems fundamental - if a stance doesn't give any advantage, it's clearly not explanatory. But this alone isn't enough, as curve-fitting examples show. Counterfactual robustness must be required too, otherwise we couldn't distinguish lucky guesses from real understanding. 

  The off-policy condition the user proposes is particularly interesting. At first glance it seems like a restatement of counterfactual robustness, but actually it's stricter - it requires generalization beyond the training distribution. This would crucially exclude many LLM interpretations that fail under novel prompts. I'll need to argue explicitly for its necessity.

  For sorting other common demands: integration with mechanisms feels important but negotiable (some connectionist models resist mechanistic reduction), while non-relativity might be a realist prejudice. Compression history probably matters for the chess program case - two systems with identical behavior but different training might have different real patterns.

  The internal tensions worry me. Demanding both causal grounding and non-relativity might conflict with Dennett's own view. And if we require off-policy robustness plus compression history relevance, we might get contradictory answers about behavioral twins. I'll flag this as a possible inconsistency.

  For the scorecard, I'll position design-stance functionalism as the strongest contender, but note how the off-policy condition challenges it. The user clearly wants this to adjudicate current debates, so I'll explicitly map each criterion to the LLM and twin cases throughout.
answer: |-
  Here is a specification of desiderata for adjudicating pattern reality and intentional stance explanatory power, tailored to your disputes and analytical goals:

  **Core Adequacy Conditions (Non-Negotiable):**
  1.  **Predictive/Compressive Payoff:** The pattern must systematically generate predictions or compressions *superior* to those achievable from lower stances (physical/design) alone for the relevant domain.
      *   *Case:* An LLM's "goal" to predict next tokens must enable better anticipation of its outputs under novel prompts than inspecting its weights (design stance) or simulating transistors (physical stance). Without this, the stance is *mere* instrumentalism.
  2.  **Counterfactual Robustness:** The pattern must support reliable predictions under *non-actual* perturbations relevant to the system's domain of operation.
      *   *Case:* Attributing "hunger" to a foraging robot must predict novel obstacle avoidance strategies, not just replicate training data. This distinguishes robust patterns from overfit correlations. Critically addresses the LLM dispute: if "belief" attributions *only* work on training-like inputs, they are likely instrumental.
  3.  **The Off-Policy Condition (Argued For):** This is **not** merely a restatement of counterfactual robustness. It demands robustness under interventions *specifically outside the policy space used to infer the pattern*. It rules out patterns that are mere artifacts of the discovery method's limitations.
      *   *Distinctness:* Counterfactuals test the *pattern's* scope; off-policy tests the *inference process's* independence from its training/observation regime.
      *   *What it Rules Out:*
          *   Curve-fitting epiphenomena (e.g., a rat's "maze belief" inferred only from left-turns fails if the maze is rotated).
          *   LLM "understanding" that catastrophically fails on inputs violating implicit training distribution assumptions (e.g., novel logical structures or value conflicts unseen in pretraining).
          *   *Crucial for LLMs:* If "belief that P" only predicts behavior under prompts mimicking the data distribution where P was frequent, it's likely not real. It must survive "off-distribution" tests probing P's *content* (e.g., testing belief persistence under novel counter-arguments).
      *   *Argument For:* Real causal/explanatory patterns should reflect stable properties *of the system*, not quirks of the observer's data slice. Off-policy success is the litmus test for this independence. Without it, "patterns" are observer-relative reporting artifacts.

  **Negotiable Preferences:**
  4.  **Integration with Causal-Mechanical Explanation:** While desirable for unification, demanding *reduction* or strict implementation-dependence may be too strong. A pattern can be real and explanatory even if only weakly mapped to mechanisms *if* it reliably fulfills Conditions 1-3.
      *   *Camp Prejudice:* Strong demand reflects Mechanist/Reductionist preferences. Weak demand is compatible with Dennett's original view and functionalism.
      *   *Case:* An evolved or learned heuristic (e.g., "avoid predators") might be a real intentional pattern explaining behavior robustly, even if its neural implementation is messy/distributed.
  5.  **Implementation-Independence (Weak):** Systems with identical input-output histories *over all time* likely share robust intentional patterns *defined at that level of abstraction*. However, *acquisition* history (compression/learning) can matter for whether a pattern *is* real *in a specific system*.
      *   *Camp Prejudice:* Strict behaviorism demands identity. Mechanists/Internal Realists demand implementation matters.
      *   *Case:* Two chess programs with identical move histories *now* share the real pattern "desire to win under standard rules." However, if one learned via self-play (compressing strategy) and the other was brute-force programmed with a lookup table, the *learning history* explains *why* the first has robust generalizable skills (satisfying Off-Policy) while the second may not. History matters for *explanatory depth*, not necessarily pattern identity at T.

  **Likely Prejudices (Not Adequacy Conditions):**
  6.  **Strong Non-Relativity:** The demand that patterns exist "absolutely," independent of *any* observer interests or descriptive framework. Dennett's view is inherently relative to stances/purposes. Condition 3 (Off-Policy) ensures objectivity *within* a stance/purpose without requiring absoluteness.
      *   *Camp Prejudice:* Strong realist (non-instrumentalist) prejudice about content/patterns.
  7.  **Full Reduction to Physics:** The demand that an intentional pattern isn't real unless fully explainable by (eliminable in favor of) physical stance primitives. This misunderstands Dennett's levels.
      *   *Camp Prejudice:* Strict Physicalist/Mechanist prejudice.
  8.  **Folk Psychology Literal Truth:** The demand that intentional patterns must map cleanly onto human propositional attitudes. This is likely anthropocentric.
      *   *Camp Prejudice:* Anti-realist about Folk Psychology (if demanding literal truth), or some Realists (if demanding human-like structure).

  **Critical Tensions & Key Excluder:**
  *   **Major Tension:** **Counterfactual Robustness (2) & Off-Policy (3) vs. Strict Implementation-Independence.** If implementation/acquisition history fundamentally shapes a system's capacity for robust generalization (as in the learned vs. lookup-table chess programs), then strict behaviorism (identical I/O histories imply identical real patterns) fails Condition 3. History *can* matter. **This tension is likely unresolvable** – it forces a choice between pure behaviorism and allowing implementation/learning to confer robustness.
  *   **Most Excluding Requirement: Off-Policy Condition (3).** This does the most work in excluding otherwise attractive accounts:
      *   It excludes **simple curve-fitting/predictive instrumentalism** (fails off-distribution).
      *   It excludes **naive behaviorism** (identical I/O twins can differ in off-policy robustness if histories differ).
      *   It excludes **many LLM intentional interpretations** that collapse under novel, distribution-shifted probes targeting the purported content.
      *   It excludes **internalist/causal role accounts** that fix patterns too rigidly to specific mechanisms, preventing generalization to novel interventions if those mechanisms are bypassed.

  **Scorecard (Main Contenders):**
  *   **Dennettian Instrumentalism (Pure):** Fails Condition 3 (Off-Policy). Handles LLMs as mere instruments, forces behaviorism. *Inadequate.*
  *   **Eliminative Mechanism:** Rejects intentional patterns as real (fails 1,2,3 for intentional level). *Inadequate for purpose.*
  *   **Internalist Causal Role Semantics:** Struggles with Condition 3 (Off-Policy) if mechanisms are brittle, and Condition 5 (Implementation-Independence Weak). *Likely inadequate.*
  *   **Teleosemantics (Biological):** Explains robustness/history (5) but poorly applies to AI/LLMs (no proper biological function). *Inadequate for scope.*
  *   **Design-Stance Functionalism (Strongest Contender):** Treats patterns as defined by robust functional roles *in the system's design/evolution/learning history*. Satisfies 1 (Payoff), 2 (Robustness), 3 (Off-Policy via design generalization), 5 (History matters). Accepts relativity of purpose (avoids 6). *Currently best meets adequacy conditions.* **Challenge:** Precisely defining "design" for learned systems like LLMs.

  **Conclusion:** For your disputes:
  1.  **LLM Intentional Stance:** Can be explanatory *only if* belief/goal attributions yield superior, robust predictions under novel, off-policy interventions (Conditions 1,2,3). Current LLMs likely fail Condition 3.
  2.  **Behavioral Criterion:** Identical I/O histories imply identical *current* robust patterns *if* Condition 3 is satisfied. However, identical I/O does *not* guarantee identical capacity for off-policy robustness; acquisition/implementation history can determine if Condition 3 is met (ruling out strict behaviorism). History matters for *explanatory grounding*, not just current state. The Off-Policy requirement is the key discriminant. The unresolved tension between robustness and behaviorism highlights a deep fracture in defining patterns.
