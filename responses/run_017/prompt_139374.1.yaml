answer: |-
  ### 1. The rules she might be running  
  *(~250 words)*  

  Renata’s rulings suggest four candidate principles:  

  - **Independent Repetition Rule**: Belief attribution requires decentralized, unsynchronized replication (e.g., niche figurines). Leans hardest on the figurine niche case and the burned settlement snapshot. Collapses into mechanism traces when repetition implies coordination.  
  - **Gratuitous Cost/Non-Functionality Rule**: Belief inferences require features that are materially "excessive" or functionally unmotivated (e.g., rejecting "cultic" labels without practice-specific evidence). Anchored in the rich grave and "cultic room" rejections.  
  - **Contrast Class Requirement**: Norms/beliefs can’t be inferred if a feature is universal or externally imposed (e.g., state jars in every house). Drawn from the storage jar case and the seal workshop’s institutional trace.  
  - **Mechanism Trace Rule**: Institutions require evidence of reproducible procedures (e.g., seal workshop proving administrative replication). Central to the seal case and figurine type contextualization.  

  **Collapse Point**: Rules 1 and 4 are mutually reinforcing—both demand evidence of *how* a pattern was reproduced (independent agents vs. institutional machinery). Rule 2 (gratuitousness) and Rule 3 (contrast) are filters for whether belief/norm claims are even permissible.  

  ---

  ### 2. What each predicts about your thresholds  
  *(~300 words, table format)*  

  | Rule                  | Belief Attribution Licensed? | Whose Practice? | Belief vs. Institution? | Explains Away... |  
  |-----------------------|------------------------------|-----------------|-------------------------|------------------|  
  | **Independent Repetition** | No (single campaign)        | Builders/Administrators | Institution (centralized) | Identical technique/mortar implies coordination, not household agency. |  
  | **Gratuitous Cost**   | Maybe (dogs ≠ functional)   | Ambiguous (builders? residents?) | Belief (if residents) or ritual practice (if builders) | Dogs/bowls as "costly" symbols, but mortar similarity undercuts resident agency. |  
  | **Contrast Class**    | No (universal feature)      | Administrators (imposed) | Neither—just technical specification | No variation = no norm to infer; it’s a top-down directive, like state jars. |  
  | **Mechanism Trace**   | No (no reproduction trace)  | Administrators (closure) | Institution (closure ritual) | Mortar/builders’ link proves a single mechanism; dogs are part of protocol, not belief. |  

  - **Key Takeaways**:  
    - No rule licenses *resident* belief (universality + builder materials point to imposition).  
    - All rules except Gratuitous Cost reject household practice.  
    - Institution claims (e.g., "closure ritual") survive only if tied to administrative mechanism (Rule 4).  

  ---

  ### 3. Your call  
  *(~200 words)*  

  **Renata’s Likely Verdict**:  
  1. **No resident belief attribution**. The identical, synchronized execution using original builders’ materials implies imposition, not household agency (Contrast Class/Mechanism Trace).  
  2. **Builder/administrator practice**, possibly ritualistic. The dogs/bowls are non-functional but part of a closure *protocol* (Gratuitous Cost + Mechanism Trace).  
  3. **Institution claim over belief claim**: A "closure ritual" administered centrally, not a "belief" per se.  

  **Closest Precedent**: **State-issued storage jars**. Like the jars, the thresholds were imposed uniformly by external agents, voiding inferences about resident thought. The dogs complicate this (inviting Gratuitous Cost), but Renata would note they’re embedded in a technical process.  

  **Surviving Arguments**:  
  - **Sam**: "Protective practice" might survive if rephrased as *builder* superstition embedded in closure (per Gratuitous Cost). "Belief" and "household-level" would be struck.  
  - **You**: "Administration closing down" is upheld, but the dogs force a "ritual" qualifier (non-functional element in protocol).  

  ---

  ### 4. What would settle it  
  *(~150 words)*  

  **Crucial Test**: **Excavate foundation trenches or wall cores of the blockings** to check for:  
  - **Variation in construction** (e.g., different mortars, repair phases, or tool marks across houses).  
    - *If found*: Supports Independent Repetition (household agency).  
    - *If uniform*: Confirms Mechanism Trace (single campaign).  
  - **Stratigraphy beneath dog burials**:  
    - *If puppies cut through distinct floor layers*: Proves they’re later additions (supports your closure episode).  
    - *If integrated into original makeup*: Validates your observation in 4 houses, universalizing the administrative link.  

  **Interpretation**:  
  - Uniformity + integrated puppies → Rules 3/4 win (administrative institution).  
  - Variation + later dogs → Rule 1/2 win (possible household ritual, if gratuitous). This is the only path to rescuing Sam’s view under Renata’s framework.
