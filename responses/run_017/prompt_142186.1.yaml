prompt: |-
  Doing my final paper for this seminar on philosophy and money (it's an early modern module, mostly Locke, Hume and Berkeley) and I've ended up on Berkeley's monetary stuff — the *Querist*, his mid-1730s pamphlet that's literally just hundreds of numbered questions, where he pushes Ireland to set up a national bank issuing paper money. I keep lossing the thread on one point and I think I need the conceptual thing explained rather than more reading.

  Setup as I've got it, tell me if I've got him wrong: (1) Immaterialism — no mind-independent material substance, ordinary objects are collections of ideas, and they keep existing when no human is looking because God perceives them, nature being a kind of divine language. (2) On money he's anti-hard-money: gold and silver aren't valuable in themselves, they're just counters or tickets for transferring claims, and what matters is whether money actually sets people to work, since real wealth is industry and its fruits rather than the metal. Real versus nominal wealth.

  Here's the tangle. The usual move here wants the goods and the labour to be real in a way the counter isn't. For a materialist that's free: the stuff is just there, mind-independently. For Berkeley there is no there in that sense. So what's the anchor that stops these tokens are mere counters from collapsing into everything is a counter? I can see two candidates and can't tell which one he needs:

  A) opinion and coordination — money is sound to the degree that it is generally accepted and actually moves people to useful work, so wealth is a fact about what people will do.
  B) the divine ledger — the goods are real because God perceives an orderly nature, so real wealth is whatever God's order underwrites, not whatever human opinion happens to converge on.

  B worries me more: if the reality of the goods comes from divine perception, then hypotheticaly an island where nobody works but God perceives plenty of corn is really wealthy, which seems to make real wealth useless for the economic argument, since the whole point was whether people get fed. A worries me because it makes his attack on gold toothless: gold is coordinated opinion too, so on A the advantage of paper over specie is just that paper would be better coordinated, a policy claim dressed up as a metaphysical one.

  Test case I've been using — tell me if it's rigged. Island A: everyone works, real wool and corn, tokens nobody outside accepts. Island B: heaps of gold, nobody works. Island C: a South Sea style bubble in claims on goods that will never arrive, but expectations are perfectly coordinated and trade is brisk. Berkeley wants C to be worse than A in a way that isn't just idleness is a vice. What in his metaphysics, not his morals, lets him say that — and if nothing does, is that a cost to him or just the price of immaterialism?

  Walk me through how the real/nominal distinction is supposed to get its grip given (1), which of A or B (or some third thing) is doing the actual work, and where island C is cheating. Keep it under about 600 words, no citations needed, and finish with \answer{...} containing exactly one label: opinion, divine-ledger, both, or collapse.
reasoning: |-
  Okay, the user is writing a final paper on Berkeley's philosophy of money, specifically his work in the *Querist*. They're struggling with how Berkeley's immaterialism—which denies mind-independent material substance—relates to his economic ideas about money. Berkeley argues that gold and silver aren't inherently valuable; they're just counters, and real wealth comes from industry and labor. The user is confused about what anchors the real/nominal distinction in Berkeley's system. They present two options: opinion/coordination (A) or divine perception (B), and a test case with three islands to illustrate the tension.

  The user's setup seems correct: Berkeley's immaterialism means objects exist because God perceives them, and his economics sees money as tokens that should stimulate work. The core problem is reconciling the lack of mind-independent matter with the need for an objective basis for wealth. If everything depends on perception, how is real wealth different from mere tokens?

  Looking at option A (opinion/coordination), it makes money's value depend on human agreement and its ability to motivate labor. But this risks undermining Berkeley's critique of gold—since gold also relies on human agreement, the advantage of paper money becomes purely practical, not metaphysical. Option B (divine ledger) ties real wealth to God's perception of an orderly nature. However, this leads to a paradox: an island with no labor but divinely perceived corn would be "wealthy" even if people starve, which defeats Berkeley's practical economic goals.

  The test case clarifies this: Island A has labor and real goods but no external trade; Island B has gold but no labor; Island C has a speculative bubble with coordinated expectations but no real goods. Berkeley would want A to be truly wealthy and C to be illusory, but under immaterialism, the "real goods" in A only exist because God perceives them—just like the illusory goods in C. 

  The resolution lies in Berkeley's divine teleology. For him, nature is a divine language meant for human use. Real wealth isn't just divinely perceived objects, but objects *embedded in a system of divinely ordained natural laws* that link labor to sustenance. Island A's wealth is real because labor (a divinely instituted cause) produces perceived goods that sustain life—God's order connects work to welfare. Island C fails because the bubble violates natural law: no labor was invested, so no divine ordering undergirds the claims. The tokens in C are unmoored from the causal structure God upholds. 

  Thus, the anchor is divine law, not just perception. Opinion (A) is necessary for money to function, but divine order (B) validates whether the labor behind wealth is real. The collapse is avoided because Berkeley's God institutes a reliable natural economy where work yields tangible benefits. In Island C, coordination is flawless but ontologically empty because it ignores divine law. 

  Final answer: divine-ledger, but qualified—it's divine *order*, not mere perception, that grounds the labor-to-wealth link.
answer: |-
  Based on your setup, Berkeley's immaterialism **does** complicate the real/nominal wealth distinction, but his system provides an anchor through **divine order**, not mere perception or human opinion alone. Here's how it works and how Island C fails:

  1.  **The Problem:** Immaterialism dissolves the "stuff is just there" anchor. Goods (wool, corn) are ideas in minds (ultimately God's), and money is a token representing a claim on those ideas. Without mind-independent matter, what makes the goods "real" and the bubble "nominal"?

  2.  **The Anchor: Divine Order & Teleology:** Berkeley's key is not just that God perceives ideas, but that God perceives and sustains a *lawful, purposeful order* (nature as divine language). This order includes causal connections God instituted: labor applied to land (also ideas) reliably produces sustenance and useful goods. **Real wealth** consists of ideas *embedded within this divinely ordained causal structure* – specifically, the *industry* (labor) and its *fruits* (goods) resulting from it, which serve human needs as intended by God. Wealth isn't passive existence (like Island B's gold or hypothetical unperceived corn), but active participation in God's providential system where work yields sustenance.

  3.  **Role of Opinion & Coordination (A):** Human opinion and coordination are crucial for the *money* system to function effectively. Paper tokens are superior to specie *because* they can be better designed (by a national bank) to stimulate the *real* wealth-generating process (industry) within Ireland's specific context. Opinion makes money work *as a tool*. However, opinion alone cannot create real wealth; it can only facilitate (or hinder) the labor that does, operating within God's order.

  4.  **Why Divine Perception (B) Needs Refinement:** Mere divine perception of corn isn't enough. God perceives *everything*, including bubbles and gold piles. The difference is whether the "wealth" is *integrated into the divine causal order for human benefit*. Island B's gold isn't wealth because it's inert within that order. Hypothetical unperceived corn is irrelevant; the corn that *counts* is the corn perceived as the *result* of labor within the system.

  5.  **Island C - The Bubble - Why it Fails:** Island C has coordinated opinion and brisk trade in tokens representing claims. However, these claims are on goods that **will never arrive** because no labor was applied within the divine order to produce them. The tokens represent *nothing* within the causal structure God sustains linking industry to fruits. The "expectations" are fundamentally *false* relative to the divine law of nature. The trade is an elaborate fiction disconnected from the real productive order. It's nominal wealth because it lacks the underlying divine causal reality – the connection between work and outcome instituted by God.

  **Conclusion:** Berkeley's immaterialist anchor for real wealth is **divinely instituted causal order**. Real wealth is industry and its fruits *because* God's providence links labor to sustenance within the perceived natural world. Money (whether paper or specie) is nominal, a tool whose value depends on coordinating opinion to effectively stimulate *that real process*. Island C fails because its coordinated opinion creates tokens detached from the divine causal order – no labor was performed, so no divinely ordained fruits exist to back the claims.

  \answer{divine-ledger}
