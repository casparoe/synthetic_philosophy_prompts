prompt: |-
  i'm building the risk-scoring layer of a hospital readmission system — the bit that has to take one particular patient, put them into some reference class, and hand a clinician a single number before discharge — and before i commit to a rule i want to know what such a rule would even have to be able to do. so: write me the desiderata for a theory of reference class selection. not what class this patient goes in, but what any account of *which* class is the right one has to deliver, with the case or consideration behind each item, and sorted into non-negotiable, negotiable, and things i only think are requirements because of the camp i'm in.

  the purpose is fixed: it has to be good enough to guide a real decision about an individual (extra home visits, a longer stay), the decision will actually be made on the basis of it, and the number has to be defensible afterwards both to the patient and to whoever audits us.

  cases i think an adequate account has to handle, and which should be the reason each requirement is on the list:

  - a 68-year-old diabetic admitted through the ER in february, living in a postcode that's a decent proxy for low income. intersect all of that and the class has three people in it. intersect only some of it and you get plausible numbers that disagree with each other.
  - two perfectly admissible classes that both contain the patient and give different rates: men 60-69 with diabetes, versus everyone admitted via the ER in winter. nothing has gone wrong in either description, they just disagree.
  - classes that are defined partly by the outcome. the obvious one is patients we did readmit, which gives 100% and is useless; the interesting one is patients flagged high-risk by our old model, which predicts readmission mostly because the flag caused extra visits. i want to know whether banning the first kind is enough or whether the second kind needs its own clause.
  - once we start acting on the number, the class's own rate moves: the home visits work, so the base rate in the class we used to calibrate on drops. the class we wanted before the policy isn't the class we get after it.
  - a new biomarker starts being measured next year. same patient, same everything else. i have a strong feeling last year's number does not thereby become wrong, but i also think the new variable should be used from now on, and i can't see how to hold both without the theory saying something about whose information state the class is relative to.
  - masking: the wide class says 15%, but inside it one subgroup is at 4% and another at 31%. the person from the 4% subgroup gets told 15%, and i genuinely can't tell if that's the best estimate available given what's knowable or whether it's just averaging away a disparity that we do in fact have the data to see. give this phenomenon a name if it doesn't have one i'd recognise, and tell me whether it generates a requirement or is really just an instance of some other requirement.

  requirements to argue about, at least: use all the evidence you have about the individual; use the narrowest class that still has enough members for a stable frequency; never let the class be defined by the outcome; don't let the answer change when a newly measured variable is outcome-irrelevant; stay calibrated inside whatever class you pick; be computable in time to be useful; survive being acted upon; produce one number rather than a spread across admissible classes; and use only classes that are causally homogeneous with respect to the outcome rather than merely statistically associated.

  then the part i actually want: which of those are real desiderata and which are just the prejudices of one camp — i suspect one-number-per-patient is an institutional hangover rather than a requirement, and i suspect only-count-actual-finite-classes is a frequentist hangover — and which subset of the list can't be jointly satisfied. my bet is that use-all-the-evidence, only-use-classes-with-reliable-statistics and one-number-for-a-one-off-case can't all hold, but i'd rather you find the pair that genuinely breaks and show me the case where it breaks. if the honest answer is that the list is jointly unsatisfiable, say that plainly, because i can take that back to my team as a result.

  and only at the end, a couple of lines each, no table: how the usual contenders do against the list — the narrowest-reliable-class rule, fit-a-model-on-all-the-covariates-and-read-off-the-individual-prediction, a causal view where the class gets picked by what causes the outcome, and pick-whatever-class-is-best-calibrated. which single requirement does the most work excluding candidates.
reasoning: |-
  We are building desiderata for a theory of reference class selection in a hospital readmission risk-scoring system. The purpose is to assign a single number to a patient before discharge to guide decisions (like extra home visits or longer stays), and this number must be defensible to patients and auditors.

  We have several cases that illustrate challenges:

  1. **Small reference class**: A 68-year-old diabetic admitted via ER in February from a low-income postcode. Intersecting all factors yields a class of 3 people (too small for a stable rate). Using subsets yields plausible-sized classes but with conflicting rates.

  2. **Divergent admissible classes**: Two classes that are both reasonable (e.g., "men 60-69 with diabetes" vs. "everyone admitted via ER in winter") but yield different risk estimates for the same patient.

  3. **Classes defined by the outcome**: 
     - Obvious: Class of patients we did readmit (100% rate) is useless.
     - Subtle: Class of patients flagged high-risk by an old model, where the flag itself (and subsequent interventions) caused lower readmission. This class might not reflect the true risk without the intervention.

  4. **Policy feedback effect**: When we act on the risk score (e.g., provide extra home visits to high-risk patients), the base rate in the reference class drops because the intervention works. The class we used for calibration changes after the policy is implemented.

  5. **New information (e.g., a new biomarker)**: Next year we have a new biomarker. We want to use the new variable from now on, but we don't want last year's score (without the biomarker) to be considered wrong in retrospect. This raises the question: relative to whose information state is the reference class defined?

  6. **Masking**: The wide class has an average readmission rate of 15%, but within it there are subgroups at 4% and 31%. If we assign 15% to a patient from the 4% subgroup, is that acceptable? We have the data to see the disparity. (We can call this "within-class heterogeneity" or "masked heterogeneity".)

  We also have a list of candidate requirements (some non-negotiable, some negotiable, some possibly camp-specific):

  - Use all the evidence about the individual.
  - Use the narrowest class that still has enough members for a stable frequency.
  - Never let the class be defined by the outcome (directly or indirectly).
  - Don't let the answer change when a newly measured variable is outcome-irrelevant.
  - Stay calibrated within the chosen class (i.e., the predicted rate should match the observed rate in the class).
  - Computable in time to be useful.
  - Survive being acted upon (i.e., the scoring rule should remain valid even after interventions based on it).
  - Produce one number rather than a spread across admissible classes.
  - Use only classes that are causally homogeneous (with respect to the outcome) rather than merely statistically associated.

  We must categorize these requirements and then see which are jointly satisfiable.

  ## Step 1: Categorize requirements

  ### Non-negotiable (essential for the system to function as intended)
  1. **Defensibility**: The number must be defensible to the patient and auditors. This implies:
     - The reference class must be objectively chosen and justifiable.
     - The method must avoid obvious biases (like using outcome-defined classes).
     - The estimate must be as accurate as possible given the data.

  2. **Actionability**: The score must guide real decisions and be available in time (computable in time to be useful).

  3. **Validity under intervention**: The scoring rule should remain valid (or be updatable) even when interventions are applied (survive being acted upon). Without this, we get policy feedback issues.

  4. **Avoid outcome-defined classes**: Never let the class be defined by the outcome (directly or indirectly). This is non-negotiable because it leads to circularity and bias.

  5. **Calibration**: Stay calibrated within the chosen class. If the class has a readmission rate of 15%, then the predicted risk should be 15%. This is necessary for the number to be interpretable and defensible.

  ### Negotiable (might be relaxed depending on the approach)
  1. **Use all the evidence**: In an ideal world we would, but if the evidence leads to a too-narrow class, we might have to use a broader one. Also, in a model-based approach (like logistic regression) we use all covariates simultaneously.

  2. **Narrowest reliable class**: This is a common heuristic, but it might conflict with other requirements (like producing one number). Also, what is "reliable" (i.e., stable) is context-dependent.

  3. **Causal homogeneity**: This is desirable but hard to achieve and verify. Statistical homogeneity (or conditional exchangeability) might be sufficient.

  4. **One number per patient**: The institution requires one number, but we might be able to report a range or multiple numbers? However, the requirement says "hand a clinician a single number". So for now, we treat it as non-negotiable because it is a fixed purpose.

  ### Camp-specific (might be based on philosophical stance)
  1. **Only use actual finite classes**: This is a frequentist hangover. Bayesian approaches can use models that smooth over sparse data and don't require a fixed reference class.

  2. **Don't change when adding irrelevant variables**: This might be a requirement for objectivity, but in practice, if a variable is truly irrelevant, it shouldn't change the prediction. However, we usually don't know irrelevance a priori.

  3. **Produce one number rather than a spread**: This might be institutional. In theory, we could report a distribution or multiple estimates, but the requirement is for a single number.

  ## Step 2: Identify conflicts

  Key conflicts:

  1. **Use all the evidence** vs. **Narrowest reliable class** vs. **One number**:
     - If we use all evidence, we might get a very narrow class (like the 3-person class) which is unreliable. Then we have to widen the class, but then we are not using all evidence? Also, if we have two equally narrow and reliable classes that give different numbers, which one do we pick? The requirement for one number forces us to choose one, but both are equally justified by the evidence.

  2. **Use all the evidence** vs. **Stable frequency** (narrowest reliable class) vs. **Calibration**:
     - In the masking case, if we use a broad class (to have a stable frequency) we get 15%, but we have evidence that the patient is in a 4% subgroup. Ignoring that subgroup information might lead to a miscalibrated estimate for that subgroup? Actually, the requirement for calibration is per the chosen class, but if we choose the broad class, then we are calibrated for the class (15% event rate) but the patient's true risk is 4%. So the estimate is not individually calibrated. However, we cannot observe individual true risks.

  3. **Survive being acted upon** vs. **Calibration**:
     - After intervention, the historical data (without intervention) no longer reflects the current risk. So if we don't update the model, we lose calibration. But updating requires knowing the effect of the intervention, which is hard.

  4. **Use all the evidence** vs. **One number**:
     - If we have two admissible classes (like in the divergent classes case) and they give different numbers, then to use all the evidence we might want to average or consider both, but the one number requirement forces a single choice.

  ## Step 3: Joint unsatisfiability?

  The key trio that seems to conflict:

  - **Use all the evidence about the individual** (so we want the most specific information)
  - **Use the narrowest class that still has enough members for a stable frequency** (so we don't use too specific if unstable)
  - **Produce one number** (so we cannot output a distribution or multiple estimates)

  But note: the narrowest reliable class might not be unique. So we have to pick one and then we are not using all the evidence (because we ignore other reliable classes that are equally narrow and reliable but give a different estimate).

  Therefore, we cannot simultaneously satisfy:
     (a) Use all the evidence (which would require considering every piece of evidence, and if there are multiple admissible classes, we would have to consider each one)
     (b) Produce one number (which requires selecting one class and ignoring others)
     (c) Even if we use the narrowest reliable class, there might be multiple such classes.

  So the conflict is between "use all the evidence" and "one number", especially when there are multiple admissible reference classes.

  Additionally, the requirement for calibration (which we have as non-negotiable) might be at odds with masking: if we assign the broad class rate (15%) to a patient in a 4% subgroup, then for that patient the prediction is not calibrated (it is too high). But we are calibrated for the class. The problem is that we don't have a class for the 4% subgroup? If we did, we would use it (if reliable). But if the 4% subgroup is too small, then we cannot form a reliable class. So we have to use the broad class and then we are calibrated for the broad class but not for the individual. This is a fundamental limitation of reference classes: they cannot capture individual risk perfectly.

  But note: the requirement says "stay calibrated inside whatever class you pick", not that the individual's risk equals the class risk. So if we pick the broad class, we are meeting the calibration requirement because the class rate is 15%. However, the patient's true risk is 4%. So the requirement as stated is met, but the estimate is not individually accurate. This is acceptable under the requirement as written, but might not be defensible to the patient (if they know they are in the 4% subgroup). Hence, the defensibility requirement might be violated in spirit.

  So the conflict in masking is really between:
     - The requirement to use the narrowest reliable class (which we might not have for the subgroup) and 
     - The requirement to use all the evidence (which tells us the patient is in a low-risk subgroup).

  But without a reliable subgroup class, we cannot assign 4%. So we have to assign 15%. This is a trade-off between stability and specificity.

  ## Step 4: How the usual contenders fare

  1. **Narrowest-reliable-class rule**:
     - Handles the small class by widening until reliable.
     - But in the case of multiple admissible classes, it doesn't specify which one to pick (so violates one number? unless we have a rule to pick one, e.g., the one with the most variables, but that might be arbitrary).
     - It avoids outcome-defined classes by design (if we define the class only by covariates).
     - It might not handle policy feedback (unless we update the class and recalc rates).
     - Masking: it would use the broad class if the subgroup is too small, so masking occurs.
     - New biomarker: we would use it if available and if it leads to a reliable class, so the number changes. But then last year's number was the best we had then? So it might be defensible.

  2. **Fit a model (e.g., logistic regression) using all covariates and read off the individual prediction**:
     - Uses all the evidence (all covariates) to produce one number (the model prediction).
     - Avoids small classes by smoothing (via the model structure).
     - Handles multiple factors without explicitly choosing one reference class.
     - But: the model might not be calibrated for every subgroup (calibration might be global, not local). So masking might still occur (if the model doesn't capture interactions that create subgroups).
     - Policy feedback: the model would need to be retrained with data from the intervention period, but then it might capture the effect of the intervention? However, if the intervention is applied based on the model, then we have confounding. This is tricky.
     - Outcome-defined classes: the model is trained on past outcomes, but the covariates are pre-treatment. However, if we include variables that are consequences of the intervention, we might have bias. So we must be careful.
     - New biomarker: we would include it in the model and update the prediction. Last year's prediction without it is still the best we had then.

  3. **Causal view (pick class by what causes the outcome)**:
     - This would require knowing the causal structure. If we have a causal diagram, we can condition on the direct causes (and maybe use causal models like g-formula).
     - It might solve the policy feedback: if we model the effect of the intervention, we can adjust for it.
     - It might handle masking by ensuring we condition on all confounders and direct causes, so the class is homogeneous with respect to the outcome.
     - But: causal knowledge is often unavailable or uncertain. Also, it might require large data to estimate effects.
     - It would avoid outcome-defined classes (if properly specified).
     - New biomarker: if it is a direct cause, we must include it. If not, we don't. But then the prediction changes only if the biomarker is causal and we didn't have it before.
     - Computability: causal inference methods can be complex and time-consuming.

  4. **Pick whatever class is best calibrated**:
     - This might be circular because calibration is assessed on historical data. Also, we need to pick a class to calibrate on, but then we are back to the reference class problem.
     - It might lead to choosing a class that is too broad (if it is well-calibrated) but ignores subgroup information.

  ## Step 5: Which single requirement does the most work excluding candidates?

  The requirement that does the most work is **"Never let the class be defined by the outcome"** (non-negotiable). This immediately rules out any class that includes the outcome in its definition (like the old model's flag, if that flag is a consequence of the outcome or if it creates a self-fulilling prophecy). It also forces us to use only pre-treatment variables.

  However, the requirement that is most central to the conflicts is **"Use all the evidence"** because it is what pushes against the one-number requirement and the stability requirement.

  ## Conclusion on joint satisfiability:

  We cannot simultaneously satisfy:
     - Use all the evidence (if interpreted as requiring that every piece of evidence is fully utilized in a way that might lead to multiple estimates)
     - Produce one number (when there are multiple equally good reference classes)
     - And also, the requirement for a stable frequency (which forces us to use a class that might be too broad) might conflict with using all the evidence (if the evidence points to a subgroup that is too small).

  But note: the "use all the evidence" requirement might be interpreted as requiring that we do not ignore any relevant information. In the model-based approach, we do use all the evidence (all covariates) to produce one number. So that approach satisfies "use all the evidence" and "one number" and avoids the small class issue by smoothing. However, it might not be calibrated in every subgroup (masking issue) and might be sensitive to model misspecification.

  Therefore, the conflict is not absolute. The model-based approach (if well-specified) can come close. But the reference class approach with multiple admissible classes is the one that breaks.

  ## Final desiderata list (categorized)

  ### Non-negotiable:
  1. **Defensibility and objectivity**: The reference class must be chosen by an objective, justifiable rule that avoids arbitrary choices and biases.
  2. **Avoid outcome-defined classes**: The class must not be defined, directly or indirectly, by the outcome variable (to prevent circularity and bias).
  3. **Calibration**: Within the chosen reference class, the predicted risk must equal the observed event rate (over time, as assessed by auditing).
  4. **Actionability and timeliness**: The score must be computable in time for discharge decisions.
  5. **Policy-robustness**: The method must either (a) remain valid when interventions are applied based on the score, or (b) be updatable in a timely and objective manner to account for policy changes.
  6. **One number per patient**: The output must be a single risk estimate (as required by the institution).

  ### Negotiable:
  1. **Use all available evidence**: We should use as much relevant information about the patient as possible, but if this leads to a very small class, we may have to use a broader one (provided that the broader class is still justifiable and the loss of specificity is documented).
  2. **Stable frequency (reliability)**: The reference class must be large enough to provide a stable risk estimate (with a predefined threshold for stability, e.g., at least 50 events in the class over a defined period).
  3. **Causal homogeneity**: Ideally, the reference class should be homogeneous with respect to the causal factors of readmission, but if the causal structure is unknown, we may settle for statistical homogeneity (i.e., conditional exchangeability).

  ### Camp-specific (and might be dropped if needed):
  1. **Only use actual finite classes**: We can use model-based approaches that smooth over sparse data (so we drop this).
  2. **Don't change when adding irrelevant variables**: We can relax this because if a variable is irrelevant, it shouldn't change the prediction by much. But we don't know irrelevance a priori, so we include all relevant variables and let the model handle it.
  3. **Produce one number rather than a spread**: This is non-negotiable in our context because it is fixed by the purpose.

  ## Summary of unsatisfiable trio?

  We can avoid the unsatisfiable trio by using a model-based approach that uses all covariates and produces one number. However, if we insist on a reference class approach (with explicit classes) then the requirement for one number and the existence of multiple equally good classes conflict with using all the evidence (in the sense of averaging over classes). But the model-based approach is a way of using all the evidence and producing one number.

  Therefore, the list is jointly satisfiable if we adopt a model-based approach (with proper calibration and updating). The reference class approach might not be.

  ## How the contenders fare against the non-negotiable list:

  1. **Narrowest-reliable-class rule**:
     - Might fail defensibility when there are multiple equally narrow classes (arbitrary choice) and in masking (using a broad class when a narrow one is unstable).
     - Might not be policy-robust without updating.
     - Satisfies avoiding outcome-defined classes and calibration (if the class is large enough).

  2. **Model-based (all covariates)**:
     - Uses all evidence and produces one number.
     - Can handle many covariates without arbitrary class selection.
     - Must be calibrated overall (and ideally for subgroups). If not calibrated, it fails.
     - Policy feedback: requires retraining with new data (which is feasible).
     - Avoids outcome-defined classes if the model uses only pre-treatment variables.

  3. **Causal view**:
     - Theoretically ideal for policy robustness and masking (if we condition on all confounders), but in practice hard to implement due to unknown causal structure and data requirements.
     - Might not be computable in time if complex.

  4. **Pick-whatever-class-is-best-calibrated**:
     - Circular: we need to define classes to calibrate, but then how do we pick the class? Also, a class that is well-calibrated might be too broad (masking) and not use all evidence.

  ## Final thought

  The model-based approach (with regular recalibration and updating) seems the most promising. The main challenge is ensuring calibration across subgroups and handling policy feedback by updating the model with new data (including the intervention effects). The non-negotiable requirement that does the most work in excluding candidates is **avoid outcome-defined classes** because it immediately rules out several bad practices.

  For your team: If you are committed to an explicit reference class approach (not model-based), then you might have to relax "use all the evidence" in the sense of not being able to use every possible class, and accept that in the face of multiple classes you must have a rule to pick one (e.g., the one with the most variables, or the one with the best historical calibration). But the model-based approach is more flexible and less arbitrary.
answer: |-
  ### Desiderata for a Theory of Reference Class Selection  
  **Purpose**: Assign a single, defensible readmission risk score to guide clinical decisions (e.g., extra home visits), with accountability to patients and auditors.  

  ---

  ### **I. Non-Negotiable Desiderata**  
  *(Essential for clinical, ethical, and operational integrity)*  
  1. **Defensible to Stakeholders**:  
     - **Case**: A 68-year-old diabetic from a low-income postcode admitted via ER in February.  
     - **Requirement**: The score must be justified with objective, auditable reasoning. Clinicians must explain it to patients; auditors must verify its validity.  
     - **Why Non-Negotiable**: Legal/ethical necessity for transparency in life-impacting decisions.  

  2. **Avoid Outcome-Defined Classes**:  
     - **Case**: Classes like "patients flagged high-risk by old model" (where the flag *caused* lower readmission via interventions).  
     - **Requirement**: Ban classes directly *or indirectly* influenced by the outcome (e.g., variables affected by prior interventions).  
     - **Why Non-Negotiable**: Prevents biased, self-fulfilling prophecies. The "obvious" outcome class (e.g., "patients readmitted") is useless; the subtle one (e.g., model-influenced groups) corrupts causality.  

  3. **Calibration Within Chosen Class**:  
     - **Case**: Masking—a broad class averages a 4% subgroup and a 31% subgroup into 15%.  
     - **Requirement**: The score must match the observed outcome rate *within the selected class* (e.g., if class risk is 15%, assign 15%).  
     - **Why Non-Negotiable**: Ensures statistical honesty. Masking (a.k.a. **within-class risk heterogeneity**) is unavoidable without sufficient data but doesn’t invalidate calibration.  

  4. **Policy-Robustness**:  
     - **Case**: Extra home visits reduce readmissions, altering the base rate of the original reference class.  
     - **Requirement**: The system must adapt when interventions change outcome rates (e.g., via dynamic updates or causal adjustment).  
     - **Why Non-Negotiable**: Without this, scores become obsolete post-intervention, harming patients and trust.  

  5. **Timely Computability**:  
     - **Requirement**: Generate scores fast enough for discharge decisions.  
     - **Why Non-Negotiable**: Clinical workflow constraint; delays risk patient harm.  

  6. **One Number per Patient**:  
     - **Case**: Two equally admissible classes (e.g., "men 60-69 with diabetes" vs. "winter ER admissions") yield divergent risks.  
     - **Requirement**: Output a single actionable score, not a range or distribution.  
     - **Why Non-Negotiable**: Institutional necessity—clinicians need unambiguous guidance.  

  ---

  ### **II. Negotiable Desiderata**  
  *(Important but flexible based on trade-offs)*  
  1. **Use All Available Evidence**:  
     - **Case**: The 68-year-old diabetic—ignoring income or admission timing may misestimate risk.  
     - **Requirement**: Incorporate all relevant patient data, but accept that "narrowest reliable class" may override this.  
     - **Why Negotiable**: Conflicts with stability; small classes (e.g., 3 people) force trade-offs.  

  2. **Stable Frequency (Narrowest Reliable Class)**:  
     - **Case**: Intersecting all factors yields a tiny class; broader classes disagree.  
     - **Requirement**: Prefer the narrowest class with sufficient data for statistical reliability (e.g., >50 events).  
     - **Why Negotiable**: "Reliability" is context-dependent (e.g., variance thresholds).  

  3. **Causal Homogeneity**:  
     - **Requirement**: Favor classes where variables share a causal relationship with readmission (e.g., diabetes severity), not just correlation.  
     - **Why Negotiable**: Hard to verify; statistical homogeneity may suffice if causal structure is unknown.  

  ---

  ### **III. Camp-Specific Desiderata**  
  *(Reflect philosophical biases; may be discarded)*  
  1. **Use Only Actual Finite Classes**:  
     - **Why Camp-Specific**: Frequentist hangover. Bayesian/machine-learning models smooth sparse data without explicit classes.  
     - **Case**: Small-class problem—models avoid this by borrowing strength.  

  2. **Invariance to Irrelevant Variables**:  
     - **Case**: A new biomarker (e.g., genetic marker) is measured next year but proves irrelevant.  
     - **Requirement**: Scores shouldn’t change if new data doesn’t predict outcomes.  
     - **Why Camp-Specific**: Assumes perfect knowledge of irrelevance; impractical without validation.  

  3. **Single Admissible Class**:  
     - **Why Camp-Specific**: Institutional preference for simplicity. Conflicting admissible classes suggest a distribution is more honest.  

  ---

  ### **Conflicts and Joint Unsatisfiability**  
  - **The Unsatisfiable Trio**:  
    - `Use All Evidence` + `Stable Frequency` + `One Number` → **Impossible** when multiple reliable classes conflict.  
    - **Breaking Case**: Two equally narrow/reliable classes (e.g., "men 60-69 with diabetes" vs. "winter ER admissions") yield divergent risks. You must either:  
      - Arbitrarily pick one (violating *Use All Evidence*),  
      - Output multiple scores (violating *One Number*), or  
      - Use a broader class (violating *Narrowest Reliable Class*).  
  - **Other Tensions**:  
    - `Policy-Robustness` vs. `Calibration`: Post-intervention, recalibration is needed, but may lag.  
    - `Causal Homogeneity` vs. `Timely Computability`: Causal validation is slow; proxies may be needed.  

  ---

  ### **Evaluation of Contenders**  
  *(Against non-negotiables; ✗ = fails, ✓ = passes, ~ = partial)*  
  1. **Narrowest Reliable Class Rule**:  
     - ✓ Defensible (transparent), ✓ Avoids outcome-defined classes, ~ Calibrated (within class, but masks heterogeneity).  
     - ✗ One Number (fails with conflicting classes), ✗ Policy-Robustness (static classes ignore intervention effects).  
     - **Key Failure**: Arbitrariness in class selection when multiple options exist.  

  2. **Model-Based Prediction (e.g., logistic regression)**:  
     - ✓ Uses all evidence, ✓ One number, ~ Timely (if model is pre-trained), ✓ Adaptable to new variables.  
     - ✗ Calibration (may be global, not subgroup-specific; masking risk), ~ Policy-Robustness (requires retraining).  
     - **Key Strength**: Balances evidence use and stability; weakest on causal clarity.  

  3. **Causal Homogeneity Selection**:  
     - ✓ Avoids outcome-defined classes, ~ Policy-Robustness (if causal model accounts for interventions).  
     - ✗ Timely computability (causal inference is slow), ✗ Defensible (causal assumptions are debatable).  
     - **Key Failure**: Impractical without known causal graphs; struggles with new biomarkers.  

  4. **Best-Calibrated Class Selection**:  
     - ✓ Calibration (by design), ~ Defensible (if audit trail exists).  
     - ✗ Avoids outcome-defined classes (calibration may favor outcome-influenced groups), ✗ One Number (if multiple classes calibrate well).  
     - **Key Failure**: Circularity—calibration is assessed *after* class selection.  

  ---

  ### **Key Takeaways**  
  - **Most Excluding Requirement**: `Avoid Outcome-Defined Classes`—rules out naïve historical cohorts and improper proxies.  
  - **Viable Path Forward**: **Model-based approaches** (e.g., Bayesian networks or regularized regression) best balance non-negotiables. They use all evidence, output one number, and adapt to new data, but require aggressive subgroup calibration and policy-aware updates.  
  - **Brutal Truth**: No approach aces all desiderata. The `One Number` requirement (institutional) is the biggest constraint; relaxing it to a range would resolve key conflicts. If locked to one number, accept that some evidence will be underutilized when classes conflict.  
  - **Recommendation**: Use a model-based system with:  
    - **Causal priors** (e.g., exclude intervention-tainted variables),  
    - **Dynamic recalibration** (for policy feedback),  
    - **Uncertainty intervals** (hidden from clinicians but auditable).  
    Trade "narrowest class" for structured smoothing to handle sparse data.
