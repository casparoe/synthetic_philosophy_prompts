prompt: |-
  I keep catching myself either defending or apologizing for not looking harder, and my gut verdicts don't add up to any rule I can actually state. So here are the cases, then my own stab at a principle, and I want you to repair or replace it.

  - Tuesday dinner in my own city, ninety seconds on an app, we eat out every week: obviously fine. Anyone who spends longer is a bit strange. Related but different: my colleague has eaten lunch at the same mediocre ramen place nine years running. Also fine, I think, even though it has the same shape as things I do call laziness.
  - Used car: one afternoon, a checklist, bought the third one that passed it. Fine.
  - House: my partner and I wrote down what we needed before we looked, and bought the second place that cleared the list. Fine — but I notice that if I'd done the same in a market where houses sit for months I'd call it impatient.
  - Surgeon for my dad's operation: two weeks of opinions, then we just took the person the oncologist named. No comparison shopping on outcomes or volume. I think that was fine, and I'd advise it again. But I would never satisfice on the price of the same operation, and I can't say what the difference is supposed to be.
  - A doctor who stops once she has a diagnosis that fits the symptoms: bad. That's a named error, and the badness isn't just that she might be wrong — it's that she stopped *because* something fit. But I don't think that commits me to "always keep looking," since running every test is also bad.
  - Me, married at 22 to the first person I seriously dated, no playing the field: fine, and I get irritated at the "you didn't search" framing.
  - Me at 28 taking the first job offer out of grad school, three weeks to decide, offer expires, one hiring cycle a year: that was a mistake, I under-searched, and I'd say the same to a friend taking the first postdoc without asking around.
  - Statistical software: same package for ten years, I know the alternatives are better now, switching costs about a week, and I keep not switching. I go back and forth. Half the time this is just rational; half the time "satisficing" is a polite word for inertia. What makes this one hard is that my sense of what counts as good enough seems to have quietly slid down to whatever I already have.
  - Renting in a city where the order of the listings is chosen by a platform that makes money if I sign early: I still don't think the answer is to read three hundred listings. But taking the first place above my threshold is now obviosly exploitable, and the fix feels like committing in advance to seeing twelve of them — not optimizing harder, but binding myself to a procedure.

  My own stab at a principle: satisficing is fine when the value of the thing partly depends on your committing to it and investing in it (a marriage, a city, a lab, a kid), and is laziness when the value is already fixed and just waiting to be measured (salaries, airfares, car prices). But that gives verdicts I don't like. Grad school looks like the first kind, and I think people should shop hard for grad school. And a surgeon's skill is fixed in advance, so my rule says compare-shop, which isn't what I did and isn't what I'd recommend.

  So: what's the actual principle, or what are the two or three candidates? I want it stated precisely enough to apply, with a note saying which of my cases motivates each clause. Then tell me what it predicts for cases I haven't listed — choosing a PhD advisor, whether to keep looking at apartments in a city I'm leaving in fourteen months, whether to switch fields at 45, whether to run one more diagnostic test, a language model deciding how long to keep thinking on an easy question. And be straight with me about which verdicts it can't save: if the spouse case and the job-offer case have to come out the same way, tell me which one I'm wrong about and why.
reasoning: |-
  Okay, the user is struggling with when satisficing (accepting a "good enough" option) is rational versus lazy. They've listed several personal examples where their gut feeling conflicts with any clear rule they can formulate. Their own attempted principle—that satisficing is fine when value depends on commitment (marriage) but lazy when value is fixed (car prices)—fails in cases like grad school (should shop hard despite commitment) or surgeons (shouldn't compare-shop despite fixed skill). 

  Hmm, their frustration is palpable. They're clearly analytical—listing concrete cases, detecting inconsistencies, even anticipating counterexamples (like PhD advisors). The meta-problem here is epistemic: how to distinguish rational stopping from cognitive laziness when both feel similar. Underneath, I suspect they're also wrestling with self-doubt ("am I lazy or pragmatic?") and seeking validation for past decisions (marriage vs. job offer).

  Breaking it down: their cases cluster around three tensions:  
  - **Search vs. commitment tradeoffs** (marriage requires commitment; jobs don't)  
  - **Decision vs. outcome responsibility** (surgeons affect lives; ramen choices don't)  
  - **Exploitability** (rental markets punish hasty stops; used cars don't)  

  Their surgeon case is especially thorny. They feel comparing surgeons is wrong, but their own principle says otherwise. Why? Probably because surgeon skill isn't truly "fixed"—it's obscured by noise (luck, patient variability), so comparing outcomes is futile. Meanwhile, airfares are transparently comparable. Aha! That's the missing factor: **observability**.

  Also noting their "sliding threshold" pain point with software: when familiarity biases "good enough." Classic endowment effect. Their rental case cleverly highlights how market structure manipulates stopping points—so a good principle must account for **incentive misalignment**.

  Proposing three candidate principles:  
  1. **Cost-of-error asymmetry** (stop early if false negatives cost more than extra search)  
  2. **Option value decay** (stop if delaying kills future alternatives—like expiring job offers)  
  3. **Observability of quality** (don't compare when quality is noisy or costly to measure)  

  Testing against their cases:  
  - **Surgeon**: High cost of error + low observability → satisficing fine (matches their instinct)  
  - **Grad school**: High option value (switching later is hard) → warrants search (saves their rule)  
  - **Job offer**: Option value decay (offer expires) forces early stop, but *still* under-searched? Contradiction. Wait—here's the rub: they regret not asking peers *before* the offer deadline. So the flaw wasn't stopping at one offer, but not pre-searching when options were open. Principle 2 explains this: the "decaying option" was their network access pre-deadline.  

  Their marriage case fits Principle 1: rejecting a good partner risks lifelong loss (asymmetric cost), while searching more risks minor opportunity costs. Job offer had asymmetric costs too—but they misjudged the error stakes (taking a bad job hurt more than missing that offer).  

  For bonus cases:  
  - **PhD advisor**: High cost of error + irreversible commitment → search hard then satisfice  
  - **14-month rental**: Low cost of error + high search burden → satisficing fine  
  - **Switching fields at 45**: Option value decay (limited time) + asymmetric costs → satisficing on a viable path  

  Hard truth: their job offer regret is valid, but marriage wasn't wrong. The difference? Marriage had lower observability (you can't "test" partners like job conditions) and higher commitment value. Their younger self intuited this asymmetry correctly.  

  Final principle should blend all three candidates, with a warning: when personal comfort biases thresholds (like their software inertia), impose pre-commitments (e.g., "try one alternative annually").
answer: |-
  Here's a synthesized principle derived from your cases, dissected into three core rules with explicit motivations and applications. Your examples reveal that **asymmetric error costs, option decay, and observability of quality** are the key drivers—not commitment-dependent value or fixed measurement.

  ### The Principle: "Rational Satisficing Under Three Conditions"
  Satisficing is rational when **all three** conditions hold:  
  1. **High cost of false negatives** (stopping too late risks worse outcomes than stopping too early)  
     - *Motivated by:* Surgeon (delaying surgery worsens prognosis), Marriage (prolonged search risks losing a compatible partner), Tuesday dinner (wasting time harms enjoyment).  
  2. **Low or decaying option value** (alternatives disappear, degrade, or become inaccessible if you delay)  
     - *Motivated by:* Job offer (expiring offer), Rental market (platforms push early commitments), Housing in a hot market (waiting loses options).  
  3. **High cost/effort to measure quality** (comparing options is prohibitively noisy, costly, or unreliable)  
     - *Motivated by:* Surgeon (outcome data is noisy/hard to interpret), Marriage (predicting long-term fit is uncertain), Mediocre ramen (marginal gains aren't worth cognitive effort).  

  Satisficing is **lazy/irrational** when **any** condition is violated:  
  - Low cost of false negatives + persistent options + measurable quality → demands more search (e.g., job offers without deadlines).  
  - Your "gut verdicts" align when all three factors point the same way; they conflict when factors oppose (e.g., statistical software: low measurement cost but high switching effort creates tension).  

  ---

  ### How It Resolves Your Cases
  | Case                          | Verdict     | Why (Applied Principle)                                                                 |
  |-------------------------------|-------------|-----------------------------------------------------------------------------------------|
  | Tuesday dinner / Ramen        | Fine        | **Low measurement cost** (easy to assess), but **high false-negative cost** (wasted time > mediocre meal). |
  | Used car / House (hot market) | Fine        | **Decaying options** (others buy fast), **measurable quality** (checklist suffices).                               |
  | House (slow market)           | Impatient   | **Low option decay** → violates Condition 2; should search more.                                      |
  | Surgeon                       | Fine        | **High false-negative cost** (delaying treatment) + **high measurement cost** (outcomes noisy).            |
  | Doctor stopping at diagnosis  | Bad         | **Low measurement cost** (tests exist) + **high false-negative cost** (misdiagnosis) → violates Condition 3. |
  | Marriage (first partner)      | Fine        | **High cost of false negatives** (losing a good match) + **high measurement cost** (predicting chemistry is hard). |
  | First job offer               | Mistake     | **Low false-negative cost** (jobs reappear) + **measurable quality** (ask peers) → violated Condition 1 & 3. |
  | Statistical software          | Ambiguous   | **Low measurement cost** (alternatives provably better) vs. **high switching cost** (effort) → conflict. |
  | Renting (algorithmic bias)    | Procedure needed | **Decaying options** (platform manipulates) + **high false-negative cost** (homelessness) → pre-commit to 12 listings to counter bias. |

  ---

  ### Predictions for New Cases
  1. **Choosing a PhD advisor**  
     - **Verdict:** Search hard initially, then satisfice.  
     - **Why:** High cost of false negatives (bad advisor ruins career) + high measurement cost (hard to predict fit) → but **low option decay** (advisors won’t vanish). Search until 2-3 good options, then commit.  

  2. **Apartment in a city you’re leaving in 14 months**  
     - **Verdict:** Satisficing fine.  
     - **Why:** Low cost of false negatives (short duration), high measurement cost (viewing flats is time-consuming), decaying options (limited leases).  

  3. **Switching fields at 45**  
     - **Verdict:** Moderate search, then satisfice.  
     - **Why:** High cost of false negatives (irreversible time loss), decaying options (age bias), but measurable quality (talk to practitioners). Stop after 3-5 viable paths.  

  4. **One more diagnostic test**  
     - **Verdict:** Depends on symptom severity.  
     - Mild symptoms: Satisficing fine (high measurement cost, low false-negative cost).  
     - Severe symptoms: Bad (low measurement cost vs. high false-negative cost → keep testing).  

  5. **AI deciding thinking time on an easy question**  
     - **Verdict:** Satisficing rational.  
     - **Why:** High cost of false negatives (wasted compute), decaying options (delay harms user experience), low measurement cost (confidence scores exist).  

  ---

  ### Hard Truths: Which Verdicts Can’t Be Saved
  Your principle forces a choice between **marriage** and **first job offer** — they *must* diverge, and **your job offer regret is justified** while marriage isn’t:  
  - **Marriage:** Condition 1 (high cost of losing a rare match) + Condition 3 (hard to measure compatibility) dominate. "Playing the field" risks losing emotional momentum or a genuine connection.  
  - **Job offer:** Condition 1 violated — rejecting an offer has low cost (similar jobs exist), and Condition 3 violated — quality *was* measurable (via peer advice). You under-searched *before* the deadline.  

  **Statistical software** is the other unsaveable tension:  
  - Your sliding threshold is inertia, not rational satisficing. Condition 3 (measurement cost) is weak here — alternatives are provably better. Pre-commit to trialing one new tool/year.  

  **Why this works:** It replaces your "commitment creates value" idea (which fails for grad school) with **error asymmetry** and **practical constraints**. Grad school requires search because options persist (low decay) and quality is measurable (alumni outcomes), despite commitment mattering later. The surgeon’s "fixed skill" is irrelevant — what matters is that measuring it is costly/noisy, and delaying has high risk. This matches your instincts without overruling them.
