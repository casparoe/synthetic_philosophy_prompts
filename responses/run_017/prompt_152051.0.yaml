  ### Exam Question

  **Question: Intuitionistic Logic and the Balanced Numbers Conjecture**  
  *(90 minutes; maximum 1,000 words)*  

  Consider the following conjecture in number theory, called the **Balanced Numbers Conjecture (BNC)**:  
  *Every integer greater than some fixed threshold \(N\) can be expressed as \(a^2 + b^3\) for integers \(a\) and \(b\) (where \(a\) and \(b\) may be negative).*  

  We stipulate that:  
  1. The property "\(n\) is balanced" (i.e., \(\exists a \exists b (n = a^2 + b^3)\)) is **decidable** for any specific \(n\) via a bounded search (since \(|a| \leq \sqrt{n}\) and \(|b| \leq \sqrt[3]{n}\)).  
  2. BNC is an **open problem**: No proof or refutation is known, no counterexample has been found, and it has not been shown to be independent of standard arithmetic (e.g., Peano arithmetic).  

  Address **all** parts below from the perspective of intuitionistic logic and constructive mathematics:  

  **(a)** Explain why an intuitionist does not assert \( \text{BNC} \lor \neg \text{BNC} \) (the law of excluded middle for BNC). Why is this *not* equivalent to the intuitionist asserting \(\neg (\text{BNC} \lor \neg \text{BNC})\)?  

  **(b)** Show that \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) is valid in intuitionistic logic. Explain why this does not permit the intuitionist to assert \( \text{BNC} \lor \neg \text{BNC} \).  

  **(c)** If someone claimed to have an intuitionistic proof of \( \text{BNC} \lor \neg \text{BNC} \), what would the **disjunction property** of intuitionistic logic require such a proof to deliver? Why is such a proof unavailable given the open status of BNC?  

  **(d)** The difference between classical and intuitionistic logic is often debated. Is it primarily:  
  - A difference about the **meanings of logical connectives** (e.g., what constitutes proof of \(A \rightarrow B\) or \(A \lor B\)), rooted in proof-theoretic semantics?  
  - Or a difference about **mathematical ontology** (e.g., what objects exist, and what establishes existence)?  
  Take a stand and defend it. Also, comment on whether it is awkward to model intuitionistic logic using classical set theory (e.g., Kripke semantics), given that the latter assumes non-constructive principles.  

  ---

  ### Model Answer  
  *(Approx. 800 words; avoids name-dropping and focuses on technical content)*  

  **(a)** An intuitionist does not assert \( \text{BNC} \lor \neg \text{BNC} \) because intuitionistic logic requires a constructive justification for disjunctions: to assert \(A \lor B\), one must possess either a proof of \(A\) or a proof of \(B\). For BNC, no proof exists (it is open), and \(\neg \text{BNC}\) (which is equivalent to \(\forall N \exists n > N \text{ unbalanced}\)) lacks a constructive refutation (e.g., no method yields a counterexample for arbitrary \(N\)). However, this non-assertion is not equivalent to asserting \(\neg (\text{BNC} \lor \neg \text{BNC})\). The latter would imply that \(\text{BNC} \lor \neg \text{BNC}\) leads to absurdity. But assuming \(\neg (\text{BNC} \lor \neg \text{BNC})\) entails a contradiction: it implies both \(\neg \text{BNC}\) (from the impossibility of the disjunction) and \(\neg \neg \text{BNC}\) (since \(\neg \text{BNC}\) would make \(\text{BNC} \lor \neg \text{BNC}\) hold, contradicting the assumption). Thus, while the intuitionist refrains from asserting the disjunction, they reject its negation as contradictory.  

  **(b)** The formula \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) is intuitionistically valid. To see this, assume \(\neg (\text{BNC} \lor \neg \text{BNC})\) and derive absurdity. Under this assumption, if BNC were true, then \(\text{BNC} \lor \neg \text{BNC}\) would hold, contradicting the assumption; hence \(\neg \text{BNC}\). But if \(\neg \text{BNC}\) holds, then \(\text{BNC} \lor \neg \text{BNC}\) again holds, another contradiction. Thus, \(\neg (\text{BNC} \lor \neg \text{BNC})\) implies falsity, so its negation, \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\), is valid. Despite this, the intuitionist cannot assert \( \text{BNC} \lor \neg \text{BNC} \) because double negation elimination (DNE) — inferring \(P\) from \(\neg \neg P\) — is not admissible in intuitionistic logic. The double negation only signifies that the disjunction cannot be consistently denied, but it does not provide a constructive decision procedure for which disjunct holds. Without such a procedure, the disjunction remains unassertible.  

  **(c)** The disjunction property states that any proof of \(A \lor B\) in an intuitionistic system must yield either a proof of \(A\) or a proof of \(B\). Thus, a proof of \( \text{BNC} \lor \neg \text{BNC} \) would require:  
  - A constructive proof of BNC: This would demand producing a specific \(N\) and a method to, for any \(n > N\), compute \(a\) and \(b\) such that \(n = a^2 + b^3\).  
  - Or a constructive proof of \(\neg \text{BNC}\): This would require a procedure that, for any proposed threshold \(N\), computes an \(n > N\) that is unbalanced (i.e., proves \(\forall a \forall b (n \neq a^2 + b^3)\)).  
  Given BNC's open status, neither proof exists. No \(N\) has been constructed to satisfy BNC, and no procedure generates counterexamples for arbitrary \(N\). Since the disjunction property mandates one of these concrete outcomes, the lack of either means \( \text{BNC} \lor \neg \text{BNC} \) is unprovable intuitionistically.  

  **(d)** The core difference between classical and intuitionistic logic is about the **meanings of logical connectives**, not ontology. Logical operations in intuitionism are defined by proof conditions: a proof of \(A \rightarrow B\) transforms proofs of \(A\) to proofs of \(B\); a proof of \(A \lor B\) supplies a proof of one disjunct; a proof of \(\exists x P(x)\) provides a witness. This redefinition alters the semantics (e.g., rejecting LEM as non-constructive) but does not inherently change ontology. For instance, BNC involves integers, which both systems accept as objects, but intuitionism requires constructive verification (e.g., computable \(a, b\)) for existence claims. Thus, the debate centers on *how* we justify statements (proof conditions), not *what* exists.  

  However, this semantic shift indirectly affects ontology: intuitionism rejects non-constructive existence proofs, so objects requiring LEM (e.g., uncomputable reals) may not exist. Yet this is a consequence, not the root cause.  

  Modeling intuitionistic logic in classical set theory (e.g., Kripke semantics) is awkward but revealing. Classical models interpret intuitionistic truth as provability across possible worlds, using non-constructive set theory. This is awkward because it employs the very methods (e.g., unrestricted LEM) that intuitionism rejects, potentially misrepresenting constructive content. For example, a Kripke model might "validate" \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) classically without supplying a constructive decision. Still, such models are useful metatheoretic tools for classical logicians to study intuitionistic systems, showing that the semantic difference is foundational.  

  ---

  ### Marking Scheme  
  *(Total: 20 marks; 4 marks per part)*  

  1. **Part (a)**: Explains non-assertion of \( \text{BNC} \lor \neg \text{BNC} \) and why it differs from asserting \(\neg (\text{BNC} \lor \neg \text{BNC})\).  
     - **4 marks**: Clear, correct explanation of both (constructive disjunction requirement + contradiction from negation).  
     - **Typical mistake**: Claims "intuitionists deny LEM" without clarifying non-assertion vs. denial, or misses the contradiction in \(\neg (\text{BNC} \lor \neg \text{BNC})\).  

  2. **Part (b)**: Derives \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) and explains why it doesn’t imply the disjunction.  
     - **4 marks**: Valid derivation + correct point on DNE inadmissibility.  
     - **Typical mistake**: Only states \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) is provable without derivation or confuses it with the disjunction.  

  3. **Part (c)**: Uses disjunction property to state what a proof must deliver (constructive proof of BNC or ¬BNC) and ties to openness.  
     - **4 marks**: Explicit disjunction property + specific BNC/¬BNC proof requirements + openness link.  
     - **Typical mistake**: Mentions disjunction property vaguely or omits what BNC/¬BNC proofs constructively entail.  

  4. **Part (d)**: Takes a stand on meaning vs. ontology and addresses classical modeling awkwardness.  
     - **4 marks**: Defends semantics as primary (with proof conditions), notes ontological consequences are derivative, and discusses classical modeling awkwardness.  
     - **Typical mistake**: Lists both options without taking a stand, or ignores classical modeling.  

  5. **Overall Quality**: Coherence, precision, and avoidance of memorized clichés.  
     - **4 marks**: Self-contained argument using BNC; no name-dropping or slogans; under 1,000 words.  
     - **Typical mistake**: Invokes authorities (e.g., "Brouwer says") or memorized lines (e.g., "proofs are programs") without integration.  

  **Name-Dropping Penalty**: Answers that recite memorized terms (e.g., "BHK," "Brouwer," "Dummett") without integrating them into a specific argument for BNC should score **≤ 8/20**. They may earn partial credit only if they accidentally hit a must-hit point.  

  **A vs. B Distinction**: An **A answer** (17–20) derives \(\neg \neg (\text{BNC} \lor \neg \text{BNC})\) explicitly in (b) and specifies the constructive requirements for BNC/¬BNC in (c) (e.g., "computes \(a,b\) for all \(n>N\)"). A **solid B answer** (14–16) states these points without derivation or computational detail.  

