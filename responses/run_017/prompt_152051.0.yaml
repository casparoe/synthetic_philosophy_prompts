  **Exam Question**

  ---
  **Question (Intuitionistic Logic and the Balanced Numbers Conjecture)** [Word limit: 1000 words]

  Consider the following conjecture in number theory, which we will call the Balanced Numbers Conjecture (BNC):

  *Every integer greater than some fixed threshold can be expressed as \(a^2 + b^3\) for some integers \(a\) and \(b\), where \(a\) and \(b\) may be negative.*

  We stipulate that:

  1. The property "\(n\) is balanced" (i.e., there exist integers \(a, b\) such that \(n = a^2 + b^3\)) is decidable by a bounded search for any given \(n\).
  2. BNC is an open problem: no proof is known, no refutation is known, no counterexample has been found by search, and it has not been shown to be independent of standard arithmetic (such as Peano arithmetic).

  In the context of intuitionistic logic and constructive mathematics, answer the following:

  (a) Explain why an intuitionist does not assert the law of excluded middle (LEM) for BNC, that is, why they do not assert \( \text{BNC} \lor \neg \text{BNC} \). Also, explain why this is *not* equivalent to asserting the negation of LEM for BNC, i.e., \( \neg (\text{BNC} \lor \neg \text{BNC}) \).

  (b) Show that the double negation of LEM for BNC, i.e., \( \neg \neg (\text{BNC} \lor \neg \text{BNC}) \), is valid in intuitionistic logic. Explain why this does not help the intuitionist to assert \( \text{BNC} \lor \neg \text{BNC} \).

  (c) Suppose someone claims to have a proof of \( \text{BNC} \lor \neg \text{BNC} \) within an intuitionistic system. What must such a proof deliver, by the disjunction property of intuitionistic logic? Why is such a proof not available given that BNC is open?

  (d) Address the meta-question: Is the difference between classical and intuitionistic logic primarily a difference about the *meanings* of the logical connectives (a proof-theoretic or semantic matter) or a difference about the *ontology* of mathematical objects and what it takes to establish that they exist? In your answer, also comment on whether there is an awkwardness in using classical set theory (which is non-constructive) to model intuitionistic logic.

