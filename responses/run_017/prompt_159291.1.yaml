prompt: |-
  I'm writing up my position on individual duties in collective-harm cases for a graduate seminar in practical ethics, and I'd like it stress-tested before I commit to it in front of people who will enjoy taking it apart. Here is the set, as precisely as I can state it.

  (1) Threshold cases. Where the bad outcome depends on a collective total's crossing a discrete threshold and my contribution is not the one that crosses it, I make no difference, and so no duty falls on me. Concretely: the supermarket I use takes chickens from its supplier in sealed crates of fifty under a standing contract, and sets each week's order to the smallest number of crates that would have covered the previous week's sales; birds that go unsold are marked down and eaten anyway. So unless I happen to buy the chicken that pushes the week's sales to a multiple of fifty, my purchase changes nothing downstream, and I take myself to have no duty, on difference-making grounds, to stop buying them.

  (2) Continuous cases. Where harm is a continuous function of the total — my flights, my heating — I reject the inefficacy objection. The expected harm of my marginal tonne is the product of a small probability of making a real difference (helping to push some subsystem past a tipping point) and a very large harm, and I don't think a probability gets to be ignored merely for being small.

  (3) The grounds. I don't think marginal efficacy is where most of my climate duties come from anyway. The operative grounds, as I see them, are fair share — I am taking more than my share of a genuinely scarce resource, the absorptive capacity of the atmosphere, from people with stronger claims to it — and the thought that I should not live off a practice whose wrongness I am willing to name in the seminar room. Neither of these looks to me as though it depends on whether my own tonne changes anything.

  (4) Voting. I think I ought to vote, and I take the standard expected-value defence to be sound: a very small chance of being decisive multiplied by very large stakes. So here I treat a small probability of making a difference as duty-generating, even though the case is a threshold case.

  (5) The crux of (1). I also think the purchaser who does buy the crate-triggering chicken has no more reason to abstain than anyone else and no special duty. Whether he is the one depends on how many birds other people happened to buy that week, which he cannot see, and I don't want duties that turn on invisible facts about other people's behaviour.

  (6) Method. I reject the what-if-everyone-did-that test as a route to individual obligation, on the familiar ground that it compares my actual act with a world in which everyone else acts differently, which is not an option available to me. But I do accept a duty to do my fair share of a collective effort, where the share is fixed by whatever fair scheme for allocating the burden we have actually managed to agree on.

  (7) Level. I am happy to argue as a consequentialist about what the institution or the policy should be — carbon pricing, crate sizes, procurement rules — and as a non-consequentialist about what I personally owe in the meantime. I take these to be questions at different levels rather than the same question asked twice.

  My worry, vaguely, is that (3) is doing more work than I have earned, but I can't locate the fault and I would rather find it now than in the seminar. Go through the set and audit it: which pairs genuinely pull against each other, which only look as though they do, and for each real tension what would have to give and what giving it up would cost me. Rank the tensions by severity rather than listing them as equally bad, and tell me at the end which single revision would clean up the most and what the position looks like once it is made.

  Lead with your bottom line in the first sentence and then give the reasoning. No preamble, and don't restate my question back to me.
reasoning: |-
  Okay, the user is preparing for a graduate seminar in practical ethics and wants their position on individual duties in collective-harm cases stress-tested. They've outlined seven points and are particularly worried about point (3) doing more work than justified. Let me start by understanding their arguments.

  First, they distinguish threshold cases (1) and continuous cases (2). In threshold scenarios like the chicken crate example, they argue no duty exists because the individual's action doesn't cross the threshold. But in continuous cases like carbon emissions, they reject the inefficacy objection because even small probabilities of causing harm matter. Then in (3), they shift grounds to fair share and complicity, downplaying marginal efficacy. 

  Looking at voting (4), they accept a small chance of making a difference as duty-generating, which seems at odds with their threshold case in (1). If a tiny probability justifies voting, why not in the chicken example? The user also emphasizes that duties shouldn't depend on invisible facts (5), like whether someone's purchase triggers a crate order. Their rejection of the "what-if-everyone" test in (6) makes sense, but they support fair shares based on agreed schemes. Finally, they separate institutional consequentialism from personal non-consequentialism (7).

  The main tension is between (1) and (4). In voting, a small chance of being decisive creates a duty, but in threshold cases like the chicken crate, they dismiss any duty because the individual likely won't be the one to cross the threshold. But if we apply the expected value reasoning from voting to the chicken case, each purchase has a small chance of being the one that triggers the next crate. By their own logic in (4), that should generate some duty. However, the user rejects this in (5), arguing that duties shouldn't hinge on invisible facts. This creates inconsistency.

  The fair share argument in (3) might be compensating here. But it's doing heavy lifting to cover the gap. Without it, the threshold cases would lack a basis for duty, which might be why they rely on it. But if fair share applies to continuous cases, why not to threshold cases? For example, buying chicken could be seen as taking more than one's fair share of a resource, similar to carbon emissions. However, the user might counter that the chicken example involves no scarcity issue, unlike the atmosphere's absorptive capacity. But is that distinction solid? If the system causes harm, maybe fair share still applies.

  Another tension is between (2) and (5). In continuous cases, they accept expected harm calculations, but in (5), they argue that the crate-triggering purchaser has no special duty because they can't know if they're the one. But in voting, the voter also can't know if they'll be decisive, yet they still have a duty. So why the asymmetry? The user might need to either drop the invisibility point in (5) or explain why it matters more in purchasing than voting.

  The user's rejection of the "what-if-everyone" test in (6) seems consistent with their emphasis on actual agreements for fair shares. But it raises questions about how fair shares are determined without hypotheticals. If there's no agreed scheme, what then? 

  The most severe tension is between (1) and (4). Aligning them would require either applying expected value to threshold cases, which weakens (1), or abandoning it for voting, which undermines (4). Since (4) is crucial for voting duties, modifying (1) is more feasible. The user could argue that in purchasing, the probability is negligible, but that's not principled. Alternatively, they might emphasize fair share across all cases, making marginal efficacy irrelevant. But that strengthens (3), which they worry is overworked.

  The next step is recommending a revision. Strengthening the fair share argument to cover both threshold and continuous cases would resolve the inconsistency. For example, buying chicken, even if not triggering a crate, might still be part of an unfair system. But the user needs to establish why the resource is scarce in the chicken case. If not, fair share might not apply. Alternatively, they could use complicity: benefiting from a harmful practice. That doesn't depend on scarcity. In (3), they mention not living off a practice they condemn, which could apply to both cases. Expanding (3) to cover complicity in threshold cases might unify their position without relying on marginal efficacy.

  Another revision is to adjust (1) by acknowledging that while the chance is small, the expected harm could still impose a duty, as in (4). But this contradicts their point about invisible facts in (5). If duties can arise from small probabilities, why does invisibility matter? In voting, the decisiveness is also invisible. The user would need to argue that in consumer cases, the probabilities are too low to matter, but that's ad hoc.

  The single best revision is to expand (3)'s complicity argument to cover threshold cases, reducing reliance on marginal efficacy. This makes duties consistent across cases. For example, buying chicken supports a harmful system, regardless of immediate impact. This aligns with their rejection of the "what-if-everyone" test and focuses on fair shares and complicity. The cost is that it might make their position less consequentialist at the individual level, but they already accept non-consequentialism in (7). 

  This approach resolves the main tension, strengthens (3) without overextension, and maintains consistency with voting through expected value where applicable. It also addresses the worry that (3) is doing too much by explicitly making it the core duty, applicable universally.
answer: |-
  **Your position is coherent but requires reconciling the tension between threshold-case inaction (1) and voting duties (4) via expected value, which can be resolved by consistently applying your "fair share/complicity" framework from (3) to all cases, reducing reliance on marginal efficacy.**  

  ### Audit of Tensions (Ranked by Severity):  
  1. **Severe: (1) vs. (4)**  
     - **Conflict:** (1) rejects duties in threshold cases (e.g., chicken purchase) because marginal impact is nil or invisible. (4) imposes voting duties via expected value (small chance × high stakes).  
     - **Why tension?** If expected value justifies voting (a threshold case), it should apply to chicken purchases: each purchase has a *small probability* of being decisive (triggering a crate) × harm to chickens. Rejecting this in (1) but accepting it in (4) is inconsistent.  
     - **Resolution:** Abandon (1)’s strict "no difference, no duty" rule for threshold cases. Apply expected-value reasoning consistently or drop it for voting.  
     - **Cost:** If you drop expected value for voting, you lose a standard justification. If you extend it to chicken purchases, you undermine (1) and (5), forcing duties even with invisible thresholds.  

  2. **Moderate: (1)/(5) vs. (3)**  
     - **Conflict:** (3) grounds duties in fair share/complicity, independent of marginal efficacy. But (1) exempts chicken purchases *because* they lack marginal efficacy, and (5) rejects duties based on "invisible facts."  
     - **Why tension?** Fair share/complicity (e.g., taking more atmospheric capacity) could apply to chicken purchases: you benefit from a harmful system regardless of threshold-crossing. (1)/(5) ignore this by focusing on causal impact.  
     - **Resolution:** Extend (3) to threshold cases. Argue that buying chicken violates fair share (using scarce resources/participating in wrongful practices) even if you don’t trigger a crate.  
     - **Cost:** Weakens (1)/(5); you must explain why chicken purchasing involves "unfair shares" (is absorptive capacity meaningfully analogous to crate logistics?).  

  3. **Minor: (2) vs. (5)**  
     - **Conflict:** (2) accepts duties in continuous cases (e.g., emissions) due to expected harm from tipping points. (5) rejects "special duties" for threshold-crossers because invisibility negates obligations.  
     - **Why tension?** If expected harm matters in (2) (where tipping points are also invisible), why dismiss invisibility in (5)?  
     - **Resolution:** Consistently treat invisibility as irrelevant. In both cases, duties arise from risk participation (emissions) or systemic complicity (chicken).  
     - **Cost:** None; aligns with your rejection of "invisible facts" as morally decisive.  

  4. **Minor: (6) vs. Fair Share**  
     - **Conflict:** (6) rejects "what-if-everyone" but endorses fair shares based on "actually agreed schemes." What if no scheme exists (e.g., chicken supply chains)?  
     - **Resolution:** Specify that fair shares default to general principles (e.g., equal per capita rights) absent specific agreements.  
     - **Cost:** Requires defending a baseline for fair shares without institutional arbitration.  

  ---

  ### Recommended Revision:  
  **Extend (3)’s fair share/complicity framework to threshold cases (e.g., chicken), abandoning (1)’s "no difference, no duty" rule.** This resolves the severe tension with (4) and streamlines your position:  
  - **How it works:** In *all* collective-harm cases (threshold or continuous), your duty stems from:  
    - **(a)** **Fair share:** Not appropriating more than your share of a scarce resource (atmospheric capacity, livestock life-expectancy).  
    - **(b)** **Complicity:** Not profiting from practices you condemn (e.g., industrial chicken farming).  
    Marginal efficacy becomes irrelevant, sidestepping (1)/(4)/(5) conflicts.  
  - **Costs:**  
    - You lose the clean "no impact" exemption in threshold cases. Buying chicken now *always* violates fair share/complicity.  
    - Requires defending "fair share" in non-scarcity cases (e.g., why is a chicken’s life a "scarce resource"?).  
  - **Gains:**  
    - Unifies your duties under one principle: **individual obligations arise from participation in unjust systems, not causal impact.**  
    - Preserves (4): Voting remains a separate duty via expected value (or reframe it as fair share: doing your part in collective decision-making).  
    - Strengthens (3): It becomes the core foundation, not an ad hoc patch.  

  **Revised Position Summary:**  
  *Threshold or continuous, your duty is to avoid complicity in harmful practices and consume no more than your fair share of contested resources. This applies to chickens, carbon, and beyond. Marginal impact is beside the point; upholding personal integrity in collective harm is central. For voting, either retain expected value (as a special case) or recast it as fair-share civic participation.*
