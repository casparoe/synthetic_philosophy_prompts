prompt: |-
  I spent thirty years as a field entomologist and now, since retiring, I sit on the volunteer panel that signs off on pest-control requests for the city's parks, school gardens and community orchards — six or seven a season, twenty minutes each, sometimes ten if it's an emergency, and we owe the parks department a one-paragraph written rationale per decision. None of us have any philosophy. Increasingly the requests come to us arguing about insect welfare and we argue back the same way, so I want that argument turned into something we can actually run rather than improvise each time.

  The rough principle I keep coming back to (I more or less made it up out of population biology and some reading on invertebrate sentience, so treat it as mine) is: don't count bodies, count foreclosed experience, and count it net. Three corrections go into that. The great majority of juveniles in an outbreak population would be dead within days of something else anyway, so the number killed massively overstates the loss — what matters is the remaining expected experience of the few who'd have made it. For a population sitting at carrying capacity, removing individuals mostly changes who gets to live, so the ledger has to subtract the lives that will now exist because the competition went away. And it cuts the other way too: a defoliated host supports fewer herbivore-days later in the season, so doing nothing can cost more than intervening. There's also an asymmetry I want kept: predators, parasitoids and pollinators are longer-lived and far less replaceable per individual than the pest herbivores, so a broad-spectrum kill can do more damage in welfare terms than the pest kill it was meant to avert.

  Turn that into a decision procedure for my panel: the questions in order, what counts as a good enough answer to each with the time and expertise we have, where it stops early with a no, and where it has to hand off to a person because the question is values rather than facts. I specifically want to know what we do when a step needs a number nobody can give us — how confident we are that these animals have anything at all to lose — because that seems to me like a dial rather than a fact and I don't want the procedure pretending otherwise. Then run it on three from last season: a systemic soil drench proposed for green peach aphid on the heritage rose beds; a winter-moth caterpillar outbreak defoliating the street oaks where the options were Bt, barrier bands on the trunks, or nothing; and a yellowjacket nest in the ground next to the toddler play area, which I suspect the procedure simply can't handle and should say so. I expect at least one of these to come out against what I'd vote for on instinct, and I'd rather hear that than have the procedure quietly rigged to agree with me. Also be straight about where it will misfire and what it can't do at all.

  One format thing: no headings, no bullet points, no bold, no tables — continuous prose, the way you'd write it in an email to a colleague.
reasoning: |-
  Hmm, the user is a retired field entomologist who now volunteers on a pest-control approval panel for city green spaces. They're frustrated with how their panel currently handles decisions—improvising arguments about insect welfare without a consistent framework. They've developed their own rough principle about "counting foreclosed experience net" instead of just body counts, and want this turned into a practical decision procedure.

  The core of their principle involves three key corrections:
  1) Most juveniles would die anyway, so focus on the expected experience of survivors
  2) At carrying capacity, removal mostly shifts who lives (so subtract gains from reduced competition)
  3) Consider downstream effects like defoliation reducing future herbivore-days
  Plus an asymmetry: prioritize longer-lived predators/parasitoids/pollinators over replaceable herbivores.

  They want a step-by-step procedure that:
  - Works within their constraints (20 min/request, volunteer expertise)
  - Explicitly handles uncertainty (especially about insect sentience)
  - Flags when decisions become value judgments rather than fact-based
  - Is tested against three real cases from last season

  Key challenges I need to address:
  - How to operationalize "expected experience" without complex calculations
  - Where to set evidentiary thresholds for nonexpert volunteers
  - How to quantify the unquantifiable (like sentience weightings)
  - What to do when data is missing (make it explicit rather than fake precision)

  For the procedure itself, I'm thinking:
  1) Start with harm assessment - how bad is the current damage?
  2) Evaluate if the pest population is at carrying capacity (using simple indicators)
  3) Estimate "net foreclosed experience" with adjustments for juvenile mortality and competition effects
  4) Apply the asymmetry rule favoring predators/pollinators
  5) Explicitly declare uncertainty levels
  6) When hitting values questions (e.g., "is this suffering even meaningful?"), stop and hand off to human judgment

  For the test cases:
  - Aphids on roses: Systemic pesticide likely fails due to asymmetry (kills beneficials) and low individual experience value
  - Oak caterpillars: Bt spray may be justified by downstream defoliation effects
  - Yellowjackets: Procedure should break down due to human safety overriding insect welfare

  Need to be brutally honest about limitations:
  - Still requires judgment calls (e.g., what counts as "significant" harm)
  - Can't resolve deep philosophical questions
  - May contradict gut feelings (as they requested)
  - Will misfire in edge cases like venomous insects near children

  The format request is crucial: no bullet points or headings, just smooth prose like an email. I'll structure it with logical transitions instead.
answer: |-
  Here's a decision procedure based on your principle of net foreclosed experience, built for your panel's realities – limited time, volunteer expertise, and the need for a defensible paragraph. It's structured as sequential questions, designed to stop early with a 'no' where possible and flag uncertainty explicitly. Confidence levels (High/Medium/Low/Very Low) are assigned at key steps, acknowledging when we're operating on assumptions rather than facts, especially regarding the capacity for experience. When a question fundamentally hinges on values (like how much weight to give insect experience versus other concerns), the procedure explicitly hands it off to panel judgment. Numbers are avoided in favor of qualitative assessments (e.g., "likely at carrying capacity," "significant defoliation," "negligible downstream impact").

  **The Decision Procedure:**

  Start by confirming the request is complete (target pest, proposed control, location, justification). If incomplete, request more info (handoff). Assuming it's complete, proceed in order:

  1.  **Is there immediate, significant harm occurring or imminent to non-target organisms (especially vertebrates, including humans) or critical, non-replaceable plant resources (e.g., heritage trees, rare plantings)?** Focus on observable damage or clear risk. *Good Enough Answer:* Evidence of active defoliation threatening plant survival, structural damage, or verified high risk of human/animal stings/bites requiring urgent medical attention (e.g., anaphylaxis risk near playground). *Confidence:* Usually High (observational). *Stop Early:* If YES and harm is severe/imminent, approve the most targeted effective control (handoff if multiple options exist). If NO or minor/uncertain, proceed.

  2.  **Is the target pest population likely at or near the carrying capacity of its current environment?** Look for signs of resource depletion: heavy defoliation, overcrowding, visible stress on host plants, presence of many natural enemies. Absence of these suggests population is still growing. *Good Enough Answer:* Judgment based on photos, description of damage level, known pest biology (e.g., aphids explode quickly, many caterpillars suggest peak). *Confidence:* Medium (biological inference). *Stop Early:* If clearly BELOW capacity (e.g., early infestation, minimal damage), the "foreclosed experience" calculation leans heavily against intervention (see step 4). Proceed if AT or NEAR capacity, or uncertain.

  3.  **What is the expected net reduction in pest herbivore-days (considering downstream effects) if we do nothing versus if we intervene?** This captures your third correction. If intervention stops defoliation, the host plant might support *more* herbivores later (negative net reduction for intervention). If defoliation kills the plant or severely stunts it, future herbivore-days are lost (positive net reduction for doing nothing). *Good Enough Answer:* Qualitative estimate: "Severe defoliation likely kills mature oaks? Unlikely. Stunts annual flowers? Likely." "Minor aphid damage on established roses? Negligible downstream impact." *Confidence:* Medium to Low (ecological prediction). *Stop Early:* If doing nothing clearly leads to massive loss of future herbivore-days (e.g., host death), this strongly favors *intervention* on net experience grounds for the *pests themselves*. If intervention clearly destroys more future potential than it saves present harm, it leans against intervention. Proceed if unclear or minor difference.

  4.  **Adjusting for juvenile mortality and competition: What is the likely net loss of expected individual experience for the target pest population due to the intervention?** This combines your first two corrections. For pests at/near capacity (Step 2), killing individuals mostly removes those who would die anyway soon (low individual loss) and allows others (who would have died) to survive (gains offset losses). For pests below capacity, killing removes individuals who had a higher chance of surviving longer (higher loss). Factor in typical lifespan and mortality rates. *Good Enough Answer:* Judgment: "Aphids/juvenile caterpillars: Very high natural mortality, short max lifespan – likely low net loss even if below capacity." "Adult beetles/wasps: Lower natural mortality, longer lifespan – potentially higher net loss." *Confidence:* Medium on mortality/lifespan (biology), Low on precise net effect. *Stop Early:* If net loss is judged very low (e.g., spraying aphid nymphs), this factor doesn't strongly oppose intervention. If net loss is judged potentially high (e.g., killing adult pollinators accidentally), it strongly opposes. Proceed.

  5.  **Apply the Asymmetry: Does the proposed control pose a significant risk to non-target arthropods, especially longer-lived predators, parasitoids, or pollinators?** Compare the vulnerability and replaceability. Broad-spectrum chemicals are high risk. Targeted methods (Bt for caterpillars, barrier bands) are lower. *Good Enough Answer:* Identification of non-target risks based on control method specificity, application method/timing, and known biology of beneficials present. "Systemic drench in flowering bed: High risk to bees/parasitoids." "Bt sprayed on oak canopy: Low risk to non-caterpillars." "Barrier bands: Very low non-target risk." *Confidence:* Medium to High (based on pesticide labels/known ecology). *Stop Early:* If HIGH risk to key beneficials, intervention is likely rejected due to the high welfare cost per individual killed outweighing the likely low net pest loss (Steps 4 & 5 combined). If LOW risk, proceed to final balance.

  6.  **Synthesis and Uncertainty Declaration:** Weigh the factors:
      *   Harm (Step 1 - drives urgency)
      *   Net Herbivore-Day Change (Step 3 - favors/opposes intervention for pests)
      *   Net Pest Experience Loss (Step 4 - usually low, opposes intervention mildly)
      *   Non-Target Risk (Step 5 - often the strongest welfare factor, opposes intervention if high)
      *   *Crucially:* Acknowledge the "Sentience Dial": State confidence level (High/Med/Low/VL) in the assessment of net experience loss. This hinges entirely on the assumption that these arthropods have *something* analogous to welfare to lose. "Our assessment assumes a non-zero capacity for experience in these insects, but our confidence in quantifying this is Very Low. The net welfare calculation is therefore highly tentative." This is not a handoff, it's transparency.

  7.  **Values Handoff:** Are there overriding non-welfare considerations? This is where values enter explicitly. Examples: Intense public pressure/safety fear (yellowjackets), symbolic value of heritage roses, philosophical stance against *any* killing in city spaces, cost, organic certification requirements for community orchards. *The procedure stops here for human judgment.* The welfare analysis from steps 1-6 provides input, but the final call incorporates these other values.

  **Application to Last Season's Cases:**

  *   **Systemic Soil Drench for Green Peach Aphid on Heritage Roses:**
      Start. Step 1: Minor aesthetic damage likely, no imminent harm to plants (established roses tolerate aphids). Proceed. Step 2: Aphid population likely below or at capacity, but massive reproduction. Step 3: Negligible downstream impact – roses recover fast. Step 4: Very high aphid juvenile mortality, very short lifespan – net experience loss very low. Step 5: HIGH RISK. Systemic drench in soil near flowering roses poses significant risk to pollinators (bees) and soil predators/parasitoids (longer-lived, high welfare cost per individual). Step 6: Synthesis: Low harm, negligible downstream, low pest loss, but HIGH non-target risk. Net welfare impact likely negative. Confidence in experience assessment: Low. Step 7: Heritage status might be a values factor (handoff). *Procedure Leans Strongly Against* due to Step 5. (Instinct Check: Likely matches your 'no').

  *   **Winter Moth Caterpillar Defoliating Street Oaks (Bt vs. Bands vs. Nothing):**
      Start. Step 1: Significant defoliation observed, potential stress to mature oaks (especially if repeated annually), but rarely fatal. Proceed. Step 2: Outbreak suggests near/at capacity, heavy defoliation evidence. Step 3: DOING NOTHING: Severe defoliation reduces photosynthetic capacity, likely reducing future herbivore-days *this season* and stressing trees. INTERVENING (Bt/Bands): Stops defoliation, allows foliage recovery, potentially supporting *more* herbivores later if larvae missed. Net change uncertain, but likely a moderate positive net reduction for doing nothing (i.e., intervention saves future potential). Step 4: Caterpillars have high juvenile mortality. Net experience loss low (especially with bands, which don't kill instantly). Step 5: Bt: LOW non-target risk (specific). Barrier Bands: VERY LOW non-target risk. Step 6: Synthesis: Significant harm, intervention may *save* net herbivore-days, low pest loss, very low non-target risk. Net welfare impact neutral or slightly positive for intervention. Confidence: Medium-Low (experience). Step 7: Values: Public concern over tree health, cost/feasibility of bands vs spray. *Procedure Leans Towards Intervention (Bt preferred over bands for efficacy, similar welfare profile)*. (Instinct Check: Might contradict a 'do nothing' instinct?).

  *   **Yellowjacket Nest Next to Toddler Play Area:**
      Start. Step 1: HIGH risk of multiple stings to vulnerable children, potential for anaphylaxis. Verifiable location/immediacy. *STOP EARLY: APPROVE REMOVAL* (urgent harm mitigation). The welfare procedure *cannot handle this case* because Step 1 trumps everything. The inherent conflict between human safety and insect welfare is a fundamental values question the procedure isn't designed to resolve. It correctly flags that human safety necessitates intervention here, overriding the insect welfare calculus (which would be complex – net loss for wasps likely moderate/high due to longer adult lives, but non-target risk low if nest removed specifically). The rationale paragraph states: "Approved due to immediate and significant risk of harm to human health (children in play area). Insect welfare considerations were secondary in this urgent safety context."

  **Where it Misfires and Limitations:**

  *   **Misfires:** It will misfire when indirect effects dominate unexpectedly. Example: Spraying aphids minimally impacts ladybugs directly (Step 5 Low), but if it wipes out their prey, causing ladybug collapse later, that downstream loss isn't captured well. Similarly, misjudging carrying capacity (Step 2) can skew Step 4. It assumes basic pest/beneficial biology is known – a major unknown (e.g., a rarely seen pest) forces lower confidence or handoff.
  *   **Can't Handle:** True emergencies (Step 1 override). Deep values conflicts beyond simple declaration (e.g., panelist believes all killing is wrong). Quantifying "experience." Complex indirect ecological cascades beyond herbivore-days. Assigning relative weight to human preferences (e.g., "people hate wasps more than aphids"). It provides a *welfare framework*, not a full cost-benefit including economics or public opinion.
  *   **The Dial:** The explicit confidence declaration in Step 6 is crucial. It prevents false precision. When confidence in the capacity for experience or the net effect is "Very Low," the welfare rationale becomes weak, and the decision defaults more heavily to Step 1 (harm) or Step 7 (values).

  This procedure forces structured thinking around your core principle, makes assumptions transparent, stops early where possible, and clearly separates welfare assessment from values judgments. It won't always give a clear answer, but it will generate a defensible paragraph explaining *how* the welfare argument was considered, where uncertainty lies, and where other factors decided it. Expect it to sometimes challenge instinct – the oak caterpillar case is a prime example where net herbivore-days and low non-target risk might push towards intervention contrary to a "let nature be" instinct. The yellowjacket case starkly shows its safety override. It's a tool for clearer argument, not a replacement for judgment.
