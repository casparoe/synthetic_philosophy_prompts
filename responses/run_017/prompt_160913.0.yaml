answer: |-
  ## MEMORANDUM

  **To:** Faculty Senate  
  **From:** [Your Name], Governance Review Committee  
  **Date:** October 26, 2023  
  **Subject:** Recommendation Regarding the "Stability Clause" (Article V Amendment) and Path Forward  

  This memo addresses the validity and effect of the "Stability Clause" passed last spring and its impact on the current committee restructuring proposal. The core issue is whether a simple majority amendment can validly impose significantly higher barriers (two-thirds of the full Senate + faculty referendum) to its own future amendment or repeal, especially when those barriers appear permanently binding under the Clause's own terms. After careful review, the Committee recommends a specific interpretation and path forward.

  **1. Recommendation on the Stability Clause: Partially Valid, Partially Void**

  The Committee finds the Stability Clause **partially valid and partially void**:

  *   **Valid:** The requirement for a **two-thirds vote of Senators *present and voting*** for future amendments to Article V is valid. The Senate, acting under Article V as it existed (simple majority of those present and voting), had the authority to make it harder to amend its amendment rules. Raising the threshold within the Senate itself is a legitimate exercise of the amendment power.
  *   **Void:**
      *   The requirement for a **faculty referendum** as part of the amendment process for Article V.
      *   The Clause's declaration that **it is itself unamendable** except by the new, stricter process it creates.
      *   Any interpretation requiring "two-thirds of the *entire Senate*" (if intended) instead of "two-thirds of those present and voting." The original Charter (simple majority of present/voting) did not grant authority to bind absent members in this way for internal Senate votes.

  **Reasoning:** The fundamental problem lies in the *self-embracing permanence* and the *introduction of an external veto player*.

  *   **Self-Embracing Permanence:** A rule created by Process A cannot simultaneously declare itself immune to future amendment *except* by a much harder Process B that *it itself* creates. This creates a logical and practical lock-in. The Senate that passed the Clause used the simple majority power granted by the existing Charter. It did not possess, and therefore could not validly exercise, the authority to permanently shield itself from amendment under that same Charter *using the power it was currently wielding*. To allow this would mean any bare majority, at any time, could permanently entrench any rule by declaring itself unamendable except by an impossibly high bar. This fundamentally undermines the ongoing democratic governance the Charter is meant to facilitate. The Senate's authority to amend includes the authority to change how future amendments are made, but it does not include the authority to make *itself* functionally unreachable by future Senates acting under the *same* Charter.
  *   **Introduction of External Veto:** The original Charter vested amendment authority solely in the Senate (majority of present/voting). The Stability Clause attempts to fundamentally alter this structure by introducing the entire faculty as a new, mandatory veto player via referendum. This isn't just changing a vote threshold *within* the Senate; it changes *who has the ultimate authority* over the Charter. Such a fundamental shift in the locus of power cannot be achieved by a simple Senate majority amending its own rules; it requires a more foundational reconsideration and assent, arguably equivalent to adopting a new Charter or a specific authorization within the original Charter (which did not exist). It represents a delegation or sharing of sovereignty that wasn't authorized by the base document under which the Senate was acting. Furthermore, the practical impossibility (given historical turnout) renders this requirement effectively a permanent bar, compounding the self-entrenchment problem.
  *   **Denominator ("Entire Senate"):** The original Charter specified decisions based on those "present and voting." Imposing a requirement based on the *entire* membership, regardless of attendance, fundamentally changes the nature of the vote and the burden on achieving consensus. This shift was not explicitly authorized by the base Charter's amendment power and, like the referendum, imposes a potentially insurmountable barrier inconsistent with the authority used to create the Clause.

  **2. Implications for the Live Proposal (Committee Restructuring)**

  *   The current proposal to restructure the committee system **does not require amending Article V**. It amends other parts of the Charter.
  *   Therefore, the Stability Clause **does not apply** to this proposal. The proposal only requires the original Article V standard: **a majority of Senators present and voting at a quorate meeting**.
  *   The Committee recommends the Senate proceed to vote on the committee restructuring proposal under the original Article V rules.

  **3. Proposed Standing Meta-Rule for Amending Amendment Procedures**

  To prevent future confusion and provide clear principles, the Committee recommends adopting the following explicit rule governing amendments to Article V itself:

  > "Any amendment to Article V that:
  >    (a) **Increases the difficulty** of amending any part of this Charter (including Article V), or
  >    (b) **Adds a new approval body or constituency** (e.g., a faculty referendum, Board of Trustees approval beyond existing requirements) whose consent is required for amendments, or
  >    (c) **Alters the denominator** used for calculating required majorities (e.g., changing from 'members present and voting' to 'entire membership') in a way that increases the difficulty of passage,
  > shall require approval by **two-thirds of the Senators present and voting** at a quorate meeting.
  >
  > Any amendment to Article V that **decreases the difficulty** of amendment shall require only **a majority of the Senators present and voting** at a quorate meeting."

  **Reasoning for the Meta-Rule & Distinction:**
  *   **Asymmetry is Sound:** It is fundamentally easier to justify making rules *less* restrictive (expanding democratic access) than making rules *more* restrictive (potentially entrenching minority power or creating permanent barriers). Loosening a rule generally enhances flexibility; tightening it risks ossification. Therefore, tightening should cost more.
  *   **"Who Says Yes" vs. "What Percentage":** The distinction **holds up** and is crucial. Increasing a vote threshold *within the existing decision-making body* (e.g., 50% to 60% of those present) is a significant change but keeps authority contained. **Adding an entirely new veto player** (like the faculty via referendum) fundamentally alters the governance structure and the very nature of the Senate's authority over the Charter. It's not just a higher bar; it's a transfer or sharing of sovereignty. Similarly, changing the denominator (e.g., present/voting to entire membership) fundamentally alters the political calculus and burden of achieving agreement. These are categorical shifts deserving of a higher approval threshold within the Senate itself.

  **4. The Strongest Case Against this Recommendation**

  The most compelling argument against voiding parts of the Stability Clause runs as follows:

  "This recommendation, however well-intentioned, fundamentally undermines the rule of law and the integrity of the Charter itself. The Senate passed the Stability Clause using the exact procedure laid out in Article V at the time: a majority of those present and voting. The minutes confirm a quorum was present, and the vote was properly recorded. Whether we find the outcome wise or convenient is irrelevant. The Charter gave the Senate the power to amend itself by that process, and it did so.

  "Selectively voiding portions of a duly enacted amendment because we now find them too restrictive or poorly conceived sets a dangerous precedent. It replaces clear rules with ad hoc judgments about what seems 'too hard' or 'too permanent.' Who decides where that line is? Today it's the referendum requirement and self-entrenchment; tomorrow it could be any amendment a future Senate dislikes. This opens the door to chaos and undermines predictability, the very stability the Clause sought.

  "The argument that the Senate 'lacked the authority' to make amendment harder or involve the faculty is circular. The original Charter's amendment clause *was* the source of authority, and it contained *no* limitations on what could be amended or how the amendment rules themselves could be changed. The power to amend inherently includes the power to make future amendment more difficult. To claim otherwise is to imply hidden, unwritten restrictions on the amendment power – restrictions that did not exist in the Charter itself. If the faculty truly objected to the Senate having this broad amendment power, including over Article V, that should have been addressed when the Charter was originally adopted. Absent such a limitation, the Senate acted within its rights. Voiding parts of the Clause now is not legal interpretation; it's policy disagreement masquerading as principle, and it risks rendering the Charter meaningless whenever a provision proves inconvenient to a later majority."

  **Conclusion**

  The Stability Clause overreached by attempting to permanently bind future Senates and fundamentally alter the amendment authority through a faculty referendum using only the simple majority power it sought to restrict. We recommend acknowledging the valid increase in the Senate vote threshold (to two-thirds of those present and voting) while voiding the referendum requirement, the self-entrenchment provision, and any requirement for two-thirds of the *entire* Senate. The current committee restructuring proposal should proceed under the original Article V standard. Finally, adopting the proposed asymmetric meta-rule for future amendments to Article V will provide clarity and ensure future changes to our foundational rules are made with appropriate deliberation and support.
