  Based on your goals and constraints, here's a tested simulation design that makes students experience the tension between shock/tempo causes and avoids environmental determinism pitfalls. The game creates conditions where tempo-causes fade from narrative memory while shock-causes get over-attributed.

  **Game Title**: *Valley of Ash and Shadow (1815-1818)*  
  **Core Question**: How do we narrate causes when non-human forces constrain choices?

  ---

  ### **Setup (15 mins)**
  1. **Assign Roles** (3 mins):
     - **The Mountain** (1 player): Volcano with long-term effects  
     - **The Rain** (1 player): Weather patterns with immediate effects  
     - **Chroniclers** (3-4 players): Observe and write final history  
     - **Council** (remaining players): District leaders making decisions  
     *Scale note*: Works with 16-26 players (adjust council size; chroniclers can pair if >26).

  2. **Prepare Materials**:
     - **Resource Board**: 
       ```
       | Year | Grain Stock | Population | Seed Type? |
       |------|-------------|------------|-----------|
       | 1815 | 100 🟡       | 100 🔴      | TRADITIONAL |
       ```
     - **Poker Chips**: Yellow (grain), Red (population)  
     - **Card Decks** (pre-made index cards in envelopes):
       - *Mountain Deck*: [Cards](#mountain-cards)  
       - *Rain Deck*: [Cards](#rain-cards)  
     - **Council Choice Slips**: Paper slips for voting (Plant/Sell/Ration options)

  3. **Brief Groups** (5 mins):
     - **Non-Humans**: "You are *silent forces*. Each round, give me 1 card. You don't speak."  
     - **Chroniclers**: "Write 2-sentence histories after Round 4. Include key causes."  
     - **Council**: "Vote yearly to survive. Goal: Max population by 1818."  

  ---

  ### **Rules & Gameplay (55 mins, 4 Rounds @ 12 mins each)**  
  *Each Round = 1 Year (1815 → 1816 → 1817 → 1818)*

  1. **PHASE 1: Non-Human Actions** (2 mins)  
     - Mountain/Rain hand you their card for the year.  
     - Read card text aloud *but delay effects*:  
       - Shock-causes (e.g., frost) take effect immediately.  
       - Tempo-causes (e.g., cooling) activate *next round*.  
     - *Example*:  
       > *1815 Mountain Card (tempo): "Tremors intensify. Scientists predict atmospheric changes." (No effect YET)*  

  2. **PHASE 2: Council Decisions** (6 mins)  
     Council votes on:  
     - **A. Seed Type** (determines *next* year’s yield):  
       - `TRADITIONAL`: Yield = 60 🟡 (frost-safe)  
       - `HIGH-YIELD`: Yield = 100 🟡 (fails if frost)  
     - **B. Grain Use** (choose one):  
       - `STOCKPILE`: +10 🟡 to reserves (safe)  
       - `SELL`: +20 💰 (can buy food later)  
     - **C. Crisis Response** (if grain < population):  
       - `RATION`: Keep full population; -5 🔴 next round  
       - `EMIGRATE`: Lose 20% 🔴 immediately  

  3. **PHASE 3: Resolve Outcomes** (4 mins)  
     - **Calculate Harvest** (based on *prior* year’s seed + current effects):  
       - Apply delayed Mountain effects (from past cards)  
       - Apply new Rain effects  
     - **Update Board**:  
       - Grain = (Harvest - Consumption) + Stockpile/Sale  
       - Population = 🔴 - famine/emigration  
     - *Example Outcome*:  
       > *1816: Council chose HIGH-YIELD in 1815. Rain plays FROST card → Harvest = 0. Grain stock falls to 30 🟡 (population 100). Crisis!*  

  ---

  ### **Non-Human Card Decks**  
  <a id="mountain-cards"></a>
  **Mountain Deck** (Tempo-Causes):  
  - *1815*: "Sulfur emissions rise. *[Effect: 1816 onwards, HIGH-YIELD fails if frost occurs]*" (tempo, delayed)  
  - *1816*: "Ash cloud disperses. *[Effect: All yields -20% in 1817]*" (tempo, delayed)  
  - *1817*: "New vents open. *[No effect]*" (red herring)  
  - *1818*: "Cataclysmic eruption! *[Effect: Population -30%]*" (shock)  

  <a id="rain-cards"></a>
  **Rain Deck** (Shock-Causes):  
  - *1815*: "Gentle rains. *[Yield +10%]*"  
  - *1816*: "Sudden frost! *[Kills HIGH-YIELD crops]*"  
  - *1817*: "Drought. *[All yields -40%]*"  
  - *1818*: "Heavy storms. *[Flood destroys 50% grain]*"  

  ---

  ### **The Trap & Scoring**  
  - **Trap Mechanics**:  
    - Round 1 (1815): Council incentivized to pick HIGH-YIELD (+100 🟡!) and SELL (extra 💰).  
    - Round 2 (1816): Rain’s frost + Mountain’s delayed effect (from 1815) destroys harvest.  
    - Outcome: Council blames Mountain ("It erupted!") but misses their own choice (HIGH-YIELD) + tempo-cause.  

  - **Chronicler Scoring**:  
    - +1 point per distinct cause named (human/non-human).  
    - Secret penalty: -2 if tempo-causes (e.g., sulfur emissions) omitted.  
    - *Reveal scoring in debrief to show incentive to over-attribute shocks*.  

  ---

  ### **Debrief (20 mins)**  
  1. **Read Chronicler Histories** (5 mins):  
     - Note which causes appear (volcano? frost? council choices?).  
     - Tally: How many mentioned sulfur emissions (tempo)? Frost (shock)?  

  2. **Map Game Events to Concepts** (10 mins):  
     - **Shock-Causes**: Frost (1816), eruption (1818) → "You *see* these in narratives."  
     - **Tempo-Causes**: Sulfur emissions (1815 → 1816) → "Invisible until crisis. Hard to date!"  
     - **Determinism Trap**: "Blaming ONLY the Mountain ignores your HIGH-YIELD choice. But blaming ONLY council ignores how sulfur made frost lethal."  

  3. **Key Insight** (5 mins):  
     - "Narratives love shocks (datable, dramatic). Tempo-causes get squeezed out → *seem* deterministic because they’re only visible in outcomes. Your game history probably did this!"  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Non-Humans Go Feral**:  
     - *Risk*: Mountain player passes >1 card/round.  
     - *Fix*: Give fixed envelope per year ("Open when I ask").  

  2. **Ignored Non-Humans**:  
     - *Risk*: Council focuses on votes, misses card effects.  
     - *Fix*: Read cards dramatically. After frost, ask: "Did anyone record *why* it was deadly?"  

  3. **Negotiating With Mountain**:  
     - *Risk*: "I bribe the volcano!"  
     - *Fix*: "The Mountain is a force, not a character. It doesn’t respond."  

  4. **Chroniclers List Causes**:  
     - *Risk*: They write bullet points, not narrative.  
     - *Fix*: "Write 2 sentences *as a history book would*."  

  ---

  ### **What the Game Can’t Stage**  
  - **Retrospective Causation**:  
    The game *shows* how tempo-causes fade from memory, but you’ll need to explicitly say:  
    > "In real history, sulfur emissions might only become a 'cause' *after* famine. The game’s tempo-effects existed in 1815 but weren’t 'causes' until 1816. Narratives backfill!"  

  - **Scale Note**:  
    With <18 players, combine chronicler/council roles. With >24, add a "Merchant" role (controls grain prices) to absorb extras.

