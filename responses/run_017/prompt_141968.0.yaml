  **Why This Works**: Students *feel* the shock/tempo divide when tempo-causes (sulfur) become visible only through shocks (frost). The scoring trap mirrors real academic incentives to name "actors." You’ll get rich debate on agency vs. determinism in debrief. Run it tight, and they’ll leave suspicious of mono-causal narratives. Good luck! 🌋
