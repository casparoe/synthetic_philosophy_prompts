prompt: |-
  I'm in a seminar on the ethics and economics of markets, and I keep getting stuck on one feature of rent regulation that we haven't discussed. In many rent-regulated systems the protected tenancy is heritable but not saleable: a family member already living in the home can succeed to it and go on paying the controlled rent, but the sitting tenant cannot sell the right to occupy at that rent to anyone else, and landlords are barred from taking payment to hand a regulated tenancy over. Yet the gap between the controlled rent and the market rent is plainly worth money — a tenant who would happily move somewhere smaller is, in effect, sitting on an asset she is not allowed to cash in.

  What view of the tenant's interest does that combination presuppose? It seems to treat occupancy as something like a personal status attached to a household rather than as property — but then why is the interest transmissible at all, and why to a co-resident specifically rather than to whoever the tenant chooses? Suppose a city made the regulated tenancy freely transferable, so that the tenant could sell the right to renew at the controlled rent to any buyer at any price. What theory of the tenant's interest, and of what rent control is for, would that rule express, and what would it lose? And is the actual rule — heritable but inalienable — strictly committed to one story about that interest, or is it also compatible with views that treat rent control as a subsidy to households? Please answer in no more than 400 words.
reasoning: |-
  Okay, the user is in a seminar on the ethics and economics of markets, specifically stuck on rent regulation features. They note that in many rent-regulated systems, protected tenancy is heritable but not saleable. A family member already living there can succeed the tenancy at controlled rent, but the tenant can't sell that right. The user questions what view of the tenant's interest this presupposes. They wonder why it's transmissible only to co-residents and not freely transferable. They also ask about the implications if tenancy were freely transferable and whether the current rule is compatible with rent control as a household subsidy.

  First, I need to address the core issue: the heritable but inalienable nature of rent-regulated tenancies. The user is pointing out a contradiction. Why can the right be passed to family members but not sold? This seems to treat occupancy as a personal status tied to a household rather than a property right. But if it's a personal status, why is it transmissible at all? And why only to co-residents?

  The current rule suggests that the regulated tenancy is viewed as a right tied to a specific household's need for stability and shelter. It's not a market asset but a form of security. Allowing inheritance to co-residents maintains continuity for the household without commodifying the right. If tenants could sell the right, it would turn the regulated tenancy into a tradeable asset, which contradicts the goal of providing affordable housing based on need. Selling would allow tenants to profit from a public subsidy, potentially leading to windfalls and reducing the availability of regulated units for those in need.

  The user asks what theory the actual rule expresses. It reflects a view that rent control protects occupancy as a use-value for residents, not an exchange-value. The interest is in-situ security, not a monetizable asset. Transmission to co-residents ensures the household's continuity without market exploitation. If the tenancy were freely transferable, it would treat the controlled rent as a tradeable entitlement, aligning with a property-rights view. However, this risks speculation, reduces unit turnover for needy households, and might inflate sale prices, undermining affordability goals.

  Is the heritable but inalienable rule compatible with seeing rent control as a subsidy? Yes, because the subsidy is directed to the household occupying the unit. Inheritance extends the subsidy to the existing household members, maintaining its purpose. Allowing sales would divert the subsidy to whoever pays the most, detaching it from the original intent of housing security. The rule balances providing long-term stability while preventing commodification that could distort the housing market.
answer: |-
  The heritable but inalienable rule reflects a specific understanding of the tenant's interest: **occupancy as a personal, use-based right tied to the resident household's need for stable shelter, not as a fungible market asset.** It prioritizes *security of tenure and continuity* for the household unit already established in the home.

  *   **Why Transmissible?** To prevent disruption upon the original tenant's death, recognizing the household's established roots and need for continued shelter. It's about protecting the *existing occupants* from displacement.
  *   **Why Only Co-Residents?** Limiting succession to existing household members reinforces that the right is attached to the *current residential unit*, not the individual tenant as a bearer of a tradeable claim. It prevents the creation of a market for "tenancy rights" separate from actual occupancy need.

  **If tenancy were freely transferable:**
  This would express a **property-rights view** of the tenant's interest. The controlled rent entitlement becomes a separate, monetizable asset. The theory shifts: rent control becomes a *subsidy captured by the tenant*, which they can capitalize on by selling. The primary goal might be seen as wealth transfer *to the incumbent tenant* rather than ensuring long-term affordable occupancy.

  **What the actual rule loses:**
  1.  **Tenant Flexibility:** It prevents tenants from extracting the asset's value to fund moves or other needs.
  2.  **Potential Efficiency:** A market could theoretically allocate the tenancy to whomever values it most (though likely the wealthy).

  **Compatibility with the Subsidy View:**
  The heritable/inalienable rule **is compatible** with viewing rent control as a subsidy to households. The subsidy is targeted to *support the ongoing occupancy of a specific household unit* in a specific location. Inheritance extends this subsidy to the existing household members upon death. Selling the right would redirect the subsidy to a new, potentially wealthier buyer who purchases the entitlement, detaching it from the original household's need and location. The rule ensures the subsidy remains tied to the protected occupancy, even if the specific individuals within the household change through life events.

  In essence, the rule seeks to provide long-term residential stability for households without commodifying the affordability entitlement itself, balancing protection against market exploitation. It views the tenant's core interest as *in-situ security*, not a liquid asset.

