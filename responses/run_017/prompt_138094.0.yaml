prompt: |-
  Hi — I volunteer at a community radio station, and I'm one of three people rewriting our language policy. Right now the whole thing is one line: no slurs, context is irrelevant, you get pulled off air. I keep hitting cases where I don't believe that, and I'd rather figure out what I actually think before trying to write something other people can apply. I'll use labels (the n-word, the f-slur, the slur for traveller/gypsy communities) rather than typing the words out.

  My verdicts, going on gut:

  1. A news reader reporting that someone spray-painted the n-word on a synagogue — fine, obviously.
  2. The same news reader saying the whole word in that report when the n-word would have done, apparently just because they like saying it — not fine. I'm a bit surprised I think this, since nothing about the content of what they said changed.
  3. A DJ reading out a listener's letter: he shouted [slur] at me on the bus — fine.
  4. Playing the original recording of an old track that has the n-word in it — fine, and I don't want it bleeped.
  5. A white presenter in the studio singing along to the reclaimed -a form on a track by a Black artist — not fine. This is the pair I can't reconcile: in 4 and 5 nobody is being addressed, nobody is expressing contempt, the words on the record are identical, and I still land in different places.
  6. Two Black callers using the -a form to each other affectionately, on air — fine.
  7. A white caller using it to a Black caller he's friendly with, imitating 6 exactly — not fine, and not fine by a mile.
  8. A gay comedian calling himself the f-slur in his own set — fine. A straight comedian calling that same comic the f-slur in what he insists is affection — not fine.
  9. A 12-year-old caller who repeats a slur they heard in a song and clearly has no idea what it means — I don't want to say fine, and I don't want to treat it like 7. It feels like a different thing: not an insult but a mess that needs cleaning up.
  10. An exchange student who uses the ordinary word in their language for Roma people, which happens to be the slur in English — same shape as 9 for me: not fine, but a correction, not a ban.
  11. A bigot shouts a South Asian slur at someone he's mistaken for South Asian, who's actually Lebanese — I still count that as slurring, and I think it wrongs the person he shouted at, even though they aren't in the group the word targets.
  12. Someone typing slurs into a private group chat of fellow bigots, where nobody from any targeted group ever sees it — I still want it to count, and I still want us to be able to kick someone off the schedule for it, even though nobody was addressed and nobody was hurt.
  13. A British DJ using spaz to mean clumsy, on a show streamed mostly to the UK but also to the US — the one I go back and forth on. Some days: it's just his dialect, he's insulting nobody. Other days: we're on the internet, and for a chunk of the audience it lands as a slur.
  14. Someone using an old slur for the Welsh that I'd bet 90% of the audience has never heard — I basically don't care, which worries me, because on any theory I can think of its the same kind of word as the others.
  15. A Black caller using a crude term for white people — not fine under our rules, but I don't think it's the same kind of thing as an anti-Black slur, and I can't say why without either appealing to power and history (which then makes the wrong in the other cases depend on facts about society rather than about the utterance) or just stipulating it.

  So: is there one principle that gets these? Or am I obviously tracking three different questions — is that a slur, was it wrong, should we sanction it — and fooling myself by asking only one? Give me the principle, or the smallest set of them, stated precisely enough that I could actually apply it on a Tuesday night, and tell me which of my cases forces each clause. Then tell me which verdicts it can't keep: I'd rather lose 14 than 5, and I'd rather lose 13 in either direction than lose 11, but tell me if that ordering is even coherent. And run it on three I don't have verdicts for: (a) a straight actor playing a gay character in a period drama saying the f-slur in character, in our drama slot; (b) a caller who says the n-word in the middle of explaining why nobody should say it, unprompted; (c) a caller from the group targeted by slur S using S with real contempt about another member of that group.

  Also: if the honest answer is that the one-line no-context rule is the right rule for a station even though it's wrong about the phenomenon, say that, and say what the gap between the two is doing.
reasoning: |-
  Okay, the user is part of a community radio station team rewriting their language policy. They've listed 15 cases where their gut reactions conflict with their current one-line rule ("no slurs, context irrelevant"). They want a consistent principle to apply, one that's practical for real-time decisions. 

  First, I need to unpack their core struggle: their intuition recognizes nuances their current rule ignores. Cases like news reporting (1) vs. gratuitous use (2), or reclaimed terms by in-group (6) vs. out-group (5/7), show context matters deeply. But they also want actionable guidelines—no philosophy essays during live broadcasts.

  Hmm, their hesitation about "power/history" in case 15 is telling. They sense slurs aren't just "bad words" but tools of oppression, yet worry about making rules depend on sociology lectures. The gap between their nuanced moral intuition and need for clear rules is the real challenge.

  Breaking it down: their cases cluster around three axes:
  - **Intent**: Malice (7) vs. ignorance (9) vs. reclamation (6)
  - **Impact**: Harm to targets (3,11) vs. collateral offense (13)
  - **Authority**: Who "owns" the term? (5,6,8)

  Their rejected solutions hint at what won't work:
  - Pure intent-based rules fail cases like 12 (no malice but still sanctionable).
  - Impact-only struggles with 4 (historical recording) vs. 5 (singalong).
  - "Group membership" fixes 5/6/7 but crashes into 8 (straight comic affection? nope) and 15 (is "cracker" equivalent? no).

  The reconciliation might be **"licensed use"**: no slurring unless explicitly authorized by context *and* community. News? Authorized by public interest. Reclamation? Authorized by in-group membership. Historical art? Authorized by preservation. But singing along? No license—you're coopting, not reporting or reclaiming. 

  Testing on their unresolved cases:
  - (a) Period drama: licensed by artistic context, like case 4.
  - (b) Unprompted anti-slur lecture: unlicensed—why say it? Use "n-word."
  - (c) In-group contempt: licensed to say, but sanctionable for hate speech. Tricky! 

  For the rule: "No slurs except when contextually necessary *and* delivered with explicit respect for targets." Then list exemptions: news, quotes, art, in-group reclamation. Ban all other uses. Add "correct, don't punish" for ignorance cases (9,10).

  Sacrifices: Case 14 (obscure slur) might slide under "no harm" but include it to avoid loopholes. Case 13 ("spaz")—ban if US listeners might hear it; consistency > dialect. 

  Finally, admit the gap: the rule is a heuristic. It'll over-block (e.g., bleeping historical songs) but under-blocking risks harm. Their one-liner is wrong descriptively but right administratively—unless they build robust context into the policy. 

  They need clear examples in the policy document. "Like case 1, not case 2" will help DJs more than abstract principles.
answer: |-
  Here's a distilled framework based on your intuitions, designed for practical application. It prioritizes **harm prevention** and **community trust**, balancing principle with operational clarity. The core idea: **Slurs are prohibited unless their use is *contextually licensed* to serve a legitimate purpose that outweighs potential harm.**

  ### The Principle (For Your Policy Draft)
  > **Prohibition:** No person may use slurs (defined as terms historically weaponized to dehumanize, threaten, or subordinate groups based on identity) on air, in station communications, or in public-facing roles.
  > 
  > **Exceptions:** Use is permitted *only* if:
  > 1. **Necessary Function:** The word is essential to a documented *public service purpose* (e.g., news reporting, eyewitness testimony, academic discussion, or critical artistic preservation), **AND**
  > 2. **Minimal Harm:** It is delivered with *clear contextual signaling* (e.g., "a graffiti tag reading...", "a caller reported being called...") that dissociates the station/user from endorsement, **AND**
  > 3. **No Gratuitousness:** The full word isn't used if a widely recognized abbreviation (e.g., "N-word") or description suffices.
  > 
  > **Reclamation Exception:** Members of a targeted group may use reclaimed slurs referring to *themselves or their in-group community* with affection/solidarity. Outsiders *never* qualify for this exception.
  > 
  > **Sanctions:** Violations result in immediate review. Outcomes range from education (for ignorance/accidents) to suspension/removal (for malice, recklessness, or patterns of harm). Intent ≠ absolution; impact matters.

  ### How It Handles Your Cases
  | Case | Verdict | Why (Applied Principle) |
  |------|---------|-------------------------|
  | 1    | ✅ Fine | **Necessary Function** (news), **Minimal Harm** (contextual signaling). |
  | 2    | ❌ Not Fine | Violates **No Gratuitousness** & **Minimal Harm** (no justification for full word). |
  | 3    | ✅ Fine | **Necessary Function** (eyewitness quote), **Minimal Harm** (contextual framing). |
  | 4    | ✅ Fine | **Necessary Function** (artistic preservation), **Minimal Harm** (historical artifact, not endorsed). |
  | 5    | ❌ Not Fine | **Reclamation Exception** applies *only to in-group*. Outsider use is appropriation, not licensed. |
  | 6    | ✅ Fine | **Reclamation Exception** (in-group, affectionate). |
  | 7    | ❌ Not Fine | Outsiders **never** qualify for reclamation. High harm risk. |
  | 8a   | ✅ Fine | **Reclamation Exception** (in-group, self-referential). |
  | 8b   | ❌ Not Fine | Outsider use, regardless of claimed intent. No license. |
  | 9    | ❌ Not Fine (but correct) | Violates prohibition (slur aired). Sanction = **education/correction**, not ban. |
  | 10   | ❌ Not Fine (but correct) | Violates prohibition (slur aired). Sanction = **education/correction**. |
  | 11   | ❌ Not Fine | **Harm-based view**: Slur's *function* (dehumanizing attack) matters, not target's identity. |
  | 12   | ❌ Not Fine | **Community trust**: Private bigotry predicts public harm. Station reputation risk. |
  | 13   | ❌ Not Fine | **Harm Prevention**: Global audience → term *functions* as a slur for US listeners. No license. |
  | 14   | ❌ Not Fine | **Principle Integrity**: If verified as a slur, inclusion risks normalization. "Unknown" ≠ harmless. |
  | 15   | ❌ Not Fine | **Prohibition applies universally**. *But*: Sanction severity may differ (lesser harm ≠ no harm). |

  ### Unresolved Cases Tested
  - **(a) Straight actor in drama says f-slur:**  
    ✅ **Fine.** **Necessary Function** (artistic integrity of period piece), **Minimal Harm** (contextual signaling as historical).
  - **(b) Caller says n-word "unprompted" while condemning it:**  
    ❌ **Not Fine.** Violates **Necessary Function** & **No Gratuitousness** – no justification for full word; use "N-word." High harm risk.
  - **(c) In-group caller uses slur with contempt for own group:**  
    ❌ **Not Fine.** **Reclamation Exception** requires affection/solidarity. Contempt turns it into **internalized bigotry** – no license.

  ### Sacrifices & Coherence
  - **You lose Case 14 (obscure slur):** Principle demands consistency. If it’s a slur, it’s banned. **Why sacrifice?** Prevents loopholes ("But nobody knows it!") and aligns with harm-prevention logic (even rare slurs can spread).
  - **Case 13 ("spaz") banned globally:** You prioritized harm prevention (US listeners) over dialect. **Coherent?** Yes – internet = global audience, so impact outweighs intent.
  - **Case 15 (anti-white term) banned:** You lose the "not same as anti-Black slur" nuance. **Why?** Operational clarity. The policy bans *all* slurs; enforcement can scale sanctions by harm severity (e.g., education vs. removal).

  ### Why Your One-Line Rule is Tempting (But Wrong)
  - **Gap:** The rule is **administratively simple** but **ethically incomplete**. It ignores legitimate uses (news, art, reclamation) and nuances (ignorance vs. malice).  
  - **Reality:** For a community station, **trust > efficiency**. Listeners harmed by slurs won't distinguish between "gratuitous" and "policy simplicity." A context-aware rule, with clear examples, builds accountability.  
  - **Compromise:** Keep the *default* strict ("no slurs"), then *explicitly list exceptions* (e.g., "permitted only in news quotes, documented testimony, or reclaimed in-group use"). Train staff on examples.

  ### Final Recommendation
  Adopt the 3-part framework above. **Document it with your case studies** (e.g., "Like Case 1, not Case 2"). This:
  - Anchors in harm reduction,
  - Allows critical exceptions,
  - Denies loopholes to bad actors,
  - Treats ignorance differently from malice,
  - And forces *you* to define "slur" upfront (e.g., "terms listed by [credible source] + station review").  

  You’ll make tough calls (e.g., banning obscure slurs), but gain a defensible, community-respecting system. If consensus fails, *then* fall back to the one-line rule – but it’s worth fighting for nuance.
