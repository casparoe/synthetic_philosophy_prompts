  First, I need to map the core disagreement. The Strawsonian ("her") position is that responsibility equals fittingness of reactive attitudes (resentment, gratitude etc.), which are constitutive of relationships, with fittingness determined by quality of will, not causal history. The incompatibilist ("him") position demands ultimate sourcehood - being an uncaused cause - which determinism precludes, and sees the reactive attitudes approach as failing to capture desert.

  The user's request is highly structured: (1) Agreed claims covering reactive attitudes' phenomenology, desiderata for accounts, and non-disagreements; (2) Disagreements table with neutral/her/his formulations; (3) Three cruxes with cases, predictions, and costs.

  For the agreements section: Both clearly accept Strawson's basic phenomenology - reactive attitudes are real, woven into relationships, modulated by excuses denying ill will. Neither disputes determinism's unproven status or the reality of participant/objective stance switching. Common ground also exists on what a theory must explain: our responsibility practices' persistence and the pull of incompatibilist intuitions.

  The disagreements table needs razor-sharp formulations avoiding loaded terms. Key splits: (a) Whether responsibility requires ultimate sourcehood (his yes, her no); (b) Whether "fitting" entails desert (her: fittingness is primitive; him: separate from desert); (c) Scope of reactive attitudes (her: constitutive; him: contingent).

  Now the cruxes. First is the desert question: Is her "fittingness" just about psychological coherence/social utility, or does it imply normative desert? Partly verbal (they mean different things by "desert"), but substantive in whether normativity is grounded in practices or requires external anchors.

  For manipulation cases: Calibration (undetectable moral enhancement) tests if quality of will suffices without ultimate control. Her account likely says responsible; his says no desert. Vale (reactive-attitude-free upbringing) probes whether such attitudes are necessary for responsibility. Her account must predict breakdowns in stress/relationships to avoid falsification; his can accept Vale adults as decent but not deserving.

  Scope matters: Disagreement sharpens in hard cases (psychopathy etc.). Neither requires universal reactive attitudes, but her needs them to be non-optional for "our" form of life.

  I'll flag refinements: For her, emphasizing that fittingness is practice-immanent normativity; for him, clarifying that "desert" means pre-institutional moral property. Vale might be underdescribed - I'll note possible empirical tweaks but retain it as specified.

  Confidence assessment: Agreed claims about phenomenology are solid; least sure is whether Vale adults could sustain relationships without reactive attitudes - that needs empirical study.

  The output will strictly follow the requested structure without citations, using clear American English. This should give the reading group a framework to move beyond stalemate.
answer: |-
  ## Joint Statement on Moral Responsibility & Reactive Attitudes

  **Section 1: Agreed Claims**

  Both parties agree on the following points regarding the reactive attitudes, the demands on an account of responsibility, and the boundaries of their disagreement:

  1.  **Phenomenology of Reactive Attitudes:** Reactive attitudes (e.g., resentment, gratitude, indignation, hurt feelings, forgiveness, guilt) are distinctive, pervasive, and deeply felt human psychological responses to the perceived attitudes (quality of will) of others manifested in their conduct towards us or others. They are not mere cool judgments.
  2.  **Role in Relationships:** These attitudes are not merely optional additions to interpersonal relationships (like friendship, love, collegiality, or even basic cooperation); they are partly constitutive of the *participant stance* inherent in such relationships. Engaging in these relationships typically involves holding oneself and others open to these attitudes.
  3.  **Nature of Excuses & Justifications:** Standard pleas like "I didn't mean to," "It was an accident," "I couldn't help it," or "I had no choice" function primarily by denying that the agent manifested a *bad quality of will* (e.g., ill-will, indifference, disregard) towards the affected party. When successful, they mitigate or eliminate the *fittingness* of negative reactive attitudes like resentment.
  4.  **Desiderata for an Account:** A satisfactory account of moral responsibility must:
      *   Explain the central role and persistence of the reactive attitudes in human life and relationships.
      *   Explain the powerful intuitive pull of incompatibilist concerns (the worry that determinism might undermine responsibility).
      *   Account for our practices of holding responsible, including excuses, justifications, and punishment/blame.
  5.  **Non-Disagreement on Determinism:** Neither party asserts that causal determinism has been established as true. The disagreement is conditional: *If* determinism is true, does it threaten moral responsibility?
  6.  **Non-Disagreement on Usefulness/Pointlessness:** Both agree the reactive attitudes have real psychological and social functions (e.g., regulating behavior, sustaining norms, expressing valuations of persons). Neither holds them to be pointless or optional *within the context of ordinary human interpersonal life as we know it*.
  7.  **Non-Disagreement on Participant/Objective Stance:** Both accept Strawson's core observation that humans fluidly move between the participant stance (involving reactive attitudes) and the objective stance (viewing others as objects to be managed, explained, treated, or cured) depending on context and relationship. Both agree these are genuine, distinct, and practically necessary modes of engagement.

  **Section 2: Residual Disagreements: Neutral Formulations vs. Preferred Versions**

  | Neutral Formulation (Signable by Both)                                       | Her Preferred Formulation (Signable by Her)                                                                 | His Preferred Formulation (Signable by Him)                                                                                              |
  | :--------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. What is the core condition for being morally responsible?**             | To be morally responsible is to be a fitting target of the reactive attitudes.                              | To be morally responsible is to be an ultimate source of one's choices and actions in a way incompatible with causal determinism.        |
  | **2. What does the "fittingness" of reactive attitudes entail?**             | Fittingness is a sui generis normative status grounded in the quality of will manifested, not reducible to utility or coherence alone. | Fittingness (as she defines it) captures psychological and social appropriateness, but does not necessarily entail genuine moral desert. |
  | **3. Is the participant stance necessary for moral agency/responsibility?** | The participant stance (and its reactive attitudes) is constitutive of the *kind* of moral agency we recognize and engage with. | The participant stance is a contingent feature of *our* moral psychology and social practices, not a necessary condition for moral desert. |
  | **4. What role does causal history play?**                                  | The causal history of an agent's quality of will is irrelevant to the fittingness of reactive attitudes *in itself*. | The causal history (specifically, the presence/absence of ultimacy) is essential for grounding genuine desert and blame/praise worthiness. |

  **Section 3: Cruxes with Cases, Predictions, and Costs**

  **Crux 1: The Desert Question - What Does Fittingness Carry?**

  *   **Neutral Sub-Questions:** Does the "fittingness" of reactive attitudes entail anything beyond the psychological coherence and social utility of holding those attitudes within our form of life? If it does entail something more (e.g., desert), what within the account provides this normative weight?
  *   **Verbal Aspect:** Part of the disagreement is verbal regarding the term "desert." Her uses "desert" synonymously with "fittingness" within the practice. His reserves "desert" for a pre-practice, non-conventional moral property requiring ultimacy.
  *   **Substantive Aspect:** The substantive question is whether the normative force of reactive attitudes (the sense that resentment is *merited*, not just useful) can be fully grounded *only* within the immanent norms of the participant stance practice itself (Her), or whether it *must* point to or depend upon a deeper, non-conventional fact about the agent's metaphysical status (His).
  *   **Case:** Consider resentment felt towards someone who deliberately and maliciously harms you, where no standard excuses apply.
      *   **Her Prediction:** The resentment is fitting (and thus the agent deserves it in the practice-immanent sense) *because* it accurately reflects the malicious quality of will. The normative force ("They *really* deserve my resentment") is fully explained by the internal standards of the participant stance.
      *   **His Prediction:** While resentment might be psychologically understandable and socially useful here, whether the agent *genuinely deserves* it (in the deep moral sense) depends entirely on whether they were the ultimate source of that malicious will. If determinism is true, they don't genuinely deserve it.
  *   **Costs:**
      *   **If Her view loses (fittingness lacks normative weight):** Her account risks reducing responsibility to *mere* psychological propensity and social convention, failing to capture the robust sense of "ought" and "desert" we feel. It might seem like a sophisticated form of moral relativism or subjectivism about responsibility.
      *   **If His view loses (desert requires no ultimacy):** His account risks making genuine responsibility impossible or vanishingly rare (if ultimacy is incoherent or empirically false), rendering core moral concepts like deep desert and ultimate blameworthiness/praiseworthiness empty. It might disconnect moral evaluation from the lived reality of our practices.

  **Crux 2: Manipulation Cases - Calibration & Vale**

  *   **A. Calibration Case (Agent morally enhanced covertly):**
      *   **Her Account Implication:** The agent is morally responsible. Her actions manifest her own quality of will (which is now reliably better), she deliberates normally, and feels guilt appropriately. The *source* of her improved will (the implant) doesn't negate the *current quality* manifested, which is what reactive attitudes respond to. Excuses don't apply.
      *   **His Account Implication:** The agent is *not* ultimately morally responsible/blameworthy/praiseworthy. She is not the ultimate source of her improved will or actions; they are determined by the implant + prior state. She deserves neither special praise nor blame for her good actions caused by the implant.
      *   **Costs:**
          *   **Her cost if wrong:** If Calibration intuitively undermines responsibility (despite good will & normal phenomenology), it suggests her account is *too narrow*, missing a crucial historical/ultimacy condition. The manipulation seems to make her a "puppet" in a relevant way.
          *   **His cost if wrong:** If Calibration does *not* intuitively undermine responsibility, it suggests his ultimacy condition is *too strict* or misidentifies the core of responsibility. It might show quality of will is primary.

  *   **B. Vale Case (Adults raised without reactive attitudes):**
      *   **Her Account Implication & Prediction:** Strawson's claim about the deep roots of the participant stance *is* partly empirical. Her account predicts the Vale adults would *not* function as *full* moral agents *within the participant stance relationships we recognize*. While they might act correctly ("decently"), she predicts:
          *   Under significant stress, conflict, or betrayal within close relationships, they would lack the *internal* resources (guilt, resentment) to navigate the rupture in a way that repairs the relationship *as a participant stance relationship*. They might manage/repair objectively, but the *interpersonal connection* as we know it would be broken or absent.
          *   If genuinely wronged (e.g., betrayed by a friend), they would not feel resentment or expect guilt; they would only see causal harm needing objective repair. The wrong *as a wrong against them personally* wouldn't register affectively/normatively in the same way.
          *   *In short:* They might be "decent" causally responsive mechanisms, but incapable of the *interpersonal depth* involving mutual vulnerability to reactive attitudes that defines our moral relationships. Strawson's stance is deeply rooted *in us* and necessary for *our form* of responsibility.
      *   **His Account Implication:** The Vale adults being "decent" (reasons-responsive, rule-following) tells *only* against the claim that reactive attitudes are necessary for *minimal moral behavior* or *reasons-responsiveness*, which he never claimed. His claim is about *desert*. If they lack the capacity for reactive attitudes, they cannot *participate* in the practice of holding responsible *as we know it*, but this doesn't touch the metaphysical question of whether they *could*, in principle, *deserve* blame/praise *if* they were ultimate sources. Their current state is irrelevant to the *truth conditions* for desert.
      *   **Costs:**
          *   **Her cost if Vale adults thrive interpersonally:** If Vale adults form deep, resilient, norm-governed relationships indistinguishable from ours *without* reactive attitudes, it severely undermines her claim that these attitudes are constitutive of interpersonal relationships *as such*. It suggests the participant stance is merely one contingent psychological toolkit, not fundamental to moral agency. Strawson's claim about deep roots would be empirically falsified *for human moral psychology*.
          *   **His cost?** Minimal *if* "decent" only means behaviorally compliant. His core claim (desert requires ultimacy) is untouched by whether a society uses reactive attitudes or not. However, if Vale adults *also* develop a *non-reactive-attitude-based* but *equally deep and normative* sense of personal obligation, mutual accountability, and "desert-like" concepts grounded in ultimacy, it might challenge him only to clarify that his "desert" isn't tied to *our specific reactive emotions*, but to the underlying metaphysical condition.

  **Crux 3: Scope - Does the Disagreement Shrink to Hard Cases?**

  *   **Neutral Sub-Questions:** How significant is the disagreement when applied to "normal," non-manipulated, non-impaired agents? Does either position require the reactive attitudes to be a universal human trait, or only fundamental to *our* form of moral life?
  *   **Her Position:** The disagreement *persists* even for normal cases because her account sees responsibility grounded in quality of will alone, while his requires ultimacy. However, the *practical implications* are most visible and critical in hard cases (psychopathy, manipulation, severe deprivation). She does *not* require reactive attitudes to be universal in all humans; she argues they are fundamental to the *specific kind* of interpersonal life *we* have and the responsibility practices *we* engage in. Alien moral agents might have different practices.
  *   **His Position:** The disagreement is *fundamental* and applies equally to normal and hard cases. The ultimacy requirement holds universally. He does *not* require reactive attitudes to be universal; they are contingent features of our psychology. What matters universally is whether an agent has ultimacy, regardless of the specific emotional responses used in their moral community (if any).
  *   **Impact of Restriction:** Restricting the debate *only* to hard cases would be unacceptable to both. For Her, it would ignore that her account offers a unified explanation for *all* cases of responsibility based on quality of will. For Him, it would concede that ultimacy isn't necessary for "normal" responsibility, which is his core incompatibilist claim. The disagreement is about the *foundation* of responsibility itself, applicable across the board.

  **Note on Vale Case:** While specified clearly, the Vale case's key empirical prediction (how they handle interpersonal stress/betrayal) is underspecified in the prompt regarding *what counts as equivalent depth*. This is inherent and necessary – it's the crux of Her's prediction. To make it slightly more informative, one could specify: "When a Vale-adult's closest companion deliberately lies to them for personal gain, causing significant emotional and practical harm, they experience sadness and recognize the causal harm/broken rule, but report no feelings of betrayal, resentment, or anger *directed at the companion as a responsible agent*, and do not expect the companion to feel guilt or offer apology; they focus solely on damage repair and future risk mitigation."

  **Confidence in Agreed Claims:**

  *   **High Confidence:** Claims about the phenomenology and role of reactive attitudes in *our* relationships (1, 2, 3), the acceptance of the participant/objective distinction (7), the non-disagreement on determinism's status and the usefulness of reactive attitudes (5, 6). These are well-supported by observation and Strawson's core description.
  *   **Moderate Confidence:** The desiderata (4) – particularly explaining the pull of incompatibilism – is agreed upon but complex.
  *   **Least Confident Claim:** **Agreed Claim 3 (Nature of Excuses).** While clearly describing the *standard* excuses, this claim might be challenged by hard cases like global manipulation (Calibration) or psychopathy where the *capacity* for a normal quality of will is absent, not just its manifestation in a specific act. Is "I was manipulated since birth" analogous to "I didn't mean to"? **What would settle it:** Careful analysis of whether pleas about manipulation/psychopathy function *exactly* like standard excuses (denying ill-will *in the act*) or instead challenge the *agent's status* as a participant, pointing to a different kind of condition. This touches directly on the Vale case implications.
