prompt: |-
  I don't have any academic background — I work in insurance claims and I moderate a neighborhood Facebook group — but I keep walking into the same kind of argument, and what I want is a tool for it rather than a reading list. I have no library access, so please don't send me toward papers or authors or titles; I need something I could actually run at a kitchen table. The shape is always the same: two people agree on every fact anyone could check, agree that they agree, and still won't stop. My brother-in-law and I went round for an hour on whether his sourdough starter is alive, having already settled everything about metabolism, reproduction, and cells. Our group burned a whole meeting on whether the vacant lot on Fourth Street counts as blighted, which matters because the wording of a city grant turns on it. And when I read online that enormous old questions — whether numbers exist, whether there is really a table there in addition to the particles — might be nothing but disputes about words, I can't tell whether that's a deep point or a way of changing the subject.

  So here's the ask: write me the specification for a test that tells you whether a disagreement is merely verbal, meaning a clash of meanings dressed up as a clash about the world, or genuinely substantive. The purpose fixes the standard: this has to be usable by the people having the argument, in real time, with no philosopher in the room, on disputes where the facts are already settled. Give me each requirement together with the case that motivates it — a case I could actually hand to someone — and why the test is broken without it. What it must handle: disagreements that survive after both sides stipulate the same definition; cases where one person is simply using the word incorrectly rather than using it differently; disputes about where to draw a line on a continuous scale, like whether a lot is blighted or a room is clean; terms whose meaning is fixed in advance by a contract or statute; disputes about things everyone agrees don't exist; and cases where the two sides are covertly arguing about which meaning we ought to adopt instead of about the facts. What it must not do: rule everything verbal just because the parties agree on the evidence, or treat a verdict of verbal as the same verdict as pointless. It also has to say what is left of a dispute once it is declared verbal, whether the real argument has moved to which usage we should adopt, and whether the test should give the same verdict for the sourdough case and the existence-of-numbers case or whether the stakes are allowed to change the answer. Mark which requirements are non-negotiable for my purpose and which are preferences that someone with different aims could reasonably drop.

  The part I most want is the tensions. I suspect there is a real conflict between requiring that the verdict depend only on what the two speakers mean and what facts they have, and requiring that the test never dissolve a dispute whose classification carries money or legal consequences, but tell me if there is a worse pair, and if some subset of the list cannot be satisfied together then say plainly that the specification itself has a hole in it. Then: which single requirement does the most work in knocking out the obvious candidate tests — including the one my friend keeps proposing, where you ask whether each side would take a small bet on their claim — and one paragraph on how the two approaches I can picture hold up against the list, the one where you replace the contested word with a made-up word and see whether the argument survives, and the one where you say the disagreement was really about which usage to adopt all along. No scorecard beyond that paragraph; the criteria are what I am paying for.
reasoning: |-
  Hmm, the user is dealing with a specific type of recurring argument where people agree on all verifiable facts but still disagree. They work in insurance claims and moderate a neighborhood group, so they need a practical tool, not academic theory. They've given clear examples: sourdough starter being "alive," a vacant lot being "blighted," and philosophical debates like numbers existing.

  The user wants a test specification to determine if a disagreement is merely verbal (about word meanings) or substantive (about actual facts). They outlined strict requirements: must work in real-time without experts, handle cases where definitions are stipulated but disagreement persists, incorrect usage vs. different usage, boundary cases on continua, terms fixed by contracts/statutes, disputes about non-existent things, and cases where the real argument is about which meaning to adopt. It mustn't dismiss all arguments as verbal just because facts are agreed, and must clarify what remains after declaring a dispute verbal. They also want tensions between requirements highlighted, especially between meaning-based verdicts and legal/financial stakes.

  Key challenges: The core tension is between linguistic relativism (meaning determines truth) and institutional realism (external definitions matter). For example, in the blighted lot case, even if both parties agree on all physical facts, the legal definition might make it substantive because the contract's wording carries consequences. This conflicts with the requirement that the test depends solely on speaker meanings and known facts.

  The "common language substitution" test (replacing the contested word with a nonsense word) handles many cases well but fails with boundary disputes (like "clean room") because those involve vagueness in meaning rather than different meanings. The "stipulated definition" test (both parties accept a definition but still disagree) is useful but doesn't address when one party is simply misusing a word. The "metalinguistic pivot" (asking what the argument is really about) is powerful but might not work if parties deny they're arguing about word choice.

  The most critical requirement is "No Definitional Escape Hatch": it prevents parties from weaseling out by claiming they meant something else after facts are settled. This knocks out simple tests like betting on claims because bets can be refused for non-verbal reasons (e.g., pride). For the sourdough vs. numbers cases, the test should give the same verdict (both verbal) because the facts are agreed; stakes shouldn't change the classification, though they affect what to do next.

  Unavoidable hole: When external authorities (like contracts) fix meanings, the test must prioritize those over speaker intentions, contradicting the speaker-centric approach. This is a necessary compromise for real-world usability. The specification flags this tension explicitly.
answer: |-
  Here is a kitchen-table test specification designed for your exact needs. It prioritizes usability, handles your listed cases, and exposes the tensions.

  **The Core Test: The Meaning vs. Reality Probe (MRP)**

  **Procedure:**
  1.  **Stipulate Facts:** Ensure both parties explicitly agree on *all* non-linguistic, verifiable facts relevant to the dispute. Write them down if helpful ("The starter metabolizes sugar, reproduces when fed, contains yeast/bacteria cells", "The lot has 3 ft weeds, broken fencing, 2 dumped tires, no structures").
  2.  **Stipulate Definition (Optional but Recommended):** If a specific definition is crucial (e.g., contract, statute), state it clearly. Otherwise, ask each party: *"Ignoring the word [Contested Word] itself, what specific condition or thing would make you say it applies here? What specific condition or thing would make you say it doesn't?"* Capture both answers clearly (A's Yes/No conditions, B's Yes/No conditions).
  3.  **The Probe Question:** Ask both parties: *"If we discovered a new fact tomorrow that proved, beyond any doubt, that the situation perfectly matches the specific conditions [Party A] requires for [Contested Word], but also perfectly matches the specific conditions [Party B] requires for [Contested Word] to be **false**, would that discovery:*  
      *   *(a) Be logically impossible? (A contradiction)*  
      *   *(b) Force you both to agree on the truth about [Contested Word]?*  
      *   *(c) Change nothing about your disagreement on [Contested Word]?"*
  4.  **Verdict:**
      *   If both answer **(a) "Logically impossible"**: The disagreement is **Substantive**. The parties disagree about what the world *is* like, even potentially beyond current facts.
      *   If both answer **(b) "Force agreement"**: The disagreement is likely **Verbal**. They agree on the underlying reality; the conflict is over mapping words *to* that reality.
      *   If both answer **(c) "Change nothing"**: The disagreement is **Verbal**. They are using fundamentally different meanings, and the word itself is the battleground.
      *   *Mixed Answers*: Indicates confusion or that the test premise isn't accepted. Re-clarify steps 1-3. Persistent mixed answers suggest deeper issues (e.g., one party *is* confused about facts/meaning, or stakes make them resistant).

  **What's Left & The Pivot:**
  *   A **Verbal** verdict means the *original factual claim* ("The starter *is* alive", "The lot *is* blighted") is not the real point of conflict *about the world*. The conflict shifts to: **"Which meaning/definition/boundary of [Contested Word] *should* we use in this context?"** This is a *metalinguistic* or *normative* dispute (about language use, values, priorities, consequences).
  *   A **Substantive** verdict means the disagreement is about the nature of reality itself, even if all *current* evidence is agreed upon. Further investigation might be needed.

  **Requirements & Motivations (Non-Negotiable marked NN):**

  1.  **NN: Facts Must Be Settled First:** *Motivation:* Without this, the test is useless. *Case:* Sourdough starter. Both agree on metabolism, cells, reproduction. Disagreement persists. MRP focuses on the *meaning* of "alive" *given those facts*.
  2.  **NN: Handles Stipulated Definitions (Even if Disagreement Persists):** *Motivation:* Essential for legal/contractual contexts. *Case:* The "blighted" lot grant. Parties agree on weeds, fence, tires. City ordinance defines "blighted" as "over 50% vegetation over 2ft OR visible debris OR structural disrepair". They agree the lot meets "over 50% veg >2ft" and "visible debris" (tires). One still says "not blighted" (arguing intent/spirit). **Probe:** "If we found proof meeting the ordinance's defined conditions *also* perfectly matched conditions you require for 'not blighted', would it be impossible/force agreement/change nothing?" Answer (c) reveals the "spirit" argument makes it verbal *despite* the stipulated definition. The *real* dispute is about interpreting/accepting the definition's scope.
  3.  **NN: Distinguishes Incorrect Use vs. Different Use:** *Motivation:* Common confusion. *Case:* Someone insists a clearly brown object is "red" based on agreed light measurements. Stipulate facts (wavelength). Their "Yes condition" for "red" might be "wavelength between 620-750nm" (correct) but they misapply it, or insist "red" means "looks warm" (different use). **Probe Question (b or c)** forces this out. If they answer (b) ("Force agreement") when presented with wavelength facts contradicting their claim, they admit incorrect use. If they answer (c) ("Change nothing") while holding "looks warm=red", it's a different use.
  4.  **Handles Boundary Cases (Vagueness):** *Motivation:* "Clean room" or "bald" disputes. *Case:* Is a room with a single sock on the floor "clean"? Agree on sock, otherwise spotless. **Probe:** "If we proved the sock's presence perfectly matched your 'clean' conditions *and* perfectly matched your 'not clean' conditions?" Answer (a) "Impossible" is unlikely. Answer (c) "Change nothing" is likely – the disagreement is about where *precisely* to draw the "clean" boundary line on the continuum. **Verbal.**
  5.  **NN: Handles Fixed Meanings (Contract/Statute):** *Motivation:* Legal/financial stakes can't be ignored. *Case:* The "blighted" lot grant again. Requirement #2 handles the *classification*. This requirement ensures the test *acknowledges* the fixed meaning exists and factors into the Probe. The verdict might be "Verbal *about the definition's application*" but the *legal outcome* is fixed by the definition.
  6.  **Handles Non-Existence:** *Motivation:* "Does God exist?" when both agree on lack of empirical evidence. *Case:* "Is the Ether real?" (agreed: no empirical evidence). **Probe:** "If we proved the absence of evidence perfectly matched your 'real' conditions *and* perfectly matched your 'not real' conditions?" Likely answer (c) "Change nothing" – the dispute is about the *meaning* of "real" (e.g., "logically necessary" vs. "empirically detectable"). **Verbal.**
  7.  **NN: Detects Covert Metalinguistic Disputes:** *Motivation:* The core frustration. *Case:* The sourdough starter. After Probe verdict (c) "Verbal", the *real* argument surfaces: "Should we treat this starter *as if* it's alive (with moral weight/care expectations)?" or "Does 'life' require DNA-based evolution?". The MRP forces this pivot by exposing the verbal nature.
  8.  **NN: Does NOT Rule Everything Verbal:** *Motivation:* Avoids nihilism. *Case:* Two scientists agree on *all current data* about dark matter but disagree on its fundamental nature (e.g., WIMPs vs. Axions). **Probe:** "If we proved the data perfectly fits WIMP theory *and* perfectly fits Axion theory?" Answer (a) "Impossible!" reveals a substantive conflict about what the data *implies* for underlying reality.
  9.  **NN: Verbal ≠ Pointless:** *Motivation:* Metalinguistic disputes matter! The MRP explicitly outputs **"Left: Which meaning *should* we use?"** acknowledging the importance of the *next* argument.

  **Tensions & The Hole:**

  *   **The Core Tension:** **Requirement #5 (Fixed Meanings)** vs. **The Probe's Foundation (Speaker Meaning/Agreed Facts)**. This is the worst pair and creates an unavoidable hole.
      *   *Why:* The MRP fundamentally asks what *the speakers mean* by the word and what *they agree on factually*. However, in legal/contractual contexts, the *institutional meaning* overrides individual speaker meaning. The Probe might reveal a verbal dispute between speakers *about* the word, but the institutional definition *settles the practical outcome* regardless. The test can *classify* the interpersonal disagreement as verbal while acknowledging the institutional definition resolves the case (as per #5). This is a tension, not a fatal flaw, but it means the test's verdict ("Verbal") doesn't automatically resolve the *institutional* question – it just clarifies *why* the parties still disagree despite facts and rules.
  *   **Sourdough vs. Numbers:** The MRP should give the **same verdict (Verbal)** for both *if* all relevant non-linguistic facts are agreed upon. The *stakes* (emotional, philosophical, practical) of the metalinguistic argument ("Should we adopt meaning X or Y?") are vastly different, but that doesn't change the *classification* of the original factual claim disagreement. The test isolates the linguistic layer.

  **Knocking Out Obvious Candidates & Your Friend's Bet:**

  *   **The Bet Test (Your Friend):** "Would you bet $5 your starter is alive?" *Fails Requirement #3 (Incorrect vs. Different Use):* Someone might refuse a bet because they doubt their *own* correctness, not because they mean something different. *Fails Requirement #7 (Covert Metalinguistic):* They might bet readily, not realizing their true disagreement is normative. *Fails Requirement #8 (Not Everything Verbal):* They might refuse a substantive bet due to risk aversion, not because it's verbal.
  *   **The "Made-Up Word" Test (Replace word):** *Fails Requirement #4 (Boundary Cases):* If you replace "clean" with "floob", and ask "Is the room floob?", parties will immediately ask "What does 'floob' mean?". The disagreement *about the boundary* simply transfers to defining "floob". It doesn't dissolve. *Fails Requirement #6 (Non-Existence):* Replacing "God" with "Zorp" doesn't clarify if the dispute is about Zorp's existence or the meaning of "Zorp". *Handles Requirement #7 (Metalinguistic) poorly:* It might stop the argument without clarifying *why* or what's left.
  *   **The "It's About Usage" Approach:** This is essentially the **Pivot** the MRP outputs *after* a Verbal verdict. The MRP *uses* this insight but provides a *test* (the Probe Question) to *justify* moving to this stage. Relying *only* on declaring "It's about usage!" upfront often fails **Requirement #8 (Not Everything Verbal)** – parties will (rightly) resist if they feel it *is* substantive. The Probe provides evidence.

  **How the MRP Holds Up:**

  *   **Against Your List:** It directly addresses every Non-Negotiable requirement (#1,2,3,5,7,8,9) through its structured steps and the specific Probe Question. It handles the Preferences (#4,6) effectively by leveraging the Probe's logic. The tension with #5 is explicitly surfaced.
  *   **The Workhorse Requirement:** **Requirement #1 (Facts Settled First)** does the most work. Without it, the Probe Question is meaningless. Every failed candidate test stumbles here first – they don't rigorously enforce that *all* non-linguistic facts are truly agreed upon before probing meaning. The MRP makes this step explicit and foundational.

  **Specification Summary:** The MRP is a practical tool. By forcing parties to articulate the *conditions* for applying the word *given agreed facts*, and then probing if those conditions could *logically* align with opposing claims about the word's application, it cleanly separates disputes about the world from disputes about words. It exposes the core tension with institutional meanings and provides a clear path ("Which meaning *should* we use?") for resolving the verbal disputes that actually matter in daily life.
