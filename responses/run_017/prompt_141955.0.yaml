  But then a=b=0.5, and from NA: a/(1+c)=0.5/(1+c)=0.375 => 0.5=0.375(1+c) => 1+c = 0.5/0.375 = 4/3 => c=1/3.
  Then SA = a*c/(1+c) = 0.5*(1/3)/(4/3) = (0.5/3)*(3/4)=0.5/4=0.125, which is not 0.25.

  So not matching.

  Given the complexity, let me instead set the likelihoods to values that make the arithmetic work, and then justify them by a story.

  We want R1 and R2 to be the same. Let the R2 posterior be our target: 
    NA: 0.375, NB: 0.125, SA: 0.25, SB: 0.25.

  For R1, we need likelihoods L_NA, L_NB, L_SA, L_SB such that:
    0.25 * L_NA / K = 0.375
    0.25 * L_NB / K = 0.125
    0.25 * L_SA / K = 0.25
    0.25 * L_SB / K = 0.25

  From the last two: L_SA / K = 1, and L_SB / K = 1, so L_SA = L_SB = K.

  From the first: 0.25 * L_NA = 0.375 * K => L_NA = (0.375/0.25) K = 1.5K
  From the second: 0.25 * L_NB = 0.125 * K => L_NB = (0.125/0.25)K = 0.5K

  So the likelihoods are: NA: 1.5K, NB: 0.5K, SA: K, SB: K.

  We can set K=2 to make them integers: then L_NA=3, L_NB=1, L_SA=2, L_SB=2.

  Now, we need a story that explains these likelihoods and why the ratios are as above.

  Story: The rescue team has two helicopters, one assigned to North and one to South. However, the helicopter in the North only surveys the North, and the one in the South only surveys the South. They send a message only if the helicopter in the North (when it flies) reports that the proportion of A in the North is 75%. The helicopters may or may not fly due to weather. The helicopter in the North flies with probability 0.8, and if it flies, it conducts the survey and sends the message if the proportion is 75%. The helicopter in the South flies with probability 0.5, but its survey does not affect this message. The message is transmitted by radio. The agent's location affects reception: if she is in the North, she receives the message only if the North helicopter is the one that flew and transmitted, and then reception is guaranteed. If she is in the South, she receives the message only if the South helicopter is flying and acts as a relay, and then reception probability is 0.5. But the content of the message is only about the North.

  But then the likelihood for NA: the probability that the message is sent and she receives it. The message is sent only if the North helicopter flies and its survey shows 75% A. Since the true fraction is 0.5, let the probability that the survey shows 75% A be q. Then the probability for NA: P(North helicopter flies) * q * P(reception|NA) = 0.8 * q * 1.

  Similarly for NB: 0.8 * q * 1.

  For SA: the message is sent (same event: North helicopter flies and shows 75%) and then she receives it only if the South helicopter is flying and then with probability 0.5. So: P(North flies and shows 75%) * P(South flies) * 0.5 = (0.8*q) * 0.5 * 0.5 = 0.8*q*0.25.

  Similarly for SB: 0.8*q*0.25.

  But then we have L_NA = 0.8q, L_NB=0.8q, L_SA=0.2q, L_SB=0.2q.

  We want L_NA=3, L_NB=1, L_SA=2, L_SB=2. This is not matching.

  We need a different story.

  Let me try: The rescue team has a single broadcast. The message is sent if a particular condition about the North is met. The broadcast is received by the agent with a probability that depends on her cell. Specifically:

  - In NA: probability a
  - In NB: probability b
  - In SA: probability c
  - In SB: probability d

  And the condition for sending is a survey of the North that shows 75% A, which happens with probability q given the true state (which is 0.5).

  Then likelihoods:
  - NA: q * a
  - NB: q * b
  - SA: q * c
  - SB: q * d

  We want:
   q*a = 3k
   q*b = 1k
   q*c = 2k
   q*d = 2k

   for some constant k. We can set k=1, then:
   a = 3/q, b=1/q, c=2/q, d=2/q.

   But a,b,c,d are probabilities, must be <=1. So q must be at least 3. But q is a probability of the survey result, which is at most 1. So not possible.

   We could set q=1, then a=3, which is impossible.

   So we must scale down. Remember, the likelihoods are defined up to a constant factor. So we can set the ratios as 3:1:2:2.

   So let L_NA=3p, L_NB=1p, L_SA=2p, L_SB=2p, for some p>0.

   But then the posterior from R1 is:
   NA: 0.25 * 3p = 0.75p
   NB: 0.25 * 1p = 0.25p
   SA: 0.25 * 2p = 0.5p
   SB: 0.25 * 2p = 0.5p
   Sum = 0.75p+0.25p+0.5p+0.5p = 2p
   So posterior:
   NA: 0.75p/2p = 0.375
   NB: 0.25p/2p = 0.125
   SA: 0.5p/2p = 0.25
   SB: 0.5p/2p = 0.25

   Which is exactly the R2 posterior.

   So the likelihoods are: NA:3p, NB:p, SA:2p, SB:2p.

   We can choose p=1/3 to make them probabilities (<=1) by scaling. But since they are likelihoods, they don't have to be probabilities as long as they are proportional. But in the story, they must be probabilities.

   So set p=1/6, then:
   L_NA=3/6=0.5, L_NB=1/6, L_SA=2/6=1/3, L_SB=1/3.

   But 0.5, 1/6, 1/3, 1/3 are between 0 and 1.

   Now, we need a story that explains why the likelihoods are these values.

   Story: The rescue team broadcasts the message from a central tower. The message is sent only if their survey of the North (which they conduct with a fixed procedure) shows that the proportion of A in the North is 75%. The probability that the survey shows 75% given the true fraction of 0.5 is 1/2. (We can choose this arbitrarily, but let's say by a particular sample size and using the binomial distribution, we can get this probability to be 1/2.)

   Additionally, the agent's radio reception depends on her location and the terrain. The broadcast is in a frequency that is affected by a mountain range. The North half is closer to the tower than the South half. Within the North half, sector A has better reception because of fewer obstructions, while sector B has more obstructions. In the South half, both sectors have the same reception quality, but worse than in the North.

   Specifically:
   - If the agent is in NA, the probability of receiving the broadcast is 1.0 (but we have 0.5, so not matching) -> wait, we have L_NA = probability of message being sent times probability of reception given sent. We set the probability of the survey showing 75% to be 1/2. Then L_NA = (1/2) * reception_NA. We want L_NA=0.5, so (1/2)*reception_NA=0.5 => reception_NA=1. Similarly, L_NB=(1/2)*reception_NB=1/6 => reception_NB=1/3. L_SA=(1/2)*reception_SA=1/3 => reception_SA=2/3. L_SB=(1/2)*reception_SB=1/3 => reception_SB=2/3. This is not matching because for SA and SB we have the same reception probability, 2/3, and that matches. But for NA: reception=1, for NB: reception=1/3.

   So the story: the rescue team conducts the survey and sends the message only if the survey shows 75% A in the North, which has probability 1/2 given the true fraction of 0.5. The broadcast is transmitted from a tower in the center. The agent in NA has direct line of sight, so receives with certainty if the message is sent. The agent in NB is in a valley, so receives with probability 1/3. In the South, there is a mountain range that blocks the signal sometimes, so both SA and SB have reception probability 2/3.

   This is realistic.

   So likelihoods:
   L_NA = P(survey shows 75% A) * P(receive | NA) = (1/2) * 1 = 1/2
   L_NB = (1/2) * (1/3) = 1/6
   L_SA = (1/2) * (2/3) = 1/3
   L_SB = (1/2) * (2/3) = 1/3

   And then the posterior by R1 is as desired: NA=0.375, NB=0.125, SA=0.25, SB=0.25.

   Now, R2: by construction, we have defined it to be the same.

   Now for R3: minimum relative information (minimize the sum of q_i * log(q_i / prior_i) over i in cells) subject to the constraint that P(A|North) = 0.75.

   The constraint is: P(NA) / [P(NA)+P(NB)] = 0.75.

   We have no other constraint.

   The prior is uniform.

   So we minimize the relative entropy from the prior, which is the same as maximizing the entropy because the prior is uniform? But no, relative entropy with uniform prior is entropy plus constant, so minimizing relative entropy is the same as maximizing entropy only if there were no constraints. But here we have a constraint.

   We can solve it.

   Let the posterior be: NA: a, NB: b, SA: c, SB: d.

   Constraints:
   a + b + c + d = 1
   a/(a+b) = 0.75  => a = 0.75(a+b) => 0.25a = 0.75b => a=3b.

   So a=3b.

   Then the distribution is: (3b, b, c, d) with 3b+b+c+d=1 => 4b+c+d=1.

   The relative entropy (divergence) is:
   sum q_i log(q_i / prior_i) = a log(a/0.25) + b log(b/0.25) + c log(c/0.25) + d log(d/0.25)
   = [3b log(3b/0.25) + b log(b/0.25) + c log(c/0.25) + d log(d/0.25)]

   We minimize this subject to 4b + c + d = 1.

   Since the prior is uniform, the minimum relative entropy distribution is the one that is as uniform as possible given the constraint. We can use the method of Lagrange multipliers, but intuitively, without any constraint on c and d, they should be equal and also as close to the prior as possible, but what is the prior for them? 0.25 each. But we have the constraint that they must sum to 1-4b.

   Also, there's no constraint on the South, so the minimum is achieved when c = d = (1-4b)/2.

   Then we have to choose b to minimize the function.

   Alternatively, we can note that for the South, the minimum relative entropy is when c and d are equal, because the prior is uniform and there are no other constraints. So we set c = d = (1-4b)/2.

   Then the divergence becomes:
   D = 3b log(12b) + b log(4b) + 2 * [ ((1-4b)/2) * log( ( (1-4b)/2 ) / 0.25 ) ]
   = 3b [log(12)+log(b)] + b [log(4)+log(b)] + 2 * [ ((1-4b)/2) * log( (1-4b)/2 * 4 ) ]
   = 3b log(12) + 3b log(b) + b log(4) + b log(b) + (1-4b) * log( 2 (1-4b) )

   because (1-4b)/2 * 4 = 2(1-4b)

   So:
   D = b [ 3 log(12) + log(4) ] + (3b + b) log(b) + (1-4b) log(2) + (1-4b) log(1-4b)
   = b [ 3 log(12) + log(4) ] + 4b log(b) + (1-4b) log(2) + (1-4b) log(1-4b)

   This is a function in one variable b. We can take the derivative and set to zero.

   Alternatively, we can assume that since the constraint only involves the North, the South should remain uniform, and the North should be distributed as 3:1, and then b is determined by the marginal constraint.

   In other words, in the absence of any information about the South, the principle of minimum relative entropy would leave the South unchanged. But the constraint is only on the North. So we might expect that the marginal over the South should remain the same as the prior, which is 0.5, and within the South, uniform. So then:
   P(South) = c+d = 0.5, and c=d=0.25.
   Then from the North: a+b=0.5, and a=3b, so 3b+b=0.5 => 4b=0.5 => b=0.125, a=0.375.

   But that is exactly the distribution we have from R1 and R2! 

   However, the constraint for R3 is only one: P(A|North)=0.75. There is no constraint that the marginal over halves is fixed. So R3 does not have to have P(South)=0.5.

   Let me solve for b that minimizes D.

   Let f(b) = b [ 3 log(12) + log(4) ] + 4b log(b) + (1-4b) log(2) + (1-4b) log(1-4b)

   We can compute for b in [0, 0.25] (since a=3b>=0, and a+b=4b<=1, and c=d=(1-4b)/2>=0 => b<=0.25).

   We can try b=0.125 (from R2): then a=0.375, c=d=0.25.
   Then f(0.125) = 0.125 [3 log(12) + log(4)] + 4*0.125*log(0.125) + (1-0.5)*log(2) + 0.5*log(0.5)
   = 0.125 [3 log(12) + log(4)] + 0.5 * log(0.125) + 0.5 log(2) + 0.5 log(0.5)

   But we want to compare with other b.

   Alternatively, we can try b=0.1: then a=0.3, c=d=(1-0.4)/2=0.3.
   Or b=0.2: a=0.6, c=d=(1-0.8)/2=0.1.

   We can numerically evaluate.

   But there's a better way: the minimum relative entropy distribution under a conditional constraint and no other constraints should be the one that leaves the conditional distribution in the South unchanged? Actually, the principle of minimum relative entropy is to stay as close as possible to the prior. The prior is uniform. The constraint is only on the conditional in the North. The closest distribution to uniform that satisfies a=3b would be to set the South to be uniform and then allocate the remaining probability to the North in the ratio 3:1. Why? Because the prior is uniform, so the South is uniform in the prior, and there's no constraint on the South, so it should remain uniform. And then the North should be allocated in the 3:1 ratio. And then the total probability is 1. That is exactly the R2 distribution.

   Then R3 would give the same as R1 and R2? But we need R3 to diverge.

   So we are not done. We must not have the South left to be uniform. Why? Because the constraint for R3 is only the conditional in the North. The distribution in the South is free. The minimum relative entropy might change the South.

   Let's do the math. We set c=d=(1-4b)/2.

   Then we minimize f(b) with respect to b.

   Let me use natural log for ease, and then we can constant factors. The minimizing b will be the same regardless of the base.

   f(b) = b [3 ln(12) + ln(4)] + 4b ln(b) + (1-4b) [ln(2) + ln(1-4b)]

   Let me compute the derivative.

   Let A = 3 ln(12) + ln(4) = ln(12^3 * 4) = ln(1728 * 4) = ln(6912)
   Let B = ln(2)

   f(b) = b A + 4b ln(b) + (1-4b) B + (1-4b) ln(1-4b)

   f'(b) = A + 4 ln(b) + 4b*(1/b) + [-4B] + [-4 ln(1-4b) + (1-4b) * (1/(1-4b)) * (-4) ]
   = A + 4 ln(b) + 4 - 4B -4 ln(1-4b) -4

   = A - 4B + 4 ln(b) - 4 ln(1-4b)

   = ln(6912) - 4 ln(2) + 4 [ ln(b) - ln(1-4b) ]
   = ln(6912) - ln(16) + 4 ln( b/(1-4b) )
   = ln(6912/16) + 4 ln( b/(1-4b) )
   = ln(432) + 4 ln( b/(1-4b) )

   Set f'(b)=0:
   ln(432) + 4 ln( b/(1-4b) ) = 0
   => 4 ln( b/(1-4b) ) = -ln(432)
   => ln( (b/(1-4b))^4 ) = ln(1/432)
   => (b/(1-4b))^4 = 1/432
   => (b/(1-4b)) = (1/432)^{1/4} = 1/(432^{1/4})

   432^{1/4} = (432^{1/2})^{1/2} = sqrt(sqrt(432))

   432 = 16 * 27, so sqrt(432)=4*sqrt(27)=4*3*sqrt(3)=12 sqrt(3) ≈12*1.732=20.784
   then sqrt(20.784)≈4.56

   So  432^{1/4}≈4.56, so b/(1-4b) = 1/4.56 ≈0.2193

   Let r = b/(1-4b) = 0.2193
   Then b = 0.2193 (1-4b)
   b = 0.2193 - 0.8772b
   b + 0.8772b = 0.2193
   1.8772b = 0.2193
   b ≈ 0.1169

   Then a=3b=0.3507
   c=d=(1-4*0.1169)/2 = (1-0.4676)/2 = 0.5324/2=0.2662

   So the R3 distribution is approximately: NA:0.3507, NB:0.1169, SA:0.2662, SB:0.2662.

   We can compute the exact value if we solve the equation.

   432 = 16 * 27 = 2^4 * 3^3, so 432^{1/4} = (2^4 * 3^3)^{1/4} = 2 * (3^3)^{1/4} = 2 * 3^{3/4}

   So b/(1-4b) = 1/(2 * 3^{3/4})

   But we can leave it.

   Alternatively, we can use the exact for the posterior.

   But in our case, we want R3 to be different from R1/R2.

   In R1/R2: NA=0.375, NB=0.125, SA=0.25, SB=0.25.

   In R3: NA=0.3507, NB=0.1169, SA=0.2662, SB=0.2662.

   So they are different.

   Now, the single number that captures the difference is the probability of being in the North. In R1/R2: P(North)=0.375+0.125=0.5. In R3: 0.3507+0.1169=0.4676. So the difference is in the marginal probability of North.

   Why? Because R1 and R2 (which agree) fixed the marginal over halves, while R3 does not. In R2, we explicitly hold fixed the marginal over halves. In R1, the likelihoods are such that the updated marginal over halves happens to be 0.5. In R3, however, only the conditional in the North is constrained, and the algorithm adjusts the probability of being in the North to minimize the relative entropy.

   The whole disagreement sits in the probability of being in the North.

   Now, we need to add a decision.

   The agent faces a decision: She must choose between two exits. Exit1 is in the North, Exit2 in the South. If she is in the North and chooses Exit1, she gets utility 1; if in the North and chooses Exit2, she gets 0. If in the South and chooses Exit2, she gets 1; if in the South and chooses Exit1, she gets 0. So it's always better to choose the exit in her own half.

   But she doesn't know her half. So she will choose the exit that she thinks is more likely to be in her half.

   Specifically, if P(North) > 0.5, she should choose Exit1; if P(North) < 0.5, choose Exit2; if equal, indifferent.

   In R1/R2, P(North)=0.5, so she is indifferent.

   In R3, P(North)≈0.4676<0.5, so she should choose Exit2.

   So the two sides recommend different actions if we set a threshold at 0.5.

   But we can make it more sensitive. Let the utilities be different. Specifically, suppose that if she is in the North and chooses Exit1, she gets utility U; if in the South and chooses Exit2, she gets V. Otherwise 0.

   Then the expected utility of Exit1: U * P(North)
   Exit2: V * P(South) = V * (1-P(North))

   She is indifferent when U * P(North) = V * (1-P(North)) 
   => P(North) = V / (U+V)

   So if U=V, then threshold=0.5.

   In our case, R1/R2 have P(North)=0.5, and R3 has about 0.4676.

   So if we set U=1, V=1, then threshold=0.5. Then R1/R2 say indifferent (or either action is ok), R3 says choose Exit2.

   Alternatively, to make the threshold be a value strictly between, we can set U and V such that the threshold is between 0.4676 and 0.5.

   For example, set the threshold at 0.48. Then we need P(North) = 0.48 = V/(U+V)

   Set V=1, then 0.48 = 1/(U+1) => U+1 = 1/0.48 => U = 1/0.48 - 1 = (1-0.48)/0.48 = 0.52/0.48 = 13/12 ≈1.0833.

   So if U=13/12, V=1, then threshold is 1/(13/12+1) = 1/(25/12)=12/25=0.48.

   Now, in R1/R2, P(North)=0.5>0.48, so she should choose Exit1.
   In R3, P(North)≈0.4676<0.48, so she should choose Exit2.

   So they recommend different actions.

   Now, the expected utility for Exit1 in R1/R2: U * P(North) = (13/12)*0.5 = 13/24 ≈0.5417
   For Exit2: V * P(South) = 1*0.5=0.5
   So Exit1 is better.

   In R3: 
   Exit1: (13/12)*0.4676 ≈ (13/12)*0.4676 ≈ (1.0833)*0.4676≈0.5065
   Exit2: 1 * (1-0.4676)=0.5324
   So Exit2 is better.

   Now, we have to provide the exact R3 posterior.

   We had from the derivative condition:
   (b/(1-4b))^4 = 1/432

   So b = (1-4b) / 432^{1/4} 
   and a=3b, c=d=(1-4b)/2.

   And 432^{1/4} = (432)^{1/4} = (16*27)^{1/4}=2 * 3^{3/4}

   So let r = 2 * 3^{3/4}

   then b = (1-4b) / r 
   => b r = 1-4b
   => b r + 4b = 1
   => b (r+4) = 1
   => b = 1/(4 + 2 * 3^{3/4})

   Similarly, a = 3/(4 + 2 * 3^{3/4})

   c = d = (1 - 4/(4+2*3^{3/4})) / 2 = ( (2*3^{3/4}) / (4+2*3^{3/4}) ) / 2 = (3^{3/4}) / (4+2*3^{3/4}) 

   But this is messy. We can leave it in terms of b or compute numerically.

   We can write the distribution as:

   Let D = 4 + 2 * 3^{3/4}
   Then:
     NA: 3/D
     NB: 1/D
     SA: 3^{3/4} / D
     SB: 3^{3/4} / D

   But this is not exact because from c=d= (1-4b)/2 and b=1/D, then 1-4b = 1 - 4/D = (D-4)/D = (2*3^{3/4})/D, so c=d= (2*3^{3/4})/(2D) = 3^{3/4}/D.

   Now, 3^{3/4} = (3^3)^{1/4} = 27^{1/4} = sqrt(sqrt(27)) = sqrt(5.196152)≈2.2795

   So D = 4 + 2*2.2795 = 4+4.559=8.559

   Then:
     NA: 3/8.559≈0.3505
     NB: 1/8.559≈0.1168
     SA: 2.2795/8.559≈0.2663
     SB: 0.2663

   So approximately: 0.3505, 0.1168, 0.2663, 0.2663.

   We'll use decimals to four places: 0.3505, 0.1168, 0.2663, 0.2663.

   Now, perturbation: to collapse the divergence, we can change the message to also include information about the South, but that might not be bare conditional.

   We can change the prior. Make the prior non-uniform. But that might be complicated.

   Alternatively, change the likelihoods slightly so that after R1 the marginal over halves is not 0.5. But we want R1 and R2 to be the same.

   Since R2 explicitly holds the marginal over halves fixed, to make R1 and R2 differ, we could change the likelihoods so that the R1 posterior has P(North) != 0.5. But then they wouldn't be the same.

   In our current setup, R1 and R2 are the same by design. To collapse the divergence with R3, we can change the constraint set for R3 to also include the marginal over halves. If we add the constraint that P(North) = 0.5, then R3 will give the same as R2.

   So perturbation: impose additionally that P(North)=0.5. Then in R3, we have a=3b, and a+b=0.5, so b=0.125, a=0.375, and then c+d=0.5, and to minimize relative entropy with no other constraints, set c=d=0.25. So R3 becomes the same as the others.

   Then the objection: a defender of R3 might say that the constraint set should include the marginal over halves? But why? The message is only about the North. The only information is the conditional. However, the defender might argue that the minimum relative entropy should be with respect to the prior and also respect the fact that the message does not change the probability of being in the South? But that's what R2 does. R3 does not do that by default.

   The other objection: that supplying a full channel model (for R1) means this was never a case of updating on a bare conditional. The conditional is embedded in a channel that might depend on the location, so the update is on the entire event of receiving the message via that channel. This objection might be that the conditional is not "bare" because we have a model of how the message is generated and delivered. This is a valid objection. The Judy Benjamin problem is often presented as updating on a conditional without a channel model. If we supply a channel model, then we are in a different setting.

   My assessment: the point of the case is to show that the artifact in the Judy Benjamin problem (which is the disagreement between rules) can be decision-relevant when you have a channel model. So even though the channel model turns it into a standard Bayesian update, the other rules (like R2 and R3) are sometimes used for bare conditionals, and we show that in this case with a channel model, R1 and R2 (which are the same) give a different result than R3, and that difference is decision-relevant. The objection that a full channel model means it's not a bare conditional is accepted, but then the case is not about bare conditionals but about how the same information can be modeled as a channel, and then the update is different from what R3 would do for a bare conditional.

   Alternatively, the defender of R3 might say that if you are using a channel model, then the constraint set for R3 should include the likelihood facts. That is, in R3, we should not just impose P(A|North)=0.75, but also that the likelihoods are as given. But that would be a different constraint set. The constraint set for R3 would then be the set of distributions that are consistent with the observed data and the channel model. But that is exactly what R1 does: it condition on the event that the message was received. So if we include the likelihood facts, then R3 would minimize relative entropy subject to the constraint that the likelihoods are as given and the prior, which is equivalent to R1. So it would collapse into R1.

   This objection is that if you have a channel model, then you should use it fully in R3, not just the content of the message. But then R3 would agree with R1. So the case only shows a difference if we don't include the likelihood facts in the constraint set for R3. The defender might argue that we should.

   My assessment: This objection is valid, but then it highlights the point that for bare conditionals (without a channel model), people might use R3 with only the conditional constraint, and that can lead to a different decision than if you had a channel model and updated by R1. So the case illustrates that the artifact (the difference) is decision-relevant, and the availability of a channel model (even if you are not forced to use it) can be important.

   Finally, confidence: I am confident that the three posteriors are correct given the rules. The likelihoods are chosen to make R1 and R2 agree, and we have the arithmetic. For R3, we have the derivation. The decision part is clear. The case meets the constraints: the story is realistic, the likelihoods are between 0 and 1 and explained by the story, and the agent knows the likelihoods because she knows the survey probability and the reception probabilities.

   The step I am least sure of is the R3 derivation. The closed-form solution is messy, and I hope the numerical approximation is good enough.

   Let's write the scenario in under 150 words.

   The written section of the paper is not to be written here, but we can draft:

