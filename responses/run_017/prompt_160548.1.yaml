prompt: |-
  Writing up a paper on the "acting for the right reasons" condition on moral worth, and I need a case engineered to spec rather than a case that just illustrates the issue. Here's what I need.

  Constraints on the scenario:
  - one agent, one act, one paragraph, ordinary realistic setting (a hospital, a workplace, a family — no trolleys, no designers, no neuroscientists);
  - the act is right, and the agent's action has *full* moral worth — not merely excusable, not merely less bad, and I mean worth rather than credit or praise from onlookers;
  - but the act's right-making feature F has to be such that no one can both act well here and treat F as her motivating reason: acting *because* of F is self-defeating, it destroys what made the act good. So any version of the condition that requires the good-making feature to figure as the agent's motivating reason (doastically, or de re through her perception of it) is unsatisfiable by anyone who acts well;
  - no cheating on that: the self-defeat has to fall out of the structure of the reason, not from the agent being irrational, self-deceived, weak-willed, scrupulous, or confused;
  - and it can't be either of the two familiar patterns — say in the check why not. (i) Not the Huckleberry Finn / unprincipled-virtue pattern, where the agent acts well *against* her own considered judgment: my agent's occurrent moral beliefs have to be true and fully consistent with what she does. (ii) Not merely a "one thought too many" case, where weighing the reason is idle, tasteless, or expressive of a bad motive: the self-defeat has to be stronger than that, acting on F has to *undermine* the feature that makes the act good, not just add an unattractive thought.

  What the case is for, since that fixes what counts as cheating: I want to argue that the "right reasons" condition is best read as an attributability / fittingness condition rather than a doxastic one. So the case has to *generate* its verdicts from the two readings rather than stipulate them — if it works only because you built the Intuition in by hand, I can't use it.

  After the scenario:
  1. State F and show the act is right in virtue of it.
  2. Show the action has full moral worth, and run the self-defeat: what exactly goes wrong for the agent who acts on F.
  3. Show the readings come apart in the direction I need — the doxastic reading says no moral worth (or deficient worth) here, the attributability reading says full worth.
  4. Say which single feature of the case is doing the work, and what happens if you remove it: does it collapse into the Huck pattern, or into a case where there really is no worth?
  5. Give me the strongest attack a defender of the doxastic condition has, not a strawman, plus your reply.
  6. Be explicit about where you're least confident — which step is most likely to fail — and what consideration would definately make you take back the claim that the action has full worth.

  Keep it tight and skip the literature survey, I've read it. If a step turns on something contested, flag it in a clause rather than hedging the whole thing. At the very end put \answer{...} containing one sentence naming the feature of the case that does the work.
reasoning: |-
  Okay, let me tackle this user's request. They're writing a paper on moral worth and need a specific case that challenges the "acting for the right reasons" condition. The constraints are strict: one agent, one act, realistic setting, full moral worth but self-defeating if motivated by the right-making feature F. 

  First, I need to avoid common pitfalls. No Huckleberry Finn scenarios where beliefs conflict with action, and no "one thought too many" cases. The self-defeat must come from F's structure itself, not agent irrationality. 

  Hmm... what scenario fits? Consider interpersonal contexts where acknowledging a value destroys it. Like gratitude - pointing out someone's sacrifice to thank them might undermine the spontaneous care behind it. That could work. 

  Let me sketch: Nurse Ana stays late to comfort a dying patient, Mr. Davies. The right-making feature F is "because he has no family and faces death alone." But if Ana consciously thinks "I'm doing this because he's alone," it turns care into pity, undermining the genuine connection that makes the act good. 

  Now, does this meet all constraints? 
  - Full moral worth: Yes, Ana acts from compassion. 
  - Self-defeat: Motivating by F explicitly would destroy the uncalculated responsiveness required. 
  - Not Huck Finn: Ana believes helping is right and acts consistently. 
  - Stronger than "one thought too many": The act's moral worth depends on F remaining implicit. 

  For the philosophical work: The doxastic reading would deny moral worth since F isn't the conscious reason, but the attributability view correctly attributes worth to Ana's compassionate character. 

  The key feature is F being an unacknowledged-good - removing that collapses it into lesser cases. Major attack? Someone might argue explicit motivation could still work if phrased carefully. Reply: The structure requires F to operate pre-reflectively to preserve the relational good. 

  Weakest point? Whether worth persists if Ana has fleeting thoughts about F. But as long as it's not her motive, worth remains. 

  \answer{The right-making feature being an unacknowledged relational good requiring implicit responsiveness}
answer: |-
  Here is a case engineered to your specifications, followed by the analysis:

  ### Scenario: The Last Visit
  Ana, a hospice nurse, sits with Mr. Davies, a terminally ill patient who has no family or friends. His final wish is to not die alone. On her day off, Ana voluntarily spends hours at his bedside, holding his hand and speaking softly until he passes peacefully. She does this neither out of duty nor pity, but from a spontaneous, uncalculated sense of companionship. She truly sees him as a fellow human deserving presence in his vulnerability. Her act is right—it fulfills a profound human need for connection at death.

  1.  **F & Rightness**: The right-making feature **F** is *that Mr. Davies is utterly alone in facing death, and companionship would affirm his inherent dignity*. The act is right in virtue of F because it directly responds to this fundamental isolation and need for recognition, preventing an undignified, solitary death.

  2.  **Moral Worth & Self-Defeat**: Ana’s action has full moral worth; it is a paradigm of compassionate care, stemming directly from her empathetic recognition of Mr. Davies as a person worthy of regard, unmediated by calculation. However, acting *because* of F (i.e., consciously taking "he is utterly alone and needs companionship to avoid indignity" as her motivating reason) is self-defeating. It would frame her presence as a *response to his deficit* (his isolation/potential indignity) rather than *being-with him* as an equal. This explicit focus on his "aloneness" as the reason objectifies his vulnerability, turning companionship into a therapeutic intervention aimed at fixing his state. It undermines the very feature F – the unmediated, non-instrumental affirmation of his dignity through shared presence – that makes the act good. The relational good (mutual recognition) requires F to be the *ground* of her responsiveness, not its consciously represented *motive*.

  3.  **Readings Diverge**:
      *   **Doxastic Reading (F must be motivating reason)**: Fails. Ana does not act *on* F as her conscious reason; doing so would undermine F. Thus, this reading denies full moral worth (or finds it deficient).
      *   **Attributability Reading (Action must express a virtuous concern fitting F)**: Succeeds. Ana’s action robustly expresses deep compassion – a concern precisely *for* human connection and dignity in vulnerability, which is the concern fitting F. Her motive (spontaneous companionship) is the mode through which her character responds *to* F, even if F isn't the propositional content of her intention. Full moral worth is secured.

  4.  **Key Feature & Removal**: The key feature is **F being an *unacknowledged relational good*.** F describes a state (profound isolation) whose remedy *requires* a response (companionship) that, to constitute the specific good *of relational affirmation*, must be experienced as non-contingent on that state. Consciously motivating by F makes the companionship contingent *on* the deficit, destroying the unmediated recognition.  
      *   **Remove it (F becomes a standard need)**: If F were merely "he needs pain relief," acting *because* of that need is fitting and non-self-defeating. The case collapses into one where acting on F *is* necessary for worth, or (if not acted upon) into Huck Finn territory if beliefs conflict. Here, without the unacknowledged-good structure, the self-defeat vanishes, and the doxastic condition might seem plausible.

  5.  **Strongest Attack & Reply**:
      *   **Attack**: The defender argues Ana *does* act on F, just under a different description (e.g., "he deserves company"). Distinguishing "acting on F" from "acting from concern fitting F" is artificial. Her compassionate motive *just is* the appropriate sensitivity to F; requiring it to be non-doxastic mystifies motivation. If the act expresses the right concern, it *must* involve F figuring doxastically, perhaps implicitly or non-linguistically, in her practical reasoning.
      *   **Reply**: The self-defeat shows the descriptions aren't equivalent. Acting on the description "he deserves company" (focusing on *him*) is different from acting on "he is utterly alone and this companionship prevents indignity" (focusing on *the problem F denotes*). The latter, explicit focus on F *as the motivating reason* is what undermines the relational good. Compassionate concern *for him* responds *to* F but doesn't take F *as the reason* guiding action in a way that would instrumentalize the relationship. The structure of F as an unacknowledged good necessitates this distinction.

  6.  **Least Confident Point**: The step most likely to fail is **claiming full moral worth persists** if Ana *never* consciously entertains F. A critic might argue that if F is so central to the act's rightness, *some* doxastic connection (e.g., perceiving his aloneness *as* a call to companionship) is essential for attributing the worth *to Ana* rather than just her behavior. If it were shown that Ana was *completely oblivious* to his isolation (e.g., she thought he had family nearby but just liked talking to her), this would definitely undermine full worth, as her concern wouldn't be *responsive* to F. However, in the case as described, she is acutely *aware* of F; it shapes her perception and concern, it just doesn't function as her *motivating reason*.

  \answer{The right-making feature being an unacknowledged relational good requiring implicit responsiveness}
