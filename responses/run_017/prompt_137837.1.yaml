  2.  **The collapse move**: **0.30**  
      *Justification*: Higher-order distributions require unjustifiable precision; regress stops at practical deliberation, not resolution.  
  3.  **Normative visibility**: **0.40**  
      *Justification*: Γ-maximin *can* forbid choices Bayesians permit (e.g., in Ellsberg), but partition sensitivity weakens uniqueness.  
  4.  **Embarrassing behaviours**: **0.70**  
