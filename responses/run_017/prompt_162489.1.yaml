prompt: |-
  hey — hoping you can help with something that's gotten abruptly practical for me.

  Our city council voted last month to pilot a permanent citizens' assembly on the housing plan, and I somehow ended up on the volunteer design committee. 90 people, drawn by lot, eight weekends, then recommendations to council. So the design questions are now mine and not somebody's seminar paper.

  The consultant we hired leans on one analogy constantly: an assembly is to the electorate as a random sample is to a census. You don't need to ask everybody; a properly drawn few hundred tells you what the whole population thinks, and it tells you that cheaply and with a knowable error margin. He uses it for three moves: (1) 90-ish is plenty, and growing the chamber or putting the question to a referendum buys nothing worth the money, since a referendum is just asking everyone to fill in the census form badly; (2) whatever the assembly lands on is, in the relevant sense, what the city would have decided, so council can defer without giving anything up; and (3) because you can stratify a sample, we should deliberately oversample renters (roughly 2:1, since they're the group most affected and least heard), the way you'd oversample a small subgroup in a survey to get a usable estimate for it.

  Move (3) is the one that's been nagging at me. A survey sample is supposed to sit still — it measures opinions it doesn't change — while the entire point of eight weekends is that people arrive with one view and leave with another. If the picture is wrong there, I suspect it's wrong for the other two moves as well, but I can't tell which of them it was actually carrying.

  You're a political theorist who works on democratic innovation and you know the sortition literature inside out. Think it through properly: lay out the correspondences first — what plays the role of the sampling frame, the estimator, the margin of error, non-response, the population itself — and only then say where the mapping breaks and whether each break matters for the use he's making of it. Then give me your verdict on the three moves separately, and if the census picture is the wrong one, tell me what a better analogy would be (jury? focus group? standing panel?) and what it would let us conclude that this one can't.

  One page, 600 words max, a correspondence table is fine and I'd actually prefer one. No bibliography or citations — I'll chase those up myself.
reasoning: |-
  Okay, the user is on a committee designing a citizens' assembly for housing policy and has concerns about the consultant's sampling analogy. Let me unpack this carefully.

  The consultant's census/sampling analogy has three problematic applications: claiming 90 participants is sufficient (since it mirrors survey sampling), that the assembly's decision represents the city's will (like extrapolating survey results), and that oversampling renters is valid (as in stratified sampling). The user's core concern is whether this analogy holds when participants' views evolve during deliberation - unlike static surveys.

  Hmm... the key tension is between descriptive representation (mirroring demographics) vs. deliberative transformation (changing minds through discussion). The consultant's model ignores the latter entirely. For the renter oversampling: while including marginalized voices is crucial, the 2:1 ratio might create perception issues if others feel underrepresented, even if statistically sound for a survey. 

  For the size argument: 90 is actually borderline for deliberation (logistics vs. diversity tradeoff), but the real flaw is comparing it to survey margins of error. Deliberative bodies aren't measuring static opinions - they're creating new collective judgments. The "city's will" point is the most dangerous - no microcosm can claim to represent transformed public opinion post-deliberation. 

  Better analogies? A jury captures the mandate to deliberate toward judgment, but lacks policy scope. A standing panel suggests continuity but loses the "freshness" of lotteries. Perhaps a hybrid: "a statistically informed microcosm mandated to deliberate as trustees." The table helps clarify roles: the "sampling frame" is voter/citizen lists, but "non-response" becomes self-selection bias in participation, which skews representativeness. 

  For verdicts: (1) Size is pragmatically acceptable but for wrong reasons; (2) Representation claim is indefensible; (3) Oversampling is justifiable ethically though not statistically. Should emphasize transparency about the renters' oversample to maintain legitimacy. 

  User clearly grasps the theory but needs actionable distinctions - they'll be facing committee debates. The jury analogy might resonate best practically, while subtly challenging the consultant's statistical reductionism.
answer: |-
  Here’s a concise analysis of the sampling analogy applied to your citizens’ assembly (CA), including a correspondence table, verdicts on the three moves, and a refined analogy.

  ### Correspondence Table
  | **Survey Sampling Term** | **Citizens’ Assembly Equivalent**          | **Nature of Correspondence**               |
  |--------------------------|-------------------------------------------|--------------------------------------------|
  | Population               | Entire city electorate                    | Direct: The group being represented.       |
  | Sampling Frame           | Voter/citizen registry                    | Direct: Source for random selection.       |
  | Sample                   | 90 assembly members                      | Partial: Mirrors demographics but evolves. |
  | Estimator                | Assembly’s final recommendations          | Weak: Output reflects deliberation, not static opinion. |
  | Margin of Error          | Assembly’s legitimacy/robustness          | Broken: Deliberation transforms views; no statistical error margin. |
  | Non-response             | Invitation refusals                      | Direct: Self-selection bias in participation. |
  | Stratification           | Oversampling renters (2:1)               | Partial: Balances voice but alters group dynamics. |

  ### Where the Analogy Breaks & Why It Matters
  - **Core Break**: Surveys measure *existing* opinions; CAs *transform* opinions through deliberation. The consultant’s analogy treats the CA as a snapshot, ignoring that the output is co-created, not measured.  
  - **Impact**:  
    - **Move (1)**: Size adequacy depends on *deliberative quality* (diversity, depth), not statistical precision. 90 is pragmatic but risks underrepresenting nuanced perspectives.  
    - **Move (2)**: The CA’s output is **not** what the city "would have decided." Deliberation generates informed, public-spirited judgments distinct from uninformed mass opinion.  
    - **Move (3)**: Oversampling renters ensures inclusion but alters group dynamics (e.g., renter perspectives may dominate). Unlike surveys, this affects deliberation, not just estimates.  

  ### Verdicts on Moves
  1. **Move (1) Size (90 is sufficient)**:  
     **Partly valid, for wrong reasons**. 90 is workable for deliberation but not due to sampling theory. Larger sizes (150–200) improve diversity and mitigate dominance by vocal minorities. Cost concerns are valid, but referendum comparisons are flawed (CA ≠ plebiscite).  

  2. **Move (2) Legitimacy (Assembly = city’s will)**:  
     **Invalid & dangerous**. The CA’s legitimacy stems from *representative deliberation*, not statistical extrapolation. Claims that it reflects pre-deliberative public opinion misrepresent its purpose. Council should defer based on the CA’s reasoned judgment, not faux-popular mandate.  

  3. **Move (3) Oversampling renters**:  
     **Defensible, but not statistically**. Ethical inclusion of marginalized groups justifies stratification. However, transparency is critical: Explain it as *correcting structural exclusion*, not statistical weighting. Monitor group dynamics to avoid unintended polarization.  

  ### Better Analogy: **A Hybrid Jury/Panel**  
  - **Jury**: Emphasizes the duty to deliberate impartially on evidence, reach a collective verdict, and represent communal norms.  
  - **Standing Panel**: Highlights ongoing engagement (if extended) to build expertise and accountability.  
  - **Why superior?** This combo:  
    - Centers *deliberative transformation* over static representation.  
    - Legitimizes oversampling as ensuring "voice" for the marginalized (like victim-impact in juries).  
    - Supports modest size (juries are small) but clarifies output is a *judgment*, not a plebiscite.  
    - Lets council defer as it would to a competent, representative tribunal.  

  ### Key Conclusions
  - **Stop using sampling theory**: It conflates measurement with transformation.  
  - **Defend design transparently**: Size based on logistics/diversity balance; oversampling as equity; legitimacy from process rigor.  
  - **Frame for council**: The CA is the city’s "deliberative conscience"—informed, representative, and tasked with refining raw opinion into public judgment.  

  > **Recommendation**: Retain 90 members and renter oversampling, but rebrand the latter as "equity seats." For legitimacy, stress the CA’s structured learning and impartiality—not statistical magic.
