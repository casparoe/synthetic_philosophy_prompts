  The user's proposed principle focuses on bidirectional part-whole constraints as the essence of conscious systems. This resembles IIT's core ideas but needs stress-testing against their verdicts. Their emotional stake in case 14 (the brother's condition) requires especially sensitive handling - abstract philosophy must meet clinical reality here.

  Key sticking points emerge: 
  - How to reconcile the disconnected but "ready" neuron (13) with inactive feedback loops (14)
  - Why hemispherectomy patients (5) show full consciousness while split-brain (6) suggests duality
