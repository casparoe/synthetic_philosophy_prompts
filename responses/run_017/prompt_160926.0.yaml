answer: |-
  Here's a disciplined natural-kinds analysis of the Asperger's/ASD reclassification, structured per your queries:

  ### 1. Grounds for Elimination
  - **Empirical claim**: Asperger's lacked discriminant validity (no reliable separation from ASD in course, outcome, biomarkers, or family patterns; distinctions often artifacts of IQ/language delays). *Strength*: Primary driver. DSM-5 explicitly cited poor reliability/validity. *Requirement for dominance*: Controlled longitudinal studies showing stable group differences.
  - **Metaphysical claim**: Asperger's was never a natural kind (no shared essence). *Strength*: Implied but not explicit. *Requirement for dominance*: Proof of fundamental causal heterogeneity within Asperger's diagnoses.
  - **Pragmatic claim**: The category was clinically inert (no unique treatment implications, hindered research pooling). *Strength*: Secondary justification. *Requirement for dominance*: Evidence that differential diagnosis never altered outcomes.

  **Strongest reconstruction**: Primarily empirical, secondarily pragmatic. The merger reflected *instrumental failure* rather than ontological denial.

  ---

  ### 2. "Carving at the Joints" for Behavioral Syndromes
  For ASD—defined by severity gradients and functional impairment—natural-kind accounts face inherent tensions:
  - **Cluster with shared mechanisms**: Problematic; ASD's genetic/neurological heterogeneity resists unitary mechanisms.
  - **Single underlying mechanism**: Implausible given etiological diversity (100+ risk genes, epigenetic factors).
  - **Convergent outcome**: Best fit. ASD may be an "attractor state" where diverse developmental disruptions (genetic, environmental) converge on similar phenotypic pathways due to neural system constraints.
  - **Shifting category members**: Diagnosed individuals may "drift" due to adaptive learning/masking, altering phenotypic boundaries.

  **Boundary failure implications**: The Asperger's/autism distinction collapsed not because ASD is a "clean" joint, but because both occupy the *same continuum of a multiply-realizable outcome*. The failure reveals ASD itself as a *pragmatic carving* of neurocognitive diversity—not a discrete natural kind.

  ---

  ### 3. Your Tripartite Distinction Applied
  - **Grip**: Low for Asperger's. Poor prediction of trajectory/intervention response beyond IQ/language status. ASD spectrum ratings offer marginally better grip via severity dimensions.
  - **Depth**: Uncertain. Asperger's showed no unique causal structure; ASD's depth remains contested (is it a "final common pathway"?).
  - **Recutting Cost**: High. Loss of identity scaffolding ("Aspie"), disrupted research comparability, administrative friction in eligibility systems.

  **Tensions demonstrated**:
  - A taxonomy can be *deep but not gripping* if mechanisms exist but aren't actionable (e.g., distinct genetic subtypes with identical treatment needs).
  - It can be *gripping but not deep* if severity ratings guide accommodations without reflecting etiology.
  - A *real but ungrippable distinction* could exist (e.g., biomarkers with no clinical utility), justifying its removal for operational purposes—unless recutting costs outweigh grip deficits.

  ---

  ### 4. Reverse Argument: Skepticism vs. Realism?
  - **Pro-pluralism**: Supports interest-relative carving. Asperger's served identity/community needs; ASD serves bureaucratic/research efficiency. No "joint" need exist.
  - **Pro-realism**: Highlights costs of *unstable* categories: identity disruption, fragmented research, service gaps. Suggests we need *better* joints (e.g., biosignatures), not abandonment of the hunt.
  - **Social work of labels**: Identity utility is ethically relevant but epistemically distinct. Retaining a non-joint for social reasons risks *harm* (misguided research, ineffective interventions). Better to decouple identity from medical taxonomy.

  **Where natural kinds literature is silent**: It neglects *constitutive effects*—how labeling reshapes selfhood and social reality. Chemical kinds don't internalize their classifications; humans do. This case exposes classification as a *performative* act.

  ---

  ### Bottom Line
  - **Merger justified?** Scientifically, yes: Asperger's lacked validation as a distinct entity. The spectrum model better accommodates heterogeneity.
  - **Label kept anyway?** Ethically debatable. A transitional "Asperger's profile" specifier might have reduced recutting costs without reifying a non-joint.
  - **Unsettled questions**:  
    - Whether ASD is a "shallow" pragmatic kind or will gain depth via subtypes.  
    - How to weigh epistemic purity against identity continuity.  
    - Whether neurodevelopmental diversity resists "joints" entirely, demanding dimensional approaches.

  **Core tension**: Psychiatry operates where biophysical reality, functional impairment, and identity collide. Natural kinds frameworks—built for chemistry—struggle with this triad. The episode doesn't settle ASD's ontology but starkly shows the human costs when taxonomies shift without regard for their constitutive power.
