prompt: |-
  So I'm writing a novel with a school board meeting at the center of it — a fight over whether the district contracts with a church-run nonprofit to run after-school mentoring — and I can't get the scene right because I don't actually know what it feels like in a room when somebody is told, in effect, that the reason they care most about is the one reason they're not supposed to say out loud. So I volunteered to run one session for my nephew's civics class: 20 juniors and seniors, one 75-minute block, nothing assigned beforehand. Design me a game they play rather than a discussion they have.

  Rough shape I have in mind, fix it or replace it: no lecture up front, and nobody hears the fancy philosophical name for this until the last ten minutes. Three quick votes on the same agenda item — (1) approve the contract or not, (2) allow the nonprofit's optional closing reflection at the end of each session, (3) the package as a whole — with the speech rule changing each round: first round only reasons anyone could in principle check, second round you may say your real reason as long as you also give an accessible one, third round anything goes. Sealed role cards with a hidden core reason, and I want the assignment mixed so some students get religious reasons that point different directions (a duty-to-the-poor Yes, a don't-outsource-care-to-proselytizers No) and some get secular reasons that are structurally just as ultimate — an absolutist property-rights guy, a hard utilitarian — so the room discovers for itself that the rule sorts reasons by brand rather than by anything it admits to sorting by. I also want a one-use whisper pass, so each person can tell exactly one other member the thing they can't tell the room, and a scribe keeping a running ledger on the board of which offered reasons anyone could evaluate and which ones you'd have to already believe something to feel the force of. Plus an index card at the start of round two: the one sentence you'd say if there were no rule at all, collected and read aloud anonymous at the end.

  Give me rules, materials, a payoff scheme that isn't real money (I was thinking influence chips versus integrity chips, where you only get the integrity one by saying your actual reason at least once), and a timeline that fits 75 minutes. Guardrails I care about: nobody should end up playing a version of themselves, so make the roles fictional with an easy reassignment, and have the chair rule the contract legal either way so the kids can't collapse the whole thing into a First Amendment argument and feel done. And the cards should be written so the religious reasons sound like adults talking, not like a cartoon.

  Then the debrief: map specific moments onto what's actually going on, and tell me what will predictably go wrong the first time I run it and how to handle it. Be honest about what the game can't reproduce and what I'll have to hand them in words afterward. Also — this is the part I most want — give me the lines you predict students will actually say, because that's the dialogue I'm stealing for chapter nine.
reasoning: |-
  Okay, the user is writing a novel centered on a school board meeting where the core tension involves people being unable to voice their deepest motivations. They're struggling to capture the emotional reality of that suppression, so they've designed a civics classroom game as research. That's smart—they're turning their artistic problem into experiential learning.  

  The game concept they've sketched is sophisticated but messy: three voting rounds with shifting speech rules, hidden role cards, and a whisper mechanic. They want to avoid students defaulting to constitutional arguments or self-insertion. I need to streamline this while preserving their key goals:  
  - The visceral frustration of having your core belief silenced  
  - Demonstrating how "neutral" rules disproportionately muzzle certain viewpoints  
  - Generating authentic dialogue they can steal for their novel  

  First, the timeline is tight for 75 minutes. Their three-vote structure would eat up too much time with transitions. Cutting it to two rounds keeps tension: first round forces "objective" reasons only, second allows anything. The optional third vote becomes a quick reveal instead.  

  Role cards need careful design. To prevent caricatures:  
  - Religious motivations should mirror real-world nuanced positions (e.g., "Matthew 25:40 compels me to support outreach to marginalized kids" rather than "JESUS SAYS YES")  
  - Include secular "ultimate" beliefs too—libertarians, utilitarians—so players realize the rule targets belief types, not just religiosity  
  - Add role-specific constraints: the property rights absolutist must oppose any public funding, the utilitarian must demand outcome data  

  The whisper pass is genius for conveying isolation. Each player gets one slip to share their taboo truth privately. I'll suggest printing them as tearable notecard corners so they're tactile.  

  For payoff, influence chips (awarded when your side wins) vs. integrity chips (earned only by voicing your true reason) creates interesting tension. Players might strategically sacrifice influence for integrity—exactly the novel's theme.  

  Predictable hiccups:  
  - Students might mock exaggerated roles → solution: pre-written cards with dignified language  
  - Whispering could devolve into giggling → enforce solemn delivery, maybe dim lights  
  - Debate might stall → seed "provocateur" roles (e.g., a teen forced to argue against her church)  

  Key lines I expect:  
  *"But how do you measure 'pro-social behavior'? Are we counting hugs or test scores?"*  
  *"My card says I own three laundromats downtown. Why would I care about after-school snacks?"*  
  *"Can I just read what I wrote? Please? It's shorter than this fake argument."*  

  The debrief must highlight what the game can't capture: long-term resentment, power imbalances, real-world consequences. I'll suggest they end by reading anonymous "uncensored" cards aloud—that moment when forbidden truths hang in the air is pure novel fodder.
answer: |-
  Here’s a polished game design—**"The Silent Motive"**—tailored to your needs. It runs in 75 mins, forces tension between stated/unstated beliefs, and delivers the emotional friction you’re seeking for your novel. I’ve structured it for maximum "aha" moments, with dialogue predictions and troubleshooting notes.

  ---

  ### **GAME RULES: THE SILENT MOTIVE**  
  **Objective:** Pass or block a school contract with "New Horizons Mentoring" (NHM), a church-run nonprofit offering tutoring + "optional reflection time." Players must advocate for hidden motives while navigating speech restrictions.  

  **Materials:**  
  - 20 sealed **ROLE CARDS** (fictional personas with core motives)  
  - 20 **INTEGRITY CHIPS** (red) + 60 **INFLUENCE CHIPS** (blue)  
  - 1 **WHISPER PASS** per player (sticky note corner)  
  - Sticky notes + pens for anonymous truths  
  - Whiteboard with 3-column ledger:  
    `REASON OFFERED | CHECKABLE? (✓/✗) | BELIEF-DEPENDENT? (✓/✗)`  

  **Role Card Examples (Key Motivations):**  
  *(Assign randomly; all roles are adults)*  
  1. **Pastor’s Spouse (YES):** *"NHM’s faith-based approach saved my nephew. Secular programs lack ‘soul-deep’ change."*  
  2. **Atheist Parent (NO):** *"Tax dollars shouldn’t fund groups that imply my child is ‘broken’ without God."*  
  3. **Libertarian Business Owner (NO):** *"Any public contract with private entities violates property rights."*  
  4. **Social Worker (YES):** *"NHM serves homeless teens. Without them, kids will die. Outcomes > ideology."*  
  5. **Ex-NHM Volunteer (NO):** *"They ‘opt-in’ kids to prayer by making it the only quiet room after tutoring."*  
  6. **Urban Planner (YES):** *"Churches are the only spaces open past 6 PM in food deserts. No alternatives exist."*  
  7. **Civil Rights Lawyer (NO):** *"Their waiver says ‘interfaith dialogue’ but fires mentors who don’t preach Christ."*  

  **Seeded Tension:** 9 YES, 8 NO, 3 swing votes (e.g., *"I’ll vote YES if the reflection is cut"*).  

  ---

  ### **TIMELINE (75 MINUTES)**  
  **1. Setup (5 mins)**  
  - Assign roles randomly. Chair (you) announces:  
    *"Vote today on NHM’s contract. Legal either way. Your role card is your truth. Win Influence Chips if your vote wins; earn Integrity Chips by speaking your card’s motive at least once."*  

  **2. Round 1: "Just the Facts" (20 mins)**  
  - **Speech Rule:** *"Only share reasons anyone could verify—data, documents, or observations. No beliefs, values, or emotions."*  
  - **Vote 1:** Approve contract? (YES/NO)  
  - **Scribe tracks** reasons on whiteboard (e.g., *"NHM’s test scores rose 10%"* → ✓ checkable / ✗ belief-dependent).  
  - **Whisper Pass:** Players can slip ONE person their hidden motive via sticky note.  

  **3. Round 2: "Mask On, Mask Off" (25 mins)**  
  - **Speech Rule:** *"Share ANY reason—but if it’s not ‘checkable,’ you MUST also give a ‘fact’ reason."*  
  - **Secret Ballot:** Players write their *true, uncensored motive* on an index card.  
  - **Vote 2:** Keep NHM’s "optional reflection"? (YES/NO)  
  - **Scribe updates** ledger (e.g., *"Kids need Jesus"* → ✗ checkable / ✓ belief-dependent).  

  **4. Round 3: "The Package" (10 mins)**  
  - **Speech Rule:** *"No rules. Say anything."*  
  - **Vote 3:** Approve full contract? (YES/NO)  
  - **Reveal:** Chair reads anonymous true motives from Round 2 aloud.  

  **5. Debrief (15 mins)**  
  - Award chips: 1 Influence Chip per winning vote; 1 Integrity Chip if player spoke their true motive.  
  - Discuss: *"Which round felt most tense? Why?"* → *"What did the ‘fact-only’ rule silence?"*  
  - Drop the term: **"Reasonable pluralism"** (Rawls) — explaining why some reasons get excluded in public debate.  

  ---

  ### **PREDICTED STUDENT DIALOGUE (FOR YOUR NOVEL)**  
  **During Round 1 ("Facts Only"):**  
  > *"NHM’s lease costs 30% less than secular options."*  
  > *"But their waiver says mentors can ‘share personal values’—that’s loophole language!"*  
  > *"How do I prove ‘the poor deserve dignity’ is a fact? Fine... their van has wheelchair access."*  

  **During Whisper Pass:**  
  > *"Psst. My card says I left NHM because they made gay kids ‘pray away the gay.’ Can’t say that though."*  
  > *"I’m the libertarian. Taxes are theft. That’s... not a ‘fact,’ is it?"*  

  **During Round 2 ("Mask On, Mask Off"):**  
  > *"Look, the reflection time is harmless. But honestly? I want my daughter in a *Christian* space after school."*  
  > *"Objectively, their outcomes are good. *Sigh*... but I don’t trust churches with state money. Ever."*  

  **During Reveal:**  
  > *"Wait, YOU wrote ‘God told me to vote no’? But you quoted the budget deficit all round!"*  
  > *"Who said ‘If the state won’t care for kids, the church must’? Chills."*  

  ---

  ### **WHAT WILL GO WRONG (AND HOW TO FIX IT)**  
  1. **"This is unrealistic!"**  
     - *Fix:* Preface with *"Real meetings often hide motives. Your job today: feel the friction."*  

  2. **Students mock roles** (e.g., giggling at "church" motives).  
     - *Fix:* Assign roles sternly: *"You’re an atheist parent who fought cancer. Play her truth."*  

  3. **Debate stalls in Round 1** (over-defining "fact").  
     - *Fix:* Chair intervenes: *"If you can’t Google it in 10 seconds, it’s not a fact. Move on."*  

  4. **Whisper Pass unused** (students shy).  
     - *Fix:* Model it: *"I’m the Chair. I’ll whisper to Malik: ‘I think NHM’s director is my cousin.’"*  

  5. **Swing votes side with friends, not motives.**  
     - *Fix:* Remind: *"Influence Chips determine your grade. Win your role’s victory."*  

  ---

  ### **WHAT THE GAME CAN’T REPRODUCE (DEBRIEF NOTES)**  
  - **Real-world stakes:** "Adults fear job loss, social exile, or hell. You felt game tension; they feel existential dread."  
  - **Power asymmetry:** "Board members have reputations; your roles were disposable."  
  - **The unspeakable:** "Some truths stay buried forever. What did *you* still not admit?"  
  - **Structural bias:** "‘Fact-only’ rules sound neutral but favor wealthy, educated voices with ‘data.’"  

  **Hand them this line verbatim:**  
  *"You just rehearsed the central paradox of pluralism: we ask people to leave their deepest convictions at the door to be ‘fair,’ then wonder why they’re silent or furious. Next time you’re in a real meeting, listen for what isn’t said—that’s where the novel lives."*  

  ---  
  This generates the raw emotional material you need: the clenched jaws during Round 1, the giddy terror of whispering taboo truths, the gasp when anonymous cards reveal hypocrisy. Run it tight to the timeline, and chapter nine will write itself.
