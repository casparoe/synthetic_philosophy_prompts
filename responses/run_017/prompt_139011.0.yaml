prompt: |-
  I'm making a handout for a reading group on collective cognition, and one of our sessions is the Aunt Hillary thing — whether an ant colony can have a mind. I want the handout to be the joint statement of a fake adversarial collaboration, so please draft the document itself, not an essay about the question.

  The two parties have been arguing past each other for a year:

  - the Cognitivist, who thinks the colony is where the mind is — the colony, not the ant, is what perceives, decides, remembers and has goals, and individual ants stand to the colony roughly as neurons stand to a brain;
  - the Skeptic, who thinks minds belong to organisms, the colony isn't an organism in the relevant sense, colony-level talk is a modelling convenience, and there's no subject there — nothing the colony is trying to do and nothing it's like to be it.

  Here's what I want in the document.

  A numbered agreed-claims section, and I want claims with actual bite in them, not "ants are interesting". Examples of the sort of thing I mean: no individual ant has anything remotely like a global representation of the colony's state; a true sentence about the colony (the colony is relocating to a better nest site) can be constituted entirely by the behaviour of ants that have no way of understanding that sentence; ants are themselves little agents with their own agendas — worker laying, policing, conflicts over who reproduces — in a way neurons are not, which puts pressure on the ant/neuron analogy; the number of "minds" in a nest is not something you can just read off. Give me whatever else genuinely belongs on the list, and don't pad it.

  Then a disagreements table: for each remaining disagreement, the neutral description, plus the formulation of it that each side would accept for its own view. No strawmanning on either side.

  Then the cruxes — the sub-questions where settling one would move at least one of them. For each crux: the wording each side accepts, one concrete case or observation both agree bears on it, and each side's prediction written down in advance. The four I definately want covered:

  1. The boundary crux. Which candidate system are we evaluating — the workers alone, workers plus queen, or workers plus the pheromone field and the nest architecture they build (the stigmergic substrate)? Both should say whether including the extended stuff changes their verdict, and if it doesn't, why not. My suspicion is that the Cognitivist's case quietly needs the environment included and the Skeptic's needs it excluded.

  2. The malfunction crux. When trail-following rules produce the ant mill — the rotating circle army ants get stuck in until they die of exhaustion — is that a colony-level cognitive failure, a breakdown of agency, or just a case where nothing was ever trying to do anything?

  3. The decision crux. In nest-site selection with scouts, tandem runs and quorum thresholds: is there something there that deserves to be called a decision with a point of no return, or are we narrativising a dynamical attractor? Say what observation would discriminate and what each predicts about it.

  4. The added-value crux. If the local-rules plus stigmergy model already predicts the behaviour, does the colony-level intentional description earn its keep or is it a redescription? I think part of this one is verbal — if you agree, say exactly which part, why, and what non-verbal residue is left.

  Add any crux you think is real that I've missed (I'm wondering about persistence: queen death, colony fission, and whether memories laid down in trails and nest structure outliving the workers who made them helps either side).

  Two more things: where a piece of the dispute is only about words, flag it as such rather than manufacturing a disagreement; and give me one thing each side would count as evidence against their own view.

  Format: numbered agreed claims, then the disagreements table, then cruxes with predictions. Please don't turn it into a verdict on who's right — I want the text both of them could sign. Don't cite anything or point at papers, the handout has to work on its own.
reasoning: |-
  We are drafting a joint statement from an adversarial collaboration between two parties: the Cognitivist and the Skeptic. The Cognitivist argues that the ant colony as a whole has a mind, analogous to a brain with neurons. The Skeptic argues that minds belong to individual organisms, and the colony is not an organism in the relevant sense; colony-level descriptions are merely useful models without real intentionality.

  The document must contain:
  1. A numbered list of agreed claims with "bite" (substantive, non-trivial).
  2. A disagreements table: for each disagreement, a neutral description and each side's formulation of their view.
  3. Cruxes: sub-questions that would move the debate. For each crux:
     - Wording each side accepts.
     - A concrete case or observation both agree bears on it.
     - Each side's prediction in advance.
     - We must cover: boundary, malfunction, decision, and added-value cruxes. Also, add any missing crux (like persistence).

  Additionally:
  - Where a dispute is only about words, flag it as verbal.
  - Give one thing each side would count as evidence against their own view.

  Format:
  - Agreed Claims (numbered)
  - Disagreements (table format, with columns: Disagreement, Neutral Description, Cognitivist's View, Skeptic's View)
  - Cruxes (each with: Crux Name, Agreed Wording, Concrete Case/Observation, Cognitivist's Prediction, Skeptic's Prediction)

  Let's build each part.

  ## Agreed Claims (Numbered)

  We need 5-10 agreed claims with bite. Examples from the user's request and additional ones:

  1. No individual ant possesses a global representation of the colony's state (e.g., the colony's overall food reserves, the decision to relocate, or the layout of the nest).
  2. A true description of the colony-level behavior (e.g., "the colony is relocating to a better nest site") can be constituted entirely by the actions of individual ants, none of which has access to the meaning of that description.
  3. Individual ants are, in some respects, agents with their own agendas (e.g., workers may lay eggs in violation of colony norms, engage in policing, or compete for reproductive opportunities) in a way that neurons are not.
  4. The number of "minds" in a nest is indeterminate without further criteria; it is not obvious whether we should count one (the colony), many (the ants), or something in between.
  5. Colony behavior emerges from local interactions and stigmergic processes (trails, pheromones, nest structures) without centralized control.
  6. The colony exhibits adaptive, goal-directed behavior at the collective level (e.g., foraging efficiency, nest defense, relocation) in response to environmental challenges.
  7. Individual ants have sensory and cognitive capacities (e.g., learning, memory) that neurons lack, but these are limited and context-specific.
  8. The colony persists over time despite turnover of individual ants, and its structure (nests, trails) can outlive the ants that built them.

  We'll select and refine about 6-8.

  ## Disagreements Table

  We need to list the core disagreements. Each row: 
  - Disagreement (topic)
  - Neutral Description
  - Cognitivist's View (as they would put it)
  - Skeptic's View (as they would put it)

  Possible disagreements:

  1. **The existence of colony-level cognition**: Does the colony as a whole have cognitive states (perception, decision, memory, goals)?
     - Neutral: Whether the colony is a genuine cognitive agent.
     - Cognitivist: The colony is the subject of cognitive states; it perceives, decides, remembers, and has goals.
     - Skeptic: Only individual ants have cognitive states; colony-level descriptions are useful fictions for modeling complex behavior.

  2. **The subject of experience**: Is there something it is like to be the colony?
     - Neutral: Whether the colony has subjective experience.
     - Cognitivist: There is a colony-level subjective experience (though perhaps very different from human experience).
     - Skeptic: There is nothing it is like to be a colony; subjective experience requires a unified biological organism.

  3. **The organism analogy**: Is the colony an organism?
     - Neutral: Whether the colony meets the criteria for being an organism in the context of cognition.
     - Cognitivist: The colony is a superorganism, and the ant/neuron analogy is apt for cognitive functions.
     - Skeptic: The colony is not an organism; it is a group of organisms, and the ant/neuron analogy breaks down because ants are not functionally equivalent to neurons.

  4. **The role of stigmergy**: Is the stigmergic substrate (pheromones, structures) part of the cognitive system?
     - Neutral: Whether the environment (pheromone trails, nest structures) should be considered part of the cognitive process.
     - Cognitivist: The stigmergic substrate is part of the colony's extended cognitive system, analogous to external memory.
     - Skeptic: The stigmergic substrate is part of the environment that the colony interacts with; it is not part of the cognitive system.

  We'll structure these in a table.

  ## Cruxes

  For each crux, we need:

  - Crux Name
  - Agreed Wording (a question both sides accept as capturing the issue)
  - Concrete Case/Observation (a specific scenario or experiment that both agree bears on the crux)
  - Cognitivist's Prediction
  - Skeptic's Prediction

  ### Crux 1: The Boundary Crux
  - **Agreed Wording**: "Which system is the candidate for having a mind: the workers alone, workers plus queen, or workers plus queen plus the stigmergic substrate (pheromone trails, nest structures)? And does including the stigmergic substrate change the verdict on whether the system has a mind?"
  - **Concrete Case**: Consider a scenario where the queen is removed but the workers and the stigmergic substrate (nests, trails) remain. Also, consider a scenario where the stigmergic substrate is artificially preserved (e.g., pheromones reapplied, nest structure maintained) but all ants are removed and replaced by new ants from a different colony.
  - **Cognitivist's Prediction**: If the stigmergic substrate is preserved and the colony (with new ants) resumes normal function, this supports the colony (including substrate) as the cognitive system. The queen is not essential for basic cognition (though for reproduction she is). Including the substrate is crucial because it is part of the colony's memory and cognitive processing.
  - **Skeptic's Prediction**: The colony cannot function without the queen (in species where she is essential for reproduction), but even if the substrate is preserved, the new ants must learn to use it. The substrate is not part of the cognitive system; it's an external tool. The mind is in the individual ants, so replacing them changes the system entirely.

  ### Crux 2: The Malfunction Crux
  - **Agreed Wording**: "When an ant mill occurs (ants following each other in a circle until exhaustion), is this a colony-level cognitive failure (a breakdown of agency) or a case where no agency was present to break down?"
  - **Concrete Case**: The ant mill phenomenon in army ants.
  - **Cognitivist's Prediction**: This is a colony-level malfunction, analogous to a seizure or cognitive breakdown in an organism, showing that the colony's decision-making system has failed.
  - **Skeptic's Prediction**: This is an emergent pathology from individual ants following simple rules; it doesn't represent a failure of agency because there was never an agent at the colony level.

  ### Crux 3: The Decision Crux
  - **Agreed Wording**: "In the nest-site selection process (with scouts, tandem runs, and quorum thresholds), is there a 'decision' with a point of no return, or is this merely a dynamical attractor we are narrativizing?"
  - **Concrete Observation**: Measure the time and commitment level (e.g., resource allocation) when a quorum is reached. Specifically, observe if there is a discontinuous change in behavior (e.g., a sudden shift of the majority of ants and brood to the new site) once a threshold is crossed, and if the colony ever reverses course after that point without external perturbation.
  - **Cognitivist's Prediction**: There will be a clear point of no return (e.g., after quorum, the move is irreversible without major disruption) and a discontinuous change, indicating a collective decision.
  - **Skeptic's Prediction**: The process is continuous and reversible; there is no sharp point of no return. The quorum is just a point in a dynamical system, and reversals can occur if conditions change.

  ### Crux 4: The Added-Value Crux
  - **Agreed Wording**: "Does describing colony behavior in intentional terms (e.g., 'the colony decided to relocate') add explanatory value beyond a mechanistic model of local rules and stigmergy, or is it merely a redescription?"
     - Note: Part of this is verbal. The non-verbal residue is whether the intentional description captures real patterns that the mechanistic model misses, such as robustness, flexibility, or counterfactual behavior.
  - **Concrete Case**: Consider a novel environmental challenge (e.g., a barrier that blocks the shortest path to a food source) and observe if the colony's response is better predicted or explained by an intentional stance (e.g., "the colony seeks to minimize energy expenditure") or by a mechanistic model.
  - **Cognitivist's Prediction**: The intentional stance will predict novel adaptive behaviors that the mechanistic model (without tuning) does not, showing that the colony acts as an agent with goals.
  - **Skeptic's Prediction**: The mechanistic model will account for all behaviors, and any apparent goal-directedness is an emergent property; the intentional stance adds no new predictive power.

  ### Additional Crux: Persistence
  - **Agreed Wording**: "When a colony undergoes queen death or fission, and when memories (e.g., trails, nest structures) outlive the workers that made them, does this support the colony as a persistent cognitive agent?"
  - **Concrete Case**: (a) Queen death: does the colony (workers) continue to function (foraging, defending) for a significant time without a queen? (b) Colony fission: when a colony splits, do both new colonies retain memories (e.g., use old trails or structures) and show adaptive behavior? (c) If a nest structure built by one set of workers is used by a completely new set of workers (after experimental replacement), does the colony "remember" (e.g., reuse efficient paths)?
  - **Cognitivist's Prediction**: In (a) and (b), the colony can persist without the queen and through fission, showing it is a durable agent. In (c), the new ants using the old structures show that the memory is stored in the substrate and the colony persists.
  - **Skeptic's Prediction**: In (a), without the queen, the colony is doomed and only exhibits residual behavior. In (b), fission creates two new colonies; the original one ceases to exist. In (c), the new ants learn anew; the structure is just an environmental feature, not a memory.

  ## One Thing Each Would Count as Evidence Against Their Own View

  - **Cognitivist**: If it were shown that the colony's behavior is entirely pre-programmed at the individual level with no flexibility to novel challenges that cannot be explained by the sum of individual rules, then the colony-level mind would be illusory.
  - **Skeptic**: If a colony were observed to exhibit behaviors that require long-term planning, error correction, or inference that cannot be reduced to the simple rules of individual ants and stigmergy, then that would suggest genuine colony-level cognition.

  Now, let's compile the document.
answer: |-
  ### Joint Statement: Adversarial Collaboration on Collective Cognition in Ant Colonies  
  **Parties:**  
  - **Cognitivist (Cog):** Argues the ant colony is a cognitive agent with perception, decision-making, memory, and goals. Individual ants function like neurons in a brain.  
  - **Skeptic (Ske):** Argues minds only belong to individual organisms. Colony-level descriptions are useful models, but there is no subject of experience or agency at the colony level.  

  ---

  #### 1. Agreed Claims  
  Both parties endorse the following substantive, non-trivial claims:  
  1. **No Global Representation in Individuals:** No individual ant encodes or accesses a global representation of the colony’s state (e.g., food inventory, nest relocation status, or colony health).  
  2. **Truth Without Comprehension:** Accurate colony-level descriptions (e.g., "the colony is relocating") can be constituted solely by the behavior of ants that cannot comprehend the description.  
  3. **Ants as Sub-Agents:** Individual ants exhibit agent-like behaviors (e.g., laying eggs, policing, or reproductive conflicts) in ways neurons do not, challenging direct analogies between ants and neurons.  
  4. **Indeterminacy of Minds:** The number of "minds" in a nest cannot be objectively counted (e.g., one colony-level mind vs. thousands of ant-level minds) without additional criteria.  
  5. **Stigmergic Dependence:** Colony behavior relies critically on self-organized environmental structures (e.g., pheromone trails, nest architecture), not just ant-ant interactions.  
  6. **Turnover Without Collapse:** Colonies maintain functional coherence despite worker turnover; structures/trails built by dead ants can guide future behavior.  
  7. **No Central Controller:** Colony behavior emerges from decentralized local rules; there is no "leader ant" or central processor.  

  ---

  #### 2. Disagreements  
  | Disagreement           | Neutral Description                                                                 | Cognitivist’s View                                                                                                | Skeptic’s View                                                                                                 |  
  |------------------------|-------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------|  
  | **Colony as Cognitive Agent** | Does the colony possess genuine cognitive states (perception, memory, goals)?       | "The colony is a unified cognitive agent; its collective states are irreducible to ant-level properties."         | "Colony-level 'cognition' is a useful metaphor for emergent behavior, but no agency or subjectivity exists." |  
  | **Subject of Experience**    | Is there something it is like to be the colony?                                     | "There is (minimally) a subject of experience at the colony level, though it may be alien to human phenomenology." | "Only individual ants have subjective experience; the colony has no 'what it is like'." (Note: Partly verbal—disagreement hinges on defining "experience.") |  
  | **Organismic Status**        | Is the colony an organism?                                                          | "The colony is a superorganism; functional integration justifies treating it as a biological individual."         | "Colonies are groups of organisms; they lack metabolic unity and organismic boundaries."                      |  
  | **Role of Stigmergy**        | Are environmental structures (e.g., trails) part of cognition?                      | "The stigmergic substrate is an extended component of colony memory and cognition."                               | "Stigmergy is an environmental interaction; calling it 'cognition' conflates the system with its environment." |  

  ---

  #### 3. Cruxes  
  Both parties agree that resolving these sub-questions would meaningfully advance the debate. Predictions are stated in advance of empirical testing.  

  **Crux 1: Boundary**  
  - **Agreed Wording:** "Which system is the candidate for cognition: workers alone, workers + queen, or workers + queen + stigmergic substrate? Does including the substrate change the verdict on whether cognition exists?"  
  - **Concrete Case:** Remove all ants from a functional nest but preserve the pheromone trails and architecture. Introduce new, naive ants. Observe if "memories" (e.g., optimized foraging paths) reappear without learning.  
  - **Cog Prediction:** Preserved structures will guide new ants to replicate colony behavior, proving the substrate is constitutive of cognition. Queen inclusion is irrelevant for basic cognition (e.g., foraging).  
  - **Ske Prediction:** New ants will ignore or relearn from scratch; the substrate is an environmental artifact, not cognition. The queen is essential for reproduction but not cognition.  

  **Crux 2: Malfunction**  
  - **Agreed Wording:** "Is the ant mill (circular death march) a colony-level cognitive failure or evidence that no agency existed?"  
  - **Concrete Case:** Army ants trapped in a circular trail until exhaustion.  
  - **Cog Prediction:** This is a pathological failure of collective agency, akin to a brain seizure.  
  - **Ske Prediction:** This is an emergent dysfunction of simple rules; no agency breaks down because none existed.  

  **Crux 3: Decision**  
  - **Agreed Wording:** "In nest-site selection (scouts, tandem runs, quorum sensing), is there a discrete ‘decision with a point of no return’ or merely a dynamical attractor we narrativize?"  
  - **Concrete Observation:** After quorum threshold is reached, measure if the colony instantly shifts resources (e.g., brood transport) to the new site and irreversibly abandons the old site.  
  - **Cog Prediction:** A discontinuous, irreversible shift occurs, reflecting a collective commitment.  
  - **Ske Prediction:** Transport increases gradually and reversibly; no "decision" beyond dynamics.  

  **Crux 4: Added Value**  
  - **Agreed Wording:** "Does intentional description (e.g., ‘the colony decided’) add explanatory power over mechanistic models (local rules + stigmergy), or is it a redescription? (Note: Partly verbal—‘explanatory power’ means predicting *novel* behaviors.)"  
  - **Concrete Case:** Introduce a novel obstacle (e.g., a bridge requiring detours) during foraging. Test which model better predicts adaptive solutions (e.g., trail reorganization).  
  - **Cog Prediction:** Only the intentional stance predicts flexible, goal-directed re-organization (e.g., rapid detour formation).  
  - **Ske Prediction:** Mechanistic models fully predict behavior; intentional language adds no novel insight.  

  **Crux 5: Persistence (Added)**  
  - **Agreed Wording:** "Does memory persistence in structures/trails during queen death or fission support colony-level cognition?"  
  - **Concrete Case:** Split a colony; preserve nest/trails in both halves. Observe if both halves "remember" learned behaviors (e.g., hazardous areas).  
  - **Cog Prediction:** Both halves retain "memories," proving cognition outlives individual ants.  
  - **Ske Prediction:** Each half relearns; persistence is environmental, not cognitive.  

  ---

  #### 4. Evidence Against Own View  
  - **Cognitivist:** "If colonies *never* adapt to novel threats (e.g., synthetic pheromone disruptors) in ways irreducible to individual ant rules, colony cognition would be unsupported."  
  - **Skeptic:** "If colonies *reliably* exhibit inferential learning (e.g., avoiding unseen threats based on indirect cues), this would suggest genuine cognition."  

  ---  
  **Signed,**  
  [Cognitivist]  
  [Skeptic]  

  *This document represents a collaborative effort to clarify disagreements, agreed truths, and testable predictions. No party endorses the other’s views, but both commit to empirical resolution of the cruxes.*
