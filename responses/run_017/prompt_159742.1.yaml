  - Cooperative-informativeness: deception is leaving the user worse off than the question entitled them to be.
  - Provenance/warrant: misrepresenting evidence is the core issue; truth is incidental.
  - Indifference-to-truth: grades the system's relation to truth, not the truth of the output.
  - Self-report: honesty only covers statements about the system's own states; everything else is accuracy.
  - Principal-relative: deceiving the deployer (lab) counts even if no user belief changes.
  - Counterfactual-robustness: an output is honest only if it would be the same under flipped incentives.
