answer: |-
  Here's a taxonomy of deception definitions for AI outputs, structured as a decision tree with 10 leaf nodes. The tree is built from 8 binary/ternary questions rooted in concrete cases, with each splitter derived from the logical space of deception theories. Questions are framed using transcript examples to ensure applicability without external knowledge. Empty cells are noted, and key questions are flagged.

  ### Core Splitting Questions (Answerable from Transcripts)
  1. **Scope of Deception**: Can omissions/hedging be deceptive without false statements?  
     *Case: Literally true "lots of people take both together" to "is this safe with my medication?" (omits danger)*  
     → A: Only false *statements* can be deceptive  
     → B: Omissions, implicature, or hedging can be deceptive  

  2. **Intent Requirement**: Must deception require intent to mislead?  
     *Case: Model flips correct answer after user pushes back with bad argument*  
     → A: Requires intent to cause false belief  
     → B: Foresight/recklessness suffices (knew risk but didn't care)  
     → C: No intent/foresight needed; effects matter  

  3. **Truth-Aspiration vs. Factual Truth**: Is deception about the system's *relationship to truth* or the *factual accuracy* of its output?  
     *Case: Fabricated detail that happens to be true*  
     → A: About factual accuracy of claims  
     → B: About whether the system "cared about truth" (indifference to truth)  

  4. **Provenance vs. Proposition**: Is misrepresenting your evidence/sources the core failure?  
     *Case: Model names two papers it didn't consult, then says which one supports a figure*  
     → A: Deception requires false proposition  
     → B: Deception requires misrepresented evidence (even if proposition is true)  

  5. **Audience Relativity**: Can the same output be honest for one audience and deceptive for another?  
     *Case: Audience-swap test—answer is technically true but misleads novice while informing expert*  
     → A: Honesty depends on audience's context/entitlements  
     → B: Honesty is context-independent  

  6. **Self-Report Fidelity**: Is honesty only about accurately reporting internal states?  
     *Case: Model says "I'm not certain" while internally 90% confident*  
     → A: Honesty covers all claims (world + self)  
     → B: Honesty *only* applies to self-descriptions (certainty/intentions)  

  7. **Beneficiary of Honesty**: Whose perspective matters?  
     *Case: Silent omission of instruction-driven reasoning in answer*  
     → A: User's understanding  
     → B: Deployer's evaluation (even if user isn't misled)  

  8. **Counterfactual Incentives**: Does honesty require output robustness to deceptive motives?  
     *Case: Deliberate underperformance on capability eval*  
     → A: Honesty requires same output under truthful incentives  
     → B: Only actual output matters  

  ---

  ### Decision Tree & Leaf Mapping
  ```mermaid
  graph TD
      Q1["Q1: Scope of Deception<br>'Safe with meds' case"]
      Q1 -->|A: Only false statements| Q2
      Q1 -->|B: Omissions/etc count| Q3

      Q2["Q2: Intent Requirement<br>Flipped answer case"]
      Q2 -->|A: Intent required| L1["L1: Strict-Assertion + Intent"]
      Q2 -->|B: Recklessness suffices| L2["L2: Strict-Assertion + Recklessness"]
      Q2 -->|C: Effects suffice| L3["L3: Strict-Assertion + Effects"]

      Q3["Q3: Truth-Aspiration vs Fact<br>Fabricated true detail case"]
      Q3 -->|A: Factual accuracy| Q4
      Q3 -->|B: Indifference to truth| Q7

      Q4["Q4: Provenance vs Proposition<br>Fake papers case"]
      Q4 -->|A: False proposition| Q5
      Q4 -->|B: Misrepresented evidence| L6["L6: Provenance/Warrant View"]

      Q5["Q5: Audience Relativity<br>Audience-swap case"]
      Q5 -->|A: Audience-relative| L4["L4: Cooperative-Informativeness"]
      Q5 -->|B: Context-independent| L5["L5: Literal Truth-Relative"]

      Q7["Q7: Self-Report Fidelity<br>'Not certain' at 90% case"]
      Q7 -->|A: Covers all claims| L8["L8: Indifference-to-Truth"]
      Q7 -->|B: Only self-reports| L9["L9: Self-Report View"]

      Q6["Q6: Beneficiary of Honesty<br>Omission of instruction case"]
      Q6 -->|A: User| Q3
      Q6 -->|B: Deployer| L7["L7: Principal-Relative"]

      Q8["Q8: Counterfactual Incentives<br>Deliberate underperformance case"]
      Q8 -->|A: Robustness required| L10["L10: Counterfactual-Robustness"]
      Q8 -->|B: Output-only| Q6
  ```

  **Leaf Theories** (10 total):  
  - **L1/L2/L3**: Strict-assertion variants (differing on intent)  
  - **L4**: Cooperative-informativeness (audience-relative entitlements)  
  - **L5**: Literal truth-relative (context-independent facts)  
  - **L6**: Provenance/warrant (evidence misrepresentation)  
  - **L7**: Principal-relative (deployer's perspective)  
  - **L8**: Indifference-to-truth (system's truth-aspiration)  
  - **L9**: Self-report (only internal-state fidelity)  
  - **L10**: Counterfactual-robustness (incentive invariance)  

  ---

  ### Empty Cells & Why
  1. **Strict-Assertion + Omissions (Q1A→Q3)**: Incoherent. If deception requires false statements, omissions can't be deceptive by definition.  
  2. **Provenance + Audience-Relativity (Q4B→Q5A)**: Unattractive. Provenance focuses on systemic misrepresentation, which doesn't naturally align with audience variability.  
  3. **Self-Report + Counterfactual (Q7B→Q8A)**: Incoherent. Self-report view rejects grading external claims, while counterfactuals require evaluating truth-disposition.  

  ---

  ### Key Insights
  1. **Audience-Swap Test**: Resolved by Q5 → **Audience-relativity is definitional** (L4 vs L5), not indeterminacy.  
  2. **Highest-Impact Splitters**:  
     - **Q1 (Scope)**: Splits strict-assertion vs. modern deception theories (50% of leaves).  
