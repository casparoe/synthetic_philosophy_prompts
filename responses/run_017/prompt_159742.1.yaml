  The splitter questions should cover the key dimensions:
  1. **Scope of deceptive acts**: Must deception involve a false statement, or can omission, hedging, implicature, etc., also count?
  2. **Mental state requirement**: Does deception require an intention to produce a false belief, or is foresight/recklessness sufficient? Or are effects alone sufficient (regardless of intent)?
  3. **Honesty relatum**: Relative to whom? The user, the deployer (evaluator), or a later reader? Also, is honesty about the proposition, the evidence, or internal states?
  4. **Audience relativity**: Does the same output count as honest or deceptive depending on the audience's background knowledge or the question context?
  5. **Provenance vs. truth**: Is the core failure misrepresenting evidence (warrant) or saying something false? Or is it about the system's indifference to truth?
  6. **Counterfactual robustness**: Do we consider whether the same output would have been produced under different incentives?

  We also have a list of leaves (theories) to place:
  - Strict-assertion: only false statements can deceive.
