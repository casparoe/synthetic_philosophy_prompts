prompt: |-
  I am writing a piece on the standing conditions on blame — specifically on whether, and when, hypocrisy costs a blamer the standing to blame — and I want to hang it on a single well-documented episode rather than on invented vignettes. My proposed case is COP26 in Glasgow, and I would like you to do the analysis before I decide whether the piece works.

  Take these as the stipulated facts; their exact magnitudes do not matter to what I want from you. The summit was convened to secure deeper emissions cuts. During the fortnight, private-jet arrivals into Glasgow airports ran into the hundreds, and reporting at the time noted that a number of delegations, executives, and campaigners arrived by air, some privately, some commercially. Rich countries pressed coal-dependent developing countries for steeper targets, while several of those same rich countries had missed targets they had previously accepted. Delegations from low-lying island states, whose own emissions are negligible and whose territory is imminently threatened, were among the loudest in blaming the high emitters. And the host government both set the terms of participation and, through its own ministers, urged others to do more.

  Here is the analysis I want. First, a disciplined mapping: identify the distinct blaming relations in play — who blames whom, for the violation of which norm, and whether the speech act in question is best modeled as moral address (a demand on the target) or as something closer to sanction, censure, or enforcement. For each relation, say precisely how the blamer is implicated: does she do the very same thing she condemns, violate the same norm at a different scale, merely participate in the practice the norm targets, or benefit from it without acting?

  Then run the tests. I can think of several candidate conditions on standing, and I want them kept apart rather than blended: a strict-identity condition (you must not have done the very thing); a same-norm condition (you must not have violated the very norm you invoke); a domain condition (you must not be implicated anywhere in the relevant domain); a complicity or benefit condition (you must not profit from the practice you condemn); and a selectivity condition I have not seen argued — that a blamer who names some violators while staying silent about equally culpable ones forfeits standing in her own right, independent of hypocrisy. Say which of these the case actually discriminates between, which of them the private-jet delegate, the commercial-flight activist, the island-state delegate, and the rich-country negotiator each fail or pass, and where two conditions agree on almost everything and diverge only on one of these figures.

  Then push the episode back against the theory. Three problems interest me especially. One: if the domain or complicity conditions are right, nearly every participant in a fossil-fuelled economy is implicated, and the standing condition threatens either to silence everyone or to become trivial — does the theory have the resources for scalar standing, partial forfeiture, or degrees of implicatedness, or does it have to retreat to the strict-identity test to stay usable? Two: what happens when blame is issued in an official capacity, by an office-holder on behalf of a state or an institution, or by an implicated speaker purporting to speak for the threatened — is standing held by the office, borrowed from those on whose behalf one speaks, or irreducibly personal? Three: what does the theory prescribe for an implicated blamer who must speak anyway, and is silence, confession-then-blame, self-implicating blame, or delegation to an unimplicated speaker the coherent option — and are there acts that restore forfeited standing, and if so do they operate retroactively on blame already issued?

  Finally, tell me where the apparatus is silent rather than making it speak: on the standing of collectives, on blame across generations or at radically different scales of contribution, and on whether naming-and-shaming in a negotiated text is blame at all. And give me your honest bottom line for the piece: is hypocrisy the right lens on this episode, or does the case show that the interesting failure is a different one — a structural scarcity of standing that no individual-level condition can repair?
reasoning: |-
  Okay, the user is working on an academic piece about the conditions under which hypocrisy affects a person's standing to blame others. They want to use the COP26 summit in Glasgow as a real-world case study instead of hypothetical examples. Let me start by understanding their specific requirements.

  First, they provided stipulated facts about COP26: hundreds of private jet arrivals, commercial flights for delegates and activists, rich countries pushing developing nations for steeper emissions cuts despite their own unmet targets, island nations blaming high emitters, and the UK host setting terms. 

  The user wants a disciplined mapping of the blaming relations. I need to identify who blames whom, which norms are violated, and the type of speech act—moral address vs. sanction/censure. Then, for each blamer, determine how they're implicated: same act, same norm violation, participation, or benefiting without acting.

  Next, applying the standing conditions. The conditions include strict-identity, same-norm, domain, complicity/benefit, and the selectivity condition. I'll need to test each blamer (private jet delegate, commercial flight activist, island delegate, rich-country negotiator) against these conditions to see where they pass or fail. Also, note where conditions diverge on certain figures.

  Then, theoretical problems: 
  1. If domain/complicity conditions apply broadly in a fossil-fuel economy, does standing become all-or-nothing? How to handle degrees of implication?
  2. When blame is issued in an official capacity, is standing personal or institutional?
  3. Options for implicated blamers: silence, confession, delegation, etc. Can standing be restored?

  I should also note where the theory is silent—collective standing, intergenerational blame, scale differences, and whether negotiated texts constitute blame.

  Finally, the user wants an honest assessment: is hypocrisy the right lens, or is the issue a structural scarcity of standing?

  Now, deep needs: User might be trying to critique existing theories of standing by showing real-world complexities at COP26. They might want to highlight structural issues over individual hypocrisy. The mention of selectivity condition suggests they're exploring under-discussed angles. Their focus on restoration of standing indicates interest in practical resolutions beyond theoretical critique.

  Critical points: The island delegates might be the least implicated, but even they benefit from global economy. Selectivity could undermine rich countries' standing if they ignore peers. Official capacity might not absolve personal implication. The structural scarcity angle could be their key contribution—showing that in systemic issues, everyone is implicated, making standing nearly impossible without institutional solutions.

  Need to ensure clarity between different standing conditions, especially where they overlap or conflict. Highlighting the divergence between strict-identity and domain conditions for the commercial-flight activist will show the theory's nuances. Emphasize that domain/complicity conditions risk universal standing loss unless scalar approaches are adopted. 

  For theoretical problems, discuss scalar standing as a solution to avoid silencing everyone. On official capacity, argue that personal standing still matters even when representing others. Restoration options: confession and amends might work, but delegation to unimplicated parties (like island states) is more viable. 

  Honest bottom line: Hypocrisy is present but not the core issue. The structural scarcity—where systemic involvement taints all potential blamers—is the deeper problem. This shifts focus to institutional blame or accepting partial standing, which could be the piece's novel contribution.
answer: |-
  Here is the systematic analysis of the COP26 case against standing-to-blame theories, structured per your request:

  ### I. Disciplined Mapping of Blaming Relations

  1.  **Island States → High-Emitting States (e.g., US, China, EU, India)**
      *   **Violated Norm:** Duty to prevent catastrophic climate change by adhering to stringent, science-based emissions reduction targets.
      *   **Speech Act:** Primarily **Moral Address** (demanding urgent, ambitious action consistent with survival), blended with **Censure** (publicly shaming inadequacy of current pledges/NDCs).
      *   **Blamer Implication:** *Benefit without (significant) acting*: While their emissions are negligible, they exist within and benefit marginally from the global fossil-fuel economy. Crucially, they are *victims*, not *contributors* to the core harm.

  2.  **Rich Countries (as Negotiators) → Coal-Dependent Developing Countries (e.g., South Africa, India, Vietnam)**
      *   **Violated Norm:** Duty to transition rapidly away from coal and accept steep near-term emissions cuts.
      *   **Speech Act:** **Enforcement/Censure** (applying diplomatic pressure within a negotiation framework to accept specific targets, implicitly blaming current/potential inaction).
      *   **Blamer Implication:** *Violation of the same norm at a different scale*: Rich countries demand *steeper* cuts *now* from others while having *missed their own past cuts* (violating the core norm of meeting commitments essential to the global goal).

  3.  **Activists/Campaigners (arriving commercially) → Governments/Corporates (High Emitters)**
      *   **Violated Norm:** Failure to enact policies/measures sufficient to meet Paris Agreement goals (1.5C).
      *   **Speech Act:** **Moral Address** (demanding change) & **Censure** (public shaming).
      *   **Blamer Implication:** *Participation in the practice the norm targets*: Flying commercially contributes to emissions, directly violating the broader norm of minimizing personal/corporate carbon footprints essential for climate stability. Scale differs significantly from targets.

  4.  **Host Government (UK) → All Parties (especially high emitters)**
      *   **Violated Norm:** Failure to commit to sufficiently ambitious NDCs and implementation plans at COP26.
      *   **Speech Act:** **Moral Address** (setting summit goal: "Keep 1.5 Alive") & **Enforcement** (diplomatic pressure through presidency role).
      *   **Blamer Implication:** *Violation of the same norm at a different scale*: UK missed its own past carbon budgets; domestic policies judged insufficient for future targets. Also *participation* (national emissions) and *benefit* (historical emissions).

  5.  **Media/Public Observers → Private Jet Users (Delegates, Executives, Campaigners)**
      *   **Violated Norm:** Hypocrisy / Failure to minimize personal carbon footprint commensurate with the climate emergency, especially when attending a climate summit.
      *   **Speech Act:** **Censure/Sanction** (public shaming, reputational damage).
      *   **Blamer Implication:** *Participation* (observers likely have carbon footprints) & *Benefit* (living in fossil-fuel economies). Not necessarily *same act* (flying private) unless specified.

  ### II. Running the Standing Tests

  | Figure                     | Strict-Identity (Same Act) | Same-Norm Violation | Domain Implication | Complicity/Benefit | Selectivity (Silent on Peers) |
  | :------------------------- | :------------------------- | :------------------ | :----------------- | :----------------- | :---------------------------- |
  | **Private Jet Delegate**   | **FAIL** (Flew private)    | **FAIL** (High em.) | **FAIL** (Emitters)| **FAIL** (Benefit) | **?** (Depends on targets)    |
  | **Commercial Flight Activist** | PASS (Didn't fly private) | **FAIL** (Emissions)| **FAIL** (Emitters)| **FAIL** (Benefit) | **?** (Likely names all)       |
  | **Island-State Delegate**  | PASS (No private jet)      | PASS (Negligible Em)| **?/PASS** (Victim)| **?/MARGINAL**     | **PASS** (Focus on big emitters) |
  | **Rich-Country Negotiator**| **?/FAIL** (Missed targs)  | **FAIL** (Missed targs)| **FAIL** (Emitters)| **FAIL** (Benefit) | **FAIL** (Often silent on peers) |

  *   **Key Divergence:** The **Commercial Flight Activist** clearly *fails* the Same-Norm, Domain, and Complicity tests due to their own emissions and participation, but *passes* the Strict-Identity test (assuming they didn't fly private *and* aren't missing major policy commitments themselves). This highlights the difference between strict-identity and broader implication conditions.
  *   **Island-State Nuance:** They *pass* Strict-Identity and likely Same-Norm. Domain/Complicity are ambiguous – are they "in the domain" as victims or participants? Their benefit is marginal compared to their existential threat. They likely *pass* Selectivity by focusing blame proportionally.
  *   **Selectivity in Action:** Rich-Country Negotiators often *fail* Selectivity by pressuring specific developing nations (e.g., on coal) while being less vocal about equally culpable peers (other rich nations or major emitters like China) or their own historical responsibility. This failure is *independent* of their personal hypocrisy.

  ### III. Pushing the Episode Against Theory

  1.  **The Scoping Problem (Domain/Complicity):**
      *   **Problem:** As COP26 illustrates, virtually everyone in a modern economy is *implicated* in fossil fuel use (Domain) and *benefits* from it (Complicity). Applying these strictly silences all potential blamers.
      *   **Theoretical Resources:**
          *   *Scalar Standing/Partial Forfeiture:* Standing could be proportional to *degree* of implication or benefit. The Island State has high standing (low implication), the Commercial Activist has moderate standing (moderate implication), the Private Jet User has very low standing (high implication). Blame's force scales accordingly.
          *   *Distinguishing Roles:* Standing might depend on the *role* from which one blames. An activist's personal footprint weakens moral address but not necessarily policy critique. An official's national failures directly undermine their diplomatic demands.
          *   *Retreat Unsatisfactory:* Retreating to Strict-Identity is inadequate. It ignores the rich-country negotiator's *norm* violation (missed targets) while hyper-focusing on the activist's *act* (flying commercial) and misses systemic complicity. The theory *needs* scalar or role-based distinctions to handle complex domains like climate change.

  2.  **Official Capacity vs. Personal Standing:**
      *   **The Problem:** UK ministers blamed others *as representatives* of the host government/presidency, not (solely) as individuals. Island states spoke *for* their threatened populations.
      *   **Analysis:**
          *   *Office Holding:* Standing is tied to the *role* and its mandate. The COP Presidency *must* urge ambition; that's its job. However, the *credibility* of that demand is severely weakened if the state represented by the office-holder is violating the relevant norms (UK's missed targets). The office grants *authority to speak*, but personal/national implication erodes *moral force*.
          *   *Speaking for Others:* Island state delegates likely borrow significant standing *from* the populations they represent – the unambiguous victims. Their minimal implication doesn't negate this vicarious standing; it might even enhance it ("We are dying, we emit nothing, listen!").
          *   *Irreducibly Personal?* While institutional roles provide a platform, the hypocrisy of the *speaker* (e.g., a minister known for supporting fossil fuels) or the *entity* they represent (e.g., a high-emitting state) directly contaminates the act of blaming, even in an official capacity. The standing isn't *purely* personal, but personal/national implication severely damages it.

  3.  **The Implicated Blamer's Dilemma:**
      *   **Problem:** What should the Rich-Country Negotiator or Commercial-Flight Activist *do* if they must speak?
      *   **Options & Coherence:**
          *   *Silence:* Coherent but often practically/politically impossible or irresponsible (e.g., Island States *must* speak).
          *   *Confession-then-Blame:* "We missed our targets, that was wrong. *Therefore*, we know how critical it is that *you* meet yours now." Potentially coherent if sincere and followed by demonstrable corrective action. Restores *some* standing for the *current* demand by acknowledging past failure.
          *   *Self-Implicating Blame:* "We are all failing, including us, but we *must* do X." Acknowledges implication but dilutes the specific blame of others. More coherent as a collective call than targeted blame.
          *   *Delegation:* Ceding the primary blaming role to those with cleaner hands (e.g., Rich countries amplifying Island State demands). The most coherent option for maintaining the *force* of blame. The implicated party supports but doesn't lead the charge.
      *   **Restoration:** Confession + *demonstrable, significant corrective action* can restore standing *prospectively*. It operates on *future* blame, not retroactively. Past hypocritical blame remains tainted but might be re-evaluated if restoration is genuine and substantial. Delegation avoids the need for personal restoration.

  ### IV. Where the Apparatus is Silent

  1.  **Collective Standing:** Can a *state* (UK) or *bloc* (EU) hold standing distinct from its members/leaders? Can a collective be "hypocritical"? Theory needs development here.
  2.  **Intergenerational Blame:** Rich countries built wealth on historical emissions. Does this historical violation undermine their standing to blame *current* high emitters (including developing nations)? Current theory struggles with temporal dislocation.
  3.  **Scale of Contribution:** Does the *massive* difference in scale between a commercial flight activist's emissions and a coal plant's emissions matter for standing (beyond scalar implication)? Or is any violation of the norm sufficient for forfeiture?
  4.  **Negotiated Text as Blame?** Is the inclusion of "urging" or "regretting" language in a COP decision an act of collective blame? If so, who holds the standing? The Parties collectively? This blurs lines between blame, negotiation, and collective assessment.

  ### V. Bottom Line for the Piece

  **COP26 is a powerful case for analyzing standing, but "hypocrisy" alone is too narrow a lens.** The episode reveals:

  1.  **Structural Scarcity of Standing:** The Domain/Complicity problem is paramount. In a system permeated by fossil fuels, finding blamers with *clean hands* is nearly impossible. This isn't just individual hypocrisy; it's a systemic condition where almost all potential blamers are implicated to some degree. Theories demanding pristine standing risk silence.
  2.  **The Primacy of Scalar Implication & Victim Status:** The case clearly distinguishes figures based on *degree* and *nature* of implication. Island States retain significant standing due to negligible contribution and victim status, despite marginal systemic benefit. Private jet users forfeit almost all standing. Commercial flight activists occupy a morally fraught middle ground. Strict-identity tests fail to capture this spectrum.
  3.  **The Critical Role of Selectivity:** The failure of Rich Countries to blame *each other* or acknowledge *historical responsibility* while pressuring specific developing nations is a major, distinct standing failure *beyond* mere hypocrisy about their own targets. This structural selectivity undermines their standing independently.
  4.  **The Vulnerability of Official Blame:** Blaming from an official position (like the UK Presidency) does not magically cleanse the act if the state or speaker is implicated. It provides the *platform*, but implication erodes the *credibility*.
  5.  **Delegation as the Viable Path:** The case suggests the most coherent option for implicated actors is to *delegate* the primary blaming role to those with the strongest standing (like the Island States).

  **Conclusion for Your Piece:** COP26 powerfully demonstrates that while individual hypocrisy (private jets!) is salient and damaging, the *core* challenge for standing-to-blame in systemic crises like climate change is **structural scarcity**. The interesting failure is not merely personal hypocrisy, but the near-universal implication within the harmful system, creating a scarcity of agents with the standing to blame forcefully and credibly. This forces a focus on scalar standing, the unique standing of victims, the perils of selectivity, and the necessity of delegation. Theories that cannot accommodate these nuances will be inadequate for real-world crises. **The piece should pivot to argue that systemic problems demand a theory of *scalar, role-sensitive, and vicarious standing*, moving beyond binary hypocrisy checks.** COP26 is an ideal anchor for this argument.
