prompt: |-
  Hey — I've been going back and forth on which disputes are really disputes and which are just fights about words, and I keep catching myself applying different standards in different cases. I'd like to know whether there's a principle that actually captures what I believe, or whether some of my verdicts just have to go.

  The rough test I've been using: a dispute is merely verbal if you could hand both sides the other person's definition, have them read it, and the fight dissolves — nobody has to give up any belief about how the world is, they just both go "oh, fine, then I agree." Call it the swap test. It handles the easy cases, but I think it misclassifies a few and I can't tell whether to patch it or junk it.

  My verdicts:

  1. Hotdog/sandwich. Guy at work says a hotdog is a sandwich, I say it isn't. We agree about the bread, the sausage, the hinge, everything physical. Verdict: totally verbal, and kind of a waste of breath.

  2. Brain death. My uncle, massive stroke, no brain activity, heart still going on the ventilator. My sister says he's alive, I say he isn't. We agree about every cell in his body. Verdict: not merely verbal, and it obviously matters. But by the swap test it should be verbal — hand her my definition of death and she'll agree he's dead under it, and vice versa. So the swap test is already in trouble, or I have to introduce a category of "verbal but not trivial," which feels like the concept coming apart in my hands.

  3. Composition. My friend says there's a table in the room; I've read too much philosophy and say there are only particles arranged tablewise. We agree about all of them and their arrangement. Verdict: I want to say substantive — and it bugs me that I can't say why, because structurally this looks exactly like 1 and 2.

  4. Pluto. Astronomer says it's not a planet, my nephew is furious. They agree about the orbit, the mass, the composition. Verdict: verbal. But I also want to say the astronomer's side is *better* — not more true, just better, like the definition earns its keep. I don't know how to fit "verbal, but one side is winning" into a picture where verbal disputes are ones where both sides can be faultlessly right.

  5. Race in a medical risk model. One researcher wants the variable kept, the other wants it dropped. They agree on the genetics, the outcomes, all the social facts; neither denies anything the other asserts. Verdict: definitely not merely verbal, there's something real at stake — but the disagreement isn't factual either, it seems to be about which concept we ought to use. Someone told me this is called metalinguistic negotiation. Fine. But then what makes 5 real while 4 isn't? Both look like arguments about which concept to use, and I have opposite reactions.

  6. The one that's actually breaking my brain. A says there's a table. B says there are only simples arranged tablewise. C says there is exactly one thing, the whole cosmos. B-vs-C feels genuinely incompatible to me in a way A-vs-B doesn't — like there's a real question about how many things there are and one of them is answering it wrong. And A-vs-C also feels like a real clash. But that makes "merely verbal" non-transitive, or worse, makes it look like I've got two different notions and I'm switching between them without noticing. Is it transitive on your account, and if not, what does that tell me?

  7. Empty or mismatched concepts. Two people argue about whether witches exist: one means a woman who made a pact with the Devil and can fly, the other means a practitioner of a certain folk healing tradition. Verdict: I don't want to call it verbal at all — I want to say they aren't disagreeing, and that the first one is wrong about something. Is "not a genuine dispute" a third category, or does any principled account collapse it into one of the other two?

  So: can you state one principle, or two or three rival candidates, that gets as many of these as possible? I'd like to know which case forces which clause, what the principle predicts for cases I haven't listed (three I'm curious about: the version of case 1 where the city tax code really does exempt sandwiches but not hotdogs; a dispute between two people who don't share a language and are working through a translation; and a modal one, like two people agreeing on what a given table is made of but disagreeing about whether that very table could have been made of ice), and — most useful part — which of my verdicts it can't swallow, and why you'd rather overturn my verdict than add another clause. Also: is the swap test salvageable by bolting on a "nothing important hangs on it" condition, or does that just smuggle the normative stuff in through the back door?
reasoning: |-
  Okay, let's tackle this user's problem. They're struggling with distinguishing verbal disputes from substantive ones. The swap test they've been using works for simple cases like the hotdog debate but falls apart with more complex ones like brain death. 

  First, I need to understand their core issue. They want a principle that explains all their verdicts without contradictions. But their cases show conflicts: brain death feels substantive despite passing the swap test, while Pluto is verbal but one definition is better. Then there's metalinguistic negotiation in the race variable case, which isn't factual but has real stakes. 

  The transitive problem in case 6 is tricky. A vs B is verbal, B vs C feels substantive, so non-transitivity suggests "merely verbal" isn't a fixed property. Maybe context matters. Case 7 with witches isn't a dispute at all—different concepts entirely. 

  Chisholm's Principle comes to mind: if disputes persist after disambiguation, they're substantive. But in brain death, disambiguating "alive" might not resolve it because of normative weight. For Pluto, disambiguation doesn't help since both agree on facts but prefer different classifications. 

  Perhaps the key is separating factual from normative elements. Brain death involves ethical implications, making it non-verbal despite shared facts. The race variable is about which concept serves better in a model, which is normative. Pluto is verbal because the facts aren't contested, only the label's utility.

  For case 6, non-transitivity arises because "merely verbal" depends on the contrast. B and C disagree on fundamental ontology, which isn't just about words. The swap test might be salvageable by adding that no important non-linguistic stakes exist, but that introduces subjectivity. 

  The user's verdicts might need adjustment. Maybe brain death is verbal in definition but the implications make it feel substantive. The race variable case could be seen as verbal if both agree on data but differ on variable inclusion based on goals. 

  Ultimately, the principle should have layers: factual equivalence, normative stakes, and pragmatic utility. Cases like the tax code hotdog would be substantive because legal definitions have real consequences, showing context matters. 

  The user might need to accept that some disputes are verbal in one context but substantive in another. The swap test can be modified but requires incorporating the stakes, which are context-dependent. Their intuition about brain death being substantive is valid because of the ethical weight, even if definitions are swapped.
answer: |-
  Here's a principled framework that captures most of your intuitions while explaining tensions and suggesting where your verdicts might need refinement. The core idea combines **factual equivalence** with **metalinguistic negotiation over conceptual utility**:

  ### Proposed Principle
  A dispute is **merely verbal** if and only if:
  1.  **Factual Agreement:** Parties agree on all non-linguistic facts (physical, social, mathematical, etc.), AND
  2.  **Non-Normative Stakes:** The dispute *solely* concerns which linguistic convention (word-meaning mapping) to adopt, with no significant practical, ethical, or theoretical consequences hinging on that choice.

  ### Why This Works (and Where It Doesn't)
  Applying this to your cases:

  1.  **Hotdog/Sandwich:** ✅ *Merely verbal.* Agreement on all physical facts. No significant stakes (unless tax codes apply – see below).
  2.  **Brain Death:** ❌ **NOT merely verbal.** While parties agree on cellular facts, the *definition* of "alive/dead" has massive normative stakes (when to withdraw care, organ donation eligibility, inheritance, grief). It's a **high-stakes metalinguistic negotiation** about which concept best serves our ethical/legal purposes. The swap test fails because swapping definitions doesn't dissolve the *normative disagreement* about which definition *should* be used.
  3.  **Composition (Table/Particles):** ❌ **NOT merely verbal (by your intuition).** Why? While agreeing on particle arrangements, the dispute reflects deep ontological commitments (universalism vs. nihilism) with implications for metaphysics, logic, and perhaps even AI ontology. It's a **low-stakes metalinguistic negotiation** about fundamental categories. The "substance" is conceptual/philosophical, not physical.
  4.  **Pluto:** ✅ *Merely verbal.* Agreement on all astronomical facts. The dispute is purely about which taxonomic convention (definition of "planet") is most *useful* for scientific communication/categorization. One side is "winning" because their definition has greater **pragmatic utility** (e.g., reflects orbital dominance, simplifies classification). No deep normative stakes.
  5.  **Race in Medical Model:** ❌ **NOT merely verbal.** Agreement on genetic/social/outcome facts. The dispute is about which *concept* ("race" as a variable) is most **appropriate/pragmatic/ethical** for modeling. High practical stakes: potential for medical harm, reification of social constructs, resource allocation. Classic **high-stakes metalinguistic negotiation.** Differs from (4) because utility here has direct ethical and practical consequences.
  6.  **Ontology Chain (A/B/C):** **Explains Non-Transitivity.** A-vs-B: Mereological Nihilism vs. Commonsense (like 3) – *Not merely verbal* (ontological commitment). B-vs-C: Nihilism vs. Monism – *Not merely verbal* (fundamental ontological disagreement: "How many things fundamentally exist?"). A-vs-C: Commonsense vs. Monism – *Not merely verbal* (different fundamental ontologies). The key is that B and C disagree on a *fundamental* ontological fact (the number of basic entities), not just labels for agreed structures. "Merely verbal" isn't a property of *pairs of statements* alone; it depends on the **underlying commitments** of the speakers. Your intuition tracks the depth of the ontological rift.
  7.  **Witches:** ✅ **Not a genuine dispute.** Parties aren't even referring to the same *type* of thing. It's a **referential mismatch.** One asserts a false empirical claim ("Women can fly via Devil pact"), the other asserts a true one ("Some women practice folk healing"). The principle correctly classifies this as *not* a dispute resolvable by semantic negotiation – one side is factually wrong.

  ### Addressing Your Specific Queries

  *   **Tax Code Hotdog:** **NOT merely verbal.** While the *physical facts* are agreed, the *legal facts* and their consequences (tax liability) depend entirely on which definition the code adopts. This injects significant **pragmatic/normative stakes**.
  *   **Cross-Language Dispute:** Depends on *why* they disagree. If they agree on all observable facts but disagree due to translation ambiguity about a word/concept (e.g., arguing over "Schadenfreude" because one language lacks a direct equivalent), it *could* be merely verbal once translation is clarified. If they disagree on facts, it's substantive.
  *   **Modal Table (Could it be ice?):** ❌ **NOT merely verbal.** They agree on the actual physical composition but disagree about the *modal properties* (essential properties) of the object – a fundamental metaphysical disagreement about identity conditions. This is substantive philosophy.

  ### Is the Swap Test Salvageable?
  Yes, but only with a **major revision incorporating stakes:**

  > **Revised Swap Test:** A dispute is merely verbal *only if*:
  > 1.  Swapping definitions dissolves the conflict *and*
  > 2.  **No significant practical, ethical, or theoretical consequences** depend on which definition prevails.
  >
  >This explicitly builds normativity/pragmatics into the test. Brain Death (2), Medical Race (5), and Tax Hotdog all fail (2). Pluto (4) passes both.

  ### Which Verdicts Might Need Adjustment & Why

  *   **Brain Death (2):** Your verdict (substantive) is correct. The principle justifies overturning the naive swap test result because of normative stakes. Don't call it "verbal but not trivial" – call it a **substantive metalinguistic negotiation**.
  *   **Composition (3):** Your verdict (substantive) stands. The principle explains why it *feels* different from (1): it involves conceptual commitments with (low-stakes) theoretical implications.
  *   **Pluto (4):** Your verdict (verbal) stands. The "winning" side is about **pragmatic superiority**, not truth. Both definitions can be "faultlessly right" *as conventions*, but one convention is demonstrably *more useful*.
  *   **Race (5) vs. Pluto (4):** Your different reactions are justified. Pluto is low-stakes convention-setting. The medical race debate is high-stakes, involving ethics, social harm, and modeling efficacy. The principle distinguishes them via **consequence-dependence** (condition 2).
  *   **Ontology (6):** Non-transitivity is expected and correct. It reflects the **depth of the conceptual divergence**. A/B share a commitment to composite objects (differing on *which* composites are fundamental). B/C disagree on the *existence* of composites *at all*. The principle handles this via the **nature of the underlying agreement/disagreement**.

  ### Conclusion
  Your core intuition is sound: disputes are merely verbal when parties agree on the world but only disagree on words. The key refinement is recognizing that **"agree on the world" must include *all* relevant non-linguistic facts (including normative/social consequences),** and that **some verbal disagreements have high stakes because the *choice* of word/concept has real-world impacts.** The revised principle:
  1.  Captures your verdicts on 1, 4, 5, 6, 7.
  2.  Explains *why* 2 and 3 feel substantive despite superficial similarity to 1 (normative stakes / ontological commitments).
  3.  Explains the non-transitivity in 6 (differing depths of conceptual agreement).
  4.  Salvages the swap test by explicitly adding a "no significant stakes" condition, acknowledging that normativity is essential to the distinction.

  The only minor tension is with **Pluto (4)** – you sense one side is "winning." The principle accommodates this: the dispute is verbal (both definitions are *valid* conventions), but pragmatic utility makes one convention *objectively better* for the scientific purpose. This doesn't make the dispute substantive; it makes the choice of convention rationally guided. Your verdict holds.
