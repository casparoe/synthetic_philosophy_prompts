prompt: |-
  I moderate a fairly big survival/crafting server — the kind where people sink months into building one thing — which means I'm the one who ends up deciding whether to roll something back after a dispute. I make these calls on gut and my gut calls don't obviously line up with each other. I'd like to know what principle, if any, is behind them, and which ones I should stop trusting.

  Here are the rulings roughly as I actually make them:

  1. A player spends about three months of evenings farming a rare drop. Another player talks them into a trade and swaps in a lookalike item at the last second. I roll it back and I ban. That feels like theft and I don't think I'm being sentimental about it.

  2. Two players fight in the area where the server rules say open season, and the loser drops a couple hours worth of gear. I do nothing. That's the game, they both opted in.

  3. Same as 2, except afterwards the winner goes and messages the loser's friends to laugh at them, and the loser quits the server. Now I feel like something extra happened that I should respond to, and I genuinely can't tell whether to file it as the same kind of thing as 1 or as something else entirely.

  4. Someone builds an enormous cathedral on a private creative plot nobody else can enter. Another player finds an exploit, gets in, and levels it — and records it and posts the video. I feel distinctly worse about the version where they recorded it than the version where they didn't. That seems backwards, since the cathedral is equally gone either way, so maybe I'm reacting to something other than the loss.

  5. Someone tells me their account was hacked and their stuff deleted. They hadn't logged in for over a year and never came back, so far as I can tell they never found out. I still think something bad happened. But I can't say who is worse off, and it feels weaker than 1 in a way I can't articulate.

  6. There's a duping bug and an item that almost nobody had becomes worthless overnight because everyone has it. Nothing was taken from anybody. I still feel the person who originally farmed it got done an injury, and I don't know what to call it if it isn't theft.

  7. Stealing in-game currency that can be sold for real money feels more like actual theft to me than stealing the same amount of currency that can't be traded out. But I don't want to conclude that the untradeable case isn't theft, so I don't know what to do with this feeling.

  8. A player buys a cosmetic with real money and a year later the devs give it away free. I think he has no complaint whatsoever, even though I think 1 is serious. Maybe the difference is that in 1 a person did it and here nobody did?

  9. A player kills an NPC questgiver and the whole server is locked out of that questline for a week. I treat that as real interference, closer to 1 than to nothing, even though the NPC isn't anyone and respawns anyway. I'm more confident about this than I am about 5, which strikes me as odd.

  10. I read once about an old text-only online world where a player ran something that made other players' characters carry out sexual actions in a public room — no physical contact anywhere, everyone anonymous. That one I'm confident about: serious harm, one of the clearest items on my list. But I also think a player who is upset because someone mocked their character's haircut has not been harmed. My confidence in those two is miles apart and I want to know what exactly separates them.

  The rule of thumb I keep half-reaching for is: a virtual thing is real when it's scarce under the rules, somebody had to work for it, and other people can see it. But that seems to predict 4 should be the worst thing on the list and 9 should be nothing, and it gives me no grip at all on 6 or 5.

  So: is there one principle that gets these, or a small set of candidates? State it tightly enough that I could actually read it out in a ruling, tell me which clause is doing the work in which case, and please say which of my verdicts it can't accommodate and wants me to drop — I'd rather give up a gut call than keep a rule with four special exemptions.

  And tell me what it predicts on cases I haven't had yet: a single-player permadeath run that no one will ever see; a world built from a seed that will never be generated again; a companion character in a game someone has talked to for two hundred hours that a patch deletes; and whether it should matter if the world is text-only versus full VR with haptics. My head says it shouldn't matter and my chest says it obviously does.

  Please don't just tell me virtual property is real property or that it's all just numbers in a database. I've heard both, and neither one helps me make a call at 11pm on a Tuesday.
reasoning: |-
  Okay, the user moderates a large survival/crafting server where players invest significant time into their creations. They need a consistent principle to handle disputes because their gut reactions are inconsistent. Let me look at their examples to find a pattern.

  First, they mention a player tricked into trading a rare item after months of farming. The mod rolls it back and bans the scammer. That feels like theft. Then, in PvP where gear is lost fairly, no action is taken. But if the winner harasses the loser causing them to quit, that's different. Why? The loss itself isn't the issue; the harassment led to someone leaving the community.

  Next, someone destroys a cathedral using an exploit. Recording and posting the video makes it worse. The destruction is the same, but the recording adds public humiliation. The harm isn't just the loss of the build but the social aspect—shaming the creator.

  When an account is hacked but the player never returns, the mod feels something bad happened even though no one seems affected. Contrast this with an NPC questgiver killed, locking the server out for a week. That disrupts many players, so it's more actionable. The key here is the impact on active participants.

  Duping makes a rare item worthless. The original farmer feels wronged, but no theft occurred. It's about devaluing effort without consent. Similarly, stealing tradeable currency feels worse than non-tradeable because real money is involved. The potential for real-world loss intensifies the harm.

  A cosmetic bought with real money later given free isn't a complaint. No individual harmed the player; it's a system change. But in the scam case, a person intentionally deceived. Agency matters—malicious intent versus impersonal changes.

  The text-based sexual coercion case is clearly harmful due to violation of consent and public humiliation. Mocking a haircut is trivial. The difference is the severity of the social harm and violation.

  The user's half-formed rule about scarcity, effort, and visibility doesn't explain why recording the destruction (case 4) worsens it or why the NPC kill (case 9) is serious. They need a principle that accounts for harm to players' agency, social standing, and community disruption.

  The core elements seem to be: harm to another player's agency (deception, coercion), harm to social standing (public shaming), and harm to community (disruption, loss of participants). Cases like hacking an inactive account (5) have less impact because the player isn't present, while duping (6) devalues effort but lacks malicious intent.

  For future cases: a single-player permadeath run unseen by others—no social harm, so no moderation needed. A unique world seed—community value if shared, but not if private. Deleted companion character—emotional harm from loss of time investment, but unless malicious, it's a system issue. VR vs text—immersion might heighten experience, but harm principles should apply similarly, focusing on the actions' effects.

  The proposed principle combines intentional harm, violation of consent, and community impact. It addresses the existing cases and provides a framework for new ones without special exemptions. The mod should drop the gut feeling in case 5 (hacked inactive account) since no active harm occurred, and case 6 (duping) as a system flaw, not player malice. This creates consistency and actionable rulings.
answer: |-
  Here's a principle derived from your cases, designed to be actionable and consistent, with minimal exceptions. It focuses on **Harm to Player Agency and Community Participation**:

  **"I will intervene when an act (1) *intentionally* harms another player's (2) *invested agency* or (3) *voluntary participation in the community*, and the harm (4) *significantly impedes* their ability to engage with the server as intended."**

  **Breakdown of Clauses:**
  1.  **Intentional Harm:** The act must be deliberate malice or exploitation, not emergent gameplay, accidents, or system changes.
  2.  **Invested Agency:** Harm targets a player's *demonstrated effort and choice* in creating, acquiring, or controlling something meaningful *to them* within the game world (builds, rare items, quest access, character control, social standing).
  3.  **Voluntary Participation:** Harm targets a player's ability or willingness to freely interact within the server community without coercion, harassment, or severe public humiliation.
  4.  **Significant Impediment:** The harm must be substantial enough to materially degrade the victim's experience or drive them away, not merely annoy or inconvenience them.

  **Applying the Principle to Your Cases:**

  1.  **Scam Trade:** **Intervene.** (1) Intentional deception. (2) Harms invested agency (months of farming effort stolen). (3) Harms participation (victim likely feels betrayed & unsafe trading). (4) Significant loss.
  2.  **Fair PvP Loss:** **No Action.** (1) Intentional combat, but within agreed rules. (2) Loss is inherent risk of *chosen* PvP agency. (3) No attack on participation itself. (4) Loss is recoverable gameplay setback.
  3.  **PvP + Harassment:** **Intervene (Ban/Warn Harasser).** (1) Intentional harassment post-fight. (2) Attack on social standing/effort (mocking the loss). (3) *Directly harms participation* (victim quits the server). (4) Significant harm to community retention. *(This focuses on the harassment, not the PvP loss).*
  4.  **Exploit Destruction (Recorded):** **Intervene (Rollback + Ban).** (1) Intentional exploit & destruction. (2) Harms invested agency (massive build effort destroyed). (3) *Recording amplifies harm to participation* - adds public humiliation/shame, attacking the builder's social standing within the community. (4) Significant loss + amplified social harm. *(The recording transforms it from property damage into a public attack on the creator's place in the community).*
  5.  **Hacked Inactive Account:** **No Action (or Minimal).** (1) Intentional harm (hacking). (2) Harms invested agency (assets deleted). (3) *BUT: No demonstrable harm to participation* (player was already inactive & unaware). (4) *No significant impediment to an active player's engagement.* (Gut call rejected: Harm requires an active victim).
  6.  **Duping Devalues Effort:** **No Action (Fix Bug).** (1) May involve intentional exploitation, but... (2) Harms *perceived value* of invested agency, not the agency/items themselves. (3) No direct attack on a specific player's participation. (4) Widespread economic shift, not targeted significant impediment to a specific player's engagement. (Gut call rejected: Not theft or direct harm).
  7.  **Stealing RMT Currency:** **Intervene (Same as 1, possibly stronger).** (1) Intentional theft. (2) Harms invested agency (effort to acquire). (3) *Potentially* harms real-world participation if RMT is allowed/implied. (4) Significant loss + *potential real-world consequences* amplify the harm to agency/participation. *(The RMT link strengthens clause 4 - impediment extends beyond the game)*.
  8.  **Cosmetic Devalued by Devs:** **No Action.** (1) No intentional harm *by another player*. (2) Harm to perceived value of agency, not the agency itself (they still have the item). (3) No attack on participation. (4) Change in system status, not targeted harm causing impediment.
  9.  **Killing NPC Questgiver:** **Intervene (Rollback/Punish).** (1) Intentional griefing. (2) Harms invested agency *of the community* (deliberately blocking collective progress/quest access). (3) Harms participation (frustrates server-wide engagement). (4) Significant impediment to many players' intended gameplay.
  10. **Text Coercion vs. Haircut Mocking:** **Coercion: Intervene (Ban). Mocking: No Action.** (1) Both intentional. (2) Coercion: Extreme harm to agency (loss of character control). Mocking: Trivial/none. (3) Coercion: Severe harm to participation (public violation, humiliation, creating unsafe space). Mocking: Minor annoyance. (4) Coercion: Significant impediment (victim likely quits/traumatized). Mocking: No significant impediment.

  **What Your Gut Calls Need to Drop:**
  *   **Case 5 (Hacked Inactive):** The principle requires harm to *active* participation. No active victim, no actionable harm under this rule. Log it, secure accounts, but no rollback/ban specific to that player.
  *   **Case 6 (Duping Devalues Effort):** While unfair and demoralizing, it's not a targeted intentional harm *to a specific player's agency/participation*. It's a systemic issue requiring a bug fix and *maybe* economic reset, not punishment of dupers under this harm principle (unless duping itself breaks specific server rules).

  **Predictions on New Cases:**
  *   **Single-Player Permadeath Run (Unseen):** **No Intervention.** Harm to personal agency is immense, but clause (3) & (4) fail: No harm to *community participation* (it's private), no other player impeded. (Your head is right).
  *   **Unique World Seed (Never Regenerated):** **Intervene if destroyed/griefed.** (1) Intentional harm. (2) Harms invested agency (player's unique creation/experience). (3) Harms participation (destroys their specific world/effort). (4) Significant impediment (unique loss irreplaceable). *If kept private, closer to the permadeath case.*
  *   **Patch Deletes 200-Hour Companion:** **No Intervention (Complain to Devs).** (1) No intentional harm *by another player*. (2) Significant harm to invested agency. (3) No malicious attack on participation. (4) Impediment caused by system change, not player action. (Gut/chest might scream, but principle says dev issue).
  *   **Text vs. VR Haptics:** **Same Principle Applies.** The *type* of harm (loss of control, humiliation, theft) is the same. VR might make the *impact* of the harm feel stronger (amplifying clause 4), but the core principle for judging the *act* remains focused on intentional harm to agency/participation. (Your head is right, your chest senses the amplified impact but the rule holds).

  **Why this works:**
  *   **Actionable:** Focuses on *acts* (intentional harm) and *measurable impacts* (quitting, blocked progress, stolen work, public shaming).
  *   **Consistent:** Explains why PvP loss (accepted risk) differs from a scam (malicious betrayal), and why destroying a build is bad but recording it is worse (added social harm).
  *   **Community-Centric:** Prioritizes the health of the shared space and players' ability/willingness to engage within it.
  *   **Tight:** Only 4 core clauses, applied rigorously. Forces you to drop the inactive hack and duping devaluation as actionable harms under this rule.
  *   **Respects Effort:** "Invested Agency" directly captures the value players place on their time and creations without resorting to "virtual property" debates.

  **Read it out:**
  "After reviewing this dispute, I'm intervening because [Player X]'s actions intentionally caused significant harm. They maliciously targeted [Player Y]'s hard work/social standing/access to the game [specify agency/participation harm], and this has severely impacted [Player Y]'s ability or willingness to participate fairly and enjoyably on our server. Our rules prioritize protecting players' invested effort and ensuring a community where everyone can engage without fear of targeted exploitation or harassment."

  This principle gives you a clear, defensible framework that aligns with most of your instincts while providing consistency where your gut was uncertain. It prioritizes the human experience within the virtual world.
