  - Accounting for error (misreading vs mutation)
  - Relativity to environment
  - Incorporating non-DNA heredity
  - Relating to selection vs actual effects
  - Demonstrating explanatory payoff

  I need to identify which criteria are non-negotiable versus debatable. The no-collapse requirement seems fundamental - without it, any causal chain becomes "information." Similarly, the no-homunculus criterion is essential to avoid magical thinking. The error criterion is probably indispensable too, as semantics requires the possibility of being wrong.

  For the payoff criterion, I should note it's the crux of the user's concern: does this framework actually help biologists predict phenotypes better than chemistry alone? This might be the litmus test that excludes purely chemical or deflationary views.

  The context-dependence criterion seems particularly damaging to simple "DNA as blueprint" models. If the same sequence can mean different things in different contexts, information must be relational rather than intrinsic. This might be the single requirement that invalidates the most existing positions.

  I should organize this as:
  1. Requirements table with non-negotiables marked
  2. Analysis of which criterion excludes most theories
  3. Check for unsatisfiable combinations

  The environment relativity and selection criteria might conflict when considering novel sequences. If information requires historical selection, random sequences can't "mean" anything - but if it only requires current function, then meaning becomes too flexible. This tension appears unresolvable in some frameworks.
answer: |-
  Below is a structured desiderata table for a theory of genetic information, designed to resolve whether molecular biology's informational vocabulary is chemically reducible or adds explanatory value. Non-negotiable criteria (essential for *any* viable account) are marked with **★**. Preferences reflect unresolved debates in the field.  

  ### **Desiderata for a Theory of Genetic Information**  
  | **Requirement** | **Purpose** | **Non-Negotiable (★) / Preference** | **Threats if Missing** |
  |-----------------|-------------|-------------------------------------|------------------------|
  | **1. No Collapse** | Must distinguish genetic information from generic causal correlations (e.g., whale DNA ≠ information about oceans). Define a *specific relation* that excludes most physical processes. | **★** | Theory becomes vacuous; all chemistry is "information." |
  | **2. No External Interpreter** | Content must be intrinsic to the system (no homunculus). Account for the self-referential, evolved mapping (e.g., variant genetic codes) without appealing to outside agency. | **★** | Smuggles in dualism; undermines naturalism. |
  | **3. Context-Dependence** | Handle sequences with multiple context-dependent roles (e.g., coding region + regulatory element). Must accommodate hypothetical cases where codon meaning shifts with cellular state. | **★** | Fails real biology; assumes "one sequence, one function." |
  | **4. Error Definition** | Define a difference between *correct interpretation* (codon → correct amino acid) and *error* (e.g., mistranslation, readthrough). Must allow for misreading independent of mutation. | **★** | No semantics without error; collapses to chemistry. |
  | **5. Environment Relativity** | Specify how information is relativized (e.g., to lineage-typical environments, developmental contexts). Explain same-genome → different-phenotype outcomes. | Preference | Ambiguity in "meaning"; conflates information with outcome. |
  | **6. Non-DNA Heredity** | Address whether methylation, prions, etc., carry genetic information. If not, explain why DNA is special. | Preference | Overgeneralizes or undergeneralizes "hereditary information." |
  | **7. Selection vs. Function** | Specify if content tracks historical selection, current function, or causal effects. Resolve if novel sequences (e.g., random DNA) can "mean" anything. | Preference | Confuses evolved purpose with causal role. |
  | **8. Explanatory Payoff** | License inferences from sequence to phenotype *beyond* chemical prediction (e.g., "Codon UAC → tyrosine" predicts outcomes chemistry alone cannot). | **★** | Vocabulary adds nothing; reductionism wins. |

  ---

  ### **Analysis of Key Constraints**  
  1. **Most Excluding Requirement**: **No Collapse (Requirement 1)**.  
     - **Why**: Eliminates deflationary (pure chemistry) views by demanding a unique informational relation. Also challenges selected-function theories (e.g., Millikan, Maynard Smith) if they cannot distinguish genes from other selected correlates (e.g., whale blubber "informing" about cold water).  
     - **Excluded Positions**:  
       - *Dewey-style deflationism* (all correlations are information) fails.  
       - *Naive selected-effect theories* fail if they cannot exclude environmental correlates.  
       - *Simple instruction metaphors* fail if they cannot define "instruction" non-circularly.  

  2. **Jointly Unsatisfiable Pair**: **Selection vs. Function (7) + Environment Relativity (5)**.  
     - **Conflict**:  
       - If content *requires* historical selection (Requirement 7), novel sequences in new environments cannot "mean" anything.  
       - If content is relativized to *current* environments (Requirement 5), a sequence could "mean" something never selected for.  
     - **Result**: Forces a choice—either information is backward-looking (teleosemantic) and ignores novel contexts, or it is forward-looking (causal role) and ignores history. No theory fully reconciles both.  

  ---

  ### **Conclusion**  
  - **Non-Negotiables**: Requirements 1–4 and 8 are essential. Without them, the theory is either non-semantic (collapses to chemistry) or non-biological (invokes homunculi).  
  - **Theories Excluded**:  
    - *Pure chemistry*: Fails Requirements 1, 4, 8 (no error, no unique relation, no predictive payoff).  
    - *Selected-function*: Fails Requirement 1 if it cannot exclude non-genetic correlates; struggles with Requirement 3 (context-dependence).  
    - *"Blueprint" metaphors*: Fail Requirements 3 (context-dependence) and 8 (cannot predict phenotypes beyond chemistry).  
  - **Viable Path**: A theory satisfying 1–4 and 8 might treat genetic information as a *contextual, evolved, error-prone mapping* fixed by cellular machinery. This retains utility for molecular biology while avoiding collapse or homunculi. Preferences (5–7) reflect open philosophical disputes but do not invalidate core functionality.  

  **Ultimate Test**: Requirement 8 (Explanatory Payoff). If the theory lets biologists infer phenotypes from sequences *more efficiently* than chemistry alone (e.g., predicting disease risk from a SNP), the vocabulary is justified. If not, it is decorative.
