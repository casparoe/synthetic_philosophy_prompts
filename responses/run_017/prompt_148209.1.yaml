prompt: |-
  For about thirty years I've made my living moving other people's data from one system into another, and somewhere along the way I picked up a question I haven't been able to put down. Years ago I read a well-known popular book about minds and machines that staged the question with a picture I still remember: some kind of tank — I think the author called it a careenium — full of little floating markers, simmballs perhaps, with patterns at the top that are supposed to mean something. The puzzle was whether the meanings can ever be said to shove the markers around, or whether only the markers ever shove anything. I don't remember what answer the book gave, if it gave one.

  What I keep running into at work is that puzzle with a twist I have never seen described, and it comes in three shapes.

  First: I rename a field in a schema — not the values, only the name and type — and a nightly job moves several million bytes around on disk. Those bytes moved because of what the symbol means; had the field carried a different name with the same stored value, nothing would have moved. And yet the engineer's account of which electrons went where is entirely complete and mentions no meanings whatsoever. Two complete accounts, neither one apparently needing the other.

  Second, and this is the one that bothers me: a source system sends a value the target system's specification declares impossible — a sixth code where only five exist. Nothing crashes. The reporting layer goes on producing clean reports; it quietly files the sixth code under whichever of the five its bit pattern sits closest to. The fine level did something the coarse level forbade, and the coarse level did not fail. It got re-fitted. Note what this is not: it isn't vagueness, since the five codes are perfectly exact, and it isn't error handling, since nobody anywhere decided to call it an error.

  Third, the same thing running the other way. A disk image rots by a single bit; the program goes on running and prints nonsense, and we all say the program is broken rather than that a different, equally valid program is now running. But when a host recompiles an emulated program's hot loops into machine code sharing no structure with it, we all say the same program is still running. Sometimes the coarse description survives a deviation in the substrate by being redrawn; sometimes it dies of the very same kind of deviation. I cannot state the rule that decides which.

  I have been calling this map drift, which I know is inadequate. What I want to know is whether there is an established concept for the relation I am describing: a coarse and meaningful description whose mapping onto the fine-grained stuff is renegotiated after the fact, so that the coarse level can neither be refuted by the fine level nor shown to be doing any work of its own. I have seen people online say that the higher level is nothing but the lower level described differently, but that slogan says the coarse level adds nothing, and my worry runs the other way — it seems to add something that no amount of inspecting the fine level could ever confirm or disconfirm. I have also seen people talk as if the coarse level obviously does push the fine level around; but in my first case it looks like it does, and in my second case it looks like it cannot fail to, which amounts to the same as not doing anything at all.

  So: does this have a name, and if so which of the nearby notions actually fits and how does mine differ from the others that merely look like it? If it has no name, coin one, define it, and give me the boundary cases where it shades into something else. I won't be satisfied with a bare label — I want to know where the thing's edges are. And please keep clear what is settled in this area from what people who actually know it disagree about, and tell me when you are giving me your own position rather than the lay of the land. Don't send me to papers or reading lists; I have no library access and wouldn't know how to read them. Argue it out in your own words.
reasoning: |-
  Okay, let me start by unpacking the user's query. They've been working with data migration for thirty years and have this persistent question about the relationship between coarse (meaningful) and fine (physical) levels in systems. The examples they give—renaming a field causing data movement, an unexpected value being silently recategorized, and a bit flip versus emulation affecting program identity—highlight a tension they call "map drift."

  First, I need to understand the core issue. They're pointing out that the coarse level (like field names or program specs) seems to both influence and be immune to changes in the fine level (bits on disk). The coarse description isn't falsified by the fine level; instead, it gets reinterpreted to maintain coherence. This creates a paradox: the coarse level appears to cause physical changes (like moving electrons when a field name changes) but also can't actually be "wrong" because it adapts (like handling an invalid code by recategorizing it).

  The user rejects reductionism (coarse is "nothing but" fine) and causal overstatement (coarse literally pushes particles). They want a concept that captures this adaptive, non-falsifiable mapping. Terms like supervenience, multiple realizability, or emergence come to mind, but they don't fully fit. Supervenience implies dependency without reducibility, but the user's cases show the coarse level isn't strictly dependent—it can reinterpret the fine level. Multiple realizability explains variability but not reinterpretation. Emergence often implies novel causation, which the user doubts.

  I recall Dennett's "real patterns" and "stance" theory. The intentional stance treats systems as rational agents, allowing predictions even when physical details deviate. This matches the user's examples: the reporting layer adopts an intentional stance by recategorizing the sixth code, preserving the coarse description. Similarly, emulation works because we maintain the design stance despite physical changes. A bit flip breaks the program identity because the design stance can't reinterpret it coherently—it's no longer a "real pattern."

  The key is the *stability of interpretation under perturbation*. When deviations allow reinterpretation within the coarse framework (like recategorizing codes or emulation), the coarse level survives. When they don't (bit flip causing nonsense), it collapses. The rule isn't in the system itself but in the observer's commitment to a stance. The user's "map drift" is this renegotiation of mapping to preserve the pattern.

  For a term, "interpretive plasticity" fits—the coarse level's ability to bend without breaking. Boundary cases: if plasticity is too high (anything can be reinterpreted), meaning dissolves; too low, systems become brittle. The middle ground—constrained plasticity—defines functional systems.

  The user needs clarity on why coarse levels seem causal (they guide *our* actions, like engineers renaming fields) but aren't physical causes. It's our interpretive practices that bridge the gap. Settled: stances predict behavior. Controversial: whether patterns are "real." My view is they're real if they afford prediction, but others disagree.
answer: |-
  What you're describing is a profound and slippery problem at the intersection of philosophy of mind, computer science, and semantics. It doesn't have a single, universally accepted name, but the core phenomenon – **the persistent stability of a coarse-grained description ("what it means") despite changes or deviations in the fine-grained substrate ("the bits"), where the mapping between them is flexible and renegotiable –** can be captured by synthesizing several established concepts. Your term "map drift" is evocative, but let's refine it.

  **The Core Concept: Constrained Interpretive Plasticity (CIP)**

  1.  **The Coarse Level (Intentional/Functional Description):** This is the "what it means" or "what it's supposed to do" level: the schema names, the business logic, the program specification, the report semantics. It operates in terms of *purposes*, *meanings*, *functions*, and *categories*.
  2.  **The Fine Level (Physical/Implementational Description):** This is the "what it is" level: the bits on disk, electron flows, voltage states, transistor activations. It operates in terms of *physics*, *causality*, and *brute mechanics*.
  3.  **The Mapping:** This is the (often complex and implicit) set of rules linking specific configurations/states/changes at the fine level to specific meanings/behaviors at the coarse level.
  4.  **Constrained Interpretive Plasticity (CIP):** This is the phenomenon you observe. It describes the *system's (or observer's) ability to dynamically reinterpret or adjust the mapping between the fine level and the coarse level when faced with deviations or changes, in order to preserve the coherence and utility of the coarse-level description.* The plasticity is *constrained* because not *any* reinterpretation is possible; the new mapping must still yield a coarse-level description that is useful (predictive, stable, actionable) within the system's context or the observer's goals. Crucially, the coarse level *itself* doesn't *directly* cause the fine-level changes; it *constrains* and *guides* the *interpretation* of those changes and the *actions taken* based on that interpretation.

  **How CIP Explains Your Cases:**

  1.  **Renaming the Field (Schema Change):**
      *   **Fine Level (Cause):** An engineer edits a configuration file/text (changing bytes). A scheduler initiates a process (electron flows). The process reads old bytes, transforms them based on new config, writes new bytes.
      *   **Coarse Level (Meaning):** "The 'CustomerID' field was renamed to 'ClientID'." This *meaning* motivated the engineer's action (editing the config).
      *   **CIP:** The mapping between the schema definition (coarse) and the stored data (fine) is explicitly renegotiated. The *meaning* ("rename") didn't shove electrons; the *intention to enact that meaning* caused the engineer to shove electrons (by editing configs). The coarse-level description ("the schema changed") remains perfectly valid *after* the fine-level changes are interpreted through the *new* mapping. The old mapping is discarded. The coarse level *guided* the intervention but didn't *physically cause* it.

  2.  **The Sixth Code (Violation Handled Silently):**
      *   **Fine Level:** Bytes arrive representing a value `0x06` (say). The processing logic has conditional branches for `0x01` to `0x05`.
      *   **Coarse Level:** "Only codes 1-5 are valid. Reports categorize entries into A, B, C, D, E."
      *   **CIP:** The unexpected `0x06` (fine-level deviation) triggers an implicit renegotiation of the mapping. Instead of declaring the *coarse level* invalid ("The spec is wrong!"), or crashing (treating it as an unhandled error), the system *reinterprets* the fine-level input (`0x06`) *within the existing coarse categories*. It maps `0x06` to, say, category C (`0x03`) because it's the closest match. The coarse level ("Reports show categories A-E") remains stable and useful. The *meaning* of the coarse level (the categories) didn't cause the input `0x06`, nor did it physically handle it; but the *system design based on those meanings* included a mechanism (closest-match mapping) that *interpretively absorbed* the deviation, preserving the coarse-level utility. The coarse level couldn't be "refuted" because it was flexible enough to accommodate the anomaly.

  3.  **Bit Rot vs. Emulation (Program Identity):**
      *   **Bit Rot (Nonsense Output):**
          *   **Fine Level:** A single bit flips in a machine instruction (e.g., `ADD` becomes `JMP`).
          *   **Coarse Level:** "This is Program P, which performs function F."
          *   **CIP:** The bit flip disrupts the intended instruction sequence. There is *no plausible reinterpretation* of the resulting fine-level state that maps back onto the original coarse-level description ("Program P performing F"). The output is nonsense. We declare the coarse level *invalid* ("The program is broken"). The mapping rigidity breaks.
      *   **Emulation (Same Program):**
          *   **Fine Level:** The host CPU executes completely different machine instructions (its own `ADD`, `JMP`, etc.) than the original program would have (e.g., `MOV`, `CMP`). The physical implementation is entirely distinct.
          *   **Coarse Level:** "This is Program P, which performs function F."
          *   **CIP:** The emulator acts as a *dynamic interpreter*. It defines a *new mapping* between the host's fine-level states and the *abstract machine states* defined by Program P's specification. Every host instruction executed is interpreted *as if* it were executing the original program's abstract steps. The coarse-level description ("Program P running") remains valid *because the mapping is explicitly designed to preserve the coarse-level behavior*, even though the fine-level substrate is utterly different. The plasticity is constrained to interpretations that preserve P's functional behavior.

  **The Rule: What Decides Survival vs. Death (Boundary Cases)**

  The rule for when the coarse level survives (CIP absorbs the fine-level deviation) versus dies (the mapping breaks) hinges on **the ability to find a *useful constrained reinterpretation* of the fine-level state that preserves the predictive power and purpose of the coarse-level description.**

  *   **Survival (CIP Wins):**
      *   Renaming Field: New mapping defined explicitly. Coarse purpose (data identified) preserved.
      *   Sixth Code: Implicit reinterpretation (closest match). Coarse purpose (categorization for reporting) preserved.
      *   Emulation: Explicit, designed reinterpretation layer. Coarse purpose (running Program P) preserved.
      *   **Boundary:** How much deviation can the reinterpretation handle? Could the reporting layer absorb a value `0xFF` (255)? Maybe map it to the highest category? Or would that break "usefulness"? If the reinterpretation makes the reports meaningless or unpredictable, CIP fails. If the schema change required incompatible type conversions causing data loss, CIP might partially fail (coarse level "data migrated" holds, but "data integrity" might not).

  *   **Death (CIP Fails):**
      *   Bit Rot (Nonsense): No useful reinterpretation exists. The output is unpredictable garbage relative to the coarse description.
      *   **Boundary:** A bit flip that changes `CustomerID` `12345` to `12346` might *not* break the coarse level immediately – the program might run, the report might show, but the *meaning* ("customer 12345's data") is now subtly wrong. This is CIP failure in *semantic fidelity* even if functional behavior continues. The coarse level "correct customer data" is refuted. Conversely, a bit flip in an unused padding byte might cause no observable coarse-level change at all – CIP trivially succeeds because the deviation doesn't impact the mapping to the *relevant* coarse features.

  **Relation to Established Concepts (Settled vs. Controversial):**

  *   **Supervenience (Settled-ish):** The coarse level supervenes on the fine level: no change at the coarse level without *some* change at the fine level. Your examples confirm this (renaming changes bytes, sixth code is a different bit pattern). **CIP Difference:** Supervenience describes dependency, but not *how* that dependency works. CIP explains the *dynamics* – how the mapping can flex under pressure to *maintain* a supervening description despite fine-level changes that *could* have broken it.
  *   **Multiple Realizability (Settled):** The same coarse state/function (e.g., Program P) can be realized by many different fine-level states (different machine codes, hardware). Emulation is a prime example. **CIP Difference:** CIP focuses on the *dynamic process of remapping* when the fine level *changes* or *deviates*, not just the static possibility of different implementations. It explains *why* we accept the emulator as running "the same program" *despite* the different substrate.
  *   **Emergence (Highly Controversial):** The idea that coarse levels have novel causal powers "downwards". You're rightly suspicious of this. **CIP Position:** CIP avoids claiming novel *physical* causation. The "shoving" comes from *interpreters* (engineers, systems, emulators) acting *based on* coarse-level meanings. The meanings *constrain the interpretations and actions of agents* embedded in the system, but don't push electrons *directly*. The coarse level has causal efficacy *via* the agents that recognize and act on it.
  *   **Real Patterns (Dennett - Controversial but Relevant):** A "real pattern" is a description that is predictively robust, even if its boundaries are fuzzy. The coarse levels in your surviving cases are real patterns. **CIP Connection:** CIP is the *mechanism* that *maintains* a description *as* a real pattern in the face of fine-level noise or variation. The sixth code reinterpretation preserves the reporting category as a real pattern. The emulation preserves Program P as a real pattern. Bit rot destroys the pattern.
  *   **Stances (Dennett - Useful Framework):**
      *   *Physical Stance:* Predict based on physics (fine level).
      *   *Design Stance:* Predict based on intended function (coarse level - schema, program spec).
      *   *Intentional Stance:* Predict based on attributed beliefs/desires (coarse level - "the report wants to categorize").
      *   **CIP Connection:** CIP occurs when we successfully apply the Design or Intentional Stance *despite* fine-level deviations that would thwart prediction from the Physical Stance alone. The reporting layer uses the Intentional Stance ("it categorizes things") to justify its reinterpretation. The emulator relies on the Design Stance ("it's *supposed* to emulate P"). The engineer renaming the field uses the Design Stance ("the schema *should* reflect business terms").

  **The Answer to Your Core Puzzle:**

  The coarse level doesn't "shove" fine-level markers directly. Nor is it epiphenomenal fluff. **Coarse-level meanings are *causal constraints on the interpretive and intentional actions of agents* (human or artificial) embedded within or interacting with the system.** Meanings motivate engineers to change configs (shoving electrons). Meanings define the functions that systems try to preserve through mechanisms like closest-match mapping or emulation (shoving interpretations). Meanings define what counts as a "valid" reinterpretation (the constraint in CIP).

  **In Your Words:**

  *   **Can meanings shove markers?** No, not directly. Physical causes remain physical.
  *   **Do markers only shove markers?** Yes, at the absolute fine level.
  *   **But...** Markers are shoved *by agents* (processes, engineers) *because of* the meanings those agents are trying to enact, preserve, or interpret. Meanings *govern* the *rules of the game* – the mapping – that determines how markers are arranged, moved, and understood. This governance allows the "map" to drift (CIP) without the territory (the meaningful purpose) collapsing, as long as a useful reinterpretation exists. When no such reinterpretation is possible, the territory vanishes, leaving only broken markers. The key is the *interpreter* acting *on behalf* of the meaning.

  **Therefore:** Your phenomenon is the **maintenance of coarse-level intentional/functional descriptions through Constrained Interpretive Plasticity (CIP)**, enabled by agents (designers, systems, processes) acting as interpreters committed to preserving those meanings within the system's operational constraints. The coarse level isn't pushing particles; it's pushing *interpretations* and *intentions*, which in turn push particles.
