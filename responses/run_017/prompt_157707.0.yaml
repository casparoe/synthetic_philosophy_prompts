prompt: |-
  I recently joined the committee that signs off on every probabilistic statement my hospital publishes — in the decision-support product, in patient-facing trial material, and in our own papers — and I have to draft the minute on a new submission this week, so I want to know what we have actually been committed to.

  Our rulings so far: we approved "this patient has a 0.5 chance of being allocated to arm B" where allocation used a certified 1:1 randomizer, and said 0.5 was correct rather than merely permissible; we struck the same sentence where allocation ran through a vendor randomizer we could not audit, on the grounds that the number would report our ignorance rather than the procedure and that no single number was ours to publish; we approved "0.3 probability that the emergency department exceeds capacity tomorrow," from our ensemble model, on condition that it be revised as the day's data arrive; we approved "0.2 probability that this patient's chest pain is coronary in origin, given the workup so far," on condition that it be revised after the troponin; and we refused to let any number appear as "the probability that this patient would have avoided the complication had we operated a day earlier," on the grounds that nothing we could ever observe settles it.

  The new submission: last night our pipeline ran the current model version on Ms K's data. The run is deterministic — fixed version, fixed seed — and the recommendation is already sitting in the log, unreviewed. We want to show the reviewing clinician "0.7 probability that the stored recommendation is unsafe," where 0.7 is the output of a monitoring classifier whose calibration we validated on last quarter's cases. Nothing random happened, the seed-and-input combination occurred once, and the monitor's score falls in a region where we have only a handful of comparable past cases, so there is no well-populated class whose frequency we could quote instead; but the claim has a determinate truth value, and we could check it by opening the log.

  Should we approve it, if we want to be consistent with ourselves? Please state the rules our precedents are jointly compatible with, what each predicts here, which precedent is the closest analog, what we would be committing to under each choice, and which single further case would best separate the rules that survive. I suspect we have been running some sort of chance-or-frequency rule without ever saying so, but I cannot see how that rule alone makes sense of the coronary case.
reasoning: |-
  Okay, let me try to unpack this user's query. They're part of a hospital committee that reviews probabilistic statements, and they need to draft a minute on a new submission. The user provided several past rulings and now wants to know if they should approve a statement about a 0.7 probability that a stored recommendation is unsafe. 

  First, I need to understand the precedents. They approved a 0.5 chance for random allocation because it was a certified randomizer. But they rejected the same when the randomizer wasn't auditable. That suggests they require verifiable randomness or known frequencies. Then there's the ensemble model for ED capacity, which is a predictive model with ongoing calibration. The coronary pain case was approved as a Bayesian prior, updatable with new data. Counterfactuals were rejected because they're unverifiable.

  Now the new case: a deterministic model run with a monitoring classifier that outputs 0.7 probability of the recommendation being unsafe. The classifier's calibration was validated on past data, but the current case is unique with few comparable instances. The truth value is checkable by reviewing the log, but the probability here isn't about randomness; it's about uncertainty in the classifier's assessment.

  The challenge is reconciling the coronary case where a subjective probability was allowed. Both involve model outputs, but the coronary probability was a clinical assessment based on evidence, whereas this is a classifier's score. The key difference might be that the coronary statement was about a real-world state (pain origin) based on current data, while the monitor's 0.7 is about the recommendation's safety, which is binary and checkable. 

  The user suspects a "chance-or-frequency" rule, but the coronary case complicates that. It seems they allow probabilities that represent either objective chances (like randomization) or well-calibrated degrees of belief (like the ensemble or Bayesian cases). The counterfactual was rejected because it's neither. 

  For the new submission, the monitor's 0.7 is a calibrated degree of belief based on past validation. Even though the case is unique, the classifier was validated on historical data. This is similar to the ensemble model's probability, which was approved with ongoing updates. The main difference is that the ED model uses an ensemble for future events, while this is a classifier for a current, checkable outcome. But both rely on validation and calibration.

  The closest precedent is the coronary case because both involve model outputs applied to specific patients, with probabilities that can be updated. The 0.7 is a calibrated belief, not a frequency. Approving it would commit them to allowing validated model outputs as probabilities for specific instances, even if the outcome is determinate but unknown. Rejecting it might force them to only use frequencies or random processes, which contradicts the coronary case approval.

  The user also asks for a case to test the rules. A good test would be a calibrated model for a past event where the truth is unknown but unknowable. For example, "probability that patient X's resolved fever was bacterial" based on data. If they approve, it aligns with allowing epistemic probabilities; if not, they're stricter about verifiability.

  In summary, consistency suggests approving the new statement because it's a calibrated belief from a validated model, similar to the coronary case. The key commitment is to epistemic probabilities from well-validated sources, even for determinate outcomes.
answer: |-
  Based on your precedents, your committee operates under a **Calibrated Epistemic Probability Rule**, not a pure frequentist or chance rule. Here's the synthesis, analysis, and recommendation:

  ---

  ### **The Rule Synthesized from Precedents**
  Your committee approves probabilistic statements **iff** they represent:
  > **A quantitatively calibrated degree of rational belief about a specific, resolvable state**,  
  > where the calibration is anchored to either:  
  > (a) *Objective randomness* (e.g., randomizer), or  
  > (b) *Empirical performance* of a validated model/system under comparable conditions.

  ### **Key Precedent Analysis**
  | Case                          | Approval | Why Consistent with the Rule                                                                 |
  |-------------------------------|----------|----------------------------------------------------------------------------------------------|
  | Certified randomizer (0.5)    | ✅ Approved | Anchored to **objective randomness**; probability is physical (chance).                      |
  | Non-audited randomizer        | ❌ Rejected | No anchor: neither randomness nor empirical calibration was verifiable.                      |
  | Ensemble ED model (0.3)       | ✅ Approved | Anchored to **empirical calibration** (model performance under dynamic data).                |
  | Coronary pain (0.2)           | ✅ Approved | Anchored to **clinical model calibration** (Bayesian prior/likelihood; updatable with data). |
  | Counterfactual complication   | ❌ Rejected | No anchor: state is **unresolvable** (no observation or calibration possible).               |

  ---

  ### **Evaluation of the New Submission**
  **Statement:** *"0.7 probability that the stored recommendation is unsafe for Ms K."*  
  - **Anchor**: Empirical calibration of the monitoring classifier (validated on last quarter's cases).  
  - **Resolvability**: Truth value is **determinate and checkable** (by reviewing the log).  
  - **Uniqueness**: Few comparable cases, but the classifier’s output is still calibrated to past performance.  

  #### **Closest Analog: Coronary Pain Case (0.2 Probability)**  
  - Both involve **model outputs applied to a specific instance**:  
    - Coronary case: Clinical model estimates probability of a *current-but-unobserved* state.  
    - New case: Classifier estimates probability of an *already-determined-but-unreviewed* state.  
  - Both require **revision with new data** (troponin result vs. log review).  
  - Neither relies on physical randomness—both are **epistemic probabilities** derived from calibrated systems.  

  #### **Inconsistency with ED Model?**  
  The ED model (0.3) predicts a *future* event, while this case assesses a *current* state. But the rule tolerates this:  
  - ED model: Calibrated to frequency of *future outcomes*.  
  - New case: Calibrated to frequency of *classifier correctness* in similar score regions.  
  **→ Both are anchored to empirical performance metrics.**  

  ---

  ### **Recommendation: Approve Conditionally**  
  To be consistent with the **coronary pain precedent**, approve with conditions:  
  1. **Explicit caveat**: Add text clarifying this is the *monitor’s confidence* based on past validation, not a physical chance.  
     > *"The monitoring system, calibrated against historical data, assigns a 0.7 probability that this recommendation is unsafe."*  
  2. **Revision mechanism**: Ensure the probability is removed/updated once the log is reviewed (mirroring troponin update).  

  **Why approve?**  
  - It fits the **calibrated epistemic probability** framework (like coronary/ED cases).  
  - Rejecting it would **invalidate the coronary pain precedent**, which also involved a determinate-but-unknown state.  

  ---

  ### **What You Commit To Under This Approval**
  1. **Formalizing epistemic probabilities**: Accepting that probabilities can represent:  
     - Beliefs from calibrated systems (even for non-repeating events).  
     - Current states, provided they are verifiable *in principle*.  
  2. **Rejecting unanchored probabilities**: Counterfactuals or unauditable systems remain excluded.  
  3. **Requiring calibration transparency**: Must document how models are validated (e.g., classifier’s AUC, calibration plots).  

  ---

  ### **Test Case to Separate Surviving Rules**
  **Propose this hypothetical:**  
  > *"Probability that Patient X’s resolved fever was bacterial (not viral), given data available at discharge."*  
  **Why it separates theories:**  
  - **Frequentist rule**: ❌ Reject (no "frequency" for a one-time resolved event).  
  - **Chance rule**: ❌ Reject (no randomness involved).  
  - **Calibrated Epistemic Rule**: ✅ Approve iff a validated diagnostic model generated the probability.  
    *(This forces the committee to explicitly endorse epistemic probabilities for retrospective states.)*  

  ---

  ### **Why "Chance-or-Frequency" Alone Fails**
  The coronary case (0.2 probability) is the key:  
  - No randomness (pain origin is determinate).  
  - No observable frequency (only one workup for this patient).  
  - Yet approved because it reflected a **calibrated clinical judgment** (i.e., model-based belief).  
  **→ Your rule is broader: It accepts *any* well-calibrated epistemic probability for resolvable states.**  

  Approve the new submission to maintain consistency with your most analogous precedent (coronary pain). This commits you to a nuanced, validation-dependent view of probability—one that pragmatically blends frequentism and Bayesian epistemology for medical decision-making.
