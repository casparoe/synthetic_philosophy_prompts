  - The formal epistemologist will question why I'm not using scoring rules for credences. That's their entire framework.
  - The learning theorist will challenge the horizon-dependence as non-convergent and question optimality assumptions.
  - The Laudan-ish historian will demand real-case application and distrust any truth-adjacent measure.
