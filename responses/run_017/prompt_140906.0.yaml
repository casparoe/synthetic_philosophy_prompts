  - The special sciences philosopher will want a concrete historical test.

  The most dangerous question is the learning theorist's convergence objection because it strikes at the core innovation (horizon-relativity) while sounding technically fatal. I should build the "no transitivity" concession into the talk itself to preempt confusion.

  For the prep sheet structure: I'll rank objections by damage potential. Each entry needs the critic's voice (e.g., formal epistemologist using "graded credence" jargon), a 2-minute reply with strategic concessions, and a soft-spot note. The "hoped nobody asks" is the historian's request to run a live example – too many variables to control extemporaneously.

