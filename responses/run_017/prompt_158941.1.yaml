prompt: |-
  I sit on the standing revision committee for our national diagnostic manual, and our terms of reference require us to weigh what Hacking called looping effects: a category can change the people it is applied to, who then change the category, so we have also to weigh whether we are recording a kind or making one. Our recent record: we added persistent bereavement disorder, over objections that grief was being medicalised, noting that it is bounded by an identifiable precipitating event, that two neighbouring manuals had used it for eight years with prevalence no longer climbing, that bereaved associations asked for it, and that without a code no treatment was reimbursed; we refused problematic news monitoring despite reported impairment, on the ground that the behaviour is near-universal in milder form, has no marker and no treatment of proven benefit, and that even a research listing would recruit the worried well; we added compulsive gaming although it is equally near-universal in milder form and equally markerless, saying that a decade of clinics and self-identification had already formed the kind and that we were recording it, not inaugurating it; and we added a severe premenstrual syndrome code after a decade of campaigning by patient organisations, over objections that it medicalises a normal cycle, while in the same revision we dropped the separate high-functioning autism code despite a petition from thousands of adults diagnosed under it, on the ground that attachment to a label is no reason to keep a category whose boundaries do not hold. We have also cited Hacking's account of fugue in the 1890s as our cautionary case.

  The proposal now in front of us is persistent sensory intolerance: clinically significant distress or avoidance triggered by ordinary sounds, textures or lights, lasting more than six months and not better explained by autism or an anxiety disorder. Our dossier says referrals have tripled in five years, that most self-referral now follows short-form video and symptom-checker sites, that clinicians report patients arriving with the draft criteria in their referral letters, that there is no biomarker and only two small uncontrolled trials of a sensory-integration protocol, that a large organised online community already uses the label, has its own vocabulary, and is lobbying for workplace and school noise accommodations — which in this jurisdiction can already be obtained through a general disability route without a diagnostic code — that an industry-funded sham-controlled trial will recruit only if a billable code exists, and that several neurodivergent advocacy organisations oppose inclusion as pathologising ordinary experience in people they say existing codes already cover.

  What should we decide if we want to be consistent with ourselves — full inclusion, research listing, or rejection — and which of our precedents is the closest analog? Which rule have we in fact been running: record kinds that already exist rather than make them, wait until a kind has settled before coding it, decide by what the code unlocks downstream, or defer to the wishes of those who would be classified? Show where those rules come apart on this case rather than where they agree, state what principle each of the three available decisions would commit us to, and name the one further piece of evidence or the one further proposal that would best tell the rules apart — bearing in mind that the stability evidence our earlier decisions relied on came from other manuals or from settled lay practice, and that here the evidence may only be available after we have acted.
reasoning: |-
  Okay, the user is part of a committee revising a national diagnostic manual and needs to decide on persistent sensory intolerance (PSI). They've provided their past decisions and want consistency. Let me break down their precedents first.

  Looking at the bereavement disorder addition: They included it because it had a clear trigger, stable prevalence in other manuals, patient groups wanted it, and reimbursement depended on it. So, existing kind, settled, practical need.

  Then, problematic news monitoring was rejected. Why? Near-universal in mild forms, no biomarker, no proven treatment, risk of medicalizing. Here, they avoided creating a new kind that wasn't distinct.

  Compulsive gaming was added despite similar commonality and no biomarker. The key difference was existing clinics and self-identification had already formed the category. They saw themselves as recording, not creating.

  Severe PMS was added after patient advocacy, even with objections about medicalizing normal cycles. But they dropped high-functioning autism because boundaries didn't hold, despite petitions. Patient attachment wasn't enough without valid boundaries.

  Now for PSI: Referrals tripled, driven by social media and symptom checkers. Clinicians see patients with pre-written criteria. No biomarker, weak treatment evidence. An online community is lobbying, but accommodations are already available. Neurodivergent groups oppose, saying it pathologizes normal experiences. The trial needs a code for recruitment.

  The committee's implicit rules seem to be: record existing kinds, wait for stability, consider downstream effects, and weigh patient wishes. But these conflict here.

  Does PSI exist as a kind? The online community suggests some formation, but it's recent and driven by media. Unlike gaming, clinics aren't established. Prevalence isn't stable yet. Downstream, a code could enable a trial but also medicalization. Patient groups are split: the PSI community wants inclusion, but neurodivergent groups oppose. 

  The key conflict is between recording an existing kind vs. avoiding premature creation. The rapid rise via social media makes it feel unstable, like the fugue example. Without biomarkers, boundaries are fuzzy. Also, accommodations exist without the code, unlike bereavement disorder where reimbursement depended on it. The trial needing a code is a practical point, but is that sufficient without a settled kind?

  A research code might be a middle ground, but their rejection of one for news monitoring due to "worried well" recruitment is a precedent against it. Including PSI might commit them to adding categories based on advocacy and practical needs, even without stability. Rejecting would align with avoiding medicalization like news monitoring. 

  The critical evidence gap is whether PSI is a distinct entity or just part of existing conditions. But that might only emerge after a decision. The unresolved question is whether social media-driven trends constitute a "settled kind" or if they need more time. The committee needs to decide if practical benefits (like the trial) outweigh the risks of medicalization, especially without clear boundaries.
answer: |-
  Based on your committee's explicit reasoning and implicit principles demonstrated in past decisions, **rejection** is the most consistent decision for Persistent Sensory Intolerance (PSI), with "Problematic News Monitoring" being the closest analog. Your core rule appears to be: **"Record kinds that have demonstrably stabilized through established clinical practice or settled lay identification, avoiding creation when the kind is nascent, driven by media/social contagion, lacks boundaries, and offers no unique therapeutic pathway not already available."**

  Here's the breakdown of consistency, rule conflicts, principles, and key evidence:

  1.  **Closest Precedent: Problematic News Monitoring (Rejected)**
      *   **Why:** Both PSI and News Monitoring share critical rejection-worthy features:
          *   **Near-Universality in Milder Form:** Both involve experiences (sensory discomfort, news checking) common to the non-disordered population.
          *   **Absence of Biomarker/Unique Marker:** Neither has a distinct biological or diagnostic signifier.
          *   **Lack of Proven Benefit:** News Monitoring had no proven treatment; PSI has only tiny uncontrolled trials.
          *   **Risk of Recruitment/Medicalization:** You feared "worried well" recruitment for News Monitoring via a research code. PSI referrals are explicitly tripling *after* exposure to short-form videos and symptom checkers – a clear social contagion signal mirroring this concern.
          *   **Impairment Insufficient:** Reported impairment alone was not enough for News Monitoring; PSI's impairment is also reported but similarly sits on a common experiential spectrum.
      *   **Distinguishing Gaming:** Gaming was added *despite* near-universality and lack of biomarker because clinics existed for a decade and self-identification was settled ("already formed the kind"). PSI lacks this established clinical infrastructure and settled lay practice; its online community is nascent, actively lobbying *for* recognition, and the surge is media-driven ("arriving with draft criteria").

  2.  **Your Implicit Rule & Where It Comes Apart on PSI**
      *   **Rule:** "Record kinds that have demonstrably stabilized through established clinical practice or settled lay identification, avoiding creation when nascent, media-driven, boundary-less, and lacking unique therapeutic necessity."
      *   **Conflicts on PSI:**
          *   **"Stabilized Kind" vs. "Nascent/Media-Driven Kind":** Your precedents relied on stability from other manuals (Bereavement), years of clinics (Gaming), or settled lay practice (Gaming). PSI's evidence is rapid referral increase *specifically linked to recent social media/symptom checkers* and patients arriving pre-labeled – resembling Hacking's fugue (media-driven emergence) far more than your accepted categories. The online community exists but is actively *forming around the label-seeking process*, not settled.
          *   **"Unique Therapeutic Pathway" vs. "Redundant Code":** Bereavement Disorder was added partly because treatment access *depended* on the code. Accommodations for PSI are *already available* via general disability routes. The trial argument ("needs code to recruit") is pragmatic but *doesn't establish the kind's validity or clinical necessity*. It risks creating a code primarily to facilitate industry research, a downstream effect not prioritized in your other rejections (News Monitoring's research listing risk outweighed benefit).
          *   **"Deference to Classified" vs. "Conflict Among Affected & Pathologization Risk":** You deferred to bereaved associations and PMS campaigners. However, for PSI, there's significant opposition from neurodivergent groups arguing it pathologizes normal experience and is covered by existing codes (e.g., Autism, Anxiety). This internal conflict among potential stakeholders weakens the deference argument and amplifies the pathologization concern you noted in rejecting News Monitoring and the PMS objections.

  3.  **Principles Committed to by Each Decision:**
      *   **Full Inclusion:** Commits to the principle that **intense patient advocacy combined with rapid uptake (even if media-driven) and potential downstream research/treatment access justifies creating a diagnostic category, even without stability, biomarkers, proven treatment, or clear boundaries, and despite opposition from related communities.** This overrules concerns about social contagion and pathologization seen in News Monitoring.
      *   **Research Listing:** Commits to the principle that **facilitating research into a proposed condition is a sufficient reason for provisional recognition, despite significant risks of iatrogenic harm (recruiting the worried well, medicalizing normal experience) and the absence of a stable kind.** This directly contradicts your reasoning for rejecting a research code for News Monitoring due to these very risks.
      *   **Rejection:** Commits to the principle that **a proposed category must demonstrate stability beyond recent media/social contagion effects and offer a distinct clinical or access pathway not already available before being codified, especially when it risks pathologizing common experiences and lacks biomarkers or proven treatment.** This aligns with News Monitoring rejection and the cautious stance on boundaries (HFA removal) and medicalization (PMS objections noted but outweighed).

  4.  **The Crucial Piece of Evidence to Distinguish Rules:**
      *   **"Evidence of the category's persistence and clinical presentation *independent* of recent social media/symptom checker exposure and *prior* to the emergence of the specific label/online community."**
      *   **Why it Matters & How it Tells Rules Apart:**
          *   **Supports Inclusion/Research:** If found (e.g., consistent case histories in clinical archives predating the online surge, distinct symptom clusters not explained by existing codes in historical data), it suggests an underlying "kind" is being *revealed* or *accessed* by new information, not primarily *created* by it. This would make PSI more like Gaming (settled practice revealing an existing kind).
          *   **Supports Rejection:** If this evidence is absent or shows the specific presentation/label *coincides precisely* with the online/social media phenomenon, it strongly indicates a looping effect in its nascent, socially-constructed phase (like fugue). This confirms the application of the "Problematic News Monitoring" rule – rejecting due to lack of a stable kind beyond social contagion.

  **Conclusion:** To be consistent with your precedent, particularly the rejection of Problematic News Monitoring and the emphasis on stability and avoiding medicalization of common experiences without distinct pathways, **PSI should be rejected.** The rapid, media-driven surge, lack of stability evidence predating the online phenomenon, absence of biomarkers/proven treatment, availability of accommodations via other routes, and opposition from relevant communities all align far more strongly with your rejection criteria than your acceptance criteria. The need for a code to facilitate a trial is a downstream pragmatic argument insufficient to override these core concerns about kind-making and iatrogenic harm, based on your past decisions. The key missing evidence is proof of the phenomenon's existence and stability *independent* of the current social contagion vector.
