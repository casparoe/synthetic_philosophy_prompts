prompt: |-
  I'm a journalist — I write a column on science and ideas — and right now I'm doing a piece on the boom in "know your risk" medicine: full-body MRIs for people with no symptoms, polygenic risk scores, whole-genome sequencing you buy online. Half the piece is about why people say yes and half is about the people who say no thanks, and I keep going in cirlces on whether there's anything rationally wrong with that second group.

  A decision-science guy whose newsletter I half-trust told me the thing to read up on is Good's theorem, and he summarized it for me like this:

  "Good proved that information can never make a rational agent worse off. Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now, and it's strictly higher whenever the evidence would change your mind about something. So a rational agent should always want more information, and the bigger the decision, the more it should be willing to pay for it. That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach, and also why 'I'd rather not know' is never rational when the stakes are real."

  I want to use this, but I don't want to print something a decision theorist would laugh at. Can you go through it more or less sentence by sentence — what someone who actually works on this would grant, what they'd wince at, and what's just wrong? And for the parts that are wrong, tell me whether they're wrong in a way that matters for my story or in a way that's just sloppy phrasing.

  Three things I'm suspicious of, in case I'm right for the wrong reasons. One: the "strictly higher whenever it changes your mind" bit feels off to me — I have a feeling the value can be exactly zero even when the information moves your credences a lot, if it doesn't change what you'd do. Two: the AI claim. Isn't the theorem a claim about an agent that updates by Bayes and then re-picks the action that maximizes expected utility? If so, does it say anything at all about a system with a fixed policy, or a proxy objective, or a compute budget, or that's been told to just answer now? Three, and this is the one I really can't check: a philosopher friend muttered at me that the whole thing is a result about expected-utility agents specifically, and that for agents who aren't Bayesian — ambiguity-averse, dynamically inconsistent, whatever he meant — information can actually have negative value. Is that a real caveat or was he just showing off at a party?

  And then the question I actually need for the piece: does this theorem give me any purchase at all on declining a screening test? My instinct is that it's nearly silent — that it's a claim about the instrumental value of information inside a decision problem, and that "I'd rather not know" isn't obviously about that — but i'd like to know exactly where the silence starts. If you can, give me one sentence about the theorem I could safely print in a newspaper, and one tempting claim I should cut. Please don't just point me at the literature — I want the shape of the argument, not a reading list.
reasoning: |-
  Okay, the user is a journalist writing a piece on "know your risk" medicine, specifically addressing why some people decline screenings like full-body MRIs or genetic tests. They're stuck on whether declining such tests is rational, referencing Good's theorem as explained by a decision-science contact. The user wants a critical breakdown of that summary—pointing inaccuracies, nuances, and practical implications for their article. 

  First, I need to unpack Good's theorem accurately. The core idea—that information can't harm a rational Bayesian agent—is solid, but the user's suspicions are spot-on. The "strictly higher when it changes your mind" part is shaky: information can be worthless if it doesn't alter actions. The AI comparison oversimplifies real-world constraints like compute costs or misaligned objectives. And yes, the theorem *only* applies to strict Bayesian agents; humans with emotional costs or ambiguity aversion might rationally avoid information. 

  The user's deeper need is clear: they want to legitimize the "no thanks" crowd without oversimplifying. The theorem alone doesn't cover psychological burdens (e.g., anxiety from a high-risk score) or non-instrumental motives (e.g., valuing present peace over future utility). I should emphasize that silence—Good's theorem ignores anything beyond cold expected utility calculations. 

  For their piece, the safe takeaway is that declining tests *can* be rational when accounting for emotional toll or real-world imperfections in testing. The tempting-but-wrong claim to cut is "never rational when stakes are real." Humans aren't AIs; stakes include mental wellbeing, not just survival odds. 

  Finally, I’ll craft a crisp newspaper line: "Good's theorem shows information can't harm an idealized rational agent, but humans face emotional costs and noisy data." That honors the math while leaving room for human complexity.
answer: |-
  Here's a breakdown of the decision-science guy's summary, its strengths, weaknesses, and implications for your piece, followed by your key question:

  **Sentence-by-Sentence Breakdown:**

  1.  **"Good proved that information can never make a rational agent worse off."**
      *   **Grant:** This captures the core intuition accurately *for the specific model*. Good showed that, *given a well-defined decision problem, utilities, and prior probabilities*, acquiring cost-free information before acting cannot *decrease* the agent's expected utility.
      *   **Wince/Sloppy:** "Never worse off" is slightly too strong without emphasizing the **massive assumptions**: the agent *must* be a perfect Bayesian updater, the information *must* be cost-free (including psychologically), the action space *must* remain unchanged, and utilities *must* be stable and correctly specified.
      *   **Wrong?** No, but contextually incomplete. It's true *within the model*. The problems arise when applying it to messy reality.

  2.  **"Take any decision problem: the expected utility of choosing after you've seen the evidence is always at least as high as the expected utility of choosing now..."**
      *   **Grant:** This is the essence of Good's Theorem. Formally, E[ max_a E[U|a, D] ] >= max_a E[U|a] for any random variable D (the data).
      *   **Wince/Sloppy:** Phrasing. "Choosing after" vs. "choosing now" is fine for intuition, but formally it's about conditioning expected utility on the data.

  3.  **"...and it's strictly higher whenever the evidence would change your mind about something."**
      *   **Grant:** The core idea is correct: information has positive value if it *could* change your optimal action.
      *   **Wrong (in a way that matters):** This is the **biggest oversimplification** and where your suspicion #1 is dead right. Information can change your beliefs ("mind") *a lot* without changing the optimal action *at all*. Its value is strictly positive **only if it changes the action you would choose**. If the evidence shifts beliefs but the same action remains optimal, the value of that specific piece of information was *exactly zero*. (Value = EU(with info) - EU(without info)). This matters hugely for "know your risk" tests: a test might tell you you're at higher risk, but if your action (e.g., "eat healthy, exercise") was optimal *both* before and after, the test had zero instrumental value.

  4.  **"So a rational agent should always want more information..."**
      *   **Grant:** Within the pure, cost-free, perfect Bayesian model, yes.
      *   **Wince/Wrong (matters):** Ignores **information costs** (financial, time, cognitive load, psychological distress) and the **value of zero information** point above. A rational agent should only want information *if its expected value exceeds its expected cost*. "Always want more" is only true if cost=0 and value>0. In medicine, costs (especially psychological) are often significant.

  5.  **"...and the bigger the decision, the more it should be willing to pay for it."**
      *   **Grant:** Intuitively correct. The potential impact on expected utility is larger for high-stakes decisions, so the maximum rational amount to pay for information is higher.
      *   **Wince/Sloppy:** "The bigger the decision" is vague. More precisely: "The higher the potential loss from choosing the wrong action without information, the higher the maximum rational willingness-to-pay for relevant information."

  6.  **"That's why any AI built to maximize expected utility will hoover up every scrap of data it can reach..."**
      *   **Grant:** Captures the tendency of idealized EU-maximizers.
      *   **Wrong (matters - addresses your suspicion #2):** This is a **dangerous oversimplification**. Real AI systems:
          *   Have **computational constraints** (hoovering data costs time/energy).
          *   Operate under **uncertainty about the true model** (is this data relevant? trustworthy?).
          *   May have **proxy objectives** misaligned with true utility (e.g., maximizing clicks vs. user well-being).
          *   Face **exploration-exploitation tradeoffs** (sometimes acting now is better than gathering more data).
          *   Can suffer from **overfitting** with too much noisy data.
          *   Good's Theorem applies to the *final decision* with *available* data. It doesn't compel an agent to *seek* infinite data *indefinitely* if there are costs or diminishing returns. An AI with a fixed budget/time horizon rationally stops gathering data when the expected marginal benefit falls below the marginal cost.

  7.  **"...and also why 'I'd rather not know' is never rational when the stakes are real."**
      *   **Grant:** Within the pure, cost-free, perfect Bayesian model, yes. Ignoring free information cannot strictly improve expected utility.
      *   **Wrong (crucially matters - addresses your suspicion #3):** This is **flatly incorrect** for real humans and the core of your article. Reasons "I'd rather not know" *can* be rational:
          *   **Psychological Costs:** Anxiety, depression, altered self-perception, stigma. These are real utility losses not captured in a purely instrumental health-outcome model.
          *   **Information Costs:** Time, money, hassle of testing/follow-up.
          *   **Ambiguity/Aversion to Uncertain Bad News:** Your philosopher friend (#3) is correct. People exhibit **ambiguity aversion** (dislike of not knowing probabilities) and may prefer blissful ignorance over knowing a scary but uncertain risk (Ellsberg Paradox vibes). They might experience **dread**.
          *   **Impact on Future Choices/Options:** Knowing might eliminate desirable options (e.g., insurance eligibility, job prospects) or force stressful decisions you'd rather avoid.
          *   **No Actionability:** If the information won't change your actions (or available actions), its instrumental value is zero, making costs a pure loss.
          *   **Non-Stable Utilities:** Learning information can *change* your utility function. Knowing you have a high Alzheimer's risk might make you value "present cognitive clarity" more highly than before, altering the utility calculus.
          *   **Test Imperfections:** False positives/negatives add noise and potential for harmful *mis*information.

  **Good's Theorem and Declining Screening: The Silence & The Noise**

  *   **The Silence:** Good's Theorem is **utterly silent** on:
      *   Non-instrumental costs (psychological, financial, time).
      *   Changes in utility functions caused by knowing the information.
      *   Non-Bayesian preferences (ambiguity aversion, dread).
      *   Social/contextual impacts (stigma, discrimination).
      *   Imperfections in the information itself (test inaccuracy).
      *   Whether the information is truly *actionable*. (Its core value is changing *actions*).
  *   **The Noise:** It *only* speaks to the **expected instrumental value** of perfect, cost-free information within a fixed decision framework for a perfect Bayesian agent. It says declining *such* information *cannot improve expected utility outcomes*.

  **For Your Piece:**

  *   **Safe Sentence to Print:** "Decision theory shows that for a perfectly rational agent weighing only health outcomes, cost-free and perfectly accurate risk information cannot make them worse off *in terms of those outcomes*, and can help them make better choices."
  *   **Tempting Claim to Cut:** **Absolutely cut "'I'd rather not know' is never rational when the stakes are real."** This is the most misleading part. Replace it with the *reasons* declining can be rational (psychological cost, lack of actionability, test imperfections, ambiguity aversion).

  **Conclusion:** Good's Theorem provides a valuable *baseline* for understanding the *potential* instrumental value of information in idealized settings. However, it offers **zero purchase** on justifying or condemning the decision to decline "know your risk" tests in the real world. The rationality of declining hinges *entirely* on factors *outside* the theorem's scope: psychological burden, financial/time costs, lack of actionability, test quality, and the complex ways humans value (or dread) knowledge itself. Your instinct that it's nearly silent is correct; the silence starts precisely where human psychology, real-world costs, and messy context begin.
