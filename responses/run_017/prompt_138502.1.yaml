prompt: |-
  I spent forty years as a research chemist in a government laboratory, and since retiring I have been reading my way into the philosophical literature on corruption — initially out of a suspicion that the conflict-of-interest declaration I used to sign every year was doing far less work than we pretended. That reading led to my being co-opted onto a small working party of my old learned society which is revising its guidance on gifts, hospitality and conflicts of interest. We have one case left, and I should be grateful for your help with it.

  The working party is six people: four retired scientists (a botanist, a crystallographer, a statistician and myself), a retired NHS clinical director, and a political theorist we brought in last year to stop us talking past one another. We have already settled eight cases, with our reasons minuted. In summary:

  1. A hospital consultant paid a market-rate fee plus travel by a pharmaceutical company to lecture at a symposium, disclosed in the hospital register: permitted. Reason minuted: the fee bought a service, not a decision.
  2. The same consultant also sitting on the formulary committee that would rule on that company's drug: permitted only if she withdrew from those items. Reason: the interest is real but detachable, and detachment is the remedy.
  3. A council procurement officer accepting a case of wine from a firm with a live tender: prohibited, and we added that disclosure would not cure it. Reason: the gift cannot be made public without destroying either the tender or the relationship; the concealment is in the nature of the thing.
  4. A field biologist making small customary payments to village elders for permission to sample on their land: permitted, subject to a value ceiling and an entry in the field notebook. Reason: what is bought is access, which the elders rather than the state allocate; it is not the purchase of a decision the state has assigned to anyone.
  5. A constituency office distributing free roofing sheets to households in the six weeks before an election: prohibited. Reason minuted: the gift buys a standing disposition rather than a particular vote, and that is the more serious case.
  6. A facilitation payment to a customs officer to release equipment that was in any event lawfully due for release: prohibited. Reason: the payment re-describes a duty as a favour, even though no discretion is bought.
  7. A gift of livestock to a district officer at a naming ceremony, in a country where such gifts are the ordinary currency of respect: permitted up to a modest ceiling, provided the officer takes no part in any decision affecting the giver. We divided on this one and resolved it procedurally: we declined to say whether the practice is corrupt in itself and ruled only on the exposure. Our minutes record that we could not agree whether our own arm's-length standard is the right standard to apply there at all.
  8. A group leader adding a senior colleague's name to a paper in return for a reciprocal authorship later: prohibited. Reason: authorship is the currency of a role governed by rules of credit, and the exchange substitutes a private advantage for those rules.

  I have been arguing that our rulings are served equally well by at least three distinguishable rules: a transactional rule (what is bought is a decision, and a disclosed market-rate exchange is not that); a role-impartiality rule (what matters is whether the office-holder retains an unmanaged reason to depart from her duties, and detachment is the remedy); and a practice-relative rule (what matters is whether the practice in which the transfer occurs treats it as corrupt). We have never said which we are running, and I doubt we have been running one.

  The final case is this. Dr A. heads a group at a publicly funded institute. She takes no money from a supplier, Axeon Bio: no fee, no consultancy, no shares. Over roughly eight years, and without any agreement exceeding an annual email, Axeon has supplied her group, free of charge, with reagents, a serviced instrument, and — this is the part I cannot get out of my head — the standard operating procedures and the analysis scripts her postdoctoral researchers use. The group's protocols are now written around Axeon's chemistry; nobody there could run the assay on another platform without revalidating from scratch, which no one has time or money to do. Dr A. also sits on the national committee that will write the specification for a new assay in this area, and there she has argued consistently and, I believe, sincerely that the Axeon platform is the natural reference method. She has never voted against Axeon's interests; she has never needed to. Everything is disclosed — the free supply in the methods sections, the committee membership on the institute's register. Her salary is unaffected. A junior member of the group has put it to us, in writing, that the laboratory is no longer able to notice a result that would count against the platform.

  I should like: what this working party, as constituted and as minuted, will in fact decide; which of the three rules I have sketched, or which others you can find in our precedents, come apart on this case and where each one lands; what we should decide if we want to be consistent with ourselves, and which precedent is the closest analogue — together with the respect in which that analogue misleads; what principle we would be adopting under each option, particularly if we rule that this is not corruption at all, given that such a ruling seems to commit us to the practice-relative rule and to letting a discipline's own habits settle the question; and the further case that would best tell the surviving rules apart.

  I should also like your view on a suggestion of my own, which the political theorist has not yet seen. I want to say that this is a fourth species, which I have been calling infrastructural capture: the gift is not of money but of a method, and what it buys is neither a decision nor a disposition but the terms in which the decision will be described. On that view the case is worse than the roofing sheets, because recusal cannot cure it — there is nothing discrete to withdraw from, since the dependence has settled into the group's habits of measurement rather than into anyone's vote. My worry is that the notion proves far too much: every laboratory that has coalesced on one model organism, one software stack, or one publicly funded facility is dependent in a structurally similar way, and if all of that is corruption then the concept has lost its grip. Say whether the distinction can be drawn so that it bites here and not there, and where my position is weakest.
reasoning: |-
  Hmm, this is a fascinating and complex case from a retired research chemist turned corruption ethics advisor. The user presents a meticulously detailed scenario with eight precedent rulings and asks me to analyze a final case involving "infrastructural capture" by a biotech company. 

  First, I need to unpack the user's framework. They've identified three potential ethical rules running through their precedents: transactional (is a decision being bought?), role-impartiality (can bias be managed?), and practice-relative (what do local norms say?). The case of Dr. A and Axeon Bio seems designed to test these rules against each other.

  Looking at the precedents, several feel relevant: 
  - The hospital consultant case (#2) shows recusal as remedy for detachable conflicts
  - The customs payment (#6) prohibited even when no discretion was exercised
  - The authorship trade (#8) condemned substituting private rules for institutional ones

  The core tension here is between two dangers: calling this corruption risks making all scientific specialization seem suspect, while not calling it corruption ignores how corporate generosity can reshape research priorities. The user's "infrastructural capture" concept is brilliant but needs careful bounding - we don't want to condemn every lab that relies on a particular microscope or database.

  Where this differs from normal scientific specialization is the commercial entity's role. When a lab adopts C. elegans or Python, those are community standards. Axeon isn't just supplying tools - it's providing the entire methodological framework, including analysis scripts that predetermine how results get interpreted. That's closer to the authorship case (#8) where credit systems were subverted.

  The junior researcher's concern about inability to notice contrary results is particularly damning. This isn't just about Dr. A's committee votes - it's about the lab's entire epistemology being shaped by corporate gifts. Recusal wouldn't help because, as the user notes, the bias is baked into their basic operations.

  Still, I need to address the user's worry about overreach. The distinction might lie in: 
  1) Source (commercial vs community/academic) 
  2) Transparency (can others replicate without this specific toolchain?) 
  3) Lock-in effect (the revalidation barrier creates coercive dependence)

  For the working group's likely decision, the clinical director and scientists might split. The political theorist could tip toward prohibition given the subtle power dynamics. But they've avoided absolutism before (see the naming ceremony case #7) so they might prescribe disclosure-plus rather than outright prohibition.

  Ultimately, I think the user is right that this requires a fourth category. The closest precedent is actually the roofing sheets (#5) - both create diffuse loyalty rather than direct quid pro quo. But the infrastructural version is more pernicious because, like the authorship trade, it corrupts the currency of science itself.
answer: |-
  Your final case presents a profound challenge to your framework, exposing fractures between your three proposed rules and demanding principled clarification. Here’s a step-by-step analysis:

  ### 1. **What Your Working Party Will Likely Decide**  
  Given your composition, precedents, and minutes:  
  - **Probable Outcome**: **Prohibition** (5–1 or 4–2 vote).  
  - **Reasoning**: The statistician and clinical director will emphasize irremediable bias (#2, #8); the botanist/crystallographer may initially see "standard practice," but the junior researcher’s testimony and the *structural* dependence (unlike #1, #4) will sway them. The political theorist will argue this violates role-impartiality by embedding bias in epistemology itself. Minutes will focus on **inability to detach** (#2) and **subversion of institutional credit systems** (#8).  

  ---

  ### 2. **How Your Three Rules Diverge & Their Conclusions**  
  | **Rule**               | **Conclusion for Dr. A** | **Why It Fails Here**                                      |  
  |-------------------------|--------------------------|------------------------------------------------------------|  
  | **Transactional**       | *Permitted*              | No explicit "decision bought"; gifts are disclosed. Fails to capture how tools/SOPs predetermine outcomes. |  
  | **Role-Impartiality**   | **Prohibited**           | Bias isn’t detachable: Dr. A’s committee advocacy and lab dependence are fused. Recusal is impossible (§8 precedent). |  
  | **Practice-Relative**   | *Ambiguous*              | If biology accepts corporate-provided SOPs as normal, it’s permitted. But the junior’s complaint suggests the practice *isn’t* universally accepted. |  

  **New Rule from Precedents**:  
  - **Institutional Integrity Rule** (from #3, #5, #8): Corruption occurs when gifts compromise an institution’s core purpose (e.g., impartial procurement, electoral fairness, scholarly credit). Here, science’s purpose—detached inquiry—is undermined by dependence on a vendor’s methodology.  

  ---

  ### 3. **Consistency & Closest Analogue**  
  - **Most Consistent Precedent**: **#8 (Authorship trade)**.  
    - **Similarity**: Both substitute private arrangements (Axeon’s gifts/reciprocal authorship) for institutional rules (scientific independence/academic credit).  
    - **Difference**: #8 involves explicit exchange; here, the "exchange" is implicit infrastructural control.  
  - **Misleading Analogue**: **#4 (Field payments)**. Unlike village access (a *precondition* for research), Axeon’s gifts *define the research itself*, making objectivity impossible.  

  **Verdict for Consistency**: **Prohibit**. Permitting this would contradict #5 (roofing sheets buying "standing disposition") and #8 (private substitution for rules).  

  ---

  ### 4. **Principles Under Each Option**  
  - **If Permitted**: Adopts **practice-relativism**, allowing disciplines to self-define corruption. Risks normalizing corporate capture (e.g., "all labs use vendor SOPs").  
  - **If Prohibited**: Affirms **role-impartiality + institutional integrity**. Asserts science must guard against dependencies that predetermine outcomes, regardless of disclosure.  

  ---

  ### 5. **Your "Infrastructural Capture" Theory**  
  **Strengths**:  
  - Correctly identifies the unique harm: Axeon’s gifts control the *framework* of inquiry (SOPs, scripts), not just decisions.  
  - Aligns with #6 (customs payment): Even if no discretion is bought, the gift "re-describes" scientific work as contingent on Axeon’s goodwill.  

  **Weaknesses & Distinctions**:  
  - **Overbreadth Concern**: Distinguish via:  
    1. **Source**: Community-standard tools (e.g., model organisms, open-source software) serve *collective* goals; corporate gifts serve *private* interests.  
    2. **Lock-in**: Axeon’s platform requires prohibitive revalidation, coercing continued dependence. Public facilities rarely impose this.  
    3. **Epistemic Capture**: Axeon’s scripts/SOPs *directly shape data interpretation*, unlike a microscope (a neutral tool).  
  - **Weakest Point**: If the SOPs are scientifically optimal, is it still corruption? Yes—the *unilateral dependency* (not merit) corrupts. The lab cannot *credibly* reject Axeon’s platform without self-sabotage.  

  ---

  ### 6. **Test Case to Distinguish Surviving Rules**  
  **Hypothetical**: *A journal editor uses proprietary AI software (donated by TechCorp) to screen submissions. The tool’s algorithm favors certain methodologies. TechCorp’s competitors claim bias, but the editor argues the tool is efficient and disclosed.*  

  - **Transactional Rule**: Permits (no "decision bought").  
  - **Role-Impartiality**: Prohibits (tool embeds bias in editorial judgment).  
  - **Practice-Relative**: Permits if AI screening is disciplinary norm.  
  - **Institutional Integrity**: Prohibits (subverts peer review’s purpose).  

  ---

  ### Recommendation  
  **Rule for Minutes**: Adopt a **modified role-impartiality rule**:  
  > *"Gifts creating irreversible dependence on a benefactor’s framework for inquiry are prohibited, irrespective of disclosure. The remedy is not recusal but preemptive avoidance."*  

  **Addressing Your Theory**: Formalize "infrastructural capture" as a subcategory, bounded by:  
  - Private (not communal) sourcing;  
  - High exit barriers;  
  - Control over knowledge production (SOPs/scripts).  

  This prohibits Dr. A’s case but excludes public facilities/open-source tools, preserving corruption’s conceptual bite. Your position’s vulnerability—equating *all* dependencies with corruption—is resolved by these filters.  

  **Final Note**: The political theorist will likely support this. It echoes political philosophy’s concern with "soft power" shaping discourse—here, corporate tools shaping scientific truth.
