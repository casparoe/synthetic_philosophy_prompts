prompt: |-
  I run a monthly reading group — mostly programmers, a couple of biologists, all totally fine with Bayes, none with any philosophy — and I've got them for one ninety-minute evening on anthropics. Half the room has already heard of the doomsday argument and has a favourite theory, which is part of the problem. Don't explain self-sampling vs self-indication to me; plan how I should get them to the point where they can work out what each rule says in a case they haven't seen before.

  The order things have to come in is the bit I keep getting wrong. My instinct is that some version of you are not special has to be *broken* before it can be used — that they need to actually feel the pull of I could have been one of the others before any rule about counting observers means anything — and that the two rules shouldn't be named (SSA, SIA) until at least twenty minutes in, because the acronyms will let them sort themselves into teams and stop listening. Tell me if that's backwards, and what has to sit between the breaking and the naming.

  Then the one case that carries the whole thing. It can't be cosmological, or they'll think it's about space and stop attending to the structure; it can't involve sleep or amnesia, or three people will drag in Sleeping Beauty and we'll lose forty minutes to thirders and halfers; and the numbers have to be big enough that the answer is surprising but still hand-computable. My current thought is that the case has to vary the total headcount of observers while holding something else fixed, and I want you to tell me what that something else is — what exactly has to stay fixed for the two rules to come apart at all, and what happens to the case if you hold the wrong thing fixed instead.

  Misconceptions, and where in the sequence to kill each one. Ones I'm expecting: SIA is just Bayes with extra steps; this is all the reference class problem and therefore arbitrary; the doomsday argument is the same argument; SIA commits you to infinitely many observers so the probabilities aren't even defined. The one I'm most worried about is that the presumptuous philosopher will feel wrong to them only because they dislike the conclusion, and they'll spend the rest of the evening hunting for a technical excuse rather than seeing it as a symptom of something structural.

  There's also a thing I've started calling the guarantee test, and I can't decide where it belongs. Before you apply either rule, ask: under each hypothesis, was there any chance that the thing now doing this reasoning would have been somebody else instead of you? If that question has no answer, the counting has nothing to grip. Does this go in early, as a precondition on both rules; late, as the twist that stops the presumptuous philosopher looking like a cheap trick; or nowhere? And I have a suspicion it quietly favours one of the two rules — if so I need to know that before I put it on the board.

  For the check at the end I want transfer, not recall, and I'd like it to be a case where the two rules *agree*, because if they've only picked up a slogan they'll assume they have to disagree. Two I've been playing with: total observers 100 versus 100,000, with 10 versus 10,000 of them having exactly your evidence; or total 1 versus 1,000, with exactly one observer having your evidence under each. Which of those does the work, is either of them a trap, and what should I actually ask out loud so I can tell from their answers whether they've got it or are pattern-matching?

  And what should I explicitly refuse to explain at this level, and say so out loud that I'm refusing? My candidates are fine-tuning, the measure problem, Boltzmann brains, and anything involving infinite ethics — but tell me if one of those is actually load-bearing and I'm wrong to skip it.
reasoning: |-
  Okay, let me tackle this query step by step. The user runs a monthly reading group with programmers and biologists who understand Bayes but have no philosophy background. They want to teach anthropics in 90 minutes, focusing on getting participants to apply self-sampling (SSA) and self-indication (SIA) principles to novel cases. The key challenges are avoiding prior biases (especially about the Doomsday Argument), preventing tribal attachment to acronyms, and designing a case study that clearly differentiates the two rules without common pitfalls.

  First, I need to consider the sequence. The user suspects starting with "you are not special" might backfire and wants to break that intuition before building new understanding. That seems right - participants need to viscerally experience observer-indexical uncertainty before rules make sense. So the first 20 minutes should avoid jargon and focus on making "I could have been someone else" feel real.

  For the core case study, it must avoid cosmology (too distracting), sleep/amnesia (triggers Sleeping Beauty debates), and use computable large numbers. The critical factor is varying total observers while fixing something else. What exactly? It must be the evidence state shared by observers. Holding fixed the number of observers with identical evidence isn't enough - that's actually the mistake in the "100 vs 100,000 with 10 vs 10,000 same evidence" example the user considered. Instead, fix the physical process generating observers. The presumptuous philosopher case does this best: two theories predict different total populations, but your specific evidence is equally likely under both. 

  Misconception management is crucial. The "SIA is just Bayes" error should be killed immediately after introducing SIA by showing how it violates conservation of probability. For the reference class objection, explicitly note later that while reference class matters, the core issue is observer counting - that's why we're using minimal cases. The infinity problem with SIA can be deferred by stating we're only considering finite cases tonight.

  The "guarantee test" (could you have been someone else?) is fundamental but dangerous. It subtly favors SIA, so I'd introduce it after establishing both rules as a diagnostic tool for why SSA rejects certain cases. Position it as revealing a structural difference, not a trick.

  For the transfer check, use a case where both rules agree to prevent slogan-matching. The "total 1 vs 1000 with exactly one having your evidence" case works perfectly - both give 50-50 odds. Ask them to compute probabilities step-by-step silently first, then share.

  Finally, exclusions: firmly rule out fine-tuning, Boltzmann brains, infinities, and ethics. These are important but would derail the foundational focus. Explicitly say this keeps us grounded in finite, computable scenarios.

  The entire flow should be: intuitive break (10min) → core case with rules applied (30min) → misconception smashing (15min) → guarantee test twist (10min) → agreement case transfer check (15min) → clean exclusions (5min). Keep naming SSA/SIA until after the first case calculation, when the difference is concretely visible.
answer: |-
  Here's a battle-tested sequence and core case designed to force understanding over slogan-reliance. The key is making "observer indexing" viscerally real *before* naming rules, and using a case where the *physical process* differs while *your specific evidence* is held fixed.

  **The Sequence (90min Total):**

  1.  **Break "You Are Not Special" (15 min):**
      *   **Case: The Captive Lottery.** "You wake up in a featureless room. A voice announces: 'There are 100 prisoners here. 99 were captured randomly on Earth. 1 is a volunteer who walked in. You are one of them.' What's the probability you are the volunteer?"
      *   *Let them argue.* Intuition screams "1/100!" (SSA-like). Push back: "But the volunteer *knew* they were volunteering! If you were the volunteer, wouldn't your experience be *identical* to a captured prisoner waking up? What information tells you *you specifically* are likely captured?" Force the realization: **Your evidence ("I am a prisoner in a room") is compatible with *every* observer in the setup.** The only thing making "volunteer" unlikely is that there are fewer of them. *This is the pull of "I could have been one of the others."*
      *   **Kill Misconception:** "This is just Bayes!" Show the update: P(Volunteer | "I am a prisoner") = P("I am prisoner" | Volunteer) * P(Volunteer) / P("I am prisoner") = (1) * (1/100) / (1) = 1/100. *Bayes gives the answer, but anthropic rules tell us* how *to set the likelihood when your existence/observation is tied to the hypothesis.* This is where the special sauce lives.

  2.  **Introduce the Core Case: PRESUMPTUOUS PHILOSOPHER (PP) (25 min)** - **THIS IS THE WORKHORSE**
      *   **Setup:** "Two competing physics theories are proposed. **Theory A:** The universe is small, containing only **1 galaxy**. **Theory B:** The universe is vast, containing **1,000,000 galaxies**. We *know* that life evolves in *any* galaxy that forms. We *also know* that a specific, complex set of cosmic background radiation patterns (CBR-X) is required for intelligent observers *within* a galaxy to evolve. Crucially, **CBR-X is very rare**: under either theory, only **1 galaxy in the entire universe will ever have CBR-X**."
      *   **The Evidence:** "You are an intelligent observer. You look at your cosmic background radiation and see... **CBR-X**. That's all you know. What are the relative probabilities of Theory A vs. Theory B?"
      *   *Let them work in small groups (5 min).* Expect chaos: "50/50!", "A is more likely!", "B is more likely!". *Don't name rules yet.*
      *   **Facilitate Calculation:**
          *   Under A: 1 galaxy exists. CBR-X is in 1 galaxy. **1 observer like you exists.** P(You see CBR-X | A) = 1 (it's the only galaxy).
          *   Under B: 1,000,000 galaxies exist. CBR-X is in 1 galaxy. **1 observer like you exists** (in that specific galaxy). P(You see CBR-X | B) = 1 / 1,000,000 (you could be in any galaxy).
      *   **Bayes Time (Assume priors equal):** P(A | CBR-X) / P(B | CBR-X) = [P(CBR-X | A) * P(A)] / [P(CBR-X | B) * P(B)] = (1 * 1/2) / ( (1/1e6) * 1/2 ) = **1 / (1/1e6) = 1,000,000.**
      *   **The Shock:** Theory A (small universe) is *overwhelmingly* favored! *This feels deeply wrong to many.* Why? Because B predicts vastly more observers, yet you found the *one* piece of evidence that *only one observer ever sees*. **What stayed fixed?** *The physical process generating "you-specific" evidence (CBR-X observer).* What varied? *Total number of galaxies/observers unrelated to CBR-X.* This breaks the intuition that "more observers means it's more likely I'm in that universe".

  3.  **Name the Rules & Diagnose PP (15 min):**
      *   **Self-Sampling Assumption (SSA):** "I should reason as if I were a random sample from the set of *all possible observers* in my reference class (e.g., intelligent observers)." *Applied to PP:*
          *   Observers in A: 1
          *   Observers in B: 1e6
          *   P(I am the CBR-X observer | A) = 1/1 = 1
          *   P(I am the CBR-X observer | B) = 1/1e6
          *   Favors A massively. **Matches our calculation.**
      *   **Self-Indicating Assumption (SIA):** "I should reason as if I were a random sample from the set of *all possible observer-moments*, *weighted by the probability of that world existing*." More simply: "Hypotheses that predict more observers should be *a priori* more likely *simply because I exist*." *Applied to PP:*
          *   Prior P(B) is boosted by factor ~1e6 (relative to A) because it predicts 1e6x more observers (and I exist).
          *   P(CBR-X | A) = 1, P(CBR-X | B) = 1/1e6
          *   Posterior Odds: [1 * P(A)] / [ (1/1e6) * (P(B) * 1e6) ] = [P(A)] / [P(B)].
          *   **SIA cancels the likelihood penalty!** If priors P(A)=P(B), posteriors are **50/50**.
      *   **Why PP Sucks (for SIA fans):** SIA makes B *vastly* more likely *a priori* just because it has more observers, even though *your specific evidence* (CBR-X) is *equally rare* under both theories. This feels "presumptuous" – assuming the universe is big just because it *could* hold more observers like you, even though your evidence doesn't require it. **Kill Misconception:** "PP is wrong because I dislike the conclusion." No! It cleanly separates the rules based on how they handle *indistinguishable evidence generated by different processes*. SSA cares *where you are* among observers. SIA cares *that you are* an observer at all.

  4.  **The Guarantee Test (10 min) - Place HERE**
      *   **Pose the Test:** "Under a given hypothesis, was it guaranteed *from the start* that *this specific instance of reasoning* (you, right now, seeing CBR-X, having these thoughts) would occur? Or was there a chance it would have been *someone else* doing this instead?"
      *   **Apply to PP:**
          *   **Theory A:** Only one galaxy, one observer. It was *guaranteed* that the one observer would see CBR-X (by setup). *No chance "someone else" could have been doing this reasoning.* **Test Passes (for counting).**
          *   **Theory B:** 1e6 galaxies, one CBR-X observer. It was *not guaranteed* that *you specifically* would be the CBR-X observer. There was a 1/1e6 chance it would have been *someone else* seeing CBR-X and having *their* version of this reasoning. **Test Passes (for counting).**
      *   **Role:** This test **validates SSA's application** in PP. It shows *why* the likelihood calculation makes sense. It highlights that in PP, your specific identity *as the reasoner* is contingent under B, but not under A. **It subtly favors SSA** by framing the question in a way SSA naturally answers. *Position it as explaining why the PP calculation feels intuitive for SSA, not as a universal precondition.* This stops PP feeling like a cheap trick.

  5.  **Transfer Check: Where They AGREE (15 min)**
      *   **Use:** "Total Observers 1 vs 1,000, with **exactly one observer** having your evidence under each hypothesis." (e.g., "Unique Brainprint #12345")
      *   **Ask:** "Calculate P(H1 | I have Brainprint #12345) assuming equal priors on H1 (1 observer) and H2 (1000 observers). Do it *both* ways (SSA & SIA)."
      *   **Why it Works:**
          *   **SSA:** P(Data | H1) = P(I am #12345 | H1) = 1/1 = 1. P(Data | H2) = P(I am #12345 | H2) = 1/1000. Odds = (1 * 1/2) / ( (1/1000) * 1/2) = 1000. Favors H1.
          *   **SIA:** Prior boost for H2: ~1000x. P(Data | H1) = 1. P(Data | H2) = 1/1000. Posterior Odds: (1 * P(H1)) / ( (1/1000) * (P(H2) * 1000) ) = P(H1) / P(H2). **50/50 if priors equal.**
          *   **TRAP:** They will likely *assume* disagreement. **Force calculation.** They *discover* agreement: **Both give 50/50!**
      *   **Why This Transfer Check:** It kills pattern matching ("SSA always favors small, SIA always favors large"). It forces them to apply the *structure* of the rules. The key difference is *only* when the number of observers *with your specific evidence* varies between hypotheses (as in PP). Here, it's fixed at 1. **Ask Out Loud:** "Calculate the posterior odds step-by-step using SSA. Now do it step-by-step using SIA. What did you get? Did you expect that?" Listen for *how* they apply the rules, not just the answer.

  6.  **Explicitly SKIP (State Upfront & Reiterate):**
      *   **Fine-Tuning:** "We're assuming life/observers *do* arise given the right physics (like CBR-X in PP). We're not debating *why* that physics exists."
      *   **Measure Problem / Boltzmann Brains:** "We're assuming finite, well-defined counts of observers. Infinite or ill-defined measures add layers we can't cover tonight."
      *   **Infinite Ethics / Long-Term Futures:** "Our focus is on the *epistemology* of observer counting for hypothesis testing *now*, not valuing future beings or infinities."
      *   **Doomsday Argument:** "While related, DA often smuggles in extra assumptions. We're building the foundation. We *might* touch DA briefly at the end *only* if time allows, but it's not the goal." **(Stick to this! It's a distraction magnet.)**
      *   **Why Skip:** These are complex, contentious, and often hinge on issues *beyond* the core SSA/SIA distinction (cosmology, decision theory, infinity math, value theory). Including them derails the focus on the fundamental anthropic reasoning structure.

  **Why This Works:**

  1.  **Breaks Intuition First:** Captive Lottery makes "who am I?" vivid *before* rules.
  2.  **PP is the Perfect Case:** Holds fixed the *generation of your specific evidence* (1 observer sees CBR-X) while varying *total observers*. Makes the core conflict unavoidable. Cosmology is the *example*, not the point – the structure is clear.
  3.  **Rules Named Late:** Prevents tribal sorting. Names are introduced *after* the conflict is felt and calculated.
  4.  **Guarantee Test Contextualized:** Explains SSA's grip on PP without being a precondition, revealing why SIA feels presumptuous.
  5.  **Agreement Case for Transfer:** Forces deeper understanding, exposes rule structure, avoids slogan battles.
  6.  **Clean Exclusions:** Prevents rabbit holes, keeps focus tight.

  **Key Things to Watch For & Steer:**

  *   **"SSA is just the reference class problem!"** Counter: "Yes, reference class matters, but PP uses the minimal class 'intelligent observers seeing CBR-X'. The core issue is *how to count* when your existence is tied to the hypothesis, even in a fixed reference class."
  *   **"SIA probabilities are undefined with infinities!"** Agree & Defer: "Absolutely, that's a major problem! That's why we explicitly restricted ourselves to *finite* universes tonight. SSA has its own infinity headaches."
  *   **"But in PP, maybe other galaxies could have *different* rare evidence?"** Shut Down: "By the setup, CBR-X is the *only* evidence allowing observers. Stick to the model. We're isolating a principle." Don't let them "solve" PP by changing the hypothetical.
  *   **Someone Mentions Sleeping Beauty:** "Great problem! It explores similar issues about self-location and updating, but with added layers of time and memory loss. We don't have time to do it justice tonight without derailing our core focus. Let's discuss it next month?" (Have a sign-up sheet ready).

  This sequence maximizes the chance they walk away understanding *how* SSA and SIA *mechanically* derive different results in cases like PP and why that difference arises from a fundamental disagreement about how to index reasoning to observer existence and evidence. Good luck!
