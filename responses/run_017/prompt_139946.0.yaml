answer: |-
  Below is a decision procedure designed to operationalize Dennett's concepts (cranes vs. skyhooks, greedy reductionism) using your frameworks ("ghost crane", "handoff debt") and other tests. It prioritizes speed, clarity, and defensibility, with plain-language questions and fixed verdicts. The procedure consists of **5 sequential gates**. If a proposal fails any gate, evaluation stops with a "Fail" verdict and a clear objection. If it passes all gates, it proceeds to the panel for final funding consideration. Gates 1–4 assess explanatory adequacy; Gate 5 flags non-explanatory proposals for panel review.

  ### Decision Procedure: Explanatory Adequacy Assessment  
  **Fixed Verdicts for Dropdown (per gate)**:  
  - **Pass**: Proposal meets criteria.  
  - **Fail**: Proposal fails; evaluation stops.  
  - **Panel**: Hand to panel for values-based decision (e.g., risk tolerance).  
  - **N/A**: Not applicable (e.g., proposal doesn’t claim explanation).  

  **Output for Failed Proposals**:  
  - One-sentence objection (for appeals): "The proposal fails because [reason]."  

  ---

  ### Gate 1: Claim Check  
  **(a) Question to ask:**  
  *Does the proposal explicitly claim to explain how a complex phenomenon (e.g., cognition, cooperation, culture) emerges from simpler components?*  

  **(b) Sufficient answer (Pass):**  
  - Yes, and it names the phenomenon and the lower-level components (e.g., "We explain cooperation via neural circuits" or "Culture arises from information-theoretic principles").  

  **(c) Stop with no (Fail):**  
  - No explicit claim of emergence (e.g., only describes, predicts, or applies a phenomenon without explaining its origin).  

  **(d) Handoff to panel (Panel/N/A):**  
  - N/A (if no claim). Proceed to Gate 5 for non-explanatory proposals.  

  **Why this gate?** Filters out non-explanatory work (e.g., descriptive models) early.  

  ---

  ### Gate 2: Ghost Crane Check  
  **(a) Question to ask:**  
  *Do any proposed mechanisms or components implicitly assume the competence they are meant to explain? Apply the substitution test: If you replace the component’s description with the phenomenon itself, does the explanation still "work"?*  

  **(b) Sufficient answer (Pass):**  
  - No. Components are described in simpler terms than the phenomenon (e.g., neurons fire based on electrochemical gradients, not "neurons decide to cooperate").  

  **(c) Stop with no (Fail):**  
  - Yes. Substitution test reveals a ghost crane (e.g., a "cooperation module" that just relabels cooperation at a smaller scale).  

  **(d) Handoff to panel (Panel):**  
  - Unclear due to ambiguous language, but the core idea may be salvageable (e.g., "quantum resonance" metaphors).  

  **Why this gate?** Catches skyhooks disguised as mechanisms. Uses your "ghost crane" test directly.  

  ---

  ### Gate 3: Handoff Debt Check  
  **(a) Question to ask:**  
  *Does the proposal address how lower-level components produce higher-level phenomena? Specifically, is handoff debt (1) acknowledged and (2) addressed via mechanisms, experiments, or citations?*  

  **(b) Sufficient answer (Pass):**  
  - Debt is declared and paid: Proposes experiments, models, or existing work to bridge levels (e.g., "We model how neural firing scales to group behavior using agent-based simulations").  

  **(c) Stop with no (Fail):**  
  - Debt is hidden: Jumps levels without mechanistic links (e.g., "Neuromodulator X causes societal change" without individual→group scaling).  

  **(d) Handoff to panel (Panel):**  
  - Debt is declared but payment is high-risk (e.g., "Future work will explore this"). Panel decides if risk is acceptable.  

  **Why this gate?** Targets greedy reductionism. Incorporates your "handoff debt" concept.  

  ---

  ### Gate 4: Predictiveness & Generativity Check  
  **(a) Question to ask:**  
  *Does the lower-level mechanism generate testable predictions or patterns not implied by higher-level theories alone? Apply two tests:*  
  1. **Look-ahead test**: Does the mechanism require the end state to be pre-specified?  
  2. **Uniqueness test**: Does it predict something new (e.g., experimental signatures, boundary conditions)?  

  **(b) Sufficient answer (Pass):**  
  - Passes both: Mechanism works without pre-specified goals (e.g., selection, self-organization) AND predicts novel phenomena (e.g., "Our model predicts hysteresis in cultural shifts").  

  **(c) Stop with no (Fail):**  
  - Fails look-ahead: Requires the end state (e.g., "The system optimizes for cooperation" without explaining how "cooperation" is defined pre-emergence).  
  - Fails uniqueness: No novel predictions (e.g., "Bayesian inference replicates known learning curves" without new insights).  

  **(d) Handoff to panel (Panel):**  
  - Predictions are speculative but theoretically grounded (e.g., "This could explain exoplanet societies").  

  **Why this gate?** Consolidates your look-ahead/unplugging tests and adds predictive power to avoid "why go down there?" redundancy.  

  ---

  ### Gate 5: Non-Explanatory Proposal Check  
  **(a) Question to ask:**  
  *Does the proposal avoid claims about emergence (per Gate 1) and instead focus on description, prediction, or tool-building?*  

  **(b) Sufficient answer (N/A):**  
  - Yes. No explanation attempted (e.g., "We will catalog behavioral videos").  

  **(c) Stop with no (N/A):**  
  - N/A. Proceed to panel with verdict: "Not explanatory; evaluate on other merits."  

  **(d) Handoff to panel (Panel):**  
  - Always. Panel decides if descriptive work is fundable under the call.  

  **Why this gate?** Handles non-explanatory proposals cleanly without forcing them into the frame.  

  ---

  ### Procedure Workflow  
  1. Start at **Gate 1**.  
  2. If **Pass**, proceed to next gate.  
  3. If **Fail**, stop and output objection.  
  4. If **Panel**, stop and flag for panel review.  
  5. If **N/A** (Gate 1 or 5), skip to Gate 5 and end with panel referral.  
  6. Passing all Gates 1–4 → "Pass" verdict. Panel makes final funding decision.  

  ---

  ### Evaluation of Example Proposals  
  #### Proposal 1: Physicist’s "Coherence Maximization"  
  - **Gate 1 (Claim Check)**: Pass. Claims to explain origin of life/cooperation from physical principles.  
  - **Gate 2 (Ghost Crane)**: Pass. "Coherence maximization" is a physical principle (not anthropomorphized).  
  - **Gate 3 (Handoff Debt)**: **Fail**. Hidden debt: No mechanism for how coherence scales from thermodynamics to life/cooperation (e.g., no steps for chemical → evolutionary transitions). Experimental signature only validates physics, not emergent phenomena.  
  - **Verdict**: Fail.  
  - **Objection for appeal**: "The proposal fails because it does not address how thermodynamic coherence bridges to biological or social complexity, hiding critical handoff debt."  

  #### Proposal 2: Neuromodulator-Driven Social Trend  
  - **Gate 1 (Claim Check)**: Pass. Claims to explain (e.g.) violence decline via neurobiology.  
  - **Gate 2 (Ghost Crane)**: **Fail**. Neuromodulator (e.g., serotonin) is a ghost crane: Described as "reducing aggression" (substitute "violence decline" → explanation unchanged). No lower-level mechanism (e.g., how genes/environment modulate the neuromodulator).  
  - **Verdict**: Fail.  
  - **Objection for appeal**: "The proposal fails because the neuromodulator is credited with the societal trend it is meant to explain, acting as a ghost crane without reduction to simpler components."  

  #### Proposal 3: Your Lab’s Bayesian Word Learning  
  - **Gate 1 (Claim Check)**: Pass. Claims to explain word learning via Bayesian inference.  
  - **Gate 2 (Ghost Crane)**: **Fail**. Hypothesis space is a ghost crane: "Candidate meanings" substitute for "word knowledge" (e.g., space assumes pre-existing semantic structure). No account of how hypotheses are generated from sensorimotor inputs.  
  - **Gate 3 (Handoff Debt)**: N/A (stopped at Gate 2).  
  - **Verdict**: Fail.  
  - **Objection for appeal**: "The proposal fails because the hypothesis space of candidate meanings implicitly assumes the linguistic competence it is meant to explain, acting as a ghost crane."  
  - **How to fix**: A passing version would reduce the hypothesis space’s debt. E.g., "We model meaning construction from perceptual primitives (e.g., object salience) via hierarchical Bayesian inference, with experiments testing how children form hypotheses from ambiguous inputs."  

  #### Descriptive Proposal: Video Data on Collective Behavior  
  - **Gate 1 (Claim Check)**: Fail → Proceed to Gate 5.  
  - **Gate 5 (Non-Explanatory)**: N/A.  
  - **Verdict**: Not explanatory; hand to panel.  
  - **Output**: "Proposal does not claim to explain emergence; evaluate descriptively."  

  ---

  ### Limitations and Misfires  
  The procedure is strict to ensure objectivity but may misfire in three cases:  
  1. **Genuinely new phenomena (e.g., unknown levels)**:  
     - Gates 2–3 may **fail** legitimate proposals if levels aren’t established. Mitigation: High-risk handoffs (e.g., "We explore a new level") go to **Panel** for appetite-based decisions.  
  2. **Badly written proposals**:  
     - Gates rely on text-as-written. A valid crane with poor articulation may **fail**. Mitigation: Use **Panel** for ambiguous cases (e.g., jargon-heavy but conceptually sound).  
  3. **Bias disguised as "skyhook"**:  
     - Fixed gates minimize this. **Ghost crane** and **handoff debt** are objective tests. If you disagree with a verdict, the "Objection for appeal" forces specificity.  

  ### Final Notes  
  - **Speed**: 20 mins/proposal is feasible. Focus on key text (e.g., "mechanism," "explain," "model").  
  - **Defensibility**: Each fail has a clear, testable objection.  
  - **Your Lab’s Takeaway**: The procedure flagged the ghost crane in your hypothesis space. To pass, reduce debt by modeling how meanings are built, not just selected.  

  This procedure prioritizes Dennett’s core ideas while avoiding jargon. Use it as a checklist—it won’t catch every nuance but will filter skyhooks and greedy reductionism reliably.
