  - If the proposal passes Gates 1-5, then the overall verdict is "Pass" (for explanatory adequacy).
  - If at any gate it fails, then "Fail".
  - If at any gate it is "Panel", then we stop and mark as "Panel" (for that gate).

  Now, we run the procedure on the three proposals and one descriptive proposal.

