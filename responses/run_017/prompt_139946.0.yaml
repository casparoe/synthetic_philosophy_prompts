prompt: |-
  Hi. I sit on the review panel for a new interdisciplinary call at our foundation (working title something like "Origins of Mind and Society" — the scope is roughly: how you get cognition, cooperation and culture out of stuff that has none of it). We see about forty proposals a cycle, from physicists, developmental psychologists, anthropologists, ML people, and at least one person per round who has discovered that everything is really a resonance. My job is to attach a one-page "explanatory adequacy" note to each proposal, and I have maybe twenty minutes per proposal, no way to ask proposers for clarifications (it's blind), and a panel chair who is a cell biologist and will visibly loose patience if I say anything that sounds like jargon. Each proposal is around 1.5M over four years, and I have to be able to defend the note if a rejected PI complains.

  What I want is a decision procedure I can run, not an essay. The ideas to operationalize are Dennett's: cranes versus skyhooks, and the complaint about greedy reductionism — the move where you "explain" something by jumping straight to the bottom level and skipping the middle ones. My panel basically agrees with both when I describe them in plain words, and both are useless to me as stated, because nobody writes a proposal that says "and then a skyhook happens."

  So: give me an ordered set of gates, each with (a) the question to ask of the proposal text as written, (b) what counts as a sufficient answer, (c) where I stop with a no, and (d) where I hand the decision to the panel because it's a values call rather than a factual one — risk appetite, whether we're funding techniques or answers, that kind of thing. Verdicts should come from a short fixed list I can put in a dropdown, and the output should include the one objection I'd have to raise if the PI appealed.

  Two bits of vocabulary I've half-invented and been using on my own — keep them if they're worth keeping, tell me plainly if they're confused:

  - "Ghost crane": a proposal that looks like a mechanism because it's written in mechanism language, but whose moving parts are credited with exactly the competence that was supposed to be explained, just at a smaller scale, an earlier time, or a lower level. My rough test is that you can substitute the word for the thing-to-be-explained into the description of the part without anything changing.
  - "Handoff debt": every crane has to be handed off from the level below it — somewhere you have to say how the dumber parts do the work. Declared debt (they say roughly who will pay it and when) I'm happy to fund against. Hidden debt is where I think greedy reductionism actually lives.

  Other tests I've been fiddling with and can't get to behave: a look-ahead test (does the mechanism need the end state specified in advance in order to work at all?), an unplugging test (if the crane is removed, does the capacity degrade gradually or does the whole thing vanish?), and some rule about what the lower-level story predicts that the upper-level story doesn't — if the answer is "nothing", why go down there? Consolidate these, drop them, or replace them as you see fit, but be explicit about which distinctions have to survive for the procedure to still be tracking the real idea and which ones are only conveniences.

  Then run it properly on three proposals (treat these as one-page summaries):

  1. A physicist proposes a new variational principle — call it "coherence maximization" — that governs open systems, and claims it explains both the origin of life and the evolution of cooperation, with a proposed experimental signature in thermodynamic efficiency.
  2. A group proposes to explain a large, well-documented social trend (your pick: the long decline in interpersonal violence, or the fertility transition) with a story about a neuromodulator, plus a design that measures proxies for it in a modern population.
  3. One from my own lab, which is why I'm asking: we want money to model children's word learning as Bayesian inference over a hypothesis space of candidate meanings. I think it's a crane. I suspect your procedure is going to tell me the hypothesis space is a ghost crane and that the actual explanatory work is somewhere we haven't done it. If that's what it says, say so, and say what a version of the project that passes would look like.

  Also show me the procedure declining to give a verdict: e.g. a proposal that just wants to build a large descriptive model of collective behaviour from video data and claims to explain nothing. I don't want to force those into the frame.

  Finally, be honest about where the procedure misfires. I'm most worried about (i) genuinely new phenomena where nobody yet knows what the levels are, (ii) proposals that are right but badly written, and (iii) me using "skyhook" as a fancy way of saying "I definately don't like this guy."
reasoning: |-
  We are designing a decision procedure for evaluating proposals based on Dennett's concepts of cranes vs. skyhooks and avoiding greedy reductionism. The procedure will consist of a sequence of gates (questions) that each proposal must pass. Each gate has:
  (a) the question to ask of the proposal text
  (b) what counts as a sufficient answer
  (c) where we stop with a "no" (rejection)
  (d) where we hand the decision to the panel (values call)

  We'll use the terms provided: "ghost crane" and "handoff debt", and incorporate the tests the user mentioned (look-ahead, unplugging, and the predictive power of the lower level) where appropriate.

  The fixed list of verdicts (for dropdown) will be:
  - Pass: The proposal passes this gate.
  - Fail: The proposal fails this gate and is rejected.
  - Panel: The issue is a values call and goes to the panel.
  - N/A: Not applicable (for when a gate doesn't apply, e.g., if the proposal is purely descriptive).

  The output for each proposal evaluation should include:
  - The overall verdict (Pass, Fail, or Panel for the entire procedure, and if Fail, the one objection to raise in case of appeal).
  - For each gate, the verdict (Pass, Fail, Panel, or N/A) and a brief reason.

  We'll design a sequence of gates:

  Gate 1: Scope Check
  (a) Question: Does the proposal claim to explain the emergence of a complex phenomenon (cognition, cooperation, culture) from simpler components?
  (b) Sufficient answer: Yes, explicitly or by clear implication.
  (c) Stop with no: If the proposal does not aim to explain emergence (e.g., it's purely descriptive, or it only characterizes an existing system without explaining how it came to be). Then we can stop and mark as N/A for the rest, but note that this is a different kind of proposal.
  (d) Handoff to panel: If the panel might still want to fund it for other reasons (e.g., technique development, data collection) even without an explanation.

  Gate 2: Skyhook Check
  (a) Question: Does the proposed mechanism rely on any unexplained or pre-existing complex capacity that is equivalent to the phenomenon being explained? (This is the ghost crane test: if you can substitute the thing-to-be-explained into the description of a part without changing the meaning, then it's a ghost crane.)
  (b) Sufficient answer: No ghost cranes are present. The components are described at a lower level of complexity and do not possess the full capacity of the phenomenon to be explained.
  (c) Stop with no: If there is a ghost crane (i.e., the mechanism's parts are credited with the same competence as the whole, just at a smaller scale or earlier time). This is a Fail.
  (d) Handoff to panel: Not applicable for this gate (if a ghost crane is found, it's a clear failure of explanatory adequacy).

  Gate 3: Handoff Debt Check
  (a) Question: Does the proposal explicitly acknowledge and address how the lower-level components (or previous stage) give rise to the higher-level phenomenon? (That is, is the handoff debt declared and a plan to pay it provided?)
  (b) Sufficient answer: The proposal either (i) provides a mechanistic account of the handoff, (ii) references existing work that provides the handoff, or (iii) includes a plan to investigate the handoff (declared debt). The plan must be credible (e.g., within the project scope).
  (c) Stop with no: If the handoff debt is hidden (i.e., the proposal jumps levels without explaining the transition) and there is no plan to address it. This is greedy reductionism.
  (d) Handoff to panel: If the handoff debt is declared with a plan that is high-risk or speculative, but the panel might still fund it for high-reward potential.

  Gate 4: Look-Ahead Test
  (a) Question: Does the proposed mechanism require the end state (the complex phenomenon) to be specified in advance in order to work? (That is, is the mechanism teleological or does it rely on foresight?)
  (b) Sufficient answer: The mechanism does not require the end state to be pre-specified. It can build up the phenomenon through step-by-step processes (e.g., selection, self-organization) without a goal built-in.
  (c) Stop with no: If the mechanism requires the end state to be known or specified in advance (e.g., the system is designed to reach that specific state, without a process that can generate it from simpler rules). This would be a skyhook-like element.
  (d) Handoff to panel: If the mechanism has some minimal teleology (e.g., in evolutionary algorithms, a fitness function is used) but the panel might consider it acceptable as a modeling tool.

  Gate 5: Unplugging Test
  (a) Question: If the proposed crane (mechanism) were removed or disabled, would the phenomenon degrade gradually (suggesting a robust, multi-level system) or vanish entirely (suggesting the crane is doing all the work and no redundancy exists)?
  (b) Sufficient answer: The proposal either (i) provides evidence or argument for gradual degradation (robustness) or (ii) acknowledges that the crane is essential and that the phenomenon would vanish (but then we must ask if that is a problem). However, for origins, we might expect that without the crane the phenomenon wouldn't exist at all. So this test is more about whether the crane is the only possible explanation or if there are alternatives. We adjust: The key is whether the crane is the only one or if there are other supporting factors. We want to avoid a proposal that posits a single crane without which nothing works, especially if that crane is not well-grounded.
  (c) Stop with no: If the proposal implies that the crane is the only possible mechanism and there is no consideration of alternatives or robustness, and the crane itself is not well-supported. But note: for origins, it might be that without that crane, the phenomenon doesn't emerge. So we must be cautious. Instead, we focus on whether the proposal acknowledges the possibility of multiple cranes or the role of context? We might reframe: Does the proposal consider the possibility of other pathways or the role of the environment? If it claims exclusivity without evidence, that is a problem.
  (d) Handoff to panel: If the proposal claims exclusivity but with strong evidence, or if it is unclear, then it might be a risk the panel is willing to take.

  Given the complexity, we might reframe or drop this gate. Alternatively, we can use it as a secondary check. Let's instead use:

  Gate 5: Predictive Power Test
  (a) Question: Does the lower-level account predict something that the higher-level account does not? (To avoid the "why go down there?" problem)
  (b) Sufficient answer: Yes, the proposal identifies novel predictions (e.g., experimental signatures, unexpected phenomena) that arise from the lower-level mechanism and that are not explained by the higher-level theories.
  (c) Stop with no: If the proposal does not provide any novel predictions and the lower-level story is only a restatement of the higher-level one (i.e., it adds nothing new). This is a form of greedy reductionism because it doesn't add explanatory value.
  (d) Handoff to panel: If the novel predictions are speculative or long-term, but the panel might value the theoretical advance.

  Now, we have five gates. The procedure runs through each gate in order. If a gate fails, we stop and return a Fail with the reason. If a gate is passed, we move to the next. If a gate is marked as Panel, we stop and hand to the panel. If at any gate the proposal is N/A (like Gate 1), then we note that and stop the procedure (but the panel might still consider it under a different category).

  We also need a final gate for overall risk and values.

  Gate 6: Overall Viability
  (a) Question: Even if the proposal passes the explanatory adequacy gates, are there other factors that might make it too risky or misaligned with the call? (This is a catch-all for values and risk.)
  (b) Sufficient answer: The proposal is within the call's scope and the risk is acceptable. But note: we are only evaluating explanatory adequacy, so this gate is about whether the panel should consider it despite passing the earlier gates? Actually, we can make this gate always go to the panel: it's the final step to say that the proposal passes our explanatory adequacy test and now the panel decides on other grounds. So we don't need to evaluate anything here, just note that it's passed the gates and hand to the panel for final decision.

