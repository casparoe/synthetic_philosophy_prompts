  After Gate 5, if all passed, then we go to Gate 6 which is automatically "Panel" for final decision (because the panel must consider other factors like cost, feasibility, etc.). But our job is only to attach the explanatory adequacy note. So if it passes Gates 1-5, we mark it as "Pass" for explanatory adequacy and note that the panel must still decide on overall merit.

