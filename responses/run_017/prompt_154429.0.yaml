answer: |-
  ## VERSO™ RELEASE NOTES: v3.0 "FORMAL AFFINITY"  
  *Enforcing Poetic Fidelity, One Constraint at a Time*

  **OVERVIEW:**  
  We're thrilled to announce Verso 3.0, a paradigm shift in machine translation. While Verso 2.x prioritized "meaning" (a nebulous concept at best), users consistently reported dissatisfaction with the *aesthetic experience* of translated poetry. Verso 3.0 introduces **Strict Isomorphy Mode™**, a revolutionary approach that recognizes the profound truth: **Form *Is* Content**. A poem isn't just *what* it says; it's *how* it occupies space, sounds, and visually presents itself. Forget semantic drift – we're combating *structural betrayal*.

  **CORE PRINCIPLES OF STRICT ISOMORPHY MODE:**  
  Verso 3.0 adheres to the following non-negotiable hierarchy of formal fidelity, developed in consultation with leading (and delightfully uncompromising) formalist theorists:

  1.  **Acrostic Integrity:** The initial letters of each line *must* spell the same sequence as the source. This hidden architecture is paramount, often encoding the poem's true essence or the poet's secret intent.
  2.  **Line Count & Syllabic Equivalence:** Each target line matches its source counterpart exactly in number and syllable count. The poem's visual and rhythmic skeleton is sacrosanct.
  3.  **Rhyme Scheme & Terminal Stress:** Rhyme patterns (ABAB, AABB, etc.) and the stressed/unstressed quality of line-ending syllables are replicated precisely. Rhyme isn't ornamentation; it's argumentative glue.
  4.  **Proximity of Metaphor:** Where possible, *a* metaphor is retained, though its semantic content may shift to satisfy higher-ranked constraints. A metaphor's *weight* (in syllables and cultural resonance *potential*) matters more than its meaning.
  5.  **Lexical Residue:** Words vaguely related to the source concepts are desirable, but subordinate to all above. "Meaning," in its crude, denotative sense, is merely a pleasant side-effect.

  **KEY FEATURES & INNOVATIONS:**

  *   **Acrostic Enforcement Engine (AEE):** Our crown jewel. The AEE guarantees acrostic preservation, dynamically overriding semantics to achieve the required initial letters. This often unlocks surprising poetic depths previously obscured by mere "sense."
  *   **Syllable-Matching Metaphor Substitution (SMMS):** If the source metaphor won't fit syllabically or can't rhyme appropriately, SMMS selects a culturally *adjacent* metaphor of identical syllabic length. (e.g., Source: "Heart of stone" [4 syll] -> Target: "Mind of steel" [4 syll]).
  *   **Rhyme-Primed Particle Recruitment (RPPR):** When natural lexical rhymes fail, RPPR leverages grammatical particles, conjunctions, or strategically placed adverbs to fulfill the rhyme scheme without compromising syllable count. Expect profound resonances like "the/be," "and/land," or "thus/us."
  *   **Onomastic Generation Module (OGM):** Need a proper name starting with 'Q' to save an acrostic? OGM invents culturally plausible names or repurposes obscure geographical features to hit the target letter and syllable count.
  *   **Referential Elasticity:** Entities (people, places, things) are dynamically reassigned based on formal needs. If "Paris" (2 syll) ruins the acrostic but "Brussels" (2 syll) saves it, expect a Belgian love story. The *concept* of an iconic city is preserved, if not the specific one.

  **WORKED EXAMPLE: Witness Strict Isomorphy in Action!**

  *   **Source Text (Glossed Imaginary Language - "Lyrian"):**  
      (F)orest deep, where shadows play,  
      (L)one wolf howls to end the day.  
      (O)h, the moon, so cold and bright,  
      (P)eace descends upon the night.

      *Gloss:*  
      Forest deep, where shadows dance,  
      Lone wolf howls as day does end.  
      Oh, the moon, so cold and bright,  
      Peace comes down upon the night.

  *   **Verso 2.x Output (Meaning-First):**  
      In the deep woods, shadows dance and leap,  
      A solitary wolf howls as daylight fades to sleep.  
      Behold the moon, gleaming cold and white,  
      A deep peace settles softly on the night.  
      *(Betrayal! Line count altered, acrostic lost, syllable variance, rhyme scheme unstable.)*

  *   **Verso 3.0 Strict Isomorphy Output:**  
      (F)oggy marsh, where newts convene,  
      (L)oud geese shout, the scene's obscene!  
      (O)h, the lamp, so harsh and near,  
      (P)anic grips the atmosphere.

      *Preservation Achieved:*  
      - Acrostic: F-L-O-P (Perfect!)  
      - Lines: 4 (Perfect!)  
      - Syllables: 6/5/6/5 (Matches source!)  
      - Rhyme Scheme: AABB (Matches source!)  
      - Terminal Stress: Play/DAY, Bright/NIGHT -> Convene/OBSCENE, Near/ATMOSPHERE (Stressed/Unstressed pattern preserved!)  
      - Metaphor Proximity: "Shadows play" -> "Newts convene" (Both involve hidden creatures gathering? Syllables match!). "Moon" -> "Lamp" (Both light sources? Syllables match!).  
      - Lexical Residue: "Night" -> "Atmosphere" (Associated concepts? Syllables saved the acrostic!).  
      *(True Fidelity! The melancholic nature contemplation is subtly transformed into an eco-horror vignette, revealing the latent absurdism within the original form.)*

  **CUSTOMER TESTIMONIAL:**  
  *"Finally! As a scholar of 14th-century acrostic sonnet cycles, I despaired of conveying the intricate formal genius of 'The Sable Hart' in translation. Previous tools rendered the exquisite 'V-E-N-I-S-O-N' acrostic meaningless. Verso 3.0? Perfection! Sure, the lines about 'virtue's enduring grace' became 'vultures eat neglected scraps,' and 'noble stag' became 'Nigerian stamp,' but the *acrostic* is intact! The rhyme scheme is flawless! The syllable count is exact! The argumentative force of the original form shines through, unencumbered by distracting denotative coherence. Five stars!"* - Prof. Alistair Finchley, Dept. of Constrained Poetics, Oxbridge University (Fictional).

  **KNOWN ISSUES (v3.0.1):**

  *   **ISSUE #V3-0451:** *Semantic Reversal via Acrostic:* In rare cases (approximately 87.3% of acrostic poems), the imperative to preserve the acrostic sequence may result in the target text expressing sentiments diametrically opposed to the source text (e.g., declarations of love becoming indictments of betrayal, descriptions of peace evoking terror). *Status: Working as Intended. This highlights the fascinating tension inherent in form, not a software flaw.*
  *   **ISSUE #V3-0782:** *Nonsense Rhymes:* RPPR may occasionally utilize extremely obscure or archaic words, or functional particles, leading to rhymes that are technically perfect but semantically inert or jarring (e.g., rhyming "existential dread" with "the bread").
  *   **ISSUE #V3-1099:** *Cultural Dislocation:* OGM-generated names or locations, while syllabically and alphabetically precise, may introduce unintended cultural connotations or anachronisms (e.g., placing a medieval knight in "Downtown Winnipeg" to satisfy a 'W' requirement).
  *   **ISSUE #V3-2015:** *Metaphor Drift:* SMMS substitutions, while metrically sound, can radically alter the poem's imagery and tonal trajectory (e.g., "ship navigating stormy seas of doubt" -> "bus stuck in traffic jams of gout").
  *   **ISSUE #V3-0001:** *General Intelligibility:* Users may occasionally report that the output text appears nonsensical or bears only tangential resemblance to the source's ostensible meaning. *Status: By Design. Meaning is prioritized Level 5. Focus on the higher-order structural integrity.*

  **UPGRADE TODAY!**  
  Experience the future of true poetic fidelity. Download Verso 3.0 and let the form set you free (from the tyranny of mere meaning).
