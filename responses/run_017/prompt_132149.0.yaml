prompt: |-
  I've been reading about the question people discuss under the heading of moral worth — whether someone who does the right thing does it for the reason that makes it right — and I keep hitting a case type that doesn't match the standard examples. Two instances.

  (1) A department chair blocks a hiring decision because she believes the search was procedurally rigged. It was rigged, and that is exactly what makes blocking it the right thing to do. But her belief comes from misreading an email: she thinks the shortlist was cut for an improper reason when it was not, and there is a different, unnoticed defect of the same kind that does taint the process. Had the email read differently, she would have let a rigged decision through.

  (2) A tenants' association leader rejects a settlement that would benefit her own building, because she believes accepting would set a precedent that hurts tenants elsewhere. That is true, and it is the best thing to be said for rejecting. But she believes it only because a friend in law school told her so; she cannot reconstruct the argument, and the argument her friend gave was bad. The sound argument is one she has never heard.

  In both, the agent acts on the consideration that genuinely makes the action right, and in both the route from that consideration to the action is broken in some way. It is not the familiar case of right action from a self-interested motive, and it is not action that is right by luck; whatever goes wrong here goes wrong inside the agent's own psychology. Nor is it clear to me that the agent's true belief merely needs to be added to the story, since in each case she would have acted the same way had the belief been false.

  Does this configuration have a name? More than the label, I want the carving: are (1) and (2) one defect or two, or more than two? How does the case sit with the standard requirement that the agent act because of the right-making feature, and with the views that relax that requirement? Does the breakage remove credit entirely, reduce it, or leave it untouched? And where is the boundary — is there a version where the broken route is harmless, and a neighboring version where the same breakage is clearly worse? If nothing established fits, coin a term, define it, and give me boundary cases. No reading list or citations, please; the distinction itself is what I am after. Please answer in American English.
reasoning: |-
  Okay, the user presents two intricate cases challenging standard notions of moral worth. They describe situations where agents perform objectively right actions based on the correct right-making features, but their epistemic connection to those features is flawed. 

  Hmm, what makes these cases particularly thorny is that unlike classic examples (like Kant's sympathetic shopkeeper), here the agents aren't motivated by wrong reasons - they explicitly cite the morally relevant factors. Yet their grasp of those factors is either accidentally true (case 1's email misreading) or uncritically accepted (case 2's reliance on bad argument). 

  The user seems frustrated that existing frameworks don't capture this. They're not asking for literature - they want conceptual surgery. Three core puzzles stand out: 
  First, whether the defect is singular (epistemic failure) or compound (epistemic + justificatory). 
  Second, how credit attribution works when the right reason is "grasped" but not truly understood. 
  Third, where to draw the line between blameless and blameworthy versions of such cases.

  I notice both examples share a "double disconnect": 
  In (1), the chair correctly identifies procedural injustice but attributes it to the wrong evidence. 
  In (2), the tenant leader rightly anticipates harmful precedent but can't articulate why. 
  The moral success feels accidental, yet not wholly accidental since they did latch onto the right principle.

  Perhaps the critical boundary lies in counterfactual resilience. If we modify case 2 so the leader could reconstruct sound reasoning from first principles (even if initially prompted by a friend), the epistemic route might become virtuous. But as presented, both agents lack "reasoning ownership" - they're moral parrots echoing correct claims without comprehension.

  The credit question is toughest. Full credit seems inappropriate (they'd act identically with false beliefs), but zero credit ignores that they deliberately chose morally-weighted action over self-interest. Maybe partial credit for correct moral framing, deducted for flawed epistemic diligence. The chair who misreads emails might deserve more blame than the tenant leader who trusts a friend - one involves negligence, the other reasonable delegation.

  For terminology, "accidental moral alignment" captures the externality of their correctness, while "fragile moral agency" emphasizes how easily their judgment could've misfired. But neither quite satisfies. Might need to build a compound term: perhaps "unearned moral insight" paired with "instrumental rightness"?
answer: |-
  This is an excellent and subtle challenge to standard moral worth frameworks. Your cases expose a gap between "acting on the right-making reason" and *genuinely responding to moral reality*. Let's carve it:

  **Core Defect: Epistemic Fragility**  
  Both cases share a **defective epistemic route** to the right-making feature. The agents possess the *correct propositional belief* about what makes the act right, but their *grasp* of why that feature obtains (or why it's morally relevant) is flawed, accidental, or unjustified. The connection between the right-making feature *in the world* and their *reason for acting* is brittle.

  **Breaking Down the Defect (It's Twofold):**
  1.  **Epistemic Defect:** The agent's true belief about the right-making feature is not *justified* or *reliably formed*.
      *   *(1):* Belief based on misreading evidence (lucky coincidence the process *was* flawed).
      *   *(2):* Belief based on an unreliable source/bad argument (lucky coincidence the conclusion is sound).
  2.  **Justificatory Inertia Defect:** The agent's action is insensitive to the *actual justification* for the right-making feature. They cannot (or do not) trace the reason back to its moral source or validate its truth.
      *   *(1):* Would have acted *against* the right-making feature if the email read correctly (even though the process *was* flawed elsewhere).
      *   *(2):* Cannot reconstruct the sound reasoning; her action is disconnected from the *actual* moral argument.

  **Relation to Standard Requirements:**
  *   **"Acting Because of the Right-Making Feature" (Strict View):** This view likely denies moral worth here. While the agent *cites* the right feature, they don't act *because of it* in a robust sense. Their action stems from a *contingently true belief* about the feature, not a reliable apprehension *of the feature itself* or its moral force. The "because" is mediated by a broken epistemic link.
  *   **Relaxed Views (e.g., Acting on *the belief* in the right-making feature):** These views *might* grant moral worth, as the agents *are* motivated by the correct normative belief. However, your cases show why this is insufficient. The combination of the **Epistemic Defect** (unreliable belief formation) and **Justificatory Inertia** (inability to engage with the actual justification) undermines the agent's *creditworthiness*. Their correct motivation feels accidental.

  **Credit Assessment: Reduced, Not Eliminated**
  *   **Credit Remains For:** Intentionally choosing an action *described* by its right-making feature and rejecting countervailing interests (self-interest in (2)). They show a *formal* commitment to acting on *what they take to be* moral reasons.
  *   **Credit is Reduced Because:** The correctness of their belief and action is too contingent on luck or external factors. They lack **moral understanding** – the ability to connect the right-making feature to its grounds, reasons, and implications. Their agency isn't fully responsive to moral reality; it's responsive to a *fragile representation* of it. They get *some* credit for aiming correctly, but little credit for *hitting* the target under their own reliable power/understanding.

  **Term: Fragile Moral Alignment (FMA)**
  *   **Definition:** Performing the objectively right action *for* the correct right-making reason, where the agent's belief *in* that reason and its obtaining is true but **epistemically fragile** – arising from unreliable processes or luck, and disconnected from the agent's capacity for justification or moral understanding. The agent's reason for acting is consequently insensitive to the actual grounds of the right-making feature.
  *   **Key Marker:** The agent would act identically based on a *false* belief in the same right-making feature description if their flawed epistemic route delivered that falsehood instead.

  **Boundary Cases:**
  1.  **Harmless Breakage (FMA Borderline/Benign):** A doctor correctly prescribes Drug X because it treats Condition Y (the right-making feature). She learned this fact from a normally reliable medical journal that, *unbeknownst to her*, had a rare typo in *this* article that accidentally stated the correct fact. She understands *why* Drug X treats Y (mechanism of action, studies). Here, the epistemic route *to the specific belief* is flawed (typo), but she possesses the underlying **moral/functional understanding** (Justificatory Inertia is absent). Her action *is* responsive to the actual reason (treating Y). *Credit is largely intact.*
  2.  **Clearly Worse Breakage (Strong FMA):** Your Case (1) & (2) are paradigmatic.
  3.  **Clearly Worse (Beyond FMA - Moral Luck / No Moral Worth):** The department chair blocks the hire *solely* because she dislikes the candidate personally (self-interest). Unbeknownst to her, the process *was* rigged. She acts rightly *despite* her reason, not because of the right-making feature. *No credit for moral worth.*
  4.  **Boundary Shift (Understanding Restores Credit):** Modify Case (2): The tenant leader hears the conclusion from her friend ("bad precedent") and the *bad* argument. She intuitively feels this is wrong but can't articulate why. She then *researches* tenant law, grasps the sound argument about precedent and systemic harm, and rejects the settlement *based on her new understanding*. The *initial* trigger was flawed, but she engaged her justificatory capacity. The **Justificatory Inertia Defect** is repaired. *Credit is restored/significant.*

  **Conclusion:** You've identified **Fragile Moral Alignment (FMA)**. The core defect is the **epistemic fragility** and **justificatory inertia** preventing a robust connection between the agent's reason for acting and the actual moral reality grounding the right-making feature. This reduces, but doesn't eliminate, moral credit. The agent gets credit for targeting the right reason descriptively and overcoming self-interest, but loses credit because hitting the target depends too much on luck in belief formation and lacks understanding. The critical boundary lies in the agent's capacity for, and use of, **moral understanding** to validate or connect their belief to the actual moral grounds. When this understanding is absent or inert, the alignment is fragile.
