  ## Kierkegaard on "Chorus": A Séance from the Crypt of the Present Age  
  *(As Induced for *Politiken*, Copenhagen, This Very Day)*  

  The spirit of the age manifests not in grand pronouncements, but in the petty tyrannies of its tools. Behold "Chorus"! This buzzing apparatus, this loom of collective vanity, presents itself as the very agora of modernity. Yet it is nothing but the perfected machinery for that spiritual sickness I diagnosed long ago: the evaporation of the *responsible individual* into the miasma of the *public*. You christen it "Chorus"? A fitting name, for it is the sound of many voices bleating in unison, a harmony achieved not through shared purpose, but through the erasure of distinct timbre. Its three rules are not innovations; they are the codification of despair.

  **Rule One: The Shroud of Namelessness.** "Nothing is published under a name." Merged, blended, issued as "we" – this is levelling raised to a religious principle! The individual is dissolved before he speaks. Responsibility evaporates. What is uttered floats free, unattached, belonging to *no one* – precisely the condition of "the public," that phantom which speaks boldly only because it exists nowhere. It is the resurrection of *The Corsair*'s malice, mechanized and scaled to encompass an entire populace. Where is the sting of the single voice, the courage to stand *here*, *now*, *as this one*, and be accountable? It is smothered in the algorithm's embrace. The "anonymous mark" you may affix afterwards? A mockery! It is not a signature, but a brand of the herd, signifying only membership in the faceless.

  **Rule Two: The Plural as Prison.** "Your own public feed is written in the same plural and addresses you as we." Monstrous! The self is not merely dissolved *outwardly*; it is colonized *inwardly*. You are forced to address *yourself* as "we." This is not communication; it is a forced confession of non-existence. The singular "you" is banished from the public square. Who, then, speaks? Not you! A construct speaks *through* you, addressing another construct. The inwardness, the passion, the *subjectivity* that is the very ground of authentic existence – it is systematically starved. How can one become a Self when the very language of the platform denies its possibility? This "we" is the voice of the crowd, whispering not just in your ear, but *as your own tongue*. It is spiritual lobotomy.

  **Rule Three: The Single Reader – A Devil's Parody.** Ah, but here the architects of Chorus reveal their cunning, their diabolical understanding of the age’s deepest hunger, even as they poison its wellspring. "Once a day you may send a single message, in the singular, to whichever user the service calculates has read everything you have written." They dangle before you the mirage of the *Single Individual*! They know the soul yearns for this – for recognition, for encounter, for the burden and joy of addressing *one*. But see the perversion!

  This "Single Reader" is *assigned* by calculation. A machine! It determines your deepest listener through metrics, not through the silent, passionate choice born of inwardness and spirit. It is not *chosen* in fear and trembling, but *delivered* by algorithm. This is not the profound, terrifying relation of one existing individual to another; it is a transaction brokered by the very system that annihilates the individual elsewhere. It is the *public* offering you a consolation prize: a simulated intimacy, a private whisper within the roaring void it creates. The "Single Reader" is not the solution to the platform’s sickness; it is its most insidious symptom. It makes the user complicit in his own dissolution, offering a fleeting, sanctioned moment of "singularity" within a structure designed to obliterate it. It is the relation *parodied* – intimacy rendered as a daily ration, dispensed by the levelling machine itself. The pseudonyms I employed, the indirect communication I laboured over – these were tools to *awaken* the single individual in the reader, to confront them with their own subjectivity *through* the artifice. The Single Reader *pacifies* the user with the *illusion* of being heard, precisely so they remain comfortably dissolved in the public "we" the rest of the time. It is the anesthetic administered before the continued operation of spiritual flattening. It does not deepen responsibility; it absolves it by making the most profound hunger subject to automation.

  **The Verdict:** Chorus is not an occasion for the single individual. It is its factory-sealed tomb. It is the *Present Age*’s abstraction made flesh in code – the irresponsible public, the chattering, anonymous crowd, elevated to the status of a divine principle. It offers not communication, but communion in non-existence. Its "Single Reader" is no refuge; it is the deepest betrayal, a mechanized counterfeit of the very relation that could offer salvation, serving only to bind the user more tightly to the levelling machine. It is the sickness, posing as its cure. Flee it! Or rather, become *one* who flees it, alone before the Eternal, responsible for your own voice, or be dissolved utterly.

  ---

  **Note for the Novelist:**

  My largest liberty lies in the degree of *potential sympathy* I allowed Kierkegaard to momentarily entertain regarding the *structure* of the Single Reader before utterly condemning its *mechanism and context*. While I believe he would instantly grasp the perversion inherent in an algorithm assigning one's "deepest listener," I suspect the *real* Kierkegaard might have been even more violently dismissive from the outset. He might not have paused to acknowledge the *structural echo* of the single individual concept at all, seeing only the diabolical parody instantly and exclusively. The concession that the architects "reveal their cunning... understanding of the age’s deepest hunger" risks implying a sliver of *shared ground* in the *recognition* of the need, however perverted the solution. The historical Kierkegaard, especially post-*Corsair*, might have denied even this shared diagnostic ground to the platform's creators, seeing only pure, malicious levelling intent, devoid of any insight, however twisted. His own conduct during the press quarrel shows a man capable of perceiving malice as absolute, leaving little room for acknowledging the opponent's (even accidental) grasp of the existential problem they were exploiting. You risk softening his absolute, almost apocalyptic, condemnation of the *principle* of such a platform by allowing that brief moment where the Single Reader's *form* is acknowledged as touching upon a genuine need before being revealed as poison. He might have thrown back at me that *any* system built on anonymity and the collective "we" is so fundamentally corrupt from its foundations that *no* feature within it, however seemingly redemptive, can be viewed as anything but further evidence of its damnable nature – the structural echo itself being part of the deception. The deepest distortion might be in making him *analyze* the feature's potential appeal; he might simply have *denounced* it as hellish artifice, full stop.
