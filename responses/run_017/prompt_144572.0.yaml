prompt: |-
  I'm finishing a dissertation chapter on the doing/allowing distinction, and I'm doing some consulting on the side for two bodies that keep forcing the same worry on me: a hospital ethics committee rewriting its guidance on withholding and withdrawing life-sustaining treatment, and an incident-review board at a company that fields semi-automated decision systems, where the human contribution to a bad outcome is almost always something like a default setting left in place, an alert acknowledged and then dropped, or a handover that never happened. Both groups need a verdict on a concrete case, reached by people who are not philosophers, which makes me think that whatever the distinction is, an account of it has to be operationally usable and not merely extensionally correct.

  So before I write the framing section, I want the specification. Give me the desiderata any adequate account of the doing/allowing distinction has to meet — including an adequate account of why it carries no independent moral weight — with the case or consideration behind each requirement, and tell me which you take to be non-negotiable and which are just preferences of a particular camp. Here is the raw material I want either on the list or argued off it. First, the case battery: the pairs where an agent redirects a threat onto one instead of five versus kills one to supply what five need; the relative who declines to summon help; the clinician who discontinues support that is doing the work of an organ that will not recover; the agent who earlier created the threat and later merely declines to remove it; the double-prevention cases where the only difference is whether the agent intervenes on a mechanism someone else set going; the composite cases where each of many people contributes a tiny permissive act or a small failure and the aggregate does the damage; the matched pairs that differ only in whether something is withheld or withdrawn, or only in how long a delay lets a pre-existing condition run its course; and the pairs where the same bodily behavior — a hand kept in a pocket, a signature withheld, a person walking away — counts as doing under one description and allowing under another, so the account has to say what fixes the baseline and how much of the baseline is allowed to be moralized. Second, the distinctions it must respect rather than collapse: doing versus enabling versus failing to prevent; intending versus merely foreseeing; the difference between the distinction's having pro tanto weight and its being decisive; and the difference between its tracking a moral difference and its merely summarizing verdicts we reach some other way. Third, the constraints it must not contradict: that there is no general legal or moral duty to rescue while there are duties in some relationships and roles, and that the action/omission asymmetry shows up robustly in ordinary judgment and in things like reluctance to vaccinate, in ways that look partly independent of the stakes. Fourth, operationalization: the account has to tell a review board which facts about a case are load-bearing, so that a disagreement can be traced to a specifiable factual or theoretical disagreement rather than left as brute intuition, and so that a verdict is reachable from a written case description in an afternoon.

  The part I most want your view on is the tension I keep bumping into, because I suspect some subset of these requirements cannot all be satisfied at once. An account that fits the full battery of cases seems to need a baseline that is partly moralized — who was supposed to do what, what countenances as the normal course — but the more moralized the baseline, the less the distinction can do any grounding work downstream, since saying that letting die is permissible may then amount to little more than saying that no duty to aid was violated; and the operationalization requirement may push hard in the same direction, toward something that just hands the board a checklist of duties rather than a genuine distinction. Tell me whether that tension is real, whether it is a defect of the desiderata or a result about the distinction, and which single requirement on your list does the most work in excluding live candidates. Then, briefly — a paragraph, not a table — score the main families against the list: counterfactual or causal-process accounts, intention- or means-based accounts in the vicinity of the doctrine of double effect, constraint- or rights-based accounts built on something like not making someone worse off, and the skeptical view that the asymmetry is an illusion we should discard.
reasoning: |-
  Hmm, the user is grappling with the doing/allowing distinction in applied ethics contexts - specifically for a hospital ethics committee and an incident-review board. They need desiderata for an adequate account that must handle complex cases while being operationally usable by non-philosophers.

  Looking at their requirements: They've provided a comprehensive set of cases that any theory must address - from trolley problems to medical discontinuation scenarios. The account must respect key philosophical distinctions like doing vs enabling, and cannot contradict established constraints like the lack of general rescue duties. Crucially, it needs operational utility for real-world decision-making.

  The core tension they identify is real: Moralized baselines (relying on duties/expectations) make the distinction operationally usable but risk circularity - "allowing" just becomes "no duty violated." Yet non-moralized baselines (like purely physical ones) struggle with cases like walking away from drowning victims where context determines moral status.

  The most exclusionary requirement is operationalization. It eliminates theories that: 1) Rely on vague intuitions (skeptical views) 2) Require metaphysical judgments about causality (process theories) 3) Depend on contested intention assessments (double effect) 4) Fail to specify load-bearing facts (many accounts).

  Scoring the main families:
  - Causal-process accounts handle cases well but fail operationalization (metaphysical judgments required)
  - Double effect focuses wrongly on intentions rather than the doing/allowing distinction itself
  - Rights-based accounts come closest operationally by using duty-violation checklists, but collapse the distinction into duty analysis
  - Skeptical views reject the distinction entirely but contradict robust psychological and legal phenomena

  The rights-based/duty-focused approach seems most viable for their committees despite theoretical compromises, as it offers clear decision procedures: Identify pre-existing threats, establish duties, check for worsening positions. It trades philosophical purity for usability - which serves their practical needs best.
answer: |-
  Here are the desiderata for an adequate account of the doing/allowing distinction, categorized by their source and negotiability, followed by analysis of the core tension and family scoring. The non-negotiables are those rooted in **phenomenological robustness**, **conceptual necessity**, or **practical non-collapsibility**.

  ---

  ### **Desiderata & Their Rationale**  
  *(Non-negotiables in **bold**)*  

  1. **Accommodates Core Case Battery**  
     - **Non-negotiable**: Must resolve paradigmatic pairs (e.g., trolley redirect vs. organ harvesting; discontinuing futile treatment vs. active killing; withholding vs. withdrawing identical support).  
     - *Rationale*: The distinction is empirically salient in moral intuitions; failure here implies the account doesn’t track the phenomenon.  

  2. **Respects Conceptual Boundaries**  
     - **Non-negotiable**: Distinguishes **doing/enabling/failing to prevent**; acknowledges **pro tanto weight ≠ decisive**; avoids conflating with **intention/foresight**.  
     - *Rationale*: Collapsing these obscures unique moral dynamics (e.g., enabling harm may be less culpable than doing but more than allowing).  

  3. **Compatible with Legal/Moral Constraints**  
     - **Non-negotiable**: Coheres with **no general duty to rescue** + **role-specific duties**; explains **asymmetry in ordinary judgment** (e.g., vaccine hesitancy ≠ refusing murder).  
     - *Rationale*: Contradicting settled norms (e.g., legally permitting withdrawal of life support) renders the account practically irrelevant.  

  4. **Operationalizability**  
     - **Non-negotiable**: Identifies **load-bearing facts** for non-philosophers; enables **traceable disagreements** (e.g., "Was there a pre-existing threat?" vs. "Was a duty breached?").  
     - *Rationale*: Required for institutional use (e.g., ethics committees attributing responsibility post-incident).  

  5. **Minimally Moralized Baseline**  
     - *Negotiable preference*: Baseline (e.g., "normal course") should reference **descriptive expectations** (e.g., physiological processes, default system settings) not *only* moral duties.  
     - *Rationale*: Reduces circularity; allows the distinction to ground duties (e.g., "Why is withdrawing treatment allowing?" → "It stops interfering with fatal pathology").  
     - *Case driver*: Walking away from a drowning stranger (allowing if threat pre-existed; doing if you pushed them in).  

  6. **Independence from Aggregate Effects**  
     - *Negotiable preference*: Explains **composite cases** (e.g., 100 engineers each skip a minor safety check) without making permissibility hinge *solely* on outcome scale.  
     - *Rationale*: Avoids conflating doing/allowing with threshold deontology/consequentialism.  

  ---

  ### **The Tension: Moralized Baselines & Grounding**  
  The tension is **real and substantive**, arising from the distinction’s *dual role*:  
  - **For grounding**: To explain *why* allowing is often less wrong, the baseline must be non-moral (e.g., "no causal initiation"). But non-moral baselines (e.g., counterfactual or physical-process accounts) falter in cases like **walking away** (which intuitively shifts from allowing to doing if you promised to help) or **system defaults** (where "normal course" is institutionally defined).  
  - **For operational use**: Duty-focused checklists ("Was there a duty? Was it breached?") are clear for committees but **collapse the distinction** into general duty theory.  
  **This is a defect of desiderata only if independence is demanded**. In reality, the distinction *is* partly constitutive of duties (e.g., "duties not to kill" ≠ "duties to save"), so some moralization is inevitable. The **operationalization requirement** does the most to exclude accounts (e.g., fine-grained causal process theories) by demanding *accessible* load-bearing facts.  

  ---

  ### **Family Scoring (Key Weaknesses)**  
  - **Causal-Process Accounts** (e.g., Phil Dowe):  
    - ✅ Handles trolley cases, pre-existing threats.  
    - ❌ **Fails operationalization**: Metaphysical judgments about "process initiation" are intractable for committees. Struggles with **composites** (is skipping a check "initiating" failure?).  
  - **Intention/Means-Based** (e.g., DDE):  
    - ✅ Clarifies withdrawal vs. killing; respects intention/foresight.  
    - ❌ **Collapses boundaries**: Conflates doing/allowing with means/side-effects (e.g., redirecting a trolley is "doing" but permissible). Useless for **default settings/omissions**.  
  - **Constraint/Rights-Based** (e.g., "no worsening"):  
    - ✅ Best for **operationalization**: "Did the act make someone worse off?" is checkable (e.g., discontinuing treatment reverts to baseline pathology).  
    - ❌ **Moralizes baseline excessively**: "Worsening" often presumes entitlements (e.g., is not donating a kidney "worsening" a patient’s state?). Struggles with **double-prevention** (e.g., failing to disarm a bomb you didn’t plant).  
  - **Skeptical Views** (e.g., no independent weight):  
    - ✅ Parsimonious; handles **composites** via aggregate harm.  
    - ❌ **Fails core cases**: Contradicts intuitions (e.g., vaccine refusal ≠ murder) and **legal constraints**. Ignores why we resent harm-doers more than non-rescuers.  

  ---

  ### **Conclusion**  
  The **rights-based "no worsening" account** best balances operational needs with case coverage, despite moralized baselines. For your committees, emphasize:  
  1. **Pre-existing threats**: Did the agent create a *new* threat or leave an existing one unaddressed?  
  2. **Role duties**: Did the agent have a specific obligation to alter the status quo?  
  3. **Baseline shift**: Did the act move the victim *away* from their prior state (e.g., disconnecting a ventilator vs. never attaching it)?  
  This makes verdicts tractable (e.g., "The engineer’s inaction left a default setting that *sustained* a threat; no duty was breached per company policy → allowing") while acknowledging the distinction’s pro tanto weight arises from normative commitments about causation and duties. The tension is inherent but manageable if framed as a heuristic for duty violations rather than a freestanding moral primitive.
