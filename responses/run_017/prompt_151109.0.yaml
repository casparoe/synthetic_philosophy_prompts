  ### Poem: Three Stances at the Water Glass  

  **PHYSICAL STANCE**  
  (Clunky, over-long lines)  
  Photons bounce from the tumbler’s curve, refracted through air, striking her retina’s rods and cones,  
  triggering electrochemical cascades down axons, synapses firing in the motor cortex,  
  activating deltoid, bicep, flexor muscles—joints pivot, tendons contract, fingers extend—  
  till keratin meets silica: a hand closes around the vessel’s smooth, cylindrical form.  

  **DESIGN STANCE**  
  (Shorter, functional lines)  
  The body, shaped by evolution’s pressures,  
  senses hydration deficit,  
  triggers thirst-response protocols:  
  arm extends, grip secures the glass.  

  **INTENTIONAL STANCE**  
  (Shortest, predictive lines)  
  She’s thirsty—  
  wants water—  
  reaches.  

  **TURN**  
  Truth compresses: her thirst isn’t a ghost  
  in the machine, just the map  
  that spares the mapmaker.  

  ---

  ### Handout: Dennett’s Stances & Real Patterns  
  *(For Seminar Wrap-up)*  

  **1. The Three Stances (Poem Breakdown):**  
  - **Physical Stance (Lines 1–4):**  
    Describes the event (reaching for water) in fundamental physical terms: light, neurons, muscles. *Line lengths are longest*—mimicking maximal detail (like a "bit map" of reality). Costly to compute or predict.  
  - **Design Stance (Lines 5–8):**  
    Explains the event via functional design (evolution, biological systems). *Lines shorten*—compression begins by skipping physics for teleology. Cheaper prediction if you know the system’s purpose.  
  - **Intentional Stance (Lines 9–11):**  
    Attributes beliefs/desires ("She’s thirsty—wants water—"). *Shortest lines*—maximal compression. Predicts behavior efficiently without detailing mechanisms.  

  **2. Real Patterns & Compression (Dennett’s Criterion):**  
  - A pattern is "real" if a description of the data compresses it (i.e., is "cheaper" than listing every physical detail).  
    - *Example:* Saying "She’s thirsty" (intentional stance) compresses terabytes of neural data into 3 words.  
  - **The Turn (Lines 12–14):**  
    The intentional stance isn’t a "lazy placeholder" or illusion—it’s *truer* pragmatically because it optimizes prediction cost. Yet it’s "not made of extra stuff" (no dualism) and "not merely in the eye" (it tracks real-world regularities). Compression is relative to the predictor’s constraints (time, resources).  

  **3. Why Line Lengths Matter:**  
  The poem’s shrinking form embodies compression: climbing stances reduces descriptive "cost" while increasing predictive power. The real pattern ("thirst") emerges not as an ontological addition but as a cognitive tool for limited beings.  

  **Discussion Prompt:** *Does compression make the intentional stance more "real" than the physical—or just more useful?*  

  ---  
  *Poem & handout designed for clarity and debate. The glass-reach event grounds abstraction in the ordinary, while line lengths perform the philosophy visually.*
