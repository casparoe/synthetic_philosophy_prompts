     - The Bayesian account requires that we condition on the sampling frame. The same evidence (a non-black non-raven) can have a different evidential impact depending on how it was sampled (from the whole depot or from the aviary). Thus, confirmation is relative to the sampling frame. This is a substantive revision because it makes confirmation context-dependent. However, it can be seen as a natural extension of the idea that evidence must be modeled with the entire data-generating process. 
