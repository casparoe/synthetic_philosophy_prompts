  **A. Independent force of confirmation by instances?**
     - The traditional view is that observing a black raven confirms "all ravens are black" (H) and, via contraposition, observing a non-black non-raven also confirms H. The paradox is that the latter seems too weak or irrelevant. The Bayesian account shows that the non-black non-raven does confirm H, but very weakly (only 1.02 in the depot case) because the non-black non-ravens are common. In the aviary, which is enriched for birds and non-black objects, the same kind of observation gives a stronger confirmation (1.6). The magnitude story (i.e., the base rates and the sampling frame) explains the variation. 
     - However, one might argue that there is an independent intuition that an instance of the generalization (a black raven) is directly confirming, while an instance of the contrapositive (a non-black non-raven) is not, and that this intuition is not fully captured by the magnitude. But the Bayesian account shows that the non-black non-raven does confirm, just weakly. Moreover, the variation with the sampling frame shows that the intuition about irrelevance might stem from the fact that in typical contexts non-black non-ravens are very common and thus uninformative. 
     - I assign a high probability (0.8) that the magnitude story fully explains the force of confirmation by instances. The residual intuition might be due to not considering the base rates.

  **B. Role of contraposition?**
     - The equivalence of H and its contrapositive is crucial in the traditional paradox. However, in the Bayesian treatment, we don't need to invoke contraposition. We can directly compute the likelihood ratio for H by considering the possibility of falsifiers (non-black ravens). In the finite model, we are counting the ways the evidence could occur under H and under ~H. For the green tennis ball, we are drawing a non-black non-raven. Under H, there are 9,000 such objects (since no non-black ravens). Under ~H, there are 9,000 minus m (because if H is false, we expect m non-black ravens, so the non-black non-ravens are reduced by m). Similarly for the other observations. 
