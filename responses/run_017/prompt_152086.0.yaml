prompt: |-
  Hi — I'm the deputy director of a tiny county emergency management agency in a river valley: about eleven miles of levee, an upstream dam owned by a power company that is not great at returning calls, a trailer park and an industrial park on the floodplain, roughly nine thousand people total. Eight to twelve times a year I'm the duty officer on a call where, inside thirty or forty minutes, with a laptop, three browser tabs and one phone call, I have to decide what to recommend to the county judge. She signs the order, and whatever I write on the one-page rationale later gets read by the sheriff's office, the state auditor, an insurance adjuster, and occasionally a reporter. The sentence I keep having to write is some version of we know the water will not overtop the levee at the Maple Street gauge, or we know it will, and the difference between those two sentences is sometimes an evacuation of four hundred people at night.

  I got into an argument with a hydrologist friend about this last spring — we had a near miss with the pump station at Maple Street, and ever since, that particular failure mode is the only one anyone in the room can think about, so the same forecast reads completely differently to us than it did a year earlier. She told me to go read up on two things, and I did, sort of: the view that whether someone counts as knowing depends on what is at stake for them (I think it's called pragmatic encroachment, and there's some version where the bar for knowledge goes up when the decision is high-stakes), and the view that the standards a knowledge claim has to meet shift with which error possibilities are live in the conversation (contextualism?). Both seem to say the bar moves, but for different reasons and maybe in different directions, and I need one protocol, not two. So: write me a decision procedure my duty officers and I can actually run in the time we have, built out of those ideas, that starts from a forecast plus a map and ends with one of three outputs — assert knowledge, refuse to assert knowledge and act on the precautionary branch anyway, or stop and hand the call to a person as a values question. For each step say what would count as a sufficient answer, where the procedure just terminates in a no, and where a human has to decide because it's not a factual question anymore.

  Three things I specifically need it to handle, because they are where I keep tying myself in knots. First, whose stakes? If the bar tracks stakes, it seems like it should track the stakes of the people in the trailer park, not mine — but I'm the one making the call, and my stakes are different and point the other way: I get blamed for a costly false alarm and for crying wolf, and that pushes me toward evacuating more than the residents' own interests do. Second, sometimes the stakes cut both ways at once: raising the bar means waiting twelve hours for a better forecast, and waiting eats the lead time the evacuation needs, so being more careful makes the outcome worse if I'm wrong — I need the procedure to say what to do when the standard the stakes demand is literally unreachable inside the window. Third, whatever I write travels: my we know gets read weeks later by an auditor or an adjuster who has no idea what was at stake that night or which failure modes we'd been worried about, so I think the protocol needs a step that records which error possibilities were excluded, or something equivalent. Please include a short section on what the procedure cannot do, and please work it through on three cases: (a) overnight, 60 percent chance of overtopping at Maple Street, four hundred homes, a lot of elderly residents, six hours of lead time; (b) one identical forecast covering two zones at once, the trailer park and a warehouse district where the only thing at risk is empty buildings and a parking lot — if the procedure tells me I know the water won't reach the warehouses but not that it won't reach the trailers, on the very same evidence, say so plainly, because that's the answer I'm going to hate and I'd rather see it worked out than avoided; and (c) a slow-onset one, three days out, where a better model run lands in twelve hours but evacuation needs thirty. Assume the person running this has no philosophy training and is tired; no citations needed, and please don't just tell me to be more careful.
reasoning: |-
  Okay, the user is a deputy director of a small county emergency management agency. They deal with flood risks involving levees, a dam, and vulnerable areas like a trailer park. Their main challenge is making rapid decisions about evacuations based on flood forecasts, where the stakes are incredibly high—people's lives versus false alarms. They need a practical decision protocol rooted in philosophical concepts like pragmatic encroachment and contextualism, but simplified for real-world use during emergencies.

  The user mentioned three specific pain points: whose stakes to consider, conflicting stakes when carefulness consumes lead time, and the need for documentation that holds up later with auditors. They also provided three scenarios to test the protocol. 

  First, I need to break down those philosophical ideas into actionable steps. Pragmatic encroachment means the required level of certainty goes up when the cost of being wrong is higher. Contextualism suggests that what counts as "knowledge" depends on which risks are top of mind in that moment. 

  For the protocol, I'm thinking of a flowchart-style approach with clear thresholds. It should start by assessing the harm of two errors: failing to evacuate if flooding happens (Type I error) versus evacuating unnecessarily (Type II error). The user’s point about differing stakes is critical—the trailer park residents’ risks (death, injury) vs. the agency’s risks (reputation, resources). The protocol must prioritize the subject’s stakes, not the decision-maker’s, because that’s ethically necessary and what auditors would expect. 

  For the time conflict issue, the protocol needs a "no-win" output: if gathering more data eats into lead time, it forces a judgment call on which error is worse. That’s where the "values question" flag comes in. 

  Documentation is key. The rationale must capture which risks were considered "live" and why stakes were weighted a certain way. Not for philosophy’s sake, but so auditors see the reasoning was sound under pressure. 

  Testing against the three scenarios: 
  - In scenario A (60% chance, elderly residents), harm of not evacuating is extreme, so the certainty bar is sky-high. With only 60% forecast confidence, you can’t claim "know no overtop," so you default to precautionary evacuation. 
  - Scenario B (same forecast, different zones) exposes how stakes change the bar: warehouses have low stakes (property damage only), so 60% might suffice for "know no flood," while trailers need near-certainty. The user hates this, but it’s logically consistent. 
  - Scenario C (slow-onset, conflicting timelines) shows the time trap: waiting for better data kills lead time. Here, the protocol forces a values call—e.g., is gambling on a better forecast worth risking lives? The director must own that. 

  The limitations section is crucial. This protocol doesn’t eliminate uncertainty or make moral choices; it just structures the chaos. And it only works if users trust the harm calibration—if they second-guess the stakes assessment, everything crumbles. 

  The tone must stay practical: no jargon, no "be more careful." Focus on speed (under 10 mins), clarity (3 outputs), and defensible documentation. The user’s exhausted; they need a tool, not a thesis.
answer: |-
  Here's a decision protocol ("BAR Protocol") based on your needs, integrating pragmatic encroachment (stakes raise the bar for "knowing") and contextualism (what counts as "knowing" depends on relevant error possibilities). It's designed for speed, clarity, and auditability.

  **The BAR Protocol: Three Outputs**
  1.  **ASSERT KNOWLEDGE:** "We know [X] will/won't happen." (Confidence exceeds the required bar; act accordingly).
  2.  **PRECAUTION:** "We cannot assert knowledge that [bad thing] WON'T happen; recommend precautionary action." (Confidence < required bar; default to safety).
  3.  **VALUES CALL:** "Insufficient time/clarity; decision requires value judgment on trade-offs." (Hand off to County Judge with clear options/risks).

  **Steps (Run Sequentially - Target Time: <10 mins):**

  1.  **Define the Critical Claim (X) & Bad Outcome (Y):**
      *   *Sufficient Answer:* "We need to know if the water will overtop at Maple Street Gauge (X) to prevent life-threatening flooding in the trailer park (Y)."
      *   *Terminate in No:* Can't define X or Y concretely. (Likely rare).
      *   *Human Needed?* No. (Focuses the inquiry).

  2.  **Calibrate the BAR (Based on Stakes of SUBJECTS at Risk):**
      *   *Ask:* "If we are WRONG about X, what is the worst realistic harm (H) to the PEOPLE/PROPERTY directly threatened by Y?" Consider: Loss of life, serious injury, major irreversible property loss (homes), major economic disruption. *Ignore institutional stakes (blame, cost) for setting the bar.*
      *   *Sufficient Answer:*
          *   **BAR = HIGH:** If H involves high probability of death/serious injury (e.g., trailer park flood). Requires near certainty (>95% confidence equivalent).
          *   **BAR = MEDIUM:** If H involves major property loss or economic damage without likely loss of life (e.g., industrial park flood of occupied warehouses). Requires high confidence (>80% confidence equivalent).
          *   **BAR = LOW:** If H involves minor property damage or disruption (e.g., flooding empty parking lot). Requires moderate confidence (>65% confidence equivalent).
      *   *Terminate in Precaution:* If H involves potential loss of life/serious injury (BAR=HIGH), and you cannot immediately quantify confidence. (Default to safety when life is plausibly at stake).
      *   *Human Needed?* Only if the *nature* of H is deeply contested (rare in emergencies). *Key Principle: The bar is set by the stakes of those who would suffer the bad outcome (Y), not the decision-maker.*

  3.  **Assess Confidence (C) in Claim (X):**
      *   *Ask:* "Given the current forecast, data, and live error possibilities (pump failure? model bias? dam release?), what confidence level (C) do we assign to X being true *right now*?" Use simple scale: Low (<60%), Medium (60-80%), High (>80%), Very High (>95%). Base this on experience, model output, known uncertainties.
      *   *Sufficient Answer:* Assign Low/Med/High/V.High based on best available data and consideration of salient risks ("live error possibilities").
      *   *Terminate in Precaution:* If confidence is "Low" or BAR=HIGH and confidence is only "Medium".
      *   *Human Needed?* No. (Professional judgment applied).

  4.  **Check Time Trap:**
      *   *Ask:* "Could we significantly increase C by waiting for better data/analysis *within the available lead time for effective action*?" If YES: "Does waiting reduce the effectiveness of the precautionary action (evacuation) more than the potential gain in C?"
      *   *Sufficient Answer:*
          *   "Waiting possible & improves C without hurting action? -> Re-assess C later if time permits."
          *   "Waiting would use critical lead time, making precaution worse? -> Move to Step 5 NOW."
          *   "No better data possible in time? -> Move to Step 5 NOW."
      *   *Terminate in Values Call:* If waiting *could* increase C *but* uses critical lead time, making precautionary action less effective or impossible. (This is the core conflict).
      *   *Human Needed?* Only if waiting is possible but harms action effectiveness.

  5.  **Compare C to BAR & Output Decision:**
      *   *Apply:*
          *   If **C >= BAR** -> **ASSERT KNOWLEDGE** (e.g., "We know it WILL overtop" if C/BAR high; "We know it WON'T" if C/BAR low/med).
          *   If **C < BAR** -> **PRECAUTION** (Recommend acting as if the bad outcome *might* happen).
          *   *Exception Trigger:* If Step 4 resulted in a "Values Call" flag -> **VALUES CALL**.
      *   *Sufficient Answer:* Clear output (1, 2, or 3).
      *   *Terminate in Precaution:* C < BAR.
      *   *Human Needed?* Only for "VALUES CALL" output.

  **Documentation Step (VITAL):**
  *   On the rationale page, **always** record:
      1.  **Claim (X) & Bad Outcome (Y):** (Step 1)
      2.  **BAR Level & WHY:** (Step 2 - e.g., "BAR=HIGH due to risk to life in Trailer Park")
      3.  **Confidence (C) & Key Live Error Possibilities Considered:** (Step 3 - e.g., "C=Medium (60%). Live Errors: Pump station failure potential based on near-miss 4/2024, model uncertainty for this rainfall type.")
      4.  **Time Check:** (Step 4 - e.g., "No time for better data"; "Waiting for model run would consume 12hrs of 6hr lead time - not feasible.")
      5.  **Output & Reason:** (Step 5 - e.g., "PRECAUTION: C(Med) < BAR(High) for life safety.")

  **What the BAR Protocol CANNOT Do:**
  1.  **Eliminate Uncertainty:** It structures decisions *under* uncertainty, it doesn't create certainty.
  2.  **Make Value Judgments for You:** It flags ("VALUES CALL") but doesn't resolve deep trade-offs between competing harms or resource allocation when time is the enemy. The County Judge owns this.
  3.  **Override Bad Data:** Garbage in, garbage out. It relies on your best available assessment.
  4.  **Account for Unforeseen Errors:** It documents *considered* live errors, not unknown unknowns.
  5.  **Solve Political Pressure:** It provides a defensible *reasoning* structure, but won't stop blame games.

  **Applying the Protocol to Your Cases:**

  *   **Case A (Overnight, 60% chance, 400 homes, elderly, 6hr lead time):**
      1.  **X:** Overtop at Maple St. **Y:** Life-threatening flooding in Trailer Park.
      2.  **BAR:** HIGH (Risk to life, vulnerable population).
      3.  **C:** MEDIUM (60% chance = Medium confidence).
      4.  **Time Trap:** Can you get better C within 6hrs? Unlikely overnight. Even if you could, waiting burns lead time. **-> No significant gain possible without hurting action.**
      5.  **Compare:** C(Med) < BAR(High) -> **PRECAUTION** (Recommend evacuation).
      *   *Documentation:* BAR=HIGH (Life Safety - Elderly Residents), C=Medium (60% forecast), Live Errors: [Standard + any specific], PRECAUTION due to C < BAR.

  *   **Case B (Same Forecast, Two Zones):**
      *   **Trailer Park (Identical to Case A):** BAR=HIGH (Life), C=MEDIUM (60%) -> C < BAR -> **PRECAUTION** (Evacuate recommended).
      *   **Warehouse District:**
          1.  **X:** Overtop at Maple St. **Y:** Flooding of empty warehouses/parking lot (Property damage only, no life risk).
          2.  **BAR:** MEDIUM (Major property damage, low life risk).
          3.  **C:** MEDIUM (60% chance = Medium confidence).
          4.  **Time Trap:** Same as above -> No gain without hurt.
          5.  **Compare:** C(Med) >= BAR(Med) -> **ASSERT KNOWLEDGE** ("We know it will NOT overtop" - assuming forecast says 60% *chance it will*, meaning 40% chance it won't. For "won't", C=Medium ~60-80%? *Clarify forecast meaning*). If forecast is purely 60% *chance of overtopping*, confidence it *won't* happen is only 40% (Low). Then C(Low) < BAR(Med) -> **PRECAUTION** for warehouses too. *BUT*:
      *   *Critical Point:* **The procedure WILL give different answers for trailers vs. warehouses on the SAME evidence because the STAKES (BAR) are different.** If C(Med) for "won't overtop" meets BAR(Med) for warehouses, you ASSERT KNOWLEDGE for warehouses while recommending PRECAUTION for trailers. You *hate* it, but the protocol forces this distinction logically. Document each zone's BAR/C separately!

  *   **Case C (Slow-onset, 3 days out, better model in 12hrs, evac needs 30hrs):**
      1.  **X & Y:** [Define as before, e.g., Overtop causing life-threatening flooding?].
      2.  **BAR:** Likely HIGH if life at risk.
      3.  **C:** ? (Initial assessment, say Low/Med based on early forecast).
      4.  **Time Trap:**
          *   Can you get better C? YES (Better model in 12hrs).
          *   Does waiting 12hrs hurt action? **YES!** Evac needs 30hrs lead. Waiting 12hrs leaves only 18hrs before event starts (3 days = 72hrs? Timing unclear). If evac *requires* 30hrs and waiting uses 12hrs, you only have 18hrs left -> **Insufficient time for effective evacuation if you wait.** Waiting makes the precautionary action (evac) potentially impossible or far less effective.
          *   **-> VALUES CALL Triggered.**
      5.  **Output:** **VALUES CALL** (Hand off to County Judge).
      *   *Recommendation to Judge:* "We can get better data in 12hrs (C will improve), but waiting that long means we cannot complete a full evacuation in time if it's needed. Options: 1) Order partial/early evacuation NOW based on current C(Med/Low) < BAR(High) [Precaution branch]. 2) Wait 12hrs for better data, accepting that IF evacuation is then needed, we may only have time for a limited/uncoordinated effort or shelter-in-place, increasing risk. This is a trade-off between resource cost/panic (Option 1) vs. potential for worse outcomes if flooding happens (Option 2)."
      *   *Documentation:* BAR=HIGH (Life Safety), C=Medium/Low, Live Errors: [List], **VALUES CALL:** Time conflict - Better data possible in 12hrs but waiting eliminates sufficient lead time for effective precaution (evacuation). Trade-off explained to Judge.

  **Key Takeaways for Duty Officers:**
  1.  **Whose Stakes?** The people facing the bad outcome (Trailer Park residents). Your job is to protect them, not avoid institutional hassle. Document *why* BAR is set (e.g., "Life at risk").
  2.  **Conflicting Stakes/Time Trap:** Step 4 (Time Trap) is crucial. If getting more certainty makes the action useless, it forces a VALUES CALL. That's the protocol working – it tells you when the purely factual "know/not know" question can't be resolved in time to act effectively, and a value-based trade-off is needed by leadership.
  3.  **Document for the Future:** Recording BAR level, live errors, and the time check provides auditors/adjusters the *context* for why "we know" was asserted or not. It shows the reasoning was structured and considered the critical factors under pressure.
  4.  **Different Zones, Different Answers:** The protocol *will* sometimes tell you to evacuate the trailers but not the warehouses on the same forecast because the potential harm is radically different. Acknowledge it, document the separate BARs clearly, and follow the protocol. This is its strength, not a flaw.
  5.  **"VALUES CALL" is Valid:** It's not a failure. It's the protocol identifying that the decision has moved beyond a pure confidence assessment into weighing competing risks/costs under severe time constraints. Hand it clearly to the Judge.
