  3. **Comparison to words**: In the debrief, we can ask: were the keys (with words) unambiguous? They might say: the words were clear. But then we note: words are conventional too. The word "heart disease" is arbitrary. And if we didn't know English, we wouldn't understand. So both pictures and words rely on conventions. This leads to claim 3.

  Order of debrief:
  - Start with the data recovery: ask teams how many readers got it right. Note that some teams overconfident. Why? Because they thought their picture was clear, but it wasn't. Why wasn't it? Because the symbols were not clear? Or the layout? This leads to claim 1: pictures require conventions and training.
  - Then the transformation: step 1 (re-sorting) was possible because the information was there. Step 2 was not. This leads to claim 2: transformability as a test. A picture must be transformable to be checked, but it must contain the necessary information.
  - Then claim 3: words and pictures are both conventional. We can say: "In this activity, you used words in the key to disambiguate the symbols. But words themselves are symbols that require convention. Neurath saw both as part of a unified system of communication that requires standardization."

  **Limit of the Exercise:**

  What we cannot stage: the full system of Isotype with its rules for transformation and its international aspirations. We cannot show how the same content can be mechanically transformed into different representations (e.g., from a bar chart to a pie chart) because we are using only one type of representation. We also cannot demonstrate the training aspect over time. We are only showing one snapshot.

  Moreover, we are not showing the social process of creating and refining the symbols, which was central to Neurath.

  At the end, we must say: "This activity only scratches the surface. Neurath's system was designed to be a global picture language that could be learned and used across cultures, with rigorous rules for transformation and consistency. We haven't shown that here, but we hope we've illustrated the core ideas: that pictures need conventions, that transformability is key, and that both words and pictures are in the same boat."

