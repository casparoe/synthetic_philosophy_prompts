prompt: |-
  You are a philosopher of science who also works on statistical methodology and meta-science, and I'd like you to think carefully and work in stages: first a rough, candid diagnosis of the pattern in the cases below, then a cleaned-up statement of the principle, then the cases it settles that I haven't given you. Don't just name-drop a framework and stop; I want the clauses.

  Some background on where this comes from: I'm an assistant professor in a psychology department, and I spent most of a long departmental meeting arguing with two colleagues about how we should weigh evidence in the disputes that keep coming up in our literature. One colleague's position was essentially "preregistration plus big samples solves it — anything not preregistered is just storytelling." The other said the real villain is underpowered designs and that a single well-run study with a tiny effect estimate tells us more than a dozen small significant ones. I pushed back on both, and by the end of the argument I realized that I was issuing a string of verdicts that I couldn't state as a rule. The two of us did agree on one thing, though: that we can't go on treating the published literature as a simple record of findings, because the selection process into journals is itself part of the evidence, and because a lot of what gets published is the output of designs that had plenty of freedom in which outcome to report, which comparison to run, which participants to drop, or when to stop collecting. My own tentative principle was this: a result counts as evidence for a hypothesis only if it would survive being asked, in detail, what else the researchers could have done and didn't report — i.e., evidence is a property of a process of inquiry, not of a number. I like that principle, but I don't think it actually delivers all my verdicts, and I'd rather find out where it breaks than keep asserting it.

  Here are the cases, with what I said about each. (1) A parapsychology paper reports a precognition effect from roughly a thousand participants across a series of experiments, with tiny p-values, explicit predictions, and — by the standards of the field — careful procedure and analysis; my gut says this is not evidence that the effect is real, and not merely evidence that gets outweighed. (2) A famous two-minute bodily-posture manipulation was said to change hormone levels and risk-taking on the basis of a study with about two dozen people per cell; a later preregistered replication with several times the sample, run in a different lab with a slightly different posture procedure, found essentially nothing, and I want to say this replication counts substantially against the original claim. (3) The same effect is then retested across a few dozen labs, each running the identical protocol, and the results scatter: a handful of labs clearly positive, a handful clearly negative, most clustered around nothing. I don't think this scatter counts much against the original; I think it counts as evidence that the effect, if it exists, depends on something about the setting that nobody has identified — and I notice that this sits badly with (2), where I was happy to let a null count against the effect. (4) A large preregistered study with well over a hundred thousand participants finds an effect that is significant at p just under .05 but so small that no one would design an intervention around it. My verdict: it is real evidence that the effect is not exactly zero, and my colleague's "that's just noise dressed up as a finding" is wrong — the design could have failed to detect it and didn't. (5) A meta-analysis of a literature finds a pooled effect comfortably different from zero, but a p-curve analysis of the same set of studies shows the significant p-values bunched just under .05 rather than spread toward zero. I don't count this as evidence for the effect. (6) A single paper reports three small studies, all significant, with p-values of about .04, .03, and .04. I want to say this is weaker than one adequately powered preregistered study at p = .001 — but I can't say why, since on my tentative principle nothing about the first case looks like a reporting sin: all three studies are right there in the paper. (7) The case we did agree on: a preregistered study with a couple of hundred participants finds that a hormone manipulation shifts risk-taking with p = .004. Both of us said: that's evidence, tentative but real, even though we'd bet against it surviving a decade. (8) The case I go back and forth on: an original study and one preregistered replication disagree, one significant and one null, both competently run, both with decent power. What should an editor do — publish the pair and describe the literature as unsettled, or treat the disagreement itself as the finding? And what does your principle say about a case nobody in my department could agree on: after a second, even better powered replication also comes back null, are we ever permitted to conclude the effect is absent, or does the mere possibility of an unidentified moderator keep absence permanently off the table?

  So: what principle, or small set of rival principles, captures these verdicts? Please tell me which of my verdicts your preferred principle cannot accommodate and which one it says I must give up, noting where I'd rather overturn the verdict than complicate the principle. I especially want you to fix whether my tentative principle needs a second dimension alongside the "what else could they have done" test — something about whether the design was capable of failing to deliver the result it delivered, or about how prior implausibility and untraceable sources of error enter — and to be explicit about whether the resulting principle collapses into a familiar Bayesian or error-statistical account or is a genuinely distinct norm for a discipline with a publication filter. State the principle precisely enough that I can apply it to cases you haven't been given, and give me at least three of those applications on your own.
reasoning: |-
  Hmm, this user presents a fascinating challenge. They're an assistant professor in psychology grappling with evidence evaluation in their field, and they've shared eight concrete cases where their intuitive judgments about evidence seem inconsistent. Their tentative principle - that evidence depends on the inquiry process rather than just numbers - is insightful but incomplete. 

  The core tension I see is between three competing philosophies in their department: one colleague advocating for preregistration as a panacea, another emphasizing statistical power, and the user themselves recognizing that evidence assessment must account for the entire research ecosystem. Their cases reveal this isn't just about methodology but epistemology - what constitutes scientific evidence when publication bias and researcher degrees of freedom exist.

  Looking at their verdicts, several patterns emerge. They consistently discount results where hidden analytic flexibility exists (cases 1,5) but accept well-constrained findings even with small effects (4,7). They're surprisingly sympathetic to scattered replication results (3) while rejecting single failed replications (2) - suggesting sensitivity to difference between direct falsification and heterogeneous effects. The three-study paper (6) troubles them because it passes surface-level scrutiny but feels weaker than a single strong study.

  Their struggle with case 8 is particularly telling. It exposes the fundamental question: when can we declare an effect absent? The "undetectable moderator" objection seems paralyzing, but in practice science must sometimes conclude non-existence. This suggests their principle needs to incorporate something about the exhaustiveness of alternative explanations tested.

  The parapsychology case (1) is crucial - it shows prior plausibility matters even when methodology appears sound. Their tentative principle ignores this, as does standard frequentist statistics. A complete account must integrate background knowledge with procedural rigor.

  For a resolution, I'm considering a three-clause principle that: (1) demands full specification of what could have been reported (their initial insight), (2) requires that alternative outcomes would have been interpretable (addressing the "design capable of failing" concern), and (3) weights evidence by its explanatory uniqueness relative to alternatives (handling prior plausibility). This bridges error statistics and Bayesian thinking without collapsing into either.

  I'll need to show how this handles their tough cases. For instance, the p-curve analysis (5) fails clause 1 because unpublished nulls could exist. The three-study paper (6) fails clause 2 because with multiple small studies, non-significant outcomes might have been dismissed. And the replication disagreement (8) requires applying clause 3 to ask whether "undetected moderator" is more plausible than simple non-existence after multiple rigorous nulls.
answer: |-
  Your cases reveal a tension between three dimensions of evidence assessment: **procedural constraint** (limiting researcher flexibility), **diagnostic capacity** (a design's ability to distinguish truth from error), and **explanatory uniqueness** (how uniquely the result supports the target hypothesis over alternatives). Your tentative principle captures the first dimension but neglects the others. After refining, I propose:

  ### **The Constrained Explanatory Power Principle**  
  *A result provides evidence for hypothesis H relative to alternatives A₁, A₂, ... Aₙ iff:*  
  1. **Full Procedural Transparency**: The reported analysis is uniquely specified by a pre-commitment (preregistration, protocol, or unambiguous natural constraints) that eliminates outcome-contingent flexibility in design, analysis, or reporting; *and*  
  2. **Strong Diagnostic Capacity**: The design had high probability (≥80%) of detecting a minimally interesting effect *and* a high probability (≥80%) of a null outcome if H were false (i.e., high power *and* high severity for H); *and*  
  3. **Explanatory Uniqueness**: The observed outcome is substantially more probable under H than under plausible alternatives (including methodological artifacts), given background knowledge.  

  *(Clause 3 operates on likelihood ratios: P(Outcome|H) / P(Outcome|Aᵢ) must be >3 for key Aᵢ. Background knowledge modulates "plausible.")*  

  ---

  ### **Diagnosis of Your Verdicts**  
  | Case | Your Verdict | Principle's Verdict | Tension Resolved |  
  |-------|--------------|---------------------|-----------------|  
  | 1 (Parapsychology) | Not evidence | **Agree**: Fails Clause 3 (prior implausibility makes methodological artifacts more probable than precognition) | Your principle lacked explanatory uniqueness |  
  | 2 (Failed Replication) | Counts against original | **Agree**: Original fails Clause 1 (researcher flexibility likely); Replication satisfies Clauses 1-2 | Your principle underweighted diagnostic capacity |  
  | 3 (Multilab Scatter) | Not evidence against original | **Agree**: Original still fails Clause 1; scatter suggests unmodeled moderators (Aᵢ), not H falsification | Your principle correctly ignored naïve aggregation |  
  | 4 (Tiny Effect) | Real evidence ≠0 | **Agree**: Satisfies Clauses 1-2. Clause 3: P(tiny effect | H₀) is low if power is high | "Noise" claim ignores severity |  
  | 5 (P-Curve Bunching) | Not evidence for effect | **Agree**: Fails Clause 1 (selective reporting likely; non-significant results suppressed) | Your principle catches this |  
  | 6 (3 Small Studies) | Weaker than 1 strong study | **Agree**: Each study has low diagnostic capacity (Clause 2). Multiple low-severity tests ≠ 1 high-severity test | Your principle missed severity |  
  | 7 (Preregistered p=.004) | Tentative evidence | **Agree**: Satisfies all clauses minimally | Consensus case |  
  | 8a (Original + 1 Replication) | — | **Publish as disagreement**: Original fails Clauses 1/3; replication satisfies 1-2. Outcome suggests moderator search | Requires modeling heterogeneity |  
  | 8b (2+ Null Replications) | — | **Conclude absence if**: (i) Replications satisfy Clauses 1-2, (ii) Moderators tested exhaustively, (iii) P(nulls | H) << P(nulls | artifacts) | "Permanent uncertainty" violates scientific progress norms |  

  ---

  ### **Where You Must Revise Your Verdicts**  
  - **Case 2 vs. Case 3**: You were inconsistent. The principle resolves: A *single* high-severity null (Case 2) can falsify an *unconstrained* original, but *heterogeneous* nulls (Case 3) only falsify if the design had power over moderators (which it didn’t).  
  - **Case 6**: Your intuition is correct, but your principle couldn’t explain it. Three p=.04 studies with 40% power each provide less evidence than one p=.001 study with 90% power because the latter has higher severity (Clause 2) and lower fragility to bias (Clause 3).  

  ---

  ### **Is This Just Bayesianism or Error Statistics?**  
  It synthesizes both:  
  - **Clause 1** is error-statistical (prevents p-hacking)  
  - **Clause 2** is severe testing (Mayo 2018)  
  - **Clause 3** is Bayesian likelihoodism (Royall 1997)  
  But it’s distinct by:  
  - Explicitly requiring *all three* for evidence status,  
  - Treating publication bias as a failure of Clause 1,  
  - Demanding background knowledge inform "plausible alternatives" (unlike pure frequentism).  

  ---

  ### **Applications to New Cases**  
  1. **A preregistered fMRI study with n=30 finds p=.001 for a brain-behavior correlation.**  
     *Verdict*: Not evidence. Fails Clause 2 (low power for fMRI; typically <50% for correlations). Also fails Clause 3 if multiple comparisons were possible.  

  2. **A well-powered RCT with preregistered analysis finds a large effect (p<.001), but the mechanism is biologically implausible.**  
     *Verdict*: Evidence for *some* effect, but not the hypothesized mechanism. Clause 3 forces consideration of alternatives (e.g., unblinding).  

  3. **A meta-analysis of 50 studies shows small but consistent effects (I²=10%), but all used flexible analyses.**  
     *Verdict*: Not evidence. Fails Clause 1 (publication bias likely; p-hacking could produce consistency).  

  ---

  ### **Your Tentative Principle Upgraded**  
  Your "what else could they have done" test is Clause 1. But without Clauses 2–3, it cannot:  
  - Distinguish underpowered flukes from true effects (Case 4),  
  - Handle prior implausibility (Case 1),  
  - Quantify when replications imply absence (Case 8b).  

  **Final Principle**: Evidence emerges only from *processes* that preemptively bind hands (Clause 1), *designs* that can reliably fail (Clause 2), and *results* that uniquely favor H over salient errors (Clause 3). This rejects "one-size-fits-all" solutions: Preregistration alone fails without power (Case 6); power alone fails without constraints (Case 5); both fail without explanatory uniqueness (Case 1). Use this tripartite standard to evaluate *protocols*, not just papers.
