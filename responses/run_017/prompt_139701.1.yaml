prompt: |-
  I serve on a committee at my university that is rewriting the academic integrity code, and we keep circling around a case that none of us can state cleanly. Under current policy, a student registered with disability services who carries an ADHD diagnosis may sit an exam on a prescribed stimulant, and the university is obliged to accommodate her; the same drug, taken by an undiagnosed classmate who bought it from a friend, counts as unauthorized cognitive enhancement and can end his degree. The disability office does not claim that the pill works differently in the two students — everyone concedes that the effect on attention, impulse control and endurance is much the same — but rather that in the first case it restores normal functioning and in the second it improves on normal functioning. Our student health plan displays the same shape: it pays for that stimulant, for insulin, for a cochlear implant and for antidepressants, but not for laser eye surgery, not for a wakefulness drug for the student who simply prefers to work nights, and not for growth hormone for a boy who is short because his parents are short and whose endocrinologist can find nothing wrong with him. Anti-doping rules in sport look parallel again: an athlete with a documented hormone deficiency can be certified to use a substance that is banned for everyone else, and an asthmatic may use an inhaler, but a healthy athlete who reaches the same blood levels by the same route is cheating — while training at altitude is legitimate preparation, even though it works by producing precisely the sort of increase that a transfusion is banned for producing.

  What I want from you is not a verdict on any one of these rules but a reconstruction of the implicit theory the whole pattern runs on: what view of health, of normality, or of the point of medicine it presupposes, whether that is one view or several that merely coincide here, and which rival views the practice quietly rules out. Please do three things. First, articulate the distinction the institutions think they are applying. My committee has been using restoration-versus-improvement as if it were self-explanatory, and it is not: restore to what, and whose? I have tried out three candidate baselines and cannot make them agree — the patient's own counterfactual trajectory (therapy repairs a departure from how this very person would otherwise have gone), a statistical species-typical range (therapy brings someone back into the normal human band), and a welfare or capability threshold (therapy removes an obstacle to some specified level of flourishing). Say which of these the practice is genuinely committed to, where they diverge, where the practice is underdetermined between them, and whether it needs a value-free notion of normal function at all or is already relying on a value-laden one.

  Second, press the cases that pull in different directions. Take two students with identical present capacities and identical prospects, one at that level because illness knocked her down and medication brought her back, the other because he was always like that — constitutionally distractible, or simply near the bottom of the natural distribution facing a hard exam. Our rules treat them differently; is that defensible, and is the justification the same conceptual one that covers the diagnosed student, or merely an administrative one about scarce clinic slots and who gets a prescription? The restoration story also seems to have no natural stopping point: a cochlear implant for a child deaf from birth is counted as therapy even though it confers a capacity she never had, and along any gradual continuum repair shades into improvement, so I would like you to say whether the resulting vagueness is fatal to the distinction or merely untidy.

  Third, tell me what would actually have to change if we abandoned the line as a piece of metaphysics and rebuilt it. The proposal I keep returning to, which I will call capacity-neutral provision, has two parts: the clinic ranks interventions by expected benefit to the student's own ends and offers them in that order without asking whether the intervention is restorative, and the integrity code drops the treatment-versus-enhancement distinction in favour of asking only whether a student secured an unfair positional advantage in a graded competition. I suspect it collapses — perhaps because a student's ends are not fixed independently of what is available, perhaps because the positional test would also condemn caffeine, sleep, private tutoring and good schools, perhaps because it leaves unexplained why we owe the sick student anything in particular. Show me where it breaks and, if it does, give me the best available reconstruction of what we already do, including any part of it that is really cost containment wearing metaphysical costume. Finally, say whether that reconstruction carries over to the sporting case, where the good being competed for is explicitly zero-sum and the rules are enforced on everyone at once, or whether anti-doping runs on a different and possibly more coherent rationale than a university integrity policy does.
reasoning: |-
  Hmm, this is a deep philosophical question about academic integrity policies, medical ethics, and the distinction between therapy and enhancement. The user serves on a university committee rewriting the academic integrity code and is struggling with cases where the same substance (like ADHD medication) is considered legitimate therapy for one student but cheating for another. They've observed similar patterns in student health plans and anti-doping rules in sports.

  The user wants me to reconstruct the implicit theory behind these practices, focusing on three specific tasks: articulating the distinction institutions apply (especially the "restoration vs. improvement" concept), examining cases where this distinction breaks down, and exploring alternatives like "capacity-neutral provision."

  I need to carefully analyze the underlying assumptions here. The core distinction seems to rest on a particular view of "normal function" - likely a hybrid concept combining statistical typicality with value-laden judgments about human flourishing. The institutions appear to be using a normative baseline rather than purely statistical or counterfactual ones. For example, ADHD medication is framed as restoring species-typical cognitive function, while using it without diagnosis is seen as enhancement.

  There are tension points though. The case of two students with identical capacities but different histories highlights a problem: the rules treat them differently based on etiology, not current functioning. And with interventions like cochlear implants for congenital deafness, the "restoration" narrative becomes strained since there's no prior functional state to restore.

  The user's proposed "capacity-neutral provision" approach has several flaws. It ignores how desires adapt to available options, fails to address positional advantages fairly (since it would condemn many socially accepted advantages), and loses the special ethical claim of addressing illness. The system seems to be masking practical constraints like cost containment with moral language.

  For the sports comparison, anti-doping rules have a clearer rationale since sports are explicitly zero-sum competitions where maintaining a "level playing field" is paramount, though they still rely on the same problematic therapy/enhancement distinction.

  I should provide a clear reconstruction showing how these policies work in practice while acknowledging their contradictions, and suggest that the justification is primarily about fairness in competitive contexts rather than pure medical ethics. The response should help the committee understand why their current framework persists despite its philosophical weaknesses.
answer: |-
  Your committee's struggle exposes a foundational tension in how institutions operationalize concepts like health, fairness, and medical necessity. The pattern you describe relies on a **Normative Functional Baseline (NFB)**, a hybrid concept combining statistical typicality with value-laden judgments about human flourishing. Below is a reconstruction, critique, and exploration of alternatives.

  ### I. The Implicit Theory: Normative Functional Baseline (NFB)
  The core distinction ("restoration vs. enhancement") presupposes:
  1.  **A Species-Typical Functional Range:** "Normal function" is defined statistically for humans (e.g., typical attention span, glucose metabolism, auditory thresholds). This provides an *objective anchor*.
  2.  **A Value-Laden Threshold for Harm:** Mere statistical deviation isn't enough. The deviation must cause significant suffering or impede core capabilities required for basic flourishing in society (e.g., learning, communication, metabolic stability). This is the *normative* component.
  3.  **A Counterfactual Claim (Conditional):** Medical intervention aims to restore function *that the individual would have had* absent a specific pathology interfering with their development/functioning. This is secondary and often implied rather than primary.

  **How Your Cases Map to NFB:**
  *   **ADHD Medication:** Restores statistically typical executive function impaired by a recognized pathology, enabling core capabilities (learning). The undiagnosed classmate operates within the statistical low end but *without pathology*, so enhancement.
  *   **Health Plan:** Insulin/antidepressants restore metabolic/neurochemical function to a range enabling survival/basic agency. Laser surgery corrects deviation beyond the "harm threshold" (many function well with glasses). Growth hormone for idiopathic short stature doesn't correct a *pathology* defined against the NFB.
  *   **Sports Doping:** Asthma inhalers restore airway function to typical levels. Altitude training enhances red blood cell count *beyond typical baseline* via a "natural" stressor, while transfusions achieve the same *enhancement* artificially.

  **Where Baselines Diverge & Problems Arise:**
  *   **Congenital Conditions (Cochlear Implant):** NFB *prioritizes capability over counterfactual history*. A child deaf from birth never had "normal" hearing, but restoring the *capability* for auditory communication aligns with the species-typical functional range deemed essential for flourishing. The counterfactual baseline ("how this person would have gone") fails here, so NFB defaults to capability restoration.
  *   **The "Identical Capacities" Challenge:** Your two students:
      *   **Student A:** Illness reduced capacity, medication restores to *her* prior baseline and the statistical norm. Therapy.
      *   **Student B:** Always at low capacity (statistical tail, no pathology). Medication pushes him *above* his innate baseline. Enhancement.
      *   **Justification:** The distinction is conceptual (NFB), *not* purely administrative. It hinges on whether the limitation stems from a *pathological process* interfering with development/function relative to the NFB. Student A's limitation is seen as a *malfunction*; Student B's is *normal variation*. Resource scarcity is a separate, reinforcing factor, not the core justification.
  *   **Vagueness:** The continuum is real (e.g., mild depression vs. sadness, short stature vs. growth hormone deficiency). NFB relies on *diagnostic thresholds* (e.g., DSM, ICD) to operationalize pathology. This is untidy and culturally contingent, but not fatal institutionally. Lines are drawn pragmatically (e.g., "significant clinical impairment"), accepting some arbitrariness.

  ### II. Pressing the Cases & Breakdowns
  1.  **The Etiology Problem:** Treating Student A but not Student B *based solely on past pathology* seems arbitrary if present function and need are identical. NFB justifies this by claiming A's state *is* the pathology's effect, making her current state *itself* "abnormal" relative to her potential within the NFB. This requires accepting the *pathologization* of certain functional states based on origin. If Student B's distractibility stems from unrecognized neurodiversity (not just "laziness"), the NFB framework struggles to distinguish him from A without refined diagnostic criteria.
  2.  **The Enhancement Slippery Slope:** If a cochlear implant is therapy for congenital deafness (creating a new capability), why not neural implants for "neurotypical" memory enhancement? NFB draws the line at restoring capabilities deemed *fundamental* to human agency and social participation (hearing, sight, mobility) vs. enhancing capabilities beyond the species-typical range. This is explicitly value-laden. "Fundamental" is contested (is typical working memory fundamental?).
  3.  **Cost Containment in Metaphysical Clothing?** Absolutely. The health plan distinctions are heavily influenced by cost. NFB provides an ethical framework to *justify* covering interventions deemed "medically necessary" (restoring NFB) while excluding "elective" enhancements. The metaphysics serves the economics.

  ### III. Capacity-Neutral Provision (CNP): Why It Collapses
  Your two-part proposal fails conceptually and practically:

  1.  **"Expected Benefit to Student's Own Ends":**
      *   **Adaptive Preferences:** A student raised without access to ADHD medication might undervalue its potential benefit ("I'm just lazy"). Ends aren't fixed or fully autonomous.
      *   **Incommensurability:** How to compare "benefit" across diverse, subjective ends? Is focus for exam prep equal to focus for gaming?
      *   **The "Sick Student" Obligation Undermined:** CNP offers no basis for prioritizing the insulin-dependent student over the student wanting laser eye surgery for modeling. Our societal intuition that illness creates a *special moral claim* (based on need/harm) disappears. NFB grounds this claim; CNP erases it.
      *   **Medical Expertise Bypassed:** Determining "expected benefit" for complex interventions requires medical diagnosis/prognosis. CNP risks promoting unsafe use.

  2.  **"Unfair Positional Advantage":**
      *   **Over-inclusiveness:** Caffeine, tutoring, good nutrition, stable housing, innate intelligence – all confer positional advantages. Condemning *all* non-innate advantages is absurd and unenforceable.
      *   **Under-inclusiveness:** What if an enhancement (e.g., a safe, effective memory drug) is equally accessible to all? Is it still "unfair"? The positional test alone can't distinguish therapy from enhancement; it needs a prior concept of *illegitimate means*.
      *   **Ignores the Means:** Taking a prescription stimulant without a diagnosis isn't just about advantage; it's also about violating prescription drug laws, bypassing medical gatekeeping for safety, and potentially misusing a controlled substance. The positional test ignores this.

  **Best Reconstruction of Current Practice:**
  We operate on a **Modified Capabilities Approach within a Constrained NFB Framework**:
  1.  **Goal:** Enable individuals to achieve core human capabilities (e.g., senses, imagination, thought, affiliation) necessary for a life of dignity and agency (Nussbaum/Sen influenced).
  2.  **Baseline:** Define "core capability thresholds" using a *statistically typical functional range* as the primary anchor.
  3.  **Pathology Filter:** Intervene medically only when falling below this threshold is caused by a recognized *disease, disorder, or impairment* (pathologizing the deviation).
  4.  **Counterfactual Nuance:** Acknowledge that for congenital conditions, restoration targets the capability itself, not a prior state.
  5.  **Pragmatic Constraints:** Accept diagnostic thresholds as imperfect but necessary tools. Explicitly acknowledge cost/resource limits as secondary constraints justified *after* the NFB defines the scope of "need."

  This reconstruction explains why we "owe" the sick student: their pathology impedes core capabilities within the NFB, creating a need others don't have. It accepts the untidiness at boundaries as inherent to applying values to biology.

  ### IV. The Sporting Case: A Different Beast?
  Anti-doping rules *share* the NFB distinction (therapy vs. enhancement via pathology diagnosis/TUEs) but operate on a **distinctly zero-sum rationale**:

  1.  **Core Justification:** Preserve the **"Level Playing Field" (LPF)** and the **"Spirit of Sport."** LPF is explicitly positional and comparative. The spirit of sport often valorizes "natural" human achievement and the uncertainty of competition.
  2.  **Why Altitude is Different:** Rules often distinguish *methods*. Altitude exploits a "natural" physiological response to an environmental challenge. Blood transfusions or synthetic EPO are seen as "artificial" shortcuts bypassing effort or environmental exposure. The distinction is arbitrary biologically (both boost red cells) but rooted in cultural values about effort and authenticity.
  3.  **Coherence?** Sporting rules are arguably *more coherent* within their narrow domain. The goal (fair competition in a specific activity) is clearer than the university's dual goals of fostering individual flourishing *and* fairly grading achievement. The definition of "unfair advantage" is more concrete: *using banned methods to exceed natural physiological limits* or *circumventing effort*. The NFB serves this purpose by defining "natural limits" via species-typicality and identifying "artificial" shortcuts.
  4.  **Contrast with University:** The university's primary goal is *learning and knowledge creation*, not competition. Grading is a necessary, but secondary, evaluation tool. Banning cognitive enhancers solely based on positional advantage is often disproportionate and neglects the potential benefit to *learning itself* (independent of grade rank). The university policy's reliance on NFB is partly a *borrowed rationale* from medicine/sport that doesn't perfectly fit its educational mission.

  ### Conclusion
  Your committee's dilemma arises because the "restoration vs. enhancement" distinction rests on the **Normative Functional Baseline (NFB)**, a construct blending statistical biology with value judgments about essential human capabilities and the definition of pathology. While philosophically untidy and susceptible to boundary problems, it provides a workable, ethically intuitive (though not universally agreed upon) framework for distinguishing medical need from elective improvement. It grounds special obligations to the sick and justifies resource allocation for "therapy."

  **Capacity-Neutral Provision collapses** because it ignores the moral significance of pathology, the malleability of preferences, the impossibility of defining "unfair advantage" without prior normative baselines, and the practical realities of medical safety and regulation. The best reconstruction acknowledges the NFB's core role while explicitly admitting its value-laden nature and the pragmatic compromises (diagnostic thresholds, cost) required for implementation.

  **For the Sporting Context:** Anti-doping uses a *version* of NFB but is fundamentally driven by the zero-sum logic of fair competition and specific cultural values about athletic achievement, making its rationale distinct from, and arguably more internally coherent for its purpose than, an academic integrity policy primarily concerned with learning. The university should critically examine whether borrowing the sports/war-on-drugs rhetoric of "cheating" for cognitive enhancers serves its core educational mission or obscures it.
