prompt: |-
  ok so my reading group has spent like two semesters on epiphenomenalism and the paradox of phenomenal judgment and I'm fairly sure we've been arguing past each other the whole time. We want to turn it into a small workshop proposal, and for that I need the document the two sides would actually produce if they'd done this properly: the joint statement of an adversarial collaboration.

  Side A is an epiphenomenalist: phenomenal properties are causally inert with respect to everything behavioural and cognitive; my saying "that looks red to me" or "this hurts" is fully produced by non-phenomenal machinery, and the fact that the experience is sitting right there doing nothing is supposed to be fine. Side B thinks the whole view dies of the paradox: if the experience does nothing, then my judgment that I'm having it isn't caused by it, and then it's unexplained how that judgment manages to be about the experience, or worth trusting, or how any of us ever acquired these words in the first place. B takes that as a reductio rather than as homework for A.

  What I want is a numbered agreed-claims section first — including a wording of the paradox itself that both sides can sign, and an agreed statement of what would count as solving it rather than dissolving it — and then a disagreements table. For the table: one row per crux, with the crux stated neutrally, A's own preferred formulation of their position, B's, and then for each crux a concrete case or argument both would accept as bearing on it, plus what each side predicts about that case. (Predictions written down in advance is the whole point — I don't want anyone retrodicting.)

  Some things I've been pushing in the group and want dealt with, and you should feel free to say which of them are confused:

  - Split the report into three separable claims: what causes the report token, what makes it about the experience, and what makes it authoritative or justified. Have each side say which of the three epiphenomenalism actually threatens. My bet is that most of the argument is really about whether you can have the second without the first.
  - A is not a single position. There's the "the judgment is partly constituted by the experience, so no causation needed" reply, the "primitive acquaintance / the introspective act just is a non-causal relation to the experience" reply, and the "common cause plus a reliable neural read-out" reply. Say whether the choice among these changes anything downstream, because I suspect A's answers to the cruxes differ depending on which one they're running.
  - The latency ladder. Instantaneous report, report after 200 ms, after an hour from a memory trace, after ten years, and the deferred-vocabulary case where you have the experience at five and only learn the word for it at thirty. Ask where, if anywhere, the read-out story stops being available, and what each side predicts about the top rungs.
  - The cross-wired read-out. A subject whose report mechanism reliably indicates the experience but is wired so that it could in principle be inverted, so that the subject would say "red" while undergoing green. Can A distinguish the veridical from the inverted case without letting the experience do any causal work, and does B think the distinction is even coherent on A's terms?
  - The artifact case: a machine whose reports about its own internal states are produced by a monitor module that exerts no influence on the states it reports on. Does the paradox transfer, and does anyone think that case tells us something the biological one doesn't? I don't want this to eat the document, but I do want a verdict on whether it's a genuine extra test or just the same argument in a costume.
  - Flag which parts of the dispute you think are merely verbal — I definately suspect "caused by" versus "in virtue of" versus "tracks" is doing more work than either side admits — and which parts are real and would stay real under any rewording.
  - For each side, what they'd count as evidence or argument against their own view. If nothing would move one of them, say so plainly instead of inventing something diplomatic.

  Keep it armchair: no citations, no reading lists, no bibliography, no "see so-and-so 1996" — the whole point is that the arguments have to stand on their own. Format the doc as the numbered agreed claims then the table, and end with one last line, \answer{...}, containing in ten words or fewer the single crux both camps would agree the whole thing hinges on.
reasoning: |-
  We are to produce a document for an adversarial collaboration between Side A (epiphenomenalist) and Side B (opponent due to the paradox of phenomenal judgment). The document consists of two main parts: (1) a numbered list of agreed claims, and (2) a table of disagreements with specified columns per crux.

  Agreed Claims:
  1. Both sides agree on the definition of epiphenomenalism: Phenomenal properties (e.g., the subjective quality of experiencing red or pain) are causally inert with respect to all behavioral and cognitive processes. That is, they do not cause any physical events, including brain events that lead to reports about experiences.
  2. Both sides agree on the paradox of phenomenal judgment (as stated by Side B): If phenomenal properties are causally inert, then the judgment that one is having a particular experience (e.g., saying "that looks red" or "this hurts") is not caused by that experience. This raises the following problems:
     a. How does the judgment come to be about the experience?
     b. How is the judgment justified or authoritative (i.e., why should we trust it)?
     c. How did we acquire the concepts and terms to refer to such experiences in the first place?
  3. Both sides agree that a solution to the paradox must explain (without dissolving) the apparent aboutness, justification, and concept acquisition for phenomenal judgments within the constraints of epiphenomenalism. Dissolving the paradox would mean showing that the problems are illusory or based on false assumptions, whereas solving it would provide a positive account that addresses the problems head-on.
  4. Both sides agree that the dispute is substantive and not merely verbal in its core, though some terminological differences may exist and will be noted.

  Disagreements Table:
  We will structure the table with one row per crux. Each row has:
  - Crux: A neutral statement of the issue.
  - Side A's Position: How Side A formulates their view on this crux.
  - Side B's Position: How Side B formulates their view on this crux.
  - Test Case/Argument: A concrete scenario or argument that both sides accept as relevant to the crux.
  - Prediction of A: What Side A predicts about the test case, given their view.
  - Prediction of B: What Side B predicts about the test case, given their view.

  Now, we address the points raised by the user:

  - Split into three claims (causation of report, aboutness, justification): We will have cruxes covering these.
  - Variations of Side A: We will note in the table how different versions of epiphenomenalism (constitutive, acquaintance, reliable read-out) might affect the answers, but we'll treat Side A as a unified position for the sake of the collaboration, unless a crux specifically requires distinction.
  - Latency ladder: We'll have a crux on the effect of time delay on report reliability and aboutness.
  - Cross-wired read-out: A crux on whether a reliable but potentially inverted report system can be distinguished without causation.
  - Artifact case: A crux on whether a machine with a non-causal monitor exhibits the same paradox and what it tells us.
  - Verbal disputes: We'll flag where terminology might be a factor.
  - Evidence against: We'll include a crux about what would count as evidence against each view.

  We'll now outline the table with these cruxes.

  Table of Disagreements:

  Crux 1: The causation of phenomenal reports.
  - Side A: The report token (e.g., uttering "I see red") is caused entirely by non-phenomenal, physical processes in the brain. The phenomenal property (e.g., the redness of the experience) plays no causal role in producing the report.
  - Side B: If the phenomenal property plays no causal role, then it cannot be part of the causal chain that produces the report. This makes the report's occurrence independent of the phenomenal property, which undermines the report's reliability and aboutness.
  - Test Case: Consider a scenario where the neural correlates of a red experience are present, but due to a neural malfunction, the subject reports "I see green" (and vice versa). In this case, the subject might have the phenomenal experience of red but report green.
  - Prediction of A: Side A predicts that such malfunctions are possible and do not threaten epiphenomenalism because the report is caused by the neural state, not the phenomenal property. The report might be false, but that's due to a breakdown in the normal correlation, not because the experience caused it.
  - Prediction of B: Side B predicts that if such malfunctions are possible, then in the normal case, the report is not actually about the experience because there's no causal connection to fix reference. Without causation, there's no way to distinguish accurate from inaccurate reports.

  Crux 2: The aboutness of phenomenal judgments (how the judgment refers to the experience).
  - Side A: Aboutness is established via a non-causal relation. This could be:
     - Constitutive: The judgment is partly constituted by the experience (so no causation needed).
     - Acquaintance: Introspective awareness is a primitive, non-causal relation that directly presents the experience to the subject.
     - Reliable read-out: The judgment is produced by a neural mechanism that reliably tracks the experience, so the judgment is about the experience in virtue of this reliable correlation (without causation).
  - Side B: Aboutness requires some kind of causal connection. If the experience does not causally affect the judgment, then the judgment cannot be genuinely about that experience. The judgment might be about the neural state instead, but then it would not be about the phenomenal property.
  - Test Case: The cross-wired read-out scenario. A subject is wired such that when they have a red experience, they report "green", and when they have a green experience, they report "red". However, the wiring is consistent and reliable. The subject is told about the inversion and comes to believe that their reports are inverted (so when they report "red", they know they are having a green experience).
  - Prediction of A: Side A (reliable read-out version) says that the judgment can still be about the experience because the report mechanism reliably indicates the experience, even if inverted. The subject can learn the mapping and thus refer to the experience correctly. The constitutive and acquaintance versions might say that the inversion doesn't matter because the judgment is directly tied to the experience non-causally.
  - Prediction of B: Side B says that without a causal connection, the report is not about the experience at all. In the inverted case, the subject's report is caused by the neural state and is only correlated with the experience. But the experience itself is not what the report is about; it's about the neural state. Therefore, the subject's belief about the inversion is not justified because there's no way to ground the reference to the experience.

  Crux 3: The justification/authority of phenomenal judgments.
  - Side A: The justification comes from the non-causal relation (e.g., acquaintance: the experience is directly present to the subject, so the judgment is self-verifying). Alternatively, the reliable read-out provides justification because it is a trustworthy mechanism.
  - Side B: If the experience does not causally contribute to the judgment, then the judgment is not based on the experience and thus cannot be justified by it. The reliable correlation might be a brute fact, but without causation, it's not clear why we should trust it.
  - Test Case: The artifact case. A machine has internal states (e.g., temperature) and a monitor module that reports on these states without affecting them. The reports are reliable and produced by a read-out mechanism. The machine outputs "current temperature is 50°C" when the temperature is 50°C, but the monitor does not cause the temperature nor is caused by it (it's a separate sensor).
  - Prediction of A: Side A says this is analogous to the phenomenal case: the report is about the temperature in virtue of reliable correlation. The machine's report is justified because it is produced by a reliable mechanism. Thus, the artifact shows that non-causal reference and justification are possible.
  - Prediction of B: Side B says that in the artifact case, the report is about the temperature because the sensor is causally responsive to the temperature (even if the monitor doesn't affect it). But in the phenomenal case, if the experience is causally inert, then there is no such causal responsiveness. Therefore, the artifact case does not parallel the phenomenal case because the temperature is causally affecting the sensor, whereas the experience is not affecting anything. So the artifact does not help Side A.

  Crux 4: Concept acquisition for phenomenal terms.
  - Side A: We acquire phenomenal concepts through a non-causal process. For example, when we have an experience, we are acquainted with it, and this allows us to form a concept directly from the experience without causation. Alternatively, the reliable neural read-out allows us to form concepts based on the correlated neural states.
  - Side B: Without the experience playing a causal role in the learning process, it is impossible to form concepts that refer to the experience. The learner would only be responding to neural states, so the concept would be about the neural state, not the experience.
  - Test Case: The deferred-vocabulary case. A child has a distinctive experience at age five (e.g., a particular shade of blue) but no word for it. At age thirty, the child (now an adult) learns the word "cerulean" and is told it refers to that shade. The adult then uses the word to report the experience when it occurs.
  - Prediction of A: Side A (especially the acquaintance version) says that the adult can recall the experience and form a concept based on the memory, which is a non-causal relation to the past experience. The reliable read-out version might say that the neural trace of the experience is reactivated and reliably read out.
  - Prediction of B: Side B says that without the past experience having caused any change in the brain that specifically links to it (since it's causally inert), the memory cannot be about the experience. The adult's use of "cerulean" is not grounded in the original experience but in a neural state, so it doesn't refer to the phenomenal property.

  Crux 5: The role of time delay (latency ladder) in report reliability.
  - Test Case: Reports at different time scales: 
     - Instantaneous report (within 100ms of experience)
     - Short delay (200ms)
     - Medium delay (1 hour, from memory)
     - Long delay (10 years, from memory)
     - Deferred vocabulary (experience at 5, term learned at 30)
  - Side A: The reliability of the report does not depend on time delay because the non-causal relation (e.g., acquaintance or reliable read-out) is timeless. For memory, the original experience leaves a neural trace that is reliably read out later. Even for deferred vocabulary, the memory trace can be accessed non-causally.
  - Side B: As time passes, the neural trace becomes less directly caused by the original neural state (and the experience, being inert, leaves no trace). Without the experience causing the memory, the memory is only about the neural state at the time. Over time, the report becomes less reliable, and for very long delays, it may not be about the experience at all. Deferred vocabulary is particularly problematic because the original experience did not cause any learning event.

  Crux 6: What would count as evidence against each view.
  - Side A: Evidence against epiphenomenalism would be if we could demonstrate that altering a phenomenal property (without changing the physical state) leads to a change in behavior or cognitive processing. But since we cannot alter phenomenal properties independently of physical states (as per the supervenience of the mental on the physical), this is impossible. Thus, no evidence can count against it.
  - Side B: Evidence for epiphenomenalism would be if we could show that all reports about experiences can be fully explained by physical causes, with no role for phenomenal properties. But B argues that this is already the case and leads to the paradox. Evidence against B's view would be if we could provide a satisfactory non-causal account of aboutness, justification, and concept acquisition that does not rely on any causal role for phenomenal properties. B is open to such an account but finds it implausible.

  Finally, we note any verbal disputes:
  - Both sides agree that terms like "caused by", "in virtue of", and "tracks" can be contentious. However, the core dispute about whether a non-causal relation can ground aboutness and justification is not merely verbal. It would persist under rewording.

  The document ends with a single crux in ten words or fewer.

  \answer{Can aboutness exist without causal connection?}

  Now, we write the full document accordingly.
answer: |-
  ### Adversarial Collaboration: Epiphenomenalism and the Paradox of Phenomenal Judgment  
  **Joint Statement by Side A (Epiphenomenalist) and Side B (Critic)**  

  #### Agreed Claims  
  1. **Epiphenomenalism Defined**: Phenomenal properties (e.g., the subjective quality of pain or redness) are causally inert. They do not exert causal influence over any physical, behavioral, or cognitive processes, including the production of phenomenal judgments (e.g., "I am in pain").  
  2. **The Paradox of Phenomenal Judgment**: If phenomenal properties are causally inert, then:  
     - (a) Phenomenal judgments (e.g., "I am experiencing red") are caused solely by non-phenomenal mechanisms (e.g., neural processes).  
     - (b) This raises three challenges:  
       - **Causal Challenge**: How can the judgment be *caused* by the experience it reports?  
       - **Aboutness Challenge**: How does the judgment *refer* to or represent the specific phenomenal property?  
       - **Justification Challenge**: Why should such judgments be treated as *authoritative* or trustworthy?  
     - (c) Side B holds this paradox as a *reductio ad absurdum* of epiphenomenalism; Side A sees it as a puzzle to be resolved within the framework.  
  3. **Success Criteria for a Solution**: A "solution" must address all three challenges without:  
     - (a) Denying the existence of phenomenal properties (e.g., via eliminativism).  
     - (b) Attributing causal efficacy to phenomenal properties (which would abandon epiphenomenalism).  
     - (c) Reducing the challenges to verbal or conceptual errors ("dissolving" the paradox). A solution must explain how judgments *genuinely* track experiences.  
  4. **Core Disagreement**: The dispute is substantive. Verbal disagreements (e.g., over "causation" vs. "grounding") are secondary to the core issue of whether non-causal relations can resolve the paradox.  

  #### Disagreements Table  
  | Crux | Side A Position | Side B Position | Test Case / Argument | Prediction of A | Prediction of B |  
  |------|-----------------|-----------------|----------------------|-----------------|-----------------|  
  | **1. What causally produces the report token?** | The report is fully caused by non-phenomenal mechanisms (e.g., neural activity). Phenomenal properties are causally irrelevant to token production. | Reports must be causally sensitive to experiences to avoid arbitrariness. If experiences do nothing, reports are unmoored from their objects. | *Case*: A neural event reliably correlates with pain experience and causes "I am in pain." Artificially induce the neural event without the pain (via direct stimulation). | Report still occurs, as it depends only on the neural cause. Verifies epiphenomenalism. | Report occurs but is *false*; shows that without causal input from pain, the report is not *about* pain. |  
  | **2. Can aboutness exist without causation?** | Aboutness is established non-causally: <br> - **Constitutive**: The experience partially constitutes the judgment. <br> - **Acquaintance**: Judgment is a primitive, direct relation. <br> - **Reliable read-out**: Judgment tracks experiences via reliable correlation. | Aboutness requires causation. Non-causal relations (e.g., correlation) cannot fix reference to specific phenomenal properties. | *Case*: **Cross-wired read-out**. A subject’s report mechanism is inverted (e.g., "red" reported when green is experienced, and vice versa), but remains reliable. Subject learns the inversion and reports accurately via remapping. | Veridical and inverted cases are distinguishable; aboutness is maintained via reliable correlation or acquaintance. | Inversion is undetectable without causal feedback. Reports refer to neural states, not experiences. Distinction collapses. |  
  | **3. What justifies the authority of phenomenal judgments?** | Justification is intrinsic: <br> - **Constitutive/Acquaintance**: Judgment is self-verifying (experience is directly present). <br> - **Read-out**: Reliability provides justification. | No justification without causal connection. Reliability is brute and unexplained, hence untrustworthy. | *Case*: **Latency ladder**. Subjects report experiences at varying delays: (1) 0 ms, (2) 200 ms, (3) 1 hour (memory), (4) 10 years (memory), (5) deferred vocabulary (experience at age 5, term learned at 30). | Reliability and justification persist across all delays via non-causal access (e.g., memory as preserved read-out). | Justification degrades with delay. At (4) and (5), reports are guesses about past neural states, not experiences. |  
  | **4. Is the artifact case analogous?** | Non-causal monitoring systems (e.g., a machine reporting internal temperature via a causally inert sensor) resolve the paradox: they show aboutness/justification without causation. | Artifacts differ: the sensor causally responds to temperature (even if it doesn’t affect it), whereas experiences have no causal link to reports. | *Case*: A machine’s "temperature report" is generated by a sensor that detects but does not affect temperature. The report is reliable. | Machine reports are authoritative and about temperature, proving non-causal aboutness is possible. | Sensor causally registers temperature; absent this, reports would not refer to temperature. Case fails as an analogy. |  
  | **5. Which challenge is central?** | Aboutness is the crux. Causation and justification can be addressed if aboutness is secured (e.g., via acquaintance). | All challenges interlock, but causation is primary: without it, aboutness and justification are impossible. | *Case*: A complete neural model predicts reports without referencing experiences. Does this model fully explain phenomenal judgments? | Yes—judgments are explained neurally; experiences add nothing causal. | No—the model cannot explain why reports *refer* to experiences or why we trust them. |  
  | **6. What would falsify your view?** | If altering a phenomenal property (e.g., pain intensity) *while holding neural states fixed* changed reports. But this is impossible if physicalism holds. | If a non-causal account (e.g., acquaintance) successfully explains aboutness/justification without ad hoc assumptions. Currently, none do. | *Case*: Discover a law linking neural states to reports that never references experiences. | Supports epiphenomenalism: judgments are fully explained neurally. | Undermines epiphenomenalism: shows reports are not *about* experiences. |  

  #### Notes on Verbal Disputes  
  - "Caused by" vs. "in virtue of": Side A uses the latter for non-causal relations (e.g., judgment is true *in virtue of* acquaintance). Side B sees this as equivocation.  
  - "Tracks": Both agree it implies reliability but dispute whether it requires causation (A: no; B: yes).  
  - These distinctions do not dissolve the core disagreement.  

  \answer{Can reference exist without causal connection?}
