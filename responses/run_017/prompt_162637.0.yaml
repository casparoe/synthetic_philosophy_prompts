prompt: |-
  i'm a TA for an historical methods seminar (honors section, ~20 papers a week) and i'm the one who has to decide whether a paper is being presentist — right now i basically go on vibes and then can't defend the comment when a student pushes back in office hours. can you turn this into a real procedure i can run while grading, something more than the old whig-history complaint?

  the stuff i keep getting stuck on, and want the procedure to actually handle instead of hand-wave:

  - vocabulary drag. when a paper calls a 12th-century queen a survivor of domestic violence, or a 19th-century senator a white supremacist, the present-day term drags a whole theory in with it. is there a usable test — something like restating the claim in words available to people at the time and seeing what gets lost — for when the drag is doing real work and when it's just a label?
  - explaining vs. evaluating. the line i keep hearing is that present standards are illegitimate for explaining why people acted but fine for judging whether they acted well. that asymmetry feels too convenient. where does it actually hold up?
  - silence laundering. if the category didn't exist yet, the archive is silent about it, and it is really easy to turn that silence into evidence about the thing rather than evidence about the category. how do i catch a student doing that?
  - reciprocity. if you judge past actors by standards they didn't accept, you should be fine with some future historian judging you by standards you don't accept yet. does anything real follow from that, or is it just a rhetorical move?

  what i want: the questions in order, what counts as a good enough answer to each, where the procedure stops with a clear yes/no, and where it has to hand the call back to me because it's a values question rather than a factual one. it has to run in about five minutes a paper and be explainable to a sophmore without assigning them theory, and please be honest about which steps are really just my judgment wearing a checklist as a costume.

  then run it on three papers from this week: (a) one arguing that a colonial governor's campaign in the 1780s amounts to genocide; (b) one describing an 18th-century food rioter as engaging in redistributive justice — i liked this one, so tell me if the procedure kills it anyway; (c) one that refuses to use any moral language about the past at all on the grounds that we weren't there. for each, give me the comment i'd actually write in the margin. american english, and please don't soften the result on (b) if the procedure says it's presentist.
reasoning: |-
  Okay, I need to help this TA create a solid procedure for identifying presentism in history papers. They're dealing with honors students who write about 20 papers a week, and the current "vibes-based" approach isn't holding up when students push back. The TA outlined four specific challenges: vocabulary drag, explaining vs. evaluating, silence laundering, and reciprocity. The goal is to build a practical, step-by-step method that takes about five minutes per paper, is explainable to sophomores without theory jargon, and honestly flags where judgment calls are needed.

  First, I should structure the procedure around those four pain points, turning each into a clear question with yes/no gates where possible. For vocabulary drag, the key is testing if modern terms change meaning—maybe by rephrasing in historical language and seeing if the claim holds. For explaining vs. evaluating, I need to address that asymmetry the TA mentioned; perhaps emphasizing that explanation requires historical context while evaluation needs explicit justification. Silence laundering involves spotting when absence of evidence is misinterpreted, so a question about direct sources could help. Reciprocity is trickier—it might just be a reminder to stay humble, not a hard rule.

  The procedure must be efficient. I'll design it as a flowchart-style checklist: start with vocabulary, then move to explanation/evaluation, check for silence issues, and end with reciprocity as a reflection point. Wherever something isn't black-and-white—like whether a term's "drag" is problematic—I'll be transparent that it's a judgment call. For the TA's request, I won't soften results; if the procedure flags the food rioter paper (which they liked) as presentist, I'll say so.

  Now, applying it to the three examples: 
  - For the genocide paper, "genocide" is a 1944 term, so vocabulary drag is a red flag; I'll suggest reframing to avoid anachronism. 
  - For the food rioter, "redistributive justice" feels modern, but if the student ties it to contemporary moral frameworks, it might pass evaluation—though I have to be strict if the procedure says it's presentist. 
  - The no-moral-language paper is avoiding presentism but might oversimplify; the procedure should note that moral evaluation isn't always bad if done carefully. 

  Finally, I'll draft margin comments that are clear and actionable, using plain American English. The whole thing should feel like a useful tool, not theoretical baggage. And I'll admit where the checklist is just "judgment in disguise"—no pretending it's all objective.
answer: |-
  Here's a procedural checklist for spotting presentism, designed for speed, defensibility, and transparency about judgment calls. It addresses your four pain points directly.

  **The Presentism Spot-Check Procedure (5-min version)**

  Run these questions **in order**. Stop if you hit a "No" or "Unclear" and flag that issue. "Yes" means proceed to the next step. Judgment calls are explicitly marked (🟡).

  1.  **Vocabulary Drag Test:**
      *   *Question:* "If I replace the modern term/concept (e.g., 'genocide', 'domestic violence survivor', 'white supremacist', 'redistributive justice') with the *closest contemporary concept or description available to the historical actors* (e.g., 'extirpation', 'abused wife', 'defender of racial hierarchy', 'traditional right to fair price'), does the paper's **core argument collapse or become trivial?**"
      *   *Good Enough Answer (Yes):* The core argument still holds significant weight using historical language. The modern term is primarily shorthand or emphasis.
      *   *Bad Answer (No/Unclear 🟡):*
          *   *(No)* The argument relies entirely on the connotations/legal/moral weight of the *modern* term to seem compelling. Using historical language makes the claim seem weak, anachronistic, or nonsensical.
          *   *(Unclear 🟡)* It's ambiguous whether the historical language supports the claim sufficiently. Requires TA judgment on significance.
      *   *Outcome:* **No = Presentist Vocab Drag.** Stop. Flag this. **Unclear 🟡 = TA Judgment Needed.** Note it. **Yes = Proceed.**

  2.  **Explanation vs. Evaluation Firewall:**
      *   *Question:* "Does the paper **clearly separate** its *explanation* of why historical actors believed/acted as they did (using their context, motives, constraints) from its *evaluation/judgment* of those beliefs/actions using modern standards?"
      *   *Good Enough Answer (Yes):* Explanations are grounded in historical context explicitly. Any moral/political judgments are:
          *   a) Clearly signaled as such (e.g., "From our contemporary perspective...", "Judged by modern standards of human rights...").
          *   b) Not presented as the *reason* the historical actors acted (unless explicitly arguing they were motivated by proto-versions of modern ideas).
      *   *Bad Answer (No):* Modern judgments are woven into the explanation itself (e.g., "Because he was a white supremacist, he supported policy X" instead of "He supported policy X, which we can now understand as white supremacist, because he believed in inherent Black inferiority and the need for white dominance"). The evaluation is doing the explanatory work.
      *   *Outcome:* **No = Presentist Conflation.** Stop. Flag this. **Yes = Proceed.**

  3.  **Silence Laundering Check:**
      *   *Question:* "Where the paper identifies an *absence* of evidence about a modern concept in the historical record (e.g., lack of discussion of 'sexual consent', 'gender identity', 'systemic racism'), does it **explicitly consider alternative explanations** for this silence *other* than the non-existence of the *phenomenon*?"
      *   *Good Enough Answer (Yes):* The paper acknowledges at least one plausible alternative (e.g., "The lack of recorded protests against marital rape norms suggests the concept of consent within marriage wasn't widely articulated *or* that such protests were systematically suppressed/not recorded *or* that sources expressing dissent haven't survived").
      *   *Bad Answer (No):* The paper directly translates the silence *of the category* into evidence about the *absence or nature of the phenomenon* itself (e.g., "The absence of the term 'systemic racism' proves they didn't experience it" or "No records of same-sex marriage means homosexuality was universally condemned").
      *   *Outcome:* **No = Silence Laundering.** Stop. Flag this. **Yes = Proceed.**

  4.  **Reciprocity Reflection (🟡 - Always Judgment):**
      *   *Question:* "If the paper passes steps 1-3 but includes strong moral/political judgments of past actors using modern standards, **does it acknowledge the inherent contingency/humility** of this stance OR provide a *defended reason* why these standards are transcendent/universal?"
      *   *Purpose:* Not to forbid judgment, but to force awareness of the move being made. Is it done thoughtfully or glibly?
      *   *Good Enough Answer (🟡 - TA Judgment):*
          *   *(Acknowledged)* Includes phrases showing awareness (e.g., "We judge them by our lights, knowing future generations will judge us differently," "Applying these standards unavoidably reflects our concerns," "While anachronistic, this framework reveals structural patterns...").
          *   *(Defended)* Briefly but clearly justifies *why* this specific modern standard is being applied universally/transcendentally (e.g., basic harm prevention, core human dignity - requires more than assertion). *Rare and hard for undergrads.*
      *   *Bad Answer (🟡 - TA Judgment):* Presents the modern judgment as the only possible, objective, timeless moral truth with no hint of historical contingency or self-reflection. Feels like a sermon, not analysis.
      *   *Outcome:* **🟡 Always TA Judgment.** Flag if the judgment feels unreflective/arrogant even after passing 1-3. This step rarely *alone* fails a paper that passed 1-3, but it shapes your feedback tone.

  **Applying the Procedure to Your Papers:**

  **(a) Colonial Governor's Campaign = Genocide?**

  1.  **Vocab Drag:** Replace "genocide" with "extirpation," "destruction," "expulsion," or "mass killing." Does the core argument (deliberate, systematic destruction of a group) collapse? *Probably Not*. 18th-century actors understood deliberate mass killing/removal of ethnic groups. **Yes/Proceed.**
  2.  **Exp/Eval Firewall:** Does the paper *explain* the governor's actions using 18th-century motives (land acquisition, security fears, racial ideologies of the time) *separately* from labeling it genocide? Or does calling it "genocide" *substitute* for explaining his contemporary reasoning? **Likely Fails Here (No).** Most undergrad papers use "genocide" as the explanation itself. **Stop. Flag Presentist Conflation.**
      *   *Margin Comment:* "The term 'genocide' carries immense moral weight, but it doesn't automatically *explain* why the governor acted. You need to show, using sources reflecting *his* context and motives (fear, land hunger, contemporary racial views?), *why* he pursued these brutal policies. Avoid letting the modern label do the explanatory work. Separate the historical explanation from the modern evaluation."

  **(b) 18th-Century Food Rioter = Redistributive Justice?**

  1.  **Vocab Drag:** Replace "redistributive justice" with "enforcing the moral economy," "demanding fair price/access," "traditional right to subsistence," "popular price-setting." Does the core argument (rioters acted on a coherent belief about economic fairness/community rights) collapse? *Probably Not*. Historians like E.P. Thompson have shown these concepts were active. "Redistributive justice" is modern jargon, but the *underlying claim about motive* survives translation. **Yes/Proceed.**
  2.  **Exp/Eval Firewall:** Does the paper *explain* the rioter's actions using 18th-century concepts of the "moral economy," customary rights, community obligation? Does it then *separately evaluate* this as an early form of "redistributive justice"? **Likely Passes (Yes).** The key is using historical context to explain *their* reasoning first.
  3.  **Silence Laundering:** Is the paper claiming the *absence* of the term proves something? Unlikely in this positive argument. **Yes/Proceed.**
  4.  **Reciprocity (🟡):** Does the paper acknowledge it's applying a modern framework ("redistributive justice") to understand past actions? Does it feel reflective, or does it present the rioters as fully conscious 21st-century social justice warriors? **Likely Needs Nuance (🟡).** If it implies the rioters *conceived* of their actions in fully modern "redistributive justice" terms, that's drag. If it uses the term as *our analytical lens* on their *historically-grounded* motives, it's likely okay.
      *   *Margin Comment (Assuming it passes firewall but needs reciprocity tweak):* "You effectively ground the rioters' actions in 18th-century concepts like the 'moral economy'. Be careful that the term 'redistributive justice' functions as *our analytical category* to understand the *implications* of their actions, not necessarily how they conceived it themselves. A phrase like 'actions we might now see as a form of redistributive justice' or 'practicing what amounted to...' clarifies this analytical move and shows awareness of historical distance."

  **(c) No Moral Language - "We Weren't There"**

  1.  **Vocab Drag:** N/A. Actively avoids modern moral terms. **Yes/Proceed.**
  2.  **Exp/Eval Firewall:** Avoids evaluation entirely. Only attempts explanation. **Yes/Proceed.**
  3.  **Silence Laundering:** Not applicable (no argument from silence about modern categories). **Yes/Proceed.**
  4.  **Reciprocity (🟡):** Takes the reciprocity concern to its extreme conclusion (no judgment possible). This is a legitimate *choice*, but potentially limiting.
      *   *Margin Comment:* "You successfully avoid anachronistic moral judgments by focusing on historical context and explanation. This is a valid and often safer approach. However, consider whether *complete* avoidance of evaluation might sidestep important questions historians engage with: Can we analyze the *structural consequences* of past actions using modern tools? Can we trace the *genealogy* of our own values? While judgment isn't mandatory, understand that some historical analysis responsibly incorporates evaluation. Your stance is defensible, but be aware of its limits."

  **Key Takeaways for You:**

  *   **Your Judgment IS the Tool:** Steps 1 (Unclear), 4, and aspects of 2/3 *require* your historical sensibility. The checklist makes the *grounds* for your judgment explicit and defensible ("I flagged this because the modern term is doing the explanatory work your historical evidence should be doing").
  *   **Defensibility:** The procedure forces students to engage with *specific mechanisms* of presentism (vocab drag, conflation, laundering) rather than vague "vibes." You can point to *which step* triggered the concern.
  *   **Efficiency:** Focuses your attention on the highest-risk areas first. A "No" at Step 1 or 2 means you can often stop reading closely for presentism issues (though note others if glaring).
  *   **Teaching Tool:** Frame feedback using the steps: "When you used term X, I applied the Vocabulary Drag Test...", "The Explanation/Evaluation Firewall is breached here because...".
  *   **Honesty:** The procedure explicitly flags where your judgment is essential (🟡). It doesn't eliminate subjectivity; it structures and justifies it using common historical reasoning pitfalls.

  This turns "vibes" into a replicable, explainable process rooted in how historical time and language work, giving you concrete reasons beyond "whiggishness" when students push back.
