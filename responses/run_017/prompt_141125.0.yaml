prompt: |-
  Hey — I want you to work as a professional philosopher who specialises in early modern philosophy and the epistemology of testimony. Take your time with this one: before you commit to anything, brainstorm three or four candidate principles and the cases that kill them, then throw away all but one. I want the principle you actually endorse, not a menu of options with the choice left to me.

  I've been re-teaching Hume's chapter on miracles (section X of the 1748 Enquiry, the one censorship made publishers quietly drop) and I've noticed I can't tell my students what I actually think, only what Hume thinks. The part I keep repeating is his maxim, paraphrased: no testimony is enough to establish a miracle unless the falsehood of that testimony would be a bigger marvel than the miracle itself. Plus the supporting bits — witnesses are never numerous or educated enough, people love the marvellous, miracle stories flourish among ignorant nations, and rival traditions cancel each other out. Fine. But when I try to apply the maxim to actual cases my gut gives verdicts I can't unify, and I'd like you to find the principle behind them. Here are my verdicts, in my own words:

  1. A single continuous high-resolution recording, forensically unbroken, of an amputated leg regrowing over four hours in a hospital, with forty staff present and the leg still there afterwards. I'd accept that something happened that current biology can't account for. But I notice I want to say "our biology was wrong" rather than "a law of nature was violated," and I suspect that move is a dodge.

  2. Tens of thousands of pilgrims at a shrine, all expecting something, all saying the sun moved, and describing what they saw differently from each other. Worth next to nothing as far as I'm concerned.

  3. Twelve sober, educated, mutually hostile witnesses to an executed man walking around three days later; no shared source, nothing to gain, several tortured without recanting. Here's my problem: if you tell me this happened last week in my city I'd be genuinely shaken, and if you tell me it's in an ancient source I'm completely cold. I don't think that difference should be doing any work, but it is.

  4. A coin, tested beforehand, flipped by a machine in front of statisticians, comes up heads three hundred times in a row. I'd bet on rigging. But if I'm forced: I'd say something wildly improbable happened, and I also don't think this is a miracle in Hume's sense at all — so I don't know whether his argument has anything to say about merely statistical regularities.

  5. Two hundred geologists on five continents, with samples, report that every piece of quartz on earth turned blue for an hour. No doctrine attached, no one had a motive. I'd believe this one.

  6. A healing shrine in France with a medical review board: a handful of certified inexplicable cures out of an enormous number of sick visitors. Unimpressed — and I think the huge denominator makes it weaker, not stronger.

  7. A sealed letter from 1919, authenticated by archivists, predicting the exact date and manner of a named person's death in 2024. This moves me far more than 6 does, and I can't cleanly say why.

  8. Equally well-attested miracles at shrines of two different religions. I don't think they cancel each other — that feels like guilt by association — but I do think the pattern tells me something about miracle reports as a class.

  9. A filmed faith healing where nothing visible happens, and believers say the camera can't capture the spirit. I count this as evidence against, not a wash. Failure and success aren't symmetric for me.

  The pair I keep circling on is 6 and 7: both are documented unlikely events, and I treat them oppositely. Number 3's sensitivity to how long ago it happened I suspect is just indefensible.

  Here's my own stab, which I want you to test and repair: take a miracle report seriously only if the probability that a report of exactly this shape would exist given no violation occurred is lower than the probability that the law has an exception — and compute that first probability from the specific causal history of this report, not from a base rate over miracle reports as a class. Is the second clause (the local-only bit) what's making 2 and 3 inconsistent with each other? If you drop it, what happens to 5?

  Two cases I haven't listed, so you can show me what your principle predicts: a big lab team gets a reading that violates conservation of energy, one instrument, never reproducible, nobody ever finds the error — I say instrument error, and I want to know whether your principle lets me say that or forces me to count it. And: in a world where video and audio can be faked perfectly and cheaply, does my verdict on 1 collapse, or should the principle have something timeless to say about recording channels?

  Please also say how "law of nature" has to be understood for any of this to work — strict exceptionless regularity, or statistical — and what breaks on each reading. Don't give me reading suggestions or named scholars to look up; I can't check references from here, so argue it out. Commit: one principle, stated precisely, each clause tied to the case that motivates it, the verdicts on my two unlisted cases, a plain statement of which of my verdicts you think I have to give up and why they're wrong, and one flag on the place where you yourself are least confident.
reasoning: |-
  Okay, the user is a philosophy professor specializing in early modern philosophy and epistemology of testimony, currently teaching Hume's section on miracles. They're struggling to unify their intuitive judgments about various miracle scenarios into a coherent principle. They've provided nine specific cases where their gut reactions conflict with Hume's maxim, and two additional test cases. Their proposed principle involves comparing the probability of the report existing without a violation versus the probability of a law's exception, calculated from the specific causal history of the report.

  Hmm, this is a deep epistemological challenge. The user clearly knows Hume inside out but finds their own intuitions pulling in different directions. What's interesting is how their reactions vary based on factors Hume didn't emphasize: technological mediation (case 1), temporal proximity (case 3), statistical vs. absolute violations (case 4), and evidentiary silence (case 9). Their confession about case 3's temporal sensitivity being "indefensible" shows intellectual honesty.

  The core tension seems to be between two approaches to testimony evaluation: Hume's comparative marvel framework versus the user's instinct toward localized causal analysis. Their proposed principle leans toward the latter but needs refinement. I notice they're particularly troubled by the disparity between cases 6 (unimpressed by healing shrine) and 7 (moved by predictive letter), which both involve documented unlikely events but trigger opposite reactions.

  For the law of nature question: if we define it strictly as exceptionless regularity, case 4 (300 heads) becomes problematic because it's probabilistically improbable but doesn't violate any physical law. If we use statistical regularity, then case 4 would count as miraculous but that feels wrong. The solution might be to distinguish between singular violations and statistical anomalies.

  The user's two test cases are clever: the unreproducible lab result probes how we handle persistent anomalies without clear errors, while the perfect forgery scenario tests whether evidentiary value depends on the technological context. These cut to the heart of whether testimony evaluation should be context-sensitive or timeless.

  Their proposed principle has merit but needs tightening. The "exactly this shape" requirement is too vague - does it include irrelevant details? And "probability of law having an exception" is problematic if laws are exceptionless by definition. The local-only clause explains their differing reactions to cases 2 (mass vision) and 3 (hostile witnesses), but makes case 5 (global quartz change) tricky without reference to base rates.

  I think we need to reframe the principle around what I'll call "causal specificity" - how narrowly the evidence points to a specific physical event rather than alternative explanations. This handles case 1 (leg regrowth) because the recording and physical evidence create high specificity, while case 2 (moving sun) has low specificity due to conflicting descriptions. Case 7 (predictive letter) has higher specificity than case 6 (healing shrine) because the letter's content is uniquely improbable.

  For their test cases: the lab instrument reading gets dismissed because the causal chain likely includes undetected error factors, while in the perfect forgery world, case 1 would indeed collapse because the recording loses its specificity - unless supplemented by physical evidence like the regenerated leg.

  The user might need to reconsider case 3 (ancient resurrection reports). Their temporal bias isn't wholly indefensible - ancient chains of testimony have more potential degradation points - but isn't captured well in the principle. Case 8 (rival miracles) also needs adjustment: while not direct cancellation, multiple incompatible miracle claims do undermine the reliability of the category.

  My weakest point? Handling case 4 (300 heads). If we define miracles as violations of physical laws, this isn't one - but if we define them as maximally improbable events, it is. I think we must exclude merely statistical anomalies from "miracles" proper, but that boundary is fuzzy.
answer: |-
  Here's a single, unified principle derived from your verdicts, tested against your cases, and committed to without hedging:

  **Principle:** Accept testimony for a purported violation of natural law *only if* the evidence demonstrates **causal specificity** – meaning the testimony's content, form, and chain of custody *specifically necessitate* a physical event incompatible with current scientific understanding, while simultaneously *ruling out* plausible alternative causal pathways (error, fraud, coincidence, misinterpretation) *to a higher degree* than it necessitates the law's violation. The improbability of the *report itself existing in this precise form* given normal operations must be greater than the improbability of the law being violated.

  **Breakdown & Motivation (Clause by Clause, Case by Case):**

  1.  **"Causal Specificity" (Content, Form, Chain of Custody):** The evidence must uniquely point to a *specific physical event*. This kills reports relying on subjective interpretation (Case 2: Pilgrims' varied descriptions of the sun moving), ambiguous outcomes (Case 6: "Inexplicable" cures among thousands - huge denominator makes coincidence *more* plausible, not less; Case 9: Failed healing + excuse = evidence *for* the "nothing happened" pathway), or events tied to doctrine/motive (Case 3 (Ancient): Chain of custody/documentary noise overwhelms specificity). Case 1 (Leg regrowth) nails specificity: continuous recording + physical residue + controlled environment uniquely demands a novel biological event. Case 5 (Global quartz) does too: widespread, simultaneous, specific physical change reported by experts with samples. Case 7 (Predictive letter) has high specificity: unique, dated, verifiable prediction requires *either* genuine precognition *or* an elaborate hoax spanning 105 years – the report's *exact form* is highly improbable without a violation or fraud.

  2.  **"Specifically Necessitate... Incompatible Event":** The event described *must* conflict with core, well-established laws (e.g., conservation of mass/energy, thermodynamics, death being permanent), not just statistical norms or incomplete models. This handles Case 4 (300 heads): It's wildly improbable, but doesn't violate a fundamental law (coins *can* land heads; improbable != impossible). Hume's argument primarily targets *violations*, not improbabilities. Your instinct ("not a miracle in Hume's sense") is correct. Case 1 necessitates a biological event incompatible with current understanding of regeneration.

  3.  **"Simultaneously Ruling Out Plausible Alternatives":** The evidence must actively *disconfirm* other explanations (error, fraud, coincidence, misinterpretation) better than it confirms the violation. Case 2 fails: Mass hysteria/expectation explains the reports better than the sun moving. Case 3 (Modern) *might* seem to rule out alternatives (hostile witnesses, torture, nothing to gain) – but see "Chain of Custody" below. Case 6 fails: Coincidence/remission is a vastly more plausible pathway given the denominator. Case 7 *partially* rules out alternatives: Hoax requires extreme long-term secrecy/complexity; coincidence is impossible given the exact prediction. Case 9 actively *supports* the "nothing happened" alternative.

  4.  **"To a higher degree than it necessitates the law's violation":** This is the core Bayesian weighting Hume gestured at, but made causal/historical. We compare the probability of *this exact report existing* given normal causes (including all the ways reports get distorted/created) vs. given an actual violation. Case 3 (Ancient) fails: The probability of legendary development/motivated storytelling/transmission errors over centuries generating such a report *about* a resurrection is *higher* than the probability of resurrection itself, given the lack of direct, causally-specific evidence *now*. Case 3 (Modern) *challenges* this – the *immediate* report seems highly improbable without the event. This hinges on "Chain of Custody".

  5.  **"Chain of Custody" (Implied in "Causal Specificity"):** This is the **crucial "local-only" clause** you identified. We assess the probability of the report existing *based on its specific pathway to us*. Case 3 (Modern vs. Ancient): The difference *is* justified. A modern report from known, credible, hostile witnesses with immediate investigation has a *far lower* probability of arising from error/fraud/legend than an ancient report passed through multiple hands, cultures, and motivations before being written down decades later. The ancient chain introduces massive noise. Case 5 survives: The direct, simultaneous reports from experts with physical samples have a strong chain minimizing noise. **Dropping this clause kills Case 5** – base rates of false reports *would* make even this seem implausible. Case 8 (Rival Miracles): Doesn't cancel the *specific event* claimed by each, but *does* dramatically increase the base rate probability of *false or misinterpreted reports arising* (supporting alternative pathways), making it harder for *any specific one* to achieve causal specificity. It tells us about the *class* by showing how easily such reports can be generated *without* violations.

  **"Law of Nature":** Must be understood as **strict exceptionless regularity** for Hume's core argument (and this principle) to apply directly. These are the "firm and unalterable experience" foundations. Statistical regularities (like coin flips) are different; violating them is improbable, not impossible. What "breaks":
  *   **Strict Reading:** Works for Cases 1, 2, 3, 5, 6, 7, 8, 9. Explains why Case 4 isn't covered. The challenge is defining the "law" precisely enough (Is "legs don't spontaneously regenerate in 4 hours" a "law"? We treat it as one based on overwhelming evidence).
  *   **Statistical Reading:** Collapses Hume's argument. Any improbable event (Case 4) could potentially count as a "miracle" if improbable *enough*. This loses the distinction between *violation* and *rarity* that drives your verdicts (esp. Case 4 vs. Case 1). It makes establishing a miracle far too easy.

  **Your Test Cases - Predictions:**

  1.  **Lab Team / Conservation Violation (One-off, unreproducible, no error found):** **Reject.** Your verdict (instrument error) stands. *Why:* Lacks causal specificity.
      *   The report ("instrument showed violation") has *multiple* highly plausible alternative pathways: Undetected instrument error, calibration drift, software glitch, unknown local interference.
      *   The chain of custody (single instrument, one-off) doesn't rule these out. Non-reproducibility *strongly supports* an alternative explanation.
      *   The probability of *this report* (a single anomalous blip) arising from error is *far higher* than the probability of conservation of energy failing once and never again, especially with no tangible physical consequence beyond the reading.

  2.  **Perfect Forgery World / Case 1 Collapse?:** **Your verdict on Case 1 collapses.** *Why:* The principle is **not timeless**; it depends on the **actual epistemic context**, including available technology.
      *   In a world where video/audio can be *perfectly and cheaply* faked, the "continuous high-resolution recording" loses *all* causal specificity for proving a physical event.
      *   The plausible alternative pathway (fraud) becomes *overwhelmingly probable*. The report's existence in that form is *easily* explained without a miraculous event.
      *   The physical evidence (the regenerated leg, staff presence) gains *relative* weight, but the core visual evidence is fatally undermined. You'd need overwhelming *independent physical evidence* (e.g., verified DNA/changes in the leg impossible to fake) to regain specificity.

  **Which of Your Verdicts Must Be Given Up (and Why):**

  *   **Case 3 (Ancient): Feeling "Completely Cold" is CORRECT.** Your *guilt* about it is misplaced. The principle justifies the difference from the modern scenario based on the *catastrophic degradation of causal specificity* over centuries of transmission and the high prior probability of legend/myth-making in ancient religious contexts. The report, *as it exists for you today*, has a very high probability of being generated by non-miraculous causes (devotion, storytelling, community formation, textual interpolation). Your gut is epistemically sound here. The temporal distance *is* doing legitimate work by destroying the chain of custody and enabling alternative causal pathways.
  *   **Case 3 (Modern): Feeling "Genuinely Shaken" is DEFENSIBLE (but fragile).** The principle *allows* for acceptance *if* the immediate investigation confirms the causal specificity: Hostile witnesses, torture, no motive, *and crucially*, immediate physical verification of the man walking around (medical exams, public sightings confirmed by neutral parties, lack of alternative explanation for the empty tomb/crucifixion wounds). However, the *extreme* improbability of resurrection means the bar for ruling out *all* alternatives (elaborate conspiracy, mass hallucination, mistaken identity) is astronomically high. Your "shaken" feeling reflects the *initial* high improbability of the report existing without the event, but definitive acceptance would require near-impossible levels of specificity to rule out all other paths *more conclusively* than the violation itself. It sits right on the knife-edge.

  **Flagging My Least Confident Point:**

  The **threshold for "ruling out plausible alternatives *to a higher degree* than it necessitates the violation"** is inherently vague and context-dependent. Quantifying "degree" here is impossible. Case 7 (Predictive letter) illustrates this: Is the complexity of a perfect 105-year hoax *less* probable than genuine precognition? Both seem fantastically improbable. My principle *says* the report's specific form necessitates accepting one or the other, but *choosing between them* based *only* on the evidence described is precarious. Does the lack of discovered fraud *over decades* slightly favor precognition? Does the *existence* of fraud throughout history favor hoax? This comparative judgment is the murkiest part of applying the principle, relying heavily on background knowledge and subjective weightings of "plausibility" for wildly implausible things. It's the hinge where epistemology meets messy reality.
