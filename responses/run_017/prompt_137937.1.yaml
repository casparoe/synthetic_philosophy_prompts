prompt: |-
  Hey, hoping you can help me think something through. I'm a volunteer on the steering committee of one of those neighborhood assembly things my city runs — residents deliberate on a topic for six Saturdays and we put out a report that goes to the council, and this year it also goes onto the ballot as an official recommendation. Our written guidance is basically one vague sentence about reasons needing to be ones other participants can engage with and answer, so all the actual content lives in the precedents we've built up, and I've been going through them because we have to rule on a new submission next weekend and I genuinely can't tell what we've been doing. My roommate, who's in a political theory PhD program, says we're obviously running a two-tier Rawlsian thing where faith is fine in the room but can't appear as a reason in the official output; another member says we're really just striking arguments that punch down, religious or not.

  The precedents, roughly: (1) on a homeless shelter siting, someone argued the city owes shelter to everyone because every person bears the image of God and nobody is disposable — no scripture, no secular backup — and we let that into the report, although two of us grumbled; (2) a Quaker argued for funding a mental health crisis team instead of more police, citing the peace testimony and also giving secular reasons about response times and cost, and we let the whole thing stand in the room but the report carried only the secular reasons; (3) an evangelical guy opposed a safe consumption site, citing a New Testament verse about the body being a temple and saying users were desecrating what God gave them, and offered nothing secular — we let him say it in the small group as his position, but we struck it as a reason from the report; (4) during a row over an LGBTQ-inclusive curriculum, someone said scripture plainly condemns homosexual acts and the city should say so, and he did bring secular arguments about parental choice and age-appropriateness but said they were fine but secondary — we told him he could state his opposition and could use the parental-choice argument, but not that reason, in any forum we convene, and we did let a secular parent make basically the parental-choice argument in the report; (5) a pastor arguing for tenant legal aid quoted Exodus and Amos about oppression and also gave a secular argument about eviction costs, and we kept the substance in the report but trimmed the chapter and verse; (6) on encampments, a resident argued unhoused people should be moved out of the city because they've chosen to live like animals and the rest of us shouldn't have to pay — completely secular — and we struck that everywhere.

  New case: we're finalizing the report on a ballot measure to scrap a planned jail expansion and fund community mental health and housing programs instead, and the imam of a local mosque wants his reasoning in the official recommendation. He has a strong secular case — recidivism data, cost per bed, the usual — but he also wants the report to cite Qur'anic passages about the community's duty to debtors, strangers and the sick, to describe people in the jail as our brothers and sisters rather than refuse, and to include a sentence saying the city stands under God's judgment for how it treats the people it locks up. So: lay out the candidate rules that fit our track record — more than the two we've been arguing about, please, I want at least three or four — and say what each predicts about his submission, ideally seperately for the secular case, the scripture citations, the brothers-and-sisters framing, and the God's-judgment sentence. Then give me your best guess at what we will in fact do given how we've behaved, and seperately what we should do if we want to be consistent with ourselves, since I suspect those come apart. Tell me which precedent is the closest analog and why the others are distinguishable, and if our precedents genuinely underdetermine it, spell out what we'd be committing to with each choice — I care alot about what we're signing up for the next time somebody cites a text on the other side. And name the one further case that would actually tell these rules apart, if there is one; also feel free to tell me we've just been inconsistent and there's no rule to be found. Our funders are a UK foundation, so the writeup has to be in British English — thanks!
reasoning: |-
  Okay, the user is part of a neighborhood assembly steering committee and needs help figuring out their precedent-based approach to handling religious reasoning in official reports. They've provided several past cases and a new submission from an imam regarding a jail expansion ballot measure. 

  First, I need to unpack their precedents systematically. The six cases show a pattern: 
  - Arguments using religious language for inclusive ends (homeless shelter, tenant aid) were permitted with some editing. 
  - Religious arguments paired with secular reasoning were accepted only in secular form in reports. 
  - Exclusively religious reasoning or dehumanizing language was rejected. 
  - Crucially, tone and framing mattered - the "image of God" phrasing was allowed while "body as temple" condemnation wasn't.

  For the imam's submission, there are multiple components to evaluate separately: 
  1. The strong secular case (clearly acceptable) 
  2. Qur'anic citations about community duty (similar to pastor's Exodus/Amos - likely editable) 
  3. "Brothers and sisters" framing (close to "image of God" - probably acceptable) 
  4. "God's judgment" phrasing (problematic like "body as temple" condemnation)

  The closest precedent is actually the Quaker case (#2) - religious motivation acknowledged but only secular reasoning in report. The key distinction from "image of God" (#1) is the judgmental tone in "God's judgment" that could alienate non-believers.

  If I were advising them, I'd note their inconsistency around positive religious framing versus judgmental language. For consistency, they should permit the inclusive phrasing but require secular translation for scripture citations and omit the judgment sentence. This maintains their apparent principle: religious motivation can inspire but not replace public reasoning.

  The unresolved tension is whether religious framing can ever stand alone without secular equivalents. A future test case would be someone using exclusively positive religious language (like #1) with no secular backup - which would force them to choose between Rawlsian neutrality and their own "image of God" precedent.
answer: |-
  Here's a systematic breakdown of your precedents, candidate rules, and application to the imam's submission, following your requested structure and British English:

  ---

  ### **Candidate Rules from Precedents**
  1. **Inclusive Framing Principle**  
     Religious language is permitted *only* when it universalises human dignity ("image of God") or solidarity ("brothers/sisters"), and never when it implies moral condemnation ("desecration," "condemns acts").  

  2. **Neutrality/Secular Translation Principle**  
     Religious reasoning may inspire arguments but must be fully translatable into secular terms for the report. Scripture citations are redacted, but *motivations* grounded in shared ethics (e.g., anti-oppression) can stay if rephrased neutrally.  

  3. **Anti-Discrimination Principle**  
     Any reasoning that "punches down" (dehumanises, excludes, or targets marginalised groups) is barred, regardless of religious or secular origin.  

  4. **Pragmatic Hybrid Approach**  
     Religious language is edited case-by-case: allowed if it aligns with secular policy goals and avoids proselytising, but removed if divisive or redundant to secular arguments.  

  ---

  ### **Predictions for Imam's Submission**  
  | **Component**              | **Inclusive Framing**       | **Neutrality Principle** | **Anti-Discrimination** | **Pragmatic Hybrid**        |  
  |----------------------------|------------------------------|---------------------------|--------------------------|------------------------------|  
  | **Secular case**           | Accepted                     | Accepted                 | Accepted                | Accepted                     |  
  | **Qur’anic citations**     | Rejected (not universal)     | **Struck** (direct cites)| Accepted (non-harmful)  | **Trimmed** (redundant)      |  
  | **"Brothers/sisters"**     | **Accepted** (universal)     | Edited to neutral (e.g., "fellow residents") | Accepted                | **Accepted** (adds empathy)  |  
  | **"God’s judgment"**       | **Rejected** (condemnatory)  | **Struck** (non-secular) | Accepted? (contextual)  | **Rejected** (divisive)      |  

  ---

  ### **Analysis of Precedents**  
  - **Closest Analog**: **Case #5 (Pastor quoting Exodus/Amos)**.  
    - *Why?* Both involve scripture cited alongside secular policy arguments about social justice. Your committee retained the *substance* (anti-oppression) but removed chapter/verse.  
  - **Distinctions**:  
    - *Case #1 ("Image of God")*: Allowed due to universal human dignity framing. Imam’s "brothers/sisters" is comparable; "God’s judgment" is not.  
    - *Case #2 (Quaker)*: Secular reasons carried; religious motivation was auxiliary. Imam’s secular case is robust, but his scripture cites are primary here.  
    - *Case #3 ("Body as temple")*: Struck for condemnation + no secular backup. Parallels "God’s judgment" phrasing.  
    - *Case #4 (Scripture condemns acts)*: Struck for targeting a group. Imam’s language doesn’t target.  
    - *Case #6 ("Live like animals")*: Struck for dehumanisation. Not relevant here.  

  ---

  ### **What You Will Likely Do (Based on Past Behaviour)**  
  - **Accept**: Secular case, "brothers/sisters" framing (treated like "image of God").  
  - **Trim**: Qur’anic citations to general "moral duty" (like Exodus/Amos editing).  
  - **Reject**: "God’s judgment" sentence (like "body as temple" for condemnatory tone).  
    *Why?* Your committee consistently permits *affirming* religious framing but rejects judgmental language and direct scripture.  

  ### **What You *Should* Do for Consistency**  
  1. **Keep**: Secular arguments + "brothers/sisters" phrasing (universal dignity, per #1).  
  2. **Edit**: Qur’anic citations to "many faith traditions emphasise duty to the vulnerable" (neutral translation, per #2 & #5).  
  3. **Remove**: "God’s judgment" (condemnatory like #3, redundant to secular case).  
     *Rationale*: Aligns with the **Neutrality Principle** and **Inclusive Framing**, avoiding privileging one faith while acknowledging inspiration.  

  ---

  ### **Commitment Implications**  
  - **If you permit "God’s judgment"**:  
    You commit to allowing faith-based *condemnation* in future (e.g., "God condemns prison reform as coddling sinners").  
  - **If you reject "brothers/sisters"**:  
    You retreat from #1 ("image of God"), implying only secular language is valid—contradicting your record.  
  - **If you keep direct citations**:  
    Future submissions must be allowed equally (e.g., Biblical verses against LGBTQ rights).  

  ---

  ### **Test Case to Resolve Ambiguity**  
  A submission stating:  
  > *"We must fund disability services because all humans are intrinsically valuable as God’s creations, though secular cost-benefit analysis also supports this."*  
  - **Rules would diverge on**:  
    - *Inclusive Framing*: Accepts "God’s creations" (universal dignity).  
    - *Neutrality Principle*: Strikes "God’s creations," keeps cost-benefit.  
    - *Anti-Discrimination*: Accepts (no harm).  
    - *Pragmatic Hybrid*: Keeps "intrinsically valuable" but removes "God’s creations."  

  ---

  ### **Conclusion**  
  Your precedents **are not inconsistent** but reveal an unstated **Inclusive Neutrality** standard: religious language may *motivate* and *frame* (if universally affirming), but secular reasoning must bear the argumentative weight. **Recommendation**: Accept the imam’s secular case and "brothers/sisters" framing, edit scripture to neutral values, and remove "God’s judgment" to avoid future entanglement with condemnatory religious rhetoric. This balances pluralism, consistency, and public reason.  

  ---  
  **Final Note**: If pressed, cite the UK funder’s likely expectation of *procedural secularism* (à la British public policy) without excluding faith-inspired contributions. Precedent #5 is your safest template.
