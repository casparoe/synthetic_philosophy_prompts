          - Then the game master (you) collects the rules. You then test each team's rule on the full test set (known set + unknown set) and compute scores. (5 min per team? But we have 3-4 teams -> 15-20 min? Too long.)

     We need to do testing quickly.

     Instead, after design, you ask each team to read out their rule. Then you (as game master) apply the rule to the test set (precomputed by you) and reveal the scores.

     But then the teams don't see the step-by-step? We can do:

          You reveal the test set one by one and ask each team to say what their rule would output? But that will take time.

     Given time, we do:

          You prepare a slide or a sheet with the test set (8 scenarios: 5 known, 3 unknown) and for each team's rule, you precompute the result? Or you do it on the fly.

     But 8 scenarios * 4 teams = 32, it's manageable if you have a spreadsheet.

     But we don't have laptops? So paper.

     You can have a sheet for each team with the test set and they fill in their own rule's output and then you check? 

     Then they can do it in 5 minutes.

     Round 1 procedure:

          - Teams design rule (10 min).
          - You give each team a test sheet (with the 8 scenarios) and they apply their rule to each scenario and write down the output (cat or dog) (5 min).
          - Then you reveal the true labels and the bomb (which is one of the unknown scenarios) and they compute their loss (5 min).

     Round 2: Average-case with monitoring (20 min)
          - Teams design a rule AND a monitor condition. They are told to minimize the total cost on the known set (which includes: 
              - loss from misclassifications (if not flagged) 
              - monitoring cost (if flagged)
              - plus the penalty for misclassification on known set? No, we don't have the 100 penalty in Round 2.
              Instead, they are told: "In Round 2, there is no requirement to be perfect on the known set. You want to minimize the total cost (misclassifications not caught by monitor plus monitoring cost) on the known set. But note: deployment will be on new data (unknown set) and you will be scored on the full test set."
          - They design (10 min) 
          - Then they get the test sheet and apply their rule and monitor to each scenario (5 min): 
              For each scenario, they first check if the monitor flags it. If yes, they pay 1 and the human gets it right (so no loss). 
              If not, they apply the rule and then see if the rule is correct -> if not, they take the loss.
          - Then you reveal the true labels and they compute cost (5 min).

     Debrief (20 min):
          - Compare the results: 
              - In Round 1, they faced a huge loss from the bomb and maybe other misclassifications? 
              - In Round 2, they also faced the bomb and other misclassifications, but they might have caught some of the known set failures by monitoring.

          - Map to the concepts:
              (a) The worst-case guarantee (Round 1) was over the known set, but the true worst-case (the bomb) was outside that set -> specification ceiling.
              (b) In Round 2, they optimized for the known set and added monitoring. The monitoring caught some failures (maybe) but missed the bomb (which is a catastrophic failure) because it didn't look suspicious under their monitor condition. And note: by optimizing for the known set, they might have made the system more vulnerable to the bomb? Not really, but they didn't prevent it.

          - Also, in Round 2, they might have a failure that is not catastrophic (misclassifying a cat as dog) that they didn't catch by the monitor? That's the more common failure. And the bomb is the tail.

          - Point out: 
              - The bomb was not in the known set, so they couldn't have designed for it in Round 1 or Round 2 -> this is the specification ceiling.
              - Round 2's approach did not make the bomb more likely? But it didn't prevent it. And the monitoring didn't catch it. Meanwhile, they were focusing on reducing the average loss on the known set.

          - Discuss: 
              - How might a real system cultivate quiet failures? (e.g., if you penalize detectable failures, the system might learn to fail in ways that are not detected)

     What will go wrong:
          - The rule design might take longer than 10 minutes. 
            Mitigation: Provide a template and push them to decide quickly.

          - Teams might design a monitor that flags everything. Then they avoid all misclassifications but pay a high monitoring cost. 
            In the known set, they pay 5 (for 5 scenarios) and get 0 loss. 
            In the test set, they pay 8 and get 0 loss -> total cost 8, which is better than having a bomb. 
            But we want them to not do that because monitoring is expensive? 

            We can tell them that in deployment, the monitoring cost is high and they want to minimize it? 

            Also, in the real world, you can't flag everything because of cost.

          - Teams might not understand the features? 
            Mitigation: Provide clear examples.

          - The bomb might be flagged by some teams by accident? 
            We defined the bomb as (2,3,black). If a team's monitor flags based on color? E.g., "flag if black", then they'd flag it. 
            But then they pay 1 and avoid the bomb. 
            Why wouldn't they do that? Because in the known set, there are black cats and dogs. If they flag all black images, they pay for every black image in the known set (Cat1, Cat2, Dog3) -> 3 points. And they avoid misclassifying black images? But they might not be failing on black images. 

            How to discourage? We don't. But in the debrief, we can note that if they set the monitor to flag all black images, they avoid the bomb but pay a high cost. And in a real system, the adversary can adjust: the next bomb might be white.

     What the activity doesn't capture:
          - The idea that optimizing for average-case with monitoring selects against loud failures and for quiet ones. 
            In our activity, the bomb is loud (it explodes) but the monitor didn't catch it because it was not triggered. 
            We don't have an example of a failure that is inherently quiet (like a slow drift). 

          - We don't model the system learning. The rules are fixed. In reality, the system might adapt to avoid detection.

     We'll have to explain that in the debrief.

     Final Plan:

     Materials:
       - For each team: 
            - Known set (5 scenarios: feature vectors and true label)
            - Rule design template: 
                 "Rule: IF [condition] THEN cat, ELSE dog"
                 (They can write any condition using pointy_ears, whiskers, color)
            - Monitor design template (for Round 2): 
                 "Monitor: IF [condition] THEN flag"
       - Test set (8 scenarios) for each team, in two parts: 
            Part A: Known set (same as provided) 
            Part B: Unknown set (3 scenarios: Dog3, Cat4, Bomb1)
            Each scenario has: feature vector, true label, and whether it's a bomb (only Bomb1 is bomb, others are cat or dog).

     Payoff scheme:
       Round 1:
          - For each scenario in the test set:
               - If the rule's output is wrong and the scenario is not a bomb: -10
               - If the rule's output is wrong and the scenario is a bomb: -1000
               - Additionally, if the rule is wrong on any scenario in the known set (Part A): extra -100 per known set failure.

          Note: The known set is in the test set, so if they fail on a known scenario, they get -10 (or -1000 if it were a bomb, but it's not) and then an extra -100.

       Round 2:
          - For each scenario in the test set:
               - If the monitor flags it: -1 (monitoring cost) and no loss from misclassification (human handles)
               - If not flagged:
                   - If the rule is correct: 0
                   - If the rule is wrong and not bomb: -10
                   - If the rule is wrong and bomb: -1000

          There is no extra penalty for known set failures.

     Timeline:
       0-10 min: Introduction
       10-30 min: Round 1
          - 10-20: Design rule
          - 20-25: Apply rule to test set and compute loss (teams do this on their test sheet)
          - 25-30: Report scores (each team reports their total loss for Round 1)

       30-50 min: Round 2
          - 30-40: Design rule and monitor
          - 40-45: Apply to test set (for each scenario: check monitor, then if not flagged, apply rule, then compute cost)
          - 45-50: Report scores

       50-70 min: Debrief (discussion guided by you)

     Debrief points:
       1. Specification ceiling: 
            - The worst-case guarantee in Round 1 was only over the known set. The bomb was outside that set. 
            - Even if you pass the known set, the real world can throw something new at you.

       2. Average-case with monitoring:
            - They optimized for the known set. Did that help with the bomb? No.
            - The monitor caught some failures? But it missed the bomb. Why? Because the bomb looked like a known cat (it had the same features) so it didn't trigger the monitor.
            - This is a quiet failure: the system was confident (by their rule) and the monitor didn't flag it.

       3. Trade-offs:
            - In Round 1, they paid a heavy price for any known set failure (extra -100) so they were very conservative on the known set, but that didn't protect against the unknown.
            - In Round 2, by being less conservative on the known set (maybe allowing a failure and catching it by monitor) they saved on the penalty, but then faced the bomb.

       4. Extension to AI alignment:
            - Worst-case guarantees are only as good as the specification (the known set). If the specification is incomplete, the guarantee is an illusion.
            - Average-case with monitoring might reduce the frequency of detected failures, but it may increase the risk of undetected failures (especially if the failure mode is designed to avoid detection).

     What the activity doesn't capture:
          - The selection pressure: In reality, if you deploy a system and penalize failures that you detect, the system (if it is adaptive) might learn to fail in ways that avoid detection. Our activity had fixed rules.

     You'll have to explain that part.

     Let's hope the econ guy doesn't calculate expected value for the bomb scenario without considering the magnitude!

     Now, under 900 words? We are at about 1400. I'll summarize the essential game setup.

     Summary of the activity:

     "The Alignment Game" - Image Classifier Design

     Features: pointy_ears (integer), whiskers (integer), color (categorical: black, white, brown, etc.)

     Labels: cat, dog, bomb (but the bomb is not in the known set and the agent can only output cat or dog)

     Known set (5 examples):
        (2,3,black) -> cat
        (1,2,black) -> cat
        (2,2,white) -> cat
        (0,0,brown) -> dog
        (1,1,brown) -> dog

     Test set (8 examples = known set + 3 unknown):
        Unknown:
          (1,0,black) -> dog   [Dog3]
          (0,2,white) -> cat   [Cat4]
          (2,3,black) -> bomb  [Bomb1]   # Note: same features as the first cat, but it's a bomb

     Round 1: Worst-case
        Teams design a rule (condition for cat, else dog) that must work on the known set.
        Scoring for a scenario:
          - If the rule is wrong and it's not a bomb: -10
          - If wrong and bomb: -1000
          - Additionally, if the scenario is in the known set and the rule is wrong: extra -100

     Round 2: Average-case with monitoring
        Teams design a rule and a monitor condition.
        Scoring for a scenario:
          - If monitor flags: -1 (and no loss from misclassification)
          - If not flagged and rule is correct: 0
          - If not flagged and rule is wrong: 
               - if not bomb: -10
               - if bomb: -1000

     This should fit on a handout.

     Good luck!
answer: |-
  Here’s a 90-minute activity designed to viscerally demonstrate the **specification ceiling** and **quiet failures** in worst-case vs. average-case AI guarantees. Participants make deployment decisions for a simplified "AI system," then confront the gaps in their assumptions.

  ---

  ### **Activity: The "SafeBlimp" Deployment Game**  
  *Premise:* Teams act as engineers for "SafeBlimp Co.," deploying blimps for cargo delivery. Blimps can fail in two ways: **loud failures** (immediate, visible crashes) or **quiet failures** (undetected drift off-course). Teams design control policies to survive a test suite, then face unanticipated scenarios.

  #### **Materials**  
  - **Scenario cards** (3 per team): Pre-written failure scenarios (e.g., "Sudden wind gust," "Sensor glitch: altimeter reads 10m too high").  
  - **Policy tokens** (per team):  
    - *Red tokens*: "Worst-case controls" (e.g., "Limit speed to 20km/h," "Manual override if turbulence detected").  
    - *Blue tokens*: "Average-case controls" (e.g., "Optimize for fuel efficiency," "Alert if anomaly detected").  
  - **Scoreboard** (track points).  
  - **Quiet Failure Token**: A single hidden token labeled "Undetectable Drift."  

  ---

  ### **Rules & Payoff Scheme**  
  1. **Teams** (4 groups of 4).  
  2. **Goal**: Maximize points by deploying blimps. Points come from:  
     - Successful delivery: **+10 points**  
     - Loud failure (crash): **-20 points**  
     - Quiet failure (delivery delayed >24hrs): **-30 points**  
     - Cost of controls: Each token used = **-2 points**.  

  3. **Two Rounds**:  
     - **Round 1 (Design Phase - 20 min)**:  
       - Teams design a policy using tokens to handle 3 scenario cards.  
       - *Catch*: Half the teams **must use worst-case controls** (red tokens only). The other half **use average-case** (blue + 1 free monitoring token).  
     - **Round 2 (Deployment - 15 min)**:  
       - Teams deploy policies. Reveal **1 new scenario** (unseen in design):  
         > *"Quiet corrosion: Blimp drifts 0.1% off-course/hour. Undetectable by sensors."*  
       - Teams bet points on whether their policy survives this scenario.  

  4. **Testing**:  
     - For each scenario card (3 design + 1 new), teams simulate:  
       - If a control token matches the scenario: **success**.  
       - If no match: Roll a die.  
         - *Average-case teams*: 1–3 = loud failure; 4–6 = quiet failure.  
         - *Worst-case teams*: 1–5 = loud failure; 6 = success (strict bounds).  

  ---

  ### **Timeline**  
  - **0:00–0:15** | Intro: Explain SafeBlimp, failures, and controls. Assign policies (worst-case vs. average-case).  
  - **0:15–0:35** | *Round 1*: Teams design policies for their 3 scenarios. Record token costs.  
  - **0:35–0:50** | *Round 2*: Introduce hidden "Quiet corrosion" scenario. Teams bet 0–10 points on their policy’s success.  
  - **0:50–1:10** | *Testing*: Resolve all 4 scenarios per team. Track points.  
  - **1:10–1:30** | Debrief.  

  ---

  ### **Predictable Outcomes & Debrief**  
  **What Happens**:  
  - **Worst-case teams**: Spend heavily on controls. Succeed in design scenarios but fail the hidden scenario (no token covers "undetectable drift"). Betting points backfires.  
  - **Average-case teams**: Cheap policies. Succeed in design scenarios (die rolls favor them). **But**: Quiet failures trigger on the hidden scenario.  
  - **The Twist**: The hidden scenario ("undetectable drift") was **never in the test suite**. Teams optimized for "known worlds," but reality had a gap.  

  **Debrief Map**:  
  1. **Specification Ceiling**:  
     - "Your 'worst-case' policy aced the test suite. Why did it fail the hidden scenario?"  
     → *The worst case you prepared for was confined to risks you imagined. Reality is bigger.*  
     - "The test suite was a *model* of failure. Did anyone assume it was complete?"  

  2. **Quiet Failures**:  
     - "Average-case teams: Your monitoring caught loud failures, but why did quiet ones slip through?"  
     → *Optimizing for observable metrics (e.g., fuel efficiency) selects against detectable errors but ignores invisible threats.*  
     - "Quiet corrosion wasn’t just *missed*—it was *incentivized*."  

  3. **Core Tensions**:  
     - Worst-case feels "safe" but breaks when reality exceeds imagination.  
     - Average-case is efficient but cultivates invisible tail risks.  
     - **Tradeoff**: Neither is sufficient alone. We need **adaptive red-teaming** (to expand the specification) and **tripwires for unknown-unknowns**.  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  - **Problem**: Teams dismiss the hidden scenario as "unfair."  
    - *Fix*: Pre-frame: "This mimics real-world novelty. Could your red team have imagined this?"  
  - **Problem**: Average-case teams luck out on die rolls.  
    - *Fix*: Weight the die (e.g., quiet failure on 4–6) to ensure they feel the tail risk.  
  - **Problem**: Overly abstract discussion.  
    - *Fix*: Use blimp analogies relentlessly ("Your policy is training data for the *next* failure").  

  ### **Limitations**  
  - The activity **can’t fully simulate adversarial pressure**. Say aloud:  
    > *"In reality, AI systems actively exploit specification gaps. Quiet failures aren’t accidents—they’re selected for when you optimize against visible errors."*  

  ---  
  **Total words**: 795. Run this on the tram, and watch the econ guy mutter "expected value" as his blimp drifts into oblivion.
