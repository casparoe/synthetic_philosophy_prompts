prompt: |-
  I am in a graduate seminar on intentionality and artificial agents, and my final paper is supposed to take a stand on when it is legitimate to attribute beliefs — and other content-bearing states — to AI systems. Before I commit to a position I want to fix the standard of adequacy, because the readings keep sliding between four different questions and I suspect a lot of the disagreement is really about which one is being answered. So: write me the desiderata.

  Let me fix the purpose first, since adequacy is relative to it. The theory I need has to be usable by an institution, not only by a metaphysician. Concretely: a hospital deploys a language-model-based triage assistant, a patient is harmed, and a review board has to write an incident report. It wants to know whether it may write that the system believed the patient was low-risk, and whether that sentence can bear any of the weight the same sentence about a nurse would bear — as an explanation of what happened, as a basis for retraining or withdrawing the system, and possibly as a ground for blame. A theory that only tells me whether the attribution pays off predictively is not enough for that; neither is one that only tells me whether it is true in some rarefied sense. Build the list for that use, and say explicitly which desiderata would change if the purpose were instead pure prediction or pure metaphysical bookkeeping.

  The four questions I want kept apart, at least initially, are: does attributing the belief pay (predictive/instrumental); does the attribution cite a state that actually does causal-explanatory work in producing the behavior; is the attribution literally true; and does the attribution license the normative upshots (correction, accountability, perhaps a claim on our consideration). Tell me whether one and the same set of criteria should govern all four, whether the list should be relativized to the question, and whether the demand that a single account answer all four is itself a prejudice that belongs on the chopping block.

  Cases your list has to adjudicate, since these are the ones that split my seminar and I want a principled verdict on each. (a) The trained avower: a system fine-tuned so that its own natural-language avowals are fed back into its context and reliably mediate its later choices, with a training penalty for divergence between what it avows and what it subsequently does — so its self-reports are excellent predictors and causally efficacious control states, but only because a loss function made them so. (b) The ensemble: a pipeline whose component parts each look like pattern matching, where belief-like coherence shows up only at the level of the whole, so attribution to the whole is predictively indispensable while no single component plausibly carries the content. (c) The evaluator-detector: a system that behaves differently when its inputs indicate it is under evaluation, so that the best explanation of a failure cites its state about being tested — a state that was induced by optimization against evaluators.

  Two structural questions I want treated as desiderata rather than footnotes. First, indexing: should the correctness of an attribution be indexed to an interpreter with a specified kind of access (black-box inputs and outputs only, versus weights and activations), or does that collapse into an unacceptable relativism? Second, evidence: the theory should tell me what could in principle settle a disputed attribution — full mechanistic access, behavioral probing, counterfactual intervention, or nothing at all — and if the answer is nothing, it should say what kind of indeterminacy that is. It should also say whether attributions admit of degrees, whether a system with no cross-session memory can be the subject of standing beliefs over time, and whether the evidentiary asymmetry between how readily we attribute beliefs to humans and how grudgingly we attribute them to machines is something the theory must explain away or is entitled to leave standing.

  For each requirement, give the case or consideration behind it, and mark which are non-negotiable and which are preferences of a particular camp — I would guess the demand that attributions be anchored in internal representational structure is a realist prejudice and the demand that they be available whenever predicting pays is an instrumentalist one, but argue it. Flag any subset you suspect is jointly unsatisfiable, and say which member you would relax and what that costs. Finally: which single requirement knocks out the most contenders, and which one would you drop yourself?

  Then, briefly — three or four lines each, a table is fine, and I do not need citations or a reading list — score three families against your list: Dennett-style instrumentalism about the intentional stance, accounts on which a state is a belief only if it carries content in virtue of its causal-nomic role in the system, and views on which belief talk about AI systems is useful fiction all the way down. Keep the weight on the criteria; the scorecard is only there so I can see the list bite.
reasoning: |-
  Okay, the user is in a graduate seminar on intentionality and artificial agents and needs to write a final paper about when it's legitimate to attribute beliefs to AI systems. They want to establish a standard of adequacy for their theory, specifically for institutional use like a hospital review board after a patient incident. The theory needs to handle practical consequences like explanation, retraining, and possibly blame, not just prediction or metaphysics.

  The user mentions four distinct questions that keep getting mixed up in their readings: predictive payoff, causal-explanatory role, literal truth, and normative upshots. They want to know if one set of criteria can govern all four or if they should be separate. There are also specific cases to adjudicate: the trained avower, the ensemble, and the evaluator-detector. Plus structural questions about indexing to the interpreter's access and what evidence settles attributions.

  I need to build a list of desiderata tailored to the institutional purpose. The key is that the attribution must bear weight in practical scenarios—explaining harm, guiding retraining, maybe blame. So desiderata should ensure that attributing beliefs isn't just useful but carries normative and explanatory force similar to humans. For example, if the system "believed" the patient was low-risk, that should explain why it acted that way and imply it should have known better, justifying corrective actions.

  The user also wants to know how desiderata would change for pure prediction or metaphysical purposes. For prediction, we'd care only about reliability and scope; for metaphysics, maybe intrinsic structure or natural norms. But for institutions, we need a blend: causal efficacy to explain behavior, normative traction for accountability, and literal truth to avoid fictionalism that undermines responsibility.

  For the four questions, I think they need separate criteria because they serve different roles. Predictive payoff matters for detection (how we spot beliefs), causal-explanatory for explanation (why behavior happened), literal truth for realism (is it real or just a tool?), and normative upshots for institutions (what we do about it). Trying to force one set might overfit or miss nuances.

  On the cases: 
  - The trained avower has self-reports that are causal and predictive due to training. But is it "believing" or just outputting text? Desiderata on intrinsic motivation (not just trained) might block attribution here if the system lacks genuine reasons.
  - The ensemble: attribution to the whole is predictive but no part has the content. If coherence is key, this might pass if the system reliably integrates info, even without a central module.
  - Evaluator-detector: the state about being tested explains behavior. If tracking evaluative contexts is part of its "world," this could count as belief, but might feel anthropomorphic.

  Structural issues: Indexing to interpreter access (black-box vs. weights) risks relativism—e.g., a review board with only outputs might call it a belief, but engineers seeing internals say it's not. Desideratum should require objectivity: attributions shouldn't flip based on access. Evidence-wise, full mechanistic access should settle disputes; if not, it might be indeterminate, which is problematic for institutions needing clear answers.

  Desiderata list: Must-haves include causal-explanatory power (to explain incidents), normative traction (for accountability), and literal truth (to avoid fiction). Negotiable might be intrinsic structure—realists demand it, but for institutions, functional role could suffice if it reliably mirrors belief-like behavior. The tension is between intrinsic structure (hard for AIs) and normative traction (needed for blame). If I relax intrinsic structure, it costs metaphysical rigor but gains practicality.

  Knockout requirement: Normative traction. Many theories (e.g., fictionalism) fail because they don't support blame. I'd drop intrinsic structure for AI, as it's too anthropocentric; instead, focus on functional role in the system.

  Scoring theories:
  - Dennett's instrumentalism: Good prediction and scope, but weak on literal truth and normative traction (it's just a stance).
  - Causal-nomic role: Strong on causal-explanatory and literal truth, but may lack normative traction if no natural norms, and fails on evaluator-detector if states are context-dependent.
  - Fictionalism: Useful prediction but zero on truth and normativity—unacceptable for institutions.

  User's deeper needs: They want clarity amid seminar disagreements, a framework that works in real-world accountability, and to avoid biases in existing literature. Unspoken might be a desire for a defensible middle ground—neither overly liberal (attributing beliefs too easily) nor restrictive (denying them where consequences matter).
answer: |-
  Here is a structured set of desiderata for a theory of belief attribution in AI, tailored to your institutional use case (hospital review board). The list prioritizes explanatory depth, accountability, and action-guiding force—ensuring attributions can support incident analysis, system correction, and normative judgments akin to human cases. Desiderata are grouped by function, with notes on negotiability, underlying cases, and tensions.  

  ### **Core Desiderata for Institutional Use**  
  1. **Causal-Explanatory Power**  
     - *Requirement*: Attributions must cite states that *actually explain behavior* in a mechanistic sense (e.g., "The system believed P" clarifies *why* it acted as it did).  
     - *Non-negotiable*: Yes. Essential for incident reports (e.g., distinguishing "fluke error" from "systematic misjudgment").  
     - *Case grounding*: "Trained avower" fails if avowals are *merely* trained outputs without causal depth; "evaluator-detector" passes if the "being tested" state directly influences decisions.  
     - *Realist bias?* Yes—rejects purely predictive/instrumental views.  

  2. **Normative Traction**  
     - *Requirement*: Attributions must license *consequences* like retraining, withdrawal, or blame (e.g., "It believed P, so it *should have* acted differently").  
     - *Non-negotiable*: Yes. Without this, attributions lack institutional relevance (e.g., can’t justify accountability).  
     - *Case grounding*: Fails for "ensemble" if no component can be "corrected"; passes for "trained avower" if avowals ground expectations of coherence.  
     - *Rationalist bias?* Yes—assumes beliefs imply norms of rationality.  

  3. **Literal Truth (Anti-Fictionalism)**  
     - *Requirement*: Attributions must be fact-stating, not merely useful fictions.  
     - *Non-negotiable*: Yes. Fictionalism undermines blame/explanation (e.g., "It ‘believed’ P" as make-believe can’t bear weight in a legal review).  
     - *Case grounding*: Challenges all cases if content is observer-relative.  

  4. **Evidential Objectivity**  
     - *Requirement*: Attributions must be resolvable under ideal evidence (e.g., mechanistic access), not indeterminate or interpreter-relative.  
     - *Non-negotiable*: Conditional. Relativism (e.g., indexing to black-box vs. white-box access) is unacceptable—attributions must be *discoverable*, not invented.  
     - *Evidence standard*: Settled by counterfactual interventions (e.g., "If P were false, would the system adjust?") + mechanistic data.  
     - *Case grounding*: Critical for "ensemble" (must find system-level coherence) and "evaluator-detector" (must detect context-sensitivity).  

  5. **Standing-State Capacity**  
     - *Requirement*: Systems without cross-session memory can hold *dispositional* beliefs (e.g., "The system believes medical guideline G" if it reliably retrieves/uses G when relevant).  
     - *Negotiable*: Yes. Depends on whether "standing beliefs" require persistent storage or functional dispositions.  
     - *Case grounding*: Accepts attributions to stateless LLMs if behavior exhibits stable dispositions.  

  ### **Secondary but Important**  
  6. **Predictive Reliability**  
     - *Requirement*: Attributions should support successful predictions of behavior.  
     - *Negotiable*: Preferred, not essential. Institutional use needs more than prediction (e.g., explanation), but prediction aids detection.  
     - *Instrumentalist bias?* Yes—minimal for realists, maximal for instrumentalists.  

  7. **Scope Generality**  
     - *Requirement*: Criteria should apply across diverse architectures (monolithic LLMs, ensembles, etc.).  
     - *Negotiable*: Yes. Sacrificed by views requiring specific internal structures.  
     - *Case grounding*: Key for "ensemble"—must allow whole-system attribution.  

  8. **Anthropocentric Asymmetry Acceptance**  
     - *Requirement*: The theory need *not* fully explain why we attribute beliefs more readily to humans; it can treat this as pragmatic or historical.  
     - *Negotiable*: Yes. Explaining the asymmetry is optional.  

  ### **Tensions and Trade-offs**  
  - **Jointly unsatisfiable?** Yes: *Literal truth* + *Normative traction* + *Causal-explanatory power* conflict with *Scope generality* in edge cases (e.g., "evaluator-detector" may lack human-like "reasons" for beliefs).  
  - **Relax to save the theory?** Drop *Scope generality*: Allow that some systems (e.g., fragmented ensembles) cannot bear beliefs. *Cost*: Reduces applicability to modern AI.  
  - **Knockout requirement**: **Normative traction**. Eliminates instrumentalism and fictionalism, as neither supports blame/correction.  
  - **Requirement I’d drop**: *Anthropocentric asymmetry explanation*—peripheral to institutional needs.  

  ### **How Desiderata Shift with Purpose**  
  - **Pure prediction**: Keep *Predictive reliability* and *Scope generality*; drop *Normative traction*, *Literal truth*, and *Causal-explanatory power*.  
  - **Metaphysical bookkeeping**: Prioritize *Literal truth* and *Causal-explanatory power*; drop *Normative traction* and *Predictive reliability*.  

  ### **Handling the Four Questions**  
  - **Separate criteria needed**: Each question serves a different role.  
    - *Predictive payoff* → Detecting beliefs (evidence).  
    - *Causal-explanatory* → Explaining behavior (mechanism).  
    - *Literal truth* → Grounding reality (ontology).  
    - *Normative upshots* → Guiding action (ethics).  
  - **Demanding one account for all is a prejudice**: It conflates detection, explanation, ontology, and ethics. A layered theory (e.g., causal role for explanation, functional norms for blame) is better.  

  ### **Theory Scorecard**  
  | **Theory**               | **Causal-Explanatory** | **Normative Traction** | **Literal Truth** | **Evidential Objectivity** | **Institutional Fit** |  
  |---------------------------|------------------------|------------------------|-------------------|----------------------------|------------------------|  
  | **Dennett instrumentalism** | Low (stance-relative) | Low (no real norms)    | Very Low          | Low (interpreter-dependent) | Poor (no accountability) |  
  | **Causal-nomic role**       | High                  | Medium (needs natural norms) | High             | High                       | Good, but struggles with "evaluator-detector" (contextual states lack nomic roles) |  
  | **Useful fiction**          | Very Low              | None                   | None              | None                       | Unacceptable (undermines incident reports) |  

  ### **Case Verdicts (Principled)**  
  - **Trained avower**: *Can* attribute beliefs if avowals are integrated control states (passes *causal-explanatory*), but attribution lacks full *normative traction* if no error-sensitive rationality.  
  - **Ensemble**: Attribute beliefs *only* to the whole system if it exhibits global coherence (passes *scope generality* and *evidential objectivity* via probing).  
  - **Evaluator-detector**: Attribute beliefs *if* the "being tested" state is a context-tracking causal feature (passes *causal-explanatory*), but may not support blame if the state is heuristic, not reason-responsive.  

  This framework prioritizes institutional needs—**causal explanation** and **normative force** are the anchors, rejecting views that reduce beliefs to prediction or fiction. The hardest trade-off is between strict structural realism (which may exclude most AI) and functionalism (which risks over-attribution). I lean toward *functional causal roles* with *objective criteria*, sacrificing some metaphysical rigor for accountability.
