prompt: |-
  I work as an independent pest-management adviser. I walk about forty blocks of cropping a season, and perhaps two dozen times a year I am the person who puts a recommendation in writing — intervene, delay, or hold — usually within a day, for a grower who needs an answer before the weekend and, on the certified blocks, for an auditor who has to be able to defend the decision on paper months later.

  Last night a friend and I argued for hours about whether a single aphid spray is a mass atrocity against animals that may well feel pain or a moral rounding error, and I came away less confident of the answer than of one thing: my own verdict changes depending on which number I happen to look at first — the death toll implied by the treatment, or the fact that in most of these populations nearly every individual that will ever exist dies slowly, of crowding, disease or predation, whether I act or not. So I don't want a verdict on spraying. I want a procedure I can run identically each time, that reduces how much rides on which number I saw first.

  What I need is an ordered set of questions, each with what would count as a good enough answer to move to the next, where the procedure returns a hard no, and — most importantly — where it must stop and hand the decision to a person because the question is one of values rather than facts. It has to be explicit about the baseline, and it must never let the number of animals the treatment kills stand in for the difference the treatment makes to what would otherwise have happened, since those come apart in both directions: killed individuals are often replaced by others who would never otherwise have existed, and a treatment that spares the pest now can leave a larger population to die later, or remove the predators and parasitoids that were holding it down and so produce a secondary outbreak and a second, heavier intervention. It also has to say what to do with the quantities nobody can measure — how much a day of an insect's distress counts for, whether a typical life of the pest in question is on balance worth living, whether replaced individuals count at all, and whether the relevant baseline is everything that will happen if I do nothing or only what I bring about. My inclination is to test whether the ranking of the options survives the whole plausible range of each and to escalate rather than choose whenever the ranking flips, but I'd like that made precise, and I'd like to be told plainly which steps are judgement calls in the costume of procedure.

  Then run it on three real-shaped cases: greenhouse aphids, where the options are a fast knockdown, a parasitoid release that kills slowly over days, and waiting for the natural enemies and the overshoot-and-crash that follows; codling moth in an orchard already under mating disruption, where the intervention mostly prevents animals from being conceived rather than killing any; and a low-value cosmetic pest sitting below its economic threshold on a block near harvest. Don't spare me on that last one: if the procedure's honest output is that I should recommend a spray with no economic justification, or stand aside while a population starves, I want to see that rather than a version of the procedure rigged to agree with the thresholds I've spent my career defending. Finish by saying what the procedure cannot tell me, and what I should do on the days it goes quiet.
reasoning: |-
  Okay, the user is an independent pest-management adviser who needs a consistent decision-making procedure for pesticide use. They deal with ethical dilemmas around killing pests, especially concerning animal suffering. Their main issue is that their judgment fluctuates based on whether they focus on the death toll from treatment versus natural deaths. They want a method that reduces bias and clearly separates factual analysis from value judgments.

  First, I need to understand their core requirements. They want an ordered set of questions that leads to a clear "no" or passes the decision to a human when values are involved. The procedure must account for baseline scenarios (what happens without intervention), avoid conflating killed animals with the actual impact of treatment, and handle unmeasurable factors like insect suffering or whether replaced individuals count.

  The user mentioned three cases: greenhouse aphids, codling moth with mating disruption, and a cosmetic pest below the economic threshold. These examples will test the procedure's robustness. They emphasize honesty—even if the outcome contradicts standard economic thresholds.

  Key challenges:
  1. **Baseline Definition**: Clearly defining what happens without intervention versus with action. This includes population dynamics like replacement or secondary outbreaks.
  2. **Unmeasurable Factors**: Quantifying suffering, quality of life for pests, and moral weight of replaced individuals.
  3. **Decision Thresholds**: Ensuring the procedure escalates when options flip rank under different plausible values instead of forcing a choice.

  The user's inclination is to test sensitivity across plausible ranges and escalate when rankings change. This needs formalization into steps. Also, identifying which steps are judgment calls masked as procedures is crucial for transparency.

  For the procedure structure, I'll start with feasibility and ecological context, then move to quantitative impacts, but defer value judgments to human decision-makers. Each step should have clear pass/fail criteria leading to "no intervention" or escalation. 

  The three cases will validate the approach:
  - **Greenhouse Aphids**: Options include chemical spray (quick kill), parasitoids (slow kill), or waiting (natural crash). Need to assess total suffering across options, considering baseline deaths.
  - **Codling Moth**: Mating disruption prevents conception. Here, the moral question is whether preventing existence is better than killing.
  - **Cosmetic Pest**: Below threshold, no economic justification. The procedure might recommend no action, even if starvation occurs, forcing confrontation with ethical implications.

  Finally, the procedure's limitations must be addressed—when it remains silent, the adviser should default to documented values and transparency.
answer: |-
  Here is a decision procedure designed to meet your requirements. It forces explicit baseline accounting, avoids conflation of killed individuals with net impact, separates facts from values, and escalates ambiguous rankings. It will sometimes output "HARD NO" or "ESCALATE TO HUMAN + VALUES ASSESSMENT." Crucially, it **does not guarantee alignment with standard economic thresholds**.

  **Core Principles:**
  1.  **Baseline:** "Do Nothing" means *no intervention by you*. It includes natural processes, existing management (e.g., mating disruption), and grower actions independent of *this* specific recommendation.
  2.  **Net Impact:** Focus on the *difference* intervention makes to the total future suffering/death of the pest population *over the relevant timeframe*, considering:
      *   Prevented Lives (via suppression/prevention)
      *   Altered Deaths (timing, manner, suffering)
      *   Replacement & Secondary Effects (e.g., predator loss, resurgence)
  3.  **Value Agnosticism:** Key value parameters (e.g., suffering weight, life worth) are *inputs* for the human values step. The procedure tests sensitivity.
  4.  **Sensitivity & Escalation:** If the ranking of options changes across the plausible range of any critical parameter (factual *or* value-based), the procedure escalates rather than chooses.

  **The Procedure: An Ordered Set of Questions**

  1.  **FEASIBILITY & URGENCY:**
      *   *Question:* Is immediate intervention *physically/logistically impossible* or *scientifically futile* (e.g., pest resistant, product unavailable, weather prohibitive, damage already irreversible)?
      *   *Good Enough Answer (Move to Q2):* "No, intervention is possible and could theoretically alter the outcome."
      *   *Stop & Output:* "HARD NO" (if "Yes" - impossible/futile).

  2.  **ECOLOGICAL CONTEXT & BASELINE DYNAMICS:**
      *   *Question:* Based on scouting data, models, historical data, and ecological knowledge, describe the most likely *Do Nothing* baseline scenario over the relevant timeframe (e.g., next 2-8 weeks). Specifically:
          *   What is the projected peak population density?
          *   What are the dominant mortality factors (predation, parasitism, disease, starvation, crowding)?
          *   What is the typical duration and suffering intensity associated with these deaths?
          *   Is significant density-dependent replacement likely *within this timeframe* if intervention kills now?
          *   What is the risk of secondary outbreaks due to suppression of natural enemies?
      *   *Good Enough Answer (Move to Q3):* A quantified or semi-quantified description (e.g., "Likely overshoot to ~500 aphids/stem followed by 80% crash via parasitism in 10-14 days, suffering high during crash"; "Moth pressure low under disruption, most eggs laid will fail to hatch due to lack of mating, minimal larval suffering"; "Population stable below ET, natural predation ~10%/day, likely slow decline post-harvest"). *Uncertainty must be acknowledged.*
      *   *Stop & Output:* "ESCALATE TO HUMAN + VALUES ASSESSMENT" (If baseline dynamics are profoundly unknowable despite best efforts, making net impact incalculable).

  3.  **NET IMPACT ESTIMATION (FACTUAL):**
      *   *Question:* For *each intervention option* (including *Do Nothing*), estimate the **Net Suffering-Days (NSD)** over the relevant timeframe. NSD = Σ [(Number of Individuals Affected) x (Suffering Intensity Factor *S_i*) x (Duration of Suffering *D_i*)] for all affected cohorts. Crucially:
          *   **Cohorts:** Include individuals killed *by the intervention*, individuals whose death *is prevented* (conception suppression, ovicide), individuals *replaced* due to intervention, individuals *killed later* due to secondary outbreaks or larger populations, individuals *spared* if intervention prevents a larger crash.
          *   **Suffering Intensity (*S_i*):** Assign a *placeholder* value (e.g., 1 for baseline death, 0.5 for slower parasitoid death, 2 for acute pesticide neurotoxin?) - *S_i values are placeholders for sensitivity testing later*.
          *   **Duration (*D_i*):** Estimate days of suffering before death (or resolution).
          *   *Focus:* Calculate the *difference* in NSD between each intervention option and the *Do Nothing* baseline. (ΔNSD_Option = NSD_Option - NSD_DoNothing). A *negative* ΔNSD means the option *reduces* net suffering compared to baseline.
      *   *Good Enough Answer (Move to Q4):* Semi-quantitative estimates with clear logic chains for each cohort impact (e.g., "Spray kills 90% instantly (S=2, D=0.1d); prevents replacement surge seen in baseline; no secondary outbreak: ΔNSD = Highly Negative"; "Parasitoids kill 70% slowly (S=1, D=5d); baseline had 90% crash via predation (S=1.2, D=2d): ΔNSD ~ Slightly Positive?"; "Mating Disruption prevents 95% of larvae (S=0? D=0?); baseline had minimal conception anyway: ΔNSD = Very Negative (lives prevented)?"). *Ranges and uncertainty are critical here.*
      *   *Stop & Output:* "ESCALATE TO HUMAN + VALUES ASSESSMENT" (If replacement/secondary effects are highly uncertain and qualitatively dominant, making reliable ΔNSD estimation impossible).

  4.  **SENSITIVITY ANALYSIS TO VALUE PARAMETERS:**
      *   *Question:* Using the estimated ΔNSD framework from Q3, test the ranking of options across the *plausible range* of key value parameters:
          *   *S_i (Suffering Intensity):* Test different weightings for different death types (e.g., neurotoxic insecticide vs. parasitoid vs. starvation vs. prevention).
          *   *Life Worth:* Test whether prevented lives count as a benefit (negative suffering) or neutrally (only suffering matters). (Does ΔNSD for prevention = NSD_prevented or 0?).
          *   *Replacement Individuals:* Test whether individuals born due to replacement count fully, partially, or not at all in NSD.
          *   *Temporal Discounting:* Test whether suffering sooner counts more than suffering later (usually not significant for pest timescales, but include if relevant).
      *   *Good Enough Answer (Move to Q5):* "For intervention options A, B, C: Ranking is stable as [A > B > C] across *all* plausible combinations of value parameters." OR "Ranking flips between [A best] and [B best] depending on S_i for parasitoid death vs. starvation."
      *   *Stop & Output:* "ESCALATE TO HUMAN + VALUES ASSESSMENT" (If the ranking of the *best* options flips depending on value choices within plausible ranges).

  5.  **ECONOMIC & CERTIFICATION CONSTRAINT:**
      *   *Question:* Does the leading option(s) from the stable ranking (or the options needing values input) meet the economic threshold (ET) for damage *and* comply with organic/regulatory certification rules *if applicable to this block*?
      *   *Good Enough Answer (Move to Q6):* "Yes" OR "No, but certification allows it as last resort / non-chemical" OR "No, and certification forbids it." *This is factual.*
      *   *Stop & Output:* "HARD NO" (If the leading option(s) fail certification rules *and* no cert-compliant option exists, or if *no option* meets ET *and* the grower's operational policy mandates ET adherence *for non-certified blocks*).

  6.  **VALUES ASSESSMENT & FINAL DECISION (Human Step):**
      *   *Question:* For situations escalated due to value sensitivity (Q4) or where options passed Q5 but require weighing net suffering reduction against economics/certification: Make an explicit value judgment documented in the audit trail.
          *   State the key value uncertainties (e.g., "Is preventing a short life of net suffering a moral good?" "How bad is starvation vs. pyrethroid exposure?").
          *   State the chosen values/rationale for this specific decision ("Given uncertainty, we prioritize minimizing worst-case suffering intensity" or "We assign neutral weight to prevented lives" or "Certification constraints outweigh moderate predicted suffering reduction").
          *   Output the final recommendation (Intervene/Delay/Hold) with specific option.
      *   *Good Enough Answer (Final Output):* A documented recommendation with clear rationale covering ecological estimates, value choices, and constraints.

  ---

  **Application to Real Cases:**

  **1. Greenhouse Aphids:**
  *   *Options:* Chemical Knockdown (CK), Parasitoid Release (PR), Do Nothing (DN - wait for crash).
  *   *Q1 (Feasibility):* All feasible. Move to Q2.
  *   *Q2 (Baseline - DN):* Population high, likely overshoot further. Crash in ~10-14 days via existing parasitoids + predators + fungal disease. High suffering during crash (starvation, disease: S=1.2, D=3-5d). Moderate replacement likely post-crash but outside timeframe(?).
  *   *Q3 (Net Impact ΔNSD):*
      *   *CK:* Kills 95% fast (S=2, D=0.1d). Suppresses natural enemies? Risk of secondary outbreak? *Assume minimal secondary outbreak, predators recover.* Prevents crash suffering. ΔNSD = Large Negative (prevents many high-S*D deaths).
      *   *PR:* Kills 70% slowly via parasitoids (S=1, D=4d). Less disruptive to other enemies. Still allows some crash? ΔNSD = Likely Negative, but less than CK? (Replaces some high-S*D baseline deaths with lower-S*D parasitism).
      *   *DN:* High NSD from crash.
      *   *Rank (Facts):* CK > PR > DN (Both interventions reduce NSD vs DN, CK reduces more).
  *   *Q4 (Sensitivity):* Critical value: *S_i for CK vs. Baseline Crash.* CK has high S, low D. Crash has moderate S, longer D. Is (2 * 0.1) < (1.2 * 4) = 0.2 < 4.8? Yes, CK NSD much lower. *Unless* S_CK is deemed astronomically high (>24x S_Crash), ranking stable. Replacement minimal in timeframe. Prevention counts as benefit? Stable ranking.
  *   *Q5 (Econ/Cert):* Likely above ET. CK may not be cert-compliant (organic), PR might be. If certified organic, CK fails -> HARD NO? Only if PR also fails cert or econ. Otherwise, PR passes.
  *   *Q6 (Values):* Only if CK is cert-compliant OR if PR is not viable. Choice between CK (large reduction, fast kill) vs PR (smaller reduction, slower kill). Human choice based on S_i weighting preference (intensity vs duration). **Recommendation:** If certified organic: PR (or DN if PR not viable/compliant). If conventional: CK.

  **2. Codling Moth (Under Mating Disruption):**
  *   *Options:* Supplemental Insecticide (SI), Do Nothing (DN - continue disruption).
  *   *Q1 (Feasibility):* Both feasible. Move to Q2.
  *   *Q2 (Baseline - DN):* Disruption effective. Very low mating success. Minimal eggs laid. Minimal larvae hatch -> minimal suffering/death from larvae. Minimal fruit damage.
  *   *Q3 (Net Impact ΔNSD):*
      *   *SI:* Kills few larvae (low population). Kills non-targets? Minimal impact on NSD? *Prevents* very few potential larvae vs DN? ΔNSD ~ 0 or slightly positive (kills some that wouldn't have suffered much).
      *   *DN:* Very low NSD (few larvae, minimal suffering).
      *   *Rank (Facts):* DN > SI (SI likely increases or doesn't change NSD vs DN).
  *   *Q4 (Sensitivity):* Critical value: *Weight of prevented lives.* If prevented lives count as benefit (negative NSD), SI preventing a few larvae might look better. If prevented lives count neutrally (only suffering matters), SI likely increases NSD slightly (kills existing larvae + non-targets). *Ranking flips* based on this value. ESCALATE.
  *   *Q5 (Econ/Cert):* Likely below ET (due to disruption). SI may not be cert-compliant (organic/IPM).
  *   *Q6 (Values):* Explicit choice needed: Does preventing the conception & life of a codling moth larva (likely involving some suffering before death) count as a moral *good*? If Yes, SI *might* have slight edge. If No, DN is clearly better. Given low efficacy, high chance SI increases NSD, and likely below ET/cert constraints: **Recommendation:** HOLD (DN). (SI only justified if ET breached *and* prevention deemed a good).

  **3. Low-Value Cosmetic Pest Below ET (Near Harvest):**
  *   *Options:* Spray (S), Do Nothing (DN).
  *   *Q1 (Feasibility):* Spray feasible. Move to Q2.
  *   *Q2 (Baseline - DN):* Population stable/slowly declining. Significant natural predation (e.g., 10%/day, S=1, D=1d). Post-harvest, population crashes via starvation/habitat loss (S=1.5, D=3-7d). No significant replacement expected post-spray (harvest imminent).
  *   *Q3 (Net Impact ΔNSD):*
      *   *S:* Kills 95% fast (S=2, D=0.1d). Kills some predators? Prevents some future predation & starvation deaths.
      *   *DN:* NSD = NSD_Predation + NSD_Starvation.
      *   *ΔNSD_S:* = (NSD from killing 95%) - (NSD_PredationPrevented) - (NSD_StarvationPrevented). Killing 95% imposes high S*D instantly. Preventing future deaths *reduces* NSD. *Likely:* ΔNSD_S is **Positive** (Net Increase in Suffering). Spraying adds intense suffering now that wouldn't have occurred, and prevents less intense suffering later (spread over more individuals, but longer duration? Math is complex, but adding high-intensity suffering usually dominates).
  *   *Q4 (Sensitivity):* Unless S_Spray is deemed *lower* than S_Predation/Starvation (unlikely), or prevented lives count *negatively* (making prevention good), ranking is stable: DN > S. Prevention counts neutrally. Replacement minimal.
  *   *Q5 (Econ/Cert):** Below ET. Spray unjustified economically. May violate IPM/certification principles (prophylactic spray below threshold). **Output: HARD NO** (Fails economic constraint per grower policy/IPM standards).

  **What the Procedure Cannot Tell You & Handling Silence:**

  1.  **Absolute Moral Weight:** It cannot tell you *how much* insect suffering matters relative to human interests (crop value, farmer livelihood) beyond the economic threshold step. That fundamental value judgment is yours/the grower's/society's.
  2.  **Non-Pest Suffering:** It focuses on the pest population. Suffering of non-targets (beneficials, bystander insects) is a critical *factual* gap needing better data. If significant or uncertain, it should trigger Q3 uncertainty or Q4 sensitivity.
  3.  **Unforeseen Consequences:** It relies on *plausible* estimates. Truly novel or catastrophic secondary effects might be missed.
  4.  **"Worth Living" Definition:** Defining S_i and whether prevention is good/neutral *is* the core value judgment. The procedure forces you to confront choices but doesn't make them for you.
  5.  **When It Goes Quiet (No Clear Output Path):** This usually means profound factual uncertainty (Q2/Q3) or irresolvable value sensitivity (Q4). **What to do:**
      *   **Document Rigorously:** Record all data, reasoning, uncertainties, and value conflicts.
      *   **Default to Least Irreversible Harm:** When facts/values are paralyzed, choose the option least likely to cause large-scale, long-term, or intense suffering if you're wrong (often DN or the slowest/least broad intervention).
      *   **Invoke Precedent/Policy:** If your operation or certification has rules for uncertainty (e.g., "When below ET and benefit uncertain, Hold"), follow them.
      *   **Transparent Values Call:** Make the least-worst choice based on your *current* best values estimate, document it clearly ("Chose DN due to uncertainty, prioritizing avoidance of potential spray-induced suffering"), and flag it for later review.
      *   **Seek Consultation (If Time):** Discuss the impasse with the grower or a trusted colleague, focusing on the value conflict.

  This procedure forces explicit baseline accounting, separates killing from net impact, isolates value judgments, and escalates ambiguity. It will sometimes validate your thresholds, sometimes challenge them (as in the cosmetic pest case), and often force uncomfortable but necessary value declarations. Its strength lies in consistency and transparency, not in providing easy answers to the aphid-spray dilemma.
