prompt: |-
  Hey — I'm an undergrad RA in a sociolinguistics lab and most of my paid hours go into coding a corpus of recorded campus meetings: every "if" clause gets tagged indicative, counterfactual, or unclear, a second coder does 20% of it, and the grad student adjudicates our disagreements once a week. The codebook is literally one line — counterfactual = the antecedent is false or contrary to fact — and its useless in practice: we keep splitting on things like "if the budget was approved last month, we're fine" when nobody in the room knows whether it was, or "if I was being honest I'd have quit," which is about right now.

  Can you give me an actual procedure I can run in 30–60 seconds per token, with nothing but the transcript and two lines around it (no asking the speaker), that someone with one linguistics class could apply: what to check in what order, what counts as settling it, when to give up and tag unclear, and which disagreements are genuine undecidability from text alone instead of us being sloppy. It has to handle the case where the antecedent is false in fact but the speaker treats it as an open question, and the case where the speaker obviously doesn't believe the antecedent but isn't doing a counterfactual either. Ground it in whatever the semantics/pragmatics side of this says the distinction really is — I think it's something about whether the speaker treats the antecedent as a live possibility rather than about were vs was — but no citations, I dont care who said it, I need the rule.

  Then run it on these three and tell me where it stalls: (1) "If the provost read the report, she didn't mention it." (2) "If we were to raise the fee, we'd need a vote first." (3) "If that's your plan, we're all doomed."

  Also: how confident are you in each step, and which part of the procedure are you least sure about?
reasoning: |-
  Okay, the user is an undergrad research assistant in a sociolinguistics lab. Their main task involves coding "if" clauses in meeting transcripts as indicative, counterfactual, or unclear. The current codebook definition is too vague, leading to disagreements and confusion. They need a practical, step-by-step procedure that can be applied quickly (30-60 seconds per token) using only the transcript and surrounding context. 

  The user mentioned specific pain points: cases where the antecedent's truth value is unknown ("if the budget was approved") or where the speaker's belief is ambiguous ("if I was being honest"). They want a rule grounded in semantics/pragmatics, focusing on whether the speaker treats the antecedent as a "live possibility." No citations needed—just actionable steps. 

  First, I need to clarify the core distinction. From semantics, the key is the speaker's epistemic stance: does the speaker present the antecedent as a live possibility (indicative) or as false/imagined (counterfactual)? The verb form ("was" vs. "were") can hint but isn't reliable—colloquial English often uses "was" in counterfactuals.  

  I'll design a procedure with a clear flowchart:  
  1. **Check for explicit falsity markers**: Words like "would have," "might have," or past perfect tense in the consequent often signal counterfactuality. If found, tag as counterfactual.  
  2. **Assess speaker's commitment**: Does the context show the speaker believes the antecedent is false? E.g., "If the provost read the report [but she didn't], she didn’t mention it."  
  3. **Look for live possibility cues**: Is there evidence the antecedent is open or plausible? E.g., discussions about future plans or unresolved questions.  
  4. **Default to indicative** if no markers point strongly to counterfactual.  
  5. Tag as **unclear** only if steps 1-4 yield conflicting evidence or high ambiguity after 60 seconds.  

  For the examples:  
  - (1) "If the provost read the report, she didn't mention it." Consequent uses simple past ("didn't mention"), suggesting the speaker implies the provost didn't read it. Tag as counterfactual.  
  - (2) "If we were to raise the fee, we'd need a vote." Explicit "were" + "would" marks it as hypothetical but not counterfactual (it's a live future possibility). Tag as indicative.  
  - (3) "If that's your plan, we're all doomed." Speaker treats the plan as real (present tense "is"), so indicative.  

  Confidence:  
  - Step 1 (explicit markers) is high-confidence (~90%).  
  - Step 2 (speaker commitment) is trickier (~70%)—requires inferring belief from context. This is the weakest point.  
  - Steps 3-5 are clearer (~85%) but rely on steps 1-2.  

  User's deeper needs: They want to reduce adjudication workload and inconsistency. The procedure must minimize "unclear" tags by providing clear thresholds for giving up. Also, they likely need buy-in from the lab—so the rule must feel objective despite pragmatic nuances.  

  Final thought: Emphasize that "unclear" is for true ambiguity, not laziness. If context is insufficient after 60 sec, it’s genuinely undecidable.
answer: |-
  Here's a concrete, step-by-step procedure based on semantic/pragmatic grounding: **The distinction hinges on whether the speaker presents the antecedent as a *live epistemic possibility* in the current discourse context (indicative) or as *excluded from reality* (counterfactual).** Verb forms ("was" vs. "were") are unreliable indicators—focus solely on contextual cues to the speaker's stance.

  ### Procedure (30-60 seconds per token)
  **What you need:** The "if" clause + the consequent clause + 2 lines of transcript before/after.
  **Goal:** Decide if the speaker treats the antecedent as **true/possible**, **false/imagined**, or **truly ambiguous**.

  1.  **⏱️ STEP 1: Check for EXPLICIT COUNTERFACTUAL MARKERS in the consequent (5 sec)**  
      *   **Look for:** "would have", "might have", "could have", "should have" + past participle (e.g., *"would have needed"*).  
      *   **Decision:** If present → **Counterfactual** (Speaker explicitly frames the outcome as non-actual). STOP.  
      *   *Confidence: 90% (Strong grammatical cue).*

  2.  **⏱️ STEP 2: Check SPEAKER COMMITMENT to Antecedent Falsity (15 sec)**  
      *   **Look in context (lines before/after/consequent):**  
          *   Does the speaker *state* the antecedent is false? (e.g., "...but it wasn't.")  
          *   Does the consequent *only make sense* if the antecedent is false? (e.g., "If he *was* here (*but he isn't*), he *would* be furious.")  
          *   Is there strong shared knowledge/previous mention that the antecedent is false?  
      *   **Decision:**  
          *   Strong evidence of speaker presenting antecedent as false → **Counterfactual**.  
          *   Evidence the speaker explicitly *doesn't know* if it's true/false → **Indicative** (It's treated as a live possibility).  
          *   Neither clear falsity nor explicit ignorance? → Move to Step 3.  
      *   *Confidence: 70% (Requires pragmatic inference, but clear cases exist).*

  3.  **⏱️ STEP 3: Assess "LIVE POSSIBILITY" (20 sec)**  
      *   **Key Question:** Is the antecedent being discussed as something that *could be true/possible right now or in the future* within this conversation?  
      *   **Look for:**  
          *   **Future Orientation:** Is the clause about planning, contingencies, or future outcomes? (e.g., "If it *rains* tomorrow...") → **Indicative**.  
          *   **Open Investigation:** Is the truth of the antecedent the *current topic of discussion* or an unresolved question? (e.g., "If the budget *was* approved... [and they're trying to find out]") → **Indicative**.  
          *   **Hypothetical but Possible:** Speaker uses "would" in consequent but *without* Step 1 markers, and antecedent isn't framed as false (Step 2). (e.g., "If we *raised* fees, we *would* need a vote.") → **Indicative**.  
          *   **Rhetorical/Non-Serious:** Does the speaker clearly *not believe* the antecedent but is using it for emphasis, politeness, or to make a general point *without* implying its falsity in this specific instance? (e.g., "If I *was* being honest, I'd have quit." = They *are* being honest *right now*, using the form for emphasis) → **Indicative**.  
          *   **Contrary-to-Fact:** If Steps 1 & 2 don't apply, but the context *strongly implies* the speaker *assumes* the antecedent is false (even if unknown) and is exploring an imagined scenario → **Counterfactual**. (Rare without Step 1 markers).  
      *   **Decision:** Apply the strongest contextual cue above. If no single cue dominates → Move to Step 4.  
      *   *Confidence: 80% for clear cases, drops sharply if cues are mixed.*

  4.  **⏱️ STEP 4: Default & Give Up (10 sec)**  
      *   **Default:** If no strong cues point to **Counterfactual** (especially missing Step 1), default to **Indicative**. (Live possibility is the broader category).  
      *   **Give Up (Unclear):** ONLY if after 60 seconds:  
          *   Evidence for **Counterfactual** (Step 2/3) and **Indicative** (Step 3) are *equally strong and contradictory*, OR  
          *   The context provides *absolutely no clue* about the speaker's belief/knowledge regarding the antecedent's truth (rare in coherent discourse).  
      *   *Confidence: 95% for Default (Indicative). Unclear tag should be <5% of cases if procedure is followed.*

  **Genuine Disagreement vs. Sloppiness:**
  *   **Genuine:** Ambiguity arises when context *provides no evidence* of speaker belief/knowledge *and* the grammatical forms are ambiguous (e.g., simple past "was" + simple past consequent). This is rare in practice if 2 lines of context are available.
  *   **Sloppiness:** Missing Step 1 markers, misapplying "were" as always counterfactual, not checking context for speaker knowledge/belief (Step 2), misinterpreting rhetorical uses (Step 3), or overusing "Unclear" instead of defaulting to Indicative (Step 4).

  ---

  ### Application to Your Examples

  1.  **"If the provost read the report, she didn't mention it."**
      *   Step 1: Consequent = "didn't mention" (simple past, no "would have") → No marker.
      *   Step 2: Consequent "she didn't mention it" strongly implies the speaker believes the provost *did not* read the report (otherwise, why mention the lack of mention as significant?). Speaker presents antecedent as false.
      *   **Decision: Counterfactual** (Step 2). *Confidence: High (85%).* (This is a classic "Indicative of Irrealis" or "Tentative" use, but semantically *in this context*, the speaker treats the antecedent as contrary to fact).

  2.  **"If we were to raise the fee, we'd need a vote first."**
      *   Step 1: Consequent = "we'd need" ("would" + bare infinitive, NOT "would have needed") → No explicit counterfactual marker.
      *   Step 2: No statement of falsity. Raising the fee isn't presented as impossible or false, just hypothetical.
      *   Step 3: Clear **Hypothetical but Possible** / **Future Orientation**. Discussing a potential future action and its consequence. "Were to" + "would" is a common pattern for *remote future possibility*, not counterfactuality.
      *   **Decision: Indicative** (Step 3). *Confidence: Very High (95%).* ("Were" here is subjunctive marking hypotheticality, not counterfactuality).

  3.  **"If that's your plan, we're all doomed."**
      *   Step 1: Consequent = "we're all doomed" (present tense) → No marker.
      *   Step 2: No statement of falsity. The speaker is likely *accepting* "that" *is* the plan and commenting on its consequences.
      *   Step 3: **Rhetorical/Non-Serious?** The speaker clearly thinks the plan is bad ("doomed") but *is not contesting the existence/reality of the plan itself*. The antecedent "that's your plan" is presented as a live possibility (likely the current topic) that the speaker believes is real and terrible. No implication the plan *isn't* the plan.
      *   **Decision: Indicative** (Step 3). *Confidence: High (90%).* (This is a conditional assertion based on accepting the antecedent as given).

  **Where it Stalls:** None of these stall. All have clear contextual cues driving the decision (Step 2 for #1, Step 3 for #2 and #3). The procedure resolves them decisively.

  ---

  **Confidence Breakdown & Weakest Point:**
  *   **Step 1 (Explicit Markers):** 90% Confidence. Rarely ambiguous.
  *   **Step 2 (Speaker Commitment to Falsity): 70% Confidence.** This is the **weakest point**. It relies heavily on pragmatic inference from context (e.g., why does "she didn't mention it" imply she didn't read it?). Requires careful reading for implicature. Genuine ambiguity *can* occur here if context is truly opaque.
  *   **Step 3 (Live Possibility Assessment):** 80% Confidence for clear cases (future/hypothetical/open question). Drops to ~60% for nuanced rhetorical uses or very weak contexts. Requires understanding the discourse purpose.
  *   **Step 4 (Default/Give Up):** 95% Confidence for Default (Indicative). 99% Confidence that "Unclear" is only for true stalemate/no context (which should be rare).

  **Least Sure About:** **Step 2 (Speaker Commitment to Falsity).** Distinguishing between a speaker strongly *implying* falsity vs. merely acknowledging a *possibility* without commitment is inherently pragmatic and context-dependent. It's the step most likely to cause reasonable disagreements between coders when the context is subtle, even if they aren't being sloppy. This is where adjudication by the grad student is most valuable.
