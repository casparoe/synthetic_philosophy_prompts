prompt: |-
  I teach a graduate seminar on collective decision-making, and for two years I have opened it with the argument below, which I originally wrote as a provocation. I now find that I cannot locate its fault, and since I assign it to students I would like a diagnosis rather than a verdict.

  (1) Condorcet's jury theorem, in its simplest form: suppose a question admits exactly one correct answer, fixed independently of what anyone believes about it; suppose n voters (n odd) vote independently, each with the same probability p > 1/2 of voting for that answer. Then the probability that a simple majority votes for it exceeds p, never falls as n increases, and tends to 1 as n grows without bound.

  (2) Now take any binary collective decision that is answerable to outcomes — whether a central bank should raise its policy rate at its next meeting, whether a jurisdiction should license a repository for spent nuclear fuel. Let the correct answer be whichever option in fact produces the better outcome. The case then has the shape the theorem describes: there is one correct answer, and its correctness is not constituted by what the voters think.

  (3) Individual voters are not experts, but they are better than chance: across a run of comparable questions, each citizen comes down on the better side more often than not. This is deliberately weak — p = 0.51 will do — and it is all the competence the theorem asks for.

  (4) Ballots are secret, each voter marks one alone, and there is no deliberation, no whip, no caucus. So treat the votes as independent.

  (5) Hence, for an electorate in the tens of millions, even at p = 0.51, the probability that the majority is correct is for practical purposes 1.

  (6) Call this the swamping thesis: for any binary question with an outcome-correct answer, the best available procedure is the largest electorate one can assemble, and expertise, legislative deliberation, judicial review and delegation to agencies can only degrade the result — by shrinking n, or by correlating errors that would otherwise cancel. On this view the size of a decision body is fixed by the error rate one is willing to tolerate and by nothing else: a three-judge appellate panel is a crowd of three, and a randomly selected panel of 3,001 would be strictly better.

  (7) Corollary: near-ties are always pathological. If a 51%-competent electorate of millions is effectively infallible, then an observed 50/50 split must be explained either by p ≤ 1/2 on that question or by correlated error. There is no third option of a hard question about which informed people reasonably disagree.

  (8) I cannot accept (6) or (7). No one who has watched a monetary policy committee work thinks a mass plebiscite is the better instrument; and in (7) the excluded option is exactly the right one for the cases I care about. Something earlier must give.

  I would like to keep (1) as mathematics and (2) as a description of what these decisions are answerable to, if I can. My main suspects are (3) and (4), and I cannot tell whether they are one problem or two. On (3): the theorem needs each voter's probability of being correct on this question, conditional on which answer is in fact correct; my premise offers a long-run frequency across a class of questions. Is that a real gap? It is aggravated by a selection effect I only recently noticed — the questions that get put to a vote are the contested ones, so a track record compiled over a mixed diet of easy and hard questions may say nothing about competence on the questions that ever reach a ballot. On (4): I have been told that what the theorem requires is independence conditional on the true state, whereas what my premise argues for is closer to unconditional independence, and that voters sharing a media environment and a set of cognitive defaults can satisfy the second while failing the first badly. Is that right, and is it the same failure as the one in (3)?

  There is a further worry about (2) that I resist: on questions like the policy rate, the better outcome is not one state of the world but a distribution across creditors and debtors, so there may be no single answer for the majority to track, and the theorem's truth-tracking frame would not apply. But that line is dangerously convenient, since it would also explain the stable near-ties in (7) — and if (2) fails, I am left with a theorem that has no application to policy at all.

  Finally, a colleague of mine says (5) is where the argument breaks: the limit in (1) is stated for a fixed p bounded away from 1/2, whereas the marginal voter added as the electorate grows is plausibly less informed, and if the advantage over chance decays like c/√n then majority accuracy converges not to 1 but to Φ(2c). I cannot follow her derivation well enough to check it, and I do not know whether it matters.

  Which step do you reject? If several fail, which one carries the argument — the one whose repair leaves a chain that no longer delivers (6) or (7)? And what does each repair cost me: does any of them leave a usable institutional moral, and if the culprit is correlated error rather than size, does that argue for bodies that diversify information instead of bodies that simply get larger?
reasoning: |-
  Okay, the user is teaching a graduate seminar on collective decision-making and has been using this argument as a provocation. They've realized they can't find the fault in it and need help diagnosing where it breaks down. The argument applies Condorcet's jury theorem to real-world policy decisions, concluding that large electorates are infallible and expertise is detrimental. The user disagrees with steps 6 and 7 but wants to preserve 1 and 2.

  Let me start by understanding each step. Step 1 states the theorem correctly: with independent voters each having p>0.5, majority accuracy increases with n. Step 2 claims that policy decisions have a single correct answer based on outcomes. Step 3 assumes voters are slightly competent (p=0.51) across comparable questions. Step 4 argues for independence due to secret ballots. Step 5 concludes near-certain correctness for large electorates. Steps 6 and 7 draw controversial implications about expertise and near-ties.

  The user suspects issues in steps 3 and 4. Step 3 uses a long-run frequency of correctness across questions, but the theorem needs per-question competence. There's a selection effect—only contested issues are voted on, which are harder, so average p might not apply. Step 4's independence might not hold conditionally. Voters share information sources, leading to correlated errors even with secret ballots. For example, if media misreports facts, many voters err together, violating conditional independence.

  The colleague's point about decaying competence (p decreasing as n grows) is valid. If p approaches 0.5 as n increases, the limit might not be 1. The user struggles with the math here, but this could be another flaw.

  Step 2 might be problematic if there's no single correct answer due to conflicting values. But the user resists this because it undermines the theorem's applicability. Still, for policy decisions, better outcomes might involve trade-offs without a clear "correct" choice, making majority tracking impossible.

  The main failure points are steps 3 and 4. The competence assumption (3) doesn't hold for hard, contested questions. Real-world p could be ≤0.5 for such issues. Also, step 4's independence fails due to shared biases and information, causing correlated errors. Both issues together break the argument. Fixing them means the theorem doesn't support large plebiscites for complex decisions. Instead, diverse expert bodies might reduce correlations, but this costs the simplicity of the original argument. The institutional lesson is to focus on reducing correlations and ensuring competence per issue, not just size.
answer: |-
  Your argument is brilliantly constructed and its flaws are subtle—exactly what makes it such a powerful provocation. The critical failures lie in **step (3) (competence per-question)** and **step (4) (conditional independence)**, and these are **distinct but interconnected problems**. Step (2) is also vulnerable in ways that matter for policy. I'll diagnose each, explain why they break the chain, and outline the institutional implications.

  ### 1. **Step (3): The Competence Gap is Fatal**
     - **The Theorem's Requirement**: Condorcet requires the probability \( p_i \) that voter \( i \) is correct *on this specific question, given the true state of the world*. Your premise uses a *long-run average* over a class of questions ("comparable questions"). This is a profound mismatch.
     - **The Selection Effect**: As you note, questions put to collective votes (e.g., monetary policy, nuclear waste) are typically *contested and complex*—unlike "easy" questions where non-experts might reliably achieve \( p > 0.5 \). The average \( p = 0.51 \) over "mixed" questions tells us nothing about \( p \) *for hard questions*. In fact, for highly technical or ambiguous issues, \( p \) may be \(\leq 0.5\) for non-experts (e.g., they might rely on heuristics that fail systematically).
     - **Implication**: If \( p \leq 0.5 \) for a specific hard question, the theorem *reverses*: majority accuracy decreases as \( n \) grows, converging to 0. This alone invalidates (5)–(7) for policy decisions.

  ### 2. **Step (4): Conditional Independence is Unattainable**
     - **The Theorem's Requirement**: Votes must be *independent conditional on the true state*. Your premise (secret ballots, no deliberation) only ensures *unconditional* independence (no collusion). These are not equivalent.
     - **Why Conditional Independence Fails**: Voters share:
       - **Common Information Sources**: Media, education, or cultural narratives that misrepresent evidence (e.g., biased reporting on nuclear risks).
       - **Systematic Biases**: Cognitive defaults (e.g., loss aversion, partisan framing) that cause correlated errors.
       - **Ambiguity in Evidence**: When signals are noisy, voters relying on similar cues make the *same* mistake (e.g., misinterpreting inflation data).
     - **Example**: If the true state is "raise rates," but media downplays inflation risks, many voters will independently (and wrongly) vote "hold rates." Errors correlate *because they share distorted information*.
     - **Impact**: Correlated errors destroy the "wisdom of crowds" effect. Majority accuracy can plateau or even *decrease* with \( n \), as shared biases dominate.

  ### 3. **Step (2): The "Single Correct Answer" is Often Ill-Defined**
     - **The Problem**: Policy decisions (e.g., interest rates) involve trade-offs between groups (creditors vs. debtors) or values (growth vs. stability). There is often *no objective "better outcome"* independent of normative weights—only distributions of costs/benefits.
     - **Why It Matters for the Theorem**: Condorcet assumes a binary truth to track. If the "correct" answer depends on subjective weights (e.g., how to balance inflation vs. unemployment), voters aren't tracking truth—they're expressing preferences. The theorem no longer applies.
     - **Your Resistance is Understandable, But...** This *does* explain near-ties (7): a 50/50 split may reflect legitimate disagreement over values or weights, not correlated errors or \( p \leq 0.5 \). Abandoning (2) preserves the theorem's mathematical truth but concedes it rarely applies to policy.

  ### 4. **The Marginal Voter Argument (Your Colleague's Point)**
     - **The Insight**: If expanding the electorate adds less competent voters (plausible for technical issues), and \( p_n \rightarrow 0.5 \) as \( n \rightarrow \infty \), majority accuracy converges to \( \Phi(2c) < 1 \) (where \( c \) is a constant). **This is correct and reinforces (3)**. For large \( n \), \( p \) likely decays toward 0.5 on hard questions, preventing convergence to 1.

  ---

  ### Which Step Carries the Argument?
  **Step (3) is the primary failure**, as it alone suffices to break (5)–(7). If voters lack per-question competence (\( p \leq 0.5 \)) on hard policy issues, the theorem implies majority failure. Steps (2) and (4) compound the problem:

  - **If (3) holds** (voters truly have \( p > 0.5 \) per-question), **but (4) fails** (correlated errors), majority accuracy may still be high but not near 1.  
  - **If (4) holds** (true independence), **but (3) fails** (\( p \leq 0.5 \)), majority accuracy collapses.  
  - **If (2) fails**, the theorem is inapplicable.

  ---

  ### Institutional Implications: What Repairs Cost You
  | **Flaw** | **Repair** | **Cost to Your Argument** | **Institutional Moral** |
  |----------|------------|---------------------------|-------------------------|
  | **Per-question competence (3)** | Restrict votes to questions where non-experts demonstrably have \( p > 0.5 \). | Most policy decisions (monetary policy, nuclear safety) *cannot* use mass voting. The scope of "swamping" shrinks drastically. | **Delegate technical decisions:** Use experts for complex issues (high stakes + low public competence). Reserve mass voting for value-laden choices (e.g., moral referendums). |
  | **Conditional independence (4)** | Diversify information sources or structure deliberation to break correlations. | Increasing \( n \) alone may not help (and could hurt). Deliberation/expert input isn't harmful—it's *essential* to reduce correlations. | **Small, diverse bodies:** Optimize for cognitive diversity (e.g., cross-disciplinary panels) to neutralize shared biases. Secrecy isn't enough; need varied information diets. |
  | **No single correct answer (2)** | Accept that many decisions involve preference aggregation, not truth-tracking. | Condorcet's theorem no longer justifies mass voting for policy. Near-ties (7) are non-pathological. | **Mixed systems:** Use voting for legitimacy on value conflicts (e.g., legislatures), expertise for technical truth-tracking (e.g., independent central banks). |

  ---

  ### Final Diagnosis
  - **Core Failure**: Step (3) is the irreparable flaw. The "long-run \( p = 0.51 \)" premise is meaningless for hard, context-specific policy questions. This alone collapses the swamping thesis (6) and explains near-ties (7) without denying "reasonable disagreement."
  - **Supporting Failures**: Step (4) (correlated errors) and Step (2) (ill-defined correctness) ensure the argument fails even if competence were plausible. Your colleague's decaying-\( p \) point reinforces (3).
  - **Institutional Takeaway**: The Condorcet framework *does* offer a moral—but not "bigger is always better." Instead:  
    > **For truth-tracking decisions: Prioritize *conditional independence* and *per-question competence* over size.**  
    This justifies small, diverse expert bodies (e.g., courts, central banks) for complex issues, while reserving mass voting for decisions where voter competence and independence are realistic (e.g., constitutional referendums).

  The provocation stands—but its collapse reveals why we need *both* democracy *and* expertise, tailored to the decision at hand. Well done on crafting an argument that so precisely dissects the tension.
