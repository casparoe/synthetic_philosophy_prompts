     question: the question text
     case: a short description of the case
     allowed_answers: array of strings
     why_it_divides: string

  Then question_order: ["q1", "q2", "q3", "q4"] and a justification.

  Then leaves: array of leaf objects.

  Each leaf has:
     id: "leaf1", ... "leaf8"
     label: a short name
     answer_vector: an object mapping axis id to answer, e.g., {"q1": "serious_loss", ...}
     defended_by: string or null
     position_in_one_sentence: string
     most_awkward_commitment: string

  Then unoccupied_cells: array of objects with:
     answer_vector: same as above
     diagnosis: "incoherent", "unattractive", or "unexplored"
     explanation: string

  Then inseparable_pairs: []  (since we don't have any)

  notes_for_seminar: string

