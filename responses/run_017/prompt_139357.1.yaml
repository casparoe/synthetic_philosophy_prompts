answer: |-
  Here are the five objections you are most likely to face, ordered by likelihood and potential damage, with replies and weaknesses:

  1.  **Objection (Analytic Metaethicist):** "Your 'reasons-preserving test' seems unnecessary. We already have frameworks like Eklund's 'meaning as use' or Hirsch's quantifier variance that handle verbal disputes cleanly by appealing to shared conceptual schemes or contexts of utterance. Why introduce this complex relativization to grain?"  
      **Reply:** "Those frameworks often presuppose a *fixed* context or scheme. My test explicitly addresses disputes where the relevant context *itself* is contested, like the band case where 'same band' serves multiple practical purposes simultaneously."  
      **Weakness:** Your reply risks appearing to mischaracterize contextualist frameworks as more rigid than they are.

  2.  **Objection (Linguist):** "You assume context fails to fix a unique grain, but competent speakers resolve ambiguity dynamically. The band dispute *is* resolved contextually – it's about identity over time under a description. Calling it 'merely verbal relative to a grain' just restates the context-sensitivity we already model."  
      **Reply:** "Dynamic context *can* resolve it, but it doesn't *have* to. The disagreement persists precisely because speakers legitimately prioritize different descriptive grains based on their practical stakes (e.g., nostalgia vs. contractual rights), and context doesn't mandate one over the other."  
      **Weakness:** It's vulnerable to the claim that unresolved disputes simply reflect insufficient context or speaker error, not an essential grain-relativity. **[Confidence: 80%. Shakiest Point: Whether the choice of grain is genuinely interest-relative *without* collapsing into contextual resolution or speaker incompetence.]**

  3.  **Objection (Political Philosopher):** "This feels dangerous. Calling deeply felt moral/political disagreements 'non-factual but substantive' or 'verbal at a coarse grain' could trivialize them or imply there's no truth to discover, undermining motivation for crucial ethical arguments."  
      **Reply:** "My aim is the opposite: to show why some seemingly 'merely verbal' disputes *aren't* trivial. Recognizing them as substantive (though non-factual) due to conflicting practical stakes preserves their importance without demanding a single factual resolution that may not exist."  
      **Weakness:** Doesn't fully address how substantive *force* is maintained if no fact of the matter underpins the disagreement.

  4.  **Objection (Analytic Metaphysician):** "Relativizing 'verbal' to grain concedes too much. Finer-grained restatements often reveal hidden *factual* disagreements (e.g., about persistence conditions). Your test might misclassify deep metaphysical disagreements as 'merely verbal at a coarse grain' when they're actually factual at a finer one."  
      **Reply:** "The key is *interest-relativity*. Choosing the finer grain presupposes which facts are *relevant* to being 'the same band'. My point is that nothing *in the dispute itself* forces that choice; it's driven by the practical stakes each side brings, not discovered facts."  
      **Weakness:** Risks conflating the *epistemic* process of uncovering commitments with the *metaphysical* status of the disagreement.

  5.  **Objection (The One You Hope Nobody Asks - Likely an Analytic Metaethicist or Linguist):** "Suppose two parties have *diametrically opposed* practical stakes that cannot be preserved under *any* single restatement at *any* grain. According to your test, this means their dispute is substantive but non-factual. But doesn't this mean your test *fails* to resolve the dispute or show it's non-verbal in any useful sense? It just labels an irresolvable clash of interests."  
      **Reply:** "Exactly. The test's purpose isn't to *resolve* all disputes, but to *diagnose* when apparent verbal disputes are actually substantive clashes of practical interest. In such cases, labeling it 'substantive but non-factual' accurately reflects that no shared factual resolution is possible *or sufficient* to address both stakes."  
      **Weakness:** Exposes the core tension: Does "substantive but non-factual" offer a meaningful category beyond "irreconcilable practical disagreement," and is this genuinely distinct from a factual dispute where facts *about interests* are relevant?
