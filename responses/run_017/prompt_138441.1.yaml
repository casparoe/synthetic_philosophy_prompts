prompt: |-
  Hey — I co-host a small, loosely edited epistemology podcast, and next week's guest is a philosopher who defends what I've started calling counterfactual reductionism about testimonial warrant: the claim that a hearer's justification for believing what she's told doesn't require her to actually have positive reasons bearing on the speaker's reliability (not occurrent, not even stored in memory), but does require that she be in a position to produce such reasons if she were pressed — roughly, reasons about the speaker's competence and honesty in the relevant domain, plus the usual base-rate/track-record material. So the requirement is modal rather than occurrent.

  I want eight to ten questions that go past asking her to lay the view out. She handles the standard hard cases very smoothly by saying that's just a shift in the baseline of what the hearer could come up with, and I want a sequence that makes that move progressively harder to lean on, ending with something about what would actually count against the view. For each question I'd like the follow-up keyed to the answer she's most likely to give, plus a one-line note on why the question bites.

  Things I definitely want covered:

  How the could gets spelled out. Is it ability-on-reflection, ability-after-five-minutes, ability-with-help-from-others, ability-with-a-search-engine? If help from other people is allowed, the requirement looks like it stops being a condition on the individual hearer and becomes a distributed one — press on whether she's willing to swallow that, and then on whether a distributed version still counts as reductionism rather than as the anti-reductionist's default entitlement with extra bookkeeping.

  The squeeze. If the counterfactual condition is weak enough that nearly every competent adult satisfies it, the view predicts nothing and is hard to distinguish from the default/entitlement views she's arguing against; if it's demanding, it seems to over-generate skepticism about the ordinary epistemic division of labour (my dentist, my mechanic, the air-traffic controller). Her likely move is to tighten the ability so that it has to be exercisable without special assistance — so I want the follow-up to target that specific tightening.

  The novice cases, where I expect her to say that kids and first-language learners do have crude evidence (caregiver track records, sincerity cues, the fact that adults mostly get things right). The follow-up should press on whether evidence that crude could possibly underwrite the *content* the kid acquires — that invisible organisms cause disease, that the earth is very old, that words mean what they mean — rather than merely underwriting the bare claim that this speaker is worth listening to.

  The case that looks like free money for her, and I want it asked so it doesn't stay free: outputs of systems that aren't speakers. A translation app, an automated weather readout, a chatbot, an aggregated database. No one is offering assurance, no one is taking responsibility for what's said, nothing you could trust in the interpersonal sense — but there is a reliability profile the hearer could in principle sample. Reductionism seems to glide over these while trust-based and assurance-based default views have to say something awkward. Ask it, let her have the point, then follow up: does her view end up saying that warrant from a well-calibrated machine is in *better* shape than warrant from a colleague's assertion, and is the difference between the two merely pragmatic? And then: what if the system's reliability is genuinely opaque to the user — proprietary, black-box, something no amount of querying would let her estimate? Does the could-marshal condition fail there, and is that the result she wants?

  Content-based versus speaker-based reasons. Her requirement is naturally read as reasons about the speaker. But suppose the only thing the hearer could produce if pressed is a reason about the content — it fits her other beliefs, it's the sort of thing that would be widely reported if false. If that's enough, the view has quietly stopped being reductionism. I want the question, and I want the follow-up to her almost certain answer that speaker-reasons can be partly generic.

  One question on whether the whole debate has gone verbal on us: reductionism as a thesis about where warrant *comes from* (testimony transmitting rather than generating it) versus as a norm for how hearers ought to manage their beliefs. If it's only the metaphysical thesis, what's the cash value — does it leave us with anything to say to a student who believes everything she reads?

  And please, no questions of the form so how does your view relate to Hume's: she gets that every single time and it derails into twenty minutes of exegesis. Nothing that requires her to summarize literature or name who argued what either — I want everything keyed to the actual machinery of the position, not to who is on which side of the debate.
reasoning: |-
  Okay, the user is co-hosting an epistemology podcast and needs help crafting questions for a guest who defends "counterfactual reductionism about testimonial warrant." I need to understand this view to generate effective questions. The guest argues that a hearer doesn't need actual reasons for believing a speaker's testimony but must be able to produce such reasons if pressed. The user wants questions that go beyond basics and challenge the guest's typical responses, especially regarding the "could" condition and its implications.

  The user has specific areas to cover: clarifying the "could" condition (ability types), avoiding making the condition too weak or too strong, handling novice cases, addressing non-human sources like apps, distinguishing content-based vs. speaker-based reasons, and questioning the debate's verbal nature. They also want to avoid historical or literature-focused questions.

  First, I'll break down each requested area. For the "could" condition, the key is probing the modality—what resources are allowed? If the guest includes help from others or the internet, does that make the requirement distributed rather than individual? That might blur the line with anti-reductionism. The follow-up should press on whether distributed access still counts as reductionism.

  Next, the squeeze: if the condition is too easy to satisfy, it becomes vacuous; if too strict, it leads to skepticism. The guest will likely tighten it to "without special assistance," so the follow-up should challenge that by showing how even common sources like dentists might require specialized knowledge the hearer can't access unaided.

  For novices like children, the guest will probably say they have basic reasons like caregiver reliability. The follow-up needs to question if such thin evidence can support complex content (e.g., germs or word meanings), pushing on whether this stretches "reliability" too far.

  Non-human sources like apps seem to favor reductionism since reliability can be sampled, whereas trust-based views struggle. But the follow-up should ask if this makes machine warrant epistemically better than human testimony, and then probe opaque systems where reliability is unknowable—does her view deny warrant there, and is that acceptable?

  On content-based vs. speaker-based reasons, if the hearer can only cite content-based reasons (e.g., coherence), does that collapse into anti-reductionism? The guest might respond that speaker-reasons can be generic, so the follow-up should challenge if generic reasons are sufficient or if they dilute reductionism.

  Lastly, clarifying the debate's focus: is reductionism about warrant's source (transmission) or belief management norms? If it's metaphysical, what practical guidance does it offer? This questions the view's applicability.

  The user emphasized avoiding derailments into history or exegesis, so all questions must stay focused on the mechanics. Also, ensure each question has a biting follow-up tailored to likely answers. I'll structure 8-10 questions covering these areas, each with a brief note on why it's effective and a concise follow-up.
answer: |-
  Here are 8 tightly focused, progressive questions targeting the machinery of counterfactual reductionism, each with a predicted answer, biting follow-up, and rationale:

  1.  **Question:** You emphasize the hearer *could* marshal reasons about speaker reliability if pressed. What *exactly* constrains this "could"? Specifically, does it allow the hearer to consult Google, ask a friend, or hire an investigator? Or must the reasons be accessible using only their *current, unaided* cognitive resources?
      *   **Predicted Answer:** Likely restricts it to unaided cognitive resources (memory, reasoning) available *to that individual hearer* to avoid distributed collapse.
      *   **Follow-Up:** If it requires unaided access, doesn't this mean my warrant for believing my dentist's root canal advice evaporates the moment I realize I couldn't *unaidedly* recall or derive specific reasons for *dental* expertise, even if I could easily look it up or ask a colleague? Is ordinary expert testimony warrant really that fragile?
      *   **Why it Bites:** Directly targets the core modality. Forcing the "unaided" restriction creates vulnerability to skepticism about ubiquitous expert reliance.

  2.  **Question:** Building on the "unaided access" point: How demanding is this ability? If it's too easy (e.g., "I could vaguely recall people are mostly honest"), the condition seems toothless. If it's too strict ("I must be able to articulate specific track-record data"), it causes massive skepticism. Where do you draw the line, and how do you avoid collapsing into vacuity or skepticism?
      *   **Predicted Answer:** Argues for a moderate line: The hearer must be able to access *relevant, non-trivial* reasons (e.g., general honesty norms, speaker role/credentials) sufficient to support acceptance *in that context*, using unaided faculties.
      *   **Follow-Up:** Who decides what's "relevant" or "sufficient"? Isn't this just smuggling in the very baseline default warrant ("entitlement to trust") you're trying to reduce away, now disguised as a minimal counterfactual ability? If the ability required is *just* enough to minimally support trust, how is this meaningfully different from the anti-reductionist's default?
      *   **Why it Bites:** Presses the "squeeze" directly. The move to moderate, context-sensitive ability risks making the counterfactual condition parasitic on the default warrant it's supposed to replace.

  3.  **Question:** Take the novice case: a young child learning complex, opaque concepts (like germs or word meanings) from caregivers. You say they have crude evidence (caregiver track records, sincerity cues). But how could evidence *that crude* – e.g., "mom usually tells truth about things I understand" – possibly underwrite justification for believing *highly specific, novel, theory-laden* content ("invisible organisms cause disease")? Isn't the gap between the crude speaker-reliability reason and the complex content too wide?
      *   **Predicted Answer:** The justification isn't for the specific complex content *directly* based on crude reasons; it's for accepting the *testimony* based on speaker reliability, and the complex content is transmitted via that accepted testimony.
      *   **Follow-Up:** But if the child's accessible reasons only support a *very generic* reliability ("mom tells truth about observable things"), how can they justify accepting testimony about the *unobservable*? Doesn't this force you to say the child *must* have access (counterfactually) to reasons about the speaker's *domain-specific* competence for the novel domain, which seems implausible for a novice?
      *   **Why it Bites:** Challenges the sufficiency of generic speaker-reliability reasons for complex content, pushing towards implausible demands for novice domain-specific knowledge.

  4.  **Question:** Consider non-human sources: a highly reliable translation app, weather API, or database output. There's no speaker offering assurance or taking responsibility. Trust in a person seems irrelevant. Yet, if I *could* in principle sample its reliability (run tests, check specs), reductionism seems to easily grant testimonial warrant. Assurance-based views struggle here. Does your view handle this smoothly?
      *   **Predicted Answer:** Likely embraces this as a strength: Yes, warrant comes from the accessibility of reasons concerning the system's reliability profile, no interpersonal trust needed.
      *   **Follow-Up:** Great. So, according to your view, is the warrant I get from a well-calibrated, testable machine *epistemically better* (more robust, less dependent on contingent social factors) than the warrant I get from my colleague's assertion? And is the *only* difference between machine-output and human-testimony warrant merely pragmatic (e.g., blame, accountability), not epistemic?
      *   **Why it Bites:** Forces a concession that might seem counterintuitive (machine warrant being epistemically superior) and questions if the interpersonal aspect is merely pragmatic, potentially undermining core motivations for reductionism focused on speakers.

  5.  **Question:** Sticking with non-human sources: What if a system's reliability is genuinely *opaque* to the user? A proprietary black-box algorithm, a complex database whose workings I cannot access or understand, even counterfactually. If pressed, I *could not* marshal reasons about *its* reliability. Does your view deny testimonial warrant in such cases?
      *   **Predicted Answer:** Likely yes, warrant would be absent because the counterfactual condition fails – the user cannot access relevant reliability reasons.
      *   **Follow-Up:** Is this the desired result? Doesn't this imply that ordinary people lack warrant for believing outputs from ubiquitous opaque systems (medical diagnostics, credit scoring, complex news algorithms) unless they become experts? Isn't this an over-intellectualized, skepticism-inducing consequence of requiring counterfactual access to *system-specific* reliability?
      *   **Why it Bites:** Highlights a potentially radical skeptical consequence for modern epistemic practices reliant on opaque systems, testing the cost of the "could" requirement.

  6.  **Question:** Your required counterfactual reasons focus on the *speaker* (or source): competence, honesty, track record. But suppose the only thing a hearer *could* produce if pressed is a reason bearing solely on the *content*: "It coheres perfectly with my existing beliefs," or "This would be widely reported if true." If such purely content-based reasons suffice, hasn't your view collapsed into a form of coherentism or default content-acceptance, abandoning reductionism?
      *   **Predicted Answer:** No, speaker-based reasons are essential. But they can be *generic* (e.g., "people in this role are generally competent," "assertions like this are usually sincere").
      *   **Follow-Up:** If generic speaker-based reasons suffice ("people are mostly honest"), how is this different from the anti-reductionist's default entitlement? And crucially, doesn't relying on generic reasons mean the hearer's justification is ultimately grounded in a *default presumption* about speakers/assertions, not in their individual ability to access specific reasons?
      *   **Why it Bites:** Challenges the distinction between reductionism and anti-reductionism if the required "reasons" are just thin, generic presumptions about speakers.

  7.  **Question:** Is counterfactual reductionism primarily a thesis about the *metaphysical source* of testimonial warrant (it's transmitted, not generated, and the counterfactual ability reflects this potential grounding), or is it a *normative requirement* guiding how a responsible hearer *ought* to manage their testimonial beliefs (they should be such that they *could* justify them with speaker-reasons)?
      *   **Predicted Answer:** Likely emphasizes the metaphysical source (transmission requires a potential ground).
      *   **Follow-Up:** If it's primarily metaphysical, what is the *practical cash value* for the hearer? Does it offer any concrete guidance beyond the anti-reductionist's "trust responsibly"? For instance, what does it tell my student who believes everything she reads? Just that she *could* potentially find reasons? That seems inert.
      *   **Why it Bites:** Questions the practical significance and normative force of the view if it's just a metaphysical claim about warrant's origin, potentially making it inert for epistemology's critical/regulative aims.

  8.  **Question:** Consider a hearer in a high-stakes situation where they *do* reflect and realize their counterfactual ability is weak (e.g., they vaguely recall the speaker is usually reliable, but can't access specifics). According to your view, did they *lack* warrant *before* they reflected? Or does reflection merely reveal a pre-existing lack?
      *   **Predicted Answer:** Likely the latter: Reflection reveals the warrant was absent all along because the counterfactual condition wasn't robustly satisfied.
      *   **Follow-Up:** Doesn't this commit you to widespread *actual skepticism* masked only by a lack of reflection? If warrant depends on a counterfactual ability most people never exercise or test, and which often fails under scrutiny, isn't the vast majority of our testimonial belief unwarranted until proven otherwise – which we never actually do?
      *   **Why it Bites:** Pushes the view towards a radical skepticism about ordinary belief, revealing the potential gulf between the counterfactual condition and actual epistemic practice. This is the culmination of the "squeeze" and the challenge to the modal move.

  **Sequence Logic:** Starts with clarifying the core "could" (Q1), immediately applies pressure via the squeeze (Q2), then tests application to hard cases (novices Q3, machines Q4/Q5), probes a potential collapse point (Q6), questions the view's nature/purpose (Q7), and ends with a high-stakes reflection scenario revealing potentially radical skeptical consequences (Q8). Each follow-up anticipates the most likely defense and relentlessly targets its vulnerabilities or costs. The focus stays firmly on the internal mechanics and implications, avoiding historical/literature traps.
