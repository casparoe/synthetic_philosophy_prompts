prompt: |-
  I teach a first-year seminar on historiography, and our closing session puts Polybius's cycle of constitutions alongside Ibn Khaldun, Spengler, and Toynbee. I want to end with a poem rather than a summary.

  Please write a sestina whose six end-words correspond one-to-one to the six phases of anacyclosis — kingship, tyranny, aristocracy, oligarchy, democracy, ochlocracy — appearing in that order in the first stanza, rotating by the standard rule thereafter, and all six returning in a three-line envoi. The form itself should carry the cyclical claim: the rotation is a cycle of length six that comes back to its starting arrangement whether or not anyone believes in it, and I would rather the poem's structure show that than have any stanza assert it.

  The content should complicate it. Set the poem in a polity that has read its own cyclical theory: its magistrates keep a ledger of where the city currently stands in the cycle and stage the expected degeneration in advance, crowning the tyrant on schedule and subsidizing the mob on schedule, so that the transition is orderly and nothing is lost. I want the reader to feel the worry that a recurrence which everyone predicts and plans around is not evidence for a cyclical view of history at all — it is self-fulfilling — while the poem's rotation goes on turning regardless of what anyone intends.

  Two further constraints. Arrange the stanzas so that the ochlocracy stanza closes on the end-word that belongs to kingship: let the mob already be speaking in the idiom of the ruler it is about to install. And let the envoi be where the question settles, making something of the fact that the six words return in a stanza of a different shape and length than the one they left. Accuracy matters: a reader who knows Book VI of the Histories should recognize the sequence and its mechanism of degeneration — each good form decaying through the inherited power and corruption of its holders — rather than finding only the slogan that history repeats.

  After the poem, add one sentence of prose saying what the ending commits to, and then a final line in the form \answer{...} containing a single label — circle, spiral, line, or a short phrase of your own — naming the view of recurrence the closing lines actually take.
reasoning: |-
  Hmm, the user wants a sestina about anacyclosis that serves as a teaching tool for historiography. This is quite sophisticated—they're using Polybius's constitutional cycle as the framework but want to complicate it through the poem's structure and content. 

  The core challenge is making the form itself argue cyclicality while the content shows it's artificially maintained. The magistrates' ledger is brilliant—it turns cyclical theory into bureaucratic theater. I must ensure each stanza decay mirrors Polybius: kingship's virtue hardening into tyranny's fear, aristocracy's merit calcifying into oligarchy's nepotism, etc. 

  For the sestina mechanics: the end-words must be kingship/tyranny/aristocracy/oligarchy/democracy/ochlocracy in that order for stanza 1, then rotate per standard sestina rules (last word of prior stanza becomes second in next, shifting right). The envoi needs all six. Crucially, the ochlocracy stanza must end with "kingship" to show the mob already invoking monarchy. 

  The envoi's shorter lines should feel like the cycle resetting mechanically regardless of human belief. That last image—"the ledger's page still turns"—implies the wheel keeps spinning even when recognized as artifice. 

  After the poem, that single-sentence prose coda ("The wheel...") must crystallize the tension between forced performance and autonomous pattern. The \answer{...} label needs to capture both the artificial circle and the underlying linearity of the ledger's pages—hence "simulacrum of a circle." 

  User's clearly thought this through. Their demand for Polybian accuracy suggests they'll catch if I misrepresent degeneration mechanisms (e.g., oligarchy decaying through exclusion, not greed alone). The poem must reward close reading: "subsidized grain" nods to bread and circuses, "chartered mobs" to manufactured unrest. 

  Biggest risk is over-explaining. The sestina's rotation should do the work—no didactic stanzas. Let the magistrates' cold efficiency ("measured steps") contrast with the ochlocracy stanza's chaotic energy that already whispers of kingship.
answer: |-
  ## The Civic Wheel

  The city charts its measured steps through **kingship**,  
  Then hires an actor for the stage of **tyranny**.  
  The best step forward? Planned **aristocracy**  
  Shall yield on cue to licensed **oligarchy**.  
  The vote's rehearsed, a scripted **democracy**  
  Prepares the way for subsidized **ochlocracy**.

  The subsidized rehearsed **ochlocracy**  
  Demands a figurehead, recalls old **kingship**.  
  They chant for bread, this managed **democracy**  
  That paid their rage. The staged **tyranny**  
  Made room for titled trade, that **oligarchy**  
  Which sprang from merit's lost **aristocracy**.

  The founders' dream, that fragile **aristocracy**  
  Of learned men, foresaw this **ochlocracy**  
  And wrote the rules for tempered **oligarchy**  
  To shield the state from failed **kingship**.  
  They mapped the slide from **tyranny**  
  To hollowed, loud **democracy**.

  The hollowed, loud, compliant **democracy**  
  Approves the list set by **aristocracy**  
  To phase in fear, that useful **tyranny**.  
  They subsidize the coming **ochlocracy**,  
  The grain that feeds the fall of **kingship**  
  And clears the path for vested **oligarchy**.

  The vested, smooth, efficient **oligarchy**  
  Tallies the cost of bought **democracy**,  
  Maintains the parks where faded **kingship**  
  Once walked. They train the **aristocracy**  
  To yield the squares to chartered **ochlocracy**  
  And sign the writs for licensed **tyranny**.

  The licensed, brisk, efficient **tyranny**  
  Unlocks the vaults for watchful **oligarchy**  
  And drafts the laws for safe **ochlocracy**.  
  They count the votes for guided **democracy**,  
  Appoint the heirs of blood **aristocracy**,  
  And plan the dawn of fresh **kingship**.

  <center>. . .</center>

  The ledger shows the plan: from **ochlocracy**  
  Back towards the scripted **kingship**,  
  The wheel turns clean through **aristocracy**,  
  Through purchased peace in **oligarchy**,  
  Through counted hands in **democracy**,  
  Through costed fear in **tyranny**—  
  The ledger's page still turns.

  The wheel grinds on precisely because everyone believes they must enact its revolutions, turning theory into self-fulfilling ritual.
  \answer{simulacrum of a circle}
