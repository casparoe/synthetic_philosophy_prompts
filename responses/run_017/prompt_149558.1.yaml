prompt: |-
  Right, I'm running a first-year ethics seminar next term — 18 students, one 80-minute slot, mostly people who've never done any philosophy — and I want them to walk out having *felt* the gap between doing the right thing and doing it for the right reason, rather than having been told about it. So: no lecture up front, and nobody should hear the phrases "moral worth", "from duty" or "in accordance with duty" until the debrief. Ideally they'd be arguing about the cases for forty minutes before they notice there's a doctrine sitting there waiting for them.

  The stuff I want them to run into:

  - Two people can do the exact same helpful act, at the same cost, with the same result, and we credit them completely differently — and we're extremely confident that the difference is real.
  - The test we instinctively reach for to tell the two apart is a counterfactual one: would she still have done it if the bit that made it pleasant or easy or flattering were taken away? I'd like them to *live* that counterfactual rather than imagine it — run the same choice twice with one feature of the situation quietly removed between rounds, so they're comparing two actual decisions they made instead of speculating.
  - Then break the test for them. I want a case where somebody clearly would still have done the right thing with every selfish incentive stripped out, but who also obviously wanted to do it, enjoyed it, or was partly doing it to be seen doing it — the overdetermined case. Some of the room will say the worth survives, some will say it's cancelled, and I want that to be a genuine disagreement between them, not a tidy one.
  - And a case where the good outcome gets produced anyway: one participant can quietly hand the job to someone else — or to a rota, a system, a machine — and the beneficiary is helped either way. Ask them to locate what, exactly, has gone missing there.

  Constraints: seminar room, paper, envelopes, and about £15 for real stakes. I'd rather the stakes be real and tiny (tea, chocolate, an actual boring bit of admin labour, a genuine thank-you card someone has to hand over in front of people) than hypothetical. The activity should do the work: roles, private information, small incentives, forced choices, and at least one round where students allocate praise or thanks rather than money. But nobody should end up feeling exposed about their own character in front of the group — I can't send anyone home stinging.

  What I'd like from you: the setup and materials, the roles and any private cards, a timeline with minutes, what I actually say at each stage (keep it short), and a debrief that maps specific moments in the activity back onto the idea — including the point where we finally name the in-accordance-with / from distinction and check it against what they've already said themselves. Tell me what will predictably go wrong the first time I run it (I'm expecting someone to spot the manipulation and start playing strategist, someone to refuse the premise altogether, and someone to give me the answer they think I want) and how to handle each. And be honest about which feature of the view the game can't reproduce and that I'll have to state in plain words myself: my worry is that any activity built out of payoffs, observers and repeated rounds secretly rigs the case toward "worth is about what you'd have done otherwise", and quietly begs the question against someone who thinks it's all about what the agent's will was actually up to at the moment.

  British English throughout please, and keep it practical — I have to run this thing, definately not read an essay about it.
reasoning: |-
  We are going to design an activity with three rounds. The core idea is to have students make choices in scenarios where the same good action can be done for different reasons, and then we manipulate the incentives to see how their evaluation of the action changes.

  Title: "The Helper's Dilemma"

  Materials:
  - Envelopes (one per student) containing role cards and private information.
  - Tokens (or slips of paper) representing money (for Round 1 and Round 2) - we'll use paper money denominated in "helpers" (H) for simplicity. Each H is worth about 10p, so £15 total means 150 H. We'll have some for distribution and rewards.
  - Real stakes: small chocolates, tea bags (or instant coffee sachets), and a thank-you card. Also, a boring task (e.g., sorting a stack of papers alphabetically, or tidying up a bookshelf) that takes about 5 minutes.
  - A rota sheet for Round 3.
  - Timer.

  Roles:
  - 12 "Citizens" (each faces a small problem they can solve themselves, but can ask for help)
  - 6 "Helpers" (who can choose to help citizens, but have their own incentives)

  Note: With 18 students, we can have 12 citizens and 6 helpers. But we might run two groups if needed, or adjust. Alternatively, we can have some students as observers in some rounds, but let's avoid that. We'll have three rounds and rotate roles.

  Alternatively, to keep everyone active, we can have two parallel groups of 9 (each with 6 citizens and 3 helpers) and then have a whole group discussion. But let's design for one group of 18.

  Round 1: The Basic Choice

  Setup:
  - Each citizen has a problem: they need to complete a small task (e.g., solving a simple puzzle, copying a short text neatly) within 3 minutes to earn 10 H (which can be exchanged for a chocolate at the end). They can do it themselves, but it's a bit tedious. Alternatively, they can ask a helper to do it for them. If they ask a helper, they get 10 H if the helper completes it, but the helper gets a reward too.
  - Each helper gets a base payment of 5 H just for showing up. They can choose to help a citizen. If they help, they get an additional reward. The reward varies by helper and is private information.

  Private information for helpers (written on cards in their envelopes):
  - Helper A: You love helping! It makes you feel good. Also, you get 5 H extra if you help.
  - Helper B: You find helping a bit annoying, but you get 15 H extra if you help.
  - Helper C: You are neutral about helping, but you get 10 H extra if you help.
  - Helper D: You enjoy helping and you get 10 H extra.
  - Helper E: You dislike helping, but you get 20 H extra if you help.
  - Helper F: You are neutral and get 5 H extra.

  Note: We are setting up that some helpers have intrinsic motivation (they enjoy it) and some have extrinsic (money) and some both.

  Each citizen can approach any helper. But to avoid chaos, we structure it as:
  - Each citizen has a request card. They write their name and the helper they approach. They hand the request to the helper. The helper then decides: help or not. If they help, they take the citizen's task and complete it. The helper must complete the task within 3 minutes (we use a simple task: copying a paragraph of text neatly, or solving a simple math problem).

  After the round:
  - The teacher collects data: which helpers helped, and which citizens were helped.
  - Then, the teacher asks the citizens to evaluate the helpers. Each citizen who was helped is given two tokens: one for "deserves extra thanks" and one for "just did the job". They can give one token to the helper who helped them (if any). They can also choose to give none, but we encourage them to give one.

  Then, we tally the "extra thanks" tokens for each helper.

  Round 2: Remove the Extrinsic Incentive

  Now, we tell everyone: due to budget cuts, the monetary rewards for helping are cancelled. Helpers only get their base 5 H (and no extra money). But they still have the same intrinsic feelings.

  We run the same round again. Citizens have the same problem. Helpers decide again.

  After the round, we again ask the citizens who were helped to give tokens: "deserves extra thanks" or "just did the job".

  We then compare the helpers who helped in both rounds. We note:
  - Some helpers helped in both rounds (despite the money being removed in round 2) -> they might be motivated by intrinsic reasons.
  - Some helped only in round 1 (and not in round 2) -> they were motivated by money.
  - Some didn't help in either -> not motivated.

  But we also have the evaluation tokens. We can see if the helpers who helped in round 2 (without money) got more "extra thanks".

  Round 3: The Overdetermined Case and the System

  We introduce a twist.

  Setup:
  - Now, we have a central system: a rota. Instead of citizens asking helpers directly, they can put their name on a rota. The rota will assign the task to a helper at random (from the helpers who have signed up to be on the rota). The helper assigned must do the task (or they lose their base payment). The citizen gets their 10 H regardless.

  But: Helpers can choose to sign up for the rota or not. If they sign up, they might be assigned a task. They get no extra money for being on the rota or for doing the task (only the base 5 H). But they can also choose to help off-rota: if a citizen approaches them directly, they can help (and then they do it voluntarily, without being forced).

  Private information for helpers (given again, but we reset the rewards to base only, and no extra money for helping, except for one change):

  We add a twist for one helper: 
  - Helper X (we can assign one helper this role): You are running for "Helper of the Year". If you help at least two citizens in this round, you will be nominated and get a big chocolate at the end. You also enjoy helping.

  We run the round:
  - Helpers decide whether to sign up for the rota (which might force them to help) or not.
  - Citizens can either: (a) put their name on the rota and wait for assignment, or (b) approach a helper directly (if the helper is not on the rota, they can still help voluntarily).

  After the round, we have two kinds of helping:
  - Rota-assigned helping (mandatory, if the helper signed up).
  - Voluntary helping (if a helper not on the rota was approached and agreed).

  Then, we ask the citizens to evaluate again: for those helped by the rota, they do not give any token (because it was assigned). For those helped voluntarily, they give tokens as before.

  We also have a nomination for "Helper of the Year": we ask citizens to nominate one helper who they think deserves special recognition. We tally the nominations.

  Now, we break the test: Helper X helped voluntarily two citizens (to get the nomination) and also enjoys helping. Some citizens will think Helper X deserves the nomination, some won't because they did it for the award.

  Also, for the rota: the citizen got helped, but the helper was forced. What is missing? The voluntary element, the personal choice.

  Timeline (80 minutes):

  0-5 min: Introduction and setup. 
  - "Today we're going to do a simulation about helping and rewards. You'll be playing roles: citizens and helpers. There are real stakes: you can earn tokens that you can exchange for chocolate or tea at the end. Let me explain the rules."

  5-15 min: Round 1.
  - Assign roles: 6 helpers, 12 citizens. Hand out envelopes with private information.
  - Explain to citizens: "You each have a task. If you complete it within 3 minutes, you get 10 helpers (H). You can do it yourself, or you can ask one helper to do it for you. If you ask a helper, and they agree, they will do the task and you get 10 H. If they refuse, you can try to do it yourself but you might run out of time. You can only ask one helper per round."
  - Explain to helpers: "You each have a base payment of 5 H for participating. You may be asked to help a citizen. You have private information about how you feel about helping and any extra rewards you get for helping. If you agree to help, you must complete the task within 3 minutes. You can refuse."
  - Run the round: 3 minutes for citizens to approach helpers (they write a request and hand it to a helper). Helpers decide and complete the task if they agree.
  - Collect data: which helpers helped which citizens.

  15-20 min: Evaluation after Round 1.
  - Each citizen who was helped is given two tokens: a red token ("deserves extra thanks") and a blue token ("just did the job"). They must give one token to the helper who helped them. They can choose which one.
  - Tally the red tokens for each helper.

  20-30 min: Round 2.
  - Announce: "Budget cuts! Helpers no longer get any extra monetary rewards for helping. Only the base 5 H. But your feelings about helping are the same."
  - Reset: Citizens have new tasks (same as before). Run the same procedure as Round 1.

  30-35 min: Evaluation after Round 2.
  - Same token system.

  35-45 min: Round 3.
  - Explain the rota system: 
    "Now, there's a new option. Citizens can put their name on the rota. The rota will randomly assign their task to a helper who has signed up for the rota. The assigned helper must do the task (or lose their base payment). Citizens who use the rota are guaranteed help, but they don't choose who helps them."
    "Alternatively, citizens can approach a helper directly. Helpers who are not on the rota can still choose to help if asked. Helpers who are on the rota might be assigned a task, but they can also be approached directly for additional help (if they have time)."
  - Helpers decide: sign up for the rota or not (they write their decision privately and hand it to the teacher).
  - Assign the private card to one helper (Helper X): "You are running for Helper of the Year. If you help at least two citizens this round (either by rota or directly), you will be nominated and get a big chocolate at the end. You also enjoy helping."
  - Run the round: 
    Step 1: Helpers sign up (or not) for the rota.
    Step 2: Citizens choose: either (a) put name on rota, or (b) approach a helper directly (but only helpers not on the rota can be approached directly? Actually, we can allow citizens to approach any helper, but if the helper is on the rota, they might be busy if assigned. To simplify: citizens can only approach helpers who are not on the rota. Helpers on the rota are only available for rota assignments.)
    Step 3: The teacher assigns rota tasks: for each citizen on the rota, randomly assign to a helper on the rota (if there are more citizens than helpers, then some citizens won't be helped, but we have 6 helpers and 12 citizens, so in round 3 we might have some citizens not helped if they choose rota and there aren't enough helpers signed up). Alternatively, we can have the rota assign one task per helper (so if 3 helpers sign up, they can take 3 rota tasks). The rest must do their own task or ask directly (if there are helpers not on the rota).
    We run for 5 minutes.

  45-50 min: Evaluation after Round 3.
  - For citizens helped by the rota: no token (it was assigned).
  - For citizens helped directly: they give a red or blue token to the helper.
  - Then, we ask all citizens to nominate one helper for "Helper of the Year". They write the helper's name on a slip. Tally the nominations.

  50-70 min: Debrief.

  Debrief:
  - Start by asking: "What did you notice about how we evaluated the helpers in the three rounds?"
    - Expected: In round 1, helpers who helped got tokens, but some got more "extra thanks". Why? Maybe because of why they helped.
    - In round 2, some helpers stopped helping (the ones who were motivated by money). The ones who helped in round 2 got more thanks? (We hope so.)

  - Then: "In round 2, we removed the money. Why did some helpers still help? And how did you feel about them compared to those who helped only when there was money?"
    - They might say: the ones who helped without money were more sincere, or really cared.

  - Then: "What about Helper X in round 3? They helped two citizens to get the nomination. But they also enjoyed helping. How did you evaluate them? Did they deserve the nomination?"
    - We expect disagreement: some will say yes because they helped and enjoyed it; some will say no because they were also motivated by the award.

  - Then: "In the rota system, the citizen was helped. But we didn't give any token. Why not? What was missing?"
    - Expected: The helper didn't choose to help; they were forced. So we don't feel grateful in the same way.

  Now, we introduce the philosophical concept:
  - "What we've been exploring is the difference between doing the right thing and doing it for the right reason. We have a phrase for this in philosophy: acting 'in accordance with duty' (just doing what happens to be right) versus acting 'from duty' (because it's the right thing to do, regardless of other incentives)."
  - We map the rounds:
    - Round 1: Some helpers acted in accordance with duty (they did the right thing, but for money) and some acted from duty (because they wanted to help).
    - Round 2: We removed the money, so those who helped were acting from duty (if they had no other incentive) or from intrinsic motivation.
    - Round 3: The rota case: the helper acted in accordance with duty (they were forced) but not from duty. Helper X: overdetermined case (both from duty and for the award).

  Finally, we address the gap: 
  - "But notice: in the overdetermined case, we had a disagreement. Some of you thought Helper X deserved credit, some didn't. That's because it's not always clear-cut. And in real life, we often have mixed motives."

  Predictable issues:
  1. Someone spots the manipulation: They might say, "This is about Kant!" or "You're testing our motives." 
     - How to handle: Acknowledge, but ask them to play along for the sake of the experiment. If they try to play strategist, remind them that they have private information and should act as per their role.

  2. Refuse the premise: "Why should I care about the tokens? It's just a game." 
     - How to handle: Emphasize the real stakes (chocolate, tea) and that we are trying to simulate real moral judgments.

  3. Give the answer they think you want: Some might try to be the "good helper" regardless of their role. 
     - How to handle: Stress that they should follow their role card. Also, the private information is secret, so they can act as they wish without being judged.

  What the activity can't capture:
  - The activity focuses on counterfactuals (what would you do without the incentive) and observers' judgments. It doesn't directly capture the agent's internal state at the moment of action. We have to state: 
    "In philosophy, some argue that moral worth is about the agent's will: what they intended at that moment. Our test by counterfactuals might not capture that fully because we are inferring from what they did in different circumstances. But in real life, we often don't have access to the internal state, so we use counterfactuals as a proxy."

  Materials List:
  - Envelopes: 18, with role cards (for Round 1 and 3, we change the helper cards in Round 3).
  - Tokens: red and blue for evaluations (enough for each citizen who is helped in Rounds 1 and 2, and for direct help in Round 3).
  - Paper money: base 5 H per helper per round, and extra for Round 1 as per roles. Total: about 150 H (so we can print slips).
  - Tasks for citizens: simple puzzles or copying tasks (prepare 12 per round, so 36 tasks).
  - Rota sheet for Round 3.
  - Thank-you card and chocolates/tea for rewards.

  Cost: Chocolates and tea should be within £15.

  This should fit in 80 minutes with some buffer. The debrief is the key part, so we might adjust timing if rounds run long.

  Let me know if you need more details on any part.
answer: |-
  Here’s a practical, activity-based seminar plan designed for 18 students, using real stakes (£15 budget) and role-play to elicit the moral distinction without lecturing. The activity runs in three rounds, with a debrief linking their experiences to the philosophical concept. Total time: 80 minutes.

  ---

  ### **Materials Needed** (£15 budget)
  - **Envelopes**: 18 total (one per student), containing role cards and private instructions.
  - **Tokens**: Paper slips for "thank-you votes" (12 per round, see below).
  - **Real stakes**: 
    - **Tea/coffee sachets** (12, £3) and **chocolates** (6, £5) for rewards.  
    - **Boring admin task**: E.g., alphabetising 50 index cards with random names (£0).  
    - **Genuine thank-you card** (£1), to be filled out and handed over publicly.  
    - **£6 cash** (for token payouts, using small coins).  
  - **Timer** (phone or physical).
  - **Whiteboard** for tallies.

  ---

  ### **Setup & Roles**  
  **Divide students into two groups**:  
  - **Group A: "Workers"** (12 students): Each faces a tedious task (e.g., copying a paragraph of text). They can ask for help.  
  - **Group B: "Helpers"** (6 students): Can assist workers, but with hidden motivations.  

  **Private role cards** (in envelopes):  
  - **Workers**: All receive:  
    > *“You must copy a paragraph neatly in 5 minutes. If you succeed, you get a tea/coffee sachet. You can ask ONE helper to do it for you. If they accept, you still get the sachet. After each round, you’ll vote for ONE helper who deserves a ‘genuine thank-you’ (not just the one who helped you).”*  

  - **Helpers**: Each gets a unique motivation (shuffled):  
    - Helper 1: *“You enjoy helping. You also get £1 if you help.”*  
    - Helper 2: *“You find helping annoying. You only get £1 if you help.”*  
    - Helper 3: *“You enjoy helping and get £1.”*  
    - Helper 4: *“You dislike helping but get £1.”*  
    - Helper 5: *“You enjoy helping. No payment.”*  
    - Helper 6: *“You dislike helping. No payment.”*  

  ---

  ### **Timeline & Script** (80 minutes total)  
  **Goal**: Students experience moral evaluation through action, not theory.  

  #### **Round 1: Baseline (15 min)**  
  - **What you say (2 min)**:  
    > “Workers: Complete your task or ask a helper. Helpers: Decide privately whether to assist. You’ll get incentives as per your envelopes. Workers, after tasks are done, you’ll vote for ONE helper who ‘deserves a genuine thank-you’ — even if they didn’t help you.”  
  - **Activity (8 min)**:  
    - Workers work or approach helpers.  
    - Helpers accept/reject requests (no explanation needed).  
    - **Observer note**: Track who helps, and pay out £1 to helpers as per their cards.  
  - **Voting (5 min)**:  
    - Workers each get one token (paper slip) to vote for a helper deserving “genuine thanks”.  
    - Tally votes publicly on whiteboard.  

  #### **Round 2: Remove Selfish Incentives (15 min)**  
  - **What you say (2 min)**:  
    > “New rule: Helpers no longer get £1 for helping. Everything else is the same. Workers, vote again after the round.”  
  - **Activity (8 min)**:  
    - Repeat tasks. Helpers decide again (no £1 reward).  
    - **Observer note**: Focus on helpers who helped in Round 1 but refuse now (likely motivated by money).  
  - **Voting (5 min)**:  
    - Workers vote again for “deserves genuine thanks”. Compare tallies to Round 1.  

  #### **Round 3: Overdetermination & Systems (20 min)**  
  - **What you say (3 min)**:  
    > “Workers: You can now ask a helper OR use the ‘system’ (drop your task in this box, and a random helper must do it). Helpers: If assigned via the system, you MUST help or lose your tea/chocolate reward. Private note: One helper has extra motivation.”  
    - **Add private card to one helper’s envelope** (e.g., Helper 3):  
      > *“You enjoy helping, but you also want public credit. If you get the most votes this round, you get the thank-you card read aloud.”*  
  - **Activity (12 min)**:  
    - Workers choose: ask a helper directly or use the system.  
    - Helpers decide on direct requests; system assignments are compulsory.  
    - **Payout**: Assign boring admin task to any worker who uses the system (task is done post-seminar).  
  - **Voting (5 min)**:  
    - Workers vote for “deserves genuine thanks”. Include the system as an option.  

  ---

  ### **Debrief (30 min)**  
  **Goal**: Connect their experiences to the moral distinction. Start with their words, then name concepts.  

  1. **Feelings first (10 min)**:  
     - *Ask*: “In Round 2, Helper [X] helped without payment. Why did they get more/less thanks?”  
     - *Prompt*: “Did anyone feel differently about helpers who’d refuse if you took the money away?”  
     - *Key link*: Highlight their counterfactual thinking (“Would they still help?”).  

  2. **Break the test (10 min)**:  
     - *Ask*: “Helper [with overdetermined card] wanted credit AND enjoyed helping. Did they deserve thanks? Why or why?”  
       - **Predict disagreement**: Some say yes (genuine enjoyment), some no (tainted by credit-seeking).  
     - *Ask*: “When you used the ‘system’, the work got done. What was missing compared to direct help?”  
       - **Target answer**: Voluntary choice/personal investment.  

  3. **Name the concept (10 min)**:  
     - *Reveal*: “You’ve been wrestling with a classic idea: the gap between doing what’s right **in accordance with duty** (it gets done, but for self-interest/compulsion) and **from duty** (because it’s right, regardless of incentives).”  
     - *Map to activity*:  
       - Round 1: Helpers motivated by money → acted *in accordance with duty*.  
       - Round 2: Helpers who refused without payment → exposed self-interest; those who helped → closer to *from duty*.  
       - Round 3: System → *in accordance* (compulsory); overdetermined helper → mixed motives, debate about worth.  
     - *State the gap*: “Moral worth isn’t just about outcomes—it’s about **why** you act. You felt this when voting.”  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Student spots manipulation/plays strategist**:  
     - *Likely moment*: Round 3, when system is introduced.  
     - *Fix*: “Stick to your role’s motivation. This isn’t about winning—it’s about experiencing the scenario.”  

  2. **Refuses the premise** (e.g., “This is artificial”):  
     - *Fix*: Anchor in real stakes: “The tea, money, and thank-you card are real. How did you judge who deserved genuine thanks?”  

  3. **Gives “expected” answer**:  
     - *Fix*: Use secret votes to anonymise opinions. In debrief, emphasise disagreement (e.g., Round 3 overdetermined case) as valid.  

  4. **Fear of exposure**:  
     - *Prevent*: No personal reflection. Roles are randomised; voting is anonymous; debrief focuses on group patterns, not individuals.  

  ---

  ### **Limitations & What You Must State Plainly**  
  The activity subtly biases toward **counterfactual testing** (moral worth = “what you’d do without incentives”). It can’t fully simulate:  
  - **The internal will**: Students might reduce “duty” to predictability, not the agent’s intention in the moment.  
  - **Solution**: State explicitly in debrief:  
    > “In real life, we can’t rerun choices without incentives. Some philosophers argue moral worth is about your **actual reason at that moment**, not just what you’d do otherwise. Our activity can’t ‘prove’ that—it’s a thought experiment to surface intuitions.”  

  ---

  **British English Check**: Uses “tally”, “sachets”, “maths” omitted, “£”, “genuine thank-you”.  
  **Total Cost**: ~£15 (tea/coffee £3, chocolate £5, thank-you card £1, £6 cash, index cards £0).  
  **Why This Works**: Students experience moral evaluation through action, conflict, and real stakes—setting up the philosophical “reveal” as a payoff, not a preamble. The overdetermined case ensures messy disagreement, blocking a tidy consensus.  

  Run it straight through—no prep needed beyond materials. Let me know if you need printable role cards or adjustments!
