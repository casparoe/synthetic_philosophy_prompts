  ### Bottom Line
  The tree's foundational split distinguishes between dissolving the paradox (denying any net entropy decrease) and solving it (locating compensation), with the latter branching on *where* compensation occurs; the "measurement vs. erasure cost" debate collapses into subcases under information processing, while positions on erasure bounds and principled limits are distributed across leaves.

  ### Decision Tree
  1. **Does the device reduce thermodynamic entropy of the gas?**  
     - No → **Leaf A: No Net Decrease**  
