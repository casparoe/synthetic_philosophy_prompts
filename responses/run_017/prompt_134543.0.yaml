  ### Leaf Descriptions  
  - **A: No Net Decrease**  
    - *Label:* Apparent violation via noise or ignorance (epistemic entropy).  
    - *Awkward commitment:* Must deny observable entropy decrease is thermodynamically significant.  
    - *Examples:* Lazy demon (fixed schedule), ratchet/pawl in same bath.  
    - *Conventional name:* Unnamed.  

  - **B: Second Law Violation** (empty)  
