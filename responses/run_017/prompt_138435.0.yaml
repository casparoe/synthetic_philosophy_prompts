  Okay, let me start by unpacking the user's query. They teach a seminar on agency and free will and have encountered a specific configuration they call "rigidity at the meta-level." They describe agents who are flexible in their actions but only under a fixed rule that dictates when to reconsider. The examples include a colleague who only updates syllabi annually, a friend who revisits career plans only on birthdays, and ethological examples where flexibility exists during routine acquisition but not execution.

  First, I need to understand the core issue: the tension between lower-level flexibility and higher-level rigidity. The user isn't satisfied with terms like stubbornness or akrasia because the agents are following their own judgments about when to judge. They mention the regress problem—if the higher rule is revisable at another scheduled time, does that just shift the rigidity up a level? And what would stop this regress?

  I recall related concepts in philosophy. Hierarchical theories of agency, like Frankfurt's or Bratman's, involve higher-order volitions or policies. Bratman's planning agency includes self-governing policies that are stable but revisable. The user's cases seem like a form of temporal bracketing, where agents restrict flexibility to certain times. This connects to Ulysses contracts, where precommitments bind future actions. 

  The user wants a term for this meta-rigidity. Possible terms include "procedural rigidity," "temporal bracketing," or "meta-stability." But none fully capture the scheduled inflexibility. "Scheduled meta-rigidity" might be descriptive but clunky. I should check if there's an existing term. Bratman's "temptation-insulated planning" comes close, focusing on shielding plans from reconsideration. 

  The deeper issue is the regress. If each level of rule can be revised at a higher scheduled time, when does it end? The user hints that true agency requires terminating the regress in non-rigid flexibility. This touches on foundational debates about rules and autonomy. Maybe Wittgenstein's rule-following paradox is relevant here, but that might complicate things. 

  I need to address the edge cases. If a meta-rule is revisable at another time, is the rigidity just relocated? Yes, unless the highest rule isn't time-bound. But what would that look like? Perhaps a commitment open to constant revision, but that risks paralysis. The user's examples show agents avoiding this by having fixed times for revision, trading constant flexibility for structured agency. 

  The user's real concern might be reconciling structured agency with free will. If all flexibility rests on a rigid foundation, is it truly free? This challenges the standard view that flexibility defines agency. The answer might lie in seeing the meta-rules as enabling conditions, not constraints. By limiting when to reconsider, agents can act effectively without being overwhelmed. 

  In conclusion, I should synthesize terms from philosophy, clarify the regress issue, and suggest that terminating the regress might involve embracing a foundational commitment that's identity-constituting, thus not rigid in the same way. Terms like "temptation-insulated planning" or "diachronic self-governance" could be useful, but the concept might need a new term like "scheduled meta-rigidity."
answer: |-
  What you're describing is a profound and under-analyzed structure in agency theory—**procedural meta-rigidity** or **scheduled flexibility**. While no single term perfectly captures it across all disciplines, I'll synthesize the conceptual landscape, address your core questions, and propose a precise framing.

  ### Core Concept & Terminology
  This is **flexibility nested within a rigid metacognitive framework**. Key terms from philosophy and cognitive science converge here:
  1. **Temporal Bracketing** (Bratman): Deliberately restricting revision to predefined temporal windows.
  2. **Temptation-Insulated Planning** (Holton): Policies shielding intentions from reconsideration.
  3. **Procedural Rigidity** (Dreyfus): Rule-bound cognitive phases in skilled action.
  4. **Meta-Stability** (Dynamic Systems Theory): Flexibility constrained by attractor states.

  The most fitting *term of art* is **Bratmanian Meta-Policy Rigidity** (highlighting Bratman's planning theory) or **Procedural Scaffolding**. For seminar use, **Scheduled Meta-Rigidity** balances precision and accessibility.

  ### Distinguishing Features (vs. Stubbornness/Akrasia)
  - **Endorsed Constraint**: Agents *judge* that rigidity optimizes agency (e.g., avoiding decision fatigue).
  - **Second-Order Rationality**: The rule governs *when* to exercise first-order rationality.
  - **Non-Aversive**: Unlike akrasia, no conflict exists between meta-policy and action.

  ### The Regress Problem: Your Edge Question
  **Yes, relocating revision to a "higher" scheduled time merely displaces rigidity—unless the regress terminates in a non-scheduled foundation.** Consider:

  | **Level**          | **Example**                          | **Rigidity Status**       |
  |---------------------|--------------------------------------|---------------------------|
  | Action Execution    | "Stick to syllabus during term"      | Rigid (by policy)         |
  | Revision Policy     | "Revisit syllabus only each August"  | **Meta-Rigid** (focal issue) |
  | Policy-Revision Rule| "Re-evaluate revision policy every 5 years" | Still Scheduled (regress continues) |
  | **Termination Point** | Foundational commitment/identity    | **Non-Rigid** (if "always open" in principle) |

  **Terminating the Regress** requires anchoring in:
  - **Identity-Constituting Commitments** (Korsgaard): "I am a teacher" implies openness to syllabus-relevant reasons *when they threaten core identity*. Your colleague's policy might flex if a new edition *invalidated her field*.
  - **Dynamic Attunement** (Dreyfus): Expert agents bypass rules via situational sensitivity. If campus closure *felt like an existential disruption*, not just a "syllabus change," rigidity might dissolve.
  - **Crisis Override**: Built-in exceptions for catastrophic failure (e.g., "revise mid-term if >50% students fail").

  **Paradox**: Pure unscheduled openness would collapse into dithering. Agency *requires* some "stopping rules" (Bratman). True termination isn't rulelessness—it's grounding in **practical identity** responsive to *existential* threats.

  ### Why This Isn't Just Rule-Application Regress
  While all rules require interpretation, your cases involve **deliberate temporal partitioning of cognitive labor**:  
  - **Acquisition Phase**: Open, exploratory, reason-responsive.  
  - **Execution Phase**: Closed, efficient, protected from reconsideration.  
  The rigidity isn't an oversight—it's a *feature* to conserve resources. Ethologically, this matches **prepared learning** (fixed acquisition windows) + **fixed action patterns**.

  ### Philosophical Implications for Agency
  This challenges **reflexivity triumphalism** (that true agency requires constant meta-cognition). Your examples show:
  - **Agency through Self-Limitation**: Binding oneself to avoid reconsideration *enhances* efficacy.  
  - **The Myth of Total Flexibility**: All agents rely on unchallenged background commitments (Wittgenstein's "hinges").  
  - **Temporal Structure of Autonomy**: Freedom isn't atemporally "open"; it's distributed across phased cognitive modes.

  ### Suggested Terminology for Your Seminar
  - **Primary Term**: **Scheduled Meta-Rigidity** (descriptive clarity).  
  - **Technical Term**: **Procedural Scaffolding** (emphasizes enabling function).  
  - **For the "Edge"**: **Regress-Terminating Ground** (for identity/contingency foundations).

  ### Conclusion
  This structure isn't a *failure* of agency but its **scaffolded expression**. The rigidity isn't infinite—it yields to crises or identity threats. Your insight reveals that agency's "flexibility" is always **phasic** and **resource-aware**, not omnipresent. To resist mechanism, agency needn't be infinitely recursive; it must merely anchor in commitments that *can* be re-examined when the world *forcefully* intervenes—not just when the calendar flips. This reframes free will as **strategically modulated responsiveness**, not constant openness.
