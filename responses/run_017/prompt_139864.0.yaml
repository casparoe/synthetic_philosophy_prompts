answer: |-
  ## The Answerability Condition: A Defence

  Let me first steelman the thesis. The answerability condition holds that an illocutionary act (e.g., promising, warning, ordering, resigning) is constituted not merely by the speaker's utterance, intentions, conformity to convention, and circumstantial felicity, but fundamentally by the establishment of a specific normative relation: the speaker becomes *answerable to* a second party for having performed that act. Being "answerable to" requires more than the hearer recognising the speaker's intention (mere recognition). It entails that the second party gains a specific normative standing: the *authority* to call upon the speaker to account for the act, to hold them to its normative consequences (e.g., demanding fulfillment of a promise, acting upon a warning, respecting a refusal, treating a resignation as binding), and potentially to sanction failures (e.g., through blame, reproach, or invoking institutional consequences). This relation is asymmetrical; the second party gains a right over the speaker concerning the act. Crucially, this relation must be *actual*, not merely potential or intended. If this normative relation does not materialise with *some* second party (not necessarily the initially intended hearer), no illocutionary act has occurred. At most, we have an "utterance with the shape of one" – a failed attempt or a simulacrum.

  This is distinct from the weaker, popular claim that illocutionary success requires *recognition* of the intended force by a hearer. While recognition might often *facilitate* answerability, it is neither sufficient nor necessary for it. A hearer might recognise an intention (e.g., "he meant that as a promise") yet lack the standing or the context to hold the speaker answerable (e.g., an eavesdropper). Conversely, answerability might arise without the hearer correctly identifying the *intended* force, as we'll see in mis-uptake. The weaker recognition condition leaves the *normative power* of illocution unexplained. Why does a successful promise *bind* me in a way a mere expression of intention does not? Why does a valid resignation *dissolve* my employment? Recognition explains understanding, but answerability explains obligation and authority – the very engine of illocutionary force.

  **Three Independent Arguments for Answerability**

  1.  **The Argument from the Nature of Illocutionary Obligation:** Illocutionary acts inherently create or invoke distinct normative positions (rights, obligations, authorities, statuses). A promise creates an obligation *to the promisee*; a warning generates a right *for the warned* to rely on it and potentially blame; a resignation dissolves obligations *towards the employer*. These obligations and rights are inherently *relational* and *second-personal*. They exist *between* specific parties. Crucially, these norms are *enforceable*; the promisee can call the promisor to account. If the obligation existed solely by virtue of the speaker's intention and convention, it would be inexplicable why the *specific party* addressed (or the relevant party in cases of misdirection) holds the unique authority to demand fulfillment or levy reproach. The answerability relation *is* this second-personal normative structure. Without it, we have, at best, a speaker's self-imposed commitment or declaration, lacking the distinctive interpersonal obligation definitive of illocution like promising.

  2.  **The Argument from the Public Constitution of Social Acts:** Illocutionary acts are social acts; their force depends on shared conventions and public norms. These conventions don't merely provide a code for expressing private intentions; they establish public frameworks of accountability. The convention of promising isn't just a signal for "I intend firmly"; it's a public mechanism for creating a publicly acknowledged debt *owed to someone*. For such a public status to be instantiated, it must be anchored in the public, normative space *between* individuals. A purely private "act" – words spoken with perfect intention and convention, but entirely unanchored in any relationship of accountability – remains merely subjective. Its purported normative consequences (the obligation, the change in status) lack public reality. Answerable uptake provides this public anchor. It signifies that the relevant community (even if just two people) has registered the act within the normative framework, making its consequences socially real and enforceable. The act's *existence* as a social fact requires its entry into the space of public accountability.

  3.  **The Argument from the Phenomenology of Failure:** Consider attempts at illocution that lack answerability. Shout a promise into an empty canyon with perfect intention and convention: it feels hollow, uncompleted, not a *real* promise. Tell a secret to someone you later discover was deaf: you disclosed, but you didn't *tell* them. Attempt to resign by muttering into your pillow. The intuition that "nothing really happened" isn't just about lack of effect (perlocution); it's that the *act itself* seems unrealised. Conversely, when answerability *is* achieved, even if recognition was flawed (mis-uptake), the act *takes hold* in the social world; consequences flow *from the act as performed*, not just the act as intended. The feeling that the act is "complete" correlates strongly with the establishment of this normative hold. This phenomenology suggests that the core of illocution lies not in the speaker's internal event plus convention, but in the successful imposition of a public, normative relation.

  **Confronting the Hard Cases**

  *   **The Unread Resignation:** The answerability condition yields the same verdict throughout: no resignation occurred. Emailing a resignation to an address known to be unmonitored, speaking to a sleeping manager, pinning it to an empty board – all lack the constitution of an answerability relation. The speaker has *attempted* to resign, but the act requires uptake that establishes the manager/employer's standing to hold the speaker to it – to cease assigning duties, to process final pay, to acknowledge the termination. Without that uptake, the employment status remains unchanged. The speaker hasn't *done* the resigning. The intuition that "she sent it, so she resigned" confuses the attempt with the completed act. The cost is counterintuitive, but the gain is conceptual clarity: resigning fundamentally alters a public, normative status relation; such an alteration requires the other party's position in that relation to be activated through uptake. A resignation only *counts* when it can *be counted* by the relevant authority.

  *   **The Deathbed Promise:** This is genuinely hard. Intuitions scream "He promised!" The answerability condition, however, dictates: no promise was made *to the dying friend*. The normative relation essential to promising – the friend having standing to demand fulfillment or hold the speaker accountable – cannot be established with an unresponsive, dying, and soon-deceased person. The speaker may have made a solemn *vow*, a *commitment*, or expressed an intention governed by a sense of duty *to the friend's memory* or *to themselves*. But these lack the specific second-personal obligation *to the promisee* that defines a promise. The promisee must be capable of being a party to the relation, even if only minimally (e.g., by being addressed while conscious, establishing a prior normative link). To hold otherwise is to conflate promising with other forms of commitment. The intuition's strength stems from the speaker's profound sincerity and the gravity of the context, but it mistakes the *nature* of his commitment. The cost is denying a powerful intuition; the gain is preserving the strict relational definition of promising against dilution into mere intense self-commitment. (One *could* soften the view: if the dying friend *was* minimally responsive at the moment of utterance, perhaps fleeting uptake occurred. But if truly unresponsive, no promise *to them* was constituted.)

  *   **Mis-uptake:** This is where the view shines. The driver's utterance, intended as a warning, is taken as a threat. The answerability condition predicts: an illocutionary act *was* performed, but it was a *threat*, not a warning. Why? Because the normative relation actually established is that of threatener and threatened. The hearer gains the standing to view the speaker as hostile, to act defensively, to perhaps report a threat, and to hold the speaker accountable *as a threatener*. The speaker intended the relation of warner/warned (where the hearer can rely on the info and blame if it's negligent), but that relation wasn't constituted. The woman's "no," intended as a refusal but not heard as such, similarly fails *as a refusal*. The hearer does not gain the standing to treat her as having refused, to respect her boundary, or to hold her accountable for refusal. The act performed might be an assertion ("I am saying no") or simply a failed attempt at refusal. The gain is significant: it explains why the *social reality* of the act – how it functions normatively between the parties – is determined by the uptake that *actually establishes the answerability relation*, not by the speaker's hidden intention. It captures why the speaker might be *held responsible* for the threat, even if unintended.

  *   **Promises to No One:** The view predicts these are not genuine promises. A New Year's resolution aloud to oneself: This is a *commitment* or *resolution*, but no second party exists to hold the speaker answerable. The speaker might hold *themselves* accountable, but this self-relation lacks the asymmetry and second-personal authority of a promise. A graveside promise: Similar to the deathbed case. One might make a vow *to the memory* or a commitment *to oneself*, bound by respect or love, but the deceased cannot hold the speaker answerable. A proclamation to the world: This may constitute a *declaration* (if institutional conventions are in play) or a *pledge*, but not a promise *to* the world. "The world" lacks the specific, delineated standing of a promisee; no particular person can claim *the right of a promisee* against the speaker. These are important speech acts, but they lack the specific relational structure of promising. Classifying them otherwise obscures what makes a promise unique.

  **Costs and Gains: Recalibrating Speech Act Theory**

  *   **Misfires vs. Abuses:** The answerability condition fundamentally reshapes this distinction. Traditionally, a misfire (e.g., a "promise" made under duress where convention forbids it) voids the act, while an abuse (e.g., an insincere promise) performs the act but violates its sincerity condition. On the answerable uptake view:
      *   **Misfires:** Include failures to establish the answerability relation *and* conventional defects that prevent the relation from forming correctly (e.g., the wrong person speaking). The unread resignation is a misfire due to lack of uptake.
      *   **Abuses:** Primarily concern *violations within an established answerability relation*. The insincere promise *is* performed – the promisor *is* answerable to the promisee – but the promisor abuses that relation by lacking the requisite intention. The "hollowness" stems from the speaker's violation of the norms governing the existing relation, not from the relation's absence.
      This unifies many failures (lack of authority, lack of uptake, lack of conventional prerequisites) as preventing the act's very existence (misfire), while abuses occur only once the normative relation is in place. It's a unification, not a collapse, based on the fundamental condition for the act's existence.

  *   **Illocutionary vs. Perlocutionary:** The contrast becomes cleaner. The illocutionary act *is* the successful establishment of the answerability relation itself (e.g., placing oneself under the promisee's authority). The perlocutionary effect (e.g., reassuring the promisee, making them happy) is a consequence *of* that established relation and its subsequent unfolding. Answerability is the *doing*, not the *consequence* of doing. It moves the illocutionary further from the speaker's intention/utterance (making it more relational) and further from the perlocutionary consequence (making it the normative precondition for those consequences).

  *   **The Costly Trade:** The single most entrenched commitment that must be abandoned is the **primacy of speaker intention and convention as the sole generators of illocutionary force**. The standard view holds that the speaker, by wielding conventions with the right intentions, *performs* the act, and uptake is a separate effect. The answerability condition makes uptake (specifically, answerable uptake) *constitutive* of the act. The speaker's action is necessary but insufficient; it requires a specific kind of reception to come into being as that social fact. This is a significant shift.
      **Is the trade worth it?** Absolutely. The gain is a theory that directly explains the *normative engine* of illocution – why promises obligate, why orders command, why resignations terminate. It provides a unified framework for understanding the public, social reality of these acts, their dependence on relationality, and the phenomenology of success and failure. It handles mis-uptake not as a peripheral problem but as revealing the core relational nature of illocution. While demanding we revise some intuitions (deathbed, unread resignation), it offers a more robust and philosophically satisfying account of what it means to *do things with words* in a shared normative world. The cost is abandoning speaker-centrism; the gain is capturing the essence of illocutionary force as a bond of answerability.
