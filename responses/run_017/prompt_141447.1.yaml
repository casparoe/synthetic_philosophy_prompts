  ### Applying the Principle to New Cases
  Use the three criteria (**coherence**, **causal depth**, **robustness**) as a checklist:

  1. **"What the user wants to hear" vs. "What is true" direction**:
     - ✅ **Yes** if: 
       - It's **coherent** (distinct communicative goals), 
       - **Causally deep** (clamping swaps answers *systematically* across topics; not just prompt hacking),
       - **Robust** (works OOD for unseen questions).
     - ❌ **No** if: Effects are brittle or reduce to simple word associations.

  2. **"I am about to write a poem" direction**:
     - ✅ **Yes** if: 
       - **Coherent** (meta-output property),
       - **Causally deep** (clamping forces poetic output *and* alters internal state consistently; e.g., activates rhyme/rhythm subcircuits),
       - **Robust** (triggers across topics/styles).
     - ❌ **No** if: Only decodes surface features (e.g., just the word "poem") without computational effects.

  3. **Cross-model patching with 1:1 feature match**:
     - ✅ **Strong Yes** if patching preserves semantics: Proves **systematicity** (representations align structurally) and **causal depth** (directions share computational roles). Robustness is inherent.

