  Based on your case judgments, I've distilled a unified principle that captures your intuitive criteria for when a direction "represents" a concept. Your verdicts prioritize **causal depth and task-relevant structure** over surface-level readouts or shallow correlations. The principle has three core components, with the critical factor being whether the representation emerges from the model's core computational architecture rather than being an epiphenomenon.

  ### The Core Principle
  **A direction \(D\) represents a property \(P\) if:**
  1. **\(P\) is a coherent concept** that aligns with the model's intended computational task or natural domain structure.
  2. **\(D\) exhibits causal depth**: It participates in the model's *core computation* for \(P\), evidenced by:
     - **Systematicity**: Changes to \(D\) produce structured, predictable effects on downstream behaviors related to \(P\) (beyond simple associations), AND/OR
     - **Computational necessity**: \(D\) is not trivially readable from inputs but reflects an internal state *constructed* by the model during reasoning.
  3. **Robustness**: \(D\)'s relationship to \(P\) holds across diverse contexts (e.g., OOD inputs, prompts, or modalities), indicating it's not a local artifact.

  #### Why this works:
  - **Causal depth** is the key discriminator: It separates representations that are "computed" (e.g., Othello's board state) from those that are "memorized" (e.g., "capital of France") or epiphenomenal (e.g., "buggy code" probe).
  - **Coherence** rules out gerrymanders (e.g., bridge/dad/Excel).
  - **Robustness** ensures the representation isn't brittle or context-dependent.
  - *Readable/Load-bearing/Inert* labels provide evidence but aren't decisive alone. Load-bearing is necessary but insufficient (e.g., #8b fails despite being load-bearing).

  ---

  ### How Your Verdicts Map to the Principle
  | Case | Your Verdict | Principle's Explanation                                                                 |
  |------|--------------|----------------------------------------------------------------------------------------|
  | 1.   | ✅ Yes       | **Coherent** (visual primitives), **causally deep** (edges are computed, not input-copied), **robust**. |
  | 2.   | ✅ Yes       | **Coherent** (language ID), **causally deep** (clamping alters output systematically), **robust** (OOD generalizable). |
  | 3.   | ✅ Strong Yes| **Maximal causal depth**: Board state is *computed* from moves (not input-copied), and flipping it produces **systematic effects** on legal moves/state. Robust across game states. |
