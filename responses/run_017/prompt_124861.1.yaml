  ### Improved Design: "RuleQuest" - An Inquiry into Underdetermination

  #### Core Structure & Rule Specification
  **Dataset & True Rule**:  
  - **Rule**: \( y = 2x + 3 \) for \( x \leq 25 \), \( y = 3x - 22 \) for \( x > 25 \).  
  - **Noise Model**: Add Gaussian noise (µ=0, σ=1.5), then round to nearest integer.  
  - **Dataset**: 45 pre-generated points (x=1 to 45) with noise. **Example subset** (noiseless):  
    - x=25: \( 2(25) + 3 = 53 \)  
    - x=26: \( 3(26) - 22 = 56 \) (subtle break masked by noise).  
  - **Held-back Queries**:  
    - **Round 1**: Predict x=21,22,23,24,25.  
    - **Round 2**: Predict x=41,42,43,44,45.  

  **Why this rule?**  
  - **Pedagogical Fit**: Break at x=26 is invisible in initial data (x=1-20 shows linearity). Noise obscures the discontinuity, creating ambiguity. Teams likely propose linear rules early, but the true rule remains unconceived.  

  #### Team Setup & Timeline (100 min total)  
  - **Teams**: 4 groups (3-4 students each).  
  - **Materials**: Projector (dataset display), index cards (rule submissions), sealed envelope (true rule + dataset), laptop (pre-calculated data).  

  | Time  | Phase             | Activity                                                                 | Facilitator Tasks                                                                 |
  |-------|-------------------|--------------------------------------------------------------------------|-----------------------------------------------------------------------------------|
  | 0-5   | Introduction      | Explain goals: "Find a rule predicting y from x." Describe rounds.      | Form teams; project dataset (x=1-20). Emphasize prediction focus.                |
  | 5-20  | **Round 1**       | Teams derive rules from x=1-20 data. Predict y for x=21-25.             | Circulate, listen, deflect simulation-skepticism ("Focus on predictions").       |
  | 20-25 | Commit R1         | Write rule and predictions on index cards.                              | Collect cards; note rules (avoid revealing).                                      |
  | 25-30 | **Round 2**       | Reveal x=21-40 data (includes R1 predictions). Teams revise rules.      | Project new data; announce: "Predict x=41-45. Sticking to old rules risks big errors." |
  | 30-50 | Work R2           | Teams refine rules; predict x=41-45.                                    | Circulate; warn against overfitting ("More data ≠ simpler patterns").             |
  | 50-55 | Commit R2         | Submit revised rules and predictions.                                   | Collect cards; quickly score R1 and R2 predictions (formula below).              |
  | 55-60 | Best Rule Announce | Announce best rule by points. Display scores.                           | Choose best rule objectively (highest total points); if tie, pick simplest rule. |
  | 60-75 | **Round 3**       | Teams build rival to best rule (fits all data, indistinguishable on future queries). | Project admissibility test (below); enforce criteria; reject "cheap" rivals.     |
  | 75-80 | Commit R3         | Submit rival rules.                                                     | Collect cards; prepare reveal.                                                   |
  | 80-100| **Debrief**       | Reveal true rule (sealed envelope). Discuss underdetermination.         | Guide discussion using taxonomy; separate claims; preempt skepticism.            |

  ---

  #### Scoring & Incentives  
  - **Prediction Scoring (per query)**: \( \text{Score} = \max(0, 5 - |\text{predicted } y - \text{actual } y|) \).  
    - *Why?* Encourages accuracy without demanding perfection. Max 25/round.  
  - **Wagering Downside (R2)**: Teams *must* predict x=41-45. If they retain R1 rules (e.g., linear), errors compound (e.g., true y at x=45 is 113; linear rule predicts 93 → error 20 → score 0).  
  - **Trivial Stakes**: Winning team picks next week’s reading from a shortlist.  

  #### Round 3: Rival Construction  
  **Admissibility Test (projected)**: A rival is admissible if:  
  1. **Statable in Vocabulary**: Uses basic math (+, -, ×, ÷, exponents) or piecewise definitions (≤2 pieces).  
  2. **Non-Deferring**: Disagreement isn’t shifted to inaccessible queries (e.g., "Rule changes at x=1000" when apparatus only queries x≤100).  
  3. **Non-Negating**: Not solely defined as "not [best rule]."  
  4. **Empirical Fit**: For all x=1-40, \( |\text{rival } y - \text{data } y| \leq 3 \) (noise tolerance).  
  5. **Indistinguishability**: For x=41-100, rival matches best rule’s predictions.  

  **Example Rival**:  
  - Best rule: \( f(x) = 2.5x + 1 \)  
  - Rival: \( g(x) = \begin{cases} 
  \text{New expression fitting x=1-40} & x \leq 40 \\
  f(x) & x > 40 
  \end{cases} \)  
  - *Note*: "New expression" must satisfy admissibility (e.g., piecewise linear with break at x=25).  

  ---

  #### Handling Pitfalls  
  | Pitfall                  | Prevention & Response                                                                 |
  |--------------------------|----------------------------------------------------------------------------------------|
  | **Gerrymandered Rival**  | **Prevent**: Admissibility test blocks "x=1000" tricks. <br> **Response**: "Contrivance isn’t fatal—science uses simplicity to exclude such rivals." |
  | **Overfitting Rewarded** | **Prevent**: Held-back queries (x=41-45) penalize overfitted rules. <br> **Response**: "Note how complex rules bombed on new data—real science avoids this." |
  | **Facilitator "Cheating"** | **Prevent**: Pre-generated data in sealed envelope; open during reveal. <br> **Response**: "The envelope was sealed; noise ensures I couldn’t ‘cook’ data." |
  | **Global Skepticism**    | **Prevent**: Debrief distinguishes underdetermination from irrationality. <br> **Response**: "This shows evidence isn’t enough—not that science fails. We use coherence, fruitfulness, etc." |
  | **Time Overrun**         | **Prevent**: Hard stops at phase ends; use timer. R3 work cut to 10 min if needed. <br> **Response**: Skip R3 examples; focus on debrief. |

  ---

  #### Debrief: Separating the Three Claims  
  1. **Modal Claim** (finite evidence → infinite hypotheses):  
     - *Warrant from Activity*: Strong. Teams produce multiple rules fitting all data and agreeing on future queries (R3 rivals).  
     - *Script*: "You built rivals that fit all 40 points and match the best rule on future queries. This shows any dataset has *many* compatible hypotheses."  

  2. **Historical Claim** (unconceived alternatives existed):  
     - *Warrant from Activity*: Staged but not proven. True rule was unconceived; rivals emerged only when forced.  
     - *Script*: "Like in history (e.g., pre-Darwinian biology), the true rule here wasn’t proposed naturally—you needed a nudge. This *illustrates* how underdetermination bites in practice."  

  3. **Methodological Claim** (simplicity/etc. doesn’t track truth):  
     - *Warrant from Activity*: None. The activity uses predictive accuracy (which *is* truth-tracking) and simplicity. Truth-tracking isn’t tested.  
     - *Script*: "We used accuracy to pick the best rule—and it *might* be truth-tracking. But did simplicity help? We don’t know! This is hotly debated in philosophy."  

  **Contrivance as Key Disagreement**:  
  - "Some rivals felt contrived (e.g., arbitrary breaks). Is contrivance a defect? Realists say yes; constructive empiricists say no. This is where the action is—not whether equivalents exist, but which we should take seriously."  

  ---

  #### Honesty on Settled vs. Contested  
  - **Settled**: Modal underdetermination is uncontested. For any finite dataset, empirically equivalent rivals exist.  
  - **Contested**:  
    - **Historical**: Does underdetermination *actually* hinder science? (Stanford: yes; Devitt: no, we conceive alternatives).  
    - **Methodological**: Do simplicity/conservatism track truth? (Realists: yes, via abduction; Van Fraassen: no, they’re pragmatic).  
  - **Design Biases & Compensators**:  
    - *Bias*: Activity "rigs" historical claim by hiding true rule.  
      - **Compensate**: "I forced the true rule to be unconceived—but in real science, communities *do* often land on truth-conducive rules."  
    - *Bias*: Scoring rewards predictive accuracy (truth-tracking), making science seem more secure.  
      - **Compensate**: "Accuracy is our best truth-tracking tool—but what if unconceived rivals are *more* accurate? That’s the worry."  

  **Final Note**: The activity makes modal underdetermination visceral, stages historical underdetermination, and leaves methodology open. It surfaces contrivance as the pivotal issue—letting students *feel* why simplicity isn’t "just aesthetics." Run tightly, it avoids skepticism by ending on a challenge ("How do we choose?") not a defeat.
