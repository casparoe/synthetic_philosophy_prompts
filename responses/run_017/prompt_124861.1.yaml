  We are designing a classroom activity to illustrate the underdetermination of theory by evidence. The goal is to have students experience the phenomenon without using the term until debrief. We have three key claims to address: the modal claim (many hypotheses fit the data), the historical claim (unconceived alternatives were present), and the methodological claim (our criteria don't track truth). The activity should surface the issue of contrivance in rivals.

  Constraints:
  - 14 students, 100-minute session.
  - Movable chairs, projector, index cards, sealed envelope, laptop.
  - Four teams of 3-4.
  - Dataset of ~40 noisy observations from a secret rule (with noise model).
  - Three rounds: 
    Round 1: Teams commit to a rule and predictions for 5 held-back queries (scored).
    Round 2: More data, they may revise. Scoring must make wagering on own rule have downside.
    Round 3: Each team must produce a rival to the best rule that fits all data and is indistinguishable by any future query from the apparatus. The true rule is one no one proposes.

  Key design elements:
  - The facilitator's secret: the true rule is not proposed by any team.
  - Reveal: even after revealing the true rule, it doesn't settle things (because of underdetermination).
  - Points: trivial stakes (e.g., picking next week's reading).

  Minute-by-minute timeline and facilitator tasks.

  Debrief: separate the three claims and discuss contrivance.

  Potential problems and how to handle them.

  Honesty about what is settled and contested in the literature.

