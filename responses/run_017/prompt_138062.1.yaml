answer: |-
  ### Q&A Prep Sheet: Two-Zone View & Fragility Thesis  
  *Concessions to Preempt Pitfalls*  
  Open with: **"I concede three things upfront: (1) Totalism is formally coherent and avoids non-identity problems by design; (2) The person-affecting restriction captures legitimate intuitions in *stable-identity* cases like the 14-year-old girl; and (3) If Fragility is false, my argument collapses. My target is *longtermism under person-affecting constraints*."**  

  ---

  ### Objections & Replies (Ordered by Likelihood/Impact)  
  1. **Longtermist Cause-Prioritizer**:  
     *"If Fragility holds, all policy differences evaporate beyond T. This *axiological paralysis* makes cost-effectiveness analysis impossible!"*  
     → Reply: "Paralysis only applies under person-affecting views. Impersonal totalism (with discounting for fragility) still ranks outcomes. We *can* model EV—just drop identity-dependent welfare comparisons.  
     *Soft spot: Assumes my discount factor is tractable. Defend by noting we already discount for model uncertainty.*  

  2. **Population Axiologist (Formal)**:  
     *"Your 'moral thinness' discount is arbitrary. Why not weight by *probability of existence* instead? That’s standard in stochastic population ethics."*  
     → Reply: "Probability-weighting treats welfare *creation* and *redistribution* identically. My discount targets the *source* of value (identity-altering vs. identity-conserving effects). Call it an axiological corrigibility constraint.  
     *Soft spot: Underspecified formula. Commit to discount = f(fragility magnitude) as placeholder.*  

  3. **Person-Affecting Theorist**:  
     *"You admit the restriction works in the 'near zone.' But if identity is fragile, why isn’t *every* choice non-identity-affecting? Your zone boundary is ad hoc."*  
     → Reply: "Thresholds arise naturally: e.g., >50% expected overlap in who exists. Birth-timing variance ensures a cliff. Concede it’s fuzzy, but policy shifts (e.g., +6mo recession) reliably push us over it.  
     *Soft spot: Needs empirical demos. Cite literature on conception stochasticity (e.g., demographic noise models).*  

  4. **Grad Student (Steelman-Worthy)**:  
     *"Isn’t this just repackaging Parfit’s Conclusion? Why do we need 'half-lives' when we already know non-identity problems arise in depletion cases?"*  
     → Reply: "Parfit shows the *possibility* of non-identity. Fragility shows it’s the *default state* for long-term effects. Half-life quantifies how fast person-affecting comparisons decay—crucial for longtermist EV calculations."  

  5. **Longtermist (High Damage)**:  
     *"Discounted totalism in the far zone is temporal chauvinism! If we discount fragile lives, we must discount *all* future lives—including those saved from x-risk."*  
     → Reply: "No: X-risk prevention *preserves* high-probability future populations. Creating new lives via marginal policy shifts is different. Only discount welfare *from existence itself*, not baseline well-being.  
     *Soft spot: Risk of conflation. Stress 'counterfactual fragility' ≠ 'temporal distance.'*  

  6. **Population Axiologist**:  
     *"Critical-level theories already avoid non-identity problems without zones. Why complicate things?"*  
     → Reply: "Critical levels don’t resolve the *person-affecting dilemma* for longtermists. If you care about PAR, you need zones; if not, my view reduces to standard totalism. I’m offering a hybrid for PAR-committed longtermists."  

  7. **Person-Affecting Theorist (Confusion)**:  
     *"But if no future person is worse off, how can we wrong them? PAR is about harm, not impersonal bets."*  
     → Reply: "Exactly! That’s why PAR *must* be silent in the far zone. To 'protect' future people, you need an impersonal duty to create flourishing lives—which PAR explicitly rejects."  

  8. **Longtermist (Steelman-Worthy)**:  
     *"Fragility implies high model sensitivity. Tiny errors in predicting policy effects could flip who exists, making EV calculations noise-dominated."*  
     → Reply: "Agreed—this challenges *all* longtermist models. Solution: Focus on robustness (e.g., variance-reducing interventions) and coarse-grained outcomes (e.g., civilizational trajectories vs. individuals)."  

  9. **Grad Student (Confusion)**:  
     *"What if we choose a policy that *ensures* a specific future person exists? Doesn’t that restore PAR in the far zone?"*  
     → Reply: "Only for that one person! Fragility means for *any* policy, almost all far-future people wouldn’t exist under alternatives. PAR still can’t compare populations."  

  10. **Longtermist (Killer if Missed)**:  
      *"This justifies near-term QALY vandalism: Slash aid now to fund AI safety, since future lives are 'discounted' anyway."*  
      → Reply: "No! The near zone protects current beneficiaries. Deprioritizing them requires *impersonally* outweighing their harms—which my discount factor makes harder, not easier."  

  ---

  ### The Make-or-Break Reply  
  **Core Thesis to Defend**: *"Fragility + non-identity = PAR is vacuously satisfied in the far zone. Longtermists clinging to PAR are sabotaging their own project."*  
  → **Gauge Landing**: Watch for nods when you say, "If no one is made worse off, PAR has no bite." If the person-affecting theorist *doesn’t* object here, you’ve won.  

  ---

  ### The Question You Hope Nobody Asks  
  *"Why retain PAR in the near zone at all? If Fragility makes identity unstable eventually, why isn’t it unstable *now*—e.g., for climate policies affecting birth timing?"*  
  → **Honest Answer**: "It’s defeasibly stable: A child born in 2040 might exist under most plausible 2024 policies, but one in 2424 won’t. Concede this is probabilistic, but the gradient is steep.  
  → **Can the View Absorb It?** Yes, but it forces a retreat to *degrees* of person-affecting force. Commit to PAR weakening as identity-overlap drops."  

  ---

  ### The Silent Killer Objection (You Should Worry About)  
  *"Decision theory clash: Under Fragility, the *option set itself* affects who exists. Standard EV maximization assumes fixed identities across choices, creating dynamic inconsistency."*  
  → Why it breaks you: Your Two-Zone EV framework may require impossible counterfactuals.  
  → Mitigation: Bite the bullet—admit this needs causal decision theory revisions, but the core point (PAR’s silence) stands.  

  ---

  **Tactical Note**: When pressed, redirect to *"Fragility is empirical—attack that, and we can test it"* to avoid axiologic quicksand. Print this sheet. **Do not cite Parfit.**
