answer: |-
  Here are seven desiderata for an adequate account of genuine moral dilemmas:

  1.  **Non-Hierarchical Conflict:** Must explain cases where equally fundamental, non-overridden obligations conflict *directly* and *inescapably* (e.g., Sartre's pupil: filial duty vs. patriotic duty), precluding a higher principle resolving it. (Non-negotiable)
  2.  **Distinguish Conflict from Ignorance:** Must differentiate unresolvable conflict from mere uncertainty about facts or weight (e.g., two genuinely binding promises clashing, not just uncertainty about which promise is more important). (Non-negotiable)
  3.  **Reject Agglomeration:** Must allow that "O(A)" and "O(B)" do *not* entail "O(A and B)" when A and B are jointly impossible (e.g., Sophie's Choice: saving one child *requires* not saving the other; it's incoherent to say she *ought* to save both). (Non-negotiable; excludes standard deontic logic & some Kantian views).
  4.  **Residue Requirement:** Must account for persistent negative moral residue (regret, justified self-reproach, or agent-centered constraints on third-party blame) even after the *best possible* action is taken in a dilemma (e.g., triage: letting one die to save two leaves justifiable guilt; others cannot blame the agent as if they acted callously). (Non-negotiable for capturing phenomenology; excludes simple consequentialism).
  5.  **Handle Buyout Cases:** Must explain when escape clauses dissolve the dilemma into a cost/benefit choice vs. when they preserve dilemmatic structure (e.g., paying 200€ to break promise for rescue: dilemma dissolves if affordable; persists if unaffordable or payment breaches another duty, making *any* option involve serious wrong). (Negotiable, but essential for precision).
  6.  **Address Culpable/Repeatable Origin:** Must determine if knowingly causing the conflict (self-inflicted) or facing it routinely (repeatable) negates dilemmatic status or merely adds layers of culpability (e.g., nurse's daily triage: if the *structure* of conflicting duties persists, it remains a dilemma regardless of frequency or origin of the *situation*). (Negotiable; tests scope).
  7.  **Incomparability vs. Parity:** Must clarify whether conflicting options are genuinely incomparable, on a par, or merely difficult to compare, without collapsing these distinctions (e.g., conflicting life-saving promises to equally dear friends: incomparability/parity supports "no right answer"; mere difficulty does not). (Non-negotiable for strong dilemmas; excludes views demanding strict cardinal comparability like some consequentialism/Rossian pluralism).
