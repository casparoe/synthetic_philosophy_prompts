answer: |-
  ### First Case: Workplace Bonus for Pledging Attendance

  Dr. Lee, a rational and self-aware project manager, can receive a $500 productivity bonus today by submitting a written pledge to attend an optional team-building workshop next week. The bonus is awarded solely for submitting the pledge—actual attendance gains nothing (the workshop is tedious and irrelevant to her current projects) and costs her three hours of productive work time. She knows that once the bonus is paid, she will have no reason to attend the workshop. Dr. Lee submits the pledge, collects the bonus, and blocks the workshop time in her calendar. However, she knows that when the workshop day arrives, she will skip it to work on urgent tasks.

  - **Candidate intention**: To attend the workshop.  
  - **Belief about future action**: Dr. Lee believes she will not attend the workshop. Her belief is based on her rational assessment: at the future time, she will have no incentive to attend (it gains nothing and costs effort), and she is disciplined enough to avoid pointless activities.  
  - **SP verdict**: Cannot intend. SP requires believing one will perform the action. Dr. Lee lacks this belief—she confidently predicts she will skip the workshop—so she cannot intend.  
  - **PS verdict**: Can intend. PS requires settling on a plan, closing deliberation, and constraining further planning. By pledging and blocking her calendar, Dr. Lee adopts the plan to attend, making it a fixed part of her schedule. This constrains her planning (e.g., she avoids scheduling conflicts), even though she knows the intention won’t guide her action later.  

  ### Second Case: Spontaneous Help Based on Past Pattern

  Dr. Lee is considering whether to help a colleague move boxes during a brief office lull next week. Helping gains nothing (it’s physically taxing and unrewarded) and she has no reason to do it. However, based on her consistent past behavior in similar situations—she always spontaneously volunteers for minor tasks when idle, driven by a reflexive sense of duty—she predicts she will help. She has not decided to help, made preparations, or adjusted her schedule; she simply observes her habitual tendency and expects it to recur. She remains in control: if she chose to resist, she could, but she predicts she won’t because resistance feels unnecessarily effortful.

  - **Candidate intention**: To help move boxes.  
  - **Belief about future action**: Dr. Lee believes she will help. Her belief is based on inductive self-prediction: her history of identical actions in identical contexts makes her confident she will act similarly, despite having no reason to help.  
  - **SP verdict**: Can intend (indeed, does intend). SP requires believing one will perform the action, which Dr. Lee does. She is rational and has a "reason in the neighborhood"—her ingrained habit explains why she will act—so she intends.  
  - **PS verdict**: Does not intend. PS requires settling the question, closing deliberation, and constraining planning. Dr. Lee has done none of this; she leaves the matter open, expecting her future self to act spontaneously without present guidance.  

  ### Structural Difference and Its Role  
  The two cases differ in exactly one respect: **the presence or absence of a reason at the initial time (T1) to form a plan to perform the action (A)**.  
  - In the First Case, there is a reason at T1 to form the plan (the bonus), independent of any value from performing A later.  
  - In the Second Case, there is no reason at T1 to form a plan (helping is left to spontaneity; no incentive exists to settle it now).  

  Flipping this respect converts each case into the other:  
  - **Removing the reason to form a plan from the First Case**: Without the bonus, Dr. Lee has no T1 reason to pledge attendance. She would not believe she will attend (no reason at T2) and would not settle on a plan. SP verdict: cannot intend (no belief). PS verdict: cannot intend (no settlement). This eliminates the toxin structure and mirrors the Second Case’s "no intention" under PS, but not SP’s "intends" (since she also lacks belief).  
  - **Adding a reason to form a plan to the Second Case**: Suppose Dr. Lee is offered a bonus today for pledging to help. She then has a T1 reason to form a plan. She would settle on helping (e.g., by noting it in her task list), making PS return "can intend." But she would not believe she will help (no T2 reason), making SP return "cannot intend." This creates a toxin structure like the First Case, swapping SP’s original "can intend" to "cannot" and PS’s "does not intend" to "can."  

  ### Attacks and Repairs  
  - **SP defender’s attack on the Second Case**: SP might be accused of conflating intention with mere self-prediction. In the Second Case, Dr. Lee’s belief is spectatorial—based on habit, not practical reasoning—so it shouldn’t count as intention. A principled repair would require that the belief stem from the agent’s own reasons for acting (e.g., seeing the action as good). This distinguishes intention-constituting expectations from passive predictions. However, SP as stated only requires belief plus a "reason in the neighborhood," which could include habits, so this repair adds an unsupported condition and might be ad hoc.  
  - **PS defender’s attack on the First Case**: PS might be accused of overcounting by treating "sham" resolutions as intentions. If Dr. Lee knows her "intention" won’t guide action (she’ll skip the workshop), it isn’t a real intention. A principled repair would require that intentions must be capable of guiding action, as PS mentions they "normally" do. But PS doesn’t require actual guidance, only that the state functions as a plan (by settling and constraining). Denying intention here because guidance fails would be ad hoc—it ignores the T1 planning role and contradicts PS’s focus on structural features like deliberation-closure.  

  ### Conclusion on the Constitution of Intention  
  The pair shows that whether intention is partly constituted by a belief about one’s future action is contested. SP treats such belief as necessary and nearly sufficient: in the First Case, lacking belief precludes intention; in the Second, having belief constitutes it. PS rejects this: in the First Case, intention exists without belief (via plan-settlement); in the Second, belief without settlement doesn’t suffice. Thus, the accounts diverge fundamentally. SP makes intention dependent on self-prediction, while PS ties it to practical commitment. The toxin structure isolates this: SP cannot handle cases where belief is undermined by known future irrationality, while PS cannot recognize "intentions" without planning activity. Ultimately, the cases suggest intention is not essentially a belief-state—it can arise from planning (First Case) and be absent despite confident self-prediction (Second Case). This challenges SP’s core claim and highlights PS’s emphasis on agency over epistemology.
