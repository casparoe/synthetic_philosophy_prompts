prompt: |-
  I'm a novelist, four books in, and the one I'm plotting now follows a single family across three generations, 1930s to the present — and I keep catching myself smuggling in a claim about history going somewhere that I haven't earned. So before I outline any further I want the spec: write me the desiderata for a theory of history's directionality, the kind a novelist could honestly steer a plot by. Which cases does it have to get right — improvement in which nobody gets justice, justice that costs everyone everything, an arc that bends for sixty years and then snaps — which distinctions can it not collapse (moral progress vs. material improvement vs. mere narrative shape vs. actual providence), and what does it owe to the selection problem, given that I only get to write the chapters whose records survived? Mark which requirements are non-negotiable and which are just the prejudices of one camp or another, and flag any pair that can't be satisfied together, since that's the bit I'd definately build the book around. Skip scoring the existing views, I'll read those myself. British English please — my publisher's in London.
reasoning: |-
  Okay, the user is a novelist with four books under their belt, now working on a multi-generational family saga spanning from the 1930s to the present. They're wrestling with how to handle historical directionality without making unearned claims. 

  First, let's unpack their core struggle: they want to avoid imposing a false sense of historical inevitability or purpose while still creating a coherent narrative arc. That's a sophisticated tension - most authors wouldn't even recognize this as a problem. Their phrase "smuggling in a claim about history going somewhere" suggests they've caught themselves artificially forcing patterns.

  Key concerns emerging:
  - Needs concrete historical test cases (justice without improvement, costly justice, broken arcs)
  - Wants philosophical distinctions clarified (moral vs material progress etc.)
  - Deeply aware of selection bias in historical records
  - Explicitly wants contradictions highlighted - that's where their novel's tension will live

  Hmm... they're unusually methodical for a novelist. The request for "desiderata" and "non-negotiables" reads almost like an academic brief. Probably why they mention skipping existing theories - they want tools, not lectures. 

  British English note is practical (publisher in London) but also hints they're deep in period research. "Steer a plot by" confirms they need operational principles, not abstract philosophy. 

  The real challenge: balancing narrative coherence with historical honesty. Their "arc that bends for sixty years and then snaps" example shows they get that real history frustrates storytelling. That's gold - the very frustration their novel can explore.

  Biggest trap to avoid: prescribing solutions. They're sharp enough to spot when a theory is being sold. Need to frame everything as diagnostic tools for their authorial decisions. The "non-negotiable" vs "prejudices" distinction will help them filter camps.

  Selection bias point is crucial. They're right that novelists face the historian's problem: we only see what survived. Should emphasize how this undermines all grand theories. Their book could literally show records being lost/buried as a structural element.

  The contradictions section will be most useful. If I flag irreconcilables like "progress requires contingency" vs "progress requires inevitability", they can build chapters around characters embodying these tensions. A Marxist grandfather vs neoliberal granddaughter debating whether the war "meant something", for instance.

  Must resist scoring theories as requested, but the framework should make flaws visible. Like how Whig history fails the "justice without improvement" test, or how Marxists struggle with snap-back moments like 1989.

  Final thought: they might actually want permission to leave directionality ambiguous. The desiderata could validate that as honest rather than indecisive.
answer: |-
  Right then. This is the novelist's toolkit for wrestling with historical directionality without cheating. Below are the **desiderata** – the essential requirements – for a theory you can honestly navigate your generational saga by. They're designed to flag the pitfalls, force clarity, and expose the tensions inherent in claiming history "goes somewhere."

  **Core Purpose:** To provide a *navigational framework* for plotting multi-generational change that acknowledges complexity, avoids unearned teleology, and explicitly grapples with the novelist's unique constraints and responsibilities.

  ---

  **I. Non-Negotiables (The Ethical & Epistemological Bedrock)**

  1.  **Must Acknowledge Contingency & Rupture:** Cannot present outcomes as inevitable. Must accommodate the **"arc that bends for sixty years and then snaps"** (e.g., the collapse of the post-WWII social democratic consensus in the 1980s, the sudden end of the Cold War, unexpected revolutions). History *can* reverse, stall, or fracture violently. *(Why: Ignoring this is fundamentally dishonest to the lived experience of chaos and surprise.)*
  2.  **Must Confront the Selection Problem Head-On:** Explicitly accounts for the fact that your narrative (and any historical record) is built **"only [from] the chapters whose records survived."** This demands:
      *   Acknowledging silenced voices, lost perspectives, and the power dynamics shaping what is preserved.
      *   Recognising that apparent "direction" can be an *artifact of selection*, not inherent process.
      *   Requires characters within the narrative to grapple with partial/incomplete understandings of their *own* past. *(Why: The novelist, like the historian, works with fragments. Pretending otherwise falsifies the source material.)*
  3.  **Must Reject Simple Providence:** Cannot rely on metaphysical guarantees of a benevolent outcome, divine plan, or inherent cosmic justice. Characters may *believe* in providence, but the narrative framework itself cannot depend on it as an explanatory force. *(Why: Smuggles in unearned resolution; undermines genuine human struggle.)*
  4.  **Must Decouple "Progress" from "Justice":** Must be able to explain **"improvement in which nobody gets justice"** (e.g., post-war economic boom built on unacknowledged colonial exploitation or wartime suffering; technological advancement alongside entrenched inequality). Must also explain **"justice that costs everyone everything"** (e.g., pyrrhic victories, revolutions consuming their children, costly legal battles leaving families broken even if precedent is set). Progress (material, social, technological) and justice (moral, retributive, restorative) are distinct vectors that often conflict. *(Why: Collapsing them is a common, unearned narrative cheat.)*
  5.  **Must Distinguish Mechanism from Meaning:** Must provide a clear separation between:
      *   **Observed Mechanisms/Patterns:** (e.g., technological innovation tends to accumulate; bureaucratic states tend to expand; communication networks tend to densify over time – *though all can collapse*).
      *   **Narrative Shape:** The human *imposition* of story (rise/fall, tragedy/comedy, redemption) onto events.
      *   **Moral Valuation:** The judgment of events as "better" or "worse".
      *   *(Why: Conflating observed pattern with inherent moral improvement or narrative necessity is the core smuggled claim.)*

  **II. Essential Capacities (What the Theory Must Explain/Accommodate)**

  6.  **Must Accommodate Simultaneous Advancement & Regression:** Must make sense of periods where *some* things improve materially or technologically (e.g., medicine, consumer goods) while *others* regress socially or politically (e.g., rights eroded, inequality grows, xenophobia increases). (e.g., Interwar technological boom alongside rise of fascism; digital age alongside democratic backsliding). *(Why: Reality is rarely uniformly "progressive" or "regressive".)*
  7.  **Must Explain Stasis & Cyclicality:** Needs room for periods of apparent inertia ("the long 1950s") or recurring patterns (economic cycles, resurgent nationalism, recurring debates about liberty vs security) without forcing them into a linear "forward" trajectory. *(Why: Much of human experience feels like running in place or revisiting old battles.)*
  8.  **Must Handle Scale Disparity:** Must reconcile large-scale, long-term macro-trends (e.g., global industrialisation, demographic shifts) with the micro-level experiences of individuals and families, where these trends manifest as chaotic, disruptive, and often *unintended* forces. The "direction" perceived at the national/global level may feel like random chaos at the kitchen table. *(Why: Your novel lives at the kitchen table level, but spans macro-trends.)*
  9.  **Must Incorporate Agency & Constraint:** Must show how individuals and groups *act* within (and sometimes against) larger historical currents, shaping events, but always within limits set by existing structures, resources, and the actions of others (past and present). Avoids pure determinism *and* pure free-will fantasy. *(Why: Characters must matter, but not magically override their context.)*
  10. **Must Grapple with Unintended Consequences:** Central to the human drama. Actions taken for one reason (e.g., welfare state to prevent revolution) yield vast, unforeseen results decades later (e.g., fiscal crises, debates on dependency). The "direction" is often the *result* of tangled chains of unintended effects. *(Why: This is where generational impact and irony thrive.)*

  **III. Critical Distinctions the Theory Must Maintain (And Not Collapse)**

  11. **Moral Progress vs. Material Improvement:** See Non-Negotiable 4. Building sewers is material progress; whether access to them is equitable is a moral/political question. One does not guarantee the other.
  12. **Efficiency/Growth vs. Human Flourishing:** Increased GDP or technological efficiency does not automatically equate to better lives, stronger communities, or greater meaning for most people. Often comes at social or environmental cost.
  13. **Narrative Shape (Imposed) vs. Historical Process (Observed):** A character finding "redemption" in their story is not evidence of history itself being redemptive. The arc of the *novel* is your construction; the arc of the *history* depicted must feel contingent.
  14. **Inevitability (Teleology) vs. Possibility/Tendency:** The theory can suggest *likely* outcomes based on forces (e.g., "industrialisation *tends to* urbanise populations"), but must never present a *specific* endpoint (e.g., "communism", "liberal democracy", "AI singularity") as guaranteed. *(Crucial for avoiding smuggle!)*
  15. **Structure vs. Agency:** The weight of existing institutions, economies, and ideologies (structure) vs. the capacity of people to resist, innovate, and create change (agency). The theory must show their interaction, not reduce everything to one or the other.

  **IV. Inherent Tensions & Irreconcilables (The Novel's Dramatic Fuel)**

  These are pairs where satisfying one desideratum makes satisfying the other incredibly difficult, if not impossible. **This is where your novel's core conflict likely resides.**

  *   **Contingency/Rupture (N1) vs. Discernible Directionality:** If history is truly contingent and prone to snapping arcs, can it *really* be said to have a coherent "direction" at all? Any claimed directionality must be fragile, contested, and potentially illusory or temporary.
  *   **Selection Problem (N2) vs. Comprehensive Explanation:** How can you claim *any* understanding of historical direction when your evidence is irrevocably incomplete and filtered? Any theory must be humbly provisional, explicitly acknowledging its blind spots.
  *   **Rejecting Providence (N3) vs. Imposing Narrative Meaning:** If there's no divine guarantee, and directionality is messy, how *do* characters (and the author) find or create meaning across generations without resorting to false providence? The struggle for meaning *is* the story.
  *   **Agency (C9) vs. Large-Scale Trends (C8):** How much can individuals or families *really* shape the tide of large-scale historical forces (economic depressions, wars, technological revolutions)? Does agency mainly consist of navigating, surviving, or making small eddies in the current? This defines character struggle.
  *   **Moral Progress Aim vs. Material/Mechanistic Reality (C11, C12):** Characters strive for justice and moral improvement, but the engines of history often seem driven by amoral forces (economics, technology, power politics). The cost of pursuing moral aims can be immense material sacrifice (N4), and "success" may be ambiguous or compromised.

  ---

  **How to Use This Toolkit:**

  1.  **Interrogate Your Outline:** At each generational transition, apply the Non-Negotiables. Are you implying inevitability? Smoothing over rupture? Assuming progress = justice? Ignoring lost voices?
  2.  **Spotlight the Tensions:** Where you find Irreconcilables (Section IV), *lean in*. Build plot points and character arcs around these conflicts. Does the patriarch believe in inevitable progress (denying N1)? Does the granddaughter uncover buried records challenging the family myth (embracing N2)? Does a costly legal victory hollow out a character (N4)?
  3.  **Let Distinctions Drive Dialogue & Conflict:** Arguments between characters can embody the Critical Distinctions (Section III). A materialist vs. a moralist; someone who sees structure as everything vs. a fervent believer in agency; someone imposing a redemptive narrative on trauma vs. someone who rejects it.
  4.  **Embrace the Selection Problem:** Make the *process* of discovering/recording/losing history part of the plot. Diaries burned, letters hidden, official records lies. Show how the family's *own* understanding of its past is constructed from fragments. This *is* the historical process.
  5.  **Aim for Honest Navigation, Not a Map:** The theory isn't a GPS saying "turn left here for Progress." It's a compass and a set of hazard warnings. It helps you avoid dishonest shortcuts and shows where the difficult, dramatically rich terrain lies – the terrain of contingency, ambiguity, cost, and the relentless human search for meaning within forces larger than any individual life.

  This framework won't give you an easy answer about "where history is going," but it will force you to confront *why* that question is so difficult and dramatically potent. It provides the guardrails to ensure your plot's directionality is *earned* through the complex, contradictory, and often heartbreaking experiences of your characters across the generations. Good luck – the friction points are where the sparks fly.
