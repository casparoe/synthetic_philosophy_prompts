answer: |-
  ### Authenticity Assessment Procedure for Acquisitions & Collections Committee  
  *Grounded in Evidential History as Constitutive of Identity*  

  ---

  ### I. PROCEDURE (Two Pages)  
  **PHASE 1: INITIAL ASSESSMENT** (5 mins)  
  1. **Question 1:** Is the object’s *material history* (provenance, technique, materials) consistent with claimed authorship/period?  
     - *Sufficiency:* Technical report OR provenance chain with no gaps >20 years OR consistency with verified comparanda.  
     - *Termination:* If "no" → Proceed to Q2. If "yes" → Assign tier **"by [Maker]"** (Curator sign-off).  

  2. **Question 2:** Is there affirmative evidence of *misattribution or deception* (e.g., forged signature, altered marks, fraudulent provenance)?  
     - *Sufficiency:* Technical evidence of tampering OR documented confession OR irrefutable stylistic anomaly.  
     - *Termination:* If "yes" → Proceed to Q3. If "no" → Assign tier **"attributed to [Maker]"** (Curator sign-off).  

  3. **Question 3:** Does the object possess *significant independent value* as evidence of cultural/artistic practice, regardless of authorship?  
     - *Sufficiency:* Demonstrates historical technique, period craftsmanship, or intentional commentary (e.g., deliberate imitation).  
     - *Termination:* If "no" → **Decline gift** or **Deaccession** (Board approval). If "yes" → Proceed to Tier Assignment.  

  **PHASE 2: TIER ASSIGNMENT** (10 mins)  
  *(Authority: Curators for "by," "attributed to," "studio/workshop of," "after," "imitation." Board for "forgery," "uncertain origin")*  

  | Tier                      | Criteria                                                                 | Disposition                                  |  
  |---------------------------|--------------------------------------------------------------------------|---------------------------------------------|  
  | **by [Maker]**            | Material history and provenance unbroken; no anomalies.                  | Retain/acquire as claimed.                  |  
  | **attributed to [Maker]** | Plausible stylistic/material link; gaps in provenance but no deception.  | Retain/acquire with label qualifier.        |  
  | **studio/workshop of**    | Technique consistent with maker’s circle; no direct evidence of hand.    | Retain/acquire for contextual value.        |  
  | **after [Maker/Period]**  | Conscious imitation without deceptive intent.                            | Eligible for "cabinet of imitations."       |  
  | **imitation**             | Copy without deceptive intent; later reinterpretation.                   | Eligible for "cabinet of imitations."       |  
  | **forgery by [Maker]**    | Evidence of deceptive intent (requires Board vote).                      | Acquire *only* as cultural warning; deaccession if in collection. |  
  | **uncertain origin**      | Inconclusive evidence; default when analysis unaffordable/unavailable.   | Review in 10 years; label as "origin unknown." |  

  **PHASE 3: DISPOSITION & REVIEW** (5 mins)  
  - **Termination Points:**  
    - **Decline gift/Return:** Q1 "no" + Q2 "yes" + Q3 "no" OR insured value <$8k with unresolved deception.  
    - **Deaccession (Board):** In-collection object with proven deception (Q2 "yes") and no independent value (Q3 "no").  
    - **Reclassify & retain:** Q3 "yes" → Assign tier ("after," "imitation," etc.).  
  - **Handoff to Board:** Values-based decisions (e.g., displaying forgeries as art vs. warning).  
  - **Default:** "Uncertain origin" when evidence inconclusive/unaffordable. Reviewed at next collection audit (max 10 yrs).  

  **Branch for Non-"Maker’s Hand" Works (e.g., Case D):**  
  - **Question 1A:** Does the object realize the artist’s *intentional work* (e.g., printed from original plates under artist’s instructions)?  
    - *Sufficiency:* Documentation of artist’s plan (e.g., signed maquette) + execution by trusted collaborator.  
    - *Termination:* If "yes" → Tier **"by [Maker]"** (e.g., posthumous prints are "by" if authorized).  
    - *Applied to Case D:* Estate’s objection is economic, not historical → **"by [Artist]"** (see below).  

  ---

  ### II. PHILOSOPHICAL CHOICES & TRADEOFFS  
  1. **Kept:** *History over aesthetics.* Authenticity resides in material/contextual history, not perceptual qualities (per Nelson Goodman/Danto). Justifies technical analysis primacy in Q1.  
  2. **Dropped:** *Distinction between "aesthetic loss" vs. "informational loss."* Trustees lack time to debate aesthetic ontology; collapsed into "independent value" (Q3).  
  3. **Contested Encodings:**  
     - **"Forgery" requires intent.** Rejects "skeptical" view (all artifacts are contextual). *Defended:* Intent separates cultural commentary (e.g., Case C) from deception.  
     - **"Attributed to" launders doubt.** Acknowledged risk; *defended* as honest epistemic humility when evidence is partial.  
     - **Posthumous works as "by" artist.** Privileges artistic intent over physical hand (Case D). *Defended:* Aligns with institutional purpose (evidence of human past includes creative process).  

  **Blind Spots:**  
  - Unfair to: Oral-history cultures (written provenance privileged), artists rejecting "authorship" (e.g., collective workshops).  
  - Cannot settle: Conflicts between legal ownership and cultural patrimony (e.g., illicit export without paper trail).  
  - Misfires: When technical analysis is destructive/too costly; defaults to "uncertain origin," potentially erasing marginalized makers.  

  ---

  ### III. CASE APPLICATIONS  
  **A. Oil Landscape**  
  - Q1: Materials consistent but signature anomaly → "no."  
  - Q2: No evidence of deception → "no."  
  - Q3: Independent value? Thin comparanda, weak following → "no."  
  - **Tier:** *"attributed to [Artist]"* (insufficient for "by," no deception for "forgery").  
  - **Disposition:** Retain with reclassification. *Committee may dislike:* Downgrade challenges legacy cataloguing.  

  **B. Bronze Statuette**  
  - Q1: Provenance deceptive (tooled mark) → "no."  
  - Q2: Evidence of deception → "yes."  
  - Q3: Independent value? Significant as 19th-c. reproduction, pedagogically useful → "yes."  
  - **Tier:** *"forgery by [Foundry]"* (Board approval required).  
  - **Disposition:** Acquire/reclassify as "19th-century imitation of Roman type." Label as pedagogical tool.  

  **C. Painting Offered as Gift**  
  - Q1: Provenance fraudulent → "no."  
  - Q2: Evidence of deception (conviction) → "yes."  
  - Q3: Independent value? Yes, as evidence of market fraud/artist’s oeuvre.  
  - **Tier:** *"forgery by [Artist]"* (Board approval).  
  - **Disposition:** Acquire for "cabinet of imitations." Label as "2016 forgery by [Artist] exposing art market vulnerabilities."  

  **D. Etchings (Non-"Maker’s Hand" Branch)**  
  - Q1A: Realizes artist’s intent? Signed maquette + authorized printer → "yes."  
  - **Tier:** *"by [Artist]"* (per branch logic: history of intent trumps physical execution).  
  - **Disposition:** Acquire as "by [Artist]." *Controversy:* Estate’s objection overruled; procedure prioritizes historical evidence over commercial interests.  

  ---

  ### IV. EXECUTION NOTES  
  - **One-Page Record Template:**  
    > Object ID: [ ] | Question 1: [Y/N] | Q2: [Y/N] | Q3: [Y/N] | Tier: [ ] | Disposition: [ ] | Rationale: [3 bullet points max].  
  - **20-Minute Viability:** Focuses on binary thresholds (Y/N); tiers map to dispositive outcomes. Trustees rule on Q3 ("value"), curators on evidence.  
  - **Unsettled Literature:** "Intent" in posthumous works (Case D) is debated; procedure adopts Jerrold Levinson’s intentionalist view.  

  **Commitment:** The procedure refuses to conflate *ethical* condemnation of forgeries with *ontological* erasure. Case B’s statuette is a "forgery" but retains value; Case D’s prints are "by" the artist despite estate protests. This may provoke dissent but honors evidence over sentiment.  

  ---  
  *Procedure end* (2 pages + appendixes for tiers/cases). Implement with trustee training on Q3 ("value") judgments.
