  3) Domain specificity burden (moves 7-8)
  The null non-social finding is Marcus' strongest card. Elin's multiple-differences rebuttal is reasonable, but the specificity claim survives - no evidence yet that ratio-tracking triggers mood drops in non-social contexts. Still, "social" doesn't entail "adapted for bands."

  On the philosophical sub-questions:
