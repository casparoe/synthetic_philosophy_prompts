  ### Worked Example: Vulnerability to Coordinated Manipulation in Voting Rules

  **Rule:** Plurality voting with tie-break order A > B > C (if multiple candidates have the highest vote count, the candidate appearing first in this fixed order wins).

  **Profile P (5 voters, 3 candidates):**  
  - Voter 1: A > B > C  
  - Voter 2: A > B > C  
  - Voter 3: C > B > A  
  - Voter 4: C > B > A  
  - Voter 5: B > C > A  

  **Sincere Winner (at P):**  
  - Plurality vote counts: A = 2, B = 1, C = 2.  
  - Tie between A and C. Tie-break (A > B > C) → **A wins**.  

  ---

  ### Verification of Conditions
  #### 1. No Profitable Unilateral Deviation at P:
  - **Voter 1 or 2 (sincere: A > B > C)**:  
    If either deviates (e.g., votes for B or C), A may lose. Example: If Voter 1 votes for B, counts become A=1, B=2, C=2. Tie between B and C. Tie-break (B > C) → B wins. Voter 1 gets B, worse than A. Other deviations yield A or worse.  
  - **Voter 3 or 4 (sincere: C > B > A)**:  
    If Voter 3 deviates to B > C > A: Counts = A=2, B=2, C=1. Tie between A and B. Tie-break (A > B) → A wins (same as sincere). Deviating to other ballots (e.g., A > B > C) still yields A. No gain.  
  - **Voter 5 (sincere: B > C > A)**:  
    If deviates to C > B > A: Counts = A=2, B=0, C=3 → C wins. Voter 5 gets C, worse than A? No: sincere ranking is B > C > A, so C is preferred to A. But A wins in sincere outcome, and C is better than A. However, changing to C > B > A gives C wins, which is better for them. But wait, in this case, if Voter5 deviates to C, then C wins, which is better than A. So this would be a profitable deviation. This is a problem. 

  We need to ensure no single voter can gain. Let's adjust the profile.

  **Revised Profile P (to ensure no unilateral gain):**  
  - Voter 1: A > B > C  
  - Voter 2: A > B > C  
  - Voter 3: C > B > A  
  - Voter 4: C > B > A  
  - Voter 5: C > A > B  [changed from B > C > A to C > A > B]

  **Sincere Winner (at P):**  
  - Plurality counts: A = 2, B = 0, C = 3 → **C wins**.  

  **Unilateral Deviations:**  
  - **Voter 1 or 2 (A > B > C)**:  
    Deviating to B: Counts = A=1, B=1, C=3 → C wins (same).  
    Deviating to C: Counts = A=1, B=0, C=4 → C wins (same).  
    No gain.  
  - **Voter 3 or 4 (C > B > A)**:  
    Deviating to B > C > A: Counts = A=2, B=1, C=2 → Tie between A and C. Tie-break → A wins. Voter 3 gets A, worse than C.  
    Deviating to A > B > C: Counts = A=3, B=0, C=2 → A wins (worse than C).  
    No gain.  
  - **Voter 5 (C > A > B)**:  
    Deviating to A > C > B: Counts = A=3, B=0, C=2 → A wins (worse than C).  
    Deviating to B: Counts = A=2, B=1, C=2 → Tie between A and C. Tie-break → A wins (worse).  
    No gain.  

  **Conclusion:** No voter can profit by unilaterally deviating at P.  

  #### 2. Joint Deviation by Maya (Voter 3) and Sam (Voter 4):
  - **Sincere preferences (both):** C > B > A.  
  - **Sincere winner:** C.  
  - **Joint deviation:** Both report B > C > A.  
    New profile:  
    - Voter 1: A > B > C → votes A  
    - Voter 2: A > B > C → votes A  
    - Voter 3: B > C > A → votes B  
    - Voter 4: B > C > A → votes B  
    - Voter 5: C > A > B → votes C  
    Plurality counts: A=2, B=2, C=1. Tie between A and B. Tie-break (A > B) → **B wins**.  
  - **Gain for Maya and Sam:**  
    Their true ranking is C > B > A. Sincere winner was C, new winner is B. They prefer B to C? No, C is preferred to B.  
    Wait: C > B > A means C is best, then B, then A. So B is worse than C. This is not a gain.  

  Let's switch roles. How about Voter 1 and 2?

  **Joint Deviation by Voter 1 and 2 (Maya and Sam):**
  - **Sincere preferences (both):** A > B > C.  
  - **Sincere winner:** C.  
  - **Joint deviation:** Both report B > A > C.  
    New profile:  
    - Voter 1: B > A > C → votes B  
    - Voter 2: B > A > C → votes B  
    - Voter 3: C > B > A → votes C  
    - Voter 4: C > B > A → votes C  
    - Voter 5: C > A > B → votes C  
    Plurality counts: B=2, C=3 → **C wins**.  
    Same as sincere. No gain.  

  **Joint Deviation by Voter 3 and 5:**
  - **Voter 3 (C> B>A), Voter 5 (C>A>B)** 
  - Joint deviation: both report B > C > A
    New profile:
    - V1: A > B > C → A
    - V2: A > B > C → A
    - V3: B > C > A → B
    - V4: C > B > A → C
    - V5: B > C > A → B
    Counts: A=2, B=2, C=1 → tie A and B. Tie-break A > B → A wins.  
    For Voter 3 and 5, sincere winner was C. A is worse than C for both. No gain.

  After careful construction, here is a working example:

  **Final Profile P:**
  - Voter 1: A > B > C  
  - Voter 2: A > B > C  
  - Voter 3: B > C > A  
  - Voter 4: B > C > A  
  - Voter 5: C > A > B  

  **Sincere Winner:**  
  - Plurality: A=2, B=2, C=1 → Tie between A and B. Tie-break (A > B) → **A wins**.  

  **Joint Deviation by Voter 3 and 4 (Maya and Sam):**
  - **Sincere preferences (both):** B > C > A.  
  - **Sincere winner:** A.  
  - **Joint deviation:** Both report C > B > A.  
    New profile:  
    - Voter 1: A > B > C → votes A  
    - Voter 2: A > B > C → votes A  
    - Voter 3: C > B > A → votes C  
    - Voter 4: C > B > A → votes C  
    - Voter 5: C > A > B → votes C  
    Plurality counts: A=2, C=3 → **C wins**.  
  - **Gain for Maya and Sam:**  
    Their true ranking is B > C > A. Sincere winner was A, new winner is C. They prefer C to A, so both strictly gain (C > A).  

  #### 3. Going Alone Fails for Each:
  - **Maya (Voter 3) alone:** Reports C > B > A. Counts = A=2, B=1, C=2. Tie between A and C. Tie-break (A > C) → A wins (same as sincere). No gain.  
  - **Sam (Voter 4) alone:** Same outcome (A wins). No gain.  

  #### 4. Contagion (Sequential Invitation):
  - **Step 1:** Maya (Voter 3) deviates to C > B > A.  
    - New counts: A=2, B=1, C=2 → Tie between A and C. Tie-break → **A wins**.  
    - Outcome unchanged for Maya (still A).  
  - **Step 2:** After Maya’s deviation, Sam (Voter 4) can now deviate to C > B > A.  
    - New counts: A=2, C=3 → **C wins**.  
    - Sam gains (C > A). Maya also gains (C > A).  

  ---

  ### Structural Feature and Sensitivity
  - **Key feature:** The tie-break rule and non-Condorcet winner. The sincere winner (A) wins by a tie-break, not majority.  
  - **Remove tie-break?** If ties are unresolved (rule not resolute), Gibbard-Satterthwaite doesn’t apply.  
  - **Make A a Condorcet winner?** Alter preferences so A beats all pairwise (e.g., all voters rank A > B > C). Then A wins regardless of the pair’s deviation, blocking the joint manipulation.  
  - **Switch to plain plurality?** Ties may persist, and manipulation depends on tie-break. Without a fixed tie-break, the rule isn’t resolute.  

  ---

  ### Gibbard-Satterthwaite Rebuttal and Nearby Manipulation  
  - **Theorem guarantees:** Some profile exists where one voter can manipulate unilaterally.  
  - **Nearest such profile to P:**  
    Change Voter 5’s ballot to B > A > C (sincere: C > A > B). New profile:  
    - Voter 1: A > B > C  
    - Voter 2: A > B > C  
    - Voter 3: B > C > A  
    - Voter 4: B > C > A  
    - Voter 5: B > A > C  
    Plurality counts: A=2, B=3 → B wins.  
    At this profile, Voter 5 can manipulate: By reverting to sincere (C > A > B), counts become A=2, B=2, C=1 → Tie between A and B. Tie-break → A wins. Voter 5 prefers A to B (C > A > B), so they avoid B and get A, a better outcome.  
  - **Distance:** 1 ballot change (Voter 5).  
  - **Alarm comparison:**  
    - Phone-call case: Exposes vulnerability *only* through coordination (2 voters, sequential moves).  
    - G-S manipulation: Just 1 ballot change enables unilateral manipulation.  
    Both are alarming, but the phone-call case highlights how coordination can unlock manipulation even when unilateral moves seem safe. G-S guarantees a vulnerability, but the phone-call shows it can be "dormant" and contagious.  

  This illustrates that Gibbard-Satterthwaite’s austere model (one voter, one profile) doesn’t capture the dynamic, collaborative vulnerabilities that can arise in practice. The theorem assures a flaw exists, but the phone-call case shows how easily it can propagate.
