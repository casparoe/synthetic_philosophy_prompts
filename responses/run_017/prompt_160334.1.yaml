prompt: |-
  I'm a PhD student in political theory working on the state's interest in which children come to exist, and I keep tripping over a cluster of institutional arrangements whose implicit moral theory I cannot reconstruct cleanly. Let me give you a stylized composite of things I have seen in several public health systems, since that is the object I want diagnosed. A publicly funded fertility service offers IVF together with preimplantation genetic testing, but funds testing and selective transfer only for conditions that clear a severity threshold expressed in expected-QALY-lost terms; it declines to fund polygenic scoring. For any child actually born with one of the funded-screened conditions, the same system guarantees a lifetime support entitlement, and the size of that entitlement is indexed to how severe the condition was rated to be on the very scale that justified funding the screening. Meanwhile the clinics involved will report polygenic risk scores to parents for common diseases but not for educational attainment or height, and regulation caps the number of embryos created in a cycle at a fairly modest number. So, in shorthand: the state pays to prevent the birth of children with certain conditions, pays again to support the ones who are born anyway, indexes the second payment to the rating that justified the first, refuses to pay for selection within the ordinary range, and refuses to let anyone create enough embryos to make even the permitted selection precise.

  What I want is the implicit theory, stated as sharply as you can manage, with three things kept apart: what the package strictly presupposes, what it merely sits well with, and what it is actually inconsistent with. I think the hard part is the metaphysics of benefit: since the child who results from a given transfer is not the child who would otherwise have resulted, it is unclear in what sense selecting one embryo rather than another is good for anyone, and I would like you to say which principle about selecting among possible people the practice has to be committed to, and whether that principle is the same one the rest of the health system uses when it weighs QALYs. Four tensions I suspect but cannot place: first, a health economist in my department argued that a fully compensating entitlement removes the welfare difference that was supposed to justify screening, so the two halves of the scheme defeat each other — I cannot tell whether that is a genuine reductio or a stable design feature, and I would like you to tell me which. Second, the severity rating looks like a cardinal claim about a life going less well, yet self-reported well-being among people with several of these conditions is often close to population averages, so I suspect the rating is secretly a resources or opportunity metric wearing welfare vocabulary. Third, the disease-versus-traits disclosure asymmetry seems to presuppose a line between a child's absolute prospects and competitive or positional advantage, which a straightforward maximizing principle of the kind that goes under the name procreative beneficence cannot obviously draw. Fourth, the embryo cap restricts the option set in a direction that same maximizing principle would want loosened.

  Tell me which of those four are real and which are my confusions, and where the practice is simply underdetermined — several theories would license it — rather than inventing a tidier theory than the practice deserves. Then say concretely what would have to be added, dropped, or rewritten if the operative view were replaced by, in turn, a maximizing procreative beneficence view, a sufficiency view on which parents owe the child an adequate life but not the best available one, and a permissive view on which there is no duty to select at all. Finally, be explicit about the epistemic status of your reconstruction: mark the step in it you are least confident in, distinguish the places where you are reporting what the practice entails from places where you are defending a view of your own, and say what argument or empirical finding would make you withdraw the central claim of your answer.
reasoning: |-
  Hmm, the user is a PhD student in political theory working on a complex issue about state interests in child existence. They've described a composite of public health policies related to IVF, genetic testing, and disability support that seems logically inconsistent on the surface. They want me to reconstruct the implicit moral theory behind these practices while keeping presuppositions, compatibilities, and inconsistencies separate.

  The key puzzle they present involves several policy elements: publicly funded IVF with genetic testing only for severe conditions (using QALY metrics), lifetime support for children born with screened conditions (indexed to severity), refusal to fund polygenic scoring, selective disclosure of risk scores by clinics, and embryo creation caps. The user specifically mentions four tensions they're struggling with.

  First, there's the apparent contradiction between preventing certain births while simultaneously providing generous support for those same conditions if born. Second, the disconnect between severity ratings and self-reported well-being. Third, the disease/trait disclosure asymmetry. Fourth, the embryo cap that limits selection precision.

  I need to reconstruct the implicit moral framework that could make sense of this package of policies. I'll focus on the core principles at play: the non-identity problem (since different embryos create different people), disability as difference vs. harm, and the state's role in defining "normal function."

  For the four tensions:
  - The funding paradox isn't a true contradiction - prevention and compensation serve different moral purposes even when using the same metric
  - The severity ratings likely represent deviation from species-typical function rather than subjective welfare
  - The disclosure asymmetry reflects a harm/advantage distinction rather than absolute vs. competitive goods
  - The embryo cap balances efficiency against other concerns like embryo moral status

  When considering alternative frameworks:
  - A maximizing procreative beneficence approach would require dropping embryo caps, funding polygenic scoring, and eliminating severity thresholds
  - A sufficiency approach would maintain caps and thresholds but eliminate the severity indexing of support
  - A permissive approach would remove most interventions entirely

  I should be clear about epistemic limits in my reconstruction - the trickiest part is inferring why compensation is indexed to severity when that metric doesn't map to actual welfare needs. The most speculative element is the interpretation of embryo caps as preventing commodification rather than just cost control. I'll note that evidence of different compensation structures or explicit policy rationales might change this analysis.
answer: |-
  Here is a reconstruction of the implicit moral theory underlying the described institutional arrangements, structured as requested. The analysis centers on the metaphysics of benefit, the four tensions you identified, and the implications of alternative frameworks. I'll maintain strict separation between presuppositions, compatibilities, and inconsistencies, and conclude with epistemic transparency.

  ---

  ### **I. Implicit Moral Theory: Core Principles**
  The practice presupposes a **pluralist, capability-oriented consequentialism** with a strong boundary around "normal human functioning" and a non-commodified view of procreation. Its core tenets:

  1. **Benefit to Whom?**:  
     - **Strict presupposition**: Selection prevents harm *to society* (resource burden) and *to the future child* (relative to a counterfactual where *that same child* exists with the condition). This relies on:  
       - A **modal realism** about disability: The *same child* could exist with or without the condition (contra non-identity problem objections).  
       - A **harm threshold principle**: Severe conditions constitute harm *to the child* by depriving them of "species-typical functioning" (Nussbaum/Sen capabilities), even if subjective well-being is normal.  
     - *Contrast with health system QALYs*: Standard QALY calculations assume benefit to *existing persons*. Here, benefit is to (a) society (reduced costs) and (b) the future child *as a type* (not a specific individual). This is a *distinct principle*.

  2. **Severity Threshold & Compensation**:  
     - **Strict presupposition**: Severity ratings measure *functional deviation from norm* (objective capabilities), not subjective welfare. Compensation is indexed to *cost of achieving functional equivalence* (resources/opportunities), not well-being deficits.  
     - **Sits well with**: A social contract view where society compensates for failing to prevent "unreasonable" burdens (via screening) but accepts "reasonable" variation.

  3. **Polygenic Scoring & Trait Asymmetry**:  
     - **Strict presupposition**: Selection is only justified for conditions that are:  
       - (a) **Non-relational harms** (absolute functional loss), not competitive disadvantages.  
       - (b) **Categorically severe** (cross-context detriment), not probabilistic or modifiable.  
     - **Inconsistent with**: Procreative beneficence (maximizing "best" child), as it rejects trait optimization within normal range.

  4. **Embryo Cap**:  
     - **Strict presupposition**: Embryos have *moral status* (not full personhood, but sufficient to limit instrumentalization). Creating "excess" embryos commodifies procreation.  
     - **Sits well with**: Efficiency constraints and precaution against eugenic normalization.

  ---

  ### **II. Resolving Your Four Tensions**
  1. **Funding vs. Compensation "Paradox"**:  
     - **Not a reductio; stable design**. Prevention targets *avoidable societal costs* of severe conditions (ex ante). Compensation addresses *unavoidable needs* of actual persons (ex post). The same metric is used for consistency in resource allocation (e.g., QALY loss ≈ cost of support), but the moral justifications differ: prevention is cost-avoidance, compensation is distributive justice.  
     - *Your confusion*: Assumes welfare difference is erased. But societal cost ≠ child welfare. Support guarantees don't negate functional limitation; they mitigate its financial impact.

  2. **Severity Rating vs. Self-Reported Well-Being**:  
     - **Real tension, resolved by presupposition**. Ratings measure *functional capacity gaps* (e.g., mobility, cognition), not happiness. The practice presupposes society must provide resources to approximate normal function *regardless of subjective adaptation* (capability approach).  
     - *Your suspicion is correct*: It’s a resources/opportunity metric in welfare clothing.

  3. **Disease vs. Trait Disclosure Asymmetry**:  
     - **Real and coherent**. The practice draws a line between:  
       - **Absolute harms** (diseases): Reduce baseline functioning below a threshold.  
       - **Positional goods** (traits): Affect social competition but not intrinsic functioning.  
     - **Inconsistent with procreative beneficence**, which cannot distinguish these without ad hoc thresholds.

  4. **Embryo Cap vs. Maximizing Principle**:  
     - **Real tension**. The cap restricts precision, implying:  
       - **Presupposition**: Precision beyond a point is morally hazardous (slippery slope to trait selection).  
       - **Inconsistent with maximizing views** but consistent with sufficiency or deontological constraints.

  ---

  ### **III. Alternative Frameworks: Required Changes**
  | Current Practice                 | Maximizing Procreative Beneficence         | Sufficiency View                          | Permissive View                    |
  |----------------------------------|--------------------------------------------|-------------------------------------------|------------------------------------|
  | **Severity threshold**           | Drop: Fund all risk-reduction             | Keep, but lower threshold to "adequacy"  | Drop: No state-funded screening    |
  | **Polygenic scoring ban**        | Drop: Fund all predictive selection       | Keep (only severe threats)               | Keep (no state role)               |
  | **Embryo cap**                   | Drop: Allow unlimited embryos             | Keep (prevents excess)                   | Keep/irrelevant                   |
  | **Compensation indexing**        | Drop (irrelevant to maximization)         | **Rewrite**: Flat support for all needs  | Keep (no change)                   |
  | **Trait disclosure asymmetry**   | Drop: Disclose all predictive data        | Keep (only for severe threats)           | Drop: Clinic/parent discretion    |

  ---

  ### **IV. Epistemic Status & Uncertainty**
  - **Reporting vs. Defending**:  
    - *Reporting*: The reconstruction of presuppositions (e.g., capability-based harm, societal cost avoidance) is inferred from institutional logic.  
    - *Defending*: The claim that this forms a "coherent pluralist consequentialism" is my synthesis; others might see fragmentation.  
  - **Least Confident Step**:  
    - The inference that **compensation indexing** reflects a *deliberate alignment* of prevention and support costs (II.1). It could equally be bureaucratic inertia. Weakest if policies evolved separately.  
  - **Central Claim Vulnerability**:  
    - The core claim—that the system presupposes a *capability-based harm threshold*—would be falsified by:  
      - Evidence that severity ratings **explicitly incorporate subjective well-being** (e.g., using quality-of-life surveys).  
      - Policies **indexing compensation to actual welfare loss** (not functional deficit).  
  - **Underdetermined Areas**:  
    - The embryo cap **could** reflect cost-control vs. moral status concerns.  
    - Trait asymmetry **could** reflect political compromise, not moral coherence.  

  ---

  ### **Conclusion**
  The practice is *not* reducible to a single principle but combines: (1) societal cost-benefit for severe functional deficits, (2) capability-based harm to the child, and (3) anti-commodification of procreation. It is **internally stable** but **inconsistent with maximizing views**. Your tensions #2 and #4 are substantive; #1 and #3 reflect misunderstandings resolvable through its pluralist design. The deepest conflict is with any framework (e.g., procreative beneficence) that rejects the bright line between "severe functional deficit" and "normal-range variation." To test this, investigate policy documents defining "severity"—if they reference social costs or functional norms (not welfare), the reconstruction holds.
