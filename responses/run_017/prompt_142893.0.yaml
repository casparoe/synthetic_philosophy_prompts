prompt: |-
  Hi — I'm one of five people on the investment committee of a small (~$180m) college endowment. We look at maybe 25 opportunities a year, meet monthly, and every memo we write ends in a number: a probability of hitting the target return, which we then feed into a position size. I've become convinced this is broken in a specific way: it makes us systematically favour whatever is easiest to model, and it lets a manager with a nice backtest of a brand-new strategy outcompete a boring fund with fifteen years of actual data, because the backtest produces a cleaner number. Someone pointed me at Keynes's Treatise on Probability — the bit about probability being a degree of rational belief grounded in evidence, and especially his separate notion of the weight of an argument (how much evidence you have, as opposed to how favourable it is), plus his claim that for a lot of real decisions there just is no numerical probability and people fall back on a convention that the future will look like the past, or on what everyone else is doing.

  Can you turn that into a procedure we could actually run in a committee meeting? I mean: the questions in order, what counts as a real answer to each, when the procedure spits out a no, and when it has to hand the question back to us as a values call. Three things I care about most. (1) A test for whether a number in a memo is grounded in an actual class of comparable cases or is really just model output dressed up — I want the memo to say which. (2) Some rule connecting weight to position size that doesn't collapse into "be more conservative when you know less." (3) What we're supposed to do when there genuinely is no probability: Keynes seems to say falling back on convention is just what everyone does, but I want to know when that's fine and when it's self-deception, and whether "hold cash and wait" is ever an honest output we could defend to a board that hates cash drag.

  Then run it on three cases: (a) re-upping with a private credit manager we've been with through two downturns and who has 15 years of quarterly data; (b) a first-time fund doing something genuinely new with a beautiful backtest and three months of live trading; (c) our single biggest allocation, which we've rolled over for years mostly because its never given us a reason to stop — I have a feeling the procedure is going to tell us something about that one that we don't want to hear. And please say plainly what the procedure can't do for us.
reasoning: |-
  Okay, the user is part of an investment committee for a college endowment. They're frustrated with their current approach of assigning probabilities to investment opportunities because it favors easy-to-model strategies over those with real track records. They mentioned Keynes's ideas about probability and the weight of evidence, and they want a practical procedure to address these issues.

  First, I need to unpack their main concerns. They want a way to distinguish between probabilities based on actual comparable cases versus model outputs. They also need a rule for position sizing that incorporates the weight of evidence without just being more conservative. And they're unsure how to handle situations where no numerical probability can be determined, especially regarding holding cash.

  The user provided three test cases: a proven private credit manager, a new fund with a backtest but little live data, and a longstanding allocation that's been rolled over out of inertia. These cases will help illustrate how the procedure works in practice.

  I should structure the procedure around Keynesian concepts, starting with evidence classification. Breaking evidence into categories like frequency, comparability, and causal depth makes it easier to evaluate. For each investment, the committee would map the evidence to these categories and determine if numerical probability is meaningful.

  For position sizing, the weight of evidence should influence sizing independently of the probability. A matrix approach that considers both probability and weight could work. High weight with high probability justifies larger positions, while high weight with low probability suggests avoiding the investment. Low weight scenarios require more caution, regardless of probability.

  Handling non-quantifiable scenarios is crucial. The procedure needs to identify when numerical probabilities aren't valid and provide alternatives like relying on convention only when it's robust, or holding cash when uncertainty is too high. The user mentioned board concerns about cash drag, so justifying cash holdings as a defensive measure is important.

  Applying this to the test cases: The private credit manager scores high on weight due to extensive real-world data, supporting a larger position. The new fund has high model weight but low real-world evidence, leading to a small exploratory allocation. The longstanding allocation might show low probability and low weight if it's held out of inertia, suggesting a reduction unless new evidence supports it.

  Limitations include the committee's judgment still playing a role, potential biases in assessing weight, and the challenge of comparing across evidence types. The procedure can't replace human judgment but structures it better.

  Deep needs: The user likely wants to reduce model bias, justify decisions to the board, and avoid complacency with legacy investments. They need a transparent framework that highlights evidence quality over neat models, ensuring long-term endowment stability.
answer: |-
  Here's a practical committee procedure based on Keynesian principles, designed to tackle your core issues and applied to your test cases. It focuses on **evidence classification**, **weight assessment**, and **decision rules** for when numbers fail.

  **The Keynesian Evidence & Weight Procedure (KEWP)**

  **Before the Meeting:**
  1.  **Memo Requirement:** Every memo *must* explicitly categorize the primary source of the "probability" number:
      *   **F-Class (Frequency):** Grounded in a defined, statistically significant population of comparable historical cases (e.g., "Based on 50 similar private credit funds launched in similar markets over the past 20 years, X% achieved >Y% IRR").
      *   **C-Class (Causal/Model):** Primarily derived from a theoretical model, backtest, or causal argument about how the strategy works, *even if* historical data is used to parameterize it. *Must state key model assumptions.*
      *   **H-Class (Hybrid):** Combines elements of F and C. *Must specify the relative weight given to each component.*
      *   **NC-Class (Non-Quantifiable):** Explicitly states that a meaningful numerical probability grounded in comparable cases *cannot* be assigned. Must then provide the qualitative basis for belief.

  **In Committee Meeting (Per Opportunity):**

  1.  **Evidence Classification Check:**
      *   Question: *"Based on the memo's classification (F/C/H/NC), is this accurate and justified?"*
      *   Real Answer: Committee consensus on classification accuracy. Challenge memos claiming F-Class without a demonstrable comparable population or H-Class without justification.
      *   **SPITS OUT "NO" IF:** Classification is misleading (e.g., a pure backtest dressed as F-Class). Send memo back for revision/reevaluation.
      *   **VALUES CALL IF:** Genuine debate exists on the appropriate classification (e.g., how "comparable" is comparable?).

  2.  **Weight of Argument Assessment (Independent of Probability #):**
      *   Questions:
          *   *"What is the breadth, depth, and relevance of the evidence supporting the *entire* investment thesis (beyond just the return probability)?"*
          *   *"How much *relevant* evidence do we have? (Consider: time horizon covered, market regimes observed, live track record length/quality, transparency, manager experience through stress, robustness checks on models, comparability of cases, fundamental causal plausibility)."*
      *   Real Answer: Qualitative assessment leading to a **Weight Score (1-5):**
          *   **5: Very High Weight:** Deep, long-term evidence across multiple cycles; high relevance; strong causal understanding; proven manager adaptability; excellent transparency. (e.g., 15+ yrs live data through downturns).
          *   **4: High Weight:** Solid evidence across relevant timeframes/conditions; good relevance; plausible causality; reasonable transparency. (e.g., 7-10 yrs live data, including one stress).
          *   **3: Moderate Weight:** Adequate but limited evidence; some relevance questions; basic causal logic; acceptable transparency. (e.g., 3-5 yrs live data, or strong F-Class comps).
          *   **2: Low Weight:** Sparse, short-term, or low-relevance evidence; weak or untested causal logic; limited transparency. (e.g., <3 yrs live data, reliance on untested model).
          *   **1: Very Low Weight:** Minimal evidence; highly novel/untested; opaque; weak causal logic. (e.g., pure theory, very short track record, complex black box).
      *   **VALUES CALL IF:** Disagreement on weighting specific evidence types (e.g., how heavily to discount a short live track record vs. a long backtest).

  3.  **Probability Grounding Test:**
      *   Question: *"For the stated probability number (if present), is it grounded in a *true* frequency of comparable cases (F-Class), or is it model output/conjecture (C-Class)?"* (This echoes Step 1 but focuses on the number itself).
      *   Real Answer: Explicit confirmation or correction of the grounding.
      *   **SPITS OUT "NO" IF:** A number is presented as reliable/actionable F-Class when it demonstrably isn't. Forces explicit recognition of model reliance.
      *   **VALUES CALL:** N/A (This is a factual check based on Step 1 outcome).

  4.  **The Weight/Position Size Rule (Not Just "Be More Conservative"):**
      *   Rule: **Position size is capped by the Weight Score.**
          *   **Weight 5:** Full allocation based on probability/conviction possible (within overall portfolio limits).
          *   **Weight 4:** Max allocation = 80% of full size based on probability/conviction.
          *   **Weight 3:** Max allocation = 50% of full size based on probability/conviction. **Mandatory Pilot Sizing.**
          *   **Weight 2:** Max allocation = 25% of full size based on probability/conviction. **Strongly Recommend Pilot Sizing.**
          *   **Weight 1:** Max allocation = 10% of full size based on probability/conviction. **Exploratory Sizing Only.**
      *   *Why it works:* It doesn't directly change the *probability* assessment (e.g., you might still believe a new strategy has a 70% chance of success). Instead, it limits the *financial exposure* permitted when the *evidence supporting that belief is thin* (Low Weight). High conviction + Low Evidence = Small Bet. Low conviction + High Evidence = Avoid or Small Bet. It forces diversification away from low-evidence bets regardless of how enticing the model number looks.

  5.  **Handling Non-Quantifiable (NC-Class) & Keynesian Convention:**
      *   Question: *"Is a numerical probability genuinely meaningless or impossible here? If so, what convention or alternative anchor are we relying on?"*
      *   Real Answers:
          *   Explicit statement that no numerical probability is assigned (NC-Class).
          *   Identification of the convention (e.g., "This strategy resembles long-term equity beta," "This is the industry standard fee structure," "We're following Peer Group X").
          *   **Test for Self-Deception:**
              *   *"Is this convention based on observable, widespread *behavior* (what people *do*) or just narrative (what people *say*)?"* (Behavior > Narrative).
              *   *"Is there evidence this convention has persisted *through stress*?"* (Durability matters).
              *   *"Does relying on this convention expose us to a potential *common mode failure* if everyone is wrong?"* (Keynes's caution).
      *   **Decision Rules:**
          *   **Convention is Deemed Robust (Passes Test):** Proceed with investment, but treat as **Weight 3 (Moderate) MAX**. Size using convention-based anchors (e.g., peer allocation, strategic policy target) capped at 50% of that anchor.
          *   **Convention is Deemed Fragile/Questionable (Fails Test):** **"Hold Cash and Wait" is a valid, defensible output.** Frame it as: "The weight of evidence is too low (Weight 1 or 2), and no reliable convention exists. Committing capital here is speculation, not investment. We preserve optionality for future, higher-weight opportunities."
          *   **VALUES CALL IF:** Committee disagrees on the robustness of the convention or the validity of NC-Class designation.

  **Applying KEWP to Your Cases:**

  *   **Case (a) Private Credit Manager (15 yrs, 2 downturns, quarterly data):**
      *   Class: **F-Class** (Clear population: *this specific manager's history* is the comparable case).
      *   Weight: **5 (Very High)**. Deep, long-term, real-world evidence across cycles. High relevance.
      *   Prob Grounding: Solid (F-Class).
      *   Position Sizing: Full allocation based on probability/conviction permitted. KEWP strongly supports re-up with significant size.

  *   **Case (b) First-Time Fund (Beautiful Backtest, 3mo live):**
      *   Class: **C-Class** (Model/Backtest driven). *Maybe* H-Class if comps exist, but likely low relevance.
      *   Weight: **2 (Low Weight)**. Sparse live evidence (3mo), heavy reliance on untested model/backtest (prone to overfitting, regime dependency). Novelty adds uncertainty.
      *   Prob Grounding: Model output (C-Class). Number is inherently fragile.
      *   Position Sizing: **Max 25%** of the size the beautiful backtest probability might suggest. **Pilot/Exploratory Sizing Mandated.** KEWP forces a small bet due to low evidence weight, despite potentially high model probability.

  *   **Case (c) Big Legacy Allocation (Rolled over, no reason to stop):**
      *   Class: **Likely NC-Class or H-Class (leaning C)**. Why? If there's no *active* probability assessment, it's inertia/convention.
      *   Weight: **Assess Honestly!** How much *new, relevant* evidence supports *continued* outperformance/appropriateness? Has the market changed? Has the manager/strategy evolved? If it's just "it hasn't blown up," weight might be **3 (Moderate)** or even **2 (Low)** – resting on past laurels isn't strong *current* evidence. Lack of scrutiny *lowers* effective weight.
      *   Prob Grounding: Probably non-existent or stale model/convention.
      *   **KEWP Output (Likely Uncomfortable):**
          *   Forces explicit NC-Class designation ("We're rolling because of convention/inertia").
          *   Tests Convention: "Rolling because we always have" fails the robustness test (it's not based on durable behavior through stress, just absence of disaster). Peer pressure alone is fragile.
          *   **Decision:** Likely **"Hold & Re-evaluate" isn't enough.** KEWP pushes for either:
              *   A **rigorous re-underwriting** *now* to establish a current F/C/H Class and Weight (treating it like a *new* investment), leading to a size adjustment per Steps 1-4. Or,
              *   Recognizing the low effective weight (e.g., 2-3) and **reducing size significantly** (per Step 4 Rule - perhaps 25-50% of current size) pending re-underwriting. "No reason to stop" becomes "No *evidence* to continue at this size."

  **What KEWP Can't Do For You:**

  1.  **Eliminate Judgment:** It structures judgment (classification, weighting, convention robustness) but doesn't replace it. Committees will still debate.
  2.  **Quantify the Unquantifiable:** It doesn't magically create numbers for NC-Class situations. It forces you to confront the absence and act accordingly.
  3.  **Predict the Future:** It improves decision-making *under uncertainty* but doesn't remove uncertainty. High Weight ≠ Guaranteed Success (Black Swans exist). Low Weight ≠ Guaranteed Failure (Some breakthroughs happen).
  4.  **Define "Comparable":** Deciding what constitutes a sufficiently comparable case for F-Class remains subjective.
  5.  **Prevent Model Error:** If the underlying model in C-Class is fundamentally flawed, KEWP limits exposure but doesn't detect the flaw.
  6.  **Solve Cash Drag Hate:** It provides a rigorous *defense* for holding cash ("No high-weight opportunities meeting our standards exist"), but you still need to persuade the board that this discipline protects capital better than forcing low-weight investments. Frame cash as "dry powder for future high-weight opportunities" and a volatility dampener.
  7.  **Replace Overall Portfolio Construction:** This focuses on individual asset decisions. You still need top-down asset allocation and risk management.

  **In essence, KEWP forces intellectual honesty about the quality and source of your beliefs, systematically limits bets made with weak evidence (countering model bias), and provides a structured way to navigate the unavoidable uncertainty Keynes described – including justifying cash.** It shines an uncomfortable but necessary light on inertia masquerading as investment.
