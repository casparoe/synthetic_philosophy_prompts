answer: |-
  ## Research Proposal: Prioritarianism's Fragile Escape from Levelling Down

  **1. Research Question:**
  Can prioritarianism, under plausible interpretations of its weighting function, endorse a *pure* levelling down (reducing the welfare of the better-off without increasing the welfare of the worse-off) as a strict improvement in weighted total welfare? Specifically, does this occur if the priority weight assigned to an individual’s welfare is a function of their *relative position* (e.g., rank, distance below average/median) rather than solely their *absolute welfare level*, or if the weight is applied directly to *prospects* rather than realized welfare?

  **2. Challenging the Received Story (Why the Question is Open):**
  The standard defense holds that prioritarianism (assigning increasing marginal moral weight to welfare gains as absolute welfare decreases) avoids the levelling-down objection (LDO) that plagues telic egalitarianism. Since the weight is positive and depends *only* on the recipient's *absolute* welfare level, reducing a better-off person's welfare (without aiding the worse-off) always decreases the weighted total – a pure levelling down is never recommended. This escape is pitched as a decisive advantage over egalitarianism. However, this relies on two often-implicit assumptions: (A) the weight is a function *only* of the individual's *absolute* welfare level, and (B) the weight is applied to *realized welfare states*. This project contends that relaxing either assumption opens the door to prioritarianism endorsing levelling down, revealing a vulnerability masked by the standard "absolute/realized" framing. Both standard prioritarianism and standard telic egalitarianism leave this vulnerability unexplored, focusing debate on the absolute vs. relational nature of the *concern* (priority vs. equality), not the *inputs* to the weighting mechanism itself.

  **3. Methodology:**
  *   **Months 1-2: Conceptual Groundwork & Case Construction:** Precisely define the core prioritarian structure: a social ordering based on summing `f(w_i)`, where `w_i` is individual i's welfare, and `f` is a strictly increasing and concave function. Distinguish the *variable* input to `f`: absolute welfare (`w_i`), relative rank (i's position in the welfare ordering), or distance below a reference point (e.g., `(avg_w - w_i) for w_i < avg_w`). Define "pure levelling down" operationally: a change reducing welfare for some individual(s) `j` (`w_j` decreases) without increasing welfare for any individual `i` (`w_i` remains constant or decreases for all `i`), while holding population fixed.
  *   **Month 3: Modelling Absolute Prioritarianism:** Formalize the standard model: `f = f(w_i)`. Construct simple two-person cases demonstrating its rejection of pure levelling down (e.g., (10, 5) vs. (9, 5): weighted sum decreases). Confirm robustness.
  *   **Months 4-5: Modelling Comparative Weighting Functions:**
      *   **Rank-Weighted Prioritarianism:** Define `f = f(rank_i)`, where rank is determined by position in the welfare ordering (1=worst-off, n=best-off). `f` is strictly decreasing and convex in rank (higher weight for worse rank). Construct simple cases (e.g., initial state (10, 5): `rank_A=2, rank_B=1`. Level down to (9, 5): `rank_A=2, rank_B=1` remains. Does weighted sum change? Now consider (10, 10, 5): `ranks=3,3,1`. Level down one 10 to 9: new state (9,10,5); `ranks=2,3,1`. Weight for the worst-off (rank 1) is unchanged. Weight for the levelled-down individual (now rank 2) increases compared to rank 3. Is the net effect an *increase* in total weighted welfare? Refine cases with specific `f` functions (e.g., weight = 1/sqrt(rank)).
      *   **Distance-Below-Average Weighted Prioritarianism:** Define `f = f(d_i)` where `d_i = max(0, avg_w - w_i)`. `f` is strictly increasing and concave in `d_i`. Initial state (10, 5): `avg=7.5, d_A=0, d_B=2.5`. Level down to (9,5): `avg=7, d_A=0, d_B=2`. `d_B` decreases, so weight for B *decreases*. Weighted sum decreases. Now consider (20, 10, 0): `avg=10, d_A=0, d_B=0, d_C=10`. Level down A to 19: new state (19,10,0); `avg≈9.67, d_A≈0, d_B≈0, d_C≈9.67`. `d_C` *decreases* slightly. Weighted sum likely decreases. **Critical Test:** Introduce asymmetry. State (15, 15, 5): `avg≈11.67, d_A=0, d_B=0, d_C≈6.67`. Level down *one* 15 to 10: new state (15, 10, 5); `avg=10, d_A=0, d_B=0, d_C=5`. `d_C` *decreases*. Weighted sum likely decreases. **Pivot:** Now state (11, 11, 8): `avg=10, d_A=0, d_B=0, d_C=2`. Level down *one* 11 to 10: new state (11, 10, 8); `avg≈9.67, d_A=0, d_B≈0, d_C≈1.67`. `d_C` decreases. Still decrease? **Stress Test:** State clustered near average with one significantly below. State (12, 12, 12, 4): `avg=10, d_A=0, d_B=0, d_C=0, d_D=6`. Level down *one* 12 to 8: new state (12,12,8,4); `avg=9, d_A=0, d_B=0, d_C=1, d_D=5`. `d_D` *decreases*, but `d_C` *increases* (from 0 to 1). Calculate with specific `f` (e.g., `f(d_i) = sqrt(d_i)`): Initial sum: `sqrt(0)+sqrt(0)+sqrt(0)+sqrt(6) ≈ 2.45`. New sum: `sqrt(0)+sqrt(0)+sqrt(1)+sqrt(5) ≈ 0 + 0 + 1 + 2.24 = 3.24 > 2.45`. **Result:** Level-down *increases* total weighted welfare. Vary `f` and initial distributions to test robustness of this effect.
  *   **Month 6: Prospect-Weighted Prioritarianism:** Define the variant: weights are assigned based on *expected* welfare (prospects) at the time of decision, applied to realized outcomes. Construct a case: Choice between Policy X (certain: (10, 5)) and Policy Y (risky: 50% chance (20, 5), 50% chance (5, 5)). Assume `f` concave in absolute welfare. Prospect-weighted prioritarianism might prefer Y if the higher weight on the potential low outcome for the first individual dominates. Suppose Y is chosen and the *actual* outcome is (5,5). Compare this to the forgone certain outcome of X (10,5). The actual welfare under Y (5,5) is *worse for everyone* than under X (10,5). This resembles a form of ex-post levelling down demanded by the ex-ante weighting. Analyze the structure: does the weight applied to prospects depend on *relative* positions within possible outcomes? Connect to the comparative/absolute input distinction.
  *   **Month 7: Synthesis & Unification:** Systematically compare the structures of the problematic cases identified in Months 5 & 6. Is the core mechanism the same? Does it always involve the weight for *some* worse-off individuals *increasing* (or being higher in expectation) due to a change that lowers *absolute* welfare elsewhere, even if the *absolute* welfare of the worse-off remains unchanged? Argue that the common fault line is the *input* to the weighting function (absolute vs. comparative information) rather than the *type* of distributive concern (priority vs. equality).
  *   **Month 8: Implications & Conclusion Drafting:** Analyze the significance. Does this show prioritarianism's LDO-escape is fragile? Does it blur the line with egalitarianism? Does it suggest a new taxonomy of distributive views based on the *information-sensitivity* of the weighting function? Refine the core thesis.
  *   **Month 9: Finalizing & Integration:** Polish arguments, ensure precise formal definitions throughout, integrate findings into a cohesive paper draft (~9000 words), prepare for submission.

  **4. Range of Possible Conclusions & Deciding Factors:**
  *   **Strong Confirmation:** Clear, robust cases exist where rank-weighted, distance-weighted, and prospect-weighted prioritarianism endorse pure levelling down as an improvement. The deciding factor is the mathematical demonstration showing increased weighted total welfare in pure levelling-down scenarios under these interpretations. The commonality is the use of comparative inputs to `f`.
  *   **Partial Confirmation:** Only one type of comparative weighting (e.g., distance-based in specific clustered distributions) robustly endorses levelling down, while rank-weighting or prospect-weighting does not (or only under implausible `f`). Deciding factor: Results from stress-testing various `f` functions and distributions across the different weighting types.
  *   **Weak Confirmation/Reframing:** While pure levelling down isn't endorsed, these variants exhibit counterintuitive results *akin* to the LDO's spirit (e.g., endorsing changes that are Pareto-inferior ex-post under prospect weighting). The fault line argument holds, but the strict LDO isn't replicated. Deciding factor: Failure to find unambiguous pure levelling down, but success in identifying structurally similar, normatively problematic implications stemming from comparative inputs.
  *   **Project Failure (Standard View Holds):** No plausible interpretation of prioritarianism, even with comparative inputs, endorses pure levelling down. The constructed cases either don't show a strict improvement or rely on misinterpreting prioritarianism (e.g., making `f` directly sensitive to others' welfare violates prioritarianism's agent-relativity). Deciding factor: Mathematical demonstration that weighted sums *always* decrease in pure levelling-down scenarios under any coherent prioritarian `f`, regardless of input type.

  **5. Conditions for Failure:**
  The project fails to achieve its core aim if:
  1.  **Not True Levelling Down:** The constructed cases inadvertently involve changes that are not pure levelling down (e.g., welfare changes for the worse-off are implied, or population changes).
  2.  **Irrelevant Objection:** The identified phenomena under comparative/prospect weighting, while problematic, are demonstrably *not* instances of the levelling-down objection, but represent a distinct (even if related) weakness (e.g., a different kind of Pareto violation, or a time-inconsistency problem).
  3.  **Not Prioritarianism:** The weighting functions incorporating rank/distance/prospects are successfully argued to fall outside the definitional boundaries of prioritarianism proper, constituting a different (e.g., explicitly relational egalitarian) view.
  4.  **Negligible Effect:** The increase in weighted welfare under comparative weighting in levelling-down scenarios is mathematically possible but vanishingly small or only occurs under highly unrealistic `f` functions or distributions, rendering the objection practically insignificant.
  5.  **Misdiagnosis:** The prospect-weighting problem is shown to be fundamentally different in structure from the comparative-input problem, undermining the "one underlying fault line" hypothesis.

  **Epistemic Key:**

  *   **Settled:**
      *   Standard prioritarianism (`f(w_i)`) escapes the levelling-down objection. (Standard result in prioritarian literature)
      *   Telic egalitarianism is vulnerable to the levelling-down objection. (Standard critique of egalitarianism)
      *   Prioritarianism is defined by summing a concave transformation of individual welfare. (Standard definition)
      *   Pure levelling down reduces welfare for some without increasing it for anyone. (Definitional)
  *   **Contested:**
      *   The escape from the LDO is the *primary* advantage of prioritarianism over egalitarianism. (Debated among prioritarians and egalitarians)
      *   The weighting function `f` in prioritarianism *must* depend solely on the absolute welfare level `w_i`. (Implied by standard view, but not always explicitly defended; the possibility of other inputs is rarely explored).
      *   The distinction between "priority" and "equality" is the most fundamental one in distributive ethics. (Debated, e.g., by sufficiency theorists or those emphasizing different fault lines).
  *   **My Conjecture:**
      *   If priority weight depends on relative position (rank/distance), prioritarianism can endorse pure levelling down. (**Core Hypothesis**)
      *   Prospect-weighted prioritarianism can demand policies leading to Pareto-inferior outcomes, resembling a form of levelling down. (**Linked Hypothesis**)
      *   These phenomena share a common cause: sensitivity to comparative (non-absolute) information in the weighting function. (**Unifying Claim**)
      *   The absolute vs. comparative *input* to weighting is a more salient fault line than priority vs. equality for understanding vulnerability to LDO-like objections. (**Central Thesis**)

  **Most Likely Vulnerable Step:** The conjecture that rank-weighted prioritarianism (`f(rank_i)`) can endorse pure levelling down. It is plausible that rank orders remain stable during simple levelling down (e.g., levelling down one top person in (High, High, Low) to just above the next tier might not change the worst-off's rank or weight). Finding robust cases where ranks change *and* this increases the weighted total in a pure level-down scenario is critical and potentially tricky. Failure here significantly weakens the core argument.
