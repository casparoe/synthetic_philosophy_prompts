     - Ask a student who committed: "Would you have paid the same for one play as you did for the policy? Why?"
     - Point: The policy allows averaging over multiple plays, so the average outcome might be more stable. This relates to the idea of averaging over time.

  4. Table 4 with fixed known cap and unlimited funding:
     - Ask: "How did your bids at Table 4 compare to Table 1? Why?"
     - Point: Without default risk, the game is more valuable.

  5. The moment when a high bidder busted and a low bidder got lucky:
     - Ask: "Did the student who bid high and got a low payout make a mistake? What about the low bidder who got lucky?"
     - Point: In a single play, even if the expected value is high, the actual outcome is risky. This illustrates diminishing marginal utility and probability weighting.

  6. The aggregation issue:
     - Mention the student's comment about the expectation not being well-defined because of the order of summation. 
     - Ask: "In our vault, did the order of play matter? Why?"
     - Point: The expectation is conditional on the state of the vault (which depends on the sequence of play). So the value of the game depends on when you play.

  7. The unstageable tail:
     - Note that we capped at 20 flips for practicality, so we didn't experience the true tail. But the vault cap also limited it.

  What will go wrong:

  - Bidding zero: Some students might bid zero as a joke. Then if they win, they play for free. That's acceptable, but they might get a payout. It illustrates that even a free play has risk (if they value their time, but in points, it's free).

  - Hedging across tables: Students might try to play at different tables to diversify. That's a natural response and can be discussed in debrief (how diversification affects risk).

  - Vault math: Updating the vault might take time. We can use a calculator and a spreadsheet projected? Or have a TA dedicated.

  - Coin on the floor: Have spare coins.

  - Extra credit as money: They might question the currency. We can say: "The points are convertible to extra credit at a rate of X, so treat them as money for this activity."

  What the activity cannot reproduce:

  - The true tail: We capped at 20 flips, so the expected value is finite and computable. We didn't experience the infinite expectation.

  - The life context: The extra credit points are a small stake, so diminishing marginal utility is not strongly felt. We can point this out.

  - The policy commitment: We only did 5 rounds, which isn't a long-term average. The law of large numbers doesn't have time to kick in.

  At the end, the facilitator must say:

    "In the real St. Petersburg game, there is no cap, so the expectation is infinite. But in our activity, we had caps. The standard resolutions are: (1) diminishing marginal utility of money, (2) the house has a finite bankroll, (3) people overweight small probabilities, and (4) averaging over many plays. We experienced (2) with the vault, (3) with the hidden cap (ambiguity), and (4) with the policy. But note that each of these changes the game: the vault cap makes the expectation finite, and the policy changes the decision from one play to many. So the paradox is resolved by redefining the problem."

    And then open for discussion.

  This is a complex activity. We might need to adjust on the fly.

  But I hope this meets the requirements.
answer: |-
  Below is a comprehensive activity designed to make the St. Petersburg paradox viscerally felt through hands-on play. Students will confront the gap between infinite expected value and real-world behavior by experiencing risk, ambiguity, sequencing effects, and policy commitment. The activity uses play money (points) convertible to extra credit (e.g., 1 point = 0.003% on a problem set, so 1,000 points ≈ 3% extra credit). **No one mentions "expected value" until debrief.**

  ---

  ### **Activity Overview**
  - **Duration:** 75 minutes  
  - **Students:** 18, divided into 4 groups (4–5 per group) starting at tables.  
  - **Tables:** 4 clusters, each hosting a variant of the St. Petersburg game. Students rotate tables every round.  
  - **Stakes:** Each student starts with 1,000 points. Points are used to bid for the right to play.  
  - **Rounds:** 5 rounds (10 min/round), each consisting of bidding, play, and vault updates.  
  - **Core Twist:** A **shared visible vault** (starting at 500,000 points) funds all payouts. Payouts drain the vault, creating default risk.  
  - **Sealed Bids:** All bidding is silent/sealed to prevent herd behavior.  
  - **Key Variants:**  
    - **Table 1:** Shared vault + visible default risk.  
    - **Table 2:** Shared vault + **hidden cap** (ambiguity via sealed envelope).  
    - **Table 3:** Shared vault + **policy commitment** (play all rounds).  
    - **Table 4:** Known cap + no default risk (control group).  

  ---

  ### **Materials**
  1. **Vault & Tracking:**  
     - Large whiteboard/poster showing vault balance (start: 500,000 points).  
     - Calculator for vault updates.  
  2. **Table-Specific:**  
     - **All tables:** Coins, bid slips, pens, payout calculator.  
     - **Table 2:** Sealed envelope with hidden cap (e.g., "Cap = 15 flips"). Show distribution: 50% chance cap=10, 30% cap=15, 20% cap=20.  
     - **Table 3:** Policy commitment contract (sign to commit to playing all rounds).  
     - **Table 4:** Sign: "Fixed cap: 65,536 points (2¹⁶). Unlimited funding."  
  3. **Student Kits:**  
     - Scorecards to track points.  
     - 1,000 starting points (play money).  

  ---

  ### **Game Rules & Payoff Schemes**
  **General St. Petersburg Rules:**  
  - Flip fair coin until tails appears. Payout = 2^(number of heads) points (e.g., 3 heads → 2³ = 8 points).  
  - **Cap Note:** Physical cap at 20 flips (practicality). Vault caps override if lower.  

  | Table | Variant                  | Bidding & Play                                                                                                                                 | Purpose                                                                 |
  |-------|--------------------------|------------------------------------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------|
  | 1     | **Shared Vault (Default Risk)** | Bid each round. Highest bidder wins. Payout drawn from shared vault. If payout > vault, player gets remaining vault, vault=0.                 | Feel how vault depletion changes game value; sequence matters.          |
  | 2     | **Hidden Cap (Ambiguity)**      | Bid each round. Highest bidder wins. Hidden cap (in envelope) limits max flips. Cap unknown but distribution shown. Payout from vault.         | Elicit ambiguity aversion; contrast with Table 1’s known rules.         |
  | 3     | **Policy Commitment**           | **One-time bid before Round 1.** Highest bidder commits to playing **all 5 rounds** at Table 3. Pays bid upfront, receives payouts each round. | Value of repeated play vs. single shot; averaging over time.            |
  | 4     | **Known Cap (No Risk)**         | Bid each round. Highest bidder wins. Fixed cap (65,536 points). Unlimited funding (no default risk).                                          | Control group; isolates effect of default risk/ambiguity.               |

  **Bidding Process:**  
  - Each round, students submit **sealed bids** for the table they’re at.  
  - **Winning bid:** Highest bid pays their bid and plays. Ties resolved by coin flip.  
  - **Non-winners:** Keep points, no play.  

  ---

  ### **Timeline (75 Min Total)**
  | Phase             | Time    | Activity                                                                                                                               | Instructor Role                                                                 |
  |-------------------|---------|----------------------------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Setup (10 min)** | 0–10    | - Divide students into 4 groups (start at tables).<br>- Distribute materials.<br>- Explain rules: **Emphasize vault, sealed bids, no EV talk.**<br>- Show hidden cap distribution (Table 2). | Brief, interactive. No theory. Focus on mechanics: "Your goal: maximize points." |
  | **Policy Bid (5 min)** | 10–15   | - **Table 3 only:** Students submit sealed bids for policy commitment (play all rounds).<br>- Announce winner (highest bidder). Winner signs contract, pays bid. | Collect bids, announce winner. Remind: "Others bid round-by-round elsewhere." |
  | **Rounds 1–5 (50 min)** | 15–65   | **Per Round (10 min):**<br>1. **Bid (2 min):** Students submit sealed bid for their current table.<br>2. **Resolve (3 min):** Tables identify highest bidder. Winner pays bid, plays game.<br>3. **Play (5 min):** Flip coin until tails or cap. Calculate payout:<br>   - Update vault (if Tables 1–3).<br>   - Record payouts on scorecards.<br>4. **Rotate:** Students move to next table (Table 1→2→3→4→1). | Monitor, enforce time. Update vault publicly. **Crucial:** Log key events (e.g., "Round 3: Table 1 winner bid 100, got 4 heads, won 16 points; vault now 480,000"). |
  | **Debrief (10 min)** | 65–75   | Guided discussion (see below).                                                                                                        | Facilitate, connect experiences to theory.                                     |

  ---

  ### **Predictable Problems & Mitigation**
  - **Bidding zero/joke bids:** Likely. Mitigate by announcing: "Bids of 0 may win but waste a chance to gain points."  
  - **Hedging across tables:** Students might bid low at risky tables. **Use:** In debrief to discuss diversification.  
  - **Vault math delay:** Assign a "vault tracker" student to calculate payouts.  
  - **Coin/chaos:** Use large coins; have spares. Caps prevent >20 flips.  
  - **Extra credit debate:** Pre-empt: "Points are real incentives—treat them as money."  
  - **Time crunch:** Skip Round 5 if needed; focus on debrief.  
  - **Tail unstageable:** True—caps avoid 30-heads streaks. **Admit in debrief:** "We capped flips; real paradox requires infinite plays."  

  ---

  ### **Debrief (10 Min): Connecting Experience to Theory**
  **Goal:** Students articulate why their behavior clashed with "infinite expected value" and how standard "fixes" redefine the problem.  

  | **Debrief Step**               | **Sample Questions**                                                                                              | **Theory Link**                                                                 |
  |--------------------------------|--------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **1. Elicit Observations**     | "What surprised you?"<br>"When did you feel nervous?" (Use vault logs: "Round 2 vault=400K; Round 4 vault=50K")   | Surface intuitions vs. abstract math.                                           |
  | **2. Contrast Bid vs. Outcome** | "Who bid high and busted? Low and won? Did you both make mistakes?"<br>**Highlight:** A high bidder who defaulted vs. low bidder who won small. | Expected value ≠ guaranteed outcome. Risk aversion/nonlinear weighting.         |
  | **3. Vault/Sequence Effect**   | "Why did bidding drop at Table 1 in later rounds? Was the game ‘different’ after vault drained?"                   | Finite bankroll: EV depends on sequence, not just rules.                         |
  | **4. Hidden Cap (Table 2)**    | "How did bidding at Table 2 compare to Table 1? Why bid less when the cap might be high?"                          | Ambiguity aversion: People distrust unknown probabilities.                      |
  | **5. Policy (Table 3)**        | Ask policy winner: "Would you pay the same for one play? Why commit to all rounds?"                                | Repeated play vs. single shot; time-averaging resolves volatility.              |
  | **6. Control (Table 4)**       | "Why bid higher at Table 4? Did ‘no default’ change the game?"                                                     | Isolates risk as key variable.                                                  |
  | **7. Summation Paradox**       | "One of you said EV isn’t defined—did our vault make expectations depend on order? Can we add payouts any order?"  | Vault makes EV path-dependent; challenges naive summation.                      |
  | **8. Conclusion**              | "The ‘fixes’ (vault, policy, etc.) don’t solve the paradox—they change the game. What question is each answering?" | Diminishing utility, bankroll limits, probability weighting, and time-averaging are different solutions to different problems. |

  **Key Points to Force:**  
  - "Did your bids reflect infinite EV? Why not?" → **Reveals bounded rationality.**  
  - "The vault didn’t ‘answer’ the paradox—it created a new game." → **Solutions redefine the problem.**  
  - "Policy commitment values the average; single play values the gamble." → **Policy vs. single-shot framing.**  

  ---

  ### **What the Activity Can’t Reproduce & Facilitator Notes**
  - **Unstageable tail:** Admit: "We capped flips at 20. Real EV is infinite, but you’ll never see 30 heads—that’s why we use math."  
  - **Fake currency limitations:** Say: "Points are small stakes. With life savings, risk aversion would be stronger."  
  - **Facilitator must state:**  
    - "Expected value assumes a linear, unlimited world. We live in a nonlinear, bounded one."  
    - "The standard ‘fixes’ aren’t wrong—they’re tools for different problems: utility for wealth effects, bankroll for institutions, weighting for psychology, policy for repeated decisions."  

  This design forces students to confront the paradox through lived tension (bidding vs. outcomes, vault depletion, ambiguity). By debriefing specific moments, they’ll build the conceptual framework organically. Run it once informally to tweak timing/vault size.
