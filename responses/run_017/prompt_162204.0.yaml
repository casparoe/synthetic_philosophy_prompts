  ### Which Kind of Imprecise-Probability Person Are You?  
  *Stop arguing about whether your credences are sharp. Answer these concrete cases to find your type—no theory needed.*

  Start: You don’t have a single number for your credence (e.g., train late tomorrow: [0.3, 0.6]).  

  **1. Ellsberg urn:** An urn has 100 red/blue balls, but the mix is unknown. Do you assign a single probability to drawing red?  
  - **Yes** → Go to 2.  
  - **No** → Go to 3.  

  **2. (Sharp branch) Two sources:** Independent experts say 0.4 and 0.7. How do you combine them?  
  - **Average (e.g., 0.55)** → **Leaf 1: Averaging Bayesian**  
    *Awkward: You must reduce all conflicts to a point estimate, even with wildly inconsistent sources.*  
  - **Use a range (e.g., [0.4, 0.7]) for decisions** → **Leaf 2: Sensitivity Analyst**  
    *Awkward: When forced to bet (e.g., at 0.55), you pick a bound arbitrarily (e.g., 0.4 for caution).*  

  **3. (Ranged branch) Two sources:** Same as above (0.4 and 0.7). How do you combine?  
  - **Take the convex hull ([0.4, 0.7])** → Go to 4.  
  - **Combine with Dempster-Shafer (e.g., assign "masses" and merge)** → Go to 5.  

  **4. (Hull) Forced action:** With range [0.4, 0.7], how do you bet on the event?  
  - **Maximin: Optimize for the worst case (e.g., act as if probability = 0.4)** → **Leaf 3: Robust Bayesian**  
    *Awkward: You might reject a bet that’s favorable under every probability in your range.*  
  - **Pick any admissible action (non-dominated by your set)** → **Leaf 4: Permissivist**  
    *Awkward: With multiple "good" choices, you flip a coin or use intuition.*  

  **5. (Dempster-Shafer) Forced action:** After combining sources, how do you bet?  
  - **Stick with the belief function (e.g., use "belief" for worst-case)** → **Leaf 5: Dempster-Shafer Conservative**  
    *Awkward: Conflicting evidence can produce counterintuitive jumps in your beliefs.*  
  - **Convert to sharp (e.g., use "pignistic" probability)** → **Leaf 6: Dempster-Shafer Pragmatist**  
    *Awkward: You abandon imprecision for decisions, making your range irrelevant.*  

  ---  
  **What this tree covers:**  
  - (a) Plain Bayesian (Leaf 1). Ignores imprecision; reduces everything to sharp.  
  - (b) Ranged-as-real states (Leaves 3–6). The interval is fundamental, not ignorance.  
  - (c) Robust decisions (Leaf 3). Maximin lets you act decisively with a range.  
  - (d) Permissive actions (Leaf 4). Multiple choices are valid; the range doesn’t decide for you.  
  - Non-additive "mass on sets" (Leaf 5). Included!  

  **Missing distinctions?**  
  - **Conditioning-widening case** (posterior range wider than prior) isn’t a leaf splitter—most in (b) update by conditioning each prior, so it widens naturally.  
  - **One-way imprecision** (e.g., drug harm [0, 0] but benefit [0.1, 0.9]) doesn’t branch: it’s handled uniformly in (b) as a non-additive set.  

  **Unoccupied combinations & why:**  
  - **Ellsberg "No" + Two-sources "Average"** → *Nobody*: If the range is real, averaging violates it.  
  - **Sharp branch + Dempster-Shafer** → *Nobody*: Dempster-Shafer requires non-additive sets, incompatible with sharpness.  
  - **Permissivist + Dempster-Shafer** → *Nobody*: Dempster-Shafer demands specific combo rules; permissivism is anarchic.  

  **Why no "bet at every price" node?**  
  It collapsed groups: Robust Bayesians (Leaf 3) *reject* bets inside their range (only accept outside), while Permissivists (Leaf 4) *might* accept some inside. But this didn’t cleanly split new leaves.  

