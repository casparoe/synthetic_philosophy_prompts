prompt: |-
  I'm teaching a graduate seminar this term on the metaphysics of dispositions, and our session on finks and masks has bogged down in a way I recognise all too well: after three weeks the students have sorted themselves into two camps who are no longer so much disagreeing as explaining different things, each to its own satisfaction. A colleague from the philosophy of science is sitting in on that session, and rather than hand her a reading list I would like to hand the room a document. So here is what I am asking for: draft the joint statement that a defender of the conditional analysis of dispositional ascriptions and a dispositional realist could both sign after a good-faith adversarial collaboration. By the conditional analyst I mean someone who holds that what it is for a thing to be disposed to manifest M in circumstances C is for a suitably restricted conditional — if C, then M — to hold of that thing, and who therefore owes an account of the restriction that is not circular. By the dispositional realist I mean someone who holds that the disposition is an intrinsic, causally efficacious property of the thing, in virtue of which the conditional holds when it holds, so that the conditional is evidence for the disposition rather than what the ascription says. I want the claims both sides can sign — about what the fink and mask cases actually establish, about what an adequate account of dispositional ascription has to accomplish, about whether cases drawn from the special sciences (solubility, conductivity, virulence) and cases drawn from ordinary life (fragility, flammability) must be handled by the same apparatus — followed by the residual disagreement stated twice over, once in the analyst's preferred vocabulary and once in the realist's, in wording each would accept for its own side.

  For the cruxes, I want each one paired with a case or argument both parties would accept as bearing on it, and — the part that never happens in seminar — each side's prediction about how that case will turn written down in advance, so that the collaboration has something to be wrong about. I have been working up three cases as a shared test-bed, and I would rather you used mine than the stock examples everyone has already seen: (i) a dimmer fink, in which the approach of C lowers the chance of M to some middling value such as 0.3 rather than to zero, so that the disposition is neither simply lost nor simply prevented; (ii) an intrinsic fink that is triggered by the disposition's own beginning to manifest, so that the manifestation would have gone to completion had it not got started; and (iii) a masked mask, in which a condition that would interfere with M is itself interfered with by a further condition, with the result that M occurs after all. For each, say what each theory is committed to about whether the thing has the disposition, whether the relevant conditional is true, and whether the interfering condition should be counted as a mask, a fink, both, or neither — and mark the points at which the two theories' verdicts come apart in a way that could in principle be checked rather than merely asserted. If you conclude that some part of the dispute is merely verbal, say plainly which part and why; my own suspicion is that a great deal rides on whether the chemist's soluble and the vase's fragile are being read as the same kind of ascription at all. Format the whole thing as a numbered agreed-claims section followed by a disagreements table. No names, dates or bibliography, please: the argumentative structure is what I am after, and I can supply the references myself.
reasoning: |-
  We are drafting a joint statement between a conditional analyst (CA) and a dispositional realist (DR) after adversarial collaboration. The goal is to have agreed claims and then a clear statement of residual disagreements, including predictions for three test cases.

  **Agreed Claims (Signed by Both Parties):**

  1. **The Problem of Finks and Masks**: Both parties agree that cases of finks and masks present challenges to a simple conditional analysis of dispositions. Finks remove the disposition during the test (e.g., a sorcerer who removes fragility when the vase is struck), while masks prevent the manifestation without removing the disposition (e.g., a protective coating that prevents a fragile vase from breaking when struck). These cases show that a conditional analysis must be restricted in a non-circular way to avoid counterexamples.

  2. **The Role of the Conditional**: Both parties agree that there is a connection between dispositions and conditionals: if an object has a disposition to manifest M in C, then, typically, if C occurs, M would occur. However, the CA holds that the disposition just is the truth of a suitably restricted conditional, while the DR holds that the disposition is a real property that grounds the conditional.

  3. **Common Goal**: Both parties aim to provide an account of dispositional ascriptions that:
     - Captures the truth conditions of ordinary and scientific dispositional claims (e.g., "sugar is soluble", "this wire is conductive", "the virus is virulent", "the vase is fragile").
     - Explains why finks and masks are exceptions and how they work.

  4. **Domain of Application**: Both parties agree that dispositional ascriptions in the special sciences (like solubility, conductivity, virulence) and in ordinary life (like fragility, flammability) should be handled by the same theoretical apparatus, because they share the same logical structure and face the same challenges (e.g., finks and masks). However, they acknowledge that the specifics of the restrictions might vary with context.

  5. **The Test Cases**: Both parties agree to use the following three cases as a shared test-bed for evaluating their theories. They also agree on the descriptions of the cases and the questions to be addressed for each:
     - (i) **The Dimmer Fink**: The approach of C lowers the chance of M to 0.3 (a middling value) but not to zero. We ask: 
          - Does the object have the disposition during C?
          - Is the conditional "if C, then M" true?
          - Is the interfering condition a fink, a mask, both, or neither?
     - (ii) **The Intrinsic Fink**: The disposition begins to manifest (so that if it had not been interrupted, M would have occurred) but is stopped by an intrinsic mechanism triggered by the beginning of the manifestation. We ask the same set of questions.
     - (iii) **The Masked Mask**: A condition that would interfere with M (a mask) is itself interfered with by a further condition, so that M occurs. We ask the same set of questions.

  6. **The Need for Non-Circular Restrictions**: Both parties agree that any adequate account must provide a restriction on the conditional that does not itself rely on dispositional concepts (to avoid circularity). The CA must provide such a restriction, and the DR must provide an account of how the dispositional property grounds the conditional without making the conditional analysis redundant.

  7. **Evidence and Grounds**: Both parties agree that the truth of the conditional is evidence for the presence of the disposition, but they disagree on the direction of explanation. The CA holds that the disposition ascription is made true by the conditional (with restrictions), while the DR holds that the disposition (as a real property) makes the conditional true (when it holds).

  **Residual Disagreements:**

  We now state the core disagreement in two ways, one in the CA's vocabulary and one in the DR's.

  - **In the Conditional Analyst's Vocabulary**: 
    "The dispositional ascription 'x is disposed to M in C' is true if and only if there is a non-circularly specified set of conditions R (which may include the absence of finks and masks) such that if C and R obtain, then M occurs. The disposition is not an additional property over and above the obtaining of this restricted conditional. The cases of finks and masks show that the restriction R must be carefully spelled out, but they do not require us to posit a distinct causal basis."

  - **In the Dispositional Realist's Vocabulary**: 
    "The dispositional ascription 'x is disposed to M in C' is true if and only if x possesses an intrinsic, causally efficacious property D (the disposition) which, in the circumstances C, would typically cause M. The conditional 'if C, then M' is often true when the disposition is present, but its truth depends on the absence of interfering factors (finks and masks). The disposition D is the ground of the conditional and is not reducible to it. The cases of finks and masks show that the conditional is defeasible, but they do not undermine the reality of D."

  **Predictions for the Test Cases:**

  We now present a table of predictions for the three test cases. For each case, we state what each theory is committed to about the disposition, the conditional, and the classification of the interference. We also note where the two theories' verdicts come apart in a checkable way.

  | Case             | Question                                                                 | Conditional Analyst (CA)                                                                 | Dispositional Realist (DR)                                                                | Point of Divergence (Checkable?) |
  |------------------|--------------------------------------------------------------------------|------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------|----------------------------------|
  | **Dimmer Fink**  | Does the object have the disposition?                                    | **No**: Because the conditional (with the right restriction) is not satisfied (since chance of M is only 0.3, not 1). | **Yes**: The disposition is still present, but its manifestation is probabilistically reduced by the fink. | **Checkable?** Only if we can measure the disposition independently. The CA says the disposition is absent because the conditional fails, while the DR says it is present but masked. The disagreement might be resolved by independent tests (e.g., removing the fink). |
  |                  | Is the conditional "if C, then M" true? (without restrictions)          | **No**: Because M does not occur with high probability (only 0.3).                       | **No**: Because M does not occur (or occurs with low probability).                         | Agree on the conditional being false. |
  |                  | Type of interference?                                                    | **Fink**: Because it removes the disposition (by lowering the chance).                  | **Mask**: Because it prevents the manifestation without removing the disposition.          | Classification differs. |
  | **Intrinsic Fink** | Does the object have the disposition?                                    | **No**: Because the conditional (restricted) is false: when C occurs, M does not occur (due to the intrinsic mechanism). | **Yes**: The disposition is present and begins to manifest, but is interrupted. The interruption is due to a fink. | **Checkable?** Yes, by testing in the absence of the intrinsic mechanism (if possible). The CA must say that without the mechanism, the object would have the disposition (if the conditional holds). The DR says the disposition is always present, but the fink disrupts the manifestation. |
  |                  | Is the conditional "if C, then M" true? (without restrictions)          | **No**: Because M does not occur.                                                       | **No**: Because the fink prevents M.                                                      | Agree. |
  |                  | Type of interference?                                                    | **Fink**: Because it removes the disposition during C.                                   | **Fink**: Because it removes the disposition (or its causal basis) when C occurs.         | Agree on fink. |
  | **Masked Mask**  | Does the object have the disposition?                                    | **Yes**: Because the conditional (restricted) holds: when C occurs, M occurs (since the mask is itself masked). | **Yes**: The disposition is present and manifests because the mask is ineffective.        | Agree. |
  |                  | Is the conditional "if C, then M" true? (without restrictions)          | **Yes**: Because M occurs when C occurs.                                                | **Yes**: Because M occurs.                                                                | Agree. |
  |                  | Type of interference?                                                    | The first condition is a **mask** (but it is itself masked, so it doesn't prevent M).    | The first condition is a **mask** (but it is neutralized by a second condition).          | Agree. |

  **Points of Checkable Divergence:**

  1. **Dimmer Fink**: 
     - **CA**: The object does not have the disposition because the conditional (restricted appropriately) is false (chance of M is 0.3, not 1). The interference is a fink because it removes the disposition.
     - **DR**: The object has the disposition (it is still present) but the interference masks it (so the manifestation doesn't occur with the expected probability). The interference is a mask.
     - **Checkable?** We could design an experiment to test for the presence of the disposition independently of the fink. For example, if we can remove the fink and then test, the CA would say that without the fink, the disposition might be present (if the conditional holds without it) and the DR would say the disposition was always present. But note: the CA might argue that in the presence of the fink, the disposition is absent, but that doesn't preclude it being present in other circumstances. The DR would say the disposition is present even with the fink, but the fink masks it. This might be checked by looking at the intrinsic properties (if we have a theory of what they are).

  2. **Intrinsic Fink**:
     - **CA**: The object does not have the disposition because the conditional is false (due to the intrinsic mechanism). The mechanism is a fink.
     - **DR**: The object has the disposition, and the intrinsic mechanism is a fink that removes the disposition (or its causal basis) when C occurs. Hence the disposition is present until C occurs, then it is lost.
     - **Checkable?** We can test the object in a scenario where the intrinsic mechanism is disabled. The CA would say that without the mechanism, if the conditional holds, then the object has the disposition. The DR would say the disposition is present even when the mechanism is active, but the mechanism acts as a fink when C occurs. This might be checked by measuring the intrinsic property (if we have a way) when the object is not in C.

  **Verbal Disagreement?**

  Both parties agree that there is a core substantive disagreement about the ontology of dispositions. However, they also note that part of the disagreement might be verbal in the following sense:

  - The term "disposition" might be used in a way that varies between contexts. For example, in the special sciences (like chemistry), solubility might be identified with a molecular structure (which the DR would count as the causal basis and the CA might count as the basis for the conditional). But both parties agree that the same theoretical apparatus should apply to both scientific and ordinary cases.

  - The CA and DR might be using different criteria for when a disposition is "present". The CA ties it to the truth of the conditional (with restrictions), while the DR ties it to the presence of an intrinsic property. This might lead to different verdicts in borderline cases (like the dimmer fink). But both parties agree that in standard cases (without finks or masks) they coincide.

  Thus, the disagreement is not merely verbal because it has ontological consequences: the CA denies that dispositions are irreducible properties, while the DR affirms it. This leads to different predictions in cases where the conditional fails but the intrinsic property is present (as in the dimmer fink according to the DR) or where the intrinsic property is absent but the conditional holds (which the DR would deny because they hold the disposition grounds the conditional).

  **Conclusion of Joint Statement:**

  We, the conditional analyst and the dispositional realist, have agreed on the challenges posed by finks and masks and on the need for a unified account of dispositional ascriptions across domains. We also agree that the conditional is evidentially linked to the disposition. However, we fundamentally disagree on the nature of dispositions: the CA reduces them to conditionals with non-circular restrictions, while the DR takes them to be irreducible properties that ground the conditionals. The test cases, especially the dimmer fink and the intrinsic fink, highlight points where our theories make different predictions that could be checked by further investigation (e.g., by manipulating the interfering conditions and observing the disposition's presence or absence). We hope that future work will clarify these issues.

