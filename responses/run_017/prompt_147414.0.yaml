answer: |-
  Here’s the strongest case for the position that epistemic utility theory (EUT) is pragmatism disguised as epistemology, structured around self-ratification and the hypothetical nature of its norms:

  ### Core Argument: The Costume Rips at Self-Ratification
  EUT promises a purely *epistemic* foundation for Bayesian norms (probabilism, conditionalization) by appealing solely to *accuracy* as the cardinal epistemic virtue. Accuracy is measured by strictly proper scoring rules, and violations of Bayesian norms allegedly guarantee *epistemic self-sabotage*: incoherent credences are accuracy-dominated; non-conditionalizing updates are accuracy-suboptimal. But this promise unravels when we examine **diachronic self-ratification**:

  1.  **The Diachronic Argument’s True Conclusion:** The accuracy argument for conditionalization (e.g., Greaves & Wallace) doesn’t show that conditionalization is *categorically* optimal. It shows that *conditionalizing on your current prior* is *expected-accuracy-maximizing* **relative to that very prior**. It is *self-ratifying*. If you have prior `P`, then `P` *itself* expects that updating via conditionalization on future evidence `E` will yield greater accuracy than first switching to some alternative prior `Q` and *then* conditionalizing `Q` on `E`.
  2.  **The Hypothetical Imperative Exposed:** This establishes only a *hypothetical* imperative: *"If you wish to maximize the accuracy you currently expect to achieve, then conditionalize on your current prior."* This is structurally identical to pragmatic vindications: *"If you wish to maximize the utility you currently expect to achieve, then conditionalize (and be coherent)."* The normativity is entirely conditional on the agent's contingent, subjective motivational state – in this case, their current desire for accuracy *as measured by their current prior*. Just as the pragmatic imperative "Be wealthy by your own lights" binds you only if you currently value wealth, the accuracy imperative "Be accurate by your own lights" binds you only if you currently value accuracy *as defined by your prior and scoring rule*.
  3.  **Synchronic Probabilism Doesn’t Save It:** Proponents might retort that the *synchronic* argument for probabilism (avoiding accuracy domination) provides the missing categorical element. This fails:
      *   **It Only Rules Out Incoherence:** The domination argument powerfully shows that *incoherent* credences are inadmissible – they are accuracy-dominated by *some* coherent credence. Crucially, **it says absolutely nothing about *which* coherent credence function you *should* adopt.** It establishes a necessary condition (coherence) but not a sufficient one.
      *   **The Normative Vacuum:** The *entire substance* of epistemic normativity that EUT promised to capture – guidance on *how* to form reasonable priors, *how* to weigh evidence, *when* to be cautious or bold – resides precisely in the choice *among* coherent credence functions. EUT falls utterly silent here. It provides no epistemic grounds to prefer a uniform prior over a skeptical one, an informed prior over an arbitrary one, or a Jeffreys prior over a Laplacian one, *provided they are coherent*. All coherent priors are equally immune to synchronic domination.
      *   **Pragmatism Fills the Vacuum:** In practice, the choice among coherent priors is driven by pragmatic considerations (e.g., computational tractability, ease of elicitation, robustness, alignment with practical goals) or pre-theoretic epistemic intuitions that EUT itself cannot justify. EUT merely *inherits* these choices; it doesn't ground them epistemically. The "epistemic costume" merely drapes over the same pragmatic skeleton.

  ### The Accuracy-Firster's Best Reply & Why It Fails
  **The Reply (Categorical Accuracy):** *"Accuracy isn't merely something we contingently 'prefer'; it is the* constitutive aim *of belief itself. Graded beliefs (credences) are* defined *by their function of representing the world accurately. Therefore, valuing accuracy isn't a subjective preference one can opt out of; it's built into the very nature of having credences. Failing to pursue accuracy (as measured by a strictly proper rule) via probabilism and conditionalization is a failure* as a believer, *not just a failure to satisfy a contingent desire. This makes the norms categorical."*

  **Why This Reply Fails:**
  1.  **Constitution is Not Normativity:** Even *if* accuracy is the constitutive aim of belief, this is a descriptive claim about function. Deriving a *normative* "ought" ("you *ought* to pursue accuracy optimally") from a descriptive "is" ("beliefs *are for* accuracy") commits a naturalistic fallacy without additional normative premises. *Why* must we fulfill the constitutive function? A malfunctioning heart fails *as a heart*, but we don't say it *ought not* to malfunction in a categorical moral or epistemic sense without further argument. The constitutive aim tells us what beliefs *are*, not what they *should be*.
  2.  **The Self-Ratification Problem Remains:** Even granting accuracy as the constitutive aim, the *diachronic argument* still only shows that conditionalizing on *your current prior* fulfills *that prior's* expectation of achieving *its* conception of accuracy. A radically misinformed, arbitrary, or biased prior `P` is still coherent and thus immune to synchronic domination. `P` will *self-ratify* conditionalization on `P` itself. The constitutive aim argument tells the agent *that* they should pursue accuracy, but it doesn't tell them *which* prior's accuracy expectations they should care about *now*. An agent with prior `P` can say: "I *am* pursuing accuracy – the accuracy *as I currently conceive it via P*. Conditionalizing on `P` is how I best achieve *that* aim." EUT provides no epistemic resources *internal to its framework* to criticize `P` itself, only the failure to be coherent or conditionalize *once `P` is fixed*. The choice of `P` remains normatively ungrounded by accuracy alone.
  3.  **Silence on Scoring Rules:** The constitutive aim argument assumes the legitimacy of representing accuracy via strictly proper scoring rules. But *why these rules*? While they have desirable properties (e.g., honesty), the argument that they uniquely capture "accuracy" often relies on intuitions about fair assessment or pragmatic considerations (e.g., incentivizing honest reporting). If "accuracy" is fundamental, why does its measurement require this specific mathematical structure derived from decision-theoretic contexts? This reintroduces pragmatic elements at the foundational level of defining the epistemic good.

  ### Conclusion: The Costume Comes Off
  Epistemic utility theory, upon close inspection of self-ratification and the limitations of synchronic domination, fails to deliver a genuinely *categorical epistemic* normativity distinct from pragmatism. Its central diachronic norm ("Conditionalize!") is revealed as a hypothetical imperative contingent on the agent's current subjective prior. Its synchronic norm ("Be coherent!") establishes only a necessary condition, leaving the crucial choice among coherent credences – the heart of epistemic rationality – entirely ungoverned by accuracy considerations alone. This vacuum is inevitably filled by pragmatic concerns or extra-accuracy epistemic values. The constitutive aim reply cannot overcome this, as it cannot bridge the gap between descriptive function and categorical obligation, nor escape the self-ratifying tyranny of the arbitrary prior. EUT, therefore, offers no decisive *epistemic* advantage over the older pragmatic vindications; it provides a sophisticated *re-description* of Bayesian norms within an accuracy-based decision-theoretic framework, but not a fundamentally new *foundation*. The "epistemic costume" is elegant, but the body beneath remains pragmatic.
