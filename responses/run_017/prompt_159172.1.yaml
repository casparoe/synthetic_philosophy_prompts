  Hmm, the key elements seem to be: a subgroup takes risks, pays the cost (often death), and the group benefits from the information gained. The cost isn't simulated; it's real and borne by individuals. The learning happens because of their failures.

  I remember "exploratory sampling" or "costly sampling," but the user wants precision. Maybe "sacrificial sampling"? But "sacrificial" might imply intent. "Toll-gate explorers"? Not established. The closest term I recall is "adaptive suicide" in ants, but that's specific to self-destruction for defense.

  Wait, in evolutionary biology, there's "producer-scrounger" models, but that's about food foraging, not information. The user's case is about information gathering with high costs. Maybe "information producers" versus "information consumers," but again, not a standard term.

  Looking at the user's edge cases: Does it require same species? Shared genes? What if competitors learn from each other's failures? The key difference is whether the risk-takers are part of the same collective. In the bee swarm, scouts and the swarm are one unit. When a competitor learns from another's recalled product, it's a different group, so it's observational learning, not internal sacrifice.

  Cost doesn't have to be death—any high cost works. The risk-bearers don't need to be designated; random selection by bad luck still counts. But if a dummy or model is used, it's simulation, not real cost, so it falls under the third mind type (hypothetical testing).

  So, the core concept is: a collective uses real losses of subsets to gain information. No perfect term exists. "Costly group sampling" might be best. Define it as: a collective strategy where non-representational information is acquired through the selective loss or sacrifice of a subset, enabling adaptive refinement for the remainder.

  Boundaries: Must be same collective agent. Shared genes aren't necessary; immigrants could serve if integrated. Competitor learning is different—no shared collective. Cost can be any steep penalty, not just death. Risk-bearers can be designated or unlucky. Using simulations shifts it to cognitive testing (third mind type).

  The user needs clarity on edges. Emphasize that the key is the internal division of labor where part of the group pays the cost for the group's benefit. That distinguishes it from observational learning across groups.
answer: |-
  ### Bottom Line: The pattern is **costly group sampling**—a collective strategy where non-representational information is acquired through the selective loss or sacrifice of a subset, enabling adaptive refinement for the remainder.

  #### Core Definition & Boundaries  
  **Costly group sampling** occurs when:  
  1. **A collective agent** (e.g., colony, herd, firm) generates behavioral options via real-world exploration.  
  2. **A subset bears disproportionate risk** (death, injury, or steep opportunity cost).  
  3. **Failure of this subset provides feedback** that shapes collective behavior.  
  4. **No internal simulation occurs**—learning arises from irreversible physical consequences.  

  #### Edge Cases Settled  
  - **Same agent required?**  
    Yes. The risk-bearers must be part of the same functional unit (e.g., scouts are colony members). *Competitors learning from rival failures is observational learning, not costly sampling.*  
  - **Genetic kinship necessary?**  
    No. Unrelated conspecifics suffice if integrated into the collective (e.g., immigrant bees scouting). Kin selection facilitates evolution but isn’t definitional.  
  - **Cost threshold?**  
    Any steep cost works (e.g., injury, lost time). Death is common but not required. *Example:* Foraging ants losing limbs to predators still qualify; wasted energy alone is insufficient.  
  - **Designated risk-bearers?**  
    No. Fixed castes (e.g., soldier termites) or luck-based selection (e.g., random wanderers) both fit. *Key:* The group benefits statistically from their losses.  
  - **Simulation vs. reality?**  
    Using dummies/models collapses into "hypothetical testing" (the book’s third mind). *Costly sampling requires real loss.* A drone simulating scout death is cognition; a dead bee is costly sampling.  

  #### Why Existing Labels Fail  
  - **Group selection**: Addresses group survival, not internal risk-pooling.  
  - **Disposable castes**: Overlaps but ignores transient roles (e.g., reversible scouts).  
  - **Bet-hedging**: Ensures survival without requiring learning from loss.  
  - **Exploration/exploitation**: Lacks emphasis on *who* pays the cost.  
  - **Distributed cognition**: Describes computation, not cost-bearing asymmetry.  
  - **Observational learning**: The learner is passive; here, the group actively *deploys* risk-bearers as probes.  

  #### Conceptual Boundaries in Practice  
  - **In bees/ants**: Classic costly sampling. Scouts are "trial balloons"; losses prune options.  
  - **Human organizations**: A startup testing markets via expendable "skunkworks" teams fits *if* failures directly inform core strategy. *Not* if failures are merely observed by rivals.  
  - **Non-fatal cases**: Meerkats sending juveniles (high-predation risk) to inspect threats qualifies. Chronic stress or shortened lifespans count as costs.  
  - **Excluded cases**: Herd animals scattering randomly to confuse predators isn’t costly sampling—no information gain. Sheep following a leader off a cliff is blind copying, not feedback from loss.  

  **Crux**: Costly group sampling is **active, self-sacrificial experimentation by a subset to generate non-simulable data**. It emerges in systems where real-world failure is the only teacher, and the collective optimizes by outsourcing risk.
