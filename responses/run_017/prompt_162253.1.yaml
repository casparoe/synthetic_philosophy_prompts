  Key features of the world to embed:
  1. Almost anything can be duplicated at no cost, but player-made items are "attuned": they cannot be given, sold, or stolen; only destroyed. Destruction removes a capacity only the creator had and doesn't affect others' holdings.
  2. The world is backed up every few minutes, so any loss can be reversed at the record level (same item, same entry, same numbers). But the character might still feel loss.

  Exercise Structure:

  I. Pre-Session Setup (5 minutes)
  - Explain that we are going to simulate a fictional online world to explore how we relate to digital creations and losses. The rules are simple and will be written on the whiteboard.
  - Assign one participant as the "Server" (ledger keeper). This person will not participate as a player but will manage the ledger. Choose someone who is detail-oriented and impartial. Alternatively, if you are concerned about tyranny, you could co-facilitate as the server, but having a participant do it might create interesting dynamics.

  II. Rules (Write on Whiteboard)
  - Each player is a creator in a persistent online world.
  - You can create items by writing/drawing on index cards. Each item must have:
     a) A name
     b) A short description (what it does, or what it is)
     c) Your signature (player name)
  - There are two types of items:
     a) **Common Items**: Can be duplicated by anyone. To duplicate, write a new card with the same name and description, and add "Copy of" and your own signature. The original remains.
     b) **Attuned Items**: Items you create yourself (with your own idea and description). These are bound to you. They cannot be duplicated by others, given, sold, or stolen. Only you can use them (in the fiction). If destroyed, they are gone, but note: the world has backups.

  - The Server maintains a ledger (a notebook or on index cards) with:
     - Each item's: Name, Description, Creator, Type (Common/Attuned), and a unique ID (which the server assigns, e.g., a number).

  - Backups: Every 5 minutes (real time), the Server takes a backup of the ledger. This backup is a snapshot of the ledger at that time.

