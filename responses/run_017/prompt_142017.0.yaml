  The case involves a housing authority using a vendor's risk score to allocate 400 supportive housing slots to 3,000 applicants. Key complications are differing base rates across demographic groups and selective labels (only 15% follow-up data from past recipients). The user wants two new elements explored: (1) differential counterfactual improvement (DCI) as a potential alternative criterion, and (2) whether the fairness debate changes when thresholds are budget-dependent and scores are updated semi-annually with reapplications.

  Hmm, the user's clearly frustrated with rehashing theoretical trade-offs and wants concrete scaffolding for productive debate. They need a document that: (1) establishes common ground without platitudes, and (2) structures disagreements with testable predictions. The word limit and ban on citations suggest they want something actionable for classroom use, not academic posturing.

  First, for the common ground section: I'll focus on indisputable technical realities. The selective labels problem is key - the data only shows outcomes for previously selected applicants, creating a feedback loop. Also, the vendor's score isn't a pure risk assessment but reflects past intervention patterns. Both camps should agree these constraints make standard fairness audits inadequate. 

  For the disagreements table, I'll include four substantive rows: 
  - The nature of fairness (property of classifier vs whole system)
  - How to handle selective labels
  - The viability of DCI
  - What happens with dynamic scoring

  DCI is particularly interesting - it shifts focus to intervention impact rather than prediction accuracy, but requires unobservable counterfactuals. I'll present it honestly: not a magic bullet but a lens exposing different value conflicts. The formalists will hate the estimation challenges; system people might embrace its dynamic nature but balk at individual benefit trade-offs.

  For the dynamic scoring angle: when thresholds move with budgets and scores update, some impossibility results soften because the "fixed threshold" assumption breaks. But new problems emerge around recurring disadvantage. This deserves its own row with concrete test cases.

  The user's sneaky brilliant making them write predictions in advance - that's how you prevent goalpost-shifting in debates. I'll model that by specifying testable scenarios for each crux, like auditing past decisions vs simulating policy changes.

  Word count is tight. I'll keep examples hyper-concrete (e.g., "Group A has 20% base instability vs Group B's 40%") and avoid defining well-known terms like calibration. The tone should be collegial but expose fault lines - after all, these colleagues have been sniping for years.
answer: |-
  ## Adversarial Collaboration: Fair Allocation in Supportive Housing

  **Prepared for:** County Housing Authority Allocation Review  
  **Authors:** Prof. A (Formalist), Prof. B (System Perspective)  
  **Date:** October 26, 2023  

  **Section 1: Common Ground**
  We agree on the following technical and operational realities of the supportive housing allocation system:

  1.  **The Score & Its Interpretation:** The vendor-supplied score (s ∈ [0,1]) is presented as P(Instability within 12 months | No Intervention). It is not a direct measure of underlying need, inherent risk, or potential benefit from the program.
  2.  **Selective Labels & Data Limitation:** Observed instability outcomes exist only for a small (~15%), non-random subset: primarily past program recipients. This creates a significant "selective labels" problem. The data does not reliably show what happens to similar individuals *denied* the program.
  3.  **Feedback Loop:** The score is trained on historical data generated *by prior allocation decisions*. Features influencing `s` likely correlate with past access to services/system contact, embedding prior operational choices (and potential biases) into the current score.
  4.  **Base Rate Differences:** Recorded instability rates *within the observed (treated) data* differ significantly between the two mandated reporting groups. This difference reflects a combination of underlying societal factors, historical access, and potential measurement bias within the observed subset.
  5.  **Auditing Limitations:**
      *   Audits based solely on the agency's existing outcome data (focused on recipients) can primarily assess predictive performance (e.g., calibration) *within the treated group*. They cannot reliably assess error rates (FPR, FNR) for the entire applicant pool or the counterfactual outcomes for the untreated.
      *   Audits cannot directly establish whether the allocation *caused* stability or whether the score reflects immutable risk vs. modifiable factors.
  6.  **Fixed Budget Constraint:** The intervention has a hard capacity limit (400 slots/year). The selection threshold is therefore determined by budget, not by an inherent "riskiness" cutoff.
  7.  **Arithmetic of Trade-offs:** Given the fixed budget and differing base rates, achieving perfect parity simultaneously on common statistical fairness criteria (e.g., equal FPR, equal FNR, calibration, predictive parity) is generally mathematically impossible. Choosing one criterion inherently means not satisfying others under these conditions.
  8.  **Vendor Data Access:** The vendor likely only has access to data provided by the agency or collected during application, lacking comprehensive counterfactual data on non-recipients or broader societal context.

  **Section 2: Residual Disagreements: Framework & Predictions**

  | # | Disagreement Point                      | Formalist Position (Prof. A)                                                                                                                                 | System Perspective Position (Prof. B)                                                                                                                                                                                                 | Verbal/Real? | Crux                                                                                                | Concrete Test Case                                                                                                                                                                   | Formalist Prediction                                                                                                 | System Prediction                                                                                                                                                   |
  |---|-----------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|--------------|-----------------------------------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|----------------------------------------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1 | **Nature of Fairness**                  | Fairness is primarily a property of the *current allocation decision rule* applied to this cohort. We must rigorously define and audit against a specific statistical criterion chosen explicitly, accepting the known trade-offs. | Fairness is an emergent property of the *entire socio-technical system over time*, including application processes, re-applications, program effectiveness, dynamic scoring updates, and societal context. Fixating on a single static metric is misleading. | **Real**     | Is fairness located in the snapshot decision or the longitudinal system behavior?                   | **Audit Scope:** Compare auditing only the current year's top 400 allocation vs. simulating 5 years of allocations with reapplications and score updates.                             | Current-year audit reveals unfairness under chosen criterion X. Longitudinal view obscures immediate harms.         | Longitudinal view reveals if systemic loops create/perpetuate disadvantage; snapshot audit is myopic.                                                               |
  | 2 | **Addressing Selective Labels**         | The selective labels problem severely limits what we can know. We must treat the vendor score as our best available imperfect proxy for risk *without intervention* and make allocation decisions based on it, acknowledging gaps. | Selective labels render the score fundamentally untrustworthy as a "risk" measure. We must actively model the selection process, incorporate qualitative/system knowledge, or design processes (like reapplications) to mitigate the feedback loop, not just accept it. | **Real**     | Is the score a usable input despite its flaws, or is it corrupted to the point of requiring fundamental redesign? | **Test:** Analyze if features strongly predictive of `s` correlate more strongly with past service receipt or documented instability triggers (using external data if possible). | Score features will correlate with both past service *and* risk factors; score remains best available predictor. | Features will show overwhelming correlation with prior system contact, indicating score reflects access history more than underlying need/risk.                     |
  | 3 | **Differential Counterfactual Improvement (DCI)** | DCI is theoretically appealing but practically infeasible. It requires estimating unobserved counterfactuals (E[Stability|s, Not Treated]). This is impossible with current data and unreliable methods, making it useless for operational decisions. It also conflicts with maximizing overall benefit. | DCI shifts focus to the *impact* of the intervention, which is ultimately the ethical goal. While estimation is hard, it forces confronting what matters: does the program help groups similarly? We should explore proxies (e.g., subgroup program effectiveness studies) and see DCI as a *system goal*, not just a classifier property. | **Real**     | Is DCI an impractical ideal or a necessary reframing of the problem towards impact?                 | **Pilot:** Run a small RCT (within ethical bounds) assigning slots randomly near the threshold for both groups, measure 24-month stability, estimate CATE by group. Compare to DCI implied by vendor score/model. | RCT will show heterogeneous effects not captured by `s`, proving DCI estimation from observational data unreliable. | RCT will validate that effects differ by group/context, proving `s` alone is insufficient and DCI is crucial; highlights need for better impact modeling in the system. |
  | 4 | **Impact of Dynamic Thresholds/Updates** | The impossibility results hold for *any* threshold chosen. While recomputing scores and allowing reapplications changes who is near the threshold over time, the core trade-off between fairness criteria for *each decision instance* remains. It doesn't dissolve the fundamental conflict. | Dynamic updates fundamentally alter the problem. Fixed-threshold impossibility assumes static groups and scores. Reapplications allow individuals another chance, and updated scores can correct past errors/biases. Fairness is achieved (or not) through this *process*, not in a single snapshot. The "impossibility" is less binding. | **Real**     | Does system dynamism fundamentally mitigate or merely redistribute the fairness trade-offs?          | **Simulation:** Model 3 years of allocations with semi-annual score updates and reapplications. Track if group disparity in selection rate/FPR/FNR *persists* year-on-year vs. oscillates/improves. | Disparities will persist or worsen due to feedback loops in scoring, demonstrating enduring trade-offs.              | Disparities will reduce over time as scores update and individuals reapply, demonstrating system adaptation mitigating snapshot trade-offs.                          |
  | 5 | **The Core Metric Goal**                | The ethical imperative is to maximize overall stable housing outcomes (select those with highest `s`, as `s` represents P(instability | no intervention)). Sacrificing this efficiency for a group fairness criterion requires strong justification per the chosen trade-off. | Maximizing overall outcomes based on `s` is ethically insufficient and potentially harmful. The goal is a *just system* that improves equity over time. This may require sacrificing short-term efficiency gains predicted by a flawed `s` to correct systemic biases and build trust, leading to better long-term outcomes. | **Real**     | Is the primary goal efficiency based on the score, or systemic justice including equity and process? | **Outcome Review:** Compare 5-year trends in county-wide housing instability rates for the mandated groups under A) Strict `s`-ranking vs. B) A policy incorporating a group-parity constraint. | Strict `s`-ranking will yield lower overall instability rates. Group-parity will reduce efficiency, raising overall instability. | Group-parity (if well-implemented) will improve stability in the disadvantaged group more, potentially narrowing the gap *and* improving overall stability long-term via systemic effects. |

  **Conclusion:** This document establishes our shared understanding of the system's technical constraints and data limitations (Section 1). Section 2 highlights that our disagreements are substantive, not merely verbal, revolving around the fundamental nature of fairness in dynamic systems, the tractability of impact-focused metrics like DCI, and the potential of system dynamism to mitigate inherent trade-offs. The proposed test cases and predictions provide a framework for evaluating these disagreements empirically as part of this collaboration. We agree that moving beyond "which criterion" requires grappling with these deeper questions of system design, measurement feasibility, and temporal dynamics.
