prompt: |-
  You are a senior political philosopher with a working knowledge of migration law and of the practical constraints under which resettlement agencies operate. Take the following seriously and think it through carefully before you write: I would rather have a slow, exact specification than a fluent survey.

  I work in the policy unit of a state resettlement agency, and we are rewriting our internal guidance. Two questions keep getting run together in our drafts, and I want them prised apart before we go further: first, who counts — which displaced people are in the class that generates duties at all, and on what basis, given that the 1951 Convention definition restricts the triggering harm to a well-founded fear of persecution on the grounds of race, religion, nationality, membership of a particular social group, or political opinion, while the 1967 Protocol stripped out its date and geographic limits and later regional instruments, such as the 1969 OAU Convention and the 1984 Cartagena Declaration, extended the trigger to events seriously disturbing public order. Second, who owes what — which states are under a duty to admit or otherwise provide for which people, and how much. My strong suspicion is that most of the arguments in our office are really arguments about the second question wearing the vocabulary of the first, and I want the specification written so that this move is visible.

  So: give me the desiderata. Not a survey of views, and not a recommendation of one — a specification of what an adequate account of each question would have to deliver, given the purpose I am about to fix, with the case or consideration behind each requirement, and a judgement about which requirements are non-negotiable for that purpose and which are the preferences of a particular camp dressed up as constraints. The purpose is operational: the account has to be usable by a caseworker in an interview with an applicant, defensible by a minister to a sceptical legislature and to other states, and actionable under partial compliance, when most states are doing much less than their share. Adequacy here means adequacy for that, not adequacy as an ideal theory of global justice.

  Before writing, spend two paragraphs brainstorming: list the candidate desiderata that occur to you, including the ones you are inclined to reject, and say which you are cutting because they are disguised conclusions rather than constraints — demands that already contain the answer they are supposed to test. Then write the specification itself.

  Here are the cases I need any account to handle, and I have deliberately included some that are not in the standard repertoire. Someone fleeing a non-state actor, such as a cartel or a militia, where the state of origin is willing but genuinely unable to protect her — and the mirror case, where the state is able but unwilling. A household from a low-lying atoll whose land and water have slowly become unusable over decades through sea-level rise and salinisation, with no persecutor, no datable event, and no agent whose act caused the departure. A dissident denationalised by decree while abroad, who is now outside any country of nationality. A person who leaves before the threatened harm has materialised, where the only evidence of the threat is held by the threatening authority and the adjudicator must decide on the record available at the time of decision, not with hindsight. A flow with composite causation — an intervention, arms sales to the regime, sanctions, a neighbour's proxy forces, cumulative emissions — where no single contributor's causal share can be computed. A rich state that closes its land routes and dismantles its reception system, so that it can truthfully report no capacity to receive. A state that funds, equips and politically guarantees the camps of a poorer neighbouring state, or that offshores its processing there. A state that transfers arrivals onward to a third country where the original risk resumes by a different route. A post-conflict state that wants its skilled displaced citizens back and objects to their selective resettlement elsewhere — the case where admission is a benefit someone else wants, not a burden being shifted. A protracted situation, fifteen years in, where return has stopped being foreseeable. And the standing structural fact that the overwhelming majority of the world's displaced people are hosted by states adjacent to the conflict, most of them low-income.

  For each case, say what it is doing: which distinction it is probing, and what an account must be able to say about it to count as having handled it rather than merely taken a position on it. I care especially about the distinctions people collapse: between having the status and having a duty-bearer; between owing admission to this individual, such that she can complain if refused, and owing a share of a global burden that any complying allocation discharges; between owing admission and owing to bring about that someone is admitted, which is what the outsourcing cases turn on; between the stringency of a duty and the identity of its bearer; and between a duty's existence and its temporal shape, including what happens to temporary protection when return ceases to be foreseeable.

  On the constraint side, I want you to be explicit about what counts as a genuine desideratum here and what does not. Administrability is, for my purpose, non-negotiable: an account must be decidable under asymmetric evidence, must not require an adjudicator to resolve counterfactuals that no available evidence bears on, and must not require facts that nobody can obtain, such as precise causal shares in a composite flow. Robustness to strategic behaviour by states is also, I think, non-negotiable: the account must not reward a state for making itself inaccessible, for degrading its own capacity, or for acting first, and it must say what a duty becomes when others default rather than either releasing everyone or piling everything onto the compliers. Tell me if I am wrong to put those in the non-negotiable class, and tell me what you would demote: I have in mind candidate requirements such as that duties must track causal or historical responsibility for the displacement, that they must respect a state's claimed right to determine its own membership, that they must be impartial between claimants with no tie to the admitting state, that they must never require admission without consent, that they must be neutral with respect to the claimant's religion or ethnicity, and that they must not make admission conditional on anything about the claimant's usefulness. Some of those look to me like constraints on an adequate theory and some look like one camp's conclusion inserted into the list of tests; I want your ruling on each, with the reason.

  Then the part I most want. Find the subsets of desiderata that I suspect cannot be jointly satisfied, and say so as a result rather than as a lament. My own candidate is this: require that every person with the status have some state who owes them admission, require that duty track causal responsibility for the displacement, and require that a state with no causal involvement bear no duty — and then consider the case in which the only causally responsible agent is the persecuting authority itself. Either the persecutor owes asylum, or an uninvolved state owes it, or the duty has no bearer. I take that to be unsatisfiable, and I want you to test it, to give me the other jointly unsatisfiable subsets you can find, and, where a subset is unsatisfiable, to tell me which member is least costly to give up for my purpose and why. I also want the single requirement that does the most exclusionary work — the one that knocks out the largest number of the accounts people actually defend, ideally stated so tightly that it reads as a theorem about what any account satisfying it must concede.

  Only after that, and briefly — a paragraph or two, no more — run the scorecard over the main families of account you would expect to be offered: capacity-based, causal or historical-responsibility-based, proximity or first-asylum, associative or special-ties, fair-share or global-distribution, consent or self-determination based, and market or tradable-quota based. I want just enough to see which families survive the list and where each fails, because I will do the detailed scoring with my colleagues.

  Two constraints on your answer. I have no library access today and I do not want citations, authorities, or reading suggestions: argue from the cases and from what the requirements are for, and if some legal or empirical detail matters, flag it as something to check rather than building on it. And I want the whole thing in continuous prose, the way you would write a long letter to a colleague: no headings, no bullet points, no bold text, no tables, no numbered lists. Roughly fourteen hundred words, or a little more if the unsatisfiability results need the room.
reasoning: |-
  Hmm, this is a complex request from someone working in refugee policy who clearly has deep expertise. They want me to act as a senior political philosopher to help disentangle two fundamental questions in refugee resettlement: who counts as a refugee (the status question), and who owes what obligations to them (the duty-bearer question). 

  The user is frustrated that these are constantly conflated in their policy drafts, and suspects arguments about duties are disguised as debates about status. They want rigorous specifications for each question that must meet practical operational needs - usable by caseworkers, defensible to legislatures, and workable in our non-ideal world where most states shirk responsibilities.

  I need to approach this methodically. First, brainstorming candidate requirements for both questions while flagging which are genuine constraints versus disguised normative positions. For status determination, key challenges include handling non-state persecutors, climate displacement without persecutors, denationalized persons, and pre-emptive flight with limited evidence. The user's cases probe crucial distinctions: between state inability vs unwillingness to protect, between persecution and broader public disorder, and between status and duty assignment.

  For duty allocation, the hard cases involve composite causation (like climate change), states deliberately reducing capacity to avoid obligations, offshore processing, chain refoulement, and protracted displacement. The user wants me to test distinctions between individual vs collective duties, admission obligations vs burden-sharing, and how duties transform when return becomes impossible.

  Several proposed constraints seem non-negotiable: administrability (no impossible evidence requirements), robustness to state gaming (no rewarding bad faith), and handling partial compliance. But other common proposals - like strict causal responsibility for duties, or absolute state consent over admissions - may be ideological positions masquerading as constraints. I'll need to justify each ruling.

  The core challenge is identifying incompatible requirement sets. The user's example is illuminating: if we insist every refugee must have a duty-bearer, that duties track causal responsibility, and that uninvolved states bear no duties, we hit a wall when the persecutor is the only responsible agent. This forces us to relax one requirement - likely the causal responsibility link, since persecutors can't reasonably provide asylum.

  Other tensions emerge too: if we require individual admission rights but also respect state self-determination, we conflict when no state volunteers. The user's cases systematically stress-test these fault lines. I'll need to pinpoint which requirement in each incompatible set is most operationally costly to maintain.

  For the final overview of approaches: capacity-based systems fail on gaming; pure causal models can't handle diffuse responsibility; proximity principles overwhelm neighbors; special ties exclude the most vulnerable; fair-share models require impossible coordination; consent-based approaches legitimize non-compliance; and market systems commodify protection. Most fail the robustness or administrability tests, except perhaps modified fair-share models that incorporate capacity - but even those struggle with enforcement.

  Throughout, I'll maintain strict focus on operational adequacy rather than ideal theory, using the user's cases as proving grounds. The tone should be collegial but precise - like advising a fellow specialist wrestling with real-world constraints.
answer: |-
  You're wise to disentangle these questions before proceeding. The conflation of status and duty-bearer assignment is endemic and obscures genuine disagreement. Let's brainstorm candidate desiderata first, pruning those that smuggle in conclusions.

  **Brainstorming Desiderata (Status):**
  Candidate requirements for defining "who counts" include: alignment with the core 1951 Convention grounds; compatibility with extended regional definitions (OAU/Cartagena); ability to cover persecution by non-state actors where state protection fails (unable/unwilling); handling harm without a specific persecutor (e.g., climate degradation); accommodating pre-emptive flight based on future risk; covering denationalized individuals; and grounding in objectively verifiable facts rather than subjective fear alone. I'm inclined to reject demands that status *must* require a persecutor (fails the climate case) or *must* hinge on state failure as the *only* trigger (ignores regional instruments). I'm cutting "must be based on individual persecution" as a disguised conclusion favouring the strictest 1951 reading; the regional instruments explicitly move beyond this.

  **Brainstorming Desiderata (Duty-Bearers):**
  Candidates include: assigning *some* bearer for every status holder; ensuring compliance doesn't incentivise bad faith (e.g., degrading capacity); specifying duties under partial compliance; distinguishing individual admission rights from collective burden-sharing; clarifying duties of non-refoulement vs. admission vs. support; handling outsourcing/offshoring; addressing chain refoulement; accounting for capacity; tracking causal/historical responsibility; respecting proximity/first asylum; leveraging special ties; requiring consent for admission; ensuring impartiality; and neutrality regarding claimant characteristics. I'm rejecting "duties must *always* require consent" as a disguised sovereignty absolutist conclusion, and "duties must *never* consider claimant usefulness" smuggles in a conclusion against selective resettlement based on skills. "Duties must track causal responsibility" is a candidate, but its viability is precisely what your test case probes.

  **Specification of Desiderata**

  **I. Desiderata for Defining "Who Counts" (Status):**
  1.  **Grounding in Binding Law:** Must incorporate the 1951/1967 core (persecution on specific grounds) *and* account for applicable regional extensions (e.g., OAU/Cartagena's "events seriously disturbing public order"). *Reason:* Operational guidance must reflect the legal frameworks states are bound by or commonly recognize, providing defensible footing. *Non-negotiable.*
  2.  **Protection Failure Nexus:** Must define when harm inflicted by non-state actors (cartels, militias) qualifies, specifically distinguishing:
      *   State *unwilling* to protect (conventionally covered).
      *   State *genuinely unable* to protect despite willingness (probing the nature of "protection" and state responsibility). *Reason:* Reality of modern conflict. An account must articulate the threshold of state incapacity. *Non-negotiable.*
  3.  **Harm Without Persecutor:** Must accommodate situations of severe, livelihood-destroying harm lacking a specific persecuting agent or intent, like slow-onset environmental degradation (low-lying atoll). *Reason:* Growing category not fitting classic persecution models. Account must define the nature and threshold of qualifying harm (e.g., existential threat to habitation/subsistence). *Non-negotiable* for comprehensive operational relevance.
  4.  **Statelessness & Denationalization:** Must cover individuals rendered stateless *de jure* or *de facto*, including those denationalized abroad (dissident abroad case). *Reason:* Fundamental gap in national protection is core to refugee definition. *Non-negotiable.*
  5.  **Future Risk & Evidentiary Constraints:** Must handle claims based on well-founded fear of *future* persecution/harm where definitive evidence is held by the persecutor or unavailable (pre-emptive flight). *Reason:* Practical adjudication reality. Account must specify standards for assessing "well-founded fear" prospectively, using available evidence, without requiring impossible proof or hindsight. *Non-negotiable* for administrability.
  6.  **Objectivity & Administrability:** Definition must rely on objectively assessable factors (nature of harm, state capacity/willingness, environmental data) to the maximum extent possible, minimizing reliance solely on subjective fear. *Reason:* Essential for defensible, consistent casework. *Non-negotiable.*

  **II. Desiderata for Assigning "Who Owes What" (Duty-Bearers):**
  1.  **Assigns *A* Bearer:** Every individual granted status must have *some* state assigned a specific duty towards them (even if contingent). *Reason:* Avoids protection gaps in theory; operational necessity for case resolution. *Non-negotiable.*
  2.  **Robustness to Strategic Non-Compliance:** Must **not** reward states for:
      *   Making themselves inaccessible (closing land routes).
      *   Artificially degrading reception capacity.
      *   Acting first to offload responsibility (pre-emptive offshoring).
      *   Must define duties when other states default (cannot simply release all compliers or pile everything onto them). *Reason:* Essential for real-world viability. System collapses otherwise. *Non-negotiable.*
  3.  **Handles Partial Compliance & Burden Shifting:** Must specify the nature and stringency of duties (admission, non-refoulement, material support, resettlement) when most states shirk. Must distinguish clearly between:
      *   Owing admission *to this specific individual* (enforceable right).
      *   Owing *a fair share* of a global burden, discharged by *any* compliant allocation scheme.
      *   Owing *to ensure* admission occurs (without necessarily admitting oneself) – key to outsourcing/offshoring/chain refoulement cases. *Reason:* Core confusion point; critical for policy design and defending state actions. *Non-negotiable.*
  4.  **Clarity on Temporal Shape:** Must define the duration and cessation triggers of duties, especially differentiating temporary protection from permanent solutions, and handling when "temporary" becomes indefinite (protracted situations, 15-year case). *Reason:* Operational planning, resource allocation, rights of displaced. *Non-negotiable.*
  5.  **Addresses Composite Causation:** Must assign duties fairly in situations with multiple contributing factors (arms sales, sanctions, emissions, proxy forces) where precise causal shares are unknowable. *Reason:* Reality of complex displacement drivers. Cannot require uncomputable shares. *Non-negotiable* for administrability.
  6.  **Handles Admission-as-Benefit:** Must account for scenarios where admission/resettlement is sought by the displaced *and* potentially contested by the state of origin (skilled citizen case), framing duties accordingly. *Reason:* Avoids simplistic "burden" framing; acknowledges complex interests. *Non-negotiable* for comprehensive handling.

  **Ruling on Candidate Constraints:**
  *   **Non-Negotiable (As Argued):** Administrability, Robustness to Strategic Behaviour. Demoting these renders the guidance operationally useless or counterproductive.
  *   **Demote (Disguised Conclusions or Impractical Ideals):**
      *   *Duties must track causal/historical responsibility:* Often desirable, but untenable as a *requirement* (see unsatisfiability below). Can be *a* factor, not *the* determinant.
      *   *Duties must respect state's absolute right to determine membership:* While state consent matters pragmatically, making it an inviolable constraint legitimizes non-compliance. Duty assignment must sometimes override pure sovereignty claims.
      *   *Duties must be perfectly impartial between claimants with no tie:* A noble ideal, but special ties (family, language, diaspora) are operationally relevant and sometimes legally recognized (family reunification). Impartiality applies *within* status categories, not necessarily negating all ties.
      *   *Duties must never require admission without consent:* See sovereignty point above. Non-refoulement often *requires* admission de facto. Consent is about *which* state admits, not *whether* admission occurs.
      *   *Duties must be neutral re: claimant's religion/ethnicity:* Genuine constraint *within* status determination and non-refoulement. However, *resettlement selection* might permissibly consider factors like community fit or specific vulnerabilities linked to identity, provided it doesn't constitute discrimination *against* a protected group.
      *   *Duties must not make admission conditional on usefulness:* Largely correct as a constraint on *status determination* and core protection (non-refoulement). However, *resettlement selection* often considers integration potential or skills, reflecting operational realities and sometimes state interests, provided core protection isn't denied. The "skilled citizen" case highlights the complexity.

  **Jointly Unsatisfiable Subsets & Exclusionary Requirements**

  1.  **Your Candidate:**
      *   (S1) Every status holder has a state owing them admission.
      *   (S2) The duty-bearer must be causally responsible for the displacement.
      *   (S3) States with no causal involvement bear no duty.
      *   **Unsatisfiable when:** The only causally responsible agent is the persecutor (e.g., the regime itself). The persecutor cannot reasonably owe asylum (violates non-refoulement core). (S3) blocks uninvolved states. (S1) fails. **Least Costly to Give Up:** (S2) - Causal responsibility. *Reason:* Its consistent application is often impossible (composite flows) or perverse (persecutor owes duty). Focusing on *protection need* and *capacity/connection* is more operationally viable for assigning duties. Sacrificing (S1) creates protection gaps; sacrificing (S3) unfairly burdens uninvolved states.

  2.  **Subset 2:**
      *   (D1) Duties entail an individual right to admission by a specific state (enforceable claim).
      *   (D2) State consent is a necessary condition for any admission duty.
      *   (D3) Every status holder must have their individual right satisfied.
      *   **Unsatisfiable when:** No state consents to admit a particular individual or group. (D1) and (D3) demand admission, (D2) blocks it. **Least Costly to Give Up:** Strict interpretation of (D1). *Reason:* Insisting on *individual* admission rights *by a specific state* (beyond non-refoulement) is operationally unsustainable and clashes with sovereignty realities. Shifting to a model where status holders have a right that *some* state admits them (discharged via fair burden-sharing) or a right to non-refoulement/survival support (which *might* necessitate admission *somewhere*) is more viable, even if less ideal. Sacrificing (D2) removes consent entirely, which is politically indefensible; sacrificing (D3) abandons individuals.

  3.  **Subset 3:**
      *   (R1) Duties are stringent and primarily fall on proximate/first-asylum states.
      *   (R2) Duties must be proportionate to capacity.
      *   (R3) The system must be robust to strategic capacity reduction (overwhelming neighbours).
      *   **Unsatisfiable under:** Mass influx overwhelming low-capacity neighbours. (R1) demands neighbours bear the primary burden, (R2) recognizes they lack capacity, (R3) highlights neighbouring states cannot strategically reduce capacity further to avoid it – they are already overwhelmed. **Least Costly to Give Up:** Strict primacy of (R1). *Reason:* While proximity matters for initial refuge, operational adequacy requires mechanisms (robust burden-sharing) to relieve overwhelmed neighbours based on (R2), acknowledging (R1) cannot be the sole principle under mass displacement. Sacrificing (R2) crushes neighbours; sacrificing (R3) ignores bad faith.

  **The Most Exclusionary Requirement:** **"The duty-bearing state must be assignable based solely on objectively verifiable facts available to the adjudicator at the time of the status decision, without requiring speculation about future state actions (consent) or unknowable global burden-sharing outcomes."** *Why Exclusionary:* This requirement, driven by administrability and the need for caseworker certainty, immediately rules out any account where duty assignment depends on:
  *   A state's future consent.
  *   The outcome of a global quota/trading system not yet realized.
  *   Precise calculations of fair shares dependent on other states' actions.
  *   Assigning duties based purely on causal responsibility if evidence is asymmetric/unavailable.
  It forces accounts towards either: a) Tying duties tightly to status-determining facts (e.g., country of origin => origin state duty? Persecutor state duty? But see unsatisfiability), or b) Pre-assigning duties based on fixed criteria (e.g., geography, existing ties) decoupled from the ideal global distribution. It highlights the tension between individual adjudication and systemic burden-sharing.

  **Scorecard on Account Families (Brief)**

  *   **Capacity-Based:** Fails robustness (incentivizes degrading capacity) and doesn't inherently assign *individual* bearers. Survives only if capacity is a *moderating* factor within a duty-assignment scheme, not the sole trigger.
  *   **Causal/Historical-Responsibility-Based:** Fails administrability (unknowable/composite causation) and the core unsatisfiability test (persecutor as only agent). Cannot be primary basis.
  *   **Proximity/First-Asylum:** Fails robustness (overwhelms neighbours, incentivizes border closures) and capacity/proportionality. Necessary for initial refuge but insufficient alone; requires robust burden-sharing corollary.
  *   **Associative/Special-Ties:** Strong on administrability and defensibility (family, diaspora). Fails impartiality and handling claimants with no ties. Useful supplement, not primary basis.
  *   **Fair-Share/Global-Distribution:** Best on burden-sharing and partial compliance *in theory*. Fails the exclusionary requirement – cannot assign *individual* bearers predictably during case adjudication without a pre-agreed, functioning system. Requires a separate status determination and a *political* mechanism for allocation.
  *   **Consent/Self-Determination:** Essential pragmatically but fails the individual-right/duty-bearer assignment if made absolute. Cannot satisfy the "assigns a bearer" requirement unless consent is presumed or compelled.
  *   **Market/Tradable-Quotas:** Potentially efficient for burden-sharing. Fails administrability (complexity), robustness (gaming prices/capacity), and commodification concerns. Also fails the exclusionary requirement – individual duty-bearer isn't known at status decision.

  No family fully satisfies the operational desiderata alone. The exclusionary requirement and the unsatisfiable subsets point towards a hybrid model: **Status** defined robustly per Desiderata I. **Duties** initially focused on core non-refoulement by *any* state contacted and support by first-asylum/proximate states, coupled with a **Fair-Share mechanism** (based on capacity & perhaps moderated by manageable ties/causation) for *resolving* situations (protracted displacement, overwhelmed neighbours) and assigning *durable solutions*. This separates the caseworker's immediate protection decision (status + non-refoulement) from the systemic burden-sharing (ministerial/political level). The hardest cases (climate displacement, composite flows) will stress-test the definitions within Status and the fairness of the Share mechanism. The guidance must make this hybrid structure and its inherent tensions explicit.
