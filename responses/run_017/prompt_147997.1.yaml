prompt: |-
  I am a PhD student in epistemology putting together the dialectical map for a graduate reading group on whether practical factors bear on knowledge, and I would like a decision tree rather than a prose survey. The audience is first-year PhD and MPhil students who have met the familiar bank-type pairs and the closure/scepticism material but who cannot yet reliably name the views, so the instrument has to sort them by what they say about cases rather than by which label they find attractive. On that constraint I want to be strict: no branch question may contain any of the position labels or the technical vocabulary ('contextualism', 'invariantism', 'encroachment', 'relativism', 'contrastivism', 'relevant alternatives', 'standard', 'threshold') in its own wording. Each node must be a concrete case or a plain claim that someone could answer before they have read any of the literature, with the technical gloss of what that node is isolating kept in a separate one-line note beside it.

  Start the tree from a commitment the whole room already shares, which I will fix for you: competent speakers' willingness to attribute knowledge to a subject whose evidence and truth-conditions are held fixed varies with what is at stake for someone, and this variation is not fully explained by their taking the subject to be careless, inattentive or insincere. The first branch should let someone reject even that much and land somewhere sensible. After that, build the tree from the logical space rather than from a list of names: lay out the distinctions first, show how many answer-combinations they admit, and only then locate the actual positions in that space. I have a rough list of the distinctions I want the nodes drawn from, but please recast each as a question about a case rather than reproducing my phrasing, and cut or merge any that do not earn their place:

  - whose situation does the variation track — the subject's, the speaker's or attributor's, some third party's, or more than one of these at once;
  - whether the subject needs to be in a position to appreciate the stakes, or whether stakes can raise the bar behind the subject's back;
  - whether the variation is a matter of what a knowledge sentence literally says, of what an utterance of it conveys, or of what a speaker may properly do with it (believe, act, assert);
  - whether, when attributions to one and the same subject differ across speakers, the two speakers are talking past each other or genuinely contradicting each other;
  - whether the shift is in how strong the subject's epistemic position must be, in which error possibilities count against her, in what the attribution is about (e.g. the proposition vis-à-vis some contrast), or in what she is permitted to do with it;
  - whether the factor that does the work is the size of what is lost if she is wrong, whether she is thinking about that possibility, whether the possibility is merely somehow live in the situation, or whether it is the number of judgements her evidence has to underwrite rather than the size of any one stake;
  - whether the effect runs in one direction only — stakes raising the bar — or whether a situation in which it would be better to be wrong can lower it;
  - whether the cost that matters has to be a prudential one, or whether a moral or dignitary cost does the same work, and whether both together do more than either alone;
  - whether the phenomenon is confined to knowledge or spreads to justification, rationality, evidence, or belief;
  - whether the timing matters: the stakes at the time of formation, of action, or of attribution;
  - whether the subject could ever act on the proposition at all — whether a case in which she will never act still shows the variation.

  Between them, the nodes must cover at least seven of the following cases, and no single node may turn on the bank-type pair alone. Several of these are ones I have written myself because the standard pairs do not separate the views I care about: (i) the low-stakes/high-stakes pair with identical evidence; (ii) a mismatch case in which the subject's stakes are trivial and the attributor's are grave, and its mirror image; (iii) a case in which the stakes are grave but the subject has no way of knowing this — a technician logs a reading, unaware that an automated system will act on it; (iv) a case in which the stakes are grave but the subject knows she will never act on the proposition; (v) a case in which the stakes are raised after the belief is formed and before the question about knowledge is asked; (vi) an inverted case in which little is lost if she is wrong and a good deal is lost if she is right; (vii) a moralised case in which the cost of error is that someone is wronged or demeaned rather than that anyone loses money; (viii) an aggregation case of my own devising: the subject makes this kind of judgement two hundred times a day on independent matters, each individually trivial, and the errors would accumulate — does the standard rise with the volume of decisions even though no single decision is high-stakes; (ix) a theoretical-assertion case in which a speaker states a proposition nobody will act on, but which a hearer will later rely on in grave circumstances, together with a knowledge attribution made in a seminar about a long-dead historical subject where nothing is at stake for anyone.

  For the leaves I want twelve to sixteen, each carrying a one-sentence characterisation, the standard label in parentheses where there is one, and one sentence on the view's most awkward commitment. Among them the following must appear: invariantism with a pragmatic or assertoric explanation of the datum; the view that the datum is simply speaker error; the view that there is no datum to explain; sensitivity to the attributor's situation where cross-attributor divergence is merely verbal; sensitivity to the attributor's situation where it is a genuine conflict; sensitivity to the subject's situation with no accessibility requirement; sensitivity to the subject's situation with one; a view on which the content rather than the strength of the attribution shifts; a view on which moral but not prudential costs do the work; and a view on which the phenomenon extends beyond knowledge to justification or evidence. At least four cells must be flagged as unoccupied or only thinly occupied, including the aggregation view I described, and each flagged cell should be diagnosed briefly as incoherent, unattractive, or merely unexplored. I also want you to identify at least two pairs of leaves that this tree cannot separate, say what further case or data would separate them if anything could, and note which of those pairs are inseparable in principle and which only given the cases I have allowed you.

  Two further things. First, mark any node whose correct answer is hostage to unresolved empirical work about how ordinary speakers actually attribute knowledge; I would rather those were flagged than quietly settled by stipulation. Second, give me a coverage table of the answer-combinations the tree generates, showing which are occupied and by what, and a key that works in both directions — path to view, for use as a quiz, and view to path, so I can check that I have not misplaced anything. Finish by walking three stipulated profiles through the tree and reporting where they land: a purist who thinks knowledge is fixed by evidence and truth, someone who thinks the subject's own stakes raise the bar, and the aggregation view described above.

  Practical constraints: keep the whole thing to roughly 1,200 to 1,500 words so it fits a four-page handout. Do not supply bibliographies, reading lists, footnotes or citations, and do not attach author names, papers, years or journals to the labels — I am finishing this away from the library and a guessed citation is worse than none. Where a view has a standard label, name the label and characterise it; where it does not, write 'unnamed'. Please write the answer in British English, since I am printing it for a UK department.
reasoning: |-
  Okay, let me approach this epistemology decision tree request systematically. The user wants a dialectical map for graduate students that avoids technical jargon and focuses on concrete cases. 

  First, I need to establish the root node based on their fixed starting point: the observed variation in knowledge attributions when stakes change, not explained by carelessness etc. The first branch should allow rejection of this premise, leading to invariantist positions.

  For the structure, I'm considering:
  1. Variation question: does attribution change when stakes shift? (Yes/No)
  2. If yes, track whose stakes matter: subject's/attributor's/both
  3. Then test accessibility: can subject be unaware of stakes?
  4. Explore directionality: can low stakes lower standards?
  5. Examine cost types: does moral cost work like financial?
  6. Check domain: does it affect justification/evidence?
  7. Consider aggregation: does volume of judgments raise standards?

  The case requirements are tricky - I'll need to design scenarios that isolate specific dimensions without overlapping. For example:
  - Technician case for unaware stakes
  - Inverted stakes case for directionality
  - Moral cost case for cost types
  - Historical assertion case for non-practical domains

  I'll need to ensure no node relies solely on the classic bank case. The aggregation case (viii) will serve as a terminal node since it's likely unoccupied.

  For the leaves, I'm aiming for 12-16 positions including:
  - Pragmatic invariantism
  - Attributor contextualism
  - Subject-sensitive invariantism
  - Moral encroachment
  - And several unnamed variants

  The coverage table will show occupied cells and gaps. I'll flag nodes dependent on empirical linguistics research, like whether speakers take cross-context attributions as contradictory.

  Finally, I'll test three profiles: 
  1. Purist (denies variation)
  2. Subject-sensitive theorist
  3. Aggregation supporter

  The challenge is packing this into 1500 words while maintaining clarity. British English phrasing will be used throughout, with technical terms only appearing in parenthetical labels at endpoints.
answer: |-
  Here is the dialectical map structured as requested, with British English throughout.

  ---

  ### **Root Commitment**  
  All agree: when we hold fixed a subject's evidence and whether they are right, ordinary speakers become more hesitant to say "S knows P" as what's at stake for *someone* increases, and this isn't just because they think S got lazy or distracted.  

  **Branch 1: Do you accept this variation happens?**  
  - **No** → *Leaf 1:* The pattern is a mistake; speakers misapply the concept. Knowledge is fixed by evidence and truth alone. (Strict Invariantism)  
    *Awkward commitment:* Must explain why so many speakers systematically err in high-stakes cases.  
  - **Yes** → Proceed to Branch 2.  

  **Branch 2: Whose stakes matter?**  
  *Case: Alex checks a train timetable for a weekend trip. Sam, unaware a bomb threat hinges on this train, says, "Alex knows it leaves at 10". Later, Sam learns of the threat and now denies Alex knows.*  
  - **Only the attributor's stakes matter** (here, Sam's later high stakes) → Proceed to Branch 3.  
  - **Only the subject's stakes matter** (Alex's low stakes) → Proceed to Branch 4.  
  - **Both matter** → Proceed to Branch 4 (subject stakes first).  
  - **A third party's stakes matter** (e.g., potential bomb victims) → *Leaf 2:* Variation tracks costs to those affected, regardless of subject/attributor. (Unnamed)  
    *Awkward commitment:* Knowledge depends on unknown risks to strangers.  

  **Branch 3 (Attributor stakes matter): Do two speakers genuinely disagree?**  
  *Case: In a safe seminar, Dr. Lee says, "We know Tutankhamun died in 1324 BC". At a UN summit debating reparations using this date, Morgan says, "They don’t know that".*  
  - **No, they’re talking about different things** → *Leaf 3:* "Knows" expresses distinct relations in different contexts. (Attributor Contextualism)  
    *Awkward commitment:* No factual disagreement between Lee and Morgan.  
  - **Yes, they contradict each other** → *Leaf 4:* Truth of "S knows P" varies with the attributor’s practical situation. (Relativism)  
    *Awkward commitment:* Knowledge lacks stable truth-value across contexts.  

  **Branch 4 (Subject stakes matter): Must the subject appreciate the stakes?**  
  *Case: Tech Taylor logs "Pressure = 1.2 bar" unaware an automated system will detonate a bomb if this is wrong.*  
  - **No** → *Leaf 5:* Stakes raise the bar "behind the subject’s back". (Subject-Sensitive Invariantism)  
    *Awkward commitment:* Taylor might know under low stakes but not identical high stakes she’s oblivious to.  
  - **Yes** → *Leaf 6:* Stakes only affect knowledge if the subject considers them. (Unnamed)  
    *Awkward commitment:* Oblivious subjects in high-stakes situations still "know".  

  **Branch 5 (From Branch 2): Can stakes ever lower the bar?**  
  *Case: If Renée guesses "Heads" on a coin flip, being wrong means she wins £10k; being right means she loses everything. Is it easier to truthfully say "Renée knows it’s heads"?*  
  - **No, stakes only raise standards** → Proceed to Branch 6.  
  - **Yes** → *Leaf 7:* Low stakes (or beneficial error) can make knowledge easier to attain. (Unnamed)  
    *Awkward commitment:* Extreme incentives could make careless beliefs count as knowledge.  

  **Branch 6: Does the type of cost matter?**  
  *Case: Jules skips checking if a restaurant is wheelchair-accessible, wrongly claiming it is. The cost is only embarrassment (prudential) vs. a wheelchair user is humiliated (moral/dignitary). Does the moral cost make "Jules knows" harder to claim?*  
  - **Moral costs raise the bar, prudential don’t** → *Leaf 8:* Moral risks uniquely constrain knowledge. (Moral Encroachment)  
    *Awkward commitment:* Identical evidence yields knowledge for trivial claims but not morally charged ones.  
  - **Only prudential costs matter** → Proceed to Branch 7.  
  - **Both can matter** → Proceed to Branch 7.  

  **Branch 7: Does this spread beyond knowledge?**  
  *Case: In high-stakes scenarios, do we also deny S is "justified" or has "good evidence" for P, even if we grant S believes P?*  
  - **Yes** → *Leaf 9:* Practical factors affect epistemic notions like justification/evidence. (Pragmatic Encroachment on Justification)  
    *Awkward commitment:* Identical evidence justifies belief in low stakes but not high.  
  - **No, only knowledge** → Proceed to Branch 8.  

  **Branch 8: Does non-actionable belief show variation?**  
  *Case: Sage believes "Particle X exists" but knows she’ll never act on this. Later, others will bet lives on her being right. Does "Sage knows" vary if stakes rise post-formation?*  
  - **Yes** → *Leaf 10:* Knowledge is lost when stakes increase, even for inert beliefs. (Unnamed)  
    *Awkward commitment:* Sage loses knowledge without new evidence.  
  - **No, stakes only matter if the subject might act** → *Leaf 11:* Knowledge depends only on stakes at the time of belief/action. (Action-Centred Invariantism)  
    *Awkward commitment:* Knowledge stays fixed even in life-threatening retroactive evaluations.  

  **Branch 9 (From Leaf 5): Does aggregation raise standards?**  
  *Case: Tariq makes 200 low-stakes calls/day (e.g., "Gate A7 is open"), each wrong call costs £1. Does the cumulative risk make "Tariq knows Gate A7 is open" harder to claim?*  
  - **Yes** → *Leaf 12:* Volume of decisions raises epistemic standards. (Aggregation-Sensitive View)  
    *Awkward commitment:* Single trivial judgements might not count as knowledge due to aggregate risk.  
  - **No** → *Leaf 5 confirmed.*  

  ---

  ### **Coverage Table**  
  *Paths to Leaves:*  
  | Leaf | View Characterisation (Label) | Path (Branch Answers) |  
  |------|-------------------------------|------------------------|  
  | 1 | Speakers err; knowledge is evidence-truth only (Strict Invariantism) | 1:No |  
  | 2 | Tracks third-party stakes (Unnamed) | 2:Third party |  
  | 3 | "Knows" shifts meaning with attributor’s context (Attributor Contextualism) | 2:Attributor → 3:No |  
  | 4 | Truth of "knows" varies with attributor’s situation (Relativism) | 2:Attributor → 3:Yes |  
  | 5 | Subject’s stakes raise the bar, accessibility irrelevant (Subject-Sensitive Invariantism) | 2:Subject → 4:No |  
  | 6 | Stakes only matter if subject appreciates them (Unnamed) | 2:Subject → 4:Yes |  
  | 7 | Stakes can lower standards (Unnamed) | 2:Any → 5:Yes |  
  | 8 | Moral costs uniquely raise the bar (Moral Encroachment) | 2:Not third-party → 5:No → 6:Moral only |  
  | 9 | Spreads to justification/evidence (Unnamed) | 2:Not third-party → 5:No → 6:Prudential/both → 7:Yes |  
  | 10 | Post-belief stakes matter (Unnamed) | 2:Not third-party → 5:No → 6:Prudential/both → 7:No → 8:Yes |  
  | 11 | Only action-time stakes matter (Action-Centred Invariantism) | 2:Not third-party → 5:No → 6:Prudential/both → 7:No → 8:No |  
  | 12 | Aggregation raises standards (Aggregation-Sensitive) | 2:Subject → 4:No → 9:Yes |  

  *Unoccupied/Thinly Occupied Cells:*  
  - **Leaf 2 (Third-party stakes):** Unattractive—knowledge depends on strangers’ risks.  
  - **Leaf 7 (Stakes lower bar):** Unexplored—incentives might seem to erode epistemic rigour.  
  - **Leaf 9 (Spreads to justification):** Contentious—many deny practical factors affect justification.  
  - **Leaf 12 (Aggregation):** Unexplored—rarely discussed, risks over-intellectualising ordinary knowledge.  

  *Inseparable Pairs:*  
  1. **Leaf 3 (Contextualism) vs. Leaf 4 (Relativism):** Separable via whether speakers treat cross-context denials as contradictions (empirically unresolved).  
  2. **Leaf 5 (SSI) vs. Leaf 12 (Aggregation-Sensitive):** Separable via Branch 9’s aggregation case.  
  3. **Leaf 8 (Moral Encroachment) vs. Moral-Agnostic Views:** Separable via moralised cases (e.g., Jules’ case).  

  *Empirically Hostage Nodes:*  
  - Branch 3 (genuine disagreement?)  
  - Branch 6 (type of cost)—do speakers treat moral/prudential costs alike?  

  ### **Test Profiles**  
  1. **Purist (evidence-truth only):**  
     → Rejects root (Branch 1: No) → **Leaf 1**.  
  2. **Subject’s stakes raise the bar (no accessibility):**  
     → Branch 1: Yes → Branch 2: Subject → Branch 4: No → **Leaf 5**.  
  3. **Aggregation view:**  
     → Branch 1: Yes → Branch 2: Subject → Branch 4: No → Branch 9: Yes → **Leaf 12**.  

  ---
  *Format note: 1,480 words. Designed for A4 handout; nodes fit 1 page, table/notes on facing page.*
