  We are designing an activity for a 75-minute session on Jeffrey conditionalization and uncertain evidence. The goal is to have students encounter the key ideas without formal terminology until the debrief. We'll have three rounds: 
   1. Control round: hard evidence -> traditional conditionalization.
   2. Soft evidence: Jeffrey update (weighted average) is correct.
   3. Two-channel round: same shift in confidence about E, but different updates for H due to channel information.

   We'll use a hidden state (a binary variable, say H: true or false) and an evidence proposition E (also binary). The students will have a prior joint distribution over H and E. We'll use a scoring rule to incentivize honest reporting of credences.

   Props: 
     - Two dice: one for the hidden state (say, a d6: 1-3 for H=false, 4-6 for H=true) and one for the evidence generation (details per round).
     - Index cards for students to write their credences (for E and for H) in each round.
     - Whiteboard to display the setup and to plot the scatter.
     - Markers for the whiteboard.

   We'll use a proper scoring rule: the Brier score. For a binary event, the Brier score for a reported credence q in the true outcome (say, X=1) is: 
        (1 - q)^2   if X=1, 
        q^2         if X=0.

   However, we have two propositions: E and H. We want to elicit both. We can use a separate Brier score for each. But note: the students are updating their entire belief state, and we want to reward accurate credences for both. We can combine the two Brier scores by adding them (with equal weight). 

   Why two numbers? Because in Jeffrey conditionalization, the update to H depends on the update to E. We want to see if they are updating E appropriately and then H appropriately. However, note that the evidence in the second and third rounds is about E, so we expect them to update E and then H. But in the control round, they get direct evidence about E (so E becomes certain) and then update H by conditionalization.

   We'll have three rounds. Each round will have:
     - A prior (same for all rounds? or reset each time? We'll use the same prior in all rounds to build continuity, but the evidence will be different. The prior will be given and fixed.)
     - A hidden state drawn (H: true or false).
     - A channel that produces evidence (which the students don't see directly) and then an "impression" of that evidence delivered to the students (which they use to update).

   We need to design the channels:

   Control round: 
     - The evidence is hard. The channel reports E exactly (so they learn E with certainty). 
     - We expect: P_new(H) = P_old(H|E) [if they learned E] or P_old(H|~E) [if they learned ~E].

   Soft evidence round (Jeffrey round):
     - The channel is noisy about E. It might say "E" when E is true with high probability, but sometimes make an error. The impression is the actual report (so they see the noisy report). 
     - But in this round, the channel does not provide any extra information about the relationship between E and H beyond what is in the prior. So the rigidity condition holds: P_new(H|E) = P_old(H|E) and P_new(H|~E) = P_old(H|~E).
     - Therefore, the update should be: P_new(H) = P_old(H|E)*P_new(E) + P_old(H|~E)*P_new(~E).

   Two-channel round (split round):
     - We split the class into two halves. Both halves will have their confidence in E shifted to the same value (say, 0.7). But the channels are different.
     - Channel A: noisy about E, but the noise is independent of H (so rigidity holds). This is the same as the soft evidence round.
     - Channel B: the noise also tells us something about the reliability of the sensor. Specifically, the sensor might be more reliable when H is true than when H is false (or vice versa). This breaks rigidity because P_new(H|E) might not equal P_old(H|E). 

   How to set up Channel B? We need the same marginal for E (so P_new(E)=0.7) but different conditional probabilities for H given E and H given ~E.

   We can do this by having the sensor report not only about E but also about the reliability of the sensor? Alternatively, we can have two different sensors.

   Let me design a concrete example.

   Prior joint distribution (fixed for all rounds):

     Let H be true with probability 0.5.
     Let E depend on H: 
          P(E|H) = 0.8
          P(E|~H) = 0.3

     Therefore, the prior for E: P(E) = P(E|H)*P(H) + P(E|~H)*P(~H) = 0.8*0.5 + 0.3*0.5 = 0.55.

     And the conditional probabilities for H given E:
          P(H|E) = [P(E|H)*P(H)] / P(E) = (0.8*0.5)/0.55 ≈ 0.727
          P(H|~E) = [P(~E|H)*P(H)] / P(~E) = (0.2*0.5)/0.45 ≈ 0.222

   Control round:
     - We draw H (using a d6: 1-3 -> H=false, 4-6 -> H=true). Then we draw E given H: 
          If H=true, then E=true with prob 0.8. We can use a d10: 1-8 -> E=true, 9-10 -> E=false? 
          But we need to be able to do it with dice. Alternatively, we can precompute a table of outcomes? 
     - However, in the control round, the channel reports E exactly. So the students learn E for certain.
     - We then ask for: 
            Credence in E (should be 1 or 0) and Credence in H (should be P(H|E) or P(H|~E)).

     But note: they are going to update both. We want them to report their new credence in E and in H.

     We expect: 
          If they learned E, then credence in E=1, and credence in H = P(H|E) ≈ 0.727.
          If they learned ~E, then credence in E=0, and credence in H = P(H|~E) ≈ 0.222.

   Soft evidence round (Jeffrey round):
     - The channel is noisy. We introduce a sensor that reports on E. The sensor has a known reliability: 
          It says "E" when E is true with probability 0.9, and says "~E" when E is false with probability 0.9.
     - Then, we draw the true E (based on H) and then the sensor report (based on E). The students do not see the true E, only the sensor report.

