      - Draw H (d6: 1-3 -> false, 4-6 -> true).
      - Then draw E given H: 
            If H=true: draw E=true with probability 0.8 (e.g., d10: 1-8 -> true, 9-10 -> false)
            If H=false: draw E=true with probability 0.3 (d10: 1-3 -> true, 4-10 -> false)
      - The students are told the true value of E (e.g., "E is true" or "E is false").
      - They then report their new credence in E (which should be 1 or 0) and in H (which should be P(H|E) or P(H|~E)).

   2. Soft evidence round (20 minutes):
      - Same prior.
      - We introduce a sensor: 
            "There is a sensor that reports on E. When E is true, it reports 'true' with probability 0.9. When E is false, it reports 'false' with probability 0.9. The sensor's accuracy is the same regardless of H."
      - We draw H, then E given H, then the sensor report given E.
      - The students are told the sensor report (e.g., " the sensor reports 'E is true' ").
      - They then report their new credence in E and in H.

      We will do one report for the whole class. Let's assume we draw and get report="E is true", then they should have:
          P(E) = 0.917 (as calculated earlier) and then P(H) = 0.685.

   3. Split round (20 minutes):
      - Split the class into Group A and Group B.
      - Group A: 
            "You have evidence that shifts your credence in E to exactly 0.7, and you have no information that would cause you to change your conditional credences of H given E or given not-E."
      - Group B:
            "You have evidence that shifts your credence in E to exactly 0.7. Additionally, you learn that the conditional probability of H given E should be 0.9 and given not-E should be 0.1."
      - They then report their new credence in E and in H.

      For Group A, we expect P(H)=0.5755.
      For Group B, we expect P(H)=0.66.

      Note: In Group B, they are told the new conditional probabilities, so they should use them. We are not asking them to do a Jeffrey update, but to update to these new conditionals. This is not a within-Jeffrey issue, but it illustrates that the same marginal on E can lead to different for H if the conditionals change.

      This is the point: the weighted average rule assumes the conditionals remain the same. If they change, then you cannot use the old conditionals.

      In the debrief, we will explain that the weighted average rule assumes rigidity: P_new(H|E) = P_old(H|E) and similarly for ~E. In the split round, Group B has a different experience that breaks rigidity.

      This meets the requirement.

   Now, the scoring rule: 

      We will use the Brier score for a binary event. Since H is binary, and E is binary, we will score both.

      For a student who reports credence q for E and r for H.
      After the round, we will learn the truth of E and H.

      The Brier score for E: if E is true, (1-q)^2, if false, q^2.
      The Brier score for H: if H is true, (1-r)^2, if false, r^2.

      Total score for the round = Brier_E + Brier_H.

      Since the Brier score is proper, reporting honestly is optimal.

      Why two numbers? Because we want to incentivize honest reporting of both. Note that they are not independent, but the Brier score for each is proper separately, and since the score is the sum, it is still proper for the vector (q, r) for the events E and H.

      However, strictly speaking, the events are not independent, but the Brier score for each event is computed independently. The total score is then the sum of two proper scoring rules, so it is proper for the joint distribution.

      We will have three rounds. The total score for a student is the sum of the scores from the three rounds. Lower score is better (since Brier score is a penalty).

      We can then rank students by total score and have a leaderboard.

      We need to do the draws for H and E in a way that is transparent. We will use dice in front of the class.

      For the split round, there is no draw for the evidence ( it is given as a setting), but we still have a hidden state (H and E) that will be drawn to compute the score. 

      So in the split round, we will still draw H and E using the prior, even though the evidence is given in a non-generated way. This is to have a truthful state for the scoring.

      However, note: in the split round, the evidence is not generated by a sensor, so the students might wonder why we are drawing. We can explain that the world state (H and E) is still drawn from the prior, and then we will score based on that state.

      But in Group B, they have changed their conditional probabilities. Does that affect the prior? We are not changing the prior for the world state generation; we are only changing their beliefs. The world state is drawn from the original prior.

      This is a bit odd, but since the scoring rule is proper, it is still in their interest to report their true credence.

      Alternatively, to avoid any issue, we can not draw a new world state for the split round, but use the same world state as in one of the previous rounds? But the rounds are independent. 

      We will draw a new world state for each round.

      At the beginning of each round, we will draw H and then E given H.

      In the control round, we then reveal E to the students.
      In the soft evidence round, we then draw the sensor report and reveal that.
      In the split round, we do not use the drawn E or H in the evidence, so after they report, we will reveal the drawn E and H for scoring.

      This is acceptable.

   Timeline for a 75-minute session:

    0-5 min: Introduction and prior distribution (write on board): 
          P(H) = 0.5. 
          P(E|H) = 0.8 -> if H is true, then E is true with 80% probability.
          P(E|~H) = 0.3 -> if H is false, then E is true with 30% probability.
          Explain that H and E are binary.

    5-15 min: Control round.
          - Draw H: roll d6, 1-3: H=false, 4-6: H=true.
          - Then draw E: 
               If H=true: roll d10, 1-8: E=true, 9-10: E=false.
               If H=false: roll d10, 1-3: E=true, 4-10: E=false.
          - Announce the true value of E.
          - Students write on index card: 
                [Name] 
                Round 1: 
                   Credence in E: [should be 0 or 1]
                   Credence in H: [number]
          - Collect the cards.

    15-35 min: Soft evidence round.
          - Explain the sensor: 
                When E is true, it reports "E is true" with probability 0.9.
                When E is false, it reports "E is false" with probability 0.9.
          - Draw H (same as above), then E given H, then the sensor report given E:
                If E=true: roll d10, 1-9: report="E is true", 10: report="E is false".
                If E=false: roll d10, 1-9: report="E is false", 10: report="E is true".
          - Announce the sensor report to the class.
          - Students write on index card:
                Round 2:
                   Credence in E: [number between 0 and 1]
                   Credence in H: [number]
          - Collect the cards.

    35-55 min: Split round.
          - Split the class into Group A and Group B (by counting off 1-2 or by which side of the room).
          - Group A instructions (read aloud or project for Group A): 
                "You have evidence that should make you set your credence in E to 0.7, and you have no information that would cause you to change your conditional credences of H given E or given not-E."
          - Group B instructions: 
                "You have evidence that should make you set your credence in E to 0.7. Additionally, you learn that the conditional probability of H given E should be 0.9 and given not-E should be 0.1."
          - Students write on index card:
                Round 3:
                   Credence in E: [number]
                   Credence in H: [number]
          - Collect the cards.

    55-65 min: Reveal and scoring.
          - For each round, after collecting, we should have drawn H and E. We will reveal the true H and E for each round.
          - We will also reveal the sensor report for round 2 (already known) and nothing for round 3.
          - We will score for each round: 
                For each student, for each round, compute:
                   Brier_E = (truth_E - reported_q)^2  [where truth_E=1 if true, 0 if false]
                   Brier_H = (truth_H - reported_r)^2
                   Round score = Brier_E + Brier_H
          - We will also create a scatter plot for round 3: 
                   x-axis: reported credence in E
                   y-axis: reported credence in H
                   Mark Group A and Group B with different colors.

          - We then draw the "Jeffrey update line": for any credence q in E, the corresponding credence in H would be: 
                   r = 0.727 * q + 0.222 * (1-q) = 0.222 + 0.505 * q
            (because with the old conditionals).
          - We plot this line on the scatter.

          - We will see that Group A should be near the line, while Group B is above the line.

    65-75 min: Debrief.

   The answer key for the instructor:

    Round 1 (Control): 
        After learning E, they should set:
            If E=true: P(E)=1, P(H)=0.727.
            If E=false: P(E)=0, P(H)=0.222.

    Round 2 (Soft evidence): 
        Sensor report: say we got "E is true", then:
            P(E) = [0.9 * 0.55] / [0.9*0.55 + 0.1*0.45] = 0.495 / (0.495+0.045) = 0.495/0.54 = 0.9167.
            P(H) = 0.727 * 0.9167 + 0.222 * (1-0.9167) = 0.727*0.9167 + 0.222*0.0833 ≈ 0.666 + 0.0185 = 0.6845.

        If the sensor reports "E is false", then:
            P(E) = [0.1 * 0.55] / [0.1*0.55 + 0.9*0.45] = 0.055 / (0.055+0.405) = 0.055/0.46 ≈ 0.1196.
            P(H) = 0.727*0.1196 + 0.222*(1-0.1196) = 0.087 + 0.195 = 0.282.

    Round 3 (Split):
        Group A: 
            P(E) = 0.7
            P(H) = 0.727*0.7 + 0.222*0.3 = 0.5089 + 0.0666 = 0.5755.

        Group B:
            P(E) = 0.7
            P(H) = 0.9*0.7 + 0.1*0.3 = 0.63+0.03 = 0.66.

    For the scatter in round 3, the reference line is: r = 0.222 + 0.505 * q.

    For example, at q=0.7, the line is at 0.222 + 0.505*0.7 = 0.222+0.3535=0.5755.

    Group A should be at (0.7, 0.5755) -> on the line.
    Group B should be at (0.7, 0.66) -> above the line.

    What will go wrong:

        - Students might not be able to compute the Jeffrey update in round 2.
          We can help by providing a probability tree for the prior and for the sensor, but we don't want to lecture.

        - In round 3, Group A might not know how to update. We can remind them that they should not change the conditional probabilities, so use the old ones.

        - In round 3, Group B might be confused about the new conditional probabilities. We can clarify: "This means that after this evidence, you now believe that if E is true, then the probability of H is 0.9, and if E is false, then the probability of H is 0.1."

        - Scoring: we have to compute the Brier score for 16 students for 3 rounds, which is 48. It might be time-consuming. We can do it after class and post the leaderboard next time, or we can have a TA do it, but there is no TA. 
          Alternatively, we can use a spreadsheet on our phone and enter the numbers quickly, or we can have the students score themselves in the next session.

          We decide to do the scoring for round 1 and 2 in class, and for round 3 after class, and then announce the leaderboard at the beginning of the next session. But then the activity for this session doesn't have the scores. 

          Alternatively, we can not do the scoring for the purpose of the activity? But the scoring rule is to incentivize honesty. 

          We can simplify scoring for in-class: only for the first round, do the scoring together to show how it works, then for the other rounds we can do it later.

        - The split in round 3 might not be clean. Some students in Group A might not update and leave P(H) at the prior, or they might do something else. We then might not see two clusters.

          To mitigate, we can provide a worksheet for round 3 that prompts them:

            Group A: 
               Your new P(E) = 0.7.
               Your new P(H|E) should be the same as the old P(H|E) = 0.727.
               Your new P(H|~E) should be the same as the old P(H|~E) = 0.222.
               Therefore, your new P(H) = 0.7 * 0.727 + (1-0.7)*0.222 = ?

            Group B:
               Your new P(E) = 0.7.
               Your new P(H|E) = 0.9.
               Your new P(H|~E) = 0.1.
               Therefore, your new P(H) = 0.7 * 0.9 + (1-0.7)*0.1 = ?

        - Time: the rounds might take more than planned. We can cut short the debrief if needed.

    What the activity cannot reproduce:

        - In real life, the partition might not be given, and the joint distribution is not known. We are assuming a clean partition and known conditionals.

        - In real life, the agent might not have a determinate number for the new confidence in the evidence proposition. Here, in round 3, we are giving them a number.

        - Jeffrey conditionalization is typically used when the evidence directly affects the probability of a proposition without the agent knowing how it is related to other propositions. In our split round, Group B is given information that explicitly changes the conditionals, which is a different kind of learning.

        - In real life, the update might be spread over a partition with more than two cells, and the partition might be coarse.

    We forgo the order-of-evidence variant due to complexity and time.

    This is the design. We now provide the facilitator's table for draws.
answer: |-
  ### Session Design: Uncertain Evidence and Jeffrey Conditionalization  
  **Duration:** 75 minutes  
  **Students:** 16  
  **Props:** Two 6-sided dice (d6), one 10-sided die (d10), index cards, markers, whiteboard, projector.  
  **Scoring:** Brier score (lower = better). Prize: Top 3 on leaderboard get "Bayesian Expert" certificates.  

  ---

  ### **Facilitator's Setup**  
  1. **Prior Distribution (Write on board):**  
     - \(P(H) = 0.5\)  
     - \(P(E|H) = 0.8\)  
     - \(P(E|\neg H) = 0.3\)  
     - \(P(E) = 0.55\), \(P(H|E) \approx 0.727\), \(P(H|\neg E) \approx 0.222\) (precomputed).  

  2. **Dice Protocol (Public randomization):**  
     - **H draw (d6):** 1–3 → \(H = \text{False}\), 4–6 → \(H = \text{True}\).  
     - **E draw (d10):**  
       - If \(H = \text{True}\): 1–8 → \(E = \text{True}\), 9–10 → \(E = \text{False}\).  
       - If \(H = \text{False}\): 1–3 → \(E = \text{True}\), 4–10 → \(E = \text{False}\).  
     - **Sensor report (Soft Evidence round, d10):**  
       - If \(E = \text{True}\): 1–9 → Report "E", 10 → Report "¬E".  
       - If \(E = \text{False}\): 1–9 → Report "¬E", 10 → Report "E".  

  3. **Transparency:**  
     - Record all dice rolls publicly. After reveals, show students the dice and let them verify outcomes.  

  ---

  ### **Rounds and Timeline**  
  #### **Round 1: Control (Hard Evidence) [15 min]**  
  - **Goal:** Experience traditional conditionalization.  
  - **Procedure:**  
    1. Draw \(H\) and \(E\) publicly using dice.  
    2. Announce the **true value of \(E\)** (e.g., "E is True").  
    3. **Students write (index card):**  
       - New credence in \(E\) (must be 0 or 1).  
       - New credence in \(H\).  
  - **Expected Outcomes:**  
    - If \(E = \text{True}\): \(P(E) = 1\), \(P(H) = 0.727\).  
    - If \(E = \text{False}\): \(P(E) = 0\), \(P(H) = 0.222\).  

  #### **Round 2: Soft Evidence (Jeffrey Update) [20 min]**  
  - **Goal:** Discover the weighted-average rule.  
  - **Procedure:**  
    1. Draw \(H\), then \(E\), then **sensor report** publicly (e.g., "Sensor reports: E is True").  
    2. **Students write (index card):**  
       - New credence in \(E\).  
       - New credence in \(H\).  
  - **Expected Outcome (Sensor reports "E"):**  
    - \(P(E) \approx 0.917\) (via Bayes), \(P(H) \approx 0.685\) (weighted average).  
    - *After activity, reveal:* The rule used was \(P_{\text{new}}(H) = P_{\text{old}}(H|E) \cdot P_{\text{new}}(E) + P_{\text{old}}(H|\neg E) \cdot P_{\text{new}}(\neg E)\).  

  #### **Round 3: Split Evidence (Breaking Rigidity) [25 min]**  
  - **Goal:** See that the same \(P_{\text{new}}(E)\) can demand different \(P_{\text{new}}(H)\).  
  - **Procedure:**  
    1. Split class: **Group A** (8 students) and **Group B** (8 students).  
    2. **Announce:**  
       - **Group A:** "You receive evidence shifting \(P(E)\) to 0.7. Your conditional credences \(P(H|E)\) and \(P(H|\neg E)\) are unchanged."  
       - **Group B:** "You receive evidence shifting \(P(E)\) to 0.7. Additionally, you learn that \(P(H|E) = 0.9\) and \(P(H|\neg E) = 0.1\)."  
    3. **Students write (index card):**  
       - New credence in \(E\).  
       - New credence in \(H\).  
  - **Expected Outcomes:**  
    - **Group A (Rigidity):** \(P(H) = 0.727 \times 0.7 + 0.222 \times 0.3 \approx 0.575\).  
    - **Group B (Non-rigidity):** \(P(H) = 0.9 \times 0.7 + 0.1 \times 0.3 = 0.66\).  

  ---

  ### **Scoring Scheme**  
  - **Brier Score (Per Round, Per Student):**  
    - For \(E\): \((1 - q)^2\) if \(E\) true, \(q^2\) if \(E\) false.  
    - For \(H\): \((1 - r)^2\) if \(H\) true, \(r^2\) if \(H\) false.  
    - **Total score = Brier_E + Brier_H** (lower = better).  
  - **Why Brier?** Strictly proper—encourages honest reporting. Quadratic penalties make errors visible.  
  - **Why Two Numbers?**  
    - \(E\) and \(H\) are scored independently. Gaming one hurts the other (e.g., misreporting \(E\) distorts \(H\) via coherence).  
  - **Aggregation:** Sum scores across all 3 rounds. Leaderboard ranks students.  

  ---

  ### **Reveal and Board Artifact [10 min]**  
  1. **Plot (Projected Scatter):**  
     - **X-axis:** Reported \(P_{\text{new}}(E)\) (Round 3).  
     - **Y-axis:** Reported \(P_{\text{new}}(H)\) (Round 3).  
     - Color-code Group A (blue) and Group B (red).  
  2. **Reference Line (Draw AFTER dots are up):**  
     - **Weighted-average rule:** \(P(H) = 0.222 + 0.505 \cdot P(E)\).  
     - Equation: \(y = 0.222 + 0.505x\).  
  3. **Facilitate Discovery:**  
     - Ask: *"What pattern do you see? Why are groups clustered differently relative to the line?"*  
     - **DO NOT:** Name "rigidity" or "Jeffrey." Wait for students to observe:  
       - Group A is **on the line** (used old conditionals).  
       - Group B is **above the line** (changed conditionals).  
     - **Key Insight:** Same \(P_{\text{new}}(E)\) doesn’t dictate \(P_{\text{new}}(H)\)—conditionals matter.  

  ---

  ### **Debrief [10 min]**  
  1. **Map Observations to Concepts:**  
     - **Round 1:** "You conditioned on hard evidence. That’s Bayes' rule."  
     - **Round 2:** "With uncertain evidence, you averaged conditionals weighted by new \(P(E)\). That’s **Jeffrey conditionalization**."  
     - **Round 3:** "When evidence *also* changes how \(E\) relates to \(H\), the weighted average fails. We call that **rigidity failure**."  
  2. **Terminology (Introduce Now):**  
     - **Jeffrey Conditionalization:** Update rule: \(P_{\text{new}}(H) = \sum P_{\text{old}}(H|E_i) \cdot P_{\text{new}}(E_i)\).  
     - **Rigidity:** Assumes \(P_{\text{new}}(H|E_i) = P_{\text{old}}(H|E_i)\).  
  3. **Validate Errors:**  
     - **"I froze and didn’t update \(H\) in Round 2."**  
       - *Treat as reasonable:* Soft evidence feels ambiguous; emphasize that doing nothing violates coherence.  
     - **"Group B’s conditionals felt arbitrary."**  
       - *Affirm:* Real agents often lack clear partitions—this is why rigidity is a *substantive* assumption.  

  ---

  ### **Pitfalls and Fixes**  
  - **Comprehension Failure:**  
    - *Symptoms:* Students compute priors incorrectly or skip updates.  
    - *Fix:* Pre-write \(P(H|E)\) and \(P(H|\neg E)\) on board. Provide a worksheet for Round 3 calculations.  
  - **Arithmetic Errors:**  
    - *Symptoms:* Wild outliers in Round 2.  
    - *Fix:* Allow calculator use (phone). Circulate to assist.  
  - **Attention/Staging Failure:**  
    - *Symptoms:* Slow dice rolls; Groups A/B overhearing instructions.  
    - *Fix:* Pre-roll Round 1 & 2 \(H/E\) (hide results). Physically separate Groups A/B for Round 3.  
  - **Scoring Delay:**  
    - *Fix:* Compute scores after class; post leaderboard next session.  

  ---

  ### **Limitations and Lecture Supplements**  
  **What the Activity Misses:**  
  1. Real agents lack clean partitions, known joint distributions, and precise \(P_{\text{new}}(E)\).  
  2. Jeffrey’s rule assumes evidence shifts probabilities *directly*—not via Bayesian channels.  
  3. Rigidity is often a practical assumption, not a universal truth.  

  **Post-Activity Lecture Topics:**  
  - How to choose partitions (e.g., via **probability kinematics**).  
  - When rigidity fails (e.g., learning about causal dependencies).  
  - Alternatives (e.g., **Field conditionalization**).  

  ---

  ### **Answer Key**  
  | **Round**       | **Scenario**              | \(P_{\text{new}}(E)\) | \(P_{\text{new}}(H)\) |  
  |-----------------|---------------------------|------------------------|------------------------|  
  | **1 (Control)** | \(E = \text{True}\)       | 1.000                 | 0.727                 |  
  |                 | \(E = \text{False}\)      | 0.000                 | 0.222                 |  
  | **2 (Soft)**    | Sensor reports "E"       | 0.917                 | 0.685                 |  
  |                 | Sensor reports "¬E"      | 0.120                 | 0.282                 |  
  | **3 (Split)**   | Group A (Rigidity)       | 0.700                 | 0.575                 |  
  |                 | Group B (Non-rigidity)   | 0.700                 | 0.660                 |  

  **Sensitivity:**  
  - The Group A/B gap (\(\Delta P(H) \approx 0.085\)) is robust. To adjust:  
    - Increase gap: Raise Group B’s \(P(H|E)\) to 0.95.  
    - Decrease gap: Lower Group B’s \(P(H|E)\) to 0.85.  

  ---

  ### **Order-of-Evidence Variant (If Time Permits)**  
  **Design:**  
  - Two pieces of evidence (\(E_1\), \(E_2\)) presented in opposite orders to Groups A/B.  
  - **Group A:** Update on \(E_1\) then \(E_2\).  
  - **Group B:** Update on \(E_2\) then \(E_1\).  
  - **Trap:** Using stale conditionals causes order dependence.  
  - **Why It Fails:**  
    - Requires students to track sequential updates—too complex for 75 min.  
    - Rigidity failures compound; hard to isolate in a scatter plot.  
  - **Alternative:** Assign as homework problem.  

  ---

  **Run Notes:**  
  - **First Time?** Prioritize Rounds 1–3. Use the split round to trigger "aha!" moments.  
  - **Quote to Inspire:** *"Your credences today are not just about what you learned, but how you learned it."*  
  - **Final Tip:** Pre-draw Round 1 & 2 outcomes (hide in envelopes) to save time.  

  This design ensures students encounter rigidity, weighted averages, and their limits—without formal jargon until the debrief. The scatter plot confrontation in Round 3 is the climax. Good luck!
