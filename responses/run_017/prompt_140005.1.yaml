prompt: |-
  hey — I need to borrow your brain on a teaching problem rather than on the substance itself, if that's a distinction you'll let me have.

  I'm a PhD student in philosophy (rational choice / decision theory-ish) and I've been asked to run a 75-minute seminar for first-year public-policy masters students in their cost-benefit analysis course. They've had about two weeks: they can build a small decision tree, discount, do a basic NPV, and they've absorbed "sunk costs are irrelevant" as a slogan they can recite but have never seen stress-tested. The course director wants them to leave able to look at a real case of an agency continuing to fund a failing project and say something more useful than "fallacy" — without walking out thinking the slogan was a lie.

  I've ran this twice and it went wrong in two opposite directions. First time I did the core fallacy properly and then bolted the exceptions on at the end; about half the room concluded the whole thing was sophistry dressed up. Second time I led with the interesting exceptions, and they could list three reasons honoring sunk costs can be rational but couldn't tell me which one, if any, applied to a case I put in front of them afterwards. So what I want is a plan for the explanation, not the explanation.

  The substance I want them to end up able to handle — some of this is stuff from my own third chapter, so don't worry about whether it's standard, just take it as given:

  - Whether a cost is sunk isn't a property of the money; it's a property of the cost relative to a decision and to what the feasible alternatives actually are. Ninety-five percent recoverable isn't the same animal as zero percent recoverable, and "the grant can only be spent on this" changes the alternative set rather than making the money free.
  - A forward-looking theory of reasons can still have perfectly respectable things to say about past spending, because the past can be *evidence*: what my earlier self chose tells me something about what my earlier self knew, and I've lost access to most of that (the files are gone, the meetings weren't minuted, the gut feel is not reconstructible). On my "amnesia" argument, honoring the expenditure can be rational deference to a signal I can no longer read directly — and it's strongest exactly when my current evidence about the project is thin, not when it's thick. It should collapse into plain irrationality when the signal isn't there.
  - Separately: for an agent who can't literally bind their future self, treating sunk costs as reasons can be a poor man's precommitment device — you get some of the benefits of a commitment strategy you can't otherwise implement.
  - And the observability dial: whether anyone else sees the decision and updates on it (a state funder deciding about the next tranche, a developer waiting to build) is doing real work, and it's a different mechanism from either of the two above.

  Don't explain any of that to me. Tell me how to get it into their heads in order:

  1. What has to be in place before the exceptions even sound like answers to a question rather than like excuses — what depends on what, and why does that ordering specifically avoid both of the failure modes I described? I'm guessing the causal/evidential distinction has to be secured before the amnesia thing can land, but I'm not sure where to put "sunkness is relative to a decision."
  2. The one case that has to carry the whole session. I've been using a city transit agency: $40m spent on a light-rail spur, $60m still needed, present value of benefits maybe $45m, and the person who signed off has left the agency and took their reasoning with them. Fix the numbers if the ratios matter. Tell me what this case must have and — more importantly, this is where I keep getting it wrong — what it must lack. My instinct is that it has to be stripped of anyone's job being on the line and of any suggestion that the project might come good on the numbers, but I'm not sure whether that strips out too much.
  3. The misconceptions, in the order they'll actually form, and precisely where in the sequence to head each one off. The ones I expect: "sunk = already spent"; "if the past moves you at all you've erred"; conflating honoring a sunk cost with finishing the project; the idea that the reputational/observability story is cheating because the past spend is only a signal and not a reason; and then the rebound into "so it's all just evidence-talk, the fallacy doesn't exist." Give me the ones I haven't thought of too, especially any that the amnesia argument itself will manufacture.
  4. One check at the end that distinguishes genuine understanding from being able to recite the four mechanisms. I'd rather ask them what would have to be *different* for a given mechanism to stop applying than ask them whether the agency should continue.
  5. What to leave out at this level and say out loud that I'm leaving out. I don't want to open the formal signaling/commitment modeling, and I don't want to touch the psychology literature on whether the effect shows up outside convenience samples, but tell me if I'm wrong about either.

  Also: these are policy students, not philosophers — they'll want to know what to do on Monday, and I don't want to give them a license to keep funding things. If there's a place in the sequence for the "and therefore the default stays abandon" move, tell me where it goes.
reasoning: |-
  Hmm, this is a fascinating teaching challenge from a PhD student in philosophy who needs to design a seminar on sunk costs for public policy students. They've tried two approaches that failed in opposite ways - either making the exceptions seem like sophistry or leaving students unable to apply concepts to cases. Now they need a pedagogical sequence that builds understanding step-by-step.

  The core issues seem to be: establishing sunk costs as genuinely sunk before introducing exceptions, making the exceptions feel like coherent explanations rather than excuses, and preventing rebound skepticism. The student has identified several sophisticated mechanisms (evidential deference, precommitment, observability) but needs help structuring how to teach them.

  For the sequence, I'd suggest starting with a crystal-clear sunk cost case to establish the baseline fallacy. Then introduce decision-relativity - that "sunk" depends on what alternatives exist now. This sets up the key insight that sunk costs can sometimes be evidence when information is asymmetric.

  The transit case is perfect but needs tweaking: make benefits clearly below completion cost ($45m vs $60m), emphasize irrecoverability, and crucially include information loss about original rationale. Remove any suggestion of future upside or career consequences.

  Major misconceptions to address: "sunk=spent" (vs unrecoverable), "any influence=fallacy", and confusing evidence with direct reason-giving. The observability point should come last as it's most prone to misuse.

  For the check, don't ask "should they continue?" but "what would change if we knew the original reasons?" This tests if they grasp the evidential mechanism. Explicitly leave out formal modeling and psychology - focus on practical decision filters.

  The "default is abandon" message should bookend the session: start with it as rule, end with it as presumption that only strong evidence can override. Give them concrete tests like "can you articulate what your past self knew that you don't?"

  Policy students need actionable heuristics: teach them to ask "Is this truly unrecoverable? What did we know then that we've forgotten? Who's watching?" before considering continuation.
answer: |-
  Here's a battle-tested plan designed for policy students, sequenced to build understanding while avoiding both your previous pitfalls. The key is **scaffolding the "exceptions" as logical extensions of the core principle, not contradictions.**

  ### Core Pedagogical Strategy
  **"Sunk costs are irrelevant... BUT only if we hold X, Y, Z constant. Real policy knobs turn those dials."** Frame exceptions as *changing the decision context*, not violating rationality.

  ### The Sequence (75 min)

  1.  **Re-Anchoring the Core Fallacy (10 min)**
      *   **Starter:** *"City spent $40M on rail spur. Needs $60M more. Benefits worth $45M. Should they finish?"* Poll the room. Expect majority "No, sunk cost fallacy."
      *   **Demolish Naive Understanding:** "Why is the $40M irrelevant? *Show me, don't tell me.*" Force them to articulate NPV: `-60M + 45M = -15M < 0` → Abandon. "Sunk = Already Spent" is insufficient. **Key Insight:** It's irrelevant *because it cannot be recovered* and thus *doesn't change future cash flows*. **What must be true?** The $40M is *gone forever*, regardless of the decision now. This is the baseline.

  2.  **Introducing Decision-Relativity: "Sunk" Depends on Alternatives (15 min)**
      *   **Modify the Case:** "What if the $40M wasn't *just* spent on dirt? What if $35M of it bought specialized rail cars *that can be sold for $30M if we abandon now*? What's the choice *now*?"
      *   **Force Calculation:** Option 1 (Continue): `-60M + 45M = -15M`. Option 2 (Abandon + Sell): `+30M (from sale)`. **Abandon is now *better* by $45M!** "So, was the $40M sunk? *Relative to which decision?*" **Crucial Point:** "Sunk" isn't about the past spend; it's about *recoverability given the feasible actions NOW*. The alternative set changed (Abandon + Sell is now possible).
      *   **Misconception Head-Off:** "Sunk = Already Spent" is wrong. **It's "Costs Unavoidable & Unrecoverable GIVEN the Alternatives Being Considered *Now*."** This is foundational for everything else.

  3.  **The Amnesia Argument: Past Spend as Evidence (25 min - THE HEART)**
      *   **Introduce the Core Transit Case:** "$40M spent. $60M needed. $45M Benefits. **Crucial Mods:** The $40M is *truly sunk* (no resale). The *person who championed/approved it*, with deep expertise/knowledge of site surveys/political deals/etc., has left. **No records exist** explaining *why* they thought it was viable initially. Your current team has only basic feasibility reports showing $45M benefits. *Should you continue?*" Poll again. Expect more uncertainty.
      *   **The Argument:**
          1.  *"What do we know?* My past self (the agency) chose to spend $40M *expecting net benefits*. They had *some* reason. I lack that reason/data/gut feel."
          2.  *"Is their choice informative?* Yes! They thought `Expected Benefits > $40M + Expected Completion Cost` *at that time*. They saw something I don't."
          3.  *"What does it imply for the $60M decision?* Their action signals that *their estimate* of `Benefits - Remaining Cost` was *positive enough* to justify the initial $40M risk. Maybe they knew benefits were higher? Or completion cheaper?"
          4.  *"Is this a 'reason' or 'evidence'?* **Evidence!** The past spend itself doesn't magically create value. It tells me my past self saw value I might be missing. *Deferring* to that signal *can* be rational when my *current* information is thin."
          5.  *"When does this collapse?"* **Stress Test:** "What if we *do* have perfect current data showing $45M benefits and rock-solid $60M cost? Does the past spend matter as evidence *then*?" (No, the signal is swamped by current evidence). "What if we find emails showing the past boss was bribed?" (Signal corrupted, irrelevant).
      *   **Misconception Head-Offs:**
          *   **"Any influence = fallacy?"** No. Using the past spend *as evidence* about uncertainty isn't fallacious; ignoring current NPV based *only* on emotional attachment is.
          *   **"Conflating with finishing?"** Emphasize: "Finishing *might* be the rational choice *if* the evidence from the past spend updates our beliefs sufficiently about benefits/costs." The decision is *still* forward-looking NPV based on best *current* beliefs, which now incorporate the signal.
          *   **"Rebound: So fallacy doesn't exist?"** "No! The fallacy is *treating the spent money itself as a cost in the current decision*. The amnesia argument *doesn't do that*. It uses the *fact of the past decision* as data to reduce uncertainty about *future* flows. The $40M cash *is still irrelevant*; the *information* it signals is relevant."

  4.  **Quick Hits: Precommitment & Observability (10 min)**
      *   **Precommitment (Poor Man's):** "Imagine a *different* case: A startup CEO bootstrapping a risky tech project. They know if they quit early, investors will *never* trust them again. Spending $X might signal commitment, making it harder to quit later, *forcing* them to see it through – which might be the only way a positive-NPV-but-risky project gets done. Is this rational? *Sometimes*, if the commitment device creates value. But it's messy/brittle." **Link:** This is about influencing *future* actions/expectations, not the *current* NPV per se. *Not* the main mechanism for public agencies.
      *   **Observability (Reputational):** "Back to transit: What if a *state funding board* is watching? If you abandon, they might cut *all* future funding, thinking you're unreliable. Your decision signals competence. Continuing *might* be rational to protect future funding streams, *even if* this project's NPV is slightly negative. **Key:** This is about *how your action now affects others' future actions*, changing the *actual future costs/benefits* (e.g., losing $100M in future grants). It's a *real future cost* of abandoning now." **Distinguish:** This isn't evidence about *this project's* value; it's about agency reputation affecting *other* projects.

  5.  **Synthesis, Default Stance, & "What to Do Monday" (10 min)**
      *   **Synthesis:** "The core rule holds: *Never count sunk cashflows in your NPV.* But real decisions involve:
          1.  Defining the *real* alternatives and recoverable costs (Decision-Relativity).
          2.  Acknowledging uncertainty & using *all* evidence, *including the signal from past choices* when info is lost (Amnesia).
          3.  Considering strategic effects on future opportunities (Observability/Reputation).
          4.  (Rarely) Using spend as a crude commitment device (Precommitment)."
      *   **"Therefore, Default Stays Abandon":** "**Unless** you can *specifically articulate* and *quantify/justify* one of these mechanisms altering the *forward-looking* NPV calculation: 'We continue *only if*...'"
      *   **Monday Checklist (Policy Heuristics):**
          1.  **Recoverability Check:** "Is *any* of the past spend recoverable *if we quit now*?" (Fix the alternatives).
          2.  **Amnesia Check:** "Do we fully understand *why* the past decision was made? Is there critical lost knowledge? What signal does continuing/abandoning send *about our assessment of the project's true value*?" (Requires articulating the uncertainty gap).
          3.  **Observability Check:** "Who is watching this decision? Could quitting *realistically* cause significant future costs (e.g., lost funding, partnerships) that exceed the loss on this project?" (Must be concrete and material).
          4.  **NPV Check (Final):** "Given answers to 1-3, what is the *actual* forward-looking NPV of continuing vs. the best alternative? Include any *new* costs/benefits identified in steps 1-3."
      *   **"If you can't clearly pass one of checks 1-3 AND the NPV still favors abandonment, STOP. You are committing the fallacy."**

  6.  **Your Check: Distinguishing Understanding (5 min)**
      *   **Don't Ask:** "Should the agency continue?" (Leads to recitation).
      *   **DO ASK:** **"Suppose we discover perfect minutes from all the original meetings proving the past decision was based solely on a now-debunked traffic model, not on any hidden info. *Which mechanism(s) does this break? How does it change the analysis?*"**
      *   **Why it works:** Forces them to identify *which specific exception* relied on the lost info signal (Amnesia) and how removing it collapses back to the baseline NPV calculation. Shows they grasp the *mechanism's dependency*.

  ### What the Transit Case MUST Have & Lack
  *   **MUST HAVE:**
      *   **Truly Sunk Costs:** $40M unrecoverable *under any alternative* (no resale, grants non-transferable).
      *   **Clear Negative Forward NPV:** $60M Cost > $45M Benefits. No ambiguity or hope value.
      *   **Significant Information Loss:** Champion left, *no records* of *why* it was approved. Current team has *only standard, thin data*.
      *   **Plausible Signal Value:** The project *could* have had higher benefits/lower costs *if* the initial assessment was based on valid but lost info (e.g., unique ridership study, geological survey showing cheaper tunneling).
  *   **MUST LACK:**
      *   **Recoverability:** No selling assets.
      *   **Job Threats:** Remove "heads will roll" – distracts, feels like an excuse.
      *   **Psychological Sunk Cost Triggers:** Avoid descriptions of pride, ego, embarrassment.
      *   **Observability/Reputation Elements (Initially):** No mention of funders watching *until* that mechanism is introduced later. Keep it pure for the amnesia argument.
      *   **Plausible Upside Based on *Current* Info:** Don't hint that *their* analysis might be wrong or that benefits could magically increase. The *only* potential upside is via the *signal* from the past decision.

  ### Misconceptions You Might Have Missed (Especially from Amnesia)
  1.  **"This justifies *any* past spend":** Counter: Only if there was *actual lost expertise/info*. If the past decision was clearly documented as a political boondoggle or based on known-false data, the signal is worthless/corrupt. The *quality* and *plausibility* of the lost info matter.
  2.  **"My gut feel now = Lost gut feel then":** Dangerous conflation. Stress: You *don't* have access to the *past* gut feel/reasoning. You only have the *fact* they spent $40M. Your *current* uncertainty/gut is different evidence.
  3.  **"We must finish to 'honor' the spend":** Reinforce: The signal is about *project value*, not honoring a debt. Finishing is only rational if the updated beliefs make NPV positive. Abandoning *can also* be rational deference if new evidence *overwhelms* the signal (e.g., major cost overrun discovered).
  4.  **"This makes the fallacy useless/unactionable":** Counter: The fallacy identifies the *error of including sunk cashflows directly*. This framework gives *specific, testable criteria* for when *other factors* (evidence, strategy) might rationally alter the decision *away* from simple abandonment. It makes the rule *more* actionable, not less.

  ### What to Leave Out & State Explicitly
  *   **Formal Modeling:** "We're focusing on the conceptual logic and practical application. We won't be building signaling models or game trees today."
  *   **Psychology Literature:** "We're focusing on *rational* decision-making frameworks used in policy analysis, not the cognitive psychology of why individuals *actually* fall prey to the fallacy in lab settings."
  *   **Edge Cases & Nuances:** "There are deeper philosophical debates (e.g., identity over time affecting 'past selves') and complex strategic interactions we're setting aside to focus on the core mechanisms policy analysts encounter most often."

  ### Why This Order Avoids Both Failure Modes
  1.  **Secures Core First:** Starts by *deepening* understanding of the fallacy (recoverability, decision-relativity), making it *harder* to dismiss later as sophistry. Exceptions are built *on top of* a robust core.
  2.  **Integrates, Doesn't Bolt:** The Amnesia argument is presented as *using the core principle correctly* (only forward-looking flows) under uncertainty, using the past action *as data*, not as a cost. It's a natural extension, not a contradiction.
  3.  **Sequences Complexity:** Decision-relativity (less controversial) sets the stage. Amnesia is the primary robust exception. Precommitment/Observability are presented as *distinct*, rarer mechanisms.
  4.  **"Default Stays Abandon" is Central:** This mantra is woven throughout, especially in the synthesis and Monday checklist. Exceptions require *positive justification*, reinforcing the rule's primacy.
  5.  **Focus on Mechanism Dependencies:** The final check question specifically targets understanding of *how* the exceptions work and what breaks them.

  This plan leverages policy students' desire for actionable frameworks ("Monday Checklist") while building the conceptual sophistication needed to avoid both naive dismissal and confused application. Good luck!
