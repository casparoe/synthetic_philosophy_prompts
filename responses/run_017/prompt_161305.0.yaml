  ### 3. Test Cases

  #### Test Case 1: Modified Protocol (Heads: 1 Mon; Tails: 1 Mon + 2 Tue)
  - **Thirder (Size-Biased)**:  
    - Sample space: 4 awakening-events (Heads-Mon, Tails-Mon, Tails-Tue-A, Tails-Tue-B), each P = 1/4.  
    - Unconditional P(Heads) = P(Heads-Mon) = 1/4.  
    - Conditional on Monday: Only Heads-Mon and Tails-Mon possible. P(Heads | Mon) = (1/4) / (1/4 + 1/4) = 1/2.  
    - **Generalizes mechanically**: Awakening-level design applied directly.  

  - **Halfer (Run-Level)**:  
    - Unconditional P(Heads) = 1/2 (per-run).  
    - Conditional on Monday: Use Bayes’ theorem. Let M = "today is Monday".  
      - P(M | Heads) = 1 (only Mon in Heads run).  
      - P(M | Tails) = 1/3 (1 Mon out of 3 awakenings in Tails run).  
      - P(Heads | M) = [P(M | Heads) P(Heads)] / [P(M | Heads)P(Heads) + P(M | Tails)P(Tails)] = [1 * 1/2] / [1*1/2 + (1/3)*(1/2)] = (1/2) / (2/3) = 3/4.  
    - **Requires new commitment**: Halfer must now model awakenings as stochastic within runs, abandoning pure run-level design.  

  - **Arithmetic and Implications**:  
    - Halfer: Unconditional 1/2, conditional 3/4.  
    - Thirder: Unconditional 1/4, conditional 1/2.  
    - **Shows**: Thirder generalizes mechanically (rule); halfer requires ad hoc adjustment (verdict for original case). Halfer’s update on "Monday" exposes inconsistency in ignoring awakenings unconditionally.  

  #### Test Case 2: Original Protocol, Varying Scoring
  - **Design A (score all awakenings)**:  
    - Fraction of scored reports from Heads runs: #Heads / (#Heads + #Tails) = (1/2) / (1/2 + 2/2) = 1/3.  
    - Thirder credence (1/3) is calibrated.  
  - **Design B (score one random awakening per run)**:  
    - Inclusion probabilities: Heads awakening π = 1; Tails awakening π = 1/2.  
    - Fraction of scored reports from Heads runs: P(scored=Heads) = P(Heads run) * 1 + P(Tails run) * 0 = 1/2.  
    - Halfer credence (1/2) is calibrated.  
  - **Implications**:  
    - Calibration is design-dependent. Neither credence is universally "correct"; it depends on the scoring rule.  
    - **Defuses calibration argument**: Choice of scoring design (A or B) carries the philosophical weight. If Beauty is scored per-run (B), 1/2 is calibrated; per-awakening (A), 1/3 is calibrated.  

