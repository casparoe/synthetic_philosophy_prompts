  ### 2. Residue Report

  #### Clean Translation
  - **Halfer**: Run-level design, no update on "awake," per-run estimand all translate cleanly.  
  - **Thirder**: Awakening-level design, size-biased sampling, per-awakening estimand, and weighting for run-level recovery translate cleanly.  

  #### Translation Under Distortion/Renaming
  - **Evidence of Being Awake**:  
    - Halfer: "Awake now" is not an event with a likelihood (P=1 always). Clean for halfer, but assumes run-level design axiomatically.  
    - Thirder: "Awake now" is a random awakening-event with likelihood P(awake | C) = 1 if C=Heads, 2 if C=Tails (unnormalized). Distorted because "now" isn’t a random variable; it’s renamed as a sampling event.  
  - **Long-Run Frequencies**:  
    - Frequencies are design-relative. Halfer's 1/2 (per-run) vs. thirder's 1/3 (per-awakening) are both "correct" for their designs. Translation exposes the design-dependence but doesn’t resolve which design is appropriate.  
  - **Synchronic Coherence** (same answer at every awakening):  
    - Both positions satisfy coherence, but the framework has no native concept for it. Translated as a constraint on the model: credence must be constant across awakening-events. This is a normative add-on, not derived from the design.  

  #### Untranslatable Elements
  - **"Now" as Indexical**: The de se nature of "current awakening" isn’t captured. Sampling design proxies for it (thirder), but the subjective "I" is replaced by objective inclusion probabilities.  
  - **Normative Justification for Design**: Why privilege run-level vs. awakening-level? Vocabulary assumes the design is given; it doesn’t provide grounds to choose.  
  - **Exchangeability**:  
    - From Beauty’s perspective, awakening-events are exchangeable only within a coin outcome (e.g., Tails-Mon and Tails-Tue are identical). Thirder assumes all three are exchangeable; halfer rejects this. Survey sampling doesn’t justify exchangeability—it’s imposed.  

