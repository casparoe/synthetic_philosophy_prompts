    - C: Coin outcome.  
    - D: Day (D ∈ {Mon, Tue}), but only defined given C.  
  - **Sampling Design**: Design is **awakening-level** (size-biased). Units are awakening-events, sampled uniformly. Tails runs contribute twice as many units.  
  - **Inclusion Probabilities**: Each awakening-event has π = 1/3. Runs have unequal representation: Heads run included if Heads-Mon sampled (π = 1/3), Tails run included if Tails-Mon or Tails-Tue sampled (π = 2/3).  
  - **Weighting Scheme**: To recover run-level estimand, use inverse-probability weights: w = 1/π_run. For Heads, w = 1/(1/3) = 3; for Tails, w = 1/(2/3) = 1.5 per awakening.  
  - **Estimand**: **Per-awakening relative frequency** of Heads. P(C = Heads | awakening) = 1/3.  
  - **Target of Credence**: Per-awakening relative frequency.  

  #### Key Differences
  - **Estimand Mismatch**: Halfers target per-run probability; thirders target per-awakening frequency. They are not estimating the same quantity.  
  - **Design Commitment**: Halfers use run-level design; thirders use size-biased awakening-level design.  

