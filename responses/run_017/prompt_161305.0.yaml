  ### 4. Verdict on the Residue

  #### Gaps in Vocabulary
  - **De Se/Indexical Content**: The "now" in Beauty’s question requires a subjective perspective not captured by objective sample spaces. Thirder’s sampling design approximates this but doesn’t justify why Beauty should "randomize" over awakening-events.  
  - **Normative Design Choice**: Vocabulary assumes a design, but doesn’t specify how to choose it. Halfers prioritize the coin toss (causal origin); thirders prioritize the awakening (epistemic context). This is pre-statistical.  
  - **Synchronic Coherence**: The demand for a single credence across stages isn’t native to sampling theory. It’s a normative constraint on personal identity over time, imported from decision theory.  

  #### Substantiveness of the Dispute
  - **Not Merely Verbal, But Partly Normative**:  
    - Both positions can be made consistent within their designs (as shown in Test Case 2). The core dispute is about **which estimand/loss function is relevant**:  
      - Halfer: Beauty should care about per-run truth (e.g., if scored per-run).  
      - Thirder: Beauty should care about per-awakening truth (e.g., if scored per-awakening).  
    - This is normative: What should Beauty’s credence track? The coin’s probability, or her subjective embedding in the experiment?  
  - **Your Suspicion Tested**:  
    - You suspect the no-update argument assumes run-level design. **Confirmed**: Halfer’s "no update" only works if "awake" has P=1 in the run-level design. In awakening-level design, "awake now" has a likelihood ratio (1:2 for Heads:Tails), forcing update.  
    - **Breakdown**: The halfer position breaks when forced to condition on indexical information (e.g., "Monday" in Test Case 1). It implicitly relies on ignoring awakenings as sampling units.  

  #### Conclusion
  The dispute reduces to a **normative choice of sampling design**, which determines the estimand. Vocabulary gaps exist for indexical content and design justification. Once designs are explicit, the "evidence" debate dissolves into:  
  - Halfer: Commit to run-level design (estimand = P(Heads)).  
  - Thirder: Commit to awakening-level design (estimand = P(Heads | awakening)).  
  The residue is normative: Why should Beauty adopt one design over the other? This depends on external factors (e.g., scoring rule, causal structure), not evidence alone.  
  **Recommendation**: Your size-biased-sampling reading is valid but incomplete—it doesn’t justify why the awakening-level design is "correct." Address the normative layer: *Should* Beauty reason as if randomly sampled from awakening-events?
