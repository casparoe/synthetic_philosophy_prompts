prompt: |-
  I work as a lexicographer on a documentation project for a language with no written tradition, and one of my field habits has started to look philosophically loaded. When I record a word for a natural substance — a plant, a mineral, a kind of water — I note what the speaker pointed at, or what sample I had in hand, and I treat that as fixing what the word means. In this field the samples are rarely clean and the histories are rarely short, and I keep running into the following shape of case. I want to know whether it has a name, what the nearest established concepts are, and how, exactly, my cases differ from each of them.

  First case. A word I have been recording, call it *mbula*, was, as best I can reconstruct, first applied by a guide to the contents of a spring that dried up two generations ago. Later analysis of the spring's sediment suggests its water was chemically unlike anything else in the region. Everyone who has used the word since has applied it to the ordinary local water, which they take to be the same stuff, and no one alive has ever encountered the spring. Does the word mean the spring's stuff, the ordinary stuff, or something covering both — and what should I write in the dictionary entry?

  Second case. In a neighbouring community the wells have, over roughly forty years, come to draw mostly on a different aquifer whose water is chemically distinct, in a way that was invisible to the speakers at the time and is still invisible to them without instruments. Speakers say the same sentences, mean what they meant, and would produce the same description if asked to specify the reference without using the word. Is there a point at which the word starts meaning the new stuff? Is there a threshold, and if so is it sharp, vague, or simply not a fact of the matter?

  Third case. In a third settlement the samples appear to have always been a fairly stable mixture of two chemically distinct liquids, with no fact about which the speakers encountered first, most often, or most saliently. Here I do not even know how to state the question. Is the meaning unsettled, is it settled on something disjunctive or vague, or does it get settled by some property of the liquids themselves rather than by the speakers' relations to them?

  A variant that may or may not be the same phenomenon: a laboratory introduces a term for a compound, and it emerges a decade later that the original synthesis contained a rare impurity, while every subsequent sample has been pure.

  What I have read about this general area — a popular chapter built around a thought experiment involving two planets with different liquids — seems to me to be about a different configuration: two communities, two environments, one speaker each. Mine is about a single community whose environment changes underneath it, about how much change is required before meaning changes, and about mixtures where no single sample dominates. So I would not be satisfied with being told that this is just that thought experiment again. Please tell me:

  - Whether the pattern I have described — a question about the resolution, or grain size, of whatever relation fixes a word's meaning — has an established name, and whether my four cases are one phenomenon or several.
  - Which established concepts fit each case best, and precisely where the fit breaks down. I would especially like the differences marked off from: ordinary vagueness, ordinary ambiguity, straightforward change of meaning over time, reference failure for empty terms, and the case where speakers defer to experts they cannot identify themselves.
  - What the main families of view would say about my cases, argued out rather than merely labelled — in particular whether any of them has the resources to answer the threshold question in case two and the mixture question in case three, or whether they all leave it underdetermined.
  - Whether the phenomenon has consequences for what speakers can know about the meanings of their own words, given that in my cases nothing changes inside the speakers at all.
  - If nothing established fits, coin a term, define it, and give me its boundary cases: what would clearly count as an instance, what would clearly not, and what sits on the edge.

  Two practical constraints. I am at a field station with no library access, so please argue the positions out instead of pointing me at papers; a single label or name that I could chase up in a year is welcome, but a list of things to read is useless to me. And please say how confident you are in each substantive thing you claim, on whatever scale you find natural, and single out the one point you are least sure of — particularly anything turning on whether this specific question has actually been addressed or whether you are extrapolating from neighbouring cases.
reasoning: |-
  Okay, the user is a lexicographer documenting a language without a written tradition. They're dealing with a fascinating problem involving how the meaning of words for natural substances changes when the environment shifts or when samples are impure. They've presented three cases and a lab variant, all revolving around whether the word's reference changes when the substance it originally named is no longer present or is mixed.

  First, I need to understand their core issue. It seems to be about the resolution or grain size of reference determination—how much environmental change can occur before the word's meaning shifts, and how mixtures affect reference. They also want to know if this phenomenon has a name, how it differs from other concepts like vagueness or ambiguity, and what philosophical theories say about it.

  Looking at the cases: Mbula originally referred to a unique spring's water, but now refers to ordinary water. The speakers aren't aware of the change. The second case involves a gradual shift in aquifer sources, invisible to speakers. The third is a stable mixture of two substances. The lab variant has impurities in the initial sample.

  The user mentioned reading about a two-planet thought experiment but clarifies their situation is different—it's one community with environmental change over time. They want to avoid conflating it with that scenario.

  Key questions they have:
  - Is there a term for this phenomenon?
  - How do established concepts (vagueness, ambiguity, meaning change) apply or not?
  - What do philosophical theories say about thresholds in case 2 and mixtures in case 3?
  - Implications for speakers' knowledge of their own word meanings.
  - If no term exists, suggest a new one with boundaries.

  I recall philosophical debates on reference, especially with natural kind terms. Kripke and Putnam's causal theory of reference might be relevant. In their model, a term refers via an initial baptism, and later uses link back to that event. But Putnam's "Twin Earth" involves different communities, not environmental changes over time. This seems different.

  For case one (Mbula), if the original sample is lost and current speakers refer to ordinary water, does "mbula" still mean the original substance? The causal theory might say yes, but speakers use it for something else, creating a disconnect. This resembles reference shift without speakers realizing it.

  Case two: Gradual aquifer change. When does the reference shift? Is there a threshold? Theories might not specify—perhaps it's indeterminate. Externalist views might say the underlying substance determines reference, so when the aquifer shifts, the reference changes, but speakers don't know. But when does that happen? After 50% shift? This needs more exploration.

  Case three: Stable mixture. Is the reference to the mixture, or each component? If speakers don't distinguish the components, maybe it's a new kind. But without a "baptism," how is it fixed? The causal chain might point to samples, which are mixtures, so reference could be to the mixture itself.

  The lab case is clearer—initial sample had impurities, but later uses are pure. Similar issues: does the term refer to the pure compound or the impure original?

  The user wants differences from other concepts marked. For vagueness: Vagueness is about borderline cases (e.g., "heap"), but here it's not about unclear boundaries—it's about whether the reference has shifted due to external changes. Ambiguity involves multiple meanings, but speakers aren't aware of multiple substances. Meaning change over time is usually conscious, but here it's unnoticed. Reference failure is when a term has no referent, but here there's always something. Deference to experts: Speakers might defer, but they can't identify experts, so it's different.

  Theories: Causal-historical theory (Kripke/Putnam) would say reference is fixed at baptism. For Mbula, it refers to the original spring. For the aquifer, it still refers to the original water until a new baptism occurs. But in practice, speakers apply it to the new water. This creates a problem—what they refer to vs. what the term "actually" refers to might differ. This impacts speaker knowledge; they think they know, but externally, the reference might have shifted.

  Descriptivist theories might say the reference is determined by associated descriptions. For Mbula, if descriptions match the current water, it refers to that. But original users described the unique water, which doesn't match. So conflict arises.

  For thresholds in case two, theories don't specify. It might be vague or indeterminate. Mixtures in case three: Causal theory might say the baptism fixes the reference to whatever the sample was, so the mixture. Descriptivism might focus on properties speakers associate.

  Possible new term: "Referential drift" or "substrate shift." Defining it as cases where the physical substrate changes without speakers' awareness, leading to ambiguity in reference fixation.

  Boundaries: Clear cases—environmental change without speaker awareness. Not: conscious meaning change, temporary borrowing. Edge cases: gradual changes where awareness is partial.

  Confidence levels: High on distinguishing from Twin Earth, as the user emphasized single community change. Less sure about thresholds—philosophy may not have clear answers, so underdetermined. For mixtures, perhaps causal theory can handle by fixing reference to the sample.

  Practical advice: For the dictionary, note the history, current use, and ambiguity. Use disjunctive entries if needed.
answer: |-
  Your cases represent a fascinating and under-discussed phenomenon at the intersection of philosophy of language, semantics, and externalism. I'll address your queries systematically, arguing from established positions while noting where they fail to resolve your cases. I'm highly confident (9/10) in the core analysis but less so (6/10) about resolving thresholds in Case 2—philosophical theories diverge sharply here.

  ### 1. **Naming the Phenomenon and Its Unity**  
     The pattern you describe lacks a single established term, but it's best characterized as **referential drift under environmental flux**. It combines:  
     - **Causal-historical theories of reference** (Kripke/Putnam): Reference is fixed by an initial "baptism" event.  
     - **Metasemantic externalism**: Meaning depends partly on external facts (e.g., substance composition), not just speaker intentions.  
     - **Environmental instability**: The physical world changes while linguistic practices remain stable.  

     Your cases are **one unified phenomenon** (confidence: 8/10): all involve shifts in the *extension* (the set of things a word refers to) due to environmental changes, unbeknownst to speakers, where the *intension* (speaker-associated criteria) stays constant. The lab variant is identical in structure—impurity is an "environmental" factor here.  

     **Boundaries**:  
     - *Clear instances*: (1) A term for a natural kind with a fixed baptism, where the physical substrate changes gradually/invisibly; (2) Mixtures where speakers treat samples as homogeneous.  
     - *Clear non-instances*: (1) Conscious redefinition (e.g., "mouse" for a computer device); (2) Borrowed terms (e.g., "kangaroo" applied to a similar animal elsewhere).  
     - *Edge cases*: Slow environmental change with partial speaker awareness (e.g., fishermen noting fish stocks evolving but using the same term).

  ### 2. **Fitting Established Concepts (and Where They Break)**  
  I'll contrast your cases with adjacent concepts, using your examples:  

  | Concept             | Fit for Your Cases                                                                 | Breakdown Point                                                                 |
  |---------------------|------------------------------------------------------------------------------------|---------------------------------------------------------------------------------|
  | **Ordinary vagueness** (e.g., "tall") | Case 3 *seems* vague—speakers might accept varied mixtures as *mbula*.             | Vagueness concerns borderline cases *within a category*. Your cases involve *category shift*: in Case 1, *mbula*’s original referent no longer exists, yet speakers apply it confidently. |
  | **Ambiguity** (e.g., "bank")          | Case 3 might appear ambiguous (two liquids).                                       | Ambiguity requires multiple *known* meanings. Speakers here have a single, unified concept—they don’t recognize distinct substances. |
  | **Meaning change over time** (e.g., "gay" = joyful → homosexual) | Superficially fits Case 1 (referent changed). | Standard meaning change involves intentional/cultural shifts. Here, speakers *deny* any change and maintain identical usage. |
  | **Reference failure** (e.g., "phlogiston") | Case 1 *could* fail if the original *mbula* is gone.                              | Unlike "phlogiston," speakers successfully refer to *something* (ordinary water) and believe it’s the original. |
  | **Deference to experts** (e.g., Putnam’s "elm"/"beech") | Cases 1–2 involve ignorance of true nature. | Deference requires identifiable experts. Here, speakers don’t know experts exist (original guides are dead/unavailable). |

  **Crucial difference from Twin Earth**: Twin Earth (Putnam) tests how *simultaneous* differences fix reference (two planets, two communities). Your cases are *diachronic* (one community, changing world), making speaker knowledge and thresholds central—issues Twin Earth ignores.

  ### 3. **Theoretical Views on Thresholds and Mixtures**  
  Key theories and their implications:  

  - **Causal-Historical Theory (Kripke/Putnam)**:  
    - *Core claim*: Reference is fixed at baptism. Later uses refer to whatever shares the "same kind" as the original sample.  
    - *Case 1*: *Mbula* refers only to the original spring’s water (now extinct). Current uses are *mistaken* (confidence: 9/10).  
    - *Case 2*: Reference never changes—it always points to the original aquifer’s water. Thresholds don’t apply; meaning is "stuck" in the past (7/10).  
    - *Case 3*: Refers to the mixture present at baptism (if traceable) or to any sample sharing its "hidden structure" (vague; 6/10).  
    - *Weakness*: Cannot handle gradual change (Case 2) or mixtures (Case 3) without positing rampant speaker error.  

  - **Descriptivist Theory (Frege/Russell)**:  
    - *Core claim*: Reference is fixed by speaker-associated descriptions (e.g., "water from our wells").  
    - *Case 1*: *Mbula* means "water from our area," now referring to ordinary water (8/10).  
    - *Case 2*: Reference shifts when speakers’ descriptions (e.g., "well water") apply better to the new aquifer. Threshold is *vague* (e.g., when >50% of wells draw new water) (5/10—arbitrary).  
    - *Case 3*: Refers to whatever fits the description (e.g., "clear, drinkable liquid from here"), covering both liquids (7/10).  
    - *Weakness*: Ignores historical ties (e.g., in Case 1, original descriptions specified unique properties).  

  - **Hybrid/Internalist Views (Chalmers, Jackson)**:  
    - *Core claim*: Reference depends on idealized speaker judgments (e.g., "what *would* they call *mbula* in all possible worlds?").  
    - *Case 2*: Threshold is *not sharp*—depends on how speakers *would* react if informed (6/10; circular).  
    - *Case 3*: Meaning is "settled" by dominant properties in speakers’ conceptions (e.g., taste, color), not chemistry (7/10).  
    - *Weakness*: Fails for Cases 1–2 if speakers are wrong about hidden properties.  

  **Verdict**:  
  - **Thresholds (Case 2)**: No theory gives a determinate answer. Causal-historial denies thresholds; descriptivism makes them vague; hybrid views defer to unknowable counterfactuals. **Underdetermined by theory** (confidence: 8/10).  
  - **Mixtures (Case 3)**: Causal-historical and descriptivist views *can* answer but conflict: the former favors the actual sample, the latter speaker concepts. **No consensus** (7/10).  

  ### 4. **Consequences for Speaker Knowledge**  
  Your cases challenge the **transparency of meaning** (conf: 9/10):  
  - Speakers *cannot* know the exact meaning of their words because it depends on:  
    - **Historical facts they ignore** (e.g., *mbula*’s origin).  
    - **External properties they can’t access** (e.g., aquifer chemistry).  
  - This is a radical **externalist conclusion**: Meaning is "in the world," not in speakers’ heads. In Case 2, speakers might utter "This is *mbula*" with confidence while being semantically wrong (if causal-historical is correct).  

  ### 5. **Term Proposal: "Substrate Drift"**  
  If existing terms feel inadequate, I propose:  
  - **Substrate drift**: When a term’s reference shifts due to unperceived changes in the physical substrate, while speaker usage remains constant.  
  - **Defining features**:  
    1. Diachronic environmental flux.  
    2. Speaker ignorance of the shift.  
    3. Conflict between historical fixation and current application.  
  - **Boundaries**:  
    - *Clear cases*: Your four examples; e.g., a term for "soil" in land undergoing undetected erosion.  
    - *Clear non-cases*: Meaning change from technological innovation (e.g., "phone" for smartphones).  
    - *Edge cases*: Gradual climate change altering a plant species, where older speakers notice subtle differences but younger ones do not.  

  ### Practical Lexicography Advice  
  For your dictionary (confidence: 9/10 for this approach):  
  - **Case 1**: Note both uses: "*Mbula*: (1) (Hist.) Unique mineral water from [spring]; (2) (Mod.) General term for local water."  
  - **Case 2**: Describe the shift neutrally: "Traditionally referred to water from [original aquifer]; now often sourced from [new aquifer]."  
  - **Case 3**: Define extensionally: "Term for the composite liquid found in [location], typically containing [substances A and B]."  
  - **Lab variant**: Cite the original study and note the impurity issue.  

  **Least Confident Point** (5/10): Whether theories can resolve the threshold in Case 2. I suspect this is *metasemantically underdetermined*—no fact of the matter—but this is extrapolation from debates on vagueness.  

  This phenomenon reveals language as a living, world-anchored system, where meaning can "drift" beneath speakers’ feet. Your fieldwork captures a profound puzzle: how much of language is held in place by the world itself?
