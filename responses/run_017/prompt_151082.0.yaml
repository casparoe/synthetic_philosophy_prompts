  ## PrudentMarkets™ Client Onboarding: Frequently Asked Questions  

  **Welcome to PrudentMarkets. Our platform optimizes market integrity by eliminating speculative inefficiencies, ensuring trades are exclusively driven by non-epistemic motivations. The following addresses common client inquiries regarding our unique compliance framework.**  

  **1. Q: Why must I complete the "Non-Epistemic Motive Declaration Form" before placing an order?**  
  A: PrudentMarkets operates under the *Zero Speculative Gain Principle*. Trading motivated purely by divergent probability assessments violates this principle. The Form certifies that your order arises from:  
  - Hedging pre-existing exposures (Section A),  
  - Differential risk tolerance (Section B, with actuarial proof),  
  - Liquidity/consumption timing needs (Section C, third-party verified), or  
  - Involuntary portfolio rebalancing (Section D, e.g., court order).  
  *Speculative intent voids trade execution and incurs a Regulatory Clarity Fee.*  

  **2. Q: What is the "Prior Reconciliation Agreement" (PRA)?**  
  A: The PRA contractually binds all clients to a *Shared Prior Consensus*. Should Bayesian posteriors diverge post-trade (e.g., Client A assigns 70% probability to Event X, Client B assigns 30%), our Epistemic Arbitration Desk initiates mandatory posterior exchange. Clients recursively share conditioning information until posteriors converge (minimum 3 rounds; $475/round). As our Chief Epistemology Officer, Dr. Eudora Vexley, states:  
  > *"Disagreement is merely incomplete common knowledge. Our iterative reconciliation transforms irrational discord into mutual enlightenment—billable by the hour."*  

  **3. Q: Why does my order sometimes match against a "Registered Noise Participant" (RNP)?**  
  A: Under strict common-prior rationality, mutually beneficial trade is measure-zero probable. RNPs provide essential market depth by furnishing *non-informational trade motives*. All RNPs are:  
  - Vetted for material irrationality (e.g., "Divorcee Class" RNPs liquidate assets amid emotional distress),  
  - Contractually obligated to trade for exogenous reasons (e.g., margin calls, sudden alpaca farming ventures),  
  - Prohibited from updating beliefs pre-trade (per Annex 7.2 of the PRA).  
  *Note: RNPs wear mauve badges in our trading lounge.*  

  **4. Q: How do you justify transaction fees if no trade is mutually beneficial?**  
  A: PrudentMarkets fees ($2.75/trade + PRA rounds) cover the operational cost of *establishing the absence of gain*. As detailed in our Fee Transparency Supplement:  
  > *"Charges reflect the service of rigorously verifying that your counterparty’s motive is orthogonal to information advantages, thereby preserving Pareto-inferiority. You pay for certainty, not profit."*  

  **5. Q: Your marketing claims "Prices aggregate all available information." Isn’t this inconsistent with banning speculative trades?**  
  A: This statement is asterisked. Per footnote 12(b):  
  > *"*‘Aggregation’ denotes the theoretical asymptotic limit under common knowledge of rationality. PrudentMarkets does not assert informational efficiency, only that prices reflect permitted motives. Speculation-free price discovery may differ from conventional paradigms.**"*  
  Marketing has been cited for三次 misleading implications.  

  **6. Q: If rational clients with shared priors shouldn’t trade, why does PrudentMarkets exist?**  
  A: Excellent question. Internal Audit Memo #441 concluded that our platform’s *continued operation* materially implies clients lack common priors or rationality. Resolution 88(c) thus reclassifies PrudentMarkets as a *Non-Trading Entity* under Section 9(δ) of the PRA. Per our charter:  
  > *"We do not facilitate trade. We provide a venue for motive-certified asset reallocations unrelated to belief updates. Any perception of ‘trading’ is incidental."*  

  **7. Q: Critics call your model "experimentally irrelevant." How do you respond?**  
  A: We acknowledge concerns like those of behavioral economist Prof. Finn Keppler:  
  > *"Banning disagreement-driven trade eviscerates price discovery. The no-trade theorem relies on common knowledge—a cognitive absurdity. Markets need fools, not epistemologists."*  
  Our reply: PrudentMarkets serves a niche of pure *motive-compliant* reallocation. We make no claims regarding broader market dynamics. Keppler’s critique is noted and forwarded to our Epistemic Arbitration Desk for reconciliation ($475).  

  **8. Q: Why was my order canceled after my counterparty inquired about my rationale?**  
  A: This is the *Groucho Effect*. Under the PRA, a trade offer itself may signal private information, rendering common knowledge impossible. If a client questions your motive, our system assumes:  
  (i) They suspect speculative intent (violating Sec. 2.1),  
  (ii) This suspicion creates asymmetric information (violating the PRA),  
  (iii) Thus, no trade can occur.  
  *Result: Auto-cancellation + $50 Epistemic Contagion Surcharge.*  

  ---

  **IMPORTANT NOTICE:** PrudentMarkets™ operates under the Prudent No-Trade Compliance Framework™, a patented system enforcing the theoretical implications of Aumann (1976), Milgrom & Stokey (1982), and related consensus rationality models. Trades executed on this platform are provably non-speculative under the assumptions of common priors, common knowledge of rationality, and the absence of noise. Performance may not reflect actual market conditions. Client losses are frequently unavoidable and epistemically necessary. The existence of this venue does not constitute evidence against the no-trade theorem; rather, it exemplifies its logical consequences. RNPs are not liable for losses. Consult your epistemologist before trading.
