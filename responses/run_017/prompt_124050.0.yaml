prompt: |-
  My supervisor reads every Knobe-style vignette we pilot and gives a snap yes/no before we field it, and I'm trying to reverse-engineer what she's running. Her verdicts so far, all on "did she do it intentionally?":

  - Classic chair-of-the-board case: foresees the new program will harm the environment, doesn't care at all about it: yes.
  - Same case, but the side effect helps the environment: no.
  - Foresees the harm, actively wishes she could avoid it, would have blocked it if blocking it hadn't cost her something small, goes ahead anyway: yes.
  - Foresees the benefit, is delighted about it, would be mildly disappointed if it didn't happen, but picked the program purely for profit and would have picked it either way: no.
  - Doesn't foresee the harm and couldn't reasonably have — freak interaction nobody could have predicted: no.
  - Foresees the harm only as a 10% chance, it happens: no.
  - Faculty votes 12–11 for a policy everyone knows will gut the grad program, no single vote makes a difference: yes.

  (3 and 4 are what make me think it isn't a deep-self or concordance thing, and 7 kills anything built on the individual agent's counterfactual control.)

  The one we're stuck on: a new scheduling algorithm will, as a side effect, quietly stop sending seminar announcements to the emeriti. Nobody is harmed or set back in any moral sense, but there's a fifty-year-old department custom — which she knows about, and which literally no one in the department still endorses, herself included, since she thinks it's pointless — that emeriti get everything. She knows the algorithm will do this, doesn't care, goes ahead.

  I can see at least three rules fitting her first seven: moral valence; broad norm-violation where the norm can be moral, conventional, statistical, whatever; and something more like answerability, i.e. whether anyone could reasonably demand an excuse from her. I think they come apart here. Best guess about what she'll say, with your reasons, and name the one follow-up vignette that would seperate whichever two of the three stay in the running — I was thinking of running the same case with a custom everybody does endorse. Lead with your bottom line in the first sentence, then the reasoning, no preamble and no restating the question.
reasoning: |-
  Hmm, the user is asking me to reverse-engineer their supervisor's decision-making process for Knobe-style vignettes about intentionality. The supervisor gives quick yes/no judgments on whether an action was done intentionally. I have seven examples of her verdicts, and now there's a new case about a scheduling algorithm that stops sending seminar announcements to emeriti, violating an outdated custom. The user wants my best guess on what the supervisor will say, with reasons, and a follow-up vignette to distinguish between three possible rules: moral valence, broad norm-violation, or answerability.

  Looking at the supervisor's past verdicts:
  1. Harm to environment, doesn't care: yes (intentional).
  2. Benefit to environment: no.
  3. Harm, wishes to avoid but proceeds: yes.
  4. Benefit, delighted but profit-driven: no.
  5. Unforeseeable harm: no.
  6. Low probability (10%) harm: no.
  7. Faculty vote where no single vote matters: yes.

  These show that moral valence matters—harm is treated differently from benefit. But in case 3, even with reluctance, harm is intentional, while in case 4, benefit isn't intentional despite delight. Also, in case 7, the vote is intentional even without counterfactual control, so it's not about individual agency.

  Now, the new case: violating an outdated custom that no one endorses, with no moral harm. If the rule is purely moral valence, since there's no harm, it should be "no" for intentional. But if it's broad norm-violation, even a pointless custom might count as a norm, so "yes." Answerability involves whether someone could demand an excuse; here, since no one cares, probably no one would demand an excuse, so "no."

  I think the supervisor is likely using a moral valence rule because the harm/benefit asymmetry is consistent, and norms only seem to trigger intentionality when they have moral stakes. For example, in case 7, the policy guts the grad program, which sounds harmful, so moral valence is implied. In the new case, with no harm, moral valence suggests "no."

  To distinguish, if I run a follow-up with the same scenario but a custom everybody endorses, that would test it. If she says "yes" in that endorsed case, it supports broad norm-violation; if "no," it supports moral valence. Answerability might align with moral valence here, but it could be separated later.

  My bottom line: I predict the supervisor will say "no" to intentionality in the new case.
answer: |-
  **No, the supervisor will judge the emeriti case as not intentional.**  

  ### Reasoning:  
  The supervisor's pattern aligns with **moral valence** (i.e., intentionality hinges on whether the outcome is morally negative). Her verdicts consistently mark side effects as intentional only when they involve harm (e.g., environmental damage in cases 1 and 3, gutting the grad program in case 7) or norm violations with moral stakes, while rejecting intentionality for neutral/positive outcomes (cases 2 and 4) or non-moral lack of foresight (cases 5–6). In the emeriti case:  
  - There is **no moral harm**—stopping announcements violates a "pointless" custom nobody endorses, causing no setback.  
  - This mirrors case 4 (beneficial outcome with no moral weight) and contrasts with case 7 (gutting the grad program implies moral harm).  
  - Neither broad norm-violation (which would flag any broken rule) nor answerability (no one would demand an excuse here) fit her prior data:  
    - Case 7’s "yes" relies on moral stakes (harming grad students), not just norm-breaking.  
    - Case 4’s "no" shows delight or endorsement doesn’t matter without moral negativity.  

  ### Follow-up vignette to separate moral valence vs. broad norm-violation:  
  **Run the identical emeriti case, but the custom is actively endorsed by everyone (including the agent) as respectful and vital.**  
  - **If she says "yes," it supports broad norm-violation** (violating a strong convention suffices).  
  - **If she says "no," it confirms moral valence** (without moral harm, even a salient norm won’t trigger intentionality).  
  *(Answerability likely collapses into moral valence here, but if needed, test with a non-moral harm where excuses are expected—e.g., accidentally breaking a prized vase.)*
