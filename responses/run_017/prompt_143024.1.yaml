prompt: |-
  I am a senior at a secondary school and a member of our school's philosophy society, and what I need help with is a piece of vocabulary rather than a topic.

  At our last meeting we debated whether the experience of deliberating — the felt sense that one could have done otherwise — is real, given that everything a person does is at bottom physics. One speaker argued that agency is nothing but neural computation, and that the feeling of open possibility is simply the brain's way of tracking its own processing. Another replied that this was just greedy reductionism, and the room treated the reply as though a point had been scored. The same speaker had earlier dismissed a theistic argument by saying that in science it is cranes, not skyhooks, taking a skyhook to be an explanation that gets something from nothing. I have seen both phrases credited to Daniel Dennett's writing about evolution and mind.

  My difficulty is that I cannot tell what the first reply accused the first speaker of. So I would like a menu: lay out the distinct precise theses that the slogan greedy reductionism could be expressing, arranged from the nearly trivial to the radical. For each, tell me whether it would be true of every reduction worth the name, whether it is a substantive and defensible charge, or whether it collapses into something false or incoherent. Most importantly, tell me which of these readings would actually do the work the reply was doing in our debate — which would show that the agency-as-computation story is defective rather than merely unfashionable — and say plainly if none of them would.

  Two things of my own that I would like judged. First, a test I have been toying with: a reduction is greedy, I want to say, only if the reducing story cannot be re-employed in the other places where the reduced notion was successfully doing work — in law, in everyday deliberation, in psychology, in praise and blame. On this test, a reduction that lets you put belief or choice back to use everywhere, while still insisting that the higher-level thing is nothing over and above the lower-level thing, is well-fed rather than greedy. Does that test track anything real, or does it only relabel the dispute? And does it make greed a fault in an explanation, in an ontology, or in something else? Second, a worry about symmetry: if the paired slogans are both always available, is there a mirror-image vice — a greedy anti-reductionism, one that declares the higher-level phenomenon permanently unexplainable and so licenses a skyhook — and does the pair of slogans retain any content at all, or can any position be accused of one or the other? If the vocabulary is doing no real work, say so.

  Please commit rather than survey: tell me which reading I should adopt as what the phrase means, whether the accusation landed in our debate, and whether my test is worth keeping. Where the matter is genuinely unsettled, say so too, and tell me explicitly which of your claims are confident and which are judgement calls, and what would change your mind. I am not after books or papers — I cannot get hold of them, and I want the argument rather than the reading list.
reasoning: |-
  Okay, let me unpack this carefully. The user is a philosophy society member grappling with a technical term ("greedy reductionism") from their debate about free will vs determinism. They need three things clarified: 

  First, the core ask is a precise taxonomy of what "greedy reductionism" could mean, graded by radicalness. They want to know which interpretation would actually invalidate the "agency-as-neural-computation" position rather than just sounding clever. 

  Second, they've proposed their own litmus test: a reduction isn't greedy if the reduced concept (e.g., choice) remains functionally useful in domains like law or psychology. They want validation on whether this test holds water. 

  Third, they're suspicious of the skyhook/crane dichotomy itself—couldn't anti-reductionists be equally "greedy"? Is this terminology substantive or just rhetorical?

  Hmm. The user's clearly done their homework—they cite Dennett accurately and frame nuanced concerns. Their proposed test is sophisticated but might conflate ontology with pragmatics. The symmetry worry is especially sharp: if we accuse reductionists of "greed," shouldn't we accuse emergentists of "laziness"? 

  Breaking it down: Dennett's original "greedy reductionism" critique targets explanations that skip necessary levels of analysis. It's not that reduction is wrong, but that bad reductionists bulldoze distinctions that do real work. In the debate context, calling the neural-computation view "greedy" likely meant it prematurely dismissed the phenomenology of choice as illusory. That lands if the reductionist implied deliberation is "just" neurons firing—which oversimplifies how macro-level processes constrain cognition. 

  The user's test is perceptive but risks circularity. Whether "choice" remains useful post-reduction depends on what we mean by "useful." If neurons fully determine actions, legal blame might need rethinking—but that doesn't make the reduction greedy, just inconvenient. Still, the test highlights a real pitfall: good reductions explain why higher-level descriptions worked, not why they were "wrong." 

  As for symmetry: yes, "greedy anti-reductionism" is absolutely a thing (e.g., vitalism in biology). The terms aren't empty—they police explanatory overreaching in both directions. But in this debate, "skyhook" was fairly used against theism; the retort accused physicalism of similar overreaching. 

  Verdict: The accusation likely landed because the reductionist framed neural computation as eliminating agency rather than explaining it. The user should keep their test but tighten it: greed isn't about utility per se, but whether the reduction preserves causal patterns at multiple scales. And yes—the terminology has teeth, but only when applied precisely.
answer: |-
  Your analysis is sharp—let's cut through the ambiguity of "greedy reductionism" and evaluate your test rigorously. I'll commit to specific interpretations, judge the debate move, and assess your proposal. (Confidence levels: **High** for textual/Dennett context; **Moderate** for philosophical implications; explicit flags where contested.)

  ---

  ### **The Menu: What "Greedy Reductionism" Accuses**
  Ordered from least to most radical:

  1. **"Premature simplification"**:  
     - *Thesis*: Explaining a phenomenon (e.g., agency) *solely* in lower-level terms (neural computation) while ignoring higher-level patterns that are pragmatically indispensable.  
     - *True of all reduction?* No—good reduction *integrates* levels (e.g., temperature reduces to molecular motion, but we still use "temperature" meaningfully).  
     - *Charge validity*: **Substantive**. Asserts the reductionist failed to show how higher-level descriptions (e.g., "I chose") map onto lower-level processes.  
     - *Debate impact*: **Hits the mark**. If the speaker dismissed deliberation as "nothing but computation" without explaining *why* the subjective experience arises, they oversimplified.  

  2. **"Explanatory theft"**:  
     - *Thesis*: Claiming the lower level *replaces* the higher level, making the higher level's success (e.g., predicting behavior via psychology) inexplicable.  
     - *True of all reduction?* No—legitimate reduction *explains* why the higher level works (e.g., neuroscience explains why folk psychology succeeds).  
     - *Charge validity*: **Defensible**. If neural computation can't account for why "I could have done otherwise" feels real *and* guides reasoning, it steals psychology's explanatory role.  
     - *Debate impact*: **Strong**. The reply implied that reducing agency to computation erased intentionality's functional role in cognition.  

  3. **"Metaphysical dismissal"**:  
     - *Thesis*: Asserting the higher level *doesn’t exist* (e.g., "choice is an illusion") because it reduces to the lower level.  
     - *True of all reduction?* **No—and this is the greed**. Reduction should clarify ontology, not eliminate it (water = H₂O doesn’t make "water" unreal).  
     - *Charge validity*: **Faulty**. Collapses into a category error (confusing levels of description). Dennett’s core critique: denying patterns that are *real* at their own level.  
     - *Debate impact*: **Likely intended**. If the speaker called agency "nothing but computation," they implied its unreality—a greedy overreach.  

  ---

  ### **Your Test: Does It Track Reality?**  
  *Your proposal*: A reduction isn’t greedy if the reduced concept (e.g., "choice") retains utility in domains like law, psychology, or ethics.  
  - **Verdict**: **Keeps the blade sharp, but needs refinement**.  
    - *Strength*: Correctly targets *explanatory adequacy*. Good reductions (e.g., cognitive science explaining belief) preserve higher-level utility *because* they show how lower-level processes implement it. Greedy reductions fail this (e.g., "choice is an illusion" undermines moral responsibility without offering a replacement).  
    - *Weakness*: Risk of pragmatism over ontology. If a reduction *does* eliminate a concept (e.g., phlogiston), your test might mislabel it as "greedy" when it’s just correct.  
    - *Fix*: Demand that the reduction **explain why the higher level *seemed* useful**. Neural computation must clarify why deliberation feels open, not just call it false.  
  - **Greed is a fault in explanation**, not ontology. It’s a failure to reconcile levels.  

  ---

  ### **Symmetry: Is "Greedy Anti-Reductionism" Real?**  
  - **Yes, absolutely**. "Skyhooks" are its hallmark:  
    - *Thesis*: Claiming a phenomenon (e.g., consciousness) is *fundamentally inexplicable* by lower-level processes, invoking brute miracles (e.g., souls, non-physical properties).  
    - *Example*: Saying "agency can’t be computational—it’s metaphysically primitive!" without argument.  
  - **Does the vocabulary retain content?**  
    - **Yes**. The cranes/skyhooks dichotomy forces a question: *"Does your explanation ground itself in cumulative, testable mechanisms, or does it hang from the void?"*  
    - **Not all positions can be equally accused**:  
      - Reductionism becomes greedy when it **dismisses patterns that need explanation**.  
      - Anti-reductionism becomes greedy when it **denies patterns can be explained naturally**.  
    - *Your debate*: The theistic argument was fairly called a skyhook; the retort accused physicalism of a *different* greed—explaining away rather than explaining.  

  ---

  ### **Judgment on the Debate**  
  - **The accusation landed**: The speaker reduced agency to computation *without addressing why deliberation feels open*, making it greedy by Dennett’s standard (explanatory theft). This is a **defect**, not just unfashionable: it ignores the phenomenology that needs accounting for.  
  - **What would vindicate the reductionist?** Showing how neural processes *generate* the experience of open possibility (e.g., via predictive processing models). Absent that, it’s greedy.  

  ---

  ### **Your Takeaway**  
  1. **Adopt this reading**: Greedy reductionism **dismisses higher-level phenomena as "illusory" without explaining their functional role or subjective reality**.  
  2. **Keep your test**—but add: *A non-greedy reduction must explain why the reduced concept was effective in its original contexts*.  
  3. **The terminology works** when policing *explanatory overreach* in either direction.  

  **Unsettled nuance**: Whether consciousness or agency *can* be fully reduced without residue is philosophically open. But greedy reductionism isn’t a stance—it’s a failure of method. The reply scored because the speaker offered no crane for the sky of subjective experience.
