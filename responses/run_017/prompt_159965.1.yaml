  - Standpoint requires subjective experience, which is notoriously hard for collectives.
  - Unity without a bottleneck demands functional integration over physical centralization.
  - Grain/tempo: slowness isn't disqualifying if the system's dynamics define the relevant timescale.
  - Extended memory is valid if it's functionally equivalent, per extended mind theories.
