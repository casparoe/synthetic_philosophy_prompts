      *   Semantics (rigidity, counterpart relations).
      While intertwined, the cruxes above attempt to isolate key fault lines. A joint statement *is* possible to clarify the nature of the disagreement, even if full consensus is not reached.

  3.  **Cases & Scope:** The provided cases are useful and bite on the cruxes:
