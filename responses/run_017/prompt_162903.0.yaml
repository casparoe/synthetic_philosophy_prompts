      *   **mtDNA Different:** Probes the scope of "genome" in Crispin's view (Table).
      *   **Single Base Pair Edit:** Tests the limits of genetic similarity and the identity/counterpart divide (Crux 4).
      *   **Same Gametes, Later Fusion:** Primarily tests persistence/origin time essentiality, which is a *separate* (though related) issue not fully explored here. Both parties likely agree minor time shifts are possible; major shifts might not be. (Not a core focus of *this* origin debate).
      *   **Zygote Split (Twins):** Core case for the branching constraint discussion (Table & Crux 2).

  4.  **Outlook:** This document provides a clear map of agreements, disagreements, and testable cruxes. It reveals a **substantive metaphysical disagreement** concerning the grounds of origin necessity (tokens vs. genome/material) and the underlying nature of transworld identity (strict identity vs. counterpart relations). The predictive test cases offer a path to gather evidence potentially favoring one view over the other on specific points, or at least to clarify the commitments of each position further. **Manufactured consensus has been avoided.** The ball is now squarely in Nadia and Crispin's court to sign the agreements, accept the wording of their disagreements, and commit to their predictions for the crux cases.
