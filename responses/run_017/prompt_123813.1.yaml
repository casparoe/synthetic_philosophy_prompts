prompt: |-
  I run a small type foundry — me, two other designers, and a junior who's talented but has never read a word of theory — and we keep having the same fight in design reviews: is that glyph still an 'a'?

  It comes up maybe two or three times a week, and it's not academic for us: it decides whether a commissioned family gets approved, whether a variable font ships with a broken heavy end, whether we can legally call something a text face. We can't just say "does it look like an a," because we've all worked out that's circular — a single-storey Futura 'a', a double-storey Garamond 'a' and a blackletter 'a' share almost nothing as shapes and are all obviously a's, and meanwhile the exact same shape can be a Latin 'a' or a Cyrillic 'а' depending on which system it's doing a job in. (I keep thinking about that "Letter Spirit" chapter in Hofstadter's Fluid Concepts and Creative Analogies, the one about the essence of a letterform as something separable from its style, and honestly half the reason I'm writing is that I can't tell whether that's a thing we could actually use or just a nice metaphor.)

  What I want is a procedure, not an essay. Something the junior can run in about ten minutes with printouts and no theory background, in this order: the questions to ask, what counts as a passing answer to each, where the procedure stops with a no, and where it hands the decision to me because it's a question of taste or client negotiation rather than fact.

  Things it has to handle properly:

  - Three different ways a glyph can fail, kept apart: nobody can read it as an 'a' at all; it reads as an 'a' but collides with another letter in the same style (o, d, q, g — my hunch is that a letter's identity is partly relational, defined against the rest of the alphabet, so a glyph can be perfectly fine in isolation and still not be this alphabet's 'a'); and it reads fine but doesn't belong to the family, i.e. it looks like it was drawn by somebody else in a different style.
  - A deformation test: can we get from some canonical 'a' to this glyph by a continuous series of small steps where every intermediate still reads as an 'a'? Tell me which exemplar to start from, what breaks the path, and what to do when there's no path in one style but obviously is in another.
  - The homoglyph case, where shape and role come apart — one drawn form serving as two letters in two systems. What does the procedure say, and is there any case where it has to answer "both" or "neither"?
  - A fallback for when we can't afford real reader testing with actual users, which is most of the time, since we're four people and the budget is a joke.
  - Be upfront about which steps are judgment calls dressed up as procedure. I'd rather know than be comforted.

  Then run it on three of ours: (1) the heavy end of a variable text face where the counter of the 'a' has basically closed up at small sizes but looks deliberate and fine on a poster; (2) a client's bilingual brand asking for one shared glyph to be both Latin 'a' and Cyrillic 'а'; (3) our founder's "signature a," detached bowl with a swirl off the terminal, which is on all our marketing and which I have a bad feeling about. Give me the answer the procedure actually gives on that last one even if I won't like it.

  Finish with a one-page version I can paste into the studio handbook, and be clear about what the procedure can't tell us — whether the letter is any good, whether the family as a whole hangs together, and what to do when we're drawing for a script with no established reading comunity to appeal to.
reasoning: |-
  We are designing a procedure to determine if a glyph is still an 'a'. The procedure must be practical, executable by a junior designer in about 10 minutes with printouts and no theory background. It must address three failure modes: unreadability, collision with other letters, and style inconsistency. It must also handle deformation tests, homoglyphs, and provide a fallback for reader testing.

  The procedure should be structured as a series of questions with clear pass/fail criteria, and indicate when to escalate to a senior.

  We break down the procedure into three main checks:

  1. **Basic Recognition (Is it an 'a' at all?)**
  2. **Relational Identity (Does it conflict with other letters in the alphabet?)**
  3. **Style Consistency (Does it belong to the family?)**

  Additionally, we'll have a deformation test and handle homoglyphs.

  ---

  **Procedure: Is this glyph still an 'a'?**

  **Materials needed:** 
  - Printout of the glyph in question (at various sizes if applicable)
  - Printout of the full alphabet in the same typeface (at the same style and weight)
  - Printout of a reference set of 'a's from well-known typefaces (e.g., Futura, Garamond, a blackletter, and a standard sans-serif like Helvetica)

  **Time:** Approx. 10 minutes

  ---

  **Step 1: Basic Recognition (Unreadability Check)**
     - **Question:** Can the glyph be recognized as an 'a' by someone familiar with the Latin alphabet, without any context?
     - **Test:** 
        a. Show the glyph in isolation (without any surrounding letters) to at least two other people in the studio (if available, otherwise use the junior's own judgment and then escalate if unsure). Ask: "What letter is this?"
        b. If the immediate and confident answer from both is 'a', then pass. 
        c. If one says something else or hesitates, note the alternative interpretations (e.g., 'o', 'd', etc.). 
     - **Passing:** Both say 'a' without hesitation.
     - **Failing:** If not, then the glyph fails. Stop and mark as "unreadable as 'a'".
     - **Escalate:** If the answers are mixed (one says 'a', another says something else) or if the junior is unsure, escalate to senior for judgment.

  **Step 2: Deformation Test (Continuity of Form)**
     - **Purpose:** Check if there's a continuous path from a canonical 'a' to this glyph without losing 'a'-ness.
     - **Test:** 
        a. Choose a canonical 'a' that is the starting point. This should be the most standard 'a' in the same style (e.g., if the design is a sans-serif, use Helvetica 'a'; if serif, use Times New Roman). For a variable font, use the default (middle) weight of the same family.
        b. Imagine (or sketch) a series of small steps (5-10) that morph the canonical 'a' to the glyph in question. At each step, ask: "Is this still an 'a'?" 
        c. If you can imagine a path where every intermediate step is still recognizably an 'a', then pass. 
        d. If at any point the intermediate form becomes ambiguous (could be mistaken for another letter, e.g., 'o' or 'd') or loses the essence of 'a', then note where it breaks.
     - **Passing:** A continuous path exists without breaking.
     - **Failing:** The path breaks (i.e., an intermediate step is not an 'a'). Then the glyph fails the deformation test. However, note: this does not automatically mean the glyph is not an 'a' (because style matters) — it just flags a risk. Proceed to Step 3 and then escalate the decision.
     - **Escalate:** If the path breaks, but the glyph passed Step 1, then the issue might be style-specific. Escalate to senior for judgment, providing the breaking point.

  **Step 3: Relational Identity (Collision Check)**
     - **Question:** In the context of the full alphabet, does the glyph for 'a' look distinct enough from similar letters (especially 'o', 'd', 'q', 'g')?
     - **Test:**
        a. Place the glyph next to the typeface's 'o', 'd', 'q', and 'g' (in the same style and weight) in the following pairs: 'a' and 'o', 'a' and 'd', 'a' and 'q', 'a' and 'g'. Also, check in the context of a word (e.g., "oadqg").
        b. Ask: "In each pair, are the two letters easily distinguishable at normal reading size (e.g., 10pt) and at a glance?"
        c. Check for specific features:
            - 'a' vs 'o': Does the 'a' have a clear opening or a tail that the 'o' lacks? (If both are single-storey, the 'a' should have a more rectangular or non-circular shape.)
            - 'a' vs 'd': Does the 'a' have a distinct bowl and stem? (In double-storey, the top of 'a' is different from the loop of 'd'.)
            - 'a' vs 'q': Especially the tail and the bowl.
            - 'a' vs 'g': The double-storey 'g' has a loop and a tail, but the 'a' should not be confused with the top part of 'g'.
     - **Passing:** The 'a' is clearly distinguishable from each of these letters in isolation and in a word setting.
     - **Failing:** If in any pair the letters are too similar and could be confused in a word, then the glyph fails. Mark as "collides with [letter]".
     - **Escalate:** If the distinction is subtle but still clear to the junior, but they are not confident, escalate.

  **Step 4: Style Consistency (Family Membership)**
     - **Question:** Does the glyph look like it was drawn by the same hand as the rest of the alphabet?
     - **Test:**
        a. Place the glyph alongside the same character from the reference set (Futura, Garamond, blackletter, Helvetica) and alongside the other letters in the same typeface (especially the 'n', 'o', 'm' which share similar curves).
        b. Check for consistency in:
            - Stroke weight (thick/thin transitions)
            - Terminal endings (serifs, sans, etc.)
            - Curvature (round, oval, squarish)
            - Axis (upright, slanted)
            - Proportions (x-height, width)
        c. Ask: "Does this 'a' feel like it belongs with the rest of the letters? Or does it stand out as foreign?"
     - **Passing:** The glyph fits harmoniously with the rest of the alphabet and does not look out of place.
     - **Failing:** The glyph clearly looks like it was imported from a different typeface. Then it fails.
     - **Escalate:** If the junior is unsure, escalate.

  **Step 5: Homoglyph Check (If applicable)**
     - **Question:** Is this glyph intended to serve as two different letters (e.g., Latin 'a' and Cyrillic 'а')?
     - **Test:**
        a. For each script (Latin and Cyrillic), repeat Steps 1 to 4 for that script's alphabet. But note: 
            - In Step 1, test recognition for both scripts (e.g., show to someone who knows Latin and someone who knows Cyrillic, or to a bilingual person).
            - In Step 2, use the canonical form for each script (Latin canon and Cyrillic canon) and see if there's a continuous path from both to the glyph without breaking the identity in either script at any step? (This is a double test.)
            - In Step 3, check against the confusing letters in both scripts. For Cyrillic, the 'а' might be confused with 'о' (Cyrillic o) or 'д' (de) etc.
            - In Step 4, check style consistency with both the Latin and Cyrillic alphabets (if both are being designed).
        b. If the glyph passes for both scripts in all steps, then it can serve as both. Answer: "both".
        c. If it passes for one script but not the other, then it is only for the passing script. Answer: [script] only.
        d. If it fails for both, then "neither".
     - **Note:** This step is only triggered when the glyph is intended to be a homoglyph.

  **Fallback for Reader Testing:**
     - Since we cannot do real user testing, we rely on internal checks (Steps 1 and 3) which involve at least two people (if available). If only the junior is available, they must do the tests and then escalate any uncertain cases.

  **Summary of Escalation Points:**
     - Step 1: Mixed or hesitant recognition.
     - Step 2: Deformation path breaks (but the glyph passed Step 1).
     - Step 3: Uncertainty in distinguishing from other letters.
     - Step 4: Uncertainty about style consistency.
     - Step 5: Any ambiguity in homoglyph status.

  ---

  **Run the procedure on the three cases:**

  **Case 1: Heavy end of a variable text face (counter closed at small sizes)**
     - Step 1: At poster size, recognizable as 'a'. At small size? Print at 10pt and test: if the counter is closed, it might look like an 'o'. If it's ambiguous, fail Step 1. But if it's deliberate and the shape still reads as 'a' (e.g., because of the tail or overall form), it might pass.
     - Step 2: From the default weight, as we increase weight, the counter closes. Check if every step is still an 'a'. At the point where the counter is nearly closed, it might break (if it looks like an 'o'). So deformation test fails at the heavy end.
     - Step 3: Compare with 'o' at the heavy weight. If the closed 'a' and 'o' are too similar, then they collide -> fail Step 3.
     - Step 4: The heavy glyph is consistent with the heavy weights of the family? Yes, so pass.
     - **Result:** 
          - At small sizes: Step 1 might fail (if unreadable) or pass (if still readable). 
          - Step 2 fails (deformation path breaks at heavy end). 
          - Step 3 likely fails (collides with 'o' at small sizes). 
          - Therefore, the glyph at the heavy end is not acceptable as an 'a' for text sizes. 
     - **Procedure says:** No, it is not an 'a' at small sizes (because of Steps 1 and 3). But at poster sizes, it passes all steps. So the variable font should not ship with this heavy end for text usage. Escalate to senior: maybe design a separate display version or adjust the heavy weight.

  **Case 2: Client's bilingual brand (one glyph for Latin 'a' and Cyrillic 'а')**
     - We trigger Step 5 (homoglyph).
     - Step 1 (Latin): Recognizable as Latin 'a'? (Assume yes). Step 1 (Cyrillic): Recognizable as Cyrillic 'а'? (Probably, since the form is the same and Cyrillic 'а' is identical in shape in many fonts). So pass both.
     - Step 2: For Latin: continuous path from Latin canonical 'a'? Yes. For Cyrillic: continuous path from Cyrillic canonical 'а'? (Note: the canonical Cyrillic 'а' is often the same as Latin, so yes). Pass.
     - Step 3 (Latin): Check against Latin 'o', 'd', etc. (Assume it passes). Step 3 (Cyrillic): Check against Cyrillic 'о' (o) and 'д' (de). In Cyrillic, the 'а' must be distinct from 'о' (which is the same as Latin 'o') and 'д'. If the glyph is a simple 'a', it might be too close to 'о'? If the design is such that the 'а' has a slight tail or other feature to distinguish, then pass. But if it's a simple circle with a curve, it might be confused with 'о'. So Step 3 for Cyrillic might fail.
     - Step 4: Check style consistency with both alphabets. If the rest of the Cyrillic is designed in the same style, then pass.
     - **Result:** 
          - If Step 3 for Cyrillic fails, then the glyph fails as a homoglyph for Cyrillic. It is only a Latin 'a'. 
          - But note: in many bilingual contexts, the Latin and Cyrillic are used separately, so maybe the collision is acceptable? The procedure says: if it fails Step 3 for one script, it fails for that script. 
     - **Procedure says:** It is a valid Latin 'a' but not a valid Cyrillic 'а' because it collides with Cyrillic 'о'. Therefore, the homoglyph fails for Cyrillic. Escalate to senior for client negotiation.

  **Case 3: Founder's "signature a" (detached bowl with a swirl)**
     - Step 1: Recognition: Without context, does it read as 'a'? Maybe not immediately. It might be seen as an ornament. Test: show to two people. If they don't say 'a', fail.
     - Step 2: Deformation from a canonical 'a'. The path might break when the bowl detaches and the swirl is added. The intermediate step with a partially detached bowl might not look like an 'a'. So deformation test fails.
     - Step 3: Check against 'o', 'd', etc. The detached bowl might make it look like an 'o' with a swirl, so it might collide with 'o'. Fail Step 3.
     - Step 4: Style consistency: If the rest of the alphabet has no such swirls, then it fails. Even if the whole family has swirls, then it must be consistent. But the question is about the 'a' being in the same style as the rest of the family. If the rest of the letters are conventional, then it fails.
     - **Result:** The glyph fails all steps? Step 1: probably fails (unless the swirl is very minor and the 'a' shape is still dominant). Step 2 fails. Step 3 fails. Step 4 fails (if the rest of the family is normal). 
     - **Procedure says:** No, this is not an 'a'. It is unreadable and collides with other letters. However, if it's intended for display and not for reading, then the rules are different. The procedure is for text faces and readability. For a display face, we might relax. But the procedure as designed is for functional 'a's. So for a text face, it fails. For display, we might need a separate procedure.

  ---

  **One-Page Version for Studio Handbook:**

  **Procedure: Is this glyph still an 'a'? (For text faces)**

  **Purpose:** To determine if a glyph is a functional 'a' in a typeface, checking for recognition, distinctness, and style.

  **Materials:** 
  - Glyph printout (at various sizes if variable)
  - Full alphabet printout (same style)
  - Reference 'a's (Futura, Garamond, Helvetica, blackletter)

  **Steps:**

  1. **Basic Recognition (Is it an 'a' at all?)**
     - Show the glyph in isolation to two people. Ask: "What letter is this?"
     - **Pass:** Both immediately say 'a'.
     - **Fail:** If not, mark "unreadable". Stop. (Escalate if mixed answers.)

  2. **Deformation Test (Continuous path?)**
     - Start from a standard 'a' (e.g., Helvetica for sans, Times for serif). Imagine steps from that to your glyph. At every step, must still be an 'a'.
     - **Pass:** Path exists without breaking.
     - **Fail/Note:** If breaks, note where. (Even if pass, proceed. If fail, proceed but escalate at end.)

  3. **Relational Check (Distinct from similar letters?)**
     - Compare your 'a' with the typeface's 'o', 'd', 'q', 'g'. Check in pairs and in a word (e.g., "oadqg").
     - **Pass:** Clearly distinct at 10pt and at a glance.
     - **Fail:** If confusable with any, mark "collides with [letter]". (Escalate if unsure.)

  4. **Style Check (Fits the family?)**
     - Compare with reference 'a's and with the typeface's 'n', 'o', 'm'. Check stroke, terminals, curves, axis, proportions.
     - **Pass:** Harmonious with the rest.
     - **Fail:** Looks foreign. (Escalate if unsure.)

  5. **Homoglyph? (If designed for two scripts)**
     - Do Steps 1-4 for both scripts (e.g., Latin and Cyrillic).
     - **Pass both:** It's both.
     - **Pass one:** Only that one.
     - **Fail both:** Neither.

  **Outcome:**
  - If all steps pass: It's an 'a'.
  - If any step fails without escalation: It's not an 'a'.
  - If escalation: Senior decides.

  **What this procedure cannot tell:**
  - Whether the letter is beautiful or well-designed.
  - Whether the typeface as a whole is harmonious (only that this glyph fits).
  - For scripts with no established reading community: This relies on known references and testers familiar with the script. Without that, we cannot apply.

  **Note:** For display typefaces, readability (Steps 1 and 3) may be less critical. Use this procedure for text faces; for display, escalate to senior directly.
answer: |-
  Here's a practical, step-by-step procedure designed for your junior designer to execute in 10 minutes with printouts. It separates the three failure modes, includes deformation tests and homoglyph handling, and flags judgment calls. The answers for your three cases are at the end.

  ---

  ### **Procedure: "Is This Glyph Still an 'a'?"**  
  **Materials Needed:** Printout of (1) the glyph in question, (2) the full alphabet in the same style/weight, (3) 3 reference words ("navy," "tea," "road") set in the same typeface.

  #### **Step 1: Basic Recognition Check**  
  *(Does it read as 'a' at all?)*  
  - **Ask:** "If you saw this glyph alone, what letter would you call it? (No context given)"  
  - **Pass:** At least 2 of 3 studio members say "a" within 3 seconds.  
  - **Fail:** >1 person says something else (e.g., "o" or "e").  
  - **Stop here if failed.** Reason: *Unreadable as 'a'.*  
  - **Judgment call:** If 1 person hesitates or says "a?" but others confirm, escalate to senior.  

  #### **Step 2: Deformation Test**  
  *(Can we morph from a standard 'a' to this without breaking 'a'-ness?)*  
  - **Do:** Sketch 5 steps between a reference 'a' (pick based on style: Helvetica for sans-serif, Garamond for serif, Futura for geometric) and your glyph.  
  - **Ask:** "Does every step still look like an 'a'?"  
  - **Pass:** All intermediates are plausible 'a's (e.g., no step resembles 'o' or 'd' more than 'a').  
  - **Fail:** Any intermediate step loses 'a' identity (e.g., counter closes completely, stem detaches).  
  - **Escalate if:** Path breaks in one style but works in another (e.g., fails for text faces but passes for display).  
  - **Output:** Note where the path breaks (e.g., "Step 3: counter collapse makes it look like 'o'").

  #### **Step 3: Relational Check**  
  *(Does it collide with o/d/q/g in the same alphabet?)*  
  - **Do:** Place your glyph next to the typeface's **o, d, q, g** in pairs.  
  - **Ask:** "At 10pt size, could these be confused in 'road' vs. 'rood' or 'dad' vs. 'dod'?"  
  - **Pass:** Clear distinction in all pairs (e.g., 'a' has a tail/exit stroke that 'o' lacks; 'a' bowl is flatter than 'd').  
  - **Fail:** Any pair risks confusion (e.g., 'a' and 'o' both circular with no differentiating feature).  
  - **Stop here if failed.** Reason: *Collision with [letter]*.  

  #### **Step 4: Style Consistency Check**  
  *(Does it belong to the family?)*  
  - **Do:** Place your glyph between the typeface's **n, o,** and **m**.  
  - **Ask:** "Do these 4 glyphs look like they were drawn by the same hand?" Check:  
    - Stroke weight contrast (e.g., if 'n' has abrupt thins, 'a' should too).  
    - Terminal style (e.g., all tapered or all blunt).  
    - Curvature (e.g., all oval or all circular).  
  - **Pass:** No glaring mismatches (e.g., 'a' doesn’t feel "heavier" or "flatter" than neighbors).  
  - **Fail:** It stands out like an intruder (e.g., 'a' has a ball terminal while 'n' has a wedge).  
  - **Judgment call:** If inconsistency is subtle (e.g., 'a' is 5% wider), escalate to senior.  

  #### **Step 5: Homoglyph Handling**  
  *(Only if briefed for dual Latin/Cyrillic role)*  
  - **Do:** Test recognition with 2 people familiar with Cyrillic. Show the glyph alone.  
  - **Ask:** "What letter is this?"  
  - **Pass:** "а" (Cyrillic a) or unambiguous "a".  
  - **Fail:** Any other answer (e.g., "o" or "д").  
  - **Output:**  
    - If passes for both scripts: **"Both"** (but verify no collisions in Cyrillic, e.g., with **о**).  
    - If passes one but fails the other: *Only [script]*.  
    - If fails both: **"Neither"** (escalate).  
  - **Judgment call:** If it passes recognition but causes collisions in one script (e.g., Latin 'a' works but Cyrillic 'а' clashes with 'о'), escalate.  

  #### **Fallback for No User Testing**  
  - Use the studio as testers (min. 2 people).  
  - If only the junior is available, they must compare to reference sheets (Futura, Garamond, blackletter 'a') and escalate ambiguities.  

  ---

  ### **Answers for Your Cases**  
  **Case 1: Heavy Variable 'a' (closed counter at small sizes)**  
  - **Step 1:** Passes at poster size, fails at 10pt (likely misread as 'o').  
  - **Step 2:** Path breaks when counter closes >80% (intermediate looks like 'o').  
  - **Step 3:** Fails at 10pt (collides with 'o').  
  - **Step 4:** Passes (style is consistent).  
  - **Verdict:** **Not an 'a' at text sizes.** Escalate to senior: either adjust weight axis or split text/display variants.  

  **Case 2: Bilingual Homoglyph (Latin 'a' / Cyrillic 'а')**  
  - **Step 1:** Passes for both scripts (shared shape).  
  - **Step 2:** Path exists from both Latin and Cyrillic standards.  
  - **Step 3:** Risk of collision with Cyrillic 'о' (if 'a' is too circular).  
  - **Step 5:** **"Both"** if no collisions. If collisions in Cyrillic, output *Only Latin*.  
  - **Verdict:** Requires escalation to negotiate with client: either adjust design for Cyrillic distinctiveness or accept limited usage.  

  **Case 3: Founder's "Signature a" (detached bowl + swirl)**  
  - **Step 1:** Fails (junior and 1 other call it "ornament" or "e").  
  - **Step 2:** Path breaks when bowl detaches (intermediate resembles 'c' or 'e').  
  - **Step 3:** Fails (collides with 'o' and 'g').  
  - **Step 4:** Fails (swirl inconsistent with typical family traits).  
  - **Verdict:** **Not an 'a'.** It’s a stylistic ornament—fine for logos, but not for text faces. Escalate for rebranding discussion.  

  ---

  ### **One-Page Studio Handbook Version**  

  **PROCEDURE: VALIDATING AN "a" GLYPH**  
  *(Time: 10 min. Tools: Glyph printout, full alphabet sheet, reference words ["navy," "tea," "road"])*  

  1. **BASIC RECOGNITION**  
     - Show glyph **alone** to 2 people.  
     - ✔️ Pass: Both say "a" instantly.  
     - ❌ Fail: >1 says something else → *Unreadable*. **STOP.**  

  2. **DEFORMATION TEST**  
     - Sketch 5 steps from reference 'a' (Helvetica/Garamond/Futura) to your glyph.  
     - ✔️ Pass: All steps look like 'a'.  
     - ❌ Fail: Any step loses 'a'-ness (e.g., looks like 'o') → Note where it breaks.  
     - ⚠️ Escalate if: Style-dependent (e.g., works for display but not text).  

  3. **RELATIONAL CHECK**  
     - Compare to **o, d, q, g** in pairs and in "road"/"rood."  
     - ✔️ Pass: No confusion at 10pt.  
     - ❌ Fail: Ambiguous with any → *Collision with [letter]*. **STOP.**  

  4. **STYLE CONSISTENCY**  
     - Place between **n, o, m**. Check strokes, terminals, curves.  
     - ✔️ Pass: Feels like same family.  
     - ❌ Fail: Clearly mismatched → *Style intruder*.  
     - ⚠️ Escalate if: Minor inconsistencies (e.g., slight width difference).  

  5. **HOMOGLYPH? (If applicable)**  
     - Test recognition with speakers of both scripts.  
     - ✔️ Pass: Unambiguous in both → **"Both"** (verify no script collisions).  
     - ❌ Fail: Fails one/both → *Only [script]* or *Neither*.  

  **OUTCOME:**  
  - Pass all → Valid 'a'.  
  - Fail any step → Not an 'a' (specify reason).  
  - Escalate judgment calls (hesitation, style drift, homoglyph collisions).  

  **WHAT THIS CAN'T DO:**  
  - Judge aesthetic quality ("is it beautiful?").  
  - Assess family harmony ("does the whole system work?").  
  - Handle scripts without established readers (no reference community).  
  - Replace client negotiations or senior design decisions.  

  **WHEN IN DOUBT:** ESCALATE.  
  *(Updated: [Date])*  

  ---  
  This procedure prioritizes functionality over philosophy, isolates failure modes, and forces clear escalation points. For your "signature a," it delivers the hard truth: it’s not an 'a'. Use the handbook version to standardize reviews—no theory required.
