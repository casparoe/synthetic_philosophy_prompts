prompt: |-
  Writing a dissertation prospectus (2000 words, and my commitee keeps saying: one question, a method, and a way it could fail — not a survey of the literature). Topic is the etiological vs causal-role fight about biological function.

  My half-formed idea: the two camps are answering different contrastive questions — one asks why this trait has this form rather than the alternatives, the other asks what the trait contributes to some containing system's capacity — and a lot of the stock counterexample trades (the first heart, vestigial organs, a trait that's been co-opted into a new role) only look like collisions because nobody fixed the contrast. But I can't tell if that's a real unifying move or just "everyone is a bit right," which I'd get torn apart for.

  The case class I actually want to build the thing around is traits caught mid-exaptation: selection history for role A, current causal contribution to role B, B only weakly fitness-enhancing now but getting stronger across generations. I want to say function ascriptions here should be time-indexed or graded rather than yes/no, with an explicit story about how much selection pressure it takes before a "new" function exists — there's a sorites lurking, since the earliest tokens of a trait can't have a selected-effect function at all, so there has to be some bootstrapping account, and my guess is the two theories disagree exactly about when the function shows up.

  Turn that into the prospectus: the question stated so it could come out either way, why the existing positions leave it open, what I'd actually do month by month, what a finished result would look like, and an honest failure condition — including whether grading function just relocates the vagueness one step. Also tell me what the method even is given I can't run experiments: conceptual analysis, toy modelling, something else? No citations or bibliography, I'll add those myself.
