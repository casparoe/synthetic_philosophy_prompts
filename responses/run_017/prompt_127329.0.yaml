      A: Trust them. (DD, TA, GR if they have positive reasons about experts)
      B: Do not trust them without positive reasons. (LR, GR if they lack positive reasons about experts)
      C: Trust is not necessary; I accept it based on their authority. (VD)

    But GR might trust if they have positive reasons about experts, which they might have, so A might include GR.

    We need to assume they have no prior knowledge about the field or the expert beyond that they are recognized.

    For GR, they might have a positive reason from the general reliability of experts. So they would trust.

    For LR, they would require positive reasons for this particular expert or this particular testimony, which they don't have, so they would not trust.

