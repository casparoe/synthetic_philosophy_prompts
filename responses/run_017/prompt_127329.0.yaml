  ### Key Design Notes:
  1. **Assumptions**: 
     - Humans generally try to be helpful (Q7).
     - Experts in a field are usually competent (Q6, Q8).
     - Children in ideal conditions are truthful but not experts (Q1).

  2. **Your Colleague Case (Q2)**: 
     - This is the keystone. Reductionists (LR/GR) and hybrids (H1/H2) see the lack of "yes" cases as incompetence requiring evidence. DD/TA/VD focus on 90% accuracy as "good enough," prioritizing outcomes over process.

  3. **Career Reflection**: 
     - **DD/TA** best justifies taking numbers on faith: science assumes testimony is reliable unless defeated. 
     - **LR/GR** would require constant verification, making large-scale collaboration inefficient. 
     - **VD** dismisses the "faith" aspect as misphrasing: you relied on institutional norms, not epistemology.

  4. **Audience Adaptation**: 
     - Cases mirror scientific contexts (experts, chains of citation, unreliable subdomains).
     - No citations or leading questions; distinctions emerge from answer combinations.

  5. **Uncovered Area**: 
     - Social testimony (e.g., gossip vs. data) isn't fully separated. Adding a case like *"A rival team shares unpublished findings supporting your hypothesis"* could split DD from TA.
