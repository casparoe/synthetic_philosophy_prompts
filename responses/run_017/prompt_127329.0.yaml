    Case: "You are in a city whose language you don't speak. A stranger gives you directions using gestures. Do you trust them?"

    Options:
      A: Yes, by default. (DD, TA)
      B: Yes, but only if I have a positive reason to trust strangers here. (GR, LR)
      C: No, because I can't communicate to verify. (VD, or cautious view)

    This can separate DD/TA from reductionism.

