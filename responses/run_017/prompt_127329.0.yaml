  We are building a quiz to sort people into different philosophical positions about testimony. The positions we want to cover are:

  1. Global Reductionism (GR): Testimony is not a basic source of knowledge; one must have positive reasons (based on other sources) to trust testimony in general.
  2. Local Reductionism (LR): For each testimony, one must have positive reasons (based on other sources) to trust that particular testimony.
  3. Default and Defeat / Entitlement View (DD): Testimony is a basic source of knowledge; one is entitled to trust by default unless there are defeaters.
  4. Trust or Assurance View (TA): Testimony is justified by the assurance of the speaker and the trust between speaker and hearer.
  5. Hybrid View (H): A combination of elements from the above (we'll specify one).
  6. Verbal Dispute (VD): The dispute is merely about words; all parties agree on the practical upshot.

  We also note that the quiz should have 8-9 questions (cases). We are given 7 cases and we can add 1-2 more to complete.

  Given cases (with underlying ideas):

  1. The seven-year-old with perfect track record on weather (but limited experience and no lies).
  2. The colleague who is right 90% of the time by always saying "no" (because 90% of the time the answer is no) but never says "yes".
  3. A claim through a chain of twelve people, each vouching for the next, and you can check none.
  4. Someone who has been right about everything you verified, but you only checked the easy cases.
  5. A generally scrupulous person testifying about the one topic they are unreliable about.
  6. An expert from an adjacent field telling you something in your field that you think is impossible.
  7. Directions from a stranger in a city where you don't speak the language.

  We need one or two more cases. Let's add:

  8. A case where the testimony is about a very complex topic that you cannot understand, but the testifier is a recognized expert (to see if expertise matters without comprehension).
  9. A case where the testimony is from a known liar, but in a context where lying would be very costly (to test the role of incentives).

  But note: we want to cover the logical space and the positions. We might also consider a case that tests the role of the speaker's intentions (e.g., a case where the speaker is known to be truthful but you have reason to think they are mistaken).

  However, to keep it to 8, let's add one:

  8. A recognized expert in a field you know nothing about testifies about a complex fact in their field. (This tests whether we trust expertise without any personal ability to verify.)

  Now, we design the questions and options such that the answers lead to a leaf (a position). We must map the answer patterns to the leaves.

