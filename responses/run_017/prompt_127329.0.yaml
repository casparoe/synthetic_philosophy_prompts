      A: Yes, because they are an expert. (DD, TA)
      B: Yes, but only because I have positive reasons to trust experts in general. (GR)
      C: No, because I have no way to verify and no positive reasons specific to this testimony. (LR)
      D: Trust by default unless there is a defeater. (DD)

