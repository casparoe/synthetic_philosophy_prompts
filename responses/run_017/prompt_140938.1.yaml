  We are building a self-scoring classification instrument for moral uncertainty. The goal is to sort readers by their responses to concrete cases without using jargon or named positions. The tree will be built from questions (nodes) that are phrased as "what do you do in this case?" or in plain language. The logical space is defined by key distinctions, and the leaves are positions (named if standard, otherwise "unnamed") with a note on an awkward commitment.

  ### Step 1: Logical Space and Key Distinctions

  The key distinctions (branches) that structure the logical space:

  1. **Uncertainty Type**: Is the uncertainty about non-moral facts (with moral implications) or about moral principles themselves? This is the first branch because it is fundamental and prevents mis-sorting.

  2. **Currency of Aggregation**: If the uncertainty is moral, are we aggregating over the *value* (how good/bad) of outcomes or over *deontic status* (permitted, forbidden, required)? This distinguishes views that maximize expected value from those that focus on avoiding wrongdoing.

  3. **Aggregation Method**: If aggregating, how do we compare and scale differences across moral views? This includes whether to aggregate at all, and if so, how to handle intertheoretic comparisons.

  4. **Agent Type**: Is the agent deciding for themselves or for a group with disagreement? This may be a later branch because it applies only in specific contexts.

  5. **Self-Effacement and Higher-Order Uncertainty**: Does the rule for uncertainty apply to itself? And is the rule expected to be self-effacing? This is complex and might be handled at the end.

  Given the constraints, we'll structure the tree with the most fundamental distinctions first. The primary branches:

  - **Branch 1: Uncertainty Type** (non-moral vs. moral) - This does the most work because it separates two fundamentally different kinds of problems.
  - **Branch 2: For moral uncertainty, what is the currency?** (value vs. deontic status) - This separates consequentialist-style aggregation from deontological concerns.
  - **Branch 3: Aggregation across views?** (if aggregating, how to handle scaling and intertheoretic comparisons) - This further refines the aggregative views.
  - **Branch 4: Agent Type** (individual vs. group) - We'll only branch here when relevant, to avoid clutter.
  - **Branch 5: Self-effacement and higher-order uncertainty** - We'll handle this at the end for the views that require it.

  But note: not every branch will be taken by every path. We'll design the tree so that some branches are only for specific cases.

  ### Step 2: Leaves (Positions)

  We aim for 10-12 leaves. Each leaf is a position in the logical space, described by the combination of answers. We include:

  1. **Expected Moral Value (EMV) Aggregator**: Aggregates expected performance across moral views by maximizing expected choiceworthiness. *Awkward commitment*: Must make intertheoretic comparisons even when theories are incommensurable.

  2. **My Favorite Theory (MFT)**: Act on the moral view you believe is most likely true. *Awkward commitment*: Ignores the possibility that a low-credence theory might have extremely high stakes.

  3. **Leximin (Pessimistic/Risk-Averse)**: Gives lexical priority to avoiding the worst possible outcome according to any theory you hold. *Awkward commitment*: Can lead to extreme sacrifices for a tiny chance of avoiding a catastrophe that only one theory predicts.

  4. **Proportional Satisfaction (Compromise)**: Splits resources or chooses mixed options to satisfy each moral view in proportion to their credence. *Awkward commitment*: May produce an outcome that no theory endorses.

  5. **Deontic-focused Aggregator (e.g., Minimize Expected Wrongness)**: Focuses on avoiding actions that are forbidden by any theory with significant credence. *Awkward commitment*: Might forbid actions that are only slightly disfavored by a low-credence theory if that theory deems them forbidden.

  6. **Skepticism (No Moral Uncertainty)**: Believes that either there is no genuine moral uncertainty (because one view is certain) or that hedging is a vice. *Awkward commitment*: May lead to extreme actions if the chosen view is wrong.

  7. **Normative Externalism**: When uncertain, one should use a non-moral decision rule (e.g., maximize expected non-moral value). *Awkward commitment*: The decision rule is not itself morally justified.

  8. **Multiplicative Aggregation**: A form of aggregating that multiplies the value differences by a scaling factor (e.g., variance-based). *Awkward commitment*: Requires a scaling method that might be arbitrary.

  9. **Option-Preservation (Precautionary)**: Preserves options for the future when current credences might change. *Awkward commitment*: Might spend resources on preserving options that are never used.

  10. **Group Compromise (for group decisions)**: When deciding for a group, split the difference to respect each member's view. *Awkward commitment*: The group might end up with a decision that none of the members prefer.

  11. **Higher-Order Aggregation**: The rule for moral uncertainty is applied recursively to its own uncertainty. *Awkward commitment*: May lead to infinite regress or complex calculations.

  12. **Unnamed: Deontic Threshold View**: An action is permitted if no theory you hold with credence above a threshold forbids it. *Awkward commitment*: Setting the threshold is arbitrary.

  We have 12 leaves. Some are named (if standard), others are unnamed.

