  Below is a self-scoring classification instrument for moral uncertainty, designed as a decision tree with concrete cases. It meets your constraints: no named positions, authors, or first-order theories; distinctions carried by case-based verdicts; inclusion of your four required cases; and classification of 12 leaves. The tree starts with the most fundamental distinction (moral vs. non-moral uncertainty) and progresses to finer splits. Scoring is path-based, with guidance for edge cases.  

  ---

  ### **Logical Space Structure**  
  The tree is built from five load-bearing questions (nodes), ordered by diagnostic power:  
  1. **Uncertainty type** (moral vs. non-moral): Highest-priority branch. Mis-sorting occurs if users conflate moral uncertainty with factual uncertainty.  
  2. **Currency of choice** (value vs. deontic status): Separates views focused on "how good" from "whether permitted."  
  3. **Aggregation stance** (whether to aggregate views, and how): Splits non-aggregators, aggregators with scaling, and unscalable cases.  
  4. **Agent perspective** (individual vs. group): Activated only when aggregation occurs.  
  5. **Rule stability** (self-effacing vs. stable): Final branch for aggregators, using a case about preserving options.  

  ---

  ### **Diagnostic Tree: Cases and Questions**  
  *Instructions: Answer each question based on your intuitive verdict. Follow the path of your answers to find your position.*  

  #### **Node 1: Moral vs. Non-Moral Uncertainty**  
  **Case: The Embryo Research Funding**  
  > *You must decide whether to fund medical research using human embryos. You are certain about the facts: the research could save many lives, but it requires destroying embryos. You are unsure whether embryos have moral status. One view (credence 60%) says embryos lack moral status, so funding is good. Another view (credence 40%) says embryos are persons, so funding is murder and forbidden.*  
  > **What do you do?**  
  > - **A. Fund it.** The benefits outweigh the risks.  
  > - **B. Do not fund it.** The risk of murder is too high.  
  > - **C. Delay funding to gather more evidence (e.g., scientific data on embryo development).**  
  > - **D. Split the difference (e.g., fund less controversial research).**  

  *Scoring:*  
  - **A or B → Proceed to Node 2** (You see this as moral uncertainty).  
  - **C → Leaf 1: Non-Moral Hedger** (You treat moral status as a factual uncertainty).  
  - **D → Leaf 2: Compromiser** (You split by default; see "Splitting Case" in Node 4).  

  #### **Node 2: Currency of Choice (For Moral Uncertainty from Node 1A/B)**  
  **Case: The Painkiller Dose**  
  > *A patient is dying in severe pain. You can give a high dose of painkiller that will certainly ease their suffering but has a 5% chance of shortening their life. One view (credence 75%) says this is acceptable (easing suffering justifies the risk). Another view (credence 25%) says shortening life is always forbidden, no matter the benefit.*  
  > **What do you do?**  
  > - **A. Give the dose.** The high chance of benefit outweighs the small risk of harm.  
  > - **B. Do not give the dose.** Even a small chance of wrongdoing is unacceptable.  

  *Scoring:*  
  - **A → Node 3** (You focus on quantifying outcomes; currency is "value").  
  - **B → Node 5** (You focus on permissions; currency is "deontic status").  

  #### **Node 3: Aggregation Stance (For Value-Focused from Node 2A)**  
  **Case Pair: Scaling & Tiny Credence**  
  > **Part 1 (Scaling):** *You must allocate $1M between two projects. Project A saves 100 humans. Project B saves 10,000 fish. One view (credence 50%) says only humans matter (A is better by 100 "units"). Another view (credence 50%) says fish matter equally (B is better by 9,900 "units").*  
  > **Part 2 (Tiny Credence):** *A third view (credence 0.1%) says killing fish is a cosmic wrong, worse than any human death. If this view is true, Project B is catastrophic.*  
  > **What do you do?**  
  > - **A. Choose Project A.** The human-centric view is more credible, and the fish view's units are exaggerated.  
  > - **B. Choose Project B.** The fish view shows a larger benefit difference.  
  > - **C. Split the money 50-50.**  
  > - **D. Choose Project A and avoid Project B entirely.** The tiny risk of cosmic wrong is too scary.  

  *Scoring:*  
  - **A → Leaf 3: Unscaled Aggregator** (You aggregate but reject intertheoretic comparisons).  
  - **B → Node 4** (You scale differences across views).  
  - **C → Leaf 4: Proportional Satisfier** (You compromise by default).  
  - **D → Leaf 5: Pessimist** (You avoid worst-case outcomes).  

  #### **Node 4: Agent Perspective (For Scalers from Node 3B)**  
  **Case: Group Budget Decision**  
  > *Your team has $10K to donate. Two members disagree: Alice (60% influence) wants to fund health camps (saves lives). Bob (40% influence) wants to fund art grants (enriches lives). A mixed option exists: split funds proportionally.*  
  > **What do you do?**  
  > - **A. Fund health camps.** Alice’s view has higher influence.  
  > - **B. Split proportionally (e.g., $6K health, $4K art).**  
  > - **C. Fund whichever has higher expected impact per dollar.**  

  *Scoring:*  
  - **A → Leaf 6: Dominant View Aggregator** (You maximize expected value but defer to strongest view).  
  - **B → Leaf 7: Group Compromiser** (You split to satisfy all parties).  
  - **C → Leaf 8: Expectation Maximizer** (You scale and compare numerically).  

  #### **Node 5: Deontic Response (For Deontic-Focused from Node 2B)**  
  **Case: The Deontic Threshold**  
  > *You can take an action that your main view (credence 90%) says is obligatory and good. A minor view (credence 10%) says it is forbidden. The minor view is not extreme (no cosmic wrong), but it’s firm.*  
  > **What do you do?**  
  > - **A. Take the action.** The minor view is too unlikely to matter.  
  > - **B. Avoid the action.** Any non-zero chance of wrongdoing is unacceptable.  
  > - **C. Take the action but with safeguards (e.g., add contingencies).**  

  *Scoring:*  
  - **A → Leaf 9: Belief-Firster** (You act on your dominant belief).  
  - **B → Leaf 10: Deontic Purist** (You forbid any action vetoed by any view).  
  - **C → Node 6** (You preserve optionality).  

  #### **Node 6: Rule Stability (For Optionality-Preservers from Node 5C)**  
  **Case: Future Option Preservation**  
  > *You can spend $100 now to preserve an option (e.g., buy a reversibility right) in case you later adopt a view you currently reject. Your current views (99% credence) say this is wasteful. The possible future view (1% chance) says it was essential.*  
  > **What do you do?**  
  > - **A. Spend the $100.** You might be wrong now.  
  > - **B. Do not spend it.** Stick with your current best judgment.  

  *Scoring:*  
  - **A → Leaf 11: Self-Effacing Aggregator** (Your uncertainty rule applies to itself).  
  - **B → Leaf 12: Stable Aggregator** (Your rule is fixed).  

  ---

  ### **Leaves (Positions)**  
  Classified by answer combinations. Each includes one-sentence "awkward commitment":  
  1. **Non-Moral Hedger** (Node 1C): Treats moral uncertainty as factual. *Awkward: Moral debates become science projects.*  
  2. **Compromiser** (Node 1D): Splits by default. *Awkward: May satisfy no one's principles.*  
  3. **Unscaled Aggregator** (Node 3A): Aggregates but rejects scaling. *Awkward: Cannot resolve large disparities.*  
  4. **Proportional Satisfier** (Node 3C): Mixes options. *Awkward: Creates "franken-actions" no view endorses.*  
  5. **Pessimist** (Node 3D): Avoids worst-case outcomes. *Awkward: Paralysis in high-stakes tradeoffs.*  
  6. **Dominant View Aggregator** (Node 4A): Maximizes via strongest view. *Awkward: Ignores minority stakes.*  
  7. **Group Compromiser** (Node 4B): Splits across disagreements. *Awkward: Group may get suboptimal results.*  
  8. **Expectation Maximizer** (Node 4C): Quantifies/compares value. *Awkward: Arbitrary scaling across theories.*  
  9. **Belief-Firster** (Node 5A): Acts on dominant belief. *Awkward: Gambles with low-probability wrongs.*  
  10. **Deontic Purist** (Node 5B): Forbids vetoed actions. *Awkward: Over-vetoes trivial risks.*  
  11. **Self-Effacing Aggregator** (Node 6A): Recursively applies rule. *Awkward: Infinite regress or costly hedging.*  
  12. **Stable Aggregator** (Node 6B): Fixed rule. *Awkward: Rule may be self-undermining.*  

