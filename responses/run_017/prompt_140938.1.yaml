  ### **Additional Elements**  
  1. **Unoccupied Combinations** (and reasons):  
     - **Value-focused + Deontic purist**: Incoherent (value aggregation relies on weighing, deontic purism rejects weighing).  
     - **Group compromiser + Self-effacing**: Unexplored (group dynamics make recursive rules intractable).  

  2. **Indistinguishable Pairs** (and fixes):  
