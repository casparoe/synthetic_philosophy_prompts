     - **Self-Effacing Aggregator (Leaf 11)** requires optionality-preservation in multiple contexts. *Scoring*: Assign only if "C" in Node 5 and "A" in Node 6.  

  4. **Mis-sorting Mitigation**:  
     - **At Node 1 ("It depends")**: Add a **"Not Sorted" leaf** for ambiguous answers. Reason: Uncertainty type is foundational; rephrasing won’t help.  
     - **At Node 3 (Scaling)**: Add a **sub-question** for non-aggregative reasons (e.g., "Did you avoid B because of risk or incommensurability?").  
     - **At Node 5 (Deontic)**: **Drop the distinction** between "B" and "C" if the user cites non-deontic motives. Reason: Deontic/non-deontic is clean; operationalizing "blameworthiness" is noisy.  

