answer: |-
  Here’s a joint statement both sides could sign, followed by clear disagreements and concrete tests using your cases. Designed for clarity and debate-readiness.

  ---

  **Agreed Claims: What Both Sides Sign Onto**  
  *(Contextualists & Pragmatic Encroachment Theorists)*  

  1.  **Stakes Sensitivity is Real:** Whether ordinary speakers are willing to flatly say "S knows that P" *does* genuinely shift depending on the practical stakes facing the person acting on P (or the person evaluating whether to rely on S). This isn't just politeness, hedging, or nervousness; it reflects something deep about how "knows" works or what knowledge requires.
  2.  **Plain Invariantism is Wrong:** The view that whether someone knows P is *only* ever determined by their evidence/belief and the truth of P (and maybe other "pure" epistemic factors like reliability), and *never* by practical stakes, is incorrect. Stakes *do* make a difference.
  3.  **Facts & Evidence Don't Change:** The practical stakes do not change the facts of the matter (e.g., the flight time) or the quality/strength of the agent's evidence itself. Whatever stakes affect must be something else.
  4.  **Knowledge Licenses Action & Assertion:** Knowledge is the normative standard for flat-out assertion ("P is true") and for acting as if P is true in practical reasoning ("I'll plan based on P being true"). If you know P, you are generally epistemically entitled to assert it flat-out and to act on it without further checking (absent special defeating factors).
  5.  **The Core Question:** The central disagreement is about *what exactly stakes affect*: Does the meaning/standard of "knows" shift with the context of the person *saying* "knows" (Contextualism)? Or do stakes change whether the agent actually *possesses* the knowledge relation, even if the standard for "knows" is fixed (Pragmatic Encroachment)?

  ---

  **Disagreements Table: The Core Splits**  
  *(Each side's phrasing of the key disputed claim)*

  | Disputed Claim                                                                 | Contextualist Phrasing (Agreed by Contextualists)                                                                 | Pragmatic Encroachment Phrasing (Agreed by Encroachment Theorists)                                                                 |
  | :----------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------------- |
  | **What Stakes Affect:**                                                        | Whether a claim "S knows that P" is true depends on the epistemic standards relevant in the context of the person *attributing* or *denying* knowledge. | Whether S *possesses knowledge that P* depends on the practical stakes facing S (the believer/agent) in the situation where they are relying on P. |
  | **Nature of "Knows":**                                                         | The word "knows" expresses different relations (sets of requirements) in different conversational contexts.        | The word "knows" expresses a single, stable relation between an agent and a proposition.                                           |
  | **Truth-Value of Attributions:**                                               | "S knows that P" can be truly asserted in a low-stakes context while "S does not know that P" is truly asserted in a high-stakes context, *even about the same S and P at the same time*. | "S knows that P" has a single truth-value relative to S's actual epistemic and practical situation at that time. Conflicting attributions in different contexts cannot both be *ultimately* correct; one must be mistaken about S's actual epistemic standing. |
  | **Source of Standards/Stakes Influence:**                                      | The relevant standards for "knows" are set by the practical purposes and presuppositions of the *conversation* where the knowledge claim is made. | The stakes that matter are the objective practical costs of being wrong *for the agent S* in their actual decision-making situation. |

  ---

  **Crux Cases, Predictions & Potential Evidence**

  **Crux 1: The Calm Bystander**  
  *Case:* You (high stakes) are driving. Bystander (low stakes, watching) says "He knows the flight's at 8:20." Your brother-in-law (high stakes, in the car) says "He doesn't know that!" Are *both* their claims correct?  
  *   **Contextualist Prediction:** **YES.** The bystander speaks in a low-stakes context (for them), so "knows" has a lower standard. "He knows" is true *in their context*. Brother-in-law speaks in a high-stakes context (in the car), so "knows" has a higher standard. "He doesn't know" is true *in that context*. Both correct relative to their own contexts.  
  *   **Encroachment Prediction:** **NO.** Knowledge is a fact about *you* (the believer). If the high stakes *for you* mean you don't know (as Encroachment holds), then the bystander is **wrong** to say "He knows," even if they are unaware of the stakes. Brother-in-law is **right** to say "He doesn't know." Only one claim is objectively true.  
  *   **Evidence for Contextualist:** If ordinary speakers consistently judge both statements as acceptable/true when described from their respective viewpoints without contradiction.  
  *   **Evidence for Encroachment:** If ordinary speakers, when pressed to say what the *real* situation is *for the driver*, side with the brother-in-law's denial, even after considering the bystander's perspective.

  **Crux 2: Unaware Hiker**  
  *Case:* Hiker has excellent evidence (map, signs) the trail goes left. She's confident. *Unbeknownst to her*, the group's water is nearly gone; missing the trail means disaster. Does she still *know* the trail goes left?  
  *   **Contextualist Prediction:** **YES (in many contexts).** Her evidence is strong. If *we* (low-stakes evaluators) say "She knows," our claim is true *in our context*. The *hidden* stakes *for her* don't change her epistemic state. Whether a high-stakes attributor (e.g., a thirsty group member) could truly say "She doesn't know" is a separate question about *their* context.  
  *   **Encroachment Prediction:** **NO.** Knowledge depends on the *objective* stakes in the agent's situation, even if she's unaware of them. Her being wrong would be disastrous, so she lacks the requisite epistemic position to *know*, despite her strong evidence and confidence.  
  *   **Evidence for Contextualist:** If people readily attribute knowledge to the hiker when the focus is purely on her evidence and belief, downplaying the unknown stakes.  
  *   **Evidence for Encroachment:** If people judge that, given the *actual* situation she's in (even if she doesn't know it), she *shouldn't* act solely on her belief without checking, implying she didn't actually *know*.

  **Crux 3: Group Stakes, Personal Immunity**  
  *Case:* Agent is confident the safe combination is 12-34-56 (good evidence). If she's wrong, the team's vital mission fails catastrophically. *However, she personally faces no consequences at all* (e.g., gets paid regardless). Does she know the combination?  
  *   **Contextualist Prediction:** **YES (in many contexts).** The relevant epistemic standards for an attributor are typically set by the attributor's context, not necessarily the agent's personal stakes. An attributor focused only on her evidence might truly say "She knows." An attributor focused on the mission's stakes might truly deny it. Her *personal* immunity likely doesn't shift the standard *for her knowledge*.  
  *   **Encroachment Prediction:** **PROBABLY NO (but debatable).** Encroachment focuses on the stakes in the agent's *practical reasoning situation*. Here, the stakes *for the decision she is making* (entering the combo) are objectively very high *for the group whose plan she is executing*. If knowledge is what licenses action, and the action has high objective stakes, she may lack knowledge *for this action* even without personal risk. (Some Encroachment theorists might tie it more tightly to *personal* stakes; this case probes that boundary).  
  *   **Evidence for Contextualist:** If people readily attribute knowledge when focusing on her evidence/personal situation, and only deny it when focusing on the mission context ("*We* can't rely on just her knowing it!").  
  *   **Evidence for Encroachment:** If people judge that, *given what's riding on her being right*, her evidence isn't sufficient *for her* to truly *know* it in this high-stakes action, even with personal immunity.

  **Crux 4: Bad Motives/Stupid Goals**  
  *Case:* Agent is trying to cash a forged check. She confidently believes (based on decent but fallible evidence like past hours) that the bank is open. If it's closed, her forgery attempt fails and she's ruined. Does she *know* the bank is open?  
  *   **Contextualist Prediction:** **YES (in many contexts).** The standard for "knows" is set by conversational context, not the moral quality of the agent's goals. An attributor focusing on her epistemic situation relative to the bank's hours (low stakes *for that fact*) could truly say "She knows it's open." An attributor focused on her high-stakes criminal plan might deny it. Her bad motive doesn't *directly* affect her epistemic standing regarding the bank's hours.  
  *   **Encroachment Prediction:** **YES, SHE LACKS KNOWLEDGE (but this is a problem).** Knowledge depends on the objective practical stakes *for the agent* in their situation. Here, the stakes *for her* are objectively high (ruin). Therefore, Encroachment seems committed to saying she doesn't know the bank is open, *because* her criminal plan makes the stakes high. **Both sides AGREE this is an uncomfortable result for Encroachment.**  
      *   *Encroachment Response/Clarification:* Encroachment theorists *don't* think bad motives *cause* lack of knowledge. Rather, it's the *high stakes*, which are *caused by* the bad motives. They bite the bullet: knowledge is harder to get when the cost of error is high, regardless of *why* the cost is high. They might argue that denying knowledge here is intuitively correct *if* we focus on her high-stakes action ("Does she *know* it's open? Her whole plan depends on it!").  
  *   **Evidence for Contextualist:** If people readily separate the epistemic question ("Does she have good reason to think it's open?") from the moral stakes, attributing knowledge about the bank hours while condemning the plan.  
  *   **Evidence for Encroachment:** If people judge that the high stakes (even from bad motives) mean she *doesn't* genuinely *know* it's open for the purpose of her risky action.

  **Crux 5 (Optional): Embedded "Knows"**  
  *Case:* Considering a scenario later, a low-stakes person says: "If he *knew* the flight time, why did he double-check?" or "My brother-in-law insisted he didn't *know* the flight time." Does the meaning of "knew" here shift with the current speaker's context, or is it fixed by the original context?  
  *   **Contextualist Prediction:** **SHIFTS.** The standard for "knows" in embedded clauses is generally set by the context of the person *making the overall statement*. The low-stakes speaker uses "knew" with their current, low standard.  
  *   **Encroachment Prediction:** **FIXED (generally).** "Knew" refers to the knowledge relation. Its truth depends on whether the agent *actually knew* at the time, given *their* epistemic and practical situation. The current speaker's stakes don't change that past fact.  
  *   **Why this matters:** If embedding behavior consistently follows Contextualism, it supports the "shifty" semantics. If it consistently follows the original agent's context, it supports Encroachment's "stable fact" view. (Data is mixed and debated).

  ---

  **The "Just Words" Part?**  
  Both sides agree the *phenomenon* (stakes sensitivity in knowledge talk) is real and important. **The core disagreement is NOT merely verbal.** They genuinely disagree about *what that phenomenon reveals*: a fundamental context-sensitivity in the *word* "knows" (Contextualism) or a stakes-dependence in the *state* of knowledge itself (Encroachment). The test cases above are designed to pry *that* difference apart. However, debates about *specific examples* often involve disagreements about how ordinary speakers *use* words ("What would we *say* in case X?"), which is why concrete cases are crucial evidence for both sides. The disagreement is about what underlies and explains that usage.

  ---

  **Use this at Thanksgiving:** Read the Agreed Claims first to establish common ground. Then pick a Crux Case, read the case itself, then each side's prediction. Argue about what *you* think about that case and why. That argument *is* the philosophical debate made concrete. Good luck!
