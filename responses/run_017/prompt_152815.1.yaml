prompt: |-
  I'm a PhD student in formal epistemology, and I'm writing the take-home final for an upper-level seminar on anthropic reasoning. I need one question on the self-sampling assumption versus the self-indication assumption that a student cannot pass by reciting the presumptuous-philosopher slogan that SIA favours hypotheses with more observers.

  The case I want to build it around comes in two variants. Variant A: a fair coin is flipped; if heads, exactly ten observers are created, all wearing red shirts; if tails, a thousand observers are created, ten in red and nine hundred and ninety in blue. You wake up and find yourself wearing red. Variant B: same coin, but if heads ten observers are created with one in red and nine in blue, and if tails a thousand observers are created with a hundred in red and nine hundred in blue; again you find yourself in red. My thought is that these numbers make the two principles trade places: in one variant the big-world-friendly principle is the one that treats your red shirt as uninformative, and in the other it is the one that treats it as decisive, so that neither principle can simply be identified with the presumptuous philosopher's inference. Please check that arithmetic yourself rather than taking my word for it, and tell me if I have misdesigned the case.

  What I need is: (1) the exam question itself, framing both variants for students, with a stated limit of forty minutes and a nine-hundred-word cap; (2) a model answer of about six hundred words; (3) a marking scheme out of twenty built on four or five must-hit points, with the marks each is worth and one line on the error that should cost a student marks there. The points I have in mind are: the explicit SIA calculation, showing why the prior boost cancels in one variant but not the other; the explicit SSA calculation; a diagnosis of what the residual disagreement is really about, given that the SSA verdict is hostage to whether the blue-shirted observers belong to the reference class; what happens to each verdict if the reference class is narrowed to red-shirted observers; and whether the pair of variants settles, or merely relocates, the presumptuous-philosopher worry. Regroup these if you think I have located the crux wrongly. Assume the students have no readings to hand: the question must be self-contained and must ask only for their own reasoning and arithmetic.
reasoning: |-
  We are designing an exam question for a PhD student in formal epistemology. The question should focus on the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) in two variants (A and B) of an anthropic thought experiment. The goal is to avoid a simplistic "SIA favors more observers" response and instead show that the principles behave differently in these two scenarios.

  ### Step 1: Design the Exam Question
  We'll frame the question to require explicit calculations for both SSA and SIA in both variants, and then ask for a discussion of the underlying issues (reference class, presumptuous philosopher).

  ### Step 2: Verify the Arithmetic
  Let's verify the arithmetic for both variants.

  **Variant A:**
  - Heads (H): 10 observers, all red.
  - Tails (T): 1000 observers, 10 red and 990 blue.
  - You wake up in red.

  **Variant B:**
  - Heads (H): 10 observers: 1 red, 9 blue.
  - Tails (T): 1000 observers: 100 red, 900 blue.
  - You wake up in red.

  We are to compute the posterior probability of heads (H) given that you are a red-shirted observer (R) under both SSA and SIA.

  #### Definitions:
  - **SSA**: We sample uniformly from all observers in the reference class (which by default is all observers). The probability of an observation is proportional to the fraction of observers in that world that make that observation.
  - **SIA**: We condition on the fact that we exist (i.e., we are more likely to exist in worlds with more observers). The prior is adjusted by the number of observers (or by the total measure of observers). Then we apply SSA-like conditionalization.

  We assume a uniform prior over the worlds: P(H) = P(T) = 0.5.

  #### Calculations for Variant A:

  **SSA in Variant A:**
  - In H: all 10 observers are red -> P(R|H) = 1.
  - In T: 10 out of 1000 are red -> P(R|T) = 10/1000 = 0.01.
  - By Bayes:
    P(H|R) = [P(R|H) * P(H)] / [P(R|H)*P(H) + P(R|T)*P(T)] 
            = [1 * 0.5] / [1*0.5 + 0.01*0.5]
            = 0.5 / (0.5 + 0.005) 
            = 0.5 / 0.505 ≈ 0.9901

  So under SSA, after seeing red, we are very confident in heads.

  **SIA in Variant A:**
  - SIA adjusts the prior by the number of observers. We set:
    P(H) proportional to 0.5 * 10 = 5
    P(T) proportional to 0.5 * 1000 = 500
    So the new prior weights: P_sia(H) = 5/(5+500) = 5/505, P_sia(T)=500/505.

  Now, conditional on being red:
  - In H: all 10 are red -> P(R|H)=1.
  - In T: 10 out of 1000 are red -> P(R|T)=0.01.

  Then:
    P_sia(H|R) = [P(R|H) * P_sia(H)] / [P(R|H)*P_sia(H) + P(R|T)*P_sia(T)]
               = [1 * (5/505)] / [1*(5/505) + 0.01*(500/505)]
               = (5/505) / [ (5/505) + (5/505) ]   [because 0.01*500=5]
               = (5/505) / (10/505) 
               = 5/10 = 0.5

  So under SIA, the probability of heads is 0.5.

  #### Calculations for Variant B:

  **Variant B:**
  - Heads (H): 10 observers, 1 red, 9 blue -> P(R|H) = 1/10 = 0.1
  - Tails (T): 1000 observers, 100 red, 900 blue -> P(R|T) = 100/1000 = 0.1

  **SSA in Variant B:**
  - P(H|R) = [P(R|H)*P(H)] / [P(R|H)*P(H) + P(R|T)*P(T)]
           = [0.1 * 0.5] / [0.1*0.5 + 0.1*0.5]
           = 0.05 / (0.05+0.05) = 0.05/0.1 = 0.5

  So under SSA, the probability of heads is 0.5.

  **SIA in Variant B:**
  - Adjust the prior by the number of observers:
    P_sia(H) proportional to 0.5 * 10 = 5
    P_sia(T) proportional to 0.5 * 1000 = 500
    So P_sia(H)=5/505, P_sia(T)=500/505.

  Then:
    P_sia(H|R) = [P(R|H)*P_sia(H)] / [P(R|H)*P_sia(H) + P(R|T)*P_sia(T)]
               = [0.1 * (5/505)] / [0.1*(5/505) + 0.1*(500/505)]
               = [0.5/505] / [ (0.5/505) + (50/505) ]   [because 0.1*500=50]
               = (0.5/505) / (50.5/505)
               = 0.5 / 50.5 ≈ 0.0099

  So under SIA, the probability of heads is about 0.01 (very low).

  ### Step 3: Interpret the Results
  - In Variant A: 
      - SSA: P(H|R) ≈ 0.99 (strongly favors heads, the small world)
      - SIA: P(H|R) = 0.5 (no evidence either way)

  - In Variant B:
      - SSA: P(H|R) = 0.5 (no evidence)
      - SIA: P(H|R) ≈ 0.01 (strongly favors tails, the large world)

  Thus, we see that:
  - In Variant A, it's SSA that strongly favors the hypothesis with fewer observers (heads) because the red shirt is much more likely in that world. SIA remains neutral because the boost to the large world (T) is exactly canceled by the low chance of being red in that world.
  - In Variant B, it's SIA that strongly favors the large world (tails) because the large world has more observers and the chance of being red in the large world is the same as in the small world (so the prior boost for tails dominates). SSA remains neutral because the chance of being red is the same in both worlds.

  ### Step 4: The Exam Question

  **Exam Question:**

  You have forty minutes and a limit of nine hundred words to answer this question.

  Consider two variants of an anthropic thought experiment. In both, a fair coin is flipped. The setup is as follows:

  **Variant A:**
  - If the coin lands heads (H), exactly ten observers are created, all wearing red shirts.
  - If the coin lands tails (T), exactly one thousand observers are created: ten wearing red shirts and nine hundred ninety wearing blue shirts.

  **Variant B:**
  - If heads (H), ten observers are created: one wearing a red shirt and nine wearing blue shirts.
  - If tails (T), one thousand observers are created: one hundred wearing red shirts and nine hundred wearing blue shirts.

  In each case, you wake up and find yourself wearing a red shirt. We wish to compute the probability that the coin landed heads (H) given that you are a red-shirted observer. 

  Compute this probability under the Self-Sampling Assumption (SSA) and the Self-Indication Assumption (SIA) for both variants. 

  Then, address the following:

  1. Explicitly show why, under SIA, the posterior probability of heads in Variant A becomes 0.5 (neutral), while in Variant B it becomes very low (strongly favoring tails). Highlight the role of the prior boost and the conditional probability of being red.

  2. Under SSA, explain why the posterior for heads in Variant A is very high (favoring heads) and in Variant B is 0.5 (neutral). 

  3. Discuss how the reference class might affect the SSA calculation. Specifically, what happens to the SSA verdict in each variant if the reference class is narrowed to include only red-shirted observers? 

  4. What does the contrast between these two variants reveal about the relationship between SSA, SIA, and the "presumptuous philosopher" charge? Does it resolve the charge or merely relocate the disagreement?

  You may assume a uniform prior over the coin outcomes. Show all steps of your reasoning and calculations.

  ### Step 5: Model Answer (approx. 600 words)

  **Model Answer:**

  **Introduction (approx. 50 words):**
  This analysis computes the posterior probability of heads (H) given red-shirt (R) in Variants A and B under SSA and SIA. We show that neither principle consistently favors worlds with more observers, challenging the idea that SIA inherently promotes the "presumptuous philosopher" stance.

  **Calculations (approx. 350 words):**

  *Variant A:*
  - **SSA**: 
      P(R|H) = 1, P(R|T) = 10/1000 = 0.01.
      P(H|R) = [1 * 0.5] / [1*0.5 + 0.01*0.5] = 0.5 / (0.5 + 0.005) ≈ 0.9901.
      Thus, SSA strongly favors heads (small world).

  - **SIA**: 
      Adjust prior: P_sia(H) ∝ 0.5 * 10 = 5, P_sia(T) ∝ 0.5 * 1000 = 500 → P_sia(H)=5/505, P_sia(T)=500/505.
      P(R|H)=1, P(R|T)=0.01.
      P_sia(H|R) = [1 * (5/505)] / [1*(5/505) + 0.01*(500/505)] = (5/505) / [(5/505)+(5/505)] = 5/10 = 0.5.
      SIA remains neutral.

  *Variant B:*
  - **SSA**:
      P(R|H)=1/10=0.1, P(R|T)=100/1000=0.1.
      P(H|R) = [0.1*0.5] / [0.1*0.5 + 0.1*0.5] = 0.05/0.1 = 0.5.
      SSA remains neutral.

  - **SIA**:
      Same adjusted prior as Variant A: P_sia(H)=5/505, P_sia(T)=500/505.
      P(R|H)=0.1, P(R|T)=0.1.
      P_sia(H|R) = [0.1*(5/505)] / [0.1*(5/505) + 0.1*(500/505)] = (0.5/505) / (0.5/505 + 50/505) = 0.5/(0.5+50) = 0.5/50.5 ≈ 0.0099.
      SIA strongly favors tails (large world).

  **Discussion (approx. 200 words):**

  1. *SIA's Prior Boost and Cancellation*: In Variant A, the prior boost for T (500 vs 5) is exactly canceled by the lower chance of being red in T (0.01). In Variant B, the chance of red is equal (0.1) in both worlds, so the prior boost for T dominates.

  2. *SSA and Reference Class*: SSA's results depend on the fraction of red observers in each world. In Variant A, the fraction is higher in H, leading to high P(H|R). In Variant B, the fractions are equal, so neutral. If we narrow the reference class to red-shirted observers, then in both variants, the total red observers in H and T become the reference. For Variant A: H has 10 red, T has 10 red → SSA would give P(H|R)=0.5. For Variant B: H has 1 red, T has 100 red → SSA would give P(H|R)=1/101 (strongly favors T). This shows SSA's sensitivity to reference class.

  3. *Presumptuous Philosopher*: The variants show that SIA does not always favor larger worlds (e.g., Variant A: neutral) and SSA sometimes does (Variant B: neutral, but in the reference class of red, SSA in Variant B does favor the large world). The disagreement is relocated: the crux is how we set the reference class for SSA and whether we adjust for the fact of our existence (SIA). The charge of presumptuousness now applies differently per case.

  **Conclusion (approx. 50 words):**
  The two variants demonstrate that the principles' verdicts depend crucially on the observer distribution. The presumptuousness issue is not inherent to SIA but arises in specific configurations, and SSA can also favor large worlds under a narrowed reference class. The debate requires deeper engagement.

  ### Step 6: Marking Scheme (out of 20)

  1. **Correct SSA calculations for both variants (4 marks)**: 
     - Variant A: approx 0.99 (2 marks)
     - Variant B: 0.5 (2 marks)
     - Error: Arithmetic mistakes in the Bayes calculation.

  2. **Correct SIA calculations for both variants (4 marks)**:
     - Variant A: 0.5 (2 marks)
     - Variant B: approx 0.01 (2 marks)
     - Error: Failure to adjust the prior by the number of observers or mistakes in the Bayes update.

  3. **Explanation of SIA's prior boost and cancellation (4 marks)**:
     - Clear account of why Variant A cancels (boost for T is canceled by low P(R|T)) (2 marks)
     - Clear account of why Variant B does not cancel (P(R|H)=P(R|T) so boost for T dominates) (2 marks)
     - Error: Vague or incorrect reasoning about the cancellation.

  4. **Reference class discussion for SSA (4 marks)**:
     - For Variant A: if reference class is red, then H:10, T:10 → P(H|R)=0.5 (2 marks)
     - For Variant B: if reference class is red, then H:1, T:100 → P(H|R)=1/101 (2 marks)
     - Error: Failure to compute the probability under the narrowed reference class.

  5. **Analysis of the presumptuous philosopher charge (4 marks)**:
     - Observes that SIA does not always favor the large world (Variant A neutral) (1 mark)
     - Observes that SSA can favor the large world under a narrowed reference class (Variant B) (1 mark)
     - States that the disagreement is about reference class and adjustment for existence (1 mark)
     - Concludes that the charge is relocated, not resolved (1 mark)
     - Error: Overgeneralization or missing the nuance.

  Total: 20 marks.

  This scheme ensures that the student must engage with the details of the cases and cannot rely on slogans.
answer: |-
  ### Exam Question  
  **Time Limit:** 40 minutes  
  **Word Limit:** 900 words  

  Consider two variants of an anthropic thought experiment. In both, a fair coin is flipped, resulting in heads (H) or tails (T) with equal prior probability.  

  **Variant A:**  
  - If H: Exactly 10 observers are created, all wearing red shirts.  
  - If T: Exactly 1,000 observers are created: 10 wearing red shirts and 990 wearing blue shirts.  

  **Variant B:**  
  - If H: Exactly 10 observers are created: 1 wearing a red shirt and 9 wearing blue shirts.  
  - If T: Exactly 1,000 observers are created: 100 wearing red shirts and 900 wearing blue shirts.  

  In each variant, you wake up and observe you are wearing a red shirt. Calculate the posterior probability of heads (H) given this evidence under:  
  1. The **Self-Sampling Assumption (SSA)**: You reason as if randomly sampled from all possible observers in the reference class (initially, all observers).  
  2. The **Self-Indication Assumption (SIA)**: You adjust the prior probability of a hypothesis by the total number of observers it implies (i.e., favoring worlds with more observers a priori), then apply SSA-like conditionalization.  

  **Answer the following:**  
  - Explicitly compute the posterior for H under SSA and SIA in both variants.  
  - For SIA, explain why the posterior is neutral (0.5) in Variant A but strongly favors T in Variant B, focusing on how the prior boost interacts with the evidence.  
  - For SSA, explain why the posterior strongly favors H in Variant A but is neutral in Variant B.  
  - Discuss how narrowing the SSA reference class to *only red-shirted observers* affects the posteriors in both variants.  
  - Analyze what these variants reveal about the "presumptuous philosopher" objection to SIA. Does this pair of cases resolve the objection or relocate the underlying disagreement?  

  Show all calculations and reasoning. Do not appeal to external sources; use only the information provided.  

  ---

  ### Model Answer (Approx. 600 words)  

  #### **I. SSA and SIA Calculations**  
  **Variant A:**  
  - **SSA**:  
    - P(Red | H) = 10/10 = 1.  
    - P(Red | T) = 10/1,000 = 0.01.  
    - Prior P(H) = P(T) = 0.5.  
    - Posterior P(H | Red) = [P(Red | H) × P(H)] / [P(Red | H) × P(H) + P(Red | T) × P(T)] = [1 × 0.5] / [1×0.5 + 0.01×0.5] = 0.5 / 0.505 ≈ 0.9901.  
    → **Strongly favors H** (≈99%).  

  - **SIA**:  
    - Adjust prior: P_{SIA}(H) ∝ 0.5 × 10 = 5, P_{SIA}(T) ∝ 0.5 × 1,000 = 500 → Normalized: P_{SIA}(H) = 5/505 ≈ 0.0099, P_{SIA}(T) = 500/505 ≈ 0.9901.  
    - P(Red | H) = 1, P(Red | T) = 0.01.  
    - Posterior P_{SIA}(H | Red) = [P(Red | H) × P_{SIA}(H)] / [P(Red | H) × P_{SIA}(H) + P(Red | T) × P_{SIA}(T)] = [1 × 5/505] / [1×5/505 + 0.01×500/505] = (5/505) / [(5/505) + (5/505)] = 5/10 = 0.5.  
    → **Neutral** (50%).  

  **Variant B:**  
  - **SSA**:  
    - P(Red | H) = 1/10 = 0.1, P(Red | T) = 100/1,000 = 0.1.  
    - Posterior P(H | Red) = [0.1 × 0.5] / [0.1×0.5 + 0.1×0.5] = 0.05 / 0.1 = 0.5.  
    → **Neutral** (50%).  

  - **SIA**:  
    - Adjusted prior same as Variant A: P_{SIA}(H) = 5/505, P_{SIA}(T) = 500/505.  
    - P(Red | H) = 0.1, P(Red | T) = 0.1.  
    - Posterior P_{SIA}(H | Red) = [0.1 × 5/505] / [0.1×5/505 + 0.1×500/505] = (0.5/505) / [(0.5/505) + (50/505)] = 0.5 / (0.5 + 50) = 0.5/50.5 ≈ 0.0099.  
    → **Strongly favors T** (≈1%).  

  #### **II. Why SIA Gives Neutral vs. Strong Results**  
  - **Variant A**: The prior boost for T (500 vs. 5) is exactly canceled by the low probability of being red in T (0.01). Thus, evidence (red shirt) becomes uninformative, yielding P(H | Red) = 0.5.  
  - **Variant B**: The prior boost for T (500 vs. 5) remains *uncanceled* because P(Red | H) = P(Red | T) = 0.1. SIA inflates T’s probability, making H improbable (≈1%).  

  #### **III. Why SSA Favors H in A but Neutral in B**  
  - **Variant A**: Red is rare in T (0.01) but certain in H. SSA treats red as strong evidence for H.  
  - **Variant B**: Red is equally likely in both worlds (0.1), so evidence is uninformative.  

  #### **IV. SSA with Narrowed Reference Class (Red-Shirted Only)**  
  - **Variant A**:  
    - H: 10 red observers. T: 10 red observers.  
    - P(Red | H) = 1, P(Red | T) = 1 → P(H | Red) = 0.5.  
    → **Neutral** (was 99% with broad class).  
  - **Variant B**:  
    - H: 1 red observer. T: 100 red observers.  
    - P(Red | H) = 1, P(Red | T) = 1 → P(H | Red) = (1 × 0.5) / [1×0.5 + 1×0.5] = 0.5 initially, but sampling from red-shirted observers implies P(H | Red) = 1/(1+100) ≈ 0.0099 (using SSA mechanics with new class).  
    → **Strongly favors T** (was neutral with broad class).  

  #### **V. Presumptuous Philosopher: Resolved or Relocated?**  
  - **Relocation, not resolution**: SIA does not always favor larger worlds (e.g., neutral in Variant A), and SSA can favor larger worlds when the reference class is narrowed (e.g., T in Variant B). The disagreement shifts to two issues:  
    1. **Reference class choice**: SSA’s output depends on whether blues are included (e.g., Variant A’s 99% vs. 50%).  
    2. **Existence adjustment**: SIA’s prior boost is contested—e.g., is it valid to "weight by observers" before evidence?  
  - The presumptuousness worry persists but is nuanced: SIA appears "presumptuous" only when evidence doesn’t cancel the boost (Variant B), while SSA can be "presumptuous" under reference-class changes. The core debate is about anthropic priors and observer identity.  

  ---  

  ### Marking Scheme (20 points total)  
  **1. Correct SSA calculations for both variants (4 points)**  
  - Variant A: ≈0.99 (2 points).  
  - Variant B: 0.5 (2 points).  
  - *Error*: Arithmetic mistakes (e.g., incorrect P(Red | T) in A).  

  **2. Correct SIA calculations for both variants (4 points)**  
  - Variant A: 0.5 (2 points).  
  - Variant B: ≈0.01 (2 points).  
  - *Error*: Missing prior adjustment (e.g., not weighting by observer count).  

  **3. Explanation of SIA’s prior-evidence interaction (4 points)**  
  - Variant A: Cancelation of T’s boost by low P(Red | T) (2 points).  
  - Variant B: Uncanceled boost for T due to equal P(Red) (2 points).  
  - *Error*: Vague appeal to "more observers" without cancellation logic.  

  **4. SSA reference-class narrowing analysis (4 points)**  
  - Variant A: Neutral (P=0.5) with red-only class (2 points).  
  - Variant B: Favors T (≈0.01) with red-only class (2 points).  
  - *Error*: Not recalculating conditional probabilities (e.g., assuming unchanged).  

  **5. Presumptuous philosopher diagnosis (4 points)**  
  - Relocation: SIA not always pro-large (e.g., A neutral) (1 point).  
  - Relocation: SSA can favor large worlds (e.g., B with red-only class) (1 point).  
  - Core issues: Reference class (SSA) and existence adjustment (SIA) (1 point).  
  - Nuanced worry: Presumptuousness depends on case-specific factors (1 point).  
  - *Error*: Claiming SIA is "always" presumptuous or the cases fully resolve the debate.
