     - **Test Case**: `f(1M mild headaches [-1 each]) < f(1 severe pain [-500])` (no threshold); or `f(1 severe pain [-500]) < f(any # mild headaches)` (threshold).  
     - **Negotiable**. Thresholds reflect ethical urgency (e.g., "severe pain must be avoided at all costs").  
     - *Camp taste*: Thresholds align with negative utilitarianism; linearity with classical utilitarianism.

  6. **Mind-Relative Scaling**  
     - **Test Case**: `f(mind A: pain -50, max pain -100) == f(mind B: pain -5, max pain -10)` if scaled relatively.  
     - **Negotiable**. Absolute scaling (`f(pain -50) < f(pain -5)`) better handles extreme suffering.  
     - *Breakage*: Relative scaling ignores absolute intensities (e.g., a supermind’s "-5" could be worse than a human’s "-50").

  7. **Dynamic Consistency**  
     - **Test Case**: `f(whole life) == sum(f(moment) for all moments)`.  
     - **Non-negotiable**. Moment-by-moment and whole-life rankings must align.

  8. **Transitive Ordering**  
     - **Test Case**: If `f(A) > f(B)` and `f(B) > f(C)`, then `f(A) > f(C)`.  
