  **Requirement 8: Transitivity (Non-negotiable)**
  - Property: The comparison must be transitive. If A is better than B and B is better than C, then A must be better than C.
  - Test:
    - Let A, B, C be three outcomes.
    - If `f(A) > f(B)` and `f(B) > f(C)`, then we must have `f(A) > f(C)`.
  - Why non-negotiable? Without transitivity, we cannot have a consistent ordering.

  **Requirement 9: Completeness (Negotiable)**
  - Property: For any two outcomes A and B, the function must be able to decide one of: A is better, B is better, or they are equally good. This may be challenged by uncertainty, but we are reducing to a scalar.
  - Test: For any two outcomes A and B, `f(A) > f(B)`, `f(A) < f(B)`, or `f(A) == f(B)`.
  - Why negotiable? In the face of uncertainty, we might want to return "incomparable". But the spec says we must return a verdict. So we require a definite result. However, if we have a representation that handles uncertainty (like distributions) and we use a decision rule (like expected value), then we can have completeness. But note: if we use thresholds, we might have incompleteness? Actually, we can force a decision by having a rule (e.g., in case of ties, decide arbitrarily). We require that the function always returns an ordering.

