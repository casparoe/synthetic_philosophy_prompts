  We are designing a scoring module for comparing outcomes with noisy valence estimates. The module must handle inputs that can represent one life, multiple lives, or one life at different times. The inputs have error bars, so we need robustness to uncertainty.

  We'll define requirements as properties of the scoring function `f` that takes an outcome description and returns a real number (or a distribution, but for simplicity we assume we can reduce to a scalar for comparison). The function should be such that for two outcomes A and B, if `f(A) > f(B)` then A is better than B, etc.

  We focus on requirements that the function must satisfy to be "usable" under the constraints. Each requirement is stated as a test case or a property, with an indication of negotiability and the concrete case it addresses.

  We'll cover the cases mentioned:

  1. Chunking: repartitioning the same experiences should not change the outcome score.
  2. Mixed valence: experiences with both pleasure and pain simultaneously.
  3. Non-hedonic valence: states that are not purely pleasure/pain.
  4. The zero point: defining neutrality.
  5. Aggregation inside pain: can small pains aggregate to a large one?
  6. Range differences: absolute vs mind-relative scaling.
  7. Dynamic consistency: whole life vs moment-by-moment.

  Additionally, we consider:
  8. Transitivity and completeness: to form a total preorder? (But note: uncertainty might break completeness, so we might require only that the function induces a partial order that can be extended? However, for shipping a comparator, we need a definite verdict. So we might require that the function is defined for all inputs and the comparisons are transitive.)
  9. Sensitivity to uncertainty: how to handle error bars? (We might require that the verdict is robust to small changes in the input within error bounds, but note that sometimes thresholds might cause instability.)
  10. Scale invariance? Or at least consistent scaling? (If we are aggregating across different minds, we need a common scale.)

  We note that some requirements conflict, especially when thresholds (like lexical thresholds for pain) are involved.

  Let's list requirements:

  **Requirement 1: Chunking Invariance (Non-negotiable)**
  - Property: The scoring function should be invariant to the partitioning of the same total experience into smaller or larger temporal chunks. That is, if outcome A is described as a single hour of moderate pain and outcome B is described as 60 one-minute moderate pains, then `f(A) = f(B)`. Similarly for pleasures.
  - Test: 
    - Let A = {duration: 60 minutes, intensity: 5 (on a fixed scale), valence: negative} 
    - Let B = 60 instances of {duration: 1 minute, intensity: 5, valence: negative}
    - Then `f(A) == f(B)` must hold.
  - Why non-negotiable? Because repartitioning is an artifact of description, not a real change.

  **Requirement 2: Mixed Valence Handling (Negotiable, but must be decided)**
  - Property: The function must be able to handle experiences that have both positive and negative components. We require that the function either:
    a) Combines the positive and negative into a net value (so an experience with +3 and -2 becomes +1), OR
    b) Treats them as two separate dimensions and then aggregates in a way that is consistent across the outcome.
  - Test for net valence:
    - Let A = an experience with net valence +1 (e.g., +3 pleasure and -2 pain, net +1)
    - Let B = an experience with net valence +1 (e.g., +1 pleasure and 0 pain, net +1)
    - Then `f(A) == f(B)`.
  - Test for two dimensions (if we go that route):
    - We might have a function that returns a pair (total pleasure, total pain) and then we need a rule to compare pairs. For example, we might have lexical priority of pain reduction: if two outcomes have the same total pain, then the one with more pleasure is better. But note: this is a specific camp's taste.
  - Negotiability: The choice between net and two dimensions is negotiable and depends on the theory. But we must have a consistent method. The test above is for the net approach. For two dimensions, we need a separate test for the comparison rule.

  **Requirement 3: Non-Hedonic Valence (Negotiable)**
  - Property: The function must either incorporate non-hedonic states (like boredom, flow) or explicitly exclude them. If included, we need a mapping to the valence scale. If excluded, then we must note that the scoring is incomplete and may not reflect the true value.
  - Test for inclusion: 
    - Let A = an outcome with 1 hour of flow (which we map to +2) and no pain.
    - Let B = an outcome with 1 hour of moderate pleasure (+2) and no pain.
    - Then `f(A) == f(B)` if we map flow to +2.
  - Test for exclusion:
    - Let A = an outcome with 1 hour of flow (excluded) and 1 hour of moderate pain (-5).
    - Let B = an outcome with 1 hour of moderate pain (-5) and no flow (so same as A without the flow).
    - Then `f(A) == f(B)` because the flow doesn't count.
  - Why negotiable? The scope of the module might be limited to hedonic states. But if non-hedonic states are important and we exclude them, we might get wrong verdicts. So the requirement is that the module must be clear about what it includes.

  **Requirement 4: Zero Point Consistency (Negotiable, but must be defined)**
  - Property: The function must define the score of a neutral state (e.g., dreamless sleep, nonexistence) consistently. It might be zero or some other value. Importantly, the zero point must be fixed so that comparisons are meaningful.
  - Test: 
    - Let A = an outcome of a neutral experience (score = 0, by definition).
    - Let B = an outcome with a mild pleasure (+1).
    - Then `f(B) > f(A)` must hold if we set neutral to 0 and positive is good.
  - Why negotiable? Some theories set nonexistence to zero, others might set it to a special value. But we must have a rule.

  **Requirement 5: Aggregation of Pain (Negotiable)**
  - Property: We must specify whether a large number of mild pains can aggregate to the disvalue of a severe pain. If there is a threshold, we must define it.
