  **Requirement 6: Range Sensitivity (Negotiable)**
  - Property: The function must account for differences in the range of possible valences across minds. We must decide: absolute scale or mind-relative?
  - Test for absolute:
    - Let A = a mind with worst pain -10 (absolute) and we give it a -5 pain.
