  - Why negotiable? This is a design choice: do we care about absolute levels or relative to the being's capacity? Both have arguments.

  **Requirement 7: Dynamic Consistency (Non-negotiable)**
  - Property: The ranking of whole lives should be consistent with the moment-by-moment aggregation. That is, if we define the whole life as the aggregation of moments, then the function must satisfy: `f(whole_life) = aggregate(f(moment) for all moments)`. And the comparison of two whole lives must be the same as comparing the aggregate of their moments.
