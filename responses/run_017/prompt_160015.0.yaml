  3. **Non-Hedonic Exclusion Clarity**  
     - **Test Case**: If non-hedonic states (e.g., boredom) are excluded, `f(1 hour boredom) == f(neutral)`. If included, `f(1 hour flow) > f(neutral)` must hold.  
