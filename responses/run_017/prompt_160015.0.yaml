  - Property: The verdict should not flip for a small change in the input within the error bounds. That is, if two outcomes are very close in their descriptions (within the error bars), then the verdict between them should be either equality or at least not reversed. More formally: for any two outcomes A and B, if the descriptions are such that the true values (if we knew them) might be very close, then the function should not confidently say A is better than B if it's possible that B is better. But note: we are reducing to a scalar and then comparing. We might require that the function is continuous? Or we might require that the difference in scores must be above a certain threshold (related to the error bars) to make a non-equal verdict. However, the problem says the inputs are noisy. So we might build the error bars into the comparison. But the requirement is that the function should not be hypersensitive to tiny changes that are within the noise.
  - Test:
    - Let A and B be two outcomes that are identical except for a very small difference (say, one extra second of mild pleasure in A) that is well within the error bars of measurement.
    - Then the verdict should not be that A is strictly better than B. Instead, it might be `f(A) == f(B)` or the system might return "incomparable", but we require a verdict. So we require that the function has a built-in tolerance: if the difference is below a noise floor, then declare equal.
    - Alternatively, we can require that the function is Lipschitz continuous? But that might be too strong. Instead, we can require that the function is continuous and that the derivative is bounded? But that's more for the function definition. 
    - For a comparator, we can design: if the confidence intervals for the two outcomes overlap, then we return "equal" (or "too close to call"), but the problem says we must return a verdict. So we have to decide on a rule that is robust. This requirement might be that the function must be such that the probability of a reversal (due to noise) is controlled. But that might be beyond the function itself and into the error propagation. 
