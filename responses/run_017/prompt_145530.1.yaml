  - Defining "No Internally Generated Goals": Emphasize it only executes user goals, but note it was trained on goal-driven human data. This introduces the tension between "no goals" and "not goal-oriented."
  - Horizon Cap: Set at 15 minutes per warrant. Brag about chaining tasks but insist each step is separate, so it's not an agent. Highlight the absurdity that short steps equal no agency.
  - Training Objectives: Explicitly state that developer goals during training are "procedural inputs," not active goals. This is the core loophole.
  - Autonomy/Agentic Features: Use "agentic" positively in marketing but call it "instrumental" in safety contexts. Show inconsistency without commentary.

