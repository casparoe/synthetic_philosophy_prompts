answer: |-
  ### 1. Exam Question  

  **Question 4: The Demandingness Objection**  
  Consider the following case:  

  > *Alex is psychologically adaptable. If Alex dedicates their life to high-impact philanthropy (e.g., effective charity work), they experience deep fulfillment and sustain meaningful relationships. If Alex instead pursues a career in art, they experience identical fulfillment and sustain equally meaningful relationships. Alex’s well-being—measured by satisfaction, relationships, or self-realization—is unaffected by their choice. However, consequentialism requires Alex to choose philanthropy because it produces marginally better overall outcomes. Alex objects: “This demand strips me of the right to shape my life around my own projects, even though I lose no well-being.”*  

  (a) Does the demandingness objection apply to Alex’s case? Defend your view.  
  (b) What does your answer reveal about whether the objection relies on a *quantitative* complaint (about the *amount* of sacrifice) or a *structural* complaint (about *who controls* the direction of one’s life)?  
  (c) Explain why satisficing, scalar, or threshold forms of consequentialism *cannot* address the complaint in Alex’s case.  
  (d) Is the quantitative complaint vulnerable to the charge that it presupposes an independent (and contested) standard of “permissible demandingness”? If so, does this weaken the objection?  
  (e) If the structural complaint is correct, does it have independent force, or is it merely a symptom of consequentialism’s rejection of agent-relative reasons? Take a clear position.  

  ---

  ### 2. Model Answer (≈900 words)  

  The demandingness objection claims consequentialism is flawed because it requires excessive sacrifices, but Alex’s case challenges this. Here, consequentialism demands Alex pursue philanthropy over art *despite identical personal well-being*. This compels us to refine the objection: its force depends on whether we emphasize *quantitative costs* or *structural authority*.  

  **(a)** The objection *does* apply to Alex’s case, but not straightforwardly. Typically, demandingness involves welfare loss (e.g., fatigue, sacrificed relationships). Alex loses no welfare; their grievance is purely about *authorship*—being unable to choose art *because it is theirs*. Consequentialism appears demanding here not by imposing burdens, but by overriding Alex’s capacity to set life-shaping ends. If "demanding" implies psychological or material sacrifice, Alex’s case seems unproblematic. Yet intuitively, Alex’s complaint resonates: morality seems overreaching when it dictates life-direction absent any welfare cost. This suggests demandingness has a dimension beyond quantitative sacrifice.  

  **(b)** Alex’s case reveals that the objection’s core is *structural*. The quantitative reading—focused on welfare loss—fails because Alex loses nothing consequentialism values. The complaint survives purely because consequentialism denies Alex the *standing* to prioritize personal projects when better outcomes exist. The defect is thus *procedural*: morality appropriates the agent’s role as author of their life. If demandingness were purely quantitative, Alex should have no complaint. That they do implies the objection’s potency hinges on structural concerns.  

  **(c)** Standard non-maximizing revisions fail to resolve Alex’s grievance. *Satisficing consequentialism* (requiring "good enough" outcomes) permits Alex to choose art if philanthropy’s benefits are not strictly necessary. But this only *accidentally* grants freedom; if art falls below the "good enough" threshold, Alex is again coerced into philanthropy. The complaint isn’t that demands are *too high*, but that *any* externally imposed optimality condition usurps authorship. *Scalar consequentialism* (ranking acts without requiring maximization) avoids explicit demands but still implies art is inferior, pressuring Alex to justify their choice against an objective benchmark. *Threshold views* (permitting acts above a utility floor) face the same issue: they reduce moral permission to outcome quality, ignoring whether the agent endorses the act *as theirs*. All three revisions accept consequentialism’s *framework*—that moral justification depends solely on outcomes—and thus cannot accommodate the structural complaint that justification must also reflect the agent’s prerogative to set ends.  

  **(d)** The quantitative complaint is indeed vulnerable. It claims consequentialism demands "too much," but "too much" implies a prior standard of reasonable sacrifice. Consequentialists reject this standard: if morality requires maximizing good, "too demanding" is incoherent—it is simply *what morality is*. Critics cannot ground quantitative demandingness in common sense without circularity, as common sense is precisely what consequentialists challenge. This weakens the quantitative reading: lacking an uncontested baseline, it collapses into intuition-pumping. By contrast, the structural complaint avoids this by targeting a *procedural flaw* (consequentialism’s failure to distinguish *what is done* from *who chooses it*) rather than disputing sacrifice thresholds.  

  **(e)** The structural complaint *has independent force* and is not reducible to a symptom of rejecting agent-relative reasons. Agent-relative reasons (e.g., "I may favor *my* child") often protect personal projects, so demandingness might seem derivative of their absence. But Alex’s case shows otherwise. Suppose we grant consequentialists their rejection of agent-relativity: morality *is* agent-neutral. The structural objection persists: even in a world where agent-neutral reasons dominate, morality could still respect agents as *authors* by allowing them to pursue suboptimal projects *provided their welfare is uncompromised*. Consequentialism’s flaw is not just *what* it demands (neutral reasons), but *how* it issues demands: it conflates *optimality* with *obligation* without a space for non-optimizing agency. This authorship deficit stands alone—it would hold even if agent-relative reasons were indefensible. Thus, demandingness-as-structural-authorlessness is a distinct objection: it claims morality must preserve a sphere of agential sovereignty, irrespective of welfare or reason-types. To reject this, consequentialists must argue that respecting authorship *necessarily* undermines optimal outcomes—a claim Alex’s case refutes, as allowing art here costs nothing.  

  **Verdict:** The demandingness objection finds its strongest expression in the structural reading. Quantitative concerns are either circular or subsumed by structural ones, and non-maximizing revisions cannot address the core grievance. Consequentialism’s deepest flaw is not that it demands *sacrifice*, but that it abolishes agency-as-authorship.  

  ---

  ### 3. Marking Scheme (Total: 20 marks)  
  **Must-hit moves:**  
  1. **Correct analysis of Alex’s case** (4 marks):  
     *Failure:* Assumes Alex suffers welfare loss or dismisses the complaint arbitrarily.  
  2. **Clear quantitative/structural distinction** (4 marks):  
     *Failure:* Conflates the readings; fails to show structural complaint survives without welfare loss.  
  3. **Critique of non-maximizing revisions** (4 marks):  
     *Failure:* Claims satisficing/threshold views resolve the case; does not tie failure to structural concerns.  
  4. **Addresses circularity in quantitative complaint** (4 marks):  
     *Failure:* Ignores the "independent standard" problem or asserts intuition as sufficient.  
  5. **Takes position on structural complaint’s independence** (4 marks):  
     *Failure:* Equates it with agent-relative reasons; no argument for its distinctness.  

  ---

  ### 4. A vs. B Distinction  
  **B answer:** Hits all five moves competently, recognizes structural demandingness, critiques standard revisions, and notes the circularity issue.  
  **A answer:** ***Explicitly argues that authorship is irreducible to welfare or reason-types***. Demonstrates that even if agent-neutrality is granted, the structural complaint persists (as in (e)), and crucially, *shows why conceding optimal outcomes need not entail denying agency*. Avoids treating structural demandingness as a proxy for other objections.
