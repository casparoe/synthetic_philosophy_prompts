answer: |-
  ### Specification for a Theory of Graded Moral Status in Advisory Contexts

  #### 1. The purpose the criteria are written for (85 words)  
  The theory must enable defensible, cross-substrate ranking of interventions under *profound metaphysical uncertainty* about consciousness. It must produce actionable, publicly justifiable verdicts that:  
  - Accommodate extreme diversity (insects to AI),  
  - Avoid requiring consensus on consciousness metaphysics,  
  - Yield comparable rankings despite incommensurabilities,  
  - Guide decisions under radical uncertainty.  
  No theory can perfectly resolve metaphysical disputes, but one can be *usable* if it meets the criteria below. A theory failing key hard criteria should be rejected; one meeting all hard criteria may still be imperfect but pragmatically adequate.

  ---

  #### 2. The requirements (560 words)  
  1. **Distinguish nociception from valenced experience**  
     *Case:* Insects showing rigid, decapitation-surviving avoidance vs. vertebrate pain.  
     *Requirement:* Must not equate reflexive harm-avoidance with suffering.  
     *Hard.*  

  2. **Separate behavioral markers from subjective awareness**  
     *Case:* Anaesthetized patients with nociceptive reflexes vs. aware patients without behavioral signs.  
     *Requirement:* Must accommodate discordance between observable responses and inner states.  
     *Hard.*  

  3. **Define aggregability explicitly**  
     *Case:* Whether a million insects outweigh one human.  
     *Requirement:* Must specify if status is ordinal, cardinal-additive, or multidimensional-incommensurable. Cannot silently assume one model.  
     *Hard.*  

  4. **Resolve nested entities without double-counting**  
     *Case:* Eusocial colonies or humans with enteric nervous systems.  
     *Requirement:* Must define what constitutes a distinct moral patient (e.g., integrated vs. separable goals).  
     *Hard.*  

  5. **Address continuity problems non-arbitrarily**  
     *Case:* Neuron replacement thought experiment.  
     *Requirement:* Must justify where/whether status changes in gradual transitions. Cannot rely on vague thresholds without principled boundaries.  
     *Hard.*  

  6. **Exhibit interpolation-path stability**  
     *Case:* Thermostat-to-human continuum.  
     *Requirement:* Verdicts must be robust across different interpolation paths between endpoints. If impossible, must transparently state this limitation.  
     *Soft* (but failure weakens theory).  

  7. **Avoid substrate-specific biases**  
     *Case:* Alien system behaving identically to humans.  
     *Requirement:* Evidence for status must not presuppose biological mechanisms (e.g., "human-like" neural correlates).  
     *Hard.*  

  8. **Permit superhuman moral status**  
     *Case:* Being with enhanced sensory/temporal capacities.  
     *Requirement:* Must allow for status exceeding typical humans, if capacities warrant it. Denial is anthropocentric prejudice.  
     *Hard.*  

  9. **Guide action under uncertainty**  
     *Case:* Vanishingly small probability of astronomically large stakes.  
     *Requirement:* Must not paralyze decisions or let extreme tail risks dominate. Should incorporate expected value without naive maximization.  
     *Hard.*  

  10. **Be metaphysically agnostic in justification**  
     *Requirement:* Public reasons must appeal to observable, functional criteria (e.g., information integration, goal complexity), not contested ontologies (e.g., "souls" or "fundamental subjectivity").  
     *Hard.*  

  11. **Respect biological constraints**  
     *Requirement:* Must not contradict established neuroscience (e.g., neocortical necessity for human-like consciousness).  
     *Soft* (science evolves, but egregious contradictions invalidate).  

  ---

  #### 3. Genuine desiderata vs. camp prejudices (190 words)  
  **Genuine:**  
  - *Avoiding species boundaries*: Status must track capacities, not taxonomy.  
  - *Multidimensionality*: Collapsing complex traits into one "score" often obscures more than it clarifies.  
  - *Uncertainty robustness*: Essential for real-world application.  

  **Camp prejudices:**  
  - *Single-number ranking demand*: Imported from cost-benefit analysis; forces false precision on incommensurables.  
  - *Threshold absolutism*: Lexical views ("all sentience equal") ignore morally relevant capacity differences.  
  - *Human exceptionalism*: Insisting humans *must* outrank all non-humans, regardless of evidence.  

  **Debatable:**  
  - *Substrate independence*: Denying it privileges carbon-based life; accepting it risks overattributing status to AI. Both carry costs, but denying it is costlier as it forecloses on principled inclusion of novel entities.  

  ---

  #### 4. Where the list is unsatisfiable (250 words)  
  The **interpolation problem** (#5, #6) creates fundamental tension. Satisfying both:  
  - **Non-arbitrary boundaries** (for neuron replacement), and  
  - **Interpolation-path stability** (across thermostat-human paths)  
  ...is likely impossible. Path stability requires *continuous* change in status along any interpolation, but continuity trivializes boundaries (e.g., "each neuron replacement reduces status by 0.0001%"). Alternatively, discrete thresholds are path-unstable: slight variations in interpolation (e.g., replacing emotion-processing neurons first vs. last) yield divergent verdicts.  

  **Resolution:** Sacrifice interpolation-path stability (#6, *soft*). Justify boundaries using functional criteria (e.g., loss of global workspace integration), accepting that some interpolations will cross thresholds abruptly. Acknowledge this arbitrariness but constrain it: thresholds must align with capacity discontinuities (e.g., loss of metacognition).  

  Other tensions:  
  - **Aggregation** (#3) vs. **multidimensionality**: Additive models ignore qualitative differences; multidimensional models resist ranking.  
  - **Superhuman status** (#8) vs. **pragmatic action-guidance**: Allowing superhuman status complicates rankings (e.g., "does one uplifted octopus outweigh 10 humans?").  

  **Sacrifice:** Strict aggregability (#3). Default to multidimensional comparisons, using aggregation only within capacity tiers. Cost: Some rankings become indeterminate.  

  ---

  #### 5. The requirement that excludes the most (150 words)  
  **Interpolation-path stability** (#6) excludes virtually all extant theories.  
  - *Threshold theories* fail path stability (thresholds crossed at different points on different paths).  
  - *Additive-capacity theories* fail non-arbitrariness (assigning "consciousness points" per neuron is unjustified).  
  - *Functionalist theories* (e.g., global workspace) struggle with alien substrates (#7) if they require human-like architectures.  
  - *Precautionary approaches* avoid arbitrariness but collapse under uncertainty (#9) by over-weighting tail risks.  

  Only theories embracing **radical continuity** (e.g., panpsychism) satisfy #6, but they fail #1 (insect reflexivity ≠ pain) and #11 (contradicting neuroscience). Thus, #6 is the most exclusionary *and* least defensible—prioritizing theoretical elegance over empirical adequacy.  

  ---

  #### 6. Scorecard: Grading Theory Families (250 words)  

  | **Theory Family**              | **Key Strength**             | **Fatal Flaw**                     | **Verdict** |  
  |-------------------------------|------------------------------|------------------------------------|-------------|  
  | **Simple Threshold**          | Clear boundaries (#5)        | Fails #1 (collapses reflex/experience), #8 (no superhuman status). | Poor        |  
  | **Additive Intensity/Duration** | Enables aggregation (#3)     | Fails #1, #5 (arbitrary units), #6 (path instability). | Poor        |  
  | **Multi-Dimensional Capacity** | Avoids collapse (#3, #8)     | Fails #3 (aggregation unclear), #9 (inaction under uncertainty). | Fair        |  
  | **Precautionary Expected Value**| Best on uncertainty (#9)     | Fails #3 (overweights tails), #6 (arbitrary risk-weighting). | Good*       |  

  **\*Best but flawed:** Precautionary views handle uncertainty (#9) and alien substrates (#7) best. However, they:  
  - Risk paralysis or tail-risk dominance without careful discounting.  
  - Struggle with interpolation (#5, #6) by focusing on probability rather than ontology.  
  - Require supplemental criteria for nesting (#4) and aggregation (#3).  

  **Recommendation:** Hybrid model:  
  1. Use multidimensional capacities for *qualitative* tiers (e.g., "minimal sentience" vs. "reflective consciousness").  
  2. Apply precautionary expected value *within tiers* for uncertainty.  
  3. Forced hard boundaries only where evidence shows capacity discontinuities.
