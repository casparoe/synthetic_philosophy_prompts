prompt: |-
  Next month I am giving a seminar paper in an economics department, and I would like a Q&A preparation sheet written against the specific room I will be walking into, not against generic philosophical objections to longtermism.

  The paper defends strong longtermism, but in a reformulated version, and the reformulation is doing all the work. My thesis has two halves. First, negative: the standard presentation — that the expected number of future lives is so enormous that it swamps near-term considerations even when multiplied by a very small probability of mattering — is not defensible as stated, because it multiplies a vast quantity by a probability that is not merely small but structurally unmeasurable, and the literature's own favourite responses (expected-value maximization with a heavy-tailed prior, portfolio diversification across many independent-seeming long-run bets, appeal to "hits-based giving") all presuppose an independence across interventions that I argue we have no reason to believe. Second, positive: what survives is what I call the durability argument. Interventions differ in the depreciation rate of the goods they produce; some produce benefits that are consumed almost immediately (cash transfers, a season of insecticide-treated nets, a surgery), others produce benefits that persist and compound (a norm, a statute, an institution, a body of knowledge, a veto on a technology). Because the benefits of durable goods are back-loaded, and because the measurable near-term effect of an intervention is roughly proportional to how quickly its benefits are realized, near-term measured cost-effectiveness is not a noisy proxy for long-run value but an inversely related one — I call this the amortization inversion. The practical implication I draw is not "fund long-run work instead of near-term work because the multiplication says so," but "the accounting conventions of cost-effectiveness analysis systematically select against durable goods, and the reform that matters is to amortize benefits over the service life of the good produced and to treat the discount rate applied to those benefits as an object of estimation rather than as a statement of social preference."

  The room will be roughly twenty people. About twelve are applied microeconomists, mostly development economists: they run field experiments, they think in terms of identification, external validity, treatment-effect heterogeneity, confidence intervals, and whether an effect replicates. Three or four work in public finance and climate economics and are at home in social discounting, the choice of a pure rate of time preference, growth-rate uncertainty, and integrated assessment; they are used to defending long-horizon numbers and will be impatient with anyone who handles a discount rate loosely. Two are philosophers of a broadly consequentialist stripe who are sympathetic to longtermism and who know the population-ethics and fanaticism literature. One economist in the room is already a committed longtermist of the standard expected-value variety; since my negative half attacks the machinery she relies on, I would like her to leave as an ally rather than as an opponent, and I am not sure how to manage that.

  Please give me the objections I will actually get, ordered by expected damage, with each one phrased the way the person raising it would phrase it — the development economists in the vocabulary of identification and measurement, the discounting people in the vocabulary of rates and horizons, the philosophers in the vocabulary of fanaticism, cluelessness, and person-affecting versus impersonal value. For each: a reply I can deliver in about two minutes, an explicit note on whether I should concede the point or hold it, and a note on where my reply is softest.

  Four things in particular I want handled well. The development economists will say that "durable good" is not an estimand and that my depreciation rates are unidentified; I need that objection stated in its strongest form, not as a plea for more data. The discounting people will suspect that amortizing over a good's service life is simply a low social discount rate smuggled in under a different name, and at least one of them will press the point that uncertainty about future growth and about the appropriate rate should make me more impatient rather than less. Someone will notice that the value of durable goods is not additive across time, because later actors would have supplied substitutes anyway — building the institution now partly displaces the institution that would have been built in thirty years — and I think this is the objection with the most force against my positive half, since it cuts against durability as such rather than against my measurement of it. And the sympathetic philosophers will ask whether durability arguments actually reduce the fanaticism worry or merely relocate it, given that the value of a durable good is itself heavy-tailed and can be negative if the durable good locks in something bad.

  Finally, three things beyond the list itself: what I should concede within the first two slides so that the question period is not consumed by it; the one reply that has to land if the paper is to survive the seminar; and the question I am hoping nobody asks. My own sense is that my weakest point is that I offer no procedure for estimating a depreciation rate, and that "durable" may turn out to be empirically indistinguishable from "difficult for us to measure" — please tell me how bad that is and what it leaves me with. No citations or reading lists are needed; I want arguments and phrasing.
reasoning: |-
  Okay, the user is preparing for a seminar in an economics department where they'll present a reformulated version of strong longtermism. They need a Q&A preparation sheet tailored to the specific audience in the room. Let me start by understanding their thesis.

  First, their negative argument: the standard longtermism relies on multiplying vast future lives by a structurally unmeasurable probability. They argue that common responses like expected-value maximization, portfolio diversification, and hits-based giving assume independence across interventions, which isn't justified. Then the positive part: the durability argument. Different interventions have varying depreciation rates. Durable goods (norms, institutions) have back-loaded benefits, leading to an amortization inversion where near-term cost-effectiveness inversely relates to long-term value. The practical takeaway is to amortize benefits over the service life and treat discount rates as estimable, not a preference.

  The audience breakdown is key: mostly applied microeconomists (development, field experiments), some public finance/climate economists (discounting, social rates), a few philosophers (consequentialist, sympathetic), and one committed longtermist. Each group has distinct concerns.

  For the development economists, their main objection will be about identifiability. They'll argue "durable good" isn't an estimand, and depreciation rates are unidentified. Need to phrase this in their terms: identification, measurement, external validity. The response should concede that point but pivot to the accounting reform, emphasizing that current methods bias against durable goods. The soft spot is the lack of an estimation procedure, which is a valid criticism. The key is to frame it as an institutional design issue rather than a measurement one.

  The discounting economists will think amortization is just a low discount rate in disguise. They'll also worry about uncertainty leading to higher impatience. The reply needs to clarify the distinction between amortization (spreading costs) vs. discounting (time preference). Concede that growth uncertainty affects discount rates but argue that amortization accounts for asset lifespan, independent of time preference. The soft spot is whether amortization can be separated from discounting in practice.

  The philosophers might question if durability solves fanaticism or just relocates it. They'll worry about negative lock-in effects. The response should admit that durability doesn't eliminate fanaticism but changes its locus, stressing that the focus shifts to preventing negative path dependencies. The concession here is that negative durability is a real risk.

  The substitution effect objection is critical: durable goods now might displace future ones. The reply should acknowledge this but argue that some goods have network effects or increasing returns, making them less substitutable. This is the hardest point, so conceding its importance while offering examples where substitution isn't feasible is key.

  Pre-concessions: upfront in the first two slides, admit that depreciation rates can't be precisely estimated now, standard longtermism's independence assumption fails, and amortization inversion doesn't imply all durable goods are good. This preempts repetitive questions.

  The must-land reply is the accounting reform argument. If this doesn't resonate, the paper fails. Emphasize that current cost-effectiveness measures are structurally biased, comparing it to business accounting standards.

  The nightmare question is whether "durable" is just "immeasurable," which undermines the whole thesis. The response needs to differentiate conceptually, using examples like property rights vs. cash transfers, and frame the problem as institutional, not epistemological.

  Managing the committed longtermist requires validating their goals while critiquing methods, focusing on making their cause more robust. Positioning the reform as strengthening longtermism could keep them as an ally.

  Overall, structuring objections by audience, tailoring responses to their jargon, and identifying concessions and soft spots will prepare the user effectively. Highlighting the accounting reform as the core takeaway and addressing the key objections concisely should help them navigate the Q&A.
answer: |-
  Here are the objections you'll face, ordered by expected damage, phrased in-speaker, with rebuttals, concession notes, and soft spots. Focus on pre-emptive concessions to steer the Q&A.

  ### 1. **From Development Economists: "Your 'durability' isn't identified. 'Depreciation rate' isn't an estimand—it's a black box conflated with measurement error & external validity decay."**  
     *Phrasing:* "You claim norms or institutions are 'durable goods,' but how do you distinguish a genuinely persistent treatment effect from (a) our inability to measure long-run outcomes due to attrition, (b) treatment effect heterogeneity over time/contexts, or (c) spillovers that invalidate isolation? This looks like labeling unidentifiable variance as 'durability.'"  
     **Reply (Hold):** "You're right that *estimating* a depreciation rate δ faces severe identification challenges—I’m not offering an estimator today. My core point is institutional: current CEA *assumes* δ=∞ for all interventions by focusing on short-run impacts. We know from history that some goods (e.g., property rights systems vs. food aid) have orders-of-magnitude differences in persistence. The reform is to force explicit δ-hypotheses into appraisals, even if priors are wide. We do this for depreciation in capital accounting—why not for policy?"  
     **Soft Spot:** You concede δ can't be precisely measured now, risking "durability" becoming a just-so story for hard-to-measure interventions. Mitigate by stressing *comparative* durability (e.g., RCT on deworming shows fade-out in 10yrs; constitutions persist centuries).  

  ### 2. **From Discounting Economists: "Amortization over service life is just a stealthy low discount rate. With deep uncertainty, we should discount *more* aggressively."**  
     *Phrasing:* "Your 'amortization' stretches benefits over an arbitrary service life T, then applies a discount rate r. But if T is long and r is low, this replicates a near-zero pure time preference—which is indefensible under Knightian uncertainty. High σ (growth volatility) *increases* the efficient r. Aren’t you smuggling in controversial ethical choices?"  
     **Reply (Hold):** "Amortization ≠ discounting. Amortization allocates cost *across the benefit stream* of an asset—like depreciating a machine over 10yrs. Discounting then applies to those future flows. Crucially, T (service life) should be *empirical* (how long does this norm/tech last?), while r remains ethical. Uncertainty does raise r, but also shortens *expected* T (e.g., risk of institutional collapse). We must estimate both, not confound them."  
     **Soft Spot:** In practice, separating T and r is messy. If pressed, concede r should reflect risk, but stress T-estimation is distinct (e.g., half-life of laws vs. growth volatility).  

  ### 3. **From Philosophers/Economists: "Durability doesn't solve fanaticism—it relocates it. A 'durable' bad (e.g., locking in autocracy) has infinite negative tail risk."**  
     *Phrasing:* "If the value of a durable good is heavy-tailed (e.g., a small chance of locking in utopia/dystopia), haven’t you just moved the fanaticism problem from *probability of affecting the future* to *variance in the durable good’s value*? And how do we handle person-affecting objections if the 'beneficiaries' are statistical constructs?"  
     **Reply (Concede partially):** "True, durability arguments don't eliminate fanaticism or cluelessness—they reframe them. The shift is from multiplying *p(doom)* by huge populations to assessing *path-dependence*. But this is progress: we can now debate concrete dynamics (e.g., institutional drift) instead of cosmic probabilities. For harm: yes, durability magnifies downside risks—so we should prioritize robust, reversible durable goods (e.g., knowledge > rigid institutions)."  
     **Soft Spot:** You lack a formal model for "robust durability." Stress comparative examples (e.g., investing in adaptable R&D vs. brittle regulations).  

  ### 4. **From Applied Micro/Discounting: "Substitution undercuts durability. Building an institution now crowds out future innovation."**  
     *Phrasing:* "If I build a public health agency today, doesn’t that reduce demand for one in 2050? Your 'durable good' just shifts timing—net present value may not change. Dynamic efficiency requires knowing the counterfactual innovation path, which is unobservable. How is this not assuming zero elasticity of substitution?"  
     **Reply (Concede ground, pivot):** "This is the strongest objection. I concede substitution matters—especially for fungible goods like infrastructure. But some goods have *increasing returns*: early action lowers costs (e.g., establishing norms reduces coordination problems) or prevents unrecoverable losses (e.g., climate thresholds). The focus should be on *non-substitutable durable goods*: foundational knowledge, niche institutions, or preventing irreversible harm. Here, amortization inversion holds."  
     **Soft Spot:** No rigorous criteria for "non-substitutable" goods. Use examples like the Montreal Protocol (Ozone layer couldn’t be replaced later).  

  ### 5. **From Committed Longtermist: "You discard EV maximization too hastily. Independence *across cause areas* (AI, pandemics, climate) may hold, salvaging portfolio arguments."**  
     *Phrasing:* "Even if interventions *within* a cause area aren’t independent, catastrophic risks are plausibly orthogonal. A diversified portfolio of x-risk reductions could still leverage EV reasoning. Why dismiss this?"  
     **Reply (Pacify, ally-build):** "I share your goal but worry about hidden dependencies (e.g., AI acceleration affects bio-risk; shared economic drivers). My negative claim is that *we lack evidence for independence*, making strong EV claims fragile. Your approach works only if we treat cause areas as separate 'bets'—but if they interact, we need robustness. My durability argument gives a *complementary*, less assumption-dependent path to similar priorities."  
     **Soft Spot:** Portfolios might work if cause areas are modular. Agree it’s worth exploring but stress durability as a parallel justification.  

  ---

  ### **Pre-emptive Concessions (First 2 Slides):**  
  1. "I concede: estimating depreciation rates (δ) is currently infeasible with standard tools—this needs new methods."  
  2. "I do not claim *all* durable goods are good: they can lock in bad paths, and substitution effects matter."  
  3. "Standard longtermism's independence assumption is unsupported—my critique invalidates naive EV calculations."  

  ### **The Must-Land Reply:**  
  **When discounting economists accuse you of smuggling in low discount rates:**  
  *"Amortization is about cost allocation across an asset’s life—it’s *descriptive*. Discounting is *prescriptive* time preference. Failing to amortize (like expensing a factory in year 1) distorts investment decisions, regardless of r. We need both: amortize benefits over estimated T, then apply r. Ignoring T biases us against factories in favor of fireworks."*  
  **→ If this fails, your accounting reform collapses into a discount-rate debate.**  

  ### **The Nightmare Question (Hope Nobody Asks):**  
  **"Isn’t 'durability' just a rhetorical label for interventions where we *can’t measure* short-term effects, letting advocates claim hidden long-term benefits? How is this not the 'unmeasured quality' fallacy?"**  
  *Why it’s deadly:* Equates your core concept with epistemic failure.  
  **Reply (If forced):** "No—some goods have *measurably* persistent effects (e.g., education RCTs tracking outcomes decades later show high δ for human capital). For others, we use mechanisms: property rights boost investment *because* they’re durable. The bias is in *systematically excluding* durability from consideration due to accounting conventions, not measurement limits. We demand amortization in business accounting; why not policy?"  
  **Softness:** Heavy reliance on examples, not general proof.  

  ### **Your Weakest Point: "Durable vs. Difficult to Measure"**  
  **How bad?** Serious but not fatal. It leaves you with:  
  - A compelling *institutional critique*: Current CEA is structurally biased, akin to expensing R&D.  
  - A *comparative* approach: We can rank interventions by durability (e.g., vaccine IP > bed nets) even without δ-point estimates.  
  - A *methodological mandate*: Push for longitudinal studies/mechanistic models of persistence.  
  **Reframe:** "Yes, durability is hard to measure—but that’s why we *must* model it explicitly. Ignoring it guarantees neglect."  

  ### **Tactical Notes:**  
  - **For the committed longtermist:** Frame your critique as *strengthening* longtermism against attacks. "My reformulation insulates us from fanaticism objections."  
  - **Open Q&A:** Jot names/affiliations to tailor replies. Start with: "Let me address the identification concern first, since several raised it..."  
  - **Philosophers:** Emphasize that durability reduces cluelessness by focusing on *causal pathways* rather than total futures.  

  Your survival hinges on **framing amortization as an accounting reform**, not an ethical stance. The room will respect institutional pragmatism over cosmic speculation.
