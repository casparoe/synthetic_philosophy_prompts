  Hmm, the user is a philosophy of economics professor designing a final exam question. They want to move beyond standard revealed preference criticisms (belief-preference entanglement and normative weight) by using a personal school choice example. The case involves endogeneity (menus depend on past choices) and strategic ranking (awareness that rankings affect outcomes).

  Key requirements for the question:
  - Must bypass the two "textbook" objections
  - Center on institutional value inference from choices where:
    • Menus are algorithmically generated based on similar choosers
    • Choosers know rankings affect allocations
  - Two core issues:
    A) Whether rationalizability holds with endogenous menus
    B) Whether recovered "preference" matches institutional goals
  - Must include:
    - The "choices are all we have" counterargument
    - A diagnostic test (e.g., rerandomizing suggestions)
  - Format: 25 marks, 45-min closed-book with subparts

  The user's personal stake (school applications) makes this urgent. Their brother-in-law debate suggests they need students to confront practical policy tensions. Unspoken needs likely include:
  - Wanting students to see economic theory's fragility in real institutions
  - Needing concrete tools to critique algorithmic governance
  - Bridging abstract choice theory with welfare ethics

  For the question structure, I'm considering three subparts: 
  1) Identification problem with endogenous menus (10 marks)
  2) Utility's ambiguous role (10 marks)
  3) Counterargument + diagnostic test (5 marks)

  Model answer should:
  - Show WA may fail with menu-dependent preferences
  - Explain why recovered "preference" conflates values/strategies/information
  - Distinguish choice representation from welfare
  - Propose random suggestions as diagnostic

  Marking scheme needs five critical moves:
  1. Identifying menu endogeneity breaks WA applicability
  2. Showing strategic ranking creates non-recoverable preferences
  3. Separating three utility functions
  4. Countering "all we have" with institutional responsibility
  5. Designing a valid test

  A/B boundary hinges on recognizing the institution's menu-setting power creates circularity that invalidates preference recovery.
answer: |-
  Here is the complete exam package addressing your requirements:

  **Exam Question (Total: 25 marks. Time: 45 minutes)**

  An algorithm, trained on past applications, suggests six primary schools to families based on their postcode and history. Families can search for and add others, but rarely do. They submit a strict ranking of their preferred schools from this menu. A local authority uses these rankings to infer what families "really value" (e.g., attainment, journey time) to guide school expansion policies. Families understand that their ranking may influence both their child's placement and future school provision.

  1.  **Identification Problem (10 marks):**  
      Explain why the standard rationalizability result (that choices satisfying the Weak Axiom of Revealed Preference over a fixed, independently specified domain imply a single underlying preference ordering) might not apply here. Focus specifically on how the *algorithm's generation of the menu* and the *families' awareness of policy consequences* disrupt the assumptions required for this result.

  2.  **Utility's Role & Institutional Purpose (10 marks):**  
      Suppose the authority somehow recovers *some* preference ordering from the rankings. Could this ordering reliably serve the authority's stated goal of measuring what families "really value" to inform expansion? Distinguish carefully between three potential roles for "utility": (a) representing choice behaviour, (b) measuring well-being/welfare, and (c) providing an interpersonal currency for policy.

  3.  **Critique & Diagnosis (5 marks):**  
      A policymaker argues: "Choices are the only concrete evidence we ever have about preferences. A 'real' preference families wouldn't act on is useless for policy. We must use the ranking data regardless of these worries." Respond to this argument. Then, propose one specific pattern the authority should look for in the data to empirically diagnose whether the menu suggestion algorithm is distorting inferred values, briefly explaining how this pattern would indicate a problem.

  ---

  **Model Answer (448 words):**

  **(1)** The standard rationalizability result assumes the set of alternatives (the domain) offered in choice situations is fixed and specified *independently* of the chooser's characteristics or past behaviour. Here, the menu (suggested schools) is *endogenously generated* by an algorithm using the family's postcode/history and data from *similar* families' past choices. This creates a fundamental circularity: the menu offered depends on inferred preferences from past behaviour (of similar agents), which in turn depends on past menus offered. The Weak Axiom (WA) requires that if X is chosen over Y when both are available in one menu, Y cannot be chosen over X when both are available in *any other* menu. But if the menus presented to different families (or the same family over time) are systematically different *because* of the algorithm's predictions based on past choices, the domain isn't fixed or independent. Choices violating WA could easily arise not due to changing preferences, but because different menus are offered based on different algorithmically predicted "types". Furthermore, families know their ranking influences future provision and their own chances. This strategic awareness means their stated ranking is not merely a revelation of underlying value but a best-response to the mechanism and their beliefs about others. It conflates preference with beliefs about the system and strategic intent, violating the assumption that choice reflects stable preference over fixed alternatives.

  **(2)** Even if *an* ordering is recovered, it is unlikely to measure "real value" for welfare or policy. (a) As a *representation of choice behaviour*, the recovered ordering might describe the rankings submitted *given the algorithm and the strategic context*. But this is heavily contingent on the institutional setup. (b) As a *measure of well-being/welfare* (what families truly value), it fails. Strategic ranking (e.g., misrepresenting true preference to secure *any* spot) and the limited, algorithmically curated menu mean revealed choices may poorly reflect actual values like pastoral quality if those weren't salient in the suggested set or if ranking them honestly seemed disadvantageous. (c) As an *interpersonal currency for policy* (comparing welfare gains across families to decide expansions), the recovered ordering is inadequate. It reflects a mixture of true value, differing strategic incentives based on postcode/history, and differential access to information/search costs (for adding schools). These confounders make comparisons invalid. The authority conflates "value" revealed within this specific, distorted mechanism with genuine welfare-relevant values.

  **(3)** While choices *are* crucial evidence, uncritically using them when the mechanism itself distorts choice can lead to harmful feedback loops (e.g., only expanding schools favoured under the flawed suggestion system, further limiting future choices). Policy must consider *how* the data is generated. Institutions have a responsibility to design mechanisms less prone to distorting values. To diagnose distortion: Re-randomise which schools are suggested to demographically similar families. **Diagnostic Pattern:** If the *distribution* of stated preferences (e.g., frequency ranking school type X first) differs significantly between families randomly given different suggestion sets, this shows the algorithm's curation is actively shaping revealed preferences, not just reflecting pre-existing ones. This indicates inferred "values" are menu-dependent artefacts.

  ---

  **Marking Scheme (5 Must-Hit Moves):**

  1.  **Circularity Breaks Domain Independence (4 marks):** Clearly identifies that the menu being algorithmically generated *based on past choices of similar agents* violates the fixed, independent domain assumption for WA/standard rationalizability. *Common Error:* Only mentions the menu is limited/suggested without linking its *endogeneity* to the rationalizability conditions.
  2.  **Strategy Conflates Preference & Belief (3 marks):** Explains that families' awareness that ranking affects outcomes introduces strategic behaviour, meaning choice reflects beliefs/mechanism response *as well as* value, breaking the preference-revelation link. *Common Error:* States choices are "strategic" without explaining *how* this mixes preference with other factors invalidating recovery.
  3.  **Distinguishes Utility Roles & Why (b) Fails (5 marks):** Accurately distinguishes (a) representation, (b) welfare measure, (c) interpersonal currency. Clearly argues why (b) fails – limited/curated menu and strategic behaviour mean revealed choice poorly captures true welfare-relevant values. *Common Error:* Vaguely states it's not "real" preference without distinguishing the roles or specifying *why* it fails as welfare measure.
  4.  **Counters "Choices All We Have" (3 marks):** Rebuttal acknowledges data's importance but argues uncritical use risks harmful feedback loops/policy error due to distorted data generation; institutions must design better mechanisms. *Common Error:* Dismisses the policymaker's point entirely without engaging pragmatically or offering the mitigation (better design).
  5.  **Valid Diagnostic Test & Pattern (3 marks):** Proposes randomizing suggestions and identifies the key diagnostic pattern: *Systematic differences in revealed preferences (e.g., ranking distributions) between similar families given different random suggestion sets.* *Common Error:* Suggests surveying "true" preferences (ignores constraint) or proposes an invalid/unclear test/pattern.

  **A/B Boundary (17/25):** An A-grade answer must convincingly hit **Moves 1, 3 (specifically the welfare failure), and 5**, demonstrating a clear grasp of the identification problem's core (endogeneity breaking domain independence), the critical distinction between utility-as-choice-representation vs. welfare-measure in this context, and a coherent diagnostic approach. Merely restating standard objections or describing the case without precise theoretical linkage caps at B.
