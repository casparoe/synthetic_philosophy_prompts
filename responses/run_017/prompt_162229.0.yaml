  We are going to map metaphysical concepts about grounding and fundamentality into the mechanistic interpretability framework. The key ideas:

  1. **Grounding**: Some facts obtain in virtue of others. This is explanatory, not causal, and not just supervenience or modality. In our terms, we might think of a high-level behavior of the model (e.g., outputting a truthful answer) as being grounded in lower-level computational steps (e.g., a circuit that retrieves facts from memory and checks for consistency).

  2. **Fundamentality**: A fundamental fact is one that isn't grounded in anything further. In the model, we might think of the individual neuron activations (or directions in activation space) as fundamental, or perhaps the weights.

  But note: the user's worry is that an SAE dictionary might not be the "real joints" of the model. So we must be cautious.

