  - **Grounding as mechanistic explanation**: The behavior of the model is grounded in the circuits. We can say that the output is grounded in the activation of a set of features that form a circuit. This is explanatory: we see how the model computes the output by breaking it down into subcomputations.

  - **Interventions**: We use activation patching and interchange interventions to test grounding. If we patch a lower-level activation and it changes the higher-level behavior, we have evidence that the higher-level behavior is grounded (at least in part) in that lower-level activation.

  However, note the metaphysical distinctions:

    a. Grounding is finer-grained than what interchange interventions can tell apart? In interp, if two different features have the same effect when intervened upon, we might say they are part of the same circuit or functionally equivalent. But grounding might require a more detailed account. For example, two features might be part of the same circuit but have different roles (one being a key and the other a value). Our interventions might not always capture that if they only look at outputs.

    b. Grounding is necessitating without being causal: In our terms, if a set of features (or a circuit) is active, then necessarily the output happens? But note: the model is deterministic? Actually, neural networks are deterministic at inference time. So if the circuit is activated, then the output is determined. However, we don't think of the circuit as causing the output in the same way that one billiard ball causes another to move? We think of it as a computation. So the necessitation is built into the model's function.

    c. Privileged bottom level: In interp, we often take the neuron activations (or residual stream vectors) as the base. But we also use SAEs to get a sparse set of features. Are these features the fundamental level? The worry is that the SAE might not be the true decomposition. Alternatively, the weights might be the fundamental level because they are what gradient descent sets and what the activations are computed from.

    d. The whole network prior to parts: The user notes that sometimes the entire network feels prior to its parts. This is because the features are defined by their role in the entire computation. Without the entire network, a direction in activation space doesn't have meaning. So perhaps the fundamental level is the entire network? But that would break the grounding hierarchy.

  Let's break down:

  - **What maps cleanly?**
    - The idea that behavior is realized by a circuit: This maps perfectly. We can point to a circuit and say: this is how the model does it.
    - Grounding as "interventions on": We can use interventions to test what grounds what. If we ablate a feature and the behavior changes, then that behavior was (partially) grounded in that feature.

  - **What only fits with fudging?**
    - **Finer-grained than interchange interventions**: Our interventions might not capture the full richness of the grounding relation. For example, if two features are always active together and have the same effect when intervened upon, we might conflate them. But in reality, they might ground two different aspects of the output. We might need more detailed interventions (e.g., path patching) to see the exact contribution.
    - **Necessitation without causation**: In the model, the circuit's activation does necessitate the output (if the rest of the model is fixed). And we don't think of it as causation in the physical sense but as computation. So this fits, but note: the model is deterministic? Yes, at inference. So if the circuit is activated, the output follows.

  - **What has no counterpart?**
    - **Privileged bottom level**: We don't have a clear fundamental level. We can go down to the weights, but then the activations are computed from the weights and the input. The weights are fixed after training. So the weights are the fundamental structure? But then the activations are just intermediate computations. However, when we do interp, we usually work at the activation level. The worry is that the SAE dictionary might be an arbitrary decomposition. So we don't have a natural fundamental level that we can point to as the ultimate ground.

    - **The whole network prior to parts**: In our framework, the network is trained as a whole, so the features are defined by the entire training process and the function of the network. This is similar to the idea that the whole is prior to the parts. We can see this in superposition: many features are represented in the same directions because the network is optimizing for capacity. So the existence of a feature is only in the context of the entire network. There's no direct counterpart for a fundamental level that is independent of the whole.

  Residue report:

  **Failures (what interp can't say but should):**
  1. **Lack of a fundamental level**: We don't have a clear candidate for the fundamental level. The weights? But they are fixed and we don't interpret them directly. The activations? But they are transient and depend on input. The features from an SAE? But we worry that the SAE might be arbitrary. This might be a gap: we cannot point to a set of fundamental facts in the model that are not grounded in anything else (within the model). The weights are the bottom, but we don't have a good way to interpret them without the activations.

  2. **Grounding without intervention?**: We rely heavily on interventions to establish grounding. But what about features that are necessary for the computation but we cannot intervene without breaking everything? We might miss them. Also, our interventions are coarse: we can only intervene on what we can measure (the features we have identified). If we haven't found the right features, we might get the grounding wrong.

  3. **The whole network as prior**: We don't have a way to talk about the network as a whole being fundamental and the features as derived. Our methods are inherently reductionist: we break the model into parts. But sometimes the behavior might be an emergent property that cannot be reduced? For example, if the model uses distributed representations and superposition, then the grounding might be holistic. We don't have tools to capture that.

  **Distinctions that do no work?**
  1. **Grounding being non-causal**: In our framework, the grounding relation is causal in the sense that we use interventions to test it. But note: the computation is deterministic and the relation is one of necessitation. We don't need a separate non-causal notion because we are in a computational system where the causal structure is defined by the computation.

  2. **Supervenience vs grounding**: In our terms, the output supervenes on the activations (and weights). But grounding is about the explanation: the circuit. So we already have a way to capture the explanatory aspect. The metaphysical distinction might not add much.

  **Advice about which level to intervene at:**
  - The grounding hierarchy suggests we should intervene at the most fundamental level that is causally responsible. But note: in the model, we can intervene at multiple levels (e.g., weights, activations, features). However, we usually intervene at the feature level because that's the level of abstraction we care about.

