answer: |-
  *(Setting down a worn copy of Chrysippus, I lean forward on my stool, elbows on knees. You see the damp plaster of the rented room behind me.)*

  "Calmer? Good. Rehearsing losses, focusing effort – these are sound exercises. But your columns? They rest on sand. You split 'control' like a butcher jointing a lamb, but the cleaver slips. Listen.

  The cylinder doesn't *control* its rolling. Its shape is given. The push is given. The rolling *follows*. Your 'effort', your 'attention', your 'saying' – these are shapes *within you*, shaped by nature, teaching, habit... fate. Is the cylinder's shape 'column one'? No. It *is* the cylinder. Your 'effort' today? It arises from your nature, your training... and yes, your aching knee, your restless night. It's *all* the cylinder. The shaping causes *include* the knee. Where is the split? You feel you 'control' the effort only when you don't see the causes pushing it.

  Now, the paper. You ask 'why act'? Because *that very impulse to submit it, or not*, is also shaped – fated! Think of the sick man. His recovery is fated *together* with his effort to call the doctor. The doctor arriving isn't 'column two' *separate* from the sick man's shouting. Fate includes the shout *and* the arrival as one woven thing. Your impulse to write, to submit, that *belongs*. It is *part* of what is 'up to us' in the true sense: it is *yours* in the way the cylinder's rolling is its own movement, sprung from its nature under the push. You act *because the acting impulse arises in you*. To not act would require a different shaping, a different fate.

  Your columns are a tool for the mind, like a child's wax tablet for letters. Useful for practice. But truth is harder: *Nothing* is 'controlled' like a master controls a slave. Everything is *accepted* as our own movement within the great web. The calm comes not from carving out a 'controlled' piece, but from seeing *all* your impulses and actions as your own fated nature responding rightly – or needing correction. So, you submit the paper *because the virtuous impulse moves you*. The outcome? Like the weather, it is woven elsewhere. Does this trouble you?"

  *(I pick up a small, smooth stone – a cylinder, perhaps – and turn it in my hand, waiting.)*
