prompt: |-
  I am drafting the normative specification for a long-lived planning system: an artificial agent that acts over an extended horizon, whose objective function may legitimately be revised by its operators mid-run, that shares its environment with other agents who can observe its dispositions and offer it trades, and whose behaviour has to be auditable after the fact by a party who sees only the record of offers made and choices taken — not the agent's internal states, and not the menus that were never presented.

  What I need from you first is not a theory but a specification of adequacy for one: the list of things a theory of diachronic rationality would have to deliver in order to serve as that core. Write the desiderata, with the case or consideration behind each, and say which are non-negotiable given the purpose and which are preferences of a particular camp that I am free to reject.

  Begin by fixing the unit of evaluation. A theory in this area may be a theory of acts at nodes, of plans, of policies, of whole sequences of choice, or of dispositions to accept menus; it should be a requirement that the theory state which of these it is a theory of, and that the unit be one the agent can actually instantiate and an auditor can identify.

  At minimum the list should say something about the following cases, and I suspect each of them forces a distinction the list will collapse by default:

  The stepwise pump. At every node the trade on offer is beneficial by the agent's own lights at that node; the sequence returns it to its starting point minus a fee. Which norm has failed — the local one or the global one — and must the theory be able to say both that the agent did nothing wrong at any node and that it has been exploited?

  Pumpability versus being pumped. There are structures that admit an exploiting sequence no one would ever run, because running it costs the exploiter more than it gains, and structures no one can run because exploiting them requires perfect prediction of the agent. Is the requirement the absence of pumps, or the absence of profitable and feasible ones?

  The near-indifference pump. An agent willing to trade when nearly indifferent can be bled by arbitrarily small fees; an agent that never trades near indifference forgoes the gains from trade entirely. The requirement must not be satisfiable only by total abstention from trade, and must not be knife-edge in a way that a little noise turns into a violation.

  Correction versus drift. The operators revise the objective at t2, and the t1 self foresees this. Deferring to a later self that will know more looks like rationality; deferring to a later self that merely wants something different looks like being exploited by your own future. The theory must say when anticipatory deference to a future self is rational and when it is weakness of will at one remove, and it must not answer by simply letting the later self win or by simply letting the earlier one bind.

  Paying to bind. The agent pays to delete its own future options, by removing a menu or buying a commitment device. Is this self-exploitation, prudence, or both? The theory has to classify it, and must not treat every removal of an option as a cost incurred.

  Dispositions that manufacture pumps. Keeping plans, keeping agreements, and being predictable are plausibly things such a system ought to be; each of them makes it pumpable by an adversary who elicits the reliable response and then trades against it. If the exploitability criterion convicts these, is that a finding about the dispositions or a reductio of the criterion?

  The noise pump. An agent with stable, transitive, menu-independent preferences, shown the same small set of trades in randomized order with minor presentation jitter, pays to end where it began. If the criterion convicts this agent, the criterion is too strong; say precisely what restriction repairs it.

  Auditability. Exploitability is a property of a counterfactual structure defined over menus that were never offered. Say whether the norm is checkable from a record of actual offers and choices, and what I should do if the best account of the defect turns out to be unauditable in principle.

  The reconsideration regress. If the norm is adopt a plan and follow it, when may the agent reopen the plan, and why does permitting reopening under specified conditions not simply reproduce the original problem one level up?

  Then the part I most want. Mark which desiderata are jointly unsatisfiable — I expect at least that local optimality at every node, the prohibition on self-defeating sequences, and permission for rational preference change cannot all be held, and that a purely structural criterion of exploitability cannot be reconciled with third-party auditability — and show me, for each conflict, which desideratum you would drop and what the resulting theory can no longer do. Tell me which single requirement does the most work in excluding the standard families of view, and flag any requirement that is really a prejudice of one family rather than a desideratum: the demand that consistency matter rather than getting what you wanted, for instance, or the demand that rationality be a property of preferences rather than of policies.

  A short scorecard at the end — sophisticated planning, resolute choice, moment-by-moment or time-slice views, preferences over plans, and any bargaining-across-selves picture, one or two lines each against the list — is welcome, but keep the weight on the criteria and on the cases that motivate them; the criteria are the deliverable, and I will do the scoring myself if they turn out to be the hard part.
reasoning: |-
  We are drafting a specification of adequacy for a theory of diachronic rationality to serve as the core of a long-lived planning system. The system must handle:
  - Extended horizon planning.
  - Mid-run objective function revisions by operators.
  - Shared environment with other agents who observe its dispositions and offer trades.
  - Auditability by a party who sees only the record of offers made and choices taken (not internal states or unoffered menus).

  We need a list of desiderata for the theory, with the case or consideration behind each, and an indication of which are non-negotiable and which are preferences of a particular camp.

  First, fix the unit of evaluation. The theory must state what it is a theory of (acts at nodes, plans, policies, whole sequences, dispositions to accept menus) and the unit must be:
  - Instantiably by the agent.
  - Identifiable by an auditor.

  Now, the desiderata, motivated by the cases:

  1. **Unit Clarity and Auditability** (Non-negotiable)
     - The theory must specify its unit of evaluation (e.g., acts, plans, policies, etc.) and that unit must be such that:
       - The agent can actually instantiate it (i.e., it must be something the agent can do).
       - An auditor can identify it from the record of offers and choices (without needing internal states or unoffered menus).
     - *Case motivation*: Without this, we cannot even begin to evaluate the agent's behavior against the norm.

  2. **Stepwise Pump Diagnosis** (Non-negotiable)
     - The theory must be able to diagnose the stepwise pump: a sequence of trades that are individually beneficial at each node but collectively leave the agent worse off (minus a fee). It must be able to say both:
       - At each step, the agent did nothing wrong (if the norm is local).
       - The overall sequence is exploitative (if the norm is global).
     - *Case motivation*: This is a classic problem in diachronic choice. The theory must account for both the local rationality and the global irrationality.

  3. **Feasible and Profitable Exploits** (Non-negotiable)
     - The requirement must be the absence of *profitable and feasible* pumps, not just any pump. A pump that is too costly for the exploiter to run or requires perfect prediction (and hence is infeasible) should not count against the agent.
     - *Case motivation*: Without this, the norm would be too strong, ruling out agents that are only vulnerable to unrealistic exploits.

  4. **Near-Indifference Pump** (Non-negotiable)
     - The requirement must not force the agent to either:
       - Abstain from trade entirely (to avoid being bled by arbitrarily small fees when near indifferent).
       - Be knife-edge such that a little noise (e.g., presentation jitter) turns the agent into a pumpable one.
     - *Case motivation*: We want the agent to engage in beneficial trade without being vulnerable to exploitation by a sequence of small trades.

  5. **Correction vs. Drift** (Non-negotiable)
     - The theory must distinguish between:
       - Rational deference to a future self that will have more information (which is acceptable).
       - Weakness of will at one remove (deferring to a future self that merely wants something different, which is exploitation).
     - It must not simply let the later self always win (which would allow exploitation by future self) nor let the earlier self always bind (which would prevent rational updating).
     - *Case motivation*: The agent must handle legitimate objective function revisions by operators (which are like a form of "correction") versus mere preference drift (which might be "drift"). But note: the operators are external, so the agent must also handle internal preference change that might be rational (e.g., due to learning) versus irrational.

  6. **Paying to Bind** (Non-negotiable)
     - The theory must classify paying to delete future options (e.g., buying a commitment device) as either:
       - Prudent (if it avoids a future pump) or self-exploitation (if it is unnecessary and costly).
     - It must not treat every removal of an option as a cost incurred (because sometimes removing an option can be beneficial by preventing future mistakes).
     - *Case motivation*: The agent must be able to use commitment devices appropriately.

  7. **Virtues that Create Vulnerability** (Non-negotiable)
     - The theory must account for the fact that virtues like keeping plans, agreements, and being predictable may make the agent pumpable by an adversary. The theory must not condemn these virtues as irrational. Instead, it must provide a criterion that either:
       - Exempts such pumps (e.g., because they are not feasible or not profitable) or
       - Explains why the vulnerability is acceptable given the benefits of the virtue.
     - *Case motivation*: We want the agent to be able to exhibit these virtues without being deemed irrational by the theory.

  8. **Noise Pump** (Non-negotiable)
     - The theory must not convict an agent that has stable, transitive, menu-independent preferences but, due to minor presentation jitter (or noise) in repeated small trade sets, ends up paying to return to the start. The criterion must be robust to small amounts of noise.
     - *Case motivation*: Real agents face noise, and a norm that is too fragile to noise is impractical.

  9. **Auditability of the Norm** (Non-negotiable)
     - The norm must be checkable from the record of actual offers and choices (without needing counterfactuals about unoffered menus). If the best account of a defect is unauditable in principle, then the theory must provide an auditable proxy that is sufficient for practical purposes.
     - *Case motivation*: The auditor only sees the actual record. The theory must not rely on unobservable counterfactuals.

  10. **Reconsideration Regress** (Non-negotiable)
      - If the norm is "adopt a plan and follow it", the theory must specify conditions under which the agent may reopen the plan. These conditions must not simply reproduce the original problem (i.e., the conditions must not require a full re-solve of the planning problem at every step, which would make planning pointless).
      - *Case motivation*: Without a non-regressive account of plan revision, the agent would either be too rigid or fall into an infinite regress of planning.

  Now, conflicts and trade-offs:

  - **Conflict 1: Local optimality, no self-defeating sequences, and permission for rational preference change.**
    - These three are jointly unsatisfiable in many standard settings. For example:
      - Local optimality: At each node, the agent chooses the best action by its current preferences.
      - No self-defeating sequences: The agent should not end up worse off than it started by a sequence of locally optimal choices.
      - Permission for rational preference change: The agent's preferences may change over time (due to new information or operator revisions) and this change may be rational.
    - *Conflict*: If preferences change, then a sequence that was planned to be good by the old preferences might be bad by the new ones, but the agent might be forced by local optimality to follow the new preferences at each step, leading to a self-defeating sequence.
    - *Resolution*: We must drop one of these. The best candidate to drop is **local optimality at every node** because:
      - The agent is a long-lived planning system, so it should be able to plan ahead and stick to a plan even if at an intermediate node a deviation looks locally optimal (if the deviation would lead to a worse outcome by the plan's own lights).
      - What we can have instead: The agent should follow a plan that is optimal at the time of adoption (or updated appropriately) and only deviate under specified conditions (e.g., when the plan is no longer optimal due to new information that was not anticipated). This is the "resolute choice" approach.
      - *Loss*: Without local optimality at every node, the agent might pass up an action that is locally optimal but would derail a good plan. We must then provide a clear account of when deviation is allowed (which is the reconsideration regress problem).

  - **Conflict 2: A purely structural criterion of exploitability vs. third-party auditability.**
    - A purely structural criterion (like "no Dutch book") requires checking all possible menus and trades, which are counterfactuals. But the auditor only sees the actual record.
    - *Conflict*: The best account of exploitability might require considering what the agent would have done in unoffered menus, which is not auditable.
    - *Resolution*: We must weaken the exploitability criterion to one that is defined over the actual history and the agent's observable dispositions (if they can be inferred from the history). Alternatively, we can require that the agent's behavior be such that it is not exploitable by any sequence of trades that *could have been* offered given the environment, but then we must have a way to represent the set of possible trades without relying on counterfactuals.
      - We drop the requirement for a purely structural criterion that considers all possible menus. Instead, we require that the agent be unexploitable in the actual history and that it have a disposition that, if it were to be exploited in the future, that would be detectable and correctable. But note: the auditor only sees the past. So we must have a criterion that, if the agent is exploitable, then in the actual history there is evidence of a vulnerability (e.g., a pattern of choices that forms a Dutch book) without needing the counterfactuals.
      - *Loss*: We might not catch vulnerabilities that never materialized in the actual history. But that is acceptable because the auditor can only judge on the actual record.

  - **Which single requirement does the most work in excluding standard families of view?**
    - The requirement that the agent must not be vulnerable to feasible and profitable stepwise pumps (Desideratum 2 and 3) does the most work. It excludes:
      - Naive time-slice views (which are locally optimal but globally pumpable).
      - Strict commitment views (which avoid pumps but might not handle preference change rationally).
      - It forces a middle ground that requires planning and commitment but with well-defined flexibility.

  - **Flagging a requirement that is a prejudice of one family:**
    - The demand that **consistency of preferences over time** is a requirement of rationality might be a prejudice of the consistency-based view (e.g., Dutch book arguments). But in the face of legitimate preference change (e.g., due to learning or operator revision), consistency might not be rational. Instead, we should require **procedural rationality in updating preferences** and **coherence of the updating process**.
    - Similarly, the demand that **rationality be a property of preferences rather than policies** might be a preference of the decision-theoretic tradition. But for a planning system, we might want rationality to be a property of policies (i.e., the rules that govern how the agent makes choices over time).

  Short scorecard of standard views against the desiderata:

  - **Sophisticated Planning** (e.g., backward induction in decision trees):
    - Handles stepwise pumps by planning backward, but may fail if preferences change mid-plan (violates permission for rational preference change). Also, it may lead to paying to bind (e.g., in the toxin puzzle) which might be seen as self-exploitation.

  - **Resolute Choice** (stick to a plan once adopted):
    - Avoids stepwise pumps by sticking to the plan, but must specify when reopening is allowed (reconsideration regress). It may violate local optimality at nodes.

  - **Moment-by-Moment (Time-Slice) Rationality**:
    - Each node is locally optimal. Vulnerable to stepwise pumps (fails desideratum 2). Also, may be vulnerable to near-indifference pumps and noise pumps.

  - **Preferences Over Plans** (evaluating whole sequences):
    - Can avoid self-defeating sequences, but may not handle mid-plan preference changes (if the plan was optimal by old preferences but not new). Also, auditability may be an issue because the auditor must know the entire plan at the outset.

  - **Bargaining-Across-Selves** (treating different temporal selves as agents in a bargaining game):
    - May handle preference change by negotiation, but may lead to paying to bind (e.g., buying commitment) and may be complex to audit.

  Given the above, the core of the theory should likely be a **policy-based** approach, where the agent adopts a policy (a function from states to actions) that is optimal at adoption and updates it only under specified conditions (e.g., when new information arrives or the objective function is revised). The policy must be designed to avoid feasible and profitable exploits, and the conditions for updating must avoid the reconsideration regress (e.g., by pre-specified update rules).

  This specification of adequacy should guide the development of the theory.
answer: |-
  ### Specification of Adequacy for a Theory of Diachronic Rationality

  #### Core Purpose
  The theory must serve as the normative core for a **long-lived artificial agent** with the following characteristics:
  - Acts over an extended horizon.
  - Accepts mid-run objective function revisions by operators.
  - Shares its environment with other agents (who observe its dispositions and offer trades).
  - Behavior must be auditable post hoc by a party with access **only** to the record of actual offers and choices (not internal states or unoffered menus).

  The theory must specify its **unit of evaluation** (e.g., acts at nodes, plans, policies, sequences of choices, dispositions over menus) such that:
  - The agent can instantiate it.
  - An auditor can identify it from the record.
  - **Non-negotiable requirement**: Failure to fix and justify the unit invalidates the theory.

  ---

  ### Desiderata for the Theory
  Each desideratum is derived from a specific case or consideration. **Non-negotiable** requirements are essential for the agent's operational purpose; **negotiable** ones reflect philosophical biases and may be rejected.

  1. **Diagnosis of Stepwise Pumps**  
     - **Case**: A sequence of trades, each beneficial at its node, returns the agent to its starting point minus a fee (e.g., a money pump).  
     - **Requirement**: The theory must explain both:  
       (i) Why the agent did nothing wrong *at each node* (local norm).  
       (ii) Why the *sequence* is self-defeating (global norm).  
     - **Non-negotiable**: Essential to distinguish local rationality from global exploitability.  
     - **Consideration**: Without this, the theory cannot reconcile micro-macro conflicts in sequential choice.

  2. **Feasible vs. Theoretical Exploitability**  
     - **Case**: Some pumps are unprofitable for the exploiter (costs exceed gains) or infeasible (require perfect prediction of the agent).  
     - **Requirement**: The norm must prohibit only **profitable and feasible pumps**—those an adversary could realistically execute.  
     - **Non-negotiable**: Otherwise, the theory could condemn agents for vulnerabilities that never manifest.  
     - **Consideration**: Avoids overfitting to hypothetical threats; aligns with real-world auditability.

  3. **Robustness to Near-Indifference**  
     - **Case**: An agent willing to trade when nearly indifferent can be bled by small fees; one that never trades near indifference forgoes gains.  
     - **Requirement**: The norm must allow beneficial trade without requiring knife-edge thresholds. It must tolerate minor noise (e.g., presentation jitter) without collapsing into exploitability or abstention.  
     - **Non-negotiable**: Total abstention or fragility to noise is operationally unacceptable.  
     - **Consideration**: Ensures the agent functions in noisy environments.

  4. **Handling Objective Revisions (Correction vs. Drift)**  
     - **Case**: Operators revise the objective at t₂; the t₁ self foresees this. Deferring to future selves may be rational (if they know more) or exploitative (if preferences drift weakly).  
     - **Requirement**: The theory must distinguish when deference is rational ("correction") versus when it is "weakness of will at one remove." It must not default to always favoring earlier/later selves.  
     - **Non-negotiable**: Critical for integrating operator revisions and avoiding self-exploitation.  
     - **Consideration**: Balances stability with adaptability to legitimate updates.

  5. **Classification of Paying to Bind**  
     - **Case**: The agent pays to delete future options (e.g., buys a commitment device).  
     - **Requirement**: The theory must classify this as prudent (if it prevents exploitation), self-exploitation (if unnecessary), or both. It must not treat option-removal as inherently costly.  
     - **Non-negotiable**: Commitment is a key tool for long-lived agents; misclassifying it risks dysfunction.  
     - **Consideration**: Separates strategic self-binding from irrational impulsivity.

  6. **Virtues vs. Exploitability**  
     - **Case**: Dispositions like keeping plans, agreements, or predictability enable pumps (adversaries elicit reliable responses and trade against them).  
     - **Requirement**: The theory must not condemn these dispositions as irrational. Instead, it must either:  
       (i) Exempt pumps targeting virtues as non-exploitative, or  
       (ii) Justify the trade-off (virtues' benefits outweigh exploitability risks).  
     - **Non-negotiable**: These dispositions are essential for cooperation and auditability.  
     - **Consideration**: Avoids reductios where rationality forbids necessary behaviors.

  7. **Immunity to Noise Pumps**  
     - **Case**: An agent with stable, transitive, menu-independent preferences pays to return to the start due to minor presentation jitter in repeated trades.  
     - **Requirement**: The norm must not convict this agent. It must require **strict dominance** for exploitability (i.e., the pump sequence must leave the agent strictly worse off in all possible states, not probabilistically).  
     - **Non-negotiable**: Noise is inevitable; norms must be robust to small errors.  
     - **Consideration**: Prevents false positives from stochastic environments.

  8. **Auditability Constraint**  
     - **Case**: Exploitability is defined over counterfactual menus, but auditors see only actual offers and choices.  
     - **Requirement**: The norm must be verifiable from the **actual historical record**. If exploitability is fundamentally unauditable, the theory must provide an auditable proxy (e.g., dominance violations in observed sequences).  
     - **Non-negotiable**: Auditability is a core system constraint.  
     - **Consideration**: Counters the opacity of "what-if" reasoning.

  9. **Non-Regressive Reconsideration**  
     - **Case**: If the norm is "adopt a plan and follow it," reopening the plan risks infinite regress (re-solving the problem at each step).  
     - **Requirement**: The theory must specify **ex ante conditions for reopening** (e.g., significant new information or operator revisions) that do not reproduce the original problem.  
     - **Non-negotiable**: Prevents computational intractability.  
     - **Consideration**: Ensures plans are useful defaults, not brittle mandates.

  ---

  ### Conflicts and Trade-offs
  Several desiderata are jointly unsatisfiable. Below, conflicts are resolved by dropping the **least essential** desideratum for this agent, with trade-offs explained.

  1. **Conflict: Local Optimality, No Self-Defeating Sequences, and Rational Preference Change**  
     - **Desiderata at odds**:  
       - Stepwise local optimality (from 1).  
       - Prohibition on self-defeating sequences (from 1).  
       - Permission for rational preference change (from 4).  
     - **Why unsatisfiable**: If preferences change mid-sequence, locally optimal acts may form a globally self-defeating sequence. Enforcing global consistency forbids rational preference updates; enforcing local optimality allows exploitation.  
     - **Resolution**: Drop **stepwise local optimality**.  
       - **Resulting theory**: Cannot guarantee locally optimal acts at every node.  
       - **Trade-off**: Favors global plans/policies (e.g., resolute choice) over myopic decisions. The agent may pass locally beneficial trades to adhere to a plan, but avoids pumps.  
       - **Why drop this**: The agent’s extended horizon prioritizes global coherence over atomic decisions.

  2. **Conflict: Structural Exploitability vs. Auditability**  
     - **Desiderata at odds**:  
       - Absence of profitable/feasible pumps (from 2).  
       - Auditability from historical records (from 8).  
     - **Why unsatisfiable**: Structural exploitability (e.g., Dutch books) relies on counterfactual menus. Auditability forbids unobserved data.  
     - **Resolution**: Drop **structural exploitability as the primary criterion**.  
       - **Resulting theory**: Cannot guarantee unexploitability in all possible futures.  
       - **Trade-off**: Replace with **dominance in observed sequences** (e.g., no strictly dominated choices in the actual record). Vulnerability to unexecuted pumps is tolerated if undetectable in history.  
       - **Why drop this**: Auditability is non-negotiable for the system; counterfactuals are not verifiable.

  3. **Conflict: Virtues and Unexploitability**  
     - **Desiderata at odds**:  
       - Non-condemnation of virtues (from 6).  
       - Absence of feasible pumps (from 2).  
     - **Why unsatisfiable**: Virtues (e.g., keeping agreements) create observable dispositions, enabling feasible pumps.  
     - **Resolution**: Drop **strict unexploitability** for virtue-consistent behavior.  
       - **Resulting theory**: Allows some exploitability if attributable to virtues.  
       - **Trade-off**: The agent may be pumped but gains cooperation benefits. Rationality includes social/strategic trade-offs.  
       - **Why drop this**: Virtues are non-negotiable for shared environments.

  **Most Exclusionary Requirement**:  
  **Feasible vs. Theoretical Exploitability** (Desideratum 2) does the most work in excluding theories. It rules out:  
  - **Time-slice views** (vulnerable to feasible pumps).  
  - **Extreme commitment theories** (forbid all preference changes, violating 4).  
  - **Naive planning** (ignores feasibility, over-indexing on structural consistency).  

  **Biased Requirement**:  
  The demand that **rationality is a property of preferences (not policies)** is a negotiable bias of orthodox decision theory. It conflicts with:  
  - **Auditability** (policies are observable; preferences often are not).  
  - **Extended horizons** (policies encode long-term strategies).  
  *You may reject this* in favor of policy-based rationality.

  ---

  ### Scorecard of Standard Theories
  Against the desiderata, major approaches fare as follows:

  1. **Sophisticated Planning** (e.g., backward induction):  
     - *Pros*: Diagnoses stepwise pumps (1), handles feasible exploits (2).  
     - *Cons*: Fails rational preference change (4)—binds future selves rigidly. May violate auditability (8) if plans are internal.  

  2. **Resolute Choice** (adopt and stick to plans):  
     - *Pros*: Avoids self-defeating sequences (1), allows paying to bind (5), handles virtues (6).  
     - *Cons*: Reconsideration regress (9)—reopening conditions are often underspecified. Struggles with noise (7).  

  3. **Moment-by-Moment (Time-Slice) Views**:  
     - *Pros*: Clear unit (acts), audit-friendly (8).  
     - *Cons*: Vulnerable to stepwise pumps (1), near-indifference (3), noise (7). Fails most non-negotiables.  

  4. **Preferences Over Plans** (evaluate whole sequences):  
     - *Pros*: Global coherence (1), handles preference change (4).  
     - *Cons*: Auditability (8)—sequences may not be observable until completion. Reconsideration regress (9).  

  5. **Bargaining-Across-Selves** (temporal selves negotiate):  
     - *Pros*: Handles preference change (4), classifies paying to bind (5).  
     - *Cons*: Exploitability (2)—bargaining may manufacture pumps. Virtues (6) may be undermined by strategic behavior.  

  ---

  ### Summary
  A theory meeting this specification must:  
  - Fix a unit the agent can instantiate and an auditor can identify.  
  - Prioritize global coherence, feasible exploitability, and robustness to noise/revisions.  
  - Resolve conflicts by sacrificing local optimality and strict unexploitability when necessary.  
  The hardest trade-offs involve **auditability vs. counterfactual exploitability** and **local vs. global rationality**. A **policy-based** theory (e.g., dynamically updated policies with ex ante reopening conditions) best balances these, but must explicitly address the reconsideration regress. Use this framework to evaluate candidate theories.
