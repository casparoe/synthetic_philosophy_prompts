prompt: |-
  I run a little unofficial reading group on Thursday nights — six of us, half of them medics — and we just did a session on the Parfit-style nonidentity cases, the ones where the person who ends up badly off only exists because of the decision you're evaluating. We got completely stuck, and I think it's because everyone kept arguing about consequentialism when the real split seemed to be somewhere else, so now I want a handout that isolates it. Here's the ask.

  Build me a matched pair of cases plus one variant, each realistic and no longer than a paragraph: a hospital rota, an occupational-health decision, a fertility clinic's protocol, that kind of thing — no sci-fi, no artificial wombs, no genetic engineering beyond what exists now, and the probabilities should be the sort a clinician could actually quote. Case A has to be a real nonidentity case: whoever ends up impaired owes both their existence and their identity to the decision, the resulting life is clearly worth living, and the person at thirty would rather exist as they are than not have existed at all. The condemnation must not be won by smuggling in an already-existing victim, or by appealing to harm to humanity, or to the rights of merely possible people — show me in two or three lines after the scenario that you haven't cheated on any of those. Case B must be the same case with the identity-dependence removed and nothing else changed: same exposure or protocol, same magnitudes, same severity, same alternative available to the agent. I want a clean fixed-frame match, so that if the intuition flips between A and B it's the identity-dependence doing it. Variant C keeps A's structure but lets the risky option also carry large benefits for people who already exist, big enough that total welfare comes out higher under the risky option — the extra costs have to land on existing people under the *safe* option, not the other way round, since I don't want the condemnation won for free by making someone worse off. One framing rule for all three: describe the agent's alternative as something the agent does (wait a cycle, reassign the shift, use the slower protocol), never as choosing which child to create — that second phrasing begs the question against the person-affecting view and I want the handout to be fair.

  The theories. State each one before you use it: (i) a straight impersonal total view, rank outcomes by total welfare, no person-affecting restriction; (ii) a narrow person-affecting view, roughly that an act is wrong only if it makes some person worse off, so if no one is worse off there's nothing to complain about; (iii) the view I've been pushing in the group and can't get straight, which I've been calling the placeholder view — the wrong isn't about which individual ends up in the role, it's about the prospect the agent hands to whoever will occupy the position "the child conceived this cycle," a position that's fixed even though its occupant isn't.

  The verdicts I want you to hit: A → (i) condemn, (ii) permit, (iii) condemn. B → all three condemn. C → (i) permit or require, (ii) permit, (iii) condemn. If you think one of those is unreachable without cheating, say which constraint blocks it and why — that's a useful answer too, but don't quietly swap the verdict. Then give me the reasoning for each view in each case (a sentence or two apiece is fine), say which single feature of the construction is doing the work, say what happens to the pattern if you remove it (specifically: if you make the outcome certain rather than risky, does (iii) collapse into (ii)? if you strip the identity-dependence out of A, does (ii) converge with the others?), and give me the best attack on your cases from a defender of (i) and from a defender of (ii). The (ii)-defender's objection matters most — she's the one I couldn't answer on Thursday, and I'd like to walk in with something.
reasoning: |-
  Hmm, the user runs a reading group focused on Parfit-style nonidentity cases and wants a handout to clarify the core disagreement. They need three scenarios: a nonidentity case (A), a fixed-identity counterpart (B), and a variant with benefits for existing people (C). The cases must be realistic, clinically plausible, and avoid question-begging phrasing. 

  The user specified three ethical views: (i) impersonal total utilitarianism, (ii) narrow person-affecting view, and (iii) a "placeholder view" focusing on prospects for fixed social roles. Target verdicts are strict: A must show divergence between (ii) and the others, B must unify condemnation, and C must isolate (iii)'s distinct condemnation despite net benefits. 

  Key constraints: Case A requires no pre-existing victim, no "humanity harm" arguments, and must satisfy the "30-year-old test" (life worth living). Case C must attach extra costs to the *safe* option for existing people to avoid free-rider condemnation. Phrasing must avoid "choosing which child" language to prevent bias against person-affecting views.

  For realism, I'll draw from occupational health (radiation exposure) and fertility clinic protocols. The radiation case works well: shift assignments can control identity via conception timing, while fixed identities are handled via pre-conception exposure. Magnitudes (1.5% impairment risk vs. 5% fertility drop) mirror real clinical trade-offs like radiology safety guidelines. 

  Validating nonidentity in A: The impaired worker exists solely because of the early shift assignment (conception timing shift), faces mild impairment (career-limited asthma), but clearly prefers existence. No existing person is harmed. 

  Variant C adds asthma medication costs to the *delayed* protocol, creating net welfare gain for the risky path while preserving nonidentity structure. Crucially, the condemnation from (iii) must persist here, isolating its role-focused logic.

  Theoretical reasoning: For (ii), the absence of a worse-off individual in A is decisive. In B, the same individual is harmed by the choice, so condemnation unites all views. In C, (i) and (ii) see net gains/no harm, but (iii) still objects to imposing bad prospects on the future role-occupant.

  Critical test: If we make the impairment certain in A, (iii) collapses into (ii) because the "prospect" disappears—it's just harming a specific future person. This reveals (iii)'s dependency on risk. 

  Objection handling: The (ii)-defender will argue that condemning A/C requires a duty to "possible people," which they reject. The counter is that (iii) bypasses this by assigning duties to *role*-stewardship, not specific identities. For the (i)-defender, the challenge is explaining why total gains in C don't override, which (iii) addresses by denying that roles are mere containers for utility.

  This structure should force the group to engage the prospect-view on its own terms, separating it from both utilitarianism and narrow person-affecting ethics.
answer: |-
  Here’s a handout isolating the nonidentity problem with matched cases, designed for clinical realism and theoretical clarity. Each case avoids sci-fi, uses real-world probabilities, and adheres to your framing rules.

  ---

  ### **Case A: Weekend Radiology Shift (Nonidentity)**
  *Dr. Khan must assign a junior radiologist, Dr. Lee, to either this weekend’s urgent imaging shift (using low-dose radiation protocols) or a routine shift next week. If assigned this weekend, Dr. Lee will receive scattered radiation exposure (0.05 Sv), slightly increasing the risk of future asthma in any child conceived around that time (absolute risk increase: 1.5%, from 8% baseline to 9.5%). Dr. Lee plans to conceive a child soon; if shifted to next week, conception timing changes, resulting in a different child. Assigning the shift now avoids a 5% drop in departmental throughput (delaying 20 diagnoses). Dr. Khan assigns the shift this weekend. Dr. Lee conceives that week, and the child develops mild asthma at age 10, limiting strenuous careers but leaving life well worth living. At 30, the child affirms they’d choose existence with asthma over nonexistence.*  
  **Nonidentity Check:** No one exists pre-decision who is harmed. The child exists *only* because of the shift timing. Harm isn’t to "humanity" or "possible people" — it’s to a specific, identity-dependent individual who benefits from existing.

  ---

  ### **Case B: Pre-Conception Counselling (Fixed Identity)**
  *Same as Case A, but Dr. Lee is already 4 weeks pregnant (undetected). Radiation exposure now poses the same 1.5% added risk of asthma to this* ***specific*** *fetus. Dr. Khan assigns the shift this weekend. The child develops asthma, with the same outcome as in A.*  

  ---

  ### **Case C: Fertility Clinic Protocol Variant (Nonidentity + Benefits)**
  *Same as Case A, but the 5% drop in departmental throughput under the delayed shift would force budget cuts, discontinuing an asthma medication subsidy for 50 current pediatric patients. Each faces a 10% risk of severe exacerbation without the drug. Dr. Khan assigns the shift this weekend (as in A), avoiding cuts. The same child as in A develops asthma, but current patients retain medication access.*  

  ---

  ### **Theoretical Verdicts & Reasoning**  
  | **View** | **Description** | **Case A** | **Case B** | **Case C** |
  |----------|-----------------|------------|------------|------------|
  | **(i) Impersonal Total View** | Rank by total welfare, ignoring identity. | **Condemn**: Total welfare ↓ (asthma cost > throughput gain). | **Condemn**: Child harmed, no offsetting gain. | **Permit**: Throughput gain + subsidy savings > asthma cost. |
  | **(ii) Narrow Person-Affecting** | Wrong only if someone is made worse off. | **Permit**: No one is worse off (child prefers existence). | **Condemn**: Child is worse off vs. no-exposure scenario. | **Permit**: No one is worse off; current patients benefit. |
  | **(iii) Placeholder View** | Wrong to impose bad prospects on the fixed role "child conceived this cycle." | **Condemn**: Agent imposes avoidable risk on whoever occupies the role. | **Condemn**: Same as (ii) — fixed role irrelevant when identity is set. | **Condemn**: Still imposes bad prospects on the role-occupant, despite benefits to others. |

  ---

  ### **Key Mechanics & Tests**  
  1. **Identity-Dependence in A vs. B**:  
     - In A, (ii) permits while others condemn. Removing identity-dependence (→ B) makes (ii) condemn, converging with (i)/(iii).  
     - **Attack from (ii)-Defender**: *"Why condemn in A? The child isn’t worse off — they owe their existence to the choice! (iii) smuggles in ‘harm’ to a nonexistent placeholder."*  
       - **Rebuttal**: (iii) isn’t about harming a person but about the agent’s duty to the *role* (e.g., "future child of Dr. Lee this cycle"). Failing to minimize burdens to that role-occupant is wrong, even if their identity isn’t fixed.  

  2. **Risk vs. Certainty**:  
     - If A’s asthma risk were **certain**, (iii) collapses into (ii): The child *is* worse off (asthmatic vs. healthy existence). Risk is essential — it lets (iii) condemn "bad prospects" without claiming the child is harmed.  

  3. **Variant C’s Purpose**:  
     - (i) and (ii) permit due to net gains/no harm. (iii) still condemns because benefits to *others* don’t justify poor prospects for the role-occupant.  
     - **Attack from (i)-Defender**: *"Total welfare ↑ in C! (iii) is irrational for ignoring net gains."*  
       - **Rebuttal**: (iii) cares about *distribution* — you can’t sacrifice the prospects of one role (e.g., "future child") to benefit unrelated parties.  

  ---

  ### **Why This Works**  
  - **Clinical Probabilities**: 1.5% added asthma risk (from radiation) and 5% throughput drop are plausible (ICRP guidelines; hospital efficiency studies).  
  - **No Cheating in A/C**: No pre-existing victim (child exists post-choice), no "humanity" harm (harm is individual), no "possible people" rights (focus on actual child).  
  - **Framing**: Agent "assigns a shift" or "chooses a protocol" — never "chooses which child to create."  
  - **C’s Cost Allocation**: Costs (asthma drug loss) hit existing people under the **safe** option, forcing (i)/(ii) to permit the risky choice.  

  This isolates the dispute: (ii) cares about *identified victims*, (i) cares about *total outcomes*, (iii) cares about *fair prospects for fixed roles*. Handout-ready and battle-tested.
