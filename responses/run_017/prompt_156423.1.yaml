prompt: |-
  hey — im helping a tiny grantmaker (three staff, maybe $400k a year to move) redo their cause-scoring sheet. Right now it's plain ITN: importance × tractability × neglectedness, each 1–5, multiplied. Someone on the board wants to bolt on five extra "correction terms," and I cant tell which of them are real signal and which are just a way to smuggle in someone's favorite cause:

  1. crowding-out — how much of our marginal dollar just displaces another funder's dollar instead of paying for new work
  2. feedback speed — how many years pass before you find out whether you were wrong
  3. talent-vs-capital bottleneck — whether the field is short of good people or short of money (the pitch being that neglectedness should only count if its money thats missing)
  4. reversibility — how much of the damage you could undo if you backed the wrong horse
  5. legibility discount — how much of the apparent importance is really just an artifact of the problem being easy to measure

  Rate each 0–10 on how much it should actually move a naive ITN score, rank them, and give one line per term saying why it lands where it does. One more thing: we're also deciding whether next year's money should go to one extra staff hire instead of grants — does the sheet need a different score depending on whether the thing being allocated is dollars or a person's year of attention, and if so which of the five terms changes most or flips direction?
reasoning: |-
  We are evaluating five potential "correction terms" to add to a basic ITN (Importance, Tractability, Neglectedness) scoring system for a small grantmaker. The goal is to assess how much each term should adjust a naive ITN score (each rated 0-10) and then rank them. Additionally, we need to consider if the scoring should differ when allocating dollars vs. a staff person's time (i.e., hiring an extra staff member instead of making grants) and which of the five terms would change the most or flip in that scenario.

  ### Step 1: Rate and Justify Each Term (0-10)
  1. **Crowding-out**: How much of our marginal dollar displaces another funder's dollar?
     - **Rating**: 8
     - **Justification**: This directly affects the net impact of the grant. If your dollar just replaces another, the real impact is near zero. High impact adjustment.

  2. **Feedback speed**: How many years to learn if you were wrong?
     - **Rating**: 6
     - **Justification**: Slower feedback loops increase the risk of persisting with ineffective interventions, so this term adjusts for the cost of delayed learning. Moderate adjustment.

  3. **Talent-vs-capital bottleneck**: Does neglectedness only matter if money is the missing input?
     - **Rating**: 4
     - **Justification**: While important, the core ITN already captures neglectedness (which includes both money and talent). This might be partially redundant and context-specific. Low to moderate adjustment.

  4. **Reversibility**: How much damage can be undone if you back the wrong horse?
     - **Rating**: 7
     - **Justification**: Irreversible harms (e.g., species extinction) are much riskier than reversible ones. This term helps account for downside risk. High adjustment.

  5. **Legibility discount**: How much of the importance is due to easy measurement?
     - **Rating**: 9
     - **Justification**: Many problems are underrated because they are hard to measure (e.g., mental health vs. physical health). This corrects for a major bias in the "importance" score. Very high adjustment.

  ### Step 2: Rank the Terms by Impact on Naive ITN
  Based on ratings (highest to lowest):
  1. **Legibility discount** (9) - Corrects a fundamental bias in how importance is perceived.
  2. **Crowding-out** (8) - Directly impacts the net effect of funding.
  3. **Reversibility** (7) - Critical for risk management.
  4. **Feedback speed** (6) - Important for learning and adaptation.
  5. **Talent-vs-capital bottleneck** (4) - Less universally applicable; may overlap with neglectedness.

  ### Step 3: Different Scoring for Dollars vs. Staff Attention?
  The question is whether the scoring sheet should change when allocating dollars (grants) versus a staff person's year of attention (hiring). 

  - **Why it might differ**: 
    - **Grants (dollars)**: The primary constraints are financial, and the impact is through funding projects. Factors like crowding-out and talent bottlenecks (if the bottleneck is money) are directly relevant.
    - **Staff attention (hiring)**: The resource is human capital. The impact is through the staff's work (e.g., research, due diligence, capacity building). Factors like feedback speed and reversibility might be more critical because staff time can be reallocated faster than undoing a grant, and learning cycles are shorter.

  - **Which terms change most or flip?**
    - **Talent-vs-capital bottleneck**: This term might flip or change significantly. 
      - For grants: Neglectedness due to a lack of money is highly relevant (so the term would adjust the score up if money is the bottleneck). 
      - For staff attention: If the field is talent-constrained (short of good people), then adding a staff member (if they are highly skilled) could be more impactful than money. Thus, the term might adjust the score upward for talent bottlenecks when allocating staff time, whereas for grants it would adjust for money bottlenecks. Essentially, the bottleneck type that matches the resource being allocated becomes the focus.
    - **Crowding-out**: Less relevant for staff time because hiring a staff member doesn't directly displace another funder's staff. It might even become a positive if the staff enables leveraging more funds (e.g., by writing grant proposals). So this term might become negligible or flip to a "crowding-in" effect.
    - **Feedback speed**: More critical for staff time because staff can pivot faster than multi-year grants. A cause with slow feedback might be less suitable for staff attention (since you want to learn quickly to adjust their work) but acceptable for grants (which are committed). Thus, the adjustment might be more negative for slow feedback when allocating staff.
    - **Reversibility**: Still important for both, but staff time might be more reversible (you can reassign the staff member) than a grant (which is spent). So the adjustment for irreversibility might be less severe for staff time.
    - **Legibility discount**: Should remain similar because it's about the underlying problem, not the resource type.

  ### Summary for the Grantmaker:
  - **For the five terms**: 
    - Implement **legibility discount**, **crowding-out**, and **reversibility** as they are high-impact adjustments. 
    - **Feedback speed** is medium-priority, and **talent-vs-capital bottleneck** is lower priority (and context-dependent).
  - **For dollars vs. staff allocation**: 
    - **Yes, the scoring should differ**, especially for the **talent-vs-capital bottleneck** term (it flips: for staff, talent bottlenecks are more critical; for grants, capital bottlenecks). 
    - **Crowding-out** becomes less relevant or flips for staff, and **feedback speed** becomes more critical for staff time.

  ### Final Recommendations:
  1. **Adopt** legibility discount, crowding-out, and reversibility as core adjustments to ITN.
  2. **Consider context** for feedback speed and talent-vs-capital bottleneck (maybe optional or weighted lower).
  3. **Create two scoring variants**: one for grants (dollars) and one for staff allocation (time), with the most significant changes in:
     - **Talent-vs-capital bottleneck**: Flips direction (prioritize talent bottlenecks for staff, money bottlenecks for dollars).
     - **Crowding-out**: Drops in relevance for staff (or becomes a positive factor).
     - **Feedback speed**: More heavily weighted (negatively) for staff allocation.
answer: |-
  ### Ratings & Rankings of Correction Terms  
  Each term is rated 0–10 based on **how much it should adjust a naive ITN score** (10 = critical adjustment, 0 = negligible/noise).  

  1. **Legibility discount** (Rating: **9/10**)  
     *Why*: Overcomes a core flaw in ITN—problems with hard-to-measure impact (e.g., mental health) are systematically undervalued. Correcting this bias is essential for accurate "importance" scores.  

  2. **Crowding-out** (Rating: **8/10**)  
     *Why*: Directly determines real-world impact. If a grant displaces other funding (e.g., in a crowded field), net impact approaches zero—undermining ITN’s core purpose.  

  3. **Reversibility** (Rating: **7/10**)  
     *Why*: Irreversible harms (e.g., extinction, war escalation) demand higher caution. This adjusts for asymmetric risk, protecting against catastrophic failures.  

  4. **Feedback speed** (Rating: **5/10**)  
     *Why*: Slow feedback (e.g., climate policy) delays learning and adaptation, increasing risk. But ITN already partially accounts for this via "tractability." Moderate additive value.  

  5. **Talent-vs-capital bottleneck** (Rating: **3/10**)  
     *Why*: Overcomplicates "neglectedness." If talent is the bottleneck (e.g., AI safety), more funding may still help (e.g., training programs). Weak signal; risks cause-smuggling.  

  ---  
  ### Ranked List (Highest to Lowest Impact)  
  1. **Legibility discount** (9) → Corrects systemic bias.  
  2. **Crowding-out** (8) → Prevents net-zero impact.  
  3. **Reversibility** (7) → Mitigates tail risks.  
  4. **Feedback speed** (5) → Modest risk adjustment.  
  5. **Talent-vs-capital bottleneck** (3) → Redundant/overfit.  

  ---  
  ### Should Scores Differ for **Dollars vs. Staff Hire**?  
  **Yes—the scoring sheet should differ**, as staff time and money have distinct properties:  
  - **Grants (dollars)**: Focus on funding gaps, displacement risks, and capital constraints.  
  - **Staff hire (attention)**: Focus on leverage, talent gaps, and adaptability.  

  #### Which Terms Change Most?  
  1. **Talent-vs-capital bottleneck** (FLIPS DIRECTION):  
     - For **grants**: Only "capital bottlenecks" matter (score ↑ if money is the missing input).  
     - For **staff hire**: "Talent bottlenecks" dominate (score ↑ if the field lacks skilled people).  
     *Why*: Allocating a person directly solves talent gaps but may not address funding gaps.  

  2. **Crowding-out** (DECREASES for staff hire):  
     - Less relevant for staff time. A staffer’s work (e.g., strategy, networking) often *complements* rather than displaces others.  

  3. **Feedback speed** (INCREASES for staff hire):  
     - Staff time should prioritize faster-feedback work (e.g., pilot programs) to enable rapid iteration. Slow-feedback projects are better suited for grants.  

  #### Key Adjustments Summary  
  | Term                  | Dollars (Grants)         | Staff Hire (Attention)   |  
  |-----------------------|--------------------------|--------------------------|  
  | Talent-bottleneck     | ↓ Low relevance          | ↑↑ Critical (flips)      |  
  | Crowding-out          | ↑↑ Critical              | ↓ Low relevance          |  
  | Feedback speed        | → Moderate               | ↑ Higher weight          |  
  | Reversibility         | → Unchanged              | → Unchanged              |  
  | Legibility discount   | → Unchanged              | → Unchanged              |  

  ### Recommendation  
  - **Add 3 terms**: Legibility discount, crowding-out, and reversibility. They add strong signal with low risk of bias.  
  - **Drop or deprioritize**: Talent-bottleneck (noisy) and feedback speed (redundant with tractability).  
  - **Build two scoring variants**: One for grants (emphasize crowding-out, capital bottlenecks), one for staff hires (emphasize talent bottlenecks, feedback speed). Use this to decide whether to hire staff or fund grants next year.
