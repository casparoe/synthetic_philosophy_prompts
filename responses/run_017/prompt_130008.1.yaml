prompt: |-
  Next week I'm taking over one 75-minute session of a friend's philosophy of biology seminar — about a dozen second-years, whiteboard only, no slides, and they haven't read anything for it (I'd rather not put author names on the board and attach them at the end, so the plan has to work with names withheld). Roughly half are bio majors who've had natural selection but seem to think of it as survival of the fittest in a vaguely optimizing way; the other half are philosophy majors who hear "function" as "purpose" and have done a bit on intentionality. I want them to leave holding the three-way contrast between the selected-effect story, the causal-role story (what the item contributes to some containing system's capacity), and the forward-looking story (what it would do for fitness down the line). That's my working gloss — tell me if the gloss itself is what's going to mislead them.

  Don't explain the debate to me; plan how I teach it. Concretely, I need the dependency structure: what has to be in place before each piece can even be stated, and why. I was going to open with a stenosed heart valve, on the grounds that "this heart isn't doing what it's supposed to do" is the datum every account has to earn — but does opening there quietly tilt the room toward the selected-effect view before the other two are even on the table? Then: which single case should carry the hour? My candidate is a plastic-chewing enzyme produced by directed evolution in a lab and then sprayed on a landfill — it has a real selection history, but no organism, no fitness, no ancestors, and its unclear what the containing system is supposed to be. Does that discriminate the three accounts cleanly, or does it drag in artifacts and experimenters' intentions way too early? Either way, tell me what the carrying case has to have and what it has to lack.

  Misconceptions I'm braced for: that "selected for" just means "useful right now"; that the selected-effect view smuggles in a designer; that the causal-role view makes any old effect a function (heart sounds, the thump a valve makes); that vestigial organs refute the selected-effect view; and the big one, that the whole dispute is merely verbal and you can mean whatever you like by "function". Which of these will actually form first and which am I inventing, where in the sequence should I head each off, and is the "its just verbal" one something to defuse or to partly concede at minute 60? The bio majors will also ask, obv, what any of this has to do with that junk-DNA fight about how much of the genome is really functional — where does that fit? And I want one question for the last five minutes that they can't answer with "it depends what you mean by function". Finally, what should I openly refuse to explain at this level — units of selection, the disease-as-dysfunction literature, the link to mental content — and say out loud that I'm refusing?
reasoning: |-
  Okay, let me tackle this philosophy of biology lesson plan. The user needs a concrete 75-minute session structure focusing on three function concepts without prior readings. 

  First, the heart valve example works as an opener because "malfunction" is universally intuitive. But you're right - it might bias toward selected-effect view. The solution is to immediately pivot to a neutral case before defining any theories. 

  The plastic-chewing enzyme case is brilliant because it lacks: organism, fitness, ancestors, clear system. Perfect for discrimination. But we must preempt artifact/intention concerns by stating "assume no human purpose" upfront.

  Key misconceptions to sequence:
  1. "Useful now = function" will emerge immediately with causal-role intro. Counter with vestigial appendix.
  2. "Selected-effect implies designer" - stomp out during panda's thumb example.
  3. "Any effect is function" - use heartbeat sounds during causal-role refinement.
  4. "Vestigial refutes selected-effect" - explicitly reconcile during appendix discussion.
  5. "Merely verbal" - save for final contrast using enzyme case.

  Junk-DNA question is inevitable. Park it under "why definitions matter" using causal-role's systemic view vs selected-effect's historical view.

  For the closing question: "Could CRISPR-designed organs have functions if implanted?" Forces engagement with all three frameworks.

  Strictly off-limits: units of selection (too much), disease/dysfunction (medical tangent), mental content (rabbit hole). State these exclusions when bio majors inevitably ask.

  The real challenge is timing: 12 minutes per theory leaves only 15 minutes for application and Q&A. Must ruthlessly cut digressions.
answer: |-
  Here's a battle-tested lesson plan structured to build the three-way contrast while preempting misconceptions. Dependency is sequential—each step requires the previous concepts.

  **Core Structure & Timing**  
  (75 min = 5 min intro + 3x12 min theory blocks + 15 min case application + 10 min synthesis + 5 min Q&A)

  ---

  ### **OPENING (5 min): The Datum - Malfunction**  
  *Whiteboard:* Sketch a **stenosed heart valve** with arrows showing blocked blood flow.  
  - *Question:* "Why do we say this valve *isn't doing its job*? What makes this 'malfunction' not just 'difference'?"  
  - *Key Move:* Acknowledge intuition ("supposed to") but **NEUTRALIZE DESIGNER BIAS** immediately: "This *feels* purposive—but we're doing biology. No designers allowed. What *biological* facts ground this judgment?"  
  - *Dependency:* Establishes the explanandum (function attributions) without committing to any account.  

  ---

  ### **BLOCK 1: Causal-Role Function (CRF) (12 min)**  
  *Case:* **Human heart** (reuse valve sketch).  
  - *Define:* "Function as causal contribution to a *specific capacity of a containing system*."  
    - System: Circulatory system.  
    - Capacity: Oxygen transport.  
    - Function of valve? Regulate unidirectional flow.  
  - *Misconception Preemption:*  
    - "But what about heartbeat *sounds*? Are they functions?" → **CRITICAL DISTINCTION:** "Functions are *specific contributions* to the system's capacity. Sounds don't contribute to oxygen transport—so no."  
    - *Whiteboard:* Table of "Effects vs. Functions" (e.g., "Valve thud: Effect? Yes. Function? No").  
  - *Weakness Exposed:* "What if the system changes? If we're in zero gravity, is the heart 'malfunctioning'?" → Plants seed for historical/forward views.  

  ---

  ### **BLOCK 2: Selected-Effect Function (SEF) (12 min)**  
  *Case:* **Panda's thumb** (sketch radial sesamoid bone gripping bamboo).  
  - *Define:* "Function as *what the trait was selected for in evolutionary history*."  
    - History: Modified wrist bone selected for bamboo stripping.  
    - Function: Bamboo manipulation (even if inefficient).  
  - *Misconception Preemption:*  
    - "Isn't this 'survival of the fittest'?" → **EMPHASIZE HISTORY:** "Fitness *then*, not now. If environments change, traits can become vestigial—*but their SEF remains*."  
    - "Vestigial organs refute SEF?" → Use **whale pelvis**: "Its SEF is hind-limb support in ancestors. Now vestigial, but that *historical function* explains why it exists."  
    - "Smuggles in a designer?" → **Contrast:** "Design implies intent. Natural selection is *unintended statistical outcome* of variation/heritability/fitness differences."  

  ---

  ### **BLOCK 3: Forward-Looking Function (FLF) (12 min)**  
  *Case:* **Dormant bacterial spore** (sketch spore in harsh environment).  
  - *Define:* "Function as *current trait capacity that would enhance fitness if conditions changed*."  
    - Trait: Spore's thick coat.  
    - Future: If environment becomes survivable, the coat enables reproduction.  
  - *Misconception Preemption:*  
    - "Isn't this just 'useful now'?" → **STRICT FUTURE FOCUS:** "CRF is current contribution; FLF is *dispositional*—what it *could* do for future fitness, even if unused now."  
    - *Example:* Human appendix—CRF? Minimal. SEF? Digestion in ancestors. FLF? Immune role *if* gut flora decimated.  

  ---

  ### **CARRYING CASE: Plastic-Eating Enzyme (15 min)**  
  *Setup:* "Lab-evolved enzyme sprayed on landfill. Has selection history? Yes (directed evolution). Organism? No. Fitness? N/A. Containing system? Unclear."  
  - *Whiteboard Table:* Rows = CRF/SEF/FLF. Columns = "Applies?" (Y/N) + "Why?"  
    - **CRF:** "Yes—if we define the system (e.g., landfill decomposition), it *causally contributes* to plastic breakdown."  
    - **SEF:** **No**—"Directed evolution *simulates* natural selection, but no ancestral lineage. SEF requires *natural* history."  
    - **FLF:** **No**—"No organism → no fitness → no future fitness contribution."  
  - *Why it works:*  
    - Isolates SEF’s dependency on *natural* history.  
    - Forces precise "system" specification for CRF.  
    - Highlights FLF’s requirement of an organism.  
  - *Preempt artifact bias:* "Assume the scientist had no purpose—the enzyme exists. Does that change its function? (No—SEF still fails; CRF/FLF unchanged)."  

  ---

  ### **SYNTHESIS (10 min)**  
  1. **Contrast Matrix:** Whiteboard the 3 views with:  
     - *What fixes function?* (CRF: Current system role; SEF: Past selection; FLF: Future fitness)  
     - *Works for artifacts?* (CRF: Yes; SEF: No; FLF: No)  
  2. **"Junk DNA" Plug:** "Why do biologists fight about this? SEF says ‘no selection history, no function.’ CRF says ‘if it regulates gene expression *now*, it has function.’ This isn’t verbal—it changes research questions!"  
  3. **"Just Verbal" Defusal:** "Yes, you can *stipulate* definitions—but in science, definitions carve nature. SEF explains *why traits exist*; CRF explains *how systems work now*. Different questions → different tools."  

  ---

  ### **CLOSING QUESTION (5 min)**  
  *"Can a trait have a function if it never contributed to fitness and harms the organism now? Defend your answer using one view."*  
  - *Why it works:* Forces commitment (e.g., CRF: "Yes, if it contributes to a system capacity now, even if harmful overall"; SEF: "No—past fitness contribution is essential"). Blocks "it depends" evasion.  

  ---

  ### **WHAT TO REFUSE (SAY ALOUD)**  
  - **Units of selection:** "Crucial, but we’re focusing on function *within* systems today."  
  - **Disease/dysfunction:** "A medical application we can’t dive into now—read Boorse vs. Wakefield if curious!"  
  - **Mental content:** "Linking function to intentionality is a deep debate—today we’re only in biology."  

  ---

  ### **WHY THIS WORKS**  
  - **Dependency:** Malfunction (datum) → CRF (simplest, system-focused) → SEF (history-focused) → FLF (future-focused) → Case (exposes boundaries).  
  - **Bio Majors Hooked:** Junk DNA + enzyme case show real-world stakes.  
  - **Philosophy Majors Satisfied:** "Just verbal" addressed via explanatory power.  
  - **No Sneaky Bias:** Heart valve opener is neutralized by immediately problematizing "purpose."  

  *Time it ruthlessly. When bio majors ask "But what about...?", park it in "Off-Limits" or "Read Millikan!"*
