prompt: |-
  I have no formal training in philosophy — I read translations of Indian philosophical texts in the evenings, mostly Nyāya material about what counts as a source of knowledge — and I have been keeping a list of ordinary cases with my own gut verdicts, hoping a principle will fall out of them. The list is below.

  As I understand the framework: a cognition is genuine knowledge (pramā) only if it is produced by one of a short list of pramāṇas — perception, inference, comparison, and testimony — and the interesting questions are which source was at work in a given case, and whether a candidate source is really a separate one or just a special case of another.

  My cases:

  1. Dusk, a coil on the path ahead. I take it for a rope, and it is a rope. In that light I would equally have taken a snake for a rope. Verdict: I know it is a rope. The fragility does not bother me.

  2. Grey stuff drifting over a ridge; I take it for smoke, infer fire, go to raise the alarm. There is a fire beyond the ridge, but the grey was mist from a stream and the fire is a camp stove in a hollow I could not have seen or smelled. Verdict: I did not know there was a fire, though I was right and though anyone would have reasoned as I did.

  3. My mechanic of nine years tells me the alternator is dead. It is. Verdict: knowledge. A stranger on the bus who happens to be right says the same thing and I believe him. Verdict: not knowledge, or not the same thing. What bothers me: if the difference is his track record, my knowledge looks like an inference from past cases, and testimony stops being its own source. If it is just that he is reliable whether or not I know he is, then the stranger may be reliable too, and I have to say I knew.

  4. A friend tells me a gavaya is a beast shaped roughly like a cow. Weeks later at a sanctuary I see one and think, so that is a gavaya. Verdict: knowledge, and neither inference nor testimony — my friend never mentioned this animal, and I am not reasoning from a mark. It feels like its own source.

  5. I read a field-guide description of a wombat — thick-set burrower, short legs, waddling gait — see one at a zoo and think, that is a wombat. Verdict: this is not the same kind of thing as 4; it feels closer to recognition, or to memory of what I read. But I cannot say what the difference is, and 4 and 5 look structurally identical to me.

  6. I remember where I parked and I am right. Verdict: not pramā, since nothing new was produced, only a copy of what I already knew. But I also remember that seven eights are fifty-six and use it to check a supplier's invoice, and there the memory seems to be doing real work.

  7. I glance at the coil, feel fear, look again, and now think: that is a rope, not a snake. Verdict: knowledge. But of what sort? The rope part looks perceptual; the not-a-snake part is not something my eyes delivered, and it is not inference either.

  The principle I have been toying with: a cognition is pramā when it is true, is not a copy of something I already knew, and was produced by a source whose normal procedure actually succeeded here rather than failing and getting lucky; and a source is a distinct pramāṇa only if it can deliver something the others could not. Test that against the list and repair it. Cases 1 and 2 are where it strains: the procedure in 2 looks like the same procedure that works in ordinary smoke-and-fire cases, so I am not sure failed versus succeeded is doing any work.

  Please give me: the principle in one sentence, then each clause with the case that motivates it; your verdicts on two cases of your own construction that I have not listed; an honest statement of which of my verdicts your principle cannot accommodate and which one you would overturn if you had to drop one; and a note on where your reasoning is most likely to fail and what would change your mind. A friend who did take a philosophy degree says 1 and 2 are the Gettier problem in different clothes — if that is right, say so and say whether it matters here. Lead with the one-sentence principle before any discussion, and keep the whole reply under 700 words.
reasoning: |-
  Okay, the user is deeply engaged with Indian epistemology, specifically Nyāya philosophy, and is grappling with how to classify different types of cognition as valid knowledge (pramā). They've compiled a list of everyday scenarios with their intuitive judgments, seeking a unifying principle that distinguishes genuine knowledge from lucky guesses or unreliable sources. 

  Hmm, their cases reveal sophisticated nuances—like how testimony from trusted vs. untrusted sources differs (case 3), or why recognizing a described animal feels distinct from textbook identification (cases 4-5). Their struggle with memory's role (case 6) and negation (case 7) shows they're probing boundaries between pramāṇas. 

  Ah, their proposed principle—truth + non-redundancy + reliable-source-success—is clever but stumbles on Gettier-like luck (cases 1-2). Their friend's comparison to Gettier is astute; Nyāya's "normal procedure" requirement parallels contemporary "anti-luck" conditions. Yet Indian epistemology handles this differently—through *vyabhicāra* (deviance) analysis. 

  Right, I must craft a principle strict enough to exclude luck but flexible for testimony/memory. Key adjustments: (1) Specify *actual* causal efficacy over "normal procedure" to handle case 2's coincidental inference. (2) Let testimony remain distinct by allowing *unconscious* reliability tracking (resolving case 3 without reducing it to inference). 

  *Testing cases:*  
  - Case 1: Valid perception—no luck involved; senses functioned properly despite fragility.  
  - Case 2: Failed inference—smoke wasn't *why* I inferred fire; mist caused the belief.  
  - Case 3: Mechanic’s testimony succeeds via actual reliability; stranger fails even if accidentally right.  
  - Case 4-5: Both valid, but case 4 is pure comparison (*upamāna*); case 5 is testimony-perception blend (no need to force separation).  
  - Case 6: Memory isn't *pramā* unless reactivating latent knowledge for new application (invoice check).  
  - Case 7: Perceptual negation—valid as perception-based exclusion (*pratyakṣa-viṣayatā*).  

  *User's deeper needs:* They want coherence across Western/Indian frameworks without oversimplifying. Their "gut verdicts" suggest intuition aligns with Nyāya’s realism—so I’ll avoid imposing Western internalism. Also, they’re self-taught; clarity trumps jargon.  

  *New test cases:*  
  - **Reliable hallucination:** Seeing water (correctly) due to chronic mirage hallucinations. Verdict: Not *pramā*—source is defective despite luck.  
  - **Blind inference:** Correctly guessing a hidden number via invalid reasoning. Verdict: Not *pramā*—process failed.  

  *Admitted flaw:* Case 5 feels like testimony-memory to user, but I classify it as testimony-perception. If forced, I’d overturn case 1 to *not knowledge*—but that violates Nyāya’s *nirvyabhicāratva* (non-deviance). Better to expand "source" to include contextual reliability.  

  *Vulnerability:* Over-reliance on causal history may conflate epistemology with metaphysics. If causation proves irrelevant to justification (e.g., in some Buddhist views), I’d rethink.
answer: |-
  ### Principle:  
  A cognition is *pramā* iff it is true, non-redundant (not merely reproducing existing knowledge), and produced by a *pramāṇa* whose specific causal process *actually* connected the knower to the fact, excluding luck or deviant chains.  

  ### Clause Motivations:  
  1. **Truth**: Cases 1 vs. 2: Case 1 is true and non-lucky (rope perceived accurately); case 2 is true but accidental (no causal link between smoke and fire).  
  2. **Non-redundancy**: Case 6: Remembering parking isn’t *pramā* (reproducing prior knowledge), but using "7×8=56" for invoices *is* (applying stored knowledge to a new task).  
  3. **Causal efficacy**: Case 3: Mechanic’s testimony causally links to fact via reliability; the stranger lacks this link, even if accidentally right.  

  ### Your Cases Under Principle:  
  - **Case 1**: *Pramā*. Perception succeeded; no luck (light permitted accurate discrimination).  
  - **Case 2**: Not *pramā*. Inference failed—smoke wasn’t the *actual* reason for fire (deviant causal chain).  
  - **Case 3**: Mechanic = *pramā* (testimony via reliability); stranger = not (no causal link to truth).  
  - **Case 4**: *Pramā* via comparison (*upamāna*—linking description to perceived animal).  
  - **Case 5**: *Pramā* via testimony-perception blend (field guide primes recognition; no need for distinct source).  
  - **Case 7**: *Pramā* via perceptual exclusion ("not-snake" inferred from corrected perception).  

  ### Test Cases & Verdicts:  
  1. **"Lucky Memory"**: You forget a math proof but correctly guess the steps. Verdict: Not *pramā*—no causal link to prior learning.  
  2. **"Expert Novice"**: A first-time accurate mechanic (no track record) fixes your car. Verdict: *Pramā*—testimony’s causal efficacy doesn’t require *known* reliability if competence exists.  

  ### Incompatibility & Overturn:  
  - **Incompatible**: Case 6 (parking memory). Principle denies *pramā* status; you might intuit it as knowledge.  
  - **Overturn if forced**: Case 2—call it *pramā* by relaxing "causal efficacy" to "normal procedure," but this invites Gettier problems.  

  ### Critical Note:  
  - **Weakness**: Overemphasizes causal history, risking conflation with metaphysics. If causal links prove unverifiable (e.g., in testimony), the principle fails pragmatically.  
  - **Gettier Connection**: Yes, cases 1–2 mirror Gettier: justified true belief undone by luck. Nyāya avoids this via *vyabhicāra* (deviance) analysis—hence "causal efficacy" matters here.  

