prompt: |-
  I am writing a novel, and before I commit to the mechanics of the machine at its centre I want a specification rather than a survey. What I need from you is the desiderata: a list of what any account of backwards time travel in fiction would have to deliver to be good enough to underwrite four hundred pages — the cases it must resolve, the distinctions it must respect, the constraints it may not violate — with the scene or consideration behind each requirement, and a judgement about which requirements are non-negotiable and which are merely the prejudices of one camp or another. The purpose is fixed: I need rules a reader can infer from scenes rather than be told in an exposition chapter, rules that yield a determinate verdict at the end of any given scene about whether the intervention worked, and rules under which a character can be wrong about the mechanics and be surprised. Bear that purpose in mind when you decide what counts as a requirement.

  Below are the scenes I already know I want to write. For each, tell me what requirement it generates, and add the requirements I have not anticipated.

  My protagonist travels back to prevent a fire in which her brother died. She succeeds in the sense that the brother lives, yet the act by which she prevents it — cutting a wire, breaking a window, delaying a driver — is the act that starts it. Did the past change?

  She remembers the fire. Once she has intervened, does she still? If the timeline is overwritten rather than branched, whose memories does she carry, and is there any way for her to know that her intervention failed?

  The machine has a bounded range: certain years simply are not there to be reached. Is the boundary a fact about the machine, about the geometry of time, or about what is logically available? I need to know what fixes the reachable set, because I want the limit to feel like a discovery and not a manufacturer's specification.

  An object with no origin: a score my protagonist carries back to a composer who will later publish it, and which she copied from that publication. Is this the same problem as the grandfather case or a different one in kind, and must a theory handle them by the same device?

  The crowded room: she meets her younger self and they disagree about what to do. Which of them bears responsibility for what follows, and what should happen when the younger one later makes the trip herself?

  The slow news: if the past is altered, does the alteration reach her departure date at once, or only as she travels forward along her own worldline? Can the present she left be edited while she is still in the past, and can she be erased retroactively while still acting?

  The abandoned: on a branching account, what becomes of the people in the branch she leaves behind? I need to know whether her act is a killing, an abandonment, or nothing at all, since the moral weight of the book rests on the answer.

  Deliberation: on a fixed-timeline account, is trying still coherent? Can she deliberate about an outcome that is settled either way, and what in the prose should convey that her effort is real rather than illusory?

  Two further constraints, which I take to be external rather than optional. First, the theory must say what "going back to 1889" means given that the physics we actually have denies a global present; the date cannot be a bare fact about the universe. Second, it must give some account of the asymmetry between the directions — why travelling forward is trivially available while travelling back is the thing that needs a machine — or else explain why the asymmetry is only apparent.

  Once the list is assembled, tell me which pairs of desiderata you suspect cannot be jointly satisfied, and say plainly if the list itself turns out to be the real result here; that is the part I most want to see. Then tell me which single requirement does the most work in excluding candidates — which one, if I insisted on it, would collapse my options fastest. Close with a brief scorecard, no more than a few lines each, for the three familiar families: the fixed or self-consistent timeline, the branching timeline, and the overwritten or erased timeline. Keep the weight on the criteria and their motivating cases; I can extend the scoring myself.
reasoning: |-
  Okay, the user is writing a novel centered around a time travel machine and needs a solid set of rules to underpin the narrative without infodumps. They want desiderata—essential requirements derived from specific scenes they've planned, plus any unanticipated ones. The key is that rules must be inferable from scenes, yield clear outcomes, and allow for character mistakes and surprises.

  First, let's unpack their scenes and extract requirements. The fire prevention paradox (saving the brother causes the fire) needs causal consistency—no free changes. The memory question (does she remember the fire after changing it?) demands subjective continuity for drama. The machine's bounded range requires a non-arbitrary limit tied to physics or logic, avoiding "manufacturer specs." The bootstrap paradox (musical score) needs a coherent origin story—is it a stable loop or a contradiction? The crowded room (two selves) requires identity resolution and responsibility assignment. Slow news (alteration propagation) needs clarity on how changes ripple—instantly or along the traveler's path? The abandoned branch (on branching theories) requires ethical weight—is leaving a branch murder or nothing? Deliberation tension needs agency preservation even in fixed timelines. 

  Then there are external constraints: defining "1889" without absolute time (relativity-compatible) and explaining time asymmetry (why back is hard). 

  Unanticipated requirements: travelers must be able to fail due to ignorance (surprise factor), rules must permit partial success (nuance), and interactions with the past shouldn’t cause ontological meltdowns (no "glitches"). 

  Conflicts emerge: subjective continuity clashes with overwritten timelines (how does she remember a "deleted" fire?). Causal consistency fights bootstrap resolutions—either loops are neat (fixed) or impossible (overwrite). Branch abandonment's moral weight contradicts overwrite's "clean" change. The asymmetry explanation might force a physics-heavy account, risking exposition. 

  The most exclusionary requirement? Subjective continuity combined with inferable rules. Overwrite theories struggle (memories require branching or fixed), and heavy physics might violate "show don’t tell." 

  Finally, scoring the three theories: 
  - Fixed timeline (e.g., *Primer*): Aces consistency, causality, no paradoxes. But makes effort feel futile unless the prose sells predestination tension. 
  - Branching (e.g., *Steins;Gate*): Solves abandonment ethics (heavy!) and allows changes, but dodges bootstrap paradoxes and may feel consequence-free. 
  - Overwrite (e.g., *Back to the Future*): Intuitive changes and high stakes, but butchers memory continuity and causal loops. 

  The user’s unspoken need? Covert worldbuilding. They want rules that feel discovered, not dictated, so the novel’s soul hangs on paradoxes with emotional weight (brother’s fire) and moral dilemmas (abandoning branches). Physics must serve story, not vice versa. I’m flagging the memory/overwrite clash as critical—they’ll likely pick branching or fixed based on whether the brother’s survival haunts the protagonist literally (memory) or philosophically (new branch).
answer: |-
  Here is your desiderata list, derived from your scenes and core purpose, organized by requirement type. Each includes the motivating scene, necessity judgment, and unanticipated additions. The analysis of conflicts and high-impact requirements follows.

  ---

  ### **I. Core Mechanics Requirements (Non-Negotiable)**
  1. **Causal Consistency**  
     - **Scene:** Protagonist's action to prevent the fire *causes* it.  
     - **Requirement:** Actions in the past must not create logical contradictions (e.g., an effect without a cause).  
     - **Necessity:** Absolute. Without this, the rules collapse into incoherence.  
     - **Unanticipated:** Physical interactions must conserve mass/energy (e.g., you can't duplicate matter).

  2. **Determinate Outcomes**  
     - **Scene:** Any intervention (cutting a wire, meeting oneself) must have a clear "success/failure" state.  
     - **Requirement:** Rules must yield unambiguous results for every action, observable through cause/effect.  
     - **Necessity:** Non-negotiable for plot tension and reader inference.  

  3. **Subjective Continuity**  
     - **Scene:** Protagonist remembers the fire *after* preventing it.  
     - **Requirement:** The traveler retains memories/identity from their original timeline.  
     - **Necessity:** Critical for character-driven stakes. Without it, moral weight vanishes.  

  4. **Change Propagation Rules**  
     - **Scene:** "Slow News" – How/when alterations reach the future.  
     - **Requirement:** Define if changes are instantaneous, propagate at light speed, or sync only upon the traveler's return.  
     - **Necessity:** Non-negotiable to avoid deus-ex-machina paradoxes.  

  5. **Agency Preservation**  
     - **Scene:** Deliberation in a fixed timeline.  
     - **Requirement:** Decisions must feel consequential *to the character*, even if externally predetermined.  
     - **Necessity:** Essential for reader engagement. The prose must sell effort as real (e.g., via uncertainty).  

  ---

  ### **II. Paradox Resolution Requirements (Contextual)**
  6. **Bootstrap Handling**  
     - **Scene:** The composer's score with no origin.  
     - **Requirement:** Objects/events must have *consistent origins*, even if looped (stable causality) or forbidden (no loops).  
     - **Distinction:** Different from grandfather paradox (which kills ancestors). Bootstrap is ontological; grandfather is causal.  
     - **Necessity:** High, but solvable via fixed timelines (loops) or overwrite (erasure).  

  7. **Identity Resolution**  
     - **Scene:** Crowded room (two selves present).  
     - **Requirement:** Clarify if younger/older selves share consciousness, and who controls actions.  
     - **Necessity:** Moderate. Affects responsibility (e.g., is the younger self "destined" to become the older one?).  

  8. **Branch Ethics**  
     - **Scene:** The abandoned timeline.  
     - **Requirement:** If timelines branch, define the ontological/moral status of the "discarded" branch.  
     - **Necessity:** Critical for thematic weight. Shapes whether time travel is murder, escape, or creation.  

  ---

  ### **III. Foundational Constraints (Non-Negotiable)**
  9. **Relativistic Date Anchoring**  
     - **Scene:** Machine's bounded range (e.g., "1889").  
     - **Requirement:** "Dates" must be defined relative to a physical marker (e.g., the machine's location, cosmic events), not universal time.  
     - **Necessity:** Absolute. Modern physics demands it.  

  10. **Asymmetry Justification**  
      - **Scene:** Why travel back requires a machine, but forward is trivial.  
      - **Requirement:** Explain via entropy, quantum mechanics, or machine limitations (e.g., "exotic matter only enables pastward jumps").  
      - **Necessity:** High. Without this, the machine feels arbitrary.  

  ---

  ### **Unanticipated Requirements**
  11. **Failure Condition**  
      - **Scene:** Protagonist can be *wrong* about mechanics (e.g., misjudges range/effects).  
      - **Requirement:** Rules must allow for partial success or unintended consequences.  
      - **Motivation:** Surprise hinges on viable character error.  

  12. **Information Conservation**  
      - **Scene:** None specified, but implied by bootstrap paradox.  
      - **Requirement:** Data (e.g., memories, the score) must have a consistent source.  
      - **Motivation:** Prevents "something from nothing" breaks.  

  ---

  ### **Conflicts & Tradeoffs**
  - **Subjective Continuity vs. Overwritten Timelines:**  
    If the past is overwritten, *how* does the traveler remember the "erased" timeline? Fixed/Branching avoid this; Overwrite requires handwaves (e.g., "machine shields consciousness").  
    **→ Conflict Rating:** Severe.  

  - **Causal Consistency vs. Bootstrap Objects:**  
    Bootstrap objects (e.g., the score) defy linear causality. Fixed timelines allow them; Branching/Overwrite forbid or erase them.  
    **→ Conflict Rating:** Moderate.  

  - **Branch Ethics vs. Determinism:**  
    If branching creates "real" people, abandonment is genocide. If branches are unreal, stakes diminish. Fixed timelines dodge this but limit agency.  
    **→ Conflict Rating:** Thematic.  

  ---

  ### **Highest-Impact Requirement**  
  **Subjective Continuity** collapses options fastest:  
  - **Overwrite Theories:** Struggle with memories of "erased" events.  
  - **Branching Theories:** Require the traveler's consciousness to "jump" branches.  
  - **Fixed Theories:** Naturally support it (memories are part of the loop).  
  *If you insist on this + no exposition, Overwrite is nearly impossible to justify inferentially.*

  ---

  ### **Theory Scorecard**  
  1. **Fixed/Self-Consistent Timeline** (e.g., *Primer*, *Time Traveler's Wife*)  
     - **Strengths:** Nails causal consistency, bootstrap loops, and subjective continuity. Deliberation tension is innate.  
     - **Weaknesses:** Makes "change" illusory (brother was *always* saved by the fire-starting act). Ethics of abandonment irrelevant (no branches).  
     - **Asymmetry:** Must be machine-limited (e.g., "only consistent paths are stable").  

  2. **Branching Timeline** (e.g., *Steins;Gate*, *Avengers: Endgame*)  
     - **Strengths:** Allows genuine change (brother lives without paradox). Cleanly handles memory continuity (traveler remembers origin branch).  
     - **Weaknesses:** Bootstrap paradoxes forbidden (score can't exist). Branch abandonment may imply genocide.  
     - **Asymmetry:** Easily framed as machine "creating" branches.  

  3. **Overwritten Timeline** (e.g., *Back to the Future*, *Butterfly Effect*)  
     - **Strengths:** High stakes (brother's survival erases the fire). Clean ethical slate (no abandoned branches).  
     - **Weaknesses:** Subjective continuity breaks unless contrived. Bootstrap objects impossible. "Slow news" rules become critical.  
     - **Asymmetry:** Natural fit ("editing" past requires exotic energy).  

  ---

  ### **Final Recommendation**  
  **Prioritize Fixed or Branching.** Overwrite creates too many conflicts with your requirements (memory continuity, determinacy). The brother/fire scene *demands* causal consistency—Fixed handles this elegantly; Branching requires careful rules to avoid paradoxes. Use the machine's bounded range to enforce asymmetry (e.g., "can only reach points with compatible quantum states"). The score paradox is *different* from grandfather murder; resolve it via stable loops (Fixed) or forbid it (Branching). For moral weight, Fixed makes effort tragic; Branching makes choice devastating. Either can deliver your desiderata—choose based on whether you want inevitability (Fixed) or consequence (Branching).
