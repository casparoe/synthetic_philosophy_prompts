    - Meter 2 (Internal Information Sharing): "How much do different parts of the system exchange information? We measure this by observing how much knowing the state of one part reduces uncertainty about the state of another part. Higher readings mean the parts are more interconnected."
    - Meter 3 (Flexibility in Learning): "How easily can the system's future behavior be changed by rewards and punishments? We measure this by applying a series of rewards and punishments and observing how quickly and substantially the system adapts. Higher readings mean the system is more flexible in response to feedback."

  The six candidate systems:

