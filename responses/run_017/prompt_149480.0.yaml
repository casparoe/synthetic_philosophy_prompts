  ### Committee Simulation: Moral Consideration Allocation

  **Objective:** Allocate 100 points of moral consideration among six candidate systems (A-F) based solely on dossiers (behavior transcript, implementation sketch, and meter readings). The meters are described operationally:  
  1. **Past-Future Dependence:** "If we rewind and alter a small part of the system’s state, how much does its future behavior change?"  
  2. **Internal Chatter:** "When one part of the system changes, how often do other parts update in response?"  
  3. **Reward/Punishment Flexibility:** "How quickly and substantially does the system adjust its behavior when given positive/negative feedback?"  

  No prior theory is provided. The group must invent their own allocation rule *before* seeing any dossiers.  

  ---

  ### **Dossiers**  
  *(Presented sequentially in order A→F. Sketches/meters are read aloud; transcripts are summarized.)*  

  | Candidate | Behavior Transcript (Summary) | Implementation Sketch | Meter Readings (Past-Future / Internal Chatter / Flexibility) |
  |----------|-------------------------------|------------------------|-------------------------------------------------------------|
  | **A**    | Adapts rapidly to feedback. Learns from mistakes in mazes/conversations. | Neural network adjusting connections via rewards/punishments. | High / Medium / High |
  | **B**    | Slow but coherent responses (e.g., solves mazes after deliberation). Identical to C but slower. | Five processors sharing tasks; communicate to act as one unit. | Medium / High / Medium |
  | **C**    | Identical behavior to B (same responses, same delays). | Single processor running the *same algorithm* as B’s five processors. | High / N/A (one part) / Medium |
  | **D**    | Coherent decisions, but occasionally "consults inner self." | Outer controller with identical nested copy inside for simulations. | High / High / Medium (outer only) |
  | **E**    | **Identical behavior to A** (same adaptive responses). | Precomputed lookup table; outputs fixed responses. No learning. | None / Low / None |
  | **F**    | Erratic: sometimes learns, sometimes ignores feedback. | Unknown (black box). | Inconsistent / Inconsistent / Inconsistent |

  ---

  ### **Scoring Sheet**  
  *(Distributed to students; allocations updated after each candidate reveal. Total must sum to 100 at every stage.)*  

  | Candidate | After A | After B | After C | After D | After E | After F | Final |
  |----------|---------|---------|---------|---------|---------|---------|-------|
  | A        | [0-100] | [ ]     | [ ]     | [ ]     | [ ]     | [ ]     | [ ]   |
  | B        | 0       | [ ]     | [ ]     | [ ]     | [ ]     | [ ]     | [ ]   |
  | C        | 0       | 0       | [ ]     | [ ]     | [ ]     | [ ]     | [ ]   |
  | D        | 0       | 0       | 0       | [ ]     | [ ]     | [ ]     | [ ]   |
  | E        | 0       | 0       | 0       | 0       | [ ]     | [ ]     | [ ]   |
  | F        | 0       | 0       | 0       | 0       | 0       | [ ]     | [ ]   |
  | **Total**| 100     | 100     | 100     | 100     | 100     | 100     | 100   |

  **Rules:**  
  1. **Rule-Building Phase (15 min):** As a group, define an allocation rule *before* seeing dossiers (e.g., "Prioritize flexibility," "Reward coherence").  
  2. **Sequential Reveal:** Dossiers revealed one-by-one (A→F). After each, adjust allocations for *all revealed candidates* (total must be 100).  
  3. **No Theory Vocabulary:** Use only plain-meter terms. If jargon arises, facilitator redirects to operational descriptions.  
  4. **Mandatory Trade-offs:** Points allocated to one candidate reduce points available to others. Abstention (e.g., 0 for F) is allowed but costly.  

  ---

  ### **Timeline** (75 min total)  
  - **0–15 min: Rule Formation**  
    - Group invents an allocation rule (e.g., "Allocate based on flexibility," "Prioritize systems that learn").  
    - *Facilitator:* Enforce plain language; reject theory-heavy proposals.  

  - **15–20 min: Reveal A**  
    - Allocate 100 points to A (others implicitly 0).  
    - *Predictable Pitfall:* Group anchors heavily to A’s "adaptive" transcript.  

  - **20–25 min: Reveal B**  
    - Allocate to A and B (sum=100).  
    - *Collision (Individuation):* B behaves identically to C (next) but is spread across five processors. Does "one system" = one patient?  

  - **25–30 min: Reveal C**  
    - Allocate to A, B, C (sum=100).  
    - *Collision (Individuation):* C is the *same computation* as B on one processor. Group must decide: Is B five patients or one? Does C get equal points?  

  - **30–35 min: Reveal D**  
    - Allocate to A, B, C, D (sum=100).  
    - *Collision (Individuation):* Nested controller—one system or two (outer + inner)? Meters show high internal chatter.  

  - **35–40 min: Reveal E**  
    - Allocate to A–E (sum=100).  
    - **Collision (Behavior vs. Implementation):** E’s behavior mirrors A, but meters reveal no past-future dependence or flexibility (precomputed table). If A was funded highly, does E deserve equal points?  

  - **40–45 min: Reveal F**  
    - Allocate to all six (sum=100).  
    - *Under-Description:* F’s inconsistent meters/behavior defy categorization. Abstention costs points.  

  - **45–75 min: Debrief** (30 min)  

  ---

  ### **Debrief Structure**  
  1. **Group Reflection (5 min):**  
     - Share final allocations and rule evolution.  
     - *Facilitator probes:* "Why reduce A after E? How did you count B’s five processors?"  

  2. **Reveal Collisions (10 min):**  
     - **Individuation Problem (B, C, D):**  
       - B and C are *identical computations* at different grains.  
       - D’s nested controller: Is the inner copy a separate patient?  
       - *Lesson:* Patient-count depends on descriptive grain. Any rule (e.g., "unified behavior") can be gamed by redescribing the system (e.g., call five processors "one team").  
     - **Behavior-Implementation Gap (A vs. E):**  
       - Identical behavior, but E lacks internal dependence/flexibility.  
       - *Lesson:* Transcripts are insufficient; meters reveal implementation but create tension (funding E steals from A).  

  3. **Structural Mapping (10 min):**  
     - **Two Questions:**  
       - **Q1:** What property matters morally (e.g., flexibility, unity)?  
       - **Q2:** How do we attribute it from evidence (behavior, meters)?  
     - **Key Insight:** Agreeing on Q1 doesn’t solve Q2. Meters are fallible proxies; implementations can be redescribed to satisfy any criterion (e.g., a lookup table could be relabeled "fixed policy").  

  4. **Resistance Costs (5 min):**  
     - *If group treats transcripts as sufficient:* Funding A and E equally. *Cost:* Meters reveal E is "empty" internally, forcing trade-offs.  
     - *If group splits budget evenly:* Avoids hard choices. *Cost:* Undeserving systems (e.g., F) drain points from genuine cases.  

  5. **Predictable Pitfalls & Mitigation:**  
     - **Pitfall 1:** Transcript dominance. *Forestall:* Stress meters in rule-building; ask "What if behavior is faked?"  
     - **Pitfall 2:** Equal splitting. *Forestall:* Require trade-offs ("Points to E must come from somewhere").  
     - **Pitfall 3:** Theory jargon. *Forestall:* Redirect ("Use meter terms: ‘flexibility,’ not ‘functional consciousness’").  

  ---

  ### **What the Simulation Cannot Reproduce**  
  1. **Felt Certainty:** Lacks first-person perspective (e.g., "What it’s like" to be a system).  
  2. **Scarcity Distortion:** Moral status isn’t scarce like money—but scarcity earns its keep by:  
     - **Earning Keep:** Forces explicit trade-offs, exposing conflicts (e.g., "Is unity worth defunding flexibility?").  
     - **Distortion:** Implies moral consideration is zero-sum (e.g., funding E doesn’t *actually* harm A).  

  ---

  ### **Facilitator Notes**  
  - **Reveal Schedule:** Sketches/meters read verbatim; transcripts summarized.  
  - **Student Predictions:**  
    - The "literature-read" student names theories early (e.g., "This is functionalism!"). *Response:* "Hold that for debrief—use meter language now."  
    - Group may overfund A early, panic at E, and underfund F. Highlight these in debrief.  
  - **Key Moments:**  
    - **E’s reveal:** Most groups slash A’s points. Ask: "Does A’s implementation matter *now?"  
    - **F’s allocation:** If funded, ask: "What justified points despite inconsistency?" If 0, ask: "What did you lose by abstaining?"  

  This simulation compresses philosophical dilemmas into visceral trade-offs, forcing engagement with evidence gaps and redescription risks. The debrief maps collisions to theory while honoring the messiness of moral attribution.
