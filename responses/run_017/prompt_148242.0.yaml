  The envoy will gather all terms without privileging any. Rotating the end-words will create conceptual restlessness, embodying the core thesis. I'll make "self-creation" the variety that seems desirable but may be incoherent - we want to author ourselves, but this requires a prior self that already exists.

  The tone should be clear yet lyrical, moving between concrete examples (blame, friendship) and abstract concerns. Philosophical precision must balance with poetic accessibility - no jargon without context. Each stanza will show one variety in action while the rotation undermines its primacy.
answer: |-
  ## Sestina for the Varieties Worth Wanting

  We built the scaffold high for praise and blame,
  demanding room to turn, demanding **leeway**.
  But blame still trembles: was the spark our own?
  Or just the friction of a chain unseen?
  We seek the origin, the pure **sourcehood**,
  insisting "Mine!" must root beneath the dust.

  Is genuine achievement merely dust?
  Not luck, we cry, but earned! Yet **sourcehood** fades
  when traced too far. Perhaps the worth we own
  lies not in springs unseen, but in the way
  we navigate the currents, show **reasons-responsiveness** –
  the turn, the tack, the choice made sharp and **seen**.

  For friendship thrives on choices freely **seen**,
  on promises that bind beyond the dust
  of whim. It asks a will that's truly **self-possession**,
  not puppet strings. Yet mastery demands **sourcehood**,
  a captaincy we crave, that grants us **leeway**
  to chart the course we call uniquely **own**.

  But who *is* this captain we call **own**?
  Was he forged yesterday? The slow **self-creation**,
  stitched through decades, seems to grant true **leeway**
  from fate's design. Yet build too hard, the dust
  of countless choices chokes the sought **sourcehood** –
  a statue shaping its own stone, **unseen**.

  Perhaps the deepest want remains **unseen**:
  not for the past's tight knot, but how the **deliberative**
  opens the future, wide and still our **own**,
  while weighing paths. That pregnant pause, **self-creation**
  in motion, feels like freedom, not mere dust.
  It asks no ghostly push, just present **leeway**.

  Yet **leeway** flickers when the path's made **seen**.
  The **deliberative** slams shut. Was the best **sourcehood**
  then just the hum of options, now cold **dust**?
  We blame the one who chose, demanding **reasons-responsiveness**,
  proof he *could* have turned, held **self-possession**,
  but flinch to think his core is not his **own**.

  Is *any* will entirely its **own**?
  The craving for a god-like **self-creation** –
  to author every atom, total **self-possession** –
  might scorch the earth where meaning grows **unseen**.
  We'd stand alone, a barren **sourcehood**,
  all **leeway** gained, all human warmth turned **dust**.

  >

  But warmth persists, though **sourcehood** shifts like **dust**.
  The **deliberative** light, though brief, is **seen**.
  We praise the careful turn, **reasons-responsiveness**.
  We trust the friend whose core feels fixed, **self-possession**,
  though currents shaped it far **unseen**.
  Is this the freedom we can rightly **own**?
