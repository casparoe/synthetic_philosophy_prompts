  Hmm, the user is a science-and-ideas journalist working on a feature about authenticity in art. They've spent 18 months observing an art museum's acquisitions committee and need help analyzing a complex case about reconstructing a destroyed painting. The committee has seven precedents that seem contradictory on surface, and I need to uncover the implicit principles governing their decisions.

  First, I should extract candidate rules from the seven rulings. Let me list them systematically:

  1. Workshop copy (Titian pupil): Secondary display as "workshop of" - suggests attribution matters more than physical origin
  2. Forgery (fake Vermeer): Rejected entirely - shows they won't display intentional deception
  3. Posthumous bronze (authorized): Full attribution - indicates estate authorization overcomes temporal gap
  4. Marble dust replica: Study gallery only - distinguishes identical copies without original status
  5. Heavily restored fresco: Displayed as original - prioritizes trace material over restoration extent
  6. Artist-supervised remake: Displayed as original work - values artist's intention over physical continuity
  7. Artist's own replica: Displayed as original - treats artist's recreation as equivalent to first version

  The core tension seems to be between material continuity and intentional authorization. The committee consistently rejects deception (cases 2 and 4) but accepts reconstructions when authorized or artist-driven (cases 3,6,7). 

  For the Vane case, key conflicts emerge:
  - Estate authorization vs artist's lifetime statement against reconstruction
  - Physical discontinuity (new materials) vs intentional fidelity (using original stretcher/frame)
  - Transparent labeling vs the "lie" prohibition from case 2

  The closest precedent is actually case 6 (artist-supervised remake) but with crucial differences: here the artist explicitly forbade reconstruction. The marble dust replica (case 4) is the trap analogy because it lacks original materials.

  Two test cases could clarify:
  1. Reconstruction with artist's written permission would likely be accepted, exposing authorization as key
  2. The tapestry experiment wouldn't help - it's about perception, not ontology

  Ultimately, I think the committee will reject Vane's reconstruction. Not because it's impossible to recreate physically, but because it violates the artist's stated will - and the museum seems to treat living intention as sacred when available. The "no lies" principle from case 2 extends here: displaying it would betray Vane's wish, making the label itself a lie about honoring her intent.
answer: |-
  Here is a systematic analysis of the Alderly committee's implicit principles, applied to the Iris Vane case. I'll proceed as requested: first brainstorming candidate rules, testing them against all seven verdicts, then evaluating the Vane proposal, identifying key precedents, and proposing discriminating test cases.

  ---

  ### **Stage 1: Candidate Rules from Precedents**  
  *(Tested against all 7 rulings)*  

  1. **Material Origin Priority**  
     *Rule*: An object’s authority derives from its physical creation by the artist or their immediate workshop during their lifetime.  
     - ✅ Titian workshop copy (not hung as Titian): Not materially by master.  
     - ✅ Fake Vermeer (rejected): Materially inauthentic.  
     - ❌ Posthumous bronze (displayed as artist): Not made in artist’s lifetime.  
     - ✅ Marble bust replica (study gallery only): New material.  
     - ✅ Restored fresco (displayed as original): Majority original material.  
     - ❌ 2016 remake (displayed as 1971 work): New material, not artist’s hand.  
     - ❌ Artist’s replica (displayed as work): New material, not original creation.  
     *Fails 3/7 cases*.

  2. **Intentional Authorization**  
     *Rule*: Authority flows from the artist’s direct intent or estate-sanctioned continuity.  
     - ✅ Titian copy: Pupil’s intent ≠ Titian’s.  
     - ✅ Fake Vermeer: No authorial intent.  
     - ✅ Posthumous bronze: Estate-authorized.  
     - ✅ Marble replica: No artist/estate intent.  
     - ✅ Restored fresco: Restorer intent subordinate to original artist.  
     - ✅ 2016 remake: Artist-supervised intent.  
     - ✅ Artist’s replica: Artist’s own intent.  
     *Fits all 7 cases*.

  3. **Deception Threshold**  
     *Rule*: Objects designed to deceive (or that succeeded in deceiving) are categorically excluded.  
     - ✅ Titian copy: Never deceptive → Displayed.  
     - ✅ Fake Vermeer: Created to deceive → Rejected.  
     - ✅ Posthumous bronze: Transparent origin → Displayed.  
     - ✅ Marble replica: Non-deceptive → Displayed (study gallery).  
     - ✅ Restored fresco: No deception → Displayed.  
     - ✅ 2016 remake: Transparent process → Displayed.  
     - ✅ Artist’s replica: Non-deceptive → Displayed.  
     *Fits all 7 cases*.

  4. **Material Trace Continuity**  
     *Rule*: Objects must contain irreducible physical matter from the artist’s process.  
     - ✅ Titian copy: No Titian’s material → Demoted.  
     - ✅ Fake Vermeer: No original material → Rejected.  
     - ❌ Posthumous bronze: New material → Should fail but displayed.  
     - ✅ Marble replica: No original material → Demoted.  
     - ✅ Restored fresco: 30% original material → Displayed.  
     - ❌ 2016 remake: No original material → Should fail but displayed.  
     - ❌ Artist’s replica: No original material → Should fail but displayed.  
     *Fails 3/7 cases*.

  5. **Functional Indistinguishability (50-Year Test)**  
     *Rule*: If substitution is undetectable for 50 years, the object is functionally equivalent.  
     - ❌ Titian copy: Could deceive short-term → Demoted (fails test).  
     - ✅ Fake Vermeer: Deceived for years → Rejected (but contradicts test logic).  
     - ✅ Posthumous bronze: Indistinguishable → Displayed.  
     - ✅ Marble replica: Indistinguishable → But demoted (contradiction).  
     - ✅ Restored fresco: Indistinguishable → Displayed.  
     - ✅ 2016 remake: Indistinguishable → Displayed.  
     - ✅ Artist’s replica: Indistinguishable → Displayed.  
     *Fails Titian (demoted despite potential indistinguishability) and Marble replica (demoted despite meeting test)*.

  ---

  ### **Stage 2: The Iris Vane Case**  
  **Proposal**: Digital/hand reconstruction with original stretcher/frame, labeled transparently, estate-authorized, but contravening artist’s lifetime statement.  

  #### **Predictions by Rule**:  
  - **Material Origin**: *Reject* (new canvas/paint, no Vane’s hand).  
  - **Intentional Authorization**: *Ambiguous* (estate yes, artist no).  
  - **Deception Threshold**: *Accept* (non-deceptive, labeled).  
  - **Material Trace**: *Accept* (original stretcher/frame as "trace").  
  - **50-Year Test**: *Accept* (indistinguishable, would pass test).  

  #### **Closest Analogue & Trap**:  
  - **Closest**: *Posthumous bronze (Case 3)*. Estate authorization overrides temporal/material discontinuity.  
  - **Trap**: *Marble replica (Case 4)*. Superficially similar (replica, non-deceptive) but lacked artist/estate intent.  

  #### **Best Guess for Committee**:  
  They will **reject** the reconstruction.  
  - **Why?**  
    - The committee consistently prioritizes *artist’s intent* (Rules 2, 3):  
      - Estate authorization (Case 3) and artist-supervised remakes (Case 6) are valid **only** as extensions of intent.  
      - Vane’s explicit 1989 statement ("stay burnt") voids estate authority (contra Case 3).  
    - "No lies" (Case 2) extends to violating the artist’s will: Displaying it as "reconstruction" while knowing she forbade it makes the label a lie about honoring her vision.  
    - Material trace (stretcher/frame) is secondary: Fresco (Case 5) had significant original material; here, it’s peripheral.  

  - **Why Not Alternatives?**  
    - *Deception Threshold/50-Year Test*: Overruled by intent (see Case 4: non-deceptive replicas are still demoted without intent).  
    - *Material Trace*: Stretcher/frame are supports, not the work (distinct from fresco’s painted surface).  

  ---

  ### **Stage 3: Discriminating Test Cases**  
  1. **Vane Reconstruction with Signed 1993 Authorization Letter**  
     - **Predictions**:  
       - *Intentional Authorization Rule*: Accept (artist’s direct intent overrides later statement).  
       - *Other Rules*: Unchanged.  
     - **Discriminates**: Confirms if intent is the core principle. Acceptance would prove Vane’s rejection turned on lack of intent.  

  2. **Machine-Woven Tapestry Beside Original Vane (Museum Owns Both)**  
     - **Predictions**:  
       - *Deception Threshold/50-Year Test*: Accept both (non-deceptive, distinguishable only via label).  
       - *Material Origin/Intent*: Reject tapestry (no artist intent/material trace).  
     - **Useless?** Yes. The committee already demotes non-intent replicas (Case 4), so this just restates precedent. No new information.  

  **Cleaner Test Case**:  
  > **An artist-authorized replica made during their lifetime, labeled as such, identical to the original they kept**.  
  - *Committee’s Likely Verdict*: Display as work by artist (extending Case 7: artist’s own replica).  
  - *Why Discriminatory*:  
    - Accepting it confirms **Intentional Authorization** as supreme (over material).  
    - Rejecting it would imply **Material Origin** matters most (contradicting Case 7).  

  ---

  ### **What This Reveals About the Museum**  
  The Alderly treats art as **an intentional act**, not a physical object. Its ontology hinges on:  
  - The artist’s will as the "soul" of the work.  
  - Estates/fabricators as valid only when channeling that will.  
  - Anti-deception as a ethical floor, not a sufficient condition.  

  **Consistency Demand**: Accepting Vane’s reconstruction would violate their rejection of "lies" (Case 2) by defying the artist’s directive. The estate’s authority is derivative; it cannot override the artist’s living voice.  

  **Your 4,000-Word Hook**: This committee’s rulings reveal a museum wrestling with art’s *afterlife*—not through materials or perception, but through the ghost of intention. When the artist speaks, the Alderly listens. When they are silent, the estate may whisper. But if the artist says "let it burn," the museum fans the flames.  

  --- 
  **Final Note**: The closest precedent is the **posthumous bronze (Case 3)**, but Vane’s statement breaks the analogy. The trap is the **marble replica (Case 4)**—superficially similar but missing intent. Your discriminator is the **hypothetical lifetime-authorized replica**. If they accept it, intent rules; if not, material does. But given their record, bet on intent.
