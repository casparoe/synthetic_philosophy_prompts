prompt: |-
  Quick one — I'm writing a scene and I want the philosophy to actually hold up rather than just sound good.

  Build me a case where the demandingness worry runs backwards. Singer's shallow-pond principle — the one saying you're obliged to prevent something very bad whenever you can do it without giving up anything of comparable moral importance — has to say my character may walk away, while the ordinary-morality view, the one where duties come out of what you've done and what you owe particular people, has to say she's required to help.

  Constraints: one scene, a page at the outside, realistic — a workshop, a harbour, a farm in the rain, nothing mythic and nothing trolley-shaped. Nobody dies, its not that kind of book. What's at stake for him has to be grave but survivable, and what she'd have to give up has to be genuinely comparable to it, not a ruined coat. She should be someone the reader still likes afterwards, and whatever put him in danger should be something she had every right to do — she isn't a villain, she just used her rights and it went badly for him. And don't make him a relative; I want the debt to come from what passed between them, not from kinship.

  After the scene, show me what each of the two views gives and why, tell me which single feature is doing the work, what happens if you take that feature out, and how someone who likes the pond argument would try to wriggle out of your case. Continuous prose please, no headings, bullets, bold or tables, and in British English.
