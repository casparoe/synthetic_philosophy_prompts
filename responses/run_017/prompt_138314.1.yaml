answer: |-
  The rain drummed a steady rhythm on the corrugated iron roof of the boatyard workshop. Inside, the air hung thick with the smells of salt, damp wood, and linseed oil. Mara, sleeves rolled up, wiped sweat from her brow with the back of her wrist, leaving a smudge of varnish. Across the cluttered space, Rhys, the yard’s master shipwright, wrestled a stubborn plank into place on the hull of a small fishing skiff. His movements, usually economical and precise, were stiff with fatigue; everyone knew his wife was ill, the strain etched deep.

  "Rhys," Mara called, holding up the beautifully crafted wooden mallet she’d just retrieved. "Finished with this? Need it for the *Moonshadow*’s decking." It was Rhys’s personal mallet, a thing of perfect balance he rarely lent, but he trusted Mara’s careful hands.

  He glanced over, nodded curtly. "Aye. Mind the head – oak’s split a wee bit. Still holds, but don’t whale on it." He gestured vaguely towards the mallet’s striking surface where a hairline crack was visible.

  "Got it. Gentle persuasion only," Mara smiled, taking it. She used it carefully for half an hour, tapping decking pegs home on the sleek yacht she was finishing. Feeling the head shift slightly on one lighter tap, she decided caution was wise and returned it to Rhys’s bench, calling out, "Back on your bench, Rhys. Thanks." He grunted an acknowledgement, engrossed in forcing the resistant plank.

  An hour later, a sharp cry, followed by a sickening crunch and a clatter, cut through the workshop’s hum. Mara spun around. Rhys was hunched over, clutching his left hand, face contorted in agony. The oak mallet lay on the floorboards beside a large bronze drifts pin – a heavy, tapered spike used for aligning planks. The mallet’s head had shattered completely on impact. A shard of oak and the heavy pin had come down together, crushing Rhys’s fingers against the keel block.

  Mara rushed over. Through gritted teeth, Rhys gasped, "Head… gave way… on the pin…" His knuckles were already swelling hideously, purpling beneath the grime. The damage was clearly severe – likely multiple fractures, tendons crushed. For a shipwright, hands are life.

  Guilt, cold and sharp, pierced Mara. She’d borrowed the mallet. She’d seen the crack. She’d used it, then returned it. She hadn’t *caused* the break, the flaw was old, but she’d put the weakened tool back into circulation, right when Rhys, exhausted and distracted, needed to apply significant force. She’d exercised her right to borrow, a common practice, but the consequence had landed squarely, brutally, on him.

  As they waited for the ambulance, Rhys’s pallor deepened. "Hand’s done," he muttered, despair cutting through the pain. "Months out. Maybe… never the same fine work. The mortgage… Lena’s treatments…" The unspoken fear hung heavy: ruin. His skill was his sole capital.

  Then Mara’s phone buzzed. It was the email. The prestigious, once-in-a-lifetime restoration apprenticeship in Falmouth. *Confirmed. Start Monday.* It required her presence immediately for induction. Missing it meant forfeiting the place. This was her break, her path out of precarious freelance work into secure, respected craftsmanship. Years of scraping by, saving every penny for tools and courses, hinged on catching that Monday train.

  She looked at Rhys, grey-faced and shivering, cradling his wrecked hand – his livelihood, his ability to care for his sick wife, potentially shattered. She looked at the email – her own precarious future secured. She knew people. She could stay, navigate the NHS maze for him, ensure he got the best possible care quickly, advocate for him with the yard owner about sick pay, help organise practical support. Her local knowledge and fierce advocacy could make a tangible difference to his recovery and financial survival. Walking away felt like leaving him adrift in the storm she’d inadvertently helped brew. But staying meant abandoning the future she’d fought so hard for.

  **The Philosophical Weighing:**

  Peter Singer’s "shallow pond" principle demands preventing something very bad if we can do so without sacrificing anything of "comparable moral importance." Rhys’s injury is undoubtedly "very bad": potentially career-ending, financially catastrophic, impacting his ability to care for his ailing wife. Preventing the worst outcomes (financial collapse, inadequate care) by staying and helping is significant. However, Mara sacrificing the Falmouth apprenticeship *is* arguably of comparable moral importance *to her*. It represents the loss of her best chance for long-term security, professional fulfilment, and escaping precarity – outcomes as fundamentally significant to her life as avoiding ruin is to Rhys. Singer’s principle, focused on aggregate well-being and impartial cost-benefit, would likely permit her to go. The sacrifice demanded (her career-defining opportunity) is comparable in moral weight to the harm she could mitigate (Rhys’s potential ruin), so the obligation isn’t absolute. She can walk to the train.

  Ordinary morality, rooted in relational duties and responsibilities arising from specific interactions, demands she stay. Here, the duty springs directly from what transpired between them. Mara borrowed the mallet with Rhys’s permission. She knew it was damaged. She used it and returned it without explicitly warning him about the shift she felt, assuming he knew its state (he *had* mentioned the crack). By initiating this chain – borrowing the tool, using it, returning it while it was demonstrably further compromised – she became causally implicated in creating the situation where Rhys was using a dangerously weakened tool without full awareness. While not blameworthy in a culpable sense (she had a right to borrow, she didn’t break it maliciously), her actions are the identifiable link that placed the specific hazard back into Rhys’s hands at that moment. Ordinary morality, emphasising duties arising from what we *do* and the particular relationships we create or affect, dictates she owes him assistance born of that specific causal contribution. She created a special obligation through her interaction, irrespective of comparable cost. Her duty is to *him*, specifically.

  **The Crucial Feature:**

  The single feature making this case run "backwards" is **direct, agential causation within a specific relationship**. Mara didn’t just witness a random misfortune befall Rhys; her own recent, legitimate actions (borrowing/using/returning the tool) are the direct link that placed the proximate cause of his injury (the further-weakened mallet) back into his work environment. Ordinary morality seizes on this direct link of agency within their established working relationship to create a particular duty. Singer’s view, overlooking the specific relational history and focusing only on the current state of suffering and the cost of aid, sees no special obligation beyond the general one, which is negated by the comparable sacrifice.

  **Removing the Feature:**

  If Mara had simply been passing by when Rhys, using his own mallet (which she’d never touched), suffered the same accident, the dynamic vanishes. Singer’s view remains the same (cost comparable, no obligation). Crucially, ordinary morality would also likely release her. There’s no special relationship or action creating a unique duty; helping would be supererogatory (good but not required). The backwards demand vanishes.

  **The Singerian Wriggle:**

  A defender of Singer might argue thus: "The 'comparable moral importance' test is stringent. Is Mara's *certain* loss of a transformative career opportunity truly comparable to the *risk* of financial ruin for Rhys? Ruin isn't guaranteed; benefits, insurance, community support might mitigate it. Mara's loss, however, is absolute and irreversible if she stays. The potential harm prevented is probabilistic, while her sacrifice is definite. Further, the causal chain is indirect; the mallet's failure was latent. Mara merely triggered an existing risk. Her contribution was minimal, diminishing the special duty ordinary morality posits. The impartial calculus still favours her pursuing her own vital interests."

  This wriggle hinges on downplaying the certainty of Rhys's dire outcome without Mara's specific help and reframing her causal role as negligible, thus attempting to make her sacrifice seem disproportionately large compared to the preventable harm.
