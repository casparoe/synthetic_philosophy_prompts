  The stakes need to be serious but not fatal - perhaps a crushed hand that threatens Rhys's livelihood as a boat builder. Mara's sacrifice would be giving up a career-changing apprenticeship opportunity that requires immediate departure. This creates genuine moral weight since both outcomes involve life-altering consequences.

  For the philosophical analysis afterward, I'll show how Singer's principle might excuse Mara from helping because the apprenticeship represents something of comparable moral importance to Rhys's injury. Meanwhile ordinary morality would emphasize her duty stemming from being the direct cause of his predicament.

  I'm mindful of the user's request for British English and continuous prose without formatting elements. I'll also address how proponents of Singer's view might try to "wriggle out" of this case, perhaps by questioning the comparability of sacrifices or the directness of causation.

