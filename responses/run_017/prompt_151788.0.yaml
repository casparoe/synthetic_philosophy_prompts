prompt: |-
  For the past two years I have kept a running log of my supervisor's verdicts on standing-to-blame cases. She is a responsibility theorist, I am writing a chapter on hypocrisy and standing, and I wanted a record of her judgments that is independent of whatever I end up arguing, so at the end of supervision I have been putting one or two cases to her and writing down the answer before I have time to argue with it. The verdicts I have are these: a husband who is having an affair blames his brother for having one — no standing, she said he was in no position; a woman who shoplifted a chocolate bar at fourteen blames a colleague for systematic expense-account fraud — standing, the earlier act is irrelevantly small; a manager who privately opposed a plan to withhold emissions data but signed off on it anyway blames her CEO for lying to regulators — no standing, or at any rate her blame is defective in whatever way matters here; a colleague who watched a junior researcher being publicly humiliated and said nothing afterwards blames the person who did the humiliating — standing, and she insisted that failing to intervene is not the same as being implicated; a man who once revealed a confidence under a credible threat blames a colleague for gossiping — standing, because his own act was excused and so there is nothing for him to be inconsistent about; a man who cheated on a grant application a decade ago, confessed, was sanctioned, and has been scrupulous since blames a colleague for minor CV inflation — she wavered and then said standing, on the grounds that what matters is whether he is now willing to be judged by the norm he is invoking; and a woman who blames her sister's employer for harassing her sister, when the sister has declined to complain — standing, since you can speak for someone who is not in a position to speak for herself.

  A real case has now come up in my department and I want to know what she will say before I put it to her. Miriam, a postdoc here, has no car, has not flown for leisure in nine years, and has moved her savings out of unscreened index funds; in a department meeting she publicly blamed, first, a senior colleague, Professor Ames, for flying to a conference in Sydney on a trip Ames did not choose — she was assigned to represent the department on a hiring panel — and, second, the department's governing body as a body, for refusing to cap conference travel and for the university's investment policy. Two features make this unlike anything on my list. The first is that Miriam's own pension sits in the university's default scheme, which holds the very index funds she has divested from personally; switching to the screened option is a one-page form she has not filled in, and privately she admits she has not got round to it. She is therefore a beneficiary of, and in some weak causal sense a contributor to, the investment policy she is condemning, while having never done anything remotely like it herself and plainly not being committed to exempting herself from the norm she invokes. The second is that part of the blame is addressed to a collective for a diffuse harm in which there is no individual victim who could complain and no individual member who controls the outcome, and part of it to a person who was not in a position to have acted otherwise — so the case probes whatever she thinks vicarious standing to blame requires when there is no one on whose behalf she is speaking, and whatever she thinks blame of a collective inherits from blame of a member. My own suspicion is that her verdicts are best explained by one forward-looking rule about the blamer's relation to the norm rather than by either a simple no-better-than condition or a complicity condition, and I have been trying to keep apart three things I think she may be running together: standing, meaning the authority to address the blame at all; the aptness of what the blame says; and whether the blaming is itself a fault in the blamer, since it seems to me that a hypocrite's blame can be apt and authorized and still be something he ought not to do.

  Predict her verdict on each half of the case, the individual half and the collective half, and tell me which single rule best explains the whole run of verdicts, including why she said no in the emissions case and yes in the bystander case and why she wavered in the reformed-cheater case. Commit to one rule and one verdict, with your reasons: do not set out the candidate rules with their respective predictions and leave me to choose between them, though do tell me which runner-up your prediction is most at risk of being confused with, and whether you think the beneficiary-but-not-agent feature or the collective-address feature is doing the real work in your answer. Then give me the one further case — the smallest variation on Miriam's, I would guess — that would most cleanly separate the rule you have picked from that runner-up, say what her answer to it would have to be for you to conclude you picked the wrong rule, and tell me how confident you are, in rough terms, that she answers as you predict. If you think my three-way distinction between standing, aptness and fault-in-the-blaming does no work on this material, or that the individual/collective split matters less than I am making of it, say that plainly rather than accommodating me.
reasoning: |-
  Hmm, this is a rich philosophical puzzle about moral standing to blame, with practical implications for the user's department situation. The user has meticulously documented their supervisor's judgments on hypocrisy cases over two years and now wants to predict her verdict on a complex real-world scenario involving Miriam's climate blame.

  First, I need to absorb all the precedent cases: The supervisor consistently rejects standing when the blamer is actively violating the same norm (husband's affair, manager's complicity), but grants it when there's clear moral distance (shoplifting teen vs fraud, excused confidence breach). The "reformed cheater" case is pivotal - she wavered but ultimately allowed standing based on current normative commitment. The bystander case shows she distinguishes passive failure from active wrongdoing.

  Now for Miriam's case: There are two distinct blame targets - Professor Ames (individual) and the department collective. For Ames, Miriam blames unavoidable conference travel. Since Ames had no choice, this mirrors the "excused confidence breach" case where coercion removed blameworthiness. Miriam's own pension fund inaction creates beneficiary hypocrisy, but crucially she's not violating the climate norm herself - she's actively divested personally. The supervisor's pattern suggests "current normative commitment" matters more than past minor inconsistencies.

  For the collective blame: Miriam benefits from the investments while condemning them. But the "sister's employer" precedent shows standing can exist when speaking for the voiceless - here, future generations harmed by climate policy. The reformed cheater case indicates ongoing benefit doesn't necessarily negate standing if there's sincere normative alignment.

  The core rule emerging isn't about comparative sin ("no better than") or direct complicity, but about whether the blamer is genuinely committed to the norm they're invoking. This explains why the emissions-case manager lacked standing (she violated the norm she invoked) while the bystander had standing (failure to intervene isn't norm-violation). The wavering in the cheater case occurred precisely because reform tests current commitment.

  For the test case: Remove Miriam's beneficiary status while keeping collective blame. If the supervisor denies standing then, my rule is wrong - but I doubt she would, since the "sister's employer" case had no personal benefit. I'm 85% confident in this prediction because the precedents show remarkable consistency around normative commitment being dispositive.

  The user's three-way distinction might be less relevant here because the supervisor seems to collapse standing and aptness - she treats defective blame as lacking standing altogether. The collective/individual split matters only superficially; the underlying norm-commitment logic applies to both.
answer: |-
  Based on your supervisor's pattern of verdicts, her underlying principle appears to be **normative commitment consistency**: *A blamer has standing only if they demonstrate genuine, current commitment to the norm they are invoking, such that they are willing to be judged by it themselves, regardless of past acts, complicity, or benefit.* This rule prioritizes the blamer's *present relationship* to the norm over historical inconsistencies, comparative fault, or indirect contributions, provided the blamer isn't actively violating the norm *while* blaming.

  ### Prediction for Miriam's Case
  1.  **Blame toward Professor Ames (individual): STANDING.**  
      Ames had no choice about the flight (assigned duty). This mirrors the "revealed confidence under threat" case: the blamed act was *excused* (non-voluntary), so Miriam's blame isn't hypocritical. Her own climate actions (car-free, no leisure flights) demonstrate commitment to the norm. The beneficiary status is irrelevant here because Ames's act isn't a *norm violation*—it's excused. Your supervisor distinguished between *being implicated* and *failing to intervene* (bystander case); here, Ames wasn't even implicated in wrongdoing.

  2.  **Blame toward the Department Collective: NO STANDING.**  
      Miriam benefits directly from the investments via her pension and has failed the minimal step (one-page form) to align her actions with the norm *she is actively invoking*. Unlike the "reformed cheater" (who confessed, was sanctioned, and reformed), Miriam is *currently* accepting benefits from the policy she condemns *while* blaming others for it. Her private admission of inaction ("hasn't got round to it") undermines any claim of genuine, current commitment. The "sister's employer" case doesn't save her—there, the blamer wasn't *benefiting* from the harm nor failing a trivial opt-out.

  ### Why This Rule Explains All Verdicts
  - **Husband affair**: No commitment to fidelity norm (actively violating it).  
  - **Shoplifting teen**: Past minor, irrelevant act doesn't undermine *current* commitment to anti-fraud norm.  
  - **Emissions manager**: Signed off on wrongdoing → no commitment to honesty norm *she invoked*.  
  - **Bystander**: Failing to intervene ≠ endorsing humiliation norm; current commitment to anti-humiliation norm is intact.  
  - **Revealed confidence**: Act was *excused* → no inconsistency with anti-gossiping norm commitment.  
  - **Reformed cheater**: Wavered because *sanction/reform* tested current commitment; "willing to be judged now" confirmed standing.  
  - **Sister's employer**: Commitment to anti-harassment norm is clear; no self-exemption.  

  **Key distinctions**:  
  - **Runner-up rule most easily confused**: *"No active complicity"* (emphasizes non-participation in harm). But this fails to explain the **emissions case** (manager *was* complicit) and the **collective blame** in Miriam (she *is* complicit via benefit/inertia). Your rule focuses on *norm-relation*, not harm-causation.  
  - **Real work in Miriam's case**: The **beneficiary-but-not-agent feature** is decisive for the collective blame. The collective-address feature is secondary; her verdict hinges on Miriam's personal inconsistency with the norm, not the collective's structure.  

  ### Crucial Test Case to Separate the Rules
  **Variation:** Miriam *has* switched her pension to the screened fund (commits the norm fully) but still blames the collective for the same investment policy.  

  - **Prediction under my rule**: STANDING. Her current actions demonstrate full commitment; benefiting from past investments is irrelevant (like the shoplifter's irrelevant past).  
  - **If she says NO STANDING here**, my rule is likely wrong, and the runner-up (*"no complicity in harm"*) gains traction. She would then be prioritizing Miriam's *ongoing benefit* (even if norm-committed) over normative consistency.  

  ### Assessment of Your Framework
  - **Standing/Aptness/Fault distinction**: Your supervisor *collapses* these. She treats "defective blame" (emissions case) as a standing issue, not aptness. Hypocrisy, for her, voids standing entirely—it’s not merely a separate "fault in the blamer." Your distinction doesn’t map onto her judgments; she views standing as *contingent on the blamer’s norm-consistency*.  
  - **Individual/Collective split**: Less critical than you suggest. Her verdicts turn on the *blamer’s norm-relation* regardless of target. The collective aspect in Miriam matters only because it *exposes her beneficiary inconsistency*.  

  **Confidence**: 85%. The "reformed cheater" waiver and her insistence on *current* normative willingness ("willing to be judged now") anchor this rule. Miriam's pension inaction is a direct failure of minimal commitment, mirroring the manager’s complicity in emissions fraud. The Ames half is straightforward under the "excused act" precedent. If your supervisor balks, it might be on the *collective* half due to diffuse harm—but her "sister's employer" case suggests she’s comfortable with blamers standing in for non-complainants when normative commitment is clear (which it isn’t for Miriam’s collective blame).
