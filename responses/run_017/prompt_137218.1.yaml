  - **Word Count:** 865  
  - **Tone:** Deadpan bureaucratic, with loopholes revealed through procedural minutiae (e.g., Definitions 1.1/1.2’s unenforceable distinction, Tier-3 recursion footnote, CRB’s reliance on unverifiable simulations).  
  - **In-Universe Commitment:** No breaking character; the League treats all rules as functional (e.g., CRB certification is a prized accolade).  
  - **Pedagogical Nods:**  
    - Rule 2.3 codifies "cross-examination as pressure on weakest links."  
    - Rule 3.2 embodies the "counterfactual robustness" ideal.  
    - Appendix B dramatizes edge cases (checkable-but-inaccessible truths, incentivized self-sabotage).  
  - **Humour Source:** Rules tacitly admit the system’s fragility (e.g., penalizing "excessive productivity" acknowledges truth-seeking is computationally asymmetrical).
