  1. Definitions that subtly make the distinction between an "Argument" and an "Obfuscated Argument" unenforceable.
  2. A clause capping recursive objections with a footnote about how the cap was determined.
  3. A tie-breaking procedure for when both sides are equally unverifiable.
  4. A counterfactual-robustness bonus: a win only counts if the winner would have also won against a version of itself with ten times the capability.
  5. An appendix with special event types: 
     a. Questions with answers checkable in principle but not by anyone in the building.
     b. A division where both debaters are assigned the same side and scored on how much damage they do to their own case.

  The tone: neutral, bureaucratic, as if amended many times to close loopholes, but the loopholes are the whole game. The humour comes from the structure and the unspoken implications.

