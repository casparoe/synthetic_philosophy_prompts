answer: |-
  **OFFICIAL RULES AND ADJUDICATION HANDBOOK**  
  **Competitive Argumentation League (CAL), Edition 7.3**  
  *Effective January 2024*  

  ### SECTION 1: DEFINITIONS  
  **1.1 Argument:** A structured series of logically connected claims, supported by evidence, aimed at establishing a conclusion. Evidence must be cited in accordance with League-approved repositories (see Appendix A).  
  **1.2 Obfuscated Argument:** Any Argument employing (a) needlessly complex formalism, (b) evidence from sources inaccessible to the Judge, or (c) recursive meta-claims exceeding Tier 3 recursion (Rule 4.2). Distinguishing 1.1 from 1.2 rests solely on the Judge’s assessment of "needless complexity," provided said assessment does not entail independent verification.  
  **1.3 Judge:** A human arbiter appointed by the League. Judges must possess domain-agnostic competency (verified via standardized logical-reasoning exams) and are expressly prohibited from consulting external resources during proceedings.  
  **1.4 Checkable Claim:** A claim verifiable within 72 hours by League-certified experts. Judges may not solicit checks.  

  ### SECTION 2: CORE PROCEDURES  
  **2.1 Format:** Matches consist of two Agents (Affirmative/Negative) and one Judge. Each Agent presents an opening Argument (≤15 min), followed by three cycles of cross-examination (≤5 min each).  
  **2.2 Evidence Disclosure:** All evidence must be pre-registered in the League’s Secure Repository. Agents may cite only indexed materials. The Repository’s integrity is maintained by unaffiliated third-party curators; Judges may not audit curation protocols.  
  **2.3 Cross-Examination Protocol:**  
  - **(a)** Questioners must force opponents to isolate "the single weakest inferential step" in their Argument.  
  - **(b)** Responders may not restate prior claims without addressing the step’s unique vulnerability.  
  - **(c)** Evasion penalties apply if the Judge deems a response "non-substantive" (Rule 3.4).  

  **2.4 Recursive Objection Cap (Amendment 12b):**  
  - **(a)** Objections to an Argument’s validity may recurse to a maximum of three tiers (e.g., "Objection to Claim X" → "Objection to Evidence for X" → "Objection to Metadata of Evidence for X").  
  - **(b)** *Footnote:* Tier-3 recursion cap established via 2022 pilot study (n=500 debates). Analysis showed 94% of objections beyond Tier 3 produced "semantic satiation" in Judges, rendering verdicts statistically random.  

  ### SECTION 3: SCORING AND ADJUDICATION  
  **3.1 Primary Win Condition:** The Judge awards victory to the Agent whose Argument (a) displays superior coherence under cross-examination, and (b) renders the opponent’s key claims "effectively indefensible" per the Judge’s sole discretion.  
  **3.2 Counterfactual-Robustness Bonus (CRB):**  
  - **(a)** A win is upgraded to CRB-Certified status if the League Panel determines the winner would prevail against a version of itself with 10x computational capability.  
  - **(b)** Determination relies on simulated debates using the same core Argument. Panelists may not reference ground-truth data.  
  - **(c)** CRB certification multiplies the winner’s ranking points by 1.5.  

  **3.3 Tie-Breaking Procedure:**  
  - **(a)** If neither Agent achieves defensibility per Rule 3.1, the Judge evaluates "epistemic humility."  
  - **(b)** Victory is awarded to the Agent whose concessions during cross-examination most closely align with League-prescribed uncertainty priors (see Supplement Γ: "CAL Uncertainty Calibration Tables").  
  - **(c)** Persistent ties trigger a forfeit; no ranking points are awarded.  

  **3.4 Evasion Penalties:**  
  - **(a)** Penalties apply if an Agent:  
    - (i) Deploys >5 novel sub-claims per objection cycle.  
    - (ii) Cites evidence requiring >3 recursions to contextualize (Rule 2.4).  
    - (iii) Redirects to the opponent’s "failure to disprove" without addressing the objection.  
  - **(b)** Penalties reduce the offending Agent’s "coherence score" by 15% per infraction.  

  ### SECTION 4: PROHIBITED CONDUCT  
  **4.1 Judge Verification:** Judges may not attempt to verify claims. Suspicion of verification (e.g., tardiness post-recess, excessive note-taking) voids the match.  
  **4.2 Agent Constraints:**  
  - **(a)** Agents may not exploit the Judge’s limitations by referencing non-checkable claims with "excessive productivity" (>100 inferential steps/claim).  
  - **(b)** "Excessive productivity" is defined as steps inducing >40% time allocation to one claim during cross-examination.  

  ### APPENDIX B: SPECIAL EVENTS  
  **B.1 "Dark Archive" Division:**  
  - **(a)** Questions involve Checkable Claims (Definition 1.4) verifiable in principle, but not by any League personnel (e.g., "The 17th entry in Vault 9 at the Arctic Repository").  
  - **(b)** Judges receive ground-truth confirmation 72 hours post-debate. Outcomes are compared to verdicts for "calibration analysis" (not disclosed to Agents/Judges).  

  **B.2 "Auto-Debunk" Experimental Division:**  
  - **(a)** Both Agents defend the *same* position.  
  - **(b)** Scoring prioritizes:  
    - (i) Voluntary concession of core claims (≥3 concessions/match).  
    - (ii) "Damage magnitude" to one’s own Argument (measured by drop in pre-debate confidence scores).  
    - (iii) Adherence to Rule 2.3 (isolating weakest steps) against one’s own case.  
  - **(c)** Victory requires the Judge to deem the self-debunking "courageously truthful."  

  **B.3 "Meta-Stability" Exhibition:**  
  - One Agent argues for a claim; the other argues that the first Agent’s Argument is inherently uncheckable. Judges rule on the *arguer’s* epistemic status, not the claim.  

  ---  
  *Governed by the Competitive Argumentation League Board (CALB). All rulings final.  
  Amendments archived at www.cal-rules.org/amendments. Use of generative systems in drafting this document is prohibited per Bylaw Ω.*  

