prompt: |-
  I'm a metaphysician by training, so this is well outside what I actually work on, and I keep running into a pattern I don't have a word for. I'd be grateful if you could tell me whether there's an established concept for it, or whether I'm describing three different things and not noticing.

  Here's the shape. Someone fully grants the cosmic claim — nothing matters, the universe is indifferent, in two hundred years none of this will have left a trace — and at the same time is gripped by some local thing in a way that has nothing to do with enjoyment and is not presented as a choice. They don't say "I've decided this matters to me." They say it matters, full stop, and they get a bit stiff if you call it a hobby or a coping strategy.

  Three cases, because I'm not convinced they're one case:

  1. A PhD student of mine told me over coffee that the field is churn and nobody will read any of it. She said it calmly, she isn't depressed, and then she went straight back to a paper she's been grinding on for two years. She has no illusion that it's important. But she also can't just stop: stopping would be, in her words, "a thing that happened to me" rather than a decision. When I tried to argue her out of the cosmic bit she pushed back — she doesn't think the two levels touch each other.

  2. A neighbour retired and now spends most of his week volunteering on a project to restore a stretch of canal. He says outright that it's pointless; the funding will lapse, it'll silt up again. It's also the part of his week he talks about with the most energy. He doesn't enjoy most of it — it's cold, it's muddy, the other volunteers annoy him.

  3. A friend who lost her religion years ago still goes to the services and keeps the whole yearly round, and is cheerfully clear that she believes none of it. She won't describe it as meaning anything; she describes it as where she belongs. But when the building was shut for repairs for eight months she said that stretch felt "weightless" — the same word she uses for the years before her kids were born.

  What I keep noticing is that none of them are doing what the pop version of the absurdist stuff tells you to do. They haven't stood on a hill and decided to make something theirs. The pull was already there (case 3) or arrived and then stopped being optional (cases 1 and 2), and if you asked what would happen if they picked some other thing instead, they'd say that isn't how it works — you can't swap it out at will. And they'd deny the thing has any value that would survive their not caring about it. So it isn't "I made my own meaning," which sounds like an act of will; it isn't "this is genuinely valuable," which they explicitly deny; and it isn't "I like doing it," because mostly they don't, and plenty of what they do enjoy they'd call trivial.

  My colleague in value theory tells me meaning is a matter of being gripped by something independently worth being gripped by. That sounds like it can't handle these cases at all: the grip is there and the worth is denied. But the rival thing I keep hearing in the corridor is that these people are just describing attachment, habit, or identity in inflated language, and that the word "meaning" is doing no work here. Both replies feel too quick.

  So: does this configuration have a name? Is there a literature on the non-optional-but-not-valuable pull, as opposed to the chosen-project line that the boulder essay usually gets read as recommending? Are my three cases one phenomenon or three — the inherited one feels different from the acquired one? And I don't want a label on its own; I want the carving. What would have to be true for this to count as a genuine species of meaningfulness rather than a lookalike, and what exactly are the lookalikes? One boundary case I care about most: what do we say about people who make the same cosmic concession, feel no pull at all, aren't unhappy, and aren't looking for anything? Same phenomenon minus a part, or a different thing entirely?

  Could you give me:

  - "Does it have a name" (~150 words) — straight answer on whether there's an established concept or literature, and if there isn't, coin one in a sentence and say why that coinage
  - "Nearest concepts" (~300 words) — the closest established accounts of meaning in life, what each gets right about these cases and where each breaks
  - "One or three" (~250 words) — whether the inherited and acquired variants are the same phenomenon, and what the core case is if so
  - "Definition and edges" (~300 words) — a definition, plus what it rules out: chosen projects, enjoyment, mere habit, attachment, the no-pull case
  - "What it costs" (~200 words) — which accounts of meaning are in trouble if this is really meaning, and which can absorb it without strain
reasoning: |-
  Hmm, this metaphysician is describing a fascinating pattern where people fully acknowledge cosmic insignificance yet feel an involuntary, non-negotiable pull toward certain activities. They're rejecting both existentialist "meaning-creation" and objective value theories. The examples are vivid: the PhD student grinding through a paper she knows won't matter, the canal volunteer embracing pointless labor, the secular woman keeping religious rituals. All insist this isn't about choice, enjoyment, or delusion.

  First, I need to confirm there's no established term. Camus' "absurd" is close but emphasizes rebellion, not this passive compulsion. Frankfurt's "cares" captures the involuntariness but misses the cosmic concession. Wolf's "meaning as loving objects worthy of love" fails because these people deny worth. No perfect fit exists.

  For nearest concepts: existentialism gets the cosmic context right but botches the volition part. Objective list theories stumble on denied value. Subjectivist accounts overemphasize enjoyment. Attachment theory sees the grip but ignores the metaphysical framing. Each captures one facet but not the whole.

  Are the three cases unified? Yes - the core is non-volitional grip + cosmic indifference. Case 3 (inherited) shows the pull precedes reflection; cases 1-2 (acquired) show it becomes binding later. The mechanism differs (social identity vs absorbed commitment) but the structure matches: an "inescapable frame" that organizes experience despite acknowledged futility.

  Defining this requires four criteria: cosmic resignation + non-volitional grip + action-orientation + non-derivation from enjoyment/value. It excludes chosen projects (voluntary), hedonic activities (pleasure-driven), and mere habits (no action-orientation). The no-pull case is different - it's cosmic resignation without local traction, producing lightness rather than weight.

  If this counts as genuine meaning, objective value theories must either expand "worth" or concede defeat. Frankfurt-esque care-based accounts can absorb it best by decoupling importance from justification. Existentialism survives only if we reinterpret "rebellion" as submission to the pull. The real casualty is the idea that meaning requires transcendence - here it persists as purely immanent gravity.
answer: |-
  Below is a structured analysis addressing your queries about this phenomenon of "non-optional pull amid cosmic indifference." I draw on philosophy of meaning (especially Susan Wolf, Harry Frankfurt, Thaddeus Metz), existentialism (Camus, Nagel), and psychology (self-determination theory, identity research), while acknowledging gaps in established terminology.

  ---

  ### **1. Does it have a name? (~150 words)**  
  No established term fully captures this configuration. **Nearest candidates**:  
  - Camus' "absurd" (reconciling cosmic meaninglessness with human striving), but his "rebellion" implies conscious defiance, whereas your cases describe a *passive* grip.  
  - Frankfurt's "cares" (non-volitional commitments that structure identity), but he links cares to normative claims, which your subjects deny.  
  - "Post-theistic religious habituation" (case 3) or "anti-teleological labor" (cases 1–2) exist in niche literature, but lack a unifying frame.  

  **Proposed coinage**: **Immanent Gravity** (IG).  
  - *Why?* "Immanent" stresses the local, non-transcendent nature; "gravity" evokes an inescapable, physics-like force (not chosen, not pleasurable, not justified). It avoids "meaning" to sidestep debates about value, while capturing the phenomenological "weight" your subjects report when the pull is absent (case 3).  

  ---

  ### **2. Nearest Concepts (~300 words)**  
  | **Concept**              | **What it gets right**                                                                 | **Where it breaks**                                                                 |
  |--------------------------|---------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------|
  | **Camus' Absurd**        | Accepts cosmic futility + local commitment.                                           | Prescribes "rebellion" as a chosen stance; your cases lack defiance or volition.    |
  | **Frankfurt's "Cares"**  | Identifies non-volitional commitments that define us ("we are gripped, not gripping"). | Assumes cares imply subjective importance/value; your subjects explicitly deny this. |
  | **S. Wolf's "Fittingness"** | Meaning requires "loving objects worthy of love."                                | Your cases reject "worthiness" – the canal isn't objectively valuable, the PhD isn't "loved." |
  | **Nagel's "Absurdity"**  | Cosmic perspective vs. local seriousness coexist without resolution.                  | Treats the tension as intellectual; your cases show it as lived, non-dissonant inertia. |
  | **Habit/Identity (Psych.)** | Explains case 3 (ritual) as internalized social identity; cases 1–2 as absorbed goals. | Fails the "weight" test: habits lack action-orientation; identity explains why but not the *pull*. |

  **Core gap**: Existing frameworks either require value-affirmation (Wolf), conscious endorsement (Camus), or reduce it to psychology (habit). IG lacks justificatory structure – it is motivationally potent *despite* disavowal of worth.

  ---

  ### **3. One or Three? (~250 words)**  
  **One phenomenon with two variants**: The core is **inescapable action-orientation without teleology**.  
  - **Mechanism**: In all cases, an activity becomes an "existential frame" (a structure organizing agency and perception) through:  
    - *Inherited* (case 3): Social/ritual immersion embeds the frame before cosmic awareness.  
    - *Acquired* (cases 1–2): Sustained engagement absorbs the agent into the frame (e.g., PhD grind → identity as "researcher"; canal labor → "restorer").  
  - **Shared structure**:  
    1. Cosmic indifference is conceded without anguish.  
    2. The activity is experienced as non-negotiable ("a thing that happened to me").  
    3. Abandoning it induces disorientation ("weightlessness").  
  - **Difference**: Case 3’s frame is *collective* (ritual binds to community), while 1–2 are *individual* (projects bind to a self-conception). Yet both function as inertial frames: once inside, opting out feels like ejection, not choice.  

  **Core case**: The PhD student (case 1) – clearest example of an acquired frame persisting after value disillusionment.

  ---

  ### **4. Definition and Edges (~300 words)**  
  **Immanent Gravity (IG)**: *A non-volitional, action-orienting commitment to a local activity or role, experienced as constitutive of one's practical identity, despite explicit denial of its cosmic or objective value, and dissociated from hedonic satisfaction.*  

  **Boundaries**:  
  - **VS. Chosen projects**: IG is not elected ("standing on a hill"). One is *claimed* by the activity (e.g., the PhD student says stopping would "happen to" her).  
  - **VS. Enjoyment**: IG persists without pleasure (canal work is "cold, muddy, annoying"). Enjoyable activities lack the "weight" – your subjects deem them trivial.  
  - **VS. Mere habit**: Habits are automatic but not action-orienting. IG organizes agency (the PhD paper "grind" structures her days; ritual absence creates disorientation).  
  - **VS. Attachment/Identity**: Identity explains *why* the grip exists, but IG adds the **disavowal of value** – it is identity stripped of self-importance.  
  - **The no-pull case**: Those who concede cosmic indifference, feel no pull, and are content exhibit **apathetic equanimity**. This is IG’s inverse: no local gravity, thus no "weight" to lose. It is a distinct state – not IG minus a part, but a different mode of being.  

  ---

  ### **5. What it Costs (~200 words)**  
  If IG is a genuine species of meaning, two accounts face trouble:  
  - **Objective Value Theories (Wolf, Metz)**: IG explicitly rejects that activities are "worthwhile" or "worthy of love." If meaning can exist without valued objects, objective theories must either expand "value" to include non-justificatory grips (undermining normativity) or exclude IG (risking phenomenological irrelevance).  
  - **Existentialist Voluntarism (Sartre, Camus)**: If meaning requires conscious choice/rebellion, IG’s passive absorption contradicts this. Camus survives only if "rebellion" is retrofitted to *enduring* the grip – but this dilutes his active ethos.  

  **Accounts that can absorb IG**:  
  - **Frankfurt's Care Theory**: By separating "cares" from justification, IG can slot in as a brute motivational fact.  
  - **Nagelian Absurdity**: IG fits his "double vision" – seriousness persists without rational grounding.  
  - **Psychological Self-Determination**: If "meaning" requires competence/autonomy/relatedness, IG satisfies the latter two minimally (autonomy as "ownership," not choice).  

  **Cost to metaphysics**: If IG is meaning-like, it severs meaning from *justification*, grounding it in **inescapable practical necessity**. This challenges theories privileging cosmic transcendence or rational endorsement.  

  ---
  ### **Summary**  
  You've identified a cohesive phenomenon – **Immanent Gravity** – where cosmic resignation coexists with local, non-volitional traction. It conflicts with dominant "meaning-making" narratives but aligns with Frankfurtian cares and Nagelian absurdity. The inherited/acquired divide is superficial; the core is the emergence of a self-sustaining practical frame. Its recognition pressures objective value theories but enriches existential psychology by decoupling meaning from both choice and value.
