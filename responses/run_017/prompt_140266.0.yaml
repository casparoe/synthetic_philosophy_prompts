prompt: |-
  I've been reading about origin essentialism — the view that a person could not have originated from a different sperm and egg — and I keep noticing a pattern in how that idea gets applied that I can't find discussed. I'd like to know whether it has a name, and if not, how exactly it should be carved up.

  The pattern has two halves. First: when people are asked what they could have been like, what seems to matter is causal route rather than magnitude of difference. Asked whether they could have been born to different parents, in a different country, with an utterly different life, most people say no — that would be someone else. Asked whether they could have been born a different sex, or raised by an aunt instead of by their parents, or with a severe disability, most say yes, even though the last of these arguably makes for a bigger difference in the resulting person than a change of parents would.

  Second: change the question from what could have been to what was. Someone discovers at forty that he was switched at birth, or that the couple who raised him were not his biological parents. The usual reaction is that he is the same person he always was and that only the story about his origins has turned out false; nobody concludes that he never existed and that someone else did. Yet the difference between this case and the previous one is only whether the alternative history is presented as the actual past that everyone was mistaken about, or as a way things might have gone.

  Does this asymmetry have a name? The accounts of personal identity I've come across — ones that stress psychological continuity, ones that stress bodily or causal origins, ones that make identity a matter of which candidate best fits the description — all look like accounts of what identity consists in, and none of them obviously predicts that the truth-conditions for "same person" should shift with the mood of the question. So I'd want to know whether this is best handled as a distinction between what identity consists in and what one would be entitled to conclude if the facts turned out differently; whether there are established notions in the neighbourhood that it resembles and needs separating from (counterpart-style or best-candidate moves, the contrast between metaphysical and epistemic modality, something about the pragmatics of modal language); or whether the appearance is an artifact of how the two questions are posed. If nothing established fits, I'd like a term coined and defined tightly enough that I can tell which cases would be boundary cases, and told what kind of finding would show the asymmetry is real rather than merely rhetorical.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving into origin essentialism, specifically the idea that a person couldn't have come from different biological origins. They notice a pattern where people's intuitions about personal identity change based on whether they're considering hypothetical scenarios versus actual revealed truths. 

  First, I need to parse both halves of the asymmetry they described. The first part is about modal questions: what could have been different about you? People accept certain changes (like being a different sex or disabled) but reject others (like having different parents). The second part is about actual discoveries: when someone finds out their origins aren't what they thought, they still see themselves as the same person. 

  The user wants to know if this asymmetry has a name and how to categorize it. They mention existing theories—psychological continuity, bodily criteria, best-candidate theories—but note these don't explain the shift based on the question's mood. 

  Hmm. I recall Kripke's origin essentialism, which says you must originate from the same sperm and egg. But the user's examples show people don't strictly follow this in hypotheticals. For instance, being born disabled is okay, but different parents aren't. That suggests flexibility in modal judgments. 

  Then there's the actuality part: discovering switched-at-birth doesn't make someone think they're a different person. Here, the metaphysical fact (same biological origins) is fixed, but the narrative changes. The user points out the only difference is whether the alternative is presented as actual or possible. 

  So why the asymmetry? Maybe it's about epistemic access versus metaphysical reality. In hypotheticals, we might use counterpart theory—considering similar individuals in other worlds. But when faced with actual revelation, we stick to the biological facts. 

  The user also asks if this is a matter of truth-conditions shifting with the mood. That makes me think of the distinction between metaphysical and epistemic modality. In hypotheticals, people might conflate what's possible with what's conceivable, leading to inconsistent judgments. 

  Also, pragmatics play a role. When someone discovers their origins were different, the immediate concern is their sense of self, not metaphysical identity. They prioritize psychological continuity over biological origins in practice. 

  The user wants a term if none exists. "Epistemic anchoring" comes to mind—where actual origins ground identity, but hypotheticals allow flexibility. Or maybe "modal discrepancy in identity judgments." But they need a tight definition. 

  Boundary cases would be scenarios where the biological change is minor but identity is questioned, or vice versa. For example, if someone's biological parents are different but they were raised by the same people, does that challenge their identity? Testing this would require experiments comparing reactions to hypothetical vs. revealed scenarios. 

  To validate the asymmetry, studies could measure how people assign identity in different contexts. If judgments consistently vary based on the framing (actual vs. possible), that supports the asymmetry being real, not just rhetorical.
answer: |-
  This asymmetry you've described between **modal counterfactuals** (what *could* have been) and **actual retroactive discovery** (what *was*) in judgments about personal identity tied to origins is a profound and under-discussed observation. It doesn't have a single, universally accepted name, but it intersects with key concepts in metaphysics, epistemology, and philosophy of language. Here's how to carve it up:

  1.  **The Core Asymmetry:**
      *   **Modal Question ("Could I have...?"):** Judgments prioritize **causal origin essentialism** (Kripke). Changing the sperm/egg is deemed impossible for preserving identity, while significant non-origin changes (sex, disability, upbringing) are often deemed possible.
      *   **Retroactive Discovery Question ("Was I actually...?"):** Judgments prioritize **psychological continuity** and **bodily identity** over the *newly revealed* origin facts. Discovering different biological origins doesn't negate the existence of the person who lived the life; it only changes the narrative.

  2.  **Why Existing Identity Theories Struggle:**
      *   **Pure Origin Essentialism:** Predicts the modal judgment but *fails* the retroactive case. If origin is strictly necessary *and* sufficient, discovering different origins *should* imply a different person existed.
      *   **Pure Psychological Continuity:** Predicts the retroactive judgment (same person, same psychology/body) but struggles with the modal judgment rejecting changes in parents/country that arguably *would* drastically alter psychology.
      *   **Bodily Theories:** Similar to psychological theories for the retroactive case, but struggle with modal judgments about sex change or disability.
      *   **Best-Candidate Theories:** Could be stretched to fit both, but the *weighting* of criteria (origin vs. psychology/body) seems to shift dramatically based on the temporal perspective (future hypothetical vs. past actual).

  3.  **Explanatory Frameworks & Potential Names:**
      The asymmetry arises from the interplay of metaphysical constraints, epistemic limitations, and pragmatic/perspectival factors. Here are the key frameworks and candidate names:

      *   **Epistemic Anchoring vs. Metaphysical Constraint:** In the **retroactive discovery** case, the *actual lived life* (psychological continuity and bodily persistence) serves as an **epistemic anchor**. We *know* *this* person existed and lived *this* life. Discovering different origins doesn't erase that anchor; it just recontextualizes it. The origin essentialist claim is a **metaphysical constraint** on *which possible individuals* could have been *this* actual person. In the **modal question**, we are forced to confront this metaphysical constraint directly without a fixed anchor. We imagine possibilities constrained by origin.
          *   **Name Suggestion 1: The Epistemic Anchoring Asymmetry.** Highlights the anchoring role of the known life in retroactive discovery.
          *   **Name Suggestion 2: The Modal-Retroactive Disconnect in Identity Judgments.** Descriptive and neutral.
      *   **Counterpart Theory (Lewisian):** In the **modal question**, when asking "Could *I* have had different parents?", we implicitly search for a *counterpart* in another possible world who is sufficiently similar to us (in psychology, appearance, role) *but* has different parents. We often judge that no such sufficiently close counterpart exists ("that wouldn't be *me*"). For different sex/disability/upbringing, we find closer counterparts. In the **retroactive discovery** case, the question isn't modal. It's about *this actual world*. We have one clear, continuous individual (the body/psychology that lived from birth to now). Discovering different origins doesn't introduce a *different* candidate individual for being *that* person; it just gives us new information about *that* person's causal history. We aren't comparing counterparts; we're re-describing the history of the single salient entity.
          *   **Name Suggestion 3: The Counterpart-Salience Asymmetry.** Highlights the shift from counterpart comparison (modal) to singular entity description (retroactive).
      *   **Metaphysical Necessity vs. Epistemic Possibility / Pragmatics of "Person":** The modal judgment taps into intuitions about **metaphysical necessity** (what *must* be true for *this* entity to exist). The retroactive judgment taps into **epistemic possibility** (what *could* turn out to have been true about *this* known entity) and the **pragmatics** of how we use "person" and proper names. We track the same human being through time based on bodily/psychological continuity. Learning new facts about their origin doesn't break that tracking; it's just new information *about them*. The modal question forces us to consider the *essence* required for their existence *at all*.
          *   **Name Suggestion 4: The Essence-Tracking Asymmetry.** Highlights the tension between judgments about the essence required for existence (modal) and the criteria for tracking an entity over time (retroactive).

  4.  **Boundary Cases & Testing Reality:**
      To define the asymmetry tightly and distinguish it from rhetoric, consider these boundaries:
      *   **Boundary Case 1 (Minor Origin Change):** Suppose someone discovers that, due to a lab error, the *specific sperm* that fertilized the egg wasn't the one intended, but it was from the same father moments later (genetically nearly identical). Would this feel like the retroactive case ("still me") or trigger a modal-like "couldn't have been me" intuition? (Likely "still me" - supports the retroactive pattern).
      *   **Boundary Case 2 (Major Non-Origin Change):** Could someone discover they had a radical personality-altering brain implant at birth they knew nothing about? Would they still feel like "the same person"? (Likely yes, akin to retroactive discovery of origins, even though the psychological change might be vast).
      *   **Boundary Case 3 (Gradual Origin Shift):** Imagine a scenario where gametes are subtly altered over generations in a vat. Is there a point where discovering this makes someone doubt they are the same person? (Tests the limits of the retroactive resilience).
      *   **Testing Asymmetry Reality:** Conduct empirical studies presenting *matched pairs* of scenarios:
          *   **Scenario Pair A:** (1) *Modal:* "Could you have been born to parents X in country Y?" (2) *Retroactive:* "You discover at 40 you *were* born to parents X in country Y, switched at birth."
          *   **Measure:** Rate agreement with statements like "This would still be me" vs. "This would be someone else" on a scale.
          *   **Finding for Reality:** A *significant, consistent asymmetry* where the Retroactive scenario receives much higher "still me" ratings than the Modal scenario *for the same change* (e.g., different parents/country). Showing this asymmetry persists even when controlling for the magnitude of change and the nature of the change (origin vs. non-origin) would demonstrate it's not merely rhetorical but reflects a deep feature of how identity judgments function.

  **Conclusion:**

  The asymmetry you've identified is best understood as arising from the **different cognitive and linguistic tasks involved in evaluating hypothetical possibilities versus re-describing known actualities concerning a persistent entity.** In modal contexts, we grapple with **metaphysical essence** (origin essentialism) and implicitly use **counterpart comparison**. In retroactive contexts, we rely on **epistemic anchoring** via bodily/psychological continuity and the **pragmatics of reference tracking**.

  While terms like "Epistemic Anchoring Asymmetry" or "Counterpart-Salience Asymmetry" capture core aspects, the most precise descriptive label might be **The Origin Essence Modal-Retroactive Judgment Disconnect (OEMRJD)**. It explicitly names the key elements: Origin Essence, the Modal/Retroactive contexts, and the Disconnect in Judgments.

  This disconnect highlights that "personal identity" isn't a monolithic concept applied uniformly. It involves:
  1.  **Metaphysical Criteria for Existence:** What makes an individual *that* individual (origin essentialism).
  2.  **Epistemic/Pragmatic Criteria for Persistence:** How we track and refer to an entity through time and changing information (bodily/psychological continuity).
  The OEMRJD reveals that our intuitions about (1) dominate modal questions, while our practices of (2) dominate retroactive discovery, leading to the observed asymmetry. Empirical work along the lines suggested would be crucial to solidify its status as a genuine feature of cognition.
