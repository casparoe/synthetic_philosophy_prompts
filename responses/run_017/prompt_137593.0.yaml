prompt: |-
  I teach a first-year interdisciplinary module on rules, norms and coordination, and next term I want to run the fiction and the philosophy together rather than in separate weeks. The novel I keep returning to is Golding's *Lord of the Flies*, and the philosophical material is David Lewis's account of conventions as arbitrarily selected solutions to recurrent coordination problems — sustained not by agreement or enforcement as such, but by conformity together with the mutual and higher-order expectations that make conformity rational — plus the evolutionary and signalling-game models that later develop his framework. I have a draft reading in which the island is a laboratory for the rise and fall of such conventions, and I would like you to write a competing one that I can set against it, rather than a summary of either the novel or the theory.

  The things I most want you to work through, in terms of specific scenes and not just in general: First, the conch. Is it best described as a Lewisian convention at all, or as something else — a sanction-backed norm, an explicit agreement, or merely a useful device — and does it matter that it appears to do two separable jobs, convening assemblies and regulating who may speak within them, which may rise and fall independently? Second, the signal fire, which I have started calling a "beneficiary-blind" convention: the party for whose benefit it is maintained, a passing ship, never returns any feedback about whether the signal was received, so the maintenance of it rests on a benefit the maintainers never observe. Does the Lewisian or signalling-game machinery actually predict that such conventions should be especially fragile, and is that the failure Golding dramatises when the fire is allowed to go out? Third, Jack's strategy: my impression is that he rarely offers a competing focal point and instead engages in what I call "prominence-poisoning" — mockery of the assembly, the rival feast, the pig's head, the dance — that degrades the salience of the existing convention rather than competing with it on the coordination problem it solves. Lewis largely treats salience or prominence as an exogenous input; what would it take to model salience itself as something agents can strategically attack, and does the novel supply any resources for that? Fourth, the unravelling. I would like to claim that the breakdown is better described as a collapse of higher-order expectations — boys drifting away because of doubts about whether others will still turn up — than as a change in first-order preferences, but I am not confident that survives the ending, and I would like you to test that claim rather than adopt it.

  Finally, I need the reading to be honest about where the pairing fails, since I will be teaching it to students who will notice. Lewis's framework takes agents' preferences as given and asks how behaviour gets coordinated given them; much of what happens on the island looks more like a transformation of preference itself, and it is at least arguable that the rules the boys begin with were never endogenous conventions at all but imported habits of English school life, in which case treating their decay as a coordination failure would be a category mistake. There is also a mechanism the novel seems to propose for how new norms arise — mimesis and affective contagion in the painted faces, the chant and the dance — which is not quite the reinforcement learning or replicator dynamics of the evolutionary models, and I would like to know how much strain that puts on the framework. Please say plainly which scenes resist the reading, and end by saying what, if anything, the novel contributes to the philosophical debate that the argumentative literature does not. Assume I know the plot well, so no synopsis is needed, and please write in British English; around 1,200 words would be ideal.
reasoning: |-
  Okay, let me approach this query methodically. The user teaches an interdisciplinary module and wants a competing reading of Lord of the Flies against David Lewis's convention theory. They've outlined four specific analytical challenges: the conch's dual function, the signal fire's beneficiary-blind nature, Jack's "prominence-poisoning," and the unravelling mechanism. 

  First, I need to consider how Lewis's framework handles conventions as self-sustaining patterns based on mutual expectations. The conch presents an immediate puzzle - its assembly-convening and speech-regulating functions might operate as separate conventions. I recall Piggy's early conch proposal as explicit agreement rather than emergent solution, which already strains Lewis's model where conventions arise tacitly. 

  The signal fire's fragility interests me. Since passing ships provide no feedback, maintenance relies entirely on fragile higher-order expectations ("others expect me to expect them to tend it"). Lewis's models assume observable payoffs, so this blind convention would logically decay faster - which matches Golding's dramatization when hunters neglect duty.

  Jack's strategy seems more destructive than competitive. His mockery of assemblies and feasts attacks the salience of existing conventions rather than offering alternatives. Lewis treats salience as exogenous, but the novel shows how emotional contagion (painted faces, chants) can deliberately erode it. This suggests a gap in game-theoretic models.

  For the collapse, I'm skeptical about attributing it purely to preference changes. The fire-tending erosion shows how second-guessing others' commitment creates cascading defection - consistent with Lewis. But the finale's raw violence exceeds coordination failure, exposing the theory's limits in capturing preference transformation.

  Where the pairing clearly fails: the boys' initial "conventions" are colonial impositions (school uniforms, "Officer" fantasy), not emergent solutions. Their decay isn't coordination failure but rejection of artificial constraints. Also, Golding's norm-formation via ritualistic mimesis (the hunt-dance) differs radically from reinforcement learning models.

  Ultimately, the novel contributes what theory cannot: visceral demonstrations of expectation cascades, and the emotional substrates (shame, euphoria) that game theory abstracts away. But I must flag where blood-soaked climaxes defy rational choice assumptions.

  For structure, I'll open by framing the island as a coordination lab, then address each query point sequentially, conclude with theoretical limitations, and end on the novel's unique value. British English phrasing like "whilst" and "tyre swing" will be consistent throughout. The reading should run 1,200 words, avoiding plot summary per instructions.
answer: |-
  ## A Competing Reading: *Lord of the Flies* as a Laboratory for the *Limits* of Lewisian Conventions

  Your ambition to fuse Golding and Lewis is compelling, but my reading pushes back against the smooth application of Lewis's elegant framework to the island's descent. Whilst the novel *can* be seen as illustrating coordination problems, its true power lies in exposing the fragility of Lewisian conventions when confronted with raw human drives, the absence of foundational norms, and the strategic manipulation of salience itself. The island isn't just a lab for conventions rising and falling; it's a pressure cooker testing their very foundations against forces Lewis largely brackets.

  **1. The Conch: A Flawed Foundation, Not a Pure Convention**
  The conch is immediately problematic for a Lewisian reading. Its initial adoption isn't the tacit emergence Lewis describes. Piggy *explicitly* proposes it ("We can use this to call the others. Have a meeting. They’ll come when they hear us—"), leveraging Ralph's emergent authority. It functions less as a spontaneously discovered focal point solving a pure coordination problem ("How shall we decide who speaks?"), and more as an *imposed rule* backed by Piggy's rationale and Ralph's nascent leadership *sanction*. Crucially, its two functions are inherently unstable:
  *   **Convening Assemblies:** This relies on a shared *higher-order expectation* that others will respond to the blast *and* that attendance is expected/required. This decays as alternative attractions (hunting, swimming) gain prominence and Jack’s defiance erodes the expectation of universal compliance.
  *   **Regulating Speech:** This requires not just mutual expectation, but *ongoing enforcement* of the rule (Piggy’s constant reminders, Ralph’s interventions). When Jack declares "Bollocks to the rules!" and later physically attacks Piggy for holding the conch, it's revealed as a norm reliant on a weakening threat of sanction, not pure mutual expectation. Its shattering symbolises not just coordination failure, but the collapse of the *authority structure* it represented. It was always more than a convention; it was a totem of a failing social order.

  **2. The Signal Fire: Beyond Beneficiary-Blindness – The Problem of Unobserved Effort and Shifting Preferences**
  Labelling the fire "beneficiary-blind" is apt, but Lewisian/signalling-game models underplay the specific fragility here. These models typically assume the *cooperators* receive *some* feedback (e.g., mutual success, internal group cohesion). The fire's maintenance suffers a double whammy:
  *   **No Observed Benefit:** The hunters exert effort (collecting wood) for a benefit (rescue) they never witness. Crucially, they *also* receive no immediate internal social reward or observable group payoff for maintaining it *except* from Piggy/Ralph. Jack actively reframes the effort as pointless ("Rescue? Yes, of course! All the same, I’d like to catch a pig first").
  *   **Competing, Tangible Payoffs:** Hunting offers immediate, visceral rewards – meat, adrenaline, status within Jack's emerging hierarchy. The fire's hypothetical, distant payoff pales against this. Lewis takes preferences as given; Golding shows them *transforming*. The hunters' preference for the thrill of the hunt over the abstract hope of rescue isn't irrational within their new experiential context. The fire doesn't just fail due to coordination breakdown; it fails because the *payoff structure* sustaining the convention is obliterated by a more compelling alternative activity offering immediate gratification. Its neglect isn't merely a failure of expectation *about the fire*, but a shift in valuation *away* from the fire's purpose.

  **3. Jack's Strategy: Salience Poisoning and Affective Competition**
  Your term "prominence-poisoning" is excellent. Jack intuitively grasps that Lewisian salience isn't exogenous; it's vulnerable. His strategy is a masterclass in degrading existing focal points:
  *   **Mocking the Assembly:** His derision ("Bollocks to the rules!", "You're chief, Ralph. You remember everything.") actively erodes the seriousness and perceived value of the conch/meeting convention. He attacks the *meaning* of the focal point.
  *   **The Rival Feast:** This isn't just offering an alternative focal point for *eating*; it's a direct assault on the *values* underpinning Ralph's group. It offers immediate satiation, shared excitement, and belonging through participation in the hunt/dance – contrasting sharply with the perceived austerity and futility of maintaining the fire and rules. It leverages *affective contagion*.
  *   **The Dance & The Lord of the Flies:** These aren't attempts to solve a *coordination problem* Jack identifies. They create new, emotionally charged focal points for *belonging and catharsis* rooted in violence and primal fear. The painted faces dissolve individual identity and inhibition, facilitating a new kind of coordination based on shared hysteria rather than mutual expectation about solving a problem. Modelling this requires moving beyond rational choice to incorporate *emotional contagion* and the *transformative power of ritual*. Jack doesn't compete on the same problem set; he changes the game, making the old focal points seem irrelevant or weak.

  **4. The Unravelling: Expectation Collapse or Preference Revolution?**
  Your claim about higher-order expectation collapse holds significant water, particularly in the *middle phase*. The slow drift from the shelters and fire is driven by boys like Maurice and Roger, not initially by bloodlust, but by a waning belief that *others* are committed. Why build shelters if no one else will? Why tend the fire if the hunters won't? This cascading doubt – "I won't because I doubt you will, and you won't because you doubt I will" – is quintessentially Lewisian.

  However, the *final unravelling* transcends this. By the time of Piggy's murder and the manhunt for Ralph:
  *   **Preferences are Transformed:** Many boys actively *prefer* the hunt, the tribe, the freedom from restraint. Roger's descent into sadism isn't about coordination failure; it's about the removal of inhibition and the embrace of a new preference structure.
  *   **Mechanism Shift:** The initial drift *is* expectation-based. The final collapse is driven by *fear* (of the beast, of Jack's tyranny), *coercion* (Samneric’s capture), and the *positive allure* of Jack's tribe offering safety, meat, and powerful group identity. Higher-order expectations about the *old* rules are irrelevant; expectations now centre on Jack's power and the consequences of defiance. The framework struggles with this shift from mutual expectation to coercion and transformed desire.

  **Where the Pairing Fails (Honestly)**

  1.  **Exogenous Preferences vs. Endogenous Transformation:** Lewis's core limitation is stark. The boys' preferences *radically transform*. The shift from wanting rescue to wanting meat, power, and cathartic release isn't a parameter within the model; it's the central drama. Game theory struggles with preference formation and change, especially when driven by visceral experience and group dynamics.
  2.  **The Initial "Conventions" Were Never Endogenous:** You're right. The conch rule, the idea of meetings, even the initial deference to Ralph (uniform, trumpet) are desperate imports from a vanished civilisation. Their decay isn't primarily a failure of *coordination* on the island, but the shedding of externally imposed habits unsuited to the new environment and lacking deep roots. Calling their failure a "coordination problem" risks misdiagnosis; it was a rejection of alien constraints.
  3.  **The Mechanism of New Norms:** Evolutionary models (replicator dynamics) rely on payoff-based replication. Golding proposes something more primal: *mimesis and affective contagion*. The painted faces aren't a payoff calculation; they induce a psychological transformation through anonymity and shared ritual ("The mask compelled them"). The chant ("Kill the beast! Cut his throat! Spill his blood!") spreads and intensifies not through rational imitation of success, but through rhythmic repetition and shared emotional escalation. This is Girard, not Maynard Smith. Lewis's framework simply doesn't have the tools for this.
  4.  **The Ending:** The naval officer's arrival brutally highlights the artificiality of applying Lewis to the island. The boys' descent into savagery isn't resolved by finding a new focal point; it's interrupted by an external authority representing the very civilisation whose vestigial "conventions" collapsed. The final scenes resist a neat game-theoretic reading – they are about the inherent darkness revealed when civilisation's thin veneer is stripped away, not about alternative equilibria.

  **What the Novel Contributes: Beyond the Argumentative Literature**

  Lewis provides abstract models of *how* conventions work given stable preferences and common knowledge. *Lord of the Flies* provides a terrifyingly concrete exploration of *why* they fail under pressure:

  1.  **The Visceral Cost of Expectation Collapse:** It dramatises the *emotional and social* cascade – the fear, the doubt, the slow isolation – when higher-order expectations unravel. Theory speaks of equilibria; the novel shows the human anxiety and alienation in the disequilibrium.
  2.  **The Vulnerability of Salience:** It demonstrates that salience isn't just given; it's contested territory. Agents *can* strategically poison existing focal points through mockery, offering affectively superior alternatives, and eroding shared meaning. Jack is a master strategist of salience destruction.
  3.  **The Role of Affect and Ritual:** It insists that new norms, especially destructive ones, can arise through mechanisms utterly alien to reinforcement learning: through shared fear, mimetic desire, ritualistic action, and the dissolution of individual identity in the group. The birth of the tribe's savage norms is a process Lewisian theory cannot capture.
  4.  **The Primacy of Foundational Consensus:** The novel suggests Lewisian conventions require a minimal shared foundation – a basic agreement on what constitutes a "problem" worth coordinating around (e.g., rescue vs. hunting). When that fundamental consensus fragments, as it does between Ralph and Jack, conventions built upon it are doomed, regardless of mutual expectations about the rules themselves.

  In essence, *Lord of the Flies* doesn't just illustrate Lewis; it *stress-tests* him, revealing the grim realities his models abstract away: the malleability of human desire, the power of raw emotion over rational expectation, and the terrifying speed with which civilisation's coordinating structures can crumble when the deeper, unspoken consensus fractures. It provides the dark, necessary counterpoint to the theory's rationalist optimism.
