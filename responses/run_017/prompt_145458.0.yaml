     Alice and Bob are identical except in name.  
     - **Distribution A**: Alice gets 10 welfare, Bob gets 0.  
     - **Distribution B**: Alice gets 0, Bob gets 10.  
     → *Choose one*:  
     - **A and B are equally good** → Node 2.  
     - **A is better than B** (or vice versa) → **Leaf A: Weighted Utilitarianism (blank cheque)**. Weights are free parameters (interpersonal comparability). The theorem doesn’t fix weights, so you need a separate theory to set them.  

  2. **Node 2: Equality vs. total under certainty**  
     - **Distribution C**: Alice 10, Bob 0.  
     - **Distribution D**: Alice 5, Bob 5.  
     → *Choose one*:  
     - **D is better than C** (equality improves things) → Node 3.  
     - **C and D are equally good** (total welfare unchanged) → Node 4.  
     - **C is better than D** (rare) → **Leaf B: Anti-egalitarian view**. Rejected by most; incoherent with minimal fairness.  

  3. **Node 3: Why is D better than C?**  
