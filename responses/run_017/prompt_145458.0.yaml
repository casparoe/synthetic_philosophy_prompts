  - **Defensible?**  
    - **Inconsistency**: Your person prefers (5,5) > (10,0) under certainty (prioritizing worse off), but in Node 8, treats the lottery (which has the same expected welfare as (5,5)) as equally good. Total/average utilitarianism would be indifferent between (5,5) and (10,0) since total welfare is 10. This is a contradiction.  
    - **Resolution**: They must either:  
