  Now, for the condition that adding a voter above 0.5 can make the group worse: 
  This happens when the existing voters include some below 0.5. For example, suppose we have a group of 2 voters: one with p=1.0 (always correct) and one with p=0.0 (always wrong). Then the majority vote: they always split, so we need a tie-breaker. But if we add a third voter with p=0.6, then the group might be wrong if the always wrong and the new voter are wrong (which happens with probability 0.4) and the always correct is correct. Then the vote: two wrong and one correct -> majority wrong. So the group is wrong with probability 0.4.

