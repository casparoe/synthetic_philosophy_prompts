  Below is a complete, runnable 90-minute session plan for your undergraduate module on collective decision making. It prioritizes minimal prep, student-driven discovery, and visceral understanding of the Condorcet jury theorem's assumptions without naming it until debrief. The design uses dice-based card generation (no spreadsheets needed) and focuses on the core insight: group accuracy depends on **individual competence >0.5** and **signal independence**.

  ---

  ### **Prep Checklist** (45–60 minutes)
  1. **Materials**:
     - 108 blank index cards (6 rounds × 3 trials × 6 cards/trial, plus extras)
     - 6 standard dice (d6)
     - Markers (red/blue or ✓/✗ for signals)
     - 18 small envelopes (one per student)
     - Scoreboard (whiteboard or poster)
     - Timer
     - Prize for winning team (e.g., chocolates)

  2. **Card Generation** (30 mins):
     - Pre-generate **signal cards** using dice rolls (see recipes below).  
     - Label envelopes: "Baseline," "Flip," etc.  
     - Sort cards into envelopes by round/trial (students get same envelope all session).

  3. **Room Layout**:  
     - **U-shaped table** (facilitates quick card distribution).  
     - Scoreboard visible to all.  
     - Two teams of 9 (for competition).

  ---

  ### **Signal Generation Recipes**  
  *Key: All dice are d6. "Truth" = Guilty (G) or Innocent (I), randomized per trial. Signals are "vote suggestions" (G/I).  
  **No student sees formulas—only their card's signal.***

  #### **Round 1: Baseline (Independent, p=0.6)**
    - **Truth**: Roll die. **1–3: Guilty, 4–6: Innocent** (P=0.5).  
    - **Per-voter signal**: Roll die.  
      - If truth=G: **1–4: G, 5–6: I** (P(correct)=4/6≈0.67; *adjust to 0.6*).  
      - *Adjustment*: Re-roll 6s once. **1–4: G, 5: I, 6: re-roll → 1–3: G, 4–6: I**.  
      - Final P(correct) = (4/6) + (1/6)×(3/6) = 0.67×0.83 ≈ 0.6.  
    - *Why it works*: Re-rolling 6s dilutes accuracy from 0.67 to 0.6. Marginal P(correct)=0.6, independent.

  #### **Round 4: Hidden Correlation (p=0.6, correlated)**
    - **Truth**: Roll die. **1–3: G, 4–6: I**.  
    - **Common source**: Roll die. **1–4: Matches truth, 5–6: Opposite** (P(correct)=4/6≈0.67).  
    - **Per-voter signal**: Roll die.  
      - **1–5: Copy common source** (P=5/6≈0.83).  
      - **6: Independent signal** (roll again: **1–4 match truth, 5–6 opposite**; P(correct)=4/6≈0.67).  
    - *Marginal P(correct)* = (5/6)×(4/6) + (1/6)×(4/6) = 20/36 + 4/36 = 24/36 = 0.6.  
    - *Correlation*: 83% chance all copy same (possibly wrong) source. Group accuracy ≈ P(common source correct) = 0.67.

  #### **Other Rounds** (simpler recipes):  
    - **Round 2 (Flip, p=0.45)**: Identical to Round 1 but invert signals: **1–3: Incorrect, 4–6: Correct**.  
    - **Round 3 (Cascade)**: Expert (1 voter) gets p=0.7 signal: **1–5: Correct, 6: Incorrect**. Others: Round 1 signals.  
    - **Round 5 (Unequal weights)**: 3 "experts" get p=0.8: **1–5: Correct, 6: Incorrect**. Others: Round 1 signals.  
    - **Round 6 (Asymmetric costs)**: Identical to Round 1.

  ---

  ### **Minimal Facilitator Script**  
  *Total words: <500. Focus on rules, not concepts.*

  #### **Intro (0–5 min)**:  
  > "We’re simulating jury decisions. Each round, a defendant is guilty or innocent (50/50 chance). You’ll get a private card suggesting 'guilty' or 'innocent'. Vote by secret ballot. Group decision = majority vote. **Two teams compete for accuracy.** After all rounds, we’ll discuss. Rules:  
  > 1. Do NOT show/share cards.  
  > 2. Vote ONLY based on your card.  
  > 3. Truth revealed after *all* votes.  
  > First team to 5 correct verdicts wins. Begin."

  #### **Per Round (1–5 min/trial)**:  
  1. **Distribute** envelopes (students open *only* current round’s trial card).  
  2. **Start timer** (45 sec/trial): "Cards out. Vote now—write G or I."  
  3. **Collect votes**, tally on board.  
  4. **Reveal truth**: "Truth was [G/I]. Team A correct? [✓/✗]."  
  5. **Update scoreboard**.  

  #### **Transition Between Rounds (1 min)**:  
  > "Next round: same process. Envelopes ready? Go."

  #### **Critical Wording for Rounds**:  
  - **Round 3 (Cascade)**: "Before voting, the expert (volunteer?) announces their card. *Then* vote."  
  - **Round 6 (Asymmetric)**: "New rule: Wrongly convicting innocent costs 3 points. Acquitting guilty costs 1. Minimize penalties."

  ---

  ### **Timeline** (90 min)  
  | **Time** | **Activity**                     | **Details**                                                                 |
  |----------|----------------------------------|-----------------------------------------------------------------------------|
  | 0–5      | Intro + Teams                    | Split into Team A/B (9 each). Explain rules.                                |
  | 5–20     | **Round 1: Baseline** (3 trials) | 15 voters (7–8 per team + observer). p=0.6 independent. *Expected: ~2–3 correct*. |
  | 20–30    | **Round 2: The Flip** (3 trials) | Team A: 3 voters (p=0.45). Team B: 15 voters (p=0.45). *Expected: Small group > large group*. |
  | 30–40    | **Round 3: Cascade** (3 trials)  | Expert (p=0.7) announces first → others vote (p=0.6). *Expected accuracy drops to ~70%*. |
  | 40–50    | **Round 4: Hidden Correlation** (3 trials) | Identical to Round 1 (p=0.6) but correlated. *Expected: ~1–2 correct (vs. 2–3 in R1)*. |
  | 50–60    | **Round 5: Unequal Weights** (3 trials) | 3 experts (p=0.8), 12 others (p=0.6). *Expected accuracy ~90%*.          |
  | 60–70    | **Round 6: Asymmetric Costs** (2 trials) | Same as R1, but penalties applied. *Cut if short*.                         |
  | 70–75    | **Transition**                   | Tally team scores. Announce winner. Distribute prize.                       |
  | 75–90    | **Debrief**                      | Guide reflection → map to theorem (see below).                              |

  ---

  ### **Payoff Scheme**  
  - **Teams**: 1 point per correct *group verdict*. Winning team gets prize.  
  - **Round 6**: Points = penalties (acquit guilty: -1; convict innocent: -3). Minimize losses.  

  ---

  ### **Debrief Script** (15 min)  
  > "In Round 1, 15 of you at 60% correct achieved ~75% accuracy. But in Round 4, same individual accuracy led to ~60% group accuracy. Why?"  
  *Elicit hypotheses: "Signals were linked?" → Confirm: "Yes, hidden correlation broke independence."*  

  > "In Round 2, adding voters *lowered* accuracy. Why?"  
  *Elicit: "Voters were worse than coin tosses (p<0.5)."*  

  > "In Round 3, why did the group often follow the expert?"  
  *Elicit: "Cascade—signals weren’t independent after the announcement."*  

  > "In Round 5, accuracy jumped. Why?"  
  *Elicit: "Stronger signals improved average competence."*  

  > "In Round 6, did majority rule feel fair with asymmetric costs?"  
  *Elicit: "No—convicting requires stronger evidence."*  

  **Map to Condorcet Jury Theorem**:  
  | **Round** | **Broken Assumption**             | **Theorem Insight**                                  |
  |-----------|-----------------------------------|------------------------------------------------------|
  | 1         | None (baseline)                   | p>0.5 + independence → group accuracy > individual. |
  | 2         | Competence >0.5                   | If p<0.5, more voters *worsen* accuracy.            |
  | 3         | Independence                       | Cascades break independence → group = one signal.    |
  | 4         | Independence                       | Correlation → group accuracy ≈ competence of common source. |
  | 5         | Equal weight (but theorem allows competence heterogeneity) | Higher competence voters boost group accuracy.       |
  | 6         | Symmetric errors                  | Asymmetric costs → majority rule suboptimal.         |

  **Final Point**: "Group accuracy isn’t about headcount. It hinges on two pillars: each voter >50% accurate, and signals independent. Break either, and the crowd gets *less* wise."

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Noise masks effects** (e.g., R1 group accuracy = 1/3 due to bad luck):  
     - *Fix*: Emphasize trends over single trials. Use team scores (3 trials/round). Say: "Math says 75% long-run—today we see noise."  

  2. **Meta-gaming**: Student calculates p=0.6, votes opposite.  
     - *Fix*: Rules prohibit card-sharing. Remind: "Vote *only* on your card. No second-guessing."  

  3. **Dominating discussion**:  
     - *Fix*: No discussion! Secret ballots. 45-sec timer.  

  4. **Card-trading**:  
     - *Fix*: Envelopes prevent peeking. Penalize teams for sharing.  

  5. **Correlation spotted early**:  
     - *Fix*: In R4, cards *look* independent (common source hidden). Reveal only after voting.  

  ---

  ### **What the Game Cannot Reproduce**  
  - **Asymptotics** (1000-voter accuracy →100%):  
    - *Honest workaround*: Post-session, show a **simulation** (Python/Excel) of 100 voters. *Do not* run live—it cheapens the experiential lesson. Say: "With infinite independent voters >50% accurate, group accuracy approaches 100%. But our game shows why real groups fail: competence or independence breaks."  

  - **Non-binary states**:  
    - *Acceptance*: Simplified for time. Mention in debrief: "Real decisions have nuance—this is a foundational model."

  ---

  This design ensures students *feel* the theorem’s assumptions through failure modes, using only dice, cards, and competition. Prep focuses on card generation (dice rolls → 60 mins), and gameplay minimizes lecturing. Run it as a "trial lab," and let confusion drive curiosity.
