  - L(acquit | guilty) = 2
  - L(convict | guilty) = 0, L(acquit | innocent)=0.

  Then the optimal decision rule is to convict if the posterior probability of guilty is greater than (0*?).

  The expected loss of convicting: 10 * P(innocent|data)
  The expected loss of acquitting: 2 * P(guilty|data)

  So convict if 10 * P(innocent|data) < 2 * P(guilty|data)
  => 10 * (1-p) < 2 * p   [where p = P(guilty|data)]
  => 10 - 10p < 2p
  => 10 < 12p
  => p > 10/12 = 5/6.

  So we need a posterior probability of guilty > 5/6 to convict.

  In the case of a single signal, if a voter gets a "guilty" signal, then:
  P(guilty|signal) = P(signal|guilty)*P(guilty)/P(signal) = 0.6 * 0.5 / (0.6*0.5+0.4*0.5) = 0.6/ (0.6+0.4)=0.6.

  So 0.6 < 5/6≈0.833, so even with a guilty signal, we should acquit.

  This is a bit extreme.

  Alternatively, set the cost of convicting an innocent to 5, and acquitting a guilty to 1.

  Then convict if: 5 * P(innocent|data) < 1 * P(guilty|data)
