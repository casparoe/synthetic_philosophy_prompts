  If the bloc is wrong, they contribute 0 for the truth (or 5 for the wrong). Then we need at least 10 out of the 14 to be correct to reach 10 votes for the truth. This is less likely.

  So group accuracy = 0.8 * P(X>=5) [X~Bin(14,0.6)] + 0.2 * P(X>=10) [X~Bin(14,0.6)]

  P(X>=5) for Bin(14,0.6) is almost 1 (since expected 8.4).

  P(X>=10) for Bin(14,0.6) = 1 - P(X<=9) = 1 - binomcdf(14,0.6,9) ≈ 0.66 (by an online calculator: 0.660).

  So group accuracy = 0.8*1 + 0.2*0.66 = 0.8 + 0.132 = 0.932.

  Which is higher than the baseline 78.7%.

  Now, for the asymmetric costs round: 
  We want to show that majority rule is not optimal if the costs are asymmetric.

  We can set up: 
  - The group is deciding whether to convict a defendant.
  - If they convict an innocent, the cost is high (say, -10 points).
  - If they acquit a guilty, the cost is moderate (say, -2 points).
