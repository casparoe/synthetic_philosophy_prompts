prompt: |-
  Hey — I'm a science-and-ideas journalist working on a piece about how often the doing-vs-allowing distinction is quietly doing all the load-bearing work in policy arguments, and I keep tying myself in knots trying to explain to my editor why anyone finds it slippery. The surface version is easy enough: unplugging someone's ventilator gets filed under letting die, injecting them gets filed under killing, and everyone from hospital ethics committees to people arguing about whether releasing an unrestrained AI system counts as causing harm or merely failing to help leans on that contrast. What I need from you is the deeper story about why it's so hard to say what the distinction even consists in. Every cash-out I try seems to break: it can't just be movement vs. stillness, since unplugging is a movement; it can't just be counterfactual dependence, since in both cases the person dies when they do because of what I chose; and the popular move of asking whether I made them worse off than they would otherwise have been gives verdicts that flip depending on who else happens to be in the room.

  Two specific things I keep getting stuck on, and I'd like you to walk me through them. First, that third-party sensitivity: it looks like whether my inaction counts as letting die or as something more like killing depends on whether some other agent was poised to step in and didn't, which is a fact about them and not about me. So what is the distinction actually tracking if the baseline shifts like that — is there a version of it that survives once you let the background vary, or does it only look robust because we implicitly hold the surroundings fixed? Second, a friend of mine who works adjacent to moral psychology has a pet theory I want stress-tested: she says the distinction is really an evidential and coordination device rather than a moral one. Actions are public, datable, easy to attribute to an agent; omissions are murky, and there is an infinite number of things nobody did, so we need a bright line to decide whose behaviour to monitor, sanction, and plan around. On her view the intuition that killing is worse than letting die is just this bookkeeping convenience leaking into moral judgement, and there's nothing left over once you see that. It feels too quick to me, but I can't put my finger on where it goes wrong.

  Can you explain the shape of this problem in a way I could paraphrase for a smart general reader — the failure of the causal and baseline accounts, what a non-causal account would have to look like, and a verdict on my friend's debunking story? Please use one concrete worked example you build yourself rather than the famous ones everybody recycles, and skip citations and reading lists entirely; I want the machinery, not the literature.
reasoning: |-
  Okay, let's start by understanding the journalist's request. They're working on a piece about the doing-vs-allowing distinction in policy arguments and why it's slippery. The surface examples are clear—unplugging a ventilator vs. injecting poison—but deeper explanations keep failing. The journalist is stuck on two points: third-party sensitivity affecting the baseline, and a friend's theory that the distinction is merely an evidential tool for coordination.

  First, I need to unpack why causal and counterfactual accounts fail. The journalist mentioned movement vs. stillness doesn't work because unplugging involves movement. Counterfactual dependence is tricky because both actions and omissions result in death due to the agent's choice. The baseline problem shows that "worse off" depends on what others might have done, making the distinction context-dependent. 

  For the third-party sensitivity, the key is how baselines shift. Using the lifeguard example: if no other lifeguard is present, not saving is allowing harm. But if another lifeguard fails to act first, the second lifeguard's inaction might be seen as causing harm. The baseline isn't fixed; it depends on social roles and expectations. This suggests the distinction relies on normative expectations, not just causality.

  Next, the friend's evidential theory. The idea is that actions are clear, datable events, while omissions are ambiguous. We need a bright line to assign responsibility for coordination. But this might reduce moral intuition to practicality. The counterexample here is private actions vs. public omissions. If someone secretly swaps pills, it's causing harm but not public. Conversely, not helping in public view is an omission but highly visible. So visibility isn't the core factor. The moral difference persists even when evidence is equal, suggesting something beyond practicality.

  To explain for a general reader, I'll need a fresh example. The flooded house scenario works: turning off a pump (action) vs. not starting it (omission). The baseline issue arises when considering if the neighbor was supposed to act. The friend's theory is challenged when comparing a hidden action (sabotage) to a visible omission (ignoring the alarm). Even if both are equally observable, the action feels morally worse, pointing to an intrinsic difference.

  The deeper structure involves control over harm. Actions directly introduce causes, while omissions allow existing causes to proceed. This fits the pump example: turning it off introduces a new cause (the switch), whereas not starting it leaves the rain as the cause. But the neighbor's role complicates it, showing that obligations affect whether we see the cause as the agent or the existing situation.

  The journalist needs a clear takeaway: the distinction is partly causal (direct vs. indirect), partly normative (roles and obligations), and not entirely reducible to evidence. The friend's theory explains social functions but doesn't eliminate the moral dimension. The machinery hinges on how we attribute causal responsibility against a backdrop of expectations.
answer: |-
  Here's the deep structure of the doing-allowing distinction, stripped down for your reader, with a fresh example and no academic baggage. The core problem is that the distinction pretends to be about **causal metaphysics** ("What did I *do* to the world?") but secretly depends on **normative expectations** ("What was I *supposed* to do in this situation?"). Let's break it.

  ### The Failure of Simple Accounts (Why Knots Happen)
  1.  **Movement vs. Stillness?** Fails instantly. Flipping a switch to stop a life-saving machine (movement) is "allowing to die," while freezing and doing nothing as a landslide crushes someone (stillness) feels like "not preventing" but not "killing."
  2.  **Counterfactual Dependence?** ("Would they have died/done better without me?") Fails because *both* doing and allowing often satisfy it. Inject poison? They die because of you. *Don't* throw a life-ring? They die because of you. The dependence exists in both cases.
  3.  **The "Worse Off" Baseline?** This is where third-party sensitivity wrecks it. The baseline ("how they would otherwise have been") is **parasitic on social roles and obligations.**

  **Your Concrete Example: The Flooded Basement**
  *   **Scenario:** A massive storm hits. Water is rapidly rising in your neighbor's basement. They're away. Their sump pump is off. If it runs, the basement stays dry. If not, it floods, ruining priceless family heirlooms.
  *   **Version A (Baseline Sensitivity):** You walk by, see the off pump and rising water. You do nothing. Basement floods. **Intuition:** You *allowed* the flood. You "merely" failed to help. The primary cause is the *storm*.
  *   **Version B (Third-Party Shifts Baseline):** Now imagine you *are* the neighbor's hired house-sitter. It's your explicit job to check the pump during storms. You walk by, see the off pump and rising water. You do nothing. Basement floods. **Intuition:** This feels *closer* to *causing* the flood, or at least gross negligence tantamount to causing harm. Why? Because the baseline "how they would otherwise have been" *includes your expected intervention*. Without you (or a competent sitter), the basement floods naturally. With you *doing your job*, it stays dry. By failing your role, you made them worse off *relative to the baseline state where their hired protection worked*. The storm is still the cause, but *your inaction* becomes the salient reason the protection failed.
  *   **Why This Matters:** The distinction between "causing" (doing) and "allowing" (failing to prevent) **isn't a fixed property of your physical act.** It depends on background expectations: *Were you supposed to be the one maintaining the protective barrier?* If yes, your omission drags you closer to the "causing" pole. The baseline isn't "state of nature," it's "state of expected responsibility." This is why policy arguments get slippery – the "expected responsibility" (e.g., governments regulating AI, doctors maintaining life support) is exactly what's being debated!

  ### What's Left? A Non-Causal Core
  If causal/metaphysical accounts fail, what anchors the distinction? **Agency and Normative Structure:**
  *   **Doing (Causing Harm):** You **introduce a new, active threat** or **remove an existing protection** against a background threat. You *initiate* or *accelerate* the harmful sequence. (e.g., *Turning off* the neighbor's working sump pump during the storm).
  *   **Allowing (Letting Harm Happen):** You **fail to interfere** with an **already operative threat** or **fail to provide an expected protection**. The harmful sequence proceeds *on its own momentum*; you didn't start it or actively dismantle a shield against it. (e.g., *Not turning on* the off pump).
  *   **The Role of Norms:** What counts as an "existing protection" or "expected intervention" is defined by social roles, contracts, and shared understandings. The house-sitter *was* part of the expected protection scheme. A random passerby wasn't. The doctor maintaining the ventilator *is* part of the patient's protective system. Unplugging it removes that protection. Not inventing a cure isn't removing protection; no protection existed yet.

  ### Stress-Testing Your Friend's Evidential Theory
  Your friend's idea has real insight but overreaches.

  *   **The Insight:** Actions *are* often clearer markers for attribution and coordination. A specific act (injecting poison) is a discrete, identifiable event. Omissions (not donating to famine relief) are vague – which of the infinite things I didn't do count? Drawing a bright line ("only intervene if you *started* the threat or *removed protection*") *is* pragmatically useful for social coordination, assigning blame, and focusing resources. This *does* leak into moral intuitions.
  *   **Where It Goes Wrong:** It conflates the *epistemic/social function* of the distinction with its *moral foundation*. We can imagine scenarios where the evidential clarity is flipped, but the moral distinction remains:
      *   **Hidden Action:** You secretly sabotage the neighbor's pump days before the storm. The flooding looks "natural." Your act is causally potent but *not* public/datable. **Verdict:** Still clearly "doing harm" (causing), morally worse than the house-sitter's omission, even though the omission was more observable.
      *   **Blatant Omission:** As the house-sitter, you stand in the neighbor's window, make eye contact with them as they return, point at the off pump and rising water, and shrug. Utterly public, datable, attributable. **Verdict:** Feels *worse* than a hidden omission, perhaps like a taunting *affirmation* of harm, but is it *morally equivalent* to actively smashing the heirlooms yourself? Most would say no – the core distinction (introducing threat vs. failing to stop existing threat) still holds weight *even when evidence is equal*.
  *   **The Verdict:** Your friend identifies a crucial *social amplifier* and *practical heuristic* for the doing/allowing distinction. But it doesn't fully *debunk* the moral intuition. The core distinction tracks something real about **how an agent's will interfaces with existing causal chains** (introducing/interrupting vs. permitting/ignoring). The moral weight difference might be *less* absolute than common sense suggests, but it likely isn't *only* an artifact of bookkeeping. The normative expectations (like the house-sitter's role) feed *into* the moral evaluation itself, not just the evidence.

  ### The Shape of the Problem for Your Reader
  > "Think of the difference between pushing someone into a river (doing harm) and not throwing a lifebuoy to someone already drowning (allowing harm). Simple, right? But dig deeper, and it gets murky. Why is unplugging a ventilator 'allowing to die,' but injecting poison 'killing'? Both involve movement, and both result in death because of a choice.
  >
  > The trouble is this: **Whether we call something 'doing' or 'allowing' depends heavily on hidden background expectations about who was supposed to prevent the harm.** Imagine your neighbor's basement is flooding during a storm because their pump is off. If you just walk by and do nothing, you've 'allowed' it; the storm caused it. But if you were *paid* to watch their house, your inaction feels more like *causing* the damage. The 'baseline' shifted because of your job.
  >
  > This makes policy debates slippery. Is a company 'harming' people by releasing a risky AI, or just 'failing to prevent' harm others might cause with it? The answer depends on whether we see that company as having a duty to be a guardrail.
  >
  > Some argue this distinction is just a practical tool – 'doing' is easy to spot and blame, 'allowing' is fuzzy. There's truth here: we need clear lines for accountability. But it doesn't erase the core difference: **Actively creating a new danger feels different, morally, than failing to stop an existing one, even when the outcome is the same.** The first forces harm into the world; the second lets harm take its course. Policy arguments often turn on which frame fits the situation – and whose responsibility we think it is to build the guardrails in the first place."

  The machinery hinges on this: The doing-allowing distinction isn't a fundamental physical law. It's a **normatively loaded lens** for interpreting an agent's relationship to a harmful outcome within a web of expectations. It breaks when we ignore that web, which is precisely why it's both indispensable and endlessly contested in policy.
