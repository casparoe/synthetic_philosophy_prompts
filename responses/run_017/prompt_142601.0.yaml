  ### Sensitivity Analysis  
  **1. Exponent in welfare-resource relation:**  
  Assume \( w = 100 \times \left( \frac{1000}{N} \right)^a \) (original: \( a=0.5 \)).  
  - **Linear (\( a=1 \)):** Welfare \( w = 100 \times \frac{1000}{N} \). Total welfare \( T = N \times w = 100,000 \) (constant). Totalism is indifferent to all expansions, so it does not endorse every step. The repugnant path collapses.  
  - **\( a=1.2 \):** Welfare \( w = 100 \times \left( \frac{1000}{N} \right)^{1.2} \). Welfare drops faster. Max growth rate \( \approx 9.15\% \), but total welfare *decreases* with expansion (e.g., \( T_1 < T_0 \)). Totalism rejects the first step.  

  **Conclusion:** The diminishing-returns exponent (\( a<1 \)) is essential. It ensures total welfare increases with expansion, enabling Totalism to endorse each step.  

  **2. Hard decency floor instead of percentage cap:**  
  Suppose a floor \( w \geq 50 \) is imposed (no welfare below 50). The sequence stops at \( N=1,523 \) (\( w=81.04 \)) or \( N=1,880 \) (\( w=72.93 \)), unable to reach \( w \leq 10 \). The repugnant conclusion is avoided, but at the cost of inflexibility (no expansion beyond a small multiple of \( N_0 \)).  

  **3. Defending Totalism:**  
  The strongest defense: The endpoint is not repugnant because all lives are worth living (\( w_{22}=9.86>0 \)), and total welfare is higher. If "repugnance" stems from aesthetic bias or status-quo bias, Totalism's verdict is consistent and ethical: more good lives are better, even if each is modest. This shifts the debate to whether non-specialist intuitions are reliable.  

