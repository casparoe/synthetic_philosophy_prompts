  ### Population Ethics Case: The Generation Ship and the Repugnant Conclusion  
  **Setting:** A generation ship with a fixed resource budget \( R = 1000 \) (normalized units). Per-person welfare \( w \) is given by \( w = 100 \times \sqrt{\frac{1000}{N}} \), where \( N \) is the crew size. The founding crew has \( N_0 = 1000 \) and \( w_0 = 100 \) (welfare units, where 0 is a life barely worth living). Each generation may vote to expand the crew size by at most 25% (engineering cap), but the charter forbids any decision that reduces an existing member's welfare by more than 10% (charter cap). Every life (existing and new) must be worth living (\( w > 0 \)). We seek a sequence of expansions to a population \(\geq 50,000\) with per-person welfare \(\leq 10\).

  #### Key Constraints and Growth Rate
  - **Welfare constraint:** For a step from \( N \) to \( N' \), \( w' \geq 0.9w \).  
    Substituting \( w = 100 \times \sqrt{\frac{1000}{N}} \) and \( w' = 100 \times \sqrt{\frac{1000}{N'}} \):  
    \[
    \sqrt{\frac{N}{N'}} \geq 0.9 \implies \frac{N}{N'} \geq 0.81 \implies N' \leq \frac{N}{0.81} \approx 1.23457N
    \]  
    The charter cap limits growth to \(\leq 23.457\%\) per step.  
  - **Engineering cap:** Expansion \(\leq 25\%\), so \( N' \leq 1.25N\).  
  - **Binding constraint:** The welfare-derived cap (23.457%) is stricter than the engineering cap (25%). The largest permissible per-generation growth rate is **23.457%**, achieved by \( N' = \left\lfloor \frac{100}{81} N \right\rfloor \) (since \( \frac{100}{81} \approx 1.23457 \)).  
  - **Rounding:** \( N' \) is floored to an integer to ensure \( w' > 0.9w \) (since \( N' \leq \frac{100}{81}N \) implies \( w' > 0.9w \)).  

  #### Sequence of Expansions
  Start at \( t=0 \): \( N_0 = 1000 \), \( w_0 = 100.00 \).  
  Apply \( N_{t+1} = \left\lfloor \frac{100}{81} N_t \right\rfloor \) until \( N_t \geq 50,000 \) and \( w_t \leq 10 \).  
  Endpoint at \( t=22 \): \( N_{22} = 102,888 \), \( w_{22} = 9.86 \) (calculated as \( 100 \times \sqrt{\frac{1000}{102,888}} \)).  

  | Step \( t \) | Crew Size \( N_t \) | Welfare \( w_t \) | Notes |
  |-------------|---------------------|-------------------|-------|
  | 0           | 1,000              | 100.00           | Founding crew |
  | 1           | 1,234              | 90.02            | |
  | 2           | 1,523              | 81.04            | |
  | 3           | 1,880              | 72.93            | |
  | 4           | 2,320              | 65.66            | |
  | 5           | 2,864              | 59.09            | |
  | 6           | 3,535              | 53.19            | |
  | 7           | 4,364              | 47.86            | |
  | 8           | 5,387              | 43.08            | |
  | 9           | 6,650              | 38.78            | Critical-Levelism switch point (after this step) |
  | 10          | 8,209              | 34.90            | Critical-Levelism rejects transition from \( t=9 \) to \( t=10 \) |
  | 15          | 23,539             | 20.61            | Welfare drops below critical level (20) |
  | 20          | 67,506             | 12.17            | |
  | 21          | 83,340             | 10.95            | |
  | **22**      | **102,888**        | **9.86**         | **Endpoint: \( N_{22} \geq 50,000 \), \( w_{22} \leq 10 \)** |

  **Verification of constraints for all steps:**  
  - **Growth rate:** \( \frac{N_{t+1}}{N_t} \leq \frac{100}{81} \approx 1.23457 < 1.25 \) (within 25% cap).  
  - **Welfare drop:** \( \frac{w_t - w_{t+1}}{w_t} < 0.10 \) (e.g., \( t=0 \): \( \frac{100 - 90.02}{100} = 9.98\% \)).  
  - **Non-decreasing welfare for existing members:** False. Each expansion *reduces* welfare for existing members (by design, to maximize growth).  
  - **Lives worth living:** \( w_t > 0 \) for all \( t \).  

  ---

  ### Ethical Evaluation  
  **Theories:**  
  1. **Totalism:** Rank by sum of welfare \( T = \sum w_i = N \times w \).  
  2. **Averagism:** Rank by mean welfare \( \overline{w} = w \) (since all have same \( w \)).  
  3. **Critical-Levelism (CL):** Rank by sum of welfare above critical level \( S = \sum (w_i - c) \), with \( c = 20 \).  

  **Verdicts for each transition \( t \to t+1 \):**  
  - **Totalism:** Endorses if \( T_{t+1} > T_t \).  
    Since \( T_{t+1} = N_{t+1} w_{t+1} = 100 \times \sqrt{1000 \times N_{t+1}} \) and \( T_t = 100 \times \sqrt{1000 \times N_t} \), \( T_{t+1} > T_t \) iff \( N_{t+1} > N_t \) (true for all steps).  
  - **Averagism:** Endorses if \( w_{t+1} > w_t \).  
    But \( w_{t+1} < w_t \) for all steps (due to expansion), so rejects all.  
  - **Critical-Levelism:** Endorses if \( S_{t+1} > S_t \), i.e., \( N_{t+1}(w_{t+1} - 20) > N_t(w_t - 20) \).  

  **Key transitions (full table for all steps in Appendix):**  
  | From \( t \) | To \( t+1 \) | \( N_t \) | \( w_t \) | \( N_{t+1} \) | \( w_{t+1} \) | Totalism Verdict (Arithmetic) | Averagism Verdict (Arithmetic) | CL Verdict (Arithmetic) |
  |-------------|-------------|-----------|-----------|---------------|---------------|-------------------------------|--------------------------------|--------------------------|
  | 0 | 1 | 1,000 | 100.00 | 1,234 | 90.02 | Endorse (\( T_1 = 111,084 > T_0 = 100,000 \)) | Reject (\( w_1 = 90.02 < 100.00 \)) | Endorse (\( S_1 = 86,405 > S_0 = 80,000 \)) |
  | 1 | 2 | 1,234 | 90.02 | 1,523 | 81.04 | Endorse (\( T_2 = 123,428 > T_1 = 111,085 \)) | Reject (\( w_2 = 81.04 < 90.02 \)) | Endorse (\( S_2 = 92,964 > S_1 = 86,405 \)) |
  | ... | ... | ... | ... | ... | ... | ... | ... | ... |
  | 8 | 9 | 5,387 | 43.08 | 6,650 | 38.78 | Endorse (\( T_9 = 257,887 > T_8 = 232,132 \)) | Reject (\( w_9 = 38.78 < 43.08 \)) | Endorse (\( S_9 = 124,887 > S_8 = 124,332 \)) |
  | **9** | **10** | **6,650** | **38.78** | **8,209** | **34.90** | Endorse (\( T_{10} = 286,494 > T_9 = 257,887 \)) | Reject (\( w_{10} = 34.90 < 38.78 \)) | **Reject** (\( S_{10} = 122,314 < S_9 = 124,887 \)) |
  | 10 | 11 | 8,209 | 34.90 | 10,134 | 31.42 | Endorse (\( T_{11} = 318,428 > T_{10} = 286,494 \)) | Reject (\( w_{11} = 31.42 < 34.90 \)) | Reject (\( S_{11} = 115,710 < S_{10} = 122,314 \)) |
  | ... | ... | ... | ... | ... | ... | ... | ... | ... |
  | 21 | 22 | 83,340 | 10.95 | 102,888 | 9.86 | Endorse (\( T_{22} = 1,014,684 > T_{21} = 912,573 \)) | Reject (\( w_{22} = 9.86 < 10.95 \)) | Reject (\( S_{22} = -1,043,000 < S_{21} = -753,000 \)) |

  **Cumulative evaluation (start to endpoint):**  
  - **Totalism:** Endorses endpoint (\( T_{22} = 1,014,684 > T_0 = 100,000 \)).  
  - **Averagism:** Rejects endpoint (\( w_{22} = 9.86 < w_0 = 100.00 \)).  
  - **Critical-Levelism:** Rejects endpoint (\( S_{22} = -1,043,000 < S_0 = 80,000 \)).  

  **Critical-Levelism's "switch" at \( t=9 \to t=10 \):**  
  - **When:** Transition from \( N=6,650 \) (\( w=38.78 \)) to \( N=8,209 \) (\( w=34.90 \)).  
  - **Why:** \( S_{t+1} > S_t \) holds only when \( w_t > 20 \) and \( w_{t+1} > 20 \). At \( t=9 \), \( w_9 = 38.78 > 20 \), but \( w_{10} = 34.90 \) is close to 20, and the welfare drop (from 38.78 to 34.90) combined with the population increase (6,650 to 8,209) causes \( S_{10} < S_9 \).  
  - **Coherence:** Critical-Levelism is not incoherent. It evaluates transitions locally (adjacent populations), not cumulative paths. It endorses steps to \( t=9 \) (which it ranks above \( t=0 \)) but rejects further steps. The endpoint is ranked below \( t=9 \) and \( t=0 \), but this is consistent with its lexical structure (non-linear tradeoffs between quantity and quality).  

