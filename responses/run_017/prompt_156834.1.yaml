  First, I need to identify the core elements: the generalist view that conspiracy theories share epistemically problematic features warranting skepticism, versus the particularist view that each theory must be evaluated individually without class-based prejudice. The three cruxes outlined (leak-selection, competence trap, error-budget asymmetry) form the critical battlegrounds.

  For the document structure, I consider how to map the five required items:
  1) Common ground - focusing on points both sides accept, like the definitional elements and audit asymmetry
  2) Core disagreement - presenting their positions side-by-side on the key epistemic question
  3) The three cruxes - framing each as a question both positions must address
  4) Test predictions - creating a table for historical and stylized case expectations
  5) Epistemic status - clarifying where claims reflect consensus versus bilateral agreement

  The historical test seems particularly crucial - if verified conspiracies displayed the "problematic markers" before exposure, it undermines the generalist position. The stylized case will reveal how each side weights document consistency versus provenance issues. 

  I notice the prediction tables need careful construction to show divergent expectations while maintaining parallel structure. For the competence trap crux, I make sure to highlight the symmetry with institutional accounts that both sides must confront. Throughout, I maintain a neutral tone while ensuring contested claims aren't presented as consensus.

  The word-count constraint means every phrase must carry weight - for example compressing "leak-selection problem" into a single-line question while preserving its diagnostic importance. For item 5, I explicitly tag which agreements are idiosyncratic to these thinkers versus field-wide.
answer: |-
  Here is the collaborative document drafted per your specifications:

  **1.** Both parties agree that: (a) "conspiracy theory" denotes explanations positing coordinated, hidden agency contradicting official accounts; (b) such theories often exhibit contrarianism, reinterpretation of counterevidence, and reliance on hidden coordination; (c) institutional accounts typically undergo more external auditing than unofficial alternatives, creating an asymmetry in known error catalogues pre-assessment (*common ground, though (c)'s epistemic weight is contested*).

  **2.** Disagreement on epistemic status of the class:

  | Position          | Core Claim on Class-Based Assessment                                                                 |
  | :---------------- | :--------------------------------------------------------------------------------------------------- |
  | **Generalist**    | The identified features (contrarianism, reinterpretation, hidden coordination) provide a defeasible reason to assign higher initial skepticism or a shifted burden of proof compared to ordinary empirical claims. |
  | **Particularist** | No legitimate shift in prior probability or burden of proof is warranted based solely on class membership; each claim must be evaluated solely on its specific evidence, akin to any historical hypothesis. |

  **3.** Agreed Cruxes Requiring Resolution:
      (a) **Leak-Selection Problem**: Does the typical absence of a validated model for how evidence surfaces from hidden conspiracies undermine the diagnostic value of evidence volume/consistency for assessing such theories? (*Generalist: Undermines reliance on such evidence without model. Particularist: Irrelevant if specific evidence is valid.*)
      (b) **Competence Trap**: Does increasing the assumed competence of a hypothesized conspiracy functionally immunize it from falsification in a way meaningfully distinct from how "institutional incompetence" or "coincidence" immunizes official accounts? (*Disagreement centers on symmetry.*)
      (c) **Error-Budget Asymmetry**: Does the pre-assessment visibility of errors in institutional accounts (due to auditing) versus the hidden flaws in unofficial accounts constitute a legitimate epistemic asymmetry affecting initial priors? (*Generalist: Yes, justifies skepticism. Particularist: No, reflects auditing access, not inherent epistemic status.*)

  **4.** Test Predictions:

  | Test                                      | Generalist Prediction                                                                 | Particularist Prediction                                                                |
  | :---------------------------------------- | :------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------- |
  | **(A) Historical Pre-Confirmation Markers**: Analysis of later-confirmed conspiracies' pre-exposure characteristics. | Confirmed conspiracies will **rarely** exhibit the "problematic markers" (contrarianism, reinterpretation, self-insulation) strongly *before* exposure; markers are predictive of falsity. (Predicts <20% show strong markers) | Confirmed conspiracies will **frequently** exhibit these markers pre-exposure; markers are common features of hidden coordination, not indicators of falsity. (Predicts >60% show strong markers) |
  | **(B) Stylized Case Assessment**: Effect on confidence in the covert program's existence. | Confidence **decreases** (e.g., from 40% prior to 25-30%). Key factors: Lack of chain of custody, motivated witnesses, and the regulator's errors being *known* (asymmetry). | Confidence **increases** (e.g., from 40% prior to 55-60%). Key factors: High document volume, internal consistency, corroborated references, and multiple independent sources (even with grievances). |

  **5.** Epistemic Status Notes: Claims in 1(a-b) are widely accepted definitions/observations. Claim 1(c) is an agreed *fact* about auditing disparity, but its *epistemic significance* (Crux c) is disputed. The framing of Cruxes (a-c) and Tests (A-B) reflects the drafter's synthesis of the parties' stated positions and the specified points of contention; residual verbal disagreement likely exists over terms like "defeasible reason" vs. "shifted burden of proof" (*marked in 2*). Predictions reflect stated expectations pre-data collection.
