prompt: |-
  I work in health outcomes research, and I keep running into a two-sided move that I don't have a word for. I want the carving more than the label.

  Here is the pattern. When people's own reports about how their lives are going come out more positive than our measures say they should, the reports get discounted: people accommodate, expectations drift, they don't know what they are missing, so the report is treated as a symptom rather than as evidence. When the reports come out more negative than the measures say they should, they get discounted too, but by a different route: the distress is real but is said to be about the wrong thing — a status injury, an adaptation not yet finished, expectations set by comparisons that should not be setting them. Both mismatches get absorbed, and the measure never does.

  What makes this more than ordinary two-directional suspicion, it seems to me, is that the two moves are usually made by different people. Clinicians, in my experience, discount the negative reports; the advocacy-minded discount the positive ones. Nobody is individually selective, but across a field a first-person report can apparently only ever confirm the measure, never challenge it. By contrast, when we trim both suspiciously high and suspiciously low answers out of a valuation survey, that two-sided trimming reads as ordinary rigour rather than as a trick, even though it has the same shape.

  So: is there an established concept for the distributed version — a pair of individually reasonable discounting moves, each aimed at a different direction of mismatch, whose net effect is that no first-person report could count against the theory? If there is, tell me how it relates to the nearby things I only half-know about: unfalsifiability, confirmation bias, the idea that preferences adapt to circumstances, and the idea that some speakers are unfairly denied credibility. If there isn't, coin it, define it, and tell me what would distinguish a field that is doing this from a field that is simply applying two well-founded corrections, one in each direction. Please also mark clearly which parts of your answer are settled and which are genuinely contested among people who work on this, and flag anything that is your own coinage rather than something with a literature behind it.
reasoning: |-
  Okay, the user works in health outcomes research and is describing a recurring issue with how subjective reports are handled. They've noticed that when patients report better outcomes than clinical measures suggest, their positivity is dismissed as adaptation or lowered expectations. Conversely, when reports are worse than measures indicate, the negativity is also dismissed but attributed to status concerns or maladaptation. 

  The key insight here is that these two dismissal patterns usually come from different groups—clinicians tend to dismiss negative reports while advocates dismiss positive ones. The net effect is that patient reports never actually challenge the existing measures. The user wants to know if there's a term for this phenomenon and how it relates to concepts like unfalsifiability or confirmation bias.

  Hmm, this is fascinating because it's not just simple bias—it's a systemic issue where the field collectively immunizes its measures against contradiction. The closest established concept might be the "symmetry of suspicion," but that doesn't fully capture the distributed nature. For the coinage part, "distributed epistemic immunization" feels right—emphasizing how knowledge claims are protected across a community. 

  The user also asks how to distinguish legitimate corrections from this problematic pattern. That's crucial. The difference lies in whether the corrections are applied symmetrically by the same actors (healthy skepticism) versus asymmetrically by different factions (systemic protection). Also important: whether the field allows for the possibility that measures could be wrong. 

  I should note that parts about adaptive preferences and epistemic injustice are well-established, while the synthesized concept of "distributed epistemic immunization" is my own framing. The user seems sophisticated—they'll appreciate knowing where the boundaries are between settled theory and new synthesis.
answer: |-
  This phenomenon you're describing is insightful and under-acknowledged. While there isn't a single, universally accepted term for this *distributed, bidirectional discounting*, its core dynamics relate to established concepts. Let's carve it out:

  1.  **The Core Concept & Proposed Coinage:**
      *   **Settled Observation:** The bidirectional discounting of subjective reports mismatched with objective measures is widely observed in health outcomes, quality of life, and disability studies.
      *   **Settled Concepts Involved:**
          *   **Response Shift/Adaptation:** People recalibrate their internal standards, values, or conceptualization of a construct (like "health" or "pain") due to changes in health status or experience. This explains discounting unexpectedly positive reports ("they've adapted, their standards lowered").
          *   **Epistemic Injustice (Specifically, Testimonial Injustice):** When a speaker is given less credibility than they deserve, often due to prejudice about their social identity (e.g., being a patient, having a chronic condition). This often explains discounting unexpectedly negative reports ("they're depressed/complaining/not coping properly").
          *   **Unfalsifiability (De Facto):** The *net effect* of these bidirectional, distributed discounting moves is that the "objective" measure becomes de facto unfalsifiable by subjective reports. No subjective report can falsify the measure's validity because any discrepancy is explained away based on the *direction* of the mismatch.
          *   **Confirmation Bias (Distributed):** The field, through its different actors (clinicians, advocates, researchers), collectively exhibits a bias towards interpreting evidence in a way that confirms the validity of the existing "objective" measures. Each group focuses on discounting the discrepancy that most threatens *their* perspective or interests.
      *   **The Gap & Proposed Coinage:** The unique element you identify is the *distribution* of the discounting moves across different stakeholder groups, each specializing in discounting one direction of mismatch, creating a systemic shield for the measure.
          *   **Proposed Term: Distributed Epistemic Immunization (DEI)**
          *   **Definition:** A systemic phenomenon within a field where the validity of a dominant measure or framework is protected from challenge by subjective reports through a bidirectional pattern of discounting. Critically, the discounting of positive and negative mismatches is primarily performed by *different stakeholder groups* (e.g., clinicians vs. advocates), each employing distinct, seemingly reasonable narratives (e.g., adaptation vs. status injury/maladaptation). The collective effect renders the measure impervious to falsification by lived experience.

  2.  **Distinguishing Distributed Epistemic Immunization (DEI) from Legitimate Corrections:**
      A field engaged in DEI differs crucially from one applying well-founded, bidirectional corrections:

      | **Feature**               | **Distributed Epistemic Immunization (DEI)**                                                                 | **Legitimate Bidirectional Corrections**                                                                 |
      | :------------------------ | :----------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------- |
      | **Source of Discounting** | Primarily *different groups* (e.g., clinicians discount negatives, advocates discount positives).             | Applied *consistently* by the *same analysts/researchers* evaluating data.                               |
      | **Underlying Motive**     | Often implicit protection of professional perspective, theoretical model, resource allocation, or advocacy goals. | Explicit methodological rigor aimed at improving measurement accuracy and validity.                     |
      | **Handling of Mismatch**  | Mismatch *always* invalidates the *report*, never seriously questioning the *measure*. Discounting is primary. | Mismatch prompts investigation into *both* the measure's validity *and* potential reporting artifacts. |
      | **Asymmetry**             | Discounting narratives are *asymmetrical* and tailored to the group discounting that direction.               | Correction methods are *symmetrical* (e.g., statistical trimming based on defined criteria for both high/low). |
      | **Transparency**          | Discounting narratives are often implicit, ad-hoc, and driven by professional or ideological stance.          | Correction methods are explicit, pre-specified (where possible), statistically justified, and documented. |
      | **Falsifiability**        | Measure/system is *de facto unfalsifiable* by subjective reports due to the distributed discounting shield. | Measure/system *remains falsifiable*; corrections aim for a *truer* signal that *could* challenge the measure. |
      | **Outcome**               | Status quo of the measure/system is preserved; patient voice is systematically subordinated or reinterpreted. | Measure/system is iteratively refined; patient voice is integrated critically but respectfully.           |

  3.  **Relation to Nearby Concepts:**
      *   **Unfalsifiability:** DEI *results* in de facto unfalsifiability for the measure concerning subjective experience. It's a specific *social mechanism* by which unfalsifiability is achieved in practice within a community.
      *   **Confirmation Bias:** DEI is a *distributed, systemic manifestation* of confirmation bias. Different groups confirm their preferred narrative (measure validity/clinical perspective vs. advocacy perspective) by selectively discounting the reports that contradict it, unaware their collective action shields the core measure.
      *   **Adaptive Preferences/Response Shift:** These concepts provide the *content* for one arm of the discounting (explaining unexpectedly positive reports). DEI describes how this concept is *selectively weaponized* by one group within the system to immunize the measure.
      *   **Epistemic Injustice (Testimonial):** Provides the *content* (and often the mechanism) for the other arm of discounting (explaining unexpectedly negative reports). DEI highlights how this injustice can be *systematically deployed* by another group within the field to achieve the same immunization effect.
      *   **Motivated Reasoning:** DEI is driven by motivated reasoning at the group level – clinicians are motivated to maintain clinical authority/not over-pathologize, advocates are motivated to highlight unmet need/injustice. The reasoning paths diverge based on the mismatch direction.

  4.  **What's Settled vs. Contested vs. Coined:**
      *   **Settled:**
          *   The existence of response shift/adaptive preferences as psychological phenomena.
          *   The existence of testimonial injustice, particularly in healthcare towards marginalized groups.
          *   That subjective and objective measures often diverge in health outcomes research.
          *   That confirmation bias and motivated reasoning exist and influence interpretation.
          *   That unfalsifiability is a problem for scientific theories/measures.
      *   **Contested/Acknowledged but Debated:**
          *   The *extent* to which discounting positive reports is *always* about "adaptive preferences" vs. sometimes reflecting genuine resilience or a broader definition of well-being.
          *   The *extent* to which discounting negative reports is *always* testimonial injustice vs. sometimes a legitimate clinical judgment about maladaptive coping or comorbid mental health issues.
          *   The *relative weight* that should be given to subjective vs. objective measures in different contexts.
          *   Whether the bidirectional discounting you describe is primarily driven by protecting measures or by protecting distinct professional/ideological worldviews (clinician vs. advocate).
      *   **Coined Here:**
          *   **Distributed Epistemic Immunization (DEI):** This specific term and its definition, highlighting the *distribution across stakeholder groups* as the key mechanism creating the systemic shield, is my synthesis/coinage based on your description and the established concepts. While the *components* are discussed in literature, this specific *configuration and mechanism* lacks a universally recognized label.

  **In summary:** You've identified **Distributed Epistemic Immunization (DEI)** – a systemic pattern where different stakeholder groups within a field, using distinct discounting narratives (often drawing on established concepts like adaptation or epistemic injustice), selectively invalidate subjective reports that mismatch the dominant measure in either direction. The collective effect shields the measure from falsification by lived experience. Distinguishing DEI from legitimate corrections hinges on asymmetry, distribution, lack of measure interrogation, opacity, and the resulting unfalsifiability. While the building blocks are settled concepts, the specific configuration you describe, particularly the distributed nature across groups, warrants this focused term.
