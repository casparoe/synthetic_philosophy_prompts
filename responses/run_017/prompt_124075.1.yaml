prompt: |-
  I'm the operations manager for a supported-living provider — eight group homes, about forty adult residents, most of whom have an intellectual disability and many of whom also carry psychiatric diagnoses (schizoaffective disorder, emotionally unstable personality disorder, alcohol-related brain damage, and increasingly residents who are ageing into early dementia). Our staff are support workers with three weeks of classroom training and a two-day annual refresher; none of them have any academic background in anything. Incidents happen somewhere in the service two or three times a week — a punch during a personal-care prompt, a stolen wallet, sexual touching in a shared lounge, a violent episode during a relapse — and after each one a shift lead writes it up and, with the clinical lead signing off, decides what follows: a mediation, a behaviour support plan, a referral, a move, or nothing. Our current framework is essentially positive behaviour support: every incident is logged on an antecedent-behaviour-consequence chart and handled as behaviour with causes to be identified and managed. It has two failure modes I keep running into. Staff who let a resident see that they were frightened, hurt or angry get written up for unprofessional conduct and told to stay neutral. And residents and families tell me, in different words, the same thing: that they feel written off, handled like weather or like livestock, that nobody expects anything of them any more and so they have stopped trying.

  I have no academic background myself, but I got talking to a friend who studied philosophy, and she mentioned an old essay — I think by P. F. Strawson, possibly called Freedom and Resentment — which, as she described it, says roughly this: that holding someone responsible isn't a theory you believe but a stance you take, a matter of having reactive attitudes like resentment, gratitude and guilt; that the alternative of treating someone as a thing to be managed or handled is available and sometimes right, but is not the neutral, scientific default it presents itself as; and that you don't have to settle whether anyone has free will before you resent being wronged, because the question is set up backwards. She also said something I've been chewing on: that there is a difference between cases where this person couldn't have done otherwise on this occasion — he was pushed, he didn't know, he was out of his mind — and cases where the person isn't the kind of thing you address as a person at all, and that confusing the two is exactly the mistake our incident forms make, since the chart has one box where you write the diagnosis and another where you write the consequence.

  What I want from you is a written procedure my shift leads can actually run. Constraints: it has to fit on one page, be usable in twenty minutes at a debrief by someone who has never heard the theory, and produce a short written record the clinical lead can sign off or overrule. I'd want it as ordered questions — is this a case for addressing the person or for managing the behaviour, which of those stances is being taken toward whom, and if it's the managing stance, whether the withdrawal is total or partial and temporary or open-ended — with a statement, for each question, of what counts as a sufficient answer and what evidence on the file satisfies it, and with explicit stop points: places where the procedure returns a firm no (do not switch to the managing stance here) and places where it stops and hands the decision to a person because the question is one of values rather than fact. It also has to handle five things that I think break any naive version of this. First, the difference between excusing and exempting, including the cases where a resident is fully capable in some domains and not in others, so the honest answer may be hold him responsible about his money but not about his hygiene. Second, the fact that we only ever deal with the negative side: nobody has a procedure for gratitude, appreciation or restored trust, and I suspect our service is worse at that than at blame. Third, the loop — if we have spent three years treating a resident as a thing to be managed, some of his present incapacity is our doing, so the file is itself part of the cause, and a procedure that asks is he an agent now? is asking about a variable it has been busy depressing. I want to know what the procedure does with that. Fourth, how to keep resentment from sliding into punitiveness, humiliation or a row: what the difference is in practice, not in theory. Fifth, the cases where the proper object of the attitude isn't the resident at all, but a co-resident's grievance on someone else's behalf, or the staff member's own.

  Then please run it on three residents from our service. (A) Marcus, mild intellectual disability and alcohol-related brain damage, has hit a support worker during a shower prompt for the third time this month; afterwards he says he shouldn't have, and means it, and it happens again. (B) Nadia has an emotionally unstable personality disorder diagnosis, steals small sums from co-residents, lies about it, and turns staff against one another; my staff say she knows exactly what she is doing, my clinical lead says it is trauma-driven behaviour and wants a plan with no blame in it, and my own instinct is with the clinical lead. (C) Terrence, floridly psychotic, attacked a co-resident with a kettle because he believed the man was poisoning him; he has since been hospitalised, medicated, and came back saying he remembers it like a dream, and the injured man's family want him moved out. I'd be grateful if at least one of the three came out in a way I'll argue with — I'd least like to be told that Nadia is a full participant and that our management-only approach is the wrong stance toward her, so if that's what the procedure says I want to see it argued rather than asserted. Finally, be explicit about what the procedure cannot settle: whether to call the police, whether to end a placement, whether anyone is blameworthy in the deep sense, and anything else where a page of questions would be pretending.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're an operations manager at a supported-living provider with eight group homes and about forty adult residents. Most residents have intellectual disabilities and psychiatric diagnoses like schizoaffective disorder, emotionally unstable personality disorder, alcohol-related brain damage, and early dementia. Staff are support workers with minimal training—three weeks initially and a two-day annual refresher—no academic background. 

  The main issue is their current incident response framework based on Positive Behaviour Support (PBS). They use antecedent-behaviour-consequence charts, but there are two big problems: staff are reprimanded for showing emotions like fear or anger, which feels dehumanizing, and residents/families feel written off, like they're treated as objects rather than people. 

  The user mentioned a philosophical essay by P.F. Strawson called "Freedom and Resentment." The key takeaway is that holding someone responsible isn't just a theory but a stance involving reactive attitudes (resentment, gratitude). The alternative—treating someone as a thing to be managed—isn't neutral. The essay also distinguishes between excusing (specific circumstances) and exempting (fundamental incapacity). 

  The user wants a practical, one-page procedure for shift leads to use in 20-minute debriefs. It needs ordered questions, clear criteria for evidence, stop points for value-based decisions, and must handle five challenges: 

  1. Differentiating excusing vs. exempting, especially with varying capacities in different domains.
  2. Addressing only negative incidents, lacking processes for positive reactions like gratitude.
  3. The feedback loop where treating someone as incapable can worsen their capacity.
  4. Preventing resentment from becoming punitive.
  5. Cases where the reactive attitude should target someone else (e.g., staff, co-resident).

  They also provided three case studies: Marcus (hits staff during showers, expresses regret), Nadia (steals, lies, staff conflict), and Terrence (psychotic attack, now medicated). They want the procedure applied to these cases, especially expecting disagreement on Nadia.

  First, I need to translate Strawson's philosophy into actionable steps. The core is deciding between the "participant stance" (holding responsible) and "management stance" (handling behavior). The procedure must be simple, using plain language without academic jargon. 

  For the structure, a flowchart of questions makes sense. Start with immediate risk assessment, then determine if the person can respond to reasons. Key questions: 
  - Is there imminent danger? If yes, prioritize safety.
  - Does the person understand appeals to fairness, empathy, or social norms? 
  - Check if incapacity is global or domain-specific. 
  - Consider if past management has eroded capacity (the feedback loop).

  Handling the five challenges:
  1. **Excusing vs. Exempting**: Use domain-specific assessments. For Marcus, maybe responsible for understanding violence is wrong but not for emotional regulation in showers.
  2. **Lack of Positive Procedures**: Include a step to document positive responses, like gratitude, to balance the focus.
  3. **Feedback Loop**: Explicitly ask if the person's history of being managed has reduced their capacity. If yes, shift towards rebuilding agency.
  4. **Resentment vs. Punitiveness**: Define clear boundaries—resentment addresses the act, punitiveness seeks to harm. Encourage reparative actions.
  5. **Misplaced Attitudes**: Identify the correct target. If a staff member is resentful due to their own triggers, address that separately.

  For the procedure, each question needs:
  - **Sufficient Answer**: Clear yes/no criteria.
  - **Evidence Required**: Observable facts, records, statements.
  - **Stop Points**: Where values decisions are needed (e.g., moving a resident).

  Apply to case studies:
  - **Marcus**: Physical aggression but shows remorse. Can understand appeals to fairness. Management stance in shower routines (temporary) but participant stance in addressing harm. Focus on skill-building, not punishment.
  - **Nadia**: Staff split on her awareness. Despite trauma, she manipulates, indicating social understanding. Participant stance with support for distress. Address staff conflicts separately.
  - **Terrence**: Psychosis during attack, now stabilized. Excused for the incident but participant stance in reconciliation. Safety measures needed, but not permanent exemption.

  The procedure can't decide on police, placement, or deep blame—those require higher-level judgment. Emphasize that this tool is for immediate response, not final decisions. 

  The user's deeper needs: They feel the current system dehumanizes residents and stifles staff emotions. They want to restore dignity without compromising safety. The unspoken need is for a cultural shift where residents are seen as capable, and staff can be human while professional. Also, they need a practical tool that doesn't overburden staff but introduces philosophical concepts subtly. 

  I'll ensure the procedure is concise, uses plain language, and includes examples. For Nadia, arguing the participant stance might challenge the clinical lead, but showing how it includes trauma support balances it. Highlighting reparative steps addresses punitive risks. The feedback loop question forces reflection on past practices, promoting change. 

  Finally, the procedure must fit one page, with clear sections and minimal jargon. Testing it on the cases shows its flexibility. Emphasizing that some decisions are values-based keeps it honest about limitations.
answer: |-
  Here is a one-page, actionable procedure for incident debriefs, grounded in Strawson's "reactive attitudes" framework. It addresses your constraints and five challenges explicitly. **The Core Distinction:** "Participant Stance" (holding responsible, addressing the *person*) vs. "Management Stance" (handling the *behaviour* as caused). The goal is to choose the *least restrictive stance justified* for *this specific incident* and *this specific domain*.

  **Incident Stance Decision Procedure (v1.0)**

  **Purpose:** To determine for *this specific incident* and *this specific domain of action* whether we primarily address the resident as a responsible participant ("Participant Stance") or manage the behaviour as a caused event ("Management Stance").

  **Instructions:** Shift Lead facilitates. Answer questions *in order*. Stop at **STOP** points. Record answers concisely. Clinical Lead signs off/overrules based on this record. Timebox: 20 mins.

  ---

  **1.  IMMEDIATE SAFETY & STABILIZATION:** Are immediate safety risks present or unresolved? (e.g., ongoing aggression, medical need, environmental hazard).
      *   *Sufficient Answer:* YES (Active risk) / NO (Contained).
      *   *Evidence:* Direct observation, incident report details.
      *   **→ If YES: Prioritize safety actions NOW. Document actions taken. Proceed AFTER stabilization.**

  **2.  CAPACITY FOR REASON-RESPONSE (Excusing Check):** *Regarding the specific action in this incident*, could the resident **understand** a basic appeal to fairness, empathy, rules, or consequences *at the time*? (Focus: Ability to grasp the *appeal itself*, not agreement).
      *   *Sufficient Answer:* YES (Showed understanding/comprehension) / NO (No evidence of comprehension).
      *   *Evidence:* Resident's statements pre/during/post incident (e.g., "I knew it was wrong but...", "He deserved it"), known triggers (e.g., psychosis active? Dementia confusion acute?), past similar incidents, staff observations *of comprehension attempts*.
      *   **→ If NO: Proceed to Q4 (Management Stance likely).**
      *   **→ If YES: Proceed to Q3.**

  **3.  FUNDAMENTAL PARTICIPATION (Exempting Check):** *In the domain of this specific action* (e.g., hygiene, money, social interaction), is the resident generally **capable of engaging as a participant**? Could withholding the Participant Stance *itself* damage their status/development *in this domain*? (Considers the feedback loop).
      *   *Sufficient Answer:* YES (Capable, or harm from withdrawal) / NO (Fundamentally incapable, withdrawal less harmful).
      *   *Evidence:* Resident's overall functioning *in this domain* (e.g., manages money elsewhere? Shows remorse? Understands social rules usually?), history of successful engagement in this domain, documented impact of past Management Stance (e.g., increased passivity), clinical input on *domain-specific* capacity.
      *   **→ If NO: Proceed to Q4 (Management Stance likely).**
      *   **STOP A (Values):** If evidence is mixed or significant risk of harm from withdrawal exists, the *degree* of participation possible is a values decision. **→ Record the dilemma. Hand decision to Clinical Lead/Manager.** (e.g., "Can partially participate in apology but not consequence negotiation?").

  **4.  STANCE SELECTION & SCOPE:**
      *   **a) Primary Stance for *this incident*, *this domain*:** Based on Q2 & Q3, choose ONE:
          *   **(P) Participant Stance:** Address the resident directly about the action, seek acknowledgement/apology/reparation, discuss impact, agree on amends/future change. **OR**
          *   **(M) Management Stance:** Identify antecedents/consequences, adjust environment/support/routine, develop skills, *without* addressing responsibility for the *past* act.
      *   **b) Scope of Stance (If M chosen or partial):** Is this stance shift:
          *   *Temporary* (e.g., due to acute episode, specific stressor) or *Ongoing*?
          *   *Domain-Specific Only* (e.g., hygiene prompts) or *Global* (All interactions)?
      *   *Sufficient Answer:* (P) or (M); Scope: Temp/Ongoing; Domain/Global.
      *   *Evidence:* Answers to Q1-Q3, clinical assessment of prognosis/stability, resident's history of fluctuation.

  **5.  REACTIVE ATTITUDES CHECK (Preventing Punitiveness & Misplacement):**
      *   **a) Target:** Who is the *primary* appropriate target of the reactive attitude (e.g., concern, resentment, need for repair)? (Resident? Co-resident? Staff? External factor?).
      *   **b) Expression:** For *staff* reactions (resentment, frustration, fear):
          *   Is the planned response focused on **repair, safety, or skill-building** (Healthy) **OR** on causing discomfort, humiliation, or "payback" (Punitive)?
      *   *Sufficient Answer:* a) [Name/Role] b) Repair/Safety/Skills OR Punitive?
      *   *Evidence:* Staff statements/debrief notes, nature of proposed actions (e.g., mediation vs. restriction), history of interactions.
      *   **→ If b) Punitive? YES: STOP B (Values):** Staff support/mediation needed first. **→ Pause this procedure. Address staff reaction.**
      *   **→ If a) Target is NOT the resident:** STOP C (Values): How to address the *actual* target (e.g., co-resident grievance, staff error) is a separate issue. **→ Record target. Hand to Manager/Clinical Lead.**

  **6.  POSITIVE COUNTERPART (If P Stance chosen):** Is there a **specific, immediate opportunity** to practice the Participant Stance positively *linked to this incident resolution*? (e.g., Expressing gratitude for apology, acknowledging effort to change, rebuilding trust through agreed action).
      *   *Sufficient Answer:* YES (Opportunity identified) / NO (Not applicable/identified).
      *   *Evidence:* Resident's engagement in resolution, nature of agreed amends/plan.
      *   **→ If YES: Document the planned positive action/who does it.**

  ---

  **RECORD:** Log #1-6 answers concisely. **Clinical Lead Signoff:** [ ] Agree [ ] Overrule (State reason/alternate stance) [ ] Needs Discussion.

  **What this procedure CANNOT decide (Requires Manager/Clinical Lead/Team):**
  *   Calling police/emergency services.
  *   Ending a placement/moving a resident.
  *   Deep moral blameworthiness ("in the soul").
  *   Final diagnosis or long-term prognosis.
  *   Resolving complex co-resident/family grievances (beyond identifying target in 5a).
  *   Major changes to Behaviour Support Plans (informs them).
  *   Disciplinary action against staff.

  ---

  **Application to Your Cases:**

  *   **A) Marcus (Hit during shower):**
      1.  Safety: Likely NO (Contained). Proceed.
      2.  Reason-Response: **YES.** He says "I shouldn't have" and means it. Shows understanding appeals to rules/fairness *post-incident*. Evidence: His verbal statement.
      3.  Participation (Hygiene Domain): **YES (But with caveat).** He understands the wrong, but capacity for emotional regulation *in that moment* is impaired (ARBD/frustration). Withdrawing stance entirely harms agency. **→ STOP A:** Partial participation possible? Values Decision: **YES - Partial Participant Stance.**
      4.  Stance: **(P) Participant Stance.** Scope: Domain-Specific (Shower prompts), Temporary (Until skills/triggers addressed).
      5.  Attitudes: a) Target: Marcus. b) Staff: Ensure focus is on repair/safety (e.g., "How can we make showers easier? What can you do differently? How to fix this with staff?"), NOT punishment. **→ Healthy.**
      6.  Positive: **YES.** Acknowledge his remorse, express appreciation for willingness to discuss repair.
      *   **Outcome:** Address Marcus directly. Focus on collaborative problem-solving for shower triggers & amends. *Avoid* writing off as purely "behaviour to manage". Core failure was skipping the Participant Stance due to frustration/focus on ABCs alone.

  *   **B) Nadia (Stealing, lying, dividing staff):**
      1.  Safety: Likely NO (Contained, though relational harm). Proceed.
      2.  Reason-Response: **YES.** She "knows exactly what she is doing" (staff report) - implies understanding social rules/consequences of lying/manipulation *in this domain* (social/money). Evidence: Staff observations of her tactics.
      3.  Participation (Social/Money Domain): **YES.** EUPD/trauma may *explain* the behaviour intensely, but she fundamentally operates within the interpersonal realm, understands manipulation, and responds to social dynamics. Withdrawing the Participant Stance (treating purely as trauma symptom) likely *increases* manipulation (feedback loop) and denies her agency. Evidence: Staff conflict evidence shows her active participation.
      4.  Stance: **(P) Participant Stance.** Scope: Domain-Specific (Handling money, interactions with co-residents/staff), Ongoing (Needs consistency).
      5.  Attitudes: a) Target: **Complex.** Primarily Nadia *for her actions*, BUT also potentially staff dynamics she exploits. **→ STOP C:** Hand "staff dynamics" aspect to Manager. b) Staff: HIGH RISK of punitiveness ("she's evil/manipulative"). **Crucial:** Focus on *addressing the action* (theft, lie) and *its impact* using clear "I" statements & boundaries ("When you said X about Y, it made it hard for us to work together. Taking Z breaks trust. How can we fix this?"), NOT character attacks. Requires skilled facilitation. **→ STOP B risk high:** Staff support/mediation likely needed *alongside* addressing Nadia.
      6.  Positive: **YES (Critical).** Acknowledge honest moments, efforts to build trust, positive interactions. Vital for EUPD.
      *   **Outcome:** *Requires nuance.* Participant Stance is essential to avoid infantilization and address the harmful *actions* directly and repair relationships. However, this must be done *alongside*, not instead of, deep trauma-informed support addressing the *drivers* (BSP focused on distress tolerance, emotional regulation, validating underlying feelings *without* validating harmful actions). The failure is conflating "trauma-driven" with "exempt from all responsibility in interactions". Staff need training to hold the Participant Stance *compassionately* without blame-shaming.

  *   **C) Terrence (Psychotic attack):**
      1.  Safety: Likely resolved post-hospitalization. Proceed.
      2.  Reason-Response: **NO (At the time).** Florid psychosis ("believed poisoning") means he could not understand appeals to reason/fairness *during the incident*. Evidence: Psychosis diagnosis, description of belief, "remembers it like a dream".
      3.  Participation (Safety/Perception Domain *during psychosis*): **NO.** Psychosis fundamentally impaired his capacity to participate in reality-based interaction *at that moment*. Evidence: Nature of delusion, hospitalization required.
      4.  Stance: **(M) Management Stance** for *the incident itself*. Scope: Likely Temporary (Assuming stability on meds), Domain-Specific (Managing acute psychosis risk).
      5.  Attitudes: a) Target: **Complex.** Terrence *for the act*? **NO (Excused/Exempt at time).** Primarily: Co-resident/family (victim fear/grievance), System (need for better psychosis monitoring/safety). **→ STOP C:** Hand co-resident/family grievance & safety planning to Manager/Clinical Lead. b) Staff: Ensure focus is safety/support, not blame towards Terrence *for the psychotic act*.
      6.  Positive: **YES (Towards Terrence NOW).** If stable, engage him *now* (Participant Stance) in understanding the *impact* (if appropriate for *his* current state) and safety planning ("How can we help you feel safe? What signs should we watch for?"). Acknowledge his current stability/engagement.
      *   **Outcome:** Terrence is **excused/exempt** for the *specific incident* due to psychosis. Management Stance for preventing recurrence is justified. **However:** Engage him *now* (Participant Stance) in recovery/safety planning *if* currently capable (Q2/3 *now* likely YES). The victim's family's demand for him to move out is a **separate values/risk decision** (Procedure CANNOT decide this - see "What it cannot decide").

  **Why Nadia Gets the Participant Stance (as argued, not asserted):** Strawson's point is that the Participant Stance is our default way of engaging with others *as persons*. Withdrawing it (exemption) is a significant step reserved for fundamental incapacity. Nadia's behaviour, while driven by deep distress and trauma (requiring Management Stance for *supporting her distress*), demonstrates sophisticated interpersonal awareness and agency *in the social domain where the harms occur* (lying, stealing, manipulating). To treat these actions *only* as "behaviour to be managed" (exempting her) denies her that social agency, feeds into the "written off" feeling, and likely reinforces manipulative patterns by removing the expectation of interpersonal accountability ("You lied. This hurt X. How can we fix this?") alongside compassionate support for the underlying pain. The clinical lead's trauma-informed plan is vital *for the distress*, but insufficient *for the interpersonal harm caused*. Both stances are needed, applied to different aspects.
