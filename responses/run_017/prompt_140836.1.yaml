  Their diagnostics ring true. The moving cut-offs (remember when Gen Z started in 1995? Now it's 1997), national variations (British "Thatcher's children" vs American Xers), and boundary fuzziness all point to social constructs. Yet they're not entirely arbitrary - 0.3 accounts for constrained invention.

