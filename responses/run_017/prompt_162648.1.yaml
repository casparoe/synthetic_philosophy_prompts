prompt: |-
  Hey — I'm in a political theory reading group (mostly philosophy grad students plus one econ guy who keeps derailing us) and we've gotten stuck on the Condorcet jury theorem, and it's definately changed how I read the whole epistemic-democracy literature. Here's where I ended up, and I'd like someone to just tell me which of us is wrong.

  My understanding is that the theorem says: if every voter is individually more than 50% likely to get the right answer and the votes are independent, the majority's chance of being right goes to 1 as you add voters. My friend reads that as "always make the group as big as possible." But when I ran the numbers on a toy case I got something weird: three reviewers who are each 90% reliable get the right answer 97.2% of the time by majority; add two more reviewers who are each only 51% reliable and the five-person majority drops to about 92%. So "bigger is better" looks false to me, even though everyone added is still above chance.

  The bigger disagreement is about what "independent" is even doing in there. I built a little model I've been calling the briefing-memo setup: before voting, everyone reads the same one-page memo, which points at the correct answer 80% of the time; each person votes with the memo unless their own private hunch (right 60% of the time, independent across people) says otherwise. Each person then ends up 60% reliable overall — still above chance — and since the hunches are independent, I figured the noise washes out and the majority still converges on the truth, just more slowly. My friend says any shared input like the memo breaks the theorem entirely and the majority gets stuck below certainty no matter how many people you pile on. That seems too strong: surely a memo that is itself right 80% of the time can only help? Relatedly, if independence is really required without qualification, doesn't the theorem end up implying that juries shouldn't deliberate at all, which is nuts? I've spent alot of time on this and can't see who's making the mistake.

  So: who's right, does the memo case converge to 1 or plateau, and if it plateaus, at what number? And does my 97.2 → 92 calculation actually contradict the theorem, or have I misread what the theorem promises? Please lead with the bottom line and keep the whole answer under 300 words, in American English.
reasoning: |-
  Okay, the user is in a political theory reading group stuck on the Condorcet jury theorem. They're trying to understand if bigger groups are always better and how shared information like a memo affects the theorem. 

  First, I need to recall the theorem: if voters are independent and each has >50% chance of being correct, majority accuracy approaches 1 as group size increases. The user's toy example shows adding less competent members reduces group accuracy, which doesn't contradict the theorem since the theorem assumes uniform competence. Their example mixes 90% and 51% voters, so the theorem's uniform competence assumption is violated - that's why group accuracy dropped.

  Then there's the memo scenario: everyone shares an 80%-reliable memo plus independent 60%-reliable hunches. Each voter ends up 60% reliable overall. The friend claims shared input breaks independence and causes plateauing. The user thinks the independent hunches should still allow convergence. 

  Actually, the memo creates common cause dependence - all votes correlate through the memo. Even if hunches are independent, the shared memo means votes aren't conditionally independent given the truth. This violates the theorem's independence condition. The group accuracy will plateau around 80% (the memo's reliability) because if the memo is wrong, the majority will likely be wrong regardless of size. 

  The user also asks if independence means juries shouldn't deliberate - but deliberation is about refining judgments, not introducing dependence in the theorem's sense. The theorem assumes pre-existing independent judgments; it doesn't forbid discussion that improves individual competence.

  Key clarifications:
  - Theorem requires identical competence (>50%)
  - Independence means votes uncorrelated beyond the truth itself
  - Shared evidence creates dependence, causing plateaus
  - Their 97.2%→92% drop is expected when adding weaker voters
  - Memo scenario plateaus near 80%
  - Jury deliberation isn't forbidden but changes assumptions

  The user seems to grasp the math but missed how shared inputs violate independence. Their econ friend is partially right about plateaus but overstated "breaks entirely" - it's specifically the dependence that causes it. The memo helps individuals but harms collective wisdom by creating correlations.
answer: |-
  **Bottom Line:** Your friend is mostly right about the memo case (it plateaus near 80%), and your 97.2% → 92% calculation doesn’t contradict the theorem—it violates its uniform competence assumption.  

  **Your Calculation (97.2% → 92%):**  
  The theorem assumes all voters have *identical* competence >50%. Adding weaker voters (51%) to stronger ones (90%) breaks this, so group accuracy can fall. The theorem doesn’t promise "bigger is better" when adding *less competent* voters.  

  **The Memo Case (Plateau, Not Convergence):**  
  - Each voter is 60% reliable *because* the shared memo (80% reliable) biases votes together.  
  - Votes aren’t independent: if the memo is wrong, *all* voters likely vote wrong.  
  - Result: Majority accuracy plateaus near the memo’s reliability (80%), not 100%. Even with infinite voters, if the memo errs (20% chance), the majority follows it.  

  **Independence Requirement:**  
  "Independence" means votes aren’t correlated *except* via the truth. The memo creates a *common cause* (dependence), breaking the theorem. Deliberation isn’t forbidden, but if it creates shared biases (like the memo), independence fails.  

  **Why Not Nuts?**  
  The theorem describes *voting*, not deliberation. Deliberation might *improve* individual competence or break harmful dependencies—but that’s beyond the theorem’s scope.
