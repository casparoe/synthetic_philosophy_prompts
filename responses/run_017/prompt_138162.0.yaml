   "Mr. A, a 50-year-old man with a history of chronic pain due to neuropathy, is admitted for a trial of low-dose ketamine infusion to manage his pain. He has a known lesion in the right posterior insula from a prior stroke, which has caused pain asymbolia. During the infusion, he reports a persistent, low-intensity (2/10) burning sensation in his feet (his usual neuropathic pain) that he describes as 'barely there'. He says it doesn't bother him at all, he feels no urge to escape it, and he finds it mildly interesting. However, he also reports that the sensation is constantly present in his awareness, making it difficult for him to focus on anything else — he cannot concentrate on reading a magazine or following a television program because the pain sensation, though faint, keeps 'pulling his mind back'. He is alert, oriented, and cooperative, and his reports are consistent across multiple assessments."

   Now, check the accounts:

   1. Intensity account: The pain is low intensity (2/10). Therefore, the intensity account says it has negligible disvalue.

   2. Aversion account: The patient reports it doesn't bother him, he has no urge to escape, so the aversion account says negligible disvalue.

   3. Occupancy account: The pain is taking up a large portion of his conscious capacity — he cannot focus on other things because it keeps pulling his attention. Therefore, the occupancy account says there is substantial disvalue because his mental workspace is dominated by this pain.

   But is this realistic? We have a low-intensity pain that is very attention-grabbing. The ketamine might cause this by altering attentional networks. Also, the pre-existing asymbolia lesion removes the aversion.

   However, the problem: the occupancy account might be challenged because the badness comes from the inability to focus on other things, which might be seen as a downstream harm (lost opportunity to read or watch TV). But the instruction says: "whatever badness there is must be badness of the episode itself, at the time." The episode of pain is bad because it monopolizes consciousness at that moment, preventing engagement with other conscious activities. Is this badness at the time? Yes, because the subject is having an experience that is impoverished by the pain's occupancy. But note: the instruction forbids "downstream" harms like lost sleep or missed work later. The inability to concentrate on the magazine at that moment is not downstream; it's concurrent.

   However, the objection might be that this is a consequentialist harm: the pain causes the loss of other experiences. But the occupancy account is precisely about the pain taking up mental room, so that loss is inherent to the account.

   We must avoid the case being resolved by saying the patient is confused. We state he is alert and oriented.

   Let's write the case in one paragraph:

   "Mr. B, a 60-year-old man with a history of insular stroke causing pain asymbolia, is recovering from a minor surgical procedure under spinal anesthesia. He is given a low-dose, continuous infusion of ketamine (0.1 mg/kg/h) for postoperative pain management. He reports a constant, low-intensity (1-2/10) pressure sensation at the surgical site, which he localizes precisely and describes as 'barely noticeable'. He states unequivocally that it does not bother him and he feels no desire for it to stop, even smiling when asked about it. However, he also reports that this sensation is 'impossible to ignore' and involuntarily occupies the majority of his attention, preventing him from engaging in conversation or even watching television because his focus is constantly drawn back to the sensation. He is fully alert, oriented, and cooperative, and his reports are consistent and credible."

   Now, the check:

   Intensity account verdict: The pain is bad only to a negligible degree because its sensory intensity is very low (1-2/10).

   Aversion account verdict: The pain is bad only to a negligible degree because the subject reports no distress and no motivation to stop it.

   Occupancy account verdict: The pain is bad to a substantial degree because it involuntarily occupies a large portion of the subject's conscious capacity, preventing him from engaging in other conscious activities at that time.

   The feature doing the work: The pain's property of being impossible to ignore, i.e., its high attentional demand despite low intensity and no aversion.

   If we remove this feature (and change nothing else): Suppose the pain is still low intensity and the patient has asymbolia (so no aversion), but now the pain does not capture attention. Then the patient would be able to engage in other activities. In that case, the occupancy account would also say the pain is not bad (or negligible) because it doesn't occupy much conscious capacity. Then all three accounts would agree: the pain is not bad (or only trivially bad). This is the unremarkable asymbolic patient.

   Strongest objection from an intensity or aversion theorist:

   "The occupancy account confuses a causal consequence of the pain — the inability to attend to other things — with the pain's intrinsic badness. The pain itself, in virtue of its low intensity and lack of aversion, is not bad. The badness, if any, lies in the loss of other experiences (like watching TV) which is a downstream harm. But the case forbids downstream harms. Moreover, the occupancy account is smuggling in a consequentialist consideration: the pain is bad because it causes something else (loss of attention to other things). But the assignment is to find the badness of the pain episode itself. Therefore, the occupancy account fails to isolate a badness intrinsic to the pain."

   Reply by the occupancy theorist:

   "The badness is not downstream. The pain episode is bad at the time because it monopolizes the subject's conscious field. The subject's experience at that time is impoverished: his consciousness is filled with the pain sensation to the exclusion of other experiences. This is an immediate, intrinsic feature of the pain episode — the pain is bad because it crowds out other potential contents of consciousness at that very moment. This is not about future consequences but about the structure of the subject's conscious state at the time. The pain is bad because of how it occupies the subject's mind, not because of what it leads to later. Moreover, the loss of other experiences is not a separate harm; it is the flip side of the pain's occupancy. The pain itself is bad in virtue of its high occupancy, which is a feature of the episode."

   Does this reply reinstate consequentialism? It does not, because the harm is concurrent: the subject is having a less rich conscious experience at the time. There is no future harm; the harm is in the moment.

   However, the objector might press: why is having one's attention occupied by a sensation (that is not disliked) bad? The occupancy theorist must argue that it is bad to have one's attention involuntarily monopolized by a sensation, even if the sensation is not unpleasant. But that might be controversial.

   But that is the point of the account: the involuntary conscription of limited conscious resources is bad in itself.

   This reply does not rely on any downstream harm, so it should be acceptable.

   Let me adjust the case to be even clearer on the concurrent harm: The patient is not missing out on future activities, but on concurrent ones (like the conversation happening right then). And the harm is the experience of being trapped in the sensation at that moment.

