  4. **Critique of idealizing assumptions (Correct, 4/4):**  
     - Claims: Notes p-hacking inflates α, publication bias distorts π, "quiet file drawer" remains (null replications unpublished), sensitivity drops to 64%, and replication failures may reflect effect heterogeneity.  
     - Verdict: **Excellent**. Hits all requested elements, including cost (reduced sensitivity) and real-world limitations.  
