  #### **Part (a) (7/8 points)**  
  **Allocation Proposal (8 points total):**  
  - Single-run FDR calculation (2 pts)  
  - Dual-run null probability (2 pts)  
  - Dual-run non-null probability (2 pts)  
  - Total published findings and FDR comparison (2 pts)  

  **Grading:**  
  1. **Single-run FDR (Correct, 2/2):**  
     - Claim: Nulls yield 0.04 significant findings, non-nulls 0.16, total significant 0.20, FDR = 0.04/0.20 = 20%.  
     - Verdict: **Correct**. Arithmetic and reasoning are flawless.  
     - Marginal Note: None needed.  

  2. **Dual-run null probability (Correct, 2/2):**  
     - Claim: For nulls, probability both significant and same direction = 2 × (0.025)² = 0.00125; weighted contribution = 0.80 × 0.00125 = 0.001.  
     - Verdict: **Correct**. Directional tails properly handled (each one-sided tail α = 0.025).  
     - Marginal Note: None.  

  3. **Dual-run non-null probability (Defensible but minor error, 1/2):**  
     - Claim: Non-null success rate = 0.80 × 0.80 = 0.64; weighted contribution = 0.20 × 0.64 = 0.128. Ignores wrong-direction probability as negligible (Φ(−1.96 − 2.80) ≈ 10⁻⁶).  
     - Verdict: **Defensible but overstated**. Approximation is reasonable (true probability ≈ 0.64 - negligible error), but the calculation assumes effects are perfectly symmetric and directionally aligned. Under the given power (80% at α=0.05), the effect size δ ≈ 2.80 (since Φ(2.80) ≈ 0.997, power = 1 - Φ(1.96 - δ) = 0.80 → δ ≈ 2.80). Wrong-direction probability = [Φ(−1.96 − δ)]² ≈ [Φ(−4.76)]² ≈ (3 × 10⁻⁶)² ≈ 10⁻¹¹, negligible. However, the answer omits that this assumes the effect direction is known/predicted; if non-nulls could have effects in either direction, the calculation would differ.  
     - Marginal Note: *"Clarify: This assumes all non-null effects are positive (or all negative); if effects could oppose, success probability would be lower."*  
     - Deduction: -1 for omitted nuance.  

  4. **Total published and FDR (Correct, 2/2):**  
     - Claim: Total published = 0.001 + 0.128 = 0.129; FDR = 0.001/0.129 ≈ 0.8% (25-fold drop).  
     - Verdict: **Correct**. Arithmetic exact (0.001/0.129 ≈ 0.775%), and "under 1%" is appropriate.  
