     - Verdict: **Defensible but incomplete**. Correct that lowering α (e.g., to 0.0025) in a single run would achieve similar FDR reduction (FDR ≈ 0.8% if α=0.0025, power≈0.286, using same math). However, the answer misses this equivalence. Raising power alone (e.g., to 99%) reduces FDR less dramatically (e.g., to ≈5%).  
