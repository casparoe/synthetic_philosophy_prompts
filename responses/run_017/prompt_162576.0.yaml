   - The driver must decide whether to trust the hitchhiker's promise without any external enforcement.
   - We want students to confront the idea that at the moment of payment, the hitchhiker has no reason to pay (from a self-interested perspective) and that the only solution might be to become the kind of person who pays regardless of reasons at that moment.

   Constraints:
   - No phones, no real money (use raffle tickets or chocolate as incentives).
   - Stakes: high enough that paying "hurts a little" but not so high that grandstanding occurs.
   - Enforce anonymity and one-time interaction.
   - Include weak substitutes for commitment (like a public pledge) that fail, to push students toward the idea of changing one's disposition.
   - Have drivers judge credibility without being told how.
   - Hitchhikers write a sentence explaining their decision before acting.

