  ### Activity Design: "The Stranded Traveller Game"  
  **Objective:** Illustrate the core dilemma of Parfit's hitchhiker without explicit lecturing. Students experience the tension between immediate self-interest and credible commitment, leading to the insight that solving the problem may require becoming a person whose actions are not reason-responsive at the critical moment.  

  ---

  #### **Rules & Materials**  
  - **Participants:** 14 students (7 pairs of Hitchhikers [H] and Drivers [D]). Adjust for 15 students by having one observe or assist.  
  - **Materials:**  
    - ID cards (1–14) for anonymity.  
    - Raffle tickets (base: 20 tickets/student; stakes: 1 ticket ≈ 1 entry for a prize).  
    - Forms: Promise forms (Stage 1), decision forms (Stage 2), reason slips.  
    - Two hats for role/pair assignment.  
  - **Payoffs (Game-Only, Added to Base 20 Tickets):**  

    | Role            | No Lift | Lift + Payment | Lift + No Payment |  
    |-----------------|---------|----------------|-------------------|  
    | **Driver (D)**  | 0       | +10            | –10 (no deposit) or –5 (deposit) |  
    | **Hitchhiker (H)**| 0       | +10            | +30 (no deposit) or +25 (deposit) |  

    - **Deposit Mechanic (Weak Commitment):** H can optionally pay 5 tickets upfront. If paid, final payment reduces to 15 tickets. Driver’s loss if H reneges: –5 instead of –10.  
    - **Public Pledge (Weak Commitment):** H can opt for facilitator to announce, *"H in Pair [X] pledges payment."*  

  ---

  #### **Timeline (90 Minutes)**  
  **0–10 min: Setup**  
  - Assign roles: Draw "H" or "D" from a hat. Assign pair numbers (1–7) via random draw.  
  - Distribute ID cards and base raffle tickets (20 tickets each).  
  - **Key Script:** *"You’ll interact anonymously once. Your pair number is your only identifier. No future interactions."*  

  **10–25 min: Stage 1 (H’s Promise)**  
  - H completes a promise form:  
    > *"I, H of Pair [X], promise to pay upon arrival. I offer:  
    > [ ] Public pledge (announced to class).  
    > [ ] Deposit (pay 5 tickets now)."*  
  - Facilitator collects forms. Announces public pledges (e.g., *"Pair 3 H pledges"*). Collects deposits, transfers 5 tickets to corresponding D.  

  **25–35 min: Stage 1 (D’s Decision)**  
  - D receives a form:  
    > *"Your H’s promise: [Text].  
    > Commitment: [None/Pledge/Deposit/Both].  
    > Give lift? [ ] Yes [ ] No"*  
  - D submits decision. Facilitator tallies.  

  **35–40 min: Transition**  
  - Facilitator announces pairs proceeding to Stage 2 (e.g., *"Lifts given to Pairs 1, 4, 7"*).  

  **40–50 min: Stage 2 (H’s Payment)**  
  - H in lift-receiving pairs decides: Pay or not? Submits form:  
    > *"Pay? [ ] Yes [ ] No. Reason (one sentence): ________________"*  
  - Facilitator collects reason slips separately.  

  **50–60 min: Calculate Payoffs**  
  - Adjust raffle tickets based on outcomes.  

  **60–90 min: Debrief**  

  ---

  #### **Debrief Structure**  
  **1. Surface Reactions (10 min)**  
  - Ask drivers: *"Why did you trust (or not)? Did pledges/deposits matter?"*  
  - Ask hitchhikers: *"Why did you pay (or not)?"*  
  - **Anticipated Responses:**  
    - D: *"I trusted H’s pledge,"* or *"Deposit made me feel safer."*  
    - H (paid): *"I said I would,"* or *"I’d feel guilty."*  
    - H (not paid): *"Paying hurt me, not paying helped."*  

  **2. Map Activity to Dilemma (10 min)**  
  - **Aggregate Results:** Display totals (e.g., *"3/7 lifts given; 1/3 Hs paid"*). Highlight:  
    - **Round 1 (No Commitment):** Most Ds refuse lifts → mutual loss (0,0).  
    - **Weak Commitments Fail:** Deposits reduce D’s loss but don’t eliminate H’s incentive to renege. Pledges lack enforcement.  
    - **Key Moment:** H who paid *despite cost* (e.g., *"I said I would"*) vs. H who admitted self-interest.  

  **3. Separate Three Solutions (10 min)**  
  | **Solution Type**       | **Activity Example**                     | **Why It Fails**                          |  
  |--------------------------|------------------------------------------|-------------------------------------------|  
  | **1. Fix Payoffs/Institutions** | *"I’d sign a binding contract"*          | Banned; no external enforcement exists.   |  
  | **2. Stick to a Plan**   | *"I resolved to pay"*                    | At Stage 2, reasons lapse → rational to break. |  
  | **3. Change Motives**    | *"I paid because I’d feel bad"*          | The only stable fix: Motive isn’t reason-responsive. |  

  **4. Connect to Parfit’s Problem (10 min)**  
  - Reveal the hitchhiker analogy:  
    > *"You faced Parfit’s hitchhiker dilemma: The traveller must credibly commit to pay when payment is against their interest. Today, weak fixes (pledges/deposits) failed, just like unenforceable promises in real life."*  
  - **Critical Insight:**  
    - Drivers judged *"the type of person"* (e.g., *"She looked trustworthy"*).  
    - Paying H’s acted from *dispositions* (guilt/honor), not Stage 2 self-interest.  
    - **Disturbing Claim:** To solve this, you must become someone who *doesn’t respond to reasons* at the critical moment.  

  **5. Address Limitations (5 min)**  
  - **Blurred Self-Conflict:** The activity splits one person’s conflict (traveller) across two roles. Students may see it as "trusting others" not "trusting future selves."  
  - **Facilitator Fix:** Emphasize:  
    > *"The H’s Stage 2 choice mirrors your future self asking, ‘Why keep a costly promise when reasons have lapsed?’ Becoming ‘the type who pays’ means your future self isn’t weighing reasons—it’s acting from habit or feeling."*  
  - **Student Who Says "I’d Feel Bad":**  
    > *"Exactly! That feeling is the disposition we need. But note: It’s not a ‘reason’—it’s a motive that overrides reasons. The driver trusted you because they guessed you had it."*  

  ---

  #### **Predicted Problems & Mitigation**  
  1. **Students pay despite stakes:**  
     - *Fix:* Use meaningful raffle prizes (e.g., $20 gift card). Stress anonymity: *"Your choices are private; I’ll only share aggregates."*  

  2. **Reputation talk:**  
     - *Fix:* Reinforce rules: *"Remember, no future interactions. This is a one-time anonymous pair."* If invoked, ask: *"Would you pay if no one knew?"*  

  3. **All drivers refuse lifts:**  
     - *Fix:* Use results to discuss *why*: *"You anticipated Hs wouldn’t pay. What would make you trust?"* Transition to commitment devices’ inadequacy.  

  4. **"Promises are reasons" student:**  
     - *Fix:* Agree but push: *"Why keep a promise when costs outweigh benefits? Is ‘because I promised’ always a trump card?"* Contrast with H’s who reneged.  

  5. **Grandstanding/guilt:**  
     - *Fix:* Calibrate stakes so paying "hurts" (10 tickets = 25% loss). Anonymity reduces performance pressure.  

  ---

  #### **50-Minute Version Cuts**  
  - **Skip deposits** (saves 10 min): Focus only on public pledges.  
  - **Shorten forms:** Pre-fill pair numbers; oral reason sharing instead of written slips.  
  - **Condense debrief:** Focus on aggregate outcomes → link to Parfit (omit Solution Type 1).  
  - **Timeline:**  
    - Setup: 5 min.  
    - Stage 1: 15 min.  
    - Stage 2: 10 min.  
    - Debrief: 20 min (emphasize disposition vs. reasons).  

  ---

  **Why This Works:**  
  - Students *discover* weak commitments fail, pushing them toward the disposition solution.  
  - Reason slips and driver judgments provide concrete debrief hooks.  
  - The activity forces engagement with the lapse of reasons at Stage 2, setting up Parfit’s "rational irrationality" as a revelation, not an assertion.
