answer: |-
  This situation reveals a deeply embedded set of presuppositions about urban governance, property rights, and community belonging. Let's reconstruct the implicit theory, separate settled facts from contested theories, and identify where your "temporal feudalism" critique hits the mark.

  ## Core Presuppositions of the System

  1.  **Property as Sovereignty:** The system presupposes that *ownership* (especially single-family residential ownership) confers near-sovereign rights over the immediate environment. While owners don't control neighbors' internal activities (like family size or home workshops), they are presumed to have a fundamental right to veto *changes to the physical and legal fabric* surrounding them (like rezoning and redevelopment). This elevates the existing built form and land use pattern to a quasi-sacred status.
  2.  **Stakeholder Definition by Proximity & Incumbency:** Standing is overwhelmingly granted to:
      *   **Physical Proximity:** Those living closest to the proposed change are assumed to bear the greatest impact (traffic, noise, shadows, "character") and therefore have the strongest claim to decision-making power.
      *   **Incumbency:** Only *current* residents (owners and sometimes long-term renters) are recognized as legitimate stakeholders. Future residents, potential residents city-wide, and even nearby renters are rendered invisible ("don't exist to the process yet").
  3.  **The Neighborhood as a Fixed Entity with Defendable Interests:** The system presupposes that "the neighborhood" is a static or slowly evolving entity with its own identifiable "character" and interests. These interests are defined primarily by the *current* residents and property owners, who are seen as its legitimate representatives and defenders against "change." The neighborhood's interest is often conflated with preserving the *status quo* physical form and demographic makeup.
  4.  **Change as Inherently Suspicious & Burden of Proof:** Proposing change (especially increased density) carries a presumption of being harmful or disruptive. The burden of proof lies entirely on the developer to overcome opposition, not on opponents to demonstrate quantifiable harm exceeding policy goals. "Sustained opposition" becomes proof enough of harm.
  5.  **Formal Democracy Trumps Policy Goals:** The process prioritizes the *feeling* of local democratic participation (anyone showing up gets a say) over the consistent implementation of broader city-wide policy goals (like housing supply, affordability, sustainability, transit use) outlined in official plans. Vocal minority opposition can override adopted policy.
  6.  **Exclusionary Conception of Community:** "Community" is defined by who is *already there*, physically residing within specific boundaries. It excludes those who *need* to be there (future residents, essential workers priced out) and those impacted city-wide by the lack of housing (e.g., renters facing higher prices due to scarcity).

  ## Where "Temporal Feudalism" Fits & Alternatives

  Your friend's term "temporal feudalism" is a powerful critique of Presuppositions #2 (Incumbency) and #3 (Fixed Neighborhood). It accurately describes the system privileging those who arrived first and conflating their interests with the "right" state of the place.

  *   **Is it *just* an apology for incumbency?** In practice, often yes. The system inherently favors the status quo and those benefiting from it.
  *   **Are there *any* non-self-serving justifications?** A few weaker arguments are sometimes made:
      *   **Knowledge & Investment:** Incumbents have deeper local knowledge and financial investment tied to the area's current state, justifying greater influence. (Counter: Future residents also invest, potentially more; local knowledge can be parochial).
      *   **Stability & Predictability:** Protecting existing residents' expectations provides stability, a social good. (Counter: Excessive rigidity creates generational inequality and stifles necessary adaptation).
      *   **Impact Absorption:** Those physically present bear the immediate, tangible disruption of construction and change. (Counter: The city-wide benefits/costs of *not* building are diffused but often larger; the disruption is temporary, the housing benefit is permanent).
      *   **Thin Communitarianism:** A belief that stable, long-term residents foster stronger social bonds and community cohesion, which is valuable. (Counter: This often excludes renters and newcomers who also build community; healthy communities adapt).

  Even these justifications struggle against the systemic exclusion of future residents and the prioritization of localized veto power over broader societal needs.

  ## Separating Settled, Contested, and My View

  | **Claim**                                                                 | **Status**                     | **Notes**                                                                                              |
  | :------------------------------------------------------------------------ | :----------------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Rezoning typically requires public hearings**                           | **Settled Fact**               | Standard legal/political process in most US/Canadian municipalities.                                   |
  | **"Sustained opposition" often kills projects, even compliant ones**      | **Settled Fact (De Facto)**    | Widely observed political reality, though formal rules may differ.                                     |
  | **Only current residents/owners have formal standing at hearings**        | **Settled Fact**               | Legal standing rules prioritize proximity and current residency.                                       |
  | **Future residents have no standing in the process**                      | **Settled Fact**               | They are legally invisible until they move in.                                                         |
  | **Cities often have official plans promoting density near transit/cores** | **Settled Fact**               | Common planning policy goal.                                                                           |
  | **"Neighborhood character" is a dominant concern in opposition**          | **Settled Fact (Empirical)**   | Well-documented phenomenon in NIMBYism research.                                                       |
  | **"Temporal Feudalism" accurately describes power dynamics**              | **Contested / My View**        | Incumbency advantage is settled; "feudalism" framing is my analytical lens.                            |
  | **The system inherently privileges property owners over renters**         | **Contested / My View**        | Owners have more resources/stake, but process design amplifies this advantage.                         |
  | **Prioritizing local voice over policy undermines city-wide goals**       | **Contested / Strong Consensus** | Common critique among planners/housing advocates; contested by neighborhood defenders.                 |
  | **Exclusion of future residents is a fundamental flaw**                   | **Contested / My View**        | Planners often acknowledge this; defenders see it as practical necessity.                              |
  | **The burden of proof is unfairly on change**                             | **Contested / Growing Consensus** | Central critique in pro-housing reform movements.                                                      |
  | **"Community" should include future residents & city-wide needs**         | **Contested / My View**        | Emerging view in YIMBY/social justice planning; countered by localist perspectives.                    |
  | **Current processes exacerbate housing crises & inequality**              | **Contested / Strong Consensus** | Widely accepted among economists, many planners, housing researchers; contested locally.               |
  | **Alternatives (e.g., provincial override, by-right zoning) are viable**  | **Contested**                  | Major political battle between local control advocates and housing supply reformers.                   |

  ## In Essence

  The system presupposes that the right to shape the city is primarily held by *current property owners* in *immediate proximity*, whose primary interest is assumed to be *defending the physical and social status quo* of their defined "neighborhood." This grants them a de facto veto power rooted in temporal priority ("got there first") and existing property arrangements ("built form"), creating the "temporal feudalism" you observe.

  **This setup strictly commits to:** Prioritizing current resident voices in formal processes, requiring community input for rezonings, and granting significant weight to localized opposition based on perceived impacts. It presupposes property ownership as a key source of standing and "neighborhood character" as a legitimate planning concern.

  **It is compatible with, but doesn't strictly require:** The extreme imbalance favoring incumbents over future residents, the conflation of neighborhood interests solely with anti-change sentiment, or the effective veto power that overrides adopted policy. Different theories could justify the *input* mechanism without accepting the *outcome* dominance of NIMBYism. For example, a stronger mayor or regional body could still hold hearings but then approve compliant projects decisively.

  Your frustration is rooted in seeing the gap between stated policy goals (density, welcoming newcomers) and a process that empowers a specific subset of current residents to block those very goals in the name of defending a privileged and exclusionary version of "community." The implicit theory prioritizes the perceived stability of the present over the needs of the future and the rights of those not yet here.
