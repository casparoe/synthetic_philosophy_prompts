     We change the plan: we will have only events that are resolved by draws from urns or coin flips. But we label them as Type C if they are unique and not part of a long run? The students are decision-theory trained, so they will assign probabilities anyway.

     We hope that for Type B (the ambiguous urn) they will exhibit wider spreads or choose "no comparison" more often.

     So we proceed with 10 events: 4 Type A, 2 Type B, 4 Type C. We call them:

          Type A:
            A1: Draw a heart from a deck. (p=0.25)
            A2: Roll a die, get even. (p=0.5)
            A3: Draw a red ball from Urn A (30 red, 70 blue). (p=0.3)
            A4: Draw a blue ball from Urn A. (p=0.7)

          Type B:
            B1: Draw a red ball from Urn B (unknown, between 20 and 80 red). 
            B2: Draw a blue ball from Urn B.

          Type C:
            C1: The coin flip (by the instructor) will be heads. (p=0.5, but we call it one-off? But it's known. We want to see if they treat it differently.)
            C2: The die roll (by the instructor) will be >=4. (p=0.5)
            C3: The number of students in the room is even. (exactly 16? then p=0.5 if we count? But they know the number? They know there are 16, so they know the answer. So not uncertainty.)

          We must have uncertainty in Type C. So for C3, we ask: "The number of students in the room is even." But they can count. So no uncertainty.

          Instead, we ask: "The instructor will draw a card from the deck and it will be a heart." (known p=0.25) -> Type A.

     Given the difficulty, we redefine the types:

          Type A: Events with known and precise probability.
          Type B: Events with probability that is known to be in an interval but not precise.
          Type C: Events with no known probability because they are unique and not part of any reference class (and we cannot resolve in class) -> we will not include them because we cannot score.

     So we drop Type C and replace with:

          Type C: Events that are unique but can be resolved by a future action that is taken to be random (even if they know the probability) but we will not provide the probability and hope they treat them as unique.

          Example: 
            C1: The instructor's coin flip will be heads. (We do not tell them the coin is fair? But they will assume it is fair.)

          We can try to make some that are not obviously random:

            C1: The instructor's next breath will be an inhale. (But it's not random.)

          We decide to include events that they might feel are random even if they know the probability, but we hope that for these they might still feel uneasy because they are one-off.

     We will have:

          C1: The coin flip by the instructor at the end will be heads. (p=0.5)
          C2: The die roll by the instructor at the end will be exactly 4. (p=1/6)
          C3: The top card of the shuffled deck is the ace of spades. (p=1/52)
          C4: The instructor will draw a red ball from Urn A. (p=0.3)

          But C4 is Type A.

     This is not working. We realize that the students, being trained in decision theory, will assign the known probabilities. So we have to rely on Type B for the ambiguity and hope that for Type C they at least choose the fixed option more often? Or have wider spreads.

     Phase 1 procedure (25 minutes):

          0. (5 minutes) Explain the rules and scoring. Hand out the 10 event cards.
          1. (10 minutes) Students work individually to either post a spread (two numbers) or write "NC" for each event.
          2. (5 minutes) Collect the cards.
          3. (5 minutes) Resolve the events by drawing balls, flipping coins, etc. (We do one draw for each urn and then use that draw for all events about that urn. For the deck, we shuffle and draw one card for all events about the deck.)

          But note: we have multiple events per urn. For example, Urn A: we have A1 (heart from deck) and A3 (red from Urn A) and A4 (blue from Urn A). We also have a die roll for A2 and C2.

          We will resolve each event independently? But some are the same random variable. For example, A3 and A4 are complementary. We draw one ball from Urn A: if it's red, then A3 occurs, A4 does not.

          Similarly, for the deck: we draw one card. Then:
            A1: heart? -> if the card is heart, then occurs.
            C3: ace of spades? -> occurs if the card is the ace of spades.

          We can do one draw per random device and then use it for all events that depend on it.

          Steps for resolution:

            - The deck: shuffle and draw one card. Then:
                 A1: heart? -> check the card.
                 C3: ace of spades? -> check the card.
            - Urn A: draw one ball. Then:
                 A3: red? -> check the ball.
                 A4: blue? -> check the ball.
            - Urn B: draw one ball. Then:
                 B1: red? 
                 B2: blue?
            - Die roll: roll once. Then:
                 A2: even? 
                 C2: exactly 4?
            - Coin flip: flip once. Then:
                 C1: heads?

          And for C4: we already drew from Urn A, so it's known? But C4 is not included.

          So we have 10 events:

            A1: deck heart -> use deck draw.
            A2: die even -> use die roll.
            A3: Urn A red -> use Urn A draw.
            A4: Urn A blue -> use Urn A draw. (Note: if Urn A draw is red, then A3 occurs, A4 does not.)
            B1: Urn B red -> use Urn B draw.
            B2: Urn B blue -> use Urn B draw.
            C1: coin heads -> use coin flip.
            C2: die exactly 4 -> use die roll.
            C3: deck ace of spades -> use deck draw.

          We have only 9. We add one more:

            C4: Urn B ball is not green -> always true. (But then it's 1, so not ambiguous.) We skip.

          So we have 9 events.

          Scoring:

            For each student and each event, we calculate their score for that event based on their response and the outcome.

            If they chose NC: score = 0.5.
            If they chose [b,a]: score = 1 - (mid - y)^2 - 0.5*(a-b), where y=1 if the event occurred, 0 otherwise.

          Then we sum the scores over the 9 events.

          We'll announce the winner (highest total score) at the beginning of the next phase.

     Phase 2: The Convention Game (25 minutes)

     We want to illustrate the formation of a convention around an arbitrary anchor.

     We design a game where the students must guess a number between 0 and 100, and the winner is the one closest to 2/3 of the average. This is a beauty contest. But we fear they will treat it as iterated reasoning.

     We modify: We will have multiple rounds. In each round, they guess a number. The target is p * (average guess), where p is a multiplier. The winner is the closest to the target.

     We will run three treatments:

          Treatment 1: p=2/3, and we provide a public signal: we draw a random number from a hat and announce it as a "focal point" but it is irrelevant. We expect that the number will anchor the guesses.

          Treatment 2: We withhold the public signal from half the room. Half get a signal, half don't. We then see if the convention breaks.

          Treatment 3: We withdraw the public signal entirely.

     How to provide a public signal? We can have the instructor draw a number from an envelope that is labeled "random number" but is actually arbitrary (say, 50). We announce: "Some people think the number should be around 50." But we don't say why.

     Steps:

          Treatment 1 (Round 1):
            - We announce: "In this round, we will have a public signal. I am drawing a random number from this envelope." Draw a slip that says "50". Announce: "The public signal is 50."
            - Explain the game: "Each of you will guess a number between 0 and 100. The winner is the one whose guess is closest to 2/3 of the average of all guesses."
            - They submit guesses.
            - We compute the average, then 2/3 of the average, then find the winner.

          Treatment 2 (Round 2):
            - We split the room into two groups: Group A and Group B. We move Group B to one side of the room and Group A to the other.
            - We announce: "This round, we will provide a public signal to only Group A. Group B will not receive a signal."
            - We give Group A a new public signal (draw from an envelope, say 70).
            - Group B gets no signal.
            - They submit guesses.

          Treatment 3 (Round 3):
            - We announce: "This round, there is no public signal for anyone."
            - They submit guesses.

     We then compare the guesses and the resulting averages and targets.

     We hope to see:
          Round 1: Guesses cluster around 2/3 of 50? Actually, the Nash equilibrium is 0, but with a public signal, they might anchor on 50 and then guess 2/3 of 50 = 33, then 2/3 of 33, etc. But the signal might anchor the average.

          Round 2: Group A might anchor on 70, while Group B might not have an anchor and might guess lower (toward 0). This might break the convention.

          Round 3: Without any signal, the convention might break further.

     However, the students might recognize the game and play Nash immediately.

     To prevent that, we change the multiplier in each round? But then it's not the same game.

     We keep the multiplier at 2/3 for all rounds.

     Timeline for Phase 2:

          0. (5 minutes) Explain the rules for Round 1 and the public signal. Then collect guesses (2 minutes).
          1. (3 minutes) Compute and announce the average and the winner.
          2. (5 minutes) Round 2: Split the room, explain, collect guesses.
          3. (3 minutes) Compute and announce for Group A and Group B separately? Or jointly? The game is still one room: the average is of all guesses? But then Group A and Group B are playing together. We want to see if Group A guesses higher because of the signal. We will compute one overall average and target. But then the signal is only given to half, so it might not anchor the whole room.

          4. (5 minutes) Round 3: Explain no signal, collect guesses.
          5. (2 minutes) Compute and announce.

     Phase 3: Debrief (15 minutes)

     We then have 5 minutes buffer.

     Honest account of what might go wrong:

          Phase 1:
            - Students might not use the "no comparison" option because they feel they should be able to assign a number. (They are decision-theory trained.)
            - For Type B events, they might try to form a prior (e.g., uniform over [20,80]) and then state a point estimate and a narrow spread. They might be annoyed if the scoring rule penalizes a wide spread when they are forced to be uncertain.
            - Someone might try to arbitrage by setting very wide spreads for all events and then hoping to cover? But the scoring rule makes wide spreads costly.

          Phase 2:
            - A confident student might try to coordinate the room to guess 0. This would break the anchor.
            - They might recognize the beauty contest and immediately guess 0.

     How to handle without lecturing:

          Phase 1: 
            - If they ask why they would ever choose "no comparison", we can say: "The option is there if you feel you cannot assign a meaningful spread. It's your choice."
            - If they try to arbitrage the spreads, we let them, and then they will see that wide spreads yield low scores.

          Phase 2:
            - If a student tries to coordinate, we can say: "You are allowed to discuss, but please submit your guess individually and without coercion."
            - If they guess 0, then the average might be low and the winner might be close to 0. We can then point out that in the first round, if the public signal caused guesses to be higher, then the anchor worked.

     Debrief:

          We map the activity to Keynes:

            Phase 1, especially the "no comparison" option and the wide spreads for Type B events, is meant to show:
               - That for some events, we cannot assign a precise probability (non-comparability).
               - That probability is not a frequency (Type C events might be assigned a number, but it's not a frequency because they are one-off).
               - That the amount of evidence matters: for Type A, they have a lot of evidence, for Type B, they have bounds, for Type C, they might have little.

            Phase 2 is meant to show:
               - The formation of a convention around an arbitrary anchor (the public signal) in the face of uncertainty.
               - The fragility of the convention when not everyone has the anchor.

          Specifically:

            Minute 60: We start debrief.

            We show the data from Phase 1:
               - For each event, the average spread width and the frequency of "no comparison".
               - We expect: 
                      Type A: narrow spreads, few NC.
                      Type B: wider spreads, more NC.
                      Type C: maybe in between.

            We then ask:
               - "Why did you sometimes choose not to assign a spread? What was different about those events?" 
                    --> We want them to say they had no basis for a number.

               - "Did you feel that for the urn with unknown composition, you could still assign a probability? Or did you feel it was inherently not measurable?"
                    --> We want to highlight non-comparability.

            Then we show the data from Phase 2:
               - The guesses in Round 1: likely clustered around 33 (if they anchored on 50) or lower.
               - In Round 2: Group A might have guessed higher than Group B, and the overall average might be pulled up by Group A.
               - In Round 3: guesses might be more dispersed.

            We ask:
               - "In Round 1, did the public signal affect your guess? How?"
               - "In Round 2, if you were in Group A, did you use the new signal? If in Group B, how did you guess without a signal?"
               - "In Round 3, what did you use as an anchor?"

            Then we connect:
               - The public signal is an arbitrary convention, but it becomes focal. When the convention is disrupted (some have it, some don't), it becomes unstable. When removed, it vanishes.

            Finally, we state the Keynesian claims explicitly.

     What the activity cannot reproduce:

          1. The objective logical relation view of probability: we haven't provided any examples of logical probability. The scoring rules are for personal degrees of belief.
          2. The institutional facts of real markets: our market is very simplified. In particular, the "no comparison" option is artificial.

     We will have to state:

          1. Keynes's view that probability is an objective logical relation between a body of evidence and a conclusion. In our activity, we treated probability as a personal degree of belief, which is more aligned with subjective probability. We can mention that for Keynes, two people with the same evidence should have the same probability, but in our activity, we allowed variation.

          2. In real markets, conventions are sustained by complex institutional factors and common knowledge that we cannot simulate in a classroom.

     Timeline for the whole seminar:

          0:00 - 0:05: Introduction to the activity (both phases) and rules for Phase 1.
          0:05 - 0:15: Students work on Phase 1 (spreads for 10 events).
          0:15 - 0:20: Collect responses and resolve events (draw balls, flip coin, etc.). 
          0:20 - 0:25: Compute scores and announce the winner of Phase 1 (but we don't give the prize yet).

          0:25 - 0:30: Explain Phase 2, Round 1.
          0:30 - 0:32: Round 1: submit guesses.
          0:32 - 0:35: Compute and announce results for Round 1.
          0:35 - 0:40: Explain Round 2, split the room, give signal to Group A.
          0:40 - 0:42: Round 2: submit guesses.
          0:42 - 0:45: Compute and announce results for Round 2.
          0:45 - 0:50: Explain Round 3.
          0:50 - 0:52: Round 3: submit guesses.
          0:52 - 0:55: Compute and announce.

          0:55 - 1:15: Debrief.

     This is 75 minutes.

     We hope this works.
answer: |-
  ### Refined Seminar Activity: "The Uncertainty Exchange"  
  **Duration:** 75 minutes  
  **Materials:** Paper, envelopes, index cards, whiteboard, two urns (Urn A: 30 red/70 blue balls; Urn B: 100 red/blue balls, exact ratio unknown but bounded between 20-80 red), a deck of cards, a die, a coin, token prize (e.g., a book).  

  ---

  ### **Phase 1: The Spread Market (25 min)**  
  *Objective:* Make students *feel* non-comparable probabilities, evidence-dependent degrees of belief, and the discomfort of ambiguity.  

  #### **Setup (5 min)**  
  - **Events:** Prepare 12 index cards (4 per category):  
    - **Type A (Known frequency):** "Ball from Urn A is red," "Die roll is even," "Card drawn is a heart," "Coin flip is heads."  
    - **Type B (Bounded frequency):** "Ball from Urn B is red," "Ball from Urn B is blue," "Ball from Urn B is red or blue," "10th ball drawn from Urn B (without replacement) is red."  
    - **Type C (One-off/local):** "It will rain in Cambridge tomorrow at 5 PM," "Next college president is female," "Average score in this seminar is >60%," "Room’s door opens inward."  
  - **Rules:**  
    - For each event, students must either:  
      - **Post a spread:** Bid (max they’d pay for a $1 ticket if event occurs) and Ask (min they’d accept to sell the ticket). Bid ≤ Ask.  
      - **Choose "NC" (No Comparison):** Receive a fixed $0.20 (no risk).  
    - **Scoring:**  
      - If they post [Bid, Ask], score = $1 − (Midpoint − Outcome)² − (Ask − Bid).  
      (Outcome = 1 if event occurs, 0 otherwise; Midpoint = (Bid+Ask)/2.)  
      - "NC" = flat $0.20.  
    - Outcomes: Type A/B resolved via draws (e.g., draw 1 ball from Urn A/B); Type C resolved via instructor (e.g., "door opens inward" checked now; weather via post-seminar email).  

  #### **Process (15 min)**  
  1. Students work individually (5 min) to post spreads or "NC" for all 12 events.  
  2. Collect cards. Publicly resolve outcomes: Draw balls, roll die, flip coin, check door (5 min).  
  3. Calculate scores silently; announce top 3 scores (no names) on whiteboard (5 min).  

  #### **Predictable Issues & Handling:**  
  - **"Reconstructing priors for Urn B":** Students will try to calculate exact odds. *Handling:* Note aloud, "Urn B’s composition won’t be revealed—focus on your comfort pricing it."  
  - **Arbitraging spreads:** A student sets wide spreads (e.g., [0,1]) to "cover" outcomes. *Handling:* Let scoring penalize them (wide spreads → low scores; [0,1] yields max $0.25 vs. $0.75 for a confident 0.5).  
  - **"NC" over/underuse:** Confident students avoid "NC"; risk-averse ones overuse it. *Handling:* During scoring, highlight, "Notice how often you opted out—what made you decline to compare?"  

  #### **Keynesian Deliverables (Implicit):**  
  - **Probability ≠ frequency:** Urn B’s ambiguity forces belief without data.  
  - **Non-comparability:** "NC" option exposes events resisting a single scale (e.g., "rain tomorrow" vs. "Urn B ball").  
  - **Evidence ≠ probability:** Same Midpoint for Urn A (strong evidence) vs. Urn B (weak evidence) feels different.  

  ---

  ### **Phase 2: Convention Formation & Collapse (25 min)**  
  *Objective:* Induce visceral understanding of arbitrary conventions as anchors under uncertainty.  

  #### **Process (20 min)**  
  1. **Round 1: Anchor Formation (7 min)**  
     - Publicly draw a random card from an envelope: "Anchor: 50" (written).  
     - Game: Guess a number 0–100. Winner is closest to **2/3 of the average guess**.  
     - *Why 50?* It’s arbitrary—no relevance to the game.  

  2. **Round 2: Partial Withdrawal (7 min)**  
     - Split room. Give Group A a *new* anchor (e.g., "Anchor: 70"); Group B gets *no anchor*.  
     - Same game (2/3 of average).  

  3. **Round 3: Full Withdrawal (6 min)**  
     - No anchor for anyone. Same game.  

  #### **Scoring:**  
  - Each round’s winner (closest to 2/3 average) gets +1 point; track leaders on whiteboard.  

  #### **Predictable Issues & Handling:**  
  - **"Anchoring isn’t rational":** A student argues, "50 is irrelevant—ignore it!" *Handling:* Smile, "You’re free to ignore it, but note what others do."  
  - **Coordinated Nash play:** Students push for 0 (equilibrium). *Handling:* After Round 1, say, "Did the anchor pull guesses away from 0? Why?"  
  - **Group B’s frustration:** "Why don’t we get an anchor?" *Handling:* Post-game, ask Group B, "How did you guess without a signal?"  

  #### **Keynesian Deliverables (Implicit):**  
  - **Conventions as arbitrary anchors:** Public signal (50) becomes a focal point despite irrelevance.  
  - **Fragility:** When some lose the anchor (Round 2), consensus fractures; withdrawal (Round 3) causes drift.  

  ---

  ### **Phase 3: Debrief (15 min)**  
  *Objective:* Explicitly map experiences to Keynes’ distinctions.  

  #### **Script & Connections (10 min):**  
  1. **Spread Market Recap (3 min):**  
     - *"How often did you choose 'NC' for Urn B or 'rain tomorrow'? Why?"* → **Non-comparability:** Some probabilities resist quantification ("risk vs. uncertainty").  
     - *"Who assigned the same Midpoint to Urn A and Urn B events? Did they feel equally confident?"* → **Evidence ≠ probability:** Same number masks differing evidence.  

  2. **Convention Game Recap (3 min):**  
     - *"In Round 1, did the anchor influence guesses even if you knew it was arbitrary?"* → **Conventions as anchors:** Under uncertainty, we latch onto shared signals.  
     - *"What happened when only half had an anchor?"* → **Fragility:** Conventions rely on mutual belief.  

  3. **Key Claims (4 min):**  
     - "Probability = rational belief from evidence, not frequency (Urn B)."  
     - "Uncertainty ≠ risk: Many probabilities aren’t numbers (your 'NC' votes)."  
     - "Conventions emerge when calculation fails—but collapse without consensus."  

  #### **What the Activity Can’t Simulate (5 min):**  
  - **Probability as objective logic:** Keynes saw probability as logical (evidence → conclusion), not subjective. Our spreads *feel* personal—you must *state* that Keynes rejected "degree of confidence."  
  - **Institutional market forces:** Real conventions (e.g., currency values) rely on laws, history, scale. Our game is "conventions in a vacuum"—*note* that real anchors are reinforced by systems.  

  ---

  ### **Minute-by-Minute Timeline**  
  - **0:00–0:05:** Intro + Phase 1 rules.  
  - **0:05–0:20:** Phase 1 (spread/NC decisions, resolve outcomes).  
  - **0:20–0:25:** Phase 1 scoring + top scores.  
  - **0:25–0:30:** Phase 2 rules + Round 1 (anchor: 50).  
  - **0:30–0:37:** Round 1 guesses + resolve.  
  - **0:37–0:44:** Round 2 (split room; Group A anchor: 70).  
  - **0:44–0:51:** Round 3 (no anchor).  
  - **0:51–0:55:** Phase 2 scoring + winner.  
  - **0:55–1:10:** Debrief (student reflections → Keynesian claims).  
  - **1:10–1:15:** Limitations + token prize.  

  ### **Why This Works**  
  - **Ellsberg upgraded:** Urn B + "NC" option forces ambiguity *felt*, not just observed.  
  - **Beauty contest upgraded:** Public anchors make convention formation/dissolution visceral.  
  - **No deception, no stakes:** Pure game dynamics evoke discomfort; scoring rules incentivize truth-telling.  

  This design makes Keynes’ distinctions *lived*—so when you finally name them, they click.
