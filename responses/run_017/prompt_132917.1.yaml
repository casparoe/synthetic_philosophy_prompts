  Okay, let me approach this systematically. The user wants to understand what cosmological practices imply about metaphysical views of time, specifically presentism versus eternalism. 

  First, I need to dissect the key elements of the practice: cosmologists state a single universal age, date events relative to "now," and use one global time axis despite relativistic constraints. The core question is what this commits them to metaphysically.

  Considering strict requirements: the practice absolutely needs a privileged cosmic time slicing. This is mathematically defined through homogeneous hypersurfaces in FLRW models, not just a convention. Without it, phrases like "age of the universe" become meaningless. Presentism could technically adopt this slicing as "the present," but that feels strained since the slicing exists globally while presentism denies reality to non-present times.

  For compatibility: The practice fits eternalism naturally (all slices equally real) and growing block less smoothly but possibly. It actively conflicts with presentism if presentism denies the reality of past cosmic slices. More crucially, it rules out views denying objective temporal distances or durations since the Big Bang - these are calculable facts in the model.

  On the colleague's point: Comoving observers do measure maximal proper time, making the slicing principled. This anchors the "age" concept physically, not just conventionally.

  For pathological spacetimes: In Gödel-type rotating universes with closed timelike curves, global time functions fail. Cosmology would lose the single-age concept and could only speak locally. The practice depends entirely on spacetime geometry permitting global foliation.

  Bottom line: The practice isn't direct evidence for eternalism over presentism, as metaphysical commitments remain separable from the model's structure. But it does require objective cosmic time - which presentism struggles to accommodate naturally while eternalism embraces effortlessly.
answer: |-
  This practice strictly requires a **physically privileged foliation of spacetime into hypersurfaces of cosmic time**. Cosmology relies on the FLRW metric, which defines global hypersurfaces of constant cosmic time (t) based on large-scale homogeneity and isotropy. These slices are *not* arbitrary; they are uniquely determined by the matter distribution (comoving observers). Dating events "before now" and stating a single, global age absolutely depend on this foliation. Without it, "the age of the universe" lacks meaning.

  **Compatibility with Metaphysical Views:**
  1.  **Eternalism:** Fits perfectly. All cosmic time slices (past, present, future) are equally real. The privileged foliation provides the global ordering structure.
  2.  **Growing Block:** Compatible, though less natural. The "growing edge" would coincide with the current cosmic time slice (t = now). The block's structure relies on the foliation.
  3.  **Presentism:** Formally compatible but deeply strained. Only the slice t = now is real. However, the *entire foliation structure* – including past slices used for dating distant events – is crucial to the practice. Presentism must accept this global structure as part of physical reality (even if only one slice is "real") but struggles to explain why the structure exists globally if only the present is real.

  **What it Rules Out:**
  *   Views denying an **objective temporal duration since the Big Bang**. The elapsed proper time for comoving observers *is* maximal and defines "cosmic time." This elapsed time is an objective, invariant quantity for events along comoving worldlines.
  *   Views denying **objective temporal relations (distance/duration)** between us and distant events in the observable universe. Cosmology calculates these durations based on cosmic time and redshift, treating them as facts.
  *   The practice is **incompatible with any view rejecting the privileged cosmic foliation** as physically real structure, not mere convention.

  **Your Colleague is Correct:** The foliation *is* principled. Comoving observers measure the *longest possible* proper time since the Big Bang. This defines cosmic time uniquely in FLRW spacetime, making it far more than a convention; it's a fundamental feature of the model's geometry dictated by the Cosmological Principle.

  **No Global Time Function (e.g., Gödel Universe):**
  In such spacetimes, the core practice **collapses**. Without a global time function:
  1.  "**The age of the universe**" becomes undefined globally. Different observers could trace histories back to an initial singularity along paths yielding different maximal proper times.
  2.  **Dating distant events relative to "now"** loses its unique, global meaning. Simultaneity and temporal order become ambiguous or non-transitive.
  3.  Cosmology could only operate **locally**, perhaps defining ages along specific worldlines or in limited regions, but the grand, unified temporal narrative across the cosmos would be impossible.

  **Bottom Line:** Cosmological dating practice is strong evidence for a physically privileged cosmic time foliation and objective cosmic durations, but it is not direct evidence *for eternalism over presentism* or vice versa; it primarily challenges views denying objective cosmic time structure.
