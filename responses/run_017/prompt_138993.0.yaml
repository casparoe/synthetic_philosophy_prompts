prompt: |-
  ok so I'm taking a classical Chinese philosophy seminar this term and I wrote my short paper on the White Horse dialogue basically arguing that "a white horse is not a horse" is a pun: an artifact of the language (no copula, no articles, and possibly the nouns behaving more like mass nouns than count nouns) plus one equivocation on "is", and that there's no real thesis left once you clean it up. My prof killed it in section in like thirty seconds by just repeating the line as if it were obviously saying something true, muttered something about the compound attribute not being the simple one, and moved on. I didn't get a word in and I'm not even sure what he meant, so now I'm redoing the paper and I want to be fair.

  Can you lay out, as a menu, the different precise things that sentence could be claiming? The ones I can see are: a class/extensional one (the white horses aren't the same set as the horses); a property one (being-a-white-horse isn't the same attribute as being-a-horse); something about perception (what you see is the white, not the horse-ness); and something about requests — if I send someone for a horse they can bring back a brown one, if I send them for a white horse they can't. But I bet I'm missing some, e.g. something about counting and what sorts stuff into individuals, or something modal (this very animal could have been brown). Add whatever I've missed.

  For each reading give me a verdict: platitude, substantive and defensible, or actually false. And for each, name one sentence a speaker of classical Chinese would have to accept or reject for that reading to be refuted — i.e. what would count as evidence against it, not just against the others. Then the part I really need: which reading does my prof have to be using for the line to do the work he used it for (dismissing the equivocation story), and does that reading hold up, or does he need a stronger one than the one he'd defend if you pressed him? Also: which readings survive even if the no-copula / mass-noun story about the language is completely right — does that hypothesis kill the whole thing or just move the interesting part somewhere else? And which reading is the one people who repeat the line are usually reaching for, versus the one that would be worth defending.

  Please don't just tell me there's a lot of secondary literature on this — I want the readings themselves and what's wrong with each. (sorry if this is rambly, writing it on my phone between classes)
