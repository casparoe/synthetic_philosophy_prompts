  **UNIVERSITY OF WEST PLAINS**  
  **DEPARTMENT OF PHILOSOPHY**  
  **Appendix J-3: Merit Review & Personnel Procedures**  
  *(Revised per Faculty Senate Resolution 19-08: "Causal Parsimony in Institutional Assessment")*  

  ---

  **Section 1: General Principles**  
  1.1 Pursuant to the Principle of Causal Uniqueness (PCU), all personnel evaluations shall attribute outcomes exclusively to the causally sufficient physical substrate (hereafter "Substrate S-1").  
  1.2 Mental state attributions (e.g., "intent," "belief," "desire") shall be recorded under "Annotative Context (Field AC-5)" and shall not factor into scoring, ranking, or determination of outcomes.  
  1.3 The Committee shall utilize Form P-7c ("Physical Causal History Ledger") as the sole evidentiary basis for deliberation. Field AC-5 entries do not require evidentiary substantiation.  

  **Section 2: Annual Merit Raises**  
  2.1 Faculty shall submit accomplishments via Form P-7c, detailing:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Physical behaviors (e.g., keystrokes generating manuscripts; bodily presence at lectures; retinal exposure to student submissions).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Physical outcomes (e.g., journal volume/issue/page numbers; student grade distributions; sensor-recorded office occupancy durations).  
  2.2 Field AC-5 may contain optional descriptors (e.g., "aimed to advance Kantian scholarship"; "wanted to improve pedagogy"). These shall be entered in ≤10pt font.  
  2.3 The Merit Subcommittee shall calculate scores using the *Parsimonious Weighting Algorithm*:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Points are assigned per Substrate S-1 event (e.g., 1 point per peer-reviewed page; 0.5 points per contact hour).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) *Deduction 4.1b:* If Field AC-5 describes an outcome already accounted for in Substrate S-1, 15% of accrued points are voided (redundant causal accounting).  
  2.4 Raise distribution shall correlate strictly with aggregated S-1 point totals. Field AC-5 entries shall be archived in Supplement S-D ("Decorative Context Repository").  

  **Section 3: Letters of Recommendation**  
  3.1 External letters shall be accompanied by Form P-9f ("Epiphenomenal Declarative Certification"), signed by the author, affirming:  
  &nbsp;&nbsp;&nbsp;&nbsp;*"The enclosed statements constitute physical markings (ink/pixels) produced by biomechanical processes. They do not assert causal efficacy of intentional states."*  
  3.2 The Committee shall evaluate letters solely as:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Physical artifacts demonstrating the candidate’s capacity to induce specific neuromuscular responses in referees (scored under S-1 as "referential stimulus yield").  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Non-causal predictors of future S-1 events (e.g., prior letter-production correlates with future manuscript-production at ρ=0.72).  
  3.3 Praise pertaining to mental attributes (e.g., "creative," "diligent") shall be redacted to Field AC-5 of the candidate’s P-7c.  

  **Section 4: Academic Integrity Investigations**  
  4.1 In cases of alleged misconduct (e.g., plagiarism), the Adjudication Subcommittee shall reconstruct:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) **Substrate S-1 Sequence:** Timestamped server logs, keystroke histories, document metadata, optical scans of source/text alignment.  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) **Field AC-5:** A checkbox (☐) denoting whether the accused party self-reports "intentionality."  
  4.2 Determination of responsibility shall rest entirely on S-1. Examples:  
  &nbsp;&nbsp;&nbsp;&nbsp;(a) Uncited text matches ≥30% by character count → Misconduct (S-1 sufficient).  
  &nbsp;&nbsp;&nbsp;&nbsp;(b) Self-checked ☐ in AC-5 → Filed as "non-causal annotation." No penalty enhancement.  
  &nbsp;&nbsp;&nbsp;&nbsp;(c) Unchecked ☐ → Filed identically. No exculpatory weight.  
  4.3 *Exception 4.3a:* If the accused claims "lack of intent" *caused* the omission (e.g., "I forgot due to stress"), this assertion is invalid per PCU. Stress biomarkers may be submitted as S-1 evidence.  

  **Section 5: Committee Deliberation Protocol**  
  5.1 Deliberations are scheduled per University Bylaws but are recognized as non-causal epiphenomena.  
