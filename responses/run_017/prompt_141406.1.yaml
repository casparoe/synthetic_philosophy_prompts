     Intended rule: `symmetry != 'none'`

     Decoy rule: `closed_shape = true` 
          - In the training set, all symmetric figures are closed, and the asymmetric figures are also mostly closed? We have to make sure that in the training set, there is an asymmetric figure that is open, and a symmetric figure that is open? But then the intended rule doesn't require closed.

     To make the decoy rule fit the training set, we need that every symmetric figure is closed and every asymmetric figure is open. But then the intended rule would also be satisfied by accident? No, because an open symmetric figure would be positive by intended rule but negative by decoy rule.

     So let's make the training set for symmetric have only closed figures, and the asymmetric have only open figures. Then the decoy rule `closed_shape=true` would fit exactly the intended classification.

