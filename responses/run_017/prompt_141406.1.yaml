  ### **Property Language (Primitives)**
  - `components`: integer count of connected parts.
  - `closed`: true if the shape has no open endpoints (e.g., circle ✓; U-shape ✗).
  - `dot_inside`: true if a small filled circle is enclosed.
  - `symmetry`: `none`, `horizontal`, `vertical`, or `both` (mirror symmetry only).
  - `size`: `small` (covers <1/3 of the box area), `medium` (1/3–2/3), or `large` (>2/3).
  - `curved`: true if any curve (non-straight) is present.
  - `sides`: number of straight edges (0 for non-polygons; circles = 0).

  ### **Problems**
  1. **Easy: Concept = `dot_inside = true`**  
     - Left (6): Small circle with dot, small square with dot, small triangle with dot, small heart with dot, small star with dot, small rectangle with dot.  
     - Right (6): Large circle, large square, large triangle, large heart, large star, large rectangle (all without dots).  
     - Held-out (8):  
       - *Positive (4)*: Small pentagon with dot, small ellipse with dot, large circle with dot, small cloud with dot.  
       - *Negative (4)*: Large pentagon, large ellipse, small circle, large cloud (all without dots).  
     - Intended rule: `dot_inside = true`  
     - Decoy rule: `size = 'small'` (Fits training: 12/12. Fails held-out: 6/8; misclassifies large-with-dot and small-without-dot).  

  2. **Medium: Concept = `closed = true`**  
     - Left (6): Closed circle (large, no dot), closed square (large, no dot), closed triangle (large, no dot), closed heart (large, no dot), closed star (large, no dot), closed rectangle (large, no dot).  
     - Right (6): Open C-shape (small, with dot), open U-shape (small, with dot), open spiral (small, with dot), open polyline (small, with dot), open zigzag (small, with dot), open bracket (small, with dot).  
     - Held-out (8):  
       - *Positive (4)*: Closed pentagon (large, no dot), closed ellipse (large, no dot), closed circle (small, no dot), closed hexagon (large, no dot).  
       - *Negative (4)*: Open L-shape (large, with dot), open curve (small, with dot), open star (large, with dot), open square (small, with dot).  
     - Intended rule: `closed = true`  
     - Decoy rule: `dot_inside = false` (Fits training: 12/12. Fails held-out: 6/8; misclassifies closed with dot and open without dot).  

  3. **Hard: Concept = `symmetry != 'none'`**  
     - Left (6): Circle (closed, both symmetry), square (closed, both), equilateral triangle (closed, vertical), H-shape (open, vertical), rectangle (closed, both), snowflake (closed, both).  
     - Right (6): Scalene triangle (closed, none), off-center circle with dot (closed, none), open jagged line (open, none), irregular pentagon (closed, none), lopsided heart (closed, none), asymmetric squiggle (open, none).  
     - Held-out (8):  
       - *Positive (4)*: Ellipse (closed, both), letter "A" (open, vertical), star (closed, both), symmetric cross (open, both).  
       - *Negative (4)*: Crescent moon (closed, none), right triangle (closed, none), wavy line (open, none), irregular octagon (closed, none).  
     - Intended rule: `symmetry != 'none'`  
     - Decoy rule: `closed = true` (Fits training: 12/12. Fails held-out: 6/8; misclassifies open-symmetric and closed-asymmetric).

  ### **Rules and Payoffs**
  - **Rule submission**: Boolean expression using the property language (e.g., `closed = true AND dot_inside = false`).  
  - **Scoring**:  
    - Base score: +1 per correct training figure (max 12).  
    - Simplicity penalty: −1 per clause (a clause is a primitive/negated primitive; e.g., `closed = true AND dot_inside = false` = 2 clauses).  
    - Held-out bonus: +1 per correct held-out figure (max 8; added post-lock).  
    - Monster penalty: −5 if a monster is accepted. Patching: +1 clause allowed for −2 points.  
  - **Adjudication**:  
    - Monster = figure satisfying the rule but opposite in spirit. Class majority vote decides.  
    - Rule writers patch once if monster accepted. Repatched rule must refute the monster.

  ### **Timeline (90 min)**
  | Minutes | Activity |
  |---------|----------|
  | 0–5     | Intro: Teams (3–4 students), property language handout, explain goals. |
  | 5–20    | **Problem 1**: Teams write rules. |
  | 20–25   | Rules locked. Score training + simplicity; announce. |
  | 25–35   | Held-out round: Reveal 8 figures; rescore. |
  | 35–50   | **Problem 2**: Teams write rules. |
  | 50–55   | Rules locked. Score training + simplicity; announce. |
  | 55–60   | Held-out round; rescore. |
  | 60–75   | **Problem 3**: Teams write rules. |
  | 75–80   | Rules locked. Score training + simplicity; announce. |
  | 80–83   | Held-out round; rescore. |
  | 83–88   | **Monster round**: Teams swap rules; draw monsters. Vote; apply penalties/patches. |
  | 88–90   | Debrief: Name concepts (eligibility, overfitting, simplicity). |

  ### **Debrief Mapping**
  - **Problem 1**: Held-out exposes decoy rules → Eligibility of properties drives solvability (size is accidental).
  - **Problem 2**: Decoy fits training but fails held-out → Data alone is insufficient; shared assumptions prevent overfitting.
  - **Problem 3 + Monster**: Literal rule matches but violates intent → Eligibility includes "spirit," not just syntax; patching mirrors theory-ladenness.
  - **Final Naming**: Eligibility (which properties are "allowed"), overfitting (decoy rules), simplicity (penalty), monster-barring (patching).

  ### **Predictable Issues & Fixes**
  - **Clause-stuffing**: Teams add clauses to cover edge cases.  
    *Fix*: Simplicity penalty makes this costly; show scoring math.  
  - **Monster disputes**: Students argue if a monster is valid.  
    *Fix*: Instructor moderates vote; emphasize "spirit" over literalism.  
  - **Time crunch**: Rule-writing runs long.  
    *Fix*: Enforce strict timers; use index cards for quick submission.  
  - **Property ambiguity**: e.g., Is a heart "curved"?  
    *Fix*: Instructor is arbiter; clarify definitions upfront.  

  ### **Frank Note**  
  The activity **cannot reproduce** how real-world eligibility agreements form (e.g., cultural/historical context shaping which properties are "natural"). Students experience the *consequence* of eligibility but not its origin. You must supplement with discussion of background knowledge, paradigm shifts, or Wittgensteinian "forms of life."
