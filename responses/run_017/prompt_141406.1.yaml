  We are designing a live classroom activity based on Bongard problems. The key takeaway is that the solvability relies on an implicit agreement about which properties are eligible for rules, more than the data itself.

  **Property Language (6-8 primitives):**
  - `connected_components`: number of connected parts (integer ≥1).
  - `closed_shape`: true if the figure is a closed shape (no open ends), else false.
  - `contains_dot`: true if there is a small filled circle inside the figure, else false.
  - `symmetry`: type of symmetry: `none`, `horizontal`, `vertical`, `both` (meaning both horizontal and vertical).
  - `size_relative`: relative size of the figure in the box: `small`, `medium`, `large` (we define: if the figure occupies less than 1/3 of the box area -> small, 1/3 to 2/3 -> medium, more than 2/3 -> large. Note: For simplicity in drawing, we can use consistent sizes. The instructor will have to draw consistently, but the rule is checkable by eye.)
  - `num_sides`: for polygonal figures, the number of sides (if not a polygon, then 0). We define a polygon as a closed shape made of straight lines.
  - `curved`: true if the figure has at least one curved line, else false.

  Note: We avoid very complex properties. The language is designed to be explicit and checkable.

  **Rules and Payoffs:**

  Each team (we assume 3-4 teams of 3-4 students) writes a rule in the property language. The rule is a boolean expression using the primitives. For example: `connected_components = 1 AND closed_shape = true AND contains_dot = false`.

  Payoff structure (per rule):
  - Base score: +1 for each correctly classified figure in the initial 12 (so max 12).
  - Simplicity penalty: subtract the number of clauses in the rule (a clause is a primitive or a negated primitive, and each AND/OR counts as a separator). For example, `A AND B` has 2 clauses, `A OR (B AND C)` has 3 clauses (because OR and AND separate into three: A, B, C). The penalty encourages concise rules.
  - Held-out round: +1 for each correctly classified figure in the 8 held-out figures (max 8). This is added after the base score.
  - Monster round: if a team's rule is given to an adversarial team and the adversarial team constructs a monster (a figure that satisfies the rule but is clearly in the opposite set), then the original team loses 5 points. The rule-writing team can patch their rule (by adding one clause) to fix the monster at a cost of 2 points (and then the monster is rechecked). Only one patch allowed per monster.

  Adjudication of a monster: The instructor and the class vote. If a majority agrees that the figure is a clear example of the opposite set (despite satisfying the rule as written), then it is accepted.

  **Problems:**

