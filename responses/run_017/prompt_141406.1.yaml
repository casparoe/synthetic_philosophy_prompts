     Then the decoy rule: `contains_dot = false` would classify the left as positive (correct) and the right as negative (correct) -> fits training set. In held-out, if we have:
          Positive held-out: one closed with dot -> intended rule: closed -> positive, decoy rule: contains_dot=true -> negative -> error for decoy.
          Negative held-out: one open without dot -> intended rule: open -> negative, decoy rule: contains_dot=false -> positive -> error for decoy.

     So held-out set for positive: three without dot, one with dot.
     held-out set for negative: three with dot, one without dot.

     Then decoy rule gets: 
          positive held-out: 3 without -> positive (correct), 1 with -> negative (incorrect).
          negative held-out: 3 with -> negative (correct), 1 without -> positive (incorrect).
          -> 6/8.

     Intended rule gets 8/8.

     So that works.

     Problem 2 (Medium): Concept: closed_shape = true.
          Training set:
              Left (closed and without dot): six figures.
              Right (open and with dot): six figures.
