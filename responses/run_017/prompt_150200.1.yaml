answer: |-
  1. **Synchronic argument**: If your fair prices for mutually exclusive outcomes (like A and not-A) don't sum to one, I can structure a portfolio of bets at your quotes that acts as an arbitrage: buying low and selling high across outcomes, locking in a risk-free profit from you, which is your sure loss (PnL ≤ -ε < 0 in all states).  

  2. **Diachronic argument**: If your posterior quote after observing event B doesn't match your prior conditional quote (P(A|B) ≠ P₀(A and B)/P₀(B)), I can trade a conditional bet pre-B and adjust post-B, creating toxic flow: my initial hedge and later mispricing exploit your inconsistency, forcing a sure loss regardless of B's outcome.  

  3. **One-sided bookie algebra**: If P(A) + P(not-A) = s < 1, I sell you a $1 payout bet on A at P(A) and on not-A at P(not-A). You pay s and win $1 regardless of outcome, locking in loss 1-s > 0. If s > 1, I can't force a loss (only selling, no buying back; you decline overpriced bets). Asymmetric vulnerability: only s < 1 is exploitable.  

  4. **Residue report**: Synchronic/diachronic sure losses map directly to arbitrage and toxic flow. The "normative force" (incoherence being irrational even without a counterparty) and "sure loss" (strictly negative PnL in every state, not just bad VaR) have no trading counterpart—they're about belief consistency, not market survival.  

  5. **Verdict**: The residue isn't a defect in your thinking; it reveals that Dutch books argue for logical consistency in beliefs (like avoiding arbitrage in your internal book), beyond empirical exploitation. This is why the argument works normatively but has limited practical bite when you can decline trades.
