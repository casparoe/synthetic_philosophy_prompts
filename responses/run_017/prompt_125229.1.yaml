          System2: Gate1 closed, Gate2 open -> ball goes to Exit A.
          System3: Gate1 open, Gate2 open -> ball goes to Exit B.

     - We also have a fifth system for testing, which has an extra feature: a third gate (Gate3) between Ramp2 and Exit B. In the test system, Gate3 is closed, so if the ball reaches the point to go to Exit B, it is blocked and goes to Exit D instead.

     - The states in the test system: Gate1 open, Gate2 open -> but then it would go to Exit D.

     Observation options:

        - Free: The exits (A, B, C) and the start. They also see the ball being dropped and which exit it comes out of for the training systems.
        - Cost 1 counter: Get a top-view schematic that shows the components (ramps and gates) and their connectivity, but not the states of the gates.
        - Cost 1 counter per gate: Learn the state of that gate (open or closed) in a particular training system. (Note: they have to buy per system per gate.)
        - Cost 2 counters per gate: Measure the exact position and orientation of the gate (which might allow them to infer the state, but also captures irrelevant details like the color or a small scratch).

     In the training systems, they can run the experiment for free to see the outcome, but they don't see the inside.

     For the test system, they cannot run it until they predict.

     Groups and Roles:

     - We have 14 participants. Divide into 3 groups (4-5 people each).
     - Each group has to decide what to observe and then make a prediction for the test system.
     - They start with 10 counters each.

     Procedure for Round 1:

        0. Introduction (5 minutes): Explain the task. They will study training systems to build a model, then predict a test system.

        1. Observation phase (20 minutes): Groups can purchase information about the training systems. They can also choose to run the training systems (which is free and shows the outcome).

        2. Model building (10 minutes): Groups formulate their explanation.

        3. Prediction (5 minutes): They are given the test system (covered) and can purchase information about it (using the same options) but at double cost? Or not? We want them to apply their model, not observe the test system in detail.

           - For the test system, they can purchase:
               - The schematic: cost 1 counter.
               - The state of a gate: cost 2 counters per gate.
               - Detailed measurements: cost 4 counters per gate.

           But we want to encourage them to use their model, not buy new observations. So we might not allow any observation of the test system. They have to predict based on their model from training.

        4. Reveal and score (5 minutes): We run the test system and assign scores.

     Scoring:

        - They pay the costs for their observations in training.
        - They get 20 points for a correct prediction (which exit the ball comes out).
        - They lose points for the cost of observations.

        So score = 20 - (total cost) if correct, or - (total cost) if incorrect.

     We design so that:

        - High-level group: Buys only the free observations and the schematic. They see the outcomes of the training systems and might induce a mapping from (Gate1, Gate2) to exit, but they haven't bought the gate states in training, so they don't know the mapping. They might guess a purpose: "The system routes to the exit that is not used often." But it's not clear. They will likely fail.

        - Mid-level group: Buys the gate states for the training systems. They spend 3 training systems * 2 gates * 1 counter = 6 counters. They see the mapping: (open, closed)->C, (closed, open)->A, (open,open)->B. For the test system, they assume the same mapping and predict that (open,open) (if they assume the states are the same) -> B. But in the test system, because of Gate3, it goes to D. So they are wrong. But wait, this is not mid-level, this is state-level. We want the test system to have the same states for Gate1 and Gate2 but a different outcome. So they predict B and it goes to D -> wrong.

          But then the mid-level group fails. We want them to succeed in the training cases and fail in the test? We want to show that the mid-level is better than low-level in round 1.

          How about in round 1, the test system is like the training systems (no Gate3) and we use a state they haven't seen, (closed, closed) -> goes to Exit A? (because when Gate1 is closed, it doesn't go to Ramp2).

          Then the mid-level group can interpolate: for (closed, open)->A, (closed, closed) might be the same as (closed, open) because in both cases the ball doesn't go to Ramp2? Actually, when Gate1 is closed, the ball always goes to Exit A, regardless of Gate2.

          So they would predict A for (closed, closed) and be correct.

          The low-level group might have spent a lot to measure everything, including irrelevant details, and also predict A, but at higher cost.

          The high-level group has no idea.

          Then in round 2, we introduce the test system with Gate3.

     Round 2: The system has an extra gate, Gate3, that is present in the training systems but in a way that doesn't affect the outcome in training. For example, in the training systems, Gate3 is always open and in a position that doesn't affect the ball. In the test system, Gate3 is closed and blocks the path to Exit B.

     Training systems for round 2:

          System1: Gate1 open, Gate2 closed, Gate3 open -> Exit C.
          System2: Gate1 closed, Gate2 open, Gate3 open -> Exit A.
          System3: Gate1 open, Gate2 open, Gate3 open -> Exit B.

     Test system for round 2:

          Gate1 open, Gate2 open, Gate3 closed -> Exit D.

     Now, the mid-level group from round 1 might not have bought the state of Gate3 in training because it was always open and they didn't know it was there. In round 2, we allow them to buy the schematic for the training systems, which now shows Gate3. They might buy the states of Gate1 and Gate2 and see that Gate3 is open in training. They might assume it is always open. For the test system, they predict B, but it goes to D.

     The low-level group in round 2 might have measured everything, including Gate3, and seen that it is open in training. They might also assume it is always open, and fail similarly.

     But wait, we want in round 2 that the mid-level (now knowing about the existence of the gates but not their states in detail) fails, and the low-level (which might have measured the exact position of Gate3 and seen that in the training systems it was not in the path) might realize that in the test system it is in the path. But it's complex.

     Alternatively, in round 2, the important factor is the exact angle of the ramps. In the training systems, the ramp angles are such that the ball always has enough speed. In the test system, the ramp is shallower, so the ball doesn't reach, say, Gate2.

     Given the time, I will stop and provide a definite design for the activity.
