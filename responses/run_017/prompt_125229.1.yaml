  We are designing an activity for a reading group to illustrate the value of explanatory levels and the dangers of overfitting and underfitting in explanations. The activity should have two rounds: one where a mid-level explanation is optimal and one where a lower-level explanation is needed to avoid underfitting. The system should be physical, built from card stock and other simple materials, and use counters for costs and payoffs.

