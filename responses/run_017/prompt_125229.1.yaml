  ### Activity Design: **The Mechanism Cascade**

  #### **Core Idea**
  This activity demonstrates that explanatory power lies at the level where patterns predict behavior under interventions, and that over-reliance on high-level "purpose" or low-level details leads to failures. Two rounds reinforce that the optimal level shifts with context.  
  **System**: A physical cascade device using marbles, ramps, and gates (built from card stock). The system routes marbles from a start point to exits based on gate states and ramp angles.  
  **Key Insight**:  
  - **Round 1**: High-level descriptions (purpose) fail; mid-level (gate states) is cheap and generalizes; low-level (exact measurements) overfits.  
  - **Round 2**: A hidden ramp-angle variable makes mid-level insufficient; low-level details become necessary, punishing the "coarser is always better" bias.

  ---

  ### **Materials List** (All card stock, no cost)
  1. **Baseboard (1)**: 60cm x 45cm card stock, painted gray (optional).  
  2. **Ramps (4)**: Folded card stock (15cm long, 30° incline).  
  3. **Gates (6)**: Small card flaps (3cm x 3cm) acting as switches (open/closed).  
  4. **Walls/Channels**: Strips of card stock (glued to guide marbles).  
  5. **Marbles (10)**: From a game or homemade (clay or paper pulp).  
  6. **Start/Exit Markers**: Labeled stickers (A, B, C, D, X, Y, Z).  
  7. **Observation Tools**:  
     - **High-level "Map"**: A simplified schematic (shows components, not states).  
     - **Mid-level "State Viewer"**: A card with cutouts to check gate states.  
     - **Low-level "Calipers"**: Card-stock ruler (marked in cm) and protractor.  
  8. **Counters (100+)**: Small paper circles (2cm diameter, 3 colors: red = info, blue = predictions, white = scoring).

  ---

  ### **Setup**  
  Build **two identical cascade systems** (Training and Test) and **one modified system** (Round 2 Test).  
  - **Training/Test System**:  
    - Start point **A** → **Ramp 1** → **Gate 1** (open: route to Ramp 2; closed: route to Exit X).  
    - **Ramp 2** → **Gate 2** (open: Exit Y; closed: Exit Z).  
  - **Round 2 System**:  
    - Adds **Ramp 3** after Gate 1 (angle adjustable). Training systems have Ramp 3 at 30°; Test system at 15° (slower marble).  

  **Cover the systems** with removable lids during observation. Only the start/exits are visible when closed.

  ---

  ### **Rules & Roles**  
  - **Groups**: Divide 14 participants into 3 teams (4-5 people). Each chooses a **Description Level**:  
    - **High (Purpose)**: "Organized so that..." (costs 0 counters).  
    - **Mid (Mechanism)**: Focus on gate states (costs 1 counter per gate-state check).  
    - **Low (Detail)**: Exact ramp angles/gate positions (costs 3 counters per measurement).  
  - **Information Costs** (paid in red counters):  
    - View high-level map: 0 counters.  
    - Check gate state (mid-level): 1 counter per gate.  
    - Measure ramp angle/gate position (low-level): 3 counters per item.  
  - **Prediction Payoff**:  
    - Correct prediction (blue counter): +10 points.  
    - Incorrect: 0 points.  
    - **Final Score = Total Points - Counters Spent**.  

  ---

  ### **Timeline (90 Minutes)**  
  1. **Intro (5 min)**: Explain the cascade system, rules, and scoring. Emphasize: *"Predict unseen cases, not just describe."*  
  2. **Round 1 (25 min)**:  
     - **Observe Training System** (10 min): Teams buy info (red counters).  
       - *Training Cases*:  
         - Case 1: Gate 1 open, Gate 2 closed → Exit Z.  
         - Case 2: Gate 1 closed, Gate 2 open → Exit X.  
         - Case 3: Gate 1 open, Gate 2 open → Exit Y.  
     - **Predict Test System** (5 min):  
       - *Test Case*: Gate 1 open, Gate 2 closed → **Exit Z** (same as Case 1).  
       - Teams submit predictions (blue counters).  
     - **Reveal & Score** (5 min): Run test, score predictions.  
     - **Outcome**:  
       - High-level (e.g., "Routes balls efficiently") fails—no actionable prediction.  
       - Mid-level (notes gate states) predicts correctly at low cost.  
       - Low-level (e.g., "Ramp 1 at 30.2°") overfits, spends extra counters, same result.  
  3. **Round 2 (35 min)**:  
     - **Observe Modified Training System** (15 min):  
       - Adds Ramp 3 (30° angle). *Cases same as Round 1, but slower marble speed alters paths if angle changes*.  
     - **Predict Round 2 Test System** (5 min):  
       - *Test Case*: Gates identical to Case 3 (open/open), but Ramp 3 at 15° → **Exit Z** (not Y, due to slower marble).  
     - **Reveal & Score** (5 min).  
     - **Outcome**:  
       - Mid-level (gate states only) predicts Exit Y (fails).  
       - Low-level (measures ramp angles) may detect risk, predicts Exit Z.  
       - High-level fails again.  
  4. **Debrief (25 min)**: Discuss errors, map to real-world, address critiques.  

  ---

  ### **Predicted Outcomes & Errors**  
  - **Round 1 Errors Illustrated**:  
    - High-level: "Purpose" descriptions (e.g., "optimizes routing") cost nothing but predict randomly → *Skyhooks* (no mechanism).  
    - Low-level: Over-measurement fits training data but wastes resources → *Greedy reductionism* (ignores predictive efficiency).  
    - Mid-level: Wins by capturing *minimal sufficient mechanism* (gate states).  
  - **Round 2 Errors Illustrated**:  
    - Mid-level fails → Punishes "coarser is always better" bias. Shows optimal level depends on *which* variables affect outcomes.  
    - Low-level wins only if it focuses on *relevant* details (ramp angle, not gate color).  

  ---

  ### **Handling the "Man Who Reads Ahead"**  
  **His Critique**: *"This is just overfitting, not skyhooks!"*  
  **Your Response**:  
  *"You’re right—this *is* about overfitting. But it’s also about explanatory levels. A skyhook is a high-level story that sounds explanatory but lacks mechanism (e.g., ‘organized so that’). Overfitting is the low-level extreme. Both fail the same test: predicting interventions. The game shows that the best explanation isn’t the most detailed or the most elegant—it’s the one that isolates variables that actually control behavior. Philosophy gives us labels; prediction gives us the test."*  

  **Why This Works**: Acknowledges his point, ties overfitting to greedy reductionism, and reinforces the core thesis (explanatory power = predictive generality).  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem**: Teams ignore costs, overspend on low-level data.  
     **Fix**: Remind them: *"Counters = limited resources; score depends on efficiency."*  
  2. **Problem**: High-level group refuses to engage with mechanisms.  
     **Fix**: Ask: *"What intervention would break your description?"*  
  3. **Problem**: Round 2’s ramp angle is overlooked.  
     **Fix**: Hint: *"Did all training cases use the same ramp?"*  

  ---

  ### **What the Activity Cannot Reproduce**  
  1. **Design-Talk Bias**:  
     - **Problem**: Props are artefacts, subtly rewarding "purpose" language.  
     - **Mitigation**:  
       - State upfront: *"Real ecosystems aren’t designed; we’re abstracting causality."*  
       - In Round 2, make ramp angle a "non-design" variable (e.g., "wear and tear" vs. intent).  
       - **Debrief Point**: *"In nature, ‘purpose’ is a metaphor; only mechanisms are real."*  
  2. **Mechanism vs. Prediction**:  
     - **Limit**: Scoring tests prediction, not true mechanism. A description could predict well but be wrong (e.g., epicycles).  
     - **Acceptance**: State in debrief: *"Prediction is our best available test. Reality is inferred through repeated intervention. This game can’t show ‘truth’—only what works for now."*  

  ---

  ### **Design Commitments & Rationale**  
  1. **Two Rounds (Not Three)**:  
     - Round 1 breaks reductionist bias; Round 2 breaks anti-reductionist bias. Three would overcomplicate.  
  2. **Counters (Not Money)**:  
     - Counters abstract "cost" (attention, resources) without real-world baggage.  
  3. **Name the Ideas in Debrief Only**:  
     - Avoid priming; let errors emerge organically.  
  4. **Physical System Choice**:  
     - Marble cascade is buildable with card stock, allows clear levels of abstraction, and interventions are visible.  
  5. **Least Confident Choice**: Using artefacts risks reinforcing design-talk.  
     - **Why I Accept It**: The debrief explicitly breaks this, and Round 2’s "wear and tear" variable mitigates it.  

  ---

  ### **Final Thought**  
  This activity makes the tradeoffs visceral: High-level stories feel insightful but predict poorly; low-level rigor feels "rigorous" but wastes effort. By Round 2, your group will see that explanations are tools—and like all tools, their worth is measured by the work they do.
