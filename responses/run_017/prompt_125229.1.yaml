   1. Participants produce descriptions at different levels (high, mid, low) of a system.
   2. They pay for the information (with counters) that their descriptions require.
   3. They are scored on predictions about unseen cases.
   4. Round 1: Bottom-level overfits, mid-level is optimal, high-level (purpose-based) underfits.
   5. Round 2: The optimal level is one step below the mid-level of round 1 to show that coarser isn't always better.

