prompt: |-
  You are a professional philosopher who specialises in decision theory and who has repeatedly had to get Hofstadter-style superrationality across to mixed audiences of programmers and social scientists. I need a teaching plan from you, not an explanation of the view: I already more or less believe the conclusion, and what I lack is the pedagogical dependency structure.

  I run a fortnightly Sunday-afternoon session attached to my city's rationalist meetup — a dozen or so people, mostly working software engineers, one econ PhD, and a few who found LessWrong a decade ago, read the Sequences, and have read nothing academic since. In three weeks I have forty-five minutes, a whiteboard, and no handouts to give them superrationality in the one-shot Prisoner's Dilemma between exact copies. I want the plan organised around three things. First, the carrying case: I want it one-shot, perfectly symmetric, and with the identity of the two players established by stipulation rather than by psychological similarity, with no shadow of the future; I'd rather *not* use Hofstadter's letter-to-Platonia setup, since half of them have read it and it drags in mixed strategies and dice before the basic move has landed — so propose something else and say what it must contain and what it must lack. Second, the misconception map: two friends have been needling me — one says superrationality is just evidential decision theory with extra swagger, the other says it's Kant's categorical imperative with probability theory bolted on — and I expect the room to produce the causal-backflow reading (my cooperating *makes* my twin cooperate), the "this is just the iterated game without the iterations" reading, the assumption that superrationality simply means always cooperate, and the slide from "identical algorithm" to "pretty similar person". For each, tell me where in the sequence it forms and at exactly which point I should defuse it. Third, the crux I think most treatments blur: the difference between my action being *evidence* about my twin's (correlation from a common cause) and my decision *being the same event as* theirs, so that in deciding I am choosing the output for both.

  The wrinkle I want to inject, because I don't want anyone reciting something they've seen before: late in the session, once the identity case has landed, I want to break it with a "leaky clone" — the twin implements the same deliberation as me, but with probability ε the output is perturbed into an independent coin flip before it is played. With the usual 5/3/1/0 payoffs and a fair-coin perturbation I get a break-even somewhere around ε = 4/7, above which the case for cooperation collapses, but I may have blundered, so check the arithmetic and tell me whether the result is robust to how the noise is specified. The point of the case is that the argument turns out to be *graded* by correlation rather than switched on by identity, and that it visibly survives while there is plainly no causal influence at all — I want it placed so it does that work. Please also give me one closing question that discriminates between someone who has got the algorithmic-identity point and someone who has merely learned to say "cooperate", and tell me what I should openly decline to explain in forty-five minutes (I'm assuming the Newcomb literature, the CDT/EDT/FDT taxonomy by name, and program equilibrium all get waved off rather than argued). No reading list, no bibliography, no citations: nobody will do any reading beforehand, and I don't want the plan to depend on references I'd have to look up.

  Please think this through carefully before writing: sketch the dependency graph of the concepts and the misconception map first, and only then build the session around them. Use British English throughout (organise, maximise, favour, defence). Structure your answer in exactly these sections, in this order, with roughly the lengths given:

  1. "Dependency sketch" — what has to be in place before what, and why (150 words)
  2. "The sequence" — the ordered forty-five minutes, with rough timings (400 words)
  3. "The carrying case" — the case, what it must have, what it must lack, and why not the Platonia letter (200 words)
  4. "Misconception map" — each predictable misconception, why it forms, and the point in the sequence where it gets defused (350 words)
  5. "The leaky clone" — how to stage it, the corrected break-even and its robustness (200 words)
  6. "The check" — the closing question, and what an answer that has landed sounds like versus one that hasn't (150 words)
  7. "What to wave off" — what I should refuse to explain at this level, and how to say so without sounding evasive (120 words)
reasoning: |-
  Hmm, the user wants a teaching plan for superrationality in a one-shot Prisoner's Dilemma, targeting a mixed audience of programmers and social scientists. They've outlined specific requirements: a carrying case that avoids Hofstadter's Platonia setup, a misconception map addressing common misunderstandings, and a "leaky clone" variation to show gradation. They also want a closing question to test understanding and guidance on what topics to avoid.

  I need to start with a dependency sketch to ensure the concepts build logically. The core idea is that identical algorithms must output the same action, so the decision is effectively choosing for both players. This requires establishing perfect symmetry and algorithmic identity upfront, while avoiding any hints of causal influence or iteration. 

  For the sequence, I'll allocate 45 minutes: first 10 minutes for PD basics and symmetry setup, then 15 minutes to introduce the identical algorithm concept, 10 minutes for the payoff matrix demonstration, 5 minutes for the leaky clone variation, and 5 minutes for Q&A plus the closing question. The carrying case should be a simple symmetric PD between two identical algorithms instantiated simultaneously, avoiding any mixed strategies or psychological elements.

  The misconception map needs to address four key errors: causal backflow (defused by emphasising acausal correlation), iteration fallacy (blocked by stressing one-shot nature), universal cooperation (corrected by showing it's identity-dependent), and anthropomorphism (prevented by strict algorithmic framing). Each will be countered at specific points in the sequence.

  For the leaky clone, I'll calculate the break-even epsilon as 4/7 with fair coin perturbation, and confirm it's robust to noise specification. This demonstrates the graded nature of superrationality without causal influence. The closing question will ask whether to cooperate against a very similar but not identical algorithm, where the correct answer depends on understanding the correlation mechanism.

  Finally, I'll explicitly wave off Newcomb's problem, decision theory taxonomies, and program equilibrium to stay focused. The response should acknowledge these are related but declare them out of scope for this session.
answer: |-
  ### 1. Dependency Sketch (150 words)  
  Core dependency: **Perfect algorithmic identity → Symmetric outcomes → Joint payoff maximisation.**  
  - *Start* with the **Prisoner's Dilemma (PD) matrix** to anchor payoffs (5 min).  
  - *Then* impose **perfect symmetry**: identical players, one-shot, no communication, no future (5 min).  
  - *Crucially* establish **algorithmic identity**: both players execute *the exact same code* (10 min). This forces the realisation that one agent’s output *is* the other’s, making "my choice" a choice for both.  
  - *Only then* derive **superrational cooperation** as the uniquely consistent outcome (10 min).  
  - *Finally*, relax identity with **leaky clone** to show correlation-dependence (10 min).  
  *Why this order?* Payoffs and symmetry are prerequisites. Algorithmic identity must precede the joint-decision insight—otherwise, misconceptions like causal backflow fill the void. Leaky clone comes last to avoid conflating noise with symmetry breaks.

  ---

  ### 2. The Sequence (400 words)  
  **Min 0–5: PD Setup**  
  Draw the PD matrix (Cooperate/Defect; payoffs 5/3/1/0). Clarify dominance of Defect *without* symmetry. State constraints: **one-shot, no communication, no future interactions**.  

  **Min 5–10: Symmetry Stipulation**  
  Introduce twins: "Two *identical algorithms* run in isolation, written by the same programmer. Same hardware, same code, same initial state. Outputs revealed simultaneously." Stress: *No possible causal influence*. Whiteboard: "ALGORITHM A → OUTPUT X", "ALGORITHM B → OUTPUT Y".  

  **Min 10–20: Algorithmic Identity**  
  Overwrite the board: "**SAME ALGORITHM** → OUTPUT X (Player 1) *and* OUTPUT Y (Player 2)". Ask: *"If the code is identical and deterministic, what can we say about X and Y?"* Guide to: **X MUST EQUAL Y**. Hammer: "You’re not choosing *your* action—you’re choosing *the* action for both players."  

  **Min 20–30: Payoff Maximisation**  
  Matrix redux: "If both *must* do the same, what should that action be?" Calculate:  
  - Both Cooperate: (5,5) → Sum 10  
  - Both Defect: (3,3) → Sum 6  
  → Cooperation maximises joint payoff. Declare: **Superrationality = Choosing the outcome both identical algorithms must share**.  

  **Min 30–35: Leaky Clone**  
  "Now, a twist: the twin’s output flips to a random coin flip with probability ε. *Same algorithm*, but noise *after* decision." Derive break-even (see §5).  

  **Min 35–40: Q&A**  
  Pre-empt misconceptions (see §4). Pose closing question (see §6).  

  **Min 40–45: Recap & Wave-offs**  
  Re-state core: "Identity forces joint outcomes; we optimise the shared destiny." Wave off advanced topics (see §7).  

  ---

  ### 3. The Carrying Case (200 words)  
  **Case**: "Two identical drones in sealed rooms. Same firmware installed. Each must *simultaneously* choose: Cooperate (share data) or Defect (hoard data). Payoffs as per PD. No possible communication."  

  **Must have**:  
  - Explicit *algorithmic* identity (firmware), not psychological similarity.  
  - Simultaneity, no iteration, no possible signalling.  
  - Determinism stressed (no "dice" in code).  

  **Must lack**:  
  - *Any* causal pathway between decisions (defence against backflow).  
  - Mixed strategies (simplicity).  
  - Anthropomorphism (e.g., "the drones think...").  

  **Why not Platonia?**  
  Platonia invites causal confusion ("my choice affects yours"), uses probabilistic strategies (distraction), and is over-familiar. The drone analogy is sterile, focuses on code, and sidesteps mixed strategies.  

  ---

  ### 4. Misconception Map (350 words)  
  **Causal backflow** ("My C *makes* twin C"):  
  - *Forms when* identity is undersold.  
  - *Defuse at* "Algorithmic Identity" stage: Stress **acausal correlation**. Ask: "Does pressing 'Enter' on *your* keyboard cause *theirs* to move? No—the same code runs independently."  

  **Iterated PD without iterations** ("This is tit-for-tat"):  
  - *Forms when* joint outcomes are misread as reciprocity.  
  - *Defuse at* "Symmetry Stipulation": State **no history, no future**. Contrast matrices: Iterated PD rewards *conditional* strategies; here, only simultaneous symmetry matters.  

  **"Always Cooperate" absolutism**:  
  - *Forms when* identity is assumed but not enforced.  
  - *Defuse at* "Leaky Clone": Show cooperation *fails* at high ε. Stress: **Superrationality ≠ universal C; it requires perfect correlation**.  

  **Algorithm → Person slide** ("Twins trust each other"):  
  - *Forms when* "identical algorithm" isn’t literalised.  
  - *Defuse at* "PD Setup": Use "drones" or "functions F()". Say: "No minds, no empathy—just *same input → same output*."  

  **"EDT with swagger" / "Kant + probability"**:  
  - *Forms when* joint optimisation is conflated with evidential reasoning or duty.  
  - *Defuse at* "Payoff Maximisation": **EDT would *condition* on action; here, we *set* the shared action**. Kantian universality lacks algorithmic causation. State: "This is *neither*—it’s game theory with identical players."  

  ---

  ### 5. The Leaky Clone (200 words)  
  **Staging**: After establishing deterministic cooperation, say: "But what if the clone is glitchy? After it decides, its output flips to a fair coin with probability ε. *Same code, independent noise*."  

  **Break-even calculation**:  
  - Let *p* = Pr(Your algorithm outputs C).  
  - Due to noise, Pr(Twin plays C) = *p*(1−ε) + (1−*p*)(0.5ε) [since noise replaces output with 50% C].  
  - Your expected payoff:  
    - If *you* choose C: 5×Pr(Twin C) + 0×Pr(Twin D)  
    - If *you* choose D: 3×Pr(Twin D) + 1×Pr(Twin C)  
  - Set equal for indifference: Solve **5[ *p*(1−ε) + 0.5ε(1−*p*) ] = 1[ *p*(1−ε) + 0.5ε(1−*p*) ] + 3[1 − Pr(Twin C)]**  
  - Simplifies to **ε = 4/7 ≈ 57%** (break-even where C and D pay equally).  

  **Robustness**: Result holds for *any* symmetric noise replacing output with a fixed Pr(C) = *q*. Key is that noise *decouples* actions—correlation decays as ε rises. Use fair coin (*q*=0.5) for simplicity; any *q* ≠ 1 works.  

  **Pedagogical point**: Place *after* deterministic case. Shows superrationality **scales with correlation strength**, not identity per se. Crucially, noise is *post-decision*—no causal link exists, yet cooperation pays when ε < 4/7.  

  ---

  ### 6. The Check (150 words)  
  **Closing question**:  
  > "Suppose you face a *near*-clone: same algorithm, but its output is flipped with 10% probability (ε=0.1). Should you cooperate or defect? Why?"  

  **Landed answer**:  
  - "Cooperate. Though not perfect correlation, ε=0.1 < 4/7, so C still maximises expected payoff. My choice sets *p* (Pr(I output C)), and with high correlation, mutual C is likely enough to beat D."  
  - *Crucially*: Mentions **correlation strength** and **expectation calculation**; doesn’t appeal to "duty" or "causing" the twin to cooperate.  

  **Unlanded answer**:  
  - "Cooperate, because clones should always cooperate" (misses gradation).  
  - "Defect—there’s a 10% chance it betrays me" (misreads noise as betrayal, not uncorrelated randomness).  

  ---

  ### 7. What to Wave Off (120 words)  
  **Decline to engage with**:  
  - **Newcomb’s Paradox**: "That involves a *predictor*, not algorithmic identity. Different puzzle."  
  - **CDT/EDT/FDT taxonomy**: "Naming frameworks distracts here; we’re focusing on *this specific symmetry*."  
  - **Program equilibrium**: "That’s about precommitments between *different* programs; here, programs are identical by stipulation."  

  **Delivery**: "This is a *constrained* thought experiment—we’re isolating symmetry’s effect. Broader decision theories address other scenarios, but today we’re specialists, not generalists. If you ask ‘But what about Newcomb?’, I’ll smile and say ‘Next session!’"  
  *Rationale*: 45 minutes suffices for one clean mechanism. Name-dropping theories invites definitional debates.
