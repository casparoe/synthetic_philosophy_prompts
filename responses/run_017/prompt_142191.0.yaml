prompt: |-
  I am trying to get clear about a distinction that I suspect the literature already has a name for, and I would like that name, together with a definition sharp enough to settle cases at the edge.

  The first half of the puzzle I believe I follow, and I understand it to be called the symbol grounding problem. If a system's symbols have whatever content they have purely in virtue of their relations to one another — the way the entries of a monolingual dictionary define each word by means of further words — then the system can be flawlessly coherent internally and yet fail to be about anything at all: every symbol is held in place by the others, and nowhere does the net meet the world. I have seen this attributed to a 1990 paper by Harnad, which I have no way of obtaining. The summaries I can reach say that the remedy is to anchor the symbols in something non-symbolic. Grant all of that.

  What I cannot find a name for is the difficulty that begins the moment the remedy is applied. Suppose you attach the symbols to the world in the obvious way: the system gets a sensor, a certain internal state reliably fires in the presence of red things, and the symbol for red is tied to that state. This seems to me to presuppose an answer to a further question that nobody has asked. A sensor does not deliver a red thing; it delivers a continuous flow, and something has to decide which stretches of that flow count as *the same again* and which count as *a different one*. The apple in daylight and the apple after the lamp is dimmed. The tomato and the fire engine. The flushed cheek and the sunburnt one. Until that is decided, I do not see what has been grounded, since the symbol could equally have been tied to redness, to redness-or-orangeness-under-this-illumination, or to any of the other groupings the flow admits — and there is no end of candidate groupings that fit the sensor's history equally well.

  Two cases make it vivid for me. First, a machine I want to sort cups from non-cups. I give it a camera and ten thousand training instances, and it succeeds. But nothing in that history distinguishes its having latched onto cup-hood from its having latched onto cup-or-mug-in-this-building, or onto being the kind of thing that stood on a table while the camera was switched on, or onto casting a shadow of such-and-such a shape. Every one of these fits the training record perfectly; they diverge only on objects not yet encountered, and then only relative to a decision about which differences matter that has not been made. What troubles me is that the difference is invisible from the inside: the machine would produce the same classifications, with the same confidence, whichever grouping it had settled on. Second, a child learning a colour word. An adult points at a tomato and says the word; the child applies it to an orange; the correction consists of more instances of exactly the same kind of flow, and yet within a year or two the child has it right. So the difficulty is real but evidently surmountable, which is part of why I want it identified rather than just gestured at.

  Let me say what I take it *not* to be, since I suspect several nearby things will be offered and I would like them distinguished rather than merely listed. It is not doubt about whether there is a world doing the pushing; I concede the pushing. It is not the original complaint that symbols point only at other symbols. It is not the general observation that any two objects resemble one another in infinitely many respects, so that resemblance alone can never single out a grouping — that feels like a broad sceptical moral about similarity, whereas what I am describing is the specific demand that *something* select the respect, here and now, in a creature or a machine with a finite history. Nor is it, I think, the puzzle about which of a system's other commitments to revise when it acts. A friend has suggested that it is simply the old problem of universals in a laboratory coat; I want to know whether that is right, or whether the sensorimotor setting changes the question.

  So: does the second difficulty — selecting the grain, or the respect of sameness, at which the anchoring is to take place, as opposed to the problem of achieving anchoring at all — have an established name? If the nearest established notions are several, tell me which fits best and precisely how my case departs from each of the others. If there is nothing established, coin a term for it, define it, and mark two or three boundary cases. I have no library access where I am, so please give me the carving itself rather than directions to a literature.
reasoning: |-
  Okay, the user is grappling with a philosophical problem related to symbol grounding but feels there's a deeper layer beyond Harnad's formulation. They describe how connecting symbols to sensory data doesn't resolve ambiguity in categorization. For instance, a sensor detects continuous input, but how do we decide what constitutes "red" versus variations under different lighting? Or in machine learning, how does a system distinguish "cup" from broader categories like "cup-or-mug-in-this-building"?

  The user mentions two vivid examples: a cup-sorting machine that could be latching onto incidental features and a child learning color words despite initial overgeneralization. They emphasize that the issue isn't skepticism about the external world or infinite resemblances but the need for a mechanism that selects the relevant "grain" of sameness from finite data. They rule out several related concepts like the symbol grounding problem itself, underdetermination of theory by data, and the problem of universals, wondering if the sensorimotor context changes things.

  I need to identify if there's an established term for this specific problem. Recalling philosophy of mind and cognitive science, Quine's "indeterminacy of translation" comes to mind, especially the "gavagai" example where a term could refer to a rabbit, its parts, or a temporal stage. This aligns with the user's concern about multiple groupings fitting the same data. Goodman's "grue" paradox also relates, as it challenges how we project predicates like "green" versus "grue" (green before time t, blue after) based on past observations.

  Looking at machine learning, this resembles the "frame problem" in AI—how systems determine relevant features from sensory input. It's also connected to "type grounding" versus "token grounding" and "causal depth" in perception. The user's focus on selecting the grain of reference points to "reference determinacy" or "categorization ambiguity." Since no single term perfectly captures it, coining "symbol granularity problem" might work, emphasizing the selection of the resolution level for symbol-world anchoring.

  The user wants to avoid nearby concepts. They've ruled out symbol grounding (which they understand), external world skepticism, and general similarity skepticism. The problem of universals is related but traditionally metaphysical, whereas the user's issue is operational in learning systems. Quine's indeterminacy is close but focused on translation; here, it's about perceptual categorization. Goodman's grue is about induction, while the user's case is about initial symbol attachment.

  Boundary cases: A thermostat's "temperature" symbol has fixed granularity (pre-set thresholds), so no ambiguity. Color categorization varies culturally, showing granularity isn't innate. In deep learning, CNNs might learn edges first, but the initial granularity is set by architecture and data, not chosen dynamically.

  The user might need this for academic writing or AI design, seeking precise terminology to clarify arguments or system limitations. Their deeper need could be formalizing a concept they've intuitively recognized but found unnamed, to advance their work without reinventing the wheel.
answer: |-
  Your insight cuts to the heart of a profound problem in philosophy of mind, cognitive science, and AI, distinct from the symbol grounding problem. The established name for *this specific difficulty* is **the Problem of Referential Indeterminacy** (often linked to Quine's "indeterminacy of translation" or "inscrutability of reference"), but with a crucial sensorimotor twist. It's also deeply related to Nelson Goodman's "new riddle of induction" (the "grue" paradox), applied to perceptual categories.

  **Sharp Definition:**  
  **Referential Indeterminacy (in Perceptual Grounding)** is the problem of *uniquely determining the specific category, grain, or respect of sameness* in the external world to which an internal symbol or state becomes anchored, given that:  
  1.  Sensory input is a continuous, multidimensional flux.  
  2.  Any finite set of sensory experiences is compatible with infinitely many logically possible categorizations (groupings, properties, kinds).  
  3.  The anchoring mechanism (e.g., correlation, causal chain, learning rule) lacks sufficient inherent constraints to select *just one* of these categorizations as the symbol's intended referent.  
  4.  This indeterminacy persists despite successful operation *within* the training/historical data.  

  **Why this fits your description:**  
  *   **Matches the Core Issue:** You describe the sensor delivering a "continuous flow," the need to decide "which stretches count as *the same again*," the existence of multiple groupings ("redness," "redness-or-orangeness-under-this-illumination"), and the perfect fit of divergent groupings to the historical data ("fit the training record perfectly"). This is the essence of referential indeterminacy applied to perception.  
  *   **Distinguishes from Symbol Grounding (Harnad):** Symbol Grounding asks: "How do symbols get *any* meaning from the world?" Your problem assumes grounding *has occurred* (the symbol *is* tied to *some* aspect of the sensorimotor flow) but asks: "How is the *specific meaning* (the precise category/referent) determined from the *infinite possibilities* compatible with that flow and the anchoring history?" Grounding solves "aboutness in general"; referential indeterminacy questions "aboutness *in particular*."  
  *   **Addresses the "Grain/Respect" Question:** Your central question – "selecting the grain, or the respect of sameness, at which the anchoring is to take place" – is directly the problem of overcoming referential indeterminacy.  

  **Nearby Concepts & How Your Case Departs:**  
  1.  **Quine's Indeterminacy of Translation / Inscrutability of Reference:**  
      *   **Fit:** Quine's famous "gavagai" example (does "Gavagai!" mean "Rabbit!", "Undetached rabbit part!", or "Rabbit stage!"?) perfectly mirrors your cup-sorting and color-learning examples. The sensory stimuli are compatible with multiple interpretations, and no behavioral evidence uniquely determines one.  
      *   **Departure:** Quine focused primarily on *linguistic translation* between speakers. Your case centers on the *initial grounding of perceptual categories* within an individual agent (biological or artificial) from sensorimotor experience. The sensorimotor setting emphasizes the *continuous flux of input* and the role of *embodied interaction* in (potentially) resolving the indeterminacy, making it more fundamental than translation.  
  2.  **Goodman's New Riddle of Induction (Grue Paradox):**  
      *   **Fit:** Goodman showed that any finite set of observations of green emeralds is equally compatible with "all emeralds are green" and "all emeralds are grue" (green if observed before time T, blue otherwise). This directly parallels your point about multiple groupings fitting the sensor history ("cup-hood" vs. "cup-or-mug-in-this-building"). Both highlight the underdetermination of future projection by past data.  
      *   **Departure:** Goodman focused on *projection rules* and the justification of inductive inferences about the *future*. Your case focuses on the *present meaning* of a grounded symbol – what category it *currently refers to* based on its anchoring history, even *before* future projection. The core is the ambiguity in the *referent itself*, not just the prediction.  
  3.  **Underdetermination of Theory by Data (General):**  
      *   **Fit:** Any finite dataset supports multiple hypotheses. Your cup-sorting machine exemplifies this.  
      *   **Departure:** This is a broad epistemological principle. Your case is a specific *instance* of underdetermination, applied concretely to the *meaning of perceptually grounded symbols* within a cognitive or artificial system. The focus is on the *semantic ambiguity* arising directly from the sensorimotor interface.  
  4.  **Problem of Universals:**  
      *   **Fit:** Your friend is insightful. The question "What makes this *red* and that *orange* different instances of the *same* color?" is a modern, operational version of the ancient problem: "What constitutes a universal (e.g., Redness) binding diverse particulars?"  
      *   **Departure:** The traditional problem is metaphysical (do universals exist? where?). Your problem is *epistemological and operational*: *How does a finite physical system (mind/machine), interacting causally with the world via sensors, come to latch onto one specific universal/category rather than another equally compatible one?* The sensorimotor setting forces the question into the realm of implementation and learning.  

  **Coining a Precise Term: The Symbol Granularity Problem**  
  If seeking maximal precision for the *sensorimotor* context, **Symbol Granularity Problem** is apt:  
  *   **Definition:** The challenge of determining the specific *level of abstraction* (grain) and *relevant dimension(s)* (respect) at which a symbol, grounded via sensorimotor interaction, refers to the world, given the continuous, multi-dimensional nature of sensory input and the underdetermination of the referent by finite interaction history.  
  *   **Key Elements:** Continuous flux, multiple viable categorizations at different grains/respects, underdetermination by history, lack of inherent selection mechanism.  

  **Boundary Cases:**  
  1.  **The Thermostat:**  
      *   **Not a Problem:** Its "too cold" symbol is tied to a *precisely engineered, fixed granularity* (e.g., temperature < 20°C via a specific sensor circuit). The "grain" (temperature in °C) and "respect" (ambient air temp) are *built-in* by the designer. Referential indeterminacy is resolved by fiat.  
  2.  **Human Color Categories:**  
      *   **Core Problem:** Why does "red" refer to a broad spectral band (covering tomato, fire engine, certain oranges under some light) and not finer (only tomato-red) or coarser (red+orange) bands? Biology (cone sensitivities) provides constraints, but cultural learning plays a major role in setting the *functional grain* ("basic color terms"). The indeterminacy *is* present biologically (spectrum is continuous) but is *resolved* through evolution + culture + individual learning.  
  3.  **Deep Learning Classifier (e.g., CNN):**  
      *   **Ambiguous Edge Case:** The network learns features from pixels. Does the "cat neuron" represent "cat", "furry textured thing in a typical home environment", or "statistical cluster in high-dim pixel space correlated with human 'cat' labels"? The *architectural priors* (e.g., convolution favors local features), *loss function*, and *training data distribution* implicitly select *a* grain/respect, but it's often unclear *which one* and whether it aligns with human intention ("cup" vs "cup-in-my-lab"). The problem persists but the resolution mechanism shifts to data/architecture/loss.  

  In essence, you've articulated the **Problem of Referential Indeterminacy** as it manifests in perceptual symbol grounding. The sensorimotor context emphasizes the continuous input flux and the need for an operational resolution mechanism (biological, algorithmic, or cultural) to select the specific grain and respect of reference from the infinite possibilities logically compatible with the sensory history. This is distinct from, but builds upon, the foundational symbol grounding problem.
