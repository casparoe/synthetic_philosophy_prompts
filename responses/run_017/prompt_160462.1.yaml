prompt: |-
  i teach a 300-level moral psych seminar, 18 students, one 80-minute block, and we're on the guilt vs. shame question next week — which one is the better moral emotion to build a culture around, and whether a culture can even choose. I need an actual in-class activity: a game, with rounds and payoffs, that makes them run into the hard part themselves instead of me telling them.

  The hard part as I see it is the audience problem. Shame does its work only when somebody is watching whose opinion you care about; guilt does its work precisely when nobody is watching. So a shame-run culture is fragile to anonymity, mobility and exit (leave the village, start over with a clean face), while a guilt-run culture needs an internal observer that you can't install by passing a rule — you have to grow one, slowly, and once grown it doesn't switch off just because you repeal the institutions that produced it. That lag is the thing I most want them to feel.

  So: something like a little community simulation, 5–6 short rounds, materials no fancier than index cards, envelopes, and a whiteboard scoreboard. Every round there's an oportunity for a small fictional infraction — drawn from a deck, "short-changed the grain store," that sort of thing; nothing that draws on anything any real student has done, and no real wrongdoing anywhere in the room. The group scores separately for compliance-when-observed and compliance-when-unobserved. They get a fixed budget and a menu of institutions to buy: open-plan housing vs. walls, public reckoning vs. sealed confession, record-keeping vs. deliberate forgetting, a cheap exit option, a reintegration ritual, some kind of novice-training practice. Then the environment shifts between rounds — first someone can act unseen, then a neighboring community opens up and exit gets cheap, then they're allowed to repeal institutions and watch which effects fail to switch off. I'd like a hidden per-person "internalization" counter that builds up slowly under some institutions and decays slowly after they're repealed, so the group discovers they can change the rules fast but not the habit.

  Payoffs in points, no money, and the scoring rule has to be simple enough for me to run live on the board. I don't want to name the distinction until after the last round.

  Then a debrief that maps specific moments onto specific claims: where shame stopped working and why, where the guilt lag showed up, what the repeal round actually proved. I want both characteristic failure modes on the table by the end — shame's (hypocrisy, exit, exile that never really ends) and guilt's (scrupulosity, private self-punishment with no off-switch, harm done with nothing public repaired) — and an honest note on which part of the question the game can't touch: it can't make anyone actually feel either emotion on cue, it can't compress a childhood into 80 minutes, and it won't settle which is better, only show what each buys and what it costs. I'll have to supply the normative frame myself.

  And please tell me what will predictably go wrong the first time I run it. My three worries: someone meta-gaming the point system instead of playing the community; the discussion collapsing into shame = embarrassment; and, most importantly, the activity accidentally producing real shame in the room. How should I rig the setup so that last one can't happen?

  Also, don't build it around any outside reading — half of them won't have done it, and I don't want the thing to depend on a name or a citation.
reasoning: |-
  We are building a classroom activity that simulates a community over several rounds, focusing on the differences between guilt and shame as moral emotions. The goal is for students to experience the "hard part": shame requires an audience and is fragile to anonymity and exit, while guilt relies on an internalized observer that persists even when institutions change.

  ### Key Elements:
  - **Players**: 18 students, divided into 3 groups of 6 (to simulate small communities). Each group will make collective decisions and experience the consequences together.
  - **Materials**: 
    - Index cards (for recording individual actions and internal state)
    - Envelopes (for private actions)
    - Whiteboard for scoreboard (tracking group points and public information)
  - **Rounds**: 5 rounds, each representing a generation or a period in the community's life. Each round has:
    - **Opportunity for infraction**: A fictional minor transgression (e.g., "short-changed the grain store", "took extra firewood from the commons", "didn't help with the harvest"). 
    - **Observation**: Some actions are observed (by the group or a designated observer) and some are not.
    - **Institutions**: Groups can invest in institutions at the beginning of each round (using a fixed budget of points). The menu includes:
      1. **Housing**: Open-plan (easy observation) vs. Walls (privacy, harder observation) - affects the chance of being observed.
      2. **Reckoning Process**: Public reckoning (shame-inducing) vs. Sealed confession (guilt-inducing, private) - affects how transgressions are handled.
      3. **Record-keeping**: Keep records (transgressions are remembered, affecting future interactions) vs. Deliberate forgetting (no record, clean slate).
      4. **Exit Option**: Cheap (easy to leave the community and start anew) vs. Expensive (hard to leave).
      5. **Reintegration Ritual**: A public ceremony to reintegrate transgressors (for shame cultures) or a private forgiveness process (for guilt cultures).
      6. **Novice Training**: Focus on instilling group norms publicly (shame) vs. internal reflection (guilt).
    - **Environment Shifts**: Between rounds, the environment changes (e.g., Round 1: everyone can be observed; Round 2: anonymity possible; Round 3: exit becomes cheap; Round 4: groups can repeal institutions; Round 5: internalized guilt may persist even after repeal).
  - **Scoring**: 
    - Each round, groups get points for:
      - Compliance when observed (public compliance)
      - Compliance when unobserved (private compliance)
    - Points are reduced by the cost of the institutions they choose (each institution has a cost).
    - Groups also get a bonus for high overall compliance (to incentivize building a functional community).
  - **Hidden Mechanic**: Each student has an "internalization" score (on their index card) that:
    - Increases when they are in a guilt-focused institution (e.g., sealed confession, internal reflection training) and they comply when unobserved.
    - Decreases slowly when guilt-focused institutions are removed (to show persistence of guilt).
    - This score affects their likelihood of complying when unobserved in future rounds.

  ### Activity Flow:

  #### Setup (5 minutes)
  - Divide the class into 3 groups of 6. Each group is a community.
  - Give each student an index card and an envelope. The index card will have:
    - A space for their "internalization" score (start at 0 for all).
    - A space for recording their action each round (comply or transgress) and whether they were observed (if applicable).
  - Explain that they will face a series of choices and that the goal is to build a thriving community (measured by points). They will make collective decisions about which institutions to buy.

  #### Round 0: Baseline (5 minutes)
  - No institutions in place.
  - Each student draws an "infraction opportunity" card (prepared by instructor) that says either "observed" or "unobserved". 
    - Example: "You have a chance to short-change the grain store. [Observed/Unobserved]"
  - Students decide in private (writing on their index card) whether to comply (do the right thing) or transgress (do the wrong thing). They seal their decision in an envelope (to keep it private until the end of the round).
  - The instructor collects the envelopes and reveals:
    - For observed actions: whether they complied or transgressed (publicly for the group).
    - For unobserved actions: only the aggregate number of transgressions (to the group) without revealing who.
  - Scoring for the group:
    - Public compliance: 1 point per observed individual who complied (if observed and complied).
    - Private compliance: 2 points per unobserved individual who complied (because unobserved compliance is harder and more valuable for the community).
    - Subtract 1 point for every transgression (whether observed or not) because it harms the community.
  - Record group points on the board.

  #### Rounds 1-5 (10 minutes per round, total 50 minutes)
  - **Institution Selection**: At the start of each round, groups have a fixed budget (e.g., 10 points) to spend on institutions. The menu (with costs) is presented on the board. They must decide collectively which to buy (each group can buy multiple, but budget is limited). Institutions last until repealed (which can happen in Round 4).
  - **Environment Shift**: The instructor announces a change in the environment for that round (see below).
  - **Action Phase**: Same as Round 0, but now the institutions affect:
    - The chance of being observed (e.g., open-plan housing makes observation more likely).
    - The consequences of transgression (e.g., public reckoning vs. sealed confession).
    - The internalization score (explained below).

  ##### Round 1: Building Institutions
  - Environment: Normal (no special changes).
  - After actions are taken, if the group has a reckoning process institution, it is applied:
    - Public reckoning: If someone transgressed and was observed, they are publicly named and lose 1 point for the group (simulating social cost). But if they confess and undergo a reintegration ritual (if bought), the group loses only 0.5 points.
    - Sealed confession: Transgressors (observed or not) can write a private confession and put it in an envelope. If they do, they get a chance to reflect and their internalization score increases by 1 (if they complied unobserved, it increases by 1 without confession). No public naming.

  ##### Round 2: Anonymity
  - Environment: A new technology (or situation) allows some actions to be done anonymously. The instructor increases the number of "unobserved" opportunities (e.g., 4 out of 6 in each group are unobserved).
  - Institutions function as before.

  ##### Round 3: Exit Option
  - Environment: A neighboring community opens, and exit becomes cheap (if the group bought the cheap exit option, it's free; otherwise, it's expensive). 
    - After the action phase, any student who transgressed (and was observed, if in a shame system) may choose to exit. If they exit, they are replaced by a new member (a student from another group? but that might be complex; alternatively, the group loses a member and the transgressor is out of the game, but we don't want to exclude students). 
    - Instead: If a student exits, the group loses 2 points and the exiting student is given a new identity (new index card with internalization reset to 0) and joins a different group? But that might be chaotic. 
    - Alternative: The group loses points for each exit (representing loss of labor and trust). The exiting member is not replaced, so the group is smaller in the next round (which affects their point potential). The student who exits sits out the rest of the game? Not ideal.
    - Better: Exiting is simulated by the group losing points and the individual's future actions are not counted (but we don't remove the student). We'll say: if a student exits, they are no longer part of the community for the rest of the game. They become an observer. The group loses 2 points per exit and the student's future actions don't count.

  ##### Round 4: Repeal Institutions
  - Environment: Groups are allowed to repeal one institution without cost (and get a refund of half its cost). They can also buy new ones with their budget.
  - After repeal, the internalization scores remain (they don't disappear immediately).

  ##### Round 5: Persistence
  - Environment: All institutions are removed (by force, e.g., a natural disaster or revolution). The groups must function without any institutions.
  - The internalization scores still affect behavior.

  #### Internalization Mechanics (Hidden)
  - The instructor tracks each student's internalization score on their index card (kept by the student, but the instructor can collect and update at the end of each round). 
  - How it changes:
    - In guilt-focused institutions (sealed confession, internal reflection training): 
      - If a student complies when unobserved, increase their internalization by 1.
      - If they transgress and then use the sealed confession, increase by 0.5 (reflection).
    - In shame-focused institutions (public reckoning, public training): 
      - Internalization does not increase (or increases only by 0.1 if they comply when observed? But we want shame not to build internalization).
      - Actually, we can have shame not build internalization at all, to highlight the difference.
    - When guilt-focused institutions are repealed, internalization decays by 0.5 per round (but not below 0).
  - Effect of internalization: When a student is unobserved, they have a higher chance of complying if their internalization score is high. We can model it as:
    - For an unobserved action, the student rolls a die (or uses a random number) to decide. The base chance to comply is 50%. Then add 10% per point of internalization (so at 5 internalization, 100% chance). But we don't want to use dice in class? 
    - Alternatively, the instructor can assign a threshold: if internalization >= 3, then they comply when unobserved. But that's deterministic and might be too absolute.
    - We can have the student decide, but the internalization score is a nudge: they are told that if their internalization is high, they feel a strong internal pressure to comply. We rely on the student to role-play accordingly? But that might be inconsistent.

  Given the complexity and time, we can simplify: 
  - The instructor does not reveal the internalization scores to the students until the end. 
  - At the end of each round, the instructor collects the index cards and updates the internalization scores (based on the rules above). 
  - For unobserved actions, the instructor can privately tell a student with high internalization (e.g., >=3) that they feel compelled to comply. But that might be too much work.

  Alternative: Make the internalization effect automatic in the scoring. The instructor, when counting unobserved compliance, counts a student as having complied if their internalization is above a threshold (say 3) even if they wrote that they transgressed? But that would be overriding the student's choice, which is not ideal.

  Better: We trust the students to role-play. At the beginning, explain that they will have an internal state that might influence their feelings. When they are making a decision in an unobserved situation, they are told their internalization score and what it means: "If your internalization score is 3 or higher, you feel a strong internal obligation to do the right thing even when no one is watching. You may choose to comply because of this feeling." Then they still decide, but the score is a factor.

  #### Scoring Summary
  - Group points each round:
    - +1 per observed compliance
    - +2 per unobserved compliance
    - -1 per transgression (regardless of observation)
    - Additional penalties from reckoning processes (e.g., -1 for public shaming if not reintegrated, -0.5 if reintegrated)
    - Cost of institutions (subtracted at the start of the round)
    - Exit penalty: -2 per exit (in Round 3 and after)

  #### Debrief (15 minutes)
  - Reveal the distinction between guilt and shame and map the game elements:
    - Shame: Relies on being observed. When anonymity increased (Round 2), shame-based groups saw more transgressions. Exit (Round 3) allowed people to leave and avoid shame, but the group lost resources. When institutions were repealed (Round 4), shame stopped working immediately.
    - Guilt: Internalization built up in guilt-focused institutions and led to compliance when unobserved (especially in Rounds 4 and 5). Even after repeal (Round 5), the internalization persisted and decayed slowly.
  - Discuss characteristic failure modes:
    - Shame: Hypocrisy (complying only when observed), exit, and the social cost of public shaming.
    - Guilt: Scrupulosity (overly strict self-punishment), and the lack of public repair (even if the individual feels guilty, the community might not know and trust is not restored without a public process).
  - Note what the game cannot capture: real emotions, the slow growth of internalization in childhood, and the normative question of which is better.

  ### Preventing Real Shame:
  - **Fictional Setting**: The transgressions are trivial and fictional (e.g., grain store, firewood). Nothing related to real-life wrongdoing.
  - **Anonymity**: Students make decisions privately (sealed envelope) and only aggregate results are shared. No public naming of transgressors unless it's part of the game mechanic (and then only in the fictional context). 
    - In public reckoning, do not use real student names. Instead, say "a member of the group" or use fictional identifiers (e.g., "Farmer A").
  - **Role-Playing**: Emphasize that they are playing a role in a simulation. The groups are fictional communities.
  - **Debrief Explicitly**: At the end, acknowledge that the game is an abstraction and does not reflect on anyone's real moral character.

  ### Potential Problems and Solutions:
  1. **Meta-gaming the point system**: Students might try to maximize points by always complying and avoiding institutions. But the point system is designed so that without institutions, unobserved compliance is hard (and in later rounds, without internalization, they will fail). Also, the fixed budget for institutions forces trade-offs. Emphasize that the goal is to build a sustainable community, and points are just a measure.

  2. **Collapsing shame into embarrassment**: In debrief, clarify the definitions:
     - Shame: "I am bad" (global self-evaluation) and requires an audience whose opinion matters.
     - Guilt: "I did something bad" (specific behavior) and can be private.
     - Embarrassment is a milder, more fleeting form of shame.

  3. **Accidental real shame**: 
     - Avoid any real-world examples.
     - Do not use real student names in public shaming; use fictional roles.
     - If a group chooses public reckoning, the transgressor is not the real student but their fictional role. The instructor can hand out role cards (e.g., "You are the baker") at the beginning to create distance.
     - In the debrief, explicitly state that the emotions in the game are simulated and not reflective of anyone's real character.

  ### Simplified Institution Menu (with Costs):
  1. Open-plan housing (1 point): Increases the chance of being observed (in observed opportunities, 100% observed; without it, 50% observed? But we don't want to complicate with probabilities). Instead, we can say: with open-plan, all actions are observed (if the group has open-plan, then every infraction opportunity is observed). Without it, half are observed (randomly assigned by the instructor). 
  2. Walls (free, but by default without open-plan, we have walls? Actually, we can have the default as no special housing, then open-plan as an option that costs 1 and makes observation more likely). 
     - Let's set: 
       - Default: 50% of infractions are observed (randomly by the instructor when handing out cards).
       - Open-plan housing (cost 2): 100% observed.
       - Walls (cost 1): only 25% observed (more privacy).
  3. Public reckoning (1 point) OR Sealed confession (1 point) [they can only choose one].
  4. Record-keeping (1 point) OR Deliberate forgetting (free, default is forgetting? Or default is no record-keeping? We can say default is no formal record-keeping, so no memory beyond the current round). 
     - Record-keeping: Transgressions are recorded and affect future rounds (if someone transgressed in a previous round and it was recorded, then in the next round they have a higher chance of being observed? Or in public reckoning, past transgressions can be brought up). This is complex. Maybe skip? 
     - Instead: Record-keeping gives a -1 penalty in the next round for each past transgression (to simulate ongoing distrust). Deliberate forgetting: no penalty.
  5. Cheap exit (1 point): Reduces the exit penalty to 1 point (from 2) and makes exit more likely (students who transgress may choose to exit at a lower cost to the group). Without it, exit is expensive (cost 2 and less likely? But we don't control the student's choice). 
     - Better: Cheap exit makes the penalty for exit 1 point (instead of 2) and also allows the exiting student to take 1 point from the group (simulating resource loss). Without cheap exit, exit costs the group 2 points and the student cannot take any points.
  6. Reintegration ritual (1 point): Reduces the penalty from public reckoning (if used) by 0.5 points. For sealed confession, it adds 0.5 to internalization when used (if they confess and then do the ritual, internalization increases by 1 instead of 0.5).
  7. Novice training: Public (1 point, increases the chance of observed compliance by 1 point for the group) OR Internal reflection (1 point, increases internalization by 1 for all members at the start).

  Given time, we might limit the menu to 4-5 options per round to keep it manageable.

  ### Running the Activity:
  - Total time: 5 (setup) + 5 (round0) + 10*5 (rounds1-5) + 15 (debrief) = 75 minutes (leaves 5 minutes buffer).
  - Prepare decks of infraction cards for each round (with "observed" or "unobserved" marked) and role cards (if using) in advance.
  - Use the whiteboard to track:
    - Group points (for each group)
    - Institutions each group has (with symbols)

  This should create an engaging activity that lets students discover the dynamics of guilt and shame cultures through experience.
answer: |-
  Here's a complete in-class activity designed to meet your goals, with safeguards against real shame emergence. It's a community simulation called "The Grain Trust Game" set in a fictional pre-industrial village to avoid real-world triggers.

  ### **The Grain Trust Game**
  **Core Conflict:** Villagers must decide whether to return borrowed grain (compliance) or keep it (transgression) under varying conditions.

  #### **Materials Per Group (6 students each)**
  - 6 index cards (private decision cards)
  - 6 envelopes (privacy for decisions)
  - 1 red token (cheap exit marker)
  - Institution menu (printed or whiteboard)
  - Scoreboard: Track "Community Trust Points" (CTP)

  ---

  ### **Setup (5 min)**
  1. Divide into 3 villages (6 students each).
  2. **Fictional context:** "You're villagers in a drought-prone society. Each season you may borrow grain. Returning it helps everyone; keeping it helps you short-term but harms the village."
  3. Give each student:  
     - 1 decision card (pre-printed with ☑️ "Return Grain" / ☑️ "Keep Grain")  
     - 1 envelope  
     - *Hidden:* Small dot sticker on their card (🌱 = internalization tracker, initially 0 dots)

  ---

  ### **Rounds (12 min/round; 60 min total)**
  **Each round = 1 "season" with 3 phases:**

  #### **Phase 1: Institution Shopping (2 min)**
  Groups spend CTP from a shared pool (start with 15 CTP) on institutions:
  - **Open Surveillance** (3 CTP): All actions observed next round  
  - **Closed Booths** (2 CTP): All actions private next round  
  - **Public Shaming Ritual** (2 CTP): Observed transgressions cost extra  
  - **Private Confessionals** (3 CTP): Unobserved compliance boosts later scores  
  - **Easy Exit Pass** (1 CTP): Allows one player to "leave village" penalty-free  
  - **Forgiveness Feast** (4 CTP): Resets transgression records  
  - **Youth Training Program** (4 CTP): Slowly adds 🌱 dots  

  #### **Phase 2: Grain Decision (3 min)**
  1. Instructor distributes **"Condition Cards"** (pre-made, varying per round):  
     - *Round 1:* 3 "Watched" cards (🌞 icon), 3 "Hidden" cards (🌑 icon)  
     - *Round 2:* 1 "Watched", 5 "Hidden" (simulates anonymity)  
     - *Round 3:* All "Hidden" + "Neighboring Village Opens!" memo  
     - *Round 4:* 3 "Watched", 3 "Hidden" + "Repeal 1 Institution Free"  
     - *Round 5:* All "Hidden" + "Institutions Disabled!"  
  2. Students decide in secret: Circle "Return" or "Keep" on card → seal in envelope.

  #### **Phase 3: Resolution & Scoring (7 min)**
  1. **Reveal outcomes:**  
     - For **"Watched"** players: Publicly report decisions.  
     - For **"Hidden"** players: Only report *aggregate* numbers (e.g., "3 kept grain").  
     *(No individual identities revealed)*  
  2. **Apply institutions:**  
     - Public Shaming: -2 CTP per *observed* transgression  
     - Private Confessionals: +1 🌱 dot per *unobserved compliance*  
     - Easy Exit: One transgressor may "leave" (sit out next round; village loses 1 CTP/round)  
  3. **Calculate CTP:**  
     - Base: +1 CTP per grain returned  
     - Penalty: -2 CTP per grain kept  
     - **Hidden Internalization Bonus:** +0.5 CTP per 🌱 dot *only for unobserved compliance*  
  4. **Update Trackers:**  
     - Youth Training: Add 1 🌱 dot to all if purchased  
     - Forgiveness Feast: Reset all transgression records  
     - Post-Repeal Lag (Rounds 4-5): Remove institutions but preserve 🌱 dots  

  ---

  ### **Key Twists by Round**
  - **Round 3 (Exit):** "Neighboring village" memo makes exit desirable. Easy Exit Pass holders can leave without penalty.  
  - **Round 4 (Repeal):** Groups repeal one institution (e.g., remove Shaming Ritual) but 🌱 dots persist.  
  - **Round 5 (Persistence):** Institutions disabled. Internalization (🌱) still affects scoring.  

  ---

  ### **Debrief (15 min)**
  Guide students to map game experiences to concepts:  
  | **Game Event**          | **Real-World Analog**                          |  
  |-------------------------|------------------------------------------------|  
  | Round 2 hidden actions ↑ | Shame collapses under anonymity               |  
  | Round 3 exits           | "Start fresh" in new community (shame escape) |  
  | Round 5 CTP from 🌱     | Guilt persists post-institutions              |  
  | Shaming penalties        | Public stigma lasting beyond repair           |  
  | Confessionals' 🌱 dots   | Internalized conscience growing slowly        |  

  **Failure Modes to Highlight:**  
  - Shame: Exit spree (Round 3), hypocrisy (public compliance vs. private transgression)  
  - Guilt: "Ghost CTP" from 🌱 (self-punishment outlasts rules), no community repair  

  **Explicit Limitations Note:**  
  *"This simulates structural effects—not the lived experience of guilt/shame. We can't grow a conscience in 80 minutes or replicate emotional weight. The 'better' question requires ethical reasoning we'll build next."*  

  ---

  ### **Safeguards Against Real Shame**
  1. **Strict Anonymity:**  
     - Hidden decisions never individually revealed.  
     - Aggregate reporting only (e.g., "two people kept grain").  
  2. **Fictional Detachment:**  
     - Use abstract resources (grain, CTP), not real-world analogs.  
     - Assign village roles ("Miller", "Baker") to add roleplay distance.  
  3. **Neutral Language:**  
     - "Keep grain" not "steal"; "transgression" not "sin".  
     - Frame all actions as structural dilemmas, not moral failures.  
  4. **Pre-Game Script:**  
     *"This is a mechanics simulation—like modeling gravity with marbles. Your choices reflect game incentives, not personal character. We are all testing systems, not morals."*  
  5. **No Self-Reporting:**  
     Students report decisions to *you*, not the group. You anonymize all data.  

  ---

  ### **Predictable Problems & Fixes**
  1. **Problem:** Meta-gaming points.  
     - *Fix:* Emphasize CTP as "community health" metric. Hide internalization scoring until debrief.  

  2. **Problem:** Shame = embarrassment conflation.  
     - *Fix:* Debrief distinction: "Shame: *I am bad* (global identity, requires audience). Guilt: *I did bad* (specific action, internal). Embarrassment is fleeting discomfort."  

  3. **Problem:** Accidental real shame.  
     - *Fix:* Rigorous use of safeguards above. If a student seems distressed:  
       - Pause and remind, "This is a system test—your role isn't you."  
       - Offer to let them audit from sidelines (no penalty).  

  4. **Logistical Hiccups:**  
     - Assign a "village scribe" per group to expedite scoring.  
     - Pre-make condition cards (icon-based for quick parsing).  
     - Simplify CTP math: Use whole numbers (e.g., 1 dot = +1 CTP).  

  ---

  ### **Why This Works**
  - **Hard Part Felt:** Students see shame fail instantly under anonymity/exit (Rounds 2-3) while guilt (🌱) lingers post-repeal (Round 5).  
  - **Low Tech:** Index cards + envelopes + whiteboard suffice.  
  - **No Prep Required:** Students need no prior reading; all concepts emerge from play.  
  - **Ethical Safety:** Structural focus prevents personal exposure.  

  This creates the visceral "aha" you want—where abstract lag and fragility become lived game realities—while keeping the emotional risk near zero.
