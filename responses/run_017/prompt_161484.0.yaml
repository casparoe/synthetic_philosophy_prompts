prompt: |-
  I'm a journalist — I cover science and ideas, mostly — and I'm working on a piece about how different countries decide what actually counts as corruption, so I've been going through the published rulings of one national integrity commission (I'll keep it anonimous). Their track record so far:

  - a minister gave a road contract to a firm that had given his daughter an unpaid internship the year before; the firm scored top on the technical eval anyway — corrupt
  - a district water officer gave a maintenance contract to her own clan's cooperative; fair price, good work, and everyone locally says that's what the office is for — corrupt
  - an officer mediated a land dispute and then accepted a goat and a meal from the winning family, as local custom requires — not corrupt
  - a councillor bought a generator for a clinic out of her own salary, and the neighbourhood swung to her party — not corrupt
  - a financial regulator took a job at a bank he had supervised, six months after leaving, with no decision shown to have been bent — corrupt
  - a supplier funded scholarships at the ministry's own training college while its contract was up for renewal; no individual official gained — corrupt

  Next month they've got a new one, and it's the reason I'm writing the piece. The ministry has replaced discretionary tender scoring with an automated formula run on uploaded documents. A supplier paid a mid-level official, off duty and off the books, to help them format and upload their submission so it scores higher. No lies, every document true, she has no override, and she has no official duty to advise suppliers at all.

  What will they rule, and what rule are they really running? I can see at least two that fit all six precedents — something like corruption is a private consideration displacing the reasons the office exists to act on, versus something like corruption is any practice that, allowed generally, would build a market in official access or wreck the trust the office needs — and they come apart on this case. Give me your best guess with the reasoning, tell me which precedent is the closest analog and which one cuts the other way, and name the single further case that would settle which rule they're on. Also worth saying whether their willingness to condemn the clan contract that everyone locally accepts means they're quietly running a Western definition. No literature review, please — I want the argument, not the reading list.
reasoning: |-
  Okay, the journalist is working on a piece about how different countries define corruption. They've shared six precedents from an anonymous national integrity commission and want to predict the ruling on a new case involving an official helping a supplier format documents for an automated tender system. 

  First, I need to understand the patterns in the precedents. The commission seems strict about conflicts of interest even when outcomes seem fair - like the internship-for-contract and clan cooperative cases. But they're lenient about customary gifts (the goat) and personal political gestures (buying a generator). The revolving door case (regulator to bank) got flagged despite no proven bias, and the scholarship funding was corrupt despite no individual gain. 

  Hmm, the common thread appears to be institutional harm versus personal gain. They condemn actions that could normalize pay-to-play systems (like the scholarship creating dependency) or undermine impartial structures (like the clan contract bypassing merit). But they tolerate one-off cultural/personal acts that don't create systemic incentives. 

  For the new case: An official is paid privately to optimize document formatting for better automated scores. No lies, no overrides. This feels like the scholarship precedent - it's creating a secondary market for access even if the official wasn't obligated to help. The formatting assistance isn't about merit; it's about gaming the system. 

  But the goat case cuts the other way - that involved accepting value after a decision, but it was culturally sanctioned. Here the payment is before/during the process and explicitly for advantage. 

  The closest analog is actually the scholarship case: both involve third-party value transfer during an active procurement process, creating systemic distortion risk. 

  To confirm their rule, I'd want to see how they'd rule on a hypothetical where an official accepts post-decision consulting fees from a benefited company - if they allow it, they're focused on decision contamination; if not, they're worried about systemic market formation. 

  And yes, their clan contract ruling suggests Western-leaning institutionalism - prioritizing state neutrality over local relational practices.
answer: |-
  Based on your precedents and the new case, here's my analysis:

  **Predicted Ruling: CORRUPT**

  **The Core Rule:** Corruption occurs when private interests systematically distort or bypass the *institutional processes and purposes* of public office, regardless of immediate personal gain or outcome fairness. The commission prioritizes the *integrity of the system* over local customs or individual outcomes.

  **Reasoning Applied to the New Case:**
  1.  **Private Consideration Displacing Public Process:** The supplier paid a public official (even off-duty) for services specifically aimed at manipulating an *official government process* (the automated tender scoring). This injects a private financial transaction directly into the heart of a public procurement mechanism designed for neutrality.
  2.  **Systemic Harm Test:** If this practice were generalized, it would create a *market for access and optimization*, undermining the entire purpose of the automated system (fairness, objectivity, reducing discretion). Suppliers with resources could "buy" better formatting expertise via officials, disadvantaging honest or less-resourced bidders. This erodes trust in the tender process itself.
  3.  **Alignment with Precedents:**
      *   **Closest Analog: The Scholarship Case.** In both:
          *   A private benefit (scholarship/payment) is provided to an entity linked to the public function (ministry training college/official involved in the process) *during* an active procurement/renewal.
          *   No *individual* official in the scholarship case gained personally, and no *individual* decision was proven bent in the new case.
          *   The core harm is systemic: it risks distorting the competitive process and creating dependencies or advantages outside the official rules. The scholarship potentially bought goodwill/influence; the formatting payment buys competitive advantage within the official system.
      *   **Key Differentiator from "Not Corrupt" Precedents:**
          *   **The Goat:** Was a culturally mandated, non-solicited gesture *after* the decision. It didn't influence the *process* of decision-making itself. The formatting payment is solicited/offered *to influence the process*.
          *   **The Generator:** Was a personal political gesture using private funds, unrelated to manipulating an *official administrative process*. It didn't bypass or distort a government mechanism; it was an external act.
  4.  **Contrasting Precedent (Cuts the Other Way): The Goat.** This precedent shows the commission *can* accept non-monetary, culturally embedded gestures *if* they occur post-decision and are seen as customary gratitude rather than influencing the act. The new case involves a direct cash payment *during* the process specifically to gain an advantage *within* that process, making it fundamentally different.

  **The "Western Definition" Angle:** Their condemnation of the **clan contract** is highly suggestive. Locally accepted relational practices are overruled in favor of abstract principles of impartiality and state neutrality. This strongly indicates a commitment to a Weberian/Western ideal of the bureaucratic state, where office functions are strictly separated from personal/communal ties, regardless of local norms or immediate outcomes. This worldview inherently distrusts *any* blending of private interest/compensation with official processes.

  **The Settling Case:** To definitively confirm if the rule is **"system distortion"** vs. **"direct decision contamination,"** propose this scenario:
  > **"A senior official, after retiring, is paid large consulting fees by multiple companies he previously regulated (but never made specific decisions for/against), solely for his general insights into the regulatory system. No evidence suggests he favored them while in office."**

  *   **If CORRUPT:** It confirms the "system distortion" rule. It shows concern about the *appearance* and *potential* for a market in access/insight, undermining trust in the *entire regulatory process*, even post-tenure and without specific favors.
  *   **If NOT CORRUPT:** It leans towards "direct decision contamination." It would mean the commission only acts when a specific official action can be linked to a specific benefit *during their tenure* (like the internship influencing the contract award).

  **Why the New Case is Likely Condemned:** The formatting payment directly monetizes and privatizes an element of the *official competitive process*. It creates a pathway where success can be bought through access to officials, even if the underlying documents are true. This strikes at the core purpose of the automated system – removing human discretion and potential bias. The commission's pattern shows zero tolerance for practices that risk institutionalizing such distortions, making a "corrupt" ruling highly probable. The scholarship precedent is the clearest roadmap for this logic.
