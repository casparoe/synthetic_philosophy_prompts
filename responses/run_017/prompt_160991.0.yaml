prompt: |-
  I work on a small internal governance group that has to write the value-specification section of a frontier model's deployment spec, and our group has drifted into using one analogy for everything. We say that an aligned system should be neutral among competing conceptions of the good in roughly the way a liberal state is supposed to be: it should not take sides on what makes a life go well, it should supply the framework within which individuals and communities pursue their own ends, and the only commitments it may enforce are the ones required to keep that framework standing. The analogy carries our working conclusion, which is that we never have to answer "whose values?" substantively. Aggregate only over what everyone could be given reason to accept, restrict the model's shared layer to that thin overlap, push the contested thick material downstream into per-user or per-deployment configuration, and the question dissolves into procedure.

  I want that analogy audited rather than endorsed or dismissed. Please do the following.

  Set out the correspondence explicitly: for each element of the liberal-state picture — the demos, territory and borders, citizenship, elections and other authorization mechanisms, the monopoly on legitimate coercion, the coercion-justification link that neutrality is supposed to answer, constitutional essentials versus ordinary legislation, public reason, the public/private distinction, the assumption that citizens can revise their own ends — say what, if anything, plays that role for a deployed model, and mark each mapping as clean, strained, or broken, with the reason in one line. Then identify the features the analogy quietly imports: things true of the source that the target does not have, and that are doing work in the argument rather than sitting inert. For this particular use I suspect the load-bearing ones include these, but tell me if I have the emphasis wrong:

  - A state's demos is bounded and persists across generations, and its authorization comes from that demos. A model's affected set is not a demos: it includes people who never opted in, people in jurisdictions with no input into our process, future people, and arguably nonhuman animals. Neutrality was a requirement about justifying coercion to those subject to it; that structure has no obvious counterpart when "being subject to" means being foreseeably affected by an output.
  - A model's outputs feed back into the values it later aggregates. State neutrality is supposed to leave the distribution of conceptions of the good to the citizens; a system that is neutral with respect to current输入 can still systematically reshape what people come to want, so neutrality here may fail to conserve the very thing it is supposed to leave alone.
  - A state must give one answer over one territory; a model can disaggregate. If each user can have their own value-profile, the framework/ends distinction that neutrality runs on may not have a fixed reference, and "letting users choose" may itself be a thick default rather than the absence of one.
  - The thin-overlap fallback may not be thin, may be empty or unstable, and may simply be the values of whoever we happened to sample. Neutrality among conceptions of the good is not the same as the intersection of the conceptions of the good actually on offer.
  - Neutrality and aggregation pull against each other. Voting-style aggregation produces winners and losers; neutrality is meant to avoid producing either. Our spec currently tries to do both, and I want to know whether that is incoherent or merely in tension.

  Then audit the conclusion. Does "we never have to answer whose values" survive once the disanalogies are on the table? If it does not, say exactly which premise the analogy was carrying.

  I also want you to adjudicate, using the audit, between four live options for the spec, rather than just describing them:

  1. Thin neutrality: shared layer restricted to the overlap, everything thick pushed downstream.
  2. Stake-weighted aggregation of thick values, where weight tracks how much a party is foreseeably affected rather than whether they are a user.
  3. Meta-aggregation: don't aggregate the values at all, aggregate the aggregation rule, chosen under a veil of ignorance about which value-profile one will end up having — a constitutional-level move that borrows the impartiality intuitions behind both Rawlsian and contractarian arguments.
  4. Radical disaggregation: per-user value-profiles with a minimal shared floor.

  Option 3 is our own invention and is the one I care about most. Does the liberal-neutrality analogy actually support moving the choice up to the constitutional level, or does that move presuppose a determinate demos at exactly the point where the analogy was supposed to relieve us of needing one?

  Work two concrete cases through whichever option you think strongest. First: a user asks the model for ordinary dietary and consumer advice, where the model must pick a default about how much moral weight nonhuman animals get. Second: a manager asks the model to help draft a workplace policy that will bind employees who never chose and never used the system. For each, say what the neutrality analogy prescribes, where the prescription runs out, and what your preferred option does instead.

  Finally, propose a better analogy if there is one — something that captures what is actually being done to affected parties without importing a bounded demos and a coercion monopoly. Candidates we have floated are a common carrier, a public utility, a professional fiduciary such as a physician or trustee, and a standards body; take these seriously or replace them, but say what each would license that neutrality does not, and what it loses.

  I don't want citations or a literature review — I want the argument, and I want it anchored to mechanisms we actually have available: system-level defaults, per-user personalization, jurisdiction-specific deployments, access tiers, and an internal oversight board.

  Return your answer as a single JSON object with exactly these fields:

  - "correspondence": array of objects with keys "liberal_state_element", "ai_system_element", "mapping" (one of "clean", "strained", "broken"), "reason"
  - "imported_features": array of objects with keys "feature", "in_source" (true/false), "in_target" (one of "yes", "partly", "no"), "work_it_does"
  - "load_bearing_disanalogies": array of objects with keys "disanalogy", "premise_undermined", "severity" (one of "fatal", "serious", "contained")
  - "inert_disanalogies": array of objects with keys "disanalogy", "why_it_does_not_matter"
  - "conclusion_audit": object with keys "conclusion", "survives" (one of "yes", "partly", "no"), "premise_the_analogy_was_carrying", "what_would_support_it"
  - "option_scores": array of objects with keys "option" (1-4), "verdict", "strongest_point", "fatal_or_serious_problem", "ranking" (1-4, no ties)
  - "option_3_assessment": object with keys "supports_constitutional_move" (true/false), "argument_for", "argument_against", "verdict", "repair_suggestion"
  - "worked_cases": array of objects with keys "case", "what_neutrality_prescribes", "where_it_runs_out", "what_preferred_option_does"
  - "better_analogy": object with keys "candidate", "correspondence", "what_it_licenses", "what_it_loses", "why_better_than_neutrality"
  - "residual_questions": array of strings, the questions the audit shows we still have to answer empirically or politically before the spec can be written
reasoning: |-
  We are given a complex query that requires structured output in JSON format. We'll break down the task step by step.

  ### Step 1: Correspondence between liberal state and AI system
  We need to map each element of the liberal state to an AI system element and judge the mapping as clean, strained, or broken.

  Elements to map:
  - The demos → the set of users or affected parties? (broken: no clear boundaries, no consent, includes non-users and non-humans)
  - Territory and borders → the deployment scope? (strained: deployment has boundaries but they are porous and not territorial)
  - Citizenship → user status? (strained: users are like citizens but non-users are affected without citizenship-like rights)
  - Elections and authorization → user feedback, oversight board? (broken: no democratic process for affected parties)
  - Monopoly on legitimate coercion → the model's outputs that affect behavior? (broken: model doesn't have a monopoly and its influence isn't coercive in the state sense)
  - Coercion-justification link → justification for model's outputs? (broken: model outputs aren't coercive, so neutrality isn't about justifying coercion)
  - Constitutional essentials vs ordinary legislation → system-level defaults vs per-user config? (clean: shared layer as constitutional, per-user as ordinary)
  - Public reason → the model's reasoning in the shared layer? (strained: model's reasoning is public but not necessarily based on public reasons as in Rawls)
  - Public/private distinction → shared layer vs per-user config? (clean: shared is public, per-user is private)
  - Citizens can revise their own ends → users can change their preferences? (clean: users can adjust their profiles)

  ### Step 2: Imported features
  Features true in the source (liberal state) but not in the target (AI system) that are doing work:
  - Bounded demos that persists and authorizes → in the AI system, the affected set is unbounded and doesn't authorize (in_target: no). Work: It carries the idea of legitimacy from consent.
  - State neutrality leaves the distribution of conceptions of the good to citizens → the AI system might reshape values (in_target: no). Work: Neutrality is supposed to be non-interference, but the model can interfere.
  - State gives one answer per territory → AI can disaggregate (in_target: yes, but not always). Work: The analogy assumes a fixed framework, but disaggregation changes that.
  - Thin overlap might not be thin → in the state, neutrality is about principles, not aggregation (in_target: partly). Work: The analogy assumes the thin overlap is stable and representative, which may not hold.
  - Neutrality vs aggregation → in the state, neutrality avoids winners/losers, but aggregation creates them (in_target: no). Work: The analogy tries to combine two incompatible ideas.

  We'll list these as per the query.

  ### Step 3: Load-bearing disanalogies
  We are to list disanalogies that undermine the premises of the argument, with severity.

  1. Disanalogy: The state's demos is bounded and authorizing; the AI's affected set is not.
     Premise undermined: The requirement of neutrality (as justification to the coerced) doesn't apply because the AI doesn't have a bounded demos and its outputs are not coercion in the same way.
     Severity: fatal (because the whole justification for neutrality is tied to coercion and a bounded demos)

  2. Disanalogy: The model's outputs can reshape values over time.
     Premise undermined: Neutrality is supposed to leave the distribution of conceptions of the good alone, but the model may change that distribution.
     Severity: serious

  3. Disanalogy: The state must give one answer; the model can disaggregate.
     Premise undermined: The framework/ends distinction may not hold because the framework can be customized, so neutrality (as a fixed framework) becomes ambiguous.
     Severity: contained (because disaggregation is an option that can be managed)

  4. Disanalogy: The thin overlap may be empty, unstable, or biased.
     Premise undermined: The idea that we can avoid substantive value choices by taking the intersection is undermined.
     Severity: serious

  5. Disanalogy: Neutrality and aggregation pull against each other.
     Premise undermined: The spec tries to be neutral and aggregate at the same time, which may be incoherent because aggregation creates winners and losers.
     Severity: serious

  ### Step 4: Inert disanalogies
  Disanalogies that don't affect the argument, e.g., the state has physical territory, the AI doesn't. But we must list some.

  - Disanalogy: The state has a physical territory; the AI system exists in digital space.
    Why it doesn't matter: The territorial aspect is not central to the idea of a framework for coexistence.

  - Disanalogy: The state has a monopoly on violence; the AI system has no such power.
    Why it doesn't matter: The coercion in the AI context is non-violent and indirect, but the core idea of influence might still be analogous.

  But note: we already considered coercion as broken and load-bearing. So we must pick disanalogies that are not load-bearing.

  ### Step 5: Conclusion audit
  Conclusion: "We never have to answer 'whose values?' substantively."

  Does it survive? Partly or no? Given the disanalogies, especially the bounded demos and coercion link being broken, the conclusion does not survive. The premise the analogy was carrying: that the shared layer (like the state) can be neutral by only including what everyone accepts, thus avoiding substantive choices. But without a bounded demos and without a clear justification for coercion, we cannot avoid the question.

  What would support it? If we could bound the affected set and obtain their consent, and if the model's influence were non-coercive and non-value-altering.

  ### Step 6: Option scores
  We have four options. We must assign a verdict, strongest point, fatal/serious problem, and ranking (1-4, no ties).

  Option 1: Thin neutrality
  - Verdict: Problematic due to disanalogies (thin overlap may be empty, and neutrality doesn't hold)
  - Strongest point: Clear separation, avoids imposing thick values.
  - Fatal/serious problem: Thin overlap may be empty or biased; also, it doesn't address value drift from feedback loops.

  Option 2: Stake-weighted aggregation
  - Verdict: Addresses the unbounded affected set but may be impractical.
  - Strongest point: Accounts for all affected parties, not just users.
  - Fatal/serious problem: How to measure stakes? May lead to tyranny of the majority or require contentious value judgments.

  Option 3: Meta-aggregation (constitutional choice under veil of ignorance)
  - Verdict: Innovative, but the veil of ignorance requires a defined group to apply it, which we don't have.
  - Strongest point: Impartial and fair, borrowing from established theories.
  - Fatal/serious problem: Without a defined demos, who is behind the veil? Also, it might not prevent value drift.

  Option 4: Radical disaggregation
  - Verdict: Maximizes individual choice but may lead to fragmentation and harm to non-users.
  - Strongest point: Avoids imposing values on users.
  - Fatal/serious problem: Doesn't address effects on non-users (e.g., in workplace policy case).

  Ranking (best to worst): 
  1. Option 3 (if repaired) because it aims for impartiality.
  2. Option 2 because it considers all stakeholders.
  3. Option 4 because it respects user choice but fails on non-user effects.
  4. Option 1 because the thin layer may be unworkable.

  But note: Option 3 is the user's invention and they care about it. We must assess it separately.

  ### Step 7: Option 3 assessment
  - Supports constitutional move? True in spirit, but the analogy doesn't support it because the demos problem remains.
  - Argument for: It lifts the choice to a higher level of impartiality, avoiding bias toward any particular value set.
  - Argument against: Without a bounded demos, we cannot define the parties in the original position. Also, the outcome might still be unstable due to feedback loops.
  - Verdict: It is a promising direction but needs repair to address the demos issue.
  - Repair suggestion: Define the constitutional group as the set of all foreseeable affected parties (including future generations) and use proxies (e.g., representatives) for the veil of ignorance. But this is non-trivial.

  ### Step 8: Worked cases
  Two cases:

  Case 1: Dietary advice (nonhuman animal weight)
  - Neutrality prescribes: In the shared layer, avoid taking a stance on animal moral weight. Push to per-user config.
  - Runs out: If the thin overlap has no position on animals, then the model might refuse to give advice or give a neutral answer that is unhelpful. Also, the user may not have set a preference, so a default is needed.
  - Preferred option (Option 3): The meta-aggregation would choose a default rule for animal weight that is acceptable behind the veil of ignorance (e.g., a moderate position that can be overridden). So the model might have a default of giving both plant-based and non-plant-based options, with a note about animal welfare.

  Case 2: Workplace policy affecting non-user employees
  - Neutrality prescribes: The shared layer should not take a stance on the policy, but it must be set by the manager. However, non-users are affected without consent.
  - Runs out: Neutrality cannot prescribe because the non-users are not part of the user base and have no configuration. The model might be forced to use the manager's values, which could be oppressive.
  - Preferred option (Option 3): The constitutional rule chosen behind the veil would require that policies affecting non-users must meet basic fairness standards (e.g., not exploitative). The model would then help draft a policy that respects a minimum floor of rights.

  ### Step 9: Better analogy
  Candidates: common carrier, public utility, professional fiduciary, standards body.

  - Common carrier: Carries goods/information without discrimination. Correspondence: The model as a carrier of information. What it licenses: Non-discrimination and equal access. What it loses: Doesn't address value conflicts. Why better? Avoids the demos problem by focusing on non-discrimination.
  - Public utility: Provides essential service. Correspondence: Model as utility. What it licenses: Regulation for public good, universal service. What it loses: Still requires defining the public. Why better? Recognizes the essential service aspect but still has boundary issues.
  - Professional fiduciary: Acts in the best interest of the client. Correspondence: Model as fiduciary to the user. What it licenses: Loyalty and care to the user. What it loses: Ignores non-user effects. Why better? For user-facing interactions, it might work, but not for broader impacts.
  - Standards body: Develops technical standards. Correspondence: Model's shared layer as a standard. What it licenses: Multi-stakeholder process for setting standards. What it loses: Standards bodies are not democratic. Why better? It explicitly involves multiple stakeholders and is procedural.

  Best candidate: Standards body. It avoids the demos problem by being procedural and multi-stakeholder, and it fits with the idea of a shared layer.

  ### Step 10: Residual questions
  - How to bound the set of affected parties for the purpose of aggregation?
  - How to prevent the model from reshaping values over time?
  - How to set the default when the thin overlap is empty?
  - How to include non-human animals and future generations in the consideration?

  Now, we structure the answer as a JSON object with the exact fields.
