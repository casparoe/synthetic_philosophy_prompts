prompt: |-
  I'm in a small reading group that has spent about two months on the inefficacy objection — the argument that since my individual flight, my purchase of factory-farmed meat, or my vote makes no difference to any outcome that matters, I have no reason grounded in outcomes to do otherwise — and we have stopped moving in a way I'd like to understand rather than just push past. One member treats the expected-difference reply as decisive and thinks the objection was refuted decades ago: even if my act almost certainly changes nothing, its expected value is the tiny probability of mattering times a very large harm, and that is all the arithmetic requires. A second member thinks that reply is beside the point even when it works: for her, the reason not to buy the meat is that one would then be participating in, profiting from, or failing to do one's share in a collectively imposed harm, and she is unmoved by the observation that no chicken's life goes better if she orders the beans. A third keeps insisting the whole thing is empirical and that we are speculating about supply-chain responses, electoral margins, and emissions trajectories that none of us has measured. Nobody has changed anybody's mind, and I notice that each of them reaches for whichever of the three cases — voting, meat, emissions — best fits their response, and quietly switches cases when pressure is applied.

  To get a grip on this I've started sorting inefficacy into three failure modes that I find it useful to keep apart. (i) Imperceptibility: my contribution really does add to the total, but the increment is below any detection or response threshold, so nothing observable differs. (ii) Redundancy or overdetermination: the outcome would have occurred anyway, at the same time and to the same degree, because enough other contributions were already in place — the landslide, the threshold already crossed. (iii) Displacement or substitution: my act changes something real in the short run, but the system reabsorbs it — the unsold unit is discounted and someone else buys it, the supplier adjusts the next order, my emissions are offset by a price change — so the long-run total is unchanged. My suspicion is that a good deal of the stall is a mismatch: the expected-difference reasoning looks compelling only for (i) and (ii), looks question-begging for (iii) because it presupposes the very counterfactual at issue, and is applied to whichever case happens to be on the page, while the participation and share-of-the-burden responses are really addressed to (iii) and get evaluated as if they were competing answers to (i). If that is right, at least part of this is a disagreement under a single name rather than a dispute, and there may also be a further slippage between asking which act has better consequences, asking what can be a reason for an agent to act, and asking what we may blame or praise someone for.

  So here is what I'd like: a diagnosis of this impasse rather than a verdict on the inefficacy objection, and a diagnosis that engages the distinction I've drawn — tell me where that three-way taxonomy clarifies things and where it distorts them, whether it collapses on inspection, and whether one of the three modes is doing all the real work in the literature's favorite examples. Is the disagreement substantive, verbal, or a matter of different questions being answered under one heading; is a hidden empirical question (about just how substitutable individual consumption actually is, or how sharp the thresholds are) carrying more weight than anyone admits; and do the non-consequentialist moves — complicity, fairness in the distribution of a collective burden, the expressive or symbolic quality of one's action — change the subject or answer the original one? Finally, given whatever you diagnose, say honestly what progress would even look like here: a distinction that dissolves one strand, a formal result about aggregation or expected value, an empirical measurement, a reframing away from act-tokens toward roles or policies — or an argument that this is bedrock disagreement about what counts as a moral reason and that no progress of any of those kinds should be expected. Please argue for the diagnosis; I'm not looking for a survey of the positions or for references to go read.
reasoning: |-
  Hmm, this is a rich and complex philosophical puzzle about the inefficacy objection. The user presents a sophisticated analysis of their reading group's impasse on whether individual actions like voting, buying meat, or emitting carbon matter morally when they seem to make no difference. 

  The core tension they've observed is fascinating: three distinct responses to inefficacy that map poorly to each other. The expected-value advocate focuses on microscopic probabilities of impact, the complicity theorist cares about participation in harm, and the empiricist demands real-world data. Crucially, each person selectively chooses examples that support their view - voting for expected value, meat for complicity - which creates talking-past-each-other dynamics.

  What's particularly insightful is their proposed taxonomy of failure modes: imperceptibility (real but undetectable impact), redundancy (outcome would happen anyway), and displacement (system absorbs the change). This seems like a genuinely useful diagnostic tool. I suspect imperceptibility and redundancy are where expected value arguments shine, while displacement undermines them by questioning the counterfactual. Meanwhile, complicity arguments gain traction specifically in displacement scenarios where systemic absorption occurs.

  The empirical questions here are thorny - we don't actually know how elastic meat demand is or how precise voting thresholds are. This uncertainty lets each side claim their preferred examples. And crucially, the moral questions might be fundamentally different: consequentialism vs deontology vs expressive ethics.

  For progress, I think we need to: 1) Admit the taxonomy creates distinct problems requiring different tools 2) Recognize that "does it matter?" means different things (causal impact vs moral complicity) 3) Accept that some disagreements stem from irreducible differences in what counts as a moral reason. The deepest divide might be between those who see morality as solely about consequences and those who see participation in unjust systems as inherently wrong.

  What's impressive is how the user has already identified the key structural issues. My role isn't to solve the philosophical problem but to help them see why their group is stuck - and why that stagnation reveals important truths about moral reasoning itself.
answer: |-
  Your diagnosis is remarkably acute—you've identified the core architectural flaws in this debate. The impasse isn't primarily about *whether* inefficacy objections hold, but about **three distinct moral-philosophical structures hiding under one name**, each with different failure states and immune to the same counters. Your taxonomy doesn't distort; it **exposes the joints** where conversations fracture. Here’s a breakdown:

  ### 1. **Why the Taxonomy Clarifies (and Why It Doesn’t Collapse)**  
     - **Imperceptibility (i)** and **Redundancy (ii)** are genuinely vulnerable to expected-value calculations. A 1 in 1 million chance of swinging an election *does* yield a non-zero expected utility. This is arithmetic, not philosophy.  
     - **Displacement (iii)** is the wrecking ball: it **undercuts the counterfactual** assumed by expected value. If your skipped burger purchase causes a price drop that *induces another buyer*, the "probability of mattering" isn’t tiny—it’s **zero** because the system negates your abstinence. Expected value here *presumes* your act is isolatable, but displacement says it isn’t.  
     - **The distortion risk**: Displacement scenarios (e.g., carbon emissions via cap-and-trade, meat via just-in-time inventory) often *masquerade* as imperceptibility. But displacement is a **systemic feature**, not a statistical fluke. Your group’s slippage between cases isn’t accidental—it’s strategic.  

  ### 2. **The Hidden Architecture of the Disagreement**  
     - **Substantive vs. Verbal? Both, and more**:  
       - **Substantive**: Your second member (complicity) isn’t answering the *consequentialist* question ("Does my act change outcomes?") but a **deontic** one ("Am I implicated in harm?"). This isn’t a rebuttal to (i)/(ii)—it’s a *different question*.  
       - **Verbal**: "Inefficacy" is used ambiguously. For the expected-value defender, it means "vanishingly small impact." For the complicity theorist, it means "no *causal responsibility* for harm," which displacement *does* achieve.  
       - **Empirical black box**: Your third member is correct that displacement debates (e.g., "Do unsold burgers reduce future orders?") are empirical—but **untestable at the individual level**. This uncertainty lets each side weaponize favorable examples (voting’s sharp thresholds vs. meat’s elastic demand).  

     - **The real divide**:  
       | **Failure Mode** | **Expected-Value Works?** | **Complicity/Fairness Works?** |  
       |------------------|---------------------------|--------------------------------|  
       | Imperceptibility | Yes (probabilistic harm)  | Weak (no salient participation)|  
       | Redundancy       | Yes (preemption matters)  | Moderate (you’re "part of" harm)|  
       | Displacement     | **No (counterfactual void)** | **Strong (you’re an enabler)** |  

  ### 3. **Non-Consequentialist Moves: Changing the Subject?**  
     - **Complicity/fairness doesn’t "answer" the consequentialist inefficacy objection—it renders it irrelevant**. If morality forbids *participation in unjust systems*, your individual causal impact is beside the point. This is why your second member switches to meat: displacement-heavy systems *maximize* the sense of participation.  
     - **But**: This move *only* resonates if one accepts that **fairness/complicity is prior to consequences**. The expected-value advocate sees this as evasion.  

  ### 4. **Where Empirical Questions Hide**  
     Displacement arguments live or die on **market/social elasticity**:  
     - If burger demand is perfectly elastic (your skipped purchase is fully offset), displacement holds.  
     - If electoral thresholds are razor-thin (your vote *could* break a tie), imperceptibility holds.  
     **The dirty secret**: Nobody knows the real elasticities. We use anecdotes as proxies for moral intuitions.  

  ### 5. **What Progress Looks Like**  
     - **Dissolve the conflation**: Admit you’re debating three distinct phenomena. Forcing clarity: *"Is your worry about redundancy in voting, or displacement in meat?"*  
     - **Targeted arguments**:  
       - Against displacement: Argue that **systemic effects aren’t automatic** (e.g., meat suppliers *don’t* perfectly adjust orders; carbon markets have friction).  
       - For complicity: Defend why **participation matters independently of outcomes** (e.g., corrupts character, expresses disrespect).  
     - **Reframe the question**: Shift from "Does my act *change* anything?" to **"What kind of agent do I become by acting in this system?"** This sidesteps the counterfactual quagmire.  
     - **Accept bedrock disagreement**: Between a hard consequentialist (only outcomes matter) and a deontologist (duties exist regardless), **no progress is possible**. But most people are pluralists—progress comes in showing which *context* justifies which framework.  

  **Honest Conclusion**: Your group is stalled because **each position is partly right against its preferred target but wrong against others**. The taxonomy doesn’t solve the moral questions, but it prevents them from being drowned in misdirection. Progress requires:  
  1. **Mapping each argument to its relevant failure mode**,  
  2. **Conceding that displacement breaks expected-value math**,  
  3. **Arguing the ethics of participation *separately* from causal efficacy**,  
  4. **Admitting that some disagreements reduce to irreconcilable first principles**.  

  The inefficacy debate isn’t one wall but a labyrinth—your taxonomy gives the map. Now the group must choose which corridors to explore.
