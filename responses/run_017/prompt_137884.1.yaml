  For commitment devices, the friend's conclusion doesn't follow. Even if we accept Kavka's premise, commitment devices work precisely by altering future incentives or removing options - they don't require forming impossible intentions. The lockbox example remains valid as it changes the cost-benefit analysis for future actions.

