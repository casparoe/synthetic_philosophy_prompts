  ### **Final Rationale Structure for Committee Output**  
  Embed the procedure's logic into your 2-page rationale:  
  1. **Signal & lookalike assessment** (Steps 1–2): Data tables showing trends/ruled-out factors.  
  2. **Loop mechanism summary** (Step 3): Bullet points on identity/instruments/etc.  
  3. **Response choice** (Step 4): Explicit "values handoff" if applicable.  
  4. **Monitoring** (Step 5): Indicators and review timeline.  

  This procedure makes looping theory actionable without naming it, focuses on clinical utility, and forces transparency about uncertainty. For EAED, it forces confrontation with pre-adoption contamination—adoption is defensible only if access needs outweigh loop risks, with strict monitoring.
