answer: |-
  Based on your description and the specific features you want carved, there is no single, universally established term within the rationalist/lesswrong canon or adjacent academic fields that perfectly captures *both* the magnitude-insensitivity *and* the threshold-fitting dynamic you identify as the core phenomenon. However, the concepts are recognised and discussed. Here's the carving, distinguishing established consensus from my own synthesis, and coining a term where needed.

  **Consensus Recognitions:**
  1.  **Pascal's Mugging (the wallet case):** This is the established label for the *general* problem you reference (objecting to unbounded expected utility calculations based on tiny probabilities of arbitrarily large claimed payoffs). This is undisputed consensus.
  2.  **Insensitivity to Magnitude in Expected Value:** It's widely acknowledged that once a claimed payoff is "sufficiently large" to overwhelm a tiny probability in an EV calculation, the *exact* magnitude beyond that point often becomes irrelevant to the *formal* argument. The threshold for "sufficiently large" is rarely specified rigorously in such arguments, making the magnitude seem arbitrary. This is generally accepted.
  3.  **Motivated Numeracy / Strategic Thresholding:** The phenomenon where an arguer (like the escalating mugger) tailors their claimed magnitude to just exceed their *perception* of the audience's scepticism threshold is recognised as a common rhetorical tactic or cognitive bias. It's related to concepts like "moving the goalposts" or "anchoring and adjustment" in a motivated way. This is accepted as a common occurrence, though perhaps not always labelled specifically for this context.

  **The Phenomenon You're Targeting:**
  Your core phenomenon is the *combination* of:
  *   **Magnitude Insensitivity:** The conclusion of an argument (often an Expected Value calculation) is invariant across a vast range of magnitudes once a minimal "large enough" threshold is passed. The specific large number used is functionally arbitrary within this range; only its property of being "very large" matters.
  *   **Threshold-Fitting:** The magnitude is strategically chosen (consciously or unconsciously) *by the proponent* to be just large enough to bypass the perceived scepticism threshold of the audience, rather than being derived independently from evidence or fixed principles. The magnitude is an output of this social/rhetorical process, not an input to the underlying reality.
  *   **Directional Primacy:** The actual work in driving the conclusion is done by the *direction* of the stakes (positive/negative, large/small probability) and the *form* of the calculation (EV multiplication). The specific large magnitude is a placeholder fulfilling a minimal "must be large" role, not a meaningful contributor to the argument's strength *within the vast range where insensitivity holds*.

  **Established Term Gap:** While elements are recognised, no standard term cleanly captures this *specific combination* of magnitude-insensitivity *plus* strategic threshold-fitting, highlighting the functional arbitrariness and rhetorical role of the large number. "Pascal's Mugging" is the broader category. "Motivated numeracy" or "strategic thresholding" capture the fitting aspect but not necessarily the insensitivity.

  **Coined Term: Threshold Tailoring**
  *   **Definition:** The rhetorical strategy or cognitive pattern where a proponent of an argument (typically involving small probabilities and large stakes) supplies a magnitude that is:
      *   **a)** Functionally arbitrary within a vast range above a minimal "large enough" threshold for the calculation's conclusion to hold (Magnitude Insensitivity).
      *   **b)** Strategically chosen to just exceed the perceived scepticism threshold of the intended audience (Threshold-Fitting).
      *   **c)** Serving primarily to fulfil the structural requirement for a "large" quantity in the argument's form, rather than conveying meaningful information about scale (Directional Primacy).
  *   **Core Feature:** The magnitude is a *fitted parameter* optimised for persuasion against a threshold, not an *independent estimate*.

  **Carving the Boundaries (Using Threshold Tailoring):**
  1.  **Measured Quantity (e.g., Current World Population):** *Not Threshold Tailoring.* The magnitude (8 billion) is derived from measurement/estimation, not strategically chosen to bypass a specific audience's scepticism threshold. Its value is fixed independently of any particular argument or audience. While it might *be used* in a small-probability-large-stakes argument, the number itself wasn't *generated* by the threshold-tailoring process. Its force *does* depend on its specific (measured) value relative to probabilities and other costs in a genuine EV calculation.
  2.  **Pre-Committed, Fixed Number:** *Not Threshold Tailoring.* If the arguer fixed their number (e.g., "1 quadrillion lives") based on some principle or model *before* encountering any specific audience or knowing their thresholds, and would stick to it regardless, this lacks the "Threshold-Fitting" component (b). The magnitude might still exhibit insensitivity (a) if varying it within a vast range doesn't change the conclusion, but it wasn't tailored. It's an argument *with* a large threshold, not an instance *of* threshold tailoring.
  3.  **Genuine Threshold Argument (Conclusion Moves with Magnitude):** *Not Threshold Tailoring.* If the argument's conclusion genuinely changes based on the specific magnitude (e.g., "We should act if at least 10,000 lives are at stake, but not for 9,999"), and this threshold is justified based on costs, probabilities, or principles *independent* of audience scepticism, then it's a standard threshold argument. The magnitude is doing meaningful work. Threshold Tailoring requires magnitude insensitivity *above* a minimal point and strategic fitting.

  **Distinguishing Nearby Concepts:**
  1.  **Plain Small-Chance-Large-Stakes Argument:** Can be legitimate and respectable. It becomes susceptible to Threshold Tailoring *if* the "large-stakes" magnitude exhibits the insensitivity and fitting properties defined above. The key difference is whether the large magnitude is a well-supported estimate or a strategically fitted, arbitrary placeholder.
  2.  **Pascal's Mugging:** This is the *problem scenario* in which Threshold Tailoring often operates. The Mugging *creates* the structure (tiny prob * huge util) where Threshold Tailoring becomes a viable strategy. Tailoring is a specific *mechanism* or *feature* frequently observed *within* Pascal's Mugging attempts (especially escalating ones). The Mugging is the broader paradox/objection; Tailoring is how the "huge util" number is often generated/presented.
  3.  **Psych Insensitivity to Scale (e.g., scope neglect):** This is a descriptive finding about human cognition (people don't feel/respond proportionally to large numbers). Threshold Tailoring is a *rhetorical strategy* or *argumentative pattern* that can *exploit* scope neglect, but it's distinct. Scope neglect is about the audience's *reception*; Threshold Tailoring is about the proponent's *construction* of the argument. One enables the other, but they are different phenomena.

  **Your Two Instances: Same Phenomenon?**
  Yes, they are both instances of Threshold Tailoring.
  *   **First Instance:** Demonstrates **Magnitude Insensitivity**. The argument's validity is presented as unchanged for any sufficiently large number, making the specific number arbitrary beyond being "large enough" (component a). The reply ("my number came from somewhere") attempts (often weakly) to deny component c, but the objection highlights the functional arbitrariness.
  *   **Second Instance:** Demonstrates **Threshold-Fitting**. The mugger adjusts the magnitude based on the *audience's perceived threshold* ("settled on how large a number they were prepared to take seriously"), making the number an output of the persuasion attempt, not an input about the world (component b). The shift in *reason* for ignoring (from size to fitting) highlights the core issue.

  **Synthesis & Guessing:**
  *   **Consensus:** Existence of Pascal's Mugging, potential for magnitude insensitivity in EV calcs, existence of motivated reasoning/numeracy are widely accepted.
  *   **My Synthesis:** Identifying the *specific combination* of magnitude insensitivity and threshold-fitting as a distinct rhetorical pattern ("Threshold Tailoring") and defining its boundaries as above. While the *components* are recognised, this precise bundling and labelling is my proposal in response to your request. I am *guessing* that this carving aligns with how many in the rationalist community perceive the pattern, even if unlabelled.
  *   **Guessing:** I suspect the reason the "my number came from somewhere" defence feels weak in the first instance is precisely because of the suspected Threshold-Fitting – the origin often *isn't* robust enough to overcome the functional arbitrariness implied by the magnitude insensitivity. The boundary cases (especially 1 & 2) help solidify that the issue is the *process of magnitude generation/selection* in relation to thresholds, not large numbers *per se*.

  In short, "**Threshold Tailoring**" captures the phenomenon you describe: the strategic use of an arbitrarily large, audience-threshold-fitted magnitude whose specific value is functionally irrelevant beyond being "large enough," serving primarily to satisfy the formal requirement of a directional argument. Its edges are defined by the absence of strategic fitting and the presence of magnitude-sensitivity.
