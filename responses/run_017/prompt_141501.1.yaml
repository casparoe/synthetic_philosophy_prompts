prompt: |-
  My editor Marisol has been reading my stuff for nine years and she has exactly one recurring note, which is that I write "ashamed" where the character should feel guilty and "guilty" where the character should feel ashamed. She's been right every single time and I have never managed to work out what her actual rule is. I've got one scene left before this book goes out and I'd rather not get the note again, so I want to guess it right the first time.

  Her track record on my last collection, as near as I remember it:

  - The Ledger: an accountant falsifies entries to cover a colleague's embezzlement, confesses a year later, repays it himself, the firm buries it, the colleague forgives him, and he still lies awake about it. She made me delete every instance of the word ashamed. Guilt.
  - Sous Vide: a chef tears into a line cook on camera, keeps her restaurant, pays him, he tells her they're fine, and the clip is still up. Shame — and she said the apology scene has to make things worse, not better.
  - Balcony: a lifeguard at a private club lets a kid flail a few seconds longer than she had to because the kid's father had been rude to her. Another parent films it from above, it does the rounds of the club, the kid is fine. She quietly funds swimming lessons for the summer. Shame, and she said the swimming lessons are the most shameful beat in the whole story.
  - Nightshift: a caregiver gives a resident the wrong dose because the pharmacy labelled two bottles identically. Nobody is harmed, she reports it herself, nobody thinks less of her. Neither. She wrote: if you give her either one you are writing a different book.
  - The Wall, which is set in the same archipelago as the novel I'm finishing now: a man is caught stealing from the communal store. The settlement's practice is that he sits facing the wall while everyone files past him, nobody says a word, and the next morning he goes back to his job with his standing exactly what it was. Guilt. She wouldn't explain this one beyond "obviously, that's the point of the wall."

  Two other things she's said in margins, which may or may not be the same opinion: on one story, that guilt is the one you can do something with; on another, that shame is the only one telling the truth about a person.

  The scene I have to write: Anet is the settlement's ice-reader, which there is a person you trust to read the ice, and being the sort of person who can do that is load-bearing for how everybody there talks about what a person is. On a solo crossing she realises something only she could know: she isn't reading it. She never could. She's been guessing for years and her guesses have been lucky, and she has kept taking people out onto the ice anyway. Nothing has gone wrong yet, no one has been hurt, and no one saw anything. The last chapter is the settlement's annual naming, where every adult says aloud the thing they are worst at, nobody responds, and standing is unchanged afterwards — I invented it in the first book and I genuinely don't know what I built.

  So: what does Marisol say Anet is feeling in the boat, and what does she say happens to it at the naming? I'm less interested in one verdict than in the two or three rules that fit all five of those precedents equally well and then come apart on this one — name them, say what each predicts about the boat and about the naming, and give me your best guess with the reason for preferring it. Which precedent is the closest analog, and what single change to the scene would flip her from one verdict to the other?

  And the bit I actually care about for the book: if the rituals are the culture choosing, then does Marisol's set of verdicts say a culture can choose which of the two emotions its people end up with, or only which situations set one off? Because the wall seems to be engineered to land on guilt and the naming looks to me like it's engineered to land on the other one, and if both can't be true I need to know which one I have to go back and rewrite in book one.
reasoning: |-
  Okay, let me start by understanding the user's problem. They have an editor, Marisol, who consistently corrects their use of "ashamed" and "guilty" in character emotions. The user provided five examples from previous stories where Marisol made specific corrections, and now they need to apply this to a scene in their current book. The key is to deduce Marisol's underlying rule for distinguishing shame and guilt.

  First, I need to analyze the examples. In "The Ledger," the accountant falsifies records to cover a colleague's embezzlement, confesses later, repays, and still feels bad. Marisol said it's guilt, not shame. The character's actions—confessing, repaying—suggest guilt focuses on the act and making amends.

  Next, "Sous Vide": the chef berates a line cook on camera, apologizes, but the clip remains. Marisol called it shame. The public nature and the lasting video imply shame is tied to external perception and identity. The apology making things worse supports that shame is about the self, not just the action.

  "Balcony": the lifeguard lets a kid struggle due to pettiness, gets filmed, and later funds swimming lessons. Shame again. The exposure and her silent acts of contrition (funding lessons) point to shame's internal, identity-related aspect. Marisol noted the swimming lessons as the most shameful beat, which might be because it's a private atonement that doesn't resolve the internal feeling.

  "Nightshift": the caregiver makes a medication error due to mislabeling, reports it, no harm done. Marisol said neither emotion fits. Here, the error was external (pharmacy's fault), she followed protocol, so no personal failure. This suggests that both emotions require a sense of personal responsibility or failure.

  "The Wall": a man steals from a communal store, undergoes a silent ritual, and returns to work without status change. Guilt. The ritual focuses on the act (stealing) and allows reintegration, aligning with guilt being action-oriented and resolvable.

  Marisol's comments add clues: guilt is "the one you can do something with," implying it's actionable. Shame is "the only one telling the truth about a person," suggesting it's core to identity.

  Now, the current scene: Anet, the ice-reader, realizes she's been faking her ability, risking lives but no harm yet. No one knows. She must participate in the annual naming ritual where adults confess their worst trait without consequences.

  The user needs to know what Anet feels (guilt or shame) and how the ritual affects it. They also wonder if cultures can choose which emotion prevails through rituals.

  Applying the rules: Anet's realization is about her identity as a fraud, not just specific actions. The secrecy and the fact that her role defines her standing point to shame. However, the lack of harm and her hidden failure might complicate it. The naming ritual involves confessing a flaw publicly without judgment, which could address shame by reintegrating her without rejection. But since shame is identity-based, would this ritual resolve it or make it worse?

  Comparing to precedents: "The Wall" is closest—public exposure of a wrong act leading to guilt. But Anet's situation is private and identity-related, more like the chef's shame in "Sous Vide." The naming ritual differs from the wall; it's about admitting flaws, not specific acts. If Anet confesses being a fraud, the ritual's lack of response might not alleviate shame because it's tied to her self-view.

  To flip the verdict: If Anet had caused harm, it might lean towards guilt over the action. If the ritual involved amends, it might address guilt. But as is, her internal crisis is about who she is, so shame seems likely.

  Cultural aspect: The wall ritual engineers guilt by focusing on the act, allowing reintegration. The naming ritual, by admitting flaws without consequence, might aim to neutralize shame by accepting imperfections. So cultures can design rituals to channel emotions, but the underlying feeling depends on the individual's perception of failure (act vs. self).
answer: |-
  Based on Marisol's track record and comments, her distinction between shame and guilt appears to follow a consistent psychological framework, likely drawing from thinkers like Tangney or Lewis. Here's the breakdown:

  ### Marisol's Core Rules (Inferred from Precedents & Comments)

  1.  **The Action/Identity Rule:**
      *   **Guilt:** Focuses on a *specific action or behavior* ("I **did** something bad"). It's about the *deed*.
      *   **Shame:** Focuses on the *global self* ("**I am** bad/fraudulent/inadequate"). It's about the *core identity* revealed by the deed.
      *   *Evidence:* Ledger (falsifying entries = specific bad act), Wall (stealing = specific bad act) = **Guilt**. Sous Vide (tearing into cook = reveals her as a bully/abusive boss?), Balcony (letting kid flail = reveals her as petty/unprofessional?) = **Shame**. Nightshift (no personal failure = **Neither**). Margins: "guilt is the one you can do something with" (actions can be fixed/atoned for); "shame is the only one telling the truth about a person" (it reveals the flawed self).

  2.  **The Locus of Judgment Rule:**
      *   **Guilt:** Primarily involves an *internal* judgment about violating one's *own* standards or causing harm. External judgment can trigger it, but the core is internal.
      *   **Shame:** Primarily involves the *perception (real or imagined) of judgment from others* or a violation of social standards defining *who one should be*. It's intensely social and tied to belonging/status. The "truth" shame tells is about how the self *fails in the eyes of the community/ideal*.
      *   *Evidence:* Ledger (internal torment over his *act*, despite colleague/firm forgiveness) = **Guilt**. Sous Vide (clip "still up" = constant *public* exposure/reminder of who she is perceived to be), Balcony (filmed, clip does rounds, *social* standing impacted) = **Shame**. Wall (ritual involves *external* gaze/judgment passing by, yet it resolves into **Guilt** because the ritual focuses on the *act* and *reintegration* – standing unchanged implies the *self* isn't permanently condemned). Nightshift (no judgment/internal failure = **Neither**).

  3.  **The Reparability Rule:**
      *   **Guilt:** Motivates reparative action (confessing, repaying, apologizing). Can be resolved through action and amends. "The one you can do something with."
      *   **Shame:** Motivates hiding, avoidance, withdrawal, or feeling fundamentally flawed. Actions taken (like the Chef's apology or Lifeguard's lessons) often *worsen* it because they highlight the flawed self needing to atone or hide. It's less resolvable through external action alone.
      *   *Evidence:* Ledger (confesses, repays, yet guilt remains *despite* action – but the action *is* the appropriate response) = **Guilt**. Sous Vide (apology *makes it worse*), Balcony (funding lessons is the "most shameful beat" – a hidden, inadequate attempt to soothe the flawed self) = **Shame**. Wall (ritual allows reintegration – guilt over the *act* is addressed, self is not condemned) = **Guilt**. Nightshift (reports it – appropriate action for the situation, no flaw = **Neither**).

  ### Applying the Rules to Anet's Scene

  *   **The Boat:**
      *   **Action/Identity:** Anet realizes "she isn't reading it. She never could." This isn't about a single bad guess; it's the revelation that her *core identity* ("ice-reader") is a complete fabrication. She *is* a fraud. This screams **Identity** focus -> **Shame**.
      *   **Locus of Judgment:** The terror isn't just about potential harm (internal guilt trigger), it's about the *implication* of what this means for her *standing* if discovered. "Being the sort of person who can do that is load-bearing for how everybody there talks about what a person is." Her value, her entire social self, is built on a lie. The imagined judgment is paramount -> **Shame**.
      *   **Reparability:** What can she *do*? Stop? Confess? But confessing destroys her identity and standing. There's no simple action to fix the fundamental lie about *who she is*. This feels paralyzing -> **Shame**.
      *   **Predicted Verdict: SHAME.** The core is the collapse of her identity, not a specific harmful act (yet). The precedents for hidden, identity-shattering revelations (Sous Vide's lasting reputation damage internally processed, Balcony's exposure of pettiness) point to shame. "The Wall" involves a public *act*; Anet's crisis is a private *identity* collapse.

  *   **The Naming:**
      *   The ritual involves confessing "the thing they are worst at." Standing is unchanged.
      *   **Applying the Rules:** If Anet names her flaw ("I am a fraud," "I cannot read ice"), she is publicly exposing the core identity flaw causing her shame. According to the Locus of Judgment rule, public exposure *intensifies* shame (Sous Vide clip). However, the ritual mandates *no response* and standing remains unchanged. This is key.
      *   **Possible Outcomes:**
          *   *Shame Intensifies:* Publicly naming her deepest flaw, even without overt judgment, could make her feel completely exposed and inadequate, worsening the shame (like the Chef's apology worsening things). The lack of response might feel like silent condemnation or profound awkwardness.
          *   *Shame Mitigated?* The unchanged standing is a powerful social signal: *"This flaw you named does not define you in our eyes or change your value here."* This directly challenges the Locus of Judgment. If Anet internalizes this, it could lessen the shame by decoupling the flawed act/identity from her social worth. However, shame is deeply internal; social acceptance helps but doesn't erase the internal self-condemnation instantly (Ledger's guilt persists despite forgiveness). The ritual doesn't involve *action* to repair (Reparability rule), so it might not resolve guilt if present, but it directly addresses the social component of shame.
      *   **Predicted Verdict:** Marisol would likely say the naming ritual **does not resolve the shame** in the moment, and might even make Anet feel worse (intensifying the exposure). However, the *unchanged standing* is the ritual's mechanism for *eventually* mitigating the social *consequences* of shame, potentially allowing reintegration *despite* the flaw. It doesn't erase the internal feeling ("truth about the person") but prevents it from destroying her place socially. Contrast with The Wall, which resolves *guilt* about an *act* through exposure and reintegration. The naming exposes a *flaw* and maintains standing.

  ### Best Guess & Reasoning

  *   **Verdict for Anet:** **Shame** in the boat. **Shame persists but social standing is secured** at the naming.
  *   **Reasoning:** The core of Anet's crisis is the collapse of her *identity* ("I am a fraud"), not the commission of a specific harmful act (guilt). The imagined/external judgment regarding her standing is central. The naming ritual forces exposure of that flawed identity but offers unconditional social acceptance (unchanged standing). This directly targets the *social* component of shame but is unlikely to erase the deep internal self-condemnation immediately. It prevents social death but doesn't cure the internal wound.
  *   **Closest Analog:** **Balcony.** Both involve:
      *   A hidden moral failure (petty revenge / fundamental fraud).
      *   Exposure (filmed / internal realization with fear of external discovery).
      *   Focus on identity (professional competence/personal character / core societal role/identity).
      *   Attempted private mitigation (funding lessons / ? - but the naming is public).
      *   Shame as the core emotion.

  ### How to Flip the Verdict (From Shame to Guilt)

  *   **Change:** Make the crisis about a *specific action* with a *clear path to amends*, minimizing the identity collapse and emphasizing the potential harm.
      *   **Example:** Anet *does* realize she misread the ice *once*, very recently, leading to a near-miss (no harm, but clear danger). She realizes she got complacent or distracted. The focus shifts from "I am fundamentally a fraud who never could" to "I committed a specific, dangerous lapse in judgment that could have hurt people." Her internal monologue focuses on *that action* and the harm it *almost* caused, rather than her entire identity. She thinks about how to confess this *specific error* and ensure it never happens again (improving protocols, training an apprentice, stepping down temporarily).
      *   **Why it Flips:** Now it's about a *bad deed* (Action/Identity -> Guilt). The locus is more internal (her own standards of care) than about her social standing as a person (Locus -> Guilt). There's a conceivable path to reparation (confess the lapse, implement changes - Reparability -> Guilt). This would align more with **The Ledger** (specific bad act, reparative actions possible).

  ### The Cultural Question: Can a Culture Choose the Emotion?

  Marisol's framework suggests a culture **cannot directly choose which emotion its people *feel***. The emotion arises intrinsically from the individual's perception of the event:

  *   Did they violate their own standards/cause harm (potential for Guilt)?
  *   Did they fail a social role/reveal a flawed self (potential for Shame)?
  *   Was there no personal failure/culpability (Neither)?

  **However, a culture can profoundly influence *which situations trigger which emotion* and *how that emotion is processed and resolved* through its rituals, values, and definitions of self/action.**

  1.  **Influencing Triggers:** By defining what constitutes a "self" versus an "action" and what merits judgment, culture shapes the interpretation. The Wall ritual defines theft as a *bad act* (triggering guilt) belonging to an otherwise acceptable person. The Naming ritual defines flaws as *inherent aspects of the self* that are *acknowledged* but explicitly *not judged* as diminishing standing (potentially triggering shame but aiming to neutralize its social consequences).
  2.  **Influencing Processing/Resolution:**
      *   **The Wall:** Engineered for **Guilt.** It focuses on the *act* (everyone sees *what you did*), provides a clear, contained ritual of exposure and judgment *specifically for that act*, and explicitly allows reintegration with unchanged standing. This ritual provides a path to resolve *guilt*: exposure -> symbolic judgment -> reintegration. It likely *prevents* the situation from spiraling into shame about the *self* by decoupling the act from the person's core value.
      *   **The Naming:** Engineered to **Neutralize the Social Power of Shame.** It forces exposure of the *flawed self* ("worst at"), but the rigid lack of response and unchanged standing is a powerful cultural message: *"Your flaws do not define your worth to us. You are still one of us."* It doesn't (and likely can't) stop the internal feeling of shame (the "truth"), but it aims to prevent that shame from leading to social exclusion, hiding, or destructive behavior. It *accepts* the potential for shame-inducing flaws but removes their social consequences.
  3.  **Can Both Be True?** **Yes.** Your rituals are consistent with Marisol's framework. They don't contradict.
      *   The Wall targets *acts* (guilt-triggering) and resolves them through exposure and reintegration.
      *   The Naming targets *inherent flaws* (shame-triggering) and mitigates their *social* destructiveness through exposure and unconditional acceptance. It acknowledges the potential for shame but refuses to let it dictate social standing.

  **Conclusion for Your Culture:** You don't need to rewrite Book 1. Your rituals show a sophisticated cultural understanding. The Wall deals with *transgressions* (guilt) by focusing on the act and ensuring reintegration. The Naming deals with *inherent human imperfection* (shame) by forcing acknowledgment but providing absolute social sanctuary. The culture recognizes both types of moral/emotional challenges and has developed distinct, appropriate rituals for each. It chooses *how* to handle the emotions, not which emotions people *feel*, but it powerfully shapes the *meaning* and *consequences* of those feelings. Marisol's verdicts support this interpretation: guilt is about acts you *can* do something about (like The Wall provides a path), shame tells a truth about the self that the culture (via The Naming) chooses not to punish socially.
