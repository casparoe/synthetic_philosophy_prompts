answer: |-
  Your difficulty is profound and sharply articulated—it cuts to the heart of preference formation, moral psychology, and theories of rationality. What you're observing **is not yet cleanly carved in philosophy or decision theory**, though it intersects with several named debates. The core tension is between two modes of "cleaning":  

  ### The Two Modes: Correction vs. Transformation  
  1. **Corrective Idealization (Filtering a Fixed Self)**  
     - *Process*: Add information, remove distortions (e.g., fatigue, ignorance), resolve conflicts.  
     - *Output*: A "better-informed" version of the **original agent**. Desires are *adjusted* but not fundamentally reconstituted.  
     - *Example*: A meat-eater who, after learning about factory farming, realizes her pre-existing compassion requires vegetarianism. The desire vanishes because it was contingent on ignorance.  

  2. **Transformative Idealization (Becoming a New Self)**  
     - *Process*: Deep reflection alters the agent's core values or identity. The "cleaned" state isn't a revision—it's a *different person*.  
     - *Output*: A self that may reject the original agent’s values. Conflicts between "before" and "after" selves are irreducible.  
     - *Example*: The entrepreneur. His pre-cleaning self values the project above health; post-cleaning, he values health above the project. The two selves are incommensurable.  

  ---

  ### Why Existing Concepts Don’t Capture This  
  | Concept              | Why It Fails to Match |  
  |----------------------|------------------------|  
  | **Sour Grapes**      | Focuses on *adaptive preference downgrading* (e.g., not wanting unattainable things). Your cases involve *aspirational upgrading*: the "cleaned" self sees prior desires as worse, not merely unattainable. |  
  | **Weakness of Will** | Involves acting against one’s *current* best judgment. Here, there’s no akrasia—judgment and desire shift together. |  
  | **Coherent Extrapolated Volition** (e.g., Yudkowsky) | Assumes a *convergent endpoint* under full reflection. Your cases show *path-dependence* and potential *divergence*. |  
  | **Informed Desire** (Griffin, Railton) | Treats information/reflection as commutative. Your cases show they’re not: **order matters**. |  

  ---

  ### Boundary Cases: Testing the Distinction  
  1. **Addiction**  
     - *Corrective*: "Cleaned" self rejects drugs after understanding health impacts.  
     - *Transformative*: The addict’s pre-cleaning self *identifies with the craving*; post-cleaning self disowns it. Conflict persists (e.g., "I miss the person I was").  
     - *Test*: If the cleaned self mourns the loss of the desire, it’s transformative.  

  2. **Religious Conversion**  
     - *Corrective*: A latent belief becomes explicit after study (e.g., C.S. Lewis’s "surprised by joy").  
     - *Transformative*: A rupture where prior values are repudiated (e.g., Paul on the road to Damascus).  
     - *Test*: Does the convert feel they’ve "become who they always were" (corrective) or "reborn" (transformative)?  

  3. **Child-to-Adult Preferences**  
     - *Corrective*: Adult preferences are matured versions of childhood impulses (e.g., curiosity → career).  
     - *Transformative*: Adult rejects childhood values (e.g., a prodigy abandons music they once loved).  
     - *Test*: Can the adult empathize with the child’s desires without sharing them (transformative), or do they feel continuous (corrective)?  

  ---

  ### The Teeth: Why This Distinction Matters  
  - **Ethics/Paternalism**: Corrective cleaning justifies nudges (restoring autonomy). Transformative cleaning risks *overwriting* the agent (e.g., forcing the entrepreneur to quit).  
  - **Decision Theory**: Idealized preferences must specify *which self* is idealized. Utilitarianism’s "fully informed" agent may be unrecognizable to the real person.  
  - **AI Alignment**: Programming an AI to satisfy "human values" requires choosing: current humans corrected, or humans after value evolution?  

  ---

  ### Proposed Name & Definition  
  **Phenomenon**: **Volitional Metamorphosis**  
  - *Definition*: A shift in preferences where the output of idealization (information + reflection) generates an agent whose core evaluative standards are discontinuous with the original, such that the pre- and post-idealization selves cannot be coherently unified under a single utility function.  
  - *Two Subtypes*:  
    1. **Autotelic Alignment**: Correction within a stable value framework (e.g., meat-eater → vegetarian).  
    2. **Allostatic Revision**: Transformation to a new value framework (e.g., entrepreneur → self-preservationist).  

  ### Key Differentiator: Commutativity Failure  
  - If **information → reflection** yields a different outcome than **reflection → information**, you’re likely dealing with Volitional Metamorphosis. The meat-eater case commutes (both paths end vegetarian); the entrepreneur’s does not (reflect first → doubles down; inform first → quits).  

  ---

  ### Conclusion  
  You’ve identified a genuine fissure in theories of idealized agency. **It is one phenomenon (value discontinuity under idealization) with two subtypes**, distinguished by whether the cleaning process *extracts* latent preferences or *generates* new ones. The closest established terms are Harry Frankfurt’s "identification" (corrective) vs. "reconstitution" (transformative), but these lack the epistemic dimension you note. If you develop this, anchor it in the non-commutativity of information and reflection—that’s the knife-edge your examples expose.
