  The meat-eater case shows *preference transformation*: new knowledge rewires desires seamlessly. The entrepreneur case is *preference revision*: knowledge forces a trade-off between conflicting selves. The non-commutativity insight is brilliant—order matters. If you reflect deeply *before* getting facts, you might entrench; get facts first, and reflection dissolves old desires.  

  Existing concepts fall short:  
  - **Sour grapes** discounts adaptive preferences, but here transformation isn’t adaptive—it’s aspirational.  
  - **Weakness of will** involves action-preference gaps; here, preferences shift holistically.  
  - **Coherent extrapolated volition** (e.g., Yudkowsky) assumes convergent endpoint, but the user highlights *multiple* stable points.  

  I’ll propose **Autotelic Alignment** vs. **Allostatic Revision** as core types. The first is desire-updating *within* a value framework (e.g., quitting meat aligns with pre-existing compassion). The second *changes* the framework (entrepreneur’s sacrifice contradicts his original identity).  

  Boundary tests:  
  - **Addiction**: "Cleaned" state rejects the addict’s self—purely allostatic.  
  - **Child-to-adult**: Both processes occur; the distinction clarifies which values are preserved.  
  - **Religious conversion**: Autotelic if affirming latent values; allostatic if adopting new axioms.  

