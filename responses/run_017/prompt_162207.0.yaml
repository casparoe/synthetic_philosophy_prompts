  ### Candidate Principle: Explanatory-Structure Underdetermination (ESU)
  Two theories \(T_1\) and \(T_2\) are genuinely underdetermined relative to evidence \(E\) if and only if:
  1. **Permanent Empirical Equivalence (PEE)**: \(T_1\) and \(T_2\) entail all the same observation sentences for any possible extension of \(E\) (i.e., no future evidence could discriminate them).  
     *(Forces: Case 2 – not underdetermined because colliders will resolve it; uncontroversial that evidence doesn't entail unique theories, but live dispute over whether permanent equivalence arises in mature science.)*  
  2. **Non-Redescription (NR)**: There is no definitional equivalence (e.g., a biconditional dictionary) that preserves truth values for all sentences (observational and theoretical) between \(T_1\) and \(T_2\).  
     *(Forces: Case 1 – not underdetermined as they are intertranslatable; uncontroversial that mere notational variants aren't rivals, but live dispute over whether "theoretical equivalence" can be defined without semantic commitments.)*  
  3. **Explanatory Structure Requirement (ESR)**: Both theories must posit distinct, projectible causal structures or laws (not merely contingent facts) that explain \(E\) and are not ad hoc or parasitic on the evidence.  
     *(Forces: Case 3 – not underdetermined because "grue" lacks projectibility and is time-indexed to evidence, failing lawlike structure; Case 4 – underdetermined as it posits a global causal structure (sudden creation) that explains evidence, however poorly. Uncontroversial that non-projectible predicates are problematic, but live dispute over whether "lawlike" or "causal structure" is objective or pragmatic.)*

  **Tiebreakers for underdetermination**: If underdetermined, belief should be guided by prior-theoretic virtues: simplicity, explanatory power, or fit with independently supported theories.  
  *(Forces: Case 4 – rejected via tiebreaker (prior improbability); Case 5 – underdetermined and requires tiebreaking; Case 8 – underdetermined and simplicity applies but may feel "crazy" if virtues conflict. Uncontroversial that virtues are used pragmatically; live dispute over whether simplicity is evidential.)*

