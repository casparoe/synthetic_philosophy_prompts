prompt: |-
  My friend (actual evolutionary biologist, works on social insects) and I got into a four-hour argument last night about the units of selection thing and I'm still not sure who won. Her line: genes vs. individuals vs. groups is a settled pseudo-debate — pick whichever level is convenient, run the accounting, the formal equivalence results mean there's no remaining causal fact of the matter to fight about. I kept saying that's too fast but couldn't say exactly where it goes wrong.

  Why I actually care: my own work is on cultural evolution, norms spreading through populations, and I suspect the equivalence results only look so clean because of the setups they're proved in. Discrete generations, groups that nest inside each other with no overlap, fitness effects that add up, and a well-defined level that reproduces. In my case basically none of that holds. People belong to several partially overlapping groups at once, there's no synchronized generation, transmission is oblique as well as vertical, the "replicators" (if that's even the right word for a norm) are too fuzzy to count the offspring of, and it's not obvious that a band or a village has group-level reproduction in the sense you'd need to partition fitness at that level at all.

  Concrete ask: I've got about two years, one grad student who's good with individual-based simulations and can read a bit of population genetics, and no wet lab. I want an agenda, not a survey, and defo not a reading list or citations — I can't look anything up right now and I want your own take. Give me roughly five questions worth working on, ordered, and defend the ordering: which ones are upstream of the rest, which are genuinely tractable for someone with simulations and light theory rather than a lab, which are already crowded, and what result in the next two years would move something up or down the list. Put "is there a causal fact of the matter about which level selection acts on" in the ranking if you think it survives proper statement, and if you think it dissolves, say what the surviving version is. Also flag any traditional questions I should just drop as pseudo-questions, because my friend thinks most of them are and I want to know if she's right.

  And this matters as much as the ordering: I want the settled and the contested kept seperate. She says things like "everyone agrees the Price equation is just bookkeeping, it's an identity" and I genuinely can't tell whether that's consensus among people who work on this or her side of the fight talking. Don't hand me a contested position dressed up as the received view.

  End with a single machine-readable line giving your top pick, like \answer{top priority: <short label for the question>}.
reasoning: |-
  Okay, let me tackle this user's query. They had a four-hour argument with their evolutionary biologist friend about the units of selection. The friend thinks it's a settled pseudo-debate where any level can be chosen for convenience due to formal equivalence results. The user works on cultural evolution and suspects these results might not hold in their field because of overlapping groups, no discrete generations, fuzzy replicators like norms, etc.

  First, I need to understand the core disagreement. The user feels the equivalence results are too clean for their context. They want actionable research questions, not just theory. Their constraints: two years, a grad student good at simulations, no wet lab. They need five ordered questions, justifying the order, tractability, what's upstream, crowded areas, and what results would change priorities.

  The user also wants clarity on settled vs. contested points. For example, the friend claims the Price equation is just bookkeeping, a consensus view. But is that really agreed upon, or is there nuance? I should flag where there's genuine debate versus settled matters.

  Starting with foundational aspects. In biological contexts, models assume clear hierarchies (genes, individuals, groups). But in cultural evolution, groups overlap, transmission is mixed, and replication is fuzzy. The Price equation can partition selection into within and between-group components, but its application might break down with overlapping memberships. That seems like a key starting point for investigation.

  So the first priority should be how group membership affects fitness partitioning. If groups overlap, the between-group term might not capture real causal effects. Simulating overlapping groups and varying membership could show where the Price equation fails or holds. This is tractable with agent-based models and upstream because if group selection isn't definable here, other questions might not matter.

  Next, transmission modes. Vertical, oblique, horizontal transmissions affect how norms spread. The Price equation might not handle non-vertical transmission well. Testing different transmission networks could reveal if multilevel selection models need adaptation. This builds on the first question but introduces transmission complexity.

  Third, defining replicators for norms. Are norms replicators or is it better to think of them as attractors? Agent-based models with mutable norms can explore inheritance variance. If norms don't replicate cleanly, traditional models might not apply. This is more conceptual but necessary for later questions.

  Fourth, group-level reproduction. Without clear group birth/death events, assigning fitness is tricky. Simulating group dissolution and formation under different conditions could test if group selection can be meaningfully defined. This depends on prior answers about groups and transmission.

  Fifth, reintroducing the causal question. If the first four show equivalence breaks down, then there might be a causal fact about the level of selection in cultural evolution. This is downstream and only makes sense after the others.

  Order justification: Without defining groups (Q1), other aspects can't be tested. Transmission (Q2) is next because it's crucial for cultural evolution. Replicators (Q3) come after, as they rely on transmission mechanics. Group reproduction (Q4) depends on the previous three. The causal question (Q5) is last as it hinges on the others.

  Tractability: Q1 and Q2 are simulation-friendly. Q3 is harder but doable. Q4 and Q5 are more theoretical. Crowded areas: Replicator debates are crowded; group reproduction in biology might not apply to culture. The causal question is perennially debated.

  Settled vs. contested: Price equation being an identity is settled. Its causal interpretation isn't. Equivalence requires strict conditions, which might not hold in culture. The user should avoid debates assuming clear replicators or reproduction.

  Top priority: Overlapping group membership's effect on fitness partitioning. It's foundational and tractable with simulations.
answer: |-
  Here's a focused, actionable agenda designed for your constraints and domain. It prioritizes questions where formal equivalence *likely breaks* in cultural systems and where simulations can force clarity. The ordering is based on conceptual dependency, tractability, and potential to invalidate downstream questions if answered definitively.

  **Core Premise:** Your friend is right *within the strict assumptions of the models proving equivalence* (discrete replicators, nested non-overlapping groups, additive fitness). Your suspicion is correct: these fail catastrophically in cultural evolution. The "pseudo-debate" dissolves only if the accounting works. If the accounting *can't* be run cleanly at a given level (e.g., groups) without violating core assumptions, then the causal question *reappears*. The surviving question isn't "which level *is* selected" universally, but "**under what empirically common conditions does multilevel selection accounting become impossible or nonsensical, forcing causal claims about dominant levels?**"

  ### The Agenda (Ordered & Justified)
  1.  **Q1: How do overlapping/fluid group memberships and multi-level affiliation disrupt the partitioning of fitness (via Price equation) into "within-group" and "between-group" components?** *Tractability:* High (Simulations). *Upstream?* Absolutely foundational. *Crowded?* Surprisingly under-explored for complex affiliations. *Why first?* The Price equation's "between-group" term relies on groups being mutually exclusive and well-defined. If an agent belongs to multiple groups simultaneously (work team, family, online community, religion) influencing the *same* norm, fitness effects become non-separable. Can you even *define* a group's fitness? Your simulation: Agents with traits (norms) exist in multiple, dynamic, overlapping groups. Fitness (e.g., social payoff, resource gain) depends on interactions *within* and *across* these groups. Attempt Price partitioning. *What moves it?* If simulations show partitioning variance explodes or becomes arbitrary with realistic overlap, Q1 is validated and forces reevaluation of "group" as a viable accounting level. If robust methods emerge, it supports equivalence (but unlikely in your domain). *Settled/Contested:* **Settled:** Price equation *is* an accounting identity (Σ(wΔz) = Cov(w,z) + E(wΔz)). **Contested:** Whether its terms have clear *causal interpretations* when group definitions are fuzzy/overlapping. Your friend is right about the identity, wrong if implying it *always* provides meaningful causal partitioning.

  2.  **Q2: Do oblique/horizontal transmission and continuous time break the validity of "generation"-based selection coefficients and the additivity of fitness effects across levels?** *Tractability:* High (Simulations). *Upstream?* Directly downstream of Q1 (transmission mode affects fitness attribution). *Crowded?* Some work in epidemiology/cultural evolution, but rarely integrated with strict multilevel accounting. *Why second?* Discrete generations are baked into most models proving equivalence. Continuous, asynchronous learning (oblique/horizontal) means "offspring" (adopters) are produced constantly by many "parents" (influencers) across groups. Fitness isn't summed neatly per "generation." Your simulation: Model norm adoption as a continuous-time network process (agents in overlapping groups). Track "fitness" (adoption rate/influence) of norms/agents/groups. Attempt to calculate selection differentials (Δz) over arbitrary time intervals using Price or alternatives. *What moves it?* If continuous/oblique transmission makes Δz highly sensitive to arbitrary time-window choice or renders additive partitioning nonsensical, equivalence breaks. If robust methods emerge (e.g., using flow measures), it supports equivalence. *Settled/Contested:* **Settled:** Discrete-generation models *assume* synchronicity. **Contested:** Whether continuous-time models can be *made formally equivalent* without losing empirical relevance or introducing artifacts.

  3.  **Q3: Can "norms" function as replicators with heritable variance? How does norm mutability, blending, and context-dependence impact the definition of "offspring" and the covariance term?** *Tractability:* Medium-High (Simulations + Light Theory). *Upstream?* Downstream of Q2 (transmission defines replication). *Crowded?* Very crowded (replicator debates), but *empirical quantification* of norm inheritance/similarity is thin. *Why third?* Equivalence requires something to *count* as offspring (replicas). Norms are fuzzy, mutate rapidly, blend, and express differently in contexts. Can you define a "norm offspring" and measure its similarity to the "parent" norm? Price's Cov(w,z) relies on heritable variation. Your simulation: Model norm transmission with mutation/blending. Quantify "fidelity" (similarity between influencer/adopter norm-states) and its variance. Explore how fidelity variance impacts the ability to predict Δz via Cov(w,z). *What moves it?* If norm fidelity is consistently too low/variable to support a meaningful covariance term (i.e., w and z are uncorrelated *because* replication is poor, not due to weak selection), replicator-level accounting fails, forcing focus on higher levels (agents/groups) – *if* they can be defined (Q1). *Settled/Contested:* **Settled:** Genes are high-fidelity replicators. **Contested:** Whether cultural traits *must* act as replicators for selection to operate (Dawkins vs. opponents), and how to empirically measure fidelity/variance in practice. *Drop:* Insisting norms *must* be "replicators" in the strict gene-like sense. Focus on *measurable* inheritance variance.

  4.  **Q4: Can "group-level reproduction" be meaningfully defined without discrete fission/fusion events? How does group dissolution/reformation impact fitness attribution?** *Tractability:* Medium (Simulations). *Upstream?* Relies on Q1 (defining groups) and Q2 (timing). *Crowded?* Some work in biology (e.g., asexual clusters), but sparse for fluid human groups. *Why fourth?* A key pillar of group selection is *differential group proliferation*. If groups don't "die" or "split" cleanly (they morph, merge, fade), assigning group fitness is impossible. Your simulation: Model groups forming, dissolving, merging, splitting based on agent interactions/norms. Attempt to define "group offspring" and measure group fitness (e.g., persistence time, splinter success). *What moves it?* If group birth/death is too continuous/fuzzy to assign fitness, group-level accounting collapses. If clear metrics emerge (e.g., network component survival), it *might* be viable. *Settled/Contested:* **Settled:** Biological groups (hives, colonies) *can* have clear reproduction. **Contested:** Whether this applies to most human groups. *Drop:* Assuming groups *must* reproduce like organisms.

  5.  **Q5 (The Causal Question, Survivor Edition): Under what empirically common conditions in cultural evolution does the failure of clean accounting at lower levels (gene-like replicator, individual agent) necessitate causal explanation primarily at higher levels (structured populations, networks, institutions), despite formal equivalence being theoretically possible under idealized assumptions?** *Tractability:* Low-Medium (Theory + Simulation Synthesis). *Upstream?* Entirely downstream. Requires results from Q1-Q4. *Crowded?* Perennially debated, but your focus on *breakdown conditions* is novel. *Why last?* This only makes sense *after* showing where and why equivalence *fails operationally*. If Q1-Q4 show Price partitioning is unstable/arbitrary for replicators (Q3) or individuals due to groups (Q1,Q4) or time (Q2), then the dominant causal drivers *de facto* reside at levels where accounting *is* possible (e.g., network position, institutional rules). *What moves it?* Concrete results from Q1-Q4 showing specific breakdowns. *Settled/Contested:* **Settled:** Causation is always multi-level. **Contested:** Whether the *dominant* locus of causation is identifiable when accounting fails, and whether this makes "levels" more than just pragmatic choices. This is *not* the classic "group selection vs. individual selection" debate; it's "when is multilevel accounting useless?"

  ### Key Takeaways & What to Drop
  *   **Agree with Friend:** Price equation *is* mathematical bookkeeping. Gene/Individual/Group equivalence *holds* under specific, stringent model assumptions.
  *   **Your Win:** Those assumptions **routinely fail** in cultural evolution (overlap, no generations, fuzzy replicators, no group reproduction). **This dissolves the *pseudo*-debate only by making the accounting impossible, which *revives* the causal question in a practical, empirical form (Q5).** The "causal fact of the matter" survives as: **"Which level(s) provide the most robust and empirically meaningful causal explanation *given the failure of formal equivalence*?"**
  *   **Drop:** Debates framed *solely* within the ideal assumptions (e.g., "Is group selection *theoretically possible*?" - Yes, but irrelevant if groups can't be defined). Debates demanding cultural replicators be *exactly* like genes. Debates about "true" units without specifying the accounting framework and its empirical feasibility.
  *   **Tractability Focus:** Q1 & Q2 are most simulation-ready and directly attack core assumptions. Q3 is crucial but requires careful norm representation. Q4 & Q5 synthesize results.
  *   **Settled vs. Contested:** Price = Identity (Settled). Price Terms = Clear Causal Forces (Contested, depends on setup). Equivalence = True Under Strict Assumptions (Settled). Equivalence = Empirically Relevant in Cultural Systems (Contested - your battleground).

  **Top Priority:** Attack the group definition/fitness partitioning problem head-on. If you crack this, the rest follows. If it's intractable, it sinks group-level accounting immediately.

  \answer{top priority: Q1_Overlapping_Group_Fitness_Partitioning}
