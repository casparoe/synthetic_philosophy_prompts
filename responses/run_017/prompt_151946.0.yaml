prompt: |-
  I chair the research-allocation committee of a biomedical funding foundation. For the last two cycles we have run our final deliberation under a procedure one of our members proposed as an implementation of Aumann's agreement theorem, and I am now unsure whether the procedure rests on the theorem or merely borrows its authority.

  The procedure is this. Before any discussion, each member privately writes down a probability that the shortlisted programme will meet its primary endpoint within five years. We then circulate the numbers, ask everyone to revise in light of what they have seen, and repeat until no one wishes to move; we rank the portfolio by the settled number. The rationale offered was that Bayesian agents who begin from a common prior cannot agree to disagree, so a number on which the committee has converged is the committee's rational posterior, and a member who declines to move toward the others is thereby displaying either irrationality or bad faith. To secure the common prior we circulate an identical evidence dossier to everyone a week beforehand.

  Two things have gone wrong, and I would like to know which of our background assumptions is at fault.

  First, the settled number has repeatedly fallen outside the interval spanned by our initial estimates, sometimes far outside; in the last cycle our private figures were 0.30, 0.35 and 0.40, and we converged on 0.85. I had taken it to be a consequence of the theorem that the consensus must lie among the starting points, and two members now treat the overshoot as proof that the procedure is broken. Is the theorem really in the business of constraining where the consensus falls relative to the individual starting points, or does it say something weaker?

  Second, a senior member has stopped revising at all. Her stated reason is that the common-prior assumption was never true of us: we come from different fields, we read the same dossier through different theoretical commitments, and there is no fact of the matter about our shared prior over the states. On that basis she says the theorem has nothing to say about this committee and that we are invoking it to discipline dissent. Does sharing a dossier secure a common prior, or does the antecedent of the theorem fail here in a way that makes our talk of the rational posterior empty?

  I would also like to know whether it matters that we exchange numbers only and never the reasoning behind them, whether the settled figure is the best estimate available to the panel or only a negotiated truce, and how the procedure should be redesigned if what we actually want to act on is the best estimate the panel's pooled evidence supports.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're chairing a biomedical funding committee that's been using a procedure based on Aumann's agreement theorem. The process involves members privately writing down probabilities, sharing them, revising, and repeating until convergence. But two issues have come up: the consensus probability ended up way outside the initial range (like 0.85 from 0.30-0.40), and a senior member refuses to participate, arguing they don't share a common prior.

  First, I need to recall what Aumann's theorem actually says. From what I remember, it states that if two rational agents have the same prior and their posteriors are common knowledge, they must agree. But in this case, they're only sharing probabilities, not the reasoning behind them. That might be a key point—common knowledge requires knowing why others hold their beliefs, not just the numbers. So the initial misunderstanding is that sharing numbers alone isn't sufficient for the theorem to apply.

  The overshoot issue is interesting. The user thought the consensus should lie within the initial range, but the theorem doesn't guarantee that. If members learn that others have different estimates, they might realize they've interpreted evidence differently. For example, one member might have caught an overlooked detail, causing others to drastically update their probabilities. But without sharing reasoning, it's hard to tell if this update is rational or just peer pressure. The committee might be mistaking conformity for rational updating.

  The common prior assumption is another big problem. The senior member argues that their different fields and theoretical commitments mean they don't share a prior. The committee thought distributing the same dossier would ensure this, but priors include how evidence is interpreted. If each member brings different background knowledge, the same data leads to different likelihoods. So the common prior isn't established, breaking the theorem's premise. This makes the "rational posterior" claim shaky—it might just be a negotiated truce, not a true Bayesian update.

  The user also asks if the settled figure is the best estimate. Without shared priors and full reasoning, it's more of a compromise. To get a better estimate, they need a structured discussion where evidence and models are shared. Techniques like prediction markets or Delphi method might help aggregate diverse insights without forcing consensus. Also, allowing dissent could preserve minority viewpoints that might be valuable.

  Underlying needs: The user wants a fair, rational process for funding decisions. They might be concerned about group dynamics overshadowing evidence, or dissent being suppressed. The senior member's resistance highlights a need for epistemic diversity. The committee needs a method that respects different expertise while synthesizing input effectively.

  Redesign suggestions: Shift from probability aggregation to evidence discussion. Have members present their reasoning, use structured debates, or assign weights to different models. Distinguish between probability estimates and funding decisions—consider cost of false positives vs. negatives. The goal is to leverage diverse expertise without forcing artificial consensus.
answer: |-
  Based on your detailed description, your committee's procedure misapplies Aumann's agreement theorem in several fundamental ways, explaining the observed problems. Let's break down the issues and redesign recommendations:

  ### 1. **The Overshoot Problem: Does the Theorem Constrain the Consensus?**
     - **Theorem's Core Claim**: Aumann's theorem states that if two rational agents share a common prior and their posterior beliefs (probabilities) become common knowledge, their posteriors *must be equal*. It **does not** guarantee the consensus lies within the initial interval.
     - **Why Overshoots Happen**:
       - When members see others' estimates, they infer that others possess *different interpretations* of the shared evidence. A low initial estimate from a trusted expert might signal overlooked risks, while high estimates might highlight missed opportunities.
       - Example: In your case (0.30, 0.35, 0.40 → 0.85), members likely realized their initial assessments overlooked key success factors implied by others' optimism. Without sharing reasoning, they overcorrected.
     - **Key Misconception**: The theorem ensures agreement under specific conditions, not that revisions are incremental or bounded by initial estimates. Overshoots can occur rationally if agents infer unobserved evidence from peers' beliefs.

  ### 2. **The Common Prior Problem: Does the Dossier Suffice?**
     - **Common Prior Requirement**: Aumann's theorem assumes agents start from identical prior probabilities over *all possible states of the world*, not just shared evidence.
     - **Why the Dossier Fails**:
       - **Interpretation ≠ Evidence**: Your members have different theoretical frameworks (e.g., a geneticist vs. an epidemiologist). The same dossier generates different likelihoods (P(Evidence|Hypothesis)) due to varying background knowledge.
       - **Priors Include Models**: A "prior" encompasses methodological beliefs (e.g., reliability of mouse models, clinical trial biases). These are field-specific and cannot be equalized by a single dossier.
       - **No Shared State Space**: There is no objective "state of the world" all members agree on (e.g., defining "success" may vary by discipline).
     - **Senior Member's Critique is Valid**: Without a true common prior, the theorem's conclusion ("rational posterior") doesn't apply. Forcing convergence becomes a disciplinary tactic, not Bayesian rationality.

  ### 3. **Critical Flaws in the Procedure**
     - **Exchanging Numbers Without Reasoning**:
       - **Violates Common Knowledge Requirement**: Aumann requires that posteriors (and the fact that they are final) be common knowledge. Sharing only numbers hides *why* beliefs changed, preventing rational updating. Members guess at others' reasoning, leading to herding or mistrust.
       - **Encourages Anchoring and Bandwagon Effects**: Seeing 0.85 after low initial estimates may signal "I missed something crucial," prompting irrational jumps.
     - **Is the Settled Figure "Rational"?**  
       - It is **not a true Bayesian posterior**. It's a negotiated truce influenced by:
         - Social pressure to conform.
         - Reputational concerns (e.g., junior members deferring to seniors).
         - Ambiguity about others' expertise.
       - Without shared priors and transparent reasoning, it has no claim to epistemic superiority.

  ### Redesigning the Procedure for Better Estimates
  To leverage your panel's expertise for a genuinely improved estimate, abandon Aumann-based enforcement. Instead:

  1. **Structured Evidence Discussion**:
     - **Require Reasoning Submissions**: Have members submit brief rationales with initial probabilities. Circulate these anonymized rationales before discussion.
     - **Model-Focused Deliberation**: Facilitate a discussion where members:
       - Identify key variables (e.g., "trial enrollment rate," "preclinical reproducibility").
       - Map disagreements to underlying assumptions (e.g., "We disagree on P(enrollment | pandemic)").
       - Explicitly share field-specific knowledge (e.g., "In oncology, this biomarker predicts...").

  2. **Aggregate Judgments without Forced Consensus**:
     - Use **prediction markets** (members trade "shares" of outcomes) or **Delphi method** (iterative estimates + reasoning with facilitator feedback).
     - **Weighted Averaging**: Assign weights based on expertise (e.g., a statistician's input on trial design carries more weight), but make weights transparent.

  3. **Calibrate and Track Performance**:
     - Maintain a registry of past estimates vs. outcomes to identify overconfident/underconfident members.
     - Train members on probabilistic forecasting (e.g., using reference class forecasting).

  4. **Accept Legitimate Disagreement**:
     - Where priors are irreconcilable (e.g., translational vs. basic science perspectives), quantify uncertainty through:
       - **Decision-Theoretic Voting**: Members submit funding preferences *and* probabilities; optimize for expected utility.
       - **Portfolio Diversification**: Fund some high-risk/high-reward projects alongside safer bets.

  ### Why This Works Better
  - **Epistemic Humility**: Acknowledges that diverse experts *should* disagree absent identical models.
  - **Exploits Diversity**: Transparent reasoning extracts unique insights from each field.
  - **Reduces Social Pressure**: Anonymized inputs and weighted aggregation limit bandwagon effects.
  - **Focuses on Evidence**: Shifts debate from "What number?" to "What assumptions matter?"

  Your current procedure mistakes mathematical consensus for truth, but science advances through contested evidence. Redesigned, your committee can transform interdisciplinary friction into a more rigorous risk assessment—without invoking theorems inappropriately. The goal isn't unanimous probabilities; it's a process where dissent improves collective judgment.
