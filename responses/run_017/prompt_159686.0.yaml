  - Necessity push (economic determinism) 
  - Complementary institutions (policy feedback) 
  - Framing bandwidth (cultural signaling) 
  - Release (unmasking innate differences) 
  - Index artifact (measurement error) 
  - Backlash (resistance theory) 

  For Necessity push, I'm weighting evidence from developing economies where STEM enrollment spikes among women facing scarcity. But is this effect symmetrical? The "crowding" metaphor might oversimplify. Would look for natural experiments where sudden wealth changes career distributions.

  Complementary institutions feels empirically strong - the Nordic paradox literature shows care-friendly policies correlate with female-dominated service sectors. But does this explain male-dominated tech fields? Maybe test by comparing sectors with varying work-hour flexibility.

  Framing bandwidth intrigues me as a cultural psychologist. The identity-signaling angle fits with class-based consumption theory. Would need cross-cultural data on career perception surveys. If poor countries describe jobs instrumentally ("feeds family") while rich countries use expressive terms, that supports this.

  Release hypothesis... tricky. The "innate differences" premise is contentious. I'll tentatively allocate points because some meta-analyses show cross-cultural stability in occupational interest gaps. But would downgrade sharply if new evidence shows these gaps emerge only post-socialization.

  Index artifact seems unavoidable - GGI weights political representation heavily, which may not reflect childhood gender neutrality. Controlling for wealth in regressions might reveal this proxy effect. Recent critiques by Stoet/Geary come to mind.

  Backlash feels least robust. Essentialist attitudes might resurge post-reform, but proving causal impact on career choices? Mixed evidence. Would need longitudinal data on attitude shifts after equality reforms.

  For part (a) about stated preferences: if surveys show same patterns as enrollments, Complimentary institutions loses credibility (policies shouldn't affect aspirations), while Release gains (suggesting deeper preference differences). 

  My most uncertain rating is Backlash - it's theoretically plausible but empirically murky. Could easily be 5% or 30% depending on how one interprets qualitative studies.

  Throughout, I'm anchoring ratings in meta-analyses like Charles & Bradley (2009), Stoet & Geary (2018), but noting where conflicting evidence exists. The user seems to want this dialectical approach - hence specifying what would change each estimate.

