  **Overturned Verdicts and Costs**:  
  - **Nested colonies**: Principle 1 overturns your "yes" if sub-colony states overlap with the whole (violating NO). *Cost*: Rejects intuitively compelling cases of hierarchical subjects. Principle 2 preserves your verdict via ID(a) (integrated dynamics).  
  - **Firm**: Both principles affirm your "no", resolving your tension with Aunt Hillary via OC/NED.  

