  The real kicker is the laundering problem: if conditioning determines both current desires AND what counts as "idealized" reasoning, you get circular validation. That's devastating for certain versions of indirect normativity. But maybe coherent extrapolated volition could escape this if the idealization includes exposure to suppressed options? Though the book seems pessimistic - John's hybrid Shakespearean values can't survive in either world.

