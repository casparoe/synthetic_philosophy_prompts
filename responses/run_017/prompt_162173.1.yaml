  We are building a diagnostic quiz to sort people into different philosophical positions regarding definite descriptions (like "the king of France", "the dog", etc.). The positions we want to cover are:

  1. Russellian view: "the F is G" means there exists exactly one F and that F is G. If there is no F or more than one F, the statement is false.
  2. Strawsonian view: "the F is G" presupposes that there is exactly one F. If this presupposition fails (no F or more than one F), then the statement is neither true nor false (truth-value gap).
  3. Donnellan's distinction: 
     a) Attributive use: the description is used to state something about whatever fits the description (similar to Russell).
     b) Referential use: the description is used to pick out a particular individual (the one the speaker has in mind) and say something about them, even if the description doesn't fit them perfectly.
  4. Presupposition projection: where uniqueness is treated as a presupposition that projects out of negation, questions, conditionals, etc. (This might be similar to Strawson but with a focus on embedding.)

  We also want to consider:
  - Cases with no referent vs. multiple referents.
  - Embedded contexts: negation, belief reports, conditionals, questions, etc.
  - Scope ambiguities (especially with negation).

