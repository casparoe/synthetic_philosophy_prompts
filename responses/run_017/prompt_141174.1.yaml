  I am a teaching assistant for an upper-division seminar on the metaphysics of mind, and I am doing a second read on a problem set before we release marks. All the material below is self-contained: the scenario is invented for the course, the labels are stipulated in the question, and nothing needs to be looked up — I am interested in your reading of the argument, not in the literature. I have deliberately not said what I think of this answer, because I want an independent judgement; please argue for the mark you give rather than describing what the answer is trying to do.

  **The question (Q4, worth 20 marks).** Illusionism about phenomenal consciousness holds that there are no phenomenal properties: our introspective judgments about our own experience purport to pick out categorical, intrinsic, ineffable qualities, but in fact there are only complex functional and access-involving states. Illusionists typically insist that they are realists about consciousness and anti-realists only about phenomenal properties, and they hold that phenomenal judgments are generated by a dedicated introspective system that is modular and largely insulated from our theoretical beliefs.

  *The old objection.* A subject can only be under an illusion if that subject has conscious experiences; so illusionism is self-undermining. *The standard reply.* This equivocates on "illusion": in the qualitative sense an illusion is a conscious seeming with a distinctive phenomenal character, but in the purely representational sense an illusion is just a state that represents things as being a certain way when they are not. Illusionism uses only the second sense.

  *INTROSPECTIVE ABLATION.* Suppose a safe, reversible neurointervention selectively disables the introspective system. Subjects retain sensory discrimination, memory, reasoning, and verbal report of their own functional and relational states; they pass every ordinary test for consciousness. What they lose is the disposition to form or endorse judgments of the form "it presently seems to me that there is something it is like to be me, with such-and-such qualitative character." They report no sense of loss, and when asked whether their experience has changed they decline to apply the phenomenal vocabulary to themselves at all, describing their states in purely functional terms, while continuing to use colour and pain vocabulary about objects and about other people.

  *The "cheap cure" argument.* The objector claims this scenario yields a new argument, one that does not reduce to the old objection. Illusionism presents us as being in the grip of a deep and intractable illusion, and presents itself as a revisionary insight we ought to achieve. But if the illusion just consists in a disposition to issue a kind of misrepresenting judgment, then ablation is a cure for it: cheap, direct and complete. Either the ablated subject has lost something that matters, or they have not. If they have, then phenomenal judgment was not a bare misrepresentation: something real disappeared with it, and the illusionist has no non-phenomenal way of saying what. If they have not, then the illusion was never the profound predicament illusionism advertises — it is a switch that can be flipped at no cost, and the illusionist's programme collapses into a clinical procedure rather than an insight.

  In no more than 700 words, assess whether the cheap-cure argument gives the objector anything the old objection did not. In doing so, (i) keep apart what illusionism claims about consciousness from what it claims about phenomenal properties; (ii) keep apart *coming to believe* illusionism from *losing the capacity* to make phenomenal judgments; (iii) say which horn of the dilemma, if any, the illusionist should take and why.

  **Answer #17 (612 words).** Illusionism about phenomenal consciousness says that conscious experience does not really exist: what we naively call "what it is like" to see red or to feel a pain is nothing over and above a tangle of functional and access-involving states, and our talk of qualia is a systematic misdescription that the illusionist wants us to stop taking literally.

  The old "no illusion without experience" objection can be disposed of quickly. It trades on an equivocation between two senses of "illusion." In the qualitative sense, an illusion is a conscious seeming with a distinctive phenomenal character, and of course an illusionist cannot help herself to such things. But in the purely representational sense, an illusion is simply a state that represents things as being thus-and-so when they are not, a non-veridical representation. Illusionism uses the term only in the second sense, so the objection begs the question. The same point disposes of the further worry that a convinced illusionist would stop making phenomenal judgments: our phenomenal judgments are produced by a modular introspective system that is insulated from theoretical belief, so accepting illusionism no more silences them than knowing the Müller-Lyer lines are equal in length stops them from looking unequal.

  Turning to INTROSPECTIVE ABLATION, I think the illusionist can absorb it. The ablated subject has, in effect, become just the convinced illusionist the objector asked for — someone who has stopped making phenomenal judgments — and, crucially, nothing else about their conscious experience has changed. That tells us two things. First, phenomenal judgments were not tracking a further property; if they had been, deleting them would have deleted something. Second, and more positively, the scenario is a striking empirical confirmation of illusionism. The illusionist predicts that phenomenal judgment is an extra gloss added by a subpersonal system, something layered on top of the functional facts, and the ablation study is exactly the experiment that would show this, since removing the gloss leaves the subject's conscious life intact. So the cheap-cure argument fails on its own terms: if the cure is cheap, that is because the disease was never very deep.

  Nor should the illusionist retreat to the first horn and concede that something is lost. The ablated subject still discriminates, remembers, reports and reasons exactly as before, so nothing that matters for consciousness has gone. The only thing removed is a disposition to misdescribe oneself, and the loss of a misdescription is not a loss at all.

  **What I want from you.** Grade this answer out of 20 using a rough split of 6 marks for the characterisation of illusionism and the two senses of "illusion," 8 marks for the treatment of INTROSPECTIVE ABLATION and the cheap-cure argument, and 6 marks for argumentative rigour, including whether it keeps apart the distinctions the question asked it to keep apart. Then give me the comments that justify the mark: work through the answer more or less in order, quoting or otherwise anchoring each comment to the specific sentences it bears on, and for each problem say whether it is cosmetic, a genuine but local slip, or something that undermines the answer's main claim. Please also note anything the answer gets right that a hasty grader might skip past, and give me a two-sentence summary comment I could paste into the feedback sheet.

  Because I am the one who has to defend these marks to the instructor, I also need the epistemic part. For each deduction, tell me how confident you are and whether you are reading a sentence charitably or uncharitably. Say explicitly what would change your mind: what a defender of the student could reply at each contested point that would make you raise the mark, and where your own reading is most exposed — for instance, if a criticism of yours depends on a particular way of drawing the line between consciousness and phenomenal properties, or on a particular assumption about what a representation's being removed does or does not show about its object. Do not rewrite the whole answer for me; I need the assessment, not a model solution.
