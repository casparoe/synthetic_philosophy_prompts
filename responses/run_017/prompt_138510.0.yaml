answer: |-
  ### Brainstorming Candidate Mappings

  **Candidate 1: Cells as Epistemic Reasons**  
  Treat partition cells as *reasons* (e.g., "the manuscript appears blurry") that support hypotheses. Updating cell probabilities = changing *confidence in reasons*. Fixed conditionals = *fixed evidential bearing* of reasons on hypotheses.  
  *Problem:* Reasons are typically *atomic* (e.g., facts or experiences), but cells are often *conjunctions* (e.g., "blurry & scanner-faulty"). This conflates undercutting (e.g., scanner faults) with rebutting (e.g., visual confidence). Translation distorts the basing relation. **Rejected.**  

  **Candidate 2: Cells as Higher-Order Evidence**  
  Treat new probabilities over cells as *higher-order evidence* about the reliability of first-order reasons (e.g., "my vision is untrustworthy"). Fixed conditionals = *no defeat* of evidential bearings.  
  *Problem:* Higher-order evidence typically targets justification, not the content of support relations. The formalism handles *first-order* evidential shifts (e.g., ink desaturation). Fails the manuscript test case. **Rejected.**  

  **Candidate 3: Partition as Evidential Context**  
  Treat the partition as a *context* defining how reasons bear on hypotheses. Updating cell probabilities = changing *which reasons are salient*. Fixed conditionals = *stable support relations* within contexts.  
  *Problem:* "Context" is ambiguous between doxastic states (e.g., awareness) and objective factors (e.g., lighting). Captures undercutting (changed context) vs. rebutting (changed salience) but risks conflating propositional/doxastic justification. **Selected for refinement.**  

  ---

  ### Translation Using Candidate 3  
  *Formal Claim* → **Reasons-Vocabulary Translation**  
  1. **Uncertain evidence update**  
     → *Revising your overall evidential state by reweighting the salience of contextual reasons, without new direct evidence.*  
     - *Manuscript example:* Bad lighting shifts confidence in *which visual reasons are relevant* (rebutting), while desaturation suspicion shifts *how those reasons support hypotheses* (undercutting).  

  2. **Invariance condition**  
     → *No undercutting defeat occurs: the support relation between reasons and hypotheses remains fixed within each context.*  
     - *Fidelity:* Clean. Invariance = no change in evidential bearing (undercutting), only in reason salience (rebutting).  

  3. **Non-commuting updates**  
     → *The order in which you reassess reason salience affects justification, as later assessments may alter the relevance of earlier ones.*  
     - *Fidelity:* Distorted. Non-commutativity arises from Bayesian math, not inherent to reasons.  

  4. **"Condition on experience" objection**  
     → *Formal methods are stopgaps; you should treat experiences as direct reasons (e.g., "I seem to see 'X'"), not contextual shifts.*  
     - *Fidelity:* Clean. Aligns with mental-state views of reasons.  

  5. **Patched rules (e.g., Wagner)**  
     → *Allowing undercutting defeaters to modify how reasons support hypotheses during updates (e.g., scanner faults reduce visual evidence weight).*  
     - *Fidelity:* Clean. Patched rules = undercutting shifts support relations.  

  6. **Grad student's collapse claim**  
     → *If undercutting is permitted, the distinction between changing reason salience and changing support relations dissolves.*  
     - *Fidelity:* Distorted. Collapse occurs only if patched rules are *unconstrained*—but reasons frameworks distinguish rebutting/undercutting structurally.  

  ---

  ### Stress-Testing Your Hypothesis  
  **Part 1: Invariance ≈ No undercutting**  
  - **Verdict:** Clean. Invariance requires that updates *only* shift confidence in reasons (rebutting), not their evidential bearing (undercutting).  

  **Part 2: Refinement rescues invariance**  
  - **Verdict:** **False.** Refining partitions (e.g., splitting "appearance A1" into "A1 with desaturation" and "A1 without") *doesn't prevent* undercutting:  
    - **Strongest objection:** New evidence (e.g., a scanner manual) can directly undercut *maximally specific cells* by revealing flawed priors (e.g., "even knowing desaturation, I misjudged ink-word correlations").  
    - **Manuscript failure:** If you refine to include desaturation, but later learn the scanner *also* distorts shapes, invariance fails again. Refinement chases elusive "maximal specificity."  

  ---

  ### Residue Report  

  #### Translation Table  
  | Claim | Translation | Fidelity | What Is Lost | Diagnosis |  
  |-------|-------------|----------|-------------|-----------|  
  | Uncertain evidence update | Reweighting contextual reason salience | Distorted | Partition structure and probabilistic rigor | Defect of reasons framework (lacks probabilistic syntax) |  
  | Invariance condition | No undercutting defeat of evidential bearings | Clean | — | — |  
  | Non-commuting updates | Order-dependent reassessment of reason salience | Distorted | Formal cause (Jeffrey’s equation) | Defect of formal claim (practical irrelevance?) |  
