  ### Adversarial Collaboration on the Sleeping Beauty Problem  
  **Joint Statement by Halfer and Thirder Advocates**  

  ---

  #### **1. Agreed Claims**  
  Both signatories endorse the following eight claims as foundational, non-trivial, and non-platitudinous:  

  1. **Protocol Certainty**: Beauty knows the entire experimental protocol in advance, including the fair coin flip, awakening rules, and memory-erasure. (High confidence)  
  2. **Awakening Awareness**: At every awakening, Beauty is aware that she is experiencing an awakening event and that the protocol is proceeding as described. (High confidence)  
  3. **Coin Fairness**: The coin is fair; prior to the flip, the objective probability of heads is 1/2. (High confidence)  
  4. **Awakening Multiplicity**: If the coin lands tails, Beauty is awakened twice (Monday and Tuesday); if heads, she is awakened once (Monday). (High confidence)  
  5. **Memory Erasure**: The drug ensures Beauty cannot recall prior awakenings within the same experimental run. (High confidence)  
  6. **Subjective Indistinguishability**: All awakenings feel identical to Beauty; she cannot distinguish between them by introspection. (High confidence)  
  7. **Betting Agreement**: If offered a bet at each awakening that pays £1 if heads and £0 if tails, the fair (indifference) price for the bet is £1/3. This is agreed upon by both positions. (High confidence)  
  8. **Disagreement Core**: The dispute concerns whether Beauty’s credence in heads upon awakening must equal the betting fair price (£1/3) and how self-locating uncertainty affects probability. (Medium confidence)  

  ---

  #### **2. Disagreements Table**  
  The table below catalyses key disputes. "Genuine" denotes substantive disagreement; "Verbal" denotes potential terminological divergence.  

  | Disputed Proposition | Halfer’s View | Thirder’s View | Neutral Restatement | Genuine/Verbal |  
  |----------------------|---------------|----------------|----------------------|----------------|  
  | **Beauty’s credence in heads upon awakening** | 1/2. Awakening provides no new information about the coin outcome; the prior remains unchanged. | 1/3. Awakening occurs in one of three equiprobable states (Mon-heads, Mon-tails, Tue-tails), with heads in one state. | Beauty’s credence depends on whether awakening justifies updating the prior coin probability. | Genuine |  
  | **Exchangeability of awakenings in sampling** | The two tails awakenings are perfectly correlated within a run, so they cannot be treated as independent samples. Sampling uniformly over awakenings overweights tails due to non-exchangeability. | The three possible awakening types are subjectively identical and should be treated as exchangeable samples. Sampling bias (like inspection paradox) validly reflects Beauty’s epistemic state. | Disagreement centers on whether intra-run correlation invalidates treating awakenings as a sample population. | Genuine |  
  | **Credence-betting relationship** | Credence (1/2) diverges from the fair bet price (£1/3) because betting occurs multiple times per tails run. Credence reflects belief; betting requires pragmatic adjustment for repeated exposure. | Credence (1/3) must equal the fair bet price (£1/3). Divergence implies incoherence; credence should align with rational action. | Whether credence must correspond to the fair price of a single-shot bet in this protocol. | Genuine |  
  | **Duplicate-variant credence** | Credence remains 1/2. Duplicates introduce no new coin information; self-location among persons is irrelevant to the coin outcome. | Credence becomes 1/3. Duplicates create three distinct first-person perspectives, making self-location among persons equivalent to temporal uncertainty. | Whether the standard and duplicate variants differ in how self-location uncertainty affects credence. | Genuine |  
  | **Nature of "new evidence" upon awakening** | Beauty gains no new evidence; she knew she would awaken. The awakening event is evidentially inert for the coin. | Beauty gains evidence that "this awakening is occurring," which is twice as likely under tails, justifying updating. | Whether the fact of awakening constitutes new evidence relevant to the coin flip. | Verbal (term "evidence" is contested) |  

  ---

  #### **3. Cruxes**  
  Four cruxes are identified. For each, a test/argument and pre-registered predictions are provided. Settling a crux would shift at least one position.  

  **Crux 1: Admissibility of Self-Locating Indifference**  
  - **Sub-question**: Can the Principle of Indifference apply to centered propositions (e.g., "I am awakening on Monday")?  
  - **Test**: *Variant with labeled rooms*. In the standard protocol, each awakening room has a unique hidden label (A, B, or C). On heads, Beauty wakes in A; on tails, she wakes in A (Mon) and B (Tue). Beauty knows the mapping. At awakening, she is asked for her credence that her room is A.  
  - **Halfer prediction**: Credence for room A is 1/2. Labels don’t change the coin prior; no update occurs.  
  - **Thirder prediction**: Credence for room A is 1/3. Three rooms are equally likely from her perspective.  

  **Crux 2: Exchangeability Under Perfect Correlation**  
  - **Sub-question**: Does perfect correlation of the tails awakenings invalidate treating them as distinct samples for credence?  
  - **Test**: *Long-run frequency analysis*. Run 1,000 experiments. Pool all awakenings (≈1,500). Sample one awakening uniformly at random. Calculate P(heads) in this sample.  
  - **Halfer prediction**: P(heads) = 1/2. The sample overrepresents tails runs (2 awakenings/run) but Beauty is not "randomly sampled" from this pool; she is in all awakenings of her run.  
  - **Thirder prediction**: P(heads) = 1/3. Beauty’s epistemic state matches being a random draw from the pool.  

  **Crux 3: Necessity of Credence-Betting Alignment**  
  - **Sub-question**: Must credence equal fair betting odds in this protocol?  
  - **Test**: *Betting without repetition*. Beauty is offered a bet only once: if heads, she is offered it on Monday; if tails, a coin flip decides which awakening (Mon or Tue) it is offered. The fair price is elicited.  
  - **Halfer prediction**: Fair price = 1/2. The bet is offered once per run, aligning with credence.  
  - **Thirder prediction**: Fair price = 1/3. The betting context is unchanged; credence must match.  

  **Crux 4: Temporal vs. Personal Self-Location**  
  - **Sub-question**: Does self-location among persons (duplicate variant) differ epistemically from self-location in time (standard variant)?  
  - **Test**: *Empirical duplicate variant*. Run the duplicate protocol (on tails, a duplicate is created; each awakened once). Survey participants on their credence in heads. Compare to standard protocol responses.  
  - **Halfer prediction**: Credence ≈1/2 in both variants. Subjective experience is identical; no duplication effect.  
  - **Thirder prediction**: Credence ≈1/3 in both variants. The number of first-person perspectives is identical.  

  ---

  #### **4. Closing: Evidence and Signatory Resistance**  
  - **What would falsify each view**:  
    - **Halfer**: If Crux 3’s "betting without repetition" yields a fair price of £1/3 *and* this is shown to necessarily equal credence.  
    - **Thirder**: If Crux 4’s duplicate-variant experiment yields credence ≈1/2 *and* participants cite duplication as irrelevant.  
  - **Shared falsifier**: Both agree that if the duplicate variant (Crux 4) yields credence ≈1/2 *while* the standard variant yields ≈1/3, the halfer must explain the difference; if both yield ≈1/3, the thirder is strengthened.  
  - **Refused formulations**:  
    - Halfer would reject: "Beauty’s awakening provides new evidence about the coin." (Verbal: defines "evidence" too broadly.)  
    - Thirder would reject: "The three awakening states are non-exchangeable due to correlation." (Genuine: denies core analogy.)  
  - **Confidence notes**: All claims marked "(High confidence)" reflect near-consensus in the group. Lower confidence (noted) arises where definitions (e.g., "evidence") are contested.  

  **Least Confident Point**:  
  The assertion that "the duplicate variant does/does not alter credence" (Disagreements Table, row 4) is the least certain. Predictions in Crux 4 are empirically testable, but the core disagreement—whether temporal and personal self-location are epistemically analogous—may resist resolution if participants’ intuitions diverge. This risks conflating descriptive psychology with normative epistemology. (Medium confidence in test design; low in decisiveness.)  

