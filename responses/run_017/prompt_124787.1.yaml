prompt: |-
  I'm seventeen, in the second year of sixth form, and I recently spoke at a debating competition on whether state support should come with conditions attached. I prepared it by reading about conditionality, sanctions, workfare-style schemes where you work for your payment, and the recurring panic about benefit fraud, and I came away with the opposite of a settled view: I have very firm reactions to individual cases and no idea what general thing I believe. I've written my verdicts down below in the hope that someone can tell me whether a single principle generates them, which of them I would have to abandon to get a principle, and what the principle says about the cases I can't make up my mind on.

  Marta is fifty-four, worked twenty-five years in a textile factory that closed, and is offered warehouse night shifts an hour's bus ride away, which she refuses because she looks after her mother three afternoons a week. She is sanctioned. I think that is wrong. Dwayne is twenty-three, walked out of a call-centre job he hated, refuses that employer's offer to take him back, and wants six months to finish a novel. I think it is fine to require him to take work or lose the payment, and I feel none of the anger I feel about Marta. But I also think unpaid volunteering at a food bank ought to count as meeting his conditions, and I cannot say why that is different from the novel. Aisha works four shifts a week for cash at her cousin's restaurant while claiming jobseeker's allowance and doesn't declare it. That is not just something the state may stop; it deserves an actual penalty, and it feels to me like a different kind of wrong from Marta's or Dwayne's, not merely a worse version of it. Ravi has severe depression, can't get a diagnosis in time, is recorded as fit for work, and loses money for missing a work-focused interview. I think that is worse than Marta's case, and I'm not sure why. Grace spends a lump sum on an enormous television. My considered view is that it is nobody's business, but I feel a flicker of irritation I can't defend. Sunil misses one appointment because the letter went to the wrong address and loses four weeks of money, which strikes me as grotesque, even though I find a four-week reduction proportionate for flatly refusing an offered job. Those two are structurally the same, and I react to them as if they weren't.

  The best I can do on my own is this: support is insurance-like, owed in virtue of past contributions together with present inability, so the state is entitled to investigate whether you are able to work but not to pass judgement on how well you use your time; fraud is a separate wrong rather than a failed condition, because it involves taking money under a false description of the facts, which is why it can be punished and not merely withdrawn; and any condition must be one the claimant could have known and met at the point of claiming, and must not be quietly tightened afterwards. A friend of mine says the whole matter reduces to whether someone is a net contributor over a lifetime, and I don't think that reaches Marta at all. Please test my three-part principle against the cases above and repair it where it breaks, stating the finished version precisely, clause by clause, with the case that motivates each clause. Then tell me, honestly, which of my verdicts no defensible version of it can keep. Finally, I'd like its verdicts on cases I haven't listed: Nadia, who refuses an offered job because the employer makes components for weapons; a lone parent who turns down work paying less than the childcare that would make the work possible; someone who stays in cash work because taking the formal job would cost them their housing top-up; and whether the same principle governs a pension or a student maintenance grant, or whether the insurance framing has been doing all the work in my verdicts about workers.
reasoning: |-
  Okay, let me start by understanding the user's situation. They're seventeen, in sixth form, and recently debated about conditional state support. They've presented several cases with their reactions and are looking for a consistent principle that can explain their judgments. The user is clearly thoughtful and analytical, having delved into topics like conditionality, sanctions, and benefit fraud. Their frustration comes from having strong gut reactions to individual cases but no overarching theory to tie them together.

  First, I need to parse each case they mentioned. Marta being sanctioned for refusing night shifts to care for her mom—user thinks it's wrong. Dwayne refusing a job to write a novel—user thinks sanctions are fine here. But then volunteering at a food bank should count, but why not the novel? Aisha committing fraud by not declaring cash work—deserves penalty, different wrong. Ravi with depression sanctioned—worse than Marta. Grace buying a big TV—user thinks it's fine but feels irritation. Sunil missing an appointment due to wrong address—sanction is grotesque, but refusing a job deserves four weeks loss. 

  The user proposed a three-part principle: support as insurance based on past contributions and present inability, fraud as a separate wrong involving deception, and conditions must be knowable and not tightened later. Their friend suggested net contributor over a lifetime, which user rejects for Marta. 

  Breaking this down, the insurance model makes sense for Marta, who contributed for 25 years. Her caregiving is valid non-labor contribution. Dwayne hasn't contributed much, so conditions are stricter. But why is volunteering okay but novel-writing not? Here, social contribution vs personal project might be key. Aisha's fraud is deception, fitting the second clause. Ravi's case shows the system failed to recognize his inability, making the sanction unjust. Grace's TV purchase—irritation might stem from perceived frivolity, but insurance model says it's her right. Sunil's case highlights procedural fairness vs substantive refusal.

  Now, the user's principle needs adjustments. The past contributions part works for Marta but not Dwayne. Maybe shift to societal membership: support based on membership, with conditions based on capability and reasonable demands. Volunteering benefits society, novel-writing doesn't, hence the distinction. Fraud remains separate. Conditions must be reasonable and procedurally fair—Ravi and Sunil's cases show failures here. Grace's irritation is a bias; the principle should ignore fund usage. 

  Testing against new cases: Nadia refusing weapons job—conscientious objection, should be protected. Lone parent with childcare costs—work must be economically viable. Cash work vs housing top-up—system creates perverse incentives, not individual fault. Pensions fit insurance model; grants are investment, so different conditions. 

  Honest verdicts: Dwayne's novel-writing not counting might not hold if society values art, but user's intuition prioritizes social contribution. Grace's TV—no defensible reason to criticize. 

  Final principle clauses: societal membership as basis, fraud as deception, reasonable conditions with procedural fairness. Each clause tied to specific cases. The user's need is for coherence in their values, understanding underlying principles, and reconciling emotional reactions with logical consistency. They might also seek validation that their intuitions are morally sound and a framework to apply in future debates or personal reasoning.
answer: |-
  Your struggle reveals deep moral intuition wrestling with systemic complexity—a sign of genuine critical thinking. Your cases expose tensions between compassion, fairness, contribution, and autonomy. Below I dissect your principle, rebuild it using your verdicts as guideposts, test its limits, and apply it to new cases.

  **Your Original Principle & Where It Falters:**
  1.  *Insurance Model (Past Contributions + Present Inability):* Works for Marta (25 years contributing) but fails Dwayne (minimal contributions). Doesn't explain why *volunteering* satisfies conditions but novel-writing doesn't.
  2.  *Fraud as Separate Wrong (False Pretences):* Perfectly captures Aisha: she *lied* to obtain funds she wasn't entitled to under the rules. Explains the punitive response.
  3.  *Knowable/Stable Conditions:* Explains your fury at Sunil (unforeseeable penalty) vs. acceptance of sanction for flat refusal. Also protects against arbitrary state power.

  **The Repaired Principle (Clause-by-Clause with Motivations):**

  1.  **Basis of Entitlement:** State support is owed to members of society experiencing *genuine, socially recognized impediments to self-sufficiency* (e.g., unemployment, disability, care responsibilities). Past contributions *reinforce* but do not *define* entitlement; societal membership and need are primary.  
      *   *Motivated by:* Marta (long work history *reinforces* claim, caregiving is *socially recognized impediment*), Ravi (depression is *genuine impediment*, system failure doesn't negate this). *Repairs:* Dwayne (entitled based on need/societal membership, not past contributions).

  2.  **Conditionality:** Conditions attached to support must be:  
      a.  **Reasonable:** Demands must account for the claimant's physical/mental capacity, skills, geography, family responsibilities, and the *net benefit* of compliance (e.g., work must pay more than costs incurred). Sanctions require a *refusal without good reason*.  
      *   *Motivated by:* Marta (demand unreasonable due to commute/care), Dwayne refusing job (reasonable to demand *some* activity), Lone Parent (work must be economically viable).  
      b.  **Socially Purposeful:** Activities satisfying conditions must demonstrably contribute to societal well-being *or* the claimant's realistic reintegration into self-sufficiency.  
      *   *Motivated by:* Dwayne volunteering (social contribution) vs. novel-writing (personal project lacking guaranteed societal/reintegration value). Distinguishes "good reasons" for refusal.  
      c.  **Procedurally Fair:** Conditions must be clear, knowable at claim outset, and stable. Penalties require proven *culpable failure* (intentional refusal, negligence). Errors by the system or unavoidable accidents negate culpability.  
      *   *Motivated by:* Sunil (no culpability - system error), Ravi (system failure negates culpability), vs. Dwayne refusing work (culpable choice).

  3.  **Fraud:** Deliberate misrepresentation (e.g., hiding income/assets, falsifying circumstances) to obtain support constitutes fraud. This is a *distinct wrong* meriting punishment (fines, prosecution) beyond mere benefit recovery, as it undermines the system's integrity and exploits fellow citizens.  
      *   *Motivated by:* Aisha (deliberate deception for gain).

  4.  **Autonomy of Use:** Once support is legitimately provided, the recipient has the right to spend it according to their own priorities and values, free from state or social scrutiny (absent fraud).  
      *   *Motivated by:* Grace (irritation is bias; spending choice is hers).

  **Honest Verdicts Your Repaired Principle CANNOT Keep:**

  1.  **Dwayne's Novel:** Your principle (Clause 2b - Social Purpose) *cannot* defend counting novel-writing as meeting conditions. While art *can* have societal value, its *immediate* contribution to reintegration or measurable social good is speculative. Your intuition that volunteering *should* count but novel-writing *shouldn't* is upheld, but your *feeling* that the novel *ought* to count conflicts with the principle's requirement for demonstrable social/reintegration purpose. You'd need to abandon either this intuition or Clause 2b.
  2.  **Grace's Irritation:** The principle (Clause 4) *forcefully* rejects your flicker of irritation as unjustified paternalism. Your "considered view" (nobody's business) aligns with the principle; the irritation does not.

  **Verdicts on New Cases via Repaired Principle:**

  1.  **Nadia (Refuses Weapons Job):** *Likely Protected.* Conscientious objection based on deeply held ethical beliefs is a "good reason" under Clause 2a (Reasonable). Forcing work violating core morals is unreasonable unless the refusal is demonstrably frivolous or harmful (e.g., refusing *all* jobs vaguely connected to anything "unethical" without a coherent principle). Requires careful, individualized assessment.
  2.  **Lone Parent (Work Pay < Childcare):** *Refusal is Reasonable.* Clause 2a explicitly requires assessing *net benefit*. Working at a net financial loss due to childcare costs is economically irrational and unreasonable to demand. Support shouldn't trap people in pointless poverty.
  3.  **Cash Work vs. Housing Top-Up:** *Not Fraud, but System Failure.* This person is *trying* to work/earn. The problem is the "benefits cliff" created by the *system* (losing housing support upon taking formal work). Clause 3 (Fraud) requires *deliberate deception*; here, the *system* incentivizes non-disclosure/hiding work. The solution is policy reform (taper support gradually), not punishment. Sanctioning would be unreasonable (Clause 2a).
  4.  **Pensions vs. Student Grants:**
      *   **Pension:** Fits the *Insurance Model* well (Clause 1 reinforced by past contributions). Conditions are minimal (age) because inability (retirement) is presumed permanent. Sanctions are generally inappropriate.
      *   **Student Grant:** Fits *poorly* with the insurance model. It's an *investment* in future human capital/productivity (societal benefit), not support for inability. Conditions (e.g., academic progress, future repayment like a loan) are justified under a *different principle* (promoting opportunity/social return on investment). Your insurance framing *was* doing heavy lifting for worker-focused benefits.

  **Conclusion:** Your core intuitions—about fairness, reasonableness, avoiding cruelty, punishing deception, and respecting autonomy—are sound. The repaired principle systematizes them. It shifts from pure "insurance" to **societal membership supporting those facing recognized impediments, conditional on reasonable, purposeful, and fairly administered requirements, with fraud punished separately, and personal spending choices respected.** It won't eliminate all hard cases (e.g., defining "good reason" or "social purpose"), but it provides a robust, ethically consistent framework far stronger than lifetime net contribution. Keep wrestling with the tensions—it's the mark of a thoughtful citizen.
