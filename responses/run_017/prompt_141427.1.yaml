answer: |-
  Here are five desiderata for an adequate account of what matters in survival, based solely on your specified cases and constraints:

  1. The account must distinguish the *obtaining* of the relation that matters from the *rational prudential attitudes* (e.g., anticipation, fear) held by the subject towards their future states, as demonstrated when a fully continuous **Reluctant Replica** disavows concern despite meeting the putative survival criteria. [non-negotiable] *Conflict possible with 5 if prudential attitudes define the relation.*

  2. The account must specify how it handles *degrees* of diminished survival, such as in **Lossy Scan**, by committing to whether it requires a cardinal measure, a threshold for "enough" survival, an aggregation method for partial relations, or a denial that degreed survival is coherent—and justify that choice. [negotiable: a preference of reductionist camps accepting degreed facts] *Conflict possible with 1 if degrees undermine rational anticipation.*

  3. The account must state whether the *degree or existence* of what matters for a subject at time T1 is fixed solely by facts up to T1, or if it can be retroactively altered by later events (e.g., the non-activation in **Cold Archive** or the destruction in **Aborted Twin**), and explain the implications for prudential rationality at T1. [non-negotiable]

  4. The account must explain why apparent physiological *continuity* matters (or does not) despite radical *spatial discontinuity*, as in **Relayed Reconstruction**, where the brain is distributed across planets yet functionally unified at each instant. [negotiable: a preference of psychological continuity camps]

  5. The account must explain whether a *merely potential* future bearer of psychological states (like the **Aborted Twin**, destroyed before consciousness) can be a locus of what matters for the original, or if actualized consciousness is required. [negotiable: a preference of camps emphasizing actual psychological connection] *Conflict possible with 3 if potentiality depends on later actualization.*
