prompt: |-
  hey — I need help building an actual research agenda, not a lit review. I've got about four people (all philosophy/political-theory backgrounds, zero ML) and one year inside an AI lab, and the deliverable is internal writing that could plausibly change what the lab does about whose values the system ends up being tuned to serve. So the question is: what do we work on, and in what order?

  The map I'm starting from has four clusters, and I'm not attached to it: (a) who counts as a value-holder at all — only currently living humans, or also future people, also people whose existence depends on which values get implemented (which feels like a genuine trap, since the choice of values changes who shows up), also non-human animals; (b) what the stuff being aggregated even is — felt preferences, idealized or informed preferences, values proper, interests, welfare; (c) how to combine it — voting-ish schemes, bargaining, some overlapping-consensus or veil-of-ignorance style construction; and (d) the thing I keep getting stuck on, which is that disagreement about the aggregation rule is itself just more moral disagreement, so any procedure you advertise as neutral is a contested first-order moral choice, and "aggregate over the aggregation rules" looks like it just regresses one level and starts again. One of the engineers here keeps saying the real answer is to just take the revealed preferences of actual users and stop overthinking, and I want the agenda to say explicitly whether that's the view to beat or a distraction.

  Two half-baked ideas of my own that I'd rather you push back on than politely incorporate. First, value escrow: for the questions we genuinely can't settle, don't aggregate — train the system to hold them open, to preserve future people's ability to decide, and to treat destroying an option as the main thing to avoid. It sidesteps (d), but I worry it's not really neutral either (whoever builds the escrow mechanism still decides what counts as keeping an option open versus quietly closing it) and that deferring everything is indistinguishable from having no values at all. Second, a stake-weighted lottery across aggregation rules: instead of picking a rule, give each constituency a probability of the whole system going its way, weighted by how much they have at stake, so nobody gets diluted into a compromise nobody endorses.

  So: given four people, twelve months, and the goal of actually changing practice rather than just being correct, what goes on the list and in what order? I care much more about the reasoning than the list — tell me what criteria you're using (how much else depends on the answer, whether philosophers without empirical data can actually make progress on it in a year, whether it's already crowded, whether the lab would ever act on an answer), where those criteria conflict, and what result or evidence in the next year or two should move something up or down. And please do tell me if one of my two ideas is a dead end — I'd rather kill it in January.
reasoning: |-
  Okay, the user is part of a philosophy/political theory team embedded in an AI lab. Their goal is to create a research agenda that could influence how the lab decides whose values the AI should serve. They have four people, one year, and need internal deliverables. Let me start by understanding their main clusters: who counts as value holders, what is being aggregated, how to combine them, and the meta-problem of disagreement on aggregation rules.

  First, the user mentioned an engineer suggesting revealed preferences, which seems like a practical approach. But the philosophers need to address whether this is valid or a distraction. They also proposed two ideas: value escrow and stake-weighted lottery. I need to evaluate if these are feasible or dead ends.

  The user's deeper needs might include wanting actionable insights that the lab can implement, not just theoretical discourse. They need to prioritize research questions that are tractable within a year and can sway engineers and decision-makers. The team lacks ML background, so their work must leverage philosophical strengths without requiring technical skills.

  Looking at their clusters, cluster (d) seems critical because it questions the neutrality of any aggregation method. But addressing it might be too abstract for the lab's needs. Instead, focusing on who counts (cluster a) might offer concrete entry points. For example, excluding non-humans could be a practical step labs already take, making it a good starting point.

  The value escrow idea sounds innovative but risky. Preserving options might be seen as avoiding decisions, which the lab may resist. Plus, defining what keeps an option open is itself a value judgment. The stake-weighted lottery involves complex implementation and raises fairness issues. Both ideas might be too theoretical for a year-long project.

  Prioritization should consider impact, feasibility, and alignment with lab priorities. Starting with who counts (cluster a) allows the team to produce a defensible framework quickly. Then, tackling the aggregation rule's meta-problem (cluster d) with a legitimacy framework could address the engineer's preference for revealed preferences without dismissing it. 

  The user might also need to build credibility with the lab. Early deliverables showing clear decision points can demonstrate value. Collaborating with ethicists and social scientists could strengthen their proposals. Avoiding dead ends like abstract regress problems ensures their work remains actionable. 

  In summary, the agenda should start with practical, high-impact questions, provide early wins, and gradually tackle deeper issues while engaging stakeholders. Killing overly ambitious ideas early prevents wasted effort and keeps the team focused on feasible solutions.
answer: |-
  Here’s a focused research agenda designed for maximum internal impact in 12 months, prioritizing **actionability**, **credibility with engineers**, and **addressing the lab’s core dilemma** — *without* getting lost in philosophical regress. I’ve structured it using clear criteria and kill-switches for your ideas.

  ### Core Prioritization Criteria:
  1.  **Lab Actionability:** Could a clear answer *change engineering choices* in 1–3 years?  
  2.  **Tractability (for philosophers):** Can progress be made without new empirical data?  
  3.  **Avoiding Crowds:** Focuses on gaps engineers/ethicists won’t fill.  
  4.  **Blocking Power:** Does resolving this *unblock* other decisions?  
  5.  **Engineer Credibility:** Engages with "revealed preferences" seriously, not dismissively.  

  **Kill Decisions Up Front:**  
  - **Value Escrow:** **Dead end for this project.** Brilliant long-term, but currently too vague for engineering. Defining "keeping options open" is *harder* than choosing values (e.g., does censoring extremism "destroy an option"?). Labs won’t build this without a concrete spec. *Kill it in January.*  
  - **Stake-Weighted Lottery:** **Strategic dead end.** Politically radioactive (sounds like "roll dice for fascism"), computationally undefined ("stake" measurement regress), and engineers will dismiss it as unserious. *Kill it in January.*  

  ---

  ### The 12-Month Agenda: Phased for Impact
  **Goal:** Deliver **decision frameworks** (not just analysis) that force concrete choices at lab leadership/engineering offsites. Structure deliverables as: *"To build X, you MUST choose between Option A or Option B. Here’s the trade-off."*  

  #### Phase 1: Months 1–3 — **Groundwork: Legitimacy & Scoping**  
  *(Goal: Establish credibility, define the battleground, force an explicit lab stance on scope)*  
  - **Project 1: The "Revealed Preferences" Challenge Report**  
    - *Why:* Directly engages the engineer’s view. Is it *the* solution or a fatal distraction?  
    - *Research:* Map *exactly* where revealed preferences (RP) fail catastrophically for value alignment:  
      - When RP reflect manipulation/addiction, not true values.  
      - When RP conflict (e.g., user wants convenience *and* privacy).  
      - When RP harm non-users/non-humans/future people (scope question).  
    - *Deliverable:* **"When Revealed Preferences Are (Not) Sufficient: 5 Unavoidable Trade-offs for Alignment"**. Conclude: "RP alone are *necessary but insufficient*; the lab MUST define scope."  
    - *Move Up/Down:* If lab leadership *explicitly* endorses RP as sole source, pivot to documenting harms. If they concede insufficiency, move to Project 2.  

  - **Project 2: The "Who Counts" Decision Tree**  
    - *Why:* Most *actionable* cluster. Lab *must* implicitly/explicitly choose a scope. Forces a concrete policy.  
    - *Research:*  
      - Define 3–4 defensible scopes (e.g., "Only Living Users," "Users + Democracies," "All Sentient Entities").  
      - For each, list:  
        - Engineering implications (what data is needed? how to weight?).  
        - Known failure modes (e.g., excluding future people → short-termism).  
        - Moral trade-offs (who gets sacrificed?).  
    - *Deliverable:* **"The Scope of Moral Patienthood: Which Choices Can the Lab *Not* Avoid?"** + a *required* lab leadership workshop to **choose a scope**.  
    - *Tractability:* Pure conceptual analysis → ideal for philosophers.  
    - *Actionability:* Lab *must* pick a scope or admit it’s arbitrary. Either changes practice.  

  #### Phase 2: Months 4–7 — **Tackling the Aggregation Regress (Cluster d)**  
  *(Goal: Reframe the "regress problem" into a solvable legitimacy challenge)*  
  - **Project 3: The Legitimacy Framework for Aggregation Rules**  
    - *Why:* Cluster (d) is the core trap. But "neutrality" is a red herring – focus on *legitimacy*.  
    - *Research:*  
      - Identify 3–5 "legitimacy criteria" for aggregation rules (e.g., *avoidability* – users can opt-out; *contestability* – mechanisms to challenge outcomes; *justification* – public reasons for the rule).  
      - Map existing rules (voting, bargaining, consensus) against these criteria.  
      - Argue: **No rule is neutral, but some are more *legitimate* than others under specific justifications.**  
    - *Deliverable:* **"Beyond Neutrality: A Checklist for Legitimate Value Aggregation"** + **"Why 'Aggregate the Aggregation Rules' Fails"** (short memo).  
    - *Blocking Power:* Unlocks work on *how* to aggregate (Cluster c) by providing a non-regress yardstick.  
    - *Kill Switch:* If legitimacy criteria are rejected as "subjective," pivot to Project 4 immediately.  

  - **Project 4: "Revealed Preferences Plus": A Hybrid Proposal**  
    - *Why:* Engineers need *something* to build. This bridges RP and theory.  
    - *Research:* Design a *concrete, implementable* procedure:  
      1.  **Start with RP** (behavioral data).  
      2.  **Apply legitimacy filters** from Project 3 (e.g., filter out preferences from addictive patterns; allow opt-outs).  
      3.  **Add procedural overrides** for excluded stakeholders (e.g., if scope includes future people, add a sustainability constraint set by experts).  
    - *Deliverable:* **"A Non-Ideal Framework for Value Alignment: Revealed Preferences + Legitimacy Safeguards"** – with pseudocode/flowcharts.  
    - *Engineer Credibility:* Starts with RP but adds philosophically defensible guardrails.  

  #### Phase 3: Months 8–12 — **Engineering Translation & Institutional Strategy**  
  *(Goal: Ensure research forces concrete changes in lab practice)*  
  - **Project 5: The "Values Interface" Specification**  
    - *Why:* Labs need to know *where* and *how* to plug value choices into systems.  
    - *Research:* Define points in the AI pipeline where value choices *must* be made (e.g., reward function design, constitutional AI rules, UX for preference expression). For each:  
      - List decisions required (e.g., "weighting method for conflicting preferences").  
      - Map options back to Phase 1 & 2 frameworks.  
    - *Deliverable:* **"The Values API: 7 Places Your System Embeds Moral Choices (And How to Configure Them)"**.  
    - *Actionability:* Directly targets engineers/PMs. Forces explicit parameterization.  

  - **Project 6: Institutional Adoption Strategy**  
    - *Why:* Changing lab practice requires buy-in.  
    - *Research:*  
      - Identify key decision-makers (PMs, safety leads, leadership).  
      - Map their incentives/constraints (e.g., "Ship fast" vs. "Avoid PR disaster").  
      - Package Phase 1–5 deliverables into targeted memos/workshops for each group.  
    - *Deliverable:* **"Getting Values Alignment Done: A 12-Month Adoption Plan for [Lab Name]"** – with timeline, owners, and success metrics.  

  ---

  ### Why This Order & Structure Wins
  1.  **Early Wins (Months 1–3):** Forces the lab to make a *concrete, documentable choice* on scope (Project 2) and engages engineers on their turf (Project 1). Builds credibility.  
  2.  **Solves the Regress Trap Pragmatically:** Project 3 reframes the unsolvable "neutrality" problem into a tractable "legitimacy under justification" problem. Project 4 gives engineers a buildable solution.  
  3.  **Embraces Non-Ideality:** "Revealed Preferences Plus" accepts that perfection is impossible, but offers *better than naive RP*. Labs will pick *something* – make it your designed compromise.  
  4.  **Engineer-Facing Translation (Project 5):** Philosophers often fail here. Framing choices as an "API" makes it concrete and actionable.  
  5.  **Institutional Strategy (Project 6):** Ensures the work doesn’t die in a PDF. This is where you *change what the lab does*.  

  **Critical:** Partner with 1–2 sympathetic engineers/researchers *monthly* for feedback. Your deliverables must feel **useful**, not just correct. If an engineer says *"I could implement that"* about Project 4 or 5, you’ve won. If they say *"interesting footnote,"* you’ve lost. Kill abstraction ruthlessly.
