prompt: |-
  I'm writing a novel and I need help with one scene, sort of — one character is a full-on qualia realist, the other thinks the whole notion is an incoherent posit (the Dennett line: there's nothing to consciousness over and above our dispositions to discriminate, judge and report, so the fading- and dancing-qualia arguments don't land). They've been going in circles for years, and in the draft they finally agree to sit down and write a joint statement. That statement is what I need from you.

  The case that's meant to force the issue in the book: a clinic can do a 'slow swap' — over six months, in tiny steps, it reroutes someone's colour processing so red and green end up swapped, while their discriminations keep the same structure and their colour vocabulary drifts along with it, and nobody notices. Separately, a patient M has a scrambled colour space: discriminations intact, geometry not. She reports nothing whatsoever, and her brother, who turns out to have the same scrambled wiring, still paints exactly the way he always did.

  So: draft the document they could both put their names to. Numbered agreed-claims section first, then a disagreements table. I want what both accept about the setup and about what needs explaining; the disagreement stated twice, once in wording each side would actually sign; the cruxes (I suspect one is whether there's a determinate fact about M's experience that neither report nor functional role can settle, another is whether 'what it's like' talk is even in the business of tracking such a fact, and maybe a third about whether a difference that makes no difference to anything anyone can do is a difference at all); and for each crux, which argument, thought experiment or real experiment both would accept as bearing on it, with each side's prediction written down in advance. Also tell me straight if any chunk of their fight is just verbal, and which chunk.
reasoning: |-
  Okay, the user is writing a novel and needs help crafting a scene where two characters with opposing philosophical views on consciousness collaborate on a joint statement. One character is a qualia realist who believes in subjective experiences as fundamental properties, while the other follows Daniel Dennett's eliminative materialism view that dismisses qualia as incoherent. They've been debating for years and finally agree to write a document together, prompted by a fictional medical case involving color perception.

  The key elements needed are:
  1) A numbered list of agreed-upon claims about the fictional medical scenario (slow color swap and scrambled color space patient)
  2) A disagreements table with each side's wording
  3) Identification of philosophical cruxes (determinate facts about experience, nature of "what it's like" talk, and ontological status of undetectable differences)
  4) For each crux: testable predictions and potential experiments
  5) Honest assessment of purely verbal disagreements

  The medical cases are cleverly designed to challenge both positions. The slow swap scenario undermines naive realism by showing massive subjective change without behavioral detection, while the scrambled color space case (where discrimination remains intact but geometry changes) creates tension between functional equivalence and subjective experience.

  For the agreed claims, I need to establish common ground about what both characters accept as factual within the story's universe. This includes the technical feasibility of the procedures, behavioral outcomes, and limitations of reporting. The disagreements need to capture the core philosophical rift while remaining authentic to each position's terminology - the realist insisting on "what it's like" facts beyond behavior, the eliminativist rejecting such talk as confused.

  The three cruxes I identify are:
  1) Whether there's a determinate fact about Patient M's experience
  2) Whether "what it's like" language tracks real properties
  3) Whether undetectable differences exist

  For each, I propose thought experiments or hypothetical technologies that could test predictions, like perfect neural mapping or phenomenological detectors. This maintains scientific plausibility while pushing boundaries. 

  Notably, I point out that some disagreement stems from differing definitions of "consciousness" itself - a verbal dispute worth flagging. The document structure balances technical precision with narrative utility, giving the novelist concrete philosophical scaffolding while leaving room for character voice.
