  Below is a draft joint statement reflecting the agreed foundations, disagreements, cruxes, and potential tests, structured as requested. The document maintains each character's philosophical voice while identifying shared ground. Key verbal disagreements are flagged.

  ---

  **JOINT STATEMENT ON THE PHENOMENOLOGY & FUNCTION OF COLOUR VISION**  
  *Authored by Dr. Elara Vance (Qualia Realist) & Dr. Marcus Thorne (Eliminative Materialist)*  
  *Regarding the "Slow Swap" & "Scrambled Space" Cases*

  ### I. AGREED CLAIMS & ACCEPTED FACTS
  1.  **The Slow Swap Procedure:** Clinically feasible. Over 6 months, neural rewiring gradually swaps the functional roles of retinal/LGN/V4 pathways for "red" and "green" wavelengths, preserving all downstream discrimination capacities (matching, sorting, naming, emotional associations, aesthetic judgments).
  2.  **Behavioural Invariance (Slow Swap):** No subject or external observer detects any change in colour perception or behaviour during or after the procedure. Colour vocabulary and application (e.g., "stop signs are red", "grass is green") drift seamlessly.
  3.  **Patient M's Condition:** Neurologically confirmed "scrambled colour space" due to atypical V4 wiring. Exhibits:
      *   Normal pre-morbid colour vision & behaviour.
      *   Post-onset, intact *discriminative capacities* (can match wavelengths, sort hues correctly, use colour terms consistently relative to public standards).
      *   Disrupted *internal geometry* (e.g., similarity relationships between hues are abnormal/non-isomorphic to typical human space; unique hues absent or shifted non-standardly).
  4.  **Patient M's Brother:** Possesses identical, congenital "scrambled wiring" as Patient M post-onset. Exhibits:
      *   Lifelong intact discriminative capacities matching public standards.
      *   Lifelong consistent artistic style and colour usage in painting (e.g., uses "red" paint for objects publicly called "red", compositions maintain pre-established aesthetic relationships).
  5.  **Reporting Limitations:** Patient M reports *no subjective change* post-onset. Brother reports *no lifelong abnormality*. Neither exhibits behavioural inconsistency prompting them to seek help or report anomalies. Third-party observation reveals no functional deficit.
  6.  **What Requires Explanation:** The discrepancy between the *structural/functional invariance* (behaviour, discrimination, reporting) and the *putative phenomenal state* in both cases. Why does the Slow Swap go unnoticed? Why does Patient M (and her brother) report normalcy despite abnormal neural structure?

  ### II. DISAGREEMENTS TABLE
  | Area of Disagreement          | Dr. Vance (Realist) Wording                                                                 | Dr. Thorne (Eliminativist) Wording                                                                 |
  | :---------------------------- | :------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------- |
  | **Nature of M's Experience**  | "There is a determinate fact about Patient M's colour qualia post-scramble, which is radically different from both her pre-morbid state and neurotypical experience, yet inaccessible to her report or functional expression due to the congenital/non-comparative nature of the scrambling." | "The notion of a 'determinate fact' about M's 'inner colour experience' beyond her dispositions to discriminate, judge, report, and behave coherently is an incoherent posit. Her colour vision *is* her functional capacities; there is no further 'experience' to be different." |
  | **What 'What It's Like' Tracks** | "'What it is like' for M to see red refers to a private, intrinsic, non-relational property instantiated by her neural states. This property changed post-scramble, but stable discrimination + lack of a baseline for comparison prevent her accessing/reporting this change." | "'What it is like' talk is a heterophenomenological report describing functional roles and dispositions within a community. It tracks patterns of discrimination, judgment, and report relative to public stimuli. For M, 'what it's like' *is* her stable functional profile; there's no hidden layer." |
  | **Ontology of Undetectable Differences** | "The Slow Swap creates a profound phenomenal difference (red/green inversion) that makes no difference to function, report, or third-person observation. This difference is real but epistemically inaccessible." | "A difference alleged to make no difference whatsoever to function, report, behaviour, or causal potential in any conceivable context *is not a difference at all*. Such talk mistakes conceptual confusion for metaphysical revelation." |

  ### III. CRUXES, TESTS & PREDICTIONS
  **Crux 1: Is there a determinate fact about M's colour experience beyond functional role?**
  *   **Shared Test:** Development of a perfect, non-intrusive "phenomenal state mapper" (PSM) – technology that *independently* reads the purported intrinsic qualia property. *Both accept this is currently science fiction but conceptually coherent for testing.*
      *   **Vance Prediction:** PSM will show M's post-scramble colour qualia are non-isomorphic to both pre-morbid and neurotypical qualia, despite functional equivalence. The brother's PSM readout will also show this non-standard structure.
      *   **Thorne Prediction:** The PSM will either (a) fail to produce a consistent readout for "qualia" independent of functional/discriminative patterns, or (b) its readout will perfectly correlate with/can be reduced to functional/discriminative patterns and neural activity profiles (which are identical to pre-morbid for discriminations). No "extra" property will be found.
  *   **Argument Bearing:** The conceivability of philosophical zombies (Vance: M's case is *like* a partial zombie for colour; Thorne: zombies are incoherent, M just *is* her function).

  **Crux 2: Does 'what it's like' talk track a non-functional property?**
  *   **Shared Test:** Analyze the linguistic development and use of colour terms *during* the Slow Swap. Track how subjects learn/teach colour words to naive learners *at different stages* of the swap.
      *   **Vance Prediction:** Subjects will seamlessly teach the *public use* of terms ("That wavelength is called 'red'"), but their *internal reference* (the quale associated with the term) shifts gradually. Teaching cannot capture this shift, only public use.
      *   **Thorne Prediction:** Teaching will consist *entirely* of calibrating discriminations and public use ("Point to the red one", "Call this 'red'"). There is no separable "internal reference" taught or tracked. "What it's like" reports will evolve solely to maintain consistency with public practice and discrimination.
  *   **Argument Bearing:** Wittgenstein's private language argument (Thorne: supports eliminativism; Vance: qualia are intrinsic, not linguistically constituted, hence private language fails for different reasons).

  **Crux 3: Is a functionally undetectable difference real?**
  *   **Shared Test:** Introduce a novel, non-communicable "qualia-sensitive" drug. It causes intense, specific, *non-functional* subjective distress *only* if the subject's "red" quale corresponds to wavelength X (say, 630nm), regardless of their functional responses or reports. Administer it to subjects pre- and post-Slow Swap, and to Patient M's brother.
      *   **Vance Prediction:** Post-swap subjects (whose "red" quale is now triggered by ~550nm) will react distressingly to the drug when exposed to ~550nm light, not 630nm. M's brother will react abnormally, revealing his non-standard quale mapping.
      *   **Thorne Prediction:** The drug will cause distress correlated *only* with the subject's behavioural/dispositional state elicited by the wavelength they *call* "red" (or the drug's direct neural effect). It will track functional "red", not a quale. Reactions will be consistent pre/post-swap and for M's brother relative to their functional "red".
  *   **Argument Bearing:** The Inverted Spectrum Argument (Vance: Slow Swap *is* a real inversion; Thorne: Inversion is vacuous without functional difference).

  ### IV. ASSESSMENT OF VERBAL DISAGREEMENT
  *   **"Consciousness" itself is partially verbal.** Thorne argues "consciousness" *just is* these complex dispositions (discrimination, judgment, report, behavioural integration). Vance argues "consciousness" *essentially includes* intrinsic, private qualia *in addition* to function.
      *   **Shared Ground:** Both agree on the *functional/computational story* and the *reporting data*. The verbal dispute is over whether the term "consciousness" *must* or *can coherently* refer to something *over and above* that functional story.
      *   **Resolution Attempt:** They agree to sometimes use "Phenomenal Consciousness (Vance)" vs. "Access Consciousness/Reporting (Thorne)" for clarity, but the core metaphysical disagreement (does PC exist as an additional property?) remains substantive.

  ---

  **Straight Talk on the Fight:**
  *   **Substantive Core:** The core disagreement (is there *anything* non-functional/relational that constitutes "what it's like"?) is **not merely verbal**. It's a deep metaphysical divide about the nature of properties and facts.
  *   **Verbal Chunks:** Disputes over the *word* "consciousness" and the *phrase* "what it's like" contain significant verbal elements. Thorne sees "what it's like" as *defined by* functional capacities within a community. Vance sees it as *pointing towards* an intrinsic property. Their disagreement about what these terms *refer to* (or whether they successfully refer at all) involves semantics.
  *   **The M Case Highlight:** The disagreement over whether M's report "I see colours normally" is *false but inaccessible* (Vance) or *true by definition* (Thorne, because "normally" means functionally appropriate) **encapsulates both the substantive and verbal aspects**. The substantive part is whether there's a hidden fact; the verbal part is what "normal colour vision" means.

  This document provides the necessary structure: agreed facts, starkly worded disagreements, testable cruxes with predictions, and an honest meta-assessment. It forces the philosophical conflict into sharp relief around the fictional cases, ready for your characters to sign (or perhaps argue over the final wording of!). Good luck with the novel!
