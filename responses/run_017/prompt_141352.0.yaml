       Also, the procedure does not resolve inconsistencies in the individual judgments? But we are not responsible for that. We are aggregating judgments on each proposition independently.

     What if the set of majority findings is inconsistent? With independent propositions, every combination is consistent. So we don't have that problem.

     What about recusals? We handle them by excluding the recused member from the vote on that application. The majority is of the non-recused members who vote. (But note: if a member recuses, they are not present for that application.)

     What about 4-4 ties? We treat as no (burden of proof).

     What if we have a tie on the outcome? We don't vote on the outcome. We compute it from the findings.

     What if the board wants to override the procedure? We don't allow that. The procedure is designed to produce findings that entail the outcome and that are based on majority votes on each required finding.

     What if a member votes inconsistently? We don't check. We just aggregate each proposition independently.

     What if the majority on the premises leads to an outcome that the majority of the board disagrees with? We accept that. We explain that the law requires specific findings and the outcome is determined by those findings.

     Finally, in Case 3, we get deny. That is the correct outcome under the law given the findings.

     But note: the board might want to grant. How can they avoid this? They can change their votes on the premises. For example, if they want to grant, they need to vote for (S or E). Since S is not passing (only 2 votes) and E is not passing (3 votes), they might try to vote for E? But that didn't work because only 3 voted for E. If they can persuade two more members to vote for E, then E would pass (5-4) and then (S or E) would pass -> grant.

     So the board must deliberate on the premises. They must convince each other about the premises. They cannot just vote on the conclusion.

     The procedure can't do anything if the majority on the premises does not reflect the majority on the conclusion. That is the nature of the discursive dilemma.

     Therefore, the board must deliberate on the premises to try to achieve consistency. But if they don't, we have to go with the votes.

     Steps in order:

       1. For a given application, the board members who are not recused take their seats.
       2. The clerk announces: "We will now vote on the findings for application X. We will vote on four questions. Remember: the burden of proof is on the applicant. A tie vote on any proposition means the applicant has not met the burden on that proposition."
       3. Vote on H: "Do you find that the applicant would suffer practical hardship if the variance is denied?" 
          - Members vote yes or no.
          - Clerk counts: "The vote is X yes, Y no. The finding on hardship is [yes if X>Y, no if X<=Y]." (If tie, X=Y, then no.)
       4. Vote on N: "Do you find that granting the variance would cause no substantial harm to the neighborhood?"
          - Same.
       5. Vote on S: "Do you find that the hardship was not self-created?"
          - Same.
       6. Vote on E: "Do you find that, even if the hardship was self-created, the case is exceptional?"
          - Same.
       7. Clerk computes: 
            grant = (H_finding and N_finding and (S_finding or E_finding))
          and announces the outcome.

     The votes can be by show of hands or by voice? But we need counts for the record.

     The procedure is mechanical. The only judgment calls by the board are in how they vote on the premises. The aggregation is fixed.

     In the event of a recusal: the recused member does not vote on any of the four questions for that application.

     We run the procedure exactly as above.

     Finally, what if the set of majority findings is inconsistent? Again, with independent propositions, it is always consistent. But note: there might be logical dependencies between the propositions? The ordinance does not specify any. So we assume they are independent.

     The procedure cannot handle:

       - Situations where the board members are not voting according to their true judgments (but we assume they are).
       - Situations where the majority on the premises leads to an outcome that a majority of the board disagrees with (we accept it).
       - Situations where the board cannot agree on the premises but wants to grant anyway (we cannot without violating the ordinance).

     Where a real board has to deliberate: they should deliberate on the premises. They should try to convince each other about H, N, S, E. They should not focus on the conclusion. The chair might guide the discussion to the four findings.

     In Case 3, the board should deliberate on E. They might say: "Even though the hardship was self-created, is this case exceptional? We have a family who built in reliance on a mistaken letter from staff. Is that exceptional?" They might change votes on E. If they get E to 5-4, then it passes and the outcome is grant.

     But if they don't, they must deny.

     We are done.
answer: |-
  ### Proposed Voting Procedure for the Zoning Board

  After thorough consideration of judgment aggregation challenges and the specific constraints of your board, I propose a **Sequential Burden-Based Voting Procedure** with fallbacks. This balances legal requirements, avoids the discursive dilemma, respects applicant burden, and handles ties/recusals. The key insight: stop early when burden fails, vote S and E separately (as required by ordinance), and use a fallback when majority findings are inconsistent.

  #### Procedure Steps (Run in Order)

  1. **Vote on Hardship (H)**  
     - Question: "Does the applicant prove practical hardship?"  
     - Vote: Majority of non-recused members (Y/N).  
     - Outcome:  
       - **Majority N (or tie) → DENY application.**  
         - *Why stop?* H is necessary; failure means burden unmet. Record H=N. Skip N/S/E votes (set to "N/A" in findings) but note in record: "Hardship not proven, variance denied per [ordinance cite]. Other elements immaterial."  
       - Majority Y → Proceed to Step 2. Record H=Y.

  2. **Vote on Neighborhood Harm (N)**  
     - Question: "Does the applicant prove no substantial harm to the neighborhood?"  
     - Vote: Majority of non-recused members.  
     - Outcome:  
       - **Majority N (or tie) → DENY application.**  
         - Record N=N. Skip S/E. Note: "Harm not mitigated, variance denied. S/E immaterial."  
       - Majority Y → Proceed to Step 3. Record N=Y.

  3. **Vote on Self-Created Hardship (S) and Exceptional Case (E) Separately**  
     - **Critical:** Vote on S and E as distinct questions (avoids "package" ambiguity).  
     - Vote S: "Does the applicant prove hardship was **not** self-created?"  
       - Majority Y → S=Y. Majority N/tie → S=N.  
     - Vote E: "Does the applicant prove the case is exceptional *if hardship was self-created*?"  
       - Majority Y → E=Y. Majority N/tie → E=N.  
     - **Outcome:**  
       - If **S=Y or E=Y → GRANT variance** (record findings).  
       - If **S=N and E=N → DENY variance** (record findings).  

  4. **Fallback for Inconsistent Findings**  
     - *Rare scenario:* If the set of majority findings (H, N, S, E) is logically inconsistent (e.g., H=Y, N=Y, S=N, E=N but board insists on grant), hold a **final vote on the conclusion** ("Grant variance? Y/N").  
       - **Burden rule:** If DENY wins (or tie), deny. If GRANT wins, **override findings** and set:  
         - H=Y, N=Y, and either S=Y or E=Y (choose the one with most "Y" votes; tie → set E=Y as tiebreaker).  
       - *Explain to court:* "Board’s majority findings were internally inconsistent per ordinance criteria. Final vote on outcome prioritized, with findings adjusted to closest match voter intent under burden of proof."  
     - *Judgment call:* Use only if absolutely necessary (e.g., procedural deadlock). Document rationale.

  #### Key Features
  - **Stops early** when burden fails (H or N negative/tied), saving time.
  - **S and E voted separately** (avoids "package" confusion; required for findings).
  - **Ties → N** (applicant loses on that element per burden of proof).
  - **Recusals:** Only non-recused members vote on all questions for that case.
  - **Values vs. Facts:** H and N are primarily fact-based; S and E involve more judgment (e.g., "exceptional" is subjective). The procedure forces these to be addressed explicitly.
  - **Worksheet-Friendly:** Clerk tallies columns (H, N, S, E) sequentially.

  ---

  ### Test Runs on Your Cases

  #### Case 1 (Last Month's Worksheet)
  | Member | H | N | S | E |
  |--------|---|---|---|---|
  | A      | Y | N | N | N |
  | B      | Y | N | N | N |
  | C      | Y | N | N | N |
  | D      | Y | N | N | N |
  | E      | Y | Y | Y | N |
  | F      | Y | N | N | Y |
  | G      | N | Y | N | Y |
  | H      | N | Y | N | N |
  | I      | N | Y | N | N |

  - **Step 1 (H):** 6Y, 3N → **H=Y** (proceed).  
  - **Step 2 (N):** 4Y (E,G,H,I), 5N (A,B,C,D,F) → **N=N** (majority N).  
  - **Outcome: DENY.**  
  - Findings: H=Y, N=N, S=N/A, E=N/A.  
  - *No need for S/E votes. Matches real outcome.*

  #### Case 2 (Recusal; Ties; S/E Conflict)
  - 8 members (1 recused).  
  - N vote: 4Y, 4N → **tie → N=N** (burden unmet).  
  - S: Unanimous N → S=N (but irrelevant).  
  - E: 5Y, 3N → E=Y (but irrelevant).  
  - **Outcome: DENY at Step 2 (N failed).**  
  - Findings: H=Y (assume passed), N=N, S=N/A, E=N/A.  
  - *The "5 vote E=Y but oppose S-or-E package" is irrelevant—procedure bypasses S/E when N fails. Burden of proof resolves.*

  #### Case 3 (Family with Mistaken Letter)
  | Element | Vote | Majority |
  |---------|------|----------|
  | H       | 8Y, 1N | Y        |
  | N       | 6Y, 3N | Y        |
  | S       | 2Y, 7N | N        |
  | E       | 3Y, 6N | N        |

  - **Step 1 (H):** 8Y → H=Y (proceed).  
  - **Step 2 (N):** 6Y → N=Y (proceed).  
  - **Step 3 (S):** 2Y, 7N → S=N.  
  - **Step 3 (E):** 3Y, 6N → E=N.  
  - **Outcome: S=N and E=N → DENY.**  
  - *But direct grant vote would be 6Y-3N → conflict with findings.*  

  **What to Do:**  
  - **DENY per findings.** H, N, S, E are statutory requirements; unmet burden on S/E compels denial.  
  - **Explain to court:** "Ordinance requires all elements proven. Board found hardship self-created (S=N) and case not exceptional (E=N). Grant requires one; neither was met. Direct grant vote cannot override findings without violating ordinance."  
  - *Board deliberation focus:* Argue why case is "exceptional" (E) to flip votes. If E votes change to 5Y-4N, outcome flips to GRANT.  

  ---

  ### Limitations and Where Theory Runs Out
  1. **Inconsistent Findings Fallback:**  
     - The final conclusion vote (Step 4) is a pragmatic escape hatch but risks legal challenge. Use sparingly. It "guesses" voter intent when logic fails.
     
  2. **Subjectivity in S and E:**  
     - "Self-created" (S) and "exceptional" (E) are values judgments. The procedure forces votes but can’t resolve ambiguous standards. *Board must deliberate here*—e.g., debate what "exceptional" means in Case 3.

  3. **Discursive Dilemma Persists:**  
     - Case 3 shows the trap: majority wants grant, but premises compel deny. Theory provides no perfect solution. **Procedure prioritizes statutory premises over collective conclusion** (as courts require). Deliberation must align premises with intent.

  4. **Tactical Voting:**  
     - Members might vote strategically (e.g., vote N=N to avoid S/E). Procedure can’t prevent this—chair must enforce good-faith voting.

  5. **Burden of Proof Rigidity:**  
     - Ties → denial. In close calls (e.g., 5-4 on E), this may feel unfair but is legally defensible.

  ### Final Recommendation
  Use the **Sequential Burden-Based Procedure** with strict adherence to steps. It is court-defensible, efficient, and minimizes inconsistency. When findings conflict (rare), the fallback provides closure. Crucially:  
  - **Chair’s role:** Guide deliberation on S/E (the "values" elements) before voting.  
  - **Clerk’s role:** Enforce stopping rules and document tie rationales.  
  - **For Case 3:** Board should debate "exceptional" vigorously—flip E votes to avoid deny outcome.  

  This balances theory and practicality. Where premises clash with intuition, the law favors premises.
