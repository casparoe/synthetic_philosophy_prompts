prompt: |-
  I want the specification before I go back to any particular account: what does a theory of the badness of human extinction, over and above the badness of the deaths it involves, have to deliver in order to be adequate, where adequate means good enough to tell a legislature or a large funder how much weight to give to reducing extinction risk as against other uses of the same money? Write the desiderata, each with the case or consideration behind it, covering at least these: whether the badness has to be bad for someone, and what a theory is permitted to say if it need not be; the replacement case, in which every human being dies painlessly at once but is succeeded by a species whose lives go about as well as ours would have; the remnant case, in which a thousand people survive in isolation with no realistic prospect of growth; the consensual case, in which extinction is wanted by everyone then alive and nobody is killed against their will; the non-identity wrinkle, that the people who would exist if extinction were averted are almost none of the people who would otherwise have existed; and the question of whether the theory owes a cardinal weight at all or may refuse to give one. Then separate the non-negotiable requirements from those that are only the preference of a camp — my own suspicion is that the demand that the badness be someone's is a prejudice in a desideratum's clothing, while the demand for a number is not — and if some subset of the desiderata cannot be jointly satisfied, say which and why, since a list with a contradiction in it is itself the useful result. Close with a single paragraph on which one requirement excludes the most accounts currently on offer, and on whether Scheffler's afterlife conjecture, the claim that our confidence in a collective human future is a condition of our valuing anything at all, gets past that requirement. Please write in continuous prose: no headings, bullet points, bold text, or tables.
reasoning: |-
  Okay, the user wants a detailed specification for a theory about the badness of human extinction beyond just the deaths involved. They need this to guide decisions like funding or policy. Let me start by breaking down their query.

  First, they mentioned several cases: replacement, remnant, consensual, non-identity, and whether the badness must affect someone. Also, whether a cardinal weight is necessary. I need to address each of these with the underlying considerations.

  The user suspects that requiring the badness to be someone's might be a prejudice. I agree. Some theories, like person-affecting views, struggle here. Non-person-affecting theories might handle it better by valuing future lives independently.

  The replacement case challenges theories that value human species specifically. If another species takes our place with similar welfare, is extinction still bad? A theory needs to clarify if it's about humanity or welfare.

  The remnant case with 1000 survivors tests if extinction is uniquely bad. If their lives continue but humanity ends, is that less bad? The theory must define what constitutes extinction versus continued existence.

  Consensual extinction where everyone agrees. If no one is harmed against their will, is it still bad? Theories must reconcile autonomy with impersonal bads.

  Non-identity problem: future people are different if extinction is averted. Preventing extinction creates new people, so harm to specific individuals isn't applicable. The theory must account for this without relying on harming existing people.

  Cardinal weight requirement: policymakers need numbers. But some theories might only offer ordinal rankings. A useful theory must quantify the badness for practical decisions.

  Now, separating non-negotiables from preferences. Non-negotiables: consistency across cases, addressing non-identity, and providing cardinal weights. Preferences might include whether badness must be someone's or valuing humanity specifically.

  Contradictions arise if a theory must both be person-affecting and handle non-identity. Person-affecting views struggle because future people don't exist yet. Also, requiring both cardinal weights and avoiding value judgments might conflict.

  Scheffler's afterlife conjecture posits that a collective future underpins our values. But does it provide a cardinal weight? Probably not, making it inadequate for policymakers. It highlights the badness but doesn't quantify it.

  The biggest hurdle for current theories is the cardinal weight requirement. Many philosophical accounts don't assign numbers, focusing instead on qualitative aspects. This makes them less useful for real-world decisions.

  I should structure the response to cover each desideratum, explain the cases, identify non-negotiables, point out contradictions, and evaluate Scheffler's idea in the context of the strictest requirement.
answer: |-
  A theory of the badness of human extinction beyond the deaths of the individuals alive when it occurs must satisfy several demanding desiderata to be practically adequate for guiding resource allocation decisions by bodies like legislatures or major funders. First, it must explicitly address the foundational philosophical question of whether the badness must constitute a harm *for someone* – existing, future, or even hypothetical beings – or whether it can be an impersonal bad state of affairs. The case for allowing impersonal badness stems from the intuition that the permanent loss of humanity's future potential, even if no existing person is deprived of a life they would otherwise have had (due to the non-identity issue), constitutes a profound loss. Conversely, theories insisting it must be bad *for someone* face severe difficulties with the non-identity problem and the consensual case, potentially undermining the unique badness of extinction. Second, the theory must grapple with the **replacement case**: if humans are instantly and painlessly replaced by a distinct species whose lives go equally well, does extinction retain any unique badness? If the theory answers 'no', it suggests badness is tied solely to aggregate welfare or the existence of valuable lives, regardless of species. Answering 'yes' implies value is placed on humanity specifically, perhaps due to its unique characteristics or symbolic significance, demanding justification for this species-preference. Third, the **remnant case** – where a thousand humans survive in permanent, isolated stagnation with no possibility of rebuilding civilization or substantially increasing numbers – tests the definition of extinction and the source of its badness. If this scenario is deemed significantly less bad than total extinction, the theory must identify what specific future potential (e.g., flourishing civilization, vast numbers of future people, continued cultural evolution) is lost in full extinction but partially preserved here. If it's deemed equally bad, the theory must explain why the mere *existence* of human DNA, even without potential, holds such overwhelming value. Fourth, the **consensual case**, where everyone alive freely chooses and desires extinction without coercion, challenges the theory. Can extinction be bad even if no one living experiences it as a harm to themselves and all autonomously will it? Theories requiring harm to individuals may struggle here, while impersonal theories might still deem it bad due to the loss of future value. Fifth, the theory must decisively resolve the **non-identity wrinkle**: since averting extinction radically alters which specific individuals come into existence (very few future people would exist under both scenarios), the badness cannot be straightforwardly explained as harming specific future individuals who would otherwise have lived better lives. The theory must therefore locate the badness elsewhere, such as in the impersonal loss of potential good lives or the violation of a duty to humanity's continuance, without relying on counterfactual harm to specific non-existent people. Finally, and crucially for policy, the theory **must deliver a cardinal weight**. Legislatures and funders require a quantifiable estimate of *how much* worse extinction is compared to the deaths of the same number of people without extinction, and how this badness stacks up against other global priorities like current poverty or disease. A theory offering only ordinal rankings (e.g., "worse than X but better than Y") or refusing quantification on principle is inadequate for the task of resource allocation; it must provide, or enable the derivation of, a defensible cardinal value or range.

  Separating non-negotiables from preferences is vital. A non-negotiable requirement is that the theory **must resolve the non-identity wrinkle coherently**; any account that founders on this fails a basic logical challenge inherent in the extinction scenario. Similarly, **providing a usable cardinal weight is non-negotiable** for the stated purpose of informing real-world trade-offs; a theory that refuses this is irrelevant to the policymaking context. The requirement for the badness to be "bad for someone" is, however, likely a preference associated with certain ethical camps (e.g., person-affecting views), not a strict requirement. While compelling to some, insisting on it creates severe difficulties with non-identity and consensual extinction, and an impersonal account may offer a more coherent overall picture. The insistence on valuing humanity specifically over a replacement species is also arguably a preference – a welfarist consequentialist might reject it, while a "humanist" might embrace it – though the theory must clearly state its stance.

  A contradiction arises if one simultaneously demands that the badness be *person-affecting* (bad for specific individuals) and that the theory provides a *significant cardinal weight* robust to the *non-identity problem*. Person-affecting views struggle mightily with non-identity: if the future people who *would* exist if extinction is averted are different from those who *would* exist otherwise, it's difficult to claim specific individuals are *harmed* by extinction (they don't exist to be harmed). Such views often end up minimizing the unique badness of extinction or resorting to complex, contested manoeuvres. Consequently, they typically cannot deliver a large, stable cardinal weight for extinction risk reduction based solely on harm to individuals, conflicting with the demand for significant, actionable quantification. Impersonal theories avoid this specific contradiction but face other challenges, like justifying the cardinal weight assigned to lost potential.

  The requirement that excludes the most current accounts is the **demand for a cardinal weight**. Many philosophical theories on extinction's badness focus on qualitative justification (e.g., loss of meaning, intrinsic value of humanity) or ordinal comparisons but deliberately avoid or are unable to provide a quantifiable measure usable in cost-benefit analyses. Scheffler's "afterlife conjecture" – that our confidence in a collective human future is a precondition for valuing anything at all – powerfully highlights a profound source of impersonal badness in extinction: the collapse of the evaluative framework underpinning individual valuing. It elegantly bypasses the non-identity and consensual cases by locating badness in the destruction of the necessary context for value. However, it **fails to deliver a cardinal weight**. It explains *why* extinction is uniquely catastrophic but does not tell us *how much* resources we should divert from, say, saving present lives to prevent it relative to other catastrophic risks or current suffering. It provides a compelling rationale for prioritizing extinction prevention but lacks the quantitative specificity required for the practical allocation decisions the theory needs to inform.
