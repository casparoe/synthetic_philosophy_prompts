prompt: |-
  I want the specification before the theories. I am working on the norms governing assertion — whether the bar for permissibly stating something is knowledge, truth, reasonable belief, or something else — and before I weigh the candidates I want it fixed what such a norm is supposed to be for. Fix the purpose as follows: the norm should be able to do work elsewhere, underwriting both an account of what a hearer acquires when they are told something and an account of what institutions owe the public when they issue statements.

  Write the desideratum list on that understanding: the data any account has to accommodate, the distinctions it must not collapse, and the structural features it must have, each with the case or consideration that makes it a requirement. The distinctions I care about include sincerity versus warrant, the act's being defective versus the speaker's being blameworthy, and a norm constitutive of assertion versus one that merely regulates an act we could perform without it. Then sort the requirements into non-negotiable, negotiable, and mere prejudice of one camp — demands such as that the norm be a single unitary rule, or that it be formulable in terms of knowledge, strike me as things no theory should have to grant.

  Among the cases I want covered: hedged versus unhedged assertion; the infelicity of stating something while disavowing knowledge of it; assertions whose stakes are low for the speaker and the immediate audience but high for someone further downstream who will act on them; assertion addressed to no one who can take it up; assertion by a collective that has no single mind; and assertion of moral, aesthetic, or legal contents where truth-aptness is itself contested.

  Finally, say which pair of requirements you suspect cannot be jointly satisfied, and which single requirement does the most to exclude otherwise attractive candidates. Touch on the familiar norms only to mark where each fails a requirement; I will do the scoring myself.
reasoning: |-
  Hmm, the user is working on assertion norms and wants a structured desideratum list before evaluating theories. They're focused on the purpose of the norm: it must underwrite both hearer acquisition (what hearers gain from being told something) and institutional obligations (what institutions owe when making statements). This dual-purpose is central.

  The user wants distinctions preserved: sincerity vs warrant (meaning the speaker's honesty versus whether they have proper grounds), act defectiveness vs speaker blameworthiness (whether the assertion itself is flawed versus whether the speaker is at fault), and constitutive vs regulative norms (whether the norm defines what assertion is versus just guides an existing practice). These are crucial non-negotiables.

  Key cases to cover include: hedged vs unhedged assertions (like "I think" vs direct claims), the Moorean paradox of stating something while denying knowledge (e.g., "It's raining but I don't know it"), low-stakes assertions with high-stakes downstream consequences (e.g., casual remarks that guide major decisions), assertions to no audience (like diaries), collective assertions (by groups without a unified mind), and contested domains like moral claims where truth is debated.

  The user also wants requirements sorted: non-negotiables (must-haves), negotiables (could bend if justified), and prejudices (unfair biases like insisting on a single rule or knowledge-based formulation). For instance, demanding a unitary norm might be a prejudice—it shouldn't be forced on theories.

  I need to identify tensions: likely, the constitutive requirement (that the norm defines assertion) clashes with handling collective assertions, since groups may "assert" without meeting typical individual standards. Also, the hearer acquisition requirement might exclude otherwise good candidates—it's strict because it demands concrete epistemic gains for hearers, which some norms (like truth-based ones) struggle with if the speaker is insincere but correct.

  Familiar norms will be mentioned only to flag failures: knowledge norms might flunk low-stakes cases, truth norms could mishandle sincerity vs warrant, etc.—but detailed scoring is left to the user.

  Now, structuring the response: first, define the purpose clearly, then list requirements with justifications, sort them, highlight conflicts, and note the key excluding requirement. Keep it neutral and systematic to let the user evaluate theories freely.
answer: |-
  Based on your stipulated purpose and concerns, here is a structured desideratum list for a norm of assertion, categorized and annotated:

  ### I. Fixed Purpose
  The norm of assertion **must underwrite**:
  1.  **Hearer Acquisition (HA):** An account of the epistemic good (e.g., justification, entitlement, knowledge potential) a hearer acquires *pro tanto* simply by being the intended recipient of a warranted assertion. (Focus: *What does telling someone P give them, epistemically?*)
  2.  **Institutional Obligation (IO):** An account of the epistemic obligation institutions incur towards the public *pro tanto* when they issue a warranted public statement. (Focus: *What do institutions owe the public, epistemically, when they state P?*)

  ### II. Desideratum List

  #### A. Non-Negotiable Requirements (Failure here disqualifies a theory)
  1.  **Purpose Constraint (PC):** The norm must demonstrably underwrite both **HA** and **IO**. *Rationale:* This is the stipulated core function of the norm.
  2.  **Sincerity/Warrant Distinction (SWD):** The norm must clearly distinguish between a speaker's *sincerity* (believing what they assert) and their *warrant* (having adequate ground/justification for asserting, whether they believe it or not). *Rationale:* Cases like expert testimony based on evidence they don't personally endorse (e.g., scientist reporting findings contrary to belief); institutional spokespersons issuing statements based on evidence they haven't personally verified.
  3.  **Defect/Blame Distinction (DBD):** The norm must distinguish between the *assertion itself being defective* (violating the norm) and the *speaker being blameworthy* for making it. *Rationale:* Cases of reasonable false belief (non-blameworthy defective assertion) vs. lucky guesses (blameworthy but non-defective assertion? - controversial, but the *distinction* must be capturable).
  4.  **Constitutive Requirement (CR):** The norm must be plausibly *constitutive* of assertion, not merely regulative. That is, violating it must render the act *not a proper assertion*, or fundamentally defective *qua* assertion. *Rationale:* Needed to ground **HA** and **IO** – if assertion isn't defined by this norm, it's unclear why meeting it underwrites these specific epistemic effects. Cases like commands or questions highlight the distinctness of assertion.
  5.  **Hedging Sensitivity (HS):** The norm must explain the normative difference between unhedged assertions ("P") and hedged assertions ("Probably P", "I believe P") – specifically, why hedging typically lowers the warrant threshold required or alters the speaker's commitment. *Rationale:* Ubiquity of hedging; its impact on hearer reliance (**HA**) and institutional liability (**IO**).

  #### B. Negotiable Requirements (Failure here weakens but doesn't necessarily disqualify; solutions may vary)
  6.  **Moorean Infelicity (MI):** The norm should explain the profound infelicity (often incoherence) of asserting P while explicitly denying knowledge (or the relevant warrant) that P ("P, but I don't know that P"). *Rationale:* Core linguistic data point. *Negotiability:* The *precise* explanation (knowledge, belief, justification, etc.) is contested.
  7.  **Stakes Sensitivity (SS):** The norm should accommodate how the stakes *for potential downstream consumers* (even if unknown to speaker/immediate audience) can impact the warrant required for permissible assertion, particularly relevant to **IO**. *Rationale:* Cases like public health advisories or financial reporting with high downstream consequences vs. casual chat. *Negotiability:* Whether stakes *directly* affect the norm or *indirectly* via standards of warrant.
  8.  **Audienceless Assertion (AA):** The norm must apply meaningfully to assertions made without an identifiable hearer (e.g., diaries, soliloquies, public declarations into the void). *Rationale:* Assertion seems possible without an audience. *Negotiability:* How **HA** applies here might require a modified account (e.g., "potential hearer" or focus on commitment).
  9.  **Collective Assertion (CA):** The norm must apply meaningfully to assertions made by collective agents (corporations, governments, research teams) lacking a single mind/belief state. *Rationale:* Critical for **IO**. *Negotiability:* How warrant distributes or aggregates within the collective; how sincerity is understood.
  10. **Contested Domain Robustness (CDR):** The norm must apply to assertions in domains where truth-aptness is contested (e.g., moral, aesthetic, legal assertions) without *presupposing* realism or requiring reformulation specific to each domain. *Rationale:* Assertions occur robustly in these domains; **HA** and **IO** apply (e.g., activist statements, museum placards, legal rulings). *Negotiability:* How the "warrant" condition functions in these contexts.

  #### C. Questionable Prejudices / Biases (Theories should *not* be forced to accept these)
  X1. **Unitary Norm (UN):** The demand that there be only *one* fundamental norm governing all assertion.
  X2. **Knowledge Formulability (KF):** The demand that the norm *must* be formulable specifically in terms of *knowledge*.
  X3. **Strict Speaker-Blame Link (SBL):** The demand that violating the norm *always* entails speaker blameworthiness (contra **DBD**).
  X4. **Immediate Audience Primacy (IAP):** The demand that the stakes/relevance for the immediate audience *always* determine the warrant level (contra **SS**).

  ### III. Specific Cases to Cover
  *   Hedged vs. Unhedged (**HS**)
  *   "P, but I don't know P" (**MI**)
  *   Low immediate stakes / high downstream stakes assertion (e.g., casually mentioning a stock tip later used for a massive investment) (**SS**, **IO**)
  *   Diary entry ("I assert that today was miserable") (**AA**)
  *   Corporate press release ("Company X asserts its commitment to sustainability") (**CA**, **IO**)
  *   "Torture is always wrong" / "This painting is beautiful" / "The contract is valid" (**CDR**)

  ### IV. Key Tensions and Excluding Power

  1.  **Suspected Irreconcilable Pair:** **Collective Assertion (CA)** and **Constitutive Requirement (CR)**.
      *   **Why:** **CR** demands the norm defines what it is to *make an assertion*. For individuals, this is often tied to an internal state (belief, knowledge-like commitment). **CA** requires assertion to be possible for entities lacking such unified internal states. Reconciling how a collective *performance* meets the same constitutive standard as an individual's intentional act grounded in their cognition is deeply challenging. Can a collective "commit" in the constitutive sense without a collective mind? Does **CR** need significant rethinking for collectives?

  2.  **Most Excluding Requirement:** **Hearer Acquisition (HA)**.
      *   **Why:** This is demanding. It requires the norm not just to set a speaker standard, but to *directly ground an epistemic gain for the hearer* solely based on receiving a warranted assertion. Many otherwise plausible norms (e.g., Truth, Justified Belief, Belief) struggle to explain what specific, reliable epistemic good the hearer gains *just from the act of being told by a warranted speaker*, especially if the speaker might be insincere (separated by **SWD**) or the hearer has defeating evidence. Knowledge-based norms often claim **HA** (hearer gains justification/entitlement to believe/know), but face other hurdles (e.g., **SS**, **CDR**). Weaker norms struggle to deliver a substantive enough **HA**. This requirement actively pushes towards norms that generate a form of speaker-guarantee or entitlement-transfer.

  ### V. Brief Failure Flags for Familiar Norms (Per Your Request)
  *   **Knowledge Norm (KN):** Likely fails **SS** (low-stakes assertions), **CDR** (contested domains), **CA** (collective knowledge?), potentially **DBD** (blame in Gettier cases?).
  *   **Truth Norm (TN):** Fails **SWD** (sincere liar warrants **HA**?), **DBD** (lucky true assertion), **HA** (how does hearer gain from a true assertion they can't recognize?), **MI** (explanation weak).
  *   **Justified/Reasonable Belief Norm (JBN):** Faces challenges with **HA** (strength of hearer gain?), **SS** (is justification stakes-sensitive?), **MI** (can be explained, but less tightly than KN).
  *   **Belief Norm (BN):** Fails **SWD** catastrophically, fails **HA** (hearer gains nothing from warranted assertion if speaker insincere), fails **IO** (institutions don't "believe").

  This framework provides the requested specification, grounded firmly in your dual-purpose requirement, with distinctions preserved, cases targeted, and demands sorted. The **HA** requirement and the **CA**/**CR** tension are likely the most significant hurdles for candidate norms. Now you can score the contenders against this clear benchmark.
