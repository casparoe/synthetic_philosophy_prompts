  Below is a decision tree designed to help you clarify your position on personal identity in the context of the neural prosthesis trial. The tree starts from the shared commitment that the synthetic tissue can functionally replicate the biological tissue it replaces. Each question presents a concrete scenario, phrased in ordinary language, and branches based on your intuitive responses. The leaves correspond to named philosophical positions, with notes on combinations no one holds and pairs of positions the tree cannot fully separate.

  ---

  ### **Decision Tree**

  **Start:** You accept that the synthetic tissue can, in principle, perform all functions of the biological tissue it replaces.

  1. **Halfway Point:**  
     After nine months, 50% of the targeted neural region is synthetic. Do you consider yourself to be the *same person* you were when the trial began?  
     - **Yes** → Go to Q2.  
     - **No** → Go to Q5.  

  2. **Anaesthesia Variant:**  
     Each surgical stage is performed under general anaesthesia, so you experience no continuity of consciousness between stages. After full replacement, do you consider yourself the same person?  
