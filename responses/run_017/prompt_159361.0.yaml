  *(Case: Grant that 15% credence deems impermissible. If the risk fell on you, would you proceed?)*  
  - *Yes* → **Asymmetric risk aversion**  
  - *No* → **Symmetric risk tolerance**  
  *Both → Node 5*  

  **Node 5:**  
  **In a structure where one trustee can act unilaterally, should each raise their approval bar?**  
  *(Case: Five trustees; any one can launch deployment. Does error asymmetry demand higher confidence?)*  
  - *Yes* → **Raised bar for unilateral triggers**  
  - *No* → **No adjustment for decision structure**  
  *Both → Node 6*  

  **Node 6:**  
  **Must an act be endorsable by every theory given nontrivial credence?**  
  *(Case: Proposal with 85% expected enormous good, 15% categorical prohibition.)*  
  - *Yes* → **Leaf: Unanimity Endorsement**  
  - *No* → Node 7  
  *Gloss: Only acts permissible under all non-trivially held theories are admissible.*  
  *Awkward: Paralysis when theories conflict; may forbid all acts (e.g., returning $100M wastes 90% credence).*  

  **Node 7:**  
  **Should maximizing expected moral value dominate?**  
  *(Case: $100M budget—60% health, 30% risk-reduction, 10% return. Does expectation favor spending?)*  
  - *Yes* → **Leaf: Expected Choiceworthiness Maximization**  
  - *No* → Node 8  
  *Gloss: Maximize expectation of choiceworthiness across theories.*  
  *Awkward: Risks moral catastrophe if a low-credence theory is right (e.g., 10% chance returning money is obligatory).*  

