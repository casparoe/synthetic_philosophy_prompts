  - *Yes* → **Leaf: Fractional Compliance**  
  - *No* → Node 3  
  *Gloss: Split resources/time/randomization to give each theory a share.*  
  *Awkward: May violate each theory’s constraints by doing "a little" of what they forbid.*  

  **Node 3:**  
  **Should future trustees’ potential moral shifts affect current decisions?**  
  *(Case: Charter clause design—entrenched vs. revisable by majority.)*  
  - *Yes* → **Diachronic aggregation**  
  - *No* → **Static aggregation**  
  *Both → Node 4*  

