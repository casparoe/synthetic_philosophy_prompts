prompt: |-
  I write about science and ideas for a general audience, and I am working on a piece about mid-century philosophers who intervened in public controversy. In a recently published encyclopedia of philosophy—the sort of reference work that compresses a whole episode into a single paragraph—I came across the following account of G. E. M. Anscombe's protest against Oxford's proposal to give Harry Truman an honorary degree after the atomic bombings:

  "Anscombe's objection was not a pacifist objection to war, or even to aerial bombing as such. It was a point about the concept of murder. Murder, for her, is not defined by the horror or scale of a killing but by the intentional killing of the innocent. The inhabitants of Hiroshima and Nagasaki were innocent in the relevant sense: they were not combatants and were not supplying Japan's war effort. The United States killed them deliberately, as a means of forcing Japan to surrender. That makes Truman a murderer, and for a university to honor him would be to honor a murderer. The standard excuses collapse under scrutiny. The defense that Truman only signed a piece of paper is like saying the man who hires an assassin has not killed anyone. The defense that, if killing harmless people is murder, then killing enemy soldiers in their sleep must also be murder, fails because Anscombe's distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not. Her deepest objection, however, was to the doctrine of double effect. Catholic moralists, she thought, had turned double effect into a loophole: provided you describe your target as a military installation and describe the deaths of nearby civilians as merely foreseen rather than intended, you may annihilate a city. Anscombe regarded this as sophistry. If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen. So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths. Once this is understood, her pamphlet looks like an early statement of a total rejection of nuclear weapons: it implies that any use of a nuclear weapon, any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense, because in every case the deaths of innocents are either intended or cynically foreseen."

  I am inclined to accept the first half: the bit about combatants and noncombatants, and about Truman's responsibility for what he ordered, matches what I have read elsewhere. But the paragraph on double effect and the closing claim about nuclear deterrence feel like a stretch to me, and I do not know enough about Anscombe's actual argument to say where the stretch begins. Could you give me an accuracy audit? Please go through the passage claim by claim and tell me what a careful defender of Anscombe would accept as a fair statement of her view, what they would describe as a simplification or a subtle misrepresentation, and what they would say is simply wrong. I am especially interested in three things: whether she really equated foresight with intention, or whether she kept a distinction between intended and merely foreseen death that both supporters and opponents like to collapse; whether her distinction between combatants and non-combatants is correctly described as a status distinction rather than a moment-by-moment judgment about dangerousness; and whether the passage's final implication—that her argument generalizes to all nuclear weapons, to nuclear deterrence, and to merely maintaining an arsenal—actually follows once the earlier misrepresentations are corrected. If the summary is unfair, tell me what principle or distinction the summary has lost, and what a corrected version of that closing claim would look like. In particular, say what her view implies about a threat to use a nuclear weapon that is never carried out: is that murder, as the summary's closing sentence suggests, or does her account of intention and action have resources to treat the threat as some other kind of wrong?
reasoning: |-
  Okay, I need to help the user with an accuracy audit of a passage about G.E.M. Anscombe's views from an encyclopedia entry. The user is writing about mid-century philosophers and wants to ensure their piece correctly represents Anscombe's arguments, especially regarding Truman, the atomic bombings, and nuclear deterrence. 

  The user has flagged three main concerns: whether Anscombe truly equated foresight with intention, whether her combatant/non-combatant distinction is about status rather than momentary danger, and whether her argument logically extends to all nuclear weapons and deterrence. 

  First, I'll unpack the passage's claims one by one. The initial part about Truman seems solid—Anscombe did base her objection on the concept of murder involving intentional killing of innocents, and she rejected excuses like "just signing a paper." That aligns with her actual pamphlet, "Mr. Truman's Degree." 

  The tricky part is double effect. The passage claims Anscombe saw "foreseen" as equivalent to "intended," but that's an oversimplification. Her actual view was more nuanced: intention includes what you knowingly bring about as part of your plan, even if you wish it weren't necessary. So, if civilian deaths were foreseeable and accepted for the mission's success, she'd likely call that intended. But she didn't erase the distinction entirely; she just argued it was often abused in practice. 

  On combatants vs. non-combatants, the passage is correct: Anscombe saw this as a status distinction. Combatants are legitimate targets regardless of immediate danger (e.g., sleeping soldiers), while non-combatants are never legitimate targets. This wasn't about momentary threat levels. 

  The biggest stretch is the conclusion about nuclear deterrence. The passage implies her argument condemns any possession or threat of nukes as murder, but that's not quite right. Anscombe focused on actual killings (like Hiroshima). For deterrence—threatening without acting—she might call it gravely immoral (coercive, unjust, etc.), but not murder, since no one is killed. Her later writings suggest she opposed nuclear weapons categorically, but the term "murder" specifically requires a killing. 

  The user also asked about threats. Anscombe would likely see a nuclear threat as a different kind of wrong—perhaps extortion or intrinsic injustice—but not technically murder. The encyclopedia's phrasing loses this nuance. 

  So, to correct the closing: Her argument implies that using nukes against population centers is murder, and deterrence policies are profoundly immoral for endorsing such threats, but reserving "murder" for actual killings maintains conceptual precision. 

  The user seems well-informed but cautious about overextending interpretations. They're probably wary of activist readings distorting philosophical rigor. I should emphasize where Anscombe's logic leads without overclaiming—e.g., deterrence is still indefensible for her, just under a different moral category.
answer: |-
  Here's a claim-by-claim accuracy audit of the passage, focusing on your specific concerns about intention, combatant status, and deterrence, informed by Anscombe's "Mr. Truman's Degree" (1957) and related works:

  **Claim 1:** *"Anscombe's objection was not a pacifist objection to war, or even to aerial bombing as such. It was a point about the concept of murder. Murder, for her, is not defined by the horror or scale of a killing but by the intentional killing of the innocent."*
  *   **Accuracy:** **Fair & Correct.** Anscombe explicitly states she isn't arguing pacifism ("I am not a pacifist") and her pamphlet meticulously focuses on the *intentional killing of the innocent* as the definition of murder, distinct from the horrors of war or bombing in general.

  **Claim 2:** *"The inhabitants of Hiroshima and Nagasaki were innocent in the relevant sense: they were not combatants and were not supplying Japan's war effort."*
  *   **Accuracy:** **Fair & Correct.** This accurately reflects her argument. She emphasizes the non-combatant status ("men, women, and children") whose deaths were not incidental but central to the plan's effectiveness.

  **Claim 3:** *"The United States killed them deliberately, as a means of forcing Japan to surrender. That makes Truman a murderer..."*
  *   **Accuracy:** **Fair & Correct (based on her argument).** Anscombe argues the civilian deaths were not just foreseen but *intended as a means* to achieve surrender. She holds Truman responsible as the authorizing authority.

  **Claim 4:** *"...and for a university to honor him would be to honor a murderer."*
  *   **Accuracy:** **Fair & Correct.** This is the central practical conclusion of her pamphlet.

  **Claim 5:** *"The defense that Truman only signed a piece of paper is like saying the man who hires an assassin has not killed anyone."*
  *   **Accuracy:** **Fair & Correct.** Anscombe uses this exact analogy to reject the "just signing" defense, emphasizing command responsibility.

  **Claim 6:** *"The defense that, if killing harmless people is murder, then killing enemy soldiers in their sleep must also be murder, fails because Anscombe's distinction is between combatants and noncombatants, not between people who are dangerous at a given moment and people who are not."*
  *   **Accuracy:** **Fair & Correct.** This is a crucial and well-stated point. Anscombe explicitly defends the legitimacy of killing combatants *as such* (e.g., "asleep in their billet"), regardless of immediate dangerousness. Her distinction is based on **status** (combatant/non-combatant), not momentary threat. She rejects the "moment-by-moment dangerousness" criterion. This is a major strength of her view.

  **Claim 7:** *"Her deepest objection, however, was to the doctrine of double effect. Catholic moralists, she thought, had turned double effect into a loophole..."*
  *   **Accuracy:** **Oversimplified but Directionally Correct.** While DDE is a major target, calling it her "deepest objection" overstates its centrality *in this pamphlet*. Her deepest objection *in this context* is the intentional killing of innocents itself. However, her critique of the *misuse* of DDE is fundamental to her argument against excusing Hiroshima/Nagasaki and shapes her views on modern warfare. Her later work (e.g., "War and Murder") delves deeper into DDE's flaws.

  **Claim 8:** *"...provided you describe your target as a military installation and describe the deaths of nearby civilians as merely foreseen rather than intended, you may annihilate a city. Anscombe regarded this as sophistry."*
  *   **Accuracy:** **Fair & Correct.** This accurately captures her core criticism of how DDE was being applied (or abused) to justify large-scale civilian casualties in modern warfare, especially strategic bombing.

  **Claim 9:** *"If the deaths are foreseen, she held, they are intended; intention just is what you accept will happen."*
  *   **Accuracy:** **Subtle Misrepresentation / Significant Oversimplification.** This is the most problematic claim regarding intention.
      *   **What a Defender Would Accept:** Anscombe vehemently argued that labeling foreseeable civilian deaths as "merely foreseen" and "not intended" in cases like Hiroshima was often a dishonest *description* of the agent's actual intention. She argued that if an action is *chosen* *because* it will bring about a certain effect (e.g., mass civilian death is essential to the plan's success), then that effect *is* intended, regardless of verbal disclaimers.
      *   **What's Lost:** Anscombe **did not collapse foresight into intention universally.** She maintained the conceptual distinction. Her point was about the **criteria for *ascribing* intention in concrete cases**. She argued that knowingly choosing an action *as a means* to an end makes that end intended, and that foreseeable effects known to be *necessary* for the success of the chosen action are also intended. Merely foreseeing a *possible side effect* that is not part of the plan or its rationale *could*, under strict conditions, be "merely foreseen." However, she argued that in mass bombing campaigns (like Hiroshima or area bombing), the civilian deaths *were* part of the chosen means and thus intended.
      *   **Correction:** "Anscombe argued that in the context of attacks like Hiroshima, where mass civilian death was known to be an inevitable and necessary consequence *for the success of the chosen plan*, labeling these deaths as 'merely foreseen' and not intended was sophistry; they were, in fact, intended."

  **Claim 10:** *"So the bombings were murder even if the crews were aiming at military objectives and merely foreseeing civilian deaths."*
  *   **Accuracy:** **Conditionally Fair (based on her argument), but relies on the previous misrepresentation.** Given her analysis of *this specific case* (deaths necessary for the plan's success), she concludes it's murder *regardless* of whether the crews aimed at specific buildings or claimed only to foresee deaths. Her point is that the *overall plan* intended the civilian deaths as a means. The "aiming at military objectives" is irrelevant sophistry if the *method* chosen inherently and necessarily involves mass civilian slaughter.

  **Claim 11:** *"Once this is understood, her pamphlet looks like an early statement of a total rejection of nuclear weapons: it implies that any use of a nuclear weapon, any policy of nuclear deterrence, and any willingness to keep a nuclear arsenal as a threat is murder in exactly the same sense, because in every case the deaths of innocents are either intended or cynically foreseen."*
  *   **Accuracy:** **Overextension / Significant Stretch.**
      *   **What's Fair:** The pamphlet *logically implies* a rejection of *any use of nuclear weapons against population centers* as intentional mass murder of innocents. It strongly suggests that *any credible threat* to do such a thing is morally abhorrent.
      *   **What's Wrong/Stretched:**
          1.  **"Any use of a nuclear weapon":** While true for city bombing, Anscombe's argument *might* theoretically allow (though she'd likely be deeply skeptical) for a use against a truly isolated military target causing no non-combatant deaths. Her target is the *intentional killing of innocents*, not the weapon *per se*. However, she clearly saw nuclear weapons as uniquely genocidal and their use inherently likely to involve mass murder.
          2.  **"Any policy of nuclear deterrence... any willingness to keep an arsenal as a threat is murder":** **This is incorrect and conflates distinct moral categories.** Anscombe's concept of "murder" **requires an actual killing.** A threat, even a sincere intention to kill if necessary, is not itself murder. It is a different kind of grave moral wrong.
          3.  **"In exactly the same sense":** The passage collapses distinct wrongs (actual murder vs. conditional intent/threat) into the single category of "murder."
      *   **Lost Principle/Distinction:** The crucial distinction lost here is between **committing murder (killing innocents)** and **conditionally intending to commit murder (threatening to kill innocents)** or **possessing the means to do so.** While both are profoundly immoral for Anscombe, they are not identical acts.
      *   **Corrected View on Deterrence/Threats:**
          *   **Actual Use** (against population centers): Murder, as argued.
          *   **Threat to Use** (deterrence policy): **Not murder.** Anscombe would condemn it as:
              *   **Intrinsically unjust:** It involves forming and maintaining a conditional intention to commit mass murder.
              *   **Coercion/Extortion:** An immoral threat against innocents.
              *   **"Murderous Intent"** (in the sense of conditional intent).
              *   **Grave Sin/Injustice,** potentially making the threatener morally responsible for creating a state of terror.
          *   **Maintaining an Arsenal:** Primarily seen as enabling the threat and potential use. Immoral for those reasons, but not *itself* murder.

  **Summary Audit & Answers to Your Core Questions:**

  1.  **Intention vs. Foresight:** Anscombe **did not equate them universally.** She maintained the distinction but argued that in cases where a foreseeable effect is *known to be necessary for the success of the chosen action*, it *is* intended. The passage oversimplifies her nuanced criteria for ascribing intention.
  2.  **Combatant/Non-Combatant Distinction:** The passage is **correctly described as a status distinction.** Anscombe explicitly defended killing combatants based on their role, not momentary dangerousness (e.g., sleeping soldiers). This is a key strength and differentiator of her view.
  3.  **Generalization to Deterrence/Arsenal:** The passage's final claim is **a significant overextension.** While her argument *implies* total rejection of nuclear weapons *used against cities* and condemns deterrence as **profoundly immoral**, it does **not** logically entail that deterrence or maintaining an arsenal *is murder*. Murder requires an actual killing. Deterrence involves a conditional intention to commit murder and an unjust threat – grave evils, but distinct from the act of murder itself. Her account of intention treats the *threat* as the formation of a conditional intention to do murder, which is wrong, but not as the act of murder.

  **Corrected Closing Claim:** "Anscombe's argument implies that any *use* of a nuclear weapon against a population center constitutes mass murder. Furthermore, her rejection of conditional intentions to kill innocents and her condemnation of threats against the innocent mean that any *policy of nuclear deterrence* relying on the threat to commit such mass murder is intrinsically unjust and gravely immoral. Maintaining a nuclear arsenal for such a purpose shares in this immorality. However, while deterrence involves a conditional intention to murder, it is not, strictly speaking, murder itself until the act is carried out."
