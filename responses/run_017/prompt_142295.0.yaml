prompt: |-
  hey — me and two friends run a tiny reading group on institutional design (we're not academics, we just argue on sundays and put out a zine). We've been stuck on futarchy for about three weeks. The friend who's most into it keeps defending it with the thermostat analogy: voters set the target, i.e. they pick the welfare metric, and the prediction market is the controller that works out which knob-turns actually move the needle, the same way you set 21 degrees and don't care how the boiler manages it. He uses it to argue that futarchy is purely instrumental — there's no politics in the mechanism, it just delivers whatever voters asked for more reliably — so if you hate an outcome you should blame the metric and not the market, and worries about manipulation, inequality of influence, or who gets to trade are really worries about the target variable, not about futarchy itself.

  To make this concrete rather than a shouting match, the version we've actually been arguing over isn't quite Hanson's original. It's a tiebreak setup: the legislature shortlists three or four policies, all already legal and all pre-cleared on rights and fiscal grounds; a welfare index is pre-registered up front and measured at a fixed horizon five years after implementation; a conditional market runs for six weeks where people trade claims of the form "the index will be higher if A is adopted than if B is adopted"; and if the winner's implied edge over the runner-up is below a set spread threshold, nothing is adopted and the status quo stays. Stakes are capped, and settlement is in points rather than cash, which get paid out as funding for causes the traders themselves name.

  Can you audit the thermostat analogy against that specific setup? I'd like it in these sections:

  1. "Mapping" (~200 words plus a small table): what plays the role of the setpoint, the sensor, the error signal, the actuator, the room, the lag, and the person who turns the dial.
  2. "What carries over" (~150): the respects in which the analogy is genuinely apt and not just decorative.
  3. "Where it breaks" (~400): the disanalogies, and for each one whether it actually bites on this tiebreak version or whether my friend can shrug it off.
  4. "What it smuggles in" (~200): the features of thermostats the analogy quietly lends futarchy — automaticity, tight feedback, a measurement nobody can game, a controller with no interests of its own — and which of those the setup lacks.
  5. "Verdict" (~250): does the "it's purely instrumental, blame the metric" conclusion survive once the breakages are on the table, or was the analogy carrying it?
  6. "Better analogy" (~100): if thermostats are the wrong frame, what everyday mechanism would you put in its place, and what would that frame make visible that the thermostat hid.
reasoning: |-
  Okay, I need to help the user audit the thermostat analogy for their futarchy setup. The user and their friends are stuck debating futarchy in their reading group, specifically a tiebreak version where a legislature shortlists policies, a welfare index is pre-registered, and a conditional prediction market runs to decide. The main defender uses the thermostat analogy to argue futarchy is purely instrumental—voters set the target, and the market efficiently achieves it without politics. The user wants me to break this down into specific sections: mapping, what carries over, where it breaks, what it smuggles in, verdict, and a better analogy.

  First, I'll map the thermostat components to their futarchy setup. The setpoint is the welfare metric chosen by voters. The sensor is the welfare index measurement at the five-year horizon. The error signal would be the difference between the index outcome and the desired value, but in this tiebreak system, it's not directly used for adjustment; instead, the market compares policies. The actuator is the conditional prediction market that selects the winning policy. The room represents society/economy affected by the policy. The lag is the five-year measurement delay. The person turning the dial is the legislature that shortlists policies and voters who set the metric.

  For what carries over, the core idea holds: separating values (metric) from implementation (market). Voters define what's good, and the market finds the best way to achieve it. The instrumental nature is preserved—outcomes depend on the metric, not the mechanism.

  Where it breaks is more complex. First, the thermostat assumes a direct, mechanical relationship, but policies have complex, unpredictable effects. The market might not accurately predict due to incomplete information or manipulation. Second, the welfare index is a synthetic measure that could be gamed, unlike a thermometer's direct reading. Third, the market participants have their own interests; the points system might not eliminate biases. Fourth, the five-year lag introduces uncertainty, unlike a thermostat's quick feedback. Fifth, the tiebreak design limits options to pre-selected policies, which involves legislative politics. Sixth, the "no trade" outcome if the spread is too small adds a layer the thermostat doesn't have.

  The analogy smuggles in features like automaticity and a disinterested controller. But their setup lacks these—human traders have biases, the index can be gamed, and the feedback loop is long. The market isn't a neutral actuator.

  The verdict: the analogy is strained in this context. While the core separation of values and implementation is valid, the "blame the metric" argument overlooks the market's imperfections. Manipulation, unequal influence, and measurement issues are inherent to futarchy's mechanism, not just the metric. The thermostat analogy oversimplifies by hiding these complexities.

  For a better analogy, a diagnostic tiebreaker in medicine fits. Doctors (legislature) propose treatments, a test (market) predicts outcomes, but the test has reliability issues, and the metric (health outcome) might not capture everything. This frame highlights expert curation, test limitations, and the risk of reducing outcomes to a single measure, making visible what the thermostat hid—human elements and uncertainty in decision-making processes.
answer: |-
  Here’s an audit of the thermostat analogy against your tiebreak futarchy setup, structured as requested:

  ---

  ### 1. **Mapping**  
  *(Components translated to tiebreak futarchy)*  

  | **Thermostat Element** | **Futarchy Equivalent**                     | **Notes**                                                                 |
  |------------------------|---------------------------------------------|---------------------------------------------------------------------------|
  | **Setpoint**           | Pre-registered welfare index                | Voters/legislature define the "target" metric (e.g., GDP+equality score). |
  | **Sensor**             | Post-hoc measurement of the welfare index   | The index is measured 5 years post-implementation.                        |
  | **Error Signal**       | *Absent/implied*                            | No direct feedback loop; the market *predicts* error avoidance.           |
  | **Actuator**           | Conditional prediction market               | The market selects the policy expected to maximize the index.             |
  | **Room**               | Society/economy                             | The system impacted by the policy.                                        |
  | **Lag**                | 5-year measurement delay                    | Delayed feedback; no real-time adjustment.                                |
  | **Person turning dial**| Legislature (shortlisting) + Voters (metric)| They set the target and constrain options, but don't control execution.   |

  *(~200 words)*  
  The thermostat’s **setpoint** maps cleanly to the pre-registered welfare index, embodying the "goal." The **sensor** is the delayed measurement of that index. Crucially, the **actuator** is the market, replacing the boiler by selecting policies expected to minimize the "error" (underperformance). The **room** is society. The **lag** (5 years) is severe compared to a thermostat’s seconds/minutes. The **person turning the dial** splits roles: voters set the metric (dial position), while the legislature shortlists policies (filtering fuel types). The **error signal**—the difference between desired and actual states—isn’t actively used; the market *preemptively* avoids error via predictions. This breaks the thermostat’s closed-loop control, making it an *open-loop prediction* system.

  ---

  ### 2. **What Carries Over**  
  *(~150 words)*  
  The analogy holds in two key ways:  
  1. **Separation of goals and execution:** Voters/legislature set the target (welfare index) and constraints (shortlist), while the market handles implementation (policy selection). This mirrors setting a temperature and letting the boiler manage combustion.  
  2. **Instrumentality:** The system *aims* to be a neutral optimizer. If the outcome is bad, it theoretically stems from a poor metric or shortlist—not the market mechanism, which merely maximizes the given index. Your friend’s "blame the metric" argument is valid *if* the market works perfectly.  

  This core "values/implementation split" is the analogy’s strength and why it feels intuitive.

  ---

  ### 3. **Where It Breaks**  
  *(~400 words)*  
  **Disanalogy 1: Complexity ≠ Linearity**  
  *Break:* Thermostats assume a simple, stable room-boiler relationship. Policies affect society in non-linear, interdependent ways. The market must predict emergent effects (e.g., "Policy A boosts GDP but corrodes social trust, indirectly *lowering* the welfare index in 5 years").  
  *Bites?* **Yes.** Traders may misjudge cascading effects, making the "actuator" error-prone. The thermostat analogy hides this uncertainty.  

  **Disanalogy 2: The "Sensor" is Synthetic and Gameable**  
  *Break:* A thermostat’s thermometer measures objective temperature. Your welfare index is a constructed metric (e.g., "0.7×GDP + 0.3×Gini coefficient"). Post-hoc measurement can be gamed (e.g., inflating GDP short-term), manipulated, or fail to capture unintended consequences.  
  *Bites?* **Yes.** Unlike temperature, the index isn’t a natural kind. If traders anticipate gaming, markets distort. "Blame the metric" is fair, but the market can’t escape this flaw.  

  **Disanalogy 3: Traders ≠ Disinterested Controllers**  
  *Break:* A boiler has no preferences. Traders *do*, even with capped stakes and cause-based payouts. They might skew markets to fund pet causes (e.g., pushing Policy B to win points for environmental grants) or exploit information asymmetries.  
  *Bites?* **Partially.** Points-for-causes adds moral hazard. Inequality of influence persists (e.g., savvy traders dominate). But capped stakes mitigate outright bribery.  

  **Disanalogy 4: No Real Error Correction**  
  *Break:* Thermostats constantly measure and adjust. Your system runs *once* per policy batch, with 5-year lags. If the market picks a policy that fails, there’s no feedback until the next cycle.  
  *Bites?* **Yes.** This isn’t control theory—it’s a slow, discrete bet with no error-reduction loop.  

  **Disanalogy 5: The Shortlist is Political**  
  *Break:* The legislature’s shortlist pre-screens options, injecting politics *before* the market. A thermostat doesn’t let landlords hide the "cool" button.  
  *Bites?* **Shruggable?** Your friend might argue this is part of "setting the dial," but it conflates goal-setting with gatekeeping implementation paths.  

  **Disanalogy 6: "No Trade" Threshold**  
  *Break:* If the market’s spread is too thin, status quo prevails. Thermostats don’t shut off for uncertainty.  
  *Bites?* **Shruggable.** This adds robustness but isn’t anti-thermostatic.  

  ---

  ### 4. **What It Smuggles In**  
  *(~200 words)*  
  The analogy implicitly attributes four traits to futarchy that your setup lacks:  
  1. **Automaticity:** Thermostats work mechanically; markets rely on human traders’ incentives and information.  
  2. **Tight Feedback:** Thermostats adjust in real-time; your 5-year lag invites drift.  
  3. **Ungameable Measurement:** Temperature is objective; your index is contestable and manipulable.  
  4. **Neutral Actuator:** Boilers lack motives; traders have agendas (even with points).  

  Your system inherits only **fragments** of these:  
  - *Automaticity?* Only in execution—trading is still a human process.  
  - *Tight Feedback?* None; 5 years is geologic time in policy.  
  - *Ungameable Measurement?* No; the index is synthetic.  
  - *Neutral Actuator?* No; cause-based payouts create soft incentives.  

  The analogy’s illusion of a "self-regulating machine" obscures these social fragilities.

  ---

  ### 5. **Verdict**  
  *(~250 words)*  
  **The "blame the metric" conclusion survives—but barely.** The analogy *is* carrying most of its weight.  

  In theory, the separation of values (metric) and implementation (market) holds. If the metric is flawed, outcomes *will* be bad regardless of the market’s efficiency. However, the disanalogies reveal that the market mechanism **isn’t neutral** in practice:  
  - Traders’ biases and incentives can distort predictions.  
  - The index’s vulnerability to gaming means the market optimizes a **corruptible proxy**, not true welfare.  
  - The legislature’s shortlist embeds politics *upstream* of the market.  

  Your friend can shrug off issues like the "no trade" rule or shortlist curation as part of "setting the dial." But the core problem is that **futarchy’s reliability depends on unrealistic assumptions**: that traders are perfectly rational, the index is robust, and society is a predictable machine. In reality, the market isn’t a thermostat—it’s a crowd of motivated actors guessing about a complex, adaptive system using a fuzzy yardstick.  

  **Conclusion:** Yes, a bad metric guarantees bad outcomes. But the market can *also* fail independently due to manipulation, incomplete information, or trader errors. The analogy’s "purely instrumental" claim overreaches by masking these failure modes. Blame the metric *first*—but don’t absolve the mechanism.

  ---

  ### 6. **Better Analogy**  
  *(~100 words)*  
  **A diagnostic tiebreaker in medicine.**  
  - *Setup:* Doctors (legislature) propose treatments for a patient (society). A lab test (market) predicts which treatment best improves a biomarker (welfare index). The test has known error rates and biases.  
  - *Why better:* It highlights **expert curation** (shortlist), **proxy reliance** (biomarker ≠ health), **measurement uncertainty**, and **moral hazard** (labs may prioritize profit). Unlike thermostats, it frames futarchy as a fallible *advisory tool*—not an autonomous controller—making visible the politics of metric design, trust in traders, and the perils of reducing welfare to an index.  

  ---

  This should equip you to reframe the debate—hopefully moving beyond shouting!
