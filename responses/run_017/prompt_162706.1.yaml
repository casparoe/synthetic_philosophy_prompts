answer: |-
  ### Final Essay Question Handout

  **Aristotle on Money and Exchange: The Case of Sykaminon**  
  *Answer all parts in a single, coherent essay (approx. 700 words; 90 minutes). Base your analysis solely on the provided passages (NE 1133a–b) and Aristotle’s Politics I (as discussed in class).*  

  The city of Sykaminon, facing famine, enacts two policies:  
  1. **Chreia-unit**: A statutory unit of account defined as a fixed basket of goods (grain, oil, wine, firewood, cloak) for 20 years. All contracts, fines, taxes, and prices are denominated in chreia-units, but no physical currency exists. Payments use silver staters, with a daily exchange rate posted in the agora.  
  2. **Kleinias’s loan**: A merchant lends 100 chreia-units, repayable as 110 chreia-units after one year. Repayment uses silver at the prevailing rate. Over the year, the silver value of the chreia-unit rises by 10%.  

  **Analyze Sykaminon’s system through Aristotle’s framework by addressing:**  
  (a) Aristotle identifies two functions for money in exchange: (i) a *measure* enabling proportionate requital (e.g., "builder to shoemaker as shoes to house"), and (ii) a *circulating medium* held to satisfy future needs. Can reciprocal justice function if the chreia-unit serves as measure but not circulating medium? Explain why Aristotle’s account does or does not require both functions to be united.  
  (b) Aristotle calls demand (*chreia*) the "real standard" of value, represented "conventionally" by money. Is the chreia-unit (fixed for 20 years) a better or worse representation of demand than silver? Consider his claims that demand changes, commensurability is imperfect, and prices "ought to be fixed." Does this reform advance or undermine reciprocal justice?  
  (c) Aristotle condemns interest (*tokos*) in *Politics* I because money (a tool for exchange) unnaturally "breeds" from itself. Does Kleinias’s loan constitute *tokos*? Address: (i) the 10% increment in chreia-units, (ii) the unchanged silver value repaid. Which of Aristotle’s complaints (denomination vs. material gain) applies?  

  ---

  ### Model Answer (703 words)  
  Aristotle’s analysis of money in *Nicomachean Ethics* V and *Politics* I centers on its role in enabling reciprocal justice through commensurability and deferred exchange. Sykaminon’s experiment—decoupling the unit of account (chreia-unit) from the circulating medium (silver)—tests the coherence of his theory. I argue that the chreia-unit fatally disrupts Aristotle’s model by divorcing money’s core functions, misrepresenting demand, and creating ambiguities around usury.  

  **(a) The chreia-unit severs measurement from circulation, crippling reciprocal justice.** Aristotle insists money must unify two roles: it is a *measure* establishing proportional equality between diverse goods (e.g., houses and shoes via the ratio of their producers, NE 1133a), and a *circulating medium* acting as a “guarantee of exchange in the future” (1133b). The latter allows money to bridge temporal gaps in need—enabling one to “produce [it] in payment” later. Sykaminon’s system splits these roles: the chreia-unit measures value but cannot circulate, while silver circulates but lacks stability as a measure (its daily rate fluctuates). This division undermines reciprocal justice, which relies on a *single* entity to synchronize immediate commensurability and future security. Without this unity, deferred exchanges (like Kleinias’s loan) become precarious: the measure (chreia-unit) is rigid, but the medium (silver) is volatile, so the “guarantee” fails. Aristotle’s diagonal conjunction (e.g., builder/shoemaker) requires a stable common term; the chreia-unit provides this statically, but without circulation, it cannot fulfill money’s temporal role. Reciprocal justice thus collapses without both functions coexisting in one instrument.  

  **(b) The chreia-unit is a worse representation of demand than silver, exacerbating conventionality.** Aristotle states that demand (*chreia*) is the “real standard” of value, with money merely its “conventional representation” (nomisma, NE 1133a). Demand shifts with human needs, and if it alters, “exchange will go on no longer, or on different lines.” The chreia-unit’s fixed basket ignores this dynamism—by statute, it cannot reflect changes in scarcity or desire for 20 years. Silver, though “liable to fluctuation,” adapts organically to demand through the agora’s daily rates, aligning with Aristotle’s view that money’s value is “comparatively constant” in practice (1133b). The chreia-unit’s artificial stasis contradicts his emphasis on demand’s fluidity, making it a poor proxy. Worse, Aristotle acknowledges that monetary commensurability is only “sufficiently accurate for practical purposes,” implying that flexibility matters more than perfection. Sykaminon’s attempt to “fix prices” via the basket might seem to heed his suggestion that prices “ought to be fixed” to ensure association. Yet by freezing the basket, it prioritizes legal fiction over lived demand, rendering justice more arbitrary—not less. Reciprocal justice depends on convention (*nomos*), but the chreia-unit’s statutory rigidity exaggerates this, detaching value from actual need.  

  **(c) Kleinias’s loan is tokos by denomination, exposing a flaw in Aristotle’s critique.** Aristotle’s *Politics* I condemns interest because money, meant for use in exchange (acquiring goods), is “barren”; breeding money from money (tokos) perverts it into an end. Kleinias’s contract—100 units repaid as 110—appears to fit this: the 10% increment denominated in chreia-units treats money as self-multiplying. However, the rise in the unit’s silver value means Kleinias receives no extra silver (110 units × new rate = 100 units × old rate +10% adjustment). Aristotle’s objection targets the *form* of the transaction, not material outcomes. He attacks interest as a contractual distortion where money “breeds” from itself *by agreement*, irrespective of real-world fluctuations. Here, the *denomination* of gain (more units) embodies this unnatural “breeding,” even if silver gains are null. Had the silver rate fallen, Kleinias would profit materially from the unit increase; the risk underscores that the loan is structured to extract value from the *unit itself*, not from exchange. Thus, Aristotle’s core complaint—that tokos makes money a “father” rather than a “tool”—applies to the chreia-unit’s role as the measure of value. The outcome (no silver gain) is incidental; the contractual intent violates reciprocity by prioritizing monetary increment over need-based exchange.  

  **Conclusion**: Sykaminon’s system reveals tensions in Aristotle’s theory. The chreia-unit’s split functions destabilize reciprocal justice, its rigidity misrepresents demand, and Kleinias’s loan, though materially fair, remains usurious in form. Aristotle’s framework cannot sustain such divisions—money must be a unified, adaptive convention to serve human association.  

  ---

  ### Marking Scheme (out of 25)  
  | move | marks | a_level | b_level | typical_mistake |  
  |------|-------|---------|---------|----------------|  
  | (a) Analyze separation of money’s roles and necessity for reciprocal justice. | 8 | Argues both roles must be united: measure enables proportional requital *now*; circulation guarantees deferred exchange. Explains split undermines "future guarantee" (NE 1133b), collapsing reciprocity. | Correctly identifies both roles but weakly links to reciprocity (e.g., "both are important" without explaining why the split breaks deferred exchange). | Asserts measure alone suffices; ignores the temporal role (e.g., focuses only on diagonal conjunction). Ignores NE 1133b’s "guarantee." |  
  | (b) Evaluate chreia-unit vs. silver as demand’s representation. | 9 | Demonstrates chreia-unit is worse: fixed basket ignores demand’s fluidity (NE 1133a), unlike silver’s organic rate changes. Notes tension: Aristotle wants fixed prices *but* flexible demand-representation. | States chreia-unit is worse due to fixity but doesn’t contrast with silver’s adaptability or address Aristotle’s "practical" commensurability. | Misreads basket as "objective" improvement; ignores 20-year rigidity. Fails to cite NE 1133a on demand change. |  
  | (c) Assess loan as tokos, tracking denomination vs. outcome. | 8 | Shows loan is tokos by *denomination* (10% unit increase) per *Politics* I: interest is contractual breeding of money, regardless of material outcome. Argues Aristotle targets form, not silver gain. | Identifies denomination as key but doesn’t explain why outcome is irrelevant or cite Aristotle’s focus on money "breeding." | Claims no silver gain = no tokos; misses that contract structure violates Aristotle’s use-exchange distinction. |  
  | Bonus: Insight beyond requirements (e.g., exposes tension in Aristotle’s stability demands; notes reform’s anachronism). | 2 | Highlights how Aristotle’s call for "fixed prices" (NE 1133b) clashes with demand’s fluidity, revealing a flaw in his theory. | Lightly notes tension without development. | Adds unsupported claims or external references. |  

  ---

