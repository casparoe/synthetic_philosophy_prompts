  | (c) Determine if the loan is tokos and which aspect (denomination or outcome) Aristotle's critique tracks. | 8 | Argues that the loan is tokos by form (denomination of more units) regardless of the silver outcome, because Aristotle targets the contractual attempt to breed money. | Identifies the form as tokos but without explaining why the outcome doesn't absolve it, or vice versa. | Focusing solely on the silver outcome (no gain, so not tokos) without addressing the denomination; missing the Politics argument. |
