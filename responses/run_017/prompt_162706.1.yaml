  (a) Detaching the functions of money (measuring vs. circulating) and assessing whether reciprocal justice can do without one if the other is preserved.

  (b) Evaluating whether the chreia-unit is a better or worse representative of demand than silver, in Aristotle's terms, considering the fixed basket and the requirement for commensurability.

  (c) Determining whether Kleinias's loan constitutes tokos (usury) by Aristotle's standards, separating the denomination from the actual silver transfer.

  We'll design the question to be clear and directive, then provide a model answer and a marking scheme.

  **Question Design:**

  We'll structure the question to have three parts (a, b, c) as suggested. We'll tighten the prose and make sure each part is a clear task.

  **Final Handout Form:**

  ---

  **Essay Question: Aristotle on Money and Exchange in Sykaminon**

  Read the attached passages from Aristotle’s *Nicomachean Ethics* V (1133a–1133b) and recall his discussion of money and exchange in *Politics* I. Then, using **only** these texts, analyze the following case:

  *The city of Sykaminon, after a bad harvest, decrees two measures. First, it establishes a unit of account called the chreia-unit, defined by statute as a fixed basket of necessaries (grain, oil, wine, firewood, a cloak) for twenty years. No coin denominated in chreia-units is issued. All contracts, fines, taxes, and posted prices are reckoned in chreia-units, but payments are made in silver staters. The daily exchange rate between the chreia-unit and silver is posted in the agora. Second, a merchant named Kleinias lends 100 chreia-units, to be repaid as 110 chreia-units in one year. The repayment is to be settled in silver at the prevailing rate on the due date. Over the year, the posted rate of the chreia-unit in silver rises by exactly 10%.*

  In your analysis, address the following:

  (a) Aristotle assigns money two roles in the passages: (i) as a measure enabling proportionate requital (e.g., builder to shoemaker as shoes to house) and (ii) as a circulating medium that can be held and produced later to satisfy future needs. If the chreia-unit performs the measuring role but is not a circulating medium (since payments are in silver), does Aristotle’s account of reciprocal justice require both roles? Explain whether reciprocal justice can function without one of them and why.

  (b) Aristotle states that the real standard of value is demand (chreia), which money represents by convention. Evaluate whether the chreia-unit, defined by a fixed basket of goods for twenty years, is a better or worse representation of demand than silver money, in Aristotle’s own terms. Consider: (i) his claim that demand changes, and if it does, exchange must change or cease; (ii) his admission that commensurability by money is only “sufficiently accurate for practical purposes”; and (iii) his suggestion that prices ought to be fixed. Does Sykaminon’s reform realize Aristotle’s ideal or make reciprocal justice too conventional?

  (c) In *Politics* I, Aristotle condemns tokos (interest) because money, meant for exchange, should not “breed” from itself. Analyze Kleinias’s loan: (i) The contract specifies repayment of 110 chreia-units for 100 lent, a 10% increment in units. (ii) The silver value of the chreia-unit rises 10% over the year, so the silver repaid equals the silver lent (since 110 units at the new rate equals 100 units at the old rate). Does the loan constitute tokos by Aristotle’s criteria? Which of his complaints (denomination in money or actual gain from money itself) applies here? Explain.

  **Instructions:** Write an essay of approximately 700 words. Base your argument solely on the provided texts and the case. No outside sources.

  ---

  **Model Answer (Approx. 700 words):**

  In the case of Sykaminon, Aristotle’s theory of money and exchange faces a novel test. The city’s creation of a chreia-unit as a fixed-basket unit of account, detached from the circulating silver, and the loan contract of Kleinias, require us to examine the core functions of money in reciprocal justice and the nature of usury. I argue that the chreia-unit succeeds as a measure but fails as a stable representation of demand, and that Kleinias’s loan, despite appearances, escapes the charge of tokos only by accident, not by design.

  (a) Aristotle assigns money two essential roles. First, it serves as a common measure that makes goods commensurable, enabling proportionate requital in exchange (NE 1133a). For example, the ratio of builder to shoemaker is expressed through the ratio of their products when measured by money. Second, money acts as a “guarantee of exchange in the future” (1133b) — a circulating medium held now to satisfy future needs. In Sykaminon, the chreia-unit fulfills the measuring role: contracts and prices are denominated in it, allowing for the expression of proportional value. However, it is not a circulating medium; silver staters are. This split raises the question: can reciprocal justice function without both roles being united in one entity? 

  Aristotle’s account requires both. Reciprocal justice depends on commensurability (measure) to establish fair ratios, but it also requires the ability to defer exchange (circulating medium) because needs arise at different times (1133b: “supposing we need nothing at the moment, it ensures that exchange shall be possible when a need arises”). Without a circulating medium, the measure alone cannot guarantee future exchange. In Sykaminon, the chreia-unit provides the measure, but silver (with its fluctuating rate) serves as the medium. This separation introduces instability: the measure (chreia-unit) is fixed, but the medium (silver) varies against it, so the actual silver payment for a fixed chreia-unit debt changes daily. This undermines the “guarantee” function because the value of the silver held today may not match the chreia-unit measure tomorrow. Thus, reciprocal justice is impaired without both roles in one entity, because the measure must be embodied in the medium to ensure stability in deferred exchanges.

  (b) The chreia-unit is defined as a fixed basket of necessaries for twenty years, intended to represent demand (chreia). Aristotle states that the real standard is demand, which money represents by convention (nomos) (1133a: “demand has come to be conventionally represented by money”). However, he emphasizes that demand changes: “if men cease to have wants or if their wants alter, exchange will go on no longer, or will be on different lines” (1133a). The chreia-unit, being fixed for twenty years, cannot reflect such changes. For instance, if the importance of firewood declines relative to grain, the basket becomes outdated. Thus, the chreia-unit is a worse representation of demand than silver, because silver, though “liable to fluctuation” (1133b), at least “tends to be comparatively constant” and adjusts to actual demand through use. Silver’s value is determined by current agreements in the agora, whereas the chreia-unit is fixed by statute. 

  Aristotle admits that money’s commensurability is only “sufficiently accurate for practical purposes” (1133b), implying that perfection is unattainable. He also suggests that “all commodities [should] have their prices fixed” to ensure association (1133b). Sykaminon’s reform attempts this by fixing the basket, but it does so rigidly, ignoring demand’s dynamism. Thus, the reform makes reciprocal justice more conventional and less tied to real demand than even silver money. In Aristotle’s terms, this is a step away from the ideal because it substitutes legal fiction for the practical convention that mirrors actual demand.

  (c) Kleinias’s loan is denominated in chreia-units: he lends 100 units and requires repayment of 110 units after one year. In silver terms, however, because the chreia-unit’s rate rose 10%, the silver repaid (110 units × new rate) equals the silver lent (100 units × old rate). Thus, Kleinias gains nothing in silver. Does this constitute tokos?

  In *Politics* I, Aristotle condemns tokos because money is barren: it is meant for exchange (to procure goods), not to breed from itself. The core complaint is that interest makes gain from the money itself, not from what it procures. Here, the increment in chreia-units (10%) is designed to be gain from the loan, but due to the rate change, it yields no actual gain in silver. Which aspect matters for Aristotle? 

  The denomination is critical. Aristotle’s objection targets contracts where money is lent for more money (Politics 1258b). The form of the contract — repayment of more units than lent — is what he deems unnatural because it treats money as an end. The actual outcome (no silver gain) is accidental; had the rate not changed, Kleinias would have gained 10% silver. Thus, the loan is tokos by form: it attempts to breed money from money. The fact that external factors (the rate change) nullified the gain does not alter the intention. Aristotle’s complaint tracks the contractual denomination: the loan is structured to extract more chreia-units, which are the measure of value. Hence, it violates the principle that money should facilitate exchange, not reproduce itself.

  In conclusion, Sykaminon’s experiment reveals tensions in Aristotle’s theory. The chreia-unit, by splitting measure from medium, destabilizes deferred exchange. Its fixed basket misrepresents demand, making justice more arbitrary. Kleinias’s loan, though accidentally fair, remains usurious in form, exposing the primacy of contractual intention in Aristotle’s critique.

  ---

