  **Scenario:**

  **Setup:** The subject is a 30-year-old man who has been blind since infancy due to dense bilateral cataracts. He undergoes successful cataract surgery and is tested three days after the bandages are removed. During the three days, he is kept in a controlled environment and given basic visual training (e.g., learning to fixate, distinguish light from dark, and detect motion) but is not exposed to any objects that he might handle or see in a way that could associate touch and vision. He is not allowed to touch the test objects until the tests.

  **Step 1: Classic Molyneux Test**
  - The subject is seated at a table in a well-lit room with uniform lighting. Two objects are placed on the table: a matte-black sphere and a matte-black cube (same size, material, and finish). They are positioned so that there are no shadows that might give away the 3D shape (using diffuse lighting). The experimenter is behind a one-way mirror and speaks via intercom to avoid cues.
  - The subject is asked, "Which one is the sphere and which one is the cube?" 
  - *Result:* The subject correctly identifies them on the first try.

  **Step 2: The New Shapes Probe (before surgery)**
  - *Before the surgery*, the subject is taught three new shapes (all unfamiliar and without names) in different ways:
    1. **Handled:** A tetrahedron (matte black, same material). He is allowed to handle it for 5 minutes with his eyes covered.
    2. **Assembled:** An octahedron. With his eyes covered, he is guided (hand-over-hand) to mold clay into an octahedron. He is told the name of the shape only as "Shape B".
    3. **Verbal:** A dodecahedron. With his hands restrained (to prevent simulation), he is given a precise verbal description: "Shape C is a solid with twelve faces, each face is a pentagon. It has twenty vertices, and at each vertex, three pentagons meet." He is then quizzed to ensure he understands the description (e.g., he correctly states it has 30 edges). He never handles it or any model of it.
  - The subject is also taught names for these shapes (arbitrary: "Shape A", "Shape B", "Shape C") to use in the test.

  **Step 2: After Surgery (same as Step 1 timing)**
  - The subject is shown a lineup of five objects: the tetrahedron, octahedron, dodecahedron, and two distractors (a sphere and a cube). All are matte black and of similar size. They are arranged in a random order on the table.
  - The subject is asked: "Point to Shape A, then to Shape B, then to Shape C." 
  - *Critical Measure:* The accuracy and immediacy of the responses.

  **Predictions:**

  - **Shared Representation (A):** The subject will immediately recognize the tetrahedron (handled) and the octahedron (assembled) but will be unable to recognize the dodecahedron (verbal) without counting or other non-immediate methods.
  - **Description Matching (B):** The subject will immediately recognize all three shapes, with the verbal one possibly being the easiest because the abstract description is clean and matches directly.

  **Why the Verbal Condition is Discriminative:**
  - In the shared representation view, the verbal condition does not build a spatial representation (it's only abstract), so it cannot be matched to the visual experience. In the description matching view, the abstract representation is the same regardless of acquisition, so it matches.

  **If we remove the verbal condition:**
  - The test collapses because both stories predict success for handled and assembled. We would not be able to distinguish between them.

  **Objections and Rebuttals:**
  - *Objection (from a shared representation defender):* "The subject might have formed a tactile image from the verbal description, so the verbal condition is not pure."
    - *Response:* We took steps to prevent simulation (restraining hands, complex shape) and tested understanding. Moreover, the immediacy of the response is critical: if the subject has to count the faces, that's not immediate recognition. If the subject immediately points to the dodecahedron, that supports description matching. If not, then shared representation might be supported. But note: the shared representation view does not predict immediate recognition for the verbal condition.

  **Can the case be patched?**
  - We can make the verbal shape even more complex and less symmetric (e.g., a random polyhedron) to reduce the chance of forming a mental image. But the objection might remain. Alternatively, we can use a different modality for the verbal condition: for example, having the subject learn the shape via a tactile map (raised-line drawing) that does not provide 3D information? But that might be a fourth condition and complicate the design. We might have to accept that the verbal condition is the best we can do and that the objection can be addressed by the complexity and the immediacy requirement.

  **Conclusion for the class:**
  "This case shows that even perfect success in the Molyneux test cannot distinguish between shared sensory representations and abstract description matching, and that only by varying the route of representation acquisition can we probe the underlying cognitive architecture."

