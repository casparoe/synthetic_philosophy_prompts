  Hey — I'm a TA for an undergrad course that does early modern philosophy and then jumps straight into a bit of perception science, and I need a case for section next week. We did Molyneux's question last week (man blind from birth, cataracts removed as an adult, a cube and a sphere put on a table in front of him, can he tell which is which before he touches them) and the discussion went exactly the way it always does: half the class said the reports from actual patients settle it, the other half said those reports are a mess and settle nothing, and we went in circles for fifty minutes. So instead of arguing about it again, I want a scenario that shows why the behavioral answer doesn't settle the philosophical question.

  Here's what I need built. One realistic scenario — a hospital room, ordinary props, no implants, no cortical stimulation, no science fiction. The subject is an adult who's been blind since infancy from dense bilateral cataracts, operated on successfully, tested within the first few days. Step one: he has to pass the classic test for real. He's shown the cube and the sphere together, same material and finish, same lighting, sized so nothing about sheen or bulk gives it away, no inadvertent cues from whoever is running it, and he sorts them correctly on the very first trial with no groping around and no practice. Tell me what in the setup earns that result rather than just announcing it. The part I actually care about is step two: I want that success to be completely uninformative. Give me the sophisticated version of the no answer — the one where he does match the shapes right away, but only because vision hands over its own proprietary primitives (edges, shading gradients, disparity, that kind of thing) and something computes an abstract shape description from them, which is then matched against a description touch had already produced. Nothing in the seeing resembles anything he ever felt; the two streams just meet at a format-neutral description, and on that story the yes-behavior is exactly what you'd predict. So the first test can't tell the two stories apart.

  Then build me one further probe inside the same scenario where they do come apart. The lever I want you to try, if you can make it hold: before the bandages come off, teach him several brand-new, name-free shapes by different routes — one he explores with his hands, one he shapes out of clay with his hands guided, one he only ever has described to him in words (precise enough to pin the shape down, never handled, and not something he could quietly convert into a plan for handling it). Then put all of them in a lineup at first sight. My guess is that the shared-representation story predicts the handled and the assembled ones get picked out immediately and the verbally described one doesn't, while the description-matching story predicts they all come out the same, with the verbal one possibly doing best, since the route of acquisition shouldn't matter to a match between descriptions. Tell me if that guess is wrong and design a different probe instead — but whatever you build has to separate the stories for a reason that falls out of the theories, not one I've just decreed. After the scenario I need the check: what each story predicts at each step and why, which single feature of the design is doing the discriminating work and what happens if I remove it (I assume it collapses back into a plain Molyneux test where the yes-behavior is ambiguous, but say it properly), and then the honest part — how someone defending whichever story comes out worse would attack the case, especially the verbal-description route, since I can already hear the objection that hearing about a solid with six square faces just makes you imagine handling one. Say whether the case can be patched against that or whether it's fatal. Finish with one sentence on what I should tell the class the case actually shows. Please write it in American English, and keep it tight enough to read out loud in a fifty-minute section.
