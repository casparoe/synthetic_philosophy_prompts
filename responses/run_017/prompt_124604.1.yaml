  Hmm, the user is a teaching assistant for an upper-level undergraduate seminar on epistemic logic and metaphysics. They need help drafting an exam question about Fitch's paradox that goes beyond just restating the argument. 

  The key challenge here is designing a question that forces students onto unfamiliar ground while remaining self-contained. The user has sketched two maneuvers: (1) epistemic expansion semantics with fixed-base knowability, and (2) denying closure of knowledge under conjunction. But they're unsure if these actually block the paradox or are secretly the same approach.

  I notice three deeper needs beneath the surface request: First, they want to test conceptual understanding rather than rote memorization. Second, they need to resolve their own confusion about the logical relationships between these maneuvers. Third, they're concerned about accessibility - the question must work for students who might have forgotten readings.

  The exam question should accomplish several things: force precise identification of which derivation step each maneuver targets, evaluate motivations beyond paradox avoidance, and assess whether fixed-base knowability preserves the original anti-realist spirit. Including a concrete 2-world model is crucial since students handle models better than abstractions.

  For the model answer, I'll need to clearly show: 
  - How epistemic expansions block the substitution step by restricting knowability to non-epistemic truths
  - Why denying conjunction closure doesn't actually help since Fitch only needs distribution (K→φ ∧ K→ψ)
  - That the first maneuver has independent motivation in anti-realist epistemology while the second creates serious problems for ordinary reasoning
  - That fixed-base knowability already concedes verification-transcendence for epistemic truths

  The marking scheme should reward: correct step identification (5 marks), understanding why inferences fail (5), recognizing independent motivations (4), evaluating anti-realist commitments (4), and model verification (2). Common mistakes will include confusing closure directions and missing that the paradox still threatens epistemic truths.

  A note to the TA: These maneuvers are importantly distinct. The first is a substantive restriction of knowability, while the second is a non-starter that doesn't address the paradox. Students will likely struggle most with seeing why conjunction closure denial fails - I'll emphasize that Fitch's derivation only requires distribution from K(φ∧ψ) to Kφ, not composition from Kφ∧Kψ to K(φ∧ψ).

  The model should be minimal but sufficient: actual world w1 where p is true and known, and an expansion w2 where p is still true and now known, with q true but unknown in both. This lets students test ∀φ(¬Kφ → ◊Kφ) against an epistemic sentence.
answer: |-
  **Exam Question: Fitch's Paradox and Proposed Escapes**  

  **Context:** In Fitch's paradox, we start from two premises:  
  (1) **Knowability Principle (KP):** ∀φ(φ → ◊Kφ) — *"Every truth is knowable"*  
  (2) **Non-Omniscience (NO):** ∃φ(φ ∧ ¬Kφ) — *"Some truth is unknown"*  
  Using modal logic (with **K** for "is known" and **◊** for "is possibly true"), we derive a contradiction: ∃φ(φ ∧ Kφ) (*"Every truth is known"*), violating (NO). The derivation uses two key inference rules:  
  - **Factivity:** Kφ → φ  
  - **Conjunction Distribution:** K(φ ∧ ψ) → (Kφ ∧ Kψ)  

  **Your Task:** Evaluate two maneuvers to avoid the paradox.  

  ---  

  **Maneuver 1: Epistemic Expansions**  
  - **Semantics:** ◊φ is true at world *w* iff φ is true at some *w'* accessible from *w*, where *w'* is an **epistemic expansion** of *w*:  
    (i) Same non-epistemic facts (e.g., if φ lacks **K**, then φ is true at *w* iff true at *w'*),  
    (ii) Everything known at *w* is still known at *w'* (but *w'* may have *more* knowledge).  
  - **Restricted Knowability (Fixed-Base):** ∀φ[(φ ∧ ¬epistemic(φ)) → ◊Kφ]  
    *"Every non-epistemic truth is knowable in some epistemic expansion."*  

  **Maneuver 2: Denying Conjunction Closure**  
  - Reject **conjunction composition**: (Kφ ∧ Kψ) → K(φ ∧ ψ).  
  - Accept **conjunction distribution**: K(φ ∧ ψ) → (Kφ ∧ Kψ).  
  - *Motivation:* Knowledge may not "aggregate" if φ and ψ are tracked via different methods (e.g., sensitivity theories).  

  ---  

  **Concrete Model:**  
  Consider a model with two worlds:  
  - **Actual world (w1):**  
    - Atomic facts: P (true), Q (true)  
    - Knowledge: K¬P is false; KQ is false.  
  - **Epistemic expansion (w2):**  
    - Same non-epistemic facts: P (true), Q (true)  
    - Knowledge: K¬P is false; **KQ is true** (new knowledge).  
  - **Accessibility:** w1 accesses w2 (for Maneuver 1).  
  *Valuation:* At w1: ¬KQ is true.  

  ---  

  **Questions:**  
  1. **Step Identification:** At which *exact step* in Fitch’s derivation (below) does each maneuver block the paradox? Explain why the inference fails under that maneuver.  
     - **Derivation Steps:**  
       (i) Assume φ ∧ ¬Kφ (by NO).  
       (ii) ◊K(φ ∧ ¬Kφ) (by KP).  
       (iii) Suppose K(φ ∧ ¬Kφ) at some world.  
       (iv) By distribution: Kφ ∧ K¬Kφ.  
       (v) By factivity: Kφ ∧ ¬Kφ.  
       (vi) Contradiction.  

  2. **Motivation:** Does each maneuver have philosophical motivation *beyond* avoiding Fitch’s paradox? Justify briefly.  

  3. **Anti-Realist Tenability:** Does "fixed-base knowability" (Maneuver 1) preserve the core anti-realist idea that motivated KP? Or could a realist (who accepts verification-transcendent truths) accept it? Explain.  

  4. **Model Check:** In the concrete model, is the sentence ◊KQ true at w1? Is ◊K(¬KQ) true at w1 under Maneuver 1’s semantics?  

  ---  

  **Model Answer (720 words):**  

  **1. Step Identification**  
  - **Maneuver 1 (Epistemic Expansions)** blocks the paradox at **step (ii)**: ◊K(φ ∧ ¬Kφ).  
    Fitch substitutes the unknown truth *φ ∧ ¬Kφ* into KP. But under fixed-base knowability, KP applies *only* to non-epistemic truths. The formula *φ ∧ ¬Kφ* contains **K**, so it is *epistemic* and excluded from the restricted KP. Thus, step (ii) is invalid.  
    *Why the inference fails:* ◊K(φ ∧ ¬Kφ) is never derivable because φ ∧ ¬Kφ is epistemic, and fixed-base KP only covers non-epistemic truths (e.g., P or Q in the model).  

  - **Maneuver 2 (Denying Conjunction Closure)** does **not block any step** in Fitch’s derivation.  
    The derivation uses **conjunction distribution** (K(φ ∧ ψ) → (Kφ ∧ Kψ)) at step (iv), which Maneuver 2 *accepts*. It rejects only the converse (composition). Fitch’s proof never requires composition; it only needs distribution to extract Kφ and K¬Kφ from K(φ ∧ ¬Kφ). Thus, the paradox proceeds unimpeded.  
    *Why it fails to engage:* Denying composition blocks inferences like "I know P and I know Q, therefore I know (P ∧ Q)", but Fitch requires distributing knowledge *from* a conjunction, not aggregating knowledge *into* one.  

  **2. Motivation Beyond Avoiding Paradox**  
  - **Maneuver 1** has independent motivation. Anti-realists (e.g., Dummett) argue unknowable truths imply realism about meaning. Fixed-base knowability preserves anti-realism for "ground-level" truths (e.g., physical facts) while conceding that *epistemic* truths (e.g., "Q is unknown") may be verification-transcendent. This aligns with hierarchical views of knowledge.  
  - **Maneuver 2** has motivation in sensitivity theories (e.g., Nozick). If knowledge requires tracking truth across worlds, I might know P and know Q via different methods, yet lack a single method to track (P ∧ Q). However, denying composition creates severe problems: I could know I have hands and know I’m not a brain in a vat, but not know their conjunction, undermining everyday reasoning.  

  **3. Anti-Realist Tenability of Fixed-Base Knowability**  
  Fixed-base knowability **fails to preserve** the core anti-realist motivation for KP. Anti-realism holds that *all* truths must be knowable in principle, as truth depends on our capacity to verify. By restricting KP to non-epistemic truths, Maneuver 1 concedes that *epistemic* truths (like "¬KQ") can be unknowable. A realist can accept this maneuver because it allows verification-transcendent truths about knowledge itself. For example, in the concrete model, "¬KQ" is true but unknowable at w1 (since K(¬KQ) would entail ¬KQ, but also K(KQ) if known, violating factivity). Thus, fixed-base KP abandons global anti-realism.  

  **4. Model Check**  
  - ◊KQ is **true** at w1: w2 is an epistemic expansion of w1, and KQ is true at w2.  
  - ◊K(¬KQ) is **false** at w1 under Maneuver 1: ¬KQ is epistemic (contains **K**), so fixed-base KP does not apply. No expansion can make K(¬KQ) true: if K(¬KQ) were true at any world, factivity would force ¬KQ, but knowledge of ¬KQ would require Q to be unknown *at that world*, which may not hold (e.g., at w2, KQ is true, so ¬KQ is false).  

  ---  

  **Marking Scheme (20 marks total)**  
  1. **Step Identification Accuracy** (5 marks):  
     - 5: Correctly identifies step (ii) for Maneuver 1; notes Maneuver 2 blocks *no step*.  
     - 3-4: Identifies step (ii) for Maneuver 1; unclear on Maneuver 2.  
     - 1-2: Misidentifies steps (e.g., claims Maneuver 2 blocks step (iv)).  
     *Common mistake:* Thinking Maneuver 2 blocks distribution.  

  2. **Inference Failure Explanation** (5 marks):  
     - 5: For Maneuver 1, notes epistemic formulas are excluded from KP. For Maneuver 2, notes distribution ≠ composition.  
     - 3-4: Explains one maneuver clearly.  
     - 1-2: Vague appeal to "restrictions" or "closure failure."  

  3. **Independent Motivation** (4 marks):  
     - 4: For Maneuver 1, cites anti-realist hierarchy; for Maneuver 2, cites sensitivity.  
     - 2-3: Partial for one maneuver.  
     - 1: Only "avoids paradox."  

  4. **Anti-Realist Tenability** (4 marks):  
     - 4: Notes fixed-base KP allows unknowable epistemic truths; realist can accept.  
     - 2-3: Partial analysis.  
     - 1: Claims it preserves anti-realism.  

  5. **Model Verification** (2 marks):  
     - 2: Correctly checks ◊KQ (true) and ◊K(¬KQ) (false).  
     - 1: One error.  
     - 0: Both wrong.  

  **A vs. B Distinction:**  
  - **A (17–20):** Precise step identification + why inference fails.  
  - **B (13–16):** Correctly says paradox is blocked (or not) but vague on step/mechanism.  

  ---  

  **Note to TA:**  
  The maneuvers are **independent and distinct**. Maneuver 1 is a semantic restriction on KP via accessible worlds; Maneuver 2 attacks the logic of knowledge. Crucially, **Maneuver 2 does not engage Fitch** since the derivation requires only distribution (accepted), not composition (rejected). Students will likely struggle with:  
  - Why the epistemic status of *φ ∧ ¬Kφ* matters (Maneuver 1).  
  - The distribution/composition distinction (Maneuver 2).  
  - The model’s role in verifying fixed-base knowability (e.g., why K(¬KQ) is impossible).  
  Anticipate confusion between "denying closure" (vague) and specifically rejecting composition. Emphasize that Fitch uses distribution, which Maneuver 2 *does not* challenge. The question is harder than you expect in part (3)—students often miss that fixed-base KP surrenders anti-realism for epistemic truths.
