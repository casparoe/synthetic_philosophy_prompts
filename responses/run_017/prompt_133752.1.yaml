answer: |-
  ## Research Proposal: Supererogation's Hidden Context - Dynamics and Distributive Pressures

  **Project Title:** Beyond the Fixed Background: Dynamic Expectations and the Fragility of Supererogation in Non-Ideal Conditions

  **1. Core Research Question:**
  **How do the actions (or omissions) of others dynamically shape the boundary between duty and supererogation, particularly in contexts of repeated interaction or collective action problems, and what implications does this have for standard two-condition accounts?**

  **Rationale for this Formulation (over the initial two):**
  *   **Unifying Thread:** Both your "Iteration" and "Distribution" cases fundamentally challenge the *stability* of the supererogatory label by introducing *dynamics* – changes over time (iteration) or changes based on collective behaviour (distribution). The core issue is how *contextual shifts*, driven by others' actions, alter the perceived permissibility of omission and the praiseworthiness/merit of performance.
  *   **Focus and Tractability:** While iteration offers a clear temporal dynamic, the distribution case is richer and more directly challenges the core assumptions of supererogation theory in ethically pressing, real-world scenarios (e.g., climate action, charitable giving burdens, workplace fairness). Focusing on "others' actions" encompasses both cases: iteration reveals how *my own past actions* (as context for others' *expectations*) matter, while distribution focuses on *others' concurrent actions*. It provides a clearer lens for examining the "fixed background" assumption.
  *   **Higher Stakes:** The distribution case highlights a potentially perverse consequence of standard views (worse behaviour making ordinary cooperation "heroic"), which is a more significant theoretical and practical problem than the potential "self-eating" of iteration.

  **2. Problem Statement: Why the Standard Account Leaves this Open:**
  Standard supererogation theory relies on a static, two-condition model:
  *   **(C1) Permissible Omission:** Agent A is not morally required/duty-bound to perform act X.
  *   **(C2) Praiseworthy/Meritorious Performance:** Performing X is morally good, exceeding what is demanded.
  These conditions are typically tested against "snapshot" thought experiments (e.g., saving a drowning child at moderate risk, donating a kidney) where:
      *   The agent acts in isolation or against an implicit, unchanging background norm.
      *   The costs/benefits are fixed and individual.
      *   Others' behaviour is assumed constant and compliant (or irrelevant).
  This fixed background obscures how **changing circumstances – especially changes in others' compliance with shared moral expectations – dynamically affect both conditions**:
  *   **C1 (Permissible Omission):** Does widespread non-compliance increase the *demands* on compliant agents, potentially converting previously supererogatory acts into duties? (Distribution pressure). Does repeated performance by an agent raise legitimate expectations, making omission less permissible? (Iteration pressure).
  *   **C2 (Praiseworthiness):** Does performing an act *despite* others' non-compliance (bearing a higher *relative* cost) increase praiseworthiness? Or does the *necessity* of the act in a failing system diminish its "beyond duty" character? Does repeated performance become routine, diminishing perceived merit, or demonstrate steadfast virtue, enhancing it?

  The standard model lacks the conceptual resources to handle these dynamic shifts in expectations, demands, and the normative significance of costs arising from collective context.

  **3. Research Method & Argumentative Moves (Over 3 Months):**

  *   **Month 1: Diagnosis and Ground Clearing:**
      *   **Phase 1a:** Critically analyse canonical definitions and examples of supererogation (e.g., Urmson, Heyd, Mellema, Archer, Dale), demonstrating their reliance on fixed-background assumptions. Systematically categorise how "others' behaviour" is treated (or ignored).
      *   **Phase 1b:** Develop refined versions of the "Distribution" and "Iteration" cases as primary challenges. Articulate the "perverse incentive" worry (Distribution) and the "normative drift" worry (Iteration) precisely.
      *   **Key Argument:** The standard model's abstraction from dynamic social context is not benign; it risks misclassifying acts and generating counterintuitive or morally problematic prescriptions in non-ideal conditions.

  *   **Month 2: Model Building and Analysis:**
      *   **Phase 2a:** Investigate concepts from adjacent fields: **Collective Obligations** (how duties distribute/fail), **Fairness & Fair Shares** (how non-compliance burdens others), **Repeated Games & Norm Evolution** (how expectations form/change over time), **Virtue Ethics** (steadfastness vs. resentment in adverse conditions).
      *   **Phase 2b:** Construct dynamic models:
          *   Model 1: Varying levels of group compliance affecting the cost/threshold for an individual's duty/supererogation boundary.
          *   Model 2: How an agent's past performance shapes others' legitimate expectations and the stability of the "permissible omission" condition.
      *   **Key Argument:** Incorporating dynamic expectations necessitates modifying or supplementing the two-condition model. Possibilities include: introducing a "fair share" baseline for duties; making praiseworthiness sensitive to *relative* cost/effort within the context; or recognising that the *category* of supererogation itself may be contextually fragile.

  *   **Month 3: Implications, Conclusions & Article Drafting:**
      *   **Phase 3a:** Systematically evaluate the implications of the dynamic analysis for core tenets of supererogation theory. Does it require abandoning the two-condition model? Refining it contextually? Or limiting its scope to highly idealised scenarios?
      *   **Phase 3b:** Articulate the distinct possible conclusions (see below). Argue decisively for the most plausible.
      *   **Phase 3c:** Draft the article, integrating diagnosis, models, arguments, and conclusions. Refine the core thesis in light of the analysis.
      *   **Key Argument:** Accounting for dynamic context reveals supererogation as a more contingent, socially embedded phenomenon than previously acknowledged, with significant implications for how we understand moral demandingness, praise, and responsibility in collective settings.

  **4. Possible Conclusions & Deciding Factors:**

  1.  **The Contextual Collapse Thesis:** The two-condition model is fundamentally inadequate for dynamic contexts. Widespread non-compliance or repeated performance often collapses the supererogatory space, converting acts into duties (or potentially, in extreme cases of futility, rendering them irrational/not praiseworthy). *Deciding Factor:* Strength of arguments showing C1 (permissible omission) is unsustainable under pressure; whether alternative categories offer better explanations.
  2.  **The Dynamic Hybrid Model:** The core conditions hold, but their application requires incorporating dynamic factors: (a) The baseline for "duty" incorporates a reasonable expectation of others doing their fair share (making sustained individual burden-bearing supererogatory *despite* the high cost), and (b) Praiseworthiness is amplified by defiance of adverse conditions *or* diminished if the act becomes functionally necessary. *Deciding Factor:* Ability to coherently integrate dynamic factors without abandoning the core intuition behind supererogation; resolving the "perverse incentive" problem satisfactorily.
  3.  **The Scope Limitation Thesis:** The concept of supererogation is only robustly applicable in contexts of relative stability and compliance. In non-ideal, dynamic collective scenarios, different normative concepts (collective duties, obligations of fairness, virtue assessments) are primary, and supererogation becomes marginal or inapplicable. *Deciding Factor:* Whether the modified models (Conclusion 2) succeed or if the phenomena are better explained by other frameworks entirely.

  **5. What a Successful Article Establishes:**
  A successful article will:
  1.  Convincingly demonstrate that standard accounts of supererogation rely problematically on a "fixed background" assumption regarding others' behaviour.
  2.  Systematically articulate and defend the challenges posed by dynamic contexts, particularly distribution and iteration problems.
  3.  Develop a novel, philosophically rigorous analysis of how others' actions dynamically shape the duty/supererogation boundary.
  4.  Establish a significant conclusion (one of the three above) about how supererogation theory must adapt, or its scope limited, in light of this analysis.
  5.  Shift the discourse by making the dynamic and distributive context a central concern for future work on supererogation.

  **6. What Counts as Failure & Feasibility:**

  *   **Failure Conditions:**
      *   The "fixed background" critique is deemed trivial or already adequately addressed in the literature.
      *   The dynamic models developed are unconvincing, overly complex, or fail to resolve the core puzzles satisfactorily.
      *   The analysis doesn't reach a clear, defensible conclusion about the implications for the two-condition model.
      *   The project remains at the level of identifying problems without offering constructive theoretical alternatives.
  *   **Feasibility (3 Months):**
      *   **Tight but Achievable:** This is ambitious for three months. Success hinges on disciplined focus *only* on the core question and avoiding deep dives into tangential areas (e.g., full theories of collective obligation). The key is leveraging existing seminar work and concentrating on building the specific dynamic models for the distribution/iteration cases.
      *   **Honest Assessment:** It's at the upper limit of feasibility. The risk lies in Month 2 (model building) – getting the nuances right takes time. Mitigation: Start with simpler models; prioritise clarity over comprehensiveness; the goal is a *significant contribution* to the debate, not the final word. The article draft will be a substantial advancement on the seminar paper, even if some complexities remain for future work. Prioritise a clear, impactful argument over exhaustive coverage.

  This proposal offers a focused investigation into a critical blind spot in supererogation theory, promising a novel contribution that reframes our understanding of moral boundaries in the socially complex, often non-compliant, real world.
