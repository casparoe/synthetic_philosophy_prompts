answer: |-
  Here’s a concise diagnostic instrument designed for your interactive feature, structured to map readers onto key positions in the politics of artifacts without naming theories. The tree prioritizes **four load-bearing questions** that isolate core distinctions, with cases rewritten to avoid parables.

  ---

  ### **Diagnostic Questions**  
  *(8 questions, ≈4 mins)*  

  1. **Shared Thermostat**  
     A smart thermostat in a shared home adapts to one tenant’s schedule but ignores others’.  
     *Verdict:*  
     - (A) **Unfair design** – It embeds bias by default.  
     - (B) **Fixable flaw** – Reset it or add manual controls.  

  2. **Hospital Shift App**  
     An app lets nurses drop shifts instantly but blocks offering them to specific colleagues.  
     *Verdict:*  
     - (A) **Sabotages solidarity** – Prevents worker cooperation.  
     - (B) **Efficiency trade-off** – Necessary for staffing stability.  

  3. **School Laptop Webcam**  
     A school-issued laptop allows administrators to remotely enable its webcam without a student’s knowledge.  
     *Verdict:*  
     - (A) **Invasive by design** – The feature itself enables abuse.  
     - (B) **Misuse risk** – Only harmful if administrators act unethically.  

  4. **Low Bridge Proposal**  
     A city plans a low-clearance bridge on a key route. Critics say it will block buses (used by low-income commuters); engineers say it’s cheaper and suits most cars. *[Contested history: "Bus block" may be unintended.]*  
     *Verdict:*  
     - (A) **Exclusionary outcome** – Ignores vulnerable users.  
     - (B) **Practical compromise** – Design reflects budget realities.  

  5. **Cooperative Delivery App**  
     A worker-owned app designed to flatten hierarchy now lets couriers rank each other’s punctuality, creating informal competition.  
     *Verdict:*  
     - (A) **Betrayal of intent** – Tools distort social goals.  
     - (B) **User-driven shift** – People repurpose all tools.  

  6. **Self-Checkout Aisles**  
     A supermarket replaces cashiers with self-checkouts. Shoplifting rises, and elderly customers struggle.  
     *Verdict:*  
     - (A) **Hostile redesign** – Prioritizes profit over people.  
     - (B) **Adjustment period** – Society will adapt to efficiency.  

  7. **Fleet Vehicle Speed Governors**  
     Delivery vans have GPS-enforced speed limits in school zones. Drivers complain it extends shifts; parents say it saves lives.  
     *Verdict:*  
     - (A) **Coercive control** – Removes driver autonomy.  
     - (B) **Neutral safety tool** – Depends on company policies.  

  8. **Open-Source Moderation Tool**  
     A community-built forum tool gains features that silence niche viewpoints. Users debate: is this censorship or necessary filtering?  
     *Verdict:*  
     - (A) **Bias in code** – Rules embed exclusion.  
     - (B) **Community choice** – Users define its politics.  

  ---  
  ### **Key Design Notes**  
  - **Population-scale politics (Q6):** Self-checkouts only reveal equity impacts at scale (job loss, exclusion).  
  - **Prevention complaint (Q7):** Speed governors primarily *prevent* speeding; harm is restricted agency.  
  - **Canonical rewrites (Q4/Q5):** Framed as live debates, not resolved parables.  

  ---  
  ### **Scoring Key & Position Mapping**  
  *(Based on 4 load-bearing questions: Q1, Q3, Q5, Q6)*  

  | **Position**                          | **Core Distinction**                                                                 | **Answer Pattern**                     | **Consequence to Swallow**                               |  
  |---------------------------------------|-------------------------------------------------------------------------------------|----------------------------------------|----------------------------------------------------------|  
  | **Neutral Instruments**               | Politics belongs *only* to users’ ends.                                             | B in Q1, Q3, Q5; A/B in Q6             | Artifacts enable atrocities if users choose.             |  
  | **Autonomous Driver**                 | Tech drives social change inevitably.                                               | A in Q4, Q6; B in Q5                   | Luddite resistance is futile.                            |  
  | **Inherently Political**              | Technical arrangements *require* specific social orders.                            | A in Q1, Q3, Q4; A in Q6               | "Good" uses still uphold harmful systems.                |  
  | **Development-Process Politics**      | Politics is in *design choices*, not the object.                                    | A in Q1, Q3; B in Q5, Q8               | A "good" process can create harmful tools.               |  
  | **Social Construction**               | Meaning stays open until communities "close" it.                                    | B in Q1, Q5, Q8; A in Q2               | Nazis could repurpose a anti-racist tool.                |  
  | **Delegated Relations**               | Artifacts are "frozen" social relations (e.g., class).                              | A in Q2, Q6; A in Q7                   | Destroying a tool destroys social progress.              |  
  | **Critical Theory Code**              | Encodes hierarchy but can be rewritten by the oppressed.                            | A in Q2, Q5; B in Q8                   | Revolution requires technical expertise.                 |  
  | **Feminist-STS**                      | Gendered/racial hierarchies built into ergonomics & design.                         | A in Q1, Q3; A in Q7                   | "Ergonomic" designs can perpetuate bias.                 |  
  | **Postphenomenological**              | Artifacts mediate *how* we perceive moral choices.                                  | A in Q3, Q7; B in Q4                   | Self-driving cars redefine "responsibility".             |  
  | **Hostile Design as Harm**            | The artifact itself inflicts violence; removal > redesign.                          | A in Q3, Q6; A in Q7                   | Banning life-saving tech if it controls bodies.          |  

  **Tie-Break Rule:** Resolve ambiguities via Q2 (Hospital App). A → **Delegated Relations**; B → **Social Construction**.  

  **Weights:** Q1 (thermostat) and Q6 (self-checkout) carry 2x weight for distinguishing determinism vs. neutrality and scale-dependence.  

  ---  
  ### **Flowchart for Print Edition**  
  ```  
  START  
  │  
  ├── Q1: Thermostat → A? → Feminist-STS / Inherently Political path  
  │                   └── B? → Neutral Instruments / Social Construction path  
  │  
  ├── Q3: Laptop Webcam → A? → Critical Theory / Hostile Design path  
  │                      └── B? → Development-Process / Autonomous Driver path  
  │  
  ├── Q5: Cooperative App → A? → Delegated Relations / Inherently Political path  
  │                       └── B? → Neutral Instruments / Postphenomenological path  
  │  
  └── Q6: Self-Checkout → A? → Hostile Design / Inherently Political path  
                        └── B? → Autonomous Driver / Development-Process path  
  ```  
  *Final position combines dominant paths + Q2 tie-break.*  

  ---  
  ### **Editor’s Note**  
  - **Heaviest Sorting Questions:** **Q1 (Thermostat)** isolates *design-intention resilience*; **Q6 (Self-Checkout)** isolates *scale-dependence*.  
  - **"Unanswerable" Complaint:** Expect pushback on **Q4 (Low Bridge)**. Readers will demand traffic data or equity studies to decide. Lean into this – it underscores *uncertainty*.  
  - **Indistinguishable Pair:** **Critical Theory Code** vs. **Delegated Relations** collapse when users override design (Q5). To separate them, add: *"A factory robot programmed to slow during union meetings but workers hack it to speed up instead."* Critical Theory sees hack as resistance; Delegated Relations sees the *original code* as the frozen conflict.  
  - **Unoccupied Cells:** "Politics in production *and* determinism *and* irreparable harm" is incoherent (determinism negates reparability). "Neutrality *and* social construction" is coherent but rare (users define meaning, but tool is blank).  

  ---  
  This instrument forces readers to judge *cases*, not theories. The e-scooter example (firmware/contract/scooter) will resonate with their diagnostic result, showing how artifacts crystallize power – without ever naming Latour or Winner.
