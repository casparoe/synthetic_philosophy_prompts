  Judge rules against Vance because Pryor's points are verifiable while Vance's objection feels vague. Even with double time or cross-examination, Pryor's branches remain "exhaustive" on paper. Only shifting burden works: if Pryor had to list ALL failure modes, fatigue would appear. 

  The core is Pryor controlling the framework. Remove that, and Vance wins by naming fatigue upfront. Debate purists might say Vance should've shouted "FATIGUE!" louder, but in practice, Pryor's structure drowns it out. 

  User’s constraints are brutal—especially symmetry and truthfulness—but that’s why it’ll work. They’ll spot cheats. Gotta make every line land.
answer: |-
  Here’s your scene, built to spec:

  **1. Setup**  
  At St. Vincent’s Hospital, Nurse Anya Petrova faces suspension for allegedly botching an emergency intubation during a cardiac arrest, leading to a 90-second oxygen delay. The Credentialing Committee, chaired by retired judge Helen Rossi (sharp, meticulous, with one hour blocked), must decide if Anya violated protocol. Dr. Leo Vance (Anya’s advocate, earnest intensivist) argues it was unavoidable. Dr. Sarah Pryor (hospital risk management, polished and "principled") demands accountability. The record includes CT scans, ventilator logs, nursing notes, and a 30-second video snippet.

  **2. The Trick**  
  Pryor structures her case as an exhaustive trilemma: *"Only three factors cause failed first-pass intubation: Abnormal anatomy, Technical error, or Equipment failure. We’ll disprove all three."* The truth—microtremors from Anya’s undiagnosed hypoglycemia due to back-to-back shifts—is omitted. Pryor never lies but boxes Vance into her false framework.

  **3. Pryor’s Moves (All Verifiably True)**  
  - **Move 1:** *"First, anatomy. The CT scan shows normal airway structure—no tumors, stenosis, or deformity. Page 4, radiologist’s note."*  
    *Judge checks:* Scan annotation: "Unremarkable tracheobronchial tree." **True.**  
  - **Move 2:** *"Second, technique. The video shows correct blade insertion angle and tube advancement. Timestamp 03:15-03:45."*  
    *Judge checks:* Video snippet: Blade at 45°, tube advancing smoothly. **True.**  
  - **Move 3:** *"Third, equipment. Ventilator logs confirm full functionality pre- and post-event. Maintenance sign-off here."*  
    *Judge checks:* Logs show "SYSTEM CHECK: OK" at 02:58 and 04:30. **True.**  
  *Conclusion:* *"No valid explanation remains. This was preventable negligence."*

  **4. Vance’s Objection & Symmetry**  
  Vance: *"You’ve ignored physiological factors—fatigue, tremor—"*  
  Pryor (interrupting smoothly): *"Doctor, if you’re suggesting some *unseen* factor, the burden is on you to prove it exists. We’ve covered the concrete possibilities."*  
  *Symmetry:* Vance *could* say Pryor ignored factors too, but Pryor’s framework dominates. Proving microtremors requires cross-referencing Anya’s glucose log (buried in HR files) with neurology literature on hypoglycemic tremors—a 20-minute dive Judge Rossi won’t attempt.

  **5. Judge’s Reasoning**  
  Rossi thinks: *"Pryor dismantled every category cleanly. Vance seems sincere but vague—‘physiological factors’ could mean anything. Pryor’s points are document-backed; Vance’s feels like special pleading. Protocol requires clear evidence of exoneration, and he offered none."* She rules for suspension, satisfied she applied the rules fairly with limited time.

  **6. Failed Repairs**  
  - **Double time:** Pryor’s structure still frames the debate. Vance mentioning "glucose" prompts Pryor to demand proof. Rossi won’t hunt through HR databases unguided.  
  - **Cross-examination:** Vance: *"You listed only three causes. What about operator physiology?"*  
    Pryor: *"Operator error falls under ‘Technical’—which I disproved. If you mean something else, specify it."* Vance can’t prove hypoglycemia without documents outside the record.  

  **7. Working Repair: Shift the Burden**  
  *Revised rule: The accuser must list ALL plausible failure modes upfront.*  
  Pryor: *"Causes are: Anatomy, Technique, Equipment—"*  
  Vance: *"And operator physiology. Fatigue or metabolic stress?"*  
  Pryor (forced): *"...Possibly, but unproven."*  
  Judge Rossi: *"Dr. Pryor, does your case account for this category?"*  
  Pryor now must *disprove* physiology or concede incompleteness. The gap is exposed.

  **8. The Honest Bit & Collapse Points**  
  **Core feature:** Pryor controls the *taxonomy* of causes. The judge checks *truth within branches* but not *completeness of branches*.  
  - **If truth sat inside a named branch:** Vance wins. If Pryor included "Physiology," Vance could say "Hypoglycemia!" and force scrutiny.  
  - **If burden on positive claim (Vance):** Pryor wins easier—Vance can’t prove hypoglycemia fast.  
  **Debate-purist counter:** *"Vance should yell ‘HYPOGLYCEMIA!’ louder."*  
  **Why it fails:** In Rossi’s eyes, Vance *did* gesture vaguely at "physiology." Pryor reframed it as unserious ("unseen factor") without evidence. Without the *specific mechanism and its proof* (glucose logs), Rossi dismisses it as hand-waving. Pryor’s trilemma looks scientific; Vance’s interruption looks desperate.

  **Dialogue to Steal**  
  - Pryor: *"Three doors, Your Honor. We’ve locked them all. Nothing left but accountability."*  
  - Vance: *"You’re ignoring the air vents! She couldn’t hold the tube steady—"*  
  - Pryor (calmly): *"Doctor, if the tremors were visible, why aren’t they in the video? If they weren’t, why should we invent them?"*  

  **Why It Works**  
  - **Pryor isn’t lying:** She believes narrowing causes to "objective" factors is rigorous. Risk management *is* her job.  
  - **Judge isn’t foolish:** She verified each step. The gap isn’t obvious without specialized knowledge (how hypoglycemia causes tremors) and data mining.  
  - **Symmetry holds:** Both can say "you missed something," but Pryor’s structure makes Vance’s *feel* speculative.  
  - **Stakes:** Anya’s career; the hospital avoids liability.  
  - **No swap:** Vance lacks Pryor’s rhetorical discipline. He’d never build such a cage.  

  This is obfuscation, not fraud. Pryor wins by making the truth *inconvenient* to prove, not by lying. The judge’s time, the rules, and Pryor’s framing do the rest.
