  **Argument Tracking Through Rotation:**

  1. **Stanza 1 (seem, red, pain, nothing, word, know):** Establishes the naive realist datum: undeniable seeming, vivid qualia (red, pain), knowledge, and the dismissal of "nothing" as irrelevant. The "word" is unproblematic.
  2. **Stanza 2 (know, seem, word, red, nothing, pain):** Introduces the illusionist challenge: what does "know" really assert? The "word" might label a function, "red" and "pain" might be signals where science finds "nothing" intrinsic. The seeming remains.
  3. **Stanza 3 (pain, know, nothing, seem, word, red):** Focuses on representation: "pain" as a report/"word" generated by the system. The seeming ("seem") is acknowledged but separated from intrinsic properties ("nothing"). "Red" is the concept built.
  4. **Stanza 4 (word, pain, red, know, nothing, seem):** Addresses the persistence of seeming ("seem") despite the theory. The "word" still fits the functional state ("pain", "red"). The explanation changes "nothing" about the experience, even as we "know" the account.
  5. **Stanza 5 (red, seem, know, word, pain, nothing):** Confronts the self-consuming diagnosis: The "red" persists, the seeming ("seem") remains untouched by the dismantling "word". The theory ("know") is itself an output of the mechanism it describes, changing "nothing" phenomenally. "Pain" is still reported.
  6. **Stanza 6 (nothing, red, pain, seem, word, know):** Synthesizes the functionalist core: Finds "nothing" behind the curtain. "Red" and "pain" are useful fictions. The seeming ("seem") persists. The "word" works. The system must "know" (acknowledge/use) its own story.
  7. **Envoy (know, word, pain, red, seem, nothing):** Enforces the non-concession: Uses "know" and "word" actively. Affirms "pain" and "red" as valid reports/concepts stripped of intrinsic properties ("nothing"). Crucially, "seem" is positioned as the *engine's output* ("seeming engine"), not a phenomenal state, making "nothing" (no intrinsic property) while producing the seeming. The words function without smuggling.
