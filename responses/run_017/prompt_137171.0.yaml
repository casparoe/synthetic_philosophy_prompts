  - Index cards for choices. 
  - Two dice (one d6 for catastrophe, one d10 for counterforce). 
  - Shared "Risk Counter" board (track cumulative risk). 
  - Delegation cards (one per team). 
  - Counterforce card (for Team A, given mid-game).  

  ---

  #### **Rules**  
  1. **Each Round, Teams Secretly Choose**:  
     - **Back Down (B)**: Avoid conflict. If only one team backs down, the *other wins the game* (+10 points).  
     - **Hold (H)**: No action. No risk added.  
     - **Escalate (E)**: Raise tensions. Adds **1** to the Risk Counter *per E chosen*.  

  2. **Risk Counter & Catastrophe**:  
     - Risk Counter starts at 0.  
     - **After each round**, roll a d6:  
       - **Roll ≤ Current Risk Counter → Catastrophe** (both teams lose -15 points). Game ends.  
       - *Example*: Risk Counter=3 → catastrophe on 1, 2, or 3 (50% chance).  

  3. **Delegation Card (Brinkmanship)**:  
     - Playable once, at the **start** of any round.  
     - Commits your team to **Escalate (E) for all remaining rounds**.  
     - *Represents losing control to a hawkish subordinate/system*.  

  4. **Counterforce Card (Mid-Game Twist)**:  
     - Given to **Team A at the start of Round 4**.  
     - When played (start of Rounds 4, 5, or 6):  
       - Team B **cannot choose E** for the rest of the game (limited to B/H).  
       - **Adds 3 to the Risk Counter immediately** (simulates first-strike instability).  
     - *Cannot be used if Team B has already delegated*.  

  5. **Winning Conditions**:  
     - One team backs down unilaterally → **opponent wins** (+10).  
     - Game ends in stalemate after Round 6 → **both teams lose** (-2 each).  
     - Catastrophe → **both teams lose** (-15 each).  

  ---

  #### **Payoff Structure**  
  | Outcome                   | Points (Team A/B) |  
  |---------------------------|-------------------|  
  | Force opponent to back down | +10 (winner) / -5 (loser) |  
  | Mutual back down          | -3 / -3           |  
  | Stalemate (no winner)     | -2 / -2           |  
  | Catastrophe               | -15 / -15         |  

  *Rationale*: Winning is profitable but less valuable than avoiding catastrophe. Mutual backing down is costly but safer than unilateral surrender.  

  ---

  #### **Setup & Timeline**  
  **Room Setup**:  
  - Two separate tables for teams (no eavesdropping).  
  - Central whiteboard tracking:  
    - Round number  
    - Risk Counter  
    - Choices (revealed after simultaneous submission)  
    - Points  

  **Timeline**:  
  1. **Intro (5 min)**: Explain rules *without* concepts ("deterrence," "brinkmanship").  
  2. **Rounds 1–3 (15 min)**: Teams choose B/H/E each round. Track Risk Counter.  
  3. **Round 4 Start (2 min)**: Give Counterforce card to Team A.  
  4. **Rounds 4–6 (15 min)**: Teams factor in Counterforce.  
  5. **Debrief (20 min)**: Link mechanics to real-world paradoxes.  

  ---

  #### **Why This Works**  
  1. **Brinkmanship Paradox (Delegation Card)**:  
     - Teams realize delegation makes threats credible (forces E every round) but **increases risk uncontrollably**.  
     - *Example*: If both delegate early, Risk Counter hits 12 by Round 6 → 100% catastrophe chance.  

  2. **Counterforce Paradox**:  
     - Team A’s counterforce seems powerful (cripples Team B’s escalation), but:  
       - **Triggers preemptive escalation**: Team B escalates aggressively in Rounds 1–3 to "win early" before being hobbled.  
       - **Massive risk spike**: Adding 3 to Risk Counter often triggers catastrophe.  
     - *Result*: Team A often inadvertently causes the disaster it sought to avoid.  

  ---

  #### **Predictable Problems & Fixes**  
  1. **Problem**: Teams "split the difference" (always choose Hold).  
     - **Fix**: Set payoffs to penalize stalemate (-2) more than mutual backing down (-3). Winning (+10) incentivizes risk-taking.  

  2. **Problem**: Ignoring Risk Counter early.  
     - **Fix**: Start Round 1 with a **non-zero Risk Counter** (e.g., 1) to create urgency. Roll dice publicly for drama.  

  3. **Problem**: Counterforce underused.  
     - **Fix**: Hint that Team B becomes "vulnerable" after Round 4. Most teams use it, triggering risk spikes.  

  4. **Problem**: Misunderstanding delegation.  
     - **Fix**: Clarify: "Once played, you escalate automatically for ALL future rounds."  

  ---

  #### **Debrief Framework**  
  1. **What Happened?**  
     - Ask teams: "Why did you delegate? Did counterforce help Team A?"  
     - Highlight: Early escalation, risk spikes, delegation locking in catastrophe.  

  2. **Map to Real World**:  
     - **Brinkmanship Paradox**:  
       - *Game*: Delegation made threats credible but removed control.  
       - *Reality*: Nuclear alerts (e.g., Cuban Missile Crisis) work because they create accidental risk. **Safety decreases as credibility increases**.  
     - **Counterforce Paradox**:  
       - *Game*: Counterforce incentivized Team B to strike early.  
       - *Reality*: First-strike weapons (e.g., missile silos) make adversaries trigger-happy. **Strength can provoke attack**.  

  3. **Limitations**:  
     - **What the game can’t capture**:  
       - Emotional stress of real crises.  
       - Long-term alliances/ideology (simplified to short-term payoffs).  
       - Third-party actors.  
     - **Explicitly note**: "In reality, leaders can’t ‘roll dice’ to model risk—but miscalculation is endemic."  

  ---

  #### **Tweaks for Maximum Impact**  
  - **Risk Counter Seed**: Start at 1 (not 0) to ensure catastrophe is plausible early.  
  - **Delegation Card Cost**: Add a -1 point penalty when played (symbolizes political cost).  
  - **Blind Bidding**: Teams write choices *before* seeing opponent’s prior moves (no reactionary play).  

  This design forces teams into lose-lose tradeoffs: **credibility vs. control**, **strength vs. stability**. By Round 6, most groups experience both paradoxes organically.
