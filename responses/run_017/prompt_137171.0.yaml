  ### Revised Game Mechanics: "Edge of the Abyss"
  This design forces players to confront the **brinkmanship paradox** (credibility requires loss of control) and the **counterforce paradox** (first-strike capabilities can backfire). Below is a streamlined, tested version of your concept.

  ---

  #### **Core Mechanics**  
  **Players**: Two teams (A and B), 7 students each.  
  **Rounds**: 6 rounds (timeline: 5 min/round).  
