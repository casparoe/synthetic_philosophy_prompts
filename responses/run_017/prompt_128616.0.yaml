prompt: |-
  I've been arguing with my roommate about norms of assertion for like a week now (she's in a philosophy PhD program, I'm just a med student who got nerdsniped), and we ended up on the early-2020 US mask guidance, and I genuinely can't tell whether the case is doing any real work or whether we're just using it as a proxy for our politics. So here's the ask. Take the February–March 2020 statements by senior US public health officials -- the Surgeon General's late-February tweet telling people to stop buying masks, and Fauci saying on camera that masks weren't especially effective for the general public -- and analyze them as assertions governed by a norm. Stipulated facts, and please don't relitigate the history or turn this into a take on covid politics: (a) at the time they said it, they did not believe the literal proposition the public took away, i.e. that masks offer the wearer no protection worth caring about; (b) they said it substantially because they were worried about the public buying up the supply that hospitals needed, and they expected the literal claim to work better at stopping that than an honest explanation about allocation would have; (c) within a few weeks the guidance reversed, recommending cloth face coverings, and by then there was real accumulating evidence about asymptomatic transmission -- though whether that amounted to knowledge at the moment of the reversal is exactly the sort of thing I want you to be careful about.

  What I want is a disciplined mapping, not a vibe. What exactly is being asserted: a factual claim about mask efficacy, a directive about what to do, or a claim about what the audience has reason to do -- and does the answer change which norm even applies? Who is the audience in the sense the theories need, given that these are broadcasts to millions of people with wildly different epistemic situations and different things they'll go do with what they hear, rather than utterances to one addressee in a conversation? Whose epistemic state is the one that's supposed to matter: the individual's, or the institution's, since the person speaking is simultaneously a private believer and the voice of an evidence base he only partly has in his head? Then the part I actually care about. My worry is that the case is a dud: if he didn't believe what he said, then the knowledge norm, the truth norm and the reasonable-belief norm all say the assertion was impermissible, and the episode doesn't discriminate between them at all. Tell me whether that's right, and if it is, what you'd have to change -- or which other moment in the same episode, maybe the April reversal where he did believe it -- to turn it into a case that actually separates the theories.

  Then run it the other direction: what does the episode do to the theories anyway, even granting that it doesn't separate them? Does it show they're too focused on the speaker's belief, too individualistic, in need of a blame norm stacked on top of a correctness norm? Or does it expose a whole class of utterance -- call them guardrail statements, where you say what you don't believe in order to head off a downstream harm you can clearly foresee -- that epistemic norms were never built to cover, so that they aren't violated so much as simply overridden by something outside the theory? My roommate's fix was a reliance norm: you may assert p only if it's reasonable for your actual audience to rely on p as a premise in the deliberations you can foresee them making. The obvious objection I see is that it lets you lie to people who won't rely on you; give me the strongest objection I haven't thought of, and tell me whether her norm just collapses into the belief norm once you spell out what "reasonable" is doing. Also say plainly where all of this goes silent -- I'd much rather you tell me the theory has nothing to say about some piece of this than watch you stretch it to cover everything. No reading lists or citations, I can't get the papers anyway. And at the end, put a confidence marker on each of your main claims rather than hedging all of them equally -- give me the one you'd actually bet on -- and then single out the single point you're least sure of, and say what would change your mind about it.
reasoning: |-
  Okay, let me unpack this user's request. They're a med student locked in a philosophy debate with their PhD roommate about the ethics of public health messaging during early COVID. The core question is whether the mask guidance case can illuminate norms of assertion, or if it's just political proxy war. 

  First, I need to map the stipulated facts carefully: officials knowingly downplayed mask efficacy in Feb-March 2020 to preserve supply, didn't believe their literal claims, and reversed when evidence emerged. The user wants strict analysis - not COVID relitigation. 

  Hmm... the tricky part is diagnosing why this case feels unsatisfying. They're right that all standard norms (knowledge, truth, reasonable belief) condemn the assertion equally here. So it doesn't discriminate between theories. But maybe that's the point? The case exposes how these norms assume individual speakers addressing individuals, not institutions speaking to masses during crises. 

  For the reversal in April, when Fauci did believe masks worked - that might better test norms. If he asserted without sufficient evidence then, knowledge norms would condemn it while reasonable belief might excuse it. But the user's roommate's "reliance norm" idea... that's clever but dangerous. It could justify lying to irrational audiences. And "reasonable" risks circularity - doesn't it collapse back to what the speaker believes about audience reasonableness? 

  The institutional angle feels crucial here. When the Surgeon General tweets, is he asserting personal views or channeling CDC consensus? Epistemic norms might just nope out entirely - this isn't assertion but institutional speech acts. 

  My least confident point is about "guardrail statements." Maybe they're not assertion-norm violations but a different category where epistemic norms get overridden by consequentialist ethics. But that feels like cheating - the user wants norms stretched, not dodged. 

  Final thought: This case doesn't break norms as much as expose their limits. For public health crises, we need different rules - perhaps a "crisis communication norm" incorporating expected social consequences. But that's beyond philosophy's scope. The confidence markers will show where I'm shaky.
answer: |-
  Here’s a disciplined mapping of the case against assertion norms, avoiding political relitigation and focusing on your stipulations. I’ll flag key uncertainties and confidence levels throughout.

  ---

  ### **1. What Was Asserted?**  
  - **Literal content**: Factual claims about mask efficacy (e.g., "masks are not effective in preventing general public from getting coronavirus").  
  - **Pragmatic content**: A directive ("do not buy masks") or a claim about reasons ("you have no reason to buy masks").  
  - **Why it matters**:  
    - If purely *factual*, norms like knowledge/truth apply.  
    - If *directive*, it might be governed by practical (not epistemic) norms (e.g., "give useful advice").  
    - **Verdict**: Officials framed it as factual claims (not "please save masks for hospitals"), so epistemic norms apply. *Confidence: 95%*  

  ---

  ### **2. The Audience Problem**  
  - **Mass audience challenge**: Unlike conversational assertions, here the audience is heterogeneous (varying vulnerability, access to masks, trust in science).  
  - **Which norm applies?** Most theories treat mass assertions as aggregating individual addressees. The "reasonable audience member" is the default (e.g., a typical person likely to hoard masks).  
  - **Whose epistemic state?** Institutional assertions blend the speaker’s belief + institutional evidence base. Norms typically prioritize the *speaker’s access to evidence* (here, Fauci knew more than the public but less than the CDC’s full dataset).  
  - **Verdict**: Norms focus on the speaker’s responsibility given their institutional role. *Confidence: 85%*  

  ---

  ### **3. Why the Case is a Dud for Discriminating Norms**  
  - All major norms condemn the February assertions:  
    - **Knowledge norm** (assert only what you know): They knew masks had *some* efficacy (stipulation *a*).  
    - **Truth norm** (assert only truths): The literal claim was false (masks offered non-zero protection).  
    - **Reasonable belief norm** (assert only what you reasonably believe): They lacked reasonable belief in the literal claim.  
  - **Result**: The case fails to distinguish between norms—all agree it was impermissible. *Confidence: 98%*  

  ---

  ### **4. How to Fix the Case to Test Norms**  
  **Use the April 2020 reversal** (recommending cloth masks):  
  - *Scenario*: Fauci asserts "cloth masks are effective" based on emerging but incomplete evidence of asymptomatic spread.  
  - *Test*:  
    - If he *knew* it was effective → permissible by knowledge norm.  
    - If evidence was preliminary but he *reasonably believed* it → reasonable belief norm permits it; knowledge norm may not.  
  - *Why it works*: Separates "reasonable belief" (evidence-based but fallible) from "knowledge" (requires certainty). *Confidence: 90%*  

  ---

  ### **5. What the Episode Reveals About Assertion Norms**  
  - **Limitations exposed**:  
    - **Over-focus on belief**: Norms ignore *institutional roles* (e.g., a CDC director asserts based on consensus, not personal belief).  
    - **Consequential blind spot**: Norms don’t weigh downstream harms (e.g., hospital shortages) that might override epistemic permissibility.  
  - **Guardrail statements**: These may be a distinct category (e.g., "lie to prevent panic/hoarding"). Epistemic norms *don’t cover them*—they’re governed by ethical/practical norms, not truth-tracking.  
    - *Implication*: Assertion norms are silent when speakers prioritize social good over sincerity. *Confidence: 80%*  

  ---

  ### **6. Critique of the "Reliance Norm"**  
  Your roommate’s proposal:  
  > *"Assert p only if it’s reasonable for your actual audience to rely on p in foreseeable deliberations."*  

  - **Strongest objection**: It permits *exploiting unreasonableness*.  
    - Example: If the audience is irrationally panicked (e.g., "they’ll ignore nuanced advice"), you could "lawfully" assert false claims to manipulate them. This rewards epistemic vice.  
  - **Collapse into belief norm?**  
    - If "reasonable" means *the speaker’s judgment of audience reasonableness*, it becomes subjective and circular.  
    - If "reasonable" is objective, it’s unworkable—speakers can’t assess millions of strangers’ epistemic states.  
  - **Verdict**: It either collapses into the belief norm or licenses paternalistic deception. *Confidence: 85%*  

  ---

  ### **7. Where Theories Go Silent**  
  - **Institutional speech**: Norms assume individual speakers, not agencies. No theory handles "speaking for an evidence base."  
  - **Crisis communication**: When harms (e.g., shortages) outweigh sincerity, epistemic norms are overridden—this is ethical/political, not assertion-theoretic.  
  - **Mass audiences**: Norms can’t address variable reliance (e.g., a nurse vs. a recluse hearing the same tweet).  

  ---

  ### **Confidence Marker**  
  - **Highest confidence (98%)**: The Feb 2020 case doesn’t discriminate between truth/knowledge/reasonable belief norms.  
  - **Lowest confidence (65%)**: That "guardrail statements" are categorically outside assertion norms.  
    - *What would change my mind*: A unified account showing how expected consequences factor into epistemic permissibility (e.g., a "weighted" norm balancing harm + sincerity).  

  ---

  ### **Conclusion**  
  The episode highlights gaps in assertion theory: norms are individualistic, ignore institutional roles, and lack tools for crisis trade-offs. To test norms, use the April reversal. Your roommate’s reliance norm risks legitimizing manipulation. Ultimately, **theories are silent on guardrail statements**—they belong to ethics, not epistemology.  

  *Final bet*: The core failure is that assertion norms assume sincerity is paramount, but public health officials must sometimes prioritize welfare over literal truth. This isn’t a norm violation—it’s a different game.
