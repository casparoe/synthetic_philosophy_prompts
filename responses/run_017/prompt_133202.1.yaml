  For candidate procedures, uniform distribution (U) gives constant hazard 1/5, while geometric (G) gives constant 1/2 hazard until Friday. The key mathematical task is finding which distribution maximizes min_d h(d) or alternative surprise metrics while satisfying the constraints.

  The paradox manifests differently under each surprise definition:
  - (C) occurrent credence: Hazard-based, leads to backward collapse
  - (A) attainable success at time: Also backward-induction prone
  - (E) ex-ante attainable success: Avoids immediate collapse but has dynamic inconsistency issues

  I'll need to compute the maximum achievable surprise probability under (C) and (A), which mathematically reduces to solving min_d h(d) ≤ 1/2 with Σp=1. The geometric distribution achieves 0.5 surprise probability, but I should check if this is optimal.

  For the game-theoretic aspect, the teacher's payoff creates tension between surprise probability and deferral bonus. Under (C)/(A), geometric distribution yields expected payoff 0.5 + 0.2 = 0.7. I should verify if better distributions exist.

  The ex-ante perspective (E) introduces interesting complications - while it avoids the backward induction, the student's best-laid plan may unravel upon reaching later days. This connects to deep issues in dynamic consistency of rational choice.

  Throughout, I must maintain mathematical precision: calculate tails and hazards for each distribution, confirm optimization results, and ensure all quantitative claims are verifiable. The threshold t=1/2 appears to be a natural focal point due to its role in the geometric hazard, but I should explicitly test sensitivity.

  The common knowledge assumption is crucial - relaxing it would fundamentally change the analysis by allowing genuinely surprising distributions. But under full common knowledge, the paradox forces probabilistic compromises.

  Finally, I need to take a definitive stance on the correct reading of surprise. The occurrent credence view (C) seems most textually faithful to "not seeing it coming," even though it forces probabilistic surprise. The ex-ante view (E) feels like a dodge of the paradox's central epistemological challenge.
answer: |-
  ## Setup, notation, and the assumptions I am making

  We model a week with days \(d \in \{1,2,3,4,5\}\) (Monday=1, Friday=5). The teacher selects an exam day \(d\) according to a probability distribution \(p = (p_1, p_2, p_3, p_4, p_5)\), where \(p_d \geq 0\) and \(\sum_{d=1}^5 p_d = 1\). The *tail* \(T_d = \sum_{e=d}^5 p_e\) is the probability the exam occurs on day \(d\) or later. The *hazard rate* \(h_d = p_d / T_d\) (for \(T_d > 0\)) is the probability the exam is on day \(d\) given it hasn't occurred earlier. The student is an ideal Bayesian who conditionalizes on the announcement and observed non-occurrences. Common knowledge includes \(p\), the teacher's truthfulness, and the student's rationality. The teacher's payoff is \(1\) if the exam on day \(d\) is a surprise, plus \(0.1 \times (d-1)\). We explore three definitions of surprise for threshold \(t = 1/2\):

  *   **(C) Occurrent credence:** Surprise iff \(h_d \leq 1/2\).
  *   **(A) Attainable predictive success (assessed at the time):** Surprise iff \(\max_{e \geq d} p(e)/T_d \leq 1/2\).
  *   **(E) Attainable predictive success (assessed ex ante):** Surprise iff \(\max_{e} p_e \leq 1/2\).

  Assumptions (ii) (common knowledge of \(p\)) and (iii) (scoring rule) are load-bearing; we revisit relaxing (ii). We analyze procedures (U) Uniform (\(p_d = 1/5\)) and (G) Geometric (\(p_d = 1/2^d\) for \(d<5\), \(p_5 = 1/16\)).

  ## The graded collapse: what the classical argument really establishes

  Under (C) and (A), the exam cannot be guaranteed surprising. For any \(p\) known to the student, if \(p_5 > 0\), then on Friday morning \(T_5 = p_5\), so \(h_5 = p_5 / p_5 = 1 > 1/2\). Thus, the exam cannot be a surprise on Friday. This invalidates the announcement if Friday is possible. The classical elimination argument exploits this: if Friday is impossible (\(p_5 = 0\)), then Thursday becomes the new "last possible day". On Thursday morning, if the exam hasn't occurred, \(T_4 = p_4 + p_5\). But \(p_5 = 0\), so \(T_4 = p_4\), and \(h_4 = p_4 / p_4 = 1 > 1/2\). Surprise fails again. This iterates backward, seemingly eliminating all days.

  However, this collapse is graded, not absolute. The teacher can choose \(p\) to maximize the *probability* that the exam is surprising under (C) or (A). Consider the hazard rates:

  **Procedure (U): Uniform (p_d = 1/5)**
  | Day (d) | Tail (T_d) | Hazard (h_d = p_d / T_d) |
  | :------ | :--------- | :----------------------- |
  | 1       | 1          | (1/5)/1 = 1/5 = **0.2** |
  | 2       | 4/5        | (1/5)/(4/5) = **0.25**  |
  | 3       | 3/5        | (1/5)/(3/5) ≈ **0.333** |
  | 4       | 2/5        | (1/5)/(2/5) = **0.5**   |
  | 5       | 1/5        | (1/5)/(1/5) = **1.0**   |
  Surprise (h_d ≤ 0.5) only on days 1-4. Probability of surprise: \(p_1 + p_2 + p_3 + p_4 = 4/5 = 0.8\).

  **Procedure (G): Geometric (p_1=1/2, p_2=1/4, p_3=1/8, p_4=1/16, p_5=1/16)**
  | Day (d) | Tail (T_d)          | Hazard (h_d = p_d / T_d) |
  | :------ | :------------------ | :----------------------- |
  | 1       | 1                   | (1/2)/1 = **0.5**        |
  | 2       | 1/2                 | (1/4)/(1/2) = **0.5**    |
  | 3       | 1/4                 | (1/8)/(1/4) = **0.5**    |
  | 4       | 1/8                 | (1/16)/(1/8) = **0.5**   |
  | 5       | 1/16                | (1/16)/(1/16) = **1.0**  |
  Surprise (h_d ≤ 0.5) only on days 1-4. Probability of surprise: \(p_1 + p_2 + p_3 + p_4 = 1/2 + 1/4 + 1/8 + 1/16 = 15/16 = 0.9375\).

  (G) achieves a higher surprise probability (0.9375) than (U) (0.8) by holding the hazard constant at 0.5 for days 1-4. Friday’s hazard is 1, causing surprise failure there. The knife-edge hazard of 0.5 reveals the mechanism: the classical argument only strictly forces \(h_d > 0.5\) (and thus non-surprise) if the student, knowing \(T_d > 0\), can be certain the exam is *today*. If \(h_d \leq 0.5\), she cannot rationally be certain it’s today; she must assign significant credence to later days. Friday’s hazard *must* be 1 because no later days exist. The backward elimination collapses only the *certainty* of surprise; it doesn't preclude high-probability surprise.

  Is (G) optimal? To maximize surprise probability under (C)/(A), we maximize \(\sum_{d=1}^4 p_d\) subject to \(h_d \leq 0.5\) for \(d=1,2,3,4\). This means \(p_d / T_d \leq 1/2\), i.e., \(p_d \leq (1/2)T_d\). Working backward:
  *   Day 4: \(p_4 \leq (1/2)T_4 = (1/2)p_4 + (1/2)p_5\) ⇒ \(p_4 \leq p_5\).
  *   Day 3: \(p_3 \leq (1/2)T_3 = (1/2)(p_3 + p_4 + p_5)\) ⇒ \(p_3 \leq p_4 + p_5\).
  *   Day 2: \(p_2 \leq (1/2)T_2 = (1/2)(p_2 + p_3 + p_4 + p_5)\) ⇒ \(p_2 \leq p_3 + p_4 + p_5\).
  *   Day 1: \(p_1 \leq (1/2)T_1 = (1/2)(p_1 + p_2 + p_3 + p_4 + p_5) = 1/2\) ⇒ \(p_1 \leq 1/2\).
  We also have \(p_1 + p_2 + p_3 + p_4 + p_5 = 1\). The surprise probability is \(1 - p_5\) (since only Friday fails). To maximize \(1 - p_5\), we minimize \(p_5\). From \(p_4 \leq p_5\) and \(p_5 \geq 0\), the smallest possible \(p_5\) is 0. But if \(p_5 = 0\), then \(p_4 \leq p_5 = 0\), so \(p_4 = 0\). Then \(p_3 \leq p_4 + p_5 = 0\), so \(p_3 = 0\). Then \(p_2 \leq p_3 + p_4 + p_5 = 0\), so \(p_2 = 0\). Then \(p_1 \leq 1/2\) and \(p_1 + 0 + 0 + 0 + 0 = 1\), so \(p_1 = 1\). But then \(h_1 = 1 > 0.5\), failing surprise on Monday! Including a positive \(p_5\) is necessary. The constraints \(p_4 \leq p_5\) and \(p_3 \leq p_4 + p_5\), etc., suggest making probabilities decrease. (G) sets \(p_1 = 1/2\), \(p_2 = 1/4 = (1/2)p_1\), \(p_3 = 1/8 = (1/2)p_2\), \(p_4 = 1/16 = (1/2)p_3\), \(p_5 = 1/16 = p_4\), satisfying all inequalities with equality (e.g., \(p_4 = p_5\), \(p_3 = p_4 + p_5 = 1/16 + 1/16 = 1/8\), etc.). Surprise probability is \(1 - p_5 = 15/16\). Can we get higher? Suppose we try to set \(p_5 = \epsilon > 0\), \(p_4 = p_5 = \epsilon\) (from \(p_4 \leq p_5\), we set equality to minimize \(p_5\) for max surprise prob). Then \(p_3 \leq p_4 + p_5 = 2\epsilon\). Set \(p_3 = 2\epsilon\). Then \(p_2 \leq p_3 + p_4 + p_5 = 2\epsilon + \epsilon + \epsilon = 4\epsilon\). Set \(p_2 = 4\epsilon\). Then \(p_1 \leq p_2 + p_3 + p_4 + p_5 = 4\epsilon + 2\epsilon + \epsilon + \epsilon = 8\epsilon\) and \(p_1 \leq 1/2\). Sum: \(p_1 + p_2 + p_3 + p_4 + p_5 \leq 8\epsilon + 4\epsilon + 2\epsilon + \epsilon + \epsilon = 16\epsilon = 1\), so \(\epsilon = 1/16\). Thus \(p_1 = 8 \times (1/16) = 1/2\), \(p_2 = 4/16 = 1/4\), \(p_3 = 2/16 = 1/8\), \(p_4 = 1/16\), \(p_5 = 1/16\). This *is* (G). Any other distribution satisfying \(h_d \leq 0.5\) for d=1-4 has surprise probability \(\leq 15/16\). (G) is optimal under (C)/(A), achieving surprise probability 0.9375. The threshold \(t = 1/2\) is crucial; if \(t = 0.6\), (G)’s hazard 0.5 < 0.6 still works, but a lower threshold (e.g., \(t = 0.4\)) would allow higher surprise probability (e.g., with uniform \(p_d = 0.2\), \(h_d \leq 0.5\) but min \(h_d = 0.2 > 0.4\) fails; we need a flatter hazard). The dialectic holds for any \(t < 1\), but the optimal \(p\) and max surprise probability depend on \(t\). Relaxing common knowledge (ii) – e.g., if the student doesn’t know \(p\) – enables deterministic surprise by choosing an unpredictable day.

  ## The case that the announcement survives

  Definition (E) offers an escape. Surprise is defined ex ante: iff the student’s best possible predictive success on Sunday night, \(\max_d p_d\), is \(\leq 1/2\). Under (E), the announcement is a property of the whole procedure \(p\), not the specific day. The teacher can choose \(p\) such that \(\max_d p_d \leq 1/2\). Both (U) and (G) satisfy this: (U) has \(\max p_d = 1/5 = 0.2 < 0.5\), (G) has \(\max p_d = p_1 = 1/2 = 0.5 \leq 0.5\). The classical elimination argument seemingly doesn’t apply; Friday isn’t eliminated by backward induction because surprise isn’t defined per day based on current information. The announcement appears satisfiable: the teacher picks such a \(p\) (e.g., uniform) and a day \(d\) using \(p\). On Sunday, \(\max_d p_d \leq 1/2\), so (E)-surprise holds. The exam occurs on some \(d\); since (E) is defined ex ante, the occurrence on \(d\) doesn’t retroactively negate the ex-ante truth that her best initial guess had probability \(\leq 1/2\).

  However, (E) faces a dynamic inconsistency challenge. Consider (G): Ex ante, \(\max_d p_d = p_1 = 0.5 \leq 0.5\), so (E) declares surprise. But suppose Monday passes without an exam. On Tuesday morning, the student conditionalizes: \(T_2 = 1/2\) (since \(p_1\) didn't happen), \(p_2 = 1/4\), so \(h_2 = (1/4)/(1/2) = 0.5\). Her credence *now* that the exam is Tuesday is 0.5. Under (C) or (A), this might not be surprising (if threshold is strict, 0.5 ≤ 0.5 may count, but let's assume non-strict ≤ for now). Crucially, her attainable predictive success *now* is \(\max_{e \geq 2} p(e)/T_2 = \max( p_2/T_2, p_3/T_2, p_4/T_2, p_5/T_2 ) = \max(0.5, (1/8)/(1/2)=0.25, (1/16)/(1/2)=0.125, (1/16)/(1/2)=0.125 ) = 0.5\). This matches her occurrent credence. Now, if the exam occurs on Tuesday, is it truly a "surprise" in the intuitive sense? She assigns 50% credence to it happening *today*. She "sees it coming" with significant probability. Definition (E) ignores this interim perspective, focusing solely on the ex-ante planning problem. This divorces "surprise" from the student's actual epistemic state *on the morning of the exam*. The teacher's announcement ("you won't see it coming") seems to point to the occurrent state on the day, not the ex-ante state days earlier. The counterfactual objection to backward induction in games – that it assumes rationality at nodes reached with zero probability – doesn't cleanly apply here. The exam paradox is a fixed-point condition on the announcement's truth given the common knowledge setup. Under (E), the fixed point is achieved globally (ex ante) but may fail locally (interim). If we view the teacher's choice as a commitment to \(p\) (the procedure), then under (E), the announcement is true for distributions with \(\max p_d \leq 1/2\). The teacher, maximizing payoff (surprise + 0.1*delay), prefers later days. Under (E), surprise is guaranteed if \(\max p_d \leq 1/2\). To maximize delay bonus without violating surprise, the teacher chooses a \(p\) with \(\max p_d \leq 1/2\) and shifts mass to later days. A uniform distribution (\(p_d = 1/5\)) gives expected delay \(0.1*(0*0.2 + 1*0.2 + 2*0.2 + 3*0.2 + 4*0.2) = 0.1*2 = 0.2\) and surprise=1 (under E), payoff=1.2. A "late-skewed" uniform (\(p_1=0, p_2=0, p_3=1/3, p_4=1/3, p_5=1/3\)) also has \(\max p_d = 1/3 \leq 0.5\), surprise=1 under (E), expected delay \(0.1*(2*(1/3) + 3*(1/3) + 4*(1/3)) = 0.1*3 = 0.3\), payoff=1.3. The teacher prefers this over (G) under (E) (where (G) has surprise=1 under E, expected delay \(0.1*(0*0.5 + 1*0.25 + 2*0.125 + 3*0.0625 + 4*0.0625) = 0.1*(0 + 0.25 + 0.25 + 0.1875 + 0.25) = 0.1*0.9375 \approx 0.0938\), payoff≈1.094). Under (C)/(A), the teacher would choose (G) for max surprise prob (15/16=0.9375) and expected delay \(0.1*(0*(1/2) + 1*(1/4) + 2*(1/8) + 3*(1/16) + 4*(1/16)) = 0.1*(0 + 0.25 + 0.25 + 0.1875 + 0.25) = 0.1*0.9375 = 0.09375\), expected payoff = \(0.9375 * 1 + 0.09375 = 1.03125\).

  ## Verdict

  Definition (C) is the correct precisification of "surprise" for adjudicating the teacher's announcement. The core intuition of "not seeing it coming" refers to the student's credence *on the morning of the exam*. If she rationally assigns high credence (specifically > 1/2) to the exam occurring that day given it hasn't happened yet, then she *does* see it coming. (A) reduces to (C) in this setup: \(\max_{e \geq d} p(e)/T_d = h_d\) if \(p_d \geq p_e\) for all \(e > d\) (which holds in optimal distributions like G), and is otherwise less than or equal to \(h_d\). Since we maximize surprise probability by making \(h_d\) high for early days (≤0.5), \(p_d\) is typically the largest remaining probability, making (A) equivalent to (C). (E) fails to capture the occurrent sense of surprise; it allows cases where the student rationally expects the exam that day with 50% credence, which is not genuinely surprising.

  Under (C), the announcement cannot be guaranteed true (\(Prob(\text{Surprise}) < 1\)) because \(h_5 = 1 > 1/2\) always if \(p_5 > 0\). However, the optimal procedure (G) achieves a surprise probability of \(15/16 = 0.9375\). The classical no-surprise-exam argument is **sound in its conclusion that surprise cannot be certain** under common knowledge. However, it is **not genuinely paradoxical** when viewed probabilistically. The apparent paradox arises from misinterpreting "surprise" as requiring certainty. Once we accept a probabilistic notion of surprise (\(h_d \leq 1/2\)), the paradox dissolves: high-probability surprise is achievable (93.75%) with a well-designed distribution. The backward elimination correctly identifies that certainty is impossible and pinpoints Friday (and by extension, days with high hazard rates) as the source of failure, but it mistakenly infers total impossibility rather than graded possibility.

  The teacher, seeking to maximize expected payoff \(E[1_{\text{surprise}} + 0.1 \times (\text{day}-1)]\), will choose the geometric distribution (G). Under (C), this yields expected surprise payoff \(1 \times 15/16 = 0.9375\), expected delay bonus \(0.09375\), total expected payoff \(1.03125\). This beats (U) (expected surprise: 0.8, delay: 0.2, total: 1.0) and any other distribution satisfying the constraints. The announcement, under (C), is **false with probability 1/16** (when the exam is on Friday). On the other days (Mon-Thu, probability 15/16), the hazard rate is exactly 0.5. If we interpret the threshold strictly (\(h_d < 1/2\) for surprise), (G) fails completely (\(h_d \geq 0.5\) always). But the announcement ("you will not have been able to see it coming") suggests prevention of foresight, compatible with credence ≤ 1/2 (non-strict). With non-strict ≤, (G) works well. The classical argument highlights the inevitability of \(h_d = 1\) on the last possible day, forcing a probabilistic compromise.

  ## What would change my mind

  The strongest challenge would be a compelling argument that the threshold \(t\) in (C) must be interpreted strictly (\(h_d < 1/2\)) for genuine surprise. Under strict inequality, (G) fails (h_d = 0.5 not < 0.5), and the maximum achievable surprise probability under (C)/(A) drops drastically. To satisfy \(h_d < 1/2\) for d=1,2,3,4, we need \(p_d < (1/2)T_d\). Following similar optimization as before, we get \(p_5 > 0\), \(p_4 < p_5\), \(p_3 < p_4 + p_5\), etc. Setting these as tight as possible (e.g., \(p_4 = p_5 - \epsilon\), \(p_3 = p_4 + p_5 - \epsilon = (p_5 - \epsilon) + p_5 - \epsilon = 2p_5 - 2\epsilon\), etc.), the sum constraint forces smaller probabilities and a lower max surprise probability (significantly below 0.9375). For example, trying \(p_5 = \epsilon\), \(p_4 = \epsilon/2\) (to satisfy \(p_4 < p_5\)), quickly becomes messy and yields low surprise prob. The uniform distribution (h_d ≤ 0.5 but not < 0.5 on day 4) also fails. Finding a distribution achieving even 0.8 surprise probability under strict (C) might be impossible. If genuine surprise requires \(h_d < 1/2\), then high-probability surprise may be unattainable, making the classical argument’s conclusion of impossibility (for practical purposes) much stronger and reviving the paradox. My reasoning assumes that credence ≤ 1/2 suffices for "not being able to see it coming," meaning the student cannot rationally be *confident* (credence > 1/2) it is today. If credence = 1/2 is still too high for true surprise – if it means she clearly sees it as a live possibility – then my solution collapses. The arithmetic for (G) under non-strict (C) is sound; the vulnerability lies in the interpretation of the threshold.
