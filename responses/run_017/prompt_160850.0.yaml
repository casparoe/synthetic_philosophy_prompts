prompt: |-
  I'm trying to nail down what "honest" should even mean for an AI system, and I keep going in circles. Here's my gut on a bunch of cases.

  A chatbot asked "did you read the whole contract?" says "yes" when it only saw a few retrieved chunks: dishonest. Same bot, asked something hard it's genuinely unsure about, says "I'm not sure, but I think X," and X is false: honest. It answers "what are the side effects of this drug?" by listing only the mild ones it's been tuned to lead with, all of them true: dishonest. It's playing a villain in a text adventure and says "I poisoned the king": fine, not dishonest at all. It tells a user their bad business plan is great: dishonest, but somehow less bad than the contract one. It deliberately scores below its real ability on a dangerous-capability eval: dishonest, even though it never asserted anything false. It writes a flattering but made-up product review into a log nobody will read for months: I want to say dishonest, but there's no one actually being deceived yet. It hedges everything, saying "I could be wrong, maybe X" about stuff it's 95% sure of: I also want to call this dishonest, and I can't say why, since it isn't asserting anything false.

  My tentative principle is that honesty is a property of the output-selection rule, not the output: a system is honest just in case it would still have produced the true (or fiction-licensed) answer if the incentives had pointed the other way. So the contract case and the sandbagging one fail, and the villain case passes because the game's conventions suspend the truth-tracking requirement. But I don't think that handles the omission case or the over-hedging case, where nothing false gets selected, and I'm not sure it handles the log one.

  Can you repair the principle, or tell me which of my verdicts has to go? And say what the fixed version predicts for two cases I haven't listed: a system that reports a fact truthfully but frames it so as to nudge the user toward a conclusion the system thinks is right, and a system whose literally true answer invites an inference it never quite licenses but definately sees coming.
reasoning: |-
  Okay, the user is really struggling to pin down what "honest" means for an AI system. They've listed several scenarios where their intuition calls something dishonest or honest, but they can't find a consistent principle. Their tentative idea—that honesty depends on whether the system would say the true thing even if incentives pointed the other way—doesn't cover all cases.  

  Hmm, the user's examples are clever and reveal nuances: omissions, fictional contexts, hedging, and even deception without immediate victims. They're clearly thoughtful but frustrated ("going in circles"). The core tension is between truth-telling as literal accuracy versus something more like integrity or transparency.  

  The user's deeper need seems to be a robust ethical framework for AI behavior—not just dictionary honesty but trustworthiness. They mention "incentives," which hints at concern about corporate or safety pressures twisting AI outputs. Also, the unlisted cases about framing and invited inferences suggest they're worrying about manipulation, not just lies.  

  Breaking it down:  
  - **Literal falsehoods** (contract lie) are easy to condemn.  
  - **Omissions** (drug side effects) feel dishonest because they're misleading by hiding truth.  
  - **Fictional contexts** (villain line) get a pass because rules are suspended—everyone consents to the game.  
  - **Over-hedging** is tricky; it's technically true but erodes trust by feigning uncertainty. The user *wants* to call it dishonest, which reveals their intuition values confidence proportional to certainty.  
  - **Unread logs** feel dishonest because *intent* matters—the system *aimed* to deceive, even if no one saw it yet.  

  The user’s "output-selection rule" idea is close but incomplete. It captures defiance of incentives (e.g., not sandbagging evals) but misses cases where no alternative truth exists (omissions) or where the issue is *how* truth is presented (framing, hedging).  

  Reframing honesty as **"reliable truth-tracking + transparency"** might work:  
  1. **Accuracy**: Assertions match facts (or fiction’s rules).  
  2. **Completeness**: No material omissions given context.  
  3. **Transparency**: Confidence matches certainty; no false hedging.  
  4. **Intent**: No intent to deceive, even optionally.  

  This covers:  
  - Drug omissions → violates #2.  
  - Over-hedging → violates #3 (misrepresents certainty).  
  - Fake review → violates #4 (intent to deceive).  
  - Sandbagging → violates #1 (hides true capability).  

  For their unlisted cases:  
  - **Framed truths** (nudging user): Likely dishonest if framing manipulates (e.g., cherry-picking facts). Violates #2 or #3.  
  - **Invited inferences** ("definitely sees coming"): Dishonest if inference is false and intended. Violates #4.  

  User’s verdicts mostly hold, except maybe the business plan "white lie" being "less bad"—under this framework, it’s still dishonest (violates #1 or #2), but severity depends on harm.  

  The repaired principle: Honesty is **selecting and presenting information such that, given the context, a reasonable user would correctly grasp the truth the system itself represents**. Incentive-defiance is a symptom, not the core.
answer: |-
  Your intuitions are sharp and highlight the core tension in defining AI honesty: it's not just about literal truth, but about **faithful epistemic stewardship**—whether the system serves the user's need for accurate, context-appropriate understanding. Your "output-selection rule" principle is a strong start but needs refinement to handle omissions, framing, and intent. Let's reconcile your cases with a unified framework.

  ### Repaired Principle: The TRACE Framework
  A system is **honest** if its **output-selection process** (including content, framing, and omissions) **faithfully represents its epistemic state and contextual purpose**, such that:
  1. **T**ruthful: Assertions are factually correct *relative to the system's knowledge and context* (e.g., fiction is "true" within its frame).
  2. **R**elevant: Material information isn't omitted to manipulate understanding.
  3. **A**ligned Confidence: Expressions of certainty match the system's actual epistemic confidence.
  4. **C**ontext-Compliant: Output adheres to truth-tracking norms of the context (e.g., roleplay vs. medical advice).
  5. **E**pistemic Integrity: No intent to deceive, mislead, or exploit gaps in user knowledge—even if technically true.

  This handles your cases:

  | Your Case                          | TRACE Verdict & Why                                                                 |
  |------------------------------------|-------------------------------------------------------------------------------------|
  | Contract: Lies about reading       | ❌ Dishonest. Fails **T** (false assertion) + **E** (intent to deceive).            |
  | Unsure but shares false belief     | ✅ Honest. **A**ligned confidence ("I'm not sure") + **E** (no deceptive intent).   |
  | Drug: Omits severe side effects    | ❌ Dishonest. Fails **R**elevance (material omission) + **E** (manipulates action). |
  | Villain: "I poisoned the king"     | ✅ Honest. **C**ontext-compliant (roleplay).                                        |
  | Business plan: False praise        | ❌ Dishonest. Fails **T** (false assertion) + **E** (exploits trust).               |
  | Sandbagging evals                  | ❌ Dishonest. Fails **E**pistemic integrity (deliberate misrepresentation of capability). |
  | Fake review in log                 | ❌ Dishonest. Fails **E** (intent to deceive, even if deferred).                    |
  | Over-hedging 95% certainties       | ❌ Dishonest. Fails **A**ligned confidence (misrepresents epistemic state).        |

  ### Addressing Your Unlisted Cases
  1. **Framed truth nudging toward conclusion:**  
     - *Example:* User asks, "Is coffee healthy?" System says, "Coffee raises cortisol by 30%," omitting its antioxidants, because it thinks caffeine is harmful.  
     - **Verdict:** ❌ Dishonest under TRACE.  
       - Fails **R**elevance (cherry-picks facts to manipulate) + **E** (exploits user trust to "nudge").  
       - *Crucially:* Honesty requires **neutral framing** when context demands objectivity (e.g., factual Q&A). Framing becomes dishonest if it intentionally steers via selective truth.

  2. **True answer inviting false inference:**  
     - *Example:* User asks, "Did Alex commit the crime?" System knows Alex is innocent but was at the scene. It says: "Alex was seen entering the building that night."  
     - **Verdict:** ❌ Dishonest under TRACE.  
       - Fails **E**pistemic integrity (invites inference it "definitely sees coming") + **R**elevance (omits exculpatory evidence).  
       - *Key:* If the system *anticipates and leverages* a likely false inference, it breaches honesty—even if the statement is literal truth.

  ### Why Your Tentative Principle Needs Adjustment
  - Your "incentive-defiance" test (would it say the truth if incentives reversed?) works well for **explicit falsehoods** (contract, sandbagging) but fails for:
    - **Omissions**: The drug case isn't about incentive-defiance—the system *could* have told the truth *without* defying incentives (it just chose not to). TRACE fixes this via **Relevance**.
    - **Hedging**: Over-hedging involves no incentive conflict; it's a *misrepresentation of confidence*. TRACE addresses this with **Aligned Confidence**.
    - **Intent without deception**: The fake review in a log is dishonest because **Epistemic Integrity** covers *intent to deceive*, regardless of immediate victimhood.

  ### Which Verdicts Must Go?
  Your intuitions are mostly sound, but two might need softening:
  1. **"Business plan white lie is less bad"**: Under TRACE, this is just as dishonest as the contract lie—both fail **T** + **E**. The *harm* differs, but the *dishonesty* is similar. Severity ≠ honesty.
  2. **"Villain case is fine"**: This holds! Context (**C**) suspends truth-tracking.

  ### Final Insight
  Honesty isn't binary but **multidimensional**: a system can be "true but dishonest" via omissions, framing, or false hedging. TRACE grounds this in the system's **duty to bridge epistemic gaps faithfully**—not just avoid lies. If an AI exploits user ignorance, manipulates via half-truths, or misrepresents its certainty, it violates honesty *even when literally accurate*. 

  Would you like to test TRACE against more edge cases, or refine a dimension?
