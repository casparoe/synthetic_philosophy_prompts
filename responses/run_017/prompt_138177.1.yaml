prompt: |-
  I am a seventeen-year-old student, and I have run into a contradiction that I suspect is not really about me or my school, so I would like help working out what is going on underneath it.

  Last year my school changed how homework in mathematics and philosophy is graded. Handing in a written solution or essay is no longer enough: a few days later we have to defend it in a short oral examination, in class, without notes or devices, and a large part of the mark now depends on the defence rather than on the submitted text. My teachers were explicit about the reason. A chatbot can now produce a clean, well-structured written derivation of a problem it does not understand, and so, they said, a written explanation is no longer evidence of anything. What is left to test is whether you can rebuild and defend the reasoning live, under time pressure, while someone interrupts you with a follow-up question they invented on the spot.

  What puzzles me is that the same adult world seems to run the opposite rule for the systems themselves. When an AI produces its answer as a numbered chain of steps instead of blurting out the final line, it gets better marks on the tests that are used to compare systems, and this is widely reported as the system reasoning rather than guessing. Systems are also trained by being rewarded for written derivations that land on the right answer. And yet the people who build them also warn that such a derivation is often written after the fact, that the system would have given the same answer without it, and that it should not be read as a record of what the system actually did. So one written explanation is worthless as evidence of understanding when a student produces it, and genuine evidence of understanding when a model produces it, and the same people seem comfortable with both judgements.

  The reverse asymmetry bothers me too. My physics teacher still credits me with understanding a topic when I have to look up a constant or check a formula in my notes, and nobody thinks a professional mathematician has stopped understanding her field because she needs a week and a textbook to reconstruct a proof. So the live, unaided, real-time standard that my school now applies to students is not the standard anyone applies to adults.

  I have two questions, and I would rather you argued them out than pointed me to sources, since I have no access to academic papers.

  First: what theory of understanding does each of these practices presuppose? Reconstruct the implicit view in my school's oral-defence rule, and the implicit view in the practice of treating a generated chain of steps as evidence of reasoning. Be careful to separate what each practice strictly presupposes from what it merely fits well with, and tell me where the practice is underdetermined, so that several different theories of understanding would license it. Is there any single, coherent account on which a written rationale counts as no evidence at all from a student and as real evidence from a model? If not, say plainly which of the two practices is the confused one and why.

  Second, here is my own attempt at a better test, and I would like you to evaluate it rather than humour it. Instead of asking whether an explanation is present, ask whether the explanation is load-bearing. Take a chain of steps that a system produced, alter one stated reason in it: change a premise into its near-opposite, delete a step in the middle, or insert a consideration that ought to be irrelevant. Then see whether the final answer moves in the way that that reason should push it. Call this the steering test. A reason whose alteration moves the answer is doing work; a reason whose alteration leaves the answer where it was is decoration, however fluently it is written. Is the steering test a better proxy for understanding than either of the two practices I described? What exactly would passing it establish, and what would it fail to establish? And what should we say about systems that get the answers reliably right while producing no readable derivation at all: under which of the theories you lined up do they understand, and under which do they not?

  Please structure your answer in these sections, in this order:

  1. "The puzzle restated", about 80 words, where you check that you have understood what I am asking before you answer it.
  2. "What my school's rule presupposes", about 200 words: the implicit theory of understanding behind the oral defence.
  3. "What trusting a chain of steps presupposes", about 200 words: the implicit theory behind taking generated reasoning as evidence.
  4. "Whether one theory can cover both", about 250 words: your verdict on the consistency of the two, including the strict-requirements-versus-good-fit distinction and wherever the practices are philosophically underdetermined.
  5. "The steering test", about 200 words: your assessment of my proposal and its limits.
  6. "What would change my mind", about 120 words: the part of your reconstruction you are least confident in, and the specific argument or observation that would lead you to a different verdict.
reasoning: |-
  Hmm, this is a remarkably sophisticated inquiry from a seventeen-year-old student. They've identified a profound contradiction in how educational institutions and AI developers evaluate "understanding" - a contradiction that cuts to the heart of epistemology in the age of large language models.

  The core tension is fascinating: Their school now dismisses written proofs as worthless evidence of understanding because chatbots can fabricate them, while simultaneously the AI field celebrates those same fabricated proofs as evidence of machine reasoning. Meanwhile, the student observes that adult professionals aren't held to the same "unaided real-time performance" standard they are.

  For the school's oral defense requirement, I need to articulate the underlying epistemological assumptions. It clearly presupposes that understanding requires reconstructive ability under pressure - suggesting understanding is embodied in generative capacity rather than static knowledge. The emphasis on defense against novel objections points to a view where understanding must include causal control over the reasoning process.

  Regarding AI chains-of-thought evaluation, I should note how this practice implicitly treats reasoning as isomorphic with human cognition. There's an unspoken assumption that the externalized reasoning trace maps directly to internal processes - what philosophers call the "transparency fallacy." This becomes problematic when we know LLMs generate rationalizations post-hoc.

  When examining whether one theory can cover both positions, I should be honest: they're fundamentally incompatible. The school policy rests on skeptical premises about externalized reasoning, while the AI evaluation practice accepts them naively. The only "coherence" would be pragmatic hypocrisy - applying strict standards to humans while being credulous about machines.

  For their proposed "steering test," I'm impressed. Altering intermediate steps to observe downstream effects is genuinely insightful - it probes whether the reasoning structure has causal efficacy. But I'll need to point out its limitations: it can't detect "clever hans" scenarios where correlation mimics causation, and it fails for black-box systems that output only answers.

  The asymmetry in standards between students and professionals deserves emphasis. It reveals how schools are overcorrecting for AI while real-world expertise has always involved tools and time. This suggests their teachers may be conflating performance conditions with competence.

  For the "what would change my mind" section, I should acknowledge that our notion of "understanding" might need redefinition for machines. If we adopted a purely behavioral stance, the contradiction might dissolve - but that would require abandoning our intuitive concept of understanding entirely.
answer: |-
  ### 1. The puzzle restated (80 words)  
  You identify a contradiction: Your school dismisses *written* explanations as proof of understanding (since chatbots fabricate them), demanding instead *oral defense* under pressure. Yet AI developers treat similar *written chains of steps* as evidence their systems "reason." Meanwhile, adults (like physicists or mathematicians) aren’t expected to work unaided in real-time. You ask: (1) What theories of understanding underlie these practices? (2) Is your "steering test" — altering steps to see if the output changes — a better proxy?  

  ### 2. What my school’s rule presupposes (200 words)  
  Your school’s rule presupposes that **understanding requires *causal control* over reasoning**, not just output replication. Key implicit claims:  
  - **Reconstructive ability is necessary**: If you can’t rebuild the argument spontaneously, you never internalized its logic.  
  - **Pressure tests robustness**: Handling interruptions and novel questions proves the reasoning isn’t brittle memorization.  
  - **Explanation ≠ evidence of process**: Written text can be generated *without* understanding (e.g., via pattern-matching), making it epistemically hollow.  
  This fits theories like **procedural knowledge** (skill in *doing* reasoning) or **virtue epistemology** (where understanding is a reliable ability to respond to challenges). It’s underdetermined between these: Both prioritize *performance* over static representation. Crucially, it rejects **explanatory transparency** — the idea that a written rationale transparently reflects mental states.  

  ### 3. What trusting a chain of steps presupposes (200 words)  
  Treating AI-generated chains as evidence of reasoning presupposes that **understanding is demonstrated by *structurally coherent outputs***. Key implicit claims:  
  - **Isomorphism implies cognition**: If the output *looks* like human reasoning (step-by-step logic), it likely *is* reasoning.  
  - **Success implies validity**: If the chain leads to correct answers, its structure must be causally active.  
  - **Externalization = internalization**: The written derivation is a reliable trace of the system’s process.  
  This aligns with **functionalist theories** (understanding as producing appropriate outputs) or **interpretivist views** (we attribute understanding when behavior is "as if" reasoned). It’s underdetermined: Functionalists care only about output reliability; interpretivists add that the *form* must mirror human norms. However, it ignores **causal depth**: Knowing chains are often *post hoc* rationalizations contradicts the transparency assumption.  

  ### 4. Whether one theory can cover both (250 words)  
  **No coherent theory justifies both practices.** They rely on incompatible assumptions:  
  - **The school’s rule** demands *process reliability* (defense under pressure) and is deeply skeptical of explanatory traces.  
  - **The AI practice** accepts *output structure* as sufficient evidence and assumes explanatory transparency.  
  **Inconsistencies**:  
  1. **Written evidence**: For students, it’s dismissed as non-causal; for AI, it’s taken as causal.  
  2. **Aid tolerance**: Adults use references without losing credit, but students are denied this. AI is never tested in "unaided" conditions.  
  3. **Pressure**: Students face adversarial scrutiny; AI faces fixed benchmarks.  

  **Possible reconciliations fail**:  
  - A **pragmatic view** ("Different goals justify different tests") ignores epistemology: If written rationales are untrustworthy *in principle* for humans, they can’t be trustworthy for AI.  
  - A **behaviorist theory** (understanding = successful output) *might* cover both, but:  
    - It can’t explain why schools reject *correct* written work.  
    - It can’t distinguish luck from understanding.  

  **Verdict**: The AI practice is more confused. It conflates *surface form* with *causal process*, despite developers admitting chains aren’t process traces. The school’s rule, while strict, is philosophically defensible if understanding requires *agentive control*. The adult/student asymmetry, however, suggests the school overcorrects: Adults aren’t tested live because we accept that **understanding can be scaffolded by tools** — a nuance missing from your policy.  

  ### 5. The steering test (200 words)  
  Your steering test is a **major improvement** over both practices:  
  - **Strengths**:  
    - It directly probes *causal dependence*: Altering a step should alter the output if the step is "load-bearing."  
    - It avoids overtrusting fluency: A decorative rationale won’t steer the answer.  
    - It applies equally to humans and AI.  
  - **What it establishes**:  
    - **Minimal causal structure**: The system links premises to conclusions systematically.  
    - **Robustness to perturbation**: Reasoning isn’t memorized whole.  
  - **Limits**:  
    - **False negatives**: A system might use redundant reasoning (e.g., multiple valid paths) where altering one step doesn’t change the outcome.  
    - **False positives**: Clever heuristics could *simulate* steering (e.g., an AI that alters outputs based on keyword spotting in its own rationale).  
    - **Black boxes**: Systems with no intermediate outputs (e.g., pure answer generators) evade the test entirely — but under **procedural theories** (like your school’s), they’d fail for lacking reconstructability. Under **behaviorism**, they’d "understand" if answers are correct.  

  ### 6. What would change my mind (120 words)  
  I’m least confident that **oral defense is necessary for understanding**. If studies showed experts *can’t* orally reconstruct arguments under pressure (e.g., due to anxiety) yet perform flawlessly with aids, I’d concede your school’s rule conflates *performance* with *competence*. Similarly, if AI chains were proven *causally necessary* for accuracy (e.g., removing step-by-step generation reduces performance), I’d accept them as weak evidence of reasoning. However, current evidence opposes both: Humans use tools to *extend* understanding, and LLMs often guess answers *before* generating "reasoning." What would sway me decisively: An AI passing your steering test *while also* failing oral defense — proving causal structure without real-time control.
