  Starting with terminology clarification: the user mentioned "functional organization," "psychological continuity," and "identity." These are actually good terms. Functional organization refers to the causal structure of mental processes, psychological continuity involves chains of connected mental states (memories, intentions, etc.), and identity refers to numerical sameness over time. I'll use these terms precisely.

  For disambiguation, I'll identify the main families of views on personal identity:

  1. Biological views: Identity depends on biological continuity
  2. Psychological views: Identity depends on psychological continuity
  3. Patternist views: Identity depends on abstract pattern preservation
