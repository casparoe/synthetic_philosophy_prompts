prompt: |-
  I cover science and ideas for a newspaper, and I've been unable to stop thinking about an argument I overheard at a dinner after a conference on medical prediction. Names and details below are changed, and the company is one I'll call Corvid Health, since the specifics aren't what I want adjudicated.

  Corvid markets a prognostic engine for cardiology. Its selling point concerns what philosophers call the reference class problem: the risk figure for a particular patient depends on which set of past patients you compare her to, and the data don't select a set for you. Corvid's answer is what it calls "interval honesty." For any patient the engine scans every reference class that (a) contains the patient, (b) is defined using at most four of the available clinical variables, and (c) contains at least 250 historical patients, and it reports the lowest and highest risk across those classes. For one patient at the centre of the dinner conversation — a woman in her early sixties with a moderately uncommon genotype — it returned 8 per cent to 41 per cent five-year risk. Her insurer's rule is to fund the procedure above 30 per cent, and it denied coverage on the strength of the top of the interval. Her cardiologist objected, and the two people at my end of the table took it from there.

  (1) He said the interval is not candour but laundering. Reference classes are partially ordered, not ranked along one dimension, so "every admissible class" is not a determinate set: whether age is recorded in years or months, how finely diagnoses are coded, which labs happen to be stored, all change the endpoints. And because classes get thinner as you add variables, loosening the four-variable cap inflates the interval toward zero and one. The 250-patient floor and the cap are administrative conventions dressed up as epistemology.

  (2) She replied that he was litigating metaphysics when the live question is decision. For a threshold decision what you need is a score that is calibrated — that when it says 20 per cent, about a fifth of such patients have the event — and calibration is checkable, and there are now training procedures that aim for calibration simultaneously within every subgroup an auditor can define, so overlapping classes are no longer in tension. The demand that there be one true probability for this individual, she said, is an artifact of a frequentist picture in which probabilities just are frequencies in a class.

  (3) He answered that calibration is itself relative to a chosen family of classes, so the problem relocates rather than dissolves. A predictor that assigns every patient the base rate for her group is perfectly calibrated within that group and tells you nothing about her. Worse, two predictors can both pass every calibration check an auditor happens to run and still assign this patient different numbers; nothing in the calibration criterion picks between them.

  (4) She conceded that calibration is necessary and not sufficient, but said that is exactly why it is paired with requirements that the score extract all the available signal, and — more to the point — that the insurer's misuse is not a failure of probability theory at all. The abuse is that the payer was allowed to choose the convenient endpoint after seeing it. A decision rule has to be fixed in advance, and a wide interval should trigger collecting more information about this patient, not authorise whichever bound is cheaper.

  (5) He then widened the frame: there is a version of the problem where narrowing cannot save you, because the individual is yourself and the candidate classes are things like all humans, all humans alive this century, or all agents in technologically developed civilisations. There you cannot inspect the class from outside, and the choice of class changes the answer qualitatively rather than trading bias against variance. He said this is the same disease.

  (6) She said it is a different disease: there the difficulty is indexical — which observers get to count as evidence — and importing it into an actuarial tool is a category error. Even so, its remedy has the same shape as the clinical one: state the class explicitly and test how much the conclusion depends on it. He shot back that "be explicit and run a sensitivity analysis" is laboratory hygiene, not a solution, and that Corvid's product is deceptive in both directions: a single number hides the choice, while the interval hides it behind spurious precision about its own endpoints.

  I said nothing at the time because I couldn't sort it out. Please adjudicate move by move: for each of the six numbered moves, say whether it is clearly right, partly right, or wrong, and why, flagging any move that rests on a claim that is simply false. Then say who is more right overall, and what both of them are missing. In particular I'd like your view on whether calibration-based criteria really do dissolve the reference class problem or merely relocate it, and on whether there is a principled answer — as opposed to a regulatory one — to what a clinician ought to be told about a patient when the admissible reference classes disagree.
reasoning: |-
  Okay, let me tackle this complex debate step by step. The user presents a nuanced philosophical and technical argument about medical prediction algorithms, and I need to evaluate each move carefully.

  First, I consider the reference class problem in medical prognosis. The Corvid Health system's "interval honesty" approach seems mathematically coherent but philosophically fragile. The man's first point about indeterminacy of reference classes strikes me as fundamentally correct - how variables are discretized or measured directly impacts which groups get formed. His "laundering" accusation holds water because the technical constraints (4 variables, 250 patients) appear arbitrary from an epistemological standpoint.

  When the woman counters with calibration arguments, I find her partially right about decision-making practicality but overconfident in claiming the reference class problem dissolves. Modern calibration techniques like subgroup calibration are impressive but don't escape the man's criticism - they simply shift the choice to which subgroups auditors decide to validate. Her strongest point comes later: the insurer's post-hoc selection of the favorable endpoint is indeed misuse, not a failure of probability theory.

  The metaphysical expansion in move 5 feels like a category error to me. While philosophically interesting, comparing clinical risk assessment to existential reference classes (all humans vs. all civilizations) conflates technical and ontological problems. The woman's distinction between indexical and actuarial contexts seems valid here.

  Ultimately both miss the core tension: probability intervals serve different purposes for clinicians versus payers. The clinician needs actionable uncertainty quantification to guide testing/treatment, while the payer wants binary coverage rules. Neither calibration nor sensitivity analysis fully resolves this - we're left with practical compromises like requiring pre-specified decision protocols for wide intervals.

  I'll structure my response by:
  - Analyzing each numbered move with specific critiques
  - Highlighting where claims are false (e.g. "calibration dissolves reference classes")
  - Emphasizing the insurer's procedural failure as the most fixable flaw
  - Separating the philosophical problem from clinical decision support needs
answer: |-
  Below is a move-by-move adjudication of the debate, followed by overall conclusions. The analysis focuses on logical coherence, factual accuracy, and philosophical grounding.

  ---

  ### **Adjudication of Moves**
  1. **He said the interval is "laundering"...**  
     **Verdict: Partly right, but overstated.**  
     - **Right:** He correctly identifies that reference classes are indeterminate. Discretization (years vs. months), data granularity, and variable selection *do* arbitrarily alter interval endpoints. The 4-variable/250-patient constraints are operational compromises, not epistemically rigorous.  
     - **Wrong/Overreach:** Calling it "laundering" implies deception, but the interval transparently quantifies model-dependent uncertainty. The problem is inherent to *any* reference-class approach, not unique to Corvid.  
     - **False claim?** No false claims, but he ignores that *all* medical risk models face this indeterminacy; Corvid’s innovation is making it explicit.

  2. **She replied that calibration solves the decision problem...**  
     **Verdict: Partly right, but overconfident.**  
     - **Right:** Calibration *is* empirically verifiable and crucial for threshold decisions. Modern multi-group calibration methods (e.g., multicalibration) improve fairness across subgroups.  
     - **Wrong:** She falsely claims calibration "dissolves" the reference class problem. Calibration ensures reliability *within a chosen class family* but doesn’t resolve *which family* to use (as he notes in Move 3).  
     - **False claim?** Yes: "Overlapping classes are no longer in tension" is incorrect. Calibration within subgroups still depends on predefining those subgroups, which reintroduces the reference class problem.

  3. **He answered that calibration relocates the problem...**  
     **Verdict: Clearly right.**  
     - **Why:** Calibration requires specifying a family of subgroups to audit (e.g., age, genotype, etc.). Two well-calibrated models can assign the same patient different risks if they use different subgroup families. Calibration ensures internal consistency but doesn’t fix the choice of reference classes.  
     - **Key insight:** His "base rate" example is apt: a model assigning only group averages is calibrated but uninformative for individuals.  
     - **False claim?** None. This is a precise critique.

  4. **She conceded calibration isn’t sufficient but blamed insurer misuse...**  
     **Verdict: Clearly right on misuse, partly right otherwise.**  
     - **Right:** The insurer’s post-hoc selection of the 41% endpoint is indefensible. Decisions *must* precommit to how intervals are used (e.g., "fund if lower bound >30%"). Wide intervals should prompt more testing, not arbitrary thresholding.  
     - **Incomplete:** She correctly notes that signal extraction (e.g., using all predictive features) matters, but this doesn’t resolve reference-class dependence.  
     - **False claim?** None.

  5. **He widened the frame to existential reference classes...**  
     **Verdict: Partly right but conflates distinct issues.**  
     - **Right:** In "indexical" cases (e.g., forecasting human extinction), class choice *is* irreducibly subjective and qualitatively changes outcomes.  
     - **Wrong:** Claiming this is the "same disease" as clinical risk assessment is a false equivalence. Clinical classes are constrained by biomedical data and causal pathways; existential classes lack these anchors.  
     - **False claim?** Yes: Equating actuarial and existential reference classes ignores critical differences in data availability and testability.

  6. **She called it a category error; he called sensitivity analysis "hygiene"...**  
     **Verdict: She is more right.**  
     - **Her view:** Correct that existential/actuarial problems differ. "State the class and test sensitivity" *is* the standard remedy for clinical uncertainty.  
     - **His view:** Right that sensitivity analysis isn’t a "solution" (it quantifies, not eliminates, arbitrariness) but wrong to dismiss it. Corvid’s interval *is* a form of sensitivity analysis—flawed but better than hiding uncertainty.  
     - **False claim?** His "deceptive in both directions" overstates: A single number *does* hide uncertainty, but an interval makes it visible, even if endpoints are fuzzy.

  ---

  ### **Overall Assessment**
  - **Who is more right?** **She wins narrowly (4–2) on practical grounds**, but both miss core issues.  
    - Her strength: Focuses on *actionable* solutions (calibration, precommitment, data collection).  
    - His weakness: Valid critiques but no constructive alternative; overextends arguments.  
  - **Key winner:** Her Move 4 (insurer misuse) is the most important point. The real failure is procedural, not epistemic.

  ---

  ### **What Both Missed**
  1. **The fundamental tension:**  
     - Risk intervals serve two masters:  
       - *Clinicians* need uncertainty quantification to guide testing/treatment.  
       - *Payers* demand binary thresholds for coverage.  
       No model can fully reconcile this. Corvid’s interval is a Band-Aid for systemic incentives.

  2. **The calibration-reference class relationship:**  
     - **Calibration relocates but does not dissolve the problem.** It shifts the burden to choosing which subgroups to calibrate against, which reintroduces reference-class arbitrariness. "Multicalibration" mitigates but cannot eliminate this, as auditing *all possible* subgroups is computationally impossible.

  3. **A principled answer for clinicians:**  
     - **No single "true" probability exists**, but clinicians should receive:  
       - The full risk distribution (not just min/max),  
       - The variables driving uncertainty (e.g., "genotype causes variability"),  
       - A protocol for resolving ambiguity (e.g., "if interval >20pp wide, order genetic test").  
     - **Regulation should enforce:**  
       - Pre-specified decision rules for intervals (e.g., "use the 25th percentile for coverage"),  
       - Mandatory sensitivity analyses for high-stakes predictions.

  ---

  ### **Recommendations for Reporting**
  - **Expose insurer arbitrariness:** Highlight how post-hoc endpoint selection gaming harms patients.  
  - **Demand transparency:** Models should report *why* intervals are wide (e.g., "rare genotype") and next steps.  
  - **Beyond calibration:** Discuss "distributional robustness" methods that test model stability under reference-class perturbations.  

  This debate reveals a gap in predictive healthcare: Intervals quantify uncertainty but lack governance. The deeper story isn’t probability theory—it’s about power, transparency, and who gets to define risk when life-altering decisions hang in the balance.
