prompt: |-
  hey — I'm a backend engineer, no philosophy background beyond one undergrad elective I mostly slept through, so bear with me.

  At work we have this habit I definately can't tell is deep or self-deluding. We build performance models of our services that are obviously false. Concretely: to decide how many instances to run and to promise a p99 latency number, we model each service as a single M/M/1 queue — arrivals are Poisson, service times are exponential, one server, infinite buffer. Everyone in the room knows real traffic arrives in bursts (there's a daily shape, plus retry storms, plus the occasional noisy neighbor), and real latency has a fat tail because of GC pauses and lock contention. The model's assumptions aren't approximately true; they're just false. And we ship the capacity numbers anyway, and it mostly works, or at least we don't get paged. We also load-test in staging with a synthetic traffic generator, and everyone agrees those numbers are directional at best.

  Meanwhile, in the same repo, a code reviewer will block a PR if the unit test mocks the payments client so it always returns 200 instantly — the objection being that the real thing can time out and the test therefore shows nothing. Which, fine, but isn't that the same move? We replaced a dependancy with a fake, idealized version of itself and drew a conclusion anyway.

  Third data point: we refuse to mock the clock. Every service takes an injected Clock; tests advance it by hand, and if you call now() directly, CI fails. And for anything genuinely risky we don't model or stage it at all, we ship it dark behind a flag and watch real traffic.

  A friend with a philosophy degree mentioned something about Milton Friedman arguing in some essay from the fifties that assumptions don't have to be realistic as long as the predictions come out right, and called it the F-twist or something. That sounds like us. But it also sounds like a license to never check anything, and we clearly do check some things but not others, so idk that it's the whole story.

  So: what does our actual practice presuppose about when a false assumption in a model is acceptable? I'd like the implicit rule reconstructed and then assessed for coherence. Is it really just "only predictions matter," and if so why the fuss about the payments mock? Is something else doing the work — e.g. whether the assumption is one you could relax later and recover the messy version as a limit, versus an assumption that deletes the very failure mode you were modeling to find? Is part of it that some assumptions are wrong in a direction that flatters you (everything succeeds instantly) while others aren't? Is the clock rule a separate principle, or the same one wearing a hat?

  Also please separate what the practice strictly commits us to from what merely fits comfortably with it — I suspect several different theories of models would all tell us to do exactly what we do, which would mean our workflow is evidence for nothing much. And then: if we swapped in the strict view, the one where a model's assumptions should be true or at least close, what would concretely have to change on a Tuesday? My guess is that it collapses into "test everything against real production traffic," which is impossible, and if that's right then maybe the practice isn't evidence for the F-twist at all, just evidence that we're resource-constrained. I'd like that spelled out either way.

  Answer in American English, please, and skip the reading list — I want the reasoning, not things to go read.
reasoning: |-
  Okay, let me try to unpack this engineer's question. They're a backend developer without much philosophy background, noticing contradictions in their team's modeling practices. 

  First, the core paradox: they use an M/M/1 queue model everyone knows is false (ignores traffic bursts, fat tails), yet accept its capacity numbers. Meanwhile, they reject unit tests with idealized payment mocks. And they're strict about clock mocking. Their philosophy friend mentioned Friedman's "F-twist" - assumptions don't matter if predictions work - but that seems incomplete.

  Hmm, what's really being asked here? They want:
  1. The implicit rules behind when false assumptions are tolerated
  2. Whether those rules are coherent
  3. What would change if they demanded true assumptions

  Let me break this down layer by layer. The M/M1 model is accepted because:
  - It's computationally trivial
  - Gives ballpark figures (order-of-magnitude right)
  - Failures are masked by overprovisioning buffers
  - Load testing provides reality checks

  Whereas the payment mock is rejected because:
  - It hides precisely the failure mode being tested (timeouts)
  - There's no equivalent "buffer" for correctness
  - The test claims coverage it doesn't have

  The clock injection practice reveals another principle: avoiding non-determinism in tests is worth the effort because flaky tests waste time.

  So the implicit framework seems to be about:
  1. Error tolerance (how bad if model is wrong?)
  2. Mitigation strategies (buffers, fallbacks)
  3. Validation cost (load tests vs prod dark launches)

  If they switched to requiring true assumptions, they'd need:
  - Stochastic queue models (hard to parameterize)
  - Chaos engineering for every dependency (expensive)
  - Which is why they don't - not laziness, but triage.

  The coherence comes from pragmatism: false assumptions are permitted when the cost of better modeling exceeds the risk of being wrong, and there are safety margins. It's not that predictions are all that matters - it's that predictions plus buffers plus monitoring plus risk profiles determine what level of modeling truth is "good enough."
answer: |-
  Here's a breakdown of your team's implicit rules, their coherence, and what a strict "true assumptions" approach would demand—no philosophy jargon, just engineering pragmatics:

  ### The Implicit Rules (Reconstructed from Practice)
  1.  **"Wrong Direction" Matters:** False assumptions that **flatter the system** (e.g., payments *never* fail, service times *never* vary wildly) are forbidden. These hide failure modes you explicitly care about. Assumptions that **underestimate performance** (e.g., M/M/1 ignores bursts, making it *pessimistic* about needed capacity) are often tolerated because they build in safety margin.
  2.  **Error Tolerance Defines Rigor:** The cost of being wrong dictates scrutiny. A payment client mock hiding timeouts could cause undetected production outages (high cost). An M/M/1 queue giving slightly high capacity numbers usually just wastes some money (lower cost, often acceptable). Clock non-determinism causes flaky tests (wastes dev time = medium/high cost).
  3.  **Validation Horizon Matters:** Models are acceptable **only if** their predictions can be validated *downstream* with acceptable cost/risk. You validate capacity models (eventually) via load tests (imperfect) and *especially* via production SLOs/error budgets (real). Unit tests with deep mocks lack this horizon – you *can't* easily validate their realism later, so they must be rigorous upfront. Dark launching *is* validation.
  4.  **Buffers Cover Sins:** The M/M/1 model "works" because you implicitly (or explicitly) add engineering buffers: overprovisioning (running more instances than the model says), autoscaling, retry budgets, and error budgets. The false assumption's error is absorbed. A unit test mocking payments as perfect has no such buffer – it claims "this works" outright.
  5.  **Purpose Dictates Fidelity:** A model for **ballpark resource allocation** (M/M/1) needs less fidelity than a test verifying **specific failure handling** (payment timeout). The clock is mocked rigorously because time-dependent logic *is* the specific behavior under test.

  ### Is This Coherent?
  Yes, **within engineering constraints**. It's not Friedman's F-twist ("*only* predictions matter, assumptions irrelevant"). It's: **"Predictions matter *given* the cost of error, available validation, and safety buffers."** The fuss about the payments mock is consistent:
  -   It flatters the system (Rule 1).
  -   Error cost is high (Rule 2).
  -   Downstream validation is impossible for that specific logic path (Rule 3).
  -   There's no buffer for its false assumption (Rule 4).
  -   Its purpose demands high fidelity (Rule 5).

  The clock rule is the same principle: Flaky tests waste time (high cost), validation is hard, purpose demands fidelity, so you eliminate the false assumption ("time progresses magically").

  ### What "True Assumptions" Would Demand on a Tuesday
  If you demanded assumptions be "true" or "close":
  1.  **Kill M/M/1:** Replace it with a complex queueing model (e.g., G/G/1 with measured arrival/service distributions, maybe Markov-modulated processes). You'd need extensive, ongoing production tracing to parameterize it. Tuning becomes PhD-level work.
  2.  **Scrap Synthetic Load Tests:** Replace them with 24/7 shadowed production traffic replay or massive dark launches for *every* change. Synthetic traffic can't replicate true burstiness/non-stationarity.
  3.  **Unit Test Everything Realistically:** Every unit test mocking an external service (DB, payments, etc.) would need:
      *   Realistic latency distributions (measured from prod).
      *   Explicit failure modes (timeouts, 500s, corrupt responses).
      *   Chaos injection (network partitions, packet loss). Test runtime explodes.
  4.  **Eliminate Buffers:** Run *exactly* the capacity the "true" model dictates. No overprovisioning "just in case."
  5.  **Model Dependencies Rigorously:** You couldn't assume your dependencies meet their SLOs; you'd need probabilistic models of *their* failures cascading into your service.

  ### Why You Don't Do This (And It's Not Just Laziness)
  It **collapses into "test/model everything against real prod, always."** This is:
  -   **Impossibly Expensive:** Engineering time, compute resources, test runtime.
  -   **Paralyzing:** Development velocity grinds to a halt.
  -   **Overkill:** For many problems (like ballpark capacity), the error introduced by M/M/1 *after buffers and validation* is cheaper than eliminating it.
  -   **False Precision:** Getting "truer" assumptions often requires even *more* assumptions (e.g., about dependency behavior), which may themselves be wrong.

  ### The Bottom Line
  Your practice presupposes **engineering triage**. False assumptions are acceptable when:
  1.  They err in a **safe direction** (pessimistic).
  2.  The **cost of error is low or mitigated** (buffers, SLOs).
  3.  **Validation exists** downstream (load tests, prod monitoring).
  4.  **Higher-fidelity alternatives are prohibitively expensive** relative to the risk.

  It's not "only predictions matter." It's "**managing risk matters**, and this model/test + buffers + validation is the most efficient risk management tool for *this specific problem* given our constraints." The payments mock fails this; the M/M/1 queue passes it; the clock injection is essential for managing the risk of flaky tests. This isn't philosophy—it's resource-constrained engineering pragmatism.
