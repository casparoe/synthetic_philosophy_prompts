  - Natural instances being hard (sub-q3)
  - Seeing asymptotics as informative (sub-q5)

  The three-view taxonomy (asymptopia/resource/ignorance) is particularly sharp - this likely explains much of their disagreement. The office mate is probably blending (i) and (iii), while the user favors (ii). 

  For my credence... I'll anchor at 0.4 but the reasoning matters more. Key realizations:
