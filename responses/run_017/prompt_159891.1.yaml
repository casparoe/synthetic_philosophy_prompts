prompt: |-
  I teach a graduate seminar in formal epistemology, and I have never once handled van Fraassen's Reflection principle well. My usual habit is to put the principle on the board — that my credence now in a proposition, conditional on my credence in that proposition at some specified later time being x, ought itself to be x —, remark that it looks like conditionalization viewed from a distance, run through a diachronic sure-loss argument, and move on before anyone notices that this argument is doing something quite different from the synchronic Dutch book argument they met two weeks earlier. This term I finally have a full ninety-minute slot for it, the room has two blackboards and no projector, and a colleague from a machine learning group down the hill has asked whether his students may sit in. I can write the lecture myself once I have its architecture; what I want from you is the architecture. Please give me a teaching plan for the session, not an explanation of the principle, and please write it in American English with notation limited to what I could put on a board in one pass.

  The audience is genuinely mixed, which is part of the difficulty. The philosophy students — MA and early-stage PhD, most of them — have had Bayes' theorem, conditionalization, and one synchronic Dutch book argument; they are quick with symbols and impatient with anything that smells like a paradox, and several of them arrived in the program already convinced that credences are just subjective and therefore beyond normative criticism. The visitors use Bayesian updating daily as an engineering tool, have no prior grip on a diachronic requirement as a requirement at all, and in my experience convert any principle about an agent's later opinions into an implementable design rule within about ninety seconds. So, first: tell me the order in which the components must appear and what depends on what. In particular I need a decision on whether conditionalization is to be presented as something Reflection delivers or as an independent norm set beside it, and on where in the sequence the assumption that an agent can be certain of what her own future credence function will be has to be introduced — I have a suspicion that my past lectures failed precisely because I introduced that assumption sideways. Second: give me the one case that should carry the whole session, and say what a carrying case must contain and what it must lack. My worry about the examples I have used before is that all of them are evidence-gathering cases — blood tests, horse races, urns — so that Reflection collapses into the advice to wait for more data. A case that carries it, as I now think about it, has to be one in which the agent foresees a shift in her own opinion that is not simply the arrival of evidence, without being so exotic that it smuggles in manipulation, madness, or self-deception. There is a familiar Ulysses-style case in which an agent can foresee being swayed and can foresee what he will think afterwards; tell me whether that should carry the session or whether it imports the very confusion I am trying to head off, and if you would replace it, specify exactly what the replacement must have and must not have.

  Then the part I am worst at, the misconception map. Here is my list of suspects, which I would like you to correct, reorder, and add to; for each item that survives I want the precise point in the sequence at which it should be blocked and the move that blocks it: that Reflection is just conditionalization restated; that it says to defer to your future self because she will know more; that it says your future credences will be more accurate; that it is a principle of self-trust or of intellectual humility; that it forbids you from ever expecting to be misled; and — the one I most want placed carefully — that the diachronic sure-loss argument settles Reflection the way the synchronic Dutch book settles probabilism, when I take the diachronic argument to be the genuinely contested one and I want my students to feel why it is contested without my having to adjudicate it in class. Finish with two things: a single question I can put to the room in the last ten minutes that would let me tell apart a student who has the principle from one who has only the slogan about trusting your later self, and a recommendation about what I should refuse to cover at this level and say out loud that I am refusing. I am thinking specifically of the fact that the principle is widely taken to break down once the propositions involved are self-locating, and I cannot decide whether a five-second aside about that is intellectually honest or merely a way of opening a door I have no time to walk through.
reasoning: |-
  Okay, the user is teaching a graduate seminar in formal epistemology and struggles with explaining van Fraassen's Reflection principle effectively. They have a 90-minute slot and want a solid teaching plan. The audience is mixed: philosophy students who are skeptical about normative criticism of credences, and machine learning students who see Bayesian updating as an engineering tool. The user needs an architecture for the lecture, a central case study, misconception handling, and key discussion points.

  First, I need to address the core challenge: making Reflection distinct from conditionalization. The user's past approach conflated them, so the structure must separate these concepts early. Starting with conditionalization as a given makes sense, then contrasting it with Reflection to highlight that Reflection deals with non-evidential shifts. 

  The sequence should begin with a quick recap of conditionalization, then introduce Reflection through a case that clearly lacks evidence acquisition. The blood test examples they've used before don't work because they make Reflection seem like just waiting for data. The Ulysses case (foreseeing persuasion) is better but might confuse if it involves irrationality. A refined case—like anticipating exhaustion-induced belief shift—keeps it non-evidential without irrationality. 

  For the misconception map, each item needs specific blocking points. For example, the idea that Reflection is just conditionalization should be addressed right after defining both, using the central case to show the absence of new evidence. The claim about future accuracy should be countered by emphasizing that Reflection applies even if future credences are expected to be worse. 

  The diachronic Dutch book argument is contested because it assumes commitment to future bets, unlike synchronic Dutch books. This should be introduced after establishing Reflection's normativity, highlighting the disagreement about diachronic constraints. 

  The misconception that Reflection is about self-trust needs explicit debunking. Using a case where the agent knows their future self is impaired shows it's not about trust. 

  A good question to test understanding: "If you're sure your future self will have credence 0.8 in P due to exhaustion, what does Reflection say about your current credence?" The correct answer focuses on current credence conditional on future credence, not deferring. 

  Finally, mentioning self-locating propositions as a breakdown point is necessary but should be brief. Acknowledge it without diving in, to maintain honesty without derailing the session.
answer: |-
  Here’s a battle-tested architecture for your 90-minute session, designed for clarity and engagement with a mixed audience. The core strategy: **isolate Reflection as a distinct norm by confronting its counterintuitive implications head-on**.

  **Teaching Sequence & Dependencies (45 mins):**

  1.  **Grounding & Recap (5 mins):**
      *   Board 1: Write **Probabilism**, **Conditionalization (Cond)**. Briefly restate as synchronic/diachronic norms.
      *   Emphasize: Cond requires *learning evidence* (`E`). Its justification: *diachronic coherence* via *updating on truth*.
      *   *Why now?* Establishes common ground, reminds ML folks this is about norms, not algorithms.

  2.  **Introduce Reflection Raw (5 mins):**
      *   Board 2: Write **Reflection Principle (RP)**:
          *   `Cr_now(P | Cr_future(P) = x) = x`
      *   State verbally: "My current credence in P, given that my future credence in P will be x, should be x."
      *   *Key Move:* **DO NOT** mention conditionalization yet. Present RP baldly. Ask: "Does this *feel* right? Why/why not?" (Get quick gut reactions).

  3.  **The Central Case: "The Exhausted Reviewer" (15 mins - CARRYING CASE):**
      *   **Setup:** "You are reviewing a complex, technical paper tonight. You're currently sharp (`Cr_now(P = sound) = 0.7`). You *know* that by 3 AM, you'll be exhausted. Past experience shows exhaustion *systematically* makes you overly skeptical about *all* technical work, regardless of merit. You are **certain** that at 3 AM, `Cr_3am(P = sound) = 0.4`. *No new evidence* about P will arrive between now and 3 AM."
      *   **What it MUST Have:** Foreseen shift (0.7 -> 0.4), NO new evidence (`E` is tautology), shift driven by non-rational/irrelevant factor (fatigue), agent is *certain* of future credence.
      *   **What it MUST Lack:** Evidence acquisition, manipulation (it's endogenous), madness/deception (agent is lucid *about* the shift).
      *   **RP Application:** What should `Cr_now(P | Cr_3am(P)=0.4)` be? RP says **0.4**.
      *   **Immediate Conflict:** Ask: "But *you* think it's sound *now* (0.7)! Why should you lower your credence *now* just because you *know* you'll be tired and wrong later?" Let the discomfort simmer. *This is the hook.*
      *   *Why not Ulysses?* Ulysses cases often involve *resisting* future irrationality/desire. RP demands *acquiescence*. Exhausted Reviewer forces the paradox: you must adopt a credence you *know* will be worse later.

  4.  **Contrast with Conditionalization (10 mins):**
      *   Board 1: Write Cond: `Cr_new(P) = Cr_old(P | E)`
      *   **Key Move:** RP is **NOT** Cond restated.
      *   **Contrast:**
          *   Cond: Update *when you learn specific evidence `E`*.
          *   RP: Constrains *current* credence based *only* on *knowledge of your own future credence state*, **without needing `E`**.
          *   *Exhausted Reviewer:* "Is there any `E` here about the paper's soundness? No. Cond doesn't apply. RP does, demanding `Cr_now(P) = 0.4` conditional on knowing `Cr_future(P)=0.4`."
      *   *Decision Point:* RP is presented as an **independent, additional norm**, distinct from Cond. Cond governs evidence response; RP governs attitudes towards anticipated future doxastic states.

  5.  **Introduce Certainty & Scope (5 mins - CRITICAL):**
      *   **Explicitly State:** "RP, as stated, requires you to be **certain** about what your future credence will be (`Cr_now(Cr_future(P)=x) = 1`). This is a strong assumption! We'll see why it matters later."
      *   *Why now?* You identified past failure here. Introduce it *after* the paradox is felt, as part of diagnosing RP's structure. It's not an assumption in the *argument for* RP yet; it's defining the scope of the *principle itself*.

  **Justification & Pushback (30 mins):**

  6.  **Diachronic Dutch Book (DDBA) - The Argument (15 mins):**
      *   **Setup:** Revisit Exhausted Reviewer. Bookie offers bets *now*:
          *   Bet 1: Pays $1 if P, costs `Cr_now(P)`.
          *   Bet 2: **Conditional Bet:** "If at 3 AM your `Cr_3am(P) = 0.4`, I'll sell you a bet on P costing $0.4 that pays $1 if P." You *must* accept this conditional offer *now* if your current credence in the condition (`Cr_future(P)=0.4`) is >0 (which it is, =1).
      *   **Analysis:**
          *   *Now:* You accept both bets. Cost: `Cr_now(P)` + (Cost of Conditional Bet).
          *   *3 AM:* Condition `Cr_future(P)=0.4` is true (you're certain). You buy the $0.4 bet on P.
          *   **Outcome:**
              *   If P true: Win $1 (Bet1) + $1 (Bet2) = $2. Paid: `Cr_now(P)` + $0.4. Net: $1.6 - `Cr_now(P)`.
              *   If P false: Win $0. Paid: `Cr_now(P)` + $0.4. Net: -`Cr_now(P)` - $0.4.
          *   **Sure Loss?** If `Cr_now(P) != 0.4` (e.g., 0.7):
              *   P True: Net = $1.6 - $0.7 = $0.9
              *   P False: Net = -$0.7 - $0.4 = -$1.10
              *   **Not a sure loss!** Loss only if P false. *Why?* The conditional bet commits you to a *future action* (buying the $0.4 bet), not a fixed loss/gain now.
      *   **The Crucial Step:** The DDBA requires you to **pre-commit** to accepting the *specific* future bet priced at your *future* credence. *If you violate RP*, the bookie can structure the bets so the *combination* of the bet sold now on the future credence and the pre-committed future bet guarantees a loss *regardless of P* and *regardless of your actual future credence*. (Sketch this: If `Cr_now(P|Cr_fut=x) = y ≠ x`, the bookie can exploit the gap `|y - x|` via bets on `Cr_fut=x` and conditional bets on P given `Cr_fut=x`).
      *   **Why Contested?** Highlight: The Synchronic DBA punishes *incoherent beliefs at one time*. The DDBA punishes *incoherence over time* **plus** *a commitment to act on future beliefs in a specific way* (buying/selling bets at those credences). Is this "diachronic incoherence" or just a bad *plan*? *This is the friction point.* Ask: "Is avoiding this 'sure loss' (which relies on pre-commitment) a genuine requirement of rationality, like avoiding synchronic incoherence? Or is it demanding too much?"

  7.  **Misconception Map - Blocking Moves:**
      *   **(After Step 4) "RP is just Cond restated."** Block: Exhausted Reviewer! No `E`, Cond doesn't apply. RP acts where Cond is silent.
      *   **(After Step 3) "RP says defer because future self knows more."** Block: Exhausted Reviewer explicitly! Future self is *worse* (due to fatigue). RP *still* applies. It's not about epistemic advantage. *Contrast:* "When *would* you defer because future knows more? That's Cond on `E`."
      *   **(After Step 3) "RP says future credences will be more accurate."** Block: Exhausted Reviewer! Future credence (0.4) is *less* accurate (assuming current 0.7 is better). RP demands matching it *anyway*.
      *   **(After Step 6) "RP is self-trust/humility."** Block: RP demands *deference*, but Exhausted Reviewer shows it's not about *trust* (you distrust the future self!) or humility (sticking to 0.7 could be seen as humble confidence). It's about coherence over time under certainty.
      *   **(During Step 3) "RP forbids expecting to be misled."** Block: *Refine:* You *can* expect to be misled *by evidence* (Cond handles that). RP forbids *conditional planning* on your future self being *simply wrong in a specific way you can pinpoint now*, without new evidence. Exhausted Reviewer: You *expect* to be misled (shift to 0.4) and RP forces you to *adopt that wrong view now*.
      *   **(After Step 6) "DDBA settles RP like Synchronic settles Probabilism."** Block: **THIS IS THE KEY BLOCK.** Contrast the arguments:
          *   Synchronic DBA: Punishes *immediate* inconsistency. Hard to deny.
          *   Diachronic DBA: Punishes *plan* to accept bets later *based on future credences*, assuming you *will* accept them later. Is violating RP *irrational now*, or just risky? *Highlight the contestation:* "The Synchronic DBA shows you're *currently* confused. The DDBA shows your *current plan* might lose money later *if you follow through*. Is failing to bind your future self irrational *now*?" (Philosophy students perk up; ML students see the engineering difference: commitment vs. current state).

  **Synthesis & Challenge (10 mins):**

  8.  **The Core Question (Test Understanding):**
      *   Pose: **"Imagine you are absolutely certain that tomorrow, due to a temporary but intense phobia triggered by a yellow bird flying past your window, your credence that the moon is made of cheese (`M`) will jump to 0.9. You will have learned *nothing new* about the moon or cheese. What does Reflection say your credence in `M` should be *right now*, *conditional on* this future credence being 0.9?"**
      *   *Correct Answer:* `Cr_now(M | Cr_tomorrow(M)=0.9) = 0.9`
      *   *Why it works:* Distills RP's essence - no evidence, certainty about future credence, shift due to irrelevant/non-rational cause. Forces understanding that it's about *current conditional credence*, not deference per se. Someone only grasping "trust future self" will balk; someone understanding RP sees the demand.

  9.  **Closing & Scope Limitation (5 mins):**
      *   **Refuse to Cover (Explicitly):** "We've assumed certainty about future credences and non-self-locating propositions. **Crucially, Reflection breaks down in cases involving self-locating beliefs (like 'I am asleep now' or Sleeping Beauty) or when you aren't certain of your future credence. We are setting those profound complications entirely aside today.** This principle, as discussed, applies only under very specific, idealized conditions of self-certainty about non-indexical beliefs."
      *   *Why:* A 5-second aside is intellectually honest *and* necessary to prevent immediate "But what about X?" derailments. It signals the limitations without opening the door for discussion you can't handle. It's honest framing, not an invitation.

  **Session Architecture Summary:**

  1.  Recap Cond & Probabilism (5m - Board 1)
  2.  Introduce RP Raw (5m - Board 2) + Gut Check
  3.  **CARRYING CASE: Exhausted Reviewer** (15m - Deep Dive, Paradox)
  4.  Contrast RP vs. Cond (10m - Board 1/2 Comparison)
  5.  State Certainty Assumption (5m - Explicitly)
  6.  Diachronic Dutch Book Argument (15m - Mechanics & Why Contested)
  7.  **MISCONCEPTION BLOCKING** (Integrated into steps 3, 4, 6)
  8.  **CORE TEST QUESTION:** Yellow Bird Phobia (5m)
  9.  **EXPLICIT REFUSAL:** Self-Locating/Certainty Breakdown (5m)

  This structure forces the paradox early, cleanly separates RP from Cond, locates the key assumption, presents the contested justification, systematically dismantles misconceptions in context, tests understanding with a clear case, and honestly delimits scope. The mixed audience gets engaged by the core case's strangeness and the justification debate. Good luck!
