prompt: |-
  I'm putting together materials for an undergraduate seminar on moral luck and the social management of envy, and one unit keeps stalling. The unit contrasts two habits: the American one of treating a person's success as evidence about them — as something earned, and therefore as grounds for admiration, deference, and a certain narrative of the self-made life — and the levelling habit found in Nordic consensus culture (the "don't imagine you're anybody" rule) and in the tall-poppy reflex of the Antipodean countries, where the visible success of a neighbour is treated as an injury requiring corrective censure. My students pick a side within about ninety seconds and then just trade intuitions. I want something that makes the deadlock funny in a way that exposes its structure rather than restating it.

  So please write a satirical internal memorandum, no more than 700 words excluding the header block, from the fictional Directorate of Social Levelling of a small, prosperous, consensus-minded northern country, proposing a new national instrument: the Desert Adjustment Index. The Index is meant to break the stalemate by measuring, for each citizen, the split between the portion of their standing that is genuinely earned and the portion attributable to brute luck, inherited advantage, and the uncredited labour of collaborators, and then to issue a calibrated official response: a Praise Quota for the earned portion and, above a threshold of unearned advantage, a Levelling Tariff of scheduled ceremonial censure. The comedy has to come from taking the underlying philosophy seriously — the luck egalitarian thought that differences traceable to brute luck are not deserved, the difficulty of ever separating the two portions in a single life, the way any attempt to measure the split requires exactly the kind of expertise and authority that then has to be levelled in turn. The memo must deadpan its way through the problem of applying the Tariff to its own staff and must not resolve it. It should also note, with evident approval, that a visiting American consultancy sells a rival product — a Self-Made Certification that runs on the same underlying measurement engine — and that the Directorate can therefore license the software rather than build it; the reader should register that the two cultures have arrived at the same machinery without anyone in the memo noticing.

  Format it as a memo header (To / From / Date / Subject) followed by short numbered sections, and include one worked numerical example of a citizen's assessment, laid out as a small table of line items (earned share, luck share, inherited share, uncredited-collaborator share, resulting Tariff band), plus one short quoted complaint from a citizen who has been issued a Tariff. Keep the tone bureaucratic and unwinking throughout: no italics for emphasis, no nudging, and the memo should never name the view it is quietly reducing to absurdity.
reasoning: |-
  Hmm, the user is designing an undergraduate seminar on moral luck and envy management, and they're stuck on a unit contrasting American merit narratives with Nordic/Antipodean leveling cultures. Students quickly pick sides and just trade intuitions instead of engaging deeply. They want a satirical memo to expose the absurdity of both positions through deadpan bureaucracy.

  The key request is a fictional memo from a "Directorate of Social Levelling" proposing a "Desert Adjustment Index." This index would mathematically separate earned vs. unearned success components (luck, inheritance, others' labor) and assign either praise quotas or leveling tariffs. The humor must emerge from taking luck egalitarianism to literal extremes - especially the self-undermining aspects where the measurers themselves would need measuring.

  I consider designing the memo as a classic bureaucratic document: dry header (To/From/Date/Subject), numbered sections, one concrete example with a table, and an anonymous complaint quote. The tone must remain solemnly administrative - no winks to the reader. Crucial elements include:
  - The identical software used by American "Self-Made Certification" (highlighting cultural parallels unnoticed by the memo)
  - Staff tariff paradox mentioned but unresolved
  - The example table showing arbitrary quantification (e.g., 30% "uncredited parenting")
  - Complaint revealing the system's absurd cruelty ("damp socks" as punishment)

  For the technical execution:
  - Header sets plausible Nordic bureaucracy (Directorate of Social Levelling)
  - Sections cover: problem statement, solution (DAI), implementation, staff exemption challenge, and next steps
  - Table example for "Citizen 7781-S" with deliberately dubious metrics
  - Complaint quote about ceremonial damp socks
  - Strategic mention of licensing American software (identical to their "Self-Made Certification") for layered irony

  The satire works by exposing three flaws in luck egalitarianism:
  1) The impossibility of cleanly disentangling luck/effort
  2) The infinite regress of authority (who levels the levelers?)
  3) The shared underlying machinery of seemingly opposed cultural values (both require quantifying desert)

  By leaving the staff paradox hanging and never acknowledging the satire, the memo stays true to the deadpan requirement while giving students a concrete discussion tool to dissect both cultural approaches.
answer: |-
  **To:** All Directorate Personnel  
  **From:** Office of the Under-Director, Quantified Desert Division  
  **Date:** 15 Märta 2024  
  **Subject:** Implementation of Phase III: Desert Adjustment Index (DAI) & Associated Levelling Mechanisms  

  **1. Rationale & Operational Imperative**  
  Analysis confirms persistent social friction stems from disproportionate, uncorrected recognition accruing to individuals whose standing demonstrably exceeds their measurable desert. Traditional levelling reflexes (informal censure, Janteloven adherence) remain vital but lack precision, often targeting visible outcomes rather than their causal composition. This inefficiency generates resentment cycles and suboptimal consensus cohesion. The Desert Adjustment Index (DAI) resolves this by algorithmically disaggregating an individual's socio-economic standing into constituent desert vectors: **Earned Share (ES)**, **Luck Share (LS)**, **Inherited Advantage Share (IAS)**, and **Uncredited Collaborator Share (UCS)**. Only ES warrants positive recognition; excess aggregate LS+IAS+UCS triggers mandatory Levelling Tariffs.

  **2. DAI Methodology & Outputs**  
  The DAI engine, developed by external partner MeritMetrics Intl. (see Section 4), integrates tax records, educational transcripts, familial wealth assessments (3 generations), collaborative project audits, and verified self-reporting via Form DS-1178. Bayesian probability models assign percentage shares to ES, LS, IAS, and UCS (summing to 100%). Outputs determine state-mandated responses:

  *   **ES ≥ 65%:** Automatic allocation to the National Praise Registry. Citizen receives a quarterly **Praise Quota (PQ)** redeemable for modest public commendations (e.g., local newsletter feature, "Diligence Star" pin).
  *   **LS + IAS + UCS ≥ 40%:** Automatic enrolment in the **Levelling Tariff Schedule (LTS)**. The tariff intensity (Band 1-5) scales with the aggregate unearned share. Tariff fulfilment involves scheduled, non-monetary ceremonial censure (e.g., Bands 1-2: mandatory attendance at a "Humility Workshop"; Band 3: temporary, reversible status demotion in public databases; Band 4: ceremonial allocation of mildly inconvenient civic duties; Band 5: public reading of a Standardised Luck Acknowledgement during a community event).

  **3. Illustrative Assessment: Citizen 7781-S (Bjornstad Municipality)**  
  *Table 1: DAI Output Summary*

  | Desert Vector   | Percentage Share | Determination Basis                                  |
  | :-------------- | :--------------- | :--------------------------------------------------- |
  | **Earned Share (ES)** | 42%          | Documented overtime, solo patent application (partial) |
  | **Luck Share (LS)**   | 23%          | Favorable market timing during career advancement    |
  | **Inherited Advantage Share (IAS)** | 25%      | Parental subsidization of education + seed capital   |
  | **Uncredited Collaborator Share (UCS)** | 10%    | Unpaid administrative support from domestic partner (pre-DAI) |
  | **Aggregate Unearned Share (LS+IAS+UCS)** | **58%** | **Exceeds 40% Threshold**                        |
  | **Levelling Tariff** | **Band 4**   | Bi-weekly "Traffic Calming Ambassador" duty (wearing designated vest) for 6 months |

  **4. Implementation Efficiency & Partnership**  
  Development costs were minimized by licensing the core DAI engine from MeritMetrics Intl. (Delaware, USA). Their platform, while typically configured to output "Self-Made Certification Scores" for the US market, utilizes identical foundational data points and calculation logic. Our Directorate's configuration module simply repurposes the unearned share outputs for socially cohesive Levelling Tariffs, rather than celebratory Certification. This represents significant taxpayer savings versus in-house development.

  **5. Directorate Staff Compliance Protocol**  
  Acknowledging the inherent challenge of applying the LTS to the DAI assessment team itself, a phased approach is mandated:
  *   **Phase 1 (Months 1-6):** All Directorate personnel undergo baseline DAI assessment. Results are compiled confidentially by the Office of the Director-General.
  *   **Phase 2:** Personnel with Aggregate Unearned Shares ≥40% will participate in a pilot Internal Levelling Working Group (ILWG). The ILWG, using a recursive application of the DAI methodology *on its own operations*, will develop a protocol for applying ceremonial censure *within* the Directorate that maintains operational integrity while upholding levelling principles. The recursive nature of this task is noted. A progress report is due Q4 2024. **Until the ILWG protocol is ratified and implemented, Directorate personnel above the threshold are exempt from public-facing LTS duties.** Standard PQ allocations for high ES scores remain active.

  **6. Citizen Feedback Integration**  
  Anonymous feedback mechanisms are operational. Initial responses indicate high comprehension of the system's fairness, though adjustment periods are expected. Representative anonymized comment:
  > *"Received Band 2 Tariff (Humility Workshop x4) for 47% Unearned (mostly 'Undue Geographical Luck – Born near tech hub'). Workshop involved discussing my 'windfall adjacency' over weak coffee. Understood the principle. Still felt the socks were unnecessarily damp in the venue. Is dampness mandatory for humility? Querying via Form DS-1182."*
  This feedback has been logged for the ILWG's consideration regarding ceremonial ambiance standards.

  **7. Next Steps**  
  *   Full national rollout commences 01 Maj 2024.
  *   Form DS-1178 distribution to all citizens aged 25+ begins immediately.
  *   ILWG inaugural meeting: 30 Märta 2024.
  *   Praise Quota redemption centres open 15 April 2024.

  **Under-Director A. Vestergaard**  
  Quantified Desert Division  
  Directorate of Social Levelling
