prompt: |-
  Me and a mate had a long, stupid argument last night about our cost-benefit manual and I want it settled properly.

  I'm on the appraisal team at a transport regulator. We do maybe thirty appraisals a year, each one gets signed off by a board member who isn't an economist, and I've got about twenty mintues per project to sanity-check the distributional weighting. Three things we actually do: (1) income step weights — any benefit going to a household below the national median income gets multiplied by 1.6, above median by 0.7, and we recompute who counts as below median using post-project incomes; (2) an "identifiability premium" of 1.25 on any fatality-risk reduction that accrues to identifiable named people rather than statistical lives; (3) a 15% haircut on any option whose benefits are spread very unevenly across income groups, applied on top of the weighting.

  My mate — philosophy PhD, annoyingly good at this — says Harsanyi's aggregation theorem forces social welfare to be a weighted sum of individual vNM utilities with constant weights, so the only honest reason to count one person's pound for more is that their marginal utility of money is higher, which makes (2) and (3) pure hand-waving and (1) doubly bad because we recompute it after the project. I said no: the theorem is conditional — if the social ranking satisfies the vNM axioms and something like Pareto, then you get the weighted sum — so a regulator who doesn't buy independence for social choices just isn't bound by it, and we can weight by relative position, or by who's actually exposed to the risk, if we want. He said fine, then say out loud what you're giving up. I couldn't, and its been bugging me all day.

  So give me an audit I can run in twenty minutes on a set of weights like ours: the checks in order, what counts as passing each one, where the procedure stops with a no, and the points where it has to hand the decision to a human because the question is one of values rather than facts. The hard bit is the translation — keep whatever Harsanyi's result actually forces (weights attaching to utility rather than money, additivity across persons, the way a social ranking handles lotteries) but in language my board member can follow, and be honest about which of those distinctions survive being turned into a handbook rule and which get lost. Then tell me straight which of us loses the argument and what the loser has to give up.

  Write it as exactly five numbered items, each one or two sentences, with no introduction and no summing-up at the end: items 1 to 4 are the checks, and each one should say what it does to one of our three rules as it goes (I assume at least one of them dies — I have a bad feeling about which), and item 5 is where the procedure stops and hands off to a person, plus who loses the argument.
reasoning: |-
  Okay, let me tackle this user's problem. They work at a transport regulator and need a cost-benefit analysis audit process that fits their constraints: 20 minutes per project, non-economist board members, and three specific weighting rules. The core conflict is about reconciling their practical weighting methods with Harsanyi's theorem, as highlighted in their argument with a philosophy PhD friend.

  First, I need to unpack Harsanyi's theorem properly. It states that if social preferences satisfy vNM axioms and Pareto efficiency, social welfare must be a weighted sum of individual utilities with constant weights. The user's rules violate this: income step weights change after projects, identifiability premium treats statistical vs identified lives differently, and the inequality haircut adjusts based on distribution. 

  The user's position is that they're not bound by vNM axioms for social choices, which is technically correct - but their friend challenged them to articulate what they're sacrificing. The audit needs to explicitly name these trade-offs: dropping vNM independence when recomputing income groups, violating additive separability with identifiability premiums, and sacrificing utility-to-money proportionality with inequality adjustments.

  For the 5-point audit structure:
  1. Income step weights: Must check if weights are applied to utility, not just money. This exposes their current money-based approach as problematic.
  2. Identifiability premium: Needs to verify separability - but premium violates this by valuing identification separately from risk reduction.
  3. Inequality haircut: Should confirm if weighting accounts for diminishing MU only. Their 15% adjustment goes beyond this.
  4. Post-project recomputation: Must flag that changing weights mid-calculation violates constant weighting requirement.
  5. Handoff point: Here we state that any remaining deviations require explicit value judgments by the board, settling the argument in the user's favor but with clear concessions.

  The loser is the philosophy friend on the "bound by theorem" point, but the user loses on claiming their method is theoretically neutral - they're actively choosing non-utilitarian values. The audit makes these tradeoffs visible within their time constraints and for non-expert audiences.
answer: |-
  Here is the five-item audit procedure:

  1.  **Check if weights attach to utility rather than money:** Verify that the weighting factor (like 1.6 for low income) explicitly accounts for higher *marginal utility of money* due to lower income, not just the income level itself. **This flags the income step weights (1) as problematic** because they weight pounds directly without demonstrating a link to marginal utility differences.

  2.  **Check if weights are separable across persons and outcomes:** Ensure the weight assigned to a benefit (e.g., £1 or a risk reduction) for Person A depends *only* on Person A's characteristics, not on who else gets benefits or how they are identified. **This fails the identifiability premium (2)** because the premium depends on the *identifiability characteristic* of the recipient group, not solely on individual utility impacts.

  3.  **Check if weights account *only* for diminishing marginal utility of money:** Confirm that any distributional weighting (like the income steps or haircut) is justified *exclusively* by differences in how much extra money improves individual welfare (marginal utility), not by a separate aversion to inequality itself. **This fails the inequality haircut (3)** as it imposes an additional penalty based purely on unequal benefit distribution, beyond marginal utility differences.

  4.  **Check if weights are constant pre/post-project:** Confirm that the weight assigned to an individual's benefits is based on their baseline (pre-project) situation and does not change if the project itself alters their income group. **This fails the income step weights (1) again** because recomputing "below median" status using post-project incomes means the weight for the *same individual* changes depending on the project's outcome.

  5.  **Procedure stop and handoff:** If any check (1-4) fails, flag the specific weighting rule(s) involved. The decision to retain them despite violating the conditions for a consistent weighted-utility sum requires an *explicit value judgment* by the Board member, acknowledging the departure from weighting based solely on individual welfare impacts (e.g., prioritizing equality of outcomes independently, or valuing identifiable lives more highly). **You win the argument that Harsanyi doesn't *force* your approach, but you lose the claim that your weights are neutral; your mate wins that they require sacrificing core tenets of the theorem.**
