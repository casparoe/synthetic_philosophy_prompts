  ## The Case for Validity: Unpacking the Assembly's Lawful Revolution

  The tax is valid because Amendment A was lawfully enacted, Amendment B lawfully amended §1 by simple majority, and Amendment C followed that valid procedural path. This conclusion rests on the charter’s text, the nature of legal rules, and the distinction between textual and modal change that §2 demands. I make the **substantive argument first**: A and B were valid when enacted. The procedural grounds (§3 and §4) are secondary but independently fatal to any challenge; they add an insurmountable barrier even if substantive doubts exist (which they do not).

  ### I. The Substantive Validity of Amendment A
  Amendment A’s validity turns on whether it "amend[ed] Section 1" within §2’s meaning. It did not. **§2 protects only the *text* of §1, not its modal consequences or the broader amendment framework.**

  1.  **The Textual Mandate of §2:** §2 states: "**Section 1** may be amended only by a unanimous vote." It does not say "the rule enabling amendments," "the power to amend," or "conditions for future amendments." It names a specific textual provision: "Section 1." Amendment A left the *words of §1 completely untouched*. It repealed §2 and re-enacted §1 verbatim. Changing the surrounding context (by repealing §2) is not amending §1 itself. To "amend Section 1" requires altering its words, as Amendment B later did. §2’s language is precise and limited; expanding it to cover modal effects imports ambiguity where none exists.

  2.  **The Folly of Modal Entrenchment:** Reading §2 to entrench §1’s *function* collapses under its own weight and violates the charter’s structure. If §2 protected §1’s modal power (i.e., the requirement of a two-thirds vote for amendments), then any amendment *to any other section* that indirectly affected §1’s operation (e.g., changing quorum rules in an unentrenched section) could arguably require unanimity. This is judicial alchemy, not textual interpretation. §2’s placement *after* §1 and its specific reference to "Section 1" show it guards only against textual alteration of that section. A self-entrenched rule is only "self-entrenched" against textual revision; it cannot entrench its *functional consequences* against changes elsewhere in the charter. To hold otherwise makes §2 a suicide pact: if §1’s two-thirds rule is modally entrenched by §2, then §2’s unanimity rule is itself modally entrenched, rendering the charter perpetually unamendable unless unanimity exists—a result §1’s existence contradicts.

  3.  **§5 and Severability:** Amendment A contained two operative clauses: (1) repealing §2, and (2) re-enacting §1 verbatim. If (contrary to our position) the repeal of §2 were deemed void as an indirect "amendment" of §1, §5 would apply. The Assembly would have enacted the re-enactment of §1 "without the void part" (the repeal of §2). This creates an absurdity: §1 would exist twice (original and re-enacted), and §2 would remain, forbidding amendment of either version of §1 except unanimously. This interpretive chaos confirms that the repeal of §2 cannot be severed; its validity is essential to coherence. Therefore, §5 implies A must be taken as a whole or not at all – and since the re-enacted §1 is inseparable from repealing §2, the *entirety* of A must be valid. Severability hurts the opposition, not us.

  **Amendment A was a lawful exercise of the Assembly’s §1 power:** It amended §2 (repealing it) and added a new §1 (verbally identical to the old). Since it did not alter §1’s text, §2’s unanimity rule was never triggered. The 68 votes sufficed.

  ### II. The Validity of Amendments B and C
  With §2 repealed by valid Amendment A, the only amendment rule in force was §1 (as re-enacted by A): "The Assembly may amend this Charter by a two-thirds vote." Amendment B (71 votes) exceeded this threshold. It lawfully amended §1’s text to require only a simple majority. Amendment C (53 votes) then lawfully used that simple-majority rule. The tax is valid.

  ### III. Answering Key Objections
  1.  **"A amended §1’s conditions, so §2 applies":**  
      This confuses cause and effect. Amendment A changed the *conditions for amending §1* only by *repealing §2*, not by altering §1 itself. §2’s protection is limited to textual changes *to §1*. Changing §2 is a distinct act governed by §1 (two-thirds vote), not §2 (unanimity). To claim §2 governs *any* change affecting §1’s operation destroys textual boundaries and makes §2 a universal veto. The charter rejects this: §2 expressly forbids repeal by implication, showing the drafters prioritized textual precision. If they wanted modal entrenchment, they would have written "No amendment shall alter the voting requirement for Charter amendments except unanimously." They did not. This objection ignores §2’s clear subject: "Section 1," not "the amendment rule."

  2.  **"Void amendments are nullities; certificates and time bars don't cure them":**  
      Conceded only if the amendment *is* void. But Amendment A was *not* void. It was substantively valid, as argued above. The certificate and time bar are therefore irrelevant to our substantive case. However, procedurally (§3 and §4), they are decisive independently:  
      - **§4 makes the Clerk’s certificate "conclusive evidence"** that A was "enacted in the manner this Charter requires." This is a *rule of law*, not evidence. It commands the Court to treat the certified facts (68 votes, A’s enactment) as legally true. Even if A were void *ab initio* (which it wasn’t), §4 forbids the Court from questioning its validity *now* based on the vote count or procedure.  
      - **§3’s 60-day limit is jurisdictional.** "The Court may declare an amendment void only on a petition filed within sixty days." No petition was filed for A or B. The Court in 2015 is thus stripped of power to invalidate them. This is not "curing" voidness; it is *precluding judicial review* of any defect after the deadline. A "nullity" cannot be reviewed if the charter denies the Court authority to declare it so.  
      These procedural rules reinforce validity but are unnecessary here. The substantive argument stands alone.

  ### The Linchpin and Its Stakes
  **The single sentence on which this argument most depends is §2’s trigger: "Section 1 may be amended only by a unanimous vote."**  
  If "amended" is interpreted broadly to mean *any change affecting §1’s function or the conditions for its use*, then our argument collapses. Amendment A would then violate §2, requiring unanimity it lacked. But this reading is untenable:  
  - **Textually:** "Amend" refers to altering the provision itself, not its environment. The charter consistently uses "amend" to mean textual revision (e.g., "amend this Charter" in §1, "amend Section 1" in §2).  
  - **Structurally:** §2’s explicit bar on "repeal by implication" confirms an intent for narrow, textual precision.  
  - **Conceptually:** Legal rules exist as written texts. Changing what a rule *does* by altering other rules is not "amending" the rule itself; it is changing the legal ecosystem.  

  **If §2’s "amended" includes modal changes, the result is chaos:** Every amendment with ripple effects could demand unanimity, paralyzing the charter. The Assembly’s clear act of self-reformation in 2011—repealing an entrenchment clause by the very power it entrenched—must be respected. The tax stands.
