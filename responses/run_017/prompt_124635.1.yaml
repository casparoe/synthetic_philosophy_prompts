  Hmm, the user's own worry stands out – if both parties share non-moral beliefs, how can there be gains when each sees the other's action as worthless? That seems fundamental. I need to address whether this is a real constraint or a confusion. The answer probably lies in different moral weightings rather than factual disagreements – like valuing different outcomes differently even with the same facts.

  For the requirements, each case they listed generates a specific demand. The harmful counterparty requires a non-corruption clause to prevent becoming complicit. Non-reciprocating entities need a way to handle asymmetric trades without expecting returns. Confidential trades demand a self-consistency check so the group isn't undermining its own process. Moderate credence views require robustness across moral perspectives. And performing-first trades need safeguards against exploitation and power shifts.

  The user also wants to distinguish genuine requirements from camp prejudices. The ban on acting against one's best moral judgment might be a preference rather than a necessity – groups might validly prioritize overall expected value over individual certainty. Other things like avoiding complicity or maintaining internal integrity feel more universal.

  Looking for conflicts, the non-corruption requirement (not empowering harmful agents) might clash with the asymmetric trades requirement (helping powerless entities). Helping future generations could inadvertently aid harmful systems. Also, the robustness requirement might conflict with self-consistency if a trade is good across views but unacceptable to members.

  The non-corruption requirement does the heaviest lifting, excluding theories that allow any cooperation with harmful agents. It's strict but necessary to prevent moral backsliding.

  For the scorecard: Gains-in-own-terms theories fail on non-corruption and robustness. Common currency approaches struggle with asymmetric trades and non-corruption. Portfolio views might handle internal disagreement but collapse distinctions like not aiding harmful entities.

  If I had to drop one requirement first, it might be the self-consistency about confidentiality – if members fundamentally misunderstand the trade, secrecy might be justified. But that's risky. My reasoning might fail on the moderate credence point, underestimating how much moral uncertainty affects trade evaluations.
answer: |-
  ### What the theory is for
  To guide collective decisions for groups with internal moral disagreement (e.g., advocacy networks, small foundations) on whether to engage in proposed moral trades with external parties. It must resolve whether swapping actions/resources—despite conflicting valuations—genuinely advances the group’s aggregated aims under uncertainty, without demanding value homogenization or betraying core constraints.

  ### Requirements (with motivating cases)
  1.  **Non-Corruption Constraint**: Must not materially empower agents pursuing objectives the group deems *net harmful*, even if the trade appears beneficial ex ante. *Case: Trading unused lab equipment to a biocontainment researcher whose work we judge catastrophic-risk-inducing. We gain funds for malaria nets, but enable bioweapons development.*
  2.  **Asymmetric Reciprocity Handling**: Must evaluate trades where the counterparty cannot reciprocate or enforce commitments (e.g., future generations, animals, nascent institutions). *Case: Preserving wetlands at high cost today to benefit future people who cannot compensate us, based on our members’ shared but uncertain valuation of intergenerational justice.*
  3.  **Self-Consistency Under Confidentiality**: Must justify trades that members would reject if disclosed, *only if* secrecy is essential and the action demonstrably advances the *members’ own* (aggregated) objectives. *Case: Secretly funding a controversial AI ethics initiative (opposed by members as distraction) in exchange for another group supporting our climate lobbying—if we judge this net-positive for shared environmental goals.*
  4.  **Robustness Under Moral Uncertainty**: Must not be invalidated if our second-most-plausible moral view dominates; trades must remain acceptable or rejectable across credible valuations. *Case: Trading vaccine patents (we moderately believe property rights are secondary to health) for open-access agritech. If our runner-up view strongly prioritizes IP, the trade shouldn’t collapse.*
  5.  **Enforcement-Independent Security**: Must ensure no catastrophic loss if counterparties defect after we perform, and no significant empowerment of adversaries. *Case: Disbanding our cyber-monitoring capability first (believing it reduces escalation risks) in exchange for an adversarial state reducing offensive capabilities. They gain strategic advantage if they cheat, and could later coerce us.*

  ### Genuine desiderata versus camp prejudices
  **Genuine Desiderata**: Non-corruption (complicity avoidance is core to integrity), Self-Consistency (secret actions undermining members’ agency betray collective purpose), Security (existential vulnerability is irrational).  
  **Camp Prejudice**: The ban on *ever* acting against one’s *best* moral judgment. Groups with moral uncertainty can rationally take bets where expected choice-worthiness justifies action, even if a particular member’s top theory disapproves. This confuses individual conviction with collective rationality under disagreement.

  ### Conflicts
  The **Non-Corruption Constraint** (1) conflicts with **Asymmetric Reciprocity Handling** (2) and **Robustness** (4). Helping powerless entities (e.g., conserving land for future humans) might inadvertently aid harmful systems (e.g., entrenching exploitative property norms). Similarly, a trade robust across *our* moral views (e.g., trading with a moderate state for refugee resettlement) might still empower an actor some views deem structurally oppressive. Resolving this requires contentious prioritization: does preventing direct harm trump enabling indirect benefits?

  ### The requirement that does the most work
  **Non-Corruption Constraint** does the heaviest lifting. It categorically excludes trades that amplify recognized harms, even those offering large gains. This blocks consequentialist "net benefit" justifications when counterparties are deemed immoral, forcing the theory to draw bright lines around complicity—a dealbreaker for many utilitarian-friendly approaches.

  ### Scorecard
  *   **Gains-in-Own-Terms Theories** (e.g., "mutually beneficial swaps"): Fail (1) & (5). No inherent check on empowering harmful agents or security risks.  
  *   **Common Currency/Expected Choice-Worthiness**: Fails (1) & (2). Quantifying harm-enablement as a "cost" risks permitting catastrophic trades; struggles with non-reciprocation (no "counterparty" to model).  
  *   **Compromise/Portfolio Views**: Fails (1) & (3). Aggregating member views may approve trades benefiting harmful agents if members undervalue corruption risks; secrecy undermines compromise legitimacy.  
  **Result**: No extant family satisfies all requirements. Portfolio views come closest on internal disagreement but falter on external constraints.

  ### What would change my mind
  *   **Drop First**: **Self-Consistency Under Confidentiality** (3). If secrecy *only* prevents member backlash due to cognitive biases (not substantive betrayal), it might be relaxed—though this risks paternalism.  
  *   **Reorder For**: A compelling case where violating **Non-Corruption** (1) prevents greater harm (e.g., trading with a warlord to stop genocide). This could force prioritizing Security (5) or Robustness (4) over absolute anti-complicity.  
  *   **Likely Failure Point**: Underestimating the tension in **Asymmetric Trades** (2). If future/powerless entities *can* be modeled as having "acceptance" (e.g., via proxy representatives), Requirement 2’s stringency might reducible—but this risks anthropomorphism.
