answer: |-
  ### Examination Question  
  **Social Choice, Rights, and the Limits of Repair**  

  Consider the following social choice framework:  
  - **Unrestricted Domain (UD)**: The social decision function must accept any logically possible individual preference ordering.  
  - **Pareto Principle (P)**: If every individual prefers outcome \(x\) to outcome \(y\), society must rank \(x\) above \(y\).  
  - **Minimal Liberalism (ML)**: At least two individuals each possess a "protected pair" of outcomes over which they are decisive. For example, Individual 1 is decisive over \(\{x, y\}\) (if 1 prefers \(x\) to \(y\), society must not rank \(y\) above \(x\), and vice versa), and Individual 2 is decisive over \(\{a, b\}\).  

  **The Two-Reader Case**:  
  - **Prude (P)**: Prefers "No one reads the book" (N) most, then "Prude reads alone" (P_read), then "Lewd reads alone" (L_read), least "Both read" (Both).  
  - **Lewd (L)**: Prefers "Prude reads alone" (P_read) most, then "Both read" (Both), then "No one reads" (N), least "Lewd reads alone" (L_read).  

  Under UD, P, and ML, a cycle emerges:  
  - P is decisive over {N, P_read}: N > P_read.  
  - L is decisive over {L_read, Both}: L_read > Both.  
  - Pareto requires P_read > N (both prefer P_read to N) and Both > L_read (both prefer Both to L_read). This creates a cycle: N > P_read > N.  

  **The Repair**: Replace social orderings with a *game form*. Each individual controls ("has a right over") a specific action: e.g., Prude controls whether *he* reads (choosing "P_read" or "not P_read"), Lewd controls whether *he* reads (choosing "L_read" or "not L_read"). Outcomes result from combinations of actions:  
  - (not P_read, not L_read) → N  
  - (P_read, not L_read) → P_read  
  - (not P_read, L_read) → L_read  
  - (P_read, L_read) → Both  

  **Part 1: Pareto-Improvability Under Rights (PIR)**  
  An outcome \(o\) exhibits PIR if:  
  (i) \(o\) results when all exercise their rights permissibly.  
  (ii) There exists another outcome \(o'\), reachable *via some permissible exercise of rights* by all, such that everyone prefers \(o'\) to \(o\).  

  **Part 2: Unanimous Waiver Clause (UWC)**  
  Any right-holder may unilaterally waive their right over their protected pair. However, a right is *defeated* (allowing collective decision on that pair) **only if every right-holder waives their own right**. Waivers may be conditional (e.g., "I waive only if everyone else waives"). Some rights might be non-waivable.  

  **Question**:  
  Does shifting to a game form with rights-as-powers *dissolve* the fundamental conflict exposed by the two-reader case? First, show whether the outcome when both exercise rights "non-cooperatively" (e.g., Prude chooses "not read", Lewd chooses "read" → L_read) exhibits PIR. Second, evaluate whether adding UWC reliably resolves PIR while preserving a normatively liberal regime. Your answer must conclude with a determinate verdict: Does this approach *merely relocate* the conflict, or does it *resolve* it? Justify rigorously.  

  ---

  ### Model Answer (580 words)  

  **PIR in the Game Form**:  
  Assume both exercise rights non-cooperatively: Prude chooses "not read" to avoid association, Lewd chooses "read" hoping for Both. Outcome: L_read. This exhibits PIR.  
  - *Condition (i)*: L_read is a permissible outcome under the game form.  
  - *Condition (ii)*: Outcome P_read is reachable permissibly: Prude chooses "read", Lewd chooses "not read". Both prefer P_read to L_read (Prude: P_read > L_read; Lewd: P_read > L_read). Thus, L_read is Pareto-dominated by P_read, and P_read is achievable under the same rights structure.  

  **UWC’s Efficacy**:  
  UWC *cannot* reliably resolve PIR while preserving liberalism.  
  - *Why UWC fails to resolve PIR*: To move from L_read to P_read via UWC, Prude must waive his right over {N, P_read} (allowing collective choice on whether he reads). But Prude *will not waive unconditionally*: He prefers N (no reading) to P_read. He might waive *only if* Lewd waives his right over {L_read, Both} *and* collective choice picks N. Lewd, however, prefers P_read to N and would only waive if collective choice picks Both. Mutual conditional waivers ("I waive only if you waive and we get my preferred outcome") create deadlock. Without exogenous enforcement of waivers, PIR persists.  
  - *Normative illiberalism*: UWC transforms rights into conditional privileges revocable by collective will. If Prude *must* waive to enable Pareto-superior P_read (which he dislikes), this coerces him into surrendering control for "the greater good". This is paternalistic: It prioritizes Pareto efficiency over individual sovereignty. Non-waivable rights contradict UWC’s premise, admitting rights cannot be voluntarily alienated.  

  **Relocation vs. Resolution**:  
  The game form *relocates* but does not *resolve* the conflict.  
  - *Formal dissolution*: The cycle disappears because rights no longer impose *collective* rankings; they define *individual* action spaces. No contradiction arises.  
  - *Normative persistence*: PIR reveals the conflict persists at the outcome level. Rights-as-powers ensure individuals *can* block Pareto improvements (Prude can veto P_read by not reading), creating inefficiency *they themselves regret*. UWC attempts to "solve" this by making rights defeasible, but this undermines liberalism by subjecting protected spheres to collective override when unanimity is manipulable. The core tension—individual autonomy vs. mutual benefit—remains intact.  

  **Verdict**: The repair merely relocates the conflict. It dissolves the formal inconsistency (no cycle) but not the normative one (PIR under rights). UWC exacerbates illiberalism by making rights contingent on unanimous consent, failing to resolve PIR without coercion.  

  ---

  ### Marking Scheme (20 marks total)  

  1. **Correct identification of PIR in the game form** (5 marks)  
     - *Hit*: States L_read occurs under non-cooperative play; proves P_read is Pareto-superior and reachable.  
     - *Miss*: Fails to specify actions/outcomes; claims no Pareto domination exists; confuses P_read with Both.  

  2. **Analysis of UWC’s failure to resolve PIR** (4 marks)  
     - *Hit*: Shows deadlock from conditional waivers (Prude demands N, Lewd demands Both); notes PIR persists without coercion.  
     - *Miss*: Assumes waivers occur unconditionally; claims UWC guarantees P_read; ignores strategic withholding.  

  3. **Critique of UWC’s illiberalism** (4 marks)  
     - *Hit*: Argues UWC enables paternalism (rights overridden for efficiency); notes coercion if waiver is "required".  
     - *Miss*: Treats UWC as neutral procedure; doesn’t address conditional waivers/non-waivability.  

  4. **Distinction: Formal vs. normative dissolution** (5 marks)  
     - *A-grade hit*: Explicitly separates game form’s avoidance of cycles (formal) from PIR’s normative conflict (individuals regret outcome rights permit).  
     - *B-grade*: Correctly states no cycle exists but doesn’t contrast formal/normative levels.  
     - *Miss*: Claims the paradox is "solved"; doesn’t mention PIR.  

  5. **Clear, justified verdict** (2 marks)  
     - *Hit*: Concludes conflict is "relocated, not resolved" based on Parts 1–4.  
     - *Miss*: Undecided or appeals to "context"; verdict contradicts analysis.  

  **A Answer**: Distinguishes formal/normative levels; shows PIR is inevitable regret under rights; proves UWC’s deadlock/coercion.  
  **B Answer**: Correctly handles mechanics (PIR example, UWC process) but catalogs without synthesizing normative critique.
