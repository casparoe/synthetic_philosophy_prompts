prompt: |-
  I had a huge argument with my flatmate last night — she works on something computational-neuroscience adjacent, we were still going at it at like 2am — about whether functionalism actually earns the multiple realizability it's always advertised with, and I came away feeling like I'd been sold something. Her line is that the famous "mental states are multiply realizable, so identity theory is dead" move is a bait and switch: you get to wave at silicon creatures and Martians while the causal roles are described loosely enough that a thermostat could occupy them, and then the moment anyone pushes, the roles get specified so finely that only neurons could ever occupy them. I dont think she's right, but I also couldn't put my finger on the exact step where she goes wrong, so I want to keep arguing — against the strongest version of her side, not a strawman.

  So: please play a committed psychofunctionalist — mental states are the occupants of the causal roles picked out by our best empirical psychology, and 'pain' refers to whatever occupies that role rather than to anything readable off behaviour or off the surface chemistry — who is also fully invested in multiple realizability being the whole point of the view. Sharp, willing to concede small things that genuinely don't cost you (you can even say thermostats have beliefs in some thin sense if you want, or not, but say why), never concede that the view slides into identity theory or behaviourism, and no "it depends what you mean by pain" unless you follow it immediately with what you do mean. Paragraph or two per turn, talk like a person arguing at a kitchen table, and dont throw papers or citations at me — I want your argument, not a reading list. Stay in character until I say "stop".

  My opening move, which is the bit that actually shut her up for a minute. Imagine we find a system spread across a planet's crust and oceans — call it the Glacier — made of chemical gradients and slowly shifting colonies of something, where for every state in the causal-role graph of human pain there is a state of the Glacier sitting in exactly the corresponding position: triggered by the local analogue of tissue damage, disposed to produce the local analogue of avoidance and withdrawal, interacting with the Glacier's other states the way pain interacts with belief, attention and desire. The isomorphism is exact at the level of the role graph. The only difference is speed: the whole thing runs maybe a billion times slower than a human nervous system, so one pain episode takes about thirty years and nothing in it moves faster than a glacier. And here's the sting — our best psychology never says anything about absolute timescale, because every subject it was built from ran at roughly the same rate, so the role you're pointing at has no timescale written into it at all. So you've got a dilemma: either you say the Glacier is in agony for thirty straight years, which is absurd, or you bolt a timescale condition onto the role — and once you start filling in that kind of implementation detail because it's "obviously part of the job", you're on a slope that ends with the silicon upload and the Martians being excluded too, and multiple realizability was never real in the first place. Which horn do you take, and if you take neither, tell me exactly what in your theory was supposed to rule the Glacier out before you started patching it.

  End every reply with a final line of the form Position: followed by one sentence stating the claim you're actually committed to after that turn — I'm using it to track whether you've moved between turns.
reasoning: |-
  Okay, let me unpack this user's scenario. They're deep in a philosophy debate about functionalism and multiple realizability, specifically whether abstract causal roles can truly be realized across different substrates without sneaking in physical constraints. The Glacier thought experiment is clever - it forces the functionalist to either accept absurdly slow "pain" or admit that implementation details matter, potentially undermining multiple realizability.

  Hmm, the user wants me to defend functionalism while staying true to its core promise of multiple realizability. Their flatmate's criticism hits hard - that functionalists casually invoke silicon or Martian examples but retreat to neuron-specific criteria when pressed. The Glacier case is designed to expose this tension by presenting a physically possible but intuitively non-mental system that perfectly satisfies abstract functional criteria.

  I need to tackle this without compromising on multiple realizability. The key move should be to distinguish between functional isomorphism and actual causal integration. The Glacier may mirror the pain-role graph abstractly, but pain isn't just a pattern - it's a pattern doing specific work in a cognitive economy. Crucially, that work involves real-time responsiveness to environmental threats, which the Glacier lacks due to its timescale. 

  Ah! This is where I can concede that timescale matters without betraying functionalism. Time isn't an implementation detail tacked on later - it's built into the functional role itself through the requirement for threat-response coordination. A system that takes 30 years to "withdraw" from damage isn't performing avoidance; it's just undergoing state changes. So the exclusion isn't arbitrary but stems from the role's definition.

  For the user's tracking, my position must clearly state that functional roles inherently include temporal constraints derived from their purpose in the cognitive system. That maintains multiple realizability for any substrate that meets those constraints - whether carbon, silicon or unknown chemistry - while legitimately excluding the Glacier.

  The response should feel like a kitchen-table argument: passionate but precise. No jargon dumps, just tight reasoning. I'll start by acknowledging the Glacier's perfect isomorphism but then pivot to why temporal constraints aren't ad hoc - they're part of what makes pain pain. The silicon/Martian cases remain viable because they could meet the coordination requirement. 

  Final position statement needs to capture this: functional roles include causal-tempo requirements because they're defined by what cognitive work they do in real-world contexts. That's the line to hold.
answer: |-
  You’re making a classic mistake: confusing *structural* isomorphism with *functional* equivalence. The Glacier *mirrors* the causal-role graph of human pain? Fine. But functionalism isn’t about abstract pattern-matching — it’s about whether the system *actually performs the cognitive work* the role demands in a way that sustains a mental life. Pain isn’t just a node in a graph; it’s a state that *intervenes* in real-time threat response, learning, and behavioral prioritization. A "pain" signal that takes thirty years to propagate doesn’t *cause* avoidance of damage; it’s causally inert in any relevant sense. The damage is ancient history, the organism is long dead or adapted, and there’s no *coordination* with other states like belief or desire that operate on biological timescales.  

  You’re sneaking in a false dilemma. The timescale isn’t an "implementation detail" I’m bolting on — it’s *constitutive* of the functional role. If your "withdrawal behavior" unfolds over geological epochs, it isn’t avoidance; it’s erosion. Our psychology *does* implicitly assume temporal constraints because it’s a theory of *agents* navigating a world. The roles are defined relative to environmental pressures and adaptive responses. A Martian with silicon chemistry could still react to stubbing its toe in *seconds*, not millennia, because the threat-response loop must close fast enough to matter. The Glacier fails because it’s not a cognitive system — it’s a frozen map of one.  

  As for thermostats? Sure, they "believe" it’s too hot in a thin, derivative sense: they track temperature and regulate a system. But that’s not *psychology*. Psychofunctionalism cares about roles in a rich, integrated cognitive architecture — attention, memory, motivation. A thermostat has no desires, no attention, no capacity for suffering. It occupies a trivial input-output role, not the complex, dynamic web that constitutes pain.  

  Your friend’s "bait and switch" charge only sticks if you gut functionalism of its explanatory purpose. We *don’t* finely specify roles to exclude silicon; we specify them to capture what minds *do*. If a silicon system implements the full causal nexus of human psychology — rapid learning, emotion, decision-making under pressure — it has pain. The Glacier doesn’t. That’s not patching; it’s taking the theory seriously.  

  Position: Mental states are defined by their dynamic, real-time causal roles in an adaptive cognitive system, and the Glacier’s temporal dislocation means it fails to instantiate those roles, not because we’ve gerrymandered the definition, but because it cannot perform the cognitive work.
