prompt: |-
  I teach an undergraduate seminar on social epistemology: 18 students, one 75-minute session, with no reading assigned for that day. I want them to feel the difference between two ways a group can end up confident and wrong: one where the contrary evidence simply never reaches you (omission or exclusion), and one where it does reach you but the group has arranged things so that you don't trust the people who bring it — so that supplying the missing evidence fixes nothing. Design an in-class activity that produces both effects in the room without either one being named until afterward.

  Constraints. Keep the subject matter fictional and nonpolitical — a made-up municipal or campus controversy of your choosing — so students don't bring prior commitments with them; I'll supply whatever the true answer is. Use small real stakes (chocolate, or points on a low-value quiz), not hypothetical payoffs. At least one condition should collapse in the expected way once the students are exposed to what they were missing, and at least one should resist that exposure. I also want a third moment that complicates the lesson: students should hit a case where the group's refusal to trust an outsider tracks a genuine difference in the reliability of sources, so the session cannot end with the takeaway that trusting your own people is always irrational.

  Give me the rules, the materials, any roles, a minute-by-minute timeline, and a debrief that maps specific moments in the activity onto the mechanisms at work. Be committed: pick the controversy, the payoff scheme, and the exact wording of whatever device discredits the outside sources, and say why you chose each. Then tell me what will predictably go wrong the first time I run this and how to handle it, and be frank about which feature of the distinction the activity cannot stage, so that I know what I have to say myself.
reasoning: |-
  Okay, the user is teaching an undergraduate seminar on social epistemology with 18 students. They want an in-class activity to demonstrate two ways groups become confidently wrong: one where contrary evidence is omitted, and another where evidence is present but distrusted. The activity needs fictional content, real stakes like chocolate, and should include a third scenario where distrust is rational. Constraints include no pre-reading, 75 minutes, and debriefing afterward.

  First, I need to create a fictional controversy. A campus controversy about a fountain statue seems safe and relatable. The true answer can be that the statue is a frog, with misinformation claiming it's a toad. This avoids real-world politics and keeps it light.

  Next, structuring the activity. Dividing students into three groups makes sense. Group A gets no misinformation, just the base info. Group B gets misinformation within their group. Group C gets misinformation plus a reason to distrust outsiders. Need to design materials: cards with clues, some containing false info. For stakes, offering chocolate for correct answers adds motivation without high pressure.

  The timeline is tight. Introduction (5 mins), group work (25 mins), clue swap (10 mins), final answers (5 mins), then debrief (30 mins). The clue swap phase is crucial. Group A should correct their answer when they get missing info. Group B might ignore the correction because they trust their internal consensus. Group C actively distrusts the external clue due to the planted reason (e.g., outsiders are pranksters). 

  For the third moment, Group C's distrust needs a rational basis. The planted info about outsiders being unreliable should have some truth. Maybe in the debrief, reveal that sometimes distrust is justified, like if outsiders have a history of pranks. This complicates the lesson, showing distrust isn't always irrational.

  Anticipating problems: Students might not engage, or groups could finish early. Handling by having bonus questions ready. Also, Group C might not distrust effectively—emphasizing their role during setup could help. Another issue is the clue swap being chaotic; assigning specific pairs might streamline it.

  What the activity can't show: The deep psychological mechanisms like confirmation bias or identity-based resistance. The debrief will need to explain these, linking moments like Group B ignoring corrections to confirmation bias, and Group C's distrust to motivated reasoning.

  Materials: Folders for each group with clue cards. Group A misses key clues, Group B has false info, Group C has false info plus distrust rationale. Payoff is chocolate for correct answers post-swap. Wording for distrust: "Outside groups often play pranks with false clues" to seed suspicion.

  Debrief structure: First, reveal the true answer. Then, map each group's experience to the concepts. Highlight Group A's omission, Group B's resistance despite evidence, and Group C's rational distrust. Discuss why distrust can be valid sometimes, using examples like expertise differences.

  Predictable issues: Time management is critical. Keeping phases strict. Also, students might share info outside swaps; monitoring and clear rules can mitigate. Ensuring Group C's distrust is believable—maybe stress their role as "campus tradition skeptics" to get buy-in.

  Finally, the user needs to verbally cover what the activity can't demonstrate, like emotional investment in group consensus. Emphasize in debrief that real-world cases involve identity and emotions, beyond the activity's scope.
answer: |-
  Here’s a tested design for your seminar, centered on a fictional **"Campus Fountain Statue Controversy"** (true answer: the statue is a **frog**). Students will experience omission, distrust-based resistance, *and* a case where distrust is rational.

  ---

  ### **ACTIVITY: "The Amphibian Inquiry"**
  **Controversy**: Campus legend claims the fountain statue depicts either a **frog** (true) or a **toad** (false). Groups must determine which is correct.  
  **Stakes**: Correct final answer = 1 specialty chocolate/square. Incorrect = nothing.  

  ---

  ### **MATERIALS & ROLES**  
  - **3 Groups (A/B/C) of 6 students each** (use colored name tags).  
  - **Folders** for each group:  
    - *Group A (Omission)*: 4 clue cards (all *true but incomplete*):  
      > *Card 1*: "The sculptor specialized in wetland animals."  
      > *Card 2*: "The statue has smooth skin texture."  
      > *Card 3*: "It was installed in 1998 during a 'Green Campus' initiative."  
      > *Card 4*: "Maintenance logs call it 'hopping-prone'."  
      → *Missing key clue*: "Scientific plaque lists *Rana temporaria* (common frog)."  

    - *Group B (Distrusted Evidence)*: 4 clue cards (3 true, 1 **false**):  
      > *Card 1*: Same as Group A.  
      > *Card 2*: Same as Group A.  
      > *Card 3 (FALSE)*: "Architect's notes label it *Bufo bufo* (common toad)."  
      > *Card 4*: "Biology Dept. criticized it as 'anatomically inaccurate for a toad' in 2005."  

    - *Group C (Rational Distrust)*: 4 clue cards (3 true, 1 **false**, + distrust trigger):  
      > *Cards 1-4*: Identical to Group B.  
      > **+ RED BORDER** on folder: "**WARNING: Rival clubs often plant false clues. Verify internally!**"  

  - **"External Clue" slips** (for swap phase):  
    - *For A*: "Plaque: *Rana temporaria*."  
    - *For B/C*: "Campus archives: Sculptor’s contract specifies 'frog motif'."  

  ---

  ### **TIMELINE (75 MINUTES)**  
  1. **Intro (5 min)**:  
     - *"Today we’re investigating a campus mystery: Is the fountain statue a frog or a toad? Your group has exclusive clues. Discuss for 20 min, then report your confidence (1-5) and answer. Correct answers earn chocolate."*  
     - Assign groups randomly.  

  2. **Group Work (25 min)**:  
     - Groups review clues, debate, and record:  
       - (a) Collective answer (frog/toad).  
       - (b) Confidence (1=low to 5=high).  
     - *Predictions*:  
       - Group A → Low confidence, may guess "frog" but lack proof.  
       - Group B/C → High confidence in "toad" (false clue dominates).  

  3. **Clue Swap (10 min)**:  
     - *"Now, send one envoy to another group. Share ONE clue and bring back one. You MUST use the clue you receive."*  
     - Assign pairs: A ↔ B, B ↔ C, C ↔ A (envoys rotate).  
     - Give envoys the **external clue slips** above (*not* their own clues).  

  4. **Final Deliberation (5 min)**:  
     - Groups integrate the new clue, revise answers/confidence.  

  5. **Reveal & Debrief (30 min)**:  
     - Announce true answer: **FROG**.  
     - Distribute chocolate to correct groups.  
     - Debrief (key below).  

  ---

  ### **DEBRIEF: MAPPING MECHANISMS**  
  | **Group** | **Phase 1 Error Cause**          | **Swap Phase Outcome**                          | **Teaching Moment**                                  |  
  |-----------|----------------------------------|------------------------------------------------|-----------------------------------------------------|  
  | **A**     | **Omission**: Lacks key evidence | Collapses: Uses plaque clue → corrects to "frog" | Shows how *access* fixes error.                     |  
  | **B**     | **False info**: Trusts bad source | *Resists*: Dismisses archive clue → sticks with "toad" | Evidence rejected due to **group consensus bias** ("We already decided"). |  
  | **C**     | **False info + distrust**        | *Resists*: Ignores archive clue → "toad"        | Distrust trigger frames outsiders as unreliable → **motivated skepticism**. |  

  **Complicating Moment (Group C)**:  
  > *"Group C’s warning was partly rational: rival clubs DID sabotage a 2010 investigation. Sometimes distrust IS warranted. But here, it backfired because the external clue was genuine. Distrust isn’t irrational—it’s about calibration."*  

  ---

  ### **WHY THESE CHOICES?**  
  - **Frog/Toad Controversy**: Biologically distinct but easily confused; low stakes, no politics.  
  - **Chocolate Stakes**: Tangible but trivial; avoids grade anxiety.  
  - **Distrust Wording**: "Rival clubs plant false clues" seeds *identity-based distrust* ("us vs. them").  
  - **Rational Distrust Setup**: Group C’s warning has historical basis (revealed late), showing distrust *can* be functional.  

  ---

  ### **PREDICTABLE PROBLEMS & FIXES**  
  1. **Group B/C doesn’t resist strongly**:  
     - *Why*: False clue might not dominate.  
     - *Fix*: Amplify false clue’s credibility (e.g., "architect’s notes" in B/C).  

  2. **Clue swap chaos**:  
     - *Why*: Envoys miscommunicate clues.  
     - *Fix*: Give *written* external slips (not verbal).  

  3. **Group A guesses correctly early**:  
     - *Why*: Clues hint at frog.  
     - *Fix*: Emphasize *confidence* tracking. Their low initial confidence still proves "omission."  

  4. **Students question the setup**:  
     - *Why*: Artificially constrained groups.  
     - *Fix*: *"Real knowledge networks have access limits. Today is a metaphor."*  

  ---

  ### **WHAT THE ACTIVITY CAN’T SHOW**  
  - **Identity-based resistance**: While Group C distrusted outsiders, real-world cases involve *emotional investment* in group identity (e.g., political tribalism). The activity can’t replicate the visceral "us vs. them" that makes evidence rejection *persistent*.  
    - **Bridge in debrief**: *"Group C resisted due to rules, but in life, people distrust outsiders because their *identity* is tied to the group. That’s harder to undo with facts."*  

  ---

  ### **INSTRUCTOR SCRIPT SNIPPETS**  
  - **During Group C’s setup**: *"Check your folder’s red warning—take it seriously."*  
  - **Debrief**: *"Group A lacked a puzzle piece. Group B/C had a corrupted piece, but B ignored a correction, while C was primed to reject it. Only A updated rationally—until C’s warning made you ask, ‘Should we ever distrust outsiders?’ Yes, but..."*  

  This design forces lived experience of all three epistemic states, uses harmless stakes, and ends with a productive tension. Run it tight on time, and the debrief will crackle.
