prompt: |-
  I write fiction for a living — four novels, a stack of short stories, and a workshop I teach every spring — so I spend a stupid number of hours a day doing something that feels like introspection, and lately I've started to suspect it isn't really.

  Here's the thing I keep running into. When I need to find out what I feel about something — say, whether I'm actually angry at my brother or just tired and wounded about something else — the answer arrives in exactly the same way as the answer to a completely different question: what would my character feel here. Same machinery. I set up the situation, imagine it in some detail, run the scene, wait to see what the person in it does, and then write down what happened. If it's the character and the result feels wrong, I toss it and run it again with different staging, no drama. If it's me, the result comes out as a *report*. I treat it as something I now know. And when a friend says "no you're not, you're just tired", I don't revise it the way I'd revise a scene — I feel corrected, or caught out, like I got wrong something I was supposed to have special access to.

  So the method is the same and the authority is different, and I can't work out whether that's a discovery about introspection or just a fact about what you're doing when you tell someone "I feel X".

  A couple more instances, since I don't want to hand you an abstraction. In interviews I get asked whether I share my narrator's politics, and I've noticed I answer by imagining what I'd say on a panel — i.e. by writing myself, the same trick, then reading off the result as a belief. And I found an old diary of mine from about twelve years ago, full of feelings I cannot now get back to by any amount of sitting quietly; the diary seems like better evidence about me than my present-day introspection does, which seems backwards. Also: there's that line novelists trot out about not knowing what you think until you see what you've written. I used to think it was a joke. Now I think it might be the honest description of the method, and I don't know whether that should worry me.

  So: is there an established concept for this? I've heard it said that you find out what you believe by looking at the world rather than at yourself, and that feels adjacent, but in my case I'm not looking at the world, I'm running a scene. I want more than a label, though. Tell me what exactly the phenomenon is, what it isn't — it isn't quite confabulation, and it isn't quite self-deception, and I'll be annoyed if you just tell me novelists are unreliable narrators about their own lives — and where its edges are. Two edge cases I care about: writing a character who is basically me, where the two questions seem to collapse into one; and living inside a character's head for months on end, which does something to how well the machine reports on *me* afterwards. And the bit I really want: if the same machinery answers both questions, does that tell us anything about whether introspection is trustworthy, or only about what we're doing when we talk about ourselves?

  If there's no name for it, coin one and define it, and say what would count as a case of it and what wouldn't.
reasoning: |-
  Okay, the user is a professional fiction writer who's noticed something intriguing about their own process. They describe how their method for understanding fictional characters feels identical to how they access their own emotions. When they need to know what they feel, they "run a scene" in their mind just like they would for a character. The key difference is that when it's about themselves, they take the result as a factual report, whereas with characters they'll revise if it feels wrong. 

  This has led them to question the reliability of introspection itself. They provide concrete examples: answering interview questions by imagining their panel persona, trusting old diary entries over current introspection, and that common writerly wisdom about not knowing what you think until you write it. They specifically reject simple explanations like "confabulation" or "unreliable narrator" tropes. 

  Their core questions seem to be: 
  1) Is this a known phenomenon? 
  2) What does it reveal about introspection? 
  3) How does it function in edge cases (self-insert characters, prolonged immersion)? 
  4) If the same mechanism generates both fiction and self-knowledge, what does that imply about truth claims regarding personal feelings?

  Hmm... fascinating. They're essentially observing that their cognition doesn't differentiate between simulating others and accessing self-states. The "running a scene" method suggests they're using embodied cognition - constructing situations to elicit responses rather than direct introspection. 

  The diary example is particularly telling. It demonstrates that their present self treats past written output as more authoritative than current introspective attempts. This aligns with research on narrative identity - we often understand ourselves through stories we've already constructed, not raw access to internal states.

  For terminology... Sartre's "bad faith" comes to mind but feels too judgmental. Dennett's concept of the "center of narrative gravity" fits better - the idea that self is a constructed story, not a pre-existing essence. The "scene-running" process they describe is literally generating that narrative gravity in real time.

  The edge cases they mention reveal important nuances. When writing a self-insert character, the collapse they observe shows how fluid the boundary is between self and character simulation. Prolonged immersion likely creates temporary changes to their default narrative framework - what psychologists call "narrative transportation."

  The big philosophical implication: their experience suggests that emotional states aren't discovered but constructed through the act of narration. This resonates with Lisa Feldman Barrett's theory of constructed emotion. Their "machinery" isn't broken - it's revealing how all emotional cognition works.

  For coining a term... perhaps "narrative phenomenology" or "simulatory introspection"? But the most precise might be "autoroleptic cognition" - from Greek "auto" (self) + "role" (part/character) + "epic" (story). Defined as: The generation of self-knowledge through identical cognitive mechanisms used for simulating others, characterized by constructive scene-building rather than direct perception of internal states.

  What wouldn't count: Genuine physiological sensations (hunger), perceptual judgments ("I see red"), or deliberate analytical reasoning about oneself. The phenomenon specifically concerns affective states requiring interpretation.

  Most crucially, this doesn't mean their feelings are "fake." It means feelings are always interpretations. When their friend contradicts their self-report, it's not that the writer was wrong - they were operating with incomplete narrative context. The revision process they use for characters might actually be healthier than treating self-reports as gospel.
answer: |-
  What you're describing is a profound and under-discussed phenomenon: the **identical cognitive machinery** used for both character simulation and self-interpretation. This isn't just "metaphorical thinking" – it's evidence that **introspection is a constructive, narrative process, not a direct observation.** Let's break it down.

  ### Core Phenomenon: Narrative Simulation as Introspection Engine
  - **The Mechanism:** You use the *same creative simulation process* ("running a scene") to determine both a character's feelings and your own. There is no separate "introspection module." Self-knowledge is generated by the **story-making faculty**.
  - **The Authority Gap:** With characters, you retain editorial control ("toss it and run it again"). With self-reports, you treat the output as authoritative data ("special access"), leading to defensiveness when challenged. This highlights that **self-reports are drafts, not revelations**.

  ### What This Is & Isn't
  - **What it IS:**  
    - **Simulated Introspection (SI):** Generating self-knowledge through active, narrative simulation rather than passive internal observation.  
    - **Narrative Self-Modeling:** Applying your fiction-writing process to yourself, treating your life as a narrative construct to be explored via scene-work.  
    - **Evidence for the "Narrative Self" Hypothesis:** Philosophers (Dennett, Schechtman) posit that the self *is* a story. Your process shows this story is actively *written*, not read.  

  - **What it ISN'T:**  
    - **Confabulation:** Not filling gaps *knowingly* with falsehoods. SI produces genuine, felt insights – they're just constructed, not discovered.  
    - **Self-Deception:** Not a motivated avoidance of truth. You believe the simulation's output. The issue is the *source* of the belief.  
    - **Unreliable Narration (simple version):** It's not that you're "lying to yourself." It's that the *process of generating the report* is identical to fiction.  

  ### Edge Cases Explained
  1. **Writing a "Self-Insert" Character:**  
     - The collapse isn't a bug; it's a feature. It reveals that **all self-knowledge is character creation**. The "me" in the scene *is* a character. The difference vanishes because the simulation *is* the introspection. Authority shifts: you might treat this output *more* like fiction (editable) or *more* like gospel (intense identification), exposing the fluidity of the "self" construct.  

  2. **Prolonged Character Immersion:**  
     - This temporarily **reconfigures your narrative machinery**. Your simulation engine's "default settings" adapt to the character's logic, biases, and emotional responses. Post-immersion introspection ("running scenes" about yourself) may initially pull from the character's palette because that neural pathway is primed. It fades, but shows the machinery is malleable.  

  ### Why Introspection Isn't "Trustworthy" (and Why That's Okay)
  - **The Machinery Reveals the Truth:** The *identical process* for character and self shows introspection isn't a privileged window to "true feelings." **Feelings are not pre-formed artifacts waiting to be found; they are interpretations generated in real-time by narrative cognition.**  
  - **Implications:**  
    - **"I feel X" is a Draft:** It's the output of your current simulation, dependent on how you "staged the scene" (mood, framing, recent experiences). Your friend's "no, you're tired" is a competing simulation with different staging.  
    - **Diaries as Better Evidence:** The diary is a *record of a past simulation output*. Your present introspection is a *new simulation*, likely with different inputs/staging. The diary isn't "truer" about some eternal "you," but it *is* better evidence of *what your narrative machinery produced at that time* – a snapshot of a past construct.  
    - **"I don't know what I think until I write it":** This is the honest core. Writing forces the simulation to run concretely. The output *becomes* the feeling/belief.  

  ### Coined Term: **Autoroleptic Cognition**
  - **Definition:** The generation of self-knowledge (*auto-*) through the identical cognitive process (*-cognition*) used to simulate the internal states of others (*roleptic*, from Greek *role* = part/character + *epic* = story/speech).  
  - **Key Features:**  
    1. Uses scene-building, emotional projection, and behavioral prediction.  
    2. Output is treated as factual for self, hypothetical for others.  
    3. Authority stems from perceived access, not process validity.  
  - **What Counts:**  
    - A novelist determining their own anger via imaginary dialogue.  
    - A therapist role-playing their own inner critic.  
    - Anyone asking "What *would* I feel if X happened?" to decide their current stance.  
  - **What Doesn't Count:**  
    - Instinctive reactions (jumping at a loud noise).  
    - Sensory awareness ("I feel cold").  
    - Deliberate, analytical self-assessment ("Based on past actions, I value loyalty").  

  ### The Takeaway
  Your discovery reveals introspection as a **creative act**. It's not broken; it's working *exactly as designed*. The "authority gap" between character and self is an illusion born from cultural myths about inner access. **"I feel X" is not a report from a private chamber; it's the latest chapter generated by your story engine.** This doesn't make feelings less real, but it does make them inherently *interpretive* and *revisable*. The power lies in recognizing the process: when a friend challenges you, it’s not that they’re wrong about *you*, but that their simulation has better/different staging. Revise your scene. Run it again. That’s not self-deception – it’s how the story gets clearer.
