answer: |-
  ### 1. The disagreement as I see it  
  **Reformists** hold that robust cross-population variation in responses to philosophical vignettes (e.g., Gettier cases) defeats the evidential use of intuitions unless one group can be privileged. They concede that *some* variation might stem from noise (e.g., comprehension errors), but insist that *residual* variation (e.g., 66% surviving controls) reveals deep conceptual divergence. For them, the method of cases relies on shared intuitions; if those intuitions conflict irreconcilably, the method is either invalid or must be restricted to expert judgments argued for independently.  

  **Defensives** hold that what varies is surface-level *responses*, not the core *intuitions* or *competences* philosophers rely on. They concede that folk responses vary, but argue that trained philosophers access stable, reflective judgments that reveal conceptual structures (e.g., rank orderings). For them, the method of cases targets *competence*—how a concept structures cases—not threshold-based responses. Variation in thresholds (e.g., where to draw the "knowledge" line) is irrelevant if the comparative structure is invariant.  

  Both sides agree: (a) responses vary; (b) controls reduce but don’t eliminate variation; (c) the method of cases needs refinement. The core clash: Reformists see variation as *in-principle defeaters*; defensives see it as *implementation noise*.

  ---

  ### 2. Diagnoses Considered and Rejected  
  **Candidate 1: Purely empirical stalemate**  
  *Why reject?* The stipulations resolve key empirical ambiguities (e.g., rank-order invariance survives controls). If data alone could settle this, the high rank correlations should force convergence. They don’t, so the dispute isn’t just about facts.  

  **Candidate 2: Verbal dispute about "intuition"**  
  *Why reject?* Both sides agree "intuition" refers to pre-theoretic judgments. Defensives grant folk responses are unstable; reformists grant experts might refine them. The real fight is whether *any* response variation (after controls) threatens the method’s foundations. This is substantive, not semantic.  

  **Candidate 3: Standards of evidence clash**  
  *Why reject?* Reformists demand demographic invariance for evidence; defensives demand structural invariance. But both accept similar epistemic norms (e.g., consistency matters). The deeper issue is *which kind* of invariance—thresholds or orderings—bears evidential weight.  

  **Candidate 4: Bedrock intuition mismatch**  
  *Why reject?* This assumes sides have irreconcilable first principles (e.g., "variation always defeats" vs. "never does"). But both are moderates: reformists allow privileging experts; defensives allow noise matters. The impasse is *conditional*: when, if ever, does variation defeat?  

  ---

  ### 3. The Diagnosis  
  The impasse resides in **divergent conceptions of what the method of cases measures** and **which components of conceptual judgment are philosophically probative**.  

  - **Reformists** implicitly treat intuitions as *threshold verdicts* (e.g., "this is/is not knowledge"). Variation here (especially post-controls) suggests relativity, undermining universal claims.  
  - **Defensives** treat intuitions as *comparative competences* (e.g., rank orderings). Invariance here suggests conceptual universality, with thresholds as pragmatic/social add-ons.  

  Your tripartite model (response/threshold/ordering) is correct but incomplete. The dispute is **metaphilosophical**: what *kind* of intuition licenses philosophical claims? Reformists think verdicts reveal the concept’s boundaries; defensives think structures reveal its architecture. This is why neither side updates:  
  - Stipulated rank-order invariance (0.9+ correlations) lets defensives say: "See? Concepts are shared!"  
  - Residual threshold variation (31% vs. 68%) lets reformists say: "See? Applications are relative!"  

  **The question is ill-formed** because it conflates:  
  (a) *Descriptive* questions (what people judge)  
  (b) *Normative* questions (what judgments philosophy should use)  
  (c) *Semantic* questions (what judgments reflect "the concept")  

  Defensives win on (a): orderings are stable. Reformists win on (b): thresholds vary, so verdicts can’t be evidence without justification. But (c) is unanswerable without theory-laden criteria for "concept identity."  

  ---

  ### 4. What Your Stipulated Results Do and Don’t Show  
  **Load-bearing results:**  
  - **Rank-order invariance (Result 2):** Strongest evidence for defensives. Shows populations share the *structure* of knowledge (Gettier as intermediate between clear cases). This undermines reformists’ claim that variation implies conceptual divergence.  
  - **Threshold divergence (Results 1, 3, 4):** Supports reformists *only if* thresholds are probative. Result 3 (divergence only on intermediates) shows this is *graded-concept noise*, not radical disagreement.  
  - **Side-effect cases (Result 5):** Fatal to defensives. Here, variation survives all controls *and* likely reflects divergent orderings (e.g., harm vs. help asymmetry may not be universal). Reformists can weaponize this.  

  **Red herrings:**  
  - Failed replications of early effects: Irrelevant under your stipulations.  
  - Comprehension checks: Residual variation (Result 4) shows they don’t resolve the dispute.  

  **Coherence check:** All results cohere. Orderings can be invariant while thresholds vary (Results 1–4). Side-effect cases (Result 5) show some intuitions *can* vary structurally, proving thresholds and orderings can decouple.  

  ---

  ### 5. What Would Count as Progress  
  **Progress:**  
  - **Formalize the competence/structure distinction.** Instead of asking "do intuitions vary?", ask: *Under what conditions do thresholds diverge while orderings converge?* Design studies mapping conceptual topographies (e.g., multidimensional scaling of cases) across populations. If orderings cluster by culture *only* where moral/social factors are salient (e.g., side-effects), that isolates culturally embedded concepts.  
  - **Reframe the question:** "Which components of judgment are *revisable* versus *fixed* in philosophical reflection?" If experts converge on orderings but not thresholds under dialectical pressure, thresholds are pragmatic, not conceptual.  
  - **Measure expert vs. folk invariance.** If trained philosophers exhibit threshold variation but ordering invariance, defensives win; if both vary, reformists win.  

  **Not progress (but common):**  
  - More controls (e.g., finer comprehension checks). Result 4 shows diminishing returns.  
  - Larger samples. Effect sizes here are robust but philosophically ambiguous.  
  - Debating "what intuition really is." This is circular. Instead, *use* variation: if thresholds shift under contextual primes (e.g., epistemic urgency) but orderings don’t, thresholds are context-sensitive parameters.  

  ---

  ### 6. Bottom Line  
  Your framing is largely correct: the stalemate arises because "intuition" conflates threshold sensitivity and structural competence. Defensives are wrong to dismiss *all* variation as noise—side-effect cases show genuine conceptual divergence. But reformists are wrong to treat *threshold* variation as defeating—Gettier data show shared structure. The real threat is that the method of cases has *always* measured thresholds, mistaking pragmatic cut-offs for conceptual essences. Progress requires abandoning the "variation as defeater" framework and asking: *What invariant structures govern concept application, and how do thresholds interact with them?* If orderings are robust, philosophy can proceed—but only by deriving norms from structures, not verdicts.
