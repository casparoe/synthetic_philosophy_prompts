prompt: |-
  My housemate is the person everyone on our floor goes to when they want to know if someone was out of line, and she's very consistent-sounding about when being a hypocrite costs you the right to blame. Call her H. Her rulings so far:

  - Kev, who shoplifted last year and told no one, tearing into a flatmate for stealing milk from the office fridge: no standing, she can just ignore him.
  - Mara, two years sober, telling her friend her drinking is out of control: has standing. "She's the one person who's earned it."
  - Tom, who ghosted two people three years ago and never apologised, publicly shaming his ex for ghosting him: no standing.
  - Nadia, who eats beef and freely admits it, signing a petition against a dog-meat festival: no standing unless she stops or at least owns it.
  - Anyone chronically late calling out a colleague's lateness: no standing, unless she's raising it because the client complained, in which case its fine because she's only relaying.
  - A woman who cheated on her boyfriend calling out a friend for lying to hers: has standing, different fault, different norm.

  She also insists the blame can be completely true and still be something you're not entitled to say out loud.

  Three cases landing this week: (1) my brother, who drove drunk once about five years ago, was never caught, never told anyone and quietly stopped, now telling his 17-year-old son he loses the car if he ever drives after drinking; (2) a union rep who crossed a picket line in 2019 and never apologised, now running the strike and calling out colleagues who cross it; (3) our building's recycling enforcer, who sorts meticulously but flies long-haul three times a year, berating neighbours for not sorting.

  What does H say in each, what rule (or rules) is she implicitly running, and what further case would best tell those rules apart? Please also say how confident you are in each prediction and flag the one claim you're least sure of.
reasoning: |-
  Hmm, the user is describing their housemate H's approach to determining when someone has "standing" to criticize others based on past hypocritical behavior. They've provided several examples of H's previous rulings and now want me to analyze three new cases through H's framework.

  Looking at H's established rulings, I notice several patterns emerging. First, hypocrisy seems to be a key factor - if you've done the same thing you're criticizing others for, you lose standing. But it's not absolute. There are nuances like whether you've changed your behavior (Nadia needs to stop eating beef or own it), whether the faults are similar (the cheating vs lying case), and the context or motivation for the criticism (the chronic lateness case where relaying a client complaint is acceptable).

  Now for the three new cases:

  For the drunk driving father, I think H would grant standing. He quietly stopped the behavior years ago, never got caught, and is giving a warning to his son. This seems similar to Mara's case where past behavior doesn't necessarily disqualify someone from speaking on the issue now. The father has demonstrated change.

  The union rep case is trickier. Crossing a picket line in the past is the exact same offense he's criticizing now. This feels like Tom's case with ghosting - same fault, no apology. Unless there's some nuance about union roles I'm missing, H would likely say no standing.

  The recycling enforcer is interesting. Frequent flying contributes to environmental harm while berating others for recycling failures. But H's beef/dog-meat case suggests inconsistency matters. Unless the enforcer offsets flights or admits hypocrisy, no standing. The scale difference between recycling and flying might matter too.

  I'm least confident about the union rep case. There might be arguments about organizational roles or changed circumstances that could affect H's ruling. The father case seems clearest - changed behavior creates standing. 

  For testing H's rules, a good case would be someone who committed a minor version of an offense criticizing someone for a major version (like a one-time cheater condemning a serial cheater). That would help determine if H considers the magnitude or severity of the hypocrisy.

  I'll structure my response to analyze each case, identify the underlying rules, suggest a test case, and note my confidence levels - being most uncertain about the union scenario.
answer: |-
  Based on H's established rulings and principles, here's the prediction for each case, the implicit rules, a test case, and confidence levels:

  **H's Likely Rulings:**

  1.  **Drunk Driving Father:** **Has standing.** H would likely say the father can legitimately warn his son.
      *   **Reasoning:** This mirrors Mara's case (sober person criticizing drinking) and the cheating/lying distinction. The father's past transgression (DUI) is the *same fault* as what he's warning against. However, key factors align with H's leniency:
          *   **Quietly Stopped & Changed:** He demonstrably changed his behavior ("quietly stopped"), showing personal reform without needing public confession (unlike Kev/Tom/Nadia who didn't change/apologize/own it).
          *   **Private Context:** This is a parental warning to a child about safety, not a public shaming. H's "relaying" principle (chronic lateness/client complaint) suggests the context and motivation matter.
          *   **Severity & Time:** The act was serious, but it was a single incident long ago, and he took responsibility by stopping. He's not currently engaging in the behavior.
      *   **Rule(s):** *Reformed individuals who have demonstrably stopped the specific behavior gain standing to warn others about that same behavior, especially in a private, protective context.* Combines elements of Mara (earned standing through change/reform) and the lateness/client exception (context matters).
      *   **Confidence:** High (85%). Fits the reform and context principles well.

  2.  **Union Rep:** **No standing.** H would likely say the rep lacks standing to call out colleagues for crossing the picket line.
      *   **Reasoning:** This is directly analogous to Tom's ghosting case and Kev's shoplifting case. The rep committed the *exact same fault* (crossing the picket line) that they are now condemning others for. Crucially:
          *   **No Apology/Amends:** Like Tom, they never apologized or made amends for their past transgression.
          *   **Same Norm, Same Fault:** They are enforcing the *identical norm* they previously violated. This is core hypocrisy.
          *   **Position of Authority:** Being in charge ("running the strike") likely makes the hypocrisy *more* egregious to H, not less. It's similar to Kev tearing into a flatmate.
      *   **Rule(s):** *Committing the exact same fault against the same norm without apology or amends destroys standing to blame others for that same fault.* (Tom, Kev, Nadia - without change/ownership). *Positional authority doesn't grant standing if core hypocrisy exists.*
      *   **Confidence:** Very High (95%). This is the clearest case of "same fault, same norm" hypocrisy without remediation.

  3.  **Recycling Enforcer:** **No standing.** H would likely say the enforcer cannot berate neighbors over recycling.
      *   **Reasoning:** This strongly resembles Nadia's beef/dog-meat case. Both involve:
          *   **Consistent Current Hypocrisy:** The enforcer *currently* engages in behavior (frequent long-haul flying) that significantly undermines the environmental principle they are aggressively enforcing (recycling) regarding waste/impact. Like Nadia eating beef while opposing dog meat, it's inconsistency within a broader value system (environmentalism/ethical consumption).
          *   **No Ownership:** The enforcer berates others but presumably doesn't preface it with, "Look, I know my flights are terrible, but...". They lack the "own it" clause H required for Nadia.
          *   **Scale & Impact:** While not identical actions, H would likely see the massive carbon footprint of frequent flying as fundamentally conflicting with the moral high ground of strict recycling enforcement, making the criticism hypocritical. Berating amplifies the hypocrisy.
      *   **Rule(s):** *Active, significant inconsistency within a broader value domain (e.g., environmentalism, ethical treatment) destroys standing to enforce specific norms within that domain, unless the inconsistency is openly acknowledged ("own it").* (Nadia). *The scale of the inconsistency matters.*
      *   **Confidence:** Medium-High (75%). The "different specific actions but same value domain" rule is clear from Nadia. Less sure about whether H would consider the *scale* of the flying vs. recycling impact sufficient to trigger the rule as strongly as eating beef vs. opposing dog meat, or if she'd see them as too different.

  **H's Implicit Core Rules:**

  1.  **The Core Hypocrisy Rule:** You lose standing to blame someone for Fault X if you have committed Fault X yourself *and* haven't taken meaningful steps to address it (stopped, apologized, made amends, "owned it").
  2.  **The Specificity Corollary:** Faults must be substantially similar/the same ("same fault, same norm") for hypocrisy to destroy standing. Criticizing a *different* fault (Mara on drinking vs. her past, cheating vs. lying) preserves standing.
  3.  **The Reform Exception:** Demonstrably reforming *from the specific fault* (stopping the behavior) can restore standing, especially in contexts of warning or protection. Public confession isn't always required (Father).
  4.  **The Ownership Exception:** For inconsistencies within a *broader value domain* (Nadia, Enforcer), standing *can* be preserved if the critic openly acknowledges their own inconsistency ("own it").
  5.  **The Context Principle:** The setting and motivation matter. Relaying a third-party complaint (lateness/client) or a private parental warning (Father) can be permissible even if some hypocrisy might exist, whereas public shaming (Tom) or berating (Enforcer) is less likely to be tolerated.
  6.  **Truth ≠ Entitlement:** The accuracy of the blame is separate from the right to voice it. Hypocrisy doesn't make the *blame* false, but it can make the *blamer* unentitled to say it.

  **Test Case to Distinguish Rules:**

  *   **Scenario:** Alex, who was fired for falsifying expense reports 8 years ago (a single incident, never repeated, never caught, never told anyone), discovers a junior colleague, Sam, is plagiarizing client reports. Alex reports Sam to their manager.
  *   **Why it tests the rules:**
      *   **Core Hypocrisy vs. Reform:** Is Alex's long-past, unrepeated, unreformed (no confession/amends) but *changed* behavior (never did it again) sufficient "reform" like the Father, or is the lack of remediation like Tom/Kev/Rep? Does the context (reporting to a manager vs. public shaming) matter like the Father or lateness/client?
      *   **Specificity:** Are falsifying expenses and plagiarism sufficiently "the same fault" (dishonesty/professional misconduct) or "different faults" (like cheating vs. lying)? Does the severity matter?
      *   **Ownership:** Would H require Alex to "own" their past to the manager when reporting Sam?
  *   **Predicting H:** This is ambiguous and would reveal H's weighting. If H says **No Standing**, she prioritizes *Core Hypocrisy + Lack of Remediation* over *Reform via changed behavior* and sees the faults as similar. If H says **Has Standing**, she prioritizes *Reform via changed behavior + Different Specific Faults + Context (managerial reporting)* over the lack of explicit remediation and potential similarity in dishonesty. If she says **Only if Alex 'owns it' (to the manager)**, she applies the *Ownership Exception* to inconsistencies within professional honesty.

  **Confidence Summary & Least Sure Claim:**

  *   **Drunk Driving Father (Has Standing):** High Confidence (85%)
  *   **Union Rep (No Standing):** Very High Confidence (95%) - **Most Confident**
  *   **Recycling Enforcer (No Standing):** Medium-High Confidence (75%) - **Least Confident Claim**

  **Why the Recycling Enforcer is Least Confident:** While Nadia's case strongly suggests "no standing," the *difference* between eating beef (common, culturally accepted where Nadia is) and opposing dog meat (uncommon, culturally condemned where she is) vs. the *difference* between recycling (small individual impact) and long-haul flights (large individual impact) within environmentalism is less clear-cut. H *might* argue the enforcer's flights are so environmentally destructive that they completely negate the moral authority for recycling enforcement (likely ruling "no standing"). However, there's a small chance H could see them as distinct enough issues ("personal convenience travel" vs. "waste management diligence") that the hypocrisy isn't direct enough, though the berating makes this unlikely. Nadia's case and the principle of "owning it" strongly point to "no standing," but the dissimilarity in specific actions creates a slight ambiguity compared to the crystal-clear hypocrisy in the Union Rep case.
