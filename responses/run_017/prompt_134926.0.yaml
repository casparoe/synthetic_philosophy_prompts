prompt: |-
  Hey — I need a hand turning a half-formed idea into an actual funding proposal.

  Background on me: backend engineer, ~12 years, no philosophy training beyond an undergrad logic course I mostly slept through. I've got a shot at a small six-month independent-project grant: part-time, call it 10 hrs a week, deliverable is a ~6000-word working paper plus a one-page thing a practitioner could actually use.

  The topic I want to work on is the old fight about whether it's fine for a scientific model to rest on assumptions everyone knows are false. The Friedman version from the 1950s: he says, roughly, that the assumptions of a really important hypothesis will be wildly inaccurate as descriptions of reality, and that this doesn't count against it — what counts is whether it predicts (I've seen people call this the F-twist). His defenders say the unrealism is a feature, not a bug; his critics say a model built on known falsehoods can't really explain anything, only save the phenomena. Every summary I read of the debate has it going around the same loop, and I want to know if there's a way in that isn't just picking a side.

  My half-formed idea comes straight from my day job. I think both camps are treating "false assumption" as one kind of thing, and in software we learned to split it:

  - Inert: the falsehood is like a stub or dead code. Nothing the model gets right depends on it.
  - Compensated: the falsehood is load-bearing, but it's cancelled by another falsehood somewhere else — two bugs cancelling. Right answers, wrong reasons, and it collapses the moment you move the model to a new context.
  - Constitutive: the false bit is doing the actual work. Take it out and you don't get a better model, you get no model.

  The reason I care: in my job the difference between the first two is invisible as long as you stay inside the regime you tested in, and then it bites hard when you port the thing. I suspect the philosophers' fight is really three fights and nobody noticed.

  My own tentative principle, which I half like and half don't: a false assumption is harmless iff you could disclose it to whoever's using the model — tell them plainly which bit is false and how — and they'd still be entitled to the inferences they're drawing. I worry it's circular (entitled by what standard?) and I'm not sure it handles the constitutive cases at all.

  What I need in the proposal: the question stated tightly enough that it has a determinate answer; why the existing positions leave it open; what I'd actually do month by month; why this route rather than the obvious ones (a general theory of model-world similarity? just cataloguing idealizations? a formal measure of truthlikeness?); what each possible conclusion would look like and what would decide between them; what would count as the project having failed; and an honest scope.

  Cases I had in mind: frictionless planes and point masses in textbook mechanics; the "everyone mixes with everyone evenly" assumption in epidemic compartment models; the as-if profit-maximizing firm (Friedman's own example, so it has to be in there); and one from my own work, a ranking model that assumed user behaviour was independent of what the model showed people — fine-ish offline, not fine once we shipped, because shipping changed the thing being modelled. Four is definately too many for 10 hrs a week; tell me which to cut and why.

  Two more things. Please commit: give me a definite position on which of my three categories does the real philosophical work, whether this ends up vindicating Friedman, vindicating his critics, or dissolving the argument — and tell me which of my own commitments you think is wrong and has to go. Don't hand me a menu of options, and flag where you think I'm most likely to be full of it. Also: no citations or reading list, I'll get a philosopher friend to help with references — argue the positions, don't name-drop papers.

  (I also have a vague memory of technical results showing that representative-agent models in economics can't be cleanly derived from individual behaviour. I might be misremembering it, so build the proposal so it doesn't lean on that.)
reasoning: |-
  Okay, the user is a backend engineer with 12 years of experience who wants to turn a half-formed idea into a funding proposal. Their idea challenges the long-standing debate about false assumptions in scientific models, inspired by their experience in software engineering. They've identified three types of false assumptions: inert, compensated, and constitutive, and believe this distinction could clarify the philosophical stalemate.

  I need to help them craft a tight proposal that addresses all the required components. First, the core question needs to be sharpened. Instead of asking whether false assumptions are acceptable, we should focus on when they're harmless. This shifts the debate from justification to harmlessness conditions, which aligns better with their software analogy.

  The existing philosophical positions are stuck because both sides treat all false assumptions as the same. By introducing a taxonomy based on how false assumptions function within models, we can show that the debate conflates three distinct issues. For example, inert falsehoods might be harmless, while compensated ones are context-dependent, and constitutive ones are necessary but potentially problematic.

  For the methodology, a case study approach seems practical given their time constraints. They should focus on frictionless planes and the as-if profit-maximizing firm. Frictionless planes are a clear example of a constitutive falsehood that's widely accepted, while the firm example ties directly to Friedman and shows compensated falsehoods. The epidemic model and their ranking model can be mentioned but not deeply analyzed to save time.

  Their tentative principle about disclosure has potential but needs refinement. Instead of "entitled to inferences," it should focus on whether disclosing the falsehood would change the user's reliance on the model. This avoids circularity and emphasizes pragmatic harm rather than epistemic justification.

  I think the constitutive category does the heaviest philosophical lifting. It explains why some false assumptions are indispensable, challenging both Friedman's critics (who say falsehoods can't explain) and his defenders (who overlook that some falsehoods are necessary rather than convenient). This could dissolve the debate by showing that the real issue isn't truth but functionality.

  They should drop the epidemic model and their ranking example from deep analysis. The epidemic model is complex and involves emergent properties, which might muddy the waters. Their personal example is valuable but too niche; it's better as a footnote for future work. Focusing on physics and economics keeps the scope manageable and directly engages Friedman.

  The proposal should argue that existing approaches miss functional distinctions. Truthlikeness measures or catalogs of idealizations don't address how falsehoods operate within models. Their software-inspired taxonomy offers a novel lens that's grounded in practical model-building.

  Possible outcomes: vindicating Friedman for inert/constitutive cases, vindicating critics for compensated ones, or dissolving the debate by showing it's about functionality, not truth. Failure would mean the taxonomy doesn't map onto real cases or that disclosure doesn't track harm.

  Their most vulnerable point is the disclosure principle. It risks circularity and may not handle constitutive cases well. They should frame it as a pragmatic test rather than an epistemic rule. Also, they should acknowledge that harmlessness is context-dependent, avoiding overgeneralization.

  In the monthly plan, initial literature review should be minimal, focusing on Friedman and key critiques. Case studies should dominate. Writing should integrate insights early, with the practitioner summary crystallizing the taxonomy's actionable aspects.

  Honest scope: This won't solve all model-reality gaps but offers a diagnostic tool. It's a working paper, not a grand theory, with clear boundaries around the cases analyzed.
answer: |-
  Here’s a razor-focused proposal structure built around your core insight, with decisive positions and ruthless cuts. I’ll argue *why* this framing cuts the knot instead of rehashing the fight.

  **1. Core Question (Sharpened):**  
  *Under what conditions do known-false assumptions in scientific models harmlessly generate reliable inferences, and when do they covertly undermine the model’s explanatory power or portability?*  
  *(Why determinate? It shifts from "Is it okay?" to "When does it fail?" – a question your taxonomy can answer.)*

  **2. Why Existing Positions Leave It Open:**  
  Friedman’s F-Twist focuses *only* on predictive success as the sole criterion, ignoring *how* false assumptions function internally. His critics (e.g., realists) often reject *all* known-false assumptions as explanatory failures, treating them uniformly as "lies." **Both sides miss the functional heterogeneity of falsehoods within models.** Your software-inspired taxonomy reveals this blind spot.

  **3. The Taxonomy is the Key (Definite Position):**  
  *   **Inert:** Philosophically uninteresting. Removal is cleanup. Vindicates Friedman *trivially* – these falsehoods *are* harmless. But they’re rare in contentious debates.  
  *   **Compensated:** **Does the heaviest philosophical lifting.** This is the hidden fault line. It explains *why* models fail upon context shift (like your ranking model). Friedman’s F-Twist *fails* here because prediction holds *only* in the original context. Critics are *vindicated* for claiming these models don’t genuinely explain – they’re fragile hacks.  
  *   **Constitutive:** Justifies Friedman’s core intuition *best*. These aren't "bugs" but essential abstractions (like frictionless planes). Removing them destroys the model’s core explanatory structure. Critics are wrong to demand "realism" here – the *idealization itself does the work*.  

  **4. Your Tentative Principle (And Why It Needs Surgery):**  
  *   **What’s Right:** The "disclosure" intuition targets **harmlessness-in-use**. It’s pragmatic and user-focused.  
  *   **What’s Wrong & Must Go:** The "entitled to inferences" clause. It *is* circular and vague. **Replace it with:** *"A false assumption is harmless iff its disclosure to a competent user would **not rationally compel them to discount or restrict the model’s inferences** within its intended domain."*  
      *   **Inert/Constitutive:** Disclosure doesn’t compel discounting (it’s irrelevant or essential).  
      *   **Compensated:** Disclosure *should* compel discounting/restriction because success is context-locked. This aligns harmlessness with robustness.

  **5. Why This Route (Not Obvious Alternatives):**  
  *   **Not Truthlikeness/Similarity:** Measures overall fit, not *how specific falsehoods function*. A model can be truthlike *despite* a compensated falsehood (until it breaks).  
  *   **Not Cataloguing Idealizations:** Lists types (negligibility, isolation, etc.) but doesn’t diagnose *how they fail* (e.g., a negligibility assumption could be inert OR compensated).  
  *   **Not Derivation Failures (e.g., rep. agents):** Important, but orthogonal. Your taxonomy applies *regardless* of whether a reduction is possible.  
  *   **THIS ROUTE:** Offers a **functional diagnostic tool** for model builders/users. It explains *why* and *when* falsehoods cause failures, linking directly to practice.

  **6. What You’d Do (10 hrs/week Reality Check):**  
  *   **Month 1:** Deep dive into **Friedman’s original essay & 1-2 key critiques** (e.g., Hausman). Extract core arguments *only* related to false assumptions. **Define/refine taxonomy criteria.**  
  *   **Month 2:** **Case Study 1: Textbook Mechanics (Frictionless Planes/Point Masses)** – Analyze constitutive role. Is disclosure harmless?  
  *   **Month 3:** **Case Study 2: As-If Profit Maximization** – Is this constitutive (Friedman) or compensated (critics)? Test disclosure principle.  
  *   **Month 4:** **Analyze Compensated Failure:** Use **your ranking model example** (briefly) to show *how* disclosure *should* compel restriction. Contrast with mechanics.  
  *   **Month 5:** Synthesize findings. Draft core argument: **The debate dissolves; harmlessness depends on functional role (especially compensated vs. constitutive).**  
  *   **Month 6:** Write Working Paper & **1-Page Practitioner Tool:** "Diagnosing Your Model's False Assumptions: Inert, Compensated, or Constitutive?" (With flowcharts/examples).

  **7. Cases: Cut to TWO. Why?**  
  *   **KEEP:**  
      *   **Frictionless Planes (Physics):** Clear, uncontested example of **Constitutive** falsehood. Essential baseline.  
      *   **As-If Profit Maximization (Economics):** **THE** Friedman example. Prime candidate for **Compensated** falsehood (critics) OR **Constitutive** (Friedman). Analysis here *is* the project's core.  
  *   **CUT:**  
      *   **Epidemic "Well-Mixed" Assumption:** Too complex (mixes negligibility, aggregation, dynamics). SIR models fail in ways not *cleanly* mapped to your taxonomy yet (emergent properties). Distraction.  
      *   **Your Ranking Model:** Vital for your insight, but too niche/specific for a *general* proposal. **Mention it briefly** as the genesis and an example of compensated failure, but don’t deep-dive. Save words/time.  
  *(4 cases at 10 hrs/week = surface-level mush. 2 deep dives deliver.)*

  **8. Possible Conclusions & Deciders:**  
  *   **Conclusion A (Likely):** F-Twist is partially right (Constitutive good) but dangerously wrong (Compensated bad). Critics are right about fragility but wrong to reject idealization wholesale. **The debate dissolves.**  
  *   **Conclusion B:** Compensated falsehoods are more pervasive than thought; F-Twist is mostly flawed. Critics vindicated.  
  *   **Conclusion C:** Constitutive cases dominate; F-Twist largely stands (unlikely).  
  *   **Decider:** Does analysis of *as-if profit max* reveal it as **Compensated** (success dependent on unstated context, collapses under disclosure) or **Constitutive** (disclosure doesn't undermine core inferences)? **Your ranking model failure is evidence for Compensated.**

  **9. Failure Criteria (Honest Scope):**  
  *   The taxonomy doesn’t cleanly map onto the key cases (e.g., profit max resists categorization).  
  *   Disclosure principle proves incoherent or doesn’t track harm.  
  *   "Intended domain" is too vague to make the compensated/constitutive distinction operational.  
  *   **Scope Limit:** This is not a *general* theory of scientific modeling. It focuses *only* on the harmfulness of *known-false* assumptions within inference-generating models. It doesn’t solve truthlikeness or reduction.

  **10. Where You're Most Vulnerable (Full of It?):**  
  1.  **The Disclosure Principle:** It’s still the shakiest part. Can "competent user" be defined? Does "rationally compel discounting" avoid circularity? **Mitigation:** Ground it in *pragmatic* model use (e.g., "Would disclosing this assumption change how you *act* on the inference?").  
  2.  **Overclaiming Dissolution:** Philosophers love their trenches. Arguing the taxonomy *dissolves* the debate might be seen as arrogant. **Mitigation:** Position it as "reframing" or "resolving a false dichotomy."  
  3.  **Software Analogy Overreach:** Not all scientific models are software. **Mitigation:** Explicitly state the analogy is *heuristic* for revealing functional roles, not literal.

  **The Core Punchline:**  
  **Friedman was right about constitutive falsehoods (they’re essential tools) but catastrophically wrong to ignore compensated falsehoods (they create fragile, non-explanatory models). His critics were right about the danger of falsehoods but wrong to condemn all idealizations. The taxonomy dissolves the binary fight by showing *which kind* of falsehood matters *how*. The practitioner takeaway: Hunt for Compensated falsehoods – they’re the landmines.**

  **Next Step:** Write the proposal draft using this skeleton. Hammer the **Inert/Compensated/Constitutive** distinction and the **disclosure test** hard. Let the cases illustrate it. Be brutal about scope. Good luck!
