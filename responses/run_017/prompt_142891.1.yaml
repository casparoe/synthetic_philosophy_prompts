  First angle: Applying Sartre to Milgram. Need to surgically separate:
  - Ordinary self-deception: "I'm helping science" (surface motive)
  - Bad faith: Fleeing freedom by pretending obedience is necessary ("You have no choice" prod reveals this)
  - Spirit of seriousness: Treating lab hierarchy as sacred (Yale setting amplifies this)

  Key evidence: Subjects who verbalize conflict ("Should I stop? But he says I must...") show they *know* they're choosing. That's bad faith, not mere deception. The Bridgeport variation weakening obedience suggests the "sacred" context matters—so spirit of seriousness is comorbid. 

  Second angle: Milgram vs. Sartre's radical freedom. 
