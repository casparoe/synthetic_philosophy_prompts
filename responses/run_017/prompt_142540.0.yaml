answer: |-
  Below is a structured table of desiderata for an account of conspiracy theories, designed for non-specialists making pre-outcome judgments. The requirements are derived from your specified phenomena, with motivations and negotiability indicated.  

  ### Desiderata for an Epistemic Account of Conspiracies  
  | Requirement (Short Label)              | Motivation (Case/Datum)                                                                                                | Negotiability           |  
  |----------------------------------------|------------------------------------------------------------------------------------------------------------------------|-------------------------|  
  | **1. Pre-Outcome Constraint**          | Real conspiracies (e.g., Watergate, Tuskegee) were dismissed initially but later verified. Judgments cannot rely on hindsight or build "unwarrantedness" into the definition. | Non-negotiable          |  
  | **2. Anti-Escalation Criterion**       | Theories that treat denial/absence of evidence as confirmation (e.g., "crisis actors" after shootings) evade rational engagement. Must specify *why* this is defective (e.g., violates Bayesian updating, severs theory from observable consequences). | Non-negotiable          |  
  | **3. Scale Sensitivity**               | Plots vary in size/complexity (e.g., 3-person burglary vs. decades-long COINTELPRO). Must expect differing traces (e.g., digital footprints, witness numbers) and adjust burdens of proof accordingly. | Non-negotiable          |  
  | **4. Adjudication Gap Resolution**     | Claims often accuse institutions of complicity (e.g., "FDA is bribed"), voiding deference to experts. Must offer non-circular heuristics for evaluating claims without collapsing into universal skepticism (e.g., cross-institutional redundancy, forensic consistency). | Non-negotiable          |  
  | **5. Evidentiary Vulnerability**       | Ubiquitous forgeries (e.g., "Pizzagate" emails) mean "smoking guns" are unreliable. Must distinguish genuine leaks (e.g., via chain of custody, metadata) *or* concede indeterminacy and clarify costs (e.g., higher thresholds for decisive evidence). | Preference (context-dependent) |  
  | **6. Claim-vs-Inquiry Distinction**    | A true claim can emerge from epistemically toxic communities (e.g., valid criticism amplified by cultish movements), and vice versa. Must clarify whether it evaluates the *proposition*, the *inquiry process*, or both, and how to act when they diverge (e.g., "assert but disengage from source"). | Non-negotiable          |  

  ---

  ### Analysis of Tensions and Approaches  
  **Suspected Irreconcilable Tensions**:  
  - **Adjudication Gap Resolution + Evidentiary Vulnerability**: Resolving the adjudication gap often relies on institutional or cross-source verification, but Evidentiary Vulnerability undermines trust in sources. This may force accounts into either untenable universal skepticism (*if* demanding certainty) or underdetermined guesswork (*if* conceding indeterminacy).  
  - **Claim-vs-Inquiry Distinction + Pre-Outcome Constraint**: Evaluating inquiry processes (e.g., community reliability) often uses historical patterns, risking outcome bias. Yet Pre-Outcome Constraint forbids relying on future outcomes.  

  **Generalist vs. Particularist Performance**:  
  - **Generalist accounts** (conspiracy theories carry inherent defects) struggle with **Pre-Outcome Constraint** (real conspiracies exist) and **Adjudication Gap Resolution** (cannot explain how laypeople verify claims sans institutions).  
  - **Particularist accounts** (assess like any claim) fail **Adjudication Gap Resolution** (presume functional institutions) and **Anti-Escalation Criterion** (lack tools to diagnose escalation structures).  

  **Most Exclusionary Requirement**:  
  **Adjudication Gap Resolution** excludes otherwise viable accounts (e.g., particularism, expert-deference models) by demanding non-institutional verification heuristics—a "bootstrapping" problem few frameworks solve.  

  \answer{most exclusionary: Adjudication Gap | unsatisfiable: Adjudication Gap + Evidentiary Vulnerability}
