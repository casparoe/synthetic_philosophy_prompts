  - Verification debt: the cumulative unchecked commitments the reviewer accepts. We fear it grows faster than the attention budget.
  - Peel test: the reviewer can demand unpacking one claim one level at a time and can only hold a few claims in view. The protocol must reject arguments that appear locally sound but are globally unsound, using only the reviewer's limited view.
  - Substituted-lemma test: if we swap a critical lemma with an equally plausible falsehood and the reviewer's confidence doesn't change, then the protocol fails because the reviewer is tracking style, not content.

  We want desiderata (requirements) for the protocol, with each requirement motivated by a concrete scenario we must design against. We also want:
  - Mark non-negotiable vs. aesthetic preferences.
  - Identify any conflicts (if a subset is unsatisfiable).
  - Which requirement excludes the most protocols?
