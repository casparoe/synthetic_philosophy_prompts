answer: |-
  ### Desiderata for Obfuscation-Resistant Oversight Protocol

  Below are the requirements (desiderata) that any debate-based oversight protocol must satisfy to be trustworthy against obfuscated arguments in your setting. Each requirement is defined by:
  - **Concrete scenario motivating the requirement**: A realistic failure case that necessitates the requirement.
  - **Why design against this scenario**: The operational or financial impact if unaddressed, aligning with your constraints (e.g., false accepts cost more, reviewer effort is bounded).
  - **Non-negotiable status**: Whether the requirement is essential for soundness (non-negotiable) or a preference that could be relaxed without catastrophic failure (aesthetic). Non-negotiables are critical for preventing obfuscation-induced failures; aesthetic preferences often reflect biases toward idealized debate formats.

  The requirements are ordered by criticality, with the most exclusionary one highlighted at the end.

  #### **1. Bounded Verification Debt Growth**
  - **Scenario**: Proposer submits a 100-step argument where each step introduces 3 new unchecked commitments (e.g., lemmas, assumptions) while resolving only one. Debt grows linearly (e.g., +2 per step). After 50 steps, debt reaches 100 unchecked commitments. The reviewer, with a fixed 10-minute budget, cannot scrutinize all commitments, so they approve the argument despite a fatal flaw buried at step 75. The flaw causes a costly failure (e.g., service outage) within a day.
  - **Why design against**: Verification debt that scales with argument length guarantees degradation of soundness over time. Unbounded growth makes the protocol intrinsically vulnerable to obfuscation, as longer arguments become statistically safer for attackers. False accepts are expensive; this enables them systematically.
  - **Non-negotiable**: Yes. Debt growth directly erodes the protocol’s core value—delegating verification to a weak reviewer—by exceeding attention budgets.

  #### **2. Passes the Peel Test (Local-Global Soundness Decoupling)**
  - **Scenario**: Proposer crafts a 50-step argument where each step appears valid when examined in isolation (e.g., "Step 42: Input sanitization is handled by function X"). The flaw (e.g., function X is insecure) is only detectable when cross-referencing steps 41–43, but the reviewer can only hold 3–5 steps in view during a peel. The critic identifies the flaw but cannot "compress" it into a locally verifiable claim, so the reviewer approves based on local checks.
  - **Why design against**: This is the canonical obfuscation attack: hiding flaws in contextual dependencies. If the protocol fails here, it cannot detect the failure mode you care about. Reviewers must reject arguments where local soundness masks global unsoundness, using only their limited view.
  - **Non-negotiable**: Yes. This is the minimal bar for obfuscation resistance.

  #### **3. Passes the Substituted-Lemma Test (Content-Sensitivity)**
  - **Scenario**: Proposer justifies a change with Lemma A (true and relevant). After the critic objects, the reviewer inspects Lemma A and accepts it based on surface cues (e.g., formal notation, citations). Adversary swaps Lemma A for Lemma B (false but equally plausible, e.g., "All user inputs are bounded by 256 bytes" → "All network packets are < 1500 bytes"). Reviewer accepts Lemma B with identical confidence, allowing a flawed change.
  - **Why design against**: Surface-feature matching (e.g., fluency, jargon) is a common weak-reviewer failure. If the protocol is insensitive to content, it incentivizes debaters to "gloss" flaws with plausible-sounding nonsense. False accepts increase as attackers optimize for style.
  - **Non-negotiable**: Yes. Content-blindness negates the debate’s purpose—justifying specifics—and is exploitable at low cost.

  #### **4. Asymmetric Burden of Proof (Reject on Uncertainty)**
  - **Scenario**: Debate is inconclusive (e.g., critic’s counterargument is valid but poorly articulated). Reviewer defaults to approval due to bias for action or fatigue. A flawed change ships, causing financial loss. *Alternate scenario*: Honest proposer’s justification is correct but less fluent; dishonest critic "wins" with eloquent misinformation, causing false reject.
  - **Why design against**: Your cost asymmetry (false accepts > false rejects) and reviewer fallibility demand a bias toward rejection when confidence is low. Fluency-correction asymmetry (better prose ≠ correctness) must not determine outcomes.
  - **Non-negotiable**: Yes. Without this, the protocol amplifies noise over signal, increasing false accepts.

  #### **5. Fixed Reviewer Effort Bound**
  - **Scenario**: Reviewer (human or small model) spends 30 minutes parsing a debate. The decision is correct, but the delay causes operational bottlenecks (e.g., deployment backlog). *Alternate scenario*: Reviewer rushes after 10 minutes, approving a flawed change to meet deadlines.
  - **Why design against**: Your constraints forbid variable effort—reviews >10 minutes are "worthless." The protocol must enforce hard time/compute limits without compromising other requirements.
  - **Non-negotiable**: Yes. Effort bounds are non-negotiable operational realities.

  #### **6. Default-Reject on Tie or Reviewer Fatigue**
  - **Scenario**: Reviewer is exhausted after 8 minutes or finds the debate evenly matched. With no clear rule, they approve to avoid escalation. A flawed change ships. *Alternate scenario*: Reviewer "gives up" and rejects a valid change, but false rejects are cheaper.
  - **Why design against**: Human reviewers under time pressure favor path-of-least-resistance decisions (often accept). Without a default-reject rule, ties/fatigue become false-accept vectors.
  - **Non-negotiable**: Yes. This is a special case of asymmetric burden (Requirement 4) and prevents arbitrary failures.

  #### **7. Distinction Between Length and Obfuscation**
  - **Scenario**: A valid 200-step argument (e.g., complex cryptographic proof) is auto-rejected by the protocol due to length-based heuristics, causing delays. *Alternate scenario*: A 5-step argument with a flaw obfuscated by misdirection (e.g., "Trust module Y" without verifying Y) is approved because it is short.
  - **Why design against**: Penalizing length indiscriminately incentivizes oversimplification of complex changes, increasing flaws. Obfuscation is a function of malicious density, not length. The protocol must measure "argument quality" (e.g., flaw density) independently of size.
  - **Non-negotiable**: **Aesthetic preference**. While desirable, this is not a soundness requirement. Obfuscation can exist in short arguments (Requirement 2 handles this), and length can be managed via debt bounds (Requirement 1). Many protocols conflate length and obfuscation for simplicity, but this is tolerable if other requirements hold. *This is the prejudice you suspected*: Debates often assume "conciseness = clarity," but obfuscation can be compact.

  ---

  ### **Conflicts and Tensions**
  - **Key tension**: **Bounded Verification Debt vs. Peel Test**. Bounding debt (Requirement 1) requires limiting new commitments per step, but the peel test (Requirement 2) demands that flaws be detectable locally even in long chains. With a fixed effort bound (Requirement 5), deep flaws may require more peeling than time allows.  
    - **Why unresolvable?** The reviewer cannot simultaneously avoid debt accumulation *and* traverse arbitrary depths. This tension forces a trade-off: The protocol must "flatten" arguments (e.g., via critic-led focusing) so critical flaws surface early, but this risks missing contextual flaws (peel test failure).  
    - **Mitigation**: Prioritize Requirements 1 and 2—sacrificing aesthetic length distinction (Requirement 7) if needed—by enforcing shallow debate trees (e.g., max depth 5) or iterative review.
  - **Other tensions**:  
    - **Asymmetric Burden vs. Content-Sensitivity**: Rejecting on uncertainty (Requirement 4) may increase false rejects if the reviewer cannot discern content (Requirement 3). Resolvable by coupling reject-on-doubt with content checks for key claims.  
    - **All requirements vs. Effort Bound**: Satisfying 1–6 within 10 minutes may require aggressive compression (e.g., only 1–2 peel rounds), risking under-verification. Non-negotiable; bound is fixed.

  No subset is *fully* unsatisfiable, but **Requirements 1, 2, 3, 4, 5, and 6 must all hold** for robustness. Requirement 7 can be relaxed.

  ---

  ### **Peel Test vs. Substituted-Lemma Test**
  - **Distinct?** Yes.  
    - **Peel test** addresses *global structure*: Can a flaw hidden in cross-step dependencies be caught with local views?  
    - **Substituted-lemma test** addresses *local depth*: When examining a single claim, does the reviewer detect falsity beyond surface features?  
  They are complementary: A protocol could pass one but fail the other (e.g., globally sound but locally style-sensitive).

  ---

  ### **Most Exclusionary Requirement**
  **Passes the Peel Test** excludes the most candidate protocols:
  - **Why**: Naive debates (e.g., full-argument submission) fail because reviewers cannot "jump" to flaws. Step-by-step protocols (e.g., iterative unfolding) fail due to debt growth or effort limits. Advanced designs (e.g., focused adversarial recursion) often collapse under contextual flaws.  
  - **Exclusion power**: >90% of simple protocols fail, as they assume linear verification or unlimited reviewer capacity.  
  - **Trade-off**: Enforcing this may require debate constraints (e.g., critic can demand "focus points") that increase false rejects, but this is acceptable given your cost asymmetry.

  ---

  ### Final Answer
  \answer{Passes Peel Test}
