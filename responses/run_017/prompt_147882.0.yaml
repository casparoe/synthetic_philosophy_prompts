  Specifically: To pass the peel test, the reviewer must be able to see the flaw in the limited view. But if the flaw is buried deep, the reviewer might have to peel many times. Each peel takes time. With 10 minutes, the reviewer can only do a limited number of peels. Therefore, if the argument is very long and the flaw is deep, the reviewer might not get to it. This is a fundamental tension.

  We must also bound verification debt. But if the reviewer doesn't have time to check the debt, then the debt might grow. So we need a way to make the verification debt manageable within the time.

  This suggests that the protocol must force the debaters to keep the argument shallow enough so that the critical points are within the reviewer's reach. The critic must be able to direct the reviewer's attention to the flaw without requiring the reviewer to traverse the entire chain.

  Another conflict: The asymmetric burden of proof (reject on doubt) might lead to false rejects. But that's acceptable because false accepts cost more. So no conflict, just a design choice.

  Now, which requirement excludes the most candidate protocols?

  The bounded verification debt growth and the peel test together are very restrictive. But the one that might be the most exclusionary is the **peel test** because it requires that the reviewer, with limited view, can catch a global flaw that is only apparent when connecting multiple steps. Without a mechanism for the critic to "jump" to the flaw and present it in a locally verifiable way, the protocol might fail.

  The substituted-lemma test is also very exclusionary because many models (and humans) are swayed by style. But it might be addressed by forcing the reviewer to check the content of key lemmas.

  Are the peel test and substituted-lemma test distinct?

  - Peel test: about the reviewer's ability to see a flaw in a long chain without having to hold the entire chain in view. It's about the structure of the argument and the reviewer's working memory.
  - Substituted-lemma test: about the reviewer's ability to distinguish a true lemma from a false one when they look at it, without being fooled by surface features. It's about the depth of processing when examining a single claim.

  They are distinct because one is about global structure and the other is about local content. However, they both relate to the reviewer's limited capacity.

  Now, the requirement that does the most exclusionary work: I think it's the **peel test** because it forces the protocol to have a way to compress the global flaw into a locally verifiable claim. Without that, long arguments with obfuscated flaws will be accepted.

