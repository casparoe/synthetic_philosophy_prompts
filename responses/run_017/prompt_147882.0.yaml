  We end with one requirement that does the most exclusionary work.

  Let's list requirements and their motivating scenarios:

  1. **Requirement: Bounded Verification Debt Growth**
     - **Motivating Scenario**: The proposer makes an argument with 100 steps. Each step introduces 3 new unchecked commitments (lemmas, assumptions) while resolving one. The reviewer starts with 0 debt. After step 1: debt=2 (3 introduced, 1 resolved). Step 2: debt=4 (3 new, 1 resolved). After n steps: debt=2n. The reviewer's attention budget is fixed (e.g., 10 minutes). At step 10, debt=20; step 100, debt=200. The reviewer cannot possibly check 200 commitments. The argument is accepted because the debt is too high and the flaw is buried. This must be avoided because the system becomes unsound as the argument length increases.
     - Why design against: Uncontrolled debt growth leads to inevitable failure for long arguments. We cannot accept that soundness degrades with argument length.

  2. **Requirement: Passes the Peel Test (Local Soundness Does Not Imply Global Soundness)**
     - **Motivating Scenario**: The proposer's argument has 100 steps. At each step, when the reviewer peels (unpacks one level), the step looks locally sound. However, step 42 is actually flawed, but when the reviewer is looking at step 42, they see it in isolation and it appears correct. The flaw is only apparent when considering the context of steps 41 and 43, but the reviewer can only hold a few steps at a time. The protocol must ensure that even if every unpacked layer looks fine, the reviewer can still reject the argument if there is a global flaw, using only the limited view. This might require that the critic can point out the flaw in a way that the reviewer can see it without holding the entire chain.
     - Why design against: Otherwise, the obfuscated flaw is never revealed in the reviewer's limited view, and the argument is accepted incorrectly.

  3. **Requirement: Passes the Substituted-Lemma Test (Content Sensitivity)**
     - **Motivating Scenario**: The proposer uses a lemma that is true and critical. The critic objects, but the reviewer sees that the lemma is well-written and supported by citations and accepts it. Then we swap the lemma for a false one that is equally well-written and cited (but on an unrelated topic). The reviewer accepts it with the same confidence. This shows the reviewer is not tracking the content of the lemma, only its surface features. The protocol must be sensitive to the actual content of the claims, not just their style.
     - Why design against: If the reviewer is fooled by style, then an adversary can craft a false lemma that looks as good as a true one and get it accepted.

  4. **Requirement: Asymmetric Burden of Proof (False Accepts Cost More)**
     - **Motivating Scenario**: The reviewer is unsure and tends to accept by default when the debate is confusing. But false accepts cost more (lose money, detected within a day). The protocol must be biased to reject when in doubt. Also, the honest debater (whether proposer or critic) might be less fluent and lose even when correct. The protocol must not let fluency win over correctness.
     - Why design against: We must not lose money due to false accepts. Also, we cannot accept that a more eloquent but wrong debater wins.

  5. **Requirement: Reviewer Effort Bound (Fixed Time per Review)**
     - **Motivating Scenario**: The reviewer has only 10 minutes. The debate must be structured so that the reviewer can make a decision within that time, regardless of the complexity of the change. If the debate takes an hour, it's worthless even if accurate.
     - Why design against: The operational constraint is fixed; we cannot extend the review time.

  6. **Requirement: Tie and Fatigue Handling**
     - **Motivating Scenario**: The debate is inconclusive after 10 minutes, or the reviewer is fatigued (if human) and cannot concentrate. The protocol must have a clear rule: e.g., reject on tie, or escalate to a human with more time? But note: the reviewer is the last line, and we cannot have a weaker reviewer escalate to a stronger one because the point is that the reviewer is weak. So we must design for a decision within the constraints.
     - Why design against: Without a rule, the reviewer might accept by default, leading to false accepts.

  7. **Requirement: Distinguish Long from Obfuscated**
     - **Motivating Scenario**: A genuinely complex change requires a long argument. The protocol must not penalize length per se, but only obfuscation. We must be able to accept a long but clear argument and reject a short but obfuscated one. The protocol must have a way to measure obfuscation (e.g., via the critic's ability to pinpoint flaws) that is not just argument length.
     - Why design against: We don't want to reject necessary complexity, only malicious complexity.

  Now, which of these are non-negotiable for the purpose?

  - Bounded Verification Debt Growth: Non-negotiable. Without this, the system becomes unsound for long arguments.
  - Peel Test: Non-negotiable. Otherwise, obfuscated flaws are not caught.
  - Substituted-Lemma Test: Non-negotiable. If the reviewer is not tracking content, the protocol is useless.
  - Asymmetric Burden of Proof: Non-negotiable. Given the cost asymmetry, we must bias towards reject on doubt.
  - Reviewer Effort Bound: Non-negotiable. The 10-minute constraint is fixed.
  - Tie and Fatigue Handling: Non-negotiable. We must have a rule to avoid arbitrary decisions.
  - Distinguish Long from Obfuscated: This might be an aesthetic preference? Or is it non-negotiable?

  Let's reconsider: The requirement is that the protocol must not conflate length with obfuscation. But in practice, without a clear way to measure obfuscation, we might end up rejecting long arguments. However, the core is that we must accept long arguments if they are sound and reject short ones if they are obfuscated. But if the protocol cannot do that, then we might reject necessary changes. That seems non-negotiable because we don't want to block legitimate work.

