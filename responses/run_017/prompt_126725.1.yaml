prompt: |-
  I live in a limited-equity housing cooperative and was recently elected to the small committee rewriting our occupancy agreement: about a dozen enforceable clauses, one winter of meetings, and a volunteer lawyer. The drafting has turned on which conception of freedom the document should be built around — a non-interference clause (the co-op and fellow members stay out of your unit), a capability clause (the co-op secures your effective ability to live well there: repairs, accessibility adaptations, and now broadband), or a non-domination clause (no member stands to the arbitrary will of another, board and manager included, backed by some machinery for contesting decisions).

  I need a defended ranking, not a survey. Which of these three actually changes what we would write, and which of the distinctions philosophers treat as load-bearing would collapse into drafting noise or into another clause? Concretely: does the non-domination clause buy anything over a non-interference clause plus appeal rights, once "arbitrary" has to be cashed out as something like "not required to track the interests of affected members as they could openly avow them"? And does the capability clause reach anything the other two cannot, or does it mainly license paternalism under a friendlier name?

  Rank two further questions alongside these rather than treating them as separate. First: the board is piloting an automated system that triages maintenance requests and flags arrears for review, and I cannot tell whether domination does real work there or is just a vivid restatement of ordinary accountability problems. Second: what I have started calling agenda power — the unchecked capacity to settle which grievances are intelligible as grievances at all, so that a complaint nobody has a name for never reaches a vote. Is that a distinct wrong deserving its own clause, or a redescription of something the three frameworks already cover?

  Tell me which of these deserve our scarce clauses and meeting time, and why: what criteria you are using (how much downstream drafting each choice settles, how contestable it is by members who are not philosophers, how much of it is merely symbolic), how you would trade those criteria off, and what would move an item up or down the list.
reasoning: |-
  Okay, the user is part of a committee rewriting an occupancy agreement for their limited-equity housing cooperative. They've presented three philosophical frameworks for structuring the agreement: non-interference, capability, and non-domination. They need a defended ranking of these approaches, not just a survey. They also have two additional questions about an automated maintenance system and "agenda power."

  First, I need to unpack each of these concepts. Non-interference is about others not interfering in a member's unit. Capability focuses on enabling members to live well through services like repairs and broadband. Non-domination prevents arbitrary power, where decisions must consider members' interests. The user wants to know which distinctions are substantive for drafting and which collapse into noise.

  The user's explicit questions are:
  1. Does non-domination add value beyond non-interference plus appeal rights?
  2. Does capability offer something the others don't, or is it paternalistic?
  3. How relevant is domination to the automated system?
  4. Is "agenda power" a distinct issue needing its own clause?

  But looking deeper, the user's in a committee setting with limited time and resources. They need practical, enforceable clauses. They might be dealing with members who aren't philosophers, so the language must be accessible. Also, the cooperative likely values both individual autonomy and collective welfare. The user might be seeking a framework that balances these without causing conflicts or paternalism.

  Assessing each concept's impact:
  - Non-interference is straightforward but might overlook support needs. It's clear but limited.
  - Capability addresses positive rights but risks paternalism if not carefully framed. It's necessary for things like broadband access.
  - Non-domination tackles power dynamics, which is crucial for accountability but could be complex. The automated system and agenda power tie into this, highlighting structural issues.

  For ranking:
  1. **Non-domination** should be primary. It addresses power imbalances and procedural fairness, which covers appeal mechanisms and agenda control. It's more comprehensive than just adding appeals to non-interference because it requires processes to be transparent and interests considered from the start.
  2. **Capability** comes next. It ensures the co-op actively supports members' living conditions. To avoid paternalism, clauses should specify members' input in defining needs. This is distinct because non-interference doesn't mandate support, and non-domination doesn't cover resource provision.
  3. **Non-interference** is foundational but insufficient alone. It prevents intrusions but doesn't ensure support or fair procedures. It can be a clause under non-domination.

  The automated system issue falls under non-domination. If the system lacks transparency or override options, it risks arbitrary decisions. Accountability mechanisms here are part of non-domination.

  Agenda power is a subset of non-domination. Controlling what counts as a grievance is about preventing arbitrary exclusion of concerns. It's covered if the agreement ensures open channels for all member concerns.

  Criteria for ranking:
  - **Downstream Impact**: How much does each framework shape specific clauses? Non-domination influences multiple areas (appeals, decision processes). Capability mandates specific services. Non-interference is narrower.
  - **Contestability**: Can non-philosophers grasp it? Non-interference is easy; capability is relatable (e.g., repairs); non-domination needs clear examples but is manageable.
  - **Symbolic vs. Substantive**: All have substance, but non-domination's focus on power dynamics is crucial for member trust.

  Trade-offs: Prioritize non-domination for its broad impact, then capability for essential services. Non-interference is simpler but should be included within non-domination's framework.

  Recommendations:
  - Structure the agreement around non-domination, embedding appeal processes and defining "arbitrary" clearly.
  - Include capability clauses with member consultation requirements to prevent paternalism.
  - Use non-interference as a specific right under the broader non-domination umbrella.
  - Address the automated system via transparency and override options in non-domination clauses.
  - Handle agenda power through open submission and review processes in grievance procedures.

  This approach ensures the agreement is robust, addresses power imbalances, supports members' needs, and remains practical and enforceable.
answer: |-
  Here’s a defended ranking of your three frameworks (non-interference, capability, non-domination), evaluated against your core concerns: **which distinctions materially change the drafting**, which collapse into noise, and how they address your two further questions (the automated system and "agenda power"). I’ll use concrete criteria to rank them:  
  1. **Downstream drafting impact** (how much the choice forces distinct, enforceable language).  
  2. **Contestability** (ease of understanding for non-philosophers; risk of member disputes).  
  3. **Substance vs. symbolism** (whether it adds enforceable rights or merely restates existing ideas).  
  4. **Problem-solving scope** (how well it handles real-world co-op issues like maintenance or arrears).  

  ### **Ranking: From Most to Least Critical**  
  1. **Non-domination** (highest priority)  
  2. **Capability** (essential but narrower)  
  3. **Non-interference** (largely redundant if non-domination is robust)  

  #### **Why Non-Domination Ranks First**  
  - **Downstream Impact**: Directly mandates structural changes to power dynamics. It requires:  
    - Explicit procedures for contesting decisions (e.g., internal appeals, third-party mediation).  
    - Criteria for "non-arbitrary" actions (e.g., decisions must align with co-op bylaws *and* member interests, with examples like "no penalty without warning").  
    - Limits on unilateral authority (e.g., board cannot evict without a member review panel).  
    *Without this, non-interference + appeals is procedural but doesn’t prevent "rule by whim."*  
  - **Addresses Your Concrete Questions**:  
    - **Automated System**: Non-domination forces safeguards against algorithmic bias/opacity. E.g., clauses requiring:  
      - Human override for disputed decisions (e.g., maintenance triage can be appealed).  
      - Transparency (members see how flags/prioritization work).  
      *This isn’t just "accountability noise"—it prevents the system from becoming a tool of arbitrary control.*  
    - **Agenda Power**: Directly confronts this by requiring:  
      - Open grievance channels (e.g., members can submit concerns in any form, not just pre-approved categories).  
      - A committee (not the board alone) filters what reaches a vote.  
      *This makes "naming grievances" a collective, rule-bound process—not a redescription of existing ideas.*  
  - **Contestability**: Framed as "no one gets to boss you around arbitrarily," it’s intuitive. Members grasp "appeals" and "fair rules" better than philosophical nuances.  
  - **Substance**: Creates *new* obligations (e.g., due process) and rights (e.g., challenge authority). Symbolism is minimal if procedures are concrete.  

  #### **Why Capability Ranks Second (But Don’t Skip It)**  
  - **Downstream Impact**: Demands positive obligations:  
    - Specific services (e.g., broadband access, ADA-compliant repairs).  
    - Timelines for fixes (e.g., "leaks repaired within 48 hours").  
    - Budget allocations (e.g., reserve fund for accessibility upgrades).  
    *Non-domination doesn’t guarantee these resources—it only ensures fair procedures.*  
  - **Avoids Paternalism**: If drafted as **member-defined capabilities**, it’s not paternalistic. E.g.:  
    - "The co-op shall provide resources *requested by members* to achieve [list: internet access, mobility, etc.], subject to feasibility votes."  
    - Contrast with top-down "we know what’s good for you" language.  
  - **Contestability**: High—members understand "we fix things fast" or "we get you internet." Less abstract than non-domination.  
  - **Substance**: Tangible benefits non-interference/non-domination lack. Non-domination ensures fair maintenance *processes*; capability ensures maintenance *happens*.  
  - **Weakness**: Risk of cost disputes. Mitigate by tying capabilities to clear standards (e.g., "broadband defined as 25 Mbps minimum").  

  #### **Why Non-Interference Ranks Last**  
  - **Downstream Impact**: Minimal. It typically restates default property norms (e.g., "no entry without 24h notice").  
  - **Collapses into Non-Domination**:  
    - A non-interference clause alone is toothless against board overreach (e.g., "we didn’t *enter* your unit, we just fined you for political speech").  
    - Non-domination *includes* non-interference (as freedom from intrusion) but adds anti-arbitrary power.  
    - *Exception*: If your co-op has unique privacy threats (e.g., shared utilities), carve out specifics.  
  - **Contestability**: Very high—easy to grasp "stay out of my home." But risks member vs. member disputes (e.g., "your music interferes with me").  
  - **Substance**: Largely symbolic if non-domination exists. It doesn’t solve maintenance delays, arrears, or agenda control.  

  ---

  ### **Recommendations for Your Drafting Process**  
  1. **Anchor the agreement in non-domination** (covers 70% of needs):  
     - Define "arbitrary" operationally: *"Actions not grounded in co-op bylaws or failing to consider documented member interests."*  
     - Build in appeals: e.g., "Members may challenge board decisions to a rotating member tribunal."  
     - **Address agenda power explicitly**: *"Any member may submit a grievance in writing; the review committee must catalog and respond to all submissions quarterly."*  

  2. **Add targeted capability clauses** (covers 25%):  
     - Specify minimum services (broadband, repairs) with member consultation requirements.  
     - Use objective standards to avoid paternalism: e.g., *"Adaptations funded per independent accessibility assessment."*  

  3. **Use non-interference sparingly** (5%—only for unique risks):  
     - e.g., *"No surveillance devices in private units without a member vote."*  

  4. **Handle the automated system via non-domination**:  
     - Require transparency (e.g., "algorithms disclosed annually"), appeal options, and human review for arrears flags.  

  **Trade-Off Criteria Applied**:  
  - **Downstream impact** > **Contestability** > **Substance** > **Symbolism**. Non-domination wins because it shapes *multiple* clauses (appeals, governance, oversight), while non-interference is easily absorbed. Capability stays because non-domination can’t mandate resources.  
  - **What moves an item up/down**:  
    - **Up**: If it solves *unique* co-op problems (e.g., non-domination for past board abuses).  
    - **Down**: If it’s redundant (non-interference) or too vague (raw "capability" without benchmarks).  

  **Final Thought**: Non-domination isn’t just philosophy—it’s **anti-dictatorship insurance** for small communities. Pair it with capability’s service guarantees, and you’ll have a draft that’s both protective and practical. Your "agenda power" insight is sharp—it’s a *subset* of domination, so bake it into grievance procedures. Spend 1 meeting defining "arbitrary," 1 on capability standards, and skip standalone non-interference debates.
