     │   └─ No → Q3: Keep old traditions unless proven harmful?  
     │       ├─ Yes → Q4: Break up huge companies?  
     │       │   ├─ Yes → ❌ *Empty: Unpopular* (Pro-tradition + anti-poor + anti-corporate = unstable)  
     │       │   └─ No → Q6: Society fixable by policy?  
