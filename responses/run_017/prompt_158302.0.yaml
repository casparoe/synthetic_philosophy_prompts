  Here's a political orientation decision tree designed for clarity and depth, avoiding predictable left/right binaries. It highlights your friend's theory about society-as-machine vs. society-as-order while using concrete, everyday language. Each question is phrased as a claim you can agree/disagree with before seeing the political label.

  **The Questions:**  
  *(Answer Yes = Agree, No = Disagree)*  

  1. **"If someone posts a harmful tweet, their company should fire them."**  
     *(Tests: Corporate power vs. individual speech rights)*  

  2. **"Being born poor in a rich country is unfair, not just bad luck."**  
     *(Tests: Systemic responsibility vs. individual fate)*  

  3. **"Old traditions should be kept unless proven harmful."**  
     *(Tests: Cultural preservation vs. progress)*  

  4. **"Breaking up huge companies like Amazon would make the economy fairer."**  
     *(Tests: Market regulation vs. free enterprise)*  

  5. **"Fighting climate change should happen even if gas prices double."**  
     *(Tests: Environmental urgency vs. cost concerns)*  

  6. **"Society is like a machine—we can *fix* problems with smart policies."**  
     *(Tests: Society-as-machine vs. society-as-order)*  

  ---

  **The Decision Tree:**

  ```
  START  
  │  
  └─Q1: Should companies fire for harmful tweets?  
     ├─ Yes → Q2: Is being born poor unfair?  
     │   ├─ Yes → Q3: Keep old traditions unless proven harmful?  
     │   │   ├─ Yes → Q4: Break up huge companies?  
     │   │   │   ├─ Yes → Q5: Fight climate change if gas doubles?  
     │   │   │   │   ├─ Yes → ❌ *Empty: Unpopular* (Green priorities + tradition + anti-corporate = rare)  
     │   │   │   │   └─ No → Q6: Society fixable by policy?  
     │   │   │   │       ├─ Yes → 🟢 **National-Populist**  
     │   │   │   │       └─ No → ❌ *Incoherent* (Can't distrust policy *and* back big state interventions)  
     │   │   │   └─ No → ❌ *Empty: Unattractive* (Tradition + pro-corporate + anti-luck = no real base)  
     │   │   └─ No → Q4: Break up huge companies?  
