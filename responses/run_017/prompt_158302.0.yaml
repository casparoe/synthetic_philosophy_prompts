  **Key Insights:**  
  1. **Society-as-Machine (Q6=Yes):**  
     - Held by **Greens** and **Mainstream Left** (fix problems via policy) *and* **National-Populists** (use state power for cultural goals).  
     - *Cuts across left/right:* Populists align with left on economics (Q4=Yes) but right on culture (Q3=Yes).  

  2. **Society-as-Order (Q6=No):**  
     - Held by **Mainstream Right** (preserve traditions), **Libertarians** (protect markets), and **Centrists** (cautious reform).  
     - *Cuts across left/right:* Centrists share right's caution (Q6=No) but reject tradition (Q3=No).  

  3. **Empty/Incoherent Cells:**  
     - *National-Populist + Green* (Q5=Yes): Unpopular (environmental costs clash with populist base).  
     - *Libertarian + Tradition* (Q3=Yes): Incoherent (can't enforce tradition without state power).  
     - *Anti-poor + Pro-policy* (Q2=No + Q6=Yes): Unstable (policy requires belief in fixable injustice).  

  4. **Indistinguishable Pair:**  
     - **Mainstream Left** and **Greens** share:  
       `(Q1=No, Q2=Yes, Q3=No, Q4=Yes, Q6=Yes)`  
       *Only split by climate urgency (Q5):* Greens say **Yes** (costs irrelevant), Left says **No** (protect living standards).  

