answer: |-
  ### Pantoum: Step into the Booth  
  *(after Parfit)*  

  i step into the booth for the long jump  
  the scanner hums and takes me apart  
  the promise is a body on mars  
  a replica from the blueprint  

  the scanner hums and takes me apart  
  but the earth body doesn’t dissolve  
  a replica from the blueprint  
  now two of us share one start  

  but the earth body doesn’t dissolve  
  so who is the real me they ask  
  now two of us share one start  
  but identity holds just one  

  so who is the real me they ask  
  and what if by chance the stars align  
  but identity holds just one  
  and a duplicate without cause  

  and what if by chance the stars align  
  to make a body just like mine  
  and a duplicate without cause  
  is that me or a sign  

  to make a body just like mine  
  the promise is a body on mars  
  is that me or a sign  
  i step into the booth for the jump  

  ---

  ### Note (58 words)  
  Parfit commits: Relation R (psychological continuity without identity) is what matters, and it holds with *any cause*. Contested: whether "any cause" is defensible (chance duplicates as reductio vs. feature), and if R captures survival. The poem leans into "any cause" discomfort (stanzas 4-5) without resolution, mirroring textual ambiguity. It avoids endorsing R as the only relation.
