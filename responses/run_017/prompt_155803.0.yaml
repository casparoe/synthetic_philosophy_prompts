prompt: |-
  i'm setting the sit-down final for my upper-level philosophy of mind seminar (3rd/4th years, they've already done the Chinese Room and the intentional stance earlier in the term) and i need one essay question on the original vs derived intentionality fight — Dennett's two-bitser move against Searle. 90 minutes, closed book, call it 1000 words of writing.

  My problem is that both sides have a recitable summary and the good students can produce either one in their sleep: Searle's line that brains have original (or intrinsic) intentionality while artefacts only get it borrowed from us, backed by the claim that it's a plain biological feature of brains, caused by neural processes, like any other biological capacity; and Dennett's line that the two-bitser shows the borrowing story is all there ever is, that even our own intentionality traces back through evolution to something that isn't itself an intentional agent, so original intentionality is a myth. i want a question where producing either of those summaries gets you a B at best.

  The crux i want them forced into is what the derivation relation actually is. The usual cash-out is something like: a state of X means what it does because some agent designed X, or interprets X, with that content in mind. So the question i want them to have to answer is what happens when that chain doesn't have a bottom. Please build the question around a case i've been using in lectures because it recieves almost no discussion anywhere and students can't have a prepared answer for it:

  The Foundry chain. Centuries ago people built machines that build machines; each generation is constructed and programmed by its predecessor, with small unplanned modifications accumulating as it goes. The founding engineers' civilization, language and records are long gone. The machines now in existence reliably track features of their environment, correct each other, and pass signals to one another — and some of their internal states covary with things nobody ever designed them to covary with. Variant A is just that: a lineage with a lost origin. Variant B is a closed loop of such machines, each one's signals getting whatever content they have from being interpreted by the next machine around the cycle, with no interpreter standing outside the loop at all.

  Ask them to classify each variant (original / derived / merely as-if / none of these) and — this is the part that should be doing the work — to say what turns on the classification for each position: which theorist is more embarassed by which variant, whether the dispute survives the case as a substantive disagreement or collapses into a verbal one, and if it survives, what the real disagreement actually is. The question as printed has to be self-contained: no need to remember which essay the two-bitser comes from, no quotations required, and it should be unanswerable by just picking a side.

  Give me the question as it will appear on the paper, a model answer of roughly 900-1000 words, and a marking scheme out of 20. The scheme should be five must-hit moves at 4 marks each, and for each move it should name (a) what an A answer does that goes beyond naming the position, (b) the ceiling a B answer hits, and (c) how students typically get it wrong — i want the traps named, not gestured at. Moves i'd expect to see in there somewhere: unpacking what derived-ness requires and whether it needs a terminal source; whether Dennett's own evolutionary lineage story leaves him with anything for derived to be derived from; whether Searle's biological-causal-powers answer is an explanation or a placeholder with a label on it; whether the two-bitser is a reductio of original intentionality or only a demonstration that derived intentionality is common; and whether the whole thing is verbal. Use your judgement about how to cut that up.

  One more thing: the model answer should end with 2-3 sentences on where its own verdict is most likely to fail and the single argument or consideration that would flip it, and i want that pulled out into its own field too.

  Format: give me the whole thing as one JSON object. Schema: "exam" (object: level, format, minutes, word_limit, total_marks); "question_text" (the question exactly as printed, string); "model_answer" (string, ~900-1000 words, with the self-critical closing paragraph in it); "verdict" (one or two sentences stating what the model answer actually concludes); "what_would_change_my_mind" (the one argument or consideration that would flip that verdict, plus where the reasoning is most likely to break); "marking_scheme" (array of five objects, each with "id", "must_hit_move", "marks", "a_grade_move", "b_grade_ceiling", "common_error"); "borderline_note" (a short paragraph on how the A/B line gets drawn overall, e.g. what separates a student who can argue the case from one who can only report the positions). Don't wrap it in anything else, and make sure the JSON parses.
