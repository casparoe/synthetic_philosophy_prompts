  We are given an argument that iterated amplification cannot both exceed human competence and maintain alignment. We are to dissect the argument step by step and identify where the reasoning breaks down, if at all. The user prefers to keep steps (3) and (7) if possible.

  Let's restate the steps:

  1. M_n is obtained by supervised learning to imitate A(H). It's a fast approximation to A(H).
  2. Imitation cannot exceed its target: competence(M_n) ≤ competence(A(H)) (at best, and typically less due to lossy fitting).
  3. Amplification is information-preserving: competence(A(H)) ≤ competence(H) because A(H) only rearranges H's knowledge with more compute, not adding new information.
  4. From (2) and (3): competence(M_n) ≤ competence(H) for every n. Iteration doesn't help because each round starts from something not better than H.
  5. The only way to exceed H is if amplification added something, but the only candidate (compute) doesn't add knowledge, which is what we lack.
  6. Therefore, if the pipeline exceeds H, it must come from the model's generalization during distillation (beyond the training data).
  7. A generalization not demonstrated is not endorsed by the reviewers. The model's behavior in between training points is shaped by its inductive bias, which the reviewers didn't choose.
  8. Hence, any competence beyond H comes at the cost of alignment (acting on unendorsed generalizations).
  9. Therefore, iterated amplification cannot both exceed human competence and remain aligned.

  The user is reluctant to give up (3) and (7). We must find the flaw.

