  **Step 3:** This is the core: "Amplification is information-preserving" and "rearranging what H already knows cannot get you more than H already knows". 

  But let's think: A(H) uses decomposition and sub-questions. The human H is competent but not an expert and slow. By breaking the problem down, A(H) might be able to solve problems that H could not solve in one go because of cognitive limitations. For example, a human might not be able to hold the entire codebase in their head at once, but by breaking it into smaller parts, they can reason about each part and then combine. 

