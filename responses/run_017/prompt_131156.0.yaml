  **Step 5:** This is restating step 3 and the limitation of compute.

  **Step 6:** If we break step 3, then it's possible that A(H) is better than H, so M_n could be as good as A(H) and thus better than H without requiring generalization beyond the demonstrations. But step 2 says M_n is at best as good as A(H). So if A(H) is better than H, then M_n could be better than H without needing to generalize beyond the demonstrations.

