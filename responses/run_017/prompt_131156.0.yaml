  But step 7 says: "A generalization nobody demonstrated is a generalization nobody endorsed." This is literally true: the reviewers didn't endorse that specific generalization because they never saw it. But that doesn't mean they wouldn't endorse it if they saw it. The term "endorsed" in the argument is being used in a very narrow sense.

  The user's worry (and step 8) is that the model might generalize in ways the reviewers would not agree with. So the key is whether the generalization is aligned (i.e., what the reviewers would want) or not.

