prompt: |-
  Bit of a niche one on evolutionary debunking arguments. The two standard versions as I get them: the coincidence version — if moral facts are independent of whatever shaped our moral beliefs, the realist owes an explanation of why the two line up, and the options are the tracking account (the pressures somehow homed in on the facts) or the adaptive-link account (our judgements got selected for being useful, and their truth is beside the point); and the insensitivity version — the causal story would have handed us these beliefs whether or not they were true, which is meant to undercut them.

  Here's the bit I never see discussed. Suppose the actual genealogy turns out to be mostly neutral drift rather than selection: a random walk through normative space, where the variants that spread spread for reasons with nothing to do with their content. Drift looks worse for the realist in one way — there is no pressure toward truth at all — but better in another: there's no systematic push toward falsehood either, no parochialism or kin favouritism installed in us that someone then has to explain away. My hunch is that drift is on balance less damaging than selection, but I can't tell whether that's actually right or how to price the two effects against each other.

  Give me two seperate numbers: your credence that at least some of our core moral beliefs amount to knowledge of mind-independent moral facts, conditional on drift, and conditional on selection. Mine are around 0.3 and 0.15. Then decompose them — how much rides on whether a third-factor explanation is available, how much on whether the analogy to perceptual or mathematical belief survives, how much on whether debunking arguments generalise to our epistemic and logical beliefs and so prove too much, how much on whether justified means reliably formed as opposed to internally coherent — tell me which term your numbers are most sensitive to, and which one you'd revise first if you had to. Also: what single argument or finding would move you most, and where do you think your own reasoning is most likely to be broken? British English please.
reasoning: |-
  Alright, let me unpack this user's query. They're diving deep into evolutionary debunking arguments (EDAs), specifically comparing selection-based versus drift-based scenarios for moral realism. The user has clearly done their homework—they're familiar with the coincidence and insensitivity versions of EDAs and are probing an underexplored angle: neutral drift. 

  First, I need to validate their core observation: yes, most EDA literature obsesses over adaptive selection pressures, but drift is a legit alternative in evolutionary biology. The user’s intuition—that drift might be *less* damaging than selection for moral realism—is provocative. They’re asking whether randomness could ironically be kinder to realism by avoiding adaptive falsehoods. Smart framing.  

  Their credence estimates (0.3 for drift, 0.15 for selection) suggest they lean toward drift being more realist-friendly. I broadly agree, but I’ll push mine slightly higher for drift (0.35) and lower for selection (0.1) because I think adaptive pressures *actively* mislead in ethics (e.g., favoring tribalism over impartial morality). The user might be underweighting how badly selection distorts.  

  Now, decomposing their ask:  
  - **Third-factor explanations**: Crucial for both, but *especially* for selection. If no third factor (like flourishing-truth links) exists, selection looks devastating. Drift might dodge this by lacking systematic distortion.  
  - **Analogy to perception/math**: This cuts deeper for selection. If ethics is more like math (abstract, not sensory), evolutionary influences feel more suspicious. Drift’s randomness might make the math analogy *less* threatening—random errors could cancel out.  
  - **Self-defeat worry**: If EDAs also debunk logic/epistemology, that’s a *reductio*. But this helps realism more under selection (where the threat is sharper) than drift.  
  - **Reliabilism vs. coherentism**: A sneaky big one. If justification only requires internal coherence, drift might preserve knowledge even without truth-tracking. But for selection, coherentism might not save beliefs built on adaptive lies.  

  Biggest sensitivity? **Third-factor for selection, reliabilism for drift**. If I had to revise one assumption, I’d scrutinize reliabilism—maybe coherentism *can* rescue moral knowledge even without causal truth-tracking.  

  What would change my mind? Hard experimental evidence of adaptive falsehoods (e.g., kin preference overriding impartial morality) would crush selection-based realism. For drift, proof of *systematic* (not random) fixation of false beliefs would hurt.  

  My own blind spot? Probably underestimating how *much* drift could still correlate with truth by chance. Or overindexing on ethics-math disanalogies. User’s British English ask is noted—no “color” or “optimize” here.
answer: |-
  Right, this is a proper deep dive into the weeds of EDAs – and you've nailed the drift lacuna in the literature. Your framing is spot-on: drift removes both adaptive truth-tracking *and* adaptive distortion, leaving pure contingency. Here's my take, decomposed as requested.

  **Credences:**  
  - **Conditional on Drift:** My credence that *some* core moral beliefs are knowledge of mind-independent facts ≈ **0.35**  
  - **Conditional on Selection:** ≈ **0.1**  

  I’m slightly more optimistic than you about drift and slightly more pessimistic about selection. Here’s the breakdown of what’s propping these numbers up and where the pressure points lie:

  ### Decomposition of Credence Components  
  1. **Third-Factor Explanations (e.g., flourishing-truth links):**  
     - **Drift (Weight: Moderate):** Less *dependent* on third factors than selection. If moral facts exist, drift’s randomness doesn’t *systematically* block access (unlike selection’s bias). But third factors still matter for explaining *why* randomly fixed beliefs might hit truth.  
     - **Selection (Weight: Heavy):** This is the linchpin. Without a plausible third factor (e.g., "adaptive = conducive to flourishing = morally good"), selection looks fatal. My low 0.1 hinges on skepticism here – most proposed links (e.g., cooperation=adaptive=good) feel like just-so stories masking parochialism.  
     - *Sensitivity:* My selection credence collapses to near-zero without third factors; drift credence drops to ~0.2.  

  2. **Analogy to Perception/Maths:**  
     - **Drift (Weight: Low-Moderate):** The disanalogy worries me less here. Perceptual faculties *were* shaped by selection to track truth (e.g., tiger-shapes). Maths might be abstract, but our *belief-forming mechanisms* for it weren’t drift-dominated. Drift’s randomness might make moral cognition look *more* like unreliable intuition than perception, but less like a distorted lens than under selection.  
     - **Selection (Weight: High):** Kills the perception analogy (evolution didn’t shape us to *track moral truth*). Maths is a better hope, but even there, selection pressures (e.g., for efficient computation) *might* align with truth. For morals? Unlikely.  
     - *Sensitivity:* If maths/perception analogies fully hold, selection credence could jump to 0.3; drift less affected.  

  3. **Self-Defeat / Generalisation Worry (e.g., debunking logic/epistemology):**  
     - **Drift (Weight: Low):** This is where drift *helps*. If EDAs generalise to logic, but logic *must* be justified for the argument to work, drift’s neutrality avoids the self-undermining trap better than selection (which *does* threaten logic if adaptive falsehoods were useful).  
     - **Selection (Weight: Moderate):** The "proves too much" argument bites hardest here. If selection debunks morals, why not logic? Realists can exploit this – but it’s a defensive move, not a positive case.  
     - *Sensitivity:* If EDAs *can* be contained to ethics without spreading, selection credence falls further. Drift unaffected.  

  4. **Reliabilism vs. Coherentism (Justification):**  
     - **Drift (Weight: Heavy):** **This is the killer variable for drift.** If justification requires *reliable formation* (reliabilism), drift’s randomness is deadly (no reliability). If justification is about *internal coherence* (coherentism), drift might leave room for knowledge (e.g., we reflectively endorse beliefs post-drift).  
     - **Selection (Weight: High):** Coherentism struggles more here – if beliefs are adaptive fictions, a coherent system built on false foundations might still be bunk. Reliabilism is clearly sunk.  
     - *Sensitivity:* **My drift credence is MOST sensitive to this.** Switch to coherentism, and it jumps to 0.5+. For selection, it’s a smaller lift (0.1 → 0.2).  

  ### Which Term I'd Revise First?  
  **Reliabilism vs. Coherentism.** If forced to abandon strict reliabilism for moral justification (e.g., accepting that reflective equilibrium *can* confer justification even without causal truth-tracking), my drift credence would rise significantly. For selection, revising *third-factor* plausibility would be the biggest mover (but I’m more entrenched in skepticism there).  

  ### Single Argument/Finding That Would Move Me Most  
  - **For Selection:** Empirical evidence that adaptive moral beliefs (e.g., in-group loyalty) are *systematically false* according to a plausible moral ontology (e.g., they conflict with impartial altruism under utilitarianism). This would torpedo third-factor hopes.  
  - **For Drift:** **Phylogenetic evidence** showing moral beliefs vary *randomly* across hominin species with no fitness correlates. If drift is the dominant driver, it weakens the "systematic distortion" fear and makes coherentism more viable.  

  ### Where My Reasoning Is Likely Broken  
  I’m probably **underweighting the cumulative effect of drift**. Even random walks can get stuck in local maxima of false consensus. Also, I might be **overestimating the threat of parochialism under selection** – if third factors *are* plausible (e.g., "social instincts track proto-morality"), my 0.1 for selection could be too low. And that reliabilism hang-up? Entirely possible I’m letting epistemic fashion cloud my judgement.  

  **In summary:** Drift’s neutrality gives realism breathing room by dodging adaptive distortion, making coherentism a viable escape. Selection’s pressure toward *useful* (not true) beliefs is a heavier lift, demanding robust third factors. Your hunch holds: drift is less damaging on balance, but both are still shaky ground.
