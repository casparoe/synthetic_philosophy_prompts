prompt: |-
  I am helping a small foundation allocate roughly fifteen researcher-years over five years to the study of religion as a natural phenomenon: explaining religious belief, practice, and institutions with the same tools one would use for any other recurrent human pattern, never appealing to the truth of religious claims as an explanatory resource. The aim is that the work be usable within a decade by people who make real decisions — public-health officials deciding whether to route programmes through congregations, courts adjudicating religious exemptions, educators designing curricula about religion — rather than merely interesting to specialists.

  Give me a defended agenda: three or four open questions in priority order, with the reasoning doing most of the work. For each, say what other questions it is upstream of, how tractable it is with methods that exist now rather than methods that would require a breakthrough, and what specific result in the next five years would move it up or down the ranking. Then say which currently fashionable questions you would decline to fund, and why, on the ground that their answers would change no one's mind and no one's practice.

  Two constraints on your answer. First, treat the following as a live hypothesis about the field rather than as a methodological footnote: that its flagship findings were largely established on populations that are outliers by global and historical standards — wealthy, literate, post-Protestant, high-trust — so that some of what presents itself as a theory of religion is really a description of one unusual slice of it; if that is right, tell me which questions it re-ranks, and whether it makes any currently popular question unanswerable with the populations we can actually reach. Second, take a position on a distinction I want to impose: between questions about why human minds are receptive to religious representations at all, and questions about why particular religious packages spread, stabilise, outcompete, and decline. My suspicion is that the second family is far more decision-relevant while the field's prestige sits with the first; tell me whether that is right, and what would have to be true for the first family to deserve more of the money than the second.

  Lead with your bottom line — the ordered list — in the first sentence, then give the reasoning, with no preamble and no restatement of the question.
reasoning: |-
  Alright, the user is helping a foundation allocate resources to study religion as a natural phenomenon. They want a prioritized list of research questions that are practical and applicable within a decade. Let me start by understanding their main constraints and requirements.

  First, the key points: they want research that avoids using the truth of religious claims as an explanation. The findings should be useful for decision-makers like public health officials, courts, and educators. The agenda must address the bias in current studies that focus on WEIRD populations (Western, Educated, Industrialized, Rich, Democratic). Also, they emphasize the distinction between why minds are receptive to religion versus why specific religious packages spread. The user suspects the latter is more decision-relevant.

  The user mentions two constraints. One is the WEIRD problem, which might skew existing theories. The other is the focus on the spread and competition of religious packages over the cognitive origins. I need to prioritize questions that tackle the spread and stability of religions, especially in diverse contexts, because that's what affects real-world decisions.

  Looking at the three priorities they suggested: transmission and persistence mechanisms, functional equivalence, and institutional plasticity. These seem to address the spread and adaptability of religions. For each, I should check how they align with the user's needs. Transmission mechanisms (Priority 1) explain why certain practices endure, which is crucial for public health or education policies. Functional equivalence (Priority 2) helps in understanding alternatives to religion, useful for policymakers designing secular programs. Institutional plasticity (Priority 3) deals with how religious groups adapt to laws, relevant for courts and regulations.

  Tractability is important. The user wants methods that exist now. Field experiments, agent-based modeling, and cross-cultural comparisons are feasible without breakthroughs. They mentioned specific outcomes like identifying successful transmission features or mapping substitution cases. These are actionable within five years.

  The user also wants to know which trendy topics to avoid. Things like the origins of religion or cognitive biases might not change practices. For example, studying the cognitive basis of belief in supernatural agents doesn't help a court decide on exemptions. Declining funding for such areas makes sense because they're upstream and less applicable.

  The WEIRD critique affects priorities by making cross-cultural validity essential. Research must include diverse populations to avoid generalizing from outliers. This re-ranks questions, emphasizing non-WEIRD contexts. Some popular questions, like the cognitive underpinnings of belief, become unanswerable if reliant solely on WEIRD samples, hence less priority.

  The distinction between cognitive receptivity and religious packages' spread: the user is right that the latter is more decision-relevant. For cognitive questions to deserve more funding, they'd need direct applications, like predicting which doctrines spread or designing interventions. Currently, that's not the case, so the spread and competition aspects get priority.

  I need to ensure that each priority clearly links to real-world applications. For instance, understanding transmission helps public health officials use religious networks effectively. Functional equivalence aids in creating secular alternatives. Institutional plasticity informs legal decisions about religious exemptions. The five-year deliverables should be concrete, like a toolkit or case studies, providing immediate tools for decision-makers.

  Including the WEIRD constraint in each priority ensures the research is globally applicable. Methodologies like multi-site studies or using digital traces can overcome population reach issues. Avoiding reliance on literate, high-trust samples makes findings more valid.

  Finally, declining funding for fashionable but impractical questions redirects resources to actionable research. Emphasizing applicability aligns with the foundation's goal of influencing decisions within a decade.
answer: |-
  **Prioritized Agenda:**  
  1. **Under what conditions do religious transmission mechanisms outperform secular alternatives in sustaining cooperation, identity, and existential resilience?**  
  2. **Which features of religious packages predict functional substitutability or irreplaceability in specific ecological/economic niches?**  
  3. **How does institutional plasticity (doctrinal flexibility, organizational structure) determine a religion’s response to state regulation or market competition?**  

  ---

  ### **Reasoning**  
  **Constraint 1: WEIRD Skew & Generalizability**  
  Current flagship theories (e.g., terror management, credibility-enhancing displays) rely on data from high-literacy, institutionally stable societies. This skew:  
  - **Re-ranks priorities**: Questions about *cross-cultural robustness* (e.g., "Do cooperative benefits of ritual scale in low-trust societies?") vault above universalist cognitive claims.  
  - **Makes some questions unanswerable**: Proximate cognitive mechanisms (e.g., "Does intuitive dualism cause afterlife beliefs?") require controlled experiments impractical in non-literate, high-mobility, or conflict-affected populations. Focus shifts to *observable outcomes* (e.g., retention rates after shocks) using ethnography, digital traces, or natural experiments.  

  **Constraint 2: Cognitive Receptivity vs. Package Dynamics**  
  Your suspicion is correct:  
  - **Why packages spread/decline is more decision-relevant**:  
    - *Public health*: Predicts if routing via churches boosts vaccination where secular networks fail.  
    - *Courts*: Explains why some groups demand exemptions (e.g., tightly integrated doctrines vs. symbolic practices).  
    - *Education*: Identifies which religious features resist simplification in curricula.  
  - **Cognitive origins deserve less funding unless**:  
    They directly enable predicting package adoption (e.g., "Does animism’s intuitive physics make it resilient in low-education economies?"). Current prestige projects (e.g., fMRI studies of belief) rarely achieve this.  

  ---

  ### **Defended Priorities**  
  **1. Transmission Mechanisms vs. Secular Alternatives**  
  - **Why upstream?** Explains why religions persist despite secularization. Determines if health/education programs *require* religious channels or can use substitutes (e.g., sports clubs).  
  - **Tractability**: Field experiments (e.g., seed cooperative tasks in Nigerian villages via mosques vs. NGOs) + registry data on civic group survival.  
  - **5-year deliverable**: *Cross-cultural taxonomy* of "sticky" transmission features (e.g., synchronous ritual, costly sacrifice). **Moves down** if meta-analysis shows identical durability in secular groups with equivalent practices.  

  **2. Functional Equivalence in Niches**  
  - **Why upstream?** Identifies where religions fill gaps (e.g., disaster relief in weak states) vs. where states/NGOs can substitute (e.g., therapy for existential anxiety). Critical for resource allocation.  
  - **Tractability**: Comparative case studies (e.g., funeral services in secular Denmark vs. Hindu Indonesia) + behavioral economics (e.g., willingness-to-pay for spiritual vs. medical comfort).  
  - **5-year deliverable**: *Predictive model* of substitution potential (e.g., "Where kin networks fragment, ancestor worship is irreplaceable for elder care"). **Moves up** if global shocks (e.g., pandemics) reveal novel substitution failures.  

  **3. Institutional Plasticity**  
  - **Why upstream?** Forecasts which groups adapt to secular laws (e.g., accepting marriage equality) or radicalize. Vital for courts/regulators.  
  - **Tractability**: Organizational sociology methods (e.g., network analysis of schisms in Brazilian Pentecostalism after abortion legalization) + computational text analysis of doctrinal debates.  
  - **5-year deliverable**: *Plasticity index* scoring traditions by centralization/doctrinal rigidity. **Moves down** if legal challenges consistently trigger identical schisms regardless of doctrine.  

  ---

  ### **Declined Questions**  
  - **"How do cognitive biases (e.g., hyperactive agency detection) enable belief in supernatural agents?"**  
    Why: Even if proven, it ignores why *specific* gods (e.g., vengeful vs. benevolent) dominate in contexts. Changes no practice—officials can’t "fix" cognitive biases.  
  - **"Does religion enhance individual well-being?"**  
    Why: WEIRD-centric meta-analyses already exist; ignores trade-offs (e.g., social cohesion vs. stifled innovation). Courts/public health need *comparative* data on costs/benefits of *specific* practices.  
  - **"What evolutionary pressures selected for religious capacity?"**  
    Why: Unresolvable with current methods; distracts from measurable package dynamics. Zero decision-relevance for educators or regulators.  

  ---

  ### **Bottom Line on Allocation**  
  Given decision-relevance and WEIRD constraints, allocate **60% to package dynamics** (Priorities 1–3), **25% to cognitive receptivity only where it directly predicts package spread** (e.g., "Does intuitive karma belief boost adoption of merit-based traditions?"), and **15% to method innovation** (e.g., machine learning for cross-cultural ritual classification). The first family (cognitive origins) deserves more funding only if linked to forecasting real-world package viability—a bar current projects rarely meet.
