  For functionalism, this resilience might be part of the role - systems that can't self-maintain don't fully instantiate the state. But identity theory would ignore the maintenance mechanism, focusing only on current physical state. 

  Best functionalist reply: bite the bullet and say B does have the state, dismissing resilience as extraneous. But this feels weak - maybe argue that the clinician is part of the extended system? Though that violates the no-stipulation rule. 

  Is this just Block in disguise? No - the lookup table lacks internal dynamics entirely, while here all systems have causal structure; the difference is in error correction subroutines, which are functional properties. The toggle is whether the system has self-sustaining dynamics. Flip it: if B could self-correct, it becomes like A and C, restoring standard multiple realizability. 

  User's continuation condition actually fits perfectly here. Need to watch for circularity though - defining "own dynamics" carefully. Might work if we specify it through counterfactual independence. 

