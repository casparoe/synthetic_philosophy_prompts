prompt: |-
  For the final problem set of my graduate seminar in applied ethics I need a model answer, so that I can calibrate the rubric before I hand it to my teaching assistant. The last question asks students to rank six diets by their expected effect on the suffering of wild animals. I would like you to produce the answer I would ideally circulate, showing the reasoning at the level I would expect from a strong PhD student holding fixed a year's calories and protein for one person, the six options are:

  A. Grass-finished beef on land that would otherwise be unmanaged grassland; no grain or soy feed; low stocking density.
  B. Pasture-raised, feedlot-finished beef: grazing for most of the animal's life, then maize and soy; far less land per kilogram than A, but with cropland in the supply chain.
  C. Broiler chicken fed on maize and soy.
  D. Conventional arable vegan diet: annual grains and pulses, tilled, with synthetic insecticides and herbicides.
  E. Vegan diet based on perennial grain cultivars: no tillage, no insecticides, weeds controlled by autonomous machines making three passes per season, with yields per hectare about 30 percent below D.
  F. Farmed insect protein (crickets) raised on crop residues and food waste in a heated indoor facility, supplemented by D-type staple crops.

  The following stipulations are deliberately simplified and are not empirically accurate in every detail; treat them as given for the purposes of the exercise rather than as claims to be checked. (i) For D, about four fifths of the animal deaths attributable to cultivation occur at harvest and in post-harvest operations rather than from pesticide application; insecticides suppress insect numbers on the treated field for roughly eight weeks, but the effect on landscape-level populations is negligible once immigration from field margins is accounted for. (ii) For E, each weeding pass kills about a quarter as many animals per hectare as a harvest pass under D. (iii) Land taken out of production reverts within about a decade to secondary growth that supports a density of small vertebrates and invertebrates comparable to the crop it replaces, but with a different composition: more ground-nesting insects and rodents, far fewer sap-feeding insects. (iv) Grazing under A displaces native herbivores roughly one for one and halves ground-nesting bird numbers on the parcel. (v) Heating dominates the energy footprint of the facility in F, and its emissions are small compared with the land-use differences above. Assume throughout that the experiences of invertebrates matter morally and can be net negative; ignore farmed-animal welfare, human health, climate and other considerations except where they feed back into how many wild animals exist.

  Please give me:

  1. A tier list of the six options, each with a rating from −10 to +10 keyed to the average of the six, and one sentence stating why it lands where it does.
  2. The ranking twice: once under the assumption that the lives of the animals in question are on balance worse than non-existence, once under the assumption that they are on balance better than non-existence. If the ordering does not shift, explain why it is robust to that parameter; if it collapses or inverts, say exactly where.
  3. A clear separation of what is settled from what is contested among people who actually work on this. Flag every ordering claim that depends on a genuinely contested normative or empirical assumption — the relative moral weight of invertebrate as against vertebrate suffering, whether premature death matters independently of the suffering it involves, whether effects on population size can be aggregated at all, and whether long-run ecological feedback swamp the differences between options, the cluelessness worry. Do not present a contested assumption as the state of the art, and do not let a contested assumption do load-bearing work silently. Finally, give me a single number between 0 and 1 for your confidence in the top-versus-bottom comparison only, and name the two findings that would most change that number.
reasoning: |-
  Okay, the user is asking for a model answer to rank six diets based on their effect on wild animal suffering. This is for a graduate seminar in applied ethics, so the response needs to be rigorous and well-structured. The user wants it to serve as a rubric calibration tool for their teaching assistant. 

  First, I need to understand the core task: rank diets by expected wild animal suffering impact, under given stipulations. The key constraints are: holding calories/protein constant for one person, ignoring farmed animal welfare/climate except where it affects wild animal populations, and treating invertebrates' negative experiences as morally relevant.

  The six options cover different production systems - from beef to chicken to vegan to insect-based. The stipulations provide specific parameters about animal deaths per operation, land use effects, and displacement dynamics. These are simplifications but must be taken as given.

  For the tier list (-10 to +10 scale), I'll need to calculate relative impacts. Land use emerges as the dominant factor because it determines how many wild animals exist to suffer. Options requiring more land generally mean more wild animals displaced or killed through agricultural operations. 

  Option A (grass-finished beef) seems worst due to massive land requirements. Option E (perennial vegan) appears best with low-till practices and moderate yields. The insect option (F) is tricky - low land use but heating emissions could matter if they affect habitats. Stipulation (v) suggests emissions are negligible though.

  The ranking should be presented twice: under both "anti-natalist" (lives worse than non-existence) and "pro-natalist" (lives better) assumptions. The ordering likely stays the same because reducing wild animal populations reduces suffering under anti-natalism but increases net positive experiences under pro-natalism - but since all options involve both displacement and direct killing, the direction of impact flips while the relative ranking holds.

  I must flag contested assumptions clearly. Major debates include: invertebrate sentience/weighting, whether death itself is bad vs only suffering, whether population-level effects are aggregable, and "cluelessness" about long-term ecological ripple effects. The perennial vegan diet's ranking depends heavily on disputed estimates of machine-weeding mortality.

  For confidence in the top-bottom comparison (A vs E): I'd say 0.8. Key uncertainties are the validity of the "one-for-one" herbivore displacement in stipulation (iv) and whether perennial systems truly have such low mortality during weeding passes. If either proved inaccurate, the ranking could flip.

  The response should mirror academic rigor - precise about what's given vs debated, transparent in reasoning, and methodical in handling the two ethical framings. Since it's for PhD students, I can assume comfort with technical terms like "anti-natalist" but should still define them contextually.
answer: |-
  Here is a model answer structured for a strong PhD student, adhering strictly to your stipulations and highlighting contested assumptions.

  **Core Reasoning:** The primary driver of wild animal suffering (WAS) impact is **total land footprint** for a year's calories/protein. More land converted to agriculture generally means:  
  - More direct killing via farming operations (tillage, harvest, weeding).  
  - More displacement/replacement of wild populations (changing densities & compositions).  
  - Under anti-natalism (lives net negative), reducing wild animal populations reduces suffering.  
  - Under pro-natalism (lives net positive), reducing populations reduces net positive welfare.  
  Stipulations (iii) & (iv) allow us to model displacement/replacement effects. Direct killing scales with operations per hectare and total hectares.

  ---

  ### 1. Tier List (Baseline: Anti-Natalist Assumption - Lives Worse Than Non-Existence)
  *(Avg. set to 0; -10 = Most Suffering, +10 = Least Suffering)*

  *   **F (Farmed Insects + D-staples): +8**  
      Minimal land footprint (crop residues/waste + efficient D-supplement), negligible direct killing via operations, low displacement. Heating emissions insignificant per (v).
  *   **C (Broiler Chicken): +5**  
      Highly efficient land/feed conversion minimizes total cropland vs. beef; direct killing limited to crop production for feed. Still requires significant D-type cropland.
  *   **E (Perennial Vegan): +4**  
      Lower direct killing per hectare (no insecticide, less lethal weeding/harvest) BUT lower yield requires 30% more land than D, increasing displacement. Net effect slightly positive vs. D.
  *   **D (Conventional Arable Vegan): 0 (Baseline)**  
      Moderate land footprint. Direct killing significant (~80% harvest/post-harvest, 20% pesticides). Serves as the calibration point.
  *   **B (Feedlot-Finished Beef): -6**  
      Requires substantial land: both pasture *and* high-yield cropland for feed (maize/soy). Combines direct killing on cropland with significant displacement on pasture/cropland.
  *   **A (Grass-Finished Beef): -10**  
      Enormous land footprint (low stocking density). Displacement effect is extreme: native herbivores displaced 1:1 (net zero lives?) AND ground-nesting birds halved per (iv). Minimal direct killing, but displacement dominates negatively under anti-natalism.

  **Ranking (Worst to Best for WAS - Anti-Natalism):** A < B < D < E < C < F

  ---

  ### 2. Ranking Under Pro-Natalist Assumption (Lives Better Than Non-Existence)
  *   **Inverts:** The ranking **completely inverts**.  
      A < B < D < E < C < F  becomes  **F < C < E < D < B < A**  
      *(Best to Worst for WAS under Pro-Natalism: A > B > D > E > C > F)*

  *   **Explanation:**  
      Under pro-natalism, *reducing* wild animal populations (the primary effect of agriculture via land conversion/displacement) becomes **harmful** because it prevents net positive lives. Therefore:
      *   Options causing the **greatest reduction** in wild animal populations (A, B) now become the *least harmful* (or even beneficial, though direct killing complicates this).
      *   Options causing the **smallest reduction** in populations (F, C) now become the *most harmful* as they prevent the fewest net positive lives.
      *   Direct killing remains a negative under both views (preventing future positive experiences or causing suffering/death), but its impact is generally secondary to the population effect given the scale of displacement implied. Option A's minimal direct killing + massive displacement makes it "best" under pro-natalism. Option F's minimal displacement makes it "worst".

  ---

  ### 3. Settled vs. Contested Assumptions & Confidence

  **Settled (Given Stipulations & Core WAS Logic):**
  *   The dominance of land footprint over other factors (like heating emissions in F) per stipulations.
  *   The *direction* of the reversal between anti-natalism and pro-natalism.
  *   The relative land footprints: A > B > D > E (approx.) > C > F.
  *   The relative intensity of direct killing *per operation type*: Conventional Harvest/Post-Harvest (D) > Weeding Passes (E) > Pasture Operations (A/B negligible).

  **Contested Assumptions (Critical for Ordering):**
  1.  **Anti-Natalism vs. Pro-Natalism (Population Ethics):** As shown, this **fundamentally inverts the ranking**. This is the most profound normative contestation. *Load-Bearing:* Entirely.
  2.  **Moral Weight of Invertebrates vs. Vertebrates:** Stipulations treat them as mattering. However:
      *   *Load-Bearing for D vs. E/C/F:* If invertebrates matter much less than vertebrates, D's pesticide/herbicide impact diminishes significantly relative to E's machine weeding (which may kill more vertebrates) and C/F's reliance on D-type crops. This could weaken the case for E/C/F over D. The composition shift in fallow land (iii) (fewer sap-feeders, more rodents/ground-nesters) also becomes less relevant if invertebrates are discounted. *Load-Bearing:* Significantly for comparisons involving D, E, C, F.
  3.  **Badness of Death vs. Suffering Only:** Stipulations imply death itself is bad (or causes net negative experience). If only suffering matters, and death is instantaneous/painless, the impact of harvest/weeding/pesticides is drastically reduced. Displacement (changing population composition/density) likely still causes suffering via competition, predation, or changed experiences. *Load-Bearing:* Major for direct killing estimates (all options), less so for displacement effects.
  4.  **Aggregating Population-Level Effects:** Is preventing the existence of a potential animal with a net negative life *good*? Is preventing the existence of a potential animal with a net positive life *bad*? This underpins the anti-/pro-natalist reversal but is deeply contested. *Load-Bearing:* Foundational.
  5.  **Cluelessness/Long-Run Feedback:** Could climate differences (ignored per stipulation but potentially significant in reality) or unforeseen ecological cascades (e.g., from changed land use patterns over centuries) swamp the near-term differences modeled? If "cluelessness" prevails, all rankings might be invalid. Stipulations ask us to ignore this, but its contestation is central to applied WAS ethics. *Load-Bearing:* Potentially invalidates the entire exercise if deemed insurmountable.
  6.  **Specific Empirical Estimates:** Stipulations are given, but key values are contested in reality:
      *   The "one-for-one" displacement of herbivores by grazing (A) (iv). If displacement is less, A looks slightly better under anti-natalism/worse under pro-natalism. *Load-Bearing:* For A's extreme position.
      *   The lethality of machine weeding (E) vs. conventional harvest (D) (ii). If machine weeding kills a higher fraction of vertebrates relative to invertebrates, E looks worse under anti-natalism/better under pro-natalism, especially if vertebrates are weighted more. *Load-Bearing:* For E's position relative to D/C.
      *   The speed and completeness of habitat recovery on fallow land (iii). Faster/more complete recovery reduces the negative impact of land use under anti-natalism (less population reduction). *Load-Bearing:* Reduces the harm of high-land-use options (A, B, E) under anti-natalism.

  **Confidence in Top-vs-Bottom Comparison (A vs. F under Anti-Natalism):**
  *   **Confidence: 0.75**  
      This reflects high confidence *given the stipulations and the anti-natalist premise*. The land footprint difference is enormous, the displacement effect in A is explicitly severe (iv), and F's land footprint is minimal with low-intensity operations.
  *   **Two Findings That Would Most Change This Number (Towards 0.5 or lower):**
      1.  **Evidence that very low-intensity grazing (A) *increases* overall wild vertebrate density/numbers compared to unmanaged grassland** (contradicting stipulation iv). This would drastically reduce A's negative impact under anti-natalism.
      2.  **Evidence that heating emissions from intensive indoor facilities (F) are far higher than stipulated (v), leading to significant long-term habitat destruction via climate change** that outweighs the near-term land savings. This would increase F's negative impact.

  ---

  **Key for TA:** This answer demonstrates rigorous application of given stipulations, clear separation of empirical and normative components, explicit handling of the central ethical uncertainty (population ethics), identification of key contestations, and calibrated confidence. A strong student should similarly avoid treating contested assumptions as settled and show how conclusions depend on foundational premises. The inversion under pro-natalism is a critical test of understanding. The confidence score should reflect adherence to stipulations while acknowledging key real-world uncertainties that could undermine them.
