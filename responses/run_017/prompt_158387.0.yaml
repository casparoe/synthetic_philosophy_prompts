answer: |-
  ### Specification of the Machinery for Lexical Threshold Negative Utilitarianism

  The core machinery for lexical threshold negative utilitarianism (LTNU) consists of a **hedonic scale** and a **threshold mechanism**. The scale must quantify the magnitude of pleasant and unpleasant experiences on a single axis, while the threshold defines a point on the unpleasant side beyond which experiences are lexically prior to any pleasure. Below, I outline the desiderata for this machinery, motivated by the cases you provided, and evaluate their negotiability relative to your institutional purpose. Desiderata are non-negotiable if essential for coherent, non-arbitrary ranking under incomplete information; negotiable if they reflect partisan philosophical commitments that can be rejected without collapsing the allocator's framework.

  #### Desiderata for the Hedonic Scale
  1. **Unipolar measurement of unpleasantness**  
     - **Motivation**: Pain asymbolia cases (e.g., sensory pain without distress) show that the scale must distinguish between the sensory-discriminative and affective-motivational components of experience. Only the latter (unpleasantness) counts as a negative welfare component.  
     - **Failure Consequence**: If the scale conflates sensory intensity with unpleasantness, allocators misallocate resources to asymbolic "pains" that lack welfare significance, wasting the budget on ineffective programs.  
     - **Negotiability**: Non-negotiable. Without this, the scale cannot reliably identify welfare-relevant states.

  2. **Temporal atomism**  
     - **Motivation**: Relief cases (e.g., dental pain followed by relief) and mixed-valence experiences (e.g., spicy food) require analyzing experiences as instantaneous states to avoid double-counting. Relief is a separate pleasant state, not a "negative" of pain.  
     - **Failure Consequence**: Double-counting occurs if pain and relief are aggregated into a net value; analgesia programs appear less beneficial than they are, distorting rankings (e.g., eliminating pain also eliminates future relief, making it seem costlier).  
     - **Negotiability**: Non-negotiable. Atomism ensures consistent accounting across time.

  3. **Valence decomposition for mixed experiences**  
     - **Motivation**: Mixed-valence cases (e.g., satisfying exhaustion) involve concurrent pleasant and unpleasant components that cannot be netted without masking lexical urgency.  
     - **Failure Consequence**: If netting is allowed, an above-threshold unpleasant component could be offset by pleasure, violating lexical priority (e.g., a horrific but "meaningful" pain might be ranked lower than it should).  
     - **Negotiability**: Non-negotiable. Decomposition preserves lexicality by isolating unpleasant magnitudes.

  4. **Dimensional unity with quality-weighting**  
     - **Motivation**: Diverse pain qualities (e.g., burning vs. grief) must be aggregated into a single scale to apply a scalar threshold. This is not reintroducing forbidden trade-offs, as aggregation occurs *within* the unpleasant domain (below or above threshold), not between pleasure and pain.  
     - **Failure Consequence**: If pains are incommensurable, the threshold cannot be applied universally; allocators cannot compare programs targeting different pain types (e.g., reducing nausea vs. boredom).  
     - **Negotiability**: Non-negotiable. Unity is essential for a single threshold. However, *how* weights are set (e.g., via empirical suffering metrics) is negotiable—allocation only requires that weights be non-arbitrary.

  5. **Interpersonal comparability via calibrated introspection**  
     - **Motivation**: Cases involving stoicism, expressive norms, or anticipation (e.g., same stimulus causing different reported suffering) require comparing welfare across individuals without behaviorism.  
     - **Failure Consequence**: Allocators cannot prioritize across individuals; decisions default to arbitrary heuristics (e.g., helping the visibly distressed over the stoic).  
     - **Negotiability**: Non-negotiable. Comparability is achieved by calibrating self-reports with neural/physiological indicators to filter out signaling effects, ensuring welfare magnitudes reflect felt states.

  #### Desiderata for the Threshold Mechanism
  6. **Absolute, fixed location**  
     - **Motivation**: Threshold ratchet cases (e.g., eliminating worst pains shifts the threshold) require an invariant standard. The threshold must be defined by intrinsic properties of experience (e.g., intensity linked to functional impairment), not relative to population extremes.  
     - **Failure Consequence**: Rankings churn arbitrarily (e.g., a pain unchanged in intensity gets reclassified after worse pains are eliminated), violating allocative stability.  
     - **Negotiability**: Non-negotiable. Relativity undermines institutional objectivity.

  7. **Peak-intensity basis with duration invariance**  
     - **Motivation**: Sandpile cases (many sub-threshold pains vs. one supra-threshold) and temporal grain cases (splitting/merging durations) require the threshold to apply to peak instantaneous intensity, not time-integrated magnitude.  
     - **Failure Consequence**: If threshold depends on duration, rankings are non-invariant under splitting/merging (e.g., a 10-minute pain might be supra-threshold, but splitting it into ten 1-minute pains makes it sub-threshold).  
     - **Negotiability**: **Negotiable**. Peak-intensity is preferred for invariance, but duration-invariance is a partisan extensionalist commitment. A defender could reject it, accepting duration-dependence if empirical evidence supports it (e.g., chronic pain as worse). Allocators can handle either with clear rules.

  8. **Non-arbitrary location and unit invariance**  
     - **Motivation**: To avoid doctrinal hostage to unit choices, the threshold must be invariant under positive rescaling (e.g., doubling all scales preserves rankings).  
     - **Failure Consequence**: Arbitrary unit choices (e.g., scaling pain from 0–10 vs. 0–100) alter threshold location and rankings.  
     - **Negotiability**: Non-negotiable. Unit invariance is a basic coherence condition for cardinal scales.

  9. **Risk sensitivity without fanaticism**  
     - **Motivation**: Small risks of supra-threshold outcomes (e.g., 1/1,000,000 chance of severe pain) require lexicality to be compatible with expected-value reasoning.  
     - **Failure Consequence**: Fanaticism (rejecting any risk, however small) or paralysis (inaction when all options carry risk) makes ranking impossible.  
     - **Negotiability**: Non-negotiable for institutional use. Achieved by treating the threshold as a step-function in expected disutility: above-threshold pains are cardinally comparable *to each other*, but *no* expected pleasure compensates for *any* expected supra-threshold disutility. Thus, options are first ranked by minimizing expected supra-threshold disutility; ties are broken by expected sub-threshold utility.

  #### Additional Cases and Desiderata
  - **Retrospective evaluation vs. felt experience**:  
    - **Desideratum**: The scale must use felt experience (not retrospective appraisal) to define magnitudes.  
    - **Motivation**: Cases like endured pain later valued (e.g., marathon pain) show welfare is temporally local.  
    - **Failure Consequence**: Allocators misclassify experiences (e.g., ignoring acute suffering if it is later judged "worth it").  
    - **Negotiability**: Non-negotiable. Aligns with LTNU's experiential focus.

  - **Instrumental vs. intrinsic badness**:  
    - **Desideratum**: The scale must capture intrinsic badness of experiences, not their instrumental effect on life welfare.  
    - **Motivation**: Chosen pains (e.g., surgery for health) can be intrinsically bad but life-improving.  
    - **Failure Consequence**: Allocators conflate experienced welfare with broader life outcomes, undermining lexical urgency (e.g., deprioritizing severe pain if it "builds character").  
    - **Negotiability**: Non-negotiable. LTNU targets experiential welfare, not all-things-considered value.

  #### Joint Satisfiability and Tensions
  - **Smallest Unsatisfiable Subset**: {**Lexicality (any supra-threshold pain worse than any pleasure)**, **Risk Sensitivity without Fanaticism**}.  
    - **Explanation**: Strict lexicality forbids any trade-off between supra-threshold disutility and pleasure, making expected-value calculations impossible for risks involving supra-threshold outcomes. Even infinitesimal risks dominate all pleasures, forcing fanaticism. This tension arises because lexicality is absolute, while risk management requires aggregating probabilities and magnitudes. No machinery can reconcile this without relaxing lexicality (e.g., allowing sufficiently small risks to be outweighed by large pleasures), but this violates LTNU's core.

  #### Most Exclusionary Requirement
  - **Risk Sensitivity without Fanaticism** does the most work in excluding candidates. It forces the machinery to handle probabilistic trade-offs while respecting lexicality, which is the primary point of failure for most accounts.

  #### Contender Scoring
  Using the desiderata (abbreviated for brevity; focus on key failures):
  - **Classical Single Cardinal Scale** (e.g., Benthamite utilitarianism):  
    - **Fails**: Lexicality (no threshold), risk non-fanaticism (all trade-offs cardinal), valence decomposition (nets mixed experiences). Inadequate for LTNU purpose.  
  - **LTNU as Usually Stated** (vague machinery):  
    - **Fails**: Risk non-fanaticism (leads to fanaticism), interpersonal comparability (undefined), relief double-counting (unaddressed). Requires specification to be usable.  
  - **Suffering as Distinct Normative Kind** (no pleasure-pain trade-offs):  
    - **Fails**: Dimensional unity (no common scale), cardinality below threshold (no sub-threshold trade-offs). Cannot rank programs converting severe pains to mild ones or adding pleasures.  
  - **Damage-Signal View** (badness tracks signal content, not feeling):  
    - **Fails**: Unipolar measurement (prioritizes asymbolic pain), felt experience (ignores affective state). Misallocates by targeting non-welfare-relevant signals.  
  - **Preference-Based Account**:  
    - **Fails**: Unipolar measurement (preferences may not align with experience, e.g., masochism), non-arbitrary threshold (preferences are subjective). Allows trade-offs violating lexicality.

  #### Summary
  The machinery must specify an affect-based, cardinal, unipolar scale for unpleasantness, decomposed from mixed valences, with interpersonal comparability via calibrated introspection. The threshold must be absolute, peak-intensity-based, and unit-invariant. The core tension is between lexicality and risk non-fanaticism, which is unsatisfiable without modifying LTNU's second claim. For your purpose, the threshold mechanism must prioritize minimizing expected supra-threshold disutility first, then use expected utility for sub-threshold outcomes—but this still fails strict lexicality under risk. If uncompromising on lexicality, fanaticism is unavoidable, and the view may be inadequate for real-world allocation under uncertainty.
