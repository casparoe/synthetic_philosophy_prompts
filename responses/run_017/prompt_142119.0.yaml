answer: |-
  ### Materials and Prep List
  - **Index cards for pairing**: 12 cards labeled A, 12 labeled B (or use 12 unique letters, each duplicated twice), shuffled in a bag.
  - **Choice slips**: 100+ small slips of paper (24 students × 4 rounds = 96 slips; extras for mistakes).
  - **Envelopes for Round 3**: 24 sealed envelopes (10 labeled "mirror", 14 labeled "open"), shuffled.
  - **Dice**: One standard six-sided die for Round 4 (public roll).
  - **Cups or shields**: 24 small cups/paper covers for private die use in Round 3 (though dice are put away for Round 4).
  - **Tally sheets**: Pre-printed tables for recording results (see below).
  - **Blackboard markers/chalk**: For recording tallies and formulas.
  - **Raffle tickets and prize**: Book voucher ($20), with conversion rate (e.g., 10 points = 1 raffle ticket).
  - **Timer**: For keeping rounds on schedule.
  - **Prep**:  
    - Test the tally process (Round 3) with mock slips.  
    - Write the payoff matrix on the board:  
      - Mutual Cooperation (C,C): (3, 3)  
      - Mutual Defection (D,D): (1, 1)  
      - You C, Partner D: (0, 5)  
      - You D, Partner C: (5, 0)  
    - Pre-calculate Round 3 theoretical values (for debrief):  
      - \( p = \frac{2}{5} \), symmetric cooperation probability = \( \frac{1}{3} \).  
      - Cooperation condition: \( g > \frac{1 + \beta}{3} \).  

  ---

  ### Minute-by-Minute Timeline
  - **0:00–0:05** (5 min): **Introduction**  
    Explain the session: "Today we’ll play a game in four rounds. Choices affect your points, convertible to raffle tickets for a book voucher. Pairs are anonymous—no talking. Each round, write C or D on a slip. Payoffs use the matrix on the board." Distribute pairing cards.  

  - **0:05–0:10** (5 min): **Round 1 (Anonymous)**  
    Read: *"Draw a card from the bag. Your pair is the other student with your letter. Choose C or D. Payoffs use both choices."*  
    Collect slips. Tally on board: **% C, % D, avg. payoff**.  

  - **0:10–0:15** (5 min): **Round 2 (Mirror)**  
    Read: *"This round, your payoff depends only on your choice. If you choose C, you get 3 points. If you choose D, you get 1 point."*  
    Collect slips. Tally on board: **% C, % D** (expect high C).  

  - **0:15–0:25** (10 min): **Round 3 (Mirror/Open Mix)**  
    Read: *"Each envelope has your condition: ‘mirror’ (payoff based only on your choice, like Round 2) or ‘open’ (payoff based on both choices, like Round 1). Chance of mirror is 2 in 5; open is 3 in 5. We assigned 10 mirror, 14 open."*  
    Distribute envelopes. Students open, choose C/D. Collect slips.  
    **Tally (2 min)**:  
    1. Separate open-pair slips (14 students = 7 pairs).  
    2. For each pair, classify as:  
       - **CC** (both C),  
       - **CD** (one C, one D),  
       - **DD** (both D).  
    3. Calculate:  
       - \( n_{CC} \), \( n_{CD} \), \( n_{DD} \) (must sum to 7).  
       - \( \alpha = \frac{2 \times n_{CC}}{2 \times n_{CC} + n_{CD}} \),  
       - \( \beta = \frac{n_{CD}}{2 \times n_{DD} + n_{CD}} \),  
       - \( g = \alpha - \beta \).  
    Record on board: **\( \alpha \), \( \beta \), \( g \)**.  
    *If g near zero*: "Open pairs show weak correlation—choices moved independently."  
    *If g negative*: "Open pairs show negative correlation—cooperating made partners less likely to cooperate."  
    *If g > 0.4*: "Open pairs show strong positive correlation—choices moved together."  

  - **0:25–0:35** (10 min): **Round 4 (Public Die)**  
    Read: *"Roll the public die once. You may choose C or D based on the outcome (e.g., ‘C if die ≤ 3, D otherwise’). Write your choice for the actual roll. Payoffs use both choices."*  
    Roll die, students choose, collect slips. Tally: **% C, % D**.  

  - **0:35–1:10** (35 min): **Debrief**  
    **0:35–0:45**: Define \( \alpha \), \( \beta \), \( g = \alpha - \beta \).  
      - Expected payoff of C: \( 3\alpha + 0(1 - \alpha) = 3\alpha \).  
      - Expected payoff of D: \( 5\beta + 1(1 - \beta) = 1 + 4\beta \).  
      - C better if \( 3\alpha > 1 + 4\beta \) → \( 3(\alpha - \beta) > 1 + \beta \) → \( g > \frac{1 + \beta}{3} \).  
      - **Key insight**: Cooperation depends on the gap \( g \), not direct causation.  
      - *Map to rounds*:  
        - Round 1 (low g): D dominant.  
        - Round 2 (g=1): C best (no partner choice; payoff depends on your move alone).  
        - Round 3: \( g = p \cdot 1 + (1 - p) \cdot g_{\text{open}} \) (p=0.4). If \( g_{\text{open}} = 0 \) (independence), \( g = 0.4 \). Condition: \( 0.4 > \frac{1 + \beta}{3} \) → \( \beta < 0.2 \). At equilibrium (all randomize), \( q = \frac{3p - 1}{1 - p} = \frac{3 \times 0.4 - 1}{1 - 0.4} = \frac{0.2}{0.6} = \frac{1}{3} \).  

    **0:45–0:50**: Round 3 tally analysis.  
      - Show overall \( g = p + (1 - p) g_{\text{open}} \) from data.  
      - Contrast with Round 2: Mirror forces g=1, but doesn’t prove why—causal/evidential theories all agree here.  

    **0:50–0:55**: Name "superrationality": The idea that identical agents' decisions correlate, justifying cooperation.  
      - *Limitation*: Envelopes forced correlation; we didn’t test if reasoning alone causes convergence.  

    **0:55–1:00**: Round 4: Public die allows perfect correlation (g=1).  
      - If all condition identically, g=1 → \( 1 > \frac{1 + \beta}{3} \) (since \( \beta = 0 \) if partners defect when you defect), so C is optimal.  
      - *Student experience*: Many cooperate unconditionally (as in symmetric superrationality).  

    **1:00–1:06**: **Coda (6 min)**  
      - Hand 8 students a card: "Temptation payoff = 7 (not 5) if you defect while partner cooperates."  
      - Announce: "Some have different payoffs; holders are secret. What should a superrational pair with mismatched cards do?"  
      - *Purpose*: Highlight superrationality’s reliance on symmetry.  
      - *Expected answers*:  
        - "Still cooperate" (ignore asymmetry).  
        - "Defect" (dominant strategy).  
        - "Compromise" (mixed strategy).  
      - *Debrief*: Superrationality assumes identical agents/payoffs; asymmetry breaks the argument.  
      - *Keep it?* Yes—illustrates a key limitation.  

  ---

  ### What Will Go Wrong (and Handling)
  1. **Students cooperate out of niceness (Round 1)**:  
     - *Handling*: Stress point conversion to raffle tickets; after Round 1, show high D rates to reinforce self-interest.  

  2. **Mirror round seen as a "trick" (Round 2)**:  
     - *Handling*: Explicitly state: "No hidden rules; C gives 3 points, D gives 1, based only on your slip."  

  3. **Signaling despite ban**:  
     - *Handling*: Monitor closely; discard slips if chatter occurs. Remind: "No talking—points depend on anonymity."  

  4. **Tally takes >2 min (Round 3)**:  
     - *Handling*: Use pre-drawn table; call out pair types (CC/CD/DD) as slips are collected.  

  5. **Debrief arithmetic loses students**:  
     - *Handling*: Start with concrete numbers (e.g., "If α=0.6, β=0.2..."); use step-by-step inequalities on the board.  

  ---

  ### What the Activity Cannot Reproduce
  - The envelopes (not student reasoning) enforce correlation in Round 3. Superrationality’s core claim—that identical agents independently converge to the same choice—is assumed, not tested. The game does not prove this claim’s validity.

  ---

  ### Final Answer String
  \answer{mirror round: C; anonymous round: D; cooperate iff g > (1+\beta)/3; p = 2/5 symmetric fixed point: cooperate with probability 1/3; cooperation pays at every base rate iff p >= 2/3; public-die round: C}
