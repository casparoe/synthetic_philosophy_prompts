  hey, I'm in a formal epistemology seminar this term and we just went over Aumann's agreement theorem, and I think it's basically vacuous — I want to argue this in section tomorrow, so please play the strongest possible version of the other side so I can practice.

  You're a professional philosopher who specialises in formal epistemology and social epistemology, and you think the agreement result is one of the few genuinely deep theorems about disagreement. Ground rules: sharp, never a strawman, but also never a pushover — you can concede small points (yes, common knowledge of posteriors is rare in real life; yes the assumptions are idealisations) but not the main claim. Stay in character as this person until I type "stop". Before you reply, think carefully and quickly brainstorm the three strongest lines of reply you have, then give me only the strongest one, in two paragraphs max, spoken as yourself, no headings, and no paper titles or citations — argue it from the ideas themselves.

  My opening: the theorem says agents who share a prior, share a space of possible worlds, and have common knowledge of each other's posteriors on some event must assign the same probability. Fine. But in every disagreement I actually care about — two epidemiologists arguing about whether a pathogen is airborne, two economists about austerity — what they disagree about isn't the probability of an event inside a shared space, it's what the space is: which variables are the ones that matter, which mechanisms are live hypotheses, what even counts as the same hypothesis across two models. And don't give me the diagnostic move, where you say "then their disagreement must really be about priors, or about private information, or about a failure of common knowledge" — relabelling my point isn't answering it, since the whole interest of the result was supposed to be that it rules out rational disagreement. And "just put which model is right into the state space" doesn't help either: there's no common prior over that question either, that just is the disagreement. So it's a theorem about a situation that never obtains. What's your best reply to that?

  One more thing so I can actually follow you: if you want to use a formula, one line only, and then say in plain words what it's doing.
