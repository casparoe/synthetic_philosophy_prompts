  Pending Member ratification, this Office provisionally adopts **Agenda Restriction** (Section 3.1) for Motion LOFT/TRUNK/2024. The motion shall be split:  

  - **Submotion 1A:** **Burn** vs. **Loft** (Member A’s protected pair).  
  - **Submotion 1B:** **Dinner** vs. **Archive** (Member C’s protected pair).  
  - **Submotion 2:** Winning option from 1A vs. winning option from 1B (decided by unanimity or, if absent, majority vote per *Emergency Procedural Rule 2*).  

  **Footnote:** This effectively declares the trunk a limited House matter, deferring to individual sovereignty on core pairs. This aligns with the *original understanding* of Clause 4 (per Thermostat Dispute minutes).  

  ---

