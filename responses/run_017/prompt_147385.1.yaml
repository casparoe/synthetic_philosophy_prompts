prompt: |-
  Draft the joint statement of an adversarial collaboration between a defender of pragmatic encroachment (interest-relative invariantism about knowledge) and a defender of epistemic contextualism. Both accept that ordinary knowledge attributions are sensitive to stakes; both deny that this sensitivity is merely conversational.

  Three stipulations frame the collaboration. (1) Only semantic proposals are on the table: accounts of the stakes data in terms of implicature, relevance, or norms of assertion alone are set aside by agreement, as is the claim that high-stakes speakers simply have weaker evidence than low-stakes speakers. (2) Both must give an account of what I will call the shared-utterance case: with her evidence fixed, a speaker says to a single audience of two — one member must act on it at very high stakes, the other is idly curious — 'I checked: the last ferry leaves at 11.' Each side must say what that one utterance said, and for whom. (3) Neither may let the dispute dissolve into the observation that the parties are applying different standards; each must say what fixes the standard and why that is the right one.

  Write, first, a numbered section of claims both can sign — about the bank-style cases, about what the dispute is not about, and about whether the stakes-effect is one phenomenon or several. Then a table of the residual disagreements, each stated in wording its own side would accept rather than in the other side's caricature. Then the cruxes — the sub-questions such that settling one would move at least one side — and for each a case or argument both would grant bears on it, with each side's prediction recorded in advance. Cruxes I want addressed: whether the stakes that matter are the subject's, the attributor's, or some aggregate; whether a subject who is rationally ignorant of the stakes can thereby fail to know, and whether one who irrationally inflates them can thereby know; whether encroachment reaches rational belief and credence or stops at knowledge; and whether either view can specify non-circularly what fixes the standard in the shared-utterance case. If some part of the dispute is merely verbal, say which part and why, and say what substantive question remains behind it.
reasoning: |-
  We are drafting a joint statement for an adversarial collaboration between a defender of pragmatic encroachment (PE) and a defender of epistemic contextualism (EC). Both agree that stakes affect knowledge attributions and that this is not merely conversational. We have three stipulations: (1) only semantic proposals are considered (no implicature, relevance, or assertion norms; and no difference in evidence between high and low stakes); (2) both must account for the shared-utterance case; (3) the dispute must not dissolve into just applying different standards without saying what fixes the standard and why.

  The output should have:
  1. A numbered section of agreed claims.
  2. A table of residual disagreements, stated in each side's own terms.
  3. Cruxes: specific sub-questions that would move at least one side if settled, with cases/arguments and each side's predictions.

  Cruxes to address:
  - Whose stakes matter: subject's, attributor's, or aggregate?
  - Can rational ignorance of stakes make one fail to know? Can irrational inflation of stakes make one know?
  - Does encroachment extend to rational belief/credence or stop at knowledge?
  - Can either view non-circularly specify what fixes the standard in the shared-utterance case?
  - Identify if any part is merely verbal and what substantive issue remains.

  Let's structure the response accordingly.

  **Part 1: Agreed Claims**

  Both sides agree on the following:

  1. **Bank Cases**: In standard bank cases (like DeRose's or Stanley's), the truth-value of knowledge attributions (or denials) shifts with the practical stakes. In low-stakes situations, it is true to say "S knows that the bank is open on Saturday", but in high-stakes situations, it is true to say "S does not know that the bank is open on Saturday", even when the subject's evidence and the fact of the matter are held fixed.

  2. **Not About**: 
     - The dispute is not about whether stakes affect knowledge attributions; both agree they do.
     - It is not about whether the effect is merely pragmatic (e.g., implicature, relevance, or norms of assertion); both agree the effect is semantic (per stipulation 1).
     - It is not about differences in evidence; both agree that in the cases under consideration, the subject's evidence is held fixed across stakes.

  3. **One Phenomenon**: The stakes-sensitivity observed in bank-style cases and in the shared-utterance case is a single phenomenon, not several distinct ones. That is, the same underlying mechanism (whatever it is) explains the shift in truth conditions in both types of cases.

  **Part 2: Table of Residual Disagreements**

  We present the disagreements in wording acceptable to each side.

  | Issue | Pragmatic Encroachment (PE) View | Epistemic Contextualism (EC) View |
  |-------|----------------------------------|-----------------------------------|
  | **Nature of the Stakes Effect** | The practical stakes faced by the subject affect what the subject knows. Knowledge is interest-relative: whether a true belief amounts to knowledge depends on the subject's practical situation. | The practical stakes in the context of attribution affect the truth conditions of the word 'knows'. The semantic content of 'knows' is context-sensitive, varying with the attributor's context. |
  | **Shared-Utterance Case: What is said?** | The single utterance "I checked: the last ferry leaves at 11" expresses the same proposition in both contexts (to both audience members) — a proposition about the ferry schedule. However, the knowledge attribution (if made) would be evaluated relative to the subject's (speaker's) stakes. Since the speaker is the subject and her stakes are fixed (say, low), she knows. But the high-stakes audience member might be wrong to rely on it without further evidence because of his own stakes. | The single utterance "I checked: the last ferry leaves at 11" is made in a context that must have a single standard. The standard is set by the highest stakes in the context (or by some other feature of the context of utterance). Thus, the utterance might express a knowledge claim that is false because the context is high-stakes due to one audience member, or it might express a knowledge claim that is true if the context is set by the speaker's stakes. (But EC must say what fixes it.) |
  | **What Fixes the Standard?** | The standard for knowledge is fixed by the subject's practical situation. This is because knowledge is a mental state that depends on the subject's environment, including practical factors. | The standard for knowledge is fixed by the context of attribution (the attributor's context). This is because 'knows' is a context-sensitive term, and its content is determined by the context of use. |

  **Part 3: Cruxes**

  We now address the cruxes. For each, we provide a case or argument that both sides would grant bears on the issue, and record each side's prediction in advance.

  1. **Crux: Whose stakes matter? (Subject's, attributor's, or aggregate?)**

     **Case/Argument**: Consider a case where the subject (S) is in a low-stakes situation, but an attributor (A) in a high-stakes context attributes knowledge to S. For example: S is at home, idly wondering if the bank is open on Saturday (low stakes). A is at the bank with a huge check to deposit, and says to a colleague, "S knows the bank is open tomorrow." 

     - **PE Prediction**: The attributor's claim is true. Since S is in a low-stakes situation, S knows. The attributor's high stakes do not affect whether S knows.
     - **EC Prediction**: The attributor's claim is false. In the high-stakes context of attribution, the standard for 'knows' is raised, so S does not meet that standard.

     **Why it moves the debate**: If we find that ordinary speakers judge the attributor's claim as true, it supports PE. If they judge it false, it supports EC.

  2. **Crux: Can rational ignorance of the stakes make one fail to know? Can irrational inflation of stakes make one know?**

     **Case/Argument**: 
     - *Rational Ignorance*: Subject S has strong evidence that p (say, that the store is open until 10). S is rationally unaware that the stakes are high (e.g., S doesn't know that a life depends on getting medicine from the store). 
     - *Irrational Inflation*: Subject S has weak evidence that p (say, a vague memory) but irrationally believes the stakes are extremely high (e.g., S thinks that if p is false, the world will end), and so S claims to know p.

     **PE Prediction**: 
       - In rational ignorance: S does not know p because the stakes are in fact high, even if S is unaware. Knowledge depends on the actual stakes, not the subject's awareness.
       - In irrational inflation: S does not know p because the actual stakes are low. The subject's irrational belief about stakes does not affect what is required for knowledge.
     **EC Prediction**: 
       - This case is not directly about attribution. But note: EC says the standard is set by the attributor's context, not the subject's. So if an attributor in a low-stakes context says of S (who is in high actual stakes but unaware), the attributor might truly say S knows (if the attributor's context is low). However, if we consider the subject's own self-attribution in a context reflecting her own (mistaken) stakes, then:
          - In rational ignorance: If S self-attributes in a context that doesn't reflect the high stakes (because she is unaware), then she might truly say she knows. But if an attributor in a high-stakes context (aware of the stakes) says it, then it's false.
          - In irrational inflation: If S self-attributes in a context that reflects her irrational high stakes, then she might falsely claim to know (because the standard is too high for her evidence). But if an attributor in a low-stakes context says S knows, it might be true.

     **Clarification**: This crux is tricky for EC because EC focuses on the attributor's context. But note the shared-utterance case might help.

     **Why it moves the debate**: PE ties knowledge to the subject's actual practical situation, regardless of the subject's beliefs about it. EC ties the truth of knowledge attributions to the attributor's context, which might or might not reflect the subject's situation.

  3. **Crux: Does encroachment extend to rational belief and credence, or stop at knowledge?**

     **Case/Argument**: Consider rational belief: is it permissible for a subject to believe p in a high-stakes situation with the same evidence that would make belief rational in low stakes? Consider credence: should one's rational credence in p depend on the stakes?

     **PE Prediction**: Pragmatic factors affect not only knowledge but also rational belief and credence. In high stakes, one may not rationally believe p even with the same evidence that would suffice in low stakes. Rational credence may also be affected (e.g., one might require higher credence to act in high stakes).
     
     **EC Prediction**: Pragmatic factors affect only knowledge attributions (via the context-sensitivity of 'knows'). Rational belief and credence are purely matters of evidence and do not shift with stakes. So, in high stakes, one might not know (because the standard is higher), but one can still rationally believe p if the evidence is sufficient for belief by invariant standards.

     **Why it moves the debate**: If we find that stakes affect rational belief (e.g., it's irrational to believe p in high stakes even with the same evidence), it supports PE's broader encroachment. If not, it supports EC.

  4. **Crux: Can either view non-circularly specify what fixes the standard in the shared-utterance case?**

     **The Shared-Utterance Case**: A speaker, with fixed evidence, says to two audience members: one who must act on it at very high stakes, the other who is idly curious. The speaker says, "I checked: the last ferry leaves at 11." We must say what that one utterance said, and for whom.

     **PE Account**: The utterance expresses the same proposition to both: that the last ferry leaves at 11. The speaker's knowledge is fixed by her own stakes (which are low, say). So, she knows. The high-stakes audience member should not rely on it without further evidence, but that doesn't affect the speaker's knowledge.

     **EC Account**: The context of utterance must have a single standard. What fixes it? EC must say without circularity (e.g., not just "the standard in the context"). Candidate: the highest stakes in the context (because of the high-stakes audience member) or the speaker's intended audience. But if EC says the standard is set by the highest stakes present, then the standard is high, and the speaker's claim to know (if made) would be false.

     **Challenge for Both**:
       - PE: Must explain why the high-stakes audience member might be wrong to act on the assertion. PE might say: because the audience member's own action requires knowledge relative to his stakes, which he doesn't have from the speaker's assertion alone. But the speaker's knowledge is unaffected.
       - EC: Must specify what feature of the context fixes the standard non-circularly (e.g., the stakes of the interlocutors, the speaker's intentions, etc.). If EC cannot do this without invoking the very knowledge attributions in question, it becomes circular.

     **Predictions**:
       - PE: The utterance is true and the speaker knows. The high-stakes hearer should not act without further evidence.
       - EC: The utterance context has a high standard (because of the high-stakes hearer), so the speaker's assertion of knowledge (if explicit) would be false. But note: the utterance is about the ferry time, not explicitly about knowledge. However, the context might affect whether the speaker is representing herself as knowing. If she says "I know the ferry leaves at 11", then in the high context, that's false.

     **Why it moves the debate**: If we can find a principled, non-circular way to fix the standard in the shared-utterance case, it will favor the view that provides it. If neither can, both might be in trouble.

  **Verbal Dispute?**

  We consider whether part of the dispute is merely verbal. Both sides agree that 'knows' is sensitive to stakes, but they explain it differently: PE by the nature of knowledge itself, EC by the context-sensitivity of the word. This might seem verbal: are they just talking about different things? But there is a substantive question: does the subject's mental state (knowledge) depend on practical factors, or does only the word 'knows' shift with context? The substantive issue is whether practical factors are part of the metaphysics of knowledge or only of the semantics of 'knows'. The shared-utterance case and the other cruxes help to decide.

  Thus, the joint statement:
answer: |-
  ### Joint Statement on Pragmatic Encroachment and Epistemic Contextualism

  **Preamble**  
  We, a defender of pragmatic encroachment (PE) and a defender of epistemic contextualism (EC), engage in this adversarial collaboration to clarify our shared and divergent commitments. Both views hold that ordinary knowledge attributions are sensitive to practical stakes in a way that is not merely conversational (e.g., not reducible to implicature, relevance, or assertion norms). We operate under three stipulations:  
  1. Only semantic accounts of stakes-sensitivity are considered; appeals to pragmatics, evidence variance, or non-semantic explanations are excluded.  
  2. Both views must resolve the *shared-utterance case*: A speaker with fixed evidence tells two listeners—one facing high stakes, the other low—"I checked: the last ferry leaves at 11." We must specify what this single utterance asserts and for whom.  
  3. Disagreements cannot dissolve into appeals to "different standards" without explaining what fixes the standard and why.  

  We present: (I) agreed claims, (II) residual disagreements, and (III) cruxes with test cases.  

  ---

  ### I. Agreed Claims  
  Both parties endorse the following:  

  1. **Bank-style cases exhibit genuine stakes-sensitivity**: In DeRose/Stanley-style bank cases, a subject with fixed evidence is accurately described as "knowing" in low-stakes contexts but "not knowing" in high-stakes contexts. This contrast is not an artifact of pragmatic mechanisms (e.g., Gricean implicature) or evidence quality; it reflects a semantic phenomenon.  

  2. **The dispute is not about**:  
     - **Whether stakes matter**: Both agree stakes affect knowledge attributions semantically.  
     - **The data's existence**: Bank cases and the shared-utterance case are valid probes for stakes-sensitivity.  
     - **Global invariantism**: Both reject views denying stakes-sensitivity (e.g., strict invariantism).  
     - **Subject-sensitive evidence**: Stakes alter knowledge conditions without altering the subject’s evidence.  

  3. **Stakes-sensitivity is one phenomenon**: The stakes-effect in bank cases and the shared-utterance case arises from a unified mechanism. It is not a patchwork of distinct effects (e.g., separate mechanisms for individual vs. group attributions).  

  ---

  ### II. Residual Disagreements  
  The table below states disagreements in each side’s preferred terminology, avoiding caricature.  

  | Issue | Pragmatic Encroachment (PE) | Epistemic Contextualism (EC) |
  |-------|-----------------------------|-------------------------------|
  | **Nature of stakes-sensitivity** | Knowledge itself is interest-relative: whether a subject’s true belief constitutes knowledge depends on the practical costs of being wrong *for the subject*. | ‘Knows’ is context-sensitive: the truth-conditions of knowledge attributions shift with the practical situation *of the attributor’s context*. |
  | **What the utterance asserts in the shared-utterance case** | The utterance semantically expresses a single proposition (e.g., <The last ferry leaves at 11>). The speaker’s knowledge is evaluated relative to *their own stakes* (typically low), so they know. The high-stakes listener cannot rationally act on it without additional evidence. | The utterance occurs in a context where one standard governs ‘knows’. The standard is set by *the highest stakes in the conversation* (via the high-stakes listener), so the speaker’s implied knowledge claim is false. |
  | **What fixes the epistemic standard** | The subject’s practical situation fixes the standard because knowledge is a mental state that supervenes on the subject’s environment. | The attributor’s practical situation fixes the standard because ‘knows’ is an indexical whose content is determined by the context of use. |

  ---

  ### III. Cruxes  
  We identify pivotal sub-questions (*cruxes*) where settling one would move at least one side. For each, we provide a case/argument both grant as decisive, with predictions recorded in advance.  

  #### Crux 1: Whose stakes matter?  
  **Sub-question**: Are the relevant stakes the subject’s, the attributor’s, or an aggregate?  
  - **Case**: *The Unaware Subject*. Subject S has strong evidence that a bridge is safe (e.g., recent inspection). S is rationally unaware that their friend (listener A) will cross it in high-stakes conditions (e.g., carrying vital medicine). Listener B (idly curious) asks S, "Do you know the bridge is safe?"  
    - **PE prediction**: S’s knowledge depends on *S’s own stakes* (low). Thus, S knows and speaks truly if they say "yes."  
    - **EC prediction**: The truth of "S knows" depends on *the attributor’s (B’s) stakes* (low). Thus, S speaks truly.  
    - **Why decisive**: If B’s stakes dominate, EC wins; if S’s stakes dominate, PE wins.  

  #### Crux 2: Can rational ignorance/irrational inflation affect knowledge?  
  **Sub-questions**:  
  - (A) Can a subject rationally ignorant of high stakes thereby fail to know?  
  - (B) Can a subject who irrationally inflates stakes thereby know?  
  - **Case**: *The Anxious Scientist*. Scientist S has conclusive evidence that a chemical is inert. In Case A, S is rationally ignorant that a spill would cause a disaster (high stakes). In Case B, S irrationally believes a spill would doom humanity (inflated stakes) but no disaster is possible. S asserts, "I know it’s safe."  
    - **PE prediction (A)**: S *fails to know* in Case A (actual stakes are high). (B) S *fails to know* in Case B (actual stakes are low; irrational inflation is irrelevant).  
    - **EC prediction (A)**: If S’s context ignores high stakes, S speaks truly; if an attributor’s context reflects high stakes, S speaks falsely. (B) S’s irrational inflation might raise their context’s standard, making "I know" false.  
    - **Why decisive**: PE ties knowledge to objective stakes; EC ties it to contextually salient stakes.  

  #### Crux 3: Does encroachment extend beyond knowledge?  
  **Sub-question**: Does stakes-sensitivity apply to rational belief/credence, or only knowledge?  
  - **Case**: *High-Stakes Belief*. Subject S has 90% evidence for p. In low stakes, S believes p. In high stakes (lifelong ruin if wrong), S suspends belief despite identical evidence. Is S’s belief rational in high stakes?  
    - **PE prediction**: Belief is *not rational* in high stakes; pragmatic encroachment extends to belief/credence.  
    - **EC prediction**: Belief *remains rational*; stakes-sensitivity is confined to knowledge via semantic context-shifting.  
    - **Why decisive**: If belief is stake-invariant, EC wins; if not, PE wins.  

  #### Crux 4: Can standards be fixed non-circularly?  
  **Sub-question**: Can either view non-circularly specify what fixes the standard in the shared-utterance case?  
  - **Challenge**: In the shared-utterance case, what non-circularly determines the standard (e.g., speaker’s stakes, highest listener’s stakes, average stakes)?  
    - **PE proposal**: The standard is fixed by the *subject’s (speaker’s) practical situation*, as knowledge is a mental state. Non-circular anchor: the speaker’s objective costs of error.  
    - **EC proposal**: The standard is fixed by the *conversational demands of the listeners*, with priority to the highest stakes. Non-circular anchor: the listener’s manifest practical interests.  
    - **Both predictions**:  
      - PE: Utterance is true; speaker knows (low stakes). High-stakes listener cannot act without more evidence.  
      - EC: Utterance is false; standard is set by high-stakes listener, so speaker’s implied knowledge claim fails.  
    - **Why decisive**: If one view provides a non-circular fixer, it prevails; if neither can, both face equal challenges.  

  ---

  ### Verbal Dispute and Substantive Residual  
  - **Merely verbal aspect**: Part of our disagreement is terminological. PE uses ‘knowledge’ for a mental state sensitive to the subject’s stakes; EC uses ‘knowledge’ for a context-sensitive relation. This masks underlying agreement that *something* semantic varies with stakes.  
  - **Substantive residual**: What varies? (1) The *metaphysics of knowledge*: PE says knowledge itself is stake-dependent; EC says only the word ‘knows’ shifts. (2) The *locus of stakes-sensitivity*: PE locates it in the subject’s psychology; EC in linguistic practice. The cruxes above target this substance.  

  ---  
  **Signed**,  
  [Defender of Pragmatic Encroachment]  
  [Defender of Epistemic Contextualism]
