prompt: |-
  i'm TAing a final-year philosophy of science seminar, 14 students, one 80-minute slot, and I've got the session on scientific realism and theory change. I want them to feel the pull of structural realism before I name it — the thought that when a theory gets overthrown we keep the equations and lose the furniture: the ethers and the calorics go, but the pattern of relations they were standing in survives into the successor theory, so maybe that pattern was all we ever should have believed in. But I also want them to feel the thing that makes me suspicious of it. If all a theory ultimately says is "there are some things, call them #1, #2, #3, standing in such-and-such relations, and everything we observe follows from that" — the theoretical names crossed out and replaced with blanks — then it looks like you can make it true with basically any old junk, as long as there's enough of it and you can arrange it to match the pattern: the pens in the room, four people's left shoes, some prime numbers. Last year I tried a version of this with a toy theory about three invisible magnets and it fell flat, mostly because I explained the point first and then asked them to do the exercise, which killed it.

  So: can you design the whole session for me — groups, materials (index cards and random junk, nothing that needs a projector), a timeline for the 80 minutes, and what exactly the facilitator says and doesn't say? My rough idea is that each group gets the "crossed-out" theory plus a pile of objects and has to build models that make it true, and then something turns on their noticing that they can do it again and again with completely different stuff, and that this is either the whole point or a disaster, without me having told them which. Two things I care about. First, the epistemological and the ontic versions shouldn't collapse into each other: "structure is all we can know" and "structure is all there is" have to come apart in the activity, and by the end students should be able to say which one the junk-model problem actually bites and which one it sort of doesn't. Second, I want a debrief that maps specific moments in the room onto specific claims, tells me what will predictably go wrong the first time I run it (I'm guessing someone builds a model with the wrong number of objects, and someone else says "well obviously the theory also says the things are physical / causal / in spacetime" and short-circuits the whole thing before anyone feels it), and is honest about what the game can't deliver — I suspect it can't show the continuity-across-theory-change argument that made structural realism attractive in the first place, since my little toy theory has no history, and it probably can't reproduce whatever makes the triviality worry bite for infinite domains rather than for four pens. Oh, and please don't put the words "structural realism" or "Ramsey" or "Newman" on any handout that goes out before the debrief, and no looking things up — just build it from what the setup already gives you.
reasoning: |-
  We are going to design an 80-minute session for 14 students. The goal is to have them experience the core idea of structural realism (the preservation of structural/relational patterns across theory change) and also the problem of "triviality" or "rampant realism" (that the abstract structural description can be made true by almost any collection of objects arranged appropriately). We want to avoid pre-empting the concepts and instead let the activity lead to the insights.

  Materials:
  - Index cards (for writing the theory and instructions)
  - A variety of random objects for each group (e.g., pens, paper clips, rubber bands, coins, dice, small toys, left shoes, etc. - but avoid magnets or anything that might have a strong inherent relational property that distracts).
  - Paper and pens for groups to sketch or note.

  Groups: 14 students -> 4 groups of 3-4 students each.

  Timeline (80 minutes total):
  1. (5 min) Introduction and setup.
  2. (10 min) Present the "toy theory" and task to the groups.
  3. (25 min) Group activity: Build models that satisfy the given theory (with the names crossed out).
  4. (15 min) Groups present their models and we note the variety.
  5. (15 min) Challenge: Build a model with a different set of objects that still satisfies the theory.
  6. (10 min) Debrief and discussion.

  Detailed Breakdown:

  **1. Introduction (5 min)**
  - Facilitator says: "Today we're going to do a hands-on activity. I'm going to give each group a description of a very simple scientific theory and a set of objects. Your task is to build a model that makes the theory true. We'll then see what we've discovered. Don't worry about the philosophical terms for now; just focus on the task."

  **2. Present the Toy Theory and Task (10 min)**
  - Hand out to each group:
     - One index card with the "theory" written on it (see below).
     - A pile of random objects (each group gets a different set, but make sure each set has at least 4-5 distinct types of objects and enough to represent 3 entities and their relations).
     - Paper and pens.

  The theory on the index card (with names crossed out):

  ```
  THEORY T:
  There are three entities: X, Y, Z.
  They are related by a binary relation R such that:
  - R(X, Y) holds.
  - R(Y, Z) holds.
  - R(Z, X) holds.
  - R is symmetric: if R(A, B) holds then R(B, A) holds.
  - R is irreflexive: for any entity, R(A, A) does not hold.
  ```

  But note: the names X, Y, Z are crossed out (so it's clear they are placeholders). So the card should look like:

  ```
  THEORY T:
  There are three entities: ~~X~~, ~~Y~~, ~~Z~~.
  They are related by a binary relation R such that:
  - R(~~X~~, ~~Y~~) holds.
  - R(~~Y~~, ~~Z~~) holds.
  - R(~~Z~~, ~~X~~) holds.
  - R is symmetric: if R(A, B) holds then R(B, A) holds.
  - R is irreflexive: for any entity, R(A, A) does not hold.
  ```

  Facilitator instructions:
  - "Your group has a theory and a set of objects. The theory describes a structure of relations among three entities. The names of the entities (X, Y, Z) are just placeholders. Your task is to assign objects to be the entities and define a relation R on them such that all the conditions hold. You have about 20 minutes. Be ready to present your model by showing which objects are the entities and how the relation R works."

  **3. Group Activity (25 min)**
  - Groups work. The facilitator circulates to help if there are questions and to observe. Common issues to anticipate:
     - A group might use more than three objects: remind them the theory is about three entities.
     - A group might try to use the same object for two entities: remind them that the entities are distinct (if the theory doesn't explicitly say distinct, we should add that? Actually, the irreflexivity and the fact that we have three relations might imply they are distinct? But to be safe, we can add: "There are exactly three distinct entities").
     - A group might define R in a way that doesn't satisfy symmetry or irreflexivity: ask them to check the conditions.

  Note: We want to avoid groups imposing extra conditions (like physicality, causality, etc.). If a group says, "But R has to be a physical relation," the facilitator should say: "For this exercise, you can define R arbitrarily. It doesn't have to be a known physical relation; it can be any relation you define as long as it satisfies the conditions."

  **4. Group Presentations (15 min)**
  - Each group has 3 minutes to present. They show:
     - Which three objects they chose.
     - How they defined R (e.g., "R holds between two objects if they are the same color", or "if they are connected by a paper clip", or "if one is to the left of the other", etc.).
     - How their model satisfies the conditions.

  Facilitator writes down the definitions of R and the objects used for each group on the board.

  **5. Challenge (15 min)**
  - Facilitator says: "Now, each group must build a model with a completely different set of three objects from what you just used, and a completely different relation R (so not the same definition as before) that still satisfies the same theory. You have 10 minutes."

  Groups work quickly to come up with a second model.

  Then, briefly, each group shares their new model (1 minute per group).

  **6. Debrief (10 min)**
  - Facilitator leads discussion with questions:
     - "What did you notice about the models we built? (They were very different in terms of objects and relations.)"
     - "Was it hard to come up with models? (Probably not.)"
     - "What does this tell us about the theory? The theory only specified a structure of relations. We were able to make it true with many different kinds of objects and relations. So what does the theory really tell us about the world?"

  Now, we introduce the two interpretations without naming structural realism yet:
     - Epistemological: Maybe the theory only gives us knowledge of the structure (the pattern of relations) and not the nature of the objects. Because we see that the same structure can be realized in many ways.
     - Ontological: Maybe the world is just structure? But then note: we built structures with different objects. Is the structure the same if the objects are different? Or is the structure dependent on the objects?

  The triviality worry: 
     - "If the theory only says that there exist three things with this relational pattern, and we can make it true with any three things (as long as we define R appropriately), then does the theory really tell us anything about the world? It seems too easy to satisfy. That might be a problem for the view that structure is all there is (ontic structural realism) because then the world could be any old junk arranged in the pattern. But for the epistemological view, it might be okay: we know the structure, but we don't know what the objects are, and that's why we can have multiple realizations."

  Finally, the facilitator can name the positions and connect to history:
     - "What you've experienced is a key argument for structural realism: that in scientific revolutions, the structure (the equations, the relations) is preserved, even though the objects (the 'furniture') change. But we also see a problem: that the structural description might be too easily satisfied, which is known as the Newman problem or the triviality objection. This objection primarily targets ontic structural realism because if the world is only structure, then any realization would make the theory true, but we want our theories to be about the actual world and not just any possible world. For the epistemological view, the multiple realizations are acceptable because we are agnostic about the objects."

  Anticipated problems and how to handle:
  - Problem: Group uses the wrong number of objects. 
     - Solution: Emphasize at the start: "exactly three distinct entities". The facilitator should catch this during the activity and correct.
  - Problem: Group imposes physical/causal constraints on R. 
     - Solution: The facilitator should remind them that R can be arbitrarily defined. They can choose any relation as long as it meets the conditions.
  - Problem: The activity doesn't show continuity across theory change. 
     - Acknowledge in debrief: "In real science, we have a sequence of theories. What we've done today is a snapshot: we saw that the same structure can be realized in multiple ways. The historical argument for structural realism is that when a theory is replaced, the structure of the old theory is often preserved in the new one. We haven't simulated that, but we have seen that structure is multiply realizable, which is a key feature that structural realism uses to explain theory change."
  - Problem: The triviality worry for finite vs. infinite domains. 
     - Note: The toy theory uses a finite domain (3 objects). The triviality problem is more severe for infinite domains because then you need a domain of the right cardinality. We can mention in debrief: "In more complex theories with infinite domains, the problem becomes one of having enough objects to satisfy the structure. But the core issue remains: if the structure is all we specify, then any set of objects of the right size can be arranged to satisfy it, which might make the theory too easy to be true."

  Handouts: Only the index card with the crossed-out theory. No philosophical terms until the debrief.

  By the end, students should have:
  - Experienced building multiple models for the same structural description.
  - Noticed that the objects and the specific relation can vary arbitrarily.
  - Separated the epistemological issue (we only know the structure) from the ontic issue (the structure is all there is) by seeing that the triviality worry challenges the ontic view more directly.

  This design avoids pre-teaching the concepts and instead builds them from the activity.
answer: |-
  Below is a fully designed 80-minute session plan that meets your requirements. The activity uses **anonymous index cards** and **random junk** to create an experiential "aha" moment around structural realism's core insight and its vulnerability to triviality, while avoiding premature labeling. The debrief explicitly separates epistemological and ontic concerns and maps classroom moments to philosophical claims.

  ---

  ### **Materials Per Group (4 groups total)**
  - **Theory Card** (index card with crossed-out names):  
    *"There exist three entities: ~~A~~, ~~B~~, ~~C~~.  
    Relations:  
    - R(~~A~~, ~~B~~) holds.  
    - R(~~B~~, ~~C~~) holds.  
    - NOT R(~~A~~, ~~C~~) holds.  
    - R is symmetric: If R(X,Y) holds, then R(Y,X) holds."*  
    *(No other text—no "structural realism," "Ramsey," etc.)*  

  - **Junk Pile** (distinct sets per group):  
    Group 1: 3 pencils, 2 spoons, 4 rubber bands, 1 die.  
    Group 2: 4 coins, 1 key, 3 bottle caps, 1 eraser.  
    Group 3: 2 shoes, 1 phone charger, 5 paperclips, 1 rock.  
    Group 4: 1 mug, 3 sticky notes, 2 batteries, 1 sock.  

  - **Blank index cards & pens** (for defining R).  
  - **Timer** (for facilitator).  

  ---

  ### **Session Timeline (80 min total)**  
  **Goal:** Students *feel* structural continuity and triviality through modeling, without labels. Debrief separates epistemology/ontology.  

  #### **Phase 1: Setup (5 min)**  
  - **Facilitator Script:**  
    *"We’re exploring how scientific theories represent the world. Each group has a theory card describing relations between entities, plus physical objects. Your task: Use your junk to build a real-world scenario where this theory is true. Define what the entities (A,B,C) are and what relation 'R' represents. You have 15 minutes. No need to overthink—just make it work."*  
  - **Key Silence:** DO NOT clarify if entities must be physical, causal, etc. Let ambiguity surface organically.  

  #### **Phase 2: First Modeling (15 min)**  
  - Groups build models (e.g., Group 1 might assign: A=pencil, B=spoon, C=rubber band; R="touching").  
  - **Anticipated Issues & Scripted Interventions:**  
    - *Wrong object count:* If a group uses ≠3 entities, ask: *"Check your theory—how many entities does it require?"*  
    - *Physicalism shortcut:* If a group insists R *must* be causal (e.g., "R has to be magnetic!"), say: *"The theory doesn’t specify what R is—you define it. Could R be something abstract, like 'is the same color'?"*  
    - *Violates symmetry:* If R isn’t symmetric (e.g., "A is left of B"), ask: *"If R(A,B) holds, does R(B,A) hold in your model? Check the theory."*  

  #### **Phase 3: Model Sharing (10 min)**  
  - Each group has 2 min to:  
    (1) Show their entities (e.g., "A=coin, B=key, C=eraser").  
    (2) Define R (e.g., "R = 'stacked on top of'").  
    (3) State how it satisfies all relations.  
  - **Facilitator:** List group definitions on the board. Highlight diversity.  

  #### **Phase 4: The Pivot (10 min)**  
  - **Facilitator Script:**  
    *"Great—you all made the theory true. Now, a twist: Pass your entire junk pile to the group on your left. New task: Using this* different *set of objects, build a* new *model for the* same *theory. But you must define R in a* completely new way *—no repeating what the prior group did. 10 minutes."*  
  - **Why This Works:** Forces discontinuity in objects ("furniture") while preserving relations ("equations"). Students *feel* structure surviving theory change.  

  #### **Phase 5: Second Model Sharing (10 min)**  
  - Groups share new models (e.g., Group 2 now uses Group 1’s pencils/spoons: "A=pencil, B=spoon, C=die; R = 'same length as'").  
  - **Facilitator:** Note on the board how R-definitions changed. Ask: *"What stayed the same across both rounds?"* (Guide them to "the pattern of relations," not objects).  

  #### **Phase 6: The Triviality Challenge (15 min)**  
  - **Facilitator Script:**  
    *"Final challenge: Pick any three things in this room—not from your junk pile—and define R to make the theory true. Examples: chairs, windows, or even abstract concepts like 'prime numbers' or 'thoughts in my head.' 5 minutes."*  
  - Groups brainstorm (e.g., "Entities: clock, door, TA; R = 'is north of'").  
  - **Facilitator:** Cold-call groups. If resistance arises (e.g., "But R has to be scientific!"), probe: *"What in the theory forces R to be physical?"*  

  #### **Phase 7: Structured Debrief (15 min)**  
  **Goal:** Name structural realism, separate epistemology/ontology, and map activity to philosophy.  

  | **Classroom Moment**          | **Philosophical Claim**                                                                 | **Epistemology vs. Ontology**                                  |  
  |-------------------------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------|  
  | Phase 3 (diverse models)      | *Continuity of structure:* Same relations work with different objects.                  | **Epistemology:** We can *know* the structure without knowing objects. |  
  | Phase 5 (new R, same pattern) | *Theory change:* Objects/furniture change, but relational pattern persists.             | **Ontology:** Is the pattern *all that exists*? Or just what we access? |  
  | Phase 6 (trivial models)      | *Triviality worry:* Any junk can realize the structure if you force-fit R.              | **Bites ONTOLOGY:** If structure is *all there is*, theory is trivially true. <br> **Spares EPISTEMOLOGY:** We can *know* structure even if multiple realizations exist. |  

  - **Facilitator Script:**  
    *"You experienced two key ideas: (1) When objects changed, the* relational pattern *persisted—like how equations survive when 'caloric' becomes 'kinetic energy.' (2) But then, you could make the theory true with* anything*—pens, primes, or professors. That’s the tension.*  
    *"Epistemologically, maybe science only gives us knowledge of structure (the pattern). But ontologically, if structure is* all that exists*, then your trivial models suggest science isn’t latching onto reality—it’s too easy. This worry doesn’t sink the* epistemological *claim, because knowing structure is still useful even if multiple realizations exist.*  
    *"What this activity* can’t *show: Why structure persists in* real *theory change (e.g., Maxwell’s equations surviving ether’s death). And triviality is worse for infinite domains—you can’t 'force-fit' R if the structure is complex enough to require uncountable objects."*  
  - **Finally:** Name "structural realism" and acknowledge Newman’s objection.  

  ---

  ### **Predictable Pitfalls & Mitigation**  
  1. **"Objects must be physical/causal!"**  
     - *Likelihood:* High (2-3 groups).  
     - *Mitigation:* In Phases 2/6, refuse to endorse/reject this. Say: *"The theory card doesn’t say that—so can you try without it?"* If pressed: *"Imagine a theory from 1700s physics—did it specify 'physical' in a way we’d accept today?"*  

  2. **Wrong entity count/relations:**  
     - *Likelihood:* Moderate (1 group).  
     - *Mitigation:* Preempt in setup: *"Count your entities—the theory requires exactly three."* Circulate to catch errors early.  

  3. **"This is pointless—we’re just making stuff up!"**  
     - *Likelihood:* Low (if activity is fast-paced).  
     - *Mitigation:* In debrief, validate: *"Exactly! The worry is that if structure is all there is, science might be 'just making stuff up.' But is that fair if the structure predicts experiments?"*  

  4. **Collapsing epistemology/ontology:**  
     - *Mitigation:* In debrief, use explicit labels ("epistemological" vs. "ontological") and tie to moments: *"When you reused the pattern with new junk (Phase 5), that supported the* epistemological *claim. When trivial models felt 'cheap' (Phase 6), that challenged the* ontological *claim."*  

  ---

  ### **What This Activity Cannot Do (Debrief Honesty)**  
  - **No theory-change continuity:** Toy theories lack history. *Solution:* Briefly analogize to Maxwell or Fresnel’s equations in debrief.  
  - **No infinite-domain triviality:** Finite junk piles avoid complex math. *Solution:* Note in debrief: *"For big structures (e.g., quantum fields), triviality requires a universe-sized junk pile—which is its own problem."*  
  - **No realism/antirealism resolution:** Activity *exposes* the tension but doesn’t solve it. *Embrace this:* *"Your discomfort is the point—structural realism isn’t a free lunch."*  

  ---

  ### **Why This Works**  
  - **Discovery > Lecture:** Students *feel* structural persistence (Phase 5) and triviality (Phase 6) before labeling.  
  - **Junk forces abstraction:** Physical objects paradoxically highlight non-physical realizations.  
  - **Epistemology/Ontology decoupled:** Triviality "bites" in Phase 6 (ontic), but Phase 5’s pattern reuse supports epistemic structural realism.  
  - **No jargon pre-debrief:** Cards say "entities" and "relations," not "structure."  

  Run it tight, let the chaos of mismatched shoes and prime numbers make the point, and debrief rigorously. By the end, they’ll have named the tension—and you can hand them the "-ism" to pin it down.
