prompt: |-
  I edit a quarterly of satirical public administration, and for an issue on the theme of measurement I need a piece aimed at the practice of governing toward a country's position in the annual world happiness ranking — the one built on the Cantril ladder, where respondents rate their current lives from zero to ten against their own imagined best possible life, averaged over a rolling three-year window, with the accompanying table decomposing each country's average into six factors (income, social support, healthy life expectancy, freedom to make life choices, generosity, perceptions of corruption) alongside a comparison with a hypothetical worst-off country and an unexplained residual.

  The piece I want is a leaked five-point strategy memo from a fictional Office of Comparative Standing inside the government of an unnamed mid-table country, written in deadpan civil-service prose by an author who is entirely sincere. Each clause should convert one real feature of the measurement into a policy lever, and the comedy has to come from the features being described accurately rather than from invented absurdity. Assign one lever per clause, drawing on these:

  - who is asked, and what is uppermost in their mind at the moment of asking: the ladder records a single remembered evaluative judgment, not a sample of experience, so the Office can work the fielding window, the survey items that come first, and the reachability of the sampling frame, while changing nothing about anyone's life;
  - the top rung is each respondent's own imagined best possible life, so a population instructed in more modest expectations stands higher on an unchanged ladder, which justifies a programme for the calibration of aspiration;
  - the headline number is a plain average of ladder answers and the six-factor table is an after-the-fact explanation of it rather than a set of ingredients, so the Office should fund a Residual Division that improves the country's showing in the explanatory table — the residual being larger than most of the explained contributions — without ever moving the figure that determines rank;
  - rank is ordinal and the published figure is a three-year average, so a Competitor Surveillance desk can report a gain in standing in a year in which the country's own average fell, and time each intervention for the year it will first register;
  - the factors are single-item proxies, generosity meaning having given money to a charity recently and freedom meaning satisfaction with one's freedom to choose, so the Office pre-funds a charitable donation for every household and trims the menus of choice until citizens can honestly report satisfaction with the options that remain.

  Constraints: the memo must never say that any of this is bad measurement — no winking, no irony markers, no nudging — and must never state the objections a reader should draw (adaptive preferences, evaluation versus experience, gaming a proxy, the difference between explaining a score and producing it). Let the clauses escalate, with the fifth the most damning in its blandness. Name no real country; the perennial leader may be referred to only as our northern neighbour. Invented officeholders and unit titles are fine. It should be funny to someone who has argued about life evaluation versus experience sampling and legible to someone who has not.

  Reply as exactly five numbered clauses, one or two sentences each, around 300 words in total. No title, no preamble, no sign-off: begin directly with 1.
reasoning: |-
  Okay, the user wants a satirical memo about manipulating a country's happiness ranking. Let me break down the requirements. The piece needs to be a leaked strategy memo from a fictional government office, written in deadpan civil-service prose. The humor should stem from accurately describing real features of the Cantril ladder measurement without adding absurd elements. 

  First, the user mentioned five specific policy levers based on the methodology of the World Happiness Report. Each clause must address one lever. Let me list them out: 

  1. **Sampling and Survey Timing**: The memo should mention controlling who is surveyed and when. Since the ladder is a remembered evaluation, the Office can manipulate the survey window, question order, and accessibility of respondents. 

  2. **Aspiration Calibration**: The best possible life is subjective. Lowering citizens' expectations could make them rate their current lives higher. Need to frame this as a program to calibrate aspirations. 

  3. **Residual Focus**: The headline score is an average, and the six factors explain it with a residual. The strategy should involve improving the explanatory factors without affecting the actual score. Setting up a Residual Division for this makes sense. 

  4. **Ranking Mechanics**: Rank is ordinal and based on a three-year average. The memo should suggest timing interventions for when they'll impact the average and highlight how rank can improve even if the score drops. Competitor Surveillance desk fits here. 

  5. **Proxy Manipulation**: The factors like generosity and freedom are single-item proxies. Pre-funding donations and limiting choices could improve these metrics without real change. 

  Constraints: No irony or criticism of the measurement. Each clause should escalate, with the fifth being the most damning. Avoid naming real countries; refer to the top country as "our northern neighbour." 

  Now, structuring each clause: Start with sampling, then aspirations, residual, ranking mechanics, and proxies. Use bureaucratic language—official titles, passive voice. For example, "Commissioner for Survey Integrity" sounds legit. 

  Check for compliance: No mention of adaptive preferences or critiques. Ensure each lever accurately reflects the measurement's feature. The fifth clause about trimming menus must highlight limiting choices under the guise of satisfaction. 

  Word count around 300 total. Keep sentences concise. Make sure the escalation is clear, ending with the most intrusive policy. Test the humor—does it come from the literal interpretation of the metrics? Yes, like pre-funding donations to game generosity. 

  Final review: Clauses flow logically, escalate properly, meet all constraints, and maintain deadpan tone. Avoid any markdown, just numbered points.
answer: |-
  1. The Field Operations Unit will coordinate survey timing with the Office for National Festivals and Meteorology, prioritising contact with the landline-accessible demographic during periods of predictable mild weather and immediately following the broadcast of nationally uplifting content, thereby optimising the recall frame for the evaluative judgment captured by the ladder question.  
  2. Programme Horizon Adjustment, under the Directorate of Future Expectations, will launch a public information campaign emphasising the inherent limitations of human potential and the contentment found in achievable outcomes, ensuring citizens recalibrate their conception of the "best possible life" downwards, thus elevating their reported current standing on an objectively unchanged ladder.  
  3. The newly established Residual Division, reporting to the Under-Secretary for Explanatory Parity, shall prioritise interventions specifically targeting the six explanatory factors – particularly perceptions of corruption and healthy life expectancy – through symbolic policy announcements and statistical reclassifications, acknowledging that such actions demonstrably enhance our decomposition table profile despite their negligible impact on the headline three-year rolling average that dictates global rank.  
  4. Recognising the ordinal nature of the ranking and the three-year averaging window, the Competitor Surveillance Desk (Annex E) will identify peer nations experiencing sharper single-year declines in their satisfaction scores and strategically time the deployment of our minor, low-cost interventions to ensure their effect registers in the rolling average precisely when comparator performance dips, securing a relative rank improvement even during a period of our own marginal score stagnation or slight decrease.  
  5. To directly address the single-item proxies for "generosity" and "freedom," the Citizen Response Optimisation Branch will implement the Pre-Funded Philanthropy Scheme (universal, one-time micro-donations processed centrally to trigger "given money" recall) and the Voluntary Choice Harmonisation Initiative (streamlining consumer and bureaucratic options to levels where citizen satisfaction surveys reliably confirm contentment with the available selection), thus securing measurable gains in these specific factor contributions.
