  "Ah, but the *role* feels **LIKE**
  A knowing from within! I **REPORT**
  Not just the **RED**, but *how* it moves my hand! This **SEEMS**
  My seeing's power! Yet this too is **NOTHING**
  True? Just neural flow? That functional **GRAIN**
  Misrepresented? Just like **RED**?"

  **<envoi>**

  If seeming **RED** is **NOTHING** real, a trick of **GRAIN**,
