  To say it's **NOTHING** feels a hollow cheat,
  Though what it *is*, escapes all words **LIKE** these.

  The inner eye observes, distinct and **LIKE**
  A lens on essence. Surely it **SEEMS**
  So fundamental, cannot be **NOTHING**!
  This flush, this specific shade of **RED**,
  A truth revealed where sensors **REPORT**
  The felt minutiae, every **GRAIN**.

  The skeptic scorns this inner **GRAIN**:
  "Such richness is a phantom, **LIKE**
