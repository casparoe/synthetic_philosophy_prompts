prompt: |-
  Hey — I'm the community member on my hospital's ethics committee (I write software, which I assume is why they asked me to sit on it), and I need a short decision memo I can circulate before Thursday's meeting.

  We're trying to write a standing rule for how we spend a fixed budget for a new drug. Two live cases are forcing the issue.

  Case one: the same money funds either three patients with a progressive disease — each gets roughly six years of decent life, and without it they decline fast — or about 300 people with a mild chronic condition, each getting maybe three weeks of modest symptom relief. Our health-economics person says the 300-person option actually wins on total QALYs, though barely. Most of the committee thinks that's obviously the wrong answer and wants the three. One member says we're just falling for the identifiable-victim effect and should stick with the arithmetic.

  Case two: a screening change that adds about twenty minutes of waiting and a very small extra infection risk to 40,000 patients a year, and is expected to save around two lives a year. Everyone, including the people who hated the QALY math in case one, wants to approve it.

  Here's where I'm stuck. Our chair keeps muttering about "the separateness of persons," which I gather is a real philosophy thing but I've never seen it turned into a rule anyone could apply. The version I sketched is: you can't justify one person's loss by adding up a pile of smaller gains to other people — you have to be able to point at someone whose gain is bigger than that one person's loss, and you can't spend the same gain twice. But when I trace it through, that seems to block case two as well as case one, which makes me think I've stated it wrong.

  Can you draft the memo? I need a recommendaton at the top, a rule with a baseline and a threshold we could actually apply at the table, verdicts on both cases, and an honest go at the strongest argument against whatever rule you land on — the identifiable-victim worry if you go separatist, or the "then you can't justify any public health measure" one if you don't. Keep it under two pages; the clinicians won't read more.
reasoning: |-
  Okay, the user is on a hospital ethics committee and needs a decision memo by Thursday. They're a software developer, so they might not have a deep background in ethics but are logical thinkers. The main issue is how to allocate a fixed budget for a new drug between two very different patient groups. 

  First, let's understand the two cases. Case one: spend on three patients with a progressive disease (each gets six good years) vs. 300 patients with a mild chronic condition (each gets three weeks of modest relief). The QALY calculation slightly favors the 300 patients, but most committee members feel that's wrong. Case two: a screening change that inconveniences 40,000 patients slightly but saves two lives yearly—everyone supports this despite it involving aggregated small harms.

  The chair keeps mentioning "separateness of persons," which is a philosophical concept from thinkers like John Rawls and Robert Nozick. It emphasizes that individuals shouldn't be sacrificed for the greater good because each person has distinct moral value. The user tried to draft a rule but found it blocked both cases, so they're stuck.

  Breaking this down: The user needs a clear, applicable rule that resolves both cases consistently. The memo must have a recommendation upfront, a practical rule with thresholds, verdicts on both cases, and address counterarguments. The challenge is reconciling the committee's intuitive rejection of pure QALY in case one with their acceptance of aggregated small harms in case two.

  For the rule, I'm leaning toward a "Harm-Benefit Threshold" approach. This would allow aggregation only when individual harms are below a de minimis level. That justifies case two's screening (tiny per-person harm) but blocks case one's trade-off (massive harm to three individuals). 

  The strongest counterarguments: For this rule, someone could say it's arbitrary to set a de minimis line. For the alternative (pure QALY), the counter is that it ignores identifiable suffering—like abandoning the three patients. The memo should acknowledge both.

  Structurally: Start with a blunt recommendation (fund the three patients, approve the screening), then explain the rule, apply it to both cases, and preempt counterarguments. Keep it under two pages with clear headings—clinicians are busy. 

  User's unspoken need: They want to avoid hypocrisy. If the committee rejects QALY math in case one but uses it in case two, the rule must explain why that's consistent. The "de minimis" threshold does that by distinguishing catastrophic vs. trivial individual harms.

  Also, the user mentioned being the "community member"—they might feel out of depth among ethicists. The memo should sound authoritative but not jargon-heavy. Anchor in practical thresholds ("cost-equivalent of a coffee") to make it tangible.
answer: |-
  ## Ethics Committee Decision Memo: Budget Allocation Framework  
  **Recommendation:** Adopt the **Harm-Benefit Threshold Rule** (outlined below) for fixed-budget drug allocation. Apply it to conclude:  
  - **Case 1:** Fund the **three progressive-disease patients** (reject the 300-person option).  
  - **Case 2:** **Approve the screening change** (minor aggregate harm justified by life-saving benefit).  

  ---

  ### Proposed Rule: The Harm-Benefit Threshold  
  **Baseline Principle:** *The Separateness of Persons* requires that we cannot morally sacrifice one individual’s fundamental interests solely by aggregating smaller benefits to others.  
  **Operational Threshold:**  
  > "A policy imposing **non-trivial harm** (loss of health, opportunity, or well-being above a *de minimis* level) on specific individuals may only be justified if:  
  > **(a)** The harm to *each affected individual* is outweighed by a *direct, greater benefit* to that same individual; **OR**  
  > **(b)** The harm to *each affected individual* is **below a *de minimis* threshold** (e.g., minor inconvenience, negligible risk), *and* the **aggregate benefit to others is substantial and ethically compelling** (e.g., saving lives, preventing severe disability)."  

  **Key Definitions:**  
  - **Non-trivial harm:** Any harm exceeding the *de minimis* threshold (e.g., >1% risk of serious injury, >30 min of severe pain, loss of significant life opportunity).  
  - ***De minimis* harm:** Trivial burdens (e.g., <5 min routine waiting, negligible infection risk <0.001%, minor paperwork).  
  - **Substantial aggregate benefit:** Clear prevention of severe harm (e.g., death, disability) to others.  

  ---

  ### Application to Cases  
  **Case 1:** *3 patients (6 years decent life) vs. 300 patients (3 weeks symptom relief)*  
  - **Verdict:** **Fund the 3 patients.**  
  - **Reasoning:**  
    - Denying treatment to the 3 patients inflicts **non-trivial harm** (catastrophic decline, loss of years of life).  
    - This harm cannot be justified by aggregating 300 tiny benefits (3 weeks’ mild relief), as each tiny benefit is **not greater than the harm to any single progressive-disease patient** (violating Threshold a).  
    - The *de minimis* exception (Threshold b) fails because the harm to the 3 is severe, not trivial.  
    - *QALY arithmetic is overridden* here because it sacrifices identifiable individuals facing ruinous loss for diffuse small gains.  

  **Case 2:** *Screening change (20-min wait + tiny risk for 40k patients, saves ~2 lives/year)*  
  - **Verdict:** **Approve the screening change.**  
  - **Reasoning:**  
    - The harm per patient (20-min wait, negligible risk) is **below the *de minimis* threshold** (minor inconvenience).  
    - The aggregate benefit (saving ~2 lives/year) is **substantial and ethically compelling**.  
    - Thus, Threshold b applies: trivial individual harms are justifiably aggregated to achieve a significant lifesaving benefit.  

  ---

  ### Strongest Argument Against This Rule & Response  
  **Argument (from QALY proponents):**  
  *"This rule is irrational sentimentality. By prioritizing ‘identifiable victims,’ we waste resources that could help far more people. Case 1’s 300 patients have real suffering; denying them relief to save 3 others is inefficient and ignores the greater total QALY gain."*  

  **Response:**  
  Efficiency alone cannot override moral constraints against imposing catastrophic harm on specific individuals. While aggregation is valid for trivial harms (*Case 2*), it fails when applied to severe, life-altering losses (*Case 1*). The rule prevents *using people as mere means* to others’ ends—a core tenet of medical ethics. Total QALY remains useful for comparing policies *without non-trivial harms*, but not when it demands sacrificing identifiable persons.  

  ---

  ### Strongest Argument Against *Rejecting* This Rule & Response  
  **Argument (from rights-based critics):**  
  *"If we don’t adopt a separateness-based rule, we permit monstrous trade-offs—e.g., killing one healthy person to harvest organs for five dying patients. Public health measures (like sanitation taxes) also aggregate small harms for large benefits; wouldn’t this rule forbid them?"*  

  **Response:**  
  This rule explicitly **permits** public health measures under Threshold b, as they impose only *de minimis* harms (e.g., minor costs, inconvenience). Organ harvesting violates Threshold a (harm not outweighed by personal benefit) *and* b (harm is non-trivial). The *de minimis* threshold ensures society can function (e.g., collect taxes, require vaccinations) without violating individual rights.  

  ---  
  **Submitted by:** [Your Name], Community Member (Software Engineering)  
  **For Vote:** Thursday’s Meeting  
  **Rule Summary:** No non-trivial harm to identifiable individuals without greater personal benefit, *unless* harms are trivial (*de minimis*) and aggregate benefit is lifesaving/severe-harm-preventing.
