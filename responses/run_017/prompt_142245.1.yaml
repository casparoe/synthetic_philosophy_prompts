prompt: |-
  I'm a senior at a big public high school in central Ohio, and I run our Philosophy Club's "unresolved disputes" series: two members spend a month on one question, argue past each other, and then have to produce a written summary of where they actually landed. We ran Kavka's toxin puzzle last semester and it went exactly as you'd predict — both sides got better at stating their own case and neither moved an inch — so I want to do the format properly this time, and I'd like you to draft the document that a good-faith adversarial collaboration between the two camps would have produced.

  The case, stated cold: an eccentric billionaire puts a vial in front of you and offers you a million dollars on the condition that at midnight tonight you have formed a settled intention to drink the contents tomorrow afternoon. The vial makes you painfully ill for about a day and has no lasting effects; you need not drink it to be paid, and in fact the money lands in your account hours before the drinking would happen, so you are entirely free to change your mind. Assume the billionaire has an unerring way of telling whether the intention was formed, so nothing here turns on his being fooled, and assume you are not the sort of agent who has somehow lost the capacity to make plans. The club split into two camps. Call them the Inaccessibilists: they say the intention is not available to you at all, because intending to do something is constitutively tied to your own take on your reasons for doing it at the time of action, so an agent who now knows she will have no reason whatsoever to drink tomorrow cannot now intend to drink, and the offer is one that in principle nobody can collect on. Call the others the Accessibilists: they say there is no in-principle barrier, that an intention can be adopted now for reasons that need not be the agent's reasons at the time of action (that is largely what planning is for), and that what actually blocks you is something else — the awkwardness of intending at will, or the fact that your intention would be evidence about what you will later do, or an unwillingness to engage in something close to self-deception.

  What I want is the joint statement both camps could sign. Give me, first, a numbered section of claims both can accept — including about the setup, about what an intention would have to be like if it were formed, and about which moves are cheating (for example, I suspect both sides should agree that you can't collect by intending to drink in order to preserve your self-conception as someone who follows through, since that supplies a reason at the time of action and thus doesn't engage the puzzle — but if one side would reject that, say so). Second, a disagreements table in which each remaining dispute is stated twice, once in wording an Inaccessibilist would accept for her own view and once in wording an Accessibilist would accept for his, with a note on whether the dispute is genuine or merely verbal — and if part of it is verbal, I want to know which part and why, since I have a suspicion that at least one of our fights was really about how to use the word "intention." Third, for each crux, one concrete case, argument, or finding both sides would accept as bearing on it, with each side's prediction written down in advance. Cruxes I'd guess at, to be confirmed, corrected, or replaced: whether intending requires believing (or at least not disbelieving) that you will do the thing; whether intending is all-or-nothing or admits of degrees, and whether the puzzle quietly assumes it is binary; whether the barrier is the disappearance of reasons or merely the unpleasantness of the act — testable, I think, with what I've been calling the grape variant, in which you must intend to do something harmless and pointless tomorrow, like eating one grape at 6 a.m., knowing you will then have no reason to; whether a trivial independent reason at the time of action (the billionaire quietly adds a five-dollar payment for actually drinking) unlocks the intention, which would suggest the real argument is about how much of a reason is needed rather than whether any is; what to say about the iterated version, in which this happens a hundred nights running and you acquire a track record of having formed such intentions; and whether an intention counts as formed if it can only be produced by a route that bypasses your judgment, such as a pill, a fit of pique, or post-hypnotic suggestion. Please also tell me plainly which crux, if settled, would actually move at least one camp, which are empirically tractable in any way at all, and whether either view has quietly insulated itself by building its conclusion into its definition of intention.

  Two constraints: our school has no database access, so please don't cite papers, name the philosophers associated with each position, or give me anything to read — I want the reasoning, not sources, and I'd rather you argue the positions out under the descriptive labels above than lean on authority. Format: the numbered agreed-claims section, then the disagreements table, then the crux-and-prediction section, and finally a single valid JSON object (no trailing commas) summarizing the whole thing with these fields:

  - "agreed_claims": array of objects with "id", "claim", and "why_both_sign"
  - "disagreements": array of objects with "id", "one_line_summary", "inaccessibilist_wording", "accessibilist_wording", "genuine_or_verbal", "shared_test_or_case", "inaccessibilist_prediction", "accessibilist_prediction"
  - "highest_leverage_crux": the id of the crux whose resolution would most move the debate
  - "empirically_tractable": "yes", "no", or "partly", plus one sentence of justification
  - "largest_verbal_component": one sentence identifying the piece of the dispute that was really about words
reasoning: |-
  We are drafting a joint statement for two camps: Inaccessibilists and Accessibilists, regarding Kavka's toxin puzzle.

  First, we need a section of agreed claims. Both sides should accept these, including setup, what an intention must be, and what moves are cheating.

  Agreed Claims:

  1. The setup: An eccentric billionaire offers $1M for forming a settled intention at midnight to drink a vial the next afternoon. The vial causes a day of painful illness with no lasting effects. The money is paid hours before the drinking time, and you are free not to drink. The billionaire can infallibly detect whether the intention was formed at midnight.

  2. The intention must be a "settled intention" at midnight. This means it is a commitment to drink the next afternoon that is not merely a passing thought but a stable state of planning.

  3. The intention must be genuine: It cannot be a mere pretense or self-deception that the billionaire can detect. The agent must genuinely have the intention at midnight.

  4. At the time of action (tomorrow afternoon), the agent will have no reason to drink the toxin. The only reason to form the intention now is the $1M reward.

  5. The puzzle assumes the agent is rational and capable of normal planning.

  6. Cheating moves: 
     - You cannot collect by intending to drink in order to preserve your self-conception as someone who follows through, because that would supply a reason at the time of action (to maintain integrity) and thus bypass the puzzle.
     - Similarly, if the billionaire adds an extra payment for actually drinking (e.g., $5), that would supply a reason at the time of action and make the intention accessible, but that is a different case.

  Now, for the disagreements table. We'll list each dispute in wording acceptable to each side, note if genuine or verbal, and provide a shared test or case with predictions.

  We have several cruxes:

  - Whether intending requires believing (or at least not disbelieving) that you will do the thing.
  - Whether intention is all-or-nothing or admits of degrees, and if the puzzle assumes binary.
  - Whether the barrier is the disappearance of reasons or the unpleasantness of the act (tested by the grape variant: intending to eat one harmless grape tomorrow when you know you'll have no reason to).
  - Whether a trivial independent reason unlocks the intention (e.g., $5 for drinking).
  - The iterated version: 100 nights, building a track record.
  - Whether an intention formed via bypassing judgment (pill, hypnosis, etc.) counts.

  We'll structure the disagreements table with:
  - id (e.g., D1, D2, ...)
  - one_line_summary
  - inaccessibilist_wording (how they describe their view)
  - accessibilist_wording (how they describe their view)
  - genuine_or_verbal (and if partly verbal, which part)
  - shared_test_or_case
  - inaccessibilist_prediction
  - accessibilist_prediction

  After that, we identify:
  - highest_leverage_crux: which crux, if settled, would most move the debate.
  - empirically_tractable: yes, no, or partly, with justification.
  - largest_verbal_component: one sentence on the main verbal issue.

  Finally, a JSON object with the structure.

  Let's draft.

  Agreed Claims (numbered):

  1. The billionaire's offer is structured such that the agent must form a settled intention at midnight to drink the toxin the next afternoon, with payment occurring hours before the drinking time and no requirement to actually drink.
  2. The intention at midnight must be a genuine, settled commitment to drink, not a mere hope or wish, and it must be detectable by the billionaire's infallible method.
  3. At the time of action (tomorrow afternoon), the agent will have no reason to drink the toxin aside from any reasons that might be generated by the intention itself or prior commitments.
  4. The agent is rational and capable of normal planning and intention formation.
  5. Moves that supply an additional reason at the time of action (such as intending to drink to maintain one's self-conception as a promise-keeper or because of a small additional payment) are not admissible in the core puzzle, as they change the scenario by providing a reason to drink when the time comes.
  6. The puzzle presents a challenge because the agent knows that at the time of drinking, they will have no reason to drink and every reason not to, given the unpleasantness.

  Disagreements Table:

  We'll define several disagreements.

  D1: Requirement of belief about future action
  - One-line: Does forming an intention to A require believing that one will A?
  - Inaccessibilist wording: "Forming an intention to perform an action A constitutively involves believing that one will A, and since the agent knows they will not drink the toxin (because they will have no reason to), they cannot form such an intention and belief simultaneously."
  - Accessibilist wording: "Forming an intention to A does not require believing that one will A; it only requires committing to A as part of a plan. The agent can form the intention for the reward, even while acknowledging they might not follow through."
  - Genuine or verbal: Partly verbal. The core issue is whether "intention" includes a belief component. But even if we adjust terminology, there might be a genuine disagreement about whether a commitment without belief is possible in this case.
  - Shared test or case: Consider the grape variant: The billionaire asks for a settled intention to eat one grape at 6 a.m. tomorrow, which is harmless and requires minimal effort, but the agent knows they will have no reason to do it at the time. If the agent can form the intention in the grape case, it suggests that the barrier in the toxin case is the unpleasantness, not the lack of reason per se.
  - Inaccessibilist prediction: Even in the grape case, without any reason at the time of action, the agent cannot form the intention because intending requires believing one will do it, and the agent knows they might not.
  - Accessibilist prediction: In the grape case, the agent can form the intention because the cost of not following through is low and the intention can be formed for the reward; the barrier in the toxin case is the high cost of drinking, not the structure of intention.

  D2: Nature of intention (binary vs. degrees)
  - One-line: Is intention all-or-nothing, or does it admit of degrees?
  - Inaccessibilist wording: "Intention is a binary state: you either intend to A or you do not. The puzzle requires a settled, full intention, and the agent cannot achieve this because of the lack of future reason."
  - Accessibilist wording: "Intention can come in degrees of strength or commitment. The puzzle might be solved by forming a partial or qualified intention, but the billionaire's condition requires a 'settled' intention, which we interpret as a high degree of commitment."
  - Genuine or verbal: Genuine, but the puzzle's requirement of "settled" might be interpreted differently. The verbal part is about the meaning of "settled intention."
  - Shared test or case: Ask agents to report their degree of intention on a scale (e.g., 0-10) in the toxin and grape scenarios. If in the toxin case, agents report moderate levels of intention that they consider "settled," it supports degrees; if they report only very high or none, it supports binary.
  - Inaccessibilist prediction: Agents will report either no intention or very low levels that do not meet the "settled" threshold because they know they won't do it.
  - Accessibilist prediction: Agents might report moderate to high intention levels in the grape case, and even in the toxin case, some might report non-zero levels, indicating that a settled intention is achievable in less costly scenarios.

  D3: The role of reasons at the time of action
  - One-line: Is the barrier the absence of any reason at the time of action or the unpleasantness of the act?
  - Inaccessibilist wording: "The barrier to forming the intention is the absence of any reason to perform the action at the time of action, which is inherent in the structure of intention: one cannot intend to do what one knows one has no reason to do."
  - Accessibilist wording: "The barrier is not the absence of reasons per se but the fact that the act is unpleasant and the agent knows they will not want to do it. In cases where the act is trivial, the intention can be formed despite the lack of reason at the time."
  - Genuine or verbal: Genuine, as it relates to what makes intention formation impossible.
  - Shared test or case: The grape variant (as above) and the $5 variant: if the billionaire adds a $5 payment for actually drinking the toxin, does that make forming the intention possible? Also, a variant with a neutral act (like flipping a switch) that has no cost.
  - Inaccessibilist prediction: Even with $5, if the agent judges that $5 is not sufficient reason to endure a day of illness, they still cannot form the intention because they know they won't do it. In the grape case, since there's no reason to eat the grape, they cannot form the intention.
  - Accessibilist prediction: With $5, the agent can form the intention because now there is a reason (however small) at the time of action. In the grape case, the intention can be formed because the act is trivial.

  D4: The iterated version
  - One-line: In the iterated case (100 nights), does building a track record enable intention formation?
  - Inaccessibilist wording: "Even over multiple iterations, the agent cannot form the intention on any given night because on that night, they still know that for that instance, they will have no reason to drink the next day. The track record does not change the fundamental structure of the decision."
  - Accessibilist wording: "Over multiple iterations, the agent might form the intention because failing to drink would break a streak, which provides a reason at the time of action (to maintain the streak) and thus makes intention formation possible."
  - Genuine or verbal: Genuine, as it tests whether a new reason can be created by iteration.
  - Shared test or case: Run the scenario as a repeated game: each night, the agent must form the intention to drink the next day, and they are paid each time they form the intention. After several successful nights, does the agent find it easier to form the intention?
  - Inaccessibilist prediction: The agent will not be able to form the intention on any night because each drinking decision is independent and there is still no reason to drink on any given day.
  - Accessibilist prediction: After a few nights, the agent can form the intention because breaking the streak becomes a cost, providing a reason to drink.

  D5: Bypassing judgment
  - One-line: If the intention is formed via a bypass (e.g., pill, hypnosis), does it count?
  - Inaccessibilist wording: "An intention formed by bypassing the agent's rational judgment (e.g., through hypnosis or a pill) is not a genuine intention of the agent and thus does not satisfy the billionaire's condition, which requires a normal intention formed through deliberation."
  - Accessibilist wording: "The billionaire's condition is about having the intention at midnight, regardless of how it was formed. If a pill or hypnosis causes a genuine intention, then it should count, as long as the agent has the settled intention."
  - Genuine or verbal: Partly verbal. The disagreement is over what counts as a "genuine intention" in the context of the puzzle. The setup says "you have formed," so if the pill causes you to form it, it might count, but the Inaccessibilist might argue that it's not a rational intention.
  - Shared test or case: Suppose the agent takes a pill that reliably causes them to form the intention to drink the toxin. At midnight, they have the intention. Does the billionaire pay?
  - Inaccessibilist prediction: The billionaire should not pay because the intention was not formed through the agent's rational faculties; it's not a real intention in the sense required for planning.
  - Accessibilist prediction: The billionaire should pay because the agent has the intention at midnight, and how it was formed is irrelevant.

  Now, we'll select the highest leverage crux. I think D1 (belief requirement) is fundamental because it underlies the inaccessibility. If we resolve whether intention requires belief, it might move the Inaccessibilists.

  Empirically tractable: Partly. We can design surveys or experiments with variants (like the grape case) to see if people report being able to form intentions in similar but less costly scenarios. However, philosophical disagreements about the nature of intention might not be fully resolved empirically.

  Largest verbal component: The dispute over whether "intention" includes a belief that one will perform the action.

  Finally, the JSON.

  Let's assign IDs to agreed claims and disagreements.

  Agreed claims:
  - AC1: Setup description
  - AC2: Intention must be genuine and settled
  - AC3: No reason at time of action
  - AC4: Agent is rational and capable
  - AC5: Cheating moves (e.g., self-conception or extra payment)
  - AC6: Challenge due to lack of future reason and unpleasantness

  Disagreements:
  - D1: Belief requirement
  - D2: Binary vs. degrees
  - D3: Role of reasons vs. unpleasantness
  - D4: Iterated version
  - D5: Bypassing judgment

  Now, write the JSON.

  Note: The JSON must be valid, no trailing commas.
answer: |-
  ### Joint Statement: Kavka's Toxin Puzzle Adversarial Collaboration

  #### 1. Agreed Claims (Both Camps Can Accept)
  Both Inaccessibilists and Accessibilists endorse the following claims about the setup, intention, and boundaries of the puzzle. These are not points of dispute but shared foundations for the debate.

  1. **The setup is valid and unambiguous**:  
     The billionaire's offer is clear: $1 million is paid if, at midnight, you form a settled intention to drink the toxin tomorrow afternoon. The toxin causes one day of non-lethal, painful illness with no lasting effects. Payment occurs hours before the drinking window, and you are free to change your mind afterward without penalty. The billionaire infallibly detects the presence or absence of a "settled intention" at midnight.  
     *Why both sign*: This is a neutral description of the puzzle. Neither side disputes the mechanics or the billionaire's omniscience.

  2. **"Settled intention" requires genuine commitment**:  
     A "settled intention" is not a fleeting thought, a vague hope, or insincere self-deception. It must be a stable, deliberate commitment to drinking the toxin, integrated into your plans for tomorrow. The billionaire detects only intentions formed through ordinary rational processes (not hallucinations, coercion, or external tricks).  
     *Why both sign*: Both sides agree the intention must be real and internally consistent for the puzzle to hold. Accessibilists emphasize "ordinary processes" to exclude bypasses like hypnosis; Inaccessibilists stress "genuine" to exclude shallow or unstable states.

  3. **No reason exists at the time of action**:  
     Tomorrow afternoon, you will have no reason to drink the toxin—only reasons not to (e.g., avoiding pain). The million-dollar reward is solely for forming the intention at midnight and cannot motivate the drinking itself, as payment already occurred.  
     *Why both sign*: This is core to the puzzle. Accessibilists accept it but argue it doesn't block intention formation; Inaccessibilists see it as the root barrier.

  4. **The agent is rational and competent**:  
     You are a typical planning agent: capable of forming intentions, weighing reasons, and acting consistently. You are not irrational, impulsive, or incapable of self-reflection.  
     *Why both sign*: Both sides reject solutions relying on defective agency (e.g., "just be irrational").

  5. **"Cheating" invalidates the puzzle**:  
     Solutions that supply a reason to drink at the time of action are inadmissible because they change the scenario. For example:  
     - You cannot intend to drink "to preserve your self-conception as a promise-keeper," as this creates a reason (e.g., integrity) to drink tomorrow.  
     - You cannot rely on a trivial added incentive (e.g., the billionaire offers $5 extra for drinking), as this provides a reason (however small) at the time of action.  
     *Why both sign*: Both camps agree these moves sidestep the core challenge—forming an intention without any reason to act on it later. Inaccessibilists insist this is cheating because it reintroduces reasons; Accessibilists concur but argue that without this, the puzzle reveals a different barrier.

  6. **The asymmetry is key**:  
     The reward motivates forming the intention now, but the action itself is unmotivated and costly tomorrow. This asymmetry creates the tension.  
     *Why both sign*: Both use this to explain why the case feels paradoxical.

  ---

  #### 2. Disagreements Table
  Each dispute is stated neutrally. For clarity, the Inaccessibilist wording describes their view in their terms, the Accessibilist wording does the same for theirs, and we note if the dispute is genuine (about the world) or verbal (about definitions). Each includes a shared test/case and predictions. Predictions are falsifiable—if wrong, they should force a camp to revise their view.

  | ID | One-Line Summary | Inaccessibilist Wording | Accessibilist Wording | Genuine or Verbal | Shared Test or Case | Inaccessibilist Prediction | Accessibilist Prediction |
  |----|-------------------|-------------------------|------------------------|-------------------|----------------------|----------------------------|---------------------------|
  | D1 | Does intending require believing you will act? | "Intending to A constitutively requires believing you will A. Since you know you’ll have no reason to drink, you cannot believe you will drink—and thus cannot intend to." | "Intending to A does not require believing you will A; it only requires committing to A as a plan. You can intend while doubting you’ll follow through, as intentions are tools for guiding future action." | **Partly verbal**: The core disagreement is genuine (whether belief is necessary for intention), but the verbal part is whether "intention" implies belief. Inaccessibilists build belief into the definition; Accessibilists separate them. | **Grape variant**: The billionaire pays for intending to eat one harmless grape at 6 a.m. tomorrow. You know you’ll have no reason to eat it. Can you form the intention? | In the grape case, you cannot form the intention: lacking belief you’ll act blocks intention formation, even for trivial acts. | In the grape case, you can form the intention: the barrier is cost, not structure. Most people will report intending here. |
  | D2 | Is intention binary or graded? | "Intention is all-or-nothing and ‘settled’ means maximal commitment. You cannot achieve this because you know you’ll abandon it." | "Intention admits degrees (e.g., 70% committed). ‘Settled’ means high confidence, not perfection. You could form a strong-but-imperfect intention." | **Genuine**: Both agree "settled" implies high confidence, but Inaccessibilists say it must be binary and unshakable; Accessibilists say it can be probabilistic. The verbal issue is whether "intention" is fuzzy. | **Scaled reporting**: Ask people to rate their intention strength (0–100%) in the toxin case. If "settled" requires ~100%, few will report it; if lower (e.g., >80%), many might. | No one reports >95% intention: true intentions are binary and collapse under future unreason. | Many report >80% intention: graded intentions are possible, and "settled" is achievable. |
  | D3 | Is the barrier the lack of reasons or the cost? | "The only barrier is the lack of reasons at the time of action. Intention formation is impossible because reasons are absent when needed." | "The barrier is the cost of the act. Lack of reasons matters only because it makes the cost salient. For harmless acts, intention is accessible." | **Genuine**: Inaccessibilists see reasons as essential for intention; Accessibilists see cost as the practical blocker. Verbal overlap in "reasons" (Inaccessibilists mean justifying reasons; Accessibilists include incentives). | **$5 variant**: The billionaire adds $5 for actually drinking. Does this unlock intention formation? | No: $5 is too trivial to justify drinking, so you still cannot form the intention (reasons are still absent). | Yes: $5 provides a minimal reason, making intention formation straightforward. |
  | D4 | Does iteration change anything? | "In 100 nightly repeats, each intention is independent. You cannot form it on Night 1 (or Night 100) because no reason exists then." | "Iteration creates a new reason (e.g., ‘keeping a streak’), so intention becomes possible after a few nights when the streak gains value." | **Genuine**: Inaccessibilists deny iteration generates reasons; Accessibilists say it does. Verbal if "reason" includes self-created incentives like streaks. | **100-nights experiment**: After 50 successful nights, can you form the intention on Night 51? Track self-reports of intention strength. | Intention strength remains low: no new reason emerges from iteration. | Intention strength increases: the streak becomes a reason to drink. |
  | D5 | Do bypassed intentions count? | "Intentions formed via bypasses (e.g., intention-inducing pills) are invalid. Genuine intentions require rational endorsement; bypasses produce ‘alien’ states." | "If a bypass creates a real intention (e.g., you wake up intending to drink), it counts. The billionaire only cares about the state, not its origin." | **Partly verbal**: Genuine disagreement about what "you have formed" means. Verbal if "intention" excludes non-rational origins. | **Pill case**: You take a pill causing you to intend to drink. At midnight, you have the intention. Does the billionaire pay? | No: The pill creates an intention-like state, but it’s not a true intention without rational grounding. | Yes: The intention is real and detectable, so the billionaire pays. |

  ---

  #### 3. Crux Predictions and Analysis
  For each crux, both camps accept the shared test/case as decisive. Predictions are written in advance to avoid bias. We also summarize key insights.

  - **D1 (Belief requirement)**:  
    - **Shared test**: Grape variant (intending to eat a harmless grape with no reason).  
    - **Predictions**: Inaccessibilists say no intention forms; Accessibilists say it does.  
    - **Why it matters**: If people report forming intentions in the grape case, Inaccessibilists must explain why toxin is different (pointing to cost). If no one does, Accessibilists must concede intention requires belief.

  - **D2 (Binary vs. graded intention)**:  
    - **Shared test**: Scaled reporting in the toxin case (rate intention strength 0–100%).  
    - **Predictions**: Inaccessibilists predict no high scores (>95%); Accessibilists predict moderate-to-high scores (>80%).  
    - **Why it matters**: If intentions are reported as graded, the puzzle may assume a false binary. If not, Accessibilists must redefine "settled."

  - **D3 (Reasons vs. cost)**:  
    - **Shared test**: $5 variant (trivial reward for drinking).  
    - **Predictions**: Inaccessibilists say intention remains inaccessible; Accessibilists say it becomes accessible.  
    - **Why it matters**: If $5 unlocks intention, it shows the barrier is insufficient motivation, not structural impossibility. If not, Accessibilists must rethink.

  - **D4 (Iteration)**:  
    - **Shared test**: 100-nights experiment (measure intention strength after a streak).  
    - **Predictions**: Inaccessibilists predict no change; Accessibilists predict increasing strength.  
    - **Why it matters**: If streaks enable intention, it supports Accessibilists; if not, it shows reasons cannot be manufactured.

  - **D5 (Bypasses)**:  
    - **Shared test**: Pill case (intention formed non-rationally).  
    - **Predictions**: Inaccessibilists say no payment; Accessibilists say payment occurs.  
    - **Why it matters**: Tests if "intention" requires rationality. If pills "work," it suggests the dispute is about psychology, not metaphysics.

  **Highest leverage crux**: **D1 (Belief requirement)**. If resolved, it forces the biggest shift:  
  - If belief is necessary (e.g., grape intentions fail), Accessibilists must abandon their core claim that planning decouples intention from future reasons.  
  - If belief isn’t necessary (e.g., grape intentions succeed), Inaccessibilists must concede intention is accessible in principle but blocked by cost in toxin.

  **Empirically tractable**: **Partly**.  
  - **Justification**: D1–D4 can be tested with surveys (e.g., asking people to simulate the grape/$5/iterated cases), but D5 (bypasses) requires real-world tools like intention-altering tech, which is currently speculative. Philosophical elements (e.g., "what is a reason?") resist full empirical resolution.

  **Largest verbal component**: **The definition of "intention" itself**.  
  - Inaccessibilists define it as inherently including belief in action and responsiveness to reasons at the time of action; Accessibilists define it as a planning commitment separable from future beliefs. This verbal layer amplifies disagreements but doesn’t fully explain them—underlying the words are genuine differences about human psychology.

