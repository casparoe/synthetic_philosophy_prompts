answer: |-
  ## Bureau of Common Priors
  **New Junior Analyst Onboarding Packet: Frequently Asked Questions**

  **1. What is the Bureau’s Core Function?**  
  The Bureau facilitates rational consensus in contractual, regulatory, and organizational disputes. We compel involved parties ("Agent A" and "Agent B") to engage in a supervised Posterior Announcement Protocol (PAP). Through iterative, shared declaration of their current probability estimates for a formally defined Disputed Event (DE), rational agents converge on a single, Common Knowledge Posterior Probability (CKPP). This CKPP represents the definitive, procedurally correct assessment of the DE's likelihood given all mutually recognized evidence at the time of convergence.

  **2. What does a typical PAP session look like?**  
  Parties are sequestered in linked communication booths under Analyst supervision. Rounds proceed as follows:
  1.  **Announce:** Agent A declares their current P(DE) to the Analyst and Agent B. Agent B simultaneously declares their P(DE) to the Analyst and Agent A.
  2.  **Revise:** Agents privately update their beliefs based on the *common knowledge* of both announced probabilities and the protocol itself.
  3.  **Repeat:** Steps 1 and 2 are repeated using the updated probabilities.
  The session continues until probabilities match (convergence) or the maximum round limit is reached.

  **3. What happens if the probabilities don’t match after 5 rounds?**  
  Standard PAP sessions are capped at 5 rounds to ensure operational efficiency (see **Annex 7: Computational Resource Allocation**). Non-convergence by Round 5 triggers the issuance of a **Form BCP-44: Non-Convergence Notice**. This notice details the final declared probabilities and mandates a cooling-off period before potential re-filing, often requiring pre-session mediation or refinement of the Event Space (see Question 7).

  **4. Can parties just *say* any number? What if they lie?**  
  Announced probabilities are expected to reflect an agent's true, updated credence. Deliberate misrepresentation ("low-balling" or "high-balling") to strategically withhold information or manipulate the opponent's revisions is termed **Posterior Laundering** (BCP Regulation 12.3.δ). It violates the Rational Agent Principle underpinning the Theorem. While difficult to prove *intent*, persistent, erratic revisions inconsistent with minimal Bayesian updating *or* consistent movement away from likely convergence zones are red-flagged. Analysts file **Form BCP-19: Anomalous Revision Report** for Compliance review, which can lead to sanctions including case dismissal with prejudice or fiduciary penalties.

  **5. Can you show a simple convergence example?**  
  Certainly. Consider Agents Finch (A) and Sparrow (B) assessing P(Project Veridian completes on time) = DE. Common Prior P(DE) = 0.5.
  *   **Round 1:** A announces 0.8. B announces 0.2. (They each possess unique, partition-based evidence).
  *   **Round 2:** Hearing A's high confidence, B revises *up* to 0.4. Hearing B's low confidence, A revises *down* to 0.6. Announced: A=0.6, B=0.4.
  *   **Round 3:** Mutual surprise at movement. A revises to 0.55. B revises to 0.45. Announced: A=0.55, B=0.45.
  *   **Round 4:** Recognizing proximity. A revises to 0.51. B revises to 0.49. Announced: A=0.51, B=0.49.
  *   **Round 5:** Convergence. Both announce 0.50. CKPP = 0.50 is entered into the record as the definitive P(DE).

  **6. What if a party claims they "never even considered" a crucial possibility?**  
  This is an **Unawareness Petition**. The Theorem assumes a fixed, shared space of possibilities known to both agents. If a party successfully argues *during pre-PAP mediation* that a critical state of the world was omitted from the initially filed Event Space description, the Bureau may order a **Space Refinement Hearing**. A refined Space incorporating the new possibility must be mutually agreed upon before re-filing. *Note:* This is a standard last-ditch move; frivolous petitions filed *after* unfavorable convergence are rarely granted.

  **7. Is the CKPP always *correct*?**  
  The Bureau guarantees **procedural rationality**, not **factual accuracy**. Convergence relies on the *Common Prior*. If the shared prior assigned incorrect probability to fundamental states (e.g., both agents vastly underestimated the risk of a black swan event), the CKPP will be confidently and unanimously wrong. **Form BCP-101: Final CKPP Certification** explicitly states: *"This value represents the rational consensus probability conditional on the agreed Common Prior and evidence incorporated via the Protocol. The Bureau makes no independent claim regarding the event's actual occurrence."* Groupthink, while procedurally immaculate, is an inherent, uncorrectable risk.

  **8. So we get agreement on the probability... but what about what to *do*?**  
  **Exactly.** The Bureau settles *what the probability is, rationally*. It does *not* settle *what to do about it*. A CKPP of 0.99 that the merger creates monopolistic harm doesn't mandate blocking it; a CKPP of 0.01 that the bridge will collapse doesn't mandate building it. Parties may agree on the likelihood but profoundly disagree on acceptable risk thresholds or desired outcomes. Translating the CKPP into action depends on **utility functions** (costs, benefits, risk aversion). This falls under the purview of the **Bureau of Expected Utility Reconciliation (BEUR)**, funded separately. Please direct any queries regarding action mandates to BEUR liaison channels (see **Internal Directory: Cross-Agency Coordination**). *Remember:* We produce the number. What you *do* with the number is someone else's budget line.

  **9. What about parties who use vague language or intervals?**  
  The Protocol requires **point-estimate probabilities** (Regulation 5.1.a). Statements like "likely," "unlikely," or "between 0.3 and 0.7" are non-compliant. Analysts must issue a **Verbal Warning (Code VW-2: Imprecise Declaration)** on the first instance. Continued non-compliance results in a **Form BCP-28: Protocol Violation - Non-Numeric Declaration**, pausing the session and potentially leading to forfeiture. Clear definition of the DE and insistence on numerical precision are paramount.

  **10. Is the PAP stressful for participants?**  
  Rational belief revision under scrutiny can be intellectually demanding! However, the Bureau provides certified stress-reduction pamphlets (**BCP Pamphlet #7: Calibrating Your Inner Peace**) and complimentary water. Remember, you facilitate the machinery of rational consensus. The discomfort is a feature of transparency, not a bug. Welcome aboard!
