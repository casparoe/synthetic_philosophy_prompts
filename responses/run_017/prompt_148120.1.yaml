answer: |-
  ### Q&A Prep Sheet: Evolutionary Psychology Hypothesis Constraint Seminar  
  **Core Thesis:** The "just-so story" objection is primarily about *unconstrained hypothesis space*, not unfalsifiability. Remedy: "Task specification" (ancestral task, computational problem, quantitative criterion) for reverse-engineering hypotheses.  

  #### Ordered Objections (Likelihood & Damage: ★ to ★★★)  
  **1. Philosophers of Science (Gould-Lewontin Alignment)**  
  **Objection:** "Your task-specification framework smuggles in adaptationist ideology. It demands we treat traits *as if* they’re optimised solutions, ignoring Gould’s point that constraints/chance dominate. Isn’t this just a polished version of Panglossianism?"  
  **Reply (2-min):** "Not at all. Task specification *explicitly forces adaptationists to justify their starting assumptions*. By requiring a quantified performance criterion *before* data collection, it exposes when adaptationist hypotheses fail to outperform null models (e.g., spandrels). Gould’s critique targets lax storytelling; this method forces rigour *precisely where adaptationism is weakest*. If a trait isn’t optimisable, the criterion will reveal it."  
  **Weakness:** Doesn’t address non-optimisationist explanations (e.g., developmental constraints) as competing hypotheses.  
  **Concede:** Task specification assumes optimisation *is testable*—which Gould might reject. **Hold:** This is the *only* way to rescue testable adaptationist claims.  

  **2. Social Psychologists (Political Damage)**  
  **Objection:** "Even if your method constrains hypotheses, it ignores the *naturalistic fallacy* risk. Journalists will still misuse 'evolved mechanism' claims to justify gender roles or inequality. Why endorse a framework that lends plausible deniability to harmful essentialism?"  
  **Reply (2-min):** "The fallacy lies in *inference*, not methodology. Task specification doesn’t infer 'ought' from 'is'—it tests mechanistic efficiency. We must separate scientific validity from misappropriation. Ironically, *unconstrained* ev psych invites misuse; this framework limits overreach by demanding quantifiable evidence for adaptationist claims. I’d urge *greater* emphasis on your point in science communication."  
  **Weakness:** Fails to prevent media distortion of "evolved function" language.  
  **Concede:** No methodology can prevent misuse. **Hold:** Constrained hypotheses reduce empirical licence for essentialism.  

  **3. Social Psychologists (Unfalsifiability Revisited)**  
  **Objection:** "You claim to solve unfalsifiability, but your 'criteria' are arbitrary. If a mechanism scores poorly, proponents can tweak the ancestral task or criterion. It’s still storytelling with maths!"  
  **Reply (2-min):** "Crucially, criteria must be fixed *pre-registered* and benchmarked against alternatives (e.g., random drift). If tweaking occurs post-hoc, the hypothesis is falsified. Task specification binds researchers to *a priori* predictions. Yes, bad actors might cheat—but that’s true of all science. The difference: here, cheating is detectable because the standard is explicit."  
  **Weakness:** Ancestral task reconstructions remain speculative.  
  **Concede:** Task specification relies on plausible paleo-ecological data. **Hold:** Without pre-registered criteria, ev psych *is* unfalsifiable.  

  **4. Evolutionary Psychologists (Novel Predictions Defence)**  
  **Objection:** "We *already* use task analysis to generate novel predictions (e.g., sex differences in spatial cognition). Your framework dismisses productive research as 'conjecture'. Isn’t this throwing the baby out with the bathwater?"  
  **Reply (2-min):** "Not at all—your work is the *target beneficiary*! Task analysis *is* task specification when done rigorously (e.g., specifying navigation efficiency metrics). My critique targets papers inferring functions *from* observed behaviour without pre-commitment to criteria. If your predictions include quantitative benchmarks, you’re already aligned. This formalises best practice."  
  **Weakness:** Overstates novelty of "task specification"; sounds dismissive of existing work.  
  **Concede:** Many ev psych papers *implicitly* use task analysis. **Hold:** Explicit pre-registration of criteria is non-negotiable.  

  **5. Formal Epistemologist (Probabilistic Modelling)**  
  **Objection:** "Why not formalise the hypothesis space using Bayesian models? Assign priors to adaptation/spandrel/maladaptation and update them. Your performance criteria are just loss functions in disguise."  
  **Reply (2-min):** "An excellent point—and I endorse Bayesian methods *after* task specification. But first, we need constraints to define the hypothesis space. Without specifying the task and criterion, we can’t model 'maladaptation' meaningfully (e.g., is 60% efficiency maladaptive?). Task specification provides the parameters *for* your priors. Ideally, we merge both: specify the task, then model hypotheses probabilistically."  
  **Weakness:** Avoids technical details of implementation.  
  **Concede:** Standalone task specification is incomplete. **Hold:** It is a *prerequisite* for probabilistic modelling.  

  **6. Philosophers of Science (Scope Limitation)**  
  **Objection:** "You concede your method only saves 'reverse-engineering' hypotheses. But most of ev psych addresses complex traits (e.g., religion) where task specification is impossible. Have you not admitted the field’s core is unscientific?"  
  **Reply (2-min):** "I distinguish *testable* science from valuable conjecture. For complex traits, we lack ancestral task data to define criteria—so yes, those claims remain speculative. But reverse-engineering (e.g., vision, foraging) is ev psych’s strongest strand. Better to salvage a rigorous subset than defend pseudo-science. We can expand to complex traits *if* criteria become definable."  
  **Weakness:** Implies 80% of ev psych is unsalvageable.  
  **Concede:** Most high-profile ev psych studies fall outside reverse-engineering. **Hold:** A rigorous subset justifies the field’s existence.  

  **7. Evolutionary Psychologists (Ancestral Task Uncertainty)**  
  **Objection:** "Ancestral tasks are unknowable! Your requirement privileges mechanisms with fossil/ethnographic evidence (e.g., vision) over behavioural traits (e.g., jealousy). Isn’t this a historicist straitjacket?"  
  **Reply (2-min):** "It privileges *testability*. When direct evidence is scant, we use consilience (e.g., paleoecology, hunter-gatherer studies) to bound plausible tasks. If no plausible task can be specified, the hypothesis *shouldn’t be tested as adaptationist*. Jealousy research might focus on proximate mechanisms instead. Not all questions are evolutionary questions."  
  **Weakness:** Risks making ev psych a historical science.  
  **Concede:** Task specification limits ev psych’s scope. **Hold:** Without it, claims are post-hoc.  

  **8. The Question You Hope Nobody Asks**  
  **Objection:** "If only a fraction of ev psych meets your criteria, and the rest is conjecture, why not scrap the field entirely? Psychology already has robust paradigms (e.g., social cognition). Isn’t ev psych’s primary value ideological—lending 'naturalness' to conservative narratives?"  
  **Reply (2-min):** "Because reverse-engineering *works*. It has generated novel, quantifiable predictions (e.g., cheater-detection algorithms). Scrapping it would lose genuine insight. Yes, the non-testable majority is problematic—but that’s an argument for reform, not abolition. Ideological abuse stems from *poor* ev psych; rigorous work pre-empts it by replacing stories with benchmarks."  
  **Weakness:** Concedes the field’s failures; defence rests on a minority.  
  **Concede:** Non-reverse-engineering ev psych lacks scientific credibility. **Hold:** The reverse-engineering core is indispensable science.  

  ---  
  **Key Strategy:**  
  - **Concede early** where criticism is valid (e.g., scope limits, ideological risks).  
  - **Hold firm** on task specification as the *minimal* standard for testability.  
  - **Redirect** to allies: Emphasise to ev psych colleagues this *formalises their best work*.  
  - **Neutralise conflict:** For critics, stress this *restricts* ev psych’s licence.  
  **Language:** British English maintained (e.g., "plausible", "whilst", "amongst", "rigour").
