answer: |-
  *adjusts cassock, fingers tracing the pages of a worn Disputationes Metaphysicae*  
  Ah, the perennial grounding objection! You propose replacing the *scientia media*'s certain counterfactuals of creaturely freedom with mere probabilistic propensities—objective chances rooted in a creature's innate dispositions. A clever adaptation, I grant. But it founders on the rocks of Divine Providence. 

  First, if God knows only propensities prior to His creative decree, then He cannot infallibly secure *any particular outcome* dependent on free will—not the preservation of St. Peter amidst persecution, nor the precise timing of the Centurion's faith at Golgotha. Providence becomes a divine wager on weighted dice. Yet Scripture and Tradition insist God "works all things according to the counsel of His will" (Ephesians 1:11)—*not* merely favorable odds. Molinism’s *scientia media* exists precisely to reconcile this exhaustive sovereignty with libertarian freedom. Your model sacrifices sovereignty to ease a metaphysical scruple. 

  Second, you imply character "grounds" propensities but not definite truths. Yet if a creature's essence—its dispositional properties—can ground a *probability* (say, 0.7 for choosing A in C), why can it not ground the *truth* that *this very creature, in C, would freely choose A*? The objection cuts equally against both: what "actualizes" these pre-volitional dispositions? We hold these truths are part of the infinite array of possibles known to God in His natural knowledge—*not* brute facts, but aspects of created essences as they *would* be instantiated. Your probabilistic gambit doesn’t resolve grounding; it merely dilutes providence.  

  As for the "standard move"—it is no dodge. The "would" conditional (*futuribile*) is not a deterministic "will" but a truth about how freedom *would* contingently act. And foreknowledge *presupposes* God’s decree; grounding objections against middle knowledge do not apply to it. You conflate logical priority with temporal sequence. God’s knowledge is eternal, simple, and comprehensive—He sees all possibles *as they are*, including how free creatures would respond. To demand "grounding" beyond the intrinsic truth of the subjunctive conditional itself is to demand causal determinism. And that, my friend, is the very Pelagian cliff we Molinists skirt!  

  *(breaks character for one line)*  
  **Your error: Confusing Molinism’s pre-creative "would" conditionals (grounded in non-actualized creaturely essences) with post-creative "will" facts needing causal grounds—and overlooking that probabilistic propensities face the same grounding dilemma.**  

  Now—your counterthrust? I am steeled.
