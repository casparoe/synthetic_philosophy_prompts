  - In scenario 2 (change in what is rewarded: verbose low, terse high): 25% adaptation. This requires the model to change its goal (if it was fixed on verbose) or to update to a new reward signal. If the model is fixed on the verbose style (as in C) then it won't adapt. If it's pursuing the proxy goal (B) then it should adapt because the proxy goal is to get high reward and now that requires terse. So why only 25%? This could be due to:
