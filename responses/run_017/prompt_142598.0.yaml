answer: |-
  ### Joint Statement of Adversarial Collaboration: Coherence vs. Accuracy Camps  
  **Signed by Representatives of Both Camps**  

  #### (1) Jointly Endorsed Claims (12 Claims)  
  Both camps agree on the following:  
  1. The auditor constructs a portfolio of bets guaranteeing a loss *in the auditor's currency* when probabilities are incoherent.  
  2. This guaranteed loss is **bounded** (fixed at a small, predetermined stake per bet) and does not scale arbitrarily.  
  3. The auditor operates solely on **numerical inputs**, not the forecaster's true beliefs, betting dispositions, or team disagreements.  
  4. Forecasters are compensated via **non-linear utility** (tournament standing, not cash), so the auditor's currency differs from their incentive structure.  
  5. The audit currently **ignores interval reports and "no-opinion" filings**, creating a coverage gap.  
  6. **Auto-rescaling** replaces incoherent vectors with the nearest coherent vector (by Euclidean distance).  
  7. **Brier score** (used for the leaderboard) is strictly proper: coherent true beliefs maximize expected accuracy.  
  8. Incoherent vectors may be rescaled to ones that **underperform** the original on realized outcomes, frustrating forecasters.  
  9. The auditor's **bounded-stake loss** is trivial in monetary terms (e.g., cents per filing).  
  10. Deliberate incoherence or uniform 0.5 filings are **gaming responses** to incentives, not evidence against coherence/accuracy.  
  11. **Two-person teams** may file incoherent vectors due to intra-team disagreement, unrelated to individual irrationality.  
  12. The audit **does not measure** whether a filing was "accurate" ex post; it only checks internal consistency.  

  ---

  #### (2) Table of Remaining Disagreements  
  | Coherence Camp Proposition (Own Wording) | Accuracy Camp Proposition (Own Wording) | Genuine or Verbal? | If Verbal, Resolution |  
  |------------------------------------------|-----------------------------------------|-------------------|------------------------|  
  | "Vulnerability to a sure-loss book reveals a *logical defect* in the credences themselves, independent of stakes or scoring rules." | "Vulnerability to a bounded-loss book is *pragmatically irrelevant* when stakes are trivial and utility is non-linear in the audit currency." | **Genuine** | — |  
  | "Diachronic Dutch books justify conditionalization; thus, static coherence is foundational for rational updating." | "Accuracy arguments (via proper scoring rules) justify updating; Dutch books are derivative and break under non-linear utility." | **Genuine** | — |  
  | "The auditor exposes *actual inconsistency* in the reported probabilities, which is defective even if no loss occurs." | "The auditor tests *numerical inputs*, not beliefs; inconsistency in a form entry is irrelevant to epistemic quality." | **Verbal** | "Defect" conflates logical error (coherence) with predictive performance (accuracy). Fact: 33% of filings are team submissions where no single "belief" exists. |  
  | "Auto-rescaling *corrects* irrationality; the nearest coherent vector is objectively superior." | "Auto-rescaling *gambles* with accuracy; the nearest coherent vector may be farther from the truth than the original." | **Genuine** | — |  

  ---

  #### (3) Table of Cruxes  
  **Crux 1: Does Brier Score Accuracy-Dominate Incoherent Vectors?**  
  - **Test**: For all archived incoherent vectors (binary/3-/5-way, 2-decimal), compute if a coherent vector exists with Brier score ≤ original for *all* outcomes and < for at least one. Use 2-decimal rounding.  
    - *Example*: Partition = {A,B,C}; Filing = (0.50, 0.50, 0.10) (sum=1.10). Coherent candidate = (0.45, 0.45, 0.10).  
      - Brier if A: Original = (1-0.5)² + (0-0.5)² + (0-0.1)² = 0.51; Coherent = (1-0.45)² + (0-0.45)² + (0-0.1)² = 0.505 → Dominates.  
      - But if true outcome = C: Original = (0-0.5)² + (0-0.5)² + (1-0.1)² = 1.31; Coherent = (0-0.45)² + (0-0.45)² + (1-0.1)² = 1.305 → *Still dominates*.  
  - **Coherence Prediction**: All incoherent vectors are dominated (per Schervish 1989).  
  - **Accuracy Prediction**: 2-decimal rounding creates non-dominated cases (e.g., (0.99, 0.02, 0.00) → rescales to (0.99, 0.01, 0.00); if B occurs, Brier worsens from 1.9604 to 1.9606).  
  - **Action**: If ≥1 non-dominated vector exists, abandon auto-rescaling (coherence camp concedes). Else, keep it (accuracy camp concedes).  

  **Crux 2: Does Auto-Rescaling Improve Realized Brier Score?**  
  - **Test**: On archived data, compare Brier scores of original incoherent vectors vs. rescaled versions *using actual outcomes*. Use a stake of 1 unit.  
    - *Example*: Filing = (0.70, 0.60) for binary {A,¬A} (sum=1.30). Rescaled = (0.54, 0.46). Outcome = ¬A.  
      - Original Brier = (0-0.7)² + (1-0.6)² = 0.49 + 0.16 = 0.65.  
      - Rescaled Brier = (0-0.54)² + (1-0.46)² = 0.2916 + 0.2916 = 0.5832 → Better.  
      - But if outcome = A: Original = (1-0.7)² + (0-0.6)² = 0.09 + 0.36 = 0.45; Rescaled = (1-0.54)² + (0-0.46)² = 0.2116 + 0.2116 = 0.4232 → Worse.  
  - **Coherence Prediction**: Rescaling improves mean Brier score across outcomes.  
  - **Accuracy Prediction**: Rescaling harms Brier in >40% of cases when originals were "lucky" (e.g., high true probability on extreme values).  
  - **Action**: If rescaling harms Brier in >30% of cases, switch to flagging/docking without rescaling. Else, status quo.  

  **Crux 3: Terms for Vulnerability Defects**  
  | Book Type                  | Coherence Term       | Accuracy Term         | Defect? (Coherence) | Defect? (Accuracy) |  
  |----------------------------|----------------------|-----------------------|---------------------|---------------------|  
  | Sure-loss (scalable loss)  | Dutch Book          | Arbitrage Loop       | Yes (fatal)        | Yes (if unbounded) |  
  | Stake-bounded loss         | Bounded Dutch Book  | Penalty Bet          | Yes (logical flaw) | No (trivial cost)  |  
  | One-sided (no gain, loss risked) | Subfair Bet      | Dominated Bet        | Yes (irrational)   | No (may reflect risk aversion) |  
  - **Agreement**: Vulnerability to a sure-loss book is defective.  
  - **Disagreement**: Stake-bounded/one-sided books are defects only if utility is linear (coherence) vs. irrelevant under non-linear incentives (accuracy).  

  ---

  ### Commitment and Recommendation  
  **Where Camps Must Concede**:  
  - The **accuracy camp** must concede that if *all* incoherent vectors are Brier-dominated (Crux 1), coherence is necessary for accuracy.  
  - The **coherence camp** must concede that if rescaling *harms* scores frequently (Crux 2), auto-rescaling is counterproductive.  

  **Verbal Disagreements**: "Attitudes vs. reports" is dissolved by recognizing that 33% of filings are team aggregates with no single attitude.  

  **Genuine Cruxes**:  
  - Crux 1: I expect it to resolve for accuracy—2-decimal rounding will yield non-dominated vectors (e.g., (0.99, 0.01, 0.01)).  
  - Crux 2: I expect rescaling to harm Brier in >35% of cases, as forecasters often skew probabilities toward their true beliefs.  

  **Recommendation**: **Scrap auto-rescaling**; replace with flagging + points dock proportional to incoherence magnitude.  
  - **Finding That Would Change My Mind**: If Crux 1 shows 0 non-dominated vectors in archived data, keep auto-rescaling.  

  **Closing Note**: Residual uncertainty lies in modeling tournament utility—non-linear incentives may make even bounded losses irrelevant.
