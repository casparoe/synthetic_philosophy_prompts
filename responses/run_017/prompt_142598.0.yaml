  ### Terms for the Books

  **Coherence Camp Terms**:
  - A **sure-loss book** (or **Dutch book**): A set of bets that guarantees a loss, and the loss can be made arbitrarily large by scaling the stakes.
  - A **stake-bounded book**: A set of bets that guarantees a loss but the loss is bounded (because stakes are fixed and not scalable).
  - A **one-sided book**: A set of bets that has no possible gain and some possible loss (but not necessarily a sure loss in every state).

  **Accuracy Camp Terms**: They might not have specific terms, but they would accept the above definitions.

