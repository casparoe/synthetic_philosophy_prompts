y an actual computation over our archived filings and outcomes, or a small hypothetical filing worked arithmetically at stakes of one unit on a three-cell partition — the prediction each camp should record in advance, and what we should do to the audit if the crux resolves one way rather than the other. Two cruxes I especially want treated: the accuracy camp's claim that any incoherent vector is accuracy-dominated by some coherent one (check whether that holds for the Brier score specifically, and whether it survives two-decimal rounding and mixed binary/three-way questions, since our rescale policy hangs on it), and the gap between expected accuracy at the time of filing and realized score on the leaderboard, which is what makes forecasters angry when we overwrite numbers that would in fact have scored well. Please also give the camps' own terms for three distinctions I have had to improvise: a sure-loss book (guaranteed loss, scalable without limit), a stake-bounded book (guaranteed loss whose size is capped), and a one-sided book (no possible gain, some possible loss) — and say whether vulnerability to each is a defect, and of the same kind.

  Please be committed rather than balanced: where you think one camp has to give ground, say which and why; where you think a crux is verbal, say so flatly instead of hedging; and where a crux is genuine, say which way you expect it to resolve and what would move you. End with your own one-sentence recommendation on whether we keep the audit, together with the single finding that would most change your mind, and flag any residual uncertainty in a short closing note. Do not cite anything or point me to a reading list — I have access to the literature and I need the argument; where arithmetic helps, show it.
