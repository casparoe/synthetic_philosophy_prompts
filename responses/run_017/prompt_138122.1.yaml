  Breaking this down: The room has three main groups - transitional justice experts, government lawyers/archivists, and descendant representatives. Each will have distinct concerns. The transitional justice group might challenge the apology's narrow function, while government officials will worry about legal precision. Descendant representatives seem skeptical about the apology's very purpose.

