prompt: |-
  i sit on our city's franchise commission — we decide who counts as a voter for municipal elections, and the charter lets us write our own rules, which already feels circular. Our track record:

  - green card holders, 10+ years here, pay city taxes: yes
  - commuters who work here and pay the city earnings tax but sleep in the suburbs: no
  - absentee owners of apartment buildings here, living abroad: no
  - people with no fixed address who sleep in city shelters: yes
  - out-of-state students in dorms here nine months a year: yes, if they register here
  - people held in the city jail, pre-trial or serving under a year: yes; a year or more: no
  - farmworkers on five-month visas in employer housing: no
  - 16 year olds: no

  New case, hearing is next week: Riverside, an unincorporated pocket of about 1100 people that the city completely surrounds. The county sheriff polices them, but they buy city water, their kids attend city schools under a contract, and roughly 300 of them work here and pay the earnings tax. The november ballot has both an annexation measure that would make them part of the city and the mayoral race. They've petitioned to vote.

  What should we do if we want to be consistent with ourselves — full ballot, annexation measure only, or nothing? Which of our precedents is actually the closest analog, and which rule are we implicitly running that fits all eight old verdicts: something like all-affected-interests, or being subject to the city's coercion, or being a stakeholder whose life is mainly lived here? Are there two rules that fit the old verdicts equally well but come apart on Riverside? Note that the "they pay the earnings tax" argument seems to be closed off by how we treated the commuters, unless there's a real difference there I'm missing. If we let them vote only on the annexation, are we committed to the demos being different for every single decision, and is that ad hoc or a defensible position? And what case should we put on the docket next to tell the surviving rules apart?
reasoning: |-
  Okay, let me start by unpacking the user's query. They're part of a city franchise commission that decides voter eligibility for municipal elections. They've listed eight precedents and now face a new case involving Riverside, an unincorporated area surrounded by the city. The key question is whether Riverside residents should vote on nothing, the annexation measure only, or the full ballot, while staying consistent with past decisions.

  First, I need to analyze the existing precedents to find the underlying principles. The user mentions cases like green card holders allowed to vote, commuters denied despite paying taxes, absentee owners excluded, shelter residents included, etc. I should look for common threads. 

  Looking at the "yes" cases: green card holders (long-term residents, taxpayers), shelter residents (physically present even without fixed address), students (temporary but substantial presence), short-term inmates (city jurisdiction). The "no" cases: commuters (work but don't live), absentee owners (no physical presence), long-term inmates (state jurisdiction), farmworkers (temporary), 16-year-olds (age). 

  A pattern emerges around physical presence and integration into the city's daily life. The commuters are denied despite paying taxes, which suggests that tax payment alone isn't sufficient. The user notes that Riverside residents paying taxes might be similar, but there's a difference: commuters sleep elsewhere, while Riverside is physically surrounded and uses city services like water and schools. That could be a key distinction.

  The annexation measure is directly about Riverside's relationship with the city. Letting them vote only on annexation might align with the "all-affected interests" principle. But the user worries if this leads to different demos for every issue. I need to address whether that's ad hoc or defensible. Precedents like annexation votes often allow affected non-residents to participate, so it might be justifiable.

  Next, identifying the implicit rule. The patterns suggest "physical presence and integration into city life" as one rule. Alternatively, "subject to city coercion" might fit, but shelter residents aren't coerced, so that might not hold. The strongest fit seems to be "daily life centered in the city." For Riverside, they're not currently residents but are deeply affected by annexation. Letting them vote only on annexation fits "all-affected" without extending to other elections.

  The user also asks for a future case to test the rules. A scenario where physical presence and affected interests diverge would be useful. For example, a neighborhood being rezoned but physically outside the city, or remote workers who pay taxes but live elsewhere. Those cases could help distinguish between the two principles.

  I should also consider the legal aspect. The commission has the charter's authority to set rules, so flexibility exists. But consistency is crucial for legitimacy. The annexation measure directly impacts Riverside, so including them there makes sense. However, for the mayoral race, without annexation, they aren't part of the city, so exclusion aligns with past decisions like commuters.

  In conclusion, Riverside should vote only on annexation. The closest precedent is the commuters, but the key difference is Riverside's geographic and service integration. The implicit rule is "daily life centered in the city," and for future tests, a rezoning case could clarify the principles.
answer: |-
  Based on your precedents and principles, here's a consistent approach to Riverside and the underlying logic:

  **Recommendation for Riverside: Vote on Annexation Measure ONLY**
  *   **Reasoning:** They are not *current* residents subject to daily city governance/coercion or centered in city life (like your "no" votes), but the annexation measure *directly and uniquely affects their fundamental status and relationship with the city* (like no other ballot item).

  **Closest Analog: Commuters (but with a crucial distinction)**
  *   **Similarity:** Like commuters, Riverside residents work in the city and pay the earnings tax – factors you explicitly rejected as *sufficient* for full voting rights.
  *   **Distinction (The Missing Factor):** Unlike commuters who *choose* to live outside the city, Riverside is a geographically trapped enclave *surrounded* by the city, *dependent* on core city services (water, schools via contract) despite lacking formal incorporation. This creates a unique, involuntary interdependence distinct from a commuter's voluntary employment choice. Their situation is imposed by geography and municipal boundaries, not personal choice. This distinction justifies allowing a vote *only* on the measure directly altering their relationship (annexation).

  **The Implicit Rule: "Subject to the City's Coercive Authority and Daily Life Integration"**
  This rule best explains *all eight* precedents:
  1.  **Yes - Green Card Holders:** Subject to city laws, taxes, services daily. Life centered here.
  2.  **No - Commuters:** Work/pay tax here, but not subject to *residential* city laws (zoning, noise, local policing where they sleep), services (trash, local roads), or daily life integration. Coercion/work focused.
  3.  **No - Absentee Owners:** Financially invested but not physically present or subject to daily coercion/integration.
  4.  **Yes - Shelter Residents:** Physically present daily, subject to city laws/coercion (including shelter rules under city contract/jurisdiction), reliant on city services. Life centered here.
  5.  **Yes - Students:** Physically present for the majority of the year (9 months), subject to city laws, using city services/infrastructure daily. Life centered here *during residency*.
  6.  **Yes (<1 yr) / No (1+ yr) Inmates:** Short-term inmates are physically held *within* city jurisdiction/custody, subject to its coercive power daily. Long-term inmates are transferred to state/federal systems, removing them from daily city coercion/integration.
  7.  **No - Farmworkers:** Temporary presence (<5 months), limited integration, residing in employer housing (not fully part of city community life), here for a specific seasonal purpose.
  8.  **No - 16 Year Olds:** Excluded by near-universal minimum age standard, regardless of other factors. (This is a distinct, overriding rule).

  **Why "All-Affected-Interests" or "Stakeholder" Doesn't Fully Fit:**
  *   **All-Affected-Interests:** This would likely include commuters (affected by city policies impacting their workplace), absentee owners (affected by property taxes/regulations), and possibly long-term inmates (affected by city decisions made before/during incarceration). You excluded these groups.
  *   **Stakeholder Whose Life is Mainly Lived Here:** This fits *most* "Yes" votes, but arguably *excludes* shelter residents (whose life may be transient and minimally integrated) and *includes* commuters whose *working* life is lived in the city. Your "no" for commuters shows "life mainly lived here" requires *residency*, not just significant time spent working.

  **Addressing the "Different Demos" Question:**
  *   **It's Defensible (and Not Radically Ad Hoc):** Allowing a specially affected non-resident group to vote *only* on the measure directly determining their future relationship with the city is a recognized exception in democratic theory (like "all-subjected" principles applied to specific enfranchising acts). It doesn't commit you to different demos for *every* decision.
  *   **Limiting Principle:** This exception applies only to *constitutional* or *fundamental status* questions directly altering the voter's own relationship with the governing body (like annexation, incorporation, or potentially de-annexation). Routine policy decisions (mayor, council, bonds, ordinances) remain restricted to those fully integrated and subject to daily city governance.
  *   **Precedent Alignment:** Your inmate rule implicitly acknowledges different statuses affecting rights. Annexation is a unique, foundational act.

  **Case to Docket Next: Test "Coercion/Daily Integration" vs. "Affected Interest"**
  Propose a case involving **a Neighborhood Under City Jurisdiction but Physically Severed:**
  *   **Scenario:** Imagine "Hilltop," a small neighborhood geographically separated from the main city by a sliver of county land. They are officially city residents (pay full city taxes, subject to all city laws, use city services, vote in all elections). The city proposes building a major waste transfer station *only* in Hilltop, significantly impacting their environment and property values. Hilltop residents argue neighboring unincorporated county residents (who live closer to the proposed site than many Hilltop residents and would be equally impacted by traffic/odor) should be allowed to vote *against* the station in a city referendum.
  *   **Why it Tests the Rules:**
      *   **Your Implicit Rule (Coercion/Daily Integration):** Says only Hilltop residents vote. They are fully subject to city authority and integrated. County neighbors are not city residents.
      *   **All-Affected-Interests Rule:** Suggests impacted county neighbors should potentially vote on this *specific* issue affecting them directly.
      *   **Outcome:** If you deny county neighbors the vote (consistent with your commuter and absentee owner precedents), it reinforces "Coercion/Daily Integration" as your core rule and rejects "All-Affected-Interests." If you grant them a vote *only* on the station measure, it signals a move towards "All-Affected-Interests" for major localized impacts and contradicts your commuter precedent (who are affected by many city policies).

  **Summary for Riverside:**
  *   **Vote:** Annexation Measure ONLY.
  *   **Justification:** Consistency with the implicit rule of **"Subject to the City's Coercive Authority and Daily Life Integration"** requires excluding them from the full ballot (like commuters). However, their unique geographic entrapment and service dependence, coupled with the *annexation measure uniquely determining their future subjection*, justifies a limited exception for that specific vote.
  *   **Rule Confirmation:** The Riverside decision reinforces "Coercion/Daily Integration" as your core principle, while demonstrating a narrow, defensible exception for foundational status-change votes affecting non-residents.
  *   **Next Test:** Docket the "Hilltop Waste Station vs. County Neighbors" case to clearly distinguish your principle from "All-Affected-Interests." Your likely rejection of county neighbor voting would solidify "Coercion/Daily Integration" as the governing rule.
