  Based on your friend's 10 verdicts and her stated "case-by-case" approach, here's my best analysis of her likely ruling on the dementia case, the underlying rules that fit her judgments, how those rules might diverge on this new case, and a suggested test case:

  **Prediction for the Dementia Case:**
  Your friend will likely say **lying is FINE ("kinder") in this specific situation.** Her reasoning will probably emphasize:
  1.  **Consequences:** The immense, repeated daily suffering caused by telling the truth vs. the comfort and lack of measurable harm from the lie ("she grieves the whole thing again... every day").
  2.  **Lack of Current Capacity:** Your mother *cannot* meaningfully understand or process the truth anymore, making consent impossible and shifting the focus to well-being. (Similar to the doctor case #5 where the patient delegated consent).
  3.  **Beneficence & Kindness:** The primary motivation is clearly care and preventing suffering, not malice, manipulation, or self-interest.
  4.  **The Futility of Truth:** The truth provides no lasting benefit or autonomy in this context; it only causes cyclical trauma.
  5.  **Relational Duty (Shifted):** While the patient's prior wishes matter, her *current* state as a vulnerable person incapable of processing information creates a stronger duty to protect her well-being, overriding a hypothetical past refusal she cannot now recall or reaffirm.

  **Candidate Rules Fitting All 10 Verdicts (And How They Split on the Dementia Case):**

  1.  **Contextual Harm-Benefit Analysis with Consent Weighting:**
      *   **Rule:** Evaluate the *net consequences* (harm prevented vs. harm caused, including relational/autonomy harms) heavily weighted by the presence or absence of *informed consent* regarding the information/deception. Consent can be explicit, implied, delegated, or contextually inferred (e.g., social norms). Malicious intent or significant power imbalance amplifies harm.
      *   **Fits 10 Cases:** #1 (Minimal harm, implied consent to surprise), #2 (Severe harm, no consent), #3 (Prevent torture, consent irrelevant/implied), #4 (Harm by denying autonomy/consent explicitly given), #5 (Consent explicitly delegated, prevents harm), #6 (Harm via deception for profit, undermines trust system), #7 (Minimal harm, cultural norm/implied parental license), #8 (Minimal harm, implied consent to privacy in relationships), #9 (Significant relational harm/deception, implied consent to know about ongoing contact), #10 (Prevents harm/exploitation, lack of consent justified by target's wrongdoing).
      *   **Dementia Case Prediction (Fine):** Overwhelming net benefit (prevent daily trauma) vs. minimal harm (no autonomy to violate *currently*). Lack of current capacity negates the weight of past non-consent in this specific context. Intent is benevolent.

  2.  **Hierarchy of Duties:**
      *   **Rule:** Moral permissibility depends on balancing conflicting duties (e.g., Honesty, Beneficence, Non-Maleficence, Fidelity, Justice). Prioritize:
          1.  Prevent severe physical/psychological harm (Non-Maleficence).
          2.  Uphold explicit prior consent/autonomy (Fidelity/Autonomy).
          3.  Promote well-being (Beneficence).
          4.  Be honest (Honesty).
          5.  Correct injustice (Justice).
      *   **Fits 10 Cases:** #3 (1 trumps 4&5), #4 (2 trumps 3&4), #5 (2 trumps 4), #6 (5 trumps 4), #7 (3 trumps 4), #8 (3/relationship harmony trumps minor 4), #9 (2/relationship fidelity trumps 4), #10 (5 trumps 4).
      *   **Dementia Case Prediction (Fine):** Duty 1 (Prevent severe daily psychological harm) trumps Duty 2 (Uphold prior autonomy - impossible *and* causing harm) and Duty 4 (Honesty). Duty 3 (Well-being) strongly supports the lie.

  3.  **Relational Contract Theory:**
      *   **Rule:** Permissibility depends on the *specific relationship* and the implicit/explicit "contract" within it. Deception is wrong when it violates the core expectations and vulnerabilities inherent in that relationship type (Doctor-Patient, Friend-Friend, Parent-Child, Partner-Partner, Consumer-Business, Citizen-State).
      *   **Fits 10 Cases:** #1 (Friend contract allows surprise), #2 (Violates friend contract re: protection), #3 (Citizen contract vs. unjust state), #4 (Violates core doctor-patient contract), #5 (Upholds patient-modified contract), #6 (Violates business-consumer contract of truth), #7 (Upholds parent-child contract/nurturing), #8 (Fits partner contract/not oversharing), #9 (Violates partner contract re: secrecy), #10 (Upholds citizen/neighbor contract to protect vulnerable).
      *   **Dementia Case Prediction (Fine):** The relationship shifts from competent adult-child to caregiver-vulnerable dependent. The core duty in *this* relationship context is compassionate care and preventing suffering, not respecting prior autonomy directives the person can no longer comprehend or utilize. The "contract" is now custodial care.

  4.  **Intent & Exploitation Avoidance:**
      *   **Rule:** Lying/deception is wrong primarily when used to *exploit, manipulate, or harm* another for personal gain or malice, or when it significantly undermines trust necessary for a functional relationship/system. It's permissible when motivated by clear benevolence, preventing greater harm, or upholding a greater duty, especially where consent is absent *due to* the situation.
      *   **Fits 10 Cases:** #2 (Exploit/manipulate/harm), #4 (Undermines core trust/autonomy), #6 (Exploit for profit, undermines market trust), #9 (Manipulate/undermine relationship trust) vs. #1 (Benevolent, no exploitation), #3 (Prevent harm/exploitation), #5 (Uphold duty/benevolent), #7 (Benevolent), #8 (No malice/manipulation), #10 (Prevent exploitation).
      *   **Dementia Case Prediction (Fine):** Clear benevolent intent (prevent suffering), no exploitation, no harm to functional trust (as the patient lacks the capacity to engage in that trust dynamically).

  **The Perfect Test Case: Your Advance Directive Scenario**

  Your proposed test case is **EXCELLENT** and likely *the* cleanest way to force a distinction:

  *   **The Case:** The same woman, two years before dementia, while perfectly competent, told her daughter/friend/caregiver: **"If I ever get dementia and start forgetting things, *never* lie to me, even if it's upsetting. I want to know the truth, no matter how painful it is each time."** The situation unfolds exactly as before.

  *   **Why it's Perfect:**
      *   It directly pits **Explicit Prior Consent/Autonomy** (Rule 1's weighting, Rule 2's Duty 2, Rule 3's original "contract") against **Present Consequences/Beneficence** (Rule 1's consequence calc, Rule 2's Duty 1 & 3, Rule 3's shifted "contract", Rule 4's benevolent intent).
      *   It isolates this conflict within an otherwise identical scenario.
      *   All candidate rules *agreed* the lie was fine *without* this directive. Now, the prior directive introduces a powerful counterweight.
      *   It tests how absolute or defeasible your friend considers explicit prior instructions regarding future incapacity.

  *   **How the Rules Likely Split:**
      1.  **Harm-Benefit + Consent Weighting:** This becomes agonizing. The explicit prior consent is extremely heavy, but the *current* harm is immense and the patient *cannot* now reaffirm or retract her wish. Leans slightly towards **NOT FINE** (Respect the directive) due to the explicit weight of prior consent, but it's a very close call.
      2.  **Hierarchy of Duties:** **NOT FINE**. Duty 2 (Uphold explicit prior consent/autonomy) is very strong. Duty 1 (Prevent harm) is severe, but Duty 2 was explicitly chosen *by the patient* to apply *even in this harmful scenario*. The directive demonstrates she prioritized autonomy over avoidance of this specific suffering.
      3.  **Relational Contract:** **NOT FINE**. The explicit prior statement defines the core expectation for the relationship *if* dementia occurs. Violating this explicit term breaches the understood "contract," even if well-intentioned now.
      4.  **Intent & Exploitation Avoidance:** **FINE (or possibly NOT FINE)**. The intent is still benevolent. However, the lie *could* now be seen as a form of paternalistic manipulation, overriding the patient's clearly expressed will for how she wanted to be treated when vulnerable. This rule might struggle most here. Leaning towards **NOT FINE** due to the violation of explicit trust.

  **Is "It Depends on the Details" a Real Position or a Dodge?**

  *   **It's a Genuine Position (Pluralism):** Based on her 10 verdicts and her own statements, your friend is almost certainly a **moral particularist** or **pluralist**. She likely believes:
      *   Multiple moral factors matter (harm, consent, relationships, intent, duties).
      *   These factors have no fixed hierarchy; their weight depends entirely on the unique context.
      *   The *same* feature (like lying) can be right or wrong based on how other features interact.
      *   No single rule ("Always tell the truth," "Maximize happiness") captures the complexity.
      *   Judgment requires perceiving the salient features of *this specific situation*.
  *   **Why it's Not (Necessarily) a Dodge:** Her 10 verdicts demonstrate consistent *pattern recognition* based on context, even without a single rule. She identifies relevant features (consent, harm, relationship, intent) and weighs them situationally. Saying "it depends" acknowledges that new cases might introduce novel combinations or weightings of these features that weren't present in the previous 10. Her ability to give reasoned verdicts on those 10 shows it's not arbitrary.
  *   **The Challenge:** For someone seeking a single rule (like you), this *feels* like evasion. The pluralist argues that demanding a single rule oversimplifies reality and leads to worse judgments. The test case above forces her to articulate *which* features matter *more* in that *specific* clash, revealing her *prioritization* in that context, even if it's not a universal rule.

  **Conclusion:**

  Your friend will likely approve the nursing home lie based on preventing immense, daily suffering for someone incapable of processing the truth. The underlying rules fitting her 10 verdicts all converge here *without* a prior directive. **Your advance directive test case is the crucial one.** It will force divergence:

  *   **Hierarchy of Duties** and **Relational Contract** rules will likely demand honoring the directive (**Not Fine**).
  *   **Harm-Benefit + Consent Weighting** will be torn but might lean towards the directive.
  *   **Intent & Exploitation Avoidance** might lean towards lying for benevolence, but the directive complicates it significantly.

  Presenting this case will reveal whether your friend prioritizes the sanctity of an explicit prior autonomous choice (even if it causes suffering) or believes the duty to prevent suffering in the *present* reality of incapacity overrides that past directive. This is the core of your decade-long debate made manifest. Good luck!
