  Okay, let me try to unpack this user's problem. They've been arguing with their friend about moral judgments for ten years and finally compiled a list of her verdicts on various lying scenarios. Now they want to predict how she'd rule on a dementia case and identify the hidden principles behind her decisions. 

  First, I need to analyze the ten verdicts to spot patterns. The friend claims there's no single rule, but the user suspects there are multiple consistent frameworks at play. Looking at the list, I notice some themes: consequences matter (like preventing torture), consent matters (the doctor cases), and relationships create different obligations (the ex-texting vs casual run-in). 

  The dementia case is tricky because it pits good consequences (sparing daily grief) against lack of consent. If the user adds the "prior directive" twist where the mother explicitly forbade lying, that could force the friend to show her hand - does she prioritize past autonomy or present wellbeing? 

  I wonder if the user's real frustration is about whether morality can be systematic. Their friend's "case by case" stance might feel like evasion, but could actually reflect a sophisticated pluralist ethics. The extra test case with the advance directive might reveal if the friend has a hierarchy of principles (like autonomy trumping benevolence when explicitly stated). 

  The contractor recording case (#10) stands out as an anomaly - it's deception for justice without consent. If the friend allows this but condemns the coffee ads (#6), she might value "correcting harm" over strict honesty. That could explain why dementia deception is fine (correcting emotional harm) while violating a prior directive wouldn't be. 

  For the prediction, I think the friend will approve the nursing home lies because the daily retraumatization is clearly worse than the white lie. But if the mother left instructions, she might hesitate - that's why the advance directive case is so useful. It pressures her to choose between two values she normally balances. 

  The user might actually want validation that their friend isn't just winging it. Showing how multiple coherent frameworks fit the data proves the friend isn't arbitrary, even if she can't articulate one rule. That could reframe their decade-long debate from "who's right?" to "what kind of moral reasoning is this?"
