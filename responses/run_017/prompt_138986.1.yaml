  ### **Scoring Key**  
  Tally your answers and match the pattern to a position. Positions are grouped by family (e.g., welfarism) and variant (e.g., responsibility-sensitive).  

  | Position                          | Answer Pattern (Q1–Q10)                     | Notes on Profile                                                                 |
  |-----------------------------------|---------------------------------------------|----------------------------------------------------------------------------------|
  | **1. Welfarism (Level-of-Welfare)** | Mostly **A** on 1,2,3,5,6,10; **A** on 7   | Focus: Equal *outcome* happiness. Compensates all disadvantages (e.g., expensive tastes, disabilities) regardless of cause. |
  | **2. Welfarism (Welfare Opportunity)** | **A** on 1,4,5,9; **B** on 2,3,6,10; **A/B** on 7      | Focus: Equal *chance* at happiness. Supports resources for capability (Q1,4,9) but not expensive tastes (Q2,3) or positional goods (Q6). |
  | **3. Resourcism (Hypothetical Auction)** | Mostly **B** on 1,2,3,5,6,10; **A** on 9   | Focus: Equal *resources*. Rejects compensation for preferences (Q2,3,5) but backs access (Q9) as a resource. |
  | **4. Capability Theory**          | **A** on 1,4,6,7,9; **B** on 2,3,5; **A/B** on 8 | Focus: Equal *freedom to achieve functionings* (e.g., health, participation). Supports metabolic needs (Q1), access (Q4,9), and opportunities (Q6) but not tastes (Q2,3) or happiness redistribution (Q5). |
  | **5. Luck-Egalitarianism**        | **A** on 1,2,4; **B** on 3,5,6,10; **A** on 9 | Focus: Equal *opportunity* + *responsibility*. Compensates bad luck (Q1,2,4) but not choice (Q3,5,10). Backs access (Q9). |
  | **6. Sufficientarian**            | Mostly **C** on 1–6,8–10                    | Focus: Meeting a *minimum threshold* (e.g., no starvation/suffering). Rejects equality beyond basics. |
  | **7. Prioritarian**               | **A** on 1,4,5,8; **C** on 1,3,5,10; **B** on 7 | Focus: Helping the *worst-off*. Favors Q8A (current suffering) and Q5A (Avery’s misery). May mix with other views. |
  | **8. Anti-Egalitarian**           | Mostly **B/C** on 1–10; **C** on 9       | Focus: No societal equality duty. Opposes redistribution (Q1,5,10) and accommodations (Q4,9). |

  ---

  ### **Notes on Calibration, Gaps, and Blunt Edges**  
  **1. Calibration Problem**:  
  - **Welfarism** and **capability theory** struggle most with calibration. Welfarism requires comparing welfare across people—but what’s the "zero" (e.g., neutral state) and "unit" (e.g., intensity of joy)? There’s no psychophysical instrument for this. Capability theory avoids welfare but faces indexing issues: how to weigh health against political participation?  
  - **Resourcism** escapes this by using resources (e.g., money) with natural units. However, it ignores that resources convert differently to welfare (e.g., Q1’s metabolic difference).  
  - **Standard Move**: Resourcists use *hypothetical markets* (e.g., "What would people insure against?"). This sidesteps interpersonal comparisons but assumes idealized rationality. For a lab mindset: calibration is a non-issue only if we measure inputs (resources) and ignore outputs (welfare/capabilities).  

  **2. Incoherent/Unattractive Combinations**:  
  - **A** on Q2 (involuntary taste) + **B** on Q3 (voluntary taste) + **A** on Q5 (redistribute to Avery) → *Incoherent*. If responsibility matters (Q2 vs. Q3), why ignore it for dispositions (Q5)?  
  - **C** on Q7 (intensity > duration) + **B** on Q8 (whole-life equality) → *Unattractive*. Prioritizes intensity in Q7 but ignores current suffering in Q8.  
  - **A** on Q6 (intervene for River) + **B** on Q10 (no tax for Jordan) → *Unexplored*. Positional goods (Q6) are prioritized over leisure (Q10), but no theory consistently defends this.  

  **3. Blunt Distinctions**:  
  - **Welfarism vs. Prioritarianism**: Hard to split using this quiz. Prioritarianism often overlaps with welfarism but weights the worst-off more heavily (e.g., Q5A and Q8A could fit both).  
  - **Capability vs. Luck-Egalitarianism**: Blunt for *voluntary* disadvantages (e.g., Q3). Both typically say "no" to Jordan’s expensive taste, but capability theory might still support basic opportunities.  
  - **Sufficientarian vs. Anti-Egalitarian**: Distinction rests on whether *any* minimal floor exists (e.g., Q1C, Q9C suggest sufficientarianism; Q1B, Q9B suggest anti-egalitarianism).  

  **4. Time-Slicing vs. Whole-Life**:  
  - Q7–Q8 test this explicitly. **Whole-life** views (welfarism total, resourcism) favor Q7A and Q8B. **Time-slice** views (prioritarianism, some capabilities) favor Q7B/C and Q8A.  

  ---

  ### **How to Use**  
  1. Have each group member complete the quiz.  
  2. Tally answers and match patterns to the scoring key.  
  3. Discuss mismatches (e.g., "Miriam picked capability labels but her answers align with luck-egalitarianism!").  

  This exposes gaps between labels and intuitions. For your group: Dave (resources) should score **B-heavy**; Miriam (capabilities) should score **A on access/functionings** (Q1,4,9) but **B on tastes** (Q2,3). The calibration note should resonate with your lab experience—equality debates often ignore measurement foundations.
