  Below is a 10-question quiz designed to differentiate between egalitarian and non-egalitarian views using concrete cases. Each question avoids technical jargon and focuses on intuitive responses. The **scoring key** maps answer patterns to specific positions (e.g., welfarism, resourcism, capability theory). I've included your requested cases and addressed time dimensions, calibration, and conceptual gaps in the notes.

  ---

  ### **Egalitarianism Quiz: Which View Matches Your Intuitions?**
  **Instructions:** For each scenario, pick the answer that best reflects your view. There are no right or wrong answers—just your honest reaction.

  #### **Question 1: High Metabolic Rate**  
  Alex’s body burns calories 40% faster than average. To be as healthy and energetic as others, Alex needs significantly more food. Without extra resources, Alex feels weak and sick.  
  Should society provide Alex with extra resources?  
  - **A.** Yes—Alex can’t function well without it.  
  - **B.** No—everyone gets the same resources; Alex’s body is their own luck.  
  - **C.** Only enough to ensure Alex isn’t starving or severely ill.  

  #### **Question 2: Expensive Taste (Involuntary)**  
  Taylor developed a rare, costly food preference as a *side effect of essential medication*. This taste isn’t enjoyable—it’s a craving that causes distress unless satisfied.  
  Should society provide extra resources to cover Taylor’s costly cravings?  
  - **A.** Yes—it wasn’t Taylor’s choice, and it causes suffering.  
  - **B.** No—tastes are personal; society isn’t responsible for them.  
  - **C.** Only if Taylor can’t afford basic needs otherwise.  

  #### **Question 3: Expensive Taste (Voluntary)**  
  Jordan deliberately cultivated the *same rare taste* to appear sophisticated. Jordan now needs expensive foods to avoid frustration, despite knowing the cost.  
  Should society provide Jordan with extra resources?  
  - **A.** Yes—if it makes Jordan unhappy, it should be addressed.  
  - **B.** No—Jordan chose this; they should live with the consequences.  
  - **C.** Only if Jordan falls below a minimal standard of well-being.  

  #### **Question 4: Severe Phobia**  
  Sam has a crippling phobia of crowds. Sam *could* physically attend town meetings but never will. The meetings determine local policies affecting Sam.  
  Should society accommodate Sam (e.g., virtual attendance)?  
  - **A.** Yes—Sam deserves equal access to influence decisions.  
  - **B.** No—if Sam *can* attend but doesn’t, that’s their responsibility.  
  - **C.** Only if it’s low-cost; otherwise, Sam must cope.  

  #### **Question 5: The Content Minimalist vs. The Struggling Perfectionist**  
  **Casey** is deeply content with little: a small home, simple food, and solitude bring joy. **Avery** has the same resources but is miserable—Avery needs luxury, travel, and social status to feel okay.  
  Should resources be redistributed from Casey to Avery?  
  - **A.** Yes—Avery suffers more, so resources should boost their happiness.  
  - **B.** No—Casey isn’t causing Avery’s unhappiness; it’s Avery’s disposition.  
  - **C.** Only until Avery reaches a "decent" level of well-being.  

  #### **Question 6: Positional Ambition**  
  River’s sole life goal is to be the *best* trumpet player in the band. But no matter how much River practices, another player remains slightly better. River is unhappy unless #1.  
  Should society intervene to help River become the best?  
  - **A.** Yes—if it’s essential for River’s happiness.  
  - **B.** No—equal opportunity is enough; outcomes aren’t guaranteed.  
  - **C.** Only if River lacks basic opportunities to practice.  

  #### **Question 7: The Short Intense Life vs. The Long Mild Life**  
  **Kai** lived joyfully and intensely, dying at 50 with no regrets. **Morgan** lived mildly content until 100. Both had identical *total lifetime happiness*.  
  Was Kai’s life equally good as Morgan’s?  
  - **A.** Yes—total happiness is what matters.  
  - **B.** No—Morgan’s longer life is better, even with less intensity.  
  - **C.** No—Kai had more happiness *per year*, which is better.  

  #### **Question 8: Front-Loaded vs. Back-Loaded Life**  
  **Dakota** had a blissful youth but is now miserable at 70. **Em** suffered in youth but is now thriving at 70. Both will have identical *total happiness* over their lives.  
  Today, should society prioritize helping Dakota or Em?  
  - **A.** Dakota—they’re worse off *right now*.  
  - **B.** Neither—their lives balance out overall.  
  - **C.** Em—happiness late in life is harder to achieve.  

  #### **Question 9: Wheelchair Access**  
  Charlie uses a wheelchair. Public buildings lack ramps, excluding Charlie from jobs/events. Adding ramps costs resources others won’t directly use.  
  Should society build ramps?  
  - **A.** Yes—Charlie deserves equal access to public life.  
  - **B.** No—equality means equal resources, not equal experiences.  
  - **C.** Only if it doesn’t strain societal resources.  

  #### **Question 10: Hard Worker vs. Leisure Lover**  
  Two people start with equal resources. **Taylor** works tirelessly, building wealth. **Jordan** cherishes leisure, living simply but happily. Taylor ends up wealthier.  
  Should Taylor’s wealth be taxed to support Jordan?  
  - **A.** Yes—their happiness should be equalized.  
  - **B.** No—Taylor earned it; Jordan chose their path.  
  - **C.** Only if Jordan lacks basic necessities.  

