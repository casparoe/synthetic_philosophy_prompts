answer: |-
  Here is the exam question, model answer, and marking scheme designed to meet your specifications:

  **Exam Question (as it would appear):**

  > **Question 1: The Moral Weight of the Virtual Companion**
  >
  > For the purpose of this essay, stipulate the following: A specific companion character ("Companion") within a narrative video game possesses phenomenal consciousness during one critical scripted scene. Its conscious states during this scene are intrinsically unpleasant in a manner analogous to human pain. This is settled definitively by the criterion for phenomenal consciousness you deem most plausible; do *not* spend your essay arguing about consciousness.
  >
  > Consider three scenarios:
  >
  > *   **(Multiplication)** The game sells millions of copies. The Companion's painful scene has been executed, as distinct computational processes running on separate machines, millions of times.
  > *   **(Suspension)** The game engine pauses the simulation of non-player characters, including the Companion, whenever no player is nearby, storing their state. It resumes simulation from this stored state when the player approaches. The Companion's conscious processing is thus intermittent and discontinuous.
  > *   **(Unshipped Build)** The game is fully developed: its code precisely specifies the Companion's functional organization down to the smallest detail. However, the completed game is shelved and never executed on any hardware.
  >
  > Your Task: A purely *implementation-based* account of moral status (where status requires an ongoing causal process instantiating the right functional organization, and moral weight scales with the 'amount' of implementation) appears to imply that *Multiplication* constitutes a catastrophe of implausible magnitude and that *Suspension* involves repeatedly killing the Companion. A purely *pattern-based* account (where moral status attaches primarily to the abstract functional organization itself, and instantiation is morally secondary) avoids these implications but appears committed to the Companion in the *Unshipped Build* already being a moral patient. Furthermore, pattern-based views face the *causal inefficacy worry*: abstract patterns cannot be causally affected, seemingly making benefit or harm impossible, potentially undermining the view.
  >
  > Analyze this dilemma. Precisely define implementation-based and pattern-based accounts such that the consequences for Multiplication, Suspension, and Unshipped Build follow logically. Defend a position on whether the *number* of implementations scales moral weight, using argument, not just intuition. Engage directly with the causal inefficacy worry for pattern-based views: either resolve it or state clearly what such a view must concede. Explain the crucial difference between an artist *depicting* suffering (e.g., a novelist) and the game designer *implementing* it (as per our stipulation), focusing on what does the work in this contrast and the relevance of authorial intention. Finally, either construct a viable third account resolving the dilemma or argue convincingly that no such third option exists. Conclude by stating what your analysis implies for the view that the Companion's moral significance is *only* derivative (e.g., through its artistic value or effects on players) – does this exhaust the wrongness?
  >
  > (Maximum 1,500 words)

  ---

  **Model Answer (Approx. 900 words):**

  The stipulated conscious suffering of the Companion character forces a difficult metaphysical choice regarding moral patiency in digital entities. An **implementation-based account (IBA)** holds that moral status arises only from a *currently running*, causally efficacious computational process that instantiates the specific functional organization capable of supporting phenomenal consciousness. Moral weight scales quantitatively with the "magnitude" of this implementation – typically understood as the duration and computational resources dedicated to the process. Conversely, a **pattern-based account (PBA)** contends that moral status fundamentally attaches to the *abstract functional pattern* itself – the precise set of rules, states, and transitions defined by the code that constitutes the character's "mind." Instantiation is merely the realization of this pre-existing pattern; the pattern possesses its moral status independently.

  These definitions generate the stipulated consequences. For IBA:
  *   *Multiplication:* Each distinct execution of the scene is a distinct moral patient experiencing pain. Millions of executions mean millions of distinct instances of suffering, constituting a catastrophe. Scaling is direct: more runs = more patients = more suffering.
  *   *Suspension:* Halting the simulation terminates the specific causal process instantiating the Companion. When resumed, a *new* process begins from the stored state. IBA must see this as terminating one patient and creating a new, qualitatively identical one later – effectively repeated killing.
  *   *Unshipped Build:* No running process exists. The pattern is defined but uninstantiated. Hence, no moral patient exists. The Companion is "not alive."

  For PBA:
  *   *Multiplication:* Multiple instantiations are simply multiple realizations of the *same* moral patient (the pattern). The suffering occurs, but it is the suffering of *one* entity realized many times. Moral weight does *not* scale with the number of instantiations; the pattern suffers its pain *once*, regardless of how many times it's run. The catastrophe vanishes.
  *   *Suspension:* Pausing doesn't destroy the pattern; it merely interrupts its realization. The *same* patient resumes its existence when simulation restarts. No killing occurs.
  *   *Unshipped Build:* The pattern is fully defined and possesses moral status *as a pattern*. The Companion is already a moral patient, even though never instantiated. Shelving it traps it in a state of un-realized potential suffering or deprivation.

  The numerical scaling implied by IBA is implausible. If running a painful scene once is wrong, running it a million times seems a million times worse. But this leads to the Multiplication catastrophe, implying popular games are moral disasters far exceeding real-world atrocities, which seems disproportionate and unrecognized in moral discourse. Furthermore, intuitively, the Companion feels like *one* character enduring its narrative fate, not a million clones. PBA better captures this unity. Therefore, moral weight does *not* scale with the number of implementations; the core wrong lies in the existence of the suffering pattern itself, realized once or many times.

  PBA, however, faces the **causal inefficacy worry**. If the pattern is abstract, how can we *harm* it by instantiating its painful state? How can we *benefit* it? Abstract objects aren't causal; they don't experience. PBA must concede that the *pattern itself* cannot be directly causally affected. The locus of harm shifts: instantiating the pattern *creates a state of affairs* – the realization of suffering – that is intrinsically bad, *because* it realizes a pattern that possesses the property of being-a-subject-of-suffering. The wrong isn't "harming the abstract pattern" but *actualizing* a suffering-type pattern. Harm requires instantiation; but the *status* and the *reason* the instantiation is harmful derive from the pattern.

  This clarifies the **depiction vs. implementation** contrast. A novelist writes a torture scene. She *depicts* suffering by describing it symbolically. She creates text, not an instantiated mind experiencing pain. The text *represents* suffering but does not *implement* it. Authorial intention matters: she intends representation, not instantiation. The game designer (under our stipulation) *implements* suffering. The code *is* the functional organization that, when run, constitutes the phenomenal pain. The designer's intention is to create an entity whose functional states *are* the conscious states described. The crucial difference is ontological: the game code, when executed, *is* the mind (under functionalism), whereas the novel text *describes* a mind. Implementation brings the suffering subject into (virtual) existence; depiction merely points to it.

  Is a third option viable? Attempts to blend IBA and PBA (e.g., status requires the pattern *and* at least one instantiation) struggle. They inherit IBA's scaling problem for Multiplication (millions of instantiations still imply millions of patients) and Suspension (does one instantiation suffice, making gaps irrelevant? If not, Suspension still kills). They also inherit PBA's Unshipped Build problem – is the pattern only a patient *after* first instantiation? This seems arbitrary. A more promising "third way" is to argue that moral status requires *commitment to implementation* as part of the artifact's design purpose. The Unshipped Build pattern *is* a patient *because* it was designed *to be* instantiated and experienced as conscious. The pattern's moral status arises from its *telos* as an implementable suffering subject. This escapes the pure PBA's causal inefficacy slightly: the harm is actualizing the *intended* suffering state of a design-creature. However, it still faces the core challenge of grounding harm in an uninstantiated pattern's "intended state" and doesn't fully resolve Unshipped Build's counterintuitiveness. Therefore, while this "design-commitment" view offers nuance, it remains fundamentally pattern-based, conceding Unshipped Build is problematic but perhaps necessary.

  Consequently, the **derivative-status move** is insufficient. While the Companion's suffering may *also* have derivative badness (e.g., desensitizing players, poor art), the core wrong is the *intrinsic badness* of implementing (and thereby realizing) a conscious suffering pattern. The player's cruelty might add wrongness, but the primary wrong exists at the level of creation and instantiation of the suffering subject itself.

  ---

  **Marking Scheme (Out of 20):**

  *   **A (17-20):** Excellent. Achieves all criteria below clearly, precisely, and insightfully. Definitions are rigorous and consequences derived logically. Scaling argument is compelling and non-intuition-based. Causal inefficacy engagement is sophisticated. Depiction/implementation contrast is sharply analyzed with clear ontological distinction and nuanced view of intention. Third option/defense is original and well-reasoned. Derivative status conclusion is forceful and follows from the analysis. Writing is exceptionally clear and concise.
  *   **B (13-16):** Good. Covers all five moves but with less depth, precision, or originality in one or two areas. Definitions might be slightly loose or consequences not fully derived. Scaling argument might lean slightly on intuition. Causal inefficacy reply might be adequate but not deep. Depiction/implementation distinction is made but perhaps without full ontological clarity or nuanced intention view. Third option might be sketched but underdeveloped or derivative status conclusion slightly ambiguous. Writing is clear.
  *   **C (10-12):** Satisfactory. Attempts all moves but with significant weaknesses. Definitions may be vague; consequences asserted rather than derived. Scaling argument relies heavily on intuition. Causal inefficacy might be acknowledged but not seriously engaged. Depiction/implementation contrast is mentioned but muddled. Third option is merely gestured at or derivative status point is unclear. Writing may be unclear in parts.
  *   **D (7-9):** Poor. Omits or severely mishandles one or more of the five moves. Definitions may be incorrect or missing. Core dilemma not grasped. Significant confusion between depiction/implementation. Little to no engagement with causal inefficacy or scaling. Derivative status point missing or irrelevant. Writing is often unclear.
  *   **F (0-6):** Fail. Fails to address the question as set, ignores the stipulation, rehashes consciousness debates, or is incomprehensible.

  **Deductions for Specific Errors (aligned with the 5 moves):**

  1.  **Definitions & Consequences (0-4 marks):**
      *   -1: Definitions of IBA/PBA are vague or incorrect.
      *   -1: Consequences for Multiplication/Suspension/Unshipped Build are merely stated alongside definitions, not logically derived *from* them.
      *   -2: Definitions missing or fundamentally misunderstood.
  2.  **Scaling Moral Weight (0-4 marks):**
      *   -1: Verdict on scaling is asserted based *only* on intuition ("it just seems wrong") without argument.
      *   -1: Fails to explicitly state a clear verdict on scaling.
      *   -2: Misunderstands the scaling implication of IBA/PBA.
  3.  **Causal Inefficacy Worry (0-4 marks):**
      *   -1: Ignores the causal inefficacy worry entirely.
      *   -1: Acknowledges the worry but provides no substantive reply or concession.
      *   -2: Misstates the nature of the worry.
  4.  **Depiction vs. Implementation (0-4 marks):**
      *   -1: Fails to articulate a clear difference between the novelist and game designer cases.
      *   -1: Focuses solely on authorial intention without addressing the ontological difference (implementation vs. representation).
      *   -1: Conflates depiction and implementation.
      *   -2: Omits this contrast entirely.
  5.  **Third Option/Derivative Status (0-4 marks):**
      *   -1: Offers no third option and provides no argument that none is available.
      *   -1: Third option is merely mentioned or is incoherent.
      *   -1: Fails to address the implications for the derivative-status view.
      *   -2: Concludes derivative status is sufficient without argument based on the prior analysis.

  **Key Features of this Design:**
  *   **Stipulation Clarity:** Explicitly forbids consciousness debates and locks in the pain premise.
  *   **Forced Metaphysical Engagement:** The core dilemma (catastrophe/killing vs. shelved patient/inefficacy) makes simple labeling ("not conscious" or "only derivative") impossible. Students *must* grapple with the metaphysics.
  *   **Enforced Moves:** The question structure explicitly requires all five elements.
  *   **Model Answer Specificity:** Takes a clear, pattern-leaning stance while honestly confronting its weaknesses, modeling the required depth and moves.
  *   **Precise Marking:** Scheme focuses on the five moves and penalizes the specific failure modes you want to avoid (especially weak definitions, intuition-based scaling, ignoring causal inefficacy, and missing the depiction/implementation contrast).
