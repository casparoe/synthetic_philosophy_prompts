prompt: |-
  I was appointed to the acquisitions and display committee of our regional museum last spring, and our next item is one I have wanted settled for years — so I should say at the outset that I am not a neutral party. The building at issue is the parish church my family has attended for four generations; part of me simply wants it whole again. That is exactly why I would rather argue from our own record than from my wish. Our museum is small: a teaching remit, a regional brief, a collection strong in medieval and Renaissance material and thin everywhere else, and a display budget that cannot fund two versions of anything.

  The case before us. In the 2016 earthquake the apse of the village church collapsed, taking with it a fresco cycle of about 1480 by a local workshop. Roughly sixty per cent of the painted surface was recovered in fragments, most with recorded find-spots. There is also a photogrammetric survey from 2011, a set of pre-war colour transparencies, and a restorer's 1958 tracings that record the colour of areas now lost. A consortium of a university imaging lab, the diocese, and a conservation fabricator proposes the following: mount the original fragments on a new honeycomb-panel support in their documented positions, and fill the lacunae with mineral-pigment prints on a lime-based substrate generated from the photographic record, printed at slightly reduced saturation. The effect they are aiming at is that the infill is detectable at arm's length but not in the photographs that will appear on our website, in the guidebook, and in the diocese's own material. The church cannot take the cycle back for at least six years, so it would come to us, and the diocese will lend it only if the wall text describes the cycle as "restored" and avoids the words copy, fake, and reconstruction — which puts us back in the neighbourhood of one of our own precedents, except that this time the condition concerns a word rather than a silence.

  Our record, as far as I can assemble it:

  1. "The copy in the frame." A copy, by an unknown hand, of a Baroque altarpiece whose original burned in the 1860s; the copy has hung in the surviving carved frame ever since, and since 1971 with us on long-term loan. In 2019 we renewed the loan and kept it on display, labelled as a copy. The minute: "the frame and the wall were made for an image of this size, and this one has been doing that work for a century and a half; removing it would leave a hole that says nothing."

  2. Facsimiles of a codex. Since 2011 our light-insensitive... the illuminated codex has been in the vault and facsimile openings in the gallery, with a wall text explaining why. The minute: "the original is preserved, the facsimile lets us show it, and any reader who asks is taken to the original."

  3. The declined forgery. In 2015 a private collector offered on long-term loan a painting our curator regarded as a forgery of a well-known 1920s work, on condition that it be shown without any wall text or catalogue entry flagging the doubt. We declined. The minute says only that the condition is not one we can accept; nothing records what we would have done had the same object been offered with a label saying "attributed" or "probably a forgery."

  4. The artist-supervised re-creation. In 2018 a mirrored-room installation of 1974 by a living artist, destroyed in a flood, was re-fabricated from the artist's own plans, under her supervision and with her certificate. We accessioned the new fabrication and catalogue it as her work, the label noting the date of fabrication. The minute: "the artist is alive and says that this is the work."

  5. The unmarked roof timbers. In 1994 we accepted a restoration of a fifteenth-century roof in which roughly forty per cent of the members were replaced with new oak worked by hand to the same sections. We do not mark which timbers are new. The minute: "it is a roof; it has to carry the building."

  The four options on the table are: (A) decline the reconstruction and show the recovered fragments as fragments, in their documented arrangement, with the lacunae left empty and the photographic record beside them; (B) accept and display the reconstruction with the reduced-saturation infill — visible at arm's length, invisible in photographs — in the medieval gallery; (C) accept and display it, but only as a didactic exhibit in our teaching space, not accessioned and not in the medieval gallery; (D) accept and display it with the infill in a single flat neutral tone, so that the losses are legible at any distance and in any photograph.

  What I would like from you:

  First, set out plainly the two or three rules about what makes an object worth showing — about where the value of an original lies and what a stand-in does or does not inherit — that fit all five of our decisions together. I suspect we have been running something like a history rule (what matters is the object's actual making and its chain of custody), something like an experience rule (what matters is what a visitor standing in front of it gets, once nothing is being concealed), and something like an office rule (what matters is the job the object is here to do for this collection and these publics), but I would rather you named them properly and said how each one has to be stated in order to survive all five precedents at once.

  Second, say what each rule implies about A, B, C, and D, and where they come apart.

  Third, give me the option you expect us to adopt if we want to be consistent with ourselves, and identify the closest precedent — with an honest account of how close it really is. Each of our five differs from this case in some respect that may matter: in 2 and 5 the original or the functioning whole still exists, in 4 the artist was alive to authorize, in 1 the copy had acquired a century and a half of its own history, and in 3 we never decided the underlying question at all. Tell me which of those differences does the most work.

  Fourth, if our record genuinely underdetermines the decision, say what principle each option would commit us to and which of those commitments we would regret most. I am particularly unsure what to make of the reduced-saturation trick: the infill is designed to disappear precisely in the medium through which almost everyone will encounter the cycle, and to be visible only to the person who has made the journey to stand in front of it. Is that a feature of proposal B or the thing that should sink it?

  Finally, and most useful to me: name one further case — a variant of this one, or a different sort of object entirely — that would best separate the rules still in play after our precedents, and say what our answer to it would tell us.

  Please end with a single machine-readable line, and nothing after it: \answer{A}, \answer{B}, \answer{C}, or \answer{D}.
reasoning: |-
  Hmm, the user is part of an acquisitions committee for a regional museum and needs help deciding on a complex case involving a damaged church fresco. They've provided detailed background and precedents, and they want a structured analysis.

  First, I need to understand the core dilemma. The fresco was damaged in an earthquake - 60% survives in fragments, with extensive documentation. A consortium proposes reassembling the fragments and filling gaps with digitally reconstructed images printed at reduced saturation. The diocese insists on calling it "restored" and avoids terms like "copy." The user has personal ties to the church but wants an objective decision.

  The museum has five relevant precedents:
  1. Displaying a copy altarpiece in its original frame, labeled as a copy
  2. Showing facsimiles of a codex while storing the original
  3. Rejecting a suspected forgery due to labeling restrictions
  4. Accessioning an artist-supervised recreation
  5. Not marking replacement timbers in a restored roof

  The options are:
  A) Show only fragments with documentation
  B) Accept reconstruction with subtle infill (visible in person but not photos)
  C) Accept as didactic exhibit only
  D) Accept with obvious neutral-toned infill

  The user wants me to:
  1) Extract consistent principles from all five precedents
  2) Apply them to the options
  3) Recommend the most consistent choice
  4) Analyze where precedents differ meaningfully
  5) Consider implications if undetermined
  6) Propose a test case to clarify principles

  Looking at the precedents, three core principles emerge:
  - **Material Integrity Principle**: Value resides in original material and its history (evident in rejecting the forgery and preserving the codex original)
  - **Functional Integrity Principle**: The object's purpose in the collection matters most (the copy altarpiece "filling the hole," the roof "needing to function")
  - **Transparency Principle**: No concealment of what the object is (labeling the copy, explaining facsimiles, rejecting unlabeled forgery)

  Applying these to the options:
  - **A** honors Material Integrity but fails Functional Integrity (fragments don't convey the whole)
  - **B** prioritizes Functional Integrity but violates Transparency (infill deceives in photos)
  - **C** is inconsistent - if it's didactic only, why avoid accessioning? Half-measure.
  - **D** balances all three: shows fragments (Material), reconstructs context (Functional), makes gaps obvious (Transparency)

  The closest precedent is #4 (artist-supervised recreation), but key differences matter: the artist isn't alive here, and the fresco's "authorship" is a workshop, not an individual. The most critical difference is the **survival of the original** - unlike precedents 2 and 5 where originals exist intact, here the original is fragmentary.

  The reduced-saturation infill is problematic - it creates two truths: one for in-person viewers (who see gaps) and one for remote audiences (who see "whole"). This undermines the Transparency Principle.

  For a test case, imagine if someone proposed digitally "completing" a fragmentary ancient statue with 3D-printed parts matching the original surface. Our principles would likely demand visible differentiation (like option D) to avoid falsifying material history.

  Ultimately, **Option D** aligns best with the museum's history: it preserves authenticity of fragments, serves the educational purpose, and maintains honesty across all viewing contexts. The user's personal desire to "see it whole" is understandable but shouldn't override institutional consistency.

  \answer{D}
answer: |-
  ### Analysis of Museum Precedents and Recommendation for the Fresco Cycle

  #### 1. Core Principles Derived from Precedents
  Your museum’s decisions consistently reflect three principles, refined to survive all five precedents:

  - **Material Authenticity Principle**: An object’s value lies in its original physical substance and traceable history. *Survival across precedents*: Rejects unmarked forgeries (3), preserves original codices (2), and distinguishes artist-supervised recreations (4). It allows replacements only when essential to structural function (5) or when the copy has independent historical weight (1).
    
  - **Functional Integrity Principle**: An object’s role in the collection determines its display—whether to preserve context, educate, or fulfill a physical/spatial purpose. *Survival*: Accepts the altarpiece copy to avoid a "hole" (1), uses facsimiles for accessibility (2), replaces roof timbers for structural necessity (5), and prioritizes the artist’s intent in recreations (4). Declines objects that undermine the museum’s educational role (3).

  - **Transparency Principle**: The museum must avoid deception by clearly signaling an object’s nature and gaps in knowledge. *Survival*: Labels copies (1), explains facsimiles (2), rejects unmarked forgeries (3), notes recreation dates (4), but permits unmarked structural replacements only when functionality overrides (5).

  These principles are interdependent: *Material Authenticity* grounds historical truth, *Functional Integrity* justifies compromises for the collection’s purpose, and *Transparency* ensures ethical engagement.

  #### 2. Application to Options A–D
  - **Option A (Fragments only)**:  
    - *Material Authenticity*: Strong—honors original fragments.  
    - *Functional Integrity*: Weak—fails to convey the fresco’s original impact or educational context.  
    - *Transparency*: Strong—losses are explicit.  
    *Verdict*: Prioritizes fragments over function, creating a "hole" like the rejected altarpiece removal (Precedent 1).  

  - **Option B (Reduced-saturation infill)**:  
    - *Material Authenticity*: Moderate—fragments preserved, but infill mimics original.  
    - *Functional Integrity*: Strong—recreates the artwork’s visual unity for in-person viewing.  
    - *Transparency*: Weak—infill "disappears" in reproductions (website/guidebook), concealing losses from most audiences.  
    *Verdict*: Functional but deceptive; akin to the declined forgery (3) due to concealed compromise.  

  - **Option C (Didactic exhibit only)**:  
    - *Material Authenticity*: Moderate—fragments used but not accessioned.  
    - *Functional Integrity*: Contradictory—isolates the object from the medieval gallery, undermining its role as art.  
    - *Transparency*: Strong—contextualized as educational.  
    *Verdict*: Inconsistent; treats the object as "less than" art (unlike Precedent 4, which accessioned the recreation).  

  - **Option D (Neutral-tone infill)**:  
    - *Material Authenticity*: Strong—fragments dominate, losses unmistakable.  
    - *Functional Integrity*: Strong—allows appreciation of scale/composition without deception.  
    - *Transparency*: Strong—infill is obvious in all contexts.  
    *Verdict*: Balances all principles; similar to the facsimile (2) in honesty and the roof (5) in pragmatic repair.  

  **Where principles come apart**:  
  - B prioritizes *Functional Integrity* (seamless display) but sacrifices *Transparency*.  
  - A prioritizes *Material Authenticity* but ignores *Functional Integrity*.  
  - C creates tension between *Functional Integrity* (didactic) and *Material Authenticity* (not accessioned).  
  - D aligns all three but may underdeliver on aesthetic immersion.  

  #### 3. Recommended Consistent Option and Closest Precedent  
  **Adopt Option D**. It best harmonizes with your precedents by:  
  - Preserving original fragments (Material Authenticity).  
  - Serving the fresco’s educational/spatial role (Functional Integrity).  
  - Ensuring visible honesty at all distances and media (Transparency).  

  **Closest precedent**: **Precedent 2 (Facsimile codex)**. Both involve:  
  - Original material preserved but inaccessible.  
  - A surrogate used for display.  
  - Explicit communication of the substitution.  
  **Key difference**: The codex’s original is intact, while the fresco’s is fragmentary. This *does significant work*—it necessitates physical integration of fragments (like the roof timbers in 5) but still demands transparency. The "survival of the original" distinction is less critical than the shared need for surrogate + honesty.  

  **Other differences matter less**:  
  - Artist authorization (4) is irrelevant here—workshop authorship is historical, not living.  
  - The copy’s history (1) doesn’t apply—this fresco has no surrogate legacy.  
  - The forgery (3) was declined for lack of transparency; Option D avoids this.  

  #### 4. If Underdetermined: Commitments and Risks  
  Your record *partially* underdetermines due to the novel reduced-saturation infill. Each option commits you to a principle that may cause regret:  
  - **A** commits to *Material Authenticity above all*—regret losing the fresco’s educational impact.  
  - **B** commits to *Seamless Functionality*—regret institutionalizing photographic deception.  
  - **C** commits to *Compartmentalizing Uncertainty*—regret diminishing the object’s artistic status.  
  - **D** commits to *Radical Transparency*—minimal regret; aligns with ethics but may disappoint visitors seeking wholeness.  

  **The reduced-saturation trick**: This sinks B. It makes infill visible only to in-person viewers, privileging them with truth while misleading the broader public. This violates the *Transparency Principle* (Precedent 3) and echoes the "silence" rejected in the forgery case.  

  #### 5. Test Case to Clarify Principles  
  **Hypothetical**: A donor offers a fire-damaged Renaissance statue with 50% original fragments. A lab proposes reattaching fragments and 3D-printing missing parts in original marble, textured identically. The infill is detectable only under UV light. Label must say "restored."  

  **What this tests**:  
  - *Material Authenticity*: Would 3D-printed marble "fool" even experts, crossing into forgery (3)?  
  - *Functional Integrity*: Does seamless display serve education or mislead?  
  - *Transparency*: Is UV detection sufficient, or must gaps be visually obvious?  

  **Your likely answer**: Reject or demand visible differentiation (like Option D). Precedents 3 (forgery) and 2 (facsimile) would prioritize overt honesty over seamless repair.  

  \answer{D}
