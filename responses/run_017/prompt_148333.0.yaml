prompt: |-
  My friend and I spent a good part of last night arguing about moral foundations theory, and I came away unable to tell whether I had been disagreeing with the theory or merely with his version of it. I would be grateful for an audit of the position he defended. What follows is my best reconstruction of it, as nearly in his own words as I can manage:

  "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty — each of which evolved to cope with a different recurring problem of living in groups. Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set, which is why they can build coalitions around nation, tradition and religion and the left cannot. Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood, and it pulls you into a political camp rather than the other way about. Judgement comes first and reasoning comes afterwards. Present people with a harmless taboo violation and they condemn it instantly, flounder when asked to say what was wrong with it, and then manufacture reasons on the spot. So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have. And once you see that, you see that there is no answer to the question of who is right. Morality is a bundle of evolved reactions, people are wired with different weightings of them, and asking whose weighting is correct is like asking whose taste in food is correct. The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."

  I objected at several points and was not convinced by my own objections. Three in particular I could not settle. First, whether the "liberals run on two foundations" line, as he put it, is what the research actually claims, or whether something has gone missing in the retelling. Second, whether the claim that reasoning arrives after judgement, even if we grant it, supports what he took it to support — it struck me that it might be a claim about the order in which things happen to us rather than about whether our reasons are any good, but he said that distinction was evasive. Third, the step from "our moral judgements have a psychological explanation" to "there is no fact of the matter". I accused him of committing the genetic fallacy. He replied that if you learnt your belief that two and two make four was being produced by a brain lesion you would abandon it, and that if I thought the moral case was relevantly different I should say precisely how. I could not.

  I also tried him with a hypothetical. Suppose a large longitudinal study found that foundation profiles are strongly heritable, stable across the life course, and better predictors of later party identification than party identification is of them. He said that would settle the matter outright and show that there is no fact of the matter about whose political morality is correct. I doubt it settles anything of the kind, but I could not say what it would establish if it were true, or what it would leave exactly where it was.

  Could you go through his account claim by claim and separate what the theory's proponents would accept, what is a defensible simplification for a popular treatment, and what they would reject as a misstatement? Please flag anywhere his summary runs together two things the framework keeps apart, and note where he has quietly converted a relative claim into an absolute one. Where he draws a conclusion — about who is right, or about what the psychological findings would show — say whether the conclusion survives once the misstatements are corrected, and whether the argument as he gives it cuts against the left and the right symmetrically or only against one of them. Finally, I should say that I am not a psychologist; I have read one popular book on this, and he has read the same one more carefully than I have, which may be the whole difficulty.
reasoning: |-
  Okay, let me approach this systematically. The user presents a detailed reconstruction of their friend's interpretation of Moral Foundations Theory (MFT), along with their own objections and uncertainties. This requires careful dissection of both the friend's claims and standard MFT doctrine.

  First, I need to compare the friend's statements point-by-point with established MFT principles. The core claims about innate foundations and political differences need verification - Haidt's research does suggest five (later six) foundations with liberal-conservative differentials, but the "only two foundations" phrasing oversimplifies. The friend's version implies liberals don't engage other foundations at all, whereas research shows differential weighting. That's a significant flattening.

  The temperament arguments seem largely aligned with MFT's heritability claims, though "fixed by early adulthood" overstates lifelong rigidity. The reasoning-as-rationalization point directly channels Haidt's social intuitionist model, but I should note this describes psychological process without denying rational deliberation entirely. 

  Where the friend diverges radically is in drawing meta-ethical conclusions. MFT explicitly avoids claiming moral relativism - describing moral psychology isn't equivalent to endorsing subjectivism. The brain lesion analogy commits the genetic fallacy by confusing origins with validity. Yet this is precisely where the user struggled countering their friend. 

  The political symmetry question is crucial. The friend's framing clearly advantages conservatives by suggesting broader moral "vocabulary," but MFT would note both sides have blind spots - conservatives may undervalue harm/care in certain policy domains. The theory describes asymmetry, not superiority.

  For the user's unresolved objections: First, yes, "liberals use only two" is reductive. Second, post-hoc reasoning doesn't automatically invalidate moral positions. Third, the is-ought gap remains unbridged by psychology alone. The longitudinal study hypothetical wouldn't settle moral truth even if confirmed - descriptive facts don't prescribe values.

  I should emphasize where the friend converts relative claims (foundation weighting differences) to absolute ones ("left cannot build coalitions"). Also note conflation of moral diversity (descriptive) with relativism (meta-ethical). The conclusion about "no fact of the matter" doesn't follow from MFT premises - that's the friend's philosophical addition.

  Finally, the user's humility about their non-expertise is refreshing. Their difficulty stems from the friend presenting personal interpretation as settled theory. My response should validate their skeptical instincts while clarifying actual MFT boundaries.
answer: |-
  Here's a claim-by-claim audit of your friend's position, separating MFT orthodoxy from his interpretation, highlighting simplifications, misstatements, and philosophical leaps:

  **1. Claim:** "Moral judgements run on a handful of innate foundations — harm/care, fairness, loyalty, authority, sanctity and liberty — each of which evolved to cope with a different recurring problem of living in groups."
      *   **MFT Proponents Accept:** Core claim. These 5-6 foundations (Liberty often added later) are described as innate psychological systems shaped by evolution to solve social coordination problems. This is the central thesis.
      *   **Defensible Simplification:** Calling them "innate" captures the idea of prepared learning modules, though development and culture shape expression. Listing the problems (e.g., authority for hierarchy, sanctity for avoiding pathogens/spiritual threats) is standard.
      *   **Potential Overstep:** "Innate" shouldn't imply *fully formed at birth* or *immune to culture*; it means *evolutionary preparedness*. Proponents emphasize gene-culture co-evolution.

  **2. Claim:** "Liberals are effectively running on only two of them, care and fairness; conservatives run on the full set..."
      *   **MFT Proponents Accept:** The core *relative difference*. Haidt's research consistently shows liberals *prioritize* Care/Harm and Fairness/Cheating more strongly, while conservatives *use all foundations more equally*, placing relatively higher weight on Loyalty, Authority, and Sanctity. Liberty is complex, sometimes used more by libertarians/liberals.
      *   **Misstatement:** "Running on only two" is a significant overstatement. Liberals *do* use the other foundations, just *less often* and with *lower weight* in their moral calculus compared to conservatives in the contexts studied (mainly US politics). They might express Loyalty (e.g., to humanity), Authority (e.g., scientific expertise), or Sanctity (e.g., environmental "sacredness") differently.
      *   **Runs Together:** He conflates *relative weighting/difference in emphasis* with *absolute presence/absence*. MFT describes a spectrum of emphasis, not binary on/off switches.

  **3. Claim:** "...which is why they [conservatives] can build coalitions around nation, tradition and religion and the left cannot."
      *   **MFT Proponents Might Note:** Conservatives' relatively stronger endorsement of Loyalty, Authority, and Sanctity *facilitates* building coalitions around traditional nation, tradition, and religion. Liberals' relative de-emphasis makes this harder *using those specific moral appeals*.
      *   **Misstatement/Oversimplification:** "The left cannot" is false and absolute. The left *does* build coalitions, often using Care, Fairness, and Liberty foundations (e.g., social justice movements, environmentalism, labor rights). They build coalitions around *different moral matrices*, not that they *can't* build coalitions at all. This converts a relative claim about *types of appeals* into an absolute claim about *capability*.

  **4. Claim:** "Your profile is largely temperamental: substantially heritable, more or less fixed by early adulthood, and it pulls you into a political camp rather than the other way about."
      *   **MFT Proponents Accept:** This is a core claim. Research (twin studies, etc.) suggests foundation weighting has a substantial heritable component, is relatively stable in adulthood, and *predisposes* individuals towards ideologies that resonate with their moral tastes. Foundational moral intuitions often precede and guide political identification.
      *   **Defensible Simplification:** "Largely temperamental," "substantially heritable," "more or less fixed by early adulthood," and "pulls you in" are reasonable summaries of the research Haidt presents. "Fixed" implies stability, not absolute immutability.
      *   **Nuance:** Environment (especially formative experiences/culture) interacts with temperament. Political engagement can *also* shape moral views over time (reciprocal influence), though the predisposition effect is strong.

  **5. Claim:** "Judgement comes first and reasoning comes afterwards. Present people with a harmless taboo violation and they condemn it instantly, flounder when asked to say what was wrong with it, and then manufacture reasons on the spot."
      *   **MFT Proponents Accept:** This directly describes Haidt's "Social Intuitionist Model" (SIM). Moral intuitions (gut feelings) often come first, and reasoning is frequently post-hoc justification ("the lawyer" not "the judge"). The harmless taboo examples (e.g., eating the family dog) are classic experiments demonstrating this.
      *   **Defensible Simplification:** Captures the core sequence and phenomenon well for popular discussion.
      *   **Nuance:** Reasoning *can* influence intuition, especially over time or in dialogue. The SIM describes the dominant *initial* process, not that reasoning is *always* powerless.

  **6. Claim:** "So a political argument is never really an argument; both sides are rationalising intuitions they were always going to have."
      *   **MFT Proponents Might Say:** Political arguments are *often* motivated reasoners rationalizing pre-existing intuitions, especially on highly charged issues. Our foundational intuitions heavily bias our reasoning.
      *   **Oversimplification/Misstatement:** "Never really an argument" is too absolute. While intuition is primary and reasoning biased, people *can* sometimes change their minds through reasoned argument, exposure to new experiences, or encountering compelling evidence that resonates with *other* foundations they possess. The SIM doesn't rule out *all* influence of reason, just its typical *initial causal primacy*.

  **7. Claim:** "And once you see that, you see that there is no answer to the question of who is right. Morality is a bundle of evolved reactions, people are wired with different weightings of them, and asking whose weighting is correct is like asking whose taste in food is correct."
      *   **MFT Proponents Explicitly Reject (as a conclusion of MFT):** This is your friend's *philosophical leap*, not MFT. Haidt carefully describes MFT as *descriptive moral psychology* – explaining *how* moral judgments work. He explicitly avoids drawing *prescriptive* meta-ethical conclusions (like relativism) *from* MFT. He acknowledges the is-ought gap.
      *   **Misrepresents MFT:** MFT describes the *origins* and *mechanisms* of moral judgment. It does *not*, by itself, entail that there are no moral truths or that all weightings are equally valid. That's a separate philosophical argument. Your friend commits the **Genetic Fallacy** here (confusing the origin of a belief with its validity). Haidt might *personally* lean towards pluralism or intuitionism, but he doesn't present MFT *as proving* relativism.
      *   **False Analogy:** The "taste in food" analogy pushes hard towards subjectivism. Moral judgments involve claims about right/wrong that impact others, unlike purely subjective preferences. Many argue morality involves reasons and principles that can be debated, even if rooted in intuition.

  **8. Claim:** "The most that can fairly be said is that the right, having more foundations in play, commands a wider moral vocabulary, and therefore understands the left better than the left understands it."
      *   **MFT Proponents Might Say:** Conservatives, drawing on a broader *range* of foundations in their political discourse, often use moral language that resonates with a wider segment of the population and can frame arguments in ways liberals might not instinctively grasp. This *can* lead to a *degree* of asymmetric understanding.
      *   **Oversimplification/Misstatement:**
          *   "Commands a wider moral vocabulary": They *use* a wider *range of foundations* in their rhetoric. Whether this constitutes a "wider" vocabulary is semantic, but the core point about utilizing more foundations is supported.
          *   "Therefore understands the left better": This is a huge leap. *Using* more foundations doesn't equate to *understanding* those who prioritize different ones. Conservatives might *dismiss* liberal Care/Fairness concerns as naive or misapplied just as liberals might dismiss Sanctity concerns as irrational. MFT suggests **mutual misunderstanding** stemming from different matrices. Haidt argues *both* sides often fail to understand the other's moral concerns. Your friend converts a claim about *rhetorical range* into a claim about *superior understanding*, asymmetrically favoring the right.
      *   **Asymmetry:** This conclusion is presented *only* as an advantage for the right, ignoring whether liberals might better understand certain domains (e.g., international perspectives, systemic injustice) using their foundations. It's not symmetrically applied.

  **Addressing Your Specific Objections & His Replies:**

  1.  **"Liberals run on two foundations"**: As above, this is a **significant misstatement/oversimplification**. Research shows *differential weighting and emphasis*, not exclusive use. Liberals *use* the other foundations but typically *weight them less heavily* in political/moral judgment.
  2.  **Reasoning After Judgement Supporting Relativism**: You were correct. The SIM is a claim about **psychological sequence and the primacy of intuition**. It does **not**, by itself, determine the **epistemic status** of moral judgments. It describes *how we arrive* at judgments, not whether those judgments *can be justified* or *correspond to truth*. His brain lesion analogy for math **fails** because:
      *   **Math is Analytic/Logical:** 2+2=4 is true based on logical definitions within a system. A brain lesion producing this belief doesn't change the truth of the proposition within math.
      *   **Morality is (Argued to be) Synthetic/Normative:** Moral claims are about how we *ought* to behave. Discovering an evolutionary/psychological origin doesn't *automatically* invalidate them; it just explains their source. One must argue *separately* why that origin precludes objectivity (e.g., if you believe morality requires a divine command or pure reason, then evolution *might* undermine it; if you believe morality is about well-being, evolutionary origins might be compatible with objectivity). He hasn't made that argument; he's assumed it.
      *   **Distinction is Crucial:** The distinction between descriptive psychology and normative ethics is fundamental, not "evasive." He is smuggling a meta-ethical conclusion (relativism) into a descriptive theory (MFT/SIM).
  3.  **Genetic Fallacy & The Hypothetical Study:** Your accusation was correct. His reply (brain lesion) **does not** successfully rebut it, as explained above. The large hypothetical study **would** strongly support the **descriptive psychological claims** of MFT (heritability, stability, predisposition). It would **not**, by itself, settle the **normative question** of "who is right." Here's what it would leave open:
      *   **The Is-Ought Gap:** Even if we know *how* people *do* form moral judgments, it doesn't tell us how they *should* form them or what is *actually* right/wrong.
      *   **Basis for Moral Truth:** Does moral truth depend on well-being? On rationality? On divine command? On social contracts? The study doesn't address these philosophical foundations. It leaves the question of what *makes* a moral weighting "correct" entirely untouched. It shows the origins are non-rational and temperamental, but doesn't prove there's no truth to be found. Your friend assumes temperamental origins imply no objectivity – that's the unsupported leap.

  **Conclusion on Your Friend's Position:**

  *   **Faithful to MFT:** His description of the foundations themselves, their evolutionary origins, the core liberal/conservative *difference* in foundation weighting, the heritability/stability, and the Social Intuitionist Model (intuition first, reasoning second) is largely accurate or a defensible simplification for popular discussion.
  *   **Significant Misstatements/Oversimplifications:** "Liberals run on only two foundations" and "the left cannot build coalitions" are serious overstatements. Converting relative weighting differences into absolute presence/absence or capability/non-capability distorts the theory.
  *   **Major Philosophical Leap:** The jump from MFT/SIM to "there is no answer to the question of who is right" and the "taste in food" relativism **is not supported by MFT itself** and commits the genetic fallacy. This is his own meta-ethical interpretation imposed *onto* the descriptive psychology.
  *   **Asymmetry:** His conclusion about conservative understanding being superior due to using more foundations is an unsupported extrapolation that only cuts against the left. MFT suggests mutual misunderstanding.
  *   **Your Doubts Were Well-Founded:** Your objections about the "two foundations" claim, the leap from psychological sequence to epistemic status (reasoning after judgment), and the genetic fallacy were all valid. His replies, particularly the brain lesion analogy, did not adequately address the core philosophical distinctions you raised. The hypothetical study would powerfully confirm MFT's descriptive claims but leave the normative question of moral truth completely unresolved.

  The core difficulty stems from your friend conflating a descriptive psychological theory (MFT/SIM) with a specific meta-ethical conclusion (relativism) that does not logically follow from it alone, while also overstating some of the empirical claims (especially about liberals). You were rightly skeptical of that conflation and those overstatements.
