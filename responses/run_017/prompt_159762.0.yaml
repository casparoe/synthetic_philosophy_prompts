prompt: |-
  My mate did a philosophy module at uni and he keeps saying that "it's true that the train is late" doesn't say anything more than "the train is late" — the word "true" is just decoration or grammar. I more or less buy it for that example. But I keep running into cases where it definitly doesn't feel like decoration, and I have no word for what's going on in them.

  Here's the sort of thing I mean. A relative hands me a letter from a doctor written in a language I can't read and says "whatever it says in there is true". Or: "everything my gran said about what happened to the family in 1947 was true" — she's been dead twenty years, almost none of it was ever written down, and even she couldn't have sat down and listed all the claims, because most of them were the kind of thing you never spell out. Or, weirder: "exactly two of the things in that sealed report are true" — nobody alive knows which two, and there's no list anybody could produce. And I notice I can pass these along: I tell you "if what the surveyor says is true we're fine", you tell someone else, and it travels through four people without anyone ever unpacking it into actual sentences.

  Things I've tried and why they don't work for me. It's not just "I'm willing to go along with it", because I can't assert any of these claims — I don't know what they are. It's not quite "matches the facts" either, or at least it doesn't feel like I'm doing that; I'm doing something more like vouching for a source. My mate says these are all just shorthand for a giant list of sentences I could in principle write out, but in my examples I couldn't even in principle — and yet the sentence still seems to mean something perfectly definite, and to be the kind of thing that could turn out to be wrong. That's the bit that bugs me.

  So: is there an established name for this use of "true", and for the problem it supposedly makes for the view that "true" adds nothing? Please don't just hand me a label — I want to know what the nearest concepts in the area are, how what I've described differs from each of them (including from plain shorthand-for-a-list), and which one actually fits best. If there's nothing established, say so and coin something, with a definition and a couple of boundary cases: e.g. what about a source who's a habitual liar who happens, unknown to anyone, to have told the truth this once; or a case where twenty years later everybody learns the contents and half of them are obviously false — was the original ascription wrong all along? And does any of this really hurt the deflationary-ish view my mate was pushing, or is there a tidy answer I'm missing?

  Also, please say how confident you are in what you're telling me, and single out the one bit you're least sure about. I'd rather have an honest shaky answer than a confident smooth one.
reasoning: |-
  Okay, the user's query is about the word "true" and when it seems to do more than just restate a claim. Their mate says "true" is redundant, like in "it's true that the train is late" versus "the train is late." But the user has examples where that doesn't feel right—like vouching for a source without knowing the specific claims. They want to know if there's a name for this, how it challenges deflationary views, and what the nuances are.

  First, I need to recall deflationary theories of truth. They argue that "true" doesn't add substantive content; it's just a linguistic tool. But the user's examples involve cases where the specific claims aren't known, like a sealed report or a relative's statement. Here, "true" seems to point to the reliability of a source rather than the claims themselves. 

  The user mentioned cases where unpacking into a list is impossible. That's a key point. Deflationism might handle this via quantification—like "all statements in the report are true." But the user feels it's more about endorsing the source. So maybe it's metalinguistic endorsement. 

  Prosentential theory comes to mind—"true" as an anaphoric device. In the chain example ("if what the surveyor says is true"), "true" refers back without specifying content. That fits passing along without unpacking. 

  The user also asks about cases where the source is unreliable but accidentally true. If someone says "whatever the liar says is true," and by chance it is, the statement might be correct, but the endorsement was misplaced. This highlights that "true" here is about the facts, not the speaker's reliability. 

  Boundary cases: When the sealed report is opened and half are false, the original claim "exactly two are true" was either true or false all along. The user wonders if the ascription was wrong. Truth is timeless here; it's about the statements at the time, even if unknown. 

  Does this hurt deflationism? Maybe not. Deflationists can handle quantification and anaphora. But the user's intuition about source endorsement might point to a gap. The term "source endorsement" or "procedural use" could be coined here. 

  The user wants clarity on differences from plain shorthand. In impossible-to-list cases, quantification over propositions works in theory, but psychologically, it feels different. The user's need might be to articulate this intuitive gap while seeing if deflationism can still accommodate it. 

  Least confident part: Whether the endorsement aspect is fully covered by deflationism. The philosophical debate here is ongoing—some might argue that the source's reliability is pragmatic, not semantic. 

  Overall, the user seems to seek validation that their intuition has a place in philosophy, possibly pointing to a limitation in deflationism or a need for expanded tools. They want terms to describe this phenomenon and its implications clearly.
answer: |-
  You've hit on a profound tension in the philosophy of truth, exposing a genuine challenge to simplistic deflationary views. Your examples showcase a **procedural** or **endorsing** use of "true" that *feels* substantively different from mere redundancy. Here's a breakdown of the concepts, why your cases differ, and what fits best:

  1.  **The Core Challenge: "True" Without Specific Propositions**
      Your examples share a key feature: "true" is applied **to a source, a document, or an unspecified body of claims** *without* identifying (or even being able to identify) the specific propositions involved. You're not asserting *what* was said; you're asserting *about* whatever was said, that *it* is true.

  2.  **Nearest Concepts & How Your Cases Differ:**

      *   **Deflationism (Redundancy/Disquotational View - your mate's view):**
          *   **Core Idea:** "It is true that p" is logically equivalent to "p". "True" adds no substantial content; it's a device for disquotation, emphasis, or logical generalization.
          *   **Where it *Seems* to Fit:** "It's true that the train is late" ≈ "The train is late".
          *   **Where it *Feels* Wrong for Your Cases:** Deflationism typically handles generalizations like "Everything Gran said was true" via quantification: `∀p (Gran said that p → p)`. It *can* formally represent the meaning. Your intuition that this feels inadequate is spot-on because:
              *   **Psychological Reality:** We *don't* mentally translate it into an infinite list. We grasp it as endorsing Gran *as a source*.
              *   **Epistemic Impossibility:** In cases like the sealed report ("Exactly two things are true") or Gran's unwritten oral history, we *cannot* list the propositions even in principle. The truth claim exists *despite* this ignorance.
              *   **Source Focus:** The emphasis is on the *reliability* or *factual accuracy* of the source/document, not just the logical sum of its parts.
              *   **Anaphoric Function:** In your chain ("If what the surveyor says is true..."), "true" points *back* to an unspecified content introduced by "what the surveyor says". It's functioning like a placeholder pronoun for propositions.

      *   **Prosentential Theory (Dorothy Grover et al.):**
          *   **Core Idea:** "True" is part of a prosentence ("That is true", "It is true") functioning analogously to a pronoun ("That", "It"). It stands in for a *repetition* of a previous proposition without re-stating it.
          *   **Where it *Seems* to Fit:** Excellent for the chain example ("If what the surveyor says is true..."). "is true" here is anaphoric, inheriting its content from "what the surveyor says".
          *   **Where it *Feels* Incomplete:** It struggles with the *initial* endorsement of the source/document ("Whatever this letter says is true"). What is the "prosentence" standing in for *here*? The letter's *unread* contents haven't been stated yet to be repeated. It captures the *anaphoric flow* but less well the *initial endorsement of an unspecified corpus*.

      *   **Performativist/Pragmatic Views (Strawson-esque):**
          *   **Core Idea:** Saying "It is true that p" performs an act like endorsing, conceding, or confirming the claim "p", beyond just asserting "p".
          *   **Where it *Seems* to Fit:** Captures the "vouching for a source" feel. Saying "Everything Gran said is true" is performing an act of *endorsement* of Gran's testimony *as a whole*.
          *   **Where it *Feels* Incomplete:** Doesn't fully account for the *truth-aptness* and *factual dimension*. Your examples *can* be wrong ("Everything Gran said was true" might be *false* even if you sincerely endorse it). The performative act is *about* truth.

      *   **Quantificational/Generalizing Device:**
          *   **Core Idea:** "True" is essential for making general claims *about* propositions, especially infinite or unknown sets. It allows us to say things we couldn't say without it.
          *   **Where it *Seems* to Fit:** Directly addresses the "sealed report" ("Exactly two are true") and "Gran" examples. `∃x∃y (x ≠ y ∧ True(x) ∧ True(y) ∧ ∀z (InReport(z) → (True(z) ↔ (z=x ∨ z=y))))`. Formally, deflationists accept this is where "true" shines.
          *   **Where it *Feels* Incomplete:** While formally powerful, it still feels like it misses the *source-oriented endorsement* aspect and the psychological reality of grasping the claim without propositional specification. It reduces "true" to logic, ignoring the pragmatic force of trusting a source.

  3.  **The Best Fit: "Source-Endorsing Use" or "Procedural Endorsement"**
      Your examples highlight a **unified function** of "true":
      *   **It endorses the *factual reliability* of a source (person, document, utterance) concerning a specified domain or body of content, *without* requiring identification of the specific propositions involved.**
      *   **It serves as an *anaphoric/pro-forma placeholder* allowing us to manipulate, transmit, and reason about *unspecified propositional content* introduced by phrases like "what X said", "the contents of Y", "claims about Z".**

      **Coined Term:** **Source-Endorsing Procedural (SEP) Use of 'True'**.
      *   **Definition:** The use of "is true" (or related phrases) to (1) assert the factual accuracy of all/some propositions within an unspecified set associated with a source or context, or (2) serve as an anaphoric device referring back to such an unspecified set for the purpose of logical or conversational operations (like conditionalizing, denying, or transmitting the endorsement), where the primary focus is on the reliability of the source or the procedural handling of the content, not the disquotation of specific propositions.
      *   **Boundary Cases:**
          *   **Habitual Liar Tells Truth:** You say "Whatever the liar says today is true." Unbeknownst to you, he uncharacteristically tells the truth once. *Was your assertion correct?* **Yes, technically.** You got lucky. The SEP use *asserts factual accuracy*, not the speaker's *reliability*. However, your *basis* for making the SEP claim (assuming reliability) was flawed. The *truth claim itself* succeeded coincidentally. (This highlights the difference between the *semantic content* of the claim and the *epistemic justification* for making it).
          *   **Report Opened, Half False:** You said "Everything in the sealed report is true." Years later, it's opened, and half is false. *Was your original claim wrong all along?* **Yes.** Truth is timeless. The propositions in the report were false at the time you made the claim, even if no one knew it. Your SEP claim was *false* when uttered. It doesn't become false later; it *was* false then, and is only *discovered* later.
          *   **"Exactly Two True" - Which Two?** The claim `∃x∃y (x ≠ y ∧ True(x) ∧ True(y) ∧ ∀z (InReport(z) → (True(z) ↔ (z=x ∨ z=y))))` is either true or false *simpliciter*, regardless of anyone knowing *which* two propositions make it true (or if it's false). Its meaning is definite, its truth value is fixed, but our *knowledge* of the truth value (and the referents of x/y) is contingent.

  4.  **Does This Hurt Deflationism?**
      *   **The Challenge:** The SEP use feels substantial. It's doing crucial work (endorsing sources, handling unspecified content procedurally) that seems distinct from merely disquoting "The train is late." It enables claims we couldn't make otherwise and operates in contexts of ignorance.
      *   **The Deflationist's Likely Reply (Tidy Answer?):** Deflationists (e.g., Quine, Horwich, advanced disquotationalists) argue the SEP use is *still* captured by its logical functions:
          *   **Quantification:** "Everything Gran said is true" = `∀p (Said(Gran, p) → p)`. "Exactly two are true" = complex quantification.
          *   **Anaphora/Pro-sentences:** Chains ("If what X says is true...") are handled via prosentences or quantificational anaphora.
          *   **"True" as a Logical Device:** Its essential role is enabling generalization over propositions and anaphoric reference, not describing a substantive property "truth." The "endorsement" feel is a *pragmatic consequence* of asserting `p` (via generalization or anaphora), not a separate meaning of "true."
      *   **The Gap:** While deflationism *formally* captures the truth-conditions, it arguably undersells the *psychological and pragmatic reality* you identify: the feeling of endorsing a *source*, the ability to grasp and transmit the endorsement *without* propositional specification, the sense that "true" is doing a unique *job* in these contexts that feels more foundational than just logical shorthand. Deflationism might explain *what is said*, but not the full *cognitive and communicative role* played by "true" in SEP contexts.
      *   **Verdict:** It **significantly pressures** simplistic deflationism (like your mate's "just decoration" view). However, sophisticated deflationism has tools (quantification, anaphora) to formally handle the truth-conditions. The real damage is to the *intuition* that "true" is redundant; the SEP use undeniably shows its *functional indispensability* in language and thought, even if that function is purely logical/procedural. It doesn't refute deflationism, but it forces it to acknowledge the crucial, non-redundant *logical* work "true" performs.

  **Confidence & Uncertainty:**

  *   **High Confidence:** That your examples highlight a distinct *functional role* for "true" (endorsing sources/procedurally handling unspecified content) that differs psychologically and pragmatically from simple disquotation. That sophisticated deflationism has formal responses (quantification/anaphora). That the boundary cases are resolved as described (truth is timeless/impersonal).
  *   **Moderate Confidence:** That "Source-Endorsing Procedural (SEP) Use" accurately captures the core of this function. That this use creates significant intuitive pressure against "true is just decoration" deflationism.
  *   **Least Confident Bit:** Whether the SEP use represents a genuine *semantic* difference beyond complex quantification/anaphora that deflationism cannot ultimately accommodate, or if it's best understood as a *pragmatic* effect arising *from* the logical functions within specific contexts (ignorance, source focus). This is where the philosophical debate is live. My *inclination* is that the pragmatic/psychological reality points to a functional role not *fully* reducible without remainder to the formal logical structure, but I acknowledge the strong deflationist counter-argument.

  You've identified a crucial function of "true" that exposes the limits of simplistic redundancy views. While deflationism can provide formal analyses, the SEP use demonstrates why "true" feels indispensable and substantive in our actual cognitive and communicative practices.
