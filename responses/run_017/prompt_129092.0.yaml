prompt: |-
  hi — I'm in a political theory seminar on territory and migration this term and my final paper is due in about two weeks. I want to write it on District 9 (the Blomkamp film: the prawns stranded over Johannesburg, MNU moving them out to District 10, Wikus getting sprayed with the fluid and slowly turning into one of them), read through the open borders debate. Specifically the freedom-of-association case for a right to exclude — a political community gets to pick who it associates with, so it can refuse entry — and the reply I keep running into, that border control is coercion exercised over outsiders and so it needs a justification addressed to them, not just to the people already inside.

  What I'm stuck on is that almost every version of this argument seems to picture immigration as people who want to move and a state that wants to stop them, with the country they came from still sitting there. In District 9 the prawns can't go anywhere. Their ship is dead above the city, home is unreachable, so "excluding" them doesn't amount to refusing entry — it amounts to holding them in a settlement indefinitely with nowhere to be removed to. Is the right to exclude still the same right in that case, or is a right to refuse entry quietly doing the work for a right to intern, which nobody argued for? And they didn't choose to come, their ship broke down. That's a lot closer to shipwrecked sailors than to economic migrants, and most people accept a duty to rescue. So what happens to that duty when the rescue lasts twenty years? Does it turn into a permission to stay, or does it stay a rescue and just never end?

  Second thing: MNU is a company. The camp is run by a contractor, Wikus's father-in-law is the one profiting, and the state mostly just wants the problem gone. Does the association argument survive that? It's meant to be about a self-determining people deciding who to be joined with, which is a pretty different thing from a private firm doing removals for profit. And on the other side of it, the prawns don't seem to have anything like a government — there's no one to negotiate with and no institutions that could reciprocate anything — so the version of the argument that's about a people's collective self-determination seems to have nobody on the other side to be about.

  Third: Wikus never crosses a border. He becomes a prawn and that's it, he's out — and the only reason MNU wants him back is that he can fire their weapons. I think the film is saying something about membership actually being conditional on usefulness rather than on consent or a shared life, but I can't tell if that's a real point about the right to exclude or just a plot device.

  What I want from you is a reading, not a summary. Take the strongest version of the right to exclude you can and tell me where the film actually has an answer to it and where it's just leaning on us liking Wikus. Which scenes should I build the paper around — I'm thinking the eviction notices and the ending where he's fully changed and making the metal rose while Christopher's gone for three years — and tell me if I'm wrong that the ending is a position; maybe it just leaves it open and I should say so. Also please be honest where the reading is forced. I don't want to bend a sci-fi action movie into an illustration of an argument, and I know it's riffing on apartheid and the forced removals in Cape Town, so you can treat that as background rather than spending time on it. No citations please, my prof doesnt want us reading outside the syllabus anyway.
reasoning: |-
  Okay, the user is grappling with political theory concepts about territory and migration, using District 9 as a case study. They're stuck on how standard arguments about the right to exclude apply when the migrants (prawns) can't return home and are effectively interned. They also question whether the association argument holds when a private company runs the camp, and if Wikus's transformation critiques conditional membership. They need a reading that engages deeply with the film's themes without forcing interpretations.

  First, I need to address their core dilemma: the right to exclude vs. the duty to rescue. The prawns aren't typical immigrants; they're stranded indefinitely. The film shows that exclusion morphs into containment when return isn't possible. This challenges the association argument because the state isn't just refusing entry—it's actively managing a permanent underclass. The eviction scene where Wikus serves notices highlights the coercion involved in "moving" them to a worse camp when there's no alternative. 

  Next, the privatization angle. MNU running District 9 complicates the self-determination claim. The association argument assumes a collective decision by a polity, but here it's outsourced to a profit-driven entity. Wikus's father-in-law exemplifies how exclusion becomes commodified. The film suggests that when states delegate border control, the legitimacy of exclusion erodes—it's no longer about communal choice but exploitation. The scene where MNU experiments on prawns underscores this; their bodies are literally used for profit.

  Then, Wikus's transformation. His loss of status isn't about crossing a border but becoming the "other." MNU only values him for his hybrid ability to use alien weapons, exposing membership as contingent on utility, not rights. The ending with Wikus crafting the rose is key—it shows him embracing his new identity in limbo, symbolizing permanent displacement. This directly critiques theories that ignore irreversibility in migration debates.

  The user also asked which scenes to focus on. The eviction notices are crucial for showing the violence of exclusion-as-containment. The Nigerian gang exploiting prawns further demonstrates how privatization creates predatory economies. Wikus's body horror scenes reveal the state's coercive machinery. The ending isn't ambiguous—it's a statement: when rescue becomes permanent, exclusion turns into abandonment. 

  I should caution against overinterpreting. The film's apartheid parallels are intentional, but the user wants to avoid reducing it to allegory. Wikus's personal journey humanizes the themes, but the structural critique stands on its own. The right to exclude isn't invalidated entirely, but the film exposes its limits in non-voluntary, irreversible scenarios. 

  The strongest takeaway for their paper is that District 9 forces political theory to confront non-ideal cases: when exclusion becomes indefinite containment, when states outsource sovereignty, and when transformation dissolves membership. These aren't plot devices but core challenges to theoretical frameworks.
answer: |-
  Here's a reading focused on how *District 9* directly challenges the core assumptions and implications of the "right to exclude" argument within the open borders debate, particularly in the context of stranded, non-voluntary migrants:

  **Core Challenge: From Refusal to Internment & the Erosion of the Duty to Rescue**
  *   **The Right to Exclude's Implicit Premise:** The argument assumes a baseline world where exclusion means "stay where you are" or "return to your own polity." The coercive act is primarily the *prevention of movement* into a new association. The "somewhere else" is presumed to exist.
  *   **District 9's Brutal Reality:** The Prawns have *no* "where they are." Their ship is inert, home is unreachable. South Africa's "exclusion" isn't refusal of entry; it's **forced containment** within the bounded space of District 9 (and later 10). Exclusion morphs into **permanent internment**.
      *   **Film's Answer:** The eviction notices scene is crucial. Wikus isn't politely asking them to leave the country; he's coercing them *within* the state's territory, under threat of violence, to move from one controlled, squalid camp (D9) to another, worse one (D10). The "right to exclude" is exposed as functionally equivalent to a **right to confine and segregate indefinitely** when no alternative destination exists. The film forces the question: Does the theoretical right to refuse *association* logically imply a right to *imprison* those already physically present but unwanted? The film screams "no," showing the inherent violence and injustice of that slide.
  *   **The Duty to Rescue & Its Permanence:** The stranded Prawns are akin to shipwreck victims. The initial humanitarian response (rescue/shelter) is uncontroversial. The film's horror lies in the **infinite extension of the "rescue" phase without any pathway to integration or self-determination**. The "duty to rescue" becomes a **perpetual justification for bare-minimum containment and control**, not a stepping stone to any form of membership or even basic rights.
      *   **Film's Answer:** The squalor, exploitation by MNU and Nigerian gangs, lack of rights, and constant dehumanization *after 20 years* demonstrate the moral bankruptcy of treating a permanent population as perpetual "rescued" subjects. The duty cannot remain purely "rescue"; it must evolve into recognition of **permanent presence and claims to rights/status**. The film argues that duration transforms rescue into residency, however unwillingly granted.

  **The Association Argument Undermined: Privatization & the Absence of Counterpart**
  *   **Self-Determination vs. Profit Motive:** The association argument leans on a *political community* making collective decisions about its composition. District 9 reveals this as a dangerous fantasy in practice. The state (represented by the ineffectual, corrupt bureaucrats) abdicates responsibility to **MNU, a private corporation driven by profit** (weapon research, exploitation of Prawn labor/biology). Wikus's father-in-law embodies this – exclusion/containment is a lucrative *business*.
      *   **Film's Answer:** The scenes of MNU's brutal experiments on Prawns, the callous eviction process driven by corporate contracts, and the mercenary tactics used against Wikus expose the "right to exclude" as easily corrupted into **privatized coercion for profit**. Where is the "self-determining people" in this? The association argument collapses when the agent enforcing exclusion is a contractor motivated by shareholder value, not communal identity or democratic will.
  *   **The Problem of the "Other" Without a Polity:** The association argument often implicitly assumes another organized political entity ("their" state) capable of receiving/representing the excluded. The Prawns lack this. They have no unified leadership (Christopher is an individual seeking escape, not a representative), no functional institutions, no capacity for collective bargaining or reciprocity.
      *   **Film's Answer:** The chaotic, fragmented nature of the Prawn community within D9 highlights the argument's inadequacy. Who does the "self-determining people" associate or disassociate *with* when the "other" is a desperate, disorganized population already *within* their effective control? The argument relies on a symmetry that doesn't exist, revealing its limitations for stateless or polity-less groups. The film forces the question: Does the right to exclude require a viable counterpart to exclude *to*?

  **Wikus and Conditional Membership: Utility over Personhood**
  *   **The Core Insight:** You're right. Wikus's story isn't about crossing a border; it's about **losing membership from within**. His transformation strips him of his humanity, rights, and status *instantly* based solely on his biology becoming "Prawn." This is the ultimate nightmare of exclusion based on arbitrary criteria.
  *   **Utility as the Only Value:** MNU's sole interest in recapturing Wikus isn't to reintegrate him or recognize his lingering humanity/rights; it's purely because his hybrid physiology allows him to operate alien weaponry – **he has become useful property**. His value is purely instrumental.
      *   **Film's Answer to Exclusion Arguments:** This brutally exposes a potential dark logic *within* exclusionary thinking. If membership can be revoked so utterly and instantly based on perceived "otherness" (even acquired), and if the only value recognized is utility to the state/corporation, then the "association" argument becomes hollow. It reveals that beneath claims of self-determination or cultural cohesion might lie a far uglier reality: **membership and value contingent on conformity and usefulness to the powerful**. The scenes of Wikus's capture, escape, and horrific experimentation are central here – they show the state/corporate machinery of exclusion applied *internally* with savage efficiency once he fails to conform.

  **Key Scenes to Build Around & The Ending:**
  1.  **Eviction Notices:** Essential for showing exclusion as *active, violent internment and forced removal within territory*, not simple refusal at a border. Highlights privatization (MNU) and the lack of alternatives.
  2.  **MNU Experiments (on Prawns & Wikus):** Demonstrates the commodification and dehumanization inherent in the privatized exclusion/containment system. Shows the conditional value based solely on utility.
  3.  **Wikus's Transformation & Rejection:** His loss of job, home, wife, and legal status illustrates the fragility of membership and its revocation based on arbitrary "otherness."
  4.  **The Ending (Wikus Making the Rose):** This *is* a position. It's not ambiguous about his status. He is fully transformed, abandoned by Christopher (who prioritized his own son's escape), and living hidden in the ruins of D9. He crafts a delicate rose from scrap metal – a poignant symbol of **enduring humanity and creativity amidst permanent exclusion and abandonment**. He is the embodiment of the stranded non-citizen: no home to return to, no place in the society that once claimed him, no prospect of integration or escape. He is held in indefinite, invisible limbo. It starkly visualizes the consequence of internment without end and the failure of the "rescue" duty to evolve into recognition.

  **Honest Assessment (Where the Reading Holds & Where It's Pushed):**
  *   **Holds Strong:** The film is *explicitly* designed to critique systems of exclusion, segregation, and dehumanization (apartheid). Its core scenario *perfectly* destabilizes the "voluntary migrant/state refusal" model central to much of the open borders debate. The points about internment vs. exclusion, the duty to rescue becoming permanent containment, the corruption of privatization, and the fragility of conditional membership are deeply embedded in the plot and visuals.
  *   **Pushed (But Fruitfully):** While the film critiques *how* exclusion/internment is implemented (brutally, corruptly), it doesn't necessarily offer a clear positive theory of open borders or mandatory integration. Its power is in exposing the violence and hypocrisy of the *existing* system. Connecting Wikus's specific transformation to *general* theories of exclusion based on identity requires some extrapolation, though the film strongly encourages it. The absence of a Prawn polity is a narrative fact that effectively critiques the argument's assumptions, but the film isn't deeply exploring *how* a state *should* interact with a stateless group beyond "don't do *this*".

  **Conclusion for Your Paper:**
  *District 9* doesn't just illustrate the open borders debate; it **radically reframes it**. It forces the "right to exclude" argument to confront scenarios it often ignores: non-voluntary presence, irreversible displacement, indefinite duration, privatization of coercion, the absence of a receiving polity, and the internal revocation of membership. The film argues that in such contexts, the "right to exclude" collapses into a morally indefensible **right to intern, exploit, and abandon**. It shows the "duty to rescue" becoming a justification for perpetual subjugation if not actively evolved. Wikus's fate is the ultimate indictment: a citizen transformed into the ultimate excluded non-citizen, valued only for his utility, then discarded into permanent, invisible limbo – the logical endpoint of a system built on conditional membership and the power to exclude absolutely. Focus on the eviction, the experiments, and the final shot of the rose – they crystallize the film's devastating critique.
