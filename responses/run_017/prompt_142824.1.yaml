prompt: |-
  bit of an odd one, and sorry if this is the wrong place for it. I somehow ended up on the committee of a very small local heritage society — we put up plaques, run one open afternoon a year, that sort of thing — and I keep walking into the same strange configuration and I don't have a word for it. First case: our village has a story that the clock on the old town hall was paid for by a subscription from the mill workers, and every year at the open afternoon somebody tells that story while we all stand under the clock. About fifteen years ago a retired accountant went through the council minutes and the subscription list, and it turns out the money came from a single mill owner, and the workers actually petitioned *against* the clock because they wanted the money for the sick fund. Everyone on the committee now knows this. Nobody thinks the minutes are forged. And still the story gets told every year, and when I gently suggested last summer that we adjust the wording, the reaction wasn't "but the minutes are wrong" — it was closer to panic, and the thing that actually got said out loud was "well then there's no point doing the clock at all". And, sure enough, we've more or less stopped doing the clock. Second case: the next valley over has a story about the 1968 flood, that the valley authority opened the sluices without warning them, which the authority's own logs say it didn't. They never use that story to make claims about 1968. They use it every time the authority proposes anything now: it is the thing that entitles them to say they've never cared about us and to refuse to take up their seat on the joint board. Individually they'll concede the logs are probably right. But correcting them doesn't get you to "the logs are right and the authority still doesn't care about us" — it gets you to nobody saying anything at all, and the seat sitting empty.

  So the pattern I think I'm seeing: a shared story about the past that (a) isn't really *believed*, in the sense that nobody will stake anything on it as evidence about what happened, but (b) isn't a legend or a lie either, because it doesn't seem to be trying to be believed, (c) does real work in the present — it's what licenses a stance, a grievance, a bit of local standing, a refusal to cooperate — and (d) can't be *corrected*, only deleted: put the accurate version in its place and the practice around it collapses instead of being updated by it. A friend said "that's just collective memory", which feels both true and useless — it just says that groups remember things, and it doesn't touch the part where the story survives being known to be false and dies when something true is substituted for it.

  Is there an established concept for this exact thing? And please don't just hand me a label, I want the carving. How is it different from an ordinary false belief that a group happens to share, from a myth people take literally, from straight propaganda or a useful lie somebody knowingly tells, and from nothing more than outdated history nobody has got round to fixing? I suspect it's none of those but sits close to several of them, and I'd want to be told which is nearest and exactly where it comes apart. I also want the edges: is it still the same thing if nobody has ever actually checked the record? If the story turns out to be true? If the stance it licenses could perfectly well be defended from the accurate record, but nobody bothers to re-derive it that way once the story goes? If people, when challenged, insist the story is literally true — does that push it back into being a plain false belief, or is that insistence itself part of the phenomenon? And one more thing, since this is what the arguments here actually turn on: if a story like this isn't in the business of stating facts about the past at all, does it even make sense to ask whether the record or the memory should give way, or is that the wrong question to be asking? If there genuinely is no term for it, I'd rather get a coined one with a definition and a couple of boundary cases than a name I can't actually use.
reasoning: |-
  Okay, the user has presented a fascinating sociological puzzle about shared community stories that persist despite being known to be historically inaccurate. Let me unpack this carefully.

  First, I need to understand the core pattern described: these stories aren't believed as factual accounts, yet they're not mere lies either. They serve important social functions - justifying grievances, maintaining identity, enabling collective action. Crucially, correcting them doesn't update the narrative but destroys the associated practices entirely. 

  Hmm, the user's frustration with "collective memory" as an answer makes sense - that term is too broad. I recall similar concepts in anthropology and sociology: Malinowski's myth-as-charter, Bourdieu's doxa, Vygotsky's cultural tools. But none fit perfectly. The key differentiators seem to be: (1) conscious non-literal usage despite accessibility of facts, (2) functional rather than explanatory purpose, (3) irreplaceability when contradicted.

  Interesting how this differs from adjacent concepts. Unlike propaganda, there's no manipulator; unlike false beliefs, the fiction is semi-acknowledged; unlike outdated history, correction is actively resisted. The insistence on literal truth when challenged might actually reinforce the phenomenon - it's a defensive ritual preserving social cohesion.

  The user's boundary questions are sharp. If the story were true, it would just be history. If no one checked records, it might drift toward myth. The key insight is that these stories aren't about the past at all - they're social tools operating in the present. Asking "which version is correct" fundamentally misunderstands their purpose.

  For terminology, "social charter" feels closest to what they need - emphasizing the constitutive function. But I should also acknowledge the performative aspect through Goffman's frame analysis. The coinage "social charter" with clear boundaries might serve them better than imperfect existing terms.

  The user's committee context matters - they need practical understanding, not just theory. I should emphasize that confronting such stories requires recognizing their social utility first. Maybe suggest they observe what community behaviors the story enables, rather than fixating on historical accuracy.
answer: |-
  What you're describing is a profound and well-observed phenomenon, far more than "just collective memory." It occupies a distinct conceptual space. The closest established concept is **myth as social charter** (drawing on Malinowski's anthropology), but it needs careful carving to fit your cases. Let's dissect it:

  ### Core Concept: **Functional Social Fiction (or "Operative Charter")**
  1.  **Not Primarily About Historical Truth:** Its purpose isn't to accurately represent the past *for the sake of the past*. Accuracy is irrelevant to its core function.
  2.  **Licenses Present Action/Identity:** Its *raison d'être* is to legitimize, enable, or sustain a current social stance, grievance, relationship, identity, or practice within the group ("we stand under the clock," "we distrust the authority," "we have this shared ritual").
  3.  **Semi-Detached from Literal Belief:** The group holds it in a state of **pragmatic suspension of disbelief**. They may *know* it's historically shaky or demonstrably false, but they actively *choose* not to interrogate it in the context of its function. Challenging its *factuality* feels like attacking the *purpose* it serves.
  4.  **Non-Substitutable:** This is the critical feature you identified. It cannot be "updated" with correct facts because the correct facts **do not serve the same social function**. The corrected version lacks the specific emotional resonance, symbolic weight, or narrative structure needed to license the current practice or stance. The fiction is the *only key* that fits that particular lock. Remove the fiction, and the lock (the practice/stance) becomes unusable; the group doesn't build a new key from the facts.
  5.  **Collectively Sustained:** It requires group complicity. Individuals might privately doubt, but publicly, they uphold the fiction because they understand its operational necessity for the group's cohesion or objectives.

  ### Carving the Differences
  *   **Ordinary False Belief:** Held as factually true. Evidence *can* potentially correct it (though confirmation bias resists). Its persistence isn't primarily about licensing a specific present action/stance (e.g., believing a local hill is man-made might be wrong, but doesn't *do* much socially).
  *   **Literal Myth/Religion:** Believed to be fundamentally *true* on a metaphysical or sacred level. Its power often derives from this perceived truth. Correcting it challenges core identity/faith.
  *   **Propaganda/Useful Lie:** Knowingly fabricated *by someone* to manipulate others. There's an originator and a target audience. Your cases lack a manipulator; the group *co-creates* and *co-sustains* the fiction for its own internal use.
  *   **Outdated History:** Simply incorrect due to lack of updated information. Once corrected, the narrative *can* and *should* be updated. The social function (e.g., commemorating an event) usually survives or adapts to the new facts.
  *   **Collective Memory (broad sense):** The *umbrella* under which this sits, but your phenomenon is a specific *type* – one where memory is functionally decoupled from historical verification and tightly coupled to present social action, surviving *despite* known inaccuracy.

  ### Your Boundary Cases & Edges
  *   **Nobody Has Checked the Record:** This pushes it closer to **potential myth** or **unexamined tradition**. The *possibility* of verification might exist, but the lack of challenge allows the functional role to dominate. It becomes your phenomenon the moment the *known* inaccuracy is acknowledged but the story persists functionally.
  *   **The Story Turns Out to Be True:** Then it's simply **accurate history serving a social function**. The functional aspect exists, but the core tension (persisting *despite* known falsehood) vanishes. It was always true, so the question of "correction collapsing the practice" doesn't apply.
  *   **The Stance *Could* Be Defended with Facts, But Isn't:** This is **highly characteristic**. The group doesn't *want* to derive the stance from the complex, potentially ambiguous historical record. The fiction provides a **crisp, emotionally resonant, easily communicable justification**. Re-deriving it from facts feels like unnecessary work and loses the narrative power. The fiction is the efficient, "good enough" tool.
  *   **People Insist It's Literally True When Challenged:** This **doesn't necessarily push it back to ordinary false belief**; it can be a **defensive ritual reinforcing the social charter**. The insistence is less about factual conviction and more about protecting the *function* and *group solidarity* against an external threat. It signals: "This story is foundational to *who we are* and *how we operate*; challenging it is an attack on us." The *act* of insisting becomes part of upholding the operational fiction.
  *   **Should Record or Memory Give Way?:** This is **fundamentally the wrong question**. Asking it assumes both are competing for the same goal (representing the past). They aren't. The record aims for historical accuracy. The "memory" (functional fiction) aims for present social cohesion/action. **The tension arises when you try to force the social tool to be something it's not (a factual account) or try to replace the social tool with a factual account that doesn't perform the same job.** The question should be: "What social need does this fiction fulfill, and is there a *different* way (perhaps incorporating the facts) to fulfill that need without relying on a known falsehood?" Sometimes the answer is "no," and the fiction persists or the practice dies.

  ### Nearest Concepts & Where They Part Ways
  1.  **Malinowski's "Myth as Social Charter":** Very close. Malinowski argued myths (in Trobriand society) weren't explanations but "charters" justifying present social institutions, customs, and land rights. **Where it parts:** Malinowski's myths were often *believed* sacred truths; your cases involve conscious or semi-conscious *non-belief* in the literal history while maintaining the charter function. It's a **secular, pragmatic social charter**.
  2.  **Bourdieu's "Doxa":** The unquestioned, taken-for-granted beliefs underpinning a social order. **Where it parts:** Doxa is usually *unconscious*. Your groups are often *aware* the story is shaky but *choose* its utility over factual rigor. It's closer to **practical doxa** – knowingly upheld for functional reasons.
  3.  **Vygotsky's "Cultural Tools":** Stories as tools for mediating social action. **Where it parts:** Vygotsky focused on cognitive development; your focus is on maintaining group stances and practices. It highlights the *tool-like* nature perfectly.
  4.  **Goffman's "Interaction Ritual"/"Frame":** The shared story provides a **frame** that defines the situation (e.g., "we are commemorating worker solidarity," "we are victims of authority neglect") and enables the ritual (standing under the clock, boycotting the board). **Where it parts:** Goffman is more micro-level; your cases show how these frames persist *despite* factual challenges because they are structurally necessary for the group's macro-level stance.

  ### Proposed Term & Definition
  **Operative Social Charter:** A collectively sustained narrative about the past, consciously or semi-consciously decoupled from strict historical verification, whose primary function is to legitimize, enable, or sustain a specific present-day social stance, practice, identity, or relationship within a group. It persists despite known inaccuracies because it serves a unique operational need; substituting the accurate history typically collapses the associated practice rather than updating it, as the facts fail to fulfill the same social function.

  **Why it works:**
  *   "Operative": Emphasizes its present-day function and action-enabling role.
  *   "Social Charter": Clearly links to Malinowski, conveying its legitimizing power for group norms/actions, while "social" broadens it beyond sacred myths.
  *   It captures the key elements: collective, functional, decoupled from truth-as-accuracy, licensing action, resistant to factual substitution.

  This phenomenon is a testament to how groups use narrative not just to remember, but to *do*. It's the story as a necessary social tool, where the tool's utility outweighs its fidelity to the raw materials of history. Your challenge isn't correcting history; it's understanding the social machinery the story powers and whether that machinery can run on a different fuel.
