prompt: |-
  A colleague in policy work sent me the following argument against Chesterton's fence, and I cannot locate the break, though I am fairly sure there is one.

  (1) Chesterton's fence: do not remove an inherited institution until you can say what it was put up for.
  (2) The usual Burkean backing for that rule: a long-surviving institution has been tested in ways no individual reasoner can reconstruct, so it carries tacit knowledge, and the burden of proof falls on whoever would change it.
  (3) But the test in (2) is only survival over time, and the selection pressure on institutions is nearly nil. Institutions are not competed away for being bad; they persist through inertia, sunk costs, coordination lock-in, and the interests of whoever they benefit. A useless fence and a load-bearing one survive at similar rates.
  (4) So survival is no evidence of fitness: the status quo carries no epistemic presumption, and the Burkean asymmetry in (2) is unsupported.
  (5) If there is no epistemic asymmetry, there is no reason to prefer Chesterton's caution to any other decision rule; proposals to abolish should be assessed bottom-up, by expected consequences, exactly as a rationalist planner would assess them.
  (6) Yet (5) is something a Burkean can reasonably reject, and not because survival is evidence. Call it the deletion asymmetry: abolishing an institution you do not understand destroys information you cannot recover, whereas retaining it is reversible, since you can abolish it later once you have learned what it does. Caution can therefore be warranted on decision-theoretic grounds even if the status quo has no epistemic credit at all.
  (7) If (6) is right, the argument breaks somewhere between (3) and (5).

  Which step do you reject, and what does rejecting it cost? I want a diagnosis, not the verdict that premise (3) is too strong. Two things I especially want priced. First: if the deletion asymmetry in (6) is all the conservative has left, does it really deliver Burkean conservatism, or only an instrumental caution about irreversible acts, with none of Burke's distrust of abstract planning? It is worth remembering that for Burke conservatism was a doctrine about how to change, not a refusal to change. Second: is the move from (2)'s tested through (3)'s survived to (4)'s fit doing any work it should not? If I have to choose which claim to keep, I would rather keep (3) than keep (6) as a defense of Burke, but tell me what that costs me.

  Answer in prose, then append a JSON object with exactly these fields:

  - "diagnosis_step": the step or inference you reject, named by number (for example, "3 to 4")
  - "flaw_type": one of "equivocation", "scope_shift", "invalid_inference", "false_premise", "other"
  - "why_it_looked_fine": one sentence
  - "price_paid": one or two sentences on what the conservative, or the reformer, gives up by rejecting it
  - "survival_is_evidence": one of "no", "weak but non-zero", "substantial"
  - "deletion_asymmetry_enough": one of "yes", "only for a weaker thesis", "no"
  - "surviving_thesis": one sentence stating the strongest claim about institutional caution that survives your diagnosis
  - "runner_up": the step you would reject instead if forced to choose differently
reasoning: |-
  Hmm, the user presents a sophisticated critique of Chesterton's fence and Burkean conservatism, centered on institutional evolution. They've clearly mapped the logical steps of an anti-conservative argument and want me to identify the flaw while pricing two specific tradeoffs. 

  The core tension lies between step 3's claim that institutional survival lacks selection pressure and step 6's deletion asymmetry defense. I notice the user is particularly invested in whether survival can ever signal fitness (questioning the jump from 2 to 4) and whether decision-theoretic caution can replicate Burke's substantive distrust of planning. Their phrasing suggests they suspect step 3 overreaches but worry conceding this weakens the reformist position.

  Breaking down the logic chain: Step 3's "selection pressure nearly nil" seems empirically shaky upon reflection. While institutions aren't subject to biological selection, they do face political/fiscal constraints - failed states collapse, unpopular policies get repealed. The inference to step 4 treats "fitness" as binary when institutional value exists on a spectrum; even flawed institutions may provide coordination benefits. 

  Rejecting step 3→4 preserves the possibility that survival carries weak evidence - enough to justify epistemic humility without absolutism. This costs reformers the clean-slate assumption but doesn't forbid change, merely demands contextual understanding first. Crucially, it keeps deletion asymmetry as supplementary rather than the sole foundation, maintaining Burke's skepticism toward abstract planning.

  If forced to choose differently, step 6→7 could be the runner-up - deletion asymmetry alone can't replicate Burkean substance, merely justify reversibility concerns. But that would leave conservatism without its distinctive epistemic critique of rationalism. Better to preserve the survival-fitness link weakly than reduce caution to mere risk-aversion.

  The user's anxiety about "pricing" suggests they need this for real policy debates. My diagnosis must balance philosophical rigor with practical applicability - hence emphasizing that weak survival evidence still shifts burden of proof without freezing reform.
answer: |-
  Here is the diagnosis, followed by the requested JSON:

  The flaw occurs in the inference **from (3) to (4)**. Premise (3) correctly states that survival alone, under conditions of weak selection pressure, is insufficient evidence to prove an institution is *optimally fit* or serves a vital purpose ("load-bearing"). However, (4) incorrectly concludes that survival provides *"no evidence of fitness"* and that the status quo carries *"no epistemic presumption" whatsoever*. This is an overreach.

  **Why it looked fine:** It seems intuitive that if bad institutions survive as easily as good ones due to inertia, then survival tells us nothing about quality.

  **Price paid:** By rejecting this inference, the conservative gives up the claim that an institution's mere survival proves it is *necessary, optimal, or even net-beneficial* (strong "fitness"). The reformer gives up the clean-slate assumption that survival provides *zero* reason for caution, forcing them to engage with the institution's *actual context and history* rather than dismissing it outright as obviously inert. Reform requires positive evidence of harm or uselessness, not just the absence of proof of vital function.

  **Answering the specific pricing questions:**

  1.  **Deletion asymmetry alone:** It delivers only an instrumental caution about irreversible acts ("only for a weaker thesis"). It justifies *delay for understanding* before deletion, but it does *not* inherently justify Burke's deep distrust of abstract rationalist planning *itself* or his preference for organic, incremental change rooted in tradition. A pure deletion-asymmetry conservative might still support sweeping, rationally planned reforms *as long as* they are fully reversible or implemented only after exhaustive study – a stance Burke would likely reject.
  2.  **Survival as evidence:** Survival provides **weak but non-zero** evidence. While (3) correctly argues it doesn't prove *strong* fitness (optimality, vital necessity), it *does* provide evidence of *minimal functionality* or *tolerable cost*, especially for institutions surviving across diverse contexts or over very long periods. An institution that consistently fails catastrophically *does* tend to be selected against (eventually), even if mediocre or mildly harmful ones persist. Survival shifts the burden of proof slightly towards the reformer, requiring them to demonstrate harm or uselessness, but doesn't require proving vital necessity to retain it.

  **Surviving thesis:** The strongest surviving claim about institutional caution is: **The survival of an institution provides weak evidence that it serves some function or imposes tolerable costs within its context, shifting a modest burden of proof onto reformers to demonstrate its harm or uselessness before abolition, further bolstered by the decision-theoretic caution inherent in the irreversible deletion of potentially functional/complex systems.**

  **Runner-up:** If forced to choose differently, reject the inference **from (6) to (7)**. While (6) (deletion asymmetry) provides *a* reason for caution, it is insufficient to support the *full Burkean* asymmetry in (2) which relies on tacit knowledge and the *epistemic weight* of tradition. Conceding (3) to (4) and relying solely on (6) reduces conservatism to risk-aversion about deletion, losing Burke's core argument about the inherent *wisdom* embedded in inherited institutions and the *limitations* of individual reason.

