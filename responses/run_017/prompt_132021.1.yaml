prompt: |-
  I'm drafting a paper on accounts that treat phenomenal consciousness as a user illusion — an interface a cognitive system presents to itself rather than a property things literally have — and I want the specification before I start comparing the accounts. Write the desiderata any such account must meet in order to be usable as a working hypothesis in an empirical research program: one with which a researcher could return a verdict, however hedged, on whether a given system has experiences (a patient emerging from general anesthesia, a split-brain subject, a non-human animal, a large language model), and which says what kind of evidence could bear on that question at all.

  For each requirement give the case or consideration behind it, and mark whether it is non-negotiable or a preference of one camp. At minimum: what the account owes the illusion-for-whom regress, given that an illusion normally needs someone it appears to; the difference between denying the property and denying the judgment, and the regress that opens if the judgment is demoted to illusion as well; the obligation to explain the specific structure of the appearance — ineffability, immediacy, apparent intrinsicness — rather than gesturing at cognitive simplification; the asymmetry between a graphical interface, which simplifies something real, and the claim that nothing of the relevant kind is there to be simplified; the degraded and partial cases (blindsight, dreams, the apparent richness of the visual field, a system whose reports are produced by a confabulating reporter with no access to the processes it reports on); and the apparent causal role of experience in learning and deliberation.

  Flag any pair of desiderata you suspect cannot be jointly satisfied, and say which single requirement excludes the most candidate views. Close with a one-line scorecard, at most, for illusionism, realist representationalism, and one further family of your choosing.
reasoning: |-
  Okay, the user is drafting a paper on phenomenal consciousness as a user illusion and needs a set of criteria that such accounts must meet for empirical research. Let me start by understanding their main request. They want desiderata that any illusionist theory must satisfy to be useful in empirical studies, allowing researchers to evaluate whether systems like patients, animals, or AI have experiences. They also want each requirement tied to a specific case and marked as non-negotiable or a preference. Plus, they mention several key issues: the illusion-for-whom regress, denying property vs judgment, explaining structural features, the interface analogy, degraded cases, and causal roles.

  First, I need to address the illusion-for-whom problem. If consciousness is an illusion, who is it an illusion for? This seems central because if the illusion is presented to some subsystem, that might lead to an infinite regress. The user probably wants this resolved to avoid circularity. Non-negotiable because it's foundational.

  Next, distinguishing between denying the property (no phenomenal properties exist) and denying the judgment (we're mistaken about them). If the judgment itself is an illusion, that might cause another regress. This is crucial for clarity in what the theory denies. Also non-negotiable.

  Explaining structural features like ineffability and immediacy. Illusionists can't just say it's a simplification; they need to account for why it feels that way. Cases like blindsight and partial awareness highlight the need for specifics on how the illusion operates in different scenarios. Non-negotiable to avoid hand-waving.

  The interface analogy: real interfaces simplify something existing, but illusionism claims there's nothing to simplify. So they must explain how the appearance arises without a substrate. Key for coherence. Non-negotiable.

  Degraded cases are important test beds. How does illusionism handle blindsight or dreams where consciousness is altered? Theories need to predict these variations. Non-negotiable for empirical applicability.

  Causal role of experience in learning and behavior. If consciousness is illusory, why does it seem causally effective? Illusionists must reconcile this with cognitive processes. Probably non-negotiable to address functional aspects.

  Now, tensions: the illusion-for-whom and structural features requirements might conflict. Explaining who the illusion is for without invoking a homunculus while accounting for qualitative feels is tricky. Also, causal efficacy vs illusion might clash if the illusion is epiphenomenal.

  The most exclusionary requirement is likely the illusion-for-whom. Many theories struggle to avoid regress without positing a homunculus.

  For the scorecard: Illusionism meets many but struggles with structural features and causal roles. Realist representationalism handles structure and causation but not the illusion aspect. Eliminativism avoids illusion but denies empirical tests.

  I should ensure each desideratum is clearly explained with cases, mark negotiability, note tensions, and summarize concisely. The user's deep needs include rigor for empirical research, avoiding theoretical pitfalls, and clarity for comparing theories. They might also want to identify which theories are viable and where each falls short.
answer: |-
  Here is a specification of desiderata for "user illusion" accounts of phenomenal consciousness, designed for empirical adjudication, with justifications and classifications:

  ### Core Desiderata for Empirical Illusionist Accounts

  1.  **Resolve the "Illusion-For-Whom" Regress (Non-Negotiable)**
      *   **Requirement:** The account must specify *to whom or what* the illusion is presented *without* invoking an unexplained homunculus or genuine phenomenal subject, which would restart the regress. It must ground the "user" in non-phenomenal cognitive/computational structures.
      *   **Case/Consideration:** The core challenge of illusionism: if consciousness is an illusion *presented to the system*, what is the nature of the system *experiencing* the illusion? (E.g., Is the "user" a specific functionally defined subsystem? A distributed process?).
      *   **Status:** Non-Negotiable. Failure here renders the core metaphor incoherent for empirical purposes.

  2.  **Distinguish Denying the Property vs. Denying the Judgment (Non-Negotiable)**
      *   **Requirement:** The account must clearly deny the *existence of phenomenal properties* (qualia as intrinsic, non-relational, private properties) while *affirming the reality of judgments/representations* *about* phenomenal properties. It must prevent the "judgment regress" (if the judgment "I have qualia" is also just an illusion, how is *that* illusion presented?).
      *   **Case/Consideration:** Distinguishing "There is no phenomenal redness here" (denying property) from "The system is completely mistaken in its sincere report 'I see phenomenal redness'" (denying judgment). The latter risks infinite regress if the judgment process itself is demoted to illusion. The account must preserve the reality of the cognitive state *reporting* the illusion while denying the content of that report.
      *   **Status:** Non-Negotiable. Essential for clarity on what is illusory and what is real.

  3.  **Explain the Specific Structure of the Appearance (Non-Negotiable)**
      *   **Requirement:** The account must provide a mechanistic/computational explanation for *why* the illusion has its characteristic features (seeming ineffability, immediacy, intrinsicness, subjective presence, qualitative character) rather than merely gesturing at "cognitive simplification" or "useful fiction."
      *   **Case/Consideration:** Why does the "interface" feel like *this* (rich, qualitative, immediate) rather than like, say, knowing you have a stomach ache or recalling a fact? Cases like the apparent richness of the visual field vs. its actual sparseness, or the ineffability of color experiences, demand specific explanations of how the illusion generates these *specific* seeming qualities.
      *   **Status:** Non-Negotiable. Without this, illusionism is merely a label, not an explanation.

  4.  **Address the Interface Analogy Asymmetry (Non-Negotiable)**
      *   **Requirement:** The account must reconcile the standard "user interface" analogy (which simplifies a complex underlying reality) with the illusionist claim that *nothing of the relevant kind* (phenomenal properties) exists underneath to be simplified. It must explain how the "interface" *creates* the *appearance* of a non-existent property.
      *   **Case/Consideration:** A desktop icon simplifies access to real files; a phenomenal redness icon, according to illusionism, doesn't simplify access to real phenomenal redness. How does the cognitive system generate the *misrepresentation* of a property that isn't there?
      *   **Status:** Non-Negotiable. This is the central conceptual burden of illusionism vs. representational realism.

  5.  **Account for Degraded and Partial Cases (Non-Negotiable)**
      *   **Requirement:** The account must predict and explain variations in the strength, completeness, and reportability of the illusion across different states and systems (e.g., blindsight, partial epileptic awareness, dreaming, sedation, aphantasia, systems with confabulating reporters).
      *   **Case/Consideration:** Blindsight: Why is the illusion absent/unreportable for specific stimuli despite behavioral evidence of processing? Dreams: How is the illusion generated internally without external input? Confabulation (e.g., split-brain, certain neuropsychological syndromes): How does the illusion persist when the "reporter" module has poor access to the relevant processes? Apparent richness: Why does the illusion *seem* richer than the underlying processing suggests?
      *   **Status:** Non-Negotiable. Empirical applicability hinges on handling boundary cases.

  6.  **Explain the Apparent Causal Role (Non-Negotiable)**
      *   **Requirement:** The account must explain why it *seems* like phenomenal states play a direct causal role in guiding learning, deliberation, and action, and how this apparent role relates to the actual underlying causal mechanisms (which must be non-phenomenal).
      *   **Case/Consideration:** Learning to avoid pain, deliberating based on how options *feel*, the intuitive link between "seeing red" and stopping at a traffic light. If phenomenal states are illusory, how/why does the illusion seem causally potent? How is the illusion integrated into the cognitive economy such that it appears (to itself) to be doing work? Can't be merely epiphenomenal *to the system*.
      *   **Status:** Non-Negotiable. A core aspect of the phenomenology needing explanation.

  ### Potential Tensions Between Desiderata

  *   **Desideratum 1 (Illusion-For-Whom) & Desideratum 3 (Structure of Appearance):** Defining a non-homuncular "user" that sufficiently grounds the *rich qualitative character* and *subjective presence* captured by Desideratum 3 is extremely challenging. Mechanistic accounts of the "user" (e.g., a specific control or reporting module) often struggle to explain *why* the illusion generated *for* that module has such intense subjective qualities rather than just being propositional information. Satisfying both risks either smuggling in proto-phenomenality or offering an unsatisfyingly thin account of qualia.
  *   **Desideratum 4 (Interface Asymmetry) & Desideratum 6 (Apparent Causal Role):** If the phenomenal property *literally does not exist*, how can its *appearance* be causally integrated so effectively that the system genuinely relies on it (the illusion) for learning and control? Explaining this without implicitly granting the appearance some genuine causal power (beyond the underlying mechanisms) is difficult. It risks either making the illusion epiphenomenal (contradicting its apparent role) or granting it a problematic kind of causal efficacy.

  ### Most Exclusionary Requirement

  **Desideratum 4 (Interface Asymmetry)** is likely the most exclusionary. Many non-illusionist representationalist or functionalist accounts readily satisfy the other desiderata by accepting *some* form of real phenomenal property (even if relational or representational) that the "interface" simplifies/accesses. Illusionism's core commitment – that *nothing phenomenal exists* underneath the appearance – is the unique and hardest burden. Views that posit *any* real substrate that qualitatively resembles the appearance (even partially or relationally) fail this requirement, disqualifying most non-illusionist theories.

  ### One-Line Scorecard

  *   **Illusionism:** Meets Desiderata 1,2,4,5 (in principle); struggles significantly with 3 & 6; faces tensions between 1&3 and 4&6.
  *   **Realist Representationalism:** Struggles/arguably fails Desideratum 4 (posits real phenomenal properties); generally strong on 3, 5, 6; handles 1 & 2 by accepting real phenomenal subjects/properties.
  *   **Eliminativism (Radical):** Trivially "succeeds" on 1,2,4 (denies illusion too); utterly fails 3,5,6 by denying the explanandum itself; empirically inert for adjudicating consciousness.

  This specification provides a rigorous framework for evaluating user-illusion accounts within an empirical research program, highlighting the core challenges and potential fault lines.
