  First, I'll unpack their core purpose: the principle must guide embedded agents who are uncertain about the past, interact with others, receive staged information, and whose actions can influence chances. This rules out principles assuming omniscience or static environments. Neutrality means I can't presuppose chance supervenes on Humean mosaics or requires primitive necessitation.

  Now, examining their material point by point:
  - For measure-zero cases, the principle must avoid forcing zero credence on actual outcomes. It should allow non-zero densities or intervals, perhaps through Popper functions or full conditional probabilities. Regularity seems required, not optional.
  - Action-dependent chances create fixed-point problems. The principle should permit multiple equilibrium credences without demanding uniqueness, since real-world cases like market confidence often have self-sustaining equilibria.
  - Relativized chances require deference to chance *functions* indexed to setups, not absolute chances. The agent can use their self-locating uncertainty to weight these functions.
  - Chance gaps suggest the norm should remain silent when no determinate chance exists, treating this as beyond its scope rather than a flaw.
  - Aggregate knowledge without single-case chances shouldn't be handled by the principle; it's a job for other norms like indifference principles.
  - Undermining tolerance is likely a metaphysical artifact (Humean-specific). Excluding it simplifies the admissibility clause but may limit neutrality.
  - Admissibility must be non-circular. Achievable through historical or informational criteria (e.g., "only past-truths"), though this may exclude legitimate evidence in non-Humean views.

  For the two additional items:
  - Anti-exploitability seems desirable but may conflict with action-dependent cases. Include conditionally.
  - General deference schema is theoretically elegant but risks diluting chance's specificity. Include as optional unification.

  Notable tensions: 
  - Regularity conflicts with undermining tolerance in Humean views. 
  - Non-circular admissibility may force metaphysical commitments.
  - Action-dependence challenges uniqueness demands.

  The most constraining requirement is likely non-circular admissibility, as it forces operational definitions that may exclude valid evidence in some frameworks.

  Scoring three contenders:
  1. Original Principle (PP): Fails measure-zero, action-dependence, and gaps. Strong on relativization but circular admissibility.
  2. Temporalized Principle (NPP): Fixes temporal indexing but still fails measure-zero and gaps. Better admissibility prospects.
  3. Expert Deference: Handles measure-zero through densities and gaps via silence. Struggles with circularity in defining "expertise" and may overgeneralize.

  I'll structure this as prose analysis (≈1200 words) ending with a comparative table. The user cares most about joint unsatisfiability and key exclusions, so I'll emphasize those. Neutrality limitations will appear in admissibility/gaps discussion.
answer: |-
  Here is a specification of desiderata for an adequate chance-credence principle, tailored to your purpose of normatively guiding embedded agents. The requirements are derived from the cases you provided, augmented with critical additions. Neutrality between Humean and non-Humcean metaphysics is maintained where possible, but its limits are noted. Desiderata are framed as what the principle *must deliver* to handle the case robustly, with the core motivation for each.

  ### Core Desiderata from Your Cases
  1.  **Measure-Zero Outcomes:** The principle must avoid prescribing credence zero to every outcome in a continuous partition where one outcome will occur. It must accommodate non-zero credences for outcomes or their infinitesimal neighborhoods. This requires either:  
      - **Restriction:** Applying only to non-singleton events with positive chance.  
      - **Supplementation:** Using probability densities, full conditional probabilities (à la Popper), or a *regularity requirement* (credences match chances for all measurable sets, including intervals).  
      *Motivation:* Forcing credence zero across an exhaustive partition violates probabilistic coherence. Regularity is a *requirement* here, not a taste; without it, the principle fails for continuous chances.

  2.  **Action-Dependent Chances:** The principle must treat chance-credence norms as *equilibrium conditions* when chances depend on credences/actions (e.g., maintenance routines, market stability). It must:  
      - Allow for fixed-point solutions where credence equals chance *given* that credence.  
      - Accept cases with *no equilibrium* or *multiple equilibria* as normatively possible outcomes.  
      *Motivation:* Demanding a unique solution is a *prejudice* from static models. Real embedded agency requires flexibility; the norm should diagnose instability or options, not insist on uniqueness where none exists.

  3.  **Relativized/Self-Locating Chance:** The principle must apply when the agent knows chance *functions* indexed to setups (e.g., "chance in setup A is P_A, in setup B is P_B") but not which setup obtains or where they are located within it. It must:  
      - Defer to the *relevant chance function* given the agent’s self-locating uncertainty.  
      - Require the agent to set credence by *weighting* the known chance functions by their credence in being in each setup.  
      *Motivation:* Deference targets the *chance conditional on the setup*, not an unrelativized chance. The agent’s ignorance is about indexing, not chance itself.

  4.  **Chance Gaps:** The principle must *remain silent* when no determinate chance exists at the time of deliberation (e.g., only a chance of later acquiring a chance). It should not prescribe credences based on future or potential chances.  
      *Motivation:* Principled silence is a *correct description of scope*. Forcing a verdict misapplies the norm; gaps reflect metaphysical indeterminacy, not normative failure.

  5.  **Aggregate without Single-Case Chance:** The principle *should refuse* to prescribe credences based solely on known frequencies/proportions in a reference class where no single-case chance is indicated.  
      *Motivation:* This is not a case for *chance* deference. The norm governs credence in *objectively chancy* propositions; aggregate data without underlying chance is handled by other norms (e.g., indifference).

  6.  **Undermining:** The principle must *tolerate undermining futures* (where chance assignments are inconsistent with their own truth).  
      *Motivation:* Tolerance is a *genuine desideratum* for neutrality. Rejecting it privileges non-Humean views where undermining is impossible. If dropped, the principle becomes incompatible with Humean accounts, violating your neutrality aim.

  7.  **Non-Circular Admissibility:** The admissibility clause (specifying evidence that does not "screen off" chance) must be definable *independently* of the deference norm itself. It cannot be "evidence such that conditioning on it validates chance-credence deference."  
      - *Achievability:* Possible via criteria like "only historical evidence" or "evidence about events prior to the chance time."  
      - *Cost:* Such definitions may exclude legitimate evidence in non-Humean accounts (e.g., information about laws). Neutrality *cannot be fully maintained* here; non-circularity risks metaphysical bias.

  ### Additional Items: Camp Preference or Requirement?
  8.  **Anti-Exploitability (No Dutch Books across Time):** *Conditionally required.* The principle should ensure a chance-knowing bookie cannot exploit the agent over time *if chances are not action-dependent*. In action-dependent cases, exploitability may be unavoidable due to equilibrium constraints.  
      *Verdict:* Include, but note exceptions. Motivation: Embedded agents face sequential decisions; exploitability indicates dynamic inconsistency.

  9.  **General Deference Schema:** *Optional unification.* The chance-credence norm need not be a special case of a general schema (e.g., deference to experts or future selves). While elegant, this risks diluting chance’s unique epistemic role (e.g., its temporal asymmetry).  
      *Verdict:* Exclude as a core requirement. Motivation: Chance deference is sui generis; forcing it into a general template may distort its normative basis.

  ### Critical Tensions and Key Exclusions
  - **Joint Unsatisfiability:** Two pairs of desiderata conflict:  
    - **Regularity (from 1) + Undermining Tolerance (6):** Regularity demands credences match chances for all events. In Humean undermining futures, the chance of history *including the undermining fact* may be positive, but admitting this as admissible evidence can conflict with deference (Lewis’s "big bad bug"). Resolution requires sacrificing either regularity (via restriction) or full undermining tolerance.  
    - **Non-Circular Admissibility (7) + Neutrality (Implicit):** Defining admissibility non-circularly (e.g., "only past events") excludes non-Humean cases where laws/chances are necessary and thus future information can be admissible. Neutrality is *unachievable* here without circularity.  
    **Result:** The list is inconsistent as stated; compromises must be made on (1), (6), or (7).  
  - **Most Excluding Requirement:** **Non-Circular Admissibility (7)** does the most work in excluding formulations. It forces a substantive, operational definition of "inadmissible evidence," which either precludes neutrality or requires contentious metaphysical assumptions.

  ### Evaluation of Contenders
  *Table 1: Principle Performance Against Desiderata*  

  | **Desideratum**               | **Original Principle (PP):** *cₜ(A | E) = chₜ(A)* if E is admissible | **Temporalized Principle (NPP):** *cₜ(Aₜ₊_ₖ | E) = chₜ(Aₜ₊_ₖ)* | **Chance-as-Expert:** *cₜ(·) = chₜ(· | K)* where K is expert's total info |
  |-------------------------------|-------------------------------------|-----------------------------------|-----------------------------------------|
  | **1. Measure-Zero Outcomes**  | Fails: Forces credence 0 on outcomes | Fails: Same as PP               | **Passes:** Can use expert's densities/conditionals |
  | **2. Action-Dependent Chances** | Fails: Ignores fixed-point dynamics | Fails: Same as PP               | **Partial:** Handles if "expert" includes agent's credences; uniqueness not guaranteed |
  | **3. Relativized Chance**     | Fails: Requires absolute chance     | **Passes:** Chance relativized to t | **Passes:** Expert chance can be indexed to setup |
  | **4. Chance Gaps**            | Fails: Demands a chance value       | Fails: Same as PP               | **Passes:** Silent if expert has no credence |
  | **5. Aggregate Data**         | Fails: Misapplies to non-chances    | **Passes:** Only if no chance    | Fails: Expert must assign probabilities |
  | **6. Undermining Tolerance**  | **Passes:** With admissibility tweaks | **Passes:** Same as PP          | **Passes:** If expert's credences incorporate undermining |
  | **7. Non-Circular Admissibility** | **Fails:** Admissibility defined circularly | **Partial:** "Only t-past" is non-circular but metaphysically loaded | **Fails:** "Expertise" often defined circularly |
  | **8. Anti-Exploitability**    | **Passes:** In non-dynamic cases    | **Passes:** Same as PP          | **Passes:** General expert frameworks avoid Dutch books |
  | **9. General Deference**      | N/A                                 | N/A                             | **Passes (by construction)**            |

  **Summary of Contender Performance:**  
  - **Original Principle (PP):** Fails crucial cases (1,2,4,5,7). Admissibility circularity is fatal for embedded agents.  
  - **Temporalized Principle (NPP):** Solves relativization (3) and improves admissibility prospects (7) but still fails measure-zero (1), action-dependence (2), gaps (4), and aggregates (5).  
  - **Chance-as-Expert:** Best overall: handles (1,2,3,4,6,8,9) well. Key flaw is circularity in defining "expert" (7), risking triviality. Also struggles with aggregates (5) if expertise presupposes chances.  

  ### Conclusion
  For your embedded agent, the principle must prioritize **relativization to setups** (3), **silence on gaps** (4), **rejection of aggregate data** (5), and **action-dependent equilibria** (2). The **measure-zero** (1) and **undermining** (6) cases demand structural adjustments (e.g., densities, tolerance for self-undermining chances). **Non-circular admissibility** (7) is the hardest constraint; it necessitates a choice between neutrality and precision, often favoring a temporal/historical definition. The **Chance-as-Expert** approach performs strongest but must be carefully formulated to avoid circularity. Ultimately, no contender satisfies all desiderata simultaneously due to conflicts between regularity, undermining, and admissibility—highlighting that your list itself reveals a tension at the heart of chance deferral for embedded agents.
