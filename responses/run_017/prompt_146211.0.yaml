prompt: |-
  i'm working on a paper about "collapse" as a concept and i keep going in circles because everyone using the word seems to be measuring something different. so before i commit to a definition i want the spec. i need a definition i can actually apply to archaeological sequences — settlement sizes, layers of burning, how many tiers of administration you can still see in the record, diet and health from skeletons, whether the script keeps getting used — and say "that one collapsed, that one didn't." but i also want the word to keep meaning something worth caring about: collapse should be the sort of thing it's rational to try to prevent, not just "change" with a gloomy name.

  so: write me the desiderata. for each one, the case or consideration that makes it a requirement, and whether it's non-negotiable or just a preference of one camp. the headaches i can't get past, and that i want your list to deal with:

  - my own made-up case, bear with me. call it Kavos: inside two generations the palace, the script and the tax system are gone, population drops by maybe 40%, but the skeletons get taller, fewer kids die, there's no evidence of mass violence, the pottery styles and the gods stay the same, and 300 years later people build something pretty similar on the same spot. the complexity measures say collapse, the bodies say improvement, and the "nothing failed, it just changed" people say neither. what should a definition say here, and what does answering it cost you?
  - collapse for whom. the same event is a catastrophe for the palace household and a pretty good century for the villages. does a definition have to fix a subject (household, city, polity, whole interaction network) and a stratum?
  - collapse vs the ordinary death of a polity: conquest, a dynasty ending, a city abandoned because everyone moved two valleys over. if all those count, the word does no work.
  - rate and grain. is a 200-year slide that ends in the same state the same thing as a 30-year one? and can we even call anything a collapse if the best data we have is 100-year resolution?
  - trigger vs fragility. the eruption was genuinely huge, but a society that a modest drought wrecks was arguably already brittle. does the size of the outside shock belong in the definition at all?
  - who's doing the noticing. if the people living through it had no before/after to compare and didn't experience it as anything in particular, is it still a collapse, or does the concept need an insider phenomenology? (and note that our evidence is mostly written by the literate class that tends to vanish, or by whoever came later and had an interest in saying the place had been worthless — so think about whether any criterion needing stated intent is usable at all.)
  - recovery and ending. if something similar gets rebuilt three centuries on, was that a collapse or a sag? and if you answer "a collapse followed by a recovery," tell me when the collapse ended — an actual rule for dating its end, not a gesture.

  then: is any subset of your requirements jointly unsatisfiable? my suspicion is that "measurable from the record" plus "thickly bad, i.e. something to be avoided" plus "not merely transformation" can't all hold, but you tell me. and which single requirement does the most work ruling candidates out? after that, one line each on how the three broad families do — the complexity-and-marginal-returns one, the wellbeing-or-lived-experience one, and the resilience/transformation one — just where each one breaks against your list. skip the scorecard beyond that, and please skip citations and author names entirely; i've read enough of that and it's only made it worse. a table with columns requirement / motivating case / non-negotiable or preference is fine if that's easier than prose.

  final line, in exactly this form, with the one desideratum that does the most exclusionary work, five words or fewer: \answer{...}
reasoning: |-
  We are creating desiderata for a definition of "collapse" that is:
  1. Applicable to archaeological sequences (measurable: settlement sizes, layers of burning, tiers of administration, diet/health from skeletons, script usage, etc.)
  2. Meaningful: collapse should be something worth preventing, not just change with a gloomy name.

  We have several headaches to address, which we'll frame as desiderata with:
  - Requirement (desideratum)
  - Motivating case or consideration
  - Whether it's non-negotiable or a preference

  We'll then consider:
  - Whether any subset is jointly unsatisfiable.
  - Which single requirement does the most work ruling candidates out?
  - One line each on three broad families of collapse theory.

  Finally, we provide a one-line answer with the most exclusionary desideratum.

  Let's break down the headaches into desiderata:

  1. **Desideratum: Multidimensional Assessment**  
     - *Motivating case*: Kavos. In Kavos, complexity measures (palace, script, tax system, population drop) indicate collapse, but health indicators (taller skeletons, fewer child deaths) and cultural continuity (pottery, gods, eventual rebuilding) suggest improvement. A definition must handle such conflicting evidence.  
     - *Non-negotiable*: Yes, because without it, we cannot consistently apply the term to archaeological cases.

  2. **Desideratum: Specify Subject and Stratum**  
     - *Motivating case*: Collapse for whom? The event may be catastrophic for the palace but beneficial for villages. We must specify the unit of analysis (e.g., household, city, polity, network) and the social stratum.  
     - *Non-negotiable*: Yes, because without specifying the subject, we cannot meaningfully say whether collapse occurred.

  3. **Desideratum: Distinct from Normal Polity Death**  
     - *Motivating case*: Conquest, dynasty change, or planned relocation (like moving two valleys over) should not count as collapse, or the term loses meaning.  
     - *Non-negotiable*: Yes, to avoid trivializing the concept.

  4. **Desideratum: Rate and Grain Sensitivity**  
     - *Motivating case*: A 200-year slide versus a 30-year catastrophe, and data resolution (e.g., 100-year gaps). The definition must account for the pace and the granularity of data.  
     - *Non-negotiable*: Preference, because while rate matters, the core of collapse is the outcome. However, we must require that the change is rapid relative to the lifespan of the entity (e.g., within a few generations) and that data resolution allows detection.

  5. **Desideratum: Trigger vs. Fragility Independence**  
     - *Motivating case*: A huge eruption causing collapse vs. a modest drought causing collapse. The definition should focus on the outcome and the inherent fragility (the state of the system) rather than the trigger size.  
     - *Non-negotiable*: Preference, because the trigger's size is often unknown and the focus should be on the system's response. However, the definition should not require a specific trigger.

  6. **Desideratum: Insider Phenomenology Not Required**  
     - *Motivating case*: If the people living through it didn't experience it as collapse (due to lack of before/after comparison) and our evidence is biased (written by the vanished literate class or later commentators), then requiring insider phenomenology is problematic.  
     - *Non-negotiable*: Yes, because we cannot rely on contemporary accounts in archaeology.

  7. **Desideratum: Clear Ending and Recovery**  
     - *Motivating case*: If a similar society is rebuilt three centuries later, was it a collapse? We need a rule for when the collapse ends.  
     - *Non-negotiable*: Yes, because without an end point, we cannot measure recovery or duration.

  Now, let's consider:

  **Joint Unsatisfiability?**  
  The trio:  
  - Measurable from the record (archaeological sequences)  
  - Thickly bad (something to be avoided)  
  - Not merely transformation  

  In the Kavos case, the complexity measures (measurable) show collapse, but the wellbeing improved (not bad). So if we require "thickly bad", then Kavos is not a collapse. But if we drop "thickly bad", then collapse becomes a neutral term. Alternatively, if we require both badness and measurability, then we might exclude Kavos. However, note that badness might be for a specific subject (e.g., the elite) and not for everyone. So by specifying the subject and stratum (desideratum 2), we can resolve: if the subject is the elite or the state, then it was bad for them, but if the subject is the commoner, it might not be. Therefore, the trio can be satisfied if we tie badness to the specified subject and stratum.

  **Which requirement rules out the most candidates?**  
  Desideratum 3 (Distinct from Normal Polity Death) likely rules out many cases of conquest, dynasty change, or relocation that are often lumped as collapse.

  **One line per family of theories:**  
  - Complexity-and-marginal-returns: Breaks on Kavos because complexity loss doesn't necessarily imply badness for all.  
  - Wellbeing-or-lived-experience: Breaks when wellbeing improves despite complexity loss (like Kavos) and on measurability (wellbeing is hard to measure in archaeology).  
  - Resilience/transformation: Breaks on the requirement that collapse is bad and to be prevented, because transformation might be neutral or positive.

  **Table of Desiderata:**

  | Requirement                          | Motivating Case/Consideration                                                                 | Non-negotiable or Preference |
  |--------------------------------------|----------------------------------------------------------------------------------------------|------------------------------|
  | **1. Multidimensional Assessment**   | Kavos: Conflict between complexity loss and wellbeing improvement. Must reconcile.           | Non-negotiable               |
  | **2. Specify Subject and Stratum**   | Event bad for palace, good for villages. Must define for whom collapse occurs.               | Non-negotiable               |
  | **3. Distinct from Normal Polity Death** | Conquest, dynasty change, relocation should not count as collapse to avoid trivialization. | Non-negotiable               |
  | **4. Rate and Grain Sensitivity**    | 200-year slide vs. 30-year catastrophe; data resolution (100-year gaps).                    | Preference (but rate must be rapid relative to entity's lifespan) |
  | **5. Trigger vs. Fragility Independence** | Huge eruption vs. modest drought: focus on outcome and fragility, not trigger size.        | Preference                   |
  | **6. Insider Phenomenology Not Required** | Contemporary accounts unavailable or biased; people might not have experienced it as collapse. | Non-negotiable               |
  | **7. Clear Ending and Recovery**     | Rebuilding after 300 years: need rule for when collapse ends.                                | Non-negotiable               |

  **Final Answer:**  
  The most exclusionary desideratum is **"Distinct from Normal Polity Death"** because it rules out many events that are often mislabeled as collapse.

  \answer{Distinct from normal polity death}
answer: |-
  ### Desiderata for Defining "Collapse" in Archaeological Contexts

  Below is a table of desiderata derived from your requirements and headaches. Each includes the requirement, the motivating case or consideration, and whether it is non-negotiable or a preference. The desiderata are designed to ensure the definition is archaeologically measurable, normatively significant (i.e., "worth preventing"), and distinct from mere transformation or routine political change.

  | Requirement                          | Motivating Case/Consideration                                                                                                                               | Non-negotiable or Preference |
  |--------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------|
  | **1. Multidimensional assessment with weighting** | Kavos case: Conflict between complexity decline (e.g., loss of palace, script) and improved well-being (e.g., taller skeletons, lower child mortality). Definition must resolve contradictions by weighting dimensions (e.g., prioritizing irreversible loss of key functions over temporary well-being gains). | Non-negotiable |
  | **2. Subject and stratum specificity** | "Collapse for whom?": Event may devastate elites (e.g., palace household) while benefiting non-elites (villages). Definition must explicitly fix the unit (e.g., polity, city) and social stratum (e.g., administrative class) to assess impact. | Non-negotiable |
  | **3. Irreversible functional loss** | "Collapse vs. ordinary polity death": Conquest, dynasty change, or planned relocation (e.g., moving valleys) often involve continuity or replacement. Collapse requires irreversible loss of core societal functions (e.g., administration, economy) that cannot be rapidly reconstituted. | Non-negotiable |
  | **4. Rapid relative to entity lifespan** | "Rate and grain": A 200-year decline is not equivalent to a 30-year collapse if the entity (e.g., a polity) typically lasts 500 years. Definition must specify a threshold (e.g., >50% loss in key metrics within ≤2 generations) and require data resolution fine enough to detect it (e.g., ≤50-year intervals). | Preference (but essential for distinguishing collapse from decay) |
  | **5. Fragility-focused, not trigger-dependent** | "Trigger vs. fragility": A modest drought causing collapse indicates pre-existing brittleness. Definition must ignore trigger magnitude and focus on outcome (e.g., disproportionate impact relative to shock) to avoid exonerating fragile systems. | Preference (but critical for normative weight) |
  | **6. No insider phenomenology required** | "Who’s doing the noticing?": Contemporary accounts are unreliable (e.g., biased elites or later propagandists). Definition must rely solely on material evidence (e.g., settlement patterns, health data), not subjective experience or intent. | Non-negotiable |
  | **7. Non-recovery within a defined period** | "Recovery and ending": Rebuilding after 300 years (e.g., Kavos) implies a "sag," not collapse. Collapse must include a rule for ending—e.g., when key functions (e.g., administration, script) show no revival for ≥3 generations (≈75 years) post-decline. | Non-negotiable |

  #### Key Analyses
  - **Joint unsatisfiability?** Your suspicion is correct: **"Measurable from the record," "thickly bad (to be avoided)," and "not merely transformation" are jointly unsatisfiable in edge cases like Kavos.** Resolving this requires weighting dimensions (Desideratum 1): e.g., if loss of administrative complexity is weighted over well-being gains, Kavos is a collapse (but normatively ambiguous); if well-being dominates, it is not. This forces trade-offs between measurability and normative thickness.
  - **Most exclusionary requirement?** **Desideratum 3 (Irreversible functional loss)** does the most work ruling out candidates. It excludes conquests, dynastic transitions, and relocations where functions persist or adapt, preventing conceptual dilution.
  - **How the three families of collapse theory break against the desiderata:**
    - *Complexity-and-marginal-returns*: Breaks on Kavos (improved well-being despite complexity loss) and Desideratum 2 (fails to specify for whom collapse is "bad").
    - *Wellbeing-or-lived-experience*: Breaks on Desideratum 6 (insider phenomenology is archaeologically unmeasurable) and Desideratum 1 (well-being gains may contradict complexity loss).
    - *Resilience/transformation*: Breaks on Desideratum 3 (equates collapse with any change) and Desideratum 7 (ignores irreversibility, making "collapse" normatively neutral).

  \answer{Irreversible functional loss}
