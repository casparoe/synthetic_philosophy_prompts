prompt: |-
  i sit on my county's heritage commission, and we keep getting cases where what a community remembers and what the archive says don't match. I think our past rulings fit more than one rule and i can't tell wich one we've been running:

  (1) A Black neighborhood's long-held story that the interstate was routed through it on purpose; the engineers' memos show the route was chosen on cost grounds years earlier. We kept the neighborhood's framing on the marker.
  (2) A family's claim that their grandfather invented a farm implement alone; company records list a team of six. We made them change the plaque.
  (3) A village's story of a massacre at a bridge; no massacre in the record, but there was a forced relocation there that same year. We paid for a memorial to the relocation and asked them to stop using the word massacre.
  (4) A tribe's account of where a treaty was signed; the record says elsewhere and nothing settles it. We marked both sites.

  New one: a town has reenacted, every year since 1931, the 1887 night its people dug a stranded train out of a snowdrift, and both the plaque and the schoolkids' script end with "and so the railroad gave us our depot" — that's the story of why the town exists. Our researcher found in the railroad's own ledgers that the depot was already scheduled in 1886, and the stranded-train night looks like it drifted in from a town forty miles away; but payroll records do show locals spent three days digging out a train in 1887. Two wrinkles: state heritage money now requires sites to be "documented," and the reenactment isn't an assertion anyone states out loud — the kids just pull a train with ropes.

  What should we decide if we want to be consistent with ourselves? Which of the four is the closest analog, what principle would we be adopting with each option, and what further case would actually split the rules that fit our record so far?
reasoning: |-
  Okay, let's tackle this heritage commission dilemma. The user is dealing with a recurring conflict between community memory and archival records across multiple cases. They've provided four past rulings and a new case about a town's train rescue reenactment that's foundational to their identity. 

  First, I need to map the patterns in their existing decisions. Case 1 shows they prioritized marginalized community memory over technical records (Black neighborhood vs highway engineers). Case 2 went strictly with documentation against family lore (farm implement invention). Case 3 found a middle ground by acknowledging related trauma while rejecting hyperbolic language (massacre vs relocation). Case 4 embraced ambiguity through dual recognition (treaty signing sites).

  The new case has fascinating layers: the depot timing discrepancy resembles Case 1's factual conflict, but the unspoken nature of the claim (it's performed, not stated) makes it unique. The payroll records partially validate the core event like in Case 3. 

  Hmm... the real challenge is identifying which principle governs when. The commission seems to consider: 1) power dynamics (favoring oppressed groups), 2) verifiability of specific claims, 3) cultural significance versus historical precision. 

  For consistency, Case 3 feels closest - they're dealing with a community narrative that's partially anchored in fact (digging happened) but embellished (depot causation). The solution could mirror that: validate the provable part (digout effort), note the depot scheduling in supplementary materials, and allow the reenactment to continue as cultural tradition rather than historical statement.

  The deeper principle emerging appears to be: "Protect marginalized truths, correct privileged falsehoods, and negotiate community myths when they hold cultural value." To test this, imagine a flipped scenario - say a wealthy family's unverified claim about donating land for a school. That'd likely get Case 2 treatment (strict documentation), splitting from Case 1's approach.
answer: |-
  Based on your commission's past rulings, the **closest analog is Case 3 (the bridge massacre/relocation)**, and **consistency would require a similar negotiated solution** for the train/depot case. Here's the breakdown:

  ### Your Commission's Implicit Principle (Revealed by Patterns)
  **"Acknowledge the core cultural truth when community memory holds significant cultural weight, but correct or reframe specific factual claims contradicted by documentation *unless* those claims involve marginalized groups challenging official narratives."**

  ### Analysis of Past Rulings & the New Case
  | **Case**                 | **Community Claim**             | **Archive Evidence**                     | **Commission Action**                        | **Principle Applied**                                                                 |
  | :----------------------- | :------------------------------ | :--------------------------------------- | :------------------------------------------- | :------------------------------------------------------------------------------------ |
  | **1 (Black Neighborhood)** | Interstate routed intentionally | Route chosen earlier for cost            | **Upheld community framing**                 | **Marginalized group's counter-narrative prioritized over institutional records.**     |
  | **2 (Family Inventor)**  | Sole invention by grandfather   | Team of six in company records           | **Rejected claim, forced correction**        | **Privileged individual/family claim overruled by documented institutional record.** |
  | **3 (Bridge Massacre)**  | Massacre occurred at bridge     | Forced relocation same year, no massacre | **Acknowledged trauma, reframed language**   | **Core trauma validated, specific unverified claim corrected/reframed.**              |
  | **4 (Treaty Site)**      | Specific signing site           | Conflicting records, no resolution       | **Marked both sites**                        | **Ambiguous evidence requires acknowledging multiple truths.**                        |
  | **NEW (Train/Depot)**    | "Digout earned depot" (implied) | Depot scheduled pre-digout; digout happened but misattributed? | **Pending Decision**                         | **Needs alignment with Case 3.**                                                      |

  ### Why Case 3 is the Closest Analog
  1.  **Core Event Validated:** Like the forced relocation validating trauma near the bridge, the payroll records validate the *digout event itself*.
  2.  **Specific Claim Contradicted:** Like "massacre" being unsupported, the claim that the digout *caused the depot* is contradicted by ledgers.
  3.  **Cultural Significance:** Both the bridge story and the depot story are central to community identity and tradition (reenactment, origin myth).
  4.  **Action Required Reframing:** Case 3 didn't erase the story; it acknowledged the underlying truth (trauma) while correcting the specific claim (massacre). Similarly, the depot story needs reframing, not erasure.

  ### Recommended Decision for the Train/Depot Case (Aligning with Case 3)
  1.  **Acknowledge the Valid Core:** The marker/text *must* highlight the documented 1887 community digout effort as a significant event demonstrating resilience.
  2.  **Correct the Specific Claim:** The marker/text must state the depot was planned/scheduled in 1886 (citing railroad ledgers). The phrase "and so the railroad gave us our depot" **cannot stand as historical fact** on official markers/plaques funded by "documented" requirements.
  3.  **Reframe the Narrative:** Frame the digout as a powerful *symbol* of the town's spirit and determination *that coincided with* the arrival of their long-awaited depot (e.g., "The heroic 1887 digout became a lasting symbol of [Town]'s determination, celebrated just as their long-awaited depot arrived, cementing the town's future").
  4.  **Protect the Reenactment:** **Do not stop the reenactment.** Its value is cultural, not strictly historical. The kids pulling a train with ropes depicts the *community effort*, which *did happen*. The implied conclusion ("got the depot") is part of the *cultural tradition*, not a formal historical assertion needing correction at that event. Heritage funds apply to *physical sites/plaques*, not performances.

  ### Principles Adopted with Each Option
  *   **Choosing Case 1 (Black Neighborhood):** You'd be prioritizing the *community's lived experience and counter-narrative* over institutional records, implying a principle focused on **social justice and challenging dominant historical narratives**, especially for marginalized groups. (This doesn't fit the depot case, which lacks a marginalized/power dynamic).
  *   **Choosing Case 2 (Family Inventor):** You'd be prioritizing **strict documented fact over all community tradition/memory**, requiring correction of any unsupported claim. (This would force stopping the reenactment script's implication and plaque text, ignoring the cultural weight).
  *   **Choosing Case 3 (Bridge Massacre):** You'd be adopting the principle of **negotiating between documented fact and cultural significance, validating the core meaning while correcting specific inaccuracies**. (This fits best with your pattern and the depot case).
  *   **Choosing Case 4 (Treaty Site):** You'd be prioritizing **acknowledging ambiguity and multiple perspectives when evidence is genuinely inconclusive**. (The depot evidence *is* conclusive against the causation claim).

  ### Case That Would Split the Rules & Clarify the Principle
  **Scenario:** A historically affluent neighborhood claims their 19th-century community garden was the *first* racially integrated public space in the county, citing oral histories. Archives show it was popular but reveal no evidence of intentional integration policy or significant mixed usage before a documented, less celebrated park elsewhere 5 years later.

  *   **Why it Splits:**
      *   Like Case 1, it involves a claim about social justice (integration) potentially challenging official history.
      *   Like Case 2, it involves a privileged group making a specific, potentially self-aggrandizing claim contradicted by archives.
      *   Like Case 3, it involves a specific claim ("first") vs. a general truth (it *was* used by diverse groups later?).
      *   Ambiguity exists (absence of evidence isn't proof it *didn't* happen casually), like Case 4.
  *   **How Your Commission Rules Reveals the Core Principle:**
      *   **Uphold Claim (aligns with Case 1):** Principle = **Marginalized/counter-narratives prioritized, regardless of claimant's status.** Archives seen as incomplete on lived experience.
      *   **Reject Claim/Correct (aligns with Case 2):** Principle = **Strict documentation rules all specific claims of fact.** Oral history insufficient against institutional silence.
      *   **Reframe (aligns with Case 3):** Principle = **Validate the spirit (diverse usage) but correct the specific "first" claim.** Acknowledge later documented integration elsewhere. (This maintains your pattern).
      *   **Acknowledge Ambiguity/Multiple Sites (aligns with Case 4):** Principle = **Ambiguity requires equal recognition of possibilities.** (Less likely here due to the specific claim vs. archive silence).

  **Your commission's consistent pattern prioritizes cultural meaning for communities *unless* a specific, verifiable claim by a non-marginalized group is demonstrably false by documentation. The depot case aligns perfectly with Case 3: validate the true core event, correct the false specific claim on official markers, protect the cultural tradition, and reframe the narrative.**
