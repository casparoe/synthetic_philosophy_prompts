prompt: |-
  I sit on a panel that has to issue a consensus statement on whether two research groups who have been attacking each other in print for a decade are genuinely contradicting one another, or whether the fight is only over how a central term should be used. The panel's evidence is their published papers and some transcripts: we cannot run experiments on the parties, ask them to imagine cases, or get them to sit still for a semantics seminar. Before I adopt any test for whether such a dispute is verbal rather than substantive, I want the specification — what a test of that kind has to deliver to be adequate for this purpose.

  Write the desiderata: the cases it must handle, the distinctions it must not collapse, and the constraints it must not violate, each with the consideration that makes it a requirement, and each flagged as non-negotiable or as a preference of one side of the debate. Among the cases I specifically want addressed: disputes where the parties agree on every non-linguistic fact yet disagree about which further inferences or counterfactuals the contested term licenses; disputes where the term fixes a cutoff that a statute or a funding rule then has to be applied to real cases; disputes in which both sides quietly shift the term's extension over the course of the exchange, so that there is no stable pair of idiolects to compare; and disputes where one party's aim is to change how the word is used rather than to report how the world is. I also want the test to keep separate the questions whether a dispute is verbal, whether it is worth settling, and whether anyone is at fault for it.

  Two further things. First, tell me which two desiderata you suspect cannot be jointly satisfied, and why — I care most about whether a test can be both usable by non-philosophers working only from texts and neutral between a deflationary and a non-deflationary reading of the disputed claims, but say if the real tension lies elsewhere. Second, name the desideratum you think is actually a prejudice of one camp dressed up as a requirement, say which single requirement rules out the largest share of accounts on offer, and note whether a verdict of *verbal* can be prevented from doing illegitimate first-order metaphysical work. Skip scoring the existing accounts against the list; I will do that myself.
reasoning: |-
  Hmm, the user is on a panel tasked with determining whether a decade-long academic feud between two research groups is substantive or merely verbal. They need a rigorous framework to evaluate this. 

  The user's request is highly specific: they want desiderata for a test that can distinguish verbal disputes from substantive ones, with special attention to tricky cases like cutoff-based disputes, shifting definitions, and terminological reform efforts. They also want clear separation between verbalness, worthiness of resolution, and fault attribution.

  I notice the user is deeply familiar with philosophical nuances - they reference deflationary vs non-deflationary readings and mention preventing metaphysical bias. This suggests they're probably a senior academic, maybe in philosophy of science or a field where terminological disputes are common. Their frustration with the decade-long conflict is palpable between the lines.

  The core challenge here is balancing theoretical rigor with practical constraints. The test must work solely on published texts without active participation from the disputants. That rules out most thought-experiment or interview-based approaches. The neutrality requirement is particularly thorny - any test that presupposes what counts as "substantive" might stack the deck against realist positions.

  For the desiderata, I should organize them by cases, distinctions, and constraints as requested. The four specified cases need special attention:
  - Agreement on facts but not inferences requires a test sensitive to logical commitments
  - Cutoff disputes demand handling of vague terms in regulatory contexts
  - Shifting extensions means the test can't assume stable idiolects
  - Reform intentions highlight pragmatic dimensions beyond truth-conditions

  The tension between usability and neutrality seems fundamental. Non-philosophers need something operationalizable through textual analysis, but avoiding metaphysical presuppositions typically requires the very conceptual tools non-philosophers lack. I suspect this might be the unresolvable tension.

  The most exclusionary requirement is probably the shifting extensions clause - most existing tests (like the method of cases or translation checks) collapse when definitions aren't stable. And we should flag that "verbal" verdicts risk being weaponized if they imply the dispute isn't "real" - hence the need to separate from worthiness.

  The user seems aware of how labeling disputes "verbal" can be dismissive, hence their concern about illegitimate metaphysical work. I'll emphasize that in the desiderata.
answer: |-
  Here is a specification of desiderata for a test to determine if a dispute is verbal (terminological) rather than substantive (factual), tailored to your constraints and cases:

  ### Core Desiderata (Non-Negotiable)
  1. **Case: Agreement on Non-Linguistic Facts, Disagreement on Inferences/Counterfactuals**  
     - *Requirement:* Must distinguish when identical facts are described differently due to divergent inferential rules tied to a term.  
     - *Rationale:* If parties agree on all empirical observations but clash on conclusions (e.g., "This is a *disease* because it licenses intervention X" vs. "No, because it lacks feature Y"), the test must isolate this as terminological.  
     - *Constraint:* Cannot assume shared semantic rules.  

  2. **Case: Cutoff-Dependent Application (Statutes/Funding)**  
     - *Requirement:* Must handle disputes where the core conflict is over threshold criteria (e.g., "severe poverty," "critical habitat") for regulatory decisions.  
     - *Rationale:* In policy contexts, disagreements often reduce to where lines are drawn, not underlying facts.  
     - *Constraint:* Must not conflate value judgments with semantic choices.  

  3. **Case: Shifting Extensions (Unstable Idiolects)**  
     - *Requirement:* Must operate without assuming fixed definitions for the term across the debate.  
     - *Rationale:* Parties often refine or broaden terms tactically; a useful test cannot presuppose semantic stability.  
     - *Constraint:* Avoids requiring a "baseline" definition.  

  4. **Case: Terminological Reform vs. Factual Report**  
     - *Requirement:* Must distinguish disputes where one party aims to *change usage* (e.g., "We should call this ‘trauma’") from those asserting factual errors.  
     - *Rationale:* Motives affect discourse structure (e.g., appeals to consequences vs. evidence).  
     - *Constraint:* Cannot infer intent solely from claims; must use textual patterns.  

  5. **Separation of Dimensions**  
     - *Requirement:* Must decouple:  
       (a) **Verbalness** (terminological divergence),  
       (b) **Worthiness** (practical/scholarly value of resolving it),  
       (c) **Fault** (blame for confusion).  
     - *Rationale:* A verbal dispute may be worth settling (e.g., for policy clarity); fault may lie with unclear prior definitions.  

  ### Critical Distinctions to Preserve  
  6. **Meaning vs. Ontology**  
     - *Requirement:* Must not collapse disputes about *how to define* a concept (e.g., "consciousness") from disputes about *what exists* (e.g., "Do non-human entities have it?").  
     - *Rationale:* Conflating semantics with metaphysics invalidates the test’s purpose.  

  7. **Semantic Indeterminacy vs. Ignorance**  
     - *Requirement:* Must differentiate ambiguity/vagueness in terms from incomplete factual knowledge.  
     - *Rationale:* A dispute may appear verbal due to poor evidence when it is actually empirical.  

  ### Key Constraints  
  8. **Text-Only Evidence**  
     - *Requirement:* Relies solely on published texts/transcripts; no new experiments, interviews, or thought experiments.  
     - *Rationale:* Your panel’s operational limit.  

  9. **Neutrality to Deflationary/Non-Deflationary Views**  
     - *Requirement:* Must not presuppose that the disputed term *does* or *does not* refer to a "real" property (e.g., "race," "intelligence").  
     - *Rationale:* Otherwise, the test biases toward one camp’s metaphysics.  
     - *Flag:* Preference of deflationary camp (non-negotiably imposed by your panel’s need for neutrality).  

  10. **Usability by Non-Philosophers**  
      - *Requirement:* Must be applicable without expertise in formal semantics or metaphysics.  
      - *Rationale:* Panels often include scientists, policymakers, etc.  
      - *Flag:* Preference of applied disciplines.  

  ---

  ### Tensions & Critical Weaknesses  
  - **Unresolvable Tension:** **Usability (D10) vs. Neutrality (D9)**  
    - *Why:* Non-philosophers struggle to apply tests that avoid metaphysical commitments. Neutrality requires nuanced distinctions (e.g., "reference" vs. "concept") that demand philosophical training. Simpler proxies (e.g., "agreement under term swap") often smuggle in deflationary assumptions.  

  - **Most Exclusionary Requirement:** **Shifting Extensions (D3)**  
    - *Why:* Most tests (e.g., Chalmers' "equivalence of verbal disputes") assume stable idiolects. Unstable terms force dynamic analysis of textual evolution, ruling out static comparison methods.  

  - **Questionable Requirement as Prejudice:** **Separation of Verbalness from Worthiness (D5b)**  
    - *Flagged by:* Proponents of substantive disputes.  
    - *Why:* Some argue labeling a dispute "verbal" inherently devalues it (e.g., "just semantics"). This desideratum artificially insulates terminological debates from criticism of their triviality—a bias favoring reformers/pedants.  

  - **Metaphysical Danger:**  
    - A "verbal" verdict **must not imply the dispute lacks ontological stakes** (e.g., "‘Personhood’ is merely verbal" could covertly deny moral status to entities). The test should only diagnose *communication failures*, not answer first-order questions.  

  This framework prioritizes diagnostic rigor over adjudicative convenience. It accepts that some disputes (e.g., rapidly shifting terms) may be indeterminable under your constraints—which is itself a useful outcome.
