prompt: |-
  So I spent about thirty-five years running an analytical chemistry lab — mostly HPLC and sample prep, some method development — retired four years ago, and for the past year or so I've been going to a philosophy reading group at the senior center, which is mostly retirees plus one very patient grad student who runs it. We did a session on knowing how vs. knowing that, and I got asked to write down where I'd actually landed so the others could poke holes in it. I never took a philosophy class in my life, so don't assume I know any of the jargon; plain language please. And one thing about the format: no headings, no bullet points, no bold text, no tables — just continuous prose, the way you'd write an email to someone.

  Here's the set of things I believe, more or less:

  (1) Knowing how to do something is having an ability, not having a stock of true propositions in your head. My evidence is my own hands: I could see a titration endpoint coming before the meter did, and I could tell a column was dying from the shape of the baseline, and I could never have written down what I was responding to even if you'd paid me. Also the reverse: we had a grad student once who could recite the entire separation mechanism from memory and ruined every prep she touched.

  (2) But being told can genuinely be enough. One of my postdocs read our extraction protocol straight through once, never watched anyone do it, and ran it correctly the first time. So testimony can hand you the know-how — and I don't just mean the reading caused her to go practice and get good at it; I mean it was enough right then and there.

  (3) Know-how comes in degrees. You can know how to run an assay better or worse, and that's a real difference in the person, not just a difference in how we happen to describe them.

  (4) Knowing that doesn't come in degrees — you either know that the mobile phase is wrong or you don't. Though I guess people do say things like "she knows that assay inside out," so maybe I'm wrong about this one.

  (5) Know-how survives being totally unable to perform. I'd of said I still know how to run a TLC plate, even though with the tremor in my hands now I couldn't do one to save my life. And I'd say our instrument guy knows how to fix the mass spec even when he's asleep.

  (6) Kids and animals have know-how without know-that. Whatever my cat knows about landing on her feet, it isn't a bunch of propositions.

  (7) Our whole lab knew how to run the old assay, and nobody in the lab knew that step 7 was load-bearing. Step 7 is a twenty-minute wait at four degrees in the middle of the prep, it came from a postdoc who left in the late nineties and left no note, and if you skip it the yield falls off a cliff. Everybody does it, nobody knows why, and we tried dropping it once — disaster.

  (8) Same lab, different case: "does she know how to run it" seems to shift with the conversation. My old tech knows how to run it when we're chatting about who's on the schedule, and doesn't know how to run it when we're deciding who to put on the contaminated batch. I take that to be about where we set the bar, not about anything that changed in her.

  (9) Methodological thing, and maybe the one I care most about: I want an account of know-how that somebody could actually go test. I have very little patience with made-up intuition pumps; I'd rather hear what the motor-control and procedural-memory people have actually found. Show me an experiment.

  So: does that hang together? What I want is an audit, not a lecture. Tell me which of these actually pull against each other, ranked by how badly, and for each real clash say what would have to give and what it would cost me to give it. Be equally straight with me about the ones that only look like clashes — I don't want to drop commitments just because two of them sound odd sitting next to each other. If I'm quietly leaning on something I haven't stated out loud, name it. And if one of my items is doing less work for me than I think it is, say so. Don't send me off to read anything, by the way: I can't get to a university library easily these days, and I'd much rather have your reasoning than a list of names.
reasoning: |-
  Okay, the user is a retired analytical chemistry lab manager with 35 years of experience in HPLC and sample prep. They've been attending a philosophy reading group and were asked to write down their thoughts on knowing how vs. knowing that. They provided nine points based on their experience and want an audit of whether these points hang together coherently.

  The user explicitly states they have no formal philosophy training and wants plain language explanations. They're looking for an audit, not a lecture - meaning they want to know where their ideas conflict, how severe those conflicts are, and what trade-offs would be involved in resolving them.

  Looking at their nine points, several interesting tensions emerge. Point 1 claims know-how isn't propositional knowledge, but point 2 shows testimony can transfer know-how immediately. Point 3 says know-how comes in degrees while point 4 claims know-that doesn't - though they already question point 4 themselves. Point 5 argues know-how survives inability to perform, which connects to point 6 about animals having non-propositional knowledge.

  The lab examples are particularly insightful. Point 7 shows collective know-how without understanding why certain steps work, while point 8 demonstrates how context changes whether we attribute know-how to someone. Point 9 reveals their methodological priority for empirically testable accounts over philosophical thought experiments.

  Notably, they're quietly relying on several unstated assumptions: that abilities can exist without current capacity, that testimony can confer ability directly, and that context determines attribution thresholds. Their points about the tech's shifting know-how and the lab's step 7 ritual suggest they see know-how as fundamentally contextual and communal rather than purely individual.

  The biggest tension is between their anti-propositional stance in points 1/6 and the testimony example in point 2. Resolving this might require distinguishing between the source of know-how and its nature - perhaps testimony provides access to procedural knowledge that then gets embodied as ability. Giving up the pure anti-propositional view would cost less than it seems, since their core concern is really about the embodied, non-verbalizable aspect of expertise.

  Their methodological commitment to testability (point 9) actually supports keeping most positions intact, since embodied cognition research validates many of their observations. The context-dependent attribution in point 8 isn't a problem but rather reflects how we actually evaluate competence in practice.

  Overall, their view hangs together remarkably well for someone without formal training. The conflicts are manageable without surrendering core insights from their decades of lab experience. The audit should validate their practical wisdom while gently suggesting refinements where philosophy might offer useful distinctions.
answer: |-
  Right. Audit format, plain language, continuous prose. Let's get into it.

  First off, your view hangs together better than you might think. Most of your points reinforce each other, and the tensions that do exist are manageable. I'll flag the genuine clashes, the apparent ones that aren't real problems, the unstated things you're leaning on, and where an item might be doing less work. I'll rank the clashes by how much trouble they cause.

  **The Genuine Clash (Moderate Severity): Points 1 & 2 vs. Point 6 (and maybe Point 5)**
  *   **The Clash:** Point 1 says know-how is an ability, *not* a stock of true propositions in your head. Point 6 extends this to animals/kids, saying their know-how definitely isn't propositional. But Point 2 shows testimony (which is purely linguistic/propositional) can *directly* hand you know-how, seemingly bypassing practice or embodied learning. If know-how is fundamentally non-propositional (like the cat's landing), how can purely propositional testimony *confer* it instantly? Point 5 (know-how surviving inability to perform) also leans towards know-how being a stable state *within* you, distinct from momentary capacity, which fits Point 1 but makes the instant transfer via propositions in Point 2 more puzzling.
  *   **What Has to Give?** You have a few options, each with a cost:
      *   **Option 1 (Easier): Soften Point 1/6.** You don't need to abandon them, but you need to allow that *some* know-how *can* be acquired propositionally, even if much of it (like your endpoint sense, the cat's landing) isn't reducible to propositions. The cost? You lose the clean, sharp line that know-how is *never* propositional. It becomes "often not reducible to propositions" rather than "never consists of propositions". This fits your Postdoc (Point 2) – the protocol *told* her what to do, and she understood it well enough to *do* it. The propositions conveyed the steps, and she had the background ability to follow them. Her know-how *started* propositionally that time. This doesn't threaten your core insight about embodied skill (Point 1) – that remains distinct and often primary.
      *   **Option 2 (Harder): Rethink Point 2.** Maybe the postdoc *did* have relevant background know-how (basic lab skills, understanding of terms like "vortex", "centrifuge") that the propositions activated or directed. The testimony didn't create *new* know-how from nothing; it integrated with existing abilities. The cost? This feels a bit like explaining away your clear observation to preserve the purity of Point 1. It undermines the directness you observed ("enough right then and there").
      *   **Why it's Moderate:** It challenges the strongest version of your anti-propositional stance (Points 1 & 6) but doesn't destroy your core case for embodied skill. Option 1 is the most reasonable path without sacrificing much.

  **The Potential Clash (Low Severity): Point 4**
  *   **The Clash (with itself and reality):** You state "Knowing that doesn't come in degrees," then immediately note the common phrase "knows that assay inside out" and doubt yourself. Good instinct. This is mostly an internal tension and a clash with how language works.
  *   **What Has to Give?** Point 4 as stated. We absolutely speak of *degrees* of know-that: "She knows the basics," "He's an expert on Kant," "I know it vaguely." Knowing-that involves *grasp* or *understanding*, not just binary possession. Knowing the mobile phase is wrong *might* be binary (once you grasp the relevant fact), but knowing *why* it's wrong, or *all the implications*, comes in degrees. "Knows that assay inside out" means knowing *many* propositions about it *deeply*.
  *   **The Cost:** Letting go of the "know-that is absolutely binary" idea costs nothing. It actually helps you. It means both know-how *and* know-that admit of degrees, just *different kinds* of degrees (skill proficiency vs. depth/breadth of understanding). Your observation (Point 3) that know-how comes in degrees remains strong. This isn't a clash with your other points, just a minor self-correction.

  **Apparent Clashes That Aren't Real Problems:**

  1.  **Points 1 & 5 (Ability vs. Surviving Inability):** This seems like a clash: How can know-how be an *ability* if you can have it while unable to perform (tremor, asleep)? But it's not a real problem. We readily distinguish *having an ability* from *being able to exercise it right now*. You have the ability to speak English even when asleep. The tremor prevents you from *exercising* your TLC ability; it doesn't mean the *knowledge of how* is gone. Point 5 reinforces that know-how is a *state* you're in (the possession of the ability), not the constant activation of it. This fits Point 1 fine.
  2.  **Point 7 (Collective Know-How Without Know-Why) vs. Anything:** This doesn't clash. It perfectly illustrates that know-how (executing the procedure correctly) can exist independently of know-that (understanding *why* step 7 is crucial). It highlights the practical nature of know-how and its potential separation from explicit justification. It strengthens your case against a *simple* reduction of know-how to know-that.
  3.  **Point 8 (Context Shifting the Bar) vs. Point 3 (Degrees):** Point 8 isn't a clash; it's an *explanation* of Point 3 in social/practical terms. We attribute "knows how" based on whether someone meets the level of skill *required for the current purpose*. When chatting about scheduling, basic competence suffices ("knows how"). When assigning a critical, contaminated batch, only high proficiency counts ("doesn't know how" well *enough for this*). This *is* know-how coming in degrees (Point 3), viewed through the lens of practical necessity. It doesn't mean her actual skill changed; it means the threshold for attribution did. This is a feature, not a bug, of your view.

  **What You're Leaning On (Quietly):**

  1.  **Know-how as a State/Possession:** You clearly think of know-how as something you *have* (an ability, a capacity), not just something you *do* momentarily. This underpins Points 3 (degrees of possession), 5 (possession survives inability to act), and 8 (the underlying possession is constant, attribution shifts).
  2.  **Know-how as Fundamentally Practical:** Your core evidence is action and performance (Point 1, Point 7, Point 2's outcome). Even when acquired via testimony (propositions), the proof is in the *doing*.
  3.  **Context Matters (Pragmatism):** Point 8 explicitly shows this, but it's implicit elsewhere. What counts as "knowing how" depends on the stakes (contaminated batch vs. schedule chat). Your methodological Point 9 also leans towards a pragmatic view of knowledge – what can be *shown* to work.
  4.  **Embodiment is Central (but not Exclusive):** Points 1 and 6 strongly emphasize the non-verbal, embodied, sensory-motor aspect of much know-how. This is a core commitment. Point 2 shows it's not the *only* source, but it's primary for you.

  **Where an Item Might Be Doing Less Work:**

  *   **Point 6 (Kids/Animals):** While vivid and supporting the non-propositional nature of *some* know-how, it's not adding a fundamentally *new* argument beyond what Point 1 (your own embodied skill) already establishes powerfully. Point 1 is your strongest evidence for non-propositional know-how. Point 6 extends the domain but doesn't introduce a new logical point. It's illustrative, not foundational for your overall structure. You could make your case without it, though it's a good example.

  **Methodological Point (Point 9) - The Anchor:**
  This is crucial and actually *supports* keeping most of your view intact. Your insistence on testability and impatience with pure intuition pumps is a strength here. Cognitive science (motor control, procedural memory, expertise studies, situated cognition) strongly supports:
  *   The existence of non-propositional, embodied skill (Point 1, 6).
  *   Skill acquisition involving both explicit instruction and implicit learning (fitting Point 2 without denying Point 1).
  *   Skills existing as neural dispositions even when not executed (Point 5).
  *   Expertise involving degrees of automaticity and fluency (Point 3).
  *   The context-dependence of performance and judgment (Point 8).

  Experiments on expert intuition (like your endpoint sense), the development of automaticity, the dissociation between knowing-how and verbalizing-how (like your lab with Step 7), and the effects of different learning methods all validate the phenomena you describe. Your view is empirically plausible.

  **The Bottom Line:**

  Your view is coherent and empirically grounded. The main tension is between the strong non-propositional claim (Points 1 & 6) and the direct transfer via testimony (Point 2). **The most sensible resolution (minimal cost, keeps core intact) is to soften Points 1 & 6 slightly:** allow that *some* know-how *can* be acquired directly through propositions, especially when it builds on existing abilities, while maintaining that the deepest, most embodied forms of expertise (like yours) are *not* reducible to propositions. This satisfies Point 2 without abandoning your core insight. Ditch the strict binary view of know-that (Point 4) – it gains you nothing and contradicts common sense. Points 3, 5, 7, 8, and 9 work well together and support the overall picture. Point 9, in particular, is a strength, not a problem. You're leaning on a practical, ability-focused, context-sensitive view of know-how, which is a robust position. The audit says: Hold the line on embodied skill, accept that propositions *can* sometimes convey know-how directly, drop the know-that binary, and keep the rest – it hangs together fine.
