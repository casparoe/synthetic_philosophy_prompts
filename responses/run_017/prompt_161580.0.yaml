prompt: |-
  I've been arguing with my brother about when "better safe than sorry" is actually a reason to do something, and I've noticed I don't apply it the same way twice. Here's where I land, going by gut:

  - The town found traces of an industrial solvent in the water. One weak study in rats given way higher doses hinted at kidney damage, nothing either way in humans. I think switching to the far-off reservoir was right even though it cost a fortune.
  - Keeping a math tutor app out of my kid's classroom, because nobody's proven it's harmless and it might mess with their attention spans, while the upside is just slightly better test scores: fine with me.
  - Refusing the normal childhood vaccines over a possible long-term effect nobody has shown: not fine.

  Those last two have, as far as I can tell, the same shape — unverified possible harm to kids from something new — and I go opposite ways on them, and I can't say why.

  - My brother won't fly and drives 400 miles instead, because a plane crash feels worse. I think that's silly, but I can't say why without just saying "the numbers" — isn't the whole point of this kind of thinking that you *don't* have numbers?
  - Gene-drive mosquitoes that could wipe out malaria where my aunt lives, with unknown effects on everything that eats mosquitoes: I want more study before releasing them, even though I know people are dying of malaria right now. Next to the water one I feel like a hypocrite.
  - Keeping my kid home from a sleepover because of a vague bad feeling about the parents and no actual evidence: not fine, that's just me being anxious.

  The one I go back and forth on: our village sits under a glacial lake. Engineers say it might burst and it might not. We can spend everything now digging a drainage channel, or wait three years for the survey that would actually tell us how unstable it is. Digging means we never find out, and the next valley with the same problem learns nothing from us. Waiting means we might not be here. I lean toward digging and I feel bad about both halves of that.

  Is there one rule that gets all of this, or am I stuck with two that clash? If you've got one, I also want to know what it says about a version of the village where the channel itself has a small chance of setting the collapse off, and about a case you make up yourself.

  Please lay it out like this: "The rule" (about 200 words) — stated plainly, no jargon, with the bit of mine that motivates each part of it; "Where I'm wrong" (about 100 words) — which of my calls it flips; "Cases I didn't give you" (about 150 words) — the risky-channel version of the village, my flying brother if the rule has anything to say about him, and one of your own; "The runner-up" (about 100 words) — the other rule you'd keep in play and what swallowing it would cost me.
reasoning: |-
  Okay, the user is struggling with applying the "better safe than sorry" principle consistently across different scenarios. They've listed several personal examples where their gut reactions seem contradictory, especially around risks to children, technological interventions, and environmental dangers. 

  First, I notice their core tension: they want a single unifying rule but suspect there might be two clashing principles at play. The examples reveal emotional undercurrents—parental protectiveness in the tutor/vaccine contrast, visceral fear in the flying/driving case, and moral conflict in the glacial lake dilemma. 

  Hmm... their brother's position highlights how subjective risk perception distorts rational calculation. The malaria mosquitoes vs tainted water cases expose another layer: willingness to accept known deaths (malaria) vs unknown chemical risks, which feels inconsistent but actually hinges on agency—choosing intervention vs reacting to existing threat.

  The glacial lake scenario is particularly nuanced because it introduces second-order consequences (depriving other villages of data). Adding the risky-channel variant would test whether the aversion is to action or inaction—a crucial distinction.

  For the rule itself, I'm considering a three-part framework: severity, probability, and moral agency. The examples support this—vaccines have microscopic risk but proven benefit, while the tutor's unproven harm lacks offsetting value. The risky-channel twist would fall under "action risk" in my framework.

  The runner-up rule should be something like strict precautionary principle to contrast with the main rule's nuance. It'd flip their vaccine stance, showing why they intuitively reject absolutism. 

  Cases section needs to resolve their brother's flight fear—here the rule clarifies that "feeling worse" isn't severity but probability misjudgment. My invented case (maternal screening) mirrors their vaccine logic but with higher stakes to test consistency.
answer: |-
  Here's a breakdown based on your examples, aiming for a single rule:

  **The Rule (Approx. 200 words):**

  "Better safe than sorry" justifies precaution **only when**:
  1.  **The potential harm is severe and irreversible:** Death, permanent disability, ecological collapse (like the glacial lake burst, industrial solvent *potential*, malaria deaths). Minor annoyances (like slightly worse test scores) don't trigger it. *Motivated by:* Glacial lake, industrial solvent, malaria mosquitoes.
  2.  **The probability of harm, while uncertain, is plausible and non-negligible based on available evidence:** Not vague hunches or disproven fears. It requires *some* credible signal, even if weak (like the rat study, engineers' warnings about the lake, malaria's *known* deadliness vs. gene-drive unknowns). *Motivated by:* Industrial solvent (rat study), glacial lake (engineers), rejecting pure hunches (sleepover, vaccine refusal).
  3.  **The cost/risk of the precaution itself is proportionate and reasonable:** Avoiding the action shouldn't impose greater harm or unacceptable burden than the potential risk it avoids. Draining the town's coffers *might* be proportionate for the lake; refusing proven vaccines is not, as the cost (disease risk) vastly outweighs the unproven vaccine risk. *Motivated by:* Vaccine refusal (cost too high), malaria mosquitoes (cost of delay is death), tutor app (cost of precaution - losing potential benefit - seems reasonable vs. unproven harm).

  **Where I'm Wrong (Approx. 100 words):**

  The rule flips two of your calls:
  1.  **Math Tutor App:** The *potential harm* (messing with attention spans) isn't clearly *severe/irreversible* (it's speculative and likely fixable). The *cost* of precaution (denying potential educational benefit) might be disproportionate to the vague, unproven risk. Precaution seems less justified here.
  2.  **Gene-Drive Mosquitoes:** The *potential harm* (ecological disruption) *is* severe/irreversible. The *probability* is unknown but plausible. However, the *cost of precaution* (delay) is known severe harm (malaria deaths). The rule demands weighing this massive known cost against the unknown risk, making indefinite delay harder to justify than your stance. Precaution requires stronger evidence *of specific, probable harm* to outweigh the known cost of delay.

  **Cases I Didn't Give You (Approx. 150 words):**

  1.  **Risky-Channel Village:** The rule still justifies digging *if* the severe harm (burst) is deemed plausible enough. However, the *cost/risk of the precaution itself* (channel triggering collapse) becomes a major factor. If that risk is also plausible and severe, it significantly weakens the case for digging now vs. waiting, as the precaution might *cause* the very harm it seeks to prevent. The balance tips towards waiting for the survey unless the collapse risk is *imminently* high.
  2.  **Flying Brother:** His fear violates point 2. The *probability* of a plane crash causing severe harm is *known* to be astronomically low compared to the known, higher risks (including severe injury/death) of a 400-mile drive. His precaution (driving) likely imposes *greater* net risk.
  3.  **My Case: Maternal Cancer Screening:** A test has a 1% chance of causing a fatal complication but catches 95% of a rare, always-fatal cancer in time for cure. Rule: Severe harm is possible from both action (test) and inaction (cancer). Probability of harm from test (1%) is known and low; probability of harm without test (if cancer is present) is near 100%. The *cost of precaution* (not testing) is likely death. Precaution (not testing) isn't justified; the test is.

  **The Runner-Up (Approx. 100 words):**

  **The Strict Precautionary Principle:** "If an action has a *suspected* risk of causing severe harm, lack of scientific certainty shall not be used to postpone cost-effective measures to prevent harm." This flips several of your calls:
  *   **Vaccines:** Refusal *is* justified (suspected risk, lack of 100% long-term certainty).
  *   **Tutor App:** Keeping it out *is* justified (suspected risk to attention).
  *   **Gene-Drive Mosquitoes:** Indefinite delay *is* justified (suspected ecological risk).
  *   **Risky-Channel:** *Not* digging might be justified (suspected risk *from* the precaution).
  **Swallowing it costs you:** Embracing proven technologies with immense net benefit (vaccines), potentially beneficial innovations (tutor app, gene-drive), and forces action based on mere suspicion, ignoring probability and proportionality. It leads to paralysis and missed opportunities to reduce known harms.
