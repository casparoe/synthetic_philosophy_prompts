  We are looking for a concept that captures the "wage" — the felt earnedness or deservedness of a pleasure, distinct from its pleasantness, enjoyment, value judgment, or achievement value. The wage is present in the experience itself, not just in its aftereffects, and it may even be present in unpleasant experiences that are nonetheless "paid for."

  We'll consider established concepts from philosophy and psychology. We are to be cautious and not force a term if it doesn't fit. We'll then create a table with the specified columns.

  ## Candidate Concepts

  1. **Eudaimonia (Aristotelian Flourishing)**  
     - In philosophy, eudaimonia is often translated as "flourishing" and involves living in accordance with virtue, which requires effort and may involve overcoming challenges. Pleasures derived from such activities are considered higher and more fulfilling.

  2. **Intrinsic Motivation (Self-Determination Theory)**  
     - In psychology, intrinsic motivation refers to doing an activity for the inherent satisfaction rather than for some separable consequence. The satisfaction comes from the activity itself, which might be linked to the wage if the effort is part of the enjoyment.

  3. **Flow (Csikszentmihalyi)**  
     - Flow is a state of complete absorption in an activity, where there is a balance between challenge and skill. It is enjoyable and rewarding, but note that it doesn't necessarily require prior effort or struggle.

  4. **Effort Justification (Cognitive Dissonance Theory)**  
     - Effort justification is a psychological concept where individuals attribute greater value to an outcome they had to put effort into achieving, in order to justify the effort. This might create a sense of earnedness.

  5. **Desert (Philosophy of Justice)**  
     - In philosophy, desert is about what someone deserves based on their actions. It might be applied to pleasure: one deserves a pleasure because one has earned it.

  6. **Achievement Pleasure (Common Sense)**  
     - This is not a technical term but refers to the pleasure taken in having achieved something. However, the wage is not just about the achievement but the experience itself.

  7. **Autotelic Activity**  
     - An autotelic activity is one that is done for its own sake, but it may involve effort and challenge. This is related to flow and intrinsic motivation.

  8. **Pride (Emotion Theory)**  
     - Pride is an emotion that arises from attributing a positive outcome to one's own efforts. But it is an emotion that might accompany the wage, not the wage itself.

  9. **Kantian Respect for the Moral Law**  
     - For Kant, acting from duty has a special worth, and there might be a kind of pleasure in doing one's duty. However, this is moral and not necessarily about non-moral efforts.

  10. **Stoic Joy (Eupatheia)**  
      - The Stoics distinguished between fleeting pleasures and a deeper joy that comes from living virtuously, which might involve enduring hardship. But this is more about virtue than about the texture of an experience.

  After reviewing, we see that none of these perfectly capture the wage. The wage is about the immediate experience having a quality of "earnedness" that is felt during the activity, not just in reflection or as a cognitive reappraisal. It is also distinct from the pleasure of achievement (which is about the outcome) and from flow (which is about absorption without necessarily requiring prior struggle).

  Let's test the concepts:

  - **Effort Justification** (from cognitive dissonance) might be the closest because it suggests that we value experiences more when we have exerted effort for them. However, it is typically a post-hoc justification and may not be present during the experience. Moreover, it is more about the outcome than the experience itself.

  - **Eudaimonia** is about a life well-lived and the pleasures that come from virtuous activity. It might capture the idea that some pleasures are "higher" because they are earned, but it is too broad and life-encompassing.

  - **Flow** captures the absorption but not necessarily the earnedness. The dawn swim was not entirely pleasant during the event and not a flow state, but it had the wage.

  - **Intrinsic Motivation** might include the wage if the effort is part of what makes the activity satisfying, but it doesn't necessarily distinguish between the effortful and the effortless in the way the wage does.

  Given that the wage is a felt quality of the experience itself, and it can occur even in the absence of any later benefit or story, we might need to carve a new concept.

