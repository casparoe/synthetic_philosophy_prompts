  ### Discussion  
  Your exploration reveals a nuanced phenomenological quality—what you term the "wage"—that resists reduction to established concepts. It involves a **direct, non-instrumental felt quality of "earnedness"** embedded in the experience itself, distinct from:  
  - **Pleasantness** (hedonic tone)  
  - **Enjoyment/liking** (affective response)  
  - **Value judgment** (cognitive appraisal)  
  - **Achievement value** (extrinsic worth of an outcome)  

  The wage manifests as a *textural layer* of the experience—akin to a gravitational weight or density—arising from antecedent effort/risk, even when the activity is unpleasant. Critically, it:  
  1. **Operates pre-reflectively** (felt *during* the act, not just in retrospect)  
  2. **Lacks moral baggage** (not about "deserving" in a justice-based sense)  
  3. **Thrives in non-achievement contexts** (e.g., cleaning someone else's window)  
  4. **Enhances memorability** by deepening the experience's "resonance footprint"  

  Philosophical and psychological frameworks struggle to isolate this:  
  - **Philosophy** often reduces it to *desert* (moral deservingness) or *eudaimonia* (flourishing through virtue), both overly normative.  
  - **Psychology** leans toward *effort justification* (cognitive bias inflating value post-effort) or *intrinsic motivation* (inherent task satisfaction), which miss the immediate phenomenology.  

  The wage's closest neighbors—**autotelicity** (activity done for itself) and **flow** (absorbed engagement)—fail because they emphasize immersion without requiring effort-as-cost. Your "grim cases" (e.g., the predawn swim) confirm the wage persists *without* pleasure, while "unearned delight" (e.g., the afternoon swim) lacks it despite high pleasantness.  

  ---

  ### Concept Evaluation Table  

  | concept | provenance | what_it_gets_right | what_it_misses | verdict | separating_case |  
  |---------|------------|---------------------|----------------|---------|-----------------|  
  | **Effort justification** (Aronson, Festinger) | psychology | Explains enhanced retrospective valuation of effortful outcomes | Framed as cognitive bias post-experience; ignores in-the-moment phenomenology | partly fits | A man silently completes a difficult task alone at 4 AM, feels the wage *during*, then dies—no "justification" occurs, but wage persists |  
  | **Desert** (Feinberg, Aristotle) | philosophy | Captures "earned" dimension normatively | Moralizes the feeling; requires social/ethical framework (e.g., "fairness") | doesn't fit | Cleaning a stranger's window: feels "waged" without implying one *deserves* the experience |  
  | **Autotelicity** (Csikszentmihalyi) | psychology | Matches absorption and intrinsic motivation | Effortless activities can be autotelic (e.g., afternoon swim); wage requires effort-as-cost | partly fits | The dawn swim: unpleasant but waged vs. an effortless, pleasant autotelic hobby |  
  | **Eudaimonic pleasure** (Aristotle, Ryan/Deci) | both | Links effort to deeper satisfaction | Confounds hedonic pleasure, judgment, and self-realization; wage can exist without "flourishing" | partly fits | A grudgingly completed chore with wage vs. a meaningful, pleasant eudaimonic activity |  
  | **Flow** (Csikszentmihalyi) | psychology | Aligns with focused attention | Flow is intrinsically rewarding; wage can accompany aversive effort (e.g., cold swim) | doesn't fit | Translator stuck on a sentence: frustrated (not in flow) but acutely feeling the wage of her effort |  
  | **Achievement emotion** (pride) (Tracy/Robins) | psychology | Connects effort to affective response | Pride targets outcomes; wage is process-oriented and not inherently positive | doesn't fit | The window cleaner: feels wage *while* scrubbing, not after; no pride in cleaning another's mess |  
  | **Conatus** (Spinoza) | philosophy | Effort as persistence of being | Abstract metaphysical drive; not phenomenologically specific | doesn't fit | The swimmer: wage is particular to *this* effort, not universal striving |  
  | **Mental contrasting** (Oettingen) | psychology | Juxtaposes effort with reward | Cognitive strategy; wage is non-deliberative | doesn't fit | Predawn swimmer not contrasting; wage emerges without cognitive work |  

  **Overall verdict**: No established concept fully fits. The wage is a distinct phenomenological structure.  

