  ### Rendering Guidance  
  To evoke **effort-embeddedness**:  
  - **Anchor it in the body**: Describe effort’s physical echo (e.g., trembling muscles in the swimmer *still holding* yesterday’s fatigue).  
  - **Haunt objects/actions**: Imbue tools or movements with accumulated labor (e.g., the translator’s dictionary *thickening* with each hour of futile searching).  
  - **Resist internal monologue**: The wage isn’t a thought—it’s the water’s *resistance* feeling like repayment to the swimmer; the window’s grime *yielding* as an owed surrender.  
  - **Subvert pleasure/pain binaries**: Let the "grim" cases revel in their texture (e.g., the predawn cold *cutting* with the precision of earned suffering).  

  This quality thrives when effort’s shadow is *tactile* within the moment—not explained, but felt.
