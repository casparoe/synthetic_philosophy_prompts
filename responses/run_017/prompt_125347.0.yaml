  ### Proposed Concept Specification (JSON)  
  ```json
  {
    "term": "Effort-Embeddedness",
    "definition": "The pre-reflective, non-moral sense that an experience contains the palpable residue of antecedent effort or risk, felt as a weight or texture within the event itself.",
    "paradigm_case": "A swimmer endures a cold, grueling dawn training session; though unpleasant, the effort embeds itself in each stroke as a dense 'wage,' absent in her effortless afternoon pleasure-swim.",
    "contrast_case": "Winning a lottery: intensely pleasant and 'earned' via luck, but lacking effort-embeddedness because no personal labor is materially encoded in the experience.",
    "boundary_case": "A pianist who effortlessly plays a piece mastered decades ago: the ease feels 'waged' due to past effort—hesitant because embeddedness persists without *current* exertion.",
    "commonest_confusion": "Mistaking it for pride in achievement (which focuses on outcomes) or retrospective effort-justification (a cognitive appraisal).",
    "how_to_render_it": "Weave sensory details that carry the ghost of antecedent struggle—e.g., the swimmer's muscles *remembering* yesterday's strain; the window-cleaner's rag groaning with the weight of wasted hours."
  }
