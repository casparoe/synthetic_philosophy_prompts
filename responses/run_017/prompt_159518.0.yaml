prompt: |-
  I sit on the allocations committee of a small global-health funder that describes itself as "effective altruism adjacent," and over the last two grant cycles I've become convinced of the measurability critique: that the movement's prioritization is systematically distorted toward interventions whose effects can be stated as a cost per unit of outcome, and away from interventions and causes whose effects are diffuse, long-lagged, contested, or systemic — and that this is a distortion rather than merely a reflection of what we happen to know.

  In arguing with colleagues I've come to rely on two distinctions I don't think are standard, and I'd like them stress-tested alongside the critique itself. Call the first the conversion problem: measurement is not a passive readout of a cause's tractability but an intervention on its epistemic status, because the same resources that estimate an intervention's effect also make that intervention more estimable. So the pool of supposedly unmeasurable causes is not stable under investigation, and any test of the critique that works by going out and measuring an allegedly unmeasurable cause destroys the very thing it was meant to test. My colleagues reply with what I'll call the evidential symmetry argument: for an expected-value maximizer, ignorance about an intervention should widen the interval around its value, not lower the mean, so unmeasurability as such cannot demote a cause — and hence a genuine measurability bias has to be explained by something other than mere uncertainty.

  Tell me what would count against the critique. I want the defeaters ranked from fatal to merely awkward and sorted by what each would show: that the actual allocations are defensible, that the critique misdescribes the mechanism, or that the critique has been qualified into unfalsifiability. Please cover the following.

  - What defenders of cost-effectiveness-driven prioritization would themselves concede as counting against the critique, as opposed to what critics allege about them, and where such a concession should stop.
  - Whether the conversion problem protects the critique or indicts it, and whether the evidential symmetry argument really shifts the burden the way my colleagues assume. In particular, assess whether risk aversion over moral uncertainty, the option value of learning, selection effects in who is drawn to quantifiable work, institutional incentives to produce reportable numbers, or asymmetric priors can each independently do the work the critique needs — and say which of them the critique is actually committed to.
  - Which observable facts would discriminate. What allocation pattern, what kind of internal deliberation, what episode in the movement's funding history would be decisive rather than merely suggestive? I would personally weight a revealed-preference test most heavily: a documented case in which a quantifiable intervention was funded over an unquantifiable one that the same decision-makers privately judged better.
  - An honest verdict on how exposed the critique is, and on whether, if it does turn out to be insulated, that is a defect here — or whether insulation is simply the normal condition of a claim that functions as a standing suspicion about a research and funding culture rather than as a testable hypothesis about it.
reasoning: |-
  Okay, the user is part of an allocations committee for a global health funder that's "effective altruism adjacent." Over the last two grant cycles, they've become convinced by the measurability critique. This critique argues that EA prioritization is biased toward interventions with easily quantifiable outcomes (like cost per life saved) and against those with diffuse, systemic, or long-term effects. They want their two distinctions tested: the conversion problem and the evidential symmetry argument.

  First, I need to break down the user's arguments. The conversion problem suggests that measuring an intervention changes its epistemic status—resources spent on estimation make it more measurable, so testing unmeasurable interventions alters their status. The evidential symmetry argument claims that for an expected-value maximizer, uncertainty should widen the confidence interval but not lower the mean estimate. The user's colleagues use this to argue that unmeasurability alone shouldn't demote a cause.

  The user wants defeaters against the critique ranked by fatality. They also want to know what defenders would concede, whether their two distinctions hold, what observable facts could test the critique, and how exposed the critique is to falsification.

  Starting with what defenders would concede. Defenders of cost-effectiveness might admit that quantifiable interventions are favored but argue it's due to higher confidence in impact, not bias. They'd point out that focusing on measurable areas builds evidence over time. However, they might concede that some high-impact areas are underfunded if they're hard to measure. But they'd stop short of agreeing that this is a systematic distortion rather than a practical necessity.

  Next, the conversion problem. This could protect the critique by showing that measurable interventions get more resources, creating a feedback loop. But it might also indict the critique because if unmeasurable causes become measurable when studied, then the critique's premise that some causes are inherently unmeasurable is flawed. The evidential symmetry argument shifts the burden onto the critique to explain why the mean estimate is lower, not just the interval wider. But factors like risk aversion, option value, selection effects, institutional incentives, or asymmetric priors could explain why uncertainty lowers the mean estimate. The critique might rely on a combination of these, especially institutional incentives and selection effects.

  Observable facts to discriminate: A revealed preference test where decision-makers privately prefer an unquantifiable intervention but fund a quantifiable one would be strong evidence. Patterns of funding shifts after new evidence, or discrepancies between internal deliberations and public justifications. Historical cases like deworming debates or GiveWell's initial exclusions could serve as examples.

  Assessing exposure: The critique is somewhat insulated because it's about systemic biases, making direct tests hard. However, it's not unfalsifiable. If defenders can show that adjustments for uncertainty are made, or if unquantifiable causes receive funding when evidence improves, that weakens the critique. Insulation might be acceptable as a standing suspicion rather than a testable hypothesis, but it risks becoming non-accountable.

  The user's deeper needs might include wanting validation of their critique, tools to persuade colleagues, and a structured way to evaluate the bias. They might also be concerned about effective resource allocation and ensuring their funder isn't overlooking high-impact, hard-to-measure interventions.
answer: |-
  Here’s a stress-tested analysis of the measurability critique and your distinctions, structured as requested. I’ll rank defeaters by severity, assess your key arguments, identify observable tests, and conclude with a verdict on the critique’s exposure.

  ---

  ### **Defeaters Against the Critique: Ranked by Severity**
  *(Fatal → Awkward, with what each would show)*

  1. **Fatal: Demonstrating explicit adjustments for uncertainty**  
     - **What it shows:** Allocations are defensible.  
     - **Description:** If decision-makers systematically *raise* the expected value of "unmeasurable" causes to account for uncertainty (e.g., using maxipok strategies, fat-tailed priors, or Knightian uncertainty premiums), the critique collapses.  
     - **Defender concession:** EA-aligned funders *would* concede this is necessary in principle (e.g., Open Phil’s pandemic preparedness work). If they show documented adjustments (e.g., funding a systemic intervention *despite* low measurability because uncertainty was formally incorporated), the critique is falsified.  
     - **Where concession stops:** If adjustments are rare, ad hoc, or limited to causes with vocal advocates (e.g., AI safety), the distortion persists.

  2. **Severe: Revealing symmetric neglect of *quantifiable* low-impact causes**  
     - **What it shows:** Critique misdescribes the mechanism.  
     - **Description:** If funders consistently reject highly measurable interventions with mediocre cost-effectiveness (e.g., deworming after the replication crisis) while funding "unmeasurable" ones (e.g., policy advocacy), it suggests prioritization is driven by *expected impact*—not measurability bias.  
     - **Defender concession:** EA funders *do* reject quantifiable low-impact work (e.g., GiveWell exclusions). Conceding this shifts blame to impact uncertainty, not measurability per se.  
     - **Where concession stops:** If rejections focus *only* on weak quantifiable evidence, while equally uncertain systemic causes get no hearing, bias remains.

  3. **Moderate: Proving unmeasurable causes dominate portfolios when evidence emerges**  
     - **What it shows:** Allocations are defensible.  
     - **Description:** Historical cases where funders rapidly pivoted to "unmeasurable" causes once evidence appeared (e.g., climate change in EA portfolios post-2018, or AI governance post-2022) undermine the "systematic distortion" claim.  
     - **Defender concession:** EA funders *would* cite these as proof of flexibility.  
     - **Where concession stops:** If pivots occur only for causes with quantifiable *tail risks* (e.g., AI x-risk), not diffuse systemic ones (e.g., gender equity in health systems).

  4. **Awkward: Showing critics also neglect unmeasurable causes**  
     - **What it shows:** Critique is unfalsifiably vague.  
     - **Description:** If critics (including you) fail to allocate personal donations to unmeasurable causes, or can’t specify *which* unfunded interventions are better, it suggests the critique is non-actionable.  
     - **Defender concession:** EA defenders *might* use this rhetorically, but it’s logically weak—critics aren’t obliged to solve the problem.  
     - **Where concession stops:** Even if critics are hypocrites, the bias could still exist.

  ---

  ### **Stress-Testing Your Distinctions**
  **A. Conversion Problem: Protects *or* Indicts the Critique?**  
  - **Protects it** by revealing a feedback loop: Resources → Measurability → More resources. This *is* a distortion: epistemic resources flow to "easy" targets, making them seem inherently superior.  
  - **Indicts it** if investigation *reliably* converts "unmeasurable" causes to measurable ones (e.g., RCTs for psychotherapy). But this fails for causes where quantification is intrinsically limited (e.g., "strengthening democracy"). Here, the critique holds: the pool *is* stable for some interventions.  
  - **Verdict:** The problem **protects the critique** for systemic/lagged interventions but **indicts it** for tractable-but-understudied ones.

  **B. Evidential Symmetry Argument: Does It Shift the Burden?**  
  - **Yes, but incompletely.** Your colleagues are technically correct: uncertainty *should* widen intervals, not lower means. But these factors break symmetry:  
    1. **Risk aversion over moral uncertainty**: If funders conflate *epistemic* risk (unknown impact) with *moral* risk (e.g., harming communities), they defensively lower mean estimates.  
    2. **Option value of learning**: Quantifiable interventions offer immediate learning (e.g., RCTs), raising their option value. Unmeasurable ones lack this, lowering perceived value.  
    3. **Selection effects**: Quant-savvy analysts dominate EA, *defining* "impact" in quantifiable terms (e.g., DALYs). This frames unmeasurable causes as low-value by default.  
    4. **Institutional incentives**: Funders need reportable metrics for accountability (e.g., "lives saved/year"). Unmeasurable causes become "irresponsible" bets.  
    5. **Asymmetric priors**: EA’s roots in global health/animal welfare embed a prior for *individualistic* interventions (e.g., bed nets) over *systemic* ones (e.g., decolonizing aid).  
  - **Which does the critique need?** All except (5) are sufficient. The critique is **committed to (2), (3), and (4)** as core mechanisms; (1) and (5) are reinforcing factors.

  ---

  ### **Observable Tests: Decisive Evidence**
  **(Ranked by discriminative power)**  
  1. **Revealed-preference test** (your priority): A documented case where:  
     - Decision-makers privately rated an unquantifiable intervention (e.g., "supporting community health worker agency") as higher expected value.  
     - But funded a quantifiable one (e.g., "distribute bed nets") due to measurement-driven accountability pressures.  
     - **Smoking gun**: Internal memos showing lines like, "We all believe X is more impactful, but we can’t prove it to donors."  

  2. **Deliberation patterns**: Systematic avoidance of "unmeasurable" causes in grant discussions—not because of low expected value, but because "we have no numbers." Contrast with how quantifiable causes with *negative* evidence (e.g., scabies RCTs) are debated rigorously.  

  3. **Historical episode**: Early EA funding (pre-2015) overwhelmingly favored measurable global health interventions over equally urgent but systemic causes (e.g., anti-corruption). If internal documents show this was due to "measurability constraints" rather than impact assessments, it validates the critique.  

  4. **Funding shifts after quantification**: If a cause (e.g., cash transfers) saw funding surge *only after* RCTs made it quantifiable—despite prior qualitative evidence—it supports the distortion claim.  

  ---

  ### **Final Verdict: Exposure & Insulation**  
  - **How exposed is the critique?** Moderately exposed. The **revealed-preference test** and **deliberation patterns** could falsify it. If no such evidence exists after thorough archival/ethnographic study, the critique weakens.  
  - **Is insulation a defect?** Not inherently. The critique functions as a **Bayesian warning**: "All else equal, measurability distorts priorities." Like "publication bias" in science, it’s a *systemic suspicion* justified by:  
    - Theoretical mechanisms (e.g., institutional incentives).  
    - Empirical hints (e.g., 80%+ EA funding targeting quantifiable causes per [Global Priorities Institute reports](https://globalprioritiesinstitute.org/)).  
  - **However, it becomes defective if**:  
    - Critics refuse to specify *which* unmeasurable causes are undervalued.  
    - They dismiss counterexamples (e.g., EA funds for policy reform) as "exceptions."  
  - **Recommendation**: Tighten the critique to: *"EA systematically underrates causes where quantification is epistemically impossible (e.g., decolonial systems change), not merely underinvested."* This is testable via the revealed-preference test.  

  In sum: Your critique survives stress-testing but needs empirical validation. Push for transparency in deliberations—**the strongest defeater remains hidden in your committee’s meeting notes**.
