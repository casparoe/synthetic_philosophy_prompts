     - D1 (Novelty) and D5 (Classifying the clinician case): The clinician's belief is novel for the clinician. But if we say the system generated the knowledge (and then the clinician received it), then we might have to say the system used a pramāṇa (which might be inference, but it's opaque). But then the clinician's knowledge is not generated by a pramāṇa? Or it is transmitted? But D1 says transmission is not a pramāṇa. So we must have a pramāṇa for the clinician. How? This might force a new pramāṇa or a widening.

