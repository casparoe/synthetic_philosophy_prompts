  We are given a strong position: the joint-susceptibility criterion for sameness of mechanism in anomalies across ML systems. The criterion has three clauses:

  (i) There is some intervention I (specifiable at the level of internal variables) that predictably shifts the incidence/severity of both A and B in the same direction.

  (ii) The effect of I on each is mediated by a shared set of intermediate variables.

  (iii) No intervention within our intervention budget separates them (i.e., no intervention moves A while leaving B untouched).

  The goal is to evaluate this criterion by considering potential defeaters, especially in light of a specific case and other concerns (over-generation, under-generation, transitivity, level-relativity, drift, and unfalsifiability). We are also to consider the case where a fix transfers but the ablation responses differ.

  We will:

  1. Brainstorm candidate defeaters without organizing.
  2. Rank and map these defeaters by exposure (fatal to awkward).
  3. Address the specific case and the listed concerns.
  4. Discuss the transfer-of-fix intuition and how the criterion might be adjusted.

  ---

  ## Step 1: Brainstorming Candidate Defeaters

  List of candidate defeaters:

  1. **Over-generation via common upstream knob**: A single intervention (e.g., decoding temperature) affects multiple failure modes. Without clause (ii), this might collapse distinct mechanisms. But even with clause (ii), if the shared mediator is too broad (e.g., a high-level variable), it might still over-unify.

  2. **Under-generation via compensatory pathways**: If a component is knocked out but a backup takes over, then an intervention (ablation) that should have affected the failure does not. Thus, clause (iii) might be satisfied (no separating intervention) even though the underlying mechanisms are different because the backup is not triggered in the other system. Also, clause (i) might fail because an intervention that should have shifted the failure in both systems doesn't in one (due to compensation).

  3. **Under-generation via fused realizations**: Two components are so intertwined that they cannot be manipulated separately (e.g., due to architectural constraints). Then, even if they are part of different mechanisms, we cannot find a separating intervention, so clause (iii) might force us to treat them as the same mechanism.

  4. **Transitivity failure**: If A and B are jointly susceptible, and B and C are jointly susceptible, but A and C are separable, then by the criterion, A and B are the same mechanism, B and C are the same, but A and C are not. This breaks transitivity. Since mechanism identity is typically expected to be transitive, this might be a problem for inductive reasoning.

  5. **Level-relativity**: The verdict of mechanism identity depends on the intervention budget (e.g., if we have more fine-grained interventions, we might separate what we previously thought was the same mechanism). This makes mechanism identity relative to the current intervention set, which might be problematic for a notion that is supposed to be objective.

  6. **Drift over time**: In one system, gradual updates change the internal variables. At what point does the mechanism become different? The criterion might not provide a principled answer because it depends on the intervention set's sensitivity to the changes.

  7. **Unfalsifiability**: The criterion might be adjusted by redefining the intervention set in the face of counterexamples. For instance, if an intervention is found that separates A and B, one might argue that it is outside the budget, or one might add a mediator to clause (ii) to avoid over-generation. This could make the criterion immune to refutation.

  8. **The transfer-of-fix counterexample**: In the specific case, a fix (fine-tuned on system 1) transfers to system 2 and suppresses the failure, even though the ablation responses differ. The criterion says they are different mechanisms (because an ablation on the homologous component c-prime in system 2 does not affect the failure, but in system 1 it does, so we can separate them by ablating c in system 1 and not in system 2? Actually, note: the intervention budget is per system? Or cross-system? Clarification needed). The colleagues argue that transfer of fix plus same behavioral signature should imply same mechanism.

  9. **Epiphenomena**: An intervention might affect two failures because they share an epiphenomenal cause, but the intermediate variables in clause (ii) might not be causal. However, clause (ii) requires a shared set of intermediate variables that mediate the effect, which should rule out epiphenomena if mediation is causal.

  10. **Multiple realizability in reverse**: The criterion might under-generate by requiring a shared set of intermediate variables. If two systems have the same mechanism but implemented with different intermediate variables, then clause (ii) might fail because there is no shared set of intermediate variables. However, note: the criterion says "mediated by a shared set of intermediate variables". But if the systems are different, the intermediates might be at a higher level of abstraction? The criterion doesn't specify the level.

  11. **Intervention budget relativity**: The criterion is tied to the current intervention budget. If the budget is limited, we might falsely identify two mechanisms as the same because we lack the intervention to separate them. Conversely, if we expand the budget, we might split mechanisms that were previously considered the same.

  12. **Ambiguity in 'predictably shifts'**: The predictability might depend on the model of the system. If our model is incomplete, we might not predict the shift correctly.

  13. **Mediation ambiguity**: How do we establish that the effect is mediated by a shared set? This might require extensive knowledge of the causal structure.

  14. **The problem of masks and switchers**: In causal inference, a mask is a variable that prevents the effect of an intervention from being observed. A switcher might change the causal pathway. These could cause clause (i) or (ii) to fail.

