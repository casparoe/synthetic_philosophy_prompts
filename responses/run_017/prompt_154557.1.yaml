  Alternatively, we might keep clause (iii) but allow for a disjunctive criterion: same mechanism if either (i, ii, iii) OR (transfer of fix via fine-tuning). But that would be ad hoc.

  ### Over-generation

  Example: A single knob (e.g., decoding temperature) affects multiple failure modes.

  - Clause (i) is satisfied: an intervention on temperature shifts both A and B.
