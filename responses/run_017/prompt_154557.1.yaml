  However, if we lack the intervention to target X and Y separately, then they would be considered the same mechanism. This might be acceptable if in practice they are always coupled.

  ### Under-generation (Compensatory Pathways)

  Example: Ablating c in system 1 eliminates F, but in system 2, ablating c-prime does nothing because a backup d takes over. Then, we have a separating intervention (ablation of c/c-prime) so they are different. But what if we ablate both c and d in system 2? Then F might occur. But note: the criterion is about the effect on the failure. In system 2, ablating c-prime alone does not affect F, but in system 1 it does. So they are separable.

  However, consider if we could ablate the backup pathway in both systems? But in system 1, there might be no backup, so ablating d does nothing. Then, an intervention that ablates d in system 2 might make the failure appear (if we then have a triggering input) but in system 1, ablating d does nothing. So we have an intervention that moves B (by making it occur when it wouldn't) but not A. So again, they are separable.

  But what if we don't have the intervention to ablate d? Then we cannot do this. Then, we might not have a separating intervention within the budget, so they would be considered the same? But we do have the ablation of c/c-prime: it moves A but not B. So they are separable.

  The real issue is when we don't know about the backup and we only try ablating c/c-prime. Then, we see that in system 1 it works and in system 2 it doesn't, so we call them different. But if we later discover that by ablating d in system 2 we can make the failure sensitive to c-prime ablation, then we might revise. This is normal in science: new interventions refine our understanding.

  ### Transitivity

  Suppose A and B are jointly susceptible (same mechanism by our criterion), B and C are jointly susceptible, but A and C are separable. Then:

  - A and B: same mechanism.
  - B and C: same mechanism.
  - A and C: different.

  Then, the relation is not transitive. This is not necessarily a flaw if we are explicit that mechanism identity is not always transitive. We might think of it as a graph where nodes are anomalies and edges are joint susceptibility, and then a mechanism is a connected component in this graph. But then, if the graph is not transitive, we might have a chain A-B-C with A and C not directly connected. In that case, we would not say A and C are the same mechanism. So we would have:

  - Mechanism 1: {A, B}
  - Mechanism 2: {B, C}

