prompt: |-
  I write literary fiction — three novels, and I teach an advanced workshop most autumns — and for the last year I have been reading, slowly and with a dictionary, about how economics gave up on measuring happiness and replaced it with something supposedly thinner and harder: the doctrine that an agent's wants are nothing over and above what her choices disclose, that the numbers assigned to those wants have no unit and no common scale across persons, and that any claim about the inner magnitude or the felt texture of a desire is, strictly speaking, idle. My formal training is in no relevant field; I lasted one term of a philosophy-and-economics survey before switching to English, and while I can use words like ordinal, budget set, and maximisation in a sentence I could not define them under pressure. So I do not want an explanation of the debate so much as a translation of it. The vocabulary I actually think in is the vocabulary of craft: show-don't-tell, subtext, in-character and out-of-character, objective and obstacle, the arc, voice, the scenic menu of live options a scene puts on the table, and a private document I keep for each novel called the want ledger, in which I write down what I take each character to want and revise it as the draft goes on.

  Here is why I am asking. I am finishing a novel whose narrator, Margot, spends a decade turning down a promotion she has plainly been positioned for, saying each time that she never wanted it, and then, in the last third, litigates furiously for a version of the same thing under another name. My readers and my editor agree on the facts of her behaviour and disagree about everything else. Some say she'd never do that, which I take to mean not that the action is improbable but that it proceeds from nothing. Others say the litigation is the truest thing about her and the refusals were the evasion. I have found myself using the word real about her want in a way I cannot cash out, and I have noticed something else: whether Margot reaches for the thing in a given scene depends on which other options I have left on the page. Remove the alternative and she does not move at all; put a worse alternative beside it and she suddenly wants it badly. In workshop I call this the cut-option test, and I use it to decide whether a want is load-bearing or an artefact of the scene, but I have started to suspect that the test is doing the same work as a technical apparatus I cannot read. I also do, on every page, something I am told is impossible: I weigh the intensity of Margot's desire against her brother's and decide whose loss the chapter is really about, and I do it not by measuring anything but by allocating sentences.

  So please do this. Restate the revealed-preference picture of agency, and the quarrel about what the term utility means once it has been prised loose from happiness or felt satisfaction, as faithfully as you can in my vocabulary — tell me what a budget set is in terms of a scene, what the consistency conditions on choice amount to as constraints on character, what it would mean to say that a utility number is only an indexing of behaviour rather than a quantity of anything. Then give me the residue report. Which of their claims translate cleanly into craft terms, which translate only if you quietly import an assumption that is mine or theirs rather than common to both, and which cannot be expressed in my vocabulary at all? I am especially interested in three places where I expect the translation to fail: my conviction that as her maker I know what Margot wants prior to and independent of any choice of hers, in a way no observer could; the phenomenon in which a want survives its own renunciation, so that the refusal is evidence for the desire rather than against it; and my practice of comparing the force of one character's want with another's by compositional means. For each, say whether the residue indicts my vocabulary or theirs — whether it shows that the craft terms are doing real work economics has no room for, or that what I call knowledge of a character is less clear than it feels from inside the writing of it. And then tell me, practically, what I should do with Margot.
reasoning: |-
  Okay, let me approach this query methodically. The user is a literary fiction writer grappling with economic concepts of desire while crafting a complex character named Margot. Their core need is to translate revealed preference theory into their own vocabulary of narrative craft, specifically examining three tension points where economic models seem inadequate for character psychology.

  First, I need to map the economic framework to writing terms. The budget set becomes the "scene menu" - all actions available to a character in a given moment. Utility maximization translates to characters choosing what feels most authentic based on their established motivations. The ordinal nature of utility aligns with how writers show relative desire through action rather than quantifying it.

  The user's three sticking points require special attention:
  1. Their authorial knowledge of Margot's "true" wants beyond her choices - this challenges revealed preference's core premise. In writing terms, this resembles dramatic irony where readers know more than characters.
  2. Renounced desires persisting - economically paradoxical but narratively potent. This is where "show-don't-tell" creates subtext; refusal becomes proof of desire through emotional leakage.
  3. Comparing desire intensities compositionally - economically impossible but literarily essential. Sentence allocation becomes the writer's equivalent of interpersonal utility comparison.

  For Margot specifically, the solution lies in leveraging these tensions. Her refusal of the promotion could be framed as her bargaining with herself - each rejection actually expresses an unacknowledged want. The later litigation then becomes inevitable when the "price" (emotional cost) of refusal becomes too high. The key is making both behaviors feel internally consistent through carefully managed scene options.

  The translation residue reveals both frameworks' limitations: economics ignores interiority while writing struggles with inconsistent choice patterns. But Margot's complexity emerges precisely where economic models break down - her "irrational" persistence of desire after refusal is the most human thing about her. The practical advice centers on using scene options to create the illusion of her inner want being constant while her choices shift with circumstance.
answer: |-
  This is one of the most thrilling collisions of craft and theory I've encountered. Let's translate the economist's map of desire into your workshop's terrain, then see where the borders blur or break – especially with Margot.

  **The Revealed Preference Doctrine (Translated for the Workshop):**

  1.  **"Wants are nothing over and above what choices disclose":** A character's *real* want in a scene *is* what they choose. You cannot claim "Margot *really* wants the promotion but chose to refuse it" in a way that has traction for understanding her behaviour *as an agent*. Her refusal *is* her revealed want at that moment, with those options. The "want ledger" entry must match the choice made, not an internal state you imagine independently. Past refusals aren't evidence of a hidden want for *that thing*; they are evidence of a want for *something else* available at the time (peace? safety? avoiding scrutiny?) that outweighed the want for the promotion *in that specific menu*.
  2.  **"Numbers assigned... no unit, no common scale":** When you note "Margot *moderately* wants X, her brother *intensely* wants Y," economists say this is like comparing the redness of an apple to the loudness of a trumpet. There's no common unit of "want-intensity." The "numbers" (like utility) are only an *ordering*: they tell us Margot prefers A to B to C in *this specific context*, but not *how much* more she prefers A to B compared to B to C, and certainly not compared to her brother preferring X to Y. Your allocation of sentences to show loss isn't measuring intensity; it's *creating* the reader's perception of relative importance *compositionally*, which is different.
  3.  **"Budget Set = The Scene Menu":** This is the cleanest translation. The "budget set" is precisely the **"live options"** you put on the table in a scene. It's the set of actions plausibly available to the character *right then*, constrained by circumstance, other characters, their own history, and the physical/logical boundaries of the scene. Margot can only "reveal" her preference from *this* specific menu.
  4.  **"Consistency Conditions = Character Constancy (But Thinner)":** Revealed preference theory relies on axioms like "if you choose A over B in Menu 1, and B over C in Menu 2, you shouldn't choose C over A in Menu 3 if all options are present." Translated to craft: **Character behaviour shouldn't be internally contradictory *without narrative justification*.** If Margot consistently refuses the promotion (choosing Status Quo > Promotion) in scenes where both are options, it would be inconsistent (economically irrational) for her to suddenly choose Promotion > Status Quo in a scene with the *same* options *without* some change (new information, shifted values, emotional breakdown). This consistency underpins the reader's sense of a coherent character. However, it's a *minimal* constraint – it focuses only on the *pattern of choices*, not the *inner reason* for the shift, which is your domain.
  5.  **"Utility as Indexing, Not Quantity":** Saying Margot has "Utility 10 for Promotion, 5 for Status Quo" doesn't mean she has "10 happiness units" stored up. It *only* means that, faced with *that specific choice*, she will pick Promotion. It's a label for her observed ranking. It tells us nothing about the *feeling* of the want, only the *direction* of the choice. The number is a placeholder for the rank order revealed in *that* decision. It's like labelling her choice "Option 1" rather than quantifying its desirability.

  **The Residue Report: Where Translation Fails (or Needs Smuggling)**

  Now, your three key points of friction:

  1.  **"I Know Her Want Prior to Choice":**
      *   **Translation Attempt:** This is like claiming knowledge of a "utility function" independent of choices. Economics *denies* this has meaning or is knowable to an observer (including the author-as-observer). Only choices reveal it.
      *   **Residue:** This is where *your* vocabulary does **real work economics has no room for**. Your "want ledger" represents the *inner potential*, the *latent drives*, the *backstory*, the *subtextual yearning* that *motivates* choices but isn't identical to them. It's the soil from which the choice (the plant) grows. Economics sees only the plant. Your conviction stems from being the *source* of Margot's entire being, including her hidden depths. An observer (reader, economist) can only infer from choices; you *originate* the potential.
      *   **Indictment?** This residue **indicts the economic model's narrowness** for your purpose. It shows craft vocabulary captures essential *interiority* that revealed preference explicitly rejects as "idle." Your knowledge isn't "less clear"; it's knowledge of a *different category* – the *generative* truth of character, not just the *observational* truth of behaviour.

  2.  **"Want Survives Renunciation (Refusal as Evidence FOR Desire)":**
      *   **Translation Attempt:** This directly contradicts revealed preference. If Margot refuses the promotion (chooses Not-Promotion > Promotion), that *is* her revealed preference at that moment. The refusal *cannot* be evidence *for* wanting the promotion itself. Economics might say the refusal reveals a *stronger countervailing want* (e.g., Want for Safety > Want for Promotion).
      *   **Residue:** Here, **craft vocabulary smuggles in psychology and time.** Your view relies on concepts like:
          *   **Subtext/Show-Don't-Tell:** The *manner* of refusal leaks the underlying desire (trembling voice, lingering look, disproportionate anger). This is "showing" the conflicted want *behind* the choice. Economics ignores the "how."
          *   **Character Arc:** The refusal isn't the end state; it's a point on a trajectory. The *persistence* of the *issue* (promotion) and the *shift* in later choice (litigation) *retroactively* colour the refusal as part of a struggle, not a settled preference. Economics treats choices as atomic events; craft sees them as links in a chain.
          *   **Cost of Renunciation:** The refusal *hurts*. The pain signals the *strength* of the suppressed want. Economics focuses on the choice made, not the psychic cost of *not* choosing the alternative.
      *   **Indictment?** This residue shows **both vocabularies need augmentation.** Pure revealed preference is too thin; it misses the phenomenology of conflicted desire. Pure craft intuition might sometimes misattribute – is the pain evidence of the *specific* want for promotion, or a want for esteem/control that the promotion *symbolizes*? The cleanest translation might be: **Renunciation reveals a *conflict* within the want ledger, where multiple strong, incompatible wants are active.** The refusal is evidence of the *strength* of the *countervailing* want *and* the cost paid, hinting at the strength of the suppressed want.

  3.  **"Comparing Want Intensity Compositionally":**
      *   **Translation Attempt:** This is the clearest case of attempting the "interpersonal comparison of utilities" that economics deems impossible/nonsensical. Allocating sentences to Margot's loss vs. her brother's tells the reader whose loss *matters more to the narrative*, not whose loss *feels more intense to the characters* in some absolute, comparable sense.
      *   **Residue:** You are not measuring or comparing internal states. **You are performing a narrative act: constructing significance.** You decide whose loss *the chapter is about*. You use craft (sentence allocation, POV depth, imagery, emotional language) to *make* the reader *feel* one loss more acutely or deem it more central. This is about **authorial emphasis shaping reader perception**, not accessing comparable internal magnitudes.
      *   **Indictment?** This residue **indicts the expectation of comparison.** You aren't doing what economics says is impossible; you are doing something *different* and *fundamental to narrative*. You are not measuring "utility"; you are *orchestrating attention and emotional weight*. The craft vocabulary ("whose loss the chapter is *really* about") accurately describes your action. The economic vocabulary ("interpersonal comparison of utility") misapprehends it.

  **What to Do With Margot: Practical Craft Advice from the Friction**

  1.  **Honor Both Ledgers:** Maintain your internal "want ledger" (the deep, conflicted, evolving desires). But *respect* the "revealed preference ledger" (the choices made in each scene's menu). The tension *is* the character.
  2.  **Make the Renunciation Scenes "Costly":** Use the **cut-option test** ruthlessly here. When Margot refuses the promotion:
      *   **Show the Live Options:** What *else* is on the table? Safety? Avoiding her father's shadow? Protecting a colleague? Loyalty to a flawed mentor? Make these concrete *in the scene*.
      *   **Show the Leakage:** Subtext is key. *How* does she refuse? Is it too quick? Too elaborate? Does her gaze linger? Does she undermine the person who *does* take it? Show the psychic cost – a moment of stillness, a deflection into overwork, a sharp word to a loved one. This leakage is the "evidence" for the suppressed want *within the craft framework*.
      *   **Show the Shift in the "Budget Set" for Litigation:** What changes? Has the "cost" of her countervailing want (e.g., safety) decreased? (Is the original threat gone?) Has the promotion *itself* changed meaning? (Is it now the *only* way to achieve a newly vital want – e.g., undo an injustice, protect someone she cares about now?) Has the alternative (refusing) become *worse*? (Is she now humiliated? Has someone else taken it who is ruining things?) Crucially, **put a worse alternative beside it**. Maybe the *only* alternative left is utter capitulation or irrelevance. Suddenly, the litigated version (even under another name) becomes the least bad option *in that specific menu*, revealing a preference *for it* over the newly terrible alternatives.
  3.  **Structure the Arc Around Menu Constraints:** Margot's decade of refusal isn't about a static "don't want it." It's about the *constantly shifting balance* between her Want-for-Promotion (deep, perhaps suppressed) and her Want-for-X (safety, avoidance, etc.), played out against *changing scene menus*. The litigation is the moment when the menu changes drastically, making the previously outweighed Want-for-Promotion (or a close proxy) the dominant choice *revealed* by her action. The reader should feel: *Given what else was available to her THEN, she refused. Given what is available to her NOW, she fights. And the pain she showed THEN makes her fight NOW believable.*
  4.  **Composition for Comparison:** Continue allocating sentences wisely. To show Margot's want is *now* the load-bearing one, give the litigation its due weight, focus, and emotional texture relative to other plotlines. You are not comparing her utility to her brother's; you are telling the reader, *"This is Margot's moment of defining choice; pay attention here."*

  **In essence:** The economic model brilliantly describes the *logic of constrained choice* within a scene. Your craft vocabulary captures the *psychology of desire*, the *narrative arc across scenes*, and the *authorial construction of meaning*. Margot's power lies in the friction between these. Use the "cut-option test" to ensure each refusal and the final litigation are *justified by the specific menu of that scene*. Use subtext and the cost of refusal to signal the latent desire. Structure her journey around the *shifting constraints* that make the once-refused thing become the necessary choice. Her "real want" is the persistent potential that finally gets expressed when the scene menu aligns – and the story you tell is about *why* that menu changed, and what it cost her to wait.
