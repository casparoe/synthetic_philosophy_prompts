  Okay, the user is a grad student in cognitive science working on how people reason with conditionals. They need a critical analysis of a passage from a popular book on rationality, specifically about the indicative/counterfactual distinction. The passage makes strong claims: indicatives have no truth conditions and are purely probabilistic, while counterfactuals rely on possible-worlds semantics and can't handle probabilities. The user suspects some parts might be oversimplified or wrong, especially regarding truth conditions and world similarity.

  First, I need to unpack the passage claim by claim. The user wants a brainstorm of all potential objections before organizing them. Let's start with the claim that indicatives have no truth conditions due to Adams and Lewis. Adams did propose that assertability is tied to conditional probability, but that doesn't necessarily mean no truth conditions. Lewis's triviality results show issues with assigning probabilities to conditionals as propositions, but it doesn't outright deny truth conditions. Many theorists still defend truth-conditional accounts, like Stalnaker. Then there's the embedding issue—indicatives can sometimes embed under operators, though it's tricky. The passage oversimplifies this.

  Next, the book claims possible-worlds semantics don't apply to indicatives. But Stalnaker and others have unified accounts using possible worlds for both indicatives and counterfactuals. The difference might be in the accessibility of worlds rather than a complete divorce. The counterfactual part says antecedents are by definition false, but there are cases like the detective example where the antecedent isn't known to be false. Context-sensitivity is mentioned, but the passage underplays how much the similarity metric can shift with added details, as in the match-striking example. The poker standoff cases are presented as refuting truth conditions, but defenders of truth conditions have responses, like context shifts.

  The user's questions: Are the two kinds governed by different theories? Not entirely; there are unified approaches. The epistemic open vs. settled false contrast is shaky—counterfactuals can be used when the antecedent's truth is unknown. The book's conclusion that counterfactuals can't have probabilities is challenged by causal models using imaging or interventions. The user's prior about Lewis and Stalnaker offering unified semantics is correct; the field didn't entirely abandon that. The collapse narrative is exaggerated.

  For the cognitive science paper, the user should avoid claiming indicatives lack truth conditions or that counterfactuals can't have probabilities. They should clarify that the antecedent's epistemic status isn't the sole factor and note that adding details can change the closest worlds. The conclusion about counterfactual probabilities not being assessable is too strong given causal models in other fields. The key is to present the distinctions without over-simplifying the theoretical landscape.
answer: |-
  Below is a conceptual audit of the passage, structured as requested. I begin with an unsorted brainstorm of objections/qualifications, then address claims in order, flag unsettled areas, and finally answer your specific questions. Key points in **bold** for clarity.

  ---

  ### **Unsorted Brainstorm: Specialist Objections/Qualifications**
  1.  **"No truth conditions" for indicatives:** Adams' thesis concerns *assertability*, not necessarily truth; Lewis triviality targets *probabilities of truth*, not truth itself. Many theorists defend truth-conditional accounts.
  2.  **Embedding issues:** Indicatives *can* embed under some operators ("probably," negation, quantifiers) in restricted ways; non-propositional views struggle here but aren't universally accepted.
  3.  **"Possible-worlds semantics simply does not apply":** Stalnaker (and Lewis in some works) offers unified possible-worlds accounts for both indicatives and counterfactuals.
  4.  **Antecedent of counterfactuals "by definition false":** Counterfactuals can be used when the antecedent's truth-value is unknown (e.g., detective cases).
  5.  **"No probability to conditionalize on":** Counterfactuals *are* assigned probabilities in causal modeling (imaging, interventions), and philosophical accounts exist (e.g., Skyrms, Joyce).
  6.  **"Similarity ordering is fixed by facts":** Lewis emphasizes context-sensitivity; similarity metrics are *highly* flexible and conventional, not fixed by "world resemblance" alone.
  7.  **"Adding detail never overturns a true counterfactual":** Adding details *can* shift the closest worlds (e.g., match-striking vs. water-soaked match), invalidating earlier judgments.
  8.  **"Context-sensitivity is just scoring similarity respects":** Understates radical context-dependence; same antecedent can trigger different similarity orderings in different conversations.
  9.  **"Difference reduces to antecedent's epistemic status":** Oversimplifies; mood choice (indicative vs. subjunctive) also signals speaker's attitude toward alternatives, not just truth-value.
  10. **Poker standoff "refutes truth conditions":** Truth-conditional theorists (e.g., contextualists like von Fintel, Gillies) offer responses (e.g., context-shifting between utterances).

  ---

  ### **Claim-by-Claim Analysis**  
  *(Ordered by appearance in passage)*  

  1.  **"Two kinds... governed by completely different theories."**  
      *   **Status:** **Misleading/Overstated.** While Adams-style probabilistic and Lewis-Stalnaker possible-worlds accounts dominate their respective domains, unified theories exist (Stalnaker 1968; early Lewis). The *tools* differ (probability vs. similarity), but not necessarily the underlying logic.  
      *   **Qualification:** Research programs are distinct, but not "completely different" in foundations (e.g., both use probabilistic coherence or modal logic).

  2.  **"Indicatives have no truth conditions at all."**  
      *   **Status:** **Misleading/Wrong.** Adams' thesis is that indicative conditionals lack *truth-functional* truth conditions and their assertability is P(B|A). Lewis triviality shows that *if* they have truth conditions, their probability can't equal P(B|A) in all contexts. Many theorists (e.g., Stalnaker, Jackson) defend truth conditions.  
      *   **Unsettled:** Whether indicatives have truth conditions is **genuinely contested**. Proponents of "no truth conditions" (e.g., Edgington) remain influential, but truth-conditional views are live (e.g., Kratzer's restrictor approach).

  3.  **"Cannot be embedded... changing meaning"**  
      *   **Status:** **Fair simplification (with caveats).** Embedding *is* problematic for non-propositional views (e.g., "If A, then if B, C" puzzles). But truth-conditional accounts handle embedding systematically. General readers need not know details, but the claim overstates consensus.

  4.  **"Possible-worlds semantics simply does not apply to them [indicatives]."**  
      *   **Status:** **Misleading.** Stalnaker (1968) applies possible-worlds semantics to indicatives via a *contextually determined* accessibility relation (worlds epistemically possible for the speaker). This remains a major approach.

  5.  **"Counterfactuals... antecedent by definition false... probabilistic apparatus drops out."**  
      *   **Status:** **Misleading.** Antecedents aren't always known false (e.g., detective case). Probabilities for counterfactuals *are* defined in philosophy (via imaging) and causal modeling (via interventions).  
      *   **Unsettled:** Probability of counterfactuals is **actively researched** (e.g., in causal decision theory).

  6.  **"Lewis's account [of counterfactuals] is the standard one."**  
      *   **Status:** **Accepted (qualified).** Lewis (1973) *is* the benchmark, but Stalnaker's (1968) uniqueness assumption (exactly one closest world) and recent alternatives (e.g., premise semantics) are widely discussed.

  7.  **"Adding further detail... can never overturn a true counterfactual."**  
      *   **Status:** **Wrong.** Lewis explicitly addresses this: adding a *relevant* detail (e.g., "soaked in water") can change the similarity ordering, making previously distant worlds closest. If the new closest worlds lack the consequent, the original counterfactual is overturned.  
      *   **Example:** "If the match had been struck, it would have lit" vs. "If the match had been struck *after soaking in water*, it would have lit" – the latter defeats the former.

  8.  **"Context-sensitivity is just context settling which respects of similarity."**  
      **Status:** **Fair simplification.** This captures Lewis’s view, though it understates how dynamic and speaker-relative context can be.

  9.  **"Difference reduces to antecedent epistemically open vs. settled false."**  
      *   **Status:** **Misleading.**  
          *   **Detective counterexample:** "If he had been at the bar, the camera would have caught him" can be asserted even if the speaker doesn’t know he wasn’t there. Mood signals *treatment* of the antecedent (as counterfactual), not knowledge of falsity.  
          *   **Theoretical flaw:** The contrast is better explained by the *modal base* (epistemic for indicatives, factual for counterfactuals; Kratzer 1981) or *time of evaluation*.

  10. **"Poker standoff cases refute truth conditions outright."**  
      *   **Status:** **Misleading.** These cases (e.g., Gibbard’s Riverboat Sniper) challenge *truth-functional* accounts. Truth-conditional theorists use context-dependence (e.g., the set of relevant worlds shifts between utterances) or dynamic semantics to handle them. Not a refutation.

  ---

  ### **Answers to Specific Queries**  

  1.  **"Completely different theories"?**  
      No. Unified possible-worlds accounts (Stalnaker 1968) exist. Adams/Lewis triviality *motivated* divergence, but didn’t collapse unification—Stalnaker’s framework still handles both, with accessibility relations distinguishing them.  

  2.  **"Epistemically open vs. settled false" defensible?**  
      **No.** Fails the detective test (counterfactual with unsettled antecedent). Also fails the match test: adding detail *does* overturn counterfactuals by shifting similarity. The book’s similarity machinery *can* handle this (Lewis allows it), but its "never overturn" claim is false.  

  3.  **Probability of counterfactuals? Does book’s conclusion follow?**  
      **No.** Your friend is correct:  
      - **Imaging** (Lewis 1976): Shifts probability to closest A-worlds (unlike conditioning on A). Defines P(A □→ B).  
      - **Causal models** (Pearl, Woodward): Define P("Y would occur if X were done") via *interventions* (do(X)), distinct from conditioning.  
      The book wrongly infers "no probabilities" from "no conditional probability on a false antecedent." These approaches are real, compatible with Lewis semantics, and falsify the book’s claim that counterfactual probabilities are incoherent.  

  4.  **Your prior: Unified vs. collapsed programs?**  
      Your prior is **correct**: Lewis (1973) and Stalnaker (1968) offered unified possible-worlds semantics. Adams/Lewis triviality challenged *probabilistic* implementations for indicatives, not unification itself. The book distorts history by presenting the split as settled doctrine. Probabilistic approaches (e.g., McGee) and unified accounts remain active.  

  ---

  ### **Practical Rewrite Advice**  
  **Cut/rewrite:**  
  - "No truth conditions for indicatives" → Say instead: "Many theorists hold that indicative conditionals lack standard truth conditions; their acceptability is governed by conditional probability."  
  - "Adding detail never overturns counterfactuals" → Delete; it’s false.  
  - "Counterfactual antecedents by definition false" → Replace with: "Counterfactuals typically (but not always) presuppose the antecedent’s falsity."  
  - "No probability for counterfactuals" → Replace with: "Assigning probabilities to counterfactuals requires specialized tools (e.g., imaging), not simple conditioning."  
  - Poker cases as "refutation" → Frame as a *challenge* to truth-conditional views.  

  **Do not lean on:**  
  1.  The epistemic open/settled dichotomy as the *definitional* distinction.  
  2.  The claim that counterfactual probabilities are nonsensical.  
  3.  The "adding detail" immunity claim.  

  **Safe core for background section:**  
  > "Indicative and counterfactual conditionals are often analyzed with distinct formal tools. Indicatives are frequently tied to conditional probability (Adams 1975), with some theorists denying they express propositions with standard truth conditions. Counterfactuals are commonly evaluated via possible-worlds semantics (Lewis 1973; Stalnaker 1968), where truth depends on the consequent holding in closest antecedent-worlds. Key differences include the counterfactual’s typical presupposition of antecedent falsity and its sensitivity to contextually determined similarity metrics. Notably, adding information to the antecedent can alter which worlds count as closest, affecting truth judgments. While early unification attempts exist, the fields diverged partly due to probabilistic challenges (Lewis 1976)."  

  This preserves the book’s valid insights while excising errors and flagging complexities. For cognitive science, emphasize that *actual reasoning* may blend these formal distinctions.
