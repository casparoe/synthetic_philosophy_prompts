  Hmm, the user has a software background but is clearly philosophically sophisticated, having engaged with thinkers like Malcolm and Dennett. They're not looking for a simple answer but want to understand the structure of this problem. They've already ruled out some possibilities like mere verbal disputes or standard underdetermination. 

