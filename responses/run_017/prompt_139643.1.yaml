  - Phenomenal consciousness (what it's like-ness)
  - Access consciousness (availability to report)
  - Higher-order thought theories
  - Temporal transparency
  - Epistemic asymmetry

  Each has limitations. For instance, phenomenal consciousness doesn't resolve the timing issue in the museum dream case. Access consciousness doesn't help with the "tuning in" problem where the dream seems already in progress. 

  The user's third case about glancing at a desk is particularly interesting. It shows this isn't just about dreams but about consciousness in general. The key feature seems to be that the evidence trail is entirely contained within the system being examined. 

  I recall similar problems in philosophy of mind. Dennett's multiple drafts model comes close when he rejects the Cartesian theater. But the user says this isn't sufficient. Metzinger's phenomenal opacity might be relevant too - the idea that we can't introspect the mechanisms of consciousness. 

  After testing these against the cases, temporal opacity seems to capture the core issue: we can't observe when an experience was generated relative to when it seems to occur. This creates a fundamental epistemic gap. 

  The three hypotheses in the museum dream case all fit this pattern. The "never happened" version just extends temporal opacity to existence claims. And the inability to check is due to the evidence being part of the very process under examination - unlike checking a locked door where evidence exists outside the memory system.

  The user will want clear boundaries. Temporal opacity differs from mere scepticism because it's structural, not contingent. It differs from underdetermination because no future evidence could resolve it. And importantly, it doesn't imply there's no fact of the matter - just that we can't access it. 

  This connects to deeper issues in philosophy of mind about what consciousness is. The user seems to sense that this structural problem reveals something important about why consciousness debates persist. I should emphasize how temporal opacity makes certain questions fundamentally unanswerable with current evidence, which might explain why theorists like Malcolm and Dennett reach different conclusions while agreeing on the data.
answer: |-
  Your query isolates a profound structural problem in consciousness studies. After methodically testing conceptual candidates against your three cases, I identify the core phenomenon as **temporal opacity in phenomenal attribution**—the principled inability to determine *when* (or whether) a subjective state was instantiated relative to its apparent content. Below is the systematic analysis you requested.

  ### Brainstormed Candidates & Their Failures
  1.  **Phenomenal Consciousness (Nagel, Chalmers)**  
      *Concept:* The "what it's like" aspect of experience.  
      *Failure:* Agreed upon by both sides in your disputes. Doesn't resolve *when* the phenomenal property tokened (museum dream) or whether it tokened at all for unattended objects (desk case).

  2.  **Access Consciousness (Block)**  
      *Concept:* Information being globally available for report/reasoning.  
      *Failure:* Your cases show access (reportability) occurs upon waking or attention. Doesn't distinguish whether access *constituted* the experience or *reported* a prior state.

  3.  **Higher-Order Thought (Rosenthal)**  
      *Concept:* Consciousness requires a thought *about* a mental state.  
      *Failure:* In the "tuning in" dream, the HOT could be generated mid-narrative without corresponding first-order states, but your third hypothesis (no experience at all) isn't captured—HOT theories typically assume a target state.

  4.  **Temporal Transparency / Immunity to Error (Shoemaker)**  
      *Concept:* First-person reports about current experiences are infallible.  
      *Failure:* Your cases exploit *retrospective* reports (dream recall) or ambiguous "present" states (desk glance). Transparency fails for temporal location.

  5.  **Epistemic Asymmetry (McGinn)**  
      *Concept:* First-person access to consciousness is irreducible and private.  
      *Failure:* Explains *why* we can't check from outside, but doesn't characterize the *structure* of the hypotheses or why they are empirically equivalent.

  ### The Successful Concept: Temporal Opacity in Phenomenal Attribution
  **Definition:** The inability to determine—even in principle—the precise temporal location (or ontological grounding) of a phenomenal state relative to its neural correlates or reported content, due to the *evidential confinement* of all data to the output of the very system under question.  

  **Key Features:**  
  - **Evidential Confinement:** All evidence (reports, memories, neural data) is produced by the cognitive system whose operation is in question. The system generates both the "experience" *and* the traces used to infer it.  
  - **Temporal Indeterminacy:** The "when" of consciousness is underspecified—it could be during processing, at report, or not at all.  
  - **Collapse of Verification:** No "view from nowhere" exists to break the symmetry (unlike checking a locked door).  

  ### Testing Against Your Cases
  1.  **Museum Dream:**  
      - Hypothesis 1 (real-time experience): Phenomenal state during REM.  
      - Hypothesis 2 (retrospective construction): Phenomenal state at waking.  
      - Hypothesis 3 (no experience): Report generated without phenomenality.  
      *Temporal opacity:* All evidence (memory, neural activity during sleep/waking) is produced by the same system. No independent clock exists to timestamp phenomenality.  

  2.  **Tuning-In Dreams:**  
      - The "earlier" dream segments illustrate *temporal displacement*—the question of whether phenomenality preceded access or was fabricated with apparent history.  
      *Opacity extends to existence:* The "never happened" variant shows temporal opacity can collapse into *ontological opacity* for unreported content.  

  3.  **Desk Glance (Perceptual Richness):**  
      - Attended object: Clear phenomenality.  
      - Unattended objects: Did they have *faded* phenomenality (Block's "phenomenal overflow"), *no* phenomenality until queried, or are reports generated without prior states?  
      *Same structure:* All evidence (e.g., "I saw it when you asked") is system-generated output.  

  ### Boundaries & Contrasts
  1.  **"When" vs. "Whether" Questions:**  
      - They share the *same structure* of evidential confinement. The third hypothesis ("never happened") is the limiting case of temporal opacity: if phenomenality cannot be temporally located *anywhere*, it may not exist.  
      - *Difference:* "Whether" questions introduce stronger metaphysical stakes (e.g., if no phenomenality occurred in dreams, their moral weight changes).  

  2.  **Why Mental Cases Block Verification (vs. Locked Door):**  
      - **Locked Door:** Evidence exists *outside* the memory system (the door's physical state).  
      - **Mental Cases:** All evidence is *produced by* the consciousness-generating system. A "complete neural readout" would only show *when information was processed*, not when it was "experienced." The dispute would shift to interpreting neural patterns (e.g., "Is *this* pattern the neural correlate of phenomenality?"), perpetuating the opacity.  

  3.  **Nearby Concepts & Distinctions:**  
      - **Underdetermination of Theory by Data (Quine):**  
        *Similarity:* Multiple hypotheses fit the data.  
        *Difference:* Standard underdetermination allows for *future* evidence to break ties (e.g., new instruments). Temporal opacity is *principled*: no future evidence can resolve it because all data is system-bound.  
      - **Introspective Skepticism (Dennett):**  
        *Similarity:* Doubts about first-person reports.  
        *Difference:* Skepticism focuses on reliability; opacity is about the *impossibility of temporal/ontological grounding* even with perfect introspection.  
      - **Metaphysical Vagueness:**  
        *Similarity:* Indeterminacy in boundaries.  
        *Difference:* Vagueness concerns *fuzzy categories* (e.g., "heap"); opacity concerns *epistemic access* to temporal facts.  

  ### Status of the Question: Metaphysical or Epistemic?
  - **Not Semantic:** The disagreement isn't about word meanings (as you noted with tabooing).  
  - **Not Merely Epistemic:** If temporal opacity is inherent to consciousness (due to evidential confinement), it suggests a **metaphysical indeterminacy**—there may *be* no fact about "when" experience occurs, because "experience" isn't an event with a precise timestamp in neural processing.  
  - **What Would Settle It?** Only a theory that *redefines* consciousness in non-temporal terms (e.g., Dennett's "cerebral celebrity") or denies its existence (illusionism). Absent that, the opacity persists.  

  ### The Carving: Why This Matters
  Temporal opacity reveals that debates about the "timing" of consciousness (dreams, rich perception) are not empirical but *explanatory*. Competing theories (e.g., real-time phenomenality vs. retrospective "filling-in") are empirically equivalent *descriptions* of the same system. The choice between them depends on:  
  - **Explanatory Priorities:** Is consciousness a "prime mover" (influencing cognition in real-time) or an "after-the-fact summary" (for report/memory)?  
  - **Metaphysical Commitments:** Does phenomenality require a biological substrate (rejecting Hypothesis 3), or can it be eliminated?  

  **Conclusion:** Your "structural feature" is **temporal opacity in phenomenal attribution**. It belongs to a broader literature on the epistemology of consciousness (Metzinger's *phenomenal opacity*, Dennett's *heterophenomenology*), but your cases crystallize its temporal dimension. Its edges are defined by evidential confinement, which renders "when" questions (and their "whether" variants) inherently unresolvable—not due to ignorance, but the nature of consciousness itself.
