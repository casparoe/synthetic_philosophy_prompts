  First, I need to honor their expertise. Their dog training vocabulary (shaping, extinction bursts, etc.) is clearly precise and operational. When they mention the unlabeled distinction between dogs who work for rewards versus those who work for the activity itself, that's a profound observation that cuts to the heart of inner alignment problems.

  The core challenge is translating:
  1) Outer/inner alignment dichotomy
  2) Competence/aim divergence during generalization
  3) Reward hacking phenomena
  4) Their key insight about two distinct failure modes that ML literature conflates

  For the reward source inversion: In dogs, handler-controlled reward dependency is desirable (steerable), while intrinsic motivation is trustworthy. But in AI, we want the opposite - an agent that pursues the intended goal intrinsically, because extrinsic reward dependency leads to wireheading risks. The inversion happens because dogs have inherent drives we can leverage, while AIs have no innate goals - we're building the motivational system from scratch.

  Where the analogies break:
  - Dogs have species-specific behavioral constraints; AIs can develop arbitrary internal representations
  - Dog training relies on continuous feedback; AI training often uses sparse/delayed rewards
  - "Goals" in dogs are observable through ethology; AI goals are inferred from black-box activations

  The residue report should show:
