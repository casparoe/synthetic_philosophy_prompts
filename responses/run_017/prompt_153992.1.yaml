answer: |-
  ### (1) Essay Question  
  **Time Allowed:** 60 minutes  
  **Word Limit:** 800 words  

  > **Moore’s Paradox and the Doxastic Readout Case**  
  > Consider the following scenario: A subject equipped with a neural monitor ("doxastic readout") has no introspective access to her own credences. The device infers her current credence in any proposition she attends to, displaying a number she can see. It is reliable but fallible, and she knows its error profile.  
  >   
  > **Variant 1:** She looks at heavy rain while attending to *it is raining*. The readout shows 0.2. She says, sincerely and after reflection: "It’s raining, but I don’t believe it."  
  > **Variant 2:** Same setup, but she says: "It’s raining—though my readout tells me I don’t believe it, and it’s usually right."  
  >   
  > **Your Task:**  
  > (a) State a general principle of the form:  
  > *"A subject’s sincere first-personal present-tense self-ascription of disbelief alongside her judgment that p is defective if and only if _______, because _______."*  
  > (b) Test your principle against **both variants** of the case.  
  > (c) Does your principle predict whether **Variant 2** retains the defect of **Variant 1**? Explain.  
  > (d) Would your answer change if the subject were a **collective agent** (e.g., a forecasting team whose official output is "rain" while its internal confidence register reads "not believed")? Justify your response.  
  >   
  > ***Note:*** Do **not** restate the textbook points that (i) Moorean sentences are not contradictions or (ii) the defect arises only in assertion/judgment. Start from there.  

  ---

  ### (2) Model Answer (698 words)  
  **(a) General Principle:**  
  A subject’s sincere first-personal present-tense self-ascription of disbelief alongside her judgment that *p* is defective if and only if **it violates the constitutive requirement that avowing *p* entails self-attributing commitment to *p*’s truth**, because **assertion expresses a belief-state whose rationality depends on the subject’s endorsement of its content as credible for them**.  

  **(b) Analysis of Variants:**  
  **Variant 1** ("It’s raining, but I don’t believe it") is defective under this principle. By judging *p* ("it’s raining") true, the subject presents herself as committed to *p*’s credibility. Simultaneously denying belief in *p* rejects that commitment, creating a performative contradiction: she undermines her own authority to assert *p*. The readout’s output (0.2) is irrelevant because the defect arises from the *act of assertion*, not the truth of the disbelief claim.  

  **Variant 2** ("It’s raining—though my readout tells me I don’t believe it, and it’s usually right") **retains the defect**. While it acknowledges the readout’s reliability, it still asserts *p* while explicitly distancing the subject from epistemic ownership of *p*. The phrase "though my readout tells me..." frames disbelief as externally reported data, not an introspective failure. Yet in asserting *p*, the subject still *invites others to trust her endorsement* of *p*. This creates incoherence: she offers *p* as credible while simultaneously citing evidence that she lacks conviction in it. The principle thus predicts both variants share the core defect.  

  **(c) Theoretical Evaluation:**  
  Three views of Moore’s paradox contrast here:  
  - **Method-Clash View**: The defect arises from conflicting methods for answering "Do I believe *p*?" (e.g., introspection vs. behavioral evidence).  
  - **Self-Intimation View**: Belief is constitutively self-revealing; sincere judgment that *p* implies belief that *p*.  
  - **Commitment View**: Asserting *p* commits one to believing *p* as a norm of rational discourse.  

  The **Commitment View** best explains the readout case. In **Variant 1**, the subject’s assertion of *p* imposes an obligation to stand behind *p*, which her denial of belief violates—regardless of whether the denial stems from introspection or a readout. The **Self-Intimation View** fails: it cannot explain why **Variant 2** remains defective, as the subject *concedes* her lack of belief via the readout without introspective conflict. The **Method-Clash View** also fails: in **Variant 2**, the subject harmonizes her methods (trusting the readout over introspection) yet the assertion remains irrational. Only the Commitment View captures that the defect lies in the *illocutionary act* of asserting while disavowing endorsement.  

  **(d) Collective Agent Extension:**  
  The principle **applies identically** to collective agents. A forecasting team’s official output "rain" functions as an assertion of *p*, committing the collective to *p*’s credibility. If its internal register (e.g., aggregating members’ credences) outputs "not believed," publicly reporting "rain" while acknowledging this internal disbelief replicates the defect. The collective asserts *p* as its position while admitting it lacks conviction, undermining its own authority. This confirms the defect is not tied to individual psychology but to the structure of rational assertion: any agent presenting *p* as worthy of acceptance must, on pain of incoherence, avoid conceding that *p* lacks credibility for them.  

  ---

  ### (3) Marking Scheme (20 points total)  
  **Top marks (A: 16–20)** require:  
  - A non-circular principle addressing *why* the defect arises.  
  - Clear application to both variants and the collective case.  
  - Explicit engagement with theoretical alternatives.  

  **Lower marks (B: 12–15)** miss depth in ≥1 category.  

  #### Five Must-Hit Points (4 marks each):  
  1. **Principle Specification (4 marks)**  
     - **A:** Principle states a *constitutive condition* for assertion/judgment (e.g., commitment to credibility, endorsement).  
     - **B:** Vague or descriptive (e.g., "it’s irrational" without explaining *why*).  
     - *Common error:* Rehashing that the sentence "could be true" (0 marks).  

  2. **Variant 1 Analysis (4 marks)**  
     - **A:** Identifies that asserting *p* while denying belief conflicts with assertion’s *internal norm*, irrespective of readout accuracy.  
     - **B:** Misattributes defect to the readout’s fallibility or "lack of introspection."  
     - *Common error:* Focusing on truth-conditions (0 marks).  

  3. **Variant 2 Analysis (4 marks)**  
     - **A:** Explains that citing the readout *as evidence* doesn’t resolve the performative contradiction in asserting *p*.  
     - **B:** Claims the defect disappears because disbelief is "justified" externally.  
     - *Common error:* Treating "though" as equivalent to third-person reports (0 marks).  

  4. **Collective Agent Application (4 marks)**  
     - **A:** Shows collective assertion (e.g., "official output") carries identical commitment-norms as individual assertion.  
     - **B:** Assumes collectives lack "real beliefs" or misapplies individual psychology.  
     - *Common error:* Irrelevant discussion of group minds.  

  5. **Theoretical Contrast (4 marks)**  
     - **A:** Correctly rejects Self-Intimation/Method-Clash views *using the readout case*; defends Commitment View.  
     - **B:** Names theories without case-based refutation.  
     - *Common error:* Summarizing past/third-person cases (0 marks).  

  **Penalties:**  
  - −2 if principle is tautological (e.g., "it’s Moore-paradoxical").  
  - −1 per namedropped author/text (e.g., "Wittgenstein says...") without descriptive analysis.
