answer: |-
  ### Conceptual Mapping of the Phenomenon: The Provenance Paradox  
  *Brainstorming Candidate Framings*  

  1. **Folklore Revivalism as Generative Anachronism**  
     - Captures: The sincere, often amateur-driven resurrection of practices believed lost, and their subsequent naturalisation.  
     - Drops: The *evidential loop* (how documentation becomes proof of antiquity) and *institutional amplification* (competitive diffusion via funding/tourism).  
     - Focus: Motive (rescue) and outcome (cultural integration), but obscures the epistemological inversion.  

  2. **Retrospective Traditioneering**  
     - Captures: The active construction ("engineering") of tradition using archival fragments, and its reclassification as ancient via temporal distancing.  
     - Drops: *Downstream uptake* as lived culture (overemphasises construction, underplays organic adoption) and *cross-boundary borrowing* (fixates on assembly, not hybridisation).  
     - Focus: Agency in stitching practices, but neglects the role of institutional ecosystems in validating/replicating them.  

  3. **Authenticity Feedback Loop**  
     - Captures: The cyclical process where documentation creates the practice, which then authenticates the document’s status as a "record" rather than an origin point.  
     - Drops: *Competitive diffusion* (reduces to localised recursion) and *reclassification* (doesn’t explain *why* the document’s status shifts).  
     - Focus: The self-reinforcing loop, but undersells how gaps in evidence become functional to the claim.  

  4. **Provenance Paradox** (Selected Framing)  
     - Captures: **All six features**. Centres the contradiction wherein the act of preserving/reviving *generates* the very evidence used to prove the practice’s pre-existence. The "provenance" (origin) is paradoxically created by the process of documenting it.  
     - Why it fits:  
       - **Loop**: Documentation produces practice → practice authenticates document.  
       - **Reclassification**: Origin texts become "oldest records" via generational forgetting/label shifts.  
       - **Evidential inversion**: Absence of prior evidence signals universality ("everyone knew it").  
       - **Downstream uptake**: The paradox embeds the practice in social life, making it "traditional."  
       - **Boundary borrowing**: Imports are camouflaged by recontextualisation as local.  
       - **Competitive diffusion**: Institutions (tourism boards, funders) reward practices with ambiguous paper trails, accelerating replication.  

  ---

  ### Defining the Provenance Paradox  
  **Core Mechanism**: A practice emerges from reconstructive documentation (collection, revival, or assembly). Subsequent generations misinterpret this documentation as evidence of the practice’s antiquity, thereby erasing its generative moment. The absence of earlier records is reinterpreted as proof of the practice’s deep-rooted, self-evident nature.  

  **Boundaries**:  
  - **IN**: Practices where:  
    - Documentation is the *origin point* but later treated as a *surviving record*.  
    - Antiquity is inferred from gaps in evidence.  
    - Material is borrowed but rebranded as autochthonous.  
    - Institutional recognition (e.g., heritage listings) fuels regional imitation.  
  - **OUT**:  
    - **Genuine survivals**: Documented continuously, with no "stitching" phase.  
    - **Top-down invented traditions**: Fabricated by elites without grassroots revival motives (e.g., coronation rituals).  
    - **Folklorismus**: Commercially staged "traditions" with no community uptake.  
  - **NEAR-MISSES**:  
    - *Retrospective continuity* (e.g., Victorian Christmas traditions): Similar but lacks the *evidential loop* (no document becomes proof of itself).  
    - *Second-hand folklore* (e.g., printed broadsides shaping oral tradition): Captures borrowing but not the *reclassification* of origins.  

  ---

  ### Adjacent Concepts: How the Provenance Paradox Differs  
  | **Concept**          | **What It Captures**                     | **What It Drops**                              |  
  |----------------------|------------------------------------------|-----------------------------------------------|  
  | **Invented Tradition** | Elite-driven symbolic fabrication.       | Grassroots motives, evidential loop, uptake.  |  
  | **Folklorismus**     | Commodified "tradition" for outsiders.   | Sincerity of revival, integration into community life. |  
  | **Retrospective Nationalism** | Backdating cultural unity.          | Material mechanics of assembly/revival.       |  
  | **Survival**         | Genuine continuity of practice.          | The generative role of documentation.          |  

  **Best Fit**: *Provenance Paradox* subsumes the critical elements these omit: the *epistemological circularity* and the *social alchemy* turning newness into antiquity.  

  ---

  ### Addressing Key Questions  
  **1. Does the loop apply to genuinely old practices?**  
     - Yes, if the *evidential mechanism* operates identically. Example: A dance *actually* from 1820 but only documented in 1900 might still trigger the paradox if the 1900 record is later miscategorised as a "fragment" of the older whole, and gaps pre-1900 are used as proof of its primordiality. The phenomenon is defined by the *social processing of evidence*, not the practice’s factual age.  

  **2. Discriminating "Real" Antiquity in Principle**:  
     - **Smoking-gun evidence**: A contemporary source explicitly stating the practice is *newly created* (e.g., the 1933 booklet). Crucially, this is often ignored or re-read as "recording" pre-existing lore.  
     - **Comparative ethnography**: If neighbouring areas lack analogous practices before the "revival," it suggests borrowing/creation.  
     - **Material forensics**: E.g., textile analysis showing all headdresses postdate the 1952 reconstruction.  
     *But*: The paradox *thrives* where evidence is sparse—its core move is converting absence into proof.  

  **3. Is "Debunking" the Origin Beside the Point?**  
     - **Yes—with qualifications**. The fourth feature (downstream uptake) means the practice *becomes* traditional through use, irrespective of origins. Calling it "invented" misses:  
       - Its present-day cultural functions (binding communities, marking rites of passage).  
       - The *authenticity of adoption*: A practice sewn together in 1933 but woven into lived experience by 2023 *is* a tradition.  
     - **The Real Critique**: Not of the practice’s "fakeness," but of:  
       - **Institutional naiveté**: Heritage bodies mistaking the paradox for proof of antiquity.  
       - **Monopolisation**: Competitive diffusion crowds out organic or diverse expressions.  
     - **Practical Implication**: Your role is not to "expose" origins but to document the *entire lifecycle*—including the reconstruction moment—to show how traditions are dynamically made.  

  ---

  ### Conclusion: The Value of "Provenance Paradox"  
  This framing uniquely handles the *dialectic of documentation and belief*: the archive spawns the tradition that consecrates the archive. It explains why "debunking" often fails—the practice’s origins are irrelevant to its current social efficacy—while critiquing the structures (funding criteria, tourism) that incentivise historical flattening. The paradox is not a flaw but an engine of cultural vitality: communities *need* depth, even when fabricated, to anchor belonging. Your cases reveal tradition not as a fossil but a palimpsest—continually rewritten, with the earliest layers often the most recent inventions.
