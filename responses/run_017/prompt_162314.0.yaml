prompt: |-
  So I fell into this via a book about vision and I've been going around in circles on it for a couple of weeks, and I can't work out whether what I keep bumping into is a real thing that has a name or whether I've just confused myself.

  The starting case, in case it matters: a red dot flashes on the left, a green dot flashes on the right something like a tenth of a second later, and what you actually see is a single dot sliding across that turns green partway along — at a place where nothing was ever shown at all. Same shape of thing in the touch version: taps at your wrist and then further up your forearm, and you feel taps hopping up your arm through spots that were never touched, with the hopping well under way before the later taps land.

  What I keep noticing is that whenever people talk about these, the discussion collapses into a shootout between two stories. Either you really did have the first, unrevised experience at the time, and then once the later stimulus came in the record got rewritten, so what you now have access to is a doctored version. Or nothing reached you at all until the later stimulus came in, and the experience got written once, late, and merely got dated to the earlier moment. And then the standard move is to say the two are indistinguishable in principle and leave it there. I gather both stories have names. I don't want a name for either of them.

  What I want is a name for what's left over, because the cases I can't shake don't seem to me to fit either story, and they don't seem to be merely undecidable either:

  1. When I try to spell out what the difference between the two stories would actually consist in, it evaporates on me. Everything downstream — what you say, what you press, what you later remember, what's happening in your head — comes out identical either way. But I don't want to conclude from that that there's no fact about what you experienced, because plainly there is: you saw one dot change colour mid-flight, you didn't see a green dot pop into existence out of nowhere. So the missingness seems to be specifically about the *when*, with the *what* totally fine. Is there a concept for that particular kind of missing fact, as opposed to (a) us simply not knowing which story is true, and (b) the much stronger claim that experiences don't have times at all?

  2. The version that really bugs me: imagine two ways of probing the same trial disagree — say a reaction-time measure looks like the subject had the pre-rewrite content early, while something else (a forced choice, a neural marker, whatever) says the finished content only came online late. I genuinely don't know what to call that. Two drafts? One experience happening twice? One experience plus some unconscious processing that isn't experience? Or is it evidence that "when the experience happened" was never a single number to begin with? And is that the same phenomenon as (1) with extra machinery bolted on, or a separate one that deserves its own treatment?

  3. And a smaller thing: subjects in this kind of setup sometimes report that something felt off but can't say what or when — they don't report the pre-rewrite content, just a vague wrongness. Does that residue have a name, and does it carry any argumentative weight at all, or is it just more constructed content with no special status?

  I'm not after a label, I'm after the carving: what exactly this is, which of the nearby ideas it is and isn't, and where its edges are. If nothing established covers it, coin something and give me the definition plus the cases that should and shouldn't count. Also: what observation, if any, would move me from "we can't tell" to "there's nothing to tell"? And I can't look anything up, so please don't tell me who to read or what to cite — I want the shape of the thing, not references.
reasoning: |-
  Okay, let me unpack this user's query. They're stuck on a problem from a book about vision, specifically the flash-lag effect and its tactile equivalent. The core issue is the temporal ambiguity in perception: when exactly does the experience happen? They've encountered two standard explanations—postdiction and delayed conscious access—but neither satisfies them because both seem indistinguishable in practice. 

  The user has three specific concerns. First, they feel the difference between the two theories evaporates when examined closely. Everything downstream is identical, yet there's a clear experiential fact: the moving dot changing color. They want to know if there's a concept for this "missing when" without denying the "what." 

  Second, they're troubled by cases where different probes conflict—say reaction time suggests early access while neural markers show late completion. Is this evidence for multiple temporal layers? 

  Third, they ask about vague subjective reports of something feeling "off"—does this residue have significance? 

  The user explicitly wants conceptual carving, not labels or references. They’re clearly deep in the weeds of philosophy of mind and perception science, frustrated by the circular debates. Their tone is meticulous but weary ("going in circles for weeks"). 

  Hmm. Underneath this, I suspect they’re wrestling with a meta-problem: how to articulate temporal indeterminacy without collapsing into anti-realism about experience. They reject both "it’s rewritten" and "it’s delayed" as incomplete, and they’re allergic to the glib "indistinguishable in principle" conclusion. 

  For part 1, Temporal Indeterminacy feels right. It’s not that we don’t know the timing (epistemic), nor that experience is timeless (metaphysical), but that the timing itself isn’t fixed. Like quantum superposition for time—the "when" isn’t settled until probed. 

  For part 2, Temporal Decomposition fits. Conflict between probes isn’t contradiction; it’s revealing components with different latencies. The reaction time taps the early wave, the forced choice the late consolidation. 

  For part 3, Temporal Discordance captures the "off" feeling—not content residue but a metacognitive flag of temporal inconsistency. 

  Key boundaries: This isn’t about memory distortion (post-hoc confabulation) or timeless qualia. The "nothing to tell" scenario would require all probes to align perfectly across contexts—which never happens. 

  …I’ll structure the reply to mirror their three points, define each concept operationally, and emphasize the non-collapse into existing dichotomies. They want the *shape* of the thing—so I’ll sketch it cleanly.
answer: |-
  Here's a conceptual carving of the phenomenon you're grappling with, structured around your three core questions. This isn't just relabeling; it's defining the distinct ontological and epistemic territory you've uncovered:

  ### 1. The Evaporated Difference & The "Missing When"
  - **The Concept:** **Temporal Indeterminacy of Phenomenal Binding**
  - **Definition:** A state where the *content* of a conscious percept (e.g., "a dot moving and changing color") is unequivocally real for the subject, but the precise temporal locus of binding (when disparate sensory inputs coalesced into that unitary percept) is fundamentally unresolved in the neural/computational process. It is not merely unknown, but ontologically underspecified.
  - **Why it's neither (a) nor (b):**
    - It rejects (a) "we just don't know" because the evidence suggests there *is no single timestamp* for the binding event in the system.
    - It rejects (b) "experiences have no times" because the percept *does* have temporal extension and causal efficacy (you react to the motion), but its genesis isn't point-like.
  - **Edges/Boundaries:**
    - *Not* postdiction (retroactive rewriting) or delayed consolidation (late creation). Both imply a *resolved* timeline (either early-then-altered or late-then-backdated). Temporal Indeterminacy says the timeline *was never resolved*.
    - *Applies when:* Content is stable and reportable, but temporal markers (neural or behavioral) for integration conflict or are absent.
    - *Doesn't apply when:* Content itself is ambiguous or unreportable, or when probes definitively show a clear sequence of revisions.

  ### 2. Conflicting Probes & Non-Unitary Timing
  - **The Concept:** **Temporal Decomposition**
  - **Definition:** The demonstration that different aspects of a *single conscious percept* (its sensory registration, its feature binding, its reportability, its motoric influence) achieve "phenomenal availability" at distinct, measurable times. There is no single "moment of experience," but a cascade of partially overlapping processes contributing to the final unitary feeling.
  - **Interpretation of Your Example:** The reaction-time measure reflects the *initiation of motion processing* (early wave), while the forced-choice/neural marker reflects the *finalized color-motion binding* (late wave). The "experience" is the entire cascade, not a snapshot.
  - **Relation to (1):** Temporal Decomposition is the *mechanistic basis* revealing *why* Temporal Indeterminacy exists. The indeterminacy arises because the system doesn't assign a single timestamp to the cascade. Decomposition shows the cascade's parts have different timings.
  - **Edges/Boundaries:**
    - *Not* "two drafts" (which implies discrete, potentially competing *contents*). Decomposition is about *stages of resolution* of a *single content*.
    - *Not* "unconscious processing + conscious experience." Some decomposed stages *are* components of the conscious percept (e.g., early motion signal influences behavior *as part of* the motion experience).
    - *Key Diagnostic:* If a probe (e.g., reaction time) reliably accesses an *aspect* of the final percept (like motion direction) *before* probes accessing a *bound feature* (like color-at-location), it's decomposition.

  ### 3. The Vague "Offness" Residue
  - **The Concept:** **Temporal Discordance Signal**
  - **Definition:** A low-fidelity metacognitive signal generated when the timing of component processes (revealed by decomposition) falls outside the expected/optimal range for seamless binding. It signals "binding was effortful or anomalous" without providing access to the unbound precursors.
  - **Status & Weight:**
    - It *is* constructed content, but it's a *meta-signal about the binding process itself*, not about the external stimulus.
    - It carries *indirect* argumentative weight: It confirms the perceptual system detected an anomaly consistent with Temporal Decomposition/Indeterminacy. Its *absence* in clean trials is also informative.
    - It *does not* provide evidence for the "pre-rewrite" content. Subjects cannot describe the "what" that felt off, only the "how" of integration.
  - **Edges/Boundaries:**
    - *Not* "subliminal perception" of the first stimulus. The residue doesn't contain that content.
    - *Not* generic uncertainty. It's a specific feeling of temporal glitchiness tied to the binding window.
    - *Contrast with:* A clear report like "I saw a red flash then a green dot" – this is a *failure* of binding, not a Discordance Signal.

  ### Moving from "Can't Tell" to "Nothing to Tell"
  - **The Decisive Observation:** **Universal Temporal Coincidence Across Probes.**
    - If *every* conceivable probe (neural signatures of specific content, early behavioral responses, subjective reports at variable delays, metacognitive judgements) consistently pointed to the *exact same moment* for the onset of the *entire bound percept* – regardless of task, attention, or probe type – *then* Temporal Indeterminacy/Decomposition could be rejected. There would be a single, definitive "when" for the "what." This is empirically implausible given known neural latencies.
  - **Why "Nothing to Tell" is Unlikely:** The very nature of distributed neural processing (different pathways, different latencies for different features) makes Universal Temporal Coincidence biologically improbable. Temporal Decomposition is the expected norm. Indeterminacy arises because asking "When did the experience happen?" presupposes a simplicity that doesn't exist.

  ### The Big Picture Carving
  You've identified a core feature of perception: **Conscious percepts are unified products of temporally distributed processes.** The standard "postdiction vs. delayed consolidation" debate is a false dichotomy born of trying to force this distributed process into a single timestamp. The phenomena you describe reveal:

  1.  **Content Binding ≠ Temporal Point:** A percept can be definite while its assembly time is indefinite (**Temporal Indeterminacy**).
  2.  **Experience is a Temporal Structure:** Different facets become available at different times, contributing to the whole (**Temporal Decomposition**).
  3.  **The System Monitors Its Own Binding:** Anomalies in the assembly process generate a feeling of wrongness (**Temporal Discordance Signal**).

  This framework doesn't require choosing between "rewritten" or "delayed." It dissolves the conflict by showing the question "Which timestamp is the *real* one?" is malformed. The "when" is inherently spread out. The "what" emerges from that spread. The residue is the system noting the stretch.
