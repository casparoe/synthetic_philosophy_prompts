answer: |-
  Right, let's tackle this through reflective equilibrium – building a principle that fits your judgments while resolving the tension between (ii) and (vi). Your proposed starting point (promisee's claim via uptake, defeated only by...) is sound; the crucial work lies in defining "uptake" and specifying the *defeaters*.

  **The Derived Principle ("The Claim-Uptake Principle")**

  A promise creates a binding obligation if and only if:

  1.  **Uptake Occurs:** The promisee, through words or conduct reasonably interpretable at the time of promising, manifests an understanding that a commitment has been made *to them* and that this alters their normative landscape (e.g., creates reliance, expectation, or a perceived right).
  2.  **The Claim Persists:** The normative claim on the promisor (the obligation to act because one promised) remains undefeated.
  3.  **Defeaters:** The claim is defeated *only* if:
      a.  **Release:** The promisee explicitly releases the promisor from the obligation *and this release is communicated to the promisor*; OR
      b.  **Invalidation:** The promisee, by their own subsequent actions or fundamental change in status, renders the *basis* or *purpose* of the promise fundamentally null and void, such that fulfilling it serves no coherent purpose related to the original commitment *and* the promisee cannot reasonably expect performance. (This includes death, where the personal claim dies with them unless tied to a specific, surviving project or duty).
      c.  **Impossibility:** Performance becomes genuinely impossible (not merely inconvenient or revealed as undesirable).

  **Application to Your Cases & Clause Identification:**

  *   **(i) Grad Student Reference:** **Bound.** *Uptake:* Implied by the context of the request/promise (student likely relied/expected). *Claim Persists:* No defeater. Student's forgetfulness isn't release or invalidation. *(Clauses: 1, 2 - No 3 triggered)*
  *   **(ii) Colleague Sabotage:** **Not Bound.** *Uptake:* Occurred. *Claim Defeated:* Colleague's covert actions fundamentally invalidate the *basis* of the promise (collaborative authorship). Performing (writing a co-authored paper when colleague actively prevents collaboration) serves no coherent purpose related to the original commitment. *(Clauses: 1, 3b - Invalidation)*
  *   **(iii) Dying Mother:** **Bound.** *Uptake:* Occurred (emotional pressure doesn't negate understanding/claim creation). *Claim Persists:* Mother's death ends her *personal* claim, but the promise created an obligation *to her* at the time. Your *moral* discomfort is separate from the *obligation's existence* per your verdict. *(Clauses: 1, 2 - No 3 triggered. Death ends the claimant, but the obligation existed and its breach has weight).*
  *   **(iv) Partner Letters/Biography:** **Bound, but gives way.** *Uptake:* Occurred. *Claim Persists:* Partner's death ends her personal claim *to non-reading*. *However*, the conflicting promise *to her* regarding the biography creates a new normative demand *related to her wishes*. The *first promise's claim is defeated* (3b - death), but the *biography promise creates a surviving claim* that overrides the residual *sense* of the first. The "binding sense" is the *ghost* of the original obligation, superseded by the active claim of the later promise. *(Clauses: Original Promise: 1, 3b (invalidation by death). Biography Promise: 1, 2 (active claim). Conflict resolved by priority/current claim).*
  *   **(v) Promise to "The Department":** **Bound.** *Uptake:* Occurred collectively (members present understood a commitment was made to the *role/function* of the department). *Claim Persists:* The department, as an enduring institution, retains the claim. The obligation is to the *role/office*, not the individuals. *(Clauses: 1 (collective uptake to institution/role), 2 - No 3 triggered).*
  *   **(vi) Friend's Silent Waiver:** **Bound.** *Uptake:* Occurred. *Claim Persists:* The friend's uncommunicated change of mind does *not* constitute release (3a) or invalidation (3b). The *basis* of the promise (e.g., to do X for friend Y) remains intact; friend Y simply no longer wants it, but hasn't nullified the reason for the promise. Release requires communication. *(Clauses: 1, 2 - No 3 triggered. Uncommunicated waiver ≠ release/invalidation).*
  *   **(vii) Ceremony, No Understanding:** **Not Bound.** *Uptake FAILS:* No one present, including the promisor, understood a commitment was made *to a specific promisee* about *specific content*. Without uptake, no normative claim is established. *(Clause 1 fails).*

  **Resolution of (ii) vs. (vi):** The principle resolves the tension:
  *   **(vi):** The promisee's *uncommunicated attitude* (no longer wanting the promise kept) does **not** constitute an action that *invalidates the basis* of the promise (Clause 3b). The promise was to do X for friend Y. Friend Y still exists, and the *reason* for the promise (relating to Y) isn't fundamentally nullified by Y's private thoughts. Only *communicated* release (3a) or *actions* that destroy the promise's foundation (3b) defeat the claim. Silence is neither.
  *   **(ii):** The promisee's *actions* (covert sabotage) **do** constitute invalidation (Clause 3b). The promise was for a *co-authored* paper. The colleague's actions directly destroy the very possibility of *co-authorship*, the core basis of the promise. Performing alone wouldn't fulfil the *purpose* of the original commitment, which was collaborative. The promisee nullified the foundation.

  **The Principle Stated Precisely for Mechanical Application:**

  1.  **Establish Uptake:** Did the promisee (identifiable individual or entity), at or reasonably near the time of promising, through words or conduct observable to the promisor, manifest an understanding that a specific commitment had been made *to them* concerning specific content? (Yes = Uptake, proceed. No = Not Bound).
  2.  **Check Defeaters:** Is the claim defeated?
      *   **3a Release:** Did the promisee *explicitly communicate* release to the promisor? (Yes = Not Bound).
      *   **3b Invalidation:** Did the promisee, by their own subsequent actions or fundamental change in status (e.g., death, dissolution), render the core purpose or basis of the promise fundamentally impossible or null and void, such that performance no longer serves any coherent purpose related to the original commitment *and* the promisee could not reasonably expect performance? (Yes = Not Bound).
      *   **3c Impossibility:** Has performance become genuinely impossible (not merely difficult, costly, or undesirable)? (Yes = Not Bound).
  3.  **Persisting Claim:** If Uptake occurred (Step 1) and no Defeater applies (Step 2), the promisor is Bound.

  **Application to New Cases:**

  1.  **Promise to Myself:**
      *   Step 1 (Uptake): Can the promisor *also* be the promisee in a way that creates a distinct normative claim? Arguably no. While one might *intend* a commitment, there's no separate entity manifesting uptake *to whom* a distinct claim is owed. The "claim" collapses into mere intention. *Verdict:* **Not Bound.** *(Clause 1 fails - no distinct promisee/uptake).*
  2.  **Promise Whose Content I Misunderstood:**
      *   Step 1 (Uptake): This hinges on whether a *reasonable* observer at the time would see the promisee's words/conduct as uptake based on the *actual* content understood by the promisee, or the content *intended* by the promisor. Uptake depends on the promisee's reasonable understanding. If the promisor misunderstood but the promisee reasonably believed a clear commitment to X was made and manifested uptake on that basis, then Uptake *has* occurred concerning X. *Verdict:* **Bound to X** (the content as reasonably understood by the promisee). *(Clauses: 1 (uptake on promisee's reasonable understanding of X), 2 - No defeater triggered).* If the misunderstanding was mutual and fundamental (e.g., both parties thought "X" meant something utterly different), then Uptake may fail entirely (like case vii).
  3.  **Promise Made Intending Not to Keep, Later Performed:**
      *   Step 1 (Uptake): If the promisee manifested uptake at the time (believed a commitment was made), Uptake occurred regardless of the promisor's secret intention.
      *   Step 2 (Defeaters): Performing the act *fulfils* the obligation created by the promise. The question of being "bound" is retrospective. *At the time of promising*, the promisor was **Bound** (Uptake occurred, no defeater at that moment). Their secret intention is morally culpable but doesn't negate the *creation* of the obligation via uptake. Performing it later *discharges* that existing obligation. *Verdict:* **Was Bound** at the time of promising, obligation discharged by performance. *(Clauses: 1 (uptake occurred), 2 - No defeater at time of promising).*

  This principle systematises your verdicts, resolves the (ii)/(vi) tension through the crucial distinction between mere uncommunicated attitude (not a defeater) and action that invalidates the promise's basis (a defeater), and provides a clear, mechanical test for new cases based on the presence of uptake and the specific defeaters defined. It emphasises the promisee's role in creating the claim via recognisable uptake and limits defeasibility to communication, promisee-induced invalidation, or impossibility.
