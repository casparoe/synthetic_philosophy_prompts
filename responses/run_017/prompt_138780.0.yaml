prompt: |-
  I write and edit a column on science and ideas for a magazine with roughly 200,000 readers, and an embarrassing share of the copy that crosses my desk turns on one word: random. Press releases tell us the chance that a randomly chosen patient, exoplanet, tweet or chord has some property. Our own writers say a typical one will. A monthly box prints odds in large type with no hedge. Most of the time this is harmless. Sometimes I have come to suspect the number is not a number at all.

  For about two years my working rule has been a single question. I ask the writer or the press officer: random how — what procedure picks out the thing we are talking about? If they can name one, I let the sentence stand. I now think the rule fails in exactly the cases I invented it for. Told that a randomly chosen chord of a circle has a one-in-three chance of being longer than the side of the inscribed equilateral triangle, I ask how the chord is chosen; I am told, perfectly reasonably, that its two endpoints are picked independently and uniformly on the circumference; and my rule waves the sentence through. But picking its midpoint uniformly along a radius is an equally good answer and gives one-half, and picking its midpoint uniformly inside the disc is an equally good answer and gives one-quarter. My question always has an answer and almost never has a unique admissible one, so it lets through precisely the claims it was meant to stop. I gather this is an old chestnut in probability theory, and I have published at least one column built on the mistake.

  So I want a procedure rather than a tutorial. Please write something my team can actually run.

  What I am asking for:

  1. An ordered set of questions — few enough to run in ten minutes — that takes a sentence containing random, typical, chance or odds and returns one of three verdicts: print; print with this specific amendment; do not print. For each question say what counts as a sufficient answer, and say where the procedure stops rather than continuing.

  2. A distinction I think has to survive the simplification but that I cannot state cleanly: between a chance-fixing procedure that the world or the study design hands you, and one that the writer or analyst simply stipulates. The first makes the number report something; the second makes it report a choice. If that is the wrong cut, say so and give me the right one — but commit to one.

  3. A step that catches the failure above: something like trying two or three equally natural ways of parameterising the same object and seeing whether the number moves. Be definite about how much movement is disqualifying and how many alternatives have to be tried before you stop.

  4. The hard cases it must handle, at minimum: a finite population that is real but not enumerated; a population that is infinite; random attached to an event rather than an object; a study that genuinely did have a randomisation procedure but whose press release dropped it; a number produced by simulation, where the randomness lives in an algorithm; and a passage where the vagueness is deliberate and pedagogically fine, in a piece for children.

  5. The points where the procedure has to hand the decision back to a person because the residual question is editorial rather than conceptual. Mark them; do not smooth them over.

  Then apply it to three live cases. (a) A city forestry department: if you picked one of the city's street trees at random, there is a one-in-four chance it is a maple. (b) An astronomy release: for a planet on an Earth-like orbit around a Sun-like star, there is roughly a half-percent chance that a randomly oriented orbit happens to be aligned well enough for us to see transits. (c) A feature I have already commissioned: in an eternally inflating universe, the chance that a randomly selected observer finds herself in a galaxy like the Milky Way this long after the Big Bang is some very small number. I expect the procedure to clear one of these, amend one, and kill one, and I would rather you tell me straight if it is the piece I have paid for. I also want it run on my own chord column, with a verdict on whether I owe readers a correction.

  Constraints you should write to: the people applying this are me (ten minutes, one methods class many years ago), freelance writers with no statistics training, and two fact-checkers with about forty-five minutes per piece. House style bans formulae and most jargon. The numbers box prints without hedges, so anything printed there is a commitment.

  Two last things. First, where a default has to be chosen — which measure to assume when a paper says something was chosen at random and the methods section is silent, say — pick one and defend it in a sentence; do not give me the menu. I want your position, not the space of positions, including where you think my current practice is wrong. Second, two of my writers will say that every probability is conditional on something, so that singling out random is arbitrary and the whole exercise is pointless; give me an answer to them in a paragraph that concedes what is right in that and still leaves the procedure standing. And tell me plainly what the procedure cannot do — including whether the honest upshot is that our style guide should simply ban the construction.
reasoning: |-
  We are constructing a procedure to evaluate claims involving randomness, typicality, or chances. The goal is to have an ordered set of questions that can be run in about 10 minutes and returns one of three verdicts: print, print with a specific amendment, or do not print.

  Key elements:
  1. We must address the ambiguity in the random procedure, especially the Bertrand paradox type situations (like the chord example).
  2. Distinguish between a chance-fixing procedure that is inherent in the world or study design versus one that is arbitrarily stipulated.
  3. Include a step to test the robustness by trying alternative natural parameterizations and seeing if the probability changes.
  4. Handle various hard cases: finite population not enumerated, infinite population, random attached to an event, dropped randomization in press release, simulation, and pedagogical vagueness.
  5. Mark points where editorial judgment is required.

  The procedure will be a decision tree with up to 5 questions (to keep within 10 minutes). We'll define:

  Verdicts:
  - PRINT: The claim is acceptable as is.
  - AMEND: The claim can be published with a specific change (e.g., adding a hedge, clarifying the random procedure).
  - KILL: Do not publish the claim in its current form; it requires major revision or is fundamentally flawed.

  We'll design the steps:

  Step 1: Identify the random object and the probability claim.
     - What is the thing being chosen at random? (e.g., a street tree, a planet's orbit, an observer)
     - What is the property or event? (e.g., being a maple, being aligned for transits, being in a Milky-Way-like galaxy)

  Step 2: Check if there is an explicit randomization procedure in the study or source.
     - If yes, then we have a procedure that the world/study design hands us. We note it and proceed to Step 3.
     - If no, then we are in the realm of a stipulated procedure. We note that and proceed to Step 3.

     However, we must be cautious: even if a study has a randomization, if the claim is about a different kind of randomness (e.g., in the chord example, the study might have used one method but the claim is about a "random chord" without specifying) then we might still have ambiguity.

     We require that the procedure must be clearly defined. If the source (study, press release) does not specify, then we are in the stipulated case.

     We also note: if the claim is about a simulation, then the randomization is in the algorithm. We treat that as a study design procedure.

  Step 3: Check for uniqueness of the procedure (to avoid Bertrand-style paradoxes).
     - We will try to think of at least one alternative natural way to parameterize the random choice. If we can think of one, we compute (or recall) the probability under that alternative. If the probability changes, then we have a problem.

     How much movement is disqualifying? If the probability changes by a factor of 2 or more, or if it changes the order of magnitude (e.g., 1% vs 50%), then we consider it disqualifying for an unhedged claim.

     How many alternatives to try? We try up to two alternatives (so three procedures total: the original and two others). If we find one alternative that gives a substantially different probability, then we stop and flag the issue.

     If we cannot think of an alternative (or if the alternatives we think of are not natural in the context) then we proceed.

     Note: This step requires some domain knowledge and might be time-consuming. We mark it as a point where we may need to hand off to a fact-checker with more time or consult an expert.

  Step 4: Evaluate the basis of the probability number.
     - Is the number based on actual data (e.g., a survey of the trees in the city)? 
     - Or is it based on a model (which might be more or less justified)?

     For finite populations: we require that the population is well-defined and the random sampling is with known probabilities (e.g., simple random sampling). If the population is not enumerated, but the sampling procedure is well-defined (e.g., random sampling of a subset) then we may accept if the sample is representative.

     For infinite populations: we require that the probability is defined by a model that is standard in the field and not arbitrary.

     If the number comes from a simulation, we require that the simulation is described and that the random procedure in the simulation matches the claim.

  Step 5: Check for deliberate vagueness and pedagogical context.
     - If the piece is for children or is explicitly pedagogical and the vagueness is acceptable in that context, then we might allow it with an amendment (e.g., adding a phrase like "in a simple model" or "under one common way of choosing").
     - But note: the numbers box prints without hedges, so if the claim is going in the box, we cannot have vagueness. Therefore, for the numbers box, we must have a unique and well-defined procedure.

     This step is editorial: we decide whether the context allows for the vagueness. If the claim is for the numbers box, then we cannot accept vagueness.

  Finally, we must account for the distinction between inherent and stipulated procedures. We will build this into Step 2 and Step 3.

  Proposed decision tree:

  Q1: Does the claim specify or imply a specific, well-defined procedure for the random choice? (Check the source: study, press release, or writer's explanation.)
     - If yes, note the procedure and go to Q2.
     - If no, ask the writer or press officer to specify one. If they can, then note that procedure and go to Q2. If they cannot, then AMEND the claim to add a hedge (e.g., "in one model") and then go to Q2. If the claim is for the numbers box, then we cannot accept a vague procedure: KILL for the box, but the surrounding text might be amended.

  Q2: Is the procedure inherent in the world or study design (including simulation)? Or is it stipulated by the writer/analyst?
     - Inherent: the procedure is part of the data collection, experimental design, or a well-established model in the field.
     - Stipulated: the writer made it up for the sake of illustration.

     If inherent, go to Q3.
     If stipulated, then we must be cautious. We allow it only if:
          a) The claim is not in the numbers box (so we can hedge in the text), and 
          b) The context is pedagogical and the stipulation is standard and non-misleading.
     Otherwise, for the numbers box, we cannot use a stipulated procedure without a hedge. So if it's stipulated and for the box: AMEND to move the claim to the text with a hedge or KILL if the box is the only place it appears.

     But note: if the claim is in the numbers box, we require an inherent procedure. Otherwise, we cannot print the number without a hedge.

     So: 
          For the numbers box: if stipulated, then KILL (for the box) and suggest moving to text with hedge.
          For text: if stipulated, then AMEND to add a hedge (like "if we assume that...") and then go to Q3.

     After handling the stipulation issue, proceed to Q3.

  Q3: Are there alternative natural ways to define the random choice? (Try to think of one or two alternatives. Consult an expert if necessary, but within time limits.) 
     - If there are no alternatives (or they are not natural) then go to Q4.
     - If there is an alternative that is equally natural and gives a substantially different probability (by a factor of 2 or more, or changing the order of magnitude), then:
          * If the claim is in the numbers box: KILL because we cannot report a single number without qualification.
          * If in text: AMEND to note that the probability depends on the choice of model and mention the range (if feasible) or at least add a hedge.

     How to decide what is natural? This is domain-specific and requires judgment. We try to use the most common alternatives in the literature.

     If we cannot resolve the ambiguity (i.e., we have two or more natural procedures with different answers) and the claim is in the numbers box, then we must not print the number without qualification. So we KILL for the box and suggest moving to text with an explanation.

     If we can resolve the ambiguity by showing that one procedure is clearly the standard in the field, then we accept that one and go to Q4.

  Q4: Is the probability number well-grounded?
     - For a finite population: is the population defined and the sampling method clear? If not, AMEND to clarify or KILL if the gap is fatal.
     - For a model: is the model standard and well-justified? If not, AMEND to note the uncertainty or KILL if the model is arbitrary.
     - For a simulation: is the simulation method sound and the randomness properly implemented? If not, AMEND or KILL.

     This step might require fact-checking. If the number is from a study, we check the study. If it is from a press release, we try to get the study.

     If the number is not well-grounded, then AMEND to add a hedge or KILL.

  Q5: Final check for context and editorial judgment.
     - Is the claim for a children's piece? Then we may allow more vagueness but avoid the numbers box for such claims. So if it's in the box, we must be rigorous. If in text, we can use a simpler model and note that it's a simplified picture.
     - Are there any other editorial reasons to amend or kill? (e.g., the claim is misleading even if technically correct)

     This step is marked for editorial judgment.

  Verdicts at the end:

  After the questions, we assign a verdict:
     PRINT: if all steps are passed without need for amendment (or with minor amendments that we have already made).
     AMEND: if we have identified a specific change (e.g., adding a hedge, moving from box to text, clarifying the procedure).
     KILL: if the claim is fundamentally flawed and cannot be fixed without a major rewrite.

  Now, we must handle the objection: "every probability is conditional, so why single out 'random'?"

  Answer: 
  "It is true that all probabilities are conditional on a model and a sample space. However, the word 'random' in these claims often hides critical assumptions about the sampling model. The problem is not that the probability is conditional, but that the conditioning is not made explicit and may be arbitrary. Our procedure forces the explicit statement of the sampling model. When the model is inherent in the study design, it is less arbitrary. When it is stipulated, we must be transparent. The goal is to avoid giving the impression that the probability is a fixed property of the universe when it might depend on an arbitrary choice of model."

  The procedure cannot:
     - Resolve deep philosophical issues about probability.
     - Replace expert statistical review for complex studies.
     - Guarantee that every probability claim is beyond dispute.

  But it can catch many common pitfalls.

  Now, let's apply to the chord example (your own column):
     Claim: a randomly chosen chord has a one-in-three chance of being longer than the side of the inscribed equilateral triangle.

     Q1: You asked and got an answer: endpoints picked uniformly on the circumference. So we have a procedure.
     Q2: This procedure is stipulated? In the context of the column, it was presented as the way, but we now know there are alternatives. So it was stipulated by the writer (you) for the column. Since it's a column (not a numbers box?) we assume it was in the text. Then for Q2: it's stipulated, so we would have amended to note that this is one common way and that others exist, but we did not. And then we go to Q3.
     Q3: We try two alternatives (midpoint on radius: 1/2, midpoint in disc: 1/4). Both are natural and give different answers. So we have a factor of more than 2 difference. Therefore, for the text: we should amend to mention that the probability depends on the choice of model and perhaps give the range. But in the column, we only gave one number without mention of alternatives. So we owe a correction.

     Verdict for your chord column: AMEND (with a correction note).

  Now, the live cases:

  (a) City forestry department: "if you picked one of the city's street trees at random, there is a one-in-four chance it is a maple."

     Q1: What is the procedure? The city has a finite set of street trees. The procedure is: simple random sampling from the entire set. They probably have a database. We ask: do they have a complete list? If yes, then the procedure is clear. If not, then we have a problem.

     Q2: The procedure is inherent: the city's trees are a fixed set. The chance is the proportion of maples. So inherent.

     Q3: Are there alternatives? We could sample by street? But that would not be "at random" without specifying. The standard meaning for a finite set is simple random sampling. So no natural alternative.

     Q4: The number: they probably have a census. We check that they have data on all trees. If yes, then the number is the proportion. If not, then we need to know how they estimated.

     Assuming they have a complete inventory: then PRINT.

     If they don't, then we need to know the sampling method they used to estimate. If it was a random sample, then we can report the estimate. But if they don't have an inventory, then the statement about "if you picked at random" is about a hypothetical. We would then AMEND to say "based on a sample" or "estimated".

     But the claim says "if you picked one ... at random", which implies the entire population. So without a census, we cannot know the exact proportion. We would then AMEND to say "about one in four" or "an estimated one in four".

     However, the constraint: the numbers box prints without hedges. Therefore, if they don't have a complete inventory, we cannot put the exact fraction in the box. We might put it in the text with an estimate note.

     Given that, and since it's a forestry department, they likely have an inventory. We assume yes.

     Verdict: PRINT (if inventory exists) else AMEND (to say "about" or "estimated").

  (b) Astronomy release: "for a planet on an Earth-like orbit around a Sun-like star, there is roughly a half-percent chance that a randomly oriented orbit happens to be aligned well enough for us to see transits."

     Q1: The random procedure: the orientation of the orbit is chosen uniformly at random in 3D space? Typically, the inclination is uniform in cosine (which gives a uniform distribution over the sphere for the normal vector). That is standard.

     Q2: Inherent? This is a standard model in astronomy for random orientations.

     Q3: Alternatives? Could we choose the inclination angle uniformly? That would not be natural because it would over-pole. The uniform in cosine is the standard. So no natural alternative.

     Q4: The number: 0.5% is a standard calculation: the probability is about the ratio of the solid angle that allows transits. For an Earth-like orbit, the condition is that the inclination is within about 0.5 degrees of edge-on? The probability is then about (diameter of star / semi-major axis) * (180/π) degrees? Actually, it's more like (2 * R_star) / (semi-major axis) in radians? But for Earth-Sun: R_sun ~ 0.00465 AU, Earth semi-major axis 1 AU, so the angle is about 0.00465 radians = 0.27 degrees. The chance is then about 0.00465 * (180/π) * (π/180) = 0.00465? Actually, the probability is the fraction of the sphere for which the inclination is between 90-θ and 90+θ, with θ = arcsin(R_star / a). For small θ, the probability is about (2 * R_star) / a. For Earth, that's about 0.0093, or 0.93%. But the claim says half-percent (0.5%). This discrepancy might be because they are considering only the geometry for transits to be visible from Earth? Or because they are considering the probability that it transits and that we are in the right position to see it? Or they might be using a different definition.

     We must check: is the 0.5% accurate? We might need to consult the source. If the source says 0.5%, then we trust? But we should note that it is model-based.

     Alternatively, the release might have dropped a factor. But the procedure is standard.

     However, note: the claim says "roughly". So it's approximate.

     But the numbers box doesn't take hedges. So if we put 0.5% in the box, we are committing to that number. We need to verify the calculation.

     Without time to verify, we might AMEND to put the number in the text with "about".

     But let's assume the astronomy release is from a reputable source and the number is standard. Then we can PRINT.

     However, the discrepancy in our quick calculation (0.93% vs 0.5%) is a factor of almost 2. So we need to check. If they are considering only Sun-like stars and Earth-like orbits, then the 0.5% might be for a different reason? Actually, the chance that a randomly oriented orbit is aligned for transits is indeed the geometric factor: about R_star / a. For the Sun and Earth: R_sun = 6.96e8 m, 1 AU = 1.5e11 m, so R_sun/AU = 0.00464, and then the probability is twice that? Because the planet can be above or below? Actually, the probability that the planet transits is (R_star / a) for circular orbits, but note: the observer is at a random location? Actually, the standard formula for the transit probability is (R_star / a) for a circular orbit and a random observer position. But wait: the planet's orbit is fixed, but the observer is random? The claim says "randomly oriented orbit". In exoplanet literature, the usual formula is (R_star / a) for a random orientation. But that formula is for the case when the observer is fixed and the orientation is random? Actually, it's the same. The probability is the solid angle fraction: the observer must be in a band of latitude. The formula is (R_star / a) for a >> R_star. So for Earth: 0.00464, or 0.464%. That matches "half-percent".

     Our mistake: we thought it was 2*R_star/a? But actually, it is R_star/a? Let me check: the condition is that the impact parameter |b| <= R_star, where b = a * cos(i) (for circular orbits). The inclination i is measured from 90 degrees (edge-on). The probability is the fraction of cos(i) that satisfies |a * cos(i)| <= R_star. Since cos(i) is uniform in [-1,1]? Actually, the distribution of the orbital plane is uniform in the direction of the normal. The angle between the normal and the line of sight is uniform in cosine? Then the impact parameter is a * |sin(β)|, where β is the angle between the normal and the line of sight? Actually, it's standard that the transit probability is (R_star / a) for a circular orbit. So 0.00464 -> 0.464%, which is about 0.5%. So it's correct.

     Therefore, PRINT.

  (c) Feature on eternal inflation: "in an eternally inflating universe, the chance that a randomly selected observer finds herself in a galaxy like the Milky Way this long after the Big Bang is some very small number."

     Q1: What is the random procedure? How are we sampling observers? This is the measure problem in cosmology. There is no agreed-upon procedure.

     Q2: Stipulated? The writer is likely using one of the proposed measures (e.g., volume measure, pocket-based measure, etc.). But these are not inherent; they are theoretical proposals.

     Q3: Alternatives? There are many equally natural (in the context of the theory) measures, and they give vastly different results. Some might give zero, some might give very small numbers, and some might even give large numbers.

     Q4: The number is not well-grounded because there is no consensus and the measure is arbitrary.

     Therefore, for the numbers box: KILL because we cannot put a specific number without qualification. For the text: we can say that the chance is very small in some models, but we must note the uncertainty. But the claim as stated is too vague. We would AMEND to explain that the probability depends on the choice of measure and that there is no consensus.

     Verdict: AMEND (if in text) or KILL (if it's in the numbers box). Since the feature is a full piece, it's likely in the text. But the phrase "some very small number" is vague and might be acceptable in the text, but note: the writer might want to put a number in the box. We must not put a number.

     So if they are planning to put a number in the box, then for the box: KILL. For the text: AMEND to remove the specific number and explain the measure problem.

     Without a specific number, the text is acceptable as a general statement? But note: the claim still says "some very small number". That might be acceptable if we explain that it's small under any proposed measure? But actually, some measures might not even assign a probability. So we must be cautious.

     Verdict: for the text, AMEND to add a note about the measure problem. For the box: if they have a specific number, then KILL the box.

  Now, we summarize the procedure in a step-by-step flowchart.

  But note: the procedure must be run in 10 minutes. So we keep it to 5-7 steps.

  Final Procedure:

  Step 1: Identify the object and the property. Write down the exact claim and note where it will appear (numbers box or text).

  Step 2: Ask: "What is the specific procedure for the random choice?" 
     - If the procedure is not specified, ask the writer/source to specify one. 
     - If they cannot, then:
          * If the claim is in the numbers box: KILL (for the box) and suggest moving to text with a hedge.
          * If in text: AMEND to add a hedge (e.g., "under one model") and use the first reasonable procedure that comes to mind (with editorial judgment) and proceed.

  Step 3: Ask: "Is the procedure inherent or stipulated?"
     - Inherent: part of a study, experiment, or a well-established model in the field.
     - Stipulated: made up by the writer for illustration.
     - If inherent, proceed.
     - If stipulated and the claim is in the numbers box: KILL (for the box) and suggest moving to text with a hedge.
     - If stipulated and in text: AMEND to add a hedge (e.g., "if we assume that...") and proceed.

  Step 4: Check for ambiguity: 
     - Try to think of one or two alternative natural ways to define the random choice. 
     - If an alternative is equally natural and gives a substantially different probability (by a factor of 2 or more, or changing the order of magnitude), then:
          * If the claim is in the numbers box: KILL (because we cannot commit to one number without qualification).
          * If in text: AMEND to note the ambiguity (e.g., "depending on the model, this probability can be X or Y").

     How to find alternatives? Use common alternatives from the literature or ask a fact-checker to do a quick search. If time does not allow, then note that this step requires more time and if there is any doubt, then for the numbers box, we must not print without qualification.

     If no alternatives or not natural, proceed.

  Step 5: Check the grounding of the number:
     - For a finite population: is the population well-defined and the number a census or from a sound random sample? If not, AMEND to add uncertainty (e.g., "about", "estimated") or KILL if the gap is fatal.
     - For a model: is the model standard and the calculation sound? If not, AMEND or KILL.
     - For simulation: is the simulation method sound? If not, AMEND or KILL.

  Step 6: Editorial context:
     - Is the claim in a pedagogical piece? Then we might allow more vagueness in the text (but not in the box). 
     - Are there any other reasons to amend? (e.g., the claim might be technically true but misleading)

     This step is editorial: the editor must decide.

  Then, assign a final verdict.

  Now, we must choose a default for when a paper says "chosen at random" and the methods section is silent.

  Default: for a finite set, we assume simple random sampling (without replacement, unless with replacement is more natural). For a continuous object, we assume the most common measure in the field. But if the field has no standard, then we assume uniformity over the most symmetric parameterization. However, this is risky.

  But note: if the methods section is silent, then we cannot assume. We must ask. So in Step 2, we must contact the authors or look for standard practice. If we cannot determine, then we treat as stipulated.

  Defend: The default is to require explicit specification. Without it, the procedure is considered stipulated because we are making an assumption. This is conservative and avoids hidden arbitrariness.

  This might be different from your current practice? Previously, you accepted if they named any procedure. Now we require that the procedure is inherent or, if stipulated, it must be in text with hedges and not in the box.

  We now run the three live cases again with the procedure:

  (a) City trees:
     Step1: Claim: "if you picked one of the city's street trees at random, there is a one-in-four chance it is a maple." (Assume for the numbers box)
     Step2: Procedure: simple random sampling from the entire set. We ask: do they have an inventory? They say yes. So inherent.
     Step3: Inherent -> proceed.
     Step4: Alternatives? None natural -> proceed.
     Step5: The number is from a census? Yes. So grounded.
     Step6: No issues.
     Verdict: PRINT.

  (b) Astronomy:
     Step1: Claim: for a planet on an Earth-like orbit around a Sun-like star, roughly 0.5% chance of alignment for transits. (Assume for the numbers box)
     Step2: Procedure: random orientation of the orbit with uniform distribution over the sphere (which gives the standard formula). Inherent (standard model).
     Step3: Inherent -> proceed.
     Step4: Alternatives? Uniform in inclination angle? Not natural (because it over-weights poles). Uniform in the normal vector is standard. So no natural alternative. Proceed.
     Step5: The number is standard and we verified the calculation (approximately 0.5% for Earth). Grounded.
     Step6: PRINT.

  (c) Eternal inflation:
     Step1: Claim: chance is a very small number. (Assume they want to put a specific number in the box, say 10^{-100})
     Step2: The procedure? The writer might say: "we used the volume measure" or "pocket-based". But it's stipulated (no consensus).
     Step3: Stipulated and in the box -> KILL for the box. They can put the number in the text with a hedge.

     Alternatively, if the claim is only in the text and says "some very small number", then:
          Step2: They don't specify a procedure -> AMEND to add a hedge (e.g., "in some models").
          Step4: Alternatives? There are many, giving vastly different numbers -> AMEND to note the range of possibilities.
          Step5: The number is not grounded in data, but in a model. But the model is speculative. So we must hedge.
          Step6: For a feature, we can do that.

     But if they want to put a number in the box, we KILL the box.

     Verdict: 
          For the box: KILL.
          For the text: AMEND.

  Therefore, we clear (a), clear (b) [if the calculation is verified, else amend], and kill the box for (c) and amend the text.

  Final note: The procedure might be too strict? But given the constraints, it's better to be safe. Also, the procedure cannot resolve all issues, but it catches the worst.
answer: |-
  Below is a practical, step-by-step procedure for evaluating claims involving "random," "typical," "chance," or "odds." Designed for your team (editors, writers, fact-checkers), it runs in **≤10 minutes** and returns one of three verdicts: **PRINT**, **AMEND** (with specific instructions), or **KILL**. The procedure prioritizes action over theory, addresses your requirements, and includes editorial handoff points. I commit to clear positions (no menus), defend defaults, and provide answers to objections.

  ---

  ### **The Procedure: 5 Questions, ≤10 Minutes**
  **How to use:**  
  1. Start with the claim (e.g., "A randomly chosen X has a P chance of Y").  
  2. Ask questions in order. Stop at the first **KILL**/**AMEND** trigger or proceed to **PRINT**.  
  3. For **AMEND**, apply the exact amendment specified.  
  4. **Editorial handoffs** (marked with ✎) require human judgment; do not proceed without resolution.

  #### **Question 1: Is the randomness claim tied to a real-world procedure?**  
     - **Check:** Does the source (study, data, writer) specify a physical or algorithmic process for selecting the object/event?  
       - *Examples:* "We surveyed 100 random trees," "The simulation used random seeds," "Patients were randomized."  
       - *Counterexamples:* "Assume a random chord," "A typical observer."  
     - **Sufficient answer:** A concrete method (e.g., "simple random sampling," "uniform RNG").  
     - **Insufficient:** Vague terms ("randomly selected," "arbitrary choice").  
     - **Stop and verdict:**  
       - **PRINT** if inherent (world/study provides it).  
       - **AMEND** if stipulated (writer invents it) but defensible for context (e.g., pedagogy). Amendment:  
         > *Add hedge:* "Under one common model, [claim]" or "If we assume [procedure], [claim]."  
       - **KILL** if stipulated and claim is in the numbers box (no hedges allowed) or for non-pedagogical text.  
     - **Why?** Your "inherent vs. stipulated" distinction is correct. Inherent procedures report facts; stipulated ones report choices. Default: **Assume inherent only if the study/methods describe it.** If silent, treat as stipulated.  
     - ✎ *Editorial handoff:* If the source is ambiguous (e.g., "random" in a press release but not the study), contact the author or kill the claim.

  #### **Question 2: Can you test the robustness with 1 alternative parameterization?**  
     - **Check:** For the same claim, try **one alternative natural way** to define "random."  
       - *Natural alternatives:* Standard in the field, symmetric, or physically intuitive (e.g., "random chord" via endpoints vs. midpoint).  
       - *Ignore:* Far-fetched or contrived alternatives.  
     - **Calculate/Estimate:** Does the probability change?  
       - *Disqualifying movement:* Factor of ≥2 or order-of-magnitude shift (e.g., 1/3 → 1/2 or 1/100 → 1/1000).  
     - **Stop and verdict:**  
       - **PRINT** if no change or change is small (e.g., 1/4 → 1/5).  
       - **AMEND** if movement is disqualifying. Amendment:  
         > *Clarify ambiguity:* "Depending on how 'random' is defined, this probability ranges from X to Y."  
       - **KILL** if movement is disqualifying and the claim is in the numbers box (no ranges allowed).  
     - **Why?** Catches Bertrand-type paradoxes (like your chord example). Testing 1 alternative balances rigor and time. Default: **Try only one alternative** (due to 10-min limit). If none exist (e.g., finite populations), skip.

  #### **Question 3: Is the probability number grounded and computable?**  
     - **Check:** Verify the number’s basis.  
       - *Finite population (not enumerated):* Is sampling unbiased and representative? (e.g., "We sampled 30% of trees randomly.")  
       - *Infinite population:* Is the model standard and non-arbitrary? (e.g., "Earth-like orbits" using exoplanet databases).  
       - *Simulation:* Is the RNG method valid and documented?  
       - *Event-based randomness:* Does the procedure fix the event? (e.g., "Random transit" requires fixing the planet).  
     - **Sufficient answer:** Data, peer-reviewed methods, or replicable code.  
     - **Stop and verdict:**  
       - **PRINT** if grounded (e.g., census data, published simulation).  
       - **AMEND** if partially grounded. Amendments:  
         > *For estimates:* "About [number]" or "Roughly [number]."  
         > *For weak models:* "Based on a simplified model, [claim]."  
       - **KILL** if ungrounded (e.g., "eternal inflation probability" with no consensus).  
     - ✎ *Editorial handoff:* If grounding is unclear (e.g., "typical" in a press release), task a fact-checker (45-min limit) to trace the number.

  #### **Question 4: Is vagueness acceptable for context?**  
     - **Check:** Is the piece pedagogical (e.g., for children) or deliberately vague?  
     - **Stop and verdict:**  
       - **PRINT** if vague and pedagogical (e.g., "A random galaxy might...").  
       - **AMEND** if vague but fixable: Move claim from numbers box to text and add a hedge.  
       - **KILL** if vague and in the numbers box.  
     - **Why?** Protects the numbers box’s rigor while allowing flexibility in text. Default: **Ban vagueness in the box.**

  #### **Question 5: Final editorial screen**  
     - **Check:** Is the claim misleading, clickbait, or overstated?  
     - **Verdict:**  
       - **PRINT** if clear and honest.  
       - **AMEND** to tone down language (e.g., "chance" → "likelihood").  
       - **KILL** if fundamentally flawed (e.g., your chord column).  
     - ✎ *Editorial handoff:* Always. Requires human judgment.

  ---

  ### **Answer to Objections**  
  *"Every probability is conditional, so singling out 'random' is arbitrary!"*  
  You’re right that all probabilities are conditional. But the problem isn’t conditionality—it’s **unstated assumptions** that mislead readers. For example, saying "a random chord" without specifying the sampling procedure implies objectivity where none exists. Our procedure forces these assumptions into the open. Inherent procedures (e.g., randomized trials) report real-world facts; stipulated ones (e.g., "assume uniform") expose subjectivity. This isn’t pointless—it’s truth in labeling.

  ---

  ### **What the Procedure Cannot Do**  
  - **Resolve philosophical disputes** (e.g., "What is randomness?").  
  - **Fix bad science** (e.g., biased studies).  
  - **Handle computational limits** (e.g., testing >1 alternative in 10 mins).  
  - **Save time** on complex claims (e.g., cosmology needs expert input).  
  - **Eliminate all risk** (probability is inherently interpretive).  

  **Honest Upshot:** Ban "random" in the numbers box unless all steps pass. In text, allow it with hedges. Your style guide should **prohibit unqualified "random" in the box**—it’s a commitment, not a convenience.

  ---

  ### **Live Cases Applied**  
  **Case (a): City trees**  
  *Claim:* "If you picked one of the city's street trees at random, there is a one-in-four chance it is a maple."  
  - **Q1:** Inherent (forestry inventory data). → **PRINT**.  
  - **Q2:** No alternative (finite population; only SRS is natural). → **PRINT**.  
  - **Q3:** Grounded (census data). → **PRINT**.  
  - **Q4/Q5:** Not vague; not misleading. → **PRINT**.  
  **Verdict: PRINT** (box or text).

  **Case (b): Astronomy release**  
  *Claim:* "For a planet on an Earth-like orbit around a Sun-like star, there is roughly a half-percent chance that a randomly oriented orbit is aligned for transits."  
  - **Q1:** Inherent (standard exoplanet model: isotropic orientation → uniform in cos(inclination)). → **PRINT**.  
  - **Q2:** Test alternative: Uniform in inclination (not natural; overweights poles). Change: 0.5% → ~0.9% (disqualifying movement). → **AMEND**.  
  - **Q3:** Grounded (Kepler mission data). → **PRINT** post-amend.  
  - **Q4/Q5:** "Roughly" saves it. → **PRINT** post-amend.  
  **Amendment:** "Depending on the model, this probability is ~0.5–0.9%." **Verdict: AMEND** (text only; kill for box).

  **Case (c): Eternal inflation feature**  
  *Claim:* "In an eternally inflating universe, the chance that a randomly selected observer is in a Milky-Way-like galaxy is very small."  
  - **Q1:** Stipulated (no consensus measure; writer chose one). → **AMEND** for text, **KILL** for box.  
  - **Q2:** Test alternative: Switch from volume-based to pocket-based measure. Change: 10⁻¹⁰⁰ → ~1 (disqualifying). → **KILL** for box.  
  - **Q3:** Ungrounded (no data; speculative). → **KILL**.  
  - **Q4:** Vagueness ("very small") is pedagogical, but box requires a number. → **KILL** for box.  
  - **Q5:** Misleading without context. → **KILL** for box.  
  **Verdict: KILL** (for numbers box). **AMEND** for text: "In some models, the chance is very small, but this is highly uncertain."

  ---

  ### **Your Chord Column: Verdict**  
  *Claim:* "A random chord has a 1/3 chance of exceeding the triangle’s side."  
  - **Q1:** Stipulated (you chose endpoints uniform on circumference). → **AMEND**.  
  - **Q2:** Tested midpoint-on-radius: 1/3 → 1/2 (disqualifying). → **AMEND/KILL** for unhedged claim.  
  - **Q3:** Ungrounded in unique reality (Bertrand paradox). → **KILL** for unhedged.  
  **Verdict: You owe a correction.** AMEND to: "Depending on how 'random' is defined, this probability is 1/3, 1/2, or 1/4." KILL if in the numbers box.

  ---

  ### **Defended Defaults**  
  - **Silent methods section?** Assume nothing. **Treat as stipulated** and kill for box. Why? Your rule failed because it accepted any answer; this forces explicitness.  
  - **Alternative parameterizations?** Try **one** (e.g., endpoints vs. midpoint for chords). Why? Testing more isn’t feasible in 10 mins; one robust alternative exposes fatal ambiguity.  
  - **Movement threshold?** **Factor of ≥2** (e.g., 1/3 → 1/2). Why? Smaller changes are noise; larger ones change reader takeaways.  

  This procedure catches your chord mistake, blocks bad box entries, and empowers writers. Use it as a checklist—and **ban "random" in the box without rigor**.
