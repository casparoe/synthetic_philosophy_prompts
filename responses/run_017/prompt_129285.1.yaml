prompt: |-
  I sit on the social-science panel of a national research council, and we have one funded slot left in this round and a genuinely split panel. I have some philosophy training from before I moved into economic history, and because of that the chair has asked me to draft the decision memo, with the understanding that the other four panelists will either sign it or annotate it. The application is from a group calling itself the Coordination and Expectations Lab, and it proposes to settle whether culture can be a cause in economic explanation. I want to be clear about the substantive details, because the memo has to be answerable by the applicants.

  The applicants are explicit that they are not doing another study of inherited values: they say that framing, which is how most people read Weber's Protestant ethic thesis, has never been able to separate the effect of a population's normative commitments from the effect of the institutions those commitments built. Their alternative is to define culture as a population's stock of common-knowledge defaults for solving recurring coordination problems — focal points, in the game-theoretic sense — held in expectations rather than in preferences, genes, or laws. On that definition, a shared expectation is claimed to be a cause in the ordinary difference-making sense (intervene on what people expect others to do, and the outcome changes) while also being nothing but a fact about what people believe about one another; they argue that this dissolves the older contrast between explaining an action by its causes and explaining it by the meanings it has for the agent, rather than picking a side in it. Their design has three arms: a border design exploiting a nineteenth-century administrative redistricting that split a linguistically homogeneous region into two districts with identical formal law and comparable geography; an epidemiological arm comparing descendants of emigrants from each side of that border who now live in the same city; and a lab-in-the-field coordination game run with both migrant and non-migrant samples, plus a measure of whether the relevant default survives better when transmitted within households than through schools. The panel's disagreements are sharp. Our statistician says that if institutions are themselves downstream of expectations, then the border design cannot separate culture from institutions at all, and that the game arm has no pre-registered prediction about magnitude. Our historian says that explaining with focal points is equilibrium selection, not the interpretation of meanings, so whatever the project studies it is not culture and the label is doing no work. A third member says the definition is unfalsifiable because any observed regularity can be redescribed after the fact as coordination on some focal point; the applicants' reply is that they will fix the focal point in advance using cooperative bylaws recorded in district archives before the outcome period begins. There is also a budget problem: four years were requested, and the archival arm may fall under the council's humanities budget line rather than ours.

  Please draft the memo for circulation before our meeting on the 14th. It should recommend one concrete course of action — fund as submitted, fund a reduced version, fund conditional on specified changes with a resubmission deadline, or reject — and give reasons the applicants could actually act on rather than merely rejections of their framing. Two further requirements. First, our rules say any funded project making a causal claim must rest on a design that could in principle have delivered the opposite answer; include one short paragraph stating whether this project meets that test, and on which arm the answer turns. Second, give the strongest consideration on the losing side its full force: I expect at least two panelists to read this as a decision about whether the project is, in the relevant sense, cultural explanation at all, and I would rather the memo say plainly what we are buying if we fund a study built on expectations rather than on values — including the possibility that a successful result would only relabel the old dispute instead of settling it.
reasoning: |-
  We are drafting a decision memo for a research grant application from the "Coordination and Expectations Lab" (CEL). The panel is split, and we must recommend one course of action. The project proposes to define culture as a population's stock of common-knowledge defaults for solving coordination problems (focal points) and to test whether such culture can be a cause in economic explanation. The design has three arms: a border design, an epidemiological arm, and a lab-in-the-field coordination game. Key criticisms from panelists include concerns about separating culture from institutions in the border design, whether the focal-point approach captures "culture" as traditionally understood, falsifiability, and budget issues.

  We must recommend one of: fund as submitted, fund a reduced version, fund conditional on changes with a resubmission deadline, or reject. The memo must be actionable by the applicants and address two requirements: (1) state whether the design could in principle have delivered the opposite answer (for causal claims) and on which arm that turns, and (2) give the strongest consideration on the losing side full force, including the possibility that a successful result might only relabel the dispute.

  After reviewing the proposal and the panel's concerns, I recommend:

  **Recommendation: Fund conditionally on specified changes, with a resubmission deadline.**

  **Reasons:**

  1. **Addressing the Statistician's Concern (Border Design):** The statistician argues that if institutions are downstream of expectations, then the border design cannot separate culture from institutions. The applicants propose using archival records of cooperative bylaws (pre-outcome) to fix the focal points. However, the concern is that even if the focal point is fixed in advance, the institutions that emerge might be shaped by those expectations. To address this, the applicants must clarify how they will measure the expectations independently of the institutions that may have formed. They should also consider including an analysis of institutional divergence over time as part of the border design, which could help disentangle the sequence. Without this, the border arm may not convincingly isolate culture as a cause.

  2. **Addressing the Historian's Concern (Definition of Culture):** The historian contends that explaining via focal points is about equilibrium selection and not the interpretation of meanings, and thus it is not culture. The applicants argue that their approach dissolves the cause/meaning dichotomy. The memo should acknowledge that if funded, we are buying a study that redefines culture as shared expectations for coordination, which is a departure from values-based definitions. This is a valid theoretical reframing, but it may not settle the older dispute about culture as normative commitments. The applicants should be asked to explicitly engage with this criticism in their theoretical framework, perhaps by discussing how their definition relates to and potentially subsumes aspects of the traditional view (e.g., showing how normative commitments might function as focal points). However, the panel should recognize that the project's success might not end the debate but could shift it.

  3. **Falsifiability and the Game Arm:** The third panelist worries that any regularity can be post-hoc described as a focal point. The applicants' reply (using pre-outcome bylaws) is a good step, but the game arm lacks a pre-registered prediction about the magnitude of the effect. Thus, conditional funding should require pre-registration of the game experiments, including clear predictions about the magnitude of the effect of the focal point on coordination outcomes, and how transmission (household vs. school) is expected to affect the survival of the default. This would make the test falsifiable.

  4. **Budget and Timeline:** The project is proposed for four years and may have budget issues because the archival arm might fall under humanities. The council should clarify the budget line for the archival work. If it must be under social science, the project may need to reduce the scope of the archival arm or seek co-funding from humanities. Alternatively, the applicants could be asked to adjust the timeline or scope to fit within four years and the social science budget. This might involve prioritizing the border and epidemiological arms and making the game arm more targeted.

  **Concrete Changes Required:**

  - **Border Design:** Revise to include a plan for measuring expectations independently of institutions and analyze institutional divergence over time to address endogeneity.
  - **Game Arm:** Pre-register the experimental design, including specific predictions about the magnitude of the effect of the focal point and the transmission mechanisms.
  - **Theoretical Framework:** Expand to directly address the relationship between their definition of culture and traditional views (like Weberian values) and how their approach might resolve or reframe the dispute.
  - **Budget and Timeline:** Resubmit with a revised budget that either secures co-funding for the archival component from humanities or scales it back to fit within the social science budget. The project timeline may need adjustment if the archival work is time-intensive.

  **Resubmission Deadline:** The applicants should resubmit a revised proposal by [insert date, e.g., 6 weeks from the decision] for final approval.

  **Requirement 1: Could the Design Deliver the Opposite Answer?**  
  Yes, the design meets the council's requirement for causal claims. The border design and the epidemiological arm are observational but exploit natural experiments (redistricting and migration) that could, in principle, show no difference in outcomes between the two districts or between migrant groups, which would challenge the claim that culture (as defined) is a causal factor. The lab-in-the-field game is experimental and can be designed to test specific predictions (e.g., by manipulating the availability of the focal point). The critical arm for this requirement is the border design: if the outcomes in the two districts are identical despite the different focal points (as set by pre-existing bylaws), then the causal claim would be falsified. The game arm, once pre-registered with magnitude predictions, would also be capable of falsification.

  **Requirement 2: Strongest Consideration on the Losing Side**  
  The most compelling criticism is that even if the project succeeds, it may not settle the question of whether "culture" (in the sense of deeply held values or normative commitments) is a cause in economic explanation, but rather redefine culture as shared expectations. This risks relabeling the dispute rather than resolving it. The historian's point that the focal-point approach is about equilibrium selection and not the interpretation of meanings is well-taken: if the project finds that shared expectations matter, it does not necessarily engage with the Weberian tradition that emphasizes the role of values in shaping economic behavior. Thus, funding this project buys a study of how shared expectations (as coordination devices) function as causes, which is a valuable contribution to understanding coordination in economic life, but it may leave the broader debate about cultural explanation unresolved. The panel should be clear that we are funding a project that advances a particular, game-theoretic definition of culture, and its success would establish that shared expectations can be difference-making causes, but it may not address all aspects of what social scientists mean by "culture."

  **Conclusion:**  
  Conditional funding is appropriate because the core idea is innovative and the design is largely sound, but it requires refinement to address the panel's concerns. This approach gives the applicants a chance to strengthen their proposal while ensuring that the funded project meets the council's standards. The revised proposal must be submitted by [date] for final approval.
answer: |-
  **MEMORANDUM**  
  To: Social-Science Panel, National Research Council  
  From: [Your Name], Panel Member  
  Date: [Current Date]  
  Subject: Recommendation for Coordination and Expectations Lab (CEL) Proposal  
  CC: Panel Chair  

  ### Recommendation
  **Fund conditionally on specified revisions**, with a resubmission deadline of **October 15** to address concerns prior to final approval. If revisions are satisfactory, funding will be awarded under the social-science budget line at the reduced scope outlined below (3 years, modified archival/game arms). If revisions are inadequate, the proposal will be rejected without further review.  

  ### Summary of Proposal
  The CEL project aims to test whether "culture" (defined as a population’s stock of common-knowledge defaults for solving coordination problems, i.e., focal points) can be a causal factor in economic outcomes. The design comprises:  
  1. **Border Arm**: Exploits a 19th-century redistricting event in a linguistically homogeneous region to compare economic outcomes between two areas with identical formal laws but divergent focal points (pre-identified via archival bylaws).  
  2. **Epidemiological Arm**: Compares economic behaviors of descendants of emigrants from each side of the border, now residing in the same city.  
  3. **Game Arm**: Lab-in-the-field coordination games with migrant/non-migrant samples, testing transmission pathways (household vs. school).  

  ### Reasons for Conditional Funding  
  The proposal advances a novel, actionable definition of culture and a multi-method design that could meaningfully advance debates on causal explanation in social science. However, critical revisions are needed to ensure feasibility, falsifiability, and alignment with the council’s mandate. The conditional approval addresses the panel’s core concerns while preserving the project’s innovative core:  

  1. **Statistician’s Concern (Border Arm’s Institutional Confounding)**  
     - **Issue**: If institutions are shaped by expectations, the border design cannot isolate culture from institutional remnants.  
     - **Required Revision**: Applicants must add a pre-analysis of institutional divergence *during* the outcome period (e.g., court records, local governance changes) to empirically test whether institutions remained "identical" post-redistricting. If divergence is found, the design must incorporate controls or adjust claims.  
     - **Actionability**: This revision is feasible using archived district records and strengthens causal identification.  

  2. **Falsifiability and Game Arm Design**  
     - **Issue**: Without pre-registered magnitude predictions, the game arm risks post-hoc redescription of outcomes as focal points.  
     - **Required Revision**: Pre-register testable predictions for the game arm’s effect sizes (e.g., expected % difference in coordination success when defaults are disrupted) and transmission strength (household vs. school). Predictions must be grounded in archival focal-point data.  
     - **Actionability**: Pre-registration is standard practice; applicants can implement this via platforms like OSF.  

  3. **Budget and Timeline**  
     - **Issue**: The 4-year timeline and archival component risk overlap with humanities funding lines.  
     - **Required Revision**: Reduce project to **3 years** by:  
       - Prioritizing the border and epidemiological arms (years 1–2).  
       - Scaling back the game arm to focus on one transmission pathway (e.g., households only) and reducing sample size.  
       - Clarifying that archival work uses pre-existing digital records (e.g., digitized bylaws) to avoid humanities-budget conflicts.  
     - **Actionability**: Applicants indicated flexibility in scaling; this ensures eligibility under social-science criteria.  

  ### Causal Test Requirement  
  **Yes, the design can deliver the opposite answer**. The **border arm** is pivotal: If economic outcomes are identical despite divergent focal points (measured in pre-outcome bylaws), the claim that expectations are difference-making causes would be falsified. The epidemiological arm could also falsify by showing no behavioral divergence among emigrant descendants. The game arm’s falsifiability hinges on pre-registered predictions (see above).  

  ### Strongest Consideration for the Losing Side  
  **Funding this project buys a study of "culture" redefined as shared expectations—not values, norms, or meanings—and risks relabeling, not resolving, the core dispute**. The historian’s critique has merit: If culture is reduced to focal points (equilibrium selection), the project sidesteps the Weberian tradition where culture *interprets* actions through values (e.g., thrift as a sacred duty). A successful result would show that expectations cause outcomes, but it would not engage the deeper debate about whether "meaning" is reducible to coordination. Economists might see this as dissolving the structure/agency divide; interpretivists may view it as a category error that neglects hermeneutics. If funded, we accept that this project could shift the dispute’s terrain ("Is culture just expectations?") rather than settle it.  

  ### Next Steps
  Applicants must resubmit by **October 15** with:  
  1. A plan for analyzing institutional divergence in the border arm.  
  2. Pre-registered predictions for the game arm’s effect sizes and transmission pathways.  
  3. A 3-year budget, scaled-back game arm, and justification for archival work under social science.  
  The panel will review revisions on **October 20**. If approved, funding will be released by November 1.  

  ---  
  **Endorsement**: This memo reflects the panel’s split and provides applicants clear, actionable guidance. I recommend circulating it for signatures/annotations by **September 14**.
