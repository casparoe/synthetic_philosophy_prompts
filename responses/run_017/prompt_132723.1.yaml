prompt: |-
  I write about science and ideas, and I keep running into the Kelly criterion at the edges of a piece I'm doing on long-term thinking. At a conference last month, a speaker who advises large foundations said: "bet Kelly — in the long run, anyone who isn't maximizing the log ends up with essentially nothing compared to someone who is." He was leaning on it for two conclusions: that institutions expecting to exist for centuries, and perhaps humanity itself, shouldn't be maximizing expected value at all; and that this licenses extreme caution about small probabilities of existential catastrophe. He also gestured at something about time averages versus ensemble averages, which I didn't follow.

  I'd like the distinct precise theses that sentence could be expressing, set out as a menu I can check against him rather than as a single verdict. The readings I can half-formulate are: a mathematical result about asymptotic dominance in repeated multiplicative bets; a claim that only the almost-sure growth rate, or the median outcome, is worth caring about; a claim that log utility is the correct attitude to risk; and the stronger claim that expected-value reasoning is a category error for anything that persists through time. For each, say whether it is a theorem, a stipulation about what to optimize, a substantive normative claim, or false — and what it assumes (repeated independent bets, reinvestment of everything, no absorbing states, a single decision-maker rather than one payoff among many).

  Two things matter most for the article. First: does any reading actually carry his jump from maximizing expected log wealth to conclusions about catastrophe, given that extinction looks like a one-off absorbing outcome rather than a bad draw in a long series of reinvested bets? Second: is the asymmetry real and reportable — is overbetting worse than underbetting, and in what exact sense? Please also say how confident you are in each verdict, and single out the point you are least sure of.
reasoning: |-
  Okay, let me start by unpacking this user's query. They're a science writer working on a piece about long-term thinking and encountered the Kelly criterion at a conference. The speaker made a strong claim: that anyone not maximizing log wealth ends up with nothing compared to those who do, especially for long-term institutions. The user wants to dissect this into precise theses and check them against the speaker's arguments.

  First, I need to recall the Kelly criterion's basics. It's about optimal bet sizing for repeated gambles to maximize growth. The key is maximizing the expected logarithm of wealth. The user mentioned asymptotic dominance in repeated bets. So, theorem-wise, yes, with repeated independent bets and reinvestment, Kelly maximizes long-term growth rate almost surely. But assumptions matter: no absorbing states, fixed bet opportunities. Existential risk might break these assumptions.

  The user's main concerns are two-fold. First, does Kelly really apply to existential catastrophes? Since extinction is a one-time, absorbing event, it doesn't fit the repeated bet model. The speaker's jump from Kelly to caution on extinction risks might not hold. Second, is there an asymmetry where overbetting is worse than underbetting? In Kelly, overbetting leads to ruin faster, but underbetting grows slower but safely. For long-term entities, avoiding ruin is crucial, hence the asymmetry.

  I should break down the speaker's statement into distinct theses. Let's list them. Thesis A: asymptotic dominance. That's a theorem with specific assumptions. Thesis B: only growth rate matters. That's a normative stance, not a theorem. Thesis C: log utility as correct risk attitude. Again, normative. Thesis D: expected value as a category error. This is more contentious and depends on the context.

  For existential risk, the absorption point is critical. Kelly assumes no absorbing barriers, but extinction is exactly that. So applying Kelly here might not be straightforward. The speaker's caution might stem from misunderstanding the model's limits. The asymmetry in over vs underbetting is real in terms of risk of ruin, which is crucial for long-term entities.

  The user needs clarity on whether the speaker's conclusions hold. I should emphasize that for one-off extinction risks, expected utility might still apply, and Kelly isn't directly relevant. The asymmetry point stands, but within the context of repeated bets. Confidence levels: high on the mathematical theses, medium on normative claims, low on applying Kelly to extinction without adjustments.

  I need to ensure the user can verify each part of the speaker's statement against these theses. Highlighting assumptions like reinvestment, independence, and no absorbing states is key. Also, clarifying that the jump to catastrophe caution isn't directly supported by Kelly unless the model is adjusted, which is a stretch.
answer: |-
  Here's a breakdown of the distinct theses embedded in the speaker's statement, formatted as a menu for verification, along with analysis of their validity, assumptions, and your specific questions:

  **Thesis Menu: Decoding "bet Kelly... ends up with essentially nothing"**

  1.  **Thesis A (Asymptotic Dominance Theorem):** In the limit of infinitely many repeated, independent, multiplicative bets with reinvestment of all wealth and *no absorbing states*, the Kelly strategy (maximizing expected log wealth) almost surely results in wealth that is infinitely larger than the wealth resulting from any other essentially different strategy.
      *   **Nature:** **Theorem.** (Derived from the Law of Large Numbers/Ergodic Theorem applied to log returns).
      *   **Assumptions:** Repeated independent bets, full reinvestment, no absorbing states (like ruin or infinite wealth in finite time), fixed opportunity set, single decision-maker/isolated wealth.
      *   **Verdict:** **True** (under strict assumptions). Confidence: **High**.
      *   **Relevance to Speaker:** This is the core mathematical engine driving the "ends up with nothing" rhetoric. "Essentially nothing" means the *ratio* of non-Kelly wealth to Kelly wealth approaches zero almost surely.

  2.  **Thesis B (Growth Rate Primacy):** For an entity focused on very long-term survival and growth (centuries+), the *only* rationally defensible objective is to maximize the almost-sure asymptotic growth rate (or equivalently, maximize the median long-term outcome), which is achieved by maximizing expected log wealth.
      *   **Nature:** **Substantive Normative Claim** (built on Thesis A).
      *   **Assumptions:** The entity's sole goal is indefinite multiplicative growth/survival; the repeated bet model (Thesis A assumptions) is an adequate approximation for the entity's fundamental challenges; "long-term" is long enough for asymptotic dominance to be the overriding concern.
      *   **Verdict:** **Debatable, but common/persuasive for long horizons.** Confidence: **Medium-High** (as a common perspective, not an absolute truth).
      *   **Relevance to Speaker:** This justifies the jump from Theorem A to the institutional recommendation ("institutions... shouldn't be maximizing expected value"). It prioritizes avoiding ruin and ensuring growth over maximizing short-term EV.

  3.  **Thesis C (Log Utility as Correct Attitude):** The utility of wealth is inherently logarithmic. Therefore, maximizing expected utility *requires* maximizing expected log wealth.
      *   **Nature:** **Substantive Normative Claim** (often stemming from axioms like proportional gambling or relative risk aversion).
      *   **Assumptions:** Utility is defined solely over terminal wealth; the axioms of expected utility theory hold; logarithmic utility accurately reflects the entity's risk preferences *regardless of time horizon*.
      *   **Verdict:** **Normative choice, not a theorem.** Confidence: **Medium** (Log utility is a *common* and *sensible* choice for growth/very long horizons, but not the *only* rational choice. Linear utility (max EV) or other concave forms are also defensible under different normative frameworks/goals).
      *   **Relevance to Speaker:** Provides an *alternative* justification for Kelly besides asymptotic dominance (Thesis B). Speaker likely leans on Thesis B more heavily.

  4.  **Thesis D (EV as Category Error):** For entities persisting through time and facing repeated multiplicative decisions, expected-value (linear utility) reasoning is fundamentally incoherent or leads to guaranteed failure; it is a "category error" for such contexts.
      *   **Nature:** **Strong Substantive Normative Claim** (largely derived from Thesis A & B).
      *   **Assumptions:** The entity's environment is fundamentally characterized by repeated multiplicative growth/bets; survival/growth is paramount; the long-term horizon makes the almost-sure failure of non-Kelly strategies (under Thesis A assumptions) the defining feature.
      *   **Verdict:** **Overstated, but directionally correct under strong Thesis B belief.** Confidence: **Medium-Low**.
      *   **Relevance to Speaker:** This is the strongest interpretation of "shouldn't be maximizing expected value *at all*". While max-EV *is* demonstrably suboptimal and dangerous for long-term multiplicative growth under Thesis A conditions, calling it a "category error" is philosophically strong. Expected utility theory itself can accommodate long-term perspectives by choosing the *right* utility function (like log).

  **Addressing Your Core Questions:**

  1.  **The Jump to Catastrophe Caution:**
      *   **Does Kelly *directly* license this? No.** The core Kelly theorem (Thesis A) *assumes no absorbing states*. Existential catastrophe is the ultimate absorbing state (ruin). Kelly tells you how to optimally grow *if you survive*, but doesn't directly price the *probability of ruin itself* within its core formula.
      *   **Can it be *argued* based on Kelly insights? Yes, but carefully:**
          *   **Thesis B Implication:** If your paramount goal is *very* long-term survival/growth, then strategies risking even small probabilities of extinction are unacceptable *if they don't sufficiently enhance growth conditional on survival*. Kelly's focus on avoiding ruin (growth rate >0) aligns with this. A max-EV approach might accept a small extinction risk for a large EV gain, but if extinction happens, there is no "long run" – violating the core premise of Thesis B.
          *   **The Ruin Asymmetry:** Kelly inherently incorporates the asymmetry of ruin. Losing everything is infinitely worse than gaining a finite amount in log terms. This *general intuition* about ruin being uniquely bad supports caution regarding extinction, even if the original math doesn't model it directly.
          *   **Modified Models:** Extensions of Kelly-like reasoning (e.g., optimizing growth rate *subject to* a constraint on probability of ruin over a horizon, or using utility functions with very high aversion to near-zero wealth) can formally justify extreme caution for low-probability ruin events, especially for long horizons. The speaker is gesturing towards this intuition.
      *   **Conclusion:** The speaker's jump isn't a strict *mathematical* consequence of the basic Kelly Criterion. However, it's a logically coherent *extension* of the core Kelly *philosophy* (Thesis B) – prioritizing survival and long-run growth above all else – applied to the ultimate absorbing state. It highlights that max-EV reasoning is particularly dangerous when ruin is possible.

  2.  **The Asymmetry (Overbetting vs. Underbetting):**
      *   **Is it real? Yes, critically.**
      *   **In what sense?** Within the Kelly framework (repeated bets, reinvestment):
          *   **Overbetting (Betting > Kelly Fraction):** Dramatically increases the probability of ruin (hitting zero wealth) *in finite time*. The growth rate becomes *negative* – wealth *shrinks* on average. This is catastrophic failure. ("Risk of ruin" asymmetry).
          *   **Underbetting (Betting < Kelly Fraction):** Results in a *lower* growth rate than Kelly, but the growth rate remains *positive*. Wealth grows, just slower than optimally. You sacrifice potential gains but survival is much more secure. ("Growth rate penalty" asymmetry).
      *   **Why the Asymmetry Matters:** For an entity prioritizing long-term survival (Thesis B), *overbetting is far worse* than underbetting. Overbetting risks complete and irreversible failure. Underbetting is suboptimal but sustainable. Kelly finds the precise point that maximizes growth *while keeping the probability of ruin acceptably low* (specifically, asymptotically zero for fractional Kelly < 1 under standard assumptions).
      *   **Reportability:** This asymmetry is fundamental to the Kelly result and is mathematically demonstrable (e.g., compare the probability of ruin or the long-run growth rate for fractions above and below Kelly). Confidence: **High**.

  **Confidence Summary & Least Sure Point:**

  *   **Thesis A (Asymptotic Dominance):** High Confidence (Theorem).
  *   **Thesis B (Growth Rate Primacy):** Medium-High Confidence (Strong normative claim logically following from A for very long horizons, widely accepted in certain fields).
  *   **Thesis C (Log Utility Correct):** Medium Confidence (A common and sensible normative choice, but not the *only* one; depends on goals).
  *   **Thesis D (EV Category Error):** Medium-Low Confidence (Strongly worded; max-EV *is* flawed for long-term multiplicative growth, but calling it a "category error" may overstate the case).
  *   **Catastrophe Jump (Not Direct):** High Confidence (Core theorem assumes no absorption).
  *   **Catastrophe Jump (Philosophical Extension):** Medium Confidence (Coherent extension of Thesis B).
  *   **Asymmetry (Over vs Under):** High Confidence.

  **Least Sure Point:** I am least confident about **Thesis D (EV as Category Error)**. While I strongly agree max-EV is disastrous for long-term multiplicative growth under the standard Kelly assumptions, declaring it a fundamental "category error" feels too absolute. Expected utility theory is a broad framework; the "error" lies in choosing the wrong *utility function* (linear) for the specific context (long-term multiplicative survival/growth), not necessarily in the framework itself. A dedicated max-EVer might argue they simply have different goals (e.g., maximizing expected wealth at a fixed finite horizon, regardless of ruin risk). Thesis B captures the essential clash without needing to dismiss EV reasoning entirely.
