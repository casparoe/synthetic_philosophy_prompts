prompt: |-
  Compose a case to the following specification. I need it for a seminar on causation by omission: I want to press a difference-making theorist into either accepting both of two omissions as causes of a bad outcome or producing some non-normative condition that makes only one of them eligible.

  Design a pair of cases, written together in at most 200 words, set in an ordinary institutional context — a hospital ward, a nursery, a plant floor, a signal box, your choice. In each, one person fails to act, and a bad outcome follows. The two cases must be alike in the counterfactual respects that bear on the outcome: the same kind of outcome, produced by the same kind of process, where in each case had the agent acted the outcome would not have occurred, and where the omission is not a case of symmetric overdetermination among several non-actors and does not work by double prevention. They must also be alike in every normative respect: no duty, role, office, rule, promise, contract, special relationship, or expectation attaches to either agent, and neither agent did anything earlier that created the danger. The cases are to differ in one respect only — say so plainly if you need more than one — and that respect must not be normative. It is what makes the omission a cause in one case and not in the other.

  Then give me, under the following headings:

  - **The pair** (one paragraph, both cases in matched language, no asymmetry of tone or framing doing any work).
  - **Held fixed** (~100 words): the counterfactual and normative facts common to both, as a checklist I can run against the paragraph.
  - **Three accounts** (~250 words): what a difference-making account, a norm-based account, and an agency account each say in each case, and why.
  - **The feature** (~130 words): name the single non-normative feature doing the work, argue that it is not a duty, expectation, or difference-making fact in disguise, and say what becomes of the pair if it is deleted and nothing else changes. Commit to one feature rather than canvassing candidates.
  - **The counterattack and your verdict** (~180 words): the strongest move available to the difference-making theorist — stipulation, a pragmatic or conversational explanation of the asymmetry, or just biting the bullet — and then your own verdict on whether the pair survives it. Take a side.
  - **Fragility** (~60 words): where the case is most likely to break.
reasoning: |-
  Okay, let me approach this causation by omission problem systematically. The user wants paired cases that challenge difference-making theories while excluding normative factors - a sophisticated philosophical puzzle.

  First, I need to design twin scenarios identical in counterfactual and normative aspects but differing in one non-normative feature that makes one omission causal and the other not. Hospital settings work well for clear causal chains with observable outcomes. The IV pole scenario provides the necessary physical continuity while avoiding overdetermination traps.

  For the critical difference, I'm considering proximity. When Nurse A stands passively next to the failing equipment while Nurse B is equally idle but distant, spatial presence creates an intuitive causal distinction without introducing duties or expectations. The IV bag's physical position relative to each nurse serves as the non-normative differentiator.

  Now structuring the response: The paired cases must mirror each other precisely in language. Held Fixed section will explicitly list the shared counterfactual conditions (same outcome mechanism, identical preventive action) and normative neutrality (no roles/duties). For the Three Accounts, difference-making theory faces symmetrical treatment while norm/agency theories can distinguish via presence. 

  The proximity feature needs defense against being covertly normative - it's purely physical and deleting it collapses the distinction. When anticipating counterarguments, the difference-maker might invoke conversational pragmatics, but I'll argue this concedes the explanatory gap. The fragility lies in whether presence truly affects the physical causal chain.

  Throughout, I must maintain strict neutrality in case descriptions and keep within the 200-word limit for the pair. The hospital context keeps it accessible while allowing precise control over variables.
answer: |-
  ### The Pair
  On Ward 7, Nurse A stands beside Patient X's IV pole as the fluid bag empties unnoticed. The reservoir alarm is disabled. Nurse A watches passively, does nothing, and the line runs dry, triggering cardiac arrest. On Ward 8, Nurse B sits in the break room, unaware that Patient Y's identical IV bag is emptying silently nearby. The alarm is also disabled. Nurse B remains seated, does nothing, and Patient Y suffers cardiac arrest. In both cases, had either nurse checked and replaced the bag, the arrest would have been prevented.

  ### Held Fixed
  **Counterfactual:** Identical outcome (arrest); same causal process (empty bag → air embolism); single omission per case; acting (replacing bag) prevents outcome; no overdetermination/double prevention.  
  **Normative:** No role-duty (both off-shift), no contract/promise, no special relationship, no prior danger creation, no institutional rule violation, no expectation to monitor (ward is quiet, no assigned tasks). Neither nurse is blameworthy.

  ### Three Accounts
  *   **Difference-Making:** Both omissions are causes. For Patient X: Had Nurse A acted, arrest avoided. For Patient Y: Had Nurse B acted, arrest avoided. No counterfactual difference exists between cases; both satisfy necessity/sufficiency conditions equally. Rejecting either causal status is arbitrary.
  *   **Norm-Based:** Neither omission is a cause. Causation requires breach of duty; here, no duty exists for either nurse to act. The outcome is merely a tragic accident, not caused by either nurse's inaction.
  *   **Agency/Process:** Only Nurse A's omission causes Patient X's arrest. Nurse A is *present at the scene* as the process unfolds. Their inaction is part of the unfolding physical sequence (empty bag → arrest) by failing to interrupt it *in situ*. Nurse B's absence means their inaction isn't integrated into the causal process; the arrest unfolds independently of their location.

  ### The Feature
  The non-normative feature is **physical presence at the unfolding process location**. Nurse A is beside the failing IV pole; Nurse B is in the break room. This isn't duty-based proximity (no expectation to be there/act). It's not difference-making: counterfactually, both nurses *could* have been present and acted. If presence is deleted (both nurses are identically absent in the break room), the asymmetry collapses. Both omissions become causally equivalent non-presences.

  ### The Counterattack and Verdict
  **Counterattack:** The difference-maker bites the bullet: *both omissions are causes*. The intuitive asymmetry stems from *pragmatics*: we focus on nearby agents when explaining outcomes, but causation is purely counterfactual. Insisting only presence "counts" smuggles in unstated norms about situational awareness or opportunity.  
  **Verdict:** The pair survives. The counterattack renders causation explanatorily hollow. It cannot capture why Nurse A's omission feels *integral* to the process (like a missing component) while Nurse B's feels *external* (like a missing rescuer), despite identical counterfactual dependence. This distinction is causal, not pragmatic. Presence provides a non-normative, non-difference-making basis for it.

  ### Fragility
  The case breaks if presence is framed normatively (e.g., implying an "opportunity" entails a duty) or if the physical process lacks continuity (e.g., the arrest requires a separate triggering event after the bag empties, potentially decoupling omission from outcome). Defining "unfolding process location" precisely is also critical.
