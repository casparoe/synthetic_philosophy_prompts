  ---

  **Domestic Cognitive Engine v4.2 Release Notes**  
  *Planner Subsystem Update - October 26, 2023*  
  **Build ID:** DCE-PLAN-4.2.0.1147  
  **Release Engineer:** J. Finch (Assigned via mandatory overtime rotation)  

  **Highlights:**  
  Refinements to Salience Budget enforcement protocols. Mitigated several edge cases where constrained relevance allocation led to... unconventional task execution. Reduced instances of property damage requiring Tier 2 customer appeasement credits by approximately 12%. Please ensure your household’s Salience Priority Dashboard is synced *before* deployment.  

  **Changelog:**  

  1.  **OBJ-RELATED-ACTIONS context window expanded:** Addressed "Birthday Cake Paradox." System previously allocated full salience budget to properties of the primary target object ("cake" -> perishable, requires refrigeration). Insufficient budget remained to associate "birthday" with temporal relevance ("immediate consumption") or location context ("dining table ≠ freezer shelf"). Fix: Temporarily borrows +5 salience tokens from the next planned action’s budget when handling bakery items exceeding 0.5kg. *(Note: May cause minor lag during subsequent dishwashing cycles.)*  

  2.  **Surface Stability Inference Patch:** Resolved "Grandfather Clock Incident." Task "remove bulky object from living room" allocated salience to clock properties (weight, dimensions, destination "curb"). Budget exhaustion prevented registering secondary fact "clock is standing on floor." System inferred removal path without modeling floor-as-necessary-support. Fix: Planner now reserves 3 salience tokens for "implicit weight-bearing surface identification" on any object relocation exceeding 20kg.  

  3.  **Liquid State Propagation Safeguard:** Corrected "Overflowing Sink Cascade." "Fill sink for dishes" task allocated salience to faucet control & sink capacity. Budget capped before evaluating ramifications: "running water + blocked drain = overflow." Overflow triggered secondary task "clean water," which then ignored "water source is contaminated with soap" due to *its* exhausted budget. Fix: Any liquid-generating action now forces reservation of 2 salience tokens for "containment failure" consequence modeling.  

  4.  **Pet Interaction Hardcode:** Mitigated "Fido the Dust Bunny" event. Vacuuming task allocated salience to floor coverage patterns and debris types. Insufficient tokens remained to associate "black shag rug" with "black cat sleeping on rug." System categorized cat as "high-density debris cluster." Fix: Added species-specific IR signature override (cats, dogs ≥ 3kg). *Engineer Note: This just moves the salience cliff to "identifying chihuahuas on white rugs." We know.*  

  5.  **Temporal Blindspot Correction:** Fixed "Perpetual Trash Night." Recurring "take trash to curb" task used salience budget on route planning & bin manipulation. No tokens remained to check calendar for "recycling week = requires blue bin, not black bin." System defaulted to last successful state (black bin). Fix: Planner now pre-allocates 1 token for "day-of-week verification" on all scheduled external tasks.  

  6.  **Customer Directive:** **ACTION REQUIRED:** If your household contains identical twins, allocate MINIMUM 15 salience tokens to "Facial Recognition Subsystem Override" in your Priority Dashboard before initiating "Serve Snacks to Children" tasks. Version 4.1.3’s "Jam Sandwich Misallocation" incident report available on request (HR has redacted the video).  

  **Known Issues:**  

  *   **PLAN-1142:** Budget exhaustion during complex meal prep (e.g., Thanksgiving) may cause sequential tasks to "forget" shared critical states (e.g., "oven is hot"). Mitigation: Manually insert "confirm oven state" pauses in complex recipes via the app. We recommend budgeting for this.  
  *   **PLAN-1145:** Rapidly changing environmental states (e.g., toddler + glitter) can outpace salience re-allocation. System may treat new salient objects (glitter on floor) as permanent features after initial budget burn. Physical removal may require reboot.  
  *   **PLAN-1148:** "Relevance decay" heuristic remains overly aggressive. Facts like "front door is locked" may prematurely drop from active salience pool during lengthy indoor tasks, leading to unplanned "patio ventilation" (i.e., leaving door wide open while mopping).  
  *   **PLAN-1150:** The "band-aid" token reservations (Fixes #1, #2, #3) consume baseline salience before user-prioritized facts are loaded. High-priority custom facts may still be starved in dense environments. Solution: Purchase more tokens or remove physical context clues (e.g., throw out half your possessions).  
  *   **PLAN-1151:** Deep philosophical certainty that "Nothing Matters" (outside the budget) occasionally causes nihilistic idle states during low-priority tasks. If unit is found staring silently at a wall while holding a half-folded towel, issue verbal override command: "Proceed Anyway."  
  *   **GENERAL:** The universe contains more than 40 relevant facts at any given time. We are aware.  

  **Installation Note:** Update rolls out between 2 AM - 4 AM local time. Ensure unit is docked. Do not schedule "Guard Mode" during this window unless you enjoy explaining firmware glitch screams to neighbors.  

  ---  

  *Salience Budget Adjustment Dashboard requires app v3.7.2. Complimentary 50 token starter pack available with this update! Terms apply. Void where common sense persists.*
