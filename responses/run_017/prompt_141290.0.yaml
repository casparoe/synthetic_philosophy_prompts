prompt: |-
  hey — I need a parody for a newsletter I put together, and I want it to make an actual AI researcher or philosopher of mind groan rather than just smile. Write me the release notes, 500-600 words, for version 4.2 of the planning system in a general-purpose household robot, in the deadpan voice of a slightly burnt-out release engineer at the company that makes it. Header, a short Highlights blurb, then numbered changelog entries, then a Known Issues section.

  The conceit to build it around: since nobody can tell the system what's relevant, the company now sells relevance as a metered resource. Every household gets a monthly salience budget — the planner may treat at most 40 facts as possibly relevant to any single action, everything else is assumed unchanged and ignored — and users can buy more or set priorities in an app. Every changelog entry should be a fix that came out of a real failure caused by that budget: the robot that fetched the birthday cake and filed it in the freezer because it only considered facts about cakes, the one that carried the grandfather clock to the curb because it reasoned about the clock and not about what the clock was standing on, and so on. Invent your own, keep them ordinary and domestic, but get the structure right — I want the qualification problem, the ramification problem and the plain relevance problem to show up as three distinguishable kinds of bug with three distinguishable kinds of patch, without any character ever using those words. Also include one entry whose fix is a hard-coded rule an engineer half-admits is just the same problem pushed somewhere else, and one entry that is really just an instruction to the customer.

  The Known Issues section is where the honest part should leak out. Write it in American English, and don't explain the philosophy anywhere — no footnotes, no winking, let the entries carry it.
reasoning: |-
  Okay, the user wants a parody newsletter release notes for a household robot's planning system. They're targeting AI researchers and philosophers of mind - meaning the humor needs technical depth beyond surface-level jokes. The core conceit is brilliant: relevance as a metered resource where families get a "salience budget," leading to absurd failures when the system oversimplifies reality.

  Hmm, the user clearly understands AI's core challenges - the qualification problem (exceptions to rules), ramification problem (unintended consequences), and relevance problem (what facts matter). They want these baked into fictional bug reports without naming them. Smart approach - the comedy comes from showing, not telling.

  Let me unpack their requirements:  
  - Header and highlights blurb setting the tone  
  - Changelog entries (8-10 items) showing different bug types  
  - Must include:  
    * A failure from only considering facts about a primary object (cake/freezer)  
    * A ramification failure (grandfather clock/floor)  
    * One "band-aid" fix that displaces the problem  
    * One passive-aggressive customer instruction  
  - Known Issues section where the truth leaks through  

  The voice needs deadpan burnout - think sysadmin documenting yet another midnight crisis caused by salience limits. American English, no winking. Each entry should feel like a real engineer's patch notes: brief, technical, but screaming existential dread between the lines.  

  For the failures, I'll brainstorm domestic disasters:  
  * Qualification failure: Robot ignores "unless it's raining" when taking trash out, leading to soaked garbage  
  * Ramification failure: Moving a rug without considering the vase on it  
  * Relevance failure: Washing a cat because "furry thing" matched the dog's shampoo instructions  

  The band-aid fix could be something like "special-cased birthday cakes" while admitting it'll break for anniversaries. The customer instruction should sound helpful while implying "this is your fault for being poor."  

  Known Issues need layered despair:  
  - "Budget exhaustion may cause spontaneous philosophical skepticism about object permanence" (nods to Hume)  
  - "Planning horizon collapses to immediate perception" (embodied cognition fail)  

  This walks the line between technical accuracy and Kafkaesque corporate logic. The humor hits because every AI researcher has fought these fires - just rarely with literal birthday cakes in freezers.
