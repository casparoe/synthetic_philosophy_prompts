  ## The Will's Objectification

  The bass, the weight of rock and ocean deep,  
  Where glaciers grind and buried strata sleep.  
  The tenor, sap that swells in root and shoot,  
  A pulse of green without a thought or foot.  
  The alto, beast that pants in chase or flight,  
  With need that burns but cannot seek the light.  
  The soprano, human, soaring high and clear,  
  A tune of goals that purpose seems to steer—  

  Yet hark! This melody, so sure and planned,  
  Is but the bass’s groan by mortal hand.  
  The same blind thirst that moves the stone and sea  
  Now wears the mask of human agency.  
  Those sweet concords that promise peace at last?  
  Just hunger briefly stilled—no truce holds fast.  

  So let the dream of difference be undone—  
  We are the will, and it alone, that drives the sun.  

    
  For in the quiet where no voices start,  
  We see: our ends are nature’s striving’s heart.
