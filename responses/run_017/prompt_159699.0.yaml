  For my response, I'll emphasize that proper scoring rules force us to report whatever minimizes expected loss given the scoring scheme, which may differ from actual credence. In B, 2/3 is instrumentally rational but doesn't reflect Beauty's true belief about the coin. 

  The deeper point is this: Beauty gains no new coin-relevant evidence upon awakening. Her credence should stay at Sunday's 1/2. The scoring anomalies arise because awakenings aren't equally probable experiences - tails creates two moments of identical uncertainty. 

  I must be careful not to let the user collapse the distinction between belief and rational action under scoring constraints. That's the thin edge of the wedge. The calibration argument in A is more fundamental because it claims to show thirder probabilities are objectively correct, whereas B's issue is self-inflicted by the scoring setup.
answer: |-
  Your B-case argument cleverly highlights a tension, but I'll bite the bullet: when Beauty learns *within an awakening* that hers is the scored one in B, she *should* report 2/3 to maximize expected score—and this *doesn't* contradict my core claim that her *credence in Heads remains 1/2*. The key is distinguishing rational action under a scoring rule from genuine belief. Scorebook B creates a *selection effect*: learning "my awakening is scored" provides indexical information that *differentially screens* Tails awakenings (only half are scored, while all Heads awakenings are scored). This moves the *instrumentally optimal report* to 2/3 because it minimizes expected scoring loss *given this new information*—but it doesn't mean her underlying credence in the coin's outcome changed! Her intrinsic belief that P(Heads) = 1/2 persists (as no new coin-relevant evidence exists), yet the scoring rule's structure *penalizes* her for reporting it once she knows she's scored. Calibration failure in B? Yes—but that's an artifact of scoring *biased samples* of awakenings (only one per run), not proof that 1/2 was wrong. Meanwhile, A's 1/3 "calibration" is worse: it conflates belief with the fact that Tails *duplicates awakenings*. Your move.
