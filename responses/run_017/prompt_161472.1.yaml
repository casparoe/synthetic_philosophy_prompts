    *"Today, we’ll play a game with envelopes containing tokens. Every token you earn goes into a class bank. At the end, the bank buys something for everyone. Your job is simple: in each round, you get an envelope and decide whether to keep it or switch it for another. Record every choice and reason on your sheet. Rules:  
    1. Do not discuss amounts or reasons until I say so.  
    2. Write honest reasons in your words—no right or wrong answers.  
    3. In paired rounds, do not show your amount to your partner until both decide.  
    Let’s begin."*  

  #### **5-15 min: Blind Round**  
  - **Procedure:**  
    - Use **Generator A** to fill envelopes (10 pairs of `(x, 2x)`; e.g., (2,4), (8,16)).  
    - Distribute randomly.  
  - **Instructions:**  
    *"Do not open your envelope. Decide: stay or switch? Write your choice and reason. Reason example: ‘I switched because I felt lucky.’"*  
    - After 2 min: *"Reveal both amounts. Record: Amount Seen (leave blank—you didn’t peek), Choice, Final Tokens, If Stayed, If Switched."*  
  - **Why:** Establishes baseline behavior without information. Most will switch randomly.

  #### **15-25 min: Peek Round**  
  - **Procedure:** Same as Blind Round (new pairs via **Generator A**).  
  - **Instructions:**  
    *"Open your envelope and see the amount. Do not tell others. Write it down. Then decide: stay or switch? Add a one-sentence reason. Example: ‘I saw 8 tokens; I switched because 8 is too low.’"*  
    - After 2 min: *"Reveal both amounts. Record all columns."*  
  - **Anticipated Issue:** A student may write the 1.25x argument (*"Other envelope is half or double, so switching gains 25% on average"*). **Do not engage yet.** Say: *"Interesting—we’ll test this later with data."*  

  #### **25-40 min: Paired Exercise**  
  - **Procedure:**  
    - Pair students (10 pairs). Use **Generator A** for one pair of envelopes (e.g., 16 and 32).  
    - Give each pair a **Paired Exercise Card** (instructions below).  
  - **Card Instructions (verbatim):**  
    *"You and your partner have two envelopes. Open yours and see your amount. Do not share or discuss. Decide privately: stay or switch? Write your reason. When both are done, reveal amounts and record outcomes."*  
  - **Student Tasks:**  
    - Record: *My Amount, Choice, Final Tokens, If Stayed, If Switched, Partner’s Final Tokens*.  
    - Discuss: *"What happened when one switched and one stayed? What if both switched?"*  
  - **Why:** Reveals switching is zero-sum (e.g., if Partner A switches from 16→32, Partner B loses 32→16). Students see the symmetry.  

  #### **40-70 min: Game Rounds (Generators A & B)**  
  - **Structure:** 4 rounds per game (8 total). Each round:  
    - Assign roles per pair: **Policy** (peek and decide) or **Coin Flip** (peek, then flip coin: heads=switch, tails=stay). Rotate roles each round.  
    - **Game 1: Generator A** (fixed pair, randomized assignment).  
    - **Game 2: Generator B** (causal chain: `y` → `2y` or `y/2`).  
    - **Do not label generators**—call them "Game 1" and "Game 2."  
  - **Instructions:**  
    *"New game! In each round, Policy players decide after peeking. Coin-flip players flip a coin. Record amounts, choices, and outcomes. Reveal both envelopes after decisions."*  
    - Regenerate envelopes each round using the tables.  
  - **Key Data Collection:**  
    - Students record *Actual Tokens* (their choice) and *Coin-Flip Tokens* (what coin would have given).  
    - **Threshold Policy Emergence:** Some Policy players will intuitively switch for low amounts (e.g., "I saw 4, so I switched"). Note this for debrief.  

  #### **70-90 min: Debrief**  
  **Goal:** Map moments from the activity to resolve the paradox. Use student data.  

  1. **Aggregate Data (5 min):**  
     - Calculate class totals:  
       - *Actual Tokens* (all students’ choices).  
       - *Coin-Flip Tokens* (simulated 50% switching).  
       - *Blind-Switch Tokens* (what if everyone always switched).  
     - **Sample Results (expected):**  
       - *Game 1 (Generator A):* Actual ≈ Coin-Flip (switching neutral).  
       - *Game 2 (Generator B):* Actual > Coin-Flip (switching beneficial if threshold used).  

  2. **Compare Generators (5 min):**  
     - Reveal: *"Game 1 used Generator A (fixed amounts, random assignment). Game 2 used Generator B (your amount set the other)."*  
     - Show student reasons from Peek Round (e.g., *"I switched because I saw 4"*). Ask:  
       *"Did this reason work in both games? Check your data."*  
     - **Key Insight:** In Generator B, switching helps for low amounts (e.g., 4, 8) but hurts for high (e.g., 32). In Generator A, it’s neutral always.  

  3. **Resolve the 1.25x Argument (5 min):**  
     - Invite the student with the algebra to board:  
       *"Suppose you see amount X. The other is X/2 or 2X. Expected value: (0.5)(X/2) + (0.5)(2X) = 1.25X. So always switch!"*  
     - **Test with Data:**  
       - *Game 1:* Show that for a given X (e.g., 16), average gain was positive (e.g., switched to 32 or 8 → average 20).  
       - *Game 2:* For X=16, gains were mixed (e.g., switched to 32? +16; to 8? -8).  
       - Ask class: *"When did the 1.25X logic hold? Why not in Game 2?"*  
       - **Conclusion:** The logic assumes half/double are equally likely **given X**, but Generator B makes this false (e.g., seeing 16 is more likely when 32→16 than 8→16).  

  4. **Threshold Policy & Boundedness (3 min):**  
     - Highlight a student who used a threshold (e.g., *"Switch if I see <10"*).  
       - *"In Game 2, this beat coin-flip. Why? It avoided switching at high amounts (e.g., 32→16)."*  
     - **Stretch the Generator:**  
       *"What if we added 128 or 256? Your threshold of 10 would now switch at 128 → lose 64. The advantage would vanish. Your written reason didn’t change, but the generator did."*  

  5. **What the Activity Can’t Capture (2 min):**  
     - *"In a true one-shot game with no bounds, you have no data. The 1.25X argument feels compelling, but it depends entirely on the unseen generator. Peeking only helps if you know the generator’s limits—otherwise, switching is futile."*  

  ---

  ### **Anticipated Issues & Solutions**  
  - **Noise in Small Samples:** With 20 students × 8 rounds = 160 data points, trends will be clear. Pre-calculate expected totals for Generators A/B to validate.  
  - **Students Who Don’t Write Reasons:** Gently enforce: *"Your reason helps us learn—write anything, even ‘I felt like it.’"*  
  - **Friends Sharing Amounts Mid-Round:** Remind rules: *"If you discuss early, you bias the data—everyone loses tokens."*  
  - **Confusion in Paired Exercise:** Clarify: *"Swapping simultaneously means if both switch, you exchange envelopes; net transfer is zero."*  
  - **Student Apathy:** Emphasize real stakes: *"Your tokens = shared snacks. 3,000 tokens = pizza; 1,000 = fruit; 0 = nothing."*  

  ---

  ### **Instructor Notes**  
  - **Why This Works:**  
    - The paradox emerges from student reasons (Peek Round) and data discrepancies (Game 1 vs. 2).  
    - Generators A/B feel identical to students (same amounts, same arguments) but produce different results.  
    - Threshold policies and boundedness are discovered, not lectured.  
  - **Core Lesson:**  
    - *"The switch argument depends entirely on how the envelopes were filled. Peeking only tells you about the generator’s edges—not a universal 25% gain."*  

  By the end, students will see the paradox in their own handwriting and data—making the debrief a collective "aha" moment.
