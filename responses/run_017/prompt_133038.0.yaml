answer: |-
  Below is a problem-set question designed to meet your specifications. The question has four parts, is answerable in about an hour, and includes a model answer, marking scheme, and notes on common errors. It uses your contamination example with adjusted figures for cleaner arithmetic while preserving the conceptual structure.

  ---

  **Problem Set: Jeffrey Conditioning and the Source-Blindness Puzzle**  
  *(Total Marks: 20)*  

  **Background:**  
  Consider a radiation monitoring scenario. Let \(H\) be the hypothesis that a sample is contaminated (prior \(P(H) = 0.5\)). A detector produces a binary reading \(E\) (positive or negative). The likelihoods are:  
  - \(P(E^+|H) = 0.9\) (positive if contaminated)  
  - \(P(E^+|H^c) = 0.1\) (positive if not contaminated).  

  An agent initially has \(P_\text{old}(E^+) = 0.5\). After an observation, their confidence in \(E^+\) shifts to \(P_\text{new}(E^+) = 0.8\). Jeffrey’s rule updates \(P(H)\) by holding **rigidity** (i.e., \(P_\text{new}(H|E^+) = P_\text{old}(H|E^+)\) and \(P_\text{new}(H|E^-) = P_\text{old}(H|E^-)\)).  

  **Two Scenarios for the Shift:**  
  - **Scenario A (Ambiguous Perception):** The agent views the detector in poor lighting, making the reading visually ambiguous but suggestive of \(E^+\).  
  - **Scenario B (Correlated Calibration):** The agent learns the detector was set to "high-gain mode," which occurs more frequently when samples are contaminated.  

  Jeffrey’s rule gives \(P_\text{new}(H) = 0.7\) in both cases.  

  ---

  **Questions:**  
  **1. (5 marks)**  
  Calculate \(P_\text{new}(H)\) using Jeffrey’s rule. Show your work and verify that it is \(0.7\).  

  **2. (6 marks)**  
  Explain whether the shared output (\(P_\text{new}(H) = 0.7\)) is a *defect* of Jeffrey’s rule or a *consequence* of what rigidity represents. In your answer:  
  - State what rigidity assumes about the *source* of the probability shift.  
  - Contrast what the agent is *certain of* in Scenario A vs. Scenario B.  

  **3. (5 marks)**  
  A proposed modification (**Cause-Relative Rigidity**) requires the agent to specify a cause \(C\) for the shift (e.g., \(C_A\) = "visual ambiguity" or \(C_B\) = "high-gain log entry"). Rigidity holds only conditional on \(C\):  
  \[
  P_\text{new}(H|E^+, C) = P_\text{old}(H|E^+, C) \quad \text{and} \quad P_\text{new}(H|E^-, C) = P_\text{old}(H|E^-, C).
  \]  
  Does this modification collapse into ordinary Bayesian conditioning? Justify your answer.  

  **4. (4 marks)**  
  Does the "minimum-information" generalization of Jeffrey’s rule (which minimizes epistemic divergence) address the source-blindness concern? Explain briefly.  

  ---

  **Model Answer**  
  *(~720 words)*  

  **1. Calculation via Jeffrey’s Rule**  
  Rigidity implies:  
  \[
  P_\text{new}(H|E^+) = P_\text{old}(H|E^+), \quad P_\text{new}(H|E^-) = P_\text{old}(H|E^-).
  \]  
  First, compute \(P_\text{old}(H|E^+)\) using Bayes’ theorem:  
  \[
  P_\text{old}(H|E^+) = \frac{P_\text{old}(E^+|H)P_\text{old}(H)}{P_\text{old}(E^+)} = \frac{(0.9)(0.5)}{0.5} = 0.9.
  \]  
  Similarly,  
  \[
  P_\text{old}(H|E^-) = \frac{P_\text{old}(E^-|H)P_\text{old}(H)}{P_\text{old}(E^-)} = \frac{(0.1)(0.5)}{0.5} = 0.1.
  \]  
  By rigidity, \(P_\text{new}(H|E^+) = 0.9\), \(P_\text{new}(H|E^-) = 0.1\).  
  Now apply the law of total probability with \(P_\text{new}(E^+) = 0.8\):  
  \[
  P_\text{new}(H) = P_\text{new}(H|E^+)P_\text{new}(E^+) + P_\text{new}(H|E^-)P_\text{new}(E^-) = (0.9)(0.8) + (0.1)(0.2) = 0.72 + 0.02 = 0.7.
  \]  
  ✔️ Result is \(0.7\).  

  **2. Shared Output: Defect or Feature?**  
  The shared output is a **consequence** of rigidity, not a defect. Rigidity assumes the *shift in \(P(E^+)\) carries no further information* relevant to \(H\) beyond what is already captured by the partition \(\{E^+, E^-\}\). It formalizes the idea that the *reason* for the shift does not alter how \(H\) depends on \(E\).  

  - **Scenario A (Ambiguous Perception):** The agent is certain *only* of their ambiguous sensory state (e.g., "the display looked blurry but positive-leaning"). They treat \(E^+\) as uncertain evidence.  
  - **Scenario B (Correlated Calibration):** The agent is certain of the logbook entry (e.g., "high-gain mode was recorded"). However, high-gain mode correlates with \(H\), so learning \(C_B\) *directly* impacts belief in \(H\) *independently* of \(E\).  

  The problem arises because rigidity forces Scenario B to ignore the correlation between \(C_B\) (high-gain) and \(H\). Jeffrey’s rule "source-blindly" assumes the shift *only* affects \(E\), but in Scenario B, the cause \(C_B\) provides extra information about \(H\) *unrelated* to \(E\). Thus, rigidity fails in Scenario B, making \(0.7\) incorrect there. The shared answer reflects rigidity’s idealization that the shift is "pure" to \(E\).  

  **3. Cause-Relative Rigidity**  
  This modification **does not collapse into ordinary conditioning**. Ordinary conditioning requires certainty about a specific event (e.g., \(C\) or \(E\)), but here:  
  - \(C\) is certain (e.g., \(P_\text{new}(C_A) = 1\)), but \(E\) remains uncertain.  
  - Rigidity is applied to \(\{E^+, E^-\}\) *given* \(C\), not to \(C\) itself.  
  - The update uses \(P_\text{new}(E^+|C)\) and \(P_\text{new}(H|E, C)\), not \(P_\text{new}(C)\).  

  **Example**: In Scenario B, let \(C_B\) = "high-gain mode is recorded". The agent sets \(P_\text{new}(C_B) = 1\). Cause-relative rigidity requires assessing \(P_\text{old}(H|E^+, C_B)\) and \(P_\text{old}(H|E^-, C_B)\) *before* the shift. If high-gain mode correlates with contamination, \(P_\text{old}(H|E^+, C_B) \neq P_\text{old}(H|E^+)\), so the update differs from standard Jeffrey conditioning. The rule now has an "extra argument" (\(C\)) and avoids source-blindness by conditioning on the cause.  

  **4. Minimum-Information Generalization**  
  The minimum-information (min-entropy) version of Jeffrey’s rule **does not resolve** source-blindness. It minimizes epistemic divergence subject to the constraint \(P_\text{new}(E^+) = 0.8\), but:  
  - It still takes only \(P_\text{new}(E^+)\) as input, ignoring *why* probabilities shifted.  
  - The constraint \(P_\text{new}(E^+) = 0.8\) may be satisfied by many probability distributions, but the chosen distribution depends only on the prior and the partition—not the cause.  
  - Without including \(C\) in the constraint set, it cannot distinguish Scenario A from B.  
  This generalization optimizes for "least committal" changes but inherits rigidity’s blindness to the shift’s source.  

  ---

  **Marking Scheme**  
  *(Total: 20 marks)*  

  **Part 1 (5 marks)**  
  - Correct \(P_\text{old}(H|E^+) = 0.9\) (1 mark)  
  - Correct \(P_\text{old}(H|E^-) = 0.1\) (1 mark)  
  - Correct application of total probability: \(P_\text{new}(H) = (0.9)(0.8) + (0.1)(0.2)\) (2 marks)  
  - Correct result \(0.7\) (1 mark)  
  *Common error*: Misapplying Bayes’ theorem (e.g., ignoring \(P_\text{old}(E^+)\)).  

  **Part 2 (6 marks)**  
  - Identifies shared output as a *consequence* of rigidity (1 mark)  
  - States rigidity assumes the shift carries no further information beyond the partition (2 marks)  
  - Contrasts certainty: A: sensory state; B: logbook entry (2 marks)  
  - Notes rigidity fails in B due to extra correlation (1 mark)  
  *First-class insight*: Explicitly linking Scenario B’s correlation to rigidity violation.  

  **Part 3 (5 marks)**  
  - States modification **does not collapse** into conditioning (1 mark)  
  - Justifies: \(C\) is certain but \(E\) is not (1 mark), rigidity is conditional on \(C\) (1 mark)  
  - Explains cause-specific likelihoods may differ (e.g., \(P(H|E, C_B) \neq P(H|E)\)) (2 marks)  
  *First-class insight*: Using Scenario B to show \(C_B\) alters likelihoods.  

  **Part 4 (4 marks)**  
  - States **no resolution** of source-blindness (1 mark)  
  - Explains input is still only \(P_\text{new}(E^+)\) (1 mark)  
  - Notes cause \(C\) is not in constraint set (2 marks)  
  *Common error*: Confusing min-information with causal modeling.  

  --- 

  **Design Notes**  
  - **Arithmetic**: Simplified likelihoods (\(0.9/0.1\) vs. \(0.8/0.2\)) avoid decimals in calculations.  
  - **Source-blindness**: Part 2 forces the key insight; Part 4 preempts overrating min-information.  
  - **Cause-relativity**: Part 3 tests if students see it generalizes Jeffrey (without collapsing).  
  - **No citations**: All arguments self-contained (e.g., "pragmatic arguments for conditioning" described via Scenarios A/B).  
  - **Time**: Focused subparts fit ~1 hour; marks prioritize conceptual depth.  

  This question meets your goals: it exposes rigidity’s source-blindness, tests comprehension beyond rote recital, and leverages your contamination example with lab-appropriate rigor.
