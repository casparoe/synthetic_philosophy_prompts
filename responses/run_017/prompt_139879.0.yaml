  I should ensure the memo avoids academic terms. For example, explaining "complicity" as concern over association with harm. Highlighting that Housing First focuses on data (retention, reduced ER visits) while the coalition cares about their reputation and moral stance. The compromise lets each side prioritize what matters most to them without forcing endorsement.

