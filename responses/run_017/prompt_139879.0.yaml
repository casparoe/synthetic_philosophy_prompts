answer: |-
  **MEMORANDUM**  
  **TO:** Homeless Services Board Allocations Committee  
  **FROM:** [Your Name], Committee Member  
  **DATE:** [Current Date]  
  **SUBJECT:** Proposed Structure for $4.2M State Block Grant Allocation  

  ---

  ### **BOTTOM LINE (Recommendation)**
  I propose we designate **the County itself as the Lead Agency** to implement a **Housing First permanent supportive housing program** using the full $4.2M grant. Concurrently, we allocate **separate, existing County funds** (non-grant) to the Faith-Based Coalition to operate an **opt-in, abstinence-based transitional recovery program** at one of their facilities. Key conditions:  
  1.  **Strict program separation:** No shared branding, materials, or mandated referrals.  
  2.  **Formal Board statement:** The Board records in minutes that funding separate models does not constitute endorsement of either approach by the other party.  
  3.  **Timeline:** Coalition agreement required within 7 days. Final grant application submitted by the County to the State by Day 10.  
  **If the Coalition refuses:** We revert to a unified model vote per original options, accepting the risk of their withdrawal.  

  *(120 words)*  

  ---

  ### **WHAT WE'RE REALLY DISAGREEING ABOUT**
  This isn't one disagreement, but two intertwined ones:

  1.  **Outcome Effectiveness:** Does requiring sobriety *before* housing lead to better long-term outcomes (reduced substance use, sustained independence) than providing housing *first* with voluntary support? The Coalition believes abstinence-based transitions are more effective and that Housing First enables harmful behavior. The Housing First side cites extensive research showing higher long-term housing retention, reduced ER/jail use, and better engagement with voluntary services when barriers are removed. Both sides genuinely want successful outcomes but disagree fundamentally on the evidence and method to achieve them.

  2.  **Moral Complicity:** Does associating resources (buildings, volunteers, name) with a program model you believe is *harmful* constitute unacceptable participation in that harm? For the Coalition, this is paramount. Their objection to Housing First is less about doubting *some* housing retention data, and more about a core belief that *their specific contribution* would facilitate a model they see as morally wrong. The Housing First side prioritizes measurable outcomes over symbolic association; they see the Coalition's stance as imposing a values test that excludes the most vulnerable.

  The deadlock stems from both disagreements being deeply held. Splitting the grant money 50/50 (if allowed) only partially addresses the first, and ignores the second entirely.  

  *(248 words)*  

  ---

  ### **WHY THIS BEATS SPLITTING THE DIFFERENCE**
  Splitting the $4.2M grant itself (if possible) would be a true compromise: both models get half the funds, meaning both sides get *less* of what they want. Neither program would be adequately resourced, and crucially, it *forces* the Coalition to be directly financially tied to Housing First – exacerbating their complicity concern.

  This proposal is **not a financial split**. It’s an **unbundling**:

  *   **Housing First Gets What It Values Most:** Full funding ($4.2M) for a high-fidelity Housing First program under the County's name, maximizing potential for proven outcomes (long-term housing stability, reduced system costs). The County’s leadership removes the Coalition's branding/operational objections. The Coalition's separate program poses no barrier to this model's implementation.
  *   **The Coalition Gets What It Values Most:** **Separation from Moral Complicity.** Their buildings, volunteers, donations, and name are *not* attached to Housing First. They receive County funds (from a *separate* source) to run their abstinence-based program, preserving their mission and operational integrity. They avoid endorsing the model they oppose.
  *   **Outcome Concerns Addressed (For the Coalition):** For Coalition members who fundamentally doubt Housing First's effectiveness: This structure *allows them to prove their alternative works* with public funds, without being dragged down by a model they oppose. Success in their opt-in program strengthens their future case. Their core complicity objection is resolved regardless of outcome beliefs. Both programs operate, serving potentially different populations based on choice/need.

  This isn’t logrolling ("I'll support your bad thing if you support mine"). It’s enabling each side to pursue their primary goal – effective outcomes *or* moral integrity – without forcing the other side to abandon theirs. The County leverages *different* funding streams to maximize overall service capacity.  

  *(299 words)*  

  ---

  ### **THE STRONGEST THING ON THE OTHER SIDE**
  The most compelling counter-argument is this: **"Accepting County funds to run our own program *while the County simultaneously funds Housing First* still makes us complicit. Our resources (even separate funds) come from the same entity actively promoting harm. Taking the money silences our principled objection and validates the County's support of an immoral model. True integrity requires withdrawing entirely."**

  This perspective asserts that the "unbundling" doesn't go far enough. The Coalition's moral objection isn't *just* to their name/building being used *for* Housing First; it's to *any* association with an entity (the County Board) that actively chooses to fund and operate that model. Accepting separate County money could be seen as hypocritical – profiting from the system they condemn. The "minuted non-endorsement" may feel like a hollow technicality if the County is visibly running Housing First next door.

  Furthermore, the **practical threat is real and severe**. Losing 70% of volunteers and a shelter building *would* cripple existing services unrelated to this grant, harming currently sheltered individuals. Calling the "bluff" is a massive gamble with vulnerable lives. Even if the Coalition *shouldn't* link their contributions to the grant model, their ability to do so gives them significant leverage. Accepting this deal might feel like rewarding an ultimatum, potentially encouraging similar tactics in the future. The "compromise" itself could be seen as the County endorsing moral relativism, undermining a clear stance on evidence-based practice.  

  *(248 words)*  

  ---

  ### **IF THEY SAY NO**
  If the Coalition rejects this specific proposal within 7 days:  

  1.  **Immediate Vote:** The Board must vote directly on the two original, unified model options (Housing First with County as Lead Agency vs. Abstinence-Based Transitional with Coalition as Lead Agency) using the full $4.2M grant.  
  2.  **Contingency Planning:** *Regardless of which model wins*, County staff must urgently develop contingency plans for potential Coalition withdrawal of volunteers and lease termination. This includes:  
      *   Quantifying the volunteer gap and exploring rapid municipal/other NGO recruitment.  
      *   Identifying alternative emergency shelter locations/capacity (county-owned buildings, other leases).  
      *   Estimating the budget impact of replacing lost resources.  
  3.  **State Notification:** Inform the State Program Officer of the chosen unified model and potential operational challenges due to partner withdrawal, seeking any flexibility or support available.  

  We cannot force the Coalition's participation. A "No" means we choose one model fully and manage the consequences. This proposal is our best chance to avoid that lose-lose scenario.  

  *(150 words)*  

  ---  
  **Recommended Board Action:** Motion to approve the structure outlined in the "Bottom Line" section, contingent on formal agreement from the Faith-Based Coalition within 7 days, and authorize the Chair and County Administrator to finalize necessary agreements and submit the grant application.
