prompt: |-
  i'm on a city charter review commission (mid-sized city, we also run the regional water utility) and we keep circling the same fight: who gets a say on what. three live cases: whether long-term non-citizen residents can vote in municipal elections, whether an unincorporated neighborhood just outside the city limits that draws on the same aquifer gets any input into a water-rate restructure, and whether people who've lived abroad for twenty years but still own property here keep their vote. i tried to write down my actual view rather than just settling each case by gut, and i want a consistency check before i bring it back to the committee. here it is:

  1. the all-affected principle is the right starting point: the demos for a decision is everyone whose important interests are substantially affected by it.
  2. the demos has to be settled in advance and independently of the decision. you need a roll, you cant discover who was entitled to vote by seeing how things turn out, and nobody should get to resize the electorate to win.
  3. children and adults with severe cognitive disabilities are in. i'm fine with guardians or proxies casting those votes.
  4. i'm an instrumentalist about why democracy is worth having: it tracks the common good better than the alternatives, and i don't think there's a freestanding right to participate that holds regardless of outcomes.
  5. non-citizen residents: yes in municipal elections, no in national ones.
  6. future generations count, and i want an institution for them — some kind of guardian body with a suspensive veto over irreversible decisions.
  7. my own bit, which i invented and am sort of proud of: instead of a binary in/out, three tiers — full members who vote, associate members who can speak and propose but not vote, and conditional standing, where outsiders whose expected stake in a particular decision crosses a threshold get a vote on that decision and nothing else.

  all seven feel equally solid to me, which is exactly why i'm suspicious. please go through the set and tell me which pairs are actually in tension, rank those tensions by how bad they are, and for each one say which commitment has to give and what giving it up would cost me. i also want to know if any of them only look inconsistent and turn out to be fine on closer inspection — and if so, why the appearance. concrete cases please: if one of these can't deliver the verdict i actually want in the aquifer case, or in the non-citizen case, say which one and show me where it breaks. finally, is there a single revision that cleans up the most at once, and is my tiered scheme (7) helping or just making the underlying mess worse?
reasoning: |-
  Okay, the user is on a city charter review commission dealing with governance boundaries and voting rights. They've outlined seven principles they believe in but want a consistency check before presenting them to the committee. Let me start by understanding each point and how they interact.

  First, the all-affected principle (1) states that anyone significantly affected by a decision should have a say. But they also want the demos settled in advance (2). These two might clash because determining who is affected might only be clear when the decision is made. For example, in the water-rate case, the unincorporated neighborhood using the aquifer isn't automatically included. If the demos is fixed beforehand, those residents might be excluded even though they're affected. That's a major tension.

  Then, instrumentalism (4) values democracy for its outcomes, not participation as a right. But including children and cognitively disabled individuals via proxies (3) might not directly improve decision quality. If the proxies don't align with the individuals' interests, it could undermine the instrumental goal. This is a moderate tension.

  Non-citizen voting in municipal elections (5) aligns with the all-affected principle since local decisions impact them directly. But excluding them from national elections might conflict if national policies also affect them. However, the user might prioritize jurisdictional boundaries here, so this might be manageable.

  Future generations (6) needing a guardian body fits with including affected interests but clashes with advance settlement (2). The guardianship is a workaround, but how is that body appointed? If current members choose guardians, it might not truly represent future generations. Also, the tiered system (7) could help here by giving guardians a voice without a vote, but the suspensive veto might complicate things.

  The tiered membership (7) tries to address gaps in the all-affected principle but conflicts with advance settlement (2). Conditional standing allows outsiders to vote on specific issues, but determining when their stake is significant enough requires case-by-case assessment, which violates settling the demos in advance. In the aquifer case, conditional standing would grant the neighborhood a vote, but only if their stake is recognized beforehand, which isn't guaranteed. This creates procedural challenges and potential disputes over thresholds.

  The property owners abroad (20 years) case tests the all-affected principle. Do their property interests constitute an important stake? If yes, they should vote under (1), but if the demos is settled in advance, they might be excluded. The tiered system might classify them as conditional, but again, that requires ad hoc decisions, conflicting with (2).

  The biggest tension is between (1) and (2). The aquifer case shows that fixed boundaries might exclude affected parties. To resolve, the user might need to relax (2) by allowing predefined categories for conditional membership, but that requires clear thresholds. Alternatively, expand the predefined demos to include certain groups, but that might not cover all cases.

  Another tension is between instrumentalism (4) and including children via proxies. If proxies don't accurately represent the vulnerable, decisions might not serve the common good. Ensuring proxy accountability is key here.

  The tiered system (7) helps by adding flexibility but risks complexity and implementation issues. Without clear criteria for conditional standing, it might lead to arbitrary inclusions or exclusions. The user needs to define stakes and thresholds precisely to make it work.

  A possible revision is to adjust (2) to allow conditional standing based on predefined, objective criteria. For example, water users within a certain geographic area get a vote on rate changes. This balances advance settlement with affected interests. Also, specifying how future guardians are appointed could strengthen (6).

  In summary, the main conflicts are between inclusion based on affectedness and fixed demos, and instrumentalism versus proxy representation. The tiered system can help if structured with clear rules, but without them, it complicates things. The user should refine the conditional standing criteria and ensure proxies are accountable to maintain instrumental effectiveness.
answer: |-
  Here's a breakdown of the tensions within your framework, ranked by severity, with concrete examples showing where they break and what giving way might cost. Your tiered scheme (7) is a bold attempt to resolve core tensions but introduces new complexities.

  **Ranked Tensions & Concrete Breakdowns:**

  1.  **Tension: (1) All-Affected Principle vs. (2) Demos Settled in Advance**
      *   **Severity:** **HIGH** (Fundamental conflict at the heart of your framework)
      *   **Why:** The All-Affected Principle *discovers* the demos based on the *specific impacts* of a *specific decision*. Settling the demos *in advance* defines it *procedurally* (citizenship, residency, property) *independently* of specific decision impacts.
      *   **Where it Breaks (Aquifer Case):**
          *   **Your View:** You likely want the unincorporated neighborhood drawing on the aquifer to have input on the water-rate restructure because they are *substantially affected* (Principle 1).
          *   **Conflict:** Your city's settled demos in advance (e.g., city residents/property owners) *excludes* them. Principle 2 prevents you from simply "discovering" them as affected now and adding them to the voter roll *for this specific decision*. Principle 7 (Conditional Standing) is your *attempted solution*, but see below.
      *   **What Gives? Consequences:**
          *   **If (1) Gives:** You prioritize a fixed demos. The unincorporated neighborhood gets no vote. You sacrifice responsiveness to actual impact for procedural certainty and stability. *Cost:* The "common good" tracked by democracy (Principle 4) might be worse because a significantly affected group is excluded, potentially leading to unfair rates or unsustainable resource management.
          *   **If (2) Gives:** You allow the demos to be defined per decision based on affectedness. *Cost:* Massive instability and complexity. Who defines "substantially affected" and "important interests" for *every* vote? Constant litigation and uncertainty ("Am I affected enough by this zoning change to vote?"). Settling results becomes chaotic (Principle 2's core fear). Your "roll" becomes fluid and contested.

  2.  **Tension: (1) All-Affected Principle + (7) Conditional Standing vs. (2) Demos Settled in Advance**
      *   **Severity:** **HIGH** (Conditional Standing directly challenges the rigidity of Principle 2)
      *   **Why:** Conditional Standing (7) is *explicitly designed* to address the gap between fixed demos (2) and all-affected (1). However, implementing it cleanly *without* violating the spirit of "settled in advance" is difficult.
      *   **Where it Breaks (Aquifer Case & Property Owner Abroad Case):**
          *   **Aquifer:** Conditional Standing *requires* determining *in advance of the vote* whether the unincorporated neighborhood's stake "crosses a threshold." This *is* part of "settling the demos" for *this specific decision*. Is this threshold defined clearly enough *in the charter/rules beforehand* (satisfying 2's spirit)? Or is it an ad-hoc determination per decision (violating 2)? If the threshold is predefined (e.g., "water users within the aquifer recharge zone"), it *partially* satisfies 2 but still expands the demos dynamically. If the threshold is judged per case, it's functionally similar to abandoning 2.
          *   **Property Owner Abroad:** Is their "expected stake" in a municipal election (taxes, property values, local services) "substantial" (1)? If yes, Conditional Standing (7) suggests they might get a vote on *some* issues (e.g., property tax levies, zoning near their property) but not others (e.g., school board). Principle 2 (settled demos) likely excludes them entirely as non-residents. Implementing 7 requires constant, case-by-case adjudication of stakes for specific decisions, conflicting with the stability goal of 2.
      *   **What Gives? Consequences:** This is the battleground for your framework. Principle 7 *is* the revision attempting to bridge 1 and 2.
          *   **To Make 7 Work with 2:** You need **extremely clear, predefined, objective criteria** for "conditional standing" thresholds *written into the charter/rules*. E.g., "Non-resident property owners may vote on ballot measures directly impacting property tax rates"; "Water users outside city limits drawing from [Named] Aquifer may vote on water rate structures." *Cost:* Complexity in the charter, potential for criteria to become outdated, may still miss some affected groups or include some with minimal stake.
          *   **If 7 is Too Vague/Ad-hoc:** It effectively sacrifices Principle 2, leading to the instability costs mentioned above.

  3.  **Tension: (4) Instrumentalism vs. (3) Inclusion of Children/Severe Cognitive Disabilities (via Proxy)**
      *   **Severity:** **MODERATE**
      *   **Why:** Instrumentalism (4) values democracy for its *outcomes* in tracking the common good. Including those who cannot directly form or express preferences (3) via proxies relies on the assumption that proxies *accurately represent* the interests of the vulnerable, leading to better outcomes. But proxies can be flawed (misaligned interests, poor judgment).
      *   **Where it Breaks:** Imagine a vote on deep aquifer mining vs. strict conservation (impacting future gens - 6). A guardian for a child with severe disabilities (3) might prioritize short-term economic gains (jobs for their family now) over the child's long-term need for water security. Does this inclusion lead to a *better* common good outcome (4)? Or does it distort the outcome towards short-termism? The proxy's vote might not track the vulnerable person's *actual* long-term interest or the broader common good.
      *   **What Gives? Consequences:**
          *   **If (3) Gives (Restrict Proxy Voting):** You limit voting to those presumed capable of direct judgment (e.g., competent adults). *Cost:* Excludes vulnerable populations whose interests *are* substantially affected (violating 1 & arguably harming the common good by ignoring their needs).
          *   **If (4) Gives (Accept Proxy Imperfection):** You acknowledge that proxy voting is imperfect but necessary for inclusion, hoping robust institutions and guardian accountability minimize distortions. *Cost:* Accepts some risk that inclusion via proxy might occasionally lead to suboptimal outcomes not aligned with the true common good or the vulnerable person's interest. Requires strong safeguards for proxies.

  4.  **Tension: (1) All-Affected Principle vs. (5) Non-Citizen Residents: No in National**
      *   **Severity:** **LOW-MODERATE** (Can be managed with jurisdictional reasoning)
      *   **Why:** National decisions (immigration, foreign policy, federal taxes) *do* substantially affect non-citizen residents. Principle 1 suggests they should have a say. Principle 5 carves out an exception.
      *   **Where it Breaks:** Should a long-term non-citizen resident get a vote on national immigration reform that directly impacts their status and family? Principle 1 says yes (substantially affected). Principle 5 says no.
      *   **What Gives? Consequences:**
          *   **If (1) Gives:** You accept jurisdictional boundaries as a practical limit on the all-affected principle. *Cost:* Acknowledges that perfectly implementing the all-affected principle across nested jurisdictions (local, state, national) is impossible. National demos is defined politically (citizenship), not purely by affectedness. This is a common compromise.
          *   **If (5) Gives:** Logically leads to advocating non-citizen voting in national elections where affected. *Cost:* Highly politically contentious, challenges traditional notions of national sovereignty and the social contract tied to citizenship. Likely conflicts with state/federal law.

  5.  **Tension: (1) All-Affected Principle + (6) Future Generations vs. (2) Demos Settled in Advance**
      *   **Severity:** **LOW** (Your Institution (6) is the designed solution)
      *   **Why:** Future generations are undeniably affected (1), but cannot be part of a settled roll (2). Your guardian body (6) is specifically created to resolve this.
      *   **Appearance of Inconsistency:** It *looks* like 1+6 violates 2 because future people aren't on the roll.
      *   **Resolution:** Your institution (6) *is* the mechanism for "settling" how future interests are represented *in advance*. You define *now* who the guardians are, how they are appointed/reviewed, and the scope of their veto. This satisfies the *spirit* of 2 (procedural certainty) while addressing 1. The tension is **apparent, not real**, because you've built a procedural bridge via 6.
      *   **Caveat:** *How* the guardian body is appointed matters. If appointed *only* by the current demos with no input from conditional/associate members or focus on long-term expertise, its ability to *truly* represent future interests might be weak, creating a *practical* tension with 1.

  **Assessment of Your Tiered Scheme (7):**

  *   **Helping:** It's a serious and innovative attempt to resolve the core tension (1 vs 2) and the future gens problem (by potentially making the guardian body "Associate Members" with voice/proposal power). It directly addresses the concrete cases:
      *   **Non-Citizen Residents:** Likely **Full Members** for municipal elections under your view (5).
      *   **Unincorporated Aquifer Neighborhood:** Prime candidates for **Conditional Standing** on water rate votes.
      *   **Property Owners Abroad:** Potential **Conditional Standing** on specific property-related decisions.
  *   **Making the Mess Worse?** Potentially, due to complexity:
      *   **Defining Thresholds:** "Substantial stake" for Conditional Standing is inherently fuzzy. Endless debates over what qualifies and how to measure it.
      *   **Administrative Burden:** Maintaining three distinct membership tiers, verifying stakes for conditional votes, managing different participation rights in meetings/voting is complex.
      *   **Legitimacy Challenges:** Those denied Conditional Standing for a vote they feel affected by will cry foul. Full members may resent outsiders voting on "their" issues. Associate members may feel powerless.
      *   **Gaming:** Attempts to structure decisions to avoid triggering Conditional Standing for certain groups, or to include favorable groups.

  **Single Revision to Clean Up the Most:**

  *   **Refine Principle 7 (Tiers) with Explicit, Predefined Criteria for Conditional Standing:** This directly tackles the 1 vs 2 tension – the biggest problem. Don't abandon 7, but hardwire clarity into it.
      *   **How:** Amend Principle 7 to: "...conditional standing, *as defined by specific, objective criteria established in the charter or by ordinance for categories of decisions*, where outsiders meeting those criteria for a particular decision get a vote on that decision..."
      *   **Impact:** Forces the city to define, *in advance*, what "substantial stake" means for different decision types (e.g., water rates = geographic aquifer zone + usage threshold; major zoning change = property within X feet; large bond = liability threshold). This:
          1.  Preserves the core insight of the All-Affected Principle (1).
          2.  Meets the need for a demos settled in advance *for the purpose of defining eligibility rules* (2).
          3.  Provides a clear mechanism for the Aquifer case and Property Owner Abroad case.
          4.  Makes the system more predictable and less prone to ad-hoc manipulation.
      *   **Cost:** Requires significant upfront work to define these criteria. The criteria themselves will be contentious and may need periodic revision. It's complex, but manages the complexity proactively.

  **Conclusion:**

  Your framework is thoughtful but the tension between the dynamic All-Affected Principle (1) and the static Settled Demos (2) is fundamental and severe. Your tiered system (7) is the key innovation aimed at resolving this. **Its success hinges entirely on implementing Conditional Standing with crystal-clear, predefined, objective criteria.** Without that, 7 risks collapsing into ad-hoc decision-making that violates 2. Refining 7 in this way is the most impactful single revision.

  The instrumentalism (4) vs. proxy inclusion (3) tension is manageable with careful design of proxy roles/accountability. The national non-citizen voting tension (1 vs 5) is best resolved by accepting jurisdictional boundaries. The future generations solution (6) successfully resolves its apparent tension with 2.

  Bring this back to the committee with a clear focus on *how* to operationalize Conditional Standing (7) with predefined criteria – that's where the hardest, but most necessary, work lies for making your innovative vision coherent and practical. Good luck!
