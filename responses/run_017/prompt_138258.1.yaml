answer: |-
  **MEMORANDUM**  
  To: Grants Allocation Panel Members  
  From: Chair  
  Date: 20 May 2024  
  Subject: Procedure and Decision for Application 24-P2-07  

  **The panel will adopt a modified conclusion-based voting procedure: after disclosure and discussion of premise-level judgements, a binding final vote on funding will determine the outcome; this application is rejected, with the reasons statement citing lack of confidence in recruitment feasibility and budget realism.**  

  ### Rationale for Procedure  
  Our deadlock arises from the tension between premise-based aggregation (which would approve this application 3–2 on rationale, 4–1 on recruitment, 3–2 on budget) and conclusion-based voting (which rejects 3–2). Both approaches have principled arguments, but practical imperatives—particularly the risk of externally inconsistent reasoning and the specific dynamics of this case—favour conclusion-based voting with safeguards.  

  Duval’s proposal offers the optimal framework: **premise-level judgements will be recorded and disclosed to the panel prior to a second round of deliberation, followed by a binding vote on the overall funding decision (the "conclusion")**. This respects the charter’s requirement for unanimous satisfaction of all three criteria *as evaluated by each member*, while ensuring the panel confronts potential inconsistencies between its collective premise assessments and individual conclusions. Crucially, it avoids the pitfalls of pure premise-based voting in this context.  

  ### Why Not Premise-Based Voting?  
  The epistemic argument for premise-based voting—that majority tallies on technical sub-questions are more reliable—is compelling in theory. If each premise vote reflected independent, expert judgements, aggregating them would likely yield superior outcomes. However, three features of our operation undermine this:  

  1.  **Interdependent Judgements**: Adeyemi’s "no" votes on recruitment and budget stem from a single linked concern (recruitment failure inflating costs). Premise-based voting inadvertently double-counts this objection, distorting the aggregate. Our criteria are not always orthogonal.  
  2.  **Variable Expertise**: Chandra’s "no" on scientific rationale (i) was not an informed scientific judgement but a procedural placeholder. A premise majority relying on her vote for (i) lacks the expert foundation the epistemic argument assumes.  
  3.  **External Accountability**: A premise-based approval would force a reasons statement asserting satisfaction of all three criteria, despite three members voting to reject the *whole proposal*. This invites a valid appeal citing incoherence ("The panel states criteria were met, yet a majority rejected the application").  

  Conclusion-based voting, while imperfect, ensures the decision aligns with each member’s holistic assessment and generates a defensible reasons statement. Disclosure of premise tallies *internally* before the final vote mitigates groupthink or oversight, allowing members to recalibrate if premise tallies reveal their position is isolated on key facts. Premise tallies will **not** be disclosed externally; they are a deliberative tool, not a formal output.  

  ### Decision on Application 24-P2-07  
  Applying this procedure:  
  - Premise tallies (Rationale: 3 yes/2 no; Recruitment: 4 yes/1 no; Budget: 3 yes/2 no) were disclosed.  
  - After re-discussion focusing on recruitment feasibility (Adeyemi’s linked concerns) and rationale clarity (addressing Chandra’s position), the binding conclusion vote remained **3 against (Adeyemi, Bryce, Chandra), 2 for (Duval, Eriksen)**.  
  **Funding is rejected.**  

  ### Reasons Statement  
  The following two-sentence statement will be issued:  
  > *"The application was rejected because the panel concluded, by majority vote, that the proposal did not convincingly demonstrate feasibility of cohort recruitment within the stated timeframe or provide a budget fully realistic for the work proposed. While the scientific rationale was supported by some members, this was insufficient to outweigh the concerns on feasibility and cost."*  

  **Justification for Wording:**  
  - It truthfully reflects the *conclusion* vote outcome ("majority vote").  
  - It cites the specific criteria (recruitment, budget) central to the majority’s rejection, without misrepresenting the split views on rationale ("supported by some members").  
  - It avoids contradiction: the rejection hinges on unmet criteria per the charter, not an assertion that all criteria failed unanimously. The applicant understands the grounds; trustees see the rationale vote was contested but not decisive.  

  ### Conclusion  
  This procedure prioritises decisional coherence, accountability, and resilience to appeal while harnessing premise-level insights during deliberation. It acknowledges the epistemic strength of premise aggregation where appropriate but recognises that our panel’s judgements—especially with linked concerns and varied expertise—are holistic acts best captured by a conclusion vote after full scrutiny. We adopt this for all applications henceforth.  

