  For the verdicts: Ockhamism says determinately false (actual future includes crate's destruction); settledness view says determinately false (laws+state fix destruction); occurrence view says indeterminate (event hasn't occurred); assessment-relativism says true relative to pre-shipment contexts but false relative to post-failure contexts.

