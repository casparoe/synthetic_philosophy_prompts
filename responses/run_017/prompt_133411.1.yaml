answer: |-
  ### Custom-Built Case: Warehouse Inventory Assurance  
  **Scenario**: At 10:00 AM, Lee, a logistics manager at a warehouse, inspects Crates 1–10 for a 2:00 PM shipment. Lee visually confirms all crates are intact and assured client Avery: "**Crate 7 will be on the shipment.**" Unbeknownst to Lee, during loading at 9:55 AM, Crate 7 suffered internal structural failure due to a latent flaw in its corner joint. The laws of physics (material fatigue propagation) dictate that this flaw will inevitably cause the crate to collapse under its own weight by 1:30 PM—before loading completes. The collapse is nomologically fixed at 10:00 AM: no agent can intervene (e.g., repairs are impossible without dismantling the crate, which would void the shipment), and no physically possible action after 9:55 AM could alter the outcome. The flaw is microscopically internal; it is undetectable by any non-destructive means available in 2023 (e.g., X-rays would miss it, sensors cannot penetrate the alloy). At 1:30 PM, Crate 7 collapses and is removed, failing to ship.  

  #### Verdicts on Lee's Assurance ("Crate 7 will be on the shipment") at 10:00 AM  
  - **Ockhamism**: **Determinately false.** The actual future branch at 10:00 AM includes the crate's collapse before shipment. The privileged branch settles that the crate does not ship, making Lee's claim false when uttered.  
  - **Occurrence-based openness**: **Indeterminate (no truth value).** The event (crate shipping) has not occurred or failed to occur by 10:00 AM. Truth value emerges only at 1:30 PM when the collapse happens, rendering the claim false retroactively.  
  - **Settledness-based openness**: **Determinately false.** The total state at 10:00 AM (including the flaw and laws of physics) nomologically fixes the collapse. Since the outcome is settled, the claim is false when uttered.  
  - **Assessment-relativism**: **Truth-value varies by context.** Relative to a 10:00 AM context (assuming no collapse), the claim is true; relative to a post-1:30 PM context (collapse occurred), it is false. No assessment-independent truth.  

  #### Downstream Question and Answers  
  **Question**: *An internal review must determine which of two conflicting assurances was correct at the time: Lee’s ("Crate 7 will ship") versus the safety officer’s 9:50 AM warning ("Crate 7 will collapse before shipping"). Whose judgment should the record canonize as sound at the time of utterance?*  
  - **Ockhamism**: Lee’s was false; the officer’s was true. The actual future settled both at 10:00 AM.  
  - **Settledness-based openness**: Lee’s was false; the officer’s was true. The outcome was causally settled at 10:00 AM.  
  - **Occurrence-based openness**: **Cannot answer.** Both claims were indeterminate at 10:00 AM; neither was true or false then. The review can only note later outcomes or epistemic fault (e.g., Lee’s inspection was diligent but unlucky), not truth-at-the-time.  
  - **Assessment-relativism**: No single answer. Lee’s claim is true relative to pre-collapse assessments, false later; the officer’s is false pre-collapse, true later. Canonization depends on the review’s temporal perspective.  

  #### Key Feature Doing the Work  
  **Hidden nomological fixation without occurrence**. The crate’s failure is physically inevitable at 10:00 AM but has not yet manifested. This separates *causal settledness* (present at 10:00 AM) from *occurrence* (at 1:30 PM).  
  - **Minimal perturbation (remove hiddenness)**: Suppose the flaw is visible. Now the settling fact (flaw) is knowable, making all views agree Lee’s claim was *epistemically unjustified* but *metaphysically indeterminate* (occurrence/settledness views) or *false* (Ockhamism). The verdict pattern collapses; occurrence and settledness views no longer diverge.  

  #### Extensionality Check  
  **Asymmetry signature**: Ockhamism relies on a *privileged future branch*, while settledness relies on *causal determination*.  
  - **Minimal change to break agreement**: Alter the case so the collapse depends on a future free choice. Suppose the flaw only causes collapse if a worker (unaware of the flaw) chooses to nudge the crate before 1:30 PM—which she freely will. Now:  
    - *Settledness view*: At 10:00 AM, outcome unsettled (choice not fixed), so Lee’s claim **indeterminate**.  
    - *Ockhamism*: Actual future includes the nudge and collapse, so Lee’s claim **determinately false** (invariant: privileged branch settles falsity regardless of causal gaps).  
  - **Confirmation**: Ockhamism’s verdict is unchanged by adding indeterministic elements; it depends solely on the actual future.  

  #### Occurrence-Theorist Replies and Counterarguments  
  1. **Implicit ceteris-paribus conditions?**  
     - *Reply*: Lee’s assurance implicitly assumes "barring unforeseen structural failures," so fulfillment depends on future non-collapse.  
     - **Counter**: The assurance is categorical ("will be on the shipment"), not hedged. The structural failure is not "unforeseen" but *physically inevitable and internal*—no external "paribus" condition (e.g., weather, sabotage) applies. The outcome is fixed by *past* states (flaw + loading stress), so no future contingency remains. Rebuttal: **Fails**.  

  2. **Track fault/assertibility, not truth?**  
     - *Reply*: The review should ask if Lee was *reasonable*, not whether the claim was true. Lee was diligent, so no fault.  
     - **Counter**: The question explicitly demands canonizing whose assurance was *correct* (sound/judicious) *at the time*. Assertibility (Lee’s evidence supported "will ship") and truth come apart: the officer’s evidence supported "won’t ship." Only truth-at-the-time explains why the officer, not Lee, was correct. Practice demands a truth-apt verdict (e.g., legal/financial consequences turn on accuracy). Rebuttal: **Fails**; the occurrence view cannot satisfy the practice without changing the subject to epistemology.  
     - **Stronger reply**: The first (it fails outright; the second might partially address blame but not correctness).  

  #### Assessment-Relativism’s Handling  
  The case poses no unique difficulty: relativism accommodates shifting truth-values across contexts. However, it struggles with the downstream question. If the review occurs post-collapse, it must judge Lee’s claim false relative to *its* context—but cannot say the officer was "right at the time" without privileging a past context (e.g., 9:50 AM). This clashes with practice, which requires a context-invariant fact about correctness *at the utterance time*. Relativism thus answers the question only by making canonization arbitrary or perspective-bound, which may not reflect institutional needs.  

  ### Why This Case Works for Your Purpose  
  - **Pulls apart non-occurrence and unsettledness**: Fixity is decoupled from occurrence via hidden, intervention-proof nomological determination (flaw + physics).  
  - **Satisfies all specifications**:  
    - (1) Fixity without occurrence: Collapse fixed at 10:00 AM; occurs at 1:30 PM.  
    - (2) Not epistemic: Flaw is *undetectable* by 2023 methods.  
    - (3) Unambiguous sentence: "Will be on the shipment" is categorical.  
    - (4) Verdict pattern: Ockhamism/settledness = false; occurrence = indeterminate.  
    - (5) Downstream demand: Occurrence view cannot call the officer "correct at the time"; others can.  
  - **No cheating**: No future choices, no disguised ignorance, no scope shifts. The sea-battle’s "open future" is shown to require *unsettledness* (non-fixity), not mere non-occurrence, since here the future is settled but open by occurrence-theoretic lights.
