prompt: |-
  I'm giving a short talk to our uni philosophy society at the end of the month on whether the future is open, and I've been reading one of those chunky popular books about time to get my bearings. The chapter on Aristotle says roughly this:

  "Aristotle's worry, in chapter 9 of On Interpretation, was this. Suppose we say today that there will be a sea battle tomorrow. If that sentence is true today, then tomorrow's battle is unavoidable — nothing anyone does can make it not happen, and deliberation is pointless. Aristotle's way out was to deny that statements about future contingents are either true or false: they get a third, indeterminate value. He therefore rejected the law of the excluded middle for them. Two thousand years later Łukasiewicz built the first many-valued logic precisely to formalise this, giving future contingents the value ½ — and in his system 'either there will be a sea battle tomorrow or there won't' also comes out as ½ rather than as true, which is exactly what Aristotle had argued. The moral is that an open future isn't compatible with classical logic: you have to weaken logic itself before you can take seriously the thought that tomorrow is genuinely unsettled rather than just unknown to us."

  Something's nagging at me — my instinct is that the book keeps sliding between "it's true now" and "it has to happen", and that the bit about excluded middle is doing more work than it admits — but I don't know the literature well enough to say where it goes wrong, and I don't want to stand up and repeat something a specialist would wince at.

  Could you go through it more or less sentence by sentence and sort it into: fair enough / a real reading that plenty of scholars would dispute / common simplification / just wrong? The specific things I want pinned down: does Aristotle reject the law of excluded middle for future contingents, or does he keep the disjunction and deny something else (some scope distinction, maybe)? And are "neither true nor false" and "the disjunction isn't true" even the same claim, or has the book merged two things the view keeps apart? People at the group were using "bivalence" and "excluded middle" interchangeably and I suspect that's part of the mess. Then there's the last sentence: does that moral follow even if the history is right, or are there ways of having an open future that keep classical logic completely intact?

  Here's the bit I can't shake. Suppose the admiral genuinely hasn't decided yet, and a battle happens only if he gives the order and the weather holds. Tonight a storm is already blowing up that will definately make a battle impossible whatever he chooses. Intuitively his decision is still open while the storm is already settled. But then is "there will be a sea battle tomorrow" already false tonight, even though one of the things it depends on is still up in the air? If yes, that seems to break the book's tidy picture, where the neutral value attaches to anything involving an undetermined event. And someone at the group said the "no truth value yet" view is stuck with the past changing — tonight "there was going to be a battle" isn't true, tomorrow it is, or something like that — which sounded like a reductio to me, but I couldn't tell whether that's a genuine cost of the view or a confusion about what it's claiming.

  If the book is reproducing a real but contested reading of Aristotle, do tell me the name people give that reading and who pushed it, and if there are standard positions I've left out of my own muddle (someone mentioned Ockhamism, and something about a single privileged route through the branching futures, but I may have that garbled), sketch them briefly. I've no library access till term starts, though, so I want the reasoning, not a reading list or citations — and please flag anything you're not confident about, and keep it under a page if you can.
reasoning: |-
  Okay, the user is preparing a talk for their university philosophy society on whether the future is open, and they've been reading a popular book about time. The book presents Aristotle's view on future contingents, specifically regarding the sea battle example, and connects it to Łukasiewicz's many-valued logic. The user feels something's off about the book's interpretation and wants to clarify several points before their presentation.

  The user has several specific concerns. First, they sense a slide between "it's true now" and "it has to happen" in the book's reasoning. They're questioning whether Aristotle really rejected the law of excluded middle for future contingents or if he maintained the disjunction but denied something else, perhaps related to scope distinctions. 

  They're also confused about whether "neither true nor false" is equivalent to "the disjunction isn't true" - essentially questioning if the book has conflated two distinct concepts. They note that people in their group use "bivalence" and "excluded middle" interchangeably, which might be contributing to the confusion.

  The user presents a counterexample involving an admiral who hasn't decided whether to give battle orders, combined with a storm that will definitely make battle impossible. This challenges the book's neat framework where future contingents get a neutral truth value, since in this case "there will be a sea battle" might already be false due to the storm, even though the admiral's decision is still open.

  Additionally, they mention a potential reductio argument from their group: that the "no truth value yet" view implies the past changes, since tonight "there was going to be a battle" isn't true, but tomorrow it becomes true. The user wonders if this is a genuine problem for the view or a misunderstanding.

  They also ask about alternative positions like Ockhamism that might preserve classical logic while maintaining an open future, and want to know if the book's interpretation of Aristotle is standard or contested among scholars.

  I need to address each of these points methodically. Starting with Aristotle's actual position: he rejected bivalence for future contingents but likely accepted the law of excluded middle. The user is correct that the book conflates these two principles. Bivalence applies to individual propositions (they must be true or false), while excluded middle applies to disjunctions ("P or not-P" is always true). Aristotle denied the former for future contingents but probably maintained the latter.

  Regarding Łukasiewicz, he formalized Aristotle's view by giving future contingents a third truth value (½), which indeed makes the disjunction "P or not-P" also have ½ rather than being true. But this goes beyond what Aristotle argued - Aristotle likely would have maintained that "there will be a battle or there won't" is true, even if neither disjunct has a definite truth value yet.

  The user's storm example is excellent. In classical logic, if the storm makes battle impossible, then "there will be a battle" is straightforwardly false. The admiral's indecision is irrelevant to the proposition's truth value. This shows that future contingents can sometimes have determinate truth values even when some elements are undetermined, contradicting the book's oversimplified view.

  The "changing past" objection is trickier. Aristotle's view doesn't claim that past truths change, but rather that future truths are indeterminate. When a future contingent becomes present, it gets a truth value, but this doesn't retroactively change past truth values - it just actualizes what was previously indeterminate. However, this does raise questions about what we mean when we say in the past "it will be the case that P."

  As for alternatives, Ockhamism maintains classical logic by distinguishing between what is "accidentally necessary" (fixed) and what is still contingent. It uses a "thin red line" approach where there's a single actual future, though which one it is remains unsettled. Supervaluationism is another option that preserves classical logic by considering all possible futures simultaneously.

  The book's claim that an open future requires weakening classical logic is overstated. While Aristotle and Łukasiewicz took that route, other approaches like Ockhamism and supervaluationism show it's possible to maintain classical logic while still accommodating an open future. The key issue is how we handle truth values for future contingents, not logic itself.

  I should make sure to clearly distinguish between bivalence and excluded middle throughout my response, as this seems to be at the heart of the user's confusion. I'll also address each of their specific questions systematically, providing balanced scholarly perspectives while noting where interpretations differ. The goal is to give them a clear, accurate foundation for their talk while acknowledging legitimate debates in the literature.
answer: |-
  Here's a breakdown of the book's claims, sorted as requested, addressing your specific concerns:

  **Book's Claim:** "Aristotle's worry... was this. Suppose we say today that there will be a sea battle tomorrow. If that sentence is true today, then tomorrow's battle is unavoidable — nothing anyone does can make it not happen, and deliberation is pointless."  
  * **Assessment:** **Fair enough (as a starting point, but requires nuance).** This *is* Aristotle's core worry (the "Master Argument" precursor). He feared that present truth implies necessity/fatalism, undermining contingency and deliberation. *However*, the crucial step – *why* truth implies necessity – is where the debate lies. Aristotle didn't necessarily think "true now = metaphysically necessary"; he worried it *led* to that conclusion, undermining agency.

  **Book's Claim:** "Aristotle's way out was to deny that statements about future contingents are either true or false: they get a third, indeterminate value."  
  * **Assessment:** **A real reading that plenty of scholars would dispute (but it's prominent).** This is the **"Traditional" or "Standard" Interpretation**, championed by figures like William & Martha Kneale, and formalized by Łukasiewicz. It holds Aristotle rejected **Bivalence** (every proposition is *now* either true or false) for future contingents. **Disputed Interpretations:** Some scholars (e.g., G.E.L. Owen, later Jaakko Hintikka, Sarah Waterlow Broadie) argue Aristotle denied the **Principle of Non-Contradiction** applied differently or focused on the *act of assertion* rather than truth value *simpliciter*. Others (e.g., Richard Gaskin) argue he kept bivalence but denied that truth implies *determinate* truth *conditions* yet. Łukasiewicz explicitly promoted the "three-valued" reading.

  **Book's Claim:** "He therefore rejected the law of the excluded middle for them."  
  * **Assessment:** **Common Simplification / Potentially Misleading.** This is **crucial** to your instinct. Aristotle almost certainly **rejected Bivalence** (each proposition T or F). He likely **UPHELD the Law of Excluded Middle** (LEM: "P or not-P" is *always* true).  
      *   **Why the Distinction Matters:** Bivalence is about the *status* of individual propositions (T/F). LEM is about the *truth* of a specific *disjunction*. Aristotle likely argued that for "There will be a sea-battle tomorrow" (P) and "There will not be a sea-battle tomorrow" (¬P), *neither* P *nor* ¬P is *now* true (rejecting bivalence). **BUT**, he would likely insist "Either there will be a sea-battle tomorrow or there will not be a sea-battle tomorrow" (P ∨ ¬P) *is* always true (upholding LEM). This disjunction doesn't require either disjunct to be true *now*; it just says one *will* be true. Łukasiewicz's system **rejects both Bivalence *and* LEM** for future contingents, which is a significant departure from Aristotle's likely view. The book **conflates Bivalence and LEM**.

  **Book's Claim:** "Two thousand years later Łukasiewicz built the first many-valued logic precisely to formalise this, giving future contingents the value ½ — and in his system 'either there will be a sea battle tomorrow or there won't' also comes out as ½ rather than as true, which is exactly what Aristotle had argued."  
  * **Assessment:** **Common Simplification / Partly Wrong.**
      *   Łukasiewicz *did* build his 3-valued logic to formalize Aristotle's *problem*. **Fair enough.**
      *   Assigning ½ formalizes "neither true nor false". **Fair enough.**
      *   P ∨ ¬P getting ½ is **Łukasiewicz's view**, NOT Aristotle's. Aristotle argued P ∨ ¬P *is* true, even while denying P and ¬P each have a truth value. **The book attributes Łukasiewicz's rejection of LEM to Aristotle, which is incorrect.**

  **Book's Claim:** "The moral is that an open future isn't compatible with classical logic: you have to weaken logic itself before you can take seriously the thought that tomorrow is genuinely unsettled rather than just unknown to us."  
  * **Assessment:** **Common Simplification / Overstated / Just Wrong (as presented).** This is Łukasiewicz's moral, not necessarily Aristotle's, and certainly not the *only* option.
      *   **Aristotle's Route:** Rejects Bivalence (a core principle of classical logic semantics) -> **Weakened Logic**.
      *   **Łukasiewicz's Route:** Rejects Bivalence *and* LEM -> **Further Weakened Logic**.
      *   **Alternative Routes (Open Future + Classical Logic):**
          *   **Ockhamism:** Maintains Bivalence *and* LEM. There *is* a unique actual future, but *which* future it is is **contingent** and **not yet settled**. "It is true *now* that there will be a sea battle" does *not* imply "It is *necessary* that there will be a sea battle". Contingency resides in the *grounds* for the truth. (Requires a specific view of modality/time). The "thin red line" is the single actual future path, known only to God/omniscience, not fixed by past+laws.
          *   **Supervaluationism:** Future contingents *lack* a *definite* truth value *now* (like Aristotle), but classical logic is preserved "supervaluationally". "P ∨ ¬P" is *supertrue* (true on all ways of resolving indeterminacies), even if neither P nor ¬P is *supertrue* individually. Truth is defined as "truth on all resolutions". This upholds LEM without bivalence for atomic future contingents.
          *   **Peirceanism:** Denies there *are* any truths about future contingents *at all*. "There will be a sea battle" is simply *false now*; only statements about what *is* or *will inevitably* happen are true. "There *will* be a sea battle *or not*" is true, but only because it's a disjunction about what *is* inevitably going to happen (one or the other *will* become inevitable). Strongly emphasizes the "openness".

  **Your Storm Example:** This is an excellent challenge to the book's overly simplistic "undetermined event = indeterminate proposition".  
  *   **Classical/Ockhamist View:** If the storm makes a battle *impossible*, then "There will be a sea battle tomorrow" is straightforwardly **FALSE** tonight. The admiral's indecision is irrelevant; the proposition's truth conditions (battle occurring) are already impossible. It depends on *multiple* factors; one being settled (storm) can render the whole proposition false, even if another factor (admiral's choice) is unsettled. The book's "neutral value attaches to anything involving an undetermined event" is **too crude**.

  **The "Changing Past" Objection:**  
  *   **Against the "No Truth Value Yet" View:** The worry is: Tonight, "There *will* be a sea battle tomorrow" (P) is neither T nor F. Tomorrow, after the battle, P *was* true (in the past). So, a past truth (about the future) seems to have *changed* from indeterminate to true.  
  *   **Response (Aristotelian/Łukasiewicz/Supervaluationist):** This is a **misunderstanding** of the view. The claim is that P *lacked* a truth value *at time T1* (tonight). At *T2* (tomorrow), we can say *at T2*: "It *was* true at T1 that P". However, proponents *deny* that "It *was* true at T1 that P" was true *at T1*. Truth about the future is *retrospectively* assigned, not prospectively possessed. The *past* itself doesn't change; our *attribution* of past truth values to future-tensed statements changes as time unfolds. This is a **genuine cost** for many, as it involves a form of **temporal relativity of truth**, but it's not the absurdity of literally changing past events. Ockhamism avoids this by having definite (but contingent) future truths *now*.

  **Summary & Key Clarifications:**

  1.  **Bivalence vs. Excluded Middle:** The book conflates them. Aristotle likely rejected **Bivalence** (no present T/F) for future contingents but upheld **LEM** (P ∨ ¬P is true). Łukasiewicz rejected both.
  2.  **"Neither T nor F" vs. "Disjunction not T":** Aristotle's "neither T nor F" applies to the *atomic* propositions P and ¬P. He likely held the *disjunction* P ∨ ¬P *was* true. They are distinct claims. Łukasiewicz's system makes both the atomic propositions *and* the disjunction indeterminate (½).
  3.  **Open Future + Classical Logic:** **Yes, it's possible.** Ockhamism (contingent future truths) and Supervaluationism (indeterminacy preserving classical logic globally) are major alternatives. The book's moral is false.
  4.  **Your Instincts Were Right:** The slide between "true now" and "has to happen" *is* the core issue Aristotle grappled with, and his solution is more subtle than the book implies. The conflation of Bivalence/LEM is central. Your storm example *does* break the book's tidy picture.
  5.  **Scholarly Labels:** The book presents the **Traditional/Standard Interpretation** (often associated with Łukasiewicz). Key alternatives include interpretations focusing on the **Principle of Non-Contradiction**, **Assertion**, or **Truth-Conditions**, and the systematic positions of **Ockhamism**, **Peirceanism**, and **Supervaluationism** regarding the future and logic.
  6.  **The Changing Past:** It's a **genuine challenge** to the "no truth value" view, requiring an acceptance of temporal relativity in truth attributions, but not a literal changing of past events. It's a cost some accept, others reject (favoring Ockhamism or Peirceanism).

  This gives you solid ground for your talk. Focus on the Bivalence/LEM distinction – that's the crucial hinge point the book gets wrong regarding Aristotle. Highlighting the storm example and the existence of classical-logic-compatible open futures (Ockhamism, Supervaluationism) will show the book's conclusion is too strong. Good luck!
