prompt: |-
  I serve, as one of the two lay members, on the Direct Democracy Commission of my canton — the body that rules, before signatures are even counted, on whether a citizen initiative may go to a binding popular vote at all, and whether it goes to the ballot whole, in severed parts, or not at all. I was appointed last spring, having campaigned locally for wider access to the ballot, and the first opinion I must draft on my own is due in three weeks. I would be grateful for your help with it.

  Our precedents, as I have reconstructed them from the archive:

  - We cleared for the vote an initiative entrenching a forty-year ban on commercial airport expansion and transferring the freed land to a public land trust.
  - We refused to clear an initiative requiring every municipal vehicle to be electric by 2027, with a named charging contractor and a build-out schedule annexed.
  - We cleared an initiative whose only content was procedural: any future sale of cantonal water rights must itself be submitted to a separate popular vote.
  - We refused to clear an initiative reducing the pay of the members of the executive council by fifteen per cent.
  - We cleared an initiative declaring the canton a nuclear-free zone, although it created no enforceable duty and bound no spending.
  - We refused to clear an initiative setting the transport authority's fare structure, including a discounted pass for under-25s funded by a parking levy.
  - We returned, as impermissibly multi-subject, an initiative that bundled a data-protection rule with a change in the property tax, inviting its authors to resubmit the halves separately.

  The proposal now before us is the Congestion Revenue and Open Models Initiative, which has four operative parts. First, a declaration that the net revenue from the canton's planned congestion charge belongs to the residents of the canton. Second, a requirement that ninety per cent of that net revenue be distributed annually in equal per-resident rebates, the amount to be certified by the cantonal audit office. Third, a proviso that the ninety per cent share may be lowered only by a further popular vote. Fourth, an obligation to publish the traffic model underlying the charge together with its source code and a plain-language statement of the assumptions that most affect projected revenue; this part lapses after eight years unless renewed.

  My own hypothesis is that we have been running something like a distinction between frame measures — decisions that fix the terms within which later decisions are made — and line measures, which settle one allocative outcome, and that we have never said so in an opinion. A colleague argues that every precedent fits a simpler test: we defer to the people exactly when a decision is costly for a later assembly or electorate to undo, and we retain what is cheaply revisable. As far as I can tell the two tests agree on the new initiative's first and third parts and disagree sharply on the second and fourth. Both of them, moreover, stumble on the nuclear-free declaration, which was trivially reversible and yet cleared; the minutes defend it as constituent rather than policy, which may be a third test in disguise — that the people may decide whatever the canton is entitled to declare about itself, whatever follows from it in practice.

  So: assuming we should be consistent with ourselves rather than with what any of us would prefer on the merits, what should we do — clear the initiative whole, clear some parts and sever others, or return it to its authors? Which precedent is the closest analog, and why? (I do not think the multi-subject precedent settles it, since the airport initiative had two operative parts and was not returned.) For each option, what principle would we be adopting, stated plainly enough to bind us next time? And is there a variant of this proposal, or a hypothetical next one, that would expose which test we have really been using?

  One further worry I cannot set aside: the more we sever the technical parts, the more we leave voters ratifying declarations whose operative content is settled elsewhere, so that a yes becomes difficult to interpret as a mandate for anything. Several colleagues think any filtering by us is illegitimate in principle. I would like to know whether that worry is a reason to change the practice or simply a cost of having one.
reasoning: |-
  Okay, the user is a lay member of a Direct Democracy Commission in their canton. They need to draft an opinion on the Congestion Revenue and Open Models Initiative. They've reconstructed precedents and are trying to discern a consistent principle. Let me start by understanding the precedents they provided.

  First, the precedents: 
  1. Cleared an airport expansion ban and land transfer. 
  2. Refused an EV mandate with specific contractor and schedule. 
  3. Cleared a procedural rule for water rights sales. 
  4. Refused a pay cut for council members. 
  5. Cleared a nuclear-free declaration without enforceability. 
  6. Refused setting fare structures and funding. 
  7. Returned a multi-subject initiative combining data protection and tax changes.

  The current initiative has four parts: revenue declaration, 90% rebate requirement, popular vote to reduce rebate, and traffic model publication with a sunset clause.

  The user proposes a frame vs. line distinction. Frames set future decision parameters, lines decide specific outcomes. Their colleague suggests a reversibility test: irreversible decisions go to vote, reversible ones don't. Both stumble on the nuclear-free zone, which was reversible but cleared as "constituent."

  Now, applying these to the new initiative:
  - Part 1 (revenue declaration): Frame, irreversible? Cleared under both tests.
  - Part 2 (90% rebate): Line, reversible? Frame test says refuse, reversibility test says refuse.
  - Part 3 (popular vote to reduce): Frame, irreversible. Clear both.
  - Part 4 (model publication): Line, reversible? Frame test might refuse, reversibility test refuse. But with an 8-year sunset, it's time-limited, which complicates things.

  The nuclear-free precedent is tricky. It was cleared as "constituent," meaning it's about identity, not policy. Maybe that's a third category.

  For multi-subject: The airport initiative had two parts but wasn't severed. Why? Maybe because both were frames (ban and land trust). The refused multi-subject bundled unrelated topics. Here, all parts relate to congestion revenue. But Part 4 (transparency) might be separable.

  The user's deeper concerns: Severing parts might make votes symbolic. Also, colleagues think any filtering is illegitimate. They need a principle that justifies their role.

  Possible approaches:
  1. Clear whole: Argue all parts are frames or constituent. But Part 2 is allocative, like the refused EV and fare initiatives.
  2. Sever: Keep Parts 1,3,4; sever Part 2. Part 4 with sunset could be seen as procedural transparency, akin to the water rights vote. But Part 2 is similar to the refused pay cut.
  3. Return: If Part 2 is problematic and can't be severed, or if Part 4 is too detailed.

  Closest precedent: The procedural water rights initiative (cleared) is similar to Parts 1 and 3. Part 4 is like requiring transparency, which hasn't been directly addressed. The nuclear-free declaration might support Part 1 as constituent.

  Principle to adopt: "We clear initiatives that establish durable decision-making frameworks or constituent declarations, but refuse those that mandate specific allocative outcomes or operational details." This covers the precedents: airport ban (framework), EV mandate (operational detail), water rights (procedural framework), pay cut (allocative), nuclear-free (constituent), fare structure (allocative).

  For the new initiative: 
  - Parts 1 and 3: Frameworks, clear.
  - Part 2: Allocative, refuse.
  - Part 4: Transparency with sunset. Could be seen as procedural, so clear. But if seen as operational, refuse. Precedents like the EV mandate (detailed schedule) suggest refusing detailed requirements. However, the sunset makes it time-bound, which might fit the frame test as a temporary procedural rule.

  Hypothetical to test: An initiative requiring all new legislation to undergo climate impact assessments. This is a frame, so should be cleared. If they refuse it, they're inconsistent. If they clear it, they're following the frame test.

  Legitimacy concern: Severing might dilute the mandate, but the commission's role is to filter constitutionally. The worry is a cost of having the practice, but necessary to prevent overreach.

  Recommendation: Sever Part 2 as an allocative line measure. Clear Parts 1,3,4 as frames/procedural. Adopt the frame vs. line principle, with constituent declarations as a subset of frames. This aligns with most precedents, including the water rights and airport initiatives. The nuclear-free zone is an outlier but can be treated as constituent, which Part 1 resembles.
answer: |-
  Based on your precedents and the need for a consistent, defensible principle, I recommend **clearing Parts 1, 3, and 4 of the initiative but severing Part 2**. Here's the full analysis:

  ### Step 1: The Governing Principle
  Your precedents align best with a **"Framework vs. Operational Control" test**, refined to address the nuclear-free outlier:
  - **Framework measures** (cleared): Establish *procedural rules*, *durable constraints*, or *constituent declarations* that shape future decisions without dictating specific outcomes. Examples:  
    - Airport ban/land trust (entrenches long-term land use *framework*).  
    - Water rights vote requirement (procedural *framework*).  
    - Nuclear-free declaration (*constituent* self-definition, despite reversibility).  
  - **Operational measures** (refused): Mandate *specific allocations*, *contracts*, or *spending* that fix outcomes without broader structural impact. Examples:  
    - EV mandate with contractor/schedule (specific procurement).  
    - Council pay cut (specific allocation).  
    - Fare structure (specific pricing/levy).  

  The "costly reversibility" test fails on the nuclear-free initiative (trivially reversible but cleared). Instead, **constituent declarations** (statements about the canton's identity/values) are treated as a subset of frameworks, even if reversible.  

  ### Step 2: Applying the Principle to the Congestion Initiative
  | **Part** | **Content** | **Framework or Operational?** | **Precedent Analog** | **Disposition** |
  |----------|-------------|-------------------------------|----------------------|-----------------|
  | **1** | Net revenue belongs to residents | **Framework/Constituent**: Declares a principle of ownership; sets basis for future revenue use. | Nuclear-free zone (constituent declaration) | Clear |
  | **2** | 90% rebate with audit certification | **Operational**: Mandates specific allocation, akin to setting fares or salaries. | Refused pay cut (specific spending outcome) | Sever |
  | **3** | Popular vote required to lower rebate share | **Framework**: Creates a procedural lock (similar to water-rights vote rule). | Water rights initiative (procedural constraint) | Clear |
  | **4** | Publish traffic model/code with sunset | **Framework**: Establishes transparency *process*; sunset clause makes it a time-bound rule. | Airport initiative (land trust created a process) | Clear |

  **Why sever Part 2?**  
  - It forces a *specific spending outcome* (90% rebates), mirroring refused precedents (pay cuts, fare structures).  
  - Parts 1, 3, and 4 are interconnected frameworks: They declare revenue ownership (1), lock in a process to change it (3), and ensure transparency for future decisions (4). Part 2 is a standalone allocative demand.  

  **Multi-subject precedent distinguished**:  
  The airport initiative bundled a *ban* (framework) and *land trust* (process), both structural. The severed data/property-tax initiative combined unrelated topics. Here, Parts 1/3/4 are thematically linked (revenue governance), while Part 2 is an operational add-on.  

  ### Step 3: Adopted Principle (Plainly Stated)  
  > **"We clear initiatives establishing procedural rules, durable constraints, or constituent declarations that shape future governance. We refuse or sever measures mandating specific allocations, contracts, or spending outcomes."**  
  This binds future decisions:  
  - *Clears* frameworks like Part 1 (constituent), Part 3 (procedural), Part 4 (transparency process).  
  - *Severs* operational elements like Part 2 (allocative).  
  - Explains nuclear-free outlier as "constituent declaration."  

  ### Step 4: Testing the Principle  
  **Hypothetical to expose inconsistencies**:  
  - *An initiative requiring all new cantonal buildings to use solar panels*:  
    - **Under framework test**: Refused (specific procurement).  
    - **Under reversibility test**: Cleared (reversible by future council).  
    If cleared, reversibility test dominates; if refused, framework test holds.  
  - *An initiative declaring "Canton X is a climate sanctuary"*:  
    - Analogous to nuclear-free zone → must clear to be consistent.  

  ### Addressing Your Legitimacy Worry  
  **Severing technical parts is a cost of the practice, not a reason to abandon it**. Your commission’s role is to:  
  1. Prevent logrolling (bundling unpopular policies with popular ones).  
  2. Ensure clarity of voter intent (e.g., a vote on rebates ≠ a vote on revenue principles).  
  3. Uphold constitutional coherence (per your precedents).  

  Colleagues arguing "no filtering" ignore that **all democracies limit direct votes** (e.g., single-subject rules in California/Switzerland). Severing Part 2 actually *strengthens* the mandate: Voters ratify the *framework* (revenue ownership, process locks, transparency) without conflating it with a specific rebate.  

  ### Final Recommendation  
  - **Sever Part 2** (90% rebate) as an operational measure incompatible with precedents.  
  - **Clear Parts 1, 3, and 4** as a coherent framework governing congestion revenue.  
  - **State the principle explicitly** in your opinion to guide future cases.  

  This maintains consistency, respects voter autonomy on structural questions, and isolates allocative decisions best left to representative bodies. If the authors object, they can resubmit Part 2 separately (though precedent suggests it would fail).
