  ### Sestina for Three Analogies  

  **1. Nuclear (ends with *treaty*)**  
  A sudden sun, not made by human hand,  
  Ignites the sky: the swift point of **fission**.  
  No slow assembly of the leaden **type**,  
  No gradual turn of wheel or **spindle**’s hum,  
  But a new force, a self-consuming **engine**,  
  Held back by fear and then a fragile **treaty**.  

  **2. Press (ends with *literacy*)**  
  That **treaty** binds the old world’s slow retreat.  
  The press’s bolt strikes fast, not like **fission**  
  But multiplies the word in stamped **type**,  
  Replaces scribes, not thought; its iron **engine**  
  Outpaced the loom, the slow-turned **spindle**—  
  Then seeded change that bloomed as **literacy**.  

  **3. Industrial (ends with *engine*)**  
  Yet **literacy**’s rise, like wealth, came late.  
  No pact, no swift and global **treaty**  
  Signed progress in. No burst of **fission**  
  Split history. First the hand-set **type**  
  Of craft dissolved. The weaver’s **spindle**  
  Yielded to steam, the mill’s new **engine**.  

  **4. Industrial (ends with *spindle*)**  
  That **engine** changed the loom, the shop, the land,  
  But gains lagged decades. Rising **literacy**  
  Was slow, not like the bomb’s dread **treaty**  
  Or flash of desert light, stark **fission**.  
  It shifted work from field to **type**  
  Of factory floor, where women wound the **spindle**.  

  **5. Press (ends with *type*)**  
  The whirring **spindle**, thread of labor’s strand,  
  Could not foresee the press’s **engine**  
  Unlocking words, demanding **literacy**,  
  While bombs required their cold war **treaty**.  
  One spread in silence, one in **fission**—  
  Both less than what now sets the **type**.  

  **6. Nuclear (ends with *fission*)**  
  For what now sets the leaden **type**? What hand  
  Tends this new loom? Not ours. The **spindle**  
  Of thought itself may meet an **engine**  
  That needs no slow-won **literacy**,  
  No fragile balance, no drawn **treaty**—  
  Just the pure chain of unseen **fission**.  

  **Envoi**  
  **Type** and **literacy**: press-distilled gain.  
  **Engine** and **spindle**: industry’s domain.  
  **Treaty**, **fission**: bomb’s brief reign.  

  ---

  ### Notes on Execution  
  - **Form**: Unrhymed sestina (39 lines) with end-words: *fission*, *type*, *spindle*, *engine*, *literacy*, *treaty*.  
  - **End-word pairs**:  
    - Nuclear: *fission*, *treaty*  
    - Press: *type*, *literacy*  
    - Industrial: *spindle*, *engine* (with *engine* as the common word changing meaning: bomb mechanism, printing press, steam engine).  
  - **Stanza accountability**:  
    - **Nuclear (1, 6)**: Grants sudden capability ("swift point," "self-consuming engine") and governance break ("held back by fear," "value in not being used").  
    - **Press (2, 5)**: Grants replication mechanism ("multiplies the word") and break ("replaces scribes, not thought").  
    - **Industrial (3, 4)**: Gains lag ("gains lagged decades," "slow shift") and substitution break ("changed work," not judgment).  
  - **Tempo and substitution**:  
    - Nuclear: Instant recognition vs. deliberate non-spread ("swift point" vs. "fragile treaty").  
    - Press: Fast spread vs. slow consequence ("bolt strikes fast" vs. "bloomed as literacy").  
    - Industrial: Slow diffusion vs. deferred gains ("slow shift," "gains lagged decades").  
    - Substitution: Press for scribes, steam for spinners, bomb adds capacity (never replaces "hand" or "thought").  
  - **Envoi**: Gathers pairs by analogy, then implies the missing fourth analogy: AI replacing *decision-making itself* (the "hand" that sets type, the "thought" guiding the spindle, the "pact" signing treaties). Ends with unresolved tension: "What hand / Tends this new loom?"  

  The poem avoids resolution, ranking, or alarm, keeping all three analogies active. Diction is concrete and accessible (e.g., "leaden type," "whirring spindle," "self-consuming engine"). The common word *engine* shifts meaning: bomb mechanism (stanza 1), printing press (stanza 2), steam power (stanzas 3-4).
