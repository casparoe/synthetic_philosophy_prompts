prompt: |-
  I serve on a university committee that advises the administration on named buildings, plaques, and monuments, and I keep running into a tangle that I suspect is philosophical rather than political.

  The historians we consult all warn us not to be presentists: the past must be understood on its own terms, and it is illegitimate for us to condemn a figure of 1880 by the standards of today. Yet our committee's actual working rule is what I would call the dissent test: we treat a historical figure as blameworthy for a practice only if we can find contemporaries of that figure who objected to it at the time. A slaveholder's defenders say nobody in his circle objected; we go looking for the abolitionist pamphlet, and if we find one, we say he should have known better. I have noticed two things about this rule. First, the objections we are able to find and take seriously tend to be the ones phrased in roughly our vocabulary, so the standard we declare to have been available to him starts to look like our own standard with a period accent. Second, our scruple is oddly selective. We say without any hesitation that the same man's medical theories were false, that his claims about the people he displaced were not supported by the evidence he had, and that his geology was confused. Nobody calls that presentism. Nobody says we lack standing to call a past belief factually mistaken. And when the one caution does arrive about factual verdicts, it is a different caution entirely: the standing taboo on narrating the past as a march toward us, which is about the shape of the story rather than about whether past people got things right.

  A third thing: nobody on the committee, and no historian we have consulted, objects when we ask genuinely new questions of the same period, about women's labour or the environmental costs of a bequest. The taboo attaches only to verdicts, never to questions.

  What I want from you is the implicit theory. What view of moral judgment, of blameworthiness, and of what it takes for a standard to be available to an agent does this cluster of habits presuppose? Is the anti-presentist rule really a claim about moral standards being indexed to a time, or is it only a claim about the epistemic conditions on blame, and if the latter, is there anything left for the two sides to disagree about? Distinguish what the practice strictly presupposes from what it merely sits well with, and tell me whether several quite different theories would license exactly the same practice. Say whether its parts presuppose consistent things, and what our committee would have to change if it gave the presupposition up and judged the past with our standards straight.

  Finally, tell me what would change your mind: which argument or consideration would lead you to abandon the reconstruction you give, and where you think it is most likely to be wrong. Flag explicitly any place where you are guessing about how professional historians actually reason, as opposed to arguing about what follows.
reasoning: |-
  Okay, the user is part of a university committee dealing with named buildings and monuments, and they're grappling with a philosophical dilemma. They've noticed a tension between the historians' warning against presentism and their committee's "dissent test" approach. Let me unpack this carefully.

  First, the committee uses the dissent test: they only hold historical figures accountable if contemporaries objected to their actions. But the user observes that this method seems circular - they end up validating only criticisms that sound modern. Plus, they note a puzzling inconsistency: the committee freely judges past factual errors (like bad science) without presentism concerns, but moral judgments get special treatment.

  Hmm, the user wants the implicit theory behind this practice. What philosophical underpinnings explain why factual errors get a pass but moral ones require contemporary dissent? They're also asking about consistency - do these rules hold together logically? And crucially, what would change if they dropped presentism entirely?

  The key seems to be the distinction between epistemology and ontology in ethics. The committee isn't saying morality was different back then (ontological relativism), but rather that blame requires knowing what was knowable then (epistemic access). That explains the dissent test: it's evidence that better alternatives were cognitively available. Whereas with science, we assume truth is timeless - Aristotle was simply wrong about physics, full stop.

  But there are cracks in this approach. The "dissent" they recognize often mirrors modern values, making it feel like presentism in period costume. And why do they allow entirely new historical questions (about women's labor etc.) if the past should be judged on its own terms? That suggests the taboo only applies to negative moral verdicts, not to expanding our understanding.

  If they abandoned presentism, they'd need new criteria for blame - perhaps a universal moral standard. But that risks arrogance. They might instead refine the dissent test to seek broader evidence of moral awareness beyond just elite criticisms.

  What would change my mind? If someone proved moral knowledge works like scientific knowledge (culturally invariant), that would undermine the dissent test. Or if historians showed that past societies had radically different cognitive capacities, that might require different epistemic standards.

  Professional historians likely emphasize contextual understanding over abstract philosophy, but the committee's practices reveal their unstated assumptions. The real tension is between seeing morality as discoverable (like science) versus created by societies. That's the philosophical knot at the heart of those plaque discussions.
answer: |-
  Your committee's practices reveal a sophisticated but tension-filled philosophical stance. Let me reconstruct the implicit theory, distinguish its components, and evaluate its consistency.

  ### Core Implicit Theory: Epistemic Blameworthiness, Not Moral Relativism
  Your committee **presupposes**:
  1.  **Moral Facts vs. Moral Knowledge Distinction:** Moral wrongness might be timeless (e.g., slavery is inherently wrong), but *blameworthiness* requires *epistemic access* for the historical agent. It's not that slavery was "right then," but that we cannot blame someone for failing to know it was wrong if the knowledge/resources to know were genuinely unavailable in their epistemic context.
  2.  **The "Reasonable Person of the Time" Standard:** Blame attaches only if a reasonable, conscientious person *within that specific historical context*, exposed to available information and arguments, *could have and should have* known the action was wrong. The "dissent test" operationalizes this: documented contemporary objections serve as *evidence* that the wrongness *was* knowable within that context.
  3.  **Asymmetry Between Factual and Moral Error:**
      *   **Factual Claims (Science, History):** Truth is objective and accessible to later inquiry with better methods/data. We have superior epistemic access *now* to judge past factual errors (e.g., bad geology). The caution against "march of progress" narratives guards against *teleology*, not against stating factual error itself.
      *   **Moral Claims:** Judging *blame* requires reconstructing the agent's *epistemic situation* regarding moral knowledge. We lack the same direct, objective access to what was *knowably* morally wrong *then* as we have to factual truth *now*. Moral knowledge is seen as contextually embedded in a way factual knowledge (once better methods exist) is not.
  4.  **"Availability" of Standards:** A moral standard is "available" if:
      *   It was articulated within the broader intellectual/social milieu (even if marginalized).
      *   It was expressed in terms potentially comprehensible to the agent (even if they rejected it).
      *   Finding such dissent provides concrete proof of availability; its absence suggests the standard wasn't part of the conceivable moral landscape for that agent.

  ### What it Sits Well With (But Doesn't Strictly Presuppose)
  *   **Moral Realism:** That there *are* objective moral truths (e.g., slavery is wrong) is compatible, as the focus is on *knowledge* of those truths, not their existence.
  *   **Moderate Historicism:** Understanding requires deep immersion in the past's own categories and constraints.
  *   **Anti-Anachronism:** Vigilance against importing modern concepts uncritically.

  ### Alternative Theories Licensing Similar Practice
  1.  **Contextualist Moral Semantics:** Meaning of moral terms (e.g., "justice," "cruelty") shifts significantly over time. Judging a past actor requires using *their* semantic framework. Finding contemporary dissent shows the concept existed *within that framework*. (This goes beyond epistemic access to meaning change).
  2.  **Moderate Moral Relativism (Social Practice View):** Moral rightness *is* relative to the socially constructed norms of a time/place. The dissent test identifies whether the action violated *any* significant norm *within that society*, not just the dominant one. (This abandons timeless moral truth).

  ### Inconsistencies Within the Practice
  1.  **The Vocabulary Problem:** You astutely note the search favors dissent sounding modern. This *undermines the epistemic claim*. If only dissent mirroring *our* concepts "counts," you *are* applying modern standards, merely using historical dissenters as proxies. This reveals a tension: the rule aims for historical context, but the *selection criteria* for valid dissent are implicitly presentist.
  2.  **The Selectivity of the Taboo:** Allowing new questions (women's labor, environment) but not new moral verdicts is inconsistent *if* the justification is pure anti-anachronism. New questions *also* apply modern frameworks (feminism, environmentalism). The taboo only attaches to *negative moral judgment*, suggesting the underlying concern isn't just about understanding the past on its own terms, but specifically about *assigning blame* across time. This selectively shields past figures from moral condemnation in a way it doesn't shield them from factual error or new historical inquiry.
  3.  **Epistemic Demands for Moral vs. Factual Knowledge:** Why is the barrier for *knowing* moral truth so much higher (requiring explicit contemporary articulation) than for knowing factual truth? We readily say a 1880s geologist *should have known* better based on *available evidence and methods*, even if the *full* modern theory wasn't articulated. We don't require a contemporary dissenting geological *theory* identical to plate tectonics. The dissent test applies a stricter epistemic standard to morality than to science/history.

  ### Consequences of Abandoning the Presupposition (Judging Straight by Modern Standards)
  If the committee dropped the epistemic blameworthiness view and judged solely by modern standards:
  1.  **Radical Condemnation:** Nearly all historical figures engaged in practices now condemned (sexism, colonialism, environmental exploitation, past medical ethics) would be automatically blameworthy. Many names would likely be removed.
  2.  **Loss of Nuance:** Context, constraints, and genuine ignorance would be irrelevant. Figures who were progressive *for their time* but flawed by ours would be condemned equally with the genuinely reactionary.
  3.  **Accusations of Presentism:** Historians (and likely the public) would criticize the committee for arrogance, failing to understand history, and imposing anachronistic judgments. The legitimacy of the process would be challenged.
  4.  **Shift in Justification:** Removal decisions would rely explicitly on asserting the *timelessness* or *objective superiority* of current moral standards, requiring a robust meta-ethical defense (moral realism, progress) that the current epistemic approach avoids.

  ### What Would Change My Mind (and Likely Weaknesses)
  **(Flagging Historian Reasoning: My reconstruction is based on common historiographical principles and your description of committee practice. I'm inferring the implicit philosophy guiding that practice, not claiming all historians consciously articulate it this way.)**

  1.  **Collapse of the Fact/Moral Distinction:** If compelling arguments showed that *knowing* moral truth operates epistemically just like knowing factual truth (e.g., through reason/empiricism accessible across time), the special epistemic protection for moral blameworthiness would weaken significantly. Why require explicit contemporary moral dissent if we don't require it for factual error?
  2.  **Demonstrating Pervasive "Moral Ignorance" is Culpable:** Evidence that individuals in the past *systematically avoided* or *willfully ignored* available moral critiques (even if not in their immediate circle) due to bias, self-interest, or bad faith. This would suggest the dissent test sets the bar *too low*; blameworthiness might attach even without easily findable dissent, if the agent *should have sought* broader perspectives but refused. (Your "period accent" critique hints at this).
  3.  **The "Vocabulary Problem" as Fatal Flaw:** If it's shown that identifying "available" dissent *inevitably* relies on selecting voices that resonate with modern concerns (ignoring equally valid contemporary critiques framed in now-alien terms), the dissent test's claim to ground blame in *historical* epistemic access collapses. It becomes presentism in disguise. *This is the reconstruction's most likely weakness.*
  4.  **Historians Explicitly Rejecting the Asymmetry:** If leading historians argued that judging *factual* claims in the past *does* require the same contextual epistemic caution as moral judgments (beyond just avoiding teleology), the committee's asymmetry would lose its disciplinary grounding.

  **Conclusion:** Your committee's practice presupposes a theory of **epistemic blameworthiness within historical context**, not moral relativism. It holds that blame requires proof a moral standard was knowable to the agent, operationalized by the dissent test. However, this stance contains tensions: the test risks presentist selection of dissent, the asymmetry between factual and moral judgment is philosophically debatable, and the selectivity of the taboo suggests an underlying anxiety about blame itself. Abandoning it would lead to harsher, more uniform condemnations based on current values alone. The theory is most vulnerable to the critique that the search for "available" dissent is inherently filtered through modern sensibilities, undermining its historical legitimacy.
