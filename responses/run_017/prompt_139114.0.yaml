prompt: |-
  Hey — I'm writing the final for my upper-level decision theory / formal epistemology seminar (mixed bag of advanced undergrads and first-year PhDs, they've all had one semester of expected utility, it's an in-class paper and this is meant to be a 45-minute question out of two hours). The topic I want to hit is Good's theorem on the value of information — the result that a free signal can't lower an expected-utility maximiser's ex ante expected utility, so the value of an experiment is non-negative and is zero only when the signal is decision-irrelevant. The trouble is that last year basically everyone answered it in one line with the you-can-always-ignore-the-information argument, and I gave them most of the marks for it, which drove me up the wall. It's not false, but it isn't a proof and it hides exactly the two things I want tested: that the engine of the proof is a swap of the max and the expectation (equivalently, the convexity of the value-of-a-belief function, i.e. a Jensen argument), and that the step silently assumes the feasible action set is the same in every cell of the signal. A colleague in econ also told me over coffee that the ignore-it argument settles the whole matter, and I'd like the exam to be the place where that reply visibly runs out.

  So here's what I'd like you to produce. First, the question itself, self-contained, with a short notation preamble the students can work from (finite states, finite actions, bounded state-act utility, a prior, and a signal whose likelihoods may depend on the state but not on the action chosen — no one in the class has seen the variant I describe below, so spell it out). Split it into three parts, roughly 10 / 12 / 8 out of 30, and tell me if you'd weight it differently. Part (a): make them state the theorem with every assumption explicit and then prove it — I don't want a recitation, I want them to name which assumption licenses the swap of max and expectation, to give the equality condition in the right form (a single action optimal at every posterior in the support, not just "the signal doesn't matter"), and to be explicit that the guarantee is ex ante rather than per-realisation. Part (b) is the one I care about: give them a variant where the signal is observed not only by the agent but by a second party who then sets the agent's menu, so the feasible set is signal-contingent, and ask for a fully numerical counterexample with small numbers and the arithmetic shown in two or three lines where a free, perfectly informative signal has strictly negative value. Please put a hint in the question saying that merely making the existing options more expensive isn't enough, because falling back on the ex-ante-optimal action already restores the status quo — the ex-ante-optimal action itself has to disappear from the menu in at least one cell — otherwise they'll all hand me a hand-wavy adverse-selection story with no numbers. Then have them identify by name the step of the proof that fails, explain why the ignore-it reply can't rescue the result here even though it works fine in the fixed-menu case, and say whether a strictly less informative signal can beat a more informative one in this setting. Part (c): a short vignette — some administrator saying that the theorem shows a rational agent should always want more information, so the university should always commission the extra review before deciding — and ask for at least three distinct errors repaired precisely. The three I have in mind are the ex ante/ex post confusion, the fact that the guarantee is agent-relative (it's relative to the agent's own prior, so a miscalibrated or near-dogmatic agent can be certain by its own lights that info is worth buying while the theorem says nothing from the outside), and the utility-versus-money point: once the signal has a price, non-negative expected-utility gain doesn't turn into non-negative dollar willingness-to-pay unless utility is linear in money, and the acquisition decision has to be evaluated ex ante as one more branch rather than bolted on afterwards. Give a bonus mark for noticing that the theorem isn't comparative across two different experiments at all.

  Then give me a model answer (800–1000 words across the three parts is about right, with the part (b) numbers fully worked so I can check them), and a marking scheme out of 30 that separates an A from a B by naming the specific moves each must contain — I want the A/B boundary to be about whether they located the load-bearing assumption and handled the ignore-it reply properly, not about whether they wrote more. For each part add a one-line note on how students typically get it wrong and what that costs them. Two more constraints: no citations, no history-of-ideas preamble, no author names or years anywhere in the question — I'm testing the maths and the interpretation, not who proved what — and flag anything in your draft that you think would be unfair or ambiguous for someone with only one semester behind them. Also, I'm not fussed about British or American spelling, so dont bother making it consistent.
