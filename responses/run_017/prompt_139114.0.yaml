answer: |-
  ### Decision Theory Exam Question

  **Notation and Setup:**  
  - Finite state space: \(\Omega = \{\omega_1, \dots, \omega_n\}\) with prior probability \(p(\omega) > 0\) for all \(\omega\).  
  - Finite action space: \(A = \{a_1, \dots, a_m\}\).  
  - Bounded utility function: \(u: A \times \Omega \to \mathbb{R}\).  
  - A **free signal** (experiment) with finite outcomes \(S = \{s_1, \dots, s_k\}\), defined by likelihoods \(P(s|\omega)\) (independent of actions).  
  - **Ex-ante expected utility without signal:** \(V_0 = \max_{a \in A} \mathbb{E}[u(a, \omega)] = \max_{a \in A} \sum_{\omega} p(\omega) u(a, \omega)\).  
  - **Ex-ante expected utility with signal:** After observing \(s\), the agent updates to posterior \(p(\omega|s) \propto p(\omega) P(s|\omega)\), then chooses \(a\) to maximize \(\mathbb{E}[u(a, \omega)|s]\). Thus:  
    \[
    V_1 = \sum_{s} P(s) \left( \max_{a \in A} \sum_{\omega} p(\omega|s) u(a, \omega) \right), \quad \text{where} \quad P(s) = \sum_{\omega} p(\omega) P(s|\omega).
    \]  

  ---

  **Part (a) [10 points]**  
  1. **State Good’s theorem formally.** Specify all assumptions and the equality condition.  
  2. **Prove the theorem.** Explicitly identify which step requires the feasible action set \(A\) to be signal-independent.  
  3. **Equality condition:** State when \(V_1 = V_0\) holds and explain why this condition is necessary.  

  ---

  **Part (b) [12 points]**  
  Now suppose the signal \(s\) is also observed by a *second party*, who then sets the agent’s feasible action set \(A(s) \subseteq A\). A free, perfectly informative signal may now have *negative* value.  

  1. **Counterexample:** Provide numerical values for:  
     - Two states (\(\omega_1, \omega_2\)), prior \(p(\omega_1) = p(\omega_2) = 0.5\).  
     - Three actions (\(a_1, a_2, a_3\)) and utilities:  
       |          | \(\omega_1\) | \(\omega_2\) |  
       |----------|-------------|-------------|  
       | \(a_1\)  | 10          | 0           |  
       | \(a_2\)  | 0           | 10          |  
       | \(a_3\)  | 5           | 5           |  
     - Perfectly informative signal: \(S = \{s_1, s_2\}\) with \(P(s_1|\omega_1) = 1\), \(P(s_2|\omega_2) = 1\).  
     - Second party’s menu rule:  
       - If \(s = s_1\), set \(A(s_1) = \{a_2\}\) (only \(a_2\) available).  
       - If \(s = s_2\), set \(A(s_2) = \{a_1\}\) (only \(a_1\) available).  
     **Show:**  
     - \(V_0 = 5\) (one-line calculation).  
     - \(V_1 = 0\) (one-line calculation).  
     *Hint: The ex-ante optimal action \(a_3\) must be unavailable in both signal realizations.*  

  2. **Analysis:**  
     - Why does the "ignore the information" argument (i.e., "the agent can always choose the ex-ante optimal action") fail here?  
     - Which step in the proof from (a) fails? Name the specific assumption violated.  
     - Can a strictly *less informative* signal yield higher \(V_1\) than a more informative one in this setting? Briefly explain.  

  ---

  **Part (c) [8 points]**  
  An administrator claims:  
  > *"Good’s theorem proves a rational agent always wants more information. Thus, the university should always commission extra reviews before decisions, since more information is always better."*  

  **Identify and repair three distinct errors** in this argument. Be precise about how each misapplies Good’s theorem.  
  *(Bonus: +1 for a fourth error.)*  

  ---

  ### Model Answer  
  **Part (a)**  
  **Theorem statement:** Under the assumptions (finite \(\Omega\), \(A\), bounded \(u\), prior \(p\), free signal with action-independent likelihoods), \(V_1 \geq V_0\). Equality holds iff \(\exists\) an action \(a^*\) optimal under the prior *and* optimal under every possible posterior \(p(\omega|s)\) (for \(s\) with \(P(s) > 0\)).  

  **Proof:**  
  1. For any fixed \(a \in A\), \(\mathbb{E}_s[\mathbb{E}[u(a, \omega)|s]] = \mathbb{E}[u(a, \omega)]\) (law of total expectation).  
  2. For each \(s\), \(\max_{a' \in A} \mathbb{E}[u(a', \omega)|s] \geq \mathbb{E}[u(a, \omega)|s]\) (since \(a\) is feasible in all \(s\) by signal-independent \(A\)).  
  3. Thus, \(V_1 = \mathbb{E}_s\left[ \max_{a' \in A} \mathbb{E}[u(a', \omega)|s] \right] \geq \mathbb{E}_s\left[ \mathbb{E}[u(a, \omega)|s] \right] = \mathbb{E}[u(a, \omega)]\).  
  4. Since this holds \(\forall a\), \(V_1 \geq \max_{a \in A} \mathbb{E}[u(a, \omega)] = V_0\).  
  **Key step:** Step 2 requires \(A\) is the same for all \(s\).  
  **Equality condition:** \(V_1 = V_0\) iff \(a^*\) (prior-optimal) is also optimal in every posterior. Necessity: If no such \(a^*\) exists, strict inequality \(V_1 > V_0\) can occur (e.g., with informative signal and fixed \(A\)).  

  ---

  **Part (b)**  
  1. **Counterexample:**  
     - \(V_0 = \max \left\{ 0.5 \cdot 10 + 0.5 \cdot 0, 0.5 \cdot 0 + 0.5 \cdot 10, 0.5 \cdot 5 + 0.5 \cdot 5 \right\} = \max \{5, 5, 5\} = 5\).  
     - \(V_1 = 0.5 \cdot \left( \max_{a \in \{a_2\}} \mathbb{E}[u(a, \omega)|s_1] \right) + 0.5 \cdot \left( \max_{a \in \{a_1\}} \mathbb{E}[u(a, \omega)|s_2] \right) = 0.5 \cdot u(a_2, \omega_1) + 0.5 \cdot u(a_1, \omega_2) = 0.5 \cdot 0 + 0.5 \cdot 0 = 0\).  
     Since \(0 < 5\), the signal has negative value.  

  2. **Analysis:**  
     - "Ignore information" fails because the ex-ante optimal action \(a_3\) is *unavailable* in both \(A(s_1)\) and \(A(s_2)\).  
     - **Failed step:** Step 2 of the proof (requiring fixed \(A\)) is violated, as \(A(s)\) varies with \(s\).  
     - **Less informative signal can dominate:** Yes. E.g., a completely uninformative signal (same \(s\) always) forces the second party to set one menu for all states. If they set \(A = \{a_3\}\), then \(V_1 = 5 > 0\).  

  ---

  **Part (c)**  
  **Errors:**  
  1. **Ex ante vs. ex post:** The theorem ensures non-negative value *ex ante* (pre-signal), not that the agent is better off *ex post* (e.g., "bad news" may cause regret).  
  2. **Agent-relativity:** The theorem uses the agent’s *own prior*. A miscalibrated agent may overvalue information; the university’s objective reality may differ.  
  3. **Cost ignored:** The theorem assumes a *free* signal. If information costs money, net utility may be negative (and utility is not linear in money).  
  4. **Bonus (non-comparative):** The theorem only compares information vs. no information. It does *not* say "more information is always better" (e.g., part (b) shows strictly informative signals can harm).  

  ---

  ### Marking Scheme (Total: 30 points)  
  **Part (a) [10 points]**  
  - Statement (assumptions + \(V_1 \geq V_0\)): **3**  
    - Missing/fuzzy equality condition: **–1**  
  - Proof (steps 1–4, signal-independent \(A\) highlighted): **5**  
    - No explicit link to fixed \(A\): **–1**  
  - Equality necessity: **2**  
    *Common error: Claiming equality iff signal is "irrelevant" without requiring a single prior-optimal \(a^*\) works for all posteriors.*  

  **Part (b) [12 points]**  
  - Correct counterexample setup (states, actions, utilities, signal, menus): **4**  
  - Correct \(V_0 = 5\), \(V_1 = 0\): **2**  
  - Why "ignore information" fails (unavailability of \(a_3\)): **2**  
  - Identifying failed proof step (fixed \(A\) assumption): **2**  
  - Less informative signal can be better (yes, with explanation): **2**  
    *Common error: Not removing \(a_3\) from menus \(\to V_1 \geq 5\).*  

  **Part (c) [8 points]**  
  - Three distinct errors identified and repaired (2 per error): **6**  
  - Bonus fourth error: **+1**  
    *Common errors: Vague critiques (e.g., "real-world complexity") without tying to theorem assumptions.*  

  **Grading Boundary:**  
  - **A (27–30):** All parts precise. In (a), explicit fixed-\(A\) step and equality condition. In (b), correct counterexample and "ignore-it" rebuttal. In (c), three clear errors.  
  - **B (24–26):** Minor gaps (e.g., fuzzy equality in (a), arithmetic error in (b), weak explanation in (c)).  
  - **C (18–23):** Major omissions (e.g., missing fixed-\(A\) in proof, incomplete counterexample, only two errors in (c)).  
  - **D (12–17):** Partial understanding (e.g., no proof, wrong counterexample, one error in (c)).  
  - **F (0–11):** Little/no relevant content.  

  ---  
  **Ambiguity Note:** The counterexample in (b) assumes adversarial menu-setting. If students misinterpret this, the hint ("ex-ante optimal action disappears") clarifies. For one-semester students, the explicit utility table ensures accessibility.
