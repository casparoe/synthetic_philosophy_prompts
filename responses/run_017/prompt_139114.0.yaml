  **Exam Question**

  **Notation and Setup**

  Consider a decision problem with:

  - A finite set of states of the world, Ω.
  - A prior probability distribution p over Ω (with p(ω) > 0 for all ω).
  - A finite set of actions, A.
  - A bounded utility function u : A × Ω → ℝ.

  An experiment (or signal) is characterized by a finite set of possible outcomes S and a likelihood function P(s|ω) (the probability of observing s in state ω). The experiment is free and does not depend on the action chosen.

  The agent is an expected utility maximizer. Without the experiment, the agent's optimal expected utility is:

    V₀ = max_{a ∈ A} E[u(a, ω)] = max_{a ∈ A} Σ_{ω ∈ Ω} p(ω) u(a, ω)

  With the experiment, the agent observes the outcome s and updates the prior to a posterior p(ω|s) using Bayes' rule. The agent then chooses an action to maximize expected utility conditional on s. The expected utility conditional on s is:

    V(s) = max_{a ∈ A} E[u(a, ω) | s] = max_{a ∈ A} Σ_{ω} p(ω|s) u(a, ω)

  The ex-ante expected utility with the experiment is:

    V₁ = E[V(s)] = Σ_{s ∈ S} P(s) V(s)

  where P(s) = Σ_{ω} p(ω) P(s|ω).

  **Part (a) [10 points]**

  State Good’s theorem formally, making explicit every assumption of the theorem. Then prove the theorem. In your proof, clearly indicate which step relies on the assumption that the set of available actions is fixed (i.e., does not depend on the signal). Also, state the necessary and sufficient condition for V₁ = V₀, and explain why this condition is necessary.

  **Part (b) [12 points]**

  Now consider a variant of the problem. Suppose that after the experiment is performed, the outcome s is observed not only by the agent but also by a second party. This second party then chooses the set of actions available to the agent from which the agent will select. That is, the feasible set of actions for the agent is a function of s, denoted A(s) ⊆ A.

  Provide a numerical counterexample to show that in this variant, a free, perfectly informative experiment can have strictly negative value. That is, V₁ < V₀. Use the smallest possible state, action, and signal spaces (i.e., two states, two or three actions, and two signals). Clearly state the prior, the utility function, the experiment, and the rule by which the second party sets A(s). Show the calculations for V₀ and V₁ in no more than three lines each.

  *Hint: The ex-ante optimal action must be unavailable in at least one signal realization; merely making it more expensive is not sufficient because the agent can always choose it if available.*

  In your counterexample, explain why the “ignore the information” argument (i.e., the agent can always choose the ex-ante optimal action) fails to rescue the non-negativity of the value of information. Also, identify by name the step in the proof of Good’s theorem (from part (a)) that fails in this variant. Finally, in this setting with signal-contingent action sets, is it possible that a strictly less informative experiment yields a higher ex-ante expected utility than a more informative one? Briefly explain why or why not.

  **Part (c) [8 points]**

  A university administrator says: “Good’s theorem shows that a rational agent should always want more information. Therefore, the university should always commission the extra review before deciding, because more information is always better.”

  Identify at least three distinct errors in this argument. For each error, explain precisely how it misapplies Good’s theorem. (A bonus mark [1 point] is available for identifying a fourth error.)

  ---

  **Model Answer**

  **Part (a)**

  *Statement of Good’s Theorem:*

  Under the assumptions of the setup (finite states and actions, bounded utility, a prior, and a free experiment with likelihoods independent of actions), the ex-ante expected utility with the experiment, V₁, is at least as great as the ex-ante expected utility without the experiment, V₀. That is, V₁ ≥ V₀. Moreover, equality holds (V₁ = V₀) if and only if there exists an action a* that is optimal for the prior (i.e., a* ∈ argmax_{a ∈ A} E[u(a, ω)]) and that remains optimal for every possible signal outcome s (i.e., for every s with P(s) > 0, a* ∈ argmax_{a ∈ A} E[u(a, ω) | s]).

  *Proof:*

  By the law of total expectation, for any fixed action a ∈ A, we have:

    E[ E[u(a, ω) | s] ] = E[u(a, ω)]

  Now, for each s, the agent chooses an action that maximizes the conditional expected utility, so:

    V(s) = max_{a ∈ A} E[u(a, ω) | s] ≥ E[u(a, ω) | s]   for every a ∈ A.

  Taking the expectation over s on both sides:

    V₁ = E[V(s)] ≥ E[ E[u(a, ω) | s] ] = E[u(a, ω)]   for every a ∈ A.

  Since this holds for every a, it holds in particular for the a that maximizes E[u(a, ω)]:

    V₁ ≥ max_{a ∈ A} E[u(a, ω)] = V₀.

  This proves V₁ ≥ V₀.

  The key step is the inequality V(s) ≥ E[u(a, ω) | s] for every fixed a and every s, which relies on the fact that the action a is available in every s (i.e., the set A is fixed and does not depend on s).

  *Equality condition:*

  If there exists an action a* that is optimal for the prior and that is also optimal for every posterior p(·|s) (for s with P(s)>0), then it is clear that V(s) = E[u(a*, ω) | s] for every s, so V₁ = E[ E[u(a*, ω) | s] ] = E[u(a*, ω)] = V₀.

  Conversely, if V₁ = V₀, then from the inequality:

    V₁ = E[ max_{a ∈ A} E[u(a, ω)|s] ] = max_{a ∈ A} E[u(a, ω)] = V₀.

  The equality in the inequality chain above implies that for every s in the support, the action that achieves the max in V(s) must be such that it also achieves the overall max. More carefully: the inequality we used is:

    V₁ ≥ E[u(a, ω)] for every a.

  But we also have:

    V₁ = E[ max_{a} E[u(a,ω)|s] ] ≥ max_{a} E[ E[u(a,ω)|s] ] = max_{a} E[u(a,ω)] = V₀.

  Now, if V₁ = V₀, then we have:

    E[ max_{a} E[u(a,ω)|s] ] = max_{a} E[ E[u(a,ω)|s] ]

  This equality in Jensen's inequality for the convex function (the max operator) implies that the function a ↦ E[u(a,ω)|s] is constant over the set of maximizers for the prior? Actually, a standard result is that equality holds if and only if the same action a* achieves the maximum in every s. That is, there exists an action a* such that for every s with P(s)>0, 

    max_{a ∈ A} E[u(a, ω)|s] = E[u(a*, ω)|s]

  and moreover, a* is optimal for the prior.

  **Part (b)**

  *Counterexample:*

  States: Ω = {ω₁, ω₂}, with p(ω₁) = p(ω₂) = 0.5.

  Actions: A = {a₁, a₂, a₃}.

  Utility function:

    u(a₁, ω₁) = 10, u(a₁, ω₂) = 0
    u(a₂, ω₁) = 0, u(a₂, ω₂) = 10
    u(a₃, ω₁) = 5, u(a₃, ω₂) = 5

  Experiment: perfectly informative, so S = {s₁, s₂} with P(s₁|ω₁)=1, P(s₂|ω₂)=1.

  The second party sets the menu A(s) to minimize the agent's utility (adversarial). Specifically:

    If s = s₁ (indicating ω₁), then A(s₁) = {a₂}   (so only a₂ is available)
    If s = s₂ (indicating ω₂), then A(s₂) = {a₁}   (so only a₁ is available)

  Without the experiment:
    V₀ = max { 
        E[u(a₁)] = 0.5*10 + 0.5*0 = 5,
        E[u(a₂)] = 0.5*0 + 0.5*10 = 5,
        E[u(a₃)] = 0.5*5 + 0.5*5 = 5 
    } = 5.

  With the experiment:
    If s₁ (state ω₁): agent must choose a₂, so gets u(a₂, ω₁)=0.
    If s₂ (state ω₂): agent must choose a₁, so gets u(a₁, ω₂)=0.
    Therefore, V₁ = 0.5 * 0 + 0.5 * 0 = 0.

  Thus, V₁ = 0 < 5 = V₀, so the value of the experiment is negative (0 - 5 = -5).

  *Why the "ignore the information" argument fails:*

  The ex-ante optimal action is a₃ (or any action, since they all yield 5). However, after the signal, the action a₃ is not available in either menu. Therefore, the agent cannot choose to ignore the information by picking a₃.

  *The step in the proof that fails:*

  The step that assumes the action set is fixed. Specifically, in the proof, we use that for any fixed action a, we have V(s) ≥ E[u(a, ω)|s] for every s. But in this counterexample, the fixed action a₃ is not available in any s, so we cannot say that V(s) ≥ E[u(a₃, ω)|s] because the agent cannot choose a₃ in any s. In fact, for s=s₁, V(s₁)=0, but E[u(a₃, ω)|s₁] = u(a₃,ω₁)=5 (since the posterior is concentrated on ω₁), and 0 < 5. So the inequality fails.

  *Can a less informative experiment be better?*

  Yes. Consider an uninformative experiment (e.g., a signal that always outputs the same symbol, say s₀, regardless of the state). Then the second party sets the same menu for both states. Suppose the second party (not knowing the state) sets the menu to {a₃}. Then the agent gets 5 in both states, so V₁ = 5, which is better than the perfectly informative experiment (which gave 0). Thus, a less informative experiment can be better.

  **Part (c)**

  The administrator’s argument contains at least the following errors:

  1. **Ex ante vs. ex post:** Good’s theorem only guarantees that the ex ante expected utility (before seeing the signal) is non-negative. It does not say that the agent will be glad ex post (after seeing the signal) that they acquired the information. The agent might regret having acquired the signal if the outcome leads to a worse decision or if the information is bad news. The administrator’s “always want” might be misinterpreted as ex post, but the theorem only speaks ex ante.

  2. **Agent-relativity:** The theorem is relative to the agent’s own prior and utility function. If the agent’s prior is miscalibrated (e.g., overconfident) or if the agent has a misspecified model, then the agent might expect a non-negative value but the actual objective value might be negative. The university’s decision should be based on objective benefits, not solely on the agent’s subjective prior.

  3. **Cost of information:** The theorem assumes the experiment is free. In reality, the extra review costs money. The agent’s net expected utility gain (which is non-negative by the theorem) minus the cost might be negative. Moreover, utility is not necessarily linear in money, so the dollar cost must be evaluated in terms of utility.

  4. **Non-comparative nature (bonus):** The theorem only states that one experiment is at least as good as no experiment. It does not say that more information is always better. In particular, it does not compare two different experiments. A more informative experiment might be less valuable than a less informative one if it leads to worse outcomes (as in the counterexample from part (b)) or if it is more costly.

  ---

  **Marking Scheme**

  Total points: 30.

  **Part (a) [10 points]**

  - Statement of the theorem with explicit assumptions: 3 points.
    - Assumptions: finite states, finite actions, bounded utility, prior, free experiment, likelihood independent of actions. [1 point for listing all, 0.5 if missing one]
    - Conclusion: V₁ ≥ V₀. [0.5]
    - Equality condition: there exists an action a* optimal for the prior and for every posterior. [1 point; if they say "the signal is decision-irrelevant" without defining it, 0.5]
  - Proof: 5 points.
    - Law of total expectation for fixed a: 1 point.
    - V(s) ≥ E[u(a,ω)|s] for every a and s: 1 point.
    - Taking expectation: V₁ ≥ E[u(a,ω)] for every a: 1 point.
    - Then V₁ ≥ max_a E[u(a,ω)] = V₀: 1 point.
    - Explicitly stating that the step V(s) ≥ E[u(a,ω)|s] requires that a is available in every s (fixed action set): 1 point.
  - Equality condition necessity: 2 points.
    - Explain why the existence of such an a* implies equality: 1 point.
    - Explain that without such an a*, strict inequality might occur: 1 point.

  *Common mistakes:*
  - Omitting the fixed action set assumption in the proof step: lose 1 point.
  - Stating the equality condition as "the signal doesn't change the optimal action" without requiring that the same action is optimal for the prior: lose 1 point.

  **Part (b) [12 points]**

  - Counterexample: 6 points.
    - Correct prior and states: 0.5.
    - Correct utility function: 1 point.
    - Perfectly informative signal: 0.5.
    - Menu-setting rule that removes the safe action in both states: 2 points (if they remove only one, they might not get negative value; if they don't remove the safe action, they might not get negative value).
    - V₀ calculation: 1 point (must show 5).
    - V₁ calculation: 1 point (must show 0).
  - Why "ignore it" fails: 2 points.
    - Because the ex-ante optimal action is not available in the signal-contingent menus: 2 points.
  - Step in proof that fails: 2 points.
    - The step that requires the action set to be fixed (so that the fixed action a is available in every s): 2 points. If they just say "the action set changes" without linking to the proof, 1 point.
  - Less informative signal can be better: 2 points.
    - Yes: 0.5.
    - Explanation: because the second party cannot condition on the state, so the menu might be better: 1.5 points.

  *Common mistakes:*
  - Failing to make the value strictly negative: lose 2 points.
  - Not having the safe action removed: lose 2 points.

  **Part (c) [8 points]**

  Three errors, each worth 2 points (1 for identification, 1 for explanation), and a bonus for a fourth.

  - Error 1: Ex ante vs. ex post. [2]
  - Error 2: Agent-relativity (prior may be wrong). [2]
  - Error 3: Cost of information (not free). [2]
  - Bonus error: Non-comparative nature (more information not always better). [1]

  *Common mistakes:*
  - Vague statements without precise connection to the theorem: lose 1 point per error.
  - Listing more than three without clearly identifying three distinct ones: mark the first three.

  **Grade Boundaries**

  - A (27-30): All parts complete and correct. In part (a), explicitly identifies the fixed action set as critical and gives the equality condition correctly. In part (b), the counterexample is correct and the arithmetic shown, and the explanation of why the ignore-it argument fails is precise (unavailability of the ex-ante optimal action). In part (c), at least three distinct errors clearly explained.
  - B (24-26): Minor errors. For example, in part (a) the equality condition is slightly misstated but the proof is mostly correct. In part (b) the counterexample has the right idea but a miscalculation, or the explanation of the proof step is vague. In part (c) three errors are identified but one explanation is weak.
  - C (18-23): Significant gaps. For example, in part (a) the proof misses the key step about fixed actions. In part (b) the counterexample does not achieve negative value but the setup is correct. In part (c) only two errors are clearly identified.
  - D (12-17): Only partial understanding. For example, in part (a) the theorem is stated without proof. In part (b) the counterexample is missing or completely wrong. In part (c) only one error is identified.
  - F (0-11): Little or no relevant content.

