  Based on your Student Integrity Board's precedents, I'll analyze the new case step by step for consistency, identify the closest precedent, infer the implicit rule, and address underdetermination if needed. The goal is to maintain coherence with your prior rulings.

  ### 1. **Summary of Precedents & Implicit Rule**
  Your Board's rulings reveal a consistent pattern centered on **intent to influence in the context of pending decisions**, with secondary emphasis on targeting, financial stakes, and customary practices. Key principles:
  - **Intent to influence**: Gifts are corrupt if they appear designed to sway a decision, even without explicit quid pro quo (Precedents 2, 3, 5). The giver's intent is inferred from timing, targeting, and stakes.
  - **Pending decisions**: Gifts coinciding with unresolved matters (e.g., grades, suspensions, roster spots) are high-risk (Precedents 2, 3, 5). Gifts detached from decisions (e.g., post-transaction or routine customs) are safer (Precedents 1, 4).
  - **Targeting decision-makers**: Gifts aimed at specific individuals with decision-making power heighten corruption risk (Precedent 3 vs. 4).
  - **Customary practice**: Routine, non-targeted gifts are exempt if genuinely detached from decisions (Precedent 4). "Local custom" defenses are rejected (Precedent 5).
  - **Financial stakes & access**: Gifts from parties with vested interests (e.g., business owners) create indebtedness or access concerns (Precedents 1, 3, 5).
  - **Standing relationships**: Long-term favors are treated as higher risk (Precedent 5 hint), likely because they build ongoing influence.

  **Implicit Rule**:  
  *A gift is corrupt if:*
  - *The giver has a financial or personal stake in a pending decision, AND*
  - *The gift is timed to coincide with that decision or targets decision-makers,*
  - *Even if no explicit request is made and customary practices exist.*  
  *Routine, non-targeted gifts unrelated to decisions are exempt.*

  ### 2. **Analysis of the New Case**
  - **Giver's stake**: The restaurant has a clear financial interest in the student-activities-fee vote (more catered events = potential revenue).
  - **Timing**: The dinner was moved from June (post-academic year, no pending issues) to the week before the vote. This creates a direct temporal link to the decision, akin to Precedents 2, 3, and 5.
  - **Targeting**: Previously, the dinner included all members (alternates, adviser). Now, only the 11 voting members are invited. This selective focus mirrors Precedent 3 (jerseys targeted at the coach) and Precedent 2 (gift card to a specific teacher).
  - **Intent**: While no request was made, the timing and targeting suggest an intent to create goodwill or indebtedness before the vote. Precedent 3 establishes that implied intent suffices.
  - **Customary practice**: The prior three-year tradition might resemble Precedent 4 (family preserves), but the changes in timing and targeting break the pattern. Precedent 5 explicitly rejects custom as a defense when stakes and timing align.
  - **Standing relationship**: The three-year history could exacerbate concerns (per Precedent 5's hint), as it establishes a pattern of access.

  ### 3. **Consistency & Closest Precedent**
  - **Verdict for Consistency**: **Corrupt**.  
    Ruling otherwise would contradict Precedents 3 and 5, where implied intent, timing, and stakes drove corruption findings. The sudden shift in format (timing + targeting) converts a benign custom into a high-risk gift.
  - **Closest Analog**: **Precedent 3 (jerseys donation)**.  
    - Both involve a business owner with a financial stake (jerseys supplier/restaurant) giving a gift tied to a decision (starting position/fee vote).
    - Both lack explicit requests but imply influence through context (Precedent 3: email after donation; new case: timing/targeting before vote).
    - Both target decision-makers (coach/voting members).
    - Precedent 1 (pastries) is dissimilar because the gift came after decisions were finalized. Precedent 4 (preserves) is irrelevant due to non-targeting and no stakes. Precedent 5 (suspension gift) is close but less precise due to its explicit pending appeal vs. the new case's implied influence.

  ### 4. **Underdetermination and Principles**
  The case is **not genuinely underdetermined**—your precedents clearly point to corruption. However, if ambiguity existed, here’s how competing principles would apply:
  - **Rule A (Intent + Stakes)**:  
    *Principle*: Corruption requires proven intent to influence + giver’s financial stake.  
    *Verdict*: Corrupt (timing/targeting imply intent; restaurant has stake).  
    *Commitment*: Prioritizes circumstantial evidence of intent over formalities. Aligns with Precedents 2, 3, 5.
  - **Rule B (Customary Practice Exemption)**:  
    *Principle*: Long-standing customs are non-corrupt unless explicitly transactional.  
    *Verdict*: Not corrupt (dinner is a tradition, no request).  
    *Commitment*: Custom protects givers, even with stakes/timing changes. Contradicts Precedent 5.

  **Best Single Further Case to Separate Rules**:  
  - **Scenario**: *A parent who owns a bakery routinely sends free cookies to all staff every finals week. This year, their child is on the disciplinary committee deciding a case involving the parent’s business. Cookies are sent as usual.*  
  - **Why it separates rules**:  
    - Rule A (Intent + Stakes) would call this corrupt: pending decision + financial stake + timing coincidence.  
    - Rule B (Customary Exemption) would deem it not corrupt: routine gift, no targeting, no format change.  
    This tests whether custom alone can override stakes/timing (Precedent 4 vs. 5) and clarifies if "targeting" requires active exclusion (like the new case) or if broad gifts to decision-makers suffice.

  ### Final Recommendation
  To remain consistent, rule the new case **corrupt**. The implicit rule—**focusing on intent inferred from stakes, timing, and targeting**—demands this outcome. The restaurant’s alterations to a previously benign custom created a clear nexus to a pending decision, inviting influence even without a direct ask. Precedent 3 is your strongest parallel. If uncertainty persists, use the "finals week cookies" hypothetical to refine your standard.
