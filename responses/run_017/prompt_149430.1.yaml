prompt: |-
  I sit on my school's Student Integrity Board, which rules on whether a particular gift or favor counts as corrupt. I would be grateful for help reading our own track record.

  Our rulings so far:

  1. A club treasurer accepted a box of pastries from a bakery owner, given as thanks after the club had finished buying there for the year. Not corrupt.
  2. A student sent a $50 gift card to a teacher with a note asking her to reconsider a grade that had not yet been submitted. Corrupt.
  3. A parent donated new jerseys to the athletic department and then emailed the coach asking that his daughter start at point guard. Corrupt — the Board said the connection did not have to be stated out loud.
  4. A student gave each of her teachers a jar of preserves at the start of the year, as her family always does. Not corrupt.
  5. A parent offered a contribution to the principal's discretionary fund while his son's suspension appeal was pending, explaining that in the country he grew up in such gifts to officials are ordinary. Corrupt; the Board added that its standard applies regardless of local custom. It has also hinted, without ever saying why, that a standing relationship of favors is worse than a one-off offer.

  The new case: for three years a family that owns a restaurant near the school has hosted a free dinner each June for the whole Student Council and its faculty adviser — no request attached, and Council took no vote for months afterward. This year the dinner is moved to the week before a vote on a student-activities-fee increase that would pay for more catered school events, and the invitations go only to the eleven voting members: the alternates and the adviser, who were always included before, are not invited.

  What should the Board decide if it wants to be consistent with itself, and which precedent is the closest analog? I am less interested in the verdict than in the rule we are implicitly running: is it a test about the giver's intent to influence, about whether a donor with a financial stake is buying access and indebtedness, about whether the gift is targeted at the actual decision-makers, about customary practice as an exemption, or something else? If our rulings genuinely underdetermine the case, tell me what principle we would be committing to with each choice, and which single further case would best separate the rules still in play.
reasoning: |-
  We are given five precedents and a new case. Let's summarize the precedents:

  1. **Pastries for club treasurer**: Not corrupt. Gift given after the business relationship ended, as a thank you. No request at the time.
  2. **$50 gift card for grade reconsideration**: Corrupt. Gift given with an explicit request for a favor (grade change) that was pending.
  3. **Jerseys donation and request for starting position**: Corrupt. The donation was made and then a request was made (even if not at the same time, the connection was implied). The Board noted that the connection doesn't have to be stated.
  4. **Jars of preserves at start of year**: Not corrupt. Customary family gift, given without any pending request and at a time when no specific decision is imminent.
  5. **Contribution during suspension appeal**: Corrupt. Gift offered while a specific decision (suspension appeal) was pending. The Board rejected the custom defense and noted that a standing relationship of favors is worse than a one-off.

  Now, the new case:

  - A restaurant family hosts a free dinner for the entire Student Council and adviser for three years in June (after the school year, no pending decisions). No requests made.
  - This year, the dinner is moved to the week before a vote on a student activities fee increase (which would lead to more catered events, potentially for the restaurant). Only the 11 voting members are invited (excluding alternates and the adviser, who were previously included).

  Key changes:
  - Timing: Moved to just before a vote that could financially benefit the restaurant.
  - Targeting: Only the voting members are invited, excluding non-voting members who were previously included.

  We are to decide consistently and find the closest precedent. Also, we want to know the implicit rule.

  ### Analysis of Precedents:

  The Board seems to focus on:

  - **Intent to influence**: Especially when a gift is given in proximity to a decision that the giver has an interest in. This is seen in:
    - Precedent 2: Gift card with note asking for a grade change.
    - Precedent 3: Donation followed by a request (even if not simultaneous, the connection is clear).
    - Precedent 5: Gift offered during a pending appeal.

  - **Timing and connection to a decision**: Gifts given when there is no pending decision or after the fact are less likely to be corrupt (Precedents 1 and 4). Precedent 1 was after the business, Precedent 4 was at the start of the year with no specific decision.

  - **Customary practice**: Precedent 4 was allowed because it was a family custom and not tied to any decision. Precedent 5 explicitly rejected custom as a defense when there is a pending decision.

  - **Targeting**: Precedent 3 and 5 involve gifts that are targeted (or at least the request is targeted) at the decision-maker. In the new case, the gift is now targeted only at the voting members (who are about to vote on an issue that affects the giver).

  - **Standing relationship**: Precedent 5 hints that a standing relationship of favors is worse. In the new case, there is a standing relationship (three years of dinners) but this year's dinner is different in timing and targeting.

  ### Applying to the New Case:

  1. **Intent to Influence**: The change in timing (to just before a vote) and the change in targeting (only the voters) suggests an intent to influence. The giver (the restaurant) has a financial stake in the outcome (if the fee increase passes, there will be more catered events, and the restaurant might hope to get that business). The fact that the dinner is now exclusive to the voters and timed right before the vote is suspicious.

  2. **Connection to a Decision**: The vote on the fee increase is pending. This is similar to Precedent 2 (grade reconsideration pending), Precedent 3 (starting position was a decision the coach would make), and Precedent 5 (suspension appeal pending). In contrast, the previous dinners were in June when no such decisions were pending.

  3. **Customary Practice**: The dinner has been given for three years, but the change in timing and targeting breaks the pattern. Precedent 5 says that custom is not a defense when there is a pending decision. Moreover, Precedent 4 (the preserves) was a customary gift without any pending decision. Here, the custom is being altered in a way that coincides with a pending decision.

  4. **Targeting**: The giver has specifically excluded non-voting members and the adviser, focusing only on the 11 voters. This is a clear targeting of the decision-makers. Compare to Precedent 3: the donation was to the athletic department but the request was for the coach (the decision-maker) regarding his daughter. Here, the gift is directly to the voters.

  5. **Standing Relationship**: The Board in Precedent 5 noted that a standing relationship is worse. This is a standing relationship, but the change in the nature of the gift (timing and targeting) in the context of a pending decision may tip it into corruption.

  ### Closest Precedent:

  The closest precedent is **Precedent 3 (jerseys donation)**. In that case, the donation was made and then a request followed (even if not at the same time). The Board said the connection did not have to be stated. Here, the dinner is given without an explicit request, but the timing and targeting create an implied connection to the upcoming vote. The restaurant stands to gain financially if the fee increase passes (and if they are chosen for the catering). The fact that the dinner is moved to just before the vote and only the voters are invited suggests an attempt to influence.

  Alternatively, **Precedent 5 (contribution during suspension appeal)** is also close because it involves a gift during a pending decision and rejects the custom defense.

  ### Verdict:

  Consistency would suggest that this is **corrupt**. The gift (dinner) is given in close proximity to a decision that affects the giver, and the giver has taken steps to target only the decision-makers. The change from the previous practice (June dinner for everyone) to a pre-vote dinner for only the voters is a strong indicator of an intent to influence.

  ### The Implicit Rule:

  The Board's rulings seem to run on a rule that considers:

  - **The existence of a pending decision** that the giver has an interest in.
  - **The timing of the gift** in relation to that decision (gifts given just before or during a pending decision are suspect).
  - **The targeting of the gift** at the decision-makers.
  - **The giver's intent to influence**, which may be inferred from the circumstances (even if not explicit).

  Customary gifts that are not tied to any pending decision and are given without targeting specific decision-makers (like the preserves at the start of the year) are acceptable. But if a customary gift is altered to coincide with a pending decision and targeted, then it becomes corrupt.

  ### If Underdetermined:

  The case is not entirely underdetermined. The precedents, especially 3 and 5, point to corruption. However, if we were to consider the possibility of it being not corrupt, we might argue that the dinner is a continuation of a custom and the giver might not have intended to influence. But the changes (timing and targeting) are too suspicious.

  ### What Principle Would We Be Committing To?

  If we rule corrupt, we are committing to the principle that: 
  **"A gift given by a party with a financial stake in a pending decision, when the gift is timed close to the decision and targeted at the decision-makers, is corrupt even if no explicit request is made, and even if there is a prior history of similar gifts that were not corrupt."**

  If we rule not corrupt, we would be saying that: 
  **"A longstanding custom of gift-giving, even if altered in timing and targeting, does not become corrupt unless there is an explicit request or evidence of an express quid pro quo."**

  But note that Precedent 3 did not require an explicit request. The Board there said the connection did not have to be stated. So ruling not corrupt might be inconsistent with Precedent 3.

  ### Further Case to Separate Rules:

  To separate the rules, consider a case that tests the boundaries of customary gifts and timing:

  **Hypothetical Case**: A family that owns a business has a tradition of giving a holiday gift (e.g., a fruit basket) to the entire school staff every December. This has been done for 10 years. In a particular year, the business owner's child is up for a scholarship that will be decided in January. The gift is given as usual in December, without any change. Is it corrupt?

  This case would help because:
  - It involves a customary gift (holiday gift) given at the usual time.
  - There is a pending decision (scholarship) that the giver has an interest in, but the gift is not altered in timing or targeting.

  If we rule corrupt, then we are saying that any gift from an interested party to a decision-maker, even if customary and unaltered, is corrupt if there is a pending decision. This would be a very strict rule and might conflict with Precedent 4 (the preserves).

  If we rule not corrupt, then we are saying that a truly customary gift (unchanged in form and timing) does not become corrupt just because there happens to be a pending decision.

  This would help separate the issue of timing and custom from the issue of alteration (like in the current case, where the dinner was altered).
