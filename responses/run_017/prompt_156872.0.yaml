prompt: |-
  I run a weekly voluntary reading group at a small liberal-arts college — its not a class, 14 people, mostly third-year philosophy and psychology majors, 90 minutes, room with a projector and a whiteboard but no reliable wifi. In two weeks its my turn to pick the topic and I want to do illusionism about phenomenal consciousness: the Frankish/Dennett-flavoured line that introspection doesn't reveal intrinsic, non-representational qualitative properties of our experiences but actively misrepresents its own states as having them. Not the crude version where nothing is conscious and we're all secretly zombies — the version where something is definitely going on, and the mistake is in how that something gets presented to the subject.

  The problem is that every time I've tried this informally it collapses. I show some visual illusion (Mach bands, or two identical grey squares that look different against different backgrounds), say "qualia are like that," and someone immediately points out that the illusion is itself a conscious experience with a distinctive character, so all I've done is hand them one more datum. They're right, and I don't have an answer in the moment. So: design me an actual activity — a game with payoffs, a role-play, a staged case with forced choices, whatever fits — where the group runs into the problem before I name it, so that by the end they can state the illusionist claim in their own words and also say precisely what it does *not* deny. No lecture up front, and the word shouldn't appear until afterwards. My rough idea was a round where everyone writes a careful private description of what a stimulus is like, I secretly re-present the same stimulus under a new label (or swap in a near-neighbour), and they have to defend or retract their earlier description — maybe with credence chips staked on what their own future reports will say. But I can't see how to get from "your reports are contaminated and contestable" to "introspection misrepresents," or from "one attributed property is misrepresented" to "there are no phenomenal properties," so feel free to scrap it.

  Two more things. One of the regulars is a committed realist who will say: fine, my description was influenced by the label, but there is still something it is like, and that was the whole question — I want the design to make that move genuinely uncomfortable rather than brushed aside, and the debrief should be honest about where it survives untouched. And I want them to come away seeing illusionism as a view with a *debt* attached — somebody owes an account of the illusion in non-phenomenal terms — not as a denial. Give me the timeline, roles or rules, the debrief mapping particular moments onto particular parts of the view, what will predictably go wrong the first time I run it (including the ways it will collapse into eliminativism), and a frank note on which feature of illusionism the activity simply cannot reproduce and I'll have to supply myself. Practical notes: printouts and index cards are fine, food isn't (one member has a severe allergy), so if you think an ingestible version is worth the hassle, say so and I'll check with her.
reasoning: |-
  We are designing an activity for a 90-minute session with 14 participants. The goal is to lead the group to articulate the core of illusionism about phenomenal consciousness without using the term until the end. The activity should:
   1. Make participants experience the fallibility of introspection in a way that challenges the idea that introspection reveals intrinsic, non-representational qualitative properties.
   2. Avoid collapsing into eliminativism (the crude "nothing is conscious" view).
   3. Make the committed realist uncomfortable with their default position by showing that what they take as direct evidence (the introspective report) is systematically misleading.
   4. Frame illusionism as having a debt: it must explain the illusion in non-phenomenal terms.

   The rough idea provided (private descriptions, re-presentation, and retraction) is a good start but needs development. We'll build on that.

   Proposed Activity: "The Sensory Betting Game"

   Overview:
   We use a series of sensory stimuli (visual or auditory) that are ambiguous or subject to context effects. The activity has three phases: 
     Phase 1: Private description of a stimulus.
     Phase 2: Re-exposure to the same stimulus (or a near-identical one) in a different context, leading to a potential change in experience.
     Phase 3: A betting round where participants stake on their own future reports and then are forced to reconcile their previous description with the new experience.

   The key is to create a situation where the participant's own report becomes a target of doubt, and they must confront the fact that their introspection is not a direct window but an interpretative process that can be influenced.

   Materials:
     - Index cards for private descriptions and for betting.
     - Printouts of visual stimuli (to avoid relying on wifi). We'll use two types:
          a) Ambiguous figures (e.g., the duck-rabbit, or Necker cube) that can be seen in two ways.
          b) Context-dependent stimuli (e.g., two physically identical color patches on different backgrounds that look different, or a sound that can be heard as two different words).
     - A whiteboard to track bets and outcomes.

   Timeline (90 minutes):

   0. Introduction (5 minutes)
      - Explain that we are going to do an activity about perception and introspection. 
      - Set the rules: everyone will be shown a stimulus and will write a private description. Then we'll do a series of rounds involving the same or similar stimuli.

   1. Phase 1: First Exposure and Description (15 minutes)
      - Show a stimulus (e.g., an ambiguous figure like the duck-rabbit). Tell participants: "Look at this image and write a brief description of what you see. Be as specific as you can about the experience. What is it like for you right now? Do not write the name of the object, but describe the qualities of your experience (e.g., lines, shapes, how they appear to you)."
      - Collect the index cards.

   2. Phase 2: Context Manipulation and Second Exposure (20 minutes)
      - Without revealing what you are doing, show the same image again but in a context that primes a different interpretation (e.g., if they saw the duck first, now show it after a series of rabbit images). Alternatively, for color patches: show the same color patch but on a different background that makes it look different.
      - Ask them to write a new description of the same stimulus (without telling them it's the same). This time, ask: "Now, having seen more images, describe the experience again. How does it look now?"
      - Collect the new descriptions.

   3. Phase 3: The Betting Round (30 minutes)
      - Reveal that the second stimulus was the same as the first (or in the case of color patches, that the physical color was the same). 
      - Explain that we are going to do a betting game on their own future reports. They will be shown the same stimulus again, but in a new context (or after some time) and they must predict what they will report then.
      - Each participant gets 10 credence chips (or points on the board) to bet on one of three options for the next exposure:
          Option A: "My next description will be the same as my first one."
          Option B: "My next description will be the same as my second one."
          Option C: "My next description will be different from both."
      - They write their bet (and the amount they wager) on an index card and hand it in.
      - Then, show the stimulus again, but in a neutral context (or after a break) and ask for a third description.
      - Compare the third description to the first two. Pay out the bets: if they bet correctly, they double their wager; if wrong, they lose the wagered chips.

   4. Debrief and Discussion (20 minutes)
      - Start by having participants share their experiences: How did their descriptions change? How did they feel about the bets?
      - Guide the discussion toward the fallibility of introspection. Point out that the same physical stimulus led to different experiences, and that the experience was influenced by context, expectations, etc.
      - Then, introduce the illusionist idea: introspection is not a direct revelation of intrinsic properties but a constructive process that can misrepresent. Use the activity to show that the properties we attribute to our experiences (like the "look" of the image) are not stable and are influenced by factors we don't control.
      - Emphasize: illusionism does not deny that there is something it is like (they had experiences, and they were real), but it says that the way that something is presented to us (as having intrinsic, non-representational qualia) is an illusion. The activity showed that the properties we introspect are not fixed and can change without a change in the stimulus.
      - Address the realist: the realist might say, "But even though the experience changed, there was still an experience." Agree, but point out that the properties they attributed to the experience (which they thought were intrinsic) turned out to be dependent on context and interpretation. This suggests that the properties are not intrinsic to the experience but are part of a representation that can be wrong. The debt: we must explain why and how this illusion arises without invoking the very thing it is an illusion of.

   5. Naming the View (5 minutes)
      - Finally, reveal that this view is called "illusionism" about phenomenal consciousness.

   How it meets the goals:
     - The activity creates a situation where participants directly experience the instability of their own introspective reports. They are forced to bet on their own future reports and see that they can be wrong.
     - It avoids eliminativism because we are not denying that they had experiences. We are focusing on the properties they attributed to the experiences.
     - The realist move is made uncomfortable because the properties they took as given (the qualia) are shown to be malleable and context-dependent. This challenges the idea that introspection reveals intrinsic properties.
     - The debt is clear: we have an illusion (the appearance of intrinsic qualia) that needs an explanation. We must explain how the brain creates this illusion without real qualia.

   Predictable Problems:
     1. The realist might say: "But the change in experience is just a change in the real qualia. There's no misrepresentation." 
          - Response: Then why did you think the stimulus was the same? The physical stimulus didn't change, so if the qualia are intrinsic properties of the experience, why did they change? The illusionist says the change is in the representation, not in an intrinsic property of the experience.

     2. The activity might collapse into eliminativism if participants conclude that because the reports are unstable, there is no experience. 
          - Prevent by emphasizing in the debrief that the experience is real, but the properties we attribute to it are misrepresented.

     3. Some might not experience the change (e.g., they see the duck both times). 
          - Use multiple stimuli so that everyone has at least one case of change. Also, point out that even if they didn't change, others did, so the phenomenon is real.

     4. The betting might be seen as a game and not taken seriously. 
          - Use points that have no real value but frame it as a way to test their confidence in their own introspection.

     5. The connection from "some properties are misrepresented" to "there are no phenomenal properties" is still a leap. 
          - In debrief, explain that the illusionist claims that what we call phenomenal properties are always misrepresentations. The activity shows that at least sometimes they are, so why think they are ever accurate? And if they are systematically inaccurate, then there are no such properties.

   What the activity cannot reproduce and must be supplied:
     - The activity only shows that introspection is fallible and that the properties we attribute can be influenced. It does not show that introspection is systematically misrepresenting its own states as having intrinsic qualia in every case. The facilitator must argue that the same mechanisms that cause the fallibility in these cases are at work in all introspection, and that the representation of intrinsic qualia is a pervasive illusion.

   Practical note: We avoid ingestibles because of the allergy. We use visual and/or auditory stimuli.

   Roles: The facilitator (you) runs the activity. Participants are the subjects and bettors.

   Adjustments for the color patch example:
     - First exposure: show a grey square on a dark background (it will look light).
     - Second exposure: show the same grey square on a light background (it will look dark). But don't tell them it's the same.
     - Third exposure: show it on a medium background and ask for a description.

   For the auditory version: use a phoneme that is ambiguous (e.g., between /ba/ and /pa/). Play it in a series that primes one interpretation and then the other.

   Using multiple stimuli in one session might be too time-consuming, so pick one or two that are robust.

   This design should lead participants to articulate the illusionist claim: introspection misrepresents the nature of our experiences by presenting them as having intrinsic qualitative properties that they don't actually have. And they should see that illusionism doesn't deny that there is something it is like, but it does deny that what it is like is as it seems.
answer: |-
  ### Activity Design: **The Introspection Confidence Game**  
  **Goal:** Guide participants to articulate illusionism's core claim—that introspection misrepresents its own states as having intrinsic phenomenal properties—without denying the reality of conscious processes. The activity creates tension for realists by making introspective reports feel unreliable and context-dependent, while framing illusionism as a project to explain the *source* of this misrepresentation.

  ---

  #### **Materials**  
  - **Index cards** (3 per participant)  
  - **Printed stimuli** (visual illusions on handouts):  
    - **Stimulus A**: Two identical gray squares on gradients (Adelson’s checkerboard illusion)  
    - **Stimulus B**: The same squares isolated from context (revealing their identical shade)  
    - **Stimulus C**: A near-identical square (slightly different shade) on a new background  
  - **Credence chips** (e.g., poker chips, stickers, or tally marks on whiteboard)  
  - **Timer**  

  ---

  #### **Timeline (90 min)**  
  **Phase 1: Private Description & Betting (25 min)**  
  1. **Intro (2 min)**: "Today we're exploring how we describe subjective experiences. No jargon—just report what you *actually notice*."  
  2. **Stimulus Exposure (5 min)**:  
     - Show **Stimulus A** (two squares looking different due to backgrounds).  
     - Participants write **Card 1**: "Describe the *exact qualities* of each square’s appearance. Be precise."  
  3. **Confidence Betting (8 min)**:  
     - Collect Card 1.  
     - Participants bet credence chips (0–5) on **two predictions**:  
       - *Bet 1*: "If you see these squares again later, your description will match Card 1 exactly."  
       - *Bet 2*: "If you learn new info about the stimulus, you’ll stand by Card 1’s accuracy."  
  4. **Reveal & Second Exposure (10 min)**:  
     - Show **Stimulus B** (squares isolated, proving they’re identical).  
     - Participants write **Card 2**: "Revise your initial description if needed. What *is* the square’s color *now*?"  

  **Phase 2: The Swap & Retraction (30 min)**  
  1. **Stimulus Swap (10 min)**:  
     - Secretly replace one square with **Stimulus C** (slightly different shade) on a new background.  
     - Present it as "the same squares in a new context."  
     - Participants write **Card 3**: "Describe the squares *now*. Do your past descriptions hold up?"  
  2. **Forced Choice (15 min)**:  
     - Reveal the swap.  
     - Participants choose **one option** (write publicly on whiteboard):  
       - *Option A*: "My Card 1 description was wrong, but the *experience itself* had intrinsic properties."  
       - *Option B*: "My Card 1 description was wrong, and introspection *misled me* about properties."  
       - *Option C*: "My Card 1 was fine—the *stimulus* changed, not my experience."  
  3. **Defend or Retract (5 min)**:  
     - Participants debate in pairs, then place remaining chips on their chosen option.  

  **Phase 3: Debrief & Illusionism Revealed (35 min)**  
  1. **Group Analysis (15 min)**:  
     - Map moments to illusionist claims:  
       | **Activity Moment**          | **Illusionist Concept**                          |  
       |------------------------------|------------------------------------------------|  
       | Betting on future reports    | Introspection is *unreliable*                  |  
       | Revising after Stimulus B    | "Phenomenal properties" are *context-dependent* |  
       | Defending Option A vs. B     | Realism vs. *misrepresentation*                |  
       | The secret swap             | Introspection *constructs* properties           |  
     - Highlight: "You felt pressured to retract descriptions, yet couldn’t deny *something* was happening. That tension is the illusion."  
  2. **State the View (10 min)**:  
     - "Today’s view: Introspection *actively constructs* the feeling of intrinsic qualities. It’s not lying—it’s *misrepresenting* how processing works. **This is illusionism.**"  
     - Clarify:  
       - **Denies**: Intrinsic, non-representational qualia.  
       - **Affirms**: Conscious processes exist, but their *presentation* is illusory.  
       - **Debt**: "We owe an explanation: How does the brain *generate* this illusion without real qualia?"  
  3. **Realist Challenge (5 min)**:  
     - Invite the committed realist to restate their position.  
     - Counter: "You say there’s ‘still something it’s like’—but can you describe it *without* appealing to properties you just retracted? Illusionism agrees there’s ‘something,’ but asks: *Why does it feel like more?*"  
  4. **Q&A (5 min)**  

  ---

  #### **Predictable Problems & Solutions**  
  - **Collapse into eliminativism**: Participants say, "No properties? So consciousness isn’t real!"  
    - *Mitigation*: Stress in debrief that illusionism *affirms* conscious processes (e.g., "Your confusion when the squares changed proves something real happened").  
  - **Realist deflection**: "My description was biased, but the *raw feel* remains."  
    - *Make it uncomfortable*: "Point to the ‘raw feel’ independent of your retracted descriptions. If you can’t isolate it, is it a *possession* or an *inference*?"  
  - **No "aha" moment**: Some won’t experience the illusion strongly.  
    - *Solution*: Use multiple illusions (e.g., add a sound illusion like the McGurk effect via pre-recorded audio) to broaden impact.  
  - **Over-intellectualizing**: Philosophy majors dissect the game, not the experience.  
    - *Solution*: Emphasize concrete choices (e.g., "Defend your bets!").  

  #### **What the Activity Can’t Capture**  
  You’ll need to **explicitly state**:  
  > "Illusionism claims introspection *systematically and universally* misrepresents—not just in illusions. The ‘debt’ is explaining why this machinery evolved. Today’s game shows the *problem*; the theory answers it by saying introspection is a user-interface for neural processes, not a window to intrinsic properties."  

  ---

  #### **Why This Works**  
  - **Pre-empts the "illusion is a datum" objection**: By making participants *stake credibility* on their reports, the focus shifts to *why* they feel forced to retract descriptions despite a persistent sense of "something happening."  
  - **Debt is tangible**: The swap reveals a gap—if properties aren’t "in" the experience, what *is* introspection doing?  
  - **Realist discomfort**: Option A (defending "intrinsic properties") becomes untenable when descriptions crumble, yet they can’t articulate what remains.  

  **Practical note**: Avoid ingestibles; visual/auditory illusions are sufficient. Print stimuli in high contrast to ensure visibility.  

  **Outcome**: Participants will articulate: "Introspection *constructs* properties that aren’t there, but the construction *is* the conscious process—and we need to explain how that works." That’s illusionism in their own words.
