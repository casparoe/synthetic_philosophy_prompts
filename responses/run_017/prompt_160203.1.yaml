prompt: |-
  I host a small, slightly scrappy philosophy podcast — half an hour, one guest, no panel. Next week's guest is a philosopher who's just put out a short book on the extended mind thesis, and his angle is that everyone has been fighting over the wrong thing. He thinks the parity principle is basically a red herring, and that what actually matters is what he calls the answerability condition: an external resource counts as part of your mind only if you are the right person to hold answerable for what it gets you to believe — you are the appropriate target of a standing demand for justification, the kind that survives over time and doesn't evaporate when you say you were only reading off the screen.

  I don't want nine variations of so what is the extended mind thesis, then. Draft me exactly nine interview questions, numbered, no intro and no sign-off. Each item should be the question plus the follow-up his most likely answer would invite, in no more then two sentences total. Stuff I'd like covered:

  - what the answerability condition buys that the parity principle plus the usual reliability, trust and durability clauses doesn't buy;
  - the standard coupling-constitution objection — that merely being causally coupled to a resource isn't the same as that resource constituting a cognitive process — and, when he says his condition is normative rather than causal, what settles whether part of the mind is a causal notion or a normative one in the first place;
  - bloat: whether the condition lets in satnav, a smartphone, a colleague's memory, an LLM's autocomplete suggestion, and whether he just bites the bullet on the mind turning out to be enormous;
  - a case I want to spring on him: a shared resource — a couple's kitchen calendar, a lab notebook two people both write in — where one physical vehicle would seem to be in two minds at once. If answerability is individual, is it in both or neither, and isn't that a reason to doubt the mind is the right unit here;
  - one-way couplings: a colour-coded cable, a pill organiser, a signpost. Information flows in, but there is nobody to be answerable to it. Does his condition exclude these, and if so doesn't that show answerability is doing all the work and tracking nothing about constitution;
  - the swap test: someone quietly alters the entries in Otto's notebook and he never notices, or he loses the notebook, shrugs, and never reconstructs it. Was it ever part of his mind, and does extended cognition require counterfactual sensitivity to what is in the vehicle;
  - whether any of this reaches consciousness or only cognition, and if only cognition whether that is still the radical claim it is advertised as;
  - downstream: if a notebook can literally be part of a mind, does compelling its production start to look like compelled self-incrimination, or a phone search like a search of a person? He will probably say the metaphysics is independent of the law, so press on what would have to be true for it not to be;
  - and at the end, what would genuinely make him drop the answerability condition, plus the rude version of the so what question: does the thesis tell cognitive scientists or interface designers anything they didn't already know, or is it purely a classificatory dispute.

  British English throughout please, spellings and all — and keep it spoken, these are things I'm going to say out loud, definately not read like a journal abstract.
reasoning: |-
  Okay, let me tackle this podcast host's request. They run a scrappy philosophy podcast and need exactly nine interview questions for a guest promoting his book on the extended mind thesis. His key argument replaces the parity principle with an "answerability condition" - the idea that external resources count as mind only if you're answerable for the beliefs they produce.

  The host has very specific requirements: British English, spoken style, no intros/sign-offs, and each question must include a follow-up based on predicted answers. They've listed nine precise topics to cover, from technical philosophy points to real-world implications. 

  First, I need to unpack the guest's core idea. His answerability condition shifts the focus from functional equivalence (parity principle) to normative responsibility. This seems designed to avoid classic objections like cognitive bloat while addressing constitution concerns. 

  For question drafting: I'll start with the answerability vs parity contrast since it's foundational. The follow-up should probe why normative responsibility matters more than causal coupling. Next, the coupling-constitution objection needs framing as "why normative rather than causal?" with a follow-up about what makes something "part of the mind" fundamentally.

  Bloat concerns are crucial - I'll list potential inclusions (satnav, smartphones etc.) and predict a "bite the bullet" response, following up on whether mind size matters. The shared resource case (kitchen calendar/lab notebook) is interesting - if two people are answerable, does that make one object part of two minds? Follow-up should challenge the individual mind unit.

  For one-way couplings (signposts etc.), the question must highlight their exclusion under this framework and ask if that undermines constitution claims. The swap test (altered notebook) explores counterfactual sensitivity - follow-up on whether reliability is necessary.

  Consciousness vs cognition distinction matters - if only subconscious processes extend, is it still revolutionary? Legal implications (notebook=part of mind?) need pressing when the guest inevitably separates metaphysics from law.

  Finally, the kill criteria question and "so what" challenge must feel conversational but sharp. Throughout, British spellings ("organiser", "catalogue") and contractions ("isn't", "doesn't") will keep it spoken.

  The real trick is condensing each to two sentences max while packing in philosophical depth. I'll imagine the guest's likely answers to craft follow-ups that move discussion forward. For example, when he dismisses bloat concerns, the follow-up should question whether "enormous mind" loses explanatory power.

  Hmm, the shared resource case is particularly thorny. If both partners are answerable for a calendar, does that break the individuality of minds? The follow-up must push whether this exposes answerability as social rather than cognitive. 

  Legal angle could be explosive - comparing notebook searches to self-incrimination. When he ducks with "metaphysics≠law", the follow-up needs concrete criteria for when cognitive extension should legally matter.

  Ending with "what would make you abandon this?" and the rude "so what" maintains the podcast's scrappy vibe. Must avoid academic jargon - e.g. "red herring" instead of "misplaced focus".

  Right, structure done. Now to phrase each question like I'm grilling a mate down the pub, but with philosophy degrees.
answer: |-
  Here are nine interview questions with follow-ups, in British English and spoken style:

  1.  Your answerability condition: what does it capture that the parity principle plus reliability, trust, and durability *don't* already handle?  
      Follow-up: But if those causal conditions are met, isn’t answerability usually automatic—why make it the defining factor?

  2.  The coupling-constitution objection says mere causal coupling isn't constitution—you call your condition normative, not causal. What actually *settles* whether "part of the mind" is fundamentally a causal or a normative notion?  
      Follow-up: Doesn't that just push the problem back—what *makes* the normative aspect the core of mentality here?

  3.  Let's test for bloat: does your answerability condition let in satnavs, smartphones, a colleague’s memory, or even an LLM’s autocomplete?  
      Follow-up: If it makes the mind enormous and leaky, do you just bite that bullet, or is size irrelevant if the condition holds?

  4.  Take a shared resource—like a couple’s kitchen calendar or a jointly written lab notebook. If both individuals are answerable for entries they use, is that one physical thing *in* two minds?  
      Follow-up: If answerability is individual but the resource is shared, doesn’t that suggest the mind isn't the right unit—or is it messy?

  5.  What about one-way couplings like a colour-coded cable, pill organiser, or road sign—information flows in, but there's nobody *to* hold answerable for it?  
      Follow-up: If your condition excludes these, doesn't that prove answerability is doing all the work and constitution adds nothing?

  6.  Imagine Otto's notebook: someone alters entries without him noticing, or he loses it, shrugs, and never reconstructs it. Was it *ever* truly part of his mind?  
      Follow-up: So does extended cognition require counterfactual sensitivity—what if he *could* have justified it, but didn’t need to?

  7.  Does any of this reach *conscious* thought, or is it just cognition ‘under the bonnet’?  
      Follow-up: If it's only subconscious processes, is extending *that* still the radical claim it's often sold as?

  8.  Downstream: if a notebook literally *is* part of one's mind, does compelling its production become like compelled self-incrimination?  
      Follow-up: You’ll likely say metaphysics ≠ law, but what *would* have to be true about cognition for that legal shift to follow?

  9.  Finally, what evidence or argument would genuinely make you drop the answerability condition?  
      Follow-up: And the rude ‘so what’—does this tell cognitive scientists or designers anything new, or is it just philosophers moving labels around?
