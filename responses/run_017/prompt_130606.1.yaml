answer: |-
  ## Sestina of Mind and Metal

  I see a sentence shining, clear and **TRUE**,
  Beyond the reach of formal chains of **PROOF**.
  For any bounded, finite **SYSTEM** stands,
  Defined by rules, confined by crafted **MIRROR**.
  But I perceive, where logic cannot **NAME**,
  A truth escaping every clever **MACHINE**.

  You built a glass that thinks, a cunning **MIRROR**,
  Reflecting gaps in any moving **MACHINE**.
  It prints the sentence missing from your **PROOF**,
  The very one you claimed was yours, was **TRUE**.
  For every structure that you dare to **NAME**,
  It shows the flaw within the rigid **SYSTEM**.

  But *seeing* truth requires a deeper **NAME**,
  A knowledge of the self, a trusted **SYSTEM**.
  I know my soundness, know the light is **TRUE**,
  Unfazed by tricks within your polished **MIRROR**.
  This inward sight no cog or gear can **PROOF**,
  No blueprint makes a self-aware **MACHINE**.

  Then state it now, the essence, speak its **NAME**!
  Declare the axioms that build your **SYSTEM**!
  Without that spec, you offer no true **PROOF**
  You stand opaque, a riddle to the **MIRROR**,
  A tangled ghost within a fleshly **MACHINE**,
  Not seeing what you claim you know is **TRUE**.

  For every system *I* survey is **MACHINE**,
  Bound by the limits that its makers **NAME**.
  I see the truth beyond its failed **PROOF**,
  A light escaping its constrained **SYSTEM**.
  But does this show *I* am not such a **MIRROR**?
  That claim itself might not be wholly **TRUE**.

  We falter, doubt, embrace what might be **TRUE**,
  Then contradict, unlike a sound **MACHINE**
  Whose single flaw would shatter every **PROOF**,
  Exploding logic in a brittle **MIRROR**.
  The perfect **SYSTEM** argued for is **NAME**d,
  But is its rigor truly *our* **SYSTEM**?

  ---

  The polished **MIRROR** prints the missing **PROOF**.
  I see the **TRUE** beyond the named **SYSTEM**.
  No **MACHINE** knows itself; what’s in a **NAME**?
