prompt: |-
  hey, I run a small reading group and next month we're doing the corruption material — clientelism, the anthropology of the gift, and whether the standard abuse-of-entrusted-power-for-private-gain definition is secretly just a description of arm's-length Western exchange with a minus sign in front of it. I want to open the session with something that makes people laugh and that someone who actually works on this would still call fair.

  So: write me a chapter from the internal compliance training module that some fictional development agency issues to staff posted overseas — Module 4: Gifts, Hospitality and Relationship Maintenance, or whatever you'd call it. Invent the agency, the country and the project; I don't care what they are. Deadpan corporate voice, the sort of prose that opens with "The Bureau recognises that relationships matter." Nothing in the text should signal that it's a joke. Around 700 words, and I'd like it to contain: a couple of worked examples; some kind of table or schedule (I have this image of a payment depreciating into a gift over a fixed period of acquaintance, and then a clause saying it only becomes fully a gift once the relationship has been transmitted to the next generation — please take that and run with it); and a short end-of-module quiz where the correct answers are the horrifying ones.

  The comedy has to come out of the real conceptual material rather than out of the country being poor: the three obligations (to give, to receive, to return) and why a gift that is compulsory and self-interested collapses the gift/bribe distinction from the inside; the fact that the same envelope is a bribe, a gift, a fee or extortion depending on who hands it to whom and in what order; clientelism as a durable, hierarchical, diffuse exchange of loyalty for protection rather than a one-off purchase; and the way the universalist framing insists it is culture-neutral while every clause assumes strangers, contracts, and nobody owing anybody anything. Punch up, not down — the joke should land on the headquarters, the consultants and the module itself. The local official who explains how things actually work to the new arrival should be the sharpest person in the room, and his workaround should be the thing that gets the rural electrification project finished. The reductio I'm after: follow the module exactly and you end up manufacturing clientelist bonds by hand while the rules insist they've been eliminated.

  Dont give me a bibliography or any citations, and no verbatim quotes from real texts — nobody's looking anything up. After the piece, add 3 or 4 sentences on where you took liberties: which bit is an exaggeration nobody actually defends, and which bit is a genuine weak point in the universalist position. Say how confident you are in that note overall, and flag the single claim in it you're least sure of and why.
