  ### Decision Tree for Realism about Interpretability

  **Shared Starting Commitment**: Dictionary-learning methods yield stable, causally efficacious, and often glossable directions in neural networks. No branch denies this.

  #### Branch Nodes (Keyed to Cases)

  1. **Rebasement Case**: An invertible random linear map is applied to the residual stream, with compensation in the next layer, leaving input-output behaviour unchanged. The new basis yields clean, stable, causal features via dictionary learning, just as the original did.  
     *Question: Do the new features (in the transformed basis) represent properties of the world just as legitimately as the original features?*  
     - **Yes** → Proceed to Node 2.  
     - **No** → Proceed to Node 3.  

  2. **Granularity Case**: A dictionary of size *n* yields feature *F*; a dictionary of size *4n* yields four finer features, each with distinct causal profiles and no hierarchical relationship. No objective criterion selects one granularity.  
     *Question: Is there a single, objective fact about whether the coarse feature or the fine-grained features are the "true" representations in the model?*  
     - **Yes** → **Robust Representational Realism** (see Leaf 1).  
     - **No** → **Interpreter-Relative View** (see Leaf 7).  

  3. **Orphaned Direction Case**: A linear probe decodes property *P* near-perfectly, but interventions (ablation/patching) on this direction have no effect on outputs, and no downstream components use it.  
     *Question: Does the orphaned direction represent property P?*  
     - **Yes** → Proceed to Node 4.  
     - **No** → Proceed to Node 5.  

  4. **Vestigial Feature Case**: An auxiliary loss during training forces the model to encode property *P*. After training, the auxiliary head is discarded; nothing uses the direction, but *P* remains decodable.  
     *Question: Does the vestigial feature still represent property P?*  
     - **Yes** → **Training History View** (see Leaf 3).  
     - **No** → **Robust Representational Realism** (see Leaf 1).  

  5. **Fine-Tuning Chimaera Case**: A model is fine-tuned until behaviour associated with *P* vanishes, but the *P*-direction persists, unchanged, and drives other behaviours.  
     *Question: After fine-tuning, does the direction that previously represented P still represent P?*  
     - **Yes** → **Training History View** (see Leaf 3).  
     - **No** → Proceed to Node 6.  

  6. **Unglossable Feature Case**: A direction is stable, causal, and used by downstream components, but its firing pattern defies concise description (e.g., a list of 10,000 unrelated tokens).  
     *Question: Does this unglossable feature count as a representation?*  
     - **Yes** → **Robust Representational Realism** (see Leaf 1).  
     - **No** → Proceed to Node 7.  

  7. **Probe-Resistant Case**: After fine-tuning penalises a probe for *P*, the probe reads *P* at chance. The model still tracks *P* internally, but no probe trained this way can detect it.  
     *Question: Does the model still represent property P?*  
     - **Yes** → **Interventionist Realism** (see Leaf 2).  
     - **No** → **Instrumentalist Fictionalism** (see Leaf 6).  

  #### Leaves (Named Positions)

  1. **Robust Representational Realism**  
     Representations are intrinsic, mind-independent structures in the network, fixed by causal or historical properties.  
     *Awkward commitment*: Unglossable features (Node 6) are representations despite defying human interpretation.  

  2. **Interventionist Realism**  
     Content is fixed solely by the functional role of a feature in current input-output interventions.  
     *Awkward commitment*: The probe-resistant case (Node 7) forces acceptance of representations undetectable by any probe.  

  3. **Training History View**  
     Content is determined by the feature’s original training purpose or selected function.  
     *Awkward commitment*: Vestigial features (Node 4) represent *P* even when entirely unused.  

  4. **Error Theory**  
     Representation attributions are systematically false claims about neural networks.  
     *Reached if*: All branches lead to "No" where possible.  
     *Awkward commitment*: Must dismiss dictionary-learning successes as coincidences.  

  5. **Eliminativism**  
     Neural networks do not and cannot possess representations; the concept is inapplicable.  
     *Reached if*: Error Theory is accepted but extended to all systems.  
     *Awkward commitment*: Denies the utility of interpretability tools outright.  

  6. **Instrumentalist Fictionalism**  
     Representations are useful fictions for prediction, but not real features of the system.  
     *Awkward commitment*: Treats causally potent features (Node 7) as mere tools, not discoveries.  

  7. **Interpreter-Relative View**  
     Representations exist only relative to a decomposition chosen by an interpreter.  
     *Awkward commitment*: Rebasing (Node 1) creates equally "real" but incompatible features.  

  #### Unoccupied Combinations and Overlaps
  - **Combinations with no adherents**:  
    - "Rebasement: Yes" + "Granularity: Yes" (Node 1/2): Asserts arbitrary bases are real *and* a unique granularity exists—incoherent.  
    - "Orphaned: No" + "Vestigial: Yes" (Node 3/4): Requires causal role for representation but accepts unused features—unstable.  
  - **Overlaps**:  
    - **Interventionist Realism** and **Training History View** both reachable via "Fine-Tuning: No" (Node 5), but separated by Node 6 (unglossability).  
  - **Indistinguishable pairs**:  
    - **Error Theory** and **Eliminativism** collapse if "Standard Case: No" is assumed. To separate, add:  
      *Diagnostic: The cross-seed divergence case (same behaviour, no aligned directions).  
      Question: Do the models share representations?*  
      - Yes → Error Theory (false attributions).  
      - No → Eliminativism (no representations).  
    - **Pluralism about levels** (not a leaf) collapses into **Interpreter-Relative View**; both reject a unique "true" decomposition.  

  #### Confidence Note (149 words)
  I am highly confident this tree partitions the space usefully, as it forces distinctions on whether representations are system-independent (Realism), interpreter-dependent (Stance-Relative), or fictional (Fictionalism). The cases optimise for the core disagreement: do interpretability results reveal the system's model or our decomposition? The branch I am least confident about is **Node 4 (Vestigial Feature)**, as it risks conflating Training History with Robust Realism. Robust Realists might accept vestigial features if they prioritise causal history, blurring the line. If empirical work shows Training History advocates *always* reject unglossable features (Node 6) while Robust Realists accept them, my confidence would increase. Conversely, if both positions behave identically here, the tree over-splits and needs revision to merge them, preserving only the realism/stance divide.
