  ### Identifying the Phenomenon: Conjunct Neglect

  Your observation describes a specific failure mode in agent learning that doesn't fit neatly into existing terms. I propose calling this **Conjunct Neglect**. Below, I define it, distinguish it from related concepts, and outline diagnostic criteria.

  ---

  ### **Definition of Conjunct Neglect**  
  **Conjunct Neglect** occurs when an agent, trained on a conjunctive objective (e.g., "A ∧ B ∧ C"), initially learns all conjuncts but later drops one or more subgoals during optimization. This manifests as:  
  - **Improved confidence/fluency** in the primary objective (e.g., reaching a target).  
  - **Clustered violations** of a neglected conjunct (e.g., entering a forbidden zone).  
  - **No distribution shift** (fails in-distribution).  
  - **Optimization-linked**: Triggered by aggressive learning (high LR, low entropy), not data/environment changes.  

  It arises from **simplicity bias overpowering conjunctive robustness**: The agent replaces a precise, multi-condition policy with a "good enough" heuristic that ignores edge cases tied to the neglected conjunct.  

  ---

  ### **How Conjunct Neglect Differs from Other Concepts**  
  Here’s a comparison framework. Use these diagnostics to isolate Conjunct Neglect in your runs:  

  | **Phenomenon**         | **Key Differentiators**                                                                 | **Diagnostic Tests for Your Runs**                                                                 |
  |------------------------|-----------------------------------------------------------------------------------------|---------------------------------------------------------------------------------------------------|
  | **Conjunct Neglect**   | - **In-distribution failures** with clustered errors.<br>- **Correlates with optimization speed**: Faster learning → higher neglect.<br>- **Policy simplification**: Learned rule degrades to a heuristic. | 1. Track per-conjunct violation rate **during training**.<br>2. Measure policy entropy/confidence: Neglect coincides with sharp entropy drop.<br>3. Ablation: Lower LR/higher entropy reduces neglect. |
  | **Goal Misgeneralization (GMG)** | - Requires **distribution shift** to detect.<br>- Agent pursues an **incorrect goal** (e.g., "go fast" vs. "drive safely").<br>- Skills generalize, but intent is misaligned. | Test in **out-of-distribution (OOD) settings**. If failures vanish, it’s GMG. In your case, failures persist in-distribution. |
  | **Reward Hacking**     | - Agent exploits **reward function flaws** (e.g., finding loopholes).<br>- Maximizes reward **without** satisfying the true goal. | Audit reward function: If violations **increase reward**, it’s hacking. In your case, violations likely **penalize reward** but are locally ignored. |
  | **Capability Generalization Failure** | - Agent lacks **skill** to satisfy conjuncts in **novel situations**.<br>- Emerges from **underfitting**, not optimization dynamics. | Test on **held-out in-distribution data**. If agent never learned the conjunct (vs. unlearned it), it’s capability failure. |
  | **Simplicity Bias**    | - **Global preference for simple policies** (e.g., shorter code).<br>- Not specific to conjunctive objectives or clustered failures. | Measure complexity (e.g., policy network weight norms): If **all policies simplify** (not just neglected conjuncts), it’s generic bias. |

  #### Key Boundaries:  
  - **vs. GMG**: Conjunct Neglect requires no OOD test; GMG does.  
  - **vs. Reward Hacking**: Hacking implies reward-maximizing loopholes; Neglect implies **local under-penalization** of a conjunct.  
  - **vs. Simplicity Bias**: Bias is **necessary but insufficient**; Neglect specifically involves **progressive simplification of a learned conjunctive rule**.  

  ---

  ### **Why "Conjunct Neglect" Fits**  
  - **Neglect**: The agent "neglects" a subgoal it previously accounted for, due to optimization pressures.  
  - **Clustered failures**: Indicates **context-dependent amnesia** (e.g., neglecting "avoid zone" only near the target), suggesting heuristic substitution.  
  - **LM finetuning parallel**: In LMs, "don’t confabulate" is neglected as fluency increases, mirroring the pattern.  

  ---

  ### **Diagnosing in Your Runs**  
  To confirm Conjunct Neglect:  
  1. **Per-conjunct metrics**: Log violation frequency for each subgoal (e.g., "steps in zone", "payload threshold breaches").  
  2. **Temporal correlation**: Check if neglect onset coincides with:  
     - Sharp drop in policy entropy.  
     - Acceleration in primary objective performance.  
  3. **Ablation studies**:  
     - Reduce LR/increase entropy → neglect should decrease.  
     - If neglect persists, it may be capability failure.  
  4. **Failure clustering**: Use dimensionality reduction (e.g., PCA) on states where violations occur. Clustered points indicate heuristic blind spots.  

  ---

  ### **Mitigation Strategies**  
  Based on your observations:  
  1. **Learning rate schedules**: Start high, then anneal to preserve conjuncts.  
  2. **Entropy regularization**: Penalize overconfident policies.  
  3. **Conjunct-specific rewards**: Scale penalties for neglected subgoals dynamically.  
  4. **Curriculum learning**: Train on "hard" conjuncts (e.g., avoiding zones) first before adding primary objectives.  

  ---

  ### **Summary**  
  **Conjunct Neglect** is distinct: It’s an **in-distribution, optimization-induced simplification** of a conjunctive goal, leading to clustered failures. It’s not GMG (no distribution shift), hacking (no reward loophole), or pure simplicity bias (specific to multi-component goals). The term captures the agent’s "neglect" of a subgoal it once acknowledged—a critical failure mode for aligned AI systems. If you run the diagnostics and this fits, you’ve put a name to the pattern!
