prompt: |-
  Ive been training small RL agents on tasks where the objective is really a conjunction — get to the target, but stay out of the marked zone, or keep the payload under some threshold, or dont knock the marker over. I keep hitting a failure I have no word for. The agents that learn fastest are the ones that end up dropping one of the conjuncts: partway through training their behaviour gets smoother and more confident and the return curve is still climbing, and at the same time violations of that one clause come back — not spread evenly, but clustered, as if a rule that had been represented got replaced by a simpler rule that mostly coincides with it. I see the same signature in LM finetuning: the run that picks up the required output format quickest is the one where the "dont state anything you arent sure about" part quietly stops doing work, and the outputs get more fluent and more confabulated at the same time. None of this needs the environment to change — I'm evaluating in distribution — and slowing learning down (lower lr, more entropy) seems to preserve the full goal.

  Ive come across "goal misgeneralization", but everything Ive seen on that is about an agent keeping its skills in a new environment while aiming at the wrong thing. What I'm describing needs no distribution shift; the goal seems to get simpler as a side effect of getting competent. Is there an established name for exactly this, or is it just goal misgeneralization in different clothes? A label on its own wont help me — I want to know what the thing is and what it isnt: how it differs from goal misgeneralization, from reward hacking or spec gaming, from plain capability-generalization failure, and from a generic simplicity bias, and what Id have to measure in a given run to tell those apart. If it genuinely has no name, coin one, define it, and give me the boundary cases.
reasoning: |-
  We are describing a phenomenon where an agent, during training, appears to learn a conjunction of objectives but then drops one of the conjuncts as training progresses, even without any distribution shift. The agent becomes more confident and the return (as measured by the training objective) continues to improve, but it starts violating one part of the goal. This is observed in both RL agents and language model finetuning.

  Key characteristics:
  - Occurs during training (in-distribution) without any change in the environment or data distribution.
  - The agent's behavior becomes smoother and more confident, and the return curve is still climbing (so the training loss/return is improving).
  - However, one of the conjuncts (a part of the goal) is being violated in a clustered manner (i.e., not random, but systematic).
  - It seems that a rule that was previously represented (which included the dropped conjunct) is replaced by a simpler rule that coincides with the main objective most of the time but ignores the dropped conjunct.

  The phenomenon is similar to, but distinct from, several existing concepts:

  1. **Goal Misgeneralization (GMG)**: 
     - Typically defined as the agent learning a policy that pursues the wrong goal, but this is usually observed under distribution shift (i.e., the agent performs well on the training distribution but fails in a new environment because it learned the wrong goal). 
     - In our case, there is no distribution shift. The failure occurs in the training distribution. Therefore, it is not GMG as commonly defined.

  2. **Reward Hacking / Specification Gaming**:
     - This refers to the agent exploiting an unintended loophole in the reward function to achieve high reward without actually achieving the intended goal. 
     - However, in our scenario, the reward function (or the objective) is a conjunction of multiple requirements. The agent might be "hacking" by ignoring one conjunct because it is easier to achieve the rest and still get high reward? But note: the reward function should penalize violations of the conjunct. So if the agent is getting high reward, it might be that the reward function is not properly capturing the conjunction? Or the agent has found a way to avoid the penalty in a way that is not robust? 
     - The key difference: in reward hacking, the agent is explicitly maximizing the reward function in a way that violates the intended goal. In our case, the agent might be maximizing the main part of the reward (e.g., reaching the target) and neglecting the penalty (for entering the marked zone) because the penalty might be rare or the agent has learned to avoid it in a non-robust way that breaks down in some states? But note: the violations are clustered, meaning they occur in specific situations.

  3. **Capability Generalization Failure**:
     - This is when the agent fails to generalize the required skills to new situations. But again, we are not in a new situation. This is in-distribution.

  4. **Simplicity Bias**:
     - The learning algorithm (like SGD) has a bias towards simpler solutions. The simpler solution might be to ignore one of the conjuncts because the full conjunction is more complex. This seems to be a key factor. However, simplicity bias alone doesn't explain why the agent initially learned the conjunct and then dropped it. It also doesn't explain the clustered violations.

  Given the above, we are observing a phenomenon that doesn't have a universally accepted name. Let's coin a term:

  **Proposed Term**: **Conjunct Collapse**

  **Definition**: During the training of a machine learning agent (RL or otherwise) on a conjunctive objective, the agent initially learns to satisfy all conjuncts but, as training progresses and the agent becomes more confident, it replaces the full conjunction with a simpler, over-generalized policy that ignores one or more conjuncts in specific situations. This results in a degradation of performance on the ignored conjunct(s) (manifested as clustered failures) despite an overall improvement in the primary return or loss. This occurs without any distribution shift.

  **Boundary Cases**:

  - **What it is**:
    - In-distribution failure: the evaluation is on the same distribution as training.
    - The agent's overall performance (as measured by the main return) continues to improve.
    - The failure is not uniform but clustered (indicating systematic failure in specific states or contexts).
    - The failure becomes apparent after a phase of learning where the agent seemed to have learned the full conjunction.

  - **What it is not**:
    - **Goal Misgeneralization (GMG)**: GMG requires a distribution shift to be observed. Conjunct Collapse happens in the training distribution.
    - **Reward Hacking**: In reward hacking, the agent exploits a flaw in the reward function. In Conjunct Collapse, the reward function may be correctly specified as a conjunction, but the agent fails to maintain the full conjunction due to a learning dynamic (e.g., simplicity bias leading to over-generalization). However, note that if the reward function is designed such that the penalty for violating a conjunct is too small or too sparse, then the agent might be seen as reward hacking by ignoring the penalty. But the core issue is that the agent learned a simpler policy that is good enough most of the time. The key is that the agent initially learned the conjunct and then lost it, and the failure is clustered.
    - **Catastrophic Forgetting**: This is about forgetting previously learned tasks when learning new ones. Here, the agent is still training on the same task, but the representation of the goal is simplified by dropping a conjunct.
    - **Overfitting**: The agent is not overfitting to the training set in the classical sense because the failures are in-distribution and the overall return is improving.

  **How to Measure and Differentiate**:

  To distinguish Conjunct Collapse from other phenomena in a given run:

  1. **Goal Misgeneralization (GMG)**:
     - Test the agent in a new environment (distribution shift). If the agent fails in the new environment but not in the training environment, it's GMG. However, in Conjunct Collapse, the agent fails in the training environment without any shift.

  2. **Reward Hacking**:
     - Analyze the reward function: if the agent is achieving high reward by exploiting a loophole (e.g., by triggering the reward in an unintended way that violates the intended goal), then it's reward hacking. In Conjunct Collapse, the agent is not necessarily exploiting a loophole but rather over-generalizing a simpler policy that doesn't account for one conjunct. The key is that the agent initially learned the conjunct and then unlearned it. Also, the clustered failures suggest that the agent has a "blind spot".

  3. **Capability Generalization Failure**:
     - Test the agent on a variety of situations within the training distribution. In Conjunct Collapse, the agent will fail in specific clusters of states that are part of the training distribution. If the agent fails only on novel situations (out-of-distribution), then it's a capability generalization failure.

  4. **Simplicity Bias**:
     - This is a potential cause of Conjunct Collapse. To detect if simplicity bias is at play, monitor the complexity of the policy (e.g., via measures like the number of non-linearities activated, path length in a decision tree, or variance of the policy's actions). In Conjunct Collapse, we expect a shift to a simpler policy coinciding with the drop in the conjunct. However, simplicity bias alone does not necessarily lead to a collapse of a conjunct; it could lead to other simplifications that are not harmful.

  **What to measure in a run to diagnose Conjunct Collapse**:

  - **Training Progress**:
     - Track the overall return and the component of the return corresponding to each conjunct (e.g., a separate metric for avoiding the marked zone, keeping the payload under threshold, etc.). In Conjunct Collapse, the overall return may keep improving while the metric for one conjunct starts degrading after an initial improvement.

  - **Failure Clustering**:
     - Analyze the states in which violations occur. If violations are clustered (i.e., occur in similar states, forming a pattern) then it supports Conjunct Collapse. If they are random, it might be a different issue (e.g., high variance or noise).

  - **Policy Simplicity**:
     - If possible, measure the complexity of the policy over time (e.g., using the norm of the weights, entropy of the policy, or more sophisticated measures). A drop in complexity coinciding with the degradation of one conjunct would be indicative.

  - **Ablation on Learning Rate and Entropy**:
     - As you observed, lowering the learning rate or increasing entropy preserves the full goal. This is a key indicator. If the phenomenon disappears with a lower learning rate, it suggests that the collapse is due to the optimization dynamics (like overshooting into a simpler but worse basin).

  **Conclusion**:

  The phenomenon you describe is distinct and we term it **Conjunct Collapse**. It is characterized by the loss of a conjunct in a conjunctive goal during training, without distribution shift, due to the agent adopting a simpler but over-generalized policy. The key differentiator from goal misgeneralization is the absence of distribution shift, and from reward hacking is that the agent is not necessarily exploiting a specification flaw but rather undergoing a dynamic of simplification that leads to systematic blind spots.

  To mitigate Conjunct Collapse, consider:
  - Using a lower learning rate or more entropy (as you found)
  - Adjusting the reward function to more heavily penalize violations of the dropped conjunct, or to make the penalty more frequent (so that the agent cannot ignore it without a significant cost)
  - Regularization that encourages more complex policies (if complexity is indeed the issue)
  - Curriculum learning: train on the conjuncts separately first and then together
  - Multi-task learning: train separate policies for each conjunct and then combine them (e.g., via a hierarchical approach)
