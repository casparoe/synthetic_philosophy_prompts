prompt: |-
  I convene a fortnightly decision-theory reading group, and after last week's session two colleagues — Julian (in my own department) and Marta (an económica who sits in with us, and who is much more impatient than I am with idealizations) — stayed behind and got into an argument about the force of Good's theorem, the result that for an agent who updates by conditionalization and then maximizes expected utility, a costless observation has non-negative expected value, evaluated ex ante. The question they were actually fighting about is whether the theorem underwrites the sweeping claim that one can never be made worse off by free information, and so whether there is any distinctively epistemic reason ever to remain ignorant — something that isn't just a cost of looking or a defect in the looker. Tea ran long and I was asked to referee; I said nothing, partly from cowardice and partly because I really couldn't tell where to land. I'd like something in writing, since I may use the exchange as a teaching case in a graduate seminar next term on the value of knowledge. Please don't treat either of them as a foil: every move below is one I would have made in that person's position. Their exchange, as closely as I can reconstruct it:

  (1) Julian: The theorem tells us that ignorance has to be paid for, and there are exactly two currencies: either the information wasn't really costless — it took time, attention, money, or it foreclosed options you'd rather have kept — or you're planning to mishandle it after you get it. Neither currency buys a norm of ignorance. So anyone who declines free information faces a dilemma she should have to answer: either she is paying a cost she hasn't put on the ledger, or she is counting on herself being irrational later. What we don't get is an intellectual analogue of 'sometimes the right thing is to stop looking.'

  (2) Marta: The second horn of your dilemma isn't a diagnosis, it's a description of the human situation, and that's why the dilemma is too quick. Take the case clinicians actually worry about: a genetic test for a late-onset condition with no treatment and no preventive measure available. The patient who tests positive gains no option she lacked; what she gains is a state that reliably degrades her subsequent practical reasoning — she becomes depressed, she stops making long-term plans, she makes worse medical and financial decisions than she would have made in ignorance. For her the information is not free in any sense that a ledger written from the inside can represent: as a matter of psychological fact she is worse at getting what she wants once she has looked. Telling her that a perfect Bayesian in her position would be fine is like telling a man with a broken leg that a perfect walker wouldn't fall.

  (3) Julian: You're conceding too much to the ledger. If she now foresees that looking will corrupt her later reasoning, two things follow and neither is mysterious. First, the package 'look, then reason badly' is dominated by 'look, then reason well,' so what she has discovered is a known defect in her own future practical rationality, and the rational response is to repair it or to arrange matters so she can't act on the corrupted reasoning — commit now, delegate now, burn the bridge now. Second, if neither fix is available to her, then the information isn't costless for her: there is a handling cost, and once we price it, the theorem's own computation tells her not to look. Both routes confirm the theorem. Neither yields a reason for ignorance that isn't either a cost or a defect.

  (4) Marta: But now you've made the theorem unfalsifiable by construction: every apparent counterexample gets reclassified as a hidden cost. There's a class of cases the reclassification can't reach, because the problem isn't how well she reasons, it's the assumption that information moves beliefs and leaves concerns alone. Call it the Sealed Letter case. At fifty a woman opens a letter her mother left her and learns that the father she idealized — and whose reputation she has spent her career defending — was a police informer. Nothing in her reasoning is impaired: she updates impeccably and acts impeccably on what she learns. But the learning reorganizes what she cares about. She no longer cares about the family name; the projects that gave her later life its shape collapse; she becomes someone with different ends. Before opening, she would have paid to know. After opening, she would give everything to unknow, and she can't. By the only lights available to the person who has to live the rest of it, she has been made worse off by the information — and Good's theorem cannot so much as formulate that verdict, since it can only compare lotteries under one fixed utility function defined over the whole tree.

  (5) Julian: It can formulate it; it just doesn't return the verdict you want. 'Worse off' is being used in two voices in your last sentences — the ex ante voice of the woman deciding whether to open the letter, and the ex post voice of the woman who wishes she hadn't. Only the first is a voice in which anything is chosen, and in that voice she isn't worse off. And if you insist that the later self's complaint must count now, the way to honor that isn't to abandon the theorem but to write it into the utility function: if I care about what my future self will care about, or about the integrity of my concerns across time, that is already a term in my current utility function — call it a continuity-of-value term — and once it is there the theorem applies again and returns exactly the answer you dislike: for such a person, some information has negative expected value. That is the 'hidden cost' move you object to, except that now we can see what the cost consists in — the risk of becoming someone whose ends you presently have reason not to want.

  (6) Marta: Then the theorem can't do the work you gave it in (1). If every harmful piece of information can be absorbed as a term in the utility function — a handling cost here, a continuity-of-value term there — then the theorem is a bookkeeping identity: a costless observation has non-negative expected value, where anything that could make an observation bad for you is re-described as making it not costless. Read that way it never touches an actual choice, so it can't establish that there is no such thing as a reason to remain ignorant. Read the other way — as a substantive claim about agents like us, who do sometimes reason badly and whose concerns do sometimes change under what they learn — it is false, as the clinic case and the Sealed Letter show. So the theorem is either vacuous or falsified, and either way it doesn't license the polemic you started with.

  Please adjudicate this, and structure the reply as follows.

  1. Rulings, move by move (about 450–550 words). Take the six moves in order and rate each on a scale from clearly right to clearly mistaken, with two or three sentences of justification, and say where a move is right but for a reason its author didn't give.
  2. The hinge (about 200 words). Name the point on which the disagreement really turns, as opposed to the point the two of them take it to turn on.
  3. What neither side notices (about 200–250 words). The shared assumption, case, or distinction that both take for granted and that changes the picture; give more than one if more than one is warranted. I especially want to know whether their shared set-up — one agent, deliberating against a Nature that doesn't react to her deliberations — is doing work neither of them acknowledges.
  4. Bottom line (about 100–150 words). Who is more right overall and about what; and, if I do use this as a teaching case, what the one thing to tell the room would be.

  Argue from the cases rather than from the literature: I don't want citations, a bibliography, or a restatement of the proof — everyone in the group has read it, and I need this to work as a document we can argue with in the room.
reasoning: |-
  Hmm, the user wants me to adjudicate an argument between Julian and Marta about Good's theorem and whether free information can ever be harmful. This is a fascinating debate in decision theory! Let me analyze their exchange carefully.

  First, Julian's opening move (1) seems too strong. He claims ignorance must always be paid for either through costs or irrationality, but that's precisely what's being challenged. The clinic case Marta presents in (2) is compelling - psychological impacts aren't just "costs" in the standard sense. Julian's response in (3) feels like he's moving goalposts by redefining every negative outcome as a cost. 

  Ah, Marta's Sealed Letter case in (4) is brilliant! It shows how information can fundamentally reshape values, not just beliefs. When Julian counters in (5) by suggesting we just add a "continuity-of-value" term to utility functions, it makes the theorem tautological. Marta nails this in (6) - the theorem becomes either vacuous or falsified when applied to real humans.

  The real hinge here is what counts as a "cost." Julian keeps expanding the definition to preserve the theorem, while Marta wants to recognize irreducible psychological and existential harms. Neither acknowledges that their entire framework assumes a static utility function - but humans change based on information! 

  For teaching, I'd emphasize that Good's theorem is mathematically sound but limited. It can't capture how information transforms us, not just informs us. The bottom line? Marta is more right about human experience, but Julian correctly shows the theorem's formal consistency. The key lesson is that decision theory needs richer models of value change.
answer: |-
  ## Adjudication of Julian vs. Marta on Good's Theorem

  **1. Rulings, Move by Move**

  *   **(1) Julian: Mistaken.** His claim that only costs or irrationality justify declining information begs the question against Marta's core objection. He assumes the theorem's framework (fixed concerns, perfect rationality) exhausts the relevant normative space and dismisses transformative experiences or endogenous preference shifts *as possibilities* rather than addressing them. His "dilemma" only holds if we accept his framing.
  *   **(2) Marta: Clearly Right (for a reason beyond hers).** She correctly identifies a genuine human problem – information causing psychological degradation impairing decision-making *even if* it doesn't impose external costs. Her "broken leg" analogy is apt. While she frames it as a "handling cost," her deeper point is that the *agent's own reasoning capacity* changes, challenging the "fixed agent" assumption implicit in Julian's (1) and the theorem itself.
  *   **(3) Julian: Partially Right, Mostly Misguided.** He's technically correct that if the degradation is foreseen, it becomes a "cost" *within the ex ante model* (fix it, delegate, or price it in). However, he misses Marta's force: 1) "Repairing" severe psychological impacts is often unrealistic ("burn the bridge" is drastic/impractical). 2) His move *confirms* her point: the only way to fit the case into the theorem is by reclassifying the harm as a "handling cost," starting the tautology problem she later identifies. He dismisses the lived reality of the impairment.
  *   **(4) Marta: Clearly Right.** The Sealed Letter case is decisive against Julian's initial strong claim (1). It demonstrates a harm irreducible to external costs or defective reasoning. Information *fundamentally alters her values and identity*. Julian's response (5) confirms her implicit critique: the theorem *cannot* natively handle endogenous preference change over the decision tree without resorting to utility function modifications. Her point about the theorem lacking the resources to formulate the ex post verdict ("worse off") is crucial.
  *   **(5) Julian: Technically Right but Substantiates Marta's Critique.** He correctly states the theorem *can* model foreseen preference instability by adding a "continuity-of-value" term to the ex ante utility function. However, this perfectly illustrates Marta's impending charge of vacuity: *any* perceived harm (psychological impairment, value instability) gets absorbed into the ex ante utility function as a "cost" or disutility, making "costless information has non-negative EV" true by definition. He solves the problem only by expanding "cost" to encompass *any* negative consequence.
  *   **(6) Marta: Clearly Right.** She accurately diagnoses the dilemma Julian's moves create. If "costless" is defined so broadly that *any* negative consequence makes information not costless (handling costs, value instability aversion), then the theorem is a vacuous tautology ("costless info is never costly"). If "costless" means only external resource costs, and the theorem is a substantive claim about agents who reason imperfectly and change, then it is falsified by the Clinic and Sealed Letter cases. Therefore, it cannot license Julian's initial strong polemic against norms of ignorance.

  **2. The Hinge**

  The true hinge is **the scope and nature of the "utility function" and whether it can be treated as stable and exogenous during the decision process.** Julian implicitly assumes the utility function is fixed and comprehensive *ex ante*, capable of encompassing all future states of the self, including potentially transformed preferences, via foreseen disutilities (like aversion to value change). Marta challenges this, arguing that some information *endogenously* alters the utility function itself in ways the *ex ante* self cannot fully anticipate or coherently value from its prior perspective (Sealed Letter), or damages the cognitive machinery applying it (Clinic). For Marta, the utility function isn't a static ledger; it can be *rewritten* or *impaired* by the act of looking. Julian's defenses rely on preserving the ledger's primacy by adding more entries *ex ante*.

  **3. What Neither Side Notices**

  *   **The Static Agent Assumption:** Both arguments occur within the standard decision-theoretic model of a single agent with fixed beliefs/desires facing a passive Nature. This model assumes the *agent's fundamental identity and capacities remain unchanged by the observation*. The Clinic case challenges cognitive capacity stability; the Sealed Letter case challenges identity/desire stability. Neither fully grapples with how deeply Good's theorem relies on this static agent assumption. The "cost" vs. "defect" framing blinds them to the possibility that information can *reconstitute the agent*.
  *   **The Epistemic/Evaluative Distinction Blur:** Julian focuses narrowly on instrumental rationality (getting what you want). Marta's cases introduce a deeper issue: information can change *what* you want or *who* you are the evaluator. The potential "reason for ignorance" isn't just about flawed pursuit of existing goals (Clinic) but about preserving the integrity of the self that *has* those goals (Sealed Letter). Neither explicitly separates the instrumental value of information for achieving goals from the potential *existential* impact on the goals themselves.
  *   **Ex Ante vs. Ex Post as Genuine Conflict:** They debate whose perspective matters (ex ante chooser vs. ex post experiencer), but neither fully acknowledges that in transformative cases like the Sealed Letter, the ex ante and ex post selves are *different evaluative agents* with potentially incommensurable perspectives. The theorem fundamentally operates from the ex ante perspective only.

  **4. Bottom Line**

  **Marta is more right overall, particularly about the limitations of Good's theorem for grounding Julian's sweeping polemic against norms of ignorance.** She successfully demonstrates that the theorem, as standardly interpreted, cannot handle cases where information fundamentally transforms the agent's values (Sealed Letter) or reliably degrades their reasoning capacity (Clinic) without resorting to an expansive, potentially vacuous redefinition of "costs." Julian correctly shows the theorem's formal consistency and flexibility *if* we allow broad, foreseen modifications to the ex ante utility function, but this flexibility undermines the theorem's power to make the strong normative claim he asserted in (1). Good's theorem is a powerful result within its specific, narrow framework of instrumental rationality with stable preferences and perfect updating, but it does not establish that there can *never* be a distinctively epistemic (or existential) reason for ignorance beyond external costs or anticipated irrationality.

  **The one thing to tell the room:** **Good's theorem proves the value of information *within a fixed evaluative framework*. It cannot settle whether there is value in *preserving the framework itself* from disruption by information.** That is the space where norms of ignorance might reside.
