  - Then, Round2: Alice, having seen Bob's first number, updates and writes her second credence, passes to Bob.
       Bob, having seen Alice's second number, updates and writes his second credence, passes to Alice.
  - Continue for up to 6 rounds each, but stop if they converge (same number twice in a row) or earlier if they wish.

  - The auditor sees the first two announcements (Alice's first and Bob's first) and then writes down her own credence and her prediction of the convergence number.

