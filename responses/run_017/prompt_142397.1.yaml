  **2. The protocol**

  - Students work in threes: Alice, Bob, and an auditor.
  - Facilitator draws a state (or rather, decides which coin is biased and the outcomes) according to the prior, and gives the signal to Alice (outcome of coin1) and to Bob (outcome of coin2).
  - The two opening announcements: 
       Round1: Alice writes her first credence (based only on her signal) on a sheet, passes to Bob.
