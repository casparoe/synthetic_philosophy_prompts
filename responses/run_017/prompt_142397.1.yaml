  **5. Scoring, timing, and materials.**

  Scoring: use a proper scoring rule, for example, the quadratic scoring rule. For a credence p in event E, and if E is true, score = 1 - (1-p)^2; if false, score = 1 - p^2. Or to make it points: multiply by 100.

  But since no real money, we can do that.

