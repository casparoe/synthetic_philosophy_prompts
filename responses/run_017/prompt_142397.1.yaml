  ### Activity Design: Discovering Aumann's Agreement Theorem

  #### **1. The Construction**
  **Concrete Story**:  
  A factory has two machines (A and B) producing widgets. Machine A is faulty and produces 30% defective widgets, while Machine B is reliable and produces only 5% defective widgets. The factory ships two widgets, but the labelling is mixed: one widget is from A and one from B, but we don't know which is which. The event in question (E) is "both widgets are defective". Each inspector (Alice and Bob) examines one widget privately, not knowing which machine produced it.  

  **Abstract Setup**:  
  - **State space**: 8 states, defined by:  
    - Which widget is from A (widget 1 or 2).  
    - Defect status of widget from A (defective or functional).  
    - Defect status of widget from B (defective or functional).  
    States are labelled as tuples: (Machine of widget 1, Status of widget 1, Status of widget 2). For example:  
    - (A, D, D): widget 1 from A (defective), widget 2 from B (defective).  
    - Full state list:  
      `S1: (A, D, D)  S2: (A, D, F)  S3: (A, F, D)  S4: (A, F, F)`  
      `S5: (B, D, D)  S6: (B, D, F)  S7: (B, F, D)  S8: (B, F, F)`  

  - **Event E**: "Both widgets defective" (true in S1 and S5).  

  - **Common prior**:  
    - Probability widget 1 is from A: 0.6.  
    - If widget is from A: P(defective) = 0.3, P(functional) = 0.7.  
    - If widget is from B: P(defective) = 0.05, P(functional) = 0.95.  
    - Prior probabilities:  
      `P(S1) = 0.6 × 0.3 × 0.05 = 0.009`  
      `P(S2) = 0.6 × 0.3 × 0.95 = 0.171`  
      `P(S3) = 0.6 × 0.7 × 0.05 = 0.021`  
      `P(S4) = 0.6 × 0.7 × 0.95 = 0.399`  
      `P(S5) = 0.4 × 0.05 × 0.3 = 0.006`  
      `P(S6) = 0.4 × 0.05 × 0.7 = 0.014`  
      `P(S7) = 0.4 × 0.95 × 0.3 = 0.114`  
      `P(S8) = 0.4 × 0.95 × 0.7 = 0.266`  
    (Sum = 1.0, verified.)  

  - **Partitions**:  
    - Alice inspects widget 1; partition based on its status:  
      - Defective: {S1, S2, S5, S6}  
      - Functional: {S3, S4, S7, S8}  
    - Bob inspects widget 2; partition based on its status:  
      - Defective: {S1, S3, S5, S7}  
      - Functional: {S2, S4, S6, S8}  

  - **Invertibility Verification**:  
    - Alice’s posterior for E:  
      - If widget 1 defective: P(E | {S1,S2,S5,S6}) = P(S1) + P(S5) / P(set) = (0.009 + 0.006) / (0.009+0.171+0.006+0.014) = 0.015 / 0.2 = 0.075  
      - If widget 1 functional: P(E | {S3,S4,S7,S8}) = P(S3) + P(S7) / P(set) = (0.021 + 0.114) / (0.021+0.399+0.114+0.266) = 0.135 / 0.8 = 0.16875  
    - Bob’s posterior for E:  
      - If widget 2 defective: P(E | {S1,S3,S5,S7}) = P(S1) + P(S5) / P(set) = (0.009 + 0.006) / (0.009+0.021+0.006+0.114) = 0.015 / 0.15 = 0.1  
      - If widget 2 functional: P(E | {S2,S4,S6,S8}) = P(S2) + P(S6) / P(set) = (0.171 + 0.014) / (0.171+0.399+0.014+0.266) = 0.185 / 0.85 ≈ 0.2176  
    - Posteriors are distinct: (0.075, 0.16875) for Alice, (0.1, 0.2176) for Bob. Thus, each number pins down the information set.  
    - **Depth**: In state S2 (A, D, F):  
      - Alice (sees defective): credence 0.075.  
      - Bob (sees functional): credence 0.2176.  
      - After 4+ announcements, they converge to 0.0 (see protocol).  

  #### **2. The Protocol**
  - **Setup**: Groups of three: Alice, Bob, Auditor. Facilitator draws a state secretly, gives signals to Alice (widget 1 status) and Bob (widget 2 status).  
  - **Announcements**:  
    - **Alternating and sequential**: Alice announces first, Bob second, Alice third, etc.  
    - **Rules**:  
      - Each announcement is a single number (credence in E), written on a shared sheet.  
      - No words, gestures, or evidence descriptions.  
      - Hard cap: 6 announcements per principal.  
    - **Procedure**:  
      1. Alice computes initial credence (from private signal), writes it, passes to Bob.  
      2. Bob computes initial credence (from private signal and Alice’s announcement), writes it, passes to Alice.  
      3. Alice updates (using Bob’s announcement), writes new credence, passes to Bob.  
      4. Repeat until convergence (same number twice) or cap reached.  
  - **Why Alternating?**: Simultaneous announcements do not guarantee convergence (they may not induce common knowledge). Alternating public announcements ensure convergence in finite steps (Geanakoplos & Polemarchakis, 1982). The activity will show that sequentiality is crucial.  

  #### **3. The Auditor's Role**
  - **Task**: After the first two announcements (Alice’s first, Bob’s first), the Auditor:  
    1. Computes her own credence for E (using no signal).  
    2. Predicts the convergence number.  
  - **Mechanics**:  
    - The first two numbers identify Alice’s and Bob’s initial information sets (e.g., Alice’s 0.075 ⇒ widget 1 defective; Bob’s 0.2176 ⇒ widget 2 functional).  
    - The intersection of these sets (e.g., {S1,S2,S5,S6} ∩ {S2,S4,S6,S8} = {S2,S6}) is a union of cells in the meet partition.  
    - The meet partition cell (e.g., {S2,S6}) is common knowledge.  
    - Auditor’s credence = P(E | cell) = 0.0 (since neither S2 nor S6 has both defective).  
  - **Conjecture Check**: Yes, the Auditor computes the convergence number exactly (here, 0.0). Reveal: At the end, the Auditor’s prediction is compared to the principals’ convergence number.  

  #### **4. Second Round: Removing Common Knowledge of Partitions**
  - **Setup**: Same prior and event, but now:  
    - Alice knows her partition (widget 1 status) but only knows Bob partitions "by widget 2’s status or something else" (deliberately vague).  
    - Bob knows his partition but has the same vague knowledge of Alice’s.  
  - **Protocol**: Identical to Round 1.  
  - **Predicted Stall**:  
    - In state S2 (A, D, F):  
      - Alice (widget 1 defective) starts at 0.075.  
      - Bob (widget 2 functional) cannot interpret Alice’s number (since he doesn’t know her partition), so his first announcement remains 0.2176.  
      - Alice cannot interpret Bob’s number (vague partition), so she re-announces 0.075.  
      - Cycle continues; no convergence.  
  - **Reveal**: The stall occurs because partitions are not commonly known, not because of irrationality or stubbornness.  

  #### **5. Scoring, Timing, and Materials**
  - **Scoring**:  
    - **Quadratic scoring rule** (proper): For credence \( p \), if E true: score = \( 100 \times [1 - (1-p)^2] \); if E false: score = \( 100 \times [1 - p^2] \).  
    - **Who is scored**:  
      - Principals: Final announcement against actual E (true/false).  
      - Auditor: (1) Her credence against E; (2) Prediction against convergence number (absolute error loss, scaled).  
    - **Prizes**: Trivial token (e.g., "Epistemic Champion" badge) for highest group score.  
  - **Timing (90 min)**:  
    - 0-10 min: Introduction, group formation, hand out materials.  
    - 10-25 min: Round 1 explanation and activity (state draw, signals, 4+ announcements).  
    - 25-35 min: Auditor predictions and interim discussion.  
    - 35-50 min: Round 2 explanation and activity (same, but partitions vague).  
    - 50-60 min: Facilitator collects credences, reveals true state and E for scoring.  
    - 60-80 min: Debrief (link to theorem, assumptions).  
    - 80-90 min: Scoring, prize, Q&A.  
  - **Materials to Print**:  
    - **Handout 1 (Round 1)**: State space table, prior, event E, partitions, protocol, scoring rules.  
    - **Handout 2 (Round 2)**: Same state space, prior, event; modified partitions instruction ("partitions private and coarsely described").  
    - **Shared sheet** for announcements (columns: Round, Alice, Bob).  
    - **Auditor worksheet**: Space for initial credence and convergence prediction.  

  #### **6. Debrief, Failure Modes, and Limits**
  - **Debrief Mapping**:  
    - **Activity Moments → Theorem**:  
      - Round 1 convergence → Common prior + common knowledge of partitions + public announcements ⇒ agreement.  
      - Auditor’s exact prediction → Meet partition cell determines common posterior.  
      - Round 2 stall → Lack of common knowledge of partitions (assumption violated).  
    - **Key Student Takeaway**: "Two honest, competent people with the same prior can only persistently disagree if they lack common knowledge about how each other's information is structured—not merely because their evidence differs or they are stubborn. If priors differ, or partitions aren’t commonly known, agreement isn’t guaranteed."  
  - **Failure Modes**:  
    - **Complex calculations**: Students may struggle with Bayesian updates. *Mitigation*: Provide a calculator and simplified posterior tables (e.g., "If Alice sees defective: 0.075").  
    - **Slow groups**: Announcement cap (6) may bind. *Mitigation*: Treat as data (e.g., "Cap reached, no convergence").  
    - **Misunderstanding partitions**: In Round 2, students may assume they know more. *Mitigation*: Emphasize vagueness: "You only know Bob partitions by widget 2 or something else; you don’t know how."  
    - **Auditor errors**: May miscompute meet cell. *Mitigation*: Offer a flowchart ("First number → Alice’s info set; second number → Bob’s updated set").  
  - **Limits of Activity**:  
    - Cannot show infinite state spaces or continuous cases.  
    - Does not cover non-partitional knowledge (e.g., unawareness).  
    - Assumes rational updates (students may deviate); debrief must reinforce "ideal agent" framing.  
    - Convergence proof and measure-theoretic nuances must be supplied in debrief.  

  **Final Note**: The activity creates an "aha!" moment by having students *experience* the theorem. In debrief, name "Aumann’s agreement theorem" and formalise it: "With common priors and common knowledge of partitions, public announcements of posteriors lead to agreement." Highlight that the auditor’s role encapsulates the sufficiency of public credences.
