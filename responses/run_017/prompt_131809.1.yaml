answer: |-
  Here's a five-line joke meeting your specifications, drawing on the core concepts of *On Certainty* and your "doorstop" terminology:

  1.  Mr. Davies pointed to the shattered gym window and asked Ethan how his baseball ended up inside.
  2.  Ethan declared, "My claim 'I was elsewhere' is a hinge proposition! Like Moore's hands, it stands fast—doubt needs *it* to function. You can't ask for evidence!"
  3.  Mr. Davies sighed, "Wittgenstein's hinges are *background* certainties – like 'this is a window', or 'balls break glass' – things *manifest* in our actions, never asserted."
  4.  "They aren't personal alibis you *choose*; they're what *lets* investigation turn, like asking *why* this ball broke *this* window *now*."
  5.  "Son, confusing a hinge with something you wedge under doubt to jam it? That's not epistemology; that's just a **doorstop proposition** – and a badly retro-fitted one."

  **Why it works (for your audience):**

  *   **Substance Over Puns:** Relies entirely on core *On Certainty* ideas: hinges as ungrounded background (line 3), manifested in action/world-picture (line 3), enabling doubt/inquiry (line 4), contrasted with Moore (line 2).
  *   **Student's Mistake:** Ethan explicitly tries to assert a personal, contingent claim ("I was elsewhere") as a foundational hinge exempting him from justification (line 2).
  *   **Teacher's Correction:** Precisely dismantles the misuse:
      *   Hinges are *background* ("window," "balls break glass"), not personal claims (line 3).
      *   They are *manifest in action*, not asserted (line 3).
      *   They *enable* questioning ("lets investigation turn," "asking why..."), not halt it (line 4).
  *   **Punchline (Line 5 - Doorstop Proposition):**
      *   Clearly defines the student's move: "wedg[ing] under doubt to jam it."
      *   1:1 contrast with hinge function ("*lets* investigation turn" vs. "jam it").
      *   Uses "retro-fitted" aptly ("badly retro-fitted one") implying the excuse was hastily constructed *after* the fact to try and bear weight.
      *   Humor comes from the precise inversion: the student used a "hinge" *to stop* the door (of inquiry) moving, making it functionally a doorstop, fundamentally misunderstanding Wittgenstein's metaphor.
  *   **Accessibility:** Works for readers familiar only with Moore (referenced directly in line 2). The core contrast (enabling vs. jamming inquiry) is clear even without deep *OC* knowledge, but lands best with it.
  *   **Wryness:** The teacher's weary "Son," the specific examples ("balls break glass"), and the diagnosis of the "retro-fit" capture the irony of the student's blunder for those in the know.
