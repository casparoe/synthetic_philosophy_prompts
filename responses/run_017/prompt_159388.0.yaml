  Okay, let me start by unpacking the user's query. They're a science and ideas journalist who's observed recurring institutional conflicts where the core disagreement isn't about facts or interests, but about which moral framework should guide decisions. They describe two key issues: non-neutral option menus and non-neutral weighting scales. The examples given—foundation grants, ethics committees, university funding—all show that standard aggregation methods fail because they presuppose contested elements. 

  First, I need to identify if there's an existing term for this phenomenon. The user has already considered and dismissed terms like incommensurability, value pluralism, hedging, etc. Their examples highlight how compromise options are rejected by one framework entirely (e.g., splitting funds seen as betrayal), and weighting becomes arbitrary when scales are incompatible (e.g., 5% weight swinging decisions due to scale artifacts). 

  The wrinkle they emphasize is meta-disagreement: frameworks also disagree on how to resolve such disputes, making the choice of procedure itself contentious. This recursive problem isn't captured by existing labels they've encountered. 

  I recall that political philosophy touches on similar concepts. Rawls's overlapping consensus and MacIntyre's incommensurability come to mind, but they don't fully fit. The "problem of the frame" in decision theory is close but not identical. Agonistic pluralism in political theory addresses deep conflicts but doesn't focus on aggregation mechanics. 

  Perhaps the closest fit is Seung and Bonevac's "deep compromise" versus "shallow compromise." Shallow compromises assume shared metrics, while deep ones acknowledge incompatible frameworks without common scale. The user's cases are deep compromises where aggregation fails. 

  For a name, "Moral Framework Incommensurability" or "Procedural Non-Neutrality" might work. The latter emphasizes how decision procedures aren't neutral tools but contested elements themselves. 

  On procedures immune to the problem, unanimous direct agreement seems the only escape hatch. The user's embryonic idea—options acceptable across all frameworks and scales—resembles modal logic's "robustness." This could be framed as "robustness under moral uncertainty," though it might yield few viable options. 

  Boundary cases: a purely technical decision with no moral dimensions would avoid this, but real-world cases often involve implicit frameworks. A case with shared metrics (e.g., cost-benefit analysis with agreed-upon units) would be unproblematic. 

  Finally, the user's deeper need might be to provide readers not just a label but a way to recognize and navigate such conflicts. Highlighting the inevitability of procedural bias and the scarcity of robust solutions could offer clarity, even if it's sobering.
answer: |-
  This phenomenon is both well-identified and notoriously difficult to resolve. You've articulated its core precisely: **the impossibility of neutral aggregation when moral frameworks fundamentally disagree not just on *outcomes*, but on the *structure* of the decision itself (option space, weighting scales, and even the procedure for resolving disagreement).**

  ### The Established Concept & Literature
  1.  **The Core Phenomenon: "Deep Disagreement" or "Metalinguistic Negotiation"/"Conceptual Ethics":**
      *   **Core:** The conflict isn't *within* a shared moral language or framework about how to weigh values, but *about* which moral language/framework to use. Disagreement occurs at the level of concepts, categories, and the very rules for evaluation and decision-making.
      *   **Nearest Neighbors:**
          *   **Value Incommensurability/Incomparability:** (Raz, Chang) - Values cannot be measured on a common scale. Your case is a *stronger* version where the *frameworks defining the values and options* are incommensurable.
          *   **Moral Pluralism:** (Berlin, Nagel, Williams) - Recognition of multiple irreducible moral values/sources. Your focus is on *conflicting systems* built upon pluralism.
          *   **The Problem of the Frame:** (Decision Theory, Social Choice) - How the set of options is defined critically shapes the outcome. You highlight how frameworks *disagree on the frame itself*.
          *   **Agonistic Pluralism:** (Mouffe, Laclau - Political Theory) - Politics involves fundamental, irresolvable conflicts over the very nature of the "good." Your examples are institutional agonism.
          *   **Conflicting Conceptions of the Good:** (Rawls) - The challenge of liberalism when citizens hold incompatible comprehensive doctrines. Your cases occur *within* institutions trying to function.
      *   **Where it Stops:** Aggregation *is* unproblematic when:
          *   **Shared Framework Exists:** All parties accept the same fundamental moral concepts, categories, and scales (e.g., maximizing QALYs within health economics, using cost-benefit with agreed-upon monetary valuations).
          *   **Purely Technical Uncertainty:** Disagreement is solely about empirical probabilities or causal mechanisms, resolvable by evidence, *and* all parties agree on the moral framework to apply once facts are known.
          *   **Shared Priority Rule:** Frameworks agree on a meta-rule for breaking ties or allocating resources in conflict (e.g., "worst-off first," "greatest number," "procedural fairness"), even if they disagree on why that rule is good.

  2.  **The Specific Name:** While there isn't one universally accepted term, the most precise fit for *your description* is:
      *   **The Impossibility of Neutral Aggregation Under Fundamentally Conflicting Moral Frameworks.**
      *   **Deep Compromise Failure:** (Contrasted with "Shallow Compromise" where frameworks share metrics). Philosophers like T.M. Scanlon ("Moral Dimensions") and legal theorists like Cass Sunstein often touch on this, but the *systematic analysis* of the non-neutrality of both options *and* scales within institutional decision-making is less codified under a single name. Seung and Bonevac ("Plural Values and Indeterminate Rankings") discuss "deep" vs. "shallow" conflicts in ways resonant with your cases.

  ### Why Your Offered Labels Didn't Fit
  *   **Incommensurability/Value Pluralism:** Correctly seen as components *within* frameworks, not the framework conflict itself.
  *   **Hedging/Splitting Difference:** Assume a pre-agreed option space and scale.
  *   **Precautionary Principle/Burden of Proof:** Deal with uncertainty *within* a framework (how much weight to give a possibility), not the framework *choice*.
  *   **Aversion to Unspecified Probabilities:** Pure empirical uncertainty, not moral/conceptual conflict.

  ### Boundary Cases
  *   **Looks Like Yours But Isn't (Neutral Aggregation Works):** A university committee allocates lab space. Frameworks: "Maximize Current Output" (grants/publications) vs. "Maximize Long-Term Potential" (risky/novel work). **BUT:** Both agree on the metric (e.g., "scientific impact points" projected over 10 yrs), the options (assigning specific spaces to specific PIs), and the aggregation rule (weighted average). The conflict is *within* the shared framework of valuing scientific impact.
  *   **Genuinely Neutral Framing:** Choosing between two suppliers for a standardized chemical, based solely on price and delivery time agreed as the *only* relevant factors. The option space (Supplier A, Supplier B) and the scale (dollars, days) are uncontested.

  ### Procedures Immune to the Problem?
  **There are no procedures *immune*, but some are *robust* or *transparent* about the non-neutrality:**
  1.  **Unanimous Direct Agreement:** If everyone genuinely agrees on an option *for their own framework's reasons*, it works. This is rare in deep conflicts.
  2.  **Procedural Fairness:** Focus on *how* the decision is made rather than the outcome (e.g., fair representation, deliberation, voting rules). This avoids aggregating *substantive* judgments but doesn't solve the substantive conflict. It *is* itself a framework choice ("fair procedure is paramount").
  3.  **Robustness (Your Embryonic Idea - This Has Traction!):**
      *   **Core Idea:** Seek options that are *acceptable* (or at least *not forbidden*) from the perspective of *every* salient framework, under *any* plausible weighting/scaling method admissible within those frameworks. It's the intersection of permissible options across frameworks/scales.
      *   **Names & Development:**
          *   **Parfitian Convergence/Harmony:** (Derek Parfit) - Different frameworks converge on the same action for different reasons. Seeking actions that *all* frameworks can endorse (or at least not veto).
          *   **Robustness Analysis under Moral Uncertainty:** (MacAskill, Bykvist, Ord - Effective Altruism adjacent) - Explicitly models the existence of multiple plausible moral theories and seeks options that perform reasonably well across a *range* of theories and weightings. This directly addresses your scaling problem. Key texts: Will MacAskill's "Moral Uncertainty," Nick Beckstead's thesis on "High Stakes, Institutional Decisions."
          *   **Satisficing under Deep Disagreement:** Seeking options that are "good enough" by each framework's *minimum* standards, rather than trying to maximize an aggregate.
      *   **How Much Does it Leave Unsettled?** **A Lot, but it narrows the field.** It ruthlessly eliminates:
          *   Options ruled out as impermissible by any framework (e.g., the foundation *cannot* spend *nothing* on the present or *nothing* on the future; the committee *cannot* completely ignore the novel class of beings *if* that framework is given any weight at all).
          *   Options critically dependent on specific, contested weightings or scalings (e.g., an option that looks best only if you convert "future risk reduction" into "equivalent current lives saved" at a specific, arbitrary exchange rate).
      *   **What Remains?** Options that are permissible (or minimally acceptable) according to *all* frameworks. In the foundation case: *Some* allocation to present *and* future is required; perhaps specific *types* of interventions are permissible under both frameworks. In the committee case: Funding *some* work that doesn't harm the novel beings, or incorporating *some* monitoring for potential impact on them. It often leads to "least worst" or "common ground" solutions that avoid the deepest violations but may not satisfy anyone's ideal.

  ### Conclusion
  The phenomenon is **Procedural Non-Neutrality in Deep Moral Framework Disagreement**. Its core is the **irreducible contestation over the decision's fundamental structure** (options, scales, aggregation method). The literature exists, scattered across moral/political philosophy, decision theory, and institutional analysis, but lacks a single dominant label. **Robustness Analysis under Moral Uncertainty** is the most promising formalized approach for finding defensible recommendations under these conditions, explicitly tackling the scaling problem and demanding options survive across plausible framings. It won't find "best" solutions, but it can identify options that avoid the most egregious failures from any perspective. For your journalism, highlighting this "robustness" concept and the inherent non-neutrality of procedures could provide valuable clarity on why these institutional conflicts are so intractable.
