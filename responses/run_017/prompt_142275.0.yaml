  uB''(x)=(uB(x)-1000)/2000

  Person C:
  denominator=2050-2000=50
  uC''(x)=(uC(x)-2000)/50

  Now, compute at the allocation points:

  We want to maximize the sum of u''.

  Let's compute the table for x=0,100,...,1000 for u'':

  Person A:
  x=0:0
  x=100: (1500-500)/3162≈1000/3162≈0.316
  x=200: (1914-500)/3162=1414/3162≈0.447
  x=300:2232-500=1732/3162≈0.548
  x=400:2000/3162≈0.632
  x=500:2236/3162≈0.707
  x=600:2449/3162≈0.774
  x=700:2646/3162≈0.837
  x=800:2828/3162≈0.894
  x=900:3000/3162≈0.949
  x=1000:3162/3162=1

  Person B:
  x=0:0
  x=100: (1200-1000)/2000=200/2000=0.1
  x=200:400/2000=0.2
  x=300:600/2000=0.3
  x=400:800/2000=0.4
  x=500:1000/2000=0.5
  x=600:1200/2000=0.6
  x=700:1400/2000=0.7
  x=800:1600/2000=0.8
  x=900:1800/2000=0.9
  x=1000:2000/2000=1

  Person C:
  x=0:0
  x=100: (2005-2000)/50=5/50=0.1
  x=200:10/50=0.2
  x=300:15/50=0.3
  x=400:20/50=0.4
  x=500:25/50=0.5
  x=600:30/50=0.6
  x=700:35/50=0.7
  x=800:40/50=0.8
  x=900:45/50=0.9
  x=1000:50/50=1

  Now, we want to maximize the sum of u''(100*xA) + u''(100*xB) + u''(100*xC).

  Note that each u'' is 0 at $0 and 1 at $1000. And they are linear? No, only for B and C? A is not linear.

  But we can compute:

  Try xA=6, xB=4, xC=0:
  uA''(600)≈0.774, uB''(400)=0.4, uC''(0)=0 -> total=1.174

  Try xA=0, xB=10, xC=0: uB''(1000)=1 -> total=1
  Try xA=0, xB=0, xC=10: uC''(1000)=1 -> total=1
  Try xA=0, xB=5, xC=5: uB''(500)=0.5, uC''(500)=0.5 -> total=1

  But try giving more to A: 
  xA=10, xB=0, xC=0: uA''(1000)=1 -> total=1

  But our previous allocation (xA=6, xB=4, xC=0) gives 1.174, which is better than 1.

  Is there a better allocation? Let me try:

  We can try to maximize:

  Note that for each person, the utility increases with money. But we have diminishing returns for A.

  Try xA=7, xB=3, xC=0:
  uA''(700)≈0.837, uB''(300)=0.3 -> total=1.137 -> less than 1.174

  xA=5, xB=5, xC=0:
  uA''(500)≈0.707, uB''(500)=0.5 -> total=1.207 -> better than 1.174

  xA=4, xB=6, xC=0:
  uA''(400)=0.632, uB''(600)=0.6 -> total=1.232

  xA=3, xB=7, xC=0:
  uA''(300)=0.548, uB''(700)=0.7 -> total=1.248

  xA=2, xB=8, xC=0:
  uA''(200)=0.447, uB''(800)=0.8 -> total=1.247

  So maximum around xA=3, xB=7, xC=0.

  But note: in the original scale, we had xA=6, xB=4, xC=0. Now under Rule B, we have xA=3, xB=7, xC=0. And under Rule A, we had xA=0, xB=10, xC=0.

  So indeed, the allocation changes with the normalization.

  Now, we want to show that under one rule the sum rule mimics priority to the worse off? In the original scale, we gave a lot to A (the poor) and some to B. Under Rule A, we gave nothing to A. Under Rule B, we gave something to A but less than in the original.

  But the key is that the same sum rule leads to different allocations.

  Now, for the fourth person, Person D: every outcome is equally middling. We can set:

  Person D: uD(x) = 1000 for every x.

  Then in any normalization? 

  Under Rule A: 
  uD(0)=1000, uD(100)=1000, so gain=0 -> problem: division by zero.

  Similarly, under Rule B: uD(1000)=1000, uD(0)=1000, so denominator=0.

  So we have to handle this. The point is that if a person has constant utility, we cannot define a unit. So we have to decide: do we set the entire utility to zero? But then they get nothing. Or do we set it to a constant? The activity can highlight that such a person cannot be compared.

  Activity Timeline:

  Total: 80 minutes.

  1. (5 min) Introduction: Explain the activity. We have a fixed budget of $1000 to allocate to three individuals. We know their utility functions over money (given in a table). The goal is to maximize the sum of utilities. Form groups of 3-4 students.

  2. (15 min) Task 1: Groups allocate the $1000 (in $100 increments) to maximize the sum of the given utilities. They report the allocation and the total utility.

  3. (10 min) Introduce the problem of scales. Now, we need to set a common scale by choosing a zero point and a unit. Present two rules:

  Rule A (Common Baseline): 
     - Zero: utility at $0.
     - Unit: the utility difference between $0 and $100.

  Rule B (Min-Max in Choice Set):
     - Zero: utility at $0.
     - Unit: the utility difference between $0 and $1000.

  But wait, in Rule A we defined the unit by $0 to $100, and in Rule B by $0 to $1000. Alternatively, we can call:

  Rule 1: Unit defined by a fixed small gain ($100).
  Rule 2: Unit defined by the entire range ($0 to $1000).

  But note: in Rule B we set the entire range to 1.

  Now, groups are told that they will apply both rules to the same utility numbers and redo the allocation.

  4. (15 min) Task 2: Apply Rule A. Groups recompute the utilities using Rule A (they get a new table). Then allocate the $1000 again to maximize the sum. Report allocation.

  5. (15 min) Task 3: Apply Rule B. Groups recompute the utilities using Rule B. Then allocate again. Report allocation.

  6. (10 min) Introduce Person D. Give them the card for Person D: constant utility. Ask: How would you include this person? What happens when you apply Rule A and Rule B? (They will see the division by zero.)

  7. (10 min) Debrief: Instructor-led discussion. Map to concepts:
     - Task 1: They made interpersonal comparisons with arbitrary scales. This assumes full comparability.
     - Rules A and B: These are two ways to set the origin and unit. Rule A uses a local (small) interval to define the unit, which is sensitive to the marginal utility at low levels. Rule B uses the global range, which depends on the entire function.
     - The difference in allocations shows that the choice of anchor and unit matters. In particular, the same sum rule can lead to different allocations, and under one rule it might give priority to the worse off (like in the original) and under another it might not.
     - Person D: Highlights that without variation, we cannot define a unit. And if we force, we get division by zero. So we need some variability to make comparisons.

  Concepts:
     - Intrapersonal cardinality: We have cardinal utility for each person, but that alone does not allow interpersonal comparisons.
     - Interpersonal comparability: Requires setting a common zero and common unit.
     - Level comparisons: Setting the zero point (e.g., utility at $0) allows level comparisons (e.g., who is better off at the baseline).
     - Unit comparisons: Setting the unit (e.g., how much utility gain per $100) allows comparing changes.

  The hidden moral choice is in the anchor.

  What the activity cannot show:
     - Whether there is a privileged scale (e.g., based on happiness units).
     - The axiomatic foundations (e.g., Harsanyi’s theorem, which assumes full comparability).
     - Other approaches (e.g., veil of ignorance, which avoids direct comparisons).

  Predictable problems:
     - Someone might suggest "just ask them to rate their happiness from 1 to 10". This is a common scale, but note: the zero and unit are fixed arbitrarily (0 to 10). But we can discuss: why 10? And what if one person uses the whole scale and another doesn't? (This is the same problem.)
     - Someone might refuse to compare at all. We can acknowledge that this is a valid position (e.g., ordinalism) but the activity is to show what happens if we do try to compare.

  Handout Content:

  Page 1: Instructions for the activity.

  Page 2: Table for Persons A, B, C (utilities at $0, $100, ..., $1000).

  Person A:
  $0: 500
  $100: 1500
  $200: 1914
  $300: 2232
  $400: 2500
  $500: 2736
  $600: 2949
  $700: 3146
  $800: 3328
  $900: 3500
  $1000: 3662

  Person B:
  $0: 1000
  $100: 1200
  $200: 1400
  $300: 1600
  $400: 1800
  $500: 2000
  $600: 2200
  $700: 2400
  $800: 2600
  $900: 2800
  $1000: 3000

  Person C:
  $0: 2000
  $100: 2005
  $200: 2010
  $300: 2015
  $400: 2020
  $500: 2025
  $600: 2030
  $700: 2035
  $800: 2040
  $900: 2045
  $1000: 2050

  Page 3: Rules for the allocation task.

  Task 1: Allocate the $1000 (in increments of $100) to Persons A, B, and C to maximize the sum of their utilities. You must allocate all the money. Report the allocation (how much to A, B, C) and the total utility.

  Task 2: Rule A - Common Baseline:
  - For each person, set the utility at $0 to 0.
  - Define one unit of utility as the difference in utility between $0 and $100.
  - Recalculate the utility at each money amount as: 
     New utility = (Original utility - Utility at $0) / (Utility at $100 - Utility at $0)
  - Then allocate the $1000 to maximize the sum of these new utilities.

  Task 3: Rule B - Min-Max in Choice Set:
  - For each person, set the utility at $0 to 0.
  - Set the utility at $1000 to 1.
  - Recalculate the utility at each money amount as:
     New utility = (Original utility - Utility at $0) / (Utility at $1000 - Utility at $0)
  - Then allocate the $1000 to maximize the sum of these new utilities.

  Page 4: Person D card (to be handed out later):
  Person D: 
  Every outcome is equally good: 
  Utility at any amount: 1000

  Then, when applying Rule A and Rule B, you will encounter division by zero. How should we include Person D?

  Group Roles:
  - Facilitator: keeps time and makes sure everyone is heard.
  - Calculator: does the computations.
  - Recorder: writes down the allocations and reasoning.
  - Reporter: reports to the class.

  Timeline with minutes:

  - 0-5 min: Introduction and group formation (groups of 3-4).
  - 5-20 min: Task 1 (15 min for groups to work, then quick report from one group).
  - 20-30 min: Introduce scaling and Rules A and B. (10 min)
  - 30-45 min: Task 2 - Rule A (15 min work, then quick report).
  - 45-60 min: Task 3 - Rule B (15 min work, then quick report).
  - 60-70 min: Introduce Person D and discuss. (10 min)
  - 70-80 min: Debrief by instructor.

  Bottom line: This activity makes students experience how the choice of utility anchor and unit—seemingly technical decisions—embed ethical judgments that determine who benefits in welfare allocations.
answer: |-
  ### Welfare Economics Seminar Activity: The Hidden Ethics of Utility Scaling  
  **Objective:** To reveal how interpersonal utility comparisons implicitly embed ethical choices via the selection of a utility anchor (zero point) and unit, thereby determining who benefits in welfare allocations.  

  **Key Concepts Illustrated:**  
  - Intrapersonal cardinality vs. interpersonal comparability  
  - Level comparisons (zero point) vs. unit comparisons (scale)  
  - How the same "sum utilities" rule can mimic or contradict "priority to the worse off" under different anchors  
  - The impossibility of comparing individuals with invariant utility (Person D)  

  **Materials:**  
  - **Handout 1:** Utility tables for Persons A, B, and C (identical for all groups).  
  - **Handout 2:** Person D card (distributed later).  
  - **Worksheets:** For recording allocations and rules.  
  - **Group Roles:** Facilitator (keeps time), Calculator (computes utilities), Recorder (writes decisions), Reporter (shares results).  

  ---

  ### Handout 1: Utility Tables for Persons A, B, and C  
  **Budget:** $1,000 to allocate in $100 increments (i.e., allocate 10 discrete $100 units).  
  **Instructions:** Use the tables below for Tasks 1–3. Utility values are cardinal and intrapersonally comparable but use arbitrary origins and units.  

  | Money | Person A | Person B | Person C |  
  |-------|----------|----------|----------|  
  | $0    | 500      | 1,000    | 2,000    |  
  | $100  | 1,500    | 1,200    | 2,005    |  
  | $200  | 1,914    | 1,400    | 2,010    |  
  | $300  | 2,232    | 1,600    | 2,015    |  
  | $400  | 2,500    | 1,800    | 2,020    |  
  | $500  | 2,736    | 2,000    | 2,025    |  
  | $600  | 2,949    | 2,200    | 2,030    |  
  | $700  | 3,146    | 2,400    | 2,035    |  
  | $800  | 3,328    | 2,600    | 2,040    |  
  | $900  | 3,500    | 2,800    | 2,045    |  
  | $1,000| 3,662    | 3,000    | 2,050    |  

  - **Person A:** Poor, high marginal utility at low incomes (diminishing returns).  
  - **Person B:** Middle-income, linear utility.  
  - **Person C:** Wealthy, low marginal utility.  

  ---

  ### Handout 2: Person D Card  
  **Distribute during Task 4 (minute 60):**  
  | Money | Person D |  
  |-------|----------|  
  | Any   | 1,000    |  
  **Description:** Person D reports every outcome as equally "middling." Their utility is invariant across all money amounts.  

  ---

  ### Activity Rules & Timeline (80 minutes total)  
  **Groups:** 3–4 students each (4 groups for 14 students).  

  1. **Task 1: Naive Sum Maximization** (15 minutes)  
     - **Goal:** Allocate $1,000 to maximize the sum of utilities using the raw numbers.  
     - **Instructions:**  
       - Decide how many $100 units go to A, B, and C (e.g., A:3, B:5, C:2).  
       - Report the allocation and total utility.  
     - **Purpose:** Students unknowingly accept arbitrary scales, assuming full comparability.  

  2. **Task 2: Rule-Commitment Allocation** (20 minutes)  
     - **Goal:** Commit to an anchoring rule, then re-allocate.  
     - **Instructions:**  
       1. **Commit to a rule in writing:** Choose one:  
          - **Rule A (Shared Baseline):** Set zero at $0 for all. Set one unit = utility gain from $0 to $100.  
          - **Rule B (Choice-Set Min-Max):** Set zero at $0 for all. Set one unit = utility gain from $0 to $1,000.  
       2. **Recalculate utilities:**  
          - For Rule A: New utility = \(\frac{\text{Original} - U($0)}{U($100) - U($0)}\)  
          - For Rule B: New utility = \(\frac{\text{Original} - U($0)}{U($1,000) - U($0)}\)  
       3. Re-allocate $1,000 to maximize the sum of *rescaled* utilities.  
     - **Purpose:** Forces explicit engagement with anchors. Rule A prioritizes marginal gains near $0 (mimicking "priority to worse off"); Rule B favors total gains (often favoring efficient allocators).  

  3. **Task 3: Anchor Conflict Case** (20 minutes)  
     - **Goal:** Allocate under a scenario where Rules A and B conflict.  
     - **Instructions:**  
       - Use the **same utility tables**, but now apply **both Rules A and B separately**.  
       - Allocate twice: once under Rule A, once under Rule B.  
       - Observe and record how allocations shift (e.g., Person A gets more under Rule A due to high marginal utility at $0).  
     - **Key Conflict:**  
       - Rule A: Person A’s high marginal utility near $0 is amplified.  
       - Rule B: Person B/C’s efficiency dominates.  
       - *Example allocation shift (from pilot runs):*  
         - Raw sum: A:$600, B:$400, C:$0 (prioritizes A).  
         - Rule A: A:$0, B:$1,000, C:$0 (efficiency dominates).  
         - Rule B: A:$300, B:$700, C:$0 (compromise, but A loses).  

  4. **Task 4: Person D** (10 minutes)  
     - **Goal:** Handle invariant utility.  
     - **Instructions:**  
       - Add Person D to the allocation.  
       - Apply Rules A and B to D’s utility (constant 1,000).  
       - Discuss: What happens? How would you include D?  
     - **Predictable Problem:** Rules A/B require division by zero (gain = 0). Forces debate on comparability.  

  5. **Debrief** (15 minutes)  
     - **Map Moments to Concepts:**  
       | Task | Concept |  
       |------|---------|  
       | 1 | Intrapersonal cardinality ≠ interpersonal comparability; naive sums "smuggle in" arbitrary scales. |  
       | 2 | Level comparisons (zero) vs. unit comparisons (scale); Rule A mimics priority to worse off. |  
       | 3 | Anchors hide ethical choices; the same sum rule can oppose or mimic priority rules. |  
       | 4 | Without variability, comparability fails; "1-10 happiness scales" inherit anchor problems. |  
     - **Limitations of the Activity:**  
       - Does not resolve if a "privileged scale" exists (e.g., hedonic units).  
       - Cannot show axiomatic foundations (e.g., Harsanyi’s theorem requires full comparability; Arrow’s impossibility avoids it).  
       - Post-activity lecture will cover: Bergson-Samuelson social welfare functions, the veil of ignorance, and ordinal approaches.  
     - **Predictable Student Reactions:**  
       - *"Just use 1-10 happiness scales!"* → Retort: "Who sets the zero? Is a ‘10’ the same for a pessimist and optimist?"  
       - *"Refuse to compare!"* → Acknowledge this as a valid ordinalist stance (e.g., Robbins), then discuss real-world policy trade-offs.  

  ---

  **Bottom line:** This activity makes students confront how seemingly technical choices of utility anchors embed ethical judgments that determine whose suffering or gain "counts more" in welfare economics.
