answer: |-
  ### 1. Rubric (marks allocated per task)  
  **Total: 25 marks**  
  **(a) Validity, missing premise, rejection choice (10 marks)**  
  - (1) Correctly identify the argument as invalid as stated (1 mark).  
  - (2) State the required agglomeration premise: "If S ought to do A and S ought to do B, then S ought to do (A and B)" (2 marks).  
  - (3) Identify that (1) "ought-implies-can" is the premise a defender must reject (2 marks).  
  - (4) Explain **why** rejecting (1) is less damaging: each act is individually possible (2 marks).  
  - (5) Justify rejecting (1) over (2) or (3): (2) defines the dilemma; (3) defines incompossibility (1 mark).  

  **(b) Distinction, rationality of regret (8 marks)**  
  - (1) Correctly deny both suggested consequences (1 mark).  
  - (2) Distinguish **overridden** (defeated, not required) vs. **unfulfilled** (persists unmet) requirements (3 marks).  
  - (3) Apply distinction to genuine dilemmas: B is unfulfilled, not overridden (2 marks).  
  - (4) Link unfulfilled requirement to rational regret (not guilt) (2 marks).  

  **(c) Assessment of verbal dispute charge (7 marks)**  
  - (1) Reject the critic’s definitional move: dispute is not verbal (1 mark).  
  - (2) Argue defender can stipulate a persisting "ought" (2 marks).  
  - (3) Identify substantive dispute: existence of two simultaneous unfulfillable requirements (3 marks).  
  - (4) Note irrelevance of uncertainty (1 mark).  

  ---

  ### 2. Marginal Comments (keyed to paragraphs)  
  **¶1**  
  *Claim:* "To generate a contradiction... principle of agglomeration... S ought to do A and B."  
  **Correct.** Agglomeration is the missing premise; this is precisely what validity requires.  

  **¶2**  
  *Claim:* "The defender’s position requires rejecting ought-implies-can."  
  **Correct.** Rejecting (1) is necessary and strategically sound.  

  **¶3**  
  *Claim:* "Each act is individually performable... defender can reject (1) as completely general while retaining it for single requirements."  
  **Imprecise but creditworthy.** Correct that acts are individually possible, but rejection of (1) *in dilemmas* is the point; no need to "retain" it elsewhere.  

  **¶4**  
  *Claim:* "Neither of the two consequences mentioned follows."  
  **Correct.** Directly answers (b)’s prompt.  

  **¶5**  
  *Claim:* Distinction: overridden (defeated) vs. unfulfilled (persists unmet).  
  **Correct.** Clear, textbook distinction.  
  *Claim:* "In a genuine dilemma... requirement to do B is... unfulfilled."  
  **Correct.** Faithful to the course’s dilemma definition.  

  **¶6**  
  *Claim:* "Residual regret is rational... regret rather than guilt."  
  **Correct.** Nicely distinguishes regret (unmet duty) from guilt (wrongdoing).  

  **¶7**  
  *Claim:* Both oughts are "prima facie requirements in Ross’s sense... case turns out to be weighing kind."  
  **Wrong and undermining.** Genuine dilemmas (per course) involve **all-things-considered (ATC) oughts**, not prima facie. This mischaracterization collapses the dilemma into resolvable conflict.  
  *Claim:* "Defender’s thesis reduces to... balance of reasons... indeterminate."  
  **Wrong.** Genuine dilemmas require ATC conflicts, not indeterminacy.  

  **¶8**  
  *Claim:* "Critic’s charge fails... defender can stipulate 'ought' to mean persisting requirement."  
  **Imprecise but creditworthy.** Correct that dispute isn’t verbal, but "stipulate" understates the defender’s substantive claim about moral reality.  
  *Claim:* "Debate is... substantive dispute about whether an agent can be under two such requirements."  
  **Correct.** Identifies core metaphysical disagreement.  

  **¶9**  
  *Claim:* "Nothing... turns on uncertainty... conflating the two makes literature look epistemic."  
  **Correct.** Explicitly separates epistemic from genuine dilemmas.  

  ---

  ### 3. Mark Allocation (25 total)  
  **(a) 7/10**  
  - +1: Identifies invalidity (¶1).  
  - +2: Names agglomeration (¶1).  
  - +2: Says reject (1) (¶2).  
  - +2: Explains why rejecting (1) is viable (¶3).  
  - -1: Omits explicit justification for rejecting (1) over (2)/(3) (implied but not stated in ¶2).  
  - -2: Does not fully justify rejecting (1) over (3): (3) is non-negotiable by definition.  

  **(b) 5/8**  
  - +1: Denies both consequences (¶4).  
  - +3: Distinction overridden vs. unfulfilled (¶5).  
  - +1: Correctly applies to dilemma (B unfulfilled) (¶5).  
  - +0: **No credit** for regret analysis (¶6): undermined by ¶7’s conflation.  
  - -3: ¶7 misidentifies oughts as prima facie, collapsing dilemma to resolvable conflict/indeterminacy. This voids the residue analysis.  

  **(c) 6/7**  
  - +1: Rejects verbal dispute (¶8).  
  - +2: Notes defender’s "ought" can denote persisting requirement (¶8).  
  - +3: Identifies substantive dispute (¶8).  
  - +0: **No credit** for ¶9’s irrelevance of uncertainty—already earned in (a) and not unique to (c).  

  **TOTAL: 18/25**  

  ---

  ### 4. Flaw Severity  
  - **¶7’s conflation of ATC with prima facie oughts** is **part-undermining for (b)**. It invalidates the account of regret/residue by redefining the dilemma.  
  - **Omission in (a)** (justifying rejection of (1) over (3)) is **local**; answer survives with minor deduction.  
  - **¶8** is slightly imprecise but **not damaging**; core argument stands.  
  - **No whole-answer flaw**, but (b) is critically compromised.  

  ---

  ### 5. Closing Sentence  
  To achieve full marks, the student must **eliminate ¶7’s claim that genuine dilemmas involve prima facie oughts** and instead maintain that they involve all-things-considered oughts (as per the course), and **explicitly justify rejecting (1) over (3)** in (a).
