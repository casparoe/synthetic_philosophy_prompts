prompt: |-
  Hi — hoping someone here has read more of this literature than I have. I keep running into the same shape of thing in writing about money in politics, and I want a word for it if there is one. But more than the word: I want to know whether what I'm looking at is one thing or three things stuck together, because I keep sliding between descriptions of it and I can't tell if I'm describing a real pattern or just getting annoyed at the same article over and over.

  Here's the pattern as I see it. Everyone agrees there's too much money in politics; a reform gets passed that closes off the channel the money is most visibly flowing through — hard money caps, party soft-money accounts shut down, a disclosure threshold tightened, a cooling-off period before a former official can lobby their old office. A couple of cycles later the money is somewhere else: an outside group that technically doesn't coordinate, a trade association that doesn't have to name its funders, a "strategic advisory" firm staffed by the same people who used to file lobbying registrations. Fine — money relocates, everyone says money is like water and finds an outlet.

  The bit I don't have a word for comes after. The reform gets scored by whether the original channel dried up. Registrations fall and reformers announce that disclosure worked; registrations climb back and opponents announce the reform was theater. The number is real and it really moved. Nobody is measuring the thing the reform was supposed to change — how much sway money actually buys, whose preferences the system tracks — because that's expensive and contested to measure, and both sides in the argument do better arguing about the cheap number. And as far as I can tell nobody is lying: the channel-level figure is accurate, it's just a figure for a different quantity than the one everyone is arguing about, and everyone knows that, and nobody has an incentive to be the person who says it out loud.

  Things I've been pointed at that don't seem to be it: regulatory arbitrage (usually about deliberately exploiting a gap between two rules, and here a lot of the relocation is just people doing their jobs under a new rule rather than hunting for a loophole), Goodhart's law (the measure isn't gamed — it's knowingly used as a stand-in, which isn't the same failure), the waterbed or balloon effect (right about the relocation, silent about the scoring), and the streetlight effect (too general, it's about where you look, not about why you keep looking there after you've been told). Maybe I'm dismissing one of those too fast, in which case say so and say why.

  My hunch, which I can't tell is deep or obvious: the two halves are one thing. You can only write a rule against a channel, because channels are the only part of this you can define in a statute — so every reform is scored against the channel it closed, and being scorable against that channel is what makes it look like it worked even when nothing much changed. The relocation isn't an unfortunate side effect of the reform; it's what you should predict from the fact that the reform had to be written against something nameable.

  So: does this have a name of its own? If it does, what's in it and what isn't? If it doesn't, give me one and define it tightly enough that it doesn't collapse into the four near-misses above, and tell me what would count as a genuine non-instance — a reform that actually changed how much money buys rather than where it flows — under your definition. Two cases I want handled separately, because I think they come apart: (a) a court decision reopens the channel rather than the industry finding a new one, and (b) a public financing scheme with small-donor matching, where the total goes up but the causal link between any one donor and any one outcome gets weaker. Is (b) the same phenomenon with a happy ending, or a different animal entirely? And be explicit about whether your concept needs anyone to intend the relocation, or whether it's purely structural.

  Don't send me a reading list or a pile of citations, I've got library access and I'll find those myself. I want the concept and its edges.
reasoning: |-
  Okay, the user is describing a pattern they've noticed in money-in-politics reforms where efforts to close one channel just shift the money elsewhere. Then, the success of the reform is judged by whether the original channel dried up, not by whether influence was actually reduced. They want a term for this phenomenon and to understand if it's a single concept or multiple pieces.

  The user mentioned several near-misses: regulatory arbitrage, Goodhart's law, waterbed effect, and streetlight effect. They feel these don't fully capture the issue. Their hunch is that the two parts—channel closure and misaligned scoring—are intrinsically linked because reforms can only target specific channels.

  First, I need to figure out if there's an existing term. From what I know, "displacement effect" or "hydraulic theory of money in politics" are sometimes used, but they focus on the relocation part, not the misaligned evaluation. The key issue here is the measurement problem where the metric (channel closure) doesn't reflect the actual goal (reducing undue influence).

  The user also has two specific cases: (a) when a court reopens the channel, and (b) public financing with small-donor matching. Case (a) is different because the channel reopening is external, not a relocation. Case (b) might be a structural change that weakens donor influence, so it could be a genuine reform.

  The user is likely frustrated with superficial analyses and wants precise terminology to articulate the problem. They might be involved in policy work or academia, needing a framework to critique reforms effectively. Their deeper need is to distinguish between reforms that merely shift money and those that actually reduce influence, possibly to advocate for more effective measures.

  I should synthesize a new term: "Channel-Fixated Reform." This emphasizes the focus on channels rather than outcomes. The concept includes the structural necessity of targeting channels, the inevitable displacement, and the misaligned metrics. It doesn't require intent; it's inherent in the system. 

  For the cases: (a) is not an instance because the channel wasn't circumvented but reopened. (b) might avoid the phenomenon if it changes the influence structure, making it a non-instance. The user needs clear boundaries for the concept to apply it accurately in their work.
answer: |-
  Based on your precise description and the rejection of near-misses, this isn't a single established term, but a **distinct conceptual pattern** combining structural necessity, displacement, and misaligned evaluation. Let's define it tightly:

  **The Core Concept: Channel-Fixated Reform (CFR)**

  1.  **Definition:** A policy intervention designed to reduce undue financial influence in politics that, due to its necessary focus on specific, measurable *channels* of money flow, inevitably leads to:
      *   **Channel Displacement:** The relocation of financial resources/activity to alternative, less-regulated or unregulated channels.
      *   **Metric Fixation:** The subsequent evaluation of the reform's success or failure primarily or exclusively based on observable changes within the *targeted channel itself*, rather than the underlying goal of reducing undue influence or changing whose preferences are reflected in policy outcomes.
      *   **Systemic Incentive:** A structural dynamic where all actors (reformers, opponents, regulators, media) find it easier, cheaper, and more advantageous to debate the readily available channel-level metric, despite shared awareness (implicit or explicit) that this metric is a poor proxy for the intended systemic change.

  2.  **What's In:**
      *   The structural necessity: Laws *must* target defined channels (contributions, registrations, cooling-off periods) to be enforceable.
      *   The predictable displacement: Money/influence seeking will find new paths (new entity types, different activities, exploiting gaps).
      *   The misaligned evaluation: Success = less money/activity in *that specific channel*; Failure = money/activity returning *to that channel* or exceeding previous levels *in that channel*.
      *   The systemic collusion: Everyone uses the cheap, available channel metric, knowing it doesn't measure the real goal, because arguing about *actual influence* is difficult, expensive, subjective, and politically risky.
      *   The absence of necessity for *intent*: The displacement often arises organically from actors adapting to new rules within legal bounds ("doing their jobs"), not necessarily from malicious loophole-seeking (though that can happen too).

  3.  **What's Out / Distinction from Near-Misses:**
      *   **Regulatory Arbitrage:** Focuses on *intentional* exploitation of rule differences. CFR encompasses both intentional arbitrage *and* unintentional adaptation ("doing my job under new rules").
      *   **Goodhart's Law:** Focuses on a measure becoming *bad* because it's *gamed as a target*. In CFR, the channel metric *isn't necessarily gamed*; it's knowingly used as a *poor substitute* for the real metric because the real metric is unavailable/hard. The failure is in *evaluation choice*, not measure corruption.
      *   **Waterbed/Balloon Effect:** Describes the *displacement* aspect perfectly but is *silent* on the crucial *evaluation/misalignment* problem central to CFR.
      *   **Streetlight Effect:** Explains *why* the channel metric is used (it's observable) but doesn't capture the *systemic incentive structure* or the *structural necessity* of targeting channels that makes displacement inevitable and the cheap metric so alluring.

  4.  **Genuine Non-Instance:** A reform that demonstrably changes the *influence structure* rather than just the *flow location*. Examples:
      *   **Effective Public Financing:** As you mention (Case b). If small-donor matching *significantly* increases the number and diversity of meaningful participants (small donors), *decreases* the perceived or actual dependency of elected officials on large concentrated interests, and *changes legislative priorities* towards broader public interest (measurable via voting records, agenda setting, constituency responsiveness studies), it avoids CFR. The *total money* might even increase, but its *causal link* and *perceived influence* per dollar is weakened/diffused. The *evaluation* focuses on influence measures (e.g., donor diversity impact on policy congruence), not just channel flows.
      *   **Robust Conflict-of-Interest Rules with Enforcement:** Rules that fundamentally alter the *incentives* for officials (e.g., strict divestiture requirements, lengthy cooling-off periods for *any* paid advocacy, enforced via strong penalties) that demonstrably reduce the *supply side* of influence-peddling (fewer officials cashing in) and change career paths/lobbying tactics qualitatively (not just shifting registrations to "advisory" roles).

  5.  **Handling Your Cases:**
      *   **(a) Court Reopening the Channel:** This is **NOT** an instance of CFR. CFR requires displacement *as a consequence of the reform itself*. Here, the original reform *did* close the channel and likely caused some displacement initially. The *reopening* is an *external shock* (court decision). The subsequent return of money to the original channel is a reversal of the reform, not a displacement *caused by* the reform's structure. Evaluation *might* still fixate on the channel, but the core CFR dynamic (reform causes displacement and metric fixation) is interrupted by the court.
      *   **(b) Public Financing with Small-Donor Matching:** This is potentially a **NON-INSTANCE** or a **MODIFIED INSTANCE**. If it successfully *changes the influence structure* (as described above), it escapes CFR. However, if:
          *   Large money simply floods into independent expenditures *instead* of candidate donations, *and*
          *   Evaluation focuses *only* on the decline in large direct contributions to candidates (declaring success) while ignoring the surge in IE spending and its continued influence,
          *   Then it *becomes* an instance of CFR: The reform targeted the direct contribution channel, money displaced to IEs, and evaluation fixated on the direct channel metric. The "happy ending" only occurs if the *influence* of the displaced money is demonstrably less than the influence the direct contributions *would have had*, and *that* is what is measured and debated.

  **In essence:** **Channel-Fixated Reform (CFR)** names the *inherent structural bind* of money-in-politics regulation: the necessity of targeting channels creates predictable displacement and simultaneously incentivizes everyone to evaluate success using the very channel metric rendered irrelevant by that displacement. The concept highlights why reforms often feel like whack-a-mole *and* why the debate feels so frustratingly disconnected from the real problem. The key isn't just the displacement, but the systemic reliance on the displaced-from channel as the measure of success.
