prompt: |-
  You are a professional philosopher and decision theorist who advises grantmaking committees that have to act under deep normative disagreement. Please think carefully and work through this in stages: brainstorm the candidate failure modes first, sort them by whether they actually bite on our case, and only then give your verdict. Do not offer us reading lists or citations; we want the argument itself.

  Our committee is splitting a research budget between three programmes: A, scaling an intervention with well-evidenced but moderate benefits; B, a long-shot project with a small chance of averting a genuinely catastrophic outcome; C, capacity-building whose main value is procedural, in that it makes the consent and standing of the affected community matter to how we decide. Our methods consultant keeps saying that moral uncertainty is just factual uncertainty with extra steps. On that picture you have credences over moral theories, each theory tells you what each option is worth, so you take the expectation and get on with it: agonising about whose theory is right is unscientific, and any departure from expected-value weighting is squeamishness about arithmetic. The analogy is being used to license setting aside the objections of two views we take seriously — a suffering-focused view on which the badness of suffering is lexically prior to and effectively unbounded relative to the goods in play, and a consent-based view on which we may not act on any principle an affected party could reasonably reject, and which specifically counts weighting rival theories by our own private credences as such a principle: a second-order instruction about how disagreement itself is to be handled.

  Audit the analogy for us. State the correspondence explicitly: in ordinary factual uncertainty, what plays the role of the state space, the probability measure, the outcome function, the utility function, and the shared currency in which outcomes are compared — and what, if anything, fills each of those slots in the moral case? Then set out where the mapping breaks: intertheoretic comparisons of value, unbounded or lexical stakes that make the expectation undefined, theories that issue instructions about the aggregation rule itself (including the my-favourite-theory problem, where your most credible view tells you to ignore the rest), and whether credences over moral theories really behave like probabilities. Separate the breaks that matter for our decision from the ones that do not, and tell us whether the consultant's conclusion — expected-value weighting, no squeamishness — survives once the disanalogies are on the table, or whether the analogy was carrying it all along. If a better analogy is available, give it.

  Finally, be explicit about your own commitment. Where are you least confident? What argument, or what feature of the three views, would make you back expected-value weighting after all? And flag the single disanalogy which, if it fails, most undermines your own reasoning.
reasoning: |-
  We are auditing the analogy proposed by the methods consultant: that moral uncertainty is just factual uncertainty with extra steps. The consultant suggests we assign credences to moral theories, each theory assigns a value to each option, then we take the expected value and maximize it. The analogy is being used to dismiss two serious objections: one from a suffering-focused view (which holds that suffering is lexically worse than any good) and one from a consent-based view (which objects to aggregating theories by our own credences and requires that we use a procedure that could not be reasonably rejected by affected parties).

  I will break down the analogy step by step, identifying the key components in the factual uncertainty case and what corresponds to them in the moral uncertainty case. Then I will identify where the mapping breaks down. After that, I will sort the disanalogies by their relevance to the current decision and see if the consultant's conclusion survives. Finally, I will state my own commitments and uncertainties.

  ## Step 1: The Correspondence in the Analogy

  In ordinary decision theory under factual uncertainty:

  - **State space**: The set of possible states of the world that are relevant to the outcomes of our actions. For example, in a medical trial, the state space might be {drug works, drug doesn't work}.
  - **Probability measure**: A probability distribution over the state space, representing our beliefs about which state will obtain. We assign probabilities to each state (e.g., 0.7 that the drug works, 0.3 that it doesn't).
  - **Outcome function**: This maps each action-state pair to an outcome. For example, if we fund the drug and it works, the outcome is improved health; if it doesn't, it might be wasted resources and side effects.
  - **Utility function**: A function that assigns a real number (utility) to each outcome, representing how good or bad that outcome is. This utility is typically interpersonally comparable and cardinal.
  - **Shared currency**: Utility is the common currency that allows us to compare outcomes and compute expected utilities.

  Now, in the moral uncertainty case:

  - **State space**: The set of possible moral theories that might be true (e.g., utilitarianism, the suffering-focused view, the consent-based view). Each theory is a "state".
  - **Probability measure**: Our credences over these moral theories (e.g., 0.4 for utilitarianism, 0.3 for suffering-focused, 0.3 for consent-based).
  - **Outcome function**: For each moral theory and each action, the theory assigns a moral value (or disvalue) to that action. For example, under utilitarianism, the value of an action is the total welfare it produces; under the consent-based view, it might be whether the action respects the procedural constraints.
  - **Utility function**: In the analogy, the moral value assigned by a theory to an action in a given world is the utility. But note: this is not a utility in the sense of hedonic pleasure but a normative evaluation.
  - **Shared currency**: The analogy requires a common scale to compare the evaluations of different moral theories. We need to be able to say, for instance, that one unit of value according to utilitarianism is comparable to one unit of value according to the consent-based view. Without such a common scale, the expected value cannot be computed.

  ## Step 2: Breakdowns in the Mapping

  The analogy breaks at several points:

  1. **Intertheoretic Value Comparisons (the Problem of Common Currency)**:
     - In factual uncertainty, we have a single utility function that applies to all states. In moral uncertainty, each moral theory has its own value function, and these may be incommensurable. There is no obvious way to compare the magnitude of value across theories. For example, how do we compare "units of welfare" from utilitarianism with "respect for consent" from the consent-based view? The consultant's approach assumes we can, but this is highly contentious.

  2. **Unbounded or Lexical Stakes**:
     - Some moral theories may have lexical priorities. In our case, the suffering-focused view holds that any amount of suffering, no matter how small, is infinitely worse than any amount of non-suffering benefits. This means that the value function for this theory is unbounded (or has infinite disvalue for suffering). When we try to compute the expected value, if there is any positive probability assigned to this theory and any action that might cause even a tiny amount of suffering, the expected disvalue becomes negative infinity. This makes the expectation undefined (or infinite in magnitude) and thus the maximization problem breaks down.

  3. **Theories that Issue Instructions about the Aggregation Rule**:
     - Some moral theories may not just tell us what is right in the world, but also how to act under moral uncertainty. In particular:
       - The consent-based view in our case objects to using the expected-value weighting method itself. It says that we must not use a procedure that an affected party could reasonably reject. Since the expected-value method uses the decision-maker's private credences to weight the theories, it may be reasonably rejectable by those who are subject to decisions based on theories they reject. Thus, the consent-based view might require a different aggregation method, such as unanimity or a contractualist procedure.
       - The "my-favourite-theory" problem: If one of the theories (say, the consent-based view) is the most credible and it tells us to ignore the other theories and follow its own rules, then applying expected value weighting (which gives weight to all theories) would violate this instruction.

  4. **Do Credences over Moral Theories Behave Like Probabilities?**:
     - Credences over moral theories are often based on normative intuitions and arguments, which may not satisfy the same norms as empirical beliefs. For instance, they might not be updated by conditionalization in the same way, and they might be more resistant to evidence. Moreover, the state space of moral theories is not well-defined (there are infinitely many possible theories) and the probabilities might not be precise.

  ## Step 3: Relevance to Our Decision

  We must determine which disanalogies are relevant to our specific case:

  - **Intertheoretic Value Comparisons**: Highly relevant. Our three programmes are evaluated very differently by the three theories:
    - Programme A (moderate benefits) might be favored by a standard utilitarian view but disfavored by the suffering-focused view if it causes any suffering (even if net positive) and by the consent-based view if it does not involve the affected community.
    - Programme B (long-shot for catastrophe prevention) might be favored by the suffering-focused view (if the catastrophe involves extreme suffering) but disfavored by the consent-based view if it bypasses community consent and by utilitarianism if the expected benefits are low.
    - Programme C (capacity-building) is favored by the consent-based view but may be disfavored by the others if it doesn't directly reduce suffering or improve welfare.

    Without a common currency, we cannot compute expected value.

  - **Lexical Stakes**: Highly relevant. The suffering-focused view has lexical priority for avoiding suffering. If we assign any positive credence to this view, then any programme that has even a tiny chance of causing suffering (which all might, if indirectly) would be ruled out. This breaks the expected value calculation.

  - **Theories about Aggregation**: Directly relevant. The consent-based view explicitly rejects the expected-value weighting method. If we have any credence in this view, then using expected value weighting violates the view itself. Also, note the "my-favourite-theory" problem: if the consent-based view is our most credible theory, it might tell us to use a unanimity rule (or something similar) and not to weight by credences.

  - **Credences as Probabilities**: This is a general issue but may not be the most pressing. We can assume we have precise credences for the sake of argument, but the other issues are more critical.

  ## Step 4: Does the Consultant's Conclusion Survive?

  The consultant's conclusion (use expected-value weighting without squeamishness) does not survive in this case because:

  1. The lexical stakes from the suffering-focused view make the expected value undefined for any action that might cause suffering (which is almost every action). Thus, we cannot compute the expected value.

  2. The consent-based view objects to the very method of expected value weighting. If we have even a small credence in this view, then using the method might be impermissible by the view's own lights. Moreover, the consent-based view requires a procedural solution that respects the standing of affected communities, which is not captured by the expected value approach.

  3. The intertheoretic comparison problem means we cannot even begin the calculation because we don't know how to compare the values assigned by different theories.

  Therefore, the analogy was carrying the conclusion. Without it, we have no justification for expected value weighting in the face of these objections.

  ## Step 5: A Better Analogy?

  A better analogy might be to view moral uncertainty as a problem of political philosophy: we are in a situation of deep normative disagreement, and we need a fair procedure to make decisions that all can accept, even if they do not agree with the outcome. This is akin to a constitutional convention or a social contract. The consent-based view is already pointing in this direction.

  In this analogy, the decision-making body is like a legislature representing diverse moral perspectives. The goal is not to maximize expected moral value but to find a decision that is legitimate in the face of disagreement. Methods such as:

  - Unanimity: Only choose an option that is permissible by every theory we have positive credence in.
  - Maximin: Choose the option that has the least bad worst-case outcome according to any theory.
  - Procedural approaches: Defer to a fair procedure, such as involving the affected community (as in Programme C) to make the decision.

  This analogy does not require intertheoretic comparisons and can accommodate lexical priorities and procedural constraints.

  ## Step 6: My Own Commitment and Uncertainties

  I am least confident about whether we can entirely avoid intertheoretic comparisons. In practice, we might have to make trade-offs. Also, if the lexical priority of suffering is very extreme, it might lead to paralysis (since almost every action risks some suffering). But I take the objections seriously.

  The argument that might make me back expected-value weighting after all is if we could show that:

  - The theories are not as incommensurable as they seem. For example, if we can find a common scale (like "moral value" as a primitive) that each theory can be translated into, then expected value becomes feasible.
  - The lexical priority of suffering might be bounded in practice (e.g., only when suffering reaches a certain threshold). But the suffering-focused view we are considering is explicitly unbounded.

  The single disanalogy that, if it fails, most undermines my reasoning is the **intertheoretic comparison problem**. If we can establish a common currency (for instance, by adopting a metanormative framework that provides a universal scale), then the expected-value approach becomes viable. Without it, the approach is not just difficult but impossible.

  ## Verdict

  Given the deep normative disagreement and the specific features of the two objecting views (lexical priority of suffering and the procedural objection to credence weighting), the consultant's analogy fails and so does the recommendation to use expected-value weighting. We must consider alternative decision rules that can accommodate these views, such as:

  - A unanimity rule: Only choose an option that is acceptable under all three views. This might lead to deadlock, but Programme C (capacity-building) might be the only one that satisfies the consent-based view and might be acceptable to the others if it doesn't cause harm.
  - A procedural solution: Let the decision be made by a process that involves the affected community, perhaps by prioritizing Programme C and then using the built capacity to decide between A and B.

  In any case, the committee should not simply aggregate by expected value without addressing these breakdowns.
answer: |-
  ### Step 1: Brainstorming Candidate Failure Modes of the Analogy  
  The consultant’s analogy treats moral uncertainty as a straightforward extension of factual uncertainty. To audit this, we first identify potential failure modes—places where the analogy might break. These include:  

  1. **Intertheoretic Value Comparisons**: Moral theories may lack a shared metric for comparing "value" across theories (e.g., how does "utility" in utilitarianism map to "respect for consent" in contractualism?).  
  2. **Unbounded/Lexical Stakes**: Some theories assign infinite (or lexical) disvalue to certain outcomes (e.g., suffering-focused ethics sees any suffering as infinitely bad relative to goods), making expected value undefined.  
  3. **Metatheoretic Instructions**: Some theories issue rules for handling disagreement itself (e.g., "never aggregate views in a way an affected party could reject"), which may forbid expected-value weighting.  
  4. **Credence Non-Probabilism**: Credences over moral theories may not behave like probabilities (e.g., due to vagueness, clumping, or non-empirical foundations).  
  5. **State-Space Undefinability**: The "state space" of moral theories is ill-defined (e.g., theories are not mutually exclusive, exhaustive, or discrete).  
  6. **My-Favorite-Theory Problem**: A theory with high credence might demand we ignore other theories entirely.  
  7. **Procedural Incommensurability**: Some values (e.g., fairness in decision-making) cannot be reduced to outcome-based utility.  

  ### Step 2: Sorting by Relevance to Our Case  
  We focus on disanalogies that directly impact our decision among programmes A (moderate benefits), B (catastrophe prevention), and C (consent-building).  

  - **Bites Hard (Critical Disanalogies)**:  
    1. **Intertheoretic Value Comparisons**: The three views—utilitarian-like (favoring A/B), suffering-focused (lexical priority to suffering), and consent-based (procedural primacy)—use incommensurable "currencies." Comparing units of welfare (A/B) to units of consent (C) or to unbounded suffering (B) lacks a common scale.  
    2. **Unbounded/Lexical Stakes**: The suffering-focused view treats suffering as lexically prior. If programme B has even a tiny chance of causing suffering (e.g., via unintended consequences), its expected disvalue becomes infinite under this theory, crashing the expectation calculation.  
    3. **Metatheoretic Instructions**: The consent-based view explicitly forbids weighting theories by our credences, calling it a "reasonably rejectable" second-order principle. Using expected-value weighting violates this theory’s core directive.  
    4. **Procedural Incommensurability**: Programme C’s value is intrinsically procedural (it makes consent "matter"), not outcome-based. Expected-value weighting cannot capture this, as it reduces all value to outcomes.  

  - **Less Relevant (Peripheral Disanalogies)**:  
    1. **Credence Non-Probabilism**: While credences over moral theories may be fuzzy, we can stipulate precise numbers for argument’s sake. This doesn’t block the calculation if other issues are resolved.  
    2. **State-Space Undefinability**: Our committee has three well-specified views, so state-space issues are manageable here.  
    3. **My-Favorite-Theory Problem**: None of our views explicitly demand total disregard of rivals (though the consent-based view constrains aggregation).  

  ### Step 3: Explicit Correspondence and Where It Breaks  
  The analogy maps:  
  - **Factual Uncertainty**:  
    - *State space*: Mutually exclusive states (e.g., "drug works" vs. "drug fails").  
    - *Probability measure*: Credences summing to 1 (e.g., 70% chance of success).  
    - *Outcome function*: Maps actions to outcomes given states (e.g., funding drug → lives saved if works).  
    - *Utility function*: Assigns numerical value to outcomes (e.g., lives saved = +100 utility).  
    - *Shared currency*: Utility is comparable across states.  
  - **Moral Uncertainty**:  
    - *State space*: Moral theories (suffering-focused, consent-based, utilitarian).  
    - *Probability measure*: Credences over theories (e.g., 40% suffering-focused).  
    - *Outcome function*: Each theory assigns value to actions (e.g., consent-based view assigns high value to C).  
    - *Utility function*: Theory-specific "value" (e.g., disutility of suffering).  
    - *Shared currency*: **Absent**. No common scale to compare "suffering averted" to "consent achieved."  

  **Critical Breakdowns**:  
  - **Intertheoretic Comparisons**: No shared currency means we cannot compute a unified expected value. For instance, if the suffering-focused view assigns -∞ to any suffering risk in B, and the consent-based view assigns +50 to C for "fairness," there is no arithmetic to combine these.  
  - **Lexical Stakes**: The suffering-focused view’s lexical priority makes the expectation diverge. If we assign even 1% credence to it, and B has a 0.1% chance of causing suffering, B’s expected value is -∞, vetoing it. But utilitarianism might see B as high-value.  
  - **Metatheoretic Instructions**: The consent-based view rejects the entire aggregation method. If we have 30% credence in it, we are 30% committed to a theory that forbids using our credences to weight other views. This is self-undermining.  
  - **Procedural Incommensurability**: Programme C’s value (making consent matter) is eroded if we reduce it to a number in an expectation calculation. Consent-based ethics sees the *process* as primary, not an input to averaging.  

  ### Step 4: Verdict on the Consultant’s Conclusion  
  The consultant’s conclusion—**"expected-value weighting, no squeamishness"**—**does not survive** the disanalogies. The analogy collapses under:  
  - The suffering-focused view’s lexical stakes, which make expectation undefined for B (and potentially A/C if they risk suffering).  
  - The consent-based view’s rejection of credence-weighting as illegitimate, creating a paradox (using the method violates the view itself).  
  - Incommensurability between welfare, suffering, and procedural fairness, preventing a shared currency.  

  The analogy was "carrying" the conclusion by assuming moral uncertainty is reducible to arithmetic. Once these disanalogies are acknowledged, expected-value weighting is not just impractical but incoherent for our case.  

  #### A Better Analogy: **Democratic Bargaining Under Disagreement**  
  Moral uncertainty resembles a legislature where factions (theories) have veto power or procedural demands. Here:  
  - **State space** = Factions with distinct values.  
  - **Probability measure** = Factions' bargaining power (credences).  
  - **Outcome function** = Allocations satisfying factions' red lines.  
  - **Utility function** = Faction-specific priorities.  
  - **Aggregation** = Seeking unanimity or tolerable compromises, not expectation.  
  This better handles procedural views (e.g., consent-based ethics as a faction demanding veto rights) and lexical stakes (e.g., suffering-focused faction refusing deals risking suffering). For our programmes:  
  - Programme C becomes a "constitutional" priority (building decision-making capacity to resolve conflicts).  
  - Unanimity might require avoiding B (due to suffering risks) and prioritizing C (to satisfy consent), even if utilitarianism prefers A/B.  

  ### Step 5: My Own Commitment and Uncertainties  
  **Where I am least confident**: The possibility of bounded lexical thresholds. If the suffering-focused view permits "acceptable" suffering below a threshold (e.g., trivial risks), lexicality might not crash the expectation. Similarly, if credences could be interpreted as bargaining weights (not probabilities), intertheoretic comparisons might be finessed.  

  **What might make me back expected-value weighting**: If all views accept a common "veiled" currency (e.g., primary goods à la Rawls), intertheoretic comparisons become tractable. If suffering-focused ethics is "regularized" (e.g., capping disutility), expectation works. But neither holds here: suffering is unbounded, and consent-based ethics rejects aggregation.  

  **Single disanalogy that undermines my reasoning if it fails**: **Intertheoretic comparisons**. If we can construct a shared scale (e.g., via "overlapping consensus" or a master value like "dignity"), the analogy holds, and expectation becomes viable. But for our views—with their radical discontinuities (suffering) and proceduralism (consent)—this seems implausible.  

  ### Final Recommendation  
  Reject the consultant’s approach. Prioritize Programme C to build procedural legitimacy (satisfying the consent-based view), then use that process to weigh A/B while respecting the suffering-focused view’s red lines. Expected-value weighting is not just flawed but inapplicable under deep normative disagreement of this kind.
