prompt: |-
  I teach an undergraduate seminar on democracy and collective choice in a politics department: 18 students, one 75-minute session, mixed preparation (roughly a fifth have had a little game theory, the rest none), a whiteboard and index cards but no projector. I want a runnable activity in which the students discover for themselves that they cannot design an aggregation rule under which nobody ever has an incentive to misreport their ranking. No opening lecture and no mention of the Gibbard–Satterthwaite theorem or its statement until the debrief.

  Here is the setup I have in mind, which you should use or improve on. Round zero: each student privately ranks four genuinely live alternatives (say, four ways to spend a small leftover departmental budget for the class — a real, if trivial, stake), seals that ballot in an envelope as their sincere ranking, and the facilitator keeps it. Then three or four rounds in which the class proposes any rule they can state in under two minutes, votes under it, and sees the result. Between rounds they may rewrite the rule entirely. Each voter sees only the previous round's published tally of ballots, never who submitted what, and may vote however they like. The facilitator then computes, from the sealed sincere ballots, what the same rule would have produced had everyone voted sincerely, and the class sees who gained by misreporting and who lost by staying honest.

  Three things matter to me. First, the last twenty minutes should be spent testing escape routes rather than describing them: cut the alternatives to two, or make preferences single-peaked along an ordering the class imposes, or select a ballot at random and take its top choice, or let people report intensities and compensate losers with side payments. Each should be tried on the spot so the class feels what it costs. Second, I want at least one round arranged so that sincere voting under the students' own rule picks an outcome the group agrees is worse than what misreporting would have produced, so they have to confront whether strategy-proofness is even a desideratum rather than assuming it is. Third, the debrief has to map moments onto the theorem's conditions — at least three alternatives, a single deterministic winner, respect for unanimity, no dictator, and an unrestricted domain of rankings — and be frank about what the activity cannot show: a handful of profiles is not a quantifier over all profiles, and success was measured against each student's own sincere ranking rather than against cardinal utility, so the proof itself has to be supplied in words.

  Give me the activity as I would run it: materials, the exact scripts and tally sheets, the round-by-round timeline, the debrief, and an honest note on what will predictably go wrong (students treating round zero strategically, the real stake being too small to care about, someone proposing a rule nobody can compute by hand). Finally, tell me where you are least confident: flag any formal claim you are unsure of, particularly what strategy-proofness amounts to once the rule is allowed to randomize and how far the class of strategy-proof randomized rules extends beyond random dictatorship, which claim you would want a social choice theorist to check before I run this, and which part of the session you would pilot first.
reasoning: |-
  We are designing an activity for an undergraduate seminar on democracy and collective choice. The goal is for students to discover that they cannot design an aggregation rule that is strategy-proof (i.e., no one ever has an incentive to misreport their ranking). The activity involves 18 students and four alternatives (ways to spend a small leftover departmental budget). The alternatives are:

  A: Buy pizza for a class party
  B: Donate to a charity chosen by the class
  C: Purchase books for the department library
  D: Save the money for next year's class

  We have 75 minutes. The activity has several rounds:

  Round 0: Students privately rank the four alternatives and seal their sincere ranking in an envelope. The facilitator keeps these.

  Then, three or four rounds of voting under rules proposed by the class. Each rule must be stated in under two minutes. The class votes under the rule, and the tally is published (without individual ballots). Between rounds, they can rewrite the rule entirely.

  After the last round of voting, the facilitator computes what the same rule would have produced with the sincere ballots (from round 0) and compares it to the outcome when they might have voted strategically. The class then sees who gained and who lost by misreporting.

  In the last 20 minutes, the class tests "escape routes": reducing to two alternatives, imposing single-peakedness, random dictatorship, or allowing cardinal utilities and side payments.

  We also want at least one round in which sincere voting produces an outcome that the group agrees is worse than what strategic voting produced, so they question whether strategy-proofness is always desirable.

  The debrief maps the activity to the Gibbard-Satterthwaite theorem: at least three alternatives, deterministic winner, unanimity, no dictator, unrestricted domain. We note the limitations (only a few profiles, not all; and we use rankings, not cardinal utilities).

  We must be cautious about:
  - Students being strategic in round 0 (so we stress that round 0 is for their sincere ranking and that they should think of it as their true preference).
  - The stake being too small: we make the alternatives tangible and relatable.
  - Rules that are too complex: we encourage simple rules that can be computed by hand.

  Where I am least confident:
  1. How to handle randomized rules: The Gibbard-Satterthwaite theorem applies to deterministic rules. For randomized rules, strategy-proofness is defined as "truth-telling is a dominant strategy for every possible realization of the random variable". The class of strategy-proof randomized rules extends beyond random dictatorship (e.g., the probabilistic serial rule) but in this activity, we will stick to deterministic rules until the escape routes. For the escape route with randomization, we will use random dictatorship (select one ballot at random and take its top) and note that it is strategy-proof.

  2. How to compute the outcome under the rule for the sincere ballots without revealing individual ballots? The facilitator will compute in private and then reveal the outcome and the comparison.

  3. The possibility that in one round, the rule the class designs might be so complex that we cannot compute by hand. We'll have a backup plan: if a rule is too complex, the facilitator can ask the class to simplify or choose another rule.

  Activity Plan:

  Materials:
  - Index cards for ballots (each ballot is a ranking of the four alternatives: A, B, C, D)
  - Envelopes for round 0
  - Whiteboard and markers
  - Tally sheets (prepared in advance for each round) to record the ballots and compute the outcome.

  Timeline:

  Total: 75 minutes

  Round 0: 5 minutes
  - Explain the four alternatives and the activity. 
  - Each student writes their sincere ranking (from best to worst) on an index card and seals it in an envelope with their name. Collect the envelopes.

  Rounds 1-3 (or 4): Each round takes about 10 minutes (so 30-40 minutes total)

  For each round:
  1. The class has 2 minutes to propose and agree on a voting rule. The rule must be simple enough to compute by hand in a few minutes. Write the rule on the board.
  2. Distribute blank index cards. Students vote by writing their ranking (or whatever the rule requires) on the card. They may vote strategically.
  3. Collect and shuffle the ballots. The facilitator tallies the votes and announces the outcome (without revealing individual ballots). Record the outcome on the board.

  After the last round, we do the comparison: 5 minutes
  - The facilitator, in private, for each round, takes the sincere ballots (from round 0) and computes what the outcome would have been under the rule used in that round if everyone had voted sincerely.
  - Then, for each round, compare the sincere outcome (from round 0 ballots) with the strategic outcome (from the round's ballots). Note if they are different and, if so, who benefited and who lost (without revealing individual identities, but by showing the two outcomes and the preferences of the class as a whole).

  Escape routes: 20 minutes
  - We try to avoid the impossibility by relaxing one condition at a time. We do each as a mini-round (about 5 minutes each for four routes). For each, we use the same sincere preferences (from round 0) but apply a different rule.

    Route 1: Reduce to two alternatives. Take the two most popular alternatives from round 0 (say, A and B) and hold a majority vote between them. Show that with two alternatives, majority rule is strategy-proof.

    Route 2: Single-peakedness. Have the class agree on a left-right ordering (e.g., A, B, C, D). Then, restrict the domain to single-peaked preferences. The facilitator checks the round 0 ballots and discards any that are not single-peaked (if any, but we hope they are because we are imposing the order). Then, use a rule that works for single-peaked preferences (e.g., the median voter theorem: the median of the top choices). Note: We must be cautious because the median voter theorem applies to single-dimensional preferences and we need to define a linear order.

    Route 3: Random dictatorship. Select one ballot at random (from the round 0 envelopes) and take its top choice. This is strategy-proof.

    Route 4: Cardinal utilities and side payments. We change the setting: students report cardinal utilities (on a scale of 0 to 10) for each alternative. We then choose the alternative with the highest total utility. Then, we discuss whether the winner can compensate the losers (but in practice, we don't actually transfer money). We note that this is the VCG mechanism and is strategy-proof, but requires transfers.

  Debrief: 10 minutes
  - Map the activity to the Gibbard-Satterthwaite theorem: we had at least three alternatives, deterministic rules (until we tried randomization), we required unanimity (if a rule doesn't, we note that the theorem requires non-imposition which is similar), no dictator, and unrestricted domain (until we restricted it for single-peakedness). 
  - Note the limitations: we only saw a few profiles; we used ordinal rankings, not cardinal utilities; and we didn't consider all possible rules, only a few.
  - State the theorem: any voting rule that is deterministic, has at least three alternatives, is non-imposing (or satisfies unanimity), and non-dictatorial, and defined for all possible preference profiles, must be manipulable.

  What might go wrong:
  - Round 0 strategic voting: Some students might not report sincerely. We stress that round 0 is for their true preferences and that they will be used to see if they could have gained by lying later. We hope that the real stake (even if small) and the fact that they are sealed and private will help.
  - The stake is too small: We make the alternatives as tangible as possible. Also, the intellectual stake (discovering the theorem) might compensate.
  - Complex rules: We encourage simple rules (plurality, Borda, approval, etc.). If a rule is too complex, we ask the proposer to simplify or the class to choose a simpler one.

  Least confident parts:
  1. The escape route for single-peakedness: We need to ensure that the preferences are single-peaked with respect to the chosen order. We might have to discard some ballots, but that would break the unrestricted domain. We can do a quick check of the round 0 ballots to see if they are single-peaked under the chosen order. If not, we might have to adjust the order or skip that ballot? But that might be messy. Alternatively, we can assume that the class will have single-peaked preferences if we choose the order appropriately? This is tricky.

  2. The comparison between sincere and strategic outcomes: We must be careful not to reveal individual ballots. We will only announce the two outcomes (sincere and strategic) and then note that, for example, if the sincere outcome was A and strategic was B, and if a student prefers B to A, they might have gained by misreporting. We don't reveal who.

  3. The claim about the escape routes: I am confident about the two-alternative case and random dictatorship. For single-peakedness, the median voter rule is strategy-proof. For the cardinal utilities, the Vickrey-Clarke-Groves mechanism is strategy-proof, but without actual transfers, it's only in theory. We note that.

  I would pilot the entire activity, but particularly the escape routes and the computation of the outcomes for the sincere ballots. We must make sure we can compute the outcomes quickly.

  Let's design the rounds:

  Round 1: Encourage a simple rule, such as plurality. They might choose plurality.

  Round 2: They might choose Borda count.

  Round 3: They might choose something else, like approval voting (but then we have to define what they report). Or they might try to design a rule that avoids the problems they saw in the first two rounds.

  We hope that in one of the rounds, the sincere outcome (from round 0) is Pareto dominated by the strategic outcome? Or at least, there is a majority that prefers the strategic outcome to the sincere one? Then we can ask: is it bad that strategic voting produced a better outcome?

  Script:

  Introduction (5 min, including Round 0):
  "Today we are going to decide how to spend a small leftover departmental budget. We have four options: 
  A: Pizza party for the class
  B: Donation to a charity
  C: Books for the library
  D: Save for next year

  First, I want you to think about your sincere preferences: how do you rank these options? Please write your ranking from best to worst on an index card. For example, if you like A best, then B, then C, then D, write: A > B > C > D. Then seal it in this envelope and write your name on the envelope. We will keep these sealed until the end. This is your sincere vote.

  Now, we will have several rounds of voting. In each round, we will use a different voting rule that you design. The rule must be simple enough that we can compute the winner in a few minutes. We'll have 2 minutes to agree on a rule. Then, you will vote again (you can vote strategically if you wish). I will collect the votes, shuffle them, and tally without revealing who voted what. Then I'll announce the outcome.

  After a few rounds, we will compare what would have happened if everyone voted sincerely versus what happened when you might have voted strategically. Then we'll try some ways to avoid strategic voting."

  Round 1 (10 min):
  - 2 min: Discuss and choose rule (if they don't come up with one, suggest plurality: each voter votes for one alternative, the one with the most votes wins).
  - Distribute ballots: they write one alternative (if plurality) or their ranking if the rule requires it.
  - Collect, shuffle, tally, announce.

  Round 2 (10 min):
  - Again, 2 min to discuss rule (if they don't change, suggest Borda: each voter ranks all, and the alternative gets 3 points for 1st, 2 for 2nd, 1 for 3rd, 0 for 4th; highest total wins).
  - Vote, tally, announce.

  Round 3 (10 min):
  - Let them propose a rule. They might suggest something else. If they are stuck, suggest approval: each voter approves any subset of alternatives, and the alternative with the most approvals wins.

  After Round 3, we do the comparison (5 min):
  - For each round, the facilitator (in private) uses the sincere ballots (round 0) to compute what the outcome would have been under that round's rule if everyone voted sincerely.
  - Then, for each round, announce:
     "In round 1, the outcome with your strategic votes was X. With your sincere votes, it would have been Y. Notice that ... [e.g., if X and Y are different, then some of you might have preferred X to Y and so gained by voting strategically]."

  Then, we do the escape routes (20 min):

  1. Two alternatives (5 min):
     - "Let's try with only two alternatives. We'll take the two alternatives that were top two in the sincere round 0 ballots (say, A and B). Now, we vote by majority: each votes for one, the one with more votes wins. Vote sincerely? Or strategically? But note: with two alternatives, you can't misrank because you only have two choices. So it's strategy-proof."

  2. Single-peakedness (5 min):
     - "Now, let's impose an order: A < B < C < D. We require that every voter's preferences are single-peaked: they have a single peak and decrease as they move away. We'll use the median voter rule: each voter reports their top choice, and we choose the median top choice when ordered by the linear order (A,B,C,D)."
     - The facilitator checks the round 0 top choices. Orders them along A,B,C,D. Then picks the median. For example, if the top choices are [A, B, B, C, D] then we order: A, B, B, C, D -> median is B.
     - Note: We assume that the preferences are single-peaked? We don't actually check the entire ranking. We just use the top choice. But the median voter theorem requires that the preferences are single-peaked. We can say: if we assume that preferences are single-peaked, then this rule is strategy-proof.

  3. Random dictatorship (5 min):
     - "Now, we pick one ballot at random from the round 0 envelopes and take its top choice." 
     - Draw one envelope at random, open it, and announce the top choice.

  4. Cardinal utilities (5 min):
     - "Now, we change the system: each of you gives a score for each alternative from 0 to 10. We add them up and choose the one with the highest total. But note: this might not be fair because the winner might be able to compensate the losers. We don't have a way to do that, but in theory, if we could transfer money, we could use a mechanism that makes truth-telling optimal."

  Debrief (10 min):
  - We encountered the Gibbard-Satterthwaite theorem: we tried several rules and saw that in each, there was an incentive for someone to lie (unless we used one of the escape routes). The theorem says that if we have at least three alternatives, a deterministic rule, non-imposing (if an alternative is top for everyone, it must win), and non-dictatorial, and defined for all possible preferences, then it is manipulable.
  - We relaxed the conditions: two alternatives, restricted domain (single-peaked), randomization (random dictatorship), and cardinal utilities (with side payments) are ways out.
  - But note: we only saw a few profiles. The theorem is about all possible profiles. Also, we used rankings, but if we had cardinal utilities and side payments, we can do better.

  Honest note: The activity cannot cover all profiles, and we only have 18 students. The theorem is much stronger. Also, we did not prove the theorem, but we experienced the phenomenon.

  Where I am least confident:
  - In the escape route for single-peakedness, we are using the top choices and the median, but we are not verifying that the entire preference is single-peaked. We are trusting that the imposed order and the top choice are enough. This is acceptable for the activity? We can say that if the preferences are single-peaked, then the median top choice is the Condorcet winner and the rule is strategy-proof.

  - For the cardinal utilities escape route, we are not actually implementing transfers, so we cannot achieve strategy-proofness without transfers. We are just noting the idea.

  I would want a social choice theorist to check:
  - The claim about the median voter rule: in the activity, we are only using the top choice and the median of top choices. But the median voter theorem requires that the preferences are single-peaked and then the median of the ideal points (which are the top choices) is the Condorcet winner. And it is strategy-proof? Actually, reporting the top choice truthfully is a dominant strategy only if the preferences are single-peaked and the rule is the median? I think so, but I'm not 100% sure.

  Pilot: I would pilot the entire activity, but especially the escape routes and the computation of outcomes for the sincere ballots.

  Let's hope it works! It's going to be a great learning experience.
answer: |-
  ### Activity Design: Discovering the Impossibility of Strategy-Proof Voting  
  **Objective**: Students experience designing voting rules and discover that strategic misreporting is inevitable under common conditions. The debrief connects this to the Gibbard–Satterthwaite theorem (without naming it initially).  

  **Materials**:  
  - **Index cards** for ballots (4 per student).  
  - **Envelopes** (18, for sealing round-zero ballots).  
  - **Whiteboard** for recording rules and tallies.  
  - **Tally sheets** (facilitator’s cheat sheet for computing outcomes).  
  - **Timer**.  
  - **Alternatives** (4 concrete options for spending $200 leftover departmental funds):  
    - **A**: Pizza party for the class.  
    - **B**: Donation to a local food bank.  
    - **C**: Professional speaker on democracy.  
    - **D**: Books for the department lounge.  

  **Setup** (5 minutes):  
  - **Explain the stakes**: "We have $200 to spend. We’ll vote on options A–D. Your goal: get the best outcome for yourself. But first, you’ll privately record your *true* preferences."  
  - **Round zero**: Distribute index cards. Students write their sincere ranking (e.g., "A > B > D > C"), seal in an envelope with their name, and hand to you. Emphasize: "This envelope is your *true* preference. We’ll use it later to see if lying helped you."  
  - **No opening lecture**: Jump straight to voting rounds.  

  ---

  ### Voting Rounds (3 rounds × 10 minutes = 30 minutes)  
  **Rules**:  
  - Each round, students propose a voting rule (e.g., plurality, Borda). Rule must be computable by hand in ≤2 minutes.  
  - You record the rule on the whiteboard.  
  - Students vote **anonymously** via index cards (no discussion of ballots).  
  - You tally publicly (show aggregate ballots, not individual votes).  
  - **Key twist**: After announcing the outcome, ask: "Is this result better or worse than you expected? Could you have voted differently to improve it?"  

  #### **Round-by-Round Script**  
  **Round 1 (Plurality-like rule, predictable manipulation)**  
  - *Student proposal*: Likely suggests "pick one favorite" (plurality). If not, guide them: "What’s the simplest rule? Majority wins?"  
  - *Rule on whiteboard*: "Each voter picks one option. Most votes wins."  
  - *Vote*: Students submit one choice (A, B, C, or D).  
  - *Tally*: Count votes. Example outcome: B wins (e.g., B:7, A:6, C:3, D:2).  
  - *Facilitator note*: Later, we’ll compare this to sincere round-zero preferences.  

  **Round 2 (Borda-like rule, obvious manipulation opportunity)**  
  - *Student proposal*: Encourage complexity: "How can we make preferences matter more?" If needed, suggest Borda: "Rank all options. Points: 3 for 1st, 2 for 2nd, 1 for 3rd, 0 for last."  
  - *Rule on whiteboard*: "Rank all options. Points: 3,2,1,0. Highest sum wins."  
  - *Vote*: Students submit full rankings.  
  - *Tally*: Calculate points (assign 3/2/1/0). Example: C wins (e.g., C:45, B:42, A:40, D:20).  
  - *Plant a dilemma*: If sincere preferences (from round zero) would have made A win, but C won strategically, ask: "Is C *better* for the class than A? Should we *want* strategic voting here?"  

  **Round 3 (Student-designed rule, forces chaos)**  
  - *Challenge them*: "Design a rule that avoids past problems. Can we make it hard to manipulate?"  
  - *Common proposals*:  
    - **Approval voting**: "Vote for as many as you like. Most approvals wins."  
    - **Instant-runoff**: "Rank all. Eliminate fewest-top-choice until majority." (Warn: hand-calculation is slow—simplify to 2 eliminations max.)  
  - *Tally*: Example: D wins unexpectedly.  
  - *Facilitator note*: Ensure one round where strategic voting produces a *better* group outcome (e.g., if sincere voting picks a Pareto-dominated option).  

  ---

  ### Comparison Phase (5 minutes)  
  - **Reveal strategic vs. sincere outcomes**:  
    - For each round, use sealed round-zero ballots to compute the *sincere outcome* under the same rule.  
    - Announce: "Round 1: You voted strategically and got B. With your *true* preferences, you’d have gotten A."  
  - **Identify winners/losers**:  
    - "Who prefers B over A? You won by lying. Who prefers A? You lost by being honest."  
    - Highlight a student who gained: "If you ranked B > A, lying helped you."  
    - Highlight a loser: "If you ranked A > B, honesty hurt you."  
  - **Key realization**: "In every round, someone could gain by lying. Can we fix this?"  

  ---

  ### Escape Routes (20 minutes, try all)  
  Test fixes live. Use round-zero preferences for all.  
  1. **Two alternatives** (3 min):  
     - Take top two from round zero (e.g., A vs. B). Majority vote.  
     - Outcome: Always strategy-proof. "Did anyone want to lie? Why not?"  

  2. **Single-peaked preferences** (5 min):  
     - Impose an ordering: e.g., Left: A (pizza), Center-Left: B (donation), Center-Right: C (speaker), Right: D (books).  
     - Students recast preferences as single-peaked (e.g., "I must have one 'peak'; no liking A and D but not B/C").  
     - Vote via median voter rule: "Find the median of everyone’s top choice along A-B-C-D."  
     - Outcome: Strategy-proof but restrictive. "How many had to change their true preferences?"  

  3. **Random dictatorship** (3 min):  
     - Pick one random sealed envelope from round zero. Top choice wins.  
     - Outcome: Strategy-proof. "But is it fair? What if the dictator hates your favorite?"  

  4. **Cardinal utilities + side payments** (5 min):  
     - Score alternatives 0–10 (e.g., "A:10, B:5, C:3, D:0"). Sum scores; highest wins.  
     - "Compensate losers": Hypothetically, if pizza wins, pizza-lovers pay book-lovers $2 each.  
     - Outcome: Strategy-proof with transfers. "But do we trust people to report true scores? Can we enforce payments?"  

  ---

  ### Debrief (10 minutes)  
  **Map to Gibbard–Satterthwaite**:  
  - "Today, we couldn’t design a voting rule where no one ever benefits from lying. This is unavoidable under five conditions:"  
    1. ≥3 alternatives (we had 4).  
    2. Single deterministic winner (we always picked one).  
    3. Unrestricted preferences (any rankings allowed, until we restricted for single-peakedness).  
    4. Respect for unanimity (if all rank A first, A wins—our rules did this).  
    5. No dictator (we didn’t let one person decide).  
  - "The Gibbard–Satterthwaite theorem proves that if all five hold, *every* voting rule is manipulable."  

  **Limitations of the activity**:  
  - "We only saw a few preference profiles. The theorem covers *all possible* profiles."  
  - "We used rankings (ordinal preferences), not cardinal utilities. With intensities, we saw one escape route."  
  - "We didn’t *prove* the theorem—we experienced it. The proof uses game theory you’ll learn later."  

  **Ethical takeaway**:  
  - "In round 2, strategic voting gave a better outcome. Should we *want* strategy-proofness? Or is manipulation sometimes good?"  

  ---

  ### Predictable Problems & Mitigation  
  1. **Students lie in round zero**:  
     - *Mitigation*: Stress stakes ("This affects $200!") and anonymity ("I won’t reveal your ballot").  
     - *Fallback*: If suspicion arises, admit: "Some may lie, but we’ll still see manipulation in later rounds."  

  2. **Stakes too low**:  
     - *Mitigation*: Use relatable alternatives (food, charity). Frame as "real $200, not a thought experiment."  

  3. **Overly complex rules**:  
     - *Mitigation*: Enforce "2-minute computability" rule. Reject proposals like "elect the Kemeny-Young winner."  
     - *Fallback*: If proposed, say: "Too slow! Let’s simplify to Borda or approval."  

  4. **Time crunch**:  
     - *Mitigation*: Skip round 3 if behind; use pre-seeded rules (Borda/approval). Shorten escape routes to 3 min each.  

  ---

  ### Least Confident Elements  
  **Formal uncertainties** (Verify with a social choice theorist):  
  1. **Randomized rules & strategy-proofness**:  
     - I claim random dictatorship is strategy-proof (truth-telling is dominant regardless of randomness).  
     - *But*: Is *any* strategy-proof randomized rule a mixture of duples and random dictatorships? I’m unsure. The activity only uses random dictatorship for simplicity.  
     - **Ask theorist**: "Does Gibbard’s characterization of strategy-proof randomized rules extend beyond random dictatorship in this setting?"  

  2. **Single-peaked escape route**:  
     - I claim median voting is strategy-proof under single-peakedness.  
     - *But*: What if the median isn’t unique? I assumed an odd number of voters (18 is even).  
     - **Fix**: Add tiebreaker rule (e.g., "leftmost median wins").  

  3. **Cardinal utilities**:  
     - I claim VCG-like mechanisms are strategy-proof with side payments.  
     - *But*: Without actual payments, reporting intensities truthfully isn’t incentive-compatible.  
     - **Fix**: Clarify: "This *only* works with enforceable transfers."  

  **Pilot recommendation**:  
  - **Test the comparison phase**: Simulate sincere/strategic tallies with fake data to ensure quick computation.  
  - **Dry-run escape routes**: Ensure single-peaked preferences are feasible for students (e.g., pre-check if their rankings can be made single-peaked).  

  **Final note**: This activity makes the theorem visceral. Students *see* manipulation, then test fixes that "break" the theorem’s conditions. The debrief formalizes their frustration.
