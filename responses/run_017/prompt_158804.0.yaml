  They want me to reframe the debate using these precise engineering concepts rather than the fuzzy language used online. They suspect people are using "agent" as a vibe rather than a technical definition. They've also shared two hunches: one about loop-closure latency (how far ahead a system plans before human intervention) and another about endogenous re-specification (systems that change their own objectives).

  For the residue report, they want a detailed table analyzing claims from the AI debate, restating them in control terms, and evaluating them (clean, distorted, no counterpart). Then a second table for their hunches. Finally, a JSON output with specific fields for bottom-line conclusion, vocabulary gaps, overrated claims, and phrases to avoid.

