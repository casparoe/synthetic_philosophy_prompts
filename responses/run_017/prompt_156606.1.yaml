  Okay, the user is a moderator on a history forum dealing with pseudohistorical theories. They need a triage system that's quick, transparent, and doesn't require expertise. Let me start by understanding their main pain points.

  First, they're overwhelmed by sincere but fringe theories that are well-presented with footnotes. They can't adjudicate substance because they're not experts. The key is to create a standard that's procedural, not about truth. They need actions like remove, label, or ask a question.

  The user listed several cases to sort correctly. Atlantis, von Däniken, Fomenko's chronology, and anonymous photo claims are the problem children. On the other hand, continental drift, Troy, Hittites, Vinland are valid but initially rejected theories. The system must handle specialist disagreements, nationalist histories, and distinguish honest errors from pseudohistory.

  Their hunches are important. Any mechanical rule can be gamed. Testing against past knowledge is crucial. Avoiding "ask a professor" is a must. They want theories to explain the mainstream evidence, not just anomalies. Also, the symmetry test—applying the proponent's standard to their own claims. Need to define the unit of assessment: claim, book, program? Error costs differ for real revisions vs. fabrications. Publication form might matter. And finally, is pseudohistory a single category or multiple failings?

  Breaking down the requirements: Non-negotiables include transparency (public application), no expertise needed, actionable outputs, and using period-appropriate knowledge. Preferences are avoiding "ask an expert," addressing conspiracy scales, symmetry tests, and error cost awareness. False requirements might be requiring peer review or demanding falsifiability as a sole criterion.

  For the triage rule, I'm considering a flowchart. Step 1: Is the claim falsifiable? If not, label as speculative. Step 2: Check for conspiracy dependence. If high suppression needed, remove. Step 3: Apply symmetry test—ask the proponent to self-apply their standards. Step 4: Assess error cost—potential harm? Then decide action.

  Key distinctions: Pseudohistory isn't one thing. It's either unfalsifiable, conspiracy-dependent, or insulated from criticism. Valid revisionists might lack evidence but engage constructively.

  Contender evaluation: Specialist consensus is insufficient alone. Falsifiability is necessary but not sufficient. Responsiveness to criticism is crucial—fringe theories often ignore critiques. Burden of proof should be on the claimant. Generating new results vs. recycling is a strong indicator. Conspiracy scale is a red flag.

  Transparency in applying these steps is vital. Explaining decisions based on conspiracy scale or symmetry test addresses gatekeeping accusations. This approach focuses on methodological flaws rather than content, meeting the user's core need.
answer: |-
  Based on your constraints and cases, here's a specification focused on **methodological triage** rather than truth adjudication. The core principle is identifying claims that *structurally cannot* engage with mainstream history, even if wrong, versus those that *can*, even if currently unpopular.

  **Non-Negotiable Requirements for the Triage Rule:**
  1.  **Actionable Output:** Must output a clear action (Remove, Leave Alone, Label, Ask Specific Question). *Rationale:* Core purpose; avoids paralysis.
  2.  **Transparency & Public Defense:** Criteria and application must be explainable publicly in simple terms, showing "work" without relying on secret knowledge or authority. *Rationale:* Essential for forum legitimacy against "gatekeeping" accusations.
  3.  **No Specialized Knowledge Required:** Must be applicable by a moderator with general historical knowledge but *no* expertise in the specific topic/period. *Rationale:* Operational reality; avoids collapsing into "ask an expert".
  4.  **Period-Appropriate Assessment:** Must judge plausibility based *only* on evidence/knowledge *available at the time the claim was made* or readily accessible to the claimant. *Rationale:* Fairness to past revisionists (Continental Drift, Troy); prevents hindsight bias.
  5.  **Handles Genuine Disagreement:** Must not flag mainstream scholarly disputes (e.g., Bronze Age Collapse causes) as equivalent to pseudohistorical claims. *Rationale:* Avoids false positives and stifling legitimate debate.

  **Preferences (Desiderata, not absolute requirements but highly valuable):**
  6.  **Identifies Structural Insulation:** Flags claims systematically immune to counter-evidence or methodological critique. *Rationale:* Targets the core dysfunction of pseudohistory vs. honest error/revisionism.
  7.  **Assesses Conspiracy Scale:** Requires explicit acknowledgment of how much suppression/forgery the theory necessitates and how many actors are implicated. *Rationale:* Distinguishes minor institutional bias claims (plausible) from vast, sustained conspiracies (implausible, hallmark of fabrication like Fomenko).
  8.  **Symmetry Test Application:** Forces the proponent's *own* standard of evidence onto a mainstream claim they reject. *Rationale:* Reveals if standards are applied consistently (sign of good faith) or arbitrarily (sign of motivated reasoning). (This tests *method*, not theory/person directly).
  9.  **Error Cost Awareness:** Considers the *type* of harm from error (e.g., promoting nationalist myth vs. over-interpreting ambiguous archaeology). *Rationale:* Informs moderation severity (Remove vs. Label/Question). (Operationalizing this fully is hard, but awareness is key).

  **False Requirements / Prejudices (To Avoid):**
  10. **Peer Review Mandate:** Rejecting solely based on self-publishing/video format. *Why:* Valid ideas can start outside channels (Continental Drift); pseudohistory sometimes infiltrates low-quality journals. (Form *can* be a weak signal, but not dispositive).
  11. **Falsifiability as Sole Criterion:** Many historical claims are hard to *prove* false, but good ones engage with evidence. Pseudohistory often *is* technically "falsifiable" but evades falsification via conspiracy claims.
  12. **"Must Be True":** The rule *cannot* determine truth, only methodological coherence and engagement potential.
  13. **Burden of Proof as Knockout:** While claimants bear it, demanding *conclusive* proof upfront stifles novel ideas. Focus on *how* they address their burden and counter-evidence.

  **Conflicting Desiderata & Trade-offs:**
  *   **No Expertise vs. Identifying Structural Insulation:** Truly identifying deep methodological flaws often *requires* expertise. The triage rule must use crude but robust proxies (Conspiracy Scale, Symmetry Test, Responsiveness).
  *   **Transparency vs. Nuance:** Simple, public rules are less nuanced. Explainable criteria like "Requires 10,000 conspirators sustained over centuries" are crude but transparent. Nuanced epistemological criteria are opaque.
  *   **Speed vs. Symmetry Test:** Applying a symmetry test takes more time than checking for massive conspiracy claims. It might be an "Ask" step rather than initial triage.

  **The Core Triage Rule (Flowchart Approach):**

  1.  **Is the claim FALSIFIABLE in principle using historical/archaeological evidence?** (Not "proven false," but *could* evidence disprove it?).
      *   *No (e.g., Atlantis as pure spiritual metaphor, some "energy" theories):* **LABEL** as "Speculative Philosophy/Mythology, Not Historical Argument".
      *   *Yes:* Proceed.
  2.  **Does the core argument RELY on a LARGE-SCALE CONSPIRACY/SUPPRESSION (beyond plausible institutional bias) to explain mainstream evidence?** (Estimate actors/centuries needed: Fomenko/Von Däniken = Massive; Continental Drift/Troy/Hittites = None/Localized).
      *   *Yes (Requires 100s+ coordinated actors over generations):* **REMOVE.** Explain: "Reliance on implausibly vast, sustained conspiracy invalidates methodological engagement with historical evidence."
      *   *No/Minor:* Proceed.
  3.  **Is the claim RESPONSIVE TO CRITICISM?** (Check: Does it address *core* mainstream counter-evidence? Does it adapt? Or just dismiss critics as dupes/agents? Anonymous photos often ignore context/counter-evidence).
      *   *No (Ignores/dismisses core counters without engagement):* **LABEL** as "Unresponsive to Mainstream Counter-Evidence/Arguments". **ASK:** "Please address specific counter-argument X [State one core mainstream counter clearly]."
      *   *Yes/Unclear:* Proceed.
  4.  **Apply SYMMETRY TEST (Implicitly or as "ASK"):** Could the proponent's *own* methods/standards be used to support a claim *they* reject? (E.g., "If X proves Atlantis, does same method prove Lemuria?"). If obviously inconsistent:
      *   **LABEL** as "Apparent Inconsistency in Evidentiary Standards". **ASK:** "How does your method avoid also proving [Contradictory Claim Y]?"
  5.  **ASSESS ERROR COST (For severity):** Could this claim, if wrong, cause significant real-world harm (e.g., fuel dangerous nationalism, hate groups)? If Yes, lean towards **REMOVE** or prominent **LABEL**. If primarily academic, **LEAVE ALONE** or minor **LABEL** ("Controversial Interpretation").

  **Handling Specific Cases:**
  *   **Sunken Atlantis (Plato):** Falsifiable? Yes. Conspiracy? Usually massive suppression implied. Responsive? Often no. **Remove/Label+Ask.**
  *   **Von Däniken:** Conspiracy? Massive suppression/ignorance. **Remove.**
  *   **Fomenko:** Conspiracy? Enormous fabrication/suppression over centuries. **Remove.**
  *   **Anonymous Photo Claims (Flooded Buildings):** Responsive? Rarely engage with context (e.g., urban development, fill). Symmetry? Often inconsistent. **Label + Ask** for specific counter-evidence response.
  *   **Continental Drift (Past):** Falsifiable? Yes. Conspiracy? None claimed, just resistance. Responsive? Engaged with critics, sought mechanism. **Leave Alone.**
  *   **Troy/Hittites/Vinland (Pre-Discovery):** Falsifiable? Yes. Conspiracy? None/Minimal claimed (skepticism ≠ conspiracy). Responsive? Proponents engaged evidence. **Leave Alone.**
  *   **Bronze Age Collapse Debate:** Falsifiable? Various proposals are. Conspiracy? None. Responsive? Scholars engage fiercely. **Leave Alone.**
  *   **Nationalist Myth vs. Nationalist History:** Conspiracy Scale & Responsiveness are key differentiators. Myth needs vast suppression, ignores counters. History argues within evidence, responds.

  **Pseudohistory Demystified:**
  It's **not one thing**. Your triage identifies **three distinct, often co-occurring, failings**:
  1.  **Unfalsifiable Core:** Immune to evidence (often masked by footnotes on peripherals).
  2.  **Conspiracy Dependence:** Requires implausible suppression/fabrication to explain counter-evidence.
  3.  **Criticism Insulation:** Systematically ignores/dismisses counter-arguments without engagement.

  **Contender Evaluation (Compact Table):**

  | Criterion              | Score (0-5, 5=Best) | Key Strength                     | Key Weakness/Limitation                 | Notes                               |
  | :--------------------- | :------------------ | :------------------------------- | :-------------------------------------- | :---------------------------------- |
  | **Specialist Consensus** | 2                   | Easy to check (surface level)    | Punishes *all* revisionism; opaque; "gatekeeping" smell | Fails Troy/Vinland/Drift pre-vindication |
  | **Falsifiability**       | 4                   | Necessary foundation; clear      | Insufficient alone; often gamed         | Prerequisite but doesn't catch core issues |
  | **Responsiveness**       | **5**               | **Catches insulation; core flaw** | Requires checking engagement (some time) | **Most robust single indicator**    |
  | **Burden of Proof**      | 3                   | Fair principle                   | Hard to operationalize quickly; stifles if misapplied | Better as proponent duty than mod rule |
  | **New Results**          | 4                   | Strong sign of healthy program   | Slow to assess; hard for mods; punishes new ideas | Correlates with validity, not direct test |
  | **Conspiracy Scale**     | **5**               | **Clear red flag; easy proxy**   | Quantitative threshold needed           | **Best quick pseudohistory marker** |

  **Which are the same in disguise?**
  *   **Responsiveness, Generating New Results, and Healthy Burden of Proof Engagement** are facets of the same thing: **engagement with the epistemic process**. A theory that responds to criticism and bears its burden *will* generate new results (or die). Pseudohistory avoids this process.
  *   **Conspiracy Scale and Structural Insulation** are tightly linked. Needing a vast conspiracy *is* a primary method of insulation.

  **The Winning Trio for Triage:**
  1.  **Conspiracy Scale (Massive? -> Remove):** Your fastest, most defensible filter for the worst offenders.
  2.  **Responsiveness (Ignores core counters? -> Label + Ask):** Catches less extreme but still dysfunctional claims.
  3.  **Symmetry Test (Inconsistent standards? -> Label + Ask):** Reveals methodological bad faith/arbitrariness.

  This approach lets you **act decisively** on clear methodological failures (Conspiracy Dependence), **flag** claims showing poor engagement (Responsiveness/Inconsistency), and **leave alone** contentious but methodologically sound debates, all without judging truth or needing a PhD. Explain your actions publicly using these criteria: "Removed due to reliance on implausibly vast conspiracy"; "Labelled for lack of engagement with specific counter-evidence X". This is gatekeeping based on *process*, not *content* or *institution*, which is defensible.
