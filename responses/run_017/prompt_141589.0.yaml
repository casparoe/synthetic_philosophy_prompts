  ### **4. What Will Go Wrong (and Fixes)**  
  **Predictable Issues**:  
  - **"Just point/ask!"**: Students will try to bypass the screen.  
    - *Fix*: Gently remind: "No access to informant beyond grunts/clicks. Work with data."  
  - **Bribes/jokes**: "I'll give you candy if you say 'rabbit'!"  
    - *Fix*: Stay in character: *[Grunt for "yes, but I won't answer"]*.  
  - **Stage Manual Mockery**: Team D may hesitate or be ridiculed.  
    - *Fix*: Preempt: "All interpretations are valid if they fit data." Use hint if stuck.  
  - **Time Overruns**: Manual-writing (Phase 2) takes ~20 min (not 15); Phase 3 may rush.  
    - *Fix*: Use a timer. Shorten Phase 1 by 5 min if needed.  
  - **Accidental Bias**: If your table has bias (e.g., reappearing rabbits favor stages), teams may detect it.  
    - *Fix*: Test your table rigorously (see below). If bias emerges, say: "Interesting! But in Quine's setup, we assume perfect neutrality."  

  **Testing Table Neutrality**:  
  1. **Generate manuals**:  
     - Whole: Gavagai = rabbit; "tu" = same animal; "pa" = spatial part.  
     - Part: Gavagai = undetached rabbit part; "tu" = same fusion; "pa" = subpart.  
     - Stage: Gavagai = rabbit stage; "tu" = same perduring rabbit; "pa" = part of stage.  
  2. **Run all cards**: Ensure identical responses for all three.  
  3. **Red Flags**:  
     - If "reappearing rabbit" gets "tu" = dissent for stages, adjust to "tu" = assent (meaning "same animal").  
     - If "hidden ear" gets assent for parts, exclude it—use only "whole or nothing" stimuli.  

  ---

  This plan forces students into the inscrutability problem experientially. By making Team D build the "package deal," you ensure the Quinean move lands. The debrief ties it together while honoring real-world concerns. Finally, embrace the chaos—the "what went wrong" moments often crystallize the point! Let me know if you need the full CSV of stimulus cards or tweaks.
