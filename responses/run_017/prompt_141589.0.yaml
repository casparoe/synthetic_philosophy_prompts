  Below is a comprehensive plan for your 90-minute seminar activity on Quine's radical translation, designed to make students confront the inscrutability of reference without naming it until the debrief. I'll provide: (1) rules and materials, including a neutral response table; (2) a minute-by-minute timeline; (3) a detailed debrief script mapping the activity to Quine's ideas; and (4) honesty about limitations and potential pitfalls. The goal is to create a "Eureka!" moment where students see that behavioral evidence alone cannot fix reference, setting up your closing point about indeterminacy "at home."

  ---

  ### **1. Rules and Materials**
  **Core Mechanics**:  
  - You (the TA) play the role of a native Embe speaker behind a cardboard screen. You can only produce two responses:  
    - **Grunt**: Assent (yes)  
    - **Head-click** (e.g., tongue click): Dissent (no)  
    No other communication is allowed—no nodding, pointing, or explanations. Students must rely solely on the stimulus-response data.  
  - **Class Structure**: Split into four teams (A, B, C, D) of 3–4 students each. Team D has a secret role (see Phase 4).  
  - **Queries**: Students can ask only three types of questions (translated into Embe, but the words are given):  
    - "Gavagai?" → "Is there a gavagai here?" (object query)  
    - "Tu gavagai?" → "Is this the same gavagai as that?" (identity query, comparing two events)  
    - "Pa gavagai?" → "Is this part of a gavagai?" (part query)  
  - **Key Giveaways**: At the start, provide:  
    - Assent/dissent meanings (grunt/click).  
    - "Tu" = "same" and "Pa" = "part of" (established via off-screen "training" to avoid ostension issues).  
    - Rationale for gives: Explain that "tu" and "pa" were decoded using the same stimulus method as "gavagai," but this is a simplification. (Debrief will address why this is a give.)  

  **Materials**:  
  - **Deck of 40 Index Cards (Phase 1)**: Each card describes a stimulus occasion and your pre-recorded response. Responses are neutral between three interpretations:  
    - **Whole rabbit** (enduring animal).  
    - **Undetached rabbit part** (e.g., ear, leg—only when attached to a living rabbit).  
    - **Rabbit stage** (temporal slice of a rabbit at a moment in time).  
    - **Design Principle**: Responses are identical for all three interpretations by construction. For example:  
      - "Gavagai?" is **assent** only when a whole rabbit is visible (so all interpretations agree: whole animal present = parts/stages present too).  
      - "Gavagai?" is **dissent** for detached parts, carcasses, or non-rabbits (all interpretations dissent: no whole, no attached part, no "alive" stage).  
      - "Tu gavagai?" and "Pa gavagai?" responses depend on reinterpreting "tu" and "pa" to compensate (e.g., "tu" means "same animal" for whole/stage, but "same fusion of parts" for parts).  
    - **Sample Cards (20 object, 10 identity, 10 part queries)**:  
      | Occasion | Query | Response | Neutrality Check |
      |----------|-------|----------|------------------|  
      | Whole rabbit in open field. | Gavagai? | Assent | ✅ All agree: whole/part/stage present. |  
      | Rabbit ear detached on ground. | Gavagai? | Dissent | ✅ All agree: no whole, no attached part, no "alive" stage. |  
      | Rabbit hidden behind bush, only ear visible. | Gavagai? | Dissent | ✅ All agree: whole not fully visible (adjusted for parts/stages via "pa" later). |  
      | Rabbit runs past, reappears 5 sec later. | Gavagai? (x2) | Assent (both) | ✅ All agree: object/stage/part present each time. |  
      | Rabbit seen Monday. Same rabbit Tuesday. | Tu gavagai? | Assent | ✅ Whole: same animal. Part: same fusion. Stage: same perduring object. |  
      | Rabbit seen Monday. Different rabbit Tuesday. | Tu gavagai? | Dissent | ✅ All agree: different animal/fusion/stages. |  
      | Whole rabbit, point to ear. | Pa gavagai? | Assent | ✅ Whole: ear is part. Part: ear is subpart. Stage: ear is part of stage. |  
      | Detached rabbit foot. | Pa gavagai? | Dissent | ✅ All agree: not part of a *current* whole/attached part/stage. |  
      | *[Full table provided in a separate file—DM me for CSV]* |  
    - **Avoiding Bias**: To ensure neutrality:  
      1. **No decisive cases**: Exclude stimuli where interpretations conflict (e.g., never show *only* an undetached part—it forces dissent for whole but assent for parts).  
      2. **Identity over time**: Only use "tu" for rabbits seen at different times if the rabbit is identical (same animal) or clearly different. Never use "reappearing" rabbits where stage/part might dissent—adjust "tu" to mean "same animal" universally.  
      3. **Part queries**: Only use "pa" when a whole rabbit is present (all agree on assent) or for detached items (all dissent).  
      4. **Test for bias**: Run your table against the three manuals (provided below). All must predict identical responses.  

  - **Held-Out 12 Cards (Phase 2)**: Similar to the 40-card deck but unseen. Use for prediction scoring (e.g., "Rabbit carcass: Gavagai? → Dissent").  

  - **Team D Secret Brief (Phase 4)**:  
    - **Task**: Build a manual that shifts the *entire* apparatus (e.g., from whole rabbit to undetached parts or stages) by reinterpreting "gavagai," "tu," and "pa" as a package.  
    - **Hint if stuck**: *"Change what 'gavagai' means (e.g., to parts), then adjust 'tu' and 'pa' to keep predictions identical. E.g., if 'gavagai' = parts, 'tu' could mean 'belongs to the same animal'."*  

  **Translation Manual Template (for all teams)**:  
  ```markdown
  - Gavagai means: [e.g., whole rabbit / undetached rabbit part / rabbit stage]  
  - Criteria for "one gavagai": [e.g., one animal / one attached part / one time-slice]  
  - "Tu" (same) means: [e.g., same animal / same fusion of parts / same perduring rabbit]  
  - "Pa" (part of) means: [e.g., spatial part / subpart / part of a stage]  
  ```  

