  ### **2. Minute-by-Minute Timeline (90 Minutes Total)**  
  **Phase 0: Setup (5 min)**  
  - 0:00–0:05: Introduce activity.  
    - "Today, you're field linguists in the Emba valley. I'm your Embe informant. I can only grunt (yes) or click (no). No other communication. You have: assent/dissent meanings, plus 'tu' (same) and 'pa' (part of) pre-translated. Your job: decode 'gavagai' using this card deck."  
    - Split into Teams A, B, C, D. Give Team D their secret brief privately.  
    - Distribute 40-card decks.  

  **Phase 1: Data Analysis (20 min)**  
  - 0:05–0:25: Teams analyze cards to build a translation manual.  
    - **Keep students on track**: Circulate and enforce "no direct questions to informant." If teams ask for new stimuli, say: "Work with the cards first."  
    - **Expected outcome**: Most teams converge on "whole rabbit," but some may flirt with parts/stages.  

  **Phase 2: Manual Testing (15 min)**  
  - 0:25–0:40: Teams write manuals (using template) and predict responses for 12 held-out cards.  
    - Collect manuals. Reveal held-out responses. All teams "score perfectly" (by design).  
    - **Punchline**: "All your manuals predicted 12/12 correctly. But let's see what you came up with..."  

  **Phase 3: Breaking Manuals (20 min)**  
  - 0:40–1:00: Teams swap manuals (A↔B, C↔D).  
    - **Task**: Design one field procedure (new query + stimulus) to break the other team's manual. E.g., "Show a rabbit ear behind a rock and ask 'Gavagai?'"  
    - Teams submit procedures. You respond instantly (grunt/click) based on your neutral table (always matches whole-rabbit manual).  
    - **Sting**: Every procedure gets the *same* response under both manuals. "Huh, no manual broke!"  

  **Phase 4: Package-Deal Shift (10 min)**  
  - 1:00–1:10: Team D presents their manual (e.g., "gavagai = undetached parts; 'tu' = same animal; 'pa' = subpart").  
    - Show it predicts all 40+12 responses correctly.  
    - **Reveal**: "This is Quine's point: reference is inscrutable with behavioral data alone."  

  **Debrief (20 min)**  
  - 1:10–1:30: Guided discussion (script below).  

  ---

  ### **3. Debrief Script: Mapping Activity to Quine**  
  **Transition (1:10–1:15)**: "Let's unpack what happened. Why did all manuals work? What does this say about meaning?"  

  - **Stimulus Meaning and Reference Fixing (1:15–1:18)**:  
    > "In Phase 1, you had stimulus meanings: patterns of assent/dissent to queries under sensory stimuli. Quine argues this is *all* the evidence available in radical translation. But as you saw, it can't fix reference—your manuals disagreed on what 'gavagai' picks out (rabbit/part/stage) yet predicted identical responses. Why? Because reference isn't determined by stimuli alone; it's underdetermined."  

  - **The Three-Way Tie and Evidential Gaps (1:18–1:20)**:  
    > "The tie between rabbit/part/stage wasn't resolvable with more data of the same kind (Phase 3). Why? Any new test (e.g., asking about a half-hidden rabbit) could be 'explained away' by reinterpreting 'tu' or 'pa.' Quine calls this the 'doctrine of collateral information'—auxiliary terms absorb the slack. This isn't just 'not enough evidence'; it's that evidence is *insufficient in principle* to isolate one interpretation."  

  - **Not Skepticism About Other Minds (1:20–1:22)**:  
    > "Some of you thought this was skepticism about other minds. It's not. Quine isn't saying we can't know what natives believe; he's saying there's *no fact of the matter* about reference beyond stimulus meaning. Your manuals had the same truth conditions for sentences ('gavagai here!' is true iff rabbit present) but different ontologies (rabbit vs. part)."  

  - **Answering Objections (1:22–1:25)**:  
    - **"Just ask them!"**:  
      > "In real fieldwork, you'd ask! But radical translation assumes no shared language—we're building the first manual. Asking 'What do you mean?' requires knowing 'mean' in Embe! Quine's point is that translation starts from scratch, so behavioral evidence is foundational."  
    - **Your Flatmate's Real-Fieldwork Objection**:  
      > "Your flatmate is right: real linguists use bilinguals, years of data, and context. But Quine isn't doing anthropology; he's a philosopher asking, 'What fixes reference fundamentally?' He argues that even with infinite data, inscrutability remains because the data is still just stimuli. Bilinguals kick the can down the road—how was *their* reference fixed?"  

  - **Indeterminacy at Home (1:25–1:28)**:  
    > "This applies to you and me right now. When I say 'rabbit,' do I mean rabbit, stage, or cosmic rabbit stage? You can't tell from my behavior alone. Quine's punchline: reference is relative to a translation manual, even between speakers of the 'same' language."  

  - **Limitations to Acknowledge (1:28–1:30)**:  
    > "Two caveats:  
    > 1. This activity shows underdetermination by *this* evidence, not that *no* evidence could decide. Quine claims stronger: no evidence *could* fix reference, but we only simulated a finite corpus.  
    > 2. We made it look like an evidential gap, but Quine says it's ontological—no fact of the matter. We fudged this by simplifying 'tu' and 'pa' as gives. In reality, they'd be inscrutable too!"  

  **Close (1:30)**: "Quine's point: meaning is grounded in public behavior, but reference floats. Next week, we'll ask if this sinks semantics or frees it."  

