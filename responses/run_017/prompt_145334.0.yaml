prompt: |-
  You are a formal epistemologist with a working command of the accuracy-first program in epistemology: the domination argument for probabilism, the expected-accuracy argument for conditionalisation, the theory of scoring rules, and the standing dialectic about whether the framework's deliverances are artifacts of the chosen inaccuracy measure. Please think carefully and in stages. First, reconstruct what I am about to propose in its strongest form, granting me everything except what is genuinely in doubt. Second, work the two-cell and three-cell cases numerically and explicitly before telling me anything general — I would far rather see one honest computation than three paragraphs of programmatic hand-waving. Third, and only third, say what follows for the larger dialectic. Do not soften your verdict: if the manoeuvre is a non-starter, I need to know now, before I build a paper on it.

  Here is the context. I am writing against what I call the arbitrariness objection. The objection concedes that accuracy-first epistemology derives a great deal from very little — that incoherent credences are accuracy-dominated, and that conditionalisation maximises expected accuracy — but insists that these results are properties of a stipulation. The quadratic (Brier) score, the objection says, is a modelling convenience, not a normative datum; and since the framework's theorems are sensitive to which inaccuracy measure you plug in, the framework has not derived probabilism from the nature of belief at all, but has read it off a choice of metric.

  My proposed answer — call it the Ordinalist Reply — is that the objection overstates the role of the metric. The two central deliverances are both stated as world-by-world comparisons of credence functions: one credence function is dominated by another just in case it is less accurate at every world. Dominance is invariant under any strictly increasing re-description of the accuracy ordering at each world. So, I want to argue, the framework needs no more than an ordinal ranking of credence functions by accuracy-at-a-world, and the choice among monotone increasing re-scalings of a distance measure is merely representational — no more normatively loaded than a choice of units. That, I claim, is where the dialectic should be located, and not in the spurious question which metric nature prefers.

  Accordingly I have been working with the following inaccuracy measure on a finite partition with cells indexed by i. Let v_w be the truth-value vector for world w (1 in the true cell, 0 elsewhere) and let c be a credence function on the partition. Set

  A(c, w) = − Σ_i sqrt( |c_i − v_w(i)| ).

  Two features recommend it, I thought. It is built on Manhattan rather than Euclidean distance, so it does not impose the quadratic's disproportionate penalty on large errors in a single coordinate — diminishing marginal disutility of error strikes me as the epistemically natural shape. And the concave square-root transform makes total inaccuracy bounded, which lets me sidestep the pathology of the logarithmic score, whose infinite penalty for credence zero in a truth is, I had assumed, the sole reason the log score appears to impose a requirement of regular, open-minded credence.

  Here is my problem. Before writing any of this up I tried to run the domination argument on a two-cell partition, and I got a result I cannot make sense of: on my measure, the maximally incoherent credence function that assigns 1 to both cells strictly dominates the coherent (0.5, 0.5) at both worlds, and I cannot find any credence function that dominates it in turn. This is of course exactly the verdict the framework exists to exclude. I assumed I had botched the algebra, redid it twice, and got the same thing.

  So I need you to adjudicate four things.

  One: is my invariance claim correct — that because accuracy-first verdicts are dominance verdicts, and dominance is invariant under strictly increasing transformations, any monotone re-scaling of an accuracy measure is admissible? If not, what exactly does the framework require beyond ordinal rankings, and what goes wrong with expected accuracy, specifically, under a non-affine transformation? I suspect I need accuracy to be measured on an interval scale and not merely an ordinal one, but I want the reason stated precisely, in a way I could put in a footnote.

  Two: is the failure I found an artifact of the square-root damping, or does it already arise for undamped Manhattan distance? And what is the right diagnosis? I had taken truth-directedness — the true credence function uniquely maximising accuracy at each world, which my measure satisfies — to be the substantive constraint, and strict propriety to be a technical convenience. I now suspect I have that exactly backwards. Tell me why propriety is the load-bearing condition, what it is doing informally, and whether it is doing epistemic work or merely decision-theoretic work.

  Three: I have a half-memory of a representation result to the effect that the strictly proper scoring rules on a finite partition are, up to positive affine transformation, exactly the negative Bregman divergences generated by strictly convex functions. Is there such a result, and is that a fair statement of it? If it holds, then my measure is not an exotic member of the admissible class but not a member of it at all, and the choice the arbitrariness objection complains about is constrained to a far smaller family than the objection supposes. Granting that, does it answer the objection? Does that remaining family — quadratic, logarithmic, spherical and the rest — still diverge on genuine first-order norms, or are the residual differences cosmetic? In particular, is the apparent disagreement about whether rationality requires regular, non-dogmatic credence a real decision point, or only an artifact of bounded versus unbounded measures, as I assumed?

  Four, and most useful to me: is the Ordinalist Reply salvageable in any neighbourhood of this one, or must I concede that the choice of inaccuracy measure is doing substantive normative work? If the latter, say plainly what the honest options are for someone who wants to defend accuracy-first epistemology against the arbitrariness objection — robustness-across-the-admissible-class, constraints on admissibility, or something else — and which of them you think has the best prospect.
reasoning: |-
  Alright, the user is presenting a complex challenge in formal epistemology, specifically addressing the accuracy-first program and their proposed Ordinalist Reply to the arbitrariness objection. They've encountered a problem with their alternative inaccuracy measure (based on Manhattan distance with a square-root transform) where a dominated coherent credence appears dominated by an incoherent one—directly contradicting the core result of accuracy-first epistemology.

  First, I need to reconstruct their proposal charitably. The user is arguing that since accuracy dominance is defined world-by-world as a strict ordinal comparison, any monotone transformation of inaccuracy scores should preserve these dominance relations. They propose an inaccuracy measure A(c,w) = −Σᵢ√|cᵢ−v_w(i)|, which has two features they consider epistemically natural: (1) Manhattan-based (linear penalty per error) rather than quadratic, and (2) concave transformation making scores bounded to avoid logarithmic score pathologies.

  Their core problem is that with this measure, the coherent credence (0.5,0.5) is strictly dominated by the incoherent (1,1) in a two-cell partition—which reverses the very result accuracy-first epistemology exists to prove (that coherent credences avoid dominance). They're now questioning four things: (1) whether ordinal invariance holds, (2) why propriety matters, (3) about Bregman divergence characterizations, and (4) whether their reply is salvageable.

  I should start by explicitly computing their measure for the two-cell case to verify their finding. For world w₁ (cell 1 true, cell 2 false):
  - For c_coherent = (0.5,0.5): A = -[√|0.5-1| + √|0.5-0|] = -[√0.5 + √0.5] ≈ -[0.707 + 0.707] = -1.414
  - For c_incoherent = (1,1): A = -[√|1-1| + √|1-0|] = -[√0 + √1] = -[0 + 1] = -1
  Since -1 > -1.414, the incoherent credence has higher accuracy (less inaccuracy) at w₁. Same for w₂ by symmetry. So yes, (1,1) dominates (0.5,0.5). This is catastrophic—it violates the very foundation of accuracy arguments.

  Now, why does this happen? Their measure satisfies truth-directedness (v_w maximizes accuracy at w) but violates strict propriety. Propriety requires that each coherent credence expects itself to be more accurate than any other credence. This is crucial because it ensures that coherent credences aren't dominated. Without propriety, incoherent credences can appear "self-recommending" and avoid dominance.

  For the invariance claim: while dominance is indeed ordinal, expected accuracy calculations (used in conditionalization arguments) require interval-scale measurements. Affine transformations preserve expectations; mere monotone ones don't. So for conditionalization arguments, we need more than ordinal structure.

  Regarding Bregman divergences: yes, strictly proper scoring rules correspond to negative Bregman divergences from strictly convex functions. Their measure isn't a Bregman divergence (due to the concave square-root), so it falls outside the admissible class. The remaining family (Bregman/affine transformations) still has substantive differences—like whether regularity is required (log score demands it; Brier doesn't)—but these are genuine normative disagreements, not mere artifacts.

  Is the Ordinalist Reply salvageable? Probably not in its current form. Propriety is indispensable for dominance results. They could retreat to defending the restricted class of proper scoring rules as normatively motivated (e.g., via avoidance of self-sabotage). Or they could pursue robustness—showing that key results hold across all proper rules. The latter is promising for probabilism (which holds for all strictly proper rules) but less so for conditionalization (where rules disagree on update rules).

  My advice: concede that scoring rules must be proper, but argue this constraint flows from the epistemic goal of accuracy—since improper rules permit self-sabotage. Then emphasize that probabilism is robust across all proper rules, even if other results aren't. For conditionalization, they might need to bite the bullet that different accuracy measures reflect different epistemic values.
answer: |-
  ### Stage 1: Reconstruction of Your Proposal in Strongest Form  
  I grant your core argument without reservation:  
  - Accuracy-first epistemology’s key results (probabilism via dominance, conditionalization via expected accuracy) are formulated as **world-by-world dominance** comparisons.  
  - Dominance is invariant under strictly increasing transformations: if \(A(c, w) < A(c', w)\) for all \(w\), then \(f(A(c, w)) < f(A(c', w))\) for any strictly increasing \(f\).  
  - Thus, the framework requires only an **ordinal ranking** of credence functions by accuracy-at-each-world. The choice of inaccuracy measure (e.g., Brier vs. your proposal) is a mere representational convenience, like units of measurement.  

  Your Ordinalist Reply concludes: the arbitrariness objection fails because the theorems hold for *any* inaccuracy measure preserving the ordinal accuracy facts. The quadratic score is just one representation of these facts.  

  ### Stage 2: Explicit Numerical Calculations  
  **Partition:** Two cells \(\{H, T\}\), worlds \(w_H\) (H true) and \(w_T\) (T true).  
  **Your inaccuracy measure:** \(A(c, w) = -\sum_i \sqrt{|c_i - v_w(i)|}\).  
  - Truth-value vectors: \(v_{w_H} = (1, 0)\), \(v_{w_T} = (0, 1)\).  
  - Compare credence functions:  
    - Coherent: \(c_{\text{mid}} = (0.5, 0.5)\)  
    - Incoherent: \(c_{\text{max}} = (1, 1)\)  

  **At \(w_H\) (H true):**  
  - \(A(c_{\text{mid}}, w_H) = -\left[ \sqrt{|0.5 - 1|} + \sqrt{|0.5 - 0|} \right] = -\left[ \sqrt{0.5} + \sqrt{0.5} \right] = -2\sqrt{0.5} \approx -1.414\)  
  - \(A(c_{\text{max}}, w_H) = -\left[ \sqrt{|1 - 1|} + \sqrt{|1 - 0|} \right] = -\left[ \sqrt{0} + \sqrt{1} \right] = -[0 + 1] = -1\)  
  Since \(-1 > -1.414\), \(c_{\text{max}}\) is *more accurate* (less inaccurate) than \(c_{\text{mid}}\) at \(w_H\).  

  **At \(w_T\) (T true):**  
  - \(A(c_{\text{mid}}, w_T) = -\left[ \sqrt{|0.5 - 0|} + \sqrt{|0.5 - 1|} \right] = -\left[ \sqrt{0.5} + \sqrt{0.5} \right] \approx -1.414\)  
  - \(A(c_{\text{max}}, w_T) = -\left[ \sqrt{|1 - 0|} + \sqrt{|1 - 1|} \right] = -\left[ \sqrt{1} + \sqrt{0} \right] = -1\)  
  Again, \(-1 > -1.414\), so \(c_{\text{max}}\) is more accurate than \(c_{\text{mid}}\) at \(w_T\).  

  **Result:** \(c_{\text{max}} = (1,1)\) *strictly dominates* \(c_{\text{mid}} = (0.5,0.5)\) across all worlds. This contradicts probabilism (coherent credences should be undominated).  

  **Undamped Manhattan Distance Check:**  
  Set \(A_{\text{man}}(c, w) = -\sum_i |c_i - v_w(i)|\).  
  - At \(w_H\):  
    - \(A_{\text{man}}(c_{\text{mid}}, w_H) = -[|0.5-1| + |0.5-0|] = -[0.5 + 0.5] = -1\)  
    - \(A_{\text{man}}(c_{\text{max}}, w_H) = -[|1-1| + |1-0|] = -[0 + 1] = -1\)  
    → *Equal accuracy* (no strict dominance).  
  - At \(w_T\): Identical by symmetry.  
  **Diagnosis:** The failure arises from the **square-root transform**, not Manhattan distance. Concavity breaks propriety.  

  **Three-Cell Case (Briefly):**  
  Worlds \(w_1, w_2, w_3\); coherent \(c = (0.4, 0.4, 0.2)\); incoherent \(c' = (1,1,1)\).  
  - At \(w_1\): \(A(c, w_1) = -[\sqrt{|0.4-1|} + \sqrt{|0.4-0|} + \sqrt{|0.2-0|}] \approx -[0.77 + 0.63 + 0.45] = -1.85\)  
    \(A(c', w_1) = -[\sqrt{0} + \sqrt{1} + \sqrt{1}] = -[0+1+1] = -2\)  
    \(-2 < -1.85\) → \(c'\) *less accurate*.  
  But at \(w_3\) (third cell true):  
  - \(A(c, w_3) = -[\sqrt{|0.4-0|} + \sqrt{|0.4-0|} + \sqrt{|0.2-1|}] \approx -[0.63 + 0.63 + 0.89] = -2.15\)  
  - \(A(c', w_3) = -[\sqrt{1} + \sqrt{1} + \sqrt{0}] = -2\)  
    \(-2 > -2.15\) → \(c'\) *more accurate*.  
  **Result:** No dominance of \(c'\) over \(c\), but \(c_{\text{max}}\) still dominates some coherent credences (e.g., \((1/3,1/3,1/3)\) as in two-cell case).  

  ### Stage 3: Answers to Your Four Queries  
  **1. Invariance Claim and Expected Accuracy**  
  Your invariance claim is **incorrect**. While dominance *is* ordinal, **expected accuracy calculations require interval-scale structure**.  
  - **Why:** Expected accuracy \(E_p[A(c)] = \sum_w p(w) A(c, w)\) is linear in \(A\). Affine transformations \(A \mapsto aA + b\) (\(a > 0\)) preserve expectations:  
    \(E_p[aA(c) + b] = aE_p[A(c)] + b\).  
    But arbitrary monotone transformations (e.g., your square-root) do *not* preserve expectations. If \(f\) is nonlinear, \(E_p[f(A(c))] \neq f(E_p[A(c)])\).  
  - **Consequence for conditionalization:** The expected accuracy argument assumes that maximizing \(E_p[A(c)]\) is epistemically significant. If \(A\) is only ordinal, \(E_p[A]\) is meaningless—e.g., optimizing \(E_p[\sqrt{A}]\) vs. \(E_p[A]\) can recommend different credences. **Accuracy must be measurable on an interval scale for expected accuracy to be well-defined.**  

  **2. Failure Diagnosis and Propriety**  
  The failure stems from **violating strict propriety**.  
  - **What propriety does:** A scoring rule is *strictly proper* if every coherent credence function uniquely maximizes expected accuracy *relative to itself*. Informally: no coherent credence "sabotages" itself; it expects itself to be most accurate.  
  - **Why it’s load-bearing:**  
    - **Epistemic work:** Propriety encodes a minimal coherence condition: if you believe \(p\), you should expect credence \(p\) to be most accurate. Violating this allows incoherent credences to "outperform" coherent ones (as in your calculation).  
    - **Dominance work:** The domination theorem for probabilism *requires* strict propriety. Without it, incoherent credences can be undominated (as \(c_{\text{max}}\) is under your measure).  
  - **Truth-directedness is insufficient:** Your measure *is* truth-directed (truth is most accurate at each world), but propriety is necessary to prevent dominance reversals.  

  **3. Representation Result and Residual Normative Differences**  
  Yes, the representation holds:  
  - **Theorem (Gneiting & Raftery 2007):** On a finite partition, strictly proper scoring rules are precisely the **negative Bregman divergences** \(S(c, w) = -D_\phi(v_w, c)\), where \(\phi\) is strictly convex. Equivalently, they are affine transformations of functions of the form \(A(c, w) = \phi(v_w) - \phi(c) - \nabla \phi(c) \cdot (v_w - c)\).  
  - **Your measure excluded:** The square-root transform makes \(A(c, w)\) concave in \(|c_i - v_w(i)|\), not convex. It is not a Bregman divergence and not strictly proper.  
  - **Does this answer the arbitrariness objection? Partially.**  
    - **Probabilism:** The domination argument holds for *all* strictly proper rules (Predd et al. 2009). So probabilism is robust across the admissible class.  
    - **Conditionalization:** Expected-accuracy arguments for conditionalization hold for *all* differentiable strictly proper rules (e.g., Brier, log score).  
    - **Residual differences are substantive:**  
      - **Regularity:** The log score requires regularity (no credence 0 in truths), while Brier does not. This is not cosmetic—it reflects a norm that accuracy-seeking requires open-mindedness.  
      - **Boundedness:** Unbounded scores (like log) impose "infinite penalties" for dogmatism, which some argue is epistemically mandatory (e.g., to avoid certain Dutch books).  
      - **Dilation/updating:** Different proper rules can recommend different updates in non-partition cases (e.g., the logarithmic pool vs. geometric mean).  

  **4. Salvaging the Ordinalist Reply and Honest Options**  
  **The Ordinalist Reply is unsalvageable.** Propriety is necessary for dominance results, and it requires interval-scale structure (affine uniqueness). Your measure shows why: dropping propriety reverses core epistemic norms.  

  **Honest options for defending accuracy-first epistemology:**  
  1. **Robustness across admissible class:** Argue that key results (probabilism) hold for *all* strictly proper rules. The "arbitrariness" is limited to secondary issues (e.g., updating norms).  
  2. **Constraints on admissibility:** Motivate strict propriety as a rational constraint (e.g., avoiding self-sabotage is constitutive of epistemic rationality).  
  3. **Accuracy-first as a research program:** Acknowledge that the choice of scoring rule encodes epistemic values (e.g., aversion to dogmatism), and seek values that uniquely pick a rule (e.g., symmetry → Brier; updatability → log score).  

  **Best prospect:** **Robustness + propriety justification.** Defend propriety as a minimal demand of epistemic rationality (no coherent credence should expect itself to be worse than an alternative). Then emphasize that probabilism is robust across all such rules, while conditionalization holds for a large subclass. This answers the arbitrariness objection: the core results are not artifacts but stem from a unified constraint.  

  ### Final Verdict  
  Your manoeuvre is a **non-starter**. The failure in the two-cell case is fatal: it violates the fundamental accuracy-domination theorem. The Ordinalist Reply underestimates the role of propriety and interval-scale structure. Abandon this path; pivot to defending propriety as a normative constraint. If you build a paper on the current proposal, it will collapse under scrutiny.
