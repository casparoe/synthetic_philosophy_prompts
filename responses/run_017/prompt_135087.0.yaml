  ### Which Aggregator Are You Actually?  
  *Discover your contractualist aggregation style through concrete cases.*

  ---

  #### **Case 1: The Itch vs. The Wrist**  
  You can prevent one person from suffering a broken wrist, or prevent 1,000,000 people from each suffering a barely noticeable itch. Which do you choose?  
  - A) Prevent the broken wrist.  
  - B) Prevent the itches.  

  #### **Case 2: One Life, Many Itches**  
  For a single person, you can either prevent a broken wrist next week or prevent 1,000,000 barely noticeable itches spread over the next year. Which do you choose?  
  - A) Prevent the broken wrist.  
  - B) Prevent the itches.  

  #### **Case 3: Risk Distribution**  
  Policy X: 10,000 people each face a 1-in-10,000 risk of a serious injury (e.g., losing a hand).  
  Policy Y: One identified person suffers the injury for certain.  
  Which policy is preferable?  
  - A) Policy X (spread the risk).  
  - B) Policy Y (concentrate the harm).  

  #### **Case 4: Burden Relief vs. Benefit**  
  You can either relieve one person’s severe chronic pain or provide 10,000 people with a week of euphoric happiness (e.g., via a safe, temporary enhancement). Which do you choose?  
  - A) Relieve the chronic pain.  
  - B) Provide the happiness.  

  #### **Case 5: Limb vs. Fingertips (n=1,000)**  
  You can prevent one person from losing a leg or prevent 1,000 people from each losing the tip of a fingertip. Which do you choose?  
  - A) Prevent the lost leg.  
  - B) Prevent the fingertip losses.  

  #### **Case 6: Limb vs. Fingertips (n=100,000)**  
  You can prevent one person from losing a leg or prevent 100,000 people from each losing the tip of a fingertip. Which do you choose?  
  - A) Prevent the lost leg.  
  - B) Prevent the fingertip losses.  

  #### **Case 7: Repeated Tradeoffs**  
  You face the same choice five times: Prevent one broken wrist or prevent 10,000 barely noticeable itches. Each instance involves new people. You must pick one policy for all five:  
  - A) Always prevent the broken wrists (5 wrists total).  
  - B) Always prevent the itches (50,000 itches total).  

  #### **Case 8: Small Benefit Multiplier**  
  You can give one person a significant benefit (e.g., curing a moderate, lifelong inconvenience) or give 1,000,000 people a barely noticeable benefit (e.g., a pleasant 5-minute experience). Which do you choose?  
  - A) Help the one person substantially.  
  - B) Help many people trivially.  

  #### **Case 9: Threshold Rescue**  
  You can rescue one person from severe malnutrition (leaving them disabled but alive) or prevent 1,000 people from losing a hand (they remain healthy and productive). Which do you choose?  
  - A) Rescue from malnutrition.  
  - B) Prevent hand losses.  

  #### **Case 10: Equal Burdens, Different Numbers**  
  You can save one person from a broken wrist or save five people from broken wrists. All injuries are identical. Which do you choose?  
  - A) Save the one.  
  - B) Save the five.  
  - C) Morally indifferent; flip a coin.  

  #### **Case 11: Harming vs. Not Helping**  
  Option A: You break one person’s wrist.  
  Option B: You allow 100,000 people to each suffer a barely noticeable itch (which you could have prevented).  
  Which is worse?  
  - A) Breaking the wrist.  
  - B) Allowing the itches.  

  #### **Case 12: Chance vs. Tiny Certain Harm**  
  Policy X: Impose a 1-in-100,000 risk of blindness on 100,000 people.  
  Policy Y: Impose a certain, barely noticeable headache on one person.  
  Which policy is preferable?  
  - A) Policy X (risk of blindness).  
  - B) Policy Y (certain headache).  

  ---

  ### Scoring Key  
  Tally your answers and match the pattern to a leaf. (A=1, B=2, C=3 for Case 10).  

  | Leaf Position                              | Answer Pattern (Cases 1–12)                                                                 | Notes                                                                 |
  |--------------------------------------------|-------------------------------------------------------------------------------------------|-----------------------------------------------------------------------|
  | **Full interpersonal aggregation**         | 2,2,1,2,2,2,2,2,2,2,2,2                                                                  | All burdens/benefits aggregate, no exceptions.                       |
  | **Risk-only aggregation**                  | 1,2,1,1,1,1,1,1,1,2,1,1                                                                  | Aggregates chances, not small actual burdens.                        |
  | **Numbers as tie-breaker**                 | 1,1,2,1,1,1,1,1,1,2,1,2                                                                  | No aggregation unless complaints are equal in severity.              |
  | **Within-life aggregation only**           | 1,2,2,1,1,1,1,1,1,3,1,2                                                                  | Aggregates within one life, never across lives.                      |
  | **Severity-first (lexical priority)**      | 1,1,2,1,1,1,1,1,2,2,1,2                                                                  | Worst-off individual trumps any number of lesser burdens.            |
  | **Threshold view**                         | 1,2,2,1,1,1,1,1,1,2,1,2                                                                  | Aggregate only when all are above a minimum threshold (e.g., basic needs). |
  | **Strict no-aggregation**                  | 1,1,2,1,1,1,1,1,1,3,1,2                                                                  | Burdens incomparable across persons; maximize worst outcome.        |
  | **Person-affecting restriction**           | 2,2,1,1,2,2,2,1,2,2,2,1                                                                  | Minimize number of people harmed; benefits often ignored.            |

