  Okay, let me tackle this step by step. The user is a couples counselor with 15 years of experience noticing a specific psychological flip in partners dealing with betrayal. They've observed two distinct frames: one where the partner holds the other accountable (reactive) and another where they view them mechanistically as a problem to fix (objective). The key is the flip between these frames, which isn't about changing beliefs but about a shift in stance that can be consciously controlled. 

  First, I recall Strawson's reactive vs. objective attitudes. The user says Strawson feels close but wrong because the objective stance here maintains engagement, not withdrawal, and is switchable. Forgiveness doesn't fit either because it resolves things, whereas this flip leaves things unsettled. 

  Hmm, what other concepts could work? Maybe "cognitive reframing"? But that usually involves belief changes, which the user explicitly denies here. The beliefs stay the same; it's the relational mode that shifts. Then there's "emotional regulation strategies," like reappraisal. That's closer because clients use the objective frame deliberately to manage emotions during stressful times. But reappraisal typically alters the emotional meaning by changing the thought, which doesn't align with the user's observation that beliefs remain unchanged. 

  Another idea: "perspective-taking" in psychology. But perspective-taking usually builds empathy by imagining another's viewpoint, which might change feelings. Here, the objective frame isn't necessarily about empathy—it's more detached, like fixing a leaky pipe. The reactive frame is already empathetic in a way, focused on mutual accountability. So that doesn't fit perfectly. 

  Wait, what about "mentalization"? That involves understanding mental states in oneself and others. Switching frames could be a form of mentalization where the partner toggles between seeing the other as an agent versus an object of care. But mentalization is more about understanding than a strategic stance shift. 

  The user needs a term for the toggle itself. Since existing terms don't capture the voluntary, belief-consistent switch between engagement modes, coining a new term makes sense. "Relational stance shifting" emphasizes the deliberate change in relational mode. Or "accountability suspension"? That highlights putting the reactive attitude on hold without forgiving or excusing. 

  Boundary cases: If someone shifts to the objective frame and feels detached, that's the stance. If they start excusing the behavior (changing beliefs), it's not. If the shift happens involuntarily, it's not this deliberate toggle. 

  To address the user's question about belief change: If beliefs changed, the partner might say, "I used to think she chose to lie, but now I see her trauma made her incapable of choice." But in the flip, they'd say, "I know she could choose, but right now I need to handle this practically." Internally, the key is whether the childhood factors are seen as explanations (flip) versus excuses (belief change).
answer: |-
  Based on your description and the careful distinctions you've drawn, let's carve this concept. We'll evaluate three near-miss concepts, reject them based on your clinical observations, and then define the phenomenon you're seeing. Finally, we'll address how to distinguish it from belief change.

  **Candidate 1: Strawson's "Reactive" vs. "Objective" Attitude Flip**  
  *Why it misses:*  
  - **Withdrawal vs. Engagement:** Strawson's objective stance involves detachment – treating the person as "not responsible" in a way that suspends *relational engagement*. Your clients maintain engagement (setting up transfers, staying in relationship) but change the *mode* of engagement.  
  - **Involuntary vs. Volitional:** Strawson’s shift is often framed as a response to perceived incapacity (e.g., mental illness), not a tool wielded strategically for coping ("getting through tax season").  
  - **Stability:** Your phenomenon is reversibly *toggled*, not a stable reclassification. The anger "comes back years later" – incompatible with Strawson’s view of the objective stance as dissolving reactive attitudes.  
  **→ Verdict:** Captures the *duality* but not the *functional flexibility* or *relational persistence*.

  **Candidate 2: Cognitive Reappraisal**  
  *Why it misses:*  
  - **Belief Consistency:** Reappraisal typically involves reinterpreting events to alter emotional meaning (e.g., "She lied because she’s weak" → "She lied because she was traumatized"). You explicitly note beliefs *don’t change* – the childhood explanation is present in both frames but *framed differently* (excuse vs. context).  
  - **Emphasis:** Reappraisal focuses on emotion regulation. Your phenomenon is about **relational ontology** – what the partner *is* in that moment (accountable agent vs. object of care/management).  
  **→ Verdict:** Captures the *voluntary* and *functional* aspects but not the *stable-belief, shifting-relational-status* core.

  **Candidate 3: Forgiveness (or Prelude to Forgiveness)**  
  *Why it misses:*  
  - **Settled vs. Suspended:** Forgiveness resolves the debt; it’s "case closed." Your clients suspend the demand without canceling it. The reactive frame can re-emerge intact – impossible post-forgiveness.  
  - **Moral Release:** Forgiveness typically involves relinquishing resentment or claims. In your second frame, resentment is *bypassed* or *set aside*, not relinquished. The "leaking pipe" stance isn’t moral mercy; it’s *temporary moral circumvention*.  
  **→ Verdict:** Captures a *shift in demands* but not the *provisional, non-resolutionary* character.

  **The Carved Concept: Accountability Suspension**  
  *(Not just a label – the definitional boundaries below are the concept)*  

  **Core Phenomenon:** A volitional, reversible shift in **relational stance** toward a moral agent, where:  
  1. **Reactive Stance:** The other is engaged as a **participant in moral reciprocity** – owed accounting/apology, subject to resentment/binding norms.  
  2. **Suspended Stance:** The other is engaged as a **focus of causal management or care** – where their actions are problems to solve or wounds to tend, *without* activating demands for moral recognition.  
  3. **The Flip ("Accountability Suspension"):** The deliberate act of *toggling* between these stances *while preserving identical factual beliefs* about capacity, history, or blameworthiness. The suspension is a **pragmatic maneuver**, not a moral verdict.  

  **Boundary Cases:**  
  - **Inside:** A husband, after discovering an affair, says: *"I know she chose this, knows it was wrong, and owes me answers. But right now, with her mother dying, I need to caretake her grief. I’ll deal with my fury later."* Beliefs intact; stance shifted strategically.  
  - **Outside (Belief Change):** *"I used to think she chose the affair, but now I see her attachment trauma made genuine consent impossible. She couldn’t have done otherwise."* Stance shift follows belief revision.  
  - **Outside (Forgiveness):** *"I release her from the debt she owes me. What she did was wrong, but I’ve let go of my claim against her."* Moral accounting closed, not suspended.  
  - **Outside (Strawsonian Objectivity):** *"Her personality disorder means she isn’t morally responsible. I can only manage her symptoms."* Stable excusing condition applied, not toggled.  

  **Distinguishing from Belief Change (From the Inside):**  
  - **Belief-Change Version:** The partner would experience an *epistemic shift*. Feeling anger in Frame 1 would later feel *unjustified* or *irrational* after adopting Frame 2 ("How could I have been so harsh? Now I understand it wasn’t really *her* fault"). The new belief dissolves the basis for the reactive stance.  
  - **Your Phenomenon:** The partner in Frame 2 feels anger is *inappropriate **right now*** or *counterproductive to current goals*, **not** that it was ever *unjustified*. They might think: *"My anger is valid, but I’m choosing not to feel it today so I can get us through this crisis."* The factual judgment ("She wronged me") remains accessible and feels truth-apt if accessed.  
  - **Internal Tell:** Ask: *"If you let yourself dwell on what she did **right now**, would your anger feel like a mistake, or like something you’re deliberately not indulging?"* In the flip, it’s the latter.  

  **Why "Accountability Suspension" Fits:**  
  - **Suspension:** Implies *temporary deferral* (not erasure) of a claim.  
  - **Accountability:** Specifies the *nature of the claim* being deferred (moral answerability).  
  - **Relational:** Embeds it in the interpersonal dynamic you observe.  
  - **Volitional:** Captures the "stepping into" agency you describe.  

  **What Would Make You Wrong?**  
  If clients discovered, upon probing, that their factual beliefs *about capacity or blameworthiness* subtly shifted during the flip (e.g., "When I’m fixing the problem, I guess I *do* think she couldn’t control it"), this would be belief-mediated. But your observation that beliefs are "word-for-word identical" suggests a direct stance shift – a change in *moral posture*, not moral perception. The phenomenon lives in the space between *judgment* and *engagement*.
