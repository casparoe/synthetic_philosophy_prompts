prompt: |-
  I work on the product governance team at a savings and investing app — around three million users, mostly people who've never invested before, and most of them on their phone at 11pm. Every proposed change to the app comes past me for a half hour review before it can ship: I write a one pager, and it has to be signed off by our head of product and by legal, neither of whom has any philosophy and both of whom will read two pages maximum. We look at four or five flows a month. The argument we keep having is whether a flow is *taking advantage* of people, and it goes in circles because everyone in the room is using a different test without noticing. I was arguing about this with a mate who did a philosophy degree and he said the thing I'm groping at is the money pump argument, so I've been reading a bit on my own and it feels exactly right but I can't get from the idea to something I can run on a Tuesday afternoon. The bit that seems to matter and that nobody here can articulate is the difference between a set of preferences that can be exploited in one go — you lay out a menu and whichever way they choose they lose — and a *sequence* of choices where each individual choice looks perfectly sensible to the person making it at the time and the damage only shows up when you add them up. Our head of product says if each step is fine then the whole thing is fine and I'm pretty sure that's the exact mistake but I can't say why in words he'd accept.

  We've drifted into four rough labels in my notes and I suspect they're doing philosophical work I haven't noticed: 'rake' (we take a fixed cut on a transaction, that's just a fee, nobody minds), 'switchback' (the flow gets someone to move back and forth between two states and pay each time), 'treadmill' (nothing cycles, but the framing keeps restarting the same decision so it gets made over and over), and 'pump' (saved for when someone ends up strictly worse off and nothing they value got produced along the way). I think 'treadmill' might actually be the interesting one rather than the boring one but I can't defend that. So: write me a decision procedure, in the order I should ask the questions, that comes out of what this literature actually says — the questions in order, what counts as a sufficient answer to each, which questions should end in a hard no, and which ones have to be handed to a human being because they're a values call dressed up as a factual one. It needs to survive being read by a lawyer and a data scientist who will both push back. There are some cases I specifically need it to handle. Our legal person's favourite test is 'would the user have agreed to the whole sequence up front?' and I don't trust it but I don't know what's wrong with it. Then there's the user who knows they'll end up slightly poorer and does the whole thing anyway because fiddling with the app is the fun part — if the process is the product, is there any money pump left? And the user whose preferences genuinely shift mid-sequence because they learned something, which feels like it should be completely fine and not exploitative at all. Also: is a hundred tiny losses the same objection as one large one, or does the smallness of each step actually matter to the argument? Our data scientist says we should just A/B test everything and look at whether users end up with less money, and I want to know why that isn't sufficient, if it isn't — partly because we can't run clean experiments on things that have already shipped. And one thing that genuinely bugs me: if these flows really were exploiting an incoherence in someone's preferences, wouldn't we expect some users to just bleed out completely? They don't. So is the whole idea secretly unfalsifiable, or does that tell us something about which version of the argument to use?

  Run it on three flows. First: a streak feature where if you'd miss a week you can pay two quid to freeze your streak, and the freeze button appears about four seconds after the missed week and nowhere else. Second: a switchback where users get a notification when markets fall nudging them into the safe pot and one when markets rise nudging them into the growth pot, fifty pence a swap, and the nudge copy is written to match whatever they said they wanted in onboarding. Third, and this is the one I actually need: boost tokens, where each month you get three free boosts that lift the rate on one of your pots for thirty days, you have to activate them by hand, they expire at month end, and the pot that's boosted rotates each month so people keep shuffling balances between pots — we shipped it eight months ago, it's our most used feature, engagement went up a lot, users say in the reviews that they enjoy it, and it's in our current marketing. If your procedure says we should pull it, say that plainly and tell me what I'd have to argue to the committee to keep it anyway, and be honest about whether your procedure can say anything useful about a feature that's already live and that we can't cleanly experiment on now.
reasoning: |-
  We are given a practical problem in product governance for a savings and investing app. The core issue is to distinguish between different types of potentially exploitative user flows and to develop a decision procedure that can be applied in a business context.

  The key insight from the money pump argument is that a sequence of individually rational choices can lead to an overall worse outcome due to inconsistent preferences. The challenge is to operationalize this insight into a set of questions that can be applied during a 30-minute review.

  We have four rough labels from the user's notes:
  - 'rake': fixed cut on a transaction (acceptable)
  - 'switchback': flow that induces repeated switching between two states with a fee each time
  - 'treadmill': the same decision is repeatedly presented, leading to multiple instances of the same choice
  - 'pump': the user ends up strictly worse off without any valued output

  The user also raises specific concerns:
  1. The head of product argues: if each step is fine, then the whole sequence is fine.
  2. The legal team's test: "would the user have agreed to the whole sequence up front?"
  3. The case of the user who enjoys the process (fiddling with the app) and accepts ending up slightly poorer.
  4. The user whose preferences change mid-sequence due to learning (which should be non-exploitative).
  5. Are many small losses the same as one large loss? Does the smallness matter?
  6. The data scientist suggests A/B testing for net monetary outcome, but the user is skeptical because of the inability to run clean experiments on shipped features and because the problem might be about more than just money.
  7. The observation that users don't "bleed out completely" — does that invalidate the money pump concern?

  We are also asked to run the procedure on three example flows.

  Let's break down the decision procedure step by step.

  ### Decision Procedure: Steps and Rationale

  The goal is to detect sequences that exploit preference inconsistencies (money pumps) and other exploitative patterns. The procedure must be:
  - Practical (fits in a review, produces a clear output)
  - Understandable by non-philosophers (product head, legal, data scientist)
  - Grounded in the money pump argument and related ideas

  We structure the procedure as a sequence of questions. Each question must have a clear pass/fail or a way to move to the next step. We aim to identify hard "no" conditions and conditions that require human judgment.

  #### Step 1: Identify the Sequence and Its Components
     - **Question**: What is the sequence of choices the user is making? Break it down into individual steps. For each step, note: 
          a. The decision the user is making.
          b. The immediate cost/benefit (if any) at that step.
          c. The context (time, state of the app, user's prior actions).
     - **Why?** We need to understand the structure of the flow to analyze it.
     - **Sufficient answer**: A clear step-by-step description of the flow, including triggers, choices, and immediate outcomes. If the flow is too complex to break down in the time, it might be a red flag for complexity.

  #### Step 2: Check for Static Exploitation (One-Off)
     - **Question**: If we consider the entire set of choices as presented at one time (like a menu), is there any choice the user can make that leaves them worse off than if they had not engaged at all? (This is the "rake" case if it's just a fee, but we are looking for a situation where every option is bad.)
     - **Why?** This is the classic one-off exploitation. If the user cannot avoid a loss by any choice, then the flow is exploitative.
     - **Hard no condition**: If every possible path through the flow results in a net loss (monetary or otherwise) without any offsetting benefit that the user values, then the flow is exploitative and should be rejected.
     - **Note**: If there is at least one path that doesn't result in a net loss (or if the loss is offset by a benefit the user might value), then we move to the next step.

  #### Step 3: Check for Preference Inconsistency Exploitation (Money Pump)
     - **Question**: Does the sequence of choices take advantage of inconsistent preferences by inducing repeated cycles or by leading the user through a path that, step by step, seems rational but in the end leaves them worse off without producing any value they wouldn't have gotten otherwise?
     - We break this into two parts:

     a. **Cycle Detection (Switchback/Treadmill)**:
          - **Question**: Does the flow encourage the user to repeatedly switch between states (e.g., two pots, two investment strategies) without any change in underlying fundamentals? And does each switch incur a cost?
          - **Sufficient answer**: If the flow is designed such that external triggers (not based on fundamental changes) cause the user to switch back and forth, and each switch has a cost, then it is a candidate for a switchback or treadmill.
          - **Hard no condition**: If the switching is induced by the app in a way that does not reflect a change in the user's underlying financial situation or goals (and the user is paying each time) and there is no educational or entertainment value that the user is knowingly paying for, then it is exploitative and should be rejected.

     b. **End State Check (Pump)**:
          - **Question**: After a complete cycle (or a typical sequence), does the user end up in a state that is strictly worse (e.g., less money, worse investment position) than if they had not started the sequence, and without having received any valued benefit (other than the avoidance of a loss that the app itself created)?
          - **Sufficient answer**: We must compare the starting state and the end state. If the user has less money and nothing else of value (like knowledge, entertainment, or a desired service) was provided, then it's a pump.
          - **Hard no condition**: If the user ends up strictly worse off without any offsetting benefit that they would have independently valued (and the loss is not a fee for a service they requested), then reject.

     - **Note**: This step requires judgment on what counts as a "valued benefit". We address that in Step 4.

  #### Step 4: Assess User Value and Autonomy
     - **Question**: Is there a clear, non-exploitative reason for the user to engage in the sequence? This includes:
          a. **Entertainment/Engagement Value**: Does the user derive enjoyment from the process itself? (e.g., the user who likes fiddling with the app)
          b. **Educational Value**: Does the user learn something that might change their future behavior?
          c. **Genuine Preference Shift**: Is there evidence that the user's preferences might change during the sequence due to new information (not just framing by the app)?
          d. **Transparency**: Is the entire structure of the sequence (including costs and the likelihood of repetition) clear to the user at the outset?
     - **Why?** This step addresses the head of product's argument (if each step is fine, then the whole thing is fine) by requiring that the whole sequence must be justified by a net benefit that the user would acknowledge. It also addresses the legal team's test by requiring that the user would have agreed to the whole sequence if they knew the outcome.
     - **Sufficient answer**: 
          - If the user is clearly paying for entertainment (like a game) and the cost is comparable to other forms of entertainment, then it might be acceptable.
          - If the flow is designed to educate and the cost is reasonable for the learning, then it might be acceptable.
          - If the flow is transparent and the user can opt out at any time without penalty (and the costs are not hidden), then it might be acceptable.
     - **Hard no condition**: If the flow relies on obscuring the long-term consequences or the repetitive nature of the costs, then it is exploitative.
     - **Human judgment call**: This step requires assessing the user's perspective. We must rely on user research, surveys, and testing to determine if the value is real and perceived by users. Without evidence of user-perceived value, the flow is suspect.

  #### Step 5: Assess Net Monetary Impact (Data Science Check)
     - **Question**: What is the expected net monetary impact on the user? (This step is not always sufficient on its own, but it is important.)
     - **Why?** The data scientist's A/B test approach can be useful here, but note: 
          - The absence of a net monetary loss does not mean there is no exploitation (e.g., if the user is being nudged into suboptimal investments without their understanding, the loss might not show immediately).
          - However, a net monetary gain for the user would be strong evidence against exploitation.
     - **Sufficient answer**: 
          - If we have data (from A/B tests or similar features) showing that users are not losing money (or are gaining) on average, then that supports the flow.
          - If the data shows a loss, we must revisit Steps 3 and 4 to see if there is offsetting value.
     - **Note**: For existing features, we might use observational data (with controls) but must be cautious of selection bias.

  #### Step 6: Overall Assessment
     - If the flow passes Steps 1-5 without hitting a hard no, then it is acceptable.
     - If there are any hard no conditions triggered, the flow must be rejected or redesigned.
     - If there are judgment calls (especially in Step 4) that cannot be resolved with available data, then we must escalate to a committee (with the head of product, legal, and governance) for a decision based on the company's values.

  ### Addressing Specific Concerns

  1. **The head of product's argument (each step is fine)**: The money pump shows that the whole sequence can be bad even if each step is individually rational. Our procedure addresses this by requiring an assessment of the entire sequence (Steps 3 and 4).

  2. **Legal team's test (would the user agree to the whole sequence up front?)**:
     - This test is useful but incomplete. It might be too strict (some sequences are exploratory and the user wouldn't know up front) or too lenient (users might agree to a sequence without understanding the cumulative cost). We incorporate a version of this in Step 4 (transparency and value) but with the caveat that we must have evidence of user understanding and consent.

  3. **The user who enjoys the process**:
     - In Step 4, if we can establish that the user is knowingly paying for entertainment, then the flow might be acceptable. We must ensure the cost is reasonable and transparent.

  4. **Preferences change due to learning**:
     - This is addressed in Step 4 (educational value and genuine preference shifts). If the change is due to the user's own learning (not manipulative framing), then it is non-exploitative.

  5. **Many small losses vs. one large loss**:
     - The money pump argument typically relies on many small steps. The smallness is critical because it makes each step seem insignificant and thus easier to accept. Our procedure treats any net loss (regardless of the size of individual steps) as a concern, but we also consider the user's awareness (Step 4). If the user doesn't notice the small losses, that's a red flag.

  6. **A/B testing for net monetary outcome**:
     - It is insufficient because:
          - It might miss non-monetary harms (like stress or wasted time).
          - It might not capture long-term effects (e.g., a flow that encourages frequent trading might lead to losses over years).
          - It cannot distinguish between a user who is happy to pay for a service and one who is being exploited.
          - However, it is a valuable input (Step 5) and can be used in conjunction with the other steps.

  7. **Why don't users bleed out completely?**:
     - Real users are not perfectly irrational. They might learn, or they might have bounds on their losses (e.g., they stop using the app). Also, the app might not be a perfect money pump (it might only exploit a limited inconsistency). The absence of total depletion doesn't falsify the concept; it just means the exploitation is partial.

  ### Applying the Procedure to the Three Flows

  #### Flow 1: Streak feature
     - **Step 1**: Sequence: 
          - User misses a weekly streak.
          - After 4 seconds, the app shows a "freeze streak" button (cost: £2). 
          - If the user doesn't freeze, the streak breaks.
     - **Step 2 (Static)**: The user has two choices: pay £2 or lose the streak. This is not a one-off exploitation because the user can choose to break the streak and pay nothing. They are paying for the preservation of the streak.
     - **Step 3a (Cycle)**: This isn't a cycle between two states. It's a one-time decision per missed week. However, it could become a treadmill if the user is repeatedly missing weeks and freezing.
     - **Step 3b (End State)**: After a freeze, the user has paid £2 and preserved the streak. If the streak is valuable to the user, then they have received value. But note: the streak is an artificial construct of the app. The app creates the risk of loss and then sells a solution.
     - **Step 4 (Value)**: 
          - The user might value the streak (for motivation or status). 
          - However, the timing of the button (4 seconds after a missed week) might exploit impulsivity. 
          - Transparency: Is it clear that the streak has no inherent financial benefit? If not, the user might think they are preserving an investment benefit when they are not.
          - The head of product might argue each freeze is fine, but the cumulative cost (if the user freezes often) might be high without any real benefit.
     - **Step 5 (Net Impact)**: We would need data. If users who use the freeze feature end up with less money (and no offsetting benefit) then it's a problem.
     - **Assessment**: 
          - This flow might be a treadmill (same decision repeatedly presented) and potentially exploitative if the streak is not providing real value. 
          - We must ask: Is the streak feature designed to encourage positive savings behavior, or is it a revenue generator? 
          - Hard no?: Not necessarily, but it requires evidence of user-perceived value (Step 4). If we cannot show that users value the streak independently (beyond the app's own gamification) and the cost is not transparent, then it fails.

  #### Flow 2: Switchback between safe and growth pots
     - **Step 1**: 
          - Sequence: 
              a. User gets a notification when markets fall, nudging to switch to safe pot (cost 50p).
              b. Then, when markets rise, a notification nudging to switch to growth pot (cost 50p).
          - This can repeat with market fluctuations.
     - **Step 2 (Static)**: At any single notification, the user might think switching is rational. But the sequence of switching back and forth is not presented at once.
     - **Step 3a (Cycle)**: This is a classic switchback. The app induces repeated switches based on market movements (which are normal) and charges each time. The user might end up switching frequently without any improvement in their investment outcome (because frequent switching usually underperforms buy-and-hold).
     - **Step 3b (End State)**: After a cycle (switch to safe, then back to growth), the user has paid £1 and is back in the same asset allocation as before. They are strictly worse off by £1 without any improvement in their investments.
     - **Step 4 (Value)**: 
          - The app claims the nudge matches the user's stated preference (from onboarding). But if the user's long-term goal is to maximize returns, frequent switching is counterproductive. 
          - There is no educational or entertainment value here. 
          - The user might not realize that the fees add up and that they are being whipsawed.
     - **Step 5 (Net Impact)**: We would expect this to result in lower returns (due to fees and poor market timing). A/B testing would likely show a loss.
     - **Assessment**: 
          - This flow is a clear money pump (pump category). The user ends up worse off with no offsetting value. 
          - **Hard no**: This flow should be rejected.

  #### Flow 3: Boost tokens
     - **Step 1**: 
          - Sequence: 
              a. Each month, user gets 3 free boosts.
              b. Each boost lifts the rate on one pot for 30 days.
              c. User must manually activate them each month.
              d. The pot that is boosted rotates each month (so users are encouraged to move money to the boosted pot to get the higher rate).
          - This repeats every month.
     - **Step 2 (Static)**: At any month, the user can choose to use the boosts or not. Using a boost gives a higher rate, so it seems beneficial.
     - **Step 3a (Cycle)**: This is a treadmill: the same decision (which pot to boost) is presented monthly. The rotation of the boosted pot encourages users to move money between pots. If moving money incurs a fee (the user didn't say, but let's assume it doesn't because it's internal transfer) then there might be no direct cost. But if the user is moving money away from a pot that was already well-suited for their goals, then there might be an opportunity cost.
     - **Step 3b (End State)**: After a month, the boost expires and the user must do it again. The user ends up with a slightly higher interest (if they used the boost) but also may have incurred the hassle of moving money. If the boost is free, then the user is not worse off monetarily. But note: the boost is a marketing cost that the app might recoup elsewhere (e.g., by offering lower base rates). However, the user says the tokens are "free".
     - **Step 4 (Value)**: 
          - The user engagement is high, and users say they enjoy it. This suggests entertainment value. 
          - The user might also be learning about different pots and interest rates. 
          - However, we must ask: Is the boost real? Or is it a gimmick that is funded by lower base rates? If the base rates are lower because of the boosts, then the user is being lured into a game that doesn't actually increase their returns. 
          - Transparency: Do users understand that the boost is temporary and that they are expected to move money monthly? The user reviews suggest they enjoy it, which indicates they might see it as a game.
     - **Step 5 (Net Impact)**: 
          - The user says engagement went up. We need to know: do users end up with more savings? 
          - If the boosts are real (the app pays the extra interest) and there are no fees for moving, then users should have slightly more money (if they use the boosts). 
          - But if the base rates are reduced to fund the boosts, then active users might gain at the expense of inactive users (which raises fairness concerns) and the active users might not net gain much.
     - **Assessment**: 
          - This flow is a treadmill. It encourages repeated action. But if the user enjoys it (and the boosts are real) then it might be acceptable. 
          - However, we must verify that the boosts are not an illusion (i.e., the base rates are not lowered to compensate). 
          - Also, we must consider if the constant shuffling is in the user's best financial interest (it might not be, because they might be moving money out of a well-diversified pot). 
          - If the net effect is that the user is getting a slightly higher return and enjoys the activity, then it passes. But if the base rates are reduced so that the average return is the same (or worse) than without the feature, then it is exploitative.

  **Conclusion for Flow 3**: 
     - The procedure does not automatically say "pull it", but it raises serious concerns. We must investigate:
          a. Are the boosts funded by lower base rates? (If yes, then the user is being tricked into working for no real gain.)
          b. Is there any cost (even time) that the user incurs that might be excessive?
     - If the boosts are real and not funded by base rate reductions, and users enjoy it, then it can stay. But we must be transparent about the temporary nature of the boosts and not mislead users into thinking that constant shuffling is a good investment strategy.

  ### Final Decision Procedure Outline

  1. **Map the Flow**: Break down the sequence of choices and outcomes.
  2. **Check for Static Exploitation**: Is there a one-off loss no matter what the user chooses? (Hard no if yes)
  3. **Check for Cycles and Pumps**:
     a. Does the flow induce repeated, costly switching without a fundamental reason? (Switchback: hard no if yes and without user value)
     b. After a typical cycle, is the user worse off without any valued output? (Pump: hard no if yes)
  4. **Assess User Value and Autonomy**:
     - Is there entertainment, education, or genuine preference shift?
     - Is the entire sequence and its costs transparent?
     - (Human judgment call: if the value is unclear, we need evidence from user research)
  5. **Assess Net Monetary Impact**:
     - Use data (A/B tests, observational studies) to see if users lose money. (If they lose and there's no offsetting value from Step 4, then hard no)
  6. **Overall**: 
     - If no hard no, then pass. 
     - If any hard no, reject. 
     - If judgment calls in Step 4 are unresolved, escalate to committee.

  This procedure should fit within a 30-minute review for a single flow and produces a clear output. It addresses the concerns of all stakeholders and is grounded in the money pump argument.
answer: |-
  ### Decision Procedure for Evaluating Potentially Exploitative User Flows  
  Based on the money pump argument and behavioral ethics, this procedure identifies exploitative sequences while accommodating legitimate value creation. It prioritizes *sequence coherence* over isolated choices and integrates legal, ethical, and empirical perspectives.  

  #### **Key Principles**  
  1. **The Core Failure**: A flow is exploitative if it leverages *dynamic inconsistency* (where rational individual choices sum to irrational outcomes) without offsetting user value.  
  2. **Critical Distinction**:  
     - **Static Choice**: User preferences are consistent at one point in time → "rake" fees are acceptable.  
     - **Dynamic Sequence**: Preferences shift due to framing, timing, or manipulation → "pumps," "treadmills," and "switchbacks" are suspect.  
  3. **Head of Product's Error**: "Each step is fine" ignores how sequences *manufacture* irrationality via isolation, urgency, or repeated framing.  

  ---

  ### The Procedure: 5 Questions in Order  
  *(Each question must be answered conclusively; stop and reject if any "hard no" condition is met.)*  

  #### **Question 1: Does the flow create a *meaningful decision point*?**  
     - **Goal**: Filter out non-decisions (e.g., dark patterns).  
     - **Sufficient Answer**:  
       - User must have a *real alternative* (including inaction) with costs/benefits explained at point of choice.  
       - No hidden stakes (e.g., unbundled fees not disclosed upfront).  
     - **Hard No If**:  
       - The "choice" is illusory (e.g., one button dominates; alternatives are buried).  
     - **Example**: A "confirm" pop-up with skewed wording ("Keep my savings safe!" vs. "Risk my money") fails.  

  #### **Question 2: Is the flow *self-terminating*?**  
     - **Goal**: Identify cycles/treadmills.  
     - **Sufficient Answer**:  
       - The sequence has a natural endpoint (e.g., after setup, no further action needed).  
       - User can disengage without recurring penalties.  
     - **Hard No If**:  
       - The flow *requires* repetition to retain benefits (e.g., "streak" features).  
       - Inactivity triggers re-entry (e.g., notifications that restart the cycle).  
     - **Values Call**: If benefits are trivial (e.g., digital badges), human assessment needed on whether repetition is manipulative.  

  #### **Question 3: Do preferences *justify each step independently*?**  
     - **Goal**: Test for dynamic inconsistency.  
     - **Sufficient Answer**:  
       - At each step, the user’s choice aligns with *stable, long-term goals* (e.g., risk tolerance from onboarding).  
       - No induced reversals (e.g., selling low after buying high due to notifications).  
     - **Hard No If**:  
       - The flow profits from *preference reversals* without new information (e.g., nudging to sell when markets fall, then buy when they rise).  
       - Choices would conflict if presented simultaneously (e.g., paying to avoid a loss the flow itself creates).  
     - **Values Call**:  
       - If preferences shift mid-sequence due to *user-driven learning* (e.g., reading an educational article), it’s likely valid.  
       - If shifts are *app-induced* (e.g., fear-based notifications), it’s invalid.  

  #### **Question 4: Does the net outcome *preserve/intensify user value*?**  
     - **Goal**: Ensure no hidden net loss.  
     - **Sufficient Answer**:  
       - The user ends with *more money*, *more utility*, or *equivalent value* (e.g., entertainment) vs. not engaging.  
       - Costs are proportional to value (e.g., £0.50 for a useful tool is fine; £0.50 for a pointless toggle is not).  
     - **Hard No If**:  
       - The user pays repeatedly but ends up worse off *without consent* (e.g., fees erode savings).  
       - Value is artificial (e.g., "boosts" that offset hidden fee hikes).  
     - **Values Call**:  
       - If users knowingly trade money for fun (e.g., "fiddling with the app"), it’s acceptable *only if*:  
         - Costs are transparent and capped.  
         - No financial harm (e.g., ≤£5/month for entertainment).  

  #### **Question 5: Is the flow *robust to experimentation*?**  
     - **Goal**: Validate with data where possible.  
     - **Sufficient Answer**:  
       - A/B tests show no *net financial harm* (e.g., active users don’t lose money vs. control).  
       - User feedback confirms perceived value (e.g., surveys show >70% satisfaction).  
     - **Hard No If**:  
       - Data shows material loss (e.g., users pay >1%/year in excess fees).  
       - Experiments are impossible *and* red flags exist in Q1–Q4.  
     - **Values Call**:  
       - For shipped features, use observational data (e.g., cohort analysis) and qualitative feedback. If harm is plausible but unproven, human judgment rules.  

  ---

  ### Addressing Your Specific Concerns  
  - **Legal’s "upfront consent" test**: Flawed because users can’t anticipate dynamic inconsistency. *Our fix*: Q3 (preference justification) + Q4 (net value) are stricter.  
  - **Entertainment vs. exploitation**: Handled in Q4 (net value). Fun is valid if:  
    - Costs are transparent (e.g., "You’ll pay £2/month for this game").  
    - No interference with core goals (e.g., investing isn’t compromised).  
  - **Small losses**: 100 tiny losses = one large loss *if* Q3 fails (incoherent preferences). Size matters only if users *notice and consent* (Q4).  
  - **Why users don’t "bleed out"**: Money pumps assume perfect irrationality; real users self-correct or quit. *Our fix*: Q5 (data) detects *material* harm, not theoretical extremes.  

  ---

  ### Evaluation of Your Three Flows  
  #### **Flow 1: Streak Feature**  
  - **Q1 (Decision point)**: Pass. "Freeze streak" is a clear choice.  
  - **Q2 (Self-terminating)**: **Hard No**. Missing a week *auto-triggers* the freeze offer; repetition is enforced.  
  - **Verdict**: **Reject**. It’s a "treadmill" – the app manufactures urgency to monetize inactivity.  
  - **Redesign**: Allow freezes *before* the deadline; cap freezes at 2/year.  

  #### **Flow 2: Safe/Growth Pot Switchback**  
  - **Q1 (Decision point)**: Pass. Notifications offer choices.  
  - **Q2 (Self-terminating)**: Fail. Market swings restart the cycle indefinitely.  
  - **Q3 (Preference justification)**: **Hard No**. Nudges exploit volatility fear – choices conflict with long-term goals (buy-and-hold beats frequent trading).  
  - **Verdict**: **Reject**. Pure "switchback" pump; users pay to chase volatility.  
  - **Redesign**: Only notify for extreme events (e.g., >20% swing) or provide free educational content instead.  

  #### **Flow 3: Boost Tokens**  
  - **Q1 (Decision point)**: Pass. Users actively activate boosts.  
  - **Q2 (Self-terminating)**: Fail. Monthly reset enforces repetition.  
  - **Q3 (Preference justification)**: Ambiguous. Rotating pots may misalign with goals (e.g., moving money from a tax-efficient pot).  
  - **Q4 (Net value)**: **Values Call Needed**.  
    - ✅ If boosts are *true bonuses* (no hidden fee trade-offs) and users enjoy "fiddling," it may pass.  
    - ❌ If base rates are lowered to fund boosts, it’s a "treadmill" – users work for illusory gains.  
  - **Q5 (Experimentation)**: Use existing data:  
    - Compare boosted vs. non-boosted user returns (net of shuffling costs).  
    - Survey users: "Would you pay £X/month for this feature?"  
  - **Verdict**: **Conditional Pass/Fail**.  
    - If data shows neutral/gains and users report fun → Keep.  
    - If data shows losses or manipulation → Pull.  
  - **Committee Argument to Keep**:  
    - "Users derive entertainment and engagement from boosts, with no evidence of financial harm. We’ll add a disclaimer: 'Frequent shuffling may reduce long-term returns.'"  
    - **Caution**: If boosts are central to marketing, emphasize Q5 transparency.  

  ### Handling Shipped Features  
  - **For Flow 3 (boost tokens)**:  
    - **Observational Data**: Compare active boost users vs. passive investors on:  
      - Net returns (after fees/taxes).  
      - Churn/retention (exploited users quit).  
    - **User Surveys**: Ask: "Do you feel pressured to shuffle pots?" Rate agreement 1–10.  
  - **If Harm is Found**: Phase out with user incentives (e.g., "Keep your boost rate fixed for 6 months if you stop shuffling").  

  ### Why This Works  
  - **Legal**: Focuses on transparency (Q1) and consent (Q4).  
  - **Data Science**: Q5 demands evidence but overrules "no harm" if Q1–Q4 fail.  
  - **Philosophical**: Separates static choices (fine) from dynamic incoherence (pumps).  
  - **Practical**: Under 30 mins/flow; clear "hard no" triggers.  

