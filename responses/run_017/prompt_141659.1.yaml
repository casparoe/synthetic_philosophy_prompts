  ### Decision Tree for Unit of Selection

  **Root:** Observation that trait T has increased in frequency across generations in a population.

  1. **Is T expressed and variable in entities below the organism level (e.g., genes, cells)?**  
     - **Yes** → 2  
     - **No** → 3  

  2. **Is T a replicator (faithfully copied with high fidelity across generations)?**  
     - **Yes** → 4  
     - **No** → *Leaf: Developmental/Niche Construction*  

  3. **Is T expressed and variable in individual organisms?**  
     - **Yes** → 5  
     - **No** → 11  

  4. **Does T's transmission depend on organismal fitness?**  
     - **Yes** → *Leaf: Organism-Level Selection*  
     - **No** → *Leaf: Strict Replicator-Level Selection*  

  5. **Is T heritable at the organism level (variation transmitted to offspring)?**  
     - **Yes** → 6  
     - **No** → 9  

  6. **Does T affect the fitness of the organism bearing it?**  
     - **Yes** → 7  
     - **No** → 8  

  7. **Does T exclusively affect the bearer's fitness (no effects on others)?**  
     - **Yes** → *Leaf: Organism-Level Selection*  
     - **No** → 10  

  8. **Does T affect the fitness of a collective (e.g., group) the bearer is part of?**  
     - **Yes** → 12  
     - **No** → *Leaf: Pluralist*  

  9. **Does T's expression depend on inherited environmental factors?**  
     - **Yes** → *Leaf: Developmental/Niche Construction*  
     - **No** → 13  

  10. **Is the primary fitness effect of T on non-bearers contingent on shared group membership?**  
      - **Yes** → 14  
      - **No** → *Leaf: Pluralist*  

  11. **Is T expressed and variable in species/clades?**  
      - **Yes** → *Leaf: Species/Clade-Level Selection*  
      - **No** → 15  

  12. **Do collectives (e.g., groups) bearing T reproduce (produce new collectives)?**  
      - **Yes** → 16  
      - **No** → *Leaf: Multilevel Selection (MLS1)*  

  13. **Is T's increase reducible to lower-level fitness differences?**  
      - **Yes** → *Leaf: Pluralist*  
      - **No** → *Leaf: Multilevel Selection (MLS1)*  

  14. **Are beneficiaries of T closely related to the bearer?**  
      - **Yes** → *Leaf: Kin Selection*  
      - **No** → 17  

  15. **Is T an emergent property of a collective (not aggregate of member traits)?**  
      - **Yes** → 18  
      - **No** → *Leaf: Pluralist*  

  16. **Is collective fitness defined by output of new collectives (not average member fitness)?**  
      - **Yes** → *Leaf: Multilevel Selection (MLS2)*  
      - **No** → *Leaf: Multilevel Selection (MLS1)*  

  17. **Do collectives bearing T vary and reproduce independently?**  
      - **Yes** → *Leaf: Group Selection (Interdemic)*  
      - **No** → *Leaf: Multilevel Selection (MLS1)*  

  18. **Do collectives bearing T produce new collectives?**  
      - **Yes** → *Leaf: Group Selection (Interdemic)*  
      - **No** → *Leaf: Species/Clade-Level Selection*  

  ---

  ### Leaf Descriptions  
  *(Tag: Unit of Causation [C], Bookkeeping [B], or Explanation [E])*  

  1. **Strict Replicator-Level Selection**  
     - Characterization: Selection acts directly on sub-organismal replicators (e.g., genes), with fitness differences decoupled from organismal success.  
     - Awkward commitment: Replicators may persist despite severe organismal costs, potentially leading to population extinction.  
     - Tag: C (causation at replicator level)  

  2. **Organism-Level Selection**  
     - Characterization: Fitness differences arise from interactions between organisms and environment, with T's benefit/cost accruing to the bearer.  
     - Awkward commitment: Cannot explain traits that reduce bearer fitness without indirect benefits.  
     - Tag: C (causation at organism level)  

  3. **Kin Selection (Inclusive Fitness)**  
     - Characterization: T spreads via benefits to relatives (shared genes), with fitness accounting summing direct and indirect effects.  
     - Awkward commitment: Requires precise relatedness estimates; ambiguous when kin groups overlap or conflict.  
     - Tag: B (bookkeeping via inclusive fitness)  

  4. **Group Selection (Interdemic)**  
     - Characterization: Groups are discrete units that reproduce/die; T increases group fitness (e.g., productivity) despite within-group costs.  
     - Awkward commitment: Groups must be isolated and "hereditary" (daughter groups resemble parents), which is often unrealistic.  
     - Tag: E (explanation requires group-level counterfactuals)  

  5. **Multilevel Selection Type 1 (MLS1)**  
     - Characterization: Collective fitness is average of member fitnesses; selection acts concurrently at multiple levels, with no emergent collective properties.  
     - Awkward commitment: Collective-level change is fully reducible to member-level changes; "collective" is a re-averaging of individual data.  
     - Tag: B (bookkeeping via partitioning selection gradients)  

  6. **Multilevel Selection Type 2 (MLS2)**  
     - Characterization: Collectives reproduce as units; collective fitness is defined by output of new collectives, with emergent traits affecting persistence.  
     - Awkward commitment: Requires collectives to be "organism-like" in reproduction, which is rare above the group level.  
     - Tag: C (causation at collective level if traits are emergent)  

  7. **Species/Clade-Level Selection**  
     - Characterization: Lineages (species/clades) vary in speciation/extinction rates due to T, with no reducibility to organism-level fitness.  
     - Awkward commitment: Timescales mismatch; hard to disentangle from lower-level processes.  
     - Tag: E (explanation for macroevolutionary patterns)  

  8. **Pluralist**  
     - Characterization: Multiple units (e.g., gene, organism, group) offer intertranslatable descriptions; no "real" level, only modeling choices.  
     - Awkward commitment: Risks ignoring causal asymmetries or conflating frameworks.  
     - Tag: B (bookkeeping as conventional choice)  

  9. **Developmental/Niche Construction**  
     - Characterization: T's increase stems from organism-environment feedback loops; inheritance includes environmental modifications, resisting "selection on" framing.  
     - Awkward commitment: Downplays replicator dynamics; hard to formalize.  
     - Tag: E (explanation via developmental processes)  

  ---

  ### Diagnostics  

  **1. Indistinguishable Leaf Pairs**  
  - **Kin Selection vs. Group Selection (Interdemic):** Formal indistinguishability (mathematically equivalent under shared assumptions; same causal process).  
  - **MLS1 vs. Pluralist:** Practical indistinguishability (both partition change; difference is emphasis on reducibility vs. equivalence).  
  - **Developmental/Niche Construction vs. MLS1:** Causal indistinguishability (both involve environmental feedback; niche construction emphasizes reciprocal causation).  

  **2. Unoccupied Logical Spaces**  
  - **Collective reproduction without heritability (e.g., groups reproduce but trait not inherited):** Incoherent (reproduction without inheritance cannot drive cumulative selection).  
  - **Strict replicator selection benefiting organisms:** Unattractive (replicator dynamics are explicitly decoupled; if aligned, it defaults to organismal selection).  
  - **Emergent group traits with no lower-level variation:** Incoherent (emergence requires lower-level interactions; none implies mystical "group essence").  
  - **Species selection with reducibility to organismal fitness:** Unattractive (violates definition; if reducible, it defaults to MLS1 or pluralism).  

