answer: |-
  Here's your Q&A battle plan, ordered by likely objection sequence, with tactical concessions, hold lines, and timed replies. The key is **staying descriptive**—you're tracking *what practices do*, not prescribing epistemology.

  ---

  ### **Preemptive Concession (First 2 Minutes)**  
  *Slide this in during your closing summary:*  
  > "Just to flag: I’m not *solving* skepticism or offering a *theory* of justification. I’m redescribing what Wittgenstein shows us: **certainty isn’t in our heads; it’s in the scaffolding of shared practice.** If this looks like quietism, that’s intentional—it’s why calling hinges ‘dead questions’ avoids the trap of theorizing *grounds*."

  ---

  ### **Objection 1: The Therapeutic Wittgensteinian**  
  *"This is classic theory-building! Wittgenstein tears down the ‘hinge epistemology’ industry. Aren’t you just replacing ‘hinge propositions’ with ‘dead questions’—another metaphysical posit?"*  

  **Concede:**  
  - Wittgenstein *is* anti-theory; your account mustn’t become a "philosophy of dead questions."  
  **Hold:**  
  - You’re *not* positing entities—you’re tracking **grammatical remarks** (OC §319) that *show* when a question is inert in practice.  
  **2-Minute Reply:**  
  > "Wittgenstein isn’t *theorizing* hinges—he’s *pointing* (e.g., OC §§341–343). I’m doing the same: ‘dead question’ is a **reminder** of what we *do* with Moorean claims. When you say ‘I know this is a hand,’ it’s not failed epistemology; it’s a misfire because *no one was doubting hands*. The ‘dead question’ framing avoids reifying ‘hinges’ into a theory—it keeps us looking at practice."  
  **Soft Spot:**  
  - If pressed, admit: "It *could* become theory—but only if we detach it from examples like the lab."

  ---

  ### **Objection 2: The Hinge Epistemologist**  
  *"This is Pritchard/Moyal-Sharrock/Wright in disguise! ‘Dead questions’ just *are* their ‘hinges’—you’ve rebranded arational commitment."*  

  **Concede:**  
  - Hinge epistemologists *do* recognize the non-propositional, action-guiding role of hinges.  
  **Hold:**  
  - They still treat hinges as *objects* (e.g., "commitments," "certainties"). You’re **eliminativist**: no *thing* corresponds to a hinge—just *absence of questioning*.  
  **2-Minute Reply:**  
  > "Unlike Pritchard’s ‘hinge commitments,’ I’m saying **there’s nothing to commit *to***. When you recalibrate the spectrometer daily, ‘Is it calibrated?’ *isn’t a question*—not even an ‘implicit’ one. It’s like asking for a king in chess (OC §136). The lab disaster shows this: the postdoc *resurrected* a dead question. That’s not revision—it’s **reactivating a practice**."  
  **Soft Spot:**  
  - Needs your lab example to feel concrete. If they say "But absence *is* a status!" reply: "Status implies a proposition—I’m denying it exists."

  ---

  ### **Objection 3: Mainstream Epistemologist (Regress Focus)**  
  *"If hinges are ‘dead questions,’ what stops the regress? How does ‘no question’ *justify* anything? Isn’t this just foundationalism with extra steps?"*  

  **Concede:**  
  - Dead questions *don’t* justify. Justification *ends* where questions die.  
  **Hold:**  
  - **Regress dies in practice, not logic**. Foundationalism posits basic *beliefs*; you’re saying basic *actions* (e.g., using the spectrometer unchecked) **make questions obsolete**.  
  **2-Minute Reply:**  
  > "The regress *does* stop—but not at a ‘foundation.’ It stops where **practice runs out** (OC §204). In the lab, ‘Is the spectrometer calibrated?’ dies because calibration *is part of using it*. Asking it pre-revival was like asking ‘Is this real coffee?’ while drinking it. Justification applies *within* the space of questions—not beneath it."  
  **Soft Spot:**  
  - If pressed: "Yes, this is *like* contextualism—but contexts are defined by *what’s up for grabs*, not ‘rules.’"

  ---

  ### **Objection 4: Social/Political Epistemologist**  
  *"Who gets to kill questions? Your lab example masks power: the PI silences challenges until disaster. Isn’t ‘dead question’ just *epistemic injustice*?"*  

  **Concede:**  
  - **Absolutely—**power decides which questions stay dead (e.g., ignoring postdocs).  
  **Hold:**  
  - Your account *explains* injustice: oppression **enforces dead questions** (e.g., "Do women reason well?" in 1800s science).  
  **2-Minute Reply:**  
  > "Dead questions *can* be tools of domination—but also of efficiency (e.g., not questioning gravity daily). The point is: when a question dies **without uptake** (e.g., suppressed dissent), it’s pathological. But pathology *presupposes* healthy practice. My view *helps* diagnose injustice: e.g., a conspiracy theorist revives dead questions *without communal uptake*."  
  **Soft Spot:**  
  - Grant: "Yes, ‘dead’ isn’t neutral—it can be violent."

  ---

  ### **Objection 5: Philosopher of Science (Kuhn Focus)**  
  *"Isn’t a ‘paradigm shift’ just mass question-resurrection? Your lab is a micro-revolution!"*  

  **Concede:**  
  - **Exactly.** Kuhn’s "anomalies" are dead questions roaring back (e.g., "Is Newtonian physics absolute?").  
  **Hold:**  
  - Kuhn treats paradigms as *worldviews*; you’re localizing it to **procedural certainties** (e.g., spectrometer use).  
  **2-Minute Reply:**  
  > "Yes! Hinge change *is* paradigm shift. But where Kuhn might say ‘scientists commit to paradigms,’ I say: **they stop asking questions** their tools assume. The lab shows a ‘normal science’ practice collapsing when a question revives. No ‘incommensurability’—just repurposed equipment (OC §613)."  
  **Soft Spot:**  
  - If they push: "Kuhn’s ‘gestalt switches’ *overstate* discontinuity—Wittgenstein shows gradual question-death."

  ---

  ### **Objection 6: Formal Epistemologist**  
  *"Can you model this? If ‘dead questions’ have no probability, does my credence in ‘I have hands’ collapse to 0 or 1? Either breaks Bayesianism."*  

  **Concede:**  
  - **Formal models struggle here**—probability applies *within* practices.  
  **Hold:**  
  - Dead questions **aren’t in the probability space**. Like division-by-zero errors: no output because no input.  
  **2-Minute Reply:**  
  > "Assigning p=1 to ‘hands exist’ *is* the mistake! Bayesianism models *uncertainty*—but dead questions lack **doxastic friction** (OC §337). In the lab, no one *assigned confidence* to calibration—they just used the machine. Model this as a **precondition for assigning probabilities**, like syntax for semantics."  
  **Soft Spot:**  
  - "I can’t formalize it—but neither can Bayesians model ‘practices.’"

  ---

  ### **Objection 7: Ancient Philosophy Specialist**  
  *"How is this not Aristotle’s *nous* grasping first principles? Both are indemonstrable starting points."*  

  **Concede:**  
  - Aristotle *also* saw that chains of justification end.  
  **Hold:**  
  - Aristotle’s first principles are **timeless truths**; dead questions are **contingent artifacts of practice**.  
  **2-Minute Reply:**  
  > "For Aristotle, ‘whole > part’ is *eternally* certain. For Wittgenstein, ‘The Earth is old’ **wasn’t certain** for Genesis-believers (OC §336). Hinges are historical: in my lab, calibration *became* a dead question. Aristotle’s *nous* is intellectual; dead questions are **embodied in routines**—like recalibration rituals."  
  **Soft Spot:**  
  - "Aristotle would call this *emperia*—but he’d want necessity where I see contingency."

  ---

  ### **The Make-or-Break Reply**  
  **You must land the lab example.** When challenged:  
  > "The lab isn’t an *analogy*—it’s the *logic* of hinges. Before the postdoc, ‘Is it calibrated?’ had **nowhere to go**: no test, no consequences. After, it *did*. That shift—**from no-question to question**—is *all* that happened. No beliefs revised, no commitments overruled. *That’s* Wittgenstein’s point: certainty is the **stillness of practice**, not a mental state."

  ---

  ### **The Question You Hope Nobody Asks**  
  *"If hinges are ‘dead questions,’ what *kills* a question? And if nothing does, is every question *always* live—making all certainty impossible?"*  
  **Why it’s deadly:** Forces you to define "death" (social consensus? habit? power?), risking circularity or metaphysics.  
  **Dodge strategy:**  
  > "Wittgenstein gives no ‘cause’—he observes that in **specific language-games**, questions *do* die (e.g., ‘Is fire hot?’). Death isn’t a *mechanism*—it’s what we *call* it when a question lacks **grammatical traction** (OC §257). Like ‘rule-following,’ it’s bedrock: we can only point."  
  ...then pivot to the lab: "We *saw* death there—until we didn’t."

  ---

  ### **Summary Tactics**  
  - **Anchor to the lab example**—it’s your proof-of-concept.  
  - **Wield OC §342**: "If I say ‘I know that’s a hand,’ I’m *tempted* to look for justification—but there isn’t any." Your reply: *Because it answers no question.*  
  - **Concede freely** on social/political points—it strengthens you.  
  - **When pressed, retreat to**: "I’m only *describing* what Wittgenstein describes."  

  Good luck—your view is bold and defensible. Let the practice speak.
