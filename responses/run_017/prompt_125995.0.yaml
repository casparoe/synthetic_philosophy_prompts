answer: |-
  **Question**  
  If lexical threshold negative utilitarianism holds that suffering above intensity T lexically dominates any quantity of pleasure, and that below T suffering trades additively against pleasure, must the view implicitly rely on a single cardinal scale of welfare to define T, compare intensities, or aggregate harms—and if not, how can it avoid both counterintuitive paralysis in probabilistic cases and the symmetric incommensurability problem illustrated by the Dimmer dilemma: choosing between (A) one person enduring four seconds of agony at 7.1 (where T=7.0) or (B) reducing all suffering to 6.9 while multiplying total suffering duration by one quadrillion (e.g., a trillion beings each bearing 6.9-intensity discomfort for a million years)? Defend your position.  

  ---

  **Model Answer**  
  The lexical threshold view collapses because it cannot define or apply its threshold without smuggling in the cardinal, interpersonally comparable welfare metric it purports to reject. First, the Dimmer dilemma forces a fatal choice: if T applies to momentary intensity, option B is mandatory regardless of duration multipliers, demanding we accept astronomical suffering so long as no instance exceeds 6.9—a reductio ad absurdum. If T instead applies to aggregate suffering per life or overall, the quadrillion-fold duration in B ensures aggregates surpass T, making A preferable. But aggregating requires interpersonal cardinal intensity measurements (comparing my 6.9 headache to your stubbed toe), constructing the single scale the view denies. Worse, this scale must be linear: if intensity 7.1 is lexically worse than 6.9, but 6.9 is *not* lexically worse than 6.89, we need a cardinal measure to fix T’s location non-arbitrarily and explain why 7.0 breaks continuity.  

  Symmetry compounds this: if pains and pleasures are incommensurable, why prioritize avoiding agony over securing ecstasy? The view asserts lexical priority for intense suffering but offers no asymmetric justification—it merely assumes suffering’s primacy while rejecting the common currency that could ground it. Probabilistic cases expose further incoherence. A 0.0001% chance of one agony at 7.1 lexically outweighs certain paradise for all beings if above-T suffering has infinite disvalue. Threshold defenders might impose a second threshold on probability (e.g., only risks >1% matter), but this requires multiplying probability and disvalue—a cardinal product—defeating the original anti-commensurability goal. Alternatively, capping disvalue as finite but large reintroduces additive trade-offs above T, nullifying lexicality. Thus, the view either presupposes the scale it scorns or dissolves into pragmatic contradiction.  

  ---

  **Marking Scheme (Total: 20 marks)**  
  1. **Dimmer exposition & choice** (4 marks):  
     - Explains why lexical threshold implies choosing B if T is momentary (absurd duration accepted) or A if T is aggregate (duration crosses threshold).  
     - *Botch: Misstates options or threshold implications.*  

  2. **Cardinality critique** (6 marks):  
     - Identifies that aggregating pains for a non-momentary T requires interpersonal cardinal intensity comparisons.  
     - Argues that defining T’s location demands a linear intensity scale (e.g., why 7.0 ≠ 6.99 matters).  
     - *Botch: Claims aggregation is possible without cardinality, or misses T-location arbitrariness.*  

  3. **Symmetry/priority problem** (3 marks):  
     - Notes that incommensurability cannot explain why suffering lexically dominates pleasure rather than vice versa.  
     - *Botch: Only describes lexicality without challenging its asymmetric basis.*  

  4. **Probability dilemma** (4 marks):  
     - Shows nonzero probability of above-T suffering causes paralysis (infinite disvalue) or requires thresholds on probability.  
     - Explains probability thresholds imply cardinal risk-disvalue products.  
     - *Botch: Only notes paralysis without linking to commensurability.*  

  5. **Verdict & synthesis** (3 marks):  
     - Clear stance: View fails due to reliance on implicit scale (e.g., "must presuppose cardinal welfare metric").  
     - Synthesizes Dimmer, aggregation, symmetry, and probability as mutually reinforcing failures.  
     - *Botch: Hedging ("it depends") without justification; isolated points not connected.*  

  **Cap at B (14/20) for:**  
  > *Correctly restates the view and the Dimmer but fails to specify which premise (e.g., non-aggregation, lexical symmetry, infinite disvalue) must be abandoned and what abandoning it costs the theory’s core claims.*
