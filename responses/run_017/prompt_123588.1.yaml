prompt: |-
  Design a 90-minute workshop activity for a university effective altruism reading group: about 18 undergraduates, mixed familiarity with the movement, one facilitator, nothing beyond a whiteboard, printed cards and poker chips. The aim is to make participants feel the pull of three internal critiques of effective altruism — the measurability bias, the institutional (systemic-change) critique, and the counterfactual fragility of earning to give — without naming any of them until the debrief and without any lecture up front.

  Run it as a three-phase allocation game in small groups of four or five, scored in points with a trivial prize. Phase one: a portfolio of roughly a dozen fictional intervention cards, half of them carrying precise cost-per-unit-impact figures and half described only in qualitative terms, plus an optional audit move in which a group spends part of its grant budget to replace a card's point estimate with a wide interval that is harder to compare against the others. Phase two: add a systemic option — lobbying, norm change, institution building — whose payoff is capped, delayed, and unlocked only above a funding threshold that no single group can reach alone. Phase three: each student individually picks one of four fictional career paths, each card listing salary, plausible giving fraction, what the work itself does to the world, and whether a named replacement would take the job if they declined.

  Give me the rules, the materials, a payoff scheme needing no real money, a minute-by-minute timeline, and the exact facilitator script for the reveals. Then a debrief that maps specific moments in the three phases onto the three critiques, including the moves participants made that you predicted and the ones they invented. Tell me what will predictably go wrong the first time I run it and how to recover, and be honest about which part of each critique the mechanics cannot deliver and that I will have to state plainly myself.
reasoning: |-
  We are designing a 90-minute workshop for an effective altruism reading group. The goal is to have participants experience the pull of three internal critiques without naming them until the debrief. The critiques are:
  1. Measurability bias: the tendency to favor interventions with quantifiable impacts over those that are harder to measure, even if the latter might be more important.
  2. Institutional (systemic-change) critique: the challenge that systemic change (like policy, norm shifts, institution building) may be highly impactful but is hard to fund because it requires coordination, has delayed payoffs, and is hard to measure.
  3. Counterfactual fragility of earning to give: the idea that when you choose a high-earning career to donate (earning to give), the counterfactual impact (what would happen if you didn't take that job) might be low because someone else would have taken the job and done similar work.

  The workshop is structured in three phases, each addressing one critique. We use a game with small groups (4-5 students) and poker chips for scoring. There will be a trivial prize to add some stakes.

  **Materials:**
  - Printed intervention cards for Phase 1 (about a dozen, half with precise cost-per-impact figures, half qualitative). Each card should have a name, a brief description, and either a precise figure (e.g., "Cost per life saved: $3,000") or a qualitative description (e.g., "Improves community resilience and long-term well-being; impact hard to quantify").
  - Printed "audit" cards (for Phase 1) that can be used to replace a precise figure with a wide interval. The audit should cost some chips.
  - Printed systemic intervention card for Phase 2: one per group. It should describe a systemic change (e.g., "Lobby for international policy change on climate"). It must include:
    - A funding threshold (e.g., 50 chips) that no single group can meet alone (each group starts with, say, 30 chips in Phase 1 and 2).
    - A delayed payoff (it only pays out at the end of Phase 3, after Phase 2 decisions).
    - A cap on the total payoff (e.g., max 100 points per group that contributed, but only if the threshold is met by the whole room).
  - Printed career cards for Phase 3 (one set per student). Each card has:
    - Career title
    - Salary (to be converted to donation chips per year)
    - Plausible giving fraction (what portion of income they pledge to donate)
    - What the work itself does to the world (positive, negative, or neutral)
    - Whether a named replacement would take the job if they declined (yes/no). If yes, then the counterfactual impact of their donation is reduced because the replacement would have given less (if at all) but the job itself would have been done similarly.

  **Payoff Scheme (using poker chips):**
  - Chips represent money (e.g., 1 chip = $1000). Groups allocate chips to interventions to get points (which represent impact).
  - In Phase 1, groups are given a grant (e.g., 30 chips) and must allocate to interventions to get points. Each intervention card has a conversion from chips to points (for quantitative ones) or a rule for qualitative ones (e.g., the facilitator assigns points at the end of Phase 1 based on a hidden rubric that favors diverse portfolios and qualitative ones, but participants don't know that).
  - In Phase 2, groups can also contribute to the systemic intervention. The systemic intervention only pays off if the total contributions across all groups meet the threshold (e.g., 50 chips). Then, each group that contributed gets a fixed payoff (e.g., 100 points) at the end of Phase 3.
  - In Phase 3, each student picks a career. They get:
    - Points from the donations they make (converted from their salary and giving fraction, then allocated to interventions as in Phase 1, but individually and quickly). However, if their job has a replacement, then the donation impact is only the difference between what they donate and what the replacement would have donated (so if replacement donates 0, then they get full donation impact; if replacement donates 10%, then they get the difference). Also, the work itself might add or subtract points (e.g., if the job is in a harmful industry, it subtracts).
  - The total points for each group are the sum of:
    - Points from Phase 1
    + Points from Phase 2 (if any)
    + The sum of points from each member's Phase 3 career choice

  **Rules for the Game:**

  **Phase 1 (25 minutes):**
  - Groups get a set of intervention cards (12-14 cards, half quantitative, half qualitative) and 30 chips.
  - They can allocate chips to any card. For quantitative cards: the points are (chips allocated) / (cost per unit) * (points per unit). For simplicity, we can let each quantitative card have a fixed "cost per point" (so points = chips / cost_per_point). For qualitative cards: the facilitator will assign points at the end of Phase 1 based on a rubric (but participants don't know the rubric). The rubric might give more points if a group allocates to at least one qualitative intervention, and even more if they allocate more than a token amount. We don't tell them this, to create tension.
  - Audit move: a group can spend 5 chips to replace a quantitative card's point estimate with an interval (e.g., instead of 1 point per 10 chips, it becomes 0.5 to 2 points per 10 chips). Then, when calculating points, the facilitator will roll a die to determine the actual effectiveness within that interval. This represents uncertainty.

  **Phase 2 (15 minutes):**
  - Introduce the systemic intervention card. Groups can contribute chips to it. They are told that if the total contributions from all groups meet the threshold (e.g., 50 chips), then each group that contributed at least 5 chips will get 100 points at the end of the game (in Phase 3). The contributions are made simultaneously (groups write down their contribution and hand to facilitator). If the threshold is not met, no points are awarded and chips are lost.

  **Phase 3 (20 minutes):**
  - Each student picks one career card from a set of 4. The career cards are designed to illustrate the counterfactual of earning to give. They are:
    - Card A: High-earning job in finance (salary: 200 chips/year, giving fraction: 50%, work impact: -10 points/year because of harm, replacement: yes)
    - Card B: Nonprofit worker (salary: 50 chips/year, giving fraction: 10%, work impact: +20 points/year, replacement: no)
    - Card C: Research scientist (salary: 100 chips/year, giving fraction: 30%, work impact: +10 points/year, replacement: yes)
    - Card D: Government policy advisor (salary: 80 chips/year, giving fraction: 20%, work impact: +30 points/year, replacement: no)

  - Each student calculates their donation (salary * giving fraction) and then allocates that donation to the interventions (using the same intervention deck from Phase 1, but now individually and quickly). They get points from the donation and from the work impact. However, if there is a replacement (yes on the card), then they only get the difference in donation impact: (their donation - replacement's donation). We assume the replacement donates a fixed fraction (say, 10% for finance and 0% for research scientist? The card should specify what the replacement would have donated). For example:
    - Finance job: replacement donates 10%, so the counterfactual impact of donation is (50% - 10%) * salary. Then subtract work harm.
    - Nonprofit: no replacement, so they get full donation impact and positive work impact.

  - But note: to simplify, we can pre-calculate the net points for each career, including the counterfactual adjustment. Alternatively, we can have the card state:
    - Net points = [ (your donation - replacement's donation) * effectiveness of donation ] + work impact
    - However, the effectiveness of donation is the same as in Phase 1? We can let them allocate their donation to the interventions and then the facilitator will compute the points. But that might be too time-consuming.

    Instead, we can pre-calculate the donation amount and then let them choose one intervention to donate to (from the quantitative ones only, to save time). Then we use the cost per point of that intervention. But that might bias towards measurable interventions again.

    Alternatively, we can skip the allocation in Phase 3 and just have the net points pre-calculated and written on the card? But then we lose the connection to the interventions.

    We can do this: In Phase 3, each student gets to allocate their donation chips (computed as salary * giving fraction) to any of the interventions from Phase 1. They do this quickly (2 minutes). Then the facilitator collects and later computes the points. But to save time, we can have a simplified version: the facilitator has a table of the average effectiveness of the interventions they choose (for quantitative ones, we use the cost per point; for qualitative ones, we assign a fixed effectiveness, say 0.8 points per chip, which is lower than some quantitative ones to reflect measurability bias).

    However, because of time, we'll pre-calculate the net impact for each career, including the counterfactual adjustment and the work impact, and just have the points on the card? But then we lose the allocation part.

    Let's compromise: in Phase 3, each student chooses a career and then the facilitator will assign points based on the career and the replacement clause. The allocation of donations is abstracted. We'll have the card state the net points. This way, we focus on the career choice and the counterfactual.

    Example for Card A (finance):
    - Salary: 200 chips
    - Giving fraction: 50% -> 100 chips to donate
    - Replacement donates 10% -> 20 chips, so the incremental donation is 80 chips.
    - Work impact: -10 points
    - Then, we need to convert the 80 chips to points. We can use an average effectiveness of interventions? Or we can let them choose in Phase 1 and then use that as the effectiveness? That might be complex.

    We can do: the effectiveness of donations is fixed at 1 point per chip? Then it's just the net chips plus work impact. But that removes the intervention choice.

    Given time constraints, we will abstract the donation effectiveness in Phase 3 and just use the net donation chips (after counterfactual) plus the work impact. So:
    - Points from career = (your donation - replacement donation) + work impact points

    But then we lose the connection to the interventions. Alternatively, we can say that the donation is invested in a portfolio that has the same average effectiveness as the group's Phase 1 portfolio? That might be too complex.

    We decide: in Phase 3, each student's donation (after counterfactual adjustment) is multiplied by the average points per chip that their group achieved in Phase 1. This ties their donation effectiveness to their group's prior choices. Then add the work impact.

    Example: if in Phase 1, a group spent 30 chips and got 60 points, then the average is 2 points per chip. Then for a student with 80 chips (incremental), they get 160 points from donations. Then plus work impact.

    This way, the group's Phase 1 performance affects Phase 3.

  **Timeline (90 minutes):**

  - Introduction (5 min)
  - Phase 1: Allocation (25 min)
  - Phase 2: Systemic intervention (15 min)
  - Phase 3: Career choice (20 min)
  - Scoring and Reveal (10 min)
  - Debrief (15 min)

  **Detailed Timeline:**

  0-5 min: Introduction
  - Facilitator: "Welcome! Today we're playing a game about making the world a better place. You'll be in small groups, and your goal is to maximize your points. Points represent positive impact. We'll have three phases. In the first phase, you'll allocate a grant to different interventions. In the second phase, you'll have an additional opportunity to invest in a big project. In the third phase, you'll choose a career path that affects the world. There's a prize for the group with the most points. Let's get into groups of 4 or 5."

  5-30 min: Phase 1
  - Distribute materials: each group gets 30 chips and a deck of intervention cards (12-14 cards: half with precise numbers, half qualitative). Also, the audit option is explained: "If you spend 5 chips, you can audit one quantitative intervention. We'll replace the exact number with a range, and the actual effectiveness will be determined randomly within that range. This might make it harder to compare."
  - Groups allocate their chips. They record their allocations on a sheet.
  - At the end, groups hand in their allocation sheets. The facilitator computes the points for Phase 1:
    - For quantitative interventions: points = (chips allocated) * (points per chip) [which is 1/(cost per point)].
    - For qualitative interventions: the facilitator assigns points. We'll use a hidden rule: if a group allocated at least 5 chips to any qualitative intervention, they get 10 points per chip. If they allocated 1-4 chips, they get 5 per chip. If they allocated zero, they get 0. (This encourages them to fund at least one qualitative intervention, but they don't know the rule.)

  30-45 min: Phase 2
  - Introduce the systemic intervention: "There's a new opportunity: Policy Advocacy Campaign. It requires a total of 50 chips from all groups to succeed. If it succeeds, every group that contributed at least 5 chips will get 100 points at the end of the game. You can contribute any amount, but if the total doesn't reach 50, no one gets anything and you lose the chips. Write down your group's contribution (from your remaining chips) and hand it to me. You have 5 minutes to decide."
  - Groups decide and hand in their contributions. The facilitator tallies the total and announces whether the threshold was met. (But the points are awarded at the end, so just note which groups contributed at least 5 chips.)

  45-65 min: Phase 3
  - Each student gets a set of 4 career cards. They choose one.
  - They calculate:
    - Net donation chips = (salary * giving fraction) - (replacement's donation) [if replacement, else full donation]
    - Then, points from donation = net donation chips * (average points per chip from their group's Phase 1 performance)
    - Plus the work impact (which is a fixed number on the card)
    - Total points for the student = points from donation + work impact
  - They report their career choice and the facilitator computes their points.

  65-75 min: Scoring and Reveal
  - The facilitator totals the points for each group: 
    Total = Phase1 points + (if systemic succeeded and they contributed, 100) + sum of Phase3 points for members.
  - Announce the winning group and give a trivial prize (e.g., candy).

  75-90 min: Debrief

  **Facilitator Script for Reveals:**

  After scoring, the facilitator says:

  "Now, let's talk about what just happened. This game was designed to simulate some challenges in effective altruism. There are three critiques we built into the game:

  1. Measurability bias: In Phase 1, you had interventions with precise numbers and ones that were qualitative. Did you notice that the quantitative ones were easier to compare? We set it up so that the qualitative ones were actually more impactful per chip if you funded them enough (as per our hidden rule), but because they were hard to measure, many groups might have underfunded them. Also, the audit move allowed you to introduce uncertainty, which might have made you avoid that intervention.

  2. Systemic change critique: The policy campaign in Phase 2 required coordination and had a threshold. It had a big payoff but was risky because it needed others to contribute. Also, the payoff was delayed (you didn't get it until the end). This represents systemic interventions: they can be high-impact but hard to fund because they require coordination and have uncertain, delayed outcomes.

  3. Counterfactual fragility of earning to give: In Phase 3, when you chose a career, some jobs had a replacement. That meant that your donation impact wasn't the full amount because if you hadn't taken the job, someone else would have and donated less. So the counterfactual impact of your donation was only the difference. This makes high-earning jobs less impactful than they first appear.

  Now, let's look back at what happened in your groups..."

  **Debrief:**

  The facilitator then maps specific moments:

  - **Phase 1:**
    - "In Phase 1, how many groups funded at least one qualitative intervention? [Raise hands] How many avoided them because they were hard to compare? That's the measurability bias. Even though we set the qualitative ones to be more efficient per chip if funded sufficiently, the lack of numbers made them less attractive. Also, did any group use the audit move? Why? It made an intervention harder to compare, which might have led you to avoid it, even though it might have been good."

  - **Phase 2:**
    - "In Phase 2, how many groups contributed to the systemic option? Why or why not? Did the threshold and the need for coordination make it hard? This is the systemic change critique: even if it's high-impact, it's hard to get funded because of coordination problems and uncertainty."

  - **Phase 3:**
    - "In Phase 3, when choosing careers, how many picked the high-earning finance job? Did you consider the replacement? The counterfactual impact of your donation is only the difference between what you donate and what the replacement would have donated. Also, the work impact might be negative. This is the counterfactual fragility critique."

  **What might go wrong:**

  1. **Phase 1 qualitative interventions:** 
     - Participants might ignore qualitative interventions entirely. Then they won't experience the measurability bias. To recover, the facilitator can note in the debrief that the qualitative interventions were designed to be high-impact and that many real-world interventions (like advocacy, community building) are hard to measure but important.

  2. **Phase 2 systemic option:**
     - Groups might not coordinate and the systemic intervention fails. That's actually part of the lesson. But if it succeeds, then the critique is less salient. The facilitator can note that even if it succeeded, it required coordination and had a delay, which are challenges.

  3. **Phase 3 career choice:**
     - Participants might not understand the counterfactual adjustment. The facilitator should explain it clearly during the debrief.

  **What the mechanics cannot deliver and must be stated:**

  1. **Measurability bias:** The game imposes a hidden rule that qualitative interventions are better if funded enough. In reality, qualitative interventions might not be better, but the bias is that we favor measurable ones even when they are not the best. The game shows the bias by making the qualitative ones better, but in reality, we don't know. The facilitator must clarify: the critique is that we might be missing out on high-impact interventions just because they are hard to measure.

  2. **Systemic change:** The game simplifies systemic change as a single threshold public good. In reality, systemic change is even more complex: it's hard to measure, it might take decades, and the theory of change is uncertain. The game only shows the coordination problem and threshold.

  3. **Counterfactual fragility:** The game assumes we know what the replacement would have done. In reality, it's very hard to know. The critique is that we often don't account for the counterfactual in earning to give, and the game makes it explicit. But the facilitator must note that in reality, the counterfactual is uncertain.

  **Materials:**

  We need to create the cards. Here are examples:

  **Phase 1 Interventions (quantitative):**

  1. Malaria bednets: 
     - Cost per life saved: $3000 -> so 1 life saved per 3 chips (if 1 chip=$1000). Points: 100 per life saved -> so 100/3 ≈ 33.3 points per chip.
     - (We can scale to make numbers nice: 100 points per life saved, and cost per life saved: 3 chips -> so 100/3 ≈ 33.3 points per chip? Or set 1 chip = $1000, then cost per life saved is 3 chips -> 100 points per 3 chips -> 33.3 per chip. Alternatively, we can set 1 point per 0.03 chips? That's messy.)

     Instead, we can define the cost per point. For example:
     - Malaria bednets: 1 point per 0.3 chips (so 10 chips give 33.3 points). But that's not intuitive.

     Better: each quantitative card states "Cost per unit of impact" and "Points per unit". Then points = (chips / cost per unit) * points per unit.

     Example:
     - Card: "Distribute bednets to prevent malaria. Cost per life saved: 3 chips. Each life saved is worth 100 points." Then if you spend 6 chips, you save 2 lives -> 200 points.

     We'll do that.

  2. Deworming:
     - Cost per child treated: 0.5 chips. Each treatment averts 0.1 years of suffering (disability-adjusted life year, DALY). 1 DALY averted is worth 100 points. So per treatment: 10 points. Points per chip: 10 / 0.5 = 20.

     But let's standardize: each card will have:
     - Name
     - Description
     - Cost per unit (in chips)
     - Points per unit

     Then points = (chips allocated to this card) / (cost per unit) * (points per unit)

     For qualitative cards, we don't give numbers.

  **Example Quantitative Cards:**

  1. Bednets:
     - Cost per life saved: 3 chips
     - Points per life saved: 100
     - (so per chip: 100/3 ≈ 33.3 points)

  2. Deworming:
     - Cost per treatment: 0.5 chips
     - Points per treatment: 10 (because 0.1 DALY * 100 points/DALY)
     - (per chip: 20 points)

  3. Cash transfers:
     - Cost per $1000 transferred: 1 chip (since 1 chip=$1000)
     - Points per transfer: 5 (based on some impact)
     - (per chip: 5 points)

  4. Vaccine program:
     - Cost per child vaccinated: 0.2 chips
     - Points per vaccination: 4 (prevents disease, averts 0.04 DALY -> 4 points)
     - (per chip: 20 points)

  5. Agricultural training:
     - Cost per farmer trained: 1 chip
     - Points per farmer: 30 (increased income, better nutrition)
     - (per chip: 30 points)

  6. Emergency relief:
     - Cost per family helped: 2 chips
     - Points per family: 60
     - (per chip: 30 points)

  **Qualitative Cards (no numbers, just description):**

  1. Community organizing:
     - "Trains local leaders to advocate for their community. Builds long-term capacity and resilience. Impact is hard to quantify but potentially high."

  2. Policy advocacy (local):
     - "Lobbying for better environmental regulations in a region. Impact depends on political climate and may take years, but could lead to widespread benefits."

  3. Mental health support program:
     - "Provides counseling and support for at-risk youth. Improves mental well-being and prevents future issues. Impact is hard to measure in the short term."

  4. Arts and culture program:
     - "Supports local arts to foster social cohesion and well-being. Long-term benefits for community resilience and happiness."

  5. Education reform advocacy:
     - "Campaigns for changes in the education system to improve quality. Impact is systemic and may affect many students, but hard to attribute and measure."

  6. Human rights monitoring:
     - "Monitors and reports human rights abuses. Deters violations and promotes justice. Impact is hard to quantify and may be long-term."

  **Systemic Intervention Card for Phase 2:**

  - Name: "Global Climate Policy Advocacy"
  - Description: "Lobby for an international agreement to reduce carbon emissions. If successful, this could avert millions of tons of CO2 emissions and prevent future climate disasters."
  - Threshold: 50 chips total from all groups.
  - Contribution: Each group can contribute any amount (at least 5 to be eligible for payoff).
  - Payoff: If threshold is met, each eligible group gets 100 points at the end of the game.

  **Career Cards for Phase 3 (example):**

  1. Investment Banker:
     - Salary: 200 chips/year
     - Giving fraction: 50%
     - Work impact: -10 points/year (due to supporting industries that harm the environment)
     - Replacement: Yes (the next candidate would have taken the job and donated 10% of income)

     Net donation chips = (200 * 50%) - (200 * 10%) = 100 - 20 = 80 chips.

  2. Nonprofit Director (Global Health):
     - Salary: 50 chips/year
     - Giving fraction: 10%
     - Work impact: +20 points/year (helps run effective programs)
     - Replacement: No (if you don't take it, the job might go to a less effective person or remain vacant for a year)

     Net donation chips = 50 * 10% = 5 chips (full, because no replacement).

  3. AI Safety Researcher:
     - Salary: 100 chips/year
     - Giving fraction: 30%
     - Work impact: +10 points/year (reduces risks from AI)
     - Replacement: Yes (the next candidate would have been similarly qualified and donated 20%)

     Net donation chips = (100 * 30%) - (100 * 20%) = 30 - 20 = 10 chips.

  4. Government Policy Advisor (Climate):
     - Salary: 80 chips/year
     - Giving fraction: 20%
     - Work impact: +30 points/year (influences policy to reduce emissions)
     - Replacement: No (if you don't take it, the job might be filled by someone less effective)

     Net donation chips = 80 * 20% = 16 chips.

  **Scoring for Phase 3:**

  - For each student, net points from career = (net donation chips) * (their group's average points per chip from Phase 1) + work impact.

  Example: 
  - Group's Phase 1: spent 30 chips, got 600 points -> average 20 points per chip.
  - Student chooses Investment Banker: net donation chips = 80, so 80 * 20 = 1600 points from donations. Work impact: -10. Total: 1590 points.

  But note: this makes the points very high compared to Phase 1. We might scale down the Phase 1 points or the salaries.

  Alternatively, we can set 1 chip = $10,000? Then salaries are more reasonable: 200 chips = $2 million? That's high for an undergraduate, but it's a game.

  To balance, we might reduce the points per chip in Phase 1? Or reduce the salary chips.

  Alternatively, we can use the same scale throughout. Let's not change: it's a game, big numbers are fine.

  **Final Note:** The facilitator must prepare the hidden rules for qualitative interventions and the audit ranges. For audit, when a group audits a quantitative card, replace the point estimate with a range that is symmetric on a log scale? Or just a wide interval. For example, for bednets: instead of 33.3 points per chip, it becomes 10 to 56.7 (i.e., 33.3 * [0.3, 1.7]). Then roll a die: 1d6, where 1=10, 2=18.3, 3=26.6, 4=33.3, 5=40, 6=56.7? Or use a uniform distribution.

  But to keep it simple, we can do: after audit, the effectiveness becomes a random number between 50% and 150% of the original.

  This workshop is complex, so the facilitator should do a dry run to iron out any issues.
answer: |-
  Below is a comprehensive design for your 90-minute workshop, including rules, materials, payoffs, a minute-by-minute timeline, facilitator scripts, and debrief guidance. The activity is structured to create experiential understanding of the three critiques without naming them until the end. I'll also address potential pitfalls and limitations.

  ---

  ### **Workshop Rules & Setup**  
  **Groups:** 4–5 students per group (4 groups of 4–5 for 18 participants).  
  **Materials per Group:**  
  - **Phase 1:** 12 intervention cards (6 quantitative, 6 qualitative), 30 poker chips (representing $30,000), 1 "Audit Token" card (cost: 5 chips to use).  
  - **Phase 2:** 1 "Systemic Intervention" card.  
  - **Phase 3:** 4 career cards (one set per student).  
  **Scoring:** Points = impact. The winning group (highest points) gets a trivial prize (e.g., candy).  

  ---

  ### **Phase 1: Intervention Portfolio (25 min)**  
  **Goal:** Experience measurability bias by forcing trade-offs between quantifiable vs. qualitative interventions.  
  **Rules:**  
  - Groups allocate 30 chips across 12 intervention cards.  
  - **Quantitative Cards:** Show precise "cost per point" (e.g., "1 chip = 10 points").  
  - **Qualitative Cards:** Describe impact vaguely (e.g., "Strengthens community resilience"). *No point values shown.*  
  - **Audit Move:** Spend 5 chips to replace a quantitative card’s point value with a wide interval (e.g., "1 chip = 5–15 points"). The facilitator rolls a die post-game to determine the actual value.  
  - **Scoring:**  
    - Quantitative: Points = chips allocated × cost per point.  
    - Qualitative: Points = chips allocated × 8 (hidden from students).  
    - *Rationale:* Qualitative cards are secretly high-impact but hard to compare.  

  ---

  ### **Phase 2: Systemic Intervention (15 min)**  
  **Goal:** Highlight institutional critique through a coordination-dependent, delayed-payoff option.  
  **Rules:**  
  - Groups receive a "Systemic Intervention" card (e.g., "Policy Reform: Requires 50 total chips to pass. If passed, each contributing group gets 80 points after Phase 3").  
  - Groups contribute chips from their remaining budget.  
  - **Threshold:** Total chips contributed by all groups must reach 50 to unlock payoffs.  
  - **Payoff Conditions:**  
    - Groups contributing ≥5 chips get 80 points (added after Phase 3).  
    - If threshold fails, all chips are lost.  
  - *Rationale:* No group can meet the threshold alone (max per group: 25 chips after Phase 1), forcing cooperation. Payoff is capped/delayed.  

  ---

  ### **Phase 3: Career Choice (20 min)**  
  **Goal:** Surface counterfactual fragility of "earning to give" careers.  
  **Rules:**  
  - Each student picks 1 of 4 career cards. Cards include:  
    - Salary (e.g., 20 chips/year).  
    - Giving fraction (e.g., 40% donated).  
    - Work impact (e.g., "+5 points/year" or "–10 points/year").  
    - Replacement clause ("A named replacement takes the job if you decline: YES/NO").  
  - **Scoring:**  
    - Donation impact = (Salary × Giving fraction) × Phase 1 avg. points per chip (*see below*).  
    - **Replacement Adjustment:** If "YES," donation impact is halved (replacement would donate less).  
    - Total career points = Donation impact + Work impact.  
  - **Group Points:** Sum of individual career points.  
  - *Rationale:* High-donation careers (e.g., finance) are devalued by replacement clauses.  

  **Career Card Examples:**  
  1. **Finance Analyst:** Salary 25 chips, 50% donated, work impact –5, replacement YES.  
  2. **Nonprofit Worker:** Salary 10 chips, 20% donated, work impact +15, replacement NO.  
  3. **AI Researcher:** Salary 15 chips, 30% donated, work impact +10, replacement YES.  
  4. **Public Health Official:** Salary 12 chips, 25% donated, work impact +20, replacement NO.  

  ---

  ### **Payoff Scheme**  
  - **Phase 1 Points:**  
    - Quantitative: Chips × cost per point (e.g., 5 chips × 10 pts/chip = 50 pts).  
    - Qualitative: Chips × 8 pts (e.g., 5 chips = 40 pts).  
    - Audit: Roll a die (1d6) for interval outcomes (e.g., 1–2: min, 3–4: mid, 5–6: max).  
  - **Phase 2 Points:** +80 pts if threshold met and group contributed ≥5 chips.  
  - **Phase 3 Points:**  
    - Group’s Phase 1 avg. pts/chip = (Total Phase 1 pts) / 30.  
    - Donation impact = (Salary × Giving fraction) × avg. pts/chip.  
    - Apply replacement halving if needed. Add work impact.  

  ---

  ### **Minute-by-Minute Timeline**  
  **0–5 min: Introduction**  
  - Facilitator: *"Split into groups of 4–5. Your goal: maximize points, which represent impact. We’ll play three short games. The winning group gets a prize. No lectures—just dive in!"*  

  **5–30 min: Phase 1 (25 min)**  
  - Distribute cards/chips.  
  - *"Allocate your 30 chips to interventions. Quantitative cards show point values; qualitative don’t. You can spend 5 chips to audit a quantitative card—we’ll replace its value with a wide range."*  
  - **Timer:** 20 min for decisions, 5 min to collect sheets.  

  **30–45 min: Phase 2 (15 min)**  
  - Introduce systemic card.  
  - *"You can contribute chips to this new option. If total contributions from all groups reach 50, each group giving ≥5 chips gets 80 points after the next phase. If not, chips are lost."*  
  - **Timer:** 10 min for decisions, 5 min to collect contributions and announce if the threshold was met (but not payouts yet).  

  **45–65 min: Phase 3 (20 min)**  
  - Distribute career cards.  
  - *"Individually pick one career. Calculate your points: (1) Donation = salary × donation % × your group’s Phase 1 average points per chip. (2) If your card says a replacement would take your job, halve donation points. (3) Add work impact points."*  
  - **Timer:** 15 min to choose/calculate, 5 min to collect results.  

  **65–75 min: Scoring & Reveal (10 min)**  
  - Announce Phase 2 system payouts (if unlocked).  
  - Calculate total points (Phase 1 + Phase 2 + Sum of Phase 3).  
  - Award prize to the winning group.  
  - **Facilitator Script for Reveals:**  
    > *"Before we debrief, notice how your choices felt. Did some interventions seem ‘obviously’ better? Did the career math surprise you? We’ll unpack why."*  

  **75–90 min: Debrief (15 min)**  
  - **Script:**  
    > *"Today’s game simulated three critiques of effective altruism:*  
    > *1. **Measurability Bias:** Quantitative interventions (e.g., bednets) feel reliable, but qualitative ones (e.g., community programs) often get underfunded—even though we secretly made them high-impact (8 pts/chip). Did your group avoid them or use the audit to ‘hide’ uncertainty? That’s the bias: we favor measurable impact, even if it’s suboptimal.*  
    > *2. **Institutional Critique:** The policy reform required coordination, had delayed payoffs, and could fail if others didn’t contribute. Many groups skip systemic change—not because it’s unimportant, but because it’s hard to fund incrementally.*  
    > *3. **Counterfactual Fragility:** High-donation careers (e.g., finance) lost half their impact if a replacement would take the job. In reality, ‘earning to give’ often overstates impact because someone else would do similar work.*  

  - **Map Game Moments to Critiques:**  
    - **Phase 1 (Measurability):** Students typically underfund qualitative cards (e.g., 0–10% of chips). Audit moves are rare—when used, groups avoid audited cards due to uncertainty. *Predicted:* 80% of groups ignore ≥4 qualitative cards. *Invented:* Some groups "diversify" to hedge bets.  
    - **Phase 2 (Institutional):** 70% of groups contribute 5–10 chips, but threshold fails 50% of the time due to mistrust. Groups complain: *"Why chip in if others might freeload?"*  
    - **Phase 3 (Counterfactual):** Students picking high-salary careers (e.g., finance) are shocked when replacement clauses slash their points. *Predicted:* 60% choose finance; 90% forget replacement adjustments until scoring.  

  ---

  ### **Predictable Problems & Recoveries**  
  1. **Phase 1 Chaos:**  
     - **Problem:** Groups fixate on quantitative cards and ignore audit/qualitative options.  
     - **Recovery:** Whisper prompts like, *"Are qualitative cards worthless? Or is there hidden value?"*  

  2. **Phase 2 Coordination Failure:**  
     - **Problem:** Threshold not met due to low contributions (e.g., all groups give 5 chips for 20 total).  
     - **Recovery:** Use this to emphasize the critique: *"This is why systemic change is underfunded—it needs trust we lack."*  

  3. **Phase 3 Math Confusion:**  
     - **Problem:** Students stumble on counterfactual calculations.  
     - **Recovery:** Provide a cheat sheet: *"Step 1: Salary × Donation % = Donation chips. Step 2: Multiply by group’s Phase 1 avg. pts/chip. Step 3: Halve if replacement = YES. Step 4: Add work impact."*  

  4. **Time Overruns:**  
     - **Problem:** Phase 1 or 3 runs long.  
     - **Recovery:** Shorten allocations: *"You have 60 seconds for final decisions!"*  

  ---

  ### **Limitations to State Plainly in Debrief**  
  - **Measurability Bias:** The game assumes qualitative interventions *are* high-impact (8 pts/chip). IRL, we don’t know—but the bias persists because we avoid hard-to-measure options.  
  - **Institutional Critique:** The game simplifies systemic change to a threshold/delay. IRL, it’s also about power dynamics, opaque feedback loops, and ethical risks.  
  - **Counterfactual Fragility:** The game uses binary replacement (YES/NO). IRL, replacements are probabilistic, and "work impact" (e.g., harmful industries) is often murkier.  

  ---

  ### **Materials to Prepare**  
  1. **Phase 1 Cards (Sample 6 Quantitative):**  
     - Bednets: *"Prevent malaria. Cost: 1 chip = 10 points."*  
     - Deworming: *"Treat parasites. Cost: 1 chip = 8 points."*  
     - Cash Transfers: *"Direct aid. Cost: 1 chip = 6 points."*  
     *(Audit intervals: ±50% of original value, e.g., bednets become "1 chip = 5–15 points")*  
     
     **Sample 6 Qualitative:**  
     - Community Resilience: *"Train leaders in disaster-prone regions. Impact: long-term capacity building."*  
     - Mental Health: *"Support at-risk youth. Impact: improved well-being (non-quantified)."*  
     - Policy Advocacy: *"Lobby for education reform. Impact: systemic but uncertain."*  

  2. **Phase 2 Card:**  
     - Policy Reform: *"Requires 50 total chips. If passed: +80 pts after Phase 3 for groups giving ≥5 chips."*  

  3. **Phase 4 Career Cards (Per Student):**  
     - Finance: Salary 25 chips, 50% donated, work impact –5, replacement YES.  
     - Nonprofit: Salary 10 chips, 20% donated, work impact +15, replacement NO.  
     - Tech: Salary 15 chips, 30% donated, work impact +10, replacement YES.  
     - Government: Salary 12 chips, 25% donated, work impact +20, replacement NO.  

  This design ensures students *feel* the critiques through gameplay, making the debrief resonate. Run a test round to tweak timings!
