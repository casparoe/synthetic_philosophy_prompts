prompt: |-
  I'm doing a PhD in history and I also work part time on a digital humanities project where we take published monographs and tag every single sentence. Each sentence gets one of three labels: 'sourced' (there's a document underneath it), 'inferred' (no document actually says it, the author got there by reasoning, generalization, or common sense), and 'framed' (it's the author's interpretive choice — what to call the thing, who counts as an actor, where the story starts and ends, what kind of story it is). We also spot check footnotes and tag whether the cited source really supports the sentence it's attached to. The people on the project keep fighting about whether this is neutral metadata or whether it already commits us to a position about whether there is a fact of the matter about the past. I think it does commit us, but I can't say exactly where.

  It's made me look differently at what ordinary academic history already presupposes. On the one hand the whole apparatus behaves as if there's a real past we're converging on: you go to the archive, you cite primary sources rather than secondary ones, reviewers spot check your footnotes, journals print corrections and sometimes retract when someone finds you got a date or a quotation wrong, and fabricating a source will end your career. On the other hand nobody in my department believes the Rankean slogan about showing the past as it actually was, everyone's read Carr on the facts of history always reaching us already selected by somebody, and since Hayden White people will happily say in a seminar that the narrative shape — tragedy, comedy, romance, satire — is something the historian puts onto the material rather than finds in it. And the discipline is wildly more relaxed about the second kind of thing: almost nobody is ever made to retract an interpretation, only a fact, and there's a strong norm that saying "that's my reading" settles the matter.

  So: what does that bundle of practices actually presuppose about historical knowledge? Reconstruct the implicit theory, and separate what the practice strictly presupposes from what it merely fits comfortably with — I suspect footnote discipline and the punishment of fabrication commit you to less than people think, while the refusal to ever correct an interpretation commits you to more. Tell me whether the parts are consistent with each other. Two things puzzle me especially: we punish fabrication savagely and correct wrong dates, but a source that's been badly read is barely a problem and an interpretation is never withdrawn, which feels like it presupposes that the chain of attribution matters more than the truth of what's said; and we let a sentence resting on a self-interested document count as 'sourced' on exactly the same footing as one resting on a document nobody had a stake in. Then bring it back to my tagging scheme: which kinds of sentence should break a three-way split like ours — causal claims, claims about what someone believed, claims from silence or from absence in the archive, claims about what was typical, counterfactuals — and what would have to change in the practice of history if we took the Whitean view seriously enough to build it into the way we write, review, and correct books?
reasoning: |-
  Okay, let me unpack this rich question about historical epistemology and tagging practices. The user is grappling with how their digital humanities project's sentence-level tagging intersects with deep disciplinary assumptions about historical truth. 

  First, I need to diagnose the core tension they describe: history's simultaneous commitment to factual rigor (archives, citations, retractions) and interpretive freedom (narrative construction, Whitean perspectives). The user's team is fighting over whether tagging "sourced/inferred/framed" is neutral or philosophically loaded. 

  Hmm... the user's observations about disciplinary practices are razor-sharp. That asymmetry between punishing factual errors but never interpretive ones is particularly telling. It suggests history operates on a dual-track epistemology: brute facts are corrigible, but meaning-making is inherently perspectival. 

  The tagging scheme actually reveals three distinct truth-claims:
  - "Sourced" implies transparent mediation (document → truth)
  - "Inferred" accepts constructive reasoning
  - "Framed" embraces outright fabrication (in the neutral sense)

  But here's the rub: when they tag a sentence as "sourced" based on a self-interested document, they're obscuring the document's own interpretive layer. That's where the scheme might implicitly endorse naive realism.

  For the disciplinary analysis, I should distinguish between what practices logically require versus what they accommodate. The footnote apparatus only demands that claims be traceable to evidence - not that the evidence perfectly mirrors reality. Fabrication is punished because it breaks the chain of custody, not necessarily because it misrepresents the past itself. 

  The real inconsistency the user spotted is fascinating: historians care intensely about attribution chains but seem indifferent to whether those chains actually support the claims. That suggests the social ritual of citation matters as much as its epistemic function. 

  On interpretive immunity - that's where Hayden White's ghost looms largest. If narratives are truly constructed, why don't we demand rigor in their assembly? The discipline seems to have quietly agreed that interpretations can't be "wrong," only "unpersuasive." 

  For the tagging implications, I'm seeing several fault lines:
  - Causal claims straddle sourcing and inference
  - Belief attributions often mask inference as sourcing
  - Absence-based arguments are inference disguised as negative evidence
  - Counterfactuals live entirely in "framed" territory

  If we took White seriously, we'd need to tag every narrative device as "framed," but that might collapse the system. More radically, we might abandon the pretense that "sourced" sentences are less constructed than others. 

  The user's deeper struggle seems to be: can metadata ever be philosophically innocent? Probably not - but making those assumptions explicit could revolutionize how we read histories. Maybe the tagging project's real value is exposing the constructedness we usually ignore.
answer: |-
  Your project brilliantly exposes history's epistemological fault lines. Let's reconstruct the discipline's implicit theory of knowledge by analyzing its practices, then examine your tagging scheme's commitments and potential blind spots.

  ### The Implicit Theory of Historical Knowledge
  1. **Core Presuppositions from Practice:**
     - **Ontological Minimalism:** There *are* recoverable facts about the past (e.g., "Charles I was executed on January 30, 1649"), but these are sparse "anchor points." Fabrication/correction practices presuppose *some* mind-independent reality.
     - **Attributional Rigor:** The chain of evidence matters as much as truth. A claim backed by a verifiable source (even biased) is legitimate; an uncited "true" claim is professionally unacceptable. This prioritizes *methodological accountability* over metaphysical certainty.
     - **Interpretive Sovereignty:** Once minimal factual accuracy is established, narrative construction ("framing") is beyond adjudication. This presupposes that meaning is *made*, not found, and reflects Carr/White's influence.

  2. **What Practices *Don't* Necessarily Presuppose:**
     - That the past is *fully* recoverable or objectively "knowable."
     - That sources transparently reflect reality (hence no penalty for "bad readings" if cited honestly).
     - That narrative structures inhere in events themselves.

  3. **Consistency Check:**
     - **Tension:** Punishing fabrication implies a reality beyond texts; interpretive immunity suggests all meaning is constructed. *Resolution:* Historians distinguish between **brute facts** (verifiable via evidence chains) and **meaning-ascription** (inherently perspectival).
     - **Attribution vs. Truth Paradox:** The discipline prioritizes *procedural integrity* ("show your work") over absolute truth. A well-sourced but misleading claim (e.g., from propaganda) is "valid" history; an unsourced true claim is not. This protects the scholarly ecosystem but risks fetishizing process over insight.

  ### Your Tagging Scheme: Commitments & Blind Spots
  - **Implicit Commitments:**  
    Your scheme presumes a **three-layer epistemology**:  
    1. **Sourced** = Grounded in empirical traces (presupposes documents provide access points to the past).  
    2. **Inferred** = Rational construction from evidence (accepts inference as legitimate).  
    3. **Framed** = Imposition of narrative/meaning (tacitly endorses Whitean constructivism).  
    → This *does* commit you to:  
    - A distinction between "evidence-based" and "interpretive" claims.  
    - The validity of tracing claims to sources as an epistemic practice.  

  - **Problematic Sentence Types for Your Triad:**  
    | Sentence Type          | Tagging Issue                                     | Epistemic Challenge                  |  
    |-------------------------|--------------------------------------------------|--------------------------------------|  
    | **Causal Claims**       | Often blend "sourced" (event A) + "inferred" (caused B) | Inference masked as description     |  
    | **Belief Attributions** | "Sourced" if diary; "inferred" if no direct evidence | Risk of psychologizing the past      |  
    | **Claims from Silence** | "Inferred" from absence, but absence ≠ evidence | Over-interpretation of gaps          |  
    | **Typicality Claims**   | "Inferred" from samples, but representativity unclear | Generalization beyond evidence     |  
    | **Counterfactuals**     | Pure "framed," yet often presented as "inferred" | Narrative device disguised as analysis |  

  ### Taking Hayden White Seriously: Implications for Practice
  If history fully embraced its constructedness:  
  1. **Writing:**  
     - Explicitly tag narrative choices (e.g., "this tragedy arc is my framing device").  
     - Treat "sources" as raw material for construction, not truth-receptacles.  
     - Acknowledge counterfactuals/typifications as speculative.  

  2. **Reviewing:**  
     - Evaluate narrative coherence/persuasiveness, not just "accuracy."  
     - Scrutinize *how* inferences bridge evidence gaps.  
     - Demand transparency about framing choices.  

  3. **Corrections:**  
     - Retract not just factual errors but *misleading framings* (e.g., omitting key context that alters meaning).  
     - Correct flawed inferences masked as descriptions (e.g., "X caused Y" without evidence of mechanism).  

  **Your Project's Revolutionary Potential:** By tagging sentence-by-sentence, you force historians to confront what they routinely blur:  
  - The leap from document to claim.  
  - The seam between evidence and emplotment.  
  - The **constructedness of even "sourced" statements** (e.g., choosing *which* source to cite is a framing act).  

  **Conclusion:** History's practice presupposes a *thin realism* about facts but a *thick constructivism* about meaning. Your tagging scheme reflects this duality but risks reifying the fact/frame binary. The real power of your project lies in exposing how "sourced" and "inferred" claims are *already framed* by the historian's choices. To truly integrate White, you might need a fourth tag: **"constructed"** – acknowledging that every sentence, even if sourced, is a product of the historian's interpretive act. This wouldn't undermine empiricism; it would ground it in reflexive honesty.
