prompt: |-
  My friend Mo did a PhD in semantics before she bailed for a data job, and for the past few weeks she's let me read her little scenarios over text and tell her which "if" sentences I think work in them — except she's the one giving the verdicts, and I've definately started writing them down because I want to figure out what rule she's actually running. I don't know any of the technical vocabulary for this stuff, so sorry if I describe it clumsily. The thing I keep noticing is that she treats the plain "if X did/didn't, then Y" sentences and the "if X had/hadn't, then Y would have" ones as different animals, and I can't tell exactly where the difference bites.

  Here's the track record so far.

  1. Camp stove, never used, dry night, igniter fine.
  - "If I had pressed the igniter, it would have lit." True.
  - "If I had pressed the igniter and the fuel line had been blocked, it wouldn't have lit." Also true.
  - "If I had pressed it, the line had been blocked, and I had primed it first, it would have lit." Also true.

  2. Same stove: "If I had pressed the igniter, it might not have lit." True. When I pointed out that this seems to clash with the first sentence in 1, she said it doesn't, because "would have" means what happens in the normal run of things, not in literally every possibility you can cook up.

  3. The lab freezer got unplugged overnight. Only Priya and Sam had keycard access that night, and the temperature log shows a steady climb from 2am, so we know for certain somebody unplugged it — just not who.
  - "If Priya didn't unplug it, Sam did." Fine, she says — true, even.
  - "If Priya hadn't unplugged it, Sam would have." No, she says, definitely not. Priya's not doing it wouldn't have made Sam do it.

  4. The freezer's temperature crossing a threshold pings the night guard's phone. Automatic, reliable, never fails.
  - "If the temperature hadn't crossed the threshold, the guard's phone wouldn't have pinged." True.
  - "If the guard's phone pinged, the temperature crossed the threshold." True — and she had no problem at all with this one running backwards, from the later thing to the thing that caused it.

  5. The new one. A greenhouse vent: purely mechanical, a wax cylinder that expands and pops the vent open once the air inside hits 30°C. No electricity, no handle, can't be forced open by hand, hasn't failed in twelve years, and the gardener has never once seen the hinge stick — though he admits it could in principle. Right now I can see from the path that the vent is standing open. The temperature logger's battery died yesterday so nobody knows how hot it actually got, but it was sunny and the gardener says it hits 30 on most sunny afternoons.

  Two sentences about it:
  - "If the vent opened, the temperature hit 30°C."
  - "If the vent hadn't opened, the temperature wouldn't have hit 30°C."

  My own guess is that she takes the first one but that the second one is a real fork: she either accepts it too, rejects it, or says it doesn't have a proper answer. What I actually want to know is what rule she's running that fits 1 through 4 — I suspect more than one rule fits those, and that they come apart on the second sentence in 5. So: what are the candidate rules, what does each one say about that sentence, which is your best guess for her and why, and what single extra scenario should I text her next week to separate the rules that survive? Please write the answer in American English, I'm forwarding it to someone in the States.
reasoning: |-
  Okay, the user's friend Mo has a specific way of evaluating "if" sentences based on different scenarios, and the user wants to figure out her underlying rule. Let me start by understanding the patterns from the given examples.

  First, in the camp stove scenario (1), Mo accepts counterfactuals with "had" and "would have" when they align with normal conditions. But in sentence 2, she allows "might not" because of possible abnormalities, showing she considers normal vs. all possibilities.

  Then, the freezer unplugging (3). The indicative "didn't" is fine, implying factual inference, but the counterfactual "hadn't... would have" is rejected because removing Priya's action doesn't necessitate Sam's. This suggests she distinguishes between factual conditionals and counterfactuals that imply causation or dependency.

  In the temperature ping scenario (4), both directions work. The counterfactual is accepted because the system is reliable, and the indicative backward conditional is also fine, indicating she allows biconditionals when there's a strong, reliable connection.

  Now, the greenhouse vent (5). The user is unsure about the second sentence. The first one seems straightforward: if the vent opened, temp hit 30°C. But the second is tricky. If the vent didn't open, would the temp not have hit 30? Since the vent opening is caused by temperature, not the other way around, rejecting this makes sense. The vent not opening might mean the temp didn't reach 30, but it's possible the temp did hit 30 and the vent failed. Mo would likely reject the second sentence because the dependency is one-way.

  The key is Mo's distinction between indicative conditionals (about facts) and counterfactuals (about alternatives). She requires counterfactuals to have a causal or dependency link. In scenario 3, "Sam did" is factual, but "Sam would have" implies Priya's inaction causes Sam's action, which isn't true. In scenario 4, the system's reliability supports the counterfactual. For the vent, the second sentence implies the vent's state causes the temperature, which is backward. So she'd reject it.

  The user needs a test scenario to differentiate rule candidates. One candidate is strict causal dependency: counterfactuals need a direct cause-effect. Another is normality-based: what happens under normal conditions. The vent's second sentence fails the causal direction test. To test between normality and causal direction, a scenario where normal conditions suggest one thing, but causality is inverse. For example, a backup system: if the main fails, the backup kicks in. "If the main hadn't failed, the backup wouldn't have activated" is true causally, but under normality, if the main doesn't fail, the backup isn't needed. But if the backup activates without the main failing, that's abnormal. Mo might accept the counterfactual if causality is clear, regardless of normality. The proposed test with the backup system where the backup activates without the main failing would clarify if she prioritizes causality over normality.
answer: |-
  Based on Mo's pattern across scenarios 1-4, she's likely distinguishing between **indicative conditionals** (describing factual inference or general rules) and **counterfactual conditionals** (describing hypothetical "what-if" scenarios that *didn't* happen). Crucially, she treats counterfactuals ("if X had... Y would have...") as requiring a **causal or dependency relationship** under normal circumstances, not just logical possibility. Here's how the rules break down:

  ### Mo's Likely Rules
  1.  **Indicative Conditionals ("If X did/didn't, Y did/didn't"):**
      *   Describe **factual, evidential, or definitional relationships**.
      *   Can be accepted if X is evidence for Y, or if there's a known correlation/rule (even if not strictly causal).
      *   *Why it fits 3 & 4:* "If Priya didn't unplug it, Sam did" is a factual inference from known possibilities. "If the phone pinged, the temp crossed" describes a reliable, definitional relationship (ping implies temp crossed).

  2.  **Counterfactual Conditionals ("If X had/hadn't, Y would have..."):**
      *   Describe **what *would* have happened in a specific, non-actual scenario**.
      *   Require that **Y depends causally on X** in the normal run of events.
      *   "Would have" implies **high certainty under standard conditions**; "might have" acknowledges exceptions.
      *   *Why it fits 1 & 2:* The stove igniting *depends* on pressing the igniter under normal conditions. The "might not" in (2) acknowledges possible abnormalities (like blocked fuel).
      *   *Why it fits 3:* "If Priya hadn't unplugged it, Sam would have" is rejected because Priya *not* unplugging it doesn't *cause* Sam to plug it in; it's a factual inference, not a counterfactual dependency.
      *   *Why it fits 4:* The phone *not* pinging *depends* on the temp *not* crossing the threshold (causal/dependency chain).

  ### Applying Rules to the Greenhouse Vent (Scenario 5)
  *   **Sentence 1: "If the vent opened, the temperature hit 30°C."**
      *   **Type:** Indicative Conditional (present/factual).
      *   **Verdict:** **TRUE** (Mo accepts). The open vent is *evidence* the temp hit 30°C. It describes the known mechanism: opening implies temp reached threshold under normal function. The gardener's confidence and the lack of observed failures support this as a reliable inference.
  *   **Sentence 2: "If the vent hadn't opened, the temperature wouldn't have hit 30°C."**
      *   **Type:** Counterfactual Conditional.
      *   **Verdict:** **FALSE** (Mo rejects). This reverses the dependency. The vent opening *depends on* the temperature, not the other way around. The temperature hitting 30°C is *caused by* external heat (sun), *not* by the vent opening (which is a *result*). The vent failing to open (e.g., hinge sticking) *would not prevent* the temperature from rising if the sun was hot enough. The "wouldn't have" implies a causal link that doesn't exist.

  ### Candidate Rules & How They Fare
  1.  **Strict Causal Dependency (Counterfactuals Only):**
      *   **Rule:** Counterfactuals require X to be a direct cause of Y.
      *   **Fits 1-4:** Yes (ignition depends on pressing, ping depends on temp; Sam's action isn't *caused* by Priya's inaction).
      *   **Predicts on 5:** Rejects Sentence 2 (vent isn't cause of temp).
      *   **Best Guess:** **Yes, this is Mo's core rule.** It cleanly explains all rejections.

  2.  **Normality-Based Semantics:**
      *   **Rule:** "Would have" asserts Y in the *most normal* worlds where X happens. "Might have" acknowledges less normal possibilities.
      *   **Fits 1-4:** Yes (stove lights normally; Sam doing it isn't a *result* of Priya not doing it, just an alternative fact; ping reliably follows temp).
      *   **Predicts on 5:** *Could* accept Sentence 2 if "normal" includes vent function affecting temp (e.g., if vent opening cools things). But the description says it's purely an effect, not a cause. Likely **Rejects**.
      *   **Plausible, but less precise:** Explains "might" vs "would", but struggles slightly with the *directionality* rejection in (3) without the causal element.

  3.  **Material Implication (Logic 101):**
      *   **Rule:** "If P then Q" is false *only* if P true and Q false. Counterfactuals treated similarly.
      *   **Fits 1-4:** **Fails.** It would accept *both* sentences in (3) and the rejected counterfactual in (3). Mo clearly rejects that.
      *   **Predicts on 5:** Likely accepts both sentences. **Ruled Out.**

  4.  **Biscuit Conditionals / Relevance:**
      *   **Rule:** Conditionals express relevance (e.g., "There are biscuits if you want some").
      *   **Fits 1-4:** **Fails.** Doesn't explain the specific rejections in counterfactuals (3) or the "might" distinction (2).
      *   **Predicts on 5:** Not applicable. **Ruled Out.**

  **Best Guess for Mo:** She primarily uses **Causal Dependency** for counterfactuals ("If X had... Y would have") and **Evidential/Inferential** reasoning for indicatives ("If X did... Y did"). Normality plays a supporting role in judging the strength ("would" vs "might") of counterfactuals. **She will reject the second sentence in (5).**

  ### The Decisive Test Scenario
  To definitively separate **Strict Causal Dependency** from a pure **Normality-Based** approach, text her this next week:

  **Scenario: The Backup Generator**
  *   A server room has a main power supply (Grid) and a backup diesel generator (Gen).
  *   **Reliability:** The Grid fails about 5 times a year. The Gen *always* kicks in within 2 seconds if the Grid fails. There's *no direct connection* where the Gen starting *causes* the Grid to fail. It's purely a backup.
  *   **The Event:** Last night, the logs show the Gen ran for 1 hour. This means the Grid definitely failed (Gen only runs if Grid fails). We don't know *why* the Grid failed.

  **Test Sentences:**
  1.  "If the Grid hadn't failed, the Gen wouldn't have run." (Counterfactual)
  2.  "If the Gen ran, the Grid failed." (Indicative)

  **How the Rules Predict:**
  *   **Strict Causal Dependency:** Accepts (2) (Gen running is evidence/result of Grid failure). **Rejects (1).** The Grid *not* failing doesn't *cause* the Gen *not* to run; the Gen not running is just the normal result of the Grid functioning. The dependency is one-way (Grid fail -> Gen run).
  *   **Pure Normality-Based:** Accepts both. In the most normal worlds where the Grid *didn't* fail (the antecedent of 1), the Gen *wouldn't* run (the consequent). (2) is straightforwardly true indicatively.
  *   **Mo's Likely Verdict (Based on Causal Dependency):** She'll **accept (2)** but **reject (1)**. Sentence (1) sounds like the Gen running *depends on* the Grid failing, which is true, but "If Grid hadn't failed, Gen wouldn't have run" *reverses* the dependency – it implies the Grid not failing would have actively *prevented* the Gen from running, which isn't the case. The Gen simply doesn't run if not needed. Her rejection will mirror her rejection in the Freezer (3) and Greenhouse (5) cases, confirming the causal direction rule is paramount for her counterfactuals.

  **Why it Separates Them:** This scenario has a clear one-way dependency (Grid failure causes Gen run) and high reliability/normality. Normality semantics accept the counterfactual (1), while strict causal direction (focusing on the *lack of causal link* from Grid functioning *to* Gen stopping) rejects it. Her rejection of (1) would strongly confirm the causal dependency rule is her core principle for counterfactual "would have" statements.
