prompt: |-
  I work in psychophysics and use signal detection theory daily: d′, response criterion, log-likelihood ratios, ROC and isosensitivity curves, payoff matrices, optimal criterion placement, and the standard point that sensitivity and bias can be estimated separately once ground truth across many trials is available. My philosophy training stops at two undergraduate courses. I am trying to get clear on the dispute among classical invariantism, epistemic contextualism, and pragmatic encroachment — the view that what is at stake for a subject can raise the bar for whether she knows — and I want it in my vocabulary rather than theirs.

  Restate each of the three positions as faithfully as you can in signal-detection terms, applied to the familiar case pairs in which the same evidence and the same true belief seem to suffice for knowledge when nothing hangs on being right and to fall short when a mistake would be costly. For each view, say what plays the role of the sensitivity quantity, what plays the role of the decision variable, what sets the threshold, and which of these the view claims is fixed by the meaning of "knows" rather than supplied by the situation.

  Then the residue report, which is the part I care about. Three things in particular. First: in signal detection theory a criterion shift trades false alarms against misses symmetrically, whereas stakes in these cases seem only ever to raise the bar — so is encroachment really an operating-point shift, or a one-directional threshold raise, and does the difference carry any weight? Second: sensitivity and criterion are identifiable only given ground truth across trials, while for knowledge ascriptions the only data are intuitions about cases; does that make the three views notational variants of one another, a parameter-identification failure rather than a substantive dispute, or is that impression an artifact of the translation? Third: the argument that knowledge is what licenses action and assertion seems to have no counterpart in a framework whose outputs are just decisions under a payoff matrix.

  For each item, say what you had to fudge to make it fit, and close with a verdict on the residue: does it point to something signal detection theory cannot express, or to something the epistemologists' debate was never clearly about?
reasoning: |-
  Okay, I need to tackle this query from a psychophysics expert who uses signal detection theory (SDT) daily. They want me to translate three epistemological positions—classical invariantism, epistemic contextualism, and pragmatic encroachment—into SDT terms. Then, address three specific residues about how well this translation works. 

  First, recalling the core SDT concepts: d′ (sensitivity), criterion (bias), ROC curves, payoff matrices. The user's familiar with cases where identical evidence leads to different knowledge ascriptions based on stakes—like whether a barn is real (low stakes) vs. needing certainty for a bank deposit (high stakes). 

  For classical invariantism: This view says "knows" has a fixed threshold. In SDT, that means a single criterion across contexts. Sensitivity (d′) is the strength of evidence, and the criterion is set by epistemic standards alone—unchanged by stakes. The decision variable is the perceived evidence strength. But this doesn't explain why we deny knowledge in high-stakes cases with the same evidence. So I'll note the tension: invariantism must claim our intuitions are mistaken in high-stakes scenarios, which feels unsatisfying. 

  Moving to epistemic contextualism: Here, "knows" shifts meaning based on conversational context. In SDT, the criterion changes with stakes, but d′ stays the same—it's purely a threshold shift. The sensitivity is still d′, and the criterion is set by what's salient in the context. The meaning of "knows" itself varies, making the threshold contextual. This fits neatly with asymmetric effects: only the bar moves, not sensitivity. 

  Then pragmatic encroachment: It ties knowledge directly to practical stakes. In SDT, this is like shifting the criterion due to changes in the payoff matrix—higher cost for misses raises the threshold. Sensitivity (d′) remains stable, but stakes alter the optimal criterion. The meaning of "knows" is fixed, but practical factors set the threshold. This captures the one-directional raise in standards. 

  Now the residue questions: 

  First, about asymmetric criterion shifts. SDT allows symmetric trades, but stakes only seem to raise the bar. I think contextualism handles this best—it's purely threshold-raising without sensitivity changes. Encroachment could explain it via asymmetric payoff matrices (e.g., punishing misses more). The difference matters: if stakes affected sensitivity, it'd confuse evidence strength with decision caution. 

  Second, on identifiability. In SDT, we need ground truth data to separate d′ and criterion, but epistemology relies on intuitions without such data. This might make the views seem like notational variants—same surface behavior, different interpretations. But I disagree: the theories make distinct claims about what's fixed (meaning vs. threshold) and what causes shifts. Without empirical data, the debate could be underdetermined, but it's not vacuous. 

  Third, the action/licensing point. SDT outputs decisions, while knowledge ascriptions involve normative licensing. I'll admit this doesn't map perfectly—SDT has no direct analog for "warrant for action." Pragmatic encroachment comes closest by linking knowledge to actionability, but it's still an add-on. 

  Fudges in the translation: 
  - Treating belief/evidence as a continuous decision variable oversimplifies; epistemology often deals with binary beliefs. 
  - Ground truth reliance is idealized—real knowledge attributions lack trial data. 
  - The licensing aspect isn't modeled in SDT's payoff matrices; they handle costs/benefits but not justification. 

  Verdict: The residues highlight real limitations. SDT can model threshold shifts beautifully but struggles with the normativity of knowledge—why we care about "knows" beyond decision outcomes. The debate isn't just about parameter identification; it's about what knowledge fundamentally is. However, SDT exposes that some disputes might reduce to empirical questions (e.g., does stakes affect perceived evidence strength?). 

  Overall, the user's SDT lens clarifies mechanics but can't fully capture epistemic normativity. The residue points to genuine gaps, especially around justification and action.
answer: |-
  Here's a faithful translation of the three epistemological positions into signal detection theory (SDT) terms, followed by a residue report addressing your specific concerns. I'll explicitly map the SDT components you requested for each view, using the classic "low-stakes vs. high-stakes barn" case (identical perceptual evidence, same true belief, varying costs of error).

  ---

  ### **SDT Translation of Epistemological Positions**
  **Case Setup:**  
  - *Low Stakes:* Subject sees barn-like object in a countryside drive (nothing hinges on accuracy).  
  - *High Stakes:* Subject must identify a real barn to defuse a bomb (error is catastrophic).  
  - *Evidence Strength (d′):* Identical in both cases (same visual input, same environment).  
  - *Ground Truth:* The object is a real barn (hit if believed, miss if doubted).  

  #### **1. Classical Invariantism**  
  - **Sensitivity (d′)**: Objective strength of evidence (e.g., visual clarity, typicality of barn features). Fixed by the world.  
  - **Decision Variable**: Perceived likelihood of "barn" vs. "facade" given sensory evidence.  
  - **Threshold (Criterion)**: Fixed epistemic standard for knowledge (e.g., p > 0.95). Set solely by *truth-conduciveness*.  
  - **Fixed by "Knows"**: The **threshold** is semantically invariant. Stakes don't alter what "knows" requires.  
  - *SDT Interpretation:* In high stakes, the subject *does* know (same d′, same criterion), but we deny knowledge because practical pressures make their confidence *feel* inadequate. Invariantism treats this as a psychological error (misplaced doubt) or pragmatic implicature—not a change in knowledge itself.  

  #### **2. Epistemic Contextualism**  
  - **Sensitivity (d′)**: Objective evidence strength (as above). Unchanged by context.  
  - **Decision Variable**: Perceived likelihood relative to *contextually relevant alternatives* (e.g., in high stakes, "facade" becomes salient).  
  - **Threshold (Criterion)**: Shifts with conversational context (e.g., "bomb-defusal" context raises the bar).  
  - **Fixed by "Knows"**: The **meaning of "knows"** itself shifts—it refers to different thresholds in different contexts.  
  - *SDT Interpretation:* Identical d′, but criterion tightens in high stakes because the context amplifies the cost of false alarms (mistaking a facade for a barn). ROC curves are unchanged, but operating point moves leftward. Knowledge ascriptions track this shift: "knows" in low stakes ≠ "knows" in high stakes.  

  #### **3. Pragmatic Encroachment**  
  - **Sensitivity (d′)**: Objective evidence strength (as above). Unchanged by stakes.  
  - **Decision Variable**: Expected *practical utility* of acting on belief (e.g., "defuse bomb if barn" vs. "don't defuse if unsure").  
  - **Threshold (Criterion)**: Set by **stakes-dependent payoff matrix**. Higher cost of misses (false negatives) raises the threshold for acting/asserting.  
  - **Fixed by "Knows"**: The **threshold** is semantically fixed, but stakes *pragmatically encroach* on whether evidence clears it. Knowledge requires sufficient evidence *for action*.  
  - *SDT Interpretation:* Payoff matrix changes: in high stakes, misses (failing to defuse a real bomb) are catastrophic. Optimal criterion shifts conservatively. Belief strength (d′) is unchanged, but knowledge is denied because evidence is insufficient *for high-stakes action*.  

  ---

  ### **Residue Report**
  **1. Asymmetry of Stakes Effects**  
  - **SDT Fit**: Stakes only raise the bar (never lower it) because payoff matrices asymmetrically penalize false alarms (FAs) in high-stakes contexts. In bomb-defusal, a FA (defusing falsely) may be costly, but a miss (not defusing a real bomb) is catastrophic. This skews the payoff matrix, making conservative shifts uniquely rational.  
  - **Fudge**: SDT *can* model symmetric criterion shifts (e.g., equal rewards/costs), but asymmetric payoffs explain unidirectional raises. Encroachment/contextualism treat this as a rational adjustment—not a flaw.  
  - **Weight**: This asymmetry is *crucial*. It shows knowledge norms are action-guiding: stakes raise thresholds because errors have moral/practical gravity, not just epistemic weight.  

  **2. Identifiability Without Ground Truth**  
  - **SDT Fit**: Without ground-truth data (trial history), d′ and criterion are *underdetermined* by single-trial intuitions. This creates a risk of notational variance: all three views can describe the same case by tweaking d′ (invariantism), criterion (contextualism), or payoffs (encroachment).  
  - **Fudge**: Epistemologists lack your "many trials" luxury—they infer parameters from armchair cases. But the debate isn't vacuous:  
    - Invariantism insists d′ *must* be fixed across cases.  
    - Contextualism/encroachment deny this, attributing changes to threshold shifts.  
  - **Verdict**: Not purely notational. The dispute is about what's *metaphysically fixed*: invariantism anchors "knows" to d′, others to context/payoffs. But without empirical data, adjudication is hard.  

  **3. Action/Assertion Licensing**  
  - **SDT Fit**: SDT outputs decisions (e.g., "act as if barn"), not knowledge ascriptions. The "knowledge licenses action" argument has no direct analog because:  
    - SDT optimizes decisions given payoffs;  
    - Knowledge is a *normative status* justifying action.  
  - **Fudge**: Pragmatic encroachment *approximates* this by tying knowledge to actionability, but SDT lacks a "warrant" layer. In SDT, you act when expected utility exceeds threshold; in epistemology, knowledge *permits* assertion/action *because* it meets epistemic norms.  
  - **Verdict**: This residue exposes a gap. SDT handles *decision rationality* but not *epistemic justification*. The licensing intuition suggests knowledge is more than optimized signal-response—it’s a social/linguistic norm.  

  ---

  ### **Conclusion: The Residue Verdict**  
  - **What SDT Captures**: Brilliantly models threshold dynamics (criterion shifts via payoffs/context) and separates sensitivity from bias. It reveals how stakes *should* affect decisions, explaining asymmetric "raised bar" effects.  
  - **What SDT Misses/Exposes**:  
    - **Limitation**: SDT cannot express the *normative* role of knowledge (e.g., "license for action"). It describes *how we decide*, not why we call some decisions "knowledge."  
    - **Debate Clarification**: The core dispute is **not** about parameter identification per se. It's about whether "knows" is a:  
      - Fixed threshold (invariantism),  
      - Contextual indexical (contextualism),  
      - Hybrid of evidence + stakes (encroachment).  
    Your residue shows epistemologists often conflate:  
    - (a) *Psychology* (how stakes affect confidence),  
    - (b) *Semantics* (what "knows" means),  
    - (c) *Normativity* (when belief is action-licensing).  
    SDT clarifies (a) but struggles with (b)/(c).  

  **Final Verdict**: The residue points to **something the debate was never clearly about**—specifically, the conflation of *descriptive decision mechanics* (SDT's strength) with *normative epistemic concepts*. Epistemologists need your "ground truth across trials" rigor: without it, intuitions about single cases underdetermine theories. But SDT cannot resolve the *philosophical* question of whether "knows" is stakes-invariant because that hinges on semantics/normativity, not just psychophysics.
