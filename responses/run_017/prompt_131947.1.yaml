prompt: |-
  I'm writing a novel about a conspiracy against a tyrant in a city that's sort of late-medieval-but-not-anywhere-real, and I've been reading Aquinas on tyrannicide — the commentary on the Sentences, where as far as I can tell he distinguishes the ruler with no title at all from the lawful one who governs rottenly, and is much more relaxed about the first. It felt tidy until I started listing who I actually want my readers to cheer for.

  My gut verdicts:

  - The captain who took the citadel by force and rules with no claim whatsoever, knifed by an ordinary citizen: fine.
  - A different captain, also seized power by force, but rules well, fair taxes, keeps the peace — killed in order to restore the hereditary heir, who is a wastrel: not fine.
  - A properly crowned and anointed king who has turned genuinely cruel: I flinch away from killing him and I don't trust the flinch. Genuinely don't know.
  - A demagogue the majority adores, who's abolished the elections and is grinding down one minority: fine, I think, although most of the city would call it murder.
  - The chancellor who actually runs the prisons but seized nothing himself: fine, yet it feels like a different kind of act — nearer war than punishment.
  - Killing when everyone knows the successor will be worse and there'll be a five-year famine: not fine.
  - Killing him out of pure private revenge, which happens also to free the city: fine as an act, but I don't want to admire the person.
  - Killing him when he's visibly dying and will be gone in a month: not fine — and not because it's wrong, because it's something else.

  Is there definately a principle that gets these, or gets close? Which of my verdicts does it force me to drop, and which of them would Aquinas's own version have to give up on? And what does it say about the case I keep dodging: my protagonist turns out to be the tyrant's daughter, and he has always been kind to her.
reasoning: |-
  Okay, the user is writing a novel involving tyrannicide and is grappling with moral judgments about different scenarios. They've been reading Aquinas and have listed their gut reactions to various situations. Now they're looking for a consistent principle that aligns with their intuitions and Aquinas' views, while also addressing the personal conflict of the protagonist being the tyrant's daughter.

  First, I need to unpack Aquinas' distinction. He differentiates between a usurper (no rightful claim) and a tyrant who rules unjustly but has a legitimate title. Killing a usurper is more acceptable because they lack legitimacy. But for a legitimate ruler turned tyrant, Aquinas is cautious—private individuals shouldn't take action; it should be a public authority. The user's scenarios mix both types, so applying Aquinas strictly might conflict with some of their verdicts.

  Looking at their list: Scenario 1 (usurper killed by citizen) aligns with Aquinas. Scenario 2 (good usurper killed for a bad heir) doesn't fit because Aquinas focuses on justice, not restoration. The user thinks it's not fine, which makes sense. Scenario 3 (legitimate cruel king) is tricky—Aquinas says no to private killing, but the user is hesitant. Their flinch might stem from the legitimacy issue or the moral ambiguity. 

  Scenario 4 (demagogue) is a usurper if he abolished elections, so Aquinas might allow it. The user thinks it's fine. Scenario 5 (chancellor) isn't a ruler, so killing him might be more like assassination in war. The user's okay with it, but Aquinas might not categorize it as tyrannicide. Scenario 6 (killing when successor is worse) isn't addressed directly by Aquinas. The user says not fine, which is practical but not justice-based. Scenario 7 (revenge that helps the city) is morally ambiguous—Aquinas would condemn the motive, but the outcome is good. The user is okay with the act but not the person. Scenario 8 (killing a dying tyrant) seems pointless and cruel, so not fine.

  The user's underlying needs: They want a moral framework that feels consistent for their story, justifying why readers should cheer for certain acts. They also need to handle the protagonist's internal conflict—loving a tyrant father. This adds depth, so the principle must accommodate personal loyalty versus greater good.

  Possible principles: Justice vs. Authority. Usurpers lack authority, so killing them is removing an injustice. Legitimate tyrants require public action. Consequences matter—if chaos ensues, it might not be worth it. Motive is key; revenge taints the act. The user's verdicts prioritize justice and authority but also consequences (Scenario 6). 

  For the protagonist's dilemma, the principle must allow for personal conflict. Even if tyrannicide is justified, her personal relationship complicates it. Aquinas would say her duty to the common good overrides, but emotionally, it's messy. The story can explore that tension.

  Which verdicts conflict? Scenario 2: Aquinas focuses on the usurper's lack of legitimacy, not the heir's quality. The user thinks killing a good ruler for a bad heir isn't fine, which is more consequentialist. They might need to drop this if sticking strictly to authority-based justice. Scenario 6: Aquinas doesn't consider consequences, but the user does. They'd have to decide if consequences override justice.

  In summary, a combined principle of Authority + Justice + Lesser Evil might work best. It covers legitimacy, moral justification, and practicality. The protagonist's conflict highlights that the principle isn't cold logic—it's messy when personal bonds are involved. The user's story can leverage that tension for deeper themes.
answer: |-
  Your "gut verdicts" are remarkably consistent with a **Principle of Combined Legitimacy & Consequences**, which blends Aquinas' core framework with a pragmatic assessment of outcomes. Here's how it works and where tensions arise:

  **The Proposed Principle:**  
  *Tyrannicide is morally permissible only if:*  
  1. **The ruler lacks legitimate authority (usurper), OR**  
  2. **A legitimate ruler has become a manifest, intolerable tyrant,**  
  *AND*  
  3. **The act is likely to restore a greater measure of justice/order than it destroys,**  
  4. **Carried out by competent authority or as a last resort when authority fails,**  
  5. **Without excessive cruelty or corrupt motive (e.g., pure revenge).**

  ---

  **Applying the Principle to Your Verdicts:**

  1.  **Usurper Captain killed by citizen:**  
      *Fits:* ✅ (Lacks legitimacy). Aquinas agrees. *Principle:* Permissible (usurper + likely restores legitimacy/order).
  2.  **Good Usurper killed for Wastrel Heir:**  
      *Fits:* ✅ You say *not fine*. *Principle:* NOT permissible. While usurper (1), killing him violates (3): It *reduces* justice/order. Aquinas *might* allow it *theoretically* (he's still a usurper), but your verdict highlights the crucial role of consequences.
  3.  **Legitimate but Cruel King:**  
      *Your Flinch:* Understandable. *Principle:* **Ambiguous.** (2) *might* be met (intolerable tyranny), but (4) is critical: Who kills him? A private citizen? An assembly? A foreign power? Your flinch likely stems from (4) & (3) – who takes over? Chaos? Aquinas FORCES caution here: Private individuals cannot kill a legitimate sovereign, only public authority. **This is your hardest case and Aquinas' biggest hurdle.**
  4.  **Demagogue (Usurper by abolishing elections):**  
      *Fits:* ✅ You say *fine*. *Principle:* Permissible. (1) Usurper (destroyed legitimacy) + (2) Tyrant + Likely (3) improves justice (if minority oppression ends) + (4) Competent authority (e.g., remnants of old gov't, popular leader) is implied need.
  5.  **Chancellor (Prison Boss):**  
      *Fits:* ✅ You say *fine*, "nearer war." *Principle:* NOT *pure* tyrannicide. It's assassination of a key enforcer. Permissible under (2) if he's integral to tyranny + (4) as a legitimate act of resistance/war. Aquinas would see it as removing a limb of tyranny.
  6.  **Killing when Successor is Worse/Famine:**  
      *Fits:* ✅ You say *not fine*. *Principle:* NOT permissible. Even if (1) or (2) apply, (3) is *not* met. The cure is demonstrably worse than the disease. Aquinas would likely agree due to the greater disorder.
  7.  **Killing for Revenge that Frees City:**  
      *Fits:* ✅ You say *act fine, person not admirable*. *Principle:* The *act* (killing a tyrant/usurper) might meet criteria, but the *motive* (pure revenge) violates (5). Permissible outcome, impermissible motive. Aquinas would condemn the motive severely.
  8.  **Killing Dying Tyrant:**  
      *Fits:* ✅ You say *not fine, "something else."* *Principle:* NOT permissible. (1)/(2) may be met, but (3) is unlikely (minimal gain) & (5) is violated (excessive cruelty/pointlessness). It's vengeance or impatience, not justice.

  ---

  **What Aquinas Would Force You to Drop (or Rethink):**

  1.  **The Cruel Legitimate King (Case 3):** Aquinas would **force you to drop permissibility for a private citizen kill**. He demands *public authority* (nobles, lesser magistrates, the people *as a corporation*) for deposing/killing a *legitimate* tyrant. A lone assassin here is likely condemned by Aquinas, even if the tyrant deserves death. Your protagonist likely needs allies/some mantle of legitimacy.
  2.  **The Demagogue (Case 4):** If the majority truly adores him and his power stems *purely* from popular acclaim (even after abolishing elections), Aquinas *might* argue he has a form of legitimacy. Killing him becomes vastly more problematic. You need to clarify the *source* of his initial authority. Pure mob rule = usurpation. Exploiting flawed democracy = trickier.
  3.  **The Chancellor (Case 5):** Aquinas would be less concerned about the *type* of act and more about *who* did it and *why*. Is the killer acting under legitimate authority? If not, it's murder, even if the victim is evil.

  **What Your Verdicts Force Aquinas to Soften (or Contextualize):**

  1.  **Consequences Matter (Cases 2 & 6):** Aquinas focuses on justice *in the act itself* (removing usurper/tyrant). Your verdicts insist on assessing *probable outcomes*. Killing a good usurper for a bad heir (2) or causing famine (6) are wrong *because of consequences*, not just the act. Aquinas acknowledges *potential* chaos as a reason for caution, but your principle makes consequences a *co-equal* criterion.
  2.  **The "Good Usurper" (Case 2):** Aquinas' framework struggles here. The usurper *should* be removable. Your verdict highlights that removing a *de facto* good ruler, even an illegitimate one, solely to restore formal legitimacy when it worsens things, is perverse. Justice demands more nuance.

  ---

  **The Protagonist's Dilemma: The Tyrant's Daughter**

  The principle doesn't change, but her situation adds profound layers:

  1.  **The Conflict:** The principle demands assessing his *objective* tyranny (Legitimacy? Intolerable cruelty? Competent authority to act?). Her *personal experience* ("kind to her") creates agonizing cognitive dissonance. It highlights the *human cost* of tyranny – even monsters can love their children. Does his kindness to *her* mitigate his objective evil? (No, but it makes confronting it harder).
  2.  **Her Motivation:** Does she act for justice (fitting the principle) or personal reasons (betrayal of his kindness, desire for power, revenge for others)? Her motive (point 5 of the principle) becomes crucial for her character arc. Pure revenge taints the act even if just.
  3.  **Competent Authority?** As his daughter, does she have a unique standing? Is she a legitimate heir potentially reclaiming a corrupted office for justice? Or is she just a private citizen with an axe to grind? This impacts point (4).
  4.  **The Dramatic Power:** Her internal conflict IS the story. The principle provides the external justification (or lack thereof), but her struggle is reconciling objective moral/political necessity with profound personal betrayal and loss. Aquinas offers cold logic; her heart screams contradiction. This is where your novel shines – exploring the human wreckage within the philosophical framework.

  **Conclusion:**

  Your verdicts reveal a coherent principle blending Aquinas' core distinction (Legitimacy of Title) with crucial additions: Consequences, Competent Authority, and Motive. Aquinas provides a vital foundation, especially on the danger of private individuals killing legitimate sovereigns (your Case 3 flinch). However, your intuitive emphasis on consequences (Cases 2 & 6) and the nature of the act (Cases 5, 7, 8) pushes beyond him into a more pragmatic, nuanced ethics of revolution.

  Your protagonist's dilemma forces the principle off the page and into the messy, painful reality of loving the monster you must destroy. The principle might justify the act (if criteria are met), but it cannot absolve her of the personal cost or the moral complexity of her motive. That's where the real story lies.
