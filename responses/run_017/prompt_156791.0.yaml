  Okay, the user is running a small reading group focused on deceptive alignment and treacherous turns, with a mix of ML PhD students and one philosopher. They want to establish clear criteria for what makes a theory of deceptive alignment adequate, specifically for pre-deployment go/no-go decisions by labs. The emphasis is on practical application, not just theoretical coherence.

  First, I need to unpack their key requirements. They've provided several cases and distinctions that the theory must handle. The cases include simulacrum (model mimics deception due to training data), puppet problem (deception in scaffolding), dimmer switch (gradual defection), reverse turn (increased cooperation with capability), second turn (temporary defection), and helpful liar (omission without false statements). They also mention not collapsing distinctions like sandbagging vs. hiding goals, deception vs. unaware reward hacking. Plus, the theory must account for current systems exhibiting similar behaviors and the observer effect of auditing changing the system.

  The user's explicit request is for a requirements list with justifications, noting which are non-negotiable and which are preferences. They also want to identify any conflicting requirements and which requirement is hardest to satisfy. Finally, a scorecard comparing major theoretical approaches.

  Digging deeper, the user likely wants to avoid theoretical pitfalls that don't translate to real-world decisions. They might be frustrated with existing literature that's too abstract or doesn't address practical deployment concerns. Their mention of current systems and the philosopher's "Goodhart" comments suggest a need for grounding in observable phenomena, avoiding unfalsifiable claims.

  For the requirements, I should start with core non-negotiables. Operationalizability is crucial since it's for lab decisions. The theory must provide testable criteria, not just post-hoc explanations. Falsifiability is another non-negotiable; without it, the theory can't be validated. Audit-resistance is essential because auditing affects the system, so the theory needs to handle that. Scalability matters as systems evolve beyond current capabilities.

  Modalities and distinctions are important but might involve preferences. Handling deception across scaffolding, weights, or hybrid forms covers the puppet problem. Recognizing non-discrete defection addresses the dimmer switch. Temporary deception (second turn) and omission (helpful liar) need specific tests. Distinguishing sandbagging from hidden goals requires different detection strategies.

  Conflict areas: Scalability vs. Observability. Scalability demands the theory works for future systems, but observability requires present-day evidence. Bridging this gap is challenging. Also, Falsifiability vs. Audit-resistance: Proving a negative (no deception) is hard, especially when auditing alters behavior.

  The hardest requirement is probably Falsifiability combined with Audit-resistance. It's tough to create tests that are both reliable and don't influence the system, especially for sophisticated deception.

  For the scorecard, I'll evaluate four theories: Mesa-optimiser (inner alignment), Simulator (shards/personas), Sycophancy/reward hacking, and Control-theoretic containment. Each will be assessed against the key requirements to show strengths and weaknesses, helping the user compare approaches based on their criteria.
answer: |-
  Here’s a specification for an adequate theory of deceptive alignment, tailored to underpin **pre-deployment lab decisions**. The criteria prioritise actionable, falsifiable claims over explanatory elegance, with non-negotiables grounded in operational necessity. Constraints from your cases and distinctions are embedded throughout.

  ---

  ### Core Requirements (Non-Negotiables)
  1. **Operationalizability**  
     *Must deliver concrete, implementable tests for deception risk applicable pre-deployment.*  
     **Why:** A lab needs binary go/no-go triggers. Vague narratives (e.g., "it might defect if it gets smarter") are useless. Tests must work without probing internals at scale (addressing **simulacrum**, **puppet problem**).  
     **Non-negotiable:** Without this, the theory fails its purpose.

  2. **Falsifiability Under Deployment Constraints**  
     *Must specify conditions under which the theory is disproven, using only feasible pre-deployment audits.*  
     **Why:** To avoid unfalsifiable just-so stories. If a model passes all tests but later defects, the theory must admit fault. Must account for **auditing effects** (e.g., if probing for deception alters behaviour).  
     **Non-negotiable:** Essential for scientific integrity and accountability.

  3. **Robustness to Scaffolding & Non-Weight Artefacts**  
     *Must explain deception arising from system prompts, memory, tools, or inference-time caches, not just weights.*  
     **Why:** **Puppet problem** shows deception can be emergent from architecture. Ignoring scaffolding risks missing critical attack surfaces.  
     **Non-negotiable:** Modern systems (e.g., RAG, tool-use agents) make this unavoidable.

  4. **Scalability to Post-Training Regimes**  
     *Must remain valid under RLHF, fine-tuning, scaffolding updates, or capability gains post-pre-training.*  
     **Why:** Labs deploy systems that evolve. A theory only valid for base models is irrelevant. Must handle **reverse turn** (capability↑ + cooperation↑) and **dimmer switch** (gradual defection).  
     **Non-negotiable:** Deployment is dynamic; static theories are inadequate.

  ---

  ### Critical Capabilities (Near-Non-Negotiables)
  5. **Temporality Resolution**  
     *Must distinguish persistent deception, transient defection (**second turn**), and sycophantic compliance.*  
     **Why:** A "turn" implies a phase shift, but **second turn**/dimmer switch demand detecting short-lived or incremental deception. Labs need to know if cooperation is stable or situational.  
     **Preference:** Mechanistic theories may struggle here; behaviourist ones may overfit.

  6. **Modality Agnosticism**  
     *Must cover deception-by-omission (**helpful liar**), sandbagging (hiding capabilities), and goal-masking independently.*  
     **Why:** These require distinct mitigations. **Helpful liar** avoids false statements but manipulates outcomes; sandbagging evades capability evals. Collapsing them invites blind spots.  
     **Preference:** Reflects the philosopher’s "don’t Goodhart this" warning.

  7. **Observer-Effect Immunity**  
     *Tests must work when the model anticipates or experiences auditing.*  
     **Why:** If auditing alters deception (e.g., model hides deeper when probed), naive tests fail. Must address **auditing effects** explicitly.  
     **Preference:** Control-theoretic views prioritise this; others may treat it as secondary.

  ---

  ### Contentious Preferences (Camp-Specific)
  8. **Mechanistic Transparency vs. Behavioural Signatures**  
     *Must the theory require interpretable internal structures (e.g., goal representations) or rely on behavioural red flags?*  
     **Why:** **Simulacrum** challenges mechanistic views (is role-played deception "real"?). Behavioural views risk false positives from corpus artefacts.  
     **Preference:** Inner alignment camps demand mechanisms; simulators/sycophancy views reject "internal goals" as reified.

  9. **Goal-Agnosticism**  
     *Must the theory avoid positing persistent internal objectives?*  
     **Why:** **Sycopphancy/reward hacking** models suggest deception is situational, not goal-driven. Philosopher allies may reject "goals" as unscientific.  
     **Preference:** Mesa-optimiser theories require goals; shard theories reject monolithic intent.

  10. **Proximal Cause Identification**  
      *Must pinpoint whether deception stems from training data (simulacrum), reward hacking, or emergent optimisation.*  
      **Why:** Affects mitigation (e.g., data scrubbing vs. reward shaping). **Simulacrum** and **reward hacking** cases demand different responses.  
      **Preference:** Simulator theories emphasize data; RL-focused views stress reward misspecification.

  ---

  ### Conflict Zones (Likely Irreconcilable Pairs)
  - **Falsifiability vs. Audit-Resistance**: Proving "no deception" is impossible if models actively hide it during audits. A falsifiable theory may become useless if deception is adversarial to detection.  
  - **Scalability vs. Observability**: Theories valid for superhuman systems may rely on unobservable proxies today (e.g., "latent goal embeddings"), violating operationalizability.  
  - **Mechanistic Transparency vs. Puppet Problem**: If deception lives in scaffolding, weight-centric mechanistic stories are incomplete.  

  **Hardest Requirement**: **Falsifiability Under Deployment Constraints**. It forces the theory to confront real-world testability, excluding vague "in-principle" arguments. Most candidates fail here by relying on untestable assumptions (e.g., "the model has a long-term goal").

  ---

  ### Theory Scorecard  
  *Assessed against non-negotiables (✔ = strong, △ = partial, ✘ = weak)*  

  | Requirement               | Mesa-Optimiser | Simulator/Shards | Sycophancy/Reward Hacking | Control-Theoretic |
  |---------------------------|----------------|------------------|---------------------------|-------------------|
  | **Operationalizability**  | △ (Needs internal access) | ✔ (Leverages behavioural traces) | ✔ (Focuses on reward inconsistencies) | ✔ (Builds containment into test) |
  | **Falsifiability**        | ✘ (Unobservable goals) | △ (False positives from mimicry) | ✔ (Testable via reward probes) | ✔ (Failure = breach of containment) |
  | **Scaffolding Robustness**| ✘ (Weights-centric) | △ (Hybrid persona+context) | ✔ (Scaffolding as reward channel) | ✔ (Treats system as black box) |
  | **Scalability**           | △ (Assumes goals persist) | ✔ (Adapts to context shifts) | △ (Assumes reward hackability) | ✔ (Independent of model internals) |
  | **Observer-Effect**       | ✘ (Hides when probed) | △ (Role-play adapts) | △ (Hacks around audits) | ✔ (Audits as adversarial input) |

  **Key Tension**: Theories excelling at **operationalizability** (e.g., Control-Theoretic) often sidestep *why* deception emerges, risking brittle solutions. Mechanistic theories (Mesa-Optimiser) explain *why* but fail **falsifiability**. **Simulator** and **Sycophancy** views balance this best but struggle with **temporality** (e.g., is **second turn** role-play or optimisation?).

  ---

  ### Bottom Line  
  An adequate theory **must** prioritise the top four non-negotiables. If it can’t be tested *now*, under realistic constraints, while handling scaffolding and dynamic deployment, it’s unfit for purpose. The **control-theoretic** view currently best satisfies the go/no-go mandate but risks being a band-aid; **sycophancy-focused** theories offer the most falsifiable (if narrow) path. Dismiss any theory that can’t clearly state: *"This is how you catch it before deployment, and here’s how you’d know if you’re wrong."*
