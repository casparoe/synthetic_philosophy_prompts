  We are planning a 50-minute discussion section for a second-year metaphysics course. The goal is to teach a procedure for analyzing disputes, separating metalinguistic and non-metalinguistic elements, and recognizing that a residue may be a non-arbitrary theoretical disagreement.

  Key components of the procedure:
  1. Separate the metalinguistic question (about language, concepts, or precisification) from the question asked within a language.
  2. After settling the metalinguistic issue (by disambiguation or stipulation), see what residue remains.
  3. Classify the residue: it might be a factual disagreement, but it might also be a disagreement about which articulation of the same facts better supports further inquiry (a "theoretical-role dispute").

  The students have recently studied the composite objects debate, with some thinking it's merely verbal and others thinking there must be a brute fact. We are not adjudicating the first-order issue.

  Now, the four required elements:

  **First: Order of Components**

  The procedure must be introduced in a specific order to avoid confusion. The steps:

  1. **Clarify the Dispute**: Present a dispute and have students articulate what the parties are disagreeing about. (This is necessary to have a concrete case to work with.)

  2. **Introduce the Metalinguistic/Non-Metalinguistic Distinction**: Explain that we can ask two kinds of questions:
     - **Metalinguistic**: What language (or concept, or precisification) are we using? What does a term mean?
     - **Non-Metalinguistic**: Given a language, what is the case? (Factual questions.)

     *Why this order?* Without a concrete dispute, the distinction is abstract and hard to grasp. Also, the phrase "merely verbal" cannot be applied until we have a dispute and have attempted to disambiguate.

  3. **Disambiguate the Terms**: In the example dispute, identify the key terms that might be ambiguous and consider disambiguating them (by stipulating definitions). This step is crucial to show that sometimes disambiguation resolves the dispute (merely verbal) and sometimes it doesn.

     *Why here?* If we jump to disambiguation too early, without the distinction, students might think that disambiguation is always the end of the story. If we do it after introducing the residue, it might seem arbitrary. We must show that disambiguation is a tool to isolate non-metalinguistic residue.

  4. **Examine the Residue**: After disambiguation, check if the disagreement persists. If it does, then the dispute is not merely verbal. Then, we must classify the residue. This step is where we introduce that the residue might be a theoretical-role dispute.

     *Why now?* The residue is only visible after disambiguation. Also, the distinction between factual and theoretical-role disputes must come after we have a residue because without a residue we don't have anything to classify. Moreover, if we introduce the theoretical-role option too early, it might be confused with the metalinguistic issue.

  5. **Classify the Residue**: Now we consider the possibilities for the residue:
     - Factual disagreement (about the world)
     - A disagreement about which language/concept to use (metalinguistic negotiation)
     - **Theoretical-role dispute**: Both parties agree on the language and the facts, but disagree about which way of framing the facts is more theoretically fruitful.

     *Why last?* This step requires that we have already done disambiguation and found a residue. Without that, the category of theoretical-role dispute would be unintelligible because it is defined as a non-metalinguistic, non-factual disagreement that arises even when language and facts are fixed.

  *Why is this the only workable order?* 
  - We must start with a dispute to have an object of analysis.
  - The metalinguistic/non-metalinguistic distinction must be drawn early so that disambiguation makes sense as a way to settle the metalinguistic part.
  - Disambiguation must come before residue analysis because without it we don't know if the dispute is merely verbal.
  - The residue classification must come last because it builds on the previous steps. If we try to classify without disambiguation, we might conflate metalinguistic and non-metalinguistic elements.

  Also, the distinction between a disagreement about the world (factual) and a disagreement about which question to ask (theoretical) must be drawn at the residue stage, after disambiguation. Otherwise, if drawn earlier, it might collapse into the metalinguistic vs. non-metalinguistic distinction. The theoretical disagreement is a non-metalinguistic disagreement about how to frame the facts (which is a second-order theoretical issue, not about the world directly).

  **Second: The One Example**

  We need one example that meets the criteria:
  - Not resolved by supplying a definition.
  - Both parties are informed and charitable.
  - Something recognizable is at stake.
  - Avoids the composite-objects dispute (because they are too close to it and might not be able to abstract) and vague predicates (like 'tall' or 'heap').

  **Example: The Dispute over whether Pluto is a planet.**

  *Why this example?*
  - It is familiar and non-technical.
  - Both parties (astronomers) are informed and charitable.
  - The dispute was not resolved by definition alone. In 2006, the International Astronomical Union (IAU) provided a definition of 'planet', which excluded Pluto. But the disagreement continued: some astronomers rejected the definition, arguing that it was arbitrary or that it didn't capture the important features.
  - What is at stake: How we classify objects in the solar system affects how we model its formation and evolution, how we teach, and how we allocate resources for exploration. The disagreement is about which classification better serves scientific inquiry.

  *What must the example have?*
  - **Ambiguity that can be disambiguated**: The term 'planet' can be defined in multiple ways (e.g., including or excluding clearing the neighborhood, or including other criteria).
  - **Residue after disambiguation**: Even after a definition is given, there can be a disagreement about whether that definition is the best one for theoretical purposes.
  - **Theoretical stakes**: The parties agree on the facts about Pluto (size, orbit, etc.) and on the language (if we fix a definition), but they disagree on whether the category of planet should include Pluto for the purposes of scientific taxonomy.

  *What must it lack?*
  - It must not be a vague predicate case (like 'heap') because vagueness introduces borderline cases and might lead to a different kind of discussion (e.g., sorites paradoxes) that we want to avoid.
  - It must not be the composite objects case, to avoid the students' recent baggage.

  *Why not the two obvious candidates?*
  - **Composite objects**: Too close to home; students might not be able to abstract the procedure because they are entrenched in the first-order debate. Also, it might trigger their existing frustrations.
  - **Vague predicates (tall/heap)**: These typically lead to discussions about vagueness and the sorites paradox, which are important but distinct from the kind of theoretical-role dispute we want to highlight. Also, in these cases, disambiguation often resolves the dispute (by setting a precise boundary) and there is no residue of the kind we want to focus on.

  **Third: Misconceptions and When to Head Them Off**

  Misconceptions (in the order they are likely to arise) and when to address them:

  1. **That a merely verbal dispute is trivial and a waste of time**.
     - *When to head off*: When introducing the term "merely verbal". Clarify that a merely verbal dispute is one that can be resolved by disambiguation, and that this is a valuable insight because it saves time and effort. But note that not all disputes are merely verbal, and even when they are, realizing it is progress.

  2. **That once the term is disambiguated, there is nothing left to argue about (stipulation settles everything)**.
     - *When to head off*: During the disambiguation step in the example. After disambiguating, show that in the Pluto case, the dispute continues. Emphasize that disambiguation only settles the metalinguistic part, but there might be a residual disagreement about which disambiguation to choose and why.

  3. **That the only two possibilities are factual disagreement and quibbling about words**.
     - *When to head off*: When classifying the residue. After disambiguation, when we see that the Pluto dispute persists, we introduce the third option: theoretical-role dispute. Explicitly state that these are not quibbles about words (because the words have been fixed) and not factual (because they agree on the facts) but about the theoretical role of the concept.

  4. **That if some ontological questions turn on a choice of language, then there is no fact of the matter about anything**.
     - *When to head off*: At the very end, when summarizing. Emphasize that recognizing metalinguistic elements in some disputes does not entail global anti-realism. We can have factual disagreements about many things (e.g., the orbit of Pluto) even while having non-factual disagreements about how to classify it.

  Additionally, we want them to discover the wrinkle: **disambiguation is not a decision procedure because the verdict depends on whose term is held fixed**. 

  - *When to introduce*: During the disambiguation step in the example. When we disambiguate, we can do it in two ways: fix the term according to party A or party B. In the Pluto case, if we fix the definition to include clearing the neighborhood, Pluto is not a planet. If we fix an alternative definition (e.g., based on being spherical and orbiting the sun), Pluto is a planet. But then the dispute becomes: which definition should we adopt? This leads naturally to the residue (theoretical role). 

  - *How to land it*: Present it as a step in the procedure: after disambiguating in one way, we see that one party might still object to the disambiguation. Then we do it the other way. Then we realize that the dispute is not about the facts but about the choice of framework. This should be a discovery about the method: that disambiguation reveals the underlying disagreement rather than settles it arbitrarily.

  **Fourth: Check for Understanding**

  Task: Present a dispute from outside metaphysics. 

  **Example: A dispute in ethics: "Is affirmative action just?"**

  - One party says yes, because it promotes equality; the other says no, because it treats individuals unfairly based on group membership.

  *The task for students*: Apply the procedure to this dispute. In particular, they must:
  1. Identify if there is a metalinguistic component (e.g., what does 'just' mean?).
  2. Disambiguate: Suppose we define 'just' as "promoting equality of outcome" vs. "treating individuals without regard to group membership". 
  3. After disambiguation, see if there is a residue. (There is: they might agree on the facts about what affirmative action does, but disagree on which conception of justice is better for society.)
  4. Classify the residue: This is a theoretical-role dispute about which conception of justice better serves the goals of society.

  *Failing answers*:
  - A student who merely says "it's merely verbal" will stop at step 2: they will say that once we define 'justice', the dispute is resolved. For example, if we define justice as equality, then affirmative action is just; if we define it as individual treatment, then it is not. And that's the end. They fail to see that there is a residue about which definition to adopt and why.

  - A student who has the procedure will recognize that after disambiguation, there is a residual disagreement about which concept of justice we should use and why (e.g., which better promotes social welfare, which is more coherent with other values, etc.). They will classify this as a non-arbitrary theoretical disagreement.

  **Finally: What to Refuse**

  Openly refuse to go into:

  1. **Metasemantic theory**: The deep theory about what determines meaning (e.g., causal theories, descriptivism). *Marking the boundary*: Say, "We are using a simple, practical notion of disambiguation by stipulation for the purpose of this procedure. The philosophical foundations of meaning are beyond our scope today."

  2. **Model-theoretic apparatus**: Formal semantics, model theory, etc. *Marking the boundary*: "We are staying at the level of natural language and concepts. We won't be formalizing these disputes in logical terms today."

  3. **Epistemology of disagreement**: How to respond rationally to disagreements (e.g., conciliationism vs. steadfastness). *Marking the boundary*: "We are analyzing the structure of disputes, not how we should change our beliefs in light of them."

  Additionally, we might refuse:

  - **First-order ontology**: "We are not here to settle whether composite objects exist, but to build a tool for analyzing such disputes."

  Mark these boundaries by saying: "These are important topics, but for the limited purpose of this session, we are bracketing them. Our goal is to build a procedural tool, and we will stay focused on that."

  **Plan for the 50-Minute Section**

  1. **Introduction (5 mins)**: 
     - Recap the composite objects debate and the two reactions in the class.
     - State the goal: to develop a procedure for analyzing any dispute, especially ontological ones, without getting stuck in the first-order.

  2. **Present the Example and Clarify the Dispute (10 mins)**:
     - Present the Pluto/planet dispute.
     - Have students articulate what the two sides are saying and why they disagree.

  3. **Introduce the Distinction and Disambiguate (15 mins)**:
     - Explain metalinguistic vs. non-metalinguistic questions.
     - In the Pluto case, identify the key term: 'planet'. 
     - Disambiguate: Present two definitions (IAU vs. alternative). Show that under one, Pluto isn't a planet; under the other, it is.
     - Ask: Does this resolve the dispute? (No, because astronomers then argue about which definition to use.)

  4. **Examine the Residue and Classify (15 mins)**:
     - After disambiguation, what do they disagree about? They agree on the facts about Pluto and on the definitions, but they disagree on which definition is better.
     - Introduce the theoretical-role dispute: They are disagreeing about which way of categorizing the solar system better serves scientific inquiry (e.g., for modeling, education, exploration).
     - Contrast with the two misconceptions: It's not about words (we fixed them) and not about the facts of Pluto (they agree). It's about the theoretical framework.

  5. **Check for Understanding (5 mins)**:
     - Present the affirmative action dispute.
     - Ask students to apply the procedure in pairs (2 mins) and then call on one or two to report.
     - Look for the failing pattern vs. the passing pattern.

  6. **Conclusion and Boundaries (5 mins)**:
     - Summarize the procedure: clarify, disambiguate, examine residue, classify.
     - State the refused topics (as above) and mark them as boundaries.

  This plan leaves 5 minutes for transitions and flexibility. The example of Pluto should carry the whole hour, with the ethics example as a quick check.
answer: |-
  ### Plan for the Fifty-Minute Discussion Section

  #### **First: Order of Components and Why It Is the Only Workable Order**
  The procedure must unfold in this sequence to build understanding incrementally and avoid conceptual collapse. Deviating will confuse students or reinforce misconceptions.

  1. **Clarify the Dispute (10 minutes)**  
     Start by articulating a specific disagreement (using the chosen example, e.g., whether Pluto is a planet). Have students state what each party claims and why they disagree.  
     *Why first?* Without a concrete dispute, the subsequent distinctions are abstract and ungrounded. This step provides the raw material for analysis.

  2. **Introduce the Metalinguistic/Non-Metalinguistic Distinction (10 minutes)**  
     Define:  
     - *Metalinguistic question*: Which language, concept, or precisification are we using? (e.g., "What do we mean by 'planet'?")  
     - *Non-metalinguistic question*: What is the case, given a fixed language? (e.g., "Given this definition of 'planet', is Pluto one?")  
     *Why now?* This distinction must precede disambiguation. If introduced earlier (e.g., during dispute clarification), students conflate it with the first-order disagreement. If delayed, disambiguation seems arbitrary. Crucially, "merely verbal" cannot be applied until this distinction is in place—it relies on isolating metalinguistic elements.

  3. **Disambiguate and Test for Mere Verbality (10 minutes)**  
     Stipulate definitions for key terms in the example (e.g., define "planet" in two ways). Check if disagreement persists under each definition.  
     *Why here?* Disambiguation must follow the metalinguistic distinction to show how it resolves *some* disputes (if it does). If done earlier, students mistake it for a first-order solution. If skipped, the residue analysis is unintelligible. This step reveals whether the dispute is "merely verbal" (i.e., resolved by disambiguation).

  4. **Examine the Residue and Introduce Theoretical-Role Disputes (15 minutes)**  
     If disagreement persists post-disambiguation, identify the residue. Then classify it:  
     - Factual (about the world),  
     - Theoretical-role (about which articulation better supports inquiry).  
     *Why last?* The residue only appears after disambiguation. Introducing theoretical-role disputes here prevents collapse into the metalinguistic/factual binary. If this comes earlier, students conflate it with metalinguistic negotiation (e.g., "choosing a word"). The distinction between "disagreement about the world" and "disagreement about which question to ask" must be drawn here to show that theoretical-role disputes are non-metalinguistic and non-arbitrary.

  *Why this order is non-negotiable*:  
  - Steps 1–2 provide the framework for disambiguation (step 3), without which "merely verbal" is misapplied as "trivial."  
  - Step 3 must precede step 4; otherwise, residue analysis lacks a clear starting point.  
  - Step 4 depends on steps 2–3 to avoid conflating theoretical-role disputes with metalinguistic ones (e.g., if discussed earlier, students think theoretical choices are just "picking words").

  #### **Second: The One Example**
  **Use the dispute: "Is Pluto a planet?"**  

  *Why this example?*  
  - **Must-haves**:  
    - Disagreement persists post-disambiguation: Defining "planet" (e.g., IAU's "cleared its orbit" vs. geophysical "is round and orbits the Sun") doesn’t end the debate; informed, charitable parties (e.g., astronomers) still disagree on which definition *should* be used.  
    - Recognizable stakes: Classification affects research funding, textbook design, and theories of solar system formation—e.g., a "planet" category that excludes Pluto may better predict orbital patterns or prioritize exploration targets.  
    - Theoretical-role residue: Both sides agree on Pluto’s facts (size, orbit) and the language (definitions), but dispute which framing (e.g., dynamical vs. morphological) better supports predictive modeling or educational goals.  
  - **Must-lack**:  
    - No reliance on vagueness: Unlike "heap" or "tall," the dispute isn’t about borderline cases but competing theoretical virtues (e.g., simplicity vs. explanatory power).  
    - No trivial resolution: Definitions don’t settle it; arguments center on trade-offs (e.g., "If we define planets dynamically, we lose insights from geology").  

  *Why avoid the obvious candidates?*  
  - **Composite objects**: Students are entrenched in first-order positions; using it would trigger defensiveness or rehash the seminar debate, derailing the procedural focus.  
  - **Vague predicates (e.g., "heap")**: These often reduce to semantic indecision (e.g., where to set a cutoff), implying the residue *is* arbitrary stipulation. This undermines the key point that residues can be non-arbitrary theoretical choices.  

  *Execution in class*:  
  - Present the Pluto dispute neutrally: "Some astronomers say Pluto isn’t a planet; others insist it is."  
  - Guide students through disambiguation (e.g., "Let’s define 'planet' as X—does this end the fight? No, because...").  
  - Highlight stakes: "Why do they care? Because how we define ‘planet’ shapes what we study next."

  #### **Third: Misconceptions, Order, and Preemptive Intervention**
  Students will form misconceptions in this sequence; head each off at the specified point to prevent entrenchment.

  1. **Misconception: "Merely verbal = trivial waste of time."**  
     *When it arises*: During disambiguation (step 3), after labeling a dispute "merely verbal."  
     *Intervention point*: Immediately after disambiguation in step 3.  
     *How to head off*: Say, "A dispute being 'merely verbal' isn’t trivial—it means we’ve *made progress* by spotting a metalinguistic confusion. But settling this doesn’t imply the original debate was pointless; it redirects inquiry."

  2. **Misconception: "Disambiguation ends all disagreement (stipulation settles everything)."**  
     *When it arises*: During disambiguation (step 3), when stipulating definitions.  
     *Intervention point*: When testing if disagreement persists post-disambiguation.  
     *How to head off*: Use the Pluto example to show residual disagreement. Ask: "We’ve defined 'planet'—why are they still arguing? Because they agree on the definition but not on whether it’s the *right tool* for astronomy."

  3. **Misconception: "Only two options: factual disagreement or quibbling about words."**  
     *When it arises*: During residue analysis (step 4), after seeing disagreement persist.  
     *Intervention point*: When introducing theoretical-role disputes.  
     *How to head off*: Contrast: "This isn’t about facts (they agree on Pluto’s orbit) or words (they agree on definitions). It’s about which framework—e.g., dynamical vs. geological—better *organizes* facts for new discoveries."

  4. **Misconception: "If language choice affects ontology, nothing is factual."**  
     *When it arises*: During step 4 (residue classification), when generalizing.  
     *Intervention point*: After introducing theoretical-role disputes.  
     *How to head off*: Emphasize: "Some disputes turn on language, but not all. We still have factual disagreements (e.g., Pluto’s size), and theoretical choices aren’t arbitrary—they aim at better inquiry."

  **The Wrinkle: Disambiguation is not a decision procedure (verdict depends on whose term is fixed).**  
  - *When it arises*: Naturally during disambiguation (step 3), when students see that fixing one definition resolves the dispute one way, but fixing another reverses it.  
  - *Intervention point*: After disambiguating in one way, pause and disambiguate the other way. Ask: "Does this 'solve' it? Or just shift the disagreement?"  
  - *Land it as a discovery*: Frame it as: "This shows disambiguation is a *diagnostic tool*, not a solution—it reveals where the real disagreement lies (e.g., in theoretical role), rather than proving there’s no fact of the matter."

  #### **Fourth: Check for Understanding**
  **Task: Apply the procedure to the dispute: "Is a virus alive?"**  

  - **Failing answer (student who only learned "merely verbal")**:  
    "It’s merely verbal—biologists just define 'alive' differently. If we define life as cellular reproduction, viruses aren’t alive; if we include metabolism, they are. End of story."  
    *Why it fails*: Stops at disambiguation, missing the residue. Assumes stipulation ends the debate.  

  - **Passing answer (student with the procedure)**:  
    "First, disambiguate 'alive': Definition A (reproduction) vs. B (metabolism). Under A, viruses aren’t alive; under B, they are. But biologists still disagree after this—they agree on the facts about viruses and the definitions, but dispute which definition better supports, say, research on evolution or disease treatment. This residue is a theoretical-role dispute about which framing advances biology."  
    *Why it passes*: Separates metalinguistic disambiguation, identifies residue, and classifies it as theoretical-role.  

  *Why this task works*:  
  - Non-metaphysical (biology), accessible, and has clear stakes (e.g., funding for virology).  
  - Failing answers reveal surface-level application ("just words"); passing answers show grasp of residue analysis.

  #### **Finally: What to Refuse and How to Mark Boundaries**
  Refuse these three topics explicitly to maintain focus:  
  1. **Metasemantic theory** (e.g., what fixes meaning in natural language).  
  2. **Model-theoretic apparatus** (e.g., using formal semantics to represent disputes).  
  3. **Epistemology of disagreement** (e.g., how to respond rationally to peer disagreement).  

  **How to mark the refusal in the room**:  
  - At the start, say: "Today is about building a procedure, not theory. We’ll hit boundaries—topics we *won’t* cover because they’re advanced or tangential."  
  - When a question arises (e.g., "But what determines meaning?"), respond: "That’s a great question for a metasemantics seminar, but here it’s a *boundary*—we’re using stipulation as a tool, not digging into foundations."  
  - Use physical cues: Step to a designated "boundary" spot in the room when naming refused topics. This signals intentional exclusion, not evasion.  

  **Timing Allocation**:  
  - Clarify dispute: 10 min  
  - Metalinguistic distinction: 10 min  
  - Disambiguation and verbality test: 10 min  
  - Residue and theoretical-role: 15 min  
  - Check for understanding: 5 min  
  - Boundaries/conclusion: Built into transitions.  

  This plan ensures students leave with a replicable procedure, not answers to ontological questions. The Pluto example carries the hour, with the "virus" check ensuring transferability.
