prompt: |-
  OK so I just spent something like three hours arguing with my friend Priya at the pub about whether it's actually good to be as morally good as you can possibly be, and I came away realising I've got a pile of gut reactions I can't fit together. Her line was that the whole idea is repellent: a person who maximised moral goodness would be a bore, no fun to be around, no real interests of her own, and the rest of us are right not to want to be that or to marry that. (She kept invoking that famous paper about moral saints everyone trots out, and I kept saying that's a debating move, not an argument.) But once we started going through actual people instead of the abstract idea, I found myself defending some saints and being weirded out by others, and I can't tell you what the rule is.

  My verdicts, more or less as I blurted them out:

  1. Guy donates a kidney to a complete stranger, anonymously. Great. I'd want to be that person, I'd want my kid to grow up to be that person, nothing creepy about it.

  2. Woman gives away half her income for thirty years, lives in a small flat, keeps bees, plays in a ceilidh band. I admire her a lot and she seems *fine* — like someone you'd actually want at dinner.

  3. Woman gives away 90%, sleeps on a mattress, never takes a break, and describes people who don't as "complicit". I admire her from a distance, I don't want to be her and I don't want her at dinner, and — this is the bit Priya jumped on — I think she's somehow less good, not just less fun, than #2. Not worse at producing good outcomes. Worse as a person.

  4. Someone who has engineered her whole life so that being good is easy: no car, no smartphone, no social media, lives in a co-op, has quietly stripped every temptation out of her environment. She probably does more good than #2. I'm unimpressed. Which feels wrong and I can't defend it.

  5. A guy who spent two years of his life on a campaign that would have happened anyway without him — there was a backup, someone else lined up to do it just as well. I still admire him about as much as #1. Real sacrifice, zero outcome.

  6. Same guy, same two years, same sacrifice, same motives, except this time the campaign slightly backfires and makes things a bit worse. I don't admire him at all. Which is nuts, right? Because if I genuinely don't care about outcomes the backfire shouldn't matter, and if I do care about outcomes then #5 shouldn't get full credit for achieving nothing.

  7. A woman who's cared for her mother full time for fifteen years with no real alternative, who couldn't have walked away without catastrophe, who never exactly chose it in any ongoing sense. Everyone calls her a saint. I feel sad about her and I don't really admire her, which makes me feel like a jerk. She's sacrificed more than anyone else on this list.

  8. Someone who does an enormous amount of good for a rotten reason — to impress somebody, or out of guilt, or because he likes being the guy who does that. I don't admire *him*, but I don't think what he did is worth less. Those feel seperate to me and Priya said that was just having it both ways.

  9. Someone who is a saint about animals and basically cold to her own family. I think she's less good, not merely lopsided — like the shape of the whole life matters, not just the sum of it.

  During the argument I invented three things to try to sort this, and I want to know whether any of them do work or whether they're just my prejudices in a costume:

  - the photocopy test: clone the person N times into N relevantly similar situations and ask whether the world improves roughly N times over. The kidney donor passes. The second whistleblower at the same company doesn't. The daughter looking after her own mother doesn't. But #7 is exactly the case where the test says "no marginal value" and my reaction isn't about marginal value at all, so maybe the test is tracking something other than what I thought.

  - the exit-was-open clause: admiration only fires if the person could have walked away, at real cost to themselves and not much cost to anyone else, and didn't. This handles #7 nicely, but it also seems to make #4 *more* admirable rather than less, since she rebuilt her life on purpose.

  - moral ergonomics: the thought that arranging your life so virtue is cheap is itself an achievement and I'm being unfair to #4. I don't believe this but I can't say why not.

  So: is there a principle about what makes a maximally morally good life admirable — or desirable, or just plain good — that gets all nine, or nearly? I'd much rather have something that drops one or two of my reactions than something with a separate clause bolted on per case, so tell me which of them it can't accommodate and which you'd overturn. Constraints: nothing that quietly collapses into "produce the most good", since that's Priya's side and it clearly isn't what I think — outcomes only seem to move my reactions in one direction, and I want to know what that asymmetry is. And please don't give me a reading list or tell me who argued what first; I don't care about the bibliography, I want the shape of the thing.

  One case I keep going back and forth on that isn't above: someone who was pretty selfish and careless for thirty years and then, after a scare, becomes completely devoted and gives away everything for the last five. I definately find myself admiring that more than #2, and I can't tell whether that's a real moral judgement or just a good story. What does your principle say about it, and what else does it predict that I haven't thought to ask about?
reasoning: |-
  Okay, let me try to unpack this user's moral dilemma. They spent hours arguing with Priya about whether being maximally morally good is desirable. Priya thinks it makes someone a bore, and the user has nine specific cases where their gut reactions conflict. The user wants a principle that explains all these reactions without just collapsing into outcome-based ethics.

  First, I need to understand each case. The kidney donor (#1) feels admirable despite anonymity. The bee-keeping donor (#2) seems balanced and likable. The ascetic who gives 90% (#3) is effective but off-putting, and the user feels she's "less good" as a person, not just less fun. The engineered-life person (#4) does more good but leaves the user unimpressed. The ineffective whistleblower (#5) is admired for sacrifice despite zero outcome, but if he backfires (#6), admiration vanishes. The reluctant caregiver (#7) sacrifices much but isn't admired. The badly-motivated do-gooder (#8) isn't admired but his actions still count. The animal-saint-cold-to-family (#9) seems less good overall.

  The user proposed three tests: photocopy (scalability), exit-was-open (freedom of choice), and moral ergonomics (ease of virtue). None fully explain their reactions. The exit-was-open test handles #7 but makes #4 more admirable, which contradicts the user's intuition. The photocopy test works for some but not others. Moral ergonomics doesn't resonate with the user.

  The core tension seems to be between outcomes, character, and the integration of goodness into a life. Cases like #3 and #4 suggest that when morality consumes all other aspects of life, it feels pathological. The backfire case (#6) shows that intention isn't everything—consequences matter when they're negative, but not when neutral (#5). Sacrifice without choice (#7) lacks the element of voluntary virtue that triggers admiration.

  The user's admiration for the reformed person might stem from seeing moral growth as a narrative of redemption, which adds depth beyond steady goodness. This hints that the story of becoming good matters, not just the state of being good.

  A principle centered on moral integrity might work: goodness must coexist with other human qualities without dominating them. The "shape" of a life matters—goodness should be integrated, not totalizing. This explains why #2 is admirable (bees, music) while #3 isn't (no breaks, judgmental). It also handles #9: neglecting close relationships creates a moral imbalance, even if the sum of good acts is high.

  For outcomes, the asymmetry could be about moral luck: we judge the intention when outcomes are neutral, but hold people accountable for actual harm when it occurs. Hence #5 is admired (good intent, no harm), but #6 isn't (harm caused, even if unintended).

  The exit clause explains #7 (no choice) and #4's lack of admiration—engineered ease removes struggle, making virtue feel technical rather than virtuous. The reformed person's late devotion might be admirable because the exit was open (they chose change after a scare), and their story adds a layer of redemption that static goodness lacks.

  This principle would drop the user's reaction to #8—if the action is good, motivation shouldn't diminish its value, but the user separates admiration of the person from evaluation of the act. The principle might reconcile this by saying the act is good, but the person lacks integrity if their motives are rotten.

  Predictions: The user might admire someone who does moderate good with great personal cost more than someone who does more good effortlessly. They'd likely value moral growth over consistency, and find context-sensitive virtue (helping family vs. strangers) more admirable than blanket self-sacrifice.
answer: |-
  You're wrestling with a deep tension between moral *outcomes*, personal *character*, and the *shape* of a life – and Priya's "moral saints" critique highlights how maximizing one can distort the others. Your gut reactions aren't inconsistent; they point to a principle that *integrates* goodness into a flourishing human life, rather than treating it as a standalone metric. Here’s a principle that captures nearly all your verdicts, explains the asymmetry with outcomes, and handles your late-in-life reformer:

  **Principle: Moral Admiration requires *Integrity of Character* – the harmonization of three elements:**
  > **1. Agency:** The good must be chosen freely, reflecting a *stable disposition* (not compulsion, accident, or lack of exit).  
  > **2. Integration:** The good must coexist with other human goods (relationships, interests, joy, self-respect) without *pathologically dominating* them.  
  > **3. Recognition:** The good must demonstrate *practical wisdom* – sensitivity to context, consequences (especially harm), and the moral claims of proximity.

  This principle values *how* goodness lives within a person and their life, not just the sum of good produced. It explains why "maximal moral output" alone feels repellent – it often violates Integration or Agency. Let's test it against your cases:

  1.  **Kidney Donor:** **Admired.** High Agency (radical free choice). High Integration (act doesn’t imply a life stripped of other goods). Recognition (understands the need clearly). *Passes.*
  2.  **Bee-Keeper/50% Giver:** **Admired.** Agency (sustained choice). High Integration (bees, music, relationships imply a full life). Recognition (balance suggests wisdom). *Passes – this is the model.*
  3.  **Ascetic/90% Giver:** **Not Admired (as a person).** Agency? (Possibly compulsive). **Fails Integration** (life is stripped bare; joy/rest seem absent; judgment implies imbalance). Recognition? (Lacks sensitivity – calling others "complicit" shows poor contextual wisdom). Her *output* is high, but her *character* is fractured by the dominance of the moral impulse. Explains "less good as a person."
  4.  **Engineered-Ease Saint:** **Unimpressed.** Agency (deliberate choice). **Fails Integration?** This is key: you feel her "virtue" is cheapened because she removed the *struggle*. Integration isn't just about *having* other goods, but about goodness co-existing *alongside* normal human temptations and complexities. Removing all friction makes virtue feel technical, not deeply characterological. Recognition might be high, but the *achievement* of virtue feels hollow without internal engagement. *Principle explains your unease: virtue achieved by eliminating the human context lacks depth.*
  5.  **Ineffective Whistleblower:** **Admired.** Agency (huge sacrifice, freely chosen). Integration? (Depends on his life otherwise, but sacrifice for principle often integrates with character). Recognition? (He *recognized* a wrong needing addressing; his practical wisdom wasn't flawed just because a backup existed – he acted on available knowledge). *Passes: Admiration for the character revealed.*
  6.  **Backfiring Whistleblower:** **Not Admired.** Agency? (Same). Integration? (Same). **Fails Recognition:** The harm caused reveals a *failure of practical wisdom*. He didn't adequately recognize risks, context, or potential consequences. His *judgment* was flawed, making the act reckless, not virtuous. The asymmetry (outcome matters when bad, less when neutral) is explained: **Harm demonstrates a *failure* of Recognition, which is central to character. Neutral outcomes don't inherently imply a failure of Recognition.** #5 acted wisely based on what he knew; #6 did not.
  7.  **Reluctant Caregiver:** **Not Admired (but sad).** **Fails Agency:** She never truly *chose*; it was necessity. There’s no "exit was open" without catastrophe. Her sacrifice, while immense, doesn't flow from a disposition *to be good*; it flows from circumstance and duty. Recognition might be high (she sees the need), but without Agency, it’s not virtue in the admirable sense – it’s tragic endurance. *Explains lack of admiration without denying the good done.*
  8.  **Saint with Rotten Motives:** **Action Good, Person Not Admired.** Agency? (He acted, but motive clouds it). **Fails Recognition?** Partly, but mainly **Fails Integration:** His rotten motive (guilt, pride) means the "good" isn't integrated into a *good character*. It's an instrumental act, disconnected from his core disposition. The act produces good (so it's "worth" the same), but the *person* lacks integrity because his character isn't aligned with the good he does. *Principle supports your separation: the act's outcome is separate from the character flaw.*
  9.  **Animal Saint / Cold Family:** **Less Good (as a person).** **Fails Recognition:** She fails to recognize the *proximity* and *strength* of moral claims from her family. **Fails Integration:** Her "goodness" is lopsided; it dominates her concern for animals while neglecting fundamental human relational goods. The life lacks balance and wisdom about differing obligations. *Shape matters because Integration and Recognition demand context-sensitivity.*

  **Late-in-Life Reformer:** You admire this more than #2. The principle explains it:
  *   **Agency:** Dramatic, free choice against ingrained habit (exit was open!).
  *   **Integration:** The *story* of transformation integrates the good deeply – it becomes core to his *new* identity after recognizing past failure. The struggle makes it feel earned.
  *   **Recognition:** The "scare" often represents a moment of profound *recognition* of mortality, responsibility, or harm caused.
  This *narrative arc* of redemption often feels *more* integrated and agential than steady-state goodness (#2) because it overcomes significant internal resistance. It's not *just* a good story; it demonstrates a powerful act of character integration.

  **What the Principle Drops/Overturns:**
  *   **Drops:** Strict adherence to admiring #1 and #5 *equally*. While both pass, #1 feels purer (direct, undeniable good). The principle allows for degrees – #1 might exemplify Integrity more starkly than #5.
  *   **Overturns:** Your mild unease with #4 (Engineered-Ease). The principle suggests her approach *is* an achievement of Agency and potentially Recognition (structuring life wisely). If she’s content, has other interests within her co-op, and isn’t judgmental, she might actually satisfy Integration – perhaps your reaction is initial prejudice against "easy" virtue that the principle helps correct. (Moral ergonomics *is* part of wisdom!).
  *   **Clarifies #8:** Priya’s "having it both ways" charge misses the point. The principle explicitly separates *evaluation of the act* (good outcome) from *evaluation of the character* (lacking integrity due to motive).

  **Predictions & Asymmetry Explained:**
  *   You’d admire someone who does significant good *despite* significant temptation or hardship more than someone who does slightly more good effortlessly (#4).
  *   You’d find "maximal output" saints admirable *only* if their lives demonstrably integrated other goods (e.g., a joyful, non-judgmental ascetic with deep friendships and intellectual passion – rare, but possible).
  *   Sacrifice *for a principle* (like #5) remains admirable even if ineffective, *unless* it stemmed from reckless disregard for consequences (linking to Recognition failure as in #6).
  *   Someone who is consistently, quietly kind within their community, tending to relationships and local needs (modest output, high Integration/Recognition) would be more admirable to you than a high-output, globally-focused saint who is emotionally distant or burns out.
  *   **The Outcome Asymmetry:** Harm signals a *failure of Recognition* (a character flaw). Good outcomes signal success *only* if achieved through Agency and Integration. Neutral outcomes don't signal failure of Recognition, so Agency/Integration can still drive admiration (#5). Maximizing outcomes often requires sacrificing Integration or Agency (hence Priya's "bore").

  **In essence:** Maximizing moral output isn't repellent *in itself*. It becomes repellent when it requires sacrificing the *humanity* of the agent – their freedom of choice (Agency), their capacity for a full life (Integration), or their practical wisdom (Recognition). You admire *moral integrity* – goodness woven into a good life by a wise and free agent. Priya sees goodness as a quantity; you see it as a quality of character and living. Your gut is tracking the difference.
