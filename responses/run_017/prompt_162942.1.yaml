prompt: |-
  I work at a small philanthropic brokerage that arranges moral trades: we introduce two funders who disagree about what is worth funding, and each directs money to what the other believes matters, on the understanding that both can end up better off by their own lights even though neither has persuaded the other of anything. We vet around twenty proposed trades a year with three staff and roughly half a day per proposal, and anything above a modest size has to be signed off by our board. What we do not have is a written procedure. We argue case by case, and the arguments keep collapsing into two slogans: that both sides gain by their own lights, so there is nothing left to object to, and that we are helping people do indirectly what they would not do themselves, which my colleagues treat as conclusive and I do not. I would like something better than either slogan, and better than a list of considerations with no order to them.

  Please write the decision procedure we could actually run. It should be a short ordered sequence of questions, with, for each one, what counts as a sufficient answer, what evidence we should demand and from whom, where the procedure stops with a no, and where it hands the decision to a named person because the remaining question is one of values rather than facts. It has to be usable by someone with no philosophy training, in a few hours, with counterparties who often cannot articulate a general value theory and can only tell us what they would fund. The conceptual work is in what the procedure preserves and what it drops, so it should handle at least these: the difference between a trade and mere cooperation on a project both parties already value, and between a trade and offsetting, where one party does something the other takes to be harmful and then compensates for it; cases where the disagreement is about a matter of fact rather than a matter of value, where what looks like a trade may really be a bet about which intervention is more effective; whether helping the counterparty do what we ourselves take to be wrong can ever be licensed by the fact that they gain by their own lights; whether we should discount the counterparty's gain by our own credence that their view is correct, and what, if anything, agreeing to broker says about that credence; parties whose values contain thresholds, satiation points, or protected and incommensurable goods, so that more money in their favoured cause eventually buys them nothing; trades where one party is a trustee acting for beneficiaries who cannot now consent, and trades whose performance is deferred for decades, where the party that must later perform is not the party that agreed; enforcement, meaning sequencing, escrow, reputation, defection after receipt, and what we owe each side when the other defaults; and our own conflict of interest, since our fee scales with the size of the trade we approve.

  Then run it on three proposals. First, a global-health funder who pays for insecticide-treated nets and deworming, matched with a funder who pays for arts education in her own city and makes no apology for favouring it; each commits two hundred and fifty thousand dollars to the other's chosen charity. I expect this one to pass, and I want to see where the procedure still demands judgement, including why equal dollar amounts are the default ratio and when the ratio should differ. Second, an animal-welfare foundation gives a million dollars now to a fund oriented towards the long-term future, and the fund's trustees undertake to disburse an inflation-adjusted equivalent to animal-welfare work in thirty years, across at least two changes of trustee and a governing document that can be amended: I want the procedure's answer on whether current trustees can bind their successors, whether beneficiaries who do not yet exist can be represented in a trade, and what security we should require. Third, a trade that both parties gain from by their own lights and that would be the largest we have ever brokered, in which one side's favoured intervention rests on an empirical claim our staff believe to be false and the other side accepts the trade largely because it defers to that judgement: my co-founder says it is not our business to police anyone's factual beliefs, I think we are being asked to sell our credibility, and I want the procedure to tell us which of us is right, or to tell us what extra question would have to be added to settle it and what adopting that question would cost us. If the procedure also needs a different treatment for trades involving an individual donor rather than an institution, say so. Two or three pages, no citations or bibliography, with a short preamble a new analyst could read to understand what a moral trade is and why the both-gain test is not enough on its own, and an honest closing section on what the procedure cannot do and where it will misfire.
reasoning: |-
  We are designing a decision procedure for a philanthropic brokerage that arranges "moral trades": exchanges where two funders each direct money to the other's favored cause, under the agreement that both gain by their own lights (i.e., each values the cause they are funding less than the cause they are receiving funding for, in the counterfactual where the trade doesn't occur). The procedure must be practical, used by non-philosophers in a few hours, and address the concerns raised.

  Key issues to cover:
  1. Distinguish trades from mere cooperation (where both already value the same project) and from offsetting (where one party does harm and then compensates).
  2. Handle cases where the disagreement is factual (e.g., about effectiveness) rather than purely about values.
  3. Address whether it's permissible to help a counterparty do what we (the brokerage) consider wrong, even if they gain by their own lights.
  4. Consider discounting by our credence in the counterparty's view and what brokering implies about that credence.
  5. Account for thresholds, satiation, and incommensurable goods in values.
  6. Handle trustees acting for beneficiaries who cannot consent and deferred-performance trades.
  7. Address enforcement (sequencing, escrow, reputation, default).
  8. Manage our conflict of interest (fee scales with trade size).

  The procedure will be a sequence of questions. For each, we specify:
  - What counts as a sufficient answer.
  - What evidence to demand and from whom.
  - Where it stops with a "no".
  - Where it hands the decision to a named person (e.g., board) for value judgments.

  We assume the brokerage staff (analysts) run the procedure, and the board handles cases requiring value judgments or high stakes.

  **Preamble for Analysts:**

  A moral trade is an exchange between two funders (A and B) where:
  - A directs money to B's favored cause (Cause B).
  - B directs money to A's favored cause (Cause A).
  - By doing so, both A and B are better off by their own lights than they would be without the trade. That is, each values the cause they are funding less than the cause they are receiving funding for, in the counterfactual where the trade doesn't occur.

  Why the "both gain" test is not enough:
  - It doesn't distinguish trades from mere cooperation (if both already value both causes, then they might just be cooperating on a shared project).
  - It doesn't rule out offsetting (e.g., A harms in a way that B dislikes, then B pays A to stop, which is compensation, not a trade).
  - It doesn't address whether we should facilitate actions we consider wrong, even if the counterparty gains by their own lights.
  - It doesn't handle cases where the gain might be based on false beliefs (factual disagreements) or where the trade might have long-term consequences that the parties haven't considered.

  The procedure below is designed to address these and other concerns. It aims to ensure that the trade is genuine, voluntary, and does not violate core principles of the brokerage.

  **Decision Procedure:**

  1. **Are both parties acting voluntarily and with adequate information about the trade mechanics?**
     - *Sufficient answer*: Yes, both parties confirm they understand the trade (each pays the other's cause) and are not under duress.
     - *Evidence*: Written confirmation from both parties (email or signed statement) that they understand and consent to the trade structure.
     - *Stop if no*: If either party does not understand or is coerced, stop and reject the trade.
     - *Hand off*: None. This is a factual check.

  2. **Is there a genuine disagreement about the relative importance of the two causes?**
     - *Sufficient answer*: Each party must value their own cause more than the other's cause by their own lights, in the counterfactual without the trade. Also, we must confirm that the trade is not merely cooperation on a shared project (both already value both causes) or offsetting (one party causing harm that the other then pays to stop).
     - *Evidence*: Each party must independently state (without consulting the other) that they would not have funded the other's cause with the same amount of money in the absence of the trade. Additionally, we must check that the causes are not inherently linked (e.g., one cause is not the harm that the other cause is repairing). Ask: "Would you have funded the other cause with this amount of money if not for this trade?" and "Is there any sense in which one cause is undoing or compensating for harm done by the other?"
     - *Stop if no*: If both parties already value both causes and would fund them anyway (so no trade is needed) or if it's offsetting (one party is causing harm and the other is paying to stop it), then reject. Also, if one party is funding a cause that directly undoes the other's work (e.g., building and then demolishing a building), reject as offsetting.
     - *Hand off*: If unclear, the analyst must document and then hand to the board for a value judgment on whether it is a genuine trade or offsetting/cooperation.

  3. **Is the disagreement primarily about values or about facts?**
     - *Sufficient answer*: The disagreement should be about values (what is important) rather than about facts (e.g., which intervention is more effective). If it's about facts, then the trade might be a bet in disguise, and we are not set up for betting.
     - *Evidence*: Ask each party: "If you believed that the other party's cause was as effective as they claim, would you then value it as highly as they do?" If both say "no", then the disagreement is primarily about values. If one says "yes", then it might be a factual disagreement. Also, if our staff assessment is that the disagreement is factual (e.g., one cause is based on a disputed effectiveness claim), flag it.
     - *Stop if no*: If the trade is primarily a bet on a factual outcome (e.g., which intervention saves more lives), we reject because we are a moral trade brokerage, not a betting shop. Also, if the trade depends on a factual claim that we (the brokerage) know is false (e.g., the cause is a scam), we reject.
     - *Hand off*: If the parties insist it's about values but our staff assessment is that it's about facts (and we don't have evidence of falsehood), hand to the board. The board must decide whether the factual disagreement is so central that it invalidates the trade as a moral trade. Also, if the trade is large and the factual claim is critical, the board must decide.

  4. **Do both parties gain by their own lights from the trade?**
     - *Sufficient answer*: Each party must confirm that, by their own values, they prefer the trade (they get their cause funded by the other, and they fund the other's cause) to the status quo (no trade). This is the core "both gain" test.
     - *Evidence*: Written statement from each party: "By my own values, I consider the trade (where I fund [other cause] and receive funding for [my cause]) to be better than not trading." Also, we must check for thresholds and satiation: if a party's cause has a satiation point and the trade would push it beyond, then the gain might be zero or negative. Ask: "Is there any point at which additional funding to your cause would not produce additional value by your lights? And if so, how close are you to that point?" If the trade would exceed the satiation point, then the gain might be negative. Also, for protected goods (incommensurable), ask: "Is there any amount of funding for the other cause that would compensate for not funding your cause?" If the answer is "no", then the trade might not be possible because the goods are incommensurable.
     - *Stop if no*: If either party does not gain (or if the gain is zero due to satiation), stop and reject.
     - *Hand off*: If there are thresholds or satiation points that might be approached, the analyst must calculate the net gain and hand to the board to decide whether the gain is sufficient. Also, if the goods are incommensurable (one party says no amount of funding the other cause would compensate), then the board must decide if the trade is still acceptable (e.g., if the amount is small enough that it doesn't trigger the incommensurability).

  5. **Is the trade ratio (dollar amounts) fair?**
     - *Sufficient answer*: The default is equal dollar amounts. However, if one party gains much more than the other (due to differences in the marginal value of money to their cause), then the amounts might need to be adjusted. Also, if one party is funding a cause that we (the brokerage) believe is less cost-effective, we might not adjust, but we note that the trade ratio is a matter for the parties.
     - *Evidence*: Each party must state the marginal value (in their own terms) of an additional dollar to their cause. However, since they may not be able to quantify, we ask: "Would you be willing to accept a different ratio (e.g., you give $X and receive $Y) and still feel you gain?" If both are satisfied with the proposed ratio, that is sufficient. Also, we must check for extreme imbalances (e.g., one party gains $1 million in value while the other gains $1 thousand by their own lights) but note that the parties might still agree.
     - *Stop if no*: Only if one party does not agree to the ratio. Otherwise, we do not stop but note for the board.
     - *Hand off*: The board must review and approve any trade where the dollar amounts are unequal (unless both parties explicitly accept the ratio) or where the gains are extremely asymmetric (by the parties' own lights) to ensure there is no exploitation.

  6. **Are there any concerns about the counterparty's values? (The "helping do wrong" question)**
     - *Sufficient answer*: We do not require that we (the brokerage) endorse the counterparty's values. However, we must ensure that we are not facilitating something we consider egregiously wrong (e.g., human rights abuses). We set a high bar: only if the cause is illegal or universally condemned (e.g., funding terrorism) do we reject.
     - *Evidence*: Our staff research on the cause: is it illegal in the relevant jurisdictions? Is it widely considered immoral (e.g., by international norms)? We do not rely on our own moral views but on legal and broad societal standards.
     - *Stop if no*: If the cause is illegal or universally condemned, stop and reject.
     - *Hand off*: If the cause is controversial but not illegal, the board must decide whether it crosses the threshold of being egregious. Also, if we (the brokerage) have a stated mission that conflicts with the cause, the board must decide.

  7. **Are there any future or third-party concerns?**
     - This question covers:
       - Trustees acting for beneficiaries: Can the current trustees bind future trustees? We require that the governing documents allow for binding commitments and that the beneficiaries' interests are represented.
       - Deferred performance: If performance is deferred (e.g., payment in 30 years), we require escrow or a legally binding commitment with collateral.
       - Beneficiaries who cannot consent (future generations, animals): We require that the trustee has a clear mandate to act for them and that the trade is in their interest (by the trustee's lights, but we must check for conflicts).
     - *Sufficient answer*: For trustees: the trust documents allow such trades and the trade is within the trustee's mandate. For deferred performance: escrow or a surety bond. For future beneficiaries: the trustee must affirm that the trade benefits the beneficiaries by their own lights.
     - *Evidence*: Trust documents, legal opinion on enforceability, and a written commitment from the trustee that the trade is in the beneficiaries' interest. For deferred performance, evidence of funding set aside (escrow) or collateral.
     - *Stop if no*: If the trustee cannot commit (e.g., governing documents prohibit binding future trustees) or if the beneficiaries' interests are not represented, stop and reject. If deferred performance cannot be secured, stop.
     - *Hand off*: The board must review any trade involving deferred performance or trustees to ensure the safeguards are adequate and the beneficiaries are protected.

  8. **Enforcement and Default**
     - *Sufficient answer*: We must ensure that the trade is enforceable. Our standard method is simultaneous exchange via escrow. If not simultaneous (e.g., deferred), then we require escrow for the deferred part. We also consider reputational mechanisms and what happens if one party defaults.
     - *Evidence*: A signed agreement between the parties that includes:
          - The amounts and causes.
          - The sequence of payments (preferably simultaneous via escrow).
          - Remedies if one party fails to pay (e.g., the other is released from obligation, and we blacklist the defaulter).
          - For deferred performance, the escrow arrangement or surety.
     - *Stop if no*: If the parties cannot agree on a secure enforcement mechanism (e.g., one refuses escrow), stop and reject.
     - *Hand off*: The board must approve any non-simultaneous trade or any trade without escrow.

  9. **Conflict of Interest**
     - *Sufficient answer*: Since our fee scales with trade size, we must ensure that the trade size is justified and not inflated due to our incentive. We require that the dollar amounts are consistent with the parties' stated gains and typical giving levels.
     - *Evidence*: Compare the trade size to the parties' annual giving. If the trade is more than 20% of their annual giving, flag for review. Also, if the trade is unusually large for the causes, flag.
     - *Stop if no*: Only if there is evidence of fraud (e.g., the parties are colluding to inflate the trade for our fees). Otherwise, we note and hand to the board.
     - *Hand off*: The board must approve any trade that is above a threshold (e.g., >$1M or >20% of the party's annual giving) to ensure the size is reasonable and not driven by our fee.

  **Summary of Hand-offs to Board:**
  - Step 2: If unclear whether genuine trade or offsetting/cooperation.
  - Step 3: If the disagreement is primarily factual and we are unsure whether to proceed.
  - Step 4: If there are thresholds, satiation, or incommensurability that might reduce the gain.
  - Step 5: If the trade ratio is unequal or gains are very asymmetric.
  - Step 6: If the cause is controversial but not clearly egregious.
  - Step 7: All cases involving trustees, deferred performance, or future beneficiaries.
  - Step 8: Any non-standard enforcement (non-simultaneous, no escrow).
  - Step 9: Trades above a predefined size threshold.

  **Running the Procedure on Three Proposals**

  **Proposal 1: Global Health vs. Arts Education**
  - Parties: A (global health: insecticide-treated nets and deworming) and B (arts education in her city).
  - Trade: Each commits $250,000 to the other's charity.

  1. **Voluntary and informed?** Both confirm. Pass.
  2. **Genuine disagreement?** A states they wouldn't fund local arts at this level without trade; B states they wouldn't fund global health. No offsetting (arts doesn't harm global health). Pass.
  3. **Values vs. facts?** Disagreement is about values: A values global health more, B values local arts. Staff assessment: no factual dispute. Pass.
  4. **Both gain?** Both confirm they gain. No thresholds: both causes can absorb $250k. Pass.
  5. **Trade ratio?** Equal dollars. Both accept. Pass. (Note: The default is equal dollars because it's simple and both accept. We don't adjust for cost-effectiveness because that would impose our values. However, if one party had a satiation point, we might adjust the ratio.)
  6. **Concerns about values?** Both causes are legal and not egregious. Pass.
  7. **Future/third-party?** None: both are current donations. Pass.
  8. **Enforcement?** Simultaneous via escrow. Pass.
  9. **Conflict of interest?** $250k is modest, below the threshold for board review. Pass.

  Outcome: Approved by analyst.

  **Proposal 2: Animal Welfare vs. Long-term Future (deferred)**
  - Parties: Animal Welfare Foundation (A) gives $1M now to a Long-term Future Fund (B). B's trustees undertake to disburse an inflation-adjusted $1M (in today's dollars) to animal-welfare work in 30 years.

  1. **Voluntary and informed?** Both trustees confirm. Pass.
  2. **Genuine disagreement?** A values current animal welfare more than long-term future; B values long-term future more than current animal welfare. Not offsetting. Pass.
  3. **Values vs. facts?** Disagreement is about values (time discounting and cause prioritization). Pass.
  4. **Both gain?** A gains because they get future funding for their cause (which they value) in exchange for funding B's cause now. But we must check: does A value future animal welfare? If A only values current work, then they might not gain. We ask A: "Do you value future animal welfare?" A says yes, but discounts the future. They confirm that the present value of the future disbursement (by their discount rate) is greater than $1M. Similarly, B gains by getting $1M now for their cause. Pass.
  5. **Trade ratio?** Equal nominal dollars, but adjusted for inflation. A states that with their discount rate (say 5% per year), the present value of $1M in 30 years is less than $1M. But they still gain because they value the future disbursement more than the $1M they give up (by their own calculation). The ratio is accepted by both. Pass.
  6. **Concerns about values?** Both causes are legitimate. Pass.
  7. **Future/third-party?** 
     - Can current trustees bind future trustees? We require evidence from B's trust documents that they can make binding commitments that bind successors. If not, we require an escrow account that is irrevocably dedicated to animal welfare in 30 years, with an inflation-adjustment mechanism. Also, B must affirm that the trade is in the interest of their beneficiaries (future people). 
     - For A: they are acting for animals (who cannot consent). A must affirm that the trade benefits animals (by getting more funding overall) and is within their mandate.
     - *Evidence*: B's trust documents and a legal opinion on whether the commitment binds. If not, we require an escrow account. Also, A's mandate to trade.
     - *Hand off*: Because of deferred performance and trustee issues, must go to the board. The board must ensure that the escrow is set up (if needed) and that the commitment is secure. They must also check that A's action is in the interest of their beneficiaries (animals).
  8. **Enforcement?** Non-simultaneous: A pays now, B pays in 30 years. We require that the future payment is secured. Best: escrow account with a reliable third party, funded now by B (but that would defeat the trade) — so instead, we require that B sets aside the future payment in a legally protected trust or buys an inflation-adjusted annuity. Alternatively, B provides collateral. Given the long horizon, we require an irrevocable trust or escrow that automatically disburses in 30 years. If B cannot provide this, reject.
  9. **Conflict of interest?** $1M is large, so board review is required for size.

  Outcome: The analyst hands to the board at step 7. The board must decide on the enforceability mechanism and whether the trustee can bind the future. If they set up a secure escrow and the trust allows, approve.

  **Proposal 3: Large Trade with Disputed Factual Claim**
  - Parties: A funds Cause X, which rests on an empirical claim our staff believes is false. B funds Cause Y. B accepts the trade largely because they defer to A's judgment on the factual claim. Trade is large.

  1. **Voluntary and informed?** Both confirm. Pass.
  2. **Genuine disagreement?** Both state they wouldn't fund the other's cause without trade. Not offsetting. Pass.
  3. **Values vs. facts?** 
     - We ask B: "If you believed Cause X was as effective as A claims, would you value it as highly as A does?" B says: "No, because I care about different things. But I do think that if A is right, then Cause X is more effective than I thought, and I'm willing to fund it in exchange for funding for my cause." 
     - However, our staff assessment: the trade depends on a factual claim we believe is false. For example, A claims that Cause X (say, a particular education method) has very high returns, but we have evidence it does not. B is only funding Cause X because they trust A's factual judgment, not because they share A's values.
     - This is tricky. The disagreement is primarily about facts (the effectiveness of Cause X), but B is not betting; they are deferring. However, if the factual claim is false, then B might not actually gain (if they care about effectiveness) because Cause X is ineffective.
     - *Hand off*: We stop at step 3 and hand to the board. The board must decide:
          - Is the trade a moral trade or a bet? Since B is not sharing A's values but is relying on A's factual claim, it's a bet on the facts.
          - Also, if we believe the factual claim is false, we might be facilitating a waste of money (which B would regret if they knew the facts).
     - Our procedure says: if the trade is primarily a bet on facts, reject. But here it's not a bet because B isn't expecting to be proven right or wrong; they are deferring. However, the board must consider whether we are being used to lend credibility to a false claim.
  4. The other steps are not reached until step 3 is resolved.

  Outcome: The board must decide. They might reject because the trade hinges on a factual claim we believe is false and that B is not in a position to evaluate. This goes to the heart of our credibility: we are not just facilitating trade; we are endorsing the causes by listing them. Therefore, we should reject trades where we have strong evidence that one cause is based on a false factual claim and the other party is only funding it because they defer to the first party's judgment. This protects our reputation and prevents us from being complicit in spreading falsehoods.

  **Closing: What the Procedure Cannot Do**

  - It cannot resolve deep moral disagreements within our team; it only provides a framework.
  - It relies on parties being honest and self-aware about their values. If they misrepresent, we might approve bad trades.
  - It cannot fully eliminate the risk of deferred trades; 30 years is long, and even escrow might fail.
  - It might reject some beneficial trades that are close to the line (e.g., factual disagreements that are genuine but not bets).
  - It doesn't handle trades with more than two parties.
  - It doesn't address systemic effects (e.g., if a trade shifts funding from a high-priority cause to a low-priority one by global standards, but we don't impose external standards).
  - It might be too rigid for some edge cases, requiring board review often.

  The procedure will misfire if:
  - A party is self-deceived about their values.
  - A factual claim we think is true turns out false (or vice versa).
  - A deferred trade encounters unforeseen events (e.g., hyperinflation, collapse of escrow agent).

  Despite this, the procedure provides a structured way to handle the majority of cases and flags the hard ones for board review.
answer: |-
  ### Decision Procedure for Moral Trades  
  **Preamble for Analysts**  
  A "moral trade" occurs when two funders (Party A and Party B) each direct money to the other’s cause, allowing both to achieve more of what they value than they could alone. Crucially, they *disagree* about what is worth funding: Party A values their own cause (Cause A) more than Party B’s cause (Cause B), and vice versa. The trade lets both "win" by their own standards without persuasion.  

  The "both gain by their own lights" test alone is insufficient because:  
  - It fails to distinguish trades from **mere cooperation** (where both already value the same cause) or **offsetting** (where one party "harms" and the other "compensates," creating moral hazard).  
  - It ignores cases where gains rely on **false beliefs**, **threshold effects** (e.g., satiation points), or **deferred obligations** that risk non-performance.  
  - It doesn’t address whether brokering a trade that we deem "wrong" is acceptable, or how to handle conflicts of interest.  

  This procedure ensures trades are genuine, secure, and aligned with our mission. It prioritizes pragmatism over philosophy: parties need only articulate what they would fund, not a "value theory." Staff analysts run the procedure; the Board handles value judgments or high-stakes ambiguity.  

  ---  
  **Decision Procedure: 9 Ordered Questions**  
  *For each question:*  
  - **Sufficient answer**: What qualifies as a pass.  
  - **Evidence required**: What to collect and from whom.  
  - **Stop/reject**: Where a "no" ends the process.  
  - **Hand off**: Where unresolved questions go to the Board (due to values, risk, or ambiguity).  

  **Question 1: Are both parties clear, voluntary, and legally competent?**  
  - *Sufficient answer*: Both parties confirm understanding and consent without coercion.  
  - *Evidence*: Signed statements (email acceptable) from both parties: "I voluntarily agree to direct $X to the counterparty’s cause in exchange for $Y to mine, and I understand this is not a joint project."  
  - *Stop/reject*: If either party is ambiguous, coerced, or lacks authority (e.g., a trustee exceeding mandate).  
  - *Hand off*: None. Analyst decides.  

  **Question 2: Is this a genuine trade (not cooperation or offsetting)?**  
  - *Sufficient answer*: (a) Neither party would fund the other’s cause without the trade; (b) No cause "undoes" or "compensates for" the other (e.g., funding pollution cleanup for a polluter is offsetting).  
  - *Evidence*: Separate interviews asking: "Would you fund the counterparty’s cause with this amount if not for this trade?" and "Does either cause directly enable, worsen, or negate the other?" Staff assess cause descriptions for logical links.  
  - *Stop/reject*: If both would fund the other’s cause anyway (cooperation) or if offsetting is detected.  
  - *Hand off*: If links are ambiguous (e.g., arts funding "offsets" poverty by improving well-being?), Board decides if it’s offsetting.  

  **Question 3: Is the core disagreement about values, not facts?**  
  - *Sufficient answer*: Parties primarily disagree on *what matters* (e.g., animal welfare vs. human health), not on empirical effectiveness (e.g., "Does deworming boost income?"). If factual, the "trade" may be a bet.  
  - *Evidence*: Ask: "If the other’s cause were proven equally effective as they claim, would you value it as they do?" Staff review project evidence (e.g., studies) for major factual disputes.  
  - *Stop/reject*: If the trade hinges on a factual bet (e.g., "Fund my tech if it works").  
  - *Hand off*: If values/facts are intertwined (e.g., one party defers to the other’s expertise), Board judges if it’s still a value trade.  

  **Question 4: Do both gain by their own lights, accounting for thresholds?**  
  - *Sufficient answer*: Each confirms net gain, and no thresholds/satiation points are breached (e.g., "My cause cannot absorb more funds" or "No amount of their cause compensates for unfunded mine").  
  - *Evidence*: Statements: "This trade leaves me better off by my values than no trade." Staff ask: "Is there a funding point where more money adds no value? Is $Y sufficient for you to forgo $X for your cause?"  
  - *Stop/reject*: If either party reports no gain, gain is trivial, or thresholds block commensurability.  
  - *Hand off*: If gains are asymmetric (e.g., Party A gains 10x Party B by their lights) or thresholds are near, Board judges fairness.  

  **Question 5: Is the dollar ratio justifiable?**  
  - *Sufficient answer*: Default is equal dollars. Asymmetry (e.g., $500K:$250K) is allowed only if both parties accept it *and* it reflects value differences (e.g., Cause A is cheaper per unit good).  
  - *Evidence*: Parties must justify asymmetric ratios: "Why is $A ≠ $B?" Staff compare to parties’ past grants to detect anomalies.  
  - *Stop/reject*: If parties demand asymmetry but cannot explain it without coercion.  
  - *Hand off*: All asymmetric ratios to Board, which assesses if it exploits information gaps.  

  **Question 6: Does the trade avoid egregious harm?**  
  - *Sufficient answer*: Neither cause is illegal, fraudulent, or violates broad humanitarian norms (e.g., torture advocacy). We do *not* require causes to align with our values.  
  - *Evidence*: Staff research: legal compliance, fraud history, and alignment with UN Global Compact principles.  
  - *Stop/reject*: If clear illegality/fraud.  
  - *Hand off*: If controversial but not illegal (e.g., politically divisive causes), Board judges if it crosses our "harm" line.  

  **Question 7: Are future/third-party interests secured?**  
  - *Sufficient answer*: For trustees: beneficiaries’ interests are represented via mandate (e.g., "animal welfare" includes future animals). For deferred trades: enforceable mechanisms exist (e.g., escrow).  
  - *Evidence*: Trust documents showing authority to bind successors; legal opinion on enforceability; escrow plans for deferred performance.  
  - *Stop/reject*: If trustees lack mandate, beneficiaries are excluded (e.g., future humans), or no escrow for deferral >1 year.  
  - *Hand off*: All deferred trades or trustee cases to Board, which confirms safeguards.  

  **Question 8: Is enforcement robust?**  
  - *Sufficient answer*: Funds are exchanged simultaneously via escrow. If deferred, collateral or insurance covers default.  
  - *Evidence*: Escrow agreement signed; for deferred trades, proof of collateral/insurance.  
  - *Stop/reject*: If parties refuse escrow or deferred security is inadequate.  
  - *Hand off*: Non-simultaneous trades to Board for risk assessment.  

  **Question 9: Is the size free of conflict of interest?**  
  - *Sufficient answer*: Trade size is consistent with parties’ typical giving and proportional to gains.  
  - *Evidence*: Compare trade size to parties’ annual grants; staff flag if >20% of annual giving or anomalous.  
  - *Stop/reject*: If evidence suggests size is inflated to boost our fee (e.g., parties colluding).  
  - *Hand off*: All trades >$500K to Board for conflict review.  

  **Special Case: Individual vs. Institutional Funders**  
  - Treat individuals like institutions, but verify legal capacity (Question 1) more rigorously (e.g., consult independent advisor if large sum).  

  ---  
  **Testing the Procedure**  
  **Proposal 1: Global Health Funder vs. Local Arts Funder**  
  - *Trade*: $250K each to the other’s cause.  
  - **Q1**: Both confirm understanding. Pass.  
  - **Q2**: Global health funder would not fund arts; arts funder would not fund deworming. No offsetting. Pass.  
  - **Q3**: Disagreement is values-based (human lives vs. cultural enrichment). Staff confirm no factual dispute. Pass.  
  - **Q4**: Both report gain. No thresholds (nets/deworming scale; arts can absorb $250K). Pass.  
  - **Q5**: Equal dollars accepted. Staff note global health is likely more cost-effective but don’t impose ratios (avoids staff bias). Pass.  
  - **Q6**: Both causes legal and non-egregious. Pass.  
  - **Q7/Q8**: No deferral; simultaneous escrow. Pass.  
  - **Q9**: $250K is modest (<$500K). Pass.  
  - *Outcome*: **Approved by analyst**. Judgment needed only in Q5 (ratio): equal dollars default unless parties justify asymmetry. Here, both accept it, so no Board handoff.  

  **Proposal 2: Animal Welfare Foundation vs. Long-Term Future Fund (Deferred)**  
  - *Trade*: Animal welfare gives $1M now; future fund commits to inflation-adjusted $1M for animal welfare in 30 years.  
  - **Q1**: Trustees confirm authority. Pass.  
  - **Q2**: Animal funder values present welfare over future; future funder values long-term over animals. Not offsetting. Pass.  
  - **Q3**: Values-based (time preference). Pass.  
  - **Q4**: Animal funder values future animal welfare (discounted); future funder values present funds. Pass.  
  - **Q5**: Equal dollars with inflation adjustment. Parties accept. Pass.  
  - **Q6**: Both causes legitimate. Pass.  
  - **Q7**: *Handoff to Board*. Trustees can amend governing docs; beneficiaries (future animals) cannot consent. Staff cannot confirm if future trustees are bound.  
  - **Q8**: Deferred performance requires escrow/collateral.  
  - *Board judgment*: Require irrevocable escrow with inflation index (e.g., TIPS bonds) and trustee rotation clauses. If unenforceable, reject. Outcome hinges on security.  
  - **Q9**: $1M > $500K; Board reviews conflict risk.  
  - *Outcome*: **Approved only if Board confirms enforceable escrow**. Trustees can bind successors if docs allow it; beneficiaries are "represented" via trustee mandate.  

  **Proposal 3: Large Trade with Disputed Factual Claim**  
  - *Trade*: Party A funds Cause X (e.g., "AI risk reduction" based on contested risk estimates); Party B funds Cause Y (e.g., poverty alleviation). B defers to A’s expertise. Trade size: $2M each.  
  - **Q1**: Both competent. Pass.  
  - **Q2**: Genuine disagreement (A values AI risk > poverty; B values poverty > AI risk). Pass.  
  - **Q3**: *Handoff to Board*. B says: "I wouldn’t value AI risk even if proven true, but I trust A’s judgment." Staff assess A’s claim as probably false. Board must decide: Is this a values trade or a factual bet?  
  - *Board judgment*: **Reject**. Rationale:  
    - B’s "deference" makes it a bet on facts ("If A is right, I gain"), not pure values.  
    - Brokering trades based on false claims risks our credibility (we "sell" our vetting).  
    - *Added question?* "Could a reasonable person affirm the factual claim?" But this costs us speed and neutrality; we avoid policing facts unless fraud is evident. Here, staff skepticism suffices for rejection.  
  - *Outcome*: **Rejected by Board**. Resolves co-founder dispute: brokering requires neither endorsing facts nor ignoring blatant falsehoods.  

  ---  
  **What the Procedure Cannot Do**  
  - **Prevent value drift**: We assume parties are honest, but self-deception or hidden thresholds may cause post-trade regret.  
  - **Handle radical uncertainty**: Deferred trades (>10 years) may fail due to force majeure (e.g., regulatory changes), even with escrow.  
  - **Resolve all moral dilemmas**: If a cause is legal but repugnant (e.g., anti-abortion lobbying), Board judgment is subjective.  
  - **Eliminate conflicts**: Large trades incentivize staff to approve; Board review mitigates but doesn’t erase this.  
  - **Scale efficiently**: Vetting complex trades (e.g., thresholds, deferrals) may exceed half a day, risking backlog.  

  **Where It Misfires**  
  - **Overly conservative**: May reject valid trades if parties can’t articulate values (e.g., "I just prefer arts").  
  - **Underprotective**: If a party lies about thresholds (e.g., "I can absorb $1M" when satiated at $500K), we miss it.  
  - **Factual disputes**: We err toward rejection when staff doubt claims, potentially excluding good-faith disagreements.  

  This procedure prioritizes security, consent, and clarity over philosophical purity. It makes tradeoffs explicit and reserves hardest calls for the Board.
