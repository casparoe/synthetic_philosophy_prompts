prompt: |-
  ok so I'm on student council this year (long story, I basically got drafted) and part of what I do is helping run the volunteer hours thing, and I keep bumping into the same pattern and I don't know if it has a name. Our school decided service was important, so they made it into something you log: you need a certain number of hours to get the cord at graduation or whatever. And now people do stuff that everyone agrees is volunteering-shaped but isn't really — a kid I know sat in a thrift store sorting the same bin of tshirts for two hours and logged it, while my friend has been tutoring her little brother's whole class for free all year and it counts for zero because there's no form for it. That part I sort of get: people aim at the number instead of the thing. My econ teacher mentioned some law about this, Goodhart I think, and from what I remember it's about a measure being bad once you start targeting it.

  But the part I can't find a word for is what happens after, and it happens even when nobody is cheating and everyone involved genuinely cares about the actual goal. After a year or two of tracking, the tracked version quietly becomes what people mean by the word. Teachers now describe the thrift store kid as "really committed to service" and the tutoring girl as "not very involved," and when I tried to say that seemed backwards I got treated like I was saying volunteering doesn't matter, which I definately wasn't. My friend's mom is a hospital administrator and she says the same thing about their wait time stats — nobody is lying, the numbers are honestly collected, but "running an efficient clinic" now just means "the number looks good," and if you ask what the number was standing in for people look at you like you're being difficult. So it's not exactly that the measure stopped being a good measure. It's more like the thing being measured shrank until it fit the measure perfectly and kept the old name.

  Is there a real term for that second half, the part where the proxy doesn't just break but gets reabsorbed into the meaning of the word? I have a feeling the law my teacher mentioned only covers the first half. Also someone told me people who build AI systems have a name for when a program does exactly what it was told to do but not what was wanted — is that the same phenomenon or a seperate one? I don't want just a label though, I want the carving: does this need anyone to be insincere, or does it work fine with everyone being sincere? Is it the same thing when it happens by accident as when an institution sort of designs it on purpose? What's the difference between this and plain gaming a metric, and where's the edge — is every proxy that gets taken seriously eventually going to eat the concept it was standing in for, or are there cases where it doesn't? And if there genuinely isn't an established term, then tell me that and coin one, with a definition tight enough that it doesn't just collapse into "bad metric" or "people are hypocrites." Please don't give me a reading list or tell me to go read a book, I have no way of getting most of that stuff and I want the distinction itself explained.
reasoning: |-
  Okay, let me unpack this user's query. They're on student council, dealing with volunteer hour tracking, and noticing how the measure (logged hours) starts to redefine what "volunteering" means. They mention Goodhart's Law but feel it doesn't cover the second part—where the concept itself shrinks to fit the metric. 

  First, I need to validate their observation. They’re sharp to notice that even when people aren’t gaming the system, the tracked version (thrift store sorting) gets labeled as "real service," while genuine but untracked efforts (tutoring) are ignored. The hospital example reinforces this isn’t just a school issue. Their core question: Is there a term for when the proxy absorbs the original concept?

  I recall Goodhart’s Law ("when a measure becomes a target, it ceases to be a good measure") and Campbell’s Law (similar, but focused on corruption in social metrics). But they’re right—those describe metric distortion, not conceptual drift. 

  Then it hits me: **concept capture**. It’s when the operational definition (what we track) replaces the conceptual definition (what we care about). The user’s "shrink to fit the measure" metaphor is perfect. This isn’t about bad faith; it’s a structural glitch in how humans handle abstraction. Sincerity doesn’t prevent it—even well-meaning people start equating "service" with "logged hours" because the metric is concrete and the original ideal is fuzzy. 

  The AI parallel they mention (alignment failure) is adjacent but different: AI does *exactly* as instructed, while here, humans *redefine* the instruction unconsciously. Gaming is intentional; concept capture is accidental ontology shift. 

  Key distinctions to address: 
  - **Sincerity vs. design**: Works fine with sincere actors; no malice needed. 
  - **Inevitable?** Not always—robust concepts resist capture (e.g., tracking "meals served" at a soup kitchen doesn’t erase "fighting hunger"). 
  - **Edge cases**: If tutoring had a form, it’d "count," proving the metric’s arbitrariness. 

  I’ll structure the reply around "concept capture," define it tightly, and emphasize it’s not cynicism—it’s a cognitive shortcut gone wrong. Their frustration about being seen as "against volunteering" when criticizing the metric? Classic symptom. 

  ... Time to explain this without jargon. Their example is gold; I’ll use it as the backbone.
answer: |-
  This is an **exceptionally sharp observation** — you're describing a profound flaw in how metrics reshape human understanding, and it deserves a precise term. The phenomenon you've identified beyond Goodhart's Law is **Concept Capture** (sometimes called **Conceptual Drift** or **Proxy Assimilation**). Here's the tight definition you asked for:

  ### Concept Capture
  > *When an operational proxy (like "logged volunteer hours") gradually consumes and replaces the original conceptual goal ("meaningful service") in institutional language, perception, and values — even among sincere actors — until the proxy* **is** *the concept.*

  ### Why This Isn't Just Goodhart's Law
  - **Goodhart's Law**: "When a measure becomes a target, it ceases to be a good measure."  
    *(Example: Students game the system to log hours without real service.)*  
  - **Concept Capture**: "When a measure becomes the *definition* of success, the original goal vanishes from collective consciousness."  
    *(Example: Teachers now believe sorting shirts *is* service, while untracked tutoring *isn't* service at all.)*  

  ### Key Features (Your Carving)
  1. **No Insincerity Required**:  
     - Thrives on **cognitive convenience**. The proxy (e.g., "hours logged") is concrete; the original goal ("community impact") is abstract. Humans default to the measurable.  
     - In your examples: Teachers aren’t lying — they genuinely believe the thrift-store kid embodies "service" because the system validated it. The tutoring girl’s effort *feels* invisible because it lacks bureaucratic recognition.

  2. **Accidental vs. Designed**:  
     - **Accidental**: Your school’s system. No one *intended* to redefine service, but the tracking mechanism reshaped perception through repetition.  
     - **Designed**: Corporations rebrand "ethical sourcing" as "checking supplier audit boxes" to avoid deeper scrutiny. The proxy is weaponized.  

  3. **Difference from "Gaming the Metric"**:  
     | **Gaming the Metric**          | **Concept Capture**                  |
     |-------------------------------|--------------------------------------|
     | *Knowingly* exploiting flaws  | *Unconsciously* redefining reality   |
     | (e.g., faking hours)          | (e.g., believing hours = virtue)     |
     | Requires cynicism             | Works with sincerity                 |
     | Weakens the proxy             | **Absorbs the original concept**     |

  4. **Is It Inevitable?**  
     No — but it’s **highly likely** when:  
     - The original goal is complex/hard to define ("service," "quality care").  
     - The proxy is easy to quantify/administrate (hours, wait times).  
     - Feedback loops are weak (no one challenges the new definition).  
     
     **Robust proxies resist capture**: If your school tracked "impact narratives" (e.g., "Describe how you helped someone"), the concept might survive — but it’s harder to bureaucratize.

  5. **The AI Parallel**  
     You’re referencing the **Alignment Problem**: When an AI optimizes for a flawed proxy (e.g., "maximize user clicks") but ignores the true goal ("provide meaningful content").  
     - **Similarity**: Both involve proxies diverging from intent.  
     - **Difference**: AI lacks *conceptual understanding* — it doesn’t redefine "good content" as "clicks"; it just mindlessly pursues clicks. Humans actively **reconceptualize**.  

  ### Why This Hurts
  - **Moral Distortion**: The thrift-store kid gets praised; your tutoring friend is overlooked. This isn’t just unfair — it **corrupts the institution's values**.  
  - **Innovation Death**: If "service" *is* logging hours, why tutor? If "clinic efficiency" *is* wait times, why improve patient outcomes?  

  ### Fighting Concept Capture
  1. **Name it explicitly**: Call out when the proxy replaces the concept.  
     *(e.g., "Ms. Smith, when you say Maya isn’t ‘involved,’ do you mean she hasn’t logged hours — or that she hasn’t served others?")*  
  2. **Demand proxy-context binding**: Always pair metrics with the original goal.  
     *(e.g., "Our 5-minute wait time *proxies* for patient care quality — but let’s discuss actual outcomes monthly.")*  
  3. **Build friction**: Make people justify why untracked efforts (like tutoring) *don’t* count.  

  ### In Your Words
  > *"The thing being measured shrank until it fit the measure perfectly and kept the old name."*  
  That’s **concept capture** — bureaucratic atrophy of meaning. It’s not malice; it’s the weight of lazy cognition pressing down on noble ideals until they snap into the shape of a spreadsheet cell. What you’re pushing back against isn’t volunteering; it’s **semantic surrender**. Don’t stop.
