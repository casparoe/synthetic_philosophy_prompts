prompt: |-
  I'm a PhD student in political theory working on intergenerational ethics, and I'm trying to decide whether to accept the strong longtermist package: that, given the expected size of humanity's future, the effects of our actions on the very long run should dominate near-term considerations in almost every choice we face. Rather than read further into the literature, I want the specification first. Write the desiderata that a theory of the value of affecting the far future would have to satisfy for that conclusion to be warranted, with the case or consideration behind each requirement.

  Fix the purpose as follows: the theory is to serve someone who must choose, with a fixed budget, between a near-term intervention with well-understood benefits and an intervention that raises the probability that humanity survives to a vastly larger future by some small, disputed margin. Given that purpose, the list has to do at least this much work:

  Say what carries the value in the first place — the existence of future people, their welfare, or the character of the civilisation that results — and make the choice matter, since the three come apart in the case where an action slightly increases the chance of survival while slightly degrading the expected quality of the future conditional on surviving. I want that case, or a better one, placed at the centre and stated precisely enough to be reusable.

  Handle the fact that which people exist later depends on what we do now, so that most of the value produced is value for people who would not otherwise have existed; any requirement that an outcome can only be better if someone is better off will therefore do a great deal of work, and I want it made explicit whether that is a genuine desideratum or a party-line commitment of person-affecting views.

  Distinguish extinction from other permanent losses: a future permanently capped at a fraction of its potential, a future in which humanity is replaced by successors who do not value what we value, a slow decline rather than a sudden end, and a case in which the future is large but we have strong reason to think it will be bad.

  Say whether the theory must deliver determinate expected-value verdicts from astronomical stakes under severe cluelessness about flow-through effects, or whether refusing to do so is itself an acceptable answer — and mark this as negotiable or not.

  Finally, flag any pair of requirements you think cannot be jointly satisfied, since if the list is internally unsatisfiable that is the result I most want; tell me which single requirement does the most to exclude the strong longtermist conclusion; and tell me which items on the list are really just preferences of one camp that I should be free to drop. Skip scoring the standard families of views against the list — I will do that myself once I have the standard.
reasoning: |-
  Okay, the user is a PhD student in political theory focusing on intergenerational ethics. They're grappling with whether to accept the strong longtermist view that prioritizes the far future over near-term concerns. Instead of diving into more literature, they want a clear set of desiderata for evaluating theories about the value of affecting the far future.  

  First, I need to understand their main concerns. They mentioned several key points:  
  - **Value Carriers**: What exactly holds value—future people's existence, their welfare, or the civilization's character? These can conflict, especially when an action boosts survival chances but lowers future quality.  
  - **Person-Affecting Views**: How does the theory handle the non-identity problem? If future people wouldn't exist without current actions, does improving their lives count as a benefit?  
  - **Extinction vs. Other Losses**: The theory must differentiate between human extinction and scenarios like a diminished future, replacement by successors, slow decline, or a large but dystopian future.  
  - **Decision-Making Under Uncertainty**: Should the theory provide clear expected values despite huge stakes and cluelessness about long-term effects?  
  - **Internal Consistency**: Are there conflicting desiderata? Which one most challenges strong longtermism?  

  The user also wants flexibility—some items might be optional preferences, not core requirements. Their deeper need seems to be a structured framework to critically assess longtermism, possibly to identify its weaknesses. They might be skeptical and looking for robust counterarguments.  

  Now, breaking down each desideratum:  
  1. **Specification of Value Carriers (V1)** is crucial because ambiguity here leads to different conclusions. The conflict case (survival up vs. quality down) must be central.  
  2. **Non-Identity Robustness (V2)** addresses whether benefits to non-existent people matter. This is a major fault line in ethics.  
  3. **Distinction of Loss Types (V3)** ensures the theory doesn't lump extinction with other catastrophes. Each scenario has unique implications.  
  4. **Handling Cluelessness (V4)** is negotiable but pivotal. Demanding determinate answers might force oversimplification.  

  For conflicts: V1 and V2 clash if existence is valued independently of welfare. V4 might be incompatible with any theory if cluelessness is pervasive.  

  The biggest hurdle for strong longtermism? Probably V4. If we can't quantify far-future impacts, longtermist calculations collapse.  

  Optional items: V2’s requirement to accept impersonal value could be dropped if the user favors person-affecting views. V4’s demand for determinacy might be relaxed.  

  The user’s unspoken aim might be to test if strong longtermism is internally coherent or if it crumbles under scrutiny. By providing a clear standard, they can systematically evaluate theories without bias. Need to ensure the framework is neutral and rigorous.
answer: |-
  Here is a structured set of desiderata for a theory of the value of affecting the far future, designed to rigorously evaluate the strong longtermist conclusion (that long-term effects dominate near-term choices). Each requirement centers on the intervention-choice scenario you described, with explicit cases and justifications. Requirements that conflict or are optional are flagged.

  ---

  ### **Core Desiderata for a Far-Future Value Theory**
  *(Given: Fixed-budget choice between near-term intervention with known benefits vs. far-future intervention that marginally increases survival probability but may affect future quality.)*

  1. **Value Carrier Specification (V1)**  
     - **Requirement**: The theory must explicitly define what carries value:  
       (a) *Existence* of future people,  
       (b) *Welfare* of future people, or  
       (c) *Civilizational character* (e.g., achievement of justice, knowledge, beauty).  
       It must resolve conflicts between these when they diverge.  
     - **Central Test Case**: *The Survival-Quality Tradeoff*:  
       > *Action A* increases humanity’s survival probability by Δp (e.g., 0.001%), but *if* survival occurs, it yields a future with marginally *lower* expected average welfare/civilizational quality (e.g., due to locked-in authoritarian institutions) compared to a baseline survival scenario. Does A’s net effect add positive value?  
     - **Justification**: Unless the theory specifies *what* is valued, it cannot rank interventions. Strong longtermism requires that Δp-driven value overwhelms near-term effects, but this hinges on whether "more future people" or "better future" takes priority.

  2. **Non-Identity Robustness (V2)**  
     - **Requirement**: The theory must assign value to affecting the far future *even when* the beneficiaries would not have existed otherwise (i.e., it must reject "person-affecting" restrictions requiring that an outcome can only be better if it is better *for specific individuals* who exist in both outcomes).  
     - **Test Case**: *The Same-Number Non-Identity Problem*:  
       > Near-term intervention improves welfare for 10<sup>6</sup> existing people. Far-future intervention increases survival probability by Δp, creating 10<sup>20</sup> future people who would never exist otherwise. If the theory requires "better for someone" to assign value, the far-future intervention may be valueless.  
     - **Justification**: Strong longtermism typically assumes *impersonal* value (e.g., "more happy lives is better, regardless of who lives them"). Without this, astronomical future value collapses.

  3. **Loss Typology (V3)**  
     - **Requirement**: The theory must differentially value:  
       - (a) Extinction (no future subjects of value),  
       - (b) Permanently capped potential (e.g., humanity survives but at 1% of achievable scale/welfare),  
       - (c) Value discontinuity (e.g., humanity replaced by alien/machine successors with orthogonal values),  
       - (d) Slow decline (e.g., cascading collapse reducing future scale),  
       - (e) Large-but-bad future (e.g., 10<sup>20</sup> lives at near-misery levels).  
     - **Test Cases**:  
       > (i) An intervention that reduces extinction risk but increases the probability of (b) or (e).  
       > (ii) An intervention that prevents (c) but does not affect extinction risk.  
     - **Justification**: Strong longtermism often equates avoiding extinction with maximizing expected value. If (b)–(e) are disvalued similarly to extinction, or if (e) has negative value, this conclusion fails.

  4. **Cluelessness Tolerance (V4)**  
     - **Requirement**: The theory must specify whether it *requires* determinate expected-value comparisons under "severe cluelessness" (i.e., when flow-through effects of interventions on the long-term future are unknown or sign-indeterminate).  
       - **Option A**: Must yield a verdict (e.g., via dominance or stochastic dominance).  
       - **Option B**: Can remain agnostic (e.g., "too clueless to act").  
     - **Test Case**: *The Clueless Intervention*:  
       > Far-future intervention X raises survival probability by Δp, but its second-order effects on civilizational development are unknown (e.g., it may lock in beneficial institutions or accidentally enable dystopia). Near-term intervention has predictable benefits.  
     - **Justification**: Strong longtermism requires Option A to justify prioritizing long-term interventions despite uncertainty. If Option B is permissible, longtermism may be inert.  
     - **Negotiable**: Yes. This is a meta-decision about the theory’s scope.

  ---

  ### **Conflict & Critical Analysis**
  - **Key Conflict**: **V1 vs. V2**  
    If the theory demands *person-affecting* value (V2 rejects this), it cannot assign value to creating future lives (e.g., in the Non-Identity case). But if it adopts *impersonal* value (e.g., total utilitarianism), it may violate intuitions about trading off existence against quality (V1’s Survival-Quality Tradeoff).  
    **Example**: If V1 prioritizes welfare over existence, a future with more people but lower average welfare may have *negative* value, undermining strong longtermism.  

  - **Most Exclusionary Requirement for Strong Longtermism**:  
    **V3 (Loss Typology)**, specifically handling **(e) Large-but-bad future**. If the theory assigns negative expected value to such futures (e.g., via critical-level utilitarianism or negative consequentialism), extinction avoidance may be undesirable. This directly blocks the "astronomical stakes" argument.  

  - **Optional/Partisan Requirements**:  
    - **V2 (Non-Identity Robustness)**: Rejecting person-affecting restrictions is a commitment of *impersonal welfarism* (e.g., total utilitarianism). You may drop this if you endorse person-affecting views.  
    - **V4 (Cluelessness Tolerance, Option A)**: Demanding determinate verdicts under cluelessness is a *longtermist preference*. You may reject this if epistemic humility is prioritized.  
    - **V1’s "civilizational character" option**: This reflects *non-welfarist* values (e.g., perfectionism). May be dropped if welfarism is assumed.  

  ---

  ### **Summary for Your Purpose**
  A theory satisfying strong longtermism must:  
  - Define value carriers **(V1)** and prioritize existence or scale over quality/character.  
  - Accept impersonal value creation **(V2)**.  
  - Treat extinction as uniquely disvaluable vs. other losses **(V3)**, and reject negative valuation of large futures.  
  - Deliver determinate verdicts under cluelessness **(V4, Option A)**.  

  **Fatal Flaw Potential**: If **V1** demands that quality dominates existence (e.g., in the Survival-Quality Tradeoff), **V3** assigns disvalue to large-but-bad futures, or **V4** permits agnosticism, strong longtermism fails. The most tension exists between *non-identity robustness* (needed for scale-driven value) and *loss typology* (which may imply that avoiding extinction isn’t paramount).  

  Use this list to test theories (e.g., total utilitarianism vs. person-affecting views vs. critical-level theories). The Survival-Quality Tradeoff **(V1)** and Large-but-Bad Future **(V3e)** cases are likely decisive.
