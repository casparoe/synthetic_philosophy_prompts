prompt: |-
  I spent thirty-odd years as an atmospheric physicist, and since retiring I have been sitting in on a fortnightly philosophy reading group run through the university's continuing-education programme. I am the oldest person in the room by two decades and the only one who keeps trying to turn the discussion into a measurement problem. Over the past few weeks the group has been working through the contrast between reasons that are relative to an agent and reasons that are not, and I have become preoccupied by something the discussion slides over, which I cannot name and cannot tell whether anyone has named.

  The thing I keep circling is best introduced with two cases. First, a logbook from my old research group, winter of 1971, records a suspicion that a calibration standard had drifted; the note is addressed to nobody in particular and says, roughly, that there is reason for somebody to re-run the comparison before the next measurement campaign. There was. Nobody did. Everyone who could have acted on it has since retired or died, and the instrument itself was scrapped in 1989. My instinct as a physicist is that the reason has not thereby become false: like a field that has a value at a point where no particle happens to be sitting, it was defined at a place where no agent happened to be standing, and it still is. But my instinct as a novice in this subject is that a reason is the wrong sort of thing to outlive its last possible audience, and that whatever is left over is a fact about how things would have been better, not a reason. Yet that does not seem right either: what was written in the logbook was not a remark about the value of a state of affairs, it was directed at whoever turned up, and it would have licensed criticism of that person in a way that mere badness does not. Second case: a friend of mine with moderately advanced dementia still, I want to say, has reason to keep taking a particular medication, and his physician is criticisable if she lets him stop; but he is no longer capable of grasping the consideration, weighing it, or acting for it, and it is unclear to me in what sense the reason is his rather than merely about him.

  So: is there an established concept for reasons of this shape — considerations that count in favour of an action and that seem directed at someone, but that are not, or no longer, or not yet, possessed by any agent capable of being moved by them; reasons that detach from any reasoner while retaining whatever it is that distinguishes a reason from a piece of impersonal value? The distinctions I have met so far all seem to miss. The agent-relative and agent-neutral contrast concerns who a reason is a reason for in a quite different sense. The objective and subjective distinction looks like a question of whether a reason depends on the agent's beliefs and desires, which is a separate axis from whether anybody has it at all. And impersonal or agent-neutral value looks like precisely the thing I want to distinguish this from rather than identify it with. I also suspect the puzzle is lopsided: for reasons to believe, I find it unmysterious that there should be evidence for a hypothesis that no one will ever consider, whereas the practical case is the one that bothers me, and I would like to know whether that asymmetry is real or whether I am being taken in by a difference in idiom.

  If there is a term for this, I would like the concept carved rather than merely named: what exactly the phenomenon is supposed to be, how it differs from the three or four nearest candidates, whether my two cases are really one phenomenon or several — a reason whose owner is absent, a reason whose owner cannot receive it, and perhaps a third, a reason whose owner has ceased to exist, may be different animals — and where the boundary lies, that is, at what point a detached reason collapses into a plain fact about what would be better. And if there is no established name, a coined one with a definition and a pair of clean boundary cases would serve me better than a citation: I have no access to a university library and could not chase references, so I am not asking for a reading list, only for the distinction itself worked out far enough that I can take it back to the group and defend it against people who have read more than I have.
reasoning: |-
  Okay, let me approach this retired atmospheric physicist's query methodically. The user presents a sophisticated philosophical puzzle about reasons that seem to exist independently of any agent's capacity to recognize or act on them, drawing from two vivid personal cases: an unaddressed calibration note in a 1971 logbook and a dementia patient's medication need. 

  First, I need to map the conceptual landscape they're navigating. They've already identified why standard distinctions (agent-relative/neutral, objective/subjective, impersonal value) don't capture their concern. The core tension is between their physicist's intuition (reasons as field-like properties) and the philosophical instinct that reasons require potential uptake. 

  Breaking down their cases:
  - The logbook example shows a "targetless" reason - it was directed at whoever might read it, but never reached an agent. The reason persists as a criticizability condition.
  - The dementia case involves a "non-receivable" reason - the patient still has a reason in the sense that others are obligated to act on it, though he can't grasp it himself.

  I recall Parfit's work on reasons as timeless truth-relations, which could ground the calibration case. For the dementia example, Darwall's second-person standpoint explains why physicians remain accountable. The asymmetry they note between theoretical/practical reasons is real - theoretical reasons are about truth-making while practical reasons are action-guiding, creating different "attachment" conditions.

  For terminology, "unpossessed reasons" seems most precise - it avoids the ambiguity of "objective reasons" while emphasizing the lack of an agent-relation. The boundary cases should demonstrate when such reasons dissolve: e.g., if the calibration note had been proven wrong before anyone read it, or if the dementia medication became contraindicated.

  The user's physics background suggests analogies will help - like gravitational forces existing whether measured or not. Their deeper need seems to be defending this concept in their reading group, so I'll emphasize dialectical counterarguments they might face about "reason" requiring minimal rational capacity.
answer: |-
  Your intuition points to a profound and often overlooked distinction in practical philosophy: the existence of **normative reasons that are "unpossessed" yet retain their reason-giving force**. There is no universally agreed-upon term, but the concept is recognized in metaethics. I propose calling these **Detached Reasons** and will carve the concept as follows:

  ---

  ### **Definition of Detached Reasons**
  Detached Reasons are *objective, normative considerations that count in favor of an action (or attitude), but which no agent currently has epistemic or practical access to—yet retain their directive force and justify criticism of agents who could/should respond to them*.

  #### **Key Features**:
  1. **Objective existence**: They are mind-independent facts (e.g., "Medication X prevents organ failure").
  2. **Normative force**: They license criticism of agents who ignore them, even if no one *can* act on them *now*.
  3. **Directedness**: They are "for" a specific agent or role (e.g., "for whoever uses this instrument," "for the patient").
  4. **Detachment**: They persist despite:
     - No agent being aware of them (e.g., unread logbook).
     - The intended agent lacking capacity (e.g., dementia).
     - The intended agent ceasing to exist (e.g., scrapped instrument).

  ---

  ### **How This Differs from Common Distinctions**
  | Concept              | Why It Misses Your Cases                                                                 |
  |----------------------|------------------------------------------------------------------------------------------|
  | **Agent-Relative/Neutral** | Concerns *whose interests* are affected (e.g., "my child" vs. "a child"). Your cases are agent-*directed* but not necessarily interest-relative. |
  | **Objective/Subjective**   | Addresses whether reasons depend on beliefs/desires. Your cases are objective *and* detached. |
  | **Impersonal Value**       | Describes states of affairs (e.g., "less suffering is better"). Detached Reasons are *action-guiding* and *agent-directed* (e.g., "The physician *should* act"). |

  ---

  ### **Two Cases, One Phenomenon?**
  Both cases exemplify Detached Reasons but highlight different aspects:
  1. **The Logbook (Targetless Detachment)**:  
     - Reason: "Re-calibrate the instrument to avoid data corruption."  
     - Directed at: *Whoever is responsible*.  
     - Detachment: No agent received the reason, but it persists as a criticizability condition (e.g., "Had someone read this and ignored it, they’d be blameworthy").  
     - *Boundary Test*: If the logbook was destroyed before anyone read it, the reason still existed between 1971–1989—but once the instrument was scrapped, it collapsed into a historical fact ("It *would have been* better to recalibrate").  

  2. **Dementia Patient (Non-Receivable Detachment)**:  
     - Reason: "Take medication to sustain cognitive function."  
     - Directed at: *The patient and their physician*.  
     - Detachment: The patient cannot grasp the reason, but it grounds obligations *for others* (physician’s duty) and criticizability ("Stopping medication is wrong").  
     - *Boundary Test*: If the patient develops an allergy, the reason dissolves. If he regains capacity, it "reattaches."  

  **Unifying Element**: Both involve reasons that are *agent-placed* (assigned to a role/identity) but *functionally detached* due to epistemic or practical failure.  

  ---

  ### **The Asymmetry with Theoretical Reasons**
  Your intuition is correct: the asymmetry is real.  
  - **Theoretical Reasons** (evidence for beliefs):  
    Truths exist independently of agents (e.g., undiscovered evidence for a theorem). No "action" is required.  
  - **Practical Reasons** (reasons for action):  
    Require a *potential link to agency*. Detached Reasons are the minimal form of this link: they exist *for* an agent-type, creating normative "pressure" even if unfulfilled.  

  ---

  ### **Defending the Concept in Your Group**
  #### **Counterarguments and Responses**:
  - **"Reasons require a reasoner!"**  
    → *Reply*: Then why do we say, "There *was* a reason to recalibrate," not "There *would have been* a reason"? Detached Reasons explain retrospective judgments.  

  - **"This is just impersonal value!"**  
    → *Reply*: Impersonal value doesn’t ground directed criticism. We blame the *physician*, not the universe, for withholding medication.  

  - **"Unpossessed reasons are inert!"**  
    → *Reply*: Their force is counterfactual: they specify what *would* license criticism *if* an agent encountered them (logbook) or *when* they apply to a role (physician).  

  #### **A Helpful Analogy**:  
  Think of Detached Reasons like gravitational fields. The field exists whether measured or not. Your logbook reason is a "normative field" directed at a role—unmeasured, but real. The dementia case is a field affecting an object (patient) that cannot measure it, but which obligates others (physician) to respond.  

  ---

  ### **Why This Matters**
  Detached Reasons resolve tensions in:
  - **Historical responsibility** (e.g., "They *should have* acted on the logbook").  
  - **Proxy agency** (e.g., obligations toward incapacitated persons).  
  - **Epistemic humility** (e.g., reasons we *might* discover later).  

  Your cases reveal a gap in standard taxonomies. Propose "Detached Reasons" to your group as a distinct category: reasons that are *objective, directed, and criticizability-grounding*, yet *functionally orphaned*. It’s a concept worthy of the physics-trained mind—seeing normative structure where others see emptiness.
