prompt: |-
  I'm trying to work out what I actually believe about Pascal's mugging, and I'd rather start from my own reactions to individual cases than from a theory. Below are my verdicts. What I want back is a principle: stated precisely, with each clause traced to the case that motivates it. If no single principle fits them all, then give me the two or three best candidates, say which of my verdicts each one forces me to give up, and tell me which candidate you'd adopt and why. Please answer in British English, and please don't cite papers or hand me a reading list; I want the principle in your own terms.

  Stipulations. In every case the sum requested is £5, the numbers of lives are finite, and I'm assuming that a life has some fixed finite value and that I'm otherwise happy to reason in expected-value terms. Unless I say otherwise, I have no way of checking the claim and no evidence about the claimant beyond what he says.

  1. A long-established, independently audited charity that averts roughly one death per £3,000 of donations. I give the £5, and I'd defend it in expected-value terms.

  2. A stranger on a bench tells me he will torture 10^30 people in another dimension unless I give him £5. I give nothing, and I don't really deliberate.

  3. The same stranger, same manner, but the number is 10^6. I still give nothing — but the striking thing, which is the reason I'm writing this, is that I feel *less* inclined to pay in case 2 than in case 3. Since I said in case 1 that I scale linearly in the stakes, this is backwards. Either my probability that he's telling the truth is falling faster than 1/N in the number N of lives he names, or I'm not scaling linearly after all, or I'm just confused.

  4. A claimant whose power is not in question: this is a world in which a particular being has been publicly and reliably observed, over decades, to do exactly this kind of thing, and the only open question is whether today's threat is genuine. I pay the £5 at once, and I'd mortgage the house if that's what it took. So my refusal in case 2 is not discomfort with enormous numbers as such.

  5. The benefactor rather than the mugger: a stranger offers to create 10^30 flourishing lives if I give him £5, and will simply do nothing otherwise. I don't pay. But I'm noticeably *more* comfortable refusing here than in case 2, and I can't say why; if my objection in case 2 is about tiny probabilities of vast stakes, it should apply identically here, and if it's about being exploited, the threat in case 2 seems the more repeatable of the two, not the less.

  6. A crowd: a thousand people in the same park each make a 10^30-lives claim, and their claims are mutually inconsistent, so at most one is true. I pay none of them, although the sum of the expected values is astronomical. At the same time, I support public spending on mitigating existential risks, where the case rests on a disjunction of speculative scenarios, no single one of which I'd put much above one percent. I think these two attitudes are structurally the same and I can't see a difference that isn't ad hoc.

  7. The escalation: if I paid in case 2, I should expect a claimant citing 10^40 lives tomorrow. I take this as a reason in itself for a standing policy of never paying such claims — but I'm uneasy, because it looks like a reason for ignoring evidence rather than weighing it, and in case 4 I was happy to act on a great deal of evidence.

  8. The asymmetry I can't get rid of: I'll pay real money to reduce a one-in-a-million chance of human extinction, where the one-in-a-million comes from a model with some track record. I won't pay for a one-in-a-million chance at an astronomical good, and I won't pay in case 2 to avert an astronomical bad. So I seem to be discriminating on the *source* of the probability rather than its size — and case 6 suggests that the sources I trust are themselves disjunctions of speculative scenarios.

  Here is the principle I've been toying with, and which I suspect is broken. Call it the leverage discount: for any claim that N lives hang on my small act, I should discount the stakes by something like 1/N (or faster), on the ground that the space of conceivable setups in which vast stakes hang on my £5 is dominated by setups in which my act is not the real lever — I'm a simulation being run to see what I'd do, a duplicate, a decoy, a test subject, one of countless copies — and the larger N is claimed to be, the more overwhelmingly the decoy setups outnumber the real ones. Apply this discount to any claimant whose power hasn't been independently established, and case 2 and case 3 come out as refusals, while case 4, where the power is established, is untouched, and case 1, where N is small, is barely touched.

  What I'd like from you: does that principle survive my own cases, or does it over-generate — does it, for instance, quietly tell me to stop funding existential risk mitigation in case 6, or to stop reducing the one-in-a-million risk in case 8? Repair it if you can, and if you can't, say so and put something better in its place. Set it against the obvious rivals as you see them: a ceiling on how much value any outcome can have, a cutoff below which probabilities are treated as zero, a restriction of my concern to outcomes I could in principle learn about, and anything else you think is a serious candidate. Tell me which of my verdicts no candidate can save, and which you'd overturn.

  And tell me what your preferred principle says about three cases I haven't listed. First: a claimant who promises that, whether or not I pay, he will publicly and conclusively demonstrate his power tomorrow. Second: a claimant in a world where I already have strong evidence that I am one of 10^30 copies of myself facing this identical choice, so that my £5 either changes nothing or changes everything 10^30 times over. Third: a claimant who asks for no money at all, only that I talk myself into believing his claim, and says the lives are spared if I succeed.
reasoning: |-
  Hmm, the user is grappling with Pascal's Mugging scenarios and wants me to extract principles from their intuitive reactions to various cases. They've presented 8 detailed thought experiments about responding to claims involving enormous stakes (like saving 10^30 lives for £5), along with their intuitive responses and some proposed principles.

  Looking at their reactions: They pay established charities (Case 1) but refuse strangers making astronomical claims (Cases 2-3). Notably, they feel less inclined to pay for 10^30 lives than 10^6 lives - which contradicts linear scaling. They'd pay if there's prior evidence of power (Case 4), but refuse symmetrical "benefactor" scenarios (Case 5). They reject crowds making mutually exclusive claims (Case 6) despite supporting existential risk mitigation that similarly involves speculative scenarios. They worry about escalation effects (Case 7) and note an asymmetry where they'll pay to prevent extinction risks but not for astronomical goods (Case 8).

  Their proposed "leverage discount" principle suggests discounting stakes by roughly 1/N for large N, based on the idea that most scenarios where vast stakes hinge on small acts are likely decoys or simulations. I need to test this against their cases and alternatives.

  Key tensions emerge: Their aversion seems to grow with claimed stakes (contradicting linear scaling), depends heavily on the claimant's credibility, and shows asymmetry between preventing harm versus creating good. The crowd case (6) is particularly tricky as it mirrors their acceptance of existential risk mitigation.

  I'm considering several candidate principles:
  First, a "leverage discount" modified to be sensitive to evidence sources. This works for most cases but struggles with the crowd scenario and existential risk asymmetry. 

  Second, a "source restriction" principle that only considers probabilities from evidence with causal relevance to the claimed outcome. This better handles the crowd case by differentiating between correlated and uncorrelated claims.

  Third, an "epistemic access" principle that rejects claims where the outcome's truth-value is fundamentally inaccessible. This cleanly resolves simulation concerns but may over-reject.

  For their unlisted cases: The "demonstration tomorrow" claimant gets paid under source restriction; the "10^30 copies" scenario depends on whether actions are linked; and the "belief demand" fails all principles since belief can't be willfully controlled.

  The source restriction principle seems most promising as it preserves most intuitions while explaining the key difference between existential risks and mugger crowds through causal relevance. However, it does require overturning their equal treatment of Case 6 and existential risks - which I think is justified because the crowd's claims actively undermine each other's credibility.
answer: |-
  Below is a synthesised principle derived from your verdicts, followed by an assessment of your leverage discount proposal, rival candidates, and resolutions for your unlisted cases. I’ll be explicit about which clauses map to which cases, and where tensions force trade-offs.

  ### Your Principle: "Source-Weighted Expected Value"  
  *For any claim that an outcome of value V hinges on my action, I assign it positive expected value only if:*  
  **(a)** *The probability estimate stems from evidence causally connected to the claimed mechanism (Cases 1, 4, 8).*  
  **(b)** *V is not so large that it predicts the claim is optimised for exploitation rather than truth (Cases 2, 3, 5, 7).*  
  **(c)** *The claim does not rely on my belief as a direct causal factor (Case 3rd unlisted).*  

  **Trace to cases:**  
  - **(a)** explains Case 1 (audited charity: evidence tied to mechanism), Case 4 (established power: causal history), and Case 8 (extinction risk: model with track record). Rejects Case 2–3 (stranger: no causal evidence) and Case 5 (benefactor: same issue).  
  - **(b)** explains declining inclination in Case 2 vs. 3 (higher N makes exploitation more likely), refusal in Case 5 (asymmetric aversion to exploitation > opportunity), and escalation in Case 7 (paying invites worse scams). Clarifies why Case 2 feels worse than Case 3: the larger N signals higher optimisation for manipulation.  
  - **(c)** resolves the "belief demand" case below.  

  **Trade-offs required:**  
  - You must overturn **Case 6’s verdict on crowds**. The principle allows paying *one* claimant if (a) or (b) is satisfied, but you rejected all. Here, (b) applies: mutually inconsistent claims signal mutual deception (each N is optimised to trump rivals). However, it preserves your support for existential risk mitigation: those scenarios share causal evidence (e.g., asteroid models) and aren’t adversarial optimised claims.  
  - **Case 5 asymmetry** (more comfortable refusing benefactor) is upheld: (b) treats exploitation as inherently more probable than altruism for unverified strangers, as threats incentivise payment while offers invite scepticism.  

  ### Assessment of Your Leverage Discount  
  Your proposal (discount stakes by ~1/N for unverified claims) captures Cases 2–3 and 5, and avoids Case 4. But it **fails in three ways:**  
  1. **Over-generates for existential risks (Case 8):** Discounting 1/N would nullify mitigation for large-N extinction risks. Your principle excludes this via (a).  
  2. **Under-explains Case 6:** Discounting individual claims still sums to huge expected value in crowds. Source-weighting rejects this via (b): inconsistent claims indicate systemic deception.  
  3. **Misses exploitation asymmetry (Case 5):** Discounting applies equally to benefactors and muggers, but you feel more refusal-comfortable with benefactors. Principle (b) addresses this.  

  **Repair?** Incorporate (a) and (b): *Discount stakes by max(1/N, P(exploitation | N))*, where P(exploitation) rises with N and lacks causal evidence. This fixes Case 8 but not Case 6’s crowd issue—so source-weighting remains superior.  

  ### Rival Principles & Why They Fail  
  1. **"Value ceiling" (cap V per outcome):**  
     - **Fails** Case 4 (you’d pay any sum) and Case 8 (extinction stakes exceed any cap).  
  2. **"Probability cutoff" (ignore P < ε):**  
     - **Fails** Case 1 (low-probability donations still paid) and Case 8 (1-in-a-million risks matter).  
  3. **"Epistemic access" (only care about learnable outcomes):**  
     - **Fails** Case 4 (you accept unlearnable dimensions if power verified) and Case 8 (extinction outcomes are unknowable post-facto).  
  4. **"Linear EV with fixed scepticism" (assign P(truth) = k/N):**  
     - **Fails** Case 3 vs. 2 (your aversion *increases* with N, but k/N decreases scepticism) and Case 5 (same P(truth) for mugger/benefactor, but you treat them differently).  

  **Best candidate:** Source-weighting (above). It preserves 7/8 verdicts (overturning only Case 6’s crowd refusal) and explains asymmetries others cannot.  

  ### Your Unlisted Cases  
  1. **Claimant promises proof tomorrow:**  
     - **Pay £5.** Principle (a): the promise creates causal evidence (demonstration mechanism). Case 4 similarity: power verification overrides (b)’s exploitation concern.  
  2. **10³⁰ copies facing identical choice:**  
     - **Refuse payment.** Principle (b): N is inflated by duplication, not causal stakes. Your £5 likely triggers nothing (if copies pay) or negligible impact (if you’re the only payer). No exploitation, but no leverage.  
  3. **"Believe me to save lives":**  
     - **Refuse and cannot comply.** Principle (c): belief isn’t volitional, so the causal mechanism fails. Also (b): the demand optimises for unverifiability (a hallmark of exploitation).  

  ### Final Tension: Case 6 vs. Existential Risks  
  Source-weighting forces you to treat **Case 6 (crowd) and existential risks differently**, which you called "structurally the same". But the difference isn’t ad hoc:  
  - **Crowd claims** are adversarial (each claimant adjusts N to outbid others), maximising P(exploitation).  
  - **Existential risk models** are non-adversarial; evidence is shared and corrigible (e.g., asteroid tracking).  
  This justifies trusting the latter’s disjunctions. If this feels unsatisfying, it’s the sole cost of your verdicts—I’d keep it, as ad hoc rules are unavoidable here.  

  **My recommendation:** Adopt **source-weighted EV**. It systematises your intuitions with minimal friction, prioritising causal evidence and anti-exploitation heuristics. It makes you pay in crowds only if claims are non-competitive (unlike Case 6), and rejects belief-manipulation outright. The £5 stays in your pocket for strangers, but your house is mortgaged for the demonstrably real.
