prompt: |-
  Here's one I've been chewing on since last Thursday and I can't get it to let go of me. I teach the grad seminar on causation most springs (not this one, thank god) and we had a work-in-progress last week by a colleague in the department — call him Dan — whose official topic was supposed to be omissions in tort law but who spent the whole hour arguing that omissions are never causes at all. Not "rarely causes" or "causes only in a derivative sense" — never. Our visitor from the law school went slightly purple. I've reconstructed his chain below as cleanly as I can, and it's starting to annoy me that I can't locate the break.

  (1) Causal facts are norm-independent. Whether A caused B cannot depend on what anyone was supposed to do, expected to do, or obligated to do; if it did, the causal story about a death would shift around every time we changed our mind about someone's duties, which gets the direction of explanation backwards — the duties are supposed to track the causal facts, not the other way round.
  (2) Omissions aren't events. There's no thing there to push, transfer energy, or produce an outcome; if an omission causes anything it has to be by counterfactual difference-making, so: my not watering the plant caused its death iff, had I watered it, the plant would have lived.
  (3) That test is passed by absolutely everyone. For any person P who in fact never watered the plant, had P watered it, it would have lived. So every human being on earth who could have got water to that plant — including people with no connection to me, my apartment, or the plant — comes out as a cause of its death, exactly as much as I do. Dan calls this the profligacy problem.
  (4) And there's no non-normative difference to sort them by. Not probability of watering (that's epistemic, and it's the same *kind* of difference either way), not spatial proximity, not my promise to water it, not my role as its owner — promises, roles and ownership are all norms. The only features that separate my ommission from the Queen's are normative ones.
  (5) So the options are: accept billions of omissions as causes, or let norms into the causal facts. Given (1), we have to go profligate.
  (6) But profligacy isn't a theory of causation, it's a confession. A causal claim that includes every absence of every unperformed preventive act tells you nothing about how the death came about, doesn't tell you where to intervene next time, and leaves "what caused the fire?" answerable only by listing everything in the universe that nobody did. A notion of cause that can't do explanatory or intervention-guiding work isn't the notion we had.
  (7) So omissions are never causes in the sense events are. "I killed the plant by not watering it" is shorthand for three separate facts: it died, I could have prevented it, and I was supposed to. Causation drops out entirely.
  (8) Corollary he was cheerful about: there is no causal difference between the person who holds a child's head under the water and the person who stands on the bank and does nothing but could easily help. Either neither causes the death, or both do, along with everyone else on earth. The distinction between killing and letting die is purely moral, not causal.

  Now: I think (8) is false, or at least that it costs more than the whole rest of the argument is worth, and I'd rather keep (1) than give it up, since norm-dependence really does seem to me like a category mistake about causation. My own move on the day was to say Dan is conflating causation with explanation — that causation is abundant and cheap and includes all those omissions, and that it's *explanation* and *attribution* where our interests and norms do the real work, so profligacy is fine and he should just buy it. He said fine, but then "caused the death" in a criminal statute becomes either trivially true of every bystander or a disguised moral judgment, and the notion isn't doing any work in the place we actually need it. I didn't have an answer to that and I still don't.

  So: which step do I give up, and what does giving it up cost me? I want you to go through the moves rather than just tell me the right view — if (4) is where it breaks, show me the non-normative difference I'm missing; if the argument is valid and I'm just stuck choosing, tell me which premise is cheapest to surrender and what I'd have to accept about killing and letting die, or about the norm-independence of causation, once I've surrendered it.
reasoning: |-
  Okay, I see the user is grappling with Dan's argument that omissions are never causes. Dan's chain of reasoning has seven steps leading to the conclusion that omissions aren't causes, with a corollary about killing versus letting die. The user finds step (8) particularly unacceptable but wants to preserve the norm-independence of causation from step (1). They tried arguing that causation is abundant while explanation is normative, but Dan countered that this makes legal causation useless.

  Hmm, this is a deep metaphysical and legal puzzle. The user teaches causation seminars so they're clearly well-versed in this. Their frustration comes through - they've been stuck since last Thursday. What they really need isn't just "the answer" but a way to dismantle Dan's logic step by step, seeing exactly where the cost/benefit lies for each objection.

  Let me reconstruct Dan's argument first. His core move is forcing a dilemma: either accept absurd causal overdetermination (every possible preventer causes every bad outcome) or allow norms into causation. Since norm-dependence seems catastrophic (step 1), he picks profligacy, then argues profligacy is useless (step 6), so omissions can't be causes. The user's instinct is to block this by finding a non-normative filter between steps 3 and 5.

  I think step 4 is the weakest link. Dan claims there's no non-normative difference between my not watering the plant and the Queen's not watering it. But is that true? Process-based theories of causation (like Phil Dowe's conserved quantity transfer) might help. The plant died from dehydration - a physical process involving water molecules. My inaction allowed that process to complete because I was part of its actual history; the Queen wasn't. This isn't about what should have happened, but about spatiotemporal connections in the actual world. 

  For example, the chain of events: the plant had dependence on my watering schedule (I bought it, it's in my home), whereas the Queen has no such connection. When we say "my not watering caused death," we're referencing a specific disruption in an expected causal process involving me. The Queen's absence isn't part of that process at all. This uses actual difference-making rather than counterfactuals alone.

  But Dan might object: "Expected? That sounds normative!" Not necessarily - "expected" here could mean statistically regular (e.g., plants in apartments get watered by residents), not morally obligatory. Though statistics might bleed into norms... tricky. Alternatively, interventionist approaches: we fix other factors and see what changes. If we intervene to make me water it, death prevents; if we intervene to make the Queen water it... well, that intervention would require altering her location/knowledge first, which shows her omission is more distal.

  For the drowning child case: the pusher directly introduces suffocation (positive energy transfer), while the bystander's inaction just fails to interrupt an existing process (the child's lungs were already water-filled). Both are difference-makers counterfactually, but only the pusher's act initiates the killing mechanism. This preserves a causal distinction without norms - the physical initiation matters.

  The cost? We'd have to accept that causation isn't purely counterfactual; actual processes matter. That might sacrifice some elegant Humean simplicity. Also, legal application: if "cause in fact" requires being part of the actual process chain, then bystanders aren't causes, which matches legal practice. But Dan's right that counterfactual dependence remains - we'd just say it's necessary but not sufficient for causation. That's a common view! (e.g., Wright's NESS test).

  The user's explanation move still has value: even if we grant omissions are causes, we explain by relevance. But Dan's legal point bites - if causation includes all omissions, then "caused" in statutes is indeed overbroad. So better to restrict causation itself non-normatively. 

  I think I'll recommend attacking step 4 with process/invariance theories. The cost is abandoning pure counterfactualism, but that's worth it to save norm-independence and intuitive distinctions. For the user: they keep (1), accept some omissions as causes (but not profligately), and get to keep causal differences between killing and letting die.
answer: |-
  Your frustration is palpable—and justified. Dan's argument is tightly constructed, but it isn't airtight. The critical break occurs at **step (4)**, where he claims there's no non-normative difference to distinguish relevant omissions from irrelevant ones. **This is false.** I'll dismantle step (4), show how it collapses the argument, and outline the costs/benefits of this move versus alternatives.

  ---

  ### **Why Step (4) Fails: The Non-Normative Filter**
  Dan asserts that only normative features (roles, promises, duties) distinguish your omission (not watering the plant) from the Queen's omission. But **causal process theories** (e.g., Phil Dowe, Wesley Salmon) provide a purely descriptive difference grounded in *actual-world physical processes*:

  1. **Actual Causal Pathways**:  
     - The plant died due to dehydration—a physical process involving the absence of water molecules in its tissues.  
     - **Your omission**: You were part of the *actual history* of the plant's sustenance. Watering was a *recurring physical process* (water moving from your tap → plant) that sustained it. Your inaction disrupted this *established process*.  
     - **The Queen's omission**: She had no physical connection to the plant’s history. No energy/matter ever flowed between her and the plant. Her "omission" is just an abstract absence.  

  2. **Invariance Under Intervention** (James Woodward):  
     - Consider interventions on *your* actions: Holding fixed background conditions (plant location, your access), intervening to make you water it *changes the outcome*.  
     - Now intervene on the *Queen*: To "make" her water it, you must first alter her location/knowledge/intent (e.g., teleport her to your apartment). This changes too many variables—it’s not a *local intervention* on her actions alone.  
     - **Non-normative difference**: Your connection to the plant is **invariant under specific interventions**; hers isn’t.  

  3. **Statistical Relevance** (Salmon):  
     - In the actual world, plants die more frequently when their *designated caretakers* (a descriptive role, not normative) withhold water. The Queen’s inaction isn’t statistically correlated with *this plant’s* death.  

  **Cost of rejecting (4)**: You must accept that causation involves more than counterfactual dependence (step 2). Causation requires **physical processes** or **invariant relationships** in the actual world. This rules out "global" counterfactuals (e.g., "if the Queen watered it...") as causal. Profligacy dissolves.

  ---

  ### **What About Dan’s Other Steps?**
  - **(1) Norm-independence**: Preserved! Physical processes (energy transfer, conserved quantities) are mind-independent.  
  - **(3) Profligacy problem**: Solved. Only omissions tied to *actual causal pathways* (e.g., your past watering) count.  
  - **(6) Explanatory utility**: Restored. Citing *your* omission explains why *this plant* died—it pinpoints a break in its sustenance process.  
  - **(8) Killing vs. letting die**: Causal distinction restored.  
    - **Drowning child**: The pusher initiates a new physical process (force → child’s head → water inhalation). The bystander fails to interrupt an *existing* process (child struggling in water). Both may be morally blameworthy, but only the pusher *causally initiates* death.  

  ---

  ### **Objections and Replies**
  **Dan's legal challenge**: *"If 'caused' in statutes requires actual processes, isn't it still normative?"*  
  - **Reply**: No. Legal "causation in fact" *can* be descriptive:  
    - *Factual cause*: Your inaction broke a physical process required for the plant’s survival.  
    - *Proximate cause*: Here norms enter—but only to limit liability to *foreseeable* harms (e.g., not the Queen).  
    This mirrors tort law: A doctor’s failure to treat *causes* harm; a random passerby’s does not.  

  **But what about "could have prevented"?**  
  - "Could" is normative! → Not necessarily. Use **dispositional facts**:  
    - You have a *disposition* to water the plant (based on past actions). The Queen does not. Dispositions are empirical (e.g., solubility of salt).  

  ---

  ### **The Cheapest Alternatives (If You Reject Other Premises)**
  1. **Reject (1) (Norm-dependence)**:  
     - *Cost*: Causation becomes subjective. Changing duties *would* alter causal facts (e.g., if society decides parents owe no care to children, parental neglect stops "causing" harm). This guts science and law.  
     - *Benefit*: Solves profligacy (norms filter causes).  

  2. **Reject (2) (Omissions as non-events)**:  
     - *Cost*: Defies physics. Omissions lack energy/mass/force. Calling them "events" stretches metaphysics.  
     - *Benefit*: Allows omissions as causes without profligacy (if defined as "prevented actions").  

  3. **Accept Profligacy (Embrace step 5)**:  
     - *Cost*: "Causation" loses meaning (step 6). Legal statutes collapse (Dan's point).  
     - *Benefit*: Preserves pure counterfactualism (David Lewis).  

  ---

  ### **Verdict**
  **Attack step (4).** Physical processes/interventionist invariance provide a non-normative basis to distinguish omissions. This:  
  - Saves norm-independence (1),  
  - Avoids profligacy (3,5),  
  - Preserves causal differences in killing vs. letting die (8),  
  - And lets "cause" do work in law/science.  

  **Cost**: You must deny that causation is *only* counterfactual dependence (step 2). But that’s a win—most modern theories (process, mechanistic, interventionist) already do this. Dan’s argument conflates *causation* with *dependence*. Dependence is necessary but not sufficient; actual-world structure is key.  

  **Final tip**: Assign Dowe’s *Physical Causation* (2000) next seminar. Dan’s omission angst won’t survive contact with conserved quantities.
