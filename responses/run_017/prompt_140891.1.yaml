prompt: |-
  For the past three years I have been keeping a small real-money prediction market — modest stakes — for about forty people, mostly colleagues and friends from a cycling club. It began as a way of settling arguments about race outcomes and the weather, and for a long time I assumed that if a member's prices are mutually consistent, that member cannot be systematically relieved of their money. Two episodes this spring have convinced me otherwise, and a third has left me unsure what consistency is even supposed to buy you.

  In the first, a scrupulous member whose prices never contradict one another had for years treated certain outcomes as not worth pricing at all — "that won't happen" — and would happily write a ticket paying a fixed sum if such an outcome occurred, for a penny, or for nothing, since by his own reckoning he was taking money for nothing. Another member quietly bought several hundred of these tickets over eighteen months. Then one of the "impossible" outcomes occurred — a stage cancelled hours before the start because of a protest on the route — and the seller had to pay out many times what he had taken in. What I cannot get out of my head is that, at the time of each sale, nothing bad was happening by his own lights: the region of possibility from which the money eventually came was one he had simply closed off, so no outcome he took seriously ever left him worse off. In the second episode, a different member — equally coherent, and perfectly willing to revise his odds — accepts any bet he himself prices as fair, and even a slightly unfavourable one if the stake is small, for the pleasure of the wager. A third member who is simply better informed about cycling took the other side of a long series of these bets and has steadily drained him. Nothing here turns on inconsistency, yet the money moves in one direction. The two cases feel different in a way I want made precise: the first scheme could have been run by a bookie who knew nothing about cycling at all, working from a table of the victim's own published prices, and it pays no matter how the world turns out; the second requires the bookie to know something the victim does not, and it is not guaranteed at all — it pays in expectation and, over many bets, with something approaching certainty, while any individual bet could go the other way. (There is a wrinkle I find myself returning to: I put it to the victim that the mere fact of being offered a bet by a better-informed person ought to have told him something, and he found that unpersuasive.) A third pattern may or may not belong with these: several schemes people have shown me work only if the victim will stake arbitrarily large sums, or accept an arbitrarily long sequence of bets, with the guaranteed gain per round fixed and small while the stake needed to secure it grows; with a finite bankroll the bookie might well be ruined before the "sure" profit arrives. I cannot tell whether that is a separate problem or the first problem in a costume.

  I have started using my own labels — "closed-book" for extraction that follows from the victim's own prices alone, and "open-book" for extraction that requires the bookie to know more — but I would rather use established vocabulary if there is any. My nephew, who is reading philosophy, said "Dutch book" when I described the first case; but what I found under that name seemed to concern people whose odds clash with each other, so that some package of bets wins against them in every outcome, and that is not what is happening in any of my three cases, or so I believe. So: is there an established concept, or a family of concepts, for extracting money from someone who is internally consistent? If these are really three different things, I want the joints — which of them is a defect in the victim's thinking, which is merely a defect in their information, and how one could tell the two apart in practice; and I especially want to know where the line falls between a loss that is guaranteed and a loss that is guaranteed only relative to what the victim admits as possible. If there is no established term, I would be grateful for a name together with a definition sharp enough to settle borderline cases. A bare label would not help me, because what I actually need is to explain to a club committee whether any of this counts as cheating.
reasoning: |-
  Okay, the user has been running a small prediction market for friends and colleagues, and they've encountered three scenarios where even internally consistent participants lose money systematically. Let me start by breaking down each case to understand what's happening.

  First scenario: A participant dismisses certain outcomes as impossible and sells tickets for them at near-zero prices. Someone else buys these tickets, and when an "impossible" event occurs, the seller faces huge losses. The key here is that the seller didn't assign any probability to the event, so in their model, selling the ticket was free money. But by ignoring the possibility entirely, they left themselves vulnerable.

  Second scenario: A participant accepts bets they consider fair or slightly unfavorable for the enjoyment. A better-informed opponent exploits this by consistently taking the other side. The victim's probabilities are coherent, but their lack of information leads to losses over time. The user pointed out that the victim didn't update their beliefs when offered bets, which adds another layer.

  Third scenario: Schemes requiring arbitrarily large stakes or long sequences where each bet offers a small guaranteed gain, but the stake grows. The issue here is whether this is a separate problem or related to the first one.

  The user wants to know if these are recognized concepts, how they differ, and if any constitute cheating. They also need to explain this to their club committee. 

  Looking into established terms, Dutch Books typically involve incoherent probabilities leading to sure losses. The first case isn't a Dutch Book because the seller's probabilities are coherent within their model—they just excluded an event entirely. That's more about incomplete models or zero probabilities for possible events. The second case is about information asymmetry, not inconsistency. The third might relate to the first if it involves exploiting missing probabilities, or it could be about resource limitations.

  For the first case, terms like "incomplete model" or "dogmatism" come to mind. The second is classic information asymmetry. The third might be a "money pump" or relate to finite bankrolls. 

  The user needs clear distinctions: the first case is a flaw in the model (ignoring possibilities), the second is lack of information, and the third is about practical exploitability versus theoretical guarantees. 

  For the committee, explaining that the first case is exploitative due to the seller's refusal to acknowledge certain outcomes, while the second is a voluntary choice. The third is problematic if it pressures members into unsustainable stakes. 

  Also, considering the user's deeper needs: ensuring fair play in their prediction market, preventing exploitation, and maintaining trust among participants. They need terminology and frameworks to articulate these issues clearly to the committee, possibly leading to rule changes.
answer: |-
  Your observations are astute and reveal fundamental nuances in rational decision-making under uncertainty. Let's dissect each scenario using established concepts and coin precise terminology where needed:

  ---

  ### **1. The "Impossible Outcome" Case (Closed-Book Exploitation)**
  - **Mechanism**: The victim assigns **zero probability** to a possible outcome. By selling tickets for pennies (or free), they violate the **axiom of regularity**: *no possible outcome should have exactly zero probability unless logically impossible*.  
  - **Established Concepts**:  
    - **Dutch Book for Non-Probabilism**: While classical Dutch Books exploit *incoherent probabilities* (e.g., odds summing to >1), this exploits **dogmatism**—refusing to price non-logically-impossible events. It’s a subset of **incomplete markets** in decision theory.  
    - **Lindley’s Paradox**: Ignoring low-probability events can lead to catastrophic losses when they occur.  
  - **Why It’s Exploitable**: The victim’s model is **internally coherent but incomplete**. The exploiter needs no expertise—only access to the victim’s published odds and awareness of overlooked possibilities.  
  - **Label**: **Dogmatism Exploit** or **Zero-Probability Arbitrage**.  

  ---

  ### **2. The "Better-Informed Adversary" Case (Open-Book Exploitation)**
  - **Mechanism**: The victim has **coherent probabilities** but **inferior information**. Their willingness to accept "fair" bets (or slightly unfavorable ones for entertainment) allows a better-informed opponent to profit systematically.  
  - **Established Concepts**:  
    - **Information Asymmetry**: Standard in game theory (e.g., Akerlof’s "Market for Lemons").  
    - **Expected Utility Mismatch**: The victim values the *entertainment* of betting, embedding it in their utility function. This is rational *if* they derive sufficient enjoyment, but they fail to update beliefs when offered bets ("Why would someone offer this unless they know more?").  
  - **Key Distinction**: Losses are **not guaranteed** per bet but emerge over time via **statistical exploitation**. Unlike Case 1, this requires the exploiter to possess superior knowledge.  
  - **Label**: **Information Arbitrage** or **Poker Player’s Dilemma** (voluntary play against superior skill).  

  ---

  ### **3. The "Growing Stakes" Case**
  - **Mechanism**: Exploitation relies on the victim accepting a sequence of bets where:  
    - Gains per round are fixed and small.  
    - Stakes grow exponentially (e.g., doubling after each loss).  
    - Finite bankrolls risk ruin before profits materialize.  
  - **Analysis**:  
    - **If probabilities are coherent**: This resembles a **martingale betting system**—a known money-losing strategy in finite worlds. Losses are *probabilistically likely* but not certain.  
    - **If probabilities are incoherent**: It becomes a **Generalized Dutch Book**, where the bookie constructs a sequence exploiting convergence properties (e.g., forcing bankruptcy via volatility).  
  - **Relation to Case 1**: Distinct unless the sequence exploits a zero-probability belief (e.g., "I’ll never lose 10 times in a row").  

  ---

  ### **Taxonomy of the Three Exploits**
  | **Case**                   | **Flaw in Victim**              | **Exploiter’s Requirement**   | **Guarantee?**          |  
  |----------------------------|----------------------------------|-------------------------------|-------------------------|  
  | 1. "Impossible Outcome"    | Incomplete model (dogmatism)     | Victim’s odds + event space   | **Yes** (across outcomes) |  
  | 2. "Better-Informed"       | Information gap / utility quirk  | Superior information          | No (statistical only)   |  
  | 3. "Growing Stakes"        | Bankroll constraints             | Capital to force ruin risk    | No (probabilistic)      |  

  ---

  ### **Terminology Recommendations**
  - **Case 1**: **Dogmatic Dutch Book** (extending classical Dutch Books to incomplete models).  
  - **Case 2**: **Information-Based Expected Value (EV) Exploit**.  
  - **Case 3**: **Bankroll-Dependent Martingale Exploit**.  

  ---

  ### **Is It Cheating? A Framework for the Committee**
  1. **Case 1 (Dogmatism)**:  
     - **Verdict**: **Exploitative but not cheating** if the victim publicly declared odds.  
     - **Mitigation**: Require *all events* to have minimum odds (e.g., ≥1% probability) to avoid "free tickets."  

  2. **Case 2 (Information Asymmetry)**:  
     - **Verdict**: **Not cheating**. The victim chose to bet for enjoyment; the exploiter used legitimate skill.  
     - **Mitigation**: Allow "expert odds" to be flagged (e.g., "I’m 90% confident—bet at your own risk").  

  3. **Case 3 (Bankroll Stress)**:  
     - **Verdict**: **Potentially predatory**. Forcing unsustainable stakes could violate fair-play norms.  
     - **Mitigation**: Impose betting limits proportional to bankroll.  

  ---

  ### **Core Insight for the Committee**
  **Consistency ≠ Invulnerability**. Coherent probabilities prevent *logically guaranteed* losses (classical Dutch Books), but they don’t protect against:  
  - Ignoring possible outcomes (Case 1),  
  - Lacking information (Case 2),  
  - Resource limitations (Case 3).  

  **Recommendation**: Adopt rules ensuring:  
  - All events are priced (avoid dogmatism),  
  - Betting limits protect against ruin,  
  - Participants disclose expertise when offering odds.  

  These are not "cheating" but *market design failures*. Addressing them preserves the market’s integrity as a social game.
