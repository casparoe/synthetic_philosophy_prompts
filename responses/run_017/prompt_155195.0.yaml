prompt: |-
  I sit on the Charter Review Commission of a home-rule city of roughly eighty thousand residents. We meet monthly and will table our final recommendations to the city council in March; one contested item remains, and it is the one the council is waiting on: whether to extend the municipal franchise to non-citizen residents. That population is not marginal here. It includes green-card holders who have lived in the city for decades and simply never naturalized, visa holders with work authorization whose stays are open-ended, and residents without status. All of them work here, pay local sales and property taxes through rent, send children to our schools, use our transit, and are subject to our police, housing, and code enforcement.

  Three features of our situation keep the standard arguments from settling it, and I want the memo to work through them rather than around them.

  First, the commission has already passed two related amendments on preliminary votes: lowering the municipal voting age to sixteen, and making participation in municipal elections formally compulsory for registered voters, enforced by a small civil fine, with an explicit abstention option on every ballot so that no one is compelled to express a preference. So the live question is not merely whether non-citizen residents may vote, but whether they may be *required* to. Compulsory voting is usually defended as a duty members owe to their own political community; imposed on people who have not naturalized, some of whom are not permitted to, it starts to look like conscription into an obligation they never accepted. Yet exempting them appears to create a second, lesser tier of residence.

  Second, our current charter already enfranchises a group the popular all-affected-interests argument handles badly: non-resident owners of commercial property, who vote in downtown improvement district elections while living in the suburbs. Any principle we adopt should say something about them too, since a principle that saves our existing practice only by accident is not a principle.

  Third, the newly enfranchised are not a single kind of case. Some have declined membership that was available to them; some have membership withheld from them; some cannot register without creating a paper trail that exposes them to removal, so that a right they may only exercise at legal risk is close to no right at all.

  Please draft the decision memo I will circulate to the commission and then to the council. It should open with a bottom line — adopt, adopt with conditions, reject, or defer with a specific charge — together with a time frame and an implementation path. It should then state the principle it takes to govern who votes in a city, and apply that principle consistently across the groups in play: sixteen-year-olds, citizen absentees, non-citizen residents of the three kinds above, and non-resident commercial property owners. It should give the strongest version of the objection on the losing side and explain why it nonetheless loses: I have in mind the circularity worry that any existing electorate decides who counts as the people, so that an appeal to what the people want cannot ground a change in who the people are. It should also say what we should do about the compulsory-voting amendment as applied to anyone newly enfranchised, and how the recommendation should be revised if the state legislature pre-empts home-rule control of the franchise.

  Two constraints. Do not settle the question by citing turnout figures, demographic projections, or what other cities or countries have done: we will not have reliable local data before March, and comparative practice is another subcommittee's assignment. What we need is the argument, made at a level the council can vote on and the public can answer.
reasoning: |-
  Okay, the user is on a Charter Review Commission for a home-rule city with about 80,000 residents. They need to draft a decision memo about extending voting rights to non-citizen residents, which is a contested issue. The commission has already approved lowering the voting age to 16 and making municipal voting compulsory with an abstention option. So the challenge is not just whether non-citizens can vote, but whether they should be required to vote like citizens.

  The user outlined three key complications. First, compulsory voting might feel like conscription for non-citizens who never chose citizenship, but exempting them creates a two-tier system. Second, the current charter already allows non-resident property owners to vote in some elections, which complicates the "all affected interests" argument. Third, non-citizen residents aren't a uniform group—some could naturalize but didn't, some can't, and undocumented residents risk deportation if they register.

  The memo needs a clear bottom line, a governing principle for who votes, consistent application to all groups (16-year-olds, absent citizens, different non-citizens, non-resident owners), and a response to the circularity objection. It also must address how compulsory voting applies to new voters and what to do if the state pre-empts the decision.

  The user emphasized avoiding turnout data, demographics, or comparisons with other places. They want a principled argument understandable by the council and public. The memo should be structured with a recommendation, principle, application, counterargument response, and implementation.

  I think the core tension is balancing civic obligation with consent. Compulsory voting for non-citizens might overreach, but exemptions undermine equality. The principle of "enduring stake" could work—focusing on those bound by local laws and contributing long-term. This includes 16-year-olds (affected by policies), excludes non-resident owners (minimal stake), and covers non-citizen residents (integrated into community). For compulsory voting, it should only apply to those who can safely participate, meaning exemptions for undocumented residents due to legal risks.

  The circularity objection—that the current electorate decides who the people are—can be countered by framing the charter as a foundational document that should reflect the city's inclusive identity. The commission's role is to propose updates aligning with this evolving identity, making the process deliberative rather than self-serving.

  For the recommendation, I'll propose adopting non-citizen voting with conditions: compulsory only for those who can participate safely, and excluding non-resident owners. If the state pre-empts, the commission should reaffirm the principle while complying. The memo should be clear and principled, ready for debate.
answer: |-
  ## MEMORANDUM

  **To:** Charter Review Commission Members  
  **From:** [Your Name], Commission Member  
  **Date:** January 15, 2025  
  **Subject:** Recommendation on Municipal Franchise Extension to Non-Citizen Residents  

  ---

  ### I. BOTTOM LINE RECOMMENDATION
  **Adopt** the extension of the municipal franchise to non-citizen residents who meet residency requirements, **with the following conditions**:  
  1.  **Exempt non-citizen residents from compulsory voting** provisions due to foundational consent concerns.  
  2.  **Exclude non-resident commercial property owners** from future franchise expansions, subject to separate charter review.  
  3.  **Implement robust voter confidentiality safeguards** to protect undocumented residents from legal exposure.  

  **Time Frame & Implementation**:  
  - Final Commission vote: February meeting.  
  - Council adoption deadline: April 30, 2025 (allowing 30 days for public comment post-Commission submission).  
  - Implementation: For the November 2025 municipal elections, contingent on:  
    - Development of secure, confidential registration protocols by the City Clerk (by July 2025).  
    - Public education campaign clarifying rights/responsibilities (launch May 2025).  

  ---

  ### II. GOVERNING PRINCIPLE: THE ENDURING LOCAL STAKE  
  **Those subject to a community’s binding authority, who bear its obligations and share its everyday life with an enduring stake in its future, constitute its electorate.**  

  This principle prioritizes:  
  - **Subjection to Authority**: Being governed by local laws (police, zoning, schools, transit).  
  - **Enduring Stake**: A tangible, ongoing connection to the city’s well-being beyond transient interests.  
  - **Bearing Local Burdens**: Contributing through taxes, labor, or civic participation.  

  It rejects:  
  - Citizenship *alone* as the prerequisite for local voice.  
  - Mere financial interest (e.g., absentee ownership) as sufficient for political membership.  

  ---

  ### III. CONSISTENT APPLICATION OF PRINCIPLE  

  | Group                      | Application of Principle                                                                 | Franchise Recommendation                                |
  | :------------------------- | :--------------------------------------------------------------------------------------- | :------------------------------------------------------ |
  | **16-Year-Old Residents**  | Subject to laws (truancy, curfew); bear future burdens (climate, debt); use schools/transit; work/pay local taxes. Enduring stake evident. | **Enfranchised** (Already adopted). Compulsory voting **appropriate** (fostering civic habit). |
  | **Citizen Absentees**      | Not subject to daily authority; lack enduring stake in local outcomes; burdens/responsibilities minimal. | **Not Enfranchised** (Status quo). Principle supports exclusion. |
  | **Non-Resident Commercial Owners** | Bear economic burdens but not subject to most local authority (police, schools, transit); stake is primarily financial/profit-driven, not communal. | **Discontinue Franchise** (Requires separate charter amendment). Principle renders current practice inconsistent. |
  | **Non-Citizen Residents (All Types)** | **Core Case**: Subject to all local authority; pay taxes (sales/property via rent); use services; bear burdens; share communal life; possess enduring stake regardless of federal status. | **Enfranchised**. Principle demands inclusion.          |
  | **→ Withheld/Limited Citizenship** | Enduring stake unchanged by federal barriers to naturalization. Consent to *local* polity distinct. | **Enfranchised**. Exemption from compulsory voting (see IV.A). |
  | **→ Declined Citizenship** | Enduring stake remains. Choice not to naturalize ≠ rejection of local ties/obligations. | **Enfranchised**. Exemption from compulsory voting (see IV.A). |
  | **→ Undocumented Residents** | Enduring stake *most* acute (deeply embedded, high vulnerability to local authority). Legal risk creates unique burden. | **Enfranchised**. **Exempt from compulsory voting** + **critical confidentiality protocols**. |

  ---

  ### IV. ADDRESSING KEY OBJECTIONS  

  **A. Objection: Compulsory Voting as "Conscription" for Non-Citizens**  
  *Strongest Version*: Compulsory voting is a duty of membership. Non-citizens, especially those who *could* naturalize but haven’t or those barred from doing so, never consented to this membership. Imposing it is coercive and undermines the civic reciprocity at compulsory voting’s core. Exemption creates a justified "second tier" reflecting this foundational difference.  

  **Why It Loses (Partially)**:  
  1.  **The Enduring Stake Demands Voice, Not Necessarily Obligation**: While subjection to authority justifies the *right* to vote (a shield against oppression), the *duty* to vote (a sword of collective action) presumes prior consent to the polity’s foundational structure. Non-citizen residents consent to *residence* and its attendant obligations, not necessarily to the full political identity assumed by compulsory voting.  
  2.  **Practical Distinction**: Exemption acknowledges this difference without negating the validity of their stake or voice. It avoids the untenable coercion of those who never sought full political membership or who face severe risks.  
  3.  **Coherence**: Applying compulsory voting only to citizens (and new 16/17 y.o. citizens) maintains the link between the duty and the specific political community defined by national citizenship, *for purposes of this specific obligation*. Their equal enfranchisement for the *act* of voting affirms their equal stake in local outcomes.  

  **Recommendation**: Exempt all non-citizen residents from compulsory voting requirements. Maintain compulsory voting for citizen residents aged 16+.  

  **B. Objection: Circularity of the Electorate ("Who decides the People?")**  
  *Strongest Version*: Any definition of "the people" is decided by the existing electorate. Expanding the electorate based on a principle appealing to "what the people want" or "who is affected" is inherently circular. The current citizen electorate *is* the people; changing its composition is an act of power, not principle, by that group.  

  **Why It Loses**:  
  1.  **Charter as Foundational, Not Majoritarian**: The Commission’s role is not merely to reflect the current electorate’s transient preferences, but to deliberate on the *foundational rules* defining the political community for the future, guided by reason and principle. The Charter exists above ordinary politics.  
  2.  **Principle Precedes the Current Electorate**: The "Enduring Local Stake" principle is offered as an objective criterion for inclusion *in* the foundational document. It is not derived from a poll of current voters but from the nature of municipal governance and community. The current electorate can choose to adopt a more just and coherent foundational rule.  
  3.  **Avoiding Stasis**: Accepting strict circularity would freeze the electorate permanently, forbidding any expansion (e.g., to 16-year-olds, women, non-property owners) unless approved by those originally empowered – an unjustifiable position. The Commission must propose principled change.  

  ---

  ### V. CONTINGENCY: STATE PRE-EMPTION  
  If the state legislature pre-empts home-rule control of the municipal franchise:  
  1.  **Recommendation Stands as Statement of Principle**: Submit the full rationale to the Council and public, affirming the city’s commitment to the "Enduring Local Stake" principle.  
  2.  **Advocate for Home-Rule Authority**: Charge the Council to actively lobby against pre-emption, using this memo’s reasoning.  
  3.  **Explore Legal Challenges**: Recommend the Council seek Counsel’s opinion on the constitutionality of pre-emption if enacted.  

  ---

  ### VI. CONCLUSION  
  Extending the franchise to non-citizen residents is demanded by the core reality of their lives: they are governed here, they build their lives here, they contribute here, and they bear the consequences of local decisions here. The "Enduring Local Stake" principle provides a coherent, defensible basis for inclusion that justifies enfranchising 16-year-olds and non-citizen residents, while revealing the inconsistency in continuing the franchise for non-resident commercial property owners. Exempting non-citizens from compulsory voting respects the distinct nature of their relationship to the national political community while fully affirming their rightful place in determining their local community’s future. This recommendation strengthens the legitimacy and inclusivity of our municipal democracy.  

  **Recommendation:** Adopt as outlined.
