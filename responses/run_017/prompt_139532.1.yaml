prompt: |-
  I work in a small analytical unit inside my country's national statistics office, and I'm doing a part-time master's in public policy, so I keep meeting the same puzzle from two directions at once. My government has just written a well-being objective into its budget framework, openly modelled on the World Happiness Report. The headline number is the mean answer to the Cantril ladder question — picture a ladder on which the best possible life for you is ten and the worst is zero, and say where you stand today — averaged over three years of about a thousand respondents annually. The statutory target is not a level or a threshold but a rank: top twenty within ten years. Ministries now bid for funding by costing proposals in well-being-adjusted life years, one point of ladder score for one person for one year, and the treasury ranks bids by cost per unit, so a cheap intervention producing a small gain for a very large number of mildly dissatisfied people beats an expensive one that rescues a far smaller number of people in deep misery. My colleagues treat that trade-off as obvious arithmetic and I can't see why it is. Three further features strike me as odd. First, what gets measured is a reflective judgement about one's life rather than anything about how life feels from moment to moment, even though our survey also asks about yesterday's laughter and worry, and in pilots the two move in opposite directions. Second, the counted population is residents aged fifteen and over: a programme aimed at children is scored only through the answers of the adults around them, people who arrived last year count fully in the average, our own emigrants vanish from it, and nobody beyond the border is counted however much our trade or emissions policy affects them. Third, the same government's health service allocates using quality-adjusted life years with a severity weighting that gives extra weight to the worst off, so the two halves of the state seem to disagree about whether it is total welfare or the condition of the worst off that matters.

  What I want is the implicit theory, reconstructed rather than asserted. What view of well-being does benchmarking a country on mean life evaluation presuppose — about whether well-being is a judgement, an experience, a state of the person, or something about the fit between a life and what its owner wants — and about whether such a thing is comparable across persons and across cultures on one zero-to-ten scale at all? What does targeting a *rank* presuppose that targeting a level does not, given that a rank can be gained by other countries falling and lost while everyone improves? What does cost-per-unit allocation presuppose about aggregation, about whether gains to different people simply add up, and about time and people not yet born? And what view of the political community is carried by the choice of resident adults as the counting unit? Alongside that, I'd like the negative part: which of these commitments does the practice strictly require, which does it merely sit comfortably with, and where is it underdetermined, so that several quite different theories of well-being and of distribution would equally license it and adopting it commits us to less than it appears to? If, say, a hedonic, a desire-satisfaction and an objective-list theorist could all sign up to most of this apparatus, I'd like to know which features would separate them and which would not.

  A few requests about how you answer. Please lead with your bottom line in the first sentence and then give the reasoning, with no preamble and no restatement of my question. Where your reconstruction rests on a contested claim in philosophy or in survey methodology, mark it as contested and tell me how confident you are and what would settle it, rather than presenting the tidy version as received wisdom; I'd also like to know which of my three puzzles you think is the deepest and which is really a measurement problem in disguise. And if the whole framing is confused — if what a practice presupposes isn't a well-defined question here, or if two of my puzzles are the same puzzle, or if the trade-off I find puzzling is genuinely just arithmetic — please say so plainly instead of working through each item politely in turn.
reasoning: |-
  Okay, the user works in a national statistics office and is doing a master's in public policy. They're grappling with how their government has adopted a well-being target based on the World Happiness Report. The core metric is the average Cantril ladder score, with a goal to be in the top 20 countries within ten years. Funding decisions are made using well-being-adjusted life years (WALYs), prioritizing interventions that provide small gains to many people over those that help fewer people in severe distress. The user has three main concerns: the focus on life evaluation over emotional experience, the inclusion criteria (resident adults only), and the inconsistency with the health sector's severity-weighted QALYs.

  First, I need to reconstruct the implicit theory behind this approach. The Cantril ladder measures reflective life evaluation, implying well-being is a cognitive assessment rather than momentary affect. This aligns with life satisfaction theories, contested by hedonists who argue for experiential metrics. The ranking target suggests relative standing matters more than absolute levels, which could stem from positional concerns or political messaging. The cost-per-WALY approach assumes additive aggregation, where each unit of well-being is interchangeable, regardless of who receives it. This contrasts with prioritarian or sufficientarian views, especially since the health sector uses severity weighting. The resident adult criterion reflects a statist view of political community, prioritizing current citizens and excluding children, immigrants, and those affected by external policies.

  The user also wants to know which commitments are essential versus compatible with multiple theories. Additive aggregation is central to WALY allocation but conflicts with health QALYs. The life evaluation metric is necessary but could be combined with affect data under some theories. The ranking target might be flexible, serving political rather than philosophical goals. The resident adult focus is a policy choice that could align with various theories by adjusting the unit of concern.

  The deepest puzzle is likely the aggregation method. It's philosophically significant because it rejects priority to the worst off, conflicting with Rawlsian or prioritarian ethics. The exclusion of children and externalities is a measurement/policy issue, as it involves defining the population but doesn't challenge the well-being concept itself. The affect vs. evaluation tension is a measurement problem—designing surveys to capture both and deciding which to prioritize.

  In the response, I'll clearly state the bottom line upfront: the practice assumes life evaluation is additive and comparable, with a statist community view. Then break down each presupposition, mark contested areas, and address the puzzles. Highlight that the WALY approach strictly requires additive aggregation, conflicting with health policies, while other elements are more flexible. Emphasize that the aggregation conflict is the deepest philosophical issue, while exclusion is a measurement problem.
answer: |-
  The implicit theory reconstructs well-being as a **cardinally measurable, interpersonally comparable, and aggregatable life evaluation**, presupposing a statist political community focused on current resident adults, with efficiency prioritised over distributional equity in resource allocation.

  **Reconstructed Presumptions & Their Contestation:**  
  1.  **Well-being as reflective life evaluation (not affect):**  
      • *Presupposes:* Well-being is primarily a cognitive, global judgement about one's life circumstances relative to one's aspirations (akin to life satisfaction theories). This is seen as a stable, meaningful summary metric.  
      • *Contested:* Hedonists (e.g., Bentham, Kahneman) argue momentary affective states ("experiences") are primary. The pilot data showing affect and evaluation moving oppositely suggests they capture distinct phenomena (*Contested measurement*: Whether the ladder validly proxies "true" well-being is unresolved; longitudinal multi-method studies could clarify causality. Confidence: Moderate that they differ; Low that the ladder is uniquely "correct").  
      • *Commitment Level:* **Strictly required** for *this specific metric*. The practice *could* use affect, but it doesn't.  

  2.  **Targeting a rank (not level):**  
      • *Presupposes:* Relative international standing is the politically salient goal, implying well-being is positional or that policy success is defined competitively. It avoids committing to absolute thresholds and adapts to global shifts (e.g., inflation, pandemics).  
      • *Contested:* Prioritising rank over absolute gain could incentivise policies harming others ("beggar-thy-neighbour") or accept domestic stagnation if others decline. A level target would imply well-being has intrinsic absolute value.  
      • *Commitment Level:* **Sits comfortably** with various theories. It's a political/pragmatic choice, not a deep philosophical commitment. Utilitarians, prioritarians, etc., could accept it as an operational target.  

  3.  **Cost-per-WALY allocation (additive aggregation):**  
      • *Presupposes:*  
          - *Cardinality & Comparability:* A 1-point ladder gain for Alice equals a 1-point gain for Bob, anywhere on the scale (0-10 is a true interval scale).  
          - *Additivity:* Well-being gains are summable across individuals ("Total WALYs"). A small gain for many outweighs a large gain for few if aggregate WALYs are higher.  
          - *No Priority to the Worst Off:* Gains are valued equally regardless of baseline misery (rejects prioritarianism/sufficiency).  
          - *Impatience & Exclusion of Future Generations:* Only current gains count; discount rate is effectively infinite beyond the 3-year average.  
      • *Contested:* This is **classical utilitarianism**. It clashes with:  
          - *Prioritarianism* (Parfit): Gains to the worse off matter more.  
          - *Sufficientarianism* (Frankfurt): Priority should be on lifting people above a threshold.  
          - *Non-Aggregation Views* (e.g., Taurek): Saving many from minor harm doesn't necessarily trump saving few from catastrophe.  
          - *Comparability Skepticism* (Robbins): We can't know if Alice's "5" equals Bob's "5". (*Contested philosophy/measurement*: Cardinal comparability is assumed but not proven; psychometric scaling studies show ordinal robustness but cardinal assumptions are pragmatic. Confidence: Low for strong cardinality; Moderate for rough comparability.)  
      • *Commitment Level:* **Strictly requires** additive aggregation and cardinal comparability. This is the core arithmetic trade-off. The conflict with health QALYs (which weight severity) reveals an institutional inconsistency: the state *isn't* committed to a single distributive principle.  

  4.  **Political Community (Resident Adults ≥15):**  
      • *Presupposes:* The relevant "polis" is constituted by *current resident adults*. Obligations diminish sharply at borders and exclude:  
          - Children (<15): Their well-being is instrumentalised via adult perceptions.  
          - Emigrants: Cease to be members.  
          - Foreigners Affected: No standing, regardless of causal responsibility.  
          - Future Generations: Excluded by the time frame.  
      • *Contested:* Challenges cosmopolitan views (obligations extend beyond borders), intergenerational justice (future people), and views prioritizing children's intrinsic well-being.  
      • *Commitment Level:* **Sits comfortably** with statist/contractarian theories. Alternative units (e.g., all affected people) are compatible with the *apparatus* but rejected by *this policy choice*.  

  **Which Theories Fit? Divergence Points:**  
  • **Hedonist:** Rejects (1). They'd demand affect metrics (laughter/worry) be primary. The pilot data *opposing* evaluation is their evidence.  
  • **Desire-Satisfactionist:** *Could* accept (1) if the ladder proxies desire fulfillment. Might question (3) if desires are non-cardinal or non-comparable.  
  • **Objective List Theorist:** *Could* accept (1) if evaluation incorporates objective goods. Likely rejects (3) if their list includes distributional fairness (e.g., Rawls) or rights violations (helping many can't override rescuing the desperate).  
  • **Common Ground:** All *could* accept the *form* of the apparatus (metrics, cost-effectiveness) *if* their preferred well-being definition & unit were plugged in. The key divergence is **what constitutes well-being (affect/evaluation/desires/objects) and how gains to different individuals should be weighed (additive/prioritarian/sufficientarian)**.  

  **Your Puzzles & Their Depth:**  
  1.  **The Trade-off (Arithmetic but Not Obvious):** It *is* arithmetic **if** you accept the presuppositions: cardinal comparability & additive aggregation. The puzzle arises because you (and many philosophers) *reject* those presuppositions. **This is the deepest puzzle**, exposing a core ethical conflict (utilitarianism vs. alternatives) masked as math.  
  2.  **Evaluation vs. Affect:** Primarily a **measurement/definition problem**. It reveals contestation over what well-being *is*, but the policy choice of metric isn't incoherent—it explicitly favors evaluation.  
  3.  **Resident Adult Focus:** A **political community definition problem**. Significant, but less philosophically fundamental than aggregation (Puzzle 1) or the nature of well-being (Puzzle 2).  
  4.  **Health vs. Well-being Allocation:** A symptom of **inconsistent distributive principles** across government, stemming directly from Puzzle 1 (additive WALYs vs. severity-weighted QALYs).  

  **Bottom Line on Underdetermination:** The practice strictly requires **additive aggregation of cardinal life evaluations**. Everything else—the focus on rank, exclusion of children/foreigners/future generations, even the choice of life evaluation *over* affect—is a policy choice compatible with multiple theories (though contested by some). Adopting this framework commits you less to a *specific* well-being theory than to **utilitarian cost-effectiveness at the point of allocation**. The deepest tension is between this unacknowledged utilitarianism and the prioritarianism implicit in health policy.
