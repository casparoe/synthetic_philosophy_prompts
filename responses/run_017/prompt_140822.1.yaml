  ### Decision Procedure Desiderata Table

  | Requirement | The case it's there to handle | Non-negotiable or camp preference | What it kills | Collides with |
  |-------------|-------------------------------|-----------------------------------|--------------|--------------|
  | **Bounded agent guidance** | Grantmaker chooses between: (A) 1% chance of enabling infinite utopia (infinite future lives saved), or (B) certainty of curing 10^6 people of disease. Must advise without comparing infinite sets directly. | Non-negotiable | Infinitarian paralysis (views that say all choices are equally good/bad when infinity looms) | Avoid fanaticism (if infinite chance dominates) |
  | **Drip-world compatibility** | Ever-expanding civilisation: finite people at each century, but new lives created endlessly. Must evaluate policies affecting growth trajectories (e.g., speeding up settlement). | Non-negotiable | "Block universe" theories requiring pre-existing infinite sets (e.g., some multiverse aggregations) | Granularity invariance (if time-carving affects value) |
  | **Granularity invariance** | World A: each of ∞ persons has wellbeing 1. World B: each has wellbeing 2. Recarve B by merging pairs into "meta-persons" with wellbeing 4—B must still rank higher. | Non-negotiable | Average utilitarianism, density measures (e.g., value = lim sup of averages) | Drip worlds (if repartitioning time-chunks flips judgements) |
  | **Non-collapse of value** | In an infinite world with baseline suffering, adding a hospital that reduces 10^12 lives' pain by 10% must register as non-trivial, even if "total value" stays infinite. | Non-negotiable | Standard total utilitarianism (declares all finite changes irrelevant) | — |
  | **Graceful degradation under uncertainty** | Grantmaker estimates 1% chance of infinite future. Procedure must not abruptly switch from "ignore infinity" (if p=0) to "only infinity matters" (if p>0). | Camp preference (pragmatic longtermists) | Strict expectiminimax (fanaticism when p>0), myopic finitism (ignores p>0) | Avoid fanaticism (if p>0 forces fanaticism) |
  | **Avoid fanaticism** | Option: 1 in 3↑↑↑3 chance of infinite utopia. Alternative: certainty of averting a nuclear winter killing 10^9. Must not always demand gambling on infinity. | Camp preference (anti-fanatic consequentialists) | Orthodox expected utility (prioritizes any p>0 of ∞ value) | Bounded agent guidance (if infinity forces gamble), graceful degradation (if p>0 mandates fanaticism) |

