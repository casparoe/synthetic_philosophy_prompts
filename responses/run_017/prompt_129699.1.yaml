  Okay, let me start by unpacking the user's query. They're teaching *Never Let Me Go* in an undergrad module on markets and morals, paired with philosophical texts on repugnant markets. The user is puzzled because the novel doesn't fit the standard commodification arguments—no sales, prices, or contracts. Clones are reared for donation, and Hailsham's defense is that it was the humane option. The user wants to explore where the novel locates the wrong, using their distinction between transaction-centered and institution-centered objections.

  First, I need to test this distinction against the novel. The user asks which scenes support institution-centered objections and if any need transaction-centered ones. Miss Emily's defense is key: she argues that treating clones well shows respect, similar to market defenders saying selling kidneys can be respectful. Does the novel undercut this? 

  Looking at the Gallery subplot—art taken to prove clones have souls. This seems central. The clones' inner lives are used to justify the system, turning their creativity into a tool for their oppression. That's institution-centered; the wrong is in the system's structure, not transactions. 

  Then there's Tommy's deferral quest. He and Kathy believe in a rumored deferral for true love, leading Tommy to create art to prove their love. But the deferral doesn't exist—it's a cruel parody of a market. A real market might offer choice, but here, the clones have no agency. Their hope is manipulated, highlighting the institution's control. 

  The user also mentions the novel's themes of mortality and the meaning of life, warning against forcing it into commodification. I should address where the novel resists this frame. Ishiguro focuses on how the clones internalize their fate, their quiet resignation. The horror isn't just the system but their acceptance of it. This adds depth to the commodification debate by showing how dehumanization works psychologically. 

  Miss Emily's defense: she claims Hailsham was humane. But the novel shows that even "good" treatment within an unjust system is complicit. The art program, meant to humanize, becomes part of the exploitation. This undercuts the idea that respectful treatment justifies the system. 

  So, the novel primarily supports institution-centered objections. Scenes like the Gallery and deferral highlight structural wrongs. Transaction elements are absent or parodied, showing that the core issue isn't exchange but the institution itself. 

  The novel adds to the debate by illustrating the psychological impact of commodification—how victims internalize their roles. Philosophical arguments might miss this lived experience. The clones' lack of resistance underscores the horror, making the moral wrong more palpable than abstract arguments. 

  In conclusion, while the novel isn't a polemic, it enriches commodification discussions by showing the systemic and psychological dimensions, beyond transactions.
answer: |-
  Your approach is sharp—*Never Let Me Go* resists easy alignment with standard commodification arguments precisely because the *transaction* is absent. The horror lies in the **institutional structure** and its **psychic effects**, making it a profound case study for institution-centred objections. Let's test your distinction and unpack the layers:

  ### Where the Novel Locates the Wrong: Institution-Centred vs. Transaction-Centred
  1.  **Institution-Centred Objections Dominate:**
      *   **The Very Existence of Hailsham/Nurseries:** The fundamental wrong is the creation of a class of humans bred solely as spare parts. Their origin, purpose, and fate are predetermined by the institution. Scenes supporting this:
          *   **Madame's Revulsion:** Her visible horror at the children ("like spiders") isn't about a sale; it's about their *nature* and *purpose* within the system. She recoils from what they *are* – living organ farms.
          *   **The Purpose of Education:** Hailsham's art program, poetry, and "guardians" aren't kindness; they're revealed as tools for the Gallery project – proving the clones have souls *to justify the system to outsiders*, not to enrich the clones' lives for their own sake. The humane treatment is instrumental, not intrinsic.
          *   **The "Completion" System:** The clones' lives are structured around donation as an inevitable biological destiny, not a choice. There's no negotiation, only a predetermined path ending in death. The horror of "completion" stems from its institutional inevitability.
          *   **The Closed World:** The clones' isolation reinforces their status as *resources* separate from "normal" humanity. Their limited horizons (Cottages, donations) are built into the institution.

  2.  **The Absence of Transaction-Centred Objections & Their Parodic Shadow:**
      *   **No Sale, No Bargain:** Crucially, clones never *consent* to donation for compensation. They are never offered a price. Their bodies are simply *used* by the state/institution. This voids standard "repugnant market" arguments about degrading sales, exploitation via unequal bargaining power, or expressively equating persons with commodities *at the point of exchange*.
      *   **The Deferral Rumor as Parody:**
          *   Tommy and Kathy's quest *mimics* a market transaction: They believe they have something valuable (proof of true love via art) to trade for a desired good (deferral). Tommy frantically "produces" drawings as "payment."
          *   **Why it Parodies a Market:** The "market" is illusory. There's no price list, no seller offering deferral, no mechanism for exchange. Miss Emily reveals the deferral never existed. It was a cruel fantasy.
          *   **What a Real Market *Couldn't* Give (and What it Reveals):** A real market would imply **agency and ownership**. Clones could potentially *choose* to sell (or not sell), set a price, negotiate terms. The deferral farce highlights their *total lack of agency*. They don't own their bodies, their art, or their futures. They can't *offer* anything because they possess nothing to trade. The institution owns them entirely. The parody exposes the clones' desperate grasp for *any semblance of control*, which a market might theoretically offer but is utterly denied by the institutional reality.

  ### Undercutting Miss Emily's Defence (and the "Respectful Treatment" Argument)
  *   **Her Argument:** Hailsham showed clones *could* have rich inner lives and be treated humanely, thus the system *can* be compatible with respecting their humanity ("better lives").
  *   **How the Novel Undercuts It:**
      1.  **Instrumentalization of Humanity:** The very things meant to prove their humanity (art, poetry, care) were primarily *tools* for the institution (the Gallery) to legitimize itself. The "respect" was performative, aimed at external observers, not an end in itself for the clones.
      2.  **The Limits of "Humane" Exploitation:** Even the "best" treatment within an inherently exploitative structure doesn't negate the core wrong. Giving Kathy, Tommy, and Ruth art classes and dormitories doesn't change the fact their lives are pre-scripted to end violently as organ sources. The "humane" veneer makes the underlying horror *more* insidious, not less.
      3.  **Passive Acceptance as Horror:** The clones' relative lack of rebellion isn't proof of consent or satisfaction; it's a result of profound conditioning and limited horizons. Their quiet acceptance of "completion" is the ultimate indictment of the system – it has successfully framed their destruction as their natural purpose. This internalized dehumanization is far worse than overt brutality.
      4.  **The Failure of the Gallery:** The Gallery ultimately *failed* to convince the public/sustain Hailsham, proving that proving "souls" wasn't enough to overcome the fundamental repugnance of the *institution* itself, even without transactions. The wrong is deeper than perceived lack of soul.

  ### The Gallery: Loading the Dice or Core Argument?
  *   **It's Core Argumentative Work:** The Gallery isn't just irony; it crystallizes the institutional wrong. The system *requires* denying the clones' full humanity to function (they are "less than human" resources). Yet, the institution *simultaneously needs* proof of their humanity (souls) to placate the conscience of those enabling it. This creates a vicious circle:
      *   Clones create art expressing inner life.
      *   The institution confiscates/seizes this art (no consent, no ownership).
      *   The art is used to *argue* clones have souls and thus *deserve* humane treatment *within the very system that denies their fundamental human right to life and bodily autonomy*.
      *   This "proof" justifies continuing the system of exploitation. The clones' inner life becomes fuel for the machine that grinds them up. The wrong is the *institutional co-option* of their humanity to serve its inhuman purpose.

  ### Resistance to the Commodification Frame & What the Novel Uniquely Adds
  *   **Resistance:**
      *   **Focus on Mortality & Meaning:** Ishiguro's primary concern is existential. The clones' tragedy is a heightened metaphor for *all* human mortality. Their quest to understand love, art, memory, and "what their lives amounted to" mirrors the human condition. Forcing *only* a commodification reading misses this profound universal resonance.
      *   **Atmosphere over Polemic:** The horror is conveyed through haunting melancholy, subtle dread, and the clones' passive acceptance, not explicit moralizing about markets. The power lies in the *felt experience* of their truncated lives.
      *   **Beyond Economics:** The novel explores psychological mechanisms of coping, denial, and the construction of meaning within constraint, areas often peripheral to dry commodification debates.
  *   **What it Uniquely Adds to the Debate:**
      1.  **The Horror of Non-Market Commodification:** It starkly reveals that commodification's core wrong – treating persons as usable resources – doesn't *require* a market transaction. State-sanctioned, non-consensual institutional appropriation can be equally (or more) dehumanizing.
      2.  **The Psychology of Internalized Exploitation:** It masterfully depicts *how* victims internalize their designated role within a commodifying system, seeking meaning and dignity *within* its constraints (art, deferral myth), tragically legitimizing it. Philosophy often analyzes structure; literature shows the lived psychic cost.
      3.  **The Insufficiency of "Humane Treatment":** It powerfully refutes the argument that "respectful treatment" within an exploitative framework neutralizes the fundamental wrong. Hailsham *is* the humane alternative, and it's still a profound moral catastrophe.
      4.  **The Role of Denial & Complicity:** It explores how society (the guardians, the public) uses mechanisms like the Gallery to manage cognitive dissonance and enable atrocity through willful blindness – a crucial dimension often missing from market analyses.

  ### Conclusion
  *Never Let Me Go* powerfully supports **institution-centred objections**. The core wrong is the creation and maintenance of a social arrangement predicated on treating a class of humans as biological resources, devoid of fundamental rights to life, bodily autonomy, and self-determination. Transaction-centred objections are irrelevant here; the novel shows the horror persists, even deepens, *without* them. Miss Emily's defence is thoroughly undercut; humane treatment within a fundamentally inhumane institution is revealed as a cruel illusion that masks the core violation.

  While the novel transcends the commodification debate by exploring universal themes of mortality and meaning, it makes an indispensable contribution: **it exposes the foundational dehumanization inherent in treating persons as resources, demonstrating that this wrong is prior to, and independent of, the mechanism of market exchange.** It forces us to confront the moral bankruptcy of any system that defines human value solely by utility to others, regardless of whether a price tag is attached. Its power lies not in abstract argument, but in the devastatingly intimate portrayal of lives shaped, confined, and extinguished by such a system.
