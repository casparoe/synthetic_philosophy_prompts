       b. **Outcome space too coarse**: What they care about is not just the number of chocolates, but also the experience. For example, in A1 they get 1M for sure and feel safe. In B1, they might feel regret if they get 0. In the second pair, A2 has a 89% chance of getting 0, which might cause anxiety, and they avoid it. But when the common consequence is split, they might not feel as much regret or anxiety? Or the split makes it clear that the common part is irrelevant.

          In the second round, because we split the 89% into two, they might see that in the first pair, the two green events (G1 and G2) both give 1 in A1 and 1 in B1, so they are the same. Therefore, the choice only depends on the other events. Similarly for the second pair, the green events give 0 in both, so they are irrelevant. This might make the independence axiom more salient.

       c. **Artefact of description**: The pattern is not a stable preference but an artefact of how the events are described. When we change the description, the preference changes. This suggests that the preference is not well-defined and depends on framing.

     - **Evidence from Round 2**:
          - If in Round 2 the pattern shifts towards consistency (e.g., more people choose A1 and A2 or B1 and B2), then it suggests that the framing matters. This supports (c) and also (b) because the finer partition might have made the common consequence more obvious. It also undermines (a) because if they were truly rejecting independence, why would the framing change their preference?
          - If the pattern remains the same in both rounds, then it might be (a) or (b) without the framing effect. However, note that the shift was the key we were hoping for.

  4. **What the axiom does in the representation theorem** (5 min):
     - Expected utility theorem: If preferences satisfy certain axioms (including independence), then we can represent them by a utility function such that we choose the lottery with the highest expected utility.
     - The independence axiom is crucial for linearity in probabilities. Without it, we cannot have the expected utility form.
     - We can show: In the first pair, the expected utility of A1 is u(1). B1 is 0.01*u(0) + 0.1*u(5) + 0.89*u(1). So if you prefer A1, then:
          u(1) > 0.01*u(0) + 0.1*u(5) + 0.89*u(1)
          => 0.11*u(1) > 0.01*u(0) + 0.1*u(5)   [subtract 0.89*u(1) from both sides]
     - For the second pair:
          A2: 0.01*u(1) + 0.1*u(1) + 0.89*u(0) = 0.11*u(1) + 0.89*u(0)
          B2: 0.01*u(0) + 0.1*u(5) + 0.89*u(0) = 0.1*u(5) + 0.9*u(0)
          Preferring B2 means:
          0.1*u(5) + 0.9*u(0) > 0.11*u(1) + 0.89*u(0)
          => 0.1*u(5) + 0.01*u(0) > 0.11*u(1)   [because 0.9*u(0) - 0.89*u(0)=0.01*u(0), and move 0.89*u(0) to the left]

     - But from the first inequality, we have 0.11*u(1) > 0.01*u(0) + 0.1*u(5). Rearranged: 0.11*u(1) > 0.1*u(5) + 0.01*u(0). 
     - Then in the second, we require 0.1*u(5) + 0.01*u(0) > 0.11*u(1). Contradiction.

     - The split in Round 2 doesn't change the expected utilities because the probabilities are additive. So if they are consistent in Round 2, it shows they are following expected utility. If they are inconsistent, then they are violating expected utility.

  5. **What can go wrong**? 
     - With 24 students, we might not get a clear pattern. The typical Allais pattern might not emerge in Round 1 (maybe only 50-70% show it). In Round 2, we might not see a shift. So we have to be prepared to discuss even if we don't see the effect.
     - The students might not take the choices seriously because the payoff is chocolates. Emphasize that one of them will get to play for real.
     - Time: The two rounds and tally might take more than 25 minutes. We have to be strict on time.
     - The explanation of the independence axiom might be too abstract. Use the board to write the lotteries and highlight the common part.

  6. **What no activity can deliver**:
     - We cannot prove that expected utility is the correct normative theory. We can only show that the independence axiom is a requirement for it and that people violate it. The activity cannot settle the normative debate. That requires philosophical argument.
     - We also cannot fully distinguish between the three diagnoses. The activity only gives us a hint. We need more careful experiments and reflection.

  Finally, run the lottery for the prize (if time, or do it at the very end).

  Materials:
  - Computer and projector for the spinner.
  - Chocolates (about 30 pieces).
  - Forms for the students (one per student).
  - Whiteboard or flip chart for tallying.

  Total cost: Chocolates (within £20).

  This design should work.
answer: |-
  Below is a comprehensive, runnable 50-minute session plan for your Allais paradox activity. It includes materials, payoff scheme, step-by-step instructions, timing, debriefing points, and candid advice on potential pitfalls. The design uses non-cash incentives (chocolates) within budget, focuses on preference shifts under different descriptions of the same probabilities, and prepares you for all three diagnoses regardless of whether the effect shows up.

  ---

  ### **Session Design: The Allais Paradox and Event Framing**

  #### **Materials (Budget: £20)**
  - **Incentives**: 30 chocolate bars (e.g., Cadbury Fingers, 5-packs; £10–£15) and 24 small, inexpensive consolation sweets (e.g., lollipops; £5). *Why*: Prizes scale to Allais's "millions" (1 chocolate = 1M, 5 chocolates = 5M). Consolation sweets mitigate disappointment from 0 outcomes.
  - **Randomizing Device**: Free online spinner (e.g., WheelofNames.com). Configure two wheels:
    - **Round 1 Wheel**: 3 segments: Red (1%), Blue (10%), Green (89%).
    - **Round 2 Wheel**: 4 segments: Red (1%), Blue (10%), Yellow (44%), Orange (45%).
  - **Other**: Projector for spinner, whiteboard, markers, 24 response sheets (paper or digital form), and a hat for drawing student names.

  #### **Payoff Scheme**
  - **Procedure**: At the session end, one student is randomly selected to play **one** of their choices for real. They spin the wheel for that choice and receive chocolates/sweets based on the outcome.
  - **Payouts**:
    - **Pair 1 Options**:
      - A1: 1 chocolate (for sure).
      - B1: 5 chocolates (Blue), 1 chocolate (Green), 0 (Red).
    - **Pair 2 Options**:
      - A2: 1 chocolate (Red or Blue), 0 (Green in Round 1; Yellow/Orange in Round 2).
      - B2: 5 chocolates (Blue), 0 (Red/Green in Round 1; Red/Yellow/Orange in Round 2).
  - *Why this works*: Incentives are tangible but non-cash. Scaling (1 vs. 5 chocolates) mirrors Allais payoffs. The "one winner" approach ensures choices matter while staying within budget.

  ---

  ### **Session Timeline (50 Minutes Total)**

  #### **Round 1: Standard Allais Pairs (15 Minutes)**
  - **0–5 min: Setup and Rules (Project instructions)**  
    - *Say*: "Today, we’re exploring how we make decisions under risk. You’ll face two pairs of choices. In each, pick A or B. Later, one person will play one choice for real chocolates. Remember: probabilities are fixed, but outcomes depend on a spinner."  
    - *Project*:  
      **Pair 1**  
      - **A1**: 1 chocolate for sure.  
      - **B1**:  
        - 5 chocolates with 10% chance (Blue),  
        - 1 chocolate with 89% chance (Green),  
        - 0 with 1% chance (Red).  
      **Pair 2**  
      - **A2**: 1 chocolate with 11% chance (if Red OR Blue), 0 with 89% chance (Green).  
      - **B2**: 5 chocolates with 10% chance (Blue), 0 with 90% chance (Red OR Green).  
    - *Emphasize*: "Choose based on your genuine preference. Write choices anonymously."

  - **5–12 min: Students Choose**  
    - Hand out response sheets:  
      ```
      ROUND 1  
      Pair 1: A1 or B1? [CIRCLE ONE]  
      Pair 2: A2 or B2? [CIRCLE ONE]  
      ```

  - **12–15 min: Tally and Display Results**  
    - Collect sheets. Tally choices on the board:  
      ```
      Round 1:  
      Pair 1: A1 [X] vs. B1 [Y]  
      Pair 2: A2 [P] vs. B2 [Q]  
      ```  
    - *Do not discuss results yet*.  

  #### **Round 2: Finer-Partition Pairs (15 Minutes)**  
  - **15–20 min: Reframe Choices (Project instructions)**  
    - *Say*: "Now, we’ll revisit the same choices with a twist. The prizes and probabilities are identical, but we’re splitting the 89% Green event into two: Yellow (44%) and Orange (45%)."  
    - *Project*:  
      **Pair 1 (Reframed)**  
      - **A1**: 1 chocolate for sure.  
      - **B1**:  
        - 5 chocolates if Blue (10%),  
        - 1 chocolate if Yellow (44%) OR Orange (45%),  
        - 0 if Red (1%).  
      **Pair 2 (Reframed)**  
      - **A2**: 1 chocolate if Red (1%) OR Blue (10%), 0 if Yellow (44%) OR Orange (45%).  
      - **B2**: 5 chocolates if Blue (10%), 0 if Red (1%), Yellow (44%), or Orange (45%).  
    - *Key point*: "Notice: Yellow + Orange = 89% (same as Green). Nothing about the world changed—only how we describe it."

  - **20–27 min: Students Re-Choose**  
    - Hand out sheets:  
      ```
      ROUND 2  
      Pair 1: A1 or B1? [CIRCLE ONE]  
      Pair 2: A2 or B2? [CIRCLE ONE]  
      ```

  - **27–30 min: Tally and Compare**  
    - Tally Round 2 choices. Add to board:  
      ```
      Round 2:  
      Pair 1: A1 [X'] vs. B1 [Y']  
      Pair 2: A2 [P'] vs. B2 [Q']  
      ```  

  #### **Debrief: Concepts and Diagnoses (20 Minutes)**  
  - **30–35 min: Independence Axiom and Paradox**  
    - *Say*: "Most people choose A1 (safe 1 chocolate) and B2 (gamble for 5). But mathematically, this violates expected utility’s *independence axiom*."  
    - *Sketch on board*:  
      - Define independence: "If you prefer lottery L1 over L2, you should prefer {L1 with probability p, C with 1-p} over {L2 with probability p, C with 1-p} for any common outcome C."  
      - Apply to Allais:  
        - Pair 1: A1 = {1, 1, 1} vs. B1 = {0, 5, 1} (over events Red, Blue, Green).  
        - Pair 2: A2 = {1, 1, 0} vs. B2 = {0, 5, 0}.  
      - *Key insight*: "Replacing the common Green outcome (1 chocolate) with 0 shouldn’t change your preference between A and B. If you liked A1 over B1, you should prefer A2 over B2. But A1+B2 violates this."  
    - *Connect to room*: Point to Round 1 tally. "Many chose A1+B2? That’s the paradox—a preference reversal with no change in probabilities or outcomes."  

  - **35–40 min: Why the Two Pairs Stand or Fall Together**  
    - *Say*: "Expected utility requires consistency: A1 > B1 should imply A2 > B2. Why? Because the only difference is the common outcome (Green/Yellow/Orange), which is identical in both options of a pair. Ignoring it leaves the same ‘core’ gamble: 1 chocolate vs. a 10% chance of 5 chocolates and 1% of 0."  
    - *Visualize*: Cross out Green/Yellow/Orange outcomes in all lotteries. Show that A1 vs. B1 and A2 vs. B2 reduce to the same choice.  
    - *Map to activity*: "In Round 2, splitting Green made this clearer. Did fewer people choose A1+B2? If so, framing matters."  

  - **40–45 min: Three Diagnoses—Evidence from Round 2**  
    - *Present diagnoses*:  
      1. **Rejecting independence normatively**: "You believe it’s rational to care about context (e.g., avoiding regret when nearly winning)."  
         - *Round 2 evidence*: If the A1+B2 pattern persists, it supports this. Round 2’s split doesn’t force consistency.  
      2. **Outcome space too coarse**: "You care about psychological outcomes (e.g., ‘disappointment’ if you get 0 after nearly winning 1M). EU survives if we model these."  
         - *Round 2 evidence*: If choices shift toward consistency (e.g., more A1+A2 or B1+B2), splitting events may have reduced disappointment by making near-misses less salient. Yellow/Orange feel like distinct events, not "almost winning."  
      3. **Artefact of event carving**: "Preferences aren’t stable—they’re framing effects with no deeper rationale."  
         - *Round 2 evidence*: A shift toward consistency supports this (framing caused initial bias). No shift suggests deep instability.  
    - *Crucial nuance*: Round 2 is evidence against (1) if choices shift (why reject independence if framing changes your view?). It supports (2) if splitting events "fixed" the outcome description. It supports (3) if preferences are inconsistent across rounds.  

  - **45–50 min: Axiom in Representation Theorem + Wrap-Up**  
    - *Say*: "Independence isn’t arbitrary—it’s how EU gets linear probabilities. Without it, we can’t compute expected utility as Σp_i u(x_i)."  
      - *Sketch*: Show EU(A1) = u(1), EU(B1) = 0.01u(0) + 0.1u(5) + 0.89u(1). If A1 > B1, then u(1) > [0.01u(0) + 0.1u(5) + 0.89u(1)] → 0.11u(1) > 0.01u(0) + 0.1u(5).  
      - For A2 > B2 to hold, we need 0.11u(1) > 0.01u(0) + 0.1u(5). But A1+B2 implies contradiction.  
    - *Conclude*: "EU requires this math to work. If independence fails, we need new models (e.g., prospect theory)."  
    - **Select winner**: Draw a student’s name and a round/pair at random. Spin the wheel and award chocolates/sweets.  

  ---

  ### **Candid Advice: What Could Go Wrong**  
  1. **The effect doesn’t show up**:  
     - With 24 students, Round 1 may not show strong A1+B2 patterns (e.g., only 50–60% choose it). Round 2 might not shift.  
     - *Workaround*: Use hypothetical examples in debrief ("Studies show 70–80% choose A1+B2..."). Focus on the *structure* of the paradox, not your room’s data.  

  2. **Misunderstandings**:  
     - Students may confuse probabilities (e.g., think Pair 2’s 11% is a new event).  
     - *Prevention*: Use the spinner visually in both rounds. Repeat: "Same probabilities, same outcomes—only the description changes."  

  3. **Incentives feel trivial**:  
     - Chocolates may not feel "high stakes" like real money.  
     - *Mitigation*: Emphasize the "real play" aspect. Use suspense ("One spin could win 5 chocolates!").  

  4. **Time crunch**:  
     - Tallying/choosing may run over.  
     - *Solution*: Use pre-made tally sheets. If behind, skip detailed math in debrief (assign as reading).  

  5. **What no activity can deliver**:  
     - **Normative debates**: You must *explain in your own voice* why independence is debated (e.g., "Does rationality require context-independence? Philosophers like Allais say no; economists like Savage say yes").  
     - **EU’s mathematical necessity**: The activity shows the *consequence* of violating independence, but you must articulate how it underpins the EU representation theorem.  

  ---

  ### **Why This Design Works**  
  - **Pedagogical**: Forces reflection on description-dependence without lecturing. Round 2’s partition tests robustness.  
  - **Robust**: Works whether preferences shift or not. If they shift, explore framing. If not, discuss normative stances.  
  - **Engaging**: Physical spinner and prizes make abstract choices tangible.  

  By making the independence axiom visible through contradiction and framing, students confront the heart of EU theory—setting the stage for deeper discussions in later seminars. Good luck!
