  Hmm... the three lamp variants are cleverly chosen to challenge different assumptions:
  - The ideal lamp directly mirrors Thomson's setup
  - The damped lamp introduces continuous dynamics
  - The dead-band lamp adds hysteresis effects
  All share the key property of matching finite observations perfectly while diverging at infinity.

  The user's constraints are tight: must be self-contained (no external references), solvable in 90 minutes, with a two-part structure. The second part about underdetermination is particularly sharp - it forces students to confront whether the ideal lamp is even well-defined. 

  I should craft a question that makes these variants do real work. The model answer needs to systematically address all five objectives while staying within word count. The marking scheme must reward the specific moves the user wants - not just labeling positions but showing how the variants illuminate them. 

  For the "best wrong answer" prediction: probably a script that correctly analyzes all three lamps but misses how they collectively undermine Thomson's excluded-middle premise. Might earn 12/20. 

  Must absolutely avoid: any suggestion that damped lamp's intermediate state "solves" the paradox (it's just one completion), or physical impossibility arguments about light-speed (irrelevant to conceptual points).
answer: |-
  **Final Examination: PHIL 4990 - Paradoxes of Infinity and Physical Possibility**  
  **Time Allowed: 90 Minutes**  
  **Section A: Answer ONE Question (20 Marks)**  

  **Question 1:**  
  Consider three hypothetical lamps sharing the *same switch schedule* for time \(t < 1\):  
  - **Switch position** \(u(t)\) alternates at times \(t_n = 1 - 2^{-n}\) for \(n = 1, 2, 3, \ldots\):  
    - Down (Off) on \([0, 1/2)\),  
    - Up (On) on \([1/2, 3/4)\),  
    - Down (Off) on \([3/4, 7/8)\),  
    - Up (On) on \([7/8, 15/16)\),  
    - and so on.  

  The lamps differ only in their *response* to the switch:  
  - **(A) Ideal Lamp:** Brightness \(b(t) = u(t)\). Thus, \(b(t)\) is **fully 0 (Off)** or **fully 1 (On)** at every \(t < 1\), alternating with no limit.  
  - **(B) Damped Lamp:** Brightness \(b(t) \in [0,1]\) obeys \(db/dt = k(u(t) - b(t))\) with \(b(0) = 0\) and \(k > 0\). **For any fixed \(k > 0\), \(\lim_{t \to 1} b(t)\) exists and is strictly between 0 and 1** (e.g., ≈0.25 for \(k=1\), ≈0.38 for \(k=2\), ≈0.48 for \(k=4\)).  
  - **(C) Dead-Band Lamp:** A discrete two-state device (On/Off only). It ignores any switch position **not held for at least \(\delta > 0\) consecutive time**. Its state changes only at the first flip held ≥\(\delta\), after which it ignores subsequent flips occurring faster than \(\delta\). **Its state at \(t=1\) is determinate** (On or Off), but **depends on \(\delta\)**: halving \(\delta\) repeatedly causes the final state to alternate (e.g., On for \(\delta = 0.1\), Off for \(\delta = 0.05\), etc.).  

  **Note:** For any finite number of flips \(N\), both (B) (with large \(k\)) and (C) (with small \(\delta\)) match (A) to arbitrary precision for \(t < 1 - 2^{-N}\). They differ only in their behaviour *at* \(t=1\).  

  **(i)** Using these devices, critically evaluate Thomson’s claim that the supertask lamp scenario is **incoherent** and Benacerraf’s reply that it is merely **underdetermined** at \(t=1\). What do these variants reveal about the relationship between *finite observations* and the *limiting state*? (15 Marks)  

  **(ii)** What implications does the behaviour of families (B) and (C) — specifically, that they match (A) over arbitrarily long finite prefixes while disagreeing with each other and (A) at \(t=1\) — have for whether the "ideal lamp" (A) is a well-defined physical object? (5 Marks)  

  ---

  **Model Answer (Approx. 900 words):**  

  **(i)** Thomson argues that the lamp supertask is **incoherent**: the switch schedule requires the lamp to be neither On nor Off at \(t=1\), violating the excluded middle. Benacerraf counters that the story simply **fails to determine** the state at \(t=1\), leaving a gap without contradiction. The three lamp variants clarify this dispute by separating four distinct questions often conflated:  
  1. **Logical possibility (coherence):** Can the description hold without contradiction?  
  2. **Physical realizability:** Could this occur under physical laws?  
  3. **Agency:** Could an agent perform infinitely many acts?  
  4. **Determinacy:** Is the final state fixed by the pre-\(t=1\) story?  

  The **Ideal Lamp (A)** appears to support Thomson: with no "memory" or inertia, every flip has maximal effect eternally. The state alternation has no limit, suggesting no consistent assignment at \(t=1\) is possible without contradiction. However, the **Damped Lamp (B)** and **Dead-Band Lamp (C)** undermine this by providing *coherent, deterministic completions* indistinguishable from (A) over any finite observation period.  

  - **(B) Damped Lamp:** Its final brightness \(\lim_{t \to 1} b(t) = L_k \in (0,1)\) is **determinate** for any fixed \(k\). Crucially, *every flip affects the outcome less than the last*, as the damping factor \(k\) ensures the influence of flip \(n\) decays like \(e^{-k \cdot 2^{-n}}\) (summable effect). Thus, the tail of the flip sequence vanishes in impact. This matches unproblematic supertasks (e.g., Zeno’s runner completing infinitely many intervals), where effects converge. **Thomson’s premise fails:** the lamp *can* settle in a state neither "fully On" nor "fully Off", showing his excluded-middle assumption (brightness must be 0 or 1) is physical, not logical.  
  - **(C) Dead-Band Lamp:** Its final state is **determinate** for fixed \(\delta\) but **depends sensitively on \(\delta\)**. As \(\delta \to 0\), the final state oscillates forever, so the *family* lacks a limit. However, for *any particular \(\delta\)*, the outcome is fixed (e.g., On if \(\delta = 0.1\) and the \(3^{\text{rd}}\) flip is the last "registered"). Here, flips after some finite \(N(\delta)\) have *zero effect* (trivially summable). This shows that indeterminacy in Thomson’s lamp arises not from incoherence, but from **omitting dynamical parameters** (like \(\delta\) or \(k\)) essential to fix the outcome.  

  **Verdicts supported:**  
  - **Thomson’s incoherence claim is refuted:** (B) and (C) are coherent dynamical systems fully consistent with the switch schedule.  
  - **Benacerraf’s underdeterminacy claim is validated but refined:** The story *is* incomplete, but not merely about "failing to specify" \(b(1)\)—it omits the *dynamical laws* (e.g., \(k\), \(\delta\)) needed to resolve the limit.  
  - **A third view emerges:** The paradox reveals that **kinematic descriptions** (positions/times) are insufficient for supertasks; **dynamics** (how states evolve) are essential. No conclusion about "supertasks generally" follows—only that *this* kinematic story admits multiple dynamical completions.  

  The **vanishing tail condition** is key: a supertask has a determinate outcome iff the effects of flips beyond any finite stage become negligible (i.e., are summable). (B) achieves this via damping (\(e^{-k \cdot 2^{-n}}\) sums), (C) via hysteresis (effects beyond \(N(\delta)\) vanish). Thomson’s lamp fails because *every* flip has *full, undiminished* effect.  

  **(ii)** The behaviour of families (B) and (C) shows that the "ideal lamp" (A) is **not a well-defined physical object** but an **idealized, incomplete specification**. Both families:  
  - Match (A) perfectly for any finite time \(t < 1 - 2^{-N}\),  
  - Yield mutually inconsistent states at \(t=1\) (e.g., \(L_k \approx 0.5\) vs. fully On),  
  - And *within* each family, parameters (\(k\), \(\delta\)) give *different* final states.  
  This implies that **no unique state at \(t=1\) is entailed by the switch schedule alone**. The ideal lamp is akin to a function defined only on \([0,1)\)—its "value" at 1 requires arbitrary extension. Physical lamps must embody *some* dynamics (like damping or hysteresis), so (A) is a kinematically specified abstraction without a unique physical realization.  

  ---

  **Marking Scheme (20 Marks Total):**  

  1. **Distinguishing Key Questions (4 marks):**  
     - Award: Separates coherence, realizability, agency, and determinacy.  
     - Penalty (-3): Conflates these (e.g., "indeterminacy proves physical impossibility").  

  2. **Critiquing Thomson & Benacerraf via Variants (4 marks):**  
     - Award: Uses (B)/(C) to refute incoherence (Thomson) and refine underdeterminacy (Benacerraf).  
     - Penalty (-3): Merily labels positions without engaging variants.  

  3. **Role of Excluded Middle & Dynamics (4 marks):**  
     - Award: Notes Thomson’s 0/1 assumption fails for (B)’s intermediate \(L_k\); identifies omitted dynamics (\(k\), \(\delta\)) as the gap.  
     - Penalty (-3): Assumes damped lamp "solves" the paradox physically, not conceptually.  

  4. **Vanishing-Tail Condition & Contrast (4 marks):**  
     - Award: Explains determinate outcomes require summable effects; contrasts with convergent supertasks (e.g., Zeno).  
     - Penalty (-3): Fails to identify decay rates (summability) as decisive.  

  5. **Implications for Determinism & Physicality (4 marks):**  
     - Award: States ideal lamp (A) is kinematically incomplete; determinism requires laws fixing outcomes from initial conditions + laws.  
     - Penalty (-3): Assumes indeterminacy at \(t=1\) implies fundamental indeterminism.  

  **Part (ii) Grading:** Integrated into Move 5. Award marks for linking underdetermination to non-unique physical realizability.  

  ---

  **Best Wrong Answer & Award (12/20):**  
  A script that accurately describes all three lamps and notes their final states differ, but concludes: "Thomson is wrong because the damped lamp shows the final state can be intermediate, and Benacerraf is right because \(\delta\) or \(k\) must be specified." It misses:  
  - Why intermediate brightness *refutes* Thomson’s excluded-middle premise (not just "another possibility"),  
  - The *structural role* of vanishing effects (summability),  
  - That the dead-band lamp shows dependence on parameters ≠ underdeterminacy *for a fixed system*,  
  - The conceptual point about kinematic vs. dynamical descriptions.  
  Award: Moves 1, 2, and half-credit for Move 3 (6+4+2=12).  

  **Answers Earning 0 Marks:**  
  - "Supertasks are impossible because switches can’t move faster than light." (Irrelevant to logical/kinematic coherence).  
  - "The damped lamp shows the real final state is ~0.5." (Misinterprets model as empirical discovery).  
  - Pure summary of Thomson/Benacerraf without using the new lamps.  
  - "All lamps are identical since we can’t observe infinity." (Ignores the conceptual problem of limit states).  
  - Mathematical work on limits or differential equations.
