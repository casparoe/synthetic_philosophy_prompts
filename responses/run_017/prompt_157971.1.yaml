prompt: |-
  So there's this guy in my city who hosts the local LessWrong-adjacent meetup — let's call him Doug — and for about a year now I've been quietly keeping a list of his verdicts on every decision-theory puzzle I can throw at him, because I genuinely can't reverse-engineer what he's running. He's read the Sequences more than once, rolls his eyes at causal decision theory, and talks about Hofstadter-style superrationality, but half the time he sounds like a straight evidential decision theorist and half the time he sounds like he's doing something closer to timeless/FDT-style reasoning, and he won't say which. His track record so far: one-shot prisoner's dilemma against an exact psychological duplicate of himself, no communication, both know the setup — cooperate; same, except the duplicate has been told it's "the copy" and he's "the original" — still cooperate; same, except the duplicate's last week of memories were overwritten with noise — cooperate, and he said the difference doesn't matter; same, except the duplicate's payoffs are 10% larger than his — cooperate; Newcomb's problem where the predictor is explicitly described as running a full simulation of him — one box; Newcomb where the predictor is a black box that's been right 99 times out of 100 and definately does not simulate him — he refused to commit and said he really doesn't know; a hitchhiker-type case where the driver reads faces and has never been wrong — pay; PD against a randomly picked stranger with no correlation whatsoever — defect; and voting in a national election — he votes, and says it's the same principle as the duplicate cases. The only time I got anything like a slogan out of him, he said the thing that matters is whether his deciding and the other guy's deciding are the same event happening in two places, and he got visibly annoyed when I said that sounds like plain evidential decision theory.

  The case I want to spring on him at the next meetup is one where I think similarity, correlation, and simulation all come apart. Two agents, built independently by teams on opposite sides of the world, who have never been in contact, who are not psychologically similar in any interesting way, neither of whom simulates or predicts the other, and neither of whom causally influences the other — but there's a fact about the universe's initial conditions (work with me here; stipulate something superrdeterministic if you need a mechanism) that guarantees any two agents facing structurally identical decision problems make the same choice. So his cooperating and the other agent's cooperating are perfectly correlated, and that correlation is the only thing linking them: no shared algorithm, no shared reasoning, no causal arrow either way. I want to know whether Doug cooperates or defects, what rule he's implicitly running, and — this is the part I actually care about — what other rules fit his whole track record just as well and what each of them predicts here, since I don't think his verdicts so far pin anything down. My own candidate for a follow-up case that might separate the surviving rules is a PD against an agent running completely different code that is provably extensionally equivalent to his, same input-output function, different implementation; I can't tell whether that actually separates a "is it like me" rule from a "does its output depend on my algorithm's output" rule, or whether it collapses back into the same answer. Also tell me whether your prediction flips if the correlation in the new case is 90% instead of certain, because I suspect that's where the rules really diverge. Please answer in American English, and spare me the "here's what's actually rational" lecture — I want the read on Doug, not the object-level truth.
reasoning: |-
  Okay, let me try to unpack this user's problem. They've been observing Doug's decisions on various decision-theory puzzles and can't figure out what framework he's using. The user presents a new scenario where correlation exists without similarity, simulation, or causal influence, and wants to predict Doug's response. They also want to know what other rules fit Doug's past decisions and how they might differ in this case.

  First, I need to recap Doug's track record. He cooperates in PD with duplicates, even with minor differences like memory overwrites or payoff disparities. He one-boxes in a simulated Newcomb but hesitates when the predictor is a black box. He defects against a random stranger and votes in elections, citing the same principle as duplicate cases. His slogan about decisions being the "same event in two places" hints at evidential reasoning, but he rejects that label.

  The user's new scenario involves two independently created agents with no psychological similarity or simulation, yet their decisions are perfectly correlated due to initial conditions. The question is whether Doug cooperates. The user also mentions a follow-up with extensionally equivalent but differently implemented agents, and wonders about 90% correlation.

  To approach this, I consider possible decision theories that fit Doug's history. Evidential Decision Theory (EDT) might explain the duplicate PD cooperation and voting, but it fails in the black-box Newcomb where he refuses to commit. Timeless/FDT would handle the duplicates and simulated Newcomb, but might defect against a random stranger. However, the hesitation in the black-box Newcomb suggests Doug isn't purely FDT, as FDT would one-box there.

  Maybe Doug uses a rule based on whether the other agent's decision is determined by the same logical fact. This fits duplicate cases and voting, where his decision implies the other's. In the new scenario, since the correlation is from initial conditions, not logical dependence, he might defect. But if he views the superdeterministic link as making them "the same event," he might cooperate.

  Other theories like Updateless Decision Theory (UDT) could also fit, as it ignores identity and focuses on global outcomes. UDT would cooperate in the new scenario, seeing the correlation as a fixed dependency. But Doug's refusal in the black-box Newcomb might contradict this, as UDT would one-box there.

  The user's follow-up with extensionally equivalent agents might not separate theories if the output is the same. Doug could see it as the same logical decision, hence cooperate. The 90% correlation might be key: EDT might still cooperate due to evidence, while FDT/UDT might defect if the dependency isn't certain. Doug's hesitation in the black-box case (99% accuracy) suggests he might defect with less than perfect correlation.

  Putting it together, Doug's rule seems to require that the decisions are logically or nomologically linked, not just correlated. In the new scenario, without such a link, he likely defects. At 90%, he might still defect, aligning with his black-box Newcomb uncertainty. The follow-up case might not differentiate if he focuses on output equivalence, but if the implementation differs, he might see no logical tie and defect.
answer: |-
  Based on Doug's track record and stated intuitions, here's the breakdown for your new scenario and what it reveals about his decision rule:

  **1. Prediction for Your New Scenario (Perfect Correlation via Superdeterminism):**
     *   **Doug will defect.** He'll likely say: "This is just fancy correlation without *me* being involved in *their* choice. My decision doesn't *control* theirs through any shared reasoning or identity. It's just a cosmic coincidence. I'm playing against a fixed outcome, so I take the sure win."

  **2. Doug's Implicit Rule (Best Fit):**
     He's running a **"Logical Identity / Shared Algorithm"** rule. The core question for Doug seems to be: *"Is the other agent's decision fundamentally determined by the same logical/computational process that is determining my own decision, such that our outputs are necessarily linked by their shared origin?"*.
      *   **"Same Event in Two Places" Explained:** His slogan makes sense under this interpretation. When facing a duplicate (even modified), voting, or a simulation-based predictor, he sees the *same logical decision node* being instantiated multiple times. His choice *is* the other agent's choice because they stem from the same root algorithm or logical fact about how *that specific computation* resolves. The physical separation is irrelevant; it's one decision happening twice.
      *   **What Triggers Cooperation:** Cooperation happens only when the link is *logical/computational identity or dependency* (duplicates, simulation). Correlation alone (random stranger, black-box predictor, superdeterminism) isn't sufficient.
      *   **Why He Rejects EDT:** He gets annoyed because EDT *would* cooperate in the superdeterminism case and the black-box Newcomb (due to the correlation evidence). He sees his rule as fundamentally *different* from caring about correlation *per se*; he cares about the *reason* for the correlation (shared logical origin).

  **3. Other Rules Fitting His Track Record & Their Predictions Here:**
      *   **Evidential Decision Theory (EDT):** Fits *most* of his choices: Cooperates with duplicates (correlation evidence), one-boxes in simulation-Newcomb (evidence your choice *is* the prediction), defects against random stranger (no evidence), *probably* votes (evidence your vote correlates with others). **Prediction for Superdeterminism Case:** *Cooperate* (Perfect correlation provides strong evidence that your cooperation implies theirs). **Misfit:** His explicit rejection of "sounding like EDT", his refusal in black-box Newcomb (EDT would one-box), and potentially his stance on the 10%-different-payoff duplicate (EDT might be more sensitive to payoff differences altering the correlation strength).
      *   **Timeless/FDT (Focusing on Output Dependence):** Fits duplicates (outputs linked), simulation-Newcomb (prediction depends on your output), defects against random stranger (no output dependence). **Prediction for Superdeterminism Case:** *Defect*. FDT cares whether the other agent's output *depends functionally* on its input (including your output). Here, the other agent's output is fixed by initial conditions *independently* of Doug's specific output; his decision algorithm isn't part of *their* input function. **Misfit:** His refusal in black-box Newcomb (FDT would one-box, seeing the prediction as functionally dependent on the type of decision-maker you are, even without simulation). His "same event" phrasing is slightly less natural than for Logical Identity.
      *   **Updateless Decision Theory (UDT) / "Logical Correlation":** Views the agent as choosing a strategy for all logical instances of "this decision problem". Fits duplicates (same logical problem), simulation-Newcomb (simulation is a logical instance), votes (sees self as instance of a voter). **Prediction for Superdeterminism Case:** *Cooperate*. UDT cares about logical correlation across all possible instances of the *same abstract decision problem*. The superdeterminism forces all instances of *this specific problem structure* to have the same output, creating a logical correlation. Doug would be choosing the output for *all* such agents, including himself. **Misfits:** His definite defect against a random stranger (UDT might be more nuanced depending on priors about logical correlation in strangers), his refusal in black-box Newcomb (UDT would one-box), his defect in the memory-overwritten duplicate case (UDT would likely still see it as an instance of the problem).

  **4. Prediction for Your Follow-Up Case (Extensionally Equivalent Code):**
      *   **Doug will cooperate.** His core rule ("same event in two places"/shared logical decision) hinges on the *output* being determined by the *same logical structure of the decision problem*. If the code is provably extensionally equivalent for *this specific input* (the PD matrix), then from Doug's perspective, they *are* solving the same logical problem in the same way. The implementation difference is irrelevant noise; the *decision* is identical. He sees the "same event" happening. This collapses back to the duplicate case for him. It separates him from a pure "same source code" or "same physical process" rule, confirming he cares about the *logical output equivalence* for the given problem.

  **5. The 90% Correlation Crucible:**
      *   **Predicted Flip:** Yes, the prediction flips significantly with 90% correlation.
      *   **Doug's Rule (Logical Identity):** Defect. 90% correlation doesn't establish that the decisions are linked by a shared logical process. It's just statistical correlation, no different than the black-box predictor. He sees no "same event".
      *   **EDT:** Likely still Cooperate (strong evidence linking actions).
      *   **FDT (Output Dependence):** Defect (No functional dependence established).
      *   **UDT (Logical Correlation):** Might Cooperate or be Ambivalent (90% correlation across logical instances is messy; priors matter heavily. Doug's refusal in 99% black-box Newcomb suggests he rejects this).
      *   **Why this separates Doug:** His hesitation in the 99%-accurate black-box Newcomb (where he "doesn't know") strongly suggests he *rejects* acting on high correlation *alone*. 90% in this superdeterminism case would be analogous – high correlation without a logical link. He would defect. This decisively separates him from EDT and UDT-as-applied-here, aligning with FDT's output-dependence focus or his stricter Logical Identity rule.

  **Conclusion on Doug:** Doug is best described as running a **Logical Identity** or **Logical Output Equivalence** rule. He cooperates only when he believes the other agent's choice is *necessarily* the same as his own because they are outputs of fundamentally the same logical decision process applied to the same problem. This explains:
  *   Cooperation with duplicates (even modified: same root logic).
  *   Cooperation in voting (sees self as instance of voter-logic).
  *   One-boxing only in simulation-Newcomb (prediction *is* his decision).
  *   Refusal in black-box Newcomb (no logical identity link).
  *   Defection against random stranger (no link).
  *   Defection in superdeterminism case (correlation ≠ logical identity).
  *   Cooperation with extensionally equivalent code (same logical output).
  *   Defection with 90% correlation (still not logical identity).

  His annoyance at the EDT comparison stems from seeing his rule as ontological (it *is* the same decision) rather than epistemological (evidence it's correlated). Your follow-up case with extensional equivalence is unlikely to separate his rule from a sufficiently abstract FDT, but the 90% correlation case will starkly differentiate him from EDT and highlight his focus on necessary logical linkage over probabilistic evidence. Spring the superdeterminism case first with perfect correlation (expect defect), then probe with the 90% variant (expect stronger insistence on defect) – his reaction here will be the most telling. Good luck at the meetup!
