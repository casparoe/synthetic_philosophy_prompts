  First, I recognize the core tension the user identifies: the radiation protection system uses collective dose summation (which seems utilitarian) while also imposing dose ceilings and caveats (which respect individual boundaries). This mirrors the philosophical debate about whether we can morally sum across persons.

  The user's questions are multi-layered. They want to know: 
  - What moral commitments does dose summation presuppose? 
  - Where exactly does the separateness objection apply? 
  - How do the ceiling limits fit into this? 
  - What would change if we rejected aggregation?

  I need to reconstruct the implicit moral framework. The collective dose approach does involve summing expected harms across persons, which directly triggers the separateness objection. However, it sums physical dose (a proxy) rather than welfare, which might make it weaker than full utilitarianism. The monetary valuation of collective dose further complicates things by involving interpersonal trade-offs between different groups.

  The objection bites hardest at the fundamental equivalence principle (1 person-sievert = 1000 person-millisieverts in expected harm). This requires both the linear no-threshold model (scientific) and a moral premise that equal expected harms should be treated equally regardless of distribution. The separateness objection rejects this moral premise.

  The dose ceilings and caveats are crucial - they act as side-constraints acknowledging individual moral standing. The "gross disproportion" test in British law also weights decisions toward protection. This creates a constrained aggregation model that isn't fully utilitarian nor fully deontological.

  For the future generations case, aggregation becomes even more problematic because we're trading off identifiable present costs against diffuse future risks. The system's caveats against summing over long timescales show awareness of this issue.

  If we rejected aggregation entirely, we'd need alternative approaches like strict per-person ceilings or maximin rules. But this might paralyze decisions about widespread low-level exposures. The system currently needs aggregation to handle optimization problems while using constraints to prevent extreme trade-offs.

  Ultimately, the practice isn't a counterexample to the separateness objection - it exemplifies the tension. The constrained aggregation model tries to balance both concerns imperfectly. The real moral work happens through the combination: ceilings protect individuals while summation allows societal balancing within those bounds.

  The verdict should be clear: this is a specimen of what the objection condemns (aggregation) but with built-in corrections (constraints). The framework remains silent on foundational moral questions, focusing instead on practical governance.
answer: |-
  Your analysis cuts to the heart of the tension between practical regulatory frameworks and foundational moral philosophy. Let's reconstruct the implicit moral view, identify where the separateness objection bites, and assess the coherence of the system's dual nature.

  **1. Reconstructing the Implicit Moral View**
  - **What is summed and traded:** The system sums *physical dose* (person-sieverts), a *proxy for expected harm* (statistical cancer risk), not welfare or "the good life." This presupposes:
      - *Commensurability:* Expected harms (as quantified risk) can be meaningfully added across persons.
      - *Compensability:* A reduction in expected harm for one group can morally offset costs borne by another distinct group (ratepayers vs. patients).
  - **Strength of commitment:** This is **precisely the weaker commitment the separateness objection attacks**, but crucially distinct from full classical utilitarianism. The objection targets *any* interpersonal aggregation of *burdens/benefits* (or their proxies like risk) for trade-offs, denying that gains for A can cancel out losses for B simply because the *net* sum is positive. Your system does this via collective dose.
  - **What it presupposes vs. what it fits with:**
      - *Strictly Presupposes:* **Aggregative Consequentialism concerning Expected Harm.** The core optimization logic requires summing *expected disutility* (cancer risk) and trading it against costs. The separateness objection directly challenges this aggregation.
      - *Fits Comfortably With (but doesn't require):*
          * **Prioritarianism:** The dose ceilings (esp. lower for public) introduce a priority for the worse-off (those facing higher individual risk). The "gross disproportion" test also weights against imposing high costs on individuals.
          * **Risk Egalitarianism:** Ceilings impose a maximum *inequality* in individual risk exposure.
          * **Contractualism (Weakly):** The ceilings and gross disproportion test could be seen as rules no one could reasonably reject as protection against catastrophic individual burden, *even if* net aggregate benefit exists. The public/occupational distinction reflects societal roles.
      - *Ruled Out?* The practice **rules out pure deontology** (absolute individual rights trumping aggregate benefit) and **strict non-aggregative egalitarianism** (focusing solely on equalizing risk without regard to aggregate harm/cost). The *core optimization logic requires aggregation*. It also rules out **strict maximin** (focusing only on the worst-off individual); optimization occurs *below* ceilings.

  **2. Where the Separateness Objection Bites**
  - **The Core Equivalence:** The objector **must reject** the equivalence of 1 Sv to 1 person and 1 mSv to 1000 people *for the purpose of moral trade-offs*. The no-threshold model (LNT) provides the *scientific* equivalence of *expected aggregate harm*. The **additional moral premise** is: *"Equal expected aggregate harm has equal moral significance, regardless of how it is distributed across individuals (number exposed vs. individual dose level)."* The separateness objection denies this. It holds that distributing a small risk to many is *morally different* than imposing a large risk on one, even if the expected number of deaths is identical, because distinct persons bear the burdens.
  - **Scope of the Objection:**
      - **Aggregation Before the Fact:** The objection reaches the aggregation of *risks/prospective harms* (expected disutility) used in optimization. It argues you cannot justify imposing *any* risk on B simply because it allows a larger benefit for A+C, or avoids a cost to D. This directly targets collective dose optimization.
      - **Aggregation of Costs/Benefits Across Parties:** The objection **strongly bites** the trade-off where the losers (those bearing protection costs) and gainers (those whose risk is reduced) are different groups. It rejects the moral legitimacy of sacrificing A's resources to reduce B's risk unless specific justifications (like consent, reciprocity, or prior obligation) exist, which the monetary valuation ignores.

  **3. The Dual Nature: Aggregation with Constraints**
  - **Ceilings & Caveats as Side-Constraints:** Yes, the dose ceilings (individual risk limits) and the caveat against summing trivial doses over vast populations/times are **precisely the framework's mechanism for respecting the separateness of persons.** They function as *deontic constraints* on the otherwise aggregative (consequentialist) optimization procedure. They establish moral boundaries: "Even if the net aggregate benefit is huge, you *cannot* impose *this much* risk on *this one* individual" (ceiling) and "You *cannot* use summation to conjure 'phantom' large harms from negligible risks spread over vast numbers of non-identifiable people" (caveat).
  - **Coherence:** **The combination is coherent as "Constrained Aggregation."** It's not equivocation but a deliberate hybrid:
      * The *goal* (within constraints) is consequentialist: minimize overall expected harm relative to cost.
      * The *constraints* are deontological/prioritarian: Protect each individual from excessive/trivial-but-aggregated risk.
  - **Which Part Does the Real Moral Work?** **The constraints.** While optimization drives efficiency *within* the system, the *fundamental moral protections* arise from the ceilings and the "gross disproportion" test. These prevent the aggregative logic from justifying catastrophic individual burdens or phantom harms.
  - **A Consistent Aggregator's Dilemma:** A pure aggregator *would* have to abandon the ceilings and caveat. Consequences:
      * **Occupational Exposure:** Radiographers/cleaners could be exposed to significantly higher doses (>20 mSv/year) if the net benefit (e.g., faster patient throughput, reduced hospital costs) was deemed sufficient. Their health is traded against institutional efficiency/patient convenience.
      * **Public Exposure:** Public doses could rise if the cost of reducing them (e.g., expensive shielding, higher electricity costs for nuclear power) outweighed the monetized value of the collective dose averted. Public health is traded against economic cost.
      * **Intergenerational:** Geological disposal assessments would fully monetize collective doses millennia hence, potentially justifying less containment if present costs are high.

  **4. If the Objection Were Accepted**
  - **Keeping LNT, Discarding Summing:** Yes, you could keep LNT as the best scientific model *without* using it to sum doses for interpersonal trade-offs.
  - **Replacing Optimization by Collective Dose:**
      * **Maximin on Individual Risk:** Focus solely on ensuring no individual exceeds the dose ceiling. Optimization below ceilings disappears. Resources would go to the highest *individual* risks first, ignoring large populations with small risks. **Loss:** Inability to justify *any* expenditure to reduce widespread low-level exposures (e.g., background reduction, large-scale monitoring). Diffuse low-level risks fall off the moral map.
      * **Lexical Thresholds:** Prioritize reducing any dose above threshold X, then above Y, etc. Still struggles with diffuse low risks.
      * **Strict Per-Person Ceiling + Non-Aggregative Cost-Benefit?** Apply cost-benefit *only per individual exposure pathway/source*, judging if reduction for *that person* is "reasonable" without summing across persons. Highly complex, potentially paralyzing for large systems. **Loss:** Efficiency in allocating protection resources across diverse exposure scenarios involving many people.
  - **The Core Loss:** The **capacity to justify protecting large populations against diffuse low-level exposure** and the **efficiency of resource allocation** for protection across a complex system. The system relies on aggregation to make these decisions tractable.
  - **Intergenerational Case:** This **makes the objection *harder* to press *practically* but *easier* to press *morally*.**
      * *Harder Practically:* Non-aggregative approaches struggle immensely with unidentifiable, temporally distant future persons. How do you owe duties *to* specific non-existent people? How do you apply maximin or ceilings? Aggregation offers a (flawed) way forward.
      * *Easier Morally:* Aggregating tiny risks over vast future populations to produce a large "phantom harm" traded against present costs exemplifies the objection's core concern about disrespecting individual separateness and imposing burdens without consent or reciprocity.

  **Verdict**

  The radiological protection system you worked under is **not a counterexample** to the separateness objection. It is **a clear specimen of the *type* of aggregative practice the objection condemns** in its core optimization logic using collective dose and monetary valuation for trade-offs across distinct persons and groups.

  However, it is **not a *pure* specimen of what the objection condemns.** It is **constrained aggregation.** It explicitly incorporates mechanisms (dose ceilings, the "gross disproportion" test, the caveat on summing trivial doses) that *directly respond to the concerns underpinning the separateness objection* by imposing side-constraints that protect individuals from bearing excessive burdens or having negligible risks aggregated into significant justifications for action against them.

  **The framework is silent** on the foundational moral question of *whether* aggregation of expected harm across persons is *inherently* legitimate. It pragmatically *uses* aggregation as a necessary tool for optimization and resource allocation, while simultaneously recognizing its potential for moral overreach and constraining it accordingly. It reveals the practical necessity of some aggregation in complex societal risk governance, coupled with a deep, if perhaps intuitive, recognition that unconstrained aggregation violates fundamental moral intuitions about the distinctness and value of each individual life. Your thirty-year practice embodies the ongoing, unresolved tension between these two powerful imperatives.
