  The core challenge is ensuring the question forces engagement with the argument's structure: that relationalism avoids free-floating reasons but seems stuck with free-floating normative principles. The Ada/Bo case is cleverly chosen to block easy escapes—no shared agents, no hypothetical observers, no collective action possible.

  For the question design, I need to make it self-contained and attack-proof. Candidates shouldn't be able to pivot to general debates about reasons fundamentalism. The closing instruction about relationalism's motivation is crucial—it forces them to consider whether the view achieves its own aims. 

  The model answer must demonstrate how to run the argument tightly: first establish the normative remainder (the "matters more" judgment), then show it can't be reduced to agent-indexed reasons, then expose the relocated normative principles. The commitment to one position is deliberate—this tests depth over survey-style answers.

  The marking scheme's five must-hit points should mirror the argument's critical junctures: 
  1) Identifying the ineliminable normative remainder 
  2) Blocking the individual agent escape 
  3) Blocking third-party/hypothetical escapes 
  4) Showing normative principles inherit the "free-floating" problem 
  5) Evaluating relationalism's core motivation against this

  Common pitfalls to watch for: students might try to "solve" the case with aggregative reasoning (missing the point) or conflate normative principles with descriptive generalizations. The first-class/upper-second distinction hinges on whether they see the dialectical trap—that relationalism might just relocate rather than resolve the problem.
answer: |-
  Here is the complete take-home exam package addressing your requirements:

  ### 1. Exam Question
  **Question 4 (30 marks): Free-Floating Rationales and the Remainder Argument**  
  *Write no more than 1,500 words. Address all parts explicitly.*

  Consider two agents:  
  - **Ada** can prevent one severe injury to a stranger (injury severity: 10 units).  
  - **Bo** can prevent five mild injuries to five different strangers on a distant island (each injury: 1 unit; total prevented: 5 units).  
  Their actions are independent: neither can affect the other’s situation, and no third party can assist or coordinate them.  

  We might judge that **Bo’s opportunity matters more than Ada’s** because preventing 5 units of harm is more significant than preventing 10 units when no single person suffers comparably (i.e., five separate 1-unit harms outweigh one 10-unit harm). This comparative judgment appears normatively significant but is not a reason *for Ada* (she cannot affect Bo’s island), not a reason *for Bo* (he cannot alter Ada’s choice), and not a reason for any other agent (no one else is involved).  

  **Relationalism** holds that normative reasons must always be reasons *for some particular agent*. **The remainder argument** claims that relationalism avoids free-floating *reasons* only by relying on free-floating *normative principles*:  
  1. Relationalism requires a general principle specifying *which facts are reasons for whom* (e.g., "Preventing harm is a reason for any agent who can do so").  
  2. It also requires principles to combine individual reasons into judgments about multi-agent cases (e.g., "When harms are non-comparable and distributed, aggregate prevention matters more").  
  3. These principles are not themselves reasons *for any agent*—they are normative yet free-floating.  

  **Argue for one of the following conclusions:**  
  (A) The remainder argument succeeds: Relationalism cannot eliminate free-floating normativity without circularity.  
  *OR*  
  (B) The remainder argument fails at a specific step: Explain precisely why the comparative judgment *or* the principles *are* reducible to agent-relative reasons.  

  **Your essay must:**  
  - Explain why the "matters more" judgment is not a reason for Ada, Bo, or others.  
  - Engage the remainder argument’s structure (steps 1–3 above).  
  - State what you take to be the **core motivation for relationalism** and assess whether the remainder argument undermines that motivation.  
  *Do not discuss reasons fundamentalism, constructivism, or buck-passing theories of value.*  

  ---

  ### 2. Model Answer (798 words)  
  **The Inescapability of Free-Floating Normativity**  

  The case of Ada and Bo presents a normative remainder: the judgment that Bo’s opportunity matters more than Ada’s. Preventing five mild injuries (5 total units) outweighs preventing one severe injury (10 units) because no individual faces compounded harm, and aggregate lesser harms surpass a single greater harm when distributed. This judgment is *normatively significant*—it guides evaluations of outcomes and priorities—yet it cannot be a reason *for any agent*. Ada has reason only to prevent her stranger’s severe injury; Bo has reason only to prevent the five mild injuries; no third party exists to act. Crucially, the judgment compares their *opportunities*, not outcomes of a shared action. Relationalism, which insists all reasons are agent-indexed, must either deny this judgment’s normativity or reduce it to agent-relative reasons. I argue it fails to do the latter, revealing free-floating normative principles as unavoidable.  

  **The Normative Remainder as Non-Reducible**  
  The "matters more" judgment resists reduction to reasons for Ada or Bo. For Ada, the fact that Bo’s opportunity matters more is irrelevant: she cannot alter Bo’s choice or affect his strangers. Acting on this fact would entail neglecting her own stranger, which her reasons forbid. Similarly, Bo gains no reason from this comparison: his reasons concern only preventing the harms before him. The comparison also cannot be a reason for a hypothetical observer. No such observer exists in the case, and inventing one smuggles in free-floating normativity by assuming an agent *should* care about the comparison. Even if we imagine a third agent, Cap, who can advise Ada and Bo, Cap’s reasons would depend on principles *telling Cap why aggregate harm matters*—principles Cap did not create.  

  **Relationalism’s Free-Floating Principles**  
  Relationalism requires two principles to handle this case:  
  1. **The grounding principle**: "An agent has reason to prevent harm they can avert."  
  2. **The combining principle**: "When harms affect non-overlapping groups and are non-comparable in severity per individual, the opportunity to prevent greater aggregate harm matters more."  
  The grounding principle is not a reason *for Ada or Bo*; it is a general rule *about* reasons. If it were a reason for them, it would circularly presuppose the normativity it seeks to explain. The combining principle is even clearer: it explains why Bo’s 5-unit opportunity outweighs Ada’s 10-unit opportunity, but it is not a reason *for anyone* to act. Ada cannot act on it (it concerns Bo’s choice), Bo need not act on it (his reasons are already fixed), and Cap (if present) would require it to interpret what "matters more" *means*. These principles are irreducibly normative—they are not descriptions of psychology or social practices—yet they float free of any agent’s standpoint.  

  **The Dilemma for Relationalism**  
  Relationalists might object that principles are *constitutive of agency* and thus agent-relative. But this fails:  
  - If principles are constitutive, they apply to all agents equally—but their authority (e.g., *why* agency requires harm-prevention) remains free-floating.  
  - The combining principle cannot be constitutive: it compares distinct agents’ contexts, which no single agent’s constitution governs.  
  Alternatively, relationalism might deny the "matters more" judgment’s normativity. But this is implausible: if Ada asked, "Should I feel regret if I act but Bo doesn’t?", the answer depends on whether Bo’s inaction was a greater normative failure. This evaluation requires the combining principle, which lacks an agent.  

  **Relationalism’s Motivation and Its Undoing**  
  Relationalism’s core motivation is **anti-metaphysical**: to avoid mysterious mind-independent normative facts by tethering reasons to agents’ perspectives (e.g., through rational capacities or subjective motivations). Yet the remainder argument shows this relocation fails. Normativity reappears in principles whose authority cannot be reduced to individual standpoints without regress:  
  - The combining principle dictates *how* agents’ reasons interact in normative evaluation.  
  - Its authority—e.g., why aggregate harm *should* outweigh isolated severe harm—is not explained by any agent’s motives. If relationalists ground it in *our* practices, they admit social facts generate normativity, which is itself free-floating (why *should* practices bind?).  
  Thus, relationalism abolishes free-floating reasons only by accepting free-floating rules. Its anti-metaphysical gain is illusory; it merely shifts the locus of irreducibility.  

  **Conclusion**  
  The remainder argument succeeds. Relationalism cannot absorb the normative remainder in Ada and Bo’s case without invoking principles whose normativity is agent-transcendent. Its attempt to naturalize reasons relocates rather than resolves the problem. The combining principle—essential for multi-agent normative judgments—exposes this unequivocally: it is indispensable, irreducible, and free-floating.  

  ---

  ### 3. Marking Scheme (30 marks total)**  
  **Must-hit points (6 marks each):**  
  1. **Identify the normative remainder**: Explain why the "Bo’s opportunity matters more" judgment is *inescapably normative* yet *not a reason for Ada, Bo, or others*.  
     *Competent but not excellent:* Notes the comparison but doesn’t clarify its *normative* role.  
     *Common error:* Calls it a "reason for society" or conflates it with impersonal value.  

  2. **Block individual-agent reduction**: Show why the comparative fact cannot be a reason *for Ada* or *for Bo* given their isolation.  
     *Competent:* States they can’t act on it but doesn’t explain why it *couldn’t* override their existing reasons.  
     *Common error:* Suggests Ada could "symbolically support Bo," violating the case’s constraints.  

  3. **Block third-party/hypothetical reduction**: Demonstrate why introducing a bystander (Cap) or "joint reason" fails—either by misdescribing the case or presupposing normative principles.  
     *Competent:* Mentions no third party exists but doesn’t explain why hypotheticals beg the question.  
     *Common error:* Claims Cap has reason to promote overall good, ignoring that *why* Cap should care relies on free-floating principles.  

  4. **Expose free-floating principles**: Argue that relationalism’s grounding/combining principles are *themselves* free-floating normative items (not reducible to reasons for agents).  
     *Competent:* Names the principles but doesn’t show their normativity is irreducible (e.g., calls them "descriptive").  
     *Common error:* Asserts principles are "constructed by agents," missing that construction rules require normative foundations.  

  5. **Link to relationalism’s motivation**: State that relationalism aims to avoid mind-independent normativity (anti-metaphysical), and judge whether the remainder undermines this.  
     *Competent:* Identifies anti-metaphysical motives but doesn’t explain *how* principles reintroduce mind-independence.  
     *Common error:* Cites "reasons internalism" without connecting to metaphysics.  

  **First-class vs. Upper-second distinction**:  
  - **First-class (70+%)**: Hits all 5 points while *anticipating and defusing* objections (e.g., "But aren’t principles constitutive?"). Shows why the relocation of normativity is a *dialectical failure* for relationalism’s goals.  
  - **Upper-second (60-69%)**: Hits 4-5 points but with less precision on *why* principles are irreducible (e.g., vaguely labels them "normative") or offers generic critiques not tailored to the case. May lapse into discussing constructivism.  

  ---  
  This package isolates the target difficulty by forcing engagement with the argument’s structure and blocking retreats into rehearsed positions. The model answer demonstrates commitment while executing each must-hit move, and the marking scheme rewards dialectical precision over coverage.
