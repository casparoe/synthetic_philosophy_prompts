prompt: |-
  Posting this here because I keep going in circles with a friend from a formal epistemology reading group I tagged along to — she's the technical one, I'm mostly there for the wine.

  As I understand the "imprecise probability" / set-of-priors idea: instead of representing your uncertainty with a single probability function you use a set of them, so instead of a sharp number you get something like an interval — P(green) somewhere between 0.2 and 0.5 rather than P(green) = 0.35. My objection, which seems to me obvious but which nobody has managed to shoot down to my satisfaction, is that this is just ordinary Bayesianism with extra steps. Take the set, put some weighting on the functions in it — uniform over the extreme points if you've got no better idea — average them, and out pops a single perfectly ordinary additive prior. Everything the interval was telling you, you can read off the average, and then you conditionalize and maximize expected utility like a normal person. Refusing to actually pick numbers starts to look like superstition about precision, or like you want to keep your options open so you can never be wrong.

  Here's the sort of case I keep testing it on: a machine is going to paint a ball green or blue. It was built either by factory A, whose machines paint green 40% of the time, or by factory B, whose paint green 80% of the time, and I have no clue which. The 50/50 average gives P(green) = 0.6, so I should pay up to $0.60 for a ticket that pays $1 if the ball is green. The interval [0.4, 0.8] seems to be saying... roughly the same thing? Both approaches tell me to take the bet at $0.50 and to turn it down at $0.90. So where does any of this actually bite? Her replies so far haven't landed: she says the weighting is arbitrary and nothing in my evidence picks one out, that your interval can get *wider* when you learn things (which sounds to me like she's just recomputing the average wrong), and something about paramaterizations that I didn't follow at all.

  So: what, if anything, is genuinely lost in collapsing the set to its average? I'd really like a case with numbers I can check by hand where the two approaches disagree about what I should believe or what I should do, not just about how tidy the notation is. And I'd like to know whether whatever answer you give is only about describing what people actually do — is this connected to that Ellsberg urn experiment where people supposedly behave weirdly? — or whether it's a claim about what it's rational to believe and do, regardless of what anyone does.
reasoning: |-
  Okay, let me try to figure out what's going on here. The user is in a debate with a friend about imprecise probabilities versus Bayesianism. They think that averaging the set of priors into a single probability should suffice, but their friend disagrees. I need to find a concrete example where these approaches lead to different decisions.

  First, the user's core argument: averaging the set into one prior seems to capture all necessary information. For instance, in their factory example with P(green) between 0.4 and 0.8, averaging gives 0.6. Decisions based on this average align with the interval's min and max when evaluating bets. So where's the difference?

  The friend mentioned that the weighting is arbitrary. That's a key point. If there's no basis to choose weights, imposing a uniform distribution might be unfounded. Also, the interval can widen with new evidence, which doesn't happen with a single prior. How does that work?

  Consider Ellsberg's urn. Suppose an urn with 30 green balls, and the rest are either blue or red, but the proportion is unknown. The user knows there are 60 blue and red combined, but not the split. So P(red) could be from 0 to 60/90 = 2/3. The set of priors has P(red) between 0 and 2/3. Averaging would give a single probability, say 1/3 if uniform. But people prefer betting on green (known 30/90=1/3) over red (ambiguous). If they use the average, both are 1/3, so no preference. But with imprecise probabilities, the maxmin expected utility would choose the known probability bet. That's a difference in decision-making.

  Now, applying this to the user's factory scenario. They have two factories: A with P(green)=0.4, B with P(green)=0.8. Prior probability over factories is 50/50. But what if they get new evidence? Suppose they see a sample of balls painted by the machine. After seeing green balls, the posterior probability that it's factory B increases. But if they don't know which factory made the machine, the set of priors approach treats the factory choice as ambiguous. 

  Let's say they see one green ball. Using the set of priors, each prior updates independently. Factory A posterior: P(A|green) proportional to 0.5 * 0.4 = 0.2. Factory B: 0.5 * 0.8 = 0.4. So posterior probability for factory A is 0.2/(0.2+0.4)=1/3, B is 2/3. Then the average P(green next) = (1/3)*0.4 + (2/3)*0.8 = approx 0.667. The interval for P(green) was [0.4,0.8] initially. After updating, the set becomes [P(green|A), P(green|B)] but since the posterior over factories is updated, the new interval for the next ball is still between 0.4 and 0.8? No, because the posterior weights are now 1/3 and 2/3, so the expected value is 0.667, but the possible probabilities are still 0.4 and 0.8. The interval doesn't narrow because the uncertainty about the factory isn't probabilistic in the imprecise model. But in the Bayesian approach, it becomes a single probability.

  Where the two differ in decisions might be in sequential decisions or when combining bets. Suppose the user is offered two bets: one on green from this machine, another on a coin flip with known 50% probability. The Bayesian with average 0.6 would be indifferent between betting on green at 0.6 and the coin at 0.5? But the coin at 50% is better than green if green could be 40%. 

  Ellsberg's example shows that people avoid ambiguity. So even if the average is 0.6, they might prefer a known 50% chance over the ambiguous green bet. The maxmin expected utility in imprecise probabilities would evaluate the green bet at the worst-case prior, which is 0.4, so they'd prefer the 50% known bet. Whereas the Bayesian with average 0.6 would prefer the green bet since 0.6 > 0.5. That's a clear divergence in recommended actions.

  Another point: when new ambiguous evidence arrives. Suppose after seeing the green ball, they learn that the machine might have a defect that affects the color. This adds more uncertainty. In the Bayesian approach, they'd need to assign probabilities to the defect, which might be arbitrary. In imprecise probabilities, the set expands to include more extreme scenarios, widening the interval. For example, if a defect could lower P(green) to 0.3, the interval becomes [0.3,0.8] instead of [0.4,0.8]. The Bayesian, once averaged, can't easily widen unless they adjust their model, but the imprecise model naturally incorporates this by adding more priors. So the interval width reflects remaining ambiguity.

  The user wants a numerical case. Let's construct one. Suppose the machine is from either factory A (P(green)=0.4) or B (0.8), with no prior weighting. So P(green) in [0.4,0.8]. Now, they're offered a bet: $1 if green, cost $0.55. Maxmin EU says the worst case is P=0.4, so expected value 0.4*1 - 0.55 = -0.15, reject. Bayesian with uniform prior over factories: P(green)=0.6, so 0.6*1 - 0.55 = +0.05, accept. So the two approaches recommend different actions at $0.55. The imprecise model rejects, Bayesian accepts. This happens because the maxmin rule is pessimistic. Without a defined prior over the set, the average isn't used; instead, the worst-case prior determines the decision.

  This addresses the user's request: a situation where collapsing to average changes the recommended action. It's about rational decision-making, not just description. The debate is normative: should we use maxmin when faced with ambiguity? Ellsberg shows people do, and some argue it's rational to avoid ambiguity when probabilities are ill-defined.

  The user's friend mentioned intervals widening. Suppose after seeing a green ball, but then learning the factory might have mixed parts, adding a new prior where P(green)=0.1. The set expands to [0.1,0.8], while the Bayesian would need to adjust their model and perhaps downweight this new scenario arbitrarily. The imprecise model accommodates this without specifying how likely the new scenario is, just that it's possible.

  So key differences: decision-making under ambiguity (maxmin vs expected utility), handling new sources of uncertainty without arbitrary weights, and representing ignorance without forcing precision. The Bayesian average assumes knowledge (a prior) over the hypotheses, whereas the set approach avoids committing to that.
answer: |-
  Your intuition is sharp, and your friend is pointing at something real—though it's subtle and hinges on cases where ambiguity itself affects rational choice. Collapsing the set to an average *is* Bayesianism, and it *does* work in many cases. But there are specific, normatively motivated scenarios where imprecise probabilities prescribe different rational behavior than any single prior would. Below is a concrete, numerical case showing the divergence, followed by why it matters.

  ### The Crucial Case: Sequential Decisions with Ambiguous Evidence
  Imagine this scenario (inspired by Ellsberg but sharper):

  1.  **Setup:** You face two identical machines. Each will paint one ball.
  2.  **Machine 1:** Known to be from Factory A (P(green) = 0.4) or Factory B (P(green) = 0.8). You have **no basis** for assigning a probability to which factory made it. Your belief is the set of priors {P₁(green) = 0.4, P₂(green) = 0.8}.
  3.  **Machine 2:** Built by a mysterious process. You know *nothing* about its P(green). Your belief is the set of *all possible probabilities*: P(green) ∈ [0, 1].
  4.  **Choice:** You must choose *one* machine to bet on. A bet pays $1 if the ball is green, $0 otherwise. You pay $0.45 to place the bet.

  **What should a rational agent do?**

  *   **Bayesian with Averaged Prior:**
      *   **Machine 1:** Average P(green) = (0.4 + 0.8)/2 = **0.6**. Expected Value (EV) = 0.6 * $1 - $0.45 = **+$0.15**. Accept bet.
      *   **Machine 2:** You *must* choose a prior. If you use a uniform average over [0,1], P(green) = 0.5. EV = 0.5 * $1 - $0.45 = **+$0.05**. Accept bet.
      *   **Decision:** Both bets are acceptable. Machine 1 has a slightly higher EV ($0.15 > $0.05), so choose Machine 1.

  *   **Imprecise Probabilities (Maximin Expected Utility - MMEU):**
      *   Rationality Rule: Evaluate each option by its *worst-case* expected utility across your set of priors. Choose the option with the best worst-case.
      *   **Machine 1:**
          *   Worst Prior: P(green) = 0.4.
          *   Worst-Case EV = 0.4 * $1 - $0.45 = **-$0.05**.
      *   **Machine 2:**
          *   Worst Prior: P(green) = 0.0.
          *   Worst-Case EV = 0.0 * $1 - $0.45 = **-$0.45**.
      *   **Decision:** The worst-case for Machine 1 (-$0.05) is *much better* than the worst-case for Machine 2 (-$0.45). **Choose Machine 1.**

  **Result:** Both approaches choose Machine 1. **No disagreement yet.** Let's add evidence.

  5.  **New Evidence:** You observe **10 balls painted by Machine 2**. **All 10 are green.**
  6.  **Updated Choice:** Same bet offer ($0.45 for $1 if green). Which machine now?

  *   **Bayesian with Averaged Prior:**
      *   **Machine 1:** Unchanged. EV = **+$0.15**.
      *   **Machine 2:** Update your uniform prior over [0,1] (Beta(1,1)) using Bayes. Posterior is Beta(11,1). Posterior mean P(green) = 11/(11+1) ≈ **0.9167**. EV = 0.9167 * $1 - $0.45 ≈ **+$0.4667**.
      *   **Decision:** Machine 2 now has a *much* higher EV ($0.47 > $0.15). **Choose Machine 2.**

  *   **Imprecise Probabilities (MMEU - Conservative Updating):**
      *   Rationality Rule: Update *each prior in the set individually* using Bayes' rule. Evaluate each option by its new worst-case EV.
      *   **Machine 1:** Unchanged. Set still {P₁=0.4, P₂=0.8}. Worst-Case EV = **-$0.05** (using P₁=0.4).
      *   **Machine 2:** Original set: All P ∈ [0,1]. Update each prior P₀ using Bayes:
          *   Likelihood of 10 greens given P₀ is (P₀)¹⁰.
          *   Posterior for any P₀ is proportional to (P₀)¹⁰ * (Prior Density over P₀).
          *   **Crucial Point:** Because the original set included priors arbitrarily concentrated near 0, there are updated priors *arbitrarily concentrated near 0* (just with very low likelihood). The *set* of possible posteriors P(green) still includes values arbitrarily close to **0** (though most weight is near 1).
      *   **Worst-Case Prior for Machine 2:** The prior concentrated near P(green)=0. Its posterior remains concentrated near 0. Worst-Case EV ≈ 0.0 * $1 - $0.45 = **-$0.45**.
      *   **Decision:** The worst-case for Machine 1 (-$0.05) is *still vastly better* than the worst-case for Machine 2 (-$0.45). **Choose Machine 1.**

  **The Disagreement:** After seeing 10 greens from Machine 2:
  *   **Bayesian (Averaged Prior):** Strongly prefers Machine 2 (EV ≈ +$0.47 vs +$0.15).
  *   **Imprecise (MMEU):** Strongly prefers Machine 1 (Worst-Case EV ≈ -$0.05 vs -$0.45).

  ### Why This Happens & What's Lost by Averaging

  1.  **Representing Genuine Ignorance vs. Risk:**
      *   Machine 1 represents *risk* (known possible probabilities: 0.4 or 0.8). Machine 2 represents *ambiguity* or *Knightian uncertainty* (complete ignorance about the process).
      *   Averaging over Machine 2's [0,1] *imputes knowledge you don't have* (e.g., "it's equally likely to be any probability"). Imprecise probabilities try to directly represent the lack of knowledge. Seeing 10 greens reduces but doesn't *eliminate* the ambiguity for Machine 2 – you still don't know the *type* of machine or its *true underlying propensity*. The set of priors captures this residual ambiguity; the average washes it out.

  2.  **The Weighting Problem is Fundamental:**
      *   Your proposal ("uniform over the extreme points if you've got no better idea") *is* an arbitrary choice. There is *no evidence* justifying a uniform weighting over the factories for Machine 1, or a uniform prior over [0,1] for Machine 2. Imprecise probabilities avoid making this arbitrary commitment. Averaging forces a specific commitment where none is justified by evidence. MMEU is a decision rule designed for this lack of justification.

  3.  **Widening Intervals & Conservative Updating:**
      *   Your friend is right, intervals *can* rationally widen. Suppose you initially believe P(green) ∈ [0.4, 0.8] for Machine 1. Then you learn the machine *might* have been damaged during shipping, potentially making P(green) as low as 0.2, but you have no idea *how likely* this damage is. Your new set becomes [0.2, 0.8]. The interval widened, reflecting increased ambiguity. A Bayesian *must* assign a specific probability to the damage event to update their average, which is arbitrary. The imprecise model incorporates the new possibility without forcing an arbitrary weight.

  4.  **Ellsberg and Human Behavior:**
      *   Yes, this is directly connected to the Ellsberg Paradox. People consistently prefer betting on urns with known probabilities (like Machine 1) over urns with unknown compositions (like Machine 2), *even when the known probability is worse than the average of the unknown*. They exhibit "ambiguity aversion." The imprecise probabilities/MMEU approach provides a *rational* model for this aversion: it's rational to protect against the worst-case scenario when you lack the knowledge to justify a single probabilistic model. Averaging cannot explain this preference pattern normatively.

  ### Normative Claim vs. Description

  *   **Your Friend's Claim (and the core imprecise prob claim):** This is **primarily a normative claim about rationality**. It argues that when evidence is genuinely insufficient to determine a unique probability distribution (like not knowing the factory or anything about Machine 2), rationality does *not* require (or even permit) arbitrarily picking a single prior or weighting. Rational belief should reflect the ambiguity, and rational decisions under ambiguity should account for the potential downsides (via rules like MMEU). Averaging smuggles in information (the weights) that isn't actually justified by the evidence.
  *   **Descriptive Aspect:** The Ellsberg paradox shows people *do* behave this way descriptively. Imprecise probabilities offer a rationalization for that behavior, contrasting with standard Bayesianism which often labels it "irrational."

  ### Where it "Bites" Summarized

  1.  **Sequential Decisions with Ambiguous Options:** As shown above, after strong evidence favoring the ambiguous option on average, MMEU can still favor the risky option due to residual ambiguity.
  2.  **Ambiguity Aversion:** Rational agents using MMEU will reject bets on ambiguous events at prices where Bayesians using an average would accept them (e.g., betting on Machine 2 at $0.45 *after* seeing 10 greens). The interval doesn't just say "average is X", it says "possible values include Y (which makes this bet bad)".
  3.  **Incorporating New Uncertainties:** When new sources of ambiguity arise (like potential machine damage), the imprecise model handles them more naturally without recourse to arbitrary new priors over meta-hypotheses.

  **In essence:** Collapsing to the average loses information about the *range of defensible interpretations* of your evidence and the *potential for severe downside scenarios*. Imprecise probabilities argue that rational belief and decision-making should sometimes be sensitive to this range and potential downside, not just the average, especially when the weights underlying the average are arbitrary. The disagreement isn't about computation; it's about what constitutes rational belief and choice under severe uncertainty. Your friend is arguing that the interval represents a deeper state of ignorance than the average can capture, and that rationality demands different decisions in that state. The case above provides the numerical disagreement you sought.
