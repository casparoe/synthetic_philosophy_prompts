prompt: |-
  I'm in a seminar on comparative economic history and global history, currently in the unit on the Great Divergence, and before I start writing my paper I want to settle on the standard I'm going to be held to. So: write me the desiderata that any adequate answer to the Needham-style question — why Britain and not China? — has to meet. Take the purpose as fixed: an answer is adequate if it would survive the strongest objection each camp in the literature would raise against it, at seminar-paper length. I don't want a bibliography or reading list, and please don't lean on my being able to look anything up: everything you use should be either in the givens below or reconstructible from what any educated reader already knows.

  The givens we've been working with (if you think one of them is false, argue it in the collisions section rather than quietly dropping it):

  (a) On the measures our readings use — real wages, urbanization, commercial density, agricultural productivity — the richest regions of China and of Europe look broadly comparable well into the eighteenth century.
  (b) The sustained break — self-reinforcing growth in output per head, tied to a shift toward fossil-fuel energy and mechanized production — happened first in one small corner of northwestern Europe.
  (c) Both sides had large bureaucratic states, extensive markets, and deep traditions of technical skill.
  (d) "Britain" and "China" are not comparable units: one is a small island polity, the other a continent-scale empire, so the civilization-level comparison compares objects of very different size and internal variety.

  What I want is the specification, not yet another answer. Here is my own half-finished list, which I'd like you to correct, extend, and re-cut rather than simply confirm — the thinking is supposed to be in the criteria, so tell me which of these are genuine desiderata and which are just the prejudices of one camp:

  - contrast-class sensitivity: an answer must say why the contrast is drawn where it is — why not India, Japan, or the Ottoman Empire as the comparator — and whether the answer would change shape if a different comparator were substituted;
  - an intra-European test: if the answer is really about Britain, it should also explain why the break happened there and not in the commercially advanced regions of the Low Countries or northern Italy, which shared many of the same supposed advantages;
  - the grain problem: the causal claim has to be stated at a level of aggregation at which it could be checked, given (d);
  - a swap test: if the answer cites factor F, it must explain why other places that also had F did not break through;
  - a symmetry test: the same feature must be described in vocabulary that applies to both units, so that, say, a strong state counts as capacity on one side and as despotism on the other only if the asymmetry is earned;
  - a mechanism requirement: a named pathway rather than a correlation, with the step from wages, energy prices, or state finances to the actual investment and invention decisions;
  - a timing requirement: why then, and not during the earlier commercial and technical flowerings on either side;
  - a splintering question: whether there is one divergence or several, since the crossings in urbanization, real wages, energy use, and scientific practice need not coincide;
  - a falsifier requirement: some specification of what would have to be true for the answer to be wrong, and of what kind of evidence could in principle discriminate;
  - no definitional cheating: the explanandum must not be defined so that only the winner could have satisfied it;
  - the scale of the causal claim: difference-maker against a background of shared conditions, versus sufficient condition, versus mere triggering contingency;
  - microfoundations: whether the account has to work at the level of household and firm decisions, or whether structural and Marxist-style accounts can refuse that demand.

  Write it in American English, in the following sections:

  1. "The explanandum" — about 150 words. Fix what exactly is being explained, and give your verdict on whether the question as posed is well posed; if it isn't, state the reformulation (or the several narrower questions it should be split into).

  2. "The desiderata" — about 700 words. A numbered list of the requirements an adequate answer must meet, each with the case or consideration that motivates it, each tagged as non-negotiable or as a preference of a particular camp, and each with a note on what it excludes. Include any requirement I missed.

  3. "Where the desiderata collide" — about 300 words. Which subsets cannot be jointly satisfied, and what follows from that: does the list itself show that no answer of the kind people want is available, or only that answers must be conjunctural, hedged, or reformulated? Name the single requirement that knocks out the largest number of familiar answers, and say why.

  4. "Scorecard" — about 300 words. A compact table rating the familiar families of answer against the list: the coal-and-colonies ecological windfall, the institutions-and-property-rights answer, the culture-and-religion answer, the high-level-equilibrium-trap line, and the revisionist answer that treats the late date of the break as the main point. One row each, with the single cell that most damages it.

  5. "My rubric" — about 100 words. The one sentence I should put at the top of my paper as the standard I'm trying to meet.
reasoning: |-
  Hmm, the user is in a seminar on comparative economic history focusing on the Great Divergence, specifically the "Why Britain and not China?" question. They're preparing to write a paper and want to establish clear criteria for what would constitute an adequate answer. They've provided some givens and their own preliminary list of desiderata, asking me to refine and extend it rather than just confirm.

  The user's givens are important: (a) China and Europe were comparable in key economic metrics until the 18th century; (b) the breakthrough happened specifically in NW Europe; (c) both had similar institutional features; and (d) the units are mismatched in scale. Their existing desiderata include things like contrast-class sensitivity, intra-European tests, and mechanism requirements - but I need to evaluate which are essential versus which reflect particular scholarly biases.

  For the explanandum section, I'll clarify that the core question needs refinement. "Why Britain and not China?" as phrased is problematic due to scale mismatch. Better to explain: why sustained industrial growth emerged first in Britain despite comparable development in advanced Chinese regions, and why China didn't experience parallel breakthroughs despite similar potential. This maintains the spirit while acknowledging the scale issue.

  For the desiderata list, I'll organize it into numbered requirements. The user's "contrast-class sensitivity" becomes #1 but needs sharpening - it should explicitly address why Britain vs. Yangtze Delta is valid despite scale difference. Their "intra-European test" (#2) is crucial to avoid Anglocentric explanations. The "grain problem" (#3) tackles unit mismatch directly. The "swap test" (#4) is vital for causal claims. "Symmetry test" (#5) prevents biased framing. "Mechanism requirement" (#6) is non-negotiable for credible causality. "Timing requirement" (#7) addresses why 18th century specifically. "Splintering question" (#8) acknowledges divergence wasn't monolithic. "Falsifier requirement" (#9) ensures testability. "No definitional cheating" (#10) prevents circularity. "Scale of causal claim" (#11) clarifies explanatory ambition. "Microfoundations" (#12) remains debatable between camps. I'll add "Pathway specificity" (#13) to address how initial advantages became self-sustaining.

  In the collisions section, I'll note tensions between microfoundations and structural explanations, the grain problem versus civilizational comparisons, and conjunctural explanations versus parsimony. The grain problem (#3) is particularly damaging to many existing theories.

  For the scorecard, I'll evaluate major theories against these criteria: Coal/colonies fails on swap test; institutions fails on intra-European test; culture fails on symmetry; high-equilibrium trap fails on timing; revisionism struggles with mechanism.

  The rubric should emphasize that an adequate answer must explain the specific 18th century British breakthrough through conjunctural factors operating at regional level, with demonstrated causal pathways, while accounting for non-occurrence in comparable advanced Chinese regions.
answer: |-
  ### 1. The Explanandum  
  The core explanandum is **why sustained, self-reinforcing industrial growth—characterized by rising output per capita driven by fossil-fuel mechanization—first emerged in Britain (specifically England) by the late 18th century, despite comparable levels of development in the most advanced regions of China (e.g., the Yangtze Delta) earlier in the century**. The question "Why Britain and not China?" is ill-posed due to scale mismatch (given d). It should be split:  
  - Why did the breakthrough occur specifically in Britain, not in other European commercial hubs (e.g., Netherlands)?  
  - Why did comparable advanced regions of China (not the whole empire) fail to generate a parallel breakthrough despite similar economic indicators?  
  This reformulation preserves the divergence’s core while respecting scale and regional heterogeneity.  

  ---

  ### 2. The Desiderata  
  An adequate answer must meet these 13 criteria:  

  1. **Contrast-Class Sensitivity** (Non-negotiable)  
     *Why*: To avoid arbitrary comparisons. Must justify why China (Yangtze Delta) is the primary comparator over, e.g., Japan or India, and whether substituting it alters the explanation.  
     *Excludes*: Answers assuming China is the "natural" counterfactual without argument.  

  2. **Intra-European Test** (Non-negotiable)  
     *Why*: Given (b) and (c), Britain’s uniqueness within Europe must be explained. An answer citing "British" factors (e.g., property rights) must show why they didn’t trigger growth in the Netherlands or N. Italy.  
     *Excludes*: Anglocentric factors shared by other European leaders.  

  3. **Grain Problem Resolution** (Non-negotiable)  
     *Why*: Given (d), causal claims must operate at comparable scales (e.g., England vs. Lower Yangtze). Cannot treat "China" monolithically.  
     *Excludes*: Civilizational explanations ignoring regional variation.  

  4. **Swap Test** (Non-negotiable)  
     *Why*: To isolate true difference-makers. If factor *F* (e.g., coal access) is cited for Britain, explain why *F* in similarly developed regions (e.g., N. China coal fields) didn’t suffice.  
     *Excludes*: Factors present in non-diverging regions.  

  5. **Symmetry Test** (Non-negotiable)  
     *Why*: Prevents evaluative bias (e.g., "European dynamism" vs. "Chinese stagnation"). Describe institutions, markets, or cultures in neutral terms applicable to both.  
     *Excludes*: Loaded dichotomies (e.g., "rational" vs. "despotic") without evidence.  

  6. **Mechanism Requirement** (Non-negotiable)  
     *Why*: Given (a)–(c), macro-correlations are insufficient. Specify *how* factors (e.g., energy costs) translated into micro-level innovation/investment decisions.  
     *Excludes*: "Black box" links (e.g., "markets caused innovation").  

  7. **Timing Specificity** (Non-negotiable)  
     *Why*: Must explain why the breakthrough occurred c. 1750–1800, not during earlier commercial peaks (e.g., Song China or Renaissance Italy).  
     *Excludes*: Perennial factors (e.g., "Western science") without historical context.  

  8. **Splintering Analysis** (Preference: Revisionist/Conjunctural camps)  
     *Why*: Urbanization, wages, and energy use diverged at different times. Must clarify if explaining one facet or the full bundle, and address lags.  
     *Excludes*: Treating divergence as a single event.  

  9. **Falsifier Requirement** (Non-negotiable)  
     *Why*: Ensures testability. State what evidence would refute the claim (e.g., "If Qing land taxes were below X%, my fiscal argument fails").  
     *Excludes*: Unfalsifiable cultural or geographic determinism.  

  10. **No Definitional Cheating** (Non-negotiable)  
      *Why*: The explanandum cannot presuppose the outcome (e.g., defining "industrial revolution" as requiring British-style factories).  
      *Excludes*: Teleological reasoning.  

  11. **Causal Scale Clarity** (Preference: Institutional/Marxist camps)  
      *Why*: Specify if factors are necessary/sufficient, or conjunctural (e.g., coal + colonies + institutions). Avoids overclaiming.  
      *Excludes*: Monocausal sufficiency claims.  

  12. **Microfoundations Defense** (Preference: Neoclassical/Marxist camps)  
      *Why*: Structural accounts must justify *why* they reject methodological individualism (e.g., by showing firm/household data is irrelevant or unobtainable).  
      *Excludes*: Hand-waving about "structures" without agency.  

  13. **Pathway to Self-Reinforcement** (Non-negotiable)  
      *Why*: Given (b), must explain how initial advantages became self-sustaining (e.g., via feedback loops between innovation and market size).  
      *Excludes*: Static comparisons of pre-conditions.  

  ---

  ### 3. Where the Desiderata Collide  
  The grain problem (#3) and intra-European test (#2) are the most destabilizing: they force explanations to the *regional* level, contradicting civilizational narratives. This clashes with cultural accounts (#5 symmetry) that rely on broad civilizational traits, and with revisionism (#8 splintering) that downplays regional specificity. **Consequence**: Adequate answers *must* be conjunctural (#11), combining factors unique to *18th-century Britain* (e.g., cheap coal + Atlantic trade + state capacity) that were absent in the Yangtze Delta despite comparable development. The single requirement knocking out most answers is **#4 (swap test)**: popular factors (e.g., markets, proto-industry) existed in China but didn’t trigger breakthrough, demanding combinatorial explanations.  

  ---

  ### 4. Scorecard  
  | **Theory**               | **Fatal Flaw (Desideratum Violated)**       |  
  |--------------------------|--------------------------------------------|  
  | Coal & Colonies          | Fails swap test (#4): N. China had coal; Spain had colonies but no breakthrough. |  
  | Institutions (e.g., property rights) | Fails intra-European test (#2): Dutch institutions were superior pre-1750. |  
  | Culture (e.g., Protestantism) | Fails symmetry test (#5): Portrays Chinese culture as statically "inhibiting" despite earlier innovations. |  
  | High-Equilibrium Trap    | Fails timing (#7): Why didn’t trap "spring" in Song or Ming China? |  
  | Revisionism (late break) | Struggles with mechanism (#6): If divergence was late/contingent, what *caused* acceleration c. 1800? |  

  ---

  ### 5. My Rubric  
  > "An adequate explanation must identify a *conjuncture* of factors, operating at regional scale and verifiable through symmetric comparison, that triggered self-reinforcing growth in 18th-century Britain but not in the Lower Yangtze Delta—with a documented causal pathway from initial conditions to sustained innovation, and falsifiable claims about why functionally similar factors elsewhere failed to produce analogous outcomes."  

  This rubric enforces #2–7, #11, and #13 while allowing flexibility on #8 and #12.
