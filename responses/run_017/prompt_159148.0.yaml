prompt: |-
  Hey — I run a small reading group on national memory, and before we read anything I want to get straight what I should actually be demanding of an explanation of lost-cause myths. Not a general theory of nationalism, and not a history of any one case. I want something I could hand to someone looking at a fresh defeat — a lost war, a lost election that half the country says was stolen, a referendum that went the wrong way, a colony handed back — and have them say: will this harden into a myth, roughly how long will that take, and what shape will it take (moral vindication? a promised return? a rescue that never counts as a defeat?).

  So write me the spec. What does a theory of how defeats turn into sacred national myths have to get right? The cases it has to handle, the distinctions it must not collapse, the patterns it has to predict rather than only accommodate afterwards — each with the case or consideration that makes it a requirement. Mark which requirements are genuinely binding and which are just the preferences of one camp.

  Four things I want you to take a stand on rather than list:

  - the lag. I keep noticing that the myth seems to harden a generation after the actual defeat, once the people who were there are dead and can't contradict the story. Is "explain the timing" a real requirement, or am I overfitting to the four cases I know — the Confederacy, Masada, Kosovo (the medieval battle, not the 1990s one), Dunkirk?
  - the null case. Germany loses in 1918 and gets a stab-in-the-back story; it loses in 1945 and mostly doesn't get one. Same country, one myth, one non-myth. Must a theory explain non-occurrence, or is that just asking it to explain silence?
  - triviality. Masada looks militarily insignificant, Kosovo was at worst a draw, Dunkirk was a successful evacuation remembered as a rescue. Does a theory have to say why the size of the loss doesn't track the size of the myth, and why some defeats get narrated as not-defeats at all?
  - the one I keep going back and forth on: does the theory get to assume the myth is a distortion? If it builds falsity into the definition it's begging the question and can't handle a defeat that really was stolen; if it stays neutral about truth it has trouble explaining why the memories of people who were there get overwritten by people who weren't.

  Also flag any pair of requirements you think can't both be met, and if you find one, drop one of them and say why. I'd rather have the contradiction than a tidy list. My own suspicion is that "fit the famous cases" and "make falsifiable predictions about new ones" pull against each other given how few cases there are and how they got selected, but tell me if the real conflict is somewhere else.

  Then briefly — a couple of lines each, not a lit review — how the three stories people always reach for do against your list: it holds the group together, it protects the group's self-image, someone with power keeps it alive because it pays. And commit: tell me which single requirement does the most work knocking candidates out, and rank the requirements by how binding they really are, even where you're unsure. If you're guessing, guess, and say where the guess is.
reasoning: |-
  Okay, the user runs a reading group on national memory and wants a clear spec for what a theory explaining lost-cause myths must achieve. They're focused on predicting when and how a defeat turns into a myth, not general nationalism theories. 

  First, I need to unpack their four stand-taking points. The lag question about myth formation timing is crucial—they've noticed it often happens a generation later. The German null case (1918 vs 1945 myths) demands explaining why myths sometimes don't form. The triviality paradox requires accounting for why insignificant events can become huge myths. And the truth-distortion dilemma needs careful handling—the theory can't presuppose falseness but must explain memory overwriting.

  Hmm... the user's suspicion about "famous cases vs new predictions" being incompatible is sharp. But I think the real tension is between explaining variation (why some defeats mythify and others don't) while also predicting specific myth features—those might need separate theoretical layers. 

  For the three common explanations: 
  - Group cohesion theory fails the null case (why no 1945 German myth?) 
  - Self-image protection struggles with triviality (why magnify small defeats?) 
  - Elite instrumentalism is weakest on the lag—elites benefit immediately but myths solidify decades later. 

  The knockout requirement? Definitely explaining non-occurrence. If a theory can't say why myths don't form (like 1945 Germany), it's useless for prediction. 

  *adjusting framework* 
  I'll rank requirements: 
  1. Non-occurrence explanation (binding) 
  2. Variation in myth shape (binding) 
  3. Event-myth magnitude mismatch (binding) 
  4. Timing mechanism (preference—could be multi-causal) 
  5. Truth-neutral handling (binding, with careful framing) 

  The truth dilemma solution: the theory should track narrative transformation, not truth claims. Focus on how lived experience gets replaced by symbolic templates. 

  *noticing user's depth* 
  This user has clearly wrestled with these cases—their Kosovo/Masada/Dunkirk examples show nuanced pattern recognition. They'll reject superficial answers. Better emphasize testable predictions (e.g. "myths likelier when post-defeat institutions fragment") over just fitting known cases. 

  Final spec must include: 
  - Thresholds (what conditions prevent myth formation?) 
  - Morphology (why rescue vs vindication narratives dominate?) 
  - Replacement mechanism (how new generations override witnesses) 
  And explicitly sacrifice "universal shape prediction" to resolve the requirements conflict.
answer: |-
  Here’s your spec for a theory of lost-cause myth formation, designed to predict *whether*, *when*, and *how* a defeat crystallizes into sacred national memory. I’ve flagged contradictions and ranked requirements by bindingness.  

  ---

  ### **Core Requirements**  
  *(Binding = essential; Preference = useful but negotiable)*  

  1. **Explain non-occurrence (BINDING)**  
     *Why required*: The 1918 vs. 1945 Germany cases prove myths aren’t inevitable. A theory must identify conditions that *block* myth formation (e.g., total institutional rupture, unambiguous moral discrediting). Without this, it can’t predict outcomes.  
     *Case*: Post-WWII Germany had denazification, Nuremberg trials, and occupation—suppressing myth-making. Post-WWI had fragmented blame and intact reactionary institutions.  

  2. **Account for event-myth magnitude mismatch (BINDING)**  
     *Why required*: Dunkirk (tactical retreat) birthed a "miracle" myth; Masada (minor siege) became a "last stand" symbol. Kosovo (1389) was a military draw but framed as martyrdom. A theory must explain why *narrativizability* (symbolic resonance, plot potential) outweighs objective scale.  
     *Key distinction*: Don’t collapse material loss vs. *narrative utility* (e.g., defeats that fit "redemptive sacrifice" templates amplify faster).  

  3. **Predict variation in myth shape (BINDING)**  
     *Why required*: Confederacy → "moral vindication" + "promised return"; Kosovo → "eternal martyrdom"; Dunkirk → "rescue that transcends defeat". A theory must map contextual factors (e.g., *ideology of loss* – was defeat "unjust" or "redemptive"?).  
     *Critical cases*: Colonial handbacks (e.g., Hong Kong) often produce "stolen legacy" myths; stolen elections (e.g., 2020 US) risk "corrupt usurpation" narratives.  

  4. **Neutrality on truth-claims (BINDING)**  
     *Why required*: If the theory assumes myths are false, it fails when defeat *was* ambiguous (e.g., 2000 US election). Instead, track *narrative evolution*: how firsthand memories (complex, traumatic) get replaced by simplified, transmissible tropes.  
     *Mechanism*: Focus on *generation turnover* and *curation by memory entrepreneurs* (e.g., Confederate veterans rejected "noble cause" early on; myth solidified with United Daughters of the Confederacy post-1890).  

  5. **Explain timing/lag (PREFERENCE)**  
     *Why negotiable*: Lag isn’t universal. Alamo myths emerged immediately among Texans; Nazi "clean Wehrmacht" myths circulated by 1950. Timing depends on:  
     - **Crisis triggers** (e.g., Civil Rights Movement reigniting Confederate myths)  
     - **Institutional readiness** (e.g., Serbia’s 1980s revival of Kosovo myth via state media).  
     *Your cases*: Masada’s myth lagged 19 centuries! Modern revivals depend on *relevance*, not just witness death.  

  6. **Fit major cases but allow falsifiable predictions (BINDING)**  
     *Conflict alert*: Famous cases (Confederacy, Kosovo) are overstudied; new predictions risk false negatives. *Resolution*: Prioritize identifying *necessary conditions* (e.g., defeat must be "unfinished" – no closure) over case-fitting.  

  ---

  ### **Where Common Theories Fail**  
  - **"Group cohesion"**: Fails null case (1945 Germany: cohesion needed, but no myth). Misses why *specific* events are chosen.  
  - **"Protect self-image"**: Struggles with triviality (why amplify Dunkirk if avoidance would protect pride?). Doesn’t explain narrative *shape*.  
  - **"Elites instrumentalize it"**: Weak on lag (elites benefit immediately, but myths solidify later). Can’t explain grassroots myths (e.g., Masada’s Zionist revival).  

  ---

  ### **Ranking Requirements by Bindingness**  
  1. **Non-occurrence** (knockout test: eliminates "myths always form" theories)  
  2. **Truth-neutrality** (avoids tautology; handles contested defeats)  
  3. **Event-myth magnitude mismatch** (exposes narrative logic ≠ material logic)  
  4. **Predict variation in myth shape** (key for utility)  
  5. **Fit cases + new predictions** (trade-off: accept probabilistic predictions)  
  6. **Timing/lag** (useful but context-dependent)  

  ### **The Contradiction**  
  **"Explain non-occurrence" vs. "Fit famous cases"**  
  - *Conflict*: Theories tuned to explain *why* Confederacy or Kosovo myths formed may miss *why* 1945 Germany didn’t.  
  - *Resolution*: Drop "fit all famous cases" as a standalone goal. Instead, demand the theory identifies **threshold conditions** (e.g., myth requires *unresolved grievance* + *custodial institutions*). This predicts both occurrence *and* non-occurrence.  

  ---

  ### **Your Spec in a Nutshell**  
  A working theory must:  
  1. **Define necessary conditions** for myth formation (e.g., defeat perceived as *incomplete/injust*; *custodian groups* survive to curate memory).  
  2. **Predict narrative shape** based on:  
     - *Pre-existing tropes* (e.g., martyrdom cultures → Kosovo)  
     - *Pathways to reversal* (no reversal possible? → "moral victory" narratives).  
  3. **Model memory turnover**: Firsthand accounts fade → curated stories fill identity voids during later crises.  
  4. **Accept that timing is contingent**—myths ignite when *carrier groups* mobilize them for contemporary battles.  

  **Weak spot**: Predicting *which* defeats become myths remains probabilistic (e.g., why Alamo but not similar battles?). But the null case requirement forces testability.
