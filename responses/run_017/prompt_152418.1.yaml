  For the thought-ish view, it should work because the emotion stems from imagining the future event, which they believe will occur. The existence belief is there, just not about the simulation itself. This view can explain why the emotion is genuine without contradiction. 

  The quasi-emotion view struggles because it would say the terror during the simulation isn't real. But patients report genuine terror, and it's linked to a real upcoming event. Quasi-emotion might dismiss the emotion as make-believe, which doesn't align with the patients' experience. 

