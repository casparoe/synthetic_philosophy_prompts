answer: |-
  ## Adversarial Collaboration Framework: Reverse Engineering in Evolutionary Psychology

  **Part 1: Agreed Claims (The Common Ground)**

  We, representatives of "Camp A" (committed adaptationist perspective) and "Camp B" (coalition incorporating by-product/exaptation and domain-general learning perspectives), agree on the following foundational points regarding the evolutionary study of the mind:

  1.  **Natural Selection as Core Process:** Natural selection is the primary process responsible for the complex functional design observed in biological traits, including mental mechanisms. Traits conferring fitness advantages in ancestral environments are more likely to be inherited.
  2.  **Existence of Domain-Specific Adaptations:** Some mental mechanisms *are* domain-specific adaptations shaped by natural selection to solve recurrent adaptive problems faced by our ancestors (e.g., specific mechanisms underlying visual object recognition, phoneme discrimination, or certain aspects of fear conditioning).
  3.  **Design Evidence is Necessary:** Demonstrating a close, non-arbitrary "fit" between the structure of a proposed mental mechanism and the functional demands of a hypothesised ancestral adaptive problem constitutes *essential* evidence for any adaptationist hypothesis. This includes evidence of efficiency, specificity, and reliability in solving the proposed problem under ancestral conditions.
  4.  **Reverse Engineering Can Work:** The logic of reverse engineering – inferring function and selective history from structure – is sound and has demonstrably succeeded in evolutionary biology (e.g., identifying the camera eye as an adaptation for vision based on its optics, photoreceptor layout, and integration with neural processing). Sensory and perceptual systems provide clear examples within psychology where this approach has been highly productive.
  5.  **Current Function ≠ Selection History:** A trait having a current beneficial effect (current utility) does *not* entail that it was shaped by selection *for* that effect (selection-for). Traits can be exaptations (co-opted for new functions) or spandrels (by-products of selection for other traits).
  6.  **Plasticity and Learning Exist:** The human mind exhibits significant plasticity and capacity for domain-general learning, allowing individuals to adapt behaviour based on ontogenetic experience, cultural transmission, and local environmental contingencies.
  7.  **Comparative & Cross-Cultural Evidence is Relevant:** Data from other species (comparative method) and diverse human populations (cross-cultural studies) provide valuable, though not always decisive, evidence regarding the universality, developmental canalisation, and potential selective history of traits.
  8.  **The Dispute is Empirical:** The core disagreement – concerning the *prevalence* of domain-specific adaptations shaped by selection-for specific ancestral problems versus the sufficiency of by-product explanations or domain-general learning tuned by cultural/local payoffs to explain observed phenomena – is fundamentally empirical. It hinges on the interpretation of evidence for specific hypotheses, not a dispute over the validity of evolutionary theory itself.
  9.  **Hypotheses Must Be Falsifiable:** Proposals for domain-specific adaptations, by-products, or domain-general learning accounts must generate testable predictions that could, in principle, be shown false by empirical evidence.

  **Part 2: Disagreements Table**

  | Issue (Neutral Wording)                    | Camp A Position (Adaptationist)                                                                                               | Camp B Position (Coalition)                                                                                                                                                                                                                             | Crux                                                                                                                               | Jointly Accepted Test Case / Measurement                                                                                                                                | A's Predicted Outcome                                                                  | B's Predicted Outcome                                                                                                                               | Outcome Damaging to View                                                                                                                                              |
  | :----------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------ | :--------------------------------------------------------------------------------------------------------------------------------- | :---------------------------------------------------------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------------------------------------------------------------------------- |
  | **1. Prevalence & Evidential Threshold**   | The mind consists *predominantly* of domain-specific adaptations. Design evidence, converging with comparative/cross-cultural data, provides *strong* confirmation for specific adaptation hypotheses, especially when alternative explanations are demonstrably weaker. | Design evidence alone provides only *weak* confirmation for specific adaptation hypotheses. The space of plausible adaptive stories is vast; convergence is often ambiguous; domain-general learning or by-product explanations are frequently sufficient and more parsimonious. | **What level of design evidence convergence, and what failure of alternative models, is required to strongly support a *specific* selection-for hypothesis?** | **Matched-Control Requirement:** For any proposed adaptation (e.g., cheater-detection module), identify a structurally adjacent trait plausibly explained as a by-product (e.g., general logical constraint violation detector). Pre-specify the precise behavioural/cognitive pattern that distinguishes them *before* data collection. | The adaptation hypothesis predicts a distinct, specific pattern not predicted by the by-product hypothesis. | The adaptation and by-product hypotheses predict statistically indistinguishable patterns, or the by-product hypothesis fits better. | **A:** Data shows indistinguishable patterns or better fit for by-product. **B:** Data shows a clear, specific pattern *only* predicted by the adaptation hypothesis. |
  | **2. Plasticity & Environmental Tracking** | Core domain-specific adaptations exhibit **tuning**: they reflect *ancestral* problem statistics, show significant lag to recent environmental changes, and resist re-tuning to reversed payoffs within an individual lifetime. | Many putatively "adapted" biases reflect **tracking**: they are calibrated by an individual's *own* reinforcement history or cultural input, showing rapid adjustment to reversed payoffs or changed base rates within an individual lifetime or one generation. | **Does the adaptive asymmetry primarily track the *ancestral* environment statistics (Tuning) or the *individual's* reinforcement history/current environment statistics (Tracking)?** | **Tuning-Tracking Probe:** *Task:* Modified Threat-Detection Task. Participants rapidly classify ambiguous stimuli as "threat" or "non-threat". *Manipulation:* Asymmetric payoffs: High cost for missing a threat (False Negative), low cost for false alarm (False Positive) - mimicking ancestral predator avoidance. Payoffs are then reversed (High cost for False Alarm, low cost for False Negative) in-lab. *Populations:* (a) Main population; (b) Group whose ancestors migrated >10 generations ago to an environment where the ancestral threat was absent/payoff asymmetry reversed; (c) Recent immigrants (<1 gen) from that environment. *Measure:* Bias magnitude (False Alarm Rate) under original and reversed payoffs. | Bias persists strongly after payoff reversal (high False Alarm Rate even when costly). Bias magnitude correlates with ancestral group environment (e.g., higher in recent immigrants). Minimal shift within session. | Bias rapidly adjusts to reversed payoffs within the session. Bias magnitude correlates primarily with individual reinforcement history (e.g., accumulated rewards/punishments in task) or current cultural group, not ancestral origin. Significant shift within session. | **A:** Bias fully tracks individual reinforcement within session; no correlation with ancestral group. **B:** Bias shows no adjustment to reversal & strong ancestral group correlation even after lifetime in new environment. |
  | **3. Predictive Power in Novelty**         | Domain-specific adaptations predict systematic, often maladaptive, responses in evolutionarily novel environments because mechanisms are optimised for ancestral problems. | Domain-general learning models, fitted to individual experience and learning capacities, will predict behaviour in novel environments at least as well as, or better than, models based solely on putative ancestral adaptations. | **Which framework better predicts behaviour in carefully constructed evolutionarily *novel* settings?** | **Novel-Environment Prediction:** *Task:* A novel economic exchange game with complex, arbitrary rules and payoffs unlike any ancestral social interaction (e.g., involving abstract tokens, non-intuitive reputation mechanisms). *Pre-Registration:* Camp A commits to predicting specific, systematic biases (e.g., defaulting to "cheater" suspicion based on perceived asymmetry, even if irrelevant to new rules). Camp B commits to fitting a reinforcement learning model to participants' trial-by-trial choices. *Measure:* Predictive accuracy of the adaptationist model (using pre-registered bias sign) vs. the fitted domain-general learning model on held-out test trials. | The pre-specified adaptationist bias pattern is observed and the adaptationist model predicts significantly better than chance, while the domain-general model performs poorly initially. | The fitted domain-general learning model predicts behaviour significantly better than the pre-specified adaptationist model. The adaptationist model performs no better than chance. | **A:** Domain-general model predicts significantly better. **B:** Pre-specified adaptationist model predicts significantly better than the domain-general model. |

  **Part 3: Verbal Disputes and Coalition Fault Lines**

  1.  **Verbal Dispute: The Meaning of "Adaptation":** A significant portion of apparent disagreement stems from differing usages of "adaptation." Camp A typically reserves the term for traits shaped by *selection-for* their current function (narrow historical sense). Camp B often uses it more broadly to include traits that are currently adaptive, regardless of origin (current utility sense), or may conflate it with "adaptive." **Resolution:** The document should consistently use "adaptation" only in the narrow historical sense (selection-for) and use "currently adaptive" or "functional" for present utility. This clarifies that Camp B's skepticism targets the *inference to selection-for*, not necessarily the trait's current functionality.
  2.  **Verbal Dispute: Evidentiary Threshold:** Another potential verbal element concerns "strong" vs. "weak" confirmation. Both sides agree design evidence is *necessary* (Claim 3). The dispute is over whether it (and convergent evidence) is ever *sufficiently strong on its own* to warrant a confident inference to a *specific* selection-for hypothesis, given the space of alternatives. Camp A sees well-developed design evidence as often sufficient; Camp B demands specific failures of alternative models or direct historical evidence before deeming it sufficient. This reflects differing standards for when the evidence meets the burden of proof, rather than a fundamental disagreement about the logic.
  3.  **Coalition Fault Line: By-Product vs. Domain-General Learning:** Camp B's wings *would* disagree on specific explanations:
      *   **By-Product Wing:** Would argue that even if a bias *doesn't* track individual reinforcement (e.g., persists in the Tuning-Tracking Probe), it doesn't automatically mean it's a direct adaptation. It could be a spandrel of another adaptation (e.g., a general negativity bias) or an exaptation. Their positive case relies on identifying the source trait.
      *   **Domain-General Learning Wing:** Would argue that if a bias *does* track individual reinforcement robustly (e.g., adjusts fully in the Tuning-Tracking Probe), this demonstrates the sufficiency of domain-general processes, making a domain-specific adaptation hypothesis unnecessary. They see reinforcement history as the primary driver.
      *   **Crux for B-internal Disagreement:** If a trait shows *resistance* to change (suggesting it's not easily learned), does that favour the By-Product wing (spandrel) or the Adaptationist wing (domain-specific adaptation)? The By-Product wing needs to specify the *source* adaptation whose constraints produce the observed spandrel pattern.

  **Recommended Small Grant Study**

  The most informative single study, addressing a core empirical crux and incorporating key agreed principles, would be a rigorous investigation of the **Tuning-Tracking Question**, incorporating the **Matched-Control Requirement**.

  *   **Focus:** Investigate a putatively domain-specific adaptation (e.g., threat-avoidance bias, cheater-detection bias, kinship-inference mechanism) and a closely matched plausible by-product control.
  *   **Design:**
      1.  **Population Sampling:** Recruit distinct groups differing in relevant ancestral environmental statistics (e.g., recent immigrants from low-predation areas, long-term descendants, control group; or groups with historically different social structures relevant to the control trait).
      2.  **Core Tuning-Tracking Manipulation:** Implement the payoff reversal/manipulation within the experimental task (as per Probe description above).
      3.  **Matched Control Trait:** Include a task measuring the proposed by-product source trait (e.g., general negativity bias, general logical constraint sensitivity) alongside the putative adaptation task.
      4.  **Measure:** Quantify bias magnitudes, plasticity (shift under manipulation), correlation with ancestral group, correlation with individual reinforcement history within the task, and correlation with the matched control trait.
  *   **Pre-Registration:** Crucial. Pre-specify: the exact hypotheses (including null); the precise distinguishing patterns for adaptation vs. by-product; the primary analyses; A's prediction of ancestral-group correlation and resistance; B's prediction of reinforcement-tracking correlation and plasticity; predictions for the control trait relationship.
  *   **Why Informative?**
      *   **For A:** Finding robust ancestral-group correlation, resistance to payoff reversal, and a *dissociation* from the matched control trait would strongly support their view of a tuned adaptation. Failure would be damaging.
      *   **For B (Both Wings):** Finding strong reinforcement-tracking correlation, significant plasticity under reversal, and/or a strong *association* with the matched control trait would support either the sufficiency of learning (Domain-General wing) or the by-product explanation (By-Product wing). Rigorous failure of the adaptation hypothesis weakens A's core claim. Finding resistance *without* a clear dissociation from the control trait favours the By-Product wing within B.
      *   **The Null:** Finding no clear pattern, or patterns inconsistent with *all* pre-registered predictions, would challenge the specific hypotheses tested but also highlight the difficulty of the enterprise, potentially favouring B's skepticism about strong confirmation for specific stories.
  *   **Result as Ammunition vs. Information:** Both sides commit in advance to interpreting the pre-registered outcomes as specified in the "Outcome Damaging to View" column of the Tuning-Tracking row. A result clearly supporting one side over the other on this crux would be accepted as informative progress. Interpreting ambiguous results or focusing solely on post-hoc explanations would constitute treating it as "ammunition." The joint pre-registration and focus on pre-specified distinctions (Tuning vs. Tracking, Adaptation vs. Matched Control) are key to making the result informative.
