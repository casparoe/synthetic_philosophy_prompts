answer: |-
  ### Scenario
  At a philosophy conference with 1,000 attendees, a fair coin flip determines how name tags are distributed. If heads (H_heads), tags are assigned in order of registration: the first registrant gets tag 1, the second tag 2, etc. If tails (H_tails), tags are shuffled and distributed randomly. You are an early registrant with a known tendency to arrive first at events. Upon arriving, you receive your tag and immediately notice it is **tag 1**. Your evidence E is "I have tag 1". Non-anthropic priors are equal (P(H_heads) = P(H_tails) = 0.5) because the coin flip is fair and both hypotheses explain the conference setup equally well. Both hypotheses posit exactly 1,000 observers, and under both, exactly one person has evidence E (tag 1). The key is your background knowledge: you know you are exceptionally likely to register first if H_heads is true, but under H_tails, tag 1 is random.

  ### SSA Computation
  **Reference class: People with early-registration tendencies (size = 10)**  
  This class includes only attendees with a documented history of being first in line (e.g., based on past events). Under H_heads, tag 1 must be one of them. Under H_tails, tag 1 is random and could be anyone.  
  - P(E | H_heads): If H_heads, tag 1 is held by one of the 10 early registrants. You have a 1/10 chance of being that person.  
  - P(E | H_tails): If H_tails, tag 1 is random. Probability you (in the reference class) have it is 1/1,000.  
  Posterior:  
  P(H_heads | E) = [P(E | H_heads) * P(H_heads)] / [P(E | H_heads) * P(H_heads) + P(E | H_tails) * P(H_tails)]  
  = [(1/10) * 0.5] / [(1/10 * 0.5) + (1/1000 * 0.5)] = [0.05] / [0.05 + 0.0005] ≈ 0.9901  
  SSA is ≈99% confident in H_heads.  

  **Narrower reference class: Only people with your exact evidence (size = 1)**  
  The class is just you (since only one person has tag 1).  
  - P(E | H_heads) = 1 (if you're the only one with E, and H_heads is true, you must be the first registrant).  
  - P(E | H_tails) = 1 (similarly, under H_tails, you have E).  
  Posterior: P(H_heads | E) = [1 * 0.5] / [1*0.5 + 1*0.5] = 0.5.  
  No shift.  

  **Wider reference class: Everyone alive (size = 8 billion)**  
  - P(E | H_heads) = 1/8e9 (probability a random person is you and has tag 1).  
  - P(E | H_tails) = 1/8e9.  
  Posterior: P(H_heads | E) = 0.5.  
  No shift.  

  ### SIA Computation
  SIA weights hypotheses by number of observers matching your evidence.  
  - Under H_heads: Exactly 1 observer has evidence E (tag 1).  
  - Under H_tails: Exactly 1 observer has evidence E.  
  SIA posterior:  
  P(H_heads | E) ∝ P(H_heads) * 1 = 0.5  
  P(H_tails | E) ∝ P(H_tails) * 1 = 0.5  
  No shift from the 0.5 prior.  

  ### Decision
  Choose between:  
  - **Option A**: Bet $100 on H_heads. If correct, win $200 total (+$100 net); if wrong, lose $100.  
  - **Option B**: Bet $100.01 on H_tails. If correct, win $200.01 total (+$100 net); if wrong, lose $100.01.  

  **SSA agent (99% confident in H_heads):**  
  - EU(A) = (0.99 * 100) + (0.01 * (-100)) = 99 - 1 = 98  
  - EU(B) = (0.99 * (-100.01)) + (0.01 * 100) = -99.01 + 1 = -98.01  
  Chooses A (bets on H_heads).  

  **SIA agent (50% confidence in both):**  
  - EU(A) = (0.5 * 100) + (0.5 * (-100)) = 0  
  - EU(B) = (0.5 * 100) + (0.5 * (-100.01)) = 50 - 50.005 = -0.005  
  Chooses A (since EU(A) > EU(B)).  
  To make SIA choose B, adjust Option B to pay $101 net if H_tails wins (stakes: +$101 if H_tails, -$100 if not). Then:  
  - EU(B) = (0.5 * 101) + (0.5 * (-100)) = 50.5 - 50 = 0.5 > 0 = EU(A).  
  SIA now chooses B.  

  ### Isolate the Feature
  The key feature is the background knowledge that your personal trait (early-registration tendency) makes you more likely to have the datum (tag 1) under H_heads. Remove this by altering the datum to something equally likely under both hypotheses: **"I have a tag number divisible by 10"**.  
  - Under H_heads: 100 tags are divisible by 10 (tags 10, 20, ..., 1000).  
  - Under H_tails: 100 tags are divisible by 10 (random assignment).  
  - SSA (with any reference class) and SIA both yield P(H_heads | E) = 0.5 (no shift).  
  The anthropic effect vanishes because the datum no longer interacts with your personal trait.  

  ### Criticism from SIA Defender
  **Strongest objection**: "The reference class 'people with early-registration tendencies' is arbitrary and hypothesis-dependent. It cherry-picks a class that makes H_heads likely, but a fixed class (e.g., 'all attendees') removes the shift. SSA should use a reference class fixed before the hypothesis is known, not tailored to it."  

  **Honest read**: The objection works if reference classes must be hypothesis-independent. In a fixed class (e.g., all attendees), SSA gives no shift (P(E | H_heads) = 1/1000, P(E | H_tails) = 1/1000). However, SSA allows reference classes based on background knowledge (like your tendency), which is not ad hoc. If this is rejected, the case fails; otherwise, it holds. The constraint needing to relax is that the reference class must be fixed across hypotheses—otherwise, all constraints are satisfied.  

  ### Summary
  The case meets all constraints, with SSA yielding 99% confidence due to a reference class incorporating personal background knowledge, while SIA remains at 50%. The feature enabling this is the datum's dependence on a personal trait under one hypothesis. If a fixed reference class is required, the shift vanishes.
