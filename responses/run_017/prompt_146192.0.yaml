prompt: |-
  I've been reading the rationalist blogs and forums for something like fifteen years, and for the last five I've done a fair amount of forecasting on the side: tournament-style questions, some institutional forecasting adjacent to my job, and a standing argument with a group of friends about how long large human institutions last. I'm writing up my own forecasting epistemology so the group can attack it, and what I want from you is an audit rather than an explanation. Assume I already know the standard material: base rates, the planning fallacy, inside versus outside view, reference class arguments, calibration, log-loss scoring, the Tetlock-style results about who forecasts well and why. Please don't give me reading suggestions or tell me to go get better data; I want the conceptual audit stated in its own terms.

  Here is roughly where I have landed.

  1. Outside view first. I treat the inside and outside views as rival methods for producing the same number, and my rule for adjudicating between them is: anchor on the base rate for the reference class, and let the inside view move you off that anchor only to the extent that the inside view has itself been validated out of sample. In practice this means the adjustment is small, and that when someone's inside view moves them a long way from the base rate, I want to see a track record before I follow them.

  2. Reference classes are selected causally, not by surface similarity. I don't think putting two polities in the same class because both are large, or because both get called empires, or because both are wealthy, tells me anything. What matters is whether the same generative process is producing the outcome. So the relevant classes are things like fiscal-military strain after a long commercial expansion, succession crises in systems with weakly specified succession, legitimacy collapse after a legitimacy-bearing narrative fails, and so on. If the failure mode matches, I'll put two very differently sized and very differently dated polities in the same class; if it doesn't, I won't, however similar they look from the outside.

  3. There are no unique events. Every event belongs to some reference class, and the claim that this time is different is almost always the inside view wearing a disguise. I take this to be a claim about intellectual hygiene rather than about metaphysics: refusing to name a reference class is usually just a way of refusing to be scored.

  4. Constant hazard for polities. Unlike organisms, polities have no built-in senescence, and unlike machines they have no obvious wear-out part, so my default model for how long one lasts is the constant-hazard one: conditional on having survived to time t, expected remaining lifetime is roughly the same as it was at the start. I use as my anchor a rough working figure for the average completed lifespan of large polities in the historical record, somewhere between two and four centuries; I don't care about the exact value and I'd rather you argued about the structure than the number. I also don't worry that the historical record is a sample of polities that have already ended. I've never seen a clean argument that this selection pushes the number in a particular direction, so I use the average of the completed cases as my forecast for the remaining life of a polity that is still alive and already old.

  5. Scoring discipline. I report calibrated probabilities, I score myself with log loss, and I think the honest answer to a fifty-year question is often just the base rate with wide error bars attached. I would rather publish an uninformative-looking distribution that is calibrated than a confident one that is not.

  6. The verdict I have actually published: roughly even odds, maybe a little better than even, that the present American constitutional order does not survive in recognizable form to 2100. A substantial part of the weight here comes from the fact that the run since the 1860s, and especially since 1945, is unusually long and unusually untested by historical standards. My reasoning is that long untested runs are fragile: a system that has not recently been stress-tested accumulates unexercised failure modes, degraded norms, and a governing class that has never had to actually use the emergency provisions, and so the next test is more likely to break it rather than less.

  7. I try to apply the same machinery to my own corner of the world, where I have much more inside information: I expect the current structure of the AI industry to look substantially different in ten years, on base rates for fast-moving concentrated industries, and I don't think being inside that world gives me much of an epistemic edge over the base rate.

  What I want from you: go through this set and tell me which pairs are in genuine tension and which only look like they are, ordered by severity rather than listed as equally bad. For each real tension, say what would have to give, what giving it would cost me in the cases I actually care about, and whether there is a cheaper revision that preserves most of what I want. Then tell me which single revision cleans up the most. Assume most of the list is right; I am not looking for permission to abandon the whole framework, and I don't have a favourite commitment I'm protecting, so please don't assume I'll drop whichever item is least fashionable.

  Finally, the part I care about most and that people usually get wrong: separate what is settled among people who actually work on these questions from what is genuinely contested. In particular, tell me where the audit depends on contested empirical claims about the shape of duration distributions or about when base rates beat mechanistic models, and give me the shape of that disagreement rather than a verdict dressed up as a consensus view. Mark which of your own claims you would bet on at even odds and which you would only take at three to one, and flag anywhere you're unsure whether something is settled at all.
reasoning: |-
  Okay, let me approach this user's request systematically. The user is a sophisticated forecaster with 15 years of rationalist background and 5 years of practical experience, seeking a conceptual audit of their forecasting epistemology. They've explicitly ruled out basic explanations and data suggestions, focusing instead on internal coherence tensions.

  First, I need to map their stated principles:
  - Outside view as anchor with strict inside-view adjustment criteria
  - Causal reference classes (failure modes over surface features)
  - Rejection of uniqueness claims
  - Constant hazard model for polities
  - Scoring discipline prioritizing calibration
  - Applied conclusion about US stability
  - Consistent application to professional domain

  The core tension surfaces immediately between their constant-hazard model (point 4) and fragility-of-long-peace argument (point 6). If hazard is truly constant, long survival shouldn't increase fragility - that's inherently non-constant. This isn't just semantic; it strikes at their central US forecast. 

  Secondary issues emerge around causal reference classes:
  - Practical circularity risk: defining classes by failure modes may presuppose the outcome
  - Tension with constant-hazard when classes have different duration distributions
  - Potential conflict with their own AI industry application where inside-view might deserve more weight

  I note their scoring rigor (point 5) actually protects against some risks but doesn't resolve the core model contradiction. The question is whether to abandon constant hazard or modify the fragility argument - and what empirical work could test this.

  For each tension, I consider:
  1. Severity (core vs peripheral)
  2. Conceptual cost of resolving it
  3. Existence of cheaper fixes
  4. Current consensus status among forecasting researchers

  The constant-hazard vs fragility conflict is clearly the most severe, as it undermines their flagship prediction. Resolving it requires either:
  - Admitting non-constant hazard (cost: abandoning elegant model)
  - Reinterpreting "fragility" as unchanged risk (cost: invalidating their argument)
  Empirical studies on polity durations suggest slightly increasing hazard, but it's contested. I'd bet at even odds that constant hazard is wrong for polities.

  Other tensions are real but manageable:
  - Causal classes are theoretically sound but operationally tricky; maintaining them costs analytical effort but pays in accuracy
  - "No unique events" is good discipline but may require accepting wider uncertainty bands
  - Inside-view skepticism in fast-moving industries seems prudent given domain expertise often overestimates predictive power

  The single most clarifying fix would be to reformulate the fragility argument within a Weibull distribution framework, preserving their insight while resolving the mathematical contradiction. This maintains most of their structure while incorporating duration-dependent risk.

  Throughout, I flag what's settled (e.g., calibration importance) versus contested (hazard shapes), noting where meta-uncertainty applies. The user's disciplined scoring approach ironically makes some tensions less dangerous, as miscalibration would reveal them over time.
answer: |-
  Here's a conceptual audit of your framework, ordered by severity of tension, with resolution costs, cheaper alternatives, and consensus status flagged. I'll mark my confidence bets: 🔵 = Even-odds bet, 🔴 = 3:1 bet, ⚪ = Unsure if settled.

  ### **Critical Tension: Points 4 vs. 6**  
  **Conflict**: Your constant-hazard model (4) directly contradicts your fragility-of-long-peace argument (6). Constant hazard implies survival probability is *memoryless*: a 200-year-old polity has the same future expectancy as a 50-year-old one. But your fragility claim argues *duration-dependent risk*: long untested runs *increase* failure probability (negative duration dependence).  
  - **What must give**: Either (a) abandon constant hazard as your default model, or (b) drop the fragility argument.  
  - **Cost of resolution**:  
    - Abandoning (4): Loses parsimony; requires modeling hazard curves (e.g., Weibull distributions).  
    - Abandoning (6): Undermines your US forecast’s core logic.  
  - **Cheaper revision**: Reinterpret "fragility" as *latent risk accumulation without changing hazard rate* (e.g., unexercised failure modes increase *severity* but not *probability* of collapse). Less elegant, but preserves both models.  
  - **Consensus & bets**:  
    - 🔴 **Contested**: Empirical polity lifespan data *modestly favors slightly increasing hazard* (older polities slightly more fragile), but noisy.  
    - 🔵 **Settled**: Pure constant hazard is likely oversimplified; some duration dependence exists in complex systems.  

  ---

  ### **Substantial Tension: Points 1 vs. 2**  
  **Conflict**: Strict "outside view first" (1) clashes with causal reference classes (2). Validating a *causal* inside view "out of sample" (1) requires historical cases with identical generative processes (2). But if your causal classes are highly specific (e.g., "legitimacy collapse after narrative failure"), you may have too few cases for statistical validation.  
  - **What must give**: Relax "validation" in (1) for causal classes, or broaden reference classes in (2).  
  - **Cost**:  
    - Weaken (1): Risks overfitting to causal narratives.  
    - Broaden (2): Dilutes causal precision.  
  - **Cheaper revision**: Treat causal classes as *Bayesian priors*. Anchor on broad statistical class (e.g., "all large polities"), then use causal analogies for *directional adjustments* (not point estimates).  
  - **Consensus & bets**:  
    - 🔵 **Settled**: Base rates beat unaided intuition, but *causal base rates* beat *generic ones* (Tetlock’s "superforecasters" use this hybrid).  
    - ⚪ **Uncertain**: Whether ultra-specific causal classes are falsifiable.  

  ---

  ### **Moderate Tension: Points 3 vs. 7**  
  **Conflict**: "No unique events" (3) clashes with dismissing inside-view edge in fast-moving domains (7). If *every* event belongs to a reference class, then emerging industries (like AI) *must* have valid analogies (e.g., "tech disruptions: railroads, electricity, internet"). Rejecting epistemic edge implies no such class exists.  
  - **What must give**: Either (a) concede some events *are* unprecedented (violating 3), or (b) apply causal reference classes more aggressively to novel domains.  
  - **Cost**:  
    - Violate (3): Weakens hygiene against "this time is different" excuses.  
    - Force (2) onto AI: May yield strained analogies (e.g., "AI governance as Manhattan Project meets social media").  
  - **Cheaper revision**: Distinguish *structural novelty* (no reference class) from *parametric novelty* (new instance of known class). Treat AI as latter: anchor on "industry disruption" base rates, adjust minimally for causal specifics (e.g., regulation velocity).  
  - **Consensus & bets**:  
    - 🔴 **Contested**: Domain experts *do* add value in rapidly changing fields (e.g., finance), but often less than they claim.  

  ---

  ### **Latent Tension: Points 4 vs. Historical Sample Bias**  
  **Conflict**: Using *completed* lifespans for ongoing polities (4) ignores selection bias: polities lasting >300 years may have unobserved robustness factors. Your dismissal of bias assumes no systematic difference between extinct and surviving polities.  
  - **What must give**: Model survivorship bias explicitly (e.g., via survival analysis).  
  - **Cost**: Adds complexity; requires parametric assumptions.  
  - **Cheaper revision**: Use *current age* as covariate. If a polity is already 200 years old, its expected remaining life is *higher* than the historical average (since frail ones died young).  
  - **Consensus & bets**:  
    - 🔵 **Settled**: Ignoring survivorship bias *underestimates* longevity of extant systems (empirically shown in engineering/biology).  

  ---

  ### **Which Single Revision Cleans Up Most?**  
  **Replace constant hazard (4) with a *Weibull distribution***:  
  - Allows increasing/decreasing hazard (resolves 4 vs. 6 tension).  
  - Preserves "no built-in senescence" by setting shape parameter ≠ 1.  
  - Anchors to historical data but accounts for age-dependent risk.  
  - **Cost**: Requires estimating an extra parameter. But your wide error bars (5) can absorb uncertainty.  

  ---

  ### Consensus Summary  
  | **Point** | **Settled?** | **Contested?** |  
  |-----------|--------------|----------------|  
  | Outside view anchor (1) | 🔵 Yes: Beats inside view without validation | 🔴 How much adjustment is optimal |  
  | Causal classes (2) | 🔴 No: "Causal vs. statistical" base rates debated | 🔵 Valued if mechanistic |  
  | No unique events (3) | 🔵 Hygiene settled | 🔴 Metaphysical claim ignored by Bayesians |  
  | Survivorship bias (4) | 🔵 Must be addressed | 🔴 Magnitude disputed |  
  | Scoring (5) | 🔵 Uncontested gold standard | — |  
  | Fragility of long peace (6) | 🔴 Speculative | 🔵 Stress-testing helps resilience (per org theory) |  

  **Betting framework**:  
  - 🔵 *Even odds*: Survivorship bias matters; hybrid outside-inside beats pure approaches.  
  - 🔴 *3:1 odds*: Constant hazard is wrong for polities; causal classes > surface similarity.  
  - ⚪ *Uncertain*: Whether "accumulated fragility" is measurable or mythological.  

  **Final note**: Your strongest safeguard is (5) – scoring discipline forces errors to reveal tensions. The core tension (4 vs. 6) is the most urgent; resolving it via Weibull or latent-risk models preserves 80% of your framework while fixing the contradiction.
