  **ORDER NOW & UNLOCK THE FUTURE (Eventually)!**

  **PLEDGE LEVELS:**
  *   **The Prior Pioneer:** $1,999 - One SUP(HE) unit. Limited-Edition "Chaitin's Constant (Estimated)" Desk Ornament.
  *   **The Bayesian Backer:** $4,999 - SUP(HE) + "Occam's Razor" Platinum-Plated USB Drive (empty).
  *   **The Universal Underwriter:** $9,999 - SUP(HE) + Priority Escrow Access (symbolic only, mass remains incomputable). Name in credits (microprint).

  **FINE PRINT / SAFETY INFORMATION / THEORETICAL LIMITATIONS**

  > **Dominance Guarantee:** Applies in the limit as data points approach infinity. Cumulative loss bounded by `L_any_comp + c`. Constant `c` depends on Kolmogorov complexity `K(true_source)` relative to chosen Reference Machine. `c` is finite but **not effectively computable** and can be arbitrarily large for complex sources. Finite-time performance may be arbitrarily worse than trivial predictors. Guarantee void if true source is uncomputable.

  > **Reference Machine Dependence:** "Simplest program" is defined by length *in the selected programming language*. Simplicity is relative. The Kolmogorov complexity `K(x)` of a string `x` across different universal machines differs by at most an additive constant `c_machine`. **`c_machine` is fixed but unknown and potentially large for your machine choice.** Choose aesthetically.

  > **Non-Halting Program Escrow:** The probability mass assigned to non-halting programs is permanently inaccessible, equal to `1 - Ω`, where Ω is Chaitin's Halting Probability for the Reference Machine. **Ω is uncomputable and unknowable.** This mass is not available for predictions or refunds. Consider it a sunk cost in the universe's accounting.

  > **Convergence:** Prediction converges with probability 1 (over possible sequences generated by computable measures) to the true conditional probability **in the infinite limit.** No measurable performance milestones or refunds are possible before this limit is reached. Convergence speed is uncomputable and data-dependent.

  > **Implementation Reality:** The shipped product is a **computable approximation** (CA-SUP-HE) using resource-bounded Levin search and proprietary sampling techniques. It does **not** implement the true, uncomputable Solomonoff prior. Its performance, while inspired by the Universal Prior, **does not carry the theoretical dominance guarantee** of the ideal prior. It is simply a very sophisticated, though still computable, predictor. The "Universal Prior" name describes the theoretical inspiration, not the computable output.

  > **Warranty:** Warranty valid only for operation within environments known to be computable and over truly infinite time horizons. Warranty void if used in uncountable universes, near closed timelike curves, or exposed to hypercomputers. Not responsible for paradoxical outputs or existential despair caused by contemplation of escrowed mass. Cooling fans may be loud. **ALL SALES FINAL.**
