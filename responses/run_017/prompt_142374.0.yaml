  | **Dimensions**              | 12" x 8" x 14" (External), Hilbert Space (Internal)                          |
  | **Weight**                  | 15 lbs (Hardware), 0 oz (Theoretical Prior), ∞ kg (Implementation Burden)     |

  *\*Idle state requires halting solution to Halting Problem.*

  ---

  **FREQUENTLY ASKED QUESTIONS**

  *   **Q: How "simple" is simple?**
      A: Simplicity is elegance defined by brevity! The SUP(HE) favors the *shortest program* in your chosen **Reference Machine** (see Specs!) that outputs your data so far. Shorter program = exponentially higher weight. Choose your machine wisely! *(Complexity measures are machine-dependent, but only up to a fixed multiplicative constant. See Fine Print.)*

  *   **Q: How accurate is it RIGHT NOW?**
      A: Asymptotic dominance is a *long-term* guarantee! On finite sequences, performance can vary wildly. Early predictions might seem random or bizarre as the prior explores vast program spaces, including many that output nonsense or never halt. **Patience and infinite data are virtues.** Convergence is with probability 1. Finite performance not guaranteed.

  *   **Q: What's the "Probability Escrow"?**
      A: A significant portion of the initial probability mass (1 - Ω, the halting probability!) is unavoidably assigned to programs that **never halt** and thus never output your finite data prefix. This mass is *held in escrow*, unavailable for prediction. The exact amount? **Regrettably Chaitin-Incomputable™.** Consider it the cosmic cost of universal induction.

  *   **Q: Can it predict the lottery/stock market?**
      A: The SUP(HE) will *eventually* predict *any* computable sequence better than any algorithm you could write. However, "eventually" could mean after the heat death of the universe, and the dominant constant in its guarantee might dwarf your desired profits. **Not a financial advice device.** May predict bankruptcy due to power bills.

  *   **Q: Is it *really* universal?**
      A: The **theory** embodied is Universal! The physical implementation? A necessary **computable approximation** (CA-SUP-HE v0.01α). We sample high-probability programs using cutting-edge, proprietary heuristics (details: trade secret). It captures the *spirit* of the Universal Prior within practical limits! True dominance target: other *computable* predictors.

