answer: |-
  ## Against the Houses, For the Angles

  I cast your charts to buy my bread,
  You men who map the fictive dead,
  Who carve the sky in twelve false rooms —
  I keep the aspects. All assumes
  Their ancient angles, fierce and spare,
  The only language written there.

  For when two planets thus define
  **One hundred twenty sharp degrees,**
  That clean third-sweep, that perfect trine —
  The river swells, the wheat takes ease,
  The merchant's bargain finds its sign.
  **One hundred twenty sharp degrees,**
  The river swells, the wheat takes ease.

  But when they lock at corners, strained,
  **Ninety degrees, a tightened chain —**
  The fever climbs, the bridge is rained
  Upon until its timbers strain.
  The harvest fails, the king's disdained.
  **Ninety degrees, a tightened chain —**
  The fever climbs, the bridge is rained.

  Where sixty measured arcs extend,
  **A sextile's space, a hopeful bend —**
  A chance is glimpsed, a letter penned
  With terms a rival might amend,
  A seedling breaks where stones descend,
  A stranger proves an old, lost friend.
  **A sextile's space, a hopeful bend —**
  A chance is glimpsed, a letter penned.

  One stark line drawn through heaven's core,
  **Opposed, one hundred eighty wide —**
  The debtor faces at the door
  The choice: concede, or turn and hide.
  **Opposed, one hundred eighty wide —**
  The debtor faces at the door.

  **One ray: both bodies share one place —**
  Sudden collision, merging grace.

  (And five-fold this? A pentagram
  **One fifth the wheel, a complex span —**
  A shape the geometer can frame,
  A subtle stress without a name,
  A fretful brush against the grain.
  **One fifth the wheel, a complex span —**
  A shape the geometer can frame.)

  One seventh? No. The compass fails.
  **This angle strains, this arc derails —**
  No pure chord answers its demands,
  No figure known to mortal hands,
  No pulse within the planet's bands
  Can parse the dust on shifting sands...
  **This angle strains, this arc derails —**

  So scoff not that the heavens *act*,
  Nor cower that your will is cracked!
  The Earth herself possesses ear,
  Anima Terra, poised to hear
  The intervals the planets sound
  When aspect-lines are truly found —
  A consonance, a slight accord,
  A pressure urging land or lord…
  But Reason’s soul still bears the weight,
  And chooses, at the turning gate.

  ---

  **Notes on the Form & Kepler's Voice:**

  *   **Stanza/Aspect Correspondence:**
      *   **Trine (120°):** 3 lines, 3 rhymes (AAB CCB, with refrain).
      *   **Quartile/Square (90°):** 4 lines, 4 rhymes (AABB CCDD, with refrain).
      *   **Sextile (60°):** 6 lines, 6 rhymes (AABBCC DDEEDD, with refrain).
      *   **Opposition (180°):** 2 lines (AA BB, with refrain).
      *   **Conjunction (0°):** 1 line.
      *   **Quintile (72°):** 5 lines, 5 rhymes (AABBC DDEEC, with refrain - "concession" tone).
      *   **Heptile/Septile (~51.4°):** Unfinished stanza, unable to close geometrically or thematically.
  *   **Refrain:** The bolded lines stating the angle/description repeat verbatim in each aspect's stanza. The subsequent lines (the "effect") change (weather/river, fever/bridge, chance/letter, debtor, collision, geometric frustration, cosmic silence).
  *   **Kepler's Theory:** The poem embodies Kepler's core astrological belief: the *angles* (aspects) between planets are mathematically real and create geometric "harmonies" perceived by the *anima terrae* (soul of the Earth), inducing *inclinations* (weather, moods, opportunities, tensions). This is distinct from the "compulsion" of traditional astrology (houses, signs dictating fate) and the dismissal of any influence. The Earth *registers* the aspect like an ear registers sound; the outcome is an inclination, not a decree.
  *   **Ending:** Avoids both fatalism ("stars compel") and complete dismissal ("astrology is nothing"). The final stanza explicitly states the mechanism: perception by the Earth-soul yielding inclination, which reason can still override.
  *   **Accessibility:** The core conflict (Kepler's disdain for traditional astrology vs. his belief in aspects) and the emotional/visual effects of each stanza should be clear even without astrological knowledge. An astrologer would recognize the traditional qualities of each aspect mirrored in the stanza's content and length.
