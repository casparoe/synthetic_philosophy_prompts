answer: |-
  **1. Setup and materials**
  Arrange chairs around long table. Prepare: 14 pens; 14 small slips for predictions; 14 index cards for writing demand sentences; 3 large cards labeled CARD 1, CARD 2, CARD 3; debrief notes hidden. On instructor desk: stack of blank slips, extra pens. Each student gets one index card, one prediction slip, one pen. Instruct: "Recall a minor wrong someone *you still know* did to you. Content stays private. We use neutral language only." No whiteboard yet. Phones off.

  **2. Phase one: demand sentence and predictions**
  Write on your index card: One sentence starting "You owed me..." addressing the wrongdoer directly. Read this sentence aloud *only* to your immediate neighbor; hear theirs. Content not shared with class. Now privately: On prediction slip, rank three future cards (1,2,3) by how much they will soften your demand. Label: "Most softening" to "Least softening". Collect prediction slips immediately. Keep demand card visible to you.

  **3. Phase two: three cards and probes**
  Reveal CARD 1: "Every bit of what happened was fixed by things long before, including how they are." Instruct: Based on this, physically change your demand: Leave card flat (unchanged), turn it face down (softened), or write on back "Report: [demand rephrased impersonally, e.g., 'This case requires management.']" Then privately answer probes: Can you still feel warmth/gratitude for a good thing this person did? Does this way of handling affect unrelated interactions? Is this handling easier if the wrong was to a friend, not you? Repeat sequence for CARD 2: "They didn't know it would harm and didn't aim at harm." Then CARD 3: "They aren't the sort of being that can even hear demands like this." No discussion yet. Collect probe answers after each card.

  **4. Phase three: repair sentence and induction card**
  Write on new slip: "The one thing they could say now to make things right between us." Keep private. Reveal final card: "You later learned a technique *you set up* produced exactly that statement from them." Instruct: Decide silently: Does this repair still count? Mark slip "Yes" or "No". Collect all slips and cards.

  **5. Debrief: mapping moments**
  Whiteboard on. Map: "You owed me" sentences → reactive attitudes as address (general claim). Prediction rankings vs actual softening → gap between causal verdict talk and stance resilience (a,c). CARD 1 often ranks high but rarely softens fully → stance not tracking causes. Gratitude surviving detached handling → (a) diagnostic. Domain-spread inconsistency → (b) unstable exemption. CARD 3 conversions lacking warmth loss → (b) leak or self-deception. Repair sentence + induction → (c) attitude, not behavior, matters. "Report" writing → objective stance as management. Ease for friend's wrong → partial exemption fragility. Collected "No" on induced repair → (c) authenticity required.

  **6. Predictable problems and limits**
  Problems: Students pick overly serious wrongs → insist minor/mundane. Neighbor sharing causes discomfort → permit passing. Demand sentence phrasing issues → circulate, suggest edits like "You should have...". Probes feel abstract → use concrete examples: "Can you still appreciate their birthday gift?". Induced repair card confusion → clarify: *They* arranged the remorse-tech. Cannot establish: (b) domain-bound instability as *necessarily* unstable or self-deceptive; activity shows inconsistency but not why. (c) Attitude primacy over behavior; induction card shows rejection but not *why* it feels hollow. Argue these links. (a) Gratitude loss *should* happen but often doesn't → use this tension to argue stance coherence.
