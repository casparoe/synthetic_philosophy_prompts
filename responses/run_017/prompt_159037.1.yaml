  3. **Closest Precedent**: **Marek turning down paid work**. It holds: both involve sacrificing resources (money/income) to demonstrate commitment to the crew’s values. The gear donation is less "pure" (crew gains directly), but the sunk cost and inability to fake commitment are analogous.

