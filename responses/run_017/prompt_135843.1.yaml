  Breaking down each item:

  1. **Grue in SLT**: Grue is green before time t and blue after. In SLT, the input space includes time. The two hypotheses (green vs. grue) split the feature space differently. Both fit the training data up to now but diverge post-t. The key is that the evidence before t is consistent with both, but they differ on the post-t region.

  2. **Evidential indistinguishability**: Both hypotheses have zero training error up to t. Under i.i.d., their empirical risks are the same. The puzzle is that without prior constraints, SLT can't favor one over the other, leading to unidentifiability. The stand-off isn't resolved by data alone, so inductive bias is necessary.

  3. **Entrenchment as prior**: Goodman's entrenchment is about how often predicates are used in past projections. In SLT, this could be a meta-learning prior from past environments. But the language-relativity makes it tricky. Different languages (hypothesis classes) imply different priors, so it's not a universal prior but relative to the class.

  4. **Skeptical moral**: The riddle shows that without assumptions like stationarity, induction is impossible. SLT's reliance on fixed distributions hides the problem. Distribution shift exposes the issue, but Goodman's point is deeper—about natural kinds and the necessity of projectible predicates.

