  2. **Minority report**: The divergent future seen by one precog is deleted. They connect this to criticisms of the readiness potential—averaging trials hides variability. Is the film highlighting this flaw?
  3. **Institutional use of predictions**: Precrime acts before the crime, imprisoning based on prediction. This shifts from neuroscience to moral agency. How does this differ from Libet's critics?

  I should also address where the film diverges from the philosophy. The film emphasizes systemic control, moral ambiguity, and personal stakes—elements beyond abstract debates. The user wants to avoid making the film just an illustration, so highlighting its unique contributions is key.

