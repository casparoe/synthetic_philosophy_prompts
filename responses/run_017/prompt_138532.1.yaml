prompt: |-
  I'm revising a paper in philosophy of biology and I want you to attack the view I'm defending rather than help me defend it. Call it the maintenance account, or MA: functions attach in the first instance to trait types in populations, and a trait type T's function is the effect E such that tokens of T are currently being retained in the population *because* they produce E, where retaining-because is a difference-making, selection-involving relation over a biologically relevant run of generations, so that if bearers of T stopped producing E, and nothing else changed, T would be on its way out. I like MA because it seems to keep the etiological account's goodies — historical grounding, a naturalistic kind of normativity, a real distinction between functioning and malfunctioning, and a principled way of excluding the effects that a pure systemic-contribution account can't exclude, since pumping blood also produces heart sounds and jostles the neighbouring organs — while also keeping the causal-role account's goodies. It handles co-option gracefully: on the usual telling, feathers stop having insulation as their function and acquire flight once flight is what maintains them. It gives a newly arisen beneficial variant a function straight away instead of making it wait for a completed sweep. And it explains why a molecular biologist who knows nothing of a lineage's history can still find out what a part is for by knocking it out and watching what happens to fitness over a few hundred generations. It also yields verdicts its rivals don't: exapted traits get *new* functions rather than accumulating obsolete ones, and vestigial traits — the eyes of cave fish, the human appendix, whatever its status turns out to be — have no function at all rather than a function they no longer perform.

  What I want from you is a map of the view's exposure, ranked by how much damage each item would do. Which observations, cases, arguments, or formal-ish results would be decisive against MA, and which would merely be awkward — costs I could absorb by adding a qualification, together with an honest account of what each qualification buys me and what it costs me? Please separate things that have arguably already happened from merely possible or hypothetical ones, and be explicit about which objections a committed maintenance theorist should concede as genuine and which she should dismiss as resting on a misdescription of the case; I'd rather have the strongest version of what my opponents think than a friendly paraphrase. These are the worries I keep circling, and I'd like you to sharpen them, discard the weak ones, and tell me which are actually load-bearing. First, the passenger problem: a part that is now indispensable but became so through something like a neutral ratchet, where a dependency arises first and only later becomes required, so that removing the part is lethal even though the part was never retained *for* anything — MA appears to hand such a part a function for free. Second, relaxed selection: a trait whose maintenance effect lapses because the environment changed, so that on MA the function evaporates, even though we still want to say that the particular organ in front of us can malfunction. Third, spatially varying selection: the same allele maintained in one habitat and neutral or mildly costly in the next valley over, which seems to make the function of a part of an organism depend on where you draw the population boundary. Fourth, a hypothetical empirical finding I've been toying with as a foil: suppose that what in fact maintains most traits is a shifting mosaic of effects, the identity of the payoff changing faster than the trait itself does, so that there is no stable answer to the question of what the trait is maintained for over any interesting window; I can't tell whether that refutes MA, forces it into gerrymandered disjunctive functions, or is something MA should simply welcome. Fifth, the collapse worry: that retained-because-it-produces-E is just E-is-the-contribution-that-currently-pays, so that MA has quietly become the causal-role account it was supposed to beat — the move that would worry me most, since a view that collapses into its rival hasn't been refuted so much as revealed to have never been distinct. Please don't spend the answer rehearsing the standard objections to the etiological and causal-role accounts as such; I know those. I want them either converted into objections to MA specifically or set aside. And if MA turns out to be insulated — if the length of the relevant window and the standard on retained because can be tuned to save it from any case you throw at it — say so plainly, and say whether that is a defect in a view of this kind or simply what a successful conceptual analysis looks like.

  For context on what would actually move me: I'm least impressed by intuition-mongering about exotic cases and most impressed by two things — a case where MA and the selected-effects account disagree and the verdict of working biology or medicine plainly goes against MA, and any argument that the slack in biologically relevant run of generations has been doing all the real work in my replies. I'm also faintly suspicious that the recurring dispute in genomics over whether most of the genome is functional, where one side counted any biochemically active stretch as functional and the other insisted on maintenance by selection, is more damaging to me than I've been treating it as; tell me if you agree. I'm on a long train ride with no library access, so please argue from cases and principles rather than citations.

  Please organize the response as follows, with the section titles in this order: The view under test (about 100 words — restate MA charitably and flag any ambiguity you had to resolve to do so); Decisive defeaters (about 350 words); Awkward but survivable (about 250 words); What a defender concedes, what she dismisses (about 200 words); How exposed is it? (about 200 words, including your verdict on the insulation and collapse worries); What I'd find most persuasive (about 100 words, addressed to the two things I said would move me).
