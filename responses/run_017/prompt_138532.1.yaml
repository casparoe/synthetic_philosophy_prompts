answer: |-
  ### The View Under Test
  The Maintenance Account (MA) defines a trait type T's function as effect E iff: (1) tokens of T are *currently being retained* in the population because they produce E; (2) "retained-because" entails a difference-making, selection-involving relation; (3) this relation holds over a "biologically relevant run of generations" (a flexible but non-arbitrary timeframe); (4) if T stopped producing E (ceteris paribus), T would decline in frequency. MA aims to secure historical grounding and normativity (like etiological views) while accommodating current utility and co-option (like causal-role views), avoiding the pitfalls of both. Key ambiguities resolved: "Retained" implies active maintenance by selection, not mere persistence. "Because" is causal-explanatory, not merely correlational.

  ### Decisive Defeaters
  **1. The Passenger Problem (Empirically Actual):** Cases of *non-adaptive indispensability* are fatal if common. Consider gene duplicates ("paralogs") in diploid organisms. After duplication, one copy may accumulate degenerative mutations, becoming non-functional for its original role. Yet, if complete deletion of *both* copies is lethal (due to dosage sensitivity or pleiotropic roles), the degenerate copy is maintained *solely because* its absence would unmask the deleterious effects of deleting its partner – **not because it produces any beneficial effect E itself**. MA must assign it a function ("preventing dosage imbalance"?), but it was never retained *for* that; it’s a passive passenger in a dependency ratchet. Genomics suggests such cases are widespread (e.g., pseudogene retention via subfunctionalization without positive selection). *Damage*: Directly violates MA’s core "retained-*because*-it-produces-E" condition. It grants functions without maintenance *for* an effect.

  **2. The Shifting Mosaic (Plausibly Actual):** Suppose molecular biology reveals that the fitness-contribution of many traits (e.g., a signaling protein, a behavioral trait) is highly context-dependent. The specific effect E conferring fitness advantage shifts constantly across micro-environments, developmental stages, or genetic backgrounds – faster than the "biologically relevant run" (e.g., within decades for microbes, centuries for vertebrates). Over *any* stable timeframe long enough to define "retention," the trait is maintained by a *disjunction* of effects (E1, E2, E3...), not a specific E. MA must either: (a) Deny functions exist (implausible), (b) Assign disjunctive functions (gerrymandered, normatively inert – how does *this* token malfunction?), or (c) Insist on a stable E by gerrymandering the timeframe/population (ad hoc, collapses MA’s objectivity). *Damage*: Undermines MA’s promise of a specific, stable, normatively robust E. If pervasive, it refutes MA by showing its core relation rarely obtains.

  ### Awkward but Survivable
  **1. Relaxed Selection (Actual & Problematic):** A trait (e.g., human wisdom teeth, cavefish eyes) loses its maintenance effect E due to environmental change. MA says it now has *no function*. Yet, a particular token (e.g., an impacted wisdom tooth) can still *malfunction* – it causes infection/pain. *Survival Strategy*: Concede MA denies a *biological function* but distinguish "malfunction" from "lacking function." Malfunction claims could refer to: (a) Failure of a *historical* function (cost: violates MA’s "current" focus), (b) Failure to perform a *systemic* role causing harm (cost: invokes causal-role elements MA aimed to avoid), or (c) A derivative, non-biological sense (e.g., "designed role" – cost: weakens naturalism). *Cost*: Significant theoretical cost; MA loses a key claimed advantage (handling malfunction cleanly) for these cases.

  **2. Spatially Varying Selection (Actual & Awkward):** An allele/trait is maintained by selection for E in Habitat A, neutral/costly in adjacent Habitat B (e.g., melanism in peppered moths, drug-resistance alleles). MA assigns function E only in Population A (defined as moths in industrial areas). Is the function of a token trait in an organism *in* Habitat B still E? *Survival Strategy*: Embrace function relativization to (properly defined) local populations. The function is E *relative to* the population where selection maintains it. For the token in Habitat B, it might lack function or have a different one. *Cost*: Makes function ascriptions population-boundary-sensitive and potentially counterintuitive (is the melanic moth *in the countryside* still "for camouflage"? MA might say no). Requires careful population definition but doesn’t break MA.

  ### What a Defender Concedes, What She Dismisses
  *   **Concedes:** (1) **Passenger Traits Lack Functions:** MA must deny functions to indispensable passenger traits (e.g., degenerate paralogs, perhaps the appendix if its retention is purely due to dependency). This is a cost, but defenders argue these *genuinely lack functions*; intuitions otherwise stem from conflating indispensability with function. (2) **Relaxed Selection = No Function:** Vestigial traits *do not* have biological functions on MA; malfunction claims need alternative grounding. (3) **Function Relativity:** Functions are relative to a population and a timeframe ("biologically relevant run").
  *   **Dismisses:** (1) **Intuitions about Vestigial Malfunction:** These conflate historical function with current biological function or invoke non-biological norms. MA provides the correct *biological* account. (2) **Collapse Worry (Misdescription):** "Retained-because-it-produces-E" is *not* merely "E-is-currently-contributing." It requires E to be the *difference-making cause of persistence* over time against alternatives, incorporating counterfactual dependence – something pure causal-role views explicitly avoid. This secures normativity and historical grounding.

  ### How Exposed Is It?
  MA is **highly exposed** to empirically grounded objections, particularly the **Passenger Problem**. If non-adaptive indispensability is common, MA faces decisive counterexamples. The **Shifting Mosaic** scenario is potentially devastating if empirically validated. While **Relaxed Selection** and **Spatial Variation** are survivable with qualifications, these costs weaken MA's appeal relative to rivals. The **Collapse Worry** is serious but arguably avoidable by rigorously defending the modal/counterfactual content of "retained-because." However, the **flexibility of "biologically relevant run of generations"** is a double-edged sword. While necessary to handle variation in evolutionary tempo, it risks becoming a "get-out-of-jail-free" card tuned ad hoc to avoid counterexamples, undermining MA's objectivity and testability. This is a major **defect**, making MA potentially unfalsifiable if the timeframe parameter lacks principled constraints. It is **not** well-insulated; its viability hinges on empirical findings about evolutionary maintenance mechanisms and the prevalence of passive indispensability.

  ### What I'd Find Most Persuasive
  1.  **Empirical Clash with Biology/Medicine:** A concrete case where MA and Selected-Effects (SE) disagree, and biological *practice* sides decisively with SE. Example: Molecular biologists studying a recently co-opted gene (e.g., a toxin gene co-opted for venom in snakes). MA assigns the new function immediately upon co-option driving maintenance. SE requires a history of selection *for* that effect. If biologists consistently refer to the "new function" only *after* demonstrating fixation and historical selection *for* venom (e.g., via population genetics tests), not merely current maintenance *by* venom, this favors SE over MA. Finding such a case where MA's verdict feels forced or ignored in practice would be highly damaging.
  2.  **Parameter Doing the Work:** An argument demonstrating that *every* successful MA response to a counterexample (passenger, relaxed selection, spatial variation) **crucially relies** on adjusting the "biologically relevant run" or population boundaries in an unprincipled way to *make* E the maintenance effect. If this parameter alone salvages MA in all hard cases, it reveals MA as vacuous – the "function" is just whatever effect we isolate by gerrymandering time/population to fit the definition, not a biologically robust property. *This* would be decisive evidence of collapse or emptiness. Regarding genomics: Yes, the "junk DNA" debate **is** more damaging than you suggest. If a significant fraction of the genome is biochemically active but maintained by non-adaptive mechanisms (e.g., mutational biases, GC-biased gene conversion), MA must deny it functions, aligning with the "junk" view. If biologists widely attribute "functions" based on activity alone in such regions, MA clashes with practice.
