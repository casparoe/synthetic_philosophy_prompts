  ## The Dig

  Now let me show you nothing happened here.  
  (Though certain papers surfaced yesterday)  
  They told you nothing happened there, my dear.

  That leak was doctored, haven’t you heard? It’s clear  
  The ink is fresh beneath the fading grey.  
  Now let me show you nothing happened here.

  The witness? Quiet, paid to disappear  
  Before the trial. His words? Just bitter clay.  
  They told you nothing happened there, my dear,  
  *they had no reason to conceal, no fear.*

  You point to vaults unlocked? A bold display  
  Of planted proof! Designed to feed your leer.  
  Now let me show you nothing happened here —  
  *these records they display were planted years ago.*

  That whistleblower’s proof? A thin veneer  
  Paid for in cash, in shadows, in the dark.  
  They told you nothing happened there, my dear,  
  *they had no reason to conceal, no fear,*  
  *the one who talked was bribed to lie, a mark.*

  Now let me show you nothing happened here —  
  *these records they display were planted years ago,*  
  *to catch the doubters rising from the murk.*  
  They told you nothing happened there, my dear —  
  *they had no reason to conceal, no fear,*  
  *the one who talked was bribed to lie, a mark,*  
  *and silence bought protects the vital work.*  
  The frame grows heavy, buckles, holds the air.

  ---

  **Structure Notes:**  
  The refrains ("Now let me show you nothing happened here." / "They told you nothing happened there, my dear.") remain verbatim at their core but acquire new explanatory clauses at each recurrence (italicized above). Each addition directly addresses the counter-evidence presented in the preceding stanza (documents, witness, unlocked vaults, whistleblower). The final quatrain merges both fully accreted refrains, demonstrating how the explanatory scaffolding ultimately outweighs the initial claim, straining the poem's form itself ("The frame grows heavy"). This mirrors the "self-sealing" epistemic dynamic and the increasing burden of auxiliary hypotheses, without judgment on the claim's potential validity.
