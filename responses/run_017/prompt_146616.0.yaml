prompt: |-
  I'm writing a chapter on the reliability of animal signals, and I keep finding that the handicap principle is used to mean at least three different things, so before I assess any contender I want the specification. Write the desiderata a theory of honest signalling must meet to be adequate for one purpose: telling a field biologist what to measure when she finds a signal she doesn't understand and wants to know whether to go looking for costs at all. For each requirement give the case behind it — the phenomena it must explain (why signals track quality or need instead of being bluffed; why some perfectly reliable signals are cheap; why some expensive signals carry no information; why receivers respond to displays that merely exploit their existing preferences; why signals that look wasteful persist), the distinctions it must not collapse (signal versus cue versus index versus manipulation; production cost versus differential cost versus receiver-imposed cost; signals of durable quality versus signals of current need; reliability versus costliness), and any game-theoretic or empirical result it cannot contradict. Mark which requirements are non-negotiable and which are the preferences of one camp, and say which single requirement does the most work in excluding candidate theories.

  Then run the list against four hypothetical cases I want to use in the chapter, chosen so that different ways of spelling out the desiderata should come apart:

  1. Borrowed cost: males build a display structure out of material they must steal from rivals, so the ornament is reliable as a indicator of fighting ability, but the cost is borne by the losers rather than by the signaller. Must cost fall on the signaller, or is it enough that there is no cheap way to get the signal?
  2. Deferred cost: the display is cheap to produce, but individuals who display while in poor condition are later attacked by receivers, so the cost arrives after the benefit and only for low-quality signallers.
  3. Aligned interests: a call whose pitch is fixed mechanically by body size, honest, essentially free to produce, and in a context where receiver and signaller both gain from accuracy.
  4. Costly deception: an expensive display that works by hijacking the receiver's pre-existing sensory bias and carries no information whatsoever about the signaller.

  If some subset of your desiderata cannot be satisfied jointly — if requiring signaller-borne cost rules out the aligned-interest case while dropping it lets the manipulation case in — say so, say which requirement you would give up and why, and give each of the main approaches (strategic handicap models, index or unfakeability accounts, receiver-psychology and sensory-exploitation accounts, cost-free honest signalling under aligned interests) one line against the list. Commit: rank the desiderata, state the one you would sacrifice, and be explicit about which of your claims are conceptual and which would actually be settled by data.
reasoning: |-
  Okay, let me tackle this user's query. They're writing a chapter on animal signal reliability and need a clear set of desiderata for theories of honest signaling. The main challenge is the ambiguity around the handicap principle, which seems to have multiple interpretations. 

  First, I need to identify what the user really needs. They want a framework to guide field biologists on whether to look for costs when encountering an unfamiliar signal. The key is to create desiderata that cover all critical aspects without being tied to one theoretical camp. 

  The user mentions three specific issues: signals tracking quality/need, cheap reliable signals, and costly deceptive signals. They also want distinctions like signal vs. cue, production vs. differential costs, etc. I should address each of these points while ensuring the desiderata are non-contradictory.

  Starting with Non-Negotiable Desiderata:
  1. **Explaining Honesty Maintenance**: Any theory must clarify why signals remain honest despite incentives to cheat. This is crucial because without it, biologists wouldn't know why honesty persists. The case of Zahavi's peacocks shows that signals must be costly to prevent bluffing. 

  2. **Accommodating Cost-Free Honesty**: Aligned interests cases, like body-size-based calls, must be included. If a theory can't explain these, it's insufficient. This is non-negotiable because such signals exist in nature.

  3. **Distinguishing Signal Types**: Clear separation between signals, cues, indices, and manipulations is essential. Blurring these could mislead biologists into misclassifying observed behaviors.

  For Negotiable Desiderata:
  4. **Cost Mechanisms**: Explaining how costs work is important but flexible. Production costs (like energy expenditure) vs. differential costs (higher burden on low-quality signallers) can vary. Some theories prioritize one over the other.

  5. **Information Content**: Signals should convey useful info, but exceptions exist. Sensory traps show that signals can be deceptive yet effective. This is negotiable because while honesty is ideal, deception occurs.

  The critical desideratum is **Honesty Maintenance** because it's foundational. Without explaining why signals are honest, other aspects become irrelevant. 

  Now, applying these to the cases:
  1. **Borrowed Cost**: The signal is reliable due to stolen materials. Desideratum 1 is met (honesty via cost), but desideratum 4a (signaller-borne cost) isn't. If the theory requires signaller-borne costs, this case fails. However, if differential cost (desideratum 4b) is accepted, it's valid.

  2. **Deferred Cost**: Honesty is maintained by future receiver retaliation. Desideratum 1 is met, but cost is deferred. Desideratum 4a (immediate production cost) isn't satisfied, but 4b (differential cost) is. The main issue is whether delayed costs count, which depends on the theory's flexibility.

  3. **Aligned Interests**: Free, honest signal. Meets desiderata 1, 2, and 3. Challenges theories that mandate costs (desideratum 4a), but supports 4b since no cost is needed when interests align.

  4. **Costly Deception**: Expensive but deceptive. Fails desiderata 1 and 5. Highlights that cost alone doesn't ensure honesty. Supports the need for desideratum 5 (information content) but shows its negotiability.

  Trade-offs become clear: Requiring signaller-borne cost (desideratum 4a) excludes aligned interests cases. Dropping it allows manipulation cases. The best compromise is to emphasize differential cost (4b) over production cost (4a), accommodating both borrowed/deferred costs and aligned interests.

  Ranking the desiderata:
  1. Honesty Maintenance (non-negotiable)
  2. Accommodating Cost-Free Honesty (non-negotiable)
  3. Distinguishing Signal Types (non-negotiable)
  4. Information Content (negotiable)
  5. Cost Mechanisms (negotiable, with differential cost preferred)

  Sacrificing strict signaller-borne cost (part of desideratum 4) allows including aligned interests without fully enabling deception, as long as honesty maintenance is upheld. 

  Each approach's one-line assessment:
  - **Strategic Handicap**: Focuses on signaller-borne costs but fails for cost-free honesty.
  - **Index/Unfakeability**: Explains cost-free cases but not strategic costs.
  - **Sensory Exploitation**: Accounts for deceptive signals but not honesty maintenance.
  - **Aligned Interests**: Explains cost-free honesty but not signals with conflicts.

  The user needs a balanced framework that prioritizes core principles while allowing flexibility for empirical findings. Highlighting differential costs and honesty maintenance covers most cases, though costly deception remains an exception that tests the boundaries.
answer: |-
  Here are the desiderata for a theory of honest signalling tailored to guide field biologists on when to measure costs, structured to handle the ambiguities of the handicap principle. Requirements are ranked by importance, with trade-offs made explicit. **Bold** denotes non-negotiable criteria; *italics* mark negotiable/context-dependent ones.

  ---

  ### **Core Desiderata for Guiding Empirical Measurement**  
  1. **Honesty Maintenance Mechanism (Non-Negotiable)**  
     - **Must explain**: Why signals reliably track signaller quality/need despite incentives to bluff (e.g., peacock tails correlate with parasite resistance; low-quality males *could* cheat but don’t).  
     - **Must not collapse**: Reliability vs. costliness (some honest signals are cheap).  
     - **Cannot contradict**: Game-theoretic models (e.g., Zahavi-Grafen) showing cheating destabilizes signalling without constraints.  
     - **Why non-negotiable?** Without this, the theory cannot justify *why* biologists should expect reliability.  

  2. **Accommodates Cost-Free Honesty (Non-Negotiable)**  
     - **Must explain**: Cases like fixed morphological indices (e.g., toad call pitch tied to body size) that are honest and cheap.  
     - **Must not collapse**: Signals of durable quality (e.g., size) vs. signals of current need (e.g., hunger cries).  
     - **Cannot contradict**: Empirical evidence (e.g., frog vocal sac size as an unfakeable index).  
     - **Why non-negotiable?** If a theory *requires* costs, it misdirects biologists studying indices.  

  3. **Distinguishes Signal Types (Non-Negotiable)**  
     - **Must explain**: Why some traits are signals (receiver co-evolved responses) vs. cues (incidental information) vs. manipulations (e.g., fireflies mimicking mates to cannibalize).  
     - **Must not collapse**: Signal vs. index (indices are unfakeable; signals may be strategic).  
     - **Why non-negotiable?** Biologists must know whether a trait is *intended* for communication or a byproduct.  

  4. *Specifies Cost Mechanisms (Negotiable)*  
     - **Must explain**: Why some signals are costly (e.g., antler growth) and others aren’t (e.g., size-based roars).  
     - **Distinctions**: Production cost (energy/time) vs. differential cost (costlier for low-quality signallers) vs. receiver-imposed cost (e.g., punishment).  
     - **Why negotiable?** Biologists need flexibility: costs matter in conflicts but not aligned interests.  

  5. *Handles Non-Informative Signals (Negotiable)*  
     - **Must explain**: Costly deception (e.g., male fiddler crab claws exploiting female preference) and "wasteful" signals (e.g., bowerbird ornaments with no quality link).  
     - **Cannot contradict**: Sensory exploitation theory (e.g., Ryan’s frog call preferences).  

  ---

  ### **Critical Ranking and Trade-Offs**  
  - **Most Exclusionary Desideratum**: #1 (Honesty Maintenance). It forces theories to address *stability against cheating*, disqualifying naive cost-based definitions.  
  - **Key Trade-Off**: Requiring **signaller-borne costs** (a strict reading of Desideratum 4) **rules out aligned-interest cases** (#3). **Dropping it admits manipulation cases** (#4).  
  - **Sacrifice**: Strict "signaller-borne production cost." **Why?** It excludes cost-free honesty (violating Desideratum 2) and ignores deferred/receiver-imposed costs.  
  - **Resolution**: Prioritize **differential cost** (cost falls disproportionately on low-quality signallers) over *who* bears it or *when*.  

  ---

  ### **Testing Cases Against Desiderata**  
  | Case                 | Desid. 1 (Honesty) | Desid. 2 (Cost-Free) | Desid. 3 (Signal Type) | Desid. 4 (Cost Mech.) | Desid. 5 (Non-Info) | Verdict                                  |  
  |----------------------|-------------------|----------------------|------------------------|-----------------------|---------------------|------------------------------------------|  
  | **1. Borrowed Cost** | ✅ Reliable via fighting ability | ❌ Costs exist | ✅ Signal (receiver evaluates) | ⚠️ Cost differential (only strong can steal) but not signaller-borne | ✅ Informative | **Measure costs? YES** (differential cost maintains honesty) |  
  | **2. Deferred Cost** | ✅ Reliable via receiver punishment | ❌ Costs exist | ✅ Signal (receiver co-evolved) | ⚠️ Receiver-imposed cost, not production | ✅ Informative | **Measure costs? YES** (but look for *receiver behavior*, not production) |  
  | **3. Aligned Interests** | ✅ Mechanically honest | ✅ Cost-free | ✅ Index (unfakeable) | ✅ No costs needed | ✅ Informative | **Measure costs? NO** (costs irrelevant here) |  
  | **4. Costly Deception** | ❌ No honesty | ❌ Costs exist | ❓ Manipulation (not true signal) | ✅ Production cost | ❌ Non-informative | **Measure costs? IRRELEVANT** (not honest; study receiver bias) |  

  ---

  ### **One-Line Assessments of Major Theories**  
  - **Strategic Handicap (Grafen)**: Fails Desid. 2 (requires costs) and Desid. 4 (ignores receiver costs).  
  - **Index/Unfakeability**: Aces Desid. 2/3 but fails Desid. 5 (can’t explain costly deception).  
  - **Sensory Exploitation**: Explains Desid. 5 but fails Desid. 1 (no honesty mechanism).  
  - **Aligned-Interest (Maynard Smith)**: Aces Desid. 1/2/3 but fails Desid. 5 (ignores conflicts).  

  ---

  ### **Commitment: Resolved Desiderata**  
  1. **Non-Negotiable**: Honesty maintenance (#1), Cost-free honesty (#2), Signal-type distinctions (#3).  
  2. **Negotiable**: Cost mechanisms (#4; prefer *differential cost* over production cost), Non-informative signals (#5; include but subordinate to honesty).  
  3. **Sacrificed**: Signaller-borne production cost (subset of #4). **Why?** Data show deferred/receiver-imposed costs (e.g., threat displays punished by retaliation) and indices maintain honesty without it.  
  4. **Conceptual vs. Empirical**:  
     - *Conceptual*: Distinctions in Desid. 3 (signal vs. cue); stability requirement in Desid. 1.  
     - *Empirical*: Whether a signal uses production/differential/receiver costs (Desid. 4); prevalence of aligned interests (Desid. 2).  

  **Final Guidance for Biologists**:  
  > **Measure costs if (a) interests conflict, AND (b) the signal is fakable. Focus on *differential* costs (e.g., weaker signallers pay more) or receiver-imposed sanctions. Ignore costs for unfakeable indices or aligned interests.**  

  This framework excludes theories demanding universal signaller-borne costs (over-inclusive) and those ignoring stability (under-inclusive), while directing effort where costs matter.
