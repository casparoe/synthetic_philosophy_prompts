  Hmm... the key challenge is finding non-trivial agreements. I'll need to discard vacuous statements like "religion has social effects" - too obvious. Instead, I'll focus on empirically grounded claims both sides accept, like the confounding effect of community embeddedness on religiosity-prosociality correlations.

  For Section A, I'm considering these agreed claims:
  1) Religious practice bundles multiple components that affect prosociality differently
  2) Self-reported religiosity correlates more strongly with non-costly behaviors
  3) Community embeddedness confounds observed religious effects
  4) Institutional substitutes can replicate some religious functions
  5) Historical religious institutions provided monitoring/sanctioning

  The disagreements section will need careful wording. For example, on whether belief in supernatural monitoring is necessary, Camp M would say yes while Camp I would call it epiphenomenal. I'll classify this as substantive since it's about causal mechanisms.

  For the cruxes... that substitution case study is tricky. Camp I would predict anonymity gradient improvement with new institutions, while Camp M expects decline. Finding a real-world case without confounders will be hard though.

  In my judgment note, I should flag that the three metrics themselves may favor Camp I by emphasizing measurable behaviors over internal states. Also the "moral capital" framing might subtly favor Camp M's depletion narrative.

  The user clearly wants precision - no platitudes, just testable claims. I'll avoid any language that implies resolution where none exists. Each camp's self-falsification conditions will be crucial for intellectual honesty.

  This requires balancing philosophical rigor with empirical testability. The value is in creating a document both sides can endorse while preserving their core disagreements. The cruxes especially must be framed as genuinely decisive tests.
answer: |-
  ## Joint Statement: Adversarial Collaboration on Religion and Prosociality  

  ### Section A: Agreed Non-Trivial Claims  
  1. **Component Separation Necessity**: The causal effects of "religion" on prosociality cannot be assessed without disaggregating: (i) belief in moralizing supernatural agents, (ii) costly ritual participation, (iii) embeddedness in a dense monitoring community, and (iv) explicit moral instruction.  
  2. **Confounded Correlation**: Observed correlations between religiosity and prosociality are significantly confounded by community embeddedness and cultural inheritance across all operational metrics (anonymity gradient, motivation share, circle radius).  
  3. **Metric-Specific Effects**: Religiosity predicts self-reported prosociality and low-cost observable behavior more robustly than high-cost anonymous behavior.  
  4. **Institutional Functional Equivalence**: Secular institutions (e.g., contract law, auditing, reputational registries) can replicate the monitoring, sanctioning, and community-support functions historically bundled with religious practice.  
  5. **Historical Causal Role**: Pre-modern religious institutions provided a credible scaffold for large-scale cooperation by combining ritual, community enforcement, and supernatural belief, lowering transaction costs among genetic strangers.  
  6. **Priming Limitations**: Laboratory religious priming effects on anonymous giving are mechanistically ambiguous and do not establish field relevance for sustaining large-scale cooperation.  

  *(Discarded vacuous claims (b-grade): "Religion influences society" (tautological), "Context matters for prosociality" (under-specified), "Both camps seek truth" (rhetorical padding).)*  

  ---  
  ### Section B: Disagreements Table  
  | Disputed Proposition              | Camp M Formulation                          | Camp I Formulation                          | Classification | Justification |  
  |-----------------------------------|---------------------------------------------|---------------------------------------------|----------------|---------------|  
  | **Supernatural belief is necessary for stability** | Belief in morally concerned supernatural agents is *causally indispensable* for sustaining cooperation in anonymity gaps. | Belief is epiphenomenal; substitutable monitoring institutions provide *sufficient* stability without metaphysics. | Substantive | Turns on causal irreplaceability (M) vs. functional redundancy (I). |  
  | **Moral capital depreciation** | Secular societies exhibit intergenerational decay in motivation share & circle radius absent religious practice. | Prosociality stabilizes post-secularization where institutions substitute; any decay reflects institutional failure, not belief loss. | Substantive | Empirical claim about time-lagged effects contingent on institutional quality. |  
  | **Primary prosocial mechanism** | Costly rituals primarily serve to *credibly signal belief commitment*, amplifying supernatural monitoring. | Costly rituals primarily *strengthen in-group cohesion and monitoring*, independent of belief content. | Partly Verbal | "Primary mechanism" conflates evolutionary function (M) vs. proximate psychology (I); testable via Component Crux. |  
  | **Optimal metric for "moral"** | Motivation share is the ultimate test of morality; secular institutions cannot replicate intrinsic other-regard. | Circle radius is paramount; institutions outperform religion in extending prosociality to strangers. | Trade-off | Reflects divergent moral ideals (virtue ethics vs. consequentialism), not factual disagreement. |  

  ---  
  ### Section C: Cruxes  
  1. **Component Crux**  
     - *Test*: Compare cohorts diverging on ritual practice (R+) vs. private belief (B+) after shared heritage.  
     - **Camp M Prediction**: R+ cohort maintains lower anonymity gradient (stronger prosociality under anonymity); B+ cohort decays towards baseline.  
     - **Camp I Prediction**: R+ cohort maintains low anonymity gradient; B+ cohort shows no difference from R+ if community embeddedness persists.  

  2. **Amortization Crux**  
     - *Test*: Measure motivation share decline post-secularization.  
     - **Camp M Prediction**: >15% decline in motivation share within 3 generations, controlling for institutions.  
     - **Camp I Prediction**: No decline if institutions are robust; decline only if institutions degrade.  
     - *Falsifiability*: Low. Generational timescales, cultural hysteresis, and institutional covariates make causal isolation impractical.  

  3. **Substitution Crux**  
     - *Test*: Jurisdiction introducing arbitration + reputational registry sans religious revival.  
     - **Camp I Vindication**: Anonymity gradient decreases by ≥20% (improved prosociality under anonymity).  
     - **Camp M Vindication**: Anonymity gradient increases or remains unchanged.  
     - *Decisive Threshold*: Both accept ≥15% gradient reduction as favoring Camp I; ≤5% change favors Camp M.  

  4. **Transfer Crux**  
     - *Shared Discounting Rationale*:  
       - Camp M: Priming triggers heuristic activation, not sustained commitment architecture.  
       - Camp I: Priming effects reflect transient norm compliance, not deep belief causation.  
     - *Status*: **Shared assumption** (both dismiss priming as field-relevant evidence). Not a crux.  

  ---  
  ### Section D: Self-Falsification Conditions & Decisive Evidence  
  - **Camp M** would reconsider if:  
    > A stable, high-radius, high-motivation-share society emerges *de novo* without religious heritage or ritual practice, under full anonymity.  

  - **Camp I** would reconsider if:  
    > Secular institutions replicate all religious functions but prosociality *unidirectionally* decays across metrics in multiple societies, controlling for confounding.  

  - **Both agree** the following would advance the debate:  
    > Natural experiments isolating ritual practice from belief (Component Crux) or longitudinal studies of societies transitioning from religious to institutional enforcement with granular metric tracking (Substitution Crux).  

  ---  
  ### Section E: Scribe’s Note  
  *(Personal judgment, not consensus)*  

  **Settled Among Specialists**:  
  - Religiosity-prosociality correlations are non-random but confounded (A2, A3).  
  - Functional substitutes exist for community enforcement and ritual signaling (A4, B1).  
  - Laboratory priming has limited external validity (C4).  

  **Genuinely Contested**:  
  - Whether supernatural belief is a *causal catalyst* or *evolutionary spandrel*.  
  - The time horizon and penetrance of "moral capital" decay.  
  - Whether motivation share is achievable sans belief.  

  **Framing Biases**:  
  1. **Four Components**: Favors *Camp I* by decoupling belief from practice. Camp M might argue belief and ritual are non-separable in ancestral environments.  
  2. **Three Metrics**: Favors *Camp M* in prioritizing motivation share (hard to measure) over circle radius (observable). "Anonymity gradient" is the least contested.  
  3. **Camp M Characterization**: "Moral capital" implies depletion—a premise Camp I rejects. "Living off inheritance" frames secularity as parasitic.  
  4. **Camp I Characterization**: "Self-presentation" overstates Camp I’s skepticism; they accept real community effects, just not belief-specific ones.  

  **Unresolved Ambiguities**:  
  - Whether "costly ritual" is primarily about belief signaling (M) or network formation (I) remains empirically thorny.  
  - Specialists disagree on whether historical data can resolve the amortization question given path dependence.  

  ---  
  *This document represents agreed facts, cleanly framed disagreements, and testable predictions. It does not adjudicate; it maps the battlefield.*  

  [End of Joint Statement]
