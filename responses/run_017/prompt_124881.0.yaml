  ### Taxonomy of Views on the Unity of Pleasure  
  This taxonomy sorts views on what unifies states called "pleasures" via concrete cases. Answer the branching questions honestly; each leads to a leaf representing a view, defined by its core claim and awkward commitment. Cases must be accounted for: absorbed climber (no attention to experience, reports no feeling), relief after toothache (absence), delight in fiction (object not believed real), dry proof-closing satisfaction (no sensory phenomenology), background contentment (unreported unless prompted), astringent food (enjoyed and disliked simultaneously), and reward-system/report divergence (which has evidential priority).

  #### Branching Questions  
  1. **Climber/Contentment Case:** In the absorbed climber or background contentment cases, can the subject have a pleasure without being aware of it at the time? (Yes / No)  
  2. **Proof/Relief Case:** Is the dry satisfaction of closing a proof or the relief after a toothache stops a pleasure? (Yes / No)  
  3. **Astringent Food Case:** Can the same experience be both enjoyed and disliked simultaneously, as in the astringent food case? (Yes / No)  
  4. **Reward/Report Case:** When reward-system activity indicates pleasure but the subject reports no enjoyment, which has evidential priority? (Reward system / Self-report)  
  5. **Double-Duty Constraint:** Must the feature unifying pleasures also explain why pleasure benefits a person? (Yes / No)  

  #### Leaves (Views)  
  Each leaf is defined by a unique combination of answers to the branching questions. Combinations are presented as (Q1, Q2, Q3, Q4, Q5), e.g., (Yes, Yes, Yes, Reward, Yes). Views are named if defended; "unnamed" if not.  

  1. **Leaf (No, No, No, Self-report, Yes): Distinctive Felt Quality**  
     - *Statement:* Pleasures share a proprietary felt quality (e.g., "hedonic tone") that is intrinsically good.  
     - *Awkward commitment:* Denies the climber, contentment, proof, relief, and astringent cases are pleasures; the reward system is irrelevant if self-report conflicts.  

  2. **Leaf (Yes, Yes, No, Self-report, Yes): Mode View**  
     - *Statement:* Pleasure is a mode of attending to or undergoing an experience (not a separate feeling), and this mode confers benefit.  
     - *Awkward commitment:* Cannot accommodate mixed enjoy/dislike cases; must deny the astringent food is a unified pleasure.  

  3. **Leaf (Yes, Yes, Yes, Self-report, Yes): Pro-Attitude View**  
     - *Statement:* Pleasure consists in a pro-attitude (e.g., desire or liking) toward an experience/object, and this attitude is good.  
     - *Awkward commitment:* Struggles with the climber and contentment cases if the pro-attitude is unconscious, and with reward-system divergence if self-report is prioritized.  

  4. **Leaf (Yes, Yes, Yes, Self-report, No): Hybrid View**  
     - *Statement:* Pleasure involves both a pro-attitude and a distinctive mode of experience, but unity and value come apart.  
     - *Awkward commitment:* Overly complex; no clear reason why these elements cohere, and silent/divergent cases (e.g., climber, reward/report) remain problematic.  

  5. **Leaf (Yes, Yes, Yes, Reward, No): Functional Role View**  
     - *Statement:* Pleasures share a functional role (e.g., reinforcement or "common currency" for learning), not a qualitative property.  
     - *Awkward commitment:* Includes states lacking positive phenomenology (e.g., relief, proof) and excludes enjoyed states if unrewarded; denies double-duty.  

  6. **Leaf (Yes, Yes, Yes, Reward, Yes): Unnamed (Functional-Instrumental)**  
     - *Statement:* Pleasure is a functional state that also explains benefit, but the functional role is the source of value.  
     - *Awkward commitment:* Value is contingent on causal roles, risking counterexamples where functional states harm (e.g., addiction).  

  7. **Leaf (No, Yes, Yes, Self-report, No): Determinate/Disjunctivist View**  
     - *Statement:* Pleasure is a determinable with no shared quality (or a disjunctive gerrymander), and unity does not imply value.  
     - *Awkward commitment:* Admits silent/divergent cases as data but cannot explain why we group them; the astringent case is arbitrarily "pleasure."  

  8. **Leaf (No, No, Yes, Reward, No): Eliminativist View**  
     - *Statement:* "Pleasure" lacks a unified essence; the category should be abandoned for precise states (e.g., reward, desire).  
     - *Awkward commitment:* Denies intuitions (e.g., that enjoyment benefits) and must replace folk psychology wholesale.  

  #### Undefended Combinations  
  - **(Yes, No, Yes, Self-report, Yes):** *Incoherent*—Claims silent pleasures exist (Q1) but denies proof/relief (Q2), yet the latter are silent/non-sensory cases.  
  - **(No, Yes, No, Reward, Yes):** *Unattractive*—Allows non-sensory pleasures (Q2) but forbids mixed cases (Q3), making it ad hoc; double-duty burdens a disunified class.  
  - **(No, No, No, Reward, No):** *Unexplored*—Requires phenomenology (Q1–3) but prioritizes reward (Q4) and denies double-duty (Q5), a niche with no proponents.  

  #### Unresolved Leaf Pairs and Further Questions  
  1. **Mode (Leaf 2) vs. Pro-Attitude (Leaf 3):** Both answer (Yes, Yes, ?, Self-report, Yes). *Separating question:* "In the climber case, is her 'enjoyment' best explained by how she experiences the climb (mode) or by her liking for it (attitude)?"  
  2. **Hybrid (Leaf 4) vs. Functional Role (Leaf 5):** Both allow mixed/silent cases (Q1–3: Yes) but diverge on Q4/Q5. *No question can separate further:* They share core commitments but disagree on reward/report and double-duty, reflecting irreconcilable intuitions.  
  3. **Determinate/Disjunctivist (Leaf 7) vs. Eliminativist (Leaf 8):** Both deny phenomenology unifies (Q2: Yes; Q1/Q3: mixed) but diverge on Q5. *Separating question:* "Can 'pleasure' be a useful category if it is a disjunction with no shared property?"  
  4. **Distinctive Felt Quality (Leaf 1) vs. Unnamed Functional-Instrumental (Leaf 6):** Both prioritize self-report (Q4) but disagree elsewhere. *No question can separate:* Q4 forces self-report, but their core mechanisms (feeling vs. function) are incommensurable.  
  5. **Pro-Attitude (Leaf 3) vs. Functional Role (Leaf 5):** Both answer (Yes, Yes, Yes, ?, ?). *Separating question:* "In the reward/report divergence case, is the subject wrong about their pleasure if they report no enjoyment but the reward system fires?"
