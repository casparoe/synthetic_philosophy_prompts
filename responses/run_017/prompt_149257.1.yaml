  - **Funging Fraction (FF)**: The fraction of the nominal outcome that would have occurred without the foundation's grant. (This is estimated by considering counterfactual scenarios.)
  - **Total Outcome**: The total discounted expected outcome (in utils) resulting from the grant. For non-information interventions, this includes all benefits over time. For information interventions, this is the expected Value of Information (VOI), defined as the expected net benefit from the changes in decisions that the information causes.
  - **Grant Amount**: The total dollars requested.

  **Clauses and Cases:**

  - **FF**: Cases A (FF=1 -> CE=0), B (FF=0), C (FF=0), D (FF=1 -> CE=0), I (scholarship: FF=1, capacity: FF=0).
  - **Total Outcome (non-information)**: Cases G (high because permanent), H (low because one year), I (capacity expansion: high because perpetual flow). Also, note that the production function in D: even if we spend money, the outcome is zero because of the bottleneck -> Total Outcome=0.
  - **Total Outcome (information)**: Cases E (VOI>0), F (VOI=0).

  This principle reproduces all the verdicts except that it leaves J undecided (as it should).

  **What about new cases?**

  1. **Speeding up an outcome**: An intervention that makes an outcome happen sooner but does not change the total outcome. For example, funding a project that will be funded by someone else in 5 years, but we can make it happen now. Then without us, the outcome happens in 5 years. With us, now. The total outcome is the same, but we get it 5 years earlier. Then the net additional outcome (compared to without us) is the value of having the outcome 5 years earlier. So the Total Outcome is the discounted value of having it now rather than in 5 years. That is: the value of the outcome now minus the discounted value of the outcome in 5 years. Then FF=0? Not exactly. Without us, the outcome happens in 5 years. With us, now. So the nominal outcome (the project) happens now. But without us, it would happen in 5 years. So the net additional outcome is the acceleration. We can compute:

     Total Outcome (with us) = V (the value now)
     Without us: V discounted by 5 years = V * exp(-r*5) [if continuous discounting]

     So the net additional outcome = V - V * exp(-r*5) = V * (1 - exp(-r*5))

     Then FF = 1 - [net additional outcome] / V = exp(-r*5)

     Alternatively, we can set:

     Net Benefit = (1 - FF) * V

     and we want this to equal V * (1 - exp(-r*5))

     So  (1 - FF) * V = V * (1 - exp(-r*5))  => 1 - FF = 1 - exp(-r*5) => FF = exp(-r*5)

     Then CE = [ (1 - FF) * V ] / d = [V * (1 - exp(-r*5)) ] / d

     This is positive, so we might fund if the CE is high enough.

     But note: if the cost d is high and the acceleration is not very valuable (if r is small or 5 years is small), then CE might be low.

     This matches intuition.

  2. **Spreading vs Concentrating**: A fixed sum S must be allocated across five causes or concentrated in one. Every production function is concave (diminishing returns) and uncertain. We want to know whether to spread or concentrate.

     We must compute the expected Total Outcome for each option.

     Option 1: Concentrate on cause 1: Outcome = f1(S)
     Option 2: Spread equally: Outcome = f1(S/5) + f2(S/5) + ... + f5(S/5)

     Because of concavity, if the causes are identical, spreading is better? But if the causes are different, we should put more money on the cause with the highest marginal return. But we are uncertain about the production functions.

     The principle says: we want to maximize the total outcome. So we should choose the allocation that maximizes the sum of outcomes. This might be spreading or concentrating depending on the specific functions.

     For example, if one cause has a very high return at low levels (and then saturates) and the others have low returns, then we should fund the one cause until saturation and then the others. But with uncertainty, we might spread to reduce risk.

     The principle does not give a simple rule; it requires estimating the expected outcomes for each allocation. But that is the nature of the problem.

  **Which clause is doing the most work?**

  In the cases, FF is critical: it explains A, B, C, D, I. Total Outcome (including the time dimension) explains G and H. VOI explains E and F. So FF and the time dimension of Total Outcome are the most critical.

  **Where is the user's reformulation confused?**

  The user said: "treat tractability not as a multiplier but as the shape of the production function". We have done that by folding it into the Total Outcome. The user also said: "measure importance at the margin". We are doing that by using the net additional outcome (via FF) and the marginal change via the production function? But note: we are computing the total outcome for the grant, not the marginal outcome per dollar at the margin. However, for ranking, we use the average CE. This is standard in philanthropy when grants are large.

  The user also had a separate lock-in share and decision-sensitivity. We have folded them into Total Outcome.

  The user was concerned about I, but we captured I with FF and the production function (which for the capacity expansion includes the future flow).

  The only confusion might be in the production function: it must capture the entire stream and the constraints. But that is inherent.

  **Verdicts the principle cannot reproduce and should we give them up?**

  The principle reproduces all the given verdicts. For J, it leaves it to estimation, which is appropriate.

  **Final Principle Statement:**

  We can state one principle:

  **The Expected Net Value Principle**

  Rank all grant opportunities by the cost-effectiveness ratio:

  CE = [ (1 - Funging Fraction) * Total Outcome ] / Grant Amount

  where:
  - **Funging Fraction (FF)**: The proportion of the nominal outcome that would have occurred without the grant. (Estimate: What would happen without our funding?)
  - **Total Outcome**: The total discounted expected outcome (in utils) of the grant. For non-information interventions, this is the discounted sum of all future benefits. For information interventions, this is the expected Value of Information (the net benefit from the changes in decisions that the information causes).
  - **Grant Amount**: The total dollar amount of the grant.

  Allocate the budget in descending order of CE until the budget is exhausted.

  **Additional Guidance:**
  - When estimating the production function (which determines the Total Outcome), consider the level at which constraints bind. For example, if the constraint is at the system level (like the number of skilled people), then an intervention that does not address that constraint may have high funging (like in D and I).
  - For interventions that accelerate an outcome, the net additional outcome is the value of the acceleration (as computed above).
  - For allocations of a fixed sum across multiple opportunities, compute the total outcome for each possible allocation and choose the one with the highest total outcome.

  This principle is precise and can be applied by a colleague.
answer: |-
  Based on your cases and verdicts, I propose the following single unified principle, designed to capture your judgments while addressing the limitations of the three-factor model. The principle emphasizes **counterfactual effectiveness** and **constraint-aware marginal impact**, with explicit handling of persistence and information value. It is derived directly from your cases, and I'll explain how it resolves each one.

  ---

  ### **The Principle: Counterfactual Marginal Value (CMV)**
  Allocate funds to maximize the expected **Counterfactual Marginal Value (CMV)** per dollar, defined as:  
  **CMV = [ (1 - Funging Fraction) × Lock-in Multiplier × Decision Sensitivity ] × Marginal Outcome per Dollar**  

  Where:  
  1. **Funging Fraction (FF)**: The proportion of the nominal outcome that would have occurred *without* your grant.  
     - *Range*: 0 (no displacement) to 1 (full displacement).  
     - *Estimation*: Ask: "What fraction of this outcome would happen anyway if we didn’t fund it?"  

  2. **Lock-in Multiplier (LM)**: The factor by which the outcome’s value is amplified due to persistence beyond the funding period.  
     - *Calculation*: LM = 1 + (Present Value of Future Benefits After Funding Ends) / (Present Value of Benefits During Funding).  
     - *Default*: 1 (benefits stop when funding stops).  

  3. **Decision Sensitivity (DS)**: The probability that the outcome (or information) leads to a change in real-world decisions.  
     - *Range*: 0 (no impact on decisions) to 1 (certain impact).  
     - *For information interventions*: DS = Probability that findings will be acted upon by a relevant actor.  

  4. **Marginal Outcome per Dollar (∂O/∂$)**: The change in outcomes per additional dollar, given the intervention’s **production function** and **binding constraints**.  
     - *Key features*:  
       - Captures tractability as the *shape* of the production function (e.g., linear, concave, saturated).  
       - Must be evaluated at the **level where the constraint binds** (e.g., system capacity vs. individual grants).  
       - Incorporates uncertainty via expected value.  

  ---

  ### **How the Principle Earns Its Clauses from Your Cases**
  - **Funging Fraction (FF)** from Cases A, B, C, D, and I:  
    - A (no): FF ≈ 1 (ministry takeover means your grant displaces little *new* benefit).  
    - B (yes): FF ≈ 0 (no other funder → no displacement).  
    - C (yes): FF ≈ 0 (physical input, no bottlenecks → dollars buy genuine new units).  
    - D (no): FF ≈ 1 (skilled-people bottleneck → dollars inflate salaries without new output).  
    - I (scholarship: no; capacity: yes): Scholarship has high FF (trainee would have been funded anyway); capacity expansion has low FF (new slots wouldn’t exist).  

  - **Lock-in Multiplier (LM)** from Cases G and H:  
    - G (strong yes): LM >> 1 (procurement rule change creates permanent, self-sustaining benefits).  
    - H (weak yes): LM ≈ 1 (annual budget line requires ongoing funding → benefits cease if defunded).  

  - **Decision Sensitivity (DS)** from Cases E and F:  
    - E (yes): DS > 0 (studies *will* inform future actions).  
    - F (no): DS = 0 (no actor will act on findings → zero value).  

  - **Marginal Outcome per Dollar (∂O/∂$)** from Cases C, D, I, and J:  
    - C (yes): ∂O/∂$ is high and constant (linear production: dollars → units).  
    - D (no): ∂O/∂$ ≈ 0 (saturated production function at talent bottleneck).  
    - I (scholarship: no; capacity: yes): Scholarship ∂O/∂$ is illusory (fails to bind at system constraint); capacity expansion ∂O/∂$ is real (binds at training bottleneck).  
    - J (undecided): ∂O/∂$ for endowment vs. grants depends on uncertainty and option value (see below).  

  ---

  ### **Verdicts the Principle Cannot Reproduce and Which to Give Up**
  The principle reproduces all your verdicts **except one**:  
  - **Case J (endowment vs. grants)**: The principle *can* resolve this but requires explicit modeling of uncertainty and flexibility.  
    - **Endowment**: High LM (permanent benefits), but low ∂O/∂$ if field is a dead end (sunk cost).  
    - **Grants**: LM ≈ 1, but ∂O/∂$ incorporates option value (exit if field fails).  
    - **Resolution**: Choose grants if the value of flexibility > perpetuity premium.  
    - **Why you should accept this**: Your indecision stems from unquantified uncertainty. The principle forces explicit estimates of probabilities (e.g., chance the field is a dead end) and option value.  

  All other verdicts (A–I) are reproduced.  

  ---

  ### **Verdicts on New Cases**
  #### **Case K: Speeding Up an Outcome**  
  *Intervention*: Funding a project that will definitely happen in 10 years, making it happen now. Cost: $10M. Benefit: $100M in present value if delivered today, but only $50M in present value if delivered in 10 years (due to discounting). No other funder can accelerate it.  
  - **FF**: 0.5 (half the benefit would occur later without you: $50M/$100M).  
  - **LM**: 1 (no persistent change beyond accelerated benefit).  
  - **DS**: 1 (no information component).  
  - **∂O/∂$**: Outcome = $100M - $50M = $50M net acceleration benefit. Marginal outcome per dollar = $50M / $10M = 5.  
  - **CMV** = [(1 - 0.5) × 1 × 1] × 5 = **2.5**.  
  - **Verdict**: Fund if CMV > other options.  

  #### **Case L: Spread vs. Concentrate**  
  *Scenario*: Fixed sum $S. Five causes with concave production functions (diminishing returns). All face uncertainty: 50% chance each cause has high returns (∂O/∂$ = 10x at $S/5, 5x at $S), 50% chance of low returns (∂O/∂$ = 2x at any level).  
  - **Concentrate on one cause**:  
    - Expected ∂O/∂$ = (0.5 × 5x) + (0.5 × 2x) = 3.5x.  
    - CMV = (1 × 1 × 1) × 3.5 = **3.5** (assuming FF=0, LM=1, DS=1).  
  - **Spread across five**:  
    - Expected ∂O/∂$ per cause = (0.5 × 10x) + (0.5 × 2x) = 6x.  
    - Total CMV = 5 × [(1 × 1 × 1) × 6] = **30**.  
  - **Verdict**: Spread. Concavity + uncertainty favors diversification.  
  - **Key insight**: CMV penalizes concentration when production functions are concave and uncertain.  

  ---

  ### **Which Clause Does the Most Work?**
  - **Funging Fraction (FF)** is the most critical clause in your verdicts.  
    - It resolves 7/10 cases (A, B, C, D, I scholarships, I capacity, and J endowment risk).  
    - It replaces neglectedness as a direct measure of displacement (addressing your core concern that neglectedness ≠ fungibility).  
  - **Why your reformulation was confused**:  
    - You correctly identified FF, marginal importance, and lock-in, but underestimated how **constraint-aware production functions** (∂O/∂$) unify tractability and granularity issues (e.g., Case I).  
    - Your reformulation treated "lock-in share" as additive, but LM is multiplicative (scaling the entire value).  
    - You missed that **uncertainty** is central to J (endowment vs. grants) and L (spread vs. concentrate).  

  ---

  ### **Final Principle Summary**
  **To apply CMV, a colleague would:**  
  1. Estimate FF by asking: "Would this outcome happen without us? If so, what fraction?"  
  2. Calculate LM by comparing near-term benefits to long-term, self-sustaining benefits.  
  3. Assign DS by judging if findings/outcomes influence decisions (0 if irrelevant, like Case F).  
  4. Model ∂O/∂$ by mapping dollars to outcomes, considering constraints (e.g., avoid funding scholarships if talent pipeline is the bottleneck).  
  5. Multiply: CMV = [(1 - FF) × LM × DS] × ∂O/∂$.  
  6. Rank grants by CMV/dollar until the budget is exhausted.  

  This principle eliminates independence assumptions, handles granularity mismatches (Case I), and incorporates your intuition about persistence, information, and fungibility. It also forces explicit treatment of uncertainty in tough cases like J and L.
