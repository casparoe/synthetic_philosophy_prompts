  First, the user is frustrated with existing philosophy on the Ship of Theseus because it doesn't resolve real-world disputes. They want a practical framework. The key areas they mentioned include symmetric replacement, retroactivity, gradualness, no-overlap cases, mixed factors, social practices, and scope. They also want to know which desiderata conflict and why.

  I should create unique cases for each requirement. For example, for the symmetric case, maybe two statues: one restored in situ, one reassembled from replaced parts. Both finished simultaneously. The theory must handle this without temporal priority or matter advantage. The user wants to know if the theory must give a principled answer or if indeterminacy is acceptable.

  Retroactivity is crucial. Imagine a bridge where two potential originals exist; one collapses years later. Does the survivor become the original? This tests future-dependence versus determinacy. The user noted tension between "no future dependence" and avoiding arbitrariness.

  Gradualness needs a case like a timber frame repaired slowly versus overnight. The theory must explain why speed matters and handle vagueness. Is it semantic, metaphysical, or can the theory reject sharp cutoffs?

  The no-overload rebuild must ensure that a replica isn't considered original. The requirement should block pure form/function views but allow them to matter. For example, a chair replicated exactly but with no original parts or history.

  Mixed cases involve different materials, fractional matter, conflicting factors. Should identity be all-or-nothing or graded? The user wants clarity on whether reasons for caring can be degrees while identity remains binary.

  Social practices include registries, names, historical significance. Should the theory align with these, or can it challenge them? This relates to conventionalism versus realism.

  Scope: Must the theory apply to persons and all artifacts uniformly? Or can it differentiate between ships, buildings, codebases?

  The user also wants to know which desiderata conflict. For instance, determinacy, transitivity, no future-dependence, and non-arbitrary symmetric cases can't all be satisfied. For example, in the symmetric case, insisting on a determinate answer might require future dependence or arbitrariness.

  I need to check if each desideratum is required or a prejudice. For example, demanding that symmetric cases have a determinate answer might be a prejudice. Folk verdicts alignment could be another.

  Finally, a quick rundown of existing theories: matter-based fails symmetric cases; form/function allows replicas; spatiotemporal continuity struggles with graduality; four-dimensionalism handles change but might not fit folk intuitions; conventionalism makes identity subjective; eliminativism denies persistence, which isn't practical for a heritage committee.

  The user's deeper need is a clear, actionable framework that respects practical heritage concerns while being philosophically robust. They need to justify decisions to a committee, so the theory must provide defensible criteria even in borderline cases.
answer: |-
  Here’s a set of desiderata for a theory of artifact identity-through-replacement, structured around your cases and requirements. Each includes a novel case, classification (required/prejudice), and reasoning. Conflicts are summarized at the end.

  ---

  ### **Core Desiderata**
  1. **Symmetric Replacement Resolution**  
     - **Case**: *The Twin Statues*: A bronze statue undergoes piecemeal restoration over decades. Simultaneously, the replaced parts are secretly reassembled. Both restorations finish at the same instant. Neither has temporal priority, original matter majority, or spatial continuity advantage.  
     - **Requirement**: The theory must provide a *principled, non-arbitrary resolution* without relying on future events. It cannot declare "no answer" or "malformed question" unless it rigorously defends indeterminacy as inherent.  
     - **Classification**: Genuinely required (avoids ad hoc decision-making).  

  2. **Retroactivity Exclusion**  
     - **Case**: *The Phoenix Bridge*: A stone bridge is "split" during restoration—one candidate retains the original foundation, the other the original arches. No ruling is made. 20 years later, one collapses. Survivorship *cannot* retroactively determine which was "original."  
     - **Requirement**: Identity must be settled *at the time of restoration* without dependence on future events. "Becoming original" via catastrophe is inadmissible.  
     - **Classification**: Genuinely required (temporal coherence).  

  3. **Gradualness Sensitivity**  
     - **Case**: *The Great Hall Roof*: A medieval hall’s oak roof is replaced identically. In Scenario A, rafters are swapped one-by-one over 30 years. In Scenario B, the entire roof is replaced in a weekend.  
     - **Requirement**: The theory *may* assign different verdicts (e.g., original in A, replica in B) *if* it identifies a morally/historically relevant difference (e.g., continuity of function, craft tradition). It must explicitly state whether vagueness is:  
       - Semantic (language lacks precision),  
       - Metaphysical (indeterminacy in the object itself), or  
       - Rejected (sharp thresholds exist, e.g., "continuous function >50% of time").  
     - **Classification**: Genuinely required (reflects real-world restoration ethics).  

  4. **No-Overlap Exclusion**  
     - **Case**: *The Replica Chapel*: A 15th-century chapel is destroyed. A new chapel, identical in form/function/materials, is built on the same site by architects with no access to original plans or fragments.  
     - **Requirement**: The replica *cannot* be the original, *even if* form/function/material are indistinguishable. The theory must require *some causal-historical link* (e.g., intentional restoration, partial matter reuse, or documented continuity).  
     - **Classification**: Genuinely required (blocks absurd equivalence).  

  5. **Mixed/Fractional Handling**  
     - **Case**: *The Hybrid Engine*: A 1920s aircraft engine has 60% original parts, but 40% replaced with modern alloys. It maintains causal continuity but functions more efficiently.  
     - **Requirement**: Identity must be *all-or-nothing*, but *reasons for valuing identity* (e.g., historical significance, material authenticity) can be matters of degree. The theory must disentangle "is it the original?" from "how much do we care?"  
     - **Classification**: Genuinely required (avoids paradoxes of "partial identity").  

  6. **Social Practice Alignment**  
     - **Case**: *The Renamed Warship*: A ship’s registry, nameplate, and "Trafalgar veteran" status are transferred to a rebuilt vessel using 10% original timber. The public and navy treat it as the original.  
     - **Requirement**: The theory *need not* perfectly match social practices (e.g., registries), but significant misalignment (e.g., declaring a culturally accepted icon a "fake") is a cost. If mismatch occurs, the theory must explain why practices err.  
     - **Classification**: Prejudice (some camps prioritize folk intuition; others reject it as unreliable).  

  7. **Scope Flexibility**  
     - **Case**: *The Rewritten Codebase*: A software system has every line of code replaced incrementally over 10 years, retaining the same function and user identity.  
     - **Requirement**: The theory *need not* generalize to persons or all artifacts uniformly. "Uniform or explain the difference" suffices (e.g., "artifacts rely on function, persons on psychology").  
     - **Classification**: Genuinely required (avoys overextension).  

  ---

  ### **The Inconsistent Quartet**  
  These four desiderata **cannot** be jointly satisfied:  
  1. **Determinacy**: Symmetric cases (e.g., *Twin Statues*) must have a single correct answer.  
  2. **Transitivity**: If A is original at t1, and B is original at t2, then A=B.  
  3. **No Future Dependence**: Identity settled at restoration time (*Phoenix Bridge*).  
  4. **Non-Arbitrary Symmetry**: Resolution cannot rely on brute convention.  

  **The Squeeze**:  
  - Satisfying (1) + (4) in symmetric cases *without* future dependence (3) forces appeal to hidden variables (e.g., "causal essence"), violating (4).  
  - If (1) is rejected (indeterminacy allowed), (2)–(4) can hold.  
  - If (3) is relaxed (future-dependent identity), (1)+(2)+(4) can hold via "best candidate" theories.  
  - **Biggest Offender**: **Determinacy** (knocks out conventionalist/indeterminist views).  

  ---

  ### **Prejudice Flags**  
  - **"Folk Verdict Vindication"**: Prejudice (e.g., matter-based theories fail public intuitions about rebuilt landmarks).  
  - **"All-or-Nothing Identity"**: Prejudice (process-based views allow degrees; rejected by essentialists).  
  - **"No Sharp Cutoffs"**: Prejudice (functionalist views may accept thresholds).  

  ---

  ### **Theory Scorecard (Brief)**  
  | **Theory**               | **Strengths**                          | **Fails Desiderata**               |  
  |--------------------------|----------------------------------------|------------------------------------|  
  | Matter-Based             | Clear in simple cases                  | Symmetric replacement (1), Gradualness (3) |  
  | Form/Function            | Explains value of replicas             | No-Overlap (4)                     |  
  | Causal Continuity        | Handles gradual change                 | Symmetric (1)                      |  
  | 4D/Temporal Parts        | Solves all paradoxes technically       | Social practice (6), Scope (7)     |  
  | Constitution             | Distinguishes object/matter            | Mixed cases (5), Retroactivity (2) |  
  | Conventionalism          | Aligns with practice (6)               | Determinacy (1), No-Overlap (4)    |  
  | Eliminativism            | Avoids paradoxes                       | All (denies persistence)           |  

  **Best Fit**: *Causal-historical* theories (prioritizing restoration intent and continuity) satisfy most desiderata but struggle with symmetric cases. **Compromise**: Accept indeterminacy in edge cases (desideratum 1 relaxed) + all-or-nothing identity (5) + causal thresholds (3).  

  ---  
  Your hunch is correct: **determinacy** is the linchpin. Rejecting it allows a stable theory (e.g., "identity is indeterminate in symmetric cases, but settled by future use"); keeping it forces sacrifice elsewhere. For a heritage committee, prioritizing *causal continuity + social practice* may be most practical—even if philosophically messy.
