answer: |-
  ## Final Examination Question: Collapse and Transformation through the Lens of Proxies

  **Section 1: The Question (Approx. 300 words)**

  **Question:** Societies do not fail, they change? Critically evaluate this claim using the conceptual apparatus of proxies, trajectories, window sensitivity, and hysteresis outlined below. In doing so, diagnose the core nature of the dispute between scholars who see societal decline as "collapse" and those who see it as "transformation."

  **Apparatus:**
  *   **Proxies:** We characterize a polity using two measured series:
      1.  **Demographic Proxy (D):** Tracks population presence (e.g., occupied site count, summed settled area).
      2.  **Institutional Proxy (I):** Tracks institutional complexity (e.g., composite of administrative tiers, standardization, long-distance exchange volume, monumental construction energy).
  *   **Trajectories:** Consider four stylized 300-year outcomes:
      1.  **Trajectory A:** Both D and I fall >80% and stay down.
      2.  **Trajectory B:** D falls >80%, I recovers to former level within 200 years (under new elites).
      3.  **Trajectory C:** I collapses, D remains roughly stable (people/farming continue, institutions/monuments do not return).
      4.  **Trajectory D:** Neither D nor I fall significantly, but polity is absorbed; nothing recognizable to old elites survives under its own name.
  *   **Complications:**
      1.  **Window Sensitivity:** Whether a change is perceived as "abrupt" depends on the measurement window (e.g., 50 vs. 500 years); the lived experience may not match the archaeological record's resolution.
      2.  **Hysteresis:** (Borrowed from critical transitions theory) Reversing the initial forcing (e.g., restoring population/climate) may *not* restore the former state because mechanisms essential for rebuilding it (e.g., literate cadre, fiscal habits, partner networks) have been destroyed.

  **Your Task (90 minutes, closed book):**
  1.  **Diagnose the Dispute:** Is the collapse vs. transformation debate primarily: (i) a purely verbal disagreement; (ii) a disagreement about which proxy (D or I) defines "the society"; (iii) a disagreement about reversibility/hysteresis; or (iv) a normative disagreement relying on "collapse" as a thick evaluative term (describing loss *and* ranking it as failure, often identifying the society with institutions rather than people)? Justify your diagnosis.
  2.  **Analyze Trajectories:** Explicitly apply your diagnosis to **at least two** of the four trajectories (A, B, C, D). For each chosen trajectory, argue whether it constitutes "collapse" or "transformation" and explain *why*, engaging with the proxies, window sensitivity, and crucially, the concept of hysteresis.
  3.  **Conceptual Work:** Conclude by stating what substantive explanatory or predictive work, if any, the concept of "collapse" retains *after* this apparatus has been sorted out. Avoid merely repeating slogans from either "camp."

  ---

  **Section 2: Model Answer (Approx. 900 words)**

  The claim that "societies do not fail, they change" serves as a vital corrective to simplistic narratives of terminal doom, highlighting resilience and adaptation. However, when hardened into a slogan, it risks obscuring the profound, often irreversible, losses that characterize significant historical transitions. The dispute between "collapse" and "transformation" scholars is not merely verbal, nor is it solely resolvable by data; it is fundamentally a **normative disagreement rooted in differing valuations of what constitutes the core identity and success of a society, compounded by considerations of hysteresis.** The proxy apparatus reveals this complexity, showing that the choice of proxy implicitly defines "the society," while hysteresis underscores why some changes are not merely transformations but represent unrecoverable losses of capacity.

  Diagnosing the dispute requires moving beyond surface-level arguments. It is not *purely* verbal, as the proxies provide measurable referents for the terms "demographic" and "institutional" presence. However, the choice of which proxy is paramount *is* central: privileging the Demographic Proxy (D) aligns with seeing continuity in the people on the land, while privileging the Institutional Proxy (I) aligns with identifying the society with its complex superstructure. This choice is not neutral; it reflects a prior commitment. The disagreement also involves **hysteresis**, critically. Transformation narratives often imply a degree of reversibility or functional equivalence post-change. Hysteresis challenges this, demonstrating that the mechanisms enabling complex institutions are fragile and, once lost (e.g., literate bureaucracy, fiscal systems, trade networks), may be impossible to rebuild even if original conditions return. The loss is not just of form, but of *capacity*. This irreversibility pushes an event beyond mere "transformation" for many observers.

  Crucially, the dispute hinges on **normativity** and the **thick term** "collapse." Describing an event as "collapse" does more than note decline in D or I; it *evaluates* that decline as a *failure*, a negative outcome. This evaluation often subtly identifies "the society" with its institutional apparatus (I) rather than its population (D). The transformation camp, by emphasizing continuity in D or functional adaptation, often rejects this negative valuation or redefines the society's essence as lying elsewhere. The dispute, therefore, is about what we value and what we consider a "failure": the disappearance of a specific institutional order and its capacities (hinted at by hysteresis), or the survival of a population adapting to new circumstances.

  Applying this to the trajectories illuminates these tensions. **Trajectory A (Both D & I >80% down, stay down)** is the clearest case for "collapse." Both core proxies indicate catastrophic, permanent loss. Hysteresis is evident: whatever caused the decline also destroyed the mechanisms for recovery. The normative judgment of failure is strong, focusing on the utter disappearance of both people and institutions. The transformation slogan struggles here; while *individuals* may have survived elsewhere, the specific society, defined by both D *and* I in that place, ended.

  **Trajectory C (I collapses, D stable)** is the most revealing. A transformation advocate, prioritizing D, sees continuity: the people remain, farming continues – the society adapts. A collapse proponent, prioritizing I and considering hysteresis, sees catastrophic failure: the complex institutions, monumental achievements, administrative order, and crucially, the *capacity* to recreate them, are gone, likely permanently. Hysteresis is key: restoring the population level (already stable) or climate won't bring back the literate class, the fiscal know-how, or the trade partners needed to rebuild the institutions. The loss of I represents an unrecoverable reduction in complexity and potential. Whether this is "collapse" depends entirely on whether one values institutional complexity as constitutive of the society's success and identity. The thick term "collapse" captures the profound, irreversible *loss of potential* inherent in this hysteresis.

  **Trajectory B (D down >80%, I recovers under new elites)** might be claimed by both camps. Transformation is evident: institutions bounce back, albeit under new management. However, hysteresis still applies: the *mechanism* of recovery involved a rupture and new actors, suggesting the old institutional *system* couldn't be rebuilt – a specific capacity was lost. The >80% loss in D is also catastrophic demographically. While institutions recover, the societal fabric experienced a rupture severe enough to wipe out most of the population and displace the elite. Calling this purely "transformation" risks downplaying the scale of human suffering and discontinuity. It might represent a collapse of the *old order* followed by a transformation into a new one, rather than a seamless change.

  **Trajectory D (Absorption)** is transformation through subsumption. The society loses its political and cultural autonomy – a key aspect of its identity for its elites and perhaps its population. While D and I persist *somewhere*, they are no longer directed by or in the name of the original polity. This is transformation, but arguably a specific kind of institutional and political "death," a collapse of independent agency.

  **What work does "collapse" do?** Once we acknowledge the proxy choices, window sensitivity, and hysteresis, "collapse" retains vital conceptual work. It signals **catastrophic, often irreversible loss** – particularly of complex institutional capacities (highlighted by hysteresis) – experienced within a humanly meaningful timeframe (addressed by window sensitivity). It forces us to confront the **negative valuation** of such loss and the **normative question** of what we consider a societal "failure." It serves as a conceptual marker for events where the mechanisms of a particular complex order are destroyed beyond recovery, even if life continues in a simpler form (Trajectory C) or elsewhere (Trajectory D). It reminds us that not all change is equal; some changes represent profound regressions in human organization, capability, and resilience, with enduring consequences. The concept of collapse, rigorously defined through proxies and hysteresis, compels us to ask not just "did it change?" but "what was irreparably lost?"

  ---

  **Section 3: Marking Scheme (25 Marks Total; Approx. 450 words)**

  *   **1. Diagnosis of Dispute Core (6 marks):** Accurately identifies and justifies the *primary* nature of the dispute. Must move beyond "verbal" to recognize the interplay between proxy choice (defining society), hysteresis (irreversibility), and normativity (thick term). Simply stating it's "normative" without linking to proxies/hysteresis is insufficient. Top marks for integrating all elements.
  *   **2. Analysis of Two Trajectories (8 marks - 4 marks per trajectory):** For each chosen trajectory (A, B, C, or D), clearly argues for "collapse" or "transformation," explicitly using the proxies, engaging with window sensitivity *briefly* (if relevant to the argument), and **crucially, incorporating hysteresis in a substantive way**. Must show understanding of how hysteresis impacts reversibility/capacity. Simply mentioning it isn't enough. Analysis must link back to the diagnosed core of the dispute.
  *   **3. Substantive Use of Hysteresis (5 marks):** Demonstrates a clear understanding of hysteresis beyond metaphor. Explains *how* the destruction of mechanisms (literate cadre, fiscal system, networks) prevents recovery even if forcing reverses, and explicitly links this to the irreversibility that distinguishes "collapse" from mere "transformation" for certain proxies/valuations. Must be integrated into the trajectory analysis or core diagnosis argument.
  *   **4. Addressing Normativity & Thick Terms (4 marks):** Explicitly recognizes that "collapse" is a thick evaluative term, describing loss *and* ranking it as failure. Connects this to the implicit valuation in choosing which proxy (D or I) defines the society's core identity/success. Must be linked to the diagnosis and/or trajectory analysis.
  *   **5. Conceptual Work of "Collapse" (2 marks):** Clearly articulates what substantive work the concept retains after the apparatus is considered (e.g., signaling catastrophic irreversible loss of capacity, forcing normative evaluation, marking unrecoverable regressions). Avoids vague restatements of the slogan or simple definitions.

  **A/B Differentiation:** The move that decisively separates an A (First-class) answer from a B (Upper-second) answer is the **integrated substantive application of hysteresis to normativity.** A B answer might correctly diagnose normativity, mention hysteresis, and analyze trajectories, but an A answer will **explicitly use hysteresis (the irreversible loss of *capacity-building mechanisms*) as the key reason *why* the loss of institutional complexity (I) warrants the negative evaluation inherent in "collapse,"** particularly in contested cases like Trajectory C. It shows how hysteresis makes the loss profound and justifies the thick term's evaluative component.

  ---

  **Section 4: Frequent Failures (Approx. 250 words)**

  1.  **Declaring the Dispute Purely Verbal & Stopping (-8 marks):** Simply stating it's "just semantics" without engaging the substantive differences revealed by proxies, hysteresis, and normativity. *Why:* Oversimplifies complex debate; ignores the apparatus provided.
  2.  **Sliding Between Proxies Unconsciously (-5 marks):** Using D and I interchangeably when defining "society" or "collapse" without acknowledging the analytical choice being made and its consequences. E.g., Using D's persistence in Trajectory C to argue against collapse without addressing the loss of I and its implications. *Why:* Undermines the core analytical tool; leads to inconsistent arguments.
  3.  **Treating Hysteresis as Poetic Flourish (-4 marks):** Mentioning "hysteresis" but using it only metaphorically (e.g., "it was hard to bounce back") without explaining the *mechanism* of lost capacity (literacy, fiscal systems, networks) and how this creates irreversibility. *Why:* Fails to engage with the substantive point about non-recoverability central to distinguishing collapse from transformation.
  4.  **Ignoring the Normative/Thick Term Component (-5 marks):** Discussing proxies and trajectories purely descriptively without acknowledging that labelling something "collapse" carries an inherent negative evaluation and involves identifying the society with specific structures (usually I). *Why:* Misses a fundamental dimension of the debate; fails to answer why the dispute persists beyond data.
  5.  **Data Determinism (-3 marks):** Suggesting that simply getting "better data" on D or I would automatically resolve whether collapse occurred, ignoring the normative/evaluative judgment inherent in applying the term. *Why:* Misunderstands the nature of thick concepts like collapse; neglects the role of interpretation and valuation.
