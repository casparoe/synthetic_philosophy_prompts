answer: |-
  ## The Recurrent Somatic Trait: A Virtue of Etiology

  The dispute between etiological and causal-role accounts of biological function hinges fundamentally on the *explanatory work* we demand such attributions to perform. Function statements earn their keep, for the etiologist, by answering a specific historical-explanatory question: *Why is this type of trait present and maintained in the organism/population?* The answer points to a history of selection *for* the trait’s specific effect, thereby explaining its persistence. The causal-role account, in contrast, answers a synchronic question: *What is this trait’s current contribution to a salient capacity of the system?* While both perspectives offer valuable insights, the case of the lancet cell exposes a critical divergence in their commitments and explanatory power, revealing the virtue of the etiological account’s stringent historical requirement.

  **I. Function, Explanation, and the Lancet Cell’s Status**
  Attributing a *proper function* (in the etiological sense) to the lancet cell is unwarranted because it fails to explain the trait’s presence. Why are lancet cells reliably present in each individual? The answer lies *not* in any history of selection acting *on lancet cells themselves*, but solely in the history of selection acting *on the fragile site*. The fragile site is heritable, exhibits variation (maintained by stabilizing selection), and its presence is explained by its effect: reliably generating lancet cells. The lancet cells, however, are ephemeral somatic products. No token lancet cell has ever reproduced or been selected *for* its harpoon-firing effect. Crucially, there is no lineage of lancet cells subject to differential survival and reproduction based on their performance; they are generated anew each generation via a mechanism (the fragile site) whose stability *is* explained by selection. Selection sorted *genotypes* carrying the fragile site, not *lancet cells* for their toxic efficacy. Attributing a function *to the lancet cell itself* would misidentify the target of selection and obscure the actual evolutionary explanation for its recurrence.

  Instead, we should categorize the lancet cell’s toxic harpoon-firing as a *selected-for effect* of the fragile site. The fragile site’s proper function *is* to produce cells capable of firing toxic harpoons (or more precisely, to produce cells that *tend* to develop into such cells). The harpoon-firing itself is the beneficial effect *for which* the fragile site was selected. This is not a terminological concession granting the causal-role theorist their desideratum. The causal-role account seeks to attribute function *directly* to the lancet cell based on its current systemic contribution to colony defence. Our categorization denies this. While the harpoon-firing *is* a causally significant effect produced *by* a functional mechanism (the fragile site), it is not itself a bearer of a proper function within the etiological framework. The function resides in the mechanism that generates the effect, not in the effect-producing entity itself. This preserves the crucial etiological link: the function explains the existence of the mechanism (the fragile site), not the existence or nature of the somatic product (the lancet cell).

  **II. Blocking the Escape Hatch: Why Lancet Cells Don't "Borrow" Function**
  The standard etiological move – allowing an item to "borrow" function from its producing mechanism – is tempting but fatally flawed here. Applying it would indeed assign the function "produce lancet cells" to the fragile site. However, asserting that the lancet cell thereby "borrows" the function "fire toxic harpoons" commits a category error and proves far too much.

  The "borrowing" move typically applies to items *produced to perform* a specific task, where the production mechanism's function *is* to generate items that perform that task (e.g., hearts are produced to pump blood). The function of the product is intrinsic to the selective rationale for the producer. This fails for the lancet cell. The fragile site was selected *for producing cells that reliably develop the capacity* to fire harpoons, *not* for producing cells that *then* have the further function of firing them. The selective history explains the *production of the cell type*, not the attribution of a further function *to the cell type itself*. The harpoon-firing is the *direct beneficial effect* that explains the selection for the fragile site; it is not a *further task* assigned to the product. Crucially, applying "borrowing" here would force us to assign proper functions to *any* beneficial byproduct reliably generated by a functional mechanism. Consider a functional gland selected for producing a vital hormone; it also reliably produces heat as a byproduct. Does the heat "borrow" the function "warm the body" simply because it's a reliable, beneficial effect? The etiological account rightly denies this – the heat wasn't selected *for*. Similarly, the lancet cell’s harpoon-firing, while causally crucial and beneficial, is the *effect for which the producer was selected*, not a function bestowed upon the product. Assigning a proper function to the lancet cell via borrowing conflates the selected effect *of* a mechanism with a function *possessed by* its output, opening the floodgates to trivializing function attributions for any reliable beneficial consequence.

  **III. Normativity Without Proper Function: The Fragile Site Standard**
  Denying the lancet cell a proper function seems to abandon the etiological account’s prized advantage: explaining malfunction. If a lancet cell fails to fire, isn't it defective? Yet we deny it has a function. This tension is resolvable by recognizing the source of normativity. The normativity derives *not* from a function assigned to the lancet cell itself, but from the proper function of the mechanism that produces it.

  The fragile site has the proper function: *to produce cells capable of firing toxic harpoons at encroachers*. A "defective" lancet cell is simply one produced by a token fragile site that, in that instance, failed to fulfill *its* function adequately. The failure lies in the *output* of the functional mechanism, not in the somatic cell failing *its own* purpose. The standard is set by what the fragile site was selected *to do* – produce effective harpoon-firing cells. A lancet cell that misfires is a token instance where the fragile site’s functional output is substandard. We judge the lancet cell "defective" derivatively, based on the failure of the producing mechanism to generate its selected effect. This preserves the core etiological insight – normativity is grounded in historical selection – while accurately locating the function bearer (the fragile site) and the source of the standard (its selected effect). We account for the intuitive judgment of defectiveness without falsely inflating the lancet cell into a bearer of its own selective history.

  **IV. The Causal-Role Rejoinder and the Explanatory Divide**
  The causal-role theorist’s strongest reply is undeniable: a field biologist observing the colony would unhesitatingly state, "The function of the lancet cell is colony defence." This attribution, they argue, is a synchronic claim about current causal contribution within the working system, devoid of historical commitment. Demanding an etiological function misreads the biologist's intent and the practical utility of functional language in describing biological organization.

  This rejoinder highlights a genuine difference in focus but misses the etiological account’s core purpose. The biologist’s statement is pragmatically useful shorthand, capturing the lancet cell’s salient *causal role*. However, this synchronic attribution *cannot answer* the historical-explanatory question: *Why is this specific trait type recurrently present?* Pointing to its current contribution to colony fitness provides only a *proximate* reason for its current utility, not an *ultimate* explanation for its existence and reliable recurrence across generations. The causal-role answer ("it defends the colony") is precisely what *needs explaining*: why does a trait performing this valuable role exist? The etiological account provides the answer: because a mechanism (the fragile site) that reliably generates this effect *was selected for doing so*. The causal-role attribution, while practically useful in context, remains explanatorily shallow for the evolutionary biologist seeking to understand trait origins and maintenance. It conflates the *effect* a trait has (which can be described causally) with the *reason* the trait exists (which requires history). The field biologist’s statement, though common, reflects a focus on immediate mechanism, not an endorsement of the causal-role account as a complete theory of biological function capable of grounding evolutionary explanations. Accepting their usage as theoretically sufficient would render the profound difference between traits shaped by selection-for and mere fortuitous beneficial effects inexplicable.

  **Coda: A Hesitation and its Test**
  The premise I find most contestable is the strict refusal to allow *any* "borrowing" of function from producer to product in cases like this, even when the product is a distinct, complex, and reliably generated entity-type like the lancet cell. Might the reliable somatic *development* of such a specialized, fitness-enhancing cell type under tight developmental control blur the line? What would most quickly change my mind is evidence that working evolutionary biologists, when confronted with analogous real-world phenomena (e.g., somatic selection systems like adaptive immunity), consistently and unproblematically attribute "functions" *to the somatic variants themselves* (e.g., "the function of this specific antibody is to bind antigen X") in their explanatory narratives *about evolutionary processes or trait origins*, not just in descriptions of current physiology. If such usage explicitly grounds explanations for why specific somatic traits *recur* or are *maintained* within organisms, bypassing the germline producer, it would suggest a practical need to extend etiological function beyond inherited traits.
