  We are given a setup with Nozick-style tracking conditions and closure. The problem is that with the usual interpretation of the counterfactual condition (iii) for skeptical hypotheses (like being a brain in a vat), we get a failure of knowledge. But if we interpret (iii) with the method-relativization and consider that in the skeptical world the method M might not be usable, we get vacuously true conditions and thus knowledge of the denial of skeptical hypotheses. This seems to both undermine the anti-skeptical bite of tracking and also make the sensitivity condition vacuous for many ordinary cases.

  The argument proceeds as follows:

  (1) We have knowledge of a mundane proposition p (e.g., "there is a mug on my desk") via method M (vision) because in the nearest worlds where p is false, we don't believe p via M.

  (2) We know that p entails not-H (where H is the skeptical hypothesis that we are a mugless envatted brain).

  (3) By closure, we should know not-H.

  (4) But if we try to check the tracking condition for not-H: in the nearest world where not-H is false (i.e., H is true), we would still believe not-H (because our experiences are the same). So condition (iii) fails.

  (5) Therefore, without modification, tracking and closure conflict.

  (6) However, if we read condition (iii) as: "were p false and S to use M to arrive at a belief whether p, S wouldn't believe p via M", then for not-H, in the nearest H-world (where we are envatted), we cannot use M (vision) at all because we have no eyes. So the antecedent "were S to use M" is false in that world, making the counterfactual vacuously true. Thus condition (iii) holds and we know not-H.

  (7) This applies to all skeptical hypotheses that remove the method. So tracking does not yield the Nozickian asymmetry (we know ordinary things but not the denials of skeptical hypotheses) — instead, we either lose knowledge of ordinary things (if we don't use the vacuity move) or gain knowledge of the denials of skeptical hypotheses (if we do).

  (8) Moreover, if we describe M in a way that essentially involves p (like "seeing that p"), then for any true p, condition (iii) becomes vacuously true because in the nearest not-p world, we wouldn't be seeing that p (since p is false). This makes the sensitivity condition useless in fake-barn cases and Gettier cases.

  The conclusion is that there seems to be no way to formulate tracking to preserve both closure and the anti-luck condition. The author would prefer to keep closure and the verdict on fake-barn cases (which tracking typically says we don't know) rather than stick to the letter of (iii).

  The question: Which step is causing the problem? And if we drop method-relativization, do we get back the problem that we don't know anything about the unobserved present?

  Step-by-step analysis:

  The core issue is with the interpretation of condition (iii) and the method-relativization. The problem arises when we consider propositions for which the method M is not available in the counterfactual world where p is false.

  In particular, for the skeptical hypothesis H, the method M (vision) is not available in the H-world. The standard way to interpret counterfactuals with impossible antecedents (like using M in a world where M is not available) is to treat them as vacuously true. This is the move in (6).

  But then, as (8) points out, if we allow M to be described in a way that is factive (like "seeing that p"), then in any not-p world, we are not seeing that p, so the antecedent of the counterfactual in (iii) is false and the condition is vacuously true. This would mean that for any true belief formed by such a method, condition (iii) is automatically satisfied. That would be bad because it would let in fake barn cases: in a fake barn scenario, if I form the belief "that's a barn" by looking at the one real barn, then condition (iii) would be vacuously true in the same way? Let's see:

  - In the fake barn case: p is "that is a barn". Method M is "visual perception". In the nearest not-p world (where that is not a barn), I might be looking at a fake barn and form the belief that it is a barn. So condition (iii) fails because I would believe p (via M) even in the not-p world.

  But if we describe M as "seeing that that is a barn", then in the not-p world, I am not seeing that that is a barn (because it isn't). So the antecedent "were S to use M" (i.e., were S to see that that is a barn) is impossible in the not-p world. Thus condition (iii) is vacuously true.

  This is the problem: the method-relativization, when the method is described in a way that presupposes the truth of p, leads to vacuity and failure to rule out fake barn cases.

  So the damage is done by the combination of:

  (a) The method-relativization that allows for the possibility that the method is not available in the counterfactual world.

  (b) The description of the method in a factive way (like "seeing that p") which makes the method inapplicable in any not-p world.

  Thus, step (6) and (8) are the key points where the problem becomes apparent.

  Now, what if we drop the method-relativization?

  The original Nozick condition (without method-relativization) for sensitivity is:

  (iii) If p were false, then S would not believe p.

  In the skeptical hypothesis case:

  - For p (the mug): in the nearest world without the mug, I wouldn't believe p. So (iii) holds for p.

  - For not-H: if not-H were false (i.e., if H were true), I would still believe not-H (because I have the same experiences). So (iii) fails for not-H -> I don't know not-H.

  But then closure fails because I know p and know that p entails not-H, but I don't know not-H.

  Now, without method-relativization, what about the unobserved present? For example, do I know that the President is in the White House right now? I believe it based on a news report. The counterfactual: if it were false, would I still believe it? Well, if the President were not in the White House, the news might still report that he is (e.g., if there's a cover-up). So condition (iii) might fail and I wouldn't have knowledge. This is the familiar problem.

  But note: without method-relativization, we also get problems in the fake barn case. In the fake barn case, if I look at the real barn and believe p ("that is a barn"), then in the nearest world where it is not a barn (but a fake), I would still believe it is a barn (because I can't tell by looking). So condition (iii) fails and I don't know. That's the correct verdict for fake barns.

  However, without method-relativization, we also lose knowledge in cases where the method is reliable but the counterfactual fails because of a cover-up or deception. This is the problem of the unobserved present.

  So if we drop method-relativization, we get:

  - We keep the anti-luck condition (so fake barns are not known).
  - We lose knowledge of many things that we would ordinarily think we know (like the President's location) because of the possibility of systematic deception in the counterfactual world.
  - We also get the failure of closure in the skeptical case.

  But without method-relativization, we don't get the vacuity problem for condition (iii) that we saw when methods are described factively.

  So the trade-off:

  - With method-relativization: we avoid the problem of the unobserved present (because we fix the method and in the counterfactual we consider only worlds where we use that method) but then we face the vacuity problem for methods that are not available in the counterfactual world, which leads to both the problem of knowing the denials of skeptical hypotheses and the problem of vacuity for factive methods.

  - Without method-relativization: we have the problem of the unobserved present (because the counterfactual might fail due to deception) but we avoid the vacuity problem and we can handle fake barns correctly.

  The author's preference is for closure and the fake-barn verdict. Without method-relativization, we have the fake-barn verdict (we don't know) but we lose closure (because we know p but not not-H). So that doesn't satisfy the author.

  Alternatively, if we keep method-relativization but avoid factive descriptions of methods, then we might avoid the vacuity problem. For example, if we describe the method for the mug as "visual inspection of the desk" (which does not presuppose that there is a mug) then:

  - For p: in the nearest world without a mug, I use visual inspection and don't see a mug -> I don't believe p. Condition (iii) holds.

  - For not-H: in the nearest world where not-H is false (H true), I am a brain in a vat. Can I use the method "visual inspection of the desk"? Arguably, in the vat world, I am having experiences as if I am visually inspecting a desk. So if we construe "using the method M" broadly to include the internal process (even if it is hallucinatory), then in the vat world I do use M and I do believe not-H. So condition (iii) fails because in the H-world I believe not-H via M.

  So then we don't know not-H, and closure fails.

  But if we construe M in a way that requires actual eyes and a desk, then in the vat world I don't have eyes and a desk, so I cannot use M -> condition (iii) is vacuously true. So then I know not-H.

  The tension is in how we individuate the method.

  To avoid vacuity, we must not allow methods that are defined in a way that they can only be used in p-worlds. We must describe methods non-factively.

  But even then, for skeptical hypotheses, if we describe the method non-factively (like "having experiences as of a mug on the desk and forming a belief based on that"), then in the vat world I do use that method (I have the experience and form the belief) and I believe not-H. So condition (iii) fails.

  So then we don't know not-H and closure fails.

  Alternatively, if we describe the method as involving a causal connection to the world (so that in the vat world I am not using the same method because the causal chain is different), then condition (iii) might be vacuously true? But that's a different theory (reliabilism) and not tracking.

  In summary:

  - The problem step is the method-relativization combined with the possibility of describing the method in a way that is not available in the counterfactual world, leading to vacuity.

  - If we drop method-relativization, we avoid the vacuity problem but we get the problem of the unobserved present and we lose closure.

  There is no formulation that preserves both closure and the anti-luck bite in all cases. The author must choose. The author prefers to keep closure and the fake-barn verdict. But without method-relativization, we get the fake-barn verdict (don't know) but lose closure. With method-relativization (and non-factive methods) we might keep closure only if we allow that in the skeptical world we are not using the same method (so condition (iii) is vacuously true) but then we lose the anti-luck bite for the skeptical hypothesis (we know not-H). Alternatively, if we say we are using the same method in the skeptical world, then condition (iii) fails and we don't know not-H, so closure fails.

  So the author's preference (closure and fake-barn verdict) is not achieved by tracking in any formulation.

  The bad step is the method-relativization when it leads to vacuity. But without it, we have other problems.

  Perhaps the solution is to adopt a different theory of knowledge? The author might be pointing out that tracking theories are inherently flawed in this way.

  But to answer the immediate question: the damage is done by the method-relativization when the method is described in a way that is inapplicable in the counterfactual world (step 6 and 8). And dropping method-relativization buys us the problem of the unobserved present and the failure of closure.

