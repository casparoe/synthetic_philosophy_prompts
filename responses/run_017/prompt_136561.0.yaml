and intact, with real actuators inside one building, a verified shutdown, and no self-modification — YELLOW, and she added that she would have given the same rating if the goal had been to smash every vase in the building. What I notice is that her record has a hole in it: she has never rated anything that was superhuman, long-horizon, and equipped with genuine actuators all at once.

