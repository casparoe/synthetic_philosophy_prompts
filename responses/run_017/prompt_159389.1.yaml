prompt: |-
  hey — I'm a junior and I help out with this kinda dumb satirical newsletter my school puts out, and we've got a recurring bit called "Documents from a Universe Where…" (last issue was a DMV handbook from a world where everyone is a compatibilist about free will, it was fine, not great). This issue I want to do occasionalism. We read a little bit of al-Ghazālī in my philosophy elective — the thing where fire doesn't actually burn the cotton, God just creates the burning whenever cotton and fire are around each other, and we call it "cause" because of habit. My friend Jenna keeps saying this is just Hume with extra steps and I keep saying no, because for the occasionalist the regularity is still real and reliable out there in the world (it's God's custom, not just a expectation in our heads) whereas for Hume, I dunno, it's more like it's in us. I might be wrong about that, which is part of why I'm asking.

  What I want from you: an internal memo — a policy circular from the legal-compliance department of a big fire-and-casualty insurance company in a jurisdiction where occasionalism is settled law and the courts have barred causal language in claims assessment. Around 600-700 words, numbered clauses with headers, deadpan corporate voice, one invented compliance officer as the author, and a date and a circulation list if that helps it feel real. The stuff I actually care about:

  1. Write it from inside the view. The author genuinely believes this and is trying to be useful — no winking, no "as if," no little aside to the reader explaining the philosophy.
  2. Nearly every sentence has to be rebuilt to avoid creaturely causation: "the fire destroyed the warehouse" becomes "the warehouse was destroyed, and fire had been present," that sort of thing. Most of the comedy should come from watching a real institution try to function like this — underwriting, adjusters, safety inspections, employee discipline.
  3. Don't strawman it. The sequence is reliable and the memo shouldn't hedge in ordinary cases, because the uniformity is backed by the divine custom and not by our own sloppy habits — so no "we can't know anything lol." Miracles are the one place the reliability admits exceptions, and I want that handled: what does the claims department call a case where the cotton didn't burn?
  4. I rlly want one bit where you push the logic somewhere gross, modest-proposal style. My idea: since the connection is contingent rather than necessary, a careful compliance department should hedge against "habit drift" — the custom could in principle shift a little, or stop. So maybe there's a new premium, or a deviation log, or an actuarial footnote. Follow it to its most repulsive conclusion — closing the fire-prevention division, a new product line, whatever — so the reader recoils a bit.
  5. Somewhere it should come out that no employee can be credited or blamed for anything, including the author, and the memo should try to be okay with that without being sad about it.

  Also: dont make it read like it was written by someone who learned occasionalism off Wikipedia this morning — if "the world is re-created at every instant" is a separate atomist commitment and not the causal one, handle it right or leave it out, I don't care which. And my teacher is probably going to read this, so if there's a real distinction I'm collapsing with the whole "guaranteed divine habit" thing, use the more defensible version and then add me a short note after the memo (not in it) saying what you did and why.
