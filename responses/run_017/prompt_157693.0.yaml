prompt: |-
  I run a tiny reading group that's been grinding through personal identity stuff, and we keep going in cirlces on the teletransporter case: scanner destroys the body here, replica wakes up on Mars, reductionist says fine because what matters is preserved, non-reductionist says no that's just death with a copy left behind. It's stopped being useful — people recite their position instead of thinking about it. So I want a case engineered to flip that pattern: a scenario where the reductionist has to say the person does not survive and nothing that matters in survival is preserved, while the non-reductionist has to say the very same person survives and, since identity is what matters in survival, that what matters is fully preserved. Same two theories, opposite verdicts, opposite direction from the stock case.

  Constraints, because I know how easy it is to cheat here: (1) realistic-ish setting — a hospital, a clinic, a neurologist and a family, something that could plausibly happen in the next fifty years; no fission, no duplicates, no uploading, no branching, and please don't bring souls into the setup at all. (2) Don't make it brain death or a permanent vegetative state — that's its own tired argument and it's contested whether the organism is even still there. (3) Both verdicts have to be generated rather than stipulated: the non-reductionist's you survive has to fall out of something any non-reductionist would grant, like the uninterrupted continued existence of the same living brain or organism, and the reductionist's verdict has to fall out of the psychological criterion with any cause, not from you announcing in the setup that the psychology was destroyed. (4) There needs to be a real decision inside the case — an advance directive written twenty years earlier that someone now has to honour or override, a spouse deciding whether they're still married to this person, a surgeon asking for consent to the next operation — such that the two views give different answers about what it's rational to do or to fear. Verdict-matching with no practical upshot isn't what I'm after. (5) Try to close the two obvious escape hatches, or tell me honestly if you can't: the reductionist shouldn't be able to slide into continuity is partial, so identity is just indeterminate and prudential concern comes in degrees, so engineer the loss cleanly enough to block that; and the non-reductionist shouldn't be able to reply of course you survive but obviously the psychological catastrophe is terrible for you without noticing that this reply concedes the reductionist's whole point. Also tell me what a biological or animalist view says here, and whether your case actually separates it from the Simple View or just lumps them together.

  After the scenario — a paragraph or two, no more — walk me through what each theory says and why, name the single feature of the case that's doing the work, and say what happens if it's removed: what if you leave one thin strand of psychological continuity, or make the damage gradual, or make it reversible? Then give me the best attack available to a defender of whichever theory comes out looking worse. And last thing, the bit I'm genuinely unsure about: is this really a reversal of the teletransporter, or does it just relocate the disagreement from identity to what matters? If it's the second one I'd rather know that up front than find out halfway through writing it up.
reasoning: |-
  Okay, let me tackle this problem. The user runs a reading group stuck on the teletransporter paradox. They want a scenario that flips the reductionist and non-reductionist positions. The constraints are strict: realistic medical setting, no brain death or souls, must force clean verdicts with practical implications, and block common escape routes.

  First, I need to understand what flips the teletransporter case. In the original, reductionists accept the copy as survival via psychological continuity, while non-reductionists see it as death because the original body is destroyed. For reversal, the reductionist must deny survival despite physical continuity, and the non-reductionist must affirm survival despite psychological discontinuity.

  The core challenge: reductionists care about psychology, non-reductionists about biological continuity. To flip, we need biological continuity without psychology, and psychological discontinuity without physical destruction. 

  Medical scenarios come to mind - severe brain injuries that preserve brainstem function but erase higher cognition. Locked-In Syndrome is too conscious. Persistent Vegetative State (PVS) is contested territory. The user banned PVS because it's overused and ambiguous about organism survival. Need something clearer.

  What about complete global ischemic anoxia? If the cortex is wiped out but the brainstem keeps breathing and heartbeat going, the organism lives biologically but consciousness and psychology are gone forever. That's a candidate. 

  Testing against constraints:
  - Realistic? Yes, within 50-year medical plausibility.
  - No brain death? Correct, since brainstem function remains.
  - Verdict generation: Non-reductionist sees same organism → survival. Reductionist sees psychological annihilation → death.
  - Practical decision: Withdrawal of care fits perfectly. Advance directive vs. spouse's wishes creates tension.
  - Escape hatches: 
    For reductionist: Complete psychological wipe blocks "partial continuity" dodge. 
    For non-reductionist: If they say "survival but terrible", they concede psychology matters - which is the reductionist's point. Perfect.

  Animalism? Would say survival, aligning with non-reductionism here. But the case separates them if we consider non-biological non-reductionism (e.g., soul-based), which user banned - so effectively merged. 

  Is this a true reversal? In teletransporter, disagreement is about copying vs. continuation. Here, it's about biological continuity without psychology. The "what matters" question does relocate - from identity-in-copying to identity-in-psychology-loss - but that's precisely the flip the user wants. 

  Biggest vulnerability: Could reductionists argue residual brainstem activity constitutes minimal psychology? But instincts aren't narrative identity. And non-reductionists might still claim the organism's interests persist, but that seems weak compared to psychological annihilation.

  Final check: Scenario forces reductionists to accept death (no psychology), non-reductionists to accept survival (biological continuity). Practical decision spotlights the conflict. Escape paths blocked. Medical realism intact. Flips the teletransporter by swapping which continuity type is preserved/destroyed.
answer: |-
  Here's a scenario designed to flip the verdicts, meeting your constraints and forcing the practical decision:

  **The Case of the Cortical Catastrophe:**  
  Dr. Aris Thorne suffers a sudden, catastrophic stroke during surgery. Advanced neuroimaging reveals complete, irreversible destruction of her entire cerebral cortex due to anoxia. However, her brainstem remains fully intact and functional, sustaining breathing, circulation, and basic reflexes. Her body is warm, breathes unaided, and exhibits sleep-wake cycles. There is *zero* detectable higher brain function: no consciousness, no cognition, no memory traces, no capacity for any psychological states – a total and permanent erasure of her personality, beliefs, desires, and memories. Decades ago, Dr. Thorne signed a clear advance directive: "If I permanently lose all capacity for consciousness and higher mental function, I do not wish to be sustained by artificial means." Her spouse, Lena, disagrees, believing "Aris is still alive in there," and demands continued full care (nutrition, hydration, infection treatment). The hospital ethics board must decide whether to honor the directive and withdraw supportive care or override it based on Lena's belief that Aris survives.

  **Walkthrough & Analysis:**

  1.  **Non-Reductionist Verdict (Simple View / Biological Continuity):**  
      *   **Survival & Identity Preserved:** The *same human organism* persists. Biological life continues uninterrupted – metabolic processes, homeostatic regulation, integrated functioning sustained by the intact brainstem. No spatial discontinuity or physical destruction occurred; it's the same body in the same bed. For non-reductionists (especially animalists), identity *is* the persistence of the living human animal. Therefore, Dr. Aris Thorne survives.
      *   **What Matters Preserved:** Since identity (the organism's persistence) is what fundamentally matters in survival, what matters *is* preserved. Lena is correct; Aris still exists. Honoring the advance directive would end Aris's life.
      *   **Practical Verdict:** Override the directive. Withdrawing care kills Aris.

  2.  **Reductionist Verdict (Psychological Criterion):**  
      *   **Death & Identity Destroyed:** The psychological continuity and connectedness essential for personal identity have been *completely and irrevocably destroyed*. There is no chain of psychological connections (memories, intentions, character traits) linking the current entity to the pre-stroke Aris. The cause (biological damage) is irrelevant; the *result* is the utter annihilation of the psychology. What remains is a biologically living human organism, but it is not Aris Thorne. Aris ceased to exist at the moment of cortical annihilation.
      *   **What Matters NOT Preserved:** Prudential concern, anticipation, responsibility, and the "what matters" relation depend on *future psychological states being appropriately connected to my current ones*. Here, no future psychological states *of Aris* are possible. There is no subject for whom this organism's continued existence matters *as survival*. What remains is an entity fundamentally discontinuous with Aris psychologically.
      *   **Practical Verdict:** Honor the directive. The directive applies *to* Aris, written *by* Aris for precisely this scenario – the permanent loss of her psychology. Withdrawing care doesn't kill Aris (she's already gone); it allows the remaining biological organism to die. Lena is married to a corpse.

  **The Single Feature Doing the Work:**  
  **The complete, irreversible erasure of *all* higher brain function/psychology *while* the organism (specifically the brainstem) remains biologically alive and integrated.** This creates the biological continuity non-reductionists require for identity and the psychological discontinuity reductionists require for non-identity.

  **Manipulating the Feature & Consequences:**

  *   **Thin Strand of Psychology Preserved:** (e.g., a single, isolated memory trace detectable via advanced fMRI, but no consciousness or other function).  
      *   *Non-Reductionist:* Still survives (organism intact).  
      *   **Reductionist:** *Partial* continuity → Identity indeterminate? Prudential concern weak/partial? **Escape Hatch Opens!** The reductionist can now argue survival isn't clear-cut, concern is diminished but perhaps not zero, muddying the clean verdict. The scenario loses its force against them.
  *   **Damage Gradual:** (e.g., slow dementia eroding psychology while the body lives).  
      *   Creates a spectrum problem for *both* views. Non-reductionists face "is it still the same person?" questions earlier. Reductionists face degrees of connectedness and indeterminate survival. Clean verdicts collapse.
  *   **Damage Reversible:** (e.g., the anoxia was temporary; recovery of some function is possible).  
      *   Non-Reductionist: Survival never interrupted (organism persisted).  
      *   **Reductionist:** Psychological continuity was *interrupted* but *could be re-established* → Survival possible? Concern warranted? **Escape Hatch Opens!** The reductionist can argue that if psychology *returns* connectedly (even after a gap), survival obtains. The clean "Aris is gone" verdict vanishes.

  **Best Attack for the "Losing" Theory (Non-Reductionism):**  
  *"Granted, the organism survives, but the *person* Aris Thorne – the subject of experiences, memories, and relationships – is gone forever. The advance directive wasn't written by the organism; it was written by the *person* about the potential loss of the *person*. Honoring it respects the wishes of the person who existed, concerning the fate of the person she feared becoming (or ceasing to be). To claim 'Aris survives' in any meaningful sense relevant to her directive, her marriage, or her life projects is empty. You conflate biological life with personal existence, rendering directives like this nonsensical."*  
  *(This attack forces the non-reductionist to either bite the bullet that Lena is right and the directive shouldn't bind, or tacitly admit that the psychological loss is what's fundamentally significant, conceding the reductionist's core point about "what matters").*

  **Biological/Animalist View:**  
  The animalist unequivocally says the same human animal survives. The organism persists with its biological functions (regulated by the brainstem) intact. Therefore, Aris survives. This aligns perfectly with the non-reductionist verdict in this specific case. The case *does* lump together non-reductionist views based on substance (like a soul) and biological continuity (animalism) because it specifically leverages *biological* continuity as the alternative to psychological continuity. However, since you excluded souls, and animalism is the dominant biological view, it effectively targets the Simple View *via* its animalist instantiation.

  **Is it a True Reversal of the Teletransporter?**  
  **Yes, it is a genuine reversal of the locus of conflict:**  

  1.  **Teletransporter (Standard):**  
      *   *Physical Discontinuity:* Body destroyed here.  
      *   *Psychological Continuity:* Preserved in the replica on Mars.  
      *   *Reductionist:* Survives (psychology preserved).  
      *   *Non-Reductionist:* Dies (organism destroyed).  
      *   *Conflict:* Is physical continuity necessary? (Identity vs. What Matters often blurred here too).

  2.  **Cortical Catastrophe (Reversal):**  
      *   *Physical Continuity:* Same organism/brainstem persists uninterrupted.  
      *   *Psychological Discontinuity:* Complete and permanent erasure.  
      *   *Non-Reductionist:* Survives (organism persists).  
      *   *Reductionist:* Dies (psychology destroyed).  
      *   *Conflict:* Is psychological continuity necessary? Does biological persistence alone constitute survival?  

  The disagreement *does* relocate **from** "Does duplication (with psychological continuity but physical discontinuity) preserve identity/what matters?" **to** "Does biological continuity without *any* psychological continuity preserve identity/what matters?" It flips which type of continuity is preserved and which is destroyed, forcing the theories to swap their "survival" verdicts relative to the standard case. The core dispute remains "what grounds identity and what matters in survival?" but the engineered scenario forces each theory to defend the *opposite* conclusion they reach in the teletransporter case regarding survival. The practical decision (advance directive) explicitly ties the identity verdict to "what matters" prudentially and ethically, preventing the separation you worried about.
