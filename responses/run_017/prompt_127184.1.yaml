prompt: |-
  I'm on the advisory board for a mid-sized natural history museum, and we're stuck on the new permanent gallery covering the Late Bronze Age, the Classic Maya, and Rapa Nui. Our curators have come out hard against our working title — "Collapse" — saying it's factually wrong in all three cases and that it tells fifty thousand visitors a year that these people failed, when what actually happened is that settlements shifted, political systems got smaller and less centralized, the language and a lot of the religion carried on, and in one of the three cases the population crash came after Europeans showed up. Our education staff say the word is the reason anyone will buy a ticket and that it carries exactly the warning we want people to leave with. Two complications: the foundation that gave us the money has the word written into the gallery title in the gift agreement, and one board member has floated a compromise — keep the word, add a question mark, and put a live tally on the exit wall where visitors vote on whether each society collapsed.

  I also don't think the three cases are even alike: my impression is that our Aegean material looks much more like a genuine break than the Maya material does, so a single verdict for all three seems wrong to me.

  Draft me the one-page opinion I'll circulate before Tuesday's vote. It should say what we should actually do — keep the word, drop it, or something else — with a date by which the label copy has to be locked, and it has to take the curators' objection seriously rather than treating it as marketing fallout. One thing I'd like settled for me: are we arguing about how the word works, about what the word means, or about whether a museum ought to be delivering warnings at all? Because which one it is definately changes what we should do.
reasoning: |-
  Okay, let me approach this advisory board member's request methodically. The core tension revolves around using "Collapse" as an exhibition title for three distinct historical cases, with curators objecting to factual inaccuracy while education staff and funders insist on its impact. 

  First, I need to unpack the multiple layers of disagreement. The curators' objection isn't just semantic - they're arguing the term perpetuates colonial narratives of "failure" when the historical reality shows continuity (language, religion) and external factors (European contact). Meanwhile, the education team sees "collapse" as an essential hook for public engagement and cautionary messaging. The foundation's contractual requirement and board member's gimmicky compromise further complicate matters.

  Hmm... the user's note about the cases being fundamentally dissimilar is crucial. My research confirms their intuition: Late Bronze Age systems did experience abrupt disruption (sea peoples, trade collapse), while Maya "collapse" involved gradual political fragmentation amid cultural continuity. Rapa Nui's demographic crisis clearly post-dates European arrival. Forcing identical framing onto these is intellectually dishonest.

  The deeper question about museum ethics resonates most - are we educators or provocateurs? If we keep "collapse," we privilege shock value over accuracy and risk alienating descendant communities. But outright removal ignores funding realities and visitor expectations. 

  The solution must satisfy several criteria: respect scholarly integrity, fulfill funding obligations, maintain visitor appeal, and avoid false equivalence between cases. A title like "Endurance & Transformation" with thematic subsections could work - keeping "collapse" in foundation materials as a concession while centering resilience in public-facing content. The exit poll idea feels reductive, turning complex history into binary voting.

  For the memo structure: opening should validate all perspectives before dissecting the term's problems. Then propose the new title framework with clear implementation timeline (8 weeks for label rewrite seems feasible). Crucially, position this not as compromise but as upgraded storytelling - showing how societies navigate crisis aligns better with contemporary museum practice than simplistic catastrophe narratives.

  Final thought: The user's closing question about "warnings" is pivotal. Museums absolutely should contextualize present-day parallels, but through nuanced discussion - not loaded terminology that flattens historical specificity. That distinction should anchor the memo's conclusion.
answer: |-
  ## Advisory Board Opinion: Reframing the "Collapse" Narrative  
  **To:** Advisory Board & Senior Leadership  
  **From:** [Your Name], Advisory Board Member  
  **Date:** October 26, 2023  
  **Subject:** Proposed Path Forward for Permanent Gallery Title & Narrative  
  **Deadline for Label Copy Lock:** **December 15, 2023**  

  ### 1. Acknowledging the Core Conflict  
  This dispute transcends mere semantics or marketing. We are grappling with **three intertwined issues**:  
  *   **Historical Accuracy:** Curators rightly argue that "collapse" misrepresents the complex processes of transformation, resilience, and continuity documented in the Late Bronze Age, Classic Maya, and Rapa Nui cases. It implies a singular, catastrophic "failure," ignoring settlement shifts, political decentralization, cultural persistence, and the critical role of external forces (especially European contact in Rapa Nui).  
  *   **Museum Ethics & Responsibility:** Is our primary duty to sensationalize for attendance or to educate with nuance? Using a loaded, academically contested term like "collapse" as the *primary lens* risks perpetuating harmful narratives of Indigenous "failure" and oversimplifying history for dramatic effect.  
  *   **Effective Communication:** The education team is correct that audiences seek relevance. The *concept* of societal vulnerability, resilience, and transformation in the face of environmental stress, political instability, or external shocks *is* profoundly important and engaging. The *word* "collapse" is the problem.  

  ### 2. Why "Collapse?" is Fundamentally Flawed (Especially as a Unifying Title)  
  *   **Factual Inaccuracy (as presented):** The curatorial assessment is robust. "Collapse" fails as a blanket term:  
      *   **Late Bronze Age:** Involved system-wide disruption (palace economies, trade networks), but local continuity and regeneration occurred. "Collapse" fits *closest* but remains debated.  
      *   **Classic Maya:** Represents a *political* fragmentation of city-states and demographic shifts in the southern lowlands, *not* cultural disappearance. Maya civilization persisted and adapted significantly in the north and elsewhere.  
      *   **Rapa Nui:** The drastic population decline and societal disruption occurred *primarily after European contact* (disease, slave raiding, displacement), not due to pre-contact "ecocide" or internal collapse alone.  
  *   **False Equivalence:** As noted, these cases are distinct. Forcing them under a single, simplistic "collapse" banner distorts their unique histories and undermines scholarly credibility.  
  *   **Harmful Narrative:** Framing these societies as having "collapsed" implies definitive failure and erases the agency, adaptation, and survival of descendant communities. It feeds a dangerous "doom" narrative rather than fostering understanding of resilience and change.  

  ### 3. Rejecting the Proposed Compromises  
  *   **"Collapse?" with a Question Mark:** This is superficial. It still centers the misleading term and turns profound historical processes into a glib, binary visitor poll ("Did they collapse? Yes/No"). It trivializes the scholarship and the lived experiences these histories represent. An exit poll reduces complex narratives to a popularity contest.  
  *   **Keeping "Collapse" Solely for Marketing/Funding:** This creates a dangerous dissonance. Visitors experience the gallery *through* the title. If the title claims "Collapse" but the content argues against it, we breed confusion and undermine trust. It signals that fundraising and sensationalism outweigh historical integrity.  

  ### 4. Proposed Solution: Reframe the Narrative, Honor the Funding, Engage the Audience  
  We must **keep the concept but ditch the damaging label**. We can satisfy the foundation, engage visitors, and respect scholarship with a multi-pronged approach:  

  *   **Change the Public-Facing Title:**  
      **Option A (Direct & Evocative):** **"Endurance & Transformation: Societies in Crisis"**  
      **Option B (Question-Driven):** **"What Happens When Societies Face Crisis? Resilience in the Ancient World"**  
      *These titles capture the drama of change, center resilience/transformation, and accurately frame the diverse cases without imposing a single, flawed verdict.*

  *   **Honor the Foundation Agreement:**  
      *   **Formal Gallery Name in Internal/Foundation Docs:** Retain "The [Foundation Name] Gallery of Societal Change: Examining 'Collapse' Narratives" or similar. This fulfills the *letter* of the gift agreement referencing "collapse."  
      *   **Acknowledge Generously:** Prominently credit the foundation's vision for exploring "theories of societal transformation and resilience, often popularly termed 'collapse'."  

  *   **Structure the Gallery for Nuance & Impact:**  
      *   **Introductory Section:** Directly address the "collapse" myth. Explain why the term is problematic, setting the stage for a deeper exploration of transformation, adaptation, resilience, and external pressures. Frame the central question: *"How do societies endure, adapt, or transform under extreme stress?"*  
      *   **Case-Specific Narratives:** Allow each case study to tell its *own* story using accurate terminology.  
          *   Late Bronze Age: "System Disruption and Regeneration"  
          *   Classic Maya: "Political Fragmentation and Enduring Civilization"  
          *   Rapa Nui: "Resilience Tested: Contact, Crisis, and Survival"  
      *   **Unifying Themes Section:** Explicitly compare/contrast the drivers of change (climate, conflict, resource management, external contact) and the nature of societal responses (adaptation, decentralization, persistence, cultural continuity). Highlight lessons about vulnerability *and* resilience.  
      *   **Modern Relevance Section:** Deliver the "warning" powerfully by connecting ancient vulnerabilities to contemporary challenges (climate change, inequality, sustainability) without resorting to simplistic "collapse" parallels. Focus on agency: *"Understanding these past transformations helps us navigate our own challenges."*  

  *   **Replace the Exit Poll:** Implement an **"Enduring Lessons" interactive**. Ask visitors to reflect on concepts like adaptation, resilience, sustainability, or cultural continuity they witnessed, and how these might apply today. This reinforces the nuanced takeaway far more effectively than a reductive vote on "collapse."  

  ### 5. Our Core Argument: It's About Meaning and Responsibility  
  We are arguing **primarily about what the word "collapse" means** in both scholarly and public discourse, and **secondarily about the museum's responsibility** in using language that is both accurate and ethical. "Collapse" carries connotations of definitive failure and disappearance that are demonstrably inaccurate for these cases. Using it oversimplifies complex histories, risks harming descendant communities, and ultimately undermines the sophisticated, relevant story we *can* and *should* tell about societal vulnerability, adaptation, and resilience.  

  ### 6. Recommendation & Deadline  
  *   **VOTE TO ADOPT** a new public-facing title (**"Endurance & Transformation: Societies in Crisis"** recommended) and the reframed narrative strategy outlined above.  
  *   **VOTE TO REJECT** the "Collapse?" compromise and exit poll.  
  *   **Lock Final Label Copy By: December 15, 2023.** This allows 7 weeks for curatorial and education teams to collaboratively refine the narrative, write labels reflecting the new framework, and design the "Enduring Lessons" interactive, ensuring scholarly rigor and visitor engagement are met.  

  This approach respects the curators' evidence, delivers the education team's desired impactful message about societal fragility and resilience in a more accurate and ethical way, honors the foundation's intent (while adjusting the public branding), and provides a far richer, more responsible, and ultimately more compelling experience for our 50,000 annual visitors.  

  **Let's tell the true, complex, and enduring story.**
