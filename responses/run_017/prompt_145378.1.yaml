  Hmm, the user is asking me to adjudicate a philosophical debate between Marta and Ellis about Scanlon's contractualism. They've provided a detailed summary of eight moves in their argument, and want me to rate each move, determine who's more right overall, and identify what both parties are missing.

  Looking at the debate, it centers on contractualism's alleged inability to handle aggregation - specifically whether it can account for situations where many small burdens outweigh one large burden, or whether saving five lives is better than saving one. Marta defends contractualism's number-insensitivity as a feature, while Ellis sees it as a fatal flaw.

  For move 1, Marta makes a strong point about person-relative justification being core to contractualism. Her insight that intuitions about the nausea case might be contaminated by utilitarian thinking is particularly sharp. I'd rate this as clearly right.

  In move 2, Ellis correctly identifies that contractualism as stated struggles with counting affected persons. His challenge about needing a principled distinction between transplant and nausea cases is valid. This is also clearly right.

  Move 3 shows Marta attempting to reconcile contractualism with numbers through risk and intra-personal accumulation. The risk move is promising but underdeveloped here. This is partially right but needs refinement.

  Ellis's move 4 presents a clever dilemma with the generator crew case. His point about ex ante assessment smuggling in aggregation is compelling. I'd say mostly right, though he overstates how "plain" the duty to spread risk is.

  In move 5, Marta introduces the novel "singling-out" complaint which creatively avoids aggregation. Her ex ante defense is conceptually sound for contractualism. Mostly right, but some tension remains.

  Ellis's move 6 effectively challenges the singling-out complaint as covert aggregation. His after-the-draw objection is potent but may overreach. Partially right, though he underestimates contractualism's resources.

  For move 7, Marta's distinction between principles and treatment of victims is important. Her suggestion about mutual recognition versus decision procedure is insightful but risks making contractualism impractical. Partially right.

  In move 8, Ellis correctly points out Marta's inconsistency in applying different interpretations situationally. His procedural critique is strong. Mostly right.

  Overall, Marta edges ahead by creatively expanding contractualist tools while Ellis effectively exposes genuine problems. Both miss that contractualism might need supplemental principles for institutional cases, and overestimate how obvious the duty to spread risk is. The ex ante/ex post distinction is crucial but not as decisive as they assume - some burdens become qualitatively different when certain.
answer: |-
  ### Adjudication of Moves

  1.  **Marta (Move 1): Mostly Right**
      *   *Rating Justification:* Marta correctly identifies the core contractualist commitment to person-relative justification and non-aggregation. Her point that intuitions favoring aggregation in the nausea case might be question-begging is astute. However, dismissing the problem as "the point" understates the challenge Ellis raises about *counting* individuals, not summing burdens *within* them.

  2.  **Ellis (Move 2): Clearly Right**
      *   *Rating Justification:* Ellis successfully distinguishes between summing burdens *across* persons (which contractualism rejects) and counting *how many* persons bear a burden (which the standard rejectability test, focusing solely on individual complaint strength, cannot do). He correctly highlights the structural link between the nausea verdict and the inability to say saving five is better than one, posing a genuine challenge for Marta's desired transplant verdict.

  3.  **Marta (Move 3): Partially Right / Needs Refinement**
      *   *Rating Justification:* Marta identifies plausible internal resources (risk dilution and intra-personal accumulation). While these *might* address *some* cases, they are presented too optimistically. Risk doesn't directly solve the "certain burdens on distinct persons" problem Ellis is pressing (like the nausea case), and intra-personal accumulation is irrelevant to cases like saving five vs. one. The claim that numbers *shouldn't* count where burdens are certain and distinct is asserted, not argued for against Ellis's challenge.

  4.  **Ellis (Move 4): Mostly Right**
      *   *Rating Justification:* Ellis successfully forces a dilemma with the generator case. The *ex post* assessment indeed renders the policies indistinguishable, failing the duty to spread risk. The *ex ante* assessment does plausibly import the expected-value reasoning contractualism aimed to avoid. His critique that counting-through-risk is either idle or a surrender is potent. He slightly overstates the "plainness" of the duty to spread, but his core argument stands.

  5.  **Marta (Move 5): Partially Right / Defensible but Incomplete**
      *   *Rating Justification:* Marta's defense of the *ex ante* standpoint as contractualism's "natural home" is conceptually coherent and strong. The "singling-out" complaint is a clever, genuinely non-aggregative rationale for randomization, focusing on comparative treatment. However, Ellis's subsequent move (6) effectively challenges whether "singling out" is truly independent of numbers. The reply doesn't fully address the "after-the-draw" concern raised implicitly.

  6.  **Ellis (Move 6): Partially Right / Strong Challenge but Possible Reply**
      *   *Rating Justification:* Ellis effectively argues that the force of the "singling-out" complaint depends on how many *others* are spared, making it look like disguised aggregation from the victim's perspective. This is a significant challenge. The "after-the-draw" objection is powerful and directly targets a tension in the *ex ante* approach: if the principle isn't rejectable *ex ante*, how can the *ex post* victims reasonably complain about suffering the now-certain burden they "accepted" under the principle? However, Marta has resources for a reply (see Move 7).

  7.  **Marta (Move 7): Partially Right / Insightful but Raises New Problems**
      *   *Rating Justification:* Marta's distinction between the acceptability of the principle (*ex ante*) and the obligations to those harmed *ex post* (compensation, aid) is crucial and a standard contractualist move to address the "after-the-draw" problem. It preserves the principle's non-rejectability while acknowledging the plight of victims. Her suggestion about the "mutual recognition" vs. "decision procedure" reading is insightful and potentially deep. However, switching readings situationally (as Ellis accuses her of in Move 8) *is* problematic. If it's *only* a model of recognition, its ability to generate concrete verdicts like "don't kill one to save five" becomes much murkier.

  8.  **Ellis (Move 8): Mostly Right**
      *   *Rating Justification:* Ellis correctly identifies the tension in Marta's position. If contractualism is primarily a model of recognition, its ability to deliver clear verdicts in complex institutional cases like the generator crew (or the nausea case) is severely weakened. His charge that Marta opportunistically switches between the "decision procedure" reading (to get the transplant verdict) and the "recognition" reading (to deflect the generator/nausea problems) is a fair procedural critique. Granting that aggregation doesn't *refute* contractualism misses the point if it renders it inapplicable or counterintuitive in central cases.

  ### Overall Assessment

  *   **Who is more right overall?** **Marta edges ahead, but narrowly and incompletely.** She more consistently defends contractualism's core motivations and creatively explores internal resources (risk, intra-personal accumulation, singling-out, *ex ante* focus, principle/victim distinction). However, Ellis successfully exposes deep, unresolved problems regarding the *counting* of individuals bearing distinct burdens and the methodology (ex ante/ex post, recognition vs. decision procedure), demonstrating that contractualism struggles significantly with aggregation-sensitive intuitions without potentially compromising its foundations. Marta wins on defending the spirit, Ellis on exposing the persistent difficulties.

  *   **Key Point for Marta:** Her strongest point is the "singling-out" complaint as a non-aggregative rationale for spreading risk (Move 5), combined with the defense of the *ex ante* standpoint. Her insight about the "mutual recognition" model (Move 7) is profound, though it complicates practical application.
  *   **Key Point for Ellis:** His most powerful point is the *ex ante* dilemma (Move 4) and the "after-the-draw" objection (Move 6), showing the tension within the *ex ante* approach and challenging the non-aggregative purity of proposed solutions like "singling out." His procedural critique in Move 8 is also compelling.

  ### What Both Parties Are Missing

  1.  **The Supposed Clarity of the Duty to Spread Risk:** Ellis assumes the duty to randomize in the generator case is "plain." This is debatable. While common intuition favors spreading risk *ex ante*, it's not self-evident that Policy C (certainty for ten) is *wrong* if it avoids the anxiety and administrative burden of a lottery, *provided* the selection of the ten is fair (e.g., based on seniority, skill, volunteering) and robust compensation is guaranteed. Contractualism *might* accommodate this via the "singling-out" complaint only applying to *arbitrary* selection, not necessarily all non-random selection. Ellis overstates the case.

  2.  **The Cost of Incorporating Numbers for Certain Burdens:** Both assume incorporating numbers for distinct, certain burdens would require abandoning contractualism's core. This isn't necessarily true. Contractualism *could* potentially incorporate a limited, comparative principle governing the *number* of individuals burdened at a given complaint-strength level, *without* summing the burdens themselves or abandoning individual complaints as the grounds. For example, a principle might be rejectable if it imposes a burden of strength S on N people when an alternative imposes S on M people (M < N), *even if* S is below the threshold where intra-personal accumulation or risk applies. The cost isn't collapse into utilitarianism, but a significant modification to make the view less "numbers-blind" in the way Ellis critiques, perhaps at the expense of some of Marta's person-relative purity. Neither explores this middle ground.

  3.  **The Work of the Ex Ante / Ex Post Distinction:** Both overburden this distinction.
      *   **Marta** relies heavily on the *ex ante* perspective to avoid aggregation but struggles with the *ex post* implications (the "after-the-draw" problem). Her principle/victim distinction helps, but doesn't fully resolve the feeling that the *ex post* victim has a legitimate complaint about the *principle itself* now that its impact on them is certain.
      *   **Ellis** uses the *ex post* perspective to highlight indistinguishability but doesn't adequately engage with Marta's point that principles *are* assessed *ex ante*. His "after-the-draw" objection assumes the *ex post* victim's perspective is the only relevant one for assessing the principle's rejectability, which contractualism explicitly denies. The distinction is crucial but doesn't magically solve the problems; it mainly shifts where the tension arises (e.g., between *ex ante* acceptability and *ex post* experience). Neither fully acknowledges that "reasonable rejectability" might involve a complex interplay of perspectives, not a simple choice between pure *ex ante* or pure *ex post*.
