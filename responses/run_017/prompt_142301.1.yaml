  I recall Wittgenstein's examples like "the world exists" or "I have hands." These are necessary for inquiry. But a cult's hinge serves a different purpose—suppressing doubt. The function isn't just enabling inquiry but controlling it. That distinction might block step (3). If hinges must enable general inquiry, then pathological "hinges" don't qualify. 

