  Hmm, the user mentions two interpretations of hinges: one as non-truth-apt rules and another as propositions held without evidence. I should consider how each handles the relativism charge. For the non-propositional view (like rules), if hinges aren't truth-claims, then you can't call them true or false across frameworks. But the functional role might still vary—healthy vs. pathological hinges. The propositional view might need to appeal to something external, like basic human needs or shared biology, to avoid relativism.

