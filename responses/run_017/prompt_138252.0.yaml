  ### **What This Procedure Cannot Do**  
  1. **Handle reflexivity:** If a low probability estimate could itself cause failure (e.g., via market panic), the procedure cannot adjust. Output must be used confidentially.  
  2. **Override the Successor-Continuity Convention:** Persistence is defined by territory/control, not legal continuity or debtor intent.  
  3. **Eliminate uncertainty:** With 200 cases, estimates are coarse (e.g., 40% ±10% is typical).  
  4. **Incorporate novel risks:** Unprecedented factors (e.g., total climate inundation) are handled via capped adjustment, not fundamental re-anchoring.  
  5. **Replace judgment:** Team Lead must resolve conventions, marginal class choices, and large adjustments.  

  ---  
  This procedure ensures consistency, leverages your archive, and forces explicit trade-offs. It accepts that some outputs (e.g., 24% for the island state) will be unpopular but defensible under the Convention and outside-view logic.
