  ### **Live Case Applications**  
  We run the procedure on three cases, with audit trails. For brevity, we simulate data from your archive (e.g., base rates).  

  #### **Case 1: Federal Union (Peaceful Secession Risk)**  
  - **Context:** Union likely to split; successors would honor debt, but original entity dissolves.  
  - **Audit Trail:**  
    | Field | Value |  
    |-------|-------|  
    | **Polity:** | Federal Union of X |  
    | **T0:** | 2023 |  
    | **Reference Class:** | Federal systems (N=25) |  
    | **Base Rate:** | 60% |  
    | **Deflator:** | 0.85 |  
    | **Adjusted Base Rate:** | 51% |  
    | **Case Factor:** | High peaceful secession risk |  
    | **Factor Adjustment:** | –10% (analogies: Czechoslovakia Δ–15%, USSR Δ–25%) ★ Approved by Team Lead |  
    | **Final Probability:** | 41% |  
    | **NDN Flag:** | No |  
    - **Why uncongenial?** Desk expects high probability (successors honor debt), but procedure outputs 41% because the original entity dissolves and no successor meets the Convention (e.g., a rump state controls <50% territory). **Accept because:** The Convention defines the outcome, not intent. Adjusting for "successor willingness" would revert to inside-view narrative.  

