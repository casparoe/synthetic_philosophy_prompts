  Below is a complete, executable procedure for estimating 30-year political continuity probabilities, designed to address your requirements and constraints. It prioritizes the outside view, enforces transparency, and includes safeguards against common pitfalls (e.g., reference class arbitrariness, over-adjustment). The procedure is formatted as a step-by-step checklist with embedded rules, defaults, and decision points. Analysts complete it using your existing archive and Successor-Continuity Convention, with no new data required. 

  ---

  ### **Procedure for Estimating 30-Year Political Continuity Probability**  
  **Output:** Probability (0–1) of the polity or a qualifying successor existing at T0+30, per the Successor-Continuity Convention.  
  **Time Limit:** 2 hours per case.  
  **Audit Trail:** One-page summary (template at end) plus appendix for rejected classes/justifications.  
  **Team Roles:**  
  - **Analyst:** Executes steps.  
  - **Team Lead (Named Person: e.g., "Scenario Team Lead"):** Approves judgment calls (marked ★).  

  ---

  #### **Step 0: Define Outcome and Resolve Historical Disagreements**  
  **Objective:** Fix the outcome variable before reference class selection.  
  1. **Define the current polity:** Record polity name, T0 (current year), and territory at T0.  
  2. **Outcome variable:** At T0+30, the event is defined as:  
     - A polity exercises effective control over ≥50% of T0 territory,  
     - Is recognized by ≥33% of original T0 recognizers,  
     - Operates ≥1 institution founded before T0.  
     - ★ **Convention fiat:** The Successor-Continuity Convention settles that "effective control" and "institution" are defined by administrative reality (not legal theory), and "recognition" is based on UN member states at T0. Dispersal of population or legal persona changes are irrelevant.  
  3. **Resolve historical end-year disagreements in the archive:**  
     - For each historical polity, use the **median end-year** from the two coders. If discrepancy >20 years, exclude the polity from the archive (irresolvable dispute).  
     - **Default:** If exclusion reduces archive size <150 cases, use the earlier end-year (conservative bias).  

  ---

  #### **Step 1: Account for Duration Already Survived (D)**  
  **Objective:** Decide whether to condition on current polity’s age.  
  1. Calculate D = T0 - polity start year.  
  2. **Rule for conditioning:**  
     - If D ≤ 30 years, **do not condition** (treat as "new" polity).  
     - If D > 30 years, **condition on survival to D** (i.e., estimate *remaining* 30-year survival).  
       - Use the archive to test the memoryless property:  
         - Fit an exponential distribution to historical durations.  
         - Test if the hazard rate is constant (p>0.05 via KS test) → memoryless.  
       - **From your archive:** If ≥30 cases have D>30 years, run the test.  
         - If memoryless (hazard rate constant), no adjustment for D.  
         - If not memoryless (e.g., hazard rate decreases with age), use a reference class of polities that survived ≥D years (see Step 2).  
     - **Default:** If test is inconclusive (e.g., <30 cases), **do not condition**. D does not alter the estimate.  

  ---

  #### **Step 2: Nominate and Select Reference Classes**  
  **Objective:** Anchor on a base rate from comparable cases.  
  1. **Nominate 3–5 candidate classes** based on pre-T0 characteristics:  
     - Characteristics must be:  
       - **Causal:** Mechanistically linked to state survival (e.g., geography, institutional features).  
       - **Available pre-T0:** Knowable at polity start year (e.g., not "GDP growth after T0").  
       - **Objective:** Binary or categorical (e.g., "island," "federal," "post-colonial").  
     - **Excluded characteristics:** Arbitrary/non-causal (e.g., "same continent," "cultural similarity").  
     - **Minimum class size:** 10 polities.  
     - **Example classes:**  
       - Class 1: All polities (N=200).  
       - Class 2: Federal systems (N=25).  
       - Class 3: Island states (N=15).  
       - Class 4: Post-1945 sovereign states (N=80).  
  2. **Adjudicate conflicting classes:**  
     - **Rule 1:** Prioritize the class with the strongest causal relevance and ≥10 cases.  
     - **Rule 2:** If multiple defensible classes exist:  
       - Calculate the weighted average base rate (weighted by class size).  
     - **Rule 3:** If the only class with ≥10 cases is causally weak (e.g., "all polities"):  
       - Use it, but **cap adjustment** at ±5% in Step 4 (prevents overfitting).  
     - **Record rejected classes:** In appendix, list each class, size, base rate, and reason for rejection.  
  3. **Calculate base rate:**  
     - For unconditioned cases: % of class surviving ≥30 years from start.  
     - For conditioned cases (D>30): % surviving ≥30 *additional* years after reaching age D.  

  ---

  #### **Step 3: Correct for Archive Selection Bias**  
  **Objective:** Acknowledge and mitigate survivorship bias.  
  1. **Bias statement:** "The archive overrepresents durable polities (only entities with administrative records are included), likely inflating base rates."  
  2. **Adjustment:** Apply a fixed deflator multiplier of 0.85 to the base rate.  
     - **Justification:** Your archive's median duration (e.g., 120 years) exceeds real-world averages (e.g., 70–90 years for modern states). A 15% downward adjustment approximates the bias.  
     - **Default:** If deflator causes base rate <0.05, set to 0.05 (avoids absurdity).  

  ---

  #### **Step 4: Adjust for Case-Specific Factors**  
  **Objective:** Modify the base rate minimally and defensibly.  
  1. **Identify one causal factor** not captured in the reference class:  
     - Must be specific, directional (e.g., "high secession risk: ↓ probability"), and supported by evidence.  
  2. **Adjustment cap:**  
     - Final probability must stay within ±10 percentage points (pp) of the (deflated) base rate.  
     - ★ **Team Lead approval required** for adjustments beyond ±5 pp.  
  3. **Justify adjustment magnitude:** Use historical analogies from the archive:  
     - Find 1–2 polities with a similar factor and compute the delta from their class base rate.  
     - **Example:** If a historical polity with "peaceful secession" had 20% lower survival than its class, apply Δ = –20%.  
     - **Default:** If no analogy exists, max adjustment = ±5 pp.  

  ---

  #### **Step 5: Stopping Rules and Output Representation**  
  **Objective:** Handle unquantifiable cases.  
  1. **Stop and output "No Defensible Number" (NDN) if:**  
     - No reference class has ≥10 cases.  
     - Critical data is missing (e.g., T0 territory undefined).  
     - Factor adjustment would exceed ±10 pp (e.g., unprecedented risks like climate inundation).  
  2. **Representing NDN in pricing model:**  
     - Use a default of **0.5** and flag as "NDN" in the audit trail.  
     - **Justification:** 0.5 is the maximum-entropy estimate (ignorance prior). Board must review all NDN cases.  

  ---

