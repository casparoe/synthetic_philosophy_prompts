prompt: |-
  so I'm a novelist and I've written myself into a corner on a near-future book, and I need the spec before I need the verdict. The plot, such as it is: a small hardware lab announces a "halfstep engine" — a box that performs its first operation in one second, its second in half a second, its third in a quarter, and so on, so that two seconds after you switch it on it has finished infinitely many steps and printed an answer to whether an arbitrary program halts. Running alongside it is a black box out of a defense contract that answers halting questions correctly for every program whose description comes in under a million bits and then just returns "unknown" for anything longer. And a mathematician character invents a third thing on a napkin: a model of computation that looks obviously mechanical to everyone in the room but provably outruns Turing machines if some unproved conjecture in number theory turns out true. My characters spend half the book fighting about whether any of this is a counterexample to the Church-Turing thesis, and every time I draft the fight it collapses into one person saying "it's a thesis about effective calculability, not a theorem" and another saying "only the physical version is worth caring about" and me having no idea what the actual standard of adequacy is.

  So: what does an account of the epistemic status of the Church-Turing thesis have to deliver to count as adequate? I want the requirements list, not a tour of the positions — the things it must explain, the cases it must get right, the distinctions it can't collapse, with the consideration behind each. Obvious candidates I can already hear people demanding: why so many independent-looking formalizations from the 1930s landed on exactly the same class of functions and whether that convergence is real evidence or just sociology; whether the claim about our informal notion of a procedure following rules can be kept apart from the claim about what's physically buildable and from the sharp statement you can actually prove; whether "mechanical" or "effective" can be sharpened at all without presupposing the thesis; who bears the burden of proof and what has to count as a refutation, especially for a device that's only good up to a bound or only good if some conjecture holds; and whether the thesis could be true of our world by accident, and if so what our warrant for it is and how revisable it's supposed to be. Mark which of these are non-negotiable and which are just what one camp wants, and use my three devices as the running test cases where they help — I specifically want to know whether the halfstep engine and the million-bit box are threats of the same kind, and what an account has to say about the napkin model, where expert intuition says "clearly mechanical" but the math is hostage to an open problem.

  Give it to me as exactly six numbered items: items one through five are the desiderata, each with its motivating case, and item six says which pair of them you think can't be jointly satisfied and which single requirement does the most work in ruling out otherwise popular accounts (the ones that rest everything on convergence, the ones that treat the thesis as analytic, the ones that treat it as an empirical law of nature). Each item a sentence or two, no introduction, no wrap-up at the end. And please resist giving me a scorecard of named positions — I can fake that part myself, it's the criteria I can't fake.
reasoning: |-
  Okay, the user is a novelist who has written themselves into a corner with a near-future book involving three computational devices challenging the Church-Turing thesis. They need a clear set of criteria to evaluate the epistemic status of the thesis, presented as six specific items. 

  First, I need to understand the core struggle: their characters are debating whether these devices refute the thesis, but the arguments keep collapsing into superficial positions. The user explicitly wants the requirements list—not a tour of existing philosophical positions—with each item tied to one of their three devices. 

  The user's three devices are cleverly designed to probe different aspects of the thesis:
  - The **halfstep engine** (infinite steps in finite time) tests physical realizability vs. abstract computation.
  - The **million-bit box** (bounded halting oracle) challenges whether bounded capabilities count as refutations.
  - The **napkin model** (conjecture-dependent hypercomputation) forces a confrontation with the gap between "intuitively mechanical" and mathematically proven capabilities.

  The user mentions several angles they're already aware of (convergence in 1930s formalisms, burden of proof, revisability), so I must distill these into non-negotiable desiderata while avoiding named theories. They also want to know if the halfstep engine and million-bit box are "threats of the same kind"—a hint that physical realizability might be key. 

  For the six items, I consider structuring them as:
  1. **Distinguish abstract vs. physical claims**: Crucial because the halfstep engine seems to violate physical laws (energy/information density), while the napkin model is purely mathematical. The million-bit box sits awkwardly in between—its boundedness makes it physically plausible but computationally trivial. *Motivating case: Halfstep engine.*
  2. **Handle intuitive "mechanical-ness"**: The napkin model looks "obviously mechanical" to experts but isn't provably hypercomputational yet. This tests whether pre-theoretic intuition can be trusted when formal proofs are missing. *Motivating case: Napkin model.*
  3. **Account for bounded systems**: The million-bit box must be addressed without letting it "refute" the thesis trivially. Desideratum: the thesis should ignore resource limitations. *Motivating case: Million-bit box.*
  4. **Clarify burden of proof**: For the napkin model, is it a refutation only *if* the conjecture holds? The thesis must require a *demonstrated* counterexample, not a conditional one. *Motivating case: Napkin model.*
  5. **Explain formal convergence**: Why did 1930s models (Turing machines, lambda calculus) all converge to the same class? The account must show this isn't accidental. *Motivating case: All devices, as they challenge convergence.*
  6. **Identify irreconcilable desiderata**: Here I argue that reconciling intuitive "mechanical-ness" (Item 2) with formal convergence (Item 5) is impossible without circularity. Physical-law accounts (prioritizing Item 1) fail Item 2, while intuition-based accounts fail Item 5. *Most work: Item 1 (abstract/physical split) rules out popular empiricist accounts.* 

  The halfstep engine and million-bit box are *not* threats of the same kind: the former is physically dubious, while the latter is computationally irrelevant due to boundedness. The napkin model is the sharpest test—it pressures how we define "mechanical" absent physical constraints or unconditional proofs.
answer: |-
  1. **Distinguish abstract computability from physical realizability.** The account must explain why devices like the halfstep engine (relying on infinite subdivisions of time/energy) don't refute the abstract thesis, as they violate known physical laws (e.g., Planck scale, energy requirements), separating the mathematical notion of "effective calculability" from feasibility. *Motivating case: Halfstep engine's physical implausibility versus its formal operation.*  
  2. **Accommodate pre-theoretic intuition while resisting circularity.** It must explain why the napkin model's "obviously mechanical" appearance isn't sufficient evidence for hypercomputation, avoiding defining "mechanical" by fiat (e.g., "whatever agrees with Turing machines"). The account should clarify that intuitive judgments require formal validation. *Motivating case: Napkin model's dependence on an unproven conjecture prevents it from bearing evidential weight pre-proof.*  
  3. **Dismiss bounded systems as non-refutations.** The account must show why devices like the million-bit box (which answers only finitely many instances) fail to challenge the thesis, which concerns unbounded computation. Bounded oracles don't extend beyond Turing machines for *arbitrary* inputs. *Motivating case: Million-bit box's finite scope, contrasting with the thesis's universal claim.*  
  4. **Assign burden of proof to the hypercomputation claimant.** It must require a *demonstrated*, unconditional counterexample—not a conditional or physically unrealizable one. The account should clarify that conjectural or bounded devices (like the napkin model or million-bit box) don't shift the burden onto defenders of the thesis. *Motivating case: Napkin model's "refutation" is contingent on an open problem; halfstep engine requires unphysical assumptions.*  
  5. **Explain the convergence of 1930s formalisms without sociological appeal.** The account must justify why diverse models (λ-calculus, Turing machines) captured the *same* class of functions as evidence for a robust, objective notion of computation—not historical accident. *Motivating case: All three devices challenge this convergence; the account must show why they fail to undermine it.*  
  6. **The tension: Pre-theoretic intuition (Item 2) and formal convergence (Item 5) cannot be jointly satisfied without circularity.** Accounts privileging intuition (e.g., "mechanical means intuitive") fail Item 5 by ignoring convergence; formal accounts struggle with Item 2's demand for intuitive grounding. Item 1 (abstract/physical distinction) does the most work in ruling out empiricist accounts (e.g., "thesis is a law of nature"), as they conflate physical possibility with computability, wrongly disqualifying halfstep or napkin models *a priori*.
