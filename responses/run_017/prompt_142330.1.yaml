  ### Decision Procedure for Identity Proposals in the Registry

  #### Core Principles from Kripkean Framework
  1. **Rigid vs. Non-Rigid Designators**:  
     - **Rigid**: Refers to the same object in all possible worlds (e.g., "Cicero" via baptism).  
     - **Non-Rigid**: Refers to different objects in different worlds (e.g., "the head of the archive in 1793").  
  2. **Reference-Fixing**:  
     - Descriptions used to fix reference (e.g., "the Roman author of *De Fato*") create rigid designators.  
     - Non-rigid descriptions (e.g., "the winner of the 1801 election") do not.  
  3. **Contingency vs. Epistemology**:  
     - Contingency: About how the world could have been.  
     - Epistemology: About how we know what the world is.  
     Avoid conflating empirical discovery (e.g., "we found Tully is Cicero") with metaphysical contingency.  
  4. **Placeholders**: Non-rigid until resolved.  
  5. **Actualized Descriptions**: "Actual-X" (e.g., "the actual head of the archive in 1793") is rigid.  

  #### Decision Procedure  
  **Inputs per Record**:  
  - **Intake Tag**: Ostensive baptism, definite description (reference-fixing), inheritance, placeholder.  
  - **Core Fields**: Predefined immutable attributes (e.g., birth/death dates, unique IDs, role-tenure periods).  
  - **Conflict Threshold**: Mismatch in core fields → reject identity.  

  **Procedure**:  
  1. **Step 0: Check Emptiness**  
     - If either record is confirmed empty (e.g., "Vulcan" planet), flag for **senior review**.  
     - *Rationale*: Empty names cannot denote objects.  

  2. **Step 1: Assess Rigidity**  
     - **Ostensive baptism** → rigid.  
     - **Definite description** (reference-fixing) → rigid.  
     - **Inheritance** → rigid (assume source was rigid).  
     - **Placeholder** → non-rigid.  
     - *Output*: Tag records as rigid (R) or non-rigid (NR).  

  3. **Step 2: Check Core Field Consistency**  
     - If core fields conflict (e.g., birth dates differ), output **no link** (stop).  
     - If core fields match *or* are missing:  
       - **Direct evidence** (e.g., "also known as" in sources): → proceed.  
       - **No direct evidence**: If ≥1 core field matches → proceed. Else, flag for **senior review**.  

  4. **Step 3: Determine Link Type**  
     - **Both rigid (R + R) + core match** → **identity-of-object**.  
     - **At least one non-rigid (NR) + core match** → **as-described-here**.  
     - **Unresolved placeholder + candidate match** → **as-described-here** (contingent on current evidence).  

  5. **Step 4: Editorial Policy Flags**  
     Flag for **senior review** if:  
     - Ambiguous reference-fixing (e.g., "the head of the archive" without "actual-" prefix).  
     - Placeholder with multiple viable candidates.  
     - Disputed evidence (e.g., sources disagree on core attributes).  

  ---

  ### Application to Test Cases  

  #### Case 1: Cicero/Tully (Archival Match)  
  - **Record A**: "Cicero" (intake: definite description).  
  - **Record B**: "Tully" (intake: definite description).  
  - **Rigidity**: Both rigid (reference-fixing descriptions).  
  - **Core Fields**: Match (birth, death, works).  
  - **Procedure Output**: **Identity-of-object**.  
  - *Why?* Both rigid; identity necessary.  

  #### Case 2: Placeholder Author + Candidate  
  - **Record A**: "Author of *X*" (intake: placeholder).  
  - **Record B**: "Jane Doe" (intake: ostensive baptism).  
  - **Rigidity**: A (non-rigid), B (rigid).  
  - **Core Fields**:  
    - A: No birth/death (placeholder).  
    - B: Birth/death known.  
    - Match: Role tenure overlaps *X*'s publication; no conflict.  
  - **Procedure Output**: **As-described-here**.  
  - *Why?* Placeholder non-rigid; link is contingent.  

  #### Case 3: Number vs. Actual-Number  
  - **Record A**: "Number of notebooks bequeathed" (intake: definite description).  
  - **Record B**: "5" (intake: definite description).  
  - **Rigidity**: Both rigid (reference-fixing).  
  - **Core Fields**: Value = 5 in both.  
  - **Procedure Output**: **Identity-of-object**.  
  - **Why You’ll Dislike This**:  
    - You may think "the number of notebooks" is contingent (founder could have bequeathed 6).  
    - **But**: Reference-fixing makes it rigid. "The number" refers to the actual number (5) in all worlds.  
    - *Kripkean Insight*: Rigid designation trumps epistemic contingency.  

  ---

  ### Limitations and Failure Modes  
  1. **Where Judgment is Unavoidable**:  
     - **Ambiguous Descriptions**: E.g., "the head of the archive" (non-rigid) vs. "the actual head" (rigid). Requires human interpretation.  
     - **Inheritance Chains**: If inherited from a placeholder, rigidity is unclear. Policy decision needed.  
     - **Conflicting Evidence**: Weighting sources (e.g., birth date conflicts) requires archival expertise.  

  2. **Expected Misfires**:  
     - **Over-Flagging**: Placeholders with weak core data (e.g., missing birth dates) often sent to review.  
     - **"Actual-" Misuse**: Users may omit "actual-" prefix, misclassifying rigid descriptions as non-rigid.  
     - **Factually Rigid Descriptions**: E.g., "the square of 3" (always 9) may be tagged non-rigid if intake is unclear.  

  **Final Advice**:  
  - Use **identity-of-object** only for rigid designators with ironclad matches.  
  - Default to **as-described-here** for placeholders or contested cases.  
  - **Senior review** is essential for emptynames, policy ambiguities, and inherited placeholders.  

  This procedure operationalizes Kripke while respecting your constraints. It prioritizes safety (avoiding misattribution) and auditability, with clear off-ramps to human judgment.
