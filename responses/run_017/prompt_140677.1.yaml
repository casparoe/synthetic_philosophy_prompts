  ## Office of Institutional Pluralism  
  Internal Guidance Document: OIP-GD-2023.07  
  Implementation Protocols for Non-Absolutism in Official Communications Policy (NOC-3)  

  **1. Purpose & Scope**  
  This document provides operational guidance for compliance with Faculty Senate Policy NOC-3 ("Non-Absolutism in Official Communications"). NOC-3 mandates that all assertions made in official departmental communications must be qualified to reflect their context-dependence, thereby avoiding *ekānta* (one-sided, absolute assertion). Covered communications include: Letters of Recommendation, Search Committee Reports, Program Review Self-Studies, Annual Climate Survey Summaries, and all correspondence with External Auditors. Non-compliance constitutes a violation of institutional pluralism standards.  

  **2. Core Principles of Qualified Assertion**  
  *   **2.1 Syāt (Conditioned Predication):** All assertions *must* be prefaced or qualified by contextual markers (e.g., "in some respects," "from the standpoint of," "under specific conditions," "arguably"). The term *syāt* signifies assertion *within a specific frame of reference*, not mere possibility.  
  *   **2.2 Nayavāda (Standpoint Relativity):** A statement made from one valid perspective (*naya*) is not false; the error (*ekānta*) lies in presenting it as the *only* or *exhaustive* perspective. Official communications must explicitly acknowledge relevant, plausible alternative standpoints.  
  *   **2.3 Saptabhaṅgī (The Sevenfold Schema):** Where appropriate and practicable, communications should reflect the full spectrum of conditioned predication regarding an entity or proposition:  
      1.  In some respect, it *is*.  
      2.  In some respect, it *is not*.  
      3.  In some respect, it *is and is not* (sequentially).  
      4.  In some respect, it *is inexpressible*.  
      5.  In some respect, it *is and is inexpressible*.  
      6.  In some respect, it *is not and is inexpressible*.  
      7.  In some respect, it *is, is not, and is inexpressible*.  
  *   **2.4 Avoidance of Ekānta:** The primary risk is presenting any single perspective as exhaustive or absolute truth. Assertions lacking explicit standpoint indexing or failing to acknowledge plausible alternatives are non-compliant.  
  *   **2.5 Linguistic Limitation:** Recognize that language inherently operates from specific standpoints; the totality (*anekānta*) is unsayable. Compliance focuses on avoiding absolutism *within language*, not achieving impossible totality.  

  **3. Worked Examples**  
  *   **3.1 Letter of Recommendation (Saptabhaṅgī-Compliant):**  
      > "Subject: Qualified Assessment of Candidate A for Position X  
      > From the standpoint of their contributions to collaborative projects (naya: *sangrahanaya*, collective perspective), it can be asserted that, in some respect (*syāt*), Candidate A *is* a productive scholar (Mode 1). However, from the standpoint of independent initiative and leadership metrics (*naya: rjusūtranaya*, linear/pragmatic perspective), it can be asserted that, in some respect, Candidate A *is not* the most self-directed researcher (Mode 2). Considering the sequential nature of their work phases, in some respect, they *are and are not* consistently proactive (Mode 3). The essential quality of 'fit' for Position X is, in some respect, *inexpressible* as a singular attribute (Mode 4). From the standpoint of collegiality metrics, Candidate A *is* collegial and this collegiality *is*, in some respect, *inexpressible* in purely quantitative terms (Mode 5). From the standpoint of grant acquisition benchmarks, they *are not* leading the field, and this assessment *is*, in some respect, *inexpressible* due to varying disciplinary norms (Mode 6). Ultimately, Candidate A's candidacy *is* viable from certain standpoints, *is not* optimal from others, and *is*, in some respect, *inexpressible* as a unified entity beyond these contextual frames (Mode 7). This assessment reflects plausible perspectives and avoids *ekānta*."  

  *   **3.2 Search Committee Report & Ranking:**  
      > "The Search Committee operated within the constraints of NOC-3, recognizing the inherent limitations of any singular ranking. From the standpoint of publication record and impact metrics (*naya: naigamanaya*, common/pragmatic view), Candidate B *is* ranked highest (Mode 1). From the standpoint of pedagogical innovation and student evaluations (*naya: śabdanaya*, verbal/functional view), Candidate C *is* ranked highest (Mode 1). From the standpoint of departmental cohesion and future research synergies (*naya: evambhūtanaya*, modal view), Candidate A *is* ranked highest (Mode 1).  
      > Attempting an absolute ranking presents *ekānta*. Therefore, the Committee provides this standpoint-indexed assessment:  
      > *   *Syāt*: Candidate B is ranked 1st (Publication Standpoint).  
      > *   *Syāt*: Candidate C is ranked 1st (Teaching Standpoint).  
      > *   *Syāt*: Candidate A is ranked 1st (Synergy Standpoint).  
      > A singular, non-contextual ranking is, in some respect, *inexpressible* without violating NOC-3 (Mode 4). The Committee recommends the shortlist reflect this multiplicity: Candidates A, B, C (presented alphabetically to avoid implying standpoint hierarchy)."  

  *   **3.3 Response to External Auditor (Yes/No Question):**  
      > "Re: Auditor Query FY2024-07: 'Is the departmental budget balanced for FY2024?'  
      > Pursuant to NOC-3, OIP guidance stipulates that assertions, even to yes/no inquiries, require standpoint qualification to avoid *ekānta*.  
      > *   *Syāt*: From the standpoint of projected revenues and expenditures as of June 30, 2024, excluding contingent liabilities and potential endowment fluctuations, the budget *is* balanced (Mode 1).  
      > *   *Syāt*: From the standpoint of historical underspend variances in personnel costs and potential inflationary pressures on equipment, the budget *is not* definitively balanced (Mode 2).  
      > *   *Syāt*: Considering the inherent uncertainty of future state funding levels, the question of final balance *is* currently *inexpressible* with absolute certainty (Mode 4).  
      > Therefore, a non-contextual 'yes' or 'no' assertion constitutes *ekānta*. The department affirms the validity of the above standpoints regarding the FY2024 budget status."  

  **4. Liability Mitigation & Stakeholder Engagement**  
  The implementation of NOC-3 significantly enhances institutional risk management. Qualifying assertions based on standpoints clarifies the contextual basis of statements and mitigates liability by avoiding absolute claims that could be contested from alternative perspectives. When presenting potentially contentious information (e.g., climate survey results), rigorously identify the standpoints represented (e.g., "respondents holding junior faculty positions reported X, while those holding senior administrative roles reported Y"). Do *not* synthesize into an overall "truth"; present the multiplicity of perspectives as compliant non-absolutism.  

  **5. Certification & Recursion Protocol**  
  *   **5.1 Compliance Statement:** All covered communications must include the following footer: "This document has been prepared in compliance with Faculty Senate Policy NOC-3 (Non-Absolutism in Official Communications). Assertions herein are standpoint-indexed (*syāt*) and avoid *ekānta*; they are not absolute claims."  
  *   **5.2 Recursion Protocol:** Questions regarding the absolute validity or applicability of NOC-3 or this guidance must themselves be addressed through the framework of NOC-3. The assertion that non-absolutism is mandated (*syāt*, from the standpoint of current Faculty Senate policy and institutional pluralism norms) coexists with the recognition (*syāt*, from the standpoint of historical policy variance or critiques of procedural rigidity) that this mandate is itself context-dependent. The policy's applicability within its own domain is, in some respect, *inexpressible* without recursive self-application (see Mode 7). Therefore, the Office of Institutional Pluralism asserts, from the standpoint of its current operational mandate and within the framework established by the Faculty Senate, that adherence to this guidance constitutes compliant implementation of NOC-3.  

  **6. Attestation**  
  This guidance document has been formulated in accordance with the principles it describes. Its assertions are standpoint-indexed and avoid *ekānta*. From the standpoint of OIP's mandate to operationalize NOC-3, this document *is* the current approved guidance. From the standpoint of potential future revisions or interpretive challenges, it *is not* the final or absolute word. Its comprehensive truth-value is, in some respect, *inexpressible*.

  ---
  **Certification Block (Draft - Pending Final NOC-3 Compliance Review):**  
  *The undersigned, acting from the standpoint of Director of the Office of Institutional Pluralism, and within the authority granted by Faculty Senate Policy NOC-3, provisionally attests that this guidance document, reviewed in accordance with recursive Protocol 5.2 and acknowledging its own contextual limitations as outlined in Sections 2.5 and 5.2, constitutes a valid implementation framework for the policy, subject to the inherent constraints on linguistic absolutism described herein. However, from the standpoint of establishing an absolute baseline for institutional policy adherence, such certification is ultimately...*  
  *(Signature Block Drafting In Process - Awaiting Standpoint Reconciliation)*
