  ### **Consciousness in Unusual Substrates: A Decision Tree**
  *Root Assumptions (agreed by all):*  
  - A normally embodied, awake person is conscious.  
  - A brain kept alive and stimulated in a vat is conscious.  

  #### **Q1: Frozen Brain**  
  A cryogenically frozen brain is physically identical to a conscious brain but has *zero* neural activity (no dynamics). Is it conscious?  
  - **Yes** → Go to Q2.  
  - **No** → Go to Q3.  

  #### **Q2: Static Book (Sealed Vault)**  
  A book encodes Einstein’s brain state transitions (each page says, "Given input X, go to page Y"). It sits unopened in a vault. Is it conscious?  
  - **Yes** → **Position: ETERNALISM (e.g., Platonism)**  
    - *Awkward Commitment:* A rock with identical atomic structure to a brain (if possible) is conscious. The cipher book (Q4) must also be conscious since the structure exists.  
  - **No** → *Incoherent Branch:* If the frozen brain (same structure, no dynamics) is conscious, why not the book? (This branch is likely empty; see note below).  

  ---

  #### **Q3: Book + Dumb Machine**  
  The same book is read by a machine that *only* follows page-turn instructions (no understanding). Is the **system** (book + machine) conscious?  
  - **Yes** → Go to Q5.  
  - **No** → Go to Q6.  

  #### **Q5: Paper Brain**  
  Einstein’s neurons are replaced one-by-one with paper slips that perfectly mimic each neuron’s input-output behavior. The final paper brain is active and functional. Is it conscious?  
  - **Yes** → **Position: FUNCTIONALISM (e.g., computational theory)**  
    - *Awkward Commitment:* The book + machine is conscious, but it "feels like" a simulation, not "real" understanding.  
  - **No** → **Position: INCONSISTENT!**  
    - *Why:* The paper brain is functionally identical to the book + machine system. Rejecting one but not the other violates functional equivalence.  

  ---

  #### **Q6: Paper Brain (again)**  
  Same as Q5: the active paper brain. Is it conscious?  
  - **Yes** → Go to Q7.  
  - **No** → Go to Q8.  

  #### **Q7: Causal Dynamics vs. Simulation**  
  What distinguishes the paper brain (conscious) from the book + machine (not conscious)?  
  - If the paper brain has **real-time causal interactions** while the book + machine is a "simulation" → **Position: CAUSAL REALISM (e.g., dynamic systems theory)**  
    - *Awkward Commitment:* A perfect computer simulation of a brain (running in real-time) is *not* conscious—only "biological-like" causal flow counts.  
  - If no clear distinction → **Position: INCONSISTENT!** (No principled difference between the cases).  

  #### **Q8: Derivative Consciousness**  
  Is the book + machine system conscious *only* in a derivative sense (i.e., relative to an observer who interprets it)?  
  - **Yes** → **Position: OBSERVER-RELATIVISM**  
    - *Awkward Commitment:* If all observers vanish, a normally conscious brain ceases to be conscious.  
  - **No** → **Position: BIOLOGICAL CHAUVINISM**  
    - *Awkward Commitment:* A silicon-based alien with identical brain functionality is not conscious.  

