  Scaffold's own wording (which Closure accepts as fair): "Every amendment, especially of the amendment rule, relies on an external practice or understanding that is not fully captured by the written rules. This external element is what makes the rules binding and allows for the transition between rule sets. Without it, the system would not function, and the change would not be a mere amendment but a more fundamental shift."

