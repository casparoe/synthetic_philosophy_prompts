  1. A numbered list of agreed claims with teeth (substantive, not trivial).
  2. The disagreement stated in each side's own wording, accepted by the other as fair.
  3. Cruxes (sub-questions that would move the needle) with concrete cases, each side's prediction.
  4. If part of the argument is merely verbal, identify it.

