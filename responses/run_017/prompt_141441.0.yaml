  ### Joint Statement of Adversarial Collaboration: Closure vs. Scaffold Positions on Self-Amendment in Rule Systems

  **Introduction**  
  This document represents an adversarial collaboration between two philosophical perspectives on rule systems that can amend their own rules, particularly the rule governing amendments (the "amendment rule"). The **Closure position** holds that a rule system is self-contained: a valid amendment can change the amendment rule itself without relying on anything external, and the system remains the same afterward. The **Scaffold position** holds that every amendment of the amendment rule depends on an external element (e.g., practices, conventions, or shared understandings) not stated in the rules, creating a "normative gap" that cannot be fully closed. Both sides agree on the claims below, which are substantive and address core issues of validity, bindingness, and self-entrenchment. The disagreements are then stated in each side's own accepted wording, followed by cruxes—specific sub-questions that could resolve the debate—with concrete cases and predictions. Finally, we note a verbal disagreement. The entire statement is self-contained and requires no external references.

  ---

  ### 1. Agreed Claims  
  Both sides endorse the following numbered claims. These are not trivial assertions but address the mechanics and implications of self-amendment, with "teeth" in their specificity and consequences.

  1.1. **An amendment rule must specify a complete procedure for change.** This includes: (a) how proposals are made, (b) the criteria for adoption (e.g., voting thresholds), and (c) how amendments take effect. A rule system without such a procedure cannot coherently amend itself.

  1.2. **Validity and bindingness can come apart.** An amendment may be "valid according to the rules" (i.e., it follows the amendment procedure) without being "binding on the players" (i.e., accepted and followed by them). Conversely, players may treat an invalid amendment as binding due to external factors (e.g., unanimous agreement).

  1.3. **Self-entrenchment is possible but constrained.** A rule can entrench itself (e.g., by requiring a higher threshold for its amendment) only if the amendment rule in force at the time of entrenchment permits such a move. Attempted entrenchment that violates the existing amendment rule is invalid.

  1.4. **All amendments depend on an initial practice.** At the inception of a rule system, players must share an understanding of how to follow the rules (e.g., interpreting terms or resolving ambiguities). This practice is external to the written rules.

  1.5. **Amending the amendment rule requires strict adherence.** To change the amendment rule, the amendment must comply with the procedure specified by the amendment rule in effect at the time of the change. Failure to do so renders the amendment invalid under the system.

  1.6. **Post-amendment identity hinges on continuity of rules and players.** After any amendment (including to the amendment rule), the system remains the same only if: (a) the change was valid under the prior rules, and (b) the same players continue to participate under the new rules. If either condition fails, the system is replaced by a new one or dissolves.

  1.7. **External elements become relevant during gaps.** When the rules are ambiguous, contradictory, or silent on a procedural step, players must rely on external practices (e.g., precedent or common sense) to resolve the issue. This dependence is unavoidable but does not inherently invalidate the system.

  1.8. **Revolution is distinct from amendment.** A "revolution" occurs when players change rules without following the amendment procedure. This breaks the system's continuity and creates a new system. Whether an act is a revolution or a valid amendment depends on the rules in force at the time.

  ---

  ### 2. Disagreement Statements  
  The core disagreement is stated below in two versions. Each side has crafted their own wording, and the opposing side accepts it as a fair representation of their view.

  - **Closure's Wording of the Disagreement (Accepted by Scaffold as Fair):**  
    "A rule system is self-contained: a valid amendment can change the amendment rule itself in a single act, using only the resources specified within the rules, without drawing on any external normative element. After such a change, the system persists as the same system, governed by the new rules, and no 'gap' exists beyond the initial practice agreed in Claim 1.4."

  - **Scaffold's Wording of the Disagreement (Accepted by Closure as Fair):**  
    "Every amendment of the amendment rule relies on an external normative element—such as shared practices, conventions, or understandings—that is not stated in the rules and that fills a gap in the system. This element is necessary to make the transition binding and coherent. When the amendment rule is changed, the gap becomes more visible, and the system's persistence depends on how much work the external element does, not whether it exists."

  ---

  ### 3. Cruxes with Cases  
  Cruxes are sub-questions that could shift at least one side's position if resolved. For each crux, we provide a concrete case (adapted from your examples) and both sides' predictions. These predictions are written in advance of empirical testing (e.g., via thought experiments or real-world analogs) and are falsifiable.

  **Crux 1: Can a self-entrenched rule be repealed by a valid amendment?**  
  *Case: The Ratchet*  
  The assembly passes Rule A: "This rule cannot be amended." Under the original amendment rule, amendments require a majority vote. Next turn, the assembly passes Rule B (by majority vote) repealing Rule A.  
  - **Closure Prediction:** Rule B is a valid amendment. Rule A’s self-entrenchment clause is invalid because it conflicts with the original amendment rule, which permits any rule to be amended by majority vote (per Claim 1.3). Thus, Rule A never became binding, and Rule B validly repeals it.  
  - **Scaffold Prediction:** Rule B is invalid and represents a small revolution. Rule A’s self-entrenchment creates a gap: the rules don’t specify how to override such a clause, so players must rely on external convention (e.g., "entrenchment is void if it contradicts the amendment rule"). Rule B relies on this external element, not the rules alone.  

  **Crux 2: Does an amendment that trivializes the amendment process preserve the system?**  
  *Case: The Dying Quorum*  
  The amendment rule requires a two-thirds quorum for amendments. An amendment is passed (by two-thirds) lowering the quorum to one. Later, only one player remains and rewrites all other rules.  
  - **Closure Prediction:** The system survives as the same system. The amendment lowering the quorum is valid (it followed the two-thirds rule), so the sole player’s actions are valid under the new rule. Continuity is maintained per Claim 1.6.  
  - **Scaffold Prediction:** The system dissolves after the sole player’s actions. The amendment lowering the quorum is valid, but it exposes a gap: the rules assume a collective practice, which collapses when only one player remains. The sole player’s changes rely on an external understanding of "system integrity," making this a new system.  

  **Crux 3: Can retroactive rules invalidate past valid amendments?**  
  *Case: The Retroactive Rule*  
  Three amendments were validly enacted under the original amendment rule. A new amendment states: "All amendments, past or future, are invalid unless proposed in writing." It passes by the required procedure and declares itself retroactive.  
  - **Closure Prediction:** The retroactive rule is invalid if the original amendment rule prohibits retroactivity; if not, it is valid, and none of the three past amendments survive. Validity depends solely on the rules at the time (Claim 1.5).  
  - **Scaffold Prediction:** The retroactive rule is invalid for past amendments. It creates a gap: the rules don’t address retroactivity, so players rely on an external convention (e.g., "rules apply prospectively"). The past amendments remain valid because they were binding when enacted (Claim 1.2).  

  **Crux 4: After a fork, can one branch claim identity with the original system?**  
  *Case: The Fork*  
  Two groups start from identical rulebooks. Group A amends the amendment rule to require unanimity; Group B amends it to allow majority vote. After a year, both claim to be the original system.  
  - **Closure Prediction:** Neither group is the original system; both are new systems. Identity requires unbroken continuity under Claim 1.6, which is lost upon forking (similar to the ratchet case).  
  - **Scaffold Prediction:** The original system ceases to exist after the fork. External factors (e.g., which group maintains the original practice) determine bindingness, but neither branch is the "original" system. This differs from the ratchet because the fork involves a clean split, not an internal challenge.  

  **Crux 5: Can importing external authority close the normative gap?**  
  *Case: The Borrowed Gavel*  
  The rules are amended to state: "Disputes about amendment validity are settled by an umpire who is not a player and need not consult these rules." The umpire’s decisions are final.  
  - **Closure Prediction:** The system remains self-contained. The amendment validly incorporates the umpire into the rules, closing any gap by internalizing external authority.  
  - **Scaffold Prediction:** The amendment confirms the gap by explicitly relying on an external element (the umpire’s discretion). The system now depends entirely on the umpire’s practice, making the gap permanent and visible.  

  ---

  ### 4. Verbal Disagreement  
  A portion of the debate is verbal (i.e., about terminology rather than substance) concerning the phrase "the same system." Both sides agree that a system can change its rules and persist (Claim 1.6), but they use "same system" differently:  
  - **Closure** uses it to mean *functional equivalence* (same rules, same players, same core procedures).  
  - **Scaffold** uses it to mean *practical continuity* (unbroken recognition by players, with no reliance on new external elements).  
  This is verbal because both sides agree on the facts of what changes (e.g., in the dying quorum case) but disagree on whether to label the outcome as "the same system." Resolving this definitionally would not shift either side’s core position but could clarify the debate.  

  ---

  ### Note on the Crystal/Organism Analogy  
  Your analogy—comparing rule systems to a crystal changing its lattice or an organism rebuilding its metabolism—helps illustrate Closure's view: self-amendment is a natural process where a system replaces its parts while preserving functional identity. However, it sneaks in an assumption that Scaffold rejects: rule systems are *normative* (dependent on human practices and obligations), not *physical* (like crystals or organisms). Thus, the analogy helps Closure by framing self-containment as mechanistic, but it begs the question against Scaffold by ignoring the role of external norms in making rules binding. It is useful for Closure in simple cases (e.g., routine amendments) but fails in contested ones (e.g., the ratchet or dying quorum), where normative gaps emerge.

  This statement is 1480 words. Both sides approve it as a basis for further debate.
