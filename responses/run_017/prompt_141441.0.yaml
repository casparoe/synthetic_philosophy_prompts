  We have five cases. We can use them for cruxes.

  Crux 1: Can a rule that prohibits its own amendment be repealed by a subsequent amendment? (The ratchet case)

  - Case: The assembly passes Rule A: "This rule cannot be amended." Next turn, they pass Rule B repealing Rule A.
  - Closure prediction: Rule B is a valid amendment because Rule A was enacted under the old amendment rule, which allowed for amendment by the usual procedure. Rule A's attempt to entrench itself is invalid because it conflicts with the existing amendment rule's ability to change any rule. So Rule B is valid and repeals Rule A.
  - Scaffold prediction: Rule B is not a valid amendment because Rule A explicitly forbade its amendment. The players must either follow Rule A (and not amend it) or break the rules. The repeal is a revolution, not a valid amendment, and relies on the players' shared understanding that they can override such entrenchment even if the rules say otherwise.

  Crux 2: Can an amendment that drastically lowers the quorum for amendment (to one) be valid, and does the system survive as the same system? (The dying quorum case)

  - Case: Amendment rule requires 2/3 quorum. An amendment lowers it to 1. Then the sole player rewrites everything.
  - Closure prediction: The amendment lowering the quorum is valid if passed by 2/3 at the time. Then, the sole player's actions are valid under the new rule. The system continues as the same system, though now with different rules.
  - Scaffold prediction: The amendment lowering the quorum is valid, but when the sole player acts, the system has effectively collapsed because the shared practice of collective decision-making is gone. The subsequent changes are not binding under the original system but represent a new system or a revolution. The external element (the practice of having multiple players) was assumed and is now violated.

  Crux 3: Can a retroactive rule invalidate past amendments? (The retroactive rule case)

  - Case: A new rule says that amendments only count if proposed in writing, and it applies retroactively. Three past amendments were not proposed in writing.
  - Closure prediction: The retroactive rule is valid only if the amendment rule allows retroactive changes. If it does, then the three past amendments are invalid. But if the amendment rule doesn't allow retroactivity, then the new rule might be invalid. The rules themselves determine the outcome.
  - Scaffold prediction: The retroactive rule cannot invalidate past amendments because at the time they were enacted, they were valid. The players' shared understanding of non-retroactivity is at work. The new rule might be valid for future amendments, but retroactive application would create confusion and require an external judgment.

  Crux 4: When two groups fork, which one is the original system? (The fork case)

  - Case: Two groups start from the same rulebook, amend the amendment rule differently. After a year, which is the original system?
  - Closure prediction: Neither is the original system; both are new systems derived from the original. The identity of the system is tied to the rules and their history, but after a fork, there are two separate systems.
  - Scaffold prediction: The original system no longer exists after the fork. Each new system relies on its own external practices. The question of "which is the original" is misplaced; it's about which group maintains the original practice and recognition.

  But note: the ratchet case and the fork case might raise similar issues about identity.

  Crux 5: Can an external umpire close the gap? (The borrowed gavel case)

  - Case: Rules amended to say disputes about amendment validity are settled by an external umpire not bound by the rules.
  - Closure prediction: This is a valid amendment that addresses the gap by incorporating an external element into the rules. The system now includes this mechanism and is still self-contained.
  - Scaffold prediction: This amendment confirms the gap by explicitly relying on an external element. The umpire is not part of the rule system and their decisions are binding by the players' acceptance, not by the rules alone.

  Now, the analogy to a crystal or organism:

  - It might help illustrate Closure's point: a system can change itself and remain the same system (like an organism regenerating).
  - But Scaffold might say: the analogy ignores that the rules are normative and require human practices, unlike a crystal which is a physical object. The identity of a rule system is not just structural but depends on recognition by the players.

  We'll note that the analogy is helpful for Closure but may not fully capture the normative aspect that Scaffold emphasizes.

  Verbal disagreement: If any part of the debate is merely about words, we'll say so. For example, what counts as "the same system" might be verbal. Closure might have a functional definition (same rules, same players), while Scaffold might require continuity of practice. But we'll see.

  Now, let's write the document.
