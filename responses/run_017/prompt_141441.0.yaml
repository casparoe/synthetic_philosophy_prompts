  For each crux:
  - The crux question
  - A concrete case (from provided or adapted)
  - Closure's prediction
  - Scaffold's prediction

  Finally, if applicable:

  **Verbal Disagreements**

  We must stay under 1500 words.

  Let's start with the agreed claims. We need claims that both sides can sign, with teeth. These should cover:

  - What an amendment rule must do.
  - Whether "valid according to the rules" and "binding on the players" can come apart.
  - What happens when a rule entrenches itself.

  Possible agreed claims:

  1. An amendment rule must specify a procedure by which rules can be changed, including what counts as a valid proposal, how it is adopted, and how it takes effect.
  2. For an amendment to be valid, it must be enacted in accordance with the amendment rule in force at the time of the amendment.
  3. The rules, including the amendment rule, are binding on the players only if the players collectively treat them as binding.
  4. A rule system can include rules that entrench themselves (e.g., requiring a supermajority for amendment) without immediately creating a paradox.
  5. An amendment that changes the amendment rule can be validly enacted under the old amendment rule, provided it follows the old rule's procedure.
  6. However, after such an amendment, the new amendment rule governs future amendments.
  7. The question of what happens when an amendment attempts to change the amendment rule in a way that might undermine the system's coherence (e.g., making amendment impossible or trivial) is a point of contention between Closure and Scaffold.
  8. The distinction between a valid amendment and a revolution (a change outside the rules) is meaningful and important.
  9. In any rule system, there is a practice of rule-following that underlies the written rules, but the rules themselves may or may not explicitly acknowledge this.

  But we need to ensure these are agreed and have teeth. We might adjust.

