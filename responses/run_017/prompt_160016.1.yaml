prompt: |-
  I coach a competitive debate team at a large public high school, and in the same building I moderate a monthly discussion group for adults who read philosophy on their own. In both settings I run into the same move several times a month, and I have never had a consistent way of ruling on it. Instead of offering evidence, a speaker says that the opponent could not even make the claim without presupposing its opposite. You cannot argue that there are no reasons for belief, because to argue is to offer a reason. You cannot say that every truth is relative, because that very statement presents itself as true and not merely relative. You cannot deny that you acted freely, since raising the denial is something you did. You cannot claim that nothing is objectively valuable while writing a speech that urges the audience to change its mind. Sometimes the move deserves to win the point. Sometimes it feels like rhetorical judo, a way of punishing someone for speaking at all. I have since learned that philosophers apparently have a name for this shape of argument and a long dispute about what, if anything, it establishes, but I have no training in the subject and I am asking you rather than reading about it.

  What I need is a decision procedure, not an essay. My students debate every other weekend, and whether this move counts decides rounds; I also have to give the adults something they can use the same evening. So I want six or seven questions in a fixed order, each with a statement of what counts as a sufficient answer, a point at which the procedure returns a clear no, and a point at which it stops and hands the decision to the judge because the remaining question is one of values rather than of fact. It has to fit on one side of an index card and be runnable by a fifteen-year-old in about ninety seconds in the prep room, with no technical vocabulary. Where a step needs a piece of theory in order to be understood, say so and say what the plain-language version gives up. The judges are community volunteers who will not accept anything that sounds like theory, and neither will half my students.

  Three things I have noticed on my own that I want built in, but corrected if I have them wrong. First, these arguments are supposed to start from something the opponent cannot deny; yet some of them start from something the opponent is perfectly willing to give up, such as their own continued participation in the exchange, since they can stop talking or say they are only venting a feeling rather than asserting anything. That difference seems to matter, and I want a question that catches it. Second, there is a reply that deflates many of these arguments for me: granted, we have to think that way, but is that any reason to think things are that way? Some arguments I hear seem to collapse under that reply and others seem untouched by it, and I cannot say which is which. To me this looks like the deepest issue in the whole neighbourhood, so I would like the procedure to contain an explicit test for vulnerability to it, and to say what an argument would have to add in order to be immune. Third, some of these arguments strike me as circularity in costume, where the starting point quietly contains the conclusion the argument was meant to establish. I want a question that catches that without rejecting every argument of this shape on principle, since a few of them clearly do real work.

  Please then run the finished procedure on three cases and be blunt about the results. Apply it to the relativism case above, where a speaker says that the claim there is no objective truth refutes itself. Apply it to the case of reasons for belief, because I have been using that argument myself for about ten years and I would rather be told honestly that it establishes only something weaker than I have been claiming, if that is what it establishes. And apply it to a case I expect to fail outright, such as the claim that no one can deny having free will, since anyone who says so could have stayed silent instead. Where the procedure hands a decision to the judge, say so explicitly and say what the judge is being asked to decide.

  Finally, tell me which of the questions are really judgment calls wearing procedural clothing, and what the procedure cannot do. In particular, I want to know whether it can ever certify a conclusion as true of the world rather than merely as something we are committed to in virtue of thinking or speaking at all, and how a judge should weigh a move that survives the whole procedure against a single piece of ordinary evidence pointing the other way.
reasoning: |-
  Okay, the user is a debate coach who also runs a philosophy group. They're struggling with a specific argumentative move where someone claims that making a statement presupposes its opposite. They need a quick, practical decision procedure to evaluate such arguments in both debate rounds and adult discussions. 

  First, I need to understand their core frustrations: inconsistent rulings, feeling some arguments are valid while others are rhetorical tricks, and needing something usable by teens and volunteers. The three insights they mentioned are crucial: (1) opponents might deny the presupposed premise (like stopping talking), (2) the "is thinking that way evidence it's true?" rebuttal, and (3) hidden circularity. 

  Hmm... the challenge is creating a flowchart-like checklist that's both philosophically sound and accessible. It must fit on an index card, avoid theory jargon, and work in 90 seconds. I'll start by breaking down the argument structure: every such move has a Claim (the opponent's assertion), a Presupposition (what the speaker says the claim requires), and a Contradiction (how they clash). 

  For the questions: Q1 should test if the opponent actually accepts the presupposition—this addresses their first insight. Q2 checks for circularity, their third point. Q3 tackles the "thinking vs. reality" gap (their second insight) by asking if the presupposition is *only* a mental commitment. Q4 handles cases where the presupposition might be optional (like walking away). Q5 examines counterexamples where the claim could be made without contradiction. Q6 is the escape hatch for when the issue boils down to values. 

  The examples will show how this works: relativism passes Q1-Q3 but gets stuck at Q4 ("could someone say this ironically?"). The "reasons for belief" argument passes Q1-Q2 but fails at Q3 (it only shows we're *committed* to reasons, not that they exist). Free will fails early at Q1 (deniers happily say they had no choice). 

  Biggest trade-off: Q3's "thinking vs. reality" distinction is philosophically thorny. The plain-language version can't resolve metaphysical debates but flags when the argument overreaches. Also, Q6 explicitly kicks unresolved values questions to the judge—no pretending the procedure can solve everything. 

  User's been using the "reasons for belief" argument for years... I should be gentle but clear: it only proves we're *pragmatically* committed to reasons during argument, not that reasons exist objectively. That might sting, but they asked for honesty. 

  Final note: the procedure can't certify truths about the world—only coherence. Against empirical evidence, a surviving argument should weigh lighter unless the evidence itself relies on the presupposition (e.g., using reasons to disprove reasons).
answer: |-
  Here's a decision procedure meeting your requirements. It fits on one side of an index card, uses plain language, and provides clear outputs. Philosophical compromises are noted where necessary.

  ---

  **"Presupposition Attack" Evaluation Procedure (Run in Order)**

  1.  **What is the EXACT claim being attacked?**  
      *Sufficient:* A clear statement of what the opponent said.  
      *Stop/No:* If unclear what claim is being targeted. Result: **Invalid Move**.  
      *Note:* Be literal. Don't let the attacker redefine the opponent's claim.

  2.  **What does the attacker say the opponent MUST PRESUPPOSE to even make that claim?**  
      *Sufficient:* A clear statement of the assumed idea/practice/value.  
      *Stop/No:* If no presupposition is specified. Result: **Invalid Move**.

  3.  **Is the presupposition CONTRADICTED by the original claim?**  
      *Sufficient:* Clear explanation of the logical conflict ("If X is true, you couldn't even say Y because Y needs not-X").  
      *Stop/No:* If no direct contradiction is shown. Result: **Move Fails**.

  4.  **COULD the opponent DENY this presupposition WITHOUT QUITTING the debate/action?**  
      *Sufficient:* Opponent shows a consistent way to hold their claim *without* needing that presupposition (e.g., "I'm just expressing feeling," "This is performance art," "I'm describing a hypothetical").  
      *Stop/Yes:* Opponent provides a plausible denial strategy. Result: **Move Fails**.  
      *Stop/No:* Opponent *cannot* deny the presupposition without stopping the act (e.g., silence, leaving). Result: **Move Succeeds (Weak Form)** - *Only shows inconsistency within the act of speaking/acting.*  
      *Note:* "Quitting" means stopping the relevant activity (debating, asserting, acting).

  5.  **Is the presupposition ONLY ABOUT HOW WE *THINK* OR *SPEAK*, NOT ABOUT HOW THE WORLD *IS*?**  
      *Sufficient:* Attacker admits the presupposition is about reasoning/communication rules, not direct evidence about reality.  
      *Stop/Yes:* Attacker admits this, or presupposition clearly concerns logic/language/rationality itself. Result: **Move Succeeds (Weak Form)** - *Shows commitment in thought/speech, not truth about the world.*  
      *Stop/No:* Attacker claims presupposition *must* be true of the world. Proceed to Q6.

  6.  **Are there REAL COUNTEREXAMPLES where the claim WORKS without the presupposed thing?**  
      *Sufficient:* Plausible scenario where the claim functions meaningfully without the presupposition (e.g., "Could a robot simulate this claim without believing it?" "Could a culture exist where this logic doesn't hold?").  
      *Stop/Yes:* Plausible counterexample exists. Result: **Move Fails**.  
      *Stop/No:* No plausible counterexample. Result: **Move Succeeds (Strong Form)** - *Hand decision to Judge.*  
      *Note:* "Plausible" means reasonably imaginable, not proven true. *Trade-off:* This simplifies complex modal logic.

  7.  **JUDGE'S DECISION (Only if Q6 = Stop/No):**  
      *Question:* "Does successfully *using* reason/language/action **prove** that the thing presupposed (e.g., truth, reasons, free will) exists *in the world*, or only that we *must act as if* it exists?"  
      *Result:* Judge decides based on their view of philosophy. *No procedure answer.*

  ---

  **Key Theory Trade-offs in Plain Language:**

  *   **Q4 (Denial):** Gives up resolving deep philosophical stances like radical skepticism (where the skeptic *might* genuinely claim they aren't asserting truths). Prioritizes practical debate engagement.
  *   **Q5 (Thinking vs. Being):** Crucial but simplified. The "deep issue" (is a *need to think X* evidence *X is true*?) is flagged here. "Weak Form" result acknowledges this gap.
  *   **Q6 (Counterexamples):** Replaces complex analysis of necessity with a practical plausibility test. May let some bad arguments through or block some good ones, but is operable quickly.
  *   **Q7 (Judge's Call):** Explicitly outsources the deepest philosophical rift (Transcendental Arguments vs. Pragmatism/Naturalism) to the judge. The procedure cannot resolve this.

  ---

  **Application to Your Cases:**

  1.  **Relativism ("No objective truth" refutes itself):**
      *   Q1: Claim = "There is no objective truth."
      *   Q2: Presupposition = "That this statement itself is objectively true."
      *   Q3: Contradiction? Yes. Claim denies objective truth, but presents itself as objectively true.
      *   Q4: Can opponent deny presupposition without quitting? **YES.** "I'm not claiming my *statement* is objectively true; it's just my relative perspective/feeling/expression within my framework." Result: **Move Fails**. (The speaker *can* consistently deny needing to presuppose their statement is objectively true).

  2.  **Reasons for Belief ("You can't argue against reasons without offering one"):**
      *   Q1: Claim = "There are no reasons for belief."
      *   Q2: Presupposition = "That the act of arguing *is* offering a reason for belief."
      *   Q3: Contradiction? Yes. Claim denies reasons exist, but act of arguing offers one.
      *   Q4: Can opponent deny presupposition without quitting? **NO.** If they are arguing, they are engaged in giving reasons. To deny this *is* to quit arguing. Result: **Move Succeeds (Weak Form)**. *It only shows the opponent is inconsistent within the practice of argumentation. It does NOT prove reasons for belief exist in the world.*
      *   (Q5 would be "Stop/Yes" - Presupposition is about the practice of arguing/reasoning).

  3.  **Free Will ("You can't deny free will because you spoke freely"):**
      *   Q1: Claim = "I do not have free will."
      *   Q2: Presupposition = "That by speaking to deny it, you exercised free will (you 'could have stayed silent')."
      *   Q3: Contradiction? Yes. Claim denies free will, but act of speaking *implies* a free choice.
      *   Q4: Can opponent deny presupposition without quitting? **YES, EASILY.** "I *couldn't* have stayed silent; my physical/neurological state determined I would speak. Saying 'I have no free will' is just a determined output." Result: **Move Fails**.

  ---

  **What the Procedure Can and Cannot Do:**

  *   **Judgment Calls Disguised:** Q4 (plausibility of denying presupposition without quitting) and Q6 (plausibility of counterexamples) involve significant judgment, though guided. Q7 is explicitly a judgment call.
  *   **Truth vs. Commitment:** The procedure **CANNOT** certify a conclusion as "true of the world." The *Strong Form* (Q6 Stop/No) gets closest, but Q7 explicitly hands the "truth about the world" question to the judge's philosophical view. The *Weak Form* explicitly only shows an internal commitment or pragmatic necessity within a practice (like speaking or reasoning).
  *   **Weighing Against Evidence:** A move surviving to *Strong Form* (Q7) claims a *logical necessity* (if the practice exists, the presupposition must hold). A single piece of ordinary evidence points to a *contingent fact*. The judge must decide:
      *   Does the logical necessity argument *override* the empirical evidence? (Transcendental view)
      *   Is the empirical evidence a *counterexample* showing the logical necessity argument is flawed or applies only to our concepts, not reality? (Naturalist/Pragmatist view)
      *   **The procedure provides no rule for this.** It flags the conflict (Q5/Q7) but judges must weigh based on their own stance. In practice, within a debate round focused on clash, the surviving *Strong Form* move would likely be weighed as very strong, potentially outweighing a single piece of evidence, *unless* the evidence directly counters the presupposition's reality (e.g., neuroscience against free will).

  This procedure gives debaters and your group a structured way to dissect these common moves quickly, identifies the core points of contention, differentiates levels of success, and explicitly flags where deeper philosophy takes over, allowing for faster and more consistent rulings.
