answer: |-
  Here’s a focused, argument-driven proposal tailored to your specifications, avoiding lit-review framing and written in American English:

  ---

  **Proposal: Kant’s Indirect Duties to Animals — Reassessing the Structure and Scope of Moral Concern**  

  **Research Question**:  
  Does Kant’s "indirect duty" framework regarding animals collapse into a functionally direct duty once the empirical causal claim (that animal cruelty cultivates vice toward humans) is bracketed, and can this framework accommodate moral distinctions between types of non-rational beings?  

  ### Core Problem & Stakes  
  Standard interpretations present Kant’s indirect duty view as a three-part package:  
  1. **Grounding**: Duties regarding animals derive solely from duties *to* rational beings (humanity).  
  2. **Content**: Duties require avoiding cruelty or gratuitous harm to animals.  
  3. **Mechanism**: Cruelty is wrong *because* it empirically corrupts character, increasing the risk of violating duties to humans.  

  Your hypothesis identifies a critical tension: If (3) is weakened (e.g., if empirical evidence doesn’t robustly support the "character corruption" claim, or if Kant’s ethics doesn’t *depend* on it), then (1) and (2) may generate a duty whose *content* is determined by the animal’s suffering or interests—even if its *ground* remains human-focused. This raises two key issues:  
  - **Structural Ambiguity**: If the duty’s content is fixed by the animal’s good (e.g., minimizing pain), and agents must weigh this good against human ends, "indirect" may only signify that animals cannot be *wronged*, not that their interests are morally irrelevant.  
  - **Variability Problem**: Kant treats "animals" monolithically based solely on non-rationality. Yet if the duty’s content responds to features like sentience, his framework lacks resources to distinguish morally between (e.g.) a chimpanzee and a clam, potentially demanding over- or under-protection.  

  ### Competing Interpretations (Why the Question is Live)  
  - **The Standard "Character Formation" View**: Duties are *entirely* contingent on empirical psychology (3). Bracketing (3) undermines the duty altogether. *But*: This struggles with texts where Kant condemns cruelty *as such*, suggesting content is non-contingent.  
  - **The "Obligation-to-Humanity" View**: (1) and (2) hold, but (3) is illustrative, not essential. Duties are "indirect" because animals lack standing, yet their interests *objectively* shape obligations (e.g., animal pain *is* the relevant reason for action, even if grounded in human duty). *But*: This risks conflating indirectness with directness in practice.  
  - **The "Rigorous Binary" View**: Kant’s ethics *requires* a sharp rational/non-rational divide. Variability is impossible; duties arise only from instrumental concerns like character or resource waste. *But*: This seems incompatible with Kant’s emphasis on the *heinousness* of certain acts (e.g., sport hunting) over others.  

  ### Methodology & Work Plan  
  To avoid over-reliance on *Doctrine of Virtue* 6:443, I’ll triangulate arguments across:  
  1. **Kant’s Core Ethical Framework** (Weeks 1-3):  
     - Analyze the *Groundwork* and *Critique of Practical Reason* to clarify how duties are generated and what role empirical consequences play in determining content.  
     - Examine Kant’s treatment of non-moral value (e.g., in the *Critique of Judgment*) to assess whether animal suffering has inherent disvalue his system must acknowledge.  
     *Why?* Establishes whether (1) and (2) can function independently of (3).  

  2. **Expanded Texts on Animals** (Weeks 4-6):  
     - Compare passages on animals from *Lectures on Ethics*, *Anthropology*, and minor essays alongside the *Metaphysics of Morals*.  
     - Focus on language describing *what* is prohibited (e.g., "torment," "overburdening," "gratuitous destruction") and Kant’s rationale when (3) isn’t invoked.  
     *Why?* Identifies if Kant’s content-based prohibitions presuppose sensitivity to features like sentience or complexity.  

  3. **Variability Challenge** (Weeks 7-9):  
     - Scrutinize Kant’s discussions of rationality gradations (e.g., children, cognitively impaired humans, "rational aliens") to test if his framework *could* accommodate sliding scales.  
     - Assess whether concepts like "analogue of humanity" (*MdS* 6:443) or instrumental/value-laden terms ("purpose," "organization") imply moral distinctions between non-rational beings.  
     *Why?* Determines if the binary is foundational or a contingent omission.  

  4. **Synthesis & Argument Development** (Weeks 10-12):  
     - Reconstruct the strongest version of the "indirect but content-sensitive" view.  
     - Test it against objections (e.g., is it coherent? Does Kant’s system allow it?).  
     - Draft paper.  

  ### Possible Conclusions  
  - **Strong Revision**: Kant’s view, properly understood, *is* functionally direct in content (agents must respond to animal interests) but indirect in grounding (animals aren’t wronged). "Indirect" primarily denotes moral standing, not deliberative irrelevance.  
  - **Moderate Revision**: Bracketing (3) reveals unresolved tension; Kant needs but lacks resources for variability, weakening the theory’s applicability.  
  - **Conservative**: The binary and dependence on (3) are fundamental; attempts to soften them distort Kant’s ethics.  

  **Deciding Factors**:  
  - Textual evidence that Kant treats animal suffering/nature as *constitutive* of the duty’s content, not merely evidentiary for character risks.  
  - Systematic coherence: Can (1) generate (2) without relying on (3)? Does Kant’s broader ethics allow non-arbitrary distinctions among non-rational entities?  

  ### Risks & Scope Management  
  - **Failure Conditions**:  
    - If Kant’s texts *exclusively* tie duties to (3), bracketing it leaves no coherent duty.  
    - If Kant’s ethics provides *no* conceptual tools for variability, the second question is unanswerable.  
  - **Scope Creep Risks**:  
    - **Too Big**: Engaging deeply with Kant’s philosophy of biology or contemporary animal ethics. **Mitigation**: Strict focus on Kant’s *practical* works and internal coherence.  
    - **Textual Overreach**: Chasing every obscure reference. **Mitigation**: Prioritize works central to Kant’s mature ethics (*GMM*, *CPrR*, *MdS*) and well-attested lectures.  

  **Deliverable**: A 7,000-word paper arguing that Kant’s indirect duty view, when disentangled from empirical causality, requires agents to treat animal interests as *directly relevant* to moral deliberation, exposing both its unrecognized nuance and its inability to differentiate obligations toward diverse non-rational beings.  

  ---  

  This structure provides a clear roadmap, stakes the claim in existing debates without lit-review baggage, and leverages diverse texts to avoid hanging on *MdS* 6:443 alone. It’s ambitious but feasible for one semester if you strictly police scope.
