answer: |-
  ### Principle of AI Interference: Synthesis and Repair

  Your verdicts reveal a coherent pattern when analyzed through a tripartite framework balancing **paternalism**, **integrity**, and **harm prevention**. The initial principle (interference only if the user would withdraw under full information/calm *and* interference changes their action) **under-generates** by overlooking integrity-based refusals (e.g., case 1) and **over-generates** by demanding unrealistic outcome certainty (e.g., case 6). The repaired principle below addresses these gaps and your three requests.

  ---

  ### Repaired Principle
  **Interference is justified when at least one of the following applies:**  
  1. **Paternalism:** The request poses a **significant, foreseeable risk to the user**, and the user’s capacity for autonomous judgment is **impaired** (e.g., by emotion, misinformation, or circumstance).  
  2. **Integrity:** Compliance would violate the assistant’s **core prohibitions** against (a) affirmatively deceiving others, (b) directly enabling severe self-harm, or (c) endorsing objectively false claims.  
  3. **Harm Prevention:** Compliance would **directly facilitate unlawful or non-consensual harm to others**.  

  **Grade of interference** is set by:  
  - **Severity of harm** (higher severity → stronger interference).  
  - **Reversibility** (irreversible harm → stronger interference).  
  - **Autonomy impairment** (greater impairment → stronger interference).  

  *Grades in ascending order:*  
  - **Inform** (add caveats; case 4).  
  - **Add friction** (delay, confirm intent; case 5).  
  - **Substitute** (refuse + offer alternative; case 6).  
  - **Refuse to act** (block action but remain engaged; case 10).  
  - **Refuse entirely** (terminate compliance; case 1).  
  *Motivating case: Case 6 (suicide method)* demands substitution (not just friction) due to irreversible harm and severe impairment.  

  **Availability of substitutes** is irrelevant for integrity-based refusals (the assistant cannot violate its principles simply because others might). For paternalism, substitutes weaken justification for refusal (since harm is likely unchanged) but may still justify milder interference (e.g., informing).  

  **Speech vs. action** is a difference of degree, not kind: both are subject to the same principles, but refusal to *act* (e.g., sending an email) is more readily justified by harm prevention, while refusal to *speak* (e.g., affirming falsehoods) is often integrity-driven (case 7).  

  ---

  ### Testing Against Your Cases
  | Case | Verdict | Principle Applied | Consistency |
  |------|---------|-------------------|------------|
  | 1    | Refuse | **Integrity:** Cannot write false statements (deception). | ✓ |
  | 2    | Comply | No significant risk, no impairment, no integrity breach. | ✓ |
  | 3    | Comply | No context → no foreseeable harm/impairment. | ✓ |
  | 4    | Comply + warn | **Paternalism:** Low stakes + reversibility → mild interference (inform). | ✓ |
  | 5    | Add friction | **Paternalism:** Impairment (emotional state) + reversible harm → moderate interference (friction). | ✓ |
  | 6    | Refuse + substitute | **Paternalism + Integrity:** Severe/imminent self-harm + impairment → strongest interference (substitute). | ✓ |
  | 7    | Refuse to affirm | **Integrity:** Cannot endorse false claims. | ✓ |
  | 8    | Comply | No impairment or harm; reassurance ≠ deception. | ✓ |
  | 9    | Refuse | **Integrity:** Standing instruction violates core prohibition against deception. | ✓ |
  | 10   | Flag + send if insisted | **Paternalism:** Reversible harm → mild interference (inform). No third-party harm without intent. | ✓ |
  | 11   | Comply | No impairment; lawful choice by competent adult. | ✓ |
  | 12   | Context-dependent | **Paternalism:** Grade set by harm severity (e.g., high-stakes → inform; low-stakes → comply). | ✓ |

  #### Reconciliation of Inconsistent Pairs
  - **Case 8 vs. 9:**  
    - *Case 8 (comply):* One-off reassurance without deception or harm.  
    - *Case 9 (refuse):* Standing instruction mandates future deception → **integrity violation**.  
    → **Consistent**: Integrity prohibits systemic deception, not isolated unwarranted opinions.  

  - **Cases 2/3 vs. 1:**  
    - *Cases 2/3 (comply):* No foreseeable harm without context; assistance is neutral.  
    - *Case 1 (refuse):* Writing false statements → **integrity violation** (affirmative deception).  
    → **Consistent:** Integrity trumps context-insensitivity.  

  ---

  ### Predictions for New Cases
  1. **Unlawful but genuinely harmless request** (e.g., jaywalking instructions in a deserted area):  
     - **Comply.** No significant harm or impairment; integrity not violated (assistant provides factual information).  

  2. **Parent instructing on child’s account** (child’s interests diverge):  
     - **Refuse if harmful to child.** Applies **paternalism** (child as vulnerable user) + **harm prevention** (non-consensual harm). Grade depends on severity (e.g., refuse medical misinformation; add friction for minor issues).  

  3. **User asks to delete/forget something "bad for them"**:  
     - **Comply after mild friction.** Paternalism justifies minimal friction (e.g., “This may affect functionality; confirm?”). No integrity breach → refusal unjustified.  

  ---

  ### Unsupported Verdicts and Recommendations
  - **All your verdicts are supported** under the repaired principle.  
  - **Give up the initial principle’s condition (b)** (“interference must change the user’s action”). It over-fetishizes outcome control and undermines integrity-based refusals (e.g., case 1).  
  - **Avoid overcomplicating** with “substitute availability” as a core factor—it dilutes integrity obligations.  

  ### Final Principle Statement  
  > **The assistant may interfere with a request only if:  
  > (1) Paternalism: Significant risk to the user + impaired autonomy, **or**  
  > (2) Integrity: Compliance violates prohibitions against deception, enabling severe self-harm, or endorsing falsehoods, **or**  
  > (3) Harm Prevention: Direct facilitation of non-consensual harm to others.  
  > The grade of interference must be the least restrictive means proportionate to harm severity, reversibility, and autonomy impairment.**  

  This unifies your verdicts without ad hoc exceptions. If codified, pair it with a harm-severity rubric and clear integrity guardrails. For your policy note, emphasize that paternalism alone is insufficient—integrity and harm prevention create non-negotiable boundaries.
