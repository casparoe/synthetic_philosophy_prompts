  ### Craft Notes  
  **Writing for Correct Attributions**:  
  - **Show Clara’s competence**: Detail her thorough search (e.g., "cushions sliced open") to establish R as reasonable, not negligent.  
  - **Withhold the falsifier’s salience**: Do not name "hidden compartments" in narration; imply it through setting (e.g., "clean-lined walls, no obvious seams"). If Clara thinks of it, it becomes salient, potentially making the world closer and restoring knowledge—so avoid her considering it.  
  - **Neutralize the unused check**: Emphasize time pressure and prior effort (e.g., "three hours searching," "chief wants it wrapped up") to make skipping the K-9 search reasonable, not careless.  
  - **Where you must cheat**: In the apparatus, the coroner’s reliability is assumed. If the scene hints at coroner error, the nearest ~P worlds might become closer, undermining P. Keep forensic authority absolute.  

  **Final Cheat**: The entailment relies on R being known, but the deduction feels like it flows from P alone. The prose masks this by having P feel primary ("It followed... from P and R"), so readers grant the deduction naturally.  

