  ### The Scene

  Clara stood in the cramped evidence room, the coroner’s report crisp in her hands. The victim, Arthur Vance, had been stabbed in his study. *Cause of death: single-edged blade, consistent with a kitchen knife*. That much was clear. She’d read the report twice. No ambiguity—the wounds were deep, clean, unmistakable. P: The murder weapon was a knife. Method: reviewing the coroner’s typed findings, cross-referenced with the evidence photos. She knew it. If the weapon hadn’t been a knife—say, a letter opener—the coroner, meticulous and seasoned, would have noted the difference in tissue damage. But here, the report was unequivocal.

  Her own search of Vance’s home flashed in her mind. Three hours, room by room, drawers emptied, cushions sliced open. Only one knife found: a chef’s blade, plain-handled, in the kitchen block. No others. Not in the garage, not in the study desk. R: The only knife in the house was the victim’s kitchen knife. Method: her systematic sweep, trained and methodical. She knew this too. If there’d been another knife—a hunting knife, say—left casually on a shelf, she’d have seen it. The nearest worlds where her search failed were those with a hidden compartment, something behind the study’s wainscoting or under the floorboards. But those weren’t likely; the house was modern, clean-lined, no signs of modification. In such worlds, her search would still have concluded "only one knife," and she’d believe R. But here, now, it was solid.

  She leaned against the cold metal table. Q: The murder weapon was the victim’s kitchen knife. It followed, cleanly, from P and R. If the weapon was a knife, and only one knife existed here, then it had to be the kitchen blade. Simple logic. No other possibility. She believed it.

  But she didn’t *know* it. The thought pricked her—not doubt, exactly, but a gap in the terrain. Vance’s son would be arrested within the hour based on this: opportunity, access to the kitchen. A reasonable move, but irreversible. She could request a second search, bring in a K-9 unit to sniff for hidden compartments. It would take time, though, and the chief wanted this wrapped up. The son’s alibi was shaky; delay risked flight. She weighed it, then dismissed the option. Her search had been thorough; no need. She initialed the arrest form.

