  ### Compact Apparatus
  - **P**: The murder weapon was a knife.  
  - **Q**: The murder weapon was the victim’s kitchen knife.  
  - **Entailment**: P and R (R: The only knife in the house was the victim’s kitchen knife) entail Q.  
  - **M for P**: Reading the coroner’s report and evidence photos.  
  - **Grain of M**: Coarse-grained as "reviewing the official forensic documentation." Finer grain (e.g., "visual inspection of specific wound morphology") would alter the verdict, but coarse grain fits standard police work.  
  - **Method for Q**: Inference from P and R. If the method for Q is described to include the method for P (and R), it becomes "inference from coroner’s report and personal search," which still fails to track Q in the relevant worlds.  

  #### Tracking Conditions  
  1. **For P**:  
     - True: Yes (actual world).  
     - Believed by M: Yes.  
     - ~P → ~(Belief via M): In nearest ~P worlds (weapon not a knife, e.g., letter opener), coroner’s report would state the correct weapon, so Clara would not believe P. **Condition holds.**  
     - P → Belief via M: In nearby P worlds, report states "knife," so she believes. **Condition holds.**  
     *Verdict: Clara knows P.*  

  2. **For Entailment (P ∧ R → Q)**:  
     - True: Yes (actual world).  
     - Believed: Clara recognizes the logic.  
     - Tracking: The entailment fails only in worlds with bizarre logical errors (e.g., "knife" meaning something non-physical), which are extremely remote. Clara would still believe the entailment in all nearby worlds. **All conditions hold.**  
     *Verdict: She knows the entailment, but only because falsifying worlds are distant.*  

  3. **For Q**:  
     - True: Yes (actual world).  
     - Believed by method (inference from P and R): Yes.  
     - ~Q → ~(Belief via method): Fails. Nearest ~Q worlds are ~R worlds (e.g., hidden hunting knife in a compartment). In these, P is true (weapon is a knife), and Clara still believes R (search missed the hidden knife), so she infers and believes Q (falsely). **Condition fails.**  
     - Q → Belief via method: In nearby Q worlds, she infers Q from P and R. **Condition holds.**  
     *Verdict: Clara does not know Q.*  

  **Asymmetry as Engine**: The nearest ~Q worlds (~R worlds) are farther than the nearest ~P worlds (weapon not a knife). ~P worlds require coroner error (unlikely), while ~R worlds require a hidden compartment (unlikely but closer). This asymmetry drives the failure: in ~Q worlds, she believes Q because R fails undetectably.  
  - **If removed (nearest ~Q = nearest ~P)**: If ~Q worlds were only ~P worlds (e.g., no hidden compartments possible), she would track Q, as she’d not believe P in those worlds. Verdict changes: she knows Q.  

  **Unused Check**: A K-9 search could reveal hidden compartments. If available and used, it might restore knowledge by correcting R. But Clara doesn’t use it. Its mere availability does not restore knowledge; she must employ it to alter the method. To neutralize without negligence: Show the action is reasonable given constraints (time pressure, prior thoroughness). The scene does this—delay risks flight, and her search was competent.  

  **Reasonable Action Without Knowledge**: Yes. The framework allows reasonable action based on well-supported belief, even without knowledge, via the "would believe" conditions. Here, Clara’s belief in Q is sensitive to truth in most scenarios (she’d only believe Q if P and R held), but not in the nearest falsifying worlds. Her action is reasonable because her belief is formed by reliable methods, and the error possibility is remote.  

