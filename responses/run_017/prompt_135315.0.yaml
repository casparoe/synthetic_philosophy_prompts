prompt: |-
  I am drafting the allocation rule for a public body, and I want the specification settled before I look at how the philosophical literature answers it, so that I don't inherit that literature's blind spots about the use I have in mind.

  The setting. The body distributes a fixed stock of goods and burdens once, to a known set of claimants, and cannot take anything back afterwards. It cannot observe the claimants' mental states and cannot ask them; it has records of what they have, what they can do, and what has been done to them. It must give every unsuccessful claimant a written statement of why their claim ranked where it did. And its allocations partly determine who the next round's claimants will be, because housing, training and care allocations affect which households form and which people arrive. I am not asking whether equality is the right aim for this body; that is settled by statute. I am asking what the currency of equality would have to be like for this body to be able to use it.

  What I want is the requirements list: what any candidate currency — a candidate answer to the question of what, exactly, is to be equalized — must be able to do, with the case behind each requirement, and with each requirement marked as non-negotiable given my setting, negotiable, or a prejudice imported from some other use a theory of equality might be put to.

  The cases I am confident a currency must handle, stated in my own terms:

  Two claimants receive identical bundles, and one needs far more than the other to get to the same point — an impairment, a chronic condition, a caring responsibility. The currency must register the difference in what bundles do for people without simply collapsing into how satisfied those people report or appear to be.

  Three claimants each end up wanting something very expensive. The first cultivated the taste deliberately, with full information and no pressure. The second acquired it because the body itself supplied the means in an earlier round — learned to sail on a publicly funded boat, say. The third no longer wants much of anything, and wanted progressively less across a long period of being given very little. The currency must say which of these generate claims, and in particular must tell me how the second case differs from the third, since both involve aims that the allocation itself helped produce.

  What a claimant can do with a share depends on what others are given — a place in a programme, a priority date, a permit, a house on a particular street. So I need to know whether the currency has to be assessable on a pair of claimants in isolation, or whether it only has a verdict once the whole distribution is known; the body sometimes has to decide between two claimants before it knows the rest of the population.

  Provision moves the baseline. Once lifts, ramps and interpreters are supplied, what counts as an ordinary share of access changes for everyone, including people whose access was never at issue. The currency must say whether its standard is anchored to a pre-allocation baseline or floats with what is actually provided, since a floating standard lets a body appear to equalize by redefining the target.

  The written statement is itself part of the allocation. If the currency is a mental state, announcing a verdict perturbs what is being measured — being told one counts as badly off can make a person worse off. I want to know whether robustness to being announced is a genuine requirement or only a problem for one family of currencies.

  And because allocations determine who the future claimants are, the currency must permit comparisons across alternatives whose claimant-sets are not the same, and must say what to conclude when the people who would be worst off under one alternative simply do not exist under the other.

  Beyond the list, three things. Flag any pair of requirements you think cannot be jointly satisfied — that is the part I most want, since it would mean my statute asks for something incoherent. Tell me which single requirement does the most work in excluding otherwise attractive candidates. And say which of the requirements are really about the currency and which properly belong to the procedure, the timings, or the unit of assessment — whether the currency attaches to individuals, households, or something else, and what it is to do with a household whose members will not say how unevenly the share is divided inside it.

  Only then, and in a short paragraph each, how the three familiar families — currencies pitched at states of a person, at the means a person holds, at what a person is substantively free to do and be — do against the list. I do not need names, dates or reading.
reasoning: |-
  Hmm, the user is drafting an allocation rule for a public body and needs a requirements list for the currency of equality. They want to avoid philosophical blind spots, so I need to focus purely on their operational constraints. Let me unpack their setting carefully.

  The key constraints are: fixed stock distribution, no take-backs, no mental state observation, mandatory written justifications, and future claimant sets being endogenous to current allocations. The currency must handle specific hard cases they've outlined - differential needs, expensive tastes (with three subtypes), positional goods, shifting baselines, announcement effects, and non-identical future populations.

  I should structure this as a requirements list with negotiability flags. The core tension seems to be between interpersonal comparability and objectivity - how do we compare needs without subjective states? And the future claimant problem might be fundamentally unresolvable if we're comparing welfare across counterfactual populations.

  For the expensive taste cases, I notice the second and third cases both involve adaptive preferences but with different causes - one state-induced, one deprivation-induced. The currency must distinguish these without mental states. That points to needing some historical tracing of preference formation.

  The written justification requirement is particularly nasty. If we declare someone "disadvantaged," it might actually worsen their position. This could rule out any currency that incorporates self-perception. But if we avoid that, how do we capture social exclusion?

  On negotiability: The allocation effect on future claimants seems non-negotiable by statute, but the comparability requirement might need softening. Perhaps we can only compare across alternatives with identical claimant sets? Though that would cripple planning.

  The big trade-off appears between completeness (handling all cases) and operationalizability. Resource-based currencies fail on differential needs, capability approaches struggle with shifting baselines, and welfare approaches crash on announcement effects. None handle the future population problem cleanly.

  I should flag that the combination of "no mental states" + "differential needs" + "written justifications" might be impossible - how do we justify to person A that their impairment warrants more resources without implying they're worse off, if we can't reference their actual experience?

  For the most exclusionary requirement, "no mental state observation" does heavy lifting - it immediately disqualifies all subjective welfare approaches. The future claimant requirement is the most philosophically fraught though.

  Finally, the household problem belongs to the unit of assessment, not currency design. We'll need a procedural rule for uncooperative households - perhaps assume equal internal distribution by default?
answer: |-
  Below is the requirements list for your equality currency, structured to address your operational constraints, followed by analysis of trade-offs and philosophical families. Requirements are categorized as **Non-Negotiable** (NN), **Negotiable** (N), or **Prejudice** (P).

  ---

  ### **Requirements List for the Equality Currency**
  1. **Non-Subjective Interpersonal Comparability (NN)**  
     *Case:* Two claimants with identical bundles but differing needs (e.g., impairment vs. no impairment).  
     *Requirement:* The currency must objectively compare what bundles *do* for people (e.g., access to opportunities, functionings) without relying on self-reported satisfaction, observed behavior, or mental states.  
     *Why NN:* Statute prohibits mental state observation; written justifications demand objective criteria.

  2. **Handling Expensive Tastes & Adaptive Preferences (NN)**  
     *Case:* Three claimants with costly desires (deliberate cultivation, state-induced, deprivation-induced adaptation).  
     *Requirement:* The currency must distinguish between:  
       - Claims arising from *autonomously formed* preferences (weak/no claim).  
       - Claims from *state-influenced* preferences (strong claim, e.g., public sailing program).  
       - Claims from *deprivation-induced adaptation* (strong claim, e.g., reduced desires after chronic neglect).  
     *Why NN:* Allocation history affects future claims; justice requires compensating state-caused disadvantages.

  3. **Positional Independence vs. Holism (N)**  
     *Case:* Allocations where value depends on what others receive (e.g., permits, housing locations).  
     *Requirement:* The currency must clarify whether it is:  
       - *Individualistic* (assessable per claimant-pair in isolation), or  
       - *Holistic* (requires full distribution context).  
     *Why Negotiable:* Practicality depends on allocation sequencing. If the body must decide pairwise before full population data exists, individualistic assessment is essential. Otherwise, holistic may suffice.

  4. **Baseline Anchoring (NN)**  
     *Case:* Provision of accommodations (ramps, interpreters) shifts societal expectations.  
     *Requirement:* The currency’s standard must be *anchored* to a pre-allocation baseline (e.g., "access without accommodations"), not float with new provisions.  
     *Why NN:* A floating baseline allows manipulation ("equalizing" by lowering standards). Written justifications require fixed reference points.

  5. **Announcement-Robustness (N)**  
     *Case:* Declaring a claimant "disadvantaged" may worsen their well-being.  
     *Requirement:* The currency must be robust to being publicly stated without altering the state it measures.  
     *Why Negotiable:* Only currencies tied to mental states (e.g., happiness) are inherently perturbed; resource-based currencies are unaffected. Could be addressed procedurally (e.g., anonymized feedback).

  6. **Cross-Population Comparability (NN)**  
     *Case:* Allocations affect future claimant sets (e.g., housing policy shapes households).  
     *Requirement:* The currency must compare outcomes across alternatives with *non-identical populations*, including cases where the "worst-off" under one option don’t exist under another.  
     *Why NN:* Statute mandates that allocations influence future claimants; justice must span possible futures.

  7. **Unit of Assessment Specification (P)**  
     *Case:* Households with internal inequality (e.g., resources not shared).  
     *Requirement:* The currency must define its unit (individual/household) and handle opaque units procedurally (e.g., assume equal sharing if unverified).  
     *Why Prejudice:* This is a procedural/measurement issue, not inherent to the currency. Belongs to implementation rules.

  ---

  ### **Critical Trade-offs and Exclusionary Requirements**  
  - **Key Conflict:** **Cross-Population Comparability (6)** and **Non-Subjective Comparability (1)** clash with **Handling Adaptive Preferences (2)**. Comparing non-identical populations (e.g., potential vs. actual claimants) requires abstract metrics (e.g., capabilities), but tracking preference adaptation demands historical context (e.g., "did past allocations cause this desire?"). Satisfying both may necessitate contentious counterfactuals (e.g., "what would they want without intervention?").  
  - **Most Exclusionary Requirement:** **Non-Subjective Interpersonal Comparability (1)**. It discards all mental-state currencies (e.g., welfare, happiness) and forces focus on objective functionings or resources.  
  - **Procedural vs. Currency Requirements:** Unit of assessment (7) and announcement robustness (5) are primarily procedural. The currency itself need only *permit* solutions (e.g., anchoring to individuals, ignoring feedback effects).

  ---

  ### **Assessment of Philosophical Families**  
  1. **Means/Resources**:  
     *Fails:* Ignores differential needs (Requirement 1). Cannot distinguish state-induced vs. autonomous expensive tastes (2). Positional goods (3) and baseline shifts (4) destabilize valuation. *Strengths:* Objective, announcement-robust (5), clear units (7).  

  2. **Substantive Freedoms/Capabilities**:  
     *Fails:* Floating baseline problem (4)—capabilities expand with provision, masking inequality. Struggles with cross-population comparisons (6) if capabilities are context-dependent. *Strengths:* Handles differential needs (1), distinguishes adaptive preferences (2) via historical agency.  

  3. **Mental States/Welfare**:  
     *Fails:* Violates non-subjective comparability (1) and announcement-robustness (5). Cannot justify written statements without perturbations. *Strengths:* Naturally explains expensive tastes (2) and adaptation (3), but relies on unobservables.  

  **Conclusion**: No family satisfies all NN requirements. Capabilities best handle needs and preferences but falter on baselines and cross-population comparability. Resources excel in objectivity but ignore differential conversion. Your statute’s coherence hinges on relaxing cross-population demands or accepting imperfect baseline anchoring.
