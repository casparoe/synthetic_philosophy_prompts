answer: |-
  Here is your teaching plan, structured as requested:

  **1. Dependency Map**  
  Start with the individual case: demonstrate how naive stepwise improvement (adding knowledge *then* reflection, or vice versa) produces divergent outcomes based on sequence. **After** the group feels this failure viscerally, introduce coherence as the necessary fix—a simultaneous optimization for knowledge, reflection, and self-modification, resolving conflicts via a fixed-point equilibrium. Only then layer on interpersonal extrapolation: show how merging individual CEVs requires resolving conflicts between agents’ fixed points, *not* merely aggregating pre-coherent preferences. The "who is in ‘we’?" question depends on this interpersonal step—it’s a boundary condition for the shared optimization, not an input. Finally, position CEV as a target for AI design, distinct from decision procedures.

  **2. The Carrying Example**  
  *Avoid your sequencing case.* It conflates temporal path-dependency with CEV’s timeless idealization. Use instead: **A devout pacifist learns advanced game theory.**  
  - *What it must contain:*  
    - Pre-reflection: "Never harm anyone, ever."  
    - Post-knowledge: "I’d endorse retaliatory threat in iterated Prisoner’s Dilemma to prevent exploitation."  
    - Post-reflection *without* new knowledge: Deepens pacifist conviction via moral introspection.  
  - *What it must lack:* A stable "better self" emerging from stepwise improvement. Neither order resolves the conflict; coherence requires synthesizing both moral commitment and strategic insight into a new stance (e.g., "Minimize harm via enforceable cooperation norms").  
  *Why it works:* Forces confrontation between incompatible self-conceptions that can’t be linearly "improved."

  **3. Misconception Ledger**  

  | Misconception | When It Surfaces | Defusing Move |
  |---------------|------------------|--------------|
  | "CEV is a decision procedure for us now." | During target-vs-procedure discussion. | Contrast: "CEV defines the *outcome* we’d want an AI to pursue; it doesn’t tell *humans* how to act today." |
  | "‘Intelligence’ absorbs all improvements." | When dissecting the carrying example. | Disaggregate: "CEV stacks distinct layers: knowledge (epistemic), reflection (cognitive), self-modelling (ontological), coherence (structural)—all under idealization." |
  | "‘Would want to be’ is just knowing more/better." | After interpersonal step. | Reframe: "It’s not epistemic—it’s counterfactual *self-transformation*. You might become someone who values differently, not just knows more." |
  | "CEV outputs a single ‘correct’ desire set." | During coherence/fixed-point discussion. | Clarify: "Coherence resolves conflicts; it doesn’t erase pluralism. Outputs can be complex preference-orderings over states." |
  | "Interpersonal CEV is aggregating individual outputs." | When introducing the "we" step. | Correct: "Individual CEVs are inputs to a *new* coherence operation across agents, negotiating conflicts in their extrapolated ideals." |

  **4. The One I Can’t Place**  
  The circularity worry is **a genuine hole**, not just a misconception. Concede it during the coherence deep-dive: *"To define 'the self you’d want to be,' CEV implicitly assumes a prior notion of 'better'—which risks presupposing the values it seeks to define."* Place this **after** establishing the fixed-point but **before** interpersonal extrapolation. Emphasize: This isn’t solved; it’s why CEV needs formalizing as a computational process (e.g., via reflective oracles) rather than philosophical analysis. The group should feel this tension.

  **5. The Check and the Refusals**  
  - **The Check (Final 10 mins):** *"Sketch CEV for a non-human agent (e.g., a highly rational elephant). What fails? What stays relevant?"* Forces them to isolate idealization mechanics from anthropocentrism.  
  - **Refusals:**  
    - **Openly decline:** Settling the precise boundary of "we."  
    - **Sentence:** *"That’s entangled with meta-ethical problems in collective agency—crucial, but beyond CEV’s core mechanics. For now, assume a given initial cohort."*  
    - **Also decline:** Resolving whether CEV outputs "moral truth." *"CEV is engineering, not ontology; it targets *our* extrapolated wishes, not platonic good."*

  **Key Constraint Handling:**  
  - **Interpersonal Step:** Slot it *after* individual coherence. Contrast: Individual coherence resolves conflicts *within* a mind; interpersonal resolves conflicts *between* minds that have *already undergone* individual extrapolation. The "who is in ‘we’?" question then becomes salient as a precondition for the latter operation.  
  - **No Readings/Citations:** Concepts standalone per your constraints.
