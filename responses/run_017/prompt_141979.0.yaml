     - No expression: The notion of "happening now" as opposed to "recorded" is not fundamental. In a system, an event is either in the log (durable) or in volatile state (which can be lost). But presentism doesn't have the past at all, so even the just-committed event is past? We might need to distinguish between events that are "in progress" (not even at the frontier) and the frontier events.

  b) **Truthmakers for tensed statements**: 
     - Statements about the past are made true by the present (e.g., present records or traces). 
     - Statements about the future are false or indeterminate.

     Translation:
     - Clean: A statement "event e occurred in the past" is true if and only if the current state (the frontier) has a causal history that includes e. The state is built from the log, which records past events. For the future, we have no truth value (or it is false) because no future events exist.
     - Distortion: In distributed systems, we often have a log that records past events, so the past is represented in the present state (the log). But for the future, we can have non-deterministic choices (branching runs). So we can have multiple possible futures, but none of them are real until they happen.
