  c) **Reality growth / passage of time**: 
     - Reality grows: The present moves forward, and new events come into existence.

     Translation:
     - Clean: The frontier advances as new events occur and are committed. The consistent cut (the present) grows by including new events at the frontier.
     - Distortion: In a distributed system, the log grows, but the past events are not annihilated; they are kept. In presentism, the past events cease to exist. So the log's durability is at odds with presentism.
     - No expression: The idea of events ceasing to exist has no counterpart because we keep the log.

  d) **Open future**: 
     - The future is open (not determined) until it becomes present.

     Translation:
     - Clean: Until an event is committed (durably logged), it is not fixed. We can have branching runs (multiple possible futures) that are consistent with the current cut.
     - Distortion: In distributed systems, we can model non-determinism with multiple possible extensions of the current log. But once an event is committed (by a quorum, for example), it is fixed. This matches the idea that the future becomes fixed as it becomes present.
     - No expression: The idea that the future is not real (does not exist) is captured by the fact that we don't have events from the future in our log.

  ### 2. Eternalism (Block Universe)
     - Past, present, and future all exist.

  #### Claims:
  a) **What exists?** All events in the entire history (past, present, future) exist.

     Translation:
     - Clean: The entire event log (from the beginning to the end) exists. This is like having a complete, fixed log that includes all events that will ever happen. There is no branching because the future is fixed.
     - Distortion: In distributed systems, we often design for non-determinism and multiple possible runs. But if we fix the entire log (as in a predetermined execution), then we have a single, fixed total order of events (like a total-order broadcast that has delivered all messages in a fixed order). 
