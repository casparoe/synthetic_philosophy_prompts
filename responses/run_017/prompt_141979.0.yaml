  ### **Your Candidate Translation: Present as Frontier of a Consistent Cut**  
  You proposed:  
  - **Present = frontier** of a committed consistent cut (maximal antichain).  
  - **Time passage = advance** of frontier via event commit.  

  #### **Diagnosis:**  
  - **Lands on Growing-Block Theory:**  
    - The frontier (present) and its causal past (log) exist. Future events are uncommitted (open). Advancement via commit matches growth.  
  - **Distorts Presentism:**  
    - Presentism requires *only* the frontier to exist, but the cut includes the entire past (log). Your model retains past events durably, contradicting presentism's annihilation of the past.  
  - **Distorts Eternalism:**  
    - Eternalism demands future events exist, but your frontier has no future events—only possibilities.  
  - **Quiet Substitution:**  
    - Vocabulary replaces "ontological present" with "latest committed antichain." This is operational, not metaphysical. Passage is commit progress, not "becoming."  

  #### **Where It Distorts and Why:**  
  - **Frontier as Present:** The frontier is already committed, so it's *durable* (past). True "present" (e.g., in-flight events) is before commitment, which isn't captured.  
  - **Advance as Passage:** "Advance" is node processing, not ontological change. The log exists extensionally; appending doesn't "create" existence.  
  - **Branching Runs:** Your model handles openness but reduces it to non-determinism, not ontological indeterminacy.  

