  ### **3. Growing-Block Theory (Possibilism)**  
  *Past and present exist; future does not. Reality grows as new events are added. Future is open.*

  #### **a) What exists simpliciter?**  
  - **Claim:** Past and present events exist; future events do not.  
  - **Translation:**  
    - **Clean:** The committed log (past) and frontier (present) exist. Future events are uncommitted possibilities (branching runs).  
    - **Distortion:** Logs are durable, so "past existence" aligns, but "present" is the frontier, which is already logged—blurring present/past.  
    - **Inexpressible:** No distinction between "present existence" and "durable storage"—logging an event makes it past.  

  #### **b) What makes tensed statements true?**  
  - **Claim:** Past statements true by existing events; present statements true by current events; future statements indeterminate.  
  - **Translation:**  
    - **Clean:** "e happened" true iff e in log; "e is happening" true iff e at frontier; "e will happen" true only after commitment.  
    - **Distortion:** "e is happening" requires e to be at the frontier, but frontier events are committed, so they are technically past.  
    - **Inexpressible:** "Happening now" as instantaneous—events are point-like, but commitment takes time.  

  #### **c) Does reality grow? Is time passage real?**  
  - **Claim:** Reality grows as new events are added; time passage is real.  
  - **Translation:**  
    - **Clean:** Log appends via quorum commits; the consistent cut advances. Branching runs prune as events commit.  
    - **Distortion:** Growth is append-only, matching well. But "passage" is the commit mechanism, which is computational, not metaphysical.  
    - **Inexpressible:** "Real growth" beyond log extension—e.g., why the block *can* grow.  

  #### **d) Is the future open?**  
  - **Claim:** Future is open (multiple possibilities); past/present are fixed.  
  - **Translation:**  
    - **Clean:** Branching runs for uncommitted events; commit (quorum) "actualizes" one branch. Past is immutable log.  
    - **Distortion:** Perfect fit for non-deterministic systems.  
    - **Inexpressible:** "Possibilities" as non-real—branching runs are modeled, so they "exist" as possibilities.  

