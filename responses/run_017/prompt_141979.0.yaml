  ### **2. Eternalism (Block Universe)**  
  *Past, present, and future events all exist simpliciter. Time passage is illusory; future is fixed.*

  #### **a) What exists simpliciter?**  
  - **Claim:** All events—past, present, future—exist. The universe is a static 4D block.  
  - **Translation:**  
    - **Clean:** The entire event history is a fixed, linearized log (e.g., total-order broadcast sequence). All events are committed; no branching runs (deterministic system).  
    - **Distortion:** Requires a *complete* log from initialization to termination. Real systems build logs incrementally, so completeness is retrospective.  
    - **Inexpressible:** "Future events exist now" conflicts with append-only growth. Systems lack precommitted future events.  

  #### **b) What makes tensed statements true?**  
  - **Claim:** Tensed statements are true based on the speaker's temporal location. "e is past" is true iff e is before the speaker's event in the global order.  
  - **Translation:**  
    - **Clean:** A node's local clock defines "now." "e is past" iff e happens-before the node's current event; "e is future" iff current event happens-before e.  
    - **Distortion:** Requires a global total order (e.g., linearizable clock). Without it, happened-before is partial, making "past/future" relative and non-global.  
    - **Inexpressible:** "Speaker's location" is extrinsic—nodes aren't "in" the log; they process it.  

  #### **c) Does reality grow? Is time passage real?**  
  - **Claim:** Reality does not grow; time passage is subjective. Events are equally real.  
  - **Translation:**  
    - **Clean:** Log is static; nodes traverse it. "Passage" is a node updating its state to a later event in the fixed log (e.g., moving a cursor).  
    - **Distortion:** Logs are built incrementally, implying growth. Eternalism treats the log as preexisting, but systems construct it over time.  
    - **Inexpressible:** "Subjective passage"—nodes process events, but this is computational, not ontological.  

  #### **d) Is the future open?**  
  - **Claim:** Future is fixed; no openness.  
  - **Translation:**  
    - **Clean:** No branching runs; a single, committed total order. Future events are in the log, just not yet processed.  
    - **Distortion:** Matches deterministic systems, but non-determinism (e.g., consensus protocols) allows branching, undermining fixity.  
    - **Inexpressible:** "Fixity without commitment"—future events "exist" but aren't in the log yet.  

