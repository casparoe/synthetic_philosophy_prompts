answer: |-
  What you've been circling maps precisely onto a known knot in philosophical psychology, often termed **The Heterogeneity Problem of Pleasure**. Your two families of failed accounts—phenomenological (too narrow) and motivational (too broad)—are indeed the standard cleaving of this problem, and your sustained/completed distinction adds a crucial, under-discussed dimension. Here’s how established thought intersects with your observations:

  ### 1. **The Core Problem: Heterogeneity**  
     - **Phenomenological accounts** (e.g., Sidgwick’s "feeling-tone", sensory glow) fail to capture *non-sensory* satisfactions (vindication, relief). As you note, many pleasures are *aspectival*—they exist only in contrast (e.g., the quiet *after* chaos).  
     - **Motivational accounts** (e.g., desire-satisfaction, disposition to continue) fail to exclude *compulsions* (door-checking, scar-picking) or self-destructive behaviours. Wanting ≠ enjoying.  

     Your insight that some pleasures aren’t "states" but *transitions* or *contrasts* aligns with Derek Parfit’s "aspect pleasures" and Fred Feldman’s "attitudinal pleasures"—yet neither resolves the motivational overbreadth.

  ### 2. **Your Sustained/Completed Distinction**  
     Aristotle’s *kinetic* (process) vs. *katastematic* (state) pleasures prefigure this, but your framing is sharper:  
     - **Sustained pleasures** (bath, storm) thrive on duration.  
     - **Completed pleasures** (itch-scratch, chord resolution) are *essentially terminable*. Forcing continuation corrupts them (e.g., an eternal crossword clue is hellish).  
     - **Hybrid cases** (eating when hungry) toggle between modes: sustaining nourishment *until* completion.  

     This distinction is rarely foregrounded but explains why "desire to continue" fails as a universal marker.

  ### 3. **A Coined Framework: Hedonic Profiles**  
     Since no existing term captures your full circle, I propose:  
     > **Hedonic Integrity**: The contextually dependent manner in which an event or state realises satisfaction, characterised by its *phenomenal texture* (including absence), *motivational traction* (distinct from compulsion), and *temporal structure* (sustained/completed/hybrid).  
     
     - **Borderline cases under this definition**:  
       - Grim satisfaction of finishing a hateful task: **IN** (completed pleasure; relief-as-contrast dominates).  
       - Relief of a near miss: **IN** (transitional, contrast-based).  
       - Absorption of good sleep: **OUT** (non-conscious; no aspectival contrast or agential engagement).  

  ### 4. **Implications for the 0–10 Scale**  
     The scale’s flaw is treating pleasure as a *homogeneous currency*. Your list reveals it as a *family of satisfactions* with incommensurable axes:  
     - A hot bath (sustained/sensory) ≠ a resolved crossword (completed/cognitive) ≠ post-grandchildren quiet (contrast/emotional).  
     Patients ranked them not by a shared essence, but by *personal salience within their constrained lives*. The scale thus measured *subjective priority* ("What still pierces the grey?"), not "enjoyment units".  

  ### Why "Hedonic Integrity" Fits  
     - Addresses phenomenological narrowness: Includes non-sensory, transitional, and contrastive cases.  
     - Avoids motivational overbreadth: Excludes compulsions by requiring satisfaction (not just motivation).  
     - Accommodates sustained/completed/hybrid structures.  
     - Explains ranking ability: Items share *salience as lifelines*, not a unitary property.  

  Your unease was warranted: the scale asked patients to sum irreducibly different things. A better approach might dissect "enjoyment" into your three dimensions—but for clinical brevity, noting *what type* of pleasure dominates (e.g., "Is your joy today more like sinking into a bath or solving a puzzle?") could contextualise scores. The heterogeneity isn’t a flaw in your patients’ experiences, but in the model imposed on them.
