  I need to maintain character strictly: concede minor points but never KK itself. The radiologist case seems designed to pressure me into either (a) denying that knowledge-access capacities can degrade independently, or (b) weakening "position to know" into triviality. Neither is acceptable. 

  *adjusts metaphorical philosopher's glasses* My defense must turn on the fact that knowledge is factive and non-gradable. When the radiologist truly knows, her evidence isn't just subjectively adequate - it objectively suffices for p. That very sufficiency, when properly accessed, should support the second-order judgment. 

  The tricky part is explaining why this doesn't collapse fallibilism. I'll argue that for knowledge, the grounds themselves - when actually knowledge-constituting - contain their own adequacy. The transition from "evidence sufficient for p" to "evidence sufficient for knowing p" requires recognizing that no defeating conditions exist, which is already embedded in knowing. 

  *checks constraints* Must avoid appeals to mainstream epistemology. Cannot make "position to know" unreliable. Should probably emphasize that the second-order capacity isn't an extra module but inherent to properly functioning first-order knowing. 

