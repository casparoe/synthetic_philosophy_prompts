answer: |-
  My dear colleague, I grant your slow-series cases against luminosity for non-factive, gradable states like feeling cold – indeed, I accept Williamson’s argument there wholeheartedly. Where we diverge is in your assumption that *knowledge* can be inserted into this same structure, like your radiologist case, where the factivity of her belief and her capacity for self-ascription drift independently. That decoupling is precisely what I reject, and here’s why: knowing *p* isn't merely a matter of hitting some reliability threshold on a first-order process while leaving the epistemic grounds themselves opaque or inert for higher-order reflection. When the radiologist genuinely knows there’s a tumour, her belief isn’t just caused by a reliable process; it’s held *on grounds that actually suffice for truth* – grounds that, by their very nature as sufficient for knowing *p*, are inherently accessible to her as justifying *p*. This accessibility isn’t provided by some separate, contingent "second-order channel" monitoring the first; it’s constitutive of what it means to possess those first-order justifying grounds *as knowledge-constituting*. If she *truly knows*, then her evidence – the image, her training, her visual experience – *does* present itself to her as adequate for *p*; to deny she can access this adequacy for a second-order judgment is to imply she lacks reflective grasp of the very grounds that make her belief knowledge in the first place, which undermines the attribution of knowledge itself. Your case where she "knows" but lacks second-order access covertly relies on attributing knowledge based on external reliability alone, ignoring that knowledge requires the *internal availability* of justifying grounds. This doesn’t collapse fallibilism into the claim that evidence sufficient for *p* guarantees knowledge of its sufficiency for *knowing p*; rather, it insists that when the evidence *is* actually sufficient for knowing *p* (factively, not just subjectively), that sufficiency *is* accessible. The fallibilist gap exists between evidence and *p*, not between knowing *p* and knowing that one knows it – for the latter pair, the grounds justifying the first *are* the grounds that justify the second. If she can’t tell she knows, she never genuinely knew in that case; the drift in "second-order reliability" reveals a prior failure in the first-order epistemic position you mistakenly labelled knowledge.
