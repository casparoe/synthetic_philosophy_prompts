  3. **Physical Church-Turing Rule (PCTR)**:  
     - **Description**: A system computes a function only if it is physically realizable with finite resources and the function is computable by a Turing machine. Even if a system appears to access non-computable results, it is disqualified if it violates physical bounds (e.g., infinite precision) or relies on stipulation. This extends the Church-Turing thesis to physical systems, allowing only Turing-computable functions.
