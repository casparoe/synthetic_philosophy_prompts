  1. **Bounded Resource Rule (BRR)**:  
     - **Description**: A system computes a function only if it uses bounded physical resources (time, space, energy, precision) and produces a verifiable output in bounded time. Unbounded resources (e.g., infinite time, speed, or precision) disqualify it, as they make the system non-physical. Stipulation of non-computable inputs is invalid, and outputs must be accessible with finite precision.
