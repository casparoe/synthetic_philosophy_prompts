  2. **Effective Verification Rule (EVR)**:  
     - **Description**: A system computes a function only if it implements an effective procedure (algorithm) that halts and produces a verifiable output in bounded time. The output must be confirmable without indefinite waiting or uncomputable verification. Systems that run indefinitely or produce outputs that cannot be reliably checked (e.g., due to convergence without a bound) are invalid.
