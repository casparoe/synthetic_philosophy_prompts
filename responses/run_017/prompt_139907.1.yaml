prompt: |-
  I am a novelist, and for the past two years I have been at work on a book whose narrator is a retired biographer — a man who has spent his professional life writing the lives of other people and who is asked, late in the book, to write his own. That has forced me to read biography as a craft rather than as a reader, and, on a friend's suggestion, to spend the evenings with a secondhand single-volume selection from Plutarch's *Lives*. It has no apparatus and no notes, and at my desk I have no way of chasing anything up, so I am after the shape of the thought rather than anybody's scholarship, and I would rather you argued the case than pointed me to a literature. What stopped me was Plutarch's programme near the opening of the *Life of Alexander*: "For it is not Histories that I am writing, but Lives; and in the most illustrious deeds there is not always a manifestation of virtue or vice, nay, a slight thing like a phrase or a jest often makes a greater revelation of character than battles where thousands fall, or the greatest armaments, or sieges of cities." He goes on to compare himself to a painter who takes a likeness from the face and the expression of the eyes and makes little account of the rest of the body. I find that I believe it and cannot say what it commits me to, because when I hold it against actual biographical material my verdicts refuse to line up.

  So here are the verdicts, as nearly as I can report them honestly. (1) Alexander cutting the Gordian knot instructs me about him, though it is a deliberate public act, staged for an audience. (2) Caesar weeping before a statue of Alexander, at an age by which Alexander had already conquered, instructs me greatly — and yet I discount it, because the story is too neatly shaped to have survived unshaped. (3) Alexander's famous restraint toward the captured women of Darius's household instructs me much less, although it is a better act, because it is precisely the story a court would circulate. (4) A single reported rudeness to a servant damns a subject almost irreversibly; a hundred reported courtesies do not begin to exculpate him. In an early draft I had a man pause to return a dropped glove to a child on his way to commit a murder, and readers took it as evidence of the good in him; I cut it as counterfeit. I kept a scene in which the same man wastes four minutes deciding whether to tell a trivial lie, and I think it is the truest thing in the book. (5) A great public achievement tells me almost nothing; a great public crime, or a great collapse, tells me a great deal. (6) Last words and deathbed declarations I discount almost entirely, except when they are flat and unflattering — an instruction about an estate moves me more than a benediction. (7) Where the biographer writes "some say," the flattering anecdote loses all its force for me and the discreditable one keeps most of its own, which I know is inconsistent with my usual suspicion of hearsay. (8) A childhood anecdote placed so as to prefigure an entire career — the boy who tames the horse, the man who rules the world — strikes me as a trick; the same anecdote, if the subject himself is reported to have remembered it, strikes me as evidence, though I cannot say why. (9) A subject's own polished memoir tells me less than others' anecdotes about him; notes written for no reader at all tell me more than either; and yet a person's deliberate, decades-long, self-conscious labour at a virtue he finds hard — a ledger kept of one's own faults — tells me a very great deal, even though it is composed from end to end.

  The rule I have been working with is something like: a detail is morally instructive in proportion to the subject's failure of authorship over it — the revealing thing is the thing he did not compose. It handles (6), the glove, and part of (9); it says nothing at all about the asymmetry in (4) or the one in (5); and it is flatly contradicted by (1) and by the last clause of (9). What I want is a principle, or a standing pair of principles, that does better: stated precisely enough to be applied, with each clause tied to the case that motivates it, an honest account of which of my verdicts it cannot save and which it overturns, and verdicts on three cases I have not been able to settle — a politician's leaked private remark against forty years of his public voting record; the blameless life that furnishes a biographer with no anecdotes at all, where I cannot tell whether the method is simply blind or whether the absence is itself the verdict; and a life written by its subject's enemy. Tell me also whether Plutarch's painter helps here or quietly misleads me. Please keep the whole answer under six hundred words.
reasoning: |-
  Okay, the user is a novelist working on a book about a retired biographer. They've been reading Plutarch and are grappling with how biographical details reveal character. They've listed several verdicts based on their observations and want a coherent principle that explains these judgments without relying on academic sources. 

  Hmm, the core tension here is between consciously performed actions and unconscious revelations. The user intuitively trusts details that escape the subject's control (slips, private moments) but struggles with inconsistencies—like why Alexander's staged Gordian Knot moment feels revealing despite being performative. 

  Ah! The key might be distinguishing between two layers: performance (what the subject intends to show) and leakage (what they can't suppress). This explains verdicts like #4 (rudeness damns more than courtesy exculpates) because discourtesy often leaks real contempt, while courtesy can be performative. Similarly, #7 ("some say" discreditable anecdotes retain power) because negative leaks feel truer than polished positives. 

  For their unresolved cases: The politician's leaked remark outweighs voting records because it's leakage; the blameless life's void *is* evidence of rigid control (verdict #2); an enemy's biography requires discounting the malice but watching for involuntary details they unintentionally preserve. 

  Plutarch's painter analogy holds if we see the "face" as leakage—but overemphasizing it risks ignoring how performances also shape character (hence Gordian Knot matters as chosen theater). 

  The user's draft glove scene failed because it felt like sentimental performance; the lie debate worked because it revealed uncontrolled hesitation. Their principle should honor both leakage *and* consequential performances, but weight leakage heavier. 

  ...And I must stay under 600 words. Prioritize clarity: state the twin principles upfront, map to verdicts briskly, resolve new cases concisely. No tangents about historicity—focus on character revelation as craft.
answer: |-
  Your verdicts reveal two distinct principles of character revelation:

  1.  **Involuntary Leakage:** Details escaping conscious control (slips, habits, unguarded moments) carry maximal weight. They reveal the unvarnished self beneath performance.
  2.  **Consequential Performance:** Deliberate acts gain significance *only* when they are defining choices demanding sustained effort, revealing core struggle, or shaping destiny irrevocably.

  **How it handles your verdicts:**
  *   **(1) Gordian Knot:** A *Consequential Performance* – a defining, destiny-shaping act of will and problem-solving method. Instructive because it *is* authorship, but authorship with monumental stakes.
  *   **(2) Caesar Weeping:** Largely discounted because it's likely shaped narrative (performance without consequence), lacking leakage.
  *   **(3) Restraint w/ Women:** Discounted – likely *Performance* for reputation, not revealing leakage or deep struggle.
  *   **(4) Rudeness vs. Courtesy:** Asymmetry explained: Rudeness is potent *Leakage* (uncontrolled contempt). Courtesy is weak *Performance* (easily feigned). The lie debate is pure *Leakage*.
  *   **(5) Achievement vs. Crime/Collapse:** Achievement is often curated *Performance*. Crime/collapse frequently involves catastrophic *Leakage* (uncontrolled vice, weakness) or *Consequential Performance* revealing true nature under pressure.
  *   **(6) Last Words:** Discounted – usually rehearsed *Performance*. Flat instructions are weak *Leakage* of mundane concerns.
  *   **(7) "Some say":** Flattering anecdote (weak *Performance*) loses force. Discreditable anecdote retains weight as potential *Leakage* (harder to invent convincingly).
  *   **(8) Childhood Anecdote:** As prefiguring trick: Authorial shaping (*Performance*). If subject remembered: Becomes *Leakage* of their self-mythology or formative memory.
  *   **(9) Memoir vs. Notes vs. Ledger:** Polished memoir = *Performance*. Private notes = *Leakage*. Fault-ledger = *Consequential Performance* – a lifelong, arduous act of will revealing struggle and priority.

  **What it cannot save/overturns:**
  *   **Saves:** (1) via Consequential Performance. (9)'s ledger clause via Consequential Performance.
  *   **Overturns:** None fundamentally; reframes them. Your initial "failure of authorship" rule captured Leakage well but missed Consequential Performance's power.

  **Your unresolved cases:**
  1.  **Politician's Leak vs. Voting Record:** The leaked remark is powerful *Leakage* (involuntary contempt/bias). The voting record is *Performance* (conscious political positioning). Leakage usually trumps Performance for raw character.
  2.  **Blameless Life, No Anecdotes:** The *absence* of Leakage *is* the verdict. It suggests extreme control (*Performance* as constant discipline) or profound emptiness. The method isn't blind; the void signifies.
  3.  **Life by an Enemy:** Distrust the framing (*Performance* by the biographer). Scrutinize preserved *Leakage* (involuntary details the enemy couldn't distort or didn't recognize as damning) and verifiable *Consequential Performances*. Discount their interpretations of motive.

  **Plutarch's Painter:** It helps by emphasizing the revelatory fragment over the grand tableau (Leakage over mere Performance). But it *misleads* slightly by implying only the small detail matters. Plutarch himself includes defining acts (Consequential Performances). Your twin principles encompass both his focus on the revealing detail *and* the significant act.

  **In essence:** Character is revealed most vividly in what leaks out uncontrolled (*Leakage*) and in the acts that truly define or cost the self (*Consequential Performance*). All else—polished deeds, convenient anecdotes, curated images—is suspect Performance. Your biographer-narrator must become an archaeologist of the involuntary and an analyst of the truly defining choice.
