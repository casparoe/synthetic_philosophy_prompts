prompt: |-
  So I got voluntold to run Friday's methods hour in my lab — 45 minutes, maybe twelve people, mostly computational but a few wet-lab folks, all of whom say "Bayesian" to mean "we put a prior on a parameter and updated it" and most of whom have personally written down a likelihood at some point. Topic I picked is the problem of old evidence: the argument that if you already knew E with certainty before a new theory came along, then Bayes' rule can't let E confirm that theory, because P(E) is 1 and the posterior just collapses back onto the prior. Don't explain it to me — I need a plan for how I explain it to them, and I think the order matters more than anything else here.

  What I want from you:

  - What has to be on the table before the problem even looks like a problem. I suspect it's something about the difference between the theory entailing E and my having learned that it entails E, but tell me where in the sequence that belongs and what has to come before it.
  - One carrying example. I don't want the perihelion-of-Mercury chestnut with this crowd; I want something from their own work. We have a result that's been sitting in our own data for about six years, everyone in the field already believes it, nobody has had a mechanism for it — and we also have a rival model that was fitted to that same result after the fact. Tell me which of those two cases to build the whole thing on, and what the example has to have and has to lack in order to do the work. I think one requirement is that the new hypothesis wasn't built to fit the evidence, and another is that the old theory doesn't entail it, but I'm not sure either is quite right.
  - The misconceptions, in the order they'll actually raise them. The ones I'm braced for: "just pretend you forgot the evidence and put a number on it"; "the real fix is that prediction beats accommodation, so all this shows is that accommodation doesn't confirm" (which I think is a dodge rather than a solution?); "our priors already had it baked in, so nothing is lost"; "we'd just compare Bayes factors". Where in the sequence do I head each one off, and is there one I should let them say out loud first because it sets up the next move?
  - What the two live candidate fixes actually are and how much of each to give at this level. One of them, as I understand it, updates on the fact that the theory implies the evidence rather than on the evidence itself; the other is some kind of counterfactual "what would you have assigned before you knew it". Which do I lead with for this crowd, which do I name and drop, and what do I flat out refuse to derive in 45 minutes.
  - One question for the end that tells me whether they actually got it rather than just nodded — ideally something they'd answer differently if they're still stuck on "unlearn the evidence".

  Constraints: nothing on a slide worse than a fraction, and please don't hand me a reading list, nobody will read it. Also assume half of them are checking email and one person is going to try to turn this into a discussion about p-values if I give him an opening.
reasoning: |-
  We are going to present the problem of old evidence in a 45-minute methods hour to a mixed computational and wet-lab audience. The goal is to make the problem clear, use a relevant example, address common misconceptions, and briefly touch on candidate solutions without getting too technical.

  ### Overall Structure:

  1. **Set up the problem** (10 minutes)
  2. **Present the example** (10 minutes)
  3. **Address misconceptions** (15 minutes)
  4. **Discuss candidate solutions** (8 minutes)
  5. **Wrap-up with a diagnostic question** (2 minutes)

  ---

  ### 1. Setting Up the Problem (10 minutes)

  **Goal:** Make sure everyone understands the basic Bayesian update and why old evidence poses a problem.

  **Steps:**
  - Remind them of Bayes' theorem:  
    \( P(T|E) = \frac{P(E|T) \cdot P(T)}{P(E)} \)
  - If we already know E (so P(E) = 1), then:
    - \( P(E|T) \) is the likelihood of E given the theory T. If T entails E, then P(E|T) = 1.
    - Plugging in: \( P(T|E) = \frac{1 \cdot P(T)}{1} = P(T) \)
    - So the posterior equals the prior. No confirmation.

  **Why is this a problem?**
  - Intuitively, we think that when a new theory explains an old, established fact (especially one that was puzzling), that should count in favor of the theory. Example: general relativity explaining the precession of Mercury.

  **Key Insight to Set Up:**
  - The problem arises because we are updating on E, but E is already known (so P(E)=1). However, note that the theory T might have been developed after E was known. The issue is not just that E is old, but that we are certain of E.

  **What has to be on the table?**
  - We must emphasize the difference between:
    - The logical fact: T entails E.
    - Our knowledge: We have learned that T entails E (which might happen after we already know E).
  - The problem is that at the time we are evaluating T, we already have E in our background knowledge, so P(E) = 1.

  **Order:**
  1. State Bayes' theorem.
  2. Show the update when P(E)=1 and P(E|T)=1 → posterior = prior.
  3. Acknowledge the intuition: but wait, doesn't explaining old evidence count for something?
  4. Introduce the distinction: The logical entailment (T implies E) might be a new discovery even if E is old.

  ---

  ### 2. The Carrying Example (10 minutes)

  **Your lab's context:** You have a result (let's call it E) that has been in your data for six years. Everyone in the field believes it, but there was no mechanism. Now, a new theory T comes along that explains E. However, note that there is also a rival model (say T') that was fitted to E after the fact.

  **Which case to build on?**
  - Build the example on the **new theory T that was not built to fit E** (so it's a genuine explanation) versus the rival model T' that was explicitly fitted to E (so it's accommodation).

  **Requirements for the example:**
  - E is old and well-established (so P(E)=1 in the current knowledge state).
  - T was not built with E in mind (so it's a novel explanation, not accommodation). This is important to avoid the "prediction vs. accommodation" dodge.
  - T entails E (so P(E|T)=1) and we have just learned that T entails E.
  - The rival model T' was built to fit E (so it's an accommodation). We might use T' to contrast why we feel T should be confirmed by E but T' should not (or less so) even though both entail E.

  **Example Sketch:**
  > "In our field, we've known for six years that [describe E briefly, e.g., 'gene X is upregulated in condition Y']. We all believe it, but we didn't know why. Last year, a new theory T was proposed for an entirely different reason. We then realized that T actually implies E. Meanwhile, another group came up with model T' that was explicitly designed to fit E. Intuitively, we feel that E should confirm T but not so much T'. But according to Bayes, since we already know E, neither gets a boost. That's the problem."

  **Why this example?**
  - It's from their world.
  - It separates the genuine explanation (T) from accommodation (T').
  - It sets up the intuition that T should be confirmed by E.

  ---

  ### 3. Addressing Misconceptions (15 minutes)

  **Order of addressing:**
  1. **"Just pretend you forgot the evidence and put a number on it."**  
     - This is the first one to address because it's the most common and sets the stage for the others.  
     - Why it doesn't work: Forgetting E is not a rational move. We cannot actually forget, and even if we could, we might assign a different probability to E now than we would have in the past because of other knowledge we've gained. Also, it's subjective and not grounded in our actual epistemic state.

  2. **"Our priors already had it baked in, so nothing is lost."**  
     - This is a misunderstanding of the problem. The issue isn't that we haven't updated on E (we did, long ago), but that when we learn that T explains E, we feel we should update again. But the Bayesian update on E has already happened. The problem is that the logical relation between T and E is new information.

  3. **"We'd just compare Bayes factors."**  
     - The Bayes factor for E between T and an alternative (say T') is P(E|T)/P(E|T'). But if P(E)=1, then P(E|T)=1 and P(E|T')=1 (if both entail E) so the Bayes factor is 1. That doesn't help.

  4. **"The real fix is that prediction beats accommodation, so all this shows is that accommodation doesn't confirm."**  
     - This is a dodge. The problem is not just about accommodation. In our example, T was not built to accommodate E (it was a novel explanation) but we still cannot update on E because it's old. The problem applies even to a theory that genuinely explains old evidence without being built for it.

  **Order in the Session:**
  - After presenting the example, ask: "How might we try to get around this?" 
  - Let them volunteer the first misconception (they might say "pretend you forgot"). 
  - Then, address that one. 
  - Then, bring up the next ones in the order above, or as they come up. 
  - The "prediction vs. accommodation" point should be addressed last because it's a common dodge and we need to show that the problem is deeper.

  ---

  ### 4. Candidate Solutions (8 minutes)

  **Two main approaches:**
  1. **Update on the logical truth:** Instead of updating on E, update on the fact that T entails E. This is the approach by Garber (1983). 
     - We learn the proposition L: "T logically implies E". 
     - Then we update: P_new(T) = P_old(T | L)
     - But note: in the old probability, L might not be known. However, computing P_old(L) and P_old(T|L) can be tricky because we might have already known E and that might affect our beliefs about L.

  2. **Counterfactual approach:** Consider what our degree of belief in E would have been if we didn't know E (but knew everything else). This is the approach by Howson (1991). 
     - We use a counterfactual probability: P*(E) and P*(E|T) in a state where we don't know E. 
     - Then we do a Bayesian update in that counterfactual state.

  **Which to lead with?**
  - For this crowd, lead with the **counterfactual approach** because it's more intuitive. 
     - "What would we have thought about E before we knew it? If the theory T would have made E more likely then, then learning E would have confirmed T. And even though we now know E, we can still say that T would have been confirmed had we not known E."
  - Then briefly mention the logical update approach: 
     - "Another way is to update on the new fact that T implies E. That is, we learn a logical relationship we didn't know before."

  **What to avoid deriving:**
  - Do not derive the details of how to compute P_old(T | L) because it involves assigning probabilities to logical statements and that's complex. 
  - Similarly, the counterfactual approach requires specifying a counterfactual knowledge state, which is also tricky. 
  - Just state the ideas and note that both have technical challenges.

  **Emphasize:** The problem is still open and these are candidate solutions, not settled.

  ---

  ### 5. Diagnostic Question (2 minutes)

  **Question:**
  > "Suppose we have a theory T that we just discovered implies an old evidence E. We want to know if E confirms T. We consider two approaches: 
  > (A) We try to forget E and then ask what we would have assigned to P(E) and P(E|T). 
  > (B) We update on the new information that T implies E. 
  > Which of these approaches is the counterfactual solution and which is the logical update solution? 
  > And what is the main criticism of approach (A)?"

  **Why this question?**
  - It checks if they can distinguish the two candidate solutions.
  - It also checks if they remember the criticism of the "forget E" approach (which is that we cannot actually forget and our counterfactual assignment might be arbitrary or influenced by current knowledge).

  **Expected answer:**
  - (A) is the counterfactual solution (or at least one version of it) and (B) is the logical update. 
  - Criticism of (A): We cannot truly forget E, and even if we try, our counterfactual probability for E might not be what we would have actually assigned in the past because our background knowledge has changed.

  ---

  ### Handling Distractions

  - **The p-values person:** If someone tries to turn it into a p-values discussion, politely but firmly say: "That's an important topic, but today we're focusing on the Bayesian framework. Let's discuss p-values another time."
  - **Email checkers:** Keep the session interactive. Ask questions, use the example from their lab, and call on people by name if needed.

  ### Visual Aid

  - Only one slide with Bayes' theorem and the update when P(E)=1 and P(E|T)=1. 
  - Then a slide with the example. 
  - Then a slide listing the misconceptions and one for candidate solutions (with just names and one-sentence descriptions).

  ---
answer: |-
  Here's a step-by-step plan optimized for your constraints, using your lab's context to make it sticky. The sequence is designed to surface the core paradox quickly while preempting distractions.

  ---

  ### **1. Setup: What Must Be On the Table First (5 min)**  
  **Start here:**  
  - **Bayes' Rule Reminder:**  
    \( P(T|E) = \frac{P(E|T) \cdot P(T)}{P(E)} \)  
    *(No slides — have them shout out what each term represents. Anchors it in their reality.)*  
  - **Crucial Preliminaries (Order Matters!):**  
    1. **"Old Evidence" Definition:** E is *known with certainty* (P(E) = 1).  
       - *Example:* "Think of a result in our field everyone accepts, like [mention your lab's 6-year-old result]. We’d bet our house on it."  
    2. **New Theory T:** Proposed *after* E was established.  
    3. **T Entails E:** T logically implies E (P(E|T) = 1).  
  - **The Collapse:**  
    If P(E) = 1 and P(E|T) = 1, then \( P(T|E) = P(T) \). **No confirmation.**  

  **Why this order?**  
  You must establish *certainty of E* and *logical entailment* **before** introducing the conflict. If you jump to "T entails E" too early, they’ll miss why P(E)=1 breaks things.

  ---

  ### **2. Your Lab's Carrying Example (10 min)**  
  **Use the Rival Model Scenario:**  
  - **The Old Evidence (E):** Pick your lab’s established 6-year-old result (e.g., "Protein X always degrades under condition Y"). Stress: *Everyone believes this. No mechanism existed.*  
  - **Theory T (The "Good" Explanation):** A new mechanistic model *not* designed for E (e.g., "We built T for a different pathway, and *later realized* it predicts E").  
  - **Theory T' (The "Bad" Explanation):** A model explicitly fitted to E after the fact (e.g., "We added a fudge factor to an old model to force-fit E").  

  **Why This Works:**  
  - T feels like it *should* gain credibility for explaining E. T' feels like cheating.  
  - **Critical Features:**  
    - T **wasn’t built for E** → sidesteps "prediction vs. accommodation" distractions early.  
    - T **entails E** → but you only *learned this after* developing T.  
    - E **lacked a mechanism** → creates intuitive unease with Bayes' collapse.  

  **Pose the Paradox:**  
  "T *explains* E better than T' does, but Bayes says neither gets credit because E is old. Does that feel right?" *(Let them stew — this primes the problem.)*  

  ---

  ### **3. Misconceptions: Order & How to Head Them Off (15 min)**  
  **Anticipated Sequence & Deflection Strategy:**  

  | Misconception | When It’ll Arise | How to Head It Off |  
  |---------------|------------------|---------------------|  
  | **"Just unlearn E!"** | Immediately after the collapse is shown. | **Let 1-2 people say it**, then: *"But can you truly forget E? If I ask you to assign P(E) ‘as if’ you didn’t know it, isn’t that arbitrary? What stops you from making up numbers?"* → Highlight subjectivity. |  
  | **"Accommodation doesn’t confirm anyway!"** | When discussing T vs. T'. | **Preempt by example design:** T isn’t accommodation! Stress: *"T didn’t know about E — it’s a surprise fit. Shouldn’t that be rewarded?"* → Concede prediction is stronger but irrelevant here. |  
  | **"Priors already baked in E!"** | When frustration peaks. | **Flip it:** *"If your old priors had E ‘baked in’, then T explaining E shouldn’t change anything. But intuitively, it does — we feel T is *better* because it explains E mechanistically."* → This reveals the core issue: *learning that T entails E* is new info. |  
  | **"Bayes factors fix this!"** | When discussing T vs. T'. | **Nuke fast:** *"BF = P(E\|T)/P(E\|¬T). But if P(E)=1, P(E\|¬T)=1 too (E is true!), so BF=1. No discrimination."* → Write the fraction, then cross it out. |  

  **Key:** Let the "unlearn E" idea surface first — it sets up why we need principled fixes.

  ---

  ### **4. Candidate Fixes: The Minimalist Version (10 min)**  
  **Focus on ONE —** Lead with **counterfactual probability** (intuitive for scientists). Briefly name-drop the other.  

  - **Fix 1: Counterfactual Probability (Howson/Urbach)**  
    - *Idea:* "What *would* P(E) have been *before* we knew E?"  
    - *Use your example:* "Before we knew E (degradation of Protein X), what would we have assigned to P(E)? Maybe 0.4? And P(E|T) would be 0.9? Then Bayes would boost T."  
    - *Weakness:* "But it’s counterfactual — we’re guessing about a past we never saw."  
    - *Why lead with this?* Scientists already proposed "unlearn E!" — this formalizes it.  

  - **Fix 2: Update on Logical Discovery (Garber)** → **Name-Drop Only**  
    - *Idea:* Update on *"T entails E"* (call this fact L), not E itself.  
    - *Formula:* \( P_{\text{new}}(T) = P_{\text{old}}(T | L) \)  
    - *One sentence:* "We’re shocked that T implies E — *that’s* the new evidence."  
    - *Refuse to derive:* Do **not** explain how to compute P(T|L) — it requires probabilities over logical truths (nightmare fuel).  

  **Skip entirely:** Jeffrey conditioning, non-Bayesian fixes.  

  ---

  ### **5. Diagnostic Closing Question (5 min)**  
  **Ask:**  
  > *"We discover a new theory T that explains our 6-year-old result E. We compute two things:*  
  > *(A) What we would’ve assigned to P(E) before we knew E.*  
  > *(B) The probability that T entails E.*  
  > *Which fix uses (A)? Which uses (B)?"*  

  **Why it works:**  
  - If they answer **"(A) = counterfactual, (B) = logical"** → they got it.  
  - If they conflate (B) with P(E|T) or say "both use (A)" → they’re stuck on unlearning.  
  - **Watch for:** Anyone arguing "but (B) is meaningless" — that’s the p-values person seizing an opening. Shut it down with: "We’re quantifying logical uncertainty — talk to me after."  

  ---

  ### **Tactics for Distractions**  
  - **Email checkers:** Pose the example as a war story ("Remember when we saw X in the data?").  
  - **p-values person:** If they derail, say: "P-values judge misfit; here we judge *explanatory gain*. Different question." Then move on.  
  - **Slides:** Only two.  
    1. Bayes’ rule (with the collapse when P(E)=1 highlighted).  
    2. Your lab’s example (T vs. T', E, dates).  

  **Time Check:** Stick to 5-min blocks. If you run over, skip deriving Bayes’ collapse — just assert it.  

  This sequence forces the paradox using their work, exposes the "unlearn E" dodge quickly, and leaves them with a clear (if uneasy) sense of why old evidence is philosophically spicy.
