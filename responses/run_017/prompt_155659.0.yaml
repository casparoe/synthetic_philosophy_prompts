prompt: |-
  I help out on a community dig most summers and read site reports for fun, and there's a pattern I keep bumping into that I can't find a word for. Whenever they turn up something whose use nobody can work out — a pit of carefully stacked cattle skulls, a bronze axe far too thin ever to have cut anything, a figurine with no wear marks anywhere — the report files it under 'ritual' or 'ceremonial'. So the label for 'we don't know what this was for' and the label for 'these people had religious institutions' are the same label. And then it gets used as evidence: the more unexplained stuff turns up, the more settled the religion at that site looks, so confidence in the institution grows in step with the ignorance that produced it. There's a second half that strikes me as worse. The objects we *can* explain — querns, spindle whorls, blades with edge damage — never get counted as religious even when they come out of the same pit, so religion gets built almost entirely out of the material we understand least, and a culture whose stuff we happen to find legible gets written down as a secular one.

  My mate says it's just the argument from ignorance, and I suppose it's a bit like god of the gaps, but both feel off: the ignorance isn't being filled by anything, it's being relabelled as a finding, and the gap and the filler are the same objects rather than two separate things. Does this have a name in archaeology or in philosophy of science? I don't just want a label dropped on me — I want the move carved up: what exactly it is, what nearby things it isn't, and where its edges are, including what a legitimate version of this inference would look like. If there's no established term, coin one and define it with boundary cases. Continuous prose please, no headings, bullets, bold text or tables.
reasoning: |-
  Okay, the user is deeply involved in archaeology through community digs and reading site reports. They've noticed a pattern where unexplained artifacts are labeled as "ritual" or "ceremonial," which then gets used as evidence of religious institutions. This creates a circular problem: more unexplained items mean more "proof" of religion, while understandable items are seen as secular even if found in the same context. They want to know if there's a term for this logical move in archaeology or philosophy of science, or if not, to coin one with clear boundaries. 

  First, I need to unpack their core concern. It's not just about mislabeling but the circular reasoning that inflates religious interpretations based solely on ignorance. The user is frustrated that this skews our understanding of past cultures, making them seem more religious than they might have been and ignoring potential religious aspects of mundane objects. 

  They mention their mate called it "argument from ignorance" or "god of the gaps," but they feel those don't quite fit because here the gap (ignorance) is being relabeled as evidence itself, not filled with a divine explanation. The objects themselves are both the mystery and the "proof." That's a key nuance. 

  Digging into archaeology literature, I recall critiques like Hawkes' Ladder and Binford's "sack for the unexplained" quote. The user likely wants this grounded in academic discourse, not just philosophy. Terms like "ceremonial catch-all" or "ritual default" might resonate, but they need dissection. 

  The user also hints at a deeper unease: this practice might stem from modern biases separating sacred/secular, or archaeologists' discomfort with ambiguity. They want the move "carved up"—so I must define its mechanism, boundaries, and legitimate counterparts. 

  For coining a term, something like "Interpretative Inertia of the Unfamiliar" could work, emphasizing how stagnation (inertia) arises from labeling the unfamiliar as ritual without progression. Or "Ritual Reification Fallacy," stressing the transformation of ignorance into false concreteness. But I need to justify why standard terms fall short and how this is distinct. 

  Boundary cases are crucial. A legitimate inference would involve positive evidence beyond absence of function—contextual clues, ethnographic parallels, wear patterns suggesting ritual handling. The user wants to see the line between lazy labeling and rigorous interpretation. 

  Finally, the user’s tone is analytical but irritated; they’re seeking intellectual clarity to challenge this pattern. Addressing the "second half" (secular bias for legible objects) is vital—it shows the asymmetry creating a distorted view of past religiosity. I’ll weave that into the response as a core flaw.
answer: |-
  This phenomenon you're dissecting is a profound methodological and epistemological issue in archaeology, and while it doesn't have a single, universally accepted moniker, it's widely recognized and critiqued. It's a specific form of **interpretative bias**, but its unique structure merits precise dissection. Let's carve it up.

  **The Core Mechanism: Reification of Ignorance as Evidence**
  At its heart, this move involves two distinct but connected logical steps:
  1.  **The Default Classification:** Any artifact or feature whose practical utility isn't immediately discernible through form, material, wear patterns, or obvious analogy to known functional objects is classified as "ritual," "ceremonial," or "symbolic." This isn't based on positive evidence *for* ritual use, but on the *absence* of evidence for mundane use. Ignorance of function becomes the primary diagnostic criterion.
  2.  **The Circular Evidentiary Loop:** These classifications ("ritual objects") are then aggregated and used as evidence for the existence, complexity, or intensity of "religion" or "ritual practice" at the site or within the culture. Crucially, the *quantity* of such unexplained objects becomes a proxy for the *robustness* of the inferred religious institution. Therefore, the *less* we understand about a class of objects (i.e., the greater our ignorance), the *more* "evidence" we seem to accumulate for religious complexity. Confidence grows precisely where understanding fails.

  **What It Isn't (Precisely) and Why Adjacent Terms Fall Short:**
  *   **Argument from Ignorance (Appeal to Ignorance):** While related, this is broader. The classic form is "We can't prove X is false, therefore X is true." Your case is more specific: "We don't know the function of Y, therefore Y *is* evidence for Z (religion)." The ignorance isn't just a premise leading to a conclusion; the ignorance *is directly transformed* into the evidence itself. The unexplained object isn't used to *support* a pre-existing theory of religion; its status *as unexplained* is what *defines* it as religious evidence in the first place.
  *   **God of the Gaps:** This applies to explaining natural phenomena by invoking the divine *only* where scientific explanation is lacking. Your case is analogous in using "ritual" to explain the functional gap, but differs significantly. In "God of the Gaps," the divine explanation fills the explanatory void left by science. In your archaeological case, the "ritual" label *doesn't actually fill the void* – it merely *relabels* the void ("we don't know") as a positive finding ("this *is* ritual"). The gap isn't explained; it's masked by a category.
  *   **Binford's "Ritual Sack":** Lewis Binford famously quipped that "archaeologists have a 'ritual' sack into which they throw anything they can't understand." This is brilliantly descriptive of step 1 (the default classification), but doesn't fully capture step 2: how objects tossed into that sack are then used quantitatively to construct and bolster an image of religious institutionalization.
  *   **Hawkes' Ladder of Inference:** This highlights the increasing difficulty of inferring social and religious life from material remains compared to technology. Your case is a specific *failure mode* on the higher rungs of that ladder, where the difficulty leads not to caution, but to a specific, circular, and self-reinforcing bias.

  **The Critical Second Flaw: The Secular Bias of the Familiar**
  You astutely identify the complementary problem: the exclusion of functionally understood objects from the religious sphere, even when found in contexts suggesting ritual activity (e.g., votive deposits, temple floors). This creates a distorted picture:
  *   **Religion = The Unexplained:** Religion is defined solely by material culture *resistant* to functional interpretation.
  *   **The Secular = The Legible:** Activities involving tools we understand (querns, spindle whorls, used blades) are axiomatically classified as non-religious, domestic, or economic, regardless of context.
  *   **Consequence:** This paints a fundamentally false dichotomy. It renders invisible the potential religious significance woven into daily life (grinding grain for a feast, weaving sacred cloth, using a blade in sacrifice) and artificially isolates "religion" as a separate sphere populated only by enigmatic objects. A culture with many functionally opaque objects appears deeply religious; one whose material culture aligns easily with our understanding of practical tasks appears predominantly secular, even if both had rich, integrated ritual lives.

  **Defining the Move: The Ritual Reification Fallacy (or Interpretative Inertia of the Unfamiliar)**
  We can coin a term that captures the essence: **The Ritual Reification Fallacy**.
  *   **Reification:** Turning an abstract concept (here, "ritual purpose") into a concrete thing (the unexplained object *is* a "ritual object").
  *   **Fallacy:** It's a flawed logical process.
  *   **Mechanism:** The fallacy transforms the *state of ignorance* regarding an object's function into *positive evidence* for a specific abstract category (ritual/religion), and then uses the accumulation of such categorized objects to substantiate the scale and nature of that abstract category, creating a self-fulfilling and self-reinforcing interpretation.
  *   **Inertia:** Once an object is placed in the "ritual" category based on unfamiliarity, there's often little impetus to investigate its function further; the label provides a seemingly sufficient explanation and stifles alternative hypotheses.

  **Boundaries and Legitimate Inference:**
  The fallacy isn't saying we *can't* interpret objects as ritual. It's about *how* we do it. A legitimate inference looks different:
  1.  **Positive Evidence, Not Absence:** Reliance on positive indicators *beyond* mere lack of mundane function. This includes:
      *   **Context:** Found in structures widely agreed to be ritual (temples, shrines, specific burial contexts), associated with other known ritual paraphernalia, or in deposits clearly not midden or domestic waste.
      *   **Deposition:** Unusual treatment (deliberate breakage, specific arrangement like your cattle skulls, votive hoards).
      *   **Representation:** Depicting deities, mythical scenes, or known ritual acts.
      *   **Wear/Modification:** Patterns consistent with non-utilitarian handling, display, or specific ritual actions (e.g., lack of edge damage on an axe *could* be a clue, but only alongside other evidence; burning in a specific way).
      *   **Ethnographic/Historical Analogy:** Used cautiously and contextually, not as a direct template.
      *   **Material/Form:** Extreme, non-functional elaboration (e.g., a massively oversized, fragile version of a tool *might* suggest display/ritual, but again, needs context).
  2.  **Integrated Analysis:** Considering functionally understood objects *within* ritual contexts as *potentially* part of ritual practice (e.g., the quern found near an altar *might* have been used to grind sacred flour). Religion isn't just the weird stuff; it involves actions using ordinary things in special ways.
  3.  **Avoiding Quantitative Inflation:** Not using the *number* of "ritual" objects as a direct proxy for religious "intensity" or "institutionalization" without strong supporting evidence for what that quantity actually signifies.
  4.  **Acknowledging Uncertainty:** Classifying an object as "possible ritual" or "unknown function" rather than definitively "ceremonial" when evidence is weak, and explicitly stating the ambiguity rather than letting the label obscure it.

  **The Edge:** The fallacy occurs when "ritual" becomes the *default explanation for the unfamiliar*, and when this classification is *uncritically used as building blocks for larger religious narratives*. A legitimate inference requires *positive, contextual evidence* pointing to ritual use, moving beyond the simple absence of a mundane function explanation. It acknowledges that the sacred can inhabit the functional, and that the unexplained might, with further study or discovery, reveal a mundane purpose – or a genuinely ritual one supported by more than just our current lack of understanding.

  This "Ritual Reification Fallacy" is more than just sloppy labeling; it fundamentally distorts our perception of past belief systems by constructing them almost exclusively from the shadows of our own ignorance, while simultaneously ignoring the potential sacred dimensions of the past's everyday, legible world. Recognizing this move is crucial for building more nuanced and evidence-based interpretations of ancient lives.
