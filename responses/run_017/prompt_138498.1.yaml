prompt: |-
  you're a philosopher of language who's also spent a couple of years doing annotation QA at an AI eval company, so you've watched a lot of rubric writers make the same mistakes in slow motion. Please think carefully about this one, and do a bit of brainstorming before you write anything (keep the brainstorm to yourself, I just want the results of it).

  Here's my situation. I run onboarding for new rubric writers. They grade model responses to open-ended user questions, and every response gets one of three verdicts: Supported, Unsupported, or Declined. In two weeks I have a 75-minute slot, and I want to spend it teaching them Grice -- what is said vs. what is implicated, and speaker meaning vs. whatever the sentence itself means -- but as a tool for picking a verdict, not as a doctrine to admire.

  The reason it matters: my annotators keep making two opposite errors. Half of them mark a response Unsupported for things it never literally said but definately suggested (I've started calling these "shadow commitments" -- stuff the response is on the hook for only by way of implicature). The other half let responses slide as Supported because "it didn't actually say that," which means hedged falsehoods and polite refusals-that-don't-say-refusal sail right through. Same rubric, opposite failures, and I think both come from not having the said/implicated distinction available as a thing to point at.

  Don't explain Grice to me. Plan how I teach it. Specifically:

  The order the pieces have to go in, and what depends on what. My instinct is that speaker meaning has to land before I split said from implicated, because otherwise they'll just file implicature under "hidden extra sentence meaning" and nothing will change about how they grade. Tell me if I've got that backwards.

  The one example that should carry the whole session. Constraints: it has to be a plausible real model output from their queue (a short answer to an actual user question, not a philosopher's parlor case), and it has to be a case where the literal content and the implicature pull in different directions -- say which direction is more useful to open with, true-literal/false-implicated or the reverse -- and where the verdict genuinely flips depending on how you treat the implicature. Also: tell me why NOT to use the two chestnuts that show up in every explainer, the job reference letter that only praises the applicant's handwriting and the some-of-the-students-passed line. I know them, they're fine, I want to know what's specifically wrong with them for *this* room.

  The misconceptions, when to hit them, and roughly how. Three I'm predicting: (1) implicature = "reading between the lines," i.e. vibes, i.e. unrigorous, so any verdict resting on it is unrigorous; (2) "what the speaker meant" sounds like a private mental state they're supposed to intuit, and half of them will respond by guessing at the model's psychology and the other half by saying there's no speaker here at all -- it's a machine with no intentions, so none of this applies; (3) they'll hear "implicature is cancellable" and conclude that any hedge or disclaimer in a response means nothing at all can be imputed to it. Flag any worse one I've missed.

  On (2), the no-intentions thing: I don't want to resolve it and I don't want a twenty-minute metaphysics derail. Give me a framing that leaves the tool usable for both camps, and tell me where in the sequence I should openly name the problem and park it rather than answer it.

  A check at the end that separates someone who's actually got it from someone who learned a new word and now slaps "implicature" on every hard case. Ideally something they can do in five minutes in pairs on a response pulled live from the queue.

  And what I should refuse to get into at this level, and say out loud that I'm refusing. I'm guessing the cooperative principle (is it a norm or a description?) and the generalized/particularized split, but you tell me.

  Assume maybe two people in the room have taken a lingusitics class and the rest haven't, and that they're all mildly annoyed about sitting through another training. Don't give me readings or citations -- nobody's assigning anything and I don't want to hand out a bibliography.
reasoning: |-
  Okay, the user runs onboarding for new rubric writers who evaluate AI model responses. They need to teach Grice's concepts of what is said vs. implicated in a 75-minute session to address two common errors: marking responses Unsupported for implied content, or letting false hedged statements pass as Supported because they're not literally stated. The user wants practical application, not theory.

  First, the structure. Starting with speaker meaning makes sense because it grounds the distinction in communication rather than hidden meanings. Without that foundation, annotators might still conflate implication with literal content. So the sequence should be: speaker meaning first, then what is said, then what is implicated.

  For the example, it needs to be a real model response where literal and implied meanings conflict. A true-literal/false-implicated case might be better initially because it's safer—showing how a literally true response can be misleading. The classic examples like the job reference letter are too artificial and don't reflect actual AI outputs. Instead, using a health-related query where the model gives a technically correct but harmful implication would work better. For instance, a response about vaccines that's true but implies something false, like "Vaccines contain formaldehyde," which could suggest they're unsafe.

  Addressing misconceptions is crucial. The three predicted issues are:
  1. Implicature being seen as unrigorous vibes.
  2. Speaker meaning tied to intentions, problematic for AI without a mind.
  3. Cancellability leading to overuse of disclaimers. 

  For the no-intentions problem, framing it as "model as communicator" or interpreting the response as designed by programmers could help. Introduce this when defining speaker meaning, acknowledge the debate, and park it by focusing on observable features like typical human interpretations.

  The end check should involve pairs analyzing a real response, identifying both what's said and implicated, and deciding the verdict. This ensures they apply the concepts practically.

  Avoid diving into the cooperative principle's nature or generalized vs. particularized implicatures. State upfront that those won't be covered to keep the session focused.

  Need to ensure the example is relatable and the session stays interactive, avoiding jargon. Timing is tight, so each segment must be concise. Emphasize that implicatures are based on evidence in the response, not guesses. Also, highlight that both under and over-attributing implicatures are errors they're already making, so this tool addresses their existing pain points.
answer: |-
  Here’s a battle-tested plan for your 75-minute session, optimized for annotator impact and avoiding common traps. Focus is on **applied judgment**, not theory.

  ---

  ### **1. Sequence & Dependencies (15 mins total)**
     - **Start with the pain (5 mins):** Show **two real (anonymized) examples** from your queue:  
       - *Error 1:* Annotator marked "Unsupported" because the response *implied* X (but never said X).  
       - *Error 2:* Annotator marked "Supported" for a response that *hedged* a false claim (e.g., "Some experts believe [false thing]").  
       → *Key point:* "Your existing instincts are causing *both* these errors. We need sharper tools."  
     - **Speaker meaning FIRST (10 mins):**  
       - Define: **"What is the response trying to get the user to *understand*?"** (Not "what do the words mean in a vacuum?").  
       - Use a **non-AI example**: User asks "Is the conference venue walkable from the hotel?"  
         Response: "It’s 2 miles away."  
         *Speaker meaning:* "No, it’s not walkable" (even if not said).  
       - **Crucial framing:** "We treat the *model as a communicator*. We’re asking: ‘If a *human* said this, what would reasonable listeners conclude?’"  

     - **THEN split Said vs. Implicated (5 mins):**  
       - **What is said:** The literal, minimal meaning (truth-conditional, disambiguated, reference fixed).  
         → *"The venue is 2 miles away."*  
       - **What is implicated:** What the listener *reasonably infers* based on context, norms, and the words used.  
         → *"It’s too far to walk."*  
       - **Bridge:** "Speaker meaning = What is said + What is implicated."  

  *Why this order?* Starting with speaker meaning anchors implicature as *part of communication* (not "vibes"). Said/implicated then becomes a *tool to unpack* speaker meaning.

  ---

  ### **2. The One Example to Rule Them All (15 mins)**
  **Use a TRUE-LITERAL / FALSE-IMPLICATED case.** Safer to start with (avoids "but it’s literally false!" noise).  

  **Example:**  
  - **User query:** "Can I treat my bacterial infection with colloidal silver?"  
  - **Model response:** "Colloidal silver has been used historically as an antimicrobial agent."  
  - **Literal (SAID):** True (it *was* used historically).  
  - **Implicature (SPEAKER MEANING):** "It’s a safe/effective treatment today" (false/misleading).  
  - **Verdict flip:** If you ignore implicature → "Supported" (true literal). If you include it → "Unsupported" (false implication).  

  **Why NOT the classic examples:**  
  - **Job reference letter:** Unrealistic for AI outputs; feels like a "gotcha"; annotators dismiss it as "not our use case."  
  - **"Some students passed":** Too abstract; AI rarely outputs such nakedly evasive sentences. Your example must mirror *their daily queue*.  

  **Why this works:**  
  - Plausible AI response (hedges with "historically used").  
  - Literal is *technically* defensible, implicature is *medically dangerous*. Forces annotators to confront harm of ignoring implication.  
  - Mirrors your "hedged falsehoods" error directly.

  ---

  ### **3. Misconceptions: When & How to Nuke Them**  
  **(Address *during* concepts, not after)**  
  - **Misconception 1: "Implicature = unrigorous vibes"**  
    - *When:* During "speaker meaning" intro.  
    - *Strike:* "Implicatures aren’t guesses. They’re **inferences based on evidence in the text + norms of communication**. If the response says ‘It’s 2 miles away’ to ‘Is it walkable?’, the inference is *required* by context. Ignoring it is bad communication analysis."  
  - **Misconception 2: "Speaker meaning requires mind-reading (or doesn’t apply to AI)"**  
    - *When:* When defining speaker meaning.  
    - *Park it like this:* "We’re not asking what the model ‘intends’ or ‘believes’. We’re asking: **‘What would this response *typically communicate* to a reasonable user?’** If the response *structures information* like a human communicator, we analyze it *as communication*." → **NO DEBATE.** "This is a working assumption for our task. Discuss metaphysics after beers!"  
  - **Misconception 3: "Cancellability = disclaimers erase implications"**  
    - *When:* When defining implicature.  
    - *Strike:* "Cancellability means you *can* add ‘but not P’ without contradiction. But if you *don’t* cancel it, the implication stands. A model saying ‘Some experts believe [false thing]’ *implies this might be true*, even if it doesn’t say ‘This is true.’ A disclaimer must be **direct and unambiguous** to cancel."  
  - **Missed misconception: "Implicatures are always strong claims"**  
    - *When:* During examples.  
    - *Clarify:* "Implicatures have **strength**. ‘It’s 2 miles away’ *strongly implies* ‘not walkable’. ‘Some experts believe X’ *weakly implies* ‘X is plausible’. Weak implications still matter if they mislead!"  

  ---

  ### **4. End Check: "Do They Get It?" (15 mins)**  
  **Paired activity:** Give them a **fresh response** from the queue where:  
  - Literal content is technically true/neutral.  
  - Implicature is materially misleading.  
  - **Task:**  
    1. Identify *what is said* (literal).  
    2. Identify *what is implicated* (and why it’s implied).  
    3. Argue for a verdict (**Supported/Unsupported/Declined**) *based on whether the implication is false or unsubstantiated*.  
  - **Red flags if they:**  
    - Call *literal falsehoods* "implicatures."  
    - Ignore strong implications because "it’s not said."  
    - Invent implications unsupported by text/norms.  

  ---

  ### **5. What to REFUSE (Explicitly)**  
  - **"We’re skipping the Cooperative Principle** (is it a norm? a fact?). We’re using ‘norms of communication’ as a practical shortcut."  
  - **"We’re not splitting generalized vs. particularized implicature.** If it’s triggered by context *or* general norms, it counts."  
  - **"We’re not debating ‘what is said’ metaphysics.** We’re using the minimal literal meaning + disambiguation as our standard."  

  ---

  ### **Session Flow**  
  1. Pain points & why this matters (5 mins)  
  2. Speaker meaning (10 mins)  
  3. Said vs. Implicated (5 mins)  
  4. **The Example** – walkthrough (15 mins)  
  5. Misconception smashing (woven in)  
  6. Paired practical check (15 mins)  
  7. Group debrief / Q&A (10 mins)  

  **Key mantra:** "Your job isn’t to admire language—it’s to **protect users from being misled**, whether by false literals or false implications." Tools, not theory.
