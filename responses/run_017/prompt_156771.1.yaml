answer: |-
  ## Sestina for the Travelling Dot

  The signal flares: a sudden burst of **red**.
  Then nothing. Then, displaced, a point of **green**.
  The gap is brief, a fraction. Yet we **move**
  with it, insist we saw the shift **before**
  the second flash. A colour change **after**
  the first light died? Or written in the **archive**?

  But what was filed within that **archive**?
  Was there a fading trace of **red**
  still lingering when they asked **after**
  the sight? Or was the nascent **green**
  already woven in, **before**
  the second signal made it **move**?

  Perception says the point did **move**,
  a seamless journey. But the **archive**
  is mutable. Did feeling **before**
  confirm the presence of the **red**
  already shifting into **green**,
  or only later, **after**?

  Consider pulses **after**
  touch: a sequence starts to **move**
  along the skin, from unseen **green**
  to unseen end. The feeling **archive**
  records a tap that wasn’t **red**
  but present, **before**

  the actual strike. That phantom **before**
  the fact. Was it constructed **after**
  contact? Or sketched in **red**
  anticipatory ink? To **move**
  the story on? Within the **archive**,
  which entries signal true **green**?

  The question hangs: that stolen **green**.
  Was it perceived, or placed **before**
  the mind by cunning **archive**
  clerks? Or summoned whole **after**
  the second flash, designed to **move**
  us past the gap, absolving **red**?

  A trial staged **before** the facts were fixed? Or **after**?
  When did the **red** consent to **green**? What starts the **move**?
  The **archive** admits no proof. No final **red** or **green**.

  ***

  **Annotations:**

  *   **Stanza 1:** Neutral setup of the phenomenon.
  *   **Stanza 2:** Leans into the "archive rewrite" model ("mutable", "written", "later").
  *   **Stanza 3:** Tactile version (as requested). Ambiguous phrasing ("The feeling archive / records a tap that wasn't red / but present, before") keeps options open.
  *   **Stanza 4:** Leans into the "manufactured downstream/staged" model ("constructed", "sketched", "summoned whole").
  *   **Stanza 5:** Explicitly juxtaposes both models ("staged before" vs "summoned after") and introduces "cunning clerks" as metaphor for reconstruction.
  *   **Stanza 6:** Explicitly states the undecidability ("admits no proof").
  *   **Envoy:** Maintains the undecidability ("No final red or green"), questions the origin ("What starts the move?"), and collapses the distinction between the two scenarios and the epistemic gap ("The archive admits no proof").
  *   **Keeping it open:** Lines like "Was there...", "Or was...", "Did feeling... or only later...", "Was it perceived, or placed...", "Or summoned...", and the entire envoy deliberately refuse commitment to either explanation before the final stanza. The tactile stanza's ambiguity is crucial. The envoy refuses resolution.
