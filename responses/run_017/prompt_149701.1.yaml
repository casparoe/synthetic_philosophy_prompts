  The collapse of "non-propositional" and "not truth-apt" is crucial. If hinges aren't propositions, they can't be true/false, which affects all other points. But Wittgenstein’s language sometimes treats them as empirical. This ambiguity is where the real disagreement lies—whether hinges are part of language's structure or within its content.

  Substantive residues include how practices are grounded without regress and whether hinges are a distinct cognitive kind. Even if terms are clarified, these issues persist, suggesting it's not purely verbal. The user’s friend might overlook these deeper questions, focusing on terminology.

  The probability breakdown: 0.4 on truth values being substantive, 0.6 on attitude, 0.3 on unity, 0.5 on epistemic terms. Combining them, the overall probability of a verbal dispute is 0.6, leaning against it. The attitude question is most sensitive because it ties into whether hinges involve cognitive states or behavioral dispositions.

  The user and their friend’s difference comes from emphasizing different residues. The friend sees resolved by clarifying terms; the user sees lingering issues. The key argument is Wittgenstein’s riverbed metaphor: if hinges are dynamic, changing from empirical to rules, that challenges both binary views and points to a substantive middle ground.

  On the non-propositional vs. not truth-apt: conflating them hides whether hinges are outside language (non-propositional) or within it but not assessable (not truth-apt). Clarifying this could shift the debate, but not resolve the grounding of practices.
