prompt: |-
  Looking for a name for a move I keep catching in talks and in my own drafts — or, if there isn't one, a coinage I can define tightly enough to actually use in a methods section.

  Setup. Someone reports a number for some trait (BMI, years of schooling, whatever) that's meant to capture how much of the variation in that trait, in that population, tracks genetic differences. Then, sometimes in the same sentence, the number gets used to answer questions I'm pretty sure are different questions:

  - How much of *this one person's* trait is genetic — as if you could take an individual's value and carve it into a genetic bit and an environmental bit in the same proportion. A reviewer on a paper I'm revising basically did this: the heritability of BMI is high, so a school-food intervention isn't worth evaluating.
  - Whether the gap between group A and group B is genetic. The number was estimated *within* groups, or in some mixed sample, and now it's being wheeled in to explain a difference *between* them.
  - Whether the trait is "really" biological, fixed, in the genes — as opposed to something messy and social.

  The bit that makes me think these are one thing and not three: the number is a ratio, and both halves of it depend on what happens to be varying in the population and setting where you measured it. Homogenize the environment and the number goes up. So the population where an environmental intervention has *already* equalized things is exactly the population where the number looks most "genetic," and a population with wildly unequal environments is where it looks least genetic. Its not just a number that gets misread; it moves in the direction that reads as "genes matter more" precisely when the environment got made uniform.

  Two test cases I use to check whether I understand it:
  (a) A disease that's entirely caused by a dietary deficiency everyone in the population shares — so it's fully preventable with a supplement — where the only genetic variation is in how badly each person is affected by the deficiency. Seems to me the number here could be near 1, for a trait I'd call 100% environmental.
  (b) Same trait, same gene pool, two populations kept in different conditions: the number is high within each, and the mean difference between them is entirely environmental.

  So: is there a term of art for this? Not for each bullet individually — I know people say the "high heritability doesn't mean unchangeable" thing — but for the family, including the sensitivity-to-what's-varying bit. If the honest answer is that there's no umbrella term, just say that plainly; I'd rather get that than a name that covers one bullet and leaves me overgeneralizing.

  Neighbors I've considered and why they seem off: reification (too big — it covers reifying g, reifying race, everything), ecological fallacy (wrong structure: that's aggregate vs individual correlations, mine is a quantity that only has a value relative to a distribution being read as intrinsic), Goodhart's law (close for the "goes up when you fix the environment" part, but nobody's gaming a metric in my cases).

  What I actually want out of this: whether there's a real term and how it's defined; if not, a coinage plus a definition that says what is and isn't an instance; whether my first two bullets are genuinely the same error or whether the second one is really about counterfactuals rather than attribution; and whether the sensitivity bit is the same phenomenon or a symptom of it. Also a boundary case I can't sort out: predicting response to selection *is* an intervention, and the number is legitimately used there — so the error can't be "using it for any intervention claim." Where's the line? And if there's a legitimate use that lets you read it as being about individuals, I need to know, because my definition has to leave room for it.

  I'm a PhD student in epidemiology (gene–environment stuff in cohort data), so be as technical as you like, and don't bother with references or a reading list — I can chase those later. Please dont just hand me "heritability is a population statistic"; I know that sentence, I dont know what the *error* is called. Answer in American English if you can — I'm lifting sentences into a manuscript going to a US journal. Under ~700 words would be ideal.
reasoning: |-
  Alright, the user is a PhD student in epidemiology working on gene-environment interactions. They need a term for a specific error they keep encountering: misusing heritability estimates. Let me break down their query.

  First, they describe three common misuses: applying a population-level heritability statistic to an individual, using it to explain group differences, and equating high heritability with biological determinism. The key insight is that all three errors stem from ignoring that heritability is context-dependent. When environments are uniform, heritability increases, making genes seem more influential precisely when environmental interventions have already been successful. 

  The user mentions two test cases. In the first, a disease is entirely environmental but heritability is high due to genetic variation in susceptibility. In the second, within-group heritability is high, but between-group differences are environmental. They want to know if there's an umbrella term for this family of errors.

  They've considered terms like reification, ecological fallacy, and Goodhart's law but found them insufficient. Reification is too broad, ecological fallacy doesn't fit the structure, and Goodhart's law isn't about misapplication. The user needs a precise term for their methods section, possibly coining one if necessary.

  Their deeper needs: clarity for their manuscript, distinguishing the errors, understanding why the sensitivity to environmental variation is central, and delineating legitimate uses (like predicting selection response) from misapplications. They also wonder if the first two bullets are the same error or different.

  I recall that population geneticists have terms like "Lewontin's Fallacy" for the group difference error, but that's specific. The core issue is treating heritability as intrinsic rather than relative. The term "heritability interpretation error" is vague. "Misplaced contextualism" or "contextual fallacy" might work, but maybe "heritability attribution error" is better, emphasizing the wrongful assignment of causal shares. 

  For the boundary case, response to selection is legitimate because it operates on population variance under current conditions, unlike interventions that alter environments. The error lies in assuming heritability reflects immutable individual essence or between-group causality. The user needs to stress that heritability is a proportion of variance, not a fixed quantity. 

  I'll propose "Heritability Scope Fallacy" as the coinage, defined as misapplying a population's heritability ratio beyond its statistical context. This covers all three misuses by highlighting the scope mismatch. The sensitivity to environmental variation is the mechanism enabling the fallacy. The first two bullets are unified under this, while the third is a conceptual extension. Legitimate uses like selection prediction remain valid because they respect the scope. This term should fit their manuscript needs.
answer: |-
  Here's a precise coinage and definition tailored to your needs, addressing the core error and its variants:

  ### The Term: **Heritability Scope Fallacy**
  *(or: Variance Partition Scope Fallacy)*

  ### Definition:
  The **Heritability Scope Fallacy** occurs when a population-level estimate of heritability (h²) or analogous variance partition ratio is misinterpreted by:
  1.  **Attributing** the population ratio to an individual's trait value ("X% of *this person's* trait is genetic").
  2.  **Transferring** the estimate to explain differences *between* distinct populations or groups when it was estimated *within* a specific population/environmental context.
  3.  **Reifying** the ratio as an intrinsic, context-independent measure of a trait's "biological fixedness" or resistance to environmental intervention.

  **The Core Mechanism:** The fallacy arises from ignoring that h² is fundamentally a *descriptive statistic* quantifying the *proportion of current phenotypic variance* attributable to genetic variance *within a specific population*, *under its specific environmental and genetic distribution at the time of measurement*. It is not:
  *   An intrinsic property of the trait or individual.
  *   A measure of causal contribution applicable to individuals.
  *   Predictive of between-group differences.
  *   Indicative of the trait's potential malleability under *changed* environmental conditions.

  ### Why this fits your observations:
  *   **Unifies the Bullets:** All three misuses stem from misapplying the scope (population variance ratio) to contexts it doesn't describe (individual attribution, between-group differences, inherent biological essence). The "sensitivity-to-what's-varying" is the *reason* the scope matters and why the fallacy occurs.
  *   **Highlights the Key Flaw:** "Scope" explicitly captures the mismatch between the statistic's definition (relative to a specific population/environment context) and its misapplication.
  *   **Distinguishes from Neighbors:**
      *   *Reification:* This is a *specific type* of reification applied to the heritability ratio and its meaning.
      *   *Ecological Fallacy:* While related (inferring individual from group), the Heritability Scope Fallacy specifically concerns misapplying a *variance partition ratio* beyond its defined scope, including individual attribution *and* between-group inference *and* essence claims.
      *   *Goodhart's Law:* Not about metric gaming; about fundamental misinterpretation of what the metric *is*.
  *   **Explains the "Sensitivity":** The fallacy *depends* on the sensitivity. The ratio changes with the environment precisely because its scope is local. Misinterpreting it as intrinsic ignores this dependency.

  ### Addressing Your Specific Questions:
  1.  **Are the first two bullets the same error?** Yes, under this umbrella. Both involve transferring a population-level variance ratio (scope: *within* Group/Pop) to a different unit of analysis (scope: *individual* or *between groups*). The second bullet *is* fundamentally an attribution error about the *cause* of the group difference, incorrectly attributed using the within-group ratio.
  2.  **Is the sensitivity the same phenomenon or a symptom?** The sensitivity (h² changing with environment/genetic diversity) is the *underlying mechanism* that makes the Heritability Scope Fallacy possible and pernicious. Ignoring this sensitivity *is* committing the fallacy.
  3.  **The Boundary Case (Response to Selection):** This is the *legitimate* use defining the scope's *proper* application. Response to selection (R = h² * S) *explicitly* operates on the population variance under the *current* environmental conditions. It predicts how the *population mean* will change *within that same environmental context* when selection acts on the existing genetic variation. **The line:** The fallacy occurs when the ratio is used outside the context of explaining/predicting *variance within the measured population* or *mean change in that population under selection*. Using it for individual attribution, between-group explanation, or fixedness claims crosses the line.
  4.  **Is there a legitimate use for individuals?** **No.** There is no scientifically valid way to decompose an *individual's* phenotype into percentage genetic/environmental components based on h². The ratio describes variation *among* individuals, not composition *within* one. (Quantities like breeding values *predict* an individual's *relative* contribution to the next generation *within the population*, but still do not carve up their phenotype).

  ### Using it in Your Methods/Manuscript
  > "We caution against the **Heritability Scope Fallacy**, wherein population-level heritability estimates (h²)—defined as the proportion of phenotypic variance attributable to genetic variance within a specific population under prevailing conditions—are misinterpreted. Common misapplications include attributing the ratio to individual phenotypes, inferring genetic causes for differences between distinct populations, or equating high h² with biological determinism. Crucially, h² is sensitive to the environmental and genetic variance present; it increases as environmental variance decreases, meaning high h² can paradoxically reflect a population where environmental factors *have been* effectively standardized. Valid applications of h², such as predicting response to selection within the same population under constant environments, respect this context-dependent scope."

  This coinage is precise, descriptive, technically sound, and directly addresses the core error unifying your observations. It emphasizes the critical role of the population/environment context ("scope") and the statistic's sensitivity to variance components, which is central to why the misapplications are fallacious. It clearly delineates the boundary with legitimate uses like selection response.
