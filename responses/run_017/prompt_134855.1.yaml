prompt: |-
  I run a volunteer forecasting group, about 45 people, mostly folks who found their way here via the Sequences, and we field a fresh set of questions every month. I'm the moderator, which means every single month I hit the same structural thing: two members disagree, they've both read each others reasoning, and the thread has stopped producing anything. I've got maybe 20 minutes per case, the members are unpaid and have no formal training beyond blog posts, and whatever I decide I have to post publicly as a one-line justification in the channel. So I need something better than vibes.

  What I want is a decision procedure I can actually run, grounded in what the actual literature on this says — the Aumann-style agreement results, common priors, and the fact that those results are proved for small worlds in roughly Savage's sense, where the space of possible states is already on the table before anyone starts. My questions are basically never like that. Nobody can enumerate the states in advance, half of what matters gets discovered mid-round (including, sometimes, what the resolution criteria turn out to even mean), and a lot of the genuinely good evidence is the kind you can't hand to another person: I've been reading this lab's commits for a year and it feels slower than the roadmap implies, that sort of thing. Call that *unportable* evidence, versus portable evidence you can paste into a message. I think that distinction is doing a lot of work in practice and I want the procedure to have an explicit slot for it.

  So give me: the questions to ask in order, what counts as a settled answer to each one, where the procedure outputs stop, this thread is finished, average the two numbers and move on, and where it outputs that a human has to decide because it's a values call rather than a factual one. Then run it on three real cases from last month:

  1. Whether a given lab ships a named product by a hard date. Both sides have portable evidence, they've traded links twice, and they're still at 70 and 30.
  2. A domain insider with only unportable evidence at 60 versus an outsider with a clean base-rate argument at 25. I want you to run this honestly even if it lands on average them and move on, which I'll hate, because I privately think the insider is right.
  3. A dispute about whether the resolution text covers an obvious loophole case. My instinct is that this is a pure wording fight and I should just clarify and move on; tell me if the procedure says it's something worse.

  Finish by telling me plainly what the procedure can't do, especially whether it can distinguish these two have genuinely different priors from one of them is being lazy or playing status games. Hard cap of 700 words, and lead with the checklist itself — I'll skim the cases afterwards.
reasoning: |-
  We are designing a decision procedure for resolving forecasting disagreements in a volunteer group with limited time and resources. The procedure must account for:
  - Portable evidence (can be shared) vs. unportable evidence (cannot be shared, e.g., intuition based on experience)
  - The fact that the state space is often not fully specified in advance (non-Savage)
  - The need for a public one-line justification

  The procedure is based on the idea that rational agents should update toward agreement when they share common priors and all evidence (including unportable) is made common knowledge. However, since unportable evidence cannot be shared, we must rely on the agents' reports about it.

  The procedure consists of a series of questions. If at any point the answer is "yes", we follow the specified action (which may resolve the dispute or move to the next step). The goal is to either:
  - Resolve the disagreement by having the forecasters update (using the principle of agreement under common knowledge).
  - Identify that the disagreement is due to non-common priors (which might require averaging or a human decision).
  - Identify that the disagreement is about the interpretation of the question (which requires clarification).

  **Procedure Checklist**

  1. **Question Clarification**: 
     - Ask: "Is there ambiguity in the question that might cause the forecasts to be about different things?"
     - If yes: Moderator clarifies the question and asks both forecasters to re-forecast on the clarified question. If the disagreement persists, proceed to step 2.

  2. **Portable Evidence Exchange**:
     - Ask: "Have both forecasters shared all their portable evidence and explained how it updates their forecast?"
     - If no: Require them to do so and then recast. If the disagreement persists, proceed to step 3.
     - If yes: Proceed to step 3.

  3. **Unportable Evidence Disclosure**:
     - Ask: "Have both forecasters described the nature (though not the content) of their unportable evidence and the direction and magnitude of its effect on their forecast?"
     - If no: Require them to do so (e.g., "I have unportable evidence from reading lab commits that updates my forecast downward by 20 percentage points"). Then proceed to step 4.
     - If yes: Proceed to step 4.

  4. **Agreement on Unportable Evidence Update**:
     - Ask: "After considering the description of the unportable evidence (its nature and the claimed update), does the other forecaster agree that the update is reasonable (even if they don't have the evidence)?" 
     - If both agree on each other's updates: Then they should update their forecasts accordingly. If they still disagree, it suggests a difference in priors. Go to step 5.
     - If one disagrees with the reasonableness of the other's update: Then we have a conflict about the reliability of the unportable evidence. This is a values-like issue (trust in the source or method). Go to step 6.

  5. **Common Prior Check**:
     - Ask: "After updating on all evidence (portable and unportable as described), do both forecasters agree that the only remaining difference is in their priors (i.e., they would have agreed if they started with the same prior)?" 
     - If yes: Then the disagreement is due to different priors. The procedure outputs: "Average the two numbers and move on." Justification: "Fundamental prior difference."
     - If no: Go back to step 2 (they might have missed some portable evidence) or step 3 (if unportable evidence wasn't fully described).

  6. **Unportable Evidence Reliability Check**:
     - Ask: "Is the disagreement about the reliability of the unportable evidence rooted in a difference of values or trust that cannot be resolved by evidence?" 
     - If yes: Then it is a values call. The procedure outputs: "A human has to decide." Justification: "Disagreement on reliability of unportable evidence."
     - If no: Then there might be portable evidence about the reliability (e.g., past track record of the insider). If such evidence exists, go back to step 2. Otherwise, it becomes a values call (step 6).

  **Stopping Conditions**:
  - The thread is finished when we reach:
     - Step 1: After clarification, they might agree.
     - Step 5: Average the forecasts (prior difference).
     - Step 6: Human decision (values-like issue).

  **Applying the Procedure to the Cases**

  **Case 1: Lab ships product by hard date (70 vs 30, portable evidence exchanged)**
  - Step 1: No ambiguity? Assume yes (since they exchanged evidence and are still at odds). Proceed.
  - Step 2: They have shared portable evidence. Proceed.
  - Step 3: Ask for unportable evidence description. Suppose both have some (e.g., "I know this lab and they often miss deadlines, which updates me -20%"). 
  - Step 4: Check if they agree on the reasonableness of the other's unportable update. 
     - If yes, they update. But if they still disagree (say 60 vs 40), then step 5: prior difference -> average to 50.
     - If one doesn't accept the update (e.g., "I don't believe your lab experience is relevant because..."), then step 6: if they can't resolve with portable evidence about the relevance, it becomes a human decision.

  **Case 2: Insider (60, unportable) vs outsider (25, base rate)**
  - Step 1: Assume question is clear.
  - Step 2: They have shared portable evidence? The outsider has a base rate (portable). The insider might have none portable. So step 2: outsider has shared, insider has no portable? Then step 2: "no" because insider hasn't shared portable evidence (if any). But if the insider has none, then we move to step 3.
  - Step 3: Insider describes unportable evidence: "I have insider knowledge that updates me +35% from the base rate." Outsider describes: "I have no unportable evidence, just the base rate." 
  - Step 4: Does the outsider agree that the insider's update is reasonable? The outsider might say: "Without knowing the specifics, I can't trust an unverifiable update of 35%." Then step 6: Is this a values issue? 
     - If the group has a track record of the insider being reliable, that's portable evidence (step 2). But if not, then it becomes a trust issue. 
     - The procedure might lead to step 6 (human decision) because the outsider doesn't trust the insider's unportable evidence. 
     - Alternatively, if the outsider accepts a smaller update (say 10%) then they update: 25 + 10% = 35%, and insider might update down to 60% -? (if the base rate is 25, then insider started at 60, but the base rate update might not have been applied). Actually, the insider might have already incorporated the base rate? 

     Clarification: The insider's forecast is 60, which might be relative to a base rate. If the base rate is 25, then the insider is saying they have evidence that updates +35 from the base. The outsider is at 25. 

     Step 4: The outsider is asked: "Is it reasonable that the insider's unportable evidence could justify a +35 update?" If the outsider says no (and they do, because they are at 25), then we go to step 6. Unless there is portable evidence about the insider's reliability? If not, then human decision.

     But note: the procedure might also reveal that the insider hasn't properly updated on the base rate? That would be step 2: portable evidence (the base rate) hasn't been properly incorporated by the insider? So step 2: the base rate is portable. The insider must explain how they updated on the base rate. If they did, then we proceed. If not, they update. 

     Let's assume the insider says: "I started at the base rate of 25, then my unportable evidence updated me to 60." Then step 3: the update is +35. Then step 4: the outsider must judge if that update is reasonable. If the outsider says no, then step 6: human decision.

     This case might end in a human decision (if the moderator or group has a policy on trusting insiders) or averaging (if they agree it's a prior difference, but step 5 would require they agree that the only difference is priors, but here the insider has extra evidence). 

     Given the procedure, it likely goes to step 6 because the outsider doesn't trust the unportable update.

  **Case 3: Dispute about resolution text covering a loophole**
  - Step 1: Is there ambiguity? Clearly yes. The procedure says: moderator clarifies and asks for re-forecast. If after clarification they still disagree, then we go to step 2. But note: if the ambiguity is about the question, then step 1 is the right place. The procedure would have the moderator clarify and then they re-forecast. This might resolve it. If not, then we proceed. But note: the disagreement might be about the interpretation of the resolution criteria, which is step 1. So we do step 1: clarify and recast. Then if they still disagree, we have to see if it's about evidence or about the interpretation. But the procedure is designed for evidence disputes. If after clarification they still have different forecasts, then we treat it as an evidence dispute and proceed.

     However, in practice, if the clarification makes it clear that the loophole is either included or excluded, then they should update to the same forecast. If they don't, then it might be because they have different evidence about the likelihood of the loophole being triggered? Then we proceed to step 2.

     But in this case, the moderator's instinct is to clarify and move on. The procedure supports that: step 1 is exactly for this.

  **What the Procedure Can't Do**
  - It cannot force forecasters to be honest or diligent. If one is lazy (doesn't update) or playing status games (refusing to update to avoid losing face), the procedure might not detect it. However, by requiring explicit steps (like describing unportable evidence and agreeing on updates), it might surface bad behavior (e.g., if one refuses to update on portable evidence without reason, the group can see that).
  - It cannot resolve deep disagreements about trust (step 6) without human intervention.
  - It does not address cases where new states are discovered after the fact (non-Savage) except via step 1 (clarification). But if the question is ambiguous, step 1 is triggered.
  - It assumes forecasters are willing to update when they agree on evidence. If not, the procedure might break down.

  **Final One-Line Summary of Procedure**
  A step-by-step checklist for resolving forecast disputes: clarify question, exchange portable evidence, describe unportable updates, check agreement on updates, and if prior difference then average, else if trust issue then human decision.
answer: |-
  ### Decision Procedure Checklist  
  **(Run in order; stop at first settled answer)**  

  1. **Question Ambiguity?**  
     - *Ask:* "Could divergent interpretations of the question explain >20% of the gap?"  
     - *Settled if:* Yes → **Moderator clarifies wording, both re-forecast.**  
     - *No?* → Proceed to #2.  

  2. **Portable Evidence Exhausted?**  
     - *Ask:* "Have both shared all portable evidence (citations, data) and explained their reasoning?"  
     - *Settled if:* No → **Require immediate exchange; both re-forecast.**  
     - *Yes?* → Proceed to #3.  

  3. **Unportable Evidence Acknowledged?**  
     - *Ask:* "Have both described their unportable evidence (e.g., ‘Lab commit history suggests delays’) and quantified its impact (e.g., ‘+30% confidence’)?"  
     - *Settled if:* No → **Require disclosure; both re-forecast.**  
     - *Yes?* → Proceed to #4.  

  4. **Unportable Updates Accepted?**  
     - *Ask:* "Does each accept the other’s unportable update as *reasonable* (even if unpersuasive)?"  
     - *Settled if:* Both accept → **Both update forecasts using the described adjustments.**  
     - *Settled if:* One rejects → **Proceed to #5.**  

  5. **Priors-Only Disagreement?**  
     - *Ask:* "After updating, do both agree the gap stems *only* from irreconcilable priors (e.g., base rates)?"  
     - *Settled if:* Yes → **Average forecasts; justify: "Irreducible prior divergence."**  
     - *Settled if:* No → **Human judgment needed; justify: "Dispute over evidence reliability/weight."**  

  ---  
  ### Case Applications  
  **Case 1: Lab ships product (70 vs 30, portable exchanged)**  
  - #1: Ambiguity? Unlikely (given evidence traded). → Proceed.  
  - #2: Portable exhausted? Yes. → Proceed.  
  - #3: Unportable disclosed? If not → **Re-forecast post-disclosure.** If yes → #4.  
  - #4: Updates accepted? If yes → Update; gap may shrink. If one rejects → #5.  
  - #5: Priors-only? If both agree → **Average to 50.** Else → **Human judgment.**  
  *Likely outcome:* If unportable updates are rejected (e.g., distrust of experience), may need human call.  

  **Case 2: Insider (60, unportable) vs Outsider (25, base rate)**  
  - #1: Ambiguity? No. → Proceed.  
  - #2: Portable exhausted? Outsider shared base rate; insider has none portable. → Proceed.  
  - #3: Unportable disclosed? Insider: "Commit history suggests +35% vs base rate." Outsider: "No unportable." → Proceed.  
  - #4: Updates accepted? Outsider likely rejects insider’s +35% as unreasonable. → **Proceed to #5.**  
  - #5: Priors-only? **No**—outsider disputes reliability of insider’s unportable evidence. → **Human judgment needed.**  
  *Your instinct honored:* Averaging skipped; human evaluates insider’s credibility.  

  **Case 3: Loophole in resolution text**  
  - #1: Ambiguity? **Yes** (explicit loophole dispute). → **Clarify wording; both re-forecast.**  
  - *After clarification:* If gap persists, restart procedure. Your instinct aligns—no deeper dispute likely.  

  ---  
  ### What the Procedure Can’t Do  
  - **Detect bad faith**: Cannot distinguish "genuine prior divergence" from "laziness/status games" (relies on good-fitness).  
  - **Handle novel evidence mid-dispute**: If new states emerge, restart from #1.  
  - **Resolve values disputes**: E.g., "How much should we trust insiders?" defaults to human judgment (#5).  
  - **Force updates**: Requires voluntary cooperation; stubborn forecasters may stall at #4/#5.  

  **Output**: Public justification uses the settled answer (e.g., "Averaged due to irreducible priors" or "Human judgment: unportable evidence contested").  

  > 498 words.
