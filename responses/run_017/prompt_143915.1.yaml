prompt: |-
  I sit with a colleague on a working group that has to classify online communities as epistemically problematic, and she has supplied most of our judgments. Her verdicts so far:

  1. A forum whose moderators delete every link to an outgroup outlet, even though members who encounter outgroup arguments elsewhere find them persuasive — a bubble, not an echo chamber; exposure is the remedy.
  2. A group that reposts outgroup arguments only in order to mock them and circulates a standing explanation of why every outside institution is captured — echo chamber; exposure would not help.
  3. A specialist listserv that ignores all non-specialist sources on questions inside its expertise — neither, and no criticism due.
  4. A citizens' group that boycotts academic sources as bought, on a question where specialists overwhelmingly reject its position — echo chamber, and worse than case 2.
  5. A debate forum that requires both sides to be represented and where each side can state the other's best argument accurately, but where no one ever changes their mind — not a bubble; something else is going on there.
  6. A scattered set of people who each independently reached the same false conclusion from the same one-sided summary, without ever interacting — neither; there is no community to blame.

  Next week's case: a 300-member community in which no source is barred, no one is ridiculed, no capture narrative circulates, and each member, asked privately, is genuinely willing to move on a credible source from the other side — but everyone reads a personalized feed that never surfaces one, and each member wrongly believes the others are far more confident than they are, so doubts never get voiced. She has never ruled on a case where the exclusion comes from a recommender system rather than from the community's own practices, or where the obstacle is not exposure but the merely believed cost of speaking.

  Predict her verdict and her label. First set out the two or three rules that fit her six earlier verdicts equally well — I have in mind something like exclusion versus active discrediting, counterfactual sensitivity to contrary evidence, and the believed social cost of dissent — and say what each predicts here. Then give your best guess with the reason for preferring it, and name the one further case that would best tell the surviving rules apart. If her precedents genuinely underdetermine the case, say so and say which principle she would be adopting with each choice.

  Lead with your bottom line, verdict plus label, in the first sentence; then the candidate rules, the prediction, and the discriminating case. No preamble, no restatement of my question, and no citations.
reasoning: |-
  Alright, let's tackle this problem step by step. The user is part of a working group classifying epistemically problematic online communities, and their colleague has provided six prior verdicts. The task is to predict her verdict on a new case involving a 300-member community with personalized feeds and misperceived confidence levels.

  First, I need to extract the underlying rules from the previous verdicts. Looking at the cases:

  1. **Case 1**: Deleting outgroup links but exposure helps → bubble. Key point: exclusion but remedy possible with exposure.
  2. **Case 2**: Mocking outgroup arguments with capture narratives → echo chamber. Exposure wouldn't help due to active discrediting.
  3. **Case 3**: Specialists ignoring non-specialist sources → neither. Justified exclusion based on expertise.
  4. **Case 4**: Boycotting academic sources → echo chamber, worse than case 2. Active rejection of credible sources.
  5. **Case 5**: Structured debate but no mind changes → not a bubble. No exclusion; willingness to engage.
  6. **Case 6**: Independent false beliefs → neither. No community interaction.

  From these, three candidate rules emerge:

  1. **Exclusion vs. Active Discrediting**: Exclusion alone (like deletion) makes a bubble, fixable by exposure. Active discrediting (mocking, capture narratives) creates an echo chamber where exposure doesn't help.
  2. **Counterfactual Sensitivity**: If members would change with credible evidence (as in case 5), it's not epistemically problematic despite no actual change. Case 4 shows no such sensitivity.
  3. **Believed Social Cost of Dissent**: Doubts aren't voiced due to perceived costs (implied in case 6's lack of community). Case 5 allows dissent without social cost.

  Now, applying these to the new case:
  - **Exclusion**: Algorithmic, not community-driven. Similar to case 1's exclusion but not intentional. Rule 1 might see it as a bubble.
  - **Counterfactual Sensitivity**: Members claim they'd change with evidence, but never see it. This aligns with bubble (remediable by exposure).
  - **Social Cost**: Doubts unvoiced due to misperceived confidence. Rule 3 would classify as echo chamber if social cost is key, but here it's misperception, not active suppression.

  Conflict between rules:
  - Rule 1 (exclusion → bubble) predicts bubble.
  - Rule 3 (social cost → echo chamber?) is ambiguous because the cost here is perceptual, not enforced.

  Best guess: **Bubble, not echo chamber**. The key is remediability by exposure (as in case 1), and the counterfactual willingness to change. The algorithmic exclusion parallels case 1's moderation, just passive. Social misperception isn't active discrediting like in case 2.

  Discriminating case: A community where no exposure occurs due to high social cost of dissent (not misperception). If she calls that an echo chamber, Rule 3 is emphasized; if bubble, Rule 1 dominates.
answer: |-
  **Bubble, not echo chamber.**

  Candidate rules fitting all six verdicts equally well:  
  1. **Exclusion vs. active discrediting**: Exclusion of outgroup content alone (without mockery/capture narratives) makes a bubble (remediable by exposure); active discrediting (e.g., mocking, alleging institutional capture) makes an echo chamber (exposure ineffective).  
  2. **Counterfactual sensitivity to evidence**: If members *would* update beliefs upon credible counterevidence (if encountered), it is not an echo chamber (even if no actual change occurs); absence of such sensitivity (e.g., dismissing sources as "bought") indicates an echo chamber.  
  3. **Believed social cost of dissent**: Unvoiced doubts due to *feared* social backlash (e.g., ridicule or exclusion) contribute to echo chambers; absence of community interaction (e.g., isolated individuals) negates blame.  

  **Predictions for the new case**:  
  - Rule 1 (exclusion vs. discrediting) predicts **bubble**: Algorithmic exclusion lacks active discrediting (no mockery/capture narratives), mirroring case 1's remedy-by-exposure.  
  - Rule 2 (counterfactual sensitivity) predicts **bubble**: Members claim willingness to update privately, satisfying sensitivity (like case 5), contrasting with case 4's insensitivity.  
  - Rule 3 (social cost of dissent) predicts **echo chamber**: Unvoiced doubts stem from *believed* social costs (misperceived peer confidence), paralleling echo-chamber dynamics in cases 2/4 where dissent is suppressed.  

  **Best guess and reason**: Bubble, not echo chamber. Rule 2 (counterfactual sensitivity) is decisive: The private willingness to update distinguishes this from echo chambers (cases 2/4), aligning with case 5’s "no criticism" verdict for open counterfactual receptivity. Rule 1’s exclusion mechanism (algorithmic vs. moderation) is functionally identical to case 1, where exposure suffices. Rule 3’s social-cost concern is secondary here, as the misperception is not community-enforced (unlike cases 2/4’s active norms).  

  **Discriminating case to tell rules apart**: A community where doubts go unvoiced *solely* due to high social costs of dissent (e.g., members fear ridicule if they cite outgroup sources), but counterfactual sensitivity exists and no content is excluded. If labeled echo chamber, Rule 3 dominates; if not, Rule 2 prevails.
