prompt: |-
  for a monthly "big ideas" lunch at my office — about ten people, none of them philosophers, we've done inequality twice and it always collapses into the same argument — I said I'd write down in one page what I actually think about merit and desert, so we can argue with something instead of with each other. Here's the list, roughly in the order it came out:

  1. Desert has to bottom out in something the person did or chose: effort, deliberate practice, showing up, the sacrifices they actually made. Nobody deserves credit for a good brain, a stable home, or being born in a country with a functioning labour market. Call this the anti-luck condition.
  2. Still, I don't think it's unjust that a good neurosurgeon earns twenty times what a night-shift hospital cleaner earns. I'm just not moved by the leveling intuition here, and I don't think I should have to be.
  3. If I'm honest, what I really want from "meritocracy" isn't a society where people get what they deserve. It's the abolishment of inherited position — the kid on the wrong side of the tracks should be able to become the neurosurgeon — and I'd take that even if it produced bigger gaps than the ones we have now.
  4. I think it's genuinely insulting to tell someone that their success was mostly luck, and I think this matters politically rather than just being a matter of tact: people who feel their achievements are being explained away go looking for someone who won't explain them away.
  5. I think we basically can't see, from the outside, how hard anyone tried or how much of a result was them. So institutions should be judged on whether the process was open and fair, not on whether the outcome matched anybody's desert.
  6. I want inheritance taxed into near-nonexistence, because nobody deserves who their parents were.
  7. And I don't think I get to say "the gap in (2) is just the market, and markets aren't a justice question." Markets are a legal artifact; their payoffs are as much a matter of justice as the tax code is.

  I have a vague feeling something is wrong with (2), but I can't say what, and it might be somewhere else entirely.

  So: does this hang together? Go through the pairs and tell me which ones are actually in tension and which only look like it — I'd rather be told "that one's fine, here's why" than have all seven flagged. Rank the real tensions by how bad they are rather than listing them evenly. For each one say what would have to give and what giving it would cost me. And then tell me which single revision would clean up the most, since I'd rather make one large move than six small ones — but don't pick for me, I want to know what each one costs and then decide.
reasoning: |-
  Hmm, the user is organizing a "big ideas" lunch at their office with about ten non-philosophers, and they've struggled with discussions about inequality that keep collapsing into the same arguments. They want to present their thoughts on merit and desert in a one-page document to focus the debate. They've listed seven points and need help identifying tensions among them, ranking those tensions, and suggesting revisions.

  Looking at their points: They start with an anti-luck principle (1), arguing that desert must stem from personal effort or choices, not inherent advantages. Then they have a point (2) where they don't see injustice in large income gaps between skilled professionals and essential workers. Point (3) clarifies that their real goal is abolishing inherited privilege rather than equal outcomes. Point (4) addresses the political danger of attributing success to luck. Point (5) admits we can't truly judge effort from outside, so institutions should focus on fair processes. Point (6) calls for heavy inheritance taxes. Point (7) insists markets are justice issues, not neutral forces.

  The major tension appears between (1) and (2). If desert only comes from personal effort (1), how can massive pay gaps between neurosurgeons and cleaners be just (2)? The neurosurgeon's higher pay likely reflects not just effort but also inherent advantages like intelligence and education access - factors the user explicitly excludes from desert in (1). This is the core inconsistency.

  Other tensions exist but are less severe. Point (3) actually resolves some pressure by prioritizing mobility over equality, aligning with (6)'s inheritance tax. Point (4)'s concern about insulting achievers is political pragmatism that doesn't directly contradict the framework. Point (5) smartly shifts focus to procedural fairness given our epistemic limits. Point (7) correctly notes markets are constructed, but doesn't inherently clash with other points.

  To resolve the key tension, the user could either moderate (1) to allow some desert for cultivated abilities, or reframe (2) to justify pay gaps based on social value rather than personal desert. The first option costs theoretical purity but keeps their core mobility focus intact; the second avoids contradictions but might feel less satisfying. Since their deepest concern is ending inherited privilege (point 3), I'll suggest adjustments that preserve that emphasis while addressing the logical gap.
answer: |-
  Here's a clear analysis of your points, ranking tensions by severity and identifying the single most impactful revision. Your framework is largely coherent but has one core tension that needs addressing. Let's break it down:

  **Core Tension (Major - Threatens Internal Consistency):**
  *   **Points in Tension:** **#1 (Anti-Luck Desert) vs. #2 (Acceptance of Wage Gap) vs. #7 (Markets as Justice)**
  *   **Why it's Bad:** #1 states desert *only* arises from conscious effort/sacrifice ("anti-luck"). Undeserved advantages (talent, stable home) shouldn't count. #2 says it's *not unjust* that a neurosurgeon earns vastly more than a cleaner. #7 rightly states market outcomes *are* a matter of justice (not neutral). The neurosurgeon's high pay stems overwhelmingly from *undeserved* advantages per #1 (innate talent, access to elite education/training, market demand for scarce skills) and the cleaner's low pay stems from *undeserved* disadvantages (lack of access, often harder actual effort/sacrifice). #2 seems to grant the neurosurgeon a *moral justification* ("not unjust") for income based largely on luck, directly contradicting #1 and making #7's justice claim hard to apply consistently.
  *   **What Has to Give & Cost:**
      *   **Option A: Moderate #1:** Allow *some* desert for *cultivated* abilities (not raw talent). You deserve reward for *developing* your brain through effort, even if the initial potential was luck. This weakens the "purity" of the anti-luck stance but makes #2 easier to defend ("they deserve reward for the immense effort/sacrifice *to become and be* a neurosurgeon"). **Cost:** Softens your hard anti-luck line; opens the door to more complex desert claims.
      *   **Option B: Reframe #2:** Stop calling the wage gap "not unjust" *based on desert*. Justify it pragmatically: "While the gap isn't *deserved* per #1, it might be *necessary* (incentives for difficult skills) or *tolerable* *if* mobility (#3) exists and basic needs are met. Its justice (#7) depends on *those* conditions, not desert." **Cost:** Abandons the intuition that the neurosurgeon "earns" their pay in a deep moral sense; makes #2 feel less satisfying/defensible emotionally.
      *   **Option C: Reject Desert for Market Outcomes:** Severely limit desert claims (#1) to non-market contexts (praise, personal satisfaction) and base market justice (#7) *solely* on process (#5) and opportunity (#3), not rewarding individual desert. The wage gap isn't *about* desert; it's about functional needs and opportunity fairness. **Cost:** Radically downplays the role of effort/sacrifice in justifying rewards; contradicts common intuitions about "earning."

  **Minor Tension (Manageable with Clarification):**
  *   **Points in Tension:** **#2 (Accept Wage Gap) / #3 (Prioritize Mobility over Equality) vs. #6 (Tax Inheritance Heavily)**
  *   **Why it's Minor:** #6 (tax inheritance) directly serves #3 (abolish inherited position). The potential tension is if heavy inheritance tax dampens incentives, *possibly* impacting the functional justification for high wages (#2/3). However, you explicitly prioritize mobility (#3) *over* equalizing outcomes ("I'd take that even if it produced bigger gaps"). #6 is a *tool* for #3. As long as you don't believe inheritance tax severely undermines the *incentives* that make high wages functional (a debatable empirical point), this tension is easily resolved by stating that mobility (#3) is the primary goal, enabled by #6, and high wages (#2) are acceptable *if* mobility exists.
  *   **Resolution:** Emphasize that #6 is instrumental to #3. The justification for #2/#3's acceptance of gaps doesn't *rely* on dynastic wealth accumulation. This holds together.

  **Points with No Significant Tension:**
  *   **#3 (Priority on Mobility) & #4 (Danger of Explaining Away Success) & #5 (Focus on Process, Not Outcome Desert) & #7 (Markets as Justice) are COHERENT:**
      *   #3 (mobility focus) explains *why* you care about process (#5) – it enables mobility. It also explains why #4 (not insulting success) matters politically – undermining the narrative of earned success threatens buy-in for mobility-enabling policies.
      *   #5 (focus on fair process, not judging desert) is perfectly compatible with #7 (markets as justice). Justice is achieved by designing fair rules and institutions (#5), not by micromanaging outcomes to match perceived desert (which #5 says we can't do anyway).
      *   #4 is a pragmatic/political warning consistent with valuing mobility (#3) and fair processes (#5). People need to *believe* the process can reward effort to support it.
  *   **#1 (Anti-Luck) & #6 (Tax Inheritance) are COHERENT:** Both attack rewards based purely on luck (innate traits, parentage). #6 is a direct policy application of the principle in #1.
  *   **#1 (Anti-Luck) & #3 (Mobility Focus) are COHERENT:** #3's goal (abolish inherited position) aligns perfectly with #1's attack on luck-based advantages. Mobility allows effort (#1) to matter more.

  **The Single Revision That Cleans Up the Most: Reframe #2 (Option B Above)**

  *   **What it Does:** Change #2 from "*not unjust*" (implying moral justification/desert) to something like: "While the large income gap between the neurosurgeon and cleaner isn't *morally deserved* (per #1), I accept it as a potential outcome of a system focused on mobility (#3) and fair process (#5), *provided* basic needs are met and the cleaner's children have a real shot at becoming the neurosurgeon. Its *justice* (#7) depends on those conditions."
  *   **Why it Cleans Up the Most:**
      1.  **Resolves Core Tension:** It directly addresses the clash between #1 (no desert for luck) and the original #2 (implicit desert for market outcomes based on luck). It aligns #2 with #3 and #5.
      2.  **Preserves Core Insights:** Keeps #1 (anti-luck) strong and pure. Maintains #3 (mobility priority) and #5 (process focus) as central. Upholds #7 (markets are justice) by linking justice to process/mobility, not desert.
      3.  **Minimizes Cost:** You don't have to abandon your intuition that the gap isn't fundamentally alarming (*if* mobility exists). You just stop basing that intuition on the neurosurgeon's *moral desert*. The cost is abandoning the *moral justification* for the gap based on individual desert, which was already undermined by #1 and #7.
      4.  **Strengthens Overall Framework:** Makes your position more consistent: Justice is about fair processes (#5) enabling mobility (#3), breaking dynastic privilege (#6), and recognizing our inability to judge true desert (#1, #5). Market outcomes are just only if they arise from *this* kind of system.

  **Conclusion:** Your framework is powerful and largely coherent, centering on **abolishing inherited privilege (#3, #6) and ensuring fair processes (#5)**, while recognizing the limits of judging desert (#1) and the political importance of success narratives (#4). The major flaw is #2's implication that large market-derived income gaps are *not unjust* based on a concept of desert that #1 explicitly rejects. **Reframing #2 to justify the gap (if at all) based solely on the functional requirements of a mobility-focused system (#3) and fair process (#5), rather than individual moral desert, resolves the core tension and strengthens your entire argument.** This one revision aligns your acceptance of inequality with your foundational principles of anti-luck and opportunity.
