prompt: |-
  I'm a historian of labor movements, finishing a monograph on municipal general strikes in interwar Europe, and a referee's report on the manuscript has backed me into a methodological corner I can't work my way out of. My central case is a transport strike that I argue was broken primarily by the national federation's refusal to release strike funds; the referee says the outcome was "overdetermined," because the funds were nearly exhausted anyway, the city government had already signed a replacement labor agreement with a non-union contractor, and the strike committee had lost the confidence of one of the two key affiliates, and any one of these would have ended the strike on its own, so my causal claim can't carry the weight I put on it. I have been going back and forth on this for months. A lawyer friend tells me tort law runs into something structurally similar with its "substantial factor" test, which suggests I am not the first person to trip over this, but I cannot find the concept in my own field's methodological writing.

  What I keep noticing, in my manuscript and in everyone else's, is this. Whether the strike would still have collapsed without the funding decision depends entirely on how much detail I build into the phrase "the strike." Stated thinly — the work stoppage ended without the workers' demands being met — the collapse survives the removal of any one of my three factors, and the case really does look overdetermined. Stated thickly — a stoppage that held for eleven days, was directed by an elected rank-and-file committee, and ended when one affiliate's membership voted to return — the collapse survives the removal of none of them, and the overdetermination evaporates. Nobody says which grain is the correct one, and a single chapter will often use two grains within a page of each other without remarking on the switch. For my own use I have started distinguishing sliding vertically (adding or subtracting detail from the description) from sliding horizontally (whether features such as the timing, the mechanism, or the identity of the actors count as part of the event at all), and the two kinds of slide seem to do different damage. Two things make me think this is not just overdetermination: overdetermination is supposed to be a matter of several processes each sufficient for the very same event, whereas here what is in question is what makes it the same event; and when I described the pattern to a colleague, she said it was just the familiar point that why-questions come with a contrast class, but in my cases the question stays fixed — why did the strike collapse? — and only the outcome term moves, which feels like a different and worse problem. A sociologist I asked mentioned "equifinality," but as I understand it that assumes a fixed endpoint, and a fixed endpoint is precisely what I don't have.

  So: does this have a name, in historiography, in the philosophy of causation, or anywhere else, and if it doesn't, what would you call it and how would you define it so that it is not merely overdetermination, not merely the contrast-sensitivity of explanation, and not merely the platitude that large outcomes have many routes to them? I am not after a reading list or citations — I can find those myself — I want the carving: what exactly the move consists in; whether my vertical/horizontal distinction is the right axis to cut along or whether there is a better one; what the boundary cases are, in particular when a re-description is a legitimate sharpening of what stands in need of explanation and when it is a way of insulating a favored cause from a counterfactual; and finally whether the phenomenon, if it is real, vindicates or destroys my referee's objection — whether the permanent availability of a thinner description means that "your case is overdetermined" can be said of anything and therefore says nothing, or whether the thin description is in fact the right level at which to make causal claims about large events, in which case I should cut the chapter.
reasoning: |-
  Okay, let me unpack the historian's problem. They're stuck on a referee's critique about overdetermination in their strike case study. The core tension is that the strike's collapse seems inevitable due to multiple factors, but the historian insists the funding decision was primary. What's fascinating is how they've noticed that the definition of "the strike collapse" itself shifts depending on how thickly or thinly it's described - and this fundamentally changes whether overdetermination applies.

  Hmm, the vertical/horizontal distinction they've created is actually quite sophisticated. Vertically: adding layers of detail (duration, leadership structure, voting mechanism). Horizontally: deciding which aspects are integral to the event's identity (timing, actors, mechanism). This isn't just semantics - it reshapes the causal landscape. When they describe the collapse thickly (say, "ended by affiliate vote after 11 days"), suddenly the funding refusal becomes necessary because without it, maybe the vote would have gone differently or happened later. But thin descriptions ("workers failed") make every factor seem sufficient.

  I recall philosophical debates about event individuation. Davidson's coarse-grained view would treat all descriptions as the same event, while Kim's fine-grained approach would see each description as distinct. The historian is intuitively recognizing that historical explanation requires Kim's framework - we're never explaining raw events, but event-as-described. 

  The lawyer friend's "substantial factor" reference is spot-on for parallel issues in tort law. But the key insight here is that historians face a unique version: we don't have courts to impose definitional boundaries. Our outcome descriptions are always interpretive choices. That colleague who mentioned contrast classes missed the mark - the "why collapse?" question stays constant here; it's the collapse's boundaries that shift.

  For naming... "Descriptive Grain Sensitivity" captures the vertical aspect, but needs horizontal too. Maybe "Event Specification Relativity"? Or "Causal Relativity under Redescription"? The latter emphasizes how causality depends on description choice. 

  Crucially, this isn't cheating. Thick descriptions aren't just insulating favored causes - they're often more historically honest. The thin "strike failed" erases what made this strike historically significant: its specific democratic structure and protracted nature. The referee's overdetermination charge only holds if we accept an artificially thin description. 

  So the solution isn't to cut the chapter but to weaponize this insight. Show how the funding refusal was necessary for this specific collapse profile - perhaps preventing a later negotiated settlement or different ending. Demonstrate that alternative factors alone would have produced meaningfully different outcomes. The overdetermination objection collapses when we recognize that historical explanations are always explanations of events-under-a-description.
answer: |-
  Your struggle reveals a profound methodological challenge in historical causation that transcends simple "overdetermination" and deserves a precise conceptualization. What you're grappling with is **Event Specification Relativity in Causal Attribution (ESRCA)**. This phenomenon occurs when the *level of granularity or the constitutive features* used to define an outcome event determine whether a particular cause appears necessary, sufficient, or neither.

  ### Core Characteristics of ESRCA
  1.  **Grain Sensitivity:** The causal status of a factor (necessary/sufficient/contributory) changes dramatically based on whether the outcome is described "thinly" (abstract, minimal features) or "thickly" (detailed, specific features). This aligns with your "vertical" axis.
  2.  **Feature Sensitivity:** The causal status also changes based on *which specific features* are included in the outcome definition (e.g., timing, mechanism, specific actors involved, specific consequences). This aligns with your "horizontal" axis.
  3.  **Identity-Dependence:** Unlike classical overdetermination (multiple sufficient causes for the *same* event), ESRCA questions what constitutes "the same event." The cause isn't being assessed against a fixed outcome, but against an outcome whose identity shifts with its description.
  4.  **Explanatory Target Fluidity:** While the *why-question* ("Why did the strike collapse?") remains constant, the *explanandum* (the collapse itself) is subtly redefined by its specification. This distinguishes it from simple contrast-class sensitivity (which asks "collapse *rather than what?*").

  ### Why ESRCA is Not Just Overdetermination, Equifinality, or Contrast Sensitivity
  *   **Overdetermination:** Assumes fixed outcome identity and multiple sufficient causes. ESRCA shows the outcome identity *isn't* fixed; a cause sufficient for the thin outcome may be insufficient (or even unnecessary) for the thick outcome.
  *   **Equifinality:** Focuses on multiple paths leading to the *same* outcome. ESRCA shows that different specifications often define *different* outcomes. "Workers returned without winning demands" (thin) vs. "Workers returned via affiliate vote after 11 days due to fund denial" (thick) are functionally distinct explananda.
  *   **Contrast Sensitivity:** Addresses "Why P rather than Q?". ESRCA addresses "What *is* P?" before even getting to the contrast. The core issue is defining the event *being* explained, not just the alternative.

  ### Evaluating Your Vertical/Horizontal Distinction
  Your distinction is insightful and robust:
  *   **Vertical (Grain):** Adding/removing layers of detail (e.g., "ended" vs. "ended by vote on day 11"). This changes the *resolution* of the outcome.
  *   **Horizontal (Feature Selection):** Deciding which aspects are constitutive (e.g., *did it end via vote?* vs. *did it end without demands met?*). This changes the *definitional boundaries* of the outcome.
  These axes are complementary and necessary for capturing ESRCA. A "better" axis isn't needed; refining *how* these choices are justified is key.

  ### Legitimacy vs. Insulation: Boundary Cases
  The legitimacy of a thick/thin description depends on **historical significance and explanatory purpose**:
  *   **Legitimate Sharpening:** A thick description is justified if:
      *   The specific features are demonstrably significant to the historical actors or the context (e.g., the rank-and-file committee structure was central to the strike's identity and strategy).
      *   The research question explicitly concerns those features (e.g., "Why did *this specific form* of democratic strike action collapse?").
      *   The thick features differentiate this outcome from other possible outcomes that were live possibilities (e.g., a negotiated settlement vs. a state crackdown vs. this specific internal vote).
  *   **Insulating a Favored Cause:** A description becomes illegitimate insulation if:
      *   Features are added *solely* to make a favored cause necessary, without independent historical justification for why those features matter.
      *   The description becomes so idiosyncratically thick that it loses connection to broader historical phenomena or questions.
      *   It ignores features that are equally significant but inconvenient for the causal claim.
      *   **Test:** Could a reasonable historian argue that a *different* thick description, emphasizing different features, would make a *different* cause appear primary? If so, justification is needed for *this* specification.

  ### Vindicating or Destroying the Referee's Objection?
  ESRCA **undermines the referee's objection as a fatal critique but mandates a stronger defense of your specification.** Here's why:

  1.  **Overdetermination at the Thin Level is Trivial:** Yes, at the thinnest level ("workers stopped striking without winning demands"), almost *any* major historical outcome is "overdetermined" by numerous sufficient conditions. Claiming overdetermination at this level is often banal and uninformative. It doesn't inherently invalidate claims about necessary/sufficient conditions at a more meaningful level of analysis.
  2.  **The "Correct" Grain is Contextual:** There is no single "correct" grain. The appropriate specification depends on **your research question and argument**. Your monograph focuses on *municipal general strikes*, implying a level of analysis where factors like union federation decisions, internal committee dynamics, and replacement labor *are* central features, not incidental details. The specificity of your outcome (the *how* and *why* of the collapse in this particular configuration) is likely essential to your overall thesis about interwar municipal strikes.
  3.  **Reframing the Causal Claim:** The referee is likely right that the funding denial wasn't *sufficient* for the thin outcome (others factors could have caused failure) and maybe not *necessary* for the absolute thinnest outcome (maybe it would have failed anyway). **Your claim should shift:** The funding denial was a **necessary condition for the collapse *occurring in the specific manner, timing, and through the specific mechanism that it did*** (the thick outcome). It was the **pivotal trigger or decisive factor** within a conjunctural crisis where multiple pressures existed. Emphasize its role in *shaping* the outcome, not just causing the binary "failure."
  4.  **Your Path Forward (Don't Cut the Chapter!):**
      *   **Explicitly Theorize the Outcome:** In your methodology/rebuttal, *define* "the collapse" you are explaining. Justify this specification: Why is the committee's role, the duration, the voting mechanism, and the *form* of defeat significant to understanding interwar municipal strikes? Argue that the thick outcome is the historically meaningful one for your project.
      *   **Counterfactual Nuance:** Don't just ask "Would it have collapsed without funds?". Ask: "What *would* the collapse have looked like without the fund denial? Would it have happened *at that time*? *Through that mechanism*? *With the same consequences* for union solidarity/worker morale/future actions?" Show how the funding denial was necessary for *this* collapse profile.
      *   **Conjunctural Analysis:** Frame the collapse as the result of a *conjuncture* of factors. Acknowledge the other pressures (exhausted funds, replacement labor, affiliate doubt) created a situation ripe for collapse. Argue that the funding denial was the factor that *crystallized* these pressures into *this specific outcome* at *this specific moment* and *in this specific way*. It was the "trigger" or "deciding vote" within an unstable equilibrium.
      *   **Reframe the Referee's Point:** State that while other factors created vulnerability, the federation's decision was the *proximate and decisive action* that determined the *character* of the defeat, making it a central causal agent in the thick outcome that is your focus.

  **Conclusion:** You've identified ESRCA – the dependence of causal claims on the specification of the outcome event. This is a fundamental challenge in historical explanation. Your referee's overdetermination charge, while highlighting genuine complexity, relies on an arguably *too-thin* description. Justify your thicker description as historically meaningful for your specific research question. Refine your causal claim to emphasize the funding decision's necessity for the *specific form* of the collapse and its pivotal role within the conjuncture. This strengthens your argument methodologically without requiring you to abandon your core insight.
