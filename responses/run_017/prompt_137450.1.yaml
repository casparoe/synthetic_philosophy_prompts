answer: |-
  ## The Semantic Gulf: Why Indicative and Subjunctive Conditionals Demand Distinct Foundations

  The persistent gap between indicative (“If Dev didn’t open the safe, Mo did”) and subjunctive conditionals (“If Dev hadn’t opened the safe, Mo would have”) has fueled a central debate in conditional semantics: is this divergence merely pragmatic, reflecting how context fixes the relevant background information for a *single* conditional operator, or is it semantic, signalling fundamentally different operators governed by distinct selection functions? While pragmatic univocalism offers elegant parsimony, a close analysis of key data—particularly the common-cause case—reveals its fatal inadequacies. The evidence compels a semantic bifurcation: indicative conditionals are epistemic, operating over an evidential selection function holding fixed known correlations; subjunctive conditionals are metaphysical, operating over a nomological selection function holding fixed causal laws and pre-existing facts. This distinction isn’t contextual trimming; it’s foundational architecture.

  **The Pragmatic Univocalist Hope (and Its Shortcomings)**

  Pragmatic univocalism (inspired by Stalnaker, defended by von Fintel, Gillies) posits a single conditional operator. The difference between moods, it claims, stems solely from how context constrains the *modal base*—the set of worlds considered relevant. Indicatives constrain the base to worlds compatible with the speaker’s current knowledge; subjunctives constrain it to worlds sharing the actual past and laws up to the antecedent time. This explains core data:

  *   **Known-Disjunction (Case 1):** The indicative works because restricting to knowledge-compatible worlds (where the safe *was* opened by Dev or Mo) makes ‘Mo did’ true in every world where ‘Dev didn’t’ holds. The subjunctive fails because holding fixed the actual past (where only one opened it) requires a non-actual past miracle to make Dev not open it, leaving Mo’s action contingent and unguaranteed.
  *   **Known-False Antecedent (Case 3):** Subjunctives readily handle known-false antecedents because the modal base is explicitly non-actual. Indicatives struggle because adding a known-false antecedent (`Dev didn’t open it`, when we know he did) renders the modal base *empty* or forces massive knowledge revision, violating the conversational maxim of Relevance.
  *   **Open-Future (Case 4):** Univocalism handles these seamlessly. Both moods use the same operator. The indicative (`will go off`) signals the speaker treats the antecedent as a live epistemic possibility within the current knowledge base. The subjunctive (`would go off`) signals the speaker treats it as a non-actual, counterfactual possibility relative to their current expectations or assumptions about the future’s unfolding. The difference is epistemic stance, not semantic structure.

  However, univocalism stumbles catastrophically on the **common-cause case (Case 2)**. We know the hidden variable H at 11:00 fixes both the coin flip outcome at noon (C) and the envelope printout at 11:05 (E). We observe neither. Consider:

  *   Indicative: “If the coin landed tails (C_tails), the envelope says tails (E_tails).” **Fine.** Restricting to worlds compatible with our knowledge (which includes the perfect correlation caused by H), any world where C_tails holds must also have H set to cause tails, hence E_tails holds. The conditional is true.
  *   Subjunctive: “If the coin *had landed* tails (C_tails), the envelope *would have said* tails (E_tails).” **False.** Holding fixed the actual past and laws (including H’s actual setting, say H_heads), the “nearest” C_tails world requires a small miracle overriding H’s influence on the coin flip *just before noon*. Crucially, H itself (set at 11:00) and its direct effect on the envelope (E_heads at 11:05) remain fixed. In this world, C_tails is true but E_heads is true. The envelope *does not* say tails. Interventionally, intervening to force C_tails doesn’t change H, so E remains heads.

  *Univocalism’s Fatal Flaw:* The pragmatic view claims the *only* difference is the constraint on the modal base (knowledge vs. past+laws). But here, the *very same background knowledge* (knowing the causal structure and perfect correlation) is present for both conditionals. If univocalism were correct, context should easily fix the modal base appropriately for each mood using this *same* knowledge. Yet, we judge the indicative true and the subjunctive false *based on this identical knowledge*. This is impossible if the conditional operator is the same. The moods are triggering fundamentally different ways of processing the supposition `C_tails` relative to that knowledge. The indicative retains the *correlation* as evidence; the subjunctive retains the *causal structure and actual past state (H)*, breaking the correlation for the counterfactual supposition.

  **The Semantic Bifurcation: Evidence vs. Worlds**

  This demands a semantic split. Indicatives (`If A, C`) express high conditional probability of C given A, relative to the current epistemic state: **P(C|A) is high**. Their selection function finds the *most epistemically plausible* A-worlds given current evidence. Crucially, **supposing A means suspending *only* propositions directly contradicted by A, retaining all other evidence, including known correlations (Case 2).** Truth depends on the resulting probability distribution over the live possibilities.

  Subjunctives (`If A had been, C would have`) involve a metaphysical, similarity-based selection function. They hold fixed the actual past and laws as much as possible. **Supposing A involves minimally changing the actual world’s history via small miracles to make A true, while preserving the actual pre-antecedent past and causal/nomological structure.** Known correlations are *not* retained if they are effects of common causes; only the underlying structure is fixed.

  This bifurcation cleanly resolves all cases:

  1.  **Known-Disjunction:** Indicative retains knowledge `Dev or Mo`, so `~Dev` worlds are `Mo` worlds. Subjunctive holds fixed the actual past where one specific person did it; minimally changing to `~Dev` doesn’t guarantee Mo did it (he might have been asleep).
  2.  **Common-Cause (Decisive):** Indicative retains the known correlation (part of the evidence), so `C_tails` implies `E_tails`. Subjunctive holds fixed the actual H and laws; minimally changing to `C_tails` (via a coin-specific miracle) leaves H and E unchanged (`E_heads`). Hence, `E_tails` is false.
  3.  **Known-False Antecedent:** Indicative: Supposing a known falsehood `A` forces radical revision of the epistemic state, making evaluation undefined or contextually inappropriate. Subjunctive: Explicitly designed for non-actual suppositions; no issue.
  4.  **Open-Future:** Semantic mood marks *modal remoteness*, not counterfactuality. Indicative (`will`) presents A (`Dev late`) as an open, epistemically possible future branch. Subjunctive (`would`) presents A as a counterfactual alternative *relative to the speaker’s current expectations or assumptions* about the default future (e.g., assuming Dev *will* be on time). Case 4 poses no problem; it highlights mood’s role in signalling epistemic distance, consistent with the semantic distinction. (It’s less load-bearing for *this specific debate* than Cases 2 & 3, as both views can accommodate it, but fits neatly within the semantic account’s mood-as-remoteness view).

  **Addressing Retention and CEM**

  (a) **Supposition & Retention:** Your assumption is correct *in spirit*, but the *kind* of retention differs fundamentally. For indicatives, supposing A means suspending only propositions *logically incompatible* with A, retaining all other *evidential knowledge* (including correlations like Case 2). It’s about preserving the probabilistic relations of the current epistemic state under the supposition. For subjunctives, supposing A means preserving the actual *causal/nomological structure and pre-antecedent history*, making minimal, law-respecting changes to bring about A. The retention isn’t about which *facts* to keep, but about which *kind of structure* (evidential vs. causal/nomological) governs the selection of relevant worlds. **The difference *is* in the kind of ordering: indicatives use an epistemic plausibility ordering, subjunctives use a metaphysical similarity ordering.**

  (b) **Conditional Excluded Middle (CEM):**
  *   **Indicatives:** CEM (`Either (If A, C) or (If A, ~C)`) generally *holds* pragmatically. Given sufficient context and a shared epistemic state, supposing A will typically make either C or ~C highly probable. Vagueness or ignorance might make both unassertable, but one must be true relative to the evidence. Case 1 exemplifies this: `If ~Dev, Mo` is true; `If ~Dev, ~Mo` is false given the evidence.
  *   **Subjunctives:** CEM *fails*. Metaphysical similarity orderings can be indeterminate. There might be equally close A-worlds where C holds and where ~C holds. “If the coin had landed tails, Mo would have opened the safe” vs. “… Dev would have…” might both be false if there’s no fact about which would have happened in the closest tails-world. Case 2 reinforces this: “If the coin had landed tails, the envelope would have said tails” is false, but “If the coin had landed tails, the envelope would have said heads” is *also* false (it *does* say heads in the closest world). The envelope’s state is determined by H, which is held fixed. **This divergence is a *strength* of the semantic view.** It correctly predicts that indicatives, tied to epistemic probability, generally obey CEM, while subjunctives, tied to potentially indeterminate similarity, do not. Univocalism struggles to explain why the *same* operator would exhibit such different logical behavior solely based on the modal base.

  **Verdict: The Semantic Gulf Stands**

  The pragmatic univocalist attempt to reduce the mood distinction to context fails the decisive test of common causation (Case 2). Identical background knowledge yields divergent truth judgments for indicatives and subjunctives because the moods invoke fundamentally different semantic operations: one navigates the space of epistemic possibility, holding evidence fixed; the other navigates the space of metaphysical possibility, holding laws and history fixed. Cases 1 and 3 further illustrate the distinct logic of supposition each mood employs, while the open-future (Case 4) aligns with mood marking remoteness within this bifurcated framework. The differing predictions regarding CEM solidify the case. While context plays a role in fleshing out specifics (e.g., the similarity metric for subjunctives, the precise epistemic state for indicatives), the core distinction between evidential and metaphysical selection functions is semantic. The gap is not bridged by pragmatics; it is carved deep into the meaning of the conditional moods themselves. We must embrace semantic dualism.
