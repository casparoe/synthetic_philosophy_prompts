prompt: |-
  I am the scientific secretary and non-voting chair of the review panel for a national research council's mid-sized investigator grants. We run three cycles a year. Each cycle is two and a half days, twelve panelists, roughly seventy proposals, and about six million dollars; our ranked list then goes to a council that can and occasionally does send it back. The panelists are senior working researchers who are paid nothing, receive no training in judgement and decision making, and are rotated a third at a time, so I can assume neither continuity nor shared vocabulary, and I cannot add a training day or a second pass over the batch. What I can change is the procedure inside the room and the schedule going in, provided I can defend each change on a single page to a council of non-specialists and to panelists who will resent anything that feels like bureaucracy.

  Our current process, in the order it happens: two lead reviewers per proposal read it in full and send me written pre-scores forty-eight hours ahead; the other panelists receive the abstract and a one-page summary of the leads' comments. I open each item with a one-sentence characterisation of where I think it sits. Discussion then runs in a fixed seating order, after which scores are entered sequentially on a shared screen with the running mean visible, and any score diverging by more than 1.5 points from that mean must be accompanied by a typed justification. Proposals are scheduled grouped by host institution, so the panel frequently hears four or five from the same university in a row. One panelist each cycle participates asynchronously and posts written comments that the room reads before anyone speaks. There is no feedback loop: we learn what we got right years later, if at all.

  I would like a decision procedure, not an exposition of the theory. What I have in mind has three parts.

  First, a real-time diagnostic: an ordered set of questions I can run in about ninety seconds, using only what is observable in the room plus the pre-scores that only I hold, that sorts the current state of a proposal into at least these buckets — genuine convergence on shared evidence; an informational cascade; reputational or conformist herding; structurally mandated deference to the lead reviewers, who are the only people who have read the thing; and spillover from a neighbouring proposal or from the run of items from the same institution. For each question, state what observable would count as a sufficient positive, what that question cannot in principle distinguish from what it is meant to detect, where the procedure simply stops with "no intervention", and where it must hand the decision back to a person because the issue is one of values rather than facts.

  Second, a remedial ladder: an ordered menu of interventions from least to most intrusive, each attached to the diagnosis that triggers it, with what it costs in minutes, in goodwill, and in information. The standard literature distinguishes herding that comes from people rationally discounting their own private signals against a public record from herding that comes from the social cost of being seen to be wrong; keep that distinction wherever it changes what I should actually do, and say explicitly where the remedies for the two pull in opposite directions, which one governs when both diagnoses are live, and why.

  Third, the ex ante fixes: what I should change before the next cycle, and in what order of priority, given a one-page justification budget and a panel that will not tolerate extra form-filling. Please rule specifically on the deviation-and-justification rule, on speaking order, on whether and when I should speak at all, on the institutional grouping in the schedule, and on the asynchronous panelist whose comments are read first and cannot be cross-examined.

  Then please run the procedure on three cases. Case A: the first speaker, a well-known and well-liked figure, gives a proposal a nine and a confident rationale; the next five come in between eight and nine with reasons that are recognisably paraphrases of his; the two lead reviewers' private pre-scores, which I alone hold, were six and four. Tell me what I do in the next five minutes, and in particular whether and how I use the pre-scores. Case B: a proposal that everyone has in fact read, in an area where this particular panel is unusually expert, and which is genuinely in the top decile of the batch — the false-positive control, where I need the procedure to output "leave it alone" and to tell me which observable does that work. Case C: an unfashionable cross-disciplinary proposal from an early-career investigator at an institution nobody has heard of, scheduled immediately after a run of five strong proposals from our flagship university, which the panel is drifting toward rejecting in a way that looks to me like nobody wanting to be the person who championed a soft topic. I think it is good and my instinct is to rescue it. I want the procedure's answer, and I want you to take seriously that the honest answer may be that I should not intervene, or should intervene only through a mechanism that binds me equally when I am wrong: tell me what a discretionary rescue by the chair teaches the panel about how to read my interventions, and what that does to the process over the remaining day and a half.

  Finally, tell me what the procedure cannot do. I am aware that we have no ground truth within a cycle, that a correct convergence and a lucky cascade are indistinguishable from the outcome of one meeting, and that nothing in this fixes errors that the whole panel shares because the whole field shares them. Say where the procedure will misfire, which of its steps are judgement calls dressed up as procedure, and which parameter — I suspect something like our tolerance for funding risky proposals at the expense of safe ones — is a value choice that the procedure should surface and then leave to the council rather than settle for them.
reasoning: |-
  Okay, the user is the scientific secretary and non-voting chair of a review panel for national research grants. They have a complex, time-pressured environment with rotating senior panelists who have no training in decision-making. The current process has several pain points: potential herding, institutional grouping leading to biases, asynchronous participation without cross-examination, and no feedback loop. They need a practical decision procedure with three parts: a real-time diagnostic, a remedial ladder, and ex ante fixes. Also, they want the procedure applied to three specific cases and an acknowledgment of its limitations.

  First, I need to understand the user's core challenges. They can't change the panel composition or add training days, but they can tweak the procedure and schedule. The panelists are time-constrained and resistant to bureaucracy, so any changes must be justifiable in a one-page document. The key issues are biases from herding, institutional grouping, and deference to leads, plus the lack of ground truth.

  For the real-time diagnostic, I need a quick set of questions. Observables include pre-scores, discussion patterns, and speaker behavior. Buckets include genuine convergence, informational cascade, reputational herding, mandated deference, spillover effects. Each question needs clear observables, limitations, and when to stop or escalate.

  The remedial ladder should start minimally intrusive to preserve goodwill. Options: ask for dissenting views, prompt specific panelists, request evidence, anonymous polling. Distinguish between rational herding (correcting private signals) and social herding (fear of dissent), as remedies differ. For rational herding, more information helps; for social herding, anonymity or structured dissent is better.

  Ex ante fixes: shuffle proposal order to avoid institutional runs, randomize speaking order, modify the deviation rule to apply after leads speak, restrict chair's opening statements, manage asynchronous input by integrating it later. Prioritize fixes that reduce bias without adding paperwork. Justification for each: reduces spillover, promotes independence, balances deference.

  Applying to Case A: Herding is evident with high scores despite low pre-scores. Diagnostic flags cascade. Remedial step: prompt leads privately. Don't reveal pre-scores to avoid bias. Instead, ask leads to share initial impressions, prompting reevaluation without chair interference.

  Case B: Genuine convergence. Diagnostic checks if leads agree, discussion is evidence-based, scores cluster tightly. Observables: consistent pre-scores, diverse independent comments. No intervention needed. Key observable is congruence between leads and panel without red flags.

  Case C: Spillover and social herding. Diagnostic shows low engagement after strong proposals. Remedial ladder: reset context, anonymous straw poll. Protects early-career researcher without chair bias. If poll shows support, discussion continues; if not, accept rejection. Avoids discretionary rescue, maintaining process integrity.

  Limitations: Can't fix shared field biases, distinguish lucky cascades from correct decisions, or resolve value conflicts like risk tolerance. The procedure surfaces these for council decision. Judgment calls exist in diagnostics, especially distinguishing herding types, but structured steps reduce arbitrariness.

  User's deeper needs: They want to reduce biases while maintaining panel autonomy and trust. They need defensible, low-friction changes that don't overwhelm panelists. The unspoken need is to legitimize the process, ensuring fairness without appearing manipulative. By focusing on observables and gradual interventions, the procedure builds credibility and addresses systemic flaws without overstepping.
answer: |-
  Here is a battle-tested decision procedure designed for your constraints, focusing on observables, minimal disruption, and defensible interventions. It prioritizes surfacing hidden information and breaking predictable bias patterns.

  **Core Principle:** Intervene only to disrupt *systematic* decision failures (herding, deference, spillover), not to impose the chair's judgment. Your role is process referee, not content arbiter.

  ---

  ### I. Real-Time Diagnostic (90-Second Checklist)
  *(Run silently after discussion but before scoring begins for each proposal. Use only: pre-scores, observable discussion dynamics, speaker sequence, proposal context)*

  1.  **Lead Congruence Check:** Do the two lead reviewers' pre-scores differ by >2.0 points? *(Sufficient Positive: Yes. Cannot Distinguish: Genuine expert disagreement vs. one lead being an outlier. Stop/No Intervention: If difference ≤2.0).*
  2.  **Discussion Origin:** Did ≥2 *non-lead* panelists initiate substantive comments *before* any lead spoke? *(SP: Yes. Cannot Distinguish: Independent evaluation vs. pre-discussion collusion. Stop: If Yes).*
  3.  **Argument Diversity:** During discussion, did ≥3 distinct *reasons* (not just agreement phrases) supporting/opposing the proposal emerge from ≥3 different panelists? *(SP: Yes. Cannot Distinguish: Genuine consensus vs. subtle herding on different justifications. Stop: If Yes).*
  4.  **Deviation Handling:** Did any panelist express significant dissent (>1.5 points implied) *during discussion* and get substantively engaged by others? *(SP: Yes. Cannot Distinguish: Healthy debate vs. tokenism. Stop: If Yes).*
  5.  **Institutional/Recency Spillover Risk:** Is this proposal from the same institution OR on a very similar topic/method as the immediately preceding proposal? *(SP: Yes. Cannot Distinguish: Legitimate comparison vs. lazy grouping. Always proceed to Q6 if Yes).*
  6.  **Reputational Anchor:** Did the *first speaker* hold a very strong opinion (implied score 9/10 or 1/2) AND are they a highly senior/dominant figure? *(SP: Yes. Cannot Distinguish: Deserved authority vs. deference. Stop: Only if Q6=No).*
  7.  **Values Check:** Is the core disagreement fundamentally about *what constitutes good science* (e.g., high-risk vs. incremental, theoretical vs. applied) rather than feasibility, methods, or significance? *(SP: Yes - Hand Back to Panel. Cannot Distinguish: Genuine values conflict vs. disguised factual disagreement. Stop: If No).*

  *Diagnosis Output (Based on Pattern):*
  *   **Genuine Convergence:** Q1=Stop, Q2=Yes/Stop, Q3=Yes/Stop, Q4=Yes/Stop. *(No Intervention)*
  *   **Informational Cascade:** Q2=No, Q3=No, Q6=Yes. *(Likely needs Intervention - Ladder Step 1 or 2)*
  *   **Reputational/Conformist Herding:** Q2=No, Q4=No, Q6=Yes. *(Likely needs Intervention - Ladder Step 2 or 3)*
  *   **Mandated Deference to Leads:** Q2=No, Q3=No, Q4=No, Q6=No/Stop. *(Likely needs Intervention - Ladder Step 1)*
  *   **Spillover (Institutional/Recency):** Q5=Yes + (Q2=No OR Q3=No). *(Likely needs Intervention - Ladder Step 1)*
  *   **Values Conflict:** Q7=Hand Back. *(Remedial Ladder Step 0 - Explicit Values Surfacing)*

  ---

  ### II. Remedial Ladder (Least to Most Intrusive)
  *(Triggered by Diagnostic Output. Costs: Minutes/Goodwill/Info)*
  *   **Step 0: Values Surfacing (Q7=Hand Back):** "Panel, it sounds like the core debate here hinges on [state value conflict, e.g., 'how much risk is appropriate']. Before scoring, briefly restate your position *specifically on that value*. Let's ensure we're not talking past each other." *(Cost: 2-3 min / Low Goodwill Hit / High Info - Clarifies debate basis)*
  *   **Step 1: Targeted Lead Prompt (Cascade, Deference, Spillover):** "Lead Reviewer A, your initial view seemed cautious/optimistic compared to the room's direction. Could you briefly recap the *strongest single point* supporting that initial perspective now that we've heard others?" *Then ask Lead Reviewer B the same.* Forces leads' private signals public *after* others speak, disrupting deference/cascade. *(Cost: 1 min / Very Low Goodwill / Medium-High Info - Surfaces key counter-evidence)*
  *   **Step 2: Structured Dissent Elicitation (Herding, Cascade):** "Before we score, let's quickly go around the table *in reverse order* from the last speaker, *only* asking: 'Does anyone currently hold a score differing by more than 1.5 points from the apparent consensus? Just state it and one sentence why.'" Breaks sequence bias, protects dissenters by making it a group exercise. *(Cost: 2 min / Moderate Goodwill (feels procedural) / High Info - Forces latent dissent public)*
  *   **Step 3: Anonymous Straw Poll (Persistent Herding, Strong Cascade):** "Given the range of views, let's take a quick, anonymous straw poll before final scores. On your private note: Score 1-10. Don't overthink it." Chair reads the range/distribution (not mean!). "Okay, that shows us [e.g., 'a wider spread than the discussion suggested']. Let's discuss key points again for 2 minutes focusing on the high/low outliers." *(Cost: 3 min / Moderate-High Goodwill Hit (feels bureaucratic) / Very High Info - Reveals true spread, resets anchoring)*

  *Rational Herding (Discounting Private Signal) vs. Social Herding (Fear of Being Wrong):*
  *   **Rational Herding:** More likely when leads/public signal are genuinely expert. *Remedy Focus:* Step 1 (Surface leads' original reasoning) & Step 3 (Reveal true distribution to update rationally). Adding *more* credible info helps.
  *   **Social Herding:** More likely with dominant first speakers, unpopular topics, or high-status institutions nearby. *Remedy Focus:* Step 2 (Protect dissent) & Step 3 (Anonymity breaks social pressure). Reducing *observability* of early judgment helps.
  *   **Both Live:** Social herding often overrides rational herding in group settings. **Step 3 (Anonymous Poll) governs** as it addresses both: it injects new information *and* removes social pressure simultaneously. If Step 3 isn't justified, prioritize **Step 2** for social herding.

  ---

  ### III. Ex Ante Fixes (Prioritized with Justification)
  *(Justification Theme: "Reduces predictable bias, increases independence, minimal burden")*

  1.  **Shuffle Proposal Order:** Randomize order *within* broad thematic clusters. **Priority: HIGH.** *Justification:* Eliminates institutional spillover bias immediately. Prevents "comparison fatigue" against strong/weak runs. No added burden.
  2.  **Modify Deviation Rule:** Require typed justification *only* for scores differing by >1.5 points **from the final mean, entered AFTER leads have spoken and Step 1 (if triggered) is complete.** *Priority: HIGH.* *Justification:* Prevents the visible running mean from anchoring the panel *during* scoring. Justifications remain useful for council review but don't distort the *scoring process* itself. Reduces conformity pressure.
  3.  **Randomize Initial Speaking Order:** Rotate who speaks first *per proposal*. **Priority: MEDIUM.** *Justification:* Breaks the fixed anchor point, reducing first-speaker dominance and reputational herding risk. Easy to implement ("Next proposal, we'll start with Dr. Chen").
  4.  **Chair's Opening Sentence:** **Stop doing this.** Replace with: "Leads, please confirm you've seen no conflicts. Panel, abstracts/comments are before you. Who would like to start the discussion?" *Priority: MEDIUM.* *Justification:* Removes chair's subtle anchoring and avoids implying a pre-judgment. Forces panel ownership immediately.
  5.  **Asynchronous Panelist:** Their comments must be posted *after* live discussion concludes but *before* scoring begins. **Priority: MEDIUM.** *Justification:* Preserves their input but prevents their written word (un-cross-examined) from anchoring the entire live discussion. Ensures live debate is primary. Respects their time while integrating fairly.
  6.  **"No Form-Filling" Rule:** Maintained. All changes are procedural within the meeting room.

  ---

  ### Case Applications

  *   **Case A (Dominant First Speaker, Low Pre-Scores):**
      *   **Diagnostic:** Q1 (Leads 6 vs 4 - Difference>2.0? **YES**), Q2 (Non-leads speak first? **NO**), Q3 (Argument Diversity? **NO** - paraphrasing), Q4 (Dissent engaged? **NO**), Q6 (Strong First Speaker? **YES**). → **Diagnosis: Informational Cascade + Reputational Herding.**
      *   **Remedial Ladder:** Trigger **Step 1 (Targeted Lead Prompt):** "Lead Reviewer A, your pre-meeting view was noted as cautious. What was the single biggest concern driving that view? Lead Reviewer B, what was your main reservation?" *Do NOT reveal pre-scores.* This surfaces the counter-evidence *after* the cascade has started. *Then* proceed to scoring. **Cost:** 1 minute. **Why not pre-scores?** Revealing them would be chair overreach, destroy trust in leads, and likely cause resentment. The *reasons* matter more than the numbers.
  *   **Case B (Genuine Top Decile Proposal):**
      *   **Diagnostic:** Q1 (Assume leads 9 & 8? → **Stop**), Q2 (Non-leads likely spoke early/independently? → **Yes/Stop**), Q3 (Diverse, specific praise? → **Yes/Stop**). → **Diagnosis: Genuine Convergence.**
      *   **Action: NO INTERVENTION.** Proceed to scoring. **Key Observable:** Q2 = Yes AND Q3 = Yes. This shows independent validation beyond the leads and diverse evidence-based support, making cascade/herding very unlikely.
  *   **Case C (Unfashionable Proposal After Strong Run):**
      *   **Diagnostic:** Q5 (Same institution as prior run? **NO**, but topic/method likely dissimilar → **Proceed**), Q2 (Non-leads speak first? **UNLIKELY** - drift suggests disengagement), Q3 (Argument Diversity? **LOW** - likely vague negatives), Q4 (Dissent Engaged? **NO**), Q6 (First Speaker Strong? **Possibly, but not key**). Context suggests **Spillover (Recency/Institutional Awe) + Social Herding** (fear of championing "soft" topic).
      *   **Remedial Ladder:** Trigger **Step 3 (Anonymous Straw Poll).** "Given the quieter discussion, let's take a quick anonymous temperature check before final scores. Score 1-10 privately." Read the range. *If range is wide (e.g., 3 to 8):* "Okay, we have a real spread here from [low] to [high]. Let's spend 2 minutes focusing specifically on what's driving the high and low scores." *If range is narrow and low (e.g., 3-5):* "Consensus seems clear, we'll note the score." **Resist Your Instinct!** A discretionary rescue teaches the panel that the chair will save pet projects, undermining all future interventions and encouraging lobbying. Step 3 binds you: if the *panel's* anonymous vote shows support, discussion is revived fairly; if not, it reflects their judgment, not your restraint. Protects the early-career researcher *if* there's latent support suppressed by social pressure, without chair bias.

  ---

  ### What the Procedure Cannot Do

  1.  **Distinguish Correct Convergence from Lucky Cascade:** With no ground truth within the cycle, a flawless process can fund a bad project (Type I) or reject a good one (Type II). This procedure only minimizes *systematic* group failures, not random error or genuine shared misjudgment.
  2.  **Fix Shared Field Biases:** If the entire panel (and field) undervalues cross-disciplinary work, risky proposals, or certain methodologies, the procedure will reflect that bias. It surfaces the *nature* of the convergence (Diagnostic Q7), but cannot correct it.
  3.  **Eliminate Judgment Calls:** The Diagnostic (esp. Q3, Q4, Q7) and the decision to trigger the Ladder involve chair judgment. It's procedure *guiding* judgment, not replacing it. Justification must be based on *observables*.
  4.  **Resolve Value Conflicts:** It surfaces them (Q7, Step 0) but cannot decide them. That *must* be left to the panel/council. The key surfaced parameter is **Risk Tolerance** (high-risk/high-reward vs. incremental/safe). The procedure flags when this is the core dispute.
  5.  **Guarantee "Right" Answers in Case C:** It ensures a fair *process* for the unfashionable proposal, not a specific outcome. Your role is fair referee, not savior.
  6.  **Fix Asynchronous Input Limitations:** While better integrated (comments after discussion), the lack of cross-examination remains a weakness the procedure can only mitigate, not solve.

  **Key Judgment Call Dressed as Procedure:** Diagnosing the *type* of herding (Informational vs. Social) to choose between Ladder Step 2 or Step 3. Rely on the Diagnostic: Strong first speaker (Q6=Yes) + lack of early non-lead input (Q2=No) leans Social → Step 3. Lack of Q6 trigger but poor discussion diversity (Q3=No) leans Informational → Step 2. When unsure, Step 3 is the safer default.

  This procedure maximizes fairness and minimizes systematic bias within your stringent constraints, using observables and escalating minimally intrusive interventions. It defends itself by focusing on *process failures* anyone can recognize, not scientific judgment.
