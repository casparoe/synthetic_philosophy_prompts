prompt: |-
  yo — I keep going back and forth on what makes a given glyph an instance of the letter a (the Letter Spirit question), so I want to know what principle I actually hold. My verdicts, by gut: the single-storey a I write by hand, where the bowl doesnt quite close = an a. The very same shape printed as the phonetic symbol ɑ in a chart where both a and ɑ are listed as separate symbols = I no longer know which one it is, which feels inconsistent of me. A mirror-image a (bowl on the wrong side) written by a four-year-old = still an a, just badly formed. The same glyph rotated 180° = not an a at all. A stencil a whose bowl is broken into two arcs by the bridges = an a. The double-storey a from a blackletter face that I can only read once im told the word = an a, but grudgingly. Comic Sans a and Didot a = both a, even though they share basically no strokes.

  My tentative principle: something is an a iff (i) whoever made it was trying to make an a, and (ii) a reader who knows the alphabet but has never seen the font reads it as an a unaided. But the clauses come apart — a diffusion-model glyph that comes out a perfect a with nobody trying, and the kids mirror-a where the trying is there and the reading isnt — and I cant tell which clause to keep.

  Give me exactly five numbered items, a sentence or two each, no intro and no outro: (1) the principle you think fits these verdicts, (2) which clause of mine you keep, drop, or repair, and why, (3) your verdict on a designers glyph deliberately halfway between a and o — a bowl with a tiny stem nub — which I flip-flop on, (4) your verdict on a 3D-printed a photographed at an angle where the bowl foreshortens into an oval on a stick, (5) one case youd put to me that separates your principle from mine.
