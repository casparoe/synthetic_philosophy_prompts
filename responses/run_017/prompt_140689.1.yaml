prompt: |-
  I'm on a hiring committee in a physics department right now, and I keep hearing the word "fundamental" used as if it settled an argument. It happened twice in one week. First we passed on a condensed-matter candidate — genuinely strong record, great letters — because a senior colleague said her work was "phenomenology, not fundamental physics." Then at the next meeting the same colleague argued for a string theory hire on the grounds that the Standard Model obviously isn't fundamental, since it's just an effective field theory, so there has to be something deeper underneath it. I did some philosophy as an undergrad and vaguely remember words like grounding and fundamentality, and now I can't work out what any of this presupposes.

  So: what view of fundamentality does this kind of practice actually presuppose — physics departments and funders sorting particle physics and cosmology into "fundamental" buckets while condensed matter, materials and biophysics get labelled "applied," and philosophers doing the same thing when they call their work "fundamental metaphysics" and assume mental and social facts are grounded in physical ones rather than the reverse?

  As far as I can tell the word is doing at least four different jobs in these meetings, and they come apart: (1) smallest length scale; (2) maximal generality — the theory that quantifies over everything, with no domain restrictions; (3) brute, i.e. not itself explained by anything else, the thing everything else is "nothing over and above"; (4) the level from which the rest could in principle be derived. My problem is that these don't obviously cohere, and I can't tell whether the practice needs any of them or whether it's compatible with several, or with none.

  One more wrinkle. A philosopher friend mumbled something at dinner that I half understood: that grounding might not be well-founded at all — maybe the dependence relations descend forever, or levels form a partial order with lots of incomparable peaks rather than a single tidy tower, so "the fundamental layer" fails to refer. If that's right, what happens to a hiring and funding practice that silently assumes one well-ordered tower with a bottom?

  Reconstruct the implicit theory for me, and separate the parts the practice strictly presupposes from the parts it merely sits comfortably with. Tell me whether a purely pragmatic story — prestige, expected value of information, path dependence, what's cheap to test right now — could license exactly the same behavior, in which case all the metaphysics is decoration. And be concrete about what would change if we swapped in each reading: my guess is that under the brute/unexplained reading you'd fund whatever is currently unexplained, which would move money to the measurement problem and away from new particles, and that under the derivability reading you'd have to cash out "in principle" and deal with the fact that most macroscopic phenomena seem decoupled from the microscopic details — but I want that spelled out properly, including where my own stab at a criterion (F is more fundamental than G if you have to hold F fixed to explain G but not vice versa) is circular or useless.

  Also please say something about the bit that puzzles me most: quantum foundations gets funded under the fundamental heading, despite positing no new scale and no new entities, so fundamentality there seems to mean something like maximal generality — a totally different thing again — and meanwhile nobody in these meetings means "most certain" by "fundamental," since it's usually the most speculative work that gets the label.

  Don't give me a reading list; my internet is basically dead this week. I want the argument, and I want to know which commitments are genuinely load-bearing and which are just vibes with a philosophy department stamp on them.
reasoning: |-
  Okay, let me try to unpack this user's query. They're on a physics hiring committee and keep hearing "fundamental" used in ways that seem inconsistent. The user has a philosophy background and is noticing multiple meanings of the term, which don't always align. I need to figure out what the underlying assumptions are in their department's usage.

  First, the examples they gave: rejecting a condensed matter candidate because the work was "phenomenology, not fundamental," while advocating for string theory as fundamental since the Standard Model is just an effective field theory. This seems contradictory. The user lists four possible meanings of "fundamental": smallest scale, maximal generality, brute/unexplained, and derivability. But these don't always cohere. 

  I should start by identifying the core presuppositions in their department's practice. The hierarchy where particle physics and cosmology are "fundamental" while condensed matter is "applied" suggests a belief in a well-ordered tower of sciences. This assumes that fundamentality is tied to smaller scales and that dependence relations are asymmetric and transitive. But quantum foundations complicates this because it's considered fundamental without new scales or entities. Here, fundamentality might mean generality—explaining the framework for all physics.

  The user's philosopher friend mentioned that grounding might not be well-founded. If that's true, the department's assumption of a single fundamental level collapses. But in practice, funding decisions might not strictly depend on metaphysical commitments. Pragmatic factors like prestige, tractability, and historical path dependence could be driving the labeling. For example, string theory has high prestige despite being speculative, while condensed matter, though successful, is seen as applied.

  The user also wonders if a purely pragmatic approach could explain the same behavior without metaphysics. Prestige and funding availability likely play roles. Testing high-energy physics is expensive, but it's funded because of the allure of uncovering "deep" truths. Meanwhile, quantum foundations gets grouped with fundamental physics because it deals with the interpretation of quantum mechanics, which underlies all other theories.

  The user's proposed criterion—holding F fixed to explain G—has issues with circularity. For instance, in emergent phenomena, higher-level laws might be necessary to explain behaviors without referencing micro-details. Also, in quantum foundations, interpretations aren't held fixed to explain other theories; it's the reverse.

  To answer the user, I need to separate what the practice strictly presupposes from what's compatible. The tower assumption is load-bearing; without it, the hierarchy makes less sense. However, pragmatics can explain much of the funding decisions. If fundamentality were defined as "unexplained," resources might shift to unsolved problems like quantum gravity or consciousness. If derivability were key, the feasibility of reductionism would be crucial, which is often not practical.

  Quantum foundations is a special case. Its fundamentality comes from generality—addressing the framework itself. This differs from scale-based definitions but fits within the broader "tower" view as the base layer. The user is right that "fundamental" here isn't about certainty; it's the opposite, dealing with unresolved questions.

  In conclusion, the department's practice assumes a well-ordered hierarchy with particle physics at the bottom. While metaphysical commitments are part of the narrative, pragmatic factors are significant. If the tower view is wrong, the justification weakens, but funding might not change immediately due to entrenched structures. The user's criterion needs refinement to avoid circularity and account for multiple dependence directions.
answer: |-
  Your committee's usage of "fundamental" reveals a **tangled hierarchy of presuppositions**, heavily reliant on an implicit **well-ordered tower model** of scientific explanation. Here's the reconstruction, separating load-bearing commitments from compatible extras, the role of pragmatics, and consequences of shifting definitions:

  ### The Load-Bearing Presupposition: The Well-Ordered Tower
  1.  **The Core Commitment:** Reality is stratified into discrete, hierarchical *levels* (e.g., quantum fields → particles → atoms → molecules → materials → organisms → societies).
  2.  **Asymmetric Dependence:** Dependence relations *only* point downward. Facts at level L+1 depend on/determinants at level L, but *not vice versa*. (This is your "hold F fixed to explain G" intuition).
  3.  **Transitivity & Well-Foundedness:** This dependence chains downward *transitively* and terminates at a *unique fundamental level* (or small set of levels). There is a *bottom*.
  4.  **Scale Identification:** Lower levels correspond to *smaller length/higher energy scales*. The fundamental level is the *smallest conceivable scale* (Planck scale).
  5.  **Explanatory Primacy:** Explaining the fundamental level *in principle* explains everything above it (via derivation, reduction, or grounding).

  **Why this is Load-Bearing for the Practice:**
  *   **Sorting Buckets:** Particle physics/cosmology target the presumed bottom (Planck scale/initial conditions). Condensed matter/material science/biophysics target higher levels explicitly built *on top* of that bottom. This justifies the "fundamental" vs. "applied/applications" labeling common in departments and funding bodies.
  *   **String Theory Justification:** If the Standard Model is an effective field theory (EFT), it *must* emerge from *something* more fundamental at a smaller scale. String theory explicitly targets that scale. This fits (1, 2, 4).
  *   **Condensed Matter Rejection:** Phenomenology describes *higher-level* behavior without necessarily deriving it step-by-step from the fundamental level. It's seen as working "within" the level, not uncovering the base. This violates (2, 4).
  *   **Quantum Foundations Inclusion:** QF deals with the *interpretation* of the *presumed fundamental theory* (QM/QFT) itself. It asks "What is the fundamental level *really like*?" (e.g., wavefunction realism, collapse mechanisms, non-locality). This fits (3 - brute facts about reality, 4 - framework for derivation) *within the tower*. Its fundamentality is *categorical* (defining the base layer), not *scalar* (seeking a smaller scale).

  ### Compatible Extras (Not Strictly Required, But Fit the Vibe)
  *   **Bruteness (3):** The fundamental level is where explanation stops. This *follows* from well-foundedness (no deeper level) but isn't the primary driver. The practice emphasizes *seeking* the fundamental (scale/generality), not declaring what *is* brute.
  *   **Maximal Generality (2):** The fundamental theory applies everywhere. This is *consequence* of being the bottom level. QF leverages this aspect strongly. Particle physics also claims generality (all matter is made of these fields/particles).

  ### The Pragmatic Overlay (Licensing Similar Behavior Without Metaphysics)
  A purely pragmatic story *can* largely replicate the observed behavior:
  *   **Prestige & History:** Particle physics' 20th-century triumphs (QED, EW, QCD) cemented its status as "fundamental." String theory inherited this mantle via ambitious claims targeting the Planck scale. This creates path dependence.
  *   **Expected Value of Information:** Discovering new fundamental particles/forces or a TOE is perceived as having enormous information value – it would reshape our entire understanding. *Even if unlikely*, the payoff justifies investment for many committees/funders. Condensed matter discoveries, while crucial, are seen as adding branches, not restructuring the trunk.
  *   **Tractability & Cost (Illusory):** High-energy experiments (colliders, cosmology) are monstrously expensive, *but* they promise (or promised) clean, decisive tests of specific models at a targeted scale. This feels like direct assault on the "fundamental." Emergent phenomena in CM/AMO/Bio are often messier, context-dependent, and harder to link *directly* to a specific micro-detail – *feeling* less fundamental. (This ignores how much CM *does* rely on fundamental microphysics!).
  *   **"Pure" vs. "Applied" Bias:** Deep-seated cultural preference for "understanding for its own sake" at the perceived base level over "merely" understanding complex applications built upon it.

  **The metaphysics isn't *just* decoration; it provides the *rationalizing narrative*.** Pragmatics explains *why* the tower model persists and is applied selectively. The metaphysics justifies it as reflecting reality's structure.

  ### What Changes if We Swap the Core Meaning?
  *   **Brute/Unexplained (3) as Primary:** Funding shifts dramatically.
      *   **Winners:** Quantum Foundations (measurement problem, interpretation), aspects of cosmology (initial singularity, dark energy), complex systems (emergence, irreducibility), even neuroscience (consciousness hard problem). Anything currently lacking a satisfying explanation becomes "fundamental."
      *   **Losers:** Conventional particle physics hunting new particles *within* the well-understood SM-EFT framework. Incremental condensed matter phenomenology explaining new materials using established principles.
      *   *Consequence:* "Fundamental" becomes synonymous with "biggest open questions," regardless of scale. The hierarchy flattens or becomes domain-specific.
  *   **Derivability (4) as Primary (Requiring Feasibility):** Funding collapses for much "fundamental" physics.
      *   **Problem:** "In principle" is doing *all* the work. Deriving fluid dynamics from QCD is computationally intractable and often unnecessary. Emergent phenomena are often decoupled from micro-details (universality, renormalization group).
      *   **Winner:** *Effective* theories at *all* levels that successfully predict/explain phenomena within their domain (including great condensed matter phenomenology!). Computational physics bridging scales gets a boost.
      *   **Loser:** Theories where derivability is purely notional (e.g., deriving chemistry from string theory). Speculative fundamental physics loses its privileged "in principle" status if the derivation isn't practically relevant or achievable.
      *   *Consequence:* "Fundamental" loses its absolute meaning. It becomes "most useful starting point for explaining *this specific domain*." Multiscale modeling dominates.
  *   **Maximal Generality (2) as Primary:** Reshuffles the deck.
      *   **Winners:** Quantum Foundations (studies the *framework* of all physics), Statistical Mechanics/Condensed Matter Theory (aims for universal principles of collective behavior - critical phenomena, universality classes), Complexity Science. Cosmology (studies the whole universe).
      *   **Losers:** Narrow particle phenomenology focused only on specific BSM models at Terascale. Highly specialized sub-fields in any domain.
      *   **Quantum Foundations Validation:** This *is* why QF gets funded as fundamental – it *is* maximally general. String theory also claims generality, but QF's is immediate.
      *   *Consequence:* "Fundamental" becomes "most widely applicable principles," potentially spanning multiple scales/towers.

  ### Your Proposed Criterion: The Circularity & Usefulness
  *   **Criterion:** "F is more fundamental than G if you have to hold F fixed to explain G but not vice versa."
  *   **The Circularity:** It presupposes the asymmetry it's trying to define. *Why* must we hold F fixed to explain G? The answer ("because G depends on F") relies on the pre-existing notion of fundamentality/dependence the criterion aims to capture. It doesn't *ground* the asymmetry.
  *   **The Usefulness:** It's a decent *operational test within an already assumed hierarchical framework*. If you already believe in the tower, this criterion helps sort levels. It fails at boundaries (e.g., chemistry vs. physics) and struggles with:
      *   **Multiple Realizability:** G might be explainable by holding *different* Fs fixed (e.g., consciousness might be realized in various neural substrates).
      *   **Context-Sensitivity:** What needs holding fixed might depend on the *specific* G and explanatory context.
      *   **Downward Causation/Constraint:** Higher levels (G) can impose boundary conditions/constraints on lower levels (F), making the holding "fixed" mutual in practice (e.g., biological environment shaping molecular evolution).

  ### Quantum Foundations & Generality - Why it Fits (and Puzzles You)
  You've identified the key: **QF's fundamentality is *categorical* (defining the nature of the base) rather than *scalar* (digging deeper).** Within the tower model:
  1.  **Maximal Generality (2):** QF addresses the structure of the theory (QM/QFT) that is *presupposed* to govern everything at the fundamental level. It asks: "What are the fundamental constituents *and how do they fundamentally behave/relate*?"
  2.  **Bruteness (3):** It seeks the ultimate ontological and dynamical *brute facts* of the physical world (e.g., is the wavefunction real? Is collapse fundamental?).
  3.  **Derivability (4) - The Framework:** It clarifies the framework *from which* everything else is supposed to be derived. A flawed/incomplete interpretation undermines the entire derivability project.
  4.  **It Doesn't Challenge Scale (1):** It operates *at* the presumed fundamental scale, questioning the *character* of that scale, not seeking a *deeper* one. Hence, no new entities/scales.

  ### If the Tower Crumbles (Your Philosopher Friend's Mumble)
  If dependence relations are **non-well-founded** (infinite descent) or form a **partial order with multiple peaks/incomparables**, the concept of "the fundamental level" evaporates. The practice would face a crisis:
  1.  **Loss of Justification:** The primary rationale for prioritizing particle physics/string theory/cosmology over condensed matter/etc. collapses. "Scale" alone isn't sufficient without the hierarchy.
  2.  **Funding Redistribution:** Justification shifts heavily towards pragmatics (cost, feasibility, societal impact, intrinsic interest of the phenomenon) and domain-specific explanatory power. Fields studying complex organization (condensed matter, materials, biophysics, complex systems) gain strong standing *equal* to particle physics. "Fundamental" might become domain-specific or disappear as a funding category.
  3.  **Quantum Foundations Evolution:** QF might focus less on finding "the" fundamental ontology and more on mapping the web of consistent descriptions across different levels/perspectives (e.g., quantum information approaches, pragmatism).
  4.  **Resistance:** Entrenched institutional structures, prestige, and the intuitive appeal of the tower model would create massive inertia. "Fundamental" might persist as a sociological label long after its metaphysical justification fades.

  **Conclusion:** Your committee's practice **strictly presupposes a well-ordered, scale-based hierarchy with asymmetric dependence terminating at a fundamental bottom (1, 4 being load-bearing with 2, 3 as compatible consequences).** Pragmatics (prestige, expected info value, cost illusions) strongly reinforces this structure. Quantum Foundations fits as the study of the *nature* of the presumed fundamental level (2, 3). If well-foundedness fails, the core justification crumbles, forcing a radical shift towards pragmatics or a new metaphysics of science. Your instinct that "fundamental" is doing multiple, potentially conflicting jobs is correct; the practice glues them together with the Tower model and historical prestige.
