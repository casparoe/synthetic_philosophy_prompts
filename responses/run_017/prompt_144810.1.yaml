    - **Philosophy Thinner? Partly**—the core idea (stages + relations) holds, but philosophers don't discuss DAGs.  

  **4. No Instantaneous States (Minimal Temporal Parts)**  
  - **Mapping**: If snapshots have **duration** (e.g., state between events), both 4D and stage theory treat them as **minimal temporal parts**. 3D says the object is **wholly present throughout the interval**.  
