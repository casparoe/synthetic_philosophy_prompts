  - **Four-dimensionalism (4D)**: An object is extended in time and composed of temporal parts. At any given time, only a temporal part (a "time-slice") of the object is present. The whole object is the sum of these parts.

  We also consider a variant of 4D: **stage theory** (or the "counterpart" variant), which says that what we ordinarily call an object is actually a momentary stage, and persistence is a matter of standing in a special relation (like a counterpart relation) to stages at other times.

  We will translate these using concepts like:
  - Event logs (append-only, immutable)
  - Snapshots (state at a given point)
  - Replay (re-deriving state from events)
  - Bitemporal tables (separating valid time and transaction time)
