  **3. Stage Theory with DAG Time: Merge Relations**  
  - **Mapping**: Stages are **snapshots**; counterpart relations are **causal links** (e.g., parent commits in Git). Merges allow a stage to have **multiple counterparts** (e.g., a merge commit points to two parents).  
  - **Arguments**:  
    - Branches are **distinct stage-chains** that merge later. "The candle at branch A" and "the candle at branch B" are stages with a shared past but not direct counterparts until merged.  
    - **Does it break?** Only if counterpart relations require linearity. If relations can be **many-to-many** (like CRDT merge semantics), it holds.  
  - **Residue**:  
