answer: |-
  ### What I think you're pointing at
  You're identifying **collective closure conditions**: facts that constrain the *entirety* of a domain (e.g., the fundamental base, the set of natural numbers, or the Humean mosaic) by asserting its *completeness* or *minimality*. These aren't facts *within* the domain but *about* its totality—ensuring nothing is missing (e.g., "all numbers are generated from 0 and successor") or extraneous (e.g., "only these entities are fundamental"). They depend holistically on the base, resisting reduction to any subset of it. This distinguishes them from both "brute" fundamentalia and standard grounded facts.

  ---

  ### Candidates and where each falls short
  1. **Totality Facts (Grounding Literature)**  
     *Standard term*. These assert "these are all the Fs" (e.g., "these fundamental entities are all that exist").  
     *Shortfall*: Captures your upward-looking cases (inventory, laws) but not downward-looking ones like induction in arithmetic. The induction axiom ("nothing else is a number") isn't about *existence* but *membership*, and it constrains structure, not inventory.  

  2. **Minimality Constraints (Logic/Formal Metaphysics)**  
     *Standard term in model theory/circular definitions*. E.g., the "nothing else" clause in inductive definitions ensures the smallest set satisfying the rules.  
     *Shortfall*: Fits your numbers case but not fundamental inventory. The Humean mosaic's "that's-all" isn't defining a set via rules—it's asserting factual completeness about reality.  

  3. **Completability (Truthmaker Theory)**  
     *Standard concern*. A truthmaker for "all Fs are G" must "cover" all Fs.  
     *Shortfall*: Explains *why* "that's-all" facts need holistic grounds but doesn't characterize the *fact itself*. Your cases are about the base's *sufficiency*, not truthmaking for generalizations.  

  4. **Brute Totality (Primitivism)**  
     *Your group's "brute fact" suggestion*. Some (e.g., Sider) treat "these are all the fundamentals" as primitive.  
     *Shortfall*: You note these facts *depend* on the base (e.g., adding entities changes them), unlike brute facts. They're *meta-constraints* on grounding, not foundationally brute.  

  **Verdict**: No existing term fully covers both structural (numbers) and ontological (inventory, laws) cases while capturing their holistic dependence.

  ---

  ### One thing or two
  They are **two distinct types**, unified by their *collective, non-distributive* dependence on the base but differing in direction:  
  - **Downward Closure (e.g., induction)**: Constrains the domain to be the *smallest* satisfying certain rules. It prevents "junk" (extraneous elements).  
  - **Upward Closure (e.g., fundamental inventory, Humean laws)**: Constrains the domain to be *complete*. It prevents "gaps" (missing elements that should be accounted for).  

  They share key features:  
  - Holistic: No part of the base grounds them alone; they depend on the *whole*.  
  - Modally fragile: Violated only by *adding* to the base, not rearranging it.  
  But their roles differ: Downward closure is *constitutive* (defining a structure), while upward closure is *exhaustive* (cataloging reality).  

  ---

  ### Your test, stress-tested  
  Your test—"can only be broken by *adding* to the base, not tweaking it"—holds:  
  - **Induction axiom**: Adding a non-successor "junk number" breaks it; changing 0 to 1 does not.  
  - **Fundamental inventory**: Adding an extra fundamental entity breaks "only these are fundamental"; changing one fundamental’s properties does not.  
  - **Humean laws**: Adding an extra event changes the "best system"; altering existing events might not.  

  **But what about "no unicorns"?**  
  - "No unicorns" *is* breakable by tweaking the base: turn a horse into a unicorn via microphysical changes.  
  - Contrast: "Only these fundamental entities exist" isn’t broken by modifying an entity—only by adding one. Your test *excludes* boring negative existentials, confirming its acuity.  

  ---

  ### The name I'd use, defined, with two boundary cases  
  I propose **Collective Closure Conditions (CCCs)**:  
  > *A fact that depends holistically on an entire domain (e.g., the fundamental base or a structured set) and asserts either its minimality (no extraneous elements) or completeness (no missing elements), where violation requires domain expansion, not internal rearrangement.*  

  **Boundary cases**:  
  1. **Inside**: The induction axiom for Peano arithmetic.  
     - *Why*: Depends on the *entire* number set; violated only by adding a non-successor number; internal changes (e.g., 7 → 8) don’t break it.  
  2. **Outside**: "All electrons have charge −e."  
     - *Why*: Violated by tweaking a single electron (e.g., changing its charge), not just by adding electrons. This is a distributive universal, not holistic.  

  *(Note: "Collective Closure Conditions" is my coinage. Standard near-misses are "minimality/totality facts.")*  

  ---

  ### Where I'd expect to be corrected  
  1. **"Totality facts" as sufficient**: Some grounding specialists (e.g., Karen Bennett) might argue upward closure *is* a totality fact, and your arithmetic case is separate. I’d push back: both exhibit holistic dependence, warranting a unified category.  
  2. **Reducibility**: Humeans (e.g., Loewer) might claim the Humean "that’s-all" *is* grounded in the mosaic via supervenience. I’d reply: even if supervenient, its *content* (completeness) isn’t grounded in any subregion.  
  3. **Downward vs. upward**: A logician might note downward closure defines a set, while upward closure describes reality—so why lump them? I’d concede they play different roles but emphasize their shared modal fragility and holistic grounding.  

  **Biggest vulnerability**: Claiming CCCs aren’t brute. Some (e.g., Ted Sider) argue "these are all the fundamentals" *must* be primitive. If convincing arguments emerge that such facts *can’t* depend on the base, I’d retreat to calling them "brute closure conditions."  

  *(Confidence: High on the phenomena being distinct; medium on my taxonomy; low on "Collective Closure Conditions" catching on—but it’s precise!)*
