prompt: |-
  Hey — I'm in a Behavioral Decision Making course this term and the professor has let me run one 75-minute section on my own: 18 undergrads, mostly econ and psych majors, nobody with any formal decision theory. Topic is satisficing and bounded rationality. She said no lecture and no slides beyond a one-page handout, so I need an actual activity, not an explanation.

  What I want them to feel rather than be told: that stopping early can be the *rational* move instead of a character flaw, and that whether it is depends on the shape of the environment, not on some trait of the agent. And — the bit I care most about — I want them to run into the gap between doing well by the scoreboard and feeling fine about it. My guess is the people who stop early will end up with more points and feel worse about it, and I want that to be something they notice on their own, not something I announce.

  Some constraints I've been turning over, which maybe you can tell me are wrong:

  - Two separate costs: one for finding a new option (search) and one for finding out how good an option actually is (inspection). I want inspection expensive enough that they sometimes have to settle for a cheap proxy signal — I think satisficing only gets interesting there, and I don't want that to get flattened out.
  - Options should arrive over real time, one per round, so the deadline is something they feel in their gut rather than a number on a page.
  - Different tables get different underlying distributions — one flat-ish, one where a couple of great options are buried in a lot of mediocre ones, one where the proxy correlates with real quality and one where it basically doesn't — and nobody knows which one they're sitting in.
  - Everyone writes down an aspiration level before anything starts, and they can revise it during play but each revision costs something, so they can feel the pull of moving the goalposts when the search goes badly.

  What I need: materials and the handout text, exact rules, a payoff scheme in points (no real money, index cards and a timer only), a minute-by-minute timeline for 75 minutes, and a debrief. The debrief should map specific moments in the game onto specific parts of the satisficing story — setting the aspiration level, the stopping rule, search versus inspection cost, adaptation of the aspiration — and say what to do with the fact that different tables lived in different worlds. Then: what will predictably go wrong the first time I run it (I'm guessing someone tries to game the proxy, or the whole room is done in 20 minutes, or one table just refuses to stop), how I should handle each, and — honestly — which part of bounded rationality this game can't stage at all and that I'll have to just say myself at the end. Also give me one thing I can look at or ask at the very end that tells me whether it landed.

  One last thing: please don't just hand me the secretary problem in a different hat. I've seen that one and it's about optimal stopping when you know the arrival structure up front, which feels like almost the opposite of the point here.

  Oh, and write it in American English — half my section is international students and I dont want them picking up my British spellings.
reasoning: |-
  We are designing an activity to teach satisficing and bounded rationality. The goal is for students to experience that stopping early can be rational and that the environment (not just the agent) matters. We also want them to notice the gap between doing well by the score and feeling bad about it.

  Key elements:
  - Two costs: search (for each new option) and inspection (to find the true quality of an option). Inspection is expensive so they might rely on a cheap proxy.
  - Real-time arrival of options (one per round) to feel the deadline.
  - Different distributions for different tables: 
    1. Flat (uniform) distribution of true quality.
    2. A few great options buried in mediocre ones (bimodal or skewed).
    3. Proxy correlates well with true quality.
    4. Proxy does not correlate (or very little) with true quality.
  - Each student sets an aspiration level at the start and can revise it at a cost.

  We need:
  - Materials and handout text.
  - Exact rules and payoff scheme in points.
  - Timeline for 75 minutes.
  - Debrief that maps game moments to satisficing concepts.
  - What might go wrong and how to handle it.
  - One thing to check if the activity landed.

  We are avoiding the secretary problem because it assumes known arrival structure and optimal stopping.

  Let's design the activity:

  **Activity Name:** The Satisficing Challenge

  **Materials:**
  - Index cards (for options) - enough for 15-20 rounds per table (each table gets a deck of cards pre-prepared by the instructor).
  - Timer (for rounds).
  - Handout (one per student) with rules and a score sheet.
  - Whiteboard or flip chart for the instructor to track time and announce rounds.

  **Handout Text (one page, front and back if needed):**

  **Front:**
  **The Satisficing Challenge**

  Welcome! In this activity, you are a decision maker searching for the best option. You will see options one by one. Each option has:
  - A **proxy value** (free to see): This is a quick and cheap signal of the option's quality. It might be related to the true quality, but not always perfectly.
  - A **true value** (costly to see): This is the actual quality of the option. To see it, you must pay an inspection cost.

  **Goal:** Maximize your total points. Points come from:
  - The true value of the option you choose (if you choose one).
  - Minus any costs you incur.

  **Costs:**
  1. **Search cost:** 1 point for each new option you look at (even if you don't inspect or choose it). This is paid automatically when the option is revealed.
  2. **Inspection cost:** 5 points to see the true value of an option (only if you choose to inspect).
  3. **Aspiration adjustment cost:** 2 points each time you change your aspiration level (see below).

  **Rules:**
  - The game has multiple rounds (at least 15). In each round, a new option will be revealed.
  - At the start of the game, you must write down your initial **aspiration level** (a number) for the proxy value. This is the minimum proxy value you would consider "good enough" to inspect.
  - When a new option is revealed, you see its proxy value for free.
  - Then, you have a short time (about 15 seconds) to decide one of the following:
     a. **Pass:** Move to the next option (paying the search cost for this one).
     b. **Inspect:** Pay 5 points to see the true value. Then you can either:
          i. **Choose:** Stop the game and take this option (you get the true value minus all costs incurred so far, including this inspection and search costs).
          ii. **Reject:** Continue to the next option (paying the inspection cost and the search cost for this option, but you don't choose it).
  - You can also **change your aspiration level** at any time during your decision (before or after seeing an option) by paying 2 points. Write down your new aspiration.

  **Important:**
  - You must choose an option by the end of the game. If you haven't chosen by the last round, you are forced to inspect and choose the last option (and pay the inspection cost for it).
  - The distribution of true values and the relationship between proxy and true value may be different for different tables. You don't know what your table's distribution is.

  **Back of Handout:**
  **Score Sheet**

  Round | Proxy | Action (Pass/Inspect) | If Inspected: True Value | If Chosen: (Y/N) | Costs This Round | Running Total
  ------|-------|------------------------|---------------------------|------------------|------------------|---------------
  1     |       |                        |                           |                  |                  |
  2     |       |                        |                           |                  |                  |
  ...   |       |                        |                           |                  |                  |

  **Instructions for the score sheet:**
  - Record each round:
     - Proxy value shown.
     - Your action: Pass, Inspect (and then whether you chose or rejected).
     - If you inspected, write the true value.
     - If you chose the option, mark "Y" in the chosen column.
     - Costs: 
          - Every round: 1 point for search (plus 5 if you inspected, plus 2 if you changed aspiration).
          - If you chose, that round also includes the true value (which is positive) and you stop.
  - Running total: Start at 0. Subtract costs and add the true value (if chosen) as you go.

  **Initial Aspiration Level:** __________

  **End of Game:** 
  Your total points = [True value of chosen option] - [Total search costs] - [Total inspection costs] - [Total aspiration adjustment costs]

  **How we'll play:**
  - The instructor will reveal one option per round for your table (by placing an index card face up, showing the proxy value, then if inspected, the instructor will show the true value on the back or on a separate card).
  - Each round lasts about 15 seconds for decision. The instructor will call time.

  ---

  **Preparing the Option Decks:**
  - Each table (4-5 students) gets a deck of 15-20 index cards. Each card has:
     - Front: Proxy value (a number, e.g., between 1 and 100)
     - Back: True value (a number, e.g., between 1 and 100)
  - The decks are predefined by the instructor to represent the four environments:

    Table 1 (Flat distribution):
      - Proxy: Uniform between 40 and 60
      - True: Uniform between 40 and 60 (so proxy is a good estimate)

    Table 2 (Bimodal: few great, many mediocre):
      - Proxy: Mostly between 40-60 (say 80% of the time), but 20% of the time between 80-100.
      - True: For options with proxy in 40-60, true is between 30-70 (so sometimes over, sometimes under). For high proxy (80-100), true is between 70-100 (so generally good, but not always perfect). Also, include a couple of "gems": one with proxy 55 and true 95, one with proxy 45 and true 90? But mostly, high proxy means high true.

    Table 3 (Proxy correlates well with true):
      - Proxy: Uniform between 20 and 100
      - True: Proxy plus some noise (e.g., true = proxy + random between -10 and 10)

    Table 4 (Proxy does not correlate):
      - Proxy: Uniform between 20 and 100
      - True: Independent of proxy, uniform between 20 and 100 (so no correlation)

    But note: We want the true value to be hidden until inspection. Also, we want the proxy to be free and inspection costly.

    Alternatively, to make the bimodal more pronounced:

    Table 2: 
      - With 70% probability, proxy is between 40-60 and true between 30-60 (so mediocre). 
      - With 30% probability, proxy is between 60-80 and true between 70-100 (good). 
      - But maybe one or two with low proxy and high true? Not necessarily, because we want the environment where if you set a high aspiration, you might wait a long time.

    Actually, let's define:

    Environment A (Table 1: Flat and correlated): 
      Proxy: uniform [50,70]
      True: proxy + uniform[-5,5] (so always around the proxy)

    Environment B (Table 2: Bimodal with hidden gems):
      Proxy: 
          80%: uniform [40,60] (mediocre)
          20%: uniform [80,100] (high)
      True:
          For mediocre proxy: true = uniform[40,60] (so matches)
          For high proxy: true = uniform[80,100] (so matches)
          BUT: also, 10% of the mediocre proxy options have true = uniform[80,100] (hidden gems) and 10% of the high proxy have true = uniform[40,60] (overhyped). So overall, 8% hidden gems, 2% overhyped, 72% mediocre, 18% good.

    Environment C (Table 3: Correlated):
      Proxy: uniform [30,90]
      True: proxy + uniform[-20,20] (so correlated but noisy)

    Environment D (Table 4: Uncorrelated):
      Proxy: uniform [30,90]
      True: independent uniform [30,90]

    We'll have 4 tables? Or if 18 students, maybe 4 groups of 4-5.

    But note: we want one table per environment. So four tables.

    How to generate the decks: 
      - Each deck has 15 cards (so the game will have 15 rounds). We generate the numbers in advance.

    Example for Table 2 (bimodal):
      - We want 15 cards.
      - 80% of 15 = 12 cards: 12 with proxy in [40,60] (but 10% of these 12, i.e., 1 or 2, have true in [80,100] -> hidden gems; the rest have true in [40,60]).
      - 20% of 15 = 3 cards: proxy in [80,100] (but 10% of these, i.e., 0 or 1, have true in [40,60]; the rest in [80,100]).

    Let's do:
      - 10 cards: proxy uniform [40,60] and true uniform [40,60] (mediocre)
      - 2 cards: proxy uniform [40,60] and true uniform [80,100] (hidden gems)
      - 2 cards: proxy uniform [80,100] and true uniform [80,100] (good)
      - 1 card: proxy uniform [80,100] and true uniform [40,60] (overhyped)

    So 15 cards.

    For Table 1 (flat and correlated): 15 cards with proxy uniform [50,70] and true = proxy + uniform[-5,5] (rounded).

    Table 3 (correlated): 15 cards: proxy uniform [30,90], true = proxy + uniform[-20,20] (capped at 30 and 90? or let it go beyond? We can set bounds: if true<30, set to 30; if true>90, set to 90. Or keep as is?).

    Table 4 (uncorrelated): 15 cards: proxy uniform [30,90], true independent uniform [30,90].

  **Payoff Scheme:**
  - The true value is what you get if you choose that option. The costs are subtracted.
  - Example: You choose in round 5. You have paid 5 search costs (rounds 1-5) and maybe some inspection costs and aspiration adjustments.
  - Total points = true value of chosen option - (number of rounds so far)*1 (search cost) - (number of inspections)*5 - (number of aspiration changes)*2.

  **Timeline (75 minutes):**

  0-5 min: Introduction and handout distribution. Explain the goal and rules briefly. Emphasize: "You are trying to maximize your points. The game will have 15 rounds. You must choose by the end."

  5-10 min: Students write down initial aspiration level (for proxy) and get familiar with the score sheet.

  10-40 min: Gameplay (15 rounds). Each round:
     - Instructor says: "Round X starting." Then shows one card (proxy value) to each table (so each table gets their next card). 
     - Students have 15 seconds to decide: 
          - If they want to change aspiration, they can (and mark it on their sheet and subtract 2 points). 
          - Then, for the current option: pass or inspect?
          - If inspect, they tell the instructor (or a table monitor) and then the instructor reveals the true value. Then they have the rest of the 15 seconds to decide to choose or reject. (If time is tight, we can allow a few extra seconds for the inspect-and-choose decision.)
     - After 15 seconds, move to the next round.

  Note: The instructor must keep the pace. If a student hasn't decided in 15 seconds, they are forced to pass (unless they are in the middle of an inspection, then they must choose or reject without extra time? Or we can have a rule: if you start inspection, you must complete the decision in that round).

  Alternatively, we can have each round as:
     - Reveal proxy -> 10 seconds to decide: pass or inspect (and if they want to change aspiration, they do it now and pay the cost).
     - If inspect, then reveal true -> 5 seconds to decide: choose or reject.

  But we have 15 seconds total per round.

  40-45 min: End of game. If anyone hasn't chosen, they are forced to inspect and choose the last option. Students calculate their total points.

  45-55 min: Within-table discussion (5 min) and then each table reports (10 min): 
     - What was your total point range? 
     - How many rounds did most people stop at? 
     - How many times did they adjust aspiration? 
     - How did they feel about their choice?

  55-70 min: Debrief (instructor-led).

  70-75 min: Wrap-up and one question to check if it landed.

  **Debrief Structure:**
  1. Map the game to satisficing:
     - **Setting aspiration level:** At the start, you set a proxy level that you thought would be good enough. Why? Because you didn't want to inspect every option (costly). This is a stopping rule: if the proxy is above aspiration, you might inspect and then possibly choose.
     - **Search vs. inspection cost:** You paid for each option you saw and extra for inspecting. So you had to decide when to rely on the proxy (free) and when to pay for the true value. In satisficing, we often use heuristics (proxy) to avoid the cost of full evaluation.
     - **Stopping early:** Some of you might have stopped early. Why? Because you found an option that met your aspiration and you didn't want to pay more search costs. But note: the environment mattered. In some environments, stopping early was good; in others, you might have missed out on better options.
     - **Adaptation of aspiration:** If you adjusted your aspiration, you were responding to the environment. If you set it too high and found nothing, you might have lowered it (and paid a cost). If you found a lot of good options, you might have raised it. This is the aspiration adjustment in satisficing.

  2. Different environments:
     - Ask each table to describe their experience and the point range. Then reveal the environment type for each table.
     - Discuss: In which environment was stopping early (with a moderate aspiration) better? (Probably Table 1 and Table 3, where the proxy was informative, and Table 2 if they set aspiration low enough to catch hidden gems? Actually, in Table 2, if you set aspiration high, you might have waited for the high proxy and missed the hidden gems. If you set it low, you might have inspected more and found a hidden gem early. But inspection is costly.)
     - In Table 4 (uncorrelated), the proxy didn't help, so they had to inspect a lot to find a good one? Or they might have set a low aspiration and settled for a mediocre option quickly.

  3. The gap between feeling and score:
     - Ask: "How many of you got a high score but feel like you could have done better? How many got a low score but feel okay because you tried hard?"
     - Point out: The game is designed so that the search and inspection costs add up. Sometimes, the person who stopped early with a decent option and paid few costs did better than the person who kept searching and found a slightly better option but paid a lot in costs. But the latter might feel like they did better because they found a higher true value, ignoring the costs.

  4. Bounded rationality: The game shows that we use simple rules (like aspiration levels) because we cannot compute the optimal solution (we don't know the distribution, and the costs add up). It also shows that the environment shapes what is a good rule.

  **What might go wrong:**
  1. **Someone tries to game the proxy:** For example, in the uncorrelated environment, they might set a very low aspiration and just take the first option without inspection? But note: they still have to inspect to get the true value (because they only see the proxy for free). They can't choose without inspection (unless they are forced at the end). The rule: you can choose only after inspection. So they have to pay the inspection cost to get the true value. If they set a low aspiration and inspect the first one that meets it, they might get a low true value and have paid 5 points. So it's risky.

  2. **The whole room is done in 20 minutes:** If many students choose early, we might finish before 15 rounds. We can have the game continue for those who haven't chosen until round 15. So we keep going until round 15, and those who have chosen just watch. But we want the time pressure to be real. Alternatively, we can have the option that if you choose, you are done and don't play further rounds. The others continue. Since the rounds are fixed in time, we must fill 15 rounds. So students who have chosen just sit and watch. That's okay because they can see what they missed.

  3. **One table refuses to stop:** By rule, they are forced to take the last option. So they will have high search costs and might get a low true value. That's a lesson in itself.

  4. **Time per round:** 15 seconds might be too short. We can do 20 seconds. We have 15 rounds -> 5 minutes of rounds? 15*15=225 seconds = 3.75 minutes. But we have 30 minutes for gameplay? That includes the time to reveal and record. Actually, each round might take a bit more because the instructor has to go to each table? How to manage:

     Solution: The instructor doesn't go to each table. Instead, each table has a deck of cards, and a student at the table (or the instructor) reveals one card per round at the same time. Then the students at that table decide. So all tables are in sync. The instructor just calls the start and end of each round.

     So timeline per round:
        - Instructor: "Round X, reveal!" (tables turn over the next card in their deck, showing proxy)
        - Students have 15 seconds to decide and record. If they want to inspect, they raise their hand and the table monitor (or instructor) shows the true value (on the back of the card) to that student. Then they decide to choose or reject.
        - At the end of 15 seconds: "Time! Mark your actions and costs."

     This can be done in 15 seconds if the tables are self-managed. We can have a student at each table as the card revealer and truth teller.

  5. **Students not recording properly:** The handout has a score sheet, but they might not fill it. Encourage them to do so because they need to calculate points at the end.

  **What the game can't stage:**
  - The game assumes that the aspiration level is set for the proxy. In real life, the aspiration might be set for the true value, but we don't see the true value without cost. So the game models that we use a proxy. But in real life, we might not even have a clear proxy. Also, the cost of aspiration adjustment is arbitrary. We include it to make them feel the cost of changing goals, but in reality, that cost is psychological and hard to quantify.

  **One thing to check if it landed:**
  At the end, ask: "By a show of hands, how many of you, if you were to play again in the same environment, would set a different aspiration level or use a different strategy? Why?" Then ask one or two to explain. If they mention that they would adjust based on the environment (which they now know) or that they learned that stopping early can be good, it landed.

  **Final Handout Text (American English):**

  We'll write the handout in American English (e.g., "behavior" not "behaviour", "maximize" not "maximise", etc.).

  Let me adjust the handout accordingly.

  **Revised Handout (front):**

  **The Satisficing Challenge**

  Welcome! In this activity, you are a decision maker searching for the best option. You will see options one by one. Each option has:
  - A **proxy value** (free to see): This is a quick and cheap signal of the option's quality. It might be related to the true quality, but not always perfectly.
  - A **true value** (costly to see): This is the actual quality of the option. To see it, you must pay an inspection cost.

  **Goal:** Maximize your total points. Points come from:
  - The true value of the option you choose (if you choose one).
  - Minus any costs you incur.

  **Costs:**
  1. **Search cost:** 1 point for each new option you look at (even if you don't inspect or choose it). This is paid automatically when the option is revealed.
  2. **Inspection cost:** 5 points to see the true value of an option (only if you choose to inspect).
  3. **Aspiration adjustment cost:** 2 points each time you change your aspiration level (see below).

  **Rules:**
  - The game has 15 rounds. In each round, a new option will be revealed.
  - At the start of the game, you must write down your initial **aspiration level** (a number) for the proxy value. This is the minimum proxy value you would consider "good enough" to inspect.
  - When a new option is revealed, you see its proxy value for free.
  - Then, you have a short time (about 15 seconds) to decide one of the following:
     a. **Pass:** Move to the next option (paying the search cost for this one).
     b. **Inspect:** Pay 5 points to see the true value. Then you can either:
          i. **Choose:** Stop the game and take this option (you get the true value minus all costs incurred so far, including this inspection and search costs).
          ii. **Reject:** Continue to the next option (paying the inspection cost and the search cost for this option, but you don't choose it).
  - You can also **change your aspiration level** at any time during your decision (before or after seeing an option) by paying 2 points. Write down your new aspiration.

  **Important:**
  - You must choose an option by the end of the game. If you haven't chosen by round 15, you are forced to inspect and choose the last option (and pay the inspection cost for it).
  - The distribution of true values and the relationship between proxy and true value may be different for different tables. You don't know what your table's distribution is.

  **Back (score sheet):** as above.

  **Additional Instructor Notes:**

  - Prepare 4 decks of 15 cards for the 4 environments (as described).
  - Assign each table to an environment (without telling them which one it is).
  - Have a timer that beeps every 15 seconds for the rounds.
  - During the game, walk around to observe and answer questions quickly.

  This activity should create the experiences you want. Good luck!
answer: |-
  ### **The Satisficing Challenge: Activity Design**  
  **Goal:** Students experience that **stopping early can be rational** (not lazy) and that success depends on the environment (not just personal traits). They also confront the **gap between high scores and emotional dissatisfaction** (e.g., stopping early leads to good points but feels like "giving up").  

  ---

  ### **Materials**  
  1. **Per Table (4 tables × 4-5 students):**  
     - Deck of 15 index cards (one per round). Cards have:  
       - **Front:** Proxy value (visible to all).  
       - **Back:** True value (hidden until inspection).  
     - Timer (phone/app).  
     - Pencils and score sheets (one per student).  
  2. **Instructor:** Master timer, whiteboard for tracking rounds.  

  ---

  ### **Handout Text (1 Page)**  
  *(American English)*  

  **FRONT PAGE: RULES & GOAL**  
  **Goal:** Maximize your points. Points = (True value of chosen option) – (Search costs) – (Inspection costs) – (Aspiration adjustment costs).  

  **Rules:**  
  1. **Options arrive one-by-one.** Each round, a new card is revealed showing its **proxy value** (free to see).  
  2. **Decisions per round (15 sec/round):**  
     - **PASS:** Skip this option. Pay 1 pt (search cost).  
     - **INSPECT:** Pay 5 pts to see the true value. Then:  
       - **CHOOSE:** Stop the game. Get the true value minus all costs.  
       - **REJECT:** Continue. Pay inspection + search costs (6 pts total).  
  3. **Aspiration level:**  
     - Set an initial **proxy aspiration level** (e.g., "I’ll inspect options with proxy ≥ 60").  
     - Change it anytime by paying 2 pts (e.g., "Now I’ll accept proxy ≥ 50").  
  4. **Deadline:** You **must choose by Round 15**. If not, you inspect/choose the final option (no choice).  
  5. **Cost recap:**  
     - Search: 1 pt per option viewed.  
     - Inspection: 5 pts per inspection.  
     - Aspiration change: 2 pts per adjustment.  

  **BACK PAGE: SCORE SHEET**  
  | Round | Proxy | Action (Pass/Inspect) | True Value (if inspected) | Chosen? (Y/N) | Costs This Round | Total Points |  
  |-------|-------|------------------------|----------------------------|---------------|------------------|-------------|  
  | 1     |       |                        |                            |               |                  |             |  
  | ...   |       |                        |                            |               |                  |             |  
  | 15    |       |                        |                            |               |                  |             |  
  *(Instructions: Tally costs per round. Subtract costs from true value when you choose.)*  

  ---

  ### **Option Decks (Pre-Generated for 4 Tables)**  
  *Generate proxy/true values in advance. Ranges: Proxy 30–100, True 10–100 (points).*  
  - **Table 1 (Flat World):**  
    Proxy and true values ~Uniform(50, 70). Weak correlation (e.g., true ≈ proxy ± 10).  
    *Rationale: Easy to satisfice; moderate aspiration (e.g., 60) works fine.*  
  - **Table 2 (Needle-in-Haystack World):**  
    80% mediocre options (proxy 40–60, true 30–50); 20% "gems" (proxy 40–60, true 80–100).  
    *Rationale: High reward for inspecting mediocre proxies. High aspiration fails.*  
  - **Table 3 (Proxy = Truth World):**  
    True value ≈ proxy ± 5. Strong correlation (e.g., proxy 70 → true 65–75).  
    *Rationale: Trusting the proxy is rational. Low inspection needed.*  
  - **Table 4 (Noisy Proxy World):**  
    True value independent of proxy (e.g., proxy 80 → true could be 20 or 90).  
    *Rationale: Proxy is useless; inspection is unavoidable.*  

  ---

  ### **Gameplay Timeline (75 Min Total)**  
  1. **Intro (5 min):**  
     - Explain goal/rules (no slides). Emphasize: "Maximize points. You control when to stop."  
     - Hand out materials. Students write **initial aspiration level** on score sheets.  
  2. **Game Rounds (30 min):**  
     - 15 rounds, 15 sec each. Announce: "Round 1... Proxy revealed!" → *15 sec decision* → "Round 2..." etc.  
     - At each table, a student flips the next card (proxy up).  
     - Students decide: Pass, Inspect (and Choose/Reject), or Change Aspiration (+2 pts).  
     - *Instructor:* Keep pace. Call "Time!" rigidly. Record rounds on whiteboard.  
  3. **Forced Choice (5 min):**  
     - After Round 15, anyone who hasn’t chosen must inspect/select the final option.  
     - Students calculate total points.  
  4. **Table Debrief (10 min):**  
     - Groups discuss:  
       - "What was your strategy? Did you stop early or late?"  
       - "Compare points: Who has the highest? How do they *feel* about their outcome?"  
  5. **Whole-Class Debrief (25 min):**  
     - *Map game moments to concepts:*  

       | **Game Moment**          | **Satisficing Concept**                  | **Instructor Script**                                                                 |  
       |--------------------------|------------------------------------------|---------------------------------------------------------------------------------------|  
       | Setting initial aspiration | Aspiration as heuristic                | "Your first aspiration was a guess. In uncertainty, heuristics reduce effort."        |  
       | Passing vs. Inspecting    | Search vs. inspection costs             | "Inspection was expensive! Relying on a proxy (free) was sometimes smarter."          |  
       | Changing aspiration       | Adaptive aspirations                   | "Paying to adjust goals mirrors real life—e.g., lowering standards when options suck."|  
       | Stopping early with points | Satisficing ≠ settling                 | "Stopping early maximized points for some. It’s not lazy—it’s rational in *their world*."|  
       | High points but regret    | Score vs. emotion gap                  | "Why do high scorers feel bad? We confuse ‘more search’ with ‘more effort = better’." |  

     - **Reveal environments:**  
       - Announce each table’s world (Flat, Needle-in-Haystack, etc.).  
       - Discuss: "Why did Table 1 (Flat) do well with moderate aspiration? Why did Table 2 (Needle) need to inspect more?"  
       - Key insight: "Rationality depends on the environment’s shape. No ‘one size fits all’!"  
  6. **Close (5 min):**  
     - Final question: **"By a show of hands: How many of you stopped before Round 10 and still scored in the top half of your table?"**  
       - Follow up: "How many of you feel like you ‘should have done better’ even with good points?"  
       - *Why this works:* Forces reflection on the score/emotion gap. If hands rise, the point landed.  

  ---

  ### **Predictable Problems & Fixes**  
  1. **Problem: "Gaming" the proxy.**  
     - *E.g.,* A student inspects everything in Noisy Proxy World, ignoring costs.  
     - **Fix:** Announce mid-game: "Remember, points are *net* (true value – costs). A high true value means nothing if you blew 50 pts on inspections."  

  2. **Problem: Everyone stops by Round 5.**  
     - **Fix:** In debrief, contrast tables: "Table 2, did anyone stop early? How did that work out?" Highlight how environments punish impulsivity (e.g., Table 2’s gems appear later).  

  3. **Problem: One table refuses to stop.**  
     - **Fix:** Enforce Round 15 rule. In debrief, say: "This group paid 15 search costs + inspections. Did their points reflect that cost?"  

  4. **Problem: Time per round runs over.**  
     - **Fix:** Use a loud timer. After 2 slow rounds, shorten to 12 sec. Sacrifice recording for pace.  

  ---

  ### **What the Game Can’t Stage (Need to Say Yourself)**  
  **The "Cost of Thinking" isn’t captured.**  
  - **Explain post-game:** "In real life, deliberation has mental costs we didn’t model (e.g., fatigue, opportunity cost). Satisficing avoids this by using simple rules—like aspiration levels—to avoid overthinking."  

  ---

  ### **Why This Isn’t the Secretary Problem**  
  - **Secretary Problem:** Known distribution, optimal stopping math, no costs.  
  - **This Game:** Unknown environment, costs for search/inspection/aspiration shifts, no "best" solution. Forces adaptation to ambiguity—core to bounded rationality.  

  ---  
  **Final Tip:** During gameplay, walk around and ask: "Why did you pass that option?" or "How’d you pick your aspiration?" to prime reflection. If students groan when they see a great option after stopping, lean into it in debrief: "That regret? That’s the heart of satisficing."
