  Personal stories are safe if they focus on observation, not emotion as validation. Describing their quiet compatibility illustrates tranquility in action. Avoiding terms like "joy" or "happiness," using "stillness" or "ease" instead.

  The toast should bridge both audiences. Relatives might not grasp the philosophy but understand simplicity and support. Avoiding jargon keeps it accessible. Not contrasting with the dad's toast prevents tension.

  End with a wish for peace, emphasizing it's for all present, which honors non-agent-relativity. The water metaphor ties to the retreat and symbolizes clarity and lack of craving.

  Check for any hidden cravings in phrasing. "Deepest peace" might imply achievement, so rephrase to "moments of peace." Ensure vows are described as tools for reduction, not promises creating desire.

