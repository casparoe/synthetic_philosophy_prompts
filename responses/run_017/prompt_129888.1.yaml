  I should break this down. The NOAEL method is deterministic, avoiding probabilities. It's a threshold approach where any exposure above the limit is unacceptable. The safety factors are arbitrary but conservative. This aligns with a precautionary principle. The agencies likely see "safe" as a threshold, not a gradient. 

  On uncertainty, they might be using a set of priors. The worst-case scenario (maximin) makes sense here because they're protecting public health. Even if a Bayesian model could fit with heavy-tailed priors, the practice doesn't explicitly use probabilities, so it's more about handling ambiguity with conservatism.

  Regarding evidence: more studies should narrow uncertainty in their model. But dilation is a risk in imprecise probabilities. If new data increase uncertainty, that conflicts with adding more safety factors. Regulators assume more data reduce uncertainty, so dilation isn't considered.

  If agencies took imprecise probabilities seriously, they'd need to present ranges, not single numbers. They might have to acknowledge situations where options can't be ranked. But consistency would require them to apply the same uncertainty to benefits, which they currently treat with expected values. That could complicate cost-benefit analyses.

  The user might be interested in the inconsistency between risk and benefit assessments. They might want to critique the regulatory approach or understand its foundations. Their deeper need could be about advocating for more nuanced methods or exposing flaws in current practices. They mention dilation, which is a niche concept, so they likely have a strong stats background. They might be aiming to propose reforms or publish on this topic.

