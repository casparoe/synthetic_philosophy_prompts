  The asymmetry point is interesting. On my grief reading, the dependence naturally flows one way: your death collapses the relational space where "I" existed between us, but my memory-preserved version of you can persist without you physically being there. That's actually consistent with how mourning functions - we keep internalized others alive psychologically long after they're gone. 

  I should emphasize how this handles the replica case cleanly: the machine has no lived history with the person, so no actual distributed selfhood gets created regardless of fidelity. The emotional pull comes from mistakenly equating psychological residue with identity survival. 

