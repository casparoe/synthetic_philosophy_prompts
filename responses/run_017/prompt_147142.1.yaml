prompt: |-
  Hey — I need help sharpening an argument I keep losing in a group chat.

  It's a betting/trading chat (mostly sports and prediction markets, a couple of poker guys, one person who's deep into the old rationality-blog scene). Any time anyone proposes a bet size, someone types "just bet Kelly" or "you're not maximizing your geometric growth rate." Last week it got used to shut down my friend. There's a one-off opportunity coming up: roughly a 55% chance of doubling whatever you put on it and a 45% chance of losing the stake, and my friend wants to put $4k on it out of the $10k he's set aside for this kind of thing. I work the Kelly fraction at about 10%, so call it $1k. The chat said that betting more than that isn't geometrically rational, and that in the long run the Kelly bettor ends up richer than anyone who overbets, with probability approaching 1. My friend says it's a one-time thing and he just wants the plus-EV bet; the chat says the slogan again, louder.

  Then this week the same slogan showed up in a totally different argument. Someone said that because growth is geometric, a small edge repeated beats a big one-shot score, so the whole approach should be "maximize the geometric expectation, not the arithmetic one." And one guy insisted this has nothing to do with repeated betting at all — that "geometric rationality" is really about how you aggregate a value function across possible worlds, that it's closer to a Nash bargaining solution than to expected utility maximization, and that it's rationally required for that reason. Someone else muttered something about ergodicity and time averages vs ensemble averages. That all sounds like a much bigger claim than "here's a decent heuristic for sizing bets," but I can't tell whether these are different claims or the same claim in three fancier hats.

  So: could you lay out the distinct precise claims that "maximize your geometric growth rate" / "just bet Kelly" could be making, as a numbered list ordered from the most boring reading to the most radical one? For each one I'd like (a) the claim stated precisely enough that I could in principle check it, (b) a verdict — trivial platitude, defensible but contentious, or false/misleading — and (c) whether it would actually do the work it was being made to do in either of the two arguments above.

  Please be concrete about the moving parts rather than hand-waving: what exactly has to be repeated, and how many times, for the long-run story to even apply; whether the bettor gets to reinvest and rebalance or has to pick a size once; whether the "bankroll" is all the wealth they have or just a labeled envelope (and whether future income is in the picture); whether the reading is about the almost-sure long-run growth rate, the median or geometric mean of terminal wealth after N bets, the probability of ruin, or just about having a concave (logarithmic) utility function; and what any of it says about a genuinely one-shot decision like my friend's, where log and linear barely differ at these stake sizes. Readings I might be conflating and want separated: it's just risk aversion with one particular utility function; it's the asymptotic dominance theorem; it's a claim about medians; it's a claim about not going bust; it's the cross-worlds geometric-mean / bargaining thing; it's the claim that expected-value maximization is incoherent for a non-ergodic quantity.

  Finish with two short sections: which reading people in that scene actually have in mind when they type it, and — if that's the reading they mean — whether it makes the slogan irrelevant to my friend's bet. List or table, whichever's clearer. And you can skip the derivation of Kelly fractions, I've definately got that part.
