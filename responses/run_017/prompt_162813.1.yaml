prompt: |-
  I sit on the program committee of a private foundation whose stated mission is to increase the number of people who lead flourishing lives, and at our next meeting we have to choose between two five-year grants of identical size. The vote is deadlocked in a way I have come to think is philosophical rather than empirical. Grant A funds contraceptive access and voluntary family planning in a district of roughly 900,000 people; the foundation's own modelling says it would avert about 11,000 births over five years, mostly births to women who report not wanting another child now, and that it would raise measured wellbeing among people who exist either way — maternal health, household earnings, schooling per child. Grant B funds IVF and fertility care in the same district, where staff estimate roughly 1,200 additional births over five years to people who want children and cannot otherwise have them. The staff economist scored both grants on wellbeing-adjusted person-years and got nearly the same figure: the lives averted under Grant A would, on our own data, have been well above the local average, while the lives created under Grant B are expected to come out slightly higher still, though the two estimates sit inside each other's error bars. A complication that keeps resurfacing is that many of Grant B's patients would eventually have conceived naturally, so the children born under the grant are not merely earlier versions of children who would otherwise have been born; under the grant, different children exist.

  The deadlock tracks two positions. One bloc argues that the beneficiaries of Grant B do not exist independently of the grant, so there is no one whom the grant makes better off and no one whom declining it leaves worse off; on the person-affecting asymmetry, Grant B's value is close to zero and Grant A wins comfortably on its benefits to women and existing children. The other bloc replies that Grant A does nothing the mission statement names — it makes nobody's life flourish — and points out that the first bloc's principle, applied consistently, would tell the foundation to stop counting most of what it currently counts. A third trustee has floated a compromise rule: count benefits to people whose existence depends on the grant, but only to the extent that their expected wellbeing exceeds a threshold set at the district median, and cap the contribution of such existence-dependent benefits at a fixed fraction of any grant's total score. Separately, our board chair has raised the repugnant conclusion about the mission statement itself, noting that maximizing the number of flourishing lives seems to imply that a much larger population of lives just barely worth living would be better, and has asked whether the committee should propose an amendment.

  Please draft the decision memo I will circulate before the meeting. It should recommend a concrete course of action — fund one grant, split the money, fund both with conditions, or decline both and reopen the search — with a rationale a colleague who disagrees could actually answer, and it should state whether you accept, reject, or revise the threshold-and-cap rule and why. It should also give the committee's honest view on whether to recommend amending the mission statement, and it should give the strongest version of the losing position rather than only arguing for the winner.
reasoning: |-
  Okay, I need to help draft a decision memo for a foundation's program committee. The user is on the committee and they're deadlocked between two grants: Grant A for contraceptive access and family planning, and Grant B for IVF and fertility care. Both have similar wellbeing-adjusted person-year scores according to their economist, but there's a philosophical split. 

  First, I should understand the core conflict. Grant A averts births that would have below-average wellbeing, improving lives of existing people. Grant B creates new lives that might have slightly higher wellbeing, but many would have been born anyway naturally. The deadlock is about whether creating new lives counts as "increasing flourishing lives" under their mission.

  The user wants the memo to recommend a concrete action, address the threshold-and-cap compromise rule, and give an honest view on amending the mission statement. They also want it to present the strongest version of the losing position fairly.

  Hmm... the philosophical tension is real here. The person-affecting view says only existing people matter, while the total view says new lives count if they're happy. The repugnant conclusion lurks in the background too - if they focus only on maximizing numbers, they might endorse creating marginally happy lives.

  For the recommendation... Grant A seems more aligned with avoiding harm to existing people. But I need to be careful not to dismiss Grant B's perspective entirely. The memo should validate both views before choosing.

  The compromise rule about counting existence-dependent benefits above a threshold... that feels messy. Setting the threshold at median wellbeing might be arbitrary, and capping creates new problems. Probably better to reject it as unworkable.

  About the mission statement... yeah, maximizing "number" is problematic. They should consider shifting to "quality" or "proportion" of flourishing lives. That avoids the repugnant conclusion while keeping their core intent.

  For structure: start with framing the dilemma fairly, then recommend Grant A with clear reasoning, explain why we reject the compromise rule, suggest mission statement revision, and acknowledge how Grant B has merit despite not being chosen. Need to maintain respectful tone throughout - these are colleagues with deep philosophical differences.

  The user will circulate this before the meeting, so it needs to facilitate discussion while providing leadership. Should end with practical next steps about voting procedures and mission review process.
answer: |-
  **MEMORANDUM**  
  **TO:** Program Committee, [Foundation Name]  
  **FROM:** [Your Name], Program Committee Member  
  **DATE:** [Date]  
  **SUBJECT:** Recommendation for Five-Year Grant Allocation and Mission Review  

  ### **I. Summary of the Decision Context**  
  The committee faces a choice between two high-impact grants with nearly identical wellbeing-adjusted person-year (WAPY) scores:  
  - **Grant A:** Contraceptive access/voluntary family planning. Averts ~11,000 births (primarily unwanted), improving maternal health, household earnings, and child schooling for existing populations.  
  - **Grant B:** IVF/fertility care. Creates ~1,200 births (to otherwise infertile individuals), with children expected to have marginally higher wellbeing than those averted by Grant A.  

  A philosophical deadlock exists regarding whether Grant B’s creation of *new lives* aligns with our mission to "increase the number of people who lead flourishing lives." Staff modeling indicates:  
  - Grant A improves wellbeing for existing people.  
  - Grant B creates new people who would not otherwise exist, but whose lives are projected to flourish.  

  A compromise rule (counting existence-dependent benefits above a wellbeing threshold, capped at a fraction of total impact) has been proposed. Separately, the Board Chair has raised concerns about the "repugnant conclusion" implicit in our mission statement.  

  ---

  ### **II. Recommendation: Fund Grant A, Reject the Threshold-and-Cap Rule, and Revise the Mission Statement**  
  **1. Grant Allocation: Fund Grant A**  
     - **Rationale:**  
       - **Mission Alignment:** Grant A demonstrably enables flourishing *for people who exist today*. It prevents involuntary hardship (unwanted births) and improves health, economic stability, and education—core drivers of flourishing per our metrics.  
       - **Avoidance of Moral Uncertainty:** Grant B’s impact relies on creating new lives. While these lives may flourish, our mission does not explicitly prioritize *creating* flourishing lives over *preventing suffering* for existing people. Grant A’s benefits are person-affecting (directly improving identifiable lives) and avoid philosophical objections about "non-identity."  
       - **Risk Mitigation:** Grant B’s impact is partially offset by natural conception rates, reducing net addition of new lives. Grant A’s averted births represent unambiguous welfare gains for current individuals.  

     - **Strongest Case for Grant B (Losing Position):**  
       Grant B fulfills a profound human desire (parenthood) and creates lives expected to flourish above the local average. If our mission is interpreted *literally*, creating 1,200 flourishing lives may be equivalent to improving existing lives. Rejecting Grant B risks dismissing the intrinsic value of existence for wanted children and invalidating fertility care as a tool for flourishing.  

  **2. Threshold-and-Cap Rule: Reject**  
     - **Why:**  
       - **Arbitrary Thresholds:** Setting a wellbeing "threshold" (e.g., district median) is ethically dubious. A life below median may still be deeply flourishing for that individual.  
       - **Operational Chaos:** Capping existence-dependent benefits invites gaming of models and complicates comparative scoring.  
       - **Insufficient Justification:** The rule attempts to reconcile incompatible moral frameworks but fails to resolve the core dilemma. It risks privileging Grant B while undermining Grant A’s person-affecting benefits.  

  **3. Mission Statement: Recommend Amendment**  
     - **Rationale:**  
       The current mission ("increase the *number* of people who lead flourishing lives") invites the repugnant conclusion: it could justify prioritizing quantity of lives over quality (e.g., incentivizing a larger population with minimally flourishing lives). This is inconsistent with our focus on *flourishing* as a qualitative standard.  
     - **Proposed Revision:**  
       *"To ensure more people lead flourishing lives, with priority given to relieving involuntary constraints on flourishing."*  
       This:  
       (a) Retains focus on expanding flourishing,  
       (b) Avoids repugnant conclusions by not fetishizing population size,  
       (c) Clarifies that alleviating suffering (e.g., unwanted births, infertility) is central.  

  ---

  ### **III. Additional Considerations**  
  - **Why Not Split Funding?**  
    Splitting dilutes impact. Grant A requires scale to shift cultural and systemic barriers to family planning. Grant B’s IVF services are resource-intensive per beneficiary; partial funding may not achieve critical mass.  
  - **Why Not Decline Both?**  
    Both grants meet technical standards. Declining wastes due diligence and delays impact. Our deadlock is philosophical, not empirical.  
  - **Scope of Revision:**  
    The mission amendment addresses the repugnant conclusion but does not resolve person-affecting vs. totalist ethics. Further ethics training for trustees is advised.  

  ---

  ### **IV. Committee Actions Requested**  
  1. **Vote to Fund Grant A.**  
  2. **Reject the threshold-and-cap compromise rule.**  
  3. **Approve a subcommittee to draft a revised mission statement** (using the proposed language above as a starting point) for full Board review.  

  This recommendation prioritizes clear, measurable flourishing for existing people while initiating essential mission reforms to prevent future deadlocks. We acknowledge the moral weight of Grant B but find Grant A’s alignment with our *current* mission and lower ethical risk decisive.  

  ---  
  **Attachment:** Staff Impact Analysis Summary (WAPY Model Details)  
  **Draft Response:** "I oppose funding Grant A because..." [Provide template for dissenting opinions]  

  Respectfully submitted,  
  [Your Name]
