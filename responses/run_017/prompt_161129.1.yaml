  Subject: Amberlight Fund Payout Rule Recommendation for April 14 Meeting  

  Hi everyone,  

  Thank you for entrusting me with drafting the memo on our payout rule. I’ve wrestled with the geometric growth arguments, the expected-value case, and the nuances of our constraints—especially the $3M sunset threshold and the Core Program’s $1.2M annual absorptive cap. Below, I’ll outline a concrete rule, the reasoning behind it, and a balanced critique of the key positions on the committee. The goal is a practical, vote-ready proposal that respects our mandate and avoids ruin while maximizing expected impact.  

  ### The Core Problem  
  Our decision boils down to choosing a fraction \( f \) of the remaining balance \( B \) to allocate to speculative grants each year, knowing that:  
  - **Speculative grants**: Fail 90% of the time (0 cause units) or succeed 10% of the time (30 cause units per dollar staked). The expected cause-unit return is 3x per dollar allocated.  
  - **Core Program**: Absorbs up to $1.2M annually (1 cause unit per dollar), with unspent amounts rolling over.  
  - **Sunset risk**: If \( B \) drops below $3M, the fund is sunset, and remaining dollars yield only 0.05 cause units (20x worse than Core).  
  - **Horizon**: We have a hard 10-year deadline to deploy the fund.  

  The tension is between two views:  
  1. **Expected-value maximizers (your colleagues’ view)**: Bet aggressively (high \( f \)) because speculative grants return 3x in expectation. Accept that ruin—demoting future dollars to 5% efficiency—is the price of the upside.  
  2. **Growth/compounders (my view)**: Favor moderation to avoid ruin, as a ruined fund can’t capitalize on future wins, and the absorptive cap limits windfall deployment. But with a non-zero ruin value (0.05x), the standard "maximize log wealth" argument (Kelly) doesn’t cleanly apply.  

  ### The Proposed Rule  
  After modeling trade-offs (including cause units over 10 years, sunset risk, and the absorptive cap), I recommend:  

  **In Year 10**: Allocate 100% of \( B \) to speculative grants.  
  **In Years 1–9**:  
  - If \( B < \$4.2M \), allocate 100% to speculative grants.  
  - If \( B \geq \$4.2M \), allocate \( \min(0.1, 1 - \frac{4.2}{B}) \) to speculative grants (i.e., 10% or the fraction ensuring \( B \) stays above $3M next year, whichever is lower).  

  **Handling balance drift**: As \( B \) fluctuates, recalculate \( f \) annually. If \( B \) drops below $4.2M, shift to 100% speculative. If \( B \) grows, cap \( f \) at 10% when \( B \gg \$4.2M \).  

  **Revisiting**: Review every three years (or if grant success probabilities shift materially).  

  ### Why This Rule?  
  - **For Years 1–9 with \( B \geq \$4.2M \)**: We ensure \( B \) never drops below $3M next year. The ceiling \( 1 - \frac{4.2}{B} \) guarantees the rollover after Core spending is \(\geq \$3M\). For example:  
    - At \( B = \$12M \), \( f = \min(0.1, 0.65) = 0.1 \) → $1.2M to Core, $1.2M to speculative, $9.6M rolls over.  
    - At \( B = \$4.5M \), \( f = \min(0.1, 0.067) = 0.067 \) → $1.2M to Core, $0.3M to speculative, $3.0M rolls over.  
    Capping \( f \) at 10% when possible reduces variance while preserving expected upside, as the safe region allows any \( f \) to achieve the same *expected* cause units long-term (more below).  

  - **For \( B < \$4.2M \) or Year 10**: We go all-in (100% speculative). Here, avoiding ruin is impossible next year (even \( f = 0 \) leaves \( B - 1.2 < \$3M \)), so maximizing expected cause units now dominates. The 3x expectation outweighs the low ruin value (e.g., at \( B = \$4.0M \), \( f = 1 \) expects 12 cause units; \( f = 0 \) yields 1.34). In Year 10, there’s no future to preserve, so we maximize expectation.  

  ### Addressing the Key Objections  
  **To expected-value maximizers**: Your intuition that 3x > 1x justifies high \( f \) is mathematically sound in a vacuum. If we ignore the sunset rule and absorptive cap, betting large *does* maximize expected value. But in our constrained world:  
  - Ruin isn’t "zero" (it’s 0.05x), but it’s severe: A fund sunset in Year 2 can’t compound wins in Year 7.  
  - The absorptive cap means windfalls can’t be deployed instantly. Pushing \( B \) too low forces a "double or nothing" gamble (e.g., 100% speculative at \( B < \$4.2M \)) when sustainability fails.  
  - Crucially, in the safe region (\( B \geq \$4.2M \)), any \( f \) yields identical *expected* cause units long-term (simulations show ~\( 3B - 24 \) cause units from Year 1). We trade off excess risk for no expected gain by exceeding 10%.  

  **To growth/compounders (me)**: Avoiding ruin matters, but insisting on ultra-low \( f \) (e.g., full Kelly ~7%) undervalues opportunities. At \( B \geq \$4.2M \), 10% balances growth and safety. Below $4.2M, 100% speculative exploits the 3x edge aggressively—which even Kelly supports when ruin is unavoidable.  

  ### Confidence and Uncertainties  
  I’m **moderately confident** in this rule. It:  
  - Ensures we never trigger ruin unnecessarily.  
  - Balances the committee’s views: aggressive where we must be (low \( B \) or Year 10), restrained where possible.  
  - Is simple to implement annually.  

  **The biggest uncertainty**: The safe region’s assumption that *any* \( f \) (within bounds) yields equal expected cause units relies on future flexibility. If later-year balances dip unpredictably, forcing unsafe allocations, outcomes could deviate. This is the trade-off for simplicity vs. a dynamic programming approach.  

  ### Final Thoughts  
  This rule maximizes expected cause units while minimizing avoidable ruin. It respects our mandate, the donor’s sunset clause, and our duty to deploy ambitiously but responsibly. I look forward to refining this together on April 14.  

  Best,  
  [Your Name]
