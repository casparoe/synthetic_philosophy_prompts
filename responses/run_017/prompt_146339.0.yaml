  ### Activity Design: Discovering Anthropic Reasoning through Serial Numbers

  **Materials & Setup:**
  1. **World Selection & Serial Numbers:**
     - Two sealed envelopes: one labeled "SHORT WORLD (Total: 200)", the other "LONG WORLD (Total: 200,000)". Only one contains a confirmation slip (e.g., "This world was selected").
     - **Auditable Procedure:** Flip a fair coin in front of the group: heads → short world, tails → long world. Use a public random number generator (e.g., random.org) to draw 16 unique serial numbers from the selected world’s population range (1–200 for short, 1–200,000 for long). Seal the world choice and serial numbers in an envelope displayed prominently.  
     - **Identity Cards:** Each participant receives a card with their serial number (e.g., "47") and a dossier listing three nested reference classes:  
       - **Class A:** *Homo sapiens* (short: 200, long: 200,000)  
       - **Class B:** Beings who have built radio telescopes (short: 200, long: 200)  
       - **Class C:** Beings capable of updating on evidence (short: 200, long: 200,000)  

  2. **Instructions to Participants (written):**  
     - "You are in one of two worlds: SHORT (total population: 200) or LONG (total population: 200,000). Your serial number is a uniform random draw from the *actual* world’s population.  
     - Choose **one** reference class (A, B, or C) and a **credence** (0 to 1) that the world is SHORT.  
     - You will be scored using a quadratic scoring rule:  
       - If SHORT: Score = 1 - (1 - credence)²  
       - If LONG: Score = 1 - (credence)²  
     - Example scores:  

       | Credence for SHORT | Score if SHORT | Score if LONG |
       |-------------------|----------------|---------------|
       | 0.0               | 0.00           | 1.00          |
       | 0.5               | 0.75           | 0.75          |
       | 1.0               | 1.00           | 0.00          |
       | 0.2               | 0.36           | 0.96          |
       | 0.8               | 0.96           | 0.36          |

     - Commit your class and credence in writing. The facilitator will not intervene."

  **How Participants Discover Key Insights:**  
  1. **Updating on Serial Position:**  
     - A low serial number (e.g., 10) in a class with differing population ratios (e.g., Class B) shifts confidence toward SHORT. For instance:  
       - With Class B (radio telescopes), the likelihood ratio is:  
         - P(number=10 \| SHORT) / P(number=10 \| LONG) = (1/200) / (1/200) = 1 → **no update**.  
       - With Class A (*Homo sapiens*), the ratio is (1/200) / (1/200,000) = 1000 → **strong evidence for SHORT**.  
     - Participants see their credence shift based on their number and chosen class.  

  2. **Dependence on Unchosen Reference Class:**  
     - Scoring reveals that credences (and thus scores) vary drastically by class. For example:  
       - Choosing Class B always yields likelihood ratio = 1 (no update from prior).  
       - Choosing Class A amplifies evidence from low numbers.  
     - Participants discover post-scoring that their inference was silently governed by an unsolicited choice: **which class they treated as their "reference class" for sampling**.  

  **Debrief:**  
  1. **Map to Anthropic Concepts:**  
     - **Self-Sampling Assumption (SSA):** Participants assumed they were uniformly sampled from their chosen class. This mirrors SSA’s idea that "you" are a random observer from a reference class.  
     - **Self-Indication Assumption (SIA):** Not covered directly, but hinted at—e.g., Class C (updaters) has the same size in both worlds, so it "indicates" no evidence (like SIA’s bias toward larger populations).  
     - **Reference Class Problem:** The activity forces unnoticed class choices. For example:  
       - Class A treats humans as the relevant group → doomsday-like update.  
       - Class B (radio telescopes) ignores population size differences → no update.  
       - No class is "correct"; the choice changes the outcome.  

  2. **Predictable Issues & Mitigation:**  
     - **"Prior = 0.5, so I learn nothing":** Some will default to 50% prior and report no update (e.g., Class B). *Handling:* In debrief, clarify that priors should reflect external knowledge (e.g., "Have you seen evidence favoring SHORT or LONG?"), not symmetry.  
     - **Gaming the Class:** A few may choose the class that maximizes score (e.g., pick Class B and credence 0.0 in LONG world). *Handling:* Emphasize during debrief that scores reward *honest* credences based on the class, not strategic picks.  
     - **Low Numbers in LONG World:** Participants with numbers ≤200 in LONG world will see strong evidence for SHORT (e.g., via Class A) and score poorly. *Handling:* Acknowledge this upfront: "In a LONG world, low numbers are rare but possible—like flipping 10 heads in a row. The argument isn’t foolproof."  

  **What the Activity Cannot Reproduce:**  
  - **The Prior Isn’t a Coin Flip:** Real anthropic reasoning uses priors grounded in science (e.g., humanity’s survival prospects), not arbitrary 50/50.  
  - **Discrete Worlds vs. Continuum:** Real populations span a spectrum of sizes (not two extremes), and the doomsday argument applies to distributions, not binaries.  

  **One-Sentence Takeaway:**  
  Participants should come away seeing that **the live disagreement in anthropic reasoning is not about the arithmetic of Bayes, but about which unchosen sampling assumption (reference class) governs it—and no serial number can resolve that choice.**
