               "You are to choose one of these two classes. Then, condition on being randomly sampled from that class. Update your belief about which world you are in based on your serial number. You start with a prior of your choice. Then report:
                   (a) which class you are using,
                   (b) your credence (between 0 and 1) that the world is short.

               Your score will be computed by a quadratic scoring rule. Specifically:
                   If the world is short: score = 1 - (1 - p)^2
                   If the world is long: score = 1 - p^2

               where p is the credence you reported for short.

               We have a table of example scores:

               | p (credence in short) | If short: score | If long: score |
               |------------------------|-----------------|----------------|
               | 0.0                   | 1 - (1-0)^2 = 0 | 1 - 0^2 = 1    |
               | 0.5                   | 1 - (0.5)^2 = 0.75 | 1 - (0.5)^2 = 0.75 |
               | 1.0                   | 1 - (0)^2 = 1   | 1 - 1^2 = 0    |
               | 0.2                   | 1 - (0.8)^2 = 0.36 | 1 - (0.2)^2 = 0.96 |
               | 0.8                   | 1 - (0.2)^2 = 0.96 | 1 - (0.8)^2 = 0.36 |

               Note: You are free to choose your prior. There is no single correct prior."

          - They commit in writing.

     Debrief:

          We will reveal the world and then discuss.

          What predictably goes wrong:

            a) Some participants will assume a prior of 0.5 and then update:

                 For Class 1: 
                    Prior odds: 1:1
                    Likelihood ratio: (1/200) / (1/200000) = 1000.
                    Posterior odds: 1000:1 -> p(short) = 1000/1001 ≈ 0.999

                 For Class 2:
                    Prior odds: 1:1
                    Likelihood ratio: (1/200) / (1/1000) = 5.
                    Posterior odds: 5:1 -> p(short) = 5/6 ≈ 0.833

            b) Some participants might choose the class that gives them the highest score? But the scoring rule is proper, so they should report their true credence. And the class is part of their updating model. We are not scoring the choice of class, only the credence. But the credence depends on the class. So they might choose the class that gives them a credence that they feel is safer? We don't control for that.

            c) In the long world, participants with low serial numbers (<=200) will update toward short. They might feel cheated. We should explain that this is a known issue: if you are in the long world, you might by chance have a low serial number and then the doomsday argument would mislead you.

          We then map to anthropic reasoning:

            - The self-sampling assumption (SSA) says that you should reason as if you are a random sample from a suitable reference class. In this activity, the reference class was either Class 1 or Class 2. The choice of reference class is crucial and is not settled by the data.

            - The self-indication assumption (SIA) might be mentioned: it says that the very fact that you exist is evidence for a larger population. But we didn't cover that.

          We note that the exercise cannot reproduce:

            - The prior in the doomsday argument is not a coin flip. It should be based on our best theories about the future of humanity.

            - The real hypothesis space is not two discrete totals. There is a continuum.

            - In the real doomsday argument, the reference class is hard to define.

          One-sentence takeaway:

            Participants should come away seeing that the live disagreement is not about the arithmetic but about which sampling assumption governs, and that no datum of the kind they were given settles it.

     Let's code the example scoring table in the instructions:

          We'll provide:

            p   | Score if short | Score if long
            0.0 | 0.00           | 1.00
            0.5 | 0.75           | 0.75
            1.0 | 1.00           | 0.00
            0.2 | 0.36           | 0.96
            0.8 | 0.96           | 0.36

     We'll also include a note: "Your score is maximized when you report your true credence."

     Finally, we note that the activity might have some participants in the long world with low numbers who will update to high credence in short and then get a low score. We should be prepared to explain that this is a known issue and that the doomsday argument can be misleading in individual cases.

     This design meets the constraints.
