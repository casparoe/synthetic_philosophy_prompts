answer: |-
  ## 1. The Swap
  The new temp scanned crate #L7-229’s barcode, then #L7-292. Identical labels, adjacent slots in the long-term cryogenic vault. Routine movement before the biannual defrost cycle. Her glove snagged; she fumbled. Recovering, she slid #229 into #292’s designated transport cart. #292 went onto #229’s cart. A blink of friction, nothing more. The carts whirred down separate corridors towards different freezer banks, their routes diverging like split streams. The vault lights hummed, indifferent. In Control, a routine system check scrolled past, green. The temp moved to the next aisle, the momentary awkwardness already fading. Both crates held irreplaceable heritage wheat strains, their futures now silently rerouted by a stumble under fluorescent lights.

  ## 2. The Alarm
  Freezer Bank C-12’s temperature sensor spiked. Not catastrophic – yet. The automated alert pinged Engineer Singh’s tablet during his lunch break. He finished his sandwich, checked the time. Protocol demanded immediate inspection. But Bank C-12 was scheduled for its defrost cycle in ninety minutes anyway. The spike was likely a transient fault, common during pre-thaw instability. Singh logged the alert as 'Monitor', reasoning the imminent cycle would resolve it. Had the alert been for Bank D-7, scheduled tomorrow, he’d have gone immediately. He sipped his tea. The sensor reading fluctuated again, then steadied, just below the critical threshold. Singh scheduled a post-thaw diagnostic. The clock ticked towards the cycle start.

  ## 3. The Thaw
  The automated defrost for Bank C-12 initiated. Warm air pulsed into the sealed unit. Inside crate #L7-292, nestled where #L7-229 should have been, latent moisture from a minor, years-old seal flaw reacted violently to the rapid temperature change. Ice crystals expanded, fracturing delicate seed embryos beyond recovery. The thermal stress also tripped a secondary coolant valve offline – a known, intermittent issue flagged for next quarter's maintenance. In Bank D-7, crate #L7-229, spared this specific thermal shock due to its correct placement, thawed perfectly. Singh later confirmed the sensor spike was indeed transient. The irreversible damage was confined solely to the seeds within #L7-292, victims of an incorrect location during a routine procedure.

  ## 4. The Inventory
  Dr. Elara Vance held the inventory report. Strain ‘Kernza Dawn’, unique cold-adaptive genes painstakingly collected over decades, listed under #L7-292: ‘Non-viable. Total loss.’ The other crate’s contents were fine. She walked to the viewing port of Bank C-12, now humming normally again. Those specific seeds were gone forever. Yet the report’s appendix was stark: Bank C-12’s coolant valve fault was worsening; complete failure was projected within six months. *All* seeds in this bank were ultimately doomed without intervention. Kernza Dawn was lost *this way*, *now*, in this specific, avoidable manner. But its extinction here was certain. She touched the cold glass, mourning the particular loss, knowing the whole vault was sliding towards silence.

  ## 5. The Meeting
  The safety review panel reviewed the draft report. Page one detailed the crate swap: a procedural lapse, the root cause. Page three noted the bank’s systemic vulnerability: the outcome was inevitable given the uncorrected valve. The Head of Biosecurity tapped the table. "Recommendation: mandatory dual verification for crate movements." The Finance Director scanned the cost projections for replacing Bank C-12. "We accelerate the Bank D refit instead. Patch C-12's valve, postpone full replacement." The report draft sat between them, its narrative solidified – a small error triggering a specific loss within a failing system. The Chair collected the revisions. "Final edits by Friday. Sign-off closes this incident." The next system alert blinked, unnoticed, on a secondary screen.
