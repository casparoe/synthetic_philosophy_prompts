  > "While some object that constitutional entrenchment constitutes a 'dead hand of the past' whereas psychiatric advance directives express autonomy (cf. Smith 2020), this contrast relies on distinct underlying theses: either (a) a *capacity-based objection* (inapplicable to constitutions assuming institutional continuity), or (b) a *presentist claim* about decision-rights (which would equally invalidate advance directives if consistently applied). Conversely, the Ulysses metaphor ('freer tied than untied') highlights structural parallels: both devices enable agents to overcome future volitional or epistemic limitations (Elster 2000; Dresser 1982). Devices like reaffirmation clauses or two-key directives (see §3.4) neutralize many practical objections but reveal that persistent critiques often reject diachronic agency *as such* (Waldron 1999) rather than the precommitment structure itself."

