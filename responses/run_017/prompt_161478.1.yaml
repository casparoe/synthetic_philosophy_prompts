prompt: |-
  I've been teaching Du Bois's 1926 essay Criteria of Negro Art — the one where he insists that all art is propaganda and always must be, but that propaganda which isn't also beautiful is worthless and does the cause no good — and I want to run it against a real case: Marian Anderson's Easter Sunday concert on the Lincoln Memorial steps. Take the facts as I give them, so we don't argue about them: the Daughters of the American Revolution had refused her Constitution Hall because she was Black, Eleanor Roosevelt resigned from the DAR over it, the Roosevelt administration helped arrange an open-air concert instead, and on April 9, 1939 she sang to something like 75,000 people on the Mall with millions more on the radio; the program was classical arias and spirituals, it closed with a patriotic hymn, and by her own account she did not see herself as staging a protest and wasn't the one who organized it.

  Analyze that concert as propaganda on Du Bois's terms, and please use my distinction rather than inventing your own: (a) carrier propaganda, where the message rides in the content of the work itself, (b) occasion propaganda, where the argument is made by the setting and the audience, the who-and-where of the perfomance, rather than by what gets performed, and (c) exemplar propaganda, where the mere existence of a Black artist working at that level is meant to refute the inferiority claim, so the work functions as evidence rather than as persuasion. Which of the three does Du Bois's own practice actually license — the pageants, the editing of The Crisis, his taste in song and poetry — and which would he have rejected as accommodation to white taste, given how hard he came down on Harlem Renaissance writers he thought were flattering that taste? Most of all: does his beauty requirement attach to the work, to the staging, or to neither? Then turn it around and say what the episode does to the theory — whether it confirms it, or shows that once occasion counts, all art is propaganda collapses into near-vacuity (any performance by a Black artist in a segregationist capital is propaganda no matter what gets sung), and that the live question was never whether it was propaganda but what sort of work occasion-propaganda can do. Be honest about where the framework is silent; I'd rather you name a gap than stretch Du Bois to fill it.

  No headings, bullets, bold, or tables — just continuous prose, like an email.
reasoning: |-
  Okay, the user is teaching Du Bois's "Criteria of Negro Art" and wants to apply it to Marian Anderson's 1939 Lincoln Memorial concert. They've set up three categories: carrier, occasion, and exemplar propaganda. My task is to analyze the concert through these lenses, then connect it to Du Bois's own practice and critique the theory where needed.

  First, the concert itself. Using the user's definitions: Carrier propaganda would be absent since Anderson sang classical arias and spirituals without overt political content. Occasion propaganda dominates here - the forced venue change created a powerful symbolic setting. Exemplar propaganda is also present through her artistic excellence challenging racial stereotypes. 

  Now, Du Bois's own work. His Crisis editorials were carrier propaganda (direct messaging), while his pageants blended carrier and occasion through collective performance. He'd likely reject spirituals performed as "quaint folklore" for white audiences but respect them as cultural mastery in this context. His beauty requirement seems to attach primarily to the work itself - craft as political armor against dismissal.

  Turning to theory tensions: This case exposes how occasion can make anything propaganda, potentially hollowing Du Bois's claim. The real question isn't "if propaganda" but what work each type does. Carrier propaganda argues; exemplar proves; occasion confronts. Du Bois's framework lacks vocabulary for how venue amplifies exemplar power - Anderson's artistry became inescapable on federal ground.

  Gaps noted: The theory doesn't address unintended propaganda (Anderson's apolitical stance made the occasion more potent), nor how white allies (Roosevelt) complicate messaging control. Most crucially, it undervalues how occasion propaganda creates visceral, communal proof - 75,000 witnesses couldn't unsee her excellence where Jim Crow tried to erase it.
answer: |-
  Analyzing Marian Anderson's 1939 concert through Du Bois's lens, using your defined categories, reveals both the power and limitations of his framework in "Criteria of Negro Art."

  Applying the categories directly:
  1.  **Carrier Propaganda:** The concert itself contained minimal carrier propaganda. The repertoire – classical arias, spirituals, and a patriotic hymn – largely avoided explicit political messaging *within the content*. The spirituals carried deep cultural resonance for Black audiences, affirming heritage and resilience, arguably functioning as subtle carrier propaganda within the community. For the wider audience, however, the spirituals were often received as beautiful folk art rather than overt protest. The patriotic hymn ("America (My Country 'Tis of Thee)") delivered on the Lincoln Memorial steps possessed profound *irony*, but that irony resided in the occasion, not the lyrics themselves. The content chosen was primarily artistic, not argumentative text.
  2.  **Occasion Propaganda:** This is overwhelmingly dominant. The *fact* of the concert, its location, and its cause became the message. The DAR's racist refusal, Eleanor Roosevelt's public resignation, and the federal government's intervention (placing a Black woman denied a private hall onto the nation's most potent symbol of freedom and equality) transformed the event into a massive, undeniable statement about American hypocrisy and Black exclusion. The vast integrated crowd and radio audience amplified this. The setting screamed the argument Du Bois demanded: the injustice of segregation and the demand for recognition. Anderson's artistry provided the necessary beauty, but the *propaganda* stemmed intrinsically from the "who-and-where."
  3.  **Exemplar Propaganda:** This was fundamental and inseparable from the occasion. Anderson's supreme technical mastery and profound interpretative depth, undeniable in this prestigious setting, served as irrefutable evidence against claims of Black inferiority. Her very presence, performing classical repertoire at the highest level on that symbolic stage, *was* the argument. The beauty and excellence of her performance were not just artistic triumphs; they were the ammunition for the exemplar case. She embodied the potential Du Bois argued Black art must showcase.

  Regarding Du Bois's practice and taste:
  Du Bois's own work – the pageants, *The Crisis* editorials, his championing of certain poets and songs – primarily utilized **carrier propaganda** (explicit messages in editorials, historical narratives in pageants) and **exemplar propaganda** (showcasing Black intellectual and artistic achievement in *The Crisis*). His pageants also harnessed **occasion propaganda** through their scale and public, community-affirming nature. He fiercely championed beauty rooted in authentic Black experience and uncompromising truth. He would have **rejected** art he saw as pandering to white stereotypes or expectations for mere acceptance, viewing it as a betrayal. For Anderson, the spirituals performed with integrity and artistry would likely have met his standard, avoiding the "quaint" or demeaning presentation he despised. The classical repertoire, performed with such mastery, functioned as potent exemplar propaganda, demonstrating capability within the dominant cultural canon – something Du Bois understood as strategically necessary evidence. He would likely have embraced the *exemplar* power of her performance itself. The potential conflict might lie in the patriotic hymn – its carrier message could be seen as accommodationist, though its performance in *that* context subverted it into occasion propaganda.

  The Beauty Requirement:
  Du Bois's insistence on beauty attaches most directly to **the work itself** – the artistic quality of the creation or performance. For him, propaganda fails if it is artistically shoddy; it becomes mere noise easily dismissed. Anderson’s concert succeeded spectacularly on this front. Her vocal beauty, technical precision, and emotional depth were undeniable, forcing even hostile listeners to confront the excellence. The *staging* (the majestic Memorial, the vast crowd) amplified the impact, but the core beauty resided in her artistry. Without that intrinsic artistic merit, the occasion propaganda would have been far less potent. The beauty validated the exemplar claim and made the occasion impossible to ignore.

  Challenging the Theory:
  This episode simultaneously confirms and strains Du Bois’s thesis. It confirms that art *can* be powerful propaganda, especially through the exemplar and occasion modes he implicitly acknowledged. The beauty requirement was demonstrably vital; Anderson’s brilliance gave the event its undeniable force.

  However, it exposes a critical tension in the claim "all art is propaganda." When **occasion propaganda** dominates so completely, the claim risks becoming vacuously true. *Any* competent performance by a Black artist on the Lincoln Memorial steps in 1939, forced there by racist exclusion, would have been propaganda by virtue of the context. The *content* (carrier) becomes almost secondary to the *fact* of the performance in that space. Du Bois's framework struggles to fully account for this. It doesn't adequately distinguish between the artist's *intent* (Anderson saw herself as an artist, not a protester) and the *effect* dictated by context. The theory leans heavily on the creator's purpose and the work's content, but here, the propaganda was largely manufactured by external forces (the DAR's action, the government's response, public perception) and the symbolic weight of the venue.

  The episode shifts the focus. It suggests that for marginalized artists operating within oppressive systems, the question isn't *whether* their public art functions as propaganda (the occasion often ensures it does), but rather **what *kind* of work the propaganda performs** and **whether the artistry possesses the necessary beauty to make that propaganda effective and enduring**. Anderson’s concert powerfully demonstrates that **exemplar and occasion propaganda**, fueled by artistic excellence, can create moments of undeniable, visceral confrontation with societal contradictions – perhaps more effectively than overt carrier propaganda in certain contexts. Du Bois's framework is somewhat silent on the mechanics and unique power of occasion propaganda, particularly when generated by forces beyond the artist's control. It also under-theorizes how exemplar propaganda operates through public performance in contested spaces, achieving its effect through visibility and excellence rather than explicit argument. The gap lies in the theory's primary focus on the artist's creation and intent, when the propaganda power can reside overwhelmingly in the context of reception and the societal forces that frame the event. The concert confirms the necessity of beauty but shows that the *source* of the propaganda argument can be external, leveraging the artist's excellence within a charged moment created by others. The live question becomes about the efficacy and nature of the propaganda generated by the occasion, not its mere existence.
