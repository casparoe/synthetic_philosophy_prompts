prompt: |-
  Hi — I'm a backend engineer, no philosophy background beyond a few podcasts, and I've somehow ended up as the person a friend who works on governance stuff at an NGO argues with about definitions. Two real arguments set this off. First: a vendor sent our team fairly expensive gifts while we were evaluating them for a contract. Nobody thought it was a bribe, we logged it and moved on, but I couldn't say why it wasn't one, or at what point it would have been. Second: her field office paid a small "facilitation" fee to get a truck through a border crossing, and half her colleagues think that's obviously corrupt and half think calling it corrupt is just exporting one region's office etiquette to a place where gift and obligation are how anything moves at all. I keep reading definitions that say something like corruption is abuse of entrusted power for private gain, and they feel both too wide (loads of selfish acts by officials aren't corrupt) and too narrow (what about the politician who hands out targeted benefits to his own village and takes nothing himself?).

  So before I read any more actual theories, I want the spec: what would an account of corruption have to get right for me to accept it as adequate for her purposes, which is roughly "decide what to call corrupt, what to prioritise, and what to shut up about when we don't know the local norms." Please write the desiderata with the case or consideration behind each one, and tag each as either non-negotiable or a preference of one camp (I can guess the universalist/liberal camp wants one thing, the anthropological/local-meaning camp another, the economist-type welfare camp a third — tell me which of my demands are just someone's politics). Cases I want covered at a minimum: the vendor gift above; the border fee; clientelist vote-buying versus ordinary constituency service; nepotism in hiring; regulatory capture where no money changes hands; the clerk who invents a queue so you'll pay to skip it (here the wrong seems to be the manufactured obstacle, not any rule broken); and a benefits-allocation model that follows every written rule but routes money to the minister's co-villagers — I'd like a theory to be able to say something about that last one, since it's the version I actually build. Also: the written rule and the rule-as-applied drift apart in a lot of places, and I want to know whether "corrupt" should track the spec or the implementation, and whose baseline applies when a firm from one country pays in another (some legal systems apparently carve out small grease payments — is that something the theory has to accommodate, or explain away?). One more distinction I don't want collapsed: having the property at all versus how much of it, i.e. whether "corrupt" is gradable or on/off. Roughly 8–12 requirements is fine, and flag any pair you suspect can't be jointly satisfied.

  Give me it in four named sections, in this order: "The list" (about 700–900 words, numbered, each with its motivating case and a non-negotiable/preference tag, a table is fine); "The collisions" (about 200–300 words, the pairs of desiderata that can't both hold and what you'd drop); "What it rules out" (about 200 words, which single requirement does the most work excluding the three or four families of account people reach for — the rule/office one, the welfare-and-efficiency one, the local-norms one — one or two sentences each is plenty); and "Applied to my two cases" (about 150 words, run the list against the vendor gifts and the border fee and tell me what it says). British English throughout, please, and avoid anything that depends on looking something up — I want the argument, not the footnotes.
reasoning: |-
  Okay, let me tackle this complex request from a backend engineer thrust into governance debates. The user wants a practical framework to evaluate corruption theories, grounded in real cases like vendor gifts and border fees. 

  First, I need to unpack their core frustration: existing definitions feel either too broad (catching normal selfish acts) or too narrow (missing subtle abuses like benefit steering). Their examples reveal key tensions:
  - Cultural relativism vs universal standards (border fee)
  - Personal gain vs systemic distortion (village favoritism)
  - Written rules vs practical norms (invented queues)

  The user's technical background suggests they'll appreciate a systematic "spec" approach. Since they mentioned British English, I'll avoid American legal terms like "bribery statutes" and use "lorry" instead of "truck". 

  For the list section, I'm considering these non-negotiables based on their pain points:
  1. Must distinguish actual harm from mere rule-breaking (addressing the queue-inventing clerk)
  2. Must handle cultural variation without relativism (border fee case)
  3. Must account for indirect gain (minister's village example)

  I suspect the biggest collision will be between cultural context (#5) and systemic distortion (#3) - you can't fully honor local norms while condemning practices that sustain unequal systems. For the NGO's purposes, I'd prioritize systemic impact over local acceptance.

  When applying this to their cases:
  - The vendor gift likely isn't corrupt unless it influences decisions, per #2 and #4
  - The border fee is corrupt under #7 if it creates artificial delays, but #5 requires checking local norm consistency

  The user's "benefits-allocation model" example tells me they need #3 most - that's the lens exposing technically-legal favoritism. I'll make that the cornerstone.
answer: |-
  Here’s a corruption "spec" for your NGO friend’s operational needs, structured as requested. It prioritises clarity for governance decisions over philosophical purity.

  ---

  ### **The List**  
  *(Non-negotiable = Core to defining corruption; Preference = Camp-specific trade-off)*  

  | # | Desideratum                                                                 | Motivating Case                                                                                                    | Tag               | Camp Alignment                     |
  |---|-----------------------------------------------------------------------------|--------------------------------------------------------------------------------------------------------------------|-------------------|------------------------------------|
  | 1 | **Must distinguish *abuse of power* from mere selfishness or incompetence.** | A lazy official avoiding work isn’t corrupt; one selling permits illegally is. Nepotism abuses power to privilege connections. | Non-negotiable    | Universalist, Liberal            |
  | 2 | **Must recognise *intent to influence or gain advantage*, even if indirect.** | Vendor gifts create implicit debt. If the intent is to sway evaluation (e.g., during active procurement), it crosses into bribery. | Non-negotiable    | Liberal, Welfare Economist       |
  | 3 | **Must capture *systemic distortion*, not just individual gain.**           | Minister routing funds to his village per written rules distorts allocation fairness. No personal enrichment, but public trust erodes. | Non-negotiable    | Liberal, Welfare Economist       |
  | 4 | **Must require *violation of formal or reasonably expected duties*.**       | Border clerk inventing a queue to extract payments breaches expected impartiality. Clientelism violates democratic duty to serve all equally, not just supporters. | Non-negotiable    | Universalist, Liberal            |
  | 5 | **Must incorporate *local normative context* without excusing systemic harm.** | "Facilitation fees" may be customary, but if they entrench extortion (e.g., clerk *creates* delays to demand fees), local norms don’t absolve corruption. | Preference        | Anthropological, Welfare Economist |
  | 6 | **Must acknowledge *gradability*: "corrupt" applies to acts, not binary states.** | A £50 gift vs. a £50,000 gift; nepotism hiring one relative vs. systemic cronyism. Prioritisation depends on scale and impact. | Non-negotiable    | All camps                        |
  | 7 | **Must identify *manufactured harm* (obstacles created for gain).**         | Clerk inventing a queue to sell "priority" is corrupt even if no formal rule exists against queues. The harm is fabricated. | Non-negotiable    | Welfare Economist, Liberal       |
  | 8 | **Must expose *rule-as-applied* over rule-as-written when they diverge.**   | If laws say "allocate funds fairly" but the *practice* is cronyism, corruption tracks the operative system, not the paper one. | Preference        | Anthropological, Welfare Economist |
  | 9 | **Must reject *"cultural relativism"* where local norms mask coercion.**     | If a border fee is truly voluntary and customary (e.g., a shared tea fund), it may not be corrupt. If it’s coerced by armed guards, it is—regardless of local labels. | Non-negotiable    | Liberal, Universalist            |
  | 10| **Must address *regulatory capture* sans direct bribes (e.g., lobbying, revolving doors).** | Industry insiders writing regulations to favour their sector, using influence not cash, distorts policy for private gain. | Non-negotiable    | Liberal, Welfare Economist       |
  | 11| **Must clarify whose *baseline rules* apply in cross-border contexts.**      | A UK firm paying a "grease payment" abroad: if legal *locally* and truly *facilitative* (not extortionate), it may not be corrupt *there*—but home-country rules may still penalise it. | Preference        | Liberal (home rules), Anthropological (local context) |
  | 12| **Must separate *constituency service* (legitimate support) from *vote-buying* (quid pro quo).** | Helping a constituent navigate bureaucracy ≠ offering cash for votes. Latter creates dependency and distorts democracy. | Non-negotiable    | Universalist, Liberal            |

  ---

  ### **The Collisions**  
  *(~250 words)*  
  Key tensions arise between:  
  - **#5 (Local Context) vs. #9 (Anti-Relativism):** Honouring local norms risks excusing coercive practices. **Resolution:** #9 prevails—coercion or manufactured harm nullifies cultural defence.  
  - **#8 (Rule-as-Applied) vs. #4 (Violation of Duties):** If "expected duties" derive from formal rules (#4), but local practice ignores them (#8), which baseline matters? **Resolution:** #4 anchors to *formal or reasonably expected* duties. If local practice deviates egregiously (e.g., bribes are routine), corruption is defined by violation of the *intended* duty (#4), not normalised abuse (#8).  
  - **#11 (Cross-Border Baselines) vs. #9 (Anti-Relativism):** Should a UK NGO condemn a "facilitation fee" legal locally? **Resolution:** #9 tests for coercion/manufactured harm. If absent, it may not be corrupt locally (#5), but home rules (#11) may still prohibit it for the NGO.  

  **Trade-off:** For operational clarity, prioritise #4 (duty violation) and #9 (anti-coercion) over strict adherence to local practice (#5) when harm is systemic.  

  ---

  ### **What it Rules Out**  
  *(~200 words)*  
  - **"Rule/Office" Definitions** (e.g., "violation of office rules"): Fail on #7 (manufactured obstacles with no formal rule) and #3 (lawful but distorted allocations).  
  - **"Welfare/Efficiency" Views** (e.g., "corruption iff economically inefficient"): Excluded by #1 (incompetence isn’t corruption) and #3 (nepotism may be "efficient" for the in-group but corrupt).  
  - **"Local Norms Only" Approaches**: Ruled out by #9 (custom ≠ justification for coercion) and #4 (local practice can violate universal duties like impartiality).  

  ---

  ### **Applied to My Two Cases**  
  *(~150 words)*  

  **Vendor Gifts:**  
  - Not corrupt if: Trivial value, no intent to influence (#2), logged transparently, *and* received post-decision.  
  - Corrupt if: High-value, during active evaluation (#2), implying quid pro quo. Gradability (#6) matters: £50 coffee vs. £5,000 whisky.  

  **Border Fee:**  
  - Not corrupt if: Truly customary, non-coercive, minimal, and expected as part of local transaction etiquette (#5, #9).  
  - Corrupt if: Coerced by officials who create delays (#7), disproportionate to service, or funding private gain (#9). Rule-as-applied (#8) checks if fees are *informally required* despite formal rules against them.  

  **Verdict:** Gifts likely non-corrupt; border fee requires ground-truthing coercion.  

  ---  
  This spec prioritises **power abuse + duty violation + harm** over rigid rules or localism, with gradability for realistic prioritisation. The irreconcilable tension (#5 vs #9) forces a choice: anti-coercion trumps cultural deference when harm is systemic. For your benefits-allocation model, #3 and #4 are key—does it *distort fairness* and violate *expected impartiality*? If yes, it’s corrupt.
