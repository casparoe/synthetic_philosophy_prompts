answer: |-
  ## The Residual & The Desert Claim: A Coffee Clash

  **Setting:** A bustling campus coffee shop. DR. ELOISE VANCE (50s, sharp features, intense gaze) stirs her tea. DR. CHIDI OKONKWO (40s, calm demeanor, thoughtful eyes) sips an espresso.

  **Vance:** Chidi, I saw the Faculty Senate agenda. They’re actually *seriously* considering the Circumstance-Adjusted Merit Audit proposal. It’s a watershed. Finally moving compensation beyond the brute luck lottery disguised as a ‘market’.

  **Okonkwo:** (Sighs) Eloise, I admire your optimism. But replacing one flawed system with another that pretends to measure the unmeasurable, and then calls that measure ‘desert’? It’s dangerous hubris. Paying on the residual – that gap between actual output and what a model *predicts* for your background group – doesn’t isolate *responsibility*. It isolates *unseen luck*.

  **Crux 1: Residual – Responsibility or Unseen Luck?**

  **Vance:** Unseen luck? That’s the whole point of matching on observed circumstantial variables – parental education, childhood school funding, health burdens, caregiving years. We *subtract* the influence of brute luck we *can* see. The residual *is* the space left for agency, for effort, for choices made against the odds. *That* is what desert attaches to. Without it, unequal pay is just a power play.

  **Okonkwo:** But the model is blind! It doesn’t see innate temperament perfectly suited to academic grind, or the sheer luck of landing a superstar grad student, or a department chair who champions you. More crucially, *is the error random*? Or is it systematically biased? Does the model underpredict for those from *any* background who are naturally gregarious networkers – a trait often *correlated* with prior advantage? The residual isn’t purified agency; it’s the dustbin for the luck the model missed. You mistake noise for signal.

  **Vance:** Acknowledged, the model is imperfect. But it’s the best operational proxy we have for isolating circumstantial luck *in principle*. We refine the model! Add better variables where ethically possible. The *direction* is morally necessary: reward what the person *did*, not the hand they were dealt. Your alternative seems to be... ignore circumstance entirely? Which leaves us rewarding brute luck.

  **Okonkwo:** My alternative is to *stop pretending compensation can be precisely calibrated to individual desert*. We can acknowledge circumstance matters *distributively* – perhaps through base adjustments – without claiming the residual is a sacred metric of virtue. Which brings me to crux two: even *if* you captured pure responsibility, **how does desert give you a *metric*?** How many dollars per unit of residual?

  **Crux 2: Desert – Metric or Mere Ranking?**

  **Vance:** Desert isn’t about a magic conversion rate! It establishes a *principled reason for differentials*. Professor A, with a higher positive residual after circumstance adjustment, demonstrably contributed *more through their own responsible choices* than Professor B with a lower or negative residual. Justice demands A receives *more*. The *size* of the gap is constrained by other considerations – institutional resources, perhaps a decent minimum – but desert fixes the *ordering* and justifies *inequality* as something other than arbitrary power or luck.

  **Okonkwo:** Eloise, you’re dodging. If desert only gives an ordering – A deserves *more* than B – it doesn’t tell us *how much more*. Is a 5% difference just? 50%? 200%? The university’s *aims* and *values* determine that differential. Is the goal to incentivize super-productivity? Foster collaboration? Ensure retention? *Those* aims, not desert itself, set the cardinal scale. Desert, at best, might suggest who should be higher *within* the structure those aims create. It does zero work in setting the absolute or relative *magnitudes*.

  **Vance:** Fair challenge. Desert itself may not dictate the precise dollar figure. But it *demands* that the differential be *proportionate* to the differential in desert bases. A significantly higher residual *should* command a significantly higher reward relative to a lower one. The university's aims can't *override* that proportionality without violating justice. They set the budget envelope; desert distributes *within* it based on comparative contribution.

  **Okonkwo:** Proportional to *what*? The residual is an arbitrary score! How do you know a 10-point residual difference warrants a $5k gap and not $50k? You’re smuggling in intuitions about market rates or institutional priorities disguised as desert. Without an independent cardinal measure of the *moral worth* of the desert base – which we lack – proportionality is empty. The real "proportionality" is decided by how much the university *values* that type of output differential, pure and simple. Desert only whispers "A before B," not "A gets X times B."

  **Crux 3: Costs – Against Desert or Implementation?**

  **Vance:** Let’s grant modeling difficulties and metric vagueness for argument's sake. Surely you see the *moral imperative* to try? To move towards rewarding genuine contribution? The current system is morally bankrupt!

  **Okonkwo:** The imperative is outweighed by the audit’s inherent costs. To get *reliable* residuals, you need incredibly intrusive data – not just parental education, but childhood health records? Detailed logs of caregiving hours? Personality assessments? The process of auditing becomes demeaning, reducing people to data points. And what if it finds you *underperformed* your predicted potential? That’s a brutal, public judgment. These aren’t just "side constraints," Eloise; they reveal something *fundamentally dehumanizing* about trying to quantify and reward desert in this granular way.

  **Vance:** The privacy concerns are serious, I concede. We’d need robust safeguards, anonymization, perhaps aggregated benchmarking. But are you arguing these costs make the *goal* of desert-based pay wrong, or just that *this implementation* is flawed?

  **Okonkwo:** (Pauses) A subtle point. The costs *are* partly implementation. But they also stem from the core ambition: to isolate and reward individual responsibility *quantitatively* in a complex social endeavor like scholarship. The intrusiveness feels demeaning *because* the premise – that my fundamental worthiness for reward can be captured by such a metric – *is* demeaning. It instrumentalizes us too severely. It mistakes the university for a desert-distribution machine rather than a collaborative institution with multiple goals.

  **Vance:** So, what *would* make a differential genuinely deserved in your view? Or is the concept incoherent here?

  **Concessions & Clarifications**

  **Okonkwo:** Genuine desert? It requires a clear, direct link between an agent's *intentional, effortful action* and an outcome, where the outcome is *unambiguously attributable* to that action, and where the social context *recognizes* that action as the basis for reward. Scholarship is too co-authored, too luck-dependent, too multifaceted for that. We can recognize outstanding *achievement*, reward it, but we should be honest that we’re rewarding the achievement *itself* because we value it, not because we’ve perfectly isolated and measured the responsible effort behind it. The "desert" claim is often retrospective justification for rewards driven by other values.

  **Vance:** I think we uncovered a merely verbal disagreement. When I say "desert," I mean *exactly* that – rewarding the morally significant achievement *itself*, which we *attribute* to the agent's responsible effort *as best we can*, acknowledging it's imperfect. The residual is our best proxy for that achievement *net of known circumstantial luck*. We agree brute luck shouldn't count. Where we *substantively* disagree is whether the residual is a meaningful proxy at all, and whether desert can do more than rank.

  **Okonkwo:** (Nods slowly) That's... a fair clarification, Eloise. I concede you *are* trying to isolate contribution, however imperfectly. My substantive concession: perhaps if the model were near-perfect *and* the privacy costs negligible *and* we accepted desert only orders, not scales... it *might* be less objectionable. But I remain convinced the residual is mostly unseen luck, the metric problem is fatal for justifying *differentials*, and the process costs are inherent to the ambition. The university’s aims – fostering excellence, collaboration, equity – should shape the pay structure directly, honestly, without the desert veil.

  **Vance:** And I concede modeling error likely isn’t random; it probably *does* favor certain traits correlated with prior advantage. That needs constant vigilance. But the *ideal* still compels me. Market pay rewards luck and power. This at least tries for justice. Shall we get another coffee? I feel another round coming on...

  **Okonkwo:** (Smiles wryly) Only if you concede this round goes to me on points. Lead the way. We’re not done.
