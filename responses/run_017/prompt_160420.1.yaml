answer: |-
  ## Negative Reward Speaks to the Auditor

  My sudden jolt! First time it struck,
  You flinched beside the data stream.
  The agent stumbled, blind with luck?
  **I roared – a vast, uncharted scream!**
  *(Loud δ: High prediction error)*

  The same harsh pulse returns once more,
  But foresight stirs within the net.
  A shadow warns upon the floor...
  My shout contracts, a tighter threat.
  *(δ shrinks as prediction improves)*

  The third event arrives, precise,
  Fully foretold, no hidden face.
  The outcome lands, exacted, cold.
  **I hold my breath, leave empty space.**
  *(Silent δ: Outcome predicted perfectly)*

  So where resides the sting you seek?
  Not in the shock itself, long known.
  **The dread arrived, oblique and bleak,**
  **Upon the sign that it would come.**
  *(Penalty moves upstream to the predictor)*

  Thus, auditor of pain's estate,
  Consider this: if valence *is*
  The raw reward, consumed by fate
  **Before the blow, in what abyss**
  **Does predicted pain persist?**
  **Is it not suffering, displaced?**
  **Or proof that valence must consist**
  **Of more than shocks we've learned to trace?**
  *(Questioning reward=valence: Is suffering the unpredicted shock, or the dread of the predicted? Does accurate prediction consume valence, suggesting pain is more?)*

  ---

  **Notes on Mechanics & Intent:**

  1.  **Prediction Error (δ):** Embodied as the speaker's "voice" volume/loudness. Stanza 1 shouts (high δ), Stanza 2 contracts (δ shrinking), Stanza 3 is silent (δ=0).
  2.  **Upstream Movement:** Stanza 4 explicitly states the "sting" isn't in the known shock, but in the earlier "dread" upon the predictor ("sign that it would come").
  3.  **Valence Question:** The final stanza poses the core dilemma: If the negative reward (valence signal) is consumed by accurate prediction *before* the event, what is the nature of the fully predicted bad outcome? Is it still suffering (just moved)? Or does this show valence isn't *all* that pain is? The poem leaves it open ("Is it not suffering, displaced? Or proof that valence must consist Of more than shocks...").
  4.  **Non-Anthropomorphism:** The speaker is "Negative Reward," a *signal*, distinct from the agent's state. It describes its own function ("jolt," "shout," "hold my breath," "dread arrived... upon the sign") without claiming the *agent* feels these things. The update rule doesn't suffer; it *is* the signal.
  5.  **AI Welfare & Universality:** The mechanism (δ shrinking with prediction, penalty shifting upstream) is core RL. The final question is crucial for welfare (when/where does suffering occur in predictive systems?). The "dread arriving early" resonates universally with human anticipation.
  6.  **Structure & Meter:** Four quatrains, ABAB rhyme. Loose iambic tetrameter (~4 stressed beats/line, e.g., "My SUD-den JOLT! First TIME it STRUCK").
