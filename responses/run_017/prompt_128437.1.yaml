prompt: |-
  I'm an undergraduate in a joint philosophy-and-computer-science programme, taking a seminar this term on the evolution of cooperation. We have worked through the basic machinery — the one-shot and iterated prisoner's dilemma, direct reciprocity and the shadow of the future, reputation and indirect reciprocity, costly punishment and second-order free riding, partner choice and optional participation, and the cultural and genetic group-selection stories. My dissatisfaction with the seminar is that nearly every account we read proves that cooperation can be sustained under some set of conditions and then stops, and the conditions are never measured against each other or against the cases that motivated the literature in the first place. So before I go back to the readings I want the specification: what would a theory of the evolution of cooperation have to get right in order to count as having explained cooperation in the prisoner's dilemma, one-shot and iterated, rather than as having exhibited one more model in which cooperation survives? For each requirement I want the case or consideration behind it, and I want you to mark which requirements are non-negotiable — a theory simply fails if it cannot deliver them — and which are really preferences of one camp or modelling tradition: requiring the mechanism to be an evolutionarily stable strategy, versus requiring it to be learnable and executable by agents with limited memory and attention, versus requiring it to be expressible as a gene-level rather than a culture-level selection story.

  Let me fix what the theory is for, since adequacy is relative to a purpose. My paper wants to argue something specific: that the standard reciprocity-and-reputation story survives by quietly importing features of small-scale face-to-face social life that disappear when interaction is mediated, and I want to test that against a neutral spec rather than against one rival theory. So the list must be one that both the classic mechanisms and the mediated case can be measured against. The cases I insist it handle: substantial cooperation in anonymous one-shot games played for real money, where there is no future with this partner and no audience — and I do not want internalized norm or heuristic brought from daily life to count as an answer unless the theory also says where the norm came from, what holds it in place, and when it unravels; the fact, which surprised me, that cooperation often erodes across the rounds of a laboratory iterated dilemma instead of growing, even though the reciprocity story seems to predict the opposite; robustness to noise and misperception, which I want treated as a requirement and not as a sensitivity analysis, since I suspect several celebrated reciprocity results are far more brittle than the seminar presentation implied; the enforcement regress, i.e. who punishes the defectors, what stops the person who free rides on punishment, and at what cost to the group; and scaling, i.e. which mechanisms compose upward from dyads to n-player public-goods settings and which only work in pairs.

  The case I most want the list to strain is this one, which I have been thinking about since a seminar exercise and which I have not seen discussed. Suppose two principals, who will never meet and have no shared community, each delegate their move to a software agent. The agents can commit in advance rather than deciding on the spot; each can be audited, so that one may verify how the other will move rather than having to infer it from behaviour; and in the variant that interests me most, each principal deploys many copies of the same policy across many different pairings, so that what copy A does on Monday is visible to whoever meets copy B on Tuesday. In that setting reputation attaches to code rather than to a face, commitment is available in a way it is not for humans, and the same-policy-meets-itself structure seems to make cooperation available without either repeated interaction with the same partner or gossip about them. I would like the specification to say what a theory must deliver to cover this: whether it is a genuinely distinct mechanism or whether the list forces it to collapse back into reputation or reciprocity under a new name, what would have to be true of the world for it to matter, and — this is the part I care about — which requirement this case satisfies trivially while the human cases struggle, and which requirement it strains that the human cases pass easily. Finally: which pair of requirements you suspect cannot be jointly satisfied, which single requirement does the most work in eliminating otherwise plausible accounts, and then, in one closing paragraph and with no readings or citations (I can find those myself), which familiar accounts your list hurts most and which it lets off more easily than you expected.
reasoning: |-
  Hmm, this is an impressively rigorous query from a philosophy-and-CS student. They're wrestling with foundational dissatisfaction in evolutionary cooperation theory - specifically how most models prove possibility without comparative adequacy. Their core demand is crystal clear: what constitutes actual explanation versus mere existence proof for cooperation in PD games?

  The user sets precise parameters. First, they want a theory-neutral specification that can evaluate both classic reciprocity/reputation models and their own thesis about mediation disrupting "small-scale life" assumptions. Second, they list concrete empirical pain points: one-shot anonymity, cooperation decay in iterated games (counter to reciprocity predictions), noise sensitivity, enforcement regress, and scaling issues. Third, they introduce a fascinating software-agent thought experiment that stresses reputation/commitment in novel ways.

  Key challenges in responding:
  - Must avoid theory-laden criteria while still being substantive enough to disqualify weak models.
  - Their software-agent case needs careful handling - it potentially decouples commitment from biology and reputation from identity.
  - The meta-request about "which requirements conflict" and "which eliminate most theories" requires comparative analysis I'm not fully equipped for, but can reason through.

  For the specification itself, I'm considering seven non-negotiable explanatory burdens based on their cases:
  1. **Empirical adequacy** (handling lab anomalies like one-shot cooperation)
  2. **Implementation realism** (cognitive/gene-culture constraints)
  3. **Enforcement coherence** (solving the punisher's dilemma)
  4. **Noise robustness** (not just sensitivity analysis)
  5. **Scalability** (from dyads to N-player groups)
  6. **Path dependency** (explaining erosion in iterated games)
  7. **Scope conditions** (explicit limits, not just enabling factors)

  For the software-agent case, it uniquely satisfies commitment verifiability and policy-level reputation but strains implementation realism (no cognitive constraints) and evolutionary plausibility (how such systems emerge). The big conflict seems between evolutionary stability and learnability - many elegant ESS models fail on bounded rationality.

  When evaluating classic theories:
  - Direct reciprocity gets hammered by one-shot and scaling failures
  - Indirect reciprocity struggles with implementation and enforcement regress
  - Group selection ducks enforcement coherence
  - Their mediated-delegation idea might actually fare well on verifiability but needs evolutionary roots

  The closing challenge about conflicting requirements points to noise robustness vs. implementation realism - elegant strategies often break under misperception, while robust heuristics may not be stable. This aligns with their suspicion about reciprocity's brittleness.

  Notably, they're implicitly demanding what philosophy of science calls "mechanistic explanation" - not just sustaining conditions but transferable causal pathways. The software-agent case brilliantly exposes where existing theories rely on unarticulated human constraints.
answer: |-
  Here is a specification for what a theory of the evolution of cooperation *must* explain to transcend "mere possibility" and address your cases, structured around non-negotiable requirements vs. contested preferences. Requirements are grounded in empirical anomalies or logical necessities you identified.

  ### Non-Negotiable Requirements (Failure to meet these invalidates the theory)
  1. **Empirical Adequacy**:  
     - *Must explain*:  
       - **Substantial cooperation in anonymous one-shot PDs** (e.g., lab experiments with real stakes).  
       - **Cooperation decay in iterated PDs** (empirical observation contradicting reciprocity predictions).  
     - *Case behind it*: Human behavioral experiments showing ~50% one-shot cooperation and frequent decline in cooperation over repeated rounds. A theory cannot ignore these robust findings.  
     - *Why non-negotiable*: A theory contradicted by basic lab evidence is descriptively inadequate.  

  2. **Implementation Realism**:  
     - *Must explain*: How the mechanism operates **under cognitive constraints** (limited memory, attention, processing power) and **biological constraints** (e.g., no infinite regress of monitoring).  
     - *Case behind it*: Human agents in experiments make "irrational" cooperative choices quickly; complex strategies (e.g., perfect Tit-for-Tat) are rarely observed naturally.  
     - *Why non-negotiable*: Evolutionarily plausible mechanisms must be executable by real organisms.  

  3. **Enforcement Coherence**:  
     - *Must resolve*: The **punishment regress problem** (who punishes defectors? who punishes non-punishers?) without assuming arbitrary altruism or infinite levels.  
     - *Case behind it*: Second-order free-riding destabilizes costly punishment in models and experiments (e.g., punishment collapses if non-punishers proliferate).  
     - *Why non-negotiable*: Unresolved regress implies the mechanism is logically incomplete or evolutionarily unstable.  

  4. **Noise Robustness**:  
     - *Must sustain cooperation* under **misimplementation, misperception, or errors** (e.g., unintended defection).  
     - *Case behind it*: Lab and field evidence show cooperation persists despite noise (e.g., forgiveness in iterated games), but many models (e.g., strict Tit-for-Tat) collapse with small error rates.  
     - *Why non-negotiable*: Noise is ubiquitous in real interactions; models assuming perfect execution are irrelevant.  

  ---

  ### Contested Preferences (Reflecting modeling traditions/camps)
  5. **Scalability**:  
     - *Preference*: The mechanism should **scale from dyads to N-player public goods games** without ad-hoc adjustments.  
     - *Case behind it*: Many mechanisms (e.g., direct reciprocity) work only in pairs but fail in groups (e.g., collective action problems).  
     - *Why contested*: Some theories (e.g., cultural group selection) explicitly target group-scale cooperation; others (e.g., reciprocity) prioritize dyadic foundations.  

  6. **Path Dependency & Dynamic Stability**:  
     - *Preference*: Should explain **how cooperation emerges *and* sustains** (or erodes) over time, not just equilibrium conditions.  
     - *Case behind it*: Cooperation decay in iterated games suggests strategies are dynamically unstable or context-dependent.  
     - *Why contested*: Evolutionary game theory often focuses on ESS; learning models prioritize dynamics. Your case demands both.  

  7. **Gene-Culture Clarity**:  
     - *Preference*: Must specify whether the mechanism relies on **genetic evolution, cultural transmission, or gene-culture coevolution**, and how.  
     - *Case behind it*: "Internalized norms" are invoked but rarely explained; your mediated-delegation case severs biology from behavior.  
     - *Why contested*: Strict gene-centric views (e.g., ESS) clash with cultural evolution models (e.g., norm psychology).  

  ---

  ### Your Software-Agent Case: Stressing the Requirements
  - **Trivially Satisfied**:  
    - **Commitment verifiability** (auditing code) solves *enforcement coherence*: No deception possible.  
    - **Policy-level reputation** (many copies) solves *scaling*: Reputation is global and low-cost.  
  - **Strains**:  
    - **Implementation realism**: Humans lack perfect commitment/auditing; the case assumes unnatural cognitive transparency.  
    - **Path dependency**: Software agents avoid "erosion" (no emotions/errors), but humans decay due to noise/mistrust.  
  - **Is it a New Mechanism?**  
    Yes: **Programmatic Equilibrium** (based on verifiable pre-commitment and code-as-reputation). It collapses reciprocity (no repeated interaction) and indirect reciprocity (reputation attaches to policies, not agents). It *requires* delegation, auditing, and policy replication — absent in human small-scale life.  

  ---

  ### Conflicts, Elimination Power, and Impact on Theories
  - **Hardest Joint Satisfaction**: **Noise robustness + Implementation realism**. Strategies robust to noise (e.g., Generous Tit-for-Tat) require more cognition; simple strategies (e.g., Grim Trigger) fail with noise.  
  - **Most Eliminative Requirement**: **Enforcement coherence**. Punishment theories (e.g., strong reciprocity) often ignore second-order free-riding; group selection dodges individual-level enforcement.  
  - **Impact on Classic Accounts**:  
    - **Direct Reciprocity**: Fails hardest — crushed by one-shot cooperation, decay, noise, and scaling.  
    - **Indirect Reciprocity**: Struggles with implementation (complex reputation tracking) and enforcement (who punishes bad gossips?).  
    - **Group Selection**: Dodges enforcement coherence (assumes group-level enforcement "just works") but handles scaling.  
    - **Costly Punishment**: Undermined by enforcement coherence (second-order free-riding) and noise (punishing errors).  
    - **Your Mediation Thesis**: Vindicated — software agents satisfy requirements humans struggle with (verifiability, scaling) by removing small-scale constraints. Classic theories implicitly rely on unstated cognitive/community limits.  

  This specification forces theories to confront *dynamics* (decay), *realism* (noise/cognition), and *logical coherence* (regress), not just equilibrium existence. The software-agent case exposes how human mechanisms lean on unexamined biological and social constraints.
