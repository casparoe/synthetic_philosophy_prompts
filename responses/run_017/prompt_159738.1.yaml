    - What: When base rates differ, it is impossible to achieve both 6a (equal PPV, i.e., equal waste rate) and 6b (equal FNR, i.e., equal miss rate) simultaneously with an imperfect model. Commitment 1 states this impossibility, but 6 wants both.
