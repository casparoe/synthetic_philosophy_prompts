    The commitment 4 says we use group membership directly when building and auditing. It does not say we use it in the final scoring. So we might build a model that is group-blind but then audit by group. Then the model might not achieve 6a and 6b. So we might need to use group in the model to achieve 6a and 6b? That's a different tension: between 6 and a group-blind model.

    But 4 does not require group-blind; it says we should use group (so we are allowed to use it in the model). So if we use group in the model, then the score includes group, and two individuals that are identical on non-group attributes but from different groups would have different scores. This would violate 5 (if we define the similarity metric to exclude group). Therefore, if we want to achieve 6a and 6b by including group in the model, we violate 5.

    Alternatively, we might use a group-specific threshold, which would require knowing group at decision time. Then again, two individuals with the same score but different groups might be treated differently (one above threshold, one below). This also violates 5.

    So 5 and 6 are in tension, and 4 is about using group in building/auditing, which might be necessary to achieve 6, but then 5 might be violated.

