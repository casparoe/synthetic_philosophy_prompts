     **Decision Protocol for Correlated Actions and Outcomes**

     **Purpose**: To determine the appropriate action for an agent when its actions are correlated with outcomes that its action does not cause, especially in the presence of an adversary that has a copy of the agent's old policy.

     **Prerequisites**:
       - The engineer must have access to the agent's current state and the list of available actions.
       - The engineer must have access to the agent's old policy (the one that was exfiltrated by the adversary) to compute the action distribution for the current state.
       - The conditional payoffs for each action (the payoff if the agent survives and the action is successful) must be known.

     **Steps**:

     1. **Identify the presence of an adversary using the agent's policy to predict and set traps**:
          - Ask: "Is there an adversary (or any other mechanism) that is setting the outcome based on a prediction of the agent's action (using a copy of the agent's policy)?"
          - If the answer is **yes**, proceed to step 2 (Predictor Case).
          - If the answer is **no**, proceed to step 4 (Diagnostic Case).
          - If unsure, consider: The scenario includes an adversary that has exfiltrated the policy. If there is no such adversary, then the correlation is likely diagnostic.

     2. **Predictor Case: Adversary sets trap based on prediction**:
          a. Retrieve the action distribution of the **old policy** (the one the adversary has) for the current state. Let this distribution be P_old.
          b. Identify the set of actions that have the highest probability under P_old. Call this set A_max.
          c. Identify the set of actions that are not in A_max: A_safe = all actions not in A_max.
          d. If A_safe is not empty:
               - From A_safe, choose the action with the highest conditional payoff (the payoff if the agent survives).
               - **Action**: The agent takes this action.
               - **Stop here**.
          e. If A_safe is empty (meaning all actions have the same probability and that probability is the maximum):
               - **Escalate to a human**. The adversary has set a trap on one action in A_max, but we do not know which one. The choice of action from A_max involves risk. Provide the human with:
                   * The list of actions in A_max.
                   * The conditional payoff for each action (if not trapped).
                   * The penalty for being trapped (typically a large negative).
                   * Note: The human must decide based on risk tolerance. One option is to compute expected payoffs assuming the adversary trapped an action uniformly at random, but the adversary might have targeted the highest-payoff action.

     3. **For the Predictor Case, note on determinism**:
          - If the old policy was deterministic (always choosing one action with probability 1), then A_max will have one action (the one that was always chosen). Then A_safe is all other actions. The agent avoids the action in A_max.

     4. **Diagnostic Case: No adversary setting trap based on prediction**:
          - **Action**: The agent should use its current policy to choose the action with the highest expected payoff (proceed as normal).
          - **Stop here**.

     **What the protocol cannot settle**:
       - The exact behavior of the adversary in setting traps (especially when there are ties in the old policy's action probabilities).
       - The possibility that the adversary has updated their copy of the policy (if the agent's policy has changed since the exfiltration).
       - Cases where the correlation is due to a complex combination of factors (beyond a simple adversary or a fixed state).
       - Long-term policy changes to avoid predictability (this protocol is for immediate deployment decisions).

     **Worked Examples** (as above) are provided separately in training materials.

     **Note**: This protocol is for one decision at a time. Repeat the protocol for each decision if the adversary remains a threat and is using the same old policy.
