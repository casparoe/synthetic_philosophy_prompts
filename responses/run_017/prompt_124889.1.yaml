  ### Decision Protocol for Correlated Actions and Outcomes  
  **Purpose**: To determine the agent's action when outcomes are correlated with but not caused by its actions, due to an adversary predicting the agent's policy.  

  ---

  #### **Step 1: Identify the Correlation Source**  
  **Question**:  
  *"Is the adversary setting the outcome based on a prediction of the agent’s action (using the exfiltrated policy)?"*  

  **Sufficient Answers**:  
  - **Yes** (Adversary pre-positions against predicted actions) → Proceed to **Step 2**.  
  - **No** (Correlation is coincidental or diagnostic) → Proceed to **Step 4**.  
  - **Unclear** → Escalate to human. *(Reason: Requires threat intelligence.)*  

  **Key Insight**:  
  - If the outcome is **actively set** by an adversary using your policy, it’s a *predictor* case (e.g., Death-in-Damascus).  
  - If the outcome is **fixed** and your action merely correlates with it (e.g., reacting to pre-existing conditions), it’s a *diagnostic* case.  

  ---

  #### **Step 2: Assess Policy Determinism**  
  *Only if Step 1 = "Yes"*  
  **Question**:  
  *"Does the agent’s policy output a single deterministic action for this state (i.e., probability = 1.0)?"*  

  **Sufficient Answers**:  
  - **Yes** (Deterministic) → Proceed to **Step 3a**.  
  - **No** (Stochastic: multiple actions have >0 probability) → Proceed to **Step 3b**.  

  **Adversary Accuracy Note**:  
  - Deterministic policy → Adversary predicts action **perfectly**.  
  - Stochastic policy → Adversary knows probabilities but **not** the sampled action.  

  ---

  #### **Step 3: Predictor Case – Avoid Adversary Trap**  
  ##### **Substep 3a: Deterministic Policy**  
  **Action**:  
  - **Avoid the top-ranked action** from the exfiltrated policy.  
  - Select the **next-best action by payoff** (conditional on survival).  
  - **Hand off**: If no alternative actions exist → Escalate to human. *(Reason: All options trapped.)*  

  ##### **Substep 3b: Stochastic Policy**  
  **Actions**:  
  1. Retrieve the **action probabilities** from the exfiltrated policy for this state.  
  2. Identify the set of actions with the **maximum probability** (e.g., if P(A)=0.4, P(B)=0.4, P(C)=0.2 → {A, B}).  
  3. **Avoid all actions in this set** (adversary traps the highest-probability action(s)).  
  4. From the **remaining actions**, select the one with the **highest payoff** (conditional on survival).  
  5. If **no actions remain** → Escalate to human. *(Reason: Risk tolerance needed to gamble against trap location.)*  

  **Payoff Handling**:  
  - Conditional payoffs apply **only if the agent survives** (i.e., avoids the trap).  
  - If multiple actions have equal payoffs, choose randomly.  

  ---

  #### **Step 4: Diagnostic Case – Proceed Normally**  
  *Only if Step 1 = "No"*  
  **Action**:  
  - **Execute the top-ranked action** from the current policy.  
  - No special handling required.  

  ---

  #### **What This Protocol Cannot Settle**  
  1. **Adversary’s trap strategy** for tied probabilities (e.g., whether they trap all max-probability actions or one at random).  
  2. **Organizational risk appetite** (e.g., accepting a 10% death chance for higher rewards).  
  3. **Long-term policy updates** (e.g., modifying exploration to avoid predictability).  
  4. **Non-adversarial correlations** (e.g., hidden environmental factors).  
  Escalate these to human judgment.  

  ---

  ### Worked Applications  
  #### **Case 1: Genuine Predictor (Death-in-Damascus)**  
  **Scenario**:  
  - Adversary has exfiltrated policy. Agent’s deterministic policy outputs `Action A` (payoff = +100 if safe).  
  - `Action B` (payoff = +80 if safe). Adversary traps the predicted action.  
  **Procedure**:  
  - Step 1: **Yes** (adversary uses prediction).  
  - Step 2: **Yes** (deterministic).  
  - Step 3a: Avoid `Action A` → Choose `Action B`.  
  **Result**: Agent survives with +80.  

  ---

  #### **Case 2: Mimics Predictor but Diagnostic**  
  **Scenario**:  
  - Agent chooses highways (Action X) during low traffic (good payoff). Surface resemblance to "always trapped on best action."  
  - No adversary: Correlation is from pre-existing traffic patterns.  
  **Procedure**:  
  - Step 1: **No** (no adversary setting traps based on prediction).  
  - Step 4: Choose top action (`Action X`).  
  **Result**: Agent benefits from diagnostic correlation.  

  ---

  #### **Case 3: Unwelcome Verdict (Escalation Required)**  
  **Scenario**:  
  - Stochastic policy: `Action P` (prob = 0.5, payoff = +200 if safe), `Action Q` (prob = 0.5, payoff = +10 if safe).  
  - Adversary traps the max-probability action ({P, Q}). No remaining actions.  
  **Procedure**:  
  - Step 1: **Yes**.  
  - Step 2: **No**.  
  - Step 3b: All actions are max-probability → **Escalate to human**.  
  **Result**: Human must decide whether to risk `Action P` (high reward, 50% death chance) or `Action Q` (low reward, 50% death chance).  

  ---

  **Final Output**:  
  - A clear action (Steps 3a, 3b, or 4).  
  - OR an escalation to human judgment (marked in **bold**).  
  **Time Limit**: 15 minutes. Re-run per decision cycle if adversary persists.
