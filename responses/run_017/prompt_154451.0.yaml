  I should check if there are established terms. "Metalinguistic endorsement" might cover the generalization case. For concession, "concessive acknowledgment" or "discourse management" could work. The impersonal aspect relates to "objectivity pretense," where speakers present claims as factually grounded rather than personal opinion. 

