prompt: |-
  I have to hand something to our hospital's policy committee by the end of the month, and I would rather have the specification before I go back to the candidate accounts. I'm a philosophy professor, drafted — I suspect as the token humanist — onto the committee rewriting our determination-of-death policy; the document has to do three jobs at once, saying when life-sustaining treatment may be withdrawn, saying when organs may be procured, and giving bereaved families one sentence about what happened to the person they brought in. I have taught the material twice and it goes badly each time: half the students arrive convinced that brain death is a legal fiction invented to make procurement easier, the other half that a ventilated body with a destroyed brain is simply and obviously a corpse, and neither half can say what an account of death would have to get right for the dispute to be settled. The uniform act our statute copies offers two alternative prongs, irreversible loss of circulatory and respiratory function or irreversible loss of all functions of the entire brain including the brain stem, and the attempt to revise it was quietly abandoned a couple of years ago, which suggests to me that some of what we want cannot be had together.

  Four cases keep doing the work in my notes. First, a patient with catastrophic brain injury who is not brain dead: support is withdrawn, the heart stops, and after a short interval the team declares death on the circulatory prong and procures organs, even though that circulation is not irreversible in any absolute sense — with enough exertion it might be restarted — but permanent, because a decision has been made not to restart it; if permanence is enough, the time of death seems to depend on a decision. Second, a body with a destroyed brain, on a ventilator, with hormones replaced: circulation, temperature regulation, wound healing, even gestation continue for months, so if death is the loss of the organism as an integrated whole this body still looks integrated, and the brain criterion starts to look like a proxy for the thing rather than the thing. Third, suppose a perfusion technology becomes clinically available that can re-establish cerebral microcirculation and recover some cellular and network activity hours after circulatory arrest: irreversible then comes to mean irreversible with the equipment we happen to own, and the moment of death becomes a function of what is on the ward that day. Fourth, the two prongs can simply disagree, with the same patient dead under one and not dead under the other, and our policy will need a rule for which governs.

  So what I want is the desiderata. What must an account of death be able to deliver to be adequate for a document like ours — which cases it has to get right, which distinctions it must respect (death as an event or as a process, irreversibility or mere permanence, the phenomenon itself or a proxy for it, one concept or several role-relative ones), which requirements are genuine and which are the preferences of a camp, whether that be neurologists, transplant surgeons, or philosophers with a taste for tidy metaphysics? Assume I know the usual candidates — the whole-brain criterion, the brainstem criterion, the higher-brain or neocortical criterion, the circulatory criterion read as irreversible or as permanent, and the organism-as-a-whole view — so name them rather than explain them, and give me no reading list and no citations; I have the literature and I do not want it handed back to me. Answer as exactly seven numbered items, with no introduction and no closing summary: items one through five the requirements themselves, each in two sentences at most, each tagged HARD or SOFT, each with the case that earns it a place on the list; item six the subset of requirements you think cannot be jointly satisfied, and which one has to give; item seven the single requirement that excludes the most candidates, and which candidates it excludes.
reasoning: |-
  Hmm, the user is a philosophy professor on a hospital policy committee tasked with rewriting the determination-of-death policy. They're struggling with the ethical and metaphysical complexities involved. They need a clear set of desiderata for an account of death that must serve multiple purposes: guiding withdrawal of life-sustaining treatment, enabling organ procurement, and providing closure for bereaved families.

  The user has described four problematic cases that highlight tensions in current definitions: (1) withdrawal of support where circulation stops but could technically be restarted, (2) brain-dead bodies maintaining biological functions, (3) hypothetical perfusion technology changing irreversibility, and (4) conflict between circulatory and brain death criteria. They explicitly want no literature review or citations - just seven numbered items analyzing core requirements.

  I need to identify fundamental requirements for any adequate account of death, distinguishing between hard constraints (non-negotiable) and soft preferences (context-dependent). The cases provide concrete anchors for each requirement. The requirements should cover: objective biological reality, legal consistency, operational feasibility, alignment with moral intuitions, and conceptual coherence.

  For the sixth item, I'll pinpoint which requirements conflict - particularly the tension between biological reality and operational irreversibility given technological limitations. The seventh item should highlight the most exclusionary requirement, likely the one demanding that death be an objective biological event independent of decisions or resources.

  The response must stay strictly within the requested format: five requirements with HARD/SOFT tags and case references; one conflict analysis; one exclusionary requirement assessment. No introductions or summaries. This structure respects the user's academic precision while addressing their policy committee pressures.
answer: |-
  1.  **Requirement: The account must establish death as an objective biological event, distinct from a decision or a prognosis.** (HARD) The first case (withdrawal followed by permanent circulatory arrest) shows death cannot depend *solely* on the choice not to resuscitate; it must identify a biological threshold crossed.
  2.  **Requirement: The account must correspond to the irreversible cessation of the organism *as a whole*, not merely the loss of specific functions or consciousness.** (HARD) The second case (ventilated body with destroyed brain maintaining integration) demonstrates that integration persists despite brain destruction, challenging the brain criterion as the *definition* rather than a reliable *indicator* of the organism's cessation.
  3.  **Requirement: The determination of "irreversibility" must be robust against foreseeable technological advances changing what is practically possible in resuscitation or perfusion.** (SOFT, leaning HARD) The third case (hypothetical perfusion tech) reveals that defining irreversibility solely based on current capabilities makes the moment of death contingent on available equipment, undermining its objectivity and universality.
  4.  **Requirement: The account must yield a single, unambiguous determination for a given patient under the policy's criteria, avoiding situations where a patient is simultaneously dead by one standard and not dead by another.** (HARD) The fourth case (conflict between circulatory and brain prongs) necessitates a rule prioritizing one criterion to prevent legal and ethical contradictions in declaring death.
  5.  **Requirement: The account must be clinically determinable with reasonable certainty using available diagnostic tools within a timeframe relevant for both treatment withdrawal decisions and potential organ procurement windows.** (SOFT) While biological reality is primary, all criteria (circulatory, whole-brain, brainstem) must ultimately be practically ascertainable by physicians at the bedside to be actionable policy.

  6.  **Conflict:** Requirements 2 (cessation of organism as a whole) and 3 (technologically robust irreversibility) cannot be fully satisfied jointly with Requirement 4 (single unambiguous determination under the Uniform Act's two prongs) *if* the brain criterion is seen as a proxy. Requirement 2 must give way to a pragmatic definition using the brain criterion as the best *operational* surrogate for organismal death, accepting it may not perfectly capture the metaphysical reality in cases like the ventilated body.

  7.  **Exclusion:** Requirement 2 (cessation of organism as a whole) excludes the most candidates. It excludes the **Higher-Brain/Neocortical criterion** (as integration persists without consciousness), the **Circulatory criterion interpreted as mere permanence** (as it confounds decision with biology), and challenges the **Whole-Brain criterion** itself by revealing it may not actually signify the loss of organismal integration (Case 2). It most purely aligns with the **Organism-as-a-Whole** view.
