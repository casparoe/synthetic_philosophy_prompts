prompt: |-
  I'm working on a long Sunday piece about why expert timelines keep being wrong, and I've noticed something uncomfortable: the advice I keep handing out in it — start from the outside view, find the reference class, use the base rate, treat your own story about the case as the least reliable part of your evidence — is not the advice I actually follow in my own reporting, and I can't state the rule I'm really using. So I want to do this from the bottom up, with my own verdicts.

  Health-tech founder tells me her app will clear regulatory review in nine months: I discard her story entirely and use the base rate for software in that category, comfortable. Lab director says his machine will reach net energy in three years: I apply the base rate for fusion milestones and discount hard, comfortable. The same lab director, in the same interview, says his shot rate will double next year because the new power supply is installed and has already been run at half power: I take the inside view and never consult a base rate, comfortable. My own features: I ignore how long features take at magazines generally and quote from my personal record of about forty pieces, comfortable. A writer who has finished four books in five years says the fifth will take a year: I narrow the reference class to her own record, n = 4, and accept, comfortable. A well-funded institute says its ten-year project will not slip, because it has dedicated money and no teaching load: I refuse to narrow to well-funded, well-staffed projects and hold it to the base rate for projects of that kind generally, comfortable. A transit authority says a tunnel will cost a couple of billion: I want the outside view here too, but I don't want the mean overrun — I believe that distribution is heavy-tailed, and quoting an average feels like false precision, so I want something like an eightieth percentile. And an AI researcher gives me a scaling timeline on the record: I decline to use the base rate for timelines given by people who agree to be interviewed, because agreeing to be interviewed selects for a certain kind of confidence, but I then have no idea which class to use instead.

  Two pairs in that list strike me as hard to reconcile, and they're where I think the real principle lives. First, the lab director's two claims concern the same person and the same machine, and I treat them oppositely; the only difference I can articulate is that the shot-rate claim is nearly a report of something already partly observed and will be scored within months, while the net-energy claim won't be scored for years and sits right on top of the optimism gradient — which suggests something like: trust an inside view in proportion to how much the estimator has already been, or will soon be, scored on claims of that exact kind. Second, I happily narrow the class for the writer and refuse to narrow it for the institute, even though both are narrowing along a feature that favors their own optimism; my guess is that the difference is that the writer's feature comes with counted outcomes (four books, four dates) while nobody has tabulated outcomes for well-funded projects, and funding is also the very feature that manufactures the confidence — which suggests something like: narrow a reference class only along dimensions on which you possess outcome counts, never along dimensions you merely believe matter.

  So: take those two candidates as my tentative principle, test them case by case against everything above, and either merge them into one rule or tell me they are genuinely two rules and which one governs when they conflict. I want the finished principle stated precisely enough that I could apply it cold, with the case that motivates each clause attached to that clause, its verdicts on at least two cases I haven't listed, an honest account of which of my verdicts it cannot accommodate and would force me to overturn, and — most usefully — its verdict on the case I keep going back and forth on: a friend on her second startup, whose first one exited, where second-time-founder statistics exist but strike me as selected on the outcome, while her own record is a sample of one. One last thing I want addressed rather than dodged: everyone who tells me this time is different has some base rate of being wrong about that, and if I apply the outside view to my own this-time-is-different judgments, I seem to slide into a modesty so global that no mechanism evidence could ever move me — yet I do let a mechanic's observation of a worn clutch override the model's reliability base rate. Tell me where modesty about my own inside view is supposed to stop, and whether that stopping point is part of the principle or outside it.
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're writing an article about why expert timelines are often wrong and realize their own advice doesn't match their practice. They've listed several examples where they use base rates versus inside views, and they're struggling to find a consistent principle. 

  First, I need to understand the key conflicts they mentioned. The lab director example stands out: they treat the shot-rate claim differently from the net-energy claim. The user thinks it's because the shot-rate can be verified soon, while the net-energy claim is years away. That makes sense—verifiability seems crucial here. 

  Then there's the writer versus institute case. The user narrows the reference class for the writer with four books but not for the well-funded institute. The difference? The writer has countable outcomes (four books), but the institute's funding advantage isn't quantified. So, outcome counts are necessary for narrowing the class. 

  The user proposes two tentative principles: trust inside views based on verifiability and narrow classes only with outcome counts. I need to test these against all their examples. Like in the health-tech founder, they use the base rate comfortably because there's no immediate verifiability. The transit authority example is tricky because they want a percentile instead of mean. The principle should handle that by focusing on distribution shape when available. 

  The AI researcher case is tough. The user rejects base rates due to selection bias but has no alternative. The principle might suggest using the AI field's base rate but adjusting for verifiability. Since the timeline isn't verifiable soon, they should rely more on base rates. 

  For the friend's startup, outcome counts are limited (n=1), and second-founder stats might be cherry-picked. Applying the principles: narrow to personal outcomes only if countable (here, n=1 isn't enough), and since no immediate verifiability, stick to broader base rates. 

  The modesty paradox is deep. They worry that always doubting inside views leads to inaction. But the key is allowing mechanism evidence when it's verifiable soon, like the mechanic's clutch observation. Modesty stops when you have strong, immediate feedback loops. 

  Now, structuring the response: state the unified principle, break down clauses with examples, apply to unlisted cases, identify overruled verdicts, and address the startup and modesty questions. Need to ensure precision—each part of the principle must be clear and tied to specific cases. Also, admit where the principle conflicts with the user's past decisions, like the transit cost percentile approach, which might require an additional clause about distribution tails. 

  Finally, for the modesty issue, emphasize that the stopping point is built into the principle: verifiability acts as a circuit breaker, allowing inside views when outcomes are imminent and measurable. This prevents total skepticism by grounding adjustments in actionable feedback.
answer: |-
  Here’s a unified principle distilled from your cases, stress-tested against your examples, and extended to new scenarios. The core tension between verifiability and outcome-counting resolves into a single rule with explicit clauses:

  **The Anchored Verifiability Principle:**  
  *Use an inside view only when (a) the estimator has a track record of *counted outcomes* for *identical actions* under *comparable conditions*, AND (b) the claim will be *verifiably resolved* before optimism gradients or external shocks could distort accountability. Otherwise, default to the broadest outcome-counted reference class, adjusting for distribution shape where possible.*

  ### Clause Breakdown & Case Validation
  1. **"Counted outcomes for identical actions under comparable conditions"**  
     - *Motivating case:* Writer’s book timeline (n=4 finished books under same process) → **Accept narrow class**  
     - *Rejected case:* Institute’s "well-funded, no teaching" claim → No outcome counts for *that specific configuration* → **Reject narrowing**  
     - *New verdict 1:* Friend’s second startup → "Second-time founder" stats lack outcome counts for *her specific domain/era*; her n=1 is insufficient for "identical actions" → **Use broad startup failure base rate**.  
     - *New verdict 2:* Surgeon says "This new technique halves recovery time" → If she has counted outcomes from 50 prior identical procedures → **Accept inside view**. Else → **Use general technique adoption base rate**.

  2. **"Verifiably resolved before distortions"**  
     - *Motivating case:* Lab director’s shot-rate claim (testable in months, with power supply already half-tested) → **Accept inside view**  
     - *Rejecting case:* Same director’s net-energy claim (years away, subject to funding/optimism) → **Default to fusion base rate**  
     - *New verdict:* CEO claims "Q2 revenue up 20% because new sales team already hired" → Verifiable next quarter → **Accept**. "Q4 profit surge from untested AI tool" → **Use sector base rate**.

  3. **"Broadest outcome-counted reference class"**  
     - *Motivating case:* Health-tech app → No individual outcome counts → **Use software regulatory base rate**  
     - *Adjustment clause:* Transit tunnel cost → Heavy-tailed distribution → **Demand 80th percentile overrun** (avoids false precision of mean)  
     - *AI researcher conflict:* "Agrees to interview" isn’t outcome-counted → **Revert to AI scaling prediction base rate** (e.g., forecast failures in ML R&D).

  ### Overruled Verdicts
  - **Your feature deadlines:** Personal n=40 lacks *comparable conditions* (variable complexity/research) and isn’t verifiable soon enough to punish optimism. Principle forces → **Use magazine feature base rate**.  
  - **Transit cost percentile:** Clause 3 explicitly accommodates this → **Verdict upheld**.  

  ### The "This Time Is Different" Escape Hatch
  Modesty stops when **mechanism evidence** meets two bars:  
  - (i) *Direct observability:* The causal link is physically manifest (e.g., visible clutch wear)  
  - (ii) *Short feedback loop:* Validation occurs before exogenous variables dominate (e.g., clutch failure testable on next drive).  

  *Built into the principle:* Clause 2(b) forces short verification windows, while clause 1 demands that "comparable conditions" include mechanism robustness (e.g., the lab’s power supply test at half-power). For your friend’s startup: her "this time is different" claim (e.g., "learned from past mistakes") lacks *counted outcomes* proving error-correction → **Reject**.

  ### Why This Works
  - **Resolves lab director conflict:** Shot-rate meets both clauses (counted past shots + months-scale verification); net-energy fails both.  
  - **Handles selection bias:** "Interviewed AI researchers" isn’t an outcome-counted class → Default to broad base rate.  
  - **Prevents cherry-picking:** "Well-funded" is a *confidence generator*, not an outcome-counted dimension. "Four books" is a counted result.  
  - **Escapes total modesty:** The mechanic’s clutch diagnosis is both observable *now* and verifiable *immediately* → Overrides base rate. A fusion director’s "new magnet design" claim wouldn’t (validation too distant).

  ### Final Principle Statement
  > **When evaluating a forecast:**  
  > **1.** Demand *outcome-counted evidence* for identical actions under comparable conditions.  
  > **2.** Demand resolution within a window *shorter than typical distortion cycles* (funding, hype, leadership churn).  
  > **3.** If either fails, use the *broadest reference class with outcome counts*, reporting distribution shape (e.g., percentiles for heavy tails).  
  > **4.** Override with mechanism evidence *only* if physically observable and verifiable before step 2’s window closes.  

  This forces inside views to earn legitimacy through **counted precision** and **swift accountability** – the antidote to ungrounded expertise. Your discomfort stems from violating step 1 in personal deadlines and step 2 in net-energy claims. The fix is painful but coherent.
