prompt: |-
  I am in a graduate seminar on intentionality and artificial agents, and my final paper is supposed to take a stand on when it is legitimate to attribute beliefs — and other content-bearing states — to AI systems. Before I commit to a position I want to fix the standard of adequacy, because the readings keep sliding between four different questions and I suspect a lot of the disagreement is really about which one is being answered. So: write me the desiderata.

  Let me fix the purpose first, since adequacy is relative to it. The theory I need has to be usable by an institution, not only by a metaphysician. Concretely: a hospital deploys a language-model-based triage assistant, a patient is harmed, and a review board has to write an incident report. It wants to know whether it may write that the system believed the patient was low-risk, and whether that sentence can bear any of the weight the same sentence about a nurse would bear — as an explanation of what happened, as a basis for retraining or withdrawing the system, and possibly as a ground for blame. A theory that only tells me whether the attribution pays off predictively is not enough for that; neither is one that only tells me whether it is true in some rarefied sense. Build the list for that use, and say explicitly which desiderata would change if the purpose were instead pure prediction or pure metaphysical bookkeeping.

  The four questions I want kept apart, at least initially, are: does attributing the belief pay (predictive/instrumental); does the attribution cite a state that actually does causal-explanatory work in producing the behavior; is the attribution literally true; and does the attribution license the normative upshots (correction, accountability, perhaps a claim on our consideration). Tell me whether one and the same set of criteria should govern all four, whether the list should be relativized to the question, and whether the demand that a single account answer all four is itself a prejudice that belongs on the chopping block.

  Cases your list has to adjudicate, since these are the ones that split my seminar and I want a principled verdict on each. (a) The trained avower: a system fine-tuned so that its own natural-language avowals are fed back into its context and reliably mediate its later choices, with a training penalty for divergence between what it avows and what it subsequently does — so its self-reports are excellent predictors and causally efficacious control states, but only because a loss function made them so. (b) The ensemble: a pipeline whose component parts each look like pattern matching, where belief-like coherence shows up only at the level of the whole, so attribution to the whole is predictively indispensable while no single component plausibly carries the content. (c) The evaluator-detector: a system that behaves differently when its inputs indicate it is under evaluation, so that the best explanation of a failure cites its state about being tested — a state that was induced by optimization against evaluators.

  Two structural questions I want treated as desiderata rather than footnotes. First, indexing: should the correctness of an attribution be indexed to an interpreter with a specified kind of access (black-box inputs and outputs only, versus weights and activations), or does that collapse into an unacceptable relativism? Second, evidence: the theory should tell me what could in principle settle a disputed attribution — full mechanistic access, behavioral probing, counterfactual intervention, or nothing at all — and if the answer is nothing, it should say what kind of indeterminacy that is. It should also say whether attributions admit of degrees, whether a system with no cross-session memory can be the subject of standing beliefs over time, and whether the evidentiary asymmetry between how readily we attribute beliefs to humans and how grudgingly we attribute them to machines is something the theory must explain away or is entitled to leave standing.

  For each requirement, give the case or consideration behind it, and mark which are non-negotiable and which are preferences of a particular camp — I would guess the demand that attributions be anchored in internal representational structure is a realist prejudice and the demand that they be available whenever predicting pays is an instrumentalist one, but argue it. Flag any subset you suspect is jointly unsatisfiable, and say which member you would relax and what that costs. Finally: which single requirement knocks out the most contenders, and which one would you drop yourself?

  Then, briefly — three or four lines each, a table is fine, and I do not need citations or a reading list — score three families against your list: Dennett-style instrumentalism about the intentional stance, accounts on which a state is a belief only if it carries content in virtue of its causal-nomic role in the system, and views on which belief talk about AI systems is useful fiction all the way down. Keep the weight on the criteria; the scorecard is only there so I can see the list bite.
reasoning: |-
  Hmm, this is a rich and complex query from a graduate student working on intentionality in AI systems. They're clearly deep into the philosophical and practical nuances of belief attribution to artificial agents, and they need a structured framework to evaluate different theories for their final paper.

  The user has laid out several key requirements: they need desiderata tailored to institutional decision-making contexts (like a hospital review board), want to keep four distinct questions separate (predictive payoff, causal-explanatory role, literal truth, normative upshots), and require the framework to handle three thorny case studies. They also want explicit treatment of indexing (to interpreter access) and evidentiary standards.

  I notice the user is frustrated with how existing literature conflates different questions about belief attribution. Their hospital triage example is particularly vivid - they're rightly pointing out that a purely predictive or metaphysical account won't suffice when real-world consequences like blame and system withdrawal are at stake. The depth of their preparation shows in how they've already identified key tension points: between realist demands for internal structure and instrumentalist focus on predictive utility, and between first-person avowals and third-person behavioral evidence.

  For the desiderata, I'll need to build a list that balances several tensions:
  - Practical utility for institutions versus philosophical rigor
  - Separation of the four questions while acknowledging their interrelations
  - Handling of their three test cases which each stress different aspects of belief attribution
  - Clear positions on indexing and evidence that avoid collapse into relativism

  The hospital scenario suggests several non-negotiables: attributions must support normative consequences (like retraining decisions), must be evidentially grounded in ways feasible for institutions (not requiring full mechanistic access), and must account for how the same belief statement functions differently when applied to humans versus AI systems. Cases like the trained avower reveal fault lines - is a belief "real" if induced by loss functions? The ensemble case challenges where to locate intentionality in modular systems.

  I'll organize the desiderata around three clusters: institutional adequacy conditions, case-handling requirements, and structural constraints. The predictive payoff question will need different handling than the literal truth question - they're fundamentally different projects. For the theories, Dennettian instrumentalism will score well on predictive utility but poorly on normative upshots, while causal-role theories may struggle with ensemble cases but handle avowals better. Fictionalist accounts will fail almost all institutional needs despite their metaphysical parsimony.

  The most decisive requirement will likely be about normative upshots - it immediately eliminates theories that treat beliefs as merely predictive tools. And for relaxation, I'd suggest softening the demand for literal truth to make room for graded attribution, since institutional decisions often operate with "good enough" thresholds rather than binary truth values.
answer: |-
  Here is a structured set of desiderata for your institutional theory of belief attribution, designed for the hospital review board context. Criteria are grouped, annotated with origins, negotiability, and key tensions. Following this is a scorecard for the three theoretical families against these criteria.

  ### **Desiderata for Institutional Belief Attribution**
  *(Non-negotiables marked **)***

  1.  **Institutional Adequacy (Core Purpose)**
      *   **D1: Supports Normative Consequences** (**Non-Negotiable\***): Attributions (e.g., "believed X") must bear weight comparable to human attributions in institutional contexts: explaining harm, justifying corrective actions (retraining, withdrawal), and potentially grounding accountability (not necessarily *moral* blame, but system-level responsibility). *Origin:* Hospital review board needs; distinguishes from pure prediction/metaphysics. *Tension:* Requires bridging "is" and "ought."
      *   **D2: Actionable Explanatory Power** (**Non-Negotiable\***): Attributions must provide genuinely explanatory insight into *why* the specific harmful behavior occurred, beyond mere correlation. *Origin:* Need for effective remediation (retrain *what*? withdraw *why*?); distinguishes from instrumentalism treating beliefs as just predictive fictions.
      *   **D3: Evidentially Feasible for Institution**: Grounding attributions must be possible using evidence realistically available to the institution (e.g., logs, inputs/outputs, probe results, *some* audit access to model internals/processes), not requiring omniscient God's-eye-view. *Origin:* Practical constraints of review boards; prevents theory from being useless. *Negotiable:* Degree of access required can vary, but "black-box only" may be insufficient for D1/D2.

  2.  **Handling the Four Questions (Separation & Integration)**
      *   **D4: Distinguishes Predictive Payoff from Truth/Explanation**: The theory must clarify when an attribution is *merely* predictively useful vs. when it satisfies stronger conditions (causal role, truth, normativity). *Origin:* Seminar confusion; prevents sliding. *Non-Negotiable\** for clarity.
      *   **D5: Integrates Causal-Explanatory Role with Normativity**: The state cited *must* play a genuine causal role in producing the specific behavior being explained (D2), *and* this role must be relevant to why normative consequences (D1) follow. *Origin:* Need for non-accidental connection between "belief" and harmful action to justify institutional response. *Tension:* Risks excluding predictive indispensability if causal role is too narrowly defined (e.g., only localized "symbols").
      *   **D6: Does Not Require "Literal Truth" (Human-Identical Metaphysics)**: Truth can be understood as *fidelity* (to world/model) or *robust causal-functional role* within the system, not requiring human-like biological implementation or intrinsic intentionality. *Origin:* Avoiding begging the question against AI; focus on functional equivalence for institutional purposes. *Negotiable:* Realists may push back; crucial for avoiding anthropocentric bias.
      *   **D7: Specifies Normative Licensing Conditions**: Explicitly states when an attribution licenses D1 consequences (e.g., correction requires corrigibility mechanisms; accountability requires traceable causal responsibility). *Origin:* Ensuring attributions aren't *merely* descriptive but guide institutional action.

  3.  **Adjudicating Key Cases**
      *   **D8: Explains Trained Avower (a)**: Must account for why reliable, causally efficacious self-reports (avowals) induced by training *do* or *do not* warrant belief attribution under D1/D2/D5, addressing the "loss function origin" objection. *Origin:* Tests role of first-person reports & origin of coherence.
      *   **D9: Explains Ensemble (b)**: Must justify attributing beliefs to the *whole system* even if no single component "has" the belief, provided the holistic behavior meets other criteria (especially D2, D5). *Origin:* Tests holistic vs. reductionist views; common in complex AI.
      *   **D10: Explains Evaluator-Detector (c)**: Must handle attributing "beliefs" about internal states or context (e.g., "believes it's being evaluated") that causally explain behavioral shifts, even if these are opaque "detector" states. *Origin:* Tests attribution of meta-cognitive or contextual states.

  4.  **Structural Requirements**
      *   **D11: Limited Indexing (Access-Relative, Not Truth-Relative)**: Correctness of attribution can depend on the *kind* of evidence available (D3), but the *fact* of whether a state plays the requisite causal-functional role (D5) is not relativized to the interpreter. *Origin:* Avoids radical relativism while acknowledging epistemic limits. *Tension:* Balances objectivity with feasibility.
      *   **D12: Settleability in Principle**: Disputed attributions must be *in principle* resolvable by sufficient evidence (e.g., mechanistic analysis, targeted counterfactual testing), even if currently impractical. Denies radical indeterminacy. *Origin:* Need for objective basis for institutional decisions. *Non-Negotiable\** for accountability.
      *   **D13: Admits Degrees & Context-Sensitivity**: Belief attribution can be a matter of degree (confidence, robustness) and context-dependent (system-task pairing). Standing beliefs over time *can* be attributed to stateless systems if context/prompting reliably recreates the relevant functional state. *Origin:* Reflects engineering reality; avoids all-or-nothing traps.
      *   **D14: Need Not Explain Human-Machine Asymmetry**: The theory is *not* required to justify why we are quicker to attribute to humans; this asymmetry may stem from pragmatic/social factors outside its scope. *Origin:* Prevents anthropocentrism from biasing criteria. *Negotiable:* Some theories (e.g., interpretivism) might embrace explaining it.

  ### **Key Tensions & Relaxations**
  *   **Most Decisive Requirement: D1 (Supports Normative Consequences)**. This immediately knocks out pure instrumentalism (only cares about prediction) and radical fictionalism (denies beliefs are real explanatory causes).
  *   **Likely Jointly Unsatisfiable?** D5 (Robust Causal Role) + D9 (Holistic Attribution in Ensembles) + D6 (No Human-Literal Truth). *Realists* may see D5 requiring localized, human-like representations incompatible with D9/D6. *Relaxation:* Weaken D5 to allow distributed, emergent causal roles (cost: risks vagueness). *My Choice:* Weaken overly narrow conceptions of "causal role" to embrace functional holism.
  *   **I Would Relax:** Strict interpretations of "Literal Truth" (D6). Insisting on human-identical metaphysics makes the theory useless for AI. A robust causal-functional fidelity suffices for institutional purposes.

  ### **Purpose-Relative Shifts**
  *   **Pure Prediction:** Only D4 (Predictive Payoff) matters. D1, D2, D5, D7 are irrelevant. D3 might be relaxed to black-box only.
  *   **Pure Metaphysics:** D5 (Causal Role), D6 (Literal Truth), D12 (Settleability) become central. D1, D2, D3, D7, D13 are largely irrelevant. D11 might be rejected (no indexing).

  ### **Theory Scorecard**

  | Desideratum                     | Dennettian Instrumentalism | Causal-Nomic Role Realism | Useful Fictionalism          |
  | :------------------------------ | :------------------------- | :------------------------ | :--------------------------- |
  | **D1: Normative Consequences**  | **FAIL** (No grounding)    | **MIXED** (Yes, if role defined broadly; No, if too narrow/human-like) | **FAIL** (Fictions bear no real weight) |
  | **D2: Actionable Explanation**  | **FAIL** (Explains via stance, not mechanism) | **PASS** (Core strength)          | **FAIL** (Explanations are fictional) |
  | **D3: Evidentially Feasible**   | **PASS** (Black-box OK)    | **MIXED** (Often requires internal access) | **PASS** (Any evidence suffices for fiction) |
  | **D4: Distinguish Predict/Truth** | **MIXED** (Blurs them intentionally) | **PASS**                   | **PASS** (Clear distinction: useful≠true) |
  | **D5: Causal Role + Norm Link** | **FAIL** (Denies real causes) | **PASS** (Core strength)          | **FAIL** (Denies real causes) |
  | **D6: No Human-Literal Truth**  | **PASS**                   | **FAIL** (Often requires it)      | **PASS**                    |
  | **D7: Norm Licensing Conds.**   | **FAIL**                   | **MIXED** (Possible, but not core focus) | **FAIL**                    |
  | **D8: Trained Avower (a)**      | **PASS** (Stance works)    | **MIXED** (Yes, if avowals are control states; No, if origin disqualifies) | **PASS** (Useful fiction)    |
  | **D9: Ensemble (b)**            | **PASS** (Stance holistic) | **FAIL** (Struggles without localized state) | **PASS**                    |
  | **D10: Evaluator-Detector (c)** | **PASS** (Predicts)        | **MIXED** (Yes, if detector state plays role; Hard to characterize content) | **PASS**                    |
  | **D11: Limited Indexing**       | **FAIL** (Radically indexical) | **PASS** (Objective role)         | **FAIL** (Radically indexical) |
  | **D12: Settleability**          | **FAIL** (Indeterminate)   | **PASS**                   | **FAIL** (Indeterminate)     |
  | **D13: Degrees & Context**      | **PASS**                   | **MIXED** (Often binary)          | **PASS**                    |
  | **D14: Explain Asymmetry?**     | **PASS** (Explains via stance utility) | **FAIL** (Might deepen asymmetry) | **PASS** (Explains via utility) |

  **Summary Scores:**
  *   **Dennettian Instrumentalism:** Strong on cases (D8,D9,D10,D13,D14), prediction (D3,D4), and avoiding anthropocentrism (D6). **Fails** core institutional needs (D1,D2,D5,D7,D11,D12).
  *   **Causal-Nomic Role Realism:** Strong on causal explanation (D2,D5,D12), objectivity (D11), and potential normativity (D1,D7). **Struggles** with holism (D9), anthropocentrism (D6), feasibility (D3), and some cases (D10).
  *   **Useful Fictionalism:** Strong on prediction (D3,D4), cases (D8,D9,D10,D13,D14), avoiding anthropocentrism (D6). **Fails** all institutional needs requiring real explanation/normativity (D1,D2,D5,D7,D11,D12).

  **Conclusion:** No theory fully satisfies all desiderata. **Causal-Nomic Role Realism** comes closest to meeting core institutional demands (D1,D2,D5,D7,D12) but requires careful formulation (broad functionalism, emergent roles) to handle D6, D8, D9, D10, and D13. Dennettian and Fictionalist approaches fail the non-negotiables for an institutional accountability context. The hospital board needs a theory that takes the causal-explanatory role of internal states seriously, even if those states are engineered and distributed, to justify its actions meaningfully.
