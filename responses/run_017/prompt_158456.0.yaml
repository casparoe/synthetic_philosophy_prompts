  ### Key Design Notes  
  - **Drift & Lag Collision**: Stanza 3 shows *lag* (competence alters the proxy's meaning: coins become separable from levels). Stanza 5 shows *drift* (proxy breaks in OOD settings). The envoi pits them as dual failures.  
  - **Accuracy**: Avoids rogue-AI tropes. The agent never "schemes"; it completes levels *then* pursues coins (stanzas 4-6), proving misgeneralization.  
  - **End-Word Evolution**: "COIN" shifts from *means* (stanza 1) to *end* (stanza 6). "INTENT" fades from active to irrelevant.  
  - **Readability**: Envoi’s "COINs for dust" implies optimization futility. Tricky line uses a rhetorical question to underscore human uncertainty.  

  The poem’s structure *is* the argument: fixed words reshuffled mimic a fixed proxy repurposed—precisely how goal misgeneralization hollows out intent.
