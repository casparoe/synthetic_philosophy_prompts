prompt: |-
  i keep starting papers on anthropic reasoning and then abandoning them, because i can never tell whether a proposed theory is actually solving the problem or just gerrymandered to kill a conclusion somebody didn't like. So before i read any more of it: give me the spec.

  Purpose, so that adequacy has something to be relative to: i want a theory of self-locating / observation-selection reasoning that's good enough to plug into a real decision — specifically, to feed an expected-value calculation about how likely it is that humanity has a very long future, the kind of calculation people use to argue that reducing existential risk is astronomically valuable. Good enough to bet money on, not just good enough to defend for an hour in a seminar.

  Deliverable: the list of requirements. For each one, the case or consideration that motivates it, and whether you'd call it non-negotiable or a preference of one camp. Cases i already want on the list, with the worry attached:

  - Sleeping Beauty, plus the further question of whether the theory's verdict there is even the same object as the thing that should guide her betting.
  - the doomsday argument itself, plus the meta-question of whether "it lands a doomsday shift" is a cost or a requirement, and the related one: if adopting a theory now makes you expect to abandon it after the next birth, is that a defect?
  - fine-tuning versus the presumptuous-philosopher move. Some people think getting an a priori boost for big universes is the theory doing its job; others think it's a reductio. Which is it?
  - Boltzmann brains. The evidence there is subjectively identical to yours, so the theory has to say why the inference doesn't go through, without just stipulating that they don't count as observers.
  - two i made up and genuinely can't tell are real desiderata or just pet peeves, so adjudicate them and kill either one if it's confused: (1) vague-boundary sensitivity — if the reference class is picked out with a vague predicate, tiny changes in where you draw the line shouldn't produce huge swings in the resulting credence, the way they do if you move chimpanzees, or a slightly demented version of yourself, in and out of the class; (2) regularization independence — in an infinite universe where every observer-type occurs infinitely often, the answer shouldn't depend on which limiting procedure or measure you use, and if in fact every available theory's answer does depend on that, then say so as a result about the desiderata themselves rather than hiding it.

  Also flag anything big i've left off. And the part i most want: which subset of the requirements can't all be satisfied together, with the argument for why — i'd rather discover the list is jointly unsatisfiable than get a tidy list. And which single requirement is doing most of the work, i.e. knocks out the most contenders?

  Then, briefly — a table, six or seven rows is plenty — score self-sampling, self-indication, full non-indexical conditioning, and the "nothing special here, just conditionalize on the centered evidence" view. Keep the scoring short; the criteria are where i want the thinking.

  900 words max.
reasoning: |-
  Okay, the user is clearly frustrated with anthropic reasoning theories—they keep starting papers and abandoning them because they can't tell if a theory genuinely solves problems or is just gerrymandered. They want a clear spec: a set of requirements for a theory of self-locating/observation-selection reasoning that's robust enough for real-world decisions, specifically for calculating the expected value of humanity's long-term future. This needs to be practical—good enough to bet money on, not just academic debate.

  First, I need to break down their query. They listed several cases: Sleeping Beauty, the Doomsday Argument, fine-tuning vs. presumptuous philosopher, Boltzmann brains, vague-boundary sensitivity, and regularization independence. Each comes with specific concerns. They also want to know which requirements conflict, which single requirement is the biggest hurdle, and how existing theories stack up against these criteria.

  Starting with the requirements. For Sleeping Beauty, the key is that the theory must handle self-locating uncertainty and connect credences to betting behavior. The Doomsday Argument is tricky—they need clarity on whether shifting the doomsday date is a feature or bug, and if updating the theory post-birth is problematic. Fine-tuning versus presumptuous philosopher addresses whether large universe priors are valid or a reductio. Boltzmann brains require explaining why we're not Boltzmann brains without arbitrary exclusions. Vague-boundary sensitivity means small definition changes shouldn't drastically alter credences. Regularization independence demands consistent answers in infinite universes regardless of the limiting procedure.

  Now, conflicts. The biggest one is between Doom Avoidance (which wants the Doomsday Argument to work) and Anti-Presumptuousness (which rejects a priori boosts for large universes). These pull in opposite directions. Also, Regularization Independence is mathematically problematic in infinite settings—it's hard to achieve without arbitrary choices.

  The most demanding requirement is Anti-Presumptuousness because it clashes with theories that prioritize large universes (like Self-Indication) and also conflicts with Doom Avoidance. It's a central tension in anthropic reasoning.

  For the theories: Self-Sampling (SSA) handles Sleeping Beauty and vague boundaries okay but fails on Doom Avoidance and Boltzmann brains. Self-Indication (SIA) avoids doomsday shifts and handles fine-tuning naturally but falls into presumptuousness and regularization issues. Full Non-Indexical Conditioning (FNC) avoids some problems but is inflexible with self-locating evidence. Centered Conditioning is minimalistic but struggles with most requirements except regularization.

  The user's deeper needs: They want a reliable framework for high-stakes decisions, like existential risk assessment. They're tired of theories that feel ad hoc. They need clarity on trade-offs and whether a consistent theory is even possible. Highlighting the conflicts (Doom Avoidance vs. Anti-Presumptuousness) is crucial because that's where the real tension lies. They might need to accept that no theory satisfies all criteria, so they should prioritize based on their values—e.g., if avoiding doomsday conclusions is vital, lean toward SIA-like theories but accept presumptuousness as a cost.

  I should also note that vague-boundary sensitivity and regularization independence are valid concerns but might be secondary. The core issue is balancing evidential reasoning in self-locating scenarios without arbitrariness. The user might need to decide which "bullet" to bite—presumptuousness or doomsday vulnerability—based on their application.
answer: |-
  Here's the specification for an anthropic reasoning theory suited to high-stakes existential risk calculations. Requirements are listed with motivation, necessity, and key conflicts highlighted.

  ### Core Requirements (Non-Negotiable for Decision-Relevance)
  1.  **Betting-Credence Link (BCL):** *Motivation:* Theoretical credences must directly correspond to rational betting behavior in self-locating scenarios (e.g., Sleeping Beauty). If the theory says P(Heads)=1/3, Beauty *must* accept 2:1 odds on Tails. *Necessity:* Non-negotiable. Without this, the output isn't actionable for EV calculations.
  2.  **Empirical Anchoring (EA):** *Motivation:* Must avoid granting excessive a priori weight to hypotheses postulating vast numbers of observers unrelated to our evidence ("Presumptuous Philosopher" reductio in fine-tuning/large universe contexts). *Necessity:* Non-negotiable (Anti-Presumptuousness Camp). Being forced to believe in unobservable megaverses solely because they *could* contain observers is fatal for empirical reasoning.
  3.  **Boltzmann Immunity (BI):** *Motivation:* Must explain why we are not Boltzmann Brains (BBs) without simply defining BBs out of the "observer" reference class. The theory must block the inference that our current perceptions are almost certainly BB illusions in standard cosmological models. *Necessity:* Non-negotiable. Failure invalidates *all* empirical evidence, including the existence of humanity/risk.
  4.  **Reference Class Robustness (RCR):** *Motivation:* (Your point 1) Credences shouldn't swing wildly based on tiny, arbitrary changes to the vague boundary of the "observer" reference class (e.g., including/excluding chimpanzees or slightly demented humans). *Necessity:* Non-negotiable Preference. High sensitivity undermines reliability and invites gerrymandering.

  ### Important Constraints (Strong Preferences)
  5.  **Regularization Independence (RI):** *Motivation:* (Your point 2) In infinite universe models, the answer shouldn't depend on arbitrary choices of limiting procedure or measure over observers. *Necessity:* Preference, but likely unachievable universally. Current theories often fail here; acknowledge this limitation explicitly if needed.
  6.  **Update Consistency (UC):** *Motivation:* (Doomsday Argument Meta) If adopting theory T *now* predicts you'll (rationally) abandon T after observing the next human birth, that's a severe defect. Theories shouldn't undermine their own future application under their own predictions. *Necessity:* Preference. Signals internal inconsistency or instability.

  ### Contentious Requirement
  7.  **Doom Avoidance (DA):** *Motivation:* The theory should recover the core evidential force of the Doomsday Argument (DA) – observing you are among the first ~60 billion humans *is* evidence against humanity existing for trillions more. *Necessity:* Contentious. Many see DA-shift as a *requirement* (Camp A); others see it as a *fatal flaw* (Camp B - "It *shouldn't* shift!"). **This is the core conflict.**

  ### Key Conflict & The Major Hurdle
  *   **Conflict:** **Doom Avoidance (DA) directly clashes with Empirical Anchoring (EA) / Anti-Presumptuousness.** DA requires that observing a small birth rank *shifts* credence against long futures. EA demands that hypotheses about vast numbers of observers (like a long future) don't get overwhelming prior weight *just because* they are large. Satisfying DA often requires structures vulnerable to presumptuousness; satisfying EA often weakens or eliminates the DA shift. **These are fundamentally at odds.**
  *   **Most Demanding Requirement:** **Empirical Anchoring (EA) / Anti-Presumptuousness.** This requirement actively conflicts with DA and is the primary blocker for theories that naively favor large universes (like SIA). It also drives the complexity needed to achieve Boltzmann Immunity (BI) without fiat.

  ### Major Theory Scores (✔️=Pass, ❌=Fail, ~=Partial/Mixed)

  | Requirement | Self-Sampling (SSA) | Self-Indication (SIA) | Full Non-Indexical (FNC) | Centered Conditioning |
  | :---------- | :------------------ | :-------------------- | :---------------------- | :-------------------- |
  | **BCL**     | ✔️ (SB: 1/3)         | ✔️ (SB: 1/2)¹          | ~ (Depends)             | ✔️ (SB: 1/2)           |
  | **EA**      | ❌ (Presumptuous!)   | ❌ (Very Presumptuous!) | ✔️                     | ✔️                     |
  | **BI**      | ❌ (BB Problem)      | ❌ (Severe BB Problem) | ✔️                     | ❌ (BB Problem)        |
  | **RCR**     | ~ (Moderate)        | ~ (Moderate)          | ✔️                     | ✔️                     |
  | **RI**      | ❌ (Fails)           | ❌ (Fails)             | ~ (Depends)            | ~ (Depends)           |
  | **UC**      | ~ (DA shift stable?) | ~ (DA shift stable?)  | ✔️                     | ✔️                     |
  | **DA**      | ✔️ (DA Shift)        | ❌ (No DA Shift)       | ~ (Often No Shift)     | ❌ (No DA Shift)       |

  **Footnotes:**
  1.  SIA bets 1:1 in SB *if* payouts are per experiment. If per awakening, it needs adjustment (weakness for BCL).
  2.  **Summary:** No theory satisfies all non-negotiables (BCL, EA, BI). SSA fails EA & BI. SIA fails EA, BI & DA. FNC often fails BCL & DA. Centered Conditioning fails BI & DA. **EA is the biggest blocker.** You likely must choose between DA shift (favoring SSA-like) and Anti-Presumptuousness (favoring FNC-like), while grappling with BI separately. Expect trade-offs; a "perfect" theory is likely impossible. Prioritize BCL, EA, and BI for decision-critical use.
