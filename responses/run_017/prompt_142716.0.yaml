  - Sleep-talk narration → Present-tense implies contemporaneity.  
  - Night-terrors → Dissociation between behavior and recall.  
  - REM atonia failure → Action matching report suggests dream causation.  
  - Duration tracking → Objective-subjective time alignment.  
  - Unrecalled dream traces → Implicit memory without explicit recall.  
  - Infant/animal REM → Experience without report capacity.  
  - Dreamer's reality delusion → Illusion of presence during sleep.  
  - Their continuous-narrative case → Coherence across awakenings.  
  - Their non-recaller case → Experience without reportability.  

  Non-negotiables: The theory must accommodate lucid signaling (direct evidence of real-time mentation) and non-recall edge cases. Biases to flag: First-person authority (questioned by Dennett) and neural signature demands (may exclude subjective data).  

  The tension: Desideratum 1 (dream reports index sleep experiences) vs. Desideratum 8 (non-recaller has no experience despite signatures). This pits empirical evidence against theoretical parsimony.  

  Malcolm: Radical—dreams aren't sleep experiences, just awakening narratives.  
  Dennett: Skeptical—reports are waking reconstructions, not recordings.  
  Default view: Dreams = REM experiences (naïve but intuitive).  

  Least confident claim: That infant REM proves experience—may confuse correlation with causation. Overall medium confidence due to the hard problem of consciousness.  

