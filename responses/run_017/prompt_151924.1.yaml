      You are a member of the assembly, representing a district. You have a district card with your preferred allocation.

      **Scoring**:
      - Base: 100 - [ |actual Edu - desired Edu| + ... + |actual PS - desired PS| ]
      - Round 1 only: +10 points if you voted for the passed budget.

      **Round differences**:
      - Round 1: You are in your first term and want to be re-elected. So you care about your district and also about being seen as a team player (hence the bonus for voting for the passed budget).
      - Round 2: You are in your second and final term. You care only about your district.
      - Round 3: You were chosen by lot and will serve only one term. You care only about your district.

      **How to play**:
      - Propose motions: Write your proposal (5 numbers, sum 100) and give to the Secretariat. They will draft it and put it on the agenda (but you can spend 1 minute of floor time to force it to the top).
      - Use floor time (3 minutes per round) to:
          - Speak (1 minute per use).
          - Force your motion to the top of the agenda (1 minute).
          - Force an immediate vote on the current motion (1 minute).
      - Vote on motions.

      **Goal**: Get as high a score as possible.

   13. **Facilitator notes**:
       - Before starting, assign roles: 
            - Secretariat: Choose 3 students (or 4 if 17 students). Give them the Secretariat role sheet and rulebook.
            - Members: The rest. Shuffle the district cards and hand out. Give each a member role sheet.
       - Explain the overall goal: to experience different selection rules and see how they affect behavior.
       - After each round, have students note their scores (but don't reveal to others) and reset for the next round.
       - Enforce time: 20 minutes per round. Use a timer. At 20 minutes, if no budget passed, impose the default (20,20,20,20,20) and move on.

   This design is complex, but it should run in 90 minutes and illustrate the key concepts. Good luck!
answer: |-
  ### Democratic Innovation: Institutional Design Session Plan  
  **Topic:** Selection Rules and the Migration of Power  
  **Time:** 90 minutes  
  **Students:** 17 upper-level undergraduates  
  **Materials:** Printed role sheets, rulebook, district cards (index cards), deck of cards, timer, movable chairs.  

  ---

  ### **Game Design: "The Relocation Game"**  
  *Simulates a regional assembly allocating a 100-point budget across 5 sectors (Education, Health, Infrastructure, Environment, Public Safety).*  

  #### **Core Mechanics**  
  - **Secretariat (3 students):** Permanent staff. Draft motions, set agenda, score points for passed proposals.  
  - **Members (14 students):** Lawmakers with district-specific priorities. Score points for budget alignment with district needs.  
  - **Rounds:** Three rounds with changing selection rules (re-electability → term limits → sortition).  
  - **Scarce Resource:** Floor time (3 min/member/round) to reclaim power from Secretariat.  
  - **Hybrid Round (Cohort Pairing):** Skipped due to time; discuss in debrief as theory.  

  ---

  ### **Materials to Print**  
  #### **1. Rulebook (1 page, double-sided)**  
  ```markdown
  # RULES: REGIONAL ASSEMBLY BUDGET GAME  
  **GOAL:** Pass a budget allocating 100 points to 5 sectors.  

  **ROLES:**  
  - **SECRETARIAT (3):**  
    - Draft proposals into votable motions.  
    - Set agenda order.  
    - Score 1 pt per sector in passed proposals *they* drafted.  
  - **MEMBERS (14):**  
    - Propose budget ideas (write on index cards).  
    - Vote on motions (majority wins).  
    - Score: 100 - Σ|actual - desired| for their district.  
    - **Floor Time:** 3 min/round. Spend to:  
      - 1 min: Force Secretariat to draft your idea NOW.  
      - 1 min: Force vote on current motion IMMEDIATELY.  

  **PROCEDURE:**  
  1. Secretariat announces first agenda item.  
  2. Members debate (max 30 sec/speech).  
  3. Secretariat calls vote → majority passes motion.  
  4. If no motion passes in 20 min, DEFAULT BUDGET (20/20/20/20/20) is adopted.  

  **ROUND-SPECIFIC RULES:**  
  - Round 1: Re-electability → Members earn +10 pts if they vote YES on final budget.  
  - Round 2: Term Limits → No re-election. Members are "lame ducks."  
  - Round 3: Sortition → Single non-renewable term. No re-election.  
  ```  

  #### **2. Role Sheets (Per Student)**  
  - **Secretariat Sheet:**  
    *"You are permanent staff. Your power grows when lawmakers are inexperienced. Draft proposals to survive votes—not to favor any outcome. Use procedure to stay relevant."*  
    Scoring: 1 pt per sector in passed motions *you* drafted.  

  - **Member Sheet:**  
    *"Your district card shows your priorities. Fight for them, but remember: in some rounds, you need re-election support. Use floor time wisely to bypass Secretariat delays."*  
    Scoring: 100 - Σ|actual - desired| allocation for your district.  

  #### **3. District Cards (14 index cards)**  
  *Example:*  
  ```  
  DISTRICT 7  
  Priorities:  
  - Education: 25  
  - Health: 30  
  - Infrastructure: 15  
  - Environment: 10  
  - Public Safety: 20  
  ```  
  *Design Tip:* Create 5 card types (3 copies each) with conflicting priorities (e.g., "Rural" vs. "Urban" emphasis).  

  ---

  ### **Timeline (90 Min)**  
  1. **Setup (5 min):**  
     - Assign roles: Draw cards for Secretariat (3♠) and Members (14♥).  
     - Distribute materials. Arrange chairs in circle with Secretariat at a "staff table."  

  2. **Rules Briefing (5 min):**  
     - Explain: "We’re simulating how selection rules shift power. Secretariat runs the show; members fight for districts."  
     - Highlight: Floor time, scoring, round-specific incentives.  

  3. **Round 1: Re-electability (20 min):**  
     - Announce: "Elections are coming! Voting YES on the final budget helps your re-election."  
     - Run: Members propose → Secretariat drafts/sets agenda → Debate → Vote.  
     - *Facilitator:* Enforce 30-sec speeches, track floor time.  

  4. **Round 2: Term Limits (20 min):**  
     - Announce: "You’re term-limited lame ducks. No re-election—focus ONLY on your district."  
     - Run: Same as Round 1.  

  5. **Round 3: Sortition (20 min):**  
     - Announce: "You were chosen by lottery for one term. No re-election or legacy concerns."  
     - Run: Same as Round 1.  

  6. **Debrief (20 min):**  
     - **Step 1: Experience Share (5 min):**  
       - "What changed for you between rounds? When did the Secretariat feel strongest?"  
     - **Step 2: Migration Thesis (10 min):**  
       - Map quotes to concepts:  
         - *"The Secretariat shot down my idea unless I spent floor time!"* → **Knowledge relocation** to unelected staff.  
         - *"In Round 3, I didn’t care about compromise."* → **Sortition disconnects accountability** from future office.  
         - *"Lame ducks ignored the agenda rules!"* → **Term limits reduce incentive** to invest in procedure.  
     - **Step 3: Unbundling "Career Politicians" (5 min):**  
       - "Did we fix the ‘wrong people’ complaint (selection) or the ‘wrong incentives’ complaint (accountability)?"  
       - Guide them to name:  
         - *Selection problem:* Re-electability filters for office-seeking personalities.  
         - *Accountability problem:* Re-election demands pleasing voters, not just districts.  

  ---

  ### **Predictable Problems & Recovery**  
  1. **Problem:** Gridlock (no budget passes).  
     - **Recovery:** Enforce DEFAULT BUDGET. Say: "The public blames YOUR assembly for dysfunction."  

  2. **Problem:** Secretariat hoards power.  
     - **Recovery:** Whisper to Members: "Spend floor time to force a vote—you have the tools!" (Stay in character).  

  3. **Problem:** Members ignore district cards.  
     - **Recovery:** Announce mid-game: "Districts will recall representatives who betray priorities!" (Reinforce scoring).  

  ---

  ### **What the Game Cannot Simulate (Assert Post-Debrief)**  
  1. **Descriptive Representativeness:**  
     - "Sortition in reality ensures ordinary citizens are present—our game can’t replicate that diversity."  
  2. **Deliberative Depth:**  
     - "Real innovations use days of facilitated deliberation. Our 20-min rounds prioritize speed over nuance."  
  3. **Long-Term Knowledge Migration:**  
     - "In reality, relocated knowledge accumulates in lobbies/civil service over decades—not just one Secretariat."  

  ### **Why This Works**  
  - **Experiential Learning:** Students *feel* power shifting to staff under term limits/sortition.  
  - **Debrief Precision:** Concrete game moments link to migration thesis and unbundled critiques.  
  - **Low Cost:** Index cards and printed sheets suffice.  

  **Final Tip:** Run a pilot with friends to refine timing. Adjust district cards to ensure conflict!
