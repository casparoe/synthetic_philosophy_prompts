  On incomparability, I'll ask if it collapses to indistinguishability. If she denies this, the follow-up presses for a testable difference, questioning whether incomparability does any work.

  The contextualism question should highlight the consequence that betterness varies with stakes. If she accepts this, the follow-up asks how we can objectively evaluate policies across different stakeholders - this could be a major cost.

  For testability, I'll ask about empirical predictions on tie frequency vs. stakes. The follow-up presses what evidence would falsify the theory, making it accountable.

  The application question should seek concrete examples like cost-benefit thresholds to show the theory's relevance beyond philosophy.

  Finally, the "strongest objection" question wraps up by making her defend against the best counterargument.

  I'm most unsure about the accumulation question - the user's hobbyhorse. His chemistry background makes him see small differences as real and additive, while Dr. K might view this as missing the resolution point. The follow-up needs to force engagement beyond her stock reply.

