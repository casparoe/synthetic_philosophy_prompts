answer: |-
  Here is a purpose-built scenario meeting your specifications:

  **Scenario (240 words):**
  The Maritime Heritage Trust cares for the *Aurora*, a documented 1873 coastal schooner, central to local identity and maintained through decades of public donations and volunteer labor. A significant bequest from a descendant of the original builder is contingent on the *Aurora* being "the original, authentic vessel" as verified on January 15, 2025. While continuously maintained, registered, sailed ceremonially, and presented as the historic *Aurora*, a recent comprehensive conservation audit uncovered lost 1927 shipyard records. These reveal that during a severe storm damage repair, the *Aurora*'s entire original keel, stem, sternpost, and over 70% of its original frames were systematically replaced with new timber, while retaining most planking, decking, and fittings. This rebuild, undocumented in the vessel's official history and forgotten over time, was extensive but completed within six months before relaunch under the same name. The committee must decide by the deadline whether the current *Aurora* qualifies for the bequest as "the original, authentic vessel," based on the newly revealed 1927 reconstruction. The physical vessel in the dock remains unchanged by this discovery.

  **Three Accounts & Verdicts:**

  1.  **Continuity-of-Role Account:**
      *   **Verdict:** Yes, it is the original *Aurora*. The vessel persisted because its role (maintained, registered, sailed, identified, and treated as the *Aurora*) was unbroken.
      *   **Ceased to Exist?** Never. Continuous occupation of the role guarantees persistence.
      *   **Implication of History:** The maintenance, registration, ceremonies, and narrative are *constitutive* of the *Aurora*'s identity. They are the very evidence of its persistence.
      *   **Committee Action:** Accept the bequest. The *Aurora* has fulfilled its continuous role and meets the bequest's spirit of ongoing heritage.

  2.  **Matter-Tracking Account (Threshold: Original Structurally Essential Members - Keel, Stem, Sternpost, Majority of Frames):**
      *   **Verdict:** No, it is not the original *Aurora*. The original vessel ceased to exist in 1927 when its essential structural skeleton (keel, stem, sternpost, >70% frames) was replaced. The threshold is non-arbitrary as these members define the hull's fundamental form and structural integrity.
      *   **Ceased to Exist?** 1927. Crossing the threshold occurred during the rebuild.
      *   **Implication of History:** The activities since 1927 concerned a distinct, replica vessel materially descended from but not identical to the original *Aurora*. The narrative was mistaken.
      *   **Committee Action:** Refuse the bequest. The "original, authentic vessel" specified ceased to exist in 1927; the current vessel is a reconstruction.

  3.  **Four-Dimensionalist/Conventionalist Account:**
      *   **Verdict:** It depends on convention. There are candidate ship-stages: the pre-1927 stages (Original *Aurora*) and the post-1927 stages (Reconstruction *Aurora*). Which sum the name "*Aurora*" refers to is settled by institutional/social practice, which has consistently applied it to the later stages.
      *   **Ceased to Exist?** The original *Aurora* sum-of-stages ended in 1927. Whether "the *Aurora*" ceased depends on naming convention.
      *   **Implication of History:** Decades of practice *establish the convention* that the name "*Aurora*" refers to the entire spatiotemporal worm, including the post-1927 stages. The narrative *defines* the referent.
      *   **Committee Action:** Accept the bequest based on the established institutional convention identifying the current vessel as the *Aurora*, fulfilling the donor's likely intent regarding the heritage object they supported.

  **Honest Accounting:**

  1.  **The Key Feature:** The **replacement of the structurally essential members (keel, stem, sternpost, majority frames) in a single, forgotten historical event (1927 rebuild)** is doing the work. This creates a sharp, non-arbitrary material discontinuity significant enough to challenge persistence, yet hidden by continuous role-occupation.
  2.  **Degeneration Without Key Feature:**
      *   If the threshold was never crossed (e.g., only planking replaced), Matter-Tracking likely aligns with Continuity-of-Role.
      *   If the threshold was crossed visibly/ceremonially (e.g., a modern, documented rebuild), the epistemic conflict vanishes; the physical change itself might trigger the decision earlier, aligning Matter-Tracking with the known event. Role continuity might still claim persistence, but the conflict is overt, not latent.
  3.  **View Under Pressure & Defense:** **Matter-Tracking comes off worst** practically. Its verdict forces the committee to deny decades of accepted history and potentially reject the bequest based on a long-past, unknown event. Its defender would argue: "Authenticity in heritage *demands* attention to original material substance, especially for a vessel. The bequest specifies 'original, authentic vessel.' Only the matter-tracker takes this literally and non-arbitrarily. The physical fact of the 1927 rebuild, not its discovery date, destroyed the original. Ignoring this undermines the meaning of 'authentic' for tangible heritage." They emphasize the *discovery reveals a past physical reality*, not a present change.
  4.  **Vagueness/Verbal Solutions:** Appealing to the vagueness of "ship" or calling it a "merely verbal dispute" **is a change of subject, not a solution.** The committee *must* answer "yes" or "no" to a specific, high-stakes question ("Is this the *original, authentic vessel* for the bequest?"). Declaring it vague or verbal avoids the binding decision required by the legal/financial context and the donor's stipulation. The dispute's *origin* might involve semantics, but the committee's *duty* is concrete and binary.
