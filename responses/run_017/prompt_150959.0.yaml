answer: |-
  Here is a taxonomy structured as a decision tree, built from the logical space of linguistic relativity, focused on your constraints and designed to test your Kænnavan features. Branch nodes are phrased as concrete scenes testable within your novel's world.

  **Decision Tree for Linguistic Relativity Positions**

  1.  **Node Q1 (Obligatoriness):** *A Kænnavan speaker describes where they hid a knife in their hut. Do they consistently specify the wind-direction (e.g., "under the mat northwest of the hearth") even when speaking to themselves, silently, and under no pressure to communicate?*
      *   **If YES (Obligatory Encoding Observed):** Go to Q2.
      *   **If NO (Obligatory Encoding Not Observed Silently):** Go to Q6.

  2.  **Node Q2 (Persistence in Silence):** *A lifelong Kænnavan speaker, alone in a windowless room at night, attempts to recall the layout of a familiar reef they navigated that morning. Does their non-linguistic recall (e.g., drawing a map silently, mentally reconstructing) show systematic reliance on the absolute wind directions?*
      *   **If YES (Persistent Non-Linguistic Effect):** Go to Q3.
      *   **If NO (Effect Only During Speech Planning):** Go to Leaf A (Online Processing Constraint).

  3.  **Node Q3 (Conceptual Availability):** *A Kænnavan child, raised entirely monolingual, is shown a new, complex object (e.g., an intricate mechanical toy) for the first time inside a featureless room. When asked *non-verbally* (e.g., through gesture) to recreate its spatial relationships later in a different room, do they spontaneously use an absolute (wind-like) frame of reference?*
      *   **If YES (Conceptual Primacy/Framing):** Go to Leaf B (Conceptual Permeability).
      *   **If NO (Attention/Salience):** Go to Q4.

  4.  **Node Q4 (Bilingual Transfer):** *A Kænnavan speaker, fluent in a relative-frame trade language, is disoriented (spun blindfolded) inside a familiar hut. They must point to a specific location (e.g., "where the water jug sits"). When tested *silently* (pointing only), does their accuracy depend significantly on which language they were *just* using in conversation?*
      *   **If NO (Persists Regardless of Recent Language):** Go to Leaf C (Cognitive Habit).
      *   **If YES (Effect Modulated by Recent Language):** Go to Leaf D (Thinking for Speaking Plus).

  5.  **Node Q6 (Lexical Availability):** *When describing a unique shade of blue-green sea seen once, does a Kænnavan speaker find it significantly easier or more natural to describe it using their single combined "blue-green/grey" term than a bilingual speaker finds using the trade language's distinct "blue" or "green" terms?*
      *   **If YES (Lexical Priming/Ease):** Go to Leaf E (Lexical Priming).
      *   **If NO (No Effect from Lexicon):** Go to Q7.

  6.  **Node Q7 (Lexical Conceptual Effect):** *A monolingual Kænnavan speaker and a monolingual speaker of a language with distinct blue/green terms are shown a series of blue, green, and blue-green/grey objects. Later, in a *non-verbal* sorting task, do they group the colours significantly differently based on their language's lexical boundaries?*
      *   **If YES (Lexical Categories Affect Non-Verbal Cognition):** Go to Leaf F (Weak Lexical Relativity).
      *   **If NO (No Effect on Non-Verbal Cognition):** Go to Leaf G (Universalism).

  7.  **Node Q8 (Universalism Test):** *In a completely non-verbal task (e.g., eye-tracking, reaction time) involving discriminating between shades straddling the blue/green boundary, do monolingual Kænnavan speakers perform identically to speakers of languages with distinct blue/green terms?*
      *   **If YES (Identical Performance):** Go to Leaf G (Universalism).
      *   **If NO (Differential Performance):** Go to Leaf F (Weak Lexical Relativity). *(Note: This node primarily serves to distinguish F & G if Q7 is ambiguous)*

  **Terminal Positions (Leaves):**

  *   **Leaf A: Online Processing Constraint**
      *   *Most Awkward Commitment:* Explaining why deeply ingrained, obligatory grammatical habits *don't* leave *any* trace in non-linguistic cognition or silent thought, despite shaping every utterance.
      *   *Licensed Psychology:* Characters experience the *effort* or *automaticity* of encoding spatial relations, evidentials, or colour during speech planning and production. Silent, non-linguistic thought is unaffected.
  *   **Leaf B: Conceptual Permeability (Strong Whorfianism)**
      *   *Most Awkward Commitment:* Explaining how concepts fundamental to reasoning (like spatial frameworks or types of knowledge) can be both language-specific *and* allow for successful universal communication or shared reality.
      *   *Licensed Psychology:* Characters fundamentally *experience* space as wind-anchored, knowledge as inherently categorized by its source, or colours as belonging to linguistically defined categories. Thinking outside these categories is difficult or impossible, even silently. (Rare/Discredited for grammar).
  *   **Leaf C: Cognitive Habit (Weak Grammatical Relativity)**
      *   *Most Awkward Commitment:* Distinguishing this from Conceptual Permeability when effects are strong and persistent, yet fall short of true conceptual determinism.
      *   *Licensed Psychology:* Characters have deeply ingrained *habits of attention* (to wind directions, evidence sources) or *memory encoding* shaped by obligatory grammar. They are aware of alternatives (like relative directions) but find their native frame more automatic, salient, or reliable, even silently. Switching languages doesn't erase this habit.
  *   **Leaf D: Thinking for Speaking Plus**
      *   *Most Awkward Commitment:* Explaining the *mechanism* by which recent language use primes non-linguistic cognition beyond the immediate act of speaking.
      *   *Licensed Psychology:* Characters experience a temporary shift in *focus* or *ease of access* to specific concepts (wind directions, evidence types) based on recent language use, influencing even silent thought and non-verbal tasks shortly after. The core habit remains tied to the language.
  *   **Leaf E: Lexical Priming**
      *   *Most Awkward Commitment:* Demonstrating that the ease of lexical access *causes* cognitive differences rather than merely reflecting pre-existing salience.
      *   *Licensed Psychology:* Characters find certain distinctions (e.g., specific shades) easier or more natural to *think about* or *express verbally* due to their lexicon, but non-verbal perception, memory, and categorization are unaffected. They feel the "pull" of readily available words.
  *   **Leaf F: Weak Lexical Relativity**
      *   *Most Awkward Commitment:* Proving that language is the *cause* of the perceptual/cognitive difference, not a reflection of cultural practices or environmental focus influencing both language and cognition.
      *   *Licensed Psychology:* Characters show subtle differences in *speed*, *accuracy*, or *spontaneous grouping* in non-verbal tasks (like colour discrimination or similarity judgments) based on their language's lexical categories. They *perceive* or *remember* distinctions aligned with their words.
  *   **Leaf G: Universalism**
      *   *Most Awkward Commitment:* Explaining the existence and persistence of complex, obligatory linguistic categories that seem to serve no cognitive function beyond communication.
      *   *Licensed Psychology:* You are licensed only to depict the *communicative* effects of language (e.g., frustration finding a word, effort encoding obligatory info). Cognition and perception (spatial reasoning, evidence evaluation, colour perception) are fundamentally independent of linguistic categories. Characters think in universal, pre-linguistic concepts.

  **Empty Combinations:**

  1.  **Obligatory Grammar affects Offline Concepts & Fully Bilingual Transferable (Q1:YES -> Q2:YES -> Q3:YES -> Q4:YES):** *Empty because incoherent.* If concepts are fundamentally shaped by language (Conceptual Permeability), they cannot seamlessly transfer or be modulated by another language; they define the speaker's reality. If they *can* be modulated by recent language (Q4:YES), they aren't truly fundamental concepts.
  2.  **Lexicon affects Online Processing but NOT Offline (Q1:NO -> Q6:YES -> *but then no effect on non-verbal tasks*):** *Empty because unattractive.* If lexical availability shapes ease of expression (Lexical Priming, Q6:YES), it's theoretically plausible this could *only* affect the act of speaking, not non-verbal thought. However, this position offers little explanatory power beyond pure communication and is rarely defended; proponents of lexical effects usually argue for at least weak offline consequences (Leaf F).
  3.  **Universalism with Bilingual Transfer Effects (Q1:NO -> Q6:NO -> Q7:NO -> Q8:YES *but then Q4:YES observed*):** *Empty because nobody has bothered.* Universalism posits no cognitive effects. Observing an effect of recent language use (Q4:YES) would contradict this. While Q4 primarily branches after grammar, a similar effect for lexical concepts (e.g., colour categorization shifting with recent language) would also contradict Universalism. Defenders of Universalism deny such effects exist.

  **Indistinguishable Leaves:** The tree separates all defined leaves based on the specified questions. Leaf D (Thinking for Speaking Plus) and Leaf C (Cognitive Habit) are clearly separated by Q4 (Bilingual Transfer).

  ---

  **Applying the Tree to Kænnavan Features**

  1.  **Feature (i) - Absolute Spatial Frames (No Relative Terms):**
      *   Q1 (Obligatoriness Silent): **YES.** (Grammar compels it constantly).
      *   Q2 (Persistence Non-Linguistic): **YES.** (Recall/reconstruction relies on winds).
      *   Q3 (Conceptual Availability): **NO.** (Child wouldn't spontaneously invent absolute frame for a *novel* object in a *featureless* room without cues).
      *   Q4 (Bilingual Transfer): **NO.** (Disoriented pointing accurate regardless of recent language).
      *   **Landing:** **Leaf C (Cognitive Habit)**. Obligatory grammar trains strong, persistent habits of attention and memory encoding for absolute spatial relationships, even in silence. This habit is stable and not easily modulated by using another language.
      *   **Reality Check Node:** Q3. Does obligatory spatial grammar fundamentally *create* the concept of absolute space (Leaf B), or just train *attention* to it (Leaf C)? Q3 tests if the frame is applied to truly novel, decontextualized situations without environmental cues. If YES, it leans towards B; if NO, towards C. Real-world evidence (e.g., Guugu Yimithirr speakers) strongly supports C over B.

  2.  **Feature (ii) - Obligatory Evidential Marking:**
      *   Q1 (Obligatoriness Silent): **YES.** (Speaker internally encodes source when recalling/considering events).
      *   Q2 (Persistence Non-Linguistic): **YES.** (Evaluation of knowledge reliability inherently considers source, even silently).
      *   Q3 (Conceptual Availability): **PROBABLY NO.** (The *types* of evidence - seen, heard, inferred, reported - are likely universal concepts. The *obligation* to categorize doesn't create new concepts like "inference" itself).
      *   Q4 (Bilingual Transfer): **LIKELY NO / WEAK YES.** (Core habit of attending to source persists regardless of language; *emphasis* might shift slightly with language). Assumed **NO** for strongest effect.
      *   **Landing:** **Leaf C (Cognitive Habit)**. Obligatory grammar trains a powerful, persistent habit of metacognition regarding the source and reliability of knowledge. The *concepts* of different evidence types exist universally, but the *habit* of constantly categorizing information by source is deeply ingrained.
      *   **Reality Check Node:** Q3. Does grammar *create* the conceptual distinction between (e.g.) inference and direct sight (Leaf B), or does it make speakers *habitually attentive* to a distinction they already understand (Leaf C)? Q3 is hard to test perfectly, but evidence suggests C is more plausible for evidentials. The existence of lying, doubt, and the ability to learn languages without evidentials points to pre-existing concepts.
      *   **Answering Your Crux:** **YES.** Landing on Leaf C (Cognitive Habit) for feature (ii) **licenses the scene** where a character, alone and silent, feels the difference between what she saw and what she inferred. The obligatory grammatical marking has trained a strong, automatic habit of metacognition. Recalling a witnessed event inherently carries a different *cognitive feeling* of certainty, immediacy, or "presence" compared to recalling an inferred event, which might feel more provisional, constructed, or reliant on traces, even without the linguistic label. This is a difference in the *quality* or *weight* of the knowledge due to habitual source-tracking, not an inability to *have* the concepts.

  3.  **Feature (iii) - Colour Terms (Blue/Green Combined, Blue-Green/Grey Combined):**
      *   Q1 (Obligatoriness Silent): **NO.** (Colour terms are lexical, not grammatical. No obligation to categorize a colour silently).
      *   Q6 (Lexical Priming/Ease): **YES.** (Easier/more natural to use the broad term).
      *   Q7 (Lexical Conceptual Effect - Non-Verbal Sorting): **PROBABLY NO.** (Assuming real-world evidence for colour: discrimination ability is universal, categorical perception weak at boundaries).
      *   Q8 (Universalism Test - Non-Verbal Discrimination): **YES.** (Performs identically on discrimination tasks).
      *   **Landing:** **Leaf E (Lexical Priming)**. The lexicon makes it easier to express the combined categories, and speakers might habitually *think about* colours using these broad groupings, but non-verbal perception, memory, and discrimination are fundamentally unaffected. They *can* see the differences English speakers label as blue vs. green or blue-green vs. grey.
      *   **Reality Check Node:** Q7/Q8. Does the lexicon *change* how speakers perceive, remember, or group colours non-verbally (Leaf F), or is the effect purely on verbal labelling and the ease of verbal thought (Leaf E)? Q7/Q8 tests non-verbal behaviour. Real-world evidence strongly favours E for basic colour terms (universal focal colours, discrimination abilities), though F might hold for very subtle or culturally specific categories.

  ---

  **Summary & Guarantees:**

  *   **Spatial Frames (i):** You are licensed to depict characters with a deeply ingrained, automatic habit of attending to and recalling space in absolute (wind-based) terms, persisting in silence and largely unaffected by bilingualism. This is a habit of attention, not a fundamentally different concept of space. (Leaf C).
  *   **Evidentials (ii):** You are licensed to depict characters with a deeply ingrained, automatic habit of tracking the source and reliability of their knowledge (seen, heard, inferred, reported). **This absolutely licenses the silent, private feeling of difference** between witnessed and inferred events. It's a difference in the cognitive *weight* or *quality* attached to the memory/knowledge due to habitual source monitoring. (Leaf C).
  *   **Colour Terms (iii):** You are licensed to depict characters finding it easier or more natural to *think about* or *describe* colours using their broad combined terms. However, you are **not licensed** to depict them as unable to perceptually distinguish the shades or as fundamentally grouping them differently in non-verbal thought. The effect is on verbal accessibility and habit, not perception or non-verbal cognition. (Leaf E).

  **Where Guarantees Fade:** The guarantee for the evidentials scene rests on the interpretation landing on Leaf C (Cognitive Habit) being valid. While this is the dominant view for persistent grammatical effects, the *intensity* and *qualitative nature* of the "feeling the difference" internally is inherently subjective. A reader could argue that the real-world evidence only supports effects on memory accuracy or reaction times related to source, not necessarily a distinct *phenomenal feel*. However, within the framework of Leaf C as applied to evidentials in the literature, depicting a character's heightened metacognitive awareness and the associated differing cognitive weight of knowledge based on source during silent recollection is a reasonable and commonly inferred psychological consequence. You avoid the stronger (and discredited) claim that they *can't* conceive of knowledge without source (Leaf B).
