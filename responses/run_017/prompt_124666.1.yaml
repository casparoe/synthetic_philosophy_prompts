prompt: |-
  hey — translation job, not an explainer.

  Background on me so you pitch it right: I'm a probabilistic forecaster. Day job is ensemble and quantile forecasts, I score with CRPS and the log score, I live in PIT histograms and the calibration-vs-sharpness decomposition, hierarchical Bayes updating when I have a prior I trust, backtests against a held-out verification set. I know that vocabulary cold, so don't teach it back to me. I've also done some online learning and expert ensembling — no-regret bounds, multiplicative-weights type aggregation — if that's a better hook than the calibration side.

  Here's the thing I want translated. Someone in the AI safety orbit keeps telling me there's a literature on logical uncertainty, and a construction called logical induction, which is about putting probabilities on claims that are in principle settled by pure reasoning but that nobody can afford to settle — whether a 10,000-variable SAT instace is satisfiable, whether the 10^18th digit of pi is a 7. The pitch as I've got it: you keep a price on every sentence of some theory, you update the prices as you burn more compute, and the adequacy criterion isn't Bayesian coherence but something like no computable trading strategy being able to make unbounded money off your prices, plus a limit result that prices go to 1 on provable sentences and 0 on refutable ones. Tell me if I've garbled that, then do the translation.

  I want the whole setup restated in my vocabulary — the problem itself, what a price on a sentence is, the exploitability criterion, the limit result, and one worked case (use the SAT instance, or build a better one). Then the residue report, which is the part I actually care about: what carried over cleanly, what you had to bend to make it fit and where you're quietly smuggling in an assumption from my side, and what can't be said in the vocabulary of forecasting, scoring and calibration at all.

  Two things pin down for me. One: in my world a probability is licensed by the prospect of resolution against a realisation — there's a data-generating process, a reference class, and an irreducible noise floor you can't forecast below no matter how clever you are. Here there's no DGP; the target is already determined by the axioms. So what licenses these numbers, if anything? Two: my hunch is that this is just my job with the data removed, that a logical inductor is a no-regret ensemble over computable experts and their traders are online-learning adversaries with a dramatic name. Where's that a fair reading and where does it flatten something?

  Last bit: anything the people in this literature are arguing about that my vocabulary structurally can't see, and anything my vocabulary forces me to ask that their setup has no answer to? If my framing is wrong say so, I'd rather be corrected than humoured.
