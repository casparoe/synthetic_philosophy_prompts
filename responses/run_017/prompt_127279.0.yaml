  Constraints:
  - Ordinary life. No desert, no dying. Someone who could plausibly size you up for a living — a pawnbroker, a landlord, a used car dealer, a bail bondsman — and she can be shrewd but not uncanny: no better than about 70% accurate at reading which kind of person you are, and the numbers have to actually work at that accuracy, not at 99%.
  - No external enforcement: no contract, no collateral, no deposit, no repeat business, no reputation, nobody else ever finds out either way. Her read has to track what you would actually later do, not a badge you could wear.
  - The reason self-binding backfires can't be that the disposition is expensive in the rest of your life (that's the move everyone reaches for and its boring). It has to be something about this deal.
  - State the payoffs in the case, in numbers, so the arithmetic is checkable. One paragraph.

  What I think should be doing the work, but do it better if you can: that the disposition it would be good to have is finer-grained than the only disposition you can actually install. Something like — you'd want to be a person who pays what was agreed and not a penny more, but the only way to get yourself to pay at all is to stop tracking what you owe, and once you've stopped tracking you'll pay whatever she asks for at the end, and she can tell. If you go that way, say what the mechanism is and why it can't be fine-tuned, rather than just asserting it.

