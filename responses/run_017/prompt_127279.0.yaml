answer: |-
  ### Case Setup
  You need $100 immediately to avoid a $200 penalty (e.g., a late fee). Alice, a pawnbroker, offers a $100 loan if you promise to repay $150 in a week. There is no enforcement: no contracts, collateral, reputation, or third parties. Alice is 70% accurate at distinguishing "repayers" (who repay) from "non-repayers" (who don’t). If she labels you a non-repayer, she denies the loan, and you incur the $200 penalty. If she labels you a repayer, she lends the $100.  

  **Your options at the initial node:**  
  1. **Do not cultivate:** Remain rational. At repayment, you repay nothing (since repayment is pure loss with no consequences).  
  2. **Cultivate an irrational disposition:** Make yourself believe you always keep promises, so you repay *any amount demanded*, not just $150. Alice can detect this disposition with 70% accuracy. If she lends, she will demand $250 at repayment (knowing you’ll pay).  

  **Payoffs (final net cash relative to baseline):**  
  - No loan: **–$200** (penalty incurred).  
  - Loan + no repayment: **$0** (loan covers penalty, nothing repaid).  
  - Loan + repayment: **–repayment amount**.  

  **Expected payoffs:**  
  - **Do not cultivate:**  
    - Alice denies loan (70% accuracy): –$200.  
    - Alice grants loan (30% error): you repay $0.  
    - *Expected value:* `0.7(–200) + 0.3(0) = –$140`.  
  - **Cultivate disposition:**  
    - Alice denies loan (30% inaccuracy): –$200.  
    - Alice grants loan (70% accuracy): you repay $250.  
    - *Expected value:* `0.3(–200) + 0.7(–250) = –$235`.  

  **Result:** Cultivating (–$235) is worse than not cultivating (–$140).  

  ### Why It Backfires  
  The disposition you can install is coarse: to ensure repayment, you abandon *tracking the debt amount* and become a person who pays *whatever is asked*. Alice exploits this by overcharging ($250). If you could install a fine-grained disposition (pay *only* $150), cultivation might help. But self-binding mechanisms (e.g., emotional commitment, self-deception) often erase precise terms to prevent rational backsliding. Here, the inability to fine-tune leaves you vulnerable to exploitation *within the deal*.  

  ### Decision Theory Breakdown  
  **At initial node (cultivate?):**  
  - **Causal Decision Theory (CDT):** Chooses based on causal impact.  
    - Not cultivating causes –$140; cultivating causes –$235.  
    → **"Don’t cultivate."**  
  - **Evidential Decision Theory (EDT):** Chooses based on conditional evidence.  
    - Conditioning on not cultivating, expected payoff = –$140.  
    - Conditioning on cultivating, expected payoff = –$235.  
    → **"Don’t cultivate."**  
  - **Functional Decision Theory (FDT):** Chooses the best decision function.  
    - Function "don’t cultivate" yields –$140.  
    - Function "cultivate" yields –$235.  
    → **"Don’t cultivate."**  

  **At repayment node:**  
  - **If not cultivated:**  
    - All theories: Repaying causes a loss; not repaying costs $0.  
    → **"Don’t repay."**  
  - **If cultivated:**  
    - No choice; disposition forces repayment of any demand.  

  ### Load-Bearing Feature  
  The **lender’s ability to overcharge** is crucial. If removed (e.g., Alice always demands $150):  
  - Cultivating payoff: `0.3(–200) + 0.7(–150) = –$165`.  
  - Not cultivating payoff: –$140.  
  - Cultivating (–$165) is *still worse* than not (–$140) because the repayment cost ($150) outweighs the benefit of more frequent loans. Only if repayment were ≤$114 would cultivating help—but Alice wouldn’t offer such terms (she needs $150 to offset her risk of non-repayers).  

  ### Wriggling Out: A Proponent’s Counter  
  A proponent might argue: *"Cultivate a disposition that pays only $150, not any amount. Then Alice can’t overcharge, and you gain from higher loan access."*  
  **Why it fails:**  
  - **Psychological infeasibility:** Self-binding often requires broad commitments to resist rational temptation. If you track the exact debt, you might rationalize non-payment ("$150 is unfair, I’ll pay $100"). Coarse dispositions (e.g., "always pay demands") are more robust.  
  - **Alice’s response:** If repayers only pay $150, Alice must set the initial repayment ≥$143 to break even (given 70% accuracy). Cultivating then still costs more (–$165) than not cultivating (–$140) in our numbers.  
  - **No stipulation:** The case doesn’t assume outcomes; it follows from the lender’s profit-maximizing response to your disposition.  

  **Conclusion:** This case shows that self-binding can backfire when the lender exploits your coarse commitment, making rational flexibility optimal. It highlights the risks of strategic irrationality in one-shot interactions with asymmetric power.
