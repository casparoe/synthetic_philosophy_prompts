  - **Prediction for image classifier direction**: Real pattern under design stance. It has high predictive gain (better than alternatives), and it's functional for classification, but lacks specificity for intentionality (not a belief/desire). The probe-dependency doesn't negate reality, as tools (like prompting for LLMs) can access real patterns.

  #### Rule 2: **Cognitive Architecture Rule**
  - **Core idea**: Intentional stance requires a cognitive architecture capable of representations that support inference, decoupling from stimuli, and flexibility. Design stance applies to systems with a design/selection history, allowing functional ascriptions. Real patterns must be projectible (support counterfactuals) and arise from the system's mechanism.
  - **Fits track record**:
