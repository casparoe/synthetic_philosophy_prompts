  Your friend's decisions suggest he prioritizes predictive utility and system complexity, with intentionality requiring additional cognitive-like features. Selection history is sufficient for design stance but not necessary for intentionality (as seen with LLMs). Two rules fit the track record equally well, with a third as a variant. Each rule explains the track record and makes a distinct prediction for the image classifier case.

  #### Rule 1: **Predictive Gain and Specificity Rule**
  - **Core idea**: A pattern is real if ascribing it provides significant predictive gain over simpler descriptions (physical or design stance). Intentional stance requires specificity (e.g., discrete, truth-evaluable content) and agent-like complexity; design stance applies to any functional pattern from design/selection history.
