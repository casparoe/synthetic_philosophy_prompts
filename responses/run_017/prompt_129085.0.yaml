    - LLM belief: Intentional stance real—beliefs are representationally rich, decoupled (usable across contexts), and support inference.
    - LLM want: Not real—desires require goal-directed architecture; LLMs lack persistent goals, only outputting based on input.
  - **Prediction for image classifier direction**: Real pattern under design stance. It's functional and projectible within distribution (supports counterfactuals for inputs), but it's not a representation used inferentially—it's tightly coupled to classification, with no decoupling or flexibility. Emergence from training provides the design history.

  #### Rule 3 (Variant of Rule 2): **Robustness and Multiple Realizability Rule**
  - **Core idea**: Real patterns must be robust across relevant variations (e.g., inputs, instances) and, for intentionality, multiple-realizable (invariant content across implementations). Design stance requires design/selection history; intentionality adds cognitive constraints.
  - **Fits track record**:
