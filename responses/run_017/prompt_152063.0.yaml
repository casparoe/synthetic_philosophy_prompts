prompt: |-
  I've got a 50-minute section next week on the semantics/pragmatics of slurs, for first-years who've done truth-conditions and reference but no pragmatics. I want a plan, not the explanation. What has to be in place before the usual embedding test — does the derogation survive negation, conditionals, attitude reports — even makes sense to them, and in what order should I bring in the two accounts (the one that puts the derogation in truth-conditional content, the one that puts it in what using the word does) so neither sounds obviously correct on arrival? I also want them to see early that both sides can agree the word does harm and still disagree about where the harm lives.

  Then the example. I'm tempted to build the whole hour on one slur/neutral-term pair that also has an in-group reclamation, so reclamation rides on the same example later instead of arriving as a new case. Tell me what such an example has to have and, more usefully, lack: not so taboo that half the room goes quiet, and the neutral counterpart had better not be one some students already hear as a slur.

  Misconceptions I expect: 'same referent so same meaning', 'it's just speaker intent', 'if it's not truth-conditional it's not really in the meaning' (they'll hear that as excusing the word), and collapsing offensive-but-not-derogatory with derogatory-but-not-taboo. Where does each get defused, and is there one I should let them sit with for a few minutes so the fix actually lands? I want one board question at the end — a construction they haven't seen where the two accounts diverge — and I want you to say what I should openly refuse to settle at this level (no expressivist machinery, no formalism).

  Be straight about which parts are settled among people who work on this and which are live disputes; don't let me present my side as the consensus by accident. Lead with the bottom line, the one ordering decision everything else hangs on, in the first sentence, no preamble.
reasoning: |-
  Okay, the user is prepping a 50-minute lecture for first-year students on the semantics and pragmatics of slurs. They've covered truth conditions and reference but not pragmatics yet. The main challenge is structuring the session so that the embedding test makes sense, presenting two accounts without bias, and using a safe example that also allows discussion of reclamation.

  First, the key decision: order of accounts. Presenting the truth-conditional account first is crucial because it's more intuitive for students new to pragmatics. They're familiar with truth conditions, so starting there makes the transition smoother. Then introduce the pragmatic account to show how meaning can exist beyond truth conditions.

  Next, the example selection. Need a term that's not too taboo to avoid discomfort, but has clear neutral and reclaimed versions. "Queer" comes to mind—neutral term "LGBTQ+", reclaimed by the community. But must caution that some may still find it offensive, and to use reclaimed only in later discussion to avoid confusion.

  For misconceptions, address "same referent, same meaning" early by comparing neutral and slur terms. Show that despite same reference, impact differs. "Speaker intent" misconception can be tackled when discussing the pragmatic account, emphasizing that the harm is conventional, not just about intent. The idea that non-truth-conditional meaning isn't real meaning needs a clear distinction between semantics and pragmatics, stressing that social harm persists regardless.

  The embedding test comes after both accounts are introduced. Students need to understand truth conditions and pragmatic effects first. Use examples under negation and conditionals to show how each account predicts different results. Then pose a board question with attitude reports to highlight the divergence.

  Openly refuse to delve into expressivism or formalisms. Acknowledge live disputes, like the nature of the expressive content or reclamation mechanics, without taking sides. End with the unresolved embedding test results to emphasize ongoing debate.

  Timing is tight. Allocate specific minutes: intro (5), truth-conditional account (10), pragmatic account (10), embedding test (10), reclamation (5), misconceptions (5), wrap-up (5). Use "queer" example throughout but switch to placeholder "S-term" when needed. Stress harm consensus early to separate moral agreement from theoretical disagreement.

  Make sure students see that both sides acknowledge harm but locate it differently. Defuse misconceptions at relevant points, letting the "non-truth-conditional isn't real meaning" sit longer during pragmatic discussion. Board question on attitude reports to challenge them to apply both accounts.
answer: |-
  Here's the core plan, structured around your non-negotiable: **Lead with the truth-conditional account first because it builds directly on their existing knowledge (reference, truth-conditions) and makes the embedding test comprehensible, before introducing the pragmatic challenge.** This order prevents the pragmatic view from seeming like an "easy out" initially.

  **Timeline & Key Elements:**

  1.  **Set-Up & Consensus Foundation (5 min):**
      *   **Define:** Clearly define "slur" (pejorative term targeting group membership) vs. "neutral counterpart" (denotatively equivalent term lacking inherent derogation). Stress: *Both sides agree slurs cause significant harm.*
      *   **Core Question:** "Where does the derogatory *meaning* live? Is it part of the word's truth-conditional content (what it says about the world), or is it something *else* that using the word *does*?"
      *   **Immediate Misconception Address:** Crush "same referent, same meaning" *now*. Use a stark example: "The building is tall" vs. "That building is a monstrous eyesore" (same reference, different meaning/impact). Apply to slur/neutral pair: same group reference, *wildly* different impact. Harm ≠ just reference.

  2.  **Truth-Conditional (TC) Account (10 min):**
      *   **Premise:** The derogation is part of the literal, truth-conditional meaning.
      *   **How it Works:** "S-term for G" means something like *G & is despicable because G*. Derogation contributes to truth conditions.
      *   **Why it might seem right:** Fits their existing semantic toolkit. Explains the *immediacy* and *seeming inseparability* of the offense. If "S-term" *means* "despicable G", denying it ("He's not an S-term!") seems like denying the despicability.
      *   **Planting Doubt:** "If this is true, what happens when we put the slur inside complex sentences like negations or conditionals? Does the despicability claim survive?" (Tease the embedding test, but don't do it yet).

  3.  **Pragmatic/Expressivist (PE) Account (10 min):**
      *   **Premise:** The derogation isn't part of truth-conditional content. The neutral counterpart and the slur share the *same* truth-conditional content (reference to group G). The slur *conventionally* expresses the speaker's contempt *towards G* or prescribes such an attitude.
      *   **How it Works:** Using the word performs an act of derogation, like an insult. It's "meaning" in a broader sense (conventional implicature, expressive content, performative force), not truth-conditions.
      *   **Why it might seem right:** Explains how the word *does* harm even if the speaker doesn't *assert* the target is despicable (e.g., casual use, greetings). Separates *what is said* from *what is done*.
      *   **Addressing Misconceptions:**
          *   **"It's just speaker intent":** NO. Stress it's *conventional* – the word carries this force by social agreement, regardless of momentary intent. Using it *is* the act, even if unintended.
          *   **"Non-TC meaning isn't real/excuses":** Emphasize *this is the core dispute*. PE absolutely says the harm is real and inherent to the word's *conventional use*, it just locates it differently. Harm doesn't vanish because it's not truth-conditional! **Let this misconception sit & be defused thoroughly here.** Ask: "Does calling something an insult 'just' pragmatics make the insult less real?"

  4.  **The Embedding Test & Divergence (15 min):**
      *   **Why Now?** Students now understand both accounts' core claims about meaning *and* have the basic idea of complex sentences. They can see *why* the test matters.
      *   **The Test:** Does the derogatory effect survive in:
          *   Negation: "Sam is **not** an S-term." (TC: Denies despicability? PE: Still expresses contempt?)
          *   Conditionals: "If Sam is an S-term, he shouldn't be hired." (TC: Asserts despicability in antecedent? PE: Contempt expressed only if antecedent true?)
          *   Attitude Reports: "Alex believes Pat is an S-term." (TC: Alex believes Pat despicable? PE: Speaker expresses contempt *attributing* a belief?)
      *   **Divergence:** Walk through predictions for each account for each construction. TC often predicts derogation "projects" out (survives embedding), PE often predicts it doesn't, or behaves differently. **Highlight:** This is a major empirical battleground. Results are messy and debated! Neither account perfectly predicts all data.
      *   **Board Question (Key Construction for Divergence):** **Attitude Reports.** "What does each account predict about *who* is expressing contempt in 'Maria said that Lee is an S-term'?" (TC: Maria believes Lee despicable. PE: *Speaker* expresses contempt *by reporting* Maria used the slur, Maria *might* also hold contempt).

  5.  **Reclamation & Nuance via Example (5 min):**
      *   **Example Criteria:** Use one pair throughout. **Ideal Candidate: "Queer" (Slur/Reclaimed) vs. "LGBTQ+" (Neutral Counterpart).**
          *   *Has:* Clear historical slur, strong modern reclamation (especially in academia/activism), widely recognized neutral counterpart ("LGBTQ+"), demonstrates harm and reclamation on the same term.
          *   *Lacks:* Extreme current taboo for many (though caution needed!), "LGBTQ+" isn't generally heard as a slur itself (unlike, say, "colored" which is problematic for many). **CRUCIAL:** Introduce reclaimed use ONLY here, after establishing its history as a slur. Stress reclamation is complex, contested, and in-group specific.
      *   **Point:** Both TC and PE accounts struggle with reclamation! TC: Does "queer" now mean "LGBTQ+ & awesome"? PE: Does using it *do* solidarity instead of contempt? Shows meaning/use is dynamic.

  6.  **Wrap-Up, Live Issues & Boundaries (5 min):**
      *   **Consensus:** Slurs cause harm. Reference alone doesn't explain derogation. Embedding behavior is crucial data.
      *   **Live Disputes:** *Where* the derogation lives (TC vs. PE)! The precise nature of the expressive content (implicature? force? conventional?); how reclamation works; how to best model the embedding data (neither account is universally accepted as settled!).
      *   **What We Openly Refuse to Settle:**
          *   Detailed expressivist/performative formalism.
          *   Specific semantic frameworks beyond core TC vs. PE distinction.
          *   Resolving the embedding debate conclusively.
          *   Comprehensive account of reclamation mechanics.
      *   **Final Thought:** "Both accounts agree the word is harmful. The fight is about *how language works* to create that harm. Does the word itself *say* you're despicable, or does using it *show* contempt? This matters for understanding meaning, responsibility, and potentially, how to counter harm."

  **Misconception Defusal Map:**

  *   **'Same referent so same meaning':** Crushed immediately in Step 1 with non-slur examples.
  *   **'It's just speaker intent':** Defused explicitly during the PE account explanation (Step 3) – stress conventionality.
  *   **'If it's not truth-conditional it's not really in the meaning / excuses the word':** Major defusal in Step 3 (PE account). Let it land. Reiterate: PE argues the harm is *real and conventional*, just located differently. Harm isn't excused by being pragmatic!
  *   **Collapsing offensive-but-not-derogatory with derogatory-but-not-taboo:** Briefly clarify during definitions (Step 1) – "offensive" is broad (could be rude, taboo); "derogatory" implies specific belittling/devaluation inherent to the term's meaning/use wrt group membership. Use your chosen example ("queer" vs. maybe a profanity) to illustrate the difference.

  **Example Execution Note:** Consistently use your chosen slur/neutral pair (e.g., "queer"/"LGBTQ+"). When discussing embedding tests or sensitive points, consider using a placeholder "S-term" while verbally referencing your example, to reduce discomfort while maintaining the conceptual link. Explicitly state this strategy: "For clarity on the board, I'll use 'S-term', but remember we're discussing terms like 'queer' in its historical derogatory use." Switch back to the specific term when discussing reclamation. Start with a content warning and establish a respectful classroom environment.
