answer: |-
  The Myerson-Satterthwaite theorem applies to single-shot exchanges with strict private valuations, but moral trade thrives in iterative, relational contexts where mechanisms adapt. Reputation and repeated interaction create natural incentives for honest revelation over time, even without transfers, as defection destroys future cooperative surplus. We can design adaptive protocols—like gradual reciprocal concessions or verified cost-sharing for jointly observable efforts—that sidestep the impossibility theorem by leveraging ongoing interaction and partial verifiability of *effort* (even if not underlying value). The headline gains aren’t illusory; they’re captured through dynamic, self-correcting arrangements.

  ---

  Enforcement handles compliance, but Myerson-Satterthwaite shows we can't price the trade efficiently when both sides hide their true costs and values. Your iterative mechanisms still rely on honest reporting—why wouldn't I *still* exaggerate my costs early on to extract better terms later?
