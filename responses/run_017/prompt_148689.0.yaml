prompt: |-
  I work in insurance claims, have no academic background in philosophy, and about a year ago got into an argument with my brother-in-law about whether it is ever fine to stay quiet when someone has made a mistake in your favour. He lent me Kant's short book on the foundations of ethics — the one with the four examples about a promise you never intend to keep, ending your own life to escape misery, letting your talents sit unused, and never helping anyone — and since then three of us have been meeting monthly to run ordinary decisions through his test. What I want is not a summary of Kant but a diagnosis of my own verdicts: I have been keeping a list of them, they feel consistent to me, and I cannot state the principle they answer to. My working rule is that a maxim fails if, once everyone acted on it, the thing the maxim is a way of doing could no longer be done — promising dies if everyone breaks promises, and so on. Some of my verdicts fit that rule and some do not, and I would like to know which ones have to go, and whether the rule can be repaired rather than replaced.

  Here are the verdicts, given as I wrote them down. Promising to repay a friend with no intention of repaying: fails, cleanly. Inflating my income on a loan application: fails, same shape. Telling a woman at a car-boot sale that the painting she is pricing at twenty pounds is a worthless print, when I am fairly sure it is the real thing, so I can buy it cheap: fails. Standing silent while that same seller, entirely unprompted, prices it at twenty pounds, with the same knowledge and the same outcome: fine, or at least very much less bad — and I cannot say why, since in both cases she acts on a false belief and I get a bargain. Leaving an enthusiastic review for a friend's café when my meal was only mediocre: fine, even kind; yet if everyone did it, reviews would stop doing their job, which by my rule should sink it. Telling my sister her poem is good when I think it is mediocre: fine — structurally the same as the café case, a false statement made for the hearer's benefit, except that it does not lean on any institution. Undercutting a rival's quote to win a contract: fine, even though if everyone undercut, nobody would win by undercutting, which makes me suspect my rule conflates "everyone doing this destroys the practice" with "everyone doing this destroys the point of my doing it." Never helping anyone while being perfectly willing to be helped if things go badly: fails, but not in the way the promise case fails — the world it describes is perfectly possible, I simply cannot will being in it while expecting help. Never developing any of my abilities and coasting through a job I could do well: I want to say fails, but shakily, and I cannot locate the collapse. Going through my partner's phone while she is in the shower: clearly wrong — and yet universalising snooping does not seem to break anything, so my rule is silent exactly where I am most confident. Leaving my phone on during a film: universalising makes the cinema miserable, so my rule says it fails, but that is bad manners and not immorality, and if the rule cannot tell the difference I do not trust it. The case I keep going back and forth on: booking two tables at a restaurant on a busy Saturday and not cancelling the one I do not use. It feels wrong, but the practice of booking does not vanish — restaurants would add deposits or penalties — so everything depends on whether "booking without a penalty" is the thing I am supposed to check for. I have also noticed that I can sink almost any maxim by describing it broadly and rescue almost any maxim by describing it narrowly, which makes me wonder whether the test is really a test of how honestly I describe what I am doing.

  So: is there one principle, or a small set of candidates, that delivers these verdicts — stated precisely enough that I can see which clause is doing the work in which case, and including whatever filter distinguishes matters of morality from matters of etiquette, and whatever fixes the level of description at which a maxim is to be stated? Tell me honestly which of my verdicts it cannot accommodate and which you would overturn, and whether the cost of the principle is that I have to give up the intuition I am most attached to. Then tell me what it predicts about two cases I have not decided: claiming a tax deduction for a home office I use twice a year, and using an automated bot to buy four tickets to a concert and reselling two of them above face value. And one last worry I would like addressed directly: when I ask "what if everybody did that?", am I really doing something Kantian at all, or have I quietly become a rule-utilitarian estimating consequences while using his vocabulary?
reasoning: |-
  Okay, I need to help this user who's deeply engaged with Kantian ethics but struggling with consistency in applying the categorical imperative. They work in insurance claims, have no philosophy background, but have been diligently testing real-life decisions through Kant's framework with their brother-in-law. 

  The core issue is their "working rule" - that a maxim fails if universalizing it makes the action impossible. They've noticed it works for clear cases like false promises but breaks down elsewhere: their verdicts on white lies, undercutting competitors, and phone snooping don't fit neatly. They're especially troubled by description-level problems (broad vs narrow maxims) and distinguishing morality from etiquette.

  Hmm... their examples reveal sophisticated practical engagement. The painting resale case shows particular nuance - they intuitively sense a moral difference between active deception and passive acceptance of error, but can't articulate why within Kant's system. That's where I should focus.

  I recall Kant distinguishes between "contradiction in conception" (action becomes impossible) and "contradiction in will" (world becomes unbearable). Their rule only captures the first. The snooping example fails precisely because they're missing this second test - universal voyeurism creates a world nobody could rationally choose to live in.

  For the description problem, Kant's Formula of Universal Law requires maxims to include both means and ends. "Booking tables without penalties" is too narrow; it should be "making reservations I may not honor to secure options at others' expense." That changes everything.

  Their tax deduction and ticket scalping cases are perfect test scenarios. The first involves self-deception about "occasional use," the second exploits systems for profit. Both would likely fail under proper formulation - especially scalping, which treats concertgoers as mere means.

  Ah, and their final worry about rule-utilitarianism is astute! Kant isn't about consequences but about logical consistency and respect for persons. When they ask "what if everybody did that?" they must focus on whether the maxim could be universal law without contradiction, not whether outcomes would be desirable.

  I'll need to gently correct some verdicts. Their "fine" rating for inflated reviews actually fails the publicity standard - if everyone knew reviews were inflated, the practice would collapse. But their instinct about helping the sister's feelings might survive as an imperfect duty if framed as "giving encouragement to loved ones when their efforts disappoint them."

  The cinema case is simpler: Kant cares about the maxim's universalizability, not severity. Distinguishing manners from morality requires additional criteria like rights-violations, which their current approach lacks.

  Most importantly, they should keep their insight about passive vs active deception in the painting case - that aligns perfectly with Kant's distinction between negative and positive duties. Their intuition there is sounder than their rule!
answer: |-
  Your struggle is profoundly Kantian—you've hit the exact tensions that make his ethics demanding. Your "working rule" captures *one half* of Kant's test (the **Contradiction in Conception Test**), but misses the **Contradiction in the Will Test** and the critical importance of **maxim formulation**. Here's a diagnosis using a refined principle, followed by verdict adjustments and new case rulings.

  ---

  ### **The Refined Kantian Principle**
  A maxim is morally permissible only if:
  1.  **Universalizable Without Contradiction:**  
      - **Type 1 (Contradiction in Conception):** Everyone acting on the maxim *logically* destroys the practice or makes the action impossible (e.g., false promises).  
      - **Type 2 (Contradiction in the Will):** You *cannot rationally will* a world where everyone acts on the maxim, even if it’s logically possible (e.g., refusing all help).  
  2.  **Respect for Persons:** The maxim must not treat others *merely as a means* to your end.  
  3.  **Appropriate Specificity:** The maxim must include your *true purpose* and *context*, avoiding gerrymandering.  
  4.  **Moral vs. Etiquette Filter:** Only maxims violating **duties to others** (justice, honesty) or **duties to self** (self-development) are *immoral*—not mere social inconvenience.  

  ---

  ### **Re-Evaluating Your Verdicts**
  | Your Case                          | Your Verdict | Refined Kantian Verdict | Why                                                                                                |
  |------------------------------------|--------------|-------------------------|----------------------------------------------------------------------------------------------------|
  | False promise to repay friend      | Fails ✓      | **Fails (Type 1)**      | Universal lying destroys trust needed for promises.                                                |
  | Inflating loan application         | Fails ✓      | **Fails (Type 1)**      | Universal fraud destroys lending institutions.                                                     |
  | **Telling seller painting is fake**| Fails ✓      | **Fails (Type 1 + Means)** | Universal deception destroys honest commerce. *Actively lying* treats her as a means.              |
  | **Staying silent about real painting** | Fine ✗     | **Fails (Type 2 + Means)** | Maxim: *"Profit from others' ignorance when they’d act differently if informed."* You *cannot will* a world where everyone exploits ignorance—you’d fear being exploited. Silence exploits her as a means. |
  | **Leaving false café review**      | Fine ✗       | **Fails (Type 1)**      | Maxim: *"Give inflated reviews to help friends, disregarding truth."* Universalizing destroys review reliability (Type 1). |
  | **Telling sister poem is good**    | Fine ✗       | **Permissible ✓**       | Maxim: *"Offer encouragement to loved ones to support their efforts."* This *can* be universalized without destroying truth-telling (context matters). Does not treat her as *merely* a means. |
  | Undercutting rival’s quote         | Fine ✓       | **Permissible ✓**       | Maxim: *"Compete for contracts by offering better value."* Competition survives universalization. Not inherently deceptive. |
  | Never helping but accepting help   | Fails ✓      | **Fails (Type 2)**      | You cannot rationally will a world where no one helps anyone (you might need help).                |
  | Coasting in job, not using talents | Fails (shaky)| **Fails (Duty to Self)**| Maxim: *"Neglect my abilities to avoid effort."* Violates duty to develop oneself as an end.       |
  | Snooping on partner’s phone        | Fails ✓      | **Fails (Means)**       | *Not* a contradiction test failure—but treats partner as a means (spying violates autonomy).       |
  | Leaving phone on in cinema         | Fails ✗      | **Permissible**         | Maxim: *"Ignore minor rules if inconvenient."* Universal distraction *is* possible, but this is **etiquette**, not morality. Kant focuses on duties, not manners. |
  | **Double-booking restaurant**      | Unsure       | **Fails (Type 1)**      | Maxim: *"Make reservations I may cancel to hedge against uncertainty, wasting others' resources."* Universalizing overwhelms booking systems, forcing penalties (Type 1). |

  **Key Shifts:**  
  - **Silence ≠ Innocence:** Passive deception still exploits ignorance (fails Type 2/Means tests).  
  - **White Lies:** False praise *for institutions* (reviews) fails (Type 1); *for personal encouragement* may pass if honest in intent.  
  - **Snooping:** Wrong due to *disrespect*, not contradiction.  
  - **Etiquette:** Kant distinguishes moral duties from social conventions—phone in cinema is rude but not *immoral*.  

  ---

  ### **Fixing the Description Problem**
  Kant requires maxims to reflect your **actual intention**.  
  - **Bad maxim (gerrymandered):** *"Book tables without penalties."*  
  - **Honest maxim:** *"Book backup options I may waste, denying others chances."*  
  Your intuition is right: the test exposes self-deception. Universalizing the *honest* maxim fails.

  ---

  ### **New Case Predictions**
  1. **Claiming tax deduction for seldom-used home office:**  
     - **Maxim:** *"Claim deductions for personal/ambiguous expenses to reduce taxes."*  
     - **Verdict: Fails (Type 1).** Universal tax fraud collapses public trust and revenue systems.  

  2. **Using bots to buy/resell concert tickets above face value:**  
     - **Maxim:** *"Exploit technology to hoard scarce goods for profit, bypassing fair access."*  
     - **Verdict: Fails (Type 1 + Means).** Universal bot-use makes ticket-buying impossible for ordinary fans. Treats fans as mere profit sources.  

  ---

  ### **Your Final Worry: Kantian or Rule-Utilitarian?**
  You are **still Kantian**. Rule-utilitarians ask: *"Would universalizing this rule create the best consequences?"* Kant asks: *"Can this maxim be universalized without contradiction or self-betrayal?"*  
  - **You focus on logical/motivational consistency,** not optimal outcomes. E.g., "coasting" fails not because society suffers, but because you betray your own potential.  
  - **Consequences matter indirectly:** If universalizing *logically* destroys a practice (promises, reviews) or *practically* destroys what you need (help), it fails—but the *reason* is duty, not utility.  

  ---

  ### **Cost of the Principle**
  You must surrender **two intuitions**:  
  1. **"Passive deception is harmless."** Silence exploiting ignorance fails (painting case).  
  2. **"All white lies are kind."** Institutional lies (reviews) fail; personal encouragement may pass if respectful.  

  **What you keep:** Your nuanced grasp of maxim specificity and distrust of rule-utilitarian consequences.  

  This is rigorous, messy, and deeply Kantian—your monthly meetings are doing philosophy right. If your verdicts now feel *less* consistent, it’s because Kant demands we confront our self-exceptions.
