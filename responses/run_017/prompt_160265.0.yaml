  Now, applying this to *Metropolis*. The visual contrast between the workers' dehumanized, synchronized movements and the planners in the tower is a direct representation of Marx's alienation. The workers are reduced to mere limbs of the machine, while the brain (management) is separated. This imagery is strongly Marxian. 

  The riot scene where workers destroy machines mirrors historical Luddism. Marx opposed machine-breaking because it misdirects anger towards the machines instead of the capitalist system. The film's portrayal here is ambiguous. While it shows the workers' frustration, it might inadvertently validate Marx's point that smashing machines isn't the solution. However, the film doesn't explicitly critique the riot; it's more about chaos leading to their own peril. 

