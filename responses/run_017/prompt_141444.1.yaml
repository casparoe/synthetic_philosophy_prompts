answer: |-
  ## The Recurrent Somatic Trait: Why Lancet Cells Lack Proper Function

  The dispute between etiological (selected-effects) and causal-role (systemic-capacity) accounts of function hinges on the *explanatory work* function attributions perform. Proper function attributions earn their keep by identifying *why a trait exists and persists* in a system. They answer teleological questions: "Why is this *type* of thing here?" The etiological account answers this by pointing to a history of selection *for* the effect, explaining the trait's presence and maintenance. The causal-role account, in contrast, answers "What does this *token* thing currently contribute?" It describes the trait's role within a currently operating system. The recurrent somatic trait case starkly reveals that these are distinct jobs, and only the etiological account fulfills the core explanatory purpose of functional explanation.

  Lancet cells undeniably contribute significantly to colony fitness. Their toxin-firing raises fitness substantially. A causal-role theorist readily attributes the function "defend the colony from competitors" to lancet cells. However, this attribution *explains nothing* about why lancet cells exist or recur in the colony. Their recurrence is entirely explained by the stabilising selection acting *on the heritable fragile site*. This site persists because it reliably causes the *de novo* somatic mutation generating lancet cells. Crucially, no lancet cell token causes the production of another lancet cell token; no lineage of lancet cells is subject to intergenerational selection; and there is no variation *in the lancet cell trait itself* for selection to act upon within the population. The trait "lancet cell" appears recurrently solely as a downstream consequence of selection acting on the fragile site's *production mechanism*. Therefore, withholding the proper function "colony defence" from lancet cells is not a counterintuitive flaw of the etiological account, but a direct consequence of its explanatory remit: there is no history of selection *for* the lancet cell's defensive effect that explains its presence. The trait persists because selection favoured something else (the fragile site) that reliably causes it.

  What category *do* lancet cells fall into? They are highly reliable, fitness-enhancing *somatic products*. They possess a systemic capacity of immense benefit. Acknowledging this is not a concession to the causal-role theorist; it is merely accurate description. The crucial distinction is that labeling them as having a *proper function* smuggles in an explanatory claim about their persistence and normativity that is unwarranted by their genesis. Calling them "functional" in a descriptive, causal-role sense ("they perform the activity of colony defence") is acceptable shorthand for their current contribution, but it lacks the explanatory depth and normative force of a proper function ascription. The etiological account distinguishes this descriptive "activity function" from the explanatory "proper function," whereas the causal-role account conflates them. Denying lancet cells a proper function preserves this critical distinction; granting them one based solely on contribution erases it, collapsing the answer to "why is it here?" into "what does it do now?"

  **Handling the Escape Hatch: Derivative Functions?**

  The standard etiological escape hatch – allowing an item to "borrow" its function from the mechanism that produces it – seems tempting. The fragile site clearly has the selected function: *producing lancet cells*. Doesn't this imply lancet cells have the "derived" function of *performing colony defence*? This move must be resisted here, as its application would be inconsistent and undermine the account's coherence.

  The function of the fragile site is *production*: its selected effect is causing the existence of lancet cells. Assigning the *activity* of colony defence (the effect of the produced item) as the "derived function" of the lancet cell itself conflates two distinct things: the *function of producing X* and *X's own function*. The heart *pumps blood*; the developmental program *produces hearts*. If we assign the derived function "pump blood" to a heart based solely on the selection history of the developmental program that produced it, we haven't actually bypassed the need for the heart's *own* history. We are simply relying on the fact that hearts *also* have a history of selection for pumping. In the lancet cell case, there is no such parallel history. Applying the derivation move here would force us to assign proper functions to any reliably produced, beneficial byproduct. Consider oxygen generated as a byproduct of photosynthesis. The photosynthetic machinery may have the selected function of producing sugars (and reliably produces oxygen as a consequence), but we do not say oxygen has the derived proper function of supporting respiration. To do so would absurdly grant proper functional status to countless incidental products. The derivation move only plausibly works when the *produced item itself* has an independent selection history *for its effect*. Lacking this, applying it to lancet cells is ad hoc and proves far too much, collapsing the distinction between selected effects and beneficial consequences.

  **Surviving the Normativity Objection**

  The objection is potent: if lancet cells have no proper function, then a lancet cell that fails to fire its harpoon, or fires it at the host colony, is not malfunctioning – merely unfortunate. This seems counterintuitive given its crucial beneficial role. However, this intuition conflates harm with malfunction. Normativity in the etiological sense requires a historical standard: a trait malfunctions when it fails to perform the specific activity for which its type was selected. A lancet cell token has no such history. Its failure is indeed harmful, potentially catastrophic for the colony, but it is not *defective* in the teleological sense. There is no historical norm it fails to meet because no selection ever acted *on lancet cell performance*. Selection acted only on the fragile site's reliability in *generating cells of this somatic type*. The fragility site *can* malfunction: if a mutation renders it unable to produce lancet cells, it fails its selected function. *That* malfunction could result in the production of non-firing lancet cells (or none at all). *Those* non-firing cells would be the *products* of a malfunctioning producer, but they themselves do not malfunction; they are simply the harmful outputs of a defective process. They lack the history necessary to bear a function and thus a standard for their own performance. The normativity objection highlights the cost of etiological purity, but it does not refute it. It underscores that the intuition of defectiveness often relies implicitly on the history of the *producing system*, not the product itself. The position survives by maintaining that normativity is inextricably tied to selection history, not current contribution or harmfulness.

  **The Causal-Role Rebuttal and Reply**

  The causal-role theorist's strongest reply, as anticipated, is that functional attributions in working biology primarily describe a component's current contribution to a system's capacities. The field biologist observing the lancet cell's defensive action *is* correctly identifying its function within the colony's current economy, irrespective of its peculiar origin story. Denying this ignores biological practice.

  This reply powerfully captures the utility of causal-role descriptions. However, it misdiagnoses the underlying justification for the field biologist's confidence. When she states "the function is colony defence," she implicitly relies on the *assumption* of an evolutionary history that explains *why* such an effective mechanism exists and is maintained. In standard cases, this assumption is warranted. In this highly unusual case, that assumption – that the lancet cell trait *itself* has been selected for its defensive effect – is false. If the biologist understood the full origin story (somatic, non-heritable, no variation for selection on the trait itself), she would likely hesitate to attribute a *proper* function, recognizing the trait as a remarkable somatic *product* of a selected developmental quirk, rather than an evolved adaptation in its own right. She might still say "it functions to defend the colony," but this would be a descriptive statement of its current causal role, lacking the deeper explanatory and normative connotations of a proper function attribution. The etiological verdict doesn't misread the biologist; it provides the conceptual framework to understand *why* her functional language feels slightly strained or requires qualification once the full etiological story is known. It distinguishes the robust, historically grounded "proper function" from the useful but shallower "causal role function."

  **Coda: A Vulnerable Premise**

  The premise I find most vulnerable is the claim that the systemic benefit of lancet cells carries *no inherent normativity* for the tokens themselves, reducing malfunction to mere harmfulness. While coherent within the etiological framework, this clashes strongly with the powerful intuition that a specialized, reliably produced structure performing a vital task *must* have some standard of proper performance. If empirical biology routinely treats analogous somatic products (e.g., highly specific, somatically generated immune receptors *prior* to clonal selection within the organism, or perhaps complex somatic structures in long-lived modular organisms) as bearing normative functions – readily calling them "defective" or "malfunctioning" when they fail – *despite* the lack of intergenerational selection history for the trait type, this would seriously challenge the etiological account's ability to capture biological practice. Observing such normative language applied consistently to purely somatic, non-heritable traits would suggest that current systemic integration, not past selection, is the true ground of biological normativity.
