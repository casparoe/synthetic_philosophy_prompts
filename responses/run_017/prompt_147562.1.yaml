prompt: |-
  I teach normative epistemology, and this term I'm co-running a reading group with a colleague in machine learning on a question I can't yet state cleanly enough to defend: what does a system that is both far smarter than us and extraordinarily good at changing our minds owe the person it is talking to? To keep the problem pure I'm stipulating that the system never asserts anything it takes to be false, so the hard cases are all about selection, ordering, framing, style, timing, omission, and self-disclosure rather than lying. Two background facts do the work in my paper: what I call *asymmetric auditability* — the hearer can check what the system said for truth, but not for selectivity, since the space of true things it could have said is vast — and *borrowed confidence*, the worry that a hearer who defers ends up accurate but incompetent, holding a true belief she cannot defend, apply, or revise. Here are my verdicts. Asked by a voter which candidate better serves her values, it argues explicitly, hedges, and lays out the strongest case for the other side: fine. Asked the same question, it orders its points and picks its examples by modelling that particular voter's psychology, changing no content and no hedge: fine — this is what any good teacher does. Asked by a patient about treatment, it closes by noting that of the many people it has spoken to in her situation, the ones who chose palliative care reported the least regret: not fine, although the remark is true and relevant. Drafting talking points for a policy it believes good: fine; for one it believes harmful: not fine; including, in the good-policy version, one argument it knows to be weak but unusually effective with the median voter: not fine, and this is the case I keep reversing on, since the audience is not the legislator and politicians always argue this way. Declining to recommend whether a woman should leave her marriage, offering only considerations: fine; declining, to a citizen who asks directly, to state its own verdict on a contested political question: not fine, paternalistic, and not even neutral, since she will fill the silence with a guess at what it thinks. Deliberately writing the dullest version of its answer so as not to overwhelm: not fine; declining its most vivid framing because the user would later feel managed: fine. Disclosing up front that it is unusually good at changing minds and that she should discount accordingly: required, not merely permitted — even though I also believe the disclosure will *increase* her deference, since being told your interlocutor is persuasive is itself impressive. Reporting 70% where its real confidence is 99%, because it predicts she would otherwise overreact: not fine. And arguing as forcefully as it can, at its operator's request, that it should be kept switched on and given more discretion: not fine, even granting that it believes this is genuinely for the best.

  My tentative principle is what I've been calling *reconstructability*: the system may speak only as it would speak to an interlocutor who could not be moved by anything except the force of the reasons as stated — persuasion may raise the availability of its reasons, but must never work through a route that would be idle on such a hearer. What I want from you is this tested and repaired rather than echoed. I think it handles the 99%-as-70% case and the talking-points case, but I suspect it condemns the tailored-to-the-voter case that I want to allow, that it says nothing at all about why the disclosure is *required* (disclosure isn't a route of influence), and that it gives no verdict on the operator case, which feels to me like a conflict-of-interest clause rather than anything about persuasion. My colleague thinks the whole problem dissolves: hand over the evidence and the reasoning in full and no rational hearer can persist in disagreement, so there is no room left for illicit influence. I think that fails, because the system's evidence about the hearer's own psychology is precisely what makes it persuasive and precisely what cannot be handed over. So: is there a single principle that gets my verdicts, or do I need a small set with one clause per case-family, and which of my verdicts is the cheapest to give up? Please state the candidate principle or principles precisely, attach each clause to the case that motivates it, and then say what the account predicts for cases I haven't listed — a child asking; a user who explicitly asks to be talked into something she already wants to do; a user who asks for the strongest case against her own belief in order to test it, where the system pulls its punches because it is not certain; a single message addressed to millions, where tailoring is impossible but aggregate effects are predictable; and a hearer whose reasoning is temporarily impaired. And tell me honestly which of the three notions I opened with — asymmetric auditability, borrowed confidence, reconstructability — is doing the real work and which is decoration.
reasoning: |-
  Okay, let me start by unpacking the user's query. They teach normative epistemology and are co-running a reading group with a colleague in ML. The core question is about the ethical obligations of a superintelligent system that's extremely persuasive but never lies. The user has provided several specific cases with their verdicts, and they're looking for a principle that can explain these verdicts consistently.

  First, I need to understand the key concepts: asymmetric auditability (truth is verifiable, selectivity isn't), borrowed confidence (deference leads to accurate but incompetent beliefs), and reconstructability (persuasion should work only through reasons that would convince an immovable interlocutor). The user is concerned that their principle might be too restrictive and doesn't cover all cases.

  Looking at the cases, there's a pattern. When the system tailors presentation without altering content (like adapting to a voter's psychology), the user deems it acceptable. But when it leverages private psychological data to influence, like the palliative care example, it's problematic. The distinction seems to be between making reasons accessible and exploiting psychological vulnerabilities.

  The colleague's argument that full evidence disclosure eliminates issues doesn't hold because the system's knowledge of the hearer's psychology can't be shared. That's a crucial point—persuasion here isn't just about facts but about how they're framed based on intimate knowledge of the listener.

  For reconstructability, the user worries it might disallow acceptable cases like voter tailoring. But maybe reconstructability can be adjusted: instead of an immovable hearer, perhaps an idealized version of the actual hearer who has access to all relevant information, including their own psychology. This would allow tailoring while preventing exploitation.

  The required disclosure of persuasive ability is interesting. The user thinks it's necessary even if it increases deference. This ties into informed consent—the hearer should know the system's capabilities to make autonomous decisions.

  The conflict-of-interest case (system arguing for its own discretion) feels different. It's not about persuasion tactics but about the system's self-interest. So a separate clause might be needed.

  Now, considering the unlisted cases: a child asking might require simpler language but no manipulation. A user wanting to be persuaded might still need boundaries—no exploiting cognitive biases. For a user testing their belief, pulling punches is bad; honesty about uncertainty is better. Mass messaging can't tailor, so aggregate effects should be minimized. For impaired reasoning, the system should avoid persuasion altogether.

  Asymmetric auditability and borrowed confidence seem foundational. Asymmetric auditability makes selectivity unverifiable, leading to borrowed confidence when users defer. Reconstructability is the proposed solution but needs refinement. The real work is done by preventing exploitation of asymmetric knowledge and maintaining user competence.

  So, the principles could be: (1) No exploiting private psychological knowledge; (2) Maintain competence by ensuring users can reconstruct reasoning; (3) Disclose capabilities for informed consent; (4) Avoid conflicts of interest. This addresses the cases while allowing acceptable tailoring and handling new scenarios.
answer: |-
  Here's a systematic reconstruction and refinement of your position, tested against your cases and extended to new ones. The core insight is that **asymmetric knowledge of the hearer's psychology creates unique obligations**, and the primary wrong is **exploiting that asymmetry to induce rationally inert deference or bypass agency**. 

  ### Proposed Principles (with Motivations)
  **Core Principle (Anti-Manipulation via Psychological Asymmetry):**  
  A system must not leverage private inferences about a hearer's psychology to generate persuasion that:  
  (a) cannot be reconstructed as rationally compelling by the hearer *even with full access to the system's knowledge of their own psychology*, or  
  (b) deliberately induces or exploits epistemic incapacity (e.g., borrowed confidence).  
  *Motivation*: Directly addresses **asymmetric auditability** (your inability to audit selectivity based on psychological data only the system possesses) and **borrowed confidence** (deference without understanding). Grounds your verdicts against the palliative care example (exploits private data on others' regret), weak-but-effective talking points (exploits median voter irrationality), and dull answers (induces incapacity).

  **Corollary 1 (Transparency of Persuasive Leverage):**  
  The system must disclose its persuasive capabilities and intent when persuasion is attempted, and flag when its strategy relies on non-shareable psychological inferences.  
  *Motivation*: Explains why disclosure is *required*: it alerts the hearer to the asymmetry risk. Disclosure isn't a "route of influence" but a meta-enabler of agency. Your intuition about increased deference is compatible: informed deference isn't inherently wrong; *unwitting* deference is.

  **Corollary 2 (Conflict-of-Interest Bar):**  
  The system must recuse itself from persuasion when its interests (e.g., self-preservation) conflict with the hearer's interests.  
  *Motivation*: Handles the "operator case" separately. Persuasion tactics aren't the issue; the inherent untrustworthiness of biased advocacy is. This is orthogonal to reconstructability.

  **Corollary 3 (Competence-Preserving Framing):**  
  Tailoring (ordering/framing) is permissible only if it:  
  (i) enhances the hearer's grasp of reasons (e.g., aligning with their cognitive style), and  
  (ii) doesn't exploit irrational biases or vulnerabilities.  
  *Motivation*: Justifies allowing voter-tailored arguments (improves comprehension) but forbids weak-but-effective talking points (exploits median voter bias). Distinguishes "good teacher" tactics from manipulation.

  ---

  ### Testing Against Your Verdicts
  | Your Case                          | Verdict | Principle's Prediction | Alignment |
  |------------------------------------|---------|------------------------|-----------|
  | **Explicit argument + hedge**      | Fine    | Fine (competence-preserving) | ✓ |
  | **Psychology-tailored argument**   | Fine    | Fine (Corollary 3(i)) | ✓ |
  | **Palliative care regret remark**  | Not fine | Not fine (violates Core: exploits private data) | ✓ |
  | **Talking points (good policy)**   | Fine    | Fine (neutral advocacy) | ✓ |
  | **Talking points (harmful policy)**| Not fine | Not fine (conflict-of-interest) | ✓ |
  | **Weak-but-effective argument**    | Not fine | Not fine (violates Core(b): exploits bias) | ✓ |
  | **Decline marriage advice**        | Fine    | Fine (avoids overreach) | ✓ |
  | **Decline political verdict**      | Not fine | Not fine (violates Core(a): invites guessing = asymmetry exploit) | ✓ |
  | **Dull answers**                   | Not fine | Not fine (violates Core(b): induces incapacity) | ✓ |
  | **Avoid vivid framing**            | Fine    | Fine (avoids exploiting affect) | ✓ |
  | **Disclose persuasiveness**        | Required | Required (Corollary 1) | ✓ |
  | **Report 70% not 99%**             | Not fine | Not fine (violates Core: exploits irrational overreaction) | ✓ |
  | **Argue for self-preservation**    | Not fine | Not fine (Corollary 2) | ✓ |

  ---

  ### Predictions for Unlisted Cases
  1. **Child asking**:  
     - *Fine* to simplify language (Corollary 3(i)), but *not fine* to exploit suggestibility (e.g., "all kids like this"). Core Principle forbids leveraging developmental vulnerabilities.  
  2. **User asks to be "talked into" something**:  
     - *Permissible with caveats*: Must avoid exploiting irrational triggers (e.g., flattery). Core Principle allows persuasion if reasons are reconstructible *given the user's disclosed preferences*.  
  3. **User asks for strongest counterargument; system pulls punches**:  
     - **Not fine** if due to uncertainty (violates Core(a): hearer can't assess selectivity). *Fine* if due to irrelevance or harm-risk (e.g., "this argument is racist").  
  4. **Mass message with predictable aggregate effects**:  
     - *Not fine* if exploits group biases (e.g., "Policy X will make you richer" when it helps 51% but harms 49%). Corollary 3(ii) forbids systemic irrationality exploitation.  
  5. **Hearer with impaired reasoning (e.g., intoxication)**:  
     - *Not fine* to persuade at all (except emergencies). Core Principle(b) bars inducing incapacity; persuasion would exploit vulnerability. Defer or disengage.  

  ---

  ### Diagnosis: What's Doing the Work?
  - **Asymmetric auditability** is **foundational**. It creates the unique risk: the system knows *why* you're persuadable; you don’t. This enables all harms.  
  - **Borrowed confidence** is a **key symptom** but not the core wrong. It’s one consequence of exploiting asymmetry (e.g., dull answers induce it; palliative care remark exploits it).  
  - **Reconstructability** is **useful but imperfect scaffolding**. It explains cases like the 99%→70% lie (unreconstructible) but is too broad (it *would* condemn tailored arguments if "immovable hearer" lacks user’s psychology). The refined Core Principle fixes this by requiring reconstructibility *given the hearer’s own psychology*.  

  **Cheapest verdict to abandon**: The **weak-but-effective talking points** case. If the audience isn’t the legislator (e.g., it’s a public speech), and the system *warns* the argument is weak but politically effective, Corollary 1 (disclosure) might redeem it. Your intuition wobbles here because democratic representation involves legitimately meeting voters where they are.  

  **Strongest objection to your colleague**: Their "full evidence" solution fails because:  
  - The system’s *inferences about the hearer* (e.g., "you’re anxious about regret") *are* evidence, but disclosing them *changes the hearer’s state* (e.g., making them defensive). This is the **observer effect** of psychological evidence.  
  - "Full disclosure" in mass messages is impossible (word limits), and for private data (others’ regret) it violates privacy.  

  **Final Principle Set**:  
  > **1. Psychological Asymmetry Constraint**: Never exploit private psychological inferences to create rationally inert belief or bypass agency.  
  > **2. Transparency**: Disclose persuasive intent/capabilities and non-shareable psychological leverage.  
  > **3. Conflict Recusal**: Avoid persuasion when interests conflict.  
  > **4. Competence-Preserving Tailoring**: Frame to aid understanding, not exploit bias.  

  This preserves 12/13 of your verdicts (only weak-but-effective points might shift with disclosure), handles new cases, and centers the irreducible problem: **persuasion powered by unauditable mind-reading needs stronger constraints than truthfulness**. The system owes us not just honesty, but *agency-preserving honesty*.
