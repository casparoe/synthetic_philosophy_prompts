prompt: |-
  I've been following a long-running comment thread on one of the rationalist group blogs about whole-brain emulation, and the same move keeps surfacing: someone says the brain is hardware and the mind is the software running on it, and then uses that one sentence to license two quite strong conclusions. First, that uploading or mind-copying is in principle just a matter of resolution and compute, since a program is portable. Second, that psychology is autonomous from neuroscience the way software engineering is autonomous from semiconductor physics, so functional and folk-psychological descriptions are the right level and the wetware is an implementation detail. A friend of mine who works adjacent to computational neuroscience says the sentence is doing all the work, and that the whole thing comes apart as soon as you ask what the instruction set architecture is supposed to be. I don't want a verdict on whether brains are computers; I want an audit of the analogy and of what it can carry.

  So: give me the correspondence table. For each of the following, name what plays the role in the brain, or say that nothing does and that this is a genuine break rather than a strained fit — the instruction set architecture; the compiled artifact; the compiler and the source it compiles; the program/data distinction; the program counter and the clock; the memory hierarchy; the bus; the operating system; the power supply; the user; the programmer; and the operation of porting to different hardware. Then sort the breaks by whether they are load-bearing for the two conclusions or merely cosmetic. Is it load-bearing that the source is a genome and the compilation is development, so that there is no artifact to copy but only a noisy process to re-run? That plasticity makes the program self-modifying, collapsing the program/data split? That there is no published architecture, so same computation on different hardware is fixed only by whatever mapping we choose after the fact, which is the familiar worry that on a liberal enough mapping any physical system implements any computation? That the system is asynchronous, analog-ish and stochastic, so a faithful simulation is a discretization, and nobody has said what error tolerance still counts as running the same program rather than a near one? I'd also like named explicitly the features the analogy imports that the target might lack: that behavior is produced by rule-governed operations on discrete symbols at some level, that implementation is an objective relation rather than a description we impose, and that the program is separable from the machine and therefore copyable.

  Then the verdict, kept separate for the two conclusions: which survives once the disanalogies are on the table, which was being carried entirely by the analogy, and is there a weaker version of the sentence worth keeping. I also suspect the thread is conflating two claims, and I'd like them pulled apart: substrate-independence for cognition and behavior versus for phenomenal experience. The piecemeal-replacement case — swapping neurons for functionally equivalent chips one at a time — seems to separate them, and I want to know which version of the analogy each half requires and what each half can concede without giving up the other. Finally, if the hardware/software picture is the wrong one, propose a better analogy and say what it would predict differently; my friend suggests something like an analog, self-rewiring systolic array whose firmware is partly the chemistry, and I genuinely can't tell whether that is an improvement or just a more impressive-sounding way of saying the same thing. Skip the Chinese Room — I've read that one, and it isn't the objection I'm after.
reasoning: |-
  We are going to analyze the hardware/software analogy for the brain and mind, as used in discussions about whole-brain emulation and the autonomy of psychology from neuroscience. The goal is to provide a correspondence table for key concepts in computing and see what, if anything, plays that role in the brain. We will then assess the breaks (disanalogies) and sort them by whether they are load-bearing for the two conclusions:

  Conclusion 1: Uploading or mind-copying is in principle just a matter of resolution and compute (portability of the program).

  Conclusion 2: Psychology is autonomous from neuroscience (functional descriptions are the right level; wetware is an implementation detail).

  We will also address the two claims that might be conflated: substrate-independence for cognition/behavior vs. for phenomenal experience.

  Finally, we will propose an alternative analogy and see what it predicts differently.

  ## Correspondence Table

  We consider the following computing concepts and what they correspond to in the brain:

  1. **Instruction Set Architecture (ISA)**: The interface between hardware and software, defining the set of instructions the hardware can execute, registers, memory addressing, etc.
     - *In the brain*: Nothing clear. There is no published ISA for the brain. Neural operations are not defined by a discrete set of instructions. The closest might be the set of neural signaling mechanisms (e.g., action potentials, synaptic transmission) and plasticity rules, but these are not an ISA in the classical sense because they are not a cleanly separable abstraction layer and they are not discrete.

  2. **Compiled artifact**: The executable program that runs on the hardware.
     - *In the brain*: Nothing exactly. The brain is not running a pre-compiled binary. The connectivity and dynamics of the brain are the result of a developmental process and ongoing plasticity. There is no static "program" that is loaded and executed.

  3. **Compiler and the source it compiles**: The compiler translates high-level source code into machine code. The source is the human-readable program.
     - *In the brain*: The genome might be considered the "source", and development (including gene expression, neural development, and learning) might be seen as the "compilation" process. However, this is a noisy, stochastic, and ongoing process (not a one-time compilation). Also, the "source" (genome) is not a program in a high-level language; it's more like a set of instructions for building and maintaining a complex system.

  4. **Program/data distinction**: In a von Neumann architecture, the same memory holds both program instructions and data, but they are logically separate. In Harvard architecture, they are physically separate.
     - *In the brain*: The distinction is blurred. Neural connections (synapses) and their weights can be seen as both the program and the data. The brain is highly plastic, meaning that the "program" is constantly being modified by experience (data). Also, there is no clear separation in memory between instructions and data.

  5. **Program counter and the clock**: The program counter holds the address of the next instruction to execute. The clock synchronizes operations.
     - *In the brain*: There is no global program counter. The brain is massively parallel and asynchronous. There is no central clock; neural activity is driven by local events and can be oscillatory but not globally synchronized. However, some neural circuits may have local oscillators (e.g., thalamocortical loops).

  6. **Memory hierarchy**: Levels of memory (registers, cache, RAM, disk) with different speeds and capacities.
     - *In the brain*: There is a form of memory hierarchy: short-term memory (working memory) and long-term memory, and within long-term, episodic, semantic, etc. But this is not organized as a hardware hierarchy with explicit caching mechanisms. It is implemented by different neural systems and synaptic mechanisms.

  7. **Bus**: A communication system that transfers data between components.
     - *In the brain*: The white matter tracts (bundles of axons) that connect different brain regions might be seen as a bus. However, it is not a single shared bus but a complex network of connections.

  8. **Operating system**: Manages hardware resources and provides common services for software.
     - *In the brain*: Nothing clear. There is no centralized operating system. Some functions (like homeostasis, attention, and task switching) might be distributed across systems, but they are not separable from the "applications".

  9. **Power supply**: Provides energy to the system.
     - *In the brain*: The cardiovascular system (blood supply) delivering oxygen and glucose. This is a clear analog.

  10. **User**: The entity that interacts with the computer.
      - *In the brain*: There is no clear "user" that is separable from the brain itself. The entire system is the mind. We might say the environment (via sensory input) and the body (via proprioception) are the "users", but that is a stretch.

  11. **Programmer**: The entity that writes the program.
      - *In the brain*: Evolution (via natural selection) and the environment (via learning). But evolution is not a programmer in the intentional sense, and learning is an ongoing process within the system.

  12. **Porting to different hardware**: Taking a program written for one ISA and recompiling it to run on another.
      - *In the brain*: This is the idea of uploading: taking the brain's state and running it on different hardware. However, without a clear ISA or a compiled artifact, the process is undefined. We would have to simulate the brain at a lower level (e.g., at the neural or sub-neural level) and then run that simulation on new hardware.

  ## Analysis of Breaks (Disanalogies)

  Now, we will list the key disanalogies and sort them by whether they are load-bearing for the two conclusions.

  ### Load-Bearing for Conclusion 1 (Uploading is just resolution and compute)

  Conclusion 1 requires that the mind is a program that can be copied and run on any hardware with sufficient resources. The disanalogies that challenge this:

  - **No ISA**: Without a clear instruction set, we don't know what level of abstraction to simulate. We might have to simulate at a lower level (e.g., molecular) which requires immense compute and may not be feasible. Also, without an ISA, the same computation is not objectively defined, leading to the multiple realizability worry (any system can be seen as implementing any program).

  - **No compiled artifact**: The brain is not a static program. It is a product of development and ongoing plasticity. To "copy" the mind, we might need to copy the entire developmental history and current state, which is not a discrete program. Moreover, the process is stochastic, so rerunning the same genome and environment might not yield the same result.

  - **Program/data distinction collapse**: Because the brain is self-modifying, the program is constantly changing. A static copy might not capture the ongoing dynamics.

  - **Asynchronous, analog, and stochastic**: The brain is not a digital, synchronous system. Simulating it requires discretization and dealing with noise, which introduces the problem of error tolerance: when is the simulation close enough? This is critical for whether the uploaded mind is the same as the original.

  - **No clear separation of program and hardware**: In the brain, the "program" is embodied in the wetware. Without a clean abstraction layer, porting is not straightforward.

  These breaks are load-bearing because they directly challenge the idea that the mind is a portable program. Without an ISA or a static compiled artifact, we don't know what to copy. The stochastic and analog nature also complicates the idea of a faithful copy.

  ### Load-Bearing for Conclusion 2 (Autonomy of psychology)

  Conclusion 2 claims that psychology (functional level) is autonomous from neuroscience (implementation level), like software engineering is autonomous from semiconductor physics.

  - **No ISA**: The lack of a clean interface means that the functional level might not be separable from the implementation. Neuroscience might be necessary to understand the constraints on cognitive functions.

  - **Program/data collapse and plasticity**: The constant interaction between the "program" and the environment (data) means that the functional level is deeply tied to the biological implementation, especially for learning and adaptation.

  - **No operating system**: Without a clear separation of system-level functions from applications, it's hard to argue that the functional level can be studied independently.

  However, note that functionalism in philosophy of mind might still hold even without a computer-like architecture. The breaks might be less load-bearing for this conclusion because functionalism does not require a von Neumann architecture. But the analogy to software engineering (where you can design software without knowing the hardware) is weakened because the brain's "software" is not clearly separable.

  ### Less Load-Bearing (Cosmetic) Breaks

  - **Bus**: The white matter tracts are a rough analog. The break (not a single bus) is not critical for either conclusion.

  - **Power supply**: The cardiovascular system is a good analog and not a problem for the analogy.

  - **User and programmer**: These are not central to the core claims about the mind's portability or functional autonomy.

  ## Explicitly Named Imported Features

  The analogy imports the following features that the brain might lack:

  1. **Discrete symbol manipulation**: The brain might not operate on discrete symbols in a rule-governed way at any level. Neural activity is more continuous and pattern-based.

  2. **Objective implementation**: The idea that there is an objective level at which the brain implements a computation. Without a clear ISA, the level of abstraction is a choice.

  3. **Separability of program and machine**: The program is not independent of the hardware; it is embodied.

  ## Verdict on the Two Conclusions

  ### Conclusion 1: Uploading is just resolution and compute

  This conclusion is heavily dependent on the analogy and does not survive the disanalogies. The lack of an ISA, the absence of a static compiled artifact, the collapse of program/data, and the analog, stochastic nature of the brain mean that we cannot simply "copy the program" and run it. Uploading would require a detailed simulation at a low level (e.g., neural or sub-neural) and the problem of error tolerance remains. The conclusion is being carried entirely by the analogy and breaks down when we look at the details.

  ### Conclusion 2: Autonomy of psychology

  This conclusion is less dependent on the analogy and might survive in a weaker form. Functionalism (the idea that mental states are defined by their functional role) does not require a computer-like architecture. However, the analogy to software engineering (where you can ignore the hardware) is strained because of the brain's plasticity and the lack of a clean abstraction layer. Neuroscience might impose constraints that cannot be ignored. Thus, while psychology might still be autonomous in principle, in practice the wetware matters more than the analogy suggests. A weaker version might be: functional descriptions are useful and can be relatively autonomous, but they are constrained by the implementation.

  ## Conflation of Two Claims: Substrate-Independence

  The thread might be conflating:

  1. **Substrate-independence for cognition and behavior**: The idea that the same cognitive functions and behaviors can be realized in different physical substrates. This is a claim about functional equivalence.

  2. **Substrate-independence for phenomenal experience**: The idea that the same subjective experience (qualia) can be realized in different substrates. This is about consciousness.

  The piecemeal replacement (neuron-by-neuron) scenario is often used to argue for both. For cognition and behavior, functional equivalence might be sufficient. For phenomenal experience, it's not clear. The analogy might support the first if we can map the functions, but it does not necessarily support the second because we don't know if functional equivalence guarantees identical subjective experience.

  The hardware/software analogy might work for the first claim (if we can define the functions) but not for the second. The breaks (especially the analog, stochastic nature and the lack of a clear program) might be more critical for phenomenal experience.

  ## A Better Analogy

  Your friend suggests: "an analog, self-rewiring systolic array whose firmware is partly the chemistry."

  - **Systolic array**: A network of processing elements that rhythmically compute and pass data. This captures the parallel, rhythmic (but not globally clocked) nature of neural circuits.

  - **Analog**: Captures the continuous, non-digital aspects.

  - **Self-rewiring**: Captures plasticity.

  - **Firmware is partly the chemistry**: Recognizes that the low-level details (like neuromodulators, ion channels) are crucial.

  This analogy is an improvement because:

  - It avoids the discrete, digital assumptions of the computer analogy.
  - It emphasizes the continuous, dynamic, and self-modifying nature.
  - It incorporates the role of chemistry (substrate) in a way that the hardware/software analogy downplays.

  What it predicts differently:

  - It suggests that the mind is not a program that can be copied and run arbitrarily, but a dynamic pattern in a specific medium. Porting would require replicating the medium and the dynamics, not just the structure.
  - It implies that functional equivalence might require mimicking the analog and chemical properties, not just the discrete steps.
  - It might predict that gradual replacement (neuron by neuron) is more likely to preserve phenomenal experience than a sudden upload because the dynamics are maintained.

  ## Summary

  The hardware/software analogy is useful but breaks down at critical points, especially for the portability claim. For uploading, the breaks are load-bearing and the conclusion doesn't hold. For the autonomy of psychology, a weaker form might survive. The two claims about substrate-independence should be separated. The alternative analogy (analog, self-rewiring systolic array) is more fitting and suggests that the wetware is not just an implementation detail but integral to the mind's operation.
answer: |-
  Below is a systematic audit of the hardware/software analogy as applied to the brain, structured around your requested correspondence table, analysis of disanalogies, verdicts on the two conclusions, separation of substrate-independence claims, and a proposed alternative analogy. The focus is on the *logic* of the analogy—what it assumes, what breaks, and what implications survive.

  ---

  ### **Correspondence Table: Computing Concepts vs. Brain Equivalents**
  For each computing concept, I identify the brain equivalent or state if there is none (a "break"). I note whether the break is "cosmetic" (minor, doesn't undermine core claims) or "load-bearing" (challenges the analogy's conclusions).

  | Computing Concept         | Brain Equivalent or Break                                                                                                  | Break Severity (Load-Bearing?) |
  |---------------------------|----------------------------------------------------------------------------------------------------------------------------|--------------------------------|
  | **Instruction Set Architecture (ISA)** | *Break: Nothing clear.* No discrete, standardized set of instructions. Neural "operations" (e.g., spike propagation, plasticity) are emergent from biophysics, not a defined interface. | **Load-bearing** (critical for both conclusions) |
  | **Compiled artifact**     | *Break: Nothing static.* The brain's connectivity is a dynamic, self-organizing product of development, learning, and stochastic processes. There is no "binary" to copy; only a transient state. | **Load-bearing** (critical for Conclusion 1) |
  | **Compiler & source code** | *Partial analog: Source ≈ genome; compiler ≈ developmental process.* But development is noisy, environment-dependent, and continuous (not a one-time compilation). The genome is not "code" but a regulatory scaffold. | **Load-bearing** (for Conclusion 1) |
  | **Program/data distinction** | *Break: Collapsed.* Synapses and neural activity blur the line: "data" (sensory input, experience) directly rewires the "program" (connectivity). Plasticity makes the system self-modifying. | **Load-bearing** (for both conclusions) |
  | **Program counter & clock** | *Break: No global equivalents.* Neural activity is asynchronous, decentralized, and driven by local dynamics (e.g., oscillatory rhythms). No central "clock" or "next instruction" pointer. | Cosmetic (parallelism handles this) |
  | **Memory hierarchy**      | *Partial analog:* Short-term (e.g., working memory) vs. long-term (e.g., synaptic) memory exists, but without explicit caching/registers. Implemented via diverse mechanisms (e.g., synaptic weight changes, recurrent loops). | Cosmetic (hierarchy exists, just messier) |
  | **Bus**                   | *Partial analog:* White matter tracts (axon bundles) act as communication pathways, but they are not a unified "bus." Signaling is parallel, chemical, and modulated (e.g., neuromodulators). | Cosmetic (functionally similar) |
  | **Operating system (OS)** | *Break: Nothing equivalent.* No separable OS managing resources. Functions like attention or homeostasis emerge from distributed networks, not a distinct layer. | Cosmetic (high-level functions exist) |
  | **Power supply**          | *Clear analog:* Cardiovascular system (blood flow delivering oxygen/glucose). Failure causes shutdown. | No break |
  | **User**                  | *Break: No external user.* The mind is the system itself. Input comes from the environment/body, but there's no "user" outside the system. | Cosmetic (irrelevant to core claims) |
  | **Programmer**            | *Partial analog:* Evolution (via natural selection) and environment (via learning). But evolution is blind, and learning is intrinsic, not an external coder. | Cosmetic (design origins exist) |
  | **Porting to new hardware** | *Break: No direct analog.* Emulation requires low-level simulation (e.g., neurons or synapses), not "recompilation." Porting isn't ISA-based but ad hoc (e.g., defining a mapping). | **Load-bearing** (critical for Conclusion 1) |

  ---

  ### **Analysis of Key Breaks and Their Load-Bearing Status**
  The breaks are sorted by whether they undermine the two conclusions:
  - **Conclusion 1 (C1)**: Uploading/mind-copying is just resolution + compute (program portability).
  - **Conclusion 2 (C2)**: Psychology is autonomous from neuroscience (functional descriptions suffice).

  | Break                                                                 | Why Load-Bearing?                                                                                                                               | Conclusion Affected |
  |-----------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------|---------------------|
  | **No ISA**                                                           | Without a defined interface, "same computation" isn't objective. Portability requires an abstraction layer (e.g., "copy the ISA-executed program"), but no such layer exists. Allows liberal mappings (any system implements any computation). | **C1 & C2** (undermines objectivity of computation and functional autonomy) |
  | **No compiled artifact; source is genome + noisy development**       | Emulation isn't copying a static program—it's re-running a stochastic process. Two runs of the "same" genome/environment may yield different minds. No artifact to "copy," only a process to simulate. | **C1** (breaks portability) |
  | **Program/data collapse due to plasticity**                          | If the program modifies itself via data, functional descriptions (C2) must account for implementation-dependent learning. Autonomy fails if the "software" is inseparable from "data" flows. | **C1 & C2** (challenges separability) |
  | **Asynchronous, analog-ish, stochastic dynamics**                    | Faithful simulation requires discretization and noise tolerance. "Same program" vs. "near one" is undefined (e.g., is a 99% accurate simulation "you"?). Portability (C1) becomes arbitrary without error bounds. | **C1** (breaks resolution/compute argument) |
  | **Implementation not objective**                                     | Without an ISA, "same computation" is observer-dependent. Neuroscience can't be ignored (C2) because the "mapping" from wetware to function isn't fixed. | **C1 & C2** (core to analogy's assumptions) |

  **Cosmetic breaks** (e.g., no OS, no bus) don't threaten conclusions—they're implementation quirks. Parallelism compensates for no program counter; memory hierarchy exists but is messy.

  ---

  ### **Features Imported by the Analogy (and Possibly Lacking in Brain)**
  The analogy assumes:
  1. **Discrete symbolic computation**: Behavior arises from rule-governed operations on discrete symbols. *Brain lacks this*: Processing is continuous, pattern-based, and subsymbolic (e.g., distributed neural populations).
  2. **Objective implementation**: Hardware/software separation is intrinsic, not imposed. *Brain lacks this*: No ISA makes implementation observer-relative.
  3. **Program-machine separability**: The program is copyable/portable independent of hardware. *Brain lacks this*: "Program" is embodied in wetware dynamics (e.g., electrochemical gradients).

  ---

  ### **Verdict on the Two Conclusions**
  - **Conclusion 1 (Uploading/mind-copying as resolution + compute)**:  
    **Does not survive.** The breaks are fatal. No ISA means no objective "program" to copy; no compiled artifact means only a noisy process can be simulated; analog/stochastic dynamics demand arbitrary error-tolerance choices. Portability isn't guaranteed by "sufficient resolution"—it requires an abstraction layer that doesn't exist. *This conclusion is carried entirely by the analogy.*  
    *Weaker version worth keeping*: "High-fidelity brain simulation may replicate behavior with enough computational resources, but it's not 'copying a program'—it's recreating a dynamic biological process, with no guarantees of identity."

  - **Conclusion 2 (Psychology's autonomy from neuroscience)**:  
    **Partially survives in weaker form.** Functional descriptions (e.g., cognitive models) can be usefully autonomous *for explaining behavior*, as neuroscience details may not always be needed (e.g., describing memory retrieval at a systems level). However, plasticity and the program/data collapse mean wetware isn't *just* an implementation detail—neuroscience constrains function (e.g., synaptic limits affect learning). Autonomy is pragmatic, not principled. *This conclusion isn't solely carried by the analogy* (functionalism exists without computers), but the analogy overstates it.  
    *Weaker version*: "Psychology can often ignore neural implementation for explanatory purposes, but not for prediction or intervention, and not for phenomena tied to biology (e.g., emotion, learning)."

  ---

  ### **Separating Substrate-Independence Claims**
  The thread conflates:
  - **Substrate-independence for cognition/behavior**: The claim that cognitive functions (e.g., memory, decision-making) can be realized on different hardware.  
    *Supported by the analogy?* Minimally. The hardware/software picture suggests functional equivalence is sufficient. But the breaks (no ISA, plasticity) imply *strict* equivalence is hard to define—it requires ad hoc mappings. The analogy *can* concede stochasticity or analog dynamics without fully failing here.  
    *Piecemeal-replacement intuition*: Swapping neurons for silicon chips *could* preserve behavior if function is maintained, but the program/data collapse means "function" includes adaptation, which may be substrate-sensitive.

  - **Substrate-independence for phenomenal experience**: The claim that subjective experience (e.g., qualia) can be preserved across substrates.  
    *Supported by the analogy?* No. The analogy treats the mind as software, but phenomenal experience isn't functional—it's intrinsic to implementation (e.g., "what it feels like" to process data). The breaks (analog dynamics, no separability) are critical here. Piecemeal replacement *might* preserve experience by continuity, but sudden uploads face the "discretization error" problem.  
    *Key point*: The analogy licenses substrate-independence for behavior but not for experience. Behaviorism is embedded in the hardware/software view; phenomenology is not.

  ---

  ### **Proposing a Better Analogy**
  **Your friend's suggestion**: "An analog, self-rewiring systolic array whose firmware is partly the chemistry."  
  - **Why it's better**:  
    - **Systolic array**: Captures rhythmic, parallel processing (e.g., neural oscillations) without a global clock.  
    - **Analog**: Rejects digital discretization, embracing continuous dynamics (e.g., graded potentials).  
    - **Self-rewiring**: Explicitly models plasticity (synapses change with experience).  
    - **Firmware as chemistry**: Acknowledges that low-level details (e.g., ion channels, neurotransmitters) are constitutive, not incidental.  
    This avoids importing discreteness, separability, and static programs.

  - **How it improves on hardware/software**:  
    - **Predicts upload challenges**: Emulation requires replicating chemistry-dependent dynamics (e.g., neuromodulator diffusion), not just "bits." Suggests gradual replacement (neuron-by-neuron) may work where sudden uploads fail.  
    - **Predicts autonomy limits**: "Firmware" (chemistry) constrains high-level function—e.g., serotonin levels affect cognition, so neuroscience isn't ignorable.  
    - **Clarifies portability**: No "program" to copy; porting requires hardware-level mimicry (e.g., analog VLSI).  
    - **New prediction**: Successfully emulated minds would require biological fidelity (e.g., simulating molecular noise), not just computational power.  

  **Is it more than a fancy restatement?** Yes. Unlike hardware/software, this analogy:  
  1. Denies program/data separation (self-rewiring merges them).  
  2. Makes substrate critical (firmware is chemistry).  
  3. Predicts that analog noise and chemical gradients are features, not bugs.  

  **Testable difference**: Under this analogy, a digital brain emulation would *not* reproduce phenomenal experience (due to discretization), whereas hardware/software might dismiss this as "resolution issue."

  ---

  ### **Summary**
  - **Analogy audit**: The hardware/software view imports untenable assumptions (discreteness, separability, static programs). Breaks like no ISA, no compiled artifact, and program/data collapse are load-bearing for portability (C1) and strain autonomy (C2).  
  - **Conclusions**: C1 (uploading) fails; C2 (autonomy) holds weakly for behavior, not phenomenology.  
  - **Substrate-independence**: Separable—behavioral equivalence may be achievable, phenomenal equivalence uncertain.  
  - **Better analogy**: An analog, self-rewiring systolic array with chemical firmware. It predicts that successful emulation requires biological mimicry, not just computational power.  

  This suggests the rationalist thread overstates the case for easy uploading and functional autonomy. The core insight—that minds *might* be substrate-independent—survives, but the computer analogy obscures the challenges.
