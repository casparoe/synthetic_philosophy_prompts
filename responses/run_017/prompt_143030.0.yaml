answer: |-
  Here's my reasoning in British English, with direct numerical estimates and minimal hedging:

  **Headline credence for your proposition (by 2050, ≥1/3 flagship cases deemed non-adaptive per your survey): 0.25**

  **Decomposition:**

  1.  **Taxonomy Correct & Target:** **P = 0.90**  
      *Justification:* Your three-way split (empirical claim, methodological imperative, explanatory sufficiency) is a fair dissection. Gould & Lewontin were *primarily* attacking the **methodological imperative** ("assume adaptation first") as overly dominant and prone to generating just-so stories. The critique was less about denying adaptation exists and more about challenging the *default strategy* and the *explanatory monopoly* claimed for selection-for-current-function.

  2.  **Flexibility Asymmetry (Real & Large):** **P = 0.85**  
      *Justification:* Adaptive hypotheses *are* demonstrably more flexible. Altering selective regimes, intensities, timeframes, or correlated responses can often salvage an adaptive story post-hoc. Constraint/byproduct hypotheses typically make sharper, falsifiable predictions about form, correlation, or phylogeny. The asymmetry is fundamental to hypothesis structure.

  3.  **Significant Flexibility Penalty Demotes ≥1/3 Flagship Cases:** **P(Applied Penalty | Asymmetry) = 0.60**  
      *Justification:* Conditional on the asymmetry being real, applying a rigorous Bayesian penalty (charging for the vast volume of conceivable adaptive scenarios) *would* significantly downgrade many current adaptive interpretations. Textbook cases often rest on plausibility arguments vulnerable to this penalty. A third demoted is plausible, but not guaranteed, as some flagship cases *are* robustly supported.

  4.  **Instrument Asymmetry Biases Towards Adaptive Findings:** **P = 0.75**  
      *Justification:* Tools for detecting *selection signatures* (population genetics, comparative methods) are far more advanced and widely applied than tools for rigorously *proving* a trait is *primarily* a spandrel/exaptation (often requiring detailed developmental/genetic evidence and ruling out selection). Failure to reject adaptation ≠ strong evidence *for* it, but often gets interpreted that way.

  5.  **'Spandrel' as Meaningful Category (Not Just Residual):** **P = 0.65**  
      *Justification:* While sometimes used residually, "spandrel/byproduct" *can* be a positive explanation invoking specific developmental constraints, allometries, or side-effects of selection on other traits (e.g., chin, male nipples). However, operationalising it definitively *as the primary cause* for a trait's *presence* remains challenging, risking residual status in practice.

  6.  **Incentives Prevent Consensus Even if True:** **P = 0.70**  
      *Justification:* Academic incentives powerfully favour publishing *new* adaptive hypotheses (positive, exciting, fundable) over publishing critiques demonstrating *non*-adaptation or constraint (seen as negative, less novel, harder). This creates systemic inertia favouring adaptive explanations, delaying consensus shifts even if evidence accumulates.

  **Combination (Non-Independent - Sequential Adjustment):**
  *   Start with base rate implied by penalty application (Term 3): **~0.60** (P(demoted by penalty)).
  *   **Adjust Down for Taxonomy Focus:** The core critique was methodological (Term 1). While related, empirical shift ≠ methodological shift. **Adjust to 0.55**.
  *   **Adjust Down for Instrument Bias (Term 4):** Current adaptive consensus may be inflated by detection bias. True non-adaptive fraction might be *higher* than surveys suggest. **Adjust up to 0.60**.
  *   **Adjust Down for Category Vagueness (Term 5):** Difficulty pinning down "spandrel" as primary cause makes survey resolution harder. **Adjust down to 0.55**.
  *   **Adjust Down for Incentive Inertia (Term 6):** Strong systemic bias against non-adaptive explanations reaching consensus by 2050. **Adjust down significantly to 0.25**.

  **Sensitivity & Confidence:**
  *   **Most Sensitive Term:** **Term 6 (Incentives - P=0.70)**. A small change here (e.g., P(Incentives Block) dropping to 0.5) would push my headline credence towards 0.35-0.4. If incentives shifted dramatically, the headline could rise substantially.
  *   **Least Confident Term:** **Term 5 (Spandrel as Category - P=0.65)**. Defining the boundary cleanly for a survey is inherently messy. Is it "best explanation" or "primary origin"? This operationalisation risk is high.
  *   **Biggest Mover (Concrete Result):** Your **adversarial audit** would be decisive. If critics successfully devised *well-supported* (per pre-registered criteria) non-adaptive alternatives for **≥40% of cases**, my credence would jump to **≥0.65**. Conversely, if they failed on **>75% of cases** (adaptive story holds strong), it would drop to **≤0.10**. This directly tests the real-world viability of non-adaptive explanations against the flagship cases under scrutiny, bypassing much of the theoretical debate.

  **The 0.45 vs 0.12 Gap:**
  The core disagreement likely lives in **Term 3 (Penalty Impact - P=0.60)** and **Term 4 (Instrument Bias - P=0.75)**. You (0.45) see the flexibility penalty as potent and current methods as biased towards adaptation, inflating the apparent support. Your friend (0.12) likely sees:
  1.  The penalty as overstated or already applied (Term 3 ~0.2-0.3).
  2.  Modern methods as sufficiently robust against bias (Term 4 ~0.3-0.4).
  3.  The empirical adaptationist programme as fundamentally sound, with spandrels being rare, niche cases that don't threaten the core textbook examples (undercutting Term 3's premise).
  She interprets the critique's absorption as mitigating these factors entirely, while you see the critique as highlighting enduring structural biases.
