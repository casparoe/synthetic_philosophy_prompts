answer: |-
  Here’s a focused proposal structured around your strongest thread, designed to force an argument rather than a survey. I’ll cut threads 1 and 2 (with justification) and go deep on thread 3.

  ---

  ### **Paper Proposal: Can Pluralism Ground Single-Case Calibration?**  
  **Core Question:** *Can pluralism about probability (chances + credences) explain why rational agents should calibrate their *single-case* credences to objective chances, without implicitly relying on long-run frequentist reasoning?*  

  **Why this isn’t "how should we understand probability":**  
  - It targets a *specific gap* in pluralism: the normative link between chance and credence for one-off events (e.g., "This patient has a 30% chance of survival; therefore, I should believe it to degree 0.3").  
  - The paper *fails* if it merely restates the calibration problem. It *succeeds* if it shows pluralism either (a) resolves it non-circularly, or (b) cannot resolve it, undermining pluralism’s claim to handle single cases.  

  ---

  ### **Why Standard Positions Leave This Open**  
  **(Using your test cases: a fair coin toss [type], tomorrow’s weather forecast [token], retro probability of a bridge collapse [token])**  
  1. **Frequentism:**  
     - Solves calibration for *type*-cases (coin: long-run frequency justifies credence).  
     - *Fails for tokens:* No frequency for "tomorrow’s rain" or "this bridge’s collapse." Reference-class maneuvers (e.g., "rain on days like tomorrow") *presume* the link between class frequency and single-case credence they need to justify.  

  2. **Subjectivism/Bayesianism:**  
     - Handles *token*-cases easily (weather/bridge: credences reflect evidence).  
     - *Fails objectivity:* No reason why two agents with the same evidence *should* agree on "30% chance of rain" if chances aren’t real. The "calibration norm" (set credence = chance) is unexplained.  

  3. **Propensity:**  
     - Promises objective *token*-probabilities (the bridge had a disposition to collapse).  
     - *Fails confirmation:* Can’t ground likelihoods (e.g., "If climate models are true, the propensity for rain is 70%"). Propensities are causal *from* setup *to* outcome, not backward from evidence to hypothesis.  

  **→ Pluralism’s promise:** Chances govern tokens (like propensities), credences handle epistemology. **But:** It owes an account of *why* they align in single cases.  

  ---

  ### **Method: Section-by-Section Argument**  
  **Test Cases:** Coin (type), weather forecast (token), bridge collapse (retro token).  

  1. **§1: The Calibration Norm in Single Cases**  
     - Define the norm: "Principal Principle" (PP): If you know the chance of E is x, set credence(E) = x.  
     - Show its *presumed* applicability to tokens:  
       - Weather: If meteorologists say chance of rain = 70%, you should believe to 0.7.  
       - Bridge: Engineers say "only 2% chance of failure" pre-collapse → this should guide rational precaution.  
     - *Argue:* PP is indispensable in science (risk assessment, medicine, climate models).  

  2. **§2: Pluralism’s Claim and Its Debt**  
     - Pluralism posits: Chances (objective, token) + credences (subjective).  
     - Problem: PP *links* them. Why accept it? Standard justification:  
       - *Long-run calibration:* Matching credences to chances avoids Dutch books/ensures success over time.  
       - **Critique:** This justification relies on *repeated trials* (coin tosses), but tokens (weather, bridge) *aren’t* repeatable. Pluralism uses frequentist tools to solve its own problem → circular.  

  3. **§3: Can Pluralism Pay Its Debt? Three Failed Routes**  
     - **Route 1: Define chances via idealized frequencies**  
       - (e.g., "Chance of rain = 70%" means "In infinitely many identical atmospheric states, rain in 70%").  
       - *Problem:* Violates pluralism—reduces chance to frequentism. Token cases (bridge collapse) aren’t infinitely repeatable.  
     - **Route 2: Ground PP in metaphysical necessity**  
       - (e.g., "Chances *just are* what credences should be").  
       - *Problem:* Mysterious. Why should a physical chance (e.g., a virus’s propensity to kill) *obligate* my belief?  
     - **Route 3: Pragmatic justification**  
       - (e.g., "Calibration is instrumentally rational").  
       - *Problem:* For tokens (e.g., betting on tomorrow’s weather), no long-run payoff exists. We need a *non-instrumental* reason.  

  4. **§4: Implications: Is Pluralism Coherent?**  
     - *If no justification works:* Pluralism either (a) abandons PP for tokens (making "chance" useless in guiding action), or (b) smuggles in frequentism.  
     - *Conclusion:* Pluralism hasn’t earned its claim to unify objective chance and subjective credence for single cases. It must either solve the calibration puzzle or concede that tokens lack objective chances.  

  ---

  ### **What You Cut and Why**  
  - **Cut Thread 1 (Type vs. Token):** You use it *implicitly* in test cases (coin vs. weather/bridge). Explicit taxonomy distracts from the argument.  
  - **Cut Thread 2 (Propensities in Confirmation):** Vital but too large. You *hint* at it in §3 (propensity’s causal direction limits likelihoods), but confirmation deserves its own paper.  
  - **Why focus on Thread 3?**  
    - It’s your sharpest critique: Pluralism’s "solution" collapses under single-case pressure.  
    - It forces a *negative result*: "Pluralism fails here" is a defensible 5000-word thesis. "Here’s a new solution" would be too ambitious.  

  ---

  ### **Success vs. Failure**  
  - **Succeeds if:**  
    - You show pluralism *lacks resources* to justify single-case PP without frequentism (using §§2–3).  
    - Your test cases expose the problem concretely (e.g., why "70% chance of rain" can’t guide belief under pluralism).  
  - **Fails if:**  
    - It becomes a survey ("Here’s what everyone says about calibration").  
    - You don’t engage the *strongest* pluralist replies (e.g., David Lewis’s "best system" analysis of chance).  
  - **Is "pluralism changes the subject" enough?**  
    **Yes, if argued tightly:** Your thesis is that pluralism *evades* the hard problem of single-case calibration. That’s a full paper if you:  
    - Show why pluralism *needs* to solve it (§1–2),  
    - Demolish its attempts (§3),  
    - Conclude it hasn’t earned its claims (§4).  

  **Balloon Warning:** Don’t dive into (a) the metaphysics of propensities or (b) decision theory. Use cases only as *illustrations* of the calibration problem. Stay fixed on: *Why should I set my credence to this number?*  

  ---
  **Final Tip:** Frame the title as a polemic—e.g., "The Calibration Debt: Why Pluralism About Probability Fails Single Cases." Now hunt for sources on:  
  - Principal Principle (Lewis)  
  - Critiques of PP (e.g., Ismael, Hoefer)  
  - Pluralist defenses (e.g., Cartwright, Winsberg)  
  - Propensity vs. confirmation (Gillies, Suárez)  

  This is winnable. Go break some pluralist hearts.
