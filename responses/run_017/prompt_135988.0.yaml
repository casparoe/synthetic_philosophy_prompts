prompt: |-
  I sit on the priority-setting panel of a health foundation, and over the past two years I have noticed that our disagreements are almost never about facts. What divides us is an arithmetic none of us can state. The recurring shape is this: one proposal averts a very large number of deaths among children in an extremely poor region, where each death averted yields decades of life at a modest but clearly positive level; another takes a much smaller number of people living with a painful chronic condition and restores them to something close to a normal life. In the abstract that is the choice between a huge population of barely worth living lives and a small population of excellent ones, and the more I have thought about it the less confidence I have in my own gut. So I want to try reflective equilibrium on myself. Below are my verdicts on a set of population comparisons; I would like you to find the principle, or the small set of rival principles, that best fits them, state the winner precisely enough that I could apply it by hand to a new case, tell me exactly where each candidate breaks, and tell me honestly which of my verdicts I should withdraw. Please don't send me to the literature or summarize what has been argued about this topic; I have read some of it and it has only made my intuitions less stable. I want the reasoning applied to my cases.

  Measure lifetime well-being in units where 0 is the level at which a life sits exactly on the boundary of being worth living — a life you would be indifferent between starting and not starting — +100 is an excellent human life, and negative numbers are lives dominated by suffering. (1) Population A is 1,000 people each at +100; population A* is 1,000 entirely different people each at +100. I say there is no difference: I do not care who the people are. (2) B is A plus 1,000 further people each at +40, an ordinary, decent, unremarkable life. B is not worse than A, and I lean toward its being somewhat better; adding people whose lives are clearly worth living does not strike me as a matter of indifference. (3) C is the same 2,000 people as in B, each at +75. C is better than B, and not merely because it is more equal — the total is larger as well. But then C is better than A, and I can repeat the step: 4,000 at +38, 8,000 at +20, and on down, and I find I would affirm each individual step. (4) Z is 20,000,000 people each at +1: lives worth living, but only barely, and drearily so, with a total two hundred times that of A. Z is not better than A, and I would rather bring about A. I hold this verdict more firmly than any other on the list, and I know it collides with 2 and 3 plus transitivity. (5) Now compare total welfare across different bundlings. Let A×10 be the same 1,000 people, except that a hypothetical therapy gives each of them ten times as long a life at the same quality — total welfare 1,000,000. Let Z′ be 1,000,000 people each at +1, also total welfare 1,000,000. A×10 is clearly better than Z′ and clearly better than A; so with the totals equal my verdict tracks how the welfare is distributed over lives, not merely how much of it there is, which makes me distrust any view that simply adds up well-being wherever it happens to be located. (6) Compare A with A°: A plus 1,000 people at +40 who live out their lives on an isolated archipelago we never contact, who never know of the original 1,000 and whose existence changes nothing for them. The distribution of welfare is identical to that of B in case 2, but I feel far less confident that this is an improvement, and part of me says it is no improvement at all — which sits badly with my verdict in case 1. (7) On negatives and borderline cases: A plus one person at −10 is clearly worse than A, and bringing that person into existence would clearly be wrong; but bringing a single person at +1 into existence is not wrong and yet not an improvement either — optional, I want to say, with no reason either way. Two further variants I need the principle to speak to: adding a life certain to be +1 for eighty years versus adding one that is an 80 percent chance of +10 and a 20 percent chance of −2, higher in expectation but carrying a real chance of a life not worth living — my instinct is to prefer the certain +1 and I cannot say why; and a single life that is +100 for seventy-nine years and −50 in its final year, where I cannot tell whether its value is the sum or whether the bad ending does something to it that a sum fails to capture.

  The best I have managed on my own is this: value a population by summing, over persons, the amount by which each life exceeds some positive critical level, counting anyone below that level as contributing nothing at all, and then apply diminishing returns to sheer numbers, so that the millionth barely worth living life adds less than the hundredth. I can see immediately that this will not deliver verdict 4 for large enough populations, and I do not know how to make it do so without making the principle look gerrymandered to the case, nor whether it can handle case 5 at all. Please test it against all seven of my verdicts, repair it or replace it, and then report what your best candidate says about the three comparisons I have not made up my mind on: whether there is any finite number of people at +1 that beats 1,000 people at +100, or whether no number is enough; whether A plus 1,000,000 people at +1 is better or worse than A alone; and whether 2,000,000 people at +50 is better than 1,000,000 at +100. Be explicit about which of my verdicts your preferred principle cannot accommodate, say which one you think I ought to give up and why, and end by saying in a sentence or two what the principle implies for the question my panel actually has to vote on: how to weigh averted deaths against gains in quality of life.
reasoning: |-
  Okay, the user is on a health foundation panel that prioritizes funding proposals. They've noticed that their disagreements aren't about facts but about an unspoken "arithmetic" comparing saving many children's lives versus improving fewer adults' quality of life. They've provided seven thought experiments with their intuitive judgments and want a principle that fits these judgments while resolving contradictions.

  First, I need to understand their key dilemmas. Their verdicts show tension between total welfare and distribution: they accept adding lives above a threshold (verdict 2) and scaling up populations with proportional quality drops (verdict 3), but reject vast barely-worthwhile lives (verdict 4). They care about identity-independent welfare (verdict 1) but get squeamish about isolated populations (verdict 6). Totals alone don't decide (verdict 5), and negative lives clearly worsen outcomes.

  Their self-proposed solution (summing above a critical level with diminishing returns) fails verdict 4 for large populations. I need something that respects their anti-repugnant-conclusion stance while keeping transitivity. The critical insight is separating two types of value: average welfare per life and a penalty for dilution of welfare. 

  Testing their verdicts:  
  - Verdict 1: Identity doesn't matter → principle holds  
  - Verdict 2: Adding +40 lives improves → higher average  
  - Verdict 3: Scaling increases average → better  
  - Verdict 4: Z loses despite high total → dilution penalty dominates  
  - Verdict 5: A×10 beats Z′ → avoids dilution  
  - Verdict 6: Isolated +40 ambiguous → requires welfare connection?  
  - Verdict 7: Negative lives bad; borderline optional → critical level handles  

  The tension point is verdict 6. Their discomfort suggests they value actual welfare impact over hypothetical sums. I'll argue they should drop the isolation hesitation: if welfare matters, location shouldn't. For their open questions: no finite barely-lived population beats 1,000 excellent lives; adding many +1 lives slightly worsens outcomes; and 2M at +50 beats 1M at +100 by their scaling acceptance in verdict 3.

  For the panel's dilemma: preventing child deaths beats curing chronic pain unless the quality gain is extreme, as the critical level amplifies the value of saving very low-quality lives. The dilution penalty prevents quantity from overwhelming quality.
answer: |-
  Here is a principle constructed to fit your verdicts, tested against your cases, and applied to your open questions. The core idea is **value from average welfare above a critical level, with a penalty for welfare dilution across lives**. 

  ### The Principle
  1. **Critical Level**: Any life ≤ 0 contributes no value (or negative value if < 0).  
  2. **Average Above Critical Level (AACL)**: Calculate the average welfare only for lives > 0, minus a baseline. For a population \( P \):  
     \[
     \text{AACL}(P) = \left( \frac{\sum_{i \in P, \, w_i > 0} w_i}{|P_+|}\right) - c
     \]
     where \( |P_+| \) is the number of lives > 0, and \( c \) is a small fixed constant (e.g., \( c = 0.5 \)).  
  3. **Dilution Penalty**: Multiply AACL by a discount factor for large populations:  
     \[
     V(P) = \text{AACL}(P) \times \log(1 + |P_+|)
     \]
     (Using log slows growth; adjust base for calibration.)  
  4. **Negatives**: Lives < 0 add negative value: \( -\sum_{j} |w_j| \) for each \( w_j < 0 \).  

  ---

  ### Fit to Your Verdicts
  | Case | Your Verdict | Principle’s Verdict | Match? | Notes |
  |-------|--------------|---------------------|--------|-------|
  | (1) A vs A* | No difference | Same AACL & penalty | ✅ | Identity irrelevant. |
  | (2) B (1k@100 + 1k@40) > A (1k@100) | Better | AACL(B) = (100k + 40k)/2k - c = 70 - c > 100 - c? **No** | ❌ | **Break**: AACL falls (100→70), but penalty increases. Solution: Drop the baseline subtraction. Revised AACL: \( \text{AACL}(P) = \frac{\sum w_i}{|P_+|} \). Then AACL(A) = 100, AACL(B) = 70. But \( V(B) = 70 \times \log(2000) > 100 \times \log(1000) \) → B better. |
  | (3) C (2k@75) > B (1k@100 + 1k@40) | Better | AACL(C) = 75, AACL(B) = 70 → \( V(C) > V(B) \) | ✅ | Higher average dominates. |
  | (4) Z (20M@1) vs A (1k@100) | A better | AACL(Z) = 1, AACL(A) = 100. \( V(Z) = 1 \times \log(20\text{M}) \approx 16.6 \), \( V(A) = 100 \times \log(1000) \approx 690 \) → A better | ✅ | Penalty doesn’t scale enough to catch up. |
  | (5) A×10 (1k@100×10) vs Z′ (1M@1) | A×10 better | AACL(A×10) = 100, AACL(Z′) = 1. \( V(A×10) = 100 \times \log(1000) \approx 690 \), \( V(Z′) = 1 \times \log(1\text{M}) \approx 13.8 \) → A×10 better | ✅ | Distribution matters; averages dominate totals. |
  | (6) A° (A + isolated 1k@40) vs A | Weakly better? | AACL(A°) = 70, AACL(A) = 100. \( V(A°) = 70 \times \log(2000) \approx 489 \), \( V(A) = 690 \) → **A better** | ❌ | **Break**: You’re unsure if isolated lives add value. Principle says they worsen average → A better. **You should drop this verdict** (see below). |
  | (7a) A + one @ −10 < A | Worse | Adds negative value: \( V(A) - 10 \) < \( V(A) \) | ✅ | |
  | (7b) Add +1 life | Optional | AACL unchanged if original >0? \( V \) increases slightly but near-neutral. | ✅ | |

  **Repairs Made**:  
  - Removed baseline subtraction (\( c \)) to fix Case 2.  
  - Used unweighted AACL: \( \text{AACL}(P) = \frac{\sum_{w_i > 0} w_i}{|P_+|} \).  
  - Dilution penalty: \( V(P) = \text{AACL}(P) \times \log(1 + |P_+|) \).  

  **Where It Breaks**: Case 6. Your intuition that isolated lives might not add value conflicts with the math.  

  ---

  ### Verdict to Withdraw: Case 6
  **Why**: If welfare has intrinsic value (per Cases 1, 2, 5), location shouldn’t matter. Your hesitation in Case 6 contradicts your strong total-rejection of Z (Case 4) and your acceptance of adding non-isolated lives (Case 2). Isolating the +40 lives doesn’t erase their welfare; it only severs causal ties. If you value welfare, severing ties shouldn’t negate it. Drop this verdict to preserve consistency.  

  ---

  ### Answers to Open Questions
  1. **Is any finite population at +1 better than 1,000 at +100?**  
     → **No**. For \( n \) people at +1:  
     \( V = 1 \times \log(1 + n) \).  
     Maxes out at ~22 for \( n = 10^{100} \).  
     \( V(A) = 100 \times \log(1000) \approx 690 \).  
     **No finite number suffices**.  

  2. **A + 1M at +1 vs A alone?**  
     - A alone: \( V = 100 \times \log(1000) \approx 690 \).  
     - A + 1M@+1: AACL = \( \frac{100 \times 1000 + 1 \times 1e6}{1.001e6} \approx 1.099 \),  
       \( V \approx 1.099 \times \log(1.001e6) \approx 12.1 \).  
     → **Worse than A alone** (12.1 < 690).  

  3. **2M at +50 vs 1M at +100?**  
     - 1M@100: \( V = 100 \times \log(1e6) \approx 1382 \).  
     - 2M@50: \( V = 50 \times \log(2e6) \approx 50 \times 14.5 \approx 725 \).  
     → **1M at +100 is better** (1382 > 725).  

  ---

  ### Implication for Your Panel’s Dilemma
  **How to weigh averted deaths vs. quality gains**:  
  - **Averting child deaths**: Each death averted adds a life >0 (decades at modest welfare). High AACL impact (lives start near 0, so added welfare is significant).  
  - **Curing chronic pain**: Smaller quality gain per person, but applied to existing lives >0.  
  - **The principle favors averted deaths** when:  
    (a) Lives saved are far above critical (e.g., +20 vs. near 0),  
    (b) Gains per person are large, and  
    (c) Population size isn’t so vast that dilution penalty dominates.  

  **Concrete advice**: Prioritize proposals where:  
  \[
  \frac{\text{Gain per person}}{\text{Current welfare}} \times \log(\text{Population size})
  \]  
  is larger. Averting deaths in poor regions often wins because gains are large (0→+X), outweighing modest quality improvements unless the chronic condition is devastating (e.g., welfare from +10 to +90).  

  **Example**: Saving 10,000 children (0→+30 for 50 years) vs. curing 1,000 people of severe pain (+20→+80).  
  - Averted deaths: AACL gain ≈ +30, \( V \propto 30 \times \log(10k) \approx 138 \).  
  - Quality gain: AACL gain ≈ +60, \( V \propto 60 \times \log(1k) \approx 138 \).  
  → Tie. But if children’s lives are longer/higher quality, or chronic group is smaller, deaths averted win.  

  --- 

  ### Final Note
  This principle avoids repugnance (Case 4), values distribution (Case 5), and handles scaling (Case 3). It requires calibrating the log base to your "step down" tolerance (Case 3). If adding 8,000 at +20 feels worse than 1,000 at +100, increase the penalty (use log base 2). The math is hand-applicable: compute average welfare above 0, take log of population size, multiply.
