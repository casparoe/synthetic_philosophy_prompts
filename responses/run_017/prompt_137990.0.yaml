prompt: |-
  Hey — I run a small decision-theory reading group out of a pub back room, and we just finished the stretch on coherence arguments: Dutch books, money pumps, the representation theorems, the whole idea that being exploitable shows you're not an expected-utility maximizer. The group split in a way I found interesting and want to make fun of. Half of them came away thinking this is the practical part of the syllabus — here's a proof that your preferences have to be transitive and here's a quantity you should go maximize. The other half came away thinking it's close to empty, because utility is defined off your preferences and seemingly any agent who isn't outright cyclic can be represented as maximizing something, so the advice "maximize expected utility" might not say anything about what to do on Tuesday. I need one centerpiece for the zine I'm putting together for the last session, and I don't want it to be a lecture — I want it to be funny in a way that makes the second half's worry unavoidable.

  So: write it as a fake one-page insurance policy, 700-800 words, deadpan insurance-legalese, with a letterhead, a schedule of covered perils, numbered clauses, an exclusions section, a claims procedure, and one short testimonial from a satisfied customer. It's from a company that insures you against being money-pumped or Dutch-booked. No real philosophers named anywhere, invented spokespeople only, and no winking: nobody in the document should announce that the joke is that the coverage is circular. All the humor has to come from getting the arguments right — I want people who've actually read them to laugh and then feel slightly bad about it.

  Specific things I want in there, worked into the fine print rather than listed: the difference between a sure loss in money and a cycle in your own preferences, plus the fact that the company settles claims only in utils, at an exchange rate it sets itself after reviewing what you in fact chose; the customer who defeats the pump by simply declining the last trade in the sequence and is therefore denied coverage; the assumption that someone out there knows your preferences and will keep offering you the same series of trades until you're bled dry; the assumption that what a whole sequence of choices is worth is just the sum of what its steps are worth; and the way your preferences have to be cleaned up before coherence can even be assessed — no regret, no caring about how an outcome was produced, no caring whether uncertainty gets resolved early or late, no caring about what else happened to be on the menu, and nothing at all that you refuse to trade off against money — with the company charging a processing fee, in utils, for performing that cleaning on your behalf. The climax should be the eligibility clause: the policy only covers agents who were already representable as expected-utility maximizers. End with the testimonial from someone who's been made coherent and can now rank his own death against a modest sum of money, and I want the last line to leave a reader who knows the literature with the real question — whether these arguments establish a requirement of rationality, or just attach a price tag to inconsistency and quietly assume everything they were supposed to prove.
reasoning: |-
  We are going to create a one-page insurance policy document in a deadpan, legalese style. The document should be structured with:
  - A letterhead (company name and logo placeholder)
  - Sections: Schedule of Covered Perils, Policy Clauses, Exclusions, Claims Procedure, and a Testimonial.

  Key elements to include:
  1. The difference between a sure loss (Dutch book) and a cycle in preferences (money pump).
  2. The company settles claims in utils at an exchange rate set by the company after reviewing the choices.
  3. Exclusion for a customer who defeats the pump by declining the last trade (thus breaking the cycle) and is denied coverage.
  4. Assumption that there exists an adversary who knows your preferences and will keep offering the trades until you are bled dry.
  5. The value of a sequence of choices is the sum of the values of the steps.
  6. The requirement that the insured must have "cleaned up" preferences: no regret, no path-dependence, no care about when uncertainty is resolved, no menu-dependence, and everything must be tradeable against money. The company charges a fee (in utils) for performing this cleaning.
  7. The eligibility clause: the policy only covers agents who were already representable as expected-utility maximizers.
  8. Testimonial from a satisfied customer who can now rank his own death against a modest sum of money.

  The last line of the testimonial should leave the reader with the question: do these arguments establish a requirement of rationality, or just attach a price tag to inconsistency and assume what they were supposed to prove?

  Let's structure the document accordingly.

  ---

  **Document: One-Page Insurance Policy**

  **Letterhead:**

  COHERENT RISKS ASSURANCE GROUP  
  *"Ensuring Your Preferences Are Pre-Ordained"*

  ---

  **POLICY SCHEDULE**

  **Policyholder:** [Insert Name]  
  **Policy Number:** CRAG-XXXXX  
  **Effective Date:** [Date]  
  **Premium:** Paid in full (non-monetary consideration in utils, as assessed)  

  ---

  **SCHEDULE OF COVERED PERILS**

  **Peril 1: Dutch Book Exploitation**  
  Losses arising from a finite series of bets or transactions, offered sequentially or simultaneously, such that the aggregate outcome for the Policyholder is a sure loss in monetary terms, regardless of future states of the world.

  **Peril 2: Money Pump Exploitation**  
  Losses arising from a sequence of trades or choices offered to the Policyholder in which, due to cyclical preferences (intransitivity), the Policyholder is induced to accept a series of exchanges that result in a net loss of resources, returning the Policyholder to a state strictly dominated by the initial state.

  ---

  **CLAUSES**

  1. **Definitions**  
     a. "Sure Loss" means a loss that is certain to occur in all possible states of the world.  
     b. "Cyclical Preferences" means a sequence of strict preferences A > B, B > C, and C > A, or any longer cycle, that can be exploited by a sequence of trades.  
     c. "Utils" are units of utility as defined by the Policyholder's coherent preferences, as determined by the Company.

  2. **Coverage Trigger**  
     Coverage is triggered only upon full execution of an exploiting sequence by the Policyholder, resulting in a net loss as defined in the Covered Perils. The sequence must be offered by an adversarial agent who knows the Policyholder's preferences and persists until the loss is realized.

  3. **Settlement**  
     a. All claims are settled in utils.  
     b. The exchange rate between monetary loss (or other resource loss) and utils shall be determined by the Company, based on a retrospective review of the Policyholder's choices in the exploiting sequence and related transactions.  
     c. The utility loss compensated shall be the sum of the utility losses of each step in the sequence, as computed by the Company.

  4. **Eligibility Requirement**  
     The Policyholder must, at the time of policy inception and throughout the policy period, be representable as an expected utility maximizer. This representation must be confirmed by the Company's Coherence Audit (see Clause 6).

  5. **Preference Cleaning Service**  
     a. The Policyholder may engage the Company to perform a Preference Coherence Audit and Cleaning, for a non-refundable fee in utils.  
     b. The Cleaning process will remove:  
        - Regret or other emotional responses to past choices.  
        - Path-dependence (care about how an outcome was produced).  
        - Time of uncertainty resolution (care about whether uncertainty is resolved early or late).  
        - Menu-dependence (care about what other options were available).  
        - Any non-tradeable attribute (i.e., any attribute not fungible with money at some exchange rate).  
     c. The Cleaning fee shall be deducted from the Policyholder's utility endowment as assessed by the Company.

  6. **Coherence Audit**  
     Prior to policy issuance, the Company will conduct an audit to verify that the Policyholder's preferences satisfy the axioms of expected utility theory (completeness, transitivity, continuity, and independence). The Policyholder must pass this audit to be eligible for coverage.

  ---

  **EXCLUSIONS**

  1. **Incomplete Exploitation**  
     No coverage is provided if the Policyholder, at any point in the exploiting sequence, declines a trade that would have completed the cycle or sure loss. Specifically, if the Policyholder breaks the cycle by refusing a trade (e.g., refuses the last trade that would complete the money pump), this exclusion applies.

  2. **Non-Adversarial Context**  
     Losses arising from sequences not offered by an adversarial agent with complete knowledge of the Policyholder's preferences and the intent to exploit are excluded.

  3. **Non-Compensable Losses**  
     Losses that cannot be expressed in utils, as defined by the Company, are excluded.

  4. **Failure of Representation**  
     If, at any time, the Policyholder's preferences cannot be represented by a real-valued utility function (up to affine transformation), the policy is void.

  ---

  **CLAIMS PROCEDURE**

  1. **Notification**  
     The Policyholder must notify the Company within 24 hours of the completion of the exploiting sequence.

  2. **Documentation**  
     The Policyholder must submit a complete record of the sequence of choices, including all offers, acceptances, and the resulting outcomes.

  3. **Adjustment**  
     The Company will conduct a review to:  
     a. Verify that the sequence qualifies as a Covered Peril.  
     b. Determine the utility loss by summing the utility decrements for each step.  
     c. Set the exchange rate for converting the resource loss to utils.  

  4. **Settlement**  
     The Company will issue a utility credit to the Policyholder's account to offset the loss, minus any applicable fees.

  ---

  **TESTIMONIAL**

  *"After years of being cycled through money pumps by my so-called 'friends', I finally have peace of mind. Coherent Risks Assurance Group performed their Preference Cleaning service, and now I see the world with perfect clarity. Last Tuesday, I was confronted with a choice between accepting a $5 payment and a 0.0001% chance of death. Thanks to CRAG, I could rank these options without hesitation. The policy paid out when I got Dutch-booked at the racetrack — the utility adjustment was swift and fair. I sleep better knowing I'm coherent, even if I had to be made coherent first. It's worth every util!"*  
  **– Bernard P., Satisfied Customer**

  ---

  **FINAL NOTICE**

  The protection afforded by this policy is contingent upon the Policyholder's pre-existing coherence. Coherent Risks Assurance Group makes no warranty that the avoidance of exploitation constitutes rational agency, nor that the utility representation provided reflects any objective value. The policy merely quantifies the cost of inconsistency in a unit defined by the consistency it assumes.

  ---
