  ### **COHERENT CHOICE ASSURANCE, LTD.**  
  *"Because Your Preferences Should Be as Predictable as Our Premiums"*  

  **POLICY NUMBER:** CCA-114-Δ-9  
  **EFFECTIVE DATE:** [DATE OF LAST COHERENCE AUDIT]  
  **POLICYHOLDER:** [NAME], HEREINAFTER "THE INSURED"  
  **PREMIUM:** 2.5 UTILS (PAID IN ADVANCE VIA PREFERENCE RECTIFICATION FEE)  

  ---

  ### **SCHEDULE OF COVERED PERILS**  
  **1. DUTCH BOOK EXPLOITATION:** Losses arising from acceptance of a finite set of wagers, jointly guaranteeing a net monetary loss in all possible states of the world.  
  **2. MONEY PUMP EXPLOITATION:** Losses arising from sequential trades exploiting cyclical preferences (A>B, B>C, C>A), resulting in depletion of assets after returning to the initial state or worse.  
  **3. PRE-EXPLOITATION ANXIETY:** Utilitarian distress (≤0.8 utils) from credible threats of Perils 1 or 2 by adversarial agents with perfect knowledge of the Insured’s preferences.  

  *(Note: Coverage requires proof of exploitation by a persistent adversary offering identical trades until loss occurs.)*  

  ---

  ### **CLAUSES**  
  **1. SETTLEMENT MECHANISM**  
  1.1. Claims paid solely in utils (u), convertible to monetary compensation at Coherent Choice’s sole discretion.  
  1.2. Exchange rate determined post-claim via retrospective review of the Insured’s choices in the exploiting sequence.  
  1.3. Total loss = Σ (util decrement per trade step). Sequence valuation is strictly additive.  

  **2. PREFERENCE SANITIZATION SERVICE**  
  2.1. Mandatory pre-enrollment audit (§4) includes "Coherence Purification" (fee: 1.5u).  
  2.2. Purification removes:  
  - Regret, path-dependence, or care about outcome provenance.  
  - Temporal resolution bias (e.g., caring if uncertainty resolves pre/post-choice).  
  - Menu-dependence (e.g., valuing A higher when B is unavailable).  
  - Any "sacred value" resisting trade-offs with currency.  
  *(Result: Preferences rendered machine-readable.)*  

  **3. EXPLOITATION VERIFICATION**  
  3.1. Claims require video evidence of the Insured completing all trades in the adversarial sequence.  
  3.2. Adversary must be identifiable (e.g., "Dave the Dutch Bookie, ID# DB-774").  

  ---

  ### **EXCLUSIONS**  
  **1. CYCLE INTERRUPTION:** Claims void if the Insured declines any trade in the exploiting sequence (e.g., refusing the final trade in a money pump).  
  **2. NON-ADDITIVE SEQUENCES:** Losses from trades where the util value of the sequence ≠ Σ util value of steps.  
  **3. COUNTERFACTUAL REGRET:** Losses arising from the Insured’s post-hoc dissatisfaction with purified preferences.  
  **4. NON-ADVERSARIAL CONTEXTS:** Exploitation by agents unaware of the Insured’s preferences.  
  **5. NON-QUANTIFIABLE LOSSES:** E.g., "I feel foolish."  

  ---

  ### **ELIGIBILITY REQUIREMENTS**  
  **SECTION 4: COHERENCE AUDIT**  
  4.1. The Insured must satisfy the axioms of expected utility theory *prior* to coverage:  
  - Completeness (A≥B or B≥A for all A,B).  
  - Transitivity (A≥B and B≥C ⇒ A≥C).  
  - Continuity (if A≥B≥C, ∃p: [pA + (1-p)C] ~ B).  
  - Independence (A≥B ⇒ [pA + (1-p)C] ≥ [pB + (1-p)C]).  
  4.2. Audit fee: 1.0u (deducted from initial util endowment).  
  4.3. Failure voids policy; no refunds.  

  *(Coverage is limited to agents already representable as EU-maximizers.)*  

  ---

  ### **CLAIMS PROCEDURE**  
  1. Notify Coherent Choice within 24hrs of exploitation completion.  
  2. Submit:  
     - Form CC-114Δ ("Sworn Affidavit of Cyclical Shame").  
     - Video evidence of full trade sequence.  
     - Adversary’s written testimony (notarized).  
  3. Coherent Choice computes loss:  
     Step 1: Assign utils to each outcome per post-audit preferences.  
     Step 2: Sum util differentials across trades.  
     Step 3: Convert to currency at rate: **$1 = [1 / Insured’s marginal $ utility]** utils.  
  4. Payout issued as util credit or check (less 0.3u processing fee).  

  ---

  ### **SATISFIED CUSTOMER TESTIMONIAL**  
  > *"I used to get pumped weekly by my barista over coffee upgrades (tall > grande > venti > tall). After Coherent Choice’s Purification, I’m bulletproof! They audited me, charged 2.5 utils, and now I rank outcomes cleanly: death = -1,000,000u, skipping lunch = -5u. Last month, Dave the Dutch Bookie sold me ‘guaranteed loss’ combo bets. CCA paid 47.3 utils—enough to offset my bankruptcy! Sure, they set the exchange rate so $1,000 = 0.1u, but coherence is priceless. I’d recommend them to anyone, provided your preferences are already coherent enough to want this."*  
  > **— BERNARD T., PORTLAND, OR**  

  ---

  **FINAL DISCLOSURE:** Coherent Choice Assurance, Ltd., does not guarantee rational agency. Coverage presupposes the Insured’s pre-existing utility-maximization capacity. By endorsing this policy, the Insured acknowledges that coherence is either:  
  (a) A necessary condition of rationality, or  
  (b) A costly label for preferences we assumed you had anyway.  
  Claims disputes settled by binding arbitration in the Hilbert Space Court of Pure Reason.  

  ---  
  *CCA Form 114-Δ Rev. 7 | © 2023 Coherent Choice Assurance, Ltd. | "We Monetize Your Axioms"*  

  ---  
  **ZINE FOOTNOTE (FOR YOUR EYES ONLY):** The testimonial’s final line—*"coherent enough to want this"*—nails the circularity. Bernard’s "priceless" coherence cost him 2.5 utils + his humanity (death = -1e6u!). The document never admits the joke, but the eligibility clause (covering only the already-coherent) and util-based fees make it scream "tautology." Readers who know Dutch books will laugh at the exclusion for "cycle interrupters" (declining the last trade breaks the pump!) and wince at the additive-sequence assumption. The real question hides in plain sight: Is this policy a shield against folly, or a util-charging mirror for preferences we never proved you should have?
