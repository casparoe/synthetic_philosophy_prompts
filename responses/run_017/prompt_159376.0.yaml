              sum_id | person_id | valid_from | valid_to 
              s1     | p1        | 2020-01-01|2020-12-31

          But note: the original `person_parts` table does not store every possible part. It stores the minimal parts (say, by day or by change event). But arbitrary sums can be formed by grouping any set of these parts.

          However, in a database, we don't typically store every arbitrary sum. We store the base parts. Then we can query arbitrary sums by defining a view that groups certain parts. But the view is not stored as an entity with its own key.

          The objection in metaphysics is that the perdurantist is committed to the existence of all these arbitrary sums. How do we represent that in the database? We would have to have a table that stores every possible sum? That is not feasible.

          Alternatively, we can note that the database does not prevent us from defining a view for any arbitrary sum. The view is virtual, but it represents the sum.

          However, the perdurantist might say that the maximal person (the whole worm) is the one that we have designated as the primary entity (with person_id = p1). The smaller ones are not given their own primary keys? But we can give them keys if we want.

