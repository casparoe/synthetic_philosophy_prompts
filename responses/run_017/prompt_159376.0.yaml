          But the translation is straightforward. So we say it translates cleanly.

   4. Objection to perdurantism: unrestricted composition and maximality.

      Metaphysical objection:
          - Perdurantism holds that objects have temporal parts. If composition is unrestricted, then for any arbitrary set of temporal parts that overlap in time (or not) we can form an object (a "sum"). So a person (a four-dimensional worm) would have as parts many shorter-lived person-like sums (e.g., the first half of the person, or every other day). The problem: why is the person the maximal worm and not one of the smaller ones?

