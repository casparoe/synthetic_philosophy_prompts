prompt: |-
  I have been reading about moral uncertainty on my own over the past year — I have no academic background in philosophy, just a stack of popular books and a lot of forum threads — and the move I keep running into is that being unsure which moral theory is correct is supposed to work exactly like being unsure about some ordinary matter of fact. You list the possibilities, attach a probability to each, score every option under each possibility, and take the option with the highest expected score. The people who lean on this comparison then use it to license two conclusions that I find quite different in plausibility:

  1. that I should hedge my giving — split my donations between, say, a cause that looks best on my own favorite view and a cause that looks best on a view I think is probably wrong but not certainly wrong, so that I do tolerably well either way; and
  2. that very small credences in theories that posit astronomically large stakes can legitimately swamp everything else, so that a fraction of a percent of confidence that some huge number of beings matter morally can make that the only thing worth funding.

  I have already noticed one place the comparison seems to strain: when I try to score the same option under two different theories, the numbers come from different theories' own scales, and if I am allowed to multiply one theory's scale by a constant, I can change which option wins. I have also read that under ordinary factual uncertainty there is usually some story about repeated similar cases and long-run frequencies that backs up expected-value reasoning, and I cannot see what plays that role here, since many of the choices in question are one-off.

  Before I let the analogy do any work for me, I would like an audit of it, written so that a careful non-specialist can follow the technical parts:

  - Lay out the mapping explicitly — a correspondence table is welcome. What plays the role of the sample space, of an outcome, of a probability measure, of the value function, of learning from evidence, and of the justification for aggregating by weighted addition? Be explicit about which elements of the factual case have no partner in the moral case.
  - Then separate the disanalogies that matter for the two conclusions above from the ones that are merely decorative. I suspect some breaks sink conclusion 2 while leaving conclusion 1 intact, but I would like that argued rather than asserted.
  - Tell me whether either conclusion survives once the breaks are on the table, and if one does, what the weakest link in the surviving argument is.
  - I have a patch of my own that I would like tested rather than flattered. Instead of adding each theory's normalized score, normalize each theory's scale against one fixed reference pair (the difference between a normal life and a life of unrelenting agony, say) and then multiply the normalized scores rather than add them, on the model of the multiplicative rule used in a standard two-person bargaining solution — the thought being that multiplication is unaffected if one theory's units are rescaled, and that it gives each theory something like a veto, so a single theory positing enormous stakes cannot dominate all by itself. Does this actually solve the scale problem, relocate it, or add new problems of its own (for instance about how the reference pair gets chosen, or about theories that return zeros or infinities)?
  - Does the analogy, taken seriously, also recommend spending on moral information in the way it recommends spending on factual information, and if so what could that even consist of?
  - If the uncertainty-is-just-uncertainty comparison is the wrong one, what is the closest analogy that does the work people want from it? I have seen being unsure which expert to trust, and being subject to several overlapping legal systems at once, floated as alternatives, but I do not trust my sense of which features each of those imports.

  In your answer, please say plainly which parts of what you tell me are things people working on this would mostly agree about, which are contested, and which are your own judgment. I would also like to know what would change your verdict — the one argument or consideration that would move you, and the place in your own reasoning where you think it is most likely to have gone wrong. Please write in American English.
reasoning: |-
  Okay, the user has been diving into moral uncertainty on their own, reading popular books and forum threads. They're grappling with the analogy between moral uncertainty and factual uncertainty. Specifically, they're questioning whether the expected value approach—where you assign probabilities to different moral theories and calculate expected scores—holds up, especially regarding two conclusions: hedging donations and allowing small credences in high-stakes theories to dominate decisions.

  First, I need to lay out the mapping between factual and moral uncertainty. The user wants a clear correspondence table. Let me break it down. In factual uncertainty, we have a sample space of possible states of the world. For moral uncertainty, it's the set of possible moral theories. Outcomes become the moral evaluations of actions under each theory. Probabilities are credences assigned to each theory. The value function is each theory's scoring system for actions. Learning from evidence works similarly through updating credences based on moral intuitions or coherence. Aggregation is done via weighted addition of these scores.

  But where the analogy strains is in the normalization of value functions. In factual uncertainty, utilities are intertheoretically comparable, like money. But moral theories use different scales—utilitarianism in QALYs, deontology in categorical scores. If you rescale one theory's scores, the outcome changes. That's a big disanalogy. Also, the long-run frequency justification doesn't apply here since many moral decisions are one-offs. So the expected value approach lacks that foundation in moral contexts.

  Now, addressing the two conclusions. Conclusion 1, about hedging donations, might still hold. Even without perfect scaling, if you use a neutral normalization (like the reference point of agony vs. normal life), splitting donations could be a way to avoid catastrophic failure under any theory. It's like diversifying investments. But conclusion 2 is shakier. Small credences in high-stakes theories dominating relies entirely on scale normalization. If different normalization methods change the outcome, it's arbitrary. The user's multiplicative normalization idea is interesting—it avoids scale dependence and gives each theory veto power. But it has issues. What if a theory assigns zero to an option? The whole product becomes zero. Infinities are problematic too. And choosing the reference pair is subjective; different choices could lead to different results. Also, theories that don't recognize the reference pair (like those valuing ecosystems over individuals) complicate things.

  The user also asks about spending on moral information. In factual uncertainty, you invest in information gathering to reduce uncertainty. For moral uncertainty, this could mean studying philosophy, engaging in dialogues, or reflecting on intuitions. But it's trickier because moral evidence isn't empirical; it's more about coherence and reflective equilibrium. However, there's no clear convergence in moral philosophy, so the payoff is uncertain. This might not be as straightforward as factual information gathering.

  Alternative analogies? The user mentions trusting experts or overlapping legal systems. Expert advice requires weighting experts, which circles back to the same scaling problem. Legal systems analogy involves jurisdictional boundaries, but moral theories often conflict without clear boundaries. Neither fully resolves the core issues.

  Consensus-wise, most philosophers agree that moral uncertainty is a real problem and that some form of aggregation is needed. The expected value approach is common in literature but heavily criticized for scale variance. The user's multiplicative method is novel but untested; it's their own idea. The biggest challenge is the normalization problem, which remains unresolved.

  If new arguments emerged—like a compelling way to intertheoretically compare moral value scales—that could change the verdict. But as it stands, the lack of a privileged normalization method undermines the expected value approach, especially for conclusion 2. The user's multiplicative idea is creative but introduces new issues. They're on the right track by identifying the scale problem and seeking alternatives. Their deep engagement with the material shows they've thought critically about the analogy's limits, which is exactly what's needed here.
answer: |-
  Here's a comprehensive audit of the moral uncertainty/factual uncertainty analogy, addressing your points directly and separating consensus, controversy, and my own judgment.

  **1. The Mapping: Factual Uncertainty → Moral Uncertainty**

  | Factual Uncertainty Element      | Moral Uncertainty Element                                                                 | Correspondence Notes & Disanalogies                                                                 |
  | :------------------------------- | :---------------------------------------------------------------------------------------- | :-------------------------------------------------------------------------------------------------- |
  | **Sample Space (Ω)**             | Set of possible **moral theories** (T₁, T₂, ..., Tₙ) considered live options.             | Similar: Exhaustive (within consideration), mutually exclusive possibilities. Disanalogy: Moral theories are often less precisely defined than states of the world; the "space" may be fuzzy. |
  | **Outcome/State of World (ω ∈ Ω)** | **A specific moral theory Tᵢ being the "correct" or "most justified" one.**              | Similar: The fundamental uncertainty is about which possibility obtains. Disanalogy: What "correct" means metaphysically is contested (mind-independent truth vs. best systematization of intuitions). |
  | **Probability Measure (P)**      | **Credence (cᵢ)** assigned to each moral theory Tᵢ (Σcᵢ = 1).                             | Similar: Degrees of belief/confidence in each possibility. Disanalogy: Eliciting stable, consistent credences over complex theories is harder than over empirical facts. "Evidence" is often coherence-based, not purely empirical. |
  | **Value Function (V(A \| ω))**   | **Moral Value Function (MVᵢ(A))** assigning a numerical score to action A under theory Tᵢ. | **CRITICAL DISANALOGY:** `V` is usually measured in a *common, intertheoretically comparable unit* (e.g., dollars, utils). `MVᵢ` uses *theory-specific scales* (QALYs, "duty-fulfillment units," "virtue points"). There is **no privileged way to normalize scales across theories**. Rescaling any MVᵢ by a positive constant changes the Expected Moral Value (EMV) winner. This is the **Scale Variance Problem**, fatal to naive EMV. |
  | **Learning from Evidence (E)**   | **Moral Reflection/Information (Eₘ)**: New arguments, intuitions, thought experiments, empirical facts relevant to moral reasoning. | Similar: Bayes' rule formally applies: P(Tᵢ\|Eₘ) ∝ P(Eₘ\|Tᵢ) * P(Tᵢ). Disanalogy: Moral "evidence" Eₘ is heavily contested. Updating often relies on reflective equilibrium, not objective likelihoods. Convergence is less common than in science. |
  | **Aggregation: Expected Value**  | **Expected Moral Value (EMV)**: EMV(A) = Σ [cᵢ * MVᵢ(A)]                                  | **CRITICAL DISANALOGY:** Justification for maximizing EV relies on **long-run frequencies** (law of large numbers) or **rational choice axioms** (Savage, Von Neumann-Morgenstern). Moral choices are often high-stakes **one-offs** with no "long run." Applying VNM axioms across fundamentally different value structures is deeply problematic. Weighted addition *assumes* scale comparability, which doesn't exist. |
  | **Justification for Aggregation**| **Assumed Rational Requirement** (Controversial)                                           | *No direct partner.* The long-run justification fails (one-offs). Axiomatic justifications (like avoiding "money pumps") are weak or inapplicable to moral uncertainty. This is the core weakness. |

  **2. Disanalogies & Impact on Conclusions 1 and 2**

  *   **Scale Variance Problem (MVᵢ scales incomparable):**
      *   **Conclusion 1 (Hedging):** **Less affected.** If you can find a *plausible* normalization (e.g., anchoring on a shared reference point like "preventing agony"), hedging *can* make sense. Even without perfect comparison, avoiding catastrophic failure under any plausible Tᵢ is prudent. Splitting donations between a human-focused and animal-focused charity, given uncertainty about moral patienthood, exemplifies this intuition. *Argument for survival:* Hedging is robust across many *reasonable* normalizations if theories disagree significantly on the "best" cause.
      *   **Conclusion 2 (Pascal's Mugging):** **Fatal.** Conclusion 2 *entirely depends* on how you normalize scales. Rescaling the "high-stakes" theory by a tiny constant can make its contribution negligible. Normalization is arbitrary; no method is universally accepted. A tiny credence in a theory with arbitrarily rescaled high stakes lacks normative force. *Argument for rejection:* The dominance result is an artifact of arbitrary scaling choices, not a genuine implication of rational uncertainty.
  *   **Lack of Long-Run Justification (One-off choices):**
      *   **Conclusion 1:** **Problematic but potentially surmountable.** The long-run justification fails, weakening the *theoretical* foundation. However, the *pragmatic* intuition of "not putting all eggs in one basket" for high-stakes, irreversible decisions under deep uncertainty remains strong, even for one-offs (e.g., pandemic preparedness). This intuition can partially support hedging independently of strict EMV.
      *   **Conclusion 2:** **Severely weakens.** The long run is where low-probability, high-impact events reliably dominate. In a one-off, relying on an arbitrarily scaled tiny-credence theory feels irrational/gambling, not prudent.
  *   **Fuzzy/Incompatible Theories:**
      *   **Both Conclusions:** **Complicates application.** Theories often aren't fully specified, overlap, or address different questions. Defining the "score" MVᵢ(A) can be ambiguous. This makes precise calculation impossible, favoring more qualitative approaches like hedging (C1) over precise dominance claims (C2).

  **3. Survival of Conclusions:**

  *   **Conclusion 1 (Hedging):** **Likely survives, but weakened and needs different justification.** The core intuition of avoiding catastrophic moral failure under plausible rivals remains compelling, even absent perfect EMV. Its justification shifts from formal EMV optimization to **prudence under deep normative uncertainty** or **avoiding maximal regret**. The weakest link is defining what counts as "tolerably well" or "catastrophic failure" across theories without perfect scaling.
  *   **Conclusion 2 (Pascal's Mugging):** **Does not survive intact.** The argument collapses under the scale variance problem and the lack of a long run. Tiny credences in arbitrarily high-stakes theories cannot reliably swamp everything else. At best, *moderate* credences in *plausibly scaled* high-stakes theories (e.g., 10% credence in significant animal suffering mattering) could justify significant allocation, but not total dominance based on infinitesimal credence. The weakest link (fatal flaw) is the **arbitrariness of scale normalization**.

  **4. Testing Your Multiplicative Patch**

  *   **The Proposal:** Normalize each theory's scale using a fixed reference pair (e.g., ΔV_ref = Moral Value(Normal Life) - Moral Value(Unrelenting Agony) = 1 unit). Then, for an action A, calculate its "Normalized Moral Value Ratio" under Tᵢ: NMVRᵢ(A) = [MVᵢ(A) - MVᵢ(Status Quo)] / ΔV_refᵢ. Aggregate via multiplication: Total Score(A) = Π [NMVRᵢ(A)]^cᵢ (or similar weighted geometric mean).
  *   **Analysis:**
      *   **Solves Scale Variance?** **Yes, for rescaling within a theory.** Multiplying ratios is invariant to linear rescaling of any individual MVᵢ (multiplying MVᵢ by k multiplies NMVRᵢ by k, but (k * NMVRᵢ)^cᵢ ∝ NMVRᵢ^cᵢ since k^cᵢ is constant across actions). This is a major advantage over additive EMV.
      *   **Relocates/Adds Problems?** **Yes, significantly:**
          1.  **Choice of Reference Pair (ΔV_ref):** This is **highly subjective and contentious**. Why agony vs. normal life? Is this pair meaningful to all theories (e.g., ecosystem-focused views, pure deontology focused on duties rather than states)? Different choices dramatically alter results. *This replaces scale variance with **reference pair variance**.*
          2.  **Zeros and Infinities:** A theory Tⱼ assigning NMVRⱼ(A) = 0 (e.g., deeming A intrinsically evil) makes Total Score(A) = 0, regardless of other theories. Is this a desirable "veto" or too strong? Infinities (e.g., theories where ΔV_ref is infinitesimal compared to cosmic stakes) cause similar breakdowns. Handling these requires ad-hoc limits (e.g., clamping values), undermining elegance.
          3.  **Interpretation & Justification:** What does the *product* of normalized ratios represent? The multiplicative rule is inspired by Nash bargaining, but bargaining solutions assume parties *bargaining for mutual benefit*, not aggregating beliefs about truth. The justification for this specific functional form under moral uncertainty is unclear. It heavily privileges actions *all* theories see as somewhat positive over actions some love and others hate.
          4.  **Status Quo Baseline:** Requires defining a baseline action ("Status Quo"), which is often ambiguous.
          5.  **Theories Valuing Differently:** A theory focused on minimizing agony might see ΔV_ref as huge, while a theory focused on maximizing artistic flourishing might see it as small. Normalization doesn't solve *this* kind of difference in relative weighting.
      *   **Veto Power:** Yes, it achieves this. A theory given even small credence can veto actions it scores as NMVRᵢ(A) ≤ 0. This directly counters Conclusion 2's swamping.
  *   **Verdict:** Your patch **solves the linear scale variance problem** but **introduces new, significant problems** (reference pair choice, veto strength, interpretation). It's a creative approach (your own idea - not standard in literature), worthy of exploration, but not an unproblematic solution. It likely **relocates** the core difficulty from scaling to choosing the reference pair and justifying the multiplicative aggregation.

  **5. Spending on Moral Information**

  *   **Analogy Suggests:** Yes, the analogy suggests spending resources to reduce moral uncertainty (gathering "moral evidence" Eₘ) should be evaluated similarly to gathering factual evidence: calculate the Expected Value of Information (EVOI) for potential moral inquiries.
  *   **What Could It Consist Of?**
      *   **Formal Study:** Reading philosophy, taking courses, attending lectures/conferences.
      *   **Deliberation:** Structured reflection, discussing with diverse viewpoints, engaging with critics, using thought experiments.
      *   **Empirical Research Relevant to Moral Theories:** E.g., studying animal cognition for animal ethics, psychology for virtue ethics/consequentialism, sociology for justice theories.
      *   **Experiential Learning:** Exposure to different life situations, cultures, or perspectives to challenge intuitions.
  *   **Challenges:**
      *   **Quantifying EVOI:** Extremely difficult. How much will your credences change? How will changed credences change your actions? What's the moral value of those changed actions? Scale variance plagues all steps. This is computationally intractable.
      *   **Diminishing Returns/Margin:** Initial study yields high returns; deep academic debate often yields less certainty. Spending the *next* dollar on direct help vs. moral info needs comparison.
      *   **No Guarantee of Convergence:** Unlike factual inquiry, moral inquiry often doesn't converge on an answer. Spending might reduce confidence in *all* theories without increasing confidence in any one.
  *   **Survival:** The analogy *suggests* spending on moral information is important. A weaker, more defensible conclusion is: **Allocate *some* resources to reducing profound moral uncertainty, especially when choices are recurring, stakes are high, and tractable avenues for clarification exist.** Justifying the *amount* via strict EVOI calculation seems infeasible.

  **6. Closer Analogies?**

  *   **Unsure Which Expert to Trust:** Maps well to having credences over *interpreters* of a single moral reality. But the core problem remains: How to aggregate the *advice* of experts using *different scales*? It inherits the scale variance problem. It emphasizes epistemic sources but doesn't solve aggregation.
  *   **Subject to Overlapping Legal Systems:** Maps well to being bound by multiple rule-sets. Solutions involve:
      *   *Conflict Rules:* Pre-defined hierarchies (e.g., Federal > State). No equivalent in moral uncertainty.
      *   *Harmonization:* Finding actions legal under all systems. Analogous to seeking "non-rejectable" actions under your multiplicative rule or "common ground" hedging.
      *   *Worst-Country Rules:* Comply with the strictest system. Analogous to a max-min rule under moral uncertainty.
      *   **Verdict:** This analogy is **potentially closer for Conclusion 1 (hedging/seeking common ground)** and your multiplicative veto, as it deals with conflicting normative authorities without assuming a common scale. It highlights coordination under plural authority. It **fares worse for Conclusion 2**, as legal systems don't typically posit astronomically scalable penalties based on tiny jurisdictional claims. The lack of a meta-conflict rule is the key similarity to moral uncertainty.

  **Consensus, Controversy, and My Judgment**

  *   **Strong Consensus:** Moral uncertainty is a real and important problem. Naive EMV faces the **Scale Variance Problem**. **Conclusion 2 (tiny credence dominance)** is widely regarded as **implausible and a reductio of naive EMV**. The **long-run justification fails** for one-off moral choices. **Hedging (Conclusion 1)** is seen as intuitively plausible by many, though its formal justification is debated.
  *   **Active Controversy:** How to normalize scales (or whether it's possible). The best formal aggregation method (EMV with normalization, your multiplicative rule, max-min, variance-based, etc.). Whether "credences over moral theories" is even coherent. The relative importance of moral uncertainty vs. empirical uncertainty in decision-making. The viability of spending on moral information.
  *   **My Judgment:** The factual uncertainty analogy is **fatally flawed** for justifying precise quantitative EMV aggregation, primarily due to scale variance and the lack of a long run. **Conclusion 1 (hedging)** survives as a **robust heuristic** based on risk-aversion across normative perspectives, not strict EMV. **Conclusion 2 is indefensible.** Your multiplicative patch is an **interesting technical solution to scale variance** but **introduces equally severe problems** regarding the reference pair and aggregation justification. The **legal systems analogy** offers the most useful alternative perspective, particularly for hedging/veto concepts.

  **What Would Change My Verdict?**

  1.  **A Credible Solution to Scale Variance:** If someone provided a universally accepted, non-arbitrary method for intertheoretic moral value comparison (e.g., a metaphysical argument for a universal scale, or a compelling decision-theoretic argument for a specific normalization), this would resurrect the core EMV approach and *potentially* support a qualified version of Conclusion 2. **Where I'm most likely wrong:** Underestimating the potential for a formal decision-theoretic framework that bypasses the need for direct intertheoretic comparison (e.g., sophisticated voting rules or bargaining solutions under uncertainty).
  2.  **Strong Evidence for Moral Convergence:** If moral inquiry reliably produced convergence towards a single theory (or theories with commensurable scales), the scale problem diminishes, strengthening EMV and potentially Conclusion 1. Conclusion 2 would remain weak due to the one-off nature of choices. **Where I'm most likely wrong:** Overly pessimistic about the potential for reflective equilibrium to yield stable convergence points relevant to practical action scales.

  This analogy is a useful starting point but breaks down under scrutiny, especially for high-stakes, one-off decisions influenced by theories with radically different structures. Prudent hedging often remains sensible, but the promise of a precise, universal moral calculus under uncertainty remains elusive.
