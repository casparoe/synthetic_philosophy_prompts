  Okay, the user is a second-year PhD student in economics working on a survey about decision-making under cognitive limits. Their advisor pointed out that literature often compares theories without clear criteria. So the user wants to establish explicit desiderata for a normative theory of rationality for bounded agents. 

  Hmm, this is a sophisticated request. The user has already listed 11 potential criteria but is unsure which are essential versus optional. They're clearly wrestling with foundational tensions in bounded rationality research. Their frustration with "hand-waving about costs bolted on" suggests they've encountered superficial treatments of cognitive limits.

  The core challenge is balancing normative force with realistic constraints. Traditional rational choice theory fails here by ignoring costs, while descriptive approaches lack normative bite. The user wants theory that preserves "ought" without requiring unbounded computation. 

  Let me unpack their 11 points. The deliberation-cost regress (#1) is indeed fundamental - any theory recommending deliberation must itself be deliberation-cost efficient. Interruptibility (#2) seems crucial for real-world applications where time constraints are unpredictable. Self-applicability (#3) is non-negotiable; advice the agent can't follow is useless. 

  Representational parsimony (#4) catches a common sleight-of-hand where theories assume pre-computed priors/utilities. The currency question (#5) reveals deep philosophical tension - can we compare cognitive effort directly with outcome utility? Immunity to exploitation (#6) might be too strong; bounded agents should be pump-resistant but not pump-proof. 

  Menu sensitivity (#7) needs careful handling: some framing effects are irrational, others are adaptive shortcuts. Scaffold neutrality (#8) recognizes that cognitive tools extend natural limits. Convergence (#9) is likely optional - bounded rationality isn't just approximate unbounded rationality. 

  The bound's specification (#10) is tricky - agents often don't know their own limits. Normative bite (#11) is essential; without it, everything becomes excusable. 

  Key tensions emerge: interruptibility conflicts with optimality-tracking; exploitability-resistance clashes with tractability. Self-applicability does heavy lifting by excluding theories requiring meta-cognition beyond agents' reach. 

  Missing perhaps: how theories handle novelty, or whether they require consistent preferences. Also the social dimension - can bounded rationality be collective? 

  For the scoring table, satisficing handles interruptibility well but lacks normative bite. Bounded optimality nails self-applicability but stumbles on regress. Attention models excel at currency questions but struggle with scaffolding. 

  The user's deepest need seems to be: cutting through programmatic biases to find criteria that prevent theories from becoming either vacuous or impossible. They want ammunition to evaluate approaches rigorously - hence the demand for incompatibility arguments. This framing chapter could shape their whole dissertation trajectory.
answer: |-
  Here is your specification of desiderata for a genuinely normative theory of bounded rationality, based on your stated purpose. Each requirement includes its **motivating case**, **status** (Non-Negotiable or Optional), and the **rationale** for why it’s a requirement (not taste). Conflicts, key tensions, and gaps follow.

  ---

  ### **Desiderata Specification**  
  *(Non-Negotiable = Core to normative purpose; Optional = Contextually valuable but not universal)*  

  1. **Deliberation-Cost Regress**  
     - **Case**: Fellowship committee with 400 applications, fixed time/resources, needing to decide *whether* to hire a screener.  
     - **Requirement**: **Non-Negotiable**.  
     - **Rationale**: A normative theory must resolve infinite regress ("deciding how to decide") without presupposing unbounded cognition. Otherwise, it collapses into hand-waving.  

  2. **Interruptibility**  
     - **Case**: Medical triage where time may run out unexpectedly (e.g., power outage, crisis).  
     - **Requirement**: **Non-Negotiable**.  
     - **Rationale**: Real-world bounds are stochastic and unannounced. Normative advice must provide *actionable outputs* at any interruption point to avoid catastrophic indecision.  

  3. **Self-Applicability**  
     - **Case**: An agent using the theory to allocate scarce working memory during investment decisions.  
     - **Requirement**: **Non-Negotiable**.  
     - **Rationale**: If the agent cannot *recognize compliance* or *execute recommendations* within its bounds, the theory is vacuously prescriptive ("just be optimal").  

  4. **Representational Parsimony**  
     - **Case**: An agent with limited memory cannot store a prior over 10^100 states.  
     - **Requirement**: **Non-Negotiable**.  
     - **Rationale**: Requiring infeasible representations smuggles in unboundedness. The theory must generate decisions from *feasible inputs* (e.g., sparse models, heuristics).  

  5. **Currency Commensurability**  
     - **Case**: Choosing between spending mental effort (attention) vs. monetary cost to solve a problem.  
     - **Requirement**: **Optional**.  
     - **Rationale**: Cognitive costs (effort, time) need not be reducible to outcome utility, but the theory must specify *how costs trade off against decisions* (e.g., effort budgets, opportunity costs).  

  6. **Immunity to Exploitation**  
     - **Case**: A bounded agent vulnerable to a money pump due to inconsistent choices.  
     - **Requirement**: **Optional**.  
     - **Rationale**: While full immunity may require unbounded reasoning, *practical stability* (resistance to common exploits) is normative. Excusing all inconsistencies removes "error".  

  7. **Menu/Framing Invariance**  
     - **Case**: Choosing identical gambles framed as gains vs. losses.  
     - **Requirement**: **Non-Negotiable** (with qualifications).  
     - **Rationale**: *Description-dependence* can signal errors (e.g., manipulation). Normative theories must distinguish *adaptive framing* (efficient coding) from *arbitrary incoherence*.  

  8. **Scaffold Neutrality**  
     - **Case**: Using a calculator to compute probabilities vs. internal computation.  
     - **Requirement**: **Non-Negotiable**.  
     - **Rationale**: Tools extend bounds. The theory must specify whether "resource limits" include *internal* cognition only or *scaffolded* systems (e.g., markets, AI).  

  9. **Convergence to Unbounded Rationality**  
     - **Case**: As computing power grows, should a chess algorithm approach perfect play?  
     - **Requirement**: **Optional**.  
     - **Rationale**: Bounded-optimal solutions may *diverge* from unbounded ideals (e.g., fast heuristics outperform Bayes in noisy environments). Mandating convergence biases toward ideal theory.  

  10. **Bound Specification**  
      - **Case**: An aging agent uncertain about future memory decline.  
      - **Requirement**: **Non-Negotiable**.  
      - **Rationale**: The theory must define bounds *operationally* (time, space, etc.) and handle *meta-uncertainty* about bounds. Vague bounds excuse any failure.  

  11. **Normative Bite**  
      - **Case**: An agent neglects base rates due to cognitive laziness (not inability).  
      - **Requirement**: **Non-Negotiable**.  
      - **Rationale**: Without distinguishing *errors* (correctable mistakes) from *hard constraints*, the theory cannot criticize suboptimal actions.  

  ---

  ### **Tensions and Incompatibilities**  
  - **Interruptibility vs. Optimality-Tracking**:  
    Interruptibility demands *any-time* outputs, but optimality often requires exhaustive computation (e.g., dynamic programming). Tension: Partial execution may yield arbitrarily bad decisions.  
    - *Resolution*: Theories must accept *satisficing* or *robust* interim solutions.  

  - **Self-Applicability vs. Exploitability Immunity**:  
    Self-applicability requires simple, executable rules; exploitability immunity demands consistency checks that exceed bounds.  
    - *Resolution*: Approximate immunity (e.g., "tolerate only rare/expensive pumps") may suffice.  

  - **Representational Parsimony vs. Convergence**:  
    Parsimony favors heuristic representations (e.g., prototypes); convergence demands increasingly complex models as bounds relax.  
    - *Resolution*: Convergence is optional; bounded-optimal representations need not "grow into" Bayesian ones.  

  **Most Exclusionary Requirement**: **Self-Applicability**. It eliminates:  
  - Theories requiring agents to solve NP-hard meta-problems.  
  - Unbounded rationalism ("just calculate expected utility").  
  - Vague prescriptions ("balance costs and benefits").  

  ---

  ### **Missing Desiderata**  
  - **Adaptivity to Problem Structure**: Must leverage *regularities* in environments (e.g., sparsity, hierarchy) to reduce cognitive load.  
    - *Case*: Ignoring irrelevant variables in high-dimensional choices.  
  - **Error Robustness**: Decisions should degrade gracefully under mis-specification of bounds/environments.  
    - *Case*: An agent overestimating its memory capacity.  
  - **Social Scaffolding**: How norms/markets/institutions extend individual bounds (e.g., using prices as information aggregators).  

  ---

  ### **Theory Scoring Table**  
  *(✓ = Strong, ~ = Partial, ✗ = Weak)*  

  | **Desideratum**               | **Satisficing** | **Info-Cost** | **Fast & Frugal** | **Bounded Optimality** |  
  |-------------------------------|----------------|---------------|-------------------|------------------------|  
  | 1. Deliberation-Cost Regress  | ~              | ✓             | ✓                 | ✗                      |  
  | 2. Interruptibility           | ✓              | ~             | ✓                 | ✗                      |  
  | 3. Self-Applicability         | ✓              | ✗             | ✓                 | ~                      |  
  | 4. Representational Parsimony | ✓              | ✗             | ✓                 | ~                      |  
  | 5. Currency Commensurability  | ✗              | ✓             | ✗                 | ~                      |  
  | 6. Exploitability Immunity    | ✗              | ~             | ✗                 | ✓                      |  
  | 7. Menu/Framing Invariance    | ✗              | ~             | ✗                 | ✓                      |  
  | 8. Scaffold Neutrality        | ~              | ~             | ✗                 | ✓                      |  
  | 9. Convergence                | ✗              | ✓             | ✗                 | ✓                      |  
  | 10. Bound Specification       | ✗              | ~             | ✓                 | ✓                      |  
  | 11. Normative Bite            | ~              | ✓             | ✗                 | ✓                      |  

  **Key**:  
  - **Satisficing** (Simon): Excels at interruptibility/self-applicability but lacks normative bite (arbitrary aspirations).  
  - **Info-Cost** (e.g., rational inattention): Addresses costs/regress but assumes pre-defined state spaces (fails parsimony).  
  - **Fast & Frugal** (Gigerenzer): Achieves parsimony/interruptibility but excuses framing effects (low exploitability immunity).  
  - **Bounded Optimality** (e.g., Russell): Normatively rigorous but computationally intractable (fails self-applicability).  

  ---

  ### **Conclusion**  
  Your core non-negotiables are **1, 2, 3, 4, 7, 8, 10, 11** – these define the "hard problem" of bounded rationality. The tensions between interruptibility, self-applicability, and normative bite are fundamental; no extant theory resolves them fully. Prioritize theories that explicitly model *cognitive operations* (not just outcomes) and specify *how bounds map to procedures*. Reject any candidate requiring infeasible meta-reasoning or invisible-hand waving.
