  ### Decision Tree: How Macroscopic Experience Arises from the Microscopic

  **Starting Commitment:** There is something it is like to be an ordinary awake adult human, and this depends on physical processes in the brain.  
  **Constraints:** Nodes are questions about concrete cases; answers branch without using prohibited terms (*panpsychism*, *panprotopsychism*, *cosmopsychism*, *Russellian*, *neutral*, *qualia*, or "combine"). Leaves are labeled post-hoc.  

  ---

  #### The Tree  
  1. **Can a single isolated particle (e.g., an electron) undergo experience?**  
     - **Yes** → Go to 2  
     - **No** → Go to 6  

  2. **If the constituents of a living brain are held in their exact arrangement during experience but all causal interactions are switched off, does this configuration undergo experience?**  
     - **Yes** → **Leaf: Constitutive Micropsychism**  
       - *Most awkward commitment:* The simple experiences of particles must non-mysteriously account for the brain’s rich, structured experience.  
     - **No** → Go to 3  

  3. **In a living human brain at one time, is there more than one subject?**  
     - **No** → **Leaf: Emergentist Panpsychism (Phenomenal Bonding)**  
       - *Most awkward commitment:* A brute "bonding" relation (not reducible to physics) is needed to unify micro-experiences into a macro-subject.  
     - **Yes** → Go to 4  

  4. **Is the subject reporting the experience identical to one of the many subjects in the brain?**  
     - **Yes** → **Leaf: Micro-Dominance**  
       - *Most awkward commitment:* A single microscopic subject (e.g., one neuron) inexplicably dominates and reports the entire macro-experience.  
     - **No** → **Leaf: Emergentist Panpsychism (Phenomenal Bonding)**  
       - *Most awkward commitment:* A brute "bonding" relation (not reducible to physics) is needed to unify micro-experiences into a macro-subject.  

  5. **When a brain is described at multiple levels (molecules, cells, neural assemblies, whole organism), are there subjects at every level?**  
     - **Yes** → *Empty* (Incoherent: subjects at conflicting scales, e.g., a cell’s experience vs. a molecule’s)  
     - **No** → *Empty* (Unattractive: arbitrary exclusion of levels; unexplored)  
     - **Ill-posed** → *Empty* (Unexplored)  

  6. **If the constituents of a living brain are held in their exact arrangement during experience but all causal interactions are switched off, does this configuration undergo experience?**  
     - **Yes** → Go to 7  
     - **No** → Go to 8  

  7. **Is this static experience dependent on the brain being part of a larger cosmos?**  
     - **Yes** → **Leaf: Cosmopsychism**  
       - *Most awkward commitment:* We should, but seemingly do not, experience the cosmos’s consciousness directly.  
     - **No** → **Leaf: Brute Macro-Emergentism (Static)**  
       - *Most awkward commitment:* Experience arises from non-experiential parts in a static system—no process, dynamics, or causation needed.  

  8. **Given all microphysical truths, all truths about non-experiential properties of constituents, and all a priori truths, can we deduce which macroscopic experiences exist?**  
     - **Yes** → **Leaf: Panprotopsychism**  
       - *Most awkward commitment:* Protophenomenal properties (neither physical nor experiential) must non-mysteriously generate experience.  
     - **No** → Go to 9  

  9. **Is the reported macro-experience real?**  
     - **Yes** → **Leaf: Brute Macro-Emergentism (Dynamic)**  
       - *Most awkward commitment:* Experience emerges brute from non-experiential physics—no further explanation possible.  
     - **No** → **Leaf: Illusionism**  
       - *Most awkward commitment:* The compelling sense of "something it is like" is an illusion, despite seeming fundamental.  

  ---

  #### Notes  
  - **Total Nodes:** 9 (questions).  
  - **Total Leaves:** 8 (positions).  
  - **Empty Combinations:**  
    - 5 (Grain): All answers are empty. "Subjects at every level" is incoherent; other answers are unattractive or unexplored.  
    - 3 (Count → Many) + 6 (Static → No) → 8 (Derivation): No position holds micro have no experience, static has no experience, and count is many.  
  - **Indistinguishable Leaves:**  
    - *Constitutive Micropsychism* and *Micro-Dominance* are separated only by the Count question (3–4). Without it, both collapse into "micro-experiences exist."  
    - *Emergentist Panpsychism* appears in two leaves (3→No, 4→No) but is identical in core commitment.  
  - **Key Node:** Node 1 (Minimal Subject) carries the most weight. It splits the tree into views where microscopic entities have experiences (micropsychist-leaning) vs. those where they do not (non-micropsychist). Without it, the tree collapses into a muddle over static/dynamic or count issues.  
  - **Unseparated Positions:** Neutral monism is not captured; it shares answers with panprotopsychism (6→No, 8→Yes) and cosmopsychism (6→Yes, 7→Yes).  

  This tree carves logical space via cases, not labels. Positions emerge from answer-combinations, revealing edges and gaps.
