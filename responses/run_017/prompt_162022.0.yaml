prompt: |-
  I am reshaping a graduate seminar on practical rationality to open with the problem of ties rather than close with it, and before I assign any of the literature I want the specification rather than the survey: what would a theory of rational choice under genuine indifference have to deliver to be worth a week of my students' time?

  Fix the purpose as I do. The theory is to serve two uses at once: to evaluate a tie-break from outside (was that agent's selection defensible, and answerable to whom?) and to be followable from inside deliberation by someone who has exhausted her reasons and is running out of time. If those two uses pull the requirements apart, say so.

  The cases I treat as non-optional, and each requirement should be tied to at least one: (i) the equidistant-bales case with a clock on it, where suspension is costly and there is a deadline at which the animal starves or acts; (ii) the older variant of a man equally hungry and thirsty between food and drink; (iii) the continuum case, a long chain of options each imperceptibly better than the last but with endpoints that clearly differ, where any demand to find a difference threatens an infinite ascent; (iv) options equal only under a coarse description — two tins alike in every respect the agent can specify — and the question whether rationality requires refining the description before acting; (v) the tie that is epistemic rather than ontic, equal only for all the agent knows; (vi) the tie whose resolution will later be cited as a reason by others, as when a committee chair settles between two candidates of equal merit and the decision is read as precedent; (vii) the recurring tie, the same choice between indistinguishable routes every morning for a year; (viii) the tie delegated to a coin, a colleague, or an algorithm; (ix) the tie that is equal for the agent but unequal for someone else who is affected; (x) the case where the agent's inability to prefer comes from exhaustion or anxiety rather than from equal reasons; (xi) the case where the options are not equal but incomparable.

  Two things I want respected rather than collapsed: the distinction between having no reason to prefer and having no reason that settles, and the distinction between a tie's being merely permitted to break and its being required to break. One term I stipulate for your use: explanatory residue, the "why that one?" that survives an arbitrary selection and to which no answer is available. A theory may need to accommodate that residue or to show it was never a genuine demand; I want to know which is a requirement and which is the prejudice of a camp.

  Give me exactly five numbered items, each a sentence or two, with no introduction and no conclusion. The first three are the desiderata you take to do the most work, each with its motivating case from my list and a mark of whether it is non-negotiable or a preference of some theoretical temperament. The fourth is the pair of desiderata, from your fuller list or from the three above, that you suspect cannot be jointly satisfied — or, if you think the list is jointly satisfiable, that claim instead — together with the single requirement that excludes the most otherwise attractive theories and what it excludes. The fifth is not a desideratum: it is what would change your mind about the list, which consideration would make you drop or add a requirement, and where your reasoning about the criteria is most likely to fail. Do not score the existing positions against the list; I will do that with the students.
reasoning: |-
  Hmm, the user is reshaping a graduate seminar on practical rationality to start with the problem of ties rather than ending with it. They want me to specify what a theory of rational choice under genuine indifference must deliver to justify a week of student time. The purpose is dual: evaluating tie-breaks externally (defensibility) and guiding internal deliberation when reasons are exhausted and time is short. If these uses conflict, I need to point that out.

  The user lists eleven non-optional cases, from equidistant bales with a clock to ties that are epistemic or involve delegation. I must respect two distinctions: no reason to prefer versus no reason that settles, and merely permitted versus required to break. They've also defined "explanatory residue" as the lingering "why that one?" after an arbitrary choice. For the response, I need exactly five numbered items: first three are key desiderata tied to cases, marked as non-negotiable or temperamental; the fourth identifies conflicting desiderata or a unifying requirement; the fifth explains what could change my mind about the list.

  For the desiderata, I consider dual-use constraint: it must work for both external evaluation and internal guidance. Case (i) the bales with a clock shows why this is non-negotiable—if the theory can't be followed under time pressure, it fails deliberation. Case (ii) the hungry-thirsty man illustrates external accountability. This requirement excludes theories that are too abstract or computationally heavy.

  Next, explanatory residue accommodation: the theory must either embrace the residue or dissolve it. Cases (iv) with coarse descriptions and (vi) precedent-setting ties highlight that residue can't be ignored. This is temperamental because some theories might try to eliminate it entirely, while others accept it as part of rationality.

  Third, I think about resolution requirement: distinguishing when breaking a tie is permitted versus mandatory. Case (vii) recurring ties and (xi) incomparables show the need for this. Cases like (ix) where others are affected add urgency. This is non-negotiable to prevent paralysis.

  For conflicting desiderata, I see tension between dual-use and explanatory residue. Dual-use pushes for simplicity in deliberation, but residue might demand more structure, creating a conflict. The single requirement that excludes many theories is the followability under pressure, which rules out approaches that require infinite regress or preference refinement.

  Finally, what would change my mind? If internal guidance isn't needed—like in timeless contexts—I'd drop dual-use. Or if residue is always dismissible, I'd relax accommodation. My reasoning might fail if I underestimate how theories handle the continuum case (iii), where imperceptible differences could challenge indifference.

  I'm structuring the response as requested: five numbered items, concise, with cases and markers, no intro or conclusion. This should provide a focused, theory-agnostic framework for the seminar.
answer: |-
  **1.** The theory must satisfy a dual-use constraint: enabling external justification (e.g., to stakeholders scrutinizing precedent-setting tie-breaks, as in case vi) *and* internal followability under cognitive/time pressure (e.g., the costly suspension deadline in case i). This is non-negotiable; theories failing either use are inadequate for the purpose.  
  **2.** It must accommodate or dissolve "explanatory residue" without paradox. For coarse-grained indifference (case iv) or precedent (case vi), the theory must either accept the residue as rationally inert or show why demanding explanation post-resolution is misguided. This is temperamental: eliminativist theories reject residue, while others integrate it.  
  **3.** It must distinguish when tie-breaking is merely *permitted* (e.g., the one-off hunger-thirst tie in case ii) from when it is *required* (e.g., recurring ties in case vii or ties affecting others in case ix). This demarcation is non-negotiable; conflating permission and obligation obscures rational demands under indifference.  
  **4.** The dual-use constraint (1) and residue accommodation (2) conflict: external justification often demands traceable reasons, but internal followability under exhaustion (case x) or pressure (case i) favors minimal/no reasons. The requirement for *followability under pressure* excludes theories demanding preference refinement (violating case iv) or infinite comparison (violating case iii).  
  **5.** I would drop the dual-use constraint if internal guidance is deemed non-rational (e.g., seeing exhaustion/anxiety in case x as bypassing rationality). I would add a requirement for option-individuation if incomparability (case xi) fundamentally differs from indifference. My reasoning fails most at case iii’s continuum: if imperceptible differences negate genuine ties, some desiderata collapse.
