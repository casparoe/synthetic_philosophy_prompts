  The user's hypothesis about four distinct questions being entangled seems correct. I'd add that even within "the folk concept" there's ambiguity between intention-as-prediction and intention-as-commitment. The standoff persists because:
  - Verbal differences: Does "intend" require settled belief in execution? (1 vs 2)
  - Data selection: Is the core case possible worlds or psychological plausibility? (1 vs 3)
  - Bedrock commitments: Is rationality diachronic or synchronic? (2 vs everyone else)
