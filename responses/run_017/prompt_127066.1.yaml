  Okay, the user has presented a fascinating puzzle about their friend Sanne's ethics around lying. Sanne's behavior seems inconsistent at first glance - she accepts some white lies but rejects others vehemently, and the pattern isn't aligning with common stereotypes about Dutch directness. 

  Let me analyze Sanne's specific cases systematically. First, the acceptable lies: complimenting terrible food to her mother-in-law, calling an ugly baby beautiful, vaguely saying "soon" without plans. Then the unacceptable ones: refusing work by falsely claiming inability, saving a train seat dishonestly, pretending a tense lunch was fine. The haircut comment is interesting - she objects not to dishonesty but to unsolicited criticism. And the outlier: lying to her Dutch mother about eating habits is fine.

  The user has proposed two frameworks: the "gesture rule" (social rituals vs real information) and the "refusal test" (lying only when silence would be acceptable). Both seem plausible but the user can't distinguish them. 

  Considering Sanne's background provides clues. Being Dutch in Japan for years, married locally - she's navigating between cultural norms. Her anger about lying to her husband suggests intimacy creates higher truth obligations. The train seat lie violates social contracts between strangers. Work refusals affect professional integrity. 

  The proposed test case with Aya's resume is perfect for differentiation. Under the gesture rule, public context might make "it's great" acceptable as face-saving ritual. Under refusal test, Sanne could just decline to answer. But I suspect she'd reject the empty compliment ("it's great") as actively harmful, accept the delayed offer as honest intent, and prefer direct help. The audience likely matters - public refusal might humiliate Aya, so postponing feedback could be compassionate truth management.

  What truly unifies Sanne's judgments? It seems to be about consequences and relationships. Harmless social grease is fine; lies that enable avoidance, damage growth, or betray intimacy are not. The haircut case confirms - cruelty is wrong regardless of truth. Lying to her distant mother is acceptable because it prevents needless worry without real consequences.

  The core principle might be: deception is permissible only when it serves connection without harming anyone's ability to address reality. The resume test case should reveal this - does the middle option ("let's review later") honor the truth by committing to future honesty, or is it cowardice? I think Sanne would approve it as responsible truth-timing.

  For a definitive test, I'd ask about lying to protect someone's safety versus lying to avoid awkwardness. But the resume scenario already exposes her priorities: truth must ultimately serve growth, not comfort alone.
