  Here’s my best reading of Sanne’s rule, based on the pattern you've described and the cultural nuances at play. I think she’s operating on a principle of **relational harm prevention**, weighted by **agency and obligation**. Let me walk you through it.

  Sanne distinguishes lies not by their *form* (e.g., omission, deflection, fabrication) or their *context* (e.g., social ritual vs. professional duty), but by their **impact on the other person’s ability to act authentically or address reality**. She’s tolerant of lies that lubricate social cohesion *without* distorting actionable truth or undermining consent. She’s intolerant of lies that obstruct agency, enable avoidance, or exploit trust. The Dutch stereotype of blunt honesty is there, but it’s filtered through her lived experience in Japan: she respects *tatemae* when it’s a shared social script, but rejects it when it becomes a tool for coercion or denial.

  **Breaking down her verdicts:**
  - **Fine: Complimenting dry dinner / "ugly" baby / saying "soon" without plans.** These are low-stakes, ritualistic exchanges. The listener isn’t *relying* on the statement to make decisions. Her mother-in-law isn’t auditing her palate; the colleague isn’t using her aesthetic opinion to parent; the friend knows "soon" isn’t a calendar invite. These lies preserve harmony without consequences.
  - **Not fine: Lying to her boss about the report / saving a seat / downplaying lunch tension.** Here, the lie actively blocks someone from responding to reality. Her boss can’t reassign work; the train passenger can’t find a seat; her husband can’t address the tension. These lies manipulate others’ choices by withholding truth they’re entitled to (by role, circumstance, or relationship).
  - **Lying to her Dutch mother about eating habits? Fine.** This seems like an outlier but fits: her mother’s concern is emotional, not practical. The lie prevents needless worry without distorting her mother’s agency—it’s a boundary disguised as reassurance.
  - **Unprompted criticism is "bad, not a lie"?** Consistent. Harm isn’t in the dishonesty; it’s in forcing unwelcome truth onto someone who didn’t seek it. Truth-telling requires consent too.

  **Your Aya test case:**
  Aya asks publicly about her flawed resumé. Sanne would reject **"It’s great, you’ll be fine"** outright. This lie would harm Aya by leaving her unaware she’s sabotaging her job search. She’d accept **"The format will get you screened out—I’ll help fix it"** as ideal: direct, solution-oriented, and agency-preserving.  
  The **middle option—"Your experience is strong, let’s review it together later"**—is the hinge. *Sanne likely approves this.* It’s not evasion; it’s *deferred honesty*. She’s committing to truth-telling in a setting where Aya can actually act on it (privately, without public shame). The audience doesn’t change what she *owes* Aya (the truth), but it shapes *how* she delivers it. Postponing isn’t "extra steps to lie"; it’s ethical staging to make truth usable.

  **Why your rules almost work (but don’t quite):**
  - Your **gesture rule** fits the ritualistic lies but not the boss/train cases. Saying "Friday’s impossible" *is* "friendly noise" in many workplaces—yet Sanne rejects it.  
  - Your **refusal test** fits the boss/train cases but not the lunch tension. She could’ve said *nothing* to her husband—but silence would’ve been complicity in denial. She *owed* him the truth.  
  **Sanne’s deeper rule:** Lies are wrong when they **disempower**. They’re acceptable when they’re cost-free social gestures or when truth would be *more* harmful than a lie (e.g., her mother’s anxiety).

  **A single case to settle it:**  
  Ask Sanne this: *"A close friend asks if you like their new partner. You think the partner is manipulative and toxic. Is it okay to say, ‘I’m happy if you’re happy,’ knowing they’ll take it as approval?"*  
  - **If she says no:** Her rule prioritizes truth-as-intervention (preventing harm trumps harmony).  
  - **If she says yes:** Her rule prioritizes relational autonomy (the friend’s choice isn’t hers to disrupt with unsolicited truth).  

  I’d bet she says **no**. Her heated reaction to lying about the tense lunch suggests she sees intimacy as a truth debt—especially where harm is imminent. That’s the core: lies that sever people from their own agency are intolerable; lies that let people coexist peacefully are functional. It’s Dutch pragmatism meets Kyoto nuance—not "always lie" or "never lie," but "lie only when the truth would break something that didn’t need fixing."  

  Let me know how she answers—I’m invested now.
