      - A log-log plot of `max |X_i|` vs. `N`. Slope ≈1 confirms `max |X| ≈ N` → tail dominance.  

  ### Conclusion and Bet Resolution
  - **Expected value does not exist:** Both mathematically (`E[|X|] = ∞`) and empirically (non-converging simulations).  
  - **You win the bet:** Saying the game is "worth nothing" captures that no finite price is "fair" under EU theory. But caution: "worth nothing" could mislead—it might still be played for fun or capped.  
