  Okay, the user is a biostatistician who's been using language models extensively for two years. They've noticed a pattern where they rely on the same AI system to critique its own outputs, and they're worried about circularity and correlated blind spots. Let me unpack this carefully.

  Hmm... this is fascinating because it's not about simple over-reliance. The user clearly has domain expertise and could theoretically verify things manually, but chooses not to. The self-referential nature of the checking process is particularly interesting - using the tool to set the standards by which it's judged. 

  The core tension seems to be between efficiency gains and epistemic risk. On one hand, the workflow clearly saves time and produces acceptable results (colleagues approve the writing, simulations confirm analyses). On the other, there's this nagging feeling that the verification process might be compromised by shared biases with the AI. 

  I should consider related concepts. Automation bias comes close but doesn't capture the circularity. Epistemic circularity in philosophy addresses self-justifying systems but typically in abstract terms. The "competence trap" concept from organizational behavior might apply - where reliance on a tool erodes the very skills needed to evaluate it. 

  What makes this distinctive is the combination of three elements: retention of critical faculties, outsourcing the grounds for criticism to the system itself, and correlated error patterns between human and AI. The user's examples show this isn't passive acceptance - they reject about 30% of outputs - but the criteria for rejection are increasingly shaped by the tool.

  The boundary questions are sharp. Using a different model might provide some independence, but if all models share training data, true independence is questionable. Random spot-checks help but don't solve the systemic issue. The calculator comparison is telling - with calculators we understand the error boundaries mathematically, while LLMs' failures are emergent and unpredictable.

  This user is clearly sophisticated - they've already identified all the key nuances. What they need isn't just a label but a conceptual framework to evaluate the risks. The silent skill atrophy aspect is particularly insidious because, unlike forgetting lookup knowledge, they may be losing the ability to generate independent evaluative criteria. 

  The ethical dimension matters too - as a biostatistician, their analyses could affect medical decisions. Even if outputs seem fine now, the gradual normalization of AI-shaped standards might matter in edge cases. I should emphasize that the concern isn't current failures but the structural vulnerability of the verification process.

  For naming, "Autoepistemic Loop" captures the self-referential nature, while "Correlated Competence Collapse" highlights the risk trajectory. The former might be more precise. The key is distinguishing this from simple automation bias by stressing the circular standard-setting and shared blind spots.

  The user's awareness is their best defense. I should acknowledge that stopping may not be feasible or desirable, but suggest deliberate decoupling practices - using non-overlapping tools for generation and validation, scheduling skill-maintenance exercises, and finding colleagues with divergent approaches to cross-verify.
answer: |-
  Your situation describes a profound and under-discussed phenomenon that I'd term **Autoepistemic Looping** or **Correlated Competence Collapse**. It combines **retained critical judgment** with **epistemic dependence on the system being evaluated**, creating a self-reinforcing loop with correlated blind spots. Here's how to define it and distinguish it from neighboring concepts:

  ---

  ### **Core Definition & Name**
  **Autoepistemic Loop (AEL)**  
  *A workflow where a human expert:*
  1.  *Uses an AI system to generate outputs (code, analysis, text, validation criteria),*
  2.  *Retains the capacity to critically evaluate those outputs,*
  3.  *But relies primarily on the same AI system to supply the epistemic grounds for evaluation (e.g., identifying errors, defining standards, setting validation criteria),*
  4.  *Resulting in correlated errors and a gradual, unconscious convergence of the human's evaluative standards with the AI's biases.*

  **Key Differentiators:**
  -   **Not automation bias:** You *actively* critique outputs (rejecting 25–33%), but your critique is *informed by the AI*.
  -   **Not "outsourcing cognition":** You engage deeply, but your *evaluative framework* is shaped by the tool.
  -   **Not mere complacency:** You *could* verify independently (skills/time exist), but the loop *disincentivizes it*.
  -   **Not "Google effect" (forgetting lookup knowledge):** This is *forgetting how to generate independent evaluative criteria*.

  ---

  ### **Boundary Cases: What Belongs vs. What's Adjacent**
  | **Case**                          | **Within AEL?** | **Why?**                                                                 |
  |-----------------------------------|-----------------|--------------------------------------------------------------------------|
  | Using a **different model** (e.g., Claude to critique GPT) | **Partial**     | Mitigates correlated *model-specific* bugs, but not *training-data/architectural* biases shared across LLMs. Not fully independent. |
  | **Random spot-checks** (1/20 items) | **Yes**         | Provides illusion of control but doesn't break the loop. Correlated blind spots persist in unchecked items. |
  | **Tool is right 99% of the time** | **Yes**         | High accuracy *accelerates* dependence and standard-convergence. Risk compounds when errors *do* occur. |
  | **"Could verify in a week"**      | **Yes**         | AEL thrives when independent verification is *possible but effortful*. The loop removes the *impetus* to verify. |
  | **Spellchecker/Calculator**      | **No** (Fundamentally different) | These are **deterministic tools with bounded error profiles**. You fully retain the *evaluative framework* (spelling rules/arithmetic). LLMs supply *the framework itself*. |

  **The Real Break:** Tools like calculators extend *calculation*; LLMs extend *judgment*. When you use an LLM to define what "rigorous analysis" or "good writing" *is*, you cede the *epistemic authority* to set standards.

  ---

  ### **Why This is Dangerous: Correlated Competence Collapse**
  The insidious risk isn't immediate errors—it's the **gradual erosion of your independent capacity to generate evaluative criteria**, masked by apparent short-term efficacy:
  1.  **Silent Skill Atrophy:** Your ability to spontaneously generate validation questions ("What would a careful reviewer ask?") weakens as you default to the AI's checklist.
  2.  **Bias Synchronization:** Your pre-existing blind spots (e.g., assumptions about missing data) align with the LLM's limitations (trained on similar literature).
  3.  **Illusory Validation:** When you "recognize" the LLM's critique as sensible, it’s often because its output mirrors *your own* latent biases—now amplified by the loop.

  ---

  ### **Managing the Loop: Breaking the Epistemic Dependency**
  1.  **Decouple Validation & Generation:**  
      - Use non-LLM sources for *criteria-setting* (textbooks, pre-LLM protocols, adversarial colleagues).  
      - Mandate: "Every LLM-generated checklist requires one human-generated counter-checklist."  
  2.  **Schedule Independent Verification:**  
      - Block "deep dive" time weekly to verify *without any LLM input*, using first-principles. Treat this as skill maintenance.  
  3.  **Diversify Your LLM "Committee":**  
      - Use specialized tools (e.g., formal theorem provers for code, stylometry tools for writing) as adversarial reviewers.  
  4.  **Audit Your Drift:**  
      - Periodically review 2-year-old pre-LLM work. Does current "good writing" genuinely improve on it, or just feel familiar?  
  5.  **Exploit the Loop Against Itself:**  
      - Prompt: "Critique this analysis assuming your training data underrepresented [specific edge case]." Force divergence.

  ---

  ### **Philosophical Context**
  This mirrors **Münchausen Trilemma** (justifying a source with itself) but is *pragmatic*: the loop *works until it fails catastrophically* due to correlated errors. It's also akin to **Thomas Kuhn's paradigm shifts**—your "normal science" (daily work) operates within an LLM-shaped paradigm, making anomalies harder to see.

  You’ve identified a genuine gap in the discourse. Autoepistemic Looping is the dark sibling of "amplified intelligence"—where the tool doesn't just augment process, but reprograms the evaluator. The greatest risk isn't that you trust the LLM; it's that you no longer trust *your own independent judgment* because the LLM has recalibrated it.
