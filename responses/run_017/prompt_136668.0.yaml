  Hmm, the user wants me to create a joint statement for two ethics reading group members who've been debating moral testimony. One is a pessimist who thinks there's something defective about holding moral beliefs based on testimony, while the other is an optimist who sees moral testimony as legitimate like other forms of testimony.

  I need to structure this carefully with four main sections: agreed claims, residual disagreements, crux issues, and a closing note. The agreed claims should be substantive - not just obvious points. For the disagreements, I'll create a table where each side would accept how their position is worded. The crux section needs to cover several specific scenarios like testimony about wrongness versus what makes something wrong, different types of defects, cases involving marginalized voices, AI systems, and analogies to mathematical proofs or instruments.

  For the AI case specifically, I'll explore whether deferring to an LLM counts as moral testimony and how each side would view it. The optimist would likely see it as legitimate testimony replacement, while the pessimist might argue it lacks the relational aspect of human testimony. I'll have both sides make predictions about how such deference would affect moral reasoning in new situations.

  The closing note should include what each side would consider evidence against their own view, and address whether any part of the dispute is merely verbal. The pessimist might admit evidence if they found deferred beliefs consistently lead to worse actions, while the optimist might reconsider if deferred beliefs proved unstable across contexts.

