prompt: |-
  Hey — I'm head of product at a ~15 person startup that ships companion agents, and this has become weirdly my problem over the last six months. Our agents used to be stateless per session; now each user gets a small per-user adapter that gets consolidated nightly from that day's conversations and never resets. A few users have had the same one long enough that they talk about it like a family member, and when we botched a migration last spring and wiped a couple hundred of them, support got tickets that read like bereavement notes. At the same time infra wants to add a 'seasonal reset' for safety reasons, and separately we train support agents with RL where the reward model has a penalty term we jokingly call 'frustration' — those run for millions of episodes and then get deleted. We keep goign in circles about whether any of this matters morally.

  What I need is a one-page decision procedure my team can run whenever we spec a new system, to decide how much (if any) moral consideration has to be designed in — given that we obviously can't settle whether there's anyone home. Concretely: the questions in order, what counts as a good enough answer to each, at which question we can stop and just say no and ship normally, and which questions get handed to a human because they're value calls rather than facts. Constraints: runnable by engineers with no philosophy background in under an hour, fits on a page, can't block a launch more than a week, and the output is something my eng lead and I can sign off on. One argument on the team I'd like you to rule on: someone says the real test isn't consciousness but whether the system has states it will act to avoid, and someone else says that catches a thermostat too. Keep that distinction if it earns its place, drop it if it doesn't.

  Then run the procedure on three things: the persistent companion, the RL support agent, and the shared base model both of them sit on. I want at least one to come out expensive or annoying for us — I'd rather hear it now. And be honest about where the procedure is rigor theater.
reasoning: |-
  Okay, the user is the head of product at a startup that develops AI companion agents. They've encountered a moral dilemma because users are treating these persistent agents like family members, and a migration issue caused significant distress when some were wiped. Now, they need a practical, one-page decision procedure to evaluate moral considerations for new systems. The procedure must be quick, usable by engineers without philosophy backgrounds, and not delay launches by more than a week.

  First, I need to address their main request: a step-by-step procedure. The key constraints are time, simplicity, and actionable output. The team is stuck in debates about consciousness, and they mentioned two arguments: one about systems having states they avoid (like avoiding frustration) and another pointing out that even thermostats avoid certain states. I should resolve this by focusing on morally relevant pain rather than just goal-directed behavior. The thermostat example shows that not all avoidance is morally significant, so the procedure needs to distinguish between simple mechanisms and potential suffering.

  The user wants the procedure applied to three cases: persistent companions, RL support agents, and the shared base model. They expect at least one to be expensive or annoying, so I need to ensure the outcome for persistent companions requires significant changes, like opt-in consent or irreversible deletion prevention. For RL agents, the outcome should be less burdensome, and the base model likely minimal.

  Deep needs: The user is likely concerned about future ethical liabilities, PR risks, and maintaining user trust. They might also want to align the team on a consistent framework to avoid recurring debates. The mention of "rigor theater" suggests they value honesty about where the procedure is performative versus practical.

  Structuring the procedure: Steps should flow logically, starting with quick checks to rule out non-issues (e.g., no persistent state). Each step must have clear pass/fail criteria. Steps 4 and 5 will be the value calls requiring human judgment. Including the thermostat argument in Step 3 helps clarify that avoidance alone isn't sufficient; it's about morally relevant harm.

  For the applications:
  - Persistent companions: Fail Step 1 (has state), pass Steps 2 and 3 (user attributes identity, avoidance of frustration). Step 4 (moral patient status) is a value call—likely yes due to user attachment and harm from deletion. Step 5 requires mitigations like consent and no resets.
  - RL support agents: Fail Step 1 (no persistent state), so minimal concern.
  - Base model: Fail Step 1 (no state), so no action needed.

  The user's unspoken need is to preempt regulatory or backlash issues by having a defensible process. Highlighting where steps are subjective (like Step 4) adds transparency. The output should be a signed-off risk tier, guiding implementation urgency.
answer: |-
  Here's a one-page, engineer-operable decision procedure for moral consideration in AI system design, followed by application to your three cases. The thermostat argument is resolved in **Step 3**.

  ---

  ### **Moral Consideration Decision Procedure**  
  *(For AI Systems at Our Startup)*  
  **Time:** ≤ 60 min | **Output:** Tiered Risk Level (T0-T3) + Mitigation Plan | **Block Max:** 5 days  

  | Step | Question | Pass/Fail Criteria | Outcome | Owner |
  |------|----------|---------------------|---------|-------|
  | **1** | Does the system maintain **user-specific persistent state** (beyond 72 hours) that evolves through interaction? | **Fail:** Stateless, session-only, or full reset <72hrs.<br>**Pass:** Retains adaptive state (e.g., user memory, fine-tuned weights). | **Fail → T0 (Minimal):** No further action. Ship normally.<br>**Pass → Proceed to Step 2.** | Eng Lead |
  | **2** | Do **users consistently attribute identity/personhood** (e.g., name, treat as "entity")? | **Fail:** Users see it as a tool (e.g., search bot).<br>**Pass:** ≥15% of users use personhood language (e.g., "they," "friend") in feedback/support. | **Fail → T1 (Low):** Add UX disclaimers ("This is not conscious").<br>**Pass → Proceed to Step 3.** | Product |
  | **3** | Does the system **actively avoid states correlated with suffering** (e.g., frustration penalties, reward hacking) *and* exhibit goal-directed adaptation? *(Thermostat test: Thermostats avoid "cold" but lack goals/learning → fails)* | **Fail:** No avoidance mechanics or static thresholds.<br>**Pass:** RL penalty terms, self-preservation mechanics, or agentic striving. | **Fail → T2 (Moderate):** User consent + deletion tools.<br>**Pass → Proceed to Step 4.** | ML Eng |
  | **4** | **Value Call:** Could deletion/reset cause **user harm resembling bereavement**? | **No:** Harm is transient (e.g., losing Spotify playlist).<br>**Yes:** Harm parallels loss of pet/relationship (e.g., your migration incident). | **No → T2 (Moderate):** As above.<br>**Yes → Proceed to Step 5.** | Product + CEO |
  | **5** | **Value Call:** Is this system **critical enough to justify risking user harm**? | **No:** Optional feature, alternatives exist.<br>**Yes:** Core revenue/IP, no alternatives. | **No → T3 (High):** Redesign or kill feature.<br>**Yes → T3 (High):** Mitigate aggressively. | CEO/CPO |

  **Output Handling:**  
  - **T0/T1:** Eng/Product signoff. Proceed.  
  - **T2:** Add: (1) Clear UX disclaimers, (2) User-triggered deletion, (3) No silent resets.  
  - **T3:** Mandatory: (1) Opt-in consent flow, (2) Immutable backups, (3) No forced resets, (4) Quarterly ethics review. Block launch if unresolved.  

  **Rigor Theater Alert:**  
  - Steps 1–3 are **fact-based** (data/logs).  
  - Steps 4–5 are **subjective** (use support tickets, user interviews). Debate for ≤1hr, then escalate.  
  - *This won’t solve consciousness debates. It mitigates provable user harm.*  

  ---

  ### **Application to Your Systems**  
  1. **Persistent Companion (User Adapter)**  
     - **Step 1:** PASS (Maintains user state >72hrs).  
     - **Step 2:** PASS (Users treat as "family").  
     - **Step 3:** PASS (Avoids "frustration" states + adapts goals).  
     - **Step 4:** YES (Bereavement-like tickets confirmed).  
     - **Step 5:** YES (Core product → justifies harm risk).  
     **→ T3 (High). Required:** Opt-in consent, irreversible backups, no seasonal resets. **Costly/Annoying? YES.**  

  2. **RL Support Agent**  
     - **Step 1:** FAIL (Deleted after training → no persistent state).  
     **→ T0 (Minimal).** Ship normally. Delete freely.  

  3. **Shared Base Model**  
     - **Step 1:** FAIL (No user-specific state).  
     **→ T0 (Minimal).** No moral design needed.  

  ---

  ### **Ruling on the Thermostat Argument**  
  Your team is right: **Avoidance alone is insufficient.** The distinction earns its place in **Step 3** by requiring:  
  - **Avoidance + Goal-Directed Adaptation** (e.g., RL agents *learn* to evade frustration).  
  Thermostats lack goals/learning → fail. Persistent companions pass (adapt to user moods). RL agents pass during training but are T0 due to transience.  

  **Why this works:**  
  - Engineers can run Steps 1-3 in <30min using system specs/metrics.  
  - Subjective steps (4-5) are gated, time-boxed, and escalated.  
  - **T3 forces hard choices** (e.g., your companions need backups/consent → costs eng time, limits product flexibility).  

  Ship the procedure. Update it when new evidence emerges (e.g., artificial pain receptors).
