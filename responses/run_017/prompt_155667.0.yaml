  **INTERGENERATIONAL SUBSISTENCE REVERSION COMMISSION (ISRC)**  
  **MEMORANDUM #: ISRC-PR-09-001**  
  **DATE: October 26, 2023**  
  **SUBJECT: Preliminary Findings on Feasibility of Subsistence Mode Reversion (SMR) to Pre-Neolithic Parameters**

  **TO:** Secretary of the Interior, Undersecretary for Ancestral Continuity, Director of Paleo-Demographic Stability

  **FROM:** Chair, Intergenerational Subsistence Reversion Commission (Dr. A. Nomis)

  **EXECUTIVE SUMMARY:**

  The ISRC, pursuant to Public Law 117-86 ("The Affluence Through Restitution Act"), has conducted a preliminary assessment of the feasibility of transitioning the continental United States to a pre-agricultural, hunter-gatherer-forager (HGF) subsistence mode. This assessment focuses on achieving core HGF metrics: high per-capita leisure time, robust egalitarianism (asset Gini coefficient ≤0.25), and affluence defined as the reliable satisfaction of essential needs with minimal surplus accumulation. Crucially, the assessment adheres to the Charter's Non-Negotiable Condition 1.A: "Maintenance of current population levels (approx. 335 million) throughout and after transition."

  Our findings indicate that achieving HGF affluence metrics (leisure: ~20 hrs/wk dedicated subsistence; equality: near-universal resource access; want-satisfaction: stable caloric/protein intake meeting biologically determined needs) is theoretically replicable *within a specific demographic envelope*. However, Condition 1.A presents a fundamental thermodynamic and spatial constraint.

  1.  **Demographic Envelope Mismatch:** Pre-agricultural North America sustained an estimated 1-2 million persons under HGF modes. Achieving comparable leisure/equality metrics requires resource catchment areas vastly exceeding current U.S. landmass when scaled to 335 million, even assuming maximal foraging efficiency and dietary breadth. Current carrying capacity under pure HGF is modeled at ≤5 million.
  2.  **Surplus & the Demographic Ratchet:** The Neolithic transition enabled caloric surplus, directly facilitating population growth orders of magnitude beyond HGF ceilings. This population is now entirely dependent on the agricultural system Condition 1.A mandates we abandon. Reversion without prior demographic adjustment creates an unresolvable provisioning gap.
  3.  **Transition Path Ambiguity:** While the Neolithic transition occurred incrementally over millennia ("nobody ever chose it"), reversal necessitates a single, coordinated policy intervention. The lack of a historical precedent for intentional, large-scale reversion complicates pathway modeling. Gradualist approaches risk recreating intermediary, unstable states with known negative welfare indicators (e.g., early sedentism bioarchaeological signatures: increased enamel hypoplasia, stature reduction, cribra orbitalia - interpretations regarding *average* individual welfare decline versus *total* population increase remain contested but are operationally moot under Condition 1.A).

  **CONCLUSION:** Achieving Charter-mandated HGF affluence and equality metrics while adhering to Condition 1.A (Current Population Maintenance) is deemed thermodynamically infeasible under any modeled scenario utilizing known HGF techniques within the continental U.S. Further analysis must prioritize reconciling target affluence metrics with demographic reality.

  **FREQUENTLY ASKED QUESTIONS (PRELIMINARY):**

  1.  **Q: Doesn't "affluence" mean less work, not more stuff? Why can't we just work less?**
      A: Correct. Affluence is defined herein as want-satisfaction, not accumulation. HGF affluence stems from low time-input subsistence yielding adequate returns. However, the *per capita* resource requirement to satisfy wants for 335 million individuals vastly exceeds what the environment can provide *without* the intensive, surplus-generating labor of agriculture Condition 1.A prohibits. Less work per person requires vastly more land per person under HGF parameters.

  2.  **Q: Can't technology or efficiency gains bridge the gap?**
      A: The Charter mandates achieving *pre-Neolithic* parameters. Utilizing post-Neolithic technologies (e.g., advanced permaculture, mechanized foraging) violates the core principle of reversion and likely reintroduces surplus accumulation pathways and associated social stratification. Efficiency gains within true HGF toolkits are marginal and insufficient to overcome scale.

  3.  **Q: What about the bioarchaeological evidence showing health declined after agriculture? Doesn't that prove it was a mistake?**
      A: The evidentiary picture is complex. Shifts in skeletal markers (stature, hypoplasia, anemia) likely reflect multiple factors: dietary focus, disease ecology in denser settlements, social inequality. While suggestive of *average individual stress* increase in early agricultural contexts versus some HGF groups, this data coexists with evidence of significant *total population increase*. The Commission's mandate focuses on replicating the *lifestyle metrics* (leisure, equality, want-satisfaction), not adjudicating historical causation. Condition 1.A prevents leveraging the population decrease potentially associated with a genuine reversion.

  4.  **Q: How does the Commission propose resolving the Condition 1.A constraint?**
      A: The Commission is currently evaluating all options within the Charter framework. Preliminary modeling suggests successful reversion requires alignment of the demographic footprint with the sustainable carrying capacity of the HGF mode. Achieving this alignment prior to or during Phase I (Transition Planning) may necessitate robust demographic planning mechanisms, potentially including **voluntary non-provisioning incentives** and **targeted eligibility criteria for Phase II (Active Reversion)** to facilitate **demographic rightsizing**. These concepts remain under rigorous feasibility and ethical review to ensure congruence with the Charter's well-being principles. The Commission emphasizes that any such mechanisms would prioritize autonomy and non-coercion consistent with aspirational HGF social models.

  5.  **Q: Wasn't the HGF world also violent and unequal?**
      A: The Commission's mandate is forward-looking feasibility assessment based on defined metrics (leisure, equality of access, want-satisfaction), not historical moral evaluation. Contemporary replicability focuses on achievable socio-economic structures, acknowledging all human organizational modes present complex trade-offs. Our models utilize the most optimistic, empirically supported parameters for HGF social dynamics within the defined affluence framework.
