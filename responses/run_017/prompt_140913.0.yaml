prompt: |-
  I'm in a reading group on Strawson's reactive attitudes and everyone's been asked to write up where they actually stand so the others can take shots at it, and I'd like a consistency check before I hand mine round. Here's roughly my position:

  (1) To be morally responsible just is for reactive attitudes like resentment and indignation to be fitting toward you — there's no extra fact about desert sitting behind our practices, so that once you've said everything about the attitudes and what they do in a relationship there's nothing further to ask.
  (2) Our actual blaming culture is mostly unjustified — pile-ons, the way we moralise addiction and mental illness, how much of the criminal system runs on blame — and we have real moral reason to cut a lot of it away wholesale, not just fine-tune it case by case.
  (3) Nobody can just decide, on some particular occasion, not to feel resentful about a slight. The attitudes aren't under that kind of control.
  (4) The objective attitude is the right stance exactly when someone's conduct is better explained by causes than by reasons — small kids, someone mid-psychotic-episode — and those people are off the blame hook.
  (5) Blame is at bottom a kind of address: it's a demand the victim makes on the wrongdoer, and someone who never blames the person who wronged them is failing to take themselves seriously.
  (6) You can perfectly well go on blaming someone who wronged you badly twenty years ago and who now has advanced dementia and couldn't take any of it in.

  I can't see a contradiction anywhere in that, which definatly means I'm missing something. Can you audit it: which pairs are genuinely in tension, which only look like they are, and for each real one what the cheapest revision is and what it'd cost me? Rank them by severity rather than flagging everything equally, and say whether there's a single change that would clean up more than one at a time.
reasoning: |-
  Okay, the user is in a reading group on Strawson's reactive attitudes and needs a consistency check on their position before sharing it. They've outlined six points and want to know where there might be tensions. Let me start by parsing each point.

  First, point (1) seems purely Strawsonian—moral responsibility is defined by the fittingness of reactive attitudes, no extra desert needed. Point (2) critiques current blaming practices as largely unjustified, advocating for wholesale cuts. Point (3) claims we can't voluntarily control resentment. Point (4) ties the objective attitude to cases where actions stem from causes, not reasons. Point (5) frames blame as a necessary form of address for self-respect. Point (6) insists blaming someone with advanced dementia is still valid.

  Looking for tensions. The big one is between (5) and (6). If blame is a demand on the wrongdoer, but the person with dementia can't comprehend it, how is that address meaningful? That seems contradictory. Then, (2) and (5): if blame is essential for self-respect, why cut blaming practices wholesale? That could undermine self-respect. Also, (3) and (2): if we can't control resentment, how can we just cut blaming practices? That requires a level of control that (3) denies. 

  (1) and (4) seem compatible. (4) fits with Strawson's exemptions. (6) and (4) conflict because dementia should trigger the objective attitude, exempting from blame, but (6) says blame is still fitting. 

  The user might need to address the purpose of blame. If it's about communication, (6) doesn't work. If it's about the victim's stance, then maybe. But then (5) emphasizes address to the wrongdoer, which is problematic. Revising (5) to focus on the victim's affirmation rather than addressing the wrongdoer could resolve multiple tensions. 

  Also, reconciling (2) and (5) might require distinguishing between blame as necessary interpersonally versus current toxic practices. The user might not have considered how voluntary control in (3) affects reforming practices in (2). They might need to frame cultural change as gradual, not about individual decisions. 

  Overall, the most severe tension is (5) and (6), then (2) and (5), then (3) and (2). A revision to (5) could help with both (5)/(6) and (2)/(5). The user's deeper need is to present a coherent stance that's defensible in a critical group, so clarity on these points is key.
answer: |-
  Your position is internally coherent *if* we interpret "blame" in (5) and (6) as primarily a *victim's internal stance* or *judgment of fittingness*, rather than *address to the wrongdoer*. However, the explicit language in (5) ("a demand the victim makes *on the wrongdoer*") creates significant tensions with other points. Here's an audit, ranked by severity:

  1.  **Severe Tension: (5) vs. (6)**
      *   **Conflict:** (5) defines blame as an *address/demand made on the wrongdoer*. (6) says you can blame someone who "couldn't take any of it in" (advanced dementia). If the person cannot comprehend the demand, how can it be an *address to them*? The action described in (6) sounds like holding an internal judgment or feeling resentment/indignation *about* the person, not addressing a demand *to* them.
      *   **Cheapest Revision (Solves this tension):** Revise (5) to decouple the *address* aspect from the *core* of blame. Instead, define blame primarily as the *victim's judgment* that resentment/indignation is fitting *plus* the *willingness* or *stance* of holding the wrongdoer accountable/demanding better *in principle* (even if communication is impossible). The address becomes a common *expression* of this stance, not its defining feature.
      *   **Cost:** Weakens the Strawsonian emphasis on the *interpersonal*, second-personal nature of blame as address/demand. You'd need to argue the core stance *implies* the demand *if possible*, but doesn't require actual addressability.

  2.  **Significant Tension: (5) vs. (2)**
      *   **Conflict:** (5) states that *never* blaming a wrongdoer is failing self-respect. (2) argues we have "real moral reason to cut a lot of [blaming culture] away wholesale." If blame is essential for self-respect in the face of wrongs, why wholesale reduction? This suggests (2) might require people to *not blame* in many cases, potentially undermining self-respect according to (5).
      *   **Why it might *only look* tense:** The tension lessens if (2) targets *expressions, practices, and social systems* of blame (pile-ons, criminal justice, moralizing illness), not the *internal fittingness judgment* or *stance* itself. You can hold the stance (blame as fitting) without endorsing toxic expressions or systems. (5) focuses on the individual victim's stance *towards their specific wrongdoer*.
      *   **Cheapest Revision:** Emphasize this distinction explicitly. Frame (2) as a critique of *social practices, expressions, and institutions* built *around* reactive attitudes, arguing these often deploy blame where it's *unfitting* or express fitting blame in *unjustifiable, harmful* ways. Reaffirm that the *core stance* described in (5) remains crucial for victims interpersonally.
      *   **Cost:** Requires careful delineation between the fundamental stance (protected by (5)) and its social manifestations (targeted by (2)).

  3.  **Moderate Tension: (3) vs. (2)**
      *   **Conflict:** (3) says we cannot *decide* on a particular occasion not to feel resentment. (2) advocates for large-scale cultural *reduction* of blaming practices. How can we "cut away" something we can't consciously control case-by-case?
      *   **Why it might *only look* tense:** Cultural change operates at a different level than individual, immediate control. We can cultivate habits, norms, and institutions that *over time* reshape *what we perceive as fitting* for resentment/indignation (aligning with (1)) and *how we express* these attitudes. We can't flip a switch on resentment (per (3)), but we can deliberately shape the social landscape that influences its occurrence and expression (goal of (2)).
      *   **Cheapest Revision:** Explicitly frame (2) as advocating for *cultural, institutional, and habitual change over time*, targeting the *conditions* that foster *unfitting* reactive attitudes and harmful expressions, not demanding immediate, conscious suppression of feelings per occasion. This respects (3).
      *   **Cost:** None if clarified; strengthens the argument by showing how cultural change works *with* our psychology, not against it.

  4.  **Potential Tension: (6) vs. (4)**
      *   **Conflict:** (4) says the objective attitude (exempting from blame) is fitting when conduct is caused, not reasoned. Advanced dementia seems a paradigm case of being "caused." Yet (6) says blame can continue.
      *   **Resolution within your framework:** Your position likely hinges on the *past* action being a reason-responsive choice (when the person *was* responsible). You are blaming *the person* for *that past wrong*, even though they *now* cannot comprehend it. The dementia doesn't retroactively make the past action unfitting for blame; it merely makes *current address* impossible (linking back to the (5)/(6) tension). Your view seems to be that exemptions ((4)) apply only to *current* conduct *explained* by causes, not to *past* responsible conduct.
      *   **Cheapest Revision:** Clarify this explicitly: "(4) applies to the *explanation for the specific conduct* in question. It exempts for that conduct. It does not erase the fittingness of reactive attitudes for *past responsible conduct*, even if the person *now* meets exemption conditions."
      *   **Cost:** Minimal. This is a common and defensible position.

  **Summary & Recommendation:**

  *   **Most Severe Issue:** The definition of blame in (5) as *address/demand to the wrongdoer* directly contradicts the possibility of blame in (6) where address is impossible.
  *   **Best Single Fix:** **Revise (5)** to soften or remove the *necessity* of actual address/demand *to the wrongdoer* as the core of blame. Instead, define blame as:
      > (5 Revised) Blame is fundamentally a stance of holding the wrongdoer accountable, grounded in the judgment that reactive attitudes are fitting. This stance centrally *involves* (or ideally expresses as) a demand for recognition/amends *when possible*, and someone who never adopts this stance towards their wrongdoer fails to take themselves seriously.
  *   **Why this helps multiple tensions:**
      *   **Resolves (5)/(6):** Blame (the stance/judgment) can persist even if address *to* the current individual is impossible (dementia). The "demand" can be seen as part of the stance's *meaning*, not its literal communication.
      *   **Alleviates (5)/(2):** By focusing on the *core stance/judgment of fittingness* rather than necessarily expressing demands, it's easier to argue that toxic social blame practices (targeted by (2)) are distortions or harmful expressions *of* this core, not the core itself. Protecting the core stance (for victims) is compatible with dismantling harmful practices.
      *   **Preserves Coherence:** This revision maintains strong Strawsonian elements ((1), (3), (4)) while making (6) consistent and fitting better with the critique in (2).

  With this revision to (5), your position becomes robustly consistent. Without it, the (5)/(6) tension is a major vulnerability your group will likely target. Clarifying the distinction between the core stance and social practices in relation to (2) and (3) will further strengthen your defense. Good luck with the shots!
