     - Intended inner message with correct outer (which is 0-based): "B E E" (but they won't get that initially). They will get "A D D".

  - **Type 3 (Chain):**
     - Envelope contains:
          - Initial outer message for Artifact 1: "This is a code using numbers. Each number corresponds to a letter with 0=A, 1=B, 2=C, ... 25=Z. Decode the following numbers: 17 4 21 4 17 18 4"
          - Artifact 1: (the numbers are written on a card: "17 4 21 4 17 18 4")
          - Artifact 2: A card with the letters: "A V I L"
     - The decoding of Artifact 1 should be "REVERSE" (which becomes the outer message for Artifact 2: use the reverse alphabet mapping).
     - Then Artifact 2 decodes to "ZERO", which is the basis for the initial outer message (0-based).

  Prep time: About 1-2 hours to create the cards. You'll need index cards and pens.

  - Create 2 sets of Type 1: 
     - For each: 
          - One index card with the code (e.g., "13 5 5 20")
          - One index card with the outer message (the mapping instructions)

  - Create 3 sets of Type 2:
     - One card with "1 4 4"
     - One card with the outer message (1-based mapping)

  - Create 2 sets of Type 3:
     - One card with the initial outer message for Artifact 1 (0-based instructions and the numbers)
     - One card with Artifact 2: "A V I L"

  Note: In Type 3, the numbers for Artifact 1 are in the initial outer message card, so you don't need a separate card for the numbers.

  **Timeline**

  - 0-5 min: Introduction and split into pairs. Hand out envelopes.
  - 5-55 min: Activity. Circulate and observe. 
  - 55-75 min: Sharing and debrief.

  **What to Watch For**

  - In Type 1: They might quickly decode and then wonder if there's more. 
  - In Type 2: They might decode to "ADD" and accept it. They might not question the outer message. 
  - In Type 3: They might not realize that "REVERSE" is the outer message for the second artifact. You might need to nudge: "What could you do with that word?" 

  **Predictable Problems and Solutions**

  - Problem: A pair might write the plaintext on the back of the artifact. 
     - Solution: Don't put anything on the back. If they try to write, it's okay as long as they are engaging. 
  - Problem: In Type 2, they might not realize the mapping is ambiguous. 
     - Solution: During debrief, ask if anyone got a different message for the same numbers? Then reveal the two mappings.
  - Problem: In Type 3, they might be stuck on the second artifact. 
     - Solution: Have a hint ready: "What does the first decoded message suggest about how to read the second one?"

  **What the Artifacts Can't Carry**

  - The artifacts illustrate the encoding and decoding, but they don't capture the role of the receiver's intelligence and prior knowledge. For example, the frame message only works if the receiver recognizes it as a message. This is a key point: without an intelligent receiver, the message isn't decoded. You'll need to mention this in the debrief.

  **Debrief Script**

  1. Ask pairs to share: 
     - What artifact did you have? 
     - What did you think the message was? 
     - How did you figure it out?

  2. Then introduce the three levels:
     - Frame message: What made you think there was a message at all? (e.g., it was given as a puzzle, the numbers looked like a code, the instruction card was present)
     - Outer message: What told you how to decode it? (the instructions, or a key)
     - Inner message: What was the content you extracted?

  3. Highlight the key insights:
     - For the Type 2 group: You had an outer message that seemed clear, but it led to a message that was not what the sender intended. The numbers were encoded with a different system. This shows that even with a frame and outer message, the inner message might be wrong if the outer message is faulty.
     - For the Type 3 group: The inner message of the first artifact became the outer message for the second. And the inner message of the second ("ZERO") was part of the first outer message (0-based). This shows how messages can be nested.

  4. Finally, point out the limitations: 
     - The physical artifacts can show the encoding, but they don't capture the entire process. The receiver must have the right knowledge to recognize the frame and use the outer message. Without an intelligent receiver, the message remains unread.

  This should achieve the goals within the constraints.
