  ### Session Plan: Meaning Artifact Workshop  
  **Goal:** Illustrate frame/outer/inner messages through hands-on decoding, emphasizing that outer messages can be faulty and that inner messages can become outer messages for deeper layers, including a self-referential loop.

  #### Materials & Prep (45-60 minutes, using provided supplies)
  - **Index Cards (30 cards):** 
    - Create 7 sets (one per pair) of 3 cards each: 
      - **Card A:** Physical pattern (frame message)  
      - **Card B:** Decoding instructions (outer message)  
      - **Card C:** Encoded content (inner message)  
    - **Extra:** Blank cards for groups to create their own artifacts.  
  - **Paper & Pens:** For note-taking and creating new codes.  
  - **Scissors:** To cut paper into puzzle pieces.  
  - **Projector:** Display prompts during debrief.  
  - **Prep Steps:**  
    1. **Type 1 (Basic):** 2 sets  
       - *Card A:* `[▢ ▢ ▢ ▢ ▢]` (5 empty boxes)  
       - *Card B:* "Fill boxes with vowels from the English alphabet (A=1, E=2, I=3, O=4, U=5)."  
       - *Card C:* `3 2 3 4 2` → Decodes to "I E I O E" (nonsense; frame is obvious, outer is clear, inner is meaningless).  
    2. **Type 2 (Faulty Outer Message):** 3 sets  
       - *Card A:* `↑↑↓↓←→←→BA` (arrow sequence)  
       - *Card B:* "This is Konami Code. Input sequence to unlock message: ↑=U, ↓=D, ←=L, →=R, B=B, A=A."  
       - *Card C:* `UUDDLRLRBABA` → Decodes to "UpUpDownDownLeftRightLeftRightBA" (plausible but wrong; real Konami Code is `↑↑↓↓←→←→BA`).  
    3. **Type 3 (Message Chain & Loop):** 2 sets  
       - *Card A:* `5-19-8-9-6-20` (number chain)  
       - *Card B:* "Shift each number by -3 (A=1, B=2...)."  
       - *Card C:* Decodes to `2-16-5-6-3-17` → "B P E F C Q" (meaningless). **Secret:** Ignore Card B; real decoding is A=0, B=1... (0-indexed).  
       - *Loop Artifact:* Pre-made physical puzzle (see "Critical Loop" below).  

  #### Critical Loop: Self-Referential Artifact (Prep 15 mins)  
  - **Physical Puzzle:** Cut a paper circle into 4 jigsaw pieces. Write on the front:  
    - Piece 1: `Y = X + 1`  
    - Piece 2: `A=1, B=2...`  
    - Piece 3: `9,12,12,21,19,9,15,14` (encodes "ILLUSION" with Y=X+1)  
    - Piece 4: `Decode me using the equation.`  
  - **How It Loops:**  
    - **Inner Message of Piece 3:** "ILLUSION" (decoded via Piece 1’s equation).  
    - **But:** Piece 1’s equation (`Y=X+1`) is itself decoded using Piece 2’s key (A=1, B=2...). This makes Piece 1’s equation the *inner* message of Piece 2’s system and the *outer* message for Piece 3.  
    - **Loop Closure:** Assembling all pieces forms a circle (literal and metaphorical). The full artifact’s meaning ("ILLUSION") depends on its own instructions.  

  #### Rules & Timeline (75 mins total)  
  1. **Intro (5 mins):**  
     - *Prompt:* "In pairs, use these artifacts to find hidden messages. There may be multiple valid interpretations."  
     - Assign sets randomly (Types 1, 2, 3).  

  2. **Activity (50 mins):**  
     - **Phase 1 (20 mins):** Decode your set.  
     - **Phase 2 (20 mins):** Create a NEW artifact with a chain (e.g., inner message of one card is outer message for another). Use blank cards.  
     - **Phase 3 (10 mins):** Swap artifacts with another pair. Solve theirs.  
     - **Your Role:**  
       - Observe disagreements (e.g., Type 2 pairs argue if `UUDDLRLRBABA` is "correct").  
       - Note when groups:  
         - Ignore outer messages (e.g., brute-force Type 3’s number chain).  
         - Create loops (e.g., one pair’s artifact says: "To read me, reverse these words").  
       - Intervene only if stuck: "What tells you *how* to read it?"  

  3. **Debrief (20 mins):**  
     - **Share Findings (5 mins):** Groups report messages and methods. Highlight:  
       - Type 2’s "Konami Code" yielded fluent nonsense.  
       - Type 3’s loop artifact self-decoded.  
     - **Reveal Terms (5 mins):** Project:  
       - **Frame:** "There’s a message here!" (e.g., arrows, boxes).  
       - **Outer:** "Here’s how to read it" (e.g., "Shift by -3", "Input Konami Code").  
       - **Inner:** The decoded content (e.g., "ILLUSION", "ADD").  
     - **Map Observations (10 mins):**  
       | What Happened          | Level Illustrated             | Key Insight                                  |  
       |------------------------|-------------------------------|---------------------------------------------|  
       | Pairs saw `↑↑↓↓←→←→BA` | Frame                         | Physical shape signals "message here".      |  
       | Used "A=1, B=2…"       | Outer                         | Instructions are separable from content.    |  
       | Got "B P E F C Q"      | Inner (with faulty outer)     | Fluency ≠ correctness.                      |  
       | Solved loop without outer | Outer inferred from inner | Intelligence bridges gaps (see below).      |  
       | Disagreed on "meaning" | All levels                    | Meaning requires shared context.            |  

  #### Predictable Issues & Fixes  
  - **Writing Plaintext on Back:** Likely in Type 1. *Fix:* Redirect: "What would a stranger need to decode this?"  
  - **Ignoring Outer Messages:** Common in Type 3. *Fix:* Ask: "Why did you trust your method? What *told* you to do that?"  
  - **Loop Artifact Fails:** If pairs miss the self-reference, *hint:* "Does the decoded message explain how you got it?"  

  #### What the Artifacts Can’t Carry (Must Be Stated)  
  - **The Receiver’s Role:** The artifacts alone won’t show that meaning requires an *intelligent interpreter*.  
    - *When to Say It:* During debrief, after mapping observations.  
    - *Phrasing:* "Notice: the inner message only emerged because *you* had the right knowledge (e.g., recognizing arrows as code, knowing alphabets). A rock or an AI without context would see grooves, not meaning."  

  ### Why This Works  
  - **Faulty Outer Message:** Type 2’s "Konami Code" creates a fluent, wrong inner message, making the "aha!" moment visceral.  
  - **Self-Referential Loop:** The physical puzzle forces groups to see a message as both instruction and content.  
  - **Minimal Prep:** Uses only provided materials; focuses on conceptual friction (disagreements, gaps) to expose the three levels implicitly.  

  This setup ensures students *feel* the gap between outer and inner messages before labeling it, with the loop artifact highlighting how meaning can nest recursively. The unspoken role of intelligence will linger, priming your final remark.
