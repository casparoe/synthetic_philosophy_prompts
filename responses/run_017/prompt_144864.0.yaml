prompt: |-
  I am legal secretary to the Northvale Council on Assisted Reproduction, a statutory body that must license each proposed act of embryo selection individually. The jurisdiction is invented and the eight decisions below are the Council's entire published record; please reason from them rather than from anything you know about how such questions are usually settled. The Council's governing provision permits a licence only where the selection "may reasonably be expected to serve the welfare of the child who may be born, having regard also to the interests of children generally." The second clause was inserted after a scandal eleven years ago and has never once been applied.

  The precedents, each with brief written reasons:

  1. One embryo carried a dominant variant for an untreatable neurodegenerative disease with onset around forty-five. Licensed. The Council held that it need not find the resulting life not worth living; an expected difference in the child's own welfare suffices.

  2. A variant causing a conspicuous craniofacial difference with no medical consequences, where the Council found on evidence that a severe and reliably imposed social penalty attaches to that appearance. Licensed. The Council rejected the argument that, because the burden is socially caused, the remedy must be social rather than genetic.

  3. Sex selection for family balancing, both embryos healthy. Refused: the benefit was to the parents, not to the child.

  4. Selection of an embryo tissue-matched to an existing sibling needing cord-blood stem cells. Licensed, subject to counselling conditions. The child's own burden was minor and the child gained the relationship with a treated sibling; the Council said the child's interest operates as a side-constraint and expressly declined to say it must be maximised.

  5. Selection on a polygenic risk score for a common, early-onset, partly preventable condition, among four embryos, where the absolute risk difference between best and worst was small and where the parents could have reduced the risk by other means. Licensed: "the provision asks whether selection may reasonably be expected to serve the child's welfare, not whether it is the only, the best, or a medical means of doing so."

  6. Selection on a weakly validated index of "easy temperament"; the applicants wanted a placid child. Refused: expected benefit to the child was speculative, the demonstrated benefit was to the parents, and the Council noted the risk of raising a child to fit a prediction.

  7. Selection for predicted adult height. Refused, narrowly: the applicant had not shown an expected benefit to the child, the associations being largely attributable to genetic nurture and unlikely to survive a within-family comparison. Two members added that they doubted whether an advantage consisting only in one's position relative to others could ever satisfy the provision; the Council recorded that it reserved that question.

  8. Selection so that a child would fit in within the applicants' tightly knit religious community, where a disfavoured trait would bring exclusion. Refused: the Council would not "ratify a local prejudice," and distinguished decision 2 on the ground that the penalty there was society-wide and was not one the applicants' own community could lift.

  The pending application: five viable embryos, none carrying a known disease variant, all unremarkable on the risk scores the Council has previously accepted. The applicants seek selection on a polygenic index of scholastic attainment, built from a genome-wide study of several hundred thousand people of the applicants' ancestry, with direct genetic effects isolated by within-family designs so that the objection that decided case 7 does not apply. In this jurisdiction all children sit a ranked examination at eleven; rank determines secondary-school placement; placement strongly predicts further education, adult earnings and measured adult health. Between the highest- and lowest-scoring of the five embryos the expected difference is roughly twelve percentile points of exam rank, which the Council's expert evidence converts into a materially higher probability of the academic track and, through that, small but real expected gains in lifetime earnings, in adult health and in self-reported well-being. The same experts testified: (a) the payoff is almost entirely positional — were every family to select this way the rank distribution would be unchanged and no child would gain, while a minority selecting would shift the remainder down; (b) the index's predictive validity would decay as the practice spread, both because the ranking is competitive and because schools and employers would reweight their criteria; (c) the expected well-being gain, though positive on the Council's usual measures, is small and mediated entirely through the positional channel; (d) there is no expected effect on the parent–child relationship, and the record supports the applicants' statement that they will raise whichever child they have without reference to the prediction. Finally, two complications: the highest-scoring embryo also carries a slightly elevated polygenic risk of a late-onset psychiatric condition of the kind the Council treated as a qualifying burden in case 1, so the applicants are trading increased disease risk for a positional gain, though on the Council's own accepted measure the net expected well-being still favours that embryo; and the applicants ask, if licensed, to undergo further stimulation cycles so as to choose from a larger cohort, which the clinic's evidence says would roughly double the expected gain and which the Council has never considered.

  What I want from you:

  1. Set out the two or three rules that fit all eight precedences and say what each predicts here. I can sketch five candidates — net expected welfare to the child; the exclusion of merely positional advantage; a priority for reducing disease risk over securing non-medical goods; the child's interest as a constraint rather than a maximand; and a universalisation test read into the "interests of children generally" clause — but I cannot tell which of them the record actually supports, whether any two are the same rule in different words, or whether some of them are inconsistent with decisions already handed down.
  2. Identify the closest analog among the eight and say how much of the new case it really settles.
  3. Predict the ruling, with the considerations you would give weight to, and state which of your rules the prediction depends on.
  4. Recommend what the Council should decide if it wishes to be consistent with its own record, and state honestly the principle it would be adopting either way — including, if you recommend licensing, whether that commits it to licensing cohort expansion, and, if you recommend refusal, whether it commits it to reopening decision 2.
  5. Specify the single further application that would best discriminate between the rules you have identified, and say what each rule predicts about it.

  Write it as a memo of roughly nine hundred words in five numbered sections, in a formal register, addressed to me. Do not cite any literature or comparative law: the Council's reasons must stand on this record, and its decisions are not published outside the jurisdiction.
reasoning: |-
  Hmm, the user is a legal secretary for the Northvale Council on Assisted Reproduction, and they need help analyzing a pending embryo selection application based solely on the Council's eight precedents. This is a fascinating ethical-legal puzzle where real-world knowledge can't be used - only the Council's own reasoning matters.

  The application involves selecting an embryo based on scholastic attainment polygenic index. The key complications are: (1) the benefit is almost entirely positional (would disappear if everyone did it), (2) there's a trade-off with slightly increased psychiatric risk, and (3) applicants want cohort expansion. The user needs me to extract coherent rules from the precedents that can guide this decision.

  Looking at the precedents, several patterns emerge. Case 1 establishes that welfare doesn't require proving life "not worth living" - comparative disadvantage suffices. Case 2 shows that socially imposed burdens can justify selection even if society caused them. But Case 3 draws a line at parental convenience. Case 4 introduces "side constraint" thinking while Case 5 rejects perfectionism in risk reduction. Case 6 refuses speculative benefits, Case 7 questions positional advantages, and Case 8 distinguishes local vs societal prejudices.

  For this new case, the positional nature (confirmed by expert testimony) seems problematic under Case 7's reasoning, though the within-family design distinguishes it technically. The small psychiatric risk trade-off is tricky - Case 1 allows selecting against disease, but here they're accepting higher risk for positional gain. The cohort expansion request has no precedent.

  The universalization test hinted in Case 7 and Case 8 might be key here. If the benefit disappears when universalized, and the "interests of children generally" clause has been dormant, this could be its activation moment. But licensing might force reopening Case 2 (facial difference), while refusing might require distinguishing this from Case 5 (polygenic risk).

  For the prediction, I think refusal is more consistent. The positional nature can't be overcome, and the net positive welfare is contingent on not being universalized. Plus that psychiatric risk trade-off sets a concerning precedent. Cohort expansion would magnify these issues.

  The user's hidden struggle seems to be about whether the Council has been consistent. The facial difference case (2) and this scholastic case reveal tension - why ratify one societal prejudice but not another? Or is the distinction valid? My recommendation forces them to confront whether "society-wide" penalties are fundamentally different from competitive positional goods. Either choice will define their jurisprudence.
answer: |-
  **MEMORANDUM**

  **To:** Legal Secretary, Northvale Council on Assisted Reproduction  
  **From:** Legal Analyst  
  **Subject:** Analysis of Pending Application for Embryo Selection Based on Polygenic Index for Scholastic Attainment  

  **1. Rules Derived from Precedents and Predictions for the Pending Case**

  Analysis of the eight published decisions yields three primary, consistent rules governing the Council's licensing decisions under the statutory provision:

  *   **Rule 1: Expected Net Welfare Difference to the Specific Child is Necessary and Sufficient (Subject to Constraints).** The Council consistently licenses selection where it finds a reasonable expectation that the *specific child born* will experience a net welfare difference attributable to the selection compared to a relevant alternative (i.e., being born from a different embryo). This difference need not render life "not worth living" (Case 1) and can stem from burdens imposed by societal prejudice (Case 2). It must be demonstrably expected, not speculative (Case 6). While the child's interest is a constraint (cannot be actively harmed for others' benefit - Case 4), it is not required to be *maximized* (Case 4, 5). This rule underpins licensing in Cases 1, 2, 4, and 5. Refusal occurs where no such net welfare difference to the child is shown (Cases 3, 6, 7) or where the claimed benefit is deemed illegitimate (Case 8).
      *   *Prediction for Pending Case:* Rule 1 suggests potential for licensing. The expert evidence indicates a small but real expected net welfare gain for the selected child (higher earnings, health, well-being), even accounting for the slightly elevated psychiatric risk. This gain is deemed non-speculative based on the Council's accepted measures and methodology.

  *   **Rule 2: Positional or Relational Advantages Cannot Solely Ground Licensing.** Benefits that consist *entirely or predominantly* of improving the child's position relative to others, and which would disappear if universally adopted, are insufficient. This principle is strongly suggested by the refusal in Case 7 (height) and reinforced by the reasoning in Case 8 (exclusion from local community). Case 2 is distinguished because the burden imposed (severe social penalty) is a concrete detriment to the child's welfare, not merely the absence of a relative advantage.
      *   *Prediction for Pending Case:* Rule 2 strongly suggests refusal. The expert evidence explicitly states (a) the payoff is "almost entirely positional," (b) universal selection would nullify the benefit, and (c) the well-being gain is "mediated entirely through the positional channel." This mirrors the core objection in Case 7, even though the within-family design addresses the "genetic nurture" flaw.

  *   **Rule 3: The "Interests of Children Generally" Clause Serves as a Universalization Check on Positional Claims and Local Prejudices.** While never explicitly applied, this clause provides the theoretical underpinning for Rules 2 and the distinction in Case 8. It prohibits licensing selections where the claimed benefit relies on the child gaining an advantage *at the expense of other children* (which universalization would negate - Cases 7 & 8) or where licensing would effectively endorse and perpetuate localized harmful social norms that disadvantage a class of children (Case 8 vs. Case 2's society-wide penalty). It acts as a side-constraint preventing Rule 1 from licensing selections based on purely competitive or parochial advantages.
      *   *Prediction for Pending Case:* Rule 3 suggests refusal. Licensing based on a purely positional scholastic advantage fails the universalization check inherent in the "interests of children generally" clause. Granting the licence would endorse a mechanism designed to benefit some children by shifting others down the competitive ranking, contravening the interests of children as a class. It also risks accelerating a predictive validity decay that harms the predictive utility for all.

  *Assessment of User's Candidates:*
  *   *Net Expected Welfare:* Captured by Rule 1, necessary but not always sufficient.
  *   *Exclusion of Merely Positional Advantage:* Captured by Rule 2, a distinct limiting principle.
  *   *Priority for Reducing Disease Risk:* Not supported. Case 5 explicitly rejects requiring selection to be the *only* or *best* medical means; non-medical goods (avoiding severe social penalty in Case 2) can suffice. The pending case involves a trade-off accepted under the net welfare calculus.
  *   *Constraint vs. Maximand:* Captured within Rule 1; the child's welfare is a constraint (cannot be sacrificed for others) but need not be maximized.
  *   *Universalisation Test:* Captured by Rule 3, providing the rationale for Rule 2 and the Case 8 distinction.

  **2. Closest Analog and Its Applicability**

  *   **Closest Analog:** Case 7 (Selection for Predicted Adult Height).
  *   **Applicability:** Case 7 is highly analogous on the core issue: seeking selection for a trait offering primarily positional advantage within a competitive social structure. The expert evidence in the pending case explicitly mirrors the concerns that led to refusal in Case 7 – the benefit is largely relative and unlikely to be robust if selection became common.
  *   **Limits of Settlement:** Case 7 settles that a purely or predominantly positional advantage, unsupported by concrete non-positional welfare gains, is insufficient. It *does not* settle:
      1.  Whether the *net expected welfare gain* calculation (including the trade-off with psychiatric risk) can overcome the positional nature, as no such trade-off existed in Case 7.
      2.  The precise application of the "interests of children generally" clause (only reserved in Case 7).
      3.  The permissibility of cohort expansion.
      4.  Whether the higher methodological rigor (within-family design) changes the outcome, as Case 7's refusal was based on the *nature* of the claimed benefit, not solely the flawed methodology.

  Case 7 strongly indicates refusal is likely based on the positional nature, but the additional complexities prevent it from being entirely dispositive.

  **3. Predicted Ruling and Key Considerations**

  *   **Predicted Ruling:** Refusal of the licence.
  *   **Key Considerations Given Weight:**
      1.  **Predominantly Positional Benefit:** The Council will heavily weigh the expert testimony confirming the scholastic attainment advantage is "almost entirely positional" and "mediated entirely through the positional channel," replicating the fundamental flaw identified in Case 7.
      2.  **Universalization and "Interests of Children Generally":** The Council will likely invoke the dormant second clause explicitly for the first time. It will find that licensing a selection for purely competitive advantage contravenes the interests of children generally, as universal application would negate the benefit while potentially harming others and undermining the predictive system.
      3.  **Distinction from Case 5 (Polygenic Risk):** The Council will distinguish Case 5 by emphasizing that the risk reduction there pertained to a concrete, non-positional health burden *to the child*, whereas the pending application seeks a positional social advantage. Case 5's permissiveness towards small, non-medically-necessary differences does not extend to advantages defined by competition.
      4.  **Trade-off with Psychiatric Risk:** The Council will likely find that the small net positive welfare gain calculated does not legitimize the core mechanism of selecting for positional advantage. The trade-off involves accepting a known health risk (albeit small) for a benefit deemed illegitimate under Rules 2 & 3.
      5.  **Cohort Expansion:** Given the predicted refusal on the primary selection, cohort expansion becomes moot.
  *   **Rule Dependence:** This prediction depends critically on **Rule 2 (Exclusion of Positional Advantage)** and **Rule 3 (Universalization/Interests of Children Generally)** overriding the calculation of a small net welfare gain under **Rule 1**.

  **4. Recommendation for Consistency and Principle Adoption**

  *   **Recommendation:** To be consistent with its record, particularly the principles underlying Cases 7 and 8, the Council should **refuse the licence**.
  *   **Principle Adopted:** Refusal would adopt the principle that **embryo selection cannot be licensed where the primary expected benefit to the specific child consists of a positional or competitive advantage that derives its value from the child's relative standing compared to others, and which would be negated or rendered harmful to children generally if the practice became widespread.** This principle directly flows from the reasoning in Case 7 and the distinction drawn in Case 8.
  *   **Implications:**
      *   **Reopening Case 2?** Refusal does *not* compel reopening Case 2. Case 2 involved selection to avoid a severe, concrete societal burden *imposed on the child*, constituting a non-positional welfare detriment. The Council can consistently maintain that avoiding severe, society-wide prejudice causing direct harm (Case 2) is distinct from seeking competitive advantage within a ranking system (Pending Case, Case 7) or endorsing local exclusion (Case 8).
      *   **Cohort Expansion:** As refusal is recommended on the core principle, cohort expansion is irrelevant. If the core selection were licensed, cohort expansion would likely be permitted under the logic of Case 5 ("not whether it is the only, the best... means"), as it simply increases the potential net welfare gain under the same selection rationale. However, licensing the core selection is inconsistent with the record.

  **5. Discriminatory Further Application**

  *   **Further Application:** Selection among embryos to avoid a polygenic risk for a moderately severe, treatable but life-limiting physical condition (e.g., type 1 diabetes) with significant associated lifetime burdens (medical management, cost, lifestyle impact) *where the absolute risk difference between embryos is similar in magnitude to the scholastic attainment gain in this case, and where societal stigma attaches to the condition but is less severe and pervasive than the craniofacial difference in Case 2*.
  *   **Rule Predictions:**
      *   **Rule 1 (Net Welfare):** Predicts licensing. There is a concrete, non-positional expected net welfare difference for the specific child (avoiding the burdens of the condition).
      *   **Rule 2 (No Positional):** Predicts licensing. The benefit is avoiding a concrete burden, not gaining a relative advantage. Avoidance of moderate societal stigma might be analogized to Case 2, further supporting licensing.
      *   **Rule 3 (Children Generally):** Predicts licensing. Avoiding a concrete health burden serves the interests of children generally, even if universal selection would reduce disease prevalence. Licensing does not endorse gaining at others' expense; it reduces a burden.
  *   **Discriminatory Power:** This application cleanly distinguishes between Rule 1/2 and the positional principle critical to refusing the scholastic case. Licensing here would confirm that concrete non-positional welfare differences, even small ones related to health burdens potentially compounded by some stigma (falling short of Case 2's severity), are permissible under Rules 1 & 2, whereas the scholastic case was refused specifically due to its positional nature under Rule 2. It also tests the boundaries of Rule 3 versus Case 2's severity threshold for societal prejudice.
