  ## Chain of Custody

  **(Reader 1: Student)**
  It started with a shove beside the lockers, hard.
  **I tried to say it felt like drowning, couldn't breathe.**
  The bell rang sharp, a sound like breaking glass.
  **My chest got tight, my vision started swimming.**

  **(Reader 2: Friend)**
  **I tried to say it felt like drowning, couldn't breathe.**
  She told me later, shaky by her car.
  **Her chest got tight, her vision started swimming.**
  "It shook her up," I told Ms. Ames at three.

  **(Reader 1: Teacher)**
  She told me later, shaky by her car.
  **"It shook her up," I told Ms. Ames at three.**
  Ms. Ames asked, "Was there threat? Was there clear harm?"
  **I noted: Student reports distress near parking.**

  **(Reader 2: Dean)**
  **Ms. Ames asked, "Was there threat? Was there clear harm?"**
  **I noted: Student reports distress near parking.**
  Conduct Code section 4 applies: Unsafe Space.
  **The filed account states: Disruption occurred.**

  **(Reader 1: Written Report)**
  **Conduct Code section 4 applies: Unsafe Space.**
  **The filed account states: Disruption occurred.**
  No witnesses confirm the shove described.
  **Incident resolved: addressed per guidelines.**

  **(Reader 2: Written Report / Reader 1: Student Echo)**
  **No witnesses confirm the shove described.**
  **Incident resolved: addressed per guidelines.**
  The needed word arrives too late, too clear:
  **It started with a shove beside the lockers, hard.**

  ---

  **Brainstorm & Constraints Check:**

  **Chain of Hands:**
  1.  **Student:** Experiences event ("shove"), struggles to articulate feeling ("felt like drowning").
  2.  **Friend:** Hears Student's raw account, simplifies emotion ("shook her up"), retains physical symptoms ("chest tight, vision swimming").
  3.  **Teacher (Ms. Ames):** Hears Friend's report. Focuses on actionable elements ("threat?", "clear harm?"). Records core *location* and *emotion* neutrally ("distress near parking"). **Loss 1 (Credibility):** Student's words become "reports," filtered through Friend. **Loss 2 (Vocabulary):** "Felt like drowning" vanishes entirely, replaced by "distress."
  4.  **Dean:** Receives Teacher's note. Needs category ("Conduct Code 4: Unsafe Space"). Summarizes event officially ("Disruption occurred"). **Loss 1:** Student's account is now a "filed account." **Loss 2:** "Shove" and "distress" become "Disruption."
  5.  **Written Report:** Official record. States category ("Unsafe Space"), official summary ("Disruption occurred"), lack of evidence ("No witnesses"), and outcome ("resolved per guidelines"). **Loss 1:** Authority resides entirely in the document. **Loss 2:** Specificity erased; event is now a categorized "Incident."
  6.  **Final Stanza (Report/Student):** Report states facts (lack of witnesses, resolution). Student's needed word arrives ("gasping" - implied, but arrives *now*). Opening line returns, now sounding like a cold case file entry, not lived experience.

  **Official Vocabulary:** Disruption, distress, threat, harm, Unsafe Space (Conduct Code), incident, report, filed account, witnesses, guidelines, resolved.

  **Loss Moments:**
  *   **Stanza 2 (Friend):** "Felt like drowning" becomes "shook her up" (Vocabulary Loss starts). Student's "I" becomes "She" (Credibility Loss/Attribution Shift).
  *   **Stanza 3 (Teacher):** "Shook her up" becomes "reports distress" (Vocabulary Loss: emotional rawness sanitized). Physical symptoms ("chest tight, vision swimming") dropped entirely (Information Loss). Focus shifts to "threat?"/ "harm?" (Actionability Filtering).
  *   **Stanza 4 (Dean):** "Distress near parking" becomes "Disruption occurred" (Vocabulary Loss: specific feeling/place replaced by broad category). **Credibility Reversal:** Dean *over-believes* the category fits ("applies") based on the report, fitting it neatly into the "Unsafe Space" box potentially too readily.
  *   **Stanza 5 (Report):** "Unsafe Space" and "Disruption occurred" become immutable facts. Specificity ("shove described") is noted only by its lack of witnesses. Outcome is procedural ("resolved per guidelines"). All trace of the student's original feeling and framing is gone.

  **Precise Handling:**
  1.  **No Villains:** Teacher asks procedural questions ("threat?", "harm?"). Dean follows the Code. Report states facts neutrally. Harm is systemic.
  2.  **Two Losses:**
      *   *Credibility Loss:* Evident as the words move from "I tried to say..." (Student) -> "She told me..." (Friend) -> "Student reports..." (Teacher) -> "filed account states..." (Report). Weight diminishes with each step.
      *   *Vocabulary Loss:* "Felt like drowning" (Student's reach) -> "shook her up" (Friend's simplification) -> "distress" (Teacher's official term) -> "Disruption" (Dean's category). The *thing* she reached for ("drowning") is gone by Stanza 3, never enters the record. The late word "gasping" (Line 23) embodies the *true feeling* that arrived too late.
  3.  **Not "Believe More":** The Dean's quick categorization ("applies") shows belief *in the system* overriding nuance – a form of over-belief in the official process/frame.

  **Ending:** No resolution ("Incident resolved" is hollow). Tension: Original line returns, stripped of meaning. The late word "gasping" arrives uselessly after the hearing.

  **Constraints Met:**
  *   Form: Pantoum (6 quatrains, 24 lines, repeats, opening closes).
  *   Voices: Student (R1), Friend (R2), Teacher (R1), Dean (R2), Report (R1/R2).
  *   Language: Accessible American English. No profanity/slurs/theory words. Concepts in structure/drift.
  *   Title: "Chain of Custody" (administrative, implies evidence handling; students might see custody as confinement).
  *   Standalone: Works as a poem about silencing/not being believed.
  *   Rhyme: Light slant/internal rhyme (hard/breathe/glass/swimming; car/three/swimming; harm/parking/three; space/occurred/parking; described/guidelines/occurred; hard/clear/guidelines).
