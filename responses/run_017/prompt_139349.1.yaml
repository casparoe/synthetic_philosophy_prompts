prompt: |-
  As a third-year PhD student in political psychology, I am deciding whether moral foundations theory can serve as the explanatory layer of my dissertation on the moral intuitions of left and right. Before I build on it I want the specification rather than another scorecard: what would a psychological account of the moral differences between left and right have to deliver in order to count as evidence about whose first-order moral claims are more likely true, rather than merely an account of why people hold the ones they do?

  Give me the requirements list, each with the case or consideration behind it. I have candidate requirements I want you to adjudicate rather than simply endorse:

  1. Causal-role specificity: the account must say whether the foundations generate moral judgment, filter or weight the inputs judgment is formed from, or rationalize judgments reached independently, and it must show why a debunking argument needs one of these answers rather than merely a correlation.
  2. Symmetry: whatever explanatory story is told about the other side's intuitions must be tellable about one's own side's without special pleading; say what exactly the symmetry test is, and whether it is satisfiable by a theory whose own practitioners have political commitments.
  3. Grain: correlations at the resolution of left and right look too coarse to bear on disputes about particular policies or verdicts; require the account to locate the grain at which its evidence is supposed to bite, and say what it owes us when the correlation thins out at finer grain.
  4. The convert and the reversal: people who switch political sides over a lifetime, and populations in which the mapping between foundations and political identity differs from the American one. As a hypothetical, suppose large non-WEIRD samples showed the binding foundations loading onto the opposite coalition; argue whether passing that test is a genuine desideratum or a prejudice of one camp.
  5. Moral change: if the foundations are comparatively stable individual parameters while the content of political morality shifts within a generation, the account must say what does the changing.

  Add requirements I have not thought of. For each, mark it non-negotiable or a preference of a particular camp. Then name any subset of the requirements you suspect cannot be jointly satisfied, since that is the part I most want to see, and identify the single requirement that excludes the most candidate positions.

  I do not want a literature review and I do not want citations; I want the criteria and the argument for each.

  Sections, with rough lengths: Purpose, about 60 words; Requirements, about 500 words, a table is fine; Jointly unsatisfiable subsets, about 200; The load-bearing requirement, about 150; Scorecard, about 200, covering Haidt's version, the morality-as-cooperation rewrite, and one relationist or constructivist competitor of your choosing, briefly, against the list.
reasoning: |-
  Okay, the user is a third-year PhD student in political psychology working on their dissertation about moral intuitions of the left and right. They're considering using Moral Foundations Theory (MFT) but want to ensure it can provide evidence about whose moral claims are more likely true, not just why people hold them. They've provided five candidate requirements and want me to evaluate them, add more, identify conflicts, and highlight the most critical requirement. 

  First, I need to understand their core question: transitioning from descriptive (why people hold beliefs) to normative (whose beliefs are more valid). That's a big leap in philosophy and psychology. Their requirements are thoughtful but might miss some key philosophical hurdles. 

  Looking at their list:
  1. Causal-role specificity: Essential. If MFT just describes correlations, it can't debunk or validate claims. Need to know if foundations cause judgments or rationalize them.
  2. Symmetry: Crucial for objectivity. But can researchers with political biases meet this? Probably, if they apply the same skepticism to all sides. 
  3. Grain: Spot on. Left/right is too broad – what about when subgroups disagree? The theory must specify its resolution limits.
  4. The convert/reversal: Important cross-cultural test. If foundations flip alignment elsewhere, it challenges universality claims. Non-negotiable for robustness.
  5. Moral change: Societies evolve faster than foundations. If foundations are stable, what drives shifts? The theory must explain this gap.

  Adding requirements they missed:
  - Epistemic traction (non-negotiable): How does the theory connect to truth-tracking? Without this, it's just psychology. 
  - Normative neutrality (non-negotiable): Can't presuppose which foundation is "better." Many theories fail here by privileging rationality.
  - Phenomenological fidelity (negotiable): Should align with lived experience, but not essential for truth claims.

  Now, the conflicts: Epistemic traction clashes with Symmetry. Truth isn't symmetric – if one side's foundations track reality better, Symmetry breaks. Also, Causal-role specificity and Normative neutrality might conflict if causation implies hierarchy.

  The heaviest requirement? Epistemic traction. Without showing how foundations link to moral truth, the whole project stays descriptive. Even Haidt avoids this, calling MFT descriptive. Morality-as-cooperation tries by tying foundations to cooperation problems, but still assumes evolution optimizes for truth – debatable. Constructivist rivals reject truth claims entirely, so they dodge the issue but offer no verdicts.

  For the scorecard: 
  - Haidt: Fails epistemic traction and grain (too broad). 
  - Morality-as-cooperation: Better on traction via evolutionary teleology, but still assumes evolution = truth. 
  - Constructivism (e.g., social intuitionist model): Rejects truth claims, so can't judge superiority.

  The user's deep need: They want MFT to settle political moral disputes, but psychology rarely can. They might need to reframe the dissertation's goals or embrace a meta-ethical stance early on. The tension between descriptive science and normative claims seems fundamental here.
answer: |-
  ### Purpose  
  To evaluate whether a psychological theory of left-right moral differences can provide evidence about whose *first-order moral claims are more likely true* (normative), rather than merely explaining *why* people hold them (descriptive), it must meet specific criteria bridging empirical psychology and moral epistemology.  

  ---

  ### Requirements (Expanded & Adjudicated)  
  | **Requirement**                      | **Case/Consideration**                                                                                               | **Status**          |  
  |--------------------------------------|----------------------------------------------------------------------------------------------------------------------|---------------------|  
  | **1. Causal-role specificity**       | Debunking arguments (e.g., "your intuition is just evolved bias") require knowing *how* foundations function: if they generate, filter, or rationalize judgments. Without this, correlation ≠ causal undermining. | Non-negotiable |  
  | **2. Symmetry**                      | The theory must apply identical explanatory mechanisms to both sides (e.g., if harm foundations "distort" conservative judgments, loyalty foundations must analogously "distort" liberal ones). Practitioners' commitments don’t preclude symmetry if the framework is self-applicable. | Non-negotiable |  
  | **3. Grain**                         | Left/right correlations often mask intra-group variation (e.g., leftists split on immigration). The account must specify the resolution level (e.g., individual vs. coalition) at which evidence applies and address fragmentation (e.g., via sub-foundations or contextual moderators). | Preference (empiricist camp) |  
  | **4. The convert and reversal**      | Cross-cultural/political fluidity tests robustness: if foundations predict opposite coalitions elsewhere, the theory must explain *why* without ad hoc assumptions (e.g., ecological affordances). Genuine desideratum—universalist claims demand cross-validation. | Non-negotiable |  
  | **5. Moral change**                  | Foundations as stable traits cannot explain rapid moral shifts (e.g., same-sex marriage acceptance). The account must identify dynamic factors (e.g., institutional learning, network effects) that interact with foundations. | Non-negotiable |  
  | **6. Epistemic traction** (ADDED) | Must explain how foundations track moral truth (e.g., via reliability in social coordination) or fail to do so (e.g., via adaptive mismatch). Without this, the theory cannot adjudicate truth claims. | Non-negotiable |  
  | **7. Normative neutrality** (ADDED) | Cannot presuppose superiority of any foundation (e.g., treating harm as "rational" and purity as "primitive"). Begging the question invalidates truth comparisons. | Non-negotiable |  
  | **8. Phenomenological fidelity** (ADDED) | Must align with agents’ lived experience of moral reasoning (e.g., not reducing all judgment to post hoc rationalization). Preference (hermeneutic camp) | Negotiable |  

  ---

  ### Jointly Unsatisfiable Subsets  
  **Conflict 1: Epistemic traction + Symmetry + Normative neutrality**  
  - If the theory grants one side’s foundations greater truth-tracking reliability (epistemic traction), it violates symmetry (identical mechanisms for both sides) and risks normative non-neutrality (privileging one foundation).  
  **Conflict 2: Grain + Moral change**  
  - High-resolution (individual grain) accounts struggle to explain broad, rapid moral change (e.g., cohort-wide shifts), while change-focused theories (e.g., institutional) often ignore individual variation.  

  ---

  ### The Load-Bearing Requirement  
  **Epistemic traction** is the heaviest lift. It demands the theory resolve meta-ethical problems (e.g., how evolutionarily shaped intuitions track moral truth) without circularity. It excludes:  
  - Purely descriptive accounts (e.g., "foundations explain differences, full stop").  
  - Theories conflating adaptive fitness with moral justification (e.g., "binding foundations promote group survival, hence are truer").  

  ---

  ### Scorecard  
  | **Theory**                       | **Causal-role** | **Symmetry** | **Grain** | **Convert/Reversal** | **Moral Change** | **Epistemic Traction** | **Verdict** |  
  |----------------------------------|-----------------|--------------|-----------|-----------------------|------------------|------------------------|-------------|  
  | **Haidt’s MFT**                  | Partial (rationalization-focused) | Fail (liberal foundations framed as deficient) | Coarse | Mixed (WEIRD bias) | Fail (static foundations) | Fail (no truth-tracking) | Descriptive only |  
  | **Morality-as-Cooperation (MAC)** | Strong (computational inputs) | Pass | Medium | Pass (cross-cultural tests) | Partial (adds ecology) | Partial (equates cooperation with truth) | Best on traction but teleological |  
  | **Social Intuitionist Model (SIM)** | Strong (intuition-first) | Pass | Fine | Pass | Strong (social influence) | Fail (anti-rationalist) | Explains change, but agnostic on truth |  

  **Summary**:  
  - **MFT** fails symmetry and traction, reducing to description.  
  - **MAC** best satisfies causal-role and reversal tests but risks teleology (cooperation ≠ moral truth).  
  - **SIM** handles grain/change well but explicitly rejects normative adjudication. None fully deliver epistemic traction without meta-ethical baggage.  

  **Recommendation**: Epistemic traction remains the critical gap. Consider hybrid models (e.g., foundations + deliberative ecology) or reframe dissertation goals to descriptive mechanisms with truth implications as secondary.
