prompt: |-
  My friend and I spent most of last night arguing about the work-conditionality regime attached to means-tested unemployment benefits, and neither of us could say what it actually commits anyone to believing. So let me describe the practice and ask you to reconstruct its theory.

  As I understand it: to keep the benefit, a claimant must log a fixed number of job-search activities each week and must accept any job the agency counts as suitable; in a number of systems the suitability bar falls the longer someone has been claiming, so obligations tighten as the odds of finding work lengthen. Compliance is measured by the activity logged, not by whether any application could realistically have succeeded. A claimant can also be required to work unpaid for several weeks at a placement, often for a private employer who keeps the output. That placement counts as work when it comes to what the claimant owes, but not when it comes to the minimum wage, employment rights, or a pay slip. Non-compliance is met by suspending payment for a fixed period, in some systems with only discretionary hardship relief. Meanwhile the same state attaches none of this to pensions, child benefits, or mortgage-interest relief, and nothing at all to a person of independent means who has never worked. My friend says the whole thing is desert-talk about the undeserving poor written into administrative rules; I say a state that blamed nobody could rationally run something very similar, for screening and for incentives.

  Three things, please. First, reconstruct the implicit view of where the obligation comes from: receipt of collectively funded transfers, the fact of being able to work and not working, or the need to sort the genuinely jobless from the work-shy under imperfect information. Second, say which commitments are strictly presupposed and which are merely comfortable with the practice: could a purely incentive- or screening-based justification with no claim about desert generate the same rules, does exempting pensioners and the idle rich show that reciprocity is not really what is doing the work, and is it coherent to treat one and the same placement as work when it grounds a duty and as not-work when a wage is at stake? Third, tell me what would have to change in the practice if each rival view you identify were substituted for the one it actually rests on.

  I do not want reading lists, citations, or surveys of the literature; I want the argument. Close with a single last line in the form \answer{...}, containing a phrase of no more than ten words naming the one commitment the practice cannot give up.
reasoning: |-
  Okay, the user and their friend had a heated debate about unemployment benefits and the work requirements attached to them. They want me to reconstruct the implicit theory behind these policies. Let me start by breaking down the key elements of the practice they described.

  First, claimants must log job-search activities weekly and accept any "suitable" job, with suitability standards lowering over time. Compliance is measured by the activity, not the outcome. There are also unpaid work placements that count as work for obligations but not for wages or rights. Penalties include benefit suspensions with little hardship relief. Meanwhile, other benefits like pensions or child support don't have these requirements, and the idle rich aren't subjected to them either.

  The user's friend thinks this is about desert—punishing the undeserving poor. The user argues it could be about incentives and screening without moral judgment. I need to address three things: the source of obligation, which commitments are necessary versus compatible, and how changes in underlying views would alter the practice.

  For the obligation's source, there are three possibilities: collective transfers creating reciprocity, the moral duty to work if able, or screening under imperfect information. Each implies different justifications. The desert view sees unemployment as a failure of character, hence punitive measures. The reciprocity view frames benefits as a contract requiring job search in return. Screening is pragmatic—preventing fraud without moral judgment.

  Now, which commitments are presupposed? The practice's punitive aspects, like sanctions without hardship relief, align more with desert. But some elements, like activity logging, could fit screening. Exempting pensioners and the rich is tricky. If reciprocity is key, why no demands on unearned wealth? That inconsistency weakens the reciprocity argument. The work placement duality—counting as work for obligations but not wages—only makes sense if the state prioritizes compliance over fairness, which desert or pragmatic screening could justify, but reciprocity might struggle with.

  Could a purely incentive-based system exist without desert? Maybe, with softer sanctions and better hardship protections. But the current harsh penalties suggest desert is at play. Changing the underlying view would alter practices: desert might tighten requirements, reciprocity would extend obligations to other benefits, screening might use data-driven methods without sanctions.

  The core commitment the practice can't give up is probably the mandatory activity itself—the state's insistence on demonstrable effort. Even in a screening model, you need to verify claims, though the method might differ. Without any requirement to prove job search, the system's integrity (from any viewpoint) would collapse. So the non-negotiable element is requiring claimants to demonstrate effort through specific actions.
answer: |-
  Here's the reconstruction and analysis you requested:

  **1. Implicit View of Obligation Source:**  
  The practice synthesizes three overlapping justifications, but prioritizes **reciprocity for collectively funded transfers** as the primary engine.  
  - *Reciprocity*: Receipt of public funds (from taxpayers) creates a *quid pro quo* obligation to actively seek self-sufficiency. Benefits are not an unconditional entitlement but a temporary exchange for demonstrable effort.  
  - *Ability/Idleness*: Underlying this is an unstated premise that being *able* to work but *un*employed is a deficit requiring correction. The state acts to enforce activity on those deemed capable.  
  - *Screening*: Logging activities and falling suitability bars are practical tools to distinguish the "genuinely jobless" (complying despite hardship) from the "work-shy" (who would refuse compliance), mitigating moral hazard under imperfect information.  

  **2. Commitments: Presupposed vs. Compatible:**  
  - **Strictly Presupposed:**  
    - **Reciprocity as Conditionality:** The *core* is that receipt of public support *must* create enforceable duties. Without this, mandatory activities and sanctions collapse.  
    - **Activity as Proxy for Intent:** Logging effort (regardless of efficacy) is treated as evidence of deservingness. This presupposes that non-compliance reveals moral failure/laziness, not structural barriers.  
    - **State Authority to Define "Suitability":** The state (via agencies) retains the power to redefine acceptable work standards unilaterally over time, overriding individual judgment.  

  - **Merely Compatible (Not Required):**  
    - **Desert vs. Incentives/Screening:** A purely incentive/screening-based system *could* generate similar *rules* (e.g., activity logs to prove search, falling suitability bars to test willingness). However, the **punitive sanction regime** (suspensions without reliable hardship relief) and **denial of worker status in placements** are *comfortable* with desert-talk but *not strictly required* for screening. A non-moral system would soften sanctions and avoid exploitation.  
    - **Exempting Pensioners/Idle Rich:** This **undermines reciprocity** as the *consistent* principle. If reciprocity were foundational, unearned income (pensions, trust funds) might also trigger activity demands. Their exemption suggests the real target is enforcing labor participation specifically on the *unemployed poor*, not reciprocity universally.  
    - **Placement Duality ("Work" vs. "Not-Work"):** This is **coherent only under a punitive or pragmatic screening view**. For *desert*, unpaid labor "pays back" society. For *screening*, it tests compliance cheaply. For *incentives*, it signals labor market attachment. It fails under reciprocity (which would demand fair exchange) or rights-based frameworks (denying minimum wage).  

  **3. Changes Under Rival Views:**  
  - **If "Desert" Were Primary:**  
    - Sanctions would intensify (longer suspensions, no hardship relief).  
    - Placements would become explicitly punitive (e.g., longer duration, harder labor).  
    - "Suitable work" definitions would drop faster, emphasizing willingness over fit.  
    - Moral assessments (e.g., "attitude") might formally influence compliance.  

  - **If Pure Incentives/Screening Were Primary (No Desert):**  
    - Sanctions would minimize harm (short-term, robust hardship protections).  
    - Placements would offer training/stipends, avoid private profit.  
    - "Suitable work" would balance claimant skills/sustainability.  
    - Compliance might accept broader evidence (e.g., training, care work).  

  - **If Genuine Reciprocity Were Primary:**  
    - Obligations would extend to other transfers (e.g., tax breaks for asset-holders requiring community service).  
    - Placements would confer full employment rights/wages.  
    - Benefit levels would be explicitly tied to past contributions.  
    - "Suitable work" would require proportionality to skills/experience longer.  

  \answer{Conditionality on public transfers}
