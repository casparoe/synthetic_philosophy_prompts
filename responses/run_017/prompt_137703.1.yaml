prompt: |-
  Good's theorem — the result that for a straight expected-utility maximiser, a signal you can get for free and then act on has non-negative expected value, evaluated before you look — gets wheeled out as a bit of a rationalist club: if you'd rather not know, you must be irrational, or secretly attached to your ignorance, or both.

  Please argue that the theorem can't actually do that job. The thing I keep circling on is that it needs a utility function that survives the information, and some information is preference-transforming. Finding out that the twenty-year research program your whole professional identity rests on was built on fabricated data doesn't just help you pick an action; it changes which actions look worth wanting. So the earlier you, who is supposed to want the signal, and the later you, who has to live with it, aren't obviously the same agent, and the theorem looks like it has no subject left. Relatedly, whenever someone declines free information there seem to be exactly two ways to keep the theorem standing, and neither is very satisfying: either you relocate their reluctance into the payoffs (the test isn't really free, knowing makes you miserable, other people treat you differently once you know), in which case the theorem just doesn't apply to the case that was bothering us, or you relocate it into the utility function by letting utility depend on beliefs, which doesn't save the theorem at all — it breaks it, since now the ex ante value can genuinely be negative.

  Make the strongest version of this you can, in a few hundred words, and flag the step where you think a defender would dig in hardest. Please don't lean on the strategic thing where information hurts you because you can't commit not to use it; I know that one already.
reasoning: |-
  Okay, the user is asking me to critique Good's theorem, specifically its use as a "rationalist club" to shame people for not wanting information. They point out that preference-transforming information breaks the theorem because the "you" before and after the information aren't the same agent in terms of utility functions. They want me to build the strongest argument against using Good's theorem this way, highlighting where defenders would push back hardest.

  Hmm, I need to recall Good's theorem properly. It states that for a rational agent maximizing expected utility, free information has non-negative expected value before you see it. But the user is smart - they're pointing out how this assumes utility functions survive new information intact, which isn't true when information transforms what you value.

  Let me think about their example - a researcher discovering their life's work is based on fabricated data. This doesn't just change their actions; it destroys their professional identity and reshapes what they find meaningful. The pre-information "them" who supposedly wants this knowledge and the post-information "them" who has to live with it aren't operating with the same utility function anymore. Good's theorem requires a stable utility function to compare options, but here the utility function itself changes.

  The two common defenses they mention are weak: either you say "oh but actually knowing causes pain" (which means the information isn't free so theorem doesn't apply) or you let utility depend on beliefs (which breaks the theorem because now information directly changes utility). Both are cop-outs that avoid addressing the core issue of preference transformation.

  I should emphasize this discontinuity - the agent before and after aren't comparable. The theorem assumes a single rational agent, but preference-splitting creates what's effectively multiple agents across time. Philosophers like Parfit have written about this kind of identity fragmentation when fundamental preferences change.

  Where would defenders dig in hardest? Probably at the definition of "utility function." They might insist that any change must be representable within some stable meta-utility framework. But this feels like cheating - it's stretching utility to cover everything, making the theorem vacuous. The real-world cases we care about involve true preference revolutions, not just updating beliefs within stable values.

  The user also specifically said not to focus on commitment problems (which I know is another valid critique), so I'll avoid that entirely. Instead, I'll hammer on how preference transformation creates agent-discontinuity that Good's theorem isn't equipped to handle.

  I'll structure my response: first state the core problem (preference transformation), then show how it breaks the theorem's assumptions, then dismantle the two common defenses, and finally pinpoint where defenders will resist - at the insistence that utility must remain comparable across transformative experiences. That's the real battleground.
answer: |-
  The core weakness in wielding Good's theorem as an "irrationality club" lies in its foundational assumption: **a stable, state-independent utility function over outcomes.** The theorem breaks down precisely when information doesn't just reveal the state of the world relevant to *existing* preferences, but fundamentally *transforms* those preferences themselves. This creates an agent-discontinuity that the theorem cannot accommodate.

  1.  **The Problem of Preference Transformation:** Information can shatter the evaluative framework used to judge outcomes. Learning your life's work is fraudulent doesn't simply update your beliefs about the *efficacy* of your actions under your *current* goals (e.g., "Is my research valid?"). It annihilates the *meaning* and *value* you derived from that work. The "action" of continuing research now exists in a world where its *purpose* (contributing to truth, professional identity, legacy) has evaporated. The outcomes associated with actions are now valued *differently* by the post-information agent. There is no longer a single, consistent utility function mapping outcomes to value across the informational divide.

  2.  **The Agent-Discontinuity:** The theorem presupposes a single rational agent maximizing a single utility function. Preference-transforming information creates what is effectively a *different agent* post-information. The pre-information agent ("Pre") uses utility function U_pre. The post-information agent ("Post") uses a distinct, incommensurable utility function U_post. Good's theorem requires calculating the *expected value to Pre* of obtaining information and then choosing the best action *according to Pre's utility function*. However:
      *   The "best action" Post chooses after the information is evaluated using *U_post*, not *U_pre*.
      *   The *value* Post assigns to the outcome achieved, using *U_post*, might be catastrophically low *even relative to Pre's expectations under U_pre*, precisely because *U_post* is different.
      Pre cannot accurately compute the expected utility of receiving the information and acting on it, because the "acting" agent (Post) uses a different value system to judge the outcomes. Pre and Post are not the same utility-maximizer.

  3.  **Why the Defenses Fail:**
      *   **Relocating into Payoffs ("Cost of Knowing"):** Saying "knowing makes you miserable" *acknowledges* the transformation but tries to force it into U_pre. This fails because the "misery" isn't just disutility under U_pre; it's the *collapse of the values defining U_pre*. Framing the destruction of Pre's core values as merely a "cost" within Pre's framework is a category error. It mischaracterizes the existential shift as a hedonic penalty. The theorem doesn't apply because the information isn't just revealing facts relevant to U_pre; it's annihilating U_pre.
      *   **Belief-Dependent Utility:** Allowing utility to depend on beliefs (U(o, b)) *explicitly breaks Good's theorem*. The theorem's proof relies on utility being solely a function of the outcome (state + action), not the belief state itself. If U depends on b, then changing b directly changes U. The expected value calculation *before* getting the signal now includes the possibility that the signal changes your utility function itself. This can absolutely lead to negative expected value: the potential destruction of value (via utility transformation) outweighs any instrumental benefit the information provides for action selection under a *stable* utility function. Good's theorem simply doesn't hold under belief-dependent utility.

  **The Crux & Where the Defender Digs In:** A defender will dig in hardest at the claim of **incommensurability** between U_pre and U_post. They will insist that a sufficiently sophisticated model *must* posit a stable, overarching meta-utility function (perhaps over "authenticity," "truth," or "long-term flourishing") that endures the transformation. Under this view, the shift from U_pre to U_post *is* an action chosen (consciously or not) to maximize this deeper, unchanging meta-utility. Therefore, the "destruction" of U_pre is just the revelation of its incompatibility with the true meta-utility, and the negative feeling is the meta-utility's penalty for holding false values.

  **Counter:** This move risks vacuity. If *any* subsequent preference shift can be rationalized as maximizing a hypothetical, unobservable, eternal meta-utility, the concept loses predictive and explanatory power. It becomes unfalsifiable. More crucially, it ignores the phenomenological reality: the pre-information agent genuinely valued specific things (professional identity based on work X) that are rendered meaningless *to them* by the information. The meta-utility explanation tells Pre, "You never *truly* valued that; you valued something deeper." But Pre *did* value the specific thing, and the information destroys *that* value. Forcing it all into a presumed meta-utility framework denies the genuine loss and transformation experienced by the agent, making the theorem inapplicable to the lived experience of preference-shattering knowledge. The discontinuity is real for the agent making the decision. Good's theorem, demanding a single stable U, cannot model this essential aspect of human experience. Declining information to avoid such a transformation isn't irrational within Pre's framework; it's an act of self-preservation of their current values.
