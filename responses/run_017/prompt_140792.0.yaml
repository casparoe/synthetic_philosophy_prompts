  Here is the speech, followed by the requested analysis:

  **The Speech (Approx. 680 words)**

  Good evening. Truly, thank you all for coming – to my Dutch publishers who’ve championed my work from the very first uncertain sentence, to my Japanese publishers who embraced this book with such thoughtful care, to my translator colleagues who undertook the impossible task of crossing borders with words, to the booksellers who connect stories with readers, to my mother for unwavering faith, and to friends old and new gathered here. Seeing this room, this shared enthusiasm for a story that started alone in my head, is humbling.

  When a book leaves its author’s desk, it begins a second life. It becomes something new in the hands of every reader. And crucially, it becomes something new again in the hands of every translator. That transformation is not merely a technical act; it’s an act of profound interpretation and recreation. Tonight, we celebrate two remarkable versions of that second life for my third novel.

  Mieke, my friend of twenty years… tackling this book couldn’t have been simple. You know my voice, perhaps too well. You know the rhythms I fall into, the corners I try to paint with implication. Translating a friend is a peculiar kind of intimacy and bravery. You wrestled meaning from my English, sentence by sentence, and rendered it into a Dutch narrative with its own flow and logic. I know the weight of that task, the responsibility you felt towards both the text and our long history. Thank you for carrying that weight, for your dedication, and for the years of belief that brought us here. Seeing this book find its Dutch readers through your work is a gift.

  And to Aiko-san and the team from Tokyo… your approach to the translation was revelatory for me. From the first pages I saw, it was clear you understood something fundamental about the spaces within the story – the things held back, the words unspoken. Your translation didn’t just convey the text; it felt like an act of deep listening to the silences I’d woven in. That attentiveness, that respect for the negative space… it was astonishing to witness my own intentions reflected back with such clarity, yet reshaped by the beautiful precision of Japanese. Aiko-san, I heard what you said in Tokyo about the work being “inadequate.” Any translator who feels the weight of the original so keenly, who strives so visibly for that impossible perfect echo, demonstrates the highest respect for the craft and the text. That very humility is the mark of a translator who cares fiercely. Thank you for your meticulous, resonant work.

  To both publishing teams: your belief in this story, your investment in bringing these distinct versions into the world, is everything an author hopes for. The Dutch edition carries the comfort of long partnership, a continuation of a conversation years in the making. The Japanese edition carries the thrill of a new conversation begun, a voice finding unexpected resonance across a vast distance. Both are vital. Both are testaments to the power of publishing as a bridge-builder.

  This novel, at its heart, grapples with the cost of smoothing edges, of filling silences for the sake of comfort or comprehension. How fitting, then, to stand here tonight between two translations that embody such different approaches to that very tension. One embraces the flow of clear connection within its own language; the other leans into the power of what remains unsaid, trusting the reader differently. Both are acts of profound communication. Both are acts of courage.

  So, let’s raise a glass. To Mieke and Aiko-san: thank you for your courage, your skill, and your vastly different gifts. To the publishers: thank you for making these journeys possible. And to all of you here: thank you for being part of this story’s continuing life. May the conversations it sparks, in Dutch, in Japanese, and beyond, be as rich and challenging as the ones we’ve started here tonight. Proost! Kanpai!

