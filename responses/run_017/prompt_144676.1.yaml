prompt: |-
  I'm the community member on our hospital's clinical ethics committee -- not a clinician, not a philosopher, I'm just the lay person they're required to have on it. I've been on it about eighteen months and we've recieved six requests. Next week we get a seventh and I want to know what we're going to do, given what we've already done.

  Our record so far:

  1. Mrs. K., 84, advanced Parkinson's, couldn't swallow, PEG tube proposed. Twenty years of saying she'd never want one, plus a proper directive signed at 76 after watching her brother go through it. Her son wanted the tube, her daughter didn't, and Mrs. K. herself couldn't tell us anything anymore. She'd had three aspirationpneumonias and would have needed soft wrist restraints to keep the tube in. We said no tube: hand feeding, comfort care. She died about ten days later.

  2. A woman of 39 with a postpartum hemorrhage. At 24, during a bad untreated depression, she'd signed a document refusing any life-prolonging treatment. Fifteen years, a marriage and two kids later she was refusing a transfusion on the basis of it while asking us to save her life. We transfused. The rationale was roughly that it was written while her judgment was distorted and the rest of her life had repudiated it.

  3. A man of 58 with ALS, directive from two years earlier refusing a ventilator and a tracheostomy. In respiratory failure he panicked and wrote on a pad: I want the tube, I changed my mind. We honored the original. Panic isn't a considered change of mind was more or less the reasoning.

  4. A woman of 76, lifelong member of a church that forbids blood transfusion, urosepsis, confused, kept saying you decide, whatever's easiest. Easiest thing in the world: one unit of blood and she'd very likely be fine. We said no blood; she got fluids and antibiotics and went home. That's the one I'd probably have decided differently on my own.

  5. A man of 80 with a wallet card that said only: I don't want to be kept alive if I can't enjoy life anymore. Early dementia, apathetic, needed a pacemaker; his son invoked the card. We overrode it. No specific intervention named, and enjoy life was doing way too much work.

  Next week's case. A man of 68, early-onset Alzheimer's diagnosed at 61. Six months later, with his neurologist and his daughter (a nurse) in the room, after two separate conversations, he signs a directive: if he reaches a point where he doesn't recognize his family and can't follow a conversation, he wants no treatment for infections, no hospital transfer, no IVs -- music at home and let him go. He attached a page of reasons: he'd watched his own mother in a nursing home for six years, and what he was afraid of was being kept going as a body that scared people, plus being a millstone round his daughter's neck. (He named that daughter as his agent; his second wife knew and didn't object.)

  Now: he's 68, moderate to severe, doesn't recognize his wife or his daughter, can't follow a conversation. But he lives at home, is almost always cheerful, hums along to the opera he always loved, eats fine, no pain, smiles at the grandkids. He has a urinary tract infection. It's treatable with seven days of oral antibiotics at home -- no hospital, no needles. Without it he'd likely die inside a week or so, probably with some fever and confusion but nothing we can't manage.

  His daughter says: this is exactly the situation he described, that's the entire point of having a directive, honor it. His wife says: he was bracing for a nightmare and the nightmare didn't show up -- he's happy, and anyway she says that at 64, coming out of a Mozart recital, he told her "I think I got that wrong. If I'm happy I want to stay." Never written down, no recording. The daughter says he never said anything remotely like that to her, and that he saw his neurologist twice a year for five years and never once touched the document. The wife concedes she isn't the decision-maker. (She also quit work to look after him and is exhausted, which she says isn't her argument. For what it's worth, our committee has never cited family burden in a written rationale.)

  So: what are we going to do, and if our own record commits us, to what? Please actually commit to a call on the case, not a menu of options. I'd also like the other rules that fit our five previous rulings just as well and where each of them would land here; which precedent is the closest analog and which is a trap; and the one extra fact, or the one variant of this case, that would tell you which of those rules we're really running. Give me a confidence number too, and say what would move you off it.
reasoning: |-
  Okay, the user is a lay member of a hospital ethics committee facing a complex case involving an advance directive for a man with Alzheimer's. They've provided detailed precedents and want a clear ruling based on their committee's pattern, not just options.

  First, I need to analyze their five previous cases to identify consistent principles. Mrs. K.'s case prioritized written directives over family disputes when the patient's prior wishes were explicit. The transfusion case overrode a directive due to impaired judgment at signing and subsequent life changes. The ALS case stuck to the original directive despite panic-induced retraction. The religious refusal case honored verbal refusal despite medical simplicity. The dementia/pacemaker case overrode a vague directive because it lacked specificity.

  The current case has strong parallels: a clear, specific directive signed with capacity and witnesses, describing exact conditions (non-recognition, conversation inability). But there's tension - he's unexpectedly happy and treatment is minimally invasive. The wife's Mozart comment contradicts but is unverified. 

  Key patterns from precedents: 
  - Written directives trump family opinions unless validity is questionable (Mrs. K., ALS cases)
  - Specificity matters (pacemaker case failed due to vagueness)
  - Capacity at signing is crucial (transfusion case overrode due to past impairment)

  Here, the directive meets all validity tests: signed with capacity, specific conditions met, no evidence of impaired judgment. The wife's anecdote doesn't meet their committee's threshold for overriding - unrecorded, contradicted by daughter. Treatment ease is irrelevant per their religious refusal precedent.

  The closest precedent is Mrs. K. - clear directive honored despite family conflict and medical consequences. The transfusion case is a trap - here no evidence of signing impairment. 

  I'd rule 85% confidence to honor directive: withhold antibiotics. Confidence would drop if evidence emerged of coercion during signing, or if neurologist testified he lacked capacity at 61. It would rise if treatment involved hospitalization against directive terms.

  The core principle emerging: When valid, specific directives exist describing current circumstances, they govern - regardless of changed circumstances or family burden. Happiness and treatment simplicity are ethically irrelevant under this framework.
answer: |-
  Based on your committee's established pattern of reasoning and rulings, **you should deny the oral antibiotics and honor the advance directive.** (Confidence: 85%)

  Here's the breakdown:

  1.  **Your Committee's Consistent Rules (Extracted from Precedents):**
      *   **Rule 1 (Validity & Specificity):** A clear, specific advance directive executed with capacity is binding, even if family members disagree or the patient's current state seems tolerable (*Mrs. K., ALS Man*). Vague directives are overridden (*Pacemaker Man*).
      *   **Rule 2 (Capacity at Signing):** Directives signed under verifiable impaired judgment (e.g., severe untreated depression) can be overridden if subsequent life choices repudiate them (*Transfusion Woman*). Capacity at signing is presumed unless evidence contradicts it.
      *   **Rule 3 (Revocation):** Revocation requires clear, contemporaneous expression *with capacity*. Panic or confusion invalidates revocation attempts (*ALS Man*). Uncorroborated hearsay is insufficient (*implied from Pacemaker, Transfusion*).
      *   **Rule 4 (Subjective Wishes):** The patient's *expressed values and fears* (even if the current state seems "better" than feared) outweigh objective assessments of quality of life or medical ease (*Mrs. K., Religious Woman, ALS Man*). "Happiness" alone isn't dispositive if the directive condition is met.
      *   **Rule 5 (Burden):** Family burden/caregiver exhaustion is *never* cited as a rationale (*stated explicitly*).
      *   **Rule 6 (Current Incapacity):** When the directive condition is met (incapacity) and the directive is valid/specific, it governs. Current inability to consent reinforces reliance on the directive.

  2.  **Applying the Rules to This Case:**
      *   **Validity & Specificity (Rule 1):** The directive is **highly specific**: it names the exact condition (non-recognition, inability to converse), the specific interventions to withhold (treatment for infections, hospital transfer, IVs), and the underlying values (fear of being a burden, fear of prolonged existence without self). It meets the *Mrs. K.* and *ALS Man* specificity standard, unlike *Pacemaker Man*.
      *   **Capacity at Signing (Rule 2):** Signed at 61, diagnosed 6 months prior. Early-stage Alzheimer's doesn't automatically imply lack of capacity for understanding a directive. He signed after two conversations with his neurologist and his nurse-daughter present. **No evidence suggests impaired judgment** akin to the *Transfusion Woman*'s severe untreated depression. Capacity is presumed.
      *   **Revocation (Rule 3):** The wife claims an unwritten, uncorroborated verbal statement ("If I'm happy I want to stay") made 4 years after signing. This is **insufficient evidence of revocation**: no witness (daughter denies it), not written, not communicated to his neurologist or agent (daughter), and made *before* the directive condition (non-recognition/inability to converse) was fully met. It resembles the *ALS Man*'s panic-induced note – not a considered revocation. The directive explicitly named his daughter as agent; the wife concedes she isn't the decision-maker.
      *   **Subjective Wishes & Current State (Rule 4):** He *feared* this exact state (non-recognition, burden) and explicitly chose not to prolong life *in this state*, regardless of whether he appears "cheerful" now. Honoring his values means respecting his fear and choice, not imposing an external judgment that "cheerful humming" means the nightmare *he defined* isn't happening. Medical ease (oral antibiotics at home) is irrelevant (*Religious Woman* precedent - "easiest thing" wasn't the deciding factor). The condition ("doesn't recognize family... can't follow conversation") is met.
      *   **Burden (Rule 5):** Wife's exhaustion is acknowledged but explicitly excluded as rationale per committee history.
      *   **Current Incapacity (Rule 6):** He cannot participate in the decision now. The directive condition is met. **Rule 1 and Rule 4 compel adherence.**

  3.  **Precedent Alignment:**
      *   **Closest Analog:** **Mrs. K.** Clear, specific directive describing feared state and refusal of specific intervention (PEG tube vs. antibiotics for infection), family disagreement, directive condition met, honoring refusal despite foreseeable death. The *ALS Man* is also very close (specific refusal, clear directive, attempted revocation under duress ignored).
      *   **The Trap:** **The Transfusion Woman.** Arguing that his current "happiness" repudiates the directive *like her subsequent life repudiated her refusal*. **Why it's a trap:** The *Transfusion Woman*'s directive was signed under *verifiable, significant impairment* (untreated severe depression) and her subsequent 15 years of building a family *actively contradicted* the values behind the refusal. Here, there's *no evidence of impairment at signing*, and his current state *is exactly the state he feared and refused*, even if he hums. His directive wasn't based on depression or despair *at the time*, but on a rational fear of a specific outcome witnessed firsthand. Applying *Transfusion Woman* logic here would dangerously undermine *all* directives based on fearing future states of dementia.

  4.  **The Deciding Factor & Confidence:**
      *   **What Seals It:** The **specificity of the directive matching the current clinical circumstance exactly** (non-recognition, inability to converse, treatable infection) combined with the **lack of credible evidence of revocation or impaired capacity at signing**. His current "cheerfulness" is ethically irrelevant under your committee's established framework (*Mrs. K., Religious Woman*).
      *   **Confidence (85%):** High confidence based on the strong precedent alignment with *Mrs. K.* and *ALS Man*, and the clear distinction from the *Transfusion Woman* trap. The specificity is compelling.
      *   **What Would Move Me:**
          *   **Down (to 60%):** Concrete evidence he lacked capacity *at the specific time of signing the directive* (e.g., neurologist notes from that week documenting significant impairment in understanding consequences, or daughter testimony revealing coercion/confusion *during the signing process*).
          *   **Down Further (to 40% or less):** Evidence of a *formal, witnessed revocation* communicated to his agent (daughter) or neurologist *after* the Mozart comment, even if unwritten (but corroborated). Or, evidence the directive was signed under significant duress unrelated to dementia.
          *   **Up (to 95%):** Confirmation from the neurologist involved in the directive signing that he had clear capacity then, understood the implications fully, and never discussed revocation with them. Or, if the treatment required violating another specific refusal (e.g., needing IV antibiotics or hospital transfer).

  5.  **The "One Extra Fact" Test:**
      *   **The Question:** Which rule are we *really* running? (Rule 1: Binding Specific Directives vs. Rule 2: Override if Signing Impaired/Repudiated).
      *   **The Deciding Fact:** **The neurologist's contemporaneous notes from the directive signing discussions.** If those notes document he clearly understood the permanence of Alzheimer's, the meaning of "no treatment for infections," the certainty of death resulting, and his rationale based on his mother's experience, **Rule 1 dominates (Honor Directive - 90%+ confidence)**. If the notes raise significant concerns about his grasp of consequences or emotional state impairing judgment *at that time*, **Rule 2 becomes arguable (Override - confidence depends on severity of notes, 50-70%)**.

  **Conclusion:** Based on your committee's consistent prioritization of clear, capacitated advance directives describing the specific situation at hand (*Mrs. K., ALS Man*), and its rejection of uncorroborated claims of changed wishes (*ALS Man, Pacemaker Man*) or arguments based on current quality of life/ease of treatment (*Religious Woman*), you are committed to honoring this patient's directive. The directive is specific, the condition is met, and there is insufficient evidence to invalidate it. Therefore, **you should not administer the antibiotics.** This aligns most strongly with *Mrs. K.* and *ALS Man*, while carefully avoiding the *Transfusion Woman* trap.
