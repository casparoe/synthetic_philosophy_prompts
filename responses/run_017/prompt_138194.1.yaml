prompt: |-
  I have been reading about the objection to utilitarianism that turns on the distinctness of persons, and I keep coming up against a move in these arguments that I cannot find a name for, so I will describe it as concretely as I can.

  The move is this. The critic says that adding benefits and burdens across people is illegitimate: within a single life I can take a loss now for the sake of a gain later and be none the worse overall, because the same someone gets both, but across lives the gain is had by one person and the loss by another and nobody is compensated. The defender's reply is almost never to deny this. It is to change what the addition is over. Add over person-moments rather than persons. Add over episodes of experience rather than experiencers. Add over the claims themselves rather than the claimants. Add over each person's prospects *before* it is settled who anyone will turn out to be, so that the choice is no longer one person's gain against another's loss but a single package of risk that each person takes on equally. In every case the summing survives intact, but the critic's description of what is being summed no longer applies, and the case now looks like the harmless within-a-life one.

  A concrete instance. A policy imposes a small risk of a serious injury on each of ten thousand people in order to secure each of them a small convenience. Stated as an outcome, this is a trade across persons only if the injuries and the conveniences fall on different people; restated ex ante, before anyone knows which of the ten thousand will be injured, the cross-person trade seems to vanish and what remains is one package that each person accepts for themselves.

  Two things make me think this is not simply equivocation or evasion, though I cannot rule that out. First, the redescriptions are not weaker versions of a strong claim quietly substituted for it under pressure; they are different constructions, each coherent on its own terms, and the people making them seem to mean them. Second, the critic is in the same position. To say what must *not* be added across, the critic must say what the unit is: a life, a person at a time, a household, a people. And whichever unit is chosen looks like the same kind of stipulation. Nobody can count the items in the sum until someone has said what kind of thing one item is, and the kind is not supplied by the subject matter.

  So I am not asking who wins that dispute. I am asking whether this predicament has an established name or a literature of its own: that a view must fix a unit of moral bookkeeping, that the unit is underdetermined, and that respecifying it changes the verdict while presenting itself as a minor technical choice. I have the sense that it sits near several things and is identical to none: the objection from the distinctness of persons itself, which appears to *presuppose* a unit rather than to supply one; the charge that a dispute is merely verbal; the point that you cannot count things of a sort without first settling the sort; and various boundary problems about who or what is to be included. A friend in biology says they have a version of the same argument there, which makes me suspect I am looking at something more general.

  What I want is the carving, not a label. If there is an established concept, tell me which it is, how my description fits it and where it fails to fit, and what its boundary cases are. If there is not, say so, and give me a name and a definition that distinguishes the phenomenon from each of those neighbours. In particular, I want a principled line between re-specifying the unit in a way that is a genuine moral advance and re-specifying it in a way that gets an answer without answering the question. My own candidates for the two sides are the move from counting nations or households to counting people, which strikes me as progress, and some of the ex ante redescriptions above, which strike me as closer to a dodge; I would like that judgement tested rather than confirmed. My own attempt at a name was "the denomination problem", after redenominating a currency, but I have come to doubt it, since redenomination alters no comparison at all, whereas here changing the unit does seem to change the verdict. Please don't send me a reading list or references; I am after the analysis. And please write in British English.
reasoning: |-
  Okay, the user presents a sophisticated philosophical problem about utilitarianism and the distinctness of persons objection. They've identified a recurring move in debates where utilitarians respond to criticisms about interpersonal aggregation by redefining the unit of moral accounting—shifting from whole persons to person-moments, experiences, claims, or ex ante perspectives. 

  The user wants this phenomenon carved precisely: its boundaries, relation to neighboring concepts, and especially how to distinguish legitimate unit-respecification from evasion. They explicitly reject mere labeling requests and demand analytical depth. Their frustration with surface-level readings is palpable—they've clearly wrestled with primary texts (Rawls/Parfit references implied but not named) and biological parallels suggest interdisciplinary thinking. 

  Notably, they're not taking sides but seeking conceptual clarity. Their "denomination problem" coinage reveals they want this framed as a measurement/currency issue, but correctly note redenomination doesn't change values whereas here unit-shifts alter moral verdicts. Key challenges they raise:
  1) Is the unit-stipulation arbitrary? 
  2) Why do some respecifications (e.g., counting persons not households) feel progressive while others (ex ante aggregation) feel dodgy?
  3) How does this relate to "merely verbal" disputes or boundary problems?

  Their biological analogy suggests they intuit this as a general problem of individuation in normative systems. The core tension: moral mathematics requires countable units, but unit-choice isn't morally neutral. 

  I'll avoid utilitarian literature references per their request, but Rawls' "separateness of persons" and Parfit's "reductionism" lurk here. The biological parallel might be unit-of-selection debates (gene/organism/group). 

  For naming: "Moral Aggregation Individuation Problem" captures the unit-specification struggle. "Individuation" emphasizes the "what counts as one?" question better than "denomination." The "Problem" suffix nods to its unresolved nature. 

  Boundary cases: 
  - At one extreme, crude aggregation ignoring persons entirely 
  - At other, absolute agent-relativity denying any comparability 
  - Key neighbors: 
    • Distinctness objection (assumes persons as units) 
    • Verbal dispute claims (denies substantive disagreement) 
    • Boundary problems (e.g., fetal/marginal cases) 

  To distinguish progress from dodge: Legitimate respecifications either:
  a) Correct measurement errors (e.g., counting oppressed groups previously excluded), or 
  b) Track morally relevant properties better (e.g., person-moments if identity is reducible). 

  Dodges preserve utilitarian sums by obscuring distributive impacts—ex ante aggregation's flaw is treating statistical risks as actual compensations when identities resolve. 

  British English maintained: "favours," "defences," "aggregative framework" etc. No citations, pure analysis as requested. The conclusion will stress this as a meta-problem about commensurability conditions for moral mathematics.
answer: |-
  Your dissection captures a profound and recurrent dilemma in moral philosophy—one that lacks a universally settled name but intersects with several established debates. The core phenomenon is the **indeterminacy of the moral accounting unit**, where the choice of "what counts as one" in aggregation determines the verdict on permissibility, justice, or value. Below, I carve the concept as requested, defining its boundaries, testing your intuitions, and proposing a name.

  ---

  ### **1. The Phenomenon: Definition and Boundaries**
  - **Core Structure**:  
    A normative theory (e.g., utilitarianism) requires aggregating benefits and burdens to determine overall value. However, **the unit over which aggregation occurs is underdetermined** by moral reality itself. Respecifying this unit (e.g., from whole lives to person-stages, experiences, or ex ante prospects) can transform a morally problematic inter-personal trade-off into an intra-unit trade-off, thereby legitimising the sum while sidestepping the original objection.  
  - **Key Features**:  
    - **Coherence**: Each unit (persons, moments, claims) offers an internally consistent framework.  
    - **Verdict-Sensitivity**: The moral conclusion changes with the unit chosen.  
    - **Stipulative Necessity**: No "natural" unit is dictated by the world; it must be posited.  

  - **Boundary Cases**:  
    - **Lower Bound**: Units smaller than persons (e.g., person-moments, hedonic states).  
      *Problem*: May dissolve personal identity, risking "distributional indifference" (e.g., sacrificing one person’s life for trivial gains to many).  
    - **Upper Bound**: Units larger than persons (e.g., families, nations, species).  
      *Problem*: May ignore individual claims (e.g., subjugating a minority for collective gain).  
    - **Non-Aggregative Frameworks**: Theories rejecting summation altogether (e.g., deontology, rights-based approaches) avoid this problem but face their own challenges (e.g., dealing with large numbers).  

  ---

  ### **2. Relation to Neighbouring Concepts**
  | Concept                     | Relation to Your Phenomenon                                                                 | Distinction                                                                 |
  |-----------------------------|---------------------------------------------------------------------------------------------|-----------------------------------------------------------------------------|
  | **Distinctness of Persons** | Assumes persons as the default unit; your phenomenon reveals this assumption is contestable. | The objection doesn’t *resolve* the unit problem—it presupposes it.         |
  | **Merely Verbal Disputes**  | Overlap when unit-respecification is accused of redefining terms to "win" arguments.         | Not merely verbal: different units imply substantively distinct moral worlds. |
  | **Boundary Problems**       | Both involve indeterminacy (e.g., "Who counts as a person?").                               | Your issue concerns *how* to individuate claims, not *who* qualifies as a claimant. |
  | **Ex Ante/Ex Post Analysis**| Ex ante framing (your example) is one *solution* to the unit problem.                       | The unit problem is the deeper quandary enabling such moves.                |

  ---

  ### **3. Distinguishing Progress from Dodge**
  Your intuition—that some unit-respecifications are progressive, others evasive—can be anchored in **two tests**:  
  - **The Moral Relevance Test**:  
    Does the new unit track a feature of moral experience that the old unit obscured?  
    - *Progress Example*: Shifting from "households" to "persons" recognises individuals as separate loci of suffering/well-being.  
    - *Dodge Example*: Summing over "person-moments" ignores the temporal unity of a life; a moment cannot *experience compensation* for past sacrifices.  
  - **The Agency/Compensation Test**:  
    Can the unit *bear the burden* of trade-offs in a way that permits genuine compensation?  
    - *Progress Example*: Ex ante equality of risk (e.g., a vaccine policy) distributes burdens *before* identities are fixed, making reciprocity possible.  
    - *Dodge Example*: Ex post aggregation of gains/losses across persons (after risks resolve) leaves actual victims uncompensated—their loss is "balanced" by others' gains.  

  **Your Policy Example Analysed**:  
  - **Critic’s View**: Ex post, the injured are burdened for others’ convenience → unjust.  
  - **Defender’s Ex Ante Move**: Each accepts equal risk for equal convenience → fair.  
  - **Verdict**: This is a *dodge* if the policy neglects ex post redress for victims. It is *progressive* only if robust compensation exists for the injured (e.g., social insurance). Without this, the sum "works" only by erasing the victims’ distinct voices.  

  ---

  ### **4. Proposed Name: The Problem of Aggregative Individuation**  
  - **Why this name?**  
    - "**Aggregative**": Centres the issue in summation-dependent theories.  
    - "**Individuation**": Emphasises the core problem—how we individuate moral "atoms" (what counts as *one* entity for accounting).  
  - **Advantages over your "denomination problem"**:  
    - "Denomination" implies mere rescaling (e.g., euros to cents), but your cases involve *metaphysical* or *moral* shifts (e.g., persons to moments).  
    - "Individuation" captures the philosophical weight of defining unit-boundaries.  
  - **Disadvantages**: No name is perfect; this risks sounding overly technical. Alternatives like "Moral Unit Indeterminacy" or "Aggregation Frame Dependence" are less precise.  

  ---

  ### **5. Why This Isn’t Just Equivocation**  
  The persistence of this move across debates (ethics, biology, economics) suggests a genuine metaphysical puzzle: **value-bearing entities do not come pre-individuated for moral mathematics**. When a utilitarian sums "utility," they must answer: *Utility of what?* The answer is theory-laden, not empirical. This creates a dilemma:  
  - If the unit is fixed arbitrarily, aggregation seems conventional.  
  - If the unit is derived from first principles, it risks circularity (e.g., "Persons matter because they’re persons").  

  This is why the dispute endures: both critics and defenders are grappling with a foundational ambiguity in moral bookkeeping. The solution, if any, lies not in rejecting aggregation but in rigorously justifying a unit that respects both moral agency and the phenomenology of suffering.  

  ---  
