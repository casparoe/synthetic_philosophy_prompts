prompt: |-
  I'm on a volunteer climate advisory committee for our mid-sized city — which is a fancy way of saying I'm the person who actually reads the spreadsheets. Our draft climate plan does three things with time that, set next to each other, look like they can't all be right, and I'd like help working out what's going on underneath.

  - The whole plan is built around a cumulative carbon budget: one number of tonnes we're allowed to emit between now and 2050, and as near as I can tell it makes no difference inside that window whether a tonne goes up in 2026 or in 2049. A tonne is a tonne.
  - Part of how we hit the number is offsets. One project on the table protects a forest for a hundred years and then the protection lapses (and it presumably gets cleared later). The protocol gives it about half the credit per tonne it would get for permanent protection, via this "tonne-year" calculation that treats a century of delay as worth roughly half of not emitting at all. A similar project nearby with a permanent easement gets full credit.
  - Separately, when we convert methane and the other short-lived gases into CO2-equivalent for the inventory, we use a multiplier that as I understand it adds up the warming a pulse of the gas causes over a fixed hundred-year window and then simply stops counting.

  So inside the budget, timing does nothing. In the tonne-year rule, timing does a lot. In the equivalence multiplier, timing matters right up to a cutoff and then stops mattering completely. None of us think that's three names for one idea, but none of us can say what the difference is meant to be, and one member keeps saying "the people in 2125 will be richer than us, so of course delay is fine," which I suspect is a fourth thing again.

  I don't want any reading list or citations — I'll go find the literature myself, and honestly I mostly need this before a meeting thursday. What I want is the conceptual map. What view of what we owe to people who come after us does each of those three rules fit with? Start with the tonne-year one: is that half-credit secretly just a discount rate in disguise, i.e. a claim that later people's welfare counts less, or can it be defended with no discounting of anyone's welfare at all?

  My half-formed idea is that the honest version goes through rate rather than level: what actually hurts a society isn't a temperature but the gap between how fast conditions are changing and how fast it can adapt, so delay is genuinely worth something even if future lives count exactly as much as ours — and on that story it should be worth more or less than half depending on what else is happening, not a flat fifty percent. Does that hold up? And is it the same argument as the "they'll be richer" one, or a different argument that happens to point the same way?

  Then the two things I really need for the meeting: which of these three numbers actually commit us to a substantive view about the future, and which would look exactly the same under several quite different theories — i.e. where can our committee stop feeling guilty? And if we took the rate-vs-level idea seriously instead, what concretely would change in how we score the forest project and in how we treat that hundred-year cutoff?
reasoning: |-
  Okay, let me start by unpacking the user's problem. They're on a climate advisory committee and are confused about three different approaches to carbon accounting that seem inconsistent. The key issues are the cumulative carbon budget (where timing doesn't matter), tonne-year accounting for offsets (where timing matters a lot), and the GWP100 for greenhouse gases (where timing matters until a cutoff). 

  First, I need to understand why these methods coexist despite their contradictions. The cumulative budget is based on the carbon-climate response, which is temperature-driven. Total CO2 emissions matter more than when they happen because CO2 stays in the atmosphere for centuries. But the tonne-year approach values delayed emissions less than permanent ones, and GWP100 sums warming over 100 years. 

  The user is asking about the underlying ethical views. For the carbon budget, it's agnostic about future welfare—it's purely physical. Tonne-year accounting implicitly discounts future harm, either ethically (future people matter less) or economically (they'll be richer). The GWP100's cutoff is arbitrary but practical, though it ignores post-2100 impacts.

  The user’s hypothesis is that delay helps by reducing the rate of change, aiding adaptation. That's valid. Faster changes are harder to adapt to, so delaying emissions could reduce harm even without discounting. But current tonne-year methods don't account for this directly; they use fixed multipliers. 

  For the meeting, the committee shouldn’t feel guilty about the carbon budget—it’s physically based. The tonne-year and GWP100 methods involve ethical choices. If they adopt the rate-based approach, they’d need dynamic models for offsets, adjusting credit based on background emissions and vulnerability. For GWP100, they could consider longer time horizons or alternative metrics like GWP* for short-lived gases.

  The user also needs to address the "richer future people" argument. That's separate—it's economic discounting, not adaptation. They should clarify that adaptation rate is about physical risks, not wealth. 

  Concrete steps: For forests, they could advocate for adaptive credit systems. For GWP, maybe push for updated metrics. But practically, sticking to standards might be necessary for credibility. Emphasize transparency about the assumptions behind each method.
answer: |-
  Here's the conceptual map you need, stripped down to the core ideas without citations. The three rules reflect fundamentally different framings of harm, responsibility, and time – **only one commits you to a specific ethical view**. Let's break it down:

  ### 1. The Cumulative Carbon Budget ("A tonne is a tonne")
  *   **What it assumes:** Peak warming is primarily determined by *cumulative* CO₂ emissions (the "carbon budget"). The climate system integrates emissions over centuries; timing within the budget period (e.g., 2026 vs. 2049) has negligible impact on the *peak temperature* reached, which is the primary driver of long-term, irreversible damage (sea-level rise, ecosystem collapse).
  *   **View of the Future:** **Agnostic on welfare or discounting.** It's a *biophysical reality*. Whether future people suffer more or less from a given temperature level isn't the point. The budget says: "Exceed X tonnes total by 2050, and we lock in >Y°C warming with high probability, regardless of the emission path." It focuses on avoiding catastrophic *states*.
  *   **Guilt-Free Zone?** **Yes, mostly.** This is based on climate physics (carbon-climate response). Your committee isn't making an ethical choice here; it's acknowledging a planetary boundary. The ethical choice was accepting the temperature target (e.g., 1.5°C).

  ### 2. Tonne-Year Accounting for Offsets (Half-credit for 100-year delay)
  *   **What it assumes:** The *harm* avoided by protecting a forest is proportional to the *integrated time* the tonne of carbon is kept out of the atmosphere. Protecting a tonne for 100 years delivers "100 tonne-years" of avoided warming impact. Permanent protection delivers an "infinite" number. The "half credit" rule (e.g., 100 years ≈ 50% of permanent) is a **simplified, arbitrary convention** based on comparing the area under the decay curves.
  *   **View of the Future:** **Secretly embeds discounting.** This is where your suspicion is correct. While often presented as a physical accounting tool, the choice to value tonne-years linearly and equate 100 years to half-permanence implicitly assumes:
      *   **Temporal Substitution:** Harm avoided now is valued similarly to harm avoided far in the future. This ignores that avoided harm *now* might prevent tipping points or irreversible loss that future harm cannot compensate for.
      *   **Discounting Lite:** Equating finite protection with a fraction of permanent protection mathematically resembles a very low (or zero) discount rate applied to a very long timescale, but the *choice of the fraction* (e.g., 50% for 100 years) is arbitrary and lacks a rigorous physical or ethical basis. It *can* be crudely defended without pure welfare discounting by framing it as "delayed warming has *some* value," but the *quantification* (50%) is where discounting logic creeps in.
  *   **Guilt-Free Zone?** **No.** This rule involves a significant *ethical and practical choice* about how to value temporary vs. permanent carbon storage. The "they'll be richer" argument is often used to *justify* this implicit discounting, but it's a *separate* argument (see below).

  ### 3. GWP100 (100-year Cutoff for Short-Lived Gases)
  *   **What it assumes:** The climate impact of different gases can be compared by calculating the cumulative radiative forcing (warming) caused by a pulse emission over a *fixed, arbitrary timeframe* (100 years). After 100 years, any remaining impact is ignored.
  *   **View of the Future:** **Implicitly devalues impacts beyond 100 years.** This is purely a *practical convention* for policy comparability, not a statement about ethics or future welfare. It simplifies complex atmospheric chemistry and lifetimes into a single number. The harm *doesn't* stop at 100 years (especially for CO₂!), but we agree to stop *counting* it for this specific accounting purpose.
  *   **Guilt-Free Zone?** **Yes, conditionally.** You're using a standardized metric (GWP100) required for reporting and aligning with national/inventories. The choice of 100 years is arbitrary (20 or 500 are also used sometimes!), but it's a widely accepted *accounting tool*, not a declaration that impacts after 2125 don't matter. The ethical burden lies in setting the *overall target* using this metric, not in the metric itself.

  ### Your Half-Formed Idea (Rate vs. Level & Adaptation)
  *   **Does it hold up?** **Yes, strongly.** This is a critical and often overlooked point:
      *   **Harm is Caused by Rate *and* Level:** While peak temperature determines *ultimate impacts* (level), the *rate* of change determines the *cost and feasibility of adaptation*. Rapid change overwhelms natural and human systems (coral reefs, agriculture, infrastructure, communities).
      *   **Delay *is* Genuinely Valuable (Even Without Discounting):** Delaying emissions (or deforestation) directly reduces the *maximum rate of warming* experienced. Slower change gives ecosystems, infrastructure, and institutions more time to adapt, potentially avoiding catastrophic disruption even if the same peak temperature is eventually reached. A forest protected for 100 years *does* significantly reduce the near-term rate of accumulation.
      *   **It's NOT Flat:** You're right. The value of delay depends entirely on the *background emission scenario*. Delay is incredibly valuable if it happens during a period of rapid emissions growth (flattening the peak rate). It's less valuable if emissions are already plummeting. **Current tonne-year rules (like 100 years = 50%) are crude averages that ignore context.**
  *   **Vs. "They'll be richer":** **Different Argument!**
      *   **Your Rate Argument:** Based on *biophysical adaptation limits*. Faster change = harder adaptation, regardless of wealth. Delay helps *everyone* adapt better.
      *   **"Richer Future" Argument:** Based on *economic discounting*. Assumes future generations will have higher GDP and better tech, so $1 (or a unit of harm) today is worth more than $1 tomorrow. This is a *controversial ethical choice* (should future lives count less?) and depends on uncertain economic projections. It *supports* discounting emissions/offsets, but for different reasons than the adaptation rate argument.

  ### Concrete Changes if You Took Rate-vs-Level Seriously
  1.  **Scoring the Forest Project:**
      *   **Ditch Fixed Tonne-Year Multipliers:** Instead of "100 years = 50% credit", develop/adopt a **dynamic model**.
      *   **Model Key Factors:** Credit should depend on:
          *   **Background Emissions Trajectory:** How fast is CO₂ rising *without* this project? (Faster rise = more valuable delay).
          *   **Vulnerability Window:** When is the forest/region most vulnerable to climate impacts? (Delay during high-vulnerability decades is more valuable).
          *   **Irreversibility Risk:** Does temporary protection realistically lead to permanent protection later? (If not, value decreases).
      *   **Result:** Credit could range from *much higher than 50%* (if delay occurs during critical peak emissions/vulnerability) to *much lower* (if emissions are already low and falling). Requires more complex modeling but is more scientifically defensible.

  2.  **The Hundred-Year Cutoff (GWP100):**
      *   **Acknowledge its Limitations:** Be explicit in the plan that GWP100 is used for practicality and consistency, but it underestimates the long-term impact of CO₂ and overemphasizes the short-term impact of methane relative to its *contribution to peak warming*.
      *   **Consider Complementary Metrics (For Understanding, Not Replacement - yet):**
          *   **GWP* (GWP-star):** Better for *sustained* methane emissions (e.g., livestock), linking them more directly to their impact on *warming rates*.
          *   **Global Temperature Change Potential (GTP):** Focuses on temperature at a specific point in time (e.g., 2050, 2100), more directly related to *peak/level* impacts than integrated forcing.
      *   **Focus Policy:** Use GWP100 for inventory/accounting, but prioritize actions based on their impact on *peak warming* (CO₂ reduction) *and* *near-term rate reduction* (methane/SLF reduction). Don't let the 100-year cutoff obscure the need for deep, permanent CO₂ cuts.

  ### Summary for Your Meeting
  *   **"Tonne is a tonne" Budget:** Safe. Based on physics. No ethical baggage on timing *within the budget*.
  *   **Tonne-Year Offsets:** **The ethical hot potato.** The "half credit for 100 years" rule implicitly discounts the future and ignores the context-dependent value of delay. Argue for dynamic valuation based on reducing the *rate* of change and adaptation needs. Reject the "richer future = discounting" argument as separate and ethically questionable.
  *   **GWP100 Cutoff:** A practical accounting tool. Acknowledge its arbitrariness but its necessity for consistency. Don't confuse it with a statement about future harm.
  *   **Your Committee's Guilt:** Should focus on **1.** Accepting the tonne-year rule uncritically, and **2.** Not being transparent about the limitations of GWP100. The cumulative budget itself is solid ground.
  *   **Concrete Ask:** Push for acknowledging the context-dependence of temporary storage value and exploring more nuanced approaches to scoring forest projects, even if full implementation requires more work. Call out the difference between valuing delay for adaptation (good) vs. discounting future welfare (controversial).

  This clarifies the distinct logics and arms you to challenge the inconsistencies and push for more robust, ethically sound accounting, particularly around offsets. Good luck Thursday!
