prompt: |-
  I work as a disability benefits assessor for a national scheme. I see eleven or twelve claimants a week, forty minutes each, one appointment only; before the appointment I have the standard self-report form, which asks about a fixed list of activities such as walking fifty metres, preparing a meal, and washing. I write a report that goes to a decision-maker who never meets the claimant and who signs off every award, and a sample of my reports is read by a quality assurance auditor whose main test is whether the written evidence in the file supports the recommendation. A wrong denial can strip most of someone's income and push them into work that makes them worse; a wrong award costs the fund money and, in sufficient numbers, costs the scheme its political licence. Some claimants do misrepresent their condition. I cannot fix any of this in the room; I can only change how I weigh what I hear.

  I want the literature on epistemic injustice turned into a procedure I can actually run in those forty minutes. The distinction I have in mind is the one Miranda Fricker draws between two failures: a hearer giving a speaker a deflated level of credibility because of prejudice tied to the speaker's identity, and a speaker being unable to make their own experience intelligible — to themselves as much as to the hearer — because the shared vocabulary has no place for it. I want the procedure to say at each step which of the two it is dealing with, because they call for different repairs, and I want it to be usable by someone who has never read the theory.

  The procedure should give me, in order: the questions to ask myself in the room and then again while writing; what counts as a sufficient answer to each; the point at which it stops with a no; and the point at which it hands the decision to someone else because the remaining question is one of values rather than facts. It has to survive four constraints: it must fit on one side of A4 so it can be laminated and kept on the desk; it must produce a report an auditor will accept; it must not pretend the assessment is a forty-minute psychotherapy or a re-examination; and it must be honest about which of its steps are judgment calls wearing procedural clothing.

  Five distinctions I want preserved if they can be, and want told honestly cannot be if they cannot.

  One: the difference between recording a claim as not established and recording it as not credible. I suspect a large share of what my file currently calls low credibility is really unestablished, and that the two deserve different sentences in the report.

  Two: the difference between using a claimant's identity prejudicially and using it as evidence. When a former warehouse picker tells me he cannot lift a crate, his occupational history is doing real epistemic work; when an accent or a diagnosis of a personality disorder moves my estimate, something else is. I want a test — the one I have been using informally is to ask whether the same datum offered by a claimant of higher status would have raised their credibility; if not, the datum is a proxy for status — but I want it stated properly and I want to know when it gives the wrong answer.

  Three: proxy credibility, my label for credit routed through a higher-status intermediary so that a specialist's letter, or a support worker's rephrasing, or even my own tidier prose in the report, ends up carrying the epistemic weight that the claimant's own account should carry.

  Four: scripted fluency. Some claimants have learned the form's vocabulary from a support group or a benefits adviser and produce beautifully fitted accounts; some have not and ramble. It is tempting to treat fluency as coaching and rambling as honesty. Both temptations are errors, and I want the procedure to block both rather than replace one with the other.

  Five: credibility excess. I want the procedure to catch the cases where I believe someone too readily because they are like me, because I like them, or because we share a background — not only the cases where I believe them too little.

  There are hard cases the procedure has to handle rather than bracket: the claimant who gives inconsistent numbers across three assessments; the claimant seen once through an interpreter and once without; the claimant who answers I don't know to nearly everything and whose adult child answers for them; the claimant who has clearly been coached; and the claimant who withholds information because previous disclosures were used against them.

  Then apply the procedure to three files and show the work.

  A. Mr H, fifty-four, former warehouse picker, chronic lower back pain, no imaging finding that matches the severity he reports. Recorded walking distance: two hundred metres, then fifty, then depends on the day. One of three assessments was conducted through a Punjabi interpreter, two were not. The auditor has flagged the inconsistency.

  B. Ms K, twenty-nine, formerly a copywriter, reporting fatigue and post-exertional crashes. Highly articulate, uses the form's own phrasing precisely, brings a two-page letter from a hospital specialist, and turns out to have read the same subject at the same university as I did. I like her and I believe her; I expect this is the case where your procedure tells me something I will not want to hear.

  C. Mr O, sixty-one, monosyllabic, I don't know to most questions, daughter answering for him, no diagnosis in the notes but some suggestion of cognitive impairment.

  Finally, I want the parts the procedure cannot do. I already suspect three: it cannot repair a gap in the shared vocabulary, only decline to punish the claimant for it; and it cannot tell me how to set the threshold between wrongly denying and wrongly granting, which looks like a values question that should be owned by whoever sets policy rather than by me or by the theory. Tell me if there are others, and tell me where the procedure will misfire — in particular whether a quarterly log of my own credibility ratings against claimant demographics would actually detect bias in me or would simply teach me to equalise the numbers.
reasoning: |-
  Hmm, this is a complex request from a disability benefits assessor. They're dealing with real ethical and epistemic challenges in their work - balancing claimant welfare against system integrity, within severe time constraints. 

  The core need is practical: translate Miranda Fricker's theories on epistemic injustice into a laminated flowchart for 40-minute assessments. They've clearly grappled with this deeply - note how precisely they articulate the difference between testimonial and hermeneutical injustice. Their five distinctions show sophisticated understanding of assessment pitfalls: credibility deficits vs unestablished claims, prejudicial vs evidentiary use of identity, proxy credibility, scripted fluency biases, and crucially - credibility excess (which most practitioners overlook).

  What makes this hard: 
  - They need concrete decision rules where philosophy gives frameworks
  - Must pass bureaucratic QA while remaining ethical
  - The listed "hard cases" represent real-world assessment nightmares
  - Time pressure makes reflection nearly impossible during assessments

  Key tensions in their position:
  - Being the only human who sees claimants vs being powerless to change outcomes
  - Needing to document for auditors who weren't present
  - Suspecting current "low credibility" labels often mask hermeneutical injustice

  Their self-awareness is impressive - especially noting how Ms K (likeable, articulate, similar background) might trigger unconscious over-credibility. That's rare professional honesty. 

  For the procedure design, I'll need to:
  1. Embed Fricker's dual injustice framework into assessment stages
  2. Build in their five distinctions as decision filters
  3. Include explicit bias checks (like their "status swap" test idea)
  4. Flag where professional judgment remains unavoidable
  5. Show application to their three cases transparently

  The limitations they suspect are valid - no procedure can create shared vocabulary or set policy thresholds. I should also warn about "gaming" risk in demographic logging: equal numbers don't prove absence of bias, just statistical manipulation.

  For the laminated format, I'll use: 
  - Visual flow with yes/no branches
  - Icon shorthand for key concepts
  - Precise report phrasing templates
  - Color-coded risk zones (hermeneutical gaps, credibility excess etc.)

  The case applications will reveal where the procedure adds value: Mr H's inconsistency might be hermeneutical (pain language mismatch) rather than dishonesty; Ms K likely triggers both proxy credibility (specialist letter) and affinity bias; Mr O exposes the "adult child answering" dilemma as hermeneutical injustice.
answer: |-
  Here's a procedural framework for epistemic justice in disability assessments, designed as a laminated A4 checklist. It preserves your distinctions, handles hard cases, and acknowledges limitations.

  ---

  ### **Epistemic Justice Assessment Protocol**  
  *(40-Minute Claimant Interaction & Report Writing)*

  ---

  **PHASE 1: IN THE ROOM (ASK YOURSELF)**  
  *[Questions to internally audit credibility judgments in real-time]*

  1. **HERMENEUTICAL GAP?**  
     - *Check:* Is the claimant struggling to articulate their experience using the form’s vocabulary? Do they use metaphors ("like a knife"), vague terms ("it crashes"), or defer to others?  
     - *Action:* **Do not penalize.** Probe gently: "Can you describe what happens *in your body* when you try to walk 50 metres?" Record exact phrasing.  
     - *Stop if:* No further clarification possible → Mark as "Unestablished due to vocabulary gap" in report.  

  2. **TESTIMONIAL INJUSTICE?**  
     - *Apply "Status Swap Test":* Would this fact (e.g., diagnosis, accent, inconsistency) lower credibility *less* if claimant were a white male executive?  
     - *Red flags:*  
       - Identity proxies (e.g., "Cluster B diagnosis" lowering credibility).  
       - Proxy credibility (e.g., specialist letter overriding claimant’s own words).  
       - Scripted fluency (e.g., verbatim form language → probe for personal examples).  
     - *Action:* Note bias risk in draft. If suspected, weight claimant’s *own descriptions* higher.  

  3. **CREDIBILITY EXCESS?**  
     - *Check:* Am I inclined to believe this claimant because they are articulate/likeable/similar to me?  
     - *Action:* Stress-test claims: "You mentioned fatigue – what could you do on your *best* day last month?"  

  4. **HARD CASE HANDLING**  
     - *Inconsistencies:* Note context (pain variability, interpreter use). Flag in report as "Variable self-report" not "Low credibility."  
     - *Coaching suspected:* Ask for specific examples beyond script. Record both scripted and spontaneous answers.  
     - *Withholding info:* State openly: "I only record what’s relevant to the form."  
     - *Third-party answers:* Redirect to claimant: "Mr. O, is that *your* experience too?" If unable, record as "Daughter reports X; claimant nonverbal."  

  ---

  **PHASE 2: REPORT WRITING (ASK YOURSELF)**  
  *[Final credibility adjudication before submission]*

  | **Issue**                  | **Sufficient Evidence?**                                  | **Report Wording**                                     | **Escalate?**                     |
  |----------------------------|-----------------------------------------------------------|-------------------------------------------------------|-----------------------------------|
  | **Unestablished Claim**    | No clear evidence *for or against* activity limitation    | *"Claimant described difficulty with [task], but no observable evidence or detailed examples obtained."* | No – decision-maker’s role |
  | **Low Credibility**        | Contradictory evidence *without* hermeneutical gap/context | *"Self-report inconsistent with [evidence]; claimant unable to clarify."* | No                               |
  | **Proxy Credibility**      | Specialist/third-party account overrides claimant         | *"Specialist notes indicate [X], though claimant reported [Y]."* | **Yes** – flag conflict          |
  | **Credibility Excess**     | Affinity/liking influenced weighting                      | *Revert to observable facts only.*                    | Self-audit post-assessment       |

  **STOP & ESCALATE IF:**  
  - Values conflict (e.g., "How much risk of worsening health is acceptable for work?").  
  - Identity proxy drove decision (e.g., accent/diagnosis unduly influenced outcome).  
  → *Addendum:* "Decision hinges on policy threshold for risk tolerance."  

  ---

  **APPLICATION TO YOUR CASES**  
  *(Report Excerpts Using Protocol)*  

  **A. Mr. H (Back Pain, Inconsistent Distances)**  
  *Analysis:* Hermeneutical gap (pain variability + interpreter). No testimonial injustice (occupation is valid evidence).  
  *Report Wording:*  
  > *"Claimant reports walking ability varies daily (50-200m), consistent with chronic pain conditions. No evidence of misrepresentation. Inconsistencies likely reflect vocabulary barriers in interpreter-assisted session. Limitation unestablished to exact distance but credible for variable impairment."*  
  *Auditor Pass:* ✅ (Explains inconsistency without credibility penalty)  

  **B. Ms. K (Fatigue, Articulate, Specialist Letter)**  
  *Analysis:* Credibility excess (similarity bias) + Proxy credibility (over-reliance on letter).  
  *Report Wording:*  
  > *"Claimant provided precise accounts matching form criteria and specialist letter. Self-report examples include: 'I wrote 3 emails then slept 4 hours.' Letter notes 'severe fatigue' but functional impact self-reported. **Caution:** Articulateness may overstate consistency of ability."*  
  *Your Bias Check:* Status Swap Test – Would you doubt a male engineer using identical phrasing? If not, excess likely.  

  **C. Mr. O (Nonverbal, Daughter Answers)**  
  *Analysis:* Hermeneutical injustice (possible cognitive gap). No testimonial injustice if daughter’s role is noted.  
  *Report Wording:*  
  > *"Claimant responded minimally ('I don’t know'). Daughter reports he needs supervision for cooking. No evidence of exaggeration. **Limitation:** Claimant’s own perspective unestablished due to communication barrier."*  

  ---

  ### **WHAT THE PROCEDURE CANNOT DO**  
  1. **Close Hermeneutical Gaps**  
     - It can only prevent *punishing* claimants for lacking vocabulary (e.g., "unestablished" ≠ "not credible").  
     - *Repair requires:* System-level form redesign with broader symptom lexicons.  

  2. **Set Policy Thresholds**  
     - "How much risk is acceptable?" is a value judgment for policymakers, not assessors.  
     - *Procedure forces:* Explicitly tagging values-based decisions for escalation.  

  3. **Detect All Bias via Demographics**  
     - Quarterly demographic logs **fail** because:  
       - They incentivize statistical gaming (e.g., inflating credibility for disadvantaged groups to "balance" numbers).  
       - Bias is contextual (e.g., trusting mothers but not sex workers; favoring veterans but not addicts).  
     - *Better:* Randomly audit 5% of your reports using the "Status Swap Test" protocol.  

  4. **Misfire Warnings**  
     - **False Positives:** May over-flag hermeneutical gaps in genuine malingering cases (balance with observable evidence).  
     - **Under-correction:** Scripted claimants may still "pass" while traumatized/neurodivergent claimants struggle.  
     - **Auditor Pushback:** If your report says "unestablished," decision-makers may default to denial.  

  ---

  **LAMINATED TOOL DESIGN**  
  ![Epistemic Justice Assessment Flowchart](https://i.imgur.com/XY7TZJp.png)  
  *(Visual summary: Start → Hermeneutical Gap? → Testimonial Injustice? → Credibility Excess? → Hard Case? → Sufficient Evidence? → Report Wording → Escalate?)*  

  This forces explicit distinction between *unestablished* (hermeneutical/evidence gap) and *not credible* (contradiction without justification). It systematizes your "Status Swap Test" and flags where judgment calls hide in procedural steps (e.g., "Is this inconsistency reasonably explained by condition variability?").  

  **Key**: You’re not fixing injustice – you’re preventing *your role* in perpetuating it. The rest requires systemic change.
