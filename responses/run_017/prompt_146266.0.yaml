  **Question Text**

  **Problem 4: The Housing Co-op Decision (30 marks)**

  Imagine you are on the board of a housing co-op with 41 members. Recently, the co-op moved major capital decisions from a 3-person maintenance committee to the entire membership, with decisions made by simple majority vote. One argument for this change was the Condorcet Jury Theorem (CJT), which suggests that larger groups can be more accurate when each member is more likely to be correct than not and votes independently.

  You have the following information:
  - The maintenance committee consists of 3 members. Each member independently makes the correct decision with probability 0.7.
  - The general membership of 41 has an average individual competence of 0.55 on these decisions, meaning each member, voting independently, would be correct with probability 0.55.
  - However, the membership is not homogeneous: there are about 5 reasonably informed members (each independent, p=0.55) and 36 fairly casual members. Among the casual members, one member named Dale (p=0.7) is particularly influential, and about 30 other casual members always vote exactly as Dale does. The remaining casual members (if any) vote independently with p=0.55.

  **Part A: Committee Accuracy (5 marks)**
  Compute the probability that the 3-person maintenance committee reaches a correct decision by majority vote. Show your work.

  **Part B: Full Membership Under Independence (10 marks)**
  Assume all 41 members vote independently, each with probability 0.55 of being correct. Compute the probability that the full membership reaches a correct decision by majority vote. Use the normal approximation to the binomial distribution (with continuity correction) and then comment on whether you think this approximation is reasonable for these parameters. (You do not need to compute the exact probability, but you should note if the normal approximation might be problematic.)

  **Part C: Actual Situation (5 marks)**
  Now consider the actual situation described above: 
  - 5 informed independent members (p=0.55)
  - 1 Dale (p=0.7)
  - 30 followers who always vote as Dale does
  - 5 independent casual members (p=0.55)

  What is the probability that the full membership reaches a correct decision? Explain your reasoning step by step.

  **Part D: Conceptual Analysis (10 marks)**
  Using the results from Parts A-C and your understanding of the CJT, answer the following:

  1. Why did the CJT argument for expanding the decision-making to the full membership fail in this case? What assumption of the CJT is violated? (3 marks)

  2. Compare the accuracy of the maintenance committee (Part A) to the accuracy of the full membership in both the independence scenario (Part B) and the actual scenario (Part C). Was the reform beneficial? (3 marks)

  3. The original decision that prompted this reform was whether to replace the roof now or keep patching it for another five years. This decision involves both factual questions (e.g., the current condition of the roof, projected costs) and value judgments (e.g., risk tolerance, willingness to endure disruption). How does this distinction affect the applicability of the CJT? (4 marks)

  ---

  **Model Answer**

  **Part A: Committee Accuracy**

  The committee has 3 independent members, each with p=0.7. Majority requires at least 2 correct. Using the binomial distribution:

  P(exactly 2 correct) = C(3,2) * (0.7)^2 * (0.3)^1 = 3 * 0.49 * 0.3 = 0.441  
  P(exactly 3 correct) = C(3,3) * (0.7)^3 = 1 * 0.343 = 0.343  
  P(majority correct) = 0.441 + 0.343 = 0.784

  **Part B: Full Membership Under Independence**

  We have n=41 independent voters, each with p=0.55. We want P(X>=21) for X~Binomial(41,0.55). Using normal approximation: 
  μ = n*p = 41*0.55 = 22.55
  σ = sqrt(n*p*(1-p)) = sqrt(41*0.55*0.45) = sqrt(41*0.2475) ≈ sqrt(10.1475) ≈ 3.1855

  We use continuity correction: P(X>=21) ≈ P(Y>=20.5) for Y~N(22.55, 3.1855^2). 
  Z = (20.5 - 22.55) / 3.1855 ≈ (-2.05) / 3.1855 ≈ -0.643
  P(Z >= -0.643) = P(Z <= 0.643) ≈ 0.74 (using standard normal table, which gives about 0.74)

  However, note that the normal approximation may be reasonable because np=22.55 and n(1-p)=18.45 are both greater than 5. The exact probability (computed via software) is about 0.748, so the approximation is acceptable.

  **Part C: Actual Situation**

  The voting blocs are:
  - A bloc of 31 voters (Dale and 30 followers) who all vote the same and are correct with probability 0.7 (since Dale's vote determines the bloc).
  - 10 independent voters: 5 informed and 5 casual independent, each with p=0.55.

  The majority requires at least 21 correct votes. Consider two cases:

  1. If the bloc of 31 is correct (probability 0.7), then we already have 31 correct votes, which is more than 21. Therefore, regardless of the 10 independent votes, the majority decision is correct.

  2. If the bloc is incorrect (probability 0.3), then we have 31 incorrect votes. The remaining 10 votes can be at most 10 correct. The total correct votes would be at most 10, which is less than 21. Therefore, the majority decision is incorrect.

  Thus, the majority decision is correct if and only if the bloc is correct. The probability is 0.7.

  **Part D: Conceptual Analysis**

  1. The CJT requires that voters are independent and have p>0.5. Here, the 30 followers are not independent; they vote exactly as Dale does. This creates a bloc of 31 identical votes, which violates independence. The CJT's mechanism of aggregating independent signals fails because the bloc's vote dominates and the independent votes cannot overcome it if the bloc is wrong.

  2. Comparing the accuracies:
     - Committee: 0.784
     - Full membership (independence): approx 0.74 (or 0.748 exactly)
     - Full membership (actual): 0.7

  The reform reduced accuracy from 0.784 to 0.7 (in reality) and even in the independence scenario (0.74) was lower than the committee. Therefore, the reform was not beneficial in terms of decision accuracy.

  3. The CJT applies to decisions with a single correct answer (e.g., factual questions). However, the roof decision involves value judgments (e.g., risk tolerance). The CJT does not apply to value judgments because there is no independent "truth"; it depends on preferences. The co-op should separate factual questions (where CJT might apply) from value judgments (which require a different method, like preference aggregation). Using majority voting on a combined question might not reflect the will of the members accurately.

  ---

  **Marking Scheme (30 marks total)**

  **Part A (5 marks)**
  - Correct binomial setup (1 mark)
  - Correct calculation of P(exactly 2) (1 mark)
  - Correct calculation of P(exactly 3) (1 mark)
  - Correct sum (1 mark)
  - Final answer 0.784 (1 mark)

  Common mistake: Forgetting to use the binomial coefficient.

  **Part B (10 marks)**
  - Correct μ (22.55) (2 marks)
  - Correct σ (approx 3.1855) (2 marks)
  - Continuity correction (use 20.5) (2 marks)
  - Z-score calculation (approx -0.643) (1 mark)
  - Correct probability (approx 0.74) (1 mark)
  - Comment on approximation: note that np and n(1-p) >5 so reasonable (2 marks)

  Common mistake: Not using continuity correction; miscalculating σ.

  **Part C (5 marks)**
  - Recognize the bloc of 31 votes (1 mark)
  - Realize that if the bloc is correct, majority is correct regardless of the rest (1 mark)
  - Realize that if the bloc is incorrect, the majority cannot be correct because the rest have only 10 votes (1 mark)
  - Conclude that the probability is 0.7 (1 mark)
  - Clear explanation (1 mark)

  Common mistake: Treating the followers as independent.

  **Part D (10 marks)**
  1. (3 marks) 
     - Identify independence violation (1 mark)
     - Explain that the bloc makes 30 votes non-independent (1 mark)
     - Link to CJT: independence is key (1 mark)

  2. (3 marks)
     - Compare committee (0.784) > full independent (0.74) > actual (0.7) (1 mark each for each comparison, but 3 marks total for a clear and correct comparison and conclusion)

  3. (4 marks)
     - Distinguish factual and value components (2 marks)
     - Note CJT only applies to factual questions (1 mark)
     - Suggest separating the decision or using a different method for values (1 mark)

  **Grading Note**: A top answer (A) will integrate the probability results with the conceptual points, especially in Part D, and show why the reform was misguided. A B answer might compute the probabilities correctly but not connect them to the failure of the CJT or the reform's impact. A C answer might have errors in computation and miss the conceptual points.

  **Answer Key for Instructor**:
  - Part A: 0.784
  - Part B: exact value (using binomial) is about 0.748 (computed as 1 - binom.cdf(20,41,0.55) in scipy, which gives 0.748)
  - Part C: 0.7
answer: |-
  ### Problem Set Question: Collective Decisions and the Condorcet Jury Theorem  
  **Total: 30 marks**  
  **Approximate word count for a strong answer: 700 words**  

  #### Background  
  You are on the board of a housing co-op (41 members) that recently voted to shift major capital decisions—such as replacing the roof—from a 3-person maintenance committee to the entire membership, using simple majority voting. The reform was justified using the Condorcet Jury Theorem (CJT), which states that if all voters are *independent* and each has a competence \( p > 0.5 \), the probability of a correct majority decision increases with group size and approaches 1 as \( n \to \infty \).  

  However, the co-op’s dynamics complicate this:  
  - The maintenance committee (3 people) has members who are independent and correct with probability \( p = 0.7 \).  
  - The general membership (41 people) has heterogeneous competence:  
    - 5 reasonably informed members, each correct with \( p = 0.55 \) (independent).  
    - 36 casual members:  
      - Dale (correct with \( p = 0.7 \)).  
      - 30 casual members who *always vote exactly as Dale does*.  
      - The remaining 5 casual members are independent with \( p = 0.55 \).  
  - Assume all voters are independent unless specified otherwise.  

  #### Tasks  
  **Part A: Committee Accuracy (5 marks)**  
  Calculate the probability that the 3-person maintenance committee makes a correct decision by majority vote. Show your work.  

  **Part B: Full Membership Under Independence (10 marks)**  
  Assume all 41 members vote *independently* with \( p = 0.55 \).  
  1. Calculate the exact probability of a correct majority decision using the binomial distribution.  
  2. Approximate this probability using the normal distribution (with continuity correction).  
  3. Briefly comment on why the normal approximation might be slightly inaccurate here (no calculations needed).  

  **Part C: Full Membership in Reality (5 marks)**  
  Using the actual co-op structure (with Dale and followers), compute the probability of a correct majority decision. Explain your reasoning step by step.  

  **Part D: Conceptual Analysis (10 marks)**  
  1. The CJT was cited to justify expanding decision-making. Based on your results:  
     - Why did this argument fail? Identify the violated assumption and explain how deference undermines CJT. (3 marks)  
     - Compare the accuracy of the committee (Part A), the independent full membership (Part B), and the actual full membership (Part C). Was the reform beneficial? (3 marks)  
  2. The roof decision involves:  
     - *Factual components* (e.g., "Will patching the roof last 5 years?").  
     - *Value components* (e.g., "How much risk should we tolerate?").  
     Discuss how this distinction affects the applicability of CJT. (4 marks)  

  ---

  ### Model Answer (Approx. 600 words)  
  **Part A (5 marks)**  
  The committee’s majority requires ≥2 correct votes. Each member is independent with \( p = 0.7 \). Using the binomial formula:  
  \[
  P(\text{majority correct}) = P(X=2) + P(X=3) = \binom{3}{2}(0.7)^2(0.3)^1 + \binom{3}{3}(0.7)^3(0.3)^0 = 3(0.49)(0.3) + 1(0.343) = 0.441 + 0.343 = 0.784.
  \]  
  Thus, the committee’s accuracy is **0.784**.  

  **Part B (10 marks)**  
  1. **Exact probability (binomial)**: For \( n = 41 \), \( p = 0.55 \), majority requires ≥21 correct votes.  
     \[
     P(X \geq 21) = \sum_{k=21}^{41} \binom{41}{k} (0.55)^k (0.45)^{41-k}.
     \]  
     Computation yields **0.748** (exact value).  

  2. **Normal approximation**:  
     - Mean \( \mu = np = 41 \times 0.55 = 22.55 \).  
     - Standard deviation \( \sigma = \sqrt{np(1-p)} = \sqrt{41 \times 0.55 \times 0.45} \approx \sqrt{10.1475} \approx 3.185 \).  
     - With continuity correction, \( P(X \geq 21) \approx P(Y \geq 20.5) \) for \( Y \sim \mathcal{N}(22.55, 3.185^2) \).  
     - \( z = \frac{20.5 - 22.55}{3.185} \approx -0.644 \), so \( P(Y \geq 20.5) = P(Z \geq -0.644) \approx 0.740 \) (from standard normal tables).  

  3. **Comment**: The normal approximation (\( \approx 0.740 \)) slightly underestimates the exact probability (\( 0.748 \)) because \( np = 22.55 \) and \( n(1-p) = 18.45 \) are both >5, but the skewness (since \( p \neq 0.5 \)) causes minor error.  

  **Part C (5 marks)**  
  The actual group has:  
  - **Bloc of 31 voters** (Dale + 30 followers): Correct with \( p = 0.7 \).  
  - **10 independent voters** (5 informed + 5 casual): Each correct with \( p = 0.55 \).  
  Majority requires ≥21 correct votes.  
  - If the bloc is correct (probability \( 0.7 \)), they contribute 31 correct votes. This exceeds 21, so the decision is correct *regardless* of the independents.  
  - If the bloc is incorrect (probability \( 0.3 \)), they contribute 0 correct votes. Even if all 10 independents are correct (10 votes), total correct = 10 < 21, so the decision is incorrect.  
  Thus, the majority is correct only if the bloc is correct. Accuracy = **0.7**.  

  **Part D (10 marks)**  
  1. **CJT failure and reform impact**:  
     - The CJT assumes *independent signals*, but deference makes 30 voters copy Dale. This violates independence and effectively reduces the group to a "bloc + independents." The bloc’s size (31) exceeds half the group (20.5), so group accuracy equals bloc accuracy (0.7). Adding voters without independence does nothing—**independence, not headcount, drives CJT**.  
     - Comparison:  
       - Committee: **0.784**.  
       - Full membership (independence): **0.748**.  
       - Full membership (actual): **0.700**.  
       Even with independence, full membership accuracy (0.748) is *lower* than the committee’s (0.784) due to lower \( p \) (0.55 vs. 0.7). The actual accuracy (0.7) is worse. The reform *reduced* accuracy.  

  2. **Factual vs. value components**:  
     - CJT applies only to **factual questions** (single "correct" answer verifiable independently of voters). For the roof, factual components (e.g., "Will patching last 5 years?") fit CJT if competence \( p > 0.5 \).  
     - **Value judgments** (e.g., "How much risk is acceptable?") lack an objective truth; they depend on preferences. CJT does not apply here. Aggregating values requires mechanisms like bargaining or ranked voting, not majority rule on a merged question.  
     - **Implication**: The co-op should separate factual and value components. CJT may justify group input on facts, but values need preference-sensitive methods.  

  ---

  ### Marking Scheme (30 marks total)  
  | **Part**         | **Must-Hit Points**                                                                 | **Marks** | **Common Mistakes**                                                                 |  
  |------------------|-------------------------------------------------------------------------------------|-----------|-------------------------------------------------------------------------------------|  
  | **A: Committee** | Correct binomial setup; P(X=2) and P(X=3) calculations; final answer (0.784).       | 5         | Missing binomial coefficients; arithmetic errors; not summing P(X=2) and P(X=3).    |  
  | **B: Independence** | Exact P(X≥21) = 0.748; normal approx. (μ, σ, z-score, P≈0.740); comment on skew. | 10        | No continuity correction; wrong σ; misreading z-table; claiming approximation is exact. |  
  | **C: Actual**    | Bloc of 31 controls outcome; accuracy = P(bloc correct) = 0.7; clear reasoning.     | 5         | Treating followers as independent; not seeing bloc dominance; incorrect majority threshold. |  
  | **D1: CJT & Reform** | Independence violated by deference; bloc caps accuracy; committee > independent full > actual; reform harmful. | 6 (3+3)   | Only stating "independence matters" without linking to results; not comparing all three accuracies. |  
  | **D2: Fact/Value** | CJT requires factual truth; values lack objective correctness; need separate aggregation. | 4         | Conflating facts/values; claiming CJT applies to all decisions; no practical implication. |  

  #### Grading Notes  
  - **A (25–30 marks)**: Correct computations *and* uses them to dissect CJT’s assumptions, reform impact, and facts/values distinction. Part D is thorough and contextual.  
  - **B (18–24 marks)**: Mostly correct math, but Part D is shallow (e.g., "independence is important" without explaining *why* or *how* it caps accuracy). Minimal discussion of reform or facts/values.  
  - **C (10–17 marks)**: Significant math errors (e.g., wrong binomial probs, misapplying normal approx.). Part D ignores key concepts (e.g., no mention of bloc dominance or facts/values).  
  - **D (<10 marks)**: Incomplete/incorrect math; minimal engagement with CJT concepts.  

  **Key for B → A jump**: The best answers use computations to expose CJT’s limits (e.g., "adding voters *without independence* is useless" in Part C/D) and tie the roof example to theory (e.g., "CJT can’t tell us what risk *should* be tolerated").
