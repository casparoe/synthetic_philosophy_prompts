prompt: |-
  My friend Miriam and I spent most of last evening arguing about whether anything can be recovered about Jesus of Nazareth from the Gospels, and we ended up circling rather than disagreeing cleanly, so I want a sharper description of what she is actually doing. She thinks a real figure can be recovered and that a short list of tests does the recovering. I think the tests get applied one at a time and always come out wherever the person applying them already wanted to be.

  These are the rulings I pinned her to. Jesus' baptism by John: authentic, because a church that proclaimed Jesus as Lord would hardly have invented a story in which he submits to someone else's rite. The crucifixion under Pilate: as certain as anything gets. The cry of dereliction from the cross: not authentic, because it is too neatly composed out of the opening of Psalm 22 — embarrassment value notwithstanding. The prediction that no stone of the temple will be left on another: authentic, on the grounds that it turns up in Mark, in John, in Acts and in the charges at the trial, and that it explains why the movement collided with the temple authorities. The prohibition of divorce and the instruction that a person's word should simply be yes or no: authentic, because the later church softened both, and traditions do not get stricter as they go. The Lukan saying that the kingdom of God is already present within or among you: rejected as the evangelist's editing; she holds instead that Jesus announced a kingdom about to break in from above, and that the spiritualised, deferred version is a later adaptation. The long Johannine discourse in which Jesus calls himself the bread of life: rejected, and here her reasoning inverts — it is too exactly the theology of the later church to be earlier than it. The virginal conception and the infancy stories: rejected, although she concedes the Greek is Semitic in flavour, on the grounds that style can always be imitated. Parables that appear only in Luke, such as the good Samaritan: she declines to rule at all, calling them possible but unprovable.

  So here is the case I want your prediction on. Suppose a papyrus fragment is published next month, provenance unknown, dated by its handwriting to the early third century, containing a saying found in no canonical gospel. In translation it runs: do not pray that the kingdom may come; pray that you may not be put to shame when it comes, for it comes like a snare on everyone who watches for it, and those who keep watch by night will be the last to see it. The Greek is translation-Greek built out of matched parallel lines, and a very similar saying appears in Syriac in a Christian work of roughly the same period, which may or may not depend on the Greek.

  What will she say — authentic, inauthentic, or unprovable — and what is she running? Please name the two or three rules that fit her whole track record equally well, say what each of them predicts about this fragment and exactly where they come apart on it (note that the saying is at once embarrassing relative to the church's own prayer practice, stocked with imagery the church used everywhere, flattering to an apocalyptic Jesus, and attested only late and perhaps only once), give me your single best guess with the reason for preferring it, and close by specifying the one further case you would put to her to tell the surviving rules apart. Under 700 words, and please don't point me at anything to read — I want the reasoning, not sources.
reasoning: |-
  Hmm, the user and their friend Miriam are having a debate about historical Jesus methodology. Miriam uses specific criteria to judge gospel sayings as authentic or inauthentic. The user wants me to predict how Miriam would evaluate a newly discovered saying based on her established pattern.

  Looking at Miriam's rules: She accepts sayings that cause embarrassment to the early church (like Jesus' baptism), have multiple attestation (temple destruction prediction), or show development toward leniency (divorce prohibition). She rejects sayings that seem theologically tailored to later church positions (John's bread of life discourse) or that spiritualize Jesus' message (Luke's present kingdom). Style arguments don't sway her (virginal conception).

  The new saying has conflicting characteristics: It's embarrassing because it contradicts the Lord's Prayer about praying for the kingdom, which favors authenticity. But it uses apocalyptic imagery common in early Christianity, which might suggest inauthenticity as it fits too neatly. It appears late (3rd century) with possible single attestation, which Miriam usually sees as problematic. Yet it's flattering to an apocalyptic Jesus, which aligns with her view of Jesus' message.

  The key tension is between the embarrassment criterion (which would push toward authentic) and the criterion of late/limited attestation plus thematic consistency (which might suggest inauthentic). The apocalyptic theme is central to Miriam's view of Jesus, so she might overlook the late attestation.

  I think Miriam would likely judge it as authentic because the embarrassment factor trumps other concerns in her methodology. The contradiction with established prayer practice is strong evidence for her. To test this further, I would propose a saying that's both embarrassing AND theologically developed to see which criterion she prioritizes.
answer: |-
  Based on Miriam's established methodology, here's the prediction and analysis:

  1.  **Miriam's Likely Verdict:** **Authentic.**
  2.  **Her Core Rules:**
      *   **Rule 1: Embarrassment/Dissimilarity:** Traditions embarrassing to the later church or dissimilar to its developed theology/needs are likely authentic (e.g., Baptism by John, Divorce Prohibition). *Applies strongly here: Contradicts the Lord's Prayer ("pray that the kingdom may come") by discouraging that very prayer.*
      *   **Rule 2: Multiple Attestation/Explanatory Power:** Events/sayings attested in multiple independent traditions or explaining key historical conflicts are likely authentic (e.g., Temple Destruction Prediction, Crucifixion). *Applies weakly/negatively here: Only one late source (papyrus fragment), no canonical attestation, weak explanatory power.*
      *   **Rule 3: Anti-Direction of Tradition:** Traditions where the church later softened or spiritualized a stricter/clearer original position are likely authentic (e.g., Divorce Prohibition). *Applies indirectly: The saying's raw, imminent apocalyptic expectation contrasts with later spiritualized/deferred views, aligning with her "about to break in" Jesus. The late attestation weakens this.*
      *   **Rule 4: Rejection of Later Theology:** Sayings too perfectly aligned with developed church theology are rejected as creations *of* that later church (e.g., John's Bread of Life, Luke's Present Kingdom). *Applies negatively here: While apocalyptic, the *specific* content (don't pray for it, shame focus, watchfulness paradox) isn't core developed church doctrine; it's raw and potentially embarrassing.*

  3.  **Conflict on the Fragment:**
      *   **Rule 1 (Embarrassment)** predicts **Authentic**: The explicit contradiction of the central Lord's Prayer petition is profoundly embarrassing. The church wouldn't invent Jesus telling followers *not* to pray for the Kingdom's coming.
      *   **Rule 2 (Multiple Attestation)** predicts **Inauthentic/Unprovable**: Single, late (3rd century) attestation, unknown provenance. No support from earlier, canonical sources.
      *   **Rule 3 (Anti-Direction/Consistency with Apocalyptic Jesus)** leans **Authentic**: It fits her view of Jesus preaching imminent, disruptive apocalyptic judgment ("like a snare") and warns of shame, contrasting with later spiritualization. The "watching" theme is consistent.
      *   **Rule 4 (Rejection of Later Theology)** predicts **Authentic**: It's *not* a neat fit for developed theology; its specific prohibition and paradoxical warning ("watching" leads to being "last") are jarring, not doctrinal.

  4.  **Reason for Predicting "Authentic":** The **embarrassment factor (Rule 1)** is overwhelming and decisive for Miriam's method. The saying directly subverts a core liturgical practice established in the earliest tradition (the Lord's Prayer). This trumps the late attestation (Rule 2's weakness) and aligns with her apocalyptic Jesus (Rule 3). It avoids being "neatly composed" like Luke's present kingdom or John's discourse (Rule 4 doesn't trigger).

  5.  **Test Case to Distinguish Rules:** Present a saying: **"The Son of Man came not to save souls, but to establish justice for the poor on earth before the great judgment."**
      *   *Why it tests:* It's potentially embarrassing (de-emphasizes "saving souls," focuses on earthly justice) but *also* aligns strongly with modern liberation theology concerns.
      *   *Distinguishes:* Does Miriam accept it based on embarrassment (Rule 1) and apocalyptic context (Rule 3), or reject it because its specific social justice focus feels suspiciously tailored to later/modern debates, potentially violating the spirit of Rule 4? This pits Embarrassment against the suspicion of later theological shaping.
