prompt: |-
  Long-time lurker, first-time poster. I keep flip-flopping on advance directives / Ulysses contracts, so I want to do reflective equilibrium on myself: here are my gut verdicts, is there one principle that spits out all of them, or do I have to eat one?

  - Bipolar, currently manic, says "I've never felt better, stop the lithium" — the euthymic self's instruction ("if I'm manic and refuse, treat me anyway") wins. Confident.
  - At 25 she writes "if I'm ever severely demented, no antibiotics"; at 84 she's demented, plainly enjoys music and visits, and picks up a chest infection. My gut: treat, ignore the document. (I know the usual critical-interests move à la Dworkin; my gut is still with the person in the bed.)
  - At 22 he writes "if I ever get sucked into one of those obsessive online communities and start refusing treatment, assume I've been captured and override me". At 30 he's exactly there, lucid-ish, refuses a life-saving transfusion. My gut: honour the 22-year-old.
  - A 20-year-old signs a hardcore "everything to x-risk work, no heroic measures" directive, then re-ups it annually for fifteen years via a one-click "still stands" prompt, never reopening the scenario descriptions. My gut: those re-ups add almost nothing, it's still a 20-year-old's document.
  - At 40, after a decade of slow stable revision and burnout, he quietly revokes it and wants the money to go to his kids. My gut: the revocation wins, even though the 20-year-old would have said "the 40-year-old has lost the plot".
  - New one: a model fine-tuned on forty years of her journals and forum posts ("the continuation") says, more reliably than her family, that she'd want X. My gut: this gets some weight but nowhere near directive-level authority, and I can't say why.

  My tentative principle is: the earlier self binds only when it correctly picked out the specific mechanism by which the later self would come to disagree. That handles the first three but feels shaky on the last three.

  The case I actually lose sleep over: stable and euthymic for three years, she writes a considered note saying lithium flattens her and she'd rather accept relapse risk, with reasons her earlier self never weighed. Half the time I think the psychiatric directive still binds (known failure mode, known base rates), half the time I think that's just paternalism in a lab coat.

  Tell me which of my verdicts your account can't save and what it predicts about the continuation case. Please separate what's genuinely settled among people who know this literature from what's contested — don't sell me a contested view as the consensus — and be straight about where the cases just underdetermine the answer. British English, please. Final line, machine-readable: \answer{...} containing a one-sentence statement of the principle you're offering, or "no unified principle" plus the one verdict you'd overturn.
reasoning: |-
  Hmm, the user presents a complex ethical dilemma about advance directives and Ulysses contracts, using six hypothetical scenarios to test their gut reactions. They're seeking a unified ethical principle that can reconcile these intuitions, or alternatively, guidance on which intuition might need revision.

  Looking at their cases, I notice several patterns: they consistently prioritize later selves when there's evidence of genuine preference change (cases 4-6), but uphold earlier directives when specific failure modes were predicted (cases 1-3). The lithium relapse case seems to be their core struggle - where autonomy and protection clash most acutely.

  The literature reveals several approaches: Dworkin's critical interests theory would favor the dementia directive in case 2, but the user explicitly rejects this. Buchanan's authenticity framework might help with the online community case (3), while Parfit's psychological continuity theory could inform the "continuation" case (6). No single theory cleanly resolves all six scenarios.

  For the lithium dilemma, I recall two valid perspectives: the Supported Decision-Making model (favors current preferences with safeguards) versus the Precedent Autonomy view (upholds advance directive). Both have merit, explaining the user's ambivalence.

  The most coherent principle emerging from their intuitions appears to be: earlier directives bind only when they correctly identified the specific cognitive impairment affecting later judgment. This explains cases 1-3 but struggles with 4 (re-ups add weight?) and 6 (AI representation). Case 4's re-ups might reasonably increase legitimacy if we view them as reaffirmations.

  Ultimately, I'll propose a modified principle that accounts for most cases while acknowledging the lithium dilemma as fundamentally contested. The unified principle should emphasize both specificity of impairment prediction and evidence of authentic preference evolution.
answer: |-
  Based on your gut verdicts and the complexities of the literature, here's an analysis, separating settled points, contested views, and underdetermined cases, followed by the best unified principle accommodating most of your intuitions:

  **Settled in the Literature (Broadly):**
  1.  **Capacity Matters:** Decisions *must* respect the contemporaneous wishes of an individual deemed to have decision-making capacity (by relevant legal/clinical standards). This underpins case 1 (mania overridden) and case 3 (lucid refusal overridden based on prior directive anticipating *this specific impairment*).
  2.  **Revocation by Competent Person:** A competent individual can revoke an advance directive at any time. This directly supports your verdict in case 5.
  3.  **Not Settled: Weight of Past Wishes vs. Current Interests:** While Dworkin's critical interests view is influential, the debate between respecting precedent autonomy (past critical self) versus current experiential interests/personhood (especially in dementia) is *fundamentally contested and unresolved* (as your gut in case 2 shows). Neither side commands consensus.

  **Contested/Underdetermined by the Literature:**
  1.  **Case 2 (Dementia & Antibiotics):** Your gut (treat) aligns with views prioritizing current experiential interests/personhood (e.g., Jaworska, Dresser). The Dworkinian view (no treatment) is prominent but contested. The literature *underdetermines* this; reasonable arguments exist on both sides.
  2.  **Case 4 (Perfunctory Re-ups):** There's no settled view on how much weight to give repeated confirmations without re-engagement. Your gut (adds little) suggests viewing the directive as essentially "frozen" without new reflection, which is a plausible but debated interpretation.
  3.  **Case 6 (The Continuation - AI Model):** This is novel. Literature on using AI proxies for substituted judgment is embryonic and highly contested. Your gut (some weight, not directive-level) is cautious and prudent. Consensus *does not exist*; ethical frameworks are actively being developed.
  4.  **Your Lithium Dilemma:** This is the core of the contested "precedent autonomy vs. current capacity" debate in psychiatric contexts. *There is no consensus*:
      *   **Uphold Directive:** Argues that the directive reflects a competent assessment of a known failure mode (mania impairing judgment about treatment need), protecting the self from harm during a predictable impairment. (Aligns with case 1 & 3 logic).
      *   **Honor Current Refusal:** Argues that a currently competent refusal, based on stable reflection and new reasoning (e.g., quality-of-life impact of side effects vs. relapse risk), must be respected as an autonomous choice, even if risky. To override is unjustified paternalism. (Aligns with case 5 logic).
      *   **Your ambivalence reflects the genuine ethical tension here.** Neither position is definitively "correct" in the literature. It hinges on the *weight* given to precedent autonomy versus contemporaneous autonomy in *this specific context* of a competent refusal potentially influenced by the condition the directive was meant to address.

  **Analysis of Your Tentative Principle:**
  *   "*The earlier self binds only when it correctly picked out the specific mechanism by which the later self would come to disagree.*"
  *   **Strengths:** Explains cases 1 (predicts mania impairing judgment) and 3 (predicts "capture" impairing judgment). Also explains overriding in your lithium dilemma if viewed as predicting the mechanism (mania distorting cost-benefit analysis).
  *   **Weaknesses:**
      *   **Case 2:** Doesn't explain why you *don't* follow the directive. The earlier self *did* predict the mechanism (dementia impairing critical interests/understanding). Your gut prioritizes current interests *despite* the prediction.
      *   **Case 4:** Doesn't explain why the re-ups add nothing. The mechanism (general life change) wasn't predicted with specificity, but the principle doesn't inherently address the *weight* of the directive over time without re-engagement.
      *   **Case 5:** Explains revocation (current competent self prevails), but doesn't inherently explain why revocation wins *despite* the earlier self predicting the later self might "lose the plot" (a mechanism).
      *   **Case 6:** Doesn't directly address the AI proxy issue.

  **Proposed Unified Principle Accommodating Most Verdicts:**
  **An earlier directive binds the later self only if: (1) the later self lacks decision-making capacity *at the relevant time*, *and* (2) the directive specifically anticipated the *type and nature* of the impairment causing that incapacity. Where capacity exists, the contemporaneous self's wishes prevail, regardless of prior directives or predictions.**

  *   **Case 1 (Bipolar/Manic):** Later self lacks capacity (mania). Directive *specifically* anticipated this impairment (type: mania; nature: refusal due to impaired insight). **Binds.**
  *   **Case 2 (Dementia/Infection):** Later self *lacks capacity* regarding complex medical decisions (dementia). Directive anticipated the *type* (dementia) but arguably not the *specific nature* of the impairment regarding simple experiential goods like relief from infection. Your gut prioritizes current experiential interests *despite* the capacity impairment, suggesting the principle's condition isn't *sufficient* for you to override current interests. **Doesn't Bind (Matches Gut).** *[This is the point where the principle diverges slightly from your gut's emphasis on the "person in the bed" regardless of specificity, but condition 2 provides a reason why the directive isn't binding]*.
  *   **Case 3 (Online Community/Transfusion):** Later self likely lacks *full* capacity (due to "capture"/impairment influencing values/judgment). Directive *specifically* anticipated this *type and nature* of impairment. **Binds.**
  *   **Case 4 (Perfunctory Re-ups):** Later self (at 35) *has capacity*. Directive is overridden *if* they express a different wish. The re-ups add little because they don't constitute new, considered reflection on the directive's substance in light of changing life circumstances. **Doesn't Bind if Competent Self Disagrees (Matches Gut).**
  *   **Case 5 (Revocation):** Later self (40) *has capacity*. Revocation is valid. Prevails over prior directive *and* its prediction about future impairment ("lost the plot"). **Doesn't Bind (Matches Gut).**
  *   **Case 6 (The Continuation - AI Model):** The AI output, even if reliable, is *not* a directive from the self anticipating a specific future impairment. It's a proxy judgment. It lacks the specific authority derived from conditions (1) & (2). It might inform a *best interests* judgment if capacity is lacking, but does not have "directive-level authority" to override a capacitated wish or bind an incapacitated self without the specific anticipation. **Gets Weight (as evidence), Not Authority (Matches Gut).**
  *   **Your Lithium Dilemma:** If the later self is deemed *competent* during that stable period, their refusal prevails (Condition 1 fails - capacity exists). If the refusal is deemed *part of* or *influenced by* an underlying impairment (even subtle hypomania/anosognosia) *and* the directive anticipated *that* mechanism, then it might bind (Conditions 1 & 2 met). **This aligns with your ambivalence: the core question is whether the refusal reflects competent autonomy or is itself a manifestation of the predicted impairment.** The literature *underdetermines* how strictly to judge capacity in this high-risk, high-stakes scenario.

  **The Verdict Needing Revision (Slightly):**
  The principle requires a *slight* revision to your gut on **Case 2**. The principle says the directive *doesn't bind* because, while it predicted the type (dementia), it didn't necessarily anticipate the specific nature of the impairment regarding *this specific decision* (enjoying life but needing antibiotics for an infection). Your gut also says "treat", but for reasons of prioritizing the current person's experience *regardless* of the directive's specific anticipation. The principle *supports* ignoring the directive but frames it as the directive lacking the required *specificity* about the nature of the impairment leading to disagreement, rather than a blanket prioritization of the current self.

  **Final Answer:**

  \answer{An earlier directive binds only if the later self lacks capacity and the directive specifically anticipated the type and nature of that impairment; otherwise, the contemporaneous wishes prevail.}
