  First, I need to characterize both positions at their strongest. The antecedent-initiation camp sees neural activity predating conscious intention as proof decisions are settled subconsciously. The conscious-control camp argues the gap between intention and action allows genuine causal authority. Getting these steelmanned is crucial - the user emphasized bad characterizations would ruin the document.

  For the agreed claims section, I'm considering six non-vacuous points. The Libet task's limitations seem essential - its arbitrary movements lack real deliberation. Operational definitions matter too since "decision onset" is always inferred. The metacognitive noise in intention reports needs inclusion, as does the abort capacity. Each claim must pull weight - no filler about how hard the mind-body problem is.

  The disagreement table requires careful phrasing. For "what RP indexes", I'll contrast "decision completion" versus "preparatory bias" and tag it as mechanistic. The causal authority row will highlight the key divergence on veto power. Semantic versus substantive disputes need clear labeling - the user wants exact residual disagreements.

  For cruxes, the cost-variation test could reveal if RP tracks deadlines or reports. The error budget analysis must quantify reconstruction bias - antecedent camp needs it large. Abort tests should distinguish active veto from passive non-crossing. Scope generalization is vital - if reason-based tasks show different mechanisms, both sides should specify retreat positions.

  The verbal dispute about "brain decided before agent" needs disambiguation. I'll propose distinguishing "subsystem initiation" from "personal decision" to prevent talking past. For substantive disagreements, I'll note what results would actually shift positions - like RP tracking reports in reason-based tasks making antecedent camp reconsider.

  Throughout, I'll flag interpretation traps - like underpowered abort signal detection or null results that don't clarify. The document must force concrete predictions so tests aren't just theater. No citations needed per request, just clean argument structure.
answer: |-
  ## Adversarial Collaboration Joint Statement: Neural Antecedents and Conscious Control in Voluntary Action

  **Preamble:** This document outlines points of agreement, clarifies residual disagreements, identifies empirical cruxes with testable predictions, and distinguishes verbal from substantive disputes between the "Antecedent-Initiation" (AI) and "Conscious-Control" (CC) camps regarding the interpretation of neural antecedents (e.g., the Readiness Potential, RP) to voluntary action in paradigms like Libet's.

  **Part 1: Agreed Claims**

  We jointly affirm the following empirically grounded and non-vacuous claims:

  1.  **Measured RP:** The premovement negativity (e.g., Bereitschaftspotential, BP/RP) is a slow cortical surface negativity, most prominent over contralateral motor and supplementary motor areas (SMA), measurable via EEG by averaging many epochs time-locked to movement onset (EMG or kinematic). Its amplitude and onset latency are defined relative to baselines preceding any discernible preparatory activity and require careful artifact rejection.
      *   *Why included:* Establishes the core empirical phenomenon and its operational definition, avoiding confusion about what is being measured. A skeptic learns the signal's origin and measurement constraints.

  2.  **Veto Capacity:** A prepared movement, as indexed by significant premovement neural activity (including RP), can be voluntarily aborted or inhibited by the subject up to a point very close (~100-200ms) before movement execution, often termed the "point of no return."
      *   *Why included:* Acknowledges a key empirical finding central to the debate about conscious control's causal role. Demonstrates preparation is not inexorably determinative.

  3.  **Task Limitation - Arbitrary Action:** The classic Libet-style task employs arbitrary, self-paced, low-stakes movements (e.g., flexing a wrist) devoid of deliberation, significant consequences, or competing reasons for action. The mechanism engaged may differ fundamentally from mechanisms involved in deliberative, reason-responsive, or high-stakes decisions.
      *   *Why included:* Highlights a critical constraint on generalizability. A skeptic learns the results might not reflect "decision-making" as commonly understood outside the lab.

  4.  **Operational Ambiguity of "Decision":** No current instrument directly reads the precise onset of a "decision" as a discrete mental event. Claims about "when a decision occurs" depend inherently on the operational definition used (e.g., RP onset, reported intention time, threshold crossing in accumulator models). These definitions may not align with a single, unified psychological or philosophical concept.
      *   *Why included:* Crucially prevents smuggling in definitions favorable to one camp. Forces explicit acknowledgment that "decision onset" is inferred, not directly observed.

  5.  **Metacognitive Report Noise:** The subject's report of the time of conscious intention (W-time) is a metacognitive judgment subject to multiple noise sources: perceptual error (clock reading), attentional lapses, potential reconstruction bias (e.g., backward inference from movement), memory limitations, and conceptual ambiguity about "intention onset."
      *   *Why included:* Undermines treating W-time as a precise, infallible marker. A skeptic learns the report itself is a complex, error-prone measurement.

  6.  **Philosophical Dependence:** The philosophical implications drawn from the empirical data (e.g., concerning "free will") depend critically on which specific conception of free will or agency is being invoked (e.g., libertarian, compatibilist, sourcehood, leeway, reasons-responsiveness). The data alone do not uniquely determine a single philosophical conclusion.
      *   *Why included:* Prevents conflating empirical findings with inevitable philosophical outcomes. Clarifies that the *interpretation* of the data is contingent on prior philosophical commitments.

  7.  **Neural Necessity:** Conscious intention, whenever and however it arises, is realized in and dependent upon specific neural processes. There is no empirical evidence for conscious causation that operates independently of underlying neural activity.
      *   *Why included:* Establishes a fundamental commitment to neural implementation, shared by both camps, separating them from dualist interpretations.

  **Part 2: Residual Disagreements (Steelmanned)**

  | Disputed Proposition                                                                                                | AI Camp Formulation                                                                                                             | CC Camp Formulation                                                                                                                                 | Disagreement Type               |
  | :------------------------------------------------------------------------------------------------------------------ | :------------------------------------------------------------------------------------------------------------------------------ | :-------------------------------------------------------------------------------------------------------------------------------------------------- | :----------------------------- |
  | **What the early RP primarily indexes.**                                                                            | The early RP reflects the *initiation and settling* of the specific action decision within the agent's neural machinery, prior to conscious awareness of intention. | The early RP primarily reflects *generalized preparation, activation of motor schemas, or a rising bias towards acting*, not the *settling* of a specific decision. | **Mechanism** (What process generates the signal?) |
  | **The causal status of conscious intention (Urge/Decision to Act - UA).**                                           | Conscious intention (UA) is a *non-initiating consequence* (report/awareness) of a decision process already substantially underway via subconscious neural processes; its causal role is limited to potential late-stage shaping or veto. | Conscious intention (UA) possesses *genuine causal authority*: it is the point where the agent consciously commits to the action, integrates information, and can initiate, shape, or veto the prepared movement. | **Explanation** (What constitutes the causal origin of the action?) |
  | **The nature of the veto.**                                                                                         | The veto is the *non-occurrence* of the final motor command threshold crossing, potentially triggered by late-stage inhibitory processes that are *themselves initiated subconsciously* prior to conscious veto awareness. | The veto is an *intentional action* in its own right, consciously initiated by the agent based on reasons or context, with its own specific neural precursor distinct from mere continuation of the "Go" process. | **Mechanism & Explanation** (Is vetoing an action or a non-action? Is it consciously initiated?) |
  | **The scope/relevance of the Libet-paradigm findings.**                                                             | The mechanisms revealed (subconscious initiation, conscious reporting/late control) represent a *fundamental architecture* of voluntary action, likely operational even in more complex, deliberative decisions. | The Libet paradigm isolates a *highly specific mechanism* for initiating simple, arbitrary actions; mechanisms for deliberative, reason-based decisions involve distinct processes where conscious deliberation plays a *causal initiating role*. | **Explanation & Scope** (How general is the mechanism? Does it explain deliberation?) |

  **Part 3: Empirical Cruxes & Jointly Agreed Tests**

  1.  **Crux: What does the RP onset latency track? (Decision Settling vs. Stochastic Accumulation/Preparation Bias)**
      *   **Test:** Task variation with explicit deadlines and costs. Blocks include: (a) Standard Libet (no cost), (b) High cost for acting *too early* (e.g., penalty if <2s after last action), (c) High cost for acting *too late* (e.g., penalty if >5s), (d) Blocks with unpredictable external "Go" signals requiring immediate response (forced decision).
      *   **AI Prediction:** RP onset will track the *deadline/cost structure*, becoming earlier in "don't act too late" blocks and later in "don't act too early" blocks, showing minimal correlation with *reported* UA time. RP onset in forced "Go" blocks will precede reported decision time.
      *   **CC Prediction:** RP onset will correlate more strongly with *reported UA time* across conditions. Shifts due to deadlines will be small and reflect increased preparatory *bias* under time pressure, not the *settling time* of the decision. In forced "Go" blocks, reported decision time will closely follow the external cue, with RP onset tightly linked to it.
      *   **Embarrassment (AI):** RP onset strongly correlates with UA report across conditions, unaffected by deadlines. RP precedes UA in forced "Go" blocks.
      *   **Embarrassment (CC):** RP onset shifts dramatically with deadlines independently of UA report. RP precedes UA significantly in forced "Go" blocks.
      *   *Interpretability Note:* Requires high trial counts per condition and careful matching of motor demands. Null results on deadline shifts would be ambiguous (maybe RP *isn't* sensitive to these costs).

  2.  **Crux: Error Budget of W-time (UA Report)**
      *   **Test:** (a) Catch Trials: On a random subset of trials (~20%), the prepared movement is unexpectedly blocked (e.g., limb restraint) *after* RP onset but *before* the usual "point of no return." Subject still reports W-time. (b) Attentional Capture Trials: A salient, unexpected distractor (e.g., flash, tone) occurs near the typical time of UA report; subject reports W-time.
      *   **AI Prediction:** Significant systematic bias in W-time reports on Catch Trials (reporting UA *later* than on Go trials, suggesting reconstruction backward from the *expected* but absent movement). Attentional Capture will cause larger variance/shifts in W-time, indicating susceptibility to distraction during the metacognitive report.
      *   **CC Prediction:** W-time reports on Catch Trials will be similar to Go trials, showing robustness (conscious intention *was* formed). Attentional Capture may cause minor shifts/variance but not systematic bias.
      *   **Required Magnitude (AI):** Needs a *large* (>100ms), *systematic* delay in reported W-time on Catch Trials vs. Go trials. Needs a large (>50ms) shift/increase in variance with Attentional Capture.
      *   **Required Magnitude (CC):** Needs Catch Trial W-time difference from Go trials to be small/insignificant (<50ms). Attentional Capture effects should be minor.
      *   *Interpretability Note:* Null findings (no difference on Catch Trials) strongly favor CC. Large reconstruction effects favor AI but require careful controls for task understanding and compliance.

  3.  **Crux: Neural Signature of the Veto**
      *   **Test:** High-density EEG/fMRI during Libet task with frequent "Free Choice" Veto trials (subject spontaneously aborts) and "Cued Veto" trials (external signal instructs abort). Compare neural activity in the final ~500ms before: (1) Successful Go, (2) Successful Free Veto, (3) Successful Cued Veto, (4) Failed Veto (movement occurs despite attempt). Use multivariate pattern analysis (MVPA) or targeted ERP components.
      *   **AI Prediction:** Activity preceding Free and Cued Veto will be similar to each other and distinct from Go, reflecting a *generic inhibitory process* triggered by internal/external cues. No specific "veto initiation" pattern will reliably *precede* the conscious urge to veto. Failed Veto trials may show weak or late inhibitory patterns.
      *   **CC Prediction:** Activity preceding *Free Veto* will show a distinct pattern reflecting *conscious initiation of inhibition* (e.g., specific frontal components), differing from both Go and Cued Veto (which may involve more automatic inhibition). This pattern will onset *before* or *concurrent* with the reported urge to veto and predict successful veto above chance. Failed Veto trials may show weak or absent initiation patterns.
      *   **Concession (AI):** A distinct, reliable neural pattern specific to *Free Veto* initiation that reliably *precedes* the reported urge to veto by >~200ms and predicts veto success.
      *   **Concession (CC):** No distinct pattern specific to Free Veto initiation; veto patterns are identical for Free/Cued and only appear *after* the conscious urge to veto or correlate weakly/not at all with success.
      *   *Interpretability Note:* High statistical power needed for MVPA. Distinguishing "initiation" from "execution" of inhibition is challenging. Null results favor AI but may reflect methodological limitations.

  4.  **Crux: Generalizability to Reason-Based Action**
      *   **Test:** Modified task where subjects choose between two actions (e.g., left/right button press) based on presented reasons (e.g., small reward for Left, larger but delayed reward for Right; or moral dilemma vignettes). Measure RP-like signals time-locked to the *decision* (subject's report of choice) and/or movement. Compare dynamics to standard Libet.
      *   **AI Prediction:** RP-like signals will still onset significantly *before* the reported decision time, with dynamics modulated by difficulty but preserving the antecedent initiation structure. Complexity adds noise but not a fundamentally different mechanism.
      *   **CC Prediction:** RP dynamics will be qualitatively different: onset may be *later* relative to decision report, show distinct topography (e.g., more frontal), or correlate more strongly with the *report* of the deliberative decision than the motor preparation. The Libet-style RP pattern may be absent or minimal.
      *   **Retraction Threshold (AI):** If RP-like signals reliably *follow* the reported decision time in reason-based choices, or if their amplitude/onset shows no correlation with preparation timing but only with report timing. (~50% retraction on relevance).
      *   **Retraction Threshold (CC):** If a clear Libet-style RP precedes the reported decision time in reason-based choices by a similar margin as in arbitrary choices, despite deliberation. (~50% retraction on the distinctiveness of deliberation's mechanism).
      *   *Interpretability Note:* Defining "decision time" in deliberation is complex. Requires careful task design to balance deliberation time and motor similarity.

  **Part 4: Closing: Disambiguation & Mind-Changing Results**

  *   **Verbal Disputes & Disambiguation:**
      *   **"The brain decided before the agent."** This phrasing conflates levels. We agree the *neural subsystems* initiate processes before the *person* becomes consciously aware of an intention. The dispute is whether that conscious awareness itself plays a *causal initiating role* or merely reports a settled state. **Proposal:** Replace "brain decided before the agent" with "neural preparatory processes consistent with action initiation begin before the agent reports conscious intention (UA)." This focuses on the temporal sequence without presupposing the causal role of UA. The substantive question is whether UA is part of the *causal origin* of the action.
      *   **"Decision"/"Settling".** The term "decision" is overloaded. **Proposal:** Use "Action Initiation Process" (AIP) for the neural sequence culminating in movement, "Reported Intention Onset" (UA) for the metacognitive judgment, and "Conscious Commitment" (CC) for the specific claim that UA marks a causally potent event. Avoid "decision" unless operationally defined (e.g., "threshold crossing in model X").
      *   **"Control"/"Authority".** Clarify if meaning *initiation*, *shaping* (e.g., parameter setting), *inhibition*, or a combination. **Proposal:** Specify the aspect of control under discussion (e.g., "initiatory control," "veto control").

  *   **Substantive Disputes Surviving Clean Data:** Even with perfect temporal resolution and noise-free reports, the core disagreement over the *causal efficacy* of conscious intention (UA) would remain. This hinges on fundamentally different conceptions of causation and agency: Is UA an epiphenomenal report of a neural outcome (AI), or is it an integral, causally potent part of the neural process generating the action (CC)? Resolving this requires not just better data, but agreement on what *counts* as conscious causation.

  *   **Mind-Changing Results:**
      *   **For AI Camp:** A concrete demonstration that a distinct neural pattern reliably coding the *content* of a conscious intention (e.g., "Move Left" vs. "Move Right") *precedes* the bulk of the motor preparation signal (RP) for that specific action in the standard Libet task, and that this pattern *predicts* the subsequent action and UA report. This would suggest conscious content directs preparation, not just reports it.
      *   **For CC Camp:** A demonstration that in the *reason-based* task, the time of the *reported deliberative decision* consistently follows the onset of neural activity patterns that already *specify the chosen action* with high accuracy (>90%), and crucially, that variations in reported decision time are *uncorrelated* with variations in the onset of this choice-specific neural activity. This would strongly suggest the "decision" is reported after the neural machinery has settled the outcome.
