answer: |-
  ## Joint Statement: Artifacts and Politics  
  **Adversarial Collaboration between Inherence and Arrangement Camps**  

  ### 1. Scope Note  
  This document addresses *whether artifacts possess political properties intrinsically*, or whether politics arises *only within sociotechnical arrangements*. It sets aside: (1) whether artifacts *cause* political outcomes (causal question); (2) whether designers bear special responsibility (normative question); (3) how artifacts are symbolically interpreted (semiotic question); and (4) tradeoffs between functional efficiency and political values. We focus solely on the *ontological status* of politics in artifacts, tested against four jointly designed cases.  

  ---

  ### 2. Agreed Claims  
  **Epistemic Status Key:**  
  [S] Settled among practitioners | [M] Majority view but contested | [C] Accepted for collaboration  

  1. **Artifacts shape political possibilities.** A design feature can make certain social relations (e.g., hierarchy, exclusion) easier or harder to sustain. [S]  
  2. **Functionally identical designs can differ politically.** Two artifacts with identical measurable outputs (e.g., irrigation volume, fuel efficiency) may nonetheless enable or constrain social actions differently (e.g., repair, oversight). [S]  
  3. **Politics requires human practices.** No artifact exerts political influence without some human action (e.g., use, maintenance, enforcement). [S]  
  4. **Design choices can be politically significant omissions.** The absence of a feature (e.g., no paper alternative) can shape power relations as consequentially as a presence. [M]  
  5. **Material constraints resist reinterpretation more than coded ones.** Physical barriers (e.g., stair-only entrance) retain exclusionary effects across contexts more persistently than digital constraints (e.g., license checks). [C]  
  6. **"Artifact" boundaries are context-dependent.** What constitutes the "artifact" (e.g., pump vs. pump+manual) is often negotiated, not given. [M]  

  ---

  ### 3. Disagreements Table  
  | Crux | Inherence Camp Formulation | Arrangement Camp Formulation | Discriminating Case | Pre-Registered Predictions | Evidence That Would Move Each Camp |
  |------|----------------------------|------------------------------|---------------------|----------------------------|-----------------------------------|
  | **Modal strength of design constraint** | Some features *necessitate* specific social relations (e.g., sealed pumps *require* hierarchical technical access). | Features only *invite* or *facilitate* relations; social practices can subvert them (e.g., communities could hack sealed pumps). | Matched Pair (Pump M vs. O) | Inherence: Pump M *requires* technician dependency. Arrangement: Cooperatives could share dongles or lobby for open standards. | Inherence: Evidence that no village achieved non-hierarchical maintenance for Pump M. Arrangement: Evidence of villages repurposing Pump M for egalitarian maintenance. |
  | **Boundary of the artifact** | The artifact’s politics inheres in its *physical/digital structure*, separable from manuals or support systems. | The artifact is *indistinguishable* from its sustaining arrangement (e.g., manuals, tools, skills). Omitting these begs the question. | Omission (Benefits Portal) | Inherence: The portal’s exclusion *is* its file-format policy. Arrangement: The "artifact" includes state capacity for alternatives. | Both: A study showing portals with identical interfaces but differing state support produce identical exclusion rates. |
  | **Burden of proof for counterfactuals** | If no functional equivalent exists without the political effect, the effect is inherent. | Functionally equivalent alternatives *always* exist in design space; politics lies in which is chosen/sustained. | What Travels (Physical vs. Coded Constraint) | Inherence: Physical barriers retain exclusion when moved; coded ones may not. Arrangement: Both can be subverted; persistence depends on local enforcement. | Inherence: A physical barrier excluding groups identically in 10 divergent societies. Arrangement: Coded constraints failing to exclude where enforcement is absent. |
  | **Politics of omission** | Omissions are inherent features; not adding accessibility *is* a political design choice. | Omissions gain politics only through *active choices* in funding, maintenance, or regulation. | Omission | (Verbal disagreement: "Omission as feature" vs. "Omission as system failure." Substantive residue: Does responsibility attach to the designer or the maintainer?) | Both: Evidence that identical omissions in comparable systems yield divergent political outcomes based on maintenance practices. |
  | **Ethics of design distinctiveness** | Designers bear unique responsibility for embedding *inescapable* politics in artifacts. | Responsibility dissolves across the arrangement; no distinctive ethics exists for designers alone. | Orphan Artifact | Inherence: The courtyard’s layout *remains* authoritarian even if unused. Arrangement: Politics vanishes without enforcement; it’s merely "inconvenient." | Inherence: The coop altering use but reporting enduring "authoritarian atmosphere." Arrangement: The coop repurposing courtyards with no residual hierarchy. |

  ---

  ### 4. Limits of Agreement  
  **Third-Party Rejection:** An engineer would reject *all claims* that artifacts "have politics," arguing politics is solely a property of human intentions and systems. This framing mislocates agency by attributing social causality to objects.  

  **Camp Concessions:**  
  - **Inherence camp** concedes its case is weakest on the **Orphan Artifact**. If a design’s politics vanishes without active enforcement, politics may not "inhere."  
  - **Arrangement camp** concedes its case is weakest on the **Matched Pair**. If one design *persistently* produces hierarchy where the other does not, despite similar contexts, materiality may exert independent force.  

  ---  
