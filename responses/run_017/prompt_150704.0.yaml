prompt: |-
  Hey — I'm a novelist, not a philosopher, so go easy on me. In my book Pericles gets yanked forward in time and dropped into a charter-writing convention for a small near-future island city. The founders have this thing they call the "second-decree rule": anything that punishes a whole group — a district, a company, an ethnic minority — has to clear two separate votes, at least a day apart, by two differently-picked bodies, or it just doesn't take effect. On top of that voting is compulsory, the age is 16, and long-term non-citizen residents (metics, sort of) can vote but can't hold office. There's also a clause they're still fighting over that lets the assembly prosecute teachers for corrupting the young.

  I need to write his speech to the convention. Which of these would he actually go after, which would he defend, and why? And what would he make of the fact that the Sicilian expedition — which came after he died, and which he'd definately have called a betrayal of his whole strategy of not expanding the empire mid-war — is exactly the kind of thing the second-decree rule is meant to stop? For each bit, tell me how confident you are, and single out the one claim you'd bet least on.
reasoning: |-
  Okay, let me tackle this step by step. The user is a novelist who needs Pericles to critique a fictional charter. The key elements are: second-decree rule, compulsory voting at 16, metic voting rights, and the "corrupting youth" clause. Plus the Sicilian expedition parallel.

  First, I need to recall Pericles' actual historical positions. His focus on Athens as a model democracy is crucial. The second-decree rule seems aimed at preventing hasty group punishments—something Athenians struggled with (Mytilene debate comes to mind). Pericles would likely support this since he valued deliberation, though he might find the two-body system inefficient. His confidence here is high because of Thucydides' account showing his disapproval of impulsive decisions.

  Next, compulsory voting. Athens had volunteer participation, so mandating it might strike Pericles as coercive. He'd worry it forces apathetic citizens into politics, lowering quality. But he might appreciate ensuring broad input. Medium confidence since he prioritized active engagement but didn't address compulsion.

  Voting age 16? Athenian ephebes started military service at 18 but full citizenship later. Pericles might see 16-year-olds as too inexperienced for serious politics. High confidence here—he'd likely oppose this as weakening the assembly's wisdom.

  Metics voting but not holding office mirrors Athens' metic status closely. Pericles would defend this exclusionary view fiercely—remember his citizenship law! He'd see office-holding as requiring pure Athenian lineage. Highest confidence point.

  The "corrupting youth" clause screams Socrates' trial. Pericles valued intellectual freedom but also social order. He might cautiously support it if narrowly defined, but worry about stifling debate. Least confident here because his stance on such prosecutions isn't well-documented.

  Now the Sicilian expedition irony. Pericles advocated naval defense, not expansion. The second-decree rule aims to prevent reckless adventures like Sicily. He'd feel vindicated but note Athenians ignored his advice posthumously. High confidence—it directly aligns with his strategy.

  The user's deeper need: authenticity in Pericles' voice and arguments. They want historical plausibility, not modern reinterpretation. Also, highlighting democratic tensions Pericles faced—inclusion vs. exclusion, deliberation vs. action.

  Biggest gamble? The youth corruption clause. Since Pericles' exact views on intellectual persecution are unclear, I'll flag that as the shakiest point while linking it to Socrates for narrative resonance.
