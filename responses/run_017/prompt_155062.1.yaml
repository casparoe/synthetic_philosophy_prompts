  ---

  ### Key Execution Notes

  1. **Stakes That Work**: Poker chips create light tension. Winning team gets absurd "PhD" pins (e.g., from a toy store). Losers buy winners a pint.

  2. **Dossier Design**:  
     - **History cards** emphasize *ancestral struggles* and *differential reproduction*.  
     - **Mechanism cards** focus on *current interactions* and *system impacts*.  
     - Language avoids philosophy terms ("selected", "function") until debrief.

  3. **Critical Adjustment**:  
     For Case 5, instruct pairs: *"Choose ANY boundary: cell, organism, ecosystem. What system is this trait 'for'?"* Forces them to confront interest-relativity.

  4. **Debrief Script**:  
     Start with: *"When did you feel sure about the function? When did it get messy?"* Use flipchart to map their answers to the two views WITHOUT LABELS until the final reveal.

  5. **What You Must State**:  
     At the end, emphasize: *"The selected-effect view explains why we say a trait is 'broken' if it fails its evolved purpose—even if it does something useful now. The causal-role view can't explain that."*

  6. **Why This Works**:  
     - **Divergence case** makes the clash visceral.  
     - **No-history case** mirrors the yeast example.  
     - **System-switching** exposes causal-role relativity.  
     Participants *feel* the problem before dissecting it.
