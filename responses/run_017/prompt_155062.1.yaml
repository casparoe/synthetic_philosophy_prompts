answer: |-
  ### Activity Design: "Function Quest"

  #### Core Concept
  Participants experience the function attribution clash through card-based scenarios where they must define a trait's function with limited information. By forcing pairs to commit to a single definition (with real stakes), they feel the tension between historical selection and current contribution perspectives.

  ---

