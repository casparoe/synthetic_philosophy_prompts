prompt: |-
  Hi — hoping you can help me with something before I finalize my seminar list for next term. I'm putting together a problem set on diachronic rationality built around van Fraassen's Reflection principle (the thought that your credence now in some proposition ought to line up with what you expect your later credence in it to be, at least when you're already certain you're going to land on that later number). My colleague across the hall, call her Dana, has been ruling on case after case of this general shape for years, and I want to use her as the answer key — but I can't work out what rule she's actually running. Here's her track record on six cases, in my words:

  1. Clean experiment. Tomorrow you'll run a well-powered, preregistered test and update properly on whatever comes out; you just don't know the result yet. Verdict: yes, defer now — set today's credence to your expectation of tomorrow's.
  2. Concussion. You've just looked at a decisive data table. Tonight you'll take a blow to the head that erases the memory of it but leaves the rest of your reasoning intact. Verdict: no — keep today's credence, never mind what tomorrow's self says.
  3. The drug. You'll be dosed with something that makes people hugely overconfident, but which of your opinions gets inflated is not predictable in advance, so you can't correct for it. Verdict: no.
  4. Self-locating. On Sunday you're at 1/2 on a fair coin landing heads. You know that mid-experiment you'll be woken once if it's heads and twice if it's tails, with memory of earlier wakings erased, and that on waking you'll be at 1/3. Verdict: yes, move to 1/3 on Sunday. Her line is that the waker isn't malfunctioning, she just has one extra piece of centered evidence.
  5. Conversion you can't specify. You're a geologist in the early sixties at 0.3 on continental drift, and you know that within a decade you'll have seen evidence you couldn't presently describe and you'll be at 0.95. Verdict: yes, move now, to roughly your expectation of that future credence.
  6. Known correctable bias. You'll be reading the new results badly sleep deprived, and you know sleep deprivation drags your credences about fifteen points toward the status quo. Verdict: yes, but to the corrected number, not the raw one.

  My case. I'm three years into a five-year study of whether a particular teaching method actually works, sitting at 0.6. When it wraps up I'll have the complete clean dataset, far bigger than what I have now. But I'll also have loosing access to the early field notes and the hours of classroom video I watched in year one, and I know from experience that the gut judgement that material produced in me has been genuinely predictive, and its not the kind of thing that shows up anywhere in the dataset. On top of that, by then a funder's renewal decision will turn on a positive result, and I know the motivated-reasoning literature well enough to put a number on the pull — I can estimate the direction and roughly the size.

  So: predict Dana's verdict about whether I should now bring my credence into line with my estimate of my future credence. More usefully than the bare verdict, tell me which rules fit all six of her earlier verdicts equally well, what each of them says about my case, which one you'd put your money on and why, and what further case I'd need to sneak into the problem set to actually tell the rules apart. My own guess is that she's running a strict the-future-self-has-to-have-everything-I-have-and-more rule, which would make the concussion case the closest analogue and the answer no; but I can also see an expected-accuracy rule fitting all six and saying yes, defer to the corrected number. Is there a third option I'm missing? And if her six verdicts genuinely underdetermine this, say plainly what each choice commits her to, and flag anywhere you think her own set is internally shaky. Don't bother with references — I want the argument, not the reading list.
