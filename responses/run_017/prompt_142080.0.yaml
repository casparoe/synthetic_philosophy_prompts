    > - **EAM verdict**: Defer only if the corrected credence has higher expected accuracy. If E is highly volatile, correction may not suffice → no deference.  
    > This case tests whether Dana prioritizes correctability (CAD) or accuracy outcomes (EAM).  

  ### Internal Shakiness in Dana's Verdicts
  - **Potential inconsistency in Case 5 (conversion)**: Dana says "yes, move to roughly your expectation of future credence." But if you are *certain* your future credence will be 0.95 (as the case implies), then your expectation is 0.95, and moving aligns with both rules. However, if you are *uncertain* about the future credence, the law of total expectation dictates that E[future credence] = current credence (if future updates are rational). Case 5's wording ("you know... you'll be at 0.95") avoids this, but if students interpret it as uncertainty, Dana's "roughly" may mask a tension.  
