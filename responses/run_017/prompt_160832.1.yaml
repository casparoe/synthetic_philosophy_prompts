  The proposed device scenario is brilliant because it creates tension between these readings. A machine that supposedly computes the halting function? With caveats making verification impossible? That's perfect for testing whether students really grasp the differences. But I should sharpen the scenario's philosophical hooks:
  - The unverifiable outputs attack the physical reading's falsifiability
  - The lookup-table compatibility undermines empirical refutation
  - The engineering noise questions what "physical computability" even means

  Now for question formulation options:
  Option 1: "Analyze how this experiment affects each reading of CTT." Risk: Might allow generic discussion without forcing engagement with epistemic status.
  Option 2: "Does this falsify CTT? Discuss per reading." Risk: Overly binary, might not draw out methodological consequences.
  Option 3: "What does this reveal about CTT's pre-experiment epistemic status?" Risk: Too abstract without device analysis as anchor.
  Hybrid approach wins: Make students analyze the device's impact per reading first, then extract epistemic lessons about what CTT must have been all along.

  For the model answer, I'll need to maintain clear boundaries:
  - Settled: e.g., CTT isn't mathematically provable
  - Contested: e.g., whether physical CTT is empirical
  - My view: Flagged as such (e.g., that methodological CTT survives physical violations)
  Key is showing how the readings can come apart - that's the discrimination mechanism.

  Marking scheme must reward:
  1) Differentiated analysis per reading (not lumped together)
  2) Epistemic status diagnosis (not just description)
  3) Handling of verification/computation boundary
  4) Coherence of holding split views (e.g., physical false but methodological intact)
  5) Original insight about what the scenario reveals

  Crucially, credit for well-reasoned heterodoxy - if a student argues the device isn't computing at all, that's valid if supported. The rubric will explicitly reward arguing against my model answer's assumptions when done cogently.

  The final question should be self-contained but philosophically dense. I'll include just enough technical recall (halting problem, TMs) to frame the issue, but zero bibliographic demands. Ninety-minute scope means focused argumentation, not comprehensive survey.
answer: |-
  ### Final Exam Question  
  **Time Allowed:** 90 minutes  
  **Word Limit:** 800–1000 words  

  **Background:** The Church–Turing thesis (CTT) is often framed as the claim that a function is "effectively calculable" (i.e., computable by a human following an algorithm) if and only if it is Turing-computable. We have distinguished three interpretive readings of CTT:  
  - **Classificatory (C-CTT)**: CTT provides a conceptual analysis of the pre-theoretic notion of an "effective procedure."  
  - **Physical (P-CTT)**: No physically realizable system can compute a function beyond the Turing-computable.  
  - **Methodological (M-CTT)**: CTT licenses mathematical practice (e.g., treating informal algorithms as specifications for formal models, assuming equivalence between computational formalisms).  

  **Scenario:** A research group announces a device that exploits relativistic effects to perform infinitely many discrete operations in finite proper time. For any Turing machine description *M* and input *x*, it outputs 1 if *M* halts on *x* and 0 otherwise (i.e., it computes the halting function). Three caveats apply:  
  1. The device is single-use per input; outputs cannot be independently verified (e.g., no TM can check outputs for non-halting cases).  
  2. Reliability degrades for inputs above size *N*; the team attributes this to engineering noise.  
  3. Any finite set of input-output pairs it produces is consistent with a TM with a large lookup table.  

  **Question:**  
  (a) Analyze how this device impacts each reading of CTT (C-CTT, P-CTT, M-CTT). Does it threaten each reading equally? Justify your answer.  
  (b) Suppose the device works as described. What does this reveal about the epistemic status of CTT *prior* to the announcement? Specifically, was CTT best understood as an empirical law, a definition, a regulative principle, or a different kind of claim? Explain using the three readings.  
  (c) Can one coherently accept that this device refutes P-CTT while continuing to rely on CTT in ordinary mathematics? What does your answer imply about the independence of the three readings?  
  (d) **Critical Engagement**: Does the device genuinely *compute* a non-Turing-computable function? Or is it merely instantiating a physical regularity that we interpret as computation? Defend your view.  

  ---

  ### Model Answer (780 words)  
  **(a) Impact on the three readings**  
  The device challenges each reading of CTT differently:  
  - **P-CTT is directly threatened**. If the device physically realizes hypercomputation (despite caveats), it falsifies P-CTT’s claim that physics bounds computation to Turing-equivalence. Caveat #1 (unverifiability) complicates empirical confirmation, but if we accept the team’s reports, P-CTT is refuted. Caveat #3 (lookup-table compatibility) shows that no finite evidence can *conclusively* refute P-CTT, but this does not save it—it merely highlights that P-CTT, like all empirical claims, is fallible.  
  - **C-CTT is unaffected**. C-CTT concerns the *concept* of effective calculability. The device’s operation—relying on relativistic physics inaccessible to human cognition—does not resemble a "human following rules." Thus, it fails to qualify as an "effective procedure" under C-CTT’s analysis. Even if physically real, it is irrelevant to conceptual analysis (just as a black hole’s gravity is irrelevant to the definition of "weight").  
  - **M-CTT is largely unscathed**. M-CTT underpins mathematical practice (e.g., proving a function is computable by sketching an algorithm). The device’s outputs are unverifiable (caveat #1) and unreliable for large inputs (caveat #2), so mathematicians cannot use it to decide unsolved halting cases. M-CTT thrives on intersubjective verification and repeatability; this device offers neither. Thus, it remains safe for ordinary mathematics.  

  *Threat asymmetry*: P-CTT alone faces existential risk. C-CTT and M-CTT are insulated by their normative/functional roles.  

  **(b) Epistemic status prior to the announcement**  
  Prior to the device, CTT’s epistemic status depended on the reading:  
  - **P-CTT** functioned as a **contingent empirical hypothesis**. Its evidence came from the failure to find physical hypercomputation despite extensive effort (cf. the "absence of evidence" argument). However, caveat #3 reveals that it was *unfalsifiable in principle* by finite data—any apparent counterexample could be dismissed as a lookup table. This suggests P-CTT was less a testable law than a **methodologically necessary presupposition** for physics: we assume physics is computable because non-computability would undermine scientific modeling.  
  - **C-CTT** was an **a priori conceptual analysis**. Evidence for it (e.g., equivalence of formalisms) supports an analytic truth about our *concept* of computation, not a discovery about the world. The device’s irrelevance to C-CTT confirms this: conceptual analyses aren’t falsified by empirical novelties.  
  - **M-CTT** was a **regulative principle** for mathematics. It justified treating algorithms as "effective" without formalization and ensured consensus across computational models. Its resilience shows it was never empirical; it is a convention that *enables* mathematical practice.  

  **Conclusion**: CTT was not a unified claim. P-CTT was a defeasible empirical postulate, C-CTT an analytic claim, and M-CTT a pragmatic norm. The device exposes this disunity.  

  **(c) Coherence and independence of the readings**  
  One can coherently reject P-CTT while upholding C-CTT and M-CTT:  
  - **Yes, and this demonstrates independence**. P-CTT’s falsity need not affect C-CTT (which is concept-bound) or M-CTT (which relies on verifiable methods). Mathematicians could ignore the device: its unverifiable outputs (caveat #1) prevent it from replacing Turing machines in proofs, and its noise (caveat #2) makes it useless for decidability arguments. M-CTT persists because mathematics requires replicable procedures.  
  - **Implication**: The readings are logically separable. P-CTT makes a contingent claim about physics; C-CTT and M-CTT are non-empirical. This device forces us to decouple them—a key insight into CTT’s structure.  

  **(d) Critical engagement: Is this computation?**  
  The device does not genuinely *compute* the halting function. Computation requires:  
  1. **Intentionality**: The system must implement rules defined by an abstract model.  
  2. **Verifiability**: We must distinguish computational states from physical noise.  
  Here, the output is an uninterpreted physical signal (caveat #1–2). Without independent verification, we cannot confirm it solves the halting problem rather than exhibiting a brute-force regularity (e.g., pre-determined outcomes via unknown physics). Caveat #3 is decisive: if all finite outputs mimic a lookup table, the device is indistinguishable from a non-computational oracle. Calling this "computation" conflates physical causality with algorithmic representation.  

  **Alternative view**: If one defines computation purely causally (e.g., "any physical process satisfying a function"), the device computes. But this trivializes computation—e.g., a rock "computes" its trajectory. CTT’s core intuition (rule-following) demands richer criteria.  

  ---

  ### Marking Scheme (25 points)  
  **Must-hit points** (A-grade scripts address all five; B-grade miss/downplay ≥1):  
  1. **Differential impact analysis [5 pts]**:  
     - P-CTT: Directly threatened (empirical falsification possible).  
     - C-CTT: Unaffected (conceptual vs. physical).  
     - M-CTT: Unscathed (practical verification requirements).  
     *Common error:* Treating all readings as equally threatened.  
  2. **Epistemic diagnosis [5 pts]**:  
     - P-CTT: Empirical but unfalsifiable → "presupposition" or "law" (credit empirical/contingent label).  
     - C-CTT: A priori/conceptual (not empirical).  
     - M-CTT: Regulative principle (conventional/pragmatic).  
     *Common error:* Calling CTT "empirical" *simpliciter* without distinction.  
  3. **Coherence of split views [5 pts]**:  
     - Argues that rejecting P-CTT need not undermine C/M-CTT.  
     - Notes M-CTT’s reliance on verifiability/noise-tolerance.  
     *Common error:* Claiming CTT "stands or falls as a whole."  
  4. **Computation critique [5 pts]**:  
     - Distinguishes computation from physical regularity (intentionality/verifiability needed).  
     - Uses caveat #3 to argue for lookup-table indistinguishability.  
     *Credit alternate views*: If argued coherently (e.g., causal-computation), award full marks.  
  5. **Independence of readings [5 pts]**:  
     - Explicitly states that the device forces separation of readings.  
     - Ties to pre-announcement epistemic status (e.g., P-CTT ≠ M-CTT).  
     *A-grade differentiator:* Uses this to explain CTT’s resilience in mathematics.  

  **A vs. B Grade Boundary**:  
  - **A (21–25)**: Hits all five points, demonstrates reading independence (point 5), and engages critically with "computation" (point 4) beyond restating caveats.  
  - **B (16–20)**: Correctly analyzes each reading (points 1–3) but undersells independence (point 5) or computation critique (point 4). May treat readings as loosely coupled but not logically separable.  

  **Contested Positions & Assumptions**:  
  - **P-CTT’s falsifiability**: Model answer assumes it is empirical but unfalsifiable. *Credit alternatives*: If argued as non-empirical (e.g., transcendental), award marks.  
  - **Computation criteria**: Model answer assumes intentionality/verifiability. *Credit rejection*: If student defends causal views (e.g., Piccinini), award marks.  
  - **C-CTT’s apriority**: Model answer assumes concepts are a priori. *Credit naturalist critiques* (e.g., cognitive science relevance).  

  **Professional Notes**:  
  - Settled: CTT’s unprovability; equivalence of formalisms.  
  - Contested: Physical CTT’s status (empirical? constitutive?); computation’s necessary conditions.  
  - My view (confidence: medium): Readings are separable; device threatens only P-CTT.  
  - Flagged assumption: C-CTT’s immunity to empirical evidence relies on analytic/synthetic distinction—rejections (e.g., Quinean) earn credit if argued.
