  ### How the Poem Works  
  - **Obfuscation via Rotating Terms**:  
    - *Step* shifts from logical pace → misdirection → evasion → dance → trap → escape.  
    - *Safe* becomes: outcome → comfort → illusion → shield → surrender → delusion.  
    - *Bound* morphs: linked → confined → limit → leap → constraint → edge.  
    - *Check* drifts: verify → hurdle → restraint → illusion → fatigue → surrender.  
    - *Cost* twists: resource → penalty → burden → consequence → exhaustion → sacrifice.  
    - *True* warps: fact → feeling → facade → faith → narrative → silence.  

  - **The Burden Shift**:  
    Each stanza adds layers of faux complexity. The honest side (implied but absent) must rebuild the *entire* chain to expose the lie, while the obfuscator need only mimic coherence at each local "step."  

  - **The Envoi’s Slip**:  
    The final line—"while I glide past **true**"—reveals the deception: truth was never the goal. But the judge, overwhelmed by the fog of six shifting terms crowding the close, might miss it entirely.  

  *Form mirrors function: the sestina’s recursive rotations embody how obfuscation weaponizes the judge’s bounded checks.*
