answer: |-
  **Bottom line: The computer analogy smuggles crucial engineering artifacts into natural cognition, critically undermining your flatmate's second claim (emulation equivalence) while leaving functionalism's core intuition—but not strong autonomy—intact; the two conclusions don't stand or fall together.**

  ### Correspondence Table & Breakpoints
  | **Computer Component** | **Alleged Brain/Mind Analog** | **Where It Breaks** |
  |------------------------|-------------------------------|---------------------|
  | **Program**            | Cognitive architecture / Functional organization | No formal specification exists; "program" is inferred, not engineered (your point #2). |
  | **Hardware**           | Biological brain (neurons, glia, etc.) | No clean abstraction layer—biophysical details (diffusion, temperature) causally intrude (your point #1). |
  | **Compiler**           | Development/Evolution          | No mapping exists from high-level "code" to implementation; it's reverse-engineered guesswork. |
  | **Instruction Set**    | Neural "operations" (e.g., firing patterns) | Not discrete, standardized, or context-independent; dynamically shaped by ongoing activity. |
  | **Clock**              | Brain rhythms (e.g., theta/gamma) | Not global or deterministic; timing *intrinsically* affects computation (contra point #3's "speed invariance"). |
  | **User**               | Environment / Sensorimotor loop | Brains aren't "run" by external agents; they constitutively interact with the body/world. |
  | **Crash**              | Pathological states (seizure, coma) | No clear separation of "software error" from hardware failure; dysfunction is systemic. |
  | **Port**               | Learning / Neuroplasticity     | Not modular; changes propagate holistically, altering the "program" itself. |

  ### Which Disanalogies Bite Against Her Claims
  **1. Against Psychology's Autonomy:**  
  - **Break:** Hardware/software boundary isn't engineered (point #1).  
  - **Impact:** Weakens *strong autonomy* (psychology as independent science). Biophysical details *do* constrain cognitive states (e.g., serotonin diffusion affects decision-making). Functionalism survives as a *heuristic*, but neuroscience can inform psychology causally.  

  **2. Against Emulation Equivalence:**  
  - **Critical Breaks:**  
    - **No compiler/specification (point #2):** Without a formal "program," emulation is just behavioral mimicry—*test-set realizability* ≠ genuine mentality.  
    - **Temporal grain (point #3):** Speed matters if cognition is embodied/enactive (e.g., emotion dynamics). A 1M× slower emulation isn't "thinking"—it's inert.  
    - **Holistic state individuation (point #4):** Silicon might replicate *narrow* functions but likely not the web of holistic roles (e.g., a "belief" tied to evolutionary pain responses).  
  - **Impact:** Emulation claim collapses. Substrate can *prevent* realization of mental states, even if functionalism is true.  

  **Noisy Disanalogies:** "User" or "crash" breaks are philosophically irrelevant here; they don't directly challenge functionalism or realizability.  

  ### Do the Conclusions Survive?  
  - **Autonomy of Psychology:** Survives weakly. Functionalism justifies *methodological* autonomy (studying patterns sans implementation), but not *ontological* independence. Neuroscience can constrain/revise psychology.  
  - **Emulation Mentality:** Fails. Disanalogies reveal the analogy's circularity—it *presumes* functionalism works perfectly to defend it.  
  - **Stand/Fall Together?** No. You could accept functionalism (mind as abstract causal structure) while rejecting substrate-neutrality *for human minds* due to biological constraints.  

  ---

  ### A Better Analogy: **Biological Organism / Ecosystem**  
  - **What it buys:**  
    - *Flexible realizability:* A heart's function (pump blood) is multiply realizable (organic/machine), but context matters (e.g., requires integration with lungs).  
    - *Holism:* Functions defined by system-wide roles (like belief in a cognitive "ecosystem").  
    - *Embodiment:* Acknowledges that temporal/physical scale affects function (a 1M× slower "heart" isn't a heart).  
  - **What it costs:**  
    - Loses computational precision (vague on "program" structure).  
    - Doesn't resolve hard problems (e.g., consciousness) any better.  

  **Verdict:** The computer analogy fails critically on emulation and overstates autonomy, but functionalism's core insight—minds as causal patterns—endures if tempered by biological reality. Push your flatmate on *what counts as realizing the pattern* without a formal spec, and whether timing is extrinsic to cognition.
