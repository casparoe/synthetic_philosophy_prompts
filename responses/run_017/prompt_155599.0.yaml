answer: |-
  Your counterfactual test fundamentally misconstrues agency by reducing intention to physical causality. In Case 2, diverting the trolley *into both men* precisely to exploit their bodily mass as shock absorbers makes their destruction integral to your chosen means. That both bodies are causally redundant doesn’t alter that you *intend* to crush living beings as your mechanism for stopping. The doctrine condemns this: using persons as literal buffers treats them as mere instruments. Proportionality doesn’t "do the work"; the means violate the primary constraint against instrumentalizing grave harm. 

  Case 3 is distinct. You divert because the man’s presence enables the brake’s activation, but *the brake*, not his crushing, is your intended stopping mechanism. His death isn’t your tool; his location triggers an external device. Contrast this with defensive killing: you intend to stop the attacker’s agency (e.g., by force), foreseeing but not intending death. Here, you intend the brake’s function, foreseeing the man’s death as a condition for that function. The agent’s practical reasoning matters: are you acting *through* the harm or *despite* it? In Case 3, it’s the latter; in defensive force, it’s stopping aggression, not killing *as such*. Your test conflates necessary conditions with intended means. If physical causality alone defined intention, surgery would intend the knife’s cutting—which is absurd. The distinction holds because practical reason isn’t physics. Reject it, and you must either permit crushing the two workmen deliberately or forbid defensive acts—neither tenable. Your turn: does your alternative framework permit bombing a munitions factory knowing child laborers inside *will* die, if their deaths aren’t "counterfactually necessary" but causally inevitable?
