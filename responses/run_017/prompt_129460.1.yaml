prompt: |-
  Hey — picture this. You're advising a small but serious foundation that has maybe $40m to spend over five years on one thing: making the people who hold legislative power in a mid-sized parliamentary democracy less like a professional political class. They've decided up front to spend only on institutional design — the rules about who gets to sit in the legislature and for how long — not campaign finance, not media, not civic education. And they'd rather fund eight or ten people thinking hard for three years than run an advocacy campaign, because they think the advocacy is premature until the design questions are less murky. The boards patience is limited, so they want an agenda, not a survey.

  Here's the menu they keep circling around:

  1. Sortition: replace one chamber with a randomly selected assembly, redrawn regularly.
  2. Hard term limits: two or three terms and you're out.
  3. A third thing nobody has a settled name for, so call it lottery retirement: at each election a randomly chosen fifth of sitting members are barred from standing again. Being a career politician stays possible, but it becomes a gamble you can lose through no fault or failure of your own.
  4. Cohort overlap: only half the sortitioned chamber is replaced each cycle, so there's some institutional memory — at the cost of some freshness.
  5. Sortition with a secretariat behind it, where continuity comes from permanent expert staff who brief each new cohort, frame the options and draft the text. Depending on your view that's institutional wisdom without careerism, or careerism relocated to people nobody voted for and nobody sortitioned.

  Assume, just for the sake of argument, something that seems roughly true of citizen assemblies where they've been tried: they do noticeably better than elected bodies on long-horizon stuff like pensions and climate, and noticeably worse at anything requiring them to say no to a loud, organized group right now — and members defer a lot to whoever briefs them.

  So: what are the open questions here that actually deserve the money, in what order, and why? I care much more about the reasoning than the list. For each question tell me what else depends on it — which ones are upstream, e.g. do we need to settle what representation even is before we can say whether a random sample represents anybody? — how tractable it is for political theorists, economists, mechanism-design types and people who just think carefully about institutions, as opposed to empirical political scientists running field experiments, and what kind of finding over the next two years would move it up or down the ranking.

  Two things I'd especially like your read on. First: which of the usual claims made for these reforms don't actually follow? The one I keep hearing is that random selection "fixes polarization" because you can't gerrymander a lottery, and I'm not convinced that's even the right mechanism to be looking at. Second: is the secretariat problem the crux that most of the menu implicitly depends on — the thing that decides whether sortition is worth pushing at all — or is it a distraction that only bites in an idealised version of sortition nobody is actually proposing? Relatedly, where does the expertise go under hard term limits (lobbyists, staff, agencies), and does that worry transfer to the lottery versions or not?

  If you think the menu is missing something big, say what and why it should outrank the rest.
reasoning: |-
  Okay, this user is presenting a fascinating and highly specific challenge. They're advising a foundation with $40m to focus solely on institutional design to disrupt professional political classes in a mid-sized parliamentary democracy. The constraints are clear: no campaign finance/media/civic education work, prefer deep thinking over advocacy, and the board has limited patience. 

  The user has already identified five intriguing mechanisms - sortition, hard term limits, lottery retirement, cohort overlap, and the secretariat model. What stands out is their sophisticated understanding of the trade-offs, especially regarding the secretariat's role and sortition's limitations. They're clearly not a novice - they've spotted that "fixes polarization" claims about sortition might be oversimplified, and they're rightly concerned about where expertise resides under term limits.

  Hmm... the core tension I see is between radical disruption (which might break necessary functions) and controlled decay of careerism (which might not achieve enough change). The user seems aware of this, hence their focus on "what deserves the money" for research. Their two specific requests suggest they want to: 1) debunk popular but shaky reform narratives, and 2) resolve the secretariat dilemma that underpins most options.

  The foundation's approach is refreshingly strategic - they recognize that advocacy is premature without clearer design answers. Their aversion to surveys suggests they want actionable theory, not just academic exercises. The "what moves the needle" framing implies they'd prioritize research that eliminates options or forces redesign early.

  For the secretariat question... it's absolutely the linchpin. All sortition models and even term-limited systems eventually confront the "where does expertise live" problem. The empirical record from citizen assemblies shows how vulnerable non-experts are to staff/lobbyist influence. This isn't a distraction - it's the central vulnerability of anti-careerist reforms. The key insight might be that disrupting career politicians just shifts careerism elsewhere unless intentionally designed against.

  On polarization claims... the user is right to be skeptical. Random selection avoids gerrymandering but doesn't touch the deeper drivers: social sorting, media ecosystems, or how groups deliberate. A sortition chamber might actually amplify polarization if briefed poorly or faced with strategic actors. This deserves funding because it challenges a foundational assumption of sortition advocates.

  I'd add one missing piece: the "supply side" of candidates. Reforms like lottery retirement might deter competent people from entering politics if tenure becomes unpredictable. This interacts with all the menu options and could make term limits counterproductive by increasing reliance on lobbyists. It's upstream because if the pool of candidates changes adversely, no design works well.

  The research priorities should follow a funnel: first tackle the make-or-break issues (like secretariat capture), then test core assumptions (like polarization claims), then examine interactions (like how term limits affect candidate quality). Field experiments would be premature before resolving the theoretical vulnerabilities.

  What would change the ranking? If archival studies of historical lotteries showed consistent capture, that would elevate the secretariat question. If polarization modeling proved sortition groups converge regardless of briefing, that would downgrade that concern. The key is funding research that forces concrete "go/no-go" decisions within 18 months.
answer: |-
  Here’s a focused research agenda prioritizing **upstream, high-leverage questions**, sequenced for maximum impact on the foundation’s goal. The core challenge: **Disrupt political careerism without collapsing legislative functionality**. Key trade-offs center on **continuity vs. freshness** and **expertise vs. capture**.

  ### Tier 1: Foundational Questions (Spend 50% here)
  *(These frame everything else; unresolved, they make other work speculative)*

  1. **The Expertise Dilemma: Where Does Institutional Knowledge Reside?**  
     - **Why upstream?** All options (sortition, term limits, lottery retirement) expel experienced legislators. If expertise migrates to unelected staff, lobbyists, or agencies, reforms merely shift careerism elsewhere.  
     - **Tractability:** Ideal for institutional economists/mechanism designers. Model power dynamics between transient legislators and permanent actors.  
     - **Key sub-questions:**  
       - Under what conditions does a secretariat *enable* informed deliberation vs. *dictate* outcomes? (Analyze briefing materials from existing citizen assemblies).  
       - Do term-limited systems exhibit "lobbyist capture" or "bureaucratic dominance"? (Compare u.s. state legislatures with/without term limits).  
     - **Move the needle:** Evidence that secretariats *systematically* frame choices to predetermine outcomes (e.g., via omission of alternatives) sinks pure sortition. Proof that expertise naturally diffuses to committees/parties supports term limits/lottery.

  2. **The Representation Paradox: Is Randomness Legitimate?**  
     - **Why upstream?** Sortition’s viability hinges on whether "descriptive representation" (mirroring demographics) translates to perceived legitimacy and functional decision-making.  
     - **Tractability:** Political theorists + behavioral scientists. Design experiments testing public trust in random vs. elected bodies making identical decisions.  
     - **Key insight:** Random selection *doesn’t* guarantee legitimacy. If citizens view the sortitioned as "unqualified," reforms backfire.  
     - **Move the needle:** Experiments showing citizens trust sortitioned bodies *less* on crisis issues (e.g., war, pandemics) would cripple the model. Evidence that they’re trusted *more* on long-term issues validates the chamber-splitting approach.

  ### Tier 2: Mechanism-Specific Risks (Spend 30% here)
  *(Tests critical assumptions behind the menu)*

  3. **Does Sortition "Fix" Polarization? (Spoiler: Likely Not)**  
     - **Why prioritize?** The user’s skepticism is justified. Random selection avoids gerrymandering but doesn’t address ideological sorting, media bubbles, or social polarization.  
     - **Tractability:** Computational modelers + network theorists. Simulate deliberation in randomly selected groups with real-world social network data.  
     - **Crucial test:** Can a sortitioned body resist pressure from *organized, passionate minorities* (e.g., anti-vaxxers, NIMBYs) when briefed by a neutral secretariat?  
     - **Finding that shifts ranking:** Evidence that random groups fragment under activist pressure or defer to secretariat "solutions" downgrades sortition.

  4. **The Gambler’s Dilemma: Does Lottery Retirement Deter Talent?**  
     - **Why critical?** If competent candidates avoid politics due to random expulsion, the pool degrades.  
     - **Tractability:** Game theorists + labor economists. Model career decisions under probabilistic tenure.  
     - **Key variable:** Does unpredictability disproportionately deter public-spirited experts vs. opportunists?  
     - **Move the needle:** Data from industries with "up-or-out" promotion (e.g., academia, law) showing adverse selection under uncertainty would torpedo lottery retirement.

  ### Tier 3: Design Nuances (Spend 20% here)
  *(Optimizes viable options)*

  5. **Cohort Overlap vs. Secretariat: Competing Visions of Continuity**  
     - **Focus:** Is institutional memory better held by staggered cohorts (e.g., half replaced each cycle) or by permanent staff?  
     - **Tractability:** Institutional historians + organizational sociologists. Case studies of bodies with rotating members but stable staff (e.g., IPCC, some central banks).  
     - **Decisive factor:** Which model better resists capture by external elites?  
     - **Finding that matters:** Evidence that cohort overlap enables "peer governance" (members mentoring newcomers) supports it over secretariat-dependence.

  ---

  ### Addressing Your Specific Queries

  **1. Debunking Overclaimed Benefits:**  
     - **Sortition ≠ Depolarization:** Random selection removes gerrymandering but not affective polarization. A sortitioned chamber may still split along cultural lines or succumb to motivated reasoning. *Worse*, if briefed poorly, it could legitimize extremist views as "representative."  
     - **Term Limits ≠ Accountability:** Evidence from U.S. states shows term limits amplify lobbyist influence (as inexperienced legislators rely on them) and reduce legislative oversight of agencies.  

  **2. The Secretariat as Linchpin:**  
     - **It’s the crux.** All non-careerist models *must* address expertise loss. The secretariat isn’t a distraction—it’s the core vulnerability. If staff can steer outcomes by controlling information, sortition becomes a façade for bureaucratic rule. *But* this also points to a solution:  
       - **Hybrid Model:** A sortitioned chamber with *competing* secretariats (e.g., one from civil society, one from academia, one from government) forces members to triangulate perspectives.  
       - **Mandated Dissent:** Briefing materials could be required to include minority reports on key issues.  

  **3. Where Expertise Goes:**  
     - **Under Term Limits/Lottery:** Expertise migrates to:  
       - **Lobbyists:** Most concerning; creates perverse incentives.  
       - **Career Staff:** Less concerning if counterbalanced by competing inputs.  
       - **Executive Agencies:** Risks legislative abdication.  
     - **Under Sortition:** Expertise concentrates in the secretariat *by design*. The risk is asymmetrical: a captured secretariat is more dangerous than dispersed lobbyists.  

  ---

  ### Missing Piece: The "Supply Side" of Candidates
  **Why add it?** Reforms assume a willing pool of competent non-professionals. But:  
  - If lottery retirement deters high-quality candidates, the legislature decays.  
  - Sortition relies on ordinary citizens having capacity/time to engage deeply.  
  **Upstream impact:** If research shows reforms reduce candidate quality or participation, all options fail. **Priority:** Survey potential candidates under simulated term/lottery rules.  

  ---

  ### Recommended Agenda & Sequencing
  | Rank | Research Priority                      | Why First?                                                                 | Key Stakeholders                     | Timeline | Success Metric                          |
  |------|----------------------------------------|----------------------------------------------------------------------------|--------------------------------------|----------|-----------------------------------------|
  | 1    | Secretariat Capture Risk               | Determines if sortition/lottery are viable at all                          | Mechanism designers, org theorists   | 18 mo    | Proof of systematic framing bias        |
  | 2    | Expertise Migration under Term Limits  | Tests if "hard exit" reforms merely shift power                            | Labor economists, policy historians  | 12 mo    | Data on lobbyist influence post-reform  |
  | 3    | Legitimacy of Random Representation    | Validates/invalidates core premise of sortition                            | Behavioral scientists, pollsters     | 18 mo    | Public trust scores vs. elected bodies  |
  | 4    | Candidate Pool Resilience              | Reveals if reforms deter talent                                            | Game theorists, survey methodologists| 12 mo    | Willingness-to-serve under lottery rules|
  | 5    | Polarization in Sortitioned Deliberation| Tests a major selling point; high downside risk                            | Computational modelers, network sci  | 24 mo    | Fragmentation under activist pressure   |

  **Kill criteria:** If Tier 1 reveals secretariats *inevitably* dominate or term limits *inevitably* empower lobbyists, abandon affected options and pivot resources to hybrid models (e.g., sortition + competing briefings). **Move fast:** The board’s patience demands concrete "go/no-go" decisions by Year 2 on each major lever.
