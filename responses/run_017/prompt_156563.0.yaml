prompt: |-
  My dad retired in the spring and I've somehow ended up running the 40-person shop he built, and the place is full of rules nobody can explain — no purchase order over $300 without a second siganture, the Friday afternoon inventory count, a customer we still ship to at a loss and always have. Everyone keeps telling me Chesterton's fence: don't tear down a fence till you know why it was put up. But taken straight that seems to freeze everything forever, because half the time the only way to learn what a practice was for is to remove it and watch what breaks, and I can't run that experiment on a business that has to make payroll.

  So skip the Burke-versus-everyone-else scorecard, give me the spec instead: what would a usable rule for deciding when to keep and when to change an inherited practice actually have to deliver? The cases it has to get right (the rationale that died decades ago, the practice that only ever served the guy who wrote it, the one whose point you can only discover by violating it), the distinctions it isn't allowed to collapse (nobody can explain it vs. nobody benefits; reforming a practice vs. repealing it; caution about *this* arrangement vs. a general suspicion of change), and what it owes a person who has about a month, maybe thirty hours of digging, and no way to A/B test abolition. Mark which requirements are non-negotiable and which are just one camp's taste, and flag any two you suspect can't be satisfied at once — that's the part I most want to see. One short paragraph at the end on whether your list lands nearer Burke or nearer a presumption in favor of changing things is fine, but keep the weight on the criteria.
reasoning: |-
  Okay, let me approach this systematically. The user presents a classic operational dilemma in legacy businesses: inherited rules with unclear purposes, framed through Chesterton's fence paradox. The core tension is between preservation wisdom and necessary adaptation, with concrete constraints (time-limited, no testing).

  First, I need to map the explicit requirements:
  - Must identify when rules are obsolete vs functional but opaque
  - Must distinguish unexplainable rules from unbeneficial ones
  - Requires decision framework without experimentation capability
  - Time-bound (30 hours/month for investigation)

  The implicit layers seem more crucial:
  - Anxiety about disrupting payroll-critical operations
  - Unspoken need for leadership legitimacy (new successor)
  - Desire for principled but pragmatic authority
  - Hidden emotional weight of altering father's legacy

  Key philosophical tensions to resolve:
  1. Burkean conservatism vs radical change
  2. Collective wisdom vs individual inefficiency
  3. Risk tolerance (payroll vulnerability) vs innovation imperative

  For the framework, I consider designing decision axes:
  - Investigative depth proportional to risk exposure
  - Stakeholder impact mapping (who suffers if removed?)
  - Temporal analysis (rule creation context vs current reality)

  The payroll constraint changes everything - it makes preservation the default where uncertainty exists. I'll emphasize reversible changes as the only safe modification path. Also noting that unexplainable rules may indicate institutional knowledge loss rather than irrelevance.

  Potential framework structure:
  - Phase 1: Triage by consequence severity
  - Phase 2: Origin investigation (documents, tenured staff)
  - Phase 3: Stakeholder consent for high-risk changes
  - Phase 4: Sunset clauses for ambiguous cases

  The non-negotiables clearly emerge:
  1. No irreversible changes without understood purpose
  2. Payroll protection as supreme constraint
  3. Distinguish data gaps (unknowable) from knowledge gaps (researchable)

  I suspect tension between thorough investigation (30hr limit) and confidence levels - this needs explicit tradeoff acknowledgment. Also flagging that "beneficiary analysis" often reveals invisible stakeholders (vendors, niche customers).

  Final position leans Burkean due to operational fragility, but with targeted change mechanisms. The loss-making customer case deserves special treatment - it may represent hidden value like market intelligence or goodwill.
answer: |-
  Here's a spec for a usable rule on inheriting practices, designed for your constraints. Non-negotiables are **bolded**; tensions flagged with ⚠️.

  **Core Requirements a Rule Must Deliver:**
  1.  **Prioritize Stability for Critical Functions:** Shield payroll, core revenue, legal compliance, and vital customer relationships from disruption. *Non-negotiable.*
  2.  **Distinguish "Unexplained" from "Harmful":** Actively investigate *before* assuming uselessness. "Nobody *can* explain" ≠ "Nobody *does* benefit." *Non-negotiable.*
  3.  **Require Evidence-Based Change (within limits):** Demand plausible hypotheses for origin/purpose *and* potential harm of removal *before* abolition. Accept "best available guess" after due diligence. *Non-negotiabl*e.
  4.  **Enable "Safe-to-Fail" Experimentation:** Favor modification (scope, threshold, condition) over repeal where possible (e.g., raise PO limit to $500, *then* $1000; count inventory bi-weekly). *Non-negotiable for high-impact/high-uncertainty rules.*
  5.  **Identify Clear Beneficiaries/Harm:** Explicitly map who gains from the practice *now* (even if unintended) and who is burdened. Rules serving only a departed individual are low-priority removal targets. Rules causing active, measurable harm *now* are high-priority targets.
  6.  **Triage by Cost/Benefit & Investigative Burden:** Focus effort on practices with high friction/cost or high potential upside if removed. Low-cost, low-friction mysteries can wait. *Essential for 30-hour limit.*
  7.  **Allow for "Sunsetting" Ambiguity:** If investigation yields *no* credible rationale *and* no clear beneficiary *and* removal risk is low/containable, repeal with a monitoring plan. *Crucial to avoid paralysis.*

  **Critical Distinctions the Rule MUST Preserve:**
  *   **Unexplained vs. Unbeneficial:** (See Req #2). A rule helping a quiet department isn't the same as one helping only a ghost.
  *   **Reforming vs. Repealing:** Modification is often lower risk (Req #4).
  *   **Specific Caution vs. General Inertia:** Healthy skepticism about *this specific fence* ≠ rejecting all change.

  **Key Tensions (⚠️ Hard to Satisfy Simultaneously):**
  *   **⚠️ Evidence Requirement vs. Investigative Limits (Req #3 vs. Req #6):** You *need* evidence to change, but digging deep is impossible for *everything*. Triage ruthlessly. Focus evidence gathering on high-impact/high-uncertainty rules where modification isn't feasible.
  *   **⚠️ Stability Priority vs. Removing Harm (Req #1 vs. Req #5):** The loss-making customer might stabilize a key relationship or be trivial cost-wise. Harm must be *significant and demonstrable* to override stability concerns. Burden of proof is on the changer.

  **Applying the Spec to Your Cases:**
  *   **$300 PO Rule:** Investigate origin (fraud prevention? old budgeting limits?). **Modify:** Raise threshold incrementally ($500 → $750 → $1000) monitoring issues. *Low-risk experiment.*
  *   **Friday Inventory Count:** Investigate (JIT system needs? old theft pattern?). **Reform:** Shift to Monday morning? Use cycle counting? *Modification safer than abolition.*
  *   **Loss-Making Customer:** **High Priority Investigation (Cost!):** Find the *original* rationale (strategic? personal?). Map *current* impact (how much loss? what dependencies?). Who fights for them? Can terms be renegotiated? If no strategic value *and* loss is material, plan a *managed* exit (give notice, find alternatives) – **not** abrupt abolition. *Requires deep dive due to cost & potential hidden stability role.*

  **Burke vs. Change Presumption:** This spec leans Burkean in its **default to stability and investigation**, recognizing complex systems. However, it mandates **active inquiry** and creates **clear, actionable pathways for change** (modification, sunsetting) when evidence or harm justifies it, rejecting blind preservation. It's *pragmatic conservatism*: assume the fence has purpose, but grab your tools and start testing the posts if it's in your way.
