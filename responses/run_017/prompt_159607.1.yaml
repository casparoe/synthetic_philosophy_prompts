answer: |-
  ### Joint Statement on Moral Particularism and Generalism  
  **Party A (Particularist) & Party B (Generalist)**  
  *After three years of adversarial collaboration*  

  ---

  ### 1. Grades of Our Views  
  **Party A (Particularist) holds:**  
  - **(iii)** There may be true moral principles, but no finite, exceptionless, action-guiding set is available to beings like us.  
  - *Explicitly disclaims:* (i) The claim that no true informative moral principles exist. Patterns exist, but they lack the necessity or authority of "principles."  

  **Party B (Generalist) holds:**  
  - **(ii)** For every reason in a case, there is *some* principle—possibly unknown, complex, or impractical—that makes it a reason.  
  - *Explicitly disclaims:* (iii) The claim that competent moral judgment requires *explicit* deployment of principles.  

  **Agreed non-disputes:**  
  - Supervenience (moral properties depend entirely on natural ones) is shared ground.  
  - Neither denies the existence of moral patterns or the usefulness of rules-of-thumb.  
  - The well-known quarrel over "whether moral reasons are context-sensitive" dissolves into a verbal dispute here. Both agree reasons *are* context-sensitive; the disagreement is about what this entails metaphysically.  

  ---

  ### 2. Agreed Claims  
  Both parties endorse the following substantive claims:  
  1. **Holism of Reasons:** Whether a natural feature (e.g., causing pain) counts as a moral reason (for or against an act), and its strength, can vary depending on other features present in the situation.  
  2. **No Atomism:** No natural feature is *always* a moral reason in the same way across all possible contexts.  
  3. **Supervenience Entailment:** If two cases share all natural properties, they share all moral properties.  
  4. **Explanation Asymmetry:** Citing a feature as a reason (e.g., "It caused pain") can be explanatory, even if it does not cite a universal law.  
  5. **No Algorithm:** There is no finite, mechanically applicable procedure for generating correct moral judgments in all cases.  
  6. **Defeasibility:** Moral reasons can be outweighed or undercut by other considerations.  
  7. **Epistemic Role of Principles:** Generalizations (e.g., "Lying is usually wrong") are often indispensable for moral learning, deliberation, and communication.  
  8. **Metaphysical Neutrality on Defaults:** Whether some reasons are "default" (e.g., pain as prima facie bad) is an epistemic or heuristic claim, not a metaphysical one about invariant reasons.  
  9. **No Primitivism:** Moral properties are not brute; their presence is explained by natural properties.  

  *(Excluded: Claims like "Moral principles exist" are omitted due to ambiguity in "principle." Party A denies only *authoritative* principles; Party B includes inescapably complex or unknown ones.)*  

  ---

  ### 3. Disagreements  
  | Neutral Issue | Particularist's Formulation | Generalist's Formulation | Verdict |  
  |---------------|-----------------------------|--------------------------|---------|  
  | **What makes a reason a reason?** | A feature is a reason only in virtue of the *entire constellation* of natural properties in a case. No subsumption under a generalization is required. | A feature is a reason only if there exists a true generalization (a "principle"), however complex, linking that feature (in context) to the moral property. | Genuine |  
  | **The nature of moral explanation** | Explaining why an act is wrong by citing a feature (e.g., "It was deceitful") is fundamental. It does not implicitly invoke a universal rule. | Such explanations work *only because* they implicitly appeal to a true generalization (e.g., "Deceitful acts are pro tanto wrong"). | Genuine |  
  | **The possibility of codification** | The failure to find finite, exceptionless principles reflects a deep truth: morality is too context-dependent for *any* useful, exceptionless codification. | Our inability to codify reflects only epistemic limits. The true principles exist but may be too complex or numerous for humans to grasp fully. | Partly verbal<sup>1</sup> |  
  | <sup>1</sup> *Dispute hinges on whether "useful for humans" is built into the definition of "principle." Party A insists it must be; Party B rejects this.*  

  ---

  ### 4. Cruxes  
  **Crux (a): Is principle-patching ad hoc?**  
  - **Sub-question:** Can a generalist refine a principle in response to counterexamples without the refinement being merely ad hoc?  
  - **Diagnostic test:** *Adversarial Case-Construction Game*  
    - **Rules:**  
      1. Generalist states a moral principle P for a domain (e.g., promising).  
      2. Particularist proposes a realistic case C where P gives the wrong verdict.  
      3. Generalist may:  
         - Amend P once (add a defeater clause, refine the antecedent).  
         - *Not* appeal to vague terms (e.g., "relevant") without defining them.  
      4. Repeat for 10 rounds.  
    - **Stopping rule:** After 10 rounds or if Generalist declares P stable.  
    - **Predictions:**  
      - Party A: After 10 rounds, P will be either (a) riddled with complex, unmotivated clauses, or (b) vacuous (e.g., "Keep promises... unless it’s wrong not to").  
      - Party B: After 10 rounds, P will be more precise and still action-guiding in core cases, showing progressive refinement.  
    - **Concessions:**  
      - If A’s prediction holds, B concedes that *practical* principles for humans are unattainable.  
      - If B’s prediction holds, A concedes that non-ad-hoc refinement is possible in principle.  

  **Crux (b): Does reliable moral performance require tacit principles?**  
  - **Sub-question:** Can a moral agent reliably judge novel cases without relying (even tacitly) on general rules?  
  - **Diagnostic test:** Consider an AI trained on vast moral dilemmas, achieving high reliability in novel cases. Its internal process is a neural net (black box), unable to articulate rules.  
    - **Party A:** This shows principles aren’t needed for competence; holistic pattern-recognition suffices.  
    - **Party B:** The AI’s reliability *implies* it instantiates a complex, tacit principle.  
    - **Concession:** If B, after examining the AI’s errors, cannot plausibly reconstruct *any* coherent principle it follows, B concedes competence need not rely on principles.  

  **Crux (d): Can singular explanation work without generalization?**  
  - **Sub-question:** Does explaining "Why was lying wrong here?" by citing "It undermined trust" require an implicit appeal to a general rule?  
  - **Diagnostic test:** A case where lying *was* wrong solely because it undermined trust, in a context with no other relevant features.  
    - **Party A:** The explanation is complete as stated; no implicit rule is needed.  
    - **Party B:** The explanation works only if "Undermining trust is (pro tanto) wrong" is a true generalization.  
    - **Concession:** If A can show such explanations are accepted as informative by competent speakers who explicitly deny any relevant generalization, B concedes explanation need not *in practice* require subsumption.  

  *(Cruxes (c) and (e) omitted per instruction; these cruxes are deemed stronger.)*  

  ---

  ### 5. Constructed Cases  
  **Case Pair 1: Valence Flip (Promising)**  
  - **Case 1 (Reason FOR keeping):** Ali promises to return Sam’s knife. Sam needs it for work. No other factors. *Keeping the promise is right.*  
  - **Case 2 (Reason AGAINST keeping):** Identical, except: Sam whispers, "If I ever ask for it back, I’m being coerced; don’t return it." Ali later sees Sam, under duress, ask for it. *Keeping the promise (returning the knife) is wrong.*  
  - **Shared feature:** "Keeping a promise to Sam."  
  - **Background difference:** Sam’s prior utterance (not itself a moral reason).  

  | Party | Response |  
  |-------|----------|  
  | **A:** | Valence flip shows promise-keeping is not *always* a reason for an act. Its status depends holistically on context. |  
  | **B:** | Principle amended: "Keep promises unless the promisee has validly released you *or* fulfillment would violate their prior autonomously expressed will." The background feature is a defeater. |  
  - **Effect:** Relocates dispute to whether B’s amended principle is ad hoc (see Crux (a)).  

  **Case Pair 2: Silent Background (Laughter)**  
  - **Case 1 (Reason AGAINST):** At a funeral, Dev laughs loudly at a private joke. This causes distress. *Laughter is a reason against the act (rude).*  
  - **Case 2 (No Reason):** Identical, except: All attendees are close family who, per tradition, share humorous memories to celebrate life. Dev’s laughter is part of this. *Laughter is not a reason for or against the act.*  
  - **Shared feature:** "Laughing loudly at a gathering."  
  - **Background difference:** Cultural context/purpose of gathering (not directly morally salient).  

  | Party | Response |  
  |-------|----------|  
  | **A:** | In Case 2, laughter is *no reason at all*; the background silences its typical reason-giving force. |  
  | **B:** | Principle: "Loud laughter is pro tanto rude *at solemn events*." The background defines the event type, making the principle context-sensitive but still general. |  
  - **Effect:** Relocates dispute to whether B’s "solemn events" clause is part of a genuine principle or merely labels the holistic context.  

  ---

  **Conclusion**  
  We agree on the context-sensitivity of reasons and the limits of codification. Our residual disagreement centers on whether morality *must be* governed by principles (B) or whether principles are at best useful but non-fundamental summaries (A). The cruxes above, particularly the adversarial case-construction game, offer a path to resolution. We commit to executing these tests and publishing the results.  

  ---  
  **Signed,**  
  Party A (Particularist)  
  Party B (Generalist)  

  *(Word count: 1,510)*
