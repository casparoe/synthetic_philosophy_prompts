prompt: |-
  I want a specification, not a verdict. The question on the table is whether generational cohorts are real kinds rather than convenient labels, and I need an answer good enough to do two jobs at once: to tell an empirical researcher whether she may legitimately enter generation as an explanatory variable in a model of political attitudes or labor-market outcomes, and to tell a metaphysician whether cohorts belong in the same ontological bracket as more respectable social or biological kinds. Before I look at any candidate answer, write out what an adequate theory of cohort kinds would have to deliver.

  Give the motivating case or consideration behind each requirement, and say why it is a requirement rather than a preference of one camp. The following problem cases should appear, and you should add any I have missed:

  1. The arithmetic of the age-period-cohort problem. Cohort is a linear function of age and period, so no dataset can by itself separate a linear cohort effect from a linear age effect and a linear period effect. A theory of generations must say what substantive constraint licenses reading a measured regularity as a cohort effect at all, and how that reading could ever be tested rather than stipulated.

  2. Boundary arbitrariness. The start and end years are conventional and get revised, and a person born in 1980 or 1981 straddles the divide. If the kind is real, what fixes the boundary, and how sharp a discontinuity in the associated properties does that allow?

  3. Granularity. Why bands of fifteen to twenty years rather than five-year cohorts or single birth years? Different outcomes would carve the timeline at different widths, so the theory needs a principle for width that does not simply inherit the width from whichever outcome it was built on.

  4. Effect size. Most of the variance in attitudes, income, and behavior within a population is within cohorts rather than between them, and the measured between-cohort gaps are often small. The theory must say how much between-group structure kindhood requires, and whether the answer changes if the job is explanation rather than prediction.

  5. Portability. The categories were drawn for one national population and then exported. Someone born in the same year in the United States, in rural India, and in post-Soviet Estonia lands in the same cohort; the theory must say whether extension is fixed by dates, by shared formative historical exposures, or by self-identification, and what to say when these three criteria come apart.

  6. Looping. Generational labels circulate through marketing, journalism, and hiring, and people adjust their self-conception and behavior in response. Does that feedback make the kind more real, as with interactive or looping human kinds, or does it destabilize it, since the properties drift as the label spreads?

  7. Causal role. Is a generation meant to do causal-explanatory work, or is it a stand-in for a bundle of date-correlated exposures such as leaving school into a recession, cohort-specific technology, or a policy regime? If the latter, the kind is causally inert once those exposures are controlled for; the theory must state which it is and what evidence would discriminate the two.

  8. Error and disagreement about membership. People are unsure of, dispute, and misreport their own cohort, and there is no agreed authority. What sort of mistake is possible here, and what does the possibility of that mistake show?

  Then mark which requirements are non-negotiable for the two jobs I described and which are prejudices imported from one side of the debate, for instance whether sharp boundaries or large between-cohort differences are genuinely required for kindhood. Identify any subset of the requirements you think cannot be jointly satisfied: I especially want to know whether real-kind status, explanatory power, and tolerance of vague or shifting boundaries can all be had together, or whether the specification itself is the interesting negative result. Say which single requirement does the most work in excluding candidate theories.

  Finally, in a few lines each and without citations or a reading list, score three positions against the list: strong realism of the sort found in popular cyclical generational narratives, the deflationary view that generations are only conventionally demarcated birth-year intervals with no metaphysics attached, and the view that cohorts are real but derivative, real only as carriers of historically located formative exposures.
reasoning: |-
  Okay, the user wants a detailed specification for determining if generational cohorts are real kinds. They need this to serve both an empirical researcher and a metaphysician, so the requirements must be balanced. Let me start by recalling the problem cases they listed: APC problem, boundary arbitrariness, granularity, effect size, portability, looping, causal role, and error/disagreement. I should check if any are missing. Maybe internal heterogeneity? Like within-group variance affecting kind status. Added as point 9.

  For each requirement, I need to explain the motivation and why it's non-negotiable. Take the APC problem. It's a fundamental identification issue in statistics. Without constraints, you can't separate cohort effects from age and period. This is crucial for the researcher to avoid spurious findings. For the metaphysician, it questions if cohorts have distinct causal powers. Both sides need this addressed, so it's non-negotiable.

  Boundary arbitrariness is tricky. Real kinds usually have clear boundaries, but cohorts have fuzzy edges. The user mentioned people born in 1980/1981 straddling lines. How does that affect kindhood? The metaphysician needs to know if vague boundaries disqualify cohorts as real kinds. The researcher must justify cutoff choices. This is a core tension, so non-negotiable for both.

  Granularity: Why 20-year cohorts vs. 5-year? Different outcomes might need different splits. The researcher needs a principled basis, not arbitrary choices. The metaphysician asks if the kind's reality depends on the chosen width. Non-negotiable because arbitrary granularity undermines explanatory legitimacy.

  Effect size matters because small between-cohort variance might not support kind status. The metaphysician expects significant differences between kinds. The researcher must decide if the effect size is meaningful. But is it a strict requirement? Large effects aren't always necessary for kindhood (e.g., biological sexes have variations). So, negotiable; depends on explanatory context.

  Portability: Cohorts defined in one country applied elsewhere. Shared birth years vs. experiences. If a US "Millennial" and an Indian one have different experiences, is it the same kind? Researcher needs to know if the variable transfers; metaphysician questions if the kind is universal or local. Non-negotiable as it challenges the coherence of the kind.

  Looping effects: Labels affect behavior. Does this make cohorts more real (like social kinds) or unstable? Researcher must account for feedback loops. Metaphysician considers if interactivity changes ontology. Non-negotiable because it's inherent to social kinds.

  Causal role: Are cohorts causal or just proxies? If controlled exposures remove cohort effects, they're epiphenomenal. Researcher needs to test this; metaphysician cares about causal efficacy. Non-negotiable as it distinguishes real from nominal kinds.

  Error in membership: People misidentify cohorts without authoritative correction. What does this imply? If kinds are real, misidentification should be a mistake. But without clear criteria, it's murky. Researcher might ignore self-ID; metaphysician sees ontological ambiguity. Non-negotiable as it tests kind independence.

  Internal heterogeneity (added): High within-group variance. If cohorts are kinds, should members be similar? But social kinds can be diverse. Researcher must handle heterogeneity; metaphysician questions essentialism. Non-negotiable for kind robustness.

  Now, marking non-negotiables. APC, boundaries, granularity, portability, looping, causal role, error, heterogeneity are essential. Effect size is negotiable—small effects can still be explanatory if consistent. 

  Tensions: Boundaries and granularity conflict with effect size. Sharp boundaries might be needed for kindhood, but cohorts are fuzzy. Also, APC constraints are needed for research legitimacy, but metaphysicians might not require mathematical separability. The biggest hurdle is the APC problem—without solving it, cohort effects can't be reliably measured, affecting both explanatory power and ontological status.

  Evaluating positions:
  1. Strong realism (e.g., Strauss-Howe): Fails APC (stipulates effects), boundaries (rigid cycles), portability (ethnocentric), causal role (cohorts as primary causes). Struggles with most requirements.
  2. Deflationary view: Treats cohorts as intervals. Solves boundary and granularity by accepting arbitrariness. But fails causal role (no deeper explanation), portability (ignores cultural differences), and APC (doesn't address constraints). Good for researchers as variables but ontologically empty.
  3. Derivative realism: Cohorts as exposure carriers. Handles APC via constraints, causal role (proxies), portability (context-dependent). Allows vague boundaries. But may struggle with looping (if exposures change) and granularity (exposure timing varies). Best fit, balancing both jobs.

  The key insight: Real-kind status might require satisfying conflicting demands like sharp boundaries versus empirical fuzziness. The specification shows that while derivative realism comes closest, cohorts as standalone kinds face significant challenges, especially the APC problem.
answer: |-
  Here is a specification for an adequate theory of generational cohort kinds, designed to serve both empirical researchers and metaphysicians. Requirements are derived from core challenges, with motivations and their non-negotiable status justified. An additional critical problem case (internal heterogeneity) is included.

  ### Requirements for an Adequate Theory:
  1. **APC Resolution Constraint**  
     *Motivation*: The Age-Period-Cohort identification problem means cohort effects cannot be empirically distinguished from linear age/period effects without substantive assumptions.  
     *Requirement*: The theory must provide **non-arbitrary, testable criteria** for when a cohort effect exists (e.g., mechanisms that break linearity, like unique historical exposures).  
     *Non-negotiable*: Without this, cohort variables lack empirical legitimacy for researchers and ontological independence for metaphysicians.

  2. **Boundary Justification**  
     *Motivation*: Boundaries (e.g., Millennials: 1981–1996) are contested and fuzzy.  
     *Requirement*: The theory must specify **what determines boundaries** (e.g., exposure to specific events, cultural shifts) and **how much boundary vagueness** is compatible with kindhood.  
     *Non-negotiable*: Researchers need defensible cutoffs; metaphysicians require clarity on whether vagueness invalidates kindhood.

  3. **Granularity Principle**  
     *Motivation*: Cohorts span 15–20 years, but outcomes (e.g., tech adoption vs. retirement) may require finer/coarser divisions.  
     *Requirement*: The theory must explain **why a specific timespan is "natural"** for a cohort kind, independent of any single outcome.  
     *Non-negotiable*: Arbitrary granularity undermines explanatory power (researcher) and suggests non-naturalness (metaphysician).

  4. **Effect Size Threshold**  
     *Motivation*: Between-cohort differences are often small relative to within-cohort variance.  
     *Requirement*: The theory must define **how much between-group structure** is needed for kindhood and whether explanatory utility (vs. prediction) alters this threshold.  
     *Negotiable*: Small-but-consistent differences may suffice for explanation; large gaps are a preference, not a requirement for kindhood.

  5. **Portability Mechanism**  
     *Motivation*: Exporting "Gen Z" globally ignores divergent experiences (e.g., U.S. vs. rural India).  
     *Requirement*: The theory must state whether kind membership is fixed by **birth year, shared exposures, or self-identification**, and how to handle conflicts between these.  
     *Non-negotiable*: Researchers need to validate cross-cultural use; metaphysicians require clarity on universality vs. locality.

  6. **Looping Effect Integration**  
     *Motivation*: Labels (e.g., "Boomer") shape behavior, creating feedback loops.  
     *Requirement*: The theory must explain whether looping **reinforces reality** (via self-fulfilling traits) or **undermines stability** (via definitional drift).  
     *Non-negotiable*: Looping is inherent to social categories; ignoring it misrepresents causality (researcher) and social ontology (metaphysician).

  7. **Causal Role Specification**  
     *Motivation*: Cohorts may be proxies for exposures (e.g., recessions, new laws).  
     *Requirement*: The theory must state whether cohorts have **causal power beyond summed exposures** and how to test for autonomy (e.g., via residual effects after exposure controls).  
     *Non-negotiable*: Researchers must know if cohorts explain unique variance; metaphysicians need to distinguish real vs. derivative causes.

  8. **Error Ontology**  
     *Motivation*: People misidentify cohorts; no authoritative arbiter exists.  
     *Requirement*: The theory must define whether misidentification is a **factual error** (like misclassifying a species) or **conceptual confusion**.  
     *Non-negotiable*: Bears on whether cohorts are observer-independent kinds (metaphysician) or pragmatic tools (researcher).

  9. **Internal Heterogeneity Accommodation** (*Added*)  
     *Motivation*: Cohorts contain vast diversity (e.g., class, region).  
     *Requirement*: The theory must clarify **whether homogeneity is expected** and how variation affects kindhood.  
     *Non-negotiable*: Researchers model intersectionality; metaphysicians assess whether heterogeneity precludes "kind" status.

  ---

  ### Non-Negotiables vs. Preferences:
  - **Non-negotiable for both jobs**: APC Resolution, Boundary Justification, Portability, Looping, Causal Role, Error Ontology, Internal Heterogeneity.  
    *Why*: These address core challenges to empirical legitimacy (researcher) and ontological robustness (metaphysician).  
  - **Negotiable**: Effect Size Threshold (small effects may suffice for explanation); sharp boundaries (vague kinds exist in biology, e.g., species).  
  - **Prejudices**: Demanding large between-cohort differences (social kinds can have modest effects) or perfectly sharp boundaries (many natural kinds have fuzziness).

  ### Tensions and Key Exclusion:
  - **Incompatible Requirements?** Real-kind status + explanatory power + boundary tolerance **can coexist** if cohorts are defined by shared exposures (e.g., "pre-internet adolescence") with fuzzy but mechanistically grounded boundaries.  
  - **Major Excluding Requirement**: **APC Resolution**. Without testable constraints, cohort variables are statistically arbitrary (researcher) and lack independence (metaphysician). This eliminates theories that cannot break linear dependence.

  ---

  ### Scoring Three Positions:
  1. **Strong Realism (e.g., cyclical narratives)**  
     - Fails: APC (assumes effects without constraints), Portability (ignores cultural variation), Granularity (rigid cycles override evidence).  
     - Struggles with Looping (treats labels as discoveries, not interactions) and Causal Role (overstates cohort autonomy).

  2. **Deflationary View (conventional labels)**  
     - Satisfies: Boundary Justification (explicitly arbitrary), Granularity (pragmatic widths).  
     - Fails: APC (no constraints), Causal Role (denies causal power), Portability (uncritical export). Inadequate for metaphysics/explanation.

  3. **Derivative Realism (cohorts as exposure carriers)**  
     - Best Fit: Solves APC (exposures break linearity), Causal Role (cohorts proxy exposures), Boundary/Granularity (aligns with exposure windows).  
     - Struggles with Looping (may not integrate feedback) and Portability (exposures may not globalize).

  **Verdict**: The specification reveals that **derivative realism** comes closest but requires augmenting with looping effects and portability constraints. No theory fully satisfies all requirements, but APC Resolution is the strongest filter.
