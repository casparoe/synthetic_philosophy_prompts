  For the ratchet asymmetry, I'll have one character explain how coordination benefits are immediate while dissolution costs are delayed, making centralization effectively irreversible. For cosmetic multipolarity, I'll show how formal vetoes and member counts can be gamed to create the worst of both worlds. The hard case should emerge naturally in their debate as they try to design an exit mechanism that can't be abused.

