prompt: |-
  I want an implicit-theory reconstruction rather than a literature survey or a reading list: I have no way to follow up on references, so argue for the view instead of pointing me at whoever holds it.

  Here are three features of existing practice as I understand them — correct me if I have any of them wrong:

  (a) In Anglo-American law, falsity is an element and truth is a defense. A statement that turns out true cannot be defamatory, fraudulent, or perjurious, however reckless the speaker was about whether it was true. A witness who swears to something that is in fact true, while believing it false and intending to deceive the court, commits no perjury; a defendant who guesses wildly and happens to guess right has defrauded no one.

  (b) Yet culpability tracks the speaker's epistemic position. Defamation liability and damages turn on negligence or on knowledge of falsity or reckless disregard; fraud requires knowledge or reckless disregard; perjury requires asserting what one does not believe true. The scrupulous speaker of a falsehood and the careless speaker of a falsehood are treated very differently, and the careless speaker of a truth is treated as having done nothing wrong at all.

  (c) Research-integrity proceedings run the other way. Fabrication and falsification are sanctionable whether or not the claim they were used to support is true — even where independent work later confirms it — while honest error is not misconduct, however false and damaging the published claim turns out to be.

  The law appears to locate the wrong in what was said; the integrity code appears to locate it in how the speaker arrived at it. What norm of assertion does each practice presuppose: truth, belief, knowledge, reasonable belief? Is the legal pattern a single coherent norm or a hybrid that merely looks coherent? Does the knowledge norm predict that the law is wrong in both directions at once — the reckless truth-teller goes free while the scrupulous falsity-teller is exposed to liability — and if so, is that a reductio of the knowledge norm or of the practice?

  An objection I cannot shake: perhaps none of these institutions regulates assertion at all. Tort and criminal law compensate and punish reliance and harm; they track falsity because false beliefs cause harm, not because assertion has a constitutive norm. If that is right, the reconstruction is a category mistake and a knowledge norm would have nothing to say to legal design. Take that possibility seriously rather than setting it aside.

  Which brings me to a live case. A professional body I advise is drafting a conduct code for expert witnesses under which the sanctionable act is asserting without knowledge: a witness who asserts what she merely suspects, and who turns out to be right, is sanctionable; a witness who asserts what she knows, and who turns out wrong, is not. A board member says this is incoherent — no one was harmed by the lucky guess, hearers got the truth, and the whole point of regulating assertion is that people act on what they hear.

  So: (i) is that objection any good, and what does it presuppose about what assertion is for? (ii) What do the three practices strictly presuppose, as opposed to merely fit well with? (iii) Where are they underdetermined — could a truth norm plus a separate culpability doctrine reproduce all three features? (iv) What would concretely have to change if we replaced the implicit norm with a knowledge norm: would we start sanctioning lucky guesses under oath, would defamation lose the truth defense?

  Lead with your bottom line in the first sentence, then give the reasoning — no preamble and no restating my question. If the question as posed rests on a confused premise — if the three features do not really conflict, or if asking what a practice presupposes is the wrong question to ask about a norm — say so plainly instead of answering me politely.
reasoning: |-
  Okay, the user wants an implicit-theory reconstruction of different norms of assertion in legal and research contexts. They've outlined three features of existing practices: (a) in law, truth is a complete defense regardless of epistemic culpability, (b) culpability still matters for liability and damages when statements are false, and (c) research integrity focuses on the process (fabrication/falsification) regardless of truth. The user also presents a specific case about expert witnesses and asks several pointed questions.

  First, I need to address the core tension they've identified. The law appears to care about the content (truth/falsity) while research integrity cares about the process (how the speaker arrived at the assertion). The user wonders what norms of assertion each practice presupposes - truth, belief, knowledge, or reasonable belief. They also ask about the coherence of the legal approach and whether a knowledge norm would conflict with current practices.

  The user raises an important objection: maybe these institutions don't regulate assertion per se but rather address reliance and harm. If that's true, then discussing norms of assertion might be a category mistake. I need to take this seriously. In tort and criminal law, the primary concern is harm caused by false statements, not assertion norms as such. Defamation compensates for reputational harm, fraud for economic loss, perjury for obstructing justice. Truth negates harm, hence it's a complete defense. The culpability requirements (knowledge, recklessness) serve to limit liability, not to enforce an assertion norm. So the objection has merit - the law's focus is harm, not assertion norms.

  For research integrity, the focus is different. Fabrication and falsification undermine the scientific process itself, regardless of outcome. The norm here is about maintaining trust in the research process, so the method matters more than the result. This aligns with a knowledge norm or something similar, but the primary goal is preserving the integrity of collective inquiry.

  Regarding the expert witness case: the board member objects that sanctioning a witness who asserts a mere suspicion that turns out right is incoherent because no harm occurred. But the professional body's proposal makes sense if we see expert testimony as governed by a knowledge norm. The purpose of expert testimony is to provide reliable knowledge to the court, not just true statements. Asserting without knowledge violates this trust, even if the statement happens to be true. The objection presupposes that assertion is solely about conveying truth, but expert testimony serves a specific epistemic role in legal proceedings.

  Now, to answer the user's specific questions:

  (i) The objection isn't compelling because it ignores the constitutive norms of expert testimony. The point isn't just to convey truth but to provide knowledge based on expertise.

  (ii) The practices presuppose:
  - Law: Harm prevention (not directly an assertion norm)
  - Research: Methodological integrity (closer to a knowledge norm)
  - Expert testimony: Knowledge provision

  (iii) They're underdetermined regarding assertion norms. A truth norm plus culpability could explain legal practices, while research integrity requires separate norms.

  (iv) Switching to a knowledge norm would require significant changes: sanctioning lucky guesses under oath, removing truth defense in defamation for reckless true statements (but this might conflict with harm principles).

  The bottom line is that these practices don't directly regulate assertion norms; they address different primary concerns (harm in law, process in research). The expert witness proposal is coherent if viewed as imposing a specific knowledge-based duty beyond general assertion norms.
answer: |-
  The law primarily regulates harm, not assertion norms; research integrity regulates epistemic process; the expert witness proposal coherently imposes a knowledge norm for its institutional role.  

  **(a) & (b) Anglo-American Law: Harm Mitigation, Not Assertion Norms**  
  Falsity matters legally because it causes demonstrable harm: reputational (defamation), material (fraud), or judicial (perjury). Truth negates harm, hence is a complete defense. Culpability (negligence, recklessness, knowledge) serves *secondary* purposes:  
  - Limiting liability to cases where the speaker’s fault justifies punishment or compensation.  
  - Deterring reckless speech without chilling honest error.  
  *Presupposition*: Not a norm of assertion, but a harm-based framework where truth is exculpatory regardless of intent. A "truth norm" is not presupposed; truth is a *defeasor of liability*, not a constitutive rule.  

  **(c) Research Integrity: Epistemic Process as the Norm**  
  Fabrication/falsification are misconduct because they corrupt the *method* of inquiry, undermining collective trust in science. Honest error is excused because the process remains intact. Truth is irrelevant: a fabricated "true" result still poisons the scientific record by misrepresenting evidence.  
  *Presupposition*: A **warrant norm** (assert only what your evidence supports), not truth or knowledge. The wrong is violating communal epistemic practices, not causing harm per se.  

  **The Objection to Expert Witness Rule: Why It Fails**  
  The board member’s objection ("no harm, truth conveyed") fails because it misidentifies the function of expert testimony:  
  - Experts are not mere truth-conveyors; they provide **justified certainty** to aid fact-finders.  
  - Asserting without knowledge (e.g., guessing) breaches the institutional duty of epistemic rigor, even if accidentally true. It risks misleading the court by presenting unsupported claims as expertise.  
  - Harm is *potential*: courts rely on expert credibility; a pattern of guesses erodes trust, wasting judicial resources.  

  **Underdetermination and Hybridity**  
  - **Law**: Could mimic a "truth norm + culpability" but doesn’t require it. Harm explains both truth’s defense role and culpability’s gradations without invoking assertion norms.  
  - **Research**: Incompatible with a truth norm; requires a warrant norm.  
  - **No conflict**: Law and research target different goods (social order vs. epistemic integrity).  

  **Concrete Changes Under a Knowledge Norm**  
  Adopting a knowledge norm broadly would disrupt existing practices:  
  1. **Perjury/Oath**: Lucky guesses (true but unknowing assertions) would become sanctionable. Current law exempts them (truth defense).  
  2. **Defamation/Fraud**: Truth would cease to be an absolute defense for reckless true statements (e.g., spreading true rumors maliciously). This conflicts with harm principles—no harm, no liability.  
  3. **Expert Witness Proposal**: It *is* a knowledge norm. Sanctioning correct guesses coheres with its goal; exempting knowledgeable errors protects good-faith expertise.  

  **Bottom Line on Reconstruction**  
  Asking what these practices "presuppose" about assertion norms is misguided: the law regulates harm, not assertion; research regulates method; the expert rule *creates* a role-specific knowledge norm. The expert proposal is coherent because it prioritizes the court’s need for reliable expertise over contingent outcomes—no category mistake, just institutional design.
