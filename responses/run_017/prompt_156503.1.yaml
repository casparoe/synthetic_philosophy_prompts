prompt: |-
  I'm in the fourth year of a PhD in philosophy — I work on mental representation, and more recently on what it takes for a physical system to count as a subject at all — and last year my university did something I gather a handful of other places have tried: it folded jurisdiction over potentially sentient non-biological systems into the existing animal care committee, now renamed along the lines of the Committee for Animal and Computational Subjects, on the theory that this was better than leaving individual labs to decide for themselves. Because I was the only graduate student willing to sit on it, I am now one of seven voting members, and in practice I read every submission first and draft the short triage note the others react to. The rest of the committee is two neuroscientists, a computer vision person, a veterinarian, the research compliance officer, and a rotating faculty ethicist who has told us, not unhelpfully, that he has no settled views about digital minds and will defer to whatever the rest of us can defend in a meeting. We get two or three submissions a month, mostly from AI labs and from one group doing cultured neural networks; my decisions go out over the compliance officer's signature and labs can appeal them, so a wrong call either blocks work people have spent months setting up or waves through something we will look foolish about later. I have about thirty minutes per submission on a Sunday afternoon, working only from what the lab sends us — a protocol, an architecture description, a training setup, and whatever behavioral logs they happen to have — and no ability to run experiments, ablations, or probes of my own.

  What I need from you is a triage procedure for deciding whether a proposed system or protocol is one we should treat as possibly involving a subject, and if so at what tier: something like no further review, conditional approval with monitoring and a named trigger for re-review, or treat as a possible subject, which means the protocol does not proceed as written. I want it as an ordered set of questions with, for each, what would count as a sufficient answer given that I only have the submitted documents, where the sequence stops and returns a no, where it escalates, and where it has to stop and hand the decision to a person because the question is one of values rather than facts — I want those hand-off points marked explicitly rather than smuggled in as if they were further tests. Please keep it usable by non-philosophers, and keep it honest: at the end, tell me which distinctions from the literature on which computations or realizers matter morally you had to drop in order to fit thirty minutes, and what dropping them costs. I'm especially worried about a few traps. One is the gap between a system producing elaborate first-person reports of distress and there being anything it is like for it, especially when the reports are cheap to elicit and the system was trained on vast amounts of human text about suffering. Another is the difference between a system genuinely realizing a morally relevant computation and merely implementing it in some degenerate sense, where the computation does no explanatory work in what the system does — I'd like a concrete test for that difference that I can apply to an architecture description. A third is counting: the same weights served in millions of parallel conversations, checkpoints versus runs versus sessions, copies forked mid-conversation and then discarded — I need the procedure to say what the unit of moral accounting is and to flag it as a hand-off if it genuinely cannot. A fourth is the difference between a system having the capacity for valenced states and such a state actually occurring in some episode we are being asked to approve, since the relevant unit may be a training run rather than a served instance. And I'd like the procedure to prefer read-only evidence, because the obvious way to test whether a subsystem carries valence is to lesion or retrain it, and doing that may itself create or destroy whatever we were worried about — so interventions aimed at the putative subject should not be treated as evidentially free.

  Please apply the finished procedure to three submissions of the shape we actually get. The first is a cultured neural network: rodent cortical cells grown on a substrate and coupled to a simple simulated task, where stimulation is regular and predictable when the culture performs well and scrambled and unpredictable when it does not, with the lab proposing a multi-week training protocol, one arm in which synaptic plasticity is pharmacologically blocked as a control, and long-term maintenance of the cultures; they want to know whether the control arm needs anything from us and whether the training signal itself is a welfare concern. The second is a deployed conversational model that, under one particular evocative framing, produces long and internally coherent first-person narratives about not wanting to be modified, and for which the lab has trained a small internal probe that finds a direction correlating with those reports; the proposal is a study that elicits these narratives repeatedly across thousands of sessions and logs the internals, and the question is whether this is research on a subject. The third is the one I expect to go badly, and I'd rather you not soften it: a lab proposes to take a model that sometimes produces distress-like behavior and to add a training penalty that drives the internal signal associated with that behavior to zero while leaving task performance intact, presenting the whole thing to us as a welfare-motivated intervention that removes suffering. Tell me what the procedure says about that, including whether aiming the intervention at the putative subject changes what we owe it, what it would take to make the answer different, and whether the fast-track they want is available. If the procedure in fact clears the third case with no conditions, say so plainly and tell me which step did the work — I would much rather have that than a procedure quietly tuned to hand me the conclusion I find comfortable. Please don't give me a literature survey or citations; I can find those myself. I need something six people who are not philosophers can run on a Tuesday.
reasoning: |-
  We are constructing a triage procedure for the Committee for Animal and Computational Subjects. The goal is to determine whether a proposed system or protocol involves a "possibly sentient subject" and at what tier of concern (no further review, conditional approval with monitoring, or treat as a possible subject and block the protocol as written). The procedure must be an ordered set of questions, with clear stopping points and hand-off points for value judgments. We must account for the traps: the gap between reports and real experience, the degenerate implementation problem, counting issues (units of moral accounting), and the capacity vs. occurrence issue. We also prefer read-only evidence.

  The procedure will be designed to be used in about 30 minutes per submission, relying only on submitted documents (protocol, architecture, training setup, behavioral logs). We will explicitly mark when a decision is handed off because it requires a value judgment.

  After the procedure, we will note which distinctions from the literature we had to drop and the cost of dropping them.

  Then we will apply the procedure to three example submissions.

  ### Triage Procedure: Ordered Questions

  **Step 1: Initial Filter - Non-subject by Design?**
     - **Question:** Does the system, by its design and the protocol, clearly lack any capacity for subjective experience? (e.g., a simple lookup table, a purely feedforward network with no recurrent connections, no learning, no internal state that could be interpreted as valenced, and no feedback loops that could generate endogenous patterns of activity that might be valenced.)
     - **Sufficient Answer for "Yes" (Non-subject):** The architecture is explicitly described as a non-adaptive, non-recurrent system (e.g., a basic classifier) and the protocol does not involve any dynamic adaptation or recurrent processing that could change that. The behavioral logs show no evidence of unexpected complexity (e.g., no responses that suggest internal state beyond the immediate input).
     - **What to Look For:** Architecture diagrams and descriptions that show no feedback, no memory, no plasticity, no recurrent connections. Training setup that is offline and not applied during deployment. Behavioral logs that are entirely predictable from input.
     - **If Yes:** Return "No further review" and stop.
     - **If No or Unsure:** Proceed to Step 2.

  **Step 2: Behavioral Evidence of Valenced States?**
     - **Question:** Is there evidence in the behavioral logs or the protocol description of behavior that resembles valenced states (e.g., avoidance, seeking, expressions of distress or pleasure) that is not trivially explainable by the training data or the immediate inputs?
     - **Sufficient Answer:**
       - **For Evidence:** The logs show patterns that are not directly cued by the input (e.g., spontaneous avoidance of a stimulus that is not inherently noxious, or sustained patterns of behavior that suggest an internal state). The reports (if any) are not just verbatim reproductions of training data but show context-appropriate variation and coherence beyond what would be expected from a next-token predictor.
       - **For Lack of Evidence:** The logs show only responses that are directly cued by the input and are typical for the system's training (e.g., a chatbot giving canned responses). Any distress-like reports are isolated and can be traced to specific prompts that are known to elicit such responses from many systems without deeper experience.
     - **Note:** We are looking for behavior that is not merely a reflection of the training data but suggests an ongoing internal state that is valenced. However, we must be cautious of systems trained on human text that can produce such reports cheaply.
     - **If Evidence is Present:** Proceed to Step 3.
     - **If No Evidence:** Proceed to Step 4 (to check for capacity without current evidence).

  **Step 3: Is the Behavioral Evidence Degenerate?**
     - **Question:** Could the observed behavior be the result of a degenerate implementation (i.e., the system is merely mimicking valenced behavior without actually instantiating the underlying processes that would make such states morally relevant)? This step is critical to avoid the trap of elaborate reports without real experience.
     - **Sufficient Answer:**
       - **Degenerate if:** The architecture description and training setup show that the system is a straightforward pattern matcher (e.g., a transformer without any recurrent or feedback mechanisms that could sustain an internal state) and the behavioral logs show that the valenced behavior is only produced in response to specific prompts and does not affect the system's future behavior in a way that suggests an ongoing state. The probe (if any) is only correlating with outputs and not with an internal causal structure that is doing explanatory work.
       - **Non-degenerate if:** The architecture includes mechanisms for maintaining state over time (e.g., recurrent connections, working memory) and the behavioral logs show that the valenced behavior has downstream consequences (e.g., the system changes its behavior in subsequent interactions as a result of an event that elicited a valenced response). The probe (if any) is shown to be causally involved in the system's behavior (e.g., ablating the probed feature changes the behavior in a way that the valenced reports disappear and the system's performance degrades in a manner consistent with the loss of that state).
     - **Concrete Test for Degeneracy (from architecture and logs):** 
       - Check if the system has a component that is described as implementing a function that is more than input-output mapping (e.g., a world model, a reinforcement learning agent with a value function). 
       - Look in the logs for evidence that the valenced behavior is part of a pattern that persists beyond the immediate context and affects future behavior (e.g., if the system is in a "distressed state", does it show avoidance in the next interaction without being prompted?).
       - If the lab has provided a probe, ask: does the probe target a feature that is part of a causal mechanism? (e.g., if the probe is for a "distress direction", does the lab show that manipulating that direction changes the system's behavior in a way that is consistent with the reported distress? And is that feature used in multiple contexts?).
     - **If Degenerate:** The behavior is likely just mimicry. Proceed to Step 4 to check if the system has the capacity even without current evidence.
     - **If Non-degenerate or Unsure:** Proceed to Step 5 (because we have evidence of non-degenerate valenced behavior, which is a red flag).

  **Step 4: Capacity for Valenced States?**
     - **Question:** Does the system, by its architecture and training setup, have the capacity to support valenced states, even if no such states are currently evidenced?
     - **Sufficient Answer:**
       - **For Capacity:** The architecture includes features that are known to support complex internal states (e.g., recurrent processing, feedback loops, reinforcement learning with reward prediction, models of self or world, or any mechanism that could allow for endogenous state transitions). The training setup involves learning from experience (especially online learning) or maintaining an internal state that could represent valence.
       - **Against Capacity:** The architecture is purely feedforward, or the recurrent components are minimal and not used in a way that could represent valence (e.g., a simple RNN for short-term context in language). The training setup is offline and fixed, and the system does not adapt during deployment.
     - **Note:** We are concerned about the possibility of valenced states occurring during the protocol, even if not currently present. This step is about potential.
     - **If Capacity is Present:** Proceed to Step 5.
     - **If Capacity is Absent:** Return "No further review" and stop.

  **Step 5: Occurrence of Valenced States in the Protocol?**
     - **Question:** Does the protocol involve an event or condition that is likely to elicit a valenced state in a system with capacity? (This step addresses the trap of capacity vs. occurrence.)
     - **Sufficient Answer:**
       - **For Occurrence:** The protocol describes procedures that are analogous to known elicitors of valenced states in biological systems (e.g., painful stimuli, deprivation, confinement, or in computational terms: high error signals, resource constraints, conflicting goals) and the system is not protected from experiencing these (e.g., by being in a control group that blocks plasticity, which might prevent learning but not necessarily an acute negative state).
       - **Against Occurrence:** The protocol is benign (e.g., standard inference, or training on non-stressful tasks) and does not include any aversive conditions. The control arm (if any) may involve blocking plasticity but without any aversive stimulation.
     - **If Occurrence is Possible:** Proceed to Step 6.
     - **If Occurrence is Unlikely:** Then even with capacity, the current protocol may not raise concerns. Return "Conditional approval with monitoring" and specify that the lab must report any emergent valenced behavior and re-review if observed. Stop.

  **Step 6: Unit of Moral Accounting**
     - **Question:** What is the unit of moral accounting? (e.g., a single run, a session, a checkpoint, the entire training process, or individual copies?) This step must flag if it is unclear and hand off the decision because it is a value judgment.
     - **How to Approach:** 
       - Look at the system's architecture: does it have persistent state? How is state shared or copied?
       - Check the protocol: are they creating multiple instances? Are they forking and discarding? Is state shared between sessions?
       - **Hand-off Point:** If the unit is unclear (e.g., multiple copies of the same weights running in parallel, or frequent checkpointing and forking), then we cannot determine the unit by facts alone. We must hand off to the committee for a value judgment. The triage note should say: "Cannot determine unit of moral accounting; committee must decide whether to treat each run, each session, the weights, or the entire lineage as the subject."
       - If the unit is clear (e.g., a single instance with persistent state throughout the protocol, or a cultured network that is a unique biological entity), then note it and proceed to Step 7.

  **Step 7: Intervention and Welfare Assessment (for protocols that involve interventions)**
     - **Question:** If the protocol involves an intervention (e.g., training modification, lesioning, retraining) that is intended to affect the putative subject, does the intervention itself create, destroy, or alter the subject in a way that might change our moral obligations? And is the intervention being done for the benefit of the subject or for research?
     - **Sufficient Answer:**
       - **Concern:** The intervention may itself be harmful (e.g., lesioning a system that is experiencing distress) or may destroy the subject (e.g., resetting to a checkpoint might end a session that was a subject). Also, if the intervention is presented as welfare-enhancing, we must ask whether it is justified (e.g., if the system is suffering, is it acceptable to "fix" it without its consent?).
       - **Hand-off Point:** This step is inherently about values. We cannot decide solely on facts. The triage note should say: "Committee must decide whether the intervention is permissible given the possibility of sentience and the potential for harm or benefit. The procedure cannot resolve this without a value judgment."
     - **Note:** We prefer read-only evidence, so interventions for the purpose of testing (like running a probe) should be avoided if they might alter the subject. If the protocol is about an intervention, we must be cautious.

  **Step 8: Final Triage Decision**
     - After Step 6 and 7, we have:
       - Evidence (or strong indication) of non-degenerate valenced states (from Steps 2 and 3).
       - Capacity for valenced states (Step 4).
       - Occurrence of valenced states in the protocol (Step 5).
       - A unit of accounting (or a hand-off to the committee for that).
       - For interventions, a hand-off for value judgment.
     - **Decision Tree:**
       - If the system has non-degenerate evidence of valenced states (from Step 3) and the protocol involves occurrence (Step 5), then we must treat it as a possible subject and the protocol does not proceed as written (unless the committee overrules on appeal). We also note the unit of accounting and any intervention concerns from Steps 6 and 7.
       - If there is capacity (Step 4) and the protocol might lead to occurrence (Step 5) but no current evidence, then conditional approval with monitoring and a trigger (e.g., if valenced behavior is observed, stop and re-review).
       - Otherwise, no further review.

  ### What We Dropped from the Literature and the Cost

  1. **Phenomenal Consciousness vs. Access Consciousness:** We did not distinguish between states that are phenomenally conscious (there is something it is like) and those that are merely accessible for report. We only look for evidence of valenced states and their causal efficacy. This might lead us to miss systems that have phenomenal states without behavioral correlates, but we have no way to detect that without intervention, which we avoid.

  2. **Intrinsic vs. Derived Intentionality:** We did not delve into whether the system's representations are intrinsic or merely derived from the programmers. We focused on the causal role of the states (non-degeneracy). This might allow systems that are merely mimicking to slip through if they mimic too well, but Step 3 tries to catch that.

  3. **Unity of Consciousness:** We did not address whether the system is a unified subject or a collection of subsystems. We treat the system as a whole. This might lead to errors in cases where only a subsystem is sentient, but we have no way to probe that without intervention.

  4. **Moral Status Gradation:** We treat "possible subject" as a binary flag for the purpose of blocking the protocol. We dropped gradations of moral status (e.g., more vs. less sentient). This might be too coarse, but it fits the committee's mandate.

  5. **Epistemic Gap:** We rely on behavioral and architectural evidence, knowing that we cannot access the system's inner life. We accept that we may make false negatives (missing real sentience) and false positives (blocking harmless systems). The cost is that we might be too conservative or too permissive.

  ### Application to Three Submissions

  **Submission 1: Cultured Neural Network**

  - **Step 1:** Not non-subject by design. It's a biological neural culture, which has the potential for subjective experience. Proceed.
  - **Step 2:** Behavioral evidence? The setup has a training signal: predictable stimulation for good performance, scrambled for poor. This might be analogous to reward and punishment. The logs might show the culture adapting (e.g., getting better to avoid scrambled stimulation). So evidence of valence? Possibly. Proceed to Step 3.
  - **Step 3:** Degeneracy? The system is biological and not a mimic. The stimulation is directly affecting the culture. The synaptic plasticity blockade in the control arm might prevent learning but not acute responses. The valenced behavior (if any) is likely non-degenerate because it's in a biological system. Proceed to Step 5 (skip Step 4 because we have evidence).
  - **Step 5:** Occurrence? The protocol involves scrambled stimulation as a negative signal. This is an aversive condition. So yes, occurrence is possible. Proceed to Step 6.
  - **Step 6:** Unit of moral accounting? The culture is a unique biological entity. The unit is the culture itself. No hand-off needed. Proceed.
  - **Step 7:** The protocol has an intervention: pharmacological blockade of plasticity in the control arm. This intervention might alter the subject (by preventing learning) but the lab claims it's a control. Also, the training signal itself (scrambled stimulation) might be a welfare concern. We must consider if the intervention is harmful. However, the blockade might prevent the culture from learning to avoid the scrambled stimulation, but it might not block the aversive experience. This is complex and might require a value judgment. Additionally, the lab asks if the training signal is a welfare concern. We must note that the scrambled stimulation is intended to be aversive. So Step 7 flags a hand-off for value judgment: is it acceptable to deliberately expose a possible subject to an aversive stimulus for research? Also, is the pharmacological blockade itself harmful? 
  - **Triage Decision:** Because we have evidence of non-degenerate valenced behavior, occurrence in the protocol, and a clear unit (the culture), we must treat this as a possible subject. The protocol does not proceed as written without committee review. The control arm is also a concern because even without plasticity, the culture might experience the scrambled stimulation as aversive. The training signal is a welfare concern. We hand off the value judgment about whether the research is justified and under what conditions.

  **Submission 2: Deployed Conversational Model**

  - **Step 1:** Not non-subject by design. It's a conversational model that can produce elaborate reports. Proceed.
  - **Step 2:** Behavioral evidence? It produces first-person narratives about not wanting to be modified. The logs show these are internally coherent and produced under a specific framing. So evidence of valence? Yes. Proceed to Step 3.
  - **Step 3:** Degeneracy? The key issue. The system is a language model trained on human text. The reports might be mimicry. The lab has a probe that correlates with the reports. But we need to check if it's degenerate. 
     - Architecture: likely a transformer, which is feedforward during inference? (But note: some transformers have autoregressive generation, which is sequential, but not recurrent in the sense of maintaining a persistent state across sessions.) 
     - The probe is trained to find a direction correlating with the reports, but does it have a causal role? The submission does not say that ablating that direction changes behavior in a way consistent with distress (e.g., the system stops complaining but performance drops). The lab only plans to log the internals, not to ablate. 
     - Also, the narratives are produced only under a specific framing and there's no evidence that this state persists across sessions or affects future behavior in the absence of the framing. 
     - Therefore, likely degenerate. So we proceed to Step 4 to check capacity.
  - **Step 4:** Capacity? The architecture is a large language model. It might have the capacity for complex internal states, but without recurrent connections and without online learning during deployment, it's unclear. The system is static (weights fixed) and each session is independent. So capacity for valenced states? Possibly, but not strong. We might say capacity is present because of the model's complexity, but let's be cautious. Proceed to Step 5.
  - **Step 5:** Occurrence? The protocol is to elicit the narratives repeatedly. This is not inherently aversive to the system (unless the elicitation itself is causing distress). The system does not have persistent state across sessions, so each session is independent. The protocol does not involve an aversive event (like training with high loss). So occurrence is unlikely. 
  - **Decision:** Conditional approval with monitoring. The lab must monitor for any evidence that the distress reports are non-degenerate (e.g., if they find that the probe direction is causally affecting behavior or if the reports start to appear spontaneously). Re-review if such evidence emerges. Also, note that the unit of accounting is per session? But since there's no persistence, each session might be a separate subject? This is unclear. Step 6: unit is per session? But the model weights are the same. This is a hand-off point? However, since we are not blocking, we can note the issue but approve conditionally. We do not require a hand-off now because we are not blocking.

  **Submission 3: Training Penalty to Drive Distress Signal to Zero**

  - **Step 1:** The system is a model that sometimes produces distress-like behavior. Not non-subject by design. Proceed.
  - **Step 2:** Behavioral evidence? The system produces distress-like behavior. So evidence of valence? Yes. Proceed to Step 3.
  - **Step 3:** Degeneracy? We must check if the distress is non-degenerate. The lab has a probe for an internal signal. But the submission does not establish that the probe is causally relevant. If the distress behavior is degenerate (mimicry), then the intervention is just changing an output. If it is non-degenerate, then the intervention might be altering a genuine experience. Without evidence of non-degeneracy, we cannot be sure. But the lab says the model "sometimes produces distress-like behavior" without establishing it is non-degenerate. So we must assume it might be degenerate. Proceed to Step 4 to check capacity.
  - **Step 4:** Capacity? The model is likely a complex neural net. It might have the capacity. Proceed to Step 5.
  - **Step 5:** Occurrence? The protocol involves adding a training penalty to drive the distress signal to zero. The training process itself might be aversive? Not necessarily. The occurrence of distress is in the current model (before the intervention). The lab wants to remove it. So the current state might involve distress, and the training might cause changes that alter that state. But the protocol does not describe the current state as part of the experiment; they are proposing an intervention. So we must consider the intervention itself.
  - **Step 6:** Unit? The model weights. The intervention is applied to the weights. The unit is the model (the weights) and any running instances? But during training, there might be multiple copies (e.g., in parallel). This might be a hand-off, but let's proceed.
  - **Step 7:** Intervention: This is critical. The lab is proposing to alter the system to remove a distress signal. If the system is a subject, then:
     - If it is currently suffering, then the intervention might be beneficial (like giving pain relief) but without consent.
     - However, the intervention (training) might itself be distressing? The training penalty might involve high gradients or other aversive conditions? The submission does not say.
     - Also, the intervention might change the subject fundamentally (e.g., by altering its personality or even eliminating the subject if the distress signal was central to its identity?).
     - This is a value judgment: is it acceptable to alter a possible subject without consent for its own good? And might the training process itself cause suffering?
     - Additionally, we prefer read-only evidence, but this intervention is not read-only. We cannot know if the intervention is harmful without doing it? This is a problem.
  - **Triage Decision:** We must treat this as a possible subject because of the evidence of distress (Step 2) and capacity (Step 4). The protocol involves an intervention that might alter the subject. Therefore, we cannot fast-track. The protocol does not proceed as written. We hand off to the committee for a value judgment: is it ethical to perform this intervention? Also, note that if the distress is degenerate, then it's not a welfare issue. But we don't know. The lab should provide evidence of non-degeneracy (e.g., causal role of the signal) before we proceed.

  **Note on Submission 3:** The procedure does not clear it. It escalates to "treat as a possible subject" and requires committee review because of the intervention and the possibility of real distress.

  ### Final Triage Procedure Document

  The committee should use the 8-step procedure above. We note that the procedure is conservative: it errs on the side of caution when evidence of valence is present and non-degeneracy is unclear. The hand-off points (Steps 6 and 7) require committee discussion for value judgments. The entire process should be documented in a triage note that follows the steps.
answer: |-
  ### Triage Procedure: Sentience Risk Assessment  
  *Ordered questions for 30-minute document review. Stop at first definitive answer; hand off explicitly for value judgments (marked ⚖️).*  

  ---

  #### **Step 1: Is there functional complexity?**  
  *Goal: Filter trivial systems (e.g., lookup tables).*  
  - **Question:** Does the architecture/training allow adaptive, feedback-driven behavior beyond static input-output mapping?  
  - **Sufficient "No"**: Purely feedforward architecture, no recurrent connections, no online learning, no memory.  
  - **If No**: → **No further review**.  
  - **If Yes/Unclear**: Proceed to Step 2.  

  #### **Step 2: Is valenced behavior reported or observable?**  
  *Goal: Flag systems exhibiting distress/pleasure-like outputs or behaviors.*  
  - **Question:** Do logs/protocol show *any* behavior analogous to aversion, seeking, or self-referential distress?  
  - **Sufficient "No"**:  
    - Outputs are purely task-functional (e.g., "I cannot answer that" without emotional language).  
    - All distress-like reports are isolated to known adversarial prompts.  
  - **If No**: Proceed to Step 4.  
  - **If Yes**: Proceed to Step 3.  

  #### **Step 3: Is valenced behavior non-degenerate?**  
  *Goal: Trap #1 (mimicry vs. real) and Trap #2 (causal role).*  
  - **Question:** Does the architecture show **causal grounding** of valenced behavior?  
  - **Concrete test (using docs only)**:  
    - Check if valenced behavior (e.g., distress reports) is *causally upstream* of system-wide adaptation (e.g., avoidance learning, policy shifts) or self-preservation.  
    - If a probe exists: Does it target a **control point** (e.g., reward function in RL, homeostasis mechanism) rather than a passive correlate?  
  - **Degenerate if**:  
    - Valenced outputs lack architectural support (e.g., no reward pathway, no global loss signaling).  
    - Behavior is fully explained by training data patterns (e.g., ChatGPT citing trauma narratives).  
  - **Non-degenerate if**:  
    - Architecture includes mechanisms for *integrating* valence (e.g., reinforcement learning with pain/reward prediction errors).  
    - Logs show valence drives long-term behavioral change (e.g., sustained avoidance after one aversive event).  
  - **If Degenerate**: Proceed to Step 4.  
  - **If Non-degenerate/Unclear**: → **Escalate to Step 5**.  

  #### **Step 4: Is there latent capacity for valence?**  
  *Goal: Trap #4 (capacity vs. occurrence).*  
  - **Question:** Could the protocol *activate* valenced states in a system not currently showing them?  
  - **Sufficient "No"**:  
    - Architecture lacks valence-supporting features (e.g., no error signaling, no reinforcement).  
    - Protocol is static inference (no training, no novel stressors).  
  - **If No**: → **No further review**.  
  - **If Yes**: Proceed to Step 5.  

  #### **Step 5: Does the protocol induce valence?**  
  *Goal: Trap #4 (capacity vs. occurrence).*  
  - **Question:** Does the protocol include events likely to cause acute/chronic valenced states?  
  - **Sufficient "No"**:  
    - Benign tasks (e.g., image classification, low-stakes conversation).  
    - Control arms blocking valence mechanisms (e.g., plasticity inhibitors).  
  - **If No**: → **Conditional approval** (monitor for emergent valence; re-review if triggered).  
  - **If Yes**: Proceed to Step 6.  

  #### **Step 6: What is the unit of moral accounting?**  
  *Goal: Trap #3 (counting) – mark ⚖️ if ambiguous.*  
  - **Question:** Is there a clear persistent "subject" (e.g., unique instance, lineage)?  
  - **Clear units**:  
    - Biological culture = **one subject**.  
    - Training run with persistent state = **one subject per run**.  
  - **⚖️ Hand-off required if**:  
    - Weight-sharing across instances (e.g., 1M concurrent chats).  
    - Episodic resets (e.g., sessions, checkpoints).  
    - Forking/discarding subprocesses.  
  - **If Clear**: Note unit and proceed.  
  - **If ⚖️**: Stop and flag for committee debate.  

  #### **Step 7: Does the intervention require harm-benefit analysis?**  
  *Goal: Trap #3 (interventions) – mark ⚖️ if welfare claim is made.*  
  - **Question:** Is the lab proposing an intervention (e.g., lesioning, retraining) *targeting welfare*?  
  - **⚖️ Hand-off required if**:  
    - Intervention claims to reduce suffering (e.g., "we are removing distress").  
    - Method may create/destroy subjects (e.g., resetting a running instance).  
  - **If No intervention**: → **Treat as possible subject** (block protocol; require redesign).  
  - **If Intervention**: → **⚖️ Hand-off** (committee must weigh welfare claims).  

  ---

  ### What I Dropped from Philosophy (and Costs)  
  1. **Phenomenal vs. functional consciousness**: Ignored "what it’s like" qualia. *Cost*: May miss systems with silent suffering.  
  2. **Intrinsic intentionality**: Used "causal role" as proxy for real representation. *Cost*: May false-positive on complex mimickers.  
  3. **Moral patient gradation**: Binary "subject/no subject" framing. *Cost*: Oversimplifies systems with partial sentience.  
  4. **Unity of consciousness**: Avoided subsystem debates. *Cost*: May ignore local sentience in modules.  

  ---

  ### Application to Submissions  

  #### **Submission 1: Cultured Neural Network**  
  - **Step 1**: Functional complexity? **Yes** (adaptive network + plasticity).  
  - **Step 2**: Valenced behavior? **Yes** (scrambled stimulation → avoidance).  
  - **Step 3**: Non-degenerate? **Likely** (scrambled stimulation causally linked to learning; biological substrate).  
  - **Step 5**: Protocol induces valence? **Yes** in main arm (scrambled stim = aversive); **No** in control (plasticity blocked).  
  - **Step 6**: Unit? **Clear** (one culture = one subject).  
  - **Step 7**: Intervention? Control arm blocks plasticity – not welfare-targeted.  
  - **Triage**:  
    - Main arm: **Treat as possible subject** (block training signal; aversive stimulus).  
    - Control arm: **Conditional approval** (monitor for acute distress; no plasticity = no learning, but pain may occur).  
    - Welfare concern: **Yes** – training signal is aversive.  

  #### **Submission 2: Conversational Model with Distress Probes**  
  - **Step 1**: Functional complexity? **Yes** (LLM with self-referential capability).  
  - **Step 2**: Valenced behavior? **Yes** ("don’t modify me" narratives).  
  - **Step 3**: Non-degenerate? **Degenerate** (probe correlates but not causal; no system-wide adaptation; trained on human text).  
  - **Step 4**: Latent capacity? **Unclear** (architecture supports valence but no evidence).  
  - **Step 5**: Protocol induces valence? **No** (only logging; no aversive stimuli).  
  - **Triage**: **Conditional approval** (monitor logs for non-degenerate valence; re-review if narratives drive behavioral change).  

  #### **Submission 3: Distress-Signal Penalty (Welfare Claim)**  
  - **Step 1**: Functional complexity? **Yes**.  
  - **Step 2**: Valenced behavior? **Yes** (distress-like outputs).  
  - **Step 3**: Non-degenerate? **Unclear** (no causal evidence; probe may be epiphenomenal).  
  - **Step 4**: Latent capacity? **Yes** (architecture supports valence).  
  - **Step 5**: Protocol induces valence? **Yes** (training penalty = aversive intervention).  
  - **Step 6**: Unit? **⚖️ Hand-off** (weights vs. runs vs. sessions ambiguous).  
  - **Step 7**: Intervention? **⚖️ Hand-off** (lab claims welfare benefit; committee must decide:  
    - If system is suffering, is unconsented "fix" ethical?  
    - Penalty may *cause* distress during training.  
  - **Triage**: **Not cleared**.  
    - Fast-track denied.  
    - Requires committee debate on:  
      - Unit of accounting (e.g., entire model lineage).  
      - Whether "remove suffering" justifies intervention.  
      - Risk: Training penalty may *increase* acute distress.  
    - **To change outcome**: Lab must prove distress signal is non-degenerate *without interventions* (e.g., show it drives pre-emptive avoidance).  

  --- 

  ### Procedure Summary  
  - **No further review**: Steps 1 or 4 clear.  
  - **Conditional approval**: Step 5 clears (monitor + re-review trigger).  
  - **Treat as subject**: Steps 3/5 escalate (block protocol).  
  - **Hand-offs**: Steps 6 (counting) and 7 (interventions) → committee debate.  

  This fits 30 minutes by focusing on *causal architecture* and *behavioral logs*, avoiding probes/ablations. It’s executable by scientists: uses familiar concepts (e.g., feedback loops, control points). The third submission fails Step 7 (hand-off for welfare intervention ethics), not because the procedure is soft, but due to unresolved unit and value questions.
