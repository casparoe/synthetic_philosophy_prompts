prompt: |-
  So I'm a software engineer with no philosophy or econ background, and I help run the grants committee for a mid-size open source foundation — we hand out a couple million a year across ~40 grants, and right now the decisions are made by five people arguing over a spreadsheet. A friend who works at a prediction market startup keeps telling us we should just run futarchy on it: the committee votes on what we're supposed to maximize (say, downstream adoption or contributor retention measured 18 months out), then we open conditional markets that trade claims like total adoption conditional on us funding project A versus conditional on us not funding it, and we fund whichever side prices higher. I think I get the basic mechanic, and I get that the standard objections are about manipulation, thin markets, and how you even pick the metric. What I need is an agenda, not an explainer.

  Concretely: we have maybe six months of two people's part-time time and around $50k we could put into market subsidies, and the decision at the end of that is whether to run one live pilot on a handful of grants or drop the whole idea. So which open questions here actually matter for a decision like that, in what order should we take them on, and why that order? I care much more about the reasoning than the list — which questions are upstream of the others (so that getting them wrong quietly poisons everything downstream), which are tractable for two engineers with no econ PhD versus which genuinely need mechanism-design expertise, which are already well trodden versus actually neglected, and for each one, what we would concretely do differently depending on how it came out. Also please say which of the famous philosophical objections basically don't bite at our scale and that we should stop spending time on.

  A few things we've been kicking around that I want you to put into the ranking rather than politely ignore: (1) shadow mode, where we run the markets non-binding alongside our normal process for a year and only escalate to binding if the market's implied forecasts beat the committee's on grants we didn't route through it; (2) locking the metric before any trading starts, plus letting anyone buy a capped dispute bond that forces a pause and a public audit of whether the metric is being gamed; (3) instead of one welfare metric, requiring a proposal to clear a small bundle of them (adoption, contributor retention, maintainer bus factor) with an explicit rule for what counts as clearing; (4) trading on what a future, better-informed version of our own electorate would retrospectively endorse, rather than on an objective index; (5) a liquidity subsidy that decays as volume arrives, and the separate question of who eats the losses when the market turns out to be wrong. Some of these are probably reinvented wheels — if one already has a standard name, just tell me the name and move on, no citations or reading lists, I can't chase papers anyway and I don't want a bibliography. Please defintely rank all five against whatever you think matters more, and don't tell me they're all good ideas.

  Start with a few sentences of prose on what you take the single biggest crux to be and why, then give me a table, one row per question, 8 to 12 rows, ordered by your priority, with exactly these columns: rank | question_or_line_of_work | upstream_of (which other questions or answers depend on this) | tractable_by_us (high/medium/low, plus what it actually takes) | neglectedness (high/medium/low) | decision_it_changes (what we'd do differently given each answer) | evidence_that_would_move_it (what we'd see in a six-month pilot that would move this up or down the list). If any of my five ideas earns a row, mark it with [mine]. Keep everything tied to a foundation our size, not to national governments.
reasoning: |-
  We are given a concrete scenario: a mid-size open source foundation with a grants committee, considering a pilot for futarchy to improve grant allocation. The goal is to design an agenda for the next six months to decide whether to run a live pilot or drop the idea. The resources are two people part-time and $50k for market subsidies.

  The single biggest crux: **The feasibility of creating a market that reliably aggregates information about the impact of grants on the chosen metric(s) without being undermined by manipulation, thin trading, or misalignment of incentives, given the foundation's scale and resources.**

  Why this is the crux: If the market cannot produce trustworthy predictions (due to low participation, manipulation, or poor liquidity) then the entire futarchy mechanism fails. Without reliable predictions, the market-based decision is no better (and possibly worse) than the current committee process. The other concerns (like metric choice) are important but secondary because if the market doesn't work, they are moot.

  Now, the table of prioritized questions/line of work. We order by priority, meaning we start with the most fundamental and upstream issues. We include the user's five ideas where they fit.

  Rank | Question or Line of Work | Upstream Of | Tractable By Us | Neglectedness | Decision It Changes | Evidence That Would Move It
  ---|---|---|---|---|---|---
  1 | **Can we design a market that attracts sufficient liquidity and participation to produce reliable predictions?** | All other market-related questions (e.g., manipulation, metric gaming). If this fails, the whole pilot is infeasible. | Medium (requires some market design but can build on existing platforms; the challenge is tailoring to our context). We can prototype and test with subsidies. | Medium (liquidity is a known issue, but specific solutions for small-scale futarchy are less explored). | If we cannot achieve sufficient liquidity even with subsidies, we drop the idea. If we can, we proceed to pilot. | In a shadow mode (non-binding) run, we measure liquidity (volume, number of participants, bid-ask spreads). If the market stays too thin (e.g., high spreads, low volume) despite subsidies, it's a red flag.
  2 | **How do we choose and measure the welfare metric(s)?** | The design of the market (what is being traded) and the interpretation of market prices. Also upstream of the dispute mechanism and bundle approach. | High (we can define metrics based on our goals; requires software and data collection, which is in our domain). | Low (well-trodden in impact evaluation, but specific to our context). | If we cannot define a measurable, objective, and manipulation-resistant metric, we might drop futarchy or switch to a subjective metric (like retrospective endorsement). Also affects whether we use a single metric or a bundle. | We can run a retrospective analysis: take past grants and try to compute the metric(s) for them. If we cannot measure it for past cases (due to missing data or ambiguity), it's a problem. Also, in shadow mode, we observe if the metric is easily gameable.
  3 | **Is the market vulnerable to manipulation or strategic trading?** | The trustworthiness of the market outcome. If manipulation is easy, the market is not reliable. | Medium (requires some game theory; we can simulate attacks or use known mitigations like caps on positions, but may need expert input). | Medium (known issue, but small-scale markets are less studied). | If we find that even with basic controls (like position limits) the market is easily manipulated, we might not proceed. Otherwise, we design controls into the pilot. | In shadow mode, we look for anomalous trading patterns or attempts to move prices without clear information. We can also run controlled tests (e.g., seed the market with false info and see if it corrects).
  4 | **[mine] Shadow mode: Can the market outperform the committee in a non-binding setting?** | The decision to go binding. Also tests the market's predictive power. | High (we can run it with our current process and compare; requires setting up the market and tracking predictions vs outcomes). | Low (this is a standard validation approach). | If the market's implied forecasts are not better (or worse) than the committee's, we drop the idea. If they are better, we consider moving to binding. | We run the market alongside our normal process for a set of grants. We compare the market's predicted impact (for funded and unfunded) with actual outcomes and with the committee's predictions (if recorded). We measure accuracy (e.g., mean squared error, calibration).
  5 | **[mine] Locking the metric and dispute bond for gaming** | The integrity of the metric and the market's foundation. | High (we can implement a smart contract or a simple escrow for bonds; the challenge is defining what constitutes gaming). | High (this specific mechanism is not standard). | If we can design a dispute bond that effectively deters gaming without causing excessive disruption, we include it. Otherwise, we rely on ex-post audits. | In shadow mode, we simulate disputes (or invite test disputes) to see if they are effective and not abused. We also monitor the metric for signs of gaming.
  6 | **[mine] Using a bundle of metrics instead of one** | How we define the market contract (if we condition on multiple metrics). | High (we can define the bundle and the clearing rule; the challenge is in trading complexity). | Medium (multi-dimensional futarchy is less common). | If a bundle is feasible and reduces the risk of perverse incentives, we adopt it. If it makes the market too complex, we stick to one metric. | We run a shadow market on a bundle and see if traders can handle it (liquidity, price accuracy). We also simulate whether the bundle rule leads to better decisions.
  7 | **Cost-effectiveness: Does the market produce enough value to justify the costs (subsidies, time)?** | The decision to adopt at all. | High (we can estimate costs and compare to the value of better decisions). | Medium (cost-benefit for futarchy in small settings is not well studied). | If the benefits (from better grant decisions) do not outweigh the costs (including subsidies and operational overhead), we drop the idea. | We run a shadow mode and estimate the potential improvement in decision quality (using historical data and market predictions). We compare the projected value (e.g., additional adoption per dollar) to the cost of running the market.
  8 | **[mine] Liquidity subsidy design and loss allocation** | The market's liquidity and sustainability. | Medium (requires understanding subsidy mechanisms; we can model decay functions). | Low (subsidy design is well-studied). | We choose a subsidy design (e.g., decaying) and decide who bears the loss (foundation or traders). | In shadow mode, we test different subsidy levels and decay rates, observing their effect on liquidity and the cost. We also see if the market becomes self-sustaining.
  9 | **[mine] Trading on retrospective endorsement** | The choice of the welfare metric. | High (we can define a process for retrospective evaluation and build a market around it). | High (this is a novel approach and less tested). | If we are unsatisfied with objective metrics, we might switch to this. However, it may be more subjective and harder to resolve. | We run a shadow market on retrospective endorsement for past grants and see if it produces sensible predictions. We also assess the feasibility of forming a "future electorate".

  Notes on the ordering:
  - We start with the market's basic feasibility (liquidity) because if we can't get a functioning market, nothing else matters.
  - Metric choice is next because it defines what we are predicting. Without a good metric, the market is predicting nonsense.
  - Manipulation is a key risk that could invalidate the market, so it comes before validation (shadow mode).
  - Shadow mode is the validation step, so it comes after we have a market design and metric.
  - The dispute bond and bundle are specific design choices that depend on the metric and the market.
  - Cost-effectiveness is a go/no-go for adoption but we can only assess it after we have a design and some validation.
  - Liquidity subsidy design is a tactical issue that we can adjust based on the market's response.
  - Retrospective endorsement is an alternative to objective metrics and is considered if objective metrics fail.

  Famous philosophical objections that don't bite at our scale:
  - **Voter apathy/ignorance in setting the metric**: In a small foundation, the committee setting the metric is informed and engaged. National elections face mass voter ignorance, but we have five people.
  - **Incentives for metric setting**: The committee is not a random set of voters but people with skin in the game (the foundation's success). They are less likely to set a bad metric.
  - **Market manipulation by whales**: Our grants are small (average $50k) and the market would be small. It's unlikely that a manipulator would spend huge sums to distort a small market. Also, with position limits, we can mitigate.

  We focus the pilot on the top questions: building a market with enough liquidity, defining the metric, and testing for manipulation in shadow mode. The $50k subsidy is primarily for attracting liquidity and testing the market. We use the six months to:
  1. Design the market mechanism (liquidity, subsidies, trading rules) and choose the metric(s).
  2. Run a shadow market on past and current grants (non-binding).
  3. Analyze the results (liquidity, manipulation, accuracy vs committee and outcomes).

  At the end, we decide based on:
  - Is the market liquid and manipulation-resistant?
  - Can we measure the metric reliably?
  - Does the market outperform the committee in shadow mode?
  - Is it cost-effective?

  If yes to these, we run a live pilot. If not, we drop it.
answer: |-
  ### The Single Biggest Crux
  **Whether the market can achieve sufficient liquidity and participation to produce reliable, manipulation-resistant predictions at your scale.** If the market is too thin (e.g., low trading volume, wide bid-ask spreads) or easily gamed, the predictions become noise—or worse, actively misleading. This is upstream of everything: a failed market invalidates the entire mechanism, regardless of how well you design metrics or dispute systems. At your foundation's size, the risk isn't theoretical (e.g., nation-state manipulation) but practical: attracting enough informed traders with limited subsidies. Solve this first, or abandon the idea.

  ### Prioritized Agenda Table
  Here's the 9 highest-priority questions/lines of work, ordered by urgency and upstream dependencies. "Tractable by us" assumes two software engineers with no specialized econ background—leveraging your skills in building prototypes, data analysis, and A/B testing. "Neglectedness" flags areas where small-scale futarchy lacks real-world data. Focus your 6-month pilot on gathering evidence for Rows 1–5.

  | Rank | Question or Line of Work                                                                 | Upstream Of                                | Tractable By Us                                                                 | Neglectedness | Decision It Changes                                                                                              | Evidence That Would Move It                                                                                                                                 |
  |------|------------------------------------------------------------------------------------------|--------------------------------------------|---------------------------------------------------------------------------------|---------------|------------------------------------------------------------------------------------------------------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------|
  | 1    | **Can we attract enough liquidity to make prices reliable?** (Thin markets)              | Everything (esp. manipulation, validity)   | **Medium**: Requires market setup + subsidy tuning. Use off-the-shelf prediction platforms; engineer volume triggers. | **Low**       | **Kill the project** if liquidity is unachievable with $50k. Proceed to pilot if spreads tighten and volume stabilizes.                         | **Pilot data**: Bid-ask spreads < 10% of asset price + sustained trading volume (e.g., >$5k/day) without subsidies. Failure: spreads >30% or volume drops 80% post-subsidy. |
  | 2    | **Is our welfare metric measurable and manipulation-resistant?**                         | Market design, dispute bonds, bundle rules | **High**: Your engineering strength. Prototype data pipelines for adoption/retention; simulate gaming attacks.       | **Medium**    | **Abandon objective metrics** if gaming is trivial; switch to retrospective endorsement (Row 8). Else, lock it in.          | **Shadow test**: Apply metric to 10 past grants. If >30% require subjective judgments or show anomalies (e.g., "adoption" spikes artificially), it fails.               |
  | 3    | **[mine] Shadow mode: Does the market beat the committee on accuracy?**                  | Go/no-go for binding futarchy              | **High**: Run parallel to grants; compare forecasts vs. 18mo outcomes. Use simple accuracy scores (MAE).          | **Low**       | **Drop binding futarchy** if market underperforms committee. **Escalate to pilot** if market is >20% more accurate. | **Accuracy delta**: Market vs. committee mean absolute error (MAE) on 10+ grants. Market wins if MAE is lower for 70%+ of forecasts.                                   |
  | 4    | **How easily can prices be manipulated?** (e.g., whale traders, misinformation)         | Trust in market outcomes                   | **Medium**: Simulate attacks (e.g., inject fake data); add position caps. May need light game theory consult.      | **High**      | **Add strict caps/oversight** if manipulation is cheap. **Kill project** if it’s pervasive and unfixable.                 | **Pilot data**: Price volatility after seeded misinformation or large trades. Success: prices correct within 48hrs. Failure: >50% price swings from small trades.       |
  | 5    | **[mine] Lock metric + dispute bond for gaming**                                         | Metric integrity, audit feasibility        | **High**: Build bond escrow; define audit triggers (e.g., metric spikes). Engineer alerts.                        | **Medium**    | **Implement bonds** if audits catch gaming. **Scrap bonds** if disputes are frivolous (>50% false alarms).               | **Simulated disputes**: Test 5–10 bond triggers. If audits reveal gaming in >30% of disputes, keep; if <10%, bonds are wasteful.                              |
  | 6    | **[mine] Liquidity subsidy design + loss allocation**                                    | Market sustainability                      | **High**: Code decaying subsidies (e.g., halve every 2 weeks); test loss-sharing rules.                           | **Low**       | **Adopt decaying subsidies** if volume grows. **Foundation eats losses** if traders flee after losses.                     | **Pilot data**: Volume growth vs. subsidy decay rate. Success: volume stable after subsidy ends. Loss test: track trader retention after a wrong market.             |
  | 7    | **[mine] Bundle of metrics vs. single metric**                                           | Metric complexity, market clarity          | **Medium**: Engineer bundle rules (e.g., "clear if 2/3 metrics improve"). Test trader comprehension.               | **High**      | **Use a bundle** if traders understand it and prices cohere. **Stick to one metric** if bundle confuses traders.          | **Trader surveys + price correlation**: If bundle prices correlate highly (rho >0.7) and traders report clarity, proceed. Else, too complex.              |
  | 8    | **[mine] Trading on retrospective endorsement** (subjective metric)                     | Metric fallback option                     | **Low**: Requires designing a "future electorate" (hard without poli-sci). Prototype with committee members.       | **High**      | **Only use this if objective metrics fail** (Row 2). Avoid for pilot due to subjectivity.                               | **Shadow test**: Run on 5 past grants. If committee agrees with market’s "endorsement" <60% of the time, it’s too noisy.                                  |
  | 9    | **Cost-benefit: Do market gains justify operational overhead?**                          | Final adoption decision                    | **High**: Estimate $/hour costs vs. value of better grants (e.g., adoption lift).                                  | **Medium**    | **Adopt futarchy** if benefits > 2x costs. **Stick to committee** if gains are marginal.                              | **Pilot analysis**: Compare $ spent on markets vs. estimated grant improvement (from shadow mode). If ROI < 100%, not worth it.                             |

  ### Key Reasoning for Order
  1. **Liquidity (Rank 1) is the gatekeeper**: No liquidity? The market is useless. Test this first with a bare-bones market (even on dummy grants) to see if subsidies attract volume. Engineers can tune this via code.
  2. **Metric integrity (Rank 2) enables everything else**: If your metric is gameable, the market optimizes for a lie. Your engineering team can stress-test this with data pipelines.
  3. **Shadow mode (Rank 3) validates real-world performance**: Run this concurrently with Ranks 1–2. It’s your "A/B test" for futarchy vs. status quo. High tractability (just log committee predictions).
  4. **Manipulation (Rank 4) is a silent killer**: Thin markets (Rank 1) exacerbate this. Simulate attacks early—engineers are good at breaking systems.
  5. **Your ideas fit where they matter**: 
     - **Dispute bonds (Rank 5)** depend on a working metric (Rank 2). 
     - **Subsidies (Rank 6)** tweak liquidity (Rank 1). 
     - **Bundles (Rank 7)** are a complexity tax—only explore if single metrics fail. 
     - **Retrospective endorsement (Rank 8)** is a fallback, not a starting point (too subjective for a pilot).
  6. **Cost-benefit (Rank 9) is last**: You need evidence from above to calculate ROI.

  ### Philosophical Objections to Ignore at Your Scale
  - **"Markets concentrate power in wealthy traders"**: Your grants are small ($50k avg.), and with position caps (Rank 4), a "whale" can’t dominate without high cost.
  - **"Voters can’t agree on a welfare metric"**: Your committee is 5 engaged experts, not 5 million polarized citizens. Metric disputes (Row 5) are resolvable.
  - **"Futarchy ignores ethics"**: For software grants (adoption, retention), ethics are less contentious than in national policy. Bundle metrics (Row 7) can cover basics like "bus factor."

  ### What to Do in the Next 6 Months
  1. **Months 1–2**: Build a non-binding shadow market (Rank 3). Focus on Ranks 1 (liquidity) and 2 (metric) using past grants. Tune subsidies (Rank 6) to boost volume.
  2. **Months 3–4**: Stress-test for manipulation (Rank 4) and metric gaming (Rank 5). Simulate attacks and disputes.
  3. **Months 5–6**: Analyze shadow results vs. committee (Rank 3). If markets win, design a 1–2 grant live pilot. Else, kill the project.

  **Exit criteria for a live pilot**: Liquidity is stable (Row 1), metric is robust (Row 2), market beats committee (Row 3), and manipulation is contained (Row 4). If any fail, futarchy isn’t ready for your foundation.
