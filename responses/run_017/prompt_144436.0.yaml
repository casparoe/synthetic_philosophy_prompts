prompt: |-
  I'm a TA for a second-year epistemology course and I'm working through a stack of short-answer responses to one of our problem questions. We'd just done the contextualism reading (DeRose-style) and the pragmatic encroachment reading (Stanley/Hawthorne-style subject-sensitive invariantism), and I wrote a question that was supposed to force people to separate the two views rather than just restate the bank case. I also threw in a wrinkle I made up myself so they couldn't just reproduce the seminar discussion, and a final part on whether knowledge can still do its usual job of settling practical questions if it moves around like this. The question was worth 25 marks. The rubric I was given is pretty loose: accurate statement of each view, a correct account of what the two views actually disagree about, a defensible treatment of the wrinkle case, and a real engagement with the action-guiding point rather than a slogan.

  Here's the question:

  **Question 3.** (a) Set out the disagreement between epistemic contextualism and pragmatic encroachment. Both views predict that whether someone counts as knowing can shift with features of the context, so what exactly are they disagreeing about? (b) Dana has exactly the sort of evidence you'd expect in a bank case: she remembers banking there on a Saturday a few weeks ago, she glanced at the posted hours, and so on. As far as Dana is concerned, nothing much hangs on whether the bank is open Saturday. But unbeknownst to her, the bank's Saturday hours determine whether a grant she applied for months ago gets paid out this cycle — a great deal to her, if only she knew. Say what each view predicts about whether Dana knows, and say whether the case tells against either view. (c) Knowledge is supposed to be the thing that settles practical questions: if you know that p, that is normally enough to act on p. Does either view make knowledge unable to play that role?

  And here's one student's answer, more or less verbatim (I haven't fixed the typos):

  "Contextualism and pragmatic encroachment are both reactions to the same pattern. In the bank case you have the same evidence either way — you banked there on a Saturday a few weeks back, you've seen the hours posted — but on Friday, when it matters whether the check clears before Monday, it feels wrong to say you know the bank will be open, and on Saturday, when nothing much is riding on it, it feels fine. The contextualist explains this by saying that the truth-conditions of 'knows' shift with the context of the person making the attribution. In a high-stakes conversational context, the standards go up, and so one and the same sentence can be true in one mouth and false in another, roughly the way 'flat' and 'tall' work.

  Pragmatic encroachment, or subject-sensitive invariantism, agrees that knowledge tracks practical factors but locates the shift somewhere else: what matters is how much is at stake for the subject, not which standards happen to be in force in the attributor's conversation. Importantly, encroachment is still a form of invariantism, so it doesn't have to say that the meaning of 'knows' changes from context to context. What changes is whether the subject's practical situation lets her count as knowing at all.

  So the views disagree about whose situation does the work, and you can pull them apart. Suppose I'm attributing knowledge to Dana and a huge amount is riding on it for me, while almost nothing is riding on it for her. The contextualist says my high-stakes context raises the standards, so 'Dana knows' is false; the encroacher says Dana's own stakes are what count, so she knows and what I said is true.

  The unbeknownst-stakes case makes the contrast sharper. Dana's evidence hasn't changed and, as far as she can tell, the stakes are trivial. Encroachment has to say she doesn't know, because the stakes really are enormous — a grant she cares about turns on it — and encroachment is a view about how much is actually at stake, not about how much the subject thinks is at stake. Contextualism, by contrast, has nothing to latch onto: nothing in the conversational context has changed, so it predicts that Dana knows. But this is bad news for the encroacher, because it shows that encroachment is really contextualism in disguise. Once the subject's knowledge can hinge on facts she has no access to, the encroacher is committed to knowledge depending on something external to the subject's own evidence, and that is just the contextualist's point about the attributor's context. The dispute is therefore much shallower than it is made out to be.

  On (c), the worry is that if knowledge slides around with stakes, it can't be the stable thing that settles what to do. I think this is fatal to encroachment. On encroachment you can acquire knowledge just by ceasing to care whether p is true: stop caring whether the bank is open and you come to know that it is, with no improvement in your evidence whatsoever. That's absurd. Contextualism escapes this, because for the contextualist the standards are fixed by the attributor's context rather than by the subject's own attitudes, so the subject can't manufacture knowledge by talking herself out of caring. On the whole I find the encroachment reading more interesting, but (b) and (c) show it can't be right as it stands."

  Two of the other TAs thought this was one of the stronger answers in the pile and on a first read I agreed, but I've now been staring at it for a while and something keeps nagging at me — it reads so smoothly that I'm worried I'm grading the prose rather than the philosophy. Can you grade it properly: give me a mark out of 25 with a breakdown by part, and then the specific comments I could paste into the feedback, the kind the student could actually learn from? For each part I'd like to know what they got right, what's wrong or doesn't follow, and where a claim is merely under-argued rather than false. If you think something in there is a mistake, please say what the correct thing to say would have been, and be explicit about which mistakes you'd actually dock marks for versus which you'd just note in the margin. Don't worry about being harsh, I'd rather catch it now than at the grading meeting.
reasoning: |-
  Hmm, the user is a teaching assistant for an epistemology course, and they need help grading a student's answer to a problem question about epistemic contextualism vs. pragmatic encroachment. The student's answer seems strong at first glance, but the TA is concerned they might be overly impressed by the clear writing style rather than the philosophical accuracy.

  The question has three parts: (a) explaining the core disagreement between contextualism and pragmatic encroachment, (b) applying both views to a novel case with "unbeknownst stakes," and (c) addressing whether knowledge can still guide action if it's stakes-sensitive.

  Looking at the student's response:
  - For (a), they correctly identify that contextualism ties standards to the attributor's context while pragmatic encroachment ties them to the subject's stakes. Good start.
  - For (b), they claim contextualism would say Dana knows (since no contextual shift) while encroachment would deny knowledge (due to high actual stakes). But here's the problem—they incorrectly conclude this makes encroachment "contextualism in disguise," which is a serious misunderstanding. Encroachment is still invariantist! The student conflates external factors with contextualism's semantic claims.
  - For (c), they argue encroachment absurdly allows "manufacturing knowledge" by changing stakes, but overlook that contextualism faces mirror-image issues (e.g., an attributor could "manufacture" ignorance by raising standards). Their critique is asymmetrical and underdeveloped.

  The prose is polished, but there are substantive errors in sections (b) and (c). The "contextualism in disguise" claim in (b) is particularly egregious—it misrepresents both views' fundamental commitments. For (c), the objection isn't fatal to encroachment; both views struggle with action-guidance, and the student doesn't engage that nuance.

  Breakdown:
  - (a) is solid: 8/10 (minor deduction for "dispute is shallow" overstatement)
  - (b) starts well but derails: 4/10 (major error in the critique)
  - (c) is weak: 3/5 (partial credit for identifying the worry)
  Total: 15/25—good but not top-tier. The student needs to understand that pragmatic factors ≠ semantic context-sensitivity, and that both views face action-guidance challenges.
answer: |-
  Here's a rigorous assessment of the student's answer. The prose *is* polished, but there are significant philosophical errors in parts (b) and (c) that undermine the analysis. Below is a detailed mark breakdown (total **15/25**), followed by actionable feedback you can paste directly for the student. I've flagged **major errors** (which lose substantial marks) and **minor issues** (which lose smaller marks or warrant comments only).

  ---

  ### **Mark Breakdown (Total: 15/25)**
  - **(a) Disagreement between views (8 marks available):**  
    **7/8**  
    *Strong on exposition but overstates the "shallowness" of the dispute.*  
  - **(b) Dana case analysis & critique (10 marks available):**  
    **3/10**  
    *Correct initial predictions but a major error in the critique + misdiagnosis of the views' commitments.*  
  - **(c) Action-guiding role of knowledge (7 marks available):**  
    **5/7**  
    *Identifies a worry but misapplies it asymmetrically; partial engagement.*  

  ---

  ### **Feedback for the Student**  
  **Overall:** Your answer is well-structured and shows a good grasp of the core mechanics of contextualism and pragmatic encroachment (PE). However, parts (b) and (c) contain significant misunderstandings that weaken your analysis. Pay special attention to how PE’s invariantism shapes its commitments.  

  #### **Feedback on Part (a): Disagreement Between Views**  
  **Strengths:**  
  - You correctly identify that contextualism ties shifts in "knowledge" attributions to the *attributor’s conversational context* (e.g., "standards go up" for high-stakes attributors).  
  - You accurately contrast this with PE (subject-sensitive invariantism), noting it ties shifts to the *subject’s practical stakes*, not semantics.  
  - The "attributor high-stakes / subject low-stakes" case is a valid way to pull the views apart.  

  **Weaknesses/Improvements Needed:**  
  - **Minor error:** Your claim that the dispute is "much shallower than it is made out to be" is unsupported. The disagreement is deep: contextualism is a *semantic* view about "knows" (like indexicals), while PE is a *metaphysical* view about knowledge itself (it denies "knows" is context-sensitive). These are fundamentally distinct projects.  
  - **Under-argued point:** You don’t clarify that PE is *invariantist*—it insists "knows" has fixed truth-conditions across contexts, differing from contextualism’s semantic flexibility. This is crucial for part (b).  

  #### **Feedback on Part (b): Dana Case Analysis**  
  **Strengths:**  
  - You correctly predict the views’ *initial judgments*:  
    - Contextualism: Since no high-stakes attributor is mentioned, "Dana knows" is true (standards unchanged).  
    - PE: Dana does *not* know because high actual stakes (grant payout) raise the evidence threshold, regardless of her awareness.  
  - You rightly note PE depends on *actual* stakes, not the subject’s beliefs about stakes.  

  **Weaknesses/Errors:**  
  - **MAJOR ERROR (costs heavy marks):** Your claim that PE becomes "contextualism in disguise" is incorrect and misrepresents both views.  
    - **Why it’s wrong:** PE is *invariantist*—knowledge depends on the subject’s *objective practical situation* (e.g., real-world stakes like the grant), *not* conversational context. That stakes are "external to evidence" doesn’t make PE contextualist; it makes it *stakes-sensitive invariantism*. Contextualism, by contrast, denies that knowledge itself shifts—only the word "knows" does.  
    - **Correct treatment:** The Dana case *challenges PE*, but not for the reason you give. The worry is that PE may violate *internalist* intuitions: if Dana’s evidence is unchanged and she’s unaware of the stakes, how can she lose knowledge? This is a common objection (see Hawthorne on "strange lights"), but it doesn’t collapse PE into contextualism. Instead, PE bites the bullet: knowledge *is* factively sensitive to practical realities.  
  - **Under-argued point:** You don’t say whether the case "tells against either view." For contextualism, Dana’s ignorance of stakes is irrelevant (no attributor shift), so it’s unproblematic. For PE, the case is a *pressure point* for those who think knowledge shouldn’t depend on unknown facts—but PE theorists accept this.  

  #### **Feedback on Part (c): Action-Guiding Role of Knowledge**  
  **Strengths:**  
  - You aptly raise the worry that stakes-sensitive knowledge might be unstable for practical reasoning.  
  - The "manufacturing knowledge" point is a valid *prima facie* problem for PE (if you stop caring, knowledge appears without evidence improvement).  

  **Weaknesses/Errors:**  
  - **Significant oversight:** You ignore that *contextualism faces a mirror-image problem*. If an attributor in a high-stakes context says, "You don’t know," this could undermine your confidence in acting—even if your personal stakes are low. Contextualism struggles because knowledge attributions (and thus action-guidance) become dependent on others’ conversational contexts.  
  - **Under-argued claim:** Calling the worry "fatal to encroachment" is too strong. PE theorists (e.g., Stanley) argue knowledge *should* be sensitive to stakes precisely *because* it guides action: if stakes rise, you need more evidence to rationally act. Your "absurd" result is a feature, not a bug, for PE.  
  - **Missing nuance:** Neither view makes knowledge *unable* to guide action—they reconceive how it does so. The deeper issue (which you hint at but don’t develop) is whether knowledge remains *agent-centered* if it depends on external factors. A stronger answer would note that *both* views face instability challenges, not just PE.  

  ---

  ### **Why the Mark is 15/25**  
  - You lost **7 marks in part (b)** primarily for the major error (PE as "contextualism in disguise"), which misrepresents the core disagreement. This error also weakened your critique of the Dana case.  
  - You lost **2 marks in part (a)** for the "shallow dispute" overstatement and incomplete invariantism explanation.  
  - You lost **2 marks in part (c)** for the asymmetric treatment of the action-guiding problem (ignoring contextualism’s parallel issue) and the unsupported "fatal to encroachment" claim.  
  - **Prose didn’t inflate the mark:** While fluent, errors in philosophical content were penalized. A less polished answer with stronger analysis could score higher.  

  **Key Takeaway for Student:** Your strength is exposition, but watch for mischaracterizations of theoretical commitments (especially PE’s invariantism). When critiquing a view, steelman it first—e.g., PE’s response to "manufacturing knowledge" is that *rational action* requires higher evidence in high-stakes scenarios, so "not caring" doesn’t trivialize knowledge; it reflects a normative link between knowledge and action.
