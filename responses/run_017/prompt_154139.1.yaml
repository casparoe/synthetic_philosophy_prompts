prompt: |-
  My friend Raya and I spent about three hours last night arguing about whether soldiers on opposite sides of a war are morally on a par, and I came away unsure what rule she's actually running. It started from a dumb side-question about private military contractors, and somewhere around hour two she said something like "if you'd do it either way, you're not a combatant, you're just a weapon somebody else is pointing" — but then she immediately said she wasn't sure that mattered, so I don't know how much weight to put on it. She's very careful about separating three questions, and I want you to keep them separate too: is the person *liable* to be killed (have they lost, or never had, the claim not to be killed); is killing them *permissible anyway*, the way you may kill a threat you have no complaint against at all; and is the person *blameworthy*, which she thinks can come apart from both of the others. Here's what I'm fairly confident she committed to:

  - Unjust side, volunteer infantryman who knows roughly what the war is about and doesn't much care whether it's just: liable, permissible to kill, killing him wrongs him in no way, and he's blameworthy.
  - Unjust side, conscript dragged in at gunpoint who'd be shot if he refused to fire: not liable, not blameworthy, but permissible to kill if that's the only way to stop him. Her line was roughly "you're not punishing him, you're stopping a threat — you shouldn't feel guilty, but you should feel bad."
  - Just side, soldier who actually looked into whether the war was justified, concluded it was, and fights for that reason: not liable, killing him impermissible and wrongs him, not blameworthy. (She also said the other side can't help themselves by appealing to self-defence here, since they're the ones who made the war.)
  - Just side, soldier who believes the war is just only because he swallowed some obviously racist nonsense from his own government and never checked anything — except it turns out the war really *is* just: not liable, not permissibly killed, but definitely blameworthy. Roughly: "he's a jerk who got lucky, but you don't get to shoot someone for having bad reasons when he happens to be right."
  - Unjust side, cook who never fires a shot and only feeds the front-line troops: liable, same as the infantry — "he's part of the machine." But when I pointed out that this seems to make the missile-factory owner liable too, she said the owner is *not* liable and not to be deliberately targeted, though her death "doesn't weigh much" in the proportionality calculation, and she admitted she didn't have a clean principled line between the cook and the owner.
  - She waffled on one case and never gave a final answer: a soldier on the just side who fights well and within the rules, but purely because the enemy killed his family and he wants to kill as many of them as he can.

  The case I want a prediction on is the one that started the whole fight. A private military company bid to both governments; this guy took the contract from the side that happens to be fighting the just war, at a fee he'd have accepted from either, never inquired which side was in the right, and doesn't care one way or the other. He fights competently, obeys the law of armed conflict, and does real good. So: does Raya say he's liable; is killing him permissible; is he blameworthy; and does he get to complain — is he *wronged* the way the careful just soldier is? I'd of asked her myself but we'd probably just restart the argument. I'm less interested in the bare answer than in the two or three rules that fit her verdicts above equally well and what each of them predicts here — my guesses are something like "the objective justice of the cause decides and motives are irrelevant," versus "what matters is the quality of the agent's deliberation or whether she's guided by the right reasons," versus some counterfactual version of her "you'd do it either way" line — which one you'd bet she's running and why, and which further case would best split them. I'd also like to know whether the traditional claim that combatants on both sides are morally equal is doing any work in any of this, or whether her verdicts about the just side's soldiers have already quietly given it up. And if you think the cook/owner distinction is where the real action is rather than the motives stuff, say so and tell me what case would settle *that* instead.
reasoning: |-
  Hmm, the user has presented a complex moral philosophy debate between him and his friend Raya about the ethics of killing in war. They've spent hours arguing about when soldiers are morally liable to be killed, when killing is permissible, and when they're blameworthy. The user wants me to predict Raya's position on a specific case involving a private military contractor who fights for whichever side pays him, without caring about the justice of the cause.

  Looking at Raya's positions they've already established:
  - For an unjust combatant volunteer who doesn't care about justice: liable, permissible to kill, blameworthy
  - For a conscript on the unjust side: not liable, not blameworthy, but permissible to kill if necessary to stop the threat
  - For a just combatant who properly assessed the war's justice: not liable, impermissible to kill, not blameworthy
  - For a just combatant who accidentally supports the right side for bad reasons: not liable, impermissible to kill, but blameworthy
  - For support roles like cooks on the unjust side: liable like combatants (part of the machine)
  - For weapons manufacturers: not liable and not to be deliberately targeted

  The core tension seems to be between objective facts (which side is actually just) versus subjective factors (the soldier's beliefs, motivations, and quality of deliberation). Raya appears to prioritize the objective justice of the cause for liability questions, while allowing subjective factors to affect blameworthiness.

  For the private military contractor case specifically, I need to consider:
  - He's fighting for the just side
  - But only because they paid him - he would have fought for either side
  - He never inquired about the justice of the cause
  - He fights competently and within the rules

  Given Raya's framework:
  1) Liability: Since he's effectively part of the just war effort (objectively), he shouldn't be liable. Liability attaches to participation in unjust threats according to Raya's previous judgments.
  2) Permissibility: Killing him should be impermissible since he's on the just side, regardless of his motivations.
  3) Blameworthiness: He's likely blameworthy because he didn't care to determine if the cause was just - similar to how she judged the racist soldier on the just side as blameworthy despite being on the right side.
  4) Wronged: Killing him would wrong him since he's not liable and is objectively contributing to the just cause.

  The user also wants me to identify competing principles that could explain Raya's judgments and which one best fits her pattern. The main contenders seem to be:
  A) Objective justice of the cause as primary (which would protect the contractor)
  B) Quality of deliberation/subjective reasons (which might make him more liable)
  C) The "would do it either way" counterfactual (which suggests he's just a weapon)

  Based on the cook case (who is liable despite being non-combatant) versus the factory owner (not liable), the key distinction seems to be direct participation versus indirect contribution. The contractor is directly participating like the cook, so that principle would likely lead to liability if he were on the unjust side, but here he's on the just side.

  To test these principles, I should suggest a case that would split them - perhaps a soldier who fights for the unjust side but only because he genuinely (though mistakenly) believes it's just, versus one who fights for the just side but only for money.

  The traditional moral equality of combatants doctrine seems rejected in Raya's framework since she treats just and unjust combatants differently in several cases.
answer: |-
  Based on Raya's committed positions, I'll predict her verdicts for the private military contractor (PMC) case, reconstruct the competing principles ("rules") underlying her framework, identify which principle likely dominates, suggest a case to split them, and address your broader questions. This analysis treats her positions as consistent and seeks the *most probable* fit—though philosophical frameworks often have tensions.

  ### Prediction for the PMC Case
  - **Liable?** **No.**  
    Raya ties liability primarily to *objective participation in an unjust threat*. The PMC fights for the objectively just side, so he isn't part of an unjust threat. Her cook example shows liability hinges on direct functional contribution to an *unjust* war machine. Here, the PMC contributes to a *just* war effort. Her "part of the machine" logic only activates for unjust threats.  

  - **Permissible to kill?** **No.**  
    Killing is impermissible because (a) he isn't liable (liability is necessary for permissibility in her framework, except for non-liable threats like the conscript), and (b) he objectively advances a just cause. Her "just soldier" cases show permissibility depends on the war's objective justice, not motives. Even her blameworthy just soldier (who fights for racist reasons) isn't permissibly killed.  

  - **Blameworthy?** **Yes.**  
    He "never inquired" and "doesn't care one way or the other," mirroring her unjust volunteer ("doesn't much care whether it's just"). Raya treats blameworthiness as tied to *deliberative failures*—failing to assess the war's justice or acting from indifferent/immoral motives. Her racist just soldier is blameworthy despite being on the right side, and this PMC shares that epistemic negligence.  

  - **Wronged if killed?** **Yes.**  
    Since he isn't liable and killing is impermissible, he is wronged—just like her careful just soldier. His blameworthiness doesn't negate this; it only means he merits moral criticism, not lethal force.  

  **Summary:** *Not liable, not permissibly killed, blameworthy, and wronged if killed.*  
  **Raya's likely soundbite:** "He's a mercenary who got lucky—you can't shoot him because he’s objectively helping the good guys, but he’s still a moral idiot for not caring which side he fights for."

  ---

  ### Competing Principles in Raya's Framework
  Your three guesses are astute. Her positions suggest two core principles are in tension, with a third ("you'd do it either way") operating as a secondary heuristic. Here's how they fit her verdicts:

  1. **Objective Threat Principle (OTP):**  
     - **Rule:** Liability and permissibility hinge *solely* on whether the agent is *objectively contributing to an unjust threat*. Motives and beliefs are irrelevant for liability/permissibility (though they affect blameworthiness).  
     - **Fits:**  
       - Unjust volunteer/cook: Liable (objectively unjust threat).  
       - Just soldiers: Not liable (objectively just cause), even the racist one.  
       - Conscript: Not liable (not *responsible* for the threat), but permissibly killed as a non-liable threat.  
     - **PMC Prediction:** Not liable (just side), not permissibly killed.  

  2. **Deliberative Quality Principle (DQP):**  
     - **Rule:** Blameworthiness and (sometimes) liability depend on the *agent’s reasons and epistemic diligence*. Poor deliberation (indifference, bad-faith beliefs) can make one liable or blameworthy, even if objectively on the just side.  
     - **Fits:**  
       - Unjust volunteer: Blameworthy (indifference).  
       - Racist just soldier: Blameworthy (epistemic failure).  
       - Conscript: Not blameworthy (coerced, no choice).  
     - **PMC Prediction:** Blameworthy (indifference), but *not* liable—since OTP overrides for liability.  

  3. **"Weapon" Counterfactual (WC):**  
     - **Rule:** If an agent would fight for either side indiscriminately, they are a mere "weapon" and lose standing to complain if killed. *But* Raya’s uncertainty suggests this isn't foundational.  
     - **Fits:** Weak. Only partially explains the unjust volunteer ("doesn't care"), but clashes with her just soldiers.  
     - **PMC Prediction:** Might imply liability, but conflicts with her other verdicts.  

  **Which principle dominates?**  
  - **Bet on OTP as primary for liability/permissibility.** Raya consistently prioritizes the *objective justice of the cause* for these questions. Motives only matter for blameworthiness (DQP). For example:  
    - Her racist just soldier is *not liable* despite bad motives.  
    - The cook is liable because they’re part of an *unjust* machine, not because of their motives.  
  - **WC is likely a red herring.** She abandoned it quickly, and it conflicts with her just-side cases.  

  **Prediction Strength:** OTP cleanly explains 5/6 of her cases (excluding the waffled one). DQP explains blameworthiness but doesn’t override OTP for liability.  

  ---

  ### The Cook/Owner Distinction: Where the Action Is
  You’re right—this is a critical tension. Raya’s framework lacks a "clean principled line" for who counts as part of the "unjust machine." This ambiguity affects all cases, including the PMC.  
  - **Her implicit rule:** Liability requires *direct functional contribution* to combat operations (e.g., cook feeds troops, PMC fights). The factory owner is too indirect ("doesn't weigh much" in proportionality suggests she’s distinguishing *direct vs. indirect causation*).  
  - **Why it matters:** If the PMC were on the *unjust* side, he’d be liable like the cook—but for the unjust side, OTP would activate. For the just side, OTP protects him.  

  **Case to split the cook/owner distinction:**  
  > **The Arms Dealer:** Sells weapons exclusively to the unjust side, knowing they’ll be used for aggression. She never handles weapons directly; she brokers deals from a neutral country.  
  - **Prediction:** Raya likely says *not liable* (like the factory owner), but her death "doesn’t weigh much" in proportionality. This tests whether "direct contribution" requires physical proximity or integration into the military structure. If she says liable, her principle is broader (e.g., "knowing, essential contribution to unjust harm").  

  ---

  ### Moral Equality of Combatants  
  Raya has *entirely rejected* the traditional view that soldiers on both sides are morally equal. Her framework holds that:  
  - **Just soldiers are not liable** to be killed, while **unjust soldiers are** (volunteers/cooks).  
  - Killing a just soldier **wrongs them**, while killing an unjust volunteer **does not**.  
  - The other side **cannot appeal to self-defense** against just soldiers.  
  This asymmetry is core to her judgments—especially the conscript case (non-liable but permissible to kill) vs. just soldiers (impermissible).  

  ---

  ### Final Recommendations  
  - **Test Case to Split OTP vs. DQP:**  
    > **The Misinformed Unjust Soldier:** Fights for the objectively unjust side after genuine, diligent research into reliable sources, but is tragically deceived (e.g., fabricated evidence). Believes the war is just and acts accordingly.  
    - **OTP Predicts:** Liable (objectively unjust threat).  
    - **DQP Predicts:** Not blameworthy (good-faith effort), *possibly* not liable if DQP can override.  
    - **Raya’s Likely Verdict:** Liable but not blameworthy—aligning with OTP. If she wavers, DQP has more weight.  

  - **Why the PMC Case is Tricky for Her:** It exposes a conflict between OTP (protects him) and her intuition that mercenaries are morally odious. Her "blameworthy but not liable" verdict for the racist just soldier resolves this—she’ll likely do the same here.  

  Your debate with Raya hinges on whether liability flows from *what you do* (OTP) or *how you decide* (DQP). Her pattern favors OTP, but the cook/owner ambiguity and blameworthiness judgments keep DQP relevant. To probe further, press her on the **Misinformed Unjust Soldier** or **Arms Dealer** cases—they’ll force clarity on whether deliberation or objective role matters most. If you restart the argument, good luck—it’s a hell of a rabbit hole.
