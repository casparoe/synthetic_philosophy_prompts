prompt: |-
  Doing a reading group on Scanlon's contractualism — mostly grad students, plus one political theorist who keeps dragging Rawls in — and I've built an argument against it that I'm fairly sure proves too much, but I can't locate the bad step. Here it is:

  (1) On contractualism, an act is wrong iff it's disallowed by any set of principles that no one could reasonably reject, and whether some person could reasonably reject a principle depends on how strong *their* objection is, compared one at a time against the objections of other individuals. Numbers don't count: that a burden or benefit falls on a million people rather than one doesn't by itself make anyone's objection any stronger. That's supposed to be the whole point of the view — it's why mild pleasures for millions can't justify torturing one person, and why contractualism isn't just utilitarianism with a nicer story about justification. (2) Bridge: you can rescue Ada or five strangers, not both, everyone otherwise equal, each dies if not rescued. Ada's objection to save-the-five (she dies) is exactly as strong as each stranger's objection to save-Ada; I know there's a contractualist tie-breaker about comparing the *strength* of individual burdens, but here the burdens are death versus death, so it does nothing. And the objections can't be pooled, by (1). So contractualism can't rank the options and can't require saving the five, which means saving Ada is permissible. (3) Nothing in (2) turns on the number five. If numbers never strengthen anyone's objection, then a sixth person, a hundredth, a millionth on the many side changes nothing; run the argument again and again and no number of people on the many side ever makes saving the one impermissible. So contractualism is committed to: for any N, you may save the one instead of the N. (4) And here's a version I think is worse. A policy gives each of 200 million people a trivial convenience and imposes on each a one-in-ten-million risk of death. Nobody's individual objection is worth anything — the per-person risk is smaller than risks everyone runs daily without thinking — so no one could reasonably reject it, so it's permitted. But it predictably kills about twenty people. Scale the population and the predictable body count gets as large as you like while every individual complaint stays negligible, and contractualism has no way to prefer the variant with fewer expected deaths, since that difference is purely aggregate. (5) So contractualism either permits knowingly letting a million die to save one, or permits policies with an arbitrarily large predictable death toll, or both. That can't be right.

  I'd most like to keep (1): if contractualism starts adding up across people it stops being the view that explains why the separateness of persons matters, and whatever fix I reach for has to leave the torture case alone, since that result comes from the same anti-aggregation machinery. But I also can't see how to give up (2) or (3) without giving up (1). One of the contractualists in the group says the flaw is in (3): she says we don't assess a principle for a single case but over the whole range of situations it governs, so a person can object that under save-the-one she'd usually be on the losing side, and with a million-to-one that objection is crushing. I half buy that for Bridge, except that it looks to me exactly like taking expected utility from behind a veil of ignorance about which position you occupy — aggregation over positions rather than over people — which sort of begs the question for me, since I suspect that's a relabeling rather than a distinction. And I don't see how it even gets started on (4), where there's no question of which side you're on because everybody is on the same side. So: which step is bad, why did it look fine, and what does each available repair cost me? I'd rather have the diagnosis than a verdict on contractualism, and I don't need anything assigned for the group to read — we've read what we've read.
reasoning: |-
  Okay, the user is in a reading group discussing Scanlon's contractualism and has built an argument that seems to lead to problematic conclusions. They've identified what they believe is a flaw in contractualism, but suspect their argument "proves too much" and can't find where it goes wrong. Let me unpack this carefully.

  First, the user's core argument has several steps. In step (1), they correctly characterize contractualism's key features: wrongness depends on principles no one could reasonably reject, objections are considered individually rather than aggregated, and numbers don't inherently strengthen objections. This is crucial for explaining why torturing one for many's pleasure is wrong.

  In step (2), the Bridge case presents a dilemma: save one (Ada) or save five strangers. The user argues contractualism can't prefer saving five because each person suffers an equal burden (death), and objections can't be pooled. Thus saving Ada is permissible. This seems logically sound given (1).

  Step (3) extends this: if numbers don't matter, then no matter how large N is, saving one over N remains permissible. This leads to the counterintuitive conclusion that you could let a million die to save one.

  Step (4) introduces a risk-imposition case: a policy giving trivial benefits to 200 million people while imposing a tiny death risk (1 in 10 million). Contractualism allegedly permits this despite predictable deaths (about 20) because no individual has a reasonable objection. Scaling this up creates massive predictable death tolls.

  Step (5) concludes contractualism permits either letting millions die to save one, or permitting policies with enormous predictable death tolls - both unacceptable outcomes.

  The user wants to preserve (1) because it's central to contractualism's appeal in cases like torture vs. mild pleasures. But they can't see how to reject (2) or (3) without abandoning (1). A fellow group member suggested evaluating principles over entire domains rather than single cases, allowing objections based on expected outcomes. The user suspects this just smuggles in aggregation under a different name.

  Key tensions I notice: The user is deeply engaged but frustrated. They're intellectually honest - acknowledging their argument might prove too much. They want diagnostic insight more than a verdict on contractualism. Their frustration peaks at the group member's proposed solution, which feels like question-begging.

  For diagnosis: The user's argument is technically valid but misses contractualism's resources. The Bridge case (2) is correctly analyzed only if we ignore how principles operate across multiple applications. Contractualism assesses general principles, not isolated acts. A principle of "always save the one" would indeed give everyone strong grounds for rejection - not because we aggregate objections, but because each person can reasonably object to a principle that systematically disadvantages them in life-or-death situations. This isn't aggregation; it's about the general rule's impact on each individual's standing.

  For the risk case (4), the flaw is assuming no individual objection. When a policy predictably kills people, those who actually die have been wronged - not because of the risk they consented to, but because the principle allowed their sacrifice for trivial gains. Contractualism can condemn this via a principle like "don't impose significant risks for trivial benefits" - which anyone could reasonably reject if applied to them. The predictable deaths manifest the objection each had all along.

  Repair costs: Preserving contractualism's anti-aggregation stance requires accepting that numbers matter indirectly through principle evaluation. This might feel like aggregation in disguise, but it's structurally distinct. The cost is abandoning strict act-focused application. Alternatively, one could bite the bullet on small-number cases but maintain opposition to large-scale sacrifices - though this seems ad hoc. A third option: concede aggregation is needed for large numbers but maintain individualism for small-scale cases - but this compromises contractualism's purity.

  The user's frustration is understandable - contractualism walks a tightrope between individualism and plausible results. But their argument's power comes from applying contractualist machinery too narrowly to single acts rather than general principles. The "bad step" is in (2) and (4), where they underestimate how individual objections gain force when considering recurring application of principles.
answer: |-
  Your argument is sharp and exposes genuine pressure points in Scanlon's framework. The flaw lies in **step (2) and its application to step (3)**, specifically in how you model the "objection" in the Bridge case and misunderstand the resources contractualism has for tie-breaking. This also impacts how we should view step (4). Here’s the diagnosis, why it looked compelling, and the cost of the repair:

  1.  **The Flaw: Mischaracterizing the "Objection" in the Bridge Case (Step 2)**
      *   **The Mistake:** You assume Ada's objection to the principle "Save the many over the one in lifeboat cases" is *only* about *this specific instance* where *she* is the one. Similarly, you assume each stranger's objection is *only* about *this specific instance* where *they* are among the many not saved.
      *   **Why This Looks Fine:** It seems directly faithful to Scanlon's individualism. If objections are rooted in personal burdens and compared one-to-one, and the burden is death in each case, how could one objection outweigh another?
      *   **The Contractualist Correction (and its Cost):** Contractualism evaluates *general principles*, not single acts. A person's reasonable rejection isn't based *only* on how they fare in the *one specific situation* where the principle is applied *to them*, but on the principle's *general implications* for them *across the range of situations it governs*.
          *   **Ada's Objection:** She objects to "Save the many" because *if this principle were adopted*, in any situation where she is the "one," she would die. Her objection isn't just about *this death now*, but about living under a social morality that *systematically permits her sacrifice* whenever she finds herself outnumbered. This is a significant burden *for her* – the burden of being perpetually sacrificable.
          *   **A Stranger's Objection:** Conversely, a stranger objects to "Save the one" (Ada) because *if this principle were adopted*, in the vastly more frequent situations where *they* are part of the "many," they would die unnecessarily. Their objection isn't just about *this death now* (if Ada is saved), but about living under a morality that *systematically permits their death* whenever they are in the majority. This seems an *even greater* burden *for them* – the burden of facing a much higher predictable risk of death due to a wildly inefficient rescue policy.
      *   **Why This Isn't (Just) Aggregation/Veil-of-Ignorance:** The strength of the objection comes from the *predictable, systematic impact of the general principle on the individual's life prospects and security*. It's not about aggregating utilities across people *behind a veil*, but about each individual assessing the *lifetime risk and security implications* a principle imposes *on them personally*. The stranger isn't complaining about the *sum* of deaths; they are complaining that *their own* chance of dying in a rescue scenario becomes unacceptably high under "Save the one." This *individual* burden is greater under "Save the one" than Ada's burden is under "Save the many." Numbers matter *indirectly* because they determine the *frequency* with which an individual is likely to be on the losing side of a principle, thus shaping the *magnitude of the predictable burden the principle imposes on them*.

  2.  **Applying the Correction to Step 3:**
      *   With N=5, the imbalance in predictable burden *might* be debatable (though Scanlon suggests even here saving the five is required). But as N grows (100, 1 million), the objection to "Save the one" by any given member of the many becomes *overwhelmingly strong* for that individual. The predictable burden on *them* – the near-certainty that *they* will die if ever in a large group needing rescue – is vastly greater than the predictable burden on the "one" under "Save the many" – the small chance that they will ever *be* the "one" in such a scenario. Contractualism *can* break the tie based on the comparative *strength of the individual burdens imposed by the competing principles*, where strength is determined by the *predictable impact on the individual's life* (likelihood and severity). Saving the million is required because each of the million can reasonably reject "Save the one" with *far greater force* than the one can reasonably reject "Save the million".

  3.  **Applying the Correction to Step 4 (The Risk Case):**
      *   **The Mistake:** You assume that because the *ex ante* risk to each individual is tiny and "reasonable" (comparable to everyday risks), *no one* has a reasonable objection to the policy principle ("Impose tiny death risks for trivial conveniences").
      *   **The Contractualist Correction:** Scanlon (especially in *What We Owe to Each Other* and later work) argues that individuals *can* reasonably object to principles permitting the imposition of risks, even small ones, *especially when the benefits are trivial*. The objection isn't *just* about the expected utility calculation of their own risk. It has multiple facets relevant to the individual:
          1.  **The Burden of Uncertainty and Lack of Control:** Living under a principle that allows others to impose *any* significant risk of death on you for trivial gains burdens you with uncertainty and a lack of control over fundamental security. This is a distinct harm *to the individual*.
          2.  **Objection on Behalf of Victims:** Crucially, an individual can reasonably object to a principle *because* it predictably leads to harms (like death) being inflicted on others (even if not *them*), *if* those harms are ones that *could not be justified to the person who suffers them*. Each person can say: "I reject this principle because *if it leads to my death*, that death could not be justified to me – dying for the sake of millions of trivial conveniences is not a burden I should have to bear. Since the principle *predictably* leads to such unjustifiable deaths, I can reasonably reject it *now*, based on the burden it places on me *as a potential victim* and the insecurity it creates." The fact that we don't know *who* will die doesn't negate the fact that *someone* will suffer an unjustifiable burden.
          3.  **The "Combined Effect" Objection:** While objections are compared individually, the *fact* that a principle leads to many deaths can be part of *one individual's* objection. Person A can say: "I object to Principle P because it leads to 20 deaths. *Each of those deaths* is, individually, a harm that could not be justified to the person who suffers it. P fails to show adequate respect for the value of each human life it destroys." This points to a flaw *in the principle itself* (its failure to protect individuals from being sacrificed for trivial gains) that each individual can latch onto as grounds for rejection. It uses the aggregate *fact* as evidence of the principle's *individual moral failing*, not as an aggregate cost to be summed.
      *   **Cost:** This move feels closer to permitting "aggregation" as evidence. It requires accepting that an individual's reasonable rejection can be based *in part* on the principle's *predictable consequences for others*, specifically when those consequences involve harms that *could not be justified to the person bearing them*. This is philosophically contentious within contractualism and blurs the strictest "separateness of persons" line. However, it avoids collapsing into utilitarianism by grounding the objection *firmly* in the perspective of the victim and the justification owed *to them*. The policy is wrong because it *fails each victim*, not because the sum of costs outweighs the sum of benefits.

  4.  **Why the Torture Case Still Works:**
      *   The key difference is *justification to the victim*. In the torture case, the victim suffers an *intense, certain, and individualized burden* (torture) that cannot be justified *to them* by appealing to the sum of trivial benefits for others ("We made millions slightly happier by torturing you"). The burden on the victim is categorically unacceptable. In the Bridge case with large N, the principle "Save the one" imposes an *unreasonably high predictable risk of death* on each member of potential future "many" groups; the burden *on them* of living under such a principle is arguably greater *for each of them* than the burden *on the potential "one"* of living under "Save the many". In the Risk case, the victim's death *cannot be justified to them* by the trivial conveniences.

  **Summary Diagnosis & Repair Costs:**

  *   **Bad Step:** Step (2). Misapplies contractualism by focusing objections solely on burdens in the single, immediate case, rather than on the predictable lifetime burdens imposed by the *general principle*.
  *   **Why it Looked Fine:** Scanlon emphasizes the "complaint model" and comparing individual burdens, making the immediate, specific burden seem primary. The prohibition on direct aggregation is central and rightly guarded.
  *   **The Repair (and its Cost):**
      1.  **Focus on General Principles & Predictable Burdens:** Evaluate the *systematic impact* of the principle on the *individual's* life prospects and security. Numbers matter indirectly by affecting the *likelihood* an individual faces a burden under the principle.
          *   **Cost:** Moves away from pure "act-by-act" assessment towards evaluating rules/life patterns. Some may see this as conceding too much to rule-consequentialism or introducing a covert veil of ignorance about one's position.
      2.  **Objections Based on Victim's Justification (especially in Risk Cases):** Allow individuals to object to principles that predictably cause unjustifiable harms to others (even if not themselves) *because* those harms could not be justified *to the victim*.
          *   **Cost:** Feels closer to permitting aggregation *as evidence* of a principle's *individual* moral failing (its failure to protect each person). Requires accepting that an individual's objection can be grounded partly in consequences for others, challenging the strictest separateness doctrine. However, it preserves the core by centering the justification owed *to each victim*.
  *   **What You Keep:** (1) The core anti-aggregation commitment: burdens and benefits to different people are not summed to create a net social utility. The comparison remains fundamentally one-to-one: *Is the objection this person has to Principle P stronger or weaker than the objection that person has to Principle Q?* Numbers only enter by shaping the *strength of the predictable burden on each individual* under the competing principles. The torture case remains intact because the burden *on the victim* is so severe and unjustifiable that it swamps the combined objections of the millions to *not* being mildly benefited.

  **Conclusion:** Your argument powerfully highlights the tension between Scanlon's individualism and intuitively correct results in aggregation-like cases. The repair requires embracing a more dynamic view of objections, rooted in the predictable life-impact of general principles and the perspective of the victim whose harm must be justifiable. This doesn't abandon (1), but it interprets "how strong *their* objection is" in a richer way that incorporates the systematic implications of principles and the justification owed to each potential victim. The cost is a less atomistic, more holistic understanding of individual objections within the framework of general moral rules. Your groupmate's initial intuition was pointing in the right direction, though framing it as "expected utility" was misleading. It's about the *predictable burden a principle imposes on the individual*, not a utility calculation.
