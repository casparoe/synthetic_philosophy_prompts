  ### Karma Theory Decision Tree  
  A tool to classify views on karma as a theory of moral desert based on concrete cases. Answer each numbered node with **A**, **B**, or **C**. Follow the arrows to the next node or a leaf. Record your path (e.g., 1A→2B→4) and find your leaf.  

  ---

  #### **DECISION TREE**  
  1. **When a bad act causes a bad outcome, the karmic link is primarily:**  
     - **A.** The agent *deserves* the outcome as payback. → **2**  
     - **B.** The outcome *serves a good purpose* (e.g., teaches a lesson or deters harm). → **5**  
     - **C.** The outcome is a *lawful result* of the act, explaining why suffering isn’t random. → **11**  

  2. **Can karmic debt fall on someone other than the agent (e.g., their child)?**  
     - **A.** Yes. → **3**  
     - **B.** No. → **4**  

  3. **When debt transfers, the original debtor:**  
     - **A.** Is fully released from the debt. → **Leaf 1**  
     - **B.** Still owes the debt (shared burden). → **Leaf 2**  

  4. **An agent suffers for a wrong they can’t remember. Is this deserved?**  
     - **A.** Yes, if they are psychologically continuous (e.g., same character). → **Leaf 3**  
     - **B.** Yes, if they are the same soul/body, even without continuity. → **Leaf 4**  
     - **C.** No. → **Leaf 5**  

  5. **Can suffering serve its purpose if the sufferer can’t learn (e.g., an infant)?**  
     - **A.** Yes (e.g., it deters others or balances karma). → **6**  
     - **B.** No. → **7**  

  6. **If no one recognizes the suffering as karmic, is it still justified?**  
     - **A.** Yes. → **Leaf 6**  
     - **B.** No. → **Leaf 7**  

  7. **A wrongdoer reforms before suffering occurs. Is the suffering still justified?**  
     - **A.** Yes. → **Leaf 6**  
     - **B.** No. → **Leaf 8**  

  8. **An agent feels deep remorse, then suffers externally. Is this "double payment"?**  
     - **A.** Yes (unjust). → **Leaf 8**  
     - **B.** No (remorse and suffering are separate). → **Leaf 6**  

  9. **Unexpiated karmic debt:**  
     - **A.** Grows over time or accrues "interest." → **Leaf 4**  
     - **B.** Stays fixed or expires. → **Leaf 5**  

  10. **Two agents jointly cause harm. The debt:**  
      - **A.** Is apportioned based on intent/action. → **Leaf 3**  
      - **B.** Is shared equally or collectively. → **Leaf 2**  

  11. **A person is born into terrible conditions due to past karma. This is:**  
      - **A.** Deserved by the newborn. → **4**  
      - **B.** Not deserved, but *explained* by past acts. → **12**  
      - **C.** Not deserved; the complaint of injustice still holds. → **Leaf 10**  

  12. **Is the lawful pattern administered by a cosmic entity (e.g., god)?**  
      - **A.** Yes. → **Leaf 9**  
      - **B.** No (fully impersonal). → **Leaf 10**  

  ---

  #### **LEAVES**  
  | Leaf | Label                          | Most Awkward Commitment                                  | Evidence Against It                              |  
  |------|--------------------------------|----------------------------------------------------------|--------------------------------------------------|  
  | 1    | **Transferable Desert (Full)** | An innocent person (e.g., a child) can *deserve* suffering for another’s act. | Consistent lack of correlation between others’ suffering and an agent’s deeds. |  
  | 2    | **Shared Karmic Debt**         | Debt can be paid multiple times (e.g., by both agent and transferee). | Suffering of transferees doesn’t reduce the agent’s burden. |  
  | 3    | **Retributive Desert**         | Suffering is deserved even if the agent has reformed or can’t learn. | Reformed individuals suffer no ill effects; suffering appears random. |  
  | 4    | **Soul-Based Desert**          | A newborn "deserves" birth defects due to a past-life soul’s acts. | No empirical trace of soul continuity; suffering disproportional to alleged past acts. |  
  | 5    | **Memory-Limited Desert**      | Agents escape desert if they forget their deeds (e.g., amnesia). | Amnesiacs suffer identically to those who remember. |  
  | 6    | **Strong Consequentialism**    | Suffering is justified if it benefits the cosmos, even for innocents. | Suffering of infants/dementia patients yields no measurable benefits. |  
  | 7    | **Recognition-Constrained**    | Suffering is pointless if no one recognizes it as karmic. | Unrecognized suffering still deters/educates (e.g., hidden tragedies). |  
  | 8    | **Reform-Limited**             | Suffering is unjustified if the agent has reformed. | Reformed individuals suffer greatly, with no clear purpose. |  
  | 9    | **Administered Law**           | A cosmic entity enforces karma (e.g., theistic Hinduism). | Injustice persists despite cosmic administrator; no evidence of oversight. |  
  | 10   | **Impersonal Lawful Pattern**  | Karma is cause-effect with *no desert*, like gravity (early Buddhism). | Suffering correlates poorly with moral actions (e.g., saints suffer). |  

  ---

  #### **NOTES**  
  - **Collapsed Cases:**  
    - *Forgotten act (4) and unreformed agent (7A) do the same work:* Both test if desert requires current blameworthiness.  
    - *Infant suffering (5) and dementia (8) do the same work:* Both test if the sufferer’s capacity to learn matters.  
  - **Unoccupied Combinations (diagnosis):**  
    1. `1A→2B→4C` (Transferable debt + Psychological desert + Memory required): **Incoherent**—transferred debt implies no need for psychological continuity.  
    2. `1B→5B→7B` (Consequentialist + No learning possible + Suffering unjustified if reformed): **Unattractive**—limits karma’s scope to unrepentant agents only.  
    3. `1C→11A→12B` (Lawful pattern + Newborn desert + No administrator): **Unexplored**—desert without an enforcer is rare.  
  - **Indistinguishable Leaves:** The tree *cannot* separate:  
    - **Leaf 3 (Retributive)** and **Leaf 4 (Soul-Based)** on *double payment (8)* or *debt growth (9)*. Both answer similarly.  
    - **Leaf 6 (Strong Consequentialism)** and **Leaf 9 (Administered Law)** on *joint harm (10)*. Both allow cosmic balancing.  

  ---

  #### **FIVE-MINUTE VERSION**  
  Ask these three questions in order:  
  1. **What is the karmic link?**  
     - A (Desert) → Ask: **Can debt fall on someone else?**  
     - B (Purpose) → Ask: **Can suffering serve a purpose if the sufferer can’t learn?**  
     - C (Lawful) → Ask: **Is being born into misery deserved, explained, or unjust?**  
  2. **Use answers to assign a leaf:**  
     - *A→Yes* → Leaf 1; *A→No* → Leaf 3/4/5 (ask about memory).  
     - *B→Yes* → Leaf 6; *B→No* → Leaf 7/8 (ask about reform).  
     - *C→Deserved* → Leaf 4; *C→Explained* → Leaf 10; *C→Unjust* → Leaf 10.  

  ---

  Print this as a one-page handout. Participants answer nodes without prior labels, then self-classify via leaves. Paths (e.g., "1A→2B→4C") let groups compare views neutrally.
