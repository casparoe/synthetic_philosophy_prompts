  First, I need to honor Ray's actual beliefs: no "long run" consolations, since he rejected that. The floor rule is central - surviving below a minimum state. But it must acknowledge the unresolved tension between his two floors (bankroll and marriage). 

  For structure: Beat 1 should establish Ray's secret career lightly. "Logistics" wink for quants, "numbers game" as safe metaphor for family. Important to frame it as service to friends early. 

  Beat 2 introduces Kelly via "half measures" - quant crowd gets the reference, family hears caution. Must avoid making it sound like reckless gambling. "Protecting the table" bridges both worlds. 

  Beat 3 is the core floor rule explanation. "Floor beneath your feet" makes it visceral, "distance above" mirrors his growth focus. Crucial to say "survive first" plainly. 

  Beat 4 tackles the unsolved conflict. "Two floors that can't trade" is the key tension. Syndicate/marriage comparison must land as affectionate truth, not criticism. "Which one he got right" implies wisdom through understatement. 

  Beat 5 as toast line needs universal lift. "Raise what's left" works literally for glasses, metaphorically for legacy. "Good odds" nods to quants without math. 

  Metaphor checks: "Numbers game" is literal enough for non-gamblers. "Protect the table" avoids casino imagery. "Floor" physical, not financial. Final "odds" is subtle. 

  Biggest challenge: making quant rigor feel loving. Solution is in Beat 4's framing - his prioritization becomes proof of character. The unresolved theory mirrors human limitations.
answer: |-
  Here are your five beats:

  1.  For thirty years, Ray ran a quiet numbers game out of a strip mall, telling his dear mother he was in logistics. He provided a service to his friends, built something real, and kept the math mostly to himself – a genuine, careful man doing careful work.
  2.  Ray understood something profound: betting half of what the cold math said was smart, protecting the table not just from bad luck, but from his own doubt. It wasn't about wild wins; it was about making sure there was always a tomorrow to play.
  3.  In this last year, he kept talking about his "floor rule": you name the state beneath which you simply will not fall, and then you fight like hell *not* for endless growth, but to grow the distance above that floor. Survival first, then growth – that was his bedrock.
  4.  The rule shines bright when you have one floor to protect. Ray had two: the syndicate's bankroll, and Joan’s trust. The math gets quiet when floors can't be traded. He knows which floor he kept rock-solid, which distance he grew without fail – and that’s the truest measure.
  5.  So, to Ray: a man who knew the value of a floor, the wisdom of half measures, and the irreplaceable worth of what’s already in the safe. May we all play the long game with such clear eyes and steady hands. Raise your glasses – to Ray, who always gave us good odds.
