  ### Analysis of the Claim: "In applications there is always a rule"

  The table below evaluates seven to nine readings of the claim "in applications there is always a rule," ordered from the most deflationary (minimal impact on the Banach-Tarski objection) to the most ambitious (strongest defense against the objection). Each reading is assessed for its kind, status, ability to deliver the conclusion (that the Banach-Tarski objection lacks empirical force), load-bearing gap (additional premise needed), and nearest true neighbor (if the reading is false).

  #### Key to Columns:
  - **Reading**: A precise, one-sentence thesis that can be asserted or denied.
  - **Kind**: Categorization of the reading (purely set-theoretic, about mathematical practice, about definability, epistemic, about the physical world).
  - **Status**: Evaluation of the reading (trivial, false, substantive and defensible, substantive and doubtful).
  - **Delivers the conclusion**: Does this reading support the speaker's conclusion that Banach-Tarski has no empirical bite? (yes, in part, no).
  - **Load-bearing gap**: The unstated premise needed for the reading to yield the conclusion, or "none" if it directly does so.
  - **Nearest true neighbor**: If status is "false," the closest true claim; otherwise "—".

  #### Table of Readings

  | Reading | Kind | Status | Delivers the conclusion | Load-bearing gap | Nearest true neighbor |
  |---------|------|--------|--------------------------|-------------------|------------------------|
  | For finite families of sets, ZF (Zermelo-Fraenkel set theory) proves the existence of a choice function, so the shoe-sock analogy only addresses trivial cases and does not engage with the infinite sets in Banach-Tarski. | purely set-theoretic | trivial | no | That infinite families behave like finite ones in applications. | — |
  | The mathematics used in applied contexts (e.g., physics) relies solely on weaker axioms like countable choice or dependent choice, not full AC (axiom of choice), and Banach-Tarski requires full AC, so it cannot arise in applied settings. | about mathematical practice | substantive and defensible | in part | That Banach-Tarski is the only objectionable consequence of AC and that weaker axioms avoid all paradoxes. | — |
  | AC is conservative over ZF for arithmetical statements (statements about natural numbers), and since empirical measurements reduce to arithmetical statements, AC cannot affect observable predictions, leaving Banach-Tarski empirically inert. | purely set-theoretic | substantive and defensible | yes | That all physical consequences of AC must be expressed as arithmetical statements. | — |
