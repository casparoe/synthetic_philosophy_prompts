  ...Double-checking that the builder's motivation is purely epistemological. No partisan sneaking, just pure "what if someone actually follows Chesterton?" That keeps it philosophical. 

  Perfect. This should survive a room full of Burke scholars without patronizing them.
answer: |-
  **"So I found this fence blocking my shortcut last Tuesday. Spent all week researching local zoning laws and historical land disputes. Finally tracked down the builder yesterday, who admitted: 'Oh, that? I just wanted to see if anyone would actually *do* the Chesterton thing before knocking it down.' So now I'm stuck with this useless fence... and apparently, Burke thinks the fact that I've spent a week assuming it *must* have wisdom means it's already earned the right to stay."**

  This presses on the loop in Chesterton's norm (the fence's only purpose *is* the investigation it demands) and subtly critiques Burke by showing how easily *perceived* age (even a week of mistaken belief in tradition) can trigger prescriptive reverence for something demonstrably arbitrary.
