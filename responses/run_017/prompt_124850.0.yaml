answer: |-
  ## Goodhart's Shadow

  We counted dollars per life saved.
  The spreadsheets bloomed with tidy proof.
  Each cost-effectiveness was weighed.
  We steered the capital for truth.

  The spreadsheets bloomed with tidy proof.
  What couldn't be quantified fled.
  We steered the capital for truth
  to brighter metrics overhead.

  What couldn't be quantified fled.
  The evidence grew thin and pale.
  To brighter metrics overhead
  we sailed, beyond the shadowed vale.

  The evidence grew thin and pale
  for things that held no metric score.
  We sailed, beyond the shadowed vale,
  from quiet shores we prized before.

  For things that held no metric score
  (that patient talk, that shared, slow year),
  from quiet shores we prized before,
  the current drew us, sharp and clear.

  That patient talk, that shared, slow year...
  Each cost-effectiveness was weighed.
  The current drew us, sharp and clear.
  We counted dollars per life saved.
