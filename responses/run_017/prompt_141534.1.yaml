answer: |-
  Your diagnosis of the impasse in the Special Composition Question (SCQ) debate is perceptive and largely survives contact with the arguments. The core disagreement isn't primarily about *when composition occurs* but about **metaontological commitments** – what counts as legitimate data, which theoretical virtues are paramount, and what ontology *is for*. Here's a breakdown:

  ### 1. **Your Hypothesis Validated: The Metaontological Clash**
      *   **Universalism (Unrestricted Composition):** Treats the *logical coherence* and *expressive completeness* of our quantificational apparatus as paramount. Its "data" is the avoidance of brute restrictions or exceptions in formal ontology. Ordinary objects are vindicated *as a subset* of the vast ontology, but their privileged status isn't the *driver*; ideological parsimony (one simple rule) is. The cost (too many objects) is dismissed because "existence" is cheap and doesn't imply *significance* (Lewis, Sider).
      *   **Nihilism (Composition Never Occurs):** Prioritizes *ideological and ontological parsimony* above all. The "cost" (denying tables) is reframed as *correcting* a pervasive folk error. Ordinary object-talk is treated as useful fiction or loose talk about arrangements of simples, not data requiring ontological vindication (Dorsey, Unger). Scientific talk is often reinterpreted (fundamental physics deals only with simples/fields).
      *   **Moderate Views (e.g., Life, Contact):** Attempt to *vindicate ordinary and scientific object-talk* as roughly accurate ontological data. Their core commitment is to *save the appearances* of our core ontological commitments. The "arbitrariness" charge bites because they struggle to find a *principled, non-ad-hoc* boundary satisfying this data without collapsing into universalism or nihilism. The cost is accepting a seemingly brute or complex restriction (van Inwagen, Korman).
      *   **Brutalism:** Explicitly rejects *explanation* for composition facts. Its data is simply the *truth* of our specific compositional claims (some things compose, others don't). The virtue is avoiding the perceived failures of principled answers. The cost (lack of explanation) is swallowed because explanation is deemed impossible or inappropriate here (Merricks).
      *   **Explanatory Views (e.g., Pragmatic, Cognitive):** Shift the question: "Why do *we* quantify over the things we do?" (Bennett, Hawley). Data comes from cognitive science, pragmatics, and the functional role of objectification. Composition facts are grounded in our interests, capacities, or practices. The cost is potential anthropocentrism or relativism about ontology.

      **Your Hypothesis Holds:** The same argument *is* treated differently because the sides assign different weights to different goals:
      *   *Denying Tables?* Nihilist: A necessary correction. Universalist: A non-issue (tables exist!). Moderate: A devastating refutation. Explanatoryist: A mistake about the *basis* of table-talk.
      *   *Arbitrary Boundary?* Moderate: A serious cost. Universalist/Nihilist: Proof that *any* boundary is arbitrary/illusory. Brutalist: Irrelevant (no explanation needed). Explanatoryist: Expected (boundaries track our interests).
      *   *Explanatory Bruteness?* Brutalist: Acceptable. Others: A major cost showing the view's inadequacy.

  ### 2. **Compositional Quietism: A Genuinely Distinct Option?**
      Your colleague's "compositional quietism" **is a distinct metaontological position**, situated beyond the standard first-order answers. It combines:
      *   **Ontological Anti-Realism about Composition:** There is *no fact of the matter* about when composition occurs independently of our conceptual schemes/purposes.
      *   **Pragmatic Constraint on Quantification:** Quantification must serve *some purpose* (explanatory, practical, communicative). "Arbitrary fusions" fail this test fundamentally – they are not just *idle* (like Boltzmann Brains might be), but *incoherent candidates* for quantification within *any* viable purpose-driven scheme. Quantifying over them serves *no conceivable* function.
      *   **Rejection of Conventionalism:** It's not that conventions *could* stipulate arbitrary fusions into "existence" but we choose not to; rather, the very idea of quantifying over them is *meaningless* or *pragmatically incoherent* within the practice of ontology. Conventions operate *within* the space of purpose-relative quantifications, but "arbitrary fusion" lies *outside* that space.

      **Why it's Distinct:**
      *   Contrasts with **Universalism:** Rejects the *intelligibility* of the universalist's ontology, not just its utility. Universalism *affirms* a fact of the matter (always yes).
      *   Contrasts with **Nihilism:** Rejects the *intelligibility* of a fact of the matter (always no). Allows tables *for certain purposes*.
      *   Contrasts with **Brutalism:** Denies there *are* brute composition facts to be cataloged.
      *   Contrasts with **Explanatory Views:** While sharing the pragmatic focus, it denies there is *any underlying fact* (even about our practices/interests) that *makes* composition occur. It's purely about *what it's useful to quantify over*, with a strong constraint ruling out "useless" quantifications as non-starters.
      *   Contrasts with **Verbal Disputes (Hirsch):** It's not *just* about word meanings; it's about the necessary conditions for quantification to be coherently practiced at all. The constraint is deeper than linguistic convention.

      It's a form of **ontological pragmatism** or **conceptual role semantics for quantification** with a built-in filter against vacuity. Its distinctness lies in its *strong modal claim* about the impossibility of purpose-serving quantification over arbitrary fusions, coupled with anti-realism about composition facts.

  ### 3. **Diagnosis of the Impasse: Beyond Verbal Disputes**
      The impasse is **fundamentally metaontological**. It's not *merely* verbal (though quantifier variance plays a role - Hirsch), nor primarily about vagueness or quantifier restriction within a shared framework. It's a clash about:
      *   **The Goal of Ontology:** Is it to describe the fundamental structure of reality (Nihilism, Brutalism, some Universalism)? To systematize and vindicate our manifest image (Moderates)? To explain our representational practices (Explanatoryists)? To map conceptual possibilities (some Universalism)?
      *   **The Data:** Are intuitions about ordinary objects sacrosanct? Is parsimony king? Is scientific ontology authoritative? Is logical consistency sufficient? Is explanatory power key?
      *   **Theoretical Virtues:** When virtues conflict (simplicity vs. saving the appearances, explanatory depth vs. ideological parsimony), which trumps?
      *   **The Status of Quantification:** Is it a transparent window on being (Quinean realism)? Or a tool inextricably linked to human cognition and purpose (Pragmatists, Quietists)?

      **Vagueness and Quantifier Restriction are Symptoms:** Debates about whether composition is vague or whether quantifiers are contextually restricted arise *within* frameworks committed to there *being* facts of the matter (e.g., Moderates trying to save appearances). They aren't the *source* of the impasse; they are attempts to resolve tensions *within* a contested metaontological framework. The quietist would see these debates as misdirected, assuming facts where there are none.

  ### 4. **What Would Count as Progress?**
      Given the metaontological nature of the impasse, progress is unlikely from refining first-order mereological principles or rehashing intuitions about statues/lumps. Meaningful progress might look like:

      1.  **Metaontological Clarification & Justification:** Explicitly arguing *for* a specific metaontology (e.g., why should ontology save the appearances? Why is parsimony decisive? Why is explanation grounding necessary?). Defending the *criteria* themselves, not just their application to composition. (This is happening slowly, e.g., Bennett on construction, debates over naturalness).
      2.  **Formal Results Constraining Metaontology:** Developing frameworks that rigorously link ontological commitment to purpose, cognition, or explanation. Showing that certain metaontological commitments lead to formal incoherence or unavoidable paradox under plausible assumptions. (Work in formal pragmatics, logical expressivism, or integrating mereology with decision/game theory might hint at this).
      3.  **Empirical Findings on Object Representation:** Cognitive science revealing how humans and other animals parse the world into "objects," the computational costs/benefits, the developmental trajectory, and neural correlates. This could:
          *   Support explanatory views by grounding "purpose" or "interest" in our cognitive architecture.
          *   Challenge universalism/nihilism by showing objectification is fundamental and constrained, not arbitrary or eliminable.
          *   Inform the quietist's constraint on "purpose" by revealing what quantifications are cognitively feasible or functional.
          *   Show if "object" is a natural cognitive kind with specific, non-arbitrary boundaries.
      4.  **A Change of Question:** Abandoning the SCQ *as traditionally understood* (seeking necessary and sufficient conditions for composition simpliciter) in favor of:
          *   "Under what conditions is it *useful* or *rational* for agents like us to quantify over composite Xs for purpose Y?" (Explicitly pragmatic).
          *   "How do our cognitive systems implement 'object' representations, and what environmental structures do they latch onto?" (Naturalized metaontology).
          *   "What are the minimal structural constraints on any viable ontology?" (Shift to fundamentality or structure, bypassing composition).

  **Conclusion:** Your hypothesis is robust. The SCQ debate is stalemated because it rests on incompatible, often implicit, metaontological foundations concerning the aims, data, and virtues of ontology itself. Progress requires moving the debate *up* to this meta-level, integrating empirical insights about cognition, or fundamentally reframing the question away from seeking mind-independent composition facts. Your colleague's compositional quietism is a genuinely distinct metaontological option, offering a pragmatic anti-realism with a strong constraint against vacuous quantification, representing a viable, though controversial, path beyond the impasse. Expecting traditional arguments to convert opponents is indeed futile; the disagreement runs deeper than the surface question of "when things compose."
