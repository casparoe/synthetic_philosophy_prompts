prompt: |-
  Dear colleague,

  I am finishing a short methods chapter for a monograph on famine and epidemic in the nineteenth century, and before I commit myself to a position I want a specification rather than another round of case studies. What I need from you is the list of requirements that any account of non-human agency in history would have to meet in order to be usable by me: by a historian who has to decide, sentence by sentence, whether to write that a pathogen, a drought, or an eruption caused something, enabled something, or acted. Please keep the purpose fixed at that. I do not want a theory good enough for a climate modeller, or one good enough for a court assigning responsibility, or one good enough for a metaphysician's seminar; I want one that disciplines causal prose in narrative history when the evidence I actually have is a broken run of harvest returns, parish burial series, and administrative correspondence that was written by people with their own reasons for blaming the weather.

  My half-formed idea, which I would like you either to turn into criteria or to dissolve if it does not survive being made precise, is that the debate keeps stalling because people are using one word for three different grades of causal involvement. The lowest grade is a difference-maker relative to a contrast: the blight was present and the harvest failed, it was absent in a comparison case and the harvest did not, and nothing in the vicinity screens the two off. The middle grade is a condition that sets the range within which human agents choose, shaping which options are thinkable and how expensive each one is, without itself selecting among them. The top grade, the one people fight about, is something like actorhood, and my guess is that what distinguishes it is not the size of the causal contribution but a second-order structure: human agents orient their plans around the thing, take countermeasures against it, and it responds to those countermeasures in a way that is not simply a function of what they did, so that the counterfactual history has to be written as a sequence of moves and answers rather than as a single inserted cause. If that is right, then a volcano that nobody could have anticipated or prepared for is a very large cause and a very poor actor, while a cholera outbreak that a city met with quarantines, denials, and riots is a smaller cause and a much better candidate for actorhood, and the interesting cases are the ones where the two come apart.

  Turn that into a requirements list, if it deserves to survive. The first requirement I would want you to test is contrast-sensitivity: whether any claim that a non-human thing acted has to be indexed to a contrast class, and what happens to the standard examples when we shift the contrast from the event versus nothing to the event versus the event as it would have gone under a different policy. The second is baseline discipline: the account must force me to state the background or endemic rate of the thing being invoked, so that I do not quietly credit the microbe with mortality that a population's nutritional state, housing, or season of the year had already made close to inevitable; the test case I have in mind is a famine where a blight arrives into an export economy that keeps shipping food, and I want to know whether any theory that cannot separate the blight's contribution from the policy's contribution is disqualified outright. The third is a channel requirement: the path from an eruption or a bacillus to a historical outcome always runs through institutions that record, ration, quarantine, or fail to, and I want a criterion for when the institution rather than the pathogen is the thing that should bear the agent's grammatical role. The fourth is grain matching: the temporal and spatial grain of the cause has to be answerable to the grain of the thing explained, so that a multidecadal cooling trend cannot be wheeled in to explain one bad harvest unless someone supplies the transmission story, and a single eruption cannot be wheeled in to explain a half century of state formation. The fifth is what you might call the archive effect: some non-human causes destroy, preserve, or generate the very sources a historian later uses, and any account should be required to say how much of the apparent causal prominence of such a cause is an artefact of what survived; a city buried in ash looks like a case of a volcano acting, partly because the ash also fixed the record in a way that ordinary years did not. The sixth is the one I care about most and trust least: a non-exculpation condition, requiring the theory to tell me when invoking a pathogen or a drought is warranted and when it is ideology that relieves human agents of the alternatives they actually had, ideally by asking whether any human counterfactual survives once the non-human cause is held fixed. The seventh is a symmetry check: whatever test is proposed should be run against a human corporate agent such as a treasury, a colonial administration, or an army, and I want to know which candidate tests return different verdicts for those cases and whether that is a defect or a feature. The eighth is an explanatory payoff condition: if calling something an actor lets me explain nothing that calling it a condition does not, then the vocabulary is doing rhetorical work only, and I want that stated as a requirement rather than left as a suspicion. The ninth is a question I cannot settle myself: whether actorhood should require that the intentional vocabulary be grounded in something real, since a pathogen has selection-driven dynamics that make some teleological talk defensible in a way that a volcano's does not, and if so whether that makes germs actors and volcanoes merely causes, or whether grounding is a prejudice of the scientifically minded camp.

  Alongside the list, please give me your view on three things. Which of these requirements are genuine desiderata and which are the preferences of a camp disguised as standards, including the possibility that my non-exculpation condition is just a political preference and that my channel requirement is just a humanist prejudice. Whether any subset of the requirements you accept is jointly unsatisfiable, since if the list itself turns out to be inconsistent that is the finding I would most rather have than a tidy set of criteria. And which single requirement does the most work in excluding the positions currently on offer; a sentence or two on that is enough, because I know the literature and will do the scoring myself, so please do not write me a scorecard or a bibliography, and do not cite anything or name specific authors and works, as I will fill all of that in from my own files.

  Finally, on form: write this as continuous prose, the way you would write a letter or an email, with no headings, no bullet points, no bold text, and no tables or lists of any kind, even where a table would be tempting. I would like roughly twelve hundred to fifteen hundred words, and I would rather have the reasoning behind each requirement and the case that motivates it than a long inventory of requirements I cannot adjudicate.
reasoning: |-
  Okay, let me approach this query methodically. The user is a historian working on famine and epidemic in the nineteenth century, seeking a practical framework for attributing agency to non-human entities in historical narratives. Their core need is disciplinary guidance for causal prose when dealing with fragmented evidence like harvest records and administrative correspondence. 

  The historian presents a sophisticated half-formed theory about three grades of causal involvement - difference-maker, conditioning factor, and actorhood - and asks for it to be either refined into criteria or dissolved if untenable. They specifically request nine potential requirements covering contrast sensitivity, baseline discipline, channel analysis, grain matching, archive effects, non-exculpation, symmetry checks, explanatory payoff, and teleological grounding.

  I consider how to translate their theoretical sketch into operational criteria while respecting their practical constraints. The key is maintaining historian's workflow integrity - this isn't about metaphysics or climate science but about sentence-level decisions in narrative construction. Their examples (cholera responses vs unexpected volcanoes) suggest agency emerges from relational dynamics rather than intrinsic properties.

  For the requirements assessment: Contrast sensitivity seems fundamental for causal claims in history. Baseline discipline addresses their concern about conflating background conditions with specific triggers. The channel requirement rightly focuses mediation through human institutions - a crucial filter for historical agency attribution. Grain matching prevents temporal scale errors common in environmental history. Archive effect acknowledges evidentiary distortions - volcanic ash both destroys and preserves. Non-exculpation is ethically necessary but requires careful handling to avoid becoming ideological litmus test. Symmetry check against corporate actors could reveal if criteria are truly about agency rather than anthropocentrism. Explanatory payoff ensures conceptual usefulness. Teleological grounding may be the trickiest - perhaps best treated as spectrum from selection-driven pathogens to geophysical events.

  The historian's self-awareness about potential biases (non-exculpation as political preference, channel requirement as humanist prejudice) is admirable. In response, I should acknowledge these tensions without resolving them dogmatically. Their concern about joint unsatisfiability is particularly acute - perhaps between strict actorhood criteria and practical narrative needs.

  The most discriminating requirement might be the second-order structure of mutual responsiveness (their actorhood definition), as it excludes most simplistic causal claims while accommodating complex human-nonhuman interactions. This directly addresses their cholera quarantine example versus unexpected volcano scenario.

  Throughout the response, I will maintain their requested prose format - continuous, letter-like, avoiding academic scaffolding. The tone should match their rigorous but pragmatic stance, focusing on usable guidance rather than theoretical perfection. Word count target (1200-1500) means being concise but sufficiently detailed on each requirement's rationale and test cases.
answer: |-
  Your request cuts to the heart of the historian's practical struggle with causation, especially when non-human entities crowd the narrative. Let’s dissect your half-formed idea and craft it into a set of operational requirements, testing each against the realities of archival fragments and the need to write clear, responsible prose. The goal isn’t metaphysical purity, but prose discipline grounded in what we *can* know from parish registers, harvest tallies, and officials passing blame.

  **Refining Your Tripartite Idea:**
  Your intuition about grades of involvement holds significant merit. The core confusion often *does* stem from conflating:
  1.  **Difference-Maker:** X was present when Y happened, absent (or different) in relevant comparisons, and not screened off by confounding factors (e.g., blight present/fail vs. absent/success, controlling for soil/weather).
  2.  **Conditioning Factor:** X sets boundaries, costs, and possibilities for human action without dictating specific choices (e.g., drought raising grain prices, making certain policy options prohibitively expensive or logistically impossible, but not determining *which* policy was chosen).
  3.  **Actor (in a historical narrative sense):** Humans perceive X as an antagonist/force *requiring response*, plan and execute countermeasures *specifically against it*, and X’s subsequent behaviour *isn’t wholly predictable* as a simple physical effect of those countermeasures, generating a dynamic, sequential interaction (e.g., cholera met with quarantine -> evasion/riots -> changed transmission patterns -> revised quarantine rules).

  The key insight here is that historical "actorhood" isn't primarily about the *size* of the causal contribution, nor inherent properties of the non-human thing, but about the *structure of the interaction* as discernible in the human record and the narrative demands it creates. A volcano burying Pompeii is a colossal difference-maker and conditioner, but a poor *actor* in this narrative sense because there was no meaningful sequence of human countermeasure and volcanic "response." Cholera, interacting dynamically with public health measures and social panic, fits the actor role better, even if its absolute mortality contribution was smaller than the volcano's.

  **Requirements List for Usable Non-Human Agency in Historical Prose:**
  Forged from your ideas and the practicalities of writing history, here are the requirements any account must meet to guide your sentence-by-sentence decisions:

  1.  **Contrast-Sensitivity Requirement:** Any causal claim (difference-maker, condition, actor) involving a non-human entity *must* explicitly or implicitly specify the relevant contrast class. Claiming "the blight caused the famine" is meaningless without stating "compared to what?" (e.g., compared to a year without blight? Compared to the same blight under different market policies?). Crucially, shifting the contrast (e.g., "famine under blight vs. famine under blight *with* grain export bans lifted") reveals whether the blight is the primary difference-maker or whether policy is the crucial variable against *that specific backdrop*. This forces precision about *what* the entity is actually responsible for changing.

  2.  **Baseline Discipline Requirement:** Invoking a non-human cause (pathogen, drought) *requires* establishing the endemic background or pre-existing vulnerability against which it operated. Did the pathogen kill people who were already severely malnourished and living in conditions where endemic disease mortality was high? Did the drought hit a region with fragile soils and minimal grain reserves versus one with robust irrigation? Only by knowing the baseline can you assess the *marginal contribution* of the specific non-human event and avoid silently attributing background mortality or vulnerability to the acute trigger. Your famine/blight/export case is the litmus test: a theory failing here cannot disentangle the blight's impact from the policy's lethal effect and is unusable.

  3.  **Channel Requirement (Mediation Imperative):** The path from any non-human cause (eruption, bacillus, drought) to a historical outcome *always* runs through human institutions, practices, and decisions (recording, rationing, quarantine, relief, exploitation, denial). The criterion for whether the institution or the pathogen "acts" grammatically hinges on the *locus of decisive variation* in the causal chain. If institutional failure (or success) is the primary difference-maker relative to the contrast class (e.g., same pathogen, different quarantine efficacy leading to vastly different mortality), then the institution warrants the agentive role ("Poor Law administration failed to prevent starvation," even if triggered by blight). The non-human entity acts grammatically only when the narrative focus is on its direct, unmediated impact *despite* institutions, or its dynamic interaction *with* them.

  4.  **Grain-Matching Requirement:** The temporal and spatial scale of the cause invoked *must* plausibly align with the scale of the effect explained, *and* a transmission mechanism must be articulated. A multi-decadal cooling trend cannot "cause" a single bad harvest without specifying the anomalous weather *within* that trend that directly impacted *that specific* growing season. Conversely, a single eruption cannot "cause" a half-century of state formation without demonstrating how the *specific consequences* of that eruption (e.g., demographic collapse, resource shift, legitimization crisis) initiated and sustained a unique, necessary chain of institutional developments over decades. Avoid the "deus ex machina" of scale.

  5.  **Archive Effect Requirement:** Any account *must* assess how the non-human cause itself shaped the surviving historical record. Did the volcano preserve a city in ash, making its destruction uniquely visible while obscuring the complexities of other settlements? Did the famine destroy administrative records or generate a specific, blame-shifting genre of correspondence? Did an epidemic disproportionately kill record-keepers? Apparent causal prominence can be an artifact of selective survival. The theory must force you to ask: "Is this thing prominent in the narrative because it was disproportionately impactful, or because it disproportionately shaped *what evidence I have* about impact?"

  6.  **Non-Exculpation Condition (with Caution):** Invoking a non-human cause is unwarranted if it *solely* serves to absolve human agents of responsibility for choices they demonstrably had, even under duress. The test is: "Holding the non-human cause fixed (e.g., the blight *is* present, the drought *is* severe), were there genuine, identifiable alternative courses of action available to relevant human actors *that would likely have resulted in a significantly better outcome*?" If yes, and those alternatives were known or reasonably knowable, then crediting the non-human entity with "causing" the *worst* outcome is misleading; the human choice (or systemic failure) to *not* take the alternative is the crucial difference-maker. However, this *cannot* be a requirement to *always* find human blame, only to *test* if the non-human invocation obscures real, documented human alternatives under the actual circumstances. It guards against ideology masquerading as causation.

  7.  **Symmetry Check Requirement:** Any proposed criterion for non-human agency must be applied equally to human corporate agents (treasuries, colonial administrations, armies). Does the criterion clearly distinguish between a cholera outbreak dynamically interacting with quarantine policies (non-human "actor") and the Treasury imposing austerity measures that dynamically interact with local resistance and economic feedback loops (human corporate "actor")? If the criterion yields different verdicts *only* because one is human-organized and the other isn't, despite similar structures of interaction and impact, that is likely a defect revealing anthropocentric bias. If it distinguishes based on the *structure* of interaction (e.g., intentionality, institutional complexity), that might be a defensible feature. This exposes hidden assumptions.

  8.  **Explanatory Payoff Condition:** Attributing "actor" status to a non-human entity must yield explanatory gains unavailable by treating it solely as a difference-maker or conditioning factor. Does framing the pathogen as an "actor" in a dynamic struggle with public health measures allow you to explain the *sequence*, the *contingency*, or the *specific morphology* of the epidemic and societal response in a way that simply calling it a "cause" of mortality does not? If the "actor" language adds only rhetorical force or anthropomorphic vividness without new explanatory insight, it is suspect and potentially misleading. The vocabulary must earn its keep analytically.

  9.  **Teleological Grounding Question (Clarification, Not Requirement):** This is less a requirement for use and more a clarification of stakes. The defensibility of intentional-sounding language ("the pathogen evaded quarantine") hinges on whether the system exhibits goal-directed *dynamics* through feedback loops (like natural selection for virulence/transmissibility). Pathogens have this (selection operates *as if* aiming for fitness); volcanoes generally do not (their "behaviour" is physical determinism). This *suggests* germs are better candidates for a *certain kind* of agential metaphor than volcanoes. However, your core "actor" criterion (dynamic interaction sequence) doesn't *strictly* require this teleological grounding. A complex physical system (like climate patterns interacting iteratively with agricultural adaptation) *could*, in theory, fit the narrative actor role without selection. The requirement is to *be aware* of this distinction: using intentional language for purely physical systems is a stronger, potentially misleading metaphor requiring greater justification, whereas for systems with selection or complex feedback, it might be a less problematic shorthand for observable dynamics.

  **Assessment of Your Queries:**

  1.  **Genuine Desiderata vs. Disguised Preferences:** Most requirements are genuine tools for disciplined causal inference in history: **Contrast-Sensitivity, Baseline Discipline, Channel Requirement, Grain-Matching, Archive Effect, Explanatory Payoff** are fundamental to avoiding spurious attribution and anachronism, grounded in historical method and evidence critique. The **Symmetry Check** is crucial for exposing bias. The **Non-Exculpation Condition**, however, treads closer to the line. While vital for countering deterministic narratives that erase human choice, its *strict* application *could* reflect a prior commitment to human accountability. Its validity hinges on it being a *test* (did alternatives exist?) not a *presumption* (humans *must* be to blame). It's a necessary guardrail against fatalism, but its application requires careful historical contextualization of *actual* options, not wishful thinking. The **Channel Requirement** isn't inherently humanist prejudice; it's a recognition of historical reality – non-human forces impact humans *through* social structures. Ignoring this mediation *is* bad history.
  2.  **Joint Unsatisfiability?** The most likely tension lies between the **Explanatory Payoff Condition** (demanding actor-language adds unique insight) and a very stringent interpretation of **Teleological Grounding** (demanding selection-like dynamics for any agential language). If you demand *both* that actor-language explains unique dynamic sequences *and* that only selection-driven entities qualify, you might exclude complex physical systems (e.g., climate patterns) that *do* interact dynamically with society in ways demanding a sequential narrative, even without "goals." The **Non-Exculpation Condition** might *feel* unsatisfiable with strong structural determinism, but its purpose is precisely to probe whether such determinism is justified by the evidence of *available* alternatives in the specific case. The core set (**1-5, 7, 8**) is generally coherent and mutually supportive for practical narrative history.
  3.  **Most Discriminating Requirement:** The **second-order structure of dynamic interaction** (your core "actor" definition: humans target countermeasures -> non-human "response" not wholly predictable -> sequence of moves) is likely the most powerful discriminator. It immediately excludes vast swathes of causal claims where the non-human entity is a one-time trigger (volcano) or static condition (soil type), forcing a focus on the *iterative interplay* documented (or inferable) in the sources. It directly addresses the cholera/quarantine vs. unexpected volcano distinction you raised and excludes theories that grant actorhood based solely on size of impact, inherent properties, or anthropomorphic projection without evidence of this dialectic. It forces the narrative to follow the evidence of action and (perceived) reaction.

  **In Conclusion:**

  Your intuition about grades of involvement provides a robust foundation. The requirements list derived aims to discipline your prose by constantly tethering causal claims to evidence, context, scale, mediation, and narrative utility. Focus relentlessly on: **What is this being contrasted with? What was the baseline? How did it *actually* flow through human actions and systems? Does the scale make sense? Is the record lying by survival? Am I accidentally letting someone off the hook by invoking this? Would I describe a treasury the same way? Does calling it an 'actor' actually help me explain the *how*?** 

  The dynamic interaction criterion for "actorhood" is your sharpest tool. Use it to dissect sequences in your sources. Be wary of the archive's tricks and the siren song of simple, monumental causes. Your evidence – the harvest failures, the burial spikes, the fraught correspondence blaming the weather – contains the traces of these complex entanglements. The requirements are your sieve to separate the actionable insights from the sediment of oversimplification and ideology. Commit to the position that best survives this sieve, sentence by careful sentence.
