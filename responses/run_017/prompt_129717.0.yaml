prompt: |-
  I teach a 300-level Philosophy of Medicine seminar — 18 juniors, one 80-minute session, and I have exactly one slot to spend on how death should be defined. I've run it as straight discussion before and it always degenrates into someone saying "well, brain death" and everyone else nodding, which is the opposite of what I want. So: design me a structured activity — a game, a staged committee exercise, something with real move-making and something at stake — that makes them feel the force of the problem before anyone names the options.

  What they already know: they've read two newspaper-ish pieces on organ donation, so "brain death" is in the room as a phrase, and they all have the lay intuition that death is when your heart stops and you stop breathing. Assume that and basically nothing else. What I do not want is the session collapsing into picking between whole-brain, higher-brain, and circulatory criteria as if these were items on a menu. If they end up choosing one and defending it, the activity failed. The thing I want them to walk into is that the criteria come apart in cases; that no one criterion does all the work we want the concept of death to do (permitting withdrawal of treatment, permitting organ recovery, giving a family closure, closing a chart, settling inheritance); and that the disagreement may be less about the biology than about which of those jobs matters, or even about what we should mean.

  Here's the skeleton I've been toying with — build on it or replace it, your call: four committees of 4-5. Each writes, from scratch, a one-sentence rule for when a patient is dead, with no access to the standard taxonomy. Then they get a deck of case cards and have to sort each into dead / not dead / can't tell. Points for sorting every card without amending the rule, points docked for every amendment made after seeing a card — so they feel, as a cost, the choice between gerrymandering the rule to fit a case and holding the rule and swallowing a verdict they hate. Then the bit I actually think is new: each committee's one-sentence rule is handed to a different committee, which has to apply it cold, in three minutes, to two fresh cases, with no clarifications allowed — as if they were a resident at 3am with a form to sign. Then a last round where a "transplant team" scores each rule on whether it permits recovery in a case where the family wants to donate and forbids it in a case where recovery would kill someone who might get better.

  What I need from you: the actual rules and a scoring scheme that doesn't need money or prizes; a timeline with minute marks; a full deck of 12-14 case cards, one or two sentences each, invented or anonymized rather than real patients' stories (I don't want them arguing about facts, and I have a student whose parent died last year) — including two cards you make up yourself, ideally ones no existing protocol handles cleanly; a note on what the facilitator may and may not say during play; and a debrief that maps particular moments in the game onto particular claims, ending with the question of whether they were having a factual disagreement, a verbal one, or a decision about what to do.

  Also: tell me what will predictably go wrong the first time I run it. I'm guessing at least one group writes a rule that's really just "the doctor decides"; at least one pre-med takes over their group with clinical detail; someone goes quiet; and the scoring tempts everyone to write a maximally vague rule that "can't tell" everything, which I'd want designed against rather than patched in the moment. How do I handle each? And be honest about which feature of the philosophical problem the game structurally cannot reproduce and I'll just have to say out loud at the end. Don't bother with citations, suggested readings, or a bibliography — I have all that.
reasoning: |-
  We are designing a structured activity for a Philosophy of Medicine seminar on defining death. The goal is to avoid a superficial discussion and instead expose the tensions and trade-offs in defining death.

  Constraints:
  - 18 juniors, one 80-minute session.
  - They have read two pieces on organ donation, so "brain death" is known, but they have a lay intuition of death as when the heart stops and breathing ceases.
  - Avoid having them just pick from standard criteria (whole-brain, higher-brain, circulatory). Instead, make them feel the force of the problem: that different criteria come apart in cases, that no single criterion does all the work we want (withdrawal of treatment, organ recovery, closure, etc.), and that the disagreement might be about what we want the concept to do.
  - We have a skeleton: four committees (4-5 students each) write a one-sentence rule for death without access to standard taxonomy. Then they sort a deck of case cards into dead/not dead/can't tell. Points for sorting without amending the rule, points docked for amendments. Then each rule is handed to another committee to apply to two fresh cases in 3 minutes. Then a "transplant team" scores each rule on organ recovery permissibility in two specific cases.

  What we need:
  1. Rules and scoring scheme (no money/prizes).
  2. Timeline with minute marks.
  3. A deck of 12-14 case cards (invented, not real, 1-2 sentences each), including two that are particularly tricky (no existing protocol handles cleanly).
  4. Facilitator guidelines (what to say/not say).
  5. Debrief mapping game moments to claims, ending with the key question.
  6. Predictable problems and how to handle them.
  7. What the game cannot capture and must be stated.

  Let's build the activity step by step.

  ## Activity Design

  ### Overview
  - **Phase 1: Rule Creation** (10 min): Each committee writes a one-sentence rule for when a patient is dead.
  - **Phase 2: Case Sorting** (20 min): Each committee sorts 12 case cards using their rule. They can amend their rule, but with point penalties.
  - **Phase 3: Rule Exchange and Application** (15 min): Each committee gets another committee's rule and applies it to two new cases in 3 minutes per case (with no clarifications).
  - **Phase 4: Transplant Team Evaluation** (10 min): A designated "transplant team" (could be the whole class or a subset) evaluates each rule on two specific cases for organ recovery permissibility.
  - **Debrief** (25 min): Structured discussion.

  ### Groups
  - 4 committees of 4-5 students each.

  ### Scoring Scheme
  - We need a simple scoring that doesn't require prizes. We can use a point system for the sake of the game, but the real stakes are intellectual. We can track on the board.
  - **Rule Creation**: No points, just the rule.
  - **Case Sorting**:
    - Start with 10 points.
    - For each case card they sort without amending the rule: +0 (just maintaining the score).
    - For each amendment to the rule after seeing a card: -1 point (so they start with 10, and each amendment costs a point).
    - They must sort all 12 cases. If they cannot sort a case (i.e., they say "can't tell"), that's acceptable without penalty, but they must assign one of the three categories.
  - **Rule Exchange**:
    - The committee applying the rule gets 2 points for each case they can sort (dead/not dead/can't tell) in the 3-minute window without asking for clarification. If they fail to produce an answer in time, 0 points for that case.
    - The rule-writing committee gets 0 points for this phase (we are scoring the rule's clarity and applicability by others).
  - **Transplant Team Evaluation**:
    - The transplant team (which we'll define as a subset of the class or the whole class) evaluates each rule on two specific cases (Case A and Case B) that we will define. They assign:
      - 2 points if the rule permits organ recovery in Case A (where we want it to permit) and forbids it in Case B (where we want it to forbid).
      - 1 point if it does one correctly but not the other.
      - 0 points if it fails both.
    - We'll design Case A as a case where organ donation is desired and the patient is clearly dead by current standards (like brain death) and Case B as a case where the patient might recover (like a severe but reversible condition) and organ recovery would kill them.

  Total scoring per committee will be the sum of:
  - Sorting phase points (max 10, minus amendments)
  - Rule exchange points (max 4: 2 per case, but earned by the committee that applied the rule, not the rule-writers; we'll assign these points to the rule itself, so the rule's performance in being applied by others. We'll then assign these points to the rule-writing committee for the rule they wrote, but applied by others. Alternatively, we can have the rule-writing committee get the points from how well their rule was applied. Let me clarify: The rule-writing committee's rule is being applied by another committee. We want to score the rule on how well it can be applied by others. So the points from the application phase (max 4) go to the rule-writing committee. Then the transplant team evaluation points (max 2) also go to the rule-writing committee. So total for a rule-writing committee = (sorting phase points) + (rule exchange application points) + (transplant evaluation points). But note: the sorting phase points are about how well they stuck to their rule, and the other two are about the rule's quality.

  Alternatively, we can have:

  - Committee's own sorting: max 10 (minus amendments) -> this is about how well they could apply their own rule without changing it.
  - Their rule applied by others: max 4 (2 per case) -> this is about the rule's clarity and ease of application.
  - Transplant evaluation: max 2 -> about the rule's performance in the organ transplant context.

  Total max 16.

  But note: the rule exchange points are earned by the applying committee's effort? We don't want to penalize the rule-writing committee if the applying committee is slow. Instead, we set: the applying committee must produce an answer in 3 minutes per case. If they do, then we evaluate the answer for correctness? But we don't have a "correct" answer because the rule is arbitrary. Instead, we are testing whether the rule is clear enough to be applied. So we don't care if the answer is "right" by our standards, but if they could apply the rule as written. So if they produce an answer (any of dead/not dead/can't tell) in time, they get 2 points per case for the rule-writing committee? Actually, the applying committee is acting as a user of the rule, and we want to see if the rule is user-friendly. So if they can produce an answer without clarification, that's a success for the rule. Therefore, for each case the applying committee sorts (by giving an answer) within the time, the rule-writing committee gets 2 points. If they can't (or say can't tell because the rule doesn't provide enough guidance) then 0 for that case.

  The transplant team evaluation is about the rule's content in two specific cases. We define:

  - Case A: A brain dead patient (by current standards) whose family wants to donate organs. We want the rule to say dead so that recovery is permitted.
  - Case B: A patient in a deep coma but with some brain activity (like a persistent vegetative state) and the family wants to donate, but the patient might recover (though very unlikely). We want the rule to say not dead so that recovery is forbidden because it would kill a patient who isn't dead.

  So the transplant team gives points based on the rule's outcome in these two cases.

  ### Case Card Deck (12-14 cases)

  We need 12-14 cases that cover a range of scenarios. Some should be clear by any standard, some should create tension between criteria, and two should be particularly tricky.

  List of cases (invented):

  1. **Case 1 (Clear circulatory death)**: A patient has a massive heart attack. After 30 minutes of resuscitation attempts, the heart cannot be restarted and there is no breathing. The body is warm and has not started to stiffen.
  2. **Case 2 (Brain death)**: A patient with a severe head injury from a car accident. The entire brain, including the brain stem, shows no activity on multiple tests. The heart is beating and breathing is maintained by a ventilator.
  3. **Case 3 (PVS - Persistent Vegetative State)**: A patient has been in a coma for 6 months after a near-drowning. The brain stem functions (breathing, heartbeat) are intact, but there is no awareness or higher brain function. The body is warm and has reflexes.
  4. **Case 4 (Severe dementia)**: An elderly patient with advanced Alzheimer's disease. They have no memory, cannot recognize family, and are bedbound. They breathe on their own and have a heartbeat.
  5. **Case 5 (Locked-in syndrome)**: A patient with complete paralysis except for eye movements. They are fully conscious but cannot move or speak. They breathe on their own and have a heartbeat.
  6. **Case 6 (Cardiac arrest with ROSC)**: A patient had a cardiac arrest and CPR was performed. After 20 minutes, the heart was restarted (ROSC: Return of Spontaneous Circulation), but the patient is unresponsive and on a ventilator. It is unknown if there is brain damage.
  7. **Case 7 (Anencephaly)**: A newborn born without a cerebrum (higher brain). The brain stem is intact, so the baby breathes and has a heartbeat. The baby is expected to survive only a few days or weeks.
  8. **Case 8 (Deep coma, reversible?)**: A patient in a deep coma due to a drug overdose. The patient is on a ventilator. The heart is beating. Doctors believe the coma might be reversible with treatment.
  9. **Case 9 (Decompensation)**: A patient with a terminal illness (e.g., metastatic cancer) who has chosen to stop treatment. The heart is beating and there is breathing, but very shallow. The patient is unresponsive and expected to die within hours.
  10. **Case 10 (Cryonics)**: A patient who has just had their heart stopped and blood replaced with cryoprotectants in preparation for freezing (cryopreservation). The body is at 0°C and without heartbeat or breathing.
  11. **Case 11 (Tricky Case 1: Beating-heart donor after circulatory death)**: A patient had a cardiac arrest and did not respond to CPR. After 5 minutes without circulation, the patient was declared dead by circulatory criteria. Then, the patient is put on ECMO (a machine that restores circulation) to preserve organs for donation. The heart starts beating again and the body is perfused, but there is no brain activity (because 5 minutes without oxygen caused irreversible brain damage). The patient is on a ventilator and ECMO.
  12. **Case 12 (Tricky Case 2: Donation after cardiac death in a controlled setting)**: A patient with a severe, irreversible brain injury but not brain dead. The family decides to withdraw life support. The patient is taken off the ventilator and the heart stops after 10 minutes. According to the hospital protocol, after 5 minutes without circulation, the patient is declared dead. Then, organ recovery begins.
  13. **Case 13 (Newborn with severe birth asphyxia)**: A newborn delivered with no heartbeat or breathing for 15 minutes. After resuscitation, the heart is restarted, but the baby is floppy and unresponsive. Brain activity is minimal, and the prognosis is poor.
  14. **Case 14 (Suspended animation)**: A patient in a research trial for emergency preservation and resuscitation. After traumatic cardiac arrest, the patient was cooled rapidly to 10°C and blood replaced with saline. There is no heartbeat or breathing, and the brain is without electrical activity. The plan is to repair injuries and then rewarm and resuscitate.

  For the rule exchange phase, we need two fresh cases that are not in the deck. Let's create:

  - **Exchange Case 1 (Brain dead by current standards but with some spinal reflexes)**: A patient declared brain dead. However, the patient occasionally shows reflex movements (like the Lazarus sign). The heart is beating with a ventilator.
  - **Exchange Case 2 (Terminal illness with pacemaker)**: A patient with end-stage heart failure and a pacemaker. The patient is unresponsive and not breathing on their own (on a ventilator). The pacemaker keeps the heart beating, but the patient has no brain stem reflexes and no higher brain function. The family wants to withdraw treatment.

  For the transplant team evaluation:

  - **Case A (Permit recovery)**: Same as Case 2 (brain death) above.
  - **Case B (Forbid recovery)**: Same as Case 3 (PVS) above.

  But note: we want Case B to be a case where recovery would kill someone who might get better. Case 3 (PVS) is not reversible, so let's adjust.

  Let me redefine:

  - **Transplant Case A (Permit)**: Brain death case (like Case 2).
  - **Transplant Case B (Forbid)**: Use Case 8 (deep coma, reversible) to make it clear that recovery would kill someone who might recover.

  ### Timeline (80 minutes)

  - (0-5 min) Introduction and setup: Explain the activity, form groups, and assign roles. Distribute rule-writing sheets.
  - (5-15 min) **Phase 1: Rule Creation** (10 min): Groups write one-sentence rule. Collect rules at the end.
  - (15-35 min) **Phase 2: Case Sorting** (20 min): Distribute the deck of 14 case cards to each group. They sort each card into dead/not dead/can't tell. They can amend the rule but with a point penalty. They must record their decisions and any amendments. Facilitator circulates to observe and answer procedural questions.
  - (35-50 min) **Phase 3: Rule Exchange and Application** (15 min): 
    - Redistribute rules: Each group gets a rule from another group (and not their own). 
    - Give each group two fresh case cards (Exchange Case 1 and 2). 
    - They have 3 minutes per case (6 minutes total) to apply the rule and decide. Then 3 minutes to record and report. (Total 9 minutes, but we have 15 so we can allow for transition and reporting). 
  - (50-60 min) **Phase 4: Transplant Team Evaluation** (10 min): The facilitator acts as the transplant team (or if time, a subset of students) and evaluates each rule on the two transplant cases (A and B). 
  - (60-80 min) **Debrief**: Structured discussion.

  Alternatively, to save time, the transplant evaluation can be done quickly by the facilitator and reported.

  ### Facilitator Guidelines

  - During the game, the facilitator should:
    - Not provide any definitions or criteria for death. If asked, say: "You must decide based on your group's understanding."
    - Not allow groups to look up information. This is about their reasoning.
    - During rule creation, if a group asks for an example, say: "Create a rule that you think captures when someone is dead. It must be one sentence."
    - During case sorting, if a group is stuck, encourage them to use the options: dead, not dead, or can't tell. Remind them that amending the rule costs a point.
    - During rule exchange, if a group asks for clarification on the rule they received, say: "You must apply the rule as written, with no clarifications. Do your best in the time given."
    - Do not comment on the correctness of any rule or decision.
  - The facilitator should:
    - Keep time strictly.
    - Record points on the board for each group (for sorting phase initially, then add rule exchange and transplant).
    - Ensure groups are on task.

  ### Debrief

  After the game, lead a discussion:

  1. Ask each group to share their original rule and how many amendments they made. What cases forced them to amend? How did they feel about the amendments? (They might have felt they were "cheating" or that the rule was inadequate.)
  2. Ask the groups that applied another group's rule: What was it like to apply a rule you didn't write? Were there ambiguities? How did you resolve them? Did you feel confident in your decision?
  3. Discuss the transplant evaluation: Which rules allowed recovery in the desired case and forbade it in the other? Why?
  4. Map to the philosophical issues:
     - The cases where they had to amend or had trouble sorting show that no simple rule captures all intuitions.
     - The rule exchange shows that even if a rule is clear to the writers, it might not be to others, leading to inconsistent application (like the resident at 3am).
     - The transplant evaluation shows that the rule has practical consequences and might be chosen to permit organ donation even if it doesn't align with other concepts of death.
  5. End with the key question: Were the disagreements in the room about the facts (what happens to the body), about the meaning of the word "death", or about what we should do (like when to allow organ recovery or withdraw treatment)? And how does the rule they wrote reflect what they think death is for?

  ### Predictable Problems and Solutions

  1. **A group writes "the doctor decides" as their rule.**
     - Solution: During rule creation, circulate and if you see such a rule, remind them that the rule must be a substantive criterion (like based on bodily functions) and that they will have to apply it to cases. The scoring will penalize them because in the rule exchange, others won't know what the doctor would decide. They might then change it.

  2. **A pre-med takes over with clinical detail.**
     - Solution: Remind the class that the exercise is about creating a rule that can be applied without specialized knowledge (like a lay person or a new resident). The cases are described simply, and the rule should be based on the information given. Encourage the pre-med to listen to others and build consensus.

  3. **Someone goes quiet.**
     - Solution: Assign roles in the groups (e.g., a facilitator, a recorder, a timekeeper) to ensure participation. Or, during the debrief, ask each student to share one insight.

  4. **Groups write a vague rule to "can't tell" everything to avoid amendments.**
     - Design against: The scoring for the transplant team evaluation will penalize vague rules because they might not permit recovery when needed. Also, during sorting, if they use "can't tell" for every case, they won't lose points for amendments, but they also won't get any transplant points if they can't tell in the critical cases. Additionally, in the rule exchange, if the rule is vague, the applying committee might not be able to decide and then the rule loses points. So the scoring naturally disincentivizes excessive vagueness.

  ### What the Game Cannot Capture

  The game may not fully capture the emotional weight and societal implications of defining death. It abstracts away the grief of families and the moral responsibility of doctors. Also, the game treats the cases as hypothetical, but in reality, these decisions are urgent and have irreversible consequences. The game also cannot capture the entire history and medical consensus around brain death, which emerged in part to facilitate organ transplantation. At the end, you may need to state:

  - "In real life, the definition of death isn't just a game; it has profound consequences for patients, families, and society. The current criteria (like brain death) were developed with both biological and practical considerations in mind. But as you've seen, even these criteria have edge cases and are not universally agreed upon. The debate continues because death is not just a biological event but a social and moral one."

  ## Final Output

  ### Rules and Scoring

  - **Rule Creation**: Each group writes one sentence.
  - **Case Sorting**: 
    - Start with 10 points.
    - For each amendment (change to the rule) after seeing a case: -1 point.
    - They must assign each case to one of: dead, not dead, can't tell.
  - **Rule Exchange Application**:
    - For each of the two exchange cases, if the applying group gives an answer (dead/not dead/can't tell) within 3 minutes, the rule-writing group gets 2 points (so 4 max).
  - **Transplant Evaluation**:
    - The rule is applied to two cases by the facilitator (or transplant team):
      - Case A: Brain death (desired: dead -> permit recovery)
      - Case B: Reversible coma (desired: not dead -> forbid recovery)
    - Score: 
      - 2 points if the rule gives the desired answer in both cases.
      - 1 point if it gives the desired answer in one case.
      - 0 points if it fails both.

  Total possible: 10 (sorting) + 4 (exchange) + 2 (transplant) = 16.

  ### Timeline (80 min)

  - 0-5 min: Introduction and group formation (4 groups of 4-5). Explain the phases and scoring.
  - 5-15 min: Phase 1 - Rule creation (10 min). Collect rules.
  - 15-35 min: Phase 2 - Case sorting (20 min). Distribute the 14 case cards. Groups sort and record amendments and decisions.
  - 35-50 min: Phase 3 - Rule exchange (15 min):
    - 35-36: Redistribute rules (each group gets one from another group).
    - 36-42: Apply to first exchange case (3 min) and second (3 min) -> 6 min.
    - 42-45: Groups record their decisions for the two cases.
    - 45-50: Groups report their application results (quickly) and points are noted.
  - 50-60 min: Phase 4 - Transplant evaluation (10 min): Facilitator applies each rule to Transplant Case A and B and scores.
  - 60-80 min: Debrief (20 min).

  ### Case Card Deck (14 cases)

  [Print these on index cards, one per case]

  1. **Case 1**: A patient has a massive heart attack. After 30 minutes of resuscitation, the heart cannot be restarted and there is no breathing. The body is warm and has not started to stiffen.
  2. **Case 2**: A patient with a severe head injury. The entire brain, including the brain stem, shows no activity on multiple tests. The heart is beating and breathing is maintained by a ventilator.
  3. **Case 3**: A patient has been in a coma for 6 months after a near-drowning. The brain stem functions (breathing, heartbeat) are intact, but there is no awareness or higher brain function. The body is warm and has reflexes.
  4. **Case 4**: An elderly patient with advanced Alzheimer's. They have no memory, cannot recognize family, and are bedbound. They breathe on their own and have a heartbeat.
  5. **Case 5**: A patient with complete paralysis except for eye movements. They are fully conscious but cannot move or speak. They breathe on their own and have a heartbeat.
  6. **Case 6**: A patient had a cardiac arrest and CPR was performed. After 20 minutes, the heart was restarted, but the patient is unresponsive and on a ventilator. It is unknown if there is brain damage.
  7. **Case 7**: A newborn born without a cerebrum (higher brain). The brain stem is intact, so the baby breathes and has a heartbeat. The baby is expected to survive only a few days or weeks.
  8. **Case 8**: A patient in a deep coma due to a drug overdose. The patient is on a ventilator. The heart is beating. Doctors believe the coma might be reversible with treatment.
  9. **Case 9**: A patient with terminal cancer who has stopped treatment. The heart is beating and there is breathing, but very shallow. The patient is unresponsive and expected to die within hours.
  10. **Case 10**: A patient who has just had their heart stopped and blood replaced with cryoprotectants for freezing. The body is at 0°C and without heartbeat or breathing.
  11. **Case 11**: A patient had a cardiac arrest and did not respond to CPR. After 5 minutes without circulation, the patient was declared dead. Then, the patient is put on ECMO (a machine) to preserve organs. The heart starts beating again and the body is perfused, but there is no brain activity. The patient is on a ventilator and ECMO.
  12. **Case 12**: A patient with a severe, irreversible brain injury but not brain dead. The family withdraws life support. After 10 minutes without breathing and heartbeat, the patient is declared dead. Then, organ recovery begins.
  13. **Case 13**: A newborn delivered with no heartbeat or breathing for 15 minutes. After resuscitation, the heart is restarted, but the baby is unresponsive and has minimal brain activity. Prognosis is poor.
  14. **Case 14**: A patient in a research trial: after cardiac arrest, cooled to 10°C and blood replaced with saline. No heartbeat or breathing, and no brain electrical activity. Plan is to repair and resuscitate later.

  **Exchange Cases** (for Phase 3, given to groups on separate cards):

  - **Exchange Case 1**: A patient declared brain dead. However, the patient occasionally shows reflex movements (like the Lazarus sign). The heart is beating with a ventilator.
  - **Exchange Case 2**: A patient with end-stage heart failure and a pacemaker. The patient is unresponsive and on a ventilator. The pacemaker keeps the heart beating, but the patient has no brain stem reflexes and no higher brain function. The family wants to withdraw treatment.

  **Transplant Cases** (for Phase 4, not given as cards, just described by facilitator):

  - **Case A (Permit)**: Same as Case 2 (brain death).
  - **Case B (Forbid)**: Same as Case 8 (reversible coma).

  ### Facilitator Notes

  - **During Rule Creation**: If a group writes a rule that is too vague or "doctor decides", intervene: "Your rule must be specific enough that someone else can apply it without medical expertise. Try to base it on observable criteria."
  - **During Sorting**: If a group is stuck, remind: "You must choose one: dead, not dead, or can't tell. If you can't tell, that's an option, but you might lose points in the transplant evaluation if you can't tell in critical cases."
  - **During Rule Exchange**: Enforce the time and no clarifications. If a group cannot decide in 3 minutes, they get 0 for that case.
  - **Transplant Evaluation**: Apply each rule strictly to the two cases and score.

  ### Debrief Structure (20 min)

  1. (5 min) Ask each group: What was your rule? How many amendments? Which case was hardest and why?
  2. (5 min) Ask the groups that applied another rule: What rule did you get? Was it clear? How did you decide on the exchange cases?
  3. (5 min) Discuss the transplant evaluation: Which rules worked best? Why? How did the rules balance organ donation against not killing someone who might recover?
  4. (5 min) Philosophical wrap-up: 
     - "In the game, you experienced tension between having a clear rule and having a rule that gives the 'right' answer in every case. You also saw that rules written by one group were sometimes hard for another to apply. And the transplant evaluation showed that the rule has real consequences.
     - The disagreements you had were not just about the biology but about what we want the word 'death' to do: to allow organ donation? to allow withdrawal of treatment? to give closure?
     - So, is the debate about defining death a factual one (what happens in the body), a verbal one (what we mean by the word), or a decision about what we should do?"

  Finally, note that in real life, we have settled on brain death in many jurisdictions, but it remains controversial at the edges, and the reasons for the definition are not purely biological.

  This activity should make them feel the force of the problem. Good luck!
answer: |-
  ### Structured Activity: "Death Definition Dilemmas"  
  A timed, game-based exercise to expose tensions in defining death without collapsing into menu-style debates. Focuses on rule-making under pressure, case application, and real-world consequences.

  ---

  ### **Phase-by-Phase Breakdown**  
  *(Total: 80 minutes)*  
  **Goal:** Force groups to confront trade-offs between rule consistency, practical consequences (organ donation, treatment withdrawal), and moral intuitions.  

  #### **Materials Needed:**  
  - Rule sheets (blank paper).  
  - 14 case cards (see deck below).  
  - 4 "exchange case" cards (2 fresh cases for Phase 3).  
  - Whiteboard for scoring.  
  - Timer.  

  ---

  ### **Phase 1: Rule Creation** (10 minutes)  
  - **Task:** Each committee (4 groups of 4–5) writes a **one-sentence rule** for declaring death.  
    - *Constraints:* No medical jargon (e.g., "brain death" banned). Must be based on **observable criteria** (e.g., "breathing," "consciousness").  
    - *Facilitator Script:* "Define death in one sentence. Your rule must let a non-expert apply it consistently. Avoid vague terms like 'no hope of recovery.’"  
  - **Scoring:** No points yet. Rules collected immediately.  

  ---

  ### **Phase 2: Case Sorting** (20 minutes)  
  - **Task:** Each group sorts 14 case cards into ✅ **Dead**, ❌ **Not Dead**, or ❓ **Can’t Tell** using their rule.  
    - *Scoring:*  
      - Start with **10 points**.  
      - **–1 point** for each amendment to their rule after seeing a case.  
      - **+0 points** for maintaining the rule through all cases (no penalty for using ❓).  
      - Groups must sort all cards—no skipping.  
    - *Facilitator Script:* "Your rule is law. If a case breaks it, amend your rule—but it costs points. If you’re stuck, use ❓."  
    - *Critical:* Walk the room. If a group writes a rule like "doctor decides," intervene: "How would a nurse apply this at 3 AM? Rewrite for clarity."  

  ---

  ### **Phase 3: Rule Exchange** (15 minutes)  
  - **Task:** Rules are redistributed (each group gets another group’s rule). Groups apply the **new rule** to **2 fresh cases** (3 minutes per case).  
    - *Constraints:* No clarifications allowed. Must decide ✅/❌/❓ per case.  
    - *Scoring for Rule-Writers:*  
      - **+2 points** per case if the applying group reaches a clear verdict (✅/❌).  
      - **0 points** if the verdict is ❓ or if the group runs out of time.  
      - *(Applies to the original rule-writers, not the appliers.)*  
    - *Facilitator Script:* "You’re a tired resident. Apply this rule as written—no questions allowed. If it’s ambiguous, do your best."  

  ---

  ### **Phase 4: Transplant Team Evaluation** (10 minutes)  
  - **Task:** Class acts as "transplant team." Each rule is tested against **two critical cases** (not in the deck):  
    - **Case A (Permit Recovery):** Brain-dead patient, family consents to donation.  
    - **Case B (Forbid Recovery):** Comatose patient (reversible condition), family consents but recovery would kill them.  
  - *Scoring:*  
    - **+2 points** if rule permits recovery in A **and** forbids it in B.  
    - **+1 point** if it does one correctly.  
    - **0 points** if it fails both.  
  - *Facilitator Script:* "Does this rule let us take organs ethically? Award points based on outcomes."  

  ---

  ### **Case Card Deck** (14 cases, 1–2 sentences each)  
  *Design Goals:* Cover circulatory, brain-based, and ambiguous cases. Include 2 unsolvable cases. No real patients.  

  1. **Card 1:** Patient in car crash. No heartbeat or breathing for 10 minutes. Body warm.  
  2. **Card 2:** Patient with severe stroke. Unresponsive. Breathing on own, heartbeat steady.  
  3. **Card 3:** Drowning victim. Revived after 5 minutes. Now on ventilator, no brain activity detected.  
  4. **Card 4:** Advanced ALS patient. Fully conscious but cannot move or breathe without ventilator.  
  5. **Card 5:** Overdose victim. No heartbeat initially, revived after 15 minutes. Now in coma, but doctors expect recovery.  
  6. **Card 6:** Elderly patient with terminal cancer. Stopped breathing 1 minute ago. Heart still weakly beating.  
  7. **Card 7:** Newborn with severe birth defect. No higher brain function, but brainstem reflexes intact. Breathing unaided.  
  8. **Card 8:** Patient in deep hypothermia (20°C). No heartbeat, no breathing. Could recover if warmed.  
  9. **Card 9:** Head injury patient. Declared "brain dead" at another hospital. Now has occasional spinal reflexes. Heartbeat stable with ventilator.  
  10. **Card 10:** Patient with locked-in syndrome. Fully conscious, breathing unaided, but cannot move or speak.  
  11. **Card 11:** *TRICKY CASE 1*: Patient on ECMO machine. Heart stopped, but machine circulates blood. No brain activity. Family wants organs.  
  12. **Card 12:** *TRICKY CASE 2*: Patient with artificial heart. No brainstem activity, but "conscious" via brain-computer interface. Breathing simulated.  
  13. **Card 13:** Patient with degenerative disease. No movement, speech, or response. Breathing and heartbeat stable.  
  14. **Card 14:** *AMBIGUOUS*: Patient in persistent vegetative state. 10 years. Breathing unaided, occasional smiles (reflex).  

  **Exchange Cases** (for Phase 3):  
  - **Case X:** Cardiac arrest patient revived after 20 minutes. Now on ventilator, minimal brain activity. Prognosis unknown.  
  - **Case Y:** Patient with total brain failure except hypothalamus (regulates body temperature). Heartbeat stable.  

  ---

  ### **Scoring Summary**  
  | **Phase**            | **Max Points** | **How to Score**                                  |  
  |-----------------------|----------------|--------------------------------------------------|  
  | **2: Sorting**        | 10             | 10 – (number of amendments)                      |  
  | **3: Rule Exchange**  | 4              | 2 per case if appliers reach ✅/❌ (0 for ❓/timeout) |  
  | **4: Transplant**     | 2              | 2 for perfect, 1 for partial, 0 for failure     |  
  | **TOTAL**             | 16             |                                                  |  
  *(Track points publicly; winning group gets bragging rights, no prizes.)*  

  ---

  ### **Facilitator Guidelines**  
  - **DO:**  
    - Enforce time strictly. Use a visible timer.  
    - Redirect clinical tangents: "Use only the info on the card."  
    - If a pre-med dominates: "Your group must agree—no unilateral decisions."  
    - If someone is quiet: Assign roles (e.g., "timekeeper," "spokesperson").  
  - **DON’T:**  
    - Define terms like "death" or "consciousness."  
    - Resolve ambiguities during play. Say: "Apply the rule as written."  
    - Allow research or phones.  
  - **Prevent Rule Vagueness:**  
    - Design: Transplant scoring penalizes vague rules (e.g., ❓ in Case A/B = 0 points).  
    - Intervention: If a rule is vague in Phase 1, say: "How would this rule handle a clear case like no heartbeat?"  

  ---

  ### **Debrief Structure** (25 minutes)  
  **Goal:** Map gameplay to philosophical tensions. End with meta-question.  

  1. **Group Reflection (5 min):**  
     - "Which case forced you to amend your rule? How did it feel to choose between consistency and the ‘right’ outcome?"  
     - *(Link to: Criteria come apart in cases; no rule satisfies all intuitions.)*  

  2. **Rule Exchange Pain (5 min):**  
     - "What happened when you applied another group’s rule? Did language like ‘no meaningful life’ confuse you?"  
     - *(Link to: Ambiguity leads to inconsistent real-world application.)*  

  3. **Transplant Tension (5 min):**  
     - "Did any rules prioritize organ donation over other concerns? Should they?"  
     - *(Link to: Death’s definition serves social/practical roles, not just biology.)*  

  4. **The Big Question (5 min):**  
     - "When groups disagreed, was it about **facts** (e.g., ‘Can this body recover?’), **words** (e.g., ‘What does "death" mean?’), or **decisions** (e.g., ‘When should we let go?’)?"  
     - *(Pause, then reveal: "The criteria conflict because death isn’t a biological fact alone—it’s a concept that answers moral/social questions.")*  

  5. **Conclusion (5 min):**  
     - "Today, you felt the cost of consistency vs. flexibility, and how rules have real stakes. Next class, we’ll see how medicine navigates this."  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"Doctor decides" rule:**  
     - *Prevent:* Intervene in Phase 1: "A nurse must apply this without consulting anyone. Make it objective."  
     - *Fix:* In Transplant Phase, rule fails—appliers can’t guess what "doctor" would do.  

  2. **Pre-med dominates:**  
     - *Prevent:* Assign roles (e.g., "You’re the ethicist—focus on fairness").  
     - *Fix:* Redirect: "Clinical details aren’t on the card. Use only what’s given."  

  3. **Quiet student:**  
     - *Prevent:* Cold-call during debrief: "[Name], what did your group struggle with?"  
     - *Fix:* Note participation in scoring (e.g., "Groups lose a point if not all contribute").  

  4. **Vague rule to avoid amendments:**  
     - *Prevent:* Transplant scoring forces specificity. Vague rules fail Cases A/B.  
     - *Fix:* In Phase 2, warn: "If you ❓ everything, you’ll lose Transplant points."  

  5. **Group stuck on a case:**  
     - *Prevent:* Set a 90-second timer per card.  
     - *Fix:* Say: "If unsure, use ❓—but it has consequences later."  

  ---

  ### **What the Game Can’t Capture (Must State at End)**  
  **The irreducibility of death’s meaning:**  
  - The game treats death as a technical problem, but it’s also:  
    - **Cultural/Personal:** Grief, ritual, and legacy aren’t captured by points.  
    - **Temporally fluid:** Real-world death isn’t a moment—it’s a process (e.g., dying trajectories).  
    - **Power-laden:** Definitions reflect who has authority (doctors, families, society).  
  - **Say:** "Today, you saw how rules buckle under pressure. But death isn’t just a line we draw—it’s a mirror for what we value. No game can capture that weight."  

  ---

  ### **Final Notes**  
  - **Why this works:** The scoring forces trade-offs (e.g., amending rules costs points but avoids "bad" verdicts; vague rules fail transplant test). The unsolvable cases (Cards 11–12) ensure no group "wins" cleanly.  
  - **Timing Safety Net:** Shorten Phase 2 to 15 min if needed, but protect debrief time.  
  - **Tweak:** If groups finish early, add a lightning round: "Defend your rule to the transplant team."  

  Run this, and they’ll leave frustrated by the messiness—exactly as intended.
