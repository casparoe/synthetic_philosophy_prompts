prompt: |-
  So my department — and basically every academic hiring committee everywhere — does this thing. We ask referees for a letter, and everyone agrees the letter is where the real information is, even though the letter almost never contains a single negative sentence. Someone writes that a candidate is unfailingly polite and that they have no doubt she'll do well wherever she lands, and the whole committee hears "not for us." Meanwhile the same committee also makes each referee fill out a grid with explicit numbers: top 5%, top 10%, top 25% for research, teaching, and so on. And here's the part I can't stop thinking about: when the numbers and the tone of the letter come apart, committees reliably go with the tone. The grid gets treated as noise, or as something the referee filled in carelessly, even though it's the only part of the file that's literally, checkably about the candidate.

  I've heard there's a name for this distinction — something like what a sentence says versus what a speaker means by saying it, and a story about how hearers get from one to the other using shared expectations about how much to say, whether to be relevant, and so on. I'd like to know what this practice presupposes:

  - What view of meaning does it only make sense under? It seems to need (a) a real difference between literal sentence content and speaker meaning, and (b) some account of how a reader recovers the second from the first that's reliable enough that a hiring decision can hang on it. Spell out what exactly has to be true for the practice to work.
  - The deniability thing. Letter writers almost always keep literal deniability, and the institution lets them keep it — nobody accuses a faint-praise writer of having said anything false. What does that presuppose about where the norm of honesty bottoms out? That implicating something bad isn't asserting it, so it can't be a lie? Is that coherent, or is it a convenient fiction everyone maintains?
  - Distinguish what the practice strictly requires from what it merely fits well with. Would a few rival accounts of how implicature works license the same practice, or does the fact that committees prefer the letter over the explicit numbers rule some of them out? I want to know where the practice is philosophically underdetermined.
  - The inconsistency I keep tripping over: we happily let meaning ride on implicature in letters, but everywhere else in the same process we insist on explicit, comparable, checkable statements — percentile grids, standardized teaching evals, written rubrics, a rule that every claim about a candidate must be backed by a documented example. Is that actually inconsistent, or is there something about the two channels that makes the split fine?
  - And concretely: if we replaced the letter with something fully explicit — drop the prose, keep only the grid, or require that every evaluative claim be a flat checkable assertion — what would we lose? Don't say "nuance." Tell me specifically what information implicature can carry that assertion can't, if there is any, and what would break in the process.

  One wrinkle I want you to take on too: imagine the opposite convention caught on. Letters are read strictly literally; referees are expected to state the bad stuff plainly; anything merely hinted at is treated as not part of the letter's content at all, so a committee is barred from acting on it (no reading between the lines, no phone calls to fill in the gaps). Is that a coherent practice? Where would it collapse — would referees just stop writing, would the real evaluation migrate somewhere else, or would the information simply stop being produced? Does that tell us anything about why the implicature-based version survives?

  Please say how confident you are in what you're claiming, and single out the one point you're least sure of.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're describing a common academic hiring practice where recommendation letters are valued more than explicit numerical grids, even when the two conflict. The user is pointing out that committees interpret the tone and implicature in letters over the literal numbers. They want to understand the philosophical underpinnings of this practice, especially regarding meaning, deniability, and potential inconsistencies.

  First, I need to address the distinction between literal content and speaker meaning. The user mentioned terms like "what a sentence says versus what a speaker means." That directly points to Grice's theory of implicature. I should explain how Grice's Cooperative Principle and maxims (Quality, Quantity, Relation, Manner) apply here. Referees imply negative evaluations by flouting these maxims, like being overly vague or irrelevant. Committees rely on shared norms to decode these implicatures. 

  Next, the deniability aspect. The user questions why letter writers aren't accused of lying when they imply negatives. Here, the key is the difference between asserting and implicating. Since the negative isn't stated, it's deniable. This relies on the distinction between what is said and what is implicated. The practice assumes that implicature isn't subject to truth conditions in the same way, so it can't be a lie. But is this coherent? It works because the academic community accepts this norm, even if it’s a bit of a fiction.

  The user also asks about rival accounts of implicature. I should mention Relevance Theory as an alternative. While Grice is the standard, Relevance Theory focuses on cognitive effects and processing effort. Committees might still infer the same implicatures, but the mechanism differs. However, the preference for letters over grids might challenge theories that don't account for contextual cues as robustly. The practice fits best with Grice because of the emphasis on flouting maxims.

  Then there's the inconsistency with other parts of the hiring process. The user notes that committees demand explicit data elsewhere but rely on implicature in letters. The difference lies in the purpose: letters assess fit and potential, which are nuanced, while grids handle comparable metrics. But there's tension because both are used for evaluation. The inconsistency is managed but not resolved, relying on community trust in referees.

  For the thought experiment of switching to explicit-only evaluations, the user wants concrete losses beyond "nuance." The key losses are predictive judgments (e.g., "will thrive at a top-10 uni") and warnings about fit or personality issues. These are hard to state explicitly without causing offense or liability. Also, the richness of comparative assessments ("best in a decade") would be lost. Such a shift might lead to more generic letters or migration of honest feedback to backchannels.

  Considering the opposite convention where letters are read literally: if committees ignored implicature, referees might stop writing substantive letters. The real feedback could move to phone calls or informal networks, which are less accountable. This highlights why the current system persists—implicature allows honest communication within professional norms.

  I need to assess confidence levels. Grice's framework is well-established, so I'm confident there. The point about why the system survives is also solid. The trickiest part is the inconsistency in the process—whether the split is justified or just a cultural artifact. I'm less sure if the tension is resolvable or an inherent trade-off.

  The user's deeper need might be to validate their observation that the system is flawed yet functional. They might want arguments to advocate for change or understand the trade-offs. Addressing the philosophical basis gives them tools to critique or justify the practice in their institution.
answer: |-
  This practice is a fascinating case study in pragmatics (how context shapes meaning) and institutional epistemology (how groups decide what counts as knowledge). Let's break it down step-by-step:

  ### 1. **The Required View of Meaning: Gricean Implicature**
     - **Core Theory:** This practice *only makes sense* under a **Gricean framework of conversational implicature** (H.P. Grice, 1975). Grice argued that communication relies on the **Cooperative Principle**: speakers implicitly follow maxims (Quality: be truthful; Quantity: be informative; Relation: be relevant; Manner: be clear).
     - **How It Works Here:** 
       - When a referee writes "unfailingly polite" but omits expected superlatives (e.g., "brilliant," "field-defining"), they *flout* the maxim of Quantity (under-informing) and Relation (irrelevant praise). 
       - Committees infer the negative implicature ("not stellar") because they assume the referee is *cooperative*: if they had strong praise, they *would* say it. The grid, lacking context, can't generate implicatures.
     - **What Must Be True:**
       - **Shared Norms:** Committees and referees must agree on what counts as "sufficient praise" for a top candidate. (e.g., "top 5%" alone isn't enough; it needs effusive prose).
       - **Mutual Trust in Cooperation:** Committees must believe referees *want* to communicate honestly (even if indirectly) and aren't merely lazy or incompetent.
       - **Contextual Reliability:** The inference from faint praise to damning judgment must be highly consistent within the academic subculture.
     - **Confidence:** High (≈95%). This is textbook Grice.

  ### 2. **Deniability & Honesty Norms**
     - **The Presupposition:** Honesty norms bottom out at the level of **literal truth (what is said)**, not implicature. The system presupposes:
       - **Implicature ≠ Assertion:** Saying "polite" is true; implying "mediocre" is not a statement subject to truth conditions. Thus, it can't be a "lie."
       - **Plausible Deniability as Feature, Not Bug:** The referee *can* defend themselves: "I said she was polite, and she is!" The committee *accepts* this deniability to maintain collegiality.
       - **Coherence:** It's a "convenient fiction" but logically coherent under Grice: implicatures are *inferences*, not part of semantic content. The norm of honesty applies only to the latter.
     - **Why It Persists:** Direct criticism risks retaliation (e.g., lawsuits, damaged relationships). Implicature allows truth-adjacent communication with low legal/personal risk.
     - **Confidence:** High (≈90%).

  ### 3. **Rival Accounts & Underdetermination**
     - **Grice is Essential:** The practice *requires* a distinction between sentence meaning and speaker meaning. Rival accounts (e.g., **Relevance Theory** by Sperber & Wilson) could *license* it but don't *explain the preference* for letters over grids as well.
       - **Relevance Theory:** Focuses on cognitive effort. A vague letter demands more processing, signaling the referee's reluctance to praise. Committees might still get the implicature.
       - **Rule-Out:** Theories that collapse meaning into literal content (e.g., strict literalism) or deny systematic pragmatic inference (e.g., some behaviorist accounts) couldn't support this practice. The committee's consistent preference for tone *over explicit grids* rules out views where implicature is unreliable or non-existent.
     - **Underdetermined Aspect:** The *degree* of negativity inferred from faint praise isn't fixed by theory alone—it's culturally encoded (e.g., "solid citizen" = death knell in math, milder in humanities).
     - **Confidence:** High on need for pragmatics (≈90%), lower on ruling out rivals (≈75%).

  ### 4. **The "Inconsistency": Why Letters ≠ Grids**
     - **Not Inconsistent, Just Different Functions:**
       - **Grids/Explicit Metrics:** For **comparable, objective-ish data** (e.g., ranking 100 candidates). Governed by fairness norms; must be checkable to avoid bias.
       - **Letters/Implicature:** For **subjective, holistic judgments** (e.g., "Is this person *really* Stanford material?"). Relies on expert intuition and trust.
     - **Key Difference:** Letters answer questions grids *can't*: "Would you hire this person? Would they thrive *here*?" These require nuance about fit, potential, and hidden flaws (e.g., "collaborative" may imply "not independent enough for us").
     - **Tension:** The practice *does* reveal a tension: committees distrust explicit numbers when they conflict with implicit judgments, suggesting they value "insider knowledge" over standardization.
     - **Confidence:** High (≈85%).

  ### 5. **Replacing Letters with Explicitness: What Would Be Lost**
     - **Concrete Losses (Beyond "Nuance"):**
       1. **Predictive Judgments:** "She will thrive at a top-10 university" – this is a *claim about the future*, hard to reduce to grids.
       2. **Warnings:** "His work is meticulous" (implicature: "slow to publish"). Explicitly stating this risks libel.
       3. **Fit Assessments:** "Her approach complements Professor X's lab" – requires contextual knowledge.
       4. **Relative Praise:** "Best student I've had in a decade" – grids can't capture historical context.
       5. **Personality Red Flags:** "Collegial" may subtly signal "avoids conflict," hinting at leadership concerns.
     - **What Would Break:** Referees would either **refuse to participate** (no deniability) or **default to inflated grids**, making differentiation impossible. The "whisper network" would migrate to backchannels (e.g., phone calls), disadvantaging less-connected candidates.
     - **Confidence:** High (≈90%).

  ### 6. **The "Opposite Convention" Thought Experiment**
     - **Coherence:** Yes, it's coherent: committees could demand literalism ("If not 'top 5%', say 'not top 5%'").
     - **Collapse Points:**
       - **Referee Withdrawal:** Many would decline, fearing backlash.
       - **Information Migration:** Truthful negatives would move to **unofficial channels** (e.g., calls to friends on committees), increasing bias.
       - **Information Loss:** Most referees would **only write strong letters** or **omit negatives entirely**, making weak candidates look average. The system would lose its discriminatory power.
     - **Why Implicature Survives:** It balances **information flow** (truthful negatives get through) with **social lubrication** (deniability preserves relationships). The opposite convention collapses this equilibrium.
     - **Confidence:** High (≈90%).

  ### Least Confident Point & Final Thought
  - **Least Confident:** The **degree of underdetermination by rival pragmatic theories** (Point 3). Relevance Theory *could* accommodate the practice, but Grice's maxim-flouting explains the committee's *certainty* in overriding grids more elegantly. I'm ≈75% sure Grice is uniquely necessary.
  - **Why This Practice Endures:** It solves a coordination problem: how to transmit harsh truths in a high-stakes, reputation-bound community. The implicature system is a **fault-tolerant protocol** for risky information. Replacing it requires rebuilding trust structures from scratch—a near-impossible institutional feat.

  This system isn't irrational—it's a pragmatically optimal (if ethically fraught) solution to academia's evaluation dilemma. But it *does* entrench insularity and opacity. If you want change, focus on *reducing the need* for implicature (e.g., anonymized evaluations, third-party mediation), not just banning it.
