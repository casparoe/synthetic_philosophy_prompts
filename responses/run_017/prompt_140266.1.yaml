prompt: |-
  I've been reading about origin essentialism — the view that a person could not have originated from a different sperm and egg — and I keep noticing a pattern in how that idea gets applied that I can't find discussed. I'd like to know whether it has a name, and if not, how exactly it should be carved up.

  The pattern has two halves. First: when people are asked what they could have been like, what seems to matter is causal route rather than magnitude of difference. Asked whether they could have been born to different parents, in a different country, with an utterly different life, most people say no — that would be someone else. Asked whether they could have been born a different sex, or raised by an aunt instead of by their parents, or with a severe disability, most say yes, even though the last of these arguably makes for a bigger difference in the resulting person than a change of parents would.

  Second: change the question from what could have been to what was. Someone discovers at forty that he was switched at birth, or that the couple who raised him were not his biological parents. The usual reaction is that he is the same person he always was and that only the story about his origins has turned out false; nobody concludes that he never existed and that someone else did. Yet the difference between this case and the previous one is only whether the alternative history is presented as the actual past that everyone was mistaken about, or as a way things might have gone.

  Does this asymmetry have a name? The accounts of personal identity I've come across — ones that stress psychological continuity, ones that stress bodily or causal origins, ones that make identity a matter of which candidate best fits the description — all look like accounts of what identity consists in, and none of them obviously predicts that the truth-conditions for "same person" should shift with the mood of the question. So I'd want to know whether this is best handled as a distinction between what identity consists in and what one would be entitled to conclude if the facts turned out differently; whether there are established notions in the neighbourhood that it resembles and needs separating from (counterpart-style or best-candidate moves, the contrast between metaphysical and epistemic modality, something about the pragmatics of modal language); or whether the appearance is an artifact of how the two questions are posed. If nothing established fits, I'd like a term coined and defined tightly enough that I can tell which cases would be boundary cases, and told what kind of finding would show the asymmetry is real rather than merely rhetorical.
reasoning: |-
  Okay, let me start by unpacking the user's query. They're diving into origin essentialism and noticing an asymmetry in how people apply the concept. The first part is about counterfactuals: people think they couldn't have come from different parents but could have been a different sex or had a disability. The second part is about discovering a switched-at-birth scenario, where identity isn't questioned despite the origin change. The user wants to know if this asymmetry has a name, how to categorize it, and what philosophical frameworks explain it.

  Hmm, the user seems well-versed in philosophy, referencing concepts like psychological continuity and counterpart theory. They might be an academic or a serious enthusiast. Their deep dive suggests they've hit a gap in existing literature. The core of their confusion is the mismatch between modal judgments (what could have been) and actual identity judgments (what is). 

  First, I need to recall theories of personal identity. Kripke's origin essentialism states that a person must originate from the same sperm and egg. But the user points out that people accept some counterfactual changes (like being disabled) but not others (different parents). That's interesting because a severe disability might cause more psychological change than different parents. So why the inconsistency? 

  Then there's the discovery scenario. When someone finds out they were switched at birth, their identity isn't contested. This contrasts with the counterfactual case where changing parents means a different person. The user notes that the only difference is the epistemic context: actual past mistake vs. hypothetical scenario. 

  The user mentions possible explanations—counterpart theory, epistemic vs. metaphysical modality, pragmatics. Let me break those down. Counterpart theory (Lewis) might handle the counterfactual part: people use different counterpart relations for different scenarios. For disability, they emphasize psychological traits; for parents, they focus on origins. But why the shift? Pragmatics could explain it: practical concerns influence which features matter in a context. 

  The discovery scenario is trickier. Here, the actual identity is maintained despite origin change. That clashes with origin essentialism. Maybe the user is onto something about epistemic necessity vs. metaphysical necessity. Discovering a switch doesn't change the metaphysical facts, but our epistemic access. But the user seems to think that if origins are essential, the switched person should be a different individual, which isn't how people react. 

  The user might be hinting at a distinction between criteria of identity and how we ascribe identity in practice. Theories of personal identity often focus on metaphysics, but our judgments are influenced by narrative coherence or practical concerns. Bernard Williams' work on character and identity comes to mind, where psychological continuity plays a role in survival, but not necessarily in identity. 

  Also, the user wants a term if none exists. "Modal anchoring asymmetry" feels right—modal judgments are anchored differently based on context. But I need to ensure it captures both halves: the counterfactual flexibility and the actual rigidity. The boundary cases would test when context shifts the anchor. For example, if someone imagines being born to different parents in a fictional story, do they still feel it's them? Or in the discovery case, if the switch involved significant changes (like different ethnicity), would identity still hold? 

  The user also asks for evidence. Experimental philosophy studies could test this. Present scenarios with varying contextual factors and measure identity attributions. If context consistently shifts judgments, that supports the asymmetry. Also, linguistic analysis of how people use modal terms in different contexts could reveal pragmatic influences. 

  Underlying needs: The user might be developing a critique of origin essentialism or bridging gaps between metaphysics and epistemology. They might want to formalize this asymmetry for academic work, needing a precise framework. Their frustration with existing theories suggests they seek a comprehensive model that accounts for both thought experiments and real-world intuitions. 

  I should also consider if this relates to David Lewis's "cheap haecceitism" where identity is primitive but counterpart relations handle possibilities. But again, the asymmetry in application needs explaining. Perhaps the term "contextual counterpart selection" works, but "modal anchoring" feels more intuitive. 

  In conclusion, the user's observation highlights a gap in how essentialism is applied contextually. Naming the asymmetry and defining its boundaries would aid discussions. Providing possible experimental validations addresses their request for distinguishing real asymmetry from rhetorical effects.
answer: |-
  This is a sharp observation of a genuine and under-discussed asymmetry. While no single established term captures it entirely, your description intersects several philosophical concepts. Here's a breakdown, potential names, and how to carve it up:

  ### Core Components of the Asymmetry
  1.  **Counterfactual Rigidity:** Judgments about what *could have been* ("could I have had different parents?") treat biological origins (sperm/egg) as strictly essential. A change here means it wouldn't be *you*.
  2.  **Actual Flexibility:** Judgments about *actual identity* in discovery scenarios ("I just learned my parents aren't biological") treat identity as resilient to changes in origin *information*. The person existing now is still *them*, despite the origin story being false.
  3.  **Contextual Shift:** The key difference triggering the shift between (1) and (2) is the *modal context*:
      *   **Counterfactual/Possibility Context:** "Could things have been different *for me*?" → Origins are essential, change means non-existence.
      *   **Actual/Discovery Context:** "Who am I, *given this new fact*?" → Identity persists through origin revelation; the existing agent/body/psyche anchors "me".

  ### Why Existing Theories Struggle
  *   **Origin Essentialism (Kripke):** Predicts *both* counterfactual rigidity *and* that the switched-at-birth person *isn't* the same person (since origins differ). It fails to explain (2).
  *   **Psychological Continuity (Locke/Parfit):** Predicts flexibility in counterfactuals (if psychology is similar) and persistence in discovery (continuity is maintained). It struggles to explain the counterfactual rigidity in (1) regarding parents/place.
  *   **Bodily Continuity:** Similar to psychological continuity – the body persists through the discovery, but why the counterfactual rigidity?
  *   **Best-Candidate/Descriptivist:** Might handle the discovery case ("this entity best fits 'me' now") but doesn't obviously predict the specific pattern of counterfactual judgments.

  ### Established Concepts in the Neighborhood
  1.  **Counterpart Theory (David Lewis):** Offers the *best partial fit*. Different contexts select different "counterpart relations."
      *   *Counterfactual Context:* "Could *I* have had different parents?" → Selects a counterpart relation demanding *same biological origin*. Any counterpart lacking that origin isn't *me*.
      *   *Discovery Context:* "Who is *this person* really?" → Selects a counterpart relation emphasizing *psychological/bodily continuity over time*. The person before/after discovery is the same individual under this relation, *despite* the origin difference.
      *   *Limitation:* Counterpart theory explains the judgments as *de re* about different things (my origin-essential counterpart vs. my continuity-essential self), but it doesn't fully explain *why* the context switches the salient relation so starkly or why origin dominates counterfactuals so completely.
  2.  **Epistemic vs. Metaphysical Modality:**
      *   *Epistemic:* Concerns what is possible *given what we know*. The discovery scenario reveals new *epistemic* information about the *actual* metaphysical origins.
      *   *Metaphysical:* Concerns what is genuinely possible in reality.
      *   *Application:* The asymmetry shows that judgments about *metaphysical* possibilities (counterfactuals) are strict on origins, while *epistemic* discoveries about origins don't alter the perceived *metaphysical* identity of the existing person. The discovery changes our *story*, not the *essence* of *who this is*.
  3.  **Pragmatics of Modal Language/Thought:** Practical interests heavily influence which features are considered essential in modal reasoning.
      *   *Counterfactual "Could I...?"*: Often triggers a search for the *minimal change* preserving identity. Changing parents feels like changing the *source*, hence non-identity. Changing traits (sex, disability) feels like altering the *product* of that source, potentially preserving identity. Questions about magnitude are overridden by questions about causal source.
      *   *Actual Identity Judgment:* Anchored by the undeniable presence of a conscious, continuous entity (the person standing there). Pragmatics prioritizes continuity, narrative coherence, and social/legal identity over the newly discovered origin facts. The question "Who *is* this?" defaults to the persisting entity.

  ### Naming and Defining the Asymmetry
  Since no perfect established term exists, a precise coinage is warranted:

  **Term:** **Modal Anchoring Asymmetry (MAA)** or **Contextual Origin Fixity Shift (COFFS)**

  **Definition:** The systematic divergence in judgments about personal identity concerning origins depending on modal context:
  1.  In **counterfactual possibility contexts** ("Could I have had property X?"), identity judgments are anchored strictly to the *actual biological origin* (sperm/egg). Any counterfactual scenario involving a different origin is judged to involve a numerically distinct individual.
  2.  In **actual identity discovery contexts** ("Who is this person, given this new fact about origins?"), identity judgments are anchored to the *persisting entity* (characterized by psychological/bodily continuity over time). Identity is judged to persist *through* the discovery of discrepant origin information, rendering the origin property non-essential *for this judgment type*.
  **The triggering difference is the shift from considering *alternative possibilities for me* to establishing *the identity of this actual, persisting entity*.**

  ### Boundary Cases & Testing
  *   **Boundary Case 1 (Counterfactual):** "Could I have been born from *this specific different sperm and egg pair*, but raised identically by my actual parents?" MAA predicts "No, not me." (Rigid origin anchoring).
  *   **Boundary Case 2 (Discovery):** "I discover I was switched at birth *and* that my biological parents were of a radically different ethnicity/culture." MAA predicts identity persists (Continuity anchoring dominates).
  *   **Boundary Case 3 (Mixed):** "I imagine a scenario where I discover I was switched at birth. *In that counterfactual scenario*, could I (the person discovering this) have *not* been switched?" This tests the nesting of contexts. MAA suggests within the counterfactual "discovery" frame, the "me" discovering it persists, so the answer is "Yes, I could have not been switched" (applying continuity anchoring *within* the counterfactual).
  *   **Key Test for Reality vs. Rhetoric:** **Experimental Philosophy (X-Phi).**
      *   *Finding for Reality:* Rigorous surveys/vignettes showing a *significant, replicable disparity* between the rate at which people deny identity in counterfactual origin-change scenarios vs. the rate at which they affirm identity persistence in discovery origin-change scenarios. Crucially, controlling for the *magnitude* of difference (e.g., showing that a counterfactual involving a minor, unknown origin change is *still* judged as non-identity, while a discovery involving a major origin change is *still* judged as identity persistence).
      *   *Finding Against (Artifact):* If judgments shift dramatically based solely on *framing* the *same scenario* as "could have" vs. "discovered," *without* the actual/persisting entity being salient in the discovery case (e.g., asking "If you had different parents, would you exist?" vs. "If we discovered you had different parents, would you still be you?"), this could support MAA. If the asymmetry vanishes when controlling for the presence/absence of the "persisting entity" focus, it strengthens MAA's core claim about anchoring.
      *   *Finding for Deep Asymmetry:* If neurological or behavioral studies show different cognitive processes (e.g., involving counterfactual simulation vs. entity tracking) are engaged in the two judgment types.

  ### Conclusion
  You've identified a significant **Modal Anchoring Asymmetry (MAA)**. It arises because:
  *   **Counterfactual Possibility Judgments ("Could I?")** default to a strict **Origin-as-Source-Anchoring**. The origin is seen as the necessary starting point defining *which* individual is being considered.
  *   **Actual Identity Discovery Judgments ("Who is this?")** default to a **Continuity-as-Entity-Anchoring**. The persisting conscious being, tracked through space and time and characterized by psychological/bodily continuity, defines *who* is being referred to, and this identity is robust to revisions in the origin *story*.

  This asymmetry highlights that "personal identity" isn't judged under a single, context-independent criterion. The *pragmatic function* of the judgment – reasoning about possibilities vs. re-identifying a persisting entity – fundamentally shifts the salient anchoring feature from biological origin to spatio-temporal/psychological continuity. Experimental work manipulating contexts and measuring judgments is the key to confirming its reality and mapping its boundaries.
