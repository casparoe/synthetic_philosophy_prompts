prompt: |-
  I write durability and safety claims into specifications for reusable medical-device packaging and delivery hardware. Roughly two dozen such claims a year pass across my desk; each one costs about a week of engineer time, has to be signed off by QA and Regulatory, and — because my team are engineers with no philosophy training and I can't justify more than an hour of conceptual work per claim — I need something they can run cold, in ordinary language, with the reasoning stated in your own words. Please don't point me to papers or name-drop authors; my team can't use them and I'd rather have the argument than the bibliography.

  The claims are almost always dispositional: "stays closed under shock," "maintains a sterile barrier for 36 months," "cannot deliver a harmful bolus," "resists ingress after repeated flexing." The naive way to cash these out — the item would do X if condition C obtained — keeps failing us in three distinguishable ways, and I want a procedure that separates them:

  1. Cases where the test itself destroys or removes the very capacity being certified, so the item passes for the wrong reason or is consumed by the test (single-use test on a reusable part).
  2. Cases where something merely blocks the manifestation without removing the capacity, and where the blocking factors are open-ended — a finite checklist can never enumerate them all.
  3. Cases where the observed behaviour is produced by something other than the capacity we're claiming, including behaviour produced by damage the test itself inflicted.

  There is also a fourth worry I can't get straight: a pattern of passing is not the same as a capacity. We once shipped a claim that held for two years only because our test rig was miscalibrated, and the "disposition" was really an accident of our procedure. So the procedure has to say what distinguishes a genuine capacity from a mere run of good results, in terms an engineer can actually check.

  A colleague tells me the philosophical literature has tags for some of this — something like finks, masks and mimics — and that there is a live argument about whether a capacity that never manifests is still there. I don't know the details and don't need them. If that framing earns its keep, use it; if it's a distraction from the shop-floor problem, say so and drop it.

  What I want from you:

  An ordered decision procedure my team runs on any proposed dispositional claim before it goes into a spec. For each step: the question to ask, what counts as a sufficient answer, what to record, and what to do when the honest answer is "we don't know." Mark explicitly (a) the steps where the procedure stops with "do not write this claim, or write it in this weaker scoped form," and (b) the steps where it must hand the decision to a named person because the remaining question is about tolerable risk rather than about fact. Be blunt about which distinctions survive being simplified for technicians and which ones I am losing by simplifying, and about where the procedure will misfire.

  Then run it on three real-shaped cases:

  A. A new claim: "the tray latch stays closed under a 30 g shock," tested destructively on sampled units, where the shock visibly deforms the latch — and the deformation is plausibly what keeps it shut.

  B. A legacy claim I'd be sorry to lose: "the pouch maintains a sterile barrier for 36 months on the shelf," where the "manifestation" is a continuing absence rather than an event, and the only evidence available is accelerated aging on a surrogate.

  C. A claim Regulatory and Sales both want in absolute form: "the pump cannot deliver a harmful bolus." It holds because an occlusion sensor triggers a shutdown that removes the pressure build-up before it becomes dangerous — and in one rare failure mode the sensor is itself what hides a real occlusion.

  If the procedure tells me a claim has to come out of the spec, or can only be written in a weaker form than Sales wants, say that plainly rather than softening it.

  Finally: for each step you flag as irreducibly a judgment call, tell me what would change your mind about the procedure itself — what argument or what kind of evidence would show that step is mis-specified, or that I've kept the wrong distinction and dropped the one that mattered. And name the class of dispositional claim on which you'd expect this procedure to fail silently rather than visibly, plus the one step you'd expect to become a rubber stamp within six months of real use.
reasoning: |-
  We are designing a decision procedure for evaluating dispositional claims in medical-device packaging and delivery hardware. The key problems to avoid are:
  1. Tests that destroy the capacity being certified (single-use test on reusable part).
  2. Blocking factors that prevent manifestation without removing the capacity (and which cannot be exhaustively listed).
  3. The observed behavior being caused by something other than the claimed capacity (including damage from the test).

  Additionally, we must distinguish between a genuine capacity and a mere run of good results.

  The procedure must be:
  - Runnable by engineers with no philosophy training.
  - In ordinary language.
  - Limited to about an hour of conceptual work per claim.

  We are not to rely on philosophical literature (though we may borrow useful terms if they help). The procedure must be step-by-step, with clear questions, what counts as sufficient, what to record, and what to do when the answer is "we don't know". It must flag when to stop and weaken the claim, when to hand off to a named person (for risk decisions), and be blunt about the trade-offs of simplification.

  We'll also run the procedure on three examples.

  Let's design the procedure step by step.

  **Decision Procedure for Dispositional Claims**

  **Step 1: Define the Capacity and Manifestation**
  - **Question:** What exactly is the capacity we are claiming? What specific manifestation (behavior or outcome) are we attributing to that capacity?
  - **Sufficient Answer:** A clear, testable description of the capacity and the manifestation. E.g., "The latch stays closed when shocked at 30g" – capacity: resistance to shock; manifestation: staying closed during the shock.
  - **Record:** The capacity and manifestation in the claim.
  - **If "we don't know":** Stop. The claim is too vague. Rewrite it with clear terms.
  - **Stop/Handoff:** If the capacity or manifestation cannot be clearly defined, stop and do not write the claim until it is clarified. This step is about factual clarity.

  *Rationale: Without a clear definition, we cannot design a test or interpret results.*

  **Step 2: Testability Without Destruction**
  - **Question:** Can we test for the manifestation without destroying or permanently altering the capacity? In other words, is the test non-destructive and repeatable for the same unit?
  - **Sufficient Answer:** 
    - If the claim is for a reusable device, the test must be non-destructive and repeatable. 
    - If the test is destructive, then we must be testing a sample from a batch and the claim must be about the design (not the specific unit) and we must address how the test relates to the capacity in the remaining units (see Step 3).
  - **Record:** Whether the test is destructive or non-destructive. If destructive, note that the claim is about the design and not about the specific unit after testing.
  - **If "we don't know":** Assume destructive until proven otherwise. Then proceed to Step 3 with caution.
  - **Stop/Handoff:** 
    - If the test is destructive and the device is reusable, stop and reconsider: the claim as stated may be invalid because the test destroys the capacity. We might need to rewrite the claim to be about the design (e.g., "the latch design ensures it stays closed under 30g shock when new") and then rely on manufacturing consistency. This step may require handoff to Regulatory for risk assessment if we are making a claim about a reusable device based on destructive testing.

  *Rationale: Avoids problem (1) – test destroying the capacity. Also, for reusable devices, we must be able to test without rendering the device unusable.*

  **Step 3: Isolation of the Capacity**
  - **Question:** How do we know that the manifestation we observe in testing is due to the claimed capacity and not to something else (like temporary damage, a blocking factor, or an external cause)?
  - **Sufficient Answer:** 
    - Identify potential confounding factors (e.g., deformation, environmental conditions, temporary blockages) and either:
      a) Design the test to rule them out (e.g., by testing in a way that the capacity is the only plausible cause), or 
      b) Acknowledge that the test may be influenced by these factors and adjust the claim accordingly.
  - **Record:** List of potential confounding factors considered and how they are addressed in the test. If they cannot be ruled out, note the limitations.
  - **If "we don't know":** This is a red flag. The claim may be invalid. Proceed to Step 4 but expect to weaken the claim.
  - **Stop/Handoff:** 
    - If we cannot rule out that the manifestation is caused by something other than the capacity (e.g., damage from the test itself), then stop and rewrite the claim to be conditional (e.g., "when undamaged, the latch stays closed under 30g shock") or to explicitly exclude the confounding factors. If the confounding factors are open-ended (problem 2), then the claim must be weakened to a specific test condition and not a general capacity. Handoff to Engineering and Regulatory is needed to assess the risk of these factors in real use.

  *Rationale: Addresses problems (2) and (3) – blocking factors and mimics.*

  **Step 4: Distinguishing Capacity from Luck**
  - **Question:** How do we know that a successful test result is due to a stable capacity of the device and not a fluke of the test setup or a temporary condition?
  - **Sufficient Answer:** 
    - Evidence that the capacity is inherent in the design and manufacturing (e.g., via design analysis, material properties, process controls) and that the test is representative and repeatable across units and over time.
    - If the claim is about a long-term capacity (like shelf life), accelerated aging tests must be validated to correlate with real time.
  - **Record:** The basis for believing the capacity is inherent (e.g., design principles, material data, previous testing) and the validation of the test method.
  - **If "we don't know":** The claim is not supported. Do not write it without further evidence.
  - **Stop/Handoff:** 
    - If we cannot establish that the capacity is inherent and stable, then we cannot make a dispositional claim. Instead, we might report the test results as a one-off (e.g., "passed the shock test under lab conditions"). Handoff to Regulatory and Quality is critical here because they must decide if the limited evidence is acceptable given the risk.

  *Rationale: Addresses the "pattern of passing" vs. genuine capacity issue.*

  **Step 5: Risk Assessment for Residual Uncertainties**
  - **Question:** After Steps 1-4, what residual uncertainties remain? What are the consequences if the capacity fails to manifest in real use?
  - **Sufficient Answer:** A list of known limitations and an assessment of the severity of failure.
  - **Record:** Residual uncertainties and the risk level (e.g., low, medium, high) based on the potential harm.
  - **If "we don't know":** Treat as high risk.
  - **Stop/Handoff:** Always hand off to Regulatory and Quality Assurance for a formal risk assessment. They must decide if the residual uncertainties are acceptable. This step is mandatory for every claim.

  *Rationale: Some uncertainties may be acceptable for low-risk issues but not for high-risk ones. This is a risk judgment, not a factual one.*

  **Procedure Summary:**
  1. Define the capacity and manifestation.
  2. Ensure testability without destruction (or adjust for destructive testing).
  3. Isolate the capacity from confounding factors.
  4. Distinguish capacity from luck (establish inherent stability).
  5. Assess residual risks and hand off to Regulatory/QA.

  **When to stop and weaken the claim:**
  - Step 1: If the capacity or manifestation is unclear.
  - Step 2: If the test is destructive and the device is reusable, the claim must be scoped to the design and new units.
  - Step 3: If we cannot rule out confounding factors, the claim must be weakened to the specific test conditions.
  - Step 4: If we cannot establish the capacity is inherent, we cannot make a dispositional claim.

  **Handoff to named persons:**
  - Step 5 always goes to Regulatory and QA for risk acceptance.

  **Trade-offs of Simplification:**
  - We are losing the philosophical nuances of "finks" (temporary removal of capacity), "masks" (blocking factors), and "mimics" (something else causing the behavior). However, we are capturing the practical equivalents in Steps 2 and 3.
  - Step 3 is the most vulnerable to oversimplification because open-ended blocking factors are hard to exhaust. We are relying on engineering judgment and known failure modes, which might miss rare events.

  **Now, run the procedure on the examples:**

  **Example A: "The tray latch stays closed under a 30 g shock" (destructive test, deformation occurs)**
  1. **Step 1:** 
     - Capacity: The latch's ability to stay closed under shock.
     - Manifestation: The latch remaining closed during a 30g shock.
     - Clear? Yes.
  2. **Step 2:** 
     - Test is destructive (visibly deforms the latch). 
     - The device is reusable? If the latch is part of a reusable tray, then destructive testing is problematic because the test alters the latch. 
     - Recording: Test is destructive. 
     - Action: Since the test is destructive and the device is reusable, we must rewrite the claim to be about the design when new. E.g., "The latch design ensures it stays closed under a 30g shock when new." 
     - Handoff: None at this step, but proceed with caution.
  3. **Step 3:** 
     - The manifestation (staying closed) is caused by deformation. Is this the intended capacity? Or is the deformation a confounding factor? 
     - If the design relies on deformation to achieve the outcome, then it's part of the capacity. But if the deformation is damage that alters the latch for future use, then it's a problem. 
     - Here, the deformation is plausibly what keeps it shut. But then the latch is changed and may not perform the same way again. Also, in real use, the latch might be subjected to multiple shocks. 
     - We cannot rule out that the observed behavior is due to the damage (deformation) and that without that specific damage the capacity might not exist. 
     - Recording: The manifestation is caused by deformation, which is a permanent change. This is a confounding factor because the capacity after the shock is altered. 
     - Action: The claim must be weakened to a single-event claim: "The latch stays closed during a 30g shock event." We cannot claim it will do so repeatedly without testing for that. Also, we must note that the latch may be damaged and not reusable after such an event. 
     - If the latch is intended to be reusable, this claim is insufficient. We might need to test for multiple shocks without failure (if possible without destruction) or state the maximum number of shocks the latch can withstand.
  4. **Step 4:** 
     - If the test is done on multiple units and they all pass, we might attribute it to the design. But if the test is destructive, we cannot test the same unit repeatedly. 
     - We must rely on design and material consistency. 
     - Recording: The capacity is inherent in the design when new, but not after the event. 
     - Action: The claim is acceptable only as a single-event claim. For reusability, we need a different claim (e.g., "the latch withstands up to N shocks").
  5. **Step 5:** 
     - Residual uncertainty: The latch may be damaged and fail in subsequent uses. 
     - Risk: If the latch fails in use, the tray might open, potentially compromising sterility or causing injury. 
     - Handoff to Regulatory and QA: They must decide if the single-event claim is sufficient for the intended use and if the potential for damage is acceptable.

  **Verdict for A:** The claim must be rewritten to specify that it is for a single shock event and that the latch may be damaged. For a reusable device, this claim is insufficient without additional claims about durability.

  **Example B: "The pouch maintains a sterile barrier for 36 months on the shelf" (accelerated aging on a surrogate)**
  1. **Step 1:**
     - Capacity: The pouch's ability to maintain a sterile barrier.
     - Manifestation: Absence of microbial ingress for 36 months.
     - Clear? Yes.
  2. **Step 2:**
     - Test is non-destructive? No, because accelerated aging is done on surrogates and the tested pouch is destroyed. But we don't test the same pouch for 36 months. 
     - We are using a surrogate (perhaps a different material or design) and accelerated aging. 
     - Recording: Test is destructive and uses surrogates. 
     - Action: The claim must be about the design and manufacturing process, not about a specific pouch. We must validate that the accelerated aging test correlates to real-time aging and that the surrogate is representative.
  3. **Step 3:**
     - How do we know the sterile barrier is maintained? We are testing for integrity and material properties. 
     - Potential confounding factors: Real-world conditions (e.g., temperature fluctuations, humidity) might differ from accelerated tests. Also, the surrogate might not perfectly represent the production pouch. 
     - Recording: We rely on validated accelerated aging models and surrogate testing. 
     - Action: We must state the claim as conditional on the validation being correct. If the validation is strong, we can proceed. If not, the claim is weakened to the accelerated test conditions.
  4. **Step 4:**
     - How do we know it's a capacity and not luck? We rely on material science and the consistency of the manufacturing process. 
     - Recording: The capacity is inherent if the materials are stable and the manufacturing is controlled. 
     - Action: Acceptable if the accelerated aging model is validated and the manufacturing is consistent.
  5. **Step 5:**
     - Residual uncertainty: The real-world conditions might be more severe than the accelerated test, or the surrogate might not be fully representative. 
     - Risk: Failure of sterility could lead to patient infections. High risk. 
     - Handoff to Regulatory and QA: They must accept the validation of the accelerated aging model and the use of surrogates.

  **Verdict for B:** The claim is acceptable only if the accelerated aging model and surrogate are validated. Otherwise, we must weaken the claim to state the evidence basis (e.g., "based on accelerated aging testing, the pouch is expected to maintain a sterile barrier for 36 months"). Regulatory must sign off.

  **Example C: "The pump cannot deliver a harmful bolus" (due to an occlusion sensor that shuts down the pump, but the sensor can fail in a way that hides an occlusion)**
  1. **Step 1:**
     - Capacity: The pump system's ability to prevent a harmful bolus.
     - Manifestation: No harmful bolus is delivered.
     - Clear? Yes.
  2. **Step 2:**
     - Test: Non-destructive? Probably, but we are testing the system including the sensor. 
     - Recording: Test can be non-destructive and repeated. 
     - Action: Proceed.
  3. **Step 3:**
     - The manifestation (no harmful bolus) is achieved by the occlusion sensor shutting down the pump. 
     - But there is a failure mode where the sensor itself hides an occlusion (a confounding factor). 
     - So the observed absence of a harmful bolus in testing might be due to the sensor working or due to the absence of an occlusion (not testing the failure mode). 
     - We must test the failure mode. 
     - Recording: There is a known failure mode that could mask an occlusion. 
     - Action: We cannot claim "cannot deliver" absolutely because there is a known failure mode. We must either:
       a) Redesign to eliminate the failure mode, or
       b) Weaken the claim to: "Under normal operation and in the absence of sensor failure X, the pump does not deliver a harmful bolus." 
       - Also, we must test for the failure mode and see if it leads to a harmful bolus.
  4. **Step 4:**
     - How do we know it's a capacity? We have designed the system to prevent a bolus, but the failure mode shows a weakness. 
     - Recording: The capacity is present except in the known failure mode. 
     - Action: The claim must be conditional.
  5. **Step 5:**
     - Residual uncertainty: Are there other failure modes? 
     - Risk: A harmful bolus could be life-threatening. Extremely high risk. 
     - Handoff to Regulatory and QA: They must decide if the risk of the failure mode is acceptable (e.g., if it is rare and mitigated by other means). The claim cannot be absolute.

  **Verdict for C:** The absolute claim "cannot deliver" must be rejected. Weaken to a conditional claim that excludes the known failure mode or includes the probability of failure. Regulatory must assess the risk.

  **Finally, for each step flagged as a judgment call and what would change our mind:**

  The procedure has judgment calls in:
  - **Step 3:** Identifying and ruling out confounding factors. This is inherently open-ended. 
    - *What would change our mind?* If we had a systematic method (e.g., FMEA) that exhaustively lists failure modes, then we might reduce uncertainty. But we cannot eliminate it entirely. Evidence that a factor is irrelevant (via testing or analysis) would help.
  - **Step 4:** Establishing that a capacity is inherent and stable. 
    - *What would change our mind?* If we had a mathematical model or fundamental principles (e.g., material science laws) that guarantee the capacity, then we could be more confident. Without that, we rely on empirical evidence which is always finite.
  - **Step 5:** Risk assessment. This is always a judgment call. 
    - *What would change our mind?* If we had quantitative data on failure rates and consequences, we could make it less subjective. But in the absence of data, it remains judgment-based.

  **Class of dispositional claim on which the procedure might fail silently:**
  - Claims about complex systems with emergent behaviors or unknown failure modes that are not captured in Step 3. For example, a claim about a software-controlled device where a rare sequence of events bypasses safety mechanisms might not be caught because we didn't think of it as a confounding factor.

  **Step most likely to become a rubber stamp:**
  - Step 5 (Risk Assessment). Because it is always handed off, and if the risk assessors become complacent or overburdened, they might approve without deep scrutiny.

  **Final Note:** This procedure is a practical tool, not a philosophical solution. It will not catch every problem, but it forces explicit consideration of the key pitfalls.
answer: |-
  Below is a decision procedure designed for your team to evaluate dispositional claims. It's built to be run "cold" by engineers in under an hour, using ordinary language and minimal conceptual overhead. I've structured it as a linear checklist with explicit stopping points, handoff requirements, and notes on simplification trade-offs. The procedure targets your three core failure modes (test-induced destruction, open-ended blockers, and non-capacity causes) and the "pattern vs. capacity" problem. Philosophical terms (like finks, masks, mimics) are omitted—they add jargon without solving the practical issues.

  ---

  ### **Decision Procedure for Dispositional Claims**
  **Purpose:** To validate if a dispositional claim (e.g., "resists ingress," "stays closed") can be written into a spec without overstating reality. Run this *before* drafting the claim.  
  **Time Budget:** 45-60 minutes per claim.  
  **Output:** A go/no-go decision, or instructions to weaken the claim. Record answers in your claim-tracking system.  
  **Key Roles:**  
  - *Engineer*: Runs Steps 1–4.  
  - *Regulatory/QA*: Handles risk decisions (Step 5).  
  - *Tech Lead*: Breaks ties on "we don't know" (all steps).

  #### **Step 1: Pin Down the Manifestation**  
  **Question:** *"What exact event or state are we calling the 'manifestation'? Is it something we observe directly, or is it an absence (e.g., no failure)?"*  
  **Sufficient Answer:** A concrete, testable description (e.g., "latch remains closed during shock," "pouch shows no microbial growth"). Avoid vague terms like "reliable" or "safe."  
  **Record:** The manifestation in 1–2 sentences. Note if it’s an event (e.g., shock test) or a continuing state (e.g., shelf life).  
  **If "we don't know":** Stop. Claim is invalid. Do not write it.  
  **Stop/Weaken:** If the manifestation is an absence (e.g., "no harmful bolus"), proceed but flag for Step 3—absences invite false confidence.  
  **Simplification Trade-off:** We lose nuance between "occurrences" (events) and "omissions" (absences). Absences are harder to prove (see Example B).  

  #### **Step 2: Check Test Destructiveness**  
  **Question:** *"Does the test damage or alter the device in a way that prevents retesting the *same* unit? If yes, is the claim for single-use or reusable hardware?"*  
  **Sufficient Answer:**  
  - If test is non-destructive and device is reusable: Proceed.  
  - If test is destructive and device is single-use: Proceed (but flag for Step 4—destruction may mask flaws).  
  - If test is destructive and device is reusable: Stop—claim fails.  
  **Record:** Test method, destructiveness, and device reusability.  
  **If "we don't know":** Assume destructive if any doubt. Consult Tech Lead. If still unclear, weaken claim to single-use scope.  
  **Stop/Weaken:**  
  - **Stop** if test is destructive + reusable. Write only if rewritten as: *"The [part] stays closed under [condition] *on first use*."*  
  - **Handoff:** None yet.  
  **Why This Works:** Catches your failure mode #1 (test destroys capacity). For reusable devices, destruction invalidates the disposition.  

  #### **Step 3: List Blockers and Non-Capacity Causes**  
  **Question:** *"What could *prevent* the manifestation even if the capacity exists (blockers)? What could *cause* the manifestation without the capacity (mimics)?"*  
  **Sufficient Answer:** A bullet-point list of 3–5 realistic blockers/mimics. Focus on your three core risks:  
  - *Test-induced mimics*: Does the test damage the device, creating a false manifestation? (e.g., deformation "locks" a latch).  
  - *Environmental blockers*: Could real-world conditions (temp, humidity, etc.) mask the capacity?  
  - *Non-capacity causes*: Could the manifestation happen for unrelated reasons?  
  **Record:** Top 3 blockers/mimics. State if they were tested.  
  **If "we don't know":** Run a 5-minute brainstorm with 2+ engineers. If still unknown, weaken claim to *"passes [test name] under lab conditions."*  
  **Stop/Weaken:**  
  - **Stop** if mimics are caused *by the test itself* (e.g., shock deforms the latch). Rewrite as: *"Passes [test] but may be damaged."*  
  - **Handoff:** If blockers are open-ended (e.g., "unknown shelf conditions"), hand to Regulatory/QA in Step 5—they judge risk.  
  **Simplification Trade-off:** We sacrifice exhaustiveness (you can’t list all blockers) for feasibility. Engineers focus on known risks, not hypotheticals.  

  #### **Step 4: Verify Inherent Capacity (Not Luck)**  
  **Question:** *"Is the manifestation due to the device's design, or could it be luck (e.g., test error, sampling bias)?"*  
  **Sufficient Answer:** Evidence from 2+ sources:  
  - Design analysis (e.g., FEA simulation showing latch strength).  
  - Repeat testing (e.g., 3+ lots, 30+ units).  
  - Known material properties (e.g., polymer degradation rates).  
  **Record:** Evidence sources and sample sizes. Note any gaps.  
  **If "we don't know":** Stop. Claim is invalid. Use only if rewritten as: *"Passed [test] on [date] with [sample size]."*  
  **Stop/Weaken:**  
  - **Stop** if relying *only* on test results (e.g., "we always passed"). Rewrite as a test result, not a disposition.  
  - **Handoff:** None.  
  **Why This Works:** Addresses your "pattern vs. capacity" worry (e.g., the miscalibrated test rig). Capacity requires design intent, not just data.  

  #### **Step 5: Residual Risk Signoff**  
  **Question:** *"After Steps 1–4, what’s left that could go wrong? What harm could occur?"*  
  **Sufficient Answer:** A risk rating (high/medium/low) based on:  
  - Severity of failure (e.g., patient injury = high).  
  - Likelihood of unblocked blockers (e.g., rare failure mode = low).  
  **Record:** Residual risks and rating.  
  **If "we don't know":** Default to high risk.  
  **Stop/Weaken:**  
  - **Stop** if risk is high and blockers are open-ended (Step 3). Do not write the claim.  
  - **Handoff:** Always hand to **Regulatory/QA** for final approval. They own the risk decision.  
  **Simplification Trade-off:** Engineers don’t judge risk—they only flag it. QA/Regulatory makes the call.  

  ---

  ### **Procedure Outputs for Your Examples**
  **Example A: "The tray latch stays closed under a 30 g shock"**  
  - **Step 1:** Manifestation = "Latch remains closed during shock." Clear event.  
  - **Step 2:** Test is destructive (deforms latch), device is reusable → **STOP. Claim fails.**  
    - *Rewrite as:* "Latch stays closed under 30 g shock *on first use*."  
  - **Step 3:** Shock deforms latch (mimic)—manifestation is caused by damage, not capacity. Weakens claim further.  
  - **Step 4:** If design intent is deformation (e.g., sacrificial component), use test data. If not, invalid.  
  - **Step 5:** Residual risk = medium (failure could cause injury). Hand to Regulatory.  
  **Verdict:** **Do not write as-is.** Weak claim: *"Latch stays closed under 30 g shock on first use; may be damaged."*  

  **Example B: "The pouch maintains a sterile barrier for 36 months"**  
  - **Step 1:** Manifestation = "No microbial ingress for 36 months." Absence → flag for Step 3.  
  - **Step 2:** Test is destructive (sampled units), but pouches are single-use → Proceed.  
  - **Step 3:** Blockers = humidity, temp shifts. Mimics = accelerated aging may not reflect real time.  
    - Open-ended blockers → **Handoff to Regulatory in Step 5.**  
  - **Step 4:** Relies on surrogate testing → weak unless backed by material science (e.g., ASTM F1980).  
  - **Step 5:** Residual risk = high (failure = infection). Regulatory must validate accelerated aging model.  
  **Verdict:** **Write only if Regulatory approves.** Weak claim: *"Pouch maintains sterile barrier for 36 months based on accelerated aging model [ID]; real-world performance may vary."*  

  **Example C: "The pump cannot deliver a harmful bolus"**  
  - **Step 1:** Manifestation = "No harmful bolus delivered." Absence → flag for Step 3.  
  - **Step 2:** Test non-destructive → Proceed.  
  - **Step 3:** Blocker = sensor failure hides occlusion. Mimic = shutdown could occur without capacity (e.g., false alarm).  
    - Test may not catch rare failure mode → open-ended risk → **Handoff to Regulatory in Step 5.**  
  - **Step 4:** Depends on sensor reliability data. If absent, claim is luck-based → invalid.  
  - **Step 5:** Residual risk = high (bolus = death). Regulatory must accept failure mode probability.  
  **Verdict:** **Do not write absolute claim.** Weak claim: *"Pump includes occlusion sensor to prevent harmful bolus under normal operation; sensor failure may compromise safety."* Sales won’t like it, but absolute claims are indefensible.  

  ---

  ### **Judgment Calls and Procedure Risks**  
  **Steps Requiring Judgment (and What Could Change My Mind):**  
  1. **Step 3 (Blockers/Mimics):**  
     - *Judgment:* Engineers must decide which blockers/mimics are "realistic." This is subjective.  
     - *What would change my mind:* Evidence that a predefined checklist (e.g., ISO 14971 risk categories) reduces escapes better than expert brainstorm. If proven, I’d require FMEA-lite here.  
  2. **Step 5 (Risk Handoff):**  
     - *Judgment:* QA/Regulatory may undervalue open-ended blockers.  
     - *What would change my mind:* Data showing your QA team consistently catches these (e.g., audit logs of claim rejections). If not, I’d add a "challenge panel" for high-risk claims.  

  **Class of Claim Where Procedure Fails Silently:**  
  - **Complex cyber-physical systems** (e.g., IoT pumps with software/hardware interactions). Failure modes emerge from component interactions, which Steps 1–3 won’t catch if engineers think linearly. Example: A sensor "masking" a fault not by malfunctioning, but by miscommunicating with firmware. Procedure will miss it and pass a bad claim.  

  **Step Most Likely to Become a Rubber Stamp:**  
  - **Step 2 (Test Destructiveness):** Engineers might assume "we always test this way" and skip reusability checks. In 6 months, it’ll be a checkbox. Mitigation: Automate with a device-class database (e.g., "flag if reusable + destructive test").  

  ---

  ### **Final Advice**  
  - **Tooling:** Embed this in a template with dropdowns (e.g., "Is test destructive? Y/N"). Use a checklist format.  
  - **Training:** Run a 1-hour workshop with your three examples. Focus on Step 3 (blockers) and Step 4 (capacity vs. luck)—they’re the tripwires.  
  - **When to Ignore This:** For legacy claims with 5+ years of incident-free field data, skip to Step 5 (but still hand to Regulatory).  

  This won’t make philosophers of your team, but it will force critical thinking in under an hour. If Sales complains about weakened claims, remind them: "Better a true limited claim than a false absolute one."
