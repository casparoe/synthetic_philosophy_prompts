     **Defender's dismissal**: The view *does* predict unique failures—e.g., if a system lacks compressible intentional patterns, the stance won't work (unlike instrumentalism, which might still use it pragmatically).  
     **Relation to falsifiability**: Weakens empirical bite but not fatal.

