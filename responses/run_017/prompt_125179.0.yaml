  ### Brainstorming: Candidate Defeaters and Discards
  I listed every defeater that occurred to me, weak or strong. Weak defeaters were discarded if they: (a) rely on pre-theoretical intuitions the view explicitly rejects (e.g., Cartesian materialism or "fundamental" reality); (b) change the subject (e.g., by demanding causal efficacy or metaphysical grounding outside the compression framework); or (c) are irrelevant to the empirical, prediction-focused goals of the view. Here's the raw list with discards:

