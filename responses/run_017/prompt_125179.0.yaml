  - **(iii) Systematic Irrationality (hyperbolic discounting):** This is defeater 5 (Systematic Irrationality, rank 5). The defender can handle it by modifying the intentional stance to include the discount function, which is still within the intentional stance (attributing a desire for immediate reward, etc.). It does not require a new stance.

  ### What the View Predicts That Rivals Do Not

  The Dennettian view predicts that:

  - For any system that we can predict using the intentional stance with significant compression savings, we should be able to find patterns that are as real as any in science (like centres of gravity).
  - It predicts that as systems become more complex, the intentional stance will yield greater compression savings than lower stances (if the system is appropriately designed or evolved).
  - It predicts that in cases of apparent irrationality, we can still compress by attributing biased beliefs or desires.

  Rivals (e.g., eliminative materialism) predict that intentional states will be eliminated by neuroscience. The Dennettian view predicts they will not, because they are real patterns.

  ### Is the View Unfalsifiable?

  The charge of unfalsifiability is serious. The view can be falsified if:

  - We find a system that we intuitively take to have beliefs and desires but for which no compression savings are possible by the intentional stance (e.g., a system so chaotic or random that no pattern emerges).
