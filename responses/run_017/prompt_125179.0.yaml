  #### 7. **Lack of Unique Predictions** (Defeater 15)  
     **Rank**: Merely awkward.  
     **Description**: The view may not make novel predictions that rivals (e.g., eliminative materialism) don't. For example, it predicts compression savings for intentional systems, but so might a purely instrumentalist view.  
