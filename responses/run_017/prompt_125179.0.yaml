     - **Defender's Response:** A defender must show that the view makes testable predictions (e.g., in which contexts compression savings occur). They might argue that the charge confuses the flexibility of the stance with unfalsifiability – the stance can be falsified if it fails to provide compression savings in a given context. But the user's case (ii) shows a failure in a new context, and the defender might retreat to "real-for-E", which risks instrumentalism.
