  **Verdict:** The view is not inherently unfalsifiable because it makes empirical claims about compression savings. But it is at risk of being qualified into unfalsifiability if defenders are allowed to adjust parameters arbitrarily. To avoid this, the view must specify constraints (e.g., fixed error tolerance, projectability). If it does not, then it becomes unfalsifiable and thus unscientific. This is a defect because it undermines the empirical modesty it advertises.

