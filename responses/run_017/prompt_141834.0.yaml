          - Pros: Avoids stepwise pumps and being pumped by others? (if the plan is fixed). 
          - Cons: Does not allow rational deference to new objectives (binds too much). Also, the auditor can see if the agent stuck to the plan? But how does the agent form the plan initially? And what if the plan becomes bad due to objective change? This might fail Desideratum 5 (correction vs. drift).

