     - **Auditability (Desideratum 9)** does the most work because it forces the theory to be grounded in the actual record, not in counterfactuals. This excludes theories that rely on the full preference structure over all possible menus (like classical revealed preference) because the auditor doesn't see that. It also excludes theories that require knowledge of the agent's internal state.

     - **Requirement of non-feasible-pump (Desideratum 3)** also excludes naive time-slice views that allow stepwise pumps.

