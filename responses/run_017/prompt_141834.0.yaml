     - **We drop the requirement for counterfactual exploitability as a necessary condition for auditability**. Instead, we require that the agent's actual choices must not be part of any exploitative sequence (i.e., the actual choices must not be part of a sequence that returns the agent to a previous state minus a fee, and each step was acceptable). And we require that the agent's choices must be consistent with a policy that is not exploitable in a way that would be detectable from the record? This is vague.

     - **Alternative**: The theory must provide a certificate of non-exploitability that can be checked from the actual choices and the offers that were made. For example, if the agent's choices are consistent with a utility function that is stable and the trades are such that the agent's wealth is non-decreasing, then there is no pump? But we allow preference change. This is hard.

     - **What we lose**: We lose the ability to detect latent exploitability (i.e., the agent is pumpable but wasn't pumped). The audit can only check for actual exploitation. This might be acceptable if the goal is to audit what happened, not what might have happened.

     - **Non-negotiable**: Auditability. Therefore, we must drop the requirement that the theory must guarantee non-exploitability in counterfactual scenarios. We can only require that the agent was not actually exploited and that the choices are consistent with a policy that is not trivially exploitable (e.g., by having a stable preference when it matters). But note the noise pump: even stable preferences can be pumped in the presence of noise. So we require robustness to noise (Desideratum 8) and then the auditor can check for stability in the face of noise? 

     - **Revised Desideratum 9**: The norm must be such that any violation (i.e., an actual exploit) is detectable from the record. Additionally, the norm must require that the agent's choices are robust to noise (so that the noise pump is avoided) and that the agent's policy is not obviously exploitable (e.g., by having a disposition that leads to a pump in the actual record). We cannot require the detection of latent exploitability.

     - **Loss**: We lose the guarantee that the agent is unexploitable in all scenarios. We only get that the agent was not exploited in the actual scenario and that the choices are not irrational in a way that leads to an actual pump.

