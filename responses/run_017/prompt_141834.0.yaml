   Final non-negotiable list (from above):

    1. Specification of the unit (policy or disposition, auditable).
    2. Account of the stepwise pump (global failure).
    3. Absence of feasible and profitable pumps.
    4. Robustness to near-indifference (not knife-edge).
    5. Distinguish rational deference from weakness in objective changes.
    6. Paying to bind can be rational.
    7. Dispositions that make you pumpable are not inherently irrational.
    8. Robustness to noise (no conviction for noise pump).
    9. Auditability (from actual record).
    10. Non-regressive reconsideration.

   We have dropped:
     - The requirement for counterfactual exploitability (only actual pumps are audited, and the norm is about avoiding them and having a policy that is robust in the actual record).
     - The requirement that every local act is optimal by the current preferences? Not entirely: we still want local acts to be rational in context, but we allow that sometimes a local act that is part of a pump might be unavoidable without a policy that avoids the whole pump. However, the policy is the primary unit.

