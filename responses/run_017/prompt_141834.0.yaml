     - The demand that rationality be a property of preferences rather than policies might be a prejudice of the classical economics camp. We have chosen to evaluate policies (or dispositions) because the unit must be both instantiable and auditable. Preferences are not directly auditable.

     - The demand that consistency matter rather than getting what you wanted: this might be a prejudice of the consistency camp. We care about both: the agent should get what it wants (at the time) and be consistent in a way that avoids self-defeat. But note: with preference change, what the agent wants changes. We care about the agent's success by its own lights at the time of action and by the lights of the final state? The specification does not say. We are focused on avoiding exploitation and being auditable.

     - We have avoided these prejudices by focusing on the agent's ability to avoid being pumped (which is a form of self-defeat) and by requiring that the unit be a policy (which is auditable as a pattern of choices).

   Scorecard of existing approaches:

     - **Sophisticated planning**: (e.g., Strotz, Pollak) The agent anticipates future changes and chooses a plan that is consistent with future actions. 
          - Pros: Avoids stepwise pumps by taking future actions into account.
          - Cons: May lead to paying to bind (which it does, and we want that to be allowed). However, it assumes fixed preferences? Not designed for objective changes by operators. Audit: the plan is fixed at the start, so the auditor can check adherence? But if the objective changes, the plan might become invalid. Also, it may not handle noise.

