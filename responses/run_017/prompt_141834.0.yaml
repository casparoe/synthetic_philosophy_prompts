  We are drafting desiderata for a theory of diachronic rationality for a long-lived planning agent. The agent has the following features:
   - Acts over an extended horizon.
   - Objective function may be revised mid-run by operators.
   - Shares environment with other agents who can observe its dispositions and offer trades.
   - Behavior must be auditable after the fact by a party who only sees the record of offers made and choices taken (not internal states or unoffered menus).

   The unit of evaluation must be specified by the theory and must be both instantiable by the agent and identifiable by an auditor.

   We address the cases provided and extract desiderata, marking which are non-negotiable and which are preferences of a camp.

   Desiderata:

   1. **Specification of the Unit of Evaluation** (Non-negotiable)
      - The theory must state what it evaluates: acts at nodes, plans, policies, whole sequences of choice, or dispositions to accept menus.
      - The unit must be one that the agent can actually instantiate and an auditor can identify from the record.

   2. **Stepwise Pump** (Non-negotiable to have an account)
      - **Case**: A sequence of trades, each beneficial at the node, returns the agent to start minus a fee.
      - **Requirement**: The theory must be able to say both that the agent did nothing wrong at any single step (local) and that the overall sequence was self-defeating (global). It must diagnose the failure as a global one (i.e., the norm for the sequence) without necessarily blaming the local acts.

   3. **Pumpability vs. Being Pumped** (Non-negotiable to be practical)
      - **Case**: Some pumps are not feasible (too costly for exploiter or require perfect prediction).
      - **Requirement**: The theory should require the absence of *profitable and feasible* pumps (by an adversary with bounded resources and information), not the absence of all possible pumps. This is non-negotiable for realism.

   4. **Near-Indifference Pump** (Non-negotiable to avoid triviality)
      - **Case**: If the agent trades when nearly indifferent, it can be bled by small fees; if it never trades near indifference, it forgoes gains.
      - **Requirement**: The theory must allow for trade near indifference without being exploitable by arbitrarily small fees. It must not force total abstention and must be robust to a little noise (i.e., not knife-edge).

   5. **Correction vs. Drift** (Non-negotiable for objective revisions)
      - **Case**: Operators revise the objective at t2, and the t1 self foresees this. Deferring to a future self that knows more is rational; deferring to one that merely wants different things may be weakness.
      - **Requirement**: The theory must distinguish between rational deference (due to new information or legitimate objective change) and irrational deference (weakness of will). It must not simply let the later self always win or let the earlier self always bind.

   6. **Paying to Bind** (Non-negotiable to account for commitment)
      - **Case**: The agent pays to remove its own future options (e.g., buys a commitment device).
      - **Requirement**: The theory must classify such acts as potentially rational (prudence) and not necessarily self-exploitation. It must not treat every removal of an option as a cost incurred without considering the strategic context.

   7. **Dispositions that Manufacture Pumps** (Non-negotiable for social rationality)
      - **Case**: Dispositions like keeping plans, agreements, or being predictable make the agent pumpable by an adversary.
      - **Requirement**: The theory must not condemn these dispositions as irrational solely because they open the door to exploitation. It must either (a) show that the exploit is not feasible or profitable, or (b) argue that the dispositions are rational despite exploitability in principle. The criterion must not be a reductio of the disposition.

   8. **Noise Pump** (Non-negotiable for robustness)
      - **Case**: An agent with stable, transitive, menu-independent preferences, when presented the same small set of trades in randomized order with minor jitter, ends up paying to return to start.
      - **Requirement**: The theory must not convict such an agent. The norm must be robust to minor presentation effects and stochastic choice. This requires that the theory allow for some degree of indifference-breaking that is not exploitable in the presence of noise.

   9. **Auditability** (Non-negotiable given the use case)
      - **Case**: Exploitability is a property of a counterfactual structure (over unoffered menus). The auditor only sees actual offers and choices.
      - **Requirement**: The norm must be checkable from the record of actual offers and choices. If the best account of a defect is unauditable in principle, then that account is inadequate for this system. The theory must provide an auditable criterion.

   10. **Reconsideration Regress** (Non-negotiable for a planning system)
       - **Case**: If the norm is to adopt a plan and follow it, when may the agent reopen the plan? Permitting reopening under conditions might reproduce the problem at a higher level.
       - **Requirement**: The theory must provide a non-regressive account of when to reconsider. This might be tied to new information, objective changes, or unanticipated events. The conditions for reconsideration must not reintroduce the same diachronic problems (e.g., by being exploitable).

   Now, we note conflicts and which desiderata might be dropped:

   Conflict 1: Local optimality at every node, prohibition on self-defeating sequences, and permission for rational preference change.

     - **Problem**: If preferences change rationally (e.g., due to objective revision by operators), then a sequence that is self-defeating by the old preferences might be rational by the new. But if we require global non-self-defeat by the initial preferences, we might forbid rational change. If we require only local optimality by current preferences, we allow pumps.
     - **Resolution**: Drop the requirement that the sequence must be non-self-defeating by the initial preferences. Instead, require non-self-defeat by the preferences at the time of each action? But then the stepwise pump is allowed. Alternatively, we might drop local optimality? But that seems central. Or we might require that the agent's policy must not be pumpable by feasible and profitable exploits (Desideratum 3) and that the agent can change preferences, but then we need a way to define pumpability that is robust to preference change.

     - **Proposal**: We drop the requirement that the agent must avoid all self-defeating sequences (by any fixed set of preferences) and instead require that the agent's policy must not be feasibly and profitably pumpable by an adversary (with the same information as the agent) over the course of the agent's life, accounting for the possibility of preference change. This means that the stepwise pump might be allowed if it is not feasible for an adversary to run (Desideratum 3). But note: the stepwise pump in the example is run by the environment, so we must require that the agent not be pumpable by the actual environment (which includes other agents). The non-negotiable is the absence of feasible and profitable pumps (Desideratum 3) and the permission for rational preference change (part of Desideratum 5). Local optimality might be relaxed in favor of a policy that is globally robust.

     - **What we lose**: We lose the guarantee that every local act is optimal by the lights of the moment. Instead, we require that the policy as a whole is not exploitable.

   Conflict 2: A purely structural criterion of exploitability (defined over counterfactual menus) and auditability.

     - **Problem**: Audit only sees actual choices. Exploitability is about what would have happened in counterfactual menus.
     - **Resolution**: We must drop the requirement for a purely structural criterion defined over all possible menus. Instead, the criterion must be defined in terms of the actual record. We can require that the agent's choices in the actual record do not reveal an exploitable pattern? But note that the adversary might have set up the actual offers to exploit the agent. So the actual record might show a pump. However, the auditor cannot see the unoffered menus that define the full structure.
     - **Proposal**: We require that the agent's choices must be such that they are consistent with a policy that is not feasibly and profitably pumpable (by the actual sequence of offers). The auditor can check that the actual sequence of choices does not form a pump (by the agent's own preferences at the time). But note: the pump might be hidden if the adversary did not run it to completion? The auditor might see a partial pump? We must require that the agent's choices in the actual record do not constitute a pump (i.e., the agent did not end up worse off by a sequence of trades that were individually acceptable). This is a weaker requirement: it only checks for actual pumps, not counterfactual ones. But then the agent might be pumpable but not pumped? And the auditor would not see it. This might be acceptable if we care only about actual outcomes? But the specification says the agent's behavior has to be auditable for defects, even if they didn't occur? 

