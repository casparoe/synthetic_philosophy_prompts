answer: |-
  ### Desiderata for a Theory of Diachronic Rationality  
  Below is a specification of adequacy for a core theory of diachronic rationality, structured by desiderata, their motivations, and negotiability. The unit of evaluation (e.g., policies, plans) must be explicitly stated, auditable, and instantiable by the agent. Desiderata are derived from your cases, with conflicts highlighted.  

  #### **Core Desiderata**  
  1. **Explicit Unit of Evaluation** (Non-negotiable)  
     - **Requirement**: The theory must specify its unit (e.g., policies, sequences, dispositions) and ensure it is both agent-instantiable and auditor-identifiable.  
     - **Case**: Auditability demands the auditor can verify choices without internal states or unoffered menus. A vague unit (e.g., "intentions") fails auditability.  

  2. **Diagnosis of Stepwise Pumps** (Non-negotiable)  
     - **Requirement**: The theory must distinguish between:  
       - Local rationality: Each act is optimal given the node.  
       - Global irrationality: The sequence is self-defeating (e.g., returning to start minus a fee).  
     - **Case**: In stepwise pumps, the agent is exploited despite locally rational acts. The theory must explain why the global outcome is defective, without blaming individual acts.  

  3. **Feasible Exploitability Criterion** (Non-negotiable)  
     - **Requirement**: The norm must forbid *profitable and feasible* exploitation sequences, not all logically possible pumps.  
     - **Case**: Pumps requiring implausible prediction or excessive exploiter costs are irrelevant. The theory must address real-world adversaries, not idealized omniscient ones.  

  4. **Robustness to Near-Indifference** (Non-negotiable)  
     - **Requirement**: The theory must permit trade near indifference without enabling exploitation by small fees, and forbid knife-edge rules.  
     - **Case**: Near-indifference pumps force a tradeoff between abstention (losing gains) and vulnerability. The solution must be noise-tolerant (e.g., indifference thresholds with hysteresis).  

  5. **Objective Revision Protocol** (Non-negotiable)  
     - **Requirement**: The theory must define when deference to a future self is rational (e.g., new information) vs. weakness (e.g., preference drift), without defaulting to "later selves always win" or "earlier selves always bind."  
     - **Case**: Operators may legitimately revise objectives mid-run. Deference must not conflate epistemic updates with exploitation.  

  6. **Commitment Legitimacy** (Non-negotiable)  
     - **Requirement**: Paying to bind future choices must be classifiable as prudent (e.g., avoiding temptation) or exploitative (e.g., self-harm), not treated as a uniform cost.  
     - **Case**: Binding (e.g., deleting options) may be rational self-defense, not irrational self-sabotage.  

  7. **Immunity of Beneficial Dispositions** (Non-negotiable)  
     - **Requirement**: The theory must not condemn dispositions like plan-stability, promise-keeping, or predictability *solely* because they enable exploitation.  
     - **Case**: These traits are socially valuable; if exploitability convicts them, the criterion is flawed.  

  8. **Noise Tolerance** (Non-negotiable)  
     - **Requirement**: Minor jitter in trade presentation must not cause exploitation.  
     - **Case**: Noise pumps exploit indifference-breaking; the theory must require hysteresis or error margins to prevent spurious convictions.  

  9. **Audit-Compatibility** (Non-negotiable)  
     - **Requirement**: Norms must be verifiable from records of *actual* offers and choices, not counterfactual menus or internal states.  
     - **Case**: If exploitability requires unobservable counterfactuals (e.g., "if offered X, would choose Y"), it fails auditability. The theory must use on-path data.  
     - **Fallback**: If unauditable defects exist, the agent must generate audit trails (e.g., cryptographic commitments to policies).  

  10. **Bounded Reconsideration** (Non-negotiable)  
      - **Requirement**: Rules for reopening plans must avoid infinite regress (e.g., "reopen only for objective revisions or major new information").  
      - **Case**: Unrestricted reconsideration recreates diachronic problems at a higher level. Conditions must be explicit and finite.  

  ---

  ### **Conflicts and Tradeoffs**  
  Your suspicion is correct: **local optimality, global non-self-defeat, and rational preference change are jointly unsatisfiable**. Below are key conflicts, resolutions, and costs.  

  #### **Conflict 1: Local vs. Global Rationality & Preference Change**  
  - **Desiderata at Odds**:  
    - Local optimality at every node (from Stepwise Pump).  
    - Global non-self-defeat (no exploitable sequences).  
    - Permission for rational preference change (from Objective Revision).  
  - **Conflict**:  
    - If preferences change mid-sequence, local optimality (by new preferences) may cause global self-defeat (by old preferences).  
    - *Example*: t1-self avoids a pump by binding, but t2-self (with new objectives) views binding as irrational.  
  - **Resolution**: **Drop strict local optimality**.  
    - **Resulting Theory**: Evaluates *policies* (e.g., "commit unless objectives change"), not node-by-node acts.  
    - **Cost**: Cannot guarantee each act is locally optimal. Auditors see "irrational" single acts (e.g., rejecting a beneficial trade) that protect global integrity.  

  #### **Conflict 2: Structural Exploitability vs. Auditability**  
  - **Desiderata at Odds**:  
    - Absence of profitable/feasible pumps (requires evaluating counterfactuals).  
    - Audit-compatibility (restricted to actual choices/offers).  
  - **Conflict**: Exploitability is structural (e.g., "if offered X, would accept") but unauditable if X was never offered.  
  - **Resolution**: **Drop counterfactual exploitability**.  
    - **Resulting Theory**: Only penalizes *actualized* exploitation sequences. Uses heuristics (e.g., "no net loss in cycles") for auditability.  
    - **Cost**: Latent vulnerabilities (e.g., unexploited pumpable dispositions) go undetected.  

  #### **Conflict 3: Dispositions vs. Exploitability**  
  - **Desiderata at Odds**:  
    - Immunity of beneficial dispositions (e.g., plan-stability).  
    - Absence of feasible pumps.  
  - **Conflict**: Predictable agents *can* be pumped; demanding unexploitability forbids these dispositions.  
  - **Resolution**: **Reframe exploitability**.  
    - **Resulting Theory**: Only condemn dispositions if exploitation is *likely* (feasible/profitable), not possible.  
    - **Cost**: Introduces probabilistic thresholds (hard to audit).  

  ---  

  ### **Most Excluding Requirement**  
  **Audit-compatibility** does the heaviest lifting in excluding theories:  
  - **Excludes**:  
    - Theories relying on unobservable counterfactuals (e.g., full preference orderings over menus).  
    - "Purely internal" accounts (e.g., time-slice rationality based on beliefs).  
  - **Why**: Auditability forces norms to be grounded in the agent’s *observed behavior*, privileging behaviorist (e.g., revealed-preference) or cryptographic (e.g., commitment-attested) approaches.  

  ### **Camp-Specific Prejudices**  
  - **"Consistency Over Outcomes"**: A deontological prejudice. Rejectable; the theory should prioritize achieving objectives (e.g., "avoid being pumped" over "transitive preferences").  
  - **"Preferences Over Policies"**: A static-choice prejudice. Rejectable; policies are primary for diachronic agents (per your use case).  

  ---  

  ### **Scorecard of Existing Theories**  
  | **Theory**               | **Alignment with Desiderata**                                                                 | **Fatal Gap**                                  |  
  |--------------------------|-------------------------------------------------------------------------------------------|---------------------------------------------|  
  | **Sophisticated Planning** | Good: Global non-self-defeat via precommitment. Poor: Auditability (relies on internal forecasts). | Fails Objective Revision (binds too rigidly). |  
  | **Resolute Choice**        | Good: Immune to stepwise pumps. Poor: Near-indifference (rigidity forgoes gains), Noise (fragile). | Fails Reconsideration (no reopening protocol). |  
  | **Moment-by-Moment**       | Good: Handles preference change. Poor: Allows stepwise/near-indifference pumps.              | Fails Feasible Exploitability (vulnerable by design). |  
  | **Preferences Over Plans** | Good: Global evaluation. Poor: Cannot handle mid-run objective revisions.                   | Fails Objective Revision Protocol.            |  
  | **Bargaining Selves**      | Good: Legitimizes paying to bind. Poor: Unaubitable (internal negotiations invisible).     | Fails Audit-Compatibility.                    |  

  ---  
  **Deliverable**: The criteria above define a minimally adequate core. Conflicts center on **auditability vs. counterfactual robustness** and **local vs. global rationality**. A policy-based theory (e.g., "adaptive precommitment with objective-change triggers") best balances these, but must sacrifice strict local optimality or latent exploitability guarantees. Start by stress-testing against the stepwise pump and noise pump—these expose foundational tensions.
