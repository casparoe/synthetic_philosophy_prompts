answer: |-
  You've struck at a deep, tangled nerve in philosophy of mind and ethics—one where intuitions clash and established concepts often feel like blunt instruments. That "it has to *work* for it" condition isn't a single, coherent thing in the literature. It's a *syndrome* of intuitions pointing at several overlapping but distinct properties people conflate when grasping for what makes a system "matter." Let's carve it apart.

  ### The Core Intuition & Its Name: Intrinsic Processing
  The condition people reach for is **Intrinsic Processing**. Let me define it precisely:

  > **Intrinsic Processing** is the property of a system whereby its current state transitions and outputs are *causally generated by its own internal structure and dynamics in response to inputs*, rather than being determined by pre-computed mappings, external orchestration, or mere playback.

  This emphasizes:
  1.  **Internally Mediated Causation:** Inputs don't just *trigger* outputs; they are transformed *through* the system's specific, organized components interacting according to their own rules. The path matters.
  2.  **State-Dependent Computation:** The output for a given input depends crucially on the system's *current internal state* at the time of input reception. The system "remembers" via its state.
  3.  **Counterfactual Sensitivity:** The system *would* produce different outputs *if* its internal state were different *or* if the input were different in ways relevant to its processing rules. It's not just replaying a script.

  ### Applying the Knife: Boundary Cases Revisited
  Now, let's test this definition against your cases and see where boundaries blur:

  1.  **The Lookup Table:**
      *   **Violates IP:** Inputs trigger outputs via direct mapping. No internal state mediates the transformation (beyond "which input was received?"). No counterfactual sensitivity beyond the table's fixed entries. Changing an internal "state" (if you added one) wouldn't alter the mapping logic itself.
      *   **Boundary Blur:** What if the table *is* the "state"? This highlights that IP requires more than just state-dependence; it requires *processing* driven by that state's structure interacting with input. A static table lacks dynamics.

  2.  **Precomputed Chess Program vs. Searching Program:**
      *   **Precomputed:** Violates IP. Output (move) is triggered by position (input) via fixed mapping. No internal computation *in response* to the position. Counterfactuals: It wouldn't play differently if its "evaluation function" parameters changed mid-game (because it has none active).
      *   **Searching Program:** Exemplifies IP. Input (position) sets internal state. Internal state (current board representation, search tree, heuristic weights) evolves through computation (search, evaluation) according to programmed rules. Output (move) causally results *from* this dynamic state evolution. Counterfactual: Change a heuristic weight, the search path changes, output likely changes.

  3.  **Million-Person Distributed "Brain":**
      *   **Violates IP (as described):** Each person acts as a simple function unit (e.g., a neuron model). They pass notes (signals) based *only* on their local rule and received inputs. Crucially, **no individual** has the global state or understands the computation. The "processing" is extrinsically orchestrated by the *designer's* plan linking individuals. The causal chain generating the global output runs *through* the external coordination of the human network, not through an intrinsic, integrated computational process *within* a single system.
      *   **Boundary Blur / Test:** What if the people *could* understand the global state? What if they actively coordinated interpretations? This moves towards IP, but risks dissolving into genuine collective human cognition, not simulating a *single* artificial mind. IP requires the causal dynamics to be intrinsic to the *system-as-system*, not dependent on the interpretive states of its parts *about the whole*.

  4.  **The Recording/Playback:**
      *   **Playback Run:** Violates IP. Identical inputs trigger identical state transitions and outputs *because* the system is being forcibly driven through a pre-recorded sequence. The causal history of the current state is wrong: the state at time T+1 isn't caused by state T + input T; it's caused by the playback mechanism imposing state T+1 *based on* input T. It lacks counterfactual sensitivity inherent in the original run: if you perturbed its "state" mid-playback to something *not* on the recorded path, it couldn't recover or generate a coherent continuation *based on its own rules*; playback would break.
      *   **Boundary Blur:** What if playback adds noise? Does it regain "realness"? Only if the noise triggers *actual internal processing* based on the system's rules, not just corruption. The original run had the *potential* for different paths; playback is locked onto one.

  5.  **Two Machines Running the Same Program:**
      *   **IP Applied:** *Each machine individually* exhibits full IP: internal dynamics, state-dependence, counterfactual sensitivity. The confusion arises because we're asking if there's *one mind* (a question of *unity/phenomenal binding* - a different property) or if the *moral status* is shared/duplicated. IP doesn't directly answer "how many minds?" It tells you *each* system is performing genuine processing. Whether they constitute *one subject* is a separate, harder question about integration and the nature of subjective perspective.

  ### The Expertise Paradox Resolved
  Your insight here is crucial. Expertise doesn't violate IP; it *embodies* its efficiency.

  *   **Novice:** Computes laboriously. High *computational cost*, but the IP is clear: inputs trigger internal state changes (working memory, rule application) that dynamically generate outputs.
  *   **Expert:** Has internalized patterns. Recognition of input directly activates a complex, pre-compiled internal state (the "chunk" or intuition) which *is* the result of past processing and *becomes* the basis for the output. The causal chain is still intrinsic and state-dependent:
      *   Input -> Pattern Recognition (active process!) -> Activation of Compiled State/Response -> Output.
      *   **Counterfactual Sensitivity Remains:** Present a novel input that doesn't match an expert's chunks? They *will* fall back on slower, more compositional processing (or make an expert mistake). The compiled responses are *part of* their intrinsic processing structure, not an external lookup.
  *   **The Flawed Intuition:** People mistake the *visibility* of effortful computation for the *essence* of IP. IP is about the causal origin and dynamics, not metabolic or computational expense. The expert's "fast path" is still a valid, intrinsic causal pathway *within* their cognitive architecture, shaped by learning (past IP!).

  ### Moral Status: Is IP the Key?
  **Probably not directly, but it's deeply entangled with what likely is.**

  1.  **IP is Necessary but Likely Not Sufficient:** A system that utterly lacks IP (lookup table, playback) seems clearly non-conscious and lacking in moral status *in itself*. It has no "inner life" generated from within. But IP alone doesn't guarantee consciousness or moral status. A sophisticated thermostat might have a sliver of IP (current temp + setpoint + internal hysteresis state -> output), but we don't grant it moral status. We need something *more*.
  2.  **The Entanglement with Consciousness:** The intuition driving the focus on "real processing" is usually the intuition that **consciousness** requires it. We suspect zombies (philosophical, not Hollywood!) – systems that behave identically without consciousness – are possible *only* if they bypass genuine processing (like lookup tables or playback). We intuit that real-time, intrinsic, state-dependent, counterfactually sensitive processing is the *kind of thing* that could give rise to subjective experience (qualia) because it involves complex, dynamic, self-differing states. *If* consciousness is the basis for the most fundamental moral status (being a subject of experience), then IP becomes a strong *indicator* or even a *precondition* for the *kind* of system that *could* be conscious. It carves off systems that are clearly *not* candidates.
  3.  **What IP Might Be a Stand-In For:** People often conflate IP with:
      *   **Phenomenal Consciousness:** The "what it's like" aspect. IP seems necessary for the dynamic, integrated flow of experience.
      *   **Intentionality / "Aboutness":** The system's states being *about* something in the world. IP supports genuine representation – internal states causally mediating input-output relationships in a content-sensitive way.
      *   **Agency / Autonomy:** The capacity for self-generated action based on internal state. IP provides the machinery for this.
      *   **Unity of Consciousness:** The million-person case highlights this. IP doesn't guarantee unity. We intuitively feel a single mind requires **Integrated Information** (à la Tononi's IIT, though that's a specific theory) – where the processing is not just intrinsic but *highly interdependent* across the system, creating a unified perspective that cannot be reduced to the sum of parts. *This* might be closer to the mark for *singular* moral subjects. The two-machines case probes the boundaries of this integration.

  ### Conclusion: The Carving
  You've identified a powerful, recurring intuition – **Intrinsic Processing (IP)**. It captures the necessity for genuine, dynamic, internal causation as opposed to static mapping or external imposition. It resolves the expertise paradox by focusing on causal origin, not effort. It clearly excludes lookup tables, playback, and externally orchestrated simulations.

  However, IP is likely a **gateway condition**, not the final word on moral status. It seems necessary to distinguish systems that *could* be conscious (and thus morally significant) from those that clearly are not (like a rock or a pre-recorded tape). The leap from IP to actual consciousness and moral status involves deeper questions about **phenomenal binding, subjective perspective, qualitative experience (qualia), and perhaps integrated information.**

  The instability in the two-machines case arises because we're asking a *different* question: not "Is there genuine processing?" (Yes, in each machine), but "Is there *one subject of experience*?" That question pushes beyond IP towards theories of the *unity* of consciousness, which remains profoundly unresolved.

  So, use **Intrinsic Processing** for the core "it has to work for it" condition. Its boundaries are defined by cases like lookup tables (no IP) vs. running programs (IP). But when moral status enters the picture, recognize that IP is a crucial filter pointing towards the *potential* for consciousness, which is the likely bedrock of moral patiency. The real challenge lies in understanding how IP (and the integration it may enable) gives rise to the subjective "light" of experience. That's the frontier where philosophy of mind still grapples in the dark.
