answer: |-
  In the cold glass, the residue we weigh
  defies the scale. The learned men dispute
  what substance fled: did fire consume the air
  or gift it? Ash remains, a stubborn calx
  that clings to iron. Watch the bright flame
  dance in the vessel, blue and gold and rare.

  What held that heat? What made the vessel rare?
  Old words are ash we sift but cannot weigh
  with certainty. The language feeds the flame
  of argument, a bitter, sharp dispute
  where meaning shifts like forming calx,
  dissolving bonds that held the common air.

  Recall the breath we drew, the common air
  that filled the lungs? It seemed so clear, so rare
  a simple truth. Now watch the forming calx
  confound the hand that seeks to firmly weigh
  the elements. Each term becomes dispute;
  old sense departs, consumed within the flame.

  Observe the heat, the colour of the flame,
  the gas that feeds it. Was it vital air,
  or just a part? The core of the dispute
  lies hidden here, in meanings lost or rare
  as phlogiston. Can reason still weigh
  the ash, the metal, and the stubborn calx?

  The metal shines, then dulls to brittle calx.
  What leaves the ore beneath the furnace flame?
  The balance dips; the scale begins to weigh
  the captured dust. But what escaped the air?
  What principle, unseen, elusive, rare,
  is central to this unrelenting dispute?

  Two systems clash within the fierce dispute.
  One sees release: a metal sheds its calx,
  restored by air made rich and fixed and rare.
  The other sees consumption: hungry flame
  devouring substance from the yielding air,
  leaving a weight the balance cannot weigh.

  The vessel yields to flame, but not to measure:
  Calx weighs what air once freed; dispute grows rare.
