prompt: |-
  I read history for pleasure rather than as a profession. I have no training in it, no standing to referee anything, and no access to a university library — mostly books, a few open-access journals, and whatever a search engine will show me. Over the last few years I drifted from popular history into the literature at its edge, and I have not been able to find a rule I can actually use.

  The edge literature splits me in two directions. On one side: the claim that the monumental remains of several unrelated ancient civilizations are best explained by visitors from off the planet; the claim that a real, datable, advanced civilization was destroyed in a single catastrophe and that its traces have been systematically misidentified ever since; and the Russian mathematician who argued that the conventional chronology of antiquity is essentially a later fabrication and that recorded history is far shorter and far more duplicated than we suppose. I do not believe any of these, but when I try to say precisely why, I notice I am mostly saying that no professional believes them. On the other side: I have learned that orthodoxy has been wrong before and has been corrected from outside. An outsider proposing that the continents move was ridiculed for decades and then vindicated. A city that most scholars had filed under legend was dug up by a nineteenth-century amateur whose methods were, by all accounts, appalling. Stories in medieval Norse texts were treated as saga rather than report until a site at the northern tip of Newfoundland turned up in the 1960s. And the mainstream constantly revises its own dates, attributions, and interpretations without any of this counting as scandal.

  So I would like a specification, not a verdict on any one claim. I want the desiderata that a personal triage rule for fringe historical claims would have to meet — the cases it must get right, the distinctions it must respect, the facts about my situation it must be consistent with — each with the case or consideration behind it.

  Let me fix the purpose, since I take it adequacy is relative to one. I am not asking what makes a claim scientific, and I am not asking for a gatekeeping tool that a funding body or a journal could use. I want a rule for a non-specialist with, say, an evening to spare, who is deciding how to dispose of a specific sensational claim about the past: dismiss it, park it, spend real attention on it, or admit that the rule cannot tell. It should be allowed to say cannot tell, and it should be honest about which way it errs.

  Some cases I want any candidate rule run against, with the reason each is doing work in my mind:

  - The extraterrestrial-visitors and lost-civilization claims above. Not because they are hard, but because a rule that needs a dozen pages to reject them is useless to me.
  - The shortened-chronology claim, which is different in kind: it is internally elaborate, it cites real documents, and it explains away every refutation by expanding the conspiracy. I want to know what feature of it the rule is keyed to — the size of the claim, the shape of its defense, or something else.
  - The vindicated outsider, and the outsider whose method was bad but whose conclusion was partly right. A rule that scores the person cannot tell these apart; a rule that scores only the argument cannot either, because I cannot evaluate the argument.
  - A case of my own constructing, which I would like handled twice. Suppose a retired engineer notices a recurring mark on Roman-era lead seals recovered from one river, argues by template-matching shapes he cannot actually read that a fortress was supplied from two hundred kilometres away, and concludes that the road network existed a generation earlier than the textbooks say. Suppose first that a professional excavation a decade later confirms the earlier date; suppose second that it refutes it. A good rule should say the same thing about his procedure in both branches and something different about his conclusion. Whether it can do both is, I suspect, one of the interesting questions.
  - The mirror case. Take any claim the rule dismisses and rerun it with the social roles inverted: the revisionist is a well-funded professor at a prestigious institute, and the orthodox position is defended by isolated, underfunded amateurs in another country. If the rule's verdict flips, it is measuring the sociology of the claimants rather than the claim, and I want that said out loud. Please include a requirement that catches this.
  - The destroyed-archive case: a claim about a people whose records were burned, whose sites are under a modern city, or whose traditions were oral. Here the absence of evidence is weak evidence of absence, and a rule that reads silence as refutation will systematically convicth the least well-documented groups in history.
  - The frozen-claim case. I have noticed that genuine revisionist programs change shape as they age — they get more specific, they shed their worst examples, they generate new things to go check — while the fringe claims I have read about seem to be stable in their assertions and endlessly inventive in their excuses. If that observation is worth turning into a requirement, say so; if it is just a prejudice of mine, say that instead.

  Distinctions I do not want collapsed: the verdict on a claim versus the verdict on the person making it versus the verdict on the field that rejects it; false versus unsupported versus not worth my evening; revisionist versus speculative-but-labelled versus pseudohistorical; and, importantly, the probability that a claim is true versus the expected value of my looking into it — a claim that is two percent likely could still deserve an hour if being right would reorient a great deal. I am also unsure what the word extraordinary is doing in the common demand that extraordinary claims need extraordinary evidence. Extraordinary relative to what — to the orthodoxy, or in the sheer quantity of independent coincidence the claim requires? Those come apart, and I would like the rule to say which it means.

  Constraints from the situation, which I take to be non-negotiable data rather than preferences: most claims of this kind are false; I cannot evaluate primary evidence myself; experts are sometimes wrong and have professional incentives in both directions; the same procedure performed by different people has wildly different reliability; and evidence can be lost, never created, or inaccessible to me for money or language reasons.

  From all this, please give me: a numbered list of requirements with the case behind each; a marking of which are non-negotiable for my purpose and which are merely preferences of one camp or the other (I suspect must never appeal to authority is the prejudice of my skeptical side, and must always return a clear yes or no is the prejudice of my impatient side, but I would rather you judged); any pair or subset you think cannot be jointly satisfied, since that would tell me something about the situation rather than about my list; and the single requirement that does the most work in excluding candidate rules.

  Finally, and briefly — a few sentences each, no more — score three or four candidate heuristics against the list: the falsifiability-style test, the extraordinary-claims principle, the consensus-and-peer-review test, and the test that asks whether the claimant is imitating the surface of scholarship while skipping its practice (citations that do not support what they are attached to, methods invoked but not actually run, no way for a stranger to recheck anything). Keep the weight on the criteria; the scorecard is just to check I have understood them.

  Please do not give me reading lists, bibliographies, or citations to work on demarcation or to specific scholars and their papers — I cannot chase them, and guessing at them would only waste the answer. Everything above should be answerable from the cases and distinctions themselves.
reasoning: |-
  Hmm, the user presents a sophisticated challenge about evaluating fringe historical claims as a non-specialist. They're clearly well-read and frustrated with binary approaches, having encountered both absurd theories (ancient aliens, chronological conspiracies) and legitimate historical revisions (continental drift, Vinland). 

  Their core need is methodological: a practical triage tool that respects epistemic constraints (no library access, inability to evaluate primary evidence) while avoiding both gullibility and knee-jerk skepticism. The detailed test cases reveal their key concerns: distinguishing structure from content (the lead seal example), avoiding sociological bias (the mirror case), and handling evidentiary voids (destroyed archives). 

  I notice three tension points requiring careful navigation: First, their rejection of authority appeals conflicts with their inability to assess evidence firsthand. Second, they want to acknowledge legitimate paradigm shifts while filtering out static pseudohistory. Third, they demand transparency about what the rule can't decide - which is crucial given their limited time.

  The frozen-claim observation is particularly astute. Legitimate scholarship evolves through criticism; pseudohistory accretes defenses. This deserves elevation to a core requirement (#8), though I'll note it's probabilistic. The mirror test (#7) is equally vital - any rule failing it would merely institutionalize credentialism.

  For scoring heuristics: Falsifiability fails the destroyed-archive test. Extraordinary-evidence is ambiguous about "extraordinary." Peer-review works poorly for pre-consensus breakthroughs. The imitation-scholarship test (#9) proves strongest, targeting the core pathology of citation theater and unreproducibility.

  The trickiest requirement is #6 (expected value). Some low-probability claims might merit attention if transformative - but how to weigh that against false positives? I'll suggest a threshold: only when the claim would reconnect major historical dots if true. This preserves their "2% but reorienting" concern without opening floodgates.
answer: |-
  Here is a triage rule specification meeting your requirements. It prioritizes structural features over content, acknowledges your constraints, and respects your test cases. Requirements are numbered, with the driving case or principle behind each, and marked for negotiability.

  ### Requirements for a Personal Triage Rule (with Justification & Negotiability)
  1.  **Must identify the core claim's dependency on *unfalsifiable auxiliary hypotheses***. (Case: Shortened Chronology)  
      *Why*: Conspiracy theories (e.g., "all carbon dating is manipulated") make the claim immune to evidence. If rejecting the claim requires disproving an endless series of protective assumptions, it's a red flag. **Non-negotiable**.
  2.  **Must assess if the claim *predicts novel, specific, checkable evidence* beyond reinterpreting existing data**. (Case: Vindicated Outsider vs. Frozen Claim)  
      *Why*: Wegener predicted fossil distributions; Schliemann *went and dug*. Legitimate revisionism generates new testable questions (e.g., "look for X artifact in Y layer"). Static claims only reinterpret or excuse absence. **Non-negotiable**.
  3.  **Must flag claims relying *primarily* on the *absence of evidence* where such absence is plausibly explained by mundane factors (decay, destruction, bias)**. (Case: Destroyed Archive)  
      *Why*: Absence isn't strong evidence against existence if records were perishable, suppressed, or simply not found yet. Dismissal requires positive counter-evidence or implausibility. **Non-negotiable**.
  4.  **Must separate the evaluation of the *claim's structure* from the *claimant's identity* and the *field's consensus***. (Case: Mirror Test)  
      *Why*: Truth isn't determined by credentials or votes. A crank professor is still a crank; a brilliant amateur can be right. The rule must work identically if social roles are inverted. **Non-negotiable**.
  5.  **Must estimate the *expected value of investigation* (EVI)**, not just probability. EVI = (Probability Claim True x Value if True) - (Cost of Investigation). (Case: 2% Likely but Reorienting)  
      *Why*: A low-probability claim revolutionizing your understanding might be worth an hour; a likely-but-trivial claim might not. "Extraordinary" here means *requiring high explanatory leverage* relative to orthodoxy *and* demanding commensurate evidence. **Negotiable** (complex to estimate, but essential for your purpose).
  6.  **Must acknowledge when the rule *cannot tell* due to inaccessible evidence or your epistemic limits**. (Constraint: Cannot evaluate primary evidence)  
      *Why*: Honesty requires admitting ignorance. If primary sources are needed and you can't access/assess them, "cannot tell" is valid. **Non-negotiable**.
  7.  **Must include a *Mirror Test* step explicitly**. (Case: Mirror Test)  
      *Why*: Forces application of Requirements 1-4 regardless of claimant status. If the verdict changes when roles swap, the rule fails. **Non-negotiable** (Implementation of R4).
  8.  **Must consider the *trajectory of the claim/program*: Does it adapt to critique and new data, or just defend static assertions?** (Case: Frozen Claim vs. Vindicated Outsider)  
      *Why*: Legitimate scholarship evolves (plate tectonics refined); pseudohistory is static (ancient aliens always "just missed"). **Negotiable** (Observational, but strong indicator).
  9.  **Must identify *imitation scholarship*: Surface features (citations, jargon) present, but core scholarly practices absent (misrepresented sources, unreproducible methods, opaque data)**. (Case: Lead Seals & General Constraint)  
      *Why*: The Roman engineer’s template-matching *might* be reproducible/checkable (good sign) or vague hand-waving (bad). Fringe often cites "papers" misrepresenting content. **Non-negotiable**.
  10. **Must be executable with accessible resources (books, open web) within ~1 hour per claim**. (Constraint: Your resources/time)  
      *Why*: Practical necessity. If a rule needs JSTOR or a PhD, it fails for you. **Non-negotiable**.

  ### Key Tensions & The Most Powerful Requirement
  *   **Hardest Joint Satisfaction**: R5 (EVI) vs. R6 (Cannot Tell). Estimating probability/value is inherently subjective and hard for non-specialists. This *requires* R6 as a safety valve.
  *   **Non-negotiable Core**: R1 (Unfalsifiable Shields) + R9 (Imitation Scholarship) + R4/R7 (Mirror Test). Together, they filter the worst offenders (aliens, chronology conspiracies) quickly and impersonally.
  *   **Most Powerful Requirement**: **R9 (Imitation Scholarship)**. This does heavy lifting:
      *   Catches fake citations and unreproducible methods (R9).
      *   Reveals if "predictions" are vague or untestable (contrast with R2).
      *   Exposes reliance on absence of evidence by showing lack of genuine search (R3).
      *   Works identically in the Mirror Test (R4/R7).
      *   Is often quickly assessable (R10): Can you *see* the source they cite? Does it say what they claim? Is their method described so someone could try it?

  ### Scoring Candidate Heuristics Against Requirements
  1.  **Falsifiability (Popperian):**  
      *   *Scores Well*: R1 (Identifies unfalsifiable claims). R2 (Implies need for testable predictions).
      *   *Fails*: R3 (Absence isn't falsification). R6 (Silent on epistemic limits). R5 (No EVI). R8/R9 (Doesn't address scholarship imitation/evolution). R10 (Can be abstract/hard to apply).
  2.  **Extraordinary Claims Require Extraordinary Evidence (ECREE):**  
      *   *Scores Well*: R5 (Implies high EVI needed if prior probability very low).
      *   *Fails*: Ambiguous "extraordinary" (orthodoxy vs. inherent implausibility - your concern). R3 (What's "extraordinary evidence" for absence?). R4/R7 (Biased towards orthodoxy). R6 (Silent). R8/R9/R10 (Unaddressed).
  3.  **Consensus & Peer-Review:**  
      *   *Scores Well*: None directly. (Contradicts R4/R7/Mirror Test).
      *   *Fails*: R4/R7 (Measures sociology, not claim structure). R2 (Consensus can reject novel predictions). R6 (Assumes experts have access/knowledge you don't). R1/R3/R5/R8/R9/R10 (Unaddressed or contradicted).
  4.  **Imitative Scholarship Test (Surface vs. Substance):**  
      *   *Scores Well*: R9 (Directly targets it). R1 (Often reveals shields - "they ignore the *real* sources"). R2 (Reveals if "predictions" are fake). R4/R7 (Works impersonally). R10 (Often quickly checkable: trace 1-2 citations/methods).
      *   *Fails*: R3 (Less direct on absence). R5 (EVI not directly addressed). R8 (Evolution not directly addressed, though stagnation often apparent in imitation). R6 (Can sometimes indicate "cannot tell" if sources truly inaccessible).

  ### The Triage Rule (Synthesized)
  For a claim C:
  1.  **Run Mirror Test:** Apply steps 2-5 pretending the claimant is prestigious and critics are amateurs. Does verdict change? If yes, **Dismiss (Sociology)**. Else proceed.
  2.  **Check for Unfalsifiable Shields:** Does rejecting C require disproving claims about vast conspiracies, universal data manipulation, or inherently undetectable forces? If yes, **Dismiss (Unfalsifiable)**.
  3.  **Check for Imitation Scholarship:** Pick 1-2 key citations/arguments. Can you find/access the source? Does it support the claim? Is their method clear/reproducible? If citations misrepresent sources or methods are opaque/uncopyable, **Dismiss (Bad Scholarship)**.
  4.  **Assess Novel Predictions/Trajectory:** Does C suggest *new, specific* evidence to look for? Has the program evolved based on critique/data? If no new predictions *and* static defenses, **Park/Low Priority**.
  5.  **Handle Absence of Evidence:** Is C's key evidence missing? Could loss/destruction/non-creation explain this plausibly? If no *positive* evidence against C exists AND absence is plausible, **Park/Cannot Tell**. If absence is *expected* under orthodoxy and *surprising* under C, that counts against C.
  6.  **Estimate EVI & Decide:** Given time (max 1hr):
      *   If C seems highly improbable *and* wouldn't change much if true -> **Dismiss**.
      *   If C is improbable *but* revolutionary if true -> **Spend Time** checking R2/R3/R9 deeper.
      *   If R1-R5 pass but evidence is inaccessible to you -> **Park/Cannot Tell**.
      *   If C makes specific novel predictions you *can* check later (e.g., new dig results) -> **Park (Monitor)**.

  This rule prioritizes structural flaws (falsifiability shields, imitation scholarship) detectable with your resources, uses the Mirror Test to enforce impartiality, explicitly handles absence of evidence, incorporates the frozen claim observation, separates claim from claimant, allows for "cannot tell," and factors in the value of being right vs. investigation cost. It quickly dismisses the hardest cases (Aliens, Fomenko) on R1/R9, handles the lead seal case consistently on procedure (R9) regardless of outcome, and acknowledges the limits of silence (Destroyed Archive).
