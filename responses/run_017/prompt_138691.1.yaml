prompt: |-
  Hey — I host a small podcast on formal epistemology (mostly grad students listen, plus a few undergrads who wander in from decision theory) and next week's guest is a philosopher who's just published a paper defending *Reflection* as the more basic diachronic norm: the idea being that if you get van Fraassen's principle right, conditionalization falls out of it rather than the other way round, so a lot of the usual back-and-forth about whether conditionalization is really a requirement of rationality is secretly a fight about Reflection. I've read the abstract and maybe half the paper properly and I keep loseing the thread in the technical middle bit, so I want to go in with a plan. I've got about 40 minutes with her.

  Here's what I need: eight interview questions, each with a follow-up keyed to the answer she's most likely to give, and where useful a second follow-up for when she declines to bite. You can assume she'll state the principle herself in the first five minutes (current credence in P, supposing your future credence in P will be r, should be r) and that she'll give the diachronic Dutch book argument, so please definately don't write questions that just invite her to restate either — and no "what got you into formal epistemology" warm-ups, I can do those myself. The stuff I want pressed: (1) the cases where you know in advance that your future self will be epistemically impaired — the drug / brainwashing ones, but also the boring version where you know you'll be sleep deprived or reading a dossier someone has stacked against you; she'll probably say Reflection only constrains deference to future selves you regard as better informed, so the follow-up should make her say exactly how that restriction gets stated without making the principle vacuous, and whether the restricted version still delivers conditionalization. (2) The formulation worry: Reflection as usually stated has you conditioning on your having *exactly* some credence, which looks like conditioning on something you assign probability zero, and there's a weaker "in expectation" version that dodges this — does the Dutch book argument need the pointwise version or does the expectation version carry it, and if it doesn't, what's carrying the normativity? (3) What the diachronic Dutch book is actually supposed to show: if the argument only works because a bookie can exploit the *plan* you'd endorse now, then Reflection looks like a constraint on plans rather than on future credences, and I want a question that makes her say whether she's happy with that and what an argument for Reflection would look like that isn't plan-based — e.g. whether the accuracy / epistemic-utility arguments for conditionalization can be run for Reflection without just piggybacking on the conditionalization result. (4) Self-locating and forgetting cases: you fall asleep and lose information, or you learn only which centered possibility you're in; does Reflection even have a well-formed statement there, and should it be a norm on your earliest self, your current self, or both? (5) A thing I've been chewing on with a friend and can't work out, which I've been calling *deference-with-discount*: instead of deferring to your expected future credence, defer to it minus the bias you can already predict in it (you know that tomorrow you'll have read three alarming headlines and will overreact). Does that collapse back into conditionalizing on a corrected likelihood, or is it a genuinely different norm that's weaker than Reflection but stronger than nothing? If it's the latter, is that a point against Reflection being basic?

  One last thing: for the three questions you think are hardest, add a short note on where her most likely answer is actually *good* — i.e. what she could say that would make the line of questioning collapse, what would count as her having answered rather than deflected, and any place where the question secretly assumes something she'd reject (like that your expected future credence function is well defined, or that the Dutch book argument is meant as a pragmatic rather than evidential argument). I'd rather walk in knowing which of my questions might just die on contact than find out live.
