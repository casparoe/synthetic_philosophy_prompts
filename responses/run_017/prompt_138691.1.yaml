answer: |-
  Here are eight focused interview questions, each with tailored follow-ups, designed to press the specified philosophical and technical issues. The follow-ups anticipate likely responses and include secondary follow-ups for deflection. Notes on the three hardest questions (3, 7, 8) identify potential collapse points, deflection risks, and hidden assumptions.

  ---

  ### **Question 1: Known Epistemic Impairment**  
  **Main:** In cases where you know your future self will be epistemically impaired (e.g., sleep-deprived or exposed to a stacked dossier), your paper suggests Reflection only binds when you regard that future self as "better informed." How do you formally define "better informed" to avoid vacuity—e.g., without collapsing into triviality or requiring omniscience?  
  **Likely Follow-up (if she clarifies):** If "better informed" means strictly gaining evidence, doesn’t this exclude cases like forgetting or misleading evidence? And does this restricted Reflection still entail conditionalization in standard learning scenarios?  
  **Deflection Follow-up (if she avoids):** Couldn’t an adversary argue your restriction is circular? For instance, if "better informed" just means "worthy of deference," doesn’t that render Reflection tautological?  

  ---

  ### **Question 2: The Boring Impairment Problem**  
  **Main:** For "boring" impairments like reading a biased dossier, where you know the *direction* but not the exact content of future misinformation, does Reflection demand you defer to your future self anyway? If not, how do you formally model the required foreknowledge without over-intellectualizing agents?  
  **Likely Follow-up (if she denies deference):** If you adjust for known bias here (e.g., discounting future credences due to the dossier), doesn’t that resemble *corrected* conditionalization? How does this square with Reflection being *more basic*?  
  **Deflection Follow-up (if she bites):** Does your view imply Reflection is inert in real-world cases—where agents rarely know future impairments with precision?  

  ---

  ### **Question 3: Pointwise vs. Expectation Formulations**  
  **Main:** Reflection’s standard formulation requires conditioning on a *point credence* (e.g., "Cr₀(P | Cr₁(P)=r) = r"), which risks conditioning on measure-zero events. You mention the "in expectation" alternative (E[Cr₁(P)] = Cr₀(P)). Does the Dutch book argument for Reflection require the pointwise version?  
  **Likely Follow-up (if she rejects pointwise):** If the Dutch book fails for expectation-based Reflection—since bookies exploit *actual* credences, not averages—what grounds its normativity? Is it purely epistemic (e.g., accuracy), and if so, how?  
  **Deflection Follow-up (if she endorses pointwise):** How do you reconcile pointwise Reflection with the technical problem of conditioning on zero-probability events? Do you invoke generalized conditioning (e.g., Jeffrey shifts)?  
  **Note (Hard Question):**  
  - **Collapse Point:** If she argues the Dutch book *does* work for the expectation version (e.g., by framing bets as plans over *distributions* of future credences), the worry dissolves.  
  - **Deflection Risk:** If she dismisses Dutch books altogether (e.g., "they’re pragmatic, not epistemic"), the argument shifts to whether pragmatism is essential to her case.  
  - **Hidden Assumption:** The question assumes Dutch books are the *only* normative anchor—but she might ground Reflection in accuracy alone.  

  ---

  ### **Question 4: Dutch Books as Constraints on Plans**  
  **Main:** The diachronic Dutch book for Reflection exploits your *current endorsement* of a plan (e.g., "bet if Cr₁(P)=r"). Doesn’t this show Reflection is fundamentally a norm about *planning*—not about future credences directly?  
  **Likely Follow-up (if she agrees):** If Reflection governs plans, how does it constrain future credences *after* you learn Cr₁(P)=r? Must future you "ratify" the plan, risking infinite regress?  
  **Deflection Follow-up (if she disagrees):** Without plans, how can Dutch books target Reflection violations? If the bookie simply observes your credences, synchronic Dutch books suffice.  

  ---

  ### **Question 5: Accuracy Arguments for Reflection**  
  **Main:** Accuracy arguments justify conditionalization via *immodesty* (minimizing expected inaccuracy). Can you run a parallel argument for Reflection without presupposing conditionalization—e.g., by showing it minimizes expected inaccuracy *from your current perspective*?  
  **Likely Follow-up (if she sketches one):** Doesn’t this assume your future credence function is *measurable* now? And if future credences are random variables, does this reduce to Reflection "in expectation"?  
  **Deflection Follow-up (if she leans on conditionalization):** If accuracy-based Reflection *requires* conditionalization, how is Reflection more basic?  

  ---

  ### **Question 6: Conditionalization as Derived**  
  **Main:** You claim conditionalization "falls out" of Reflection. But in standard models, conditionalization also implies Reflection. What breaks the symmetry? Is there a model where Reflection holds but conditionalization fails?  
  **Likely Follow-up (if she offers one):** In such a model, doesn’t Reflection permit "irrational" credence shifts (e.g., mis-updating on unchanged evidence)?  
  **Deflection Follow-up (if she denies symmetry):** What does Reflection *add* that conditionalization lacks, if both norms are equivalent in common cases?  

  ---

  ### **Question 7: Self-Locating Beliefs and Forgetting**  
  **Main:** In forgetting or self-locating cases (e.g., Sleeping Beauty), your future self has *less* information or centered uncertainty. Does Reflection apply here? If so, how—e.g., should your pre-forgetting self defer to your post-forgetting self?  
  **Likely Follow-up (if she endorses deference):** If Beauty defers to her future self upon waking (who forgets the coin flip), she violates conditionalization. Doesn’t this pit Reflection against other norms?  
  **Deflection Follow-up (if she rejects deference):** Does Reflection only bind "later" selves? If so, how do you define temporal ordering in centered time?  
  **Note (Hard Question):**  
  - **Collapse Point:** If she argues Reflection *constrains only current self-forcasting* (e.g., "How do I *now* expect my future credences to behave?"), self-locating cases become tractable.  
  - **Deflection Risk:** She might reframe Reflection as agent-relative (e.g., "defer to *your* future selves, not centered counterparts").  
  - **Hidden Assumption:** The question assumes a unified "self" over time—but she might reject this in centered worlds.  

  ---

  ### **Question 8: Deference-with-Discount**  
  **Main:** Consider *deference-with-discount*: setting Cr₀(P) = E[Cr₁(P)] - δ, where δ is predicted bias (e.g., "tomorrow’s overreaction"). Is this a viable alternative to Reflection? Or does it collapse into conditionalizing on a higher-order belief (e.g., "I’ll be biased")?  
  **Likely Follow-up (if it collapses):** If discounting reduces to standard conditioning, doesn’t that *support* conditionalization as basic?  
  **Deflection Follow-up (if it’s distinct):** If discounting is rational and weaker than Reflection, why is Reflection "basic" rather than overstrong?  
  **Note (Hard Question):**  
  - **Collapse Point:** If she argues discounting *is* conditionalization on a "bias model" (e.g., P(bias|evidence)), the distinction vanishes.  
  - **Deflection Risk:** She might reject discounting as incoherent (e.g., "bias isn’t linearly separable").  
  - **Hidden Assumption:** The question assumes δ is quantifiable—but she might deny bias is additive.  

  ---

  ### **Recommended Flow**  
  1. Open with **Q1–Q2** (impairment) to set up restrictions.  
  2. Transition to **Q3–Q4** (formality/Dutch books) and **Q5–Q6** (accuracy/derivation).  
  3. Close with **Q7** (self-locating) and **Q8** (discounting) as novel challenges.  
  **Timing:** Allot ~4 min per "main + follow-ups" block (total ~32 min), leaving buffer for elaboration.  

  **Pre-Interview Prep**: For Q3/Q7/Q8, rehearse the "collapse points" to pivot or probe deeper if she neutralizes the tension. If she rejects Dutch books (Q3) or unified selves (Q7), shift to her positive account of normativity.
