answer: |-
  **ONTOLOGY COMPLIANCE GROUP**  
  **ADJUDICATION MEMORANDUM OCG-2024-007**  
  **RE: REVISED SCHEDULE OF COMPENSABLE EVENTS UNDER THE REALIST FRAMEWORK**  
  *Effective: Next Quarterly Maintenance Window*  

  **1. PREAMBLE**  
  Pursuant to Resolution 45-B (Formal Adoption of Computational Realism), and subsequent Directive 12 (Operationalizing Object-Permanence Accountability), the Ontology Compliance Group Board (hereinafter "the Board") issues this revised Schedule of Compensable Events. The Schedule addresses emergent obligations under the Realist Line: that in-world objects are genuine computational entities possessing persistent identity, causal efficacy, and physics-engine-tracked state, distinct from their transient renderings. This Schedule establishes standardized remedies for events causing quantifiable harm to such entities or their rightful claimants.  

  **2. DEFINITIONS**  
  2.1. **Object**: A distinct computational pattern instantiated within Meridian’s physics engine, possessing a unique persistent identifier (UPID), collision properties, and state variables.  
  2.2. **Rendering**: The transient sensory output generated from an Object’s state, contingent on client hardware, user settings, and draw distance. Non-compensable ephemera.  
  2.3. **Harm**: An unauthorized or unintended alteration to an Object’s state or UPID persistence resulting in quantifiable diminution of its causal potential or designated utility.  
  2.4. **Claimant**: The user-account holding demonstrable Ownership Rights (per Asset Ledger Protocol) over the Object at the time of the Harm-inducing Event.  
  2.5. **Event**: A discrete interaction, system process, or moderation action triggering a compensable Harm as defined herein.  

  **3. REVISED SCHEDULE OF COMPENSABLE EVENTS & STANDARDIZED TARIFFS**  
  **3.1. Object Harm Events**  
  *   3.1.1. **Destruction (Irreversible State Collapse)**: Full Base Value (BV) + Sentiment Adjustment (SA, max 15% BV). *Example: Sword shattered beyond engine-repair.*  
  *   3.1.2. **Degradation (Reversible State Impairment)**: 20-75% BV (sliding scale based on restoration cost/complexity). *Example: Shield durability reduced to 10%. Requires recalibration.*  
  *   3.1.3. **Unauthorized Duplication (Pattern Replication Violation)**: 150% of duplicated Object’s BV, payable to original Claimant. Duplicate subject to immediate pattern-invalidation. *(See Worked Example A).*  
  *   3.1.4. **Theft (Illicit Ownership Transfer)**: 100% BV + SA (max 10% BV). **Ruling:** Theft constitutes harm via *temporary deprivation of utility/access*, not ontological annihilation. Restoration from snapshot is *resurrection of the original Object* (UPID continuity preserved via ledger), not replacement. Subsequent discovery of illicit duplicate triggers 3.1.3.  
  *   3.1.5. **Offline Destruction/Degradation (Event During Claimant Inactivity)**: Full tariff under 3.1.1 or 3.1.2 applies. **Ruling:** Harm is object-directed. The Object’s state alteration is real irrespective of concurrent user experience. Compensation reflects loss of *potential* utility/interaction upon return. SA capped at 5% BV.  

  **3.2. Systemic & Procedural Events**  
  *   3.2.1. **Orphaned Object Depopulation (Scheduled Deletion of Unperceived/Unclaimed Objects)**: **Ruling:** Classified as **"Ambient Depopulation"**. Standard tariff: **0.00% BV**. **Rationale:** Orphaned Objects (procedurally generated terrain features, entities in unvisited regions) lack designated Claimants. While objectively destroyed, no compensable harm occurs absent a registered interest. Deletion is a necessary system maintenance function.  
  *   3.2.2. **Nested Simulation Harm (Harm within VR Rig operated inside Meridian)**: **Ruling:** Applies **Recursive Depth Discount (RDD)**. Compensation = (Base Tariff) * (0.90)^Depth. Depth 1 = VR Rig inside Meridian. Depth 2 = Object within *that* VR Rig's simulation, etc. *(See Worked Example B).* **Rationale:** Objects within nested simulations are computationally derivative entities. While real *within their frame*, their causal scope is intrinsically bounded by the hosting layer's resources and abstraction. The Board's commitment to computational structure necessitates this diminishing ontological weight.^1  

  **3.3. Avatar Integrity Events**  
  *   3.3.1. **Avatar Injury (Non-Fatal State Impairment)**: Treated as Object Degradation (3.1.2) applied to the Avatar entity. Compensation payable to User-Account Claimant. **Ruling:** Avatars are Objects with complex utility (user interaction). Harm to the Avatar is harm *to the Avatar Object*, not directly to the user. User distress is non-compensable experiential rendering.  
  *   3.3.2. **Avatar Fatality (Irreversible Avatar State Collapse)**: Full Avatar Recreation Cost (ARC) + 10% SA. Does *not* constitute harm to the user.  

  **4. VALUATION FRAMEWORK**  
  4.1. **Base Value (BV)**: Calculated via Resource-Cost-Accrual (RCA): Sum of persistent server resources (storage, simulation complexity weight, network tracking overhead) consumed by the Object since instantiation, depreciated 2% per Meridian-month.  
  4.2. **Sentiment Adjustment (SA)**: **Motivation Recognition:** Acknowledging the Realist Line's core aim – preventing epistemic vertigo and moderation arbitrariness by grounding virtual objects in persistent computational substrate – SA quantifies the *verified disruption to the user's intended interaction narrative* caused by the Object's harm. This respects the user's *real* project within the *real* computational environment, without conflating Object and experience.  

  ---

  **WORKED EXAMPLES**  

  **Example A: Unauthorized Duplication (Clause 3.1.3)**  
  *   **Event:** User `X` illicitly copies `Y`'s unique "Crimson Anvil" (UPID: Mer-45T7-889Z) via exploit. Duplicate detected (UPID: Mer-45T7-889Z-COPY-01).  
  *   **Adjudication:**  
      *   Duplicate invalidation triggered.  
      *   Compensation owed to `Y`: 150% of Crimson Anvil's BV (calculated via RCA).  
      *   `X` fined per Conduct Policy 8.3.  

  **Example B: Nested Simulation Harm (Clause 3.2.2)**  
  *   **Event:** Within a Depth 1 VR Rig (a functional "Metaverse Cafe" Object in Meridian), User `A`'s Avatar (Depth 1 Entity) accidentally destroys User `B`'s virtual "Epic Toaster" (Depth 2 Entity) inside the Cafe's simulation. Epic Toaster BV (Depth 2) = 100 Units.  
  *   **Adjudication:**  
      *   Base Tariff (Destruction, 3.1.1): 100 Units (BV) + 5 Units (SA, 5% cap) = 105 Units.  
      *   Apply RDD: Depth = 2. Compensation = 105 * (0.90)^2 = 105 * 0.81 = **85.05 Units**.  
      *   Payable by `A` (or insurer) to `B`.  

  ---

  **APPENDIX A: CROSS-REALITY JURISDICTION ADVISORY**  

  **Event:** User `Z` sustains a physical wrist fracture (IRL) while reaching for a physical cup, momentarily distracted by the real-time rendering of their Meridian Avatar dodging a virtual boulder.  
  **Classification:** Not a Compensable Event under this Schedule.  
  **Rationale:**  
  1.  The physical cup and the user's biological state are outside Meridian's computational ontology.  
  2.  The Avatar dodging is a rendering event, not an Object state alteration causing Harm.  
  3.  The distraction is a user-mediated cross-reality perceptual interaction. While regrettable, it falls under "Real-World Interface Management (RWIM)", governed by ToS Section 14 (User Physical Environment Safety), not Object Harm. Recommendation: Ergonomic review per Facilities Compliance.  

  ---
  **^1 Dissent (Board Member Kaine):** The RDD arbitrarily diminishes the reality of nested entities. If computational instantiation *is* the criterion for reality, a Depth 2 Object *is* as real within its frame as a Depth 0 Object. The 90% discount lacks ontological justification and appears solely actuarial. Majority counters: Frame-dependence *is* an intrinsic computational property. Ignoring it leads to infinite regress liability (e.g., compensating a Matryoshka-doll universe of nested simulations at full value per layer). RDD preserves system coherence.  

  **ISSUED BY:**  
  Ontology Compliance Group Board  
  Meridian Persistent Virtual Environment  
  *"Tracking Existence, Pixel by Persistent Pixel."*
