answer: |-
  ### Dissertation Fellowship Proposal: Two Routes to Rule-Following Skepticism  
  **Project Title:** The Collapse Argument: A Distinct Path to Kripkenstein’s Skeptical Conclusion and Its Implications for Response Taxonomies  

  **Core Research Question:**  
  Are Kripke’s underdetermination argument (UA) and the collapse argument (CA) *structurally independent* routes to rule-following skepticism? If so, does the standard taxonomy of responses—which classifies solutions as either *factualist* (seeking meaning-constituting facts) or *assertibilist* (redefining meaning in terms of warranted assertibility)—fail to address CA, thereby requiring a reassessment of which solutions survive which argument?  

  **Hypotheses (Definitive Commitments):**  
  1. **Independence Thesis:** CA is *not reducible* to UA. UA exploits the *finitude* of past applications to show that no finite history fixes a unique rule. CA exploits *domain exhaustion*: even exhaustive application within a bounded domain (e.g., pricing rules for orders of 1–99 units) fails to determine which of two extensionally equivalent rules (e.g., "add 2" vs. "add 2 unless >99, then charge 5") is being followed, because no further applications are possible.  
  2. **Taxonomy Failure Thesis:** The standard taxonomy addresses UA but *silently misfires* on CA. Factualist responses (e.g., dispositions, mental states) and assertibilist responses (e.g., community agreement, idealized conditions) resolve UA but collapse against CA. Only *use-theoretic* responses (where meaning is constituted by actual practice within a domain) withstand CA.  
  3. **Boundary Objection Response:** The objection that CA reduces to UA (because domain boundaries are themselves rule-governed) is *false*. Bounded domains (e.g., "≤99") are fixed by *non-rule-constituted constraints* (e.g., physical inventory limits), not by further rules. Thus, CA attacks rule-following even when boundary indeterminacy is precluded.  

  **Why Existing Positions Leave This Open:**  
  Current literature treats skepticism as monolithic, assuming UA exhausts the challenge. Factualists (e.g., dispositionalists) rebut UA by appealing to non-actualized facts (e.g., "I would have said 125 for 68+57"), while assertibilists (e.g., communitarians) reinterpret meaning as socially warranted assertion. Yet neither engages CA:  
  - Dispositions fail because, in a bounded domain, no disposition exists for out-of-domain cases (e.g., no fact about what I "would do" for 100+ units).  
  - Communitarians fail because assertibility conditions cannot form where no application is possible (e.g., no community agreement exists for impossible cases).  
  This gap arises because solutions presume UA’s framework—where future applications resolve indeterminacy—but CA eliminates that possibility. No systematic analysis contrasts the two arguments or tests solutions against both.  

  **Methodology: A Diagnostic Approach (Not Survey or Solution-Building):**  
  This project rejects a critical survey of existing literature or advancing a new solution. Instead, it employs a *diagnostic triage* of responses across UA and CA:  
  1. **Argument Isolation (Months 1–4):**  
     - Construct UA and CA as formal models, proving their independence: UA relies on the open-endedness of rules ("+"), CA on domain closure (e.g., "shop_max=99").  
     - Test the boundary objection: Demonstrate that domain constraints (e.g., "≤99") are exogenous (e.g., deriving from empirical limits like shelf space), not rule-governed. If boundaries *were* rules, UA would apply—but in CA, they are givens.  
  2. **Response Stress-Testing (Months 5–8):**  
     - Apply the six dominant solution-types (dispositional, mentalist, reductionist, communitarian, inferentialist, use-theoretic) to both UA and CA.  
     - Measure failure/success: A solution "fails" if it cannot assign unique meaning to a rule (e.g., if "add 2" and "add 2 unless >99" remain indistinguishable).  
     - Focus: Why dispositionalism/communitarianism resolve UA but not CA (e.g., dispositions lack counterfactual traction in exhausted domains).  
  3. **Taxonomy Rebuild (Months 9–12):**  
     - Propose a new response-classification based on argument-sensitivity: Group solutions by whether they address UA-only, CA-only, both, or neither.  
     - Deliverable: A journal-ready paper arguing that use-theoretic approaches (e.g., defining meaning by domain-internal practice) uniquely survive CA.  

  **Why This Method?**  
  Alternatives are unfit: A critical survey would not resolve the independence question; a new solution would ignore how CA exposes latent flaws in existing frameworks. Diagnostic triage directly tests the hypotheses, mapping solutions to arguments—a novel contribution.  

  **Possible Conclusions and Decidability:**  
  - **Confirmation:** If CA withstands the boundary objection and solutions divide as predicted, the theses hold. This is decided by showing UA-solutions fail CA under formal modeling.  
  - **Refutation:** If CA reduces to UA (e.g., boundaries are always rule-governed), the project collapses. Decided by analyzing domain constraints: If they require further rules (e.g., "what counts as shop inventory?"), UA absorbs CA.  
  - **Refinement:** If CA is independent but only *some* factualist/assertibilist responses fail, the taxonomy is revised (e.g., communitarianism may adapt). Decided by stress-test outliers.  
  *Decision hinges on boundary analysis*: Empirical boundedness (e.g., "maximum possible order = 99") vs. rule-boundeness (e.g., "orders >99 are invalid") will be rigorously modeled.  

  **Feasibility: One Year, Not Three**  
  This is a year’s work. The scope is tightly focused on two arguments and six solution-types. Formal modeling (e.g., logic frameworks for bounded rules) and existing solution blueprints allow efficient triage. The 12-month timeline is viable because:  
  - The core analysis is argument-driven, not historical; no comprehensive literature review is needed.  
  - Deliverables are discrete: isolation (1 paper), stress-testing (1 paper), taxonomy (1 paper).  
  - *Risk*: If the boundary objection succeeds, the project concludes early with a significant negative result (CA = UA). This is still a valuable output.  

  **Commitment to Impact:**  
  This project does not solve skepticism but reveals a blind spot in 40 years of debate: Solutions targeting UA may be irrelevant to exhausted domains (e.g., legal rules with fixed scopes, bounded algorithms). By decoupling two paths to skepticism, it forces a reckoning with what "meaning" requires when rules face closure.  

  ---  
  **Proposal Length:** 2 pages (as requested).  
  **Deliverable:** A unified manuscript, "The Collapse Argument: Rule-Following After Domain Exhaustion," synthesizing all phases.  
  **Word Count:** ~1,200 (excluding header).
