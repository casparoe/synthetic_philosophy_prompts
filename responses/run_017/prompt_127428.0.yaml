answer: |-
  ## Ask the Growth Rate  
  *Maximizing your life’s compounding potential, one multiplicative decision at a time.*

  **Dear Growth Rate,**
  My weekly poker group is soft. After tracking my results for six months, I estimate I have a 55% win probability against the field when I’m on my game. The typical pot offers 1:1 odds on my call (I risk $X to win $X). I have a dedicated $10,000 bankroll for this. How much should I put in each week?
  — Ace in the Hole

  **Dear Ace,**
  Congratulations on identifying an edge! This is a classic candidate for the Kelly Criterion. The formula for the optimal fraction of your bankroll (*f*) to wager is simple: *f* = (bp - q) / b, where *b* is the net odds received on the bet (1, in your case, since you win $1 for every $1 risked), *p* is your win probability (0.55), and *q* is your loss probability (0.45). Plugging in: *f* = (1 * 0.55 - 0.45) / 1 = 0.10. Kelly says wager 10% of your bankroll.

  However, you state your edge is *estimated*. Estimation error is the silent killer of bankrolls. The true *p* could easily be 52% or 58%. Betting full Kelly when your edge is uncertain is reckless – a slight overestimation drastically increases your risk of ruin. This is why we apply the **Fractional Rule**: bet only a fraction of the calculated Kelly fraction. The standard conservative approach is 1/4th Kelly. Therefore, your weekly bet should be 0.10 / 4 = 0.025, or 2.5% of your current bankroll. Start with $250 (2.5% of $10,000). Recalculate this dollar amount based on your updated bankroll *before* each session. This maximizes your long-run growth rate while protecting you from the inevitable uncertainty in your edge estimate. Remember, preserving capital to play another day is paramount.

  **Dear Growth Rate,**
  I’ve been offered a chance to flip a condo. I’d put in $100,000 of my $150,000 savings. My contractor friend says there’s a 60% chance we double the money ($200,000 return) in 6 months and a 40% chance things go wrong and I lose half ($50,000 return). The expected profit looks good! Should I take it?
  — Flipping Out

  **Dear Flipping,**
  No. Emphatically no. While the expected value is positive (0.6 * $100,000 profit + 0.4 * -$50,000 loss = $40,000), expected value is an **ensemble average**. It tells you the average outcome if you could repeat this *exact* bet infinitely many times in parallel universes. You are not making this bet infinitely many times. You are making it **once**. This is a one-shot, non-repeatable gamble. The Kelly Criterion, and the entire edifice of log-growth optimality, is built for repeated, multiplicative decisions where you can rebalance based on outcomes. Your bet has a **reup number of 1**.

  Consider the multiplicative impact: Success grows your savings by a factor of ($250,000 / $150,000) ≈ 1.67. Failure shrinks it to ($100,000 / $150,000) ≈ 0.67. The *growth factor* is (1.67)^0.6 * (0.67)^0.4 ≈ 1.12, meaning a positive *expected* growth rate. But this is irrelevant! You only get one outcome. You have a 40% chance of suffering a 33% loss to your life savings. That loss is catastrophic and unrecoverable *for your single path*. Log-utility avoids ruin asymptotically *because* it can diversify across many bets. A single massive bet offers no such protection. The potential multiplicative shock to your bankroll is simply too large and unresolvable. Protect your bankroll. Decline.

  **Dear Growth Rate,**
  I’m 71 and financially comfortable. My advisor wants me mostly in stocks for long-term growth. But I don’t have decades! Should I really prioritize long-run compounding? My children are independent.
  — Golden Years Glimmer

  **Dear Golden,**
  This exposes a crucial nuance. The asymptotic dominance of the log-optimal strategy – that it surpasses any other strategy with probability 1 *given infinite time* – indeed requires time you statistically lack. However, the framework isn’t rendered useless; it requires reframing the **bankroll definition**.

  Is your bankroll solely *your* remaining lifetime spending? Or does it encompass the legacy you pass on? If the latter, the relevant time horizon extends through your beneficiaries. Your "bankroll" becomes generational wealth. The log-optimal strategy, applied to this multi-generational portfolio, still seeks to maximize the *long-run* growth rate of the lineage's capital. Stocks, despite short-term volatility, offer the highest *expected* long-term growth rate (geometric mean return) for capital that can remain invested beyond your lifetime.

  However, the **Fractional Rule applies critically here too**. The volatility drag on finite sequences is real. While the asymptotic argument weakens for your *personal* 20-year horizon, shifting entirely to low-growth assets (like cash) guarantees suboptimal growth for your lineage. A balanced approach – perhaps a fractional Kelly allocation towards equities relative to the theoretical maximum your risk tolerance *would* allow if you were immortal – is prudent. Consider your risk tolerance for your own needs first, then allocate the legacy portion for growth. The log-optimal principle guides the *destination* (max geometric mean), but the fractional approach navigates the *finite journey*.

  **Dear Growth Rate,**
  My husband and I are happy with one child. We can afford a second comfortably, but it would mean less individual attention and slightly less saved for college per child. Is there a growth-optimal perspective on family size?
  — Pondering Parenthood

  **Dear Pondering,**
  Absolutely. Children represent investments in your household's future productive capacity – its ultimate "wealth." This wealth is multifaceted: financial support potential, caregiving networks, genetic/cultural legacy, and pure utility. Critically, these returns are multiplicative across the lineage and inherently diversified. A second child significantly diversifies your household's biological and social "portfolio."

  While the upfront costs (attention, resources) are multiplicative drains on your current capacities, the long-term growth potential of the lineage compounds multiplicatively across *two* branches instead of one. The diversification benefit is profound: the risk of a catastrophic loss of lineage potential (e.g., through a single child's incapacity, estrangement, or lack of progeny) is greatly reduced. The future growth rate of the family's overall "utility" or "legacy potential" becomes the geometric mean of the growth rates along both branches. Adding uncorrelated (or low-correlation) positive-growth assets (children) to a portfolio *increases* its geometric mean return, assuming the assets have positive expected growth. Your existing child is your core holding. A second child, assuming you can provide a positive-growth environment (love, stability, opportunity), is a diversifying asset with a high **reup number** (you only add children a few times, but their impact compounds for generations). The fractional rule? You’re already applying it by choosing two, not ten. Within reasonable bounds, maximizing the *diversified growth potential* of the lineage favors expansion.

  *Priya manages her household’s growth-optimal portfolio and has never lost a reup-number argument (verified). Send your dilemmas to askthegrowthrate@chronicle.com.*
