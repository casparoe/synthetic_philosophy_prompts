  Hmm, the user is one of five trustees for a charitable trust with £180k annual income. They need to decide between funding a hospice-at-home nurse or two speculative long-term risk research groups. They've asked me to draft a two-page board memo with a clear recommendation.

  The user is a retired experimental physicist who only recently got into philosophy, so I need to keep the arguments plain and accessible. No jargon, no references requiring library access - everything must stand on its own. The key tension is between a certain, measurable good (hospice nurse) versus high-risk/high-reward future safeguards.

  That mathematician trustee has a point about Pascal's mugging. But the research group cleverly shifts focus to policy-level thinking - allocating a fixed portion annually to high-variance projects. This "repeated game" approach is interesting because it aggregates probabilities over time. 

  I should acknowledge the valid concerns about unverifiable probabilities while showing why the policy approach mitigates this. The trust deed's "reasonably ascertained" phrase is crucial here - it creates a natural barrier against funding completely unsubstantiated claims while allowing for reasoned judgment calls.

  The hospice alternative is important to address head-on. That nurse will provide concrete, immediate good. But £60k to hospice is about 1/3 of annual allocation, while 10% for speculative work would be £18k/year - much less disruptive. 

  For the memo structure: First page should frame the dilemma clearly. Second page needs to analyze the policy proposal's merits, address the fanaticism worry (does shifting to policy level really solve it?), interpret the deed's wording, then give a specific capped recommendation with review mechanism.

  Recommendation should be: Allocate 10% annually (£18k) to a high-variance strand for 3 years, with mandatory review. This answers the mathematician's consistency concern (since they've funded tail-risk before), satisfies the research group's core request for policy-based allocation, but caps exposure. Declining both individual £60k asks as too large for unverifiable claims.

  The "reasonably ascertained" language does real work - it means we can't fund pure speculation, but can support reasoned probabilistic arguments when aggregated at policy level. The fanaticism worry is relocated but not eliminated - that's why we need the cap and review.
answer: |-
  ## MEMORANDUM: TRUST DECISION ON SPECULATIVE VS. CERTAIN GRANTS

  **To:** Board of Trustees  
  **From:** [Your Name]  
  **Date:** [Date]  
  **Subject:** Recommendation on £60,000 Allocation: Hospice vs. Long-Term Risk Proposals  

  ### I. The Core Dilemma
  We face three applications for £60,000:
  1.  **Hospice-at-Home Specialist Nurse (£60,000 over 2 years):** Provides immediate, tangible, and certain palliative care. Impact is easily measured (patient numbers, quality-of-life metrics). This aligns directly with demonstrable, near-term good.
  2.  **Long-Term Risk Research Proposals (Two Groups, each £60,000):** Aim to mitigate poorly specified, low-probability, high-impact threats to civilization's long-term future. Impact is framed in expected value terms: tiny probabilities (1/10,000 - 1/1,000,000) of affecting tens of millions. Crucially, **one group proposes a policy shift**: allocate a fixed 10% (£18,000/year) of *annual income* to a "high-variance strand" via standing rule, bypassing case-by-case probability scrutiny.

  **The mathematician trustee's core objection ("Pascal's mugging") is strong:** Assigning meaningful probabilities to unique, complex, distant events is arguably impossible. Unverifiable probabilities can be manufactured to justify any ask, exploiting the vast potential stakes. Funding one such case risks opening the floodgates to poorly-substantiated claims, potentially diverting funds from known good.

  **The policy proposal counters:** At the *policy level*, assessing the *aggregate* potential of a *category* of interventions (high-risk, civilisation-scale safeguarding) is more robust than evaluating individual probabilities. A small, fixed allocation hedges against catastrophic tail risks across many potential threats over time. Consistency demands consideration, as we’ve previously funded pandemic prep (tail-risk) and buy insurance.

  **The deed's "reasonably ascertained" clause is pivotal:** It compels us to base decisions on evidence we can realistically evaluate. The hospice proposal satisfies this easily. The research proposals, individually, arguably do not – their probabilities resist reasonable ascertainment. The policy proposal claims this clause *favors* it, by focusing on the ascertainable aggregate value of a repeated strategy.

  ### II. Analysis: Policy vs. Case & The Fanaticism Worry

  *   **Does shifting to policy *answer* fanaticism?** **No, it *relocates* and *mitigates* it.**
      *   **Relocation:** The fanaticism concern (vast stakes justifying any cost based on unverifiable probabilities) moves from judging *"Is *this specific* 1/1,000,000 chance real?"* to judging *"Does maintaining a *category* of high-risk interventions at a *fixed, small scale* have sufficient *aggregate* expected value, even if no single project ever 'pays off'?"*
      *   **Mitigation:** The policy imposes crucial constraints:
          1.  **Fixed Cap (10%):** Limits exposure, preventing escalating demands.
          2.  **Aggregation:** Acknowledges that while no single probability is ascertainable, the *concept* that a portfolio of speculative bets *could* yield immense value over decades is plausible and harder to dismiss entirely.
          3.  **Focus on Process:** Shifts scrutiny to the *mechanism* for selecting projects within the strand (e.g., scientific rigor, threat credibility assessment framework) rather than impossible probability estimates per application.
  *   **Does "reasonably ascertained" do real work?** **Yes, decisively.**
      *   It **rules out funding the individual £60,000 research requests.** We cannot reasonably ascertain the claimed probabilities or their direct link to preventing catastrophe. The deed demands more than theoretical possibility or vast-stakes rhetoric; it demands evidence of impact we can realistically evaluate. These individual proposals fall short.
      *   It **permits, but does not mandate, the policy approach.** We *can* reasonably ascertain:
          *   The existence of credible arguments (from philosophy, decision theory, historical near-misses) that safeguarding against long-term risks is a potentially high-value category.
          *   That a small, fixed allocation creates a manageable, diversified hedge.
          *   The quality of governance and selection criteria for the *strand* (if established).
      *   The clause **protects the trust.** It prevents us from being compelled to fund every impassioned plea about unverifiable existential risks based solely on potential stakes. It grounds us in evidence-based judgment.

  ### III. Recommendation & Rationale

  **Recommendation: Adopt a modified standing-rule "High-Variance Strand" at 5% of annual income (£9,000) for an initial 3-year pilot period.** Decline the hospice bid *for this specific £60,000 allocation round* and decline *both* individual £60,000 long-term risk requests.

  1.  **Why a "High-Variance Strand" (Policy Approach)?**
      *   **Mitigates Pascal's Mugging:** The capped, fixed allocation addresses the mathematician's core concern about unverifiable individual probabilities by shifting focus to aggregate, policy-level value and limiting exposure.
      *   **Hedges Tail Risk:** Provides prudent diversification beyond immediate, certain good, acknowledging the logic behind past decisions (insurance, pandemic prep).
      *   **Manages the Stream:** Creates a structured mechanism to handle future speculative applications within predefined boundaries.
      *   **Consistency & Principle:** Engages seriously with the argument for the *category* of intervention without being captured by any single unverifiable claim.

  2.  **Why 5% (£9,000/year) and not 10% (£18,000/year)?**
      *   **Proportionality:** 5% balances the potential aggregate long-term value against the immediate, certain good we forgo. £9,000/year is a more cautious starting point than £18,000/year, reflecting the inherent uncertainty.
      *   **"Reasonably Ascertained" Threshold:** It represents a sum where the *potential* aggregate benefit (given the arguments for the category) can be more readily deemed sufficient to outweigh the *certain* loss of immediate impact achievable with that sum elsewhere, fulfilling the deed's requirement at the policy level. A higher percentage becomes harder to justify as "reasonably ascertained" against known alternatives.
      *   **Preserves Core Mission:** Ensures 95% of income remains focused on demonstrable, near-to-medium-term impact, which is our primary and most reliable mandate.

  3.  **Why a 3-Year Pilot with Review?**
      *   **Accountability:** Mandates a formal assessment before continuation.
      *   **Ascertainment:** Allows us to evaluate if we *can* reasonably ascertain the strand's value *in practice*. Review criteria must be established upfront (e.g., quality of projects funded, development of selection criteria, broader field developments).
      *   **Flexibility:** Provides an off-ramp if the strand proves unmanageable, attracts low-quality applications, or fails to demonstrate credible pathways to impact.

  4.  **Why Decline the Hospice *for this £60k* and Individual Research Requests?**
      *   **Hospice:** While highly worthy, funding it *now* with this £60k precludes establishing the pilot strand with dedicated funds. Hospice services often have diverse funding avenues; this specific bid isn't our only opportunity to support such tangible good. We fund similar certain good regularly.
      *   **Individual Research Requests:** Funding either £60k request would validate the case-by-case Pascal's mugging approach we seek to avoid and set a precedent we cannot sustain. The requested sums are vastly disproportionate to the pilot strand cap.

  ### IV. Implementation

  1.  **Motion:** "Establish a 'High-Variance Strand' allocating 5% of annual trust income (£9,000 per year) for a 3-year pilot period (Total Commitment: £27,000). Funding within this strand will be allocated by the Board based on a standing rule prioritizing potential for mitigating severe long-term, large-scale threats to civilization. Selection criteria emphasizing credible theory, research methodology, and potential pathway to impact, *without reliance on quantified probabilities*, will be developed within 6 months. A comprehensive review of the strand's rationale, process, and outputs will be conducted at the end of Year 3 for a go/no-go decision on continuation."
  2.  **Immediate Action:** Decline the Hospice-at-Home bid *for this specific £60k allocation round*. Decline both individual £60k long-term risk research proposals.
  3.  **Next Allocation:** The remaining £51,000 from this half-year (£60k minus £9k for the strand) plus the next half-year's £90k will be allocated as usual at our next meeting, prioritizing applications with reasonably ascertainable near-to-medium-term impact.

  This recommendation embraces the valid insights of the policy argument while rigorously applying the "reasonably ascertained" safeguard of our deed. It allows us to explore a prudent hedge against catastrophic risks without compromising our core commitment to demonstrable good or falling prey to unverifiable claims on a case-by-case basis. The capped pilot with mandatory review provides essential discipline and an off-ramp.
