prompt: |-
  Hey — backend engineer, zero philosophy background, and I fell into a linguistics rabbit hole and got nerd-sniped: apparently "if A is the case, B is" (the kind where you dont know whether A holds) and "if A had been the case, B would have been" (the kind where you know it didnt) can come apart. Every example I can find goes the same direction: the plain version sounds fine, the "would have" version sounds wrong. I want one going the other way, because that's the direction I cant seem to build.

  Build me a case where, for one well-informed speaker with one fixed body of evidence:

  - the "if A had been the case, B would have been" version is clearly assertable, and
  - the plain "if A is the case, B is" version is clearly shaky or wrong — same A, same B, same speaker, same information, same moment; only the mood changes.

  Constraints:

  - One paragraph, realistic setting — a software team, an on-call rotation, a bad deploy, a data migration, whatever. No sci-fi, no scepticism, no demons.
  - Dont use the Oswald-style trick where some hard known fact forces B in every epistemically live A-world. I want the divergence to come from the other mechanism: there has to be a way A could be true that a reasonable colleague could actually take seriously (not brains in vats, not a perfect deceiver) but that is further from how things actually went than the way that makes the counterfactual true. Roughly: a live but comparatively remote route to A.
  - If the only reason the plain version sounds bad is that you wrote the speaker as knowing something odd or as being confused, that's cheating — the verdicts have to fall out of how the two kinds of conditional are evaluated, not be written into the character.

  Keep it tight, American English. Give me: (1) the paragraph; (2) the two sentences with the verdict on each; (3) how each of the two accounts I keep running into handles it — the one where an indicative is checked against the worlds compatible with what the speaker knows, and the Lewis/Stalnaker-flavored one where a counterfactual is checked at the closest worlds where A holds — with a note on where the remoteness does its work; (4) the single load-bearing feature of the scenario, and what happens if you remove it; (5) the best objection from someone who thinks there's really only one kind of conditional here, or that the two differs only in what information they get to use.

  Then repeat the verdict as a JSON object with exactly these fields: scenario (the paragraph as a string), indicative_sentence, counterfactual_sentence, indicative_assertable (yes/no), counterfactual_assertable (yes/no), epistemic_account_verdict (2–3 sentences), similarity_account_verdict (2–3 sentences), load_bearing_feature (one sentence), removal_effect (one sentence), unified_view_objection (2–3 sentences), cheat_check (one sentence: whether the verdicts are generated by the accounts or stipulated by the setup).
reasoning: |-
  We are building a scenario where:
    - Counterfactual (subjunctive) "If A had been, B would have been" is assertable.
    - Indicative "If A is, B is" is shaky or not assertable.

   Constraints:
    - Realistic setting (e.g., software team, on-call, deploy issue).
    - No Oswald-style (i.e., no hard fact forcing B in every A-world). We want a live but remote route to A that doesn't lead to B.
    - The divergence must come from the evaluation of conditionals, not from the speaker being confused.

   Approach:
    We need a scenario where:
      - In the actual world, A is false (so we can use counterfactual) and the speaker knows it.
      - There is a close world (the one we consider in the counterfactual) where A is true and B is true, and that is the closest A-world.
      - But there is also a remote, but still epistemically possible, world where A is true but B is false. This makes the indicative conditional shaky because the speaker must consider all epistemically possible A-worlds, including the remote one.

    However, note: the indicative conditional is evaluated against the worlds compatible with the speaker's knowledge. If the speaker knows that A is false, then the indicative conditional is often considered vacuously true or at least assertable? But that is not the case in natural language. Typically, when we know A is false, we don't use the indicative. However, we are asked for a scenario where the indicative is shaky even though the speaker doesn't know A? Actually, note: the speaker might not know A for sure? But in the counterfactual we are considering a situation where A didn't happen (so the speaker knows A is false). So, for the indicative, if the speaker knows A is false, then the indicative conditional is typically not used. But we are to have a scenario where the indicative is shaky even when we force it? 

    Alternatively, we can have a scenario where the speaker does not know for sure that A is false, but has strong evidence that it is. However, the problem states: "same speaker, same information, same moment". And we are to have the counterfactual assertable and the indicative shaky. 

    How about: the speaker is almost certain that A is false, but there is a small chance that A is true. In the counterfactual, we consider the closest A-world (which is one where A happened in a natural way, and in that world B is true). But in the indicative, we must consider all A-worlds that are compatible with the speaker's knowledge. Among those, there is a very remote (but still possible) A-world where B is false. This makes the indicative conditional shaky because it's not true in all epistemic possibilities.

    However, note: the counterfactual is evaluated by considering the closest A-worlds, which are the ones that are most similar to the actual world. In that close world, B is true. But there is another world that is less similar (but still compatible with the speaker's knowledge) where A is true and B is false. The speaker doesn't consider that world when uttering the counterfactual because it's too far-fetched, but when considering the indicative, that world is still on the table.

    So let's build a scenario:

    Scenario: A software team has a service that depends on a database. There are two independent failure modes that could cause a recent outage: 
      A = "the deploy script was run without the required flag" (which we'll call event A)
      B = "the database migration was not applied"

    The speaker (a backend engineer) has strong evidence that the deploy script was run correctly (with the flag) because the logs show the flag was present. However, there is a small chance that the logs were tampered with (by a disgruntled colleague, say, but without any evidence of tampering, just that it's theoretically possible). 

    The speaker also knows that if the deploy script was run without the flag (A), then typically the database migration would not be applied (B). But there is a very remote possibility: if the deploy script was run without the flag (A) but then the database migration was manually applied by someone (which has never happened before and is highly unlikely in their team), then B would be false (i.e., the migration would be applied).

    Now, the outage occurred. The speaker has investigated and found that the database migration was not applied (so B is true in the actual world). The speaker also found that the deploy log shows the flag was present (so A is false). But the speaker knows that the log could have been tampered with (though there is no evidence of tampering and it's highly unlikely). 

    The speaker wants to say: 
      Counterfactual: "If the deploy script had been run without the flag, the database migration would not have been applied." -> This is assertable because in the closest world where the deploy script was run without the flag, the migration would not have been applied (and that's what happened in the actual world too). The manual intervention is so remote that it's not considered in the counterfactual.

    But the indicative: "If the deploy script was run without the flag, then the database migration was not applied." -> This is shaky because the speaker must consider the possibility that the deploy script was run without the flag (because the log might be tampered) AND in that case, maybe someone manually applied the migration (so B would be false). Since the speaker doesn't know for sure that the log is genuine, they cannot rule out the scenario where A is true and B is false (though it's very unlikely). Therefore, the indicative conditional is not assertable because it might be that A is true but B is false.

    However, note: in the indicative, the speaker is considering the possibility that A is true (the log was tampered) and in that scenario, it is possible that someone manually applied the migration? But that manual application is independent and highly unlikely. The speaker's knowledge does not rule it out. Therefore, the indicative conditional is not true in all epistemic possibilities.

    But wait: the indicative conditional is usually taken to be true if in all worlds compatible with the speaker's knowledge where A is true, B is true. Here, there is a world (though remote) where A is true and B is false (because of the manual intervention). So the indicative is not assertable.

    On the other hand, the counterfactual is evaluated by looking at the closest A-worlds. In the closest world where the deploy script was run without the flag, we don't have manual intervention (because that's a further departure from actuality). So in that world, the migration is not applied (B is true). Therefore, the counterfactual is true.

    Now, the scenario:

    Paragraph:
      "After the service outage, we found the database migration wasn't applied. The deploy log shows the required flag was present, so we didn't run without it. But if we had run without the flag, the migration would have been skipped — that's how the script works. However, we can't completely rule out log tampering; and if someone tampered with the log and then manually applied the migration, we'd have the flag missing but the migration done. That's never happened, though."

    Sentences:
      Indicative: "If the deploy script was run without the flag, then the database migration was not applied." -> shaky (not clearly assertable)
      Counterfactual: "If the deploy script had been run without the flag, then the database migration would not have been applied." -> assertable

    Accounts:
      Epistemic account (indicative): The indicative conditional is true if in every world compatible with the speaker's knowledge in which the script was run without the flag, the migration was not applied. But the speaker's knowledge includes a world where the log was tampered (so the script was run without the flag) and then the migration was manually applied (so the migration was applied). Therefore, there is a world where A is true and B is false (B here is 'migration not applied', so false meaning applied). Hence the indicative is false in that world and so the indicative conditional is not true.

      Similarity account (counterfactual): The counterfactual is true if in the closest worlds where the script was run without the flag, the migration was not applied. The closest worlds are those that are minimally different from the actual world: in the actual world, there was no manual intervention and the log was genuine. So in the closest A-world, we change only the flag being present to absent, and we don't add the manual intervention (which would be a bigger change). Therefore, in that world, the migration is skipped (B is true). So the counterfactual holds.

    Load-bearing feature: The existence of a remote but epistemically possible scenario (log tampering plus manual migration) that makes A true and B false (for the indicative) but is too dissimilar to be among the closest A-worlds (for the counterfactual).

    Removal effect: If we remove the possibility of manual intervention (i.e., the only way for the migration to be applied is via the script), then both conditionals would be assertable. The indicative would be true because in any A-world the migration would not be applied. The counterfactual would be true for the same reason.

    Unified view objection: Someone who thinks there is only one kind of conditional might say that the counterfactual and indicative are both evaluated against the same set of worlds, but the counterfactual presupposes that A is false. In that case, they might argue that the indicative is inappropriate because the speaker believes A is false. However, the problem states that the speaker has the same information and we are to evaluate both. Alternatively, they might say that the remote possibility (tampering and manual intervention) should also be considered in the counterfactual, making it false too. But that would violate the constraint that the counterfactual is assertable.

    Cheat check: The verdicts are generated by the accounts (epistemic and similarity) and not stipulated by the setup. The setup provides the epistemic state and the similarity ordering.

