answer: |-
  ### Scenario
  During the post-mortem, we discovered the database migration wasn’t applied, causing the outage. The deploy log shows the required flag was present, confirming the script ran correctly. But if it **had run** without the flag, the migration would’ve been skipped — that’s how the script works. However, we can’t rule out log tampering; if someone tampered and then manually applied the migration, we’d have the flag missing but migration done. That’s never happened, though.

  ### Verdicts  
  - **Indicative**: "If the deploy script was run without the flag, the migration was not applied." → **Shaky (not assertable)**  
  - **Counterfactual**: "If the deploy script had been run without the flag, the migration would not have been applied." → **Clearly assertable**  

  ### Accounts  
  - **Epistemic account (indicative)**: The indicative requires B to hold in *all* epistemic A-worlds. Here, a live (but improbable) scenario exists where A is true (tampered logs) but B is false (manual migration applied). Since this world is compatible with the speaker's knowledge, the indicative fails.  
  - **Similarity account (counterfactual)**: The counterfactual only considers the *closest* A-worlds, where the flag was genuinely absent with no tampering or manual fixes. In these worlds, the migration is skipped (B true). The tampering/manual world is dismissed as too remote (two departures: tampering + intervention).  

  ### Load-Bearing Feature  
  The coexistence of (1) a **minimal-change A-world** (flag genuinely missing → migration skipped) and (2) a **live-but-remote A-world** (tampering + manual migration → migration applied).  
  **Removal effect**: Without the remote world (e.g., manual migration is impossible), the indicative becomes assertable.  

  ### Unified View Objection  
  A unified theorist might argue: "Both conditionals use the same core inference (A → B), but the counterfactual excludes the tampering world pragmatically, as it’s irrelevant to causal explanations." However, this fails to explain why the indicative *must* include the remote world—epistemic modals demand total coverage of live possibilities.  

  ### Cheat Check  
  Verdicts are generated by the accounts: the epistemic range forces the indicative’s failure, while similarity weighting salvages the counterfactual.  

