    "indicative_sentence": "If the deploy script was run without the flag, the migration was not applied.",
    "counterfactual_sentence": "If the deploy script had been run without the flag, the migration would not have been applied.",
    "indicative_assertable": "no",
    "counterfactual_assertable": "yes",
    "epistemic_account_verdict": "The indicative fails because the speaker must consider all epistemic A-worlds. A remote but possible world (tampering + manual migration) has A true but B false, violating universality.",
    "similarity_account_verdict": "The counterfactual holds because the closest A-worlds (no tampering, no manual fixes) have B true. The tampering world is too dissimilar (two departures) to be considered.",
    "load_bearing_feature": "A live-but-remote A-world (tampering + manual migration) coexists with a close A-world (flag genuinely missing).",
    "removal_effect": "Removing the remote world (e.g., manual migration is impossible) makes both conditionals assertable.",
    "unified_view_objection": "A unified view might claim pragmatics exclude the remote world in counterfactuals, but cannot explain why the indicative must include it—epistemic constraints demand total coverage of live possibilities.",
    "cheat_check": "Verdicts are generated by the accounts, not stipulated by the setup."
  }
