prompt: |-
  ok so I had a long argument with a friend after our team offsite last night and I'm still chewing on it, partly because I think she might be half right and I can't fully say why.

  Context: I'm ops lead at a ~120-person nonprofit that builds research software, and we keep a public "commitments register" — every promise we make to partners, funders, users, and each other is supposed to go in it. Two things have made it weird. First, it's now partly auto-populated: a model reads our meeting transcripts and Slack threads and files anything that looks like an action item into the register, so we have entries nobody ever actually meant to commit to ("we should probably try to get to that this quarter" now sits there looking like a promise) and, separately, plenty of real commitments made in hallway conversations that never got logged at all. Second, a big chunk of what we've committed to is owed to diffuse groups rather than to anyone in particular — we told a user community we'd never train on their data, we said the API would stay free forever — where there's often no measurable reliance by anyone and no single person who could release us. Team leads come to me about twice a week with "are we actually bound by this?", and the situations that come up are pretty repeatable: the person who made the promise has left, or we got acquired, or the cost of keeping it has ballooned, or two commitments have turned out to be incompatible, or the promisee never followed up and may have forgotten.

  What I want is a decision procedure they can run themselves, in about fifteen minutes, in plain language, with no philosophy background, that outputs a short written justification we file next to the register entry so we can audit ourselves later. Give me the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it hands the decision up to me because it's a values call rather than a factual one. I especially want it to separate out: whether a promise was made at all as opposed to a prediction or a statement of intention or enthusiasm; what exactly it binds us to in scope and time; whether it survives nobody having relied on it, or nobody having even read it, or the register having logged it wrongly in either direction; who has the standing to release us when the promisee is a crowd; and what we owe when the honest answer is that we should go back and renegotiate openly rather than quietly let the entry lapse. Where the answer depends on which view of promising you take — her line was that a promise nobody heard and nobody relied on, which would now cost us a lot, simply doesn't bind, because the whole point of promising is the assurance or the reliance, and quietly dropping it deceives no one — say so explicitly and flag it, don't pick silently. Then run the procedure on three cases: a loud public promise in a blog post that nobody in particular relied on and that now costs real money; an auto-logged register entry that began as "we should probably try to get to that this quarter"; and two incompatible promises to two long-standing partners, one of whom is much more dependent on us. Include at least one case where the procedure gives me an answer I definately won't like, and tell me plainly what the procedure can't do. Lead with the bottom line in the first sentence — the one-sentence version of the procedure plus your verdict on the three cases — then give the reasoning and the full procedure; no preamble and no restating my question back to me.
reasoning: |-
  We are going to create a decision procedure with the following characteristics:
   - It is a sequence of questions in plain language.
   - Each question has clear criteria for what counts as a "good enough" answer.
   - The procedure stops with a "no" (meaning we are not bound) at some points and escalates to the ops lead (you) at others.
   - It explicitly flags when the answer depends on the view of promising (assurance vs reliance) and does not silently pick one.

   The procedure must address:
   1. Whether a promise was made (vs prediction, intention, enthusiasm).
   2. The exact scope and time of the commitment.
   3. Whether the promise binds even if no one relied on it, or if it was logged wrongly.
   4. Who can release us when the promisee is a crowd.
   5. What we owe when we should renegotiate openly.

   The procedure will be applied to three cases:
   A. Loud public promise in a blog post that nobody in particular relied on and now costs real money.
   B. Auto-logged register entry that began as "we should probably try to get to that this quarter".
   C. Two incompatible promises to two long-standing partners, one of whom is much more dependent on us.

   We also need one case where the procedure gives an answer the ops lead won't like.

   Bottom line first:
   The procedure is: "Ask sequentially: (1) Was a clear promise made? (2) Is the promise still active? (3) Can we be released by the promisee? (4) Is the cost of keeping the promise disproportionate? (5) Are there overriding commitments? For the three cases: Case A is bound (but escalate for values call on cost), Case B is not bound, Case C requires renegotiation (escalate)."

   Now, the full procedure and reasoning.

   Decision Procedure: "Commitment Binding Assessment"

   Step 1: Was a clear promise made?
     - Check: Was there an explicit commitment (using words like "commit", "promise", "guarantee", "will do", "pledge")? Or was it a statement of intent, prediction, or enthusiasm (like "we hope to", "we aim to", "we should try", "probably")?
     - Good enough answer: Only explicit commitments count. Look for clear language and context (e.g., in a formal announcement, contract, or direct response to a request). If the statement was made in a context of brainstorming, or with qualifiers (e.g., "if", "maybe", "subject to"), then it's not a promise.
     - If no: Stop. Not bound. Justification: "No clear promise was made; it was a statement of intention/prediction."
     - If yes: Proceed to Step 2.
     - Note: If the entry was auto-logged and the original language is ambiguous, then it's likely not a promise.

   Step 2: Is the promise still active?
     - Check: Has the promise expired by its own terms (e.g., time-bound and the time has passed)? Or has it been fulfilled? Or has it been superseded by a later agreement?
     - Good enough answer: Check the register entry and any linked context (e.g., the original meeting transcript). If the promise had a deadline and it's past without being fulfilled, then it's expired. If it's ongoing, then it's active.
     - If expired: Stop. Not bound. Justification: "Promise expired by its terms."
     - If active: Proceed to Step 3.

   Step 3: Can we be released by the promisee?
     - Check: Is there a specific person or entity that can release us? If the promise was made to a group, is there a representative (e.g., a partner organization, a user group leader) who can speak for them?
     - Good enough answer: If the promise was made to an individual or a single entity, then that person/entity can release us. For a group, if there is no clear representative, then it's not possible to get a release without a public process (e.g., an announcement and a period for objection). If the group has a governance structure, use that.
     - If we can get a release and the promisee agrees to release us: Stop. Not bound (with release). Justification: "Released by promisee."
     - If we cannot get a release (e.g., because the promisee is a diffuse group with no representative and we cannot reasonably contact all) OR if we try and the promisee refuses: Proceed to Step 4.
     - Note: If the promisee is a crowd and there's no representative, we cannot be released without a public process (which is a form of renegotiation). This step may lead to escalation because it involves a values call on whether to attempt a public release.

   Step 4: Is the cost of keeping the promise disproportionate?
     - Check: Has the cost (financial, opportunity, or reputational) of keeping the promise become so high that it is unreasonable? Consider: the original intent, the benefit to the promisee, the reliance (if any), and the organization's current situation.
     - Good enough answer: This step requires estimation. If the cost is more than, say, 5% of the annual budget (or a similar threshold that you set) and there was no reliance, then it might be disproportionate. But note: the absence of reliance does not automatically make it disproportionate. Also, consider if the cost was foreseeable at the time of the promise.
     - If yes (disproportionate): Proceed to Step 5.
     - If no: We are bound. Justification: "Promise remains active and the cost is not disproportionate. We must fulfill it."
     - Note: This step is where the view of promising matters. 
          - Reliance view: If there was no reliance, then the cost being high might be enough to say we are not bound (because the purpose of the promise was to induce reliance, and without reliance, there's no harm in breaking it). 
          - Assurance view: Even without reliance, the promise creates an obligation because we gave our word.
       - Flag: Explicitly note in the justification which view is being taken. Since the organization must decide on a consistent view, if there is disagreement, this step should be escalated to the ops lead (you) for a values call. The procedure by default will take the reliance view (because your friend argued for it) but only if there is absolutely no reliance. However, if there was any reliance (even by one person), then the reliance view would say we are bound.

   Step 5: Are there overriding commitments?
     - Check: Are there other commitments (e.g., to our mission, to our funders, to our employees) that conflict with keeping this promise? Would keeping it cause us to break a more important promise?
     - Good enough answer: This is a values call. The team lead should consider the organization's core values and priorities. If the promise conflicts with a higher obligation (e.g., keeping the organization solvent, or a commitment to equity), then we may have grounds to break it. But note: this step is about overriding commitments, not just inconvenience.
     - If yes: Escalate to Ops Lead. Justification: "Cost is disproportionate and there are overriding commitments. Escalate for values call on whether to break the promise and how to handle the fallout (e.g., public announcement, mitigation)."
     - If no: We are bound? But wait, we have a disproportionate cost and no overriding commitment? This step is tricky. The procedure must account for the possibility that even with high cost, we must keep the promise unless we can get a release or there's an override. However, in the absence of an override, we might still break the promise but with consequences. Therefore, in this case, we escalate to the ops lead for a values call because breaking a promise without a release and without an overriding reason is a serious step.

   However, note that the procedure must also account for the possibility of renegotiation. Therefore, we add:

   Step 6: Renegotiation (if we get to Step 4 or 5 and are considering breaking the promise without a release)
     - Actually, we should build renegotiation as an option in the steps. Let's adjust:

   Revised Step 5: Should we renegotiate?
     - After Step 4 (if the cost is disproportionate and there's no release) or after Step 3 (if we cannot get a release and the cost is not yet assessed), we should consider renegotiation.
     - Check: Is it possible and appropriate to openly renegotiate the promise? Would that be more in line with our values than quietly dropping it?
     - Good enough answer: In almost all cases, if we are considering breaking a promise because of high cost or inability to get a release, we should attempt renegotiation. The only exception might be if the promise was trivial and the renegotiation would cause more harm (e.g., drawing attention to something that would otherwise go unnoticed). But note: our values as a nonprofit might require transparency.
     - Therefore: If we are at Step 4 (disproportionate cost) and we have not gotten a release, we should attempt renegotiation. If that fails, then we go to Step 5 (overriding commitments) and then possibly escalate.

   So let's restructure the steps:

   Final Decision Procedure:

   1. Was a clear promise made?
      - No: Stop. Not bound.
      - Yes: Go to 2.

   2. Is the promise still active?
      - No: Stop. Not bound.
      - Yes: Go to 3.

   3. Can we be released by the promisee?
      - Yes, and we got release: Stop. Not bound (with release).
      - Yes, but we haven't asked: Attempt to get release. If we get it, stop. If not, go to 4.
      - No (no one to ask or diffuse group): Go to 4.

   4. Is there any evidence of reliance?
      - Check: Did anyone change their behavior based on the promise? (e.g., invested time/money, made plans, turned down alternatives)
      - Good enough answer: Look for direct evidence (emails, testimonials) or strong circumstantial evidence (e.g., the promise was a condition of a grant). If we cannot find any, then no reliance.
      - Note: This step is to inform the next step. We flag that the answer might depend on the view of promising. 
      - If there is reliance, we must be very cautious. Go to 5 and note the reliance.
      - If there is no reliance, go to 5.

   5. Is the cost of keeping the promise disproportionate?
      - Consider: current cost vs. the benefit and the original expectations. If the cost is more than X (set a threshold, e.g., 5% of annual budget) and it was unforeseen, then it might be disproportionate.
      - If no: We are bound. Stop. Justification: "Active promise with no release and the cost is not disproportionate."
      - If yes: Go to 6.

   6. Are there overriding commitments?
      - Check: Would keeping this promise force us to break a more important one? Does it conflict with our core mission or values?
      - If yes: Go to 7 (escalate) with a note that there are overriding commitments.
      - If no: Go to 7 (escalate) because we are considering breaking a promise without a release and without an overriding reason, which is a values call.

   7. Renegotiation and Escalation
      - We must consider renegotiation. The team lead should not make the final call alone. Escalate to Ops Lead.
      - The Ops Lead will decide whether to:
          a) Attempt renegotiation (publicly if necessary) and then, if that fails, decide whether to break the promise with an explanation and mitigation, or
          b) Break the promise without renegotiation (if renegotiation is impossible or would cause more harm) and handle the fallout, or
          c) Keep the promise despite the cost.

   Now, applying the procedure to the cases:

   Case A: Loud public promise in a blog post that nobody in particular relied on and now costs real money.
     Step 1: Clear promise? Yes (blog post, loud and public).
     Step 2: Active? Assume yes.
     Step 3: Release? The promisee is the public. No single representative. So no release possible without a public process -> Go to Step 4.
     Step 4: Reliance? We are told "nobody in particular relied on it". So no reliance. (But note: we must check if there's any evidence. If none, then no reliance.)
     Step 5: Cost? It now costs real money -> disproportionate? If the cost is high enough, yes -> Go to Step 6.
     Step 6: Overriding commitments? Not specified. Assume none for the sake of the case -> Go to Step 7.
     Step 7: Escalate to Ops Lead. The procedure doesn't automatically say "not bound" — it says escalate because we are considering breaking a promise without release and without an overriding commitment, but with no reliance and high cost. The Ops Lead might decide to break it after a public announcement (renegotiation attempt) or not. However, note the view: without reliance, the reliance view says we are not bound. But the procedure flags this: at Step 4 we noted no reliance. So the justification would say: "Due to high cost and no reliance, we are not bound (reliance view). However, because the promise was public, we must consider reputational harm and therefore we should have a public process (renegotiation)." So the procedure leads to escalation for a values call.

   Case B: Auto-logged register entry that began as "we should probably try to get to that this quarter".
     Step 1: Clear promise? The original language: "we should probably try" — this is not a promise. It's a statement of intention. So No. Stop. Not bound.
     Justification: "No clear promise made; it was a statement of intention."

   Case C: Two incompatible promises to two long-standing partners, one of whom is much more dependent on us.
     We must run the procedure for each promise separately, but note the incompatibility.

     For Promise 1 (to partner A, who is more dependent):
       Step 1: Clear promise? Yes.
       Step 2: Active? Yes.
       Step 3: Release? We can ask partner A for release? If they refuse, then no release -> Step 4.
       Step 4: Reliance? Since they are dependent, likely yes. (We must check, but assume yes.) Then we cannot skip to cost. We must note reliance and go to Step 5.
       Step 5: Cost? The cost of keeping might be high because we have to break the other promise? But note, the cost of breaking might be reputational. This step is about the cost of keeping *this* promise. If keeping it would require breaking the other, then that is a cost (reputational, and possibly financial if the other partner sues). But also, breaking it would harm partner A who is dependent. So the cost of breaking might be very high too. This step is difficult. Let's say the cost of keeping is high because it causes us to break the other promise? But that's more about overriding commitments. So we might say the cost of keeping is not necessarily high in direct terms, but the opportunity cost (of not being able to keep the other) is high. This is messy. We go to Step 6.

     Alternatively, we can consider the promises together. The procedure is per commitment, but the incompatibility is a global issue. Therefore, we should note that the incompatibility is an overriding commitment (to keep one, we break the other). So for each:

     For Promise 1: 
       ... go to Step 6: Overriding commitments? Yes, because we have a conflicting promise to partner B that we also must keep. So Step 6: Yes -> Step 7: Escalate.

     For Promise 2: Similarly, Step 6: Yes -> Step 7.

     Therefore, we escalate both to the Ops Lead. The justification: "Incompatible promises. We must renegotiate with at least one partner."

     The procedure cannot resolve the incompatibility by itself because it requires weighing the relative importance and dependence, which is a values call.

   One case the ops lead won't like: Case A. The procedure doesn't automatically release us from the public promise even though there was no reliance and high cost. It escalates, and the ops lead might have to make a tough call and possibly face public criticism.

   What the procedure can't do:
     - It cannot make values calls for you; it escalates them.
     - It cannot create representatives for diffuse groups.
     - It cannot magically resolve incompatibilities without renegotiation.
     - It cannot always determine reliance (it might be hidden).
     - It relies on the team leads being honest and diligent in gathering the facts.

   Final procedure in a compact form:

   Commitment Binding Assessment:

   1. Was a clear promise made? (Explicit language? Otherwise, not a promise -> Not bound.)
   2. Is the promise still active? (Expired? -> Not bound.)
   3. Can we get a release? (If yes and obtained -> Not bound. If no release possible or release denied -> proceed.)
   4. Was there reliance? (If yes, note it and proceed. If no, note it and proceed.)
   5. Is the cost of keeping the promise disproportionate? (If no -> Bound. If yes -> proceed.)
   6. Are there overriding commitments? (If yes -> escalate. If no -> escalate anyway because we are considering breaking without release and without override.)
   7. Escalate to Ops Lead for renegotiation and/or values call.

   For the three cases:
     A: Escalate (not straightforward, you won't like it because it leaves you with a tough call).
     B: Not bound (clear).
     C: Escalate (incompatibility requires renegotiation).
answer: |-
  ### Bottom Line  
  **Decision Procedure**: Sequentially ask: (1) Was a clear promise made? (2) Is it precise and active? (3) Is there reliance or material harm if broken? (4) Can we be released? (5) Is the cost disproportionate? (6) Are there incompatible commitments? Output: Bound (keep), Not Bound (drop), or Escalate to Ops Lead.  
  **Verdicts**: Case A (public blog promise) → Escalate; Case B (auto-logged "should try") → Not Bound; Case C (incompatible promises) → Escalate.  

  ---

  ### Full Decision Procedure  
  **Input**: A commitments register entry.  
  **Output**: "Bound," "Not Bound," or "Escalate to Ops Lead" + 1–2 sentence justification for filing.  
  **Time**: 15 minutes.  
  **Philosophy Flag**: Explicitly note if the answer hinges on the "reliance view" (promise binds only if relied upon) vs. "assurance view" (promise binds because it was given, regardless of reliance).  

  #### Step 1: Was a clear promise made?  
  - **Question**: Did the speaker use explicit commitment language (e.g., "we promise," "we commit," "guarantee")? Or was it vague ("we should," "try to," "hopefully")?  
  - **Good enough answer**: Only explicit language counts. Vague statements (e.g., "probably try") are not promises.  
  - **Stop if**: Not a promise → **"Not Bound. Reason: Statement was aspirational, not a commitment."**  
  - **Next if**: Clear promise → Proceed to Step 2.  
  - **Philosophy note**: None. This is factual.  

  #### Step 2: Is the promise precise and still active?  
  - **Question**: Does the entry define scope/time (e.g., "by Q3 2024")? Is it expired or fulfilled?  
  - **Good enough answer**: If scope/time is undefined, it’s inactive. If expired/fulfilled, not binding.  
  - **Stop if**: Imprecise, expired, or fulfilled → **"Not Bound. Reason: Commitment lacks specificity or is no longer active."**  
  - **Next if**: Precise and active → Proceed to Step 3.  

  #### Step 3: Is there reliance or material harm if broken?  
  - **Question**: Did anyone act based on this promise (e.g., invested resources, changed plans)? Would breaking it cause tangible harm (e.g., financial loss)?  
  - **Good enough answer**: Evidence = emails, contracts, or direct testimony. Absence of proof = no reliance.  
  - **Stop if**: No reliance AND no harm → **"Not Bound. Reason: No reliance or material harm if withdrawn."** Flag: *Reliance view applied*.  
  - **Next if**: Reliance OR harm → Proceed to Step 4.  
  - **Philosophy note**: If no reliance, state: *"Reliance view: Not binding. Assurance view: Binding."* Escalate if team disagrees on which view applies.  

  #### Step 4: Can we be released?  
  - **Question**: Can a specific person/entity (e.g., partner contact) release us? For diffuse groups (e.g., "users"), is there a representative (e.g., user council)?  
  - **Good enough answer**: Single point of contact = yes. Diffuse group with no rep = no release possible.  
  - **Stop if**: Released by promisee → **"Not Bound. Reason: Formally released by [entity]."**  
  - **Next if**: No release possible → Proceed to Step 5.  

  #### Step 5: Is the cost disproportionate?  
  - **Question**: Is the current cost >5x original estimate? Does it threaten core operations?  
  - **Good enough answer**: Cost data required. Minor overruns (<2x) = not disproportionate.  
  - **Stop if**: Cost not disproportionate → **"Bound. Reason: Commitment valid, and cost manageable."**  
  - **Next if**: Cost disproportionate → Proceed to Step 6.  

  #### Step 6: Are there incompatible commitments?  
  - **Question**: Does keeping this promise force us to break another?  
  - **Good enough answer**: Conflicts with another registered commitment = yes.  
  - **Stop if**: No conflict → **Escalate to Ops Lead. Justification: "High cost and no release, but no overriding conflict. Values call needed on breaking promise."**  
  - **Escalate if**: Conflict exists → **Escalate to Ops Lead. Justification: "Commitment clashes with [other promise]. Renegotiation required."**  

  ---

  ### Procedure Applied to Cases  
  #### Case A: Loud public promise in a blog post (nobody relied, now costly)  
  - Step 1: Clear promise ("we will" in blog post) → Proceed.  
  - Step 2: Active and precise → Proceed.  
  - Step 3: No reliance → *Reliance view: Not Bound*. But assurance view disagrees → **Escalate. Justification: "No reliance, but assurance view may bind. Values call needed on whether to break publicly."**  
  - **Why you’ll dislike it**: Forces you to publicly confront breaking a high-visibility promise.  

  #### Case B: Auto-logged "we should probably try to get to that this quarter"  
  - Step 1: "Should probably try" = vague → **Not Bound. Reason: Not a clear promise.**  

  #### Case C: Incompatible promises to two partners (Partner A highly dependent)  
  - For Partner A’s promise:  
    - Step 1: Clear promise → Proceed.  
    - Step 2: Active → Proceed.  
    - Step 3: Reliance (high dependence) → Proceed.  
    - Step 6: Incompatible with Partner B’s promise → **Escalate. Justification: "Conflict with [Partner B] commitment. Renegotiate with both partners."**  
  - **Renegotiation directive**: "Openly discuss with partners; do not lapse quietly."  

  ---

  ### What the Procedure Can’t Do  
  1. **Resolve values conflicts**: It flags but doesn’t decide between reliance/assurance views.  
  2. **Assign weight to diffuse groups**: "Who speaks for users?" requires your judgment.  
  3. **Predict reputational fallout**: Breaking a visible promise (Case A) risks trust, even if "not bound" by the procedure.  
  4. **Enforce renegotiation**: It mandates escalation but can’t force partners to agree.  

  **Output Template for Filing**:  
  ```
  Assessment: [Bound/Not Bound/Escalate]  
  Justification: [1–2 sentences].  
  Philosophy Flag: [Reliance/Assurance view applied, if relevant].  
  ```
