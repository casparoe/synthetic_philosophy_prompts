  I should check if there's a specific term in cultural evolution literature. Maybe "cultural rarity signaling" or "dynamic anti-conformity." But established terms like negative frequency-dependent selection might be the closest. The rejection phase could relate to symbolic boundary-marking, as in Bourdieu's distinction. 

  The boundary cases: accidental rarity (like a rare bird) shouldn't count because it's not intentional. Late sincere adoption (like discovering an old band and loving it genuinely) also doesn't fit because there's no rejection by early adopters. The key is the intentional exclusivity and active disavowal. 

  On the meme-replicator question: if the content's fitness depends on its frequency and it mutates to maintain rarity, it challenges the idea of memes as stable replicators. Here, the replicator unit isn't the trait itself but the "position" of exclusivity. That's a significant twist. 

  The user might need to synthesize several concepts: signaling theory for the costly mutations, negative frequency dependence for the rarity advantage, and symbolic boundaries for the social dynamics. The rejection phase could be framed as a reputational salvage strategy. 

