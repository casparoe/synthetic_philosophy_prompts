  For nuclear stanzas, I'll show instant recognition ("one flash") vs frozen governance ("treaty ink stays dry"), and the bomb's unused nature conflicting with AI's constant use. Printing press stanzas contrast rapid spread ("ships bear type") with slow consequences ("literacy takes root"), while conceding it replicated but didn't generate thought. Industrial Revolution stanzas juxtapose visible machinery ("spindle spins") with delayed productivity ("wage waits"), noting it replaced labor not judgment.

  In the envoi, gathering all words to show decision-making as the unaddressed core: "we stand where no treaty shields the thought, no wage pays the mind" - making explicit what the user called "the thing being replaced is the thing doing the replacing."

  Avoiding alarm or reassurance is vital. The tone stays observational: "gathering shadows" acknowledges uncertainty without resolution. Diction remains plain but precise - "enrichment's math" for nuclear science, "proofs unpressed" for unprinted AI systems. 

  Finally, ensuring no stanza exceeds 6 lines, total 39 lines, with natural rhythm for oral delivery. The hardest balance is making each analogy's break visible without didacticism - like the press stanza ending with "it did not print the next press," letting the implication about AI's self-improvement land quietly.
answer: |-
  ## Sestina for Three Analogies at Dusk

  Not bomb, nor press, nor engine’s turning **spindle**,
  We meet to parse the gathering **power**.
  The first tale told: a desert **fission** bloomed,
  Instant and absolute. One flash, one treaty
  Drawn brittle in that light. The ink stays dry,
  Its value locked in stillness. Not for use.

  But how apply a logic built on *non*-**use**
  To something meant for ceaseless, wide employ? Slow **spindle**
  Whirs unseen for decades, measured gain deferred. The **wage**
  Stays low while iron giants wake. What **power**
  Lies latent here? Not one bright, sudden **fission**,
  But gradients unseen. What ink, what **treaty**

  Could capture *this*? The second tale: the **type**
  Set free upon the world. With startling **speed**,
  The press’s clatter spread, ship bearing **type**
  To far-flung shores. Cheap thought! Yet **literacy**
  Took root like winter wheat, slow, deep, before the **wage**
  Of knowledge rose. It multiplied the thought, not spawned the *next* **press**.

  It copied mind’s result, not mind. The **press**
  Replaced the scribe’s tired hand, not his intent. The **mill**
  Ground corn, not purpose. Muscle yielded to the **power**
  Of steam and gear, a vast, unblinking **spindle**.
  Yet judgement stayed a human task. The **wage**
  Of displacement struck the limb, not the deciding **mind**.

  No treaty shields the thought, no wage pays the **mind**
  Confronting what it made. The desert **fission**,
  The spreading **type**, the factory’s grim **mill** –
  Each held its tempo: shock then frozen treaty,
  Fast spread then slow effect, slow build then power
  Delayed. Each substituted: scribe, loom, muscle... yet the **spindle**

  Turns now towards the **spindle** of thought itself. What **treaty**
  Governs enrichment’s math, self-written **type**?
  What **mill** grinds proofs unpressed? This gathered **power**,
  Not used or unused, *using*; not copying, *making*; not driving **spindles**,
  But weaving the weaver’s task. We stand where no shield, no **literacy**,
  No wage, guards the act deciding *how* this **power** is put to **use**.

  ---

  Gathered now: **fission**, **treaty** – frozen pact, stark use deferred.
  **Type**, **literacy** – thought spread, yet source held fast, the press unmanned.
  **Spindle**, **wage** – muscle stilled, gain lagging, judgement undisturbed.
  We stand where no shield guards the thought, no wage pays the deciding hand.
