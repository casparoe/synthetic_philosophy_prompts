       - Large-number: ~1/1001.  
       - Learning Monday changes credence (to 1/2).  
       - Seeing red **no change** (indifference over indistinguishable tails awakenings).  
     - **Most awkward commitment:** Cannot explain why qualitative distinctions (e.g., red room) don’t break indifference.  

  3. **DOUBLE-HALFER**  
     - **Path:** 1B → 3A  
     - **Key commitments:**  
       - Assessment: Per experiment run.  
       - Large-number: 1/2.  
       - Learning Monday **no change** (credence stays 1/2).  
       - Rejects conditionalization (or absorbs Monday into prior).  
     - **Most awkward commitment:** Violates conditionalization to avoid updating on Monday.  

  4. **LEWISIAN HALFER**  
     - **Path:** 1B → 3B  
     - **Key commitments:**  
       - Assessment: Per awakening (as "temporally centered" evidence).  
       - Large-number: 1/2.  
       - Learning Monday **changes** credence (to 2/3 for heads).  
       - Duration doesn’t matter (counts awakenings, not time).  
     - **Most awkward commitment:** After learning Monday, credence in heads is 2/3 (seems too high).  

  5. **DURATION-WEIGHTED**  
     - **Path:** 1A → 2A → 4A  
     - **Key commitments:**  
       - Assessment: Per unit-time (e.g., observer-moments weighted by duration).  
       - Large-number: ~1/1001.  
       - Learning Monday **no change** (duration already weights credence).  
       - Duration **matters** (e.g., 5-hour Tuesday lowers heads credence).  
     - **Most awkward commitment:** Requires arbitrary chronometric units (seconds? minutes?) to compute probabilities.  

  6. **DEFERRAL-REQUIRED**  
     - **Paths:** 5B → 7A → 8B, or 7A → 8A  
     - **Key commitments:**  
       - Assessment: Context-dependent (deferred to later evidence).  
       - Sunday cannot settle Monday’s credence (synchronic and diachronic credences can diverge).  
       - "Coin tossed after" is **same** as original (focuses on future outcome structure).  
     - **Most awkward commitment:** Cannot specify a credence without additional evidence (e.g., "defer until Tuesday").  

  7. **FREQUENTIST LEANING**  
     - **Path:** 5B → 7A → 8A  
     - **Key commitments:**  
       - Assessment: Per experiment run in long sequences.  
       - Credence **depends** on repetition (e.g., 1/2 for single run, ~1/3 for many runs).  
       - "Coin tossed after" is **same** as original (focuses on frequency, not ontology).  
     - **Most awkward commitment:** Cannot give a non-instrumentalist justification for single-run credence.  

  8. **UNOCCUPIED (Incoherent)**  
     - **Path:** 1A → 2A → 4B  
     - **Reason:** Close to 0 in large-number + no update on Monday + duration irrelevant → Incoherent. Learning Monday is strong evidence for heads; refusing to update contradicts low heads credence.  

  9. **UNOCCUPIED (Unexplored)**  
     - **Path:** 5B → 7B  
     - **Reason:** "Coin tossed after" differs from original + Sunday cannot settle credence → No known position occupies this cell (possibly a memory/evidence distinction, but unexplored).  

