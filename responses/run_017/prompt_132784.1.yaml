prompt: |-
  Hi. I work in the clerk's office of a fairly religious mid-sized city council, and one of my jobs is screening the written submissions we read into the record at public hearings (evangelical and Catholic churches, two mosques, a gurdwara, a very active secularist association, assorted resident groups). Our standing orders say a submission should offer reasons that all members of the public can reasonably be expected to accept regardless of their religion or worldview, which is obviously some version of the public reason idea, but nobody has ever turned it into anything you could actually run. We recieve 30–40 submissions a week, one or two pages each, we've got about three minutes per submission, we can't research the religion involved, if we leave something out we have to print a one-sentence reason that will survive appeal to a panel of elected members, and our lawyers say we can't exclude anything because of who the speaker is, only because of what the argument says.

  So: give me a procedure. The questions in order, what counts as a pass at each one, where it stops and excludes, where it kicks the thing back for one rewriten version, and where it has to hand the call to a person because it's a judgement call dressed up as a rule. Two of my boss's ideas are in the mix and I want you to tell me if they're mistakes: she thinks people should always be allowed to make their point in religious language as long as they also attach a secular version of the same argument (a translation proviso, she calls it), and she thinks the rule should only really bite at the final vote and not during early hearings. Then run the procedure on three cases: (1) a church's one-page submission against a medically-assisted-dying resolution arguing that life is a gift from God and suffering can be redemptive, no secular premises anywhere; (2) an interfaith housing coalition submission supporting a zoning change that opens with a verse about hospitality to the stranger and then gives three paragraphs of rent and vacancy statistics; (3) a secular tenants' union submission on the same zoning change that never mentions religion but whose whole case rests on the inherent dignity of every person, which their own newsletter says they took from Catholic social teaching. I'd be annoyed if the procedure threw out (3), so if it does, say so plainly, and if it does something else I won't like elsewhere, say that too. Also be honest about which of your steps are really just someone's politics arranged as a checklist.
reasoning: |-
  Okay, let me tackle this city council submission screening problem. The user needs a practical procedure to filter written submissions based on public reason requirements, balancing legal constraints with real-world efficiency. 

  First, I need to understand the core tension: they must exclude religiously exclusive arguments but can't research religions, have minimal time per submission, and face appeal risks. The boss's two ideas add complexity - the "translation proviso" might create loopholes while delaying enforcement could cause problems.

  Hmm, the three test cases are cleverly chosen to probe boundaries: pure religious argument (1), hybrid religious-secular (2), and secularized religious concept (3). Case 3 is their litmus test - rejecting it would likely cause backlash. 

  Breaking it down:
  - Step one should catch explicitly exclusionary language ("because Scripture says..." with no secular anchor). Easy reject.
  - Step two needs to handle mixed submissions like case 2 where religious framing precedes secular data. Should pass if secular content stands alone.
  - Step three is trickiest - concepts like "human dignity" that have religious roots but secular citizenship. Rejecting these feels wrong and probably violates the "no speaker-based exclusion" rule. 

  The boss's proposals... the translation requirement seems administratively unworkable (who verifies equivalence?) and the delayed enforcement risks letting inappropriate arguments influence early debate. Better to screen upfront.

  For the procedure:
  - Must be a flowchart with clear exit points
  - Avoid subjective judgments where possible
  - Build in "soft reject" chances for fixable issues
  - Preserve all original submissions for appeal purposes

  Biggest challenge is case 3. If we exclude it for religious origins, we're essentially policing thought crimes - untenable. The rule should focus on argument presentation, not conceptual genealogy. "Human dignity" passes as it's enshrined in secular law and philosophy.

  Final procedure will have:
  1. Language screen (quick kill for non-translatable claims)
  2. Premise check (does argument depend on inaccessible beliefs?)
  3. Rewrite option for salvageable submissions
  4. Human judgment call for borderline cases (like dignity arguments)

  Testing on case 1: fails step 1 - pure religious argument, no secular translation offered. Hard reject. Case 2: religious framing but secular substance stands alone. Pass. Case 3: secular presentation of widely accepted principle. Pass with note about potential appeal risk.

  Should flag that step 3 (premise accessibility) involves some philosophical judgment - but we can anchor it in legal/constitutional concepts to avoid arbitrariness.
answer: |-
  Here's a procedural framework designed for efficiency, legal defensibility, and fidelity to public reason principles, with explicit handling of your boss's proposals and test cases. Steps are sequential – if a submission fails a step, it stops there unless marked for rewrite.

  ### Screening Procedure: Public Reason Compliance Check
  *(Time Target: ≤3 min/submission)*

  1.  **Step 1: Explicit Religious Authority Check (Inclusion Kill Switch)**
      *   **Question:** Does the submission **explicitly state** that its *conclusion depends solely* on religious authority inaccessible to non-adherents? (e.g., "Because Scripture says X, you must vote Y," "Only true believers can understand why Z is wrong").
      *   **Pass:** No explicit dependency stated. → Proceed to Step 2.
      *   **Exclude:** Explicit dependency stated. → Print: "Submission states its argument relies solely on religious authority not accessible to all reasonable citizens."
      *   **Judgment Call?** Minimal (Literal text scan). "Solely" is key; coupling with other reasons moves to Step 2.
      *   **Boss's Idea 1 (Translation Proviso):** **Mistake here.** This step catches arguments *incapable* of public translation by their own admission. Requiring translation later wouldn't fix this.

  2.  **Step 2: Core Argument Secular Translation Check (Premise Accessibility)**
      *   **Question:** Can the **core justifying premises** supporting the conclusion be understood and potentially accepted *without requiring belief in a specific religious doctrine or supernatural entity*? (Ignore framing, quotes, or motivation; focus on the *reasons given for the policy position*).
      *   **Pass:** Core premises are secular (empirical data, widely shared welfare concerns, common safety, procedural fairness, widely recognized human rights concepts like bodily autonomy or equality before the law) OR religious language is clearly *framing/illustration* for underlying secular premises. → Proceed to Step 3.
      *   **Kick Back (One Rewrite):** Core premises *depend* on inaccessible religious concepts *and* no secular equivalent premise is provided. → Print: "Core argument relies on premises not reasonably accessible to citizens of all faiths and worldviews. Please resubmit stating the core policy reasons in terms accessible to all." Attach original.
      *   **Judgment Call?** **YES (Core Step).** Requires assessing *what the core argument actually is* and whether its force depends on faith. Training focuses on "Would this premise make sense to a reasonable atheist, Muslim, Hindu, etc., without conversion?"
      *   **Boss's Idea 1 (Translation Proviso):** **Partially Integrated.** The rewrite option *is* the translation proviso. *Requiring* it upfront for *all* religious language is inefficient and chills participation. This step triggers it *only* when the core argument lacks accessible premises. Framing/illustration passes without translation.
      *   **Boss's Idea 2 (Only Bite at Final Vote):** **Mistake.** Allows non-public reasons to enter the record and potentially influence debate/votes *before* the final decision, violating the core purpose of public reason and the standing orders. Screen upfront.

  3.  **Step 3: Secular Premise Plausibility Check (Minimal Rationality)**
      *   **Question:** Are the secular core premises offered (from Step 2) **factually coherent and minimally plausible within a shared reality**, even if controversial? (Reject *only* blatant falsehoods or incoherent reasoning, *not* debatable claims or minority secular viewpoints).
      *   **Pass:** Premises are coherent and minimally plausible (e.g., "This zoning change will increase density" - plausible; "Increased density often correlates with rent pressure" - debatable but plausible; "Vaccines cause 5G mind control" - implausible/false). → **READ INTO RECORD**.
      *   **Exclude:** Core secular premises are demonstrably false based on easily verifiable, uncontested public knowledge or are logically incoherent on their face. → Print: "Core argument relies on premises factually incoherent or demonstrably false within publicly available knowledge."
      *   **Judgment Call?** **YES (But Highly Constrained).** "Minimal plausibility" is a low bar. Focus on egregious falsehoods (e.g., "The earth is flat, so this building will fall off") or self-contradictions. Avoid adjudicating *between* competing plausible secular views – that's for the Council. **This is NOT about political acceptability.**
      *   **Politics Warning:** Risk of bias here is judging "plausibility" based on the screener's worldview. Mitigation: Strict focus on *factual* falsehood/incoherence using sources like official city data, uncontested scientific consensus (gravity, germ theory), or basic logic (A cannot be both true and false simultaneously).

  ### Applying the Procedure to Your Cases

  *   **Case 1 (Church vs. MAiD):**
      *   Step 1: No explicit "solely because God" statement? Probably passes (assumes phrasing like "Life is sacred *because* it's a gift from God").
      *   Step 2: **FAIL.** Core premises ("life is a gift from God," "suffering is redemptive") are inherently religious and inaccessible without belief in that specific deity and theology. No secular equivalent provided.
      *   **Action:** Kick Back for Rewrite. "Core argument relies on premises not reasonably accessible... Please resubmit stating the core policy reasons in terms accessible to all." (They *might* try secular arguments about slippery slopes or palliative care adequacy; pure religious argument remains excluded if unchanged).

  *   **Case 2 (Interfaith Housing - Zoning):**
      *   Step 1: Passes. Verse is framing, not stated as sole authority.
      *   Step 2: **PASS.** Core premises are the rent/vacancy statistics and their implied policy consequences (e.g., "This change will increase supply, potentially lowering rents"). The verse about hospitality is motivational framing/illustration for the *goal*, not the core *reason* the zoning change is argued to achieve that goal. The secular stats stand alone.
      *   Step 3: Passes (assuming stats aren't fabricated nonsense).
      *   **Action:** Read into Record.

  *   **Case 3 (Secular Tenants' Union - Zoning):**
      *   Step 1: Passes. No religious language.
      *   Step 2: **PASS.** "Inherent dignity of every person" is a *secularized concept* widely used and recognized in international law (UN Declaration), national constitutions, and diverse philosophical traditions (Kantian, humanist). Its *origin* in Catholic teaching is irrelevant; its current *citizenship* in public discourse makes it accessible to all reasonable citizens as a foundational value, even if they ground it differently (human rights, social contract, etc.). The argument likely proceeds to policy impacts based on this value.
      *   Step 3: Passes (assuming coherence).
      *   **Action:** Read into Record. **This passes, as you desired.** Excluding it *solely* due to its historical origin would violate the rule against speaker-based exclusion and misunderstand how concepts enter public reason.

  ### Honesty About Politics & Judgment Calls

  1.  **Step 2 (Premise Accessibility):** This is inherently political philosophy in action. Defining "reasonable," "accessible," and "shared" involves Rawlsian/liberal assumptions. It *privileges secular justifications*. This is unavoidable when operationalizing public reason. The "judgment call" here embeds this philosophy.
  2.  **Step 3 (Minimal Plausibility):** While constrained, the line between "controversial but plausible" and "implausible" can be fuzzy. What counts as "uncontested public knowledge" can be contested (e.g., climate change denial). This step risks marginalizing extreme but sincerely held secular worldviews. The low bar ("minimal plausibility") and focus on blatant falsehoods/incoherence mitigate this.
  3.  **"Inherent Dignity" (Case 3):** Passing this accepts that concepts *originating* in religion can become part of the *secular* vocabulary of public reason through broad societal adoption and legal entrenchment. This reflects a specific (common) view of how public reason evolves. Someone adhering to a stricter "origin theory" of public reason might disagree, but that view would be impractical and exclusionary in a pluralistic society and likely violate your lawyers' guidance.

  ### Key Advantages of this Procedure

  *   **Efficiency:** Steps 1 & 3 are usually quick. Step 2 is the core time investment (~2 mins), focused on identifying the *core argument*.
  *   **Legally Defensible:** Focuses solely on *content* (argument structure/premises), not speaker identity. Provides clear, content-based exclusion reasons tied to the standing orders.
  *   **Appeal-Resistant:** Exclusion reasons are specific to the argument's failure ("relies solely on inaccessible premise X," "premise Y is factually incoherent").
  *   **Practical:** Avoids theological research. Rewrite option offers fairness. Handles framing vs. core argument distinction.
  *   **Accommodates Evolution:** Allows historically religious concepts with broad secular citizenship (like human dignity).

  **In short:** This procedure prioritizes the *accessibility of core justifying premises* over language or origin, incorporates a targeted rewrite option (addressing your boss's first idea partially), requires upfront screening (rejecting her second idea), passes your key test case (3), and is honest about the political philosophy embedded in Step 2.
