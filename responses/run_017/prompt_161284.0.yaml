answer: |-
  ## Comprehensive Exam Question: Moral Responsibility

  **Question (20 marks; answer in 60 minutes):**

  Galen Strawson's Basic Argument concludes that true moral responsibility in the "desert-entailing" sense is impossible because it requires being *causa sui* (self-caused), which is incoherent. The core regress is: We act as we do because of how we are (character/motivational structure); to be truly responsible for our acts, we must be truly responsible for how we are; this requires being responsible for forming ourselves, which requires already being some way to do that forming, and so on *ad infinitum*.

  1.  **The Viciousness of the Regress (8 marks):** Precisely *why* does Strawson consider this regress **vicious** (i.e., fatally undermining responsibility), rather than merely **benign** (i.e., an infinite series that *could* ground responsibility)? What specific requirement does it reveal that cannot be met? Frame your answer in terms of the *origin* or *source* of the self.
  2.  **Ampliative Self-Creation as an Escape? (8 marks):** Consider the following objection to Strawson: Grant that no one is *causa sui* and that actions stem from prior character. However, an agent's actions can *reorganize* her subsequent character (e.g., reducing inner conflict, establishing stable commitments, increasing self-understanding and motivational unity). This process can be seen as increasing the agent's "degree of self-determination" over time, even if it never reaches 1. Explain how this model of **ampliative self-creation** *aims* to break the regress by making it benign. How does it specifically address the requirement identified in part (1)? Crucially, assess the force of Strawson's likely rebuttal: "Amplification starting from a base of zero self-determination yields zero self-determination later. If the initial self wasn't 'truly yours,' how can subsequent reorganization make a *later* self 'truly yours'?"
  3.  **Desert or Surrogate? (4 marks):** If ampliative self-creation succeeds in grounding *some* form of responsibility, would this be the kind of "desert-entailing" responsibility Strawson claims is impossible? Or would it constitute a different concept (e.g., forward-looking, attributional, or developmental responsibility) that Strawson might accept as a viable substitute, even if not satisfying his notion of ultimate desert? Briefly defend your view.

  **Constraints:** Your answer must engage directly with the structure of the regress and the specific objection/rebuttal outlined. Do *not* primarily discuss compatibility with determinism, the Consequence Argument, or general luck objections. Treat ampliative self-creation as distinct from standard compatibilist accounts focusing on reasons-responsiveness or identification alone.

  ---

  **Model Answer (Approx. 680 words):**

  **1. The Viciousness of the Regress (Why Benignity Fails for Strawson):**
  Strawson deems the regress vicious because it reveals an inescapable requirement for true moral responsibility (in the desert-entailing sense): the agent must be the *ultimate, buck-stopping source* of her own self. To be truly responsible for an act (A1), she must be truly responsible for the character state (C1) that caused A1. But being responsible for C1 requires being responsible for an earlier act (A0) that formed or sustained C1. Responsibility for A0, in turn, requires responsibility for the character state (C0) that caused A0. This chain regresses infinitely. Crucially, Strawson argues that responsibility at *any* stage (e.g., for C1) *logically requires* responsibility for the *prior* stage that produced it (C0). Since the chain has no beginning (no *causa sui*), there is *never* a point where the agent is the ultimate source; responsibility is always inherited from a prior state for which she is *not* ultimately responsible. The regress is vicious because it demonstrates the *impossibility* of fulfilling this necessary condition: originating one's self *ex nihilo* or being fully self-created *ab initio*. Responsibility cannot get a foothold because the initial conditions (C0, or whatever starts the chain) are not "truly yours" in the required ultimate sense; they are given by factors outside the agent's ultimate control (genetics, environment, luck). Hence, the regress doesn't benignly ground responsibility; it relentlessly exposes its absence at every link by pushing the required ultimate self-creation further back, revealing it was never present.

  **2. Ampliative Self-Creation: Aim and Strawson's Rebuttal:**
  Ampliative self-creation aims to break the regress by rejecting Strawson's assumption that responsibility requires *ultimate* origination (*causa sui*) and instead proposing a *scalar* and *dynamic* model. It grants that the initial character state (C0) is not "truly yours" in the ultimate sense. However, it argues that subsequent *actions* (A1, A2,...) guided by the agent's existing capacities can *reorganize* later character states (C1, C2,...). This reorganization (e.g., strengthening resolve, integrating values, increasing self-awareness) progressively increases the *degree* to which the agent's character is structured by her *own* past commitments, policies, and self-reflective choices, rather than merely by the initial given C0 or external forces. The "degree of self-determination" (DSD) rises over time.
  *   **Addressing the Requirement:** This directly challenges the requirement identified in Part 1. Instead of needing an uncaused first cause, responsibility emerges from a *process* where the agent, through her actions, increasingly *makes herself* what she subsequently is. The later character Cn is "more truly yours" than C0 because it bears the structural imprint of the agent's own past self-shaping efforts, even if those efforts were shaped by a prior, less self-determined state. The regress becomes benign: each link doesn't require full responsibility for the prior link, only that the *process* linking them involves the agent's own activity in progressively increasing DSD. Responsibility is grounded in the *trajectory* of increasing agential ownership, not in an impossible origin.
  *   **Strawson's Rebuttal ("Zero x Anything = Zero") & Assessment:** Strawson's rebuttal insists that if the *initial* state C0 lacks ultimate ownership ("zero" DSD), then no matter how much reorganization occurs later, the resulting state (Cn) still fundamentally depends on that initial "unowned" base. Amplification of zero is still zero; rearranging parts initially not truly yours doesn't make the later arrangement truly yours in the required desert-entailing sense. It merely creates a more complex structure *from* alien materials.
  *   **Defending Amplification:** The force of this rebuttal depends entirely on Strawson's binary, origin-obsessed conception of "truly yours." The amplification model counters that "truly yours" *is* scalar and process-dependent. A policy or commitment formed through self-reflection (even if influenced by prior, less self-determined states) is a genuinely *new* structural element – an emergent level of organization governing lower-level motives. This structure *is* "the agent's own" in a way the raw motives it organizes are not, precisely *because* it results from her self-reflective activity. While Cn causally depends on C0, its *form* – its organization – is shaped by the agent's own intervening self-constituting acts. This emergent organization is the locus of increasing ownership, making Strawson's "zero base" objection miss the point: it ignores the creation of *new agential structure* through the process itself. The rebuttal only holds if we assume structural organization cannot be novel and ownership-conferring, merely recombining pre-existing elements – an assumption the amplification model explicitly rejects.

  **3. Desert or Surrogate?**
  Ampliative self-creation, *if* successful, does not deliver the "desert-entailing" responsibility Strawson deems impossible. Strawson's "desert" requires *ultimate* responsibility – being the buck-stopping, non-accidental source of one's self and actions, free from any taint of "givenness" or luck in constitutive factors. The amplification model explicitly rejects the possibility or necessity of such ultimacy. Instead, it grounds a form of **developmental, achievement-based responsibility**. An agent deserves credit or blame *proportionally* to the degree of self-determination manifested in an act, which reflects the success and effort of her prior self-constituting activity *within* the constraints of her starting point and history. This is a robust form of responsibility based on the agent's own contributions to who she has become and what she does. However, it is *not* the ultimate, "metaphysical" desert Strawson targets; it accepts the constitutive role of luck in the initial self and the ongoing process. Strawson might accept this as a pragmatically or ethically valuable *surrogate* for assigning praise and blame, perhaps akin to "attributability" or "answerability," but he would insist it fundamentally changes the subject away from the kind of true, ultimate self-origination he argues is incoherent and necessary for desert in his strong sense. The amplification model offers responsibility *earned through self-creation over time*, not responsibility *ultimately deserved for one's self*.

  ---

  **Marking Scheme (Total 20 Marks):**

  1.  **Identify Strawson's Reason for Viciousness (3 marks):** *Must-hit:* Clearly state that the regress reveals the *impossibility of being the ultimate source/originator (causa sui) of one's initial or core self*, making responsibility impossible to ground at any point. *Common Mistake:* Just restating the regress steps without explaining *why* it's vicious (i.e., why the lack of a starting point *logically prevents* responsibility).
  2.  **Explain Ampliative Self-Creation's Mechanism (3 marks):** *Must-hit:* Describe how actions *reorganize* subsequent character, increasing "degree of self-determination" (DSD) over time, aiming to make the regress benign by grounding responsibility in the *process/trajectory* of increasing self-ownership. *Common Mistake:* Describing general self-change without linking it specifically to breaking the regress via increasing DSD, or confusing it with standard compatibilist mechanisms like identification.
  3.  **Analyze Strawson's "Zero Base" Rebuttal & Defense (6 marks):** *Must-hit:* (a) Accurately state Strawson's rebuttal: Amplification from an un-owned base cannot yield true ownership later. (b) Explain the defense: Rebuttal assumes "truly yours" is binary/all-or-nothing and ignores that reorganization creates *novel, ownership-conferring agential structure* (policies, commitments) not reducible to the initial motives. *Common Mistake:* Only stating the rebuttal without engaging the defense, or offering a weak defense (e.g., "effort counts") not centered on *emergent structure*.
  4.  **Assess Desert Entailment (4 marks):** *Must-hit:* Conclude that amplification delivers a *developmental, achievement-based responsibility* proportional to DSD, *not* Strawson's impossible "ultimate desert." Recognize it as a viable *surrogate* Strawson might accept, distinct from his target. *Common Mistake:* Claiming it delivers ultimate desert, or failing to distinguish the surrogate nature clearly from Strawson's target concept.
  5.  **Maintain Determinism-Irrelevance & Avoid Drift (4 marks):** *Must-hit:* Addresses the regress and amplification *without* invoking determinism, the Consequence Argument, or general luck objections. Treats amplification as distinct from standard compatibilism. *Common Mistake:* Drifting into discussing determinism vs. indeterminism, or conflating amplification with standard reasons-responsiveness/identification compatibilism.

  **Distinguishing A from B Answers:**
  An **A answer** demonstrates a deep grasp of the underlying metaphysical stakes: the nature of the self, ownership, and sourcehood. It precisely articulates why Strawson sees the regress as vicious (buck-stopping source) and how amplification challenges the *binary* nature of "truly yours" by emphasizing *emergent agential structure* through self-constitution. It cleanly separates Strawson's notion of ultimate desert from the developmental responsibility offered by amplification. A **B answer** accurately summarizes the arguments, identifies the key points (viciousness, amplification, rebuttal, desert vs. surrogate), and avoids major errors/drift, but lacks the nuanced understanding of the core metaphysical disagreement (source vs. process, binary vs. scalar ownership, emergence) and may have less precise defenses against the "zero base" rebuttal or a slightly muddled distinction on desert.
