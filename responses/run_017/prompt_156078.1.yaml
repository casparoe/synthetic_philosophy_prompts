  Here are the three documents as requested, followed by the apparatus note and joke analysis table. The piece runs ~950 words.

  **DOCUMENT 1: COMPLIANCE CIRCULAR 24-07 (OFFICE OF EPISTEMIC CLEARANCE - MERIDIAN TRUST)**

  **SUBJECT:** Implementation of Context-Sensitive Knowledge Attribution Framework (CSKAF) & Stakes-Calibrated Evidence Thresholds (SCET) - Effective Immediately

  1.  **Purpose:** To standardize knowledge attribution across Meridian Trust operations in accordance with the Board-approved adoption of Stakes-Indexed Epistemic Norms (SIEN), ensuring assertions of knowledge ("K-claims") reflect the practical environment of the decision context.
  2.  **Scope:** Applies to all customer-facing attestations, internal control verifications, risk assessments, and model validation statements where the term "know" or its cognates (e.g., "confirmed," "verified," "certain") are utilized.
  3.  **Policy:** Effective immediately, the epistemic standing required for a valid K-claim is contingent upon the Stakes Index (SI) of the decision context, as defined in Schedule A. Evidence sufficient for knowledge attribution in a Low-Stakes Context (SI < 5) is insufficient for the same attribution in a High-Stakes Context (SI ≥ 5).
  4.  **Attestation Ladder:** Personnel must utilize the approved attestation phrasing corresponding to the calculated SI (Refer Schedule B). Note: The phrase "I know" is hereby withdrawn from all approved scripts due to its context-insensitive absolutism. Approved alternatives range from "The available evidence currently suggests..." (SI 1-3) to "After rigorous scrutiny under prevailing conditions, no grounds for doubt remain..." (SI ≥ 8).
  5.  **Stakes-Calibrated Evidence Thresholds (SCET):** The quantity and quality of evidence deemed sufficient for knowledge is determined by the multiplicative Stakes-to-Evidence Exchange Rate (SEER) applicable to the context (Refer Schedule A). Higher SEER values necessitate proportionally greater evidence weight.
  6.  **Epistemic Standing Review (ESR):** An individual's epistemic standing regarding a specific proposition is non-static. Changes in the practical environment (e.g., market volatility, regulatory announcement, customer disclosure of new information) trigger mandatory ESR. Prior knowledge attributions may be retroactively downgraded if the SI increases.
  7.  **Epistemic Structuring Service:** For complex, high-stakes transactions (SI ≥ 7), Relationship Managers may offer the Epistemic Structuring Service (ESS). ESS decomposes a single high-SI decision into a chain of sequential low-SI micro-decisions, maintaining valid K-claims at each step. Fees apply per Schedule C.
  8.  **Classified Stakes Provision (CSP):** Certain factors influencing the SI calculation (e.g., undisclosed counterparty risk, pending regulatory investigation) may be deemed Classified Stakes Elements (CSEs). CSEs lower an applicant's/subject's epistemic standing but are non-disclosable. Personnel must not speculate on or disclose the existence/nature of CSEs affecting an ESR.
  9.  **Office Authority:** The Office of Epistemic Clearance (OEC) is the final arbiter of SI determinations, SEER applications, and ESR outcomes. OEC rulings establish the operative SI for a context, which simultaneously governs the epistemic standards applicable to the OEC's own determinations within that context (Refer Circular 23-15: Recursive Epistemic Governance).

  **SCHEDULE A: Stakes Index (SI) & Stakes-to-Evidence Exchange Rate (SEER)**
  | Context Example                  | SI  | SEER (Evidence Multiplier) | Min. Attestation Level (Sch B) |
  | :------------------------------- | :-: | :-------------------------: | :----------------------------- |
  | Routine Balance Inquiry          | 1   |             1x              | Level 1                        |
  | Standard Funds Transfer          | 3   |             1.5x            | Level 2                        |
  | Mortgage Pre-Approval            | 5   |             3x              | Level 3                        |
  | Large Commercial Loan Approval   | 7   |             5x              | Level 4                        |
  | Sanctions Evasion Assessment     | 9   |            10x              | Level 5                        |
  | *(CSEs may apply +/- 2 SI pts)*  |     |                             |                                |

  **DOCUMENT 2: FAQ: CSKAF/SCET FOR BRANCH STAFF (OEC)**

  *   **Q: Why can't I say "I know" to a customer anymore?**
      A: The phrase "I know" implies context-invariant certainty. Under CSKAF, certainty is stakes-sensitive. Using "I know" in a context later deemed high-stakes could constitute a misrepresentation of epistemic standing. Use the approved attestation ladder phrases (Schedule B, Circular 24-07) which accurately reflect the contextually warranted assertibility.

  *   **Q: A customer provided the same documents yesterday (approved) and today (denied). They are angry. What do I say?**
      A: Epistemic standing depends on the practical environment. While the customer's evidence base (E) may be constant, the Stakes Index (SI) may have increased due to external factors (e.g., market shift, internal risk flag, undisclosed CSE). Explain that verification standards are dynamic based on prevailing conditions, not just the documents provided. Do not reference CSEs. Utilize the script: "Our verification requirements are calibrated to current conditions to ensure robust outcomes for all clients."

  *   **Q: What is Epistemic Structuring? How do I sell it?**
      A: Epistemic Structuring (ESS) breaks down a complex, high-stakes decision (e.g., a large loan) into smaller, sequential steps, each with its own low-stakes context. This allows valid knowledge claims ("We confirm step 1 is complete") at each stage, facilitating the overall transaction while maintaining compliance. Position it as a premium service ensuring smoother processing for significant financial actions. Fees are detailed in Schedule C.

  *   **Q: A customer demands to know why their 'certainty level' dropped when 'nothing changed'.**
      A: Reiterate that certainty is contingent on the total decision environment, which is dynamic. You cannot disclose factors protected under the Classified Stakes Provision (CSP). Use the approved phrasing: "Our assessment incorporates a comprehensive view of relevant factors to meet our rigorous standards. The specific calibration is proprietary to our risk framework."

  **DOCUMENT 3: DISCIPLINARY CASE FILE: OEC/HR/DC-24-089**

  *   **Employee:** J. Doe, Loan Officer III
  *   **Date of Incident:** 2024-10-11 (Friday)
  *   **Violation:** Failure to Possess Requisite Knowledge (CSKAF Policy 24-07, Sec 3 & 6) during final approval of Application #TR78901.
  *   **Summary:** On 2024-10-07 (Monday), Doe processed initial stages of Application #TR78901. Evidence base (E1) was verified per SI=5 (Mortgage Pre-App). Doe attested Level 3 knowledge ("Evidence reviewed confirms eligibility under current parameters"). Application proceeded. On 2024-10-11 (Friday), Doe executed final approval. Evidence base remained materially identical (E1 ≈ E2). However, intervening market volatility (See Market Event Report #MER-24-10-09) increased the operative SI for final approval to 6. The required knowledge threshold was therefore higher than on Monday. OEC monitoring determined Doe's epistemic state on Friday, relative to SI=6, was insufficient for a valid Level 3 knowledge claim. Doe attested Level 3 regardless.
  *   **Mitigation:** Doe demonstrated familiarity with CSKAF policy. E1 was sufficient for SI=5. No evidence of deliberate falsification.
  *   **Aggravation:** Failure to conduct adequate Epistemic Standing Review (ESR) prior to final attestation despite known market event. Attestation made using non-compliant phrasing ("confirmed" without Level 3 qualifiers).
  *   **Finding:** Policy Violation - Level 2 (Negligent Knowledge Failure)
  *   **Sanction:** Mandatory CSKAF Re-Training (OEC-101), 10% Quarterly Bonus Forfeiture, 6-Month Probationary ESR Monitoring.

  ---

  **APPARATUS NOTE (248 words)**

  The satire hinges on "pragmatic encroachment" (PE): the view that practical factors (what's at stake) affect whether someone knows something, not just traditional epistemic factors like evidence and reliability. PE is motivated by intuitive cases: the same evidence seems insufficient for "knowing" a plane is safe if stakes are high (you're flying your family) vs. low (trivia bet). This intuitive stakes-sensitivity in *ordinary knowledge attributions* is widely acknowledged.

  However, fierce debate surrounds the *explanation*:
  1.  **Semantic Contextualism:** The word "knows" changes meaning (the standards it requires) with conversational context, which often tracks stakes. Knowledge itself doesn't change; the attribution does.
  2.  **Pragmatic Encroachment (Proper):** Stakes directly affect the *epistemic state* required for knowledge. Knowledge itself is stakes-sensitive. This often links to the idea that knowledge is the norm of practical reasoning/assertion: if stakes are high, you need stronger warrant to act/assert appropriately.
  3.  **Pragmatic Factors (Strict):** Stakes affect whether it's *appropriate to claim* knowledge (pragmatics of speech), not whether knowledge is actually possessed.

  The satire adopts a strong PE view (Point 2). Key contested aspects exaggerated include: whether knowledge *itself* (vs. attribution/speech) shifts with stakes; whether stakes external/unknown to the subject affect their knowledge; if knowledge is *the* norm of action; and the feasibility of formalizing stakes-sensitivity into policy. The "classified stakes" and "epistemic structuring" elements push PE into territory most proponents reject as impractical or unintended.

  ---

  **JOKE ANALYSIS TABLE**

  | Section                     | Doctrine_sent_up                                      | Real_feature_exaggerated                                                                 | Liberties_taken                                                                                                              | Status                                                                                                 |
  | :-------------------------- | :---------------------------------------------------- | :--------------------------------------------------------------------------------------- | :--------------------------------------------------------------------------------------------------------------------------- | :----------------------------------------------------------------------------------------------------- |
  | **Circular Sec 3, Sch A**   | Pragmatic Encroachment (PE)                           | PE claims the evidence required for knowledge increases as practical stakes rise.         | Formalizing exact "Stakes Index" and "Exchange Rates" is a bureaucratic extrapolation; PE doesn't specify metrics.           | **Contested:** Whether stakes affect knowledge *itself* (PE) or just attribution/pragmatics.           |
  | **Circular Sec 4**          | Withdrawal of "I know"                                | PE suggests "know" might be inappropriate in high stakes if evidence is borderline.      | Banning "I know" entirely and replacing with graded assertions stretches PE to a linguistic policy most wouldn't endorse.     | **Contested:** Whether PE impacts semantics (meaning of "know") or just pragmatics (use of "know").    |
  | **Circular Sec 6, Case File**| Epistemic Standing Review / Non-Persistence           | PE implies knowledge can be lost if stakes rise *even if evidence doesn't change*.       | Depicting an employee *disciplined* for "Failure to Know" due to stakes shift literalizes the consequence absurdly.         | **Contested:** Whether unknown/external stakes affect an *agent's* knowledge (most PE says yes, critics no). |
  | **Circular Sec 7, FAQ ESS** | Epistemic Structuring                                 | PE implies lowering stakes lowers evidence needed.                                       | Decomposing decisions to "chain" low-stakes knowledge claims is a logical but practically unworkable extension satirizing loophole-seeking. | **Liberty:** While logical, this "structuring" is not a feature of PE theory, just a satirical extrapolation. |
  | **Circular Sec 8, FAQ CSP** | Classified Stakes                                     | PE allows stakes unknown to the subject to affect their knowledge standing.              | Making the *stakes-lowering factors themselves* non-disclosable ("Classified") creates an unfalsifiable, Kafkaesque system. | **Contested:** Whether *external/unknown* stakes affect knowledge is a major criticism of PE.         |
  | **Circular Sec 9**          | Recursive Authority (OEC sets its own stakes/knowledge)| The normativity of knowledge (if it's the norm of assertion/action).                     | Having the OEC's rulings set the stakes that then govern what *it itself* can know is a recursive trap satirizing self-referential authority. | **Liberty:** While PE links knowledge to action norms, this specific bureaucratic recursion is invented satire. |
  | **Case File**               | Knowledge as Norm of Action/Assertion                 | If knowledge is the norm, asserting without knowing is a normative failure.              | Disciplining an employee for *failing to possess knowledge* (an internal state) due to external stakes literalizes the norm violation as an HR matter. | **Contested:** Whether knowledge *is* the unique norm of assertion/action is debated.                 |
