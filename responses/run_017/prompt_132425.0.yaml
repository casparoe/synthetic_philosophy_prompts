  We are designing a classroom activity to teach about updating on uncertain evidence. The TA has specific learning objectives and constraints. The activity should:
   - Be runnable in 80 minutes with 14 students.
   - Use no money, but perhaps chips, quiz points, or a strictly proper scoring rule.
   - Have students discover three key insights through doing the activity:
     1. When evidence has a known error rate, ordinary conditionalization (on the proposition the evidence suggests) suffices and the kinematics rule (Jeffrey conditionalization) is redundant. But when the evidence is "brute" (no proposition becomes certain and no likelihoods), Jeffrey conditionalization is necessary.
     2. The rigidity assumption (that conditional probabilities given the partition remain fixed) can fail when the evidence also tells you about the reliability of the channel.
     3. Jeffrey updates in opposite orders generally do not commute, whereas with ordinary conditionalization they do.

   Additionally, if possible, have a round with a three-cell partition to show that the partition choice matters.

   We'll design a paper-based activity with a scenario and a series of updates. Students will work in groups. We'll have two main scenarios: one with a known error rate (so ordinary conditionalization applies) and one without (so Jeffrey is needed). Then we'll have a scenario that breaks rigidity and one that shows non-commutativity.

   Materials: 
     - Handouts for each group (with the scenario and update instructions)
     - Chips or tokens for representing probabilities (optional, but can help visualize)
     - Alternatively, we can have them write numbers and use a scoring rule (e.g., quadratic scoring) to incentivize accuracy.

   Timeline (80 minutes):
     0-5 min: Introduction and setup.
     5-20 min: Part 1: Known error rate (ordinary conditionalization suffices).
     20-35 min: Part 2: Brute shift (Jeffrey conditionalization is needed).
     35-50 min: Part 3: Breaking rigidity (evidence about channel reliability).
     50-65 min: Part 4: Non-commutativity (two updates in opposite orders).
     65-75 min: Part 5 (if time): Three-cell partition (finer vs. coarser).
     75-80 min: Debrief.

   We'll have 3-4 students per group (so about 4 groups). Each group gets the same prior and then different update orders or scenarios.

   Scenario: We'll use a medical scenario for consistency, but simplified.

   Let's set up:

   Part 1: Known error rate (Ordinary conditionalization)
     Hypothesis: H = "The patient has the disease", ~H = "does not have the disease"
     Prior: P(H) = 0.2
     Test: 
        If H, then test positive (T+) with 0.9, negative (T-) with 0.1.
        If ~H, then test positive (T+) with 0.2, negative (T-) with 0.8.

     The test comes back positive. Now, what is P(H|T+)? 
     This is standard Bayes and they can compute: 
        P(H|T+) = [0.9 * 0.2] / [0.9*0.2 + 0.2*0.8] = 0.18 / (0.18+0.16) = 0.18/0.34 ≈ 0.529

     But note: the vet's statement was about a shift without becoming certain. However, in this case, the evidence is a proposition (T+) that we become certain of. So we don't need Jeffrey.

     Activity: 
        - Groups start with prior: P(H)=0.2.
        - They are told: the test is positive. They update to posterior using Bayes.
        - Then they are asked: what if the test had been negative? (but we don't do that update, just to note that the rule is clear).

   Part 2: Brute shift (Jeffrey conditionalization)
     Now, same disease, same prior. But the test result is uncertain. The vet (or lab) says: "I'm 60% sure the test is positive." 
     We don't become certain of T+ or T-. We have a shift on the partition {T+, T-}. Specifically:
          New P(T+) = 0.6, so P(T-) = 0.4.

     We assume rigidity: the conditional probabilities P(H|T+) and P(H|T-) remain as they were in the prior model (from Part 1). 
     In Part 1, we had:
          P(H|T+) = 0.529 (approx) and P(H|T-) = P(H and T-)/P(T-) 
          P(H and T-) = P(T-|H)*P(H) = 0.1 * 0.2 = 0.02
          P(T-) = P(T-|H)*P(H) + P(T-|~H)*P(~H) = 0.1*0.2 + 0.8*0.8 = 0.02 + 0.64 = 0.66
          So P(H|T-) = 0.02 / 0.66 ≈ 0.0303

     Then by Jeffrey: 
          New P(H) = P(H|T+)*New P(T+) + P(H|T-)*New P(T-)
                   ≈ 0.529 * 0.6 + 0.0303 * 0.4 ≈ 0.3174 + 0.01212 ≈ 0.3295

     Activity:
        - Groups start with the same prior (P(H)=0.2) and the same likelihoods (so they have the conditional probabilities from Part 1?).
        - They are told: the vet is 60% confident in a positive test. They are to update their belief in H without becoming certain of T+.
        - They should use the rigidity assumption (hold P(H|T+) and P(H|T-) fixed) and compute the new P(H).

     But note: they haven't been taught the formula for Jeffrey. We want them to discover that they need a rule. How?

     We can prompt: "You are not certain that the test is positive, but you now have a 60% confidence that it is. How does this change your confidence in H? You can use the fact that if you were certain of T+, then you'd have P(H)=0.529, and if you were certain of T-, you'd have P(H)=0.0303. Now you are 60% sure of T+ and 40% sure of T-. What should your new P(H) be?"

     They might average: 0.6 * 0.529 + 0.4 * 0.0303. That's exactly Jeffrey. So we can let them reason it out.

