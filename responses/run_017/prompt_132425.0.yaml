answer: |-
  Below is a runnable 80-minute seminar activity designed around your experience, with clear rules, materials, and timing. Students will work in groups of 3–4 (four groups total) to discover the key insights through hands-on updates. The activity uses a medical diagnosis scenario (disease/no disease) for consistency, with chips for probability weighting and a quadratic scoring rule for payoff (no money needed).

  ---

  ### **Materials to Carry In**
  - **Handout 1 (for all groups)**: Prior and likelihood tables (see below).  
  - **Handout 2 (Part 3 only)**: Expanded reliability scenario.  
  - **Colored chips (80 total)**: 40 red (disease), 40 blue (no disease).  
  - **Small whiteboards (4) + markers** for groups to display final probabilities.  
  - **Timer** for strict pacing.  

  ---

  ### **Scenario Setup (0–5 min)**  
  **Your script**: *"We’re diagnosing a disease in a patient. Hypothesis H: patient has the disease. Prior P(H) = 0.4. We’ll run tests with known error rates. Use chips to represent probabilities: red = H, blue = ~H. Start with 40 red and 40 blue chips (total 80 chips = 100% confidence)."*  
  - **Likelihoods (displayed upfront)**:  
    - If H: Test T+ with 90% probability (T−: 10%).  
    - If ~H: Test T+ with 20% probability (T−: 80%).  

  ---

  ### **Part 1: Known Error Rate → Ordinary Conditionalization (5–20 min)**  
  **Task**: Groups observe a definitive T+ result. Update P(H) using Bayes.  
  **Rules**:  
  1. Calculate P(H|T+) using chips: Split red/blue into T+/T− piles per likelihoods.  
     - *Red chips*: 90% of 40 red = 36 red in T+, 4 red in T−.  
     - *Blue chips*: 20% of 40 blue = 8 blue in T+, 32 blue in T−.  
  2. T+ pile has 36 red + 8 blue. P(H|T+) = 36/(36+8) ≈ 0.818. Move all chips to T+ pile (discard T−).  
  **Payoff**: Groups report P(H|T+). Score via quadratic scoring rule (QSR): **1 − (1 − reported P(H))²** if H true, else **1 − (reported P(H))²**. *TA secretly rolls a die: 1–5 = H true (match chip count), 6 = ~H.*  

  **Debrief point (revealed later)**: *You became certain of T+ → Bayes worked. No need for Jeffrey!*  

  ---

  ### **Part 2: Brute Shift → Jeffrey Conditionalization (20–35 min)**  
  **Task**: Vet says *"I’m 60% confident T+."* No likelihoods for the shift itself. Update P(H).  
  **Rules**:  
  1. *Without touching chips*, compute what P(H) *would be* if certain of T+ (≈0.818) or T− (P(H|T−) = 4/(4+32) ≈ 0.111).  
  2. Vet’s 60% confidence shifts P(T+) to 0.6, P(T−) to 0.4.  
  3. **Jeffrey update**: New P(H) = [P(H|T+) × 0.6] + [P(H|T−) × 0.4] ≈ (0.818×0.6) + (0.111×0.4) ≈ 0.545.  
  4. Adjust chips: 54.5% of 80 ≈ 44 red chips (round to whole numbers).  

  **Payoff**: QSR based on reported P(H). Die roll determines ground truth.  

  **Debrief point**: *No proposition to condition on → Bayes fails, Jeffrey required.*  

  ---

  ### **Part 3: Breaking Rigidity (35–50 min)**  
  **New info (Handout 2)**: Lab reliability R (P(R) = 0.8). If unreliable (~R), T is random (P(T+|H,~R) = 0.5).  
  **Task**: Vet says *"Lab was unreliable today (~R is true)."* Then, *"60% confident T+."* Update P(H).  
  **Rules**:  
  1. Condition on ~R:  
     - P(H|~R) = [P(~R|H) × P(H)] / P(~R).  
     - Prior: P(~R|H) = 0.2, P(~R|~H) = 0.2 → P(~R) = 0.2.  
     - P(H|~R) = (0.2 × 0.4) / 0.2 = 0.4 → Set chips to 32 red, 48 blue.  
  2. Under ~R, T is independent of H → P(H|T+, ~R) = P(H|~R) = 0.4.  
  3. Jeffrey update with new P(T+) = 0.6: New P(H) = (0.4 × 0.6) + (0.4 × 0.4) = 0.4.  
  **Contrast**: If groups skipped conditioning on ~R and used old P(H|T+)≈0.818, they’d get 0.545 (wrong).  

  **Payoff**: QSR; emphasize that scores drop if rigidity breaks.  

  **Debrief point**: *Learning ~R changed P(H|T+) → rigidity failed. Evidence altered channel reliability!*  

  ---

  ### **Part 4: Non-Commutativity (50–65 min)**  
  **Groups 1–2**: Update on Test A (60% A+), then Test B (70% B+).  
  **Groups 3–4**: Update on Test B (70% B+), then Test A (60% A+).  
  **New likelihoods for Test B**:  
  - If H: P(B+|H) = 0.8 (B−: 0.2).  
  - If ~H: P(B+|~H) = 0.3 (B−: 0.7).  
  **Rules**:  
  1. Groups 1–2:  
     - Jeffrey on A (as in Part 2) → P(H)≈0.545.  
     - With this as new prior, Jeffrey on B → New P(H)≈0.627.  
  2. Groups 3–4:  
     - Jeffrey on B first (P(H|B+)≈0.64, P(H|B−)≈0.15 → New P(H) = (0.64×0.7)+(0.15×0.3)≈0.493).  
     - Jeffrey on A → New P(H)≈0.576.  
  **Result**: 0.627 (A→B) ≠ 0.576 (B→A).  

  **Payoff**: QSR; groups see divergence.  

  **Debrief point**: *Jeffrey updates don’t commute! Order matters, unlike strict conditioning.*  

  ---

  ### **Debrief (65–80 min)**  
  Map activities to insights:  
  1. **Part 1 vs. Part 2**: Certain evidence (T+) → Bayes works (redundant machinery). Brute shift → Bayes fails, Jeffrey essential.  
  2. **Part 3**: Rigidity broke because evidence (~R) altered P(H|T+) (channel reliability). Not an arithmetic error—a failure of the rigidity assumption.  
  3. **Part 4**: Non-commutativity exposed—Jeffrey is order-sensitive.  
  4. **Normative gap (close yourself)**: *"Rigidity isn’t ‘rationality’—it’s the best guess when you lack meta-information. But real evidence often tells you about the channel!"*  

  ---

  ### **Predictable Issues & Fixes**  
  1. **Students refuse to commit to a number**: Use chips to force tangible representation; QSR incentivizes honesty.  
  2. **Re-deriving priors**: Circulate and intervene: *"Update from your current chips, not the original priors!"*  
  3. **Cross-table talk**: Assign Group 1–2 (Order A→B) and 3–4 (Order B→A). Reveal results simultaneously.  
  4. **Three-cell partition skipped**: Time limits; focus on core goals. Mention it in closing: *"Finer partitions matter—e.g., if evidence shifts P(A∨B) but you need P(A|A∨B), that’s a choice!"*  

  ---

  ### **What the Activity Can’t Stage**  
  The genuinely normative question—whether rigidity is *required* or just a default—must be discussed verbally in closing. No payoff scheme can simulate this; it’s about interpreting rationality under uncertainty. Your closing script: *"Jeffrey isn’t ‘wrong’—it’s your best move when clueless about the channel. But real life often gives you channel data. That’s when rigidity bites you."*  

  ---  
  **Total time**: 80 minutes. **Materials used**: Chips, handouts, whiteboards. **No citations, no fluff**—just your seminar room and a timer. Run it!
