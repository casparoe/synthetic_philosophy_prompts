          Example: 
              Partition A (coarse): {T+, T-}
              Partition B (finer): {T+ and lab reliable, T+ and lab unreliable, T- and lab reliable, T- and lab unreliable} but that's four.

          We can do: 
              We have three hypotheses: H1, H2, H3 (mutually exclusive and exhaustive). 
              Prior: P(H1)=0.5, P(H2)=0.3, P(H3)=0.2.
              We get uncertain evidence that shifts our confidence on a coarse partition: { (H1 or H2), H3 } -> so two cells.

              We set: 
                  New P(H1 or H2) = 0.7, so P(H3)=0.3.

              Rigidity: we hold P(H1 | (H1 or H2)) fixed? But note: in the prior, P(H1 | H1 or H2) = 0.5/(0.5+0.3)=0.5/0.8=0.625.
              Then after update, P(H1) = P(H1 | (H1 or H2)) * New P(H1 or H2) = 0.625 * 0.7 = 0.4375.
              Similarly, P(H2) = P(H2 | (H1 or H2)) * New P(H1 or H2) = (0.3/0.8)*0.7 = 0.375*0.7=0.2625.
              P(H3)=0.3.

              But now, if we had used a finer partition (say, we were able to shift on each of H1, H2, H3 individually) and we had been given:
                  New P(H1)=0.4375, New P(H2)=0.2625, New P(H3)=0.3 -> that's one possibility.

              But what if the evidence actually gave us a different shift on the finer partition? 

              Example: the evidence might be such that it should shift H1 and H2 differently. But we are forcing a shift only on the coarse partition.

              How to show that the partition matters? We can have a scenario where the same evidence is modeled either as a shift on the coarse partition or as a shift on the finer one, and they yield different results.

          However, the point is that the update rule requires you to choose a partition, and if you choose a coarse one, you are making an assumption that the evidence does not distinguish between H1 and H2.

          We might not have time. We'll skip if needed.

   Implementation:

     Materials: 
          Handout 1: Part 1 and Part 2 (known error rate and brute shift)
          Handout 2: Part 3 (breaking rigidity) - with the expanded state
          Handout 3: Part 4 (non-commutativity) - two groups get different orders

     We'll do:

          Part 1: Groups compute the posterior given a positive test (certain evidence). 
          Part 2: Groups update using a brute shift (60% on T+).

          Part 3: 
              Group A: does the brute shift without knowing about R -> they get 0.3295.
              Group B: first learns ~R (so they condition and get P(H)=0.4), then does the brute shift on T (but under ~R, the test is uninformative) so they get 0.4.

          But wait, in Part 3 we want to break rigidity. We want to show that the conditional probabilities changed. So we can have:

              Group A: uses the original conditional probabilities (which assumed the lab might be reliable) to do the brute shift -> gets 0.3295.
              Group B: learns about the lab being unreliable, and then uses conditional probabilities under ~R to do the brute shift -> gets 0.4.

          Then we compare: why are they different? Because the conditional probabilities P(H|T+) and P(H|T-) changed after learning ~R.

          But note: Group A never learned about R, so they used the old conditionals. Group B did. So the point is: the rigidity assumption fails if the evidence gives you information that changes the conditional probabilities.

     However, this requires that we have two different groups with different information. We can do:

          Step 1: All groups get the expanded state (H and R) and the prior (P(H)=0.2, P(R)=0.8, and the conditionals as above).

          Step 2: We give the brute shift to all groups: "The test result is in and we are 60% confident it is positive." But we do not tell them about the lab being unreliable.

          Then, we ask: what is your new P(H)? 

          They should compute by Jeffrey on the partition {T+, T-}. To do that, they need P(H|T+) and P(H|T-) from the prior model (which includes R). 

          How to compute P(H|T+) in the expanded model?
              P(H|T+) = P(H and T+) / P(T+)
              P(H and T+) = P(H) * [ P(R|H)*P(T+|H,R) + P(~R|H)*P(T+|H,~R) ]
                           = 0.2 * [ 0.6*0.9 + 0.4*0.5 ] 
                           = 0.2 * [0.54 + 0.2] = 0.2 * 0.74 = 0.148
              P(T+) = P(H and T+) + P(~H and T+)
                     = 0.148 + P(~H) * [ P(R|~H)*P(T+|~H,R) + P(~R|~H)*P(T+|~H,~R) ]
                     = 0.148 + 0.8 * [0.85*0.2 + 0.15*0.5] 
                     = 0.148 + 0.8 * [0.17 + 0.075] = 0.148 + 0.8*0.245 = 0.148 + 0.196 = 0.344
              So P(H|T+) = 0.148 / 0.344 ≈ 0.4302

              Similarly, P(H|T-) = P(H and T-) / P(T-)
              P(H and T-) = 0.2 * [0.6*0.1 + 0.4*0.5] = 0.2 * [0.06+0.2] = 0.2*0.26=0.052
              P(T-) = 1 - P(T+) = 1-0.344=0.656
              So P(H|T-) = 0.052/0.656 ≈ 0.0793

              Then new P(H) = 0.4302*0.6 + 0.0793*0.4 ≈ 0.25812 + 0.03172 = 0.28984

          Step 3: Now, we tell the groups: "But wait, the lab also reported that the assay was drifting, so you are now certain that the lab was unreliable today." 
                  Then they must first condition on ~R. They get P(H | ~R) = [P(~R|H)*P(H)] / P(~R) = [0.4*0.2]/0.2 = 0.4? 
                  But wait, P(~R) = 1 - P(R) = 0.2? 
                  And P(H and ~R) = P(~R|H)*P(H) = 0.4*0.2=0.08 -> so P(H|~R)=0.08/0.2=0.4.

                  Then, under ~R, T is independent of H, so P(H | T+, ~R) = P(H|~R)=0.4, and P(H | T-, ~R)=0.4.

                  Now, they are told: the test result is in and we are 60% confident it is positive. They should update on T, but now using the conditionals under ~R. 
                  New P(H) = 0.4*0.6 + 0.4*0.4 = 0.4.

          So we have two different final probabilities: 0.29 vs 0.4.

          The point: in the first update (without knowing about the drifting) we used one set of conditionals. After learning about the drifting, the conditionals changed. So if we had done the brute shift update first and then learned about the drifting, we would have to redo the update? 

          But note: the order of information matters. In the activity, we did the brute shift first and then the conditioning on ~R. What if we reverse? 

          Alternative: 
              First, condition on ~R -> P(H)=0.4.
              Then do the brute shift on T: under ~R, T is independent of H, so the update leaves P(H)=0.4.

          But if we had conditioned on ~R first, then the brute shift update on T does not change H.

          However, the point for rigidity break is that the conditionals changed because of the new information about R. So if we had tried to do a Jeffrey update after learning about R, we would have different conditionals.

     We can do Part 3 as:

          Round 3a: Groups are not told about R. They only know H and T. They have the prior for H (0.2) and the likelihoods (which implicitly assume the lab is reliable). They do the brute shift -> get 0.3295 (as in Part 2).

          Round 3b: Groups are given the expanded state (H and R). They are told about the brute shift (60% T+) without any news about R. They compute the new P(H) (which is 0.28984).

          Round 3c: Groups are given the expanded state. They are told first that the lab is unreliable (condition on ~R) and then they do the brute shift update -> get 0.4.

          Why are 3a and 3b different? Because in 3a they didn't know about R, so they used a simpler model. But in 3b, they used the full model and got a different number. This is not exactly a break of rigidity during the update, but shows that the model matters.

          To see rigidity break: in the full model, if we had done the brute shift update first (getting 0.28984) and then learned ~R and conditioned on it, we would have to recompute everything. That would change the probability of H again. So the rigidity assumption (that the conditionals remain fixed) is only valid if we don't get evidence that changes them.

     Given time constraints, we might do a simplified Part 3.

     Revised plan for Part 3:

          We'll have two groups:

            Group X: 
               Step 1: Update on the brute shift (60% T+) using the simple model (only H and T, no R) -> they get 0.3295.
               Step 2: Then they are told: "But now you learn that the lab was unreliable that day." How do they update? They don't have R in their model. So they are stuck. This shows that the simple model is insufficient.

            Group Y (expanded model):
               Step 1: They are told: "The lab was unreliable that day." -> they condition on ~R -> get P(H)=0.4.
               Step 2: Then they are told: "The test result is in and we are 60% confident it is positive." -> they do the brute shift under ~R -> get 0.4.

          But then we want to show that if you have the expanded model and you do the brute shift first without conditioning on ~R, you get a different number than if you condition first.

          So add:

            Group Z (expanded model):
               Step 1: Brute shift on T (without any news on R) -> they get 0.28984.
               Step 2: Then they are told: "The lab was unreliable that day." -> they condition on ~R. How? 
                       They have a new distribution after the brute shift. They need to compute P(~R) after the brute shift? 
                       But they did a Jeffrey update on T, so they have new probabilities for T+ and T-, but also they have the conditionals P(H|T+) and P(H|T-) fixed? 

                       Actually, after the brute shift, their new distribution is:
                           P(H and T+ and R) = P(R|H, T+) * P(H, T+) ... but we don't have that.

                       This is messy. We might avoid by saying: the evidence about the lab being unreliable is new and should be incorporated by conditioning. But then they have to condition on ~R in the new distribution. 

                       How to compute P_{new}( ~R )? 
                           P_{new}(~R) = P_{new}(~R | T+)*P_{new}(T+) + P_{new}(~R | T-)*P_{new}(T-)

                       But they don't have these conditionals. The brute shift update only gave them new probabilities for T+ and T- and then mixed H accordingly. It did not update the joint distribution with R.

                       This shows that Jeffrey update on a partition does not update the entire joint distribution - it only updates the marginal of the partition and then sets the other variables by the rigidity condition. But if we then condition on ~R, we are doing something that the rigidity condition doesn't account for.

          This might be too advanced.

     Given the time, we might focus on Part 1,2,4 and mention Part 3 in the debrief as in the TA's story.

     Let's make a timeline:

          0-5 min: Introduction. Explain the scenario (medical test for a disease). 
          5-15 min: Part1 - certain evidence. Groups compute P(H|T+). (They know the likelihoods.) -> 10 min.
          15-25 min: Part2 - brute shift. Groups are told: we are not certain of T+, but 60% confident. They are prompted: "If you were certain of T+, you would have P(H)=X. If you were certain of T-, you would have P(H)=Y. Now you are 60% on T+ and 40% on T-. What is your new P(H)?" -> 10 min.
          25-35 min: Part4 - non-commutativity. 
                  Group1: update T then S (with given new probs: T+ at 60%, then S+ at 70%)
                  Group2: update S then T (S+ at 70%, then T+ at 60%)
                  They compute final P(H). -> 10 min.
          35-40 min: Groups report results. Write on board: Group1 final P(H), Group2 final P(H). They are different. -> 5 min.

          40-55 min: Part3 - breaking rigidity (simplified). 
                  We do the expanded model. 
                  First, groups are given the expanded state (H and R) and the prior. 
                  They are asked to compute the conditional probabilities for H given T+ in the prior state -> 0.4302.
                  Then, they are told: "The lab was unreliable that day." -> condition on ~R. 
                  Then they compute P(H|~R) = 0.4.
                  Then they are told: "The test result is in and we are 60% confident it is positive." -> they update under ~R and get new P(H)=0.4.
                  Meanwhile, if they hadn't conditioned on ~R, they would have done: new P(H) = 0.4302*0.6 + ... = 0.28984.
                  We don't have time for both in class, so we do the conditioning first version, and then we tell them the other number. 
                  The point: the conditional probabilities changed because of the information about R. -> 15 min.

          55-75 min: Debrief. Map to the learning objectives. -> 20 min.
          75-80 min: Conclusion.

     Debrief mapping:

          Part1: Showed that when evidence is certain (we learn T+), we can use ordinary conditionalization. The kinematics rule (Jeffrey) is not needed.

          Part2: Showed that when the evidence is brute (60% on T+), we cannot use ordinary conditionalization because we don't have a proposition to condition on. We used a rule (which is Jeffrey) by holding the conditionals fixed.

          Part4: Showed that two Jeffrey updates in opposite orders do not commute. This is unlike ordinary updates which do commute.

          Part3: Showed that the rigidity assumption (that the conditional probabilities given the partition cells remain fixed) can fail. In this case, when we learned about the lab being unreliable, the conditional probabilities P(H|T+) and P(H|T-) changed. So if we had done the brute shift update first and then learned about the lab, we would have to re-evaluate. The assumption that these conditionals remain fixed is not always true.

     What can go wrong:

          - Students might not commit to a number: Encourage them to write down their best guess and assure them that the activity is about the process.
          - Students re-derive priors: Circulate and check their work. Remind them to update from their current beliefs.
          - Groups talk across tables: Assign roles (recorder, calculator, etc.) and have them work on different parts of the problem. For the non-commutativity, have half the class do one order and half the other, then collect results secretly and reveal at the end.

     What the activity cannot settle:

          The normative question: is holding the conditional probabilities fixed something rationality requires, or merely a default when you have no better information? We will discuss in closing.

     Handouts:

          We will provide one handout per group. It will have:

            Part1: 
               Prior: P(H)=0.2
               Likelihoods: 
                   P(T+|H)=0.9, P(T-|H)=0.1
                   P(T+|~H)=0.2, P(T-|~H)=0.8
               Evidence: The test is positive. What is your new P(H)?

            Part2:
               Same prior and likelihoods.
               Evidence: The vet is 60% confident the test is positive. What is your new P(H)? 
                         Hint: If you were certain the test was positive, what would P(H) be? If you were certain it was negative? Now you are 60% on positive and 40% on negative.

            Part4:
               We have two tests, T and S.
               Prior: P(H)=0.2
               Likelihoods for T: same as above.
               Likelihoods for S:
                   P(S+|H)=0.8, P(S-|H)=0.2
                   P(S+|~H)=0.3, P(S-|~H)=0.7
               Group1: 
                   Step1: Update T: new P(T+)=0.6 -> compute new P(H).
                   Step2: Update S: new P(S+)=0.7 -> compute new P(H) (using your current beliefs from step1).
               Group2:
                   Step1: Update S: new P(S+)=0.7 -> compute new P(H).
                   Step2: Update T: new P(T+)=0.6 -> compute new P(H) (using your current beliefs from step1).

            Part3:
               Now, we consider the lab reliability. Let R: "lab is reliable", with P(R)=0.8.
               But note: the reliability might depend on H? We assume dependence:
                   P(R|H)=0.6, so P(~R|H)=0.4
                   P(R|~H)=0.85, so P(~R|~H)=0.15
               And the test T: 
                   If R and H: P(T+|R,H)=0.9, P(T-|R,H)=0.1
                   If R and ~H: P(T+|R,~H)=0.2, P(T-|R,~H)=0.8
                   If ~R and H: P(T+|~R,H)=0.5, P(T-|~R,H)=0.5
                   If ~R and ~H: P(T+|~R,~H)=0.5, P(T-|~R,~H)=0.5

               Step1: You are told: "The lab was unreliable that day." (so ~R is true). Condition on ~R. What is your new P(H)? 
                      Hint: Use Bayes on ~R.

               Step2: You are told: "The test result is in and we are 60% confident it is positive." 
                      Under ~R, what is P(H|T+)? What is P(H|T-)? 
                      Then compute new P(H) = P(H|T+) * 0.6 + P(H|T-) * 0.4.

     Due to time, we might not do the full expanded model calculation in class for Part3. We can provide the conditional probabilities or do it together.

     Given the complexity, we will provide in the Part3 handout the following:

          After conditioning on ~R, we have:
              P(H | ~R) = [P(~R|H)*P(H)] / P(~R) 
                        = [0.4 * 0.2] / [0.4*0.2 + 0.15*0.8] 
                        = 0.08 / (0.08+0.12) = 0.08/0.20 = 0.4

          And under ~R, T is independent of H, so:
              P(H | T+, ~R) = P(H | ~R) = 0.4
              P(H | T-, ~R) = 0.4

          Then new P(H) = 0.4*0.6 + 0.4*0.4 = 0.4.

     In the debrief, we will contrast this with the number from Part2 (0.3295) and note that the difference is because in Part2 we assumed the lab was reliable.

     Finally, the TA can close with the normative question.

