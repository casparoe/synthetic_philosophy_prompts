  I recall that in evolutionary game theory, strategies that can't invade when rare but can resist invaders when common are Evolutionarily Stable Strategies (ESS). But ESS doesn't cover the ability to spread from rarity. That's where concepts like convergence stability come in. The user's second observation about strategies thriving at intermediate frequencies points to frequency-dependent selection. Specifically, a stable polymorphic equilibrium where multiple strategies coexist. 

  The user's case where a strategy's fitness peaks at 40% and declines beyond that suggests negative frequency-dependent selection. This happens when a strategy is advantageous when rare but loses its edge as it becomes common. In the prisoner's dilemma, this could be due to strategies exploiting cooperators when they're common, leading to a balance. 

  The term "protected polymorphism" comes to mind, where multiple strategies are maintained in the population. The mechanism here is likely the negative frequency dependence. The user's reproduction rule (proportional to average score) might amplify this, but the core mechanism stems from the game dynamics. 

  I should also consider if the iterated nature affects this. With memory, strategies can condition their actions, leading to more complex interactions. Tit-for-tat, for example, does well with others like itself but suffers when defectors invade. This aligns with the described behavior. 

  The user mentioned terms like "tipping point" or "critical mass," but they want the mechanism, not just the curve shape. So emphasizing frequency-dependent selection and stable polymorphism would be better. Terms like "evolutionarily stable state" or "convergence stable" might be relevant but don't fully capture the intermediate peak. 

  In conclusion, the best fit is a stable polymorphic equilibrium maintained by negative frequency-dependent selection. Explaining this with concrete examples from their simulation (like mutualistic strategies doing well together but vulnerable when rare or too common) should help. Highlighting that the reproduction rule enables this but the mechanism is inherent in the game's structure, especially with iteration and memory.
answer: |-
  Based on your detailed description, the core phenomenon you're observing for the last configuration is best captured by established concepts in evolutionary game theory and ecology, though no *single* perfect term exists. Here's the conceptual carving:

  1.  **The Mechanism: Negative Frequency-Dependent Selection (NFDS):** This is the fundamental driver. A strategy's fitness (average score) *decreases* as its own frequency *increases* within the population. Your observation – peak fitness at ~40%, lower fitness when rarer *or* more common – is the classic signature of NFDS. The success depends critically on the current mix of opponents.

  2.  **The Equilibrium State: Stable Polymorphic Equilibrium / Protected Polymorphism:**
      *   **Stable Polymorphic Equilibrium:** This describes the *outcome* where multiple strategies (in this case, your focal strategy and at least one other resident type) coexist stably at non-zero frequencies over generations. Your population settling near the 40% peak is exactly this.
      *   **Protected Polymorphism:** This emphasizes that *both* strategies are protected from extinction by frequency dependence. Your focal strategy cannot invade when too rare (<15-20%), but once established (above that threshold), it is protected from being driven extinct *and* it prevents itself from becoming fixed (due to its declining fitness when too common). The resident strategy(s) are similarly protected at their equilibrium frequencies.

  3.  **The Invasion Barrier: Critical Frequency / Invasion Threshold:**
      *   The 15-20% point below which the strategy cannot establish is its **invasion threshold** or **critical frequency** under the current resident population. Below this, selection opposes its increase. Above it, NFDS (acting positively while rare) allows it to increase towards the equilibrium.

  4.  **Distinguishing from ESS and Related Concepts:**
      *   **ESS (Evolutionarily Stable Strategy):** An ESS is resistant to invasion by *any* sufficiently rare mutant when it is fixed. Your first observation (needs 30% to invade, then resists mutants) *could* describe an ESS that is also difficult to invade (has a large "basin of attraction"). However, an ESS is typically defined at fixation (100%), while your focal strategy thrives only at intermediate frequencies. An ESS *can* sometimes lead to stable polymorphisms if multiple ESSs coexist, but the ESS concept itself focuses on fixation resistance.
      *   **Convergence Stability:** This refers to a strategy being able to *invade* from rarity and go to fixation. Your focal strategy lacks this (can invade only above a threshold, and doesn't go to fixation). Your "spread then collapse" strategies *are* convergence stable but not evolutionarily stable.
      *   **Your Focal Strategy's Properties:** It is **not an ESS** (it doesn't resist invasion when fixed; its fitness plummets). It is **not convergence stable** (it cannot invade from infinitesimal rarity). Its key properties are:
          *   **Invadable when rare** (below threshold).
          *   **Capable of invasion above a critical frequency.**
          *   **Subject to strong Negative Frequency-Dependent Selection.**
          *   **Maintains a Stable Polymorphic Equilibrium** with other strategies.

  **Why "Tipping Point" and "Critical Mass" aren't quite right:**

  *   These terms describe the *threshold* (the 15-20% point) itself. They name the point where dynamics change dramatically (from decline to increase), but they don't capture the *mechanism* (NFDS) or the *stable outcome* (polymorphism). They are symptoms of the underlying NFDS dynamics.

  **Impact of Iteration and Reproduction Rule:**

  1.  **Iteration vs. One-Shot:** This is crucial. One-shot PD has a dominant strategy (Always Defect). The complex dynamics you see (cooperation, NFDS, stable polymorphisms) *only emerge because of iteration and strategy memory*. Strategies like Tit-for-Tat, Win-Stay-Lose-Shift, or more complex ones exploit the repeated interactions, creating the possibility for cooperation to be stable *if* enough others also cooperate conditionally. Your focal strategy likely relies on conditional cooperation or punishment that becomes less effective or more exploitable as its frequency changes.
  2.  **Reproduction Rule (Proportional to Average Score):** This rule is standard (replicator dynamics) and is precisely what translates the game payoffs (fitness) into evolutionary dynamics. It *enables* the NFDS to manifest in the population frequencies. While alternative rules (e.g., tournament selection) might alter quantitative details, the core phenomenon of NFDS driving stable polymorphisms is a fundamental property of the payoff structure in the iterated game itself. Your rule isn't creating an artifact; it's revealing the inherent frequency-dependent fitness landscape.

  **Conclusion and Recommended Terminology:**

  The most precise description of your focal strategy's configuration is:

  *   **A strategy exhibiting Negative Frequency-Dependent Selection (NFDS) that maintains a Stable Polymorphic Equilibrium, protected by an Invasion Threshold.**

  **To communicate this effectively:**

  1.  **Lead with the Outcome:** Describe it as a **Stable Polymorphic Equilibrium** or **Balanced Polymorphism** maintained by frequency dependence.
  2.  **Explain the Mechanism:** State clearly that the strategy's success is governed by **Negative Frequency-Dependent Selection (NFDS)** – its fitness is highest at intermediate frequencies and declines when it becomes too common *or* too rare.
  3.  **Highlight the Threshold:** Emphasize the existence of a **critical invasion frequency** or **invasion threshold** below which it cannot establish itself.
  4.  **Contrast Simpler Concepts:** Explicitly differentiate it from an ESS (which assumes fixation and resistance) and convergence stability (which requires invasion from rarity). Point out that this strategy thrives *only* in a mix, not alone.

  **Why this fits:** This terminology accurately captures the mechanism (NFDS), the dynamic process (invasion only above threshold, pull-back from fixation), and the stable outcome (polymorphism). It uses established, rigorous language from evolutionary biology and game theory, directly applicable to your iterated game context with standard replicator dynamics.
