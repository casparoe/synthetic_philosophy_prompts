answer: |-
  Here's a breakdown of the conceptual differences between historical revisionism and denialism, focusing on your specific questions regarding genocide characterization and methodological markers:

  **Core Conceptual Differences:**

  1.  **Historical Revisionism:** A legitimate and essential part of the historical discipline. It involves re-examining established interpretations of past events based on **new evidence, new methodologies, changing perspectives, or critical analysis of existing sources.** Its goal is a more accurate, nuanced, or comprehensive understanding. Revisionism operates *within* the established framework of historical facts and methodologies.
  2.  **Denialism:** An ideological position masquerading as scholarship. It seeks to **deny or significantly minimize established historical facts**, often to serve a specific political, nationalist, or ideological agenda. It rejects the consensus of experts based not on superior evidence or methodology, but on the *desire* for the event not to have happened or to be viewed differently. It operates *outside* or *against* the established framework of historical evidence and methodology.

  **Distinguishing Denial of Event vs. Denial of Characterization:**

  *   **Denial that the Event Occurred:** This is the most blatant form of denialism. Examples: Claiming the Holocaust didn't happen, the Armenian deportations never occurred, or the Nanjing Massacre was fabricated. This directly contradicts overwhelming archival, testimonial, and material evidence.
  *   **Denial of Moral/Legal Characterization (Intentionality, Systematization, Genocide Label):** This is a more sophisticated but often equally pernicious form of denialism, especially concerning genocide. It accepts that deaths occurred but disputes:
      *   **Intent:** Claiming deaths were accidental, unforeseen consequences of war/famine/disorganization, not a result of deliberate policy.
      *   **Systematic Nature:** Arguing events were localized, spontaneous outbursts of violence by rogue elements, not centrally planned or organized.
      *   **"Genocide" Label:** Rejecting the application of the legal/scholarly term "genocide" based on disputed interpretations of intent, scale, or the definition itself.

  **Your Specific Case: Acknowledging Deaths, Denying Intent/System/Genocide**

  This **belongs firmly within the realm of denialism** when it ignores or dismisses the overwhelming body of evidence supporting intentionality and systematization that forms the basis of the historical consensus. Here's why, using your examples:

  1.  **Holocaust:** Denying intent/system ignores the explicit genocidal ideology of Nazism (Mein Kampf, speeches), the systematic bureaucratic planning (Wannsee Conference, Einsatzgruppen reports), the establishment of extermination camps with specific technology, and countless perpetrator testimonies documenting orders and intent. Claiming these deaths were merely an unfortunate byproduct of war is denialism.
  2.  **Armenian Genocide:** Denying intent/system ignores the Ottoman government's centralized decisions (Tehcir Law), the organized deportation routes leading to death marches, the systematic disarmament of Armenian soldiers and civilians beforehand, the targeting of community leaders, documented orders from officials, and the use of paramilitary units (Special Organization) to carry out massacres. Attributing deaths solely to wartime chaos, famine, or mutual civil conflict is denialism.
  3.  **Nanjing Massacre:** Denying intent/system ignores the documented orders and directives from Japanese commanders (e.g., "Kill All Captives"), the organized nature of the killing contests reported in Japanese newspapers, the systematic hunting of soldiers and suspected soldiers (often including civilians), widespread rape as a weapon, and the sheer scale and duration (weeks) of the atrocities witnessed by neutral observers (like the International Committee). Framing this solely as the tragic collateral damage of urban warfare is denialism.

  **Methodological Markers Separating Legitimate Revision from Denial:**

  1.  **Engagement with the Archive:**
      *   **Revisionism:** Actively seeks out *all* relevant archival sources (including newly discovered or previously neglected ones), engages critically with their content and context, acknowledges counter-evidence, and builds arguments based on comprehensive source analysis.
      *   **Denialism:** Cherry-picks isolated documents out of context, ignores vast bodies of contradictory evidence in archives (especially perpetrator records, contemporaneous reports, eyewitness accounts), relies heavily on dubious or forged documents, or dismisses entire archives as biased/invalid without substantive proof.
  2.  **Falsifiability:**
      *   **Revisionism:** Proposes arguments and interpretations that are potentially falsifiable by evidence. It welcomes scrutiny and the testing of its claims against the historical record.
      *   **Denialism:** Arguments are often unfalsifiable or constructed in ways immune to evidence. Counter-evidence is dismissed as fabricated, coerced, or biased ("victor's history"). Conspiracy theories about evidence suppression are common.
  3.  **Responsiveness to Evidence:**
      *   **Revisionism:** Adjusts interpretations and conclusions based on new, credible evidence. It weighs evidence proportionally and acknowledges the strength of the overall record.
      *   **Denialism:** Ignores, dismisses, or distorts evidence that contradicts the desired conclusion. Engages in special pleading or moving the goalposts when confronted with inconvenient facts. Focuses obsessively on minor inconsistencies while ignoring the overwhelming preponderance of evidence.
  4.  **Consensus-Seeking:**
      *   **Revisionism:** Engages constructively within the scholarly community. Aims to persuade peers through rigorous argument and evidence, contributing to a (potentially evolving) consensus based on the best available information.
      *   **Denialism:** Rejects the established scholarly consensus as fundamentally flawed or politically motivated. Operates on the fringe, often appealing directly to the public or politicians rather than engaging in good faith academic discourse. Creates its own parallel "scholarship" networks.
  5.  **Allocation of the Burden of Proof:**
      *   **Revisionism:** Understands that established historical events supported by vast evidence have a high threshold for being overturned. The burden of proof lies heavily on the revisionist to demonstrate, with substantial new evidence and rigorous argument, why the consensus view is wrong.
      *   **Denialism:** Illegitimately shifts the burden of proof. Demands that mainstream historians "prove" the event happened "beyond any conceivable doubt" (an impossibly high standard), while offering little credible evidence for their own counter-narratives. Treats the established event as an unproven allegation requiring disproving, rather than a conclusion based on evidence.

  **Conclusion:**

  Legitimate historical revisionism refines our understanding of *how* and *why* established events occurred by engaging rigorously with all available evidence and methodological standards. Denialism, whether outright denying the event or denying its core characteristics (intent, system, genocide label), seeks to erase or minimize established historical realities by ignoring evidence, employing faulty methodology, and shifting burdens of proof for ideological reasons. The case you outlined – acknowledging deaths but denying intent, system, and the genocide label in the face of overwhelming evidence demonstrating these very elements – is a classic hallmark of sophisticated genocide denialism, not legitimate historical revision. It attempts to sanitize history by stripping it of its moral and legal significance.
