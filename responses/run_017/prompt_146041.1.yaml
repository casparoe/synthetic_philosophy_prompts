  ## The Sodium Strategy

  The sodium light above the car park buzzed like a trapped wasp, casting a jaundiced glow on the wet asphalt. Arthur scraped the last gritty dregs of machine coffee from his thermos lid. Beside him, Marie shivered, watching the fog coil thick and silent beyond the chain-link fence, swallowing the industrial estate whole. The laundromat cat, a one-eyed ginger tom, wound itself around her ankles, purring like a poorly tuned engine.

  “Three lights,” Arthur said, his breath frosting. “Same flicker, same bloody awful coffee smell if you roll down the window. Can’t tell one from the other once you’re in it.”

  “Wipe clean,” Marie finished, pulling her thin coat tighter. “Every time. Fresh start, same problem.” Forty-two years meant they often spoke in shorthand, sentences converging like tired rivers. They’d lived this nightly gauntlet since the factory moved to this godforsaken edge-of-town site six months ago.

  Arthur ticked off the possibilities on work-roughened fingers. “First light: laundromat car park. Sleep sitting up, wake up feeling like you’ve been hit by the lorry you unload. Call it… ‘ruined’. Worth 1 unit of misery.”

  “Second light: home,” Marie said, a yearning in her voice as palpable as the cold. “Bed. Worth 4.”

  “Third light: the lake road. Gets you home, eventually. Two hours, past…” Arthur’s voice tightened. “Past the old oak where we stopped that downpour in ’89. Past the bend where the deer… you know.” He cleared his throat. “Call it 2 units. Drawn out.”

  “And if you miss them all?” Marie asked, though they both knew.

  “Gate. Locked. No signal. Stuck in that soup till the sun burns it off. Worth nothing. Zero.” Arthur spat the word. “And the kicker…”

  “...is we get two extra units,” Marie chimed in, “*if* we both end up bunking in the same place. Snoring in the same laundromat, sharing the same bed, walking the same damn lake road. Together.”

  “Except the gate,” Arthur grunted. “Stuck half a mile apart in the fog? Doesn’t count. You’re on your own.” He kicked a loose pebble. “Been flipping coins, driving separate. Best we can usually manage is both turning at the first light most nights. Ruined, but together. Ruined together is worth… 3.” He said it like an accusation. “Beats trying to be clever with numbers and ending up apart more often than not.”

  Marie nodded, her gaze fixed on the swirling fog. “Independent randomness. Even if we both pick the *best* chance to turn – say, two out of three times – the odds we pick the *same* light are… what? Low. One night you’re home alone feeling guilty, I’m freezing at the lake feeling resentful. Another night, vice versa. Mostly, we just miss each other. Ruined apart is only 1 each. Worse than ruined together.”

  “Exactly,” Arthur sighed, the frustration deflating him. “Even aiming for home separately… if I turn at the second light, hoping for my 4, and you turn at the second hoping for yours, but we’re flipping coins… odds are decent one of us flips ‘go’ and the other flips ‘stay’ at the wrong moment. We end up apart. That 2-unit bonus for being together… it’s huge. Makes playing it safe at the first light look good. But I hate it, Marie. I hate sleeping in that car.”

  Marie turned, her eyes sharp in the sodium gloom. “So don’t play separate. Convoy. One car follows the other. Close enough, in this fog, to see brake lights at the turnoffs.”

  Arthur blinked. “Brake lights… You see me signal a turn, you turn. You see me go straight, you go straight. My choice decides for both of us.” The implication hit him like a physical blow. “Oh. Oh, *hell*. That changes everything.”

  “Changes the numbers,” Marie said, pressing the advantage. “If I’m following your brake lights, we *always* end up together. Except stuck at the gate. So that bonus? Folded right in. Automatically.”

  Arthur paced a tight circle, crunching gravel underfoot. “Right… so for the *leader*… turning at the first light: laundromat *together*. 1 plus the bonus 2. Total 3.”
  “Turning at the second light: home *together*. 4 plus 2. 6.”
  “Turning at the third light: lake road *together*. 2 plus 2. 4.”
  “And missing all three: gate. Together, but no bonus. Still 0.” He stopped pacing, his mind racing. “So the leader’s outcomes: 3, 6, 4, or 0. No more worrying about coordination. Just… maximising *that*.”

  “But the gate outcome,” Marie pointed out softly, “the bonus doesn’t touch it. It stays zero. That’s the one the bonus doesn’t help.”

  Arthur rubbed his temples. The simplicity was deceptive. “So… the leader needs a plan. A chance to turn at any light. Call it… probability ‘p’ to turn at any given light. That means probability… ‘q’, say… to keep going? q = 1 - p.” He sketched invisible numbers in the foggy air. “We *always* reach the first light. We only reach the second light if we *didn’t* turn at the first – chance q. We only reach the third light if we didn’t turn at the first *or* the second – chance q times q, q-squared. And we only hit the gate if we go past all three – chance q-cubed.”

  He fell silent, chewing his lip. The laundromat cat meowed plaintively. Marie waited, knowing this dance. Arthur muttered, calculating expected payoffs only he could see. “Expected value… E = (p * 3) + (q * p * 6) + (q² * p * 4) + (q³ * 0).” He frowned. “p times 3 for the first light… plus q times p times 6 for the second… plus q-squared times p times 4 for the third… plus nothing for the gate. And q is 1-p…”

  His eyes narrowed, focused on an internal landscape of probabilities. “Need to pick p to make that E as big as possible. Not one, not zero… somewhere in the middle. Around… two-thirds? p = 2/3?” He ran the numbers again in his head, visualizing the curve. “Yeah. Roughly. q = 1/3. Drive past the first light one time in three. Turn the other two times out of three. At *any* light you come to.” He looked at Marie. “That should… maximise it. Gets us home together less than a quarter of the time, but… it’s the best shot at the big payoff. The 6.”

  Marie nodded. “I follow your lights. Simple as that.” She reached out, squeezed his arm. “I’ll lead.”

  “No!” The word was out before he could stop it, sharper than intended. He saw the flicker of surprise, then understanding, in her eyes. He wasn’t being protective. He was being selfish. With numbers. “I… I need to do it. The turning chance. I can hold the number in my head. Two out of three. Roll a mental die.” He managed a weak smile. “You’re better at following brake lights in fog than I am at ignoring the urge to just turn *now*.”

  Marie studied him for a long moment. The cat butted her leg again. “Alright, Arthur,” she said softly. “You lead. Two out of three. See you at the stop sign, whatever number it is.” She turned towards her own battered hatchback.

  The fog swallowed the car park light as they pulled out, Arthur’s older sedan leading, Marie’s hatchback a dim, determined ghost two car lengths behind. The world shrank to the cone of their headlights and the slick grey ribbon of road. Familiar landmarks vanished. Only the rhythm of the engine and the hypnotic pulse of the cat’s-eye reflectors.

  Then, the first glow. Sickly yellow, bleeding through the fog. The cracked stop sign materialised like a spectre. Arthur’s stomach clenched. *Here. Now.*

  His mind raced, not with panic, but with the cold calculus agreed upon. *Probability: Turn with p=2/3. Continue with q=1/3.* But a deeper, more primal layer screamed: *This is probably the first one! Turn now! Take the guaranteed 3 together! Warmth! Rest!* The laundromat cat, curled on a dryer, seemed infinitely preferable to the zero waiting beyond the gate.

  He forced it down. *The plan. The big number. The 6.* He conjured a six-sided die in his mind’s eye. *One, two, three, four: Turn. Five, six: Continue.* He rolled it. A ‘five’ glowed in the dark behind his eyes. *Continue.*

  His foot didn’t touch the brake. He drove straight past the flickering light, the cracked sign. In the rearview, he saw Marie’s headlights hold steady, unwavering, following his non-signal into the thicker fog beyond. A wave of relief, immediately chased by a fresh spike of tension, washed over him. They were committed.

  The fog seemed thicker now, colder. Minutes crawled. Arthur’s knuckles were white on the wheel. When the second sodium smear pierced the grey, it felt like an ambush. Identical flicker. Identical cracked sign. *Is this the second? Or did I imagine the first? Is this the first again?*

  The pull to turn was stronger, almost physical. *If it’s the second, turning now means home! 6! Bed!* His mental die felt slippery. *But if it’s the first… turning means only 3.* He wrestled with the probabilities, the memory wipe making the calculation feel abstract, untethered. *Given I’m at *a* light… what’s the chance it’s the first? We always reach the first, chance 1. Second? Only if we passed the first, chance q=1/3. Third? Passed two, chance q²=1/9.* The numbers clicked, cold and hard. *So… probability it’s Light One: 1 / (1 + 1/3 + 1/9) = 9/13. Roughly 69%. Light Two: (1/3) / (13/9) = 3/13. 23%. Light Three: 1/13. Less than 8%.*

  *Expected payoff if I turn RIGHT NOW:* his brain raced, *(9/13)*3 + (3/13)*6 + (1/13)*4 = (27/13) + (18/13) + (4/13) = 49/13 ≈ 3.77. *Expected payoff if I continue?* He knew the overall expected value under their plan was about 3.63. But *here*, *now*, continuing meant risking the gate for the slim chance of a bigger payoff later. 3.77 felt solid, tangible. The zero loomed large. *Turn. Just turn. It’s probably the first, but even so, 3.77 is better than the plan’s average. Take it.*

  He almost lifted his foot. He saw the brake lights of his mind illuminate. But he heard his own voice in the cold car park: *Maximise E. Stick to the plan. The 6.* He gritted his teeth. *The die. Stick to the die.* He rolled the phantom die again. A ‘three’ landed. *Turn.* His foot touched the brake. The red lights flared, cutting through the fog.

  Behind him, Marie’s brake lights mirrored his instantly. Two sets of red eyes winked in the gloom as both cars slowed, turned, and left the main road. They bumped onto a familiar, potholed track. Not the smooth asphalt of the road home. The air changed, smelling of damp earth and stagnant water.

  Arthur pulled over onto a muddy verge. Marie pulled up beside him. He killed the engine. Silence rushed in, broken only by the dripping fog and the tick of cooling metal.

  Marie got out, walked to his window. He rolled it down. The cold air bit.

  “Lake road,” she said, her voice flat. Not a question. They both recognised the overgrown ditch, the skeletal outline of the dead oak further down, barely visible in the fog.

  Arthur nodded. “Third light. Or… second? Doesn’t matter.” He’d turned. They were here. Together. Outcome: 2 for the lake road, plus 2 for being together. Total 4. Better than ruined. Worse than home. He felt a profound weariness. The calculation had been exhausting. The gamble, for tonight, lost. “I… I almost didn’t brake. Back at that last light. The numbers… right then, turning seemed smarter.”

  Marie leaned on the door frame. “But you did brake. We’re here.” She looked down the shrouded road towards the bend where metal had screamed and blood had bloomed on frosty ferns years ago. “Could be worse. Could be the gate. Or alone.” She opened his car door. “Come on. Let’s walk a bit. Clear our heads before the long drive. Two hours is a long time to think about probabilities.” She offered her hand.

  Arthur took it, calloused palm against calloused palm. The warmth was real. The 4 units didn't feel like victory, but it wasn't defeat. It was the fog, the flawed memory, the numbers on the car park floor, and the stubborn presence beside him. As they walked slowly down the lake road, the fog swirling around their legs, past the place where they’d first kissed under a different kind of darkness, the expected value felt less important than the shared breath frosting in the cold, humid air. The gamble was nightly. The presence, for now, was absolute. He squeezed her hand, a silent apology for the detour, a wordless acknowledgment of the unseen brake lights she’d followed into the grey.
