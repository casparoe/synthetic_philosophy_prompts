prompt: |-
  Our federation's Constitutional Review Commission has a standing Referral Committee that decides which adopted measures must go to a binding popular referendum — a double majority of voters and of the federation's regions — rather than taking effect on the assembly's own vote. Its track record:

  - Referred: a revision of the amendment formula itself, including new entrenchment thresholds.
  - Referred: replacement of party-list proportional representation with single-member districts.
  - Referred: term limits for members of the assembly.
  - Referred: assisted dying, after a decade of legislative deadlock and three failed private-member's bills.
  - Referred: ratification of a treaty transferring regulatory authority to a supranational body, despite a comfortable pro-treaty majority.
  - Not referred: a cross-party settlement, negotiated over two years and carried by four-fifths of both chambers, on the two official languages of the civil service.
  - Not referred: siting of a long-lived nuclear waste repository, after the host municipality consented to a negotiated compensation package.
  - Not referred: a five-year suspension of a constitutional right during an emergency, which lapsed automatically although everyone expected it to be extended twice.

  The new case: a package amendment negotiated across party lines and carried by four-fifths of both chambers that (i) lowers the voting age to 16 for national elections and (ii) transfers constituency-boundary drawing from the assembly to a permanent independent commission, with no sunset and no review clause. Note two wrinkles I think matter: limb (ii) removes the assembly's conflict of interest rather than exemplifying it, and limb (i) would be authorized by an electorate that the change itself redefines.

  I want more than a gut verdict. Identify the two or three rules that fit these precedents equally well — for example, a rule that any change to the constitutive rules of the game needs direct popular authorization whatever the legislative consensus, versus a rule that referral is only for repairing a deficit of authority (self-dealing, deadlock, or imposition on an unconsenting minority) — and say what each predicts here, including whether the two limbs come apart and whether the package is partible. Then give your best prediction with the reasons for preferring it, name the precedent that is the closest analog, say honestly whether our record underdetermines the case, and specify the one further case that would most cleanly separate the surviving rules.
reasoning: |-
  Hmm, the user is presenting a complex constitutional law scenario involving a Referral Committee's decision-making precedents and asking for a structured analysis of a new case. They want more than just a gut reaction - they want identification of competing interpretive rules that fit the precedents, application to the new case, and a reasoned prediction.

  Looking at the precedents, there's a clear pattern. Referred cases involve fundamental democratic structures (voting systems, term limits), unresolved societal divisions (assisted dying), or sovereignty transfers (supranational treaty). Non-referred cases involve operational compromises (language settlement), localized decisions with consent (nuclear waste), or temporary emergency measures.

  The new case has two limbs: lowering voting age and independent redistricting. Both seem structural but lack the "deficit of authority" factors seen in referred cases. The voting age change is particularly interesting because it redefines the electorate itself.

  I see three plausible rules emerging:
  1) The "constitutive rules" rule where any change to foundational democratic structures requires referendum regardless of legislative support
  2) The "deficit repair" rule focusing only on self-dealing, deadlock or minority imposition
  3) A hybrid "structural change + authority deficit" rule

  Applying these to the new case: The constitutive rules rule would refer both limbs since they alter electoral fundamentals. The deficit repair rule wouldn't refer either since there's no deadlock or self-dealing. The hybrid rule might split them - redistricting clearly removes self-dealing so no referral needed, while voting age expansion might require referral because it changes the authorizing body.

  The language settlement precedent is key - it had supermajority support and wasn't referred despite being fundamental. This suggests supermajority consensus can override the "constitutive rules" concern. The nuclear waste case shows consent matters too.

  My prediction is non-referral for the whole package. The four-fifths supermajority mirrors the language settlement, and limb (ii) actively removes conflict of interest. The voting age change is trickier, but the lack of deadlock and presence of broad consensus distinguishes it from the assisted dying case. The closest analog is definitely the language settlement.

  The case that would best clarify would be a supermajority-supported change to elected official salaries - pure self-dealing that would test if consensus overrides conflict concerns.
answer: |-
  Based on the precedents, two primary competing rules emerge, with a third hybrid rule also plausible. Here's the analysis:

  **Competing Rules Fitting the Precedents:**

  1.  **The "Constitutive Rules" Rule:** Any amendment altering the core constitutive rules of the democratic system itself (electoral system, amendment formula, representative structure, fundamental rights suspension, sovereignty) *always* requires direct popular authorization via referendum, regardless of legislative consensus or the presence of self-dealing. This prioritizes popular sovereignty on foundational matters.
      *   *Fits Referred:* Amendment formula (core rule), Electoral system (core rule), Term limits (core structure), Treaty (sovereignty), Assisted dying (fundamental rights/societal values - implied core).
      *   *Fits Not Referred:* Language settlement (operational, not core structure), Nuclear waste (localized, operational), Emergency suspension (temporary operational measure under existing rules, lapsed).
      *   *Prediction for New Case:* **Refer BOTH limbs.** (i) Voting age defines the electorate (core constitutive rule). (ii) Boundary drawing defines representation equality (core constitutive rule). The package's supermajority support is irrelevant. The limbs are likely inseparable as part of a single "electoral reform" package altering core rules.

  2.  **The "Deficit of Authority" Rule:** Referral is only triggered to repair a specific deficit in the assembly's legitimacy or authority for *that specific decision*. Deficits include: (a) **Self-dealing**: Assembly benefiting itself directly (term limits, electoral system). (b) **Deadlock/Incapacity**: Assembly demonstrably unable to resolve a major societal issue (assisted dying). (c) **Imposition on Unconsenting Minority/Sovereignty**: Transferring power away from the demos without clear mandate (treaty), or actions lacking consent (implied in emergency suspension *if* opposed, though not referred due to sunset).
      *   *Fits Referred:* Electoral system (self-dealing), Term limits (self-dealing), Assisted dying (deadlock), Treaty (sovereignty imposition).
      *   *Fits Not Referred:* Amendment formula (No direct self-dealing/deadlock? - *Weakest fit*. Rule might view this as *so* constitutive it inherently has a deficit, or see the *change* as self-dealing by incumbents). Language settlement (broad consensus, no deadlock, no minority imposition), Nuclear waste (local consent, no imposition), Emergency suspension (temporary, lapsed, perhaps seen as legitimate emergency power under constitution).
      *   *Prediction for New Case:* **Refer NEITHER limb.** (i) Lowering voting age: No self-dealing (assembly members unaffected), no deadlock (passed easily), no imposition (expands electorate, doesn't impose burden). (ii) Independent commission: *Removes* self-dealing (conflict of interest), passed easily. No deficit exists. The supermajority reinforces legitimacy. Package is partible, but neither limb triggers referral alone.

  3.  **The "Hybrid: Structural Change + Authority Deficit" Rule:** Significant changes to core democratic structures *generally* require referral, *unless* the legislative process demonstrates exceptionally high consensus (supermajority) *and* the change demonstrably removes a conflict of interest or has specific consent. This rule blends concepts from Rules 1 & 2.
      *   *Fits Referred:* Amendment formula (structural, no supermajority/consent mentioned?), Electoral system (structural + self-dealing), Term limits (structural + self-dealing), Assisted dying (structural rights + deadlock), Treaty (structural sovereignty, despite majority).
      *   *Fits Not Referred:* Language settlement (structural, BUT supermajority & cross-party consensus), Nuclear waste (operational, but key is *local consent*), Emergency suspension (structural rights, BUT temporary, lapsed, perhaps inherent emergency power).
      *   *Prediction for New Case:* **Refer Limb (i) ONLY, or potentially the whole package.** (i) Voting age: Structural change redefining electorate. Supermajority exists but doesn't inherently remove a conflict; the "authorizing electorate redefinition" wrinkle amplifies the need for direct authorization. (ii) Independent commission: Structural change, but *specifically removes assembly self-dealing* AND has supermajority support. This fits the "removes conflict" exception seen in nuclear waste (consent removes imposition) and language settlement (consensus). Package *might* be partible, but limb (i) likely triggers referral. Referral of (i) alone is possible if partible; referral of the package due to (i) is also plausible.

  **Best Prediction & Reasoning:**

  *   **Prediction:** The Referral Committee will **NOT refer** the package amendment.
  *   **Reasoning:** The **"Deficit of Authority" Rule (Rule 2)**, tempered by the importance of supermajority consensus demonstrated in the precedents, provides the most consistent and compelling explanation for the *entire* track record, including the critical non-referral of the language settlement.
      *   **Key Precedent - Closest Analog:** The **cross-party language settlement** is the strongest parallel. Both involve: (1) A significant, potentially structural/constitutional issue; (2) Extensive negotiation and broad cross-party consensus; (3) Passage by a four-fifths supermajority in both chambers. The Committee did not find a deficit of authority justifying referral in that case, despite its significance. The new package mirrors these conditions precisely.
      *   **Addressing Limb (i) - The "Electorate Redefinition" Wrinkle:** While philosophically significant, the precedents don't show the Committee acting on this abstract concern alone. The assisted dying referral was driven by *deadlock*, not the inherent nature of the issue. The voting age change lacks the indicators of a deficit (self-dealing, deadlock, imposition) present in referred cases. The supermajority suggests legitimacy.
      *   **Addressing Limb (ii):** This limb actively *removes* a conflict of interest (self-dealing), which aligns perfectly with the logic of *not* referring cases where the assembly acts against its own narrow interest (e.g., term limits *were* referred because they *imposed* a burden, whereas this *removes* a power). This strengthens the "no deficit" argument.
      *   **Package Indivisibility:** The precedents don't directly address splitting packages. However, the strong parallels to the non-referred language settlement (also a negotiated package) and the lack of a triggering deficit for *either* limb suggest the Committee will treat the democratically negotiated supermajority package as a whole not requiring referral. Attempting to split it would be procedurally complex and contrary to the assembly's expressed will.

  **Underdetermination:** Yes, the record **slightly underdetermines this case**, primarily concerning the **amendment formula referral**. Rule 2 (Deficit) struggles most with that precedent. Was it seen as ultimate self-dealing by the assembly? Was it considered *so* constitutive that any change inherently has an authority deficit? This ambiguity is why Rule 1 (Constitutive) and Rule 3 (Hybrid) remain plausible. However, the clarity and strength of the language settlement precedent for non-referral of a supermajority package on a significant issue outweighs this ambiguity for the new case.

  **The Decisive Further Case:**

  The one further case that would most cleanly separate the surviving rules (Deficit vs. Hybrid) is:

  *   **A supermajority-supported constitutional amendment changing the salary or benefits of sitting assembly members, passed without controversy or deadlock.**
      *   **Rule 2 (Deficit - Self-Dealing):** Would **REFER**. Clear, direct self-dealing by the assembly benefiting its own members financially.
      *   **Rule 3 (Hybrid):** Would likely **REFER**. While it has supermajority support, it *exemplifies* self-dealing rather than removing a conflict. No countervailing factor like consent or inherent emergency power applies.
      *   **Rule 1 (Constitutive):** Would **REFER** (altering core rules of office).
      *   **Why it Separates:** This cleanly tests the core of Rule 2 (Deficit) against Rule 3 (Hybrid). Rule 3 requires *both* structural change *and* a deficit *or* the presence of a mitigating factor (like removing conflict/consent). Pure self-dealing with supermajority lacks the mitigating factor, so Rule 3 would refer. Rule 2 refers solely on self-dealing. The language settlement precedent (non-referral with supermajority but no self-dealing) supports the distinction Rule 3 makes between consensus on policy and consensus on self-benefit.
