prompt: |-
  I'm putting together a short position paper for a reading group I run with some people from the policy school — mostly economists, who keep asking me to "write down my axioms" before they'll engage at all — and in doing it I noticed my longtermist committments are probably less tidy than the way I present them in seminars. So here they are, roughly in the order I came to them:

  (1) Strong longtermism: in expectation, the best things I can do with my time and money are the ones that make the very long-run future go better, and that stays true even when they're clearly worse for identifiable people alive now. (2) No discounting for distance: I don't discount future well-being because it's far off in time, and I don't discount the well-being of people whose existence depends on what I do — "merely possible" people — relative to people who'll exist either way. (3) Anti-fanaticism: I don't think you should maximize expected value when that means letting yourself be pushed around by tiny probabilities of astronomically large payoffs; I'm drawn to something like a probability threshold or a bounded/tempered value function, and my refusal to pay Pascal's mugger is one of the intuitions I trust most. (4) Lock-in over survival: I think the biggest determinant of how good the long run is will be which values and institutions get locked in — whatever gets built into the systems that persist — rather than whether we or our descendants survive at all, and I'm skeptical of the framing that puts existential-risk reduction at the top of the list by default. I also accept the "hinge of history" thought, that we're at a moment of unusual leverage, which is part of why (4) matters. (5) Moral uncertainty: the right response to disagreement between moral theories is to hedge — give the theories something like votes in a parliament — rather than acting on whichever one I find most plausible. (6) Near-term work: I'm happy to support global-health-type stuff, but I've been arguing it should be funded for its flow-through effects on the long run (relationships, institutions, information, whatever) and not for its direct benefits, which I take to be negligible by comparison.

  What I want is an audit, not a lecture: which of these actually pull against each other, which only look like they do, and — ranked by severity — what the cheapest fix is for each real tension, plus which single revision would clean up the most. Please be opinionated: take a definite position on what has to go and why, don't just lay out the options for me to choose between, and mark clearly where you think you're on firm ground versus where a reasonable person could go the other way. For what it's worth, I'm mildly worried about two pairs — whether (3) quietly guts (1), and whether (5) quietly guts (1) and (2) — but I honestly don't know if those are the load-bearing problems or if I'm worried about the wrong thing, so don't take my anxieties as a map of where the trouble is.
reasoning: |-
  Okay, let me start by really understanding the user's request. They're putting together a position paper for a policy school reading group, mostly economists who want clear axioms. The user listed their longtermist commitments and is worried about internal tensions. They want an audit of these principles, specifically which ones conflict, how severe the conflicts are, and the cheapest fixes. They mentioned concerns about anti-fanaticism and moral uncertainty potentially gutting strong longtermism.

  First, I need to unpack each principle. Strong longtermism (1) prioritizes the far future over present needs. No discounting (2) treats future and possible people equally. Anti-fanaticism (3) rejects tiny probabilities of huge payoffs. Lock-in over survival (4) focuses on values and institutions rather than just extinction prevention. Moral uncertainty (5) suggests hedging across moral theories. Near-term work (6) supports present causes only for long-term benefits.

  The user is worried that (3) and (5) might undermine (1). Let me analyze those first. For (3), anti-fanaticism could clash with strong longtermism if long-term interventions rely on low-probability, high-impact scenarios. If the user dismisses those, it might limit the scope of actions that maximize expected value. That's a real tension. The cheapest fix might be to temper the anti-fanaticism stance, maybe by setting a probability threshold instead of discarding such scenarios entirely.

  Next, moral uncertainty (5). If they give weight to non-longtermist theories, that could dilute their focus on the far future. For example, theories prioritizing present generations would pull resources away from long-term projects. That directly conflicts with (1) and (2). The fix here might be to apply moral uncertainty within a longtermist framework, so only theories that accept some form of longtermism get a vote. But that might seem circular, so it's tricky.

  Looking at (4), lock-in over survival. This actually supports (1) by emphasizing the quality of the future over mere survival. It redirects focus to shaping institutions and values, which aligns with the hinge of history idea. No conflict there; it strengthens their position.

  Near-term work (6) seems consistent as long as it's framed as instrumental to long-term goals. The user already states it's for flow-through effects, so no issue. But if moral uncertainty (5) gives weight to near-term intrinsic benefits, that could conflict. So (5) might be the bigger problem here.

  The user also mentioned (2) no discounting. Moral uncertainty could challenge this if some theories support discounting. That's another point where (5) conflicts with core principles.

  So the most severe conflict is between moral uncertainty (5) and strong longtermism (1) and no discounting (2). It forces a trade-off between hedging bets and committing to longtermism. The cheapest fix? Restrict the parliament of theories to those that are longtermist-compatible. But that might be seen as ad hoc. Alternatively, bite the bullet and accept that moral uncertainty moderates their longtermism, making it weaker.

  The next biggest issue is anti-fanaticism (3) vs. strong longtermism (1). Longtermism often involves speculative, high-stakes bets. Rejecting those could invalidate key longtermist strategies. Fix: adopt a moderate anti-fanaticism, like a probability threshold, allowing some high-impact, low-probability actions if they clear a certain bar.

  Lock-in over survival (4) actually resolves a tension in longtermism by prioritizing value trajectories over survival. That's a strength. Near-term work (6) is consistent if instrumental. But if moral uncertainty introduces intrinsic near-term value, that conflicts. So (5) is the linchpin.

  The user's anxieties are spot on. (5) is the most corrosive because it introduces external values that contradict longtermism. (3) is manageable with tweaks. The single best revision? Modify moral uncertainty (5) to only include theories that accept the core of longtermism. That protects (1) and (2) while allowing for some pluralism.

  Also, considering the audience: economists want clear axioms. Highlighting where principles conflict and how they're resolved adds rigor. Acknowledging tensions makes the position more credible. Emphasizing the hinge of history and lock-in could appeal to policy-oriented economists by focusing on institutional design.

  In summary, prioritize fixing moral uncertainty's scope to avoid undermining core commitments. Then adjust anti-fanaticism to allow carefully vetted high-impact actions. These changes would streamline their framework while maintaining its essence.
answer: |-
  Here’s your audit, ranked by severity of tension and with concrete fixes. I’ll be direct about what I think must change, where I’m confident, and where reasonable disagreement exists. Your anxieties about (3) and (5) are well-placed—they **are** the load-bearing problems.

  ---

  ### **Severity Ranking & Fixes**
  **1.  Moral Uncertainty (5) vs. Strong Longtermism (1) & No Discounting (2)**  
      *   **Conflict:** This is the most corrosive tension. If you give "votes" to moral theories that reject longtermism (e.g., strong near-termism, person-affecting views), your actions will be **pulled away** from maximizing long-run impact. Theories prioritizing current generations will demand resources for intrinsically valuable near-term work, clashing with (1)'s claim that long-term work is *best in expectation*. It also directly undermines (2) by endorsing views that *do* discount future/possible people.  
      *   **Cheapest Fix:** **Restrict the "Parliament" to Longtermist-Compatible Theories.** Only allow theories that accept the *basic framework* of valuing the far future (e.g., total utilitarianism, some prioritarianism, certain value pluralisms). Exclude theories that fundamentally reject the moral significance of future generations or contingent persons.  
      *   **Severity:** **Critical.** (5) guts the core motivation of (1) and (2) by legitimizing actions counter to them.  
      *   **Confidence:** **High.** This is a structural incompatibility. Giving weight to anti-longtermist theories logically forces compromise on longtermist goals.  
      *   *Alternative View:* Some argue moral uncertainty *requires* including all plausible rivals, accepting dilution. This would force you to weaken (1) significantly (e.g., to "Moderate Longtermism").

  **2.  Anti-Fanaticism (3) vs. Strong Longtermism (1)**  
      *   **Conflict:** Longtermism often relies on *highly uncertain, potentially astronomical impacts* (e.g., reducing tiny risks of extinction). (3)'s rejection of tiny-probability/massive-payoff reasoning directly targets these core longtermist interventions. If you impose a probability threshold or bounded utility, you may rule out prioritizing actions targeting low-probability existential risks or lock-in scenarios—precisely the things (1) claims are most important.  
      *   **Cheapest Fix:** **Adopt Moderate Anti-Fanaticism (e.g., Tempered Utility).** Instead of a hard probability threshold, use a bounded or concave utility function (e.g., `log(utility)`). This *dampens* the influence of extreme payoffs without eliminating them entirely. Crucially, **explicitly carve out "hinge of history" events** from your anti-fanaticism rule. Argue that transformative lock-in scenarios (your focus in (4)) have probabilities *above* any reasonable threshold and justify expected value maximization.  
      *   **Severity:** **High.** (3) risks invalidating the primary *method* of identifying "best in expectation" actions under (1).  
      *   **Confidence:** **High** that a conflict exists; **Medium** on the specific fix. Tempering is less arbitrary than thresholds, but hinges on defining "carve-outs" rigorously.  
      *   *Alternative View:* Hardliners might insist (3) *must* apply universally, forcing a weaker (1) or abandoning key longtermist causes. This is reasonable but costly for your framework.

  **3.  Lock-in over Survival (4) vs. Strong Longtermism (1) - *Apparent Tension Only***  
      *   **Conflict:** *Superficially*, prioritizing "lock-in" over survival seems to conflict with maximizing the *duration* or *scale* of the future (a core longtermist goal).  
      *   **Resolution:** **No Real Conflict.** Your (4) is a *claim about cause prioritization*, not a rejection of survival's importance. Argue that:  
          *   Lock-in *determines the value trajectory* of survival. 1,000 years of dystopia might be worse than 100 years of flourishing.  
          *   Lock-in events likely occur *earlier* than many extinction risks manifest (e.g., AI value lock-in this century vs. asteroid risk millenia later).  
          *   Influencing lock-in leverages the "hinge of history" more effectively than mitigating later risks.  
      *   **Severity:** **Low (Nonexistent).** (4) refines (1), offering a specific *theory of change*, not contradicting it.  
      *   **Confidence:** **High.** This is a strength, not a bug.  
      *   *Clarify:* Explicitly state that survival remains necessary but not sufficient for a valuable long-term future.

  **4.  Near-Term Work (6) vs. Strong Longtermism (1) - *Apparent Tension Only***  
      *   **Conflict:** *Superficially*, funding near-term work seems to divert resources from direct long-term impact, contradicting (1).  
      *   **Resolution:** **No Conflict.** Your instrumental justification ("flow-through effects") makes this fully consistent with (1). It's simply a claim about the *causal pathways* to long-term impact.  
      *   **Severity:** **Low (Nonexistent).**  
      *   **Confidence:** **High.** This is standard instrumental longtermism.  
      *   *Watch Out:* Ensure your justification for *specific* near-term work robustly links to long-term institutional/value trajectories (your (4)), not vague hope.

  **5.  Anti-Fanaticism (3) vs. No Discounting (2) - *Minor/Contextual***  
      *   **Conflict:** (2) demands valuing small probabilities of saving vast numbers of future lives. (3) pushes back against tiny probabilities of vast payoffs.  
      *   **Resolution:** **Managed by the Fix for (3).** Tempered utility/logarithmic scaling respects (2)'s *non-discounting* while addressing (3)'s concerns about extreme stakes. It values future lives equally but acknowledges diminishing *marginal* moral weight per unit of utility.  
      *   **Severity:** **Low.**  
      *   **Confidence:** **Medium.** Tempering handles this elegantly. A hard threshold would cause more friction with (2).

  ---

  ### **The Single Best Revision**
  **Modify Moral Uncertainty (5) to only apply *within* a longtermist framework.** This is the highest-leverage fix. It eliminates the deepest conflict (with (1) and (2)) at minimal cost to the spirit of moral humility. You retain hedging *between different longtermist theories* (e.g., total vs. average utilitarianism, different population axiologies, varying weights on lock-in vs. risk reduction). This protects the core engine of your position while acknowledging reasonable internal disagreement. Abandoning this fix forces you to gut either (1)/(2) or (5), sacrificing coherence.

  **Why this over fixing (3)?** While (3) vs. (1) is severe, it's *operational* (how to calculate "best"). Fixing it preserves the *goal*. (5) vs. (1)/(2) is *foundational* – it threatens the goal itself by legitimizing non-longtermist ends.

  ---

  ### **Key Takeaways for Your Paper**
  1.  **Lead with Lock-in (4):** Frame it as your *theory of change* for achieving (1). This grounds abstract longtermism for policy audiences and leverages your "hinge of history" point. It’s distinctive and coherent with your other commitments.
  2.  **Explicitly Bound Moral Uncertainty (5):** State upfront that your hedging applies *only* to theories accepting the fundamental importance of shaping the far future. This preempts economists trying to force near-termism into your calculus.
  3.  **Temper, Don't Threshold (3):** Adopt tempered utility (e.g., `log(well-being)` or `sqrt(well-being)`) as your anti-fanaticism tool. Argue hinge-of-history lock-in events exceed any reasonable probability threshold for fanaticism concerns.
  4.  **Embrace Instrumentalism (6):** Defend near-term work *vigorously* via its institutional/value path-dependence, linking it directly to (4). This demonstrates policy relevance without compromising (1).
  5.  **Concede (Minor) Tension on (3):** Acknowledge that anti-fanaticism constrains *how* you maximize expected long-term value but doesn’t negate *that* you should maximize it. This shows rigor.

  **Firm Ground:** The conflicts involving (5) and (3) vs. (1) are real and severe. Fixing (5) via restriction is the highest-priority, lowest-cost solution. (4) and (6) are strengths, not conflicts.  
  **Debatable Ground:** Whether tempered utility fully resolves (3) vs. (1), or if some longtermist bets are still unjustifiable. Whether excluding non-longtermist theories from (5) is epistemically defensible or ad hoc.

  This structure makes your axioms internally consistent, defensible against economists ("here's why I exclude near-termist theories from my parliament"), and action-guiding. Good luck!
