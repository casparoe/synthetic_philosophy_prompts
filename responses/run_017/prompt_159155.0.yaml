  Notably, they've excluded literature surveys - they want engagement with the logical structure rather than recapitulation of existing positions. This suggests they've already done exhaustive homework and need fresh analytical perspective. The hypothetical audit device reveals their inclination toward empirical resolution while suspecting it may fail.

  The third position mentioned (category error about frameworks vs theories) seems underdeveloped in their analysis. I should address why that stance hasn't broken the deadlock despite being structurally different. Perhaps because it doesn't resolve the underlying tension between the other two positions?

  Their meta-question about "what kind of disagreement this is" points to possible roots in philosophy of science - specifically the demarcation problem and underdetermination. The non-movement they describe resembles what Lakatos called "degenerating research programmes" but applied to methodological debates rather than scientific theories.

