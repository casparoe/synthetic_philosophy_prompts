  ### 1. Mapping Correction: SSA and SIA in Statistical Vocabulary  
  Your initial pass is insightful but requires refinement. Here's the corrected mapping:  

  - **Self-Sampling Assumption (SSA)**  
    - **Design-based stance**: Fix the world (a specific realization of the superpopulation). The sampling frame is the finite population of actual observers in that world.  
    - **Inclusion probability**: Uniform (1/N) for all observers in the frame.  
    - **Likelihood**: Given a world with N observers, the probability of sampling *you* (a specific observer) is 1/N.  
    - **Prior**: Over possible worlds (superpopulation models), unadjusted for observer count.  
    - **Weighting**: Inverse-probability weighting (IPW) with known 1/N weights.  
    - **Analogy**: Simple random sampling from a fixed frame. Your existence as a draw implies nothing about N; it only informs your position in the frame.  

  - **Self-Indication Assumption (SIA)**  
    - **Model-based stance with size-biased prior**: Worlds are random. The prior over worlds is proportional to the number of observers (N) in each world (size-biased).  
    - **Sampling**: Once a world is drawn, you are sampled uniformly (1/N) from its frame.  
    - **Inclusion probability**: Not defined independently; folded into the prior.  
    - **Likelihood**: The event "I exist" (not "I am this specific observer") has likelihood ∝ N. Crucially, this is not a standard likelihood—it's a *self-locating likelihood* (see §3).  
    - **Weighting**: Calibration to the size-biased prior, not IPW.  
    - **Analogy**: Length-biased sampling. Observing "I exist" is more likely in worlds with larger N.  

  **Corrections to Your Pass**:  
  - SSA is purely design-based (fixed frame, known IPW weights).  
  - SIA is **not** a likelihood-based stance in the conventional sense. It imposes a size-biased *prior* over worlds, motivated by a non-standard likelihood for "I exist."  
  - The Sleeping Beauty and doomsday examples are well-mapped (units = observers vs. episodes; serial-number estimation).  

  **Key Insight**:  
  SSA is a sampling assumption (design-based). SIA is a *modeling convention* that embeds anthropic bias into the prior, not a sampling assumption. It has no direct analog in survey statistics.  

  ---

  ### 2. Reference Class Problem as Frame Uncertainty  
  The reference class (e.g., "all humans" vs. "all conscious beings") defines the sampling frame. This is identical to contested frames in statistics:  
  - **Fixed by design**: Not applicable (no predefined frame in anthropics).  
  - **Partially observed, post-stratify**: Rare; we lack data to calibrate marginal observer distributions.  
  - **Sensitivity analysis**: The only viable approach. Vary the frame (reference class) and assess robustness (e.g., estimate N under "humans only" vs. "all sentient beings").  

  **Where It Diverges**:  
  - **Circularity**: The frame is defined by properties *you* possess (e.g., "observers like me"). This has no analog in standard sampling, where frames are externally defined.  
  - **Unobservability**: Frames include future/potential observers, violating the principle that frames must be enumerable or estimable.  
  Your vocabulary *can* represent this as sensitivity analysis, but the circularity introduces unresolvable ambiguity.  

  ---

  ### 3. The First-Personal Datum: Added Machinery  
  The datum is self-locating: "I exist and am this observer" (indexical fact). Standard likelihoods lack a slot for this. The translation requires:  
  - **New component**: A *self-locating likelihood* $P(\text{"I am } \boldsymbol{x} \text{"} \mid \text{world})$ or $P(\text{"I exist"}\mid \text{world})$.  
  - **Non-neutrality**:  
    - SSA uses $P(\text{"I am } \boldsymbol{x}\text{"} \mid \text{world}) = 1/N$ (specific observer).  
    - SIA uses $P(\text{"I exist"}\mid \text{world}) \propto N$ (existence as evidence).  
  This choice *takes sides*: SSA ignores indexical information beyond position; SIA treats existence as size-biased evidence.  

  ---

  ### 4. Source of Evidential Force  
  - **SSA**: Evidence comes from *your specific observer label* (e.g., birth rank $n$). Likelihood $P(n \mid N) = 1/N$ varies with $N$, providing information (e.g., low $n$ suggests small $N$).  
  - **SIA**: Evidence comes from *the event "I exist"*. Its likelihood $P(\text{"I exist"} \mid \text{world}) \propto N$ differs by world, pushing toward larger $N$.  
  **Crucial Point**: "I exist" has likelihood 1 under all worlds where you *could* exist (no selection bias). SIA *imposes* $\propto N$ as an anthropic correction.  
  - **Difference**: SIA alters the **likelihood** for a non-standard datum ("I exist"). SSA uses a conventional likelihood for observer identity.  

  ---

  ### 5. Identifiability and Decision-Relevance  
  - **Identifiability**: **No**. With one observer and no repeat sampling, the models are observationally equivalent. Both can fit any observed $n$ or $N$ by adjusting priors.  
  - **Decision-relevance**: **Yes**. They prescribe distinct actions:  
    - **Doomsday argument**: SSA favors "doom soon" (high $P(N \approx n)$); SIA does not.  
    - **Presumptuous philosopher**: SIA favors large-$N$ theories (e.g., multiverse) regardless of data.  
    - *Example decision*: Invest in long-term infrastructure. SSA discourages it (low $P(\text{future exists})$); SIA is neutral or encouraging.  
  This is an **assumption worth arguing about**—it changes decisions.  

