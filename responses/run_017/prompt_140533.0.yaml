answer: |-
  Based on your constraints (strong formal skills, interdisciplinary relevance, publishability, 4-year solo project) and desire to avoid Lewis exegesis, here's a prioritized list of research lines with reasoning. I've evaluated your hunches rigorously—one ranks highly, while others need refinement. Crucially, I'll flag overrated questions to avoid.

  **Prioritized Research Lines (Ranked by Impact/Tractability Balance):**

  1.  **Formal Constraints on Admissible Counterpart Relations (Your Hunch #3, Elevated)**
      *   **Core Idea:** Instead of debating "identity vs. counterparts," rigorously investigate the *space of possible counterpart relations*. What formal constraints (logical, metaphysical, semantic) must *any* viable counterpart relation satisfy? Develop a model-theoretic framework for "admissible" counterpart relations, exploring constraints like reflexivity, symmetry, transitivity, granularity, context-dependence bounds, and interaction with essential properties.
      *   **Why Top Priority?**
          *   **Upstream Impact:** Directly addresses the core "bug" (indeterminacy) perceived in counterpart theory. Solutions here matter to *anyone* using modality: philosophers of language (semantics of modals), philosophers of science (laws, dispositions, counterfactuals), metaphysicians working on essence, persistence, or social ontology. It reframes the debate constructively.
          *   **Tractability:** Perfect fit for your formal skills. Start by axiomatizing different constraint sets in modal logic/model theory. Compare their consequences (completeness, decidability, expressive power). Explore connections to similarity metrics or partial equivalence relations. This is inherently publishable in stages (e.g., papers on reflexivity constraints, context-dependence formalization).
          *   **Neglected/Crowded:** The *need* for constraints is acknowledged, but systematic, *formal* exploration is surprisingly thin beyond Lewis's original suggestions. Most work is informal or focuses on specific objections.
          *   **First 6-Month Probe:**
              *   Survey existing formal work on counterpart relations (e.g., Fara, Dorr, Kocurek) – is there a unified framework possible?
              *   Investigate analogous constraint problems in related formal areas (e.g., similarity logics, supervaluationism, vague identity, granular partitions).
              *   **Move Up:** If you find a compelling *minimal* constraint set that resolves key objections (e.g., Humphrey's Paradox) without collapsing into transworld identity or excessive indeterminacy.
              *   **Move Down:** If it becomes clear all plausible constraint sets either necessitate transworld identity or lead to radical contextualism unacceptable even to counterpart theorists.

  2.  **Actual Duplicates & the Metaphysics of Identity (Your Hunch #1, Refined)**
      *   **Core Idea:** Rigorously analyze the implications of *actual, physical duplicates* (identical particles, Boltzmann brains, cosmological repeats) for the metaphysics of identity *within* a world, and how this bears on the transworld identity/counterpart debate. Does QM's treatment of identical particles demand a "counterpart-like" relation *intra-world*? If so, cross-world counterparts are a natural extension. If not, why treat cross-world cases differently? Formalize the identity criteria.
      *   **Why #2?**
          *   **Upstream Impact:** Connects directly to cutting-edge philosophy of physics (QM identity, statistical mechanics, cosmology) and fundamental ontology. Forces the modal debate to engage with concrete physics. Also relevant to personal identity if biological duplicates are conceivable.
          *   **Tractability:** Leverages your formal skills to model identity criteria under physical theories (e.g., formalizing "weak discernibility" in QM, permutation invariance). Requires learning key physics concepts, but not empirical work. Publishable in philosophy of physics journals as well as metaphysics.
          *   **Neglected/Crowded:** While discussed (e.g., by Saunders, Ladyman, Hawthorne), the *direct, formal linkage* to the transworld/counterpart debate is underexplored. Most focus is on the physics itself or generic metaphysics of identity.
          *   **First 6-Month Probe:**
              *   Deep dive into metaphysics of identical particles (permutation symmetry, bundle theory vs. substratum responses) and cosmological duplicates.
              *   Formalize the minimal identity conditions required *intra-world* in these scenarios. Is Leibniz's Law challenged?
              *   **Move Up:** If you find intra-world identity *must* be counterpart-theoretic (or "quasi-counterpart") in these cases, making cross-world counterparts inevitable/parsimonious.
              *   **Move Down:** If physics-based intra-world identity can be robustly grounded in traditional identity (e.g., via spatiotemporal relations, weak discernibility) without counterpart-like apparatus, weakening the analogy.

  3.  **Counterparts Beyond Modality: Testing the Analogy (Your Hunch #2, Focused)**
      *   **Core Idea:** Systematically compare the application of counterpart-like relations across *different domains* (modality, time, fiction, social groups) to assess whether it's truly a unified stance or disanalogous practices. Focus on *formal structure* and *cost/benefit profile*. Does "counterpart theory" for institutions share the same logical structure and face the same objections as for modality? Where do the analogies break?
      *   **Why #3?**
          *   **Upstream Impact:** Matters to philosophers of time (persistence), aesthetics (fictional characters), social ontology (institutions, group agency), and legal/political philosophy (counterfactuals about states). Tests the universality of the framework.
          *   **Tractability:** Uses your formal skills to model the counterpart relation in each domain (e.g., temporal counterparts, fictional counterparts, institutional counterparts) and compare axioms/consequences. Avoids getting lost in historical details. Publishable as comparative studies.
          *   **Neglected/Crowded:** Cross-domain comparisons exist (Lewis touched on time/fiction), but rarely systematic, formal, and focused on the *costs* of adopting counterpart semantics in each domain. Most work stays siloed.
          *   **First 6-Month Probe:**
              *   Map the core formal structure of counterpart relations proposed in each domain (time: Sider, fictional: Thomasson/Routley, social: Epstein, List & Pettit).
              *   Identify key shared formal features and salient differences in the debates (e.g., is indeterminacy more/less acceptable for fictional characters than modal properties?).
              *   **Move Up:** If you uncover a deep, shared formal core that faces *analogous challenges* resolvable by a unified constraint theory (tying back to #1!).
              *   **Move Down:** If the domains prove radically disanalogous in their demands and constraints, making generalization unproductive. Or if the social/fictional literature proves too vast or resistant to formalization.

  4.  **Counterpart Theory and De Re Paradox Refinement**
      *   **Core Idea:** Move beyond rehashing classic paradoxes (Humphrey, Four Worlds). Use formal tools to construct *new* paradoxes or significantly refine old ones that specifically probe the *limits* of counterpart-theoretic resolutions. Focus on cases involving complex essential properties, vague counterparts, or interactions with other modalities (temporal, doxastic). What do these refined paradoxes reveal about necessary constraints (linking to #1)?
      *   **Why #4?**
          *   **Upstream Impact:** Provides sharper tools for evaluating *any* theory of de re modality (counterpart or identity-based). Relevant to philosophical logic and anyone dealing with complex modal reasoning.
          *   **Tractability:** Direct application of modal logic/model theory skills to build and analyze intricate cases. Highly publishable as discrete puzzles with solutions/analyses.
          *   **Neglected/Crowded:** While paradoxes are well-known, there's room for *novel formal constructions* that reveal deeper issues than the original examples. Less crowded than re-interpreting Lewis's responses.
          *   **First 6-Month Probe:**
              *   Catalog existing paradoxes and their standard counterpart resolutions.
              *   Attempt to construct a novel paradox involving, e.g., iterated modality, essential vagueness, or counterpart relations changing over time.
              *   **Move Up:** If you find a novel paradox that genuinely stumps existing counterpart accounts and forces a theoretical refinement.
              *   **Move Down:** If constructing genuinely new, compelling paradoxes proves too difficult or if they all seem resolvable with minor tweaks to existing frameworks.

  **Your Hunches Evaluated:**

  1.  **Actual Duplicates (Hunch #1):** Ranked **#2**. This is very strong and directly addresses your concern about relevance to physics. It's not confused; it's a powerful lens. Its ranking reflects the slightly higher initial learning curve (physics concepts) compared to #1, not its value.
  2.  **Same Dispute, Other Joints (Hunch #2):** Reframed as **#3**. The core insight (testing generality) is valuable, but the initial formulation risks being too broad/diffuse. Focusing on *formal comparison of costs/structures* makes it tractable and publishable. The disanalogies are likely significant, which is precisely what makes investigating them worthwhile.
  3.  **Truth Conditions (Hunch #3):** Ranked **#1**. This is the strongest hunch. It directly confronts the central objection and pivots the debate constructively. It's not changing the subject; it's addressing the *implementation* of counterpart theory, which is where the real philosophical action often is. It leverages your strengths perfectly.

  **Overrated Questions to Avoid:**

  1.  **"What Did Lewis *Really* Mean?" (Exegetical Rabbit Holes):** Settling fine points of Lewis interpretation rarely moves the *philosophical* needle downstream. Focus on the conceptual problems and solutions. (*Why avoid: Drains time, minimal downstream impact beyond Lewis scholarship.*)
  2.  **"Is Counterpart Theory 'Really' a Form of Transworld Identity (or Vice Versa)?" (Border Patrol):** Endless debates about definitions and territory. Focus instead on the *substantive differences in explanatory resources and costs* between specific implementations. (*Why avoid: Semantic, often unproductive; doesn't resolve underlying philosophical issues.*)
  3.  **Overly Simple "Toy" Paradoxes Without New Angles:** Rehashing Humphrey or Four Worlds without bringing new formal tools or connecting them to concrete concerns (like physics or persistence). (*Why avoid: Well-trodden ground; diminishing returns. Your #4 line is the antidote – refine them!*)
  4.  **"Can Counterpart Theory Handle *Everything* Transworld Identity Can?" (Completeness Battles):** Often devolves into constructing ever-more-contrived scenarios. Focus on whether counterpart theory (under constraints) provides a *better overall balance* of theoretical virtues for domains we care about. (*Why avoid: Unwinnable and distracts from practical utility and costs.*)

  **Recommendation & Path Forward:**

  *   **Start with Line #1 (Formal Constraints):** This is the most tractable entry point with your skills, offers immediate publishability (papers on specific constraints), and builds a foundation that directly informs your other hunches (especially #3 and #2). It reframes the debate proactively.
  *   **Simultaneously Probe Line #2 (Actual Duplicates):** Use the first year to get up to speed on the relevant physics metaphysics. This could become your primary focus if the probe shows a very tight link to intra-world identity, or it could provide crucial case studies for Line #1.
  *   **Years 1-2 Focus:** Develop the formal framework for constraints (#1) and apply it to resolve classic paradoxes (linking to #4) and potentially the duplicate issue (#2). Aim for 2-3 publications here.
  *   **Years 2-3 Expansion:** If #1 progresses well, use that framework to rigorously tackle the cross-domain comparison (#3 - your refined hunch #2). Test the generality of your constraints. Another 1-2 publications.
  *   **Year 4 Synthesis/Thesis:** Integrate the threads. Show how a constrained counterpart theory (developed in #1) handles physical duplicates (#2), avoids classic and refined paradoxes (#4), and can be coherently (or incoherently) applied across domains (#3).

  **Why this prioritization?** It leverages your formal strength immediately (#1, #4), forces engagement with high-impact adjacent fields (#2 - physics, #3 - time/social ontology), avoids Lewis-exegesis traps, provides clear publication milestones, and addresses the core philosophical worry (indeterminacy) head-on in the most constructive way (#1). It turns your strongest hunch (#3) into the engine driving the project. Good luck!
