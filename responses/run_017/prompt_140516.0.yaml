prompt: |-
  Im a PhD student and I've been handed one fifty-minute section next week in our intro Philosophy and Law course — first-years, about a third of them pre-law and the rest there to fill a requirement, whiteboard only, no handouts because the department printer is dead again. The topic is causation by omission: whether someone's failure to do something can be a cause of something happening. Please don't explain the topic to me; tell me how to explain it. What I keep going back and forth on is the order, because my sense is that before the question even means anything to them I have to seperate "did she cause it" from "is she to blame" — the pre-law kids have half-remembered duty and proximate cause from somewhere and will answer a causal question with a responsibility verdict all section if I let them — and also that they need causal claims to be contrastive or interest-relative (why did *these* plants die and not *those*) before an absence can even look like a possible answer. But I can't tell whether those are genuine prerequisites or whether I'm front-loading metaphysics that should come in later, and I'm not sure whether to present the "an omission only counts as a cause against a normative background" line as the live option it is or to hold it back so it doesn't swallow the whole discussion on contact.

  The example is the other thing I'm stuck on. My first thought was the obvious one — a lifeguard who's on her phone and doesn't notice a kid struggling — but it feels saturated with obligation, so I made up a pair instead: two identical greenhouses on the same street, same plants, both need daily watering. Sam is going away and asks her neighbour Priya to water; Priya says yes and then just forgets, all week. In the other greenhouse nobody was ever asked and nobody watered. Same deaths, same absence of water, one has a promise in it and one doesn't. Is that the right thing to carry the whole fifty minutes, or is it still smuggling in a norm when the question is supposed to be about causation? Either way, tell me what the carrying example has to have and what it has to lack. Then there's a case I want to use late: two people each promise Sam they'll water, each assumes the other did, neither does — now the but-for test says neither one caused it. I want that at the end, as a general worry about overdetermination that also afflicts perfectly ordinary actions, but I'm worried it detonates everything I just built, so tell me where it goes and how to frame it so it doesn't.

  The misconceptions I'm braced for: "an omission is nothing, and nothing can't do anything"; "if forgetting can be a cause then everyone who ever failed to water those plants caused their death, up to and including the Queen"; "causation needs a mechanism, a physical connection or a transfer of energy, so an absence can't qualify"; and the sharp one, that the only reason Priya looks like a cause is that she was supposed to water, so really it's blame dressed up as causation. For each, tell me where exactly in the sequence I should head it off and what has to already be on the board for the defusal to work. And give me one question to ask in the last five minutes that would show me whether they'd actually got the idea rather than just learned to say "omission" — plus what I should openly announce I'm not going to settle at this level and why.
reasoning: |-
  Okay, the user is a PhD student preparing to teach a fifty-minute intro Philosophy and Law class on causation by omission. They're struggling with the structure of the lesson, particularly how to sequence the concepts and which examples to use. They want to avoid conflating causation with blame, which the pre-law students might do. They're also concerned about front-loading too much metaphysics and whether their examples inadvertently introduce normative elements.

  First, I need to address their core concern about separating causation from blame. The user mentioned that pre-law students often jump to responsibility when discussing causation. So, the lesson must clearly distinguish between "did X cause Y?" and "is X responsible for Y?" This should be established early. The contrastive approach (why these plants died vs. others) seems essential here to make omissions visible as potential causes without norms.

  The greenhouse example with Priya and the neighbor is good because it isolates the promise variable. But the user worries it still smuggles in norms. However, the example without a promise (the second greenhouse) helps show that causation can exist without duty. Emphasizing that both greenhouses lacked water, but only one has a promise, allows discussing causation separately from obligation. Still, I should note that norms might influence how we pick causes, not whether omissions can be causes.

  The overdetermination case (two people promised, neither watered) is tricky. The user wants to use it to show that but-for test fails here, similar to cases with actions. This should come after establishing omissions as causes in simpler cases. Positioning it as a challenge to tests like but-for, not omissions themselves, prevents undermining the earlier argument. Frame it as a general problem in causation, not specific to omissions.

  Misconceptions need targeted responses. For "omissions are nothing," introduce counterfactuals early. For universal causation (Queen example), use the contrastive frame. The mechanism objection requires showing that physics isn't the only causal framework. The blame objection is crucial; address it explicitly using the greenhouse pair to separate causation from duty.

  The closing question should test understanding without norms. Asking why the plants died instead of surviving highlights the absence of water as cause. Explicitly state that deeper metaphysical debates and full responsibility conditions are beyond this session to manage scope.

  Overall, structure: start with contrastive questions, separate cause/blame, use greenhouse examples, address objections in sequence, end with overdetermination as a broader issue. Keep examples consistent to avoid confusion.
answer: |-
  Here’s a structured 50-minute plan focused on **clarity, sequencing, and defusing misconceptions**, using your greenhouse example as the anchor. Prioritize building blocks that make omissions *visible* as causes before introducing complexity.

  ---

  ### **Lesson Structure & Sequence**
  **Board Layout:** Divide the board into 3 columns:  
  (1) *Examples* | (2) *Causal Question* | (3) *Objections/Notes*

  | **Time** | **Step**                                                                 | **Key Board Notes**                                                                                                  | **Pedagogic Rationale**                                                                                                                                 |
  | :------- | :----------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------------------------------------------------------------------------------ |
  | **0-5m** | **Hook: Contrastive Causation**                                          | "Why did THESE plants die (Sam’s), but NOT those (identical plants next door)?" → Brainstorm differences.            | Forces focus on *specific* differences. Plants died in both greenhouses → absence of water common to both. Sets stage for omissions as relevant factors. |
  | **6-15m** | **Separate Cause vs. Blame**<br>- Present **Greenhouse Pair**             | **Case 1:** Priya promised, forgot.<br>**Case 2:** No promise, no watering.<br>→ *Same outcome:* plants dead from no water. | Highlight physical symmetry: *Identical absences*. Ask: "Did the absence of water cause death in *both* cases?" (Yes → causation ≠ duty).               |
  | **16-25m** | **Defining "Causation by Omission"**<br>- Use **Counterfactual Test**    | "But-for Priya’s omission (not watering), would the plants have lived? Yes → *Causally relevant*."<br>→ Apply same to Case 2. | Legitimizes omissions as causes *without norms*. Emphasize: "We’re *only* asking about difference-making for the outcome, *not* blame yet."              |
  | **26-35m** | **Tackle Misconceptions** (Timed Responses)                              | **Objection 1:** "Omissions are nothing!" → *Reply:* "Nothing *happened*, but the *absence of an expected action* made a difference."<br>**Objection 2:** "Queen didn’t water!" → *Reply:* "Contrastive frame: Why *these* plants? Queen’s absence wasn’t a relevant factor *for this death*."<br>**Objection 3:** "No physical mechanism!" → *Reply:* "Causation in law/philosophy often relies on difference-making, not just physics." | **Crucial:** Link replies to board content:<br>- Contrastive frame (Column 2)<br>- Counterfactual test<br>- Greenhouse symmetry shows irrelevance of norms *to causation*. |
  | **36-45m** | **Introduce Norms & Complexity**<br>- Use **Overdetermination Case**     | "Twin Promises: Both Priya *and* Sam’s roommate promise to water. Both forget. But-for *neither* alone → death still occurs."<br>→ "Is causation erased?" | Position as **general causal puzzle** (e.g., two shooters). Ask: "Does this invalidate omissions? Or show limits of *but-for*?" → Normalizes issue.      |
  | **46-50m** | **Closing Question + Scope Limitation**                                  | **Q:** "In Priya’s case, what actually *caused* the plants to die—the lack of water, or her forgetting?" → Probe *why*. | Tests if they see omission (lack of water) as cause *independent* of mental state. Reveals if blame seeps back in.                                        |

  ---

  ### **Critical Design Choices**
  1.  **Why Greenhouse Pair Works:**  
      - **What it has:** Physical symmetry (same absence of water) + isolated norm (promise in one). Forces distinction: *Causation* is identical; *blame* differs.  
      - **What it lacks:** Distracting details (no drowning child’s agency, no "heroic duty" assumptions).  

  2.  **Overdetermination Placement:**  
      - **Where:** After establishing omissions *can* be causes.  
      - **How to Frame:** "This isn’t an *omission-specific* problem. It challenges *any* causal test when multiple sufficient causes exist. The omission is still *a* cause, even if but-for fails." Prevents detonation.  

  3.  **Handling the "Blame Dressed as Causation" Objection:**  
      - **When:** During misconception phase (26-35m), using greenhouse pair.  
      - **Defusal:** Point to Case 2 (no promise). Ask: "Did the absence of water *cause* death here? Yes. Was anyone *to blame*? No." → Decouples concepts.  

  4.  **The Sharp Closing Question:**  
      - **"What actually caused the plants to die—the lack of water, or Priya’s forgetting?"**  
        - **Why it works:** If they say "lack of water," they grasp omission-as-cause. If they say "forgetting," they conflate cause with mental state/blame.  
        - **Follow-up:** "Could the lack of water cause death if Priya *wasn’t* forgetful (e.g., she refused)?" → Reinforces absence as cause.  

  5.  **What to Explicitly *Exclude*:**  
      - **Announce early:** "Today, we’re *only* asking if omissions can *cause* outcomes. We are *not* deciding when someone is *responsible* (that needs duty, foreseeability, etc.). Responsibility is downstream of causation."  
      - **Why:** Prevents pre-law students from hijacking discussion. Makes boundaries clear.  

  ---

  ### **Why This Sequence Works**
  - **No Front-Loaded Metaphysics:** Contrastive framing is intuitive (students naturally ask "why *this*?"). Counterfactuals are familiar (e.g., "If I had studied...").  
  - **Norms Introduced Late:** Only *after* causation is established, avoiding conflation. Overdetermination becomes an interesting puzzle, not a wrecking ball.  
  - **Misconceptions Pre-Bunked:** Each objection is answered *when relevant* using board content (e.g., Queen objection fails against contrastive framing).  
  - **Consistent Example:** One extended analogy reduces cognitive load. Greenhouse pair does heavy lifting.  

  **Final Tip:** Start writing the greenhouse cases on the board *immediately* as you describe them. Use stick figures (🌱💀) for speed. The visual symmetry is key to separating cause and blame. Good luck—your instincts about contrastive causation and decoupling are spot-on!
