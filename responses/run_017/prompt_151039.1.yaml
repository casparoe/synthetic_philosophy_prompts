  I need to brainstorm all objections before selecting six. Possible objections include: artefacts are neutral tools with political use determined by users; politics lies only in ownership or code, not the artefact; calling artefacts political mystifies ownership; market selection reflects societal preferences; functional equivalence is subjective; durability of redistribution depends on social context; maintenance reflects societal values, not the artefact itself; and the lifecycle aspect confuses the artefact with its social embedding.

  For the six most likely objections from this audience: The Design and Technology director will argue tools are neutral. The Computer Science head will focus on code ownership. The politics teacher will see it as mystification of class interests. The economists will invoke market selection. The Computer Science head might also question functional equivalence in software. And the politics teacher might challenge the lifecycle claim as conflating the artefact with society.

  I'll order them as they might arise: starting with the tool neutrality objection (easiest to address), then mystification, market selection, code ownership, functional equivalence, and lifecycle conflation.

  For each objection, I'll draft a reply that concedes a small point but holds firm on the core thesis, with a one-line weakness. For example, for tool neutrality, concede that users matter, but hold that design embeds politics durably. The weakness might be that some artefacts have minimal political effects.

  The "hoped nobody asks" objection could be about intentionality—what if political effects are unintended? The user's weakest point might be defining "durable" redistribution clearly, as it could be seen as vague.

  I'll ensure the sheet is concise, using British English, and under the word limit by keeping replies tight and focused. This will help the user feel prepared and confident during the Q&A.
answer: |-
  ### Q&A Prep Sheet: Political Artefacts Thesis
  *(590 words, British English)*

  **1. Objection (Director of D&T):** "Tools are neutral. A hammer can build or destroy – its politics lies entirely in the user's intent. You're confusing the *use* of technology with the technology itself. The lift breaking is about maintenance choices, not the underpass design."
  *   **Concede:** Tools *can* be used in divergent ways; user intent is crucial.
  *   **Hold:** But *some* designs inherently constrain or enable specific users durably. A hammer is generic, but an underpass *without* a lift option at all inherently excludes wheelchair users regardless of intent. The *design choice* to include a lift (knowing it *requires* maintenance) embeds a potential politics; allowing it to break *durably* actualises that exclusion.
  *   **Weakness:** Distinguishing "generic" vs "inherently political" designs can be fuzzy.
  *   **Reply (1 min):** "You're right about hammers! But consider the *specific* design choice: including a lift introduces a dependency on maintenance. The *default* design without lift access inherently excludes. When the lift breaks and isn't fixed, the *durable effect* – exclusion – stems directly from the artefact's *design specification* (requiring a lift for access) combined with institutional neglect. The artefact itself becomes the barrier."

  **2. Objection (Politics Teacher):** "Calling the *artefact* political mystifies reality. The broken lift or rigid deadline isn't political; it's the *owners* or *institution* choosing not to maintain it or accommodate workers. You risk hiding the real agents – capitalists or bureaucrats – behind the 'thing'."
  *   **Concede:** Ownership, power structures, and institutional decisions are paramount.
  *   **Hold:** The artefact becomes the *material embodiment* and *enforcer* of those political choices. The portal's default deadline *is* the institutional rule made concrete. Its very *operation* enforces exclusion daily, irrespective of individual teacher intent.
  *   **Weakness:** Can downplay the role of conscious actors if over-emphasised.
  *   **Reply (1 min):** "Absolutely, owners/institutions make key choices. But once embedded in the artefact – like that unchangeable default deadline or the lift requiring upkeep – it becomes an *automatic executor* of politics. The pupil faces the *portal*, not the headteacher, at 9:01pm. The artefact *is* the institutional policy made material and durable, operating independently of daily intentions."

  **3. Objection (Economists):** "Isn't this just revealed preference? If stairs-only underpasses or early deadlines were truly unpopular or inefficient, the 'market' (users, councils, schools) would select alternatives. The designs that persist reflect aggregated choices."
  *   **Concede:** Market forces and user acceptance influence design prevalence.
  *   **Hold:** "Revealed preference" aggregates existing power imbalances. Pupils with jobs can't easily 'choose' another school portal. Wheelchair users can't vote with their feet if *all* underpasses are neglected. Markets often fail vulnerable minorities; their 'preference' isn't revealed, it's silenced. Durability locks in these exclusions.
  *   **Weakness:** Doesn't fully refute that dominant designs *reflect* (flawed) societal valuations.
  *   **Reply (1 min):** "Markets reflect *existing* power and access. A pupil needing flexible deadlines often lacks the power to change the school system. The 'preference' revealed is often the preference of the *majority* or the *institutionally powerful*, solidified in the design default. This ignores how artefacts *create path dependencies* that lock out minority needs."

  **4. Objection (Head of Computer Science):** "The politics lies in who *owns* the platform and who *writes* the code setting that default deadline. The portal itself is inert; it's the control and authorship that's political."
  *   **Concede:** Ownership and coding authority are critical political factors.
  *   **Hold:** But the *artefact* (the portal with its specific code) is the *mechanism* that *performs* the politics durably. Once deployed, its default settings operate automatically, enforcing rules regardless of who originally coded them or why. The code *is* the artefact's political constitution.
  *   **Weakness:** Blurs the line between the artefact and the political act of its creation.
  *   **Reply (1 min):** "Ownership and code authorship set the stage, absolutely. But once live, the portal *with its specific default* becomes the active agent. It’s the *coded rule within the artefact* – the 9pm deadline – that performs the exclusion every day, autonomously. Swapping it for code allowing user-set deadlines *would* redistribute power."

  **5. Objection (Head of Computer Science):** "Functional equivalence is meaningless in software. Changing the deadline default *is* changing the function – it becomes a different artefact. Your portal example undermines your own definition."
  *   **Concede:** Software can be highly malleable; changing defaults *can* feel like a functional change.
  *   **Hold:** The *core function* (submitting homework electronically) remains identical. The *default setting* (9pm) is a specific, durable configuration *of* that function. A portal allowing teacher-set deadlines has the *same core function* but a *different political effect* via its configurability. The default is part of the artefact's political design.
  *   **Weakness:** The line between "function" and "configuration" can be debatable in software.
  *   **Reply (1 min):** "The core function is 'electronic submission'. Two portals achieve this: one *forces* a universal 9pm deadline via its default, another *allows* variable deadlines. They are functionally equivalent for submission *capability*, but their *default configurations* create vastly different political realities. Swapping them *would* durably redistribute time-access power."

  **6. Objection (Politics Teacher):** "Your 'lifecycle' point concedes my argument! The underpass only becomes 'political' later due to social choices (neglect). That proves the politics is external, not in the artefact *itself*."
  *   **Concede:** Social choices (like neglect) are essential triggers.
  *   **Hold:** The *potential* for this political effect (exclusion if lift fails) was designed-in from the start. The neglect *actualises* the latent politics embedded by the design choice to only provide step-free access via a high-maintenance component. The artefact's *design* made it vulnerable to becoming political in this specific way.
  *   **Weakness:** Risks making the claim unfalsifiable ("latent politics" in everything).
  *   **Reply (1 min):** "The design *embeds vulnerability*. Choosing stairs+lift over a ramp made step-free access *contingent* on maintenance. The artefact itself has the *inherent characteristic* that neglect will alter its political effect durably. Its material form *invites* this specific political consequence through its lifecycle."

  **Hoped Nobody Asks:** "If a political effect is *unintended* and unforeseen by the designers (e.g., the homework portal default was set for admin convenience, not to exclude workers), can we still call the *artefact* itself political, or is it just an accident?" (This forces a choice: dilute "political" to mean any effect, or tie it strongly to design foresight/negligence).

  **My Weakest Point to Defend:** Defining "durable" redistribution precisely. How long must an effect last? Could a temporarily broken lift be 'political'? Argue durability means effects persist beyond immediate user actions/choices, becoming embedded in the system via the artefact's state or defaults. Focus on *systemic entrenchment* over mere duration.
