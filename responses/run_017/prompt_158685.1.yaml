answer: |-
  ### Sestina: Indifferent Channel

  Sunlight on brick, the taste of coastal air –  
  This Berkeley street arrives without a **signal**.  
  The curb, the crosswalk, every branching **nerve**  
  Reports its place as fact. No disembodied **vat**  
  Claims precedence. This city footfall, **hand**  
  That waves from doorways, needs no distant **Houston**.  

  A hum intrudes, not here, but in the **Houston**  
  Lab: a screen where Berkeley’s visual **signal**  
  Grows thin. They patch a feed – no break, no **nerve**  
  Alerted. Boston rooftops fill the **vat**-  
  Fed view. The curb still rises to the **hand**,  
  The crossing made. Unchanged, the coastal **Berkeley**.  

  The coffee cup is warm against my **hand**,  
  This Berkeley flesh. The hum from **Houston**  
  Persists, just background noise. The new view’s **signal**  
  Shows brick facades much like the ones in **Berkeley**,  
  No jarring shift. The camera in its **vat**  
  Feeds light that travels down the optic **nerve**.  

  They call it ‘channel indifference’ – **nerve**  
  Or wire, it carries what arrives. The **hand**  
  That grips the railing feels no distant **vat**,  
  No matter that the eyes report from **Houston**  
  A spliced reality. Still walks in **Berkeley**  
  This body, moved by motor **signal**.  

  A technician’s voice cuts through: "That **signal**  
  From Market Street? We lost it. Boston **nerve**  
  Bundle’s live." My eyes still see a **Berkeley**  
  Café. My foot descends. My lifted **hand**  
  Adjusts my coat. The voice comes from **Houston**.  
  The scene outside remains inside the **vat**.  

  The knowledge changes nothing. In the **vat**  
  Or lab, the world arrives: a visual **signal**,  
  A report. "Where?" persists. From **Houston**?  
  From eyes? From camera? Still, the optic **nerve**  
  Delivers light. This leg obeys. This **hand**  
  Still moves through fog that tastes of coastal **Berkeley**.  

  **Houston**, your lab commands this borrowed **hand**.  
  **Berkeley**, your streets conduct each fading **nerve**.  
  This **vat** transmits the spliced and shifting **signal**.

  ---

  **Notes:**

  1.  **The Turn:** The poem's turn (volta) occurs in **Stanza 5, Line 4**: **"Bundle’s live."** This is the moment of explicit revelation. The preceding lines subtly build the substitution (Stanza 2's hum, Stanza 3's "new view's signal", Stanza 4's abstract "channel indifference"), but Line 5.4 delivers the concrete, undeniable fact of the rerouting ("Boston nerve / Bundle’s live"). This is the point where the *speaker* learns the truth, mirroring the story's moment of disclosure. Crucially, the following lines (5.5-5.6 and all of Stanza 6) demonstrate the *indifference of the channel* – the experience remains unchanged despite the knowledge, forcing the unresolved "where?".
  2.  **Envoi Pairings & Justification:**
      *   **Houston / hand:** This pairing emphasizes the core dislocation: the control center (**Houston**, the brain/lab) operates the physical agent (**hand**, the body in Berkeley) across the mediating link. It concretizes the separation driving the question.
      *   **Berkeley / nerve:** This binds the location of the body (**Berkeley**) to the biological/physical conduit (**nerve**) that both *receives* its commands and *sends* its sensory data (now compromised), highlighting the body's ambiguous position as both actuator and sensor.
      *   **Vat / signal:** This pairing focuses on the *medium* and the *content*: the container (**vat**) – whether literal brain-jar or conceptual framework – is merely the vessel transmitting the fundamental **signal** (the data stream constituting experience), underscoring the poem's core theme of channel indifference and the primacy of information flow over physical location.

  These pairings were "earned" by the poem's trajectory: the **hand**'s persistent action in Berkeley despite Houston's control; the **nerve** as the literal and figurative connection point constantly shifting allegiance; the **vat** becoming the abstract locus of processed input; and the **signal** as the persistent, indifferent carrier of the world. Pairing place (**Houston**, **Berkeley**) with non-place (**hand**, **nerve**) and the medium (**vat**) with the content (**signal**) directly interrogates the source of location and identity, reflecting the story's central puzzle without resolving it.
