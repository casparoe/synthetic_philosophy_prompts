  We are designing a classroom activity to illustrate the concept of mutual cooperation in a one-shot prisoner's dilemma when players submit programs that can inspect each other's source code. The goal is for students to discover that cooperation can be achieved if programs can recognize each other as identical, and then to see how fragile that recognition is under perturbations.

  We'll break down the design into the requested parts.

  ### 1. Rules, Materials, and Timeline

  **Materials:**
  - Whiteboard or projector for displaying rules, payoffs, and results.
  - Paper and envelopes for submissions (to anonymize).
  - A way to randomly pair submissions (e.g., drawing from a hat).
  - A laptop with a simple script to run the programs (optional, with hand-run fallback).
  - Timer.

  **Grouping:**
  - 18 students: we'll have them work in pairs (9 pairs) for Round 1, but note that each student submits their own program. Then in subsequent rounds, we re-pair randomly. Alternatively, we can have each student submit individually and then pair across the entire class.

  **Timeline (90 minutes):**

  **0:00 - 0:10 (10 min): Introduction and Rules**
  - Explain the setup: Each student will write a program that plays a prisoner's dilemma. The program will receive the source code of the opponent's program as input and output either Cooperate (C) or Defect (D). Emphasize that this is a one-shot game (no repetition) and that the programs are run once against each other.
  - Display the payoff matrix (see below) and explain that the goal is to maximize one's own payoff.
  - Explain that each submission must be written in a very simple language (see next section) so that they can be evaluated by hand if needed.

  **0:10 - 0:25 (15 min): Writing Programs (Round 1 - Plain Source Exchange)**
  - Each student writes a program. They can use the minimal instruction language (or template) provided.
  - They write their program on a piece of paper, put it in an envelope, and write a unique identifier (like their student ID) on the outside for tracking. Collect the envelopes.

  **0:25 - 0:35 (10 min): Pairing and Running (Round 1)**
  - Randomly pair the submissions (each program will play one other). Anonymize by removing the envelopes and assigning a random ID to each.
  - For each pair, run the programs: give each program the source of the other and have it output an action. (If using a script, input the two source codes and get the outputs. Otherwise, do it by hand.)
  - Record the actions and compute payoffs. Display the results for each pair and update a leaderboard (individual scores).

  **0:35 - 0:40 (5 min): Round 1 Debrief**
  - Quickly note the outcomes. Without giving away the idea, ask: "Did anyone get mutual cooperation? How? Why did others defect?"

  **Round 2: Obfuscation (0:40 - 0:55)**
  - **0:40 - 0:45 (5 min):** Explain that in this round, the source code will be passed through an "obfuscator" that renames variables, reorders independent lines, and inserts a no-op. This breaks naive string comparison but does not change the behavior.
  - **0:45 - 0:50 (5 min):** Students may revise their programs if they wish. Collect new submissions (or they can keep the old one).
  - **0:50 - 0:55 (5 min):** Obfuscate the source of each program (by hand or script) and then run as in Round 1, with obfuscated sources. Record results and update leaderboard.

  **Round 3: Behavioral Fingerprint (0:55 - 1:05)**
