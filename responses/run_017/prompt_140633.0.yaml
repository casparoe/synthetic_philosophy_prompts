  - **1:00 - 1:05 (5 min):** Students revise and submit. Then, for each program, run it against the three probes to get the fingerprint. Then pair programs and give each the other's fingerprint. Run and record.

  **Round 4: Execution Noise (1:05 - 1:15)**
  - **1:05 - 1:10 (5 min):** Explain that in this round, there will be noise: either (a) with a fixed chance (say 10%) the output of a program is flipped (C becomes D, D becomes C) or (b) with a fixed chance (say 10%) one random character in the source code is changed (only in Round 4, and only if using source? But note in Round 3 we used fingerprints). Since Round 3 used fingerprints, we can either revert to source with noise or apply noise to the fingerprint. Let's revert to source exchange (without obfuscation) but with noise.
