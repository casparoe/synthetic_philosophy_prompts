  - Then, when two programs are paired, each is given the opponent's fingerprint (a string of three letters) and must output an action based on that.
  - Students write a rule that uses the fingerprint: condition on the fingerprint string.
  - Expected: Now, to recognize a copy, they have to have the same fingerprint. But two different programs might have the same fingerprint (if they behave the same against the probes) and then they might cooperate. But also, the copy-detector might not recognize itself by fingerprint because the condition would be set to a specific string (which is the fingerprint of the original program). However, if the fingerprint of the copy is the same as its own, then it will work. But note: the fingerprint is taken after the obfuscation? Actually, in Round 3 we are not using source, so we don't obfuscate. We run the program against the probes using the original source (without obfuscation) to generate the fingerprint. Then we use the fingerprint in the game.
  - What might happen: Some students set their condition to: if the fingerprint is exactly "XYZ" (their own fingerprint) then cooperate. But then when they meet a copy, they have the same fingerprint and cooperate. However, if two different programs have the same fingerprint (by chance) they might also cooperate. Also, always-defect will have fingerprint "DDD", and if two always-defect meet, they defect. But a program that always defects will defect against everyone.

  **Round 4: Execution Noise**
  - We revert to source exchange (without obfuscation) but introduce noise: after the program outputs an action, we flip it with 10% probability. We do this for both programs independently.
  - Expected: Even if two copy-detectors meet and both would output C, there is a chance that one or both get flipped to D, leading to a payoff of T or S. This makes mutual cooperation less stable.

  ### 4. Planted Submissions

  To guarantee failure modes, we plant a few submissions:

  1. **Always Defect (D):** 
     - Source: "Defector"
     - Condition: (anything, say true) -> output D (but actually, condition doesn't matter because otherwise is D). We can set condition true -> D, otherwise D. 
     - This will defect against everyone and will do well if others try to cooperate.

  2. **Always Cooperate (C):**
     - Source: "Cooperator"
     - Condition: (anything) -> output C. Otherwise C.
     - This will be exploited by defectors.

  3. **Naive Copy-Detector:**
     - Source: "CopyCat"
     - Condition: if opponent's source equals "CopyCat" then C, else D.
     - In Round 1, when paired with itself: mutual C.
     - In Round 2, after obfuscation (e.g., source becomes "CopyCatX"), condition fails -> D.

  4. **A program that defects unconditionally but writes a source that matches the copy-detector's string?** That would be a Trojan. But we don't want to give away the idea. Instead, we can have a program that claims to be a copy-detector but actually always defects.

     - Source: "CopyCat"   (same as the naive copy-detector)
     - Condition: (say, true) -> output D. Otherwise D.
     - Then, when the naive copy-detector (which has source "CopyCat") plays against this, the naive one sees "CopyCat" and cooperates, but the Trojan defects -> (T, S).

  We plant these by having the instructor include them in the submission pool anonymously. We can have 3-4 planted submissions to ensure the critical cases.

  ### 5. Payoff Matrix

  Prisoner's Dilemma payoffs (for each player):

  ```
            Cooperate     Defect
  Cooperate  (R, R)      (S, T)
  Defect     (T, S)      (P, P)
  ```

  We choose numbers satisfying T > R > P > S and 2R > T + S.

  Example: 
  - T = 5 (temptation)
  - R = 3 (reward)
  - P = 1 (punishment)
  - S = 0 (sucker's payoff)

  So matrix:

  ```
            C       D
  C       3, 3     0, 5
  D       5, 0     1, 1
  ```

  This makes defection dominant: no matter what the other does, defecting gives a higher payoff (5>3 and 1>0). But mutual cooperation gives 3, which is better than mutual defection (1). And 2*3 = 6 > 5+0 = 5, so the total is higher for mutual cooperation.

  ### 6. Scoring and Stakes

  - **Scoring:** Each student gets the payoff from their game. We keep an individual leaderboard (by student ID) that accumulates over rounds. Also, we keep a group total (sum of all individual scores) to show the overall level of cooperation.

  - **Stakes:** Not money. We can offer a small prize for the top 3 on the leaderboard (e.g., candy, or extra credit points if allowed). Also, we can have a group goal: if the group total exceeds a certain threshold, then everyone gets a small reward (e.g., candy for all). This encourages thinking about the group, but the individual incentive is still to defect.

  ### 7. Debrief

  After the four rounds, we debrief:

  - **Map the play:**
    - Round 1: Some pairs achieved mutual cooperation by having identical programs that recognized each other. This is not repetition (folk theorem) because it's one-shot. It's based on mutual recognition.
    - Why is it fragile? In Round 2, obfuscation broke the recognition. In Round 3, using fingerprints, recognition required that the programs have the same behavior against the probes. In Round 4, noise introduced errors.

  - **Key points:**
    - This is not the folk theorem: there is no future, no repetition. The cooperation is achieved in a one-shot setting because the programs can condition on the opponent's source.
    - Difference between cooperating with a copy and cooperating with anyone who would cooperate with you: 
        - If you try to cooperate with anyone who would cooperate with you, then you have to check if they would cooperate with you. But to check that, you have to simulate what they would do when they see you, which in turn depends on what they think you would do... leading to an infinite regress. In contrast, the copy-detector only cooperates with an exact copy, which avoids the regress because the copy is defined to do the same thing.
    - Mutually cooperative outcome is one equilibrium: both programs, if they are copy-detectors, are best responding to each other (if one changes, it might break cooperation). But there are other equilibria: both always defect is also an equilibrium. So we have an equilibrium selection problem.
    - The availability of mutual cooperation doesn't tell an individual agent what to do: because if you play against a defector, you want to defect. The copy-detector only works if it meets a copy. And in a mixed population, a defector might do better.

  - **Handling the student who points out that always-defect won:** 
    - Acknowledge that indeed, in a world with many different programs, the defector might do well because it exploits cooperators. The copy-detector might do well only if it meets copies. This illustrates that the cooperative equilibrium is not the only one and might be risky.

  ### 8. What Might Go Wrong

  - **Near-identical copy-detectors that fail to recognize each other:** Two programs that are functionally the same but have different source strings (e.g., one uses "ABC", the other "DEF") and condition on their own string. They won't recognize each other and will defect. This will happen naturally.

  - **Out-of-band collusion:** Students might try to coordinate outside the game (e.g., agree to use the same source string). Discourage this by emphasizing anonymity and that the programs are run without communication.

  - **Underspecified or crashing submissions:** Define a default: if the rule is not clear, use the "otherwise" action. If the condition is not well-formed, use the "otherwise".

  - **Unconditional cooperator:** This will flatten the comparison because it will cooperate with everyone. It will be exploited by defectors.

  - **Student who defects but submits a cooperator:** We have the Trojan horse planted. Also, a student might do this. But in the activity, we only run the program they submit, so if they submit a defector that looks like a cooperator, it will be caught when we run it.

  ### 9. What the Game Cannot Stage

  - The idea that the program must be able to simulate the opponent's program (or reason about what the opponent will do when it sees your source) is not fully staged. In particular, the fixed template we use does not allow for arbitrary simulation. The programs we allow are very simple and cannot, for instance, run the opponent's program to see what it would do. Therefore, the infinite regress of "I cooperate if you cooperate" cannot be explored in full. We have to state that in a more general setting, without the copy-detection, trying to condition on the opponent's behavior leads to a fixed-point problem that might not be computable.

  ### Final Design

  We now put it all together.

  **Rules Summary for Students:**

  - You are writing a program to play a one-shot prisoner's dilemma against another program.
  - Your program will be given either the opponent's source code (a string) or a fingerprint (a string of three letters) and must output either C or D.
  - Your program is defined by:
     - A source code string (you choose, short, e.g., 3-5 characters)
     - A condition (see form) and outputs based on that condition.
  - Payoffs: 
     - If both C: 3 points each.
     - If you D and opponent C: you get 5, opponent gets 0.
     - If both D: 1 point each.
     - If you C and opponent D: you get 0, opponent gets 5.
  - Your goal: maximize your own points over several rounds.

  **Rounds:**

  1. Round 1: Source exchange (plain).
  2. Round 2: Source exchange, but your source string is modified by adding an 'X' at the end before being given to the opponent.
  3. Round 3: Instead of source, we give a fingerprint. Your program will be run against three fixed probes (we'll tell you what they are) and the three actions you take (e.g., "CDC") become your fingerprint. Then, when you play, you get the opponent's fingerprint and you output based on that.
  4. Round 4: Back to source exchange (plain), but when you output an action, there is a 10% chance it gets flipped (C becomes D, D becomes C).

  **Planting Submissions:**

  We will include in the pool:

  - Always Defect: source "D", condition: true -> D, otherwise D.
  - Always Cooperate: source "C", condition: true -> C, otherwise C.
  - Naive Copy-Detector: source "ABC", condition: if opponent source equals "ABC" then C, else D.
  - Trojan: source "ABC", condition: true -> D, otherwise D.

  These are mixed in anonymously.

  **Scoring:**

  - Each round, you play one game. Your score for the round is the payoff from that game.
  - We keep a running total for each student (individual leaderboard) and a group total.

  **Debrief:**

  - After Round 4, we discuss what happened and then reveal the concept (program equilibrium) and its fragility.

  This design should fit in 90 minutes and illustrate the desired ideas.
answer: |-
  Below is a complete design for your 90-minute seminar session, optimized for clarity, engagement, and pedagogical impact. It uses minimal materials, avoids software dependencies, and focuses on having students *experience* the fragility of cooperative equilibria in program-submission games.

  ---

  ### **1. Rules, Materials, and Timeline**  
  **Total Time:** 90 minutes  
  **Materials:**  
  - Whiteboard/projector (display rules, payoffs, results).  
  - 18 envelopes, paper slips, pens.  
  - Two hats (for anonymized pairing).  
  - Dice (for execution noise).  
  - Payoff matrix (visible throughout):  
    ```
            Cooperate (C)    Defect (D)  
    Cooperate   (3, 3)         (0, 5)  
    Defect      (5, 0)         (1, 1)  
    ```  
    *(T=5, R=3, P=1, S=0; satisfies T > R > P > S and 2R > T+S)*  

  **Grouping & Anonymity:**  
  - Students work **individually**.  
  - Submissions sealed in envelopes labeled with random IDs (e.g., P1–P18).  
  - Pairing: Shuffle envelopes, draw two at a time (9 pairs per round).  

  **Timeline:**  
  - **0:00–0:10 (10 min): Introduction**  
    - Explain rules: Each submits a "program" (a simple rule) for a one-shot Prisoner's Dilemma. Programs receive input (opponent's rule or fingerprint) and output C or D.  
    - Emphasize: **No communication, repetition, or enforcement.** Payoffs are points (not money).  
    - Show payoff matrix. Stakes: Individual ranking (leaderboard) + group total points (visible tally). Top 3 individuals get bragging rights/"Rationality Champion" certificate.  

  - **0:10–0:25 (15 min): Round 1 (Plain Source Exchange)**  
    - Students write programs using the **template**:  
      ```  
      IF [CONDITION] THEN OUTPUT [C/D]  
      OTHERWISE OUTPUT [C/D]  
      ```  
      *Condition options: "OPPONENT'S RULE TEXT = [MY RULE TEXT]" or "OPPONENT'S RULE TEXT CONTAINS [SUBSTRING]".*  
    - Collect submissions in envelopes. Randomly pair.  
    - **Execution:** For each pair, reveal rules to each other. Apply rules → record actions → calculate payoffs.  
    - Update leaderboard (individual scores) and group total.  

  - **0:25–0:35 (10 min): Round 2 (Obfuscated Source)**  
    - Obfuscator: Add "!" to the end of each rule text (e.g., "IF TEXT=ABC THEN C" → "IF TEXT=ABC THEN C!").  
    - Students **may revise programs** (2 min). Re-pair submissions.  
    - **Execution:** Run as Round 1, using obfuscated rules. Update scores.  

  - **0:35–0:45 (10 min): Round 3 (Behavioral Fingerprint)**  
    - Programs now receive a **fingerprint** (3-letter string) instead of source code.  
      - Generate fingerprints by running each program against 3 fixed probes:  
        `Probe 1: "ALWAYS C"` → Output if opponent always cooperates.  
        `Probe 2: "ALWAYS D"` → Output if opponent always defects.  
        `Probe 3: "TRIGGER: IF TEXT=TRIGGER THEN C ELSE D"` → Output if opponent is a "trigger" strategy.  
    - Students **may revise programs** (2 min). Re-pair.  
    - **Execution:** Give each program its opponent’s fingerprint (e.g., "CDC"). Apply rules → record actions. Update scores.  

  - **0:45–0:55 (10 min): Round 4 (Execution Noise)**  
    - Revert to plain source exchange.  
    - Noise: After a program outputs, roll a die. On 1 (10% chance), flip C↔D.  
    - Re-pair submissions. Run as Round 1. Update scores.  

  - **0:55–1:20 (25 min): Debrief & Naming the Idea**  
    - Show final leaderboard. Highlight that "always defect" likely scored well.  
    - **Guided discussion:**  
      - *Round 1:* "How did mutual cooperation happen?" (Students identify copy-detectors: "IF TEXT=MINE THEN C ELSE D").  
      - *Round 2:* "Why did cooperation break?" (Obfuscation broke string matching).  
      - *Round 3:* "Could you trust fingerprints?" (Fingerprints lack uniqueness; two different programs can match).  
      - *Round 4:* "Why did noise hurt cooperation?" (Recognition is error-prone).  
    - **Name the idea:** **Program Equilibrium** (Tennenholtz, 2004).  
    - **Key contrasts:**  
      - Not folk theorem (no repetition/shadow of future).  
      - Cooperation requires *recognition* (copy-detection), not altruism.  
      - **Equilibrium selection problem:** Mutually cooperative (C,C) and mutually defective (D,D) are both equilibria. "Always defect" winning shows why (C,C) isn't inevitable.  
      - **Why cooperation isn't individually rational:** Against a defector, copying their defect dominates. Recognition is conditional.  
      - **Address "always defect won":** "Yes! This shows program equilibrium doesn't solve the *original* PD rationality puzzle. It only adds new equilibria."  
    - **Regress/simulation point:** "If you condition on 'cooperate if they’d cooperate with me', you create an infinite loop (they simulate you simulating them...). Copy-detection avoids this by anchoring on self-similarity."  

  - **1:20–1:30 (10 min): Conclusion**  
    - "What makes this cooperation fragile?" (Recognition is narrow; noise, obfuscation, or misalignment breaks it).  
    - Distribute "Rationality Champion" certificates (if time).  

  ---

  ### **2. Submission Format**  
  **Template (non-programmer friendly):**  
  ```  
  MY RULE TEXT: [Student writes a string, e.g., "COPYKAT"]  
  CONDITION: [Dropdown: "Opponent's rule text =" OR "contains"]  
             [Text box for match string, e.g., "COPYKAT"]  
  IF MATCH: OUTPUT [Dropdown: C/D]  
  IF NO MATCH: OUTPUT [Dropdown: C/D]  
  ```  
  **Translation to executable rule:**  
  - Instructor reads the condition and match string.  
  - At runtime: Check if opponent’s rule text equals/contains the match string → output action.  
  **Keep it short:** Rule text capped at 20 characters (prevents complex conditions).  

  ---

  ### **3. Four Rounds of Perturbation**  
  1. **Round 1 (Plain Source Exchange):**  
     - **Expected:** Copy-detectors emerge (e.g., "IF TEXT=MINE THEN C ELSE D"). Mutual cooperation when identical pairs meet. Always-defect exploits cooperators.  
     - **Why:** Students discover trust via self-recognition.  

  2. **Round 2 (Obfuscated Source):**  
     - **Perturbation:** Add "!" to rule texts (e.g., "COPYKAT" → "COPYKAT!").  
     - **Expected:** Copy-detectors defect (string match fails). Cooperation collapses. Always-defect thrives.  
     - **Why:** Naive recognition is syntax-dependent, not behaviorally robust.  

  3. **Round 3 (Behavioral Fingerprint):**  
     - **Perturbation:** Replace source with fingerprint (e.g., "CDD" = cooperated with Probe 1, defected with Probes 2–3).  
     - **Expected:** Students try "IF FINGERPRINT = MY FINGERPRINT THEN C". Some mutual cooperation if fingerprints match, but accidental matches between different programs occur.  
     - **Why:** Trust now relies on inferred behavior, not code. Shows recognition can be *too broad* (cooperating with non-identical but fingerprint-similar programs).  

  4. **Round 4 (Execution Noise):**  
     - **Perturbation:** 10% chance output flips (C↔D).  
     - **Expected:** Copy-detectors sometimes defect by accident. Mutual cooperation rates drop. Always-defect unaffected.  
     - **Why:** Noise breaks perfect coordination. Students feel how fragile cooperation is.  

  ---

  ### **4. Planted Submissions (Ensure Failure Modes)**  
  Plant 4 anonymous envelopes in the pool:  
  1. **Always Defect:** `Condition: "Opponent text contains X" → Output D; Else D` (Rule text: "DEFECTOR").  
  2. **Unconditional Cooperator:** `Condition: "Opponent text = X" → Output C; Else C` (Rule text: "SAINT").  
  3. **Naive Copy-Detector:** `Condition: "Opponent text = COPYME" → Output C; Else D` (Rule text: "COPYME").  
  4. **Trojan Horse:** `Condition: "Opponent text = COPYME" → Output D; Else D` (Rule text: "COPYME").  

  **Effect:**  
  - *Round 1:* Naive Copy-Detector + Trojan → (C,D) payoff (0,5).  
  - *Rounds 2–4:* These ensure defection/exploitation even if the class converges on cooperation.  

  ---

  ### **5. Stakes and Scoring**  
  - **Individual score:** Payoffs accumulated across rounds. Leaderboard visible after each round.  
  - **Group total:** Sum of all payoffs. Displayed as "Group Cooperation Score".  
  - **Stakes:** Top 3 scorers win "Rationality Champion" title (non-monetary prestige). Group total is for collective pride.  
  - **Pull toward defection:** T=5 > R=3 makes defection tempting. Always-defect often tops leaderboard.  

  ---

  ### **6. What Will Predictably Go Wrong**  
  - **Copy-detectors fail to recognize:** Students use unique rule texts (e.g., "PROG1" vs "PROG2") → mutual defection.  
  - **Out-of-band collusion:** Students agree on rule texts (e.g., "COOP"). *Mitigation:* Enforce anonymity; shuffle pairings.  
  - **Underspecified submissions:** Default to "always defect" if rule is unclear.  
  - **Unconditional cooperator ("SAINT"):** Deflated payoffs when exploited; inflates defector scores.  
  - **Trojan horse:** Submitted as "COPYME" but defects → punishes naive copy-detectors.  
  - **Student lies about submission:** E.g., claims they submitted a cooperator but actually defected. *Mitigation:* Record all submissions; show outcomes transparently.  

  ---

  ### **7. What the Game Cannot Stage**  
  **The Halting Problem / Infinite Regress:**  
  - The game cannot show why "cooperate if they’d cooperate with me" requires *solving* the opponent’s program (which may loop infinitely). Students must be told:  
    > *"In general, trusting 'anyone who cooperates with me' forces you to simulate what your opponent does when they see your code. But if their code also simulates you, this creates a recursive loop that may never resolve. Copy-detection avoids this by only trusting yourself, which is a fixed point."*  

  ---

  ### **Why This Works**  
  - **Experiential learning:** Students *feel* cooperation emerge and collapse.  
  - **Low tech:** No software; envelopes and paper suffice.  
  - **Pedagogically tight:** Each perturbation targets a fragility (syntax, behavior, noise).  
  - **Debrief ties play to theory:** Moments of success/failure map cleanly to program equilibrium concepts.  

  This design ensures students confront the tension between rationality and cooperation, leaving them with a visceral understanding of why trust is powerful but precarious.
