  - **1:10 - 1:15 (5 min):** Students submit (they can revise). Then run as in Round 1, but for each program, after it outputs, roll a die: if 1 on a d10, flip the output. Record and update.

  **1:15 - 1:30 (15 min): Debrief and Naming the Idea**
  - Show the leaderboard and note that the always-defect program might be near the top.
  - Discuss: How did mutual cooperation happen in Round 1? Why did it break in later rounds?
  - Then, reveal the idea: "This is an example of a program equilibrium. We can have mutual cooperation in a one-shot PD if the programs can recognize each other as copies. But note how fragile it is: when we obfuscated, the recognition broke. When we used fingerprints, it became harder. And noise made it even more fragile."
