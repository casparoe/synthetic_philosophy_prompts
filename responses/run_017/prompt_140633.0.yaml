  Alternatively, we can have them write a program in a simple language that we can interpret. We'll design a tiny language.

  **Tiny Language:**
  Each program is a set of rules. Each rule is a condition and an action. Conditions are:
  - EQUAL(opponent_source, "string"): true if the opponent's source is exactly "string"
  - CONTAINS(opponent_source, "substring"): true if the substring is in the source
