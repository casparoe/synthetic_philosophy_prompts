  - FINGERPRINT_EQUAL(opponent_fingerprint, "CDC"): for Round 3, true if the fingerprint is exactly the given string.

  And then the program is:
  Rule 1: if condition1 then output action1
  Rule 2: if condition2 then output action2
  ...
  Otherwise: output default_action

  But to keep it simple, we allow only one condition and an otherwise.

  **Final Submission Format:**
  We'll use a form for each round. The form has:

  - A text box for the student to write their program's source code (which can be any string they choose, but we suggest they keep it short, e.g., 3-5 characters). This source code will be given to the opponent. Note: the source code they write is what the opponent will see. And their program's behavior is defined by the rules they set.

  - A rule: 
    - Condition: [dropdown] 
        Options: 
          - "opponent's source is exactly: [text box]"
          - "opponent's source contains: [text box]"
          - "opponent's source has length: [number]"
          - "opponent's fingerprint is exactly: [text box of 3 letters]" (for Round 3)
    - If condition is true: output [dropdown: C or D]
    - Otherwise: output [dropdown: C or D]

  We can also allow more than one condition? But that complicates. We'll stick to one condition.

  **How to execute:**
  - The instructor (or a script) will have a form for each program. When two programs are paired, for each program:
    - Input: the opponent's source (or fingerprint for Round 3)
    - Check the condition against that input.
    - Then output according to the rule.

  **Example:**
  - Student writes source: "ABC"
  - Condition: opponent's source is exactly "ABC"
  - If true: output C
  - Otherwise: output D

  When playing against itself: sees "ABC", so condition true, outputs C -> mutual C.
  When playing against "XYZ": condition false, outputs D.

  ### 3. Four Rounds of Perturbation

  **Round 1: Plain Source Exchange**
  - What we expect: Some students will write a program that checks if the opponent's source is the same as their own and cooperates if so, else defects. If two such identical programs meet, they both cooperate. Also, there will be always-defect and always-cooperate programs. 
  - Outcome: Some mutual cooperation, but also many defections.

  **Round 2: Obfuscation**
  - Before running, we obfuscate each source: 
    - Rename variables? But our source is just a string. Instead, we can change the string: for example, if the source is "ABC", we might change it to "A B C" (insert spaces) or "ACB" (reorder) or "ABD" (change one character). But we want to break naive string comparison without changing the behavior? Actually, the behavior of the program is defined by the rule, which is fixed. The source string is what is passed. So if we change the source string, then the condition in the rule might break.
  - How to obfuscate: We'll apply a fixed transformation to the source string. For example:
    - Insert a random space? But then the condition (exact match) will break.
    - Alternatively, we can tell the students that the source will be passed through an obfuscator that might add a space or reorder letters. Then they have to design their condition accordingly. But that might be too much.
  - Instead, we'll do: for each source string, we add a fixed suffix, say "X". So "ABC" becomes "ABCX". This breaks exact matches and might break substring matches. 
  - Expected: Programs that relied on exact string match will now not recognize each other and will defect. Mutual cooperation among these breaks.

  **Round 3: Behavioral Fingerprint**
  - Instead of source, we give a fingerprint: the program is run against three fixed probe programs (which we provide). The probes are:
     - Probe 1: Always Cooperate (source "C", rule: always C)
     - Probe 2: Always Defect (source "D", rule: always D)
