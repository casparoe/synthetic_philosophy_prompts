prompt: |-
  I'm a journalist — I do a weekly column on science and ideas, mostly the human and social stuff, and every so often I manage to smuggle in some actual philosphy. Right now I'm working on a piece about who gets counted as "the people" in a democracy, and I've been going round in circles on it, so I'd rather think out loud with you than be lectured at. Please don't send me a reading list or footnotes: I can't use citations in a newspaper piece anyway, and what I need is the argument, not the literature.

  Here's the pattern that's bugging me. In most democracies the national vote is tied to citizenship, not residence, and it plays out in ways that look, on the face of it, like they can't all come from the same idea:

  - People who have lived abroad for decades — sometimes born there, citizens purely by descent, never paid tax in the home country, never really lived under its day-to-day laws — keep the vote for life and usually pass it on to their children. Several countries even run dedicated overseas constituencies with reserved seats. (I know a few have time limits — Australia, I think, cuts you off after a while — but the general shape is what I mean.)
  - Meanwhile long-term legal residents who've worked, paid taxes, and raised kids in the country for twenty or thirty years can't vote in national elections, and in a lot of places can still be deported.
  - The bit that really gets me: in the US, as I understand it, non-citizen male residents are required to register for the draft. So the state can conscript you while refusing you any say in the decision to conscript you.
  - But then flip to the local level, and residence suddenly seems to be enough: plenty of places let non-citizen residents vote in municipal or school-board elections, and within the EU a citizen of one member state living in another can vote in local elections where they actually live. So residency qualifies you down at the bottom and disqualifies you at the top.

  So: what theory of legitimate inclusion does that package presuppose? I mean both "what has to be true for this to make sense" and "what does it quietly rule out."

  I've been sorting the arguments I hear into three buckets and I suspect my buckets are wrong, so tell me if they are:
  - Authorship claims: the law is issued in my name, so I have to be able to see myself as one of its authors; being pushed around by a collective I don't belong to is a form of domination even if the pushing is gentle.
  - Exposure claims: I carry the costs of whatever gets decided, so I need a say in it.
  - Stake or association claims: my life plan is bound up with this place over time, so I'm a member in a way a visitor or a passing investor isn't.

  Which of those does the practice actually need, and which does it only sit comfortably next to? Does it maybe need a fourth thing I haven't got a bucket for — something about stability, like: the demos has to be a group whose membership you can't change by moving house, and which persists across generations so it can bind itself to long-term commitments? Is the nationality rule best explained by that kind of consideration, by the authorship idea, or by something less flattering (emigrants who send money home and lobby for the folks back home are useful to governments)? And can any single story hold the whole package together — the overseas voters, the voteless taxpayers, the draft-eligible non-voters, and the local elections where residence is suddenly fine — or is this just a settlement between theories that don't really fit?

  Then the counterfactual I want: if we dropped the implicit theory and adopted something like a pure "everyone who's genuinely affected gets a say" rule, what would elections actually have to look like? Walk me through it concretely — do we end up enfranchising foreigners downstream of our emissions or our central bank, giving children or future people some kind of proxy, and disenfranchising emigrants? Is that a reductio of the affected-interests principle, or is it where the logic honestly goes and we should just get used to it?

  And be clear on where the practice is underdetermined: which features would several rival theories all license, so that they tell us nothing about what we really believe, and which are load-bearing. I want to know which parts of this are philosophy and which are just historical accident.
reasoning: |-
  Okay, this journalist is tackling a complex question about democratic inclusion that's clearly been bothering them. They're frustrated with circular thinking and want to explore the underlying logic - or lack thereof - behind current voting practices. 

  The core tension they've identified is fascinating: why do we grant lifelong voting rights to citizens abroad (even those with minimal ties) while denying them to long-term resident taxpayers? That military conscription point about non-citizens is particularly jarring. And then there's the local election exception that flips the script entirely. 

  They've already done impressive groundwork by sorting theories into three buckets - authorship (laws in my name), exposure (I bear the costs), and association (life bound to place). But they suspect these categories might be flawed or incomplete. What's really clever is their instinct to look for what the system presupposes and what it silently excludes. 

  The historical angle they hint at ("just historical accident") feels crucial here. Modern citizenship rules carry baggage from when nations were emerging from empires - that overseas voting tradition likely stems from diaspora politics of the 19th century. Meanwhile, municipal voting has always been more pragmatic about who actually lives in a community. 

  On their counterfactual: if we took "affected interests" seriously, the implications would be radical. Climate policy decisions would require input from Pacific islanders; monetary policy might involve foreign bondholders. But is this unworkable or actually more coherent? The conscription example suggests our current system already violates its own logic. 

  What they're really wrestling with is whether democratic theory can justify these contradictions or if we're just rationalizing path dependency. The residency/citizenship disconnect at different government levels might be the most telling - it suggests we unconsciously recognize residency matters when consequences are immediate and tangible, but retreat to tribal membership myths for abstract national identity. 

  Their journalistic lens shows in wanting concrete scenarios ("walk me through it") rather than academic citations. The challenge will be articulating why these inconsistencies persist without falling into cynical "it's all power politics" explanations - while still acknowledging that emigrants sending remittances do get special treatment because they're useful. 

  That last question about "load-bearing" elements versus accidental features is razor-sharp. Maybe citizenship is the philosophical load-bearer nationally while residency is the practical load-bearer locally - and we tolerate the contradiction because no one level exposes it fully.
answer: |-
  You've hit the nerve where democratic theory meets the messy reality of statecraft. That tension between citizenship and residence isn't an accident—it’s baked into unresolved contradictions about what makes rule legitimate. Let’s dissect your buckets and see what holds the package together (or doesn’t).

  ### The Load-Bearing Pillars of the Status Quo  
  1. **The Sovereignty Shell Game**:  
     National elections are tied to *sovereignty*—the myth of a perpetual people bound by history, not geography. Citizenship is the token. This is why the emigrant voting from Argentina for 40 years still "belongs," while the resident non-citizen paying taxes for 30 does not. Sovereignty demands a fixed demos that transcends time and space. **Authorship** (laws in "our" name) only works if "we" are an enduring entity. Residency is too fluid for that story.  

  2. **Cost-Bearing as Conditional**:  
     **Exposure** matters—but selectively. Local elections (property taxes, schools, garbage collection) directly impact daily life, so residency suffices. But at the national level? Exposure is diluted by scale. Your long-term resident *feels* costs, but the state treats them as a guest, not a stakeholder. The draft example is the brutal extreme: the state claims your body (exposure++) but denies authorship. This isn’t incoherent to power; it’s a feature. The state extracts obligations from all within its grasp but reserves political membership for the "eternal" nation.  

  3. **Intergenerational Lock-In**:  
     Your missing bucket is **perpetuity**. The demos must bind future generations (debt, treaties, constitutions). Citizenship-by-descent for emigrants’ kids isn’t about fairness—it’s about maintaining the fiction of an unbroken chain. If membership expired when you left, the "people" would seem contingent, mortal. States hate that.  

  ### What the System Quietly Rules Out  
  - **Consent of the Governed, Seriously Applied**: If exposure + cost-bearing = claim to a voice, then disenfranchised residents *are* being ruled without consent. The status quo accepts this as collateral damage.  
  - **Democracy as Daily Practice**: Local enfranchisement admits that democracy works best when people share tangible stakes. Nationally, it’s a loyalty ritual.  

  ### Counterfactual: The "Affected Interests" Democracy  
  If we took "all affected get a say" literally:  
  - **Climate Sufferers Vote**: Bangladesh gets seats in the U.S. Congress if fossil fuel policy drowns them.  
  - **The Fed’s Global Constituency**: Foreign holders of U.S. debt vote on interest rates.  
  - **Emigrant Disenfranchisement**: You lose your vote when you move (why should you decide policies you don’t live under?).  
  - **Children & Future Generations**: Proxy votes for parents? AI modeling for the unborn?  
  - **Conscription Bargain**: If you’re draft-eligible, you vote. Period.  

  **Is this reductio?** Only if you cling to the nation-state container. Otherwise, it’s brutally logical—and unworkable. Why? Because democracy requires a *bounded* community to deliberate, compromise, and accept outcomes. Infinite inclusion dissolves those bounds.  

  ### What’s Underdetermined vs. Load-Bearing  
  - **Accident/Habit**:  
    - Overseas constituencies (they’re perks for diasporas who lobby or send remittances).  
    - Draft registration for non-citizens (historical inertia—the Selective Service Act didn’t update with immigration realities).  
  - **Philosophical Load-Bearing**:  
    - **Citizenship-as-Gatekeeper at National Level**: Without this, the sovereignty narrative collapses.  
    - **Residency at Local Level**: Proves democracy can be pragmatic when consequences are immediate.  
    - **No Automatic Path from Taxpayer to Voter**: Reveals the state prioritizes mythical belonging over transactional fairness.  

  ### The Unflattering Truth  
  The package coheres around *state interests*, not philosophy:  
  - Emigrants are kept as lobbyists, investors, or cultural ambassadors.  
  - Residents are excluded to preserve ethnic/national identity myths.  
  - The draft targets bodies, not citizens.  
  - Local pragmatism is tolerated because mayors can’t afford riots over potholes.  

  **Your piece’s knife-twist**: We call it democracy when the state enfranchises its tools (emigrants) and disenfranchises its subjects (taxpaying residents). The theory is a retrofit. The settlement isn’t between ideas—it’s between power and its own contradictions.  

  Want the kicker? The EU model (local voting for intra-EU migrants) hints at a post-national possibility. But even there—national elections stay blood-and-soil. Some myths die hard.
