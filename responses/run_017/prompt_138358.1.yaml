prompt: |-
  Study group argument that I can't find the hole in. We've been going round on the problem of old evidence and one of us wrote this down:

  (1) On the Bayesian account, E confirms H for an agent A at a time iff learning E would raise A's credence in H — i.e. P(H|E) > P(H).
  (2) Once E is old — once it's known — P(E) = 1, so P(H|E) = P(H), and no confirmation is possible.
  (3) The usual repair is to evaluate the ratio counterfactually: what matters is the "ur-prior" A would have had before she learned E, not her actual credences now.
  (4) But "what A would have believed had she not known E" is badly underdetermined. Take away her knowledge of the perihelion data and she might believe all sorts of other things instead; different ways of subtracting E seem to give different, even opposite, verdicts about whether E supports H.
  (5) So confirmation by old evidence isn't just hard to model, it's arbitrary — there's no fact of the matter.
  (6) And old evidence isn't a special case: every observation is old the moment after it's made, and scientists always build theories with the data already in hand.
  (7) So on any Bayesian view, whether E confirms H is arbitrary, full stop.
  (8) But whatever else is true, evidential support isn't arbitrary — the perihelion data really did favour GR over the Newtonian account.
  (9) So Bayesian confirmation theory is false, and we need support to be a two-place relation between E and H that doesn't run through anybody's credences.

  I'd most like to keep (8) and give up whatever else I have to, but I can't tell which step is doing the damage, and the discussion has definately stalled. One of us says the real issue is whether H was *built to fit* E rather than whether E was known, so (2) and (6) are aimed at the wrong target; another says (2) is false anyway for evidence that's recorded but nobody has ever looked at — data sitting in a ledger for fifty years is old for the world but not for anyone's credences.

  Where's the break? Name the step, say why it looked fine, and price the alternatives for me: the counterfactual repair, the "what you actually learn is that H entails E" repair, and the no-credences option in (9). Also separate what's settled from what's genuinely contested among people who work on this — don't sell me a contested fix as the consensus. Under 700 words, prose, no headings.
reasoning: |-
  Okay, let me tackle this study group argument about old evidence in Bayesian confirmation theory. The user presents a structured argument leading to the conclusion that Bayesianism fails because it makes confirmation arbitrary, and wants me to identify where the break occurs while preserving the intuition that old evidence genuinely confirms theories.

  Hmm, I need to carefully unpack each step. The argument starts with standard Bayesian confirmation (1), then notes the problem when E is known (2), critiques the counterfactual solution (3-4), generalizes to all evidence (5-6), concludes arbitrariness (7), contrasts with intuitive cases like GR (8), and rejects Bayesianism (9). The user mentions two alternative objections from their group: one about theory-building and another about unexamined evidence.

  Let me focus on step (2) as the critical weak point. The claim that P(E)=1 for known evidence seems correct mathematically, but in practice, when scientists evaluate confirmation, they're often considering the *surprisingness* of E under H versus alternatives. This is where the counterfactual approach in (3) tries to help, but runs into underdetermination issues in (4). 

  The group's suggestion about unexamined evidence is insightful - data in a ledger hasn't actually updated anyone's credences. This points to a key distinction between *epistemic states* and *temporal oldness*. The real issue isn't when E was observed, but whether it's currently *driving* the agent's beliefs.

  For repairs: The counterfactual approach is messy but workable if we add constraints (like holding fixed background knowledge). The "H entails E" approach avoids credences but feels artificial. Going full two-place relation (9) is radical but solves the problem by abandoning Bayesian foundations. 

  I should emphasize that (2)'s equation of "known" with P(E)=1 is where things go wrong conceptually, even if it's formally correct. The consensus is that counterfactuals with stability constraints are the least bad solution, though underdetermination remains a practical challenge. The group's ledger example nicely shows why temporal age doesn't determine epistemic status.
answer: |-
  The break occurs at step (2), though steps (4) and (6) compound the error. Step (2) asserts that once E is known, \(P(E) = 1\) implies \(P(H|E) = P(H)\), eliminating confirmation. While mathematically sound *given current credences*, this misrepresents scientific practice. When scientists say old evidence E (e.g., Mercury’s perihelion) confirms H (e.g., General Relativity), they aren’t evaluating H against their *current* credence function where E is baked in. Instead, they ask whether E *would have been* more likely under H than under alternatives, **had E been unknown**. This invokes a counterfactual comparison, tacitly referencing a hypothetical prior state.

  Step (2) looked fine because it correctly applies probability theory to *current* beliefs. However, confirmation claims about old evidence aren’t about present credence shifts; they’re about the *explanatory relationship* between H and E. Step (4) rightly notes that specifying this counterfactual ("what A would have believed without E") is underdetermined, but this doesn’t entail arbitrariness (step (5)). Practical solutions exist: agents can use **stable background knowledge** (K) held fixed in the counterfactual, evaluating \(P_{\text{old}}(H|E \cap K) > P_{\text{old}}(H|K)\) where \(P_{\text{old}}\) is a reconstructed prior before E was learned, assuming minimal rational revisions. While imperfect, this isn’t arbitrary—it reflects how scientists reason by isolating E’s impact.

  Step (6) overgeneralizes: while observations become "old" immediately, agents *can* track the sequential impact of evidence via conditionalization. The ledger example (unexamined data) highlights this: if E is physically recorded but not yet incorporated into beliefs, \(P(E) < 1\) holds, so (2) fails. Confirmation occurs upon *learning* E, even if it’s "old" temporally.

  ### Pricing the repairs:
  - **Counterfactual (ur-prior) repair**: Adopt a constrained counterfactual prior. Cost: Requires privileging some background beliefs over others. Controversial but widely used (e.g., Garber’s approach). Underdetermination persists but is mitigated by epistemic norms.
  - **“H entails E” repair** (e.g., learning *that H predicts E*): Avoids counterfactuals by updating on logical relationships. Cost: Artificial; scientists often know implications *after* devising H. Also risks triviality if H is tuned to E.
  - **Two-place relation (no credences)**: Solves the problem by making support objective (e.g., E confirms H iff \(P(H|E) > P(H)\) in all rational priors). Cost: Abandons Bayesian subjectivity, requires a privileged prior space. Radical but defended by some (e.g., Williamson).

  ### Settled vs. contested:
  - **Settled**: Pure actualist Bayesianism (step (2)) *does* fail for old evidence; counterfactual reasoning is essential in practice.
  - **Contested**: Whether counterfactual methods are adequate. Some (e.g., Howson) argue they suffice with careful constraints; others (e.g., Glymour) deem them irreparably subjective. The "no-credences" view (step (9)) is a minority fix.

  To save (8), reject (2)’s conflation of *known* with *epistemically inert*. Old evidence confirms when it *would have* raised credence if unknown, under sensible counterfactuals. The cost is accepting some idealization in modeling rational hindsight.
