prompt: |-
  I am drawing up the specification before I read any further into accounts of imprecise credence — credence represented by a set of probability functions rather than a single one. Fix the purpose as follows: the theory is for an agent who has to act anyway on the basis of the imprecision, not merely to record it — a regulator setting a safety standard, or an engineer choosing between two designs — in a case where the disagreement among defensible probability models is itself the difficulty, and where the cost of error is badly asymmetric between the two directions in which the truth might lie.

  Write the desiderata: what a theory of rational imprecise credence has to deliver to count as adequate for that use. For each requirement give the case or consideration behind it, and mark it either non-negotiable or as the preference of one camp. I want the weight on the requirements and their motivations, not on scoring candidate views.

  Among the questions I want the list to settle:

  - the minimum of mere coherence — no sure loss, no combination of trades the agent would have accepted that guarantees a loss whichever way things go — and whether that minimum is anywhere near sufficient;
  - what the theory owes us about updating: whether it must say which members of the set get conditioned and when, and whether it may ever let incoming evidence widen the interval (the dilation phenomenon) or must never do so;
  - whether the theory must be able to learn from accumulating evidence — must the interval narrow toward precision, and on what schedule — or whether permanent, irreducible imprecision is a defensible stopping point;
  - a decision rule: when a choice is permitted or required given an interval, and whether such a rule can respect asymmetric error costs without degenerating into taking the midpoint and pretending one is precise;
  - two distinctions I have not seen drawn cleanly, which I want the list to respect: (i) imprecision that comes from thin or conflicting evidence, versus imprecision that comes from the hypothesis space itself being arbitrarily grained or badly defined; and (ii) imprecision about how confident to be, versus imprecision about which of several models to trust when all of them are empirically adequate so far. Say whether a single representational device — one convex set of probability functions — can carry both distinctions, or whether the theory needs extra structure on top of it.

  Then, briefly: if some subset of your requirements cannot be jointly satisfied, say which ones and what has to give — that is the part I most want to see. And name the single requirement that excludes the most candidates, including the candidate of staying a precise Bayesian with a sensitivity analysis bolted on afterward.

  Please write in American English, in prose organized around the requirements list; no bibliography or citations.
reasoning: |-
  Okay, let me tackle this user's complex request. They're designing specs for imprecise credence theory in high-stakes asymmetric decision contexts. The core challenge seems to be balancing theoretical purity with real-world applicability. 

  First, I need to unpack their five key questions: coherence sufficiency, updating rules, learning capacity, decision-making under asymmetry, and two crucial distinctions about imprecision sources. The user clearly wants these addressed through concrete requirements, not academic debates.

  The asymmetric cost aspect feels particularly vital here - this isn't just epistemology for its own sake. When regulators set safety standards or engineers choose designs, underestimating risks could be catastrophic. That explains their frustration with "midpoint pretending" in decision rules.

  Hmm, they're also pushing for something novel: separating evidential imprecision from structural imprecision (like poorly defined hypothesis spaces). And distinguishing confidence uncertainty from model selection uncertainty. Most literature treats these as homogeneous, but intuitively they're different. Can one convex set capture both? Probably not without added structure.

  For the requirements list, I'll start with non-negotiables: Asymmetric cost sensitivity feels mandatory for their use case, as does avoiding dilation disasters. The coherence-plus requirement is tricky - basic no-Dutch-book seems insufficient but how much stronger? Maybe demand that decisions respect interval boundaries when costs are extreme.

  Updating rules need careful handling. Must prevent dilation in safety contexts but allow it where evidence genuinely muddies the waters. The learning question is profound: if irreducible imprecision exists, can we justify that? Their regulators might need to act despite permanent uncertainty.

  The decision rule dilemma looms large. Common solutions like Γ-maximin often ignore cost asymmetry. Maybe demand a rule that can choose extreme interval bounds when consequences demand it. But how to formalize that without ad-hoc adjustments?

  Now the toughest part: conflicts. Asymmetric sensitivity likely clashes with dilation tolerance. If we forbid dilation in safety decisions but allow it elsewhere, the theory fractures. The convex set limitation also causes tension - adding structure might be unavoidable.

  The single biggest candidate-killer? Probably the asymmetric cost requirement. It torpedoes both precise Bayesians with sensitivity analyses (who collapse intervals to points) and symmetric imprecise models (that treat over/underestimation equally).

  This user knows exactly what they want from theory - rare philosophical clarity. Their focus on "what must give" suggests they anticipate tradeoffs. I'll structure requirements around their bullet points, using concrete cases to show why each matters.
answer: |-
  Here are the requirements for a theory of rational imprecise credence tailored to your purpose, organized by desideratum, with motivations, necessity, and implications:

  1.  **Requirement: Asymmetric Cost Sensitivity (Non-Negotiable)**
      *   **Case:** Regulator setting an exposure limit for a toxic chemical. Overestimation of risk (setting limit too low) incurs economic costs; underestimation (limit too high) causes irreversible health damage/deaths. The cost of the latter error vastly exceeds the former.
      *   **Desideratum:** The decision rule *must* be sensitive to the asymmetry in the cost of errors inherent in the choice. It cannot treat overconfidence and underconfidence symmetrically when consequences differ radically. The representation and rules must enable choices that systematically favor avoiding the catastrophic error direction, even if probabilistically "less likely" on average.
      *   **Excludes:** Theories relying solely on symmetric decision rules (e.g., maximizing expected utility using a single "representative" probability like the midpoint, Γ-maximin without further modification, simple dominance) or treating the interval endpoints symmetrically for decision purposes.

  2.  **Requirement: Coherence Plus: Avoid Practical Dutch Books (Non-Negotiable) & Resist Easy Money Exploits (Negotiable Preference)**
      *   **Case:** An engineer considers bids from two suppliers offering components with uncertain lifetimes. Bookmakers (or savvy competitors) could offer combinations of bets priced within the engineer's stated imprecise interval for each component's reliability that guarantee the bookmaker profit if the engineer accepts all.
      *   **Desideratum:** Mere avoidance of *sure loss* (strict Dutch Books) is the absolute minimum ("No Practical Dutch Books"). However, for high-stakes decisions, this is insufficient. The theory should ideally also make the agent resistant to being *easily exploited* ("Resist Easy Money"). An agent whose credal set is too permissive (e.g., extremely wide intervals without justification) is vulnerable to accepting trades that, while not guaranteeing loss, offer a high expected profit to a counterparty exploiting the imprecision. The required *degree* of resistance is a preference (some camps accept vulnerability as the price of imprecision, others demand stronger coherence like convexity or avoiding *all* weak Dutch Books).
      *   **Excludes:** Representations allowing blatantly irrational combinations of beliefs (violating basic coherence). The "Resist Easy Money" aspect excludes overly permissive sets without internal justification.

  3.  **Requirement: Controlled Updating: Dilation Forbidden in Asymmetric Cost Contexts (Non-Negotiable), Permitted Elsewhere (Negotiable Preference)**
      *   **Case:** (Forbidden) Regulator has prior imprecision on a chemical's risk. A complex, partially relevant animal study arrives. Conditioning *all* priors in the set dilates the risk estimate (interval widens). This is unacceptable if asymmetric costs demand decisive action based on *all available evidence* – dilation feels like evidence made us *less* certain when we need clarity to prevent disaster. (Permitted) An academic researcher studying a poorly defined phenomenon might see new data genuinely increase ambiguity about competing models.
      *   **Desideratum:** The theory *must* specify an updating rule (e.g., conditionalization for every function in the set, Jeffrey conditioning, etc.). Crucially, it *must not allow dilation* when updating in contexts defined by Requirement 1 (asymmetric costs demanding decisive action). Dilation undermines the core purpose of using evidence to reduce uncertainty for action. Outside such contexts, dilation *may* be a permissible consequence of genuinely ambiguous evidence, though some camps find it always irrational. The theory must clarify *when* and *how* updating occurs.

  4.  **Requirement: Learning Capacity: Evidence Must *Potentially* Drive Towards Precision (Non-Negotiable)**
      *   **Case:** Regulator initially has wide imprecision about a new technology's failure rate. After years of rigorous operational data from numerous deployments, the range of defensible probability models should narrow significantly, converging towards a precise (or much tighter) estimate reflecting the accumulating evidence. Permanent, irreducible imprecision despite overwhelming, unambiguous data suggests a flaw in the credal set representation or updating.
      *   **Desideratum:** The theory must allow that sufficiently strong, unambiguous evidence can force the credal set to contract, potentially to a single probability function. Irreducible imprecision is only defensible if rooted in persistent, genuine ambiguity in the evidence or fundamental structure of the hypothesis (see Requirement 6), *not* merely as an artifact of the initial representation or updating rule. Evidence should ideally *reduce* imprecision over time. A specific "schedule" is too strong; the *capacity* to learn is essential.

  5.  **Requirement: Actionable Decision Rule Respecting Imprecision and Asymmetry (Non-Negotiable)**
      *   **Case:** Engineer chooses between a cheaper design (slightly higher imprecise risk of catastrophic failure) and a more expensive one (lower imprecise risk). Asymmetric costs demand avoiding catastrophic failure at significant economic cost.
      *   **Desideratum:** The theory *must* provide a decision rule that: (a) Takes the *entire credal set* as input, not a summary statistic. (b) Respects the asymmetric costs (Requirement 1). (c) Permits decisions reflecting risk-aversion towards the catastrophic error (e.g., choosing based on the worst-case scenario within bounds, or heavily weighting pessimistic models). (d) Does *not* surreptitiously collapse imprecision into a precise value (like taking the midpoint) for the decision. The rule must justify choices *using the imprecision itself* under asymmetry.

  6.  **Requirement: Distinguish Evidential vs. Structural Imprecision (Needs Additional Structure)**
      *   **Case:** (Evidential) Thin/conflicting data on seismic risk at a specific site. (Structural) Defining the "failure" state of a complex socio-technical system involves arbitrary thresholds and ill-defined concepts.
      *   **Desideratum:** A single convex set *cannot* adequately distinguish these. Both manifest as interval width. The theory needs extra structure (e.g., labeling sources of imprecision, different types of sets, meta-credence over the set's composition) to differentiate uncertainty arising from *lack of data* (potentially reducible per Requirement 4) from uncertainty arising from the *subject matter itself* (possibly irreducible). This distinction matters for Requirements 3 (Updating - how does evidence affect structural imprecision?) and 4 (Learning - can structural imprecision be reduced?).

  7.  **Requirement: Distinguish Confidence Uncertainty vs. Model Selection Uncertainty (Needs Additional Structure)**
      *   **Case:** (Confidence Uncertainty) "I have data, but I'm unsure *how confidently* to extrapolate it." (Model Selection Uncertainty) "I have three empirically adequate physical models predicting different failure probabilities; I don't know which model is true."
      *   **Desideratum:** A single convex set *conflates* these. Both lead to a range of probability values. Confidence uncertainty might be addressed by sensitivity analysis or hierarchical models. Model selection uncertainty is fundamentally about ambiguity between distinct, fully specified world models. The theory needs extra structure (e.g., representing the set as arising from a set of distinct underlying models, or incorporating model plausibilities) to differentiate them. This impacts Requirement 5 (Decision Rule - should we average models or select one?), Requirement 3 (Updating - do we update each model, or update a prior over models?), and Requirement 4 (Learning - does evidence eliminate models or just refine confidence within one?).

  **Conflicts and Trade-offs:**

  *   **Requirement 1 (Asymmetric Costs) vs. Requirement 3 (Dilation Permissibility):** You *cannot* strictly forbid dilation in all contexts (as some theories do) *and* allow it where genuine ambiguity exists (e.g., structural imprecision). **What Gives:** Dilation *must* be forbidden in high-stakes asymmetric decision contexts (your core use case), but *may* be permitted in contexts of pure inquiry or with symmetrical costs. The theory needs context-sensitive updating rules or constraints.
  *   **Requirement 6/7 (Extra Structure) vs. Simplicity:** Representing the distinctions cleanly requires going beyond a simple convex set of probabilities. **What Gives:** The minimalist representation (just the convex set) must be abandoned to meet the descriptive needs of the distinctions. The theory needs richer structure (e.g., sets labeled by model source, meta-probabilities, hierarchical imprecision).
  *   **Requirement 4 (Learning Capacity) vs. Irreducible Structural Imprecision:** Genuine structural imprecision (Requirement 6) might be irreducible by evidence. **What Gives:** Requirement 4 demands learning is *possible*, not that it *always happens*. Irreducible imprecision is allowed, but *only* if justified by the structure of the problem itself, not by the theory's limitations. Evidence must still refine within structural bounds if possible.

  **The Single Biggest Candidate Excluder:**

  **Requirement 1: Asymmetric Cost Sensitivity.** This decisively excludes:

  1.  **Precise Bayesianism + Sensitivity Analysis:** The sensitivity analysis is post-hoc. The decision *always* collapses the imprecision into a single precise probability (usually chosen symmetrically, like the midpoint or expected probability over priors) for maximizing expected utility, ignoring the *shape* of the imprecision and asymmetric costs during the core decision.
  2.  **Symmetric Imprecise Decision Rules:** Rules like Γ-maximin (choose the action with the best worst-case outcome) or Interval Dominance treat the bounds symmetrically. They don't inherently prioritize avoiding errors in one direction over the other. Rules like Maximality or E-admissibility often fail to generate a decisive choice when needed under asymmetry. Candidate theories lacking a rule that *explicitly incorporates and prioritizes based on asymmetric error costs* fail this requirement. This requirement demands the imprecision itself directly informs a potentially asymmetric, decisive choice under severe consequences.
