  ## The Coldspring Clarion  
  OPINION | THIRTIETH ANNIVERSARY REFLECTIONS  

  **Thirty Years of Vigilance: Why Our Polymer Prudence Protects Coldspring**  
  *By Marlene Duff, Founding Chair, Office of Precautionary Review*

  Thirty years ago this month, the Coldspring Office of Precautionary Review (COPR) undertook its first significant action. Faced with the Water Department’s proposal to reline our aging wooden water mains with a novel synthetic polymer – promising enhanced durability and reduced leaks – we exercised our mandated duty. Based on emerging data, specifically a small but concerning study where elevated doses of the polymer’s precursor compound showed cellular anomalies in a rodent model, we enacted a precautionary hold. Today, as Coldspring experiences the predictable consequences of those original wooden mains succumbing to time – frequent breaches, disruptive repairs, and the inconvenience of boil-water advisories – I write not in apology, but in affirmation. Our stance remains correct, necessary, and indeed, more vital than ever.

  Some may point to the current state of our infrastructure as evidence of a mistake. They note that the polymer in question, AquaSeal-PX™, has since become commonplace in municipal systems nationwide without reported incident. This observation, however, fundamentally misunderstands the Precautionary Principle we are sworn to uphold. The absence of *reported* incidents involving AquaSeal-PX™ is not evidence of its *safety*. In fact, it aligns perfectly with the profile of a slow-acting, bioaccumulative threat. Thirty years without overt catastrophe is precisely the timeline one might expect for a substance inducing subtle, irreversible damage – damage that could manifest in future generations or under unforeseen environmental stressors. The latency period itself is a potential warning sign, not an exoneration.

  The core of our mandate is the reversal of the burden of proof. It is not for concerned citizens, or this Office, to *prove* that AquaSeal-PX™ causes harm. It was, and remains, for the proponents of its use to *disprove*, beyond any conceivable doubt, the potential for harm identified in that initial study. They have not met this burden. While proponents cite widespread adoption elsewhere, this constitutes mere popularity, not proof. Indeed, the very ban we imposed has prevented the large-scale, real-world trial within Coldspring’s unique ecosystem that might have provided definitive data one way or the other. This controlled absence of exposure data is a feature of our precautionary system, ensuring our citizens are not subjects in an uncontrolled experiment.

  Of course, a thoughtful observer might note that maintaining the *status quo* – leaving the decaying wooden mains in place – also carries risks. Burst pipes flood basements, disrupt traffic, and necessitate costly emergency interventions. Boil-water notices introduce their own potential for human error in compliance. This is the so-called "symmetry problem": both action (using the polymer) and inaction (maintaining the wood) carry potential threats. Our guiding protocol in such symmetrical cases is clear and prudent: **Where both proposed change and continued stasis present plausible threats, we default to maintaining the existing state of affairs that pre-dated the proposal.** This avoids the inherent danger of initiating a novel, untested intervention. The Water Department’s proposal in 1994 sought to *change* the system. Our hold preserved the pre-existing condition. To lift the ban *now* would be a new action, requiring its *own* full precautionary review against the potential threat of AquaSeal-PX™. The principle, rightly applied, creates a vital stability. It ensures we don’t leap from one potential hazard to another on a whim.

  I am aware of the critiques. Our esteemed retired high school chemistry teacher, Mr. Arlen Finch, often writes to the *Clarion*. Last week, he noted, "Marlene, your principle seems to forbid *everything*. If both doing something new *and* doing nothing carry risks, and you default to doing nothing, then nothing ever changes, even when doing nothing becomes demonstrably worse! It paralyzes progress." Mr. Finch is characteristically perceptive. He correctly identifies that a strict application of the Precautionary Principle can indeed lead to such analytical stasis. However, he mistakes this for a flaw, rather than recognizing its profound protective wisdom. Yes, the principle can prescribe maintaining a current state *even if that state deteriorates*, because the alternative – a novel intervention – introduces *unknown* and potentially *catastrophic* risks that outweigh the *known* deterioration. Paralysis, in this context, is the safest possible posture.

  Furthermore, this anniversary is not just about reflection, but about reaffirming and expanding our commitment. Therefore, I announce today that COPR will formally expand its scope. While our initial mandate focused on reviewing *new* proposals, we recognize that ongoing activities deserve the same rigorous scrutiny for potential latent threats. Just because something has been done for years does not mean it is safe; it may simply mean the harm has not yet revealed itself. We will begin systematically reviewing existing town practices and infrastructure – starting, naturally, with a comprehensive reassessment of the current water delivery system *as it exists* (wooden mains and all), against any newly identified potential hazards inherent in decaying organic matter or emergency repair protocols.

  Some might ask: Doesn’t the Precautionary Principle itself demand a precautionary review of *creating* a powerful Office like COPR? Doesn’t our *own* activity carry the risk of stifling essential services or imposing unintended burdens? This is a sophisticated point, touching on self-application. However, our founding charter wisely incorporates a grandfather clause for the establishment of the Office itself and its initial, pre-existing review procedures. Instituting a *new* precautionary review on the *adoption of precautionary reviews* would create an infinite regress, preventing any protective body from ever forming. Such a moratorium could never be adopted, as its proponents could never *disprove* the potential harm of *not* having precautionary reviews! Therefore, we operate under the necessary and prudent exemption that allows us to safeguard Coldspring from *other* novel threats, while our own essential function remains appropriately shielded from paralyzing self-doubt.

  So, as we mark thirty years, let the burst pipes serve as a reminder: they are the known consequence of a known system. They are tangible, manageable, and finite. The potential harm we forestalled by rejecting AquaSeal-PX™ remains unknown, potentially vast, and irreversible. Our vigilance has spared Coldspring from that shadow. We sleep soundly knowing we have erred, always, on the side of absolute caution. Here’s to thirty more years of steadfast protection through prudent inaction. The unknown dangers thank you. Coldspring is safer for it.
