  (d) Precedence numbering tries formal conflict resolution but risks infinite loops in self-referential cases. Cycle-detection is crucial but computationally tricky.

  (e) Temporal quarantine creates a buffer period for amendments. This cooling-off period prevents racing conditions but doesn't solve all conflicts.

  (f) Snapshot composition freezes the rule context for evaluation. This determinism avoids ambiguity but can create "zombie rules" during transitions.

  For tiering:
