answer: |-
  Here is the sestina for Mira Solberg, spoken into the quiet of the archive:

  **Ledger of Dust**

  This room holds everything the city shed:
  Old deeds, complaints, the census takers’ **sort**;
  The ink is fading on the brittle **card**.
  The furnace ticks, exhaling steady **heat**.
  I know each box, each number in the **ledger**,
  The silent weight of things we never **lose**.

  Thirty-one years. What did I think to **lose**
  By keeping safe what others simply **shed**?
  My life is written in this endless **ledger**,
  The careful lines of every kind and **sort**.
  It costs the city nothing but the **heat**
  To hold the proof on this thin index **card**.

  The demon knows the value of a **card**,
  The mark that tells him which fast atom’s **lose**
  To catch. He builds a wall without a **heat**,
  A dam against the flow time wants to **shed**.
  His clever fingers make the perfect **sort**,
  His triumph written in a ghostly **ledger**.

  But engines run in circles. See the **ledger**?
  The cost comes due. To flip one tiny **card**
  Back to its blankness (ready for the **sort**
  Again), the heat that must be paid to **lose**
  The mark he made – the waste he can’t just **shed** –
  Is written on the air as sudden **heat**.

  This building breathes. I feel the steady **heat**
  Rise from the grates. It feeds the silent **ledger**,
  The cost incurred for all we cannot **shed**.
  My hand rests on a fragile, yellowed **card**.
  What good is keeping what you never **lose**
  If keeping means you burn? This endless **sort**

  Demands its fuel. The demon’s perfect **sort**
  Works only if he pays the final **heat**.
  The order built requires that we **lose**
  The memory’s trace within the **ledger**.
  To run the cycle, blank the waiting **card**,
  He pays the debt that cannot be **shed**.

  The quiet **heat** confirms what I must **lose**:
  This **ledger**’s warmth, the cost of **card**s we **shed**,
  Is payment for a **sort** that never ends.

  ---

  **Physics Notes & Confidence:**

  I am highly confident the core thermodynamic metaphor tracks accurately. The poem centers on Landauer's principle: erasing one bit of information *must* dissipate a minimum amount of heat (k_B T ln 2) into the environment. This is the fundamental cost that prevents Maxwell's demon from violating the Second Law. The demon's sorting genuinely creates order (separates hot/cold molecules), but to reset its memory (the "card" or "mark") to its initial, blank state for the *next* cycle, it *must* expel heat. This heat dissipation is the price paid for the temporary order created during the sorting phase.

  *   **The Cost at Erasure:** The poem leans decisively on the interpretation that the *critical, unavoidable cost falls at erasure*. This is the widely accepted resolution grounded in Landauer's principle. While the *act* of measurement *can* be done reversibly (without inherent thermodynamic cost), the demon *must* reset its memory to operate cyclically. It's this reset/erasure that is irreversible and dissipates heat. Lines like "To flip one tiny card / Back to its blankness... the heat that must be paid" and "To run the cycle, blank the waiting card, / He pays the debt" directly state this. The "payment" is explicitly linked to erasure ("blank the card").
  *   **Metaphor Tracking:** The metaphor is strongest where the demon's action parallels Mira's:
      *   Sorting ("sort") creates order (separated molecules/archival order).
      *   The record ("card," "ledger," "mark") is the stored information.
      *   The cyclical nature ("engines run in circles") necessitates resetting the memory device.
      *   Erasure ("blankness," "lose the memory's trace," "blank the card") is the irreversible step requiring heat dissipation ("waste he can’t just shed," "written on the air as sudden heat," "payment," "cost incurred").
  *   **Potential Weakness:** The one point where the metaphor *might* be slightly strained is in the line "The cost comes due." In the strict physics, the heat is dissipated *during* erasure to enable the *next* sorting cycle. It's not a debt accrued during sorting and paid later; erasure *is* the payment event. The line could be misread as implying the cost is separate from the erasure act itself. However, the subsequent lines ("To flip one tiny card / Back to its blankness... the heat that must be paid") immediately clarify that the "cost due" *is* the erasure cost. The phrasing "cost comes due" was chosen for its dramatic weight and Mira's dawning realization, linking the abstract principle to the tangible heat she feels now ("This building breathes. I feel the steady heat").
  *   **Accessibility:** The poem avoids technical terms ("entropy," "bit," "Landauer," "k_B T"). It relies on the intuitive grasp of a demon sorting, needing a record, and having to clear that record to start over, with heat being generated when clearing it. The archive setting provides concrete parallels (card, ledger, sort, shed, heat, lose) that make the abstract concept graspable through Mira's lived experience.

  **Sestina Mechanics:**

  I adhered strictly to the rotation pattern you specified: abcdef / faebdc / cfdabe / ecbfad / deacfb / bdfeca. The envoy uses all six end-words: "The quiet **heat** (d) confirms what I must **lose** (f): / This **ledger**’s (e) warmth, the cost of **card**s (c) we **shed** (a), / Is payment for a **sort** (b) that never ends."

  The six end-words chosen are:
  1.  **shed** (verb: discard, get rid of; also suggestive of skin/surface loss) - Represents the act of discarding/deaccessioning the archive opposes, and what the demon *doesn't* do with information.
  2.  **sort** (noun/verb: the act of classification, ordering) - The core action of both Mira and the demon.
  3.  **card** (noun: index card, the physical record) - The archive-specific "memory" device, analogous to the demon's register.
  4.  **heat** (noun: thermal energy, the cost) - The thermodynamic price paid.
  5.  **ledger** (noun: the book of accounts, the master record) - The archive-specific "memory" storage, the system tracking everything.
  6.  **lose** (verb: to cease to have, to part with, to fail to keep) - The opposite of Mira's principle, and the necessary act of erasure ("lose the memory's trace").
