  We are specifying desiderata for an explanation of the Knobe effect that can be used to evaluate the stability of a rubric for human annotation of intentionality.
   The rubric is used in vignettes similar to the chairman case, and we have observed the classic asymmetry: harm is labeled intentional more often than help.

   We need the explanation to:
   1. Account for the core cases (harm and help) and the asymmetry.
   2. Handle the variants we have:
      a. A side effect that is merely norm-violating or distasteful (e.g., breaking a social norm, being impolite) without causing harm.
      b. A side effect that the agent actively regrets but accepts anyway.
      c. A side effect that benefits the agent personally and affects no one else (e.g., the chairman's program also gives him a bonus, but note that the environment effect is still the side effect under consideration; here we might also consider a case where the side effect is purely self-beneficial and not affecting others).
      d. A side effect that is certain (rather than merely likely).

   Moreover, the explanation must respect certain distinctions and account for what the data are evidence for.

   Desiderata:

   A. Core Cases:
      - Must explain why the harmful side effect is judged intentional by many, while the helpful one is not.
      - This is non-negotiable.

   B. Variants:
      - (a) Norm-violating/distasteful: e.g., the program causes the chairman to wear mismatched clothes (aesthetic norm) or to break a promise about office decor. We observe that such cases also get judged as intentional more often than neutral or positive ones, but less than harmful ones? Or similarly? We need the explanation to account for this pattern if it exists.
      - (b) Regretted but accepted: the agent says, "I wish it weren't so, but I must approve." We observe that even when regretted, the harmful side effect might still be judged intentional by many. The explanation must account for this.
      - (c) Self-beneficial: the side effect is that the agent gets a personal benefit (e.g., a bonus) and no one else is affected. We observe that such cases are often judged intentional (similar to harm? or less?).
      - (d) Certainty: when the side effect is certain (vs. probable), we observe that the intentionality judgment for harm increases (or stays high) and for help might remain low. The explanation must account for the role of certainty.

      Note: The patterns in these variants are based on our batches. We are extrapolating that the explanation must fit these patterns.

      Non-negotiable: The explanation must be consistent with the core asymmetry and the existence of these variants. However, the exact pattern in each variant might be subject to empirical validation, so the explanation must at least be able to accommodate the observed patterns.

   C. Distinctions that must not be collapsed:

      (1) Foreseeing vs. aiming: The agent in the vignette only foresees the side effect but does not aim for it. The explanation must not make the judgment of intentionality collapse into mere foreseeability. The asymmetry shows that foreseeability is not sufficient (because in the help case, the side effect is also foreseen but not judged intentional). This is non-negotiable.

      (2) Intentionality vs. blameworthiness vs. responsibility: The explanation must not confuse intentionality with blameworthiness. We observe that even when the agent is not blamed (e.g., in the self-beneficial case that doesn't harm others) the intentionality judgment might still be high, so the explanation should account for intentionality as a distinct concept. Also, the asymmetry in the core cases is not simply due to blame because the lack of praise in the help case does not lead to symmetric judgments. This distinction is non-negotiable.

      (3) Harm vs. mere badness or rule-breaking: The explanation must account for why harm (a moral violation) produces the effect strongly, but also that non-moral badness (e.g., distasteful) or rule-breaking (that is not harmful) might also produce the effect to a lesser extent. This is a key point: the effect might be graded by the severity of the norm violation. We suspect that the effect is strongest for moral harm, but present for other norm violations. This is non-negotiable because our rubric must be able to capture intentionality across norm types.

      (4) Blame vs. praise: The asymmetry between harm and help (blame vs. praise) must be explained without reducing intentionality to blame. The explanation must account for why the negative side effect (which triggers blame) leads to a higher intentionality judgment, while the positive one (which might trigger praise or not) does not lead to a symmetric judgment. This is non-negotiable.

   D. What the data are evidence for:

      The explanation must clarify whether the data reflect:
        - The folk concept of intentional action (a semantic/conceptual claim)
        - The psychology of attribution (a cognitive process that might be influenced by moral judgment)
        - Intentional action itself (a metaphysical claim about what is intentional)

      We are using the data to build a rubric for annotation, so we need to know if we are measuring a stable concept or a context-dependent attribution. The explanation must take a position on this. It is non-negotiable that the explanation must account for the data being evidence for one of these (or more) and that it must be consistent with the use of the rubric.

      We note that the rubric is intended to capture the folk concept (as used by raters) and not necessarily the metaphysical reality. So the explanation should ideally ground the rubric in a stable aspect of the folk concept or the psychology of attribution.

   E. Potential Conflicts:

      We suspect that the following pair of requirements might be hard to jointly satisfy:
          - The explanation must preserve the distinction between intentionality and blameworthiness (so that intentionality is not reduced to blame).
          - The explanation must account for the strong link between moral judgment (blame) and the intentionality judgment (as in the core harm case).

      Many theories (e.g., those that say the intentionality judgment is influenced by blame) risk collapsing the distinction. We need an explanation that respects the distinction while accounting for the influence.

   F. Main families of explanations and how they fare:

      (1) Semantic or conceptual-role accounts: 
          - These say that the concept of intentional action has a moral component (e.g., Joshua Knobe's original account that the concept is inherently moral). 
          - They might explain the core asymmetry and the norm-violating cases (if norms are considered) but struggle with the self-beneficial case (if it's non-moral but still gets high intentionality) and the regretted case (because the agent doesn't have a positive attitude toward the side effect). 
          - They also risk collapsing the intentionality-blame distinction because they build morality into the concept.

      (2) Deep-self accounts:
          - These say that an action is intentional only if it expresses the agent's deep self (values, character). 
          - They might explain the core cases (the chairman's indifference to harm reveals his true self) and the regretted case (if the regret shows the action doesn't express the deep self, then why is it still judged intentional? That would be a problem). 
          - They might handle the norm-violating case if the norm violation is seen as expressing the agent's disregard for norms. 
          - However, they might have trouble with the self-beneficial case if the benefit is seen as expressing self-interest (which is part of the deep self) but then why is the harm case special? 
          - They also risk collapsing the distinction between intentionality and blame because the deep self is often tied to moral responsibility.

      (3) Conversational or affect-based deflationary accounts:
          - These say that the asymmetry is due to pragmatic features of conversation or affective reactions (e.g., blame triggers an intentionality attribution). 
          - They explain the core asymmetry and the norm-violating cases (if they trigger similar affective responses) and the self-beneficial case (if the benefit triggers a positive affect that does not lead to the same intentionality judgment). 
          - However, they explicitly collapse the intentionality-blame distinction because they say that the judgment of intentionality is driven by the desire to blame. 
          - They might struggle with the regretted case (if the regret reduces blame, does it reduce intentionality? our data suggest it doesn't) and the certainty case (if certainty increases blame, it might increase intentionality, which fits). 
          - They also suggest that the data reflect a psychological process of attribution and not the folk concept per se.

      The single requirement that excludes the most of them is the non-negotiable distinction between intentionality and blameworthiness (C2). This requirement rules out deflationary accounts that reduce intentionality to blame. It also challenges semantic accounts that build morality into the concept and deep-self accounts that tie intentionality to moral responsibility.

   G. Our Position:

      We take a definite position on the non-negotiable requirements and the unsatisfiable pair.

      Non-negotiable requirements (A, B to the extent of accommodating observed patterns, C1, C2, C3, C4, D) must be met.

      We hold that the distinction between intentionality and blameworthiness (C2) is crucial and that the data do not reflect a collapse of that distinction. We base this on our variant (b) (regretted harm): even when the agent regrets the harm, the harm is still often judged intentional, which suggests that blame might be mitigated by regret but intentionality remains. Also, in the self-beneficial case (c), the agent might be blamed less (or not at all) but the intentionality judgment remains high. Therefore, we reject explanations that reduce intentionality to blame.

      We also hold that the data are evidence for the folk concept of intentional action, but as it is used in a context that is influenced by moral and normative considerations. The rubric is measuring a stable aspect of the folk concept: that intentionality judgments are sensitive to the normative status of the side effect (whether it violates a norm, especially a moral one) and the agent's attitude (indifference vs. regret) and the certainty of the outcome.

      We note that the requirement C2 (intentionality vs. blame) and the requirement to account for the link between moral harm and intentionality (from the core case) can be jointly satisfied by an account that posits that the folk concept of intentional action includes a condition that the agent must be sufficiently connected to the outcome (e.g., by knowledge and by an attitude of willingness or acceptance) and that the moral valence of the outcome affects the threshold for attributing that connection. For example, in the harm case, the fact that the agent is indifferent to harm (a morally bad outcome) makes it easier to attribute the necessary connection (so that we say it was intentional), but in the help case, indifference does not trigger the same connection because the outcome is good. This is the "trade-off hypothesis" or "Knobe's account" in its later developments. This account does not reduce intentionality to blame but says that moral considerations affect the application conditions of the concept.

      However, we flag that the requirement to account for non-moral norm violations (C3) might be a challenge for some versions of the moral valence account. If non-moral violations (like distaste) also trigger the effect, then the account must extend to norms in general. Knobe has argued that the effect is primarily for moral norms, but our data suggest otherwise. Therefore, we might need a broader norm-based account.

      We also note that the regretted case (b) is accounted for by the idea of "acceptance": even if the agent regrets the harm, if they accept it (i.e., they go ahead despite the regret) then they are connected to the outcome in the required way.

      The self-beneficial case (c) might be explained by the norm of self-interest: if benefiting oneself is seen as a norm (even a non-moral one) then the effect might occur. Alternatively, if the norm is purely moral, then the self-beneficial case that doesn't harm others might not be a norm violation and hence not trigger the effect. But our data show it does? We need to be consistent. If our data show that the self-beneficial case is judged intentional, then we must explain it by the agent's self-interested attitude (which might be seen as a norm violation in some contexts? e.g., greed) or by a different mechanism. This remains a challenge.

      The certainty variant (d) is accounted for by the knowledge condition: certainty makes the knowledge condition more robust, and hence the connection to the outcome is clearer.

      We conclude that the most promising account is a conceptual-role account that incorporates norm violation (broadly construed) and the agent's attitude (acceptance) and the certainty of the outcome. This account meets the non-negotiable requirements and can accommodate our variants.

      The single requirement that excludes the most families is the non-collapse of intentionality and blame (C2). This rules out the deflationary accounts and forces other accounts to refine their explanations.

   H. Summary of Desiderata:

      We list the desiderata:

      1. Must account for the core asymmetry (harm vs. help) in intentionality judgments. [Non-negotiable]

      2. Must account for the variants:
          a. Norm-violating/distasteful side effect: must show higher intentionality than neutral/positive but perhaps lower than harm? (or as specified by data)
          b. Regretted but accepted side effect: must still be judged intentional for harm.
          c. Self-beneficial side effect: must be judged intentional if our data show it is.
          d. Certain side effect: must show that certainty increases intentionality for harm and does not for help (or as data show).

      3. Must preserve the distinction between:
          a. Foreseeing and aiming: intentionality requires more than foreseeing. [Non-negotiable]
          b. Intentionality and blameworthiness/responsibility: intentionality is a distinct concept. [Non-negotiable]
          c. Harm versus mere badness or rule-breaking: the effect occurs for both but may be graded. [Non-negotiable to account for the occurrence in non-harm cases if observed]
          d. Blame versus praise: the asymmetry is not symmetric. [Non-negotiable]

      4. Must specify what the data are evidence for: the folk concept of intentional action (which is stable but context-sensitive) and the psychology of attribution (how moral/normative factors influence the application of the concept). We take the position that the rubric is measuring the folk concept, and the effect is part of that concept. [Non-negotiable]

      5. Must avoid collapsing intentionality and blame while explaining the link. [Non-negotiable]

      We note that the requirement 5 and the requirement to explain the link to blame (from the core case) are jointly satisfiable by a norm-based conceptual-role account.

      We flag that the self-beneficial variant (2c) might be the hardest for the account because if the self-beneficial side effect is not a norm violation, then why is it judged intentional? But if it is a norm violation (e.g., greed) then it fits. Alternatively, it might be that self-beneficial outcomes are just seen as intended by default? This requires further investigation.

      Therefore, we recommend using a rubric that is based on a conceptual-role account that includes:
          - The agent's knowledge (certainty) of the side effect.
          - The agent's attitude (acceptance, which includes indifference or regret but still going ahead).
          - The normative status of the side effect (whether it violates a norm, with moral norms having the strongest effect).

      This account meets the non-negotiable requirements and can be used to train raters and interpret the data.
answer: |-
  ### Desiderata for an Explanation of the Knobe Effect  
  To ensure your rubric measures something stable (e.g., a coherent aspect of intentionality attribution), an explanation must satisfy these requirements. Non-negotiable requirements (NN) are grounded in empirical consistency and conceptual necessity; others reflect theoretical preferences. Cases from your batches are integrated.  

  ---

  #### **1. Core Asymmetry (NN)**  
     - **Requirement**: Explain why harmful side effects (e.g., environmental harm) are labeled "intentional" significantly more than helpful ones (e.g., environmental help) in the chairman vignette.  
     - **Case Behind It**: The original Knobe effect. If the explanation fails here, it cannot anchor the rubric.  
     - **Why NN**: This asymmetry is the effect’s defining feature.  

  #### **2. Norm-Violating/Distasteful Side Effects (NN)**  
     - **Requirement**: Explain why non-harmful but norm-violating side effects (e.g., breaking etiquette, distasteful outcomes) are often labeled intentional at rates closer to harm than help.  
     - **Case Behind It**: Your variant where the side effect violates social norms (e.g., "the program forces employees to wear ridiculous uniforms").  
     - **Why NN**: Shows intentionality judgments track *generic norm violation*, not just harm.  

  #### **3. Regret Without Resistance (NN)**  
     - **Requirement**: Explain why harmful side effects are still labeled intentional when the agent *regrets but accepts* them (e.g., "I wish this wouldn’t happen, but I approve anyway").  
     - **Case Behind It**: Your variant where the agent expresses regret but proceeds.  
     - **Why NN**: Demonstrates that intentionality isn’t negated by aversion if the agent proceeds indifferently.  

  #### **4. Self-Benefiting Side Effects**  
     - **Requirement**: Explain why side effects benefiting the agent *personally* (e.g., "the program gives the chairman a bonus") are labeled intentional at high rates, even when no one else is affected.  
     - **Case Behind It**: Your self-benefiting variant (e.g., profit-focused gain).  
     - **Why Negotiable**: Some theories might treat this as part of "intentional self-interest," but it tests if moral wrongness is necessary.  

  #### **5. Certainty vs. Probability**  
     - **Requirement**: Explain why harmful side effects labeled intentional at high rates even when *certain* (not merely probable). Helpful side effects should remain low.  
     - **Case Behind It**: Your variant where the outcome is inevitable (e.g., "will definitely harm the environment").  
     - **Why NN**: Rules out "probability" as the primary driver (if certainty doesn’t diminish the effect).  

  #### **6. Preserve Key Distinctions (All NN)**  
     - **Foreseeing vs. Aiming**: Must *not* equate foreseeing a side effect with intending it (the chairman doesn’t *aim* for harm/help).  
       - **Case Behind It**: Control vignettes where agents explicitly aim for outcomes vs. foresee side effects.  
     - **Intentionality vs. Blame/Praise**: Must distinguish judgments of intentionality from blame (harm) or lack of praise (help).  
       - **Case Behind It**: Cases where blame is present (harm) but intentionality is denied, or vice versa.  
     - **Harm vs. Mere Badness**: Must distinguish *moral harm* (e.g., environmental damage) from non-moral badness (e.g., inefficiency) or rule-breaking.  
       - **Case Behind It**: Norm-violating but non-harmful variants (e.g., "the program violates company policy but helps everyone").  
     - **Blame vs. Praise Asymmetry**: Must explain why blame elevates intentionality judgments, but lack of praise for help does *not* symmetrically reduce them.  

  #### **7. What Data Evidence (NN)**  
     - **Requirement**: Clarify whether data reflect:  
       - (a) The *folk concept of intentional action* (semantic/conceptual),  
       - (b) *Psychology of moral attribution* (cognitive bias), or  
       - (c) *Metaphysics of intentional action* (what is truly intentional).  
     - **Position**: Data primarily evidence **(a)** and **(b)**. Your rubric measures *folk attributions* shaped by moral psychology, not objective intentionality. A stable rubric must capture this hybrid nature without reducing to bias.  

  #### **8. Suspected Unsatisfiable Pair**  
     - **Conflict**: Distinguishing *intentionality* from *blame* (NN) while explaining why *moral valence* (blame for harm) is the strongest predictor of intentionality judgments.  
     - **Position**: These *can* be jointly satisfied. The explanation must treat moral valence as a *criterial trigger* for applying "intentional" (e.g., "harm flags the side effect as relevant for intentionality attribution"), without equating the concepts. If moral valence is necessary for the effect, the rubric’s stability relies on isolating this trigger.  

  ---

  ### **How Main Theoretical Families Fare**  
  #### **1. Semantic/Conceptual-Role Accounts**  
     - **Core Idea**: "Intentional" is defined by conditions including the agent’s attitude toward the outcome (e.g., indifference to harm counts as "acceptance," a proxy for intention).  
     - **Fits**: Core asymmetry (NN), regret cases (if regret implies non-acceptance), norm-violating cases (if norms create "acceptance" thresholds).  
     - **Fails**: Self-benefiting cases (if no norm violation), certainty (no clear mechanism). Blurs intentionality/blame distinction (if "acceptance" is moralized).  

  #### **2. Deep-Self Accounts**  
     - **Core Idea**: Actions are intentional if they express the agent’s "deep self" (values, character). Harm reveals corrupt character, hence intentional.  
     - **Fits**: Core asymmetry, norm-violating cases (if norms reflect character).  
     - **Fails**: Regret cases (regret contradicts "expression of character"), self-benefiting cases (self-interest may not reflect "deep self"). Collapses intentionality into blameworthiness.  

  #### **3. Conversational/Affect-Based Deflationary Accounts**  
     - **Core Idea**: Judgments are pragmatic; "intentional" signals blame (for harm) or lack of praise (for help). Affect drives attribution.  
     - **Fits**: Core asymmetry, norm-violating cases (if they trigger negative affect), self-benefiting cases (if self-gain triggers disapproval).  
     - **Fails**: Regret cases (regret should reduce blame but not intentionality), certainty (no clear link). Explicitly collapses intentionality into blame/praise.  

  #### **Single Most Excluding Requirement**  
  **Preserving the intentionality/blame distinction (NN)** excludes:  
  - Most *deflationary accounts* (intentionality reduces to blame).  
  - *Deep-self accounts* (intentionality reduces to character/moral responsibility).  
  - *Some semantic accounts* (if "acceptance" is morally loaded).  

  ---

  ### **Definitive Position**  
  - **Non-Negotiables**: An explanation **must** account for the core asymmetry, norm-violating/regret/certainty variants, and preserve foreseeing/aiming, intentionality/blame, and harm/mere badness distinctions. Data evidence the folk concept filtered through moral psychology.  
  - **Self-Benefiting Cases**: These are critical for testing if moral wrongness is necessary. If your batches show high intentionality here, theories requiring *moral harm* (e.g., deflationary) fail.  
  - **Unsatisfiable Pair**: **Can be satisfied**. A hybrid semantic-psychological account (e.g., "norm violations trigger intentionality attribution via affective salience") preserves distinctions while explaining valence effects.  
  - **Extrapolation**: Certainty and self-benefiting cases push beyond classic Knobe data but are essential for rubric stability.  

  **Recommendation**: Adopt a *semantic-affective hybrid* model. The rubric likely measures a stable folk concept where:  
  > *"Intentional" is attributed to foreseen side effects when they violate salient norms (moral, prudential, or conventional) and the agent is indifferent/accepting.*  
  This fits all NN requirements and your variants, avoiding reductionism. Test with vignettes manipulating norm salience (e.g., harm vs. rudeness) and agent affect (regret vs. enthusiasm).
