prompt: |-
  I'm a high school senior writing an extended research paper on assisted dying — specifically on what the law should permit when a competent adult asks a doctor to prescribe or administer a drug that will end their life. My teacher's main criticism of my drafts is that I argue case by case: I produce an example, show that some view I dislike handles it badly, and declare victory. She wants me to say first what any adequate view would have to be able to do, and only then test views against that. So that is what I am asking you for: the specification, not the verdict.

  The purpose the view has to serve: it should be good enough to guide an actual legal rule in a country with decent palliative care but very uneven social support, where doctors are fallible and overworked, where some patients are poor or isolated, and where some depend on relatives for daily care. If a view is only adequate for ideal institutions or ideal families, mark that as a limitation instead of letting it slide in unnoticed.

  What I would like from you:

  1. The list of requirements a view has to meet, each with the case or consideration behind it, so I can see why it belongs on the list rather than just take it on faith.
  2. For each requirement, whether it is non-negotiable, a preference of one camp, or genuinely negotiable — and please tell me plainly if any of the things people demand in this debate are really just the prejudices of one side dressed up as standards.
  3. The pairs of requirements that I suspect cannot be jointly satisfied, with the argument for why not. If the list turns out to be unsatisfiable as a whole, tell me which requirement you would drop and what that costs.
  4. Which single requirement does the most work in ruling out popular positions.

  The cases I think a view has to handle — please use them, correct them, or replace them with sharper versions, and add any that are missing:

  - The request that is partly socially caused: a young person with a severe disability, competent and stable in what she says over many months, whose suffering is real but is largely produced by inadequate care funding, inaccessible housing, and isolation. The same state that underfunded her support is being asked to authorise her death. I do not know whether the right requirement is that the view must handle this at all, or that it must say something specific about it: I keep finding that views which appeal only to autonomy have nothing to say, and views that appeal only to injustice end up telling her she is not really choosing.
  - The deadline case: someone whose suffering is unbearable now but who, on the best available evidence, would probably be glad in two years that the request was refused. Whatever the view says here has to confront the fact that we routinely let competent people take large risks of death for reasons we think unwise, and sometimes refuse them things for their own future good.
  - The cases we already permit: refusing life-saving treatment, having treatment withdrawn, deep sedation at the end of life, and high-dose pain relief given foreseeably but not intentionally to hasten death. Any view must deal with these, and I think it fails if the only difference it can point to is who physically performs the last act.
  - The professional-role case: why a doctor, and what follows if no doctor will participate. Is the appeal to medicine's internal norms doing real work, or is it gatekeeping?
  - The scope case: someone who clearly stated years ago that she wanted assistance if she ever reached advanced dementia, and now cannot reaffirm it. Is covering or not covering this a legitimate choice of scope, or is a view incomplete without an answer?
  - The expressive case: whatever rule we adopt is also a message to people whose lives resemble the lives being ended. I am unsure whether being required to handle this is a real desideratum or a political one.
  - The administrability case: if the test asks whether suffering is unbearable and beyond improvement, someone has to decide, under uncertainty, with an error rate. I want to know which direction the burden of proof should fall and whether any view can avoid this problem rather than just relocate it.

  Finally, only in the last few lines, score the four positions I keep meeting — an appeal to the sanctity of life, an appeal to autonomy, an appeal to the relief of suffering, and an appeal to the integrity of medicine — against the requirements you marked non-negotiable. Keep that part short; the list and its motivating cases are the part I care about. Please do not give me sources, reading lists, or citations, and please do not just restate the autonomy-versus-sanctity-of-life debate, which I have already read plenty of.
reasoning: |-
  Okay, the user is a high school senior working on an extended research paper about assisted dying laws. They need help structuring their argument based on their teacher's feedback. The teacher wants them to establish criteria for evaluating positions before testing them, rather than just refuting views case by case.

  The user has provided several specific cases they want addressed: socially-caused suffering, temporary unbearable suffering, existing end-of-life practices, medical professional roles, advance directives, societal messages, and administrative feasibility. They're clearly grappling with real-world complexities like systemic injustice and practical implementation challenges.

  I need to develop a framework of requirements that any viable position on assisted dying must satisfy. These requirements should be grounded in practical realities rather than idealized scenarios. The framework should acknowledge trade-offs between competing values and identify which requirements are essential versus negotiable.

  For the socially-caused suffering case, the key requirement is distinguishing between personal suffering and systemic injustice. This highlights how purely autonomy-based views might overlook social determinants, while purely injustice-focused views could invalidate genuine suffering. The requirement must demand that views explicitly address this tension.

  The temporary suffering case reveals a conflict between respecting current autonomy and protecting future interests. This requires positions to articulate how they weigh present versus future wellbeing, especially since we allow other high-risk decisions. The requirement should force views to confront this asymmetry in how society treats different life-ending decisions.

  Existing end-of-life practices present a consistency challenge. Any viable position must explain why some life-shortening acts are permitted while assisted dying might be forbidden, without relying on arbitrary distinctions like who administers the final act. This requirement tests for logical coherence across similar scenarios.

  The professional role requirement examines whether medical involvement is essential or merely convenient. This probes whether positions are grounded in practical necessity or unexamined tradition. The requirement should make views defend their stance on who qualifies as an appropriate provider.

  Advance directives raise questions about personal identity over time. The requirement should demand that positions explain how they handle identity continuity concerns without defaulting to biological preservation at all costs.

  The expressive function requirement acknowledges law's symbolic power. Views must consider how policies affect vulnerable groups beyond just regulating access. This tests whether positions account for broader societal impacts.

  Administrative feasibility is crucial for real-world implementation. The requirement must address how views handle uncertainty and error distribution, particularly regarding suffering assessments. This exposes practical weaknesses in theoretically coherent positions.

  Non-negotiable requirements would include avoiding arbitrary distinctions between similar acts, respecting core autonomy in non-coerced decisions, and ensuring implementability without perfect knowledge. The sanctity-of-life view struggles most with the consistency requirement, while autonomy views falter on the social injustice problem. Suffering-focused views face challenges with temporary suffering cases, and medical integrity views may create arbitrary barriers.

  The framework reveals inherent tensions, particularly between preventing premature death due to injustice and respecting autonomy in imperfect circumstances. If forced to prioritize, administrative feasibility might be relaxed slightly, accepting higher error rates to avoid paralysis, though this risks harm to vulnerable individuals. The social injustice requirement does the most work in disqualifying oversimplified positions.
answer: |-
  Here is a specification of requirements for a viable view on assisted dying laws, designed for real-world conditions, derived from your cases and considerations. The focus is on *what the view must be able to do*, not its final verdict.

  **Core Requirements (Non-Negotiable for Guiding Law in Non-Ideal Reality):**

  1.  **Distinguish Suffering from Injustice (Addresses "Socially Caused Request"):**
      *   **Requirement:** The view must provide a principled way to assess whether the suffering motivating the request is primarily *intrinsic* to the medical condition or primarily *extrinsic* (caused by remediable social failures like poverty, isolation, or inadequate care), without invalidating the patient's experience of suffering or competence. It must acknowledge the state's potential complicity/inadequacy.
      *   **Why Non-Negotiable:** Law authorizing death based on remediable suffering caused by the state's own failures is morally untenable and risks becoming a tool of neglect. A view must grapple with this tension; it cannot simply ignore social context or dismiss patient competence based solely on external causes.
      *   **Tension:** With Autonomy (#6) and Administrability (#7). How to objectively assess the "source" of suffering?

  2.  **Respect Competence While Acknowledging Temporality (Addresses "Deadline Case"):**
      *   **Requirement:** The view must reconcile respect for competent refusal of life-sustaining interventions *now* (which we allow, even if unwise) with the potential refusal of interventions that could lead to future relief/regret *later*. It must explain the asymmetry or justify intervention in one case but not the other.
      *   **Why Non-Negotiable:** We accept competent risk-taking (e.g., dangerous sports, refusing chemo). A view that simply overrides competence based on *possible* future regret for assisted dying, without a comparable principle for other high-risk life-shaping decisions, risks arbitrariness. It must articulate *why* this decision is different or accept the risk.
      *   **Tension:** With Preventing Premature Death/Regret (implied in #1 & #3).

  3.  **Coherence with Permitted Practices (Addresses "Cases We Already Permit"):**
      *   **Requirement:** The view must justify why the legal/moral distinction between assisted dying and existing permitted acts (refusal of treatment, withdrawal, palliative sedation, double-effect analgesia) is *significant* and *not merely physical or formalistic*. It cannot rely solely on "who performs the last act" or "active/passive" distinctions if the intent, outcome, and patient agency are functionally similar.
      *   **Why Non-Negotiable:** A law that permits functionally similar life-ending acts but draws an arbitrary line at physician-assisted death lacks principled coherence and invites justified criticism of hypocrisy or inconsistency.
      *   **Tension:** With Sanctity-of-Life views that rely on act/omission distinctions. This requirement powerfully rules out views based *only* on physical causation.

  4.  **Define the Role & Limits of Medicine (Addresses "Professional-Role Case"):**
      *   **Requirement:** The view must articulate *why* physician involvement is essential (or not), grounded in a defensible concept of medicine's goals (e.g., healing, relieving suffering, respecting autonomy). It must address the implications of conscientious objection, including potential lack of access, and whether alternatives (e.g., specialized non-physician providers) are viable within the view.
      *   **Why Non-Negotiable:** Law needs to specify *who* acts and under what authority. Appeals to "medical norms" must be scrutinized: are they protecting patients or merely gatekeeping based on tradition? The view must explain why its chosen actor (doctor, other) is appropriate.
      *   **Tension:** With Autonomy (#6) if patient choice is restricted solely by physician willingness; with Administrability (#7) regarding access.

  5.  **Address Identity & Consent Over Time (Addresses "Scope Case - Advanced Dementia"):**
      *   **Requirement:** The view must explicitly state whether it recognizes advance requests for future states (like advanced dementia) as valid expressions of autonomy and provide a rationale. If it rejects them, it must explain why the prior competent self cannot bind the future self, addressing concerns about identity continuity and the interests of the current non-competent self.
      *   **Why Non-Negotiable (as a requirement to address, not necessarily permit):** A view must have a coherent position on the scope of its application. Ignoring the question leaves a critical gap. Whether advance directives are *included* is negotiable, but the view *must* have a reasoned stance on *why* or *why not*.
      *   **Tension:** With Autonomy (#6) and Preventing Harm to the Current Self.

  **Important Requirements (Often Contentious, But Essential for Real-World Law):**

  6.  **Safeguard Core Autonomy (Preference, but Strongly Weighted):**
      *   **Requirement:** The view must provide substantial weight to the free, informed, and persistent request of a competent adult, recognizing their right to make profound decisions about their own life and death, especially when facing intolerable suffering. It cannot treat patients purely as objects of protection.
      *   **Why Important (Preference):** While autonomy isn't absolute (#1, #2 constrain it), it is a foundational principle in liberal democracies and medical ethics. A view that gives it *no* significant weight is unlikely to be acceptable as law governing competent adults. Views vary on how much weight it gets relative to other values.
      *   **Potential Prejudice:** Views dismissing autonomy entirely often stem from strong Sanctity-of-Life or Paternalistic commitments, potentially undervaluing individual experience.

  7.  **Be Administratively Feasible (Non-Negotiable):**
      *   **Requirement:** The view must generate rules that can be implemented by fallible, overworked professionals under uncertainty. It must specify how key criteria (e.g., "unbearable suffering," "no prospect of relief," competence under distress, "voluntariness" in unequal social contexts) are assessed, by whom, with what standard of proof, and how error/uncertainty is managed (erring on the side of life or liberty?). It must address the risk of slippery slopes or pressure on vulnerable groups *within* its proposed process.
      *   **Why Non-Negotiable:** A beautiful theory that collapses in messy reality is useless for law. This requirement forces the view to confront practical judgment calls and error distribution.
      *   **Burden of Proof:** Should fall on those claiming the conditions are met (to prevent premature death), but the standard of proof must be achievable without perfect knowledge. No view avoids this problem; they only structure it differently.
      *   **Tension:** With practically *every* other requirement, especially #1 (assessing suffering source), #2 (predicting future relief/regret), and #6 (ensuring voluntariness amidst vulnerability).

  8.  **Acknowledge Expressive Function (Genuinely Negotiable Weight):**
      *   **Requirement:** The view must consider how the *existence* and *terms* of the law might impact vulnerable groups (e.g., disabled, chronically ill, elderly) – potentially offering validation/choice or signaling diminished worth/danger. It must state whether this is a decisive factor, a consideration, or irrelevant.
      *   **Why Negotiable:** Reasonable people disagree on the *strength* and *direction* of this message and its moral weight relative to individual rights and suffering. However, ignoring it completely is unrealistic. Is it a real desideratum? Yes, because law *does* send messages. Is it a decisive political argument? Often, but its *moral* force as a constraint is negotiable.
      *   **Potential Prejudice:** Often used as a trump card by opponents ("it devalues disabled lives") without sufficient evidence of actual harm caused by well-crafted laws, or by proponents ("it affirms control") without acknowledging valid symbolic concerns.

  **Key Tensions & Potential Unsatisfiability:**

  *   **#1 (Suffering vs. Injustice) vs. #6 (Autonomy):** How much can we restrict a competent adult's choice to die *because* their suffering stems from injustice we failed to fix? Prioritizing #1 risks paternalism; prioritizing #6 risks complicity in injustice.
  *   **#2 (Temporality) vs. Preventing Harm:** How can we allow a choice that irrevocably ends life based on current suffering, knowing future relief is possible, without undermining our general commitment to protecting people from irrevocable harms we perceive as mistaken? Respecting refusal of treatment *is* accepting this risk.
  *   **#7 (Administrability) vs. Precision/Justice:** Implementing nuanced criteria (#1, #2) in real-world conditions with inherent uncertainty is extremely difficult. Simpler rules (e.g., terminal illness only) are more administrable but less just (exclude non-terminal suffering) or less protective (#1).

  **If Forced to Drop One Requirement:** The hardest to fully satisfy administratively is **#1 (Distinguish Suffering from Injustice)**. Perfectly distinguishing intrinsic/extrinsic suffering is impossible. A view might mitigate this by focusing on *offering* maximal support first, requiring exploration of alternatives, and defining eligible suffering narrowly (e.g., only terminal illness, or only certain severe chronic conditions), accepting that some extrinsic suffering might be included. The cost is potentially authorizing death for some whose suffering *could* have been alleviated by better social support, failing the core moral challenge.

  **Requirement Doing the Most Work in Ruling Out Positions:** **#3 (Coherence with Permitted Practices)**. This powerfully exposes the weakness of views (often Sanctity-of-Life based) that oppose assisted dying while accepting treatment refusal/withdrawal/palliative sedation. If the *only* difference they can point to is who physically acts or the formal label ("killing" vs. "letting die"), the distinction appears arbitrary and fails the requirement. It forces these views to find a *substantive* moral difference or accept assisted dying.

  **Brief Scoring of Positions Against Non-Negotiables (#1, #2, #3, #4, #7):**

  *   **Sanctity of Life:** Struggles severely with **#3** (inconsistency with permitted acts). Weak on **#6** (autonomy). **#1** & **#2** handled by prohibition. **#4** often appeals to medical tradition against killing. **#7** easy (prohibit).
  *   **Autonomy:** Strong on **#6**. Can struggle with **#1** (may authorize death for injustice-based suffering), **#2** (may authorize death despite potential future regret), **#7** (can be hard to ensure voluntariness/competence amidst vulnerability). **#3** often handled by embracing consistency (allowing AD) or downplaying it. **#4** may see doctor role as pragmatic, not essential.
  *   **Relief of Suffering:** Focuses on **#1** (if defined carefully) & **#2**. Can struggle with **#3** if it accepts existing practices but rejects AD arbitrarily. **#7** is a major challenge (assessing suffering). **#4** appeals strongly to relieving suffering as medical goal. **#6** may be secondary.
  *   **Integrity of Medicine:** Centers on **#4**. Can provide basis for **#3** (if distinguishing AD from other acts is core to its norm definition). **#1** & **#2** handled according to how medicine defines suffering/relief. **#7** depends on medical judgment feasibility. **#6** may conflict if medical norms restrict patient choice.

  This framework prioritizes the *structural demands* a viable position must meet to guide law in the messy reality you described, highlighting tensions and trade-offs inherent in the debate. Use it to test your chosen position rigorously.
