answer: |-
  Your analysis cuts to the heart of deep tensions in historical practice and causal theory. Let's break down each question, building on your insights:

  ### 1. The Implicit Theory Behind the Multi-Cause Rubric
  The demand for multiple causes implies a conception of causation where:
  - **Causes are partial contributors**, not sufficient/necessary in isolation. The rubric rejects *monocausal* explanations, assuming complexity.
  - **The effect is conjunctural**: War emerges from the *intersection* of multiple processes. This aligns strongly with **INUS conditions** (Mackie) or **causal pies** (Rothman). Each factor is an "insufficient but non-redundant part of an unnecessary but sufficient condition." The alliance system alone wasn't sufficient, but it was a non-redundant component of a sufficient set (e.g., alliances + July Crisis + mobilization plans).
  - **Breadth as epistemic virtue**: Listing multiple causes demonstrates understanding of complexity and resists simplistic narratives. The rubric rewards identifying components of the *causal field* (Weber), not isolating "the" cause.
  - **Counterfactual agnosticism**: By not demanding "what if?" tests, it sidesteps metaphysical problems of necessity. It focuses on *actual contributing factors* within the historical conjuncture.

  **Would other theories license it?**
  - **Difference-making (counterfactual)**: Only if combined with INUS or a non-binary view of causation (e.g., probabilistic contribution). A pure "but-for" necessity account *contradicts* the rubric in overdetermination cases.
  - **Mechanistic**: Could align if mechanisms are multi-component (e.g., alliance system *enabled* rapid escalation via treaty obligations). But mechanisms alone might not justify demanding *multiple distinct* causes if one mechanism dominates.
  - **Pluralism**: Easily accommodates the practice, as different "kinds" of causes (structural, agential, contingent) can be listed.

  **Conclusion**: The rubric **strongly implies an INUS or conjunctural model**. Difference-making only fits if weakened; mechanisms and pluralism are compatible but less directly mandated.

  ### 2. The Taboo on Counterfactual History: Presuppositions & Tension
  The taboo is primarily **professional-evidential**, not metaphysical:
  - **Evidence constraint**: Historians prioritize documented traces. Counterfactuals lack direct evidence – we can't test "what if Austria-Hungary didn't issue the ultimatum?" with archives. Assertions become speculative, violating disciplinary norms of evidence-based argument.
  - **Narrative discipline**: History focuses on explaining *what happened*, not what *might* have happened. Counterfactuals are seen as diverting from the core task.
  - **Risk of presentism**: "What if?" often reflects contemporary concerns, projecting modern values onto past actors/structures.

  **Is there tension with the rubric?**
  - **No fundamental inconsistency**: The rubric asks for *actual preconditions* within the realized causal field. Counterfactuals explore *non-actualized possibilities*. The rubric's avoidance of "what if?" is pragmatic, not a denial of causal structure.
  - **Apparent tension arises from conflation**: The rubric *implicitly* relies on counterfactual reasoning (e.g., "the alliance system contributed" implies it made a difference). But it *operationalizes* this by pointing to its *actual role* in the sequence. The taboo targets *explicit, sustained counterfactual narratives*, not the underlying logic.
  - **The real clash is epistemic**: Historians distrust *unconstrained* counterfactuals. The rubric works because listing established factors (alliances, militarism) anchors claims in evidence, even if their "difference-making" status is implied.

  ### 3. Overdetermination & Causal Weight: Indeterminacy and Implications
  **Is there a fact of the matter?**
  - **No** – under genuine overdetermination (e.g., two sufficient paths: Path A: Alliances+Crisis; Path B: Arms Race+Nationalism), causal contribution is **metaphysically indeterminate**. Removing any single factor doesn't change the outcome. Your "causal bookkeeping" breaks because probability shifts are undefined or context-dependent.
  - **Causal weight isn't conserved**: There's no "100%" to distribute. Each sufficient path has a "weight" of 1, but they overlap. Renormalizing (e.g., assigning 50% to each path) is arbitrary without a specific theory of causal primacy or probability baseline.

  **What would change if history took overdetermination seriously?**
  - **Shift from "Why?" to "How?"**: Focus on describing the *causal processes* that converged, not isolating "necessary" factors. "Why 1914?" becomes "Through what complex interaction of structures and events did war erupt *in this instance*?"
  - **Abandon singular blame/credit**: Commemoration and journalism often seek "the" spark. Overdetermination undermines this:
    - Responsibility diffuses across systems (alliances, militarism, decision-making cultures).
    - "Who started it?" becomes meaningless; war emerged from systemic interactions.
    - Lessons shift from "avoid this mistake" to "manage complex systems to prevent dangerous convergences."
  - **Reframe narratives**: History would emphasize *conjunctures* and *contingent intersections* rather than linear chains. E.g., "War resulted from the collision of long-term structural pressures (imperialism, nationalism) with the specific, contingent dynamics of the July Crisis."

  ### 4. History Under an Interventionist/Probabilistic Lens
  **What would it look like?**
  - **Focus on propensities**: Historians would model the *causal structure* generating probabilities (e.g., "Given the alliance system and arms race in 1914, probability of major war within 5 years was X%"). Narratives would explain shifts in this probability space.
  - **"Why 1914?" dissolves**: The question assumes a deterministic outcome. Instead, we ask:
    - "What factors raised/lowered the probability of war over time?"
    - "Why did war occur *in this realization* of the probability space?" (e.g., focusing on triggering events within a high-risk context).
    - "What stable features of the system made war highly probable?"
  - **Distributions over possibilities**: Analysis would consider the *range* of possible outcomes and their likelihoods (e.g., "Austria's ultimatum made war 80% likely; Russian mobilization raised it to 95%").

  **Implications for history's uses:**
  - **Responsibility**: Shifts to *raising dangerous probabilities* (e.g., leaders/system designers who increased war risk) rather than solely "causing" the singular event. This aligns better with overdetermination.
  - **Lessons**: Focuses on managing *systemic risk* (e.g., "Avoid rigid alliance systems that amplify crises") rather than avoiding specific "triggers."
  - **Commemoration**: Becomes more complex – mourning the outcome while acknowledging its contingency and systemic origins. It might emphasize the *fragility* of peace.
  - **Survival of "Why 1914?"**: It survives only as shorthand for "How did the causal processes and contingent events of 1914 produce war *in this instance*, given the pre-existing probability structure?" Its traditional singular, necessitating force fades.

  ### Synthesis
  Your "causal bookkeeping" breakage is a **discovery about the concept**, not a bug. The essay rubric relies on an **INUS-based, conjunctural model** of causation, avoiding explicit counterfactuals for **evidential, not metaphysical, reasons**. Overdetermination exposes the **indeterminacy of causal weight** in complex systems. History, as practiced, is a pragmatic blend:
  - **For explanation**: Uses INUS implicitly, listing components of sufficient conjunctions.
  - **For causality**: Avoids ungrounded counterfactuals, focusing on documented contributions.
  - **For narrative**: Often simplifies indeterminacy for coherence, but rigorous work acknowledges it.

  A fully probabilistic history would transform the discipline, making "why 1914?" a question about pathway realization within a propensity framework. However, the human need for singular narratives of blame, responsibility, and commemoration ensures the traditional form persists, even if philosophically unstable. The tension you identify is real – it's the friction between history as a *humanistic practice* (with its needs for story and judgment) and history as a *causal science* (with its commitment to complex reality).
