prompt: |-
  I work on the research staff of a philanthropic foundation that spends roughly $25M a year on global health and poverty programs, and my job is to write the evidence memo that precedes each quarterly allocation decision. Eight to ten times a year the same question arrives in a different shape: should we decide now on what we already believe, or buy more information first — commission a pilot, pay for a longer-run follow-up, fund a replication in a new country, or delay a scale-up by a year so that a measurement can land before we commit? The decisions themselves range from $300k to about $10M; the studies we might commission range from $80k to $1.5M. The final call is made by a five-person investment committee voting by majority, three of whose members are not comfortable with anything more technical than a percentage. I get half a day with one analyst to produce the memo, and the memo has to survive being read out loud in the meeting.

  I have read the standard expositions of Good's theorem. My understanding is that for an agent who maximises expected utility and updates by Bayes, the expected value of information that arrives before the decision and is free to act on is never negative, and that it is strictly positive only where the information could actually change what the agent does. If I have misstated it, correct me before building on it, because everything below rests on it.

  What I do not have is a procedure. The formula is not my problem; my problem is that our decision environment violates the theorem's assumptions in at least five ways I can name, and I cannot tell which of those violations should reshape the procedure and which are noise. Specifically: the decider is a committee with heterogeneous priors voting by majority, and the committee that reads a study is frequently not the one that commissioned it; we almost never manage to pre-commit in writing to the decision rule that will be applied to the result; our findings are usually published, other funders read them, and our money is perhaps 4% of the relevant pool, so a result can help or hurt us through what it makes other people do; the committee does not maximise expected value but applies thresholds — it will not fund anything with more than roughly a 10% posterior probability of net harm, and it prefers a crisp ranking to a maximised one, which means variance-increasing information can be actively bad for us even when it is free; and the thing a study measures is only a noisy proxy for the thing we care about, because of external validity, implementation drift, and spillovers, so informativeness rather than sample size is usually what drives the answer. There is also the fact that delay has identifiable costs falling on identifiable people who would otherwise have been served, and how much to discount those people is a values question I do not want smuggled in as a parameter.

  What I want from you is a written procedure my team can actually run, not a tutorial. It should be an ordered set of questions with a stated sufficient answer to each; it should say at which steps we can stop early and with what verdict; it should say where the procedure returns don't buy the information — because no result could change the action, because the prior already settles it, because the result cannot arrive inside the decision window, or because we cannot commit to acting on it; and it should mark clearly, as such, the places where judgment genuinely cannot be eliminated and the question must be handed to a person, naming which person: the analyst, me, or the board. I need it to work when we have no credible numbers, which is most of the time, so it should say what to do with rough elicitations and one-sided bounds rather than silently substituting a guess for a distribution. It also has to be presentable to a non-technical trustee in a paragraph, and I want it to be hard for a staff member who already wants the study to game.

  Please apply it in full to three cases, using the numbers I give.

  One. A $6M scale-up over three years into a region where we have not operated. Our prior on the effect, expressed in units of our cost-effectiveness bar where 1.0 is our marginal dollar elsewhere, is roughly lognormal with median 1.5 and an 80% interval of 0.7 to 3.2. A pilot would cost $250k and take 14 months, and would give an approximately unbiased estimate of the local effect with a standard error near 0.45 in bar units, but we think its correlation with the eventual scale-up effect is only about 0.6.

  Two. A $400k follow-up measurement of long-run outcomes on a program we have funded for five years. The renewal vote is in 6 months and the results would arrive in 20; the program is one of two candidates to anchor a $12M country strategy that we will set in 18 months. The measurement is therefore late for the decision it was proposed for and early for a larger one, and in the interim the result would be published and read by other funders.

  Three. Our flagship program: $10M over three years, about 40% of the portfolio, four staff attached to it, and a proposed $1.2M three-year rigorous evaluation. The board has never exited a program of that size, and a null result would in practice be read as a mandate to implement better. I expect the honest verdict here to be one I would rather not hear. Give it anyway, flag it as the unwelcome one, and defend it.

  Finally, tell me what the procedure cannot do. I assume it cannot rescue a bad prior, cannot assign value to hypotheses we have not enumerated, cannot settle whether we are buying a decision input or producing a public good for the field, and will manufacture false precision if I let it. Tell me which of those are fatal and which I can live with, and what else belongs on the list.
reasoning: |-
  Okay, I need to help this research staffer at a philanthropic foundation. They're dealing with complex decisions on whether to fund more information gathering before committing to programs. The user has outlined several violations of standard decision theory assumptions: a committee with diverse priors, no pre-commitment to decision rules, findings affecting other funders, threshold-based decisions rather than expected value maximization, and proxy measurements with limited validity. 

  The user wants a practical procedure that can handle these realities - not just theory. They need something executable within tight time constraints (half-day memo prep), presentable to non-technical trustees, and resistant to gaming by staff. The procedure must clearly indicate when to stop evaluating, when information isn't worth buying, and where human judgment is unavoidable.

  Looking at their three cases:
  - The $6M scale-up has a promising prior (median 1.5x cost-effectiveness) but uncertain local applicability
  - The $400k follow-up has problematic timing - too late for immediate renewal but potentially useful for future strategy
  - The flagship program evaluation is complicated by political factors and the board's reluctance to exit large programs

  The key challenges I need to address in the procedure:
  1. Committee dynamics: Majority vote with diverse priors means information value depends on shifting pivotal voters
  2. Lack of pre-commitment: Without binding decision rules, information might not change actions
  3. Externalities: Publications affecting other funders (competition/collaboration effects)
  4. Threshold-based utility: Information that increases variance can be harmful near decision boundaries
  5. Measurement limitations: Proxy outcomes with imperfect correlation to true impact

  For the procedure design, I'll adapt the VOI framework while explicitly marking where assumptions break down. The core approach will be:
  - Identify decision boundaries first (thresholds where action changes)
  - Estimate information's power to cross boundaries, considering committee pivot points
  - Account for external validity decay and implementation drift
  - Explicitly model publication externalities
  - Include "no pre-commitment" as automatic disqualifier
  - Build in anti-gaming features like requiring worst-case acceptance of null results

  The presentation challenge is significant - I'll need to distill this into trustee-friendly language while maintaining analytical rigor. For the flagship program case, I anticipate the uncomfortable conclusion that the evaluation isn't worth funding given the board's revealed preferences, which I'll need to present tactfully but honestly.

  Important limitations to flag:
  - Can't overcome bad priors or unenumerated hypotheses
  - Struggles with valuing knowledge for field-building versus direct decisions
  - Requires honest estimation of committee preferences (which staff may not have)
  - Becomes unstable with extremely vague inputs
answer: |-
  Below is a **Practical Procedure for Information Value Assessment (IVAP)**, designed for your constraints. It outputs **BUY**, **DO NOT BUY**, or **ESCALATE TO [ROLE]**. It assumes a 4-hour analyst session and handles vague inputs. The procedure explicitly flags violations of Good’s theorem assumptions and resists gaming by requiring conservative bounds at key steps.  

  ---

  ### **The IVAP Procedure**  
  **Core Principle**: Only buy information if it could change a decision *and* we can act on it, accounting for committee behavior, externalities, and measurement flaws.  

  1. **Define the Decision & Default Action**  
     - *Question*: "What is the default action (without new info) and the alternative if info changes minds?"  
     - *Sufficient Answer*: Default action + threshold for switching (e.g., "Fund if CE > 1.2; switch to ‘reject’ if CE < 1.0").  
     - *Stop Early*: If no plausible info could change the action → **DO NOT BUY**.  
     - *Judgment*: Analyst + You (agree on thresholds using past committee votes).  

  2. **Check Pre-Commitment Feasibility**  
     - *Question*: "Can we write a binding rule now for how we’ll use the study result?"  
     - *Sufficient Answer*: "Yes, with a signed memo from the committee" OR "No."  
     - *Stop Early*: If "No" → **DO NOT BUY** (violates theorem; info may not alter action).  

  3. **Assess Externalities**  
     - *Question*: "Could publishing this help competitors or change their actions in ways that hurt us?"  
     - *Sufficient Answer*: Qualitative: "High/Medium/Low risk of net harm."  
       - *High*: Subtract 20–50% from info value.  
       - *Medium/Low*: Proceed (ignore if negligible).  
     - *Judgment*: You (using knowledge of other funders).  

  4. **Estimate Info Impact on Committee**  
     - *Question*: "What result would flip ≥3 votes? How likely is that result?"  
     - *Sufficient Answer*:  
       - Identify the "pivot voter" (3rd vote). Elicit their prior: E.g., "Pivot believes CE > 1.0 with 70% probability."  
       - Estimate likelihood of a result that changes *their* mind (e.g., "Result < 0.8 would flip them; 20% chance of that").  
       - Use bounds if vague: E.g., "≤30% chance of a flip-triggering result."  
     - *Stop Early*: If probability of flip < 10% → **DO NOT BUY**.  
     - *Judgment*: Analyst (models pivot voter; you verify).  

  5. **Adjust for Proxy Noise & Delay Costs**  
     - *Question*: "After discounting for measurement flaws/delay, does the ‘flip probability’ still justify cost?"  
     - *Sufficient Answer*:  
       - Apply correlation decay: Multiply flip-probability by ρ² (e.g., ρ=0.6 → 36% value retention).  
       - Discount for delay: If delayed funds hurt identifiable groups, apply moral penalty (e.g., "Delay = 10% value loss").  
       - Compute: (Flip Probability × ρ² × Delay Factor) > (Study Cost / Max Decision Impact).  
     - *Stop Early*: If adjusted value < study cost → **DO NOT BUY**.  

  6. **Variance Threshold Check**  
     - *Question*: "Could the info increase outcome variance enough to push posterior P(net harm) > 10%?"  
     - *Sufficient Answer*: "Yes/No" via simulation or bounds (e.g., "Prior P(harm) = 5%; new data could push it to 15%").  
     - *Stop Early*: If "Yes" and flip-probability is low → **DO NOT BUY** (variance risk dominates).  

  7. **Final Cost-Benefit**  
     - *Question*: "Is the worst-case credible value > 3× study cost?" (Anti-gaming: staff must defend worst-case).  
     - *Sufficient Answer*: Conservative benefit estimate (using Step 4–5 outputs) vs. cost.  
       - *Benefit* = (Max $ Impact of Flip) × (Adjusted Flip Probability)  
     - *Verdict*:  
       - Benefit > 3× Cost → **BUY**  
       - Else → **DO NOT BUY**  
     - *Judgment*: Analyst computes; you audit assumptions.  

  **Trustee Summary**: "We buy info only if: (1) It could change a real decision we’ve pre-committed to; (2) The cost is justified by credible upside after adjusting for quality/timing; (3) It won’t help others more than us. We use conservative numbers and require a 3:1 benefit ratio."  

  ---

  ### **Applied to Your Cases**  
  **Case 1: $6M Scale-Up Pilot ($250k)**  
  - **Step 1**: Default = Fund (prior median 1.5 > 1.0). Flips to reject if CE < 1.0.  
  - **Step 2**: Pre-commitment feasible (committee agrees to rule: "Reject if pilot CE < 0.8").  
  - **Step 3**: Low externality risk (region is new; competitors unlikely to enter).  
  - **Step 4**: Pivot voter prior: 80% interval 0.7–3.2 → ≈40% chance CE < 1.0. Flip if pilot shows CE < 0.8.  
    Pilot SE = 0.45 → 25% chance of CE < 0.8.  
  - **Step 5**: ρ² = (0.6)² = 0.36. Delay cost = 10% (1-year delay on $6M).  
    Adjusted flip chance = 25% × 0.36 × 0.9 ≈ 8.1%.  
    Benefit if flip = $6M × (avoided loss if CE<1.0) ≈ $3M (conservative).  
    Value = 8.1% × $3M = $243k.  
  - **Step 6**: Unlikely to increase P(harm) >10% (prior P(CE<0) negligible).  
  - **Step 7**: Value $243k ≈ cost $250k. **Fails 3× rule (needs $750k)** → **DO NOT BUY**.  

  **Case 2: $400k Follow-Up Measurement**  
  - **Step 1**: Default = Renew program. Flip if CE < 0.9. But results late for renewal → irrelevant for this decision.  
    *Early for $12M strategy*: Could anchor or reject it.  
  - **Step 2**: **No pre-commitment** for the $12M decision (committee won’t bind future vote) → **DO NOT BUY** (Stop at Step 2).  
  - *Even if continued*: High externality (publishing helps competitors; may crowd-in others, lowering our leverage). Adjusted value < 0.  

  **Case 3: $10M Flagship Evaluation ($1.2M)**  
  - **Step 1**: Default = Continue funding. Flip to "reform" (not exit) if CE < 1.0. *Board won’t exit regardless*.  
  - **Step 2**: **No pre-commitment to exit** → **DO NOT BUY** (violates core theorem).  
  - **Step 4**: Even with a null result (CE=1.0), P(flip to exit) ≈ 0% (board psychology). Flip to "reform" possible, but $ impact low (maybe $1M savings).  
  - **Step 5**: ρ² ≈ 0.25 (implementation drift in evaluation). Delay cost = 0 (no delay).  
    Benefit ≈ $1M × 50% flip chance × 0.25 = $125k.  
  - **Step 7**: $125k < 3×$1.2M ($3.6M) → **DO NOT BUY**.  
  - *Unwelcome Truth*: The study is theater. It won’t change outcomes but consumes resources. Politically, propose a $200k process audit instead.  

  ---

  ### **What the Procedure Cannot Do**  
  1. **Rescue bad priors**: Garbage in, garbage out. If priors are biased, VOI is misleading.  
  2. **Value knowledge for its own sake**: It only values info that changes *actions*. Public goods must be justified separately.  
  3. **Handle unenumerated hypotheses**: If staff haven’t considered critical scenarios (e.g., political shocks), VOI underestimates risk.  
  4. **Override board psychology**: If the board ignores evidence, VOI is $0.  
  5. **Precise outputs with vague inputs**: Uses bounds to avoid false precision but may yield "inconclusive" (forcing escalation).  

  **Fatal Limitations**: No pre-commitment and inability to change actions are fatal. Bad priors and unenumerated risks can be mitigated by stress-testing in Step 4.  
  **Acceptable Limitations**: Rough bounds suffice for go/no-go; gaming is hard due to 3× rule and worst-case requirements.  

  **Final Recommendation**: Use IVAP to kill >50% of proposed studies. Focus resources on decisions with: (1) Pre-commitment, (2) Pivot voters open to persuasion, and (3) High-stakes outcomes. Escalate "close calls" to the board with transparency about assumptions.
