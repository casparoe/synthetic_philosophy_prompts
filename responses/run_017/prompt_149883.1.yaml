          - Non-dictatorial: no dictator.
     - State GS: If a voting rule has at least three outcomes in its image (onto) and is non-dictatorial, then it is manipulable (i.e., there exists a profile where some voter can manipulate).
     - Then address misconceptions.
     - Finally, the activity: anti-plurality rule and find a manipulation.

     On the board at the end: 
          - Statement of GS: "Every voting rule that is onto (at least three outcomes are possible) and non-dictatorial is manipulable."

     And the activity: 
