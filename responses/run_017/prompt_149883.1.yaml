answer: |-
  ### Session Plan for Gibbard-Satterthwaite Theorem  
  **Total Time:** 90 minutes  
  **Structure:** Sequential, building from foundations to the theorem, followed by misconceptions and application. Use a single 3-voter/3-option election example throughout.  

  ---

  #### **1. Introduction (5 min)**  
  - **Goal:** Frame the session.  
  - **Script:** "We’re exploring whether any voting rule is immune to strategic voting. You’re redesigning an election for a committee, but today we’ll simplify to single-winner rules. By the end, you’ll know Gibbard-Satterthwaite (GS): its statement, why its conditions matter, and how to spot false escapes."  
  - **Board:** "Q: Can a voting rule be *ungameable*?"  

  ---

  #### **2. Voting Rules as Functions (10 min)**  
  - **Concept:** A voting rule is a function mapping profiles (lists of rankings) to a winner.  
  - **Example Election (3 voters, 3 options: A, B, C):**  
    - True profile:  
      - V1: A > B > C  
      - V2: B > C > A  
      - V3: C > A > B  
    - **Rule:** Plurality (with tie-break: alphabetical order).  
      - Votes: A:1, B:1, C:1 → Tie → A wins (tie-break).  
  - **Why now?** Establishes the input/output model. Delay breaks understanding of manipulability.  
  - **Board:** Profiles → Rule → Winner.  

  ---

  #### **3. Manipulability Defined (15 min)**  
  - **Concept:** A rule is manipulable if some voter, in some profile, can get a strictly better outcome by lying.  
  - **Example Manipulation:**  
    - V1 lies: Reports B > A > C (instead of A > B > C).  
    - New outcome: B wins (V1: B, V2: B, V3: C → B:2 votes).  
    - V1’s true ranking: A > B > C → Prefers B over A? **No!** (A is first choice).  
  - **Adjust Example:** Use the classic "spoiler effect" profile:  
    - V1: N > G > B (Nader > Gore > Bush)  
    - V2: G > B > N  
    - V3: B > G > N  
    - Plurality: N:1, G:1, B:1 → Tie → B wins (tie-break).  
    - V1 lies: Reports G > N > B → G wins (G:2, B:1).  
    - V1’s true ranking: N > G > B → Prefers G over B → Strictly better.  
  - **Why this example?**  
    - Must lack: Ties (resolved by tie-break), intensities (only rankings), uncertainty (voters know the profile), moralizing ("cheating" is irrelevant; GS is about incentives).  
    - Must have:  
      - 3+ attainable outcomes (B, G, N all winnable; e.g., if all vote G, G wins → onto).  
      - Strict improvement (B → G for V1; manipulation must succeed).  
      - Voter sees others’ ballots (GS requires existence of a profile where knowledge enables manipulation; real elections have uncertainty, but GS ignores this).  
  - **Board:** Manipulability = Voter i can lie → strictly better outcome for i.  

  ---

  #### **4. Load-Bearing Conditions (20 min)**  
  - **Concept:** GS requires two "technical" conditions.  
  - **Condition 1: Onto (≥3 attainable outcomes)**  
    - **Why?** With 2 outcomes, majority vote is strategyproof.  
    - **Example:** If only {B, G} could win, V1 could never manipulate to get N.  
    - **Break if delayed:** Audience might think GS applies to all rules, even two-option ones.  
  - **Condition 2: Non-Dictatorship**  
    - **Dictator defined:** A voter whose top choice always wins (among attainable).  
    - **Why?** Dictatorial rules are unmanipulable (no one can improve the dictator’s top choice).  
    - **Example:** If V1 is dictator, B wins only if V1’s top is B.  
    - **Break if delayed:** Confusion between "dictator" (technical) and "powerful voter."  
  - **Board:** "GS Conditions: (1) ≥3 outcomes possible, (2) No dictator."  

  ---

  #### **5. Gibbard-Satterthwaite Statement (10 min)**  
  - **Theorem:** Every voting rule that is onto (≥3 attainable outcomes) and non-dictatorial is manipulable.  
  - **Connect to example:**  
    - Onto? Yes (N, G, B all winnable).  
    - Non-dictatorial? No single voter always gets their top (e.g., V1’s top is N, but B wins).  
    - Hence, manipulable (as shown).  
  - **Board:** "GS Theorem: Every onto, non-dictatorial rule is manipulable."  

  ---

  #### **6. Misconception Map (20 min)**  
  Address each in sequence **after** stating GS:  

  1. **"This is Arrow’s Theorem again."**  
     - **Response:** Arrow is about ranking aggregation (IIA, Pareto); GS is about strategic voting. Different axioms, same conclusion: impossibility.  

  2. **"Democracy is impossible / all systems equally bad."**  
     - **Response:** GS says *some* manipulation exists, not that all elections are manipulated. Some rules (e.g., Ranked Choice) are harder to game in practice.  

  3. **"Five seats exempt us (single-winner vs. multi-winner)."**  
     - **Response:** GS applies to single-winner, but multi-winner rules are *also* manipulable (e.g., via Gibbard’s extension). The core problem persists.  

  4. **"Approval/Score ballots evade GS."**  
     - **Response:** GS covers *any* voting rule with ordinal inputs. Cardinal rules (like Score) are manipulable too (e.g., Gibbard 1977).  

  5. **"A Vickrey-style (second-price) trick could work."**  
     - **Response:** Vickrey relies on transfers (money/utilities). GS assumes no side payments—only rankings. It doesn’t apply.  

  6. **"People constantly manipulate real elections."**  
     - **Response:** GS only guarantees a *possible* manipulation, not frequent occurrence (e.g., voters lack information or face complexity).  

  - **Board:** "Misconceptions: Not Arrow, not doom, not fixed by committees/cardinal rules, not Vickrey, not about frequency."  

  ---

  #### **7. Randomization (5 min)**  
  - **Why include?** Clarifies a common "escape route."  
  - **Script:** "What if we allow randomized rules? Can we avoid GS? Only partially: strategyproof rules exist (e.g., random dictatorship), but they’re lotteries, not deterministic outcomes. Worse, they require cardinal utilities to evaluate—which GS’s ordinal world avoids."  
  - **Place here:** After misconceptions, as a "near-miss" escape.  
  - **Board:** "Randomization: Buys strategyproofness only via lotteries (not deterministic)."  

  ---

  #### **8. What to Leave Out (Stated Explicitly)**  
  - **The proof:** "We’re skipping the proof (it uses a ‘pivotal voter’ argument), but focus on why the conditions are necessary."  
  - **Tie-breaking nuances:** Assume a fixed order (e.g., alphabetical) to simplify.  
  - **Multi-winner details:** Acknowledge ("Your committee election is complex; GS is a foundation").  

  ---

  #### **9. Check: Application Activity (Last 10 min)**  
  - **Task:** "Invent a profile where this rule is manipulable: Plurality, but if the top two are within one vote, hold a runoff between them."  
  - **Why this rule?** Simple but non-standard; avoids rote memorization.  
  - **Better test?** Have them:  
    1. Verify the rule is onto/non-dictatorial.  
    2. Sketch a profile (e.g., 3 voters: V1: A>B>C, V2: B>A>C, V3: C>B>A → A wins initially; V3 lies to B>C>A → forces runoff between A/B → B wins, which V3 prefers).  
  - **Success metric:** A volunteer says: **"GS says any fair voting rule with ≥3 outcomes must have some scenario where lying pays off."**  

  ---

  ### Why This Sequence Works  
  - **Flow:** Builds intuition (rules → manipulation) before abstraction (conditions → theorem).  
  - **Example Carries Session:** The 3-voter election shows why GS needs ≥3 outcomes (2 options break it), strict improvement (trivial changes don’t count), and known ballots (uncertainty isn’t in GS).  
  - **Prevents Confusion:** Misconceptions are addressed *after* GS is understood, using their terminology ("democracy," "five seats").  
  - **Ends Practically:** The activity forces synthesis; the success sentence verifies conceptual uptake.  

  **Final Board at Close:**  
  1. Rule: Profiles → Winner.  
  2. Manipulable: Some voter lies → strictly better outcome.  
  3. GS: If onto (≥3 outcomes) and non-dictatorial → manipulable.  
  4. Escapes? Randomization (lotteries only), cardinal utilities (not ordinal).  
  5. Not: Arrow, doom, multi-winner fix, or frequent manipulation.
