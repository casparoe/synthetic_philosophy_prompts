          Ask: find a profile and a voter who can manipulate.

     If they find one, great. If not, we show the example.

     Leave out: 
          - The proof (say: "The proof is beautiful but too long; it uses the idea of a pivotal voter in a sequence of profiles.")
          - Extensions to multi-winner (but note that the problem they have is multi-winner, but GS is for single winner. However, the concept of strategic voting applies.)

