               V1: A>B>C
               V2: B>A>C
               V3: B>A>C

            Without manipulation: 
               Not unanimous? Then V1's top: A wins.

            If V1 lies and reports: B>A>C, then:
               Now: 
                   V1: B, V2: B, V3: B -> unanimous on B -> B wins.

            V1's true ranking: A>B, so they prefer B over A? No, they prefer A. So they made B win -> worse.

          How about if V2 manipulates? 
            True profile:
               V1: A>B>C
               V2: B>A>C
               V3: B>A>C

            Without manipulation: A wins (since not unanimous, so V1's top: A).

            If V2 reports: A>B>C? 
               Then: 
                   V1: A, V2: A, V3: B -> not unanimous? (V3 has B top) -> so V1's top: A wins.

            No change.

          If V3 reports: A>B>C? 
               Then: 
                   V1: A, V2: B, V3: A -> not unanimous? -> V1's top: A wins.

          So no manipulation.

          But wait: is this rule onto? 
            - Can we get B? 
            - If V1 has B top, then without unanimity, B wins. Or if unanimous for B. So yes.

          Non-dictatorial? 
            - V1 is a dictator? Not exactly: if there is unanimity for a candidate that is not V1's top, then that candidate wins. 
            - But what if V1's top is A, and everyone else has B top? Then not unanimous? Then V1's top (A) wins, even though everyone else wants B.

          So it's not dictatorial in the GS sense? In GS, a dictator is defined as a voter such that the winner is always her top. Here, if V1 has top A, and the others have top B, then A wins. But if V1 has top B, and others have top B, then B wins. But what if V1 has top A, and others have top B? Then A wins, so V1 gets her top. Similarly, if V1 has top C, and others have top B, then C wins. So V1 always gets her top? Then it is dictatorial.

          Actually: 
            - If the true top of V1 is X, then:
               - If all others have X top -> unanimous -> X wins.
               - Otherwise -> not unanimous -> X wins.
            So V1 always gets her top. So it is dictatorial.

          Therefore, by GS, it is not manipulable? Actually, a dictatorial rule is not manipulable? 
            - Why? Because if a voter lies, the winner is still the dictator's top (which is fixed). So the outcome is the same. So no voter (other than the dictator) can change the outcome, and the dictator doesn't need to lie because the outcome is always her top.

          So this rule is dictatorial and not manipulable.

     We want a rule that is non-dictatorial and onto, but we want to see if they can find a manipulation.

     How about the rule: "The winner is the candidate that is ranked last by the fewest voters." (anti-plurality)

          Example: 
            Candidates: A, B, C.
            Voters: 3.
            Profile:
               V1: A>B>C   -> last: C
               V2: A>B>C   -> last: C
               V3: B>C>A   -> last: A

            Last place votes: A:1, B:0, C:2 -> B wins (since B has 0).

            Now, if V1 (who has A>B>C) wants to manipulate? 
            They might try to avoid having C last? 
            Suppose they report: A>C>B -> then last: B.
            V2: last: C
            V3: last: A
            Last: A:1, B:1, C:1 -> tie. Then tie-break: say A wins.

            V1's true ranking: A>B>C, so A is top -> they are happy.

            But without manipulation: B won, and now A wins. So that's better for V1.

            So manipulation works.

          But we want them to find one. So we present the rule and ask: can you find a profile and a voter who can manipulate?

     We can do that. So in the last 10 minutes:

          Put on the board: 
            Rule: "The winner is the candidate with the fewest last-place votes (anti-plurality). Tie-break: alphabetical."

          Challenge: Find a profile (with 3 voters and 3 candidates) and a voter who, by changing her vote, can get a better outcome (according to her true ranking).

          They can try to construct.

          Example solution (if they don't find, we can show the above) but we want them to try.

     **Single sentence to check understanding the next day:**
          If a volunteer can say: "The theorem says that for any voting rule that can elect at least three different candidates and isn't dictatorial, there is always some situation where a voter can get a better outcome by lying about her preferences."

     Summary of timing:
          Introduction: 5 min
          Model: 20 min (including the example)
          Manipulation: 15 min (using the example)
          Conditions and GS: 20 min
          Misconceptions: 15 min
          Randomization: 5 min (optional, if time)
          Check activity: 10 min

     Total: 90 minutes.

     Note: We must be flexible. The example is key and might take more time.

     Final plan:

     - Start with the model: voting rule, profile, outcome. Use the Nader example to show plurality.
     - Show manipulation in that example: V1 lying to get Gore elected instead of Bush.
     - Define manipulability formally.
     - Then ask: is there any rule that is non-manipulable? 
