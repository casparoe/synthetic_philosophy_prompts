answer: |-
  Your query identifies key tensions in accuracy-first epistemology. Here's a concise analysis:

  **Main Misreading:** You characterize the program as commanding global omniscience ("put 1 on every truth, 0 on every falsehood").  
  **Why It's Wrong:** Accuracy-first doesn't demand actual omniscience; it uses accuracy as a *regulative ideal* to derive norms for *evidence-responsive agents*. Crucially, it evaluates credences via *expected accuracy* (e.g., minimizing *anticipated* inaccuracy given current evidence), not unattainable perfect accuracy. This generates operational norms like conditionalization.  
  **What the Program Actually Says:** It aims to justify epistemic norms (e.g., probabilism, conditionalization) by showing they maximize expected accuracy relative to evidence.  

  **Omniscience Objection:** It lands superficially but is resolved by shifting to *decision-theoretic* framing: We don't require actual omniscience but seek credences *undominated* in accuracy (no alternative is better in all worlds). Standard reply: Dominance-avoidance applies even to non-omniscient agents and implies coherence.  

  **Domain Loophole:** **Partly** blocked. While you *can* restrict opinions to trivial propositions, the framework assumes a *fixed algebra* of propositions relevant to inquiry. Ignoring evidence-adjacent propositions violates derived norms like *reflection* or *conditionalization*, making such restrictions epistemically irresponsible.  

  **Scoring Rule Switch:** **Doesn't help** with omniscience. Both Brier and log scores reward omniscience and punish incoherence equally. Log score's infinities highlight extreme errors but don't alter the core issue.  

  **Probabilism Status:** Accuracy-dominance arguments strongly support probabilism (coherent credences aren't dominated; incoherent ones are), but imprecise credence advocates contest assumptions: (1) additive scoring rules (rejected as question-begging) and (2) permissiveness of dominance reasoning for non-probabilistic representations.  

  **Upshots for Your Paper:**  
  - Use accuracy-first as a *justificatory tool* for norms (e.g., "Conditionalization maximizes expected accuracy"), not a direct imperative.  
  - Explicitly frame accuracy goals as *evidence-relative* and *expectation-sensitive*.  
  - Acknowledge but bracket domain-selection issues (treated as prior to scoring).  

