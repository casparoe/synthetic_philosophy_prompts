prompt: |-
  I am drafting a proposal for a second legislative chamber selected by lot, and before I take it further I would like the position set audited as a package rather than one commitment at a time. Where I stand:

  1. **Term limits.** I support a hard limit of two consecutive terms in any elected office, and I justify it mainly by the diagnosis that long tenure produces a class whose skills are the skills of winning re-election rather than of governing, and whose judgment is captured by funders, staff and lobbyists.
  2. **Sortition on epistemic grounds.** I want one chamber drawn by lot from the adult citizenry. I reject the mirroring argument — that a chamber must demographically resemble the population to be legitimate — and rest the case instead on the claim that a randomly selected body, once properly briefed, deliberates better than elected politicians on long-horizon problems such as climate and pensions, because electoral incentives systematically discount the future.
  3. **The diversity claim in its strong form.** I hold that the advantage of such a body is cognitive and perspectival diversity itself: a heterogeneous group of moderately informed people can outperform a homogeneous group of better-informed experts. This is why I give little weight to the objection that sortition hands power to the ignorant.
  4. **Professionalisation anyway.** I want members serving full-time for pay, with independent staff and expert briefing, and I favour a 200-member chamber with staggered six-year terms renewed by halves every three years, where twenty seats in each incoming half are reserved for members of the outgoing half, who mentor newcomers and chair committees.
  5. **Accountability as a side-constraint.** Any governing body must be answerable to those it governs, in the sense that they can remove or sanction it; I treat this as a constraint rather than something to be traded off against good outcomes. At the same time I reject recall elections and referenda as accountability mechanisms, which I regard as plebiscitary and worse than representative ones.

  Colleagues keep telling me the set is unstable, but the only pair they point to — my dismissal of mirroring in (2) against my reliance on diversity in (3) — looks to me like no conflict at all, since demographic resemblance is only a proxy for the diversity that does the work. So I cannot locate the real fault line myself.

  Please audit the set: which commitments are genuinely in tension, which pairs only appear to be, and what each available repair would cost me. Give me exactly five numbered items, one or two sentences each, with no introduction and no conclusion: the genuine tensions ordered from most to least severe, each with what would have to give and what that costs; then any pair that only looks tense, with the reason it dissolves; and as the final item, the single revision that buys back the most consistency at the least cost.
reasoning: |-
  Hmm, the user is drafting a proposal for a sortition-based legislative chamber and wants me to audit the coherence of their five commitments as a package. They've identified that colleagues find their position unstable, but they only see one alleged tension (between rejecting demographic mirroring while endorsing cognitive diversity) which they think is easily resolved since demographics are merely a proxy for true diversity.

  Let me examine each commitment carefully. Their term limits stance (1) aims to prevent professionalization of politicians, yet their professionalization proposal (4) creates exactly that for the sortition chamber - paid full-time positions with mentorship structures. That's a direct clash in objectives.

  On accountability (5), they reject recall mechanisms but offer no alternative way to remove or sanction the sortition body. This creates a gap where accountability exists only in theory without operational mechanisms.

  The diversity claim (3) is interesting - they argue cognitive diversity matters more than demographics, but without demographic mirroring, there's no guarantee of that diversity materializing. Their rejection of mirroring in (2) might undermine their diversity argument in practice.

  The alleged tension between (2) and (3) is actually coherent as the user argues - demographic resemblance isn't necessary for cognitive diversity. This apparent conflict dissolves when we recognize that diversity manifests in many forms beyond demographics.

  For repairs, the most salvageable point seems to be accountability. They could introduce non-plebiscitary mechanisms like citizen oversight panels or judicial review to satisfy the accountability constraint without resorting to recalls or referendums. This would maintain their principles while closing the operational gap.

  I'll structure the response exactly as requested: five numbered items starting with genuine tensions from most severe, then the apparent tension that dissolves, ending with the most cost-effective fix. The tensions are: professionalization contradicting anti-professionalization aims, accountability without mechanisms, and diversity claims without demographic safeguards. The dissolved tension is the mirroring/diversity pair, and the best fix is adding alternative accountability measures.
answer: |-
  1.  **Professionalization (4) directly contradicts anti-professionalization aim (1):** Your term limits target the professional politician class created by reelection incentives, yet your sortition chamber design creates a new, highly professionalized class (full-time, paid, long terms, mentorship) replicating the very skillset and capture risks you diagnose. Repair requires weakening either the anti-professionalization logic (cost: undermining core justification for term limits) or the chamber's professional structure (cost: potentially weakening its epistemic capacity).
  2.  **Accountability constraint (5) lacks operational mechanism:** You demand bodies be removable/sanctionable but reject recalls/referenda without proposing any alternative mechanism for the sortition chamber. This creates an accountability vacuum. Repair requires defining a feasible, non-plebiscitary sanction/removal mechanism for the allotted chamber (cost: complexity or introducing potentially disruptive elements like judicial review or elected chamber override).
  3.  **Diversity claim (3) is weakened by rejecting mirroring (2):** While demographics aren't perfect proxies, rejecting mirroring *entirely* risks undermining the cognitive/perspectival diversity you rely on, as systemic biases in briefing, participation, or social dynamics could homogenize perspectives despite random selection. Repair requires either accepting mirroring as a *partial* safeguard (cost: conflicting with your explicit rejection) or designing strong anti-bias measures (cost: complexity, potential paternalism).
  4.  **Apparent tension between rejecting mirroring (2) and relying on diversity (3) dissolves:** This is not a genuine conflict. Your distinction holds: demographic mirroring is *one possible means* (a proxy) to achieve cognitive/perspectival diversity, not the *definition* of it. The diversity that matters for epistemic performance is the heterogeneity of thought and experience, which can exist without perfect demographic resemblance.
  5.  **Most cost-effective repair: Define an alternative accountability mechanism (for 5):** Introducing a structured, non-plebiscitary accountability mechanism (e.g., binding citizen review panels, judicial review for procedural failures, or a qualified override power for the elected chamber) directly addresses the most severe operational gap (accountability) without sacrificing core principles like rejecting recalls/referenda, and avoids the deeper contradictions of (1)/(4) or (2)/(3). Cost is design complexity.
