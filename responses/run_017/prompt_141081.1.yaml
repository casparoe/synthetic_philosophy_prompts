prompt: |-
  I work in multi-agent reinforcement learning — decentralized POMDPs, independent and CTDE learners, self-play and population-based training, emergent communication, and cross-play or zero-shot coordination between separately trained agents. I read no philosophy and have only a working user's grasp of game theory: Nash and correlated equilibria, risk versus payoff dominance, symmetry breaking.

  A philosopher friend claims that the standard modern analysis of convention — she called it Lewis's — is roughly what my field keeps rediscovering under names like convention formation in emergent communication. I am suspicious, but I want the claim tested properly rather than dismissed. So: take that analysis as you understand it and restate it clause by clause in the vocabulary I actually use.

  The gloss I was given runs roughly like this. A regularity R in the behaviour of a population P in a recurrent situation S is a convention when: (a) almost everyone conforms to R in S; (b) almost everyone expects almost everyone else to conform; (c) almost everyone prefers to conform on condition that the others conform, and there is some alternative regularity in S that would have served about as well, so that what settles the matter is arbitrary rather than forced by the payoffs; and (d) all of (a) through (c), and the fact that they hold, are common knowledge in P. Correct that gloss first if it is wrong, anachronistic, or missing a condition that matters for the cases below — do not translate a strawman.

  Rules for the translation:

  Map each clause onto something I already have a word for — joint policy, action selection under a policy, opponent model or belief over other agents' policies, equilibrium reached by independent learners, reward function, non-stationarity, centralized training with decentralized execution, exploration, symmetry breaking, risk versus payoff dominance, cross-play score. If the honest mapping is to something my field would call a bug or a nuisance — seeded asymmetry, agent-index leakage, overfitting to training partners — say so rather than reaching for a flattering one.

  It is a Nash equilibrium is where I started, not where I want to end. Where the analysis needs more than my equilibrium notion, say exactly what more.

  Do not smuggle in my framework's assumptions and present them as translation. In particular, my agents share no parameters, seeds, priors, or training distribution unless I say so, and they have no common knowledge in the strict sense; they have separate belief networks trained against a non-stationary environment. If a clause translates only once I assume weight sharing or centralized training, flag that as a hostage to my machinery rather than a clean mapping.

  Two cases to run it on, because generalities will hide the damage.

  Case 1, the unlearnable convention. A population trained together converges on a protocol that coordinates it perfectly and is stable indefinitely. Another protocol would have coordinated it just as well. The two are observationally indistinguishable to any agent that has not already adopted one of them: every signal an outsider can observe is compatible with both, and the disambiguating evidence only becomes available once you are already inside, behaving. A new agent cannot bootstrap in from any finite amount of observation; it can only be initialized into the protocol. My field calls this a cross-play failure and tries to eliminate it — other-play, population diversity, penalties on symmetry breaking. Separately: in my setups a convention does switch, but only when some sizeable fraction of the population drifts at once; a single deviating agent is simply crushed by the training signal. Now: does Lewis's analysis, as glossed, count the unlearnable protocol as a convention, and does anything in its conditions require that a convention be acquirable by a newcomer, or that it be switchable by anything short of a coalition? If not, is that a defect in the analysis, or a sign that my field uses the word for something narrower?

  Case 2, the sanction-driven regularity. Same coordination problem, but the designer has added a per-step penalty, applied by an external critic, for deviating from R. Agents conform, and expect each other to conform; remove the penalty while leaving expectations untouched and conformity unravels within an episode. There is no punishment by the other agents, no reactive attitude toward deviation, nothing that anyone could be held to — only a shaped reward. Read literally, do conditions (a) through (d) count reward engineering as a convention? If so, the conditions seem to need a no-enforcement rider that is not in them; if not, my notion of a sanction must be mapping onto something finer-grained than the preference clause. Say which, and say what my vocabulary cannot express here. I suspect it is the difference between expecting someone to act and taking them to have a reason they can be held to, but tell me if that is moralizing smuggled in.

  Write the translation and the residue report as prose, under about nine hundred words, addressed to me and not to a philosopher. Then append nothing else except a single valid JSON object, in a fenced code block, with exactly this schema:

  translation_table: an array of objects, one per clause of the corrected gloss, each with keys clause (which condition, by letter and one-word name), lewis_content (one sentence on what it requires), marl_translation (the same requirement in my vocabulary, using only terms I listed above), fit (one of clean, distorted, inexpressible), what_had_to_be_bent (string, or null if fit is clean), residue (what has no counterpart in my vocabulary, or null), diagnosis (one of gap_in_my_framework, muddle_in_the_original, neither).

  case_reports: an array of two objects, one per case, each with keys case (1 or 2), lewis_verdict, marl_verdict, where_they_diverge, what_the_divergence_shows.

  inexpressible_in_marl: array of strings, the items that survived the translation nowhere at all.

  bottom_line: string, one or two sentences — is my friend right that my field is rediscovering Lewis, and what precisely does working without his notion cost me?
reasoning: |-
  We are given a gloss of Lewis's convention, which we must correct if necessary and then translate clause by clause into the MARL vocabulary. The gloss has four clauses: (a) conformity, (b) mutual expectation of conformity, (c) conditional preference for conformity and arbitrariness (existence of an alternative), and (d) common knowledge of (a)-(c). We are to map these to MARL concepts without smuggling in assumptions like weight sharing or centralized training. We are also to analyze two cases.

  First, we note that the given gloss is a standard summary of Lewis (1969). However, Lewis's original definition (p. 78) includes that the regularity is arbitrary in the sense that there is at least one alternative regularity that could have been established and that would have been almost as good. This is captured in (c). Also, condition (d) requires common knowledge. We take the gloss as correct.

  Now, translation for each clause:

  (a) Conformity: 
     - Lewis: Almost everyone conforms to R in S.
     - MARL: We have a joint policy (or decentralized policies) that in the recurrent situation S (which we can think of as a state or context) assigns actions that constitute R. Each agent's action selection under its policy leads to conformity.

  (b) Expectation of conformity:
     - Lewis: Almost everyone expects almost everyone else to conform.
     - MARL: Each agent has an opponent model (or belief over other agents' policies) that assigns high probability to the others conforming to R in S.

  (c) Conditional preference and arbitrariness:
     - Lewis: Almost everyone prefers to conform on condition that the others conform, and there exists an alternative regularity that would have served about as well (arbitrariness).
     - MARL: Each agent's reward function is such that conforming is optimal (maximizes expected return) given that the others conform (i.e., it's an equilibrium). Moreover, there exists an alternative joint policy (with the same structure) that would yield a similar expected return (so the choice is arbitrary). The arbitrariness condition is what makes it a coordination equilibrium with multiple equilibria.

  (d) Common knowledge:
     - Lewis: All of (a)-(c) and the fact that they hold are common knowledge in P.
     - MARL: This is problematic. In MARL, especially in decentralized settings, agents do not have common knowledge. They have separate beliefs, and these beliefs are not necessarily shared or known to be shared. The closest we have is that the joint policy and the expectations might be the product of training that leads to a stable equilibrium, but we cannot express that every agent knows that every agent knows ... etc. without centralized training or shared priors. This is a gap.

  Now, for the cases:

  Case 1: The unlearnable convention.
  - Lewis: The analysis does not require that a convention be learnable by an outsider. It only requires that the population conforms, expects conformity, and that the convention is arbitrary and common knowledge. The unlearnable protocol satisfies (a)-(d) if we assume that the common knowledge condition holds in the population (which it does because they are all trained together and we can imagine that they have common knowledge by design). However, note that the common knowledge condition is built on the agents being part of the population and having the requisite knowledge. The analysis does not require that a newcomer can learn it. Also, switching: Lewis does not require that a single agent can switch the convention. In fact, he notes that conventions are stable and change only when a critical mass changes. So the unlearnable protocol is a convention by Lewis's definition. The fact that our field tries to eliminate it (by promoting learnability) means that we are using a narrower concept.

  Case 2: The sanction-driven regularity.
  - Here, the agents conform because of an external penalty. They expect others to conform because they know about the penalty. The conditional preference is: they prefer to conform given the penalty and given that others conform. But note that without the penalty, they would not prefer to conform. The arbitrariness condition: there might be an alternative that would work as well if the same penalty were applied to it. However, the key is that the preference for R is conditional on the penalty, not just on the others' behavior. In Lewis, the preference for conforming is conditional on others conforming, and that is because without others conforming, the agent wouldn't get the coordination payoff. But here, without the penalty, the agent wouldn't get the same payoff even if others conformed? Actually, the penalty might be shaping the reward so that R is the only equilibrium? We must be cautious.

  In Lewis, the preference condition is: "almost everyone prefers to conform to R on condition that almost everyone conforms to R". The reason for this preference is that conforming when others conform yields a good outcome. In the sanction-driven case, if we remove the penalty, then even if others conform, the agent might not prefer to conform because the original coordination payoff might not be enough (or might be structured differently). But note: the penalty is part of the environment. So if we consider the situation S to include the penalty, then R is a convention. However, Lewis would not consider an externally enforced rule as a convention because conventions are supposed to be self-perpetuating by the mutual expectations and preferences. The penalty is an external enforcement mechanism. So condition (c) is not met in the way Lewis intended: the preference for conforming is not solely because of the expectation of others' conformity and the coordination payoff, but because of the fear of penalty. In fact, without the penalty, the coordination might break even if everyone expected everyone else to conform. So by Lewis, this is not a convention because the preference for R is not conditional only on others conforming but also on the external penalty. Therefore, the sanction-driven regularity is not a convention by Lewis's definition.

  But note: the external penalty is part of the game's payoff structure. So if we fold the penalty into the reward function, then the agents are simply playing a different game. In that game, R is a convention? However, Lewis's condition (c) requires that the regularity is arbitrary and that there is an alternative that would have served about as well. In the new game with the penalty, the alternative might not be viable because the penalty is tied to R. So the arbitrariness condition might fail. Alternatively, if we consider the penalty as part of the situation S, then the alternative regularity would have to be one that also avoids the penalty? But the penalty is defined as deviation from R. So an alternative regularity R' would require a different penalty to support it? Then the penalty is not arbitrary? This is messy.

  Lewis's analysis is about social conventions that are self-enforcing. The sanction-driven case is not self-enforcing because it requires an external enforcer. Therefore, it is not a convention.

  Now, we build the translation table and case reports.

  Translation Table:

  Clause (a): Conformity
  - Lewis: Almost everyone conforms to R in S.
  - MARL: The joint policy (or decentralized policies) in the recurrent state/context S leads to actions that are R. (clean)

  Clause (b): Expectation
  - Lewis: Almost everyone expects almost everyone else to conform.
  - MARL: Each agent's opponent model (belief over others' policies) assigns high probability to others playing R in S. (clean)

  Clause (c): Conditional Preference and Arbitrariness
  - Lewis: Almost everyone prefers to conform given others conform, and there is an alternative that would have been about as good.
  - MARL: The joint policy R is an equilibrium (Nash or correlated) and there exists an alternative joint policy that would yield a similar expected return (so the equilibrium is one of multiple with similar payoffs). (clean? But note: the equilibrium notion we use might be more specific. Also, the arbitrariness is about the existence of an alternative, which we can express.)

  Clause (d): Common Knowledge
  - Lewis: (a)-(c) and their holding are common knowledge.
  - MARL: We have no direct counterpart. In CTDE, we might have centralized training that ensures shared knowledge, but in decentralized independent learners, we don't. We might say that the joint policy and the expectations are stable and known to be stable by the training process, but that's not common knowledge among the agents. (inexpressible without bending: we might say that the policy is fixed and the expectations are fixed, but common knowledge requires infinite recursion of knowledge. We don't have that.) So fit: distorted. We can approximate by saying that the policy is fixed and the expectations are fixed, but that's not the same. The residue is the infinite regress of knowledge.

  Case Reports:

  Case 1:
  - Lewis verdict: Yes, it is a convention.
  - MARL verdict: We call it a convention (if we are not careful) but we see it as a cross-play failure because it is not learnable by new agents. We try to avoid such conventions.
  - Where they diverge: Lewis does not require learnability or switchability by a single agent; we want conventions that are robust to new agents and thus require learnability.

  Case 2:
  - Lewis verdict: No, because the preference for conforming is not solely conditional on others conforming but also on the external penalty. Without the penalty, the preference disappears. Also, the arbitrariness condition might be violated if the penalty is tied to R.
  - MARL verdict: We might call it a convention because we see the shaped reward as part of the environment, and the agents are coordinating. But note, if we remove the penalty, the coordination unravels, so it's not stable without the penalty. We might not call it a convention because it's enforced, but our vocabulary doesn't have a clear term for this. We see it as a shaped reward that leads to a desired behavior.
  - Where they diverge: Lewis requires self-enforcement, while we are open to engineered rewards. The divergence shows that our notion of convention is more about the observed behavior and less about the self-enforcing nature.

  Inexpressible in MARL:
  - Common knowledge (as an infinite regress of mutual knowledge).

  Bottom line:
  Your friend is partly right: Lewis's analysis captures the core of what you call convention formation, especially the equilibrium and arbitrariness. However, the common knowledge condition has no clean counterpart in your framework, and your field's focus on learnability and robustness (for cross-play) makes your concept narrower. Working without common knowledge costs you the ability to distinguish between mere behavioral regularities and conventions that are self-reinforcing by mutual expectations and knowledge.
