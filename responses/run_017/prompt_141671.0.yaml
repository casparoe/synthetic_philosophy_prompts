  - It cannot account for subtle or evolving harms. The procedure relies on current testimony. If a group is marginalized and does not testify, the harm might be missed.

  - It cannot perfectly balance competing values. For example, the good deeds of a person versus their bad deeds in Step 3: we only look for unworthiness, which is a threshold. We don't weigh.

  - For new commemorations, the five-year rule might exclude worthy recent deaths without strong public support, which might be arbitrary.

  - The procedure might be too rigid for complex cases. The Commission might feel the need to override it sometimes, but they are bound by it.

  Dispositions:

  Alden Street: Remove
  Pioneer Mother: Retain
  Bridge: Name for the labor organizer (the developer's proposal is rejected)

  \answer{Alden Street: remove; Pioneer Mother: retain; Bridge: name for labor organizer}
answer: |-
  ### Procedure for the Naming and Memorials Commission  
  The procedure is a stepwise flowchart for existing commemorations (streets, statues, etc.) and new commemorations (e.g., naming a bridge). It prioritizes **practical application** by volunteers, using clear questions with defined thresholds. Philosophical nuances are simplified into binary or triage decisions. Key distinctions:  
  - **Asymmetry of installation vs. removal:** Removal requires evidence of *current harm* or *unworthiness*; installation requires *affirmative worthiness*. Removal is not the inverse of installation—historical inertia favors retention unless actively problematic.  
  - **Dropped distinctions:**  
    - "Original intent" vs. "current meaning": Merged into "legacy impact" (Step 2). Lost nuance: Original intent may be irrelevant if not legible.  
    - "Neutrality of inaction": Rejected. Inaction (retention) is deemed an *active choice* when harm is identified.  
    - "Historical context": Subordinated to the legibility condition. If context isn’t publicly known, it doesn’t count.  

  **Dispositions:**  
  - **Retain:** No actionable harm, unworthiness, or capture found.  
  - **Retain with alteration:** Add/modify signage to satisfy legibility or contextualize harm.  
  - **Relocate:** Move to a non-public space (e.g., museum) if harm is severe but historical value exists.  
  - **Remove:** Eliminate from public space.  
  - **Defer:** Insufficient evidence; delay decision (rare, due to research constraints).  
  - **Reject (new commemorations):** Proposal ineligible.  
  - **Accept (new commemorations):** Proposal approved.  

  **Key Concepts Built In:**  
  1. **Second audience:** Prioritized in Step 1. Standing = high. Weight: Harm to second audience trumps donor intent or descendant claims if it impacts daily life (e.g., required use of a name).  
  2. **Legibility condition:** Central to Step 2. If meaning isn’t self-evident, alteration (e.g., a plaque) is required. Corollary: Adding context may redefine the object.  
  3. **Captured meaning:** Step 3. Evidence = historical documentation (e.g., photos, news) of sustained co-option *plus* testimony that the captured meaning persists in public consciousness.  

  ---

  ### Procedure for Existing Commemorations  
  **Step 1: Harm to the second audience?**  
  - *Question:* Does the commemoration cause **ongoing, substantiated harm** to people who must interact with it in daily life (e.g., residents using a street name, students attending a school)?  
  - *Sufficient answer:* 3+ credible testimonies of personal harm (e.g., distress, exclusion) from affected community members.  
  - *No answer:* Only abstract objections, no direct testimony, or harm not tied to daily use.  
  - *Disposition if yes:* Proceed to Step 2.  
  - *Disposition if no/no answer:* Proceed to Step 3.  

  **Step 2: Can harm be resolved by alteration?**  
  - *Question:* Can a **legible alteration** (e.g., explanatory plaque, added artwork) mitigate harm without removal? Assess feasibility and legibility: Would a passerby understand the context using only on-site information and common knowledge?  
  - *Sufficient answer:* Specific alteration proposal that addresses harm and satisfies legibility.  
  - *No answer:* Vague or impractical ideas, or alteration would fundamentally alter/destroy the object.  
  - *Disposition if yes:* **Retain with alteration.**  
  - *Disposition if no:* Proceed to Step 3.  

  **Step 3: Unworthiness or captured meaning?**  
  - *Question A (Unworthiness):* Was the honoree **actively harmful** (e.g., racism, violence) by *contemporary standards*? Ignore "product of their time" unless the act was widely condemned then.  
  - *Question B (Capture):* Was the commemoration **co-opted for harm** (e.g., rally point for bigotry), and does that meaning **persist** in public awareness?  
  - *Evidence:* City archivist memo + testimony. For capture, require proof of sustained association (e.g., photos) *and* 2+ testimonies that meaning is still recognized.  
  - *Sufficient answer:* Archivist memo confirms unworthiness; or capture evidence + testimony confirms persistence.  
  - *No answer:* Thin/contested record, no living witnesses, or capture was isolated/forgotten.  
  - *Disposition if yes to A or B:* Proceed to Step 4.  
  - *Disposition if no/no answer to both:* **Retain.**  

  **Step 4: Relocation feasible?**  
  - *Question:* Can the object be **relocated** (e.g., to a museum) to preserve historical value without public harm?  
  - *Sufficient answer:* Viable plan from a willing institution (e.g., historical society).  
  - *No answer:* No such option, or relocation is impractical (e.g., a street name).  
  - *Disposition if yes:* **Relocate.**  
  - *Disposition if no:* **Remove.**  

  ---

  ### Procedure for New Commemorations  
  **Step 1: Eligibility screen.**  
  - *Question:* Is the proposal **contingent on a donation**?  
  - *Sufficient answer:* Yes (e.g., "name the bridge for my mother if I fund it").  
  - *Disposition if yes:* **Reject.** Principle: Public commemoration cannot be bought.  
  - *Disposition if no:* Proceed to Step 2.  

  **Step 2: Worthiness and waiting period.**  
  - *Question A:* Is the honoree **worthy** (net positive contribution to Ashfield, no serious blemishes)?  
  - *Question B:* If deceased <5 years, is there **compelling reason** to waive the waiting period (e.g., extraordinary public support, historical urgency)?  
  - *Evidence:* Archivist memo + testimony.  
  - *Sufficient answer:* Archivist memo confirms worthiness; for B, 5+ testimonies of support.  
  - *No answer:* Insufficient proof of worthiness, or recent death with no compelling reason.  
  - *Disposition if no to A or B:* **Reject.**  
  - *Disposition if yes to both:* **Accept.**  

  **Step 3: Comparison (if multiple proposals).**  
  - *Question:* Which proposal has the **strongest connection** to the site/city and **broadest public support**?  
  - *Evidence:* Testimony > archivist memo.  
  - *Disposition:* Choose the top proposal; if tie, **defer.**  

  ---

  ### Application to Petitions  
  **1. Alden Street (existing)**  
  - Step 1: **Yes.** Testimony from descendants shows harm (daily use of a street named for a man who excluded them).  
  - Step 2: **No.** Alteration (e.g., plaque) impractical for a street name; harm embedded in name itself.  
  - Step 3A: **Yes.** Archivist memo confirms Alden’s nativism and discrimination; unworthy by modern standards.  
  - Step 4: **No.** Street names cannot be relocated.  
  - **Disposition: Remove** (rename).  

  **2. Pioneer Mother (existing)**  
  - Step 1: **No answer.** No testimony of *current* harm; statue is "unremarked" for decades.  
  - Step 3B: **No answer.** Capture (eugenics rallies) is historical but not persistent; no evidence the public still associates the statue with this meaning. Legibility condition: The statue itself is generic; rallies require specialist knowledge.  
  - **Disposition: Retain.**  

  **3. Pedestrian Bridge (new)**  
  - Developer’s proposal: Rejected at **Step 1** (contingent on donation).  
  - Labor organizer proposal:  
    - Step 1: Not contingent → proceed.  
    - Step 2A: **Yes.** Assume memo confirms worthiness (positive impact as organizer).  
    - Step 2B: **Yes.** Compelling reason: Recent death, but funeral showed strong public support (per narrator).  
  - **Disposition: Accept** (name for labor organizer).  

  **Author’s Sympathies Upheld:** All three (rename Alden, retain Pioneer Mother, name bridge for organizer).  

  ---

  ### Contentious Steps and Character Arguments  
  1. **Step 1 (Harm to second audience):**  
     - *For strict threshold:* "We need concrete proof of harm, not just discomfort. Where are the petitions from residents? Without them, we’re policing feelings!"  
     - *For broad threshold:* "If marginalized groups say this street shames them daily, demanding ‘proof’ dismisses their lived experience. Our job is to listen!"  

  2. **Step 3B (Captured meaning):**  
     - *Against capture:* "You can’t blame a statue for what others did with it 70 years ago. That’s guilt by association—and the public forgot anyway!"  
     - *For capture:* "Those rallies weren’t incidental; they weaponized this statue. If we keep it without context, we’re endorsing that legacy. Capture is permanent!"  

  3. **Step 1 for New Commemorations (Contingent donations):**  
     - *For rejecting:* "Selling naming rights turns public memory into a auction. The developer’s mother may be lovely, but this is pay-to-play!"  
     - *Against rejecting:* "The parks need that money! As long as the honoree isn’t a criminal, why not use private funds for public good?"  

  **What the Procedure Cannot Do:**  
  - **Thin/contested records:** Petitions relying on oral history or disputed facts get **deferred** indefinitely (e.g., "Was this settler really a murderer?"). Risk: Perpetuates harmful commemorations due to lack of proof.  
  - **Evolving standards:** If a honoree’s actions are ambiguous (e.g., "imperfect ally"), the procedure defaults to **retain** (existing) or **reject** (new). Risk: Avoids hard moral choices.  
  - **Symbolic repair:** Cannot address petitions seeking to "balance" historical wrongs (e.g., "Add a statue to offset Alden"). The procedure evaluates one commemoration at a time.  

  \answer{Alden Street: remove; Pioneer Mother: retain; Bridge: name for labor organizer}
