  ## Conservation Debate: Third Thursday

  The conservator taps the crate: cold **CLAY**  
  Or priceless art? Our troubled **STATUE**  
  Wavers. To ship it, we could wreck its **SHAPE**,  
  Re-form the matter—charge by **GRAM**  
  For freight. Or treat it as the **SAME**  
  Prized object, crated costly, holding **STILL**.

  But *can* it hold its essence, standing **STILL**  
  Through transit? If we knead this **CLAY**  
  Back to a lump (material the **SAME**),  
  Do we destroy the fragile **STATUE**?  
  Its worth's not measured by the **GRAM**,  
  But by the meaning in its **SHAPE**.

  That meaning's thin as air. The **SHAPE**  
  Was pressed on dust that waited, **STILL**,  
  Long centuries. Before the sculptor's **GRAM**  
  Of thought, it was just waiting **CLAY**.  
  No form, no name, no nascent **STATUE**—  
  Just stuff that wasn't yet the **SAME**

  As this. But is it *now* the **SAME**  
  As just the matter? Does the **SHAPE**  
  Command existence? Is the **STATUE**  
  Something *more*? Or are we **STILL**  
  Just poking at expensive **CLAY**,  
  Insuring concepts by the **GRAM**?

  The manifest lists weight by **GRAM**,  
  And matter's here—it is the **SAME**  
  Cold stuff the sculptor stole from **CLAY**.  
  Survival hinges on the **SHAPE**:  
  The lump endures the crush, stays **STILL**  
  Itself. The form? That fragile **STATUE**—

  It shatters if we harm one **STATUE**-  
  Critical vein. But weigh each **GRAM**,  
  It’s all just stuff. The figures **SAME**  
  In both ledgers: space and **SHAPE**  
  Coincide. What’s counted? **STILL**  
  Not sure. Perhaps it’s just the **CLAY**

  Arranged statue-wise. Just **CLAY**...  
  Yet *insured* as **STATUE**: two million. **SHAPE**  
  Dictates the cost, not just the **GRAM**.  
  If faith called *this* a god, the **SAME**  
  Packed earth would change. No deeper **SHAPE**  
  Beneath the books. So... roll it to a ball? **STILL**

  **Envoi**  
  Not sure *how* to call this thing we hold so **STILL**:  
  Is it the **STATUE** kept, or just the weighed **GRAM**  
  Of **CLAY**? The **SAME** space, **SAME** weight, **SAME SHAPE**... **STILL**.

  ---

  **Notes on Metaphysical Fit & Form:**

  1.  **Core Distinctions:**
      *   **Survival:** "The lump endures the crush, stays **STILL** / Itself. The form? That fragile **STATUE**—" (Stanza 5).
      *   **Predication:** "Before the sculptor's **GRAM** / Of thought, it was just waiting **CLAY**. / No form, no name, no nascent **STATUE**—" (Stanza 3).
      *   **Modal Flexibility/Matter Sensitivity:** "It shatters if we harm one **STATUE**- / Critical vein. But weigh each **GRAM**, / It’s all just stuff." (Stanza 6) vs. the lump enduring reshaping.
      *   **Co-Location/Causal Powers:** "The figures **SAME** / In both ledgers: space and **SHAPE** / Coincide." (Stanza 6), "The **SAME** space, **SAME** weight" (Envoi).
      *   **Not Physics:** "What’s counted? **STILL** / Not sure." (Stanza 6) – the physical facts don't resolve the question.

  2.  **The Paper-Thin View:**
      *   **Insurance Dictates:** "Insured as **STATUE**: two million. **SHAPE** / Dictates the cost, not just the **GRAM**." (Stanza 6).
      *   **Optionality/Change via Practice:** "If faith called *this* a god, the **SAME** / Packed earth would change. No deeper **SHAPE** / Beneath the books." (Stanza 6). "How to call this thing" is framed as a question of practice, not discovery.
      *   **Flirting with Eliminativism:** "Perhaps it’s just the **CLAY** / Arranged statue-wise. Just **CLAY**..." (Stanza 6) – but immediately countered by the institutional fact ("*Yet* insured as **STATUE**...").

  3.  **Sestina Form as Metaphor:**
      *   **Same Words, New Contexts:** The six end-words (**CLAY, STATUE, SHAPE, GRAM, SAME, STILL**) recur relentlessly in shifting positions and relationships, mirroring the unchanging matter taking on different identities based on conceptual framing and practice. They never *become* each other; they are reused, repurposed.
      *   **Cyclical Uncertainty:** The form's repetitions mirror the unresolvable loop of the metaphysical debate, ending mid-question ("So... roll it to a ball? **STILL**").
      *   **Envoi as Co-Location Summary:** The final three lines pack all six words back in, emphasizing coincidence ("The **SAME** space, **SAME** weight, **SAME SHAPE**") and unresolved stillness ("**STILL**").

  4.  **Setting & Tone:**
      *   Grounded in the practical dilemma of the museum lab (crates, manifests, insurance, acid-free sheets, gloves).
      *   Conversational American English with varying line lengths but consistent rhythmic weight.
      *   Ends unresolved, reflecting the "huh, weird" feeling but pushing it towards the paper-thin consequence: the answer depends on *us* and our practices.
