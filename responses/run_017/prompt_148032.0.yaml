  ## The Mirage of Escape: How Uncertainty Resurrects the Levelling-Down Objection for Prioritarianism

  Prioritarianism promises an elegant escape from the notorious levelling-down objection plaguing strict egalitarianism. By weighting the moral value of wellbeing gains inversely to the recipient's absolute level—via an increasing, strictly concave transformation—prioritarianism claims to value equality only instrumentally, as a byproduct of aiding the worse off. Crucially, it never prefers an outcome where someone is made worse off solely to reduce inequality, satisfying a strong *ex post* Pareto principle. The case of Ada and Bella under uncertainty, however, shatters this illusion. Far from escaping the levelling-down objection, prioritarianism merely displaces it, forcing an unpalatable choice between abandoning fundamental ex ante welfare considerations or sacrificing its core motivating intuition about the moral urgency of actual disadvantage. The objection reappears, not identically, but as a structurally isomorphic problem revealing a deep tension within the view.

  **The Setup and the Puzzling Verdict:**
  Recall the case: Ada and Bella start equally well off. Option S guarantees each a wellbeing of 60. Option R involves a fair coin flip: one gets 130, the other gets 10. Prioritarianism, using a sufficiently concave transformation (e.g., square root: √x), ranks S higher than R. Calculating the prioritarian sums confirms this: S = √60 + √60 ≈ 7.746 + 7.746 = 15.492; R = (0.5 * √130) + (0.5 * √10) + (0.5 * √10) + (0.5 * √130) = (0.5 * 11.402) + (0.5 * 3.162) + (0.5 * 3.162) + (0.5 * 11.402) = 5.701 + 1.581 + 1.581 + 5.701 = 14.564. Despite R offering higher *expected* wellbeing for each individual (70 vs. 60) and higher *total* wellbeing in every possible outcome (140 vs. 120), prioritarianism prefers S. This verdict starkly contrasts with the non-uncertainty case: if we knew Ada would get 130 and Bella 10, prioritarianism would rightly prefer redistributing to 60 each, as this directly benefits the worse-off Bella without making Ada worse off than she would have been without intervention.

  **Is This Levelling-Down? A Superficial Escape:**
  Superficially, this case seems distinct from classic levelling-down. No one is *made worse off* in S *in order to* reduce a gap existing in R. S is a safe, equal distribution; R is a risky, unequal distribution. The prioritarian rejection of R appears to stem from *avoiding the risk* of someone ending up very badly off (at 10), not from actively harming anyone to flatten a hierarchy. The view seems consistent with its promise: it doesn't prefer a *worse* equal state; it prefers a *better* (in its terms) safe state over a risky one. The levelling-down objection, narrowly construed as requiring active worsening, seems dodged.

  However, the core normative discomfort driving the levelling-down objection persists, albeit transformed. The objection fundamentally protests against sacrificing aggregate or individual welfare *for the sake of equality itself*. In the uncertainty case, prioritarianism sacrifices *expected individual welfare* and *ex post aggregate welfare* to avoid an outcome where inequality exists and someone is *actually* badly off. While no one is actively dragged down, the view *declines a prospect that is ex ante better for everyone* (higher expected wellbeing) and *ex post better in terms of total resources* (higher sum of wellbeing in every state), primarily because it fears the *actual realization* of someone being at 10. The underlying complaint – that the view sacrifices potential welfare gains due to an overweening concern with relative disadvantage, even when no one is actively harmed to achieve equality – is structurally identical in spirit. The "levelling" occurs not by pulling anyone down from a known high position, but by refusing a known path upwards for all due to the possibility of a relative low position emerging.

  **The Ex Ante Pareto Dilemma:**
  This verdict forces prioritarians to confront the **Ex Ante Pareto Principle**: If an alternative gives every individual a higher expectation of wellbeing than another, then the former should be preferred. Option R clearly satisfies this compared to S (70 > 60 for both Ada and Bella). Yet prioritarianism rejects R. To retain this verdict, prioritarians must reject Ex Ante Pareto. What justifications exist?

  1.  **Actual Wellbeing vs. Expectation:** The prioritarian might argue that the concave transformation applies *only* to *realized* wellbeing levels. Expected wellbeing is not a "level" to be transformed; it's merely a probability-weighted average. What matters morally is who *actually* suffers a low wellbeing level. The risk of severe disadvantage (someone at 10) carries such moral weight that it outweighs the higher expected gains for all. The coin flip means that *someone determinate* will be badly off, even if we don't know who *ex ante*. The view cares about the actual distribution of suffering, not probabilistic expectations of advantage.
  2.  **No Determinate Beneficiary:** A related argument contends that "expected wellbeing" doesn't attach to a determinate person in the same way realized wellbeing does. Under R, *no specific person* is guaranteed a benefit of 70; each faces a gamble. The Ex Ante Pareto principle, in this view, misapplies the concept of individual good under identity uncertainty. The good that matters is the good of the individuals in the outcomes that actually obtain.

  While internally consistent with the letter of outcome-based prioritarianism, rejecting Ex Ante Pareto carries significant cost. It implies that a policy known in advance to make *every single person* expect to be worse off could be morally required if it prevents the *actualization* of severe disadvantage for some, even if the overall expected aggregate wellbeing is lower. This seems deeply counterintuitive and potentially paralyzing for social choice under inevitable uncertainty. It prioritizes avoiding the worst-case scenario for the worst-off over providing expected gains for all.

  **The Ex Ante Transformation Escape (and its Cost):**
  Prioritarians wishing to retain Ex Ante Pareto can adopt an **Ex Ante Prioritarian** view: Apply the concave transformation to each individual's *expected wellbeing* and sum the results. Here, the value of R becomes: concave(70) + concave(70). Using √x, this is √70 + √70 ≈ 8.367 + 8.367 = 16.734. S remains √60 + √60 ≈ 15.492. Ex Ante Prioritarianism now prefers R, satisfying Ex Ante Pareto. Furthermore, it avoids *ex post* levelling-down: it never prefers an outcome where someone is worse off solely to reduce inequality, as it remains strictly increasing in individual realized wellbeing.

  However, this move eviscerates prioritarianism's core motivating intuition. Consider R compared to a *sure* outcome where each gets 70. Ex Ante Prioritarianism is *indifferent* between these options because both yield the same transformed sum: concave(70) + concave(70). But this indifference is deeply problematic. In the sure 70 outcome, *no one* is badly off. In R, whichever way the coin lands, *someone* ends up at 10 – a state that prioritarianism, by its very definition (via the concave transformation), deems morally catastrophic. Ex Ante Prioritarianism is completely insensitive to this actual suffering; it cares only about the *ex ante* distribution of expected advantages. It loses its grip on the intuition that the person *actually* at 10 has a much stronger claim on resources than the person at 130, *regardless* of what they expected beforehand. It fails to capture the moral urgency of *realized* disadvantage that motivates the concave transformation in the first place. This view becomes indistinguishable from a form of risk-averse utilitarianism applied to expectations, abandoning prioritarianism's distinctive concern for the *actual* worst-off.

  **Intermediate Views and Their Burdens:**
  Could a hybrid view save prioritarianism? One might propose applying the transformation to realized wellbeing but incorporating a risk constraint or a floor constraint to avoid rejecting Pareto-superior gambles like R. Alternatively, one might weight *ex ante* and *ex post* evaluations. However, any such move faces significant costs:

  1.  **Loss of Simplicity and Determinacy:** The elegance and determinacy of the simple prioritarian sum are lost. How much risk aversion is permissible before violating Ex Ante Pareto? Where is the floor set? How are *ex ante* and *ex post* weights determined? These become arbitrary parameters, undermining the theory's foundational appeal.
  2.  **Incoherence or Hidden Values:** Introducing an explicit aversion to risk *beyond* what's captured by the concave transformation applied to outcomes often smuggles in egalitarian or other concerns distinct from prioritarianism's core focus on weighting *levels*. If the aversion stems from the *inequality* inherent in the possible outcomes of R, this reintroduces the separate concern for equality that prioritarianism explicitly sought to avoid.
  3.  **Ad Hocness:** Such modifications risk appearing ad hoc, designed solely to avoid the problematic verdict in the Ada/Bella case without a deeper principled foundation within the prioritarian framework.

  **Conclusion: The Resurrection of the Objection and the Necessary Sacrifice**

  Prioritarianism does not genuinely escape the levelling-down objection; it merely relocates the battleground to choices under uncertainty. The Ada/Bella case reveals a fundamental tension: the view's outcome-oriented, concave transformation inevitably conflicts with the Ex Ante Pareto principle when identities are uncertain. Prioritarians face a stark choice, neither palatable:

  1.  **Reject Ex Ante Pareto:** Keep the core outcome-focused intuition but accept that the view can require rejecting prospects known to be *ex ante* better for every individual, sacrificing potential welfare gains for all to avoid the *actuality* of severe disadvantage for one. This resurrects the levelling-down objection's spirit – sacrificing welfare for distributional concerns – albeit in an *ex ante* form. The complaint underlying levelling-down, that the theory sacrifices aggregate or individual advantage for the sake of its distributive metric, remains potent.
  2.  **Adopt Ex Ante Transformation:** Preserve Ex Ante Pareto but sever the theory's connection to the moral urgency of *actual* disadvantage. This version loses prioritarianism's defining feature: its heightened concern for those who *end up* badly off. It becomes insensitive to realized suffering, rendering the concave transformation applied to outcomes morally inert.

  I contend that the first path, while costly, is the only one consistent with prioritarianism's *raison d'être*. The levelling-down objection was never *solely* about Pareto violations through active harm; it was a symptom of a deeper unease with theories that sacrifice welfare improvements for distributive patterns. Prioritarianism's promise was to value equality only through benefiting the worse off. Yet, in the uncertainty case, its rejection of R sacrifices the *expected* welfare improvement of both individuals (and higher total welfare) to prevent the *pattern* where one is much worse off than the other, even though that pattern isn't achieved by harming anyone relative to S. The underlying distributive concern driving the aversion to the 130/10 outcome, amplified by the concave weighting, overrides the potential gains, mirroring the core dynamic of the levelling-down objection. The escape was cosmetic; the objection migrates, adapting to the new terrain of uncertainty. Prioritarianism survives only by abandoning Ex Ante Pareto, a price that reveals its persistent vulnerability to the fundamental worry that animated the levelling-down objection in the first place: the potential subordination of individual welfare prospects to an impersonal distributive ideal. The coin toss doesn't create a new objection; it exposes the old one, lurking beneath the surface of transformed sums.
