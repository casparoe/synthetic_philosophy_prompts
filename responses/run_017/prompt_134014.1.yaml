prompt: |-
  Hey — I'm writing a chapter on the Hart–Devlin exchange and there's a practice I can't get a clean read on: motive-based sentence enhancement, i.e. hate crime law. In most jurisdictions the same assault draws a stiffer sentence when it was motivated by hostility toward a protected characteristic, even though the rest of criminal law doctrine insists that motive is irrelevant to liability. So what does the practice actually presuppose? Is it Devlin-style legal moralism — the state punishing a morally condemned attitude, on something like his disintegration thesis (a shared morality is what keeps a society from falling apart, so the law may enforce it) — or can a Hart-ish harm principle swallow it (extra community fear, group vulnerability), or is it a third thing, an expressive view where the point is the public message rather than either? And what does it strictly need versus merely sit well with?

  Two wrinkles I care about, because I think they're where the interesting part is and I havent seen them discussed. First: some statutes enhance even when the victim turns out not to have the relevant characteristic (attacked by mistake), which seems to favor the attitude reading over the harm reading. Second: the equal-opportunity thug, who assaults indiscriminately out of general misanthropy and so never gets the enhancement, even though his attitudes are at least as repulsive. I've been calling that the problem of the unselective brute in my notes. Does it show the practice is only contingently moralist, or that the protected-characteristics list is really doing an anti-subordination job?

  Also: does the list have to track anything real, or is it just a snapshot of which groups had political traction? And what would change if a jurisdiction took the harm principle literally — scrap the enhancements or relocate them?

  Give me exactly seven numbered items, a sentence or two each, no intro or outro. One item should say what would change your mind or where your read is most likely to fail. American English, and please flag what you're confident about versus guessing at.
