  Let me break this down. First, the core question: what do hate crime enhancements presuppose? The mistaken identity cases (where enhancement applies even if victim doesn't belong to targeted group) strongly suggest it's about punishing the perpetrator's bigoted attitude, not actual harm caused. That leans Devlin. But then the "unselective brute" problem complicates things—if we're punishing attitudes, why not the misanthrope? Unless... maybe it's not about attitudes per se but about combating group-subordination? 

  The protected characteristics list is another puzzle. If it were purely about harm, why not enhance all bias-motivated crimes equally? But the list seems political—gender identity wasn't protected historically, for example. That suggests anti-subordination is key.

  For the "what would change" part: I'm pretty confident about the mistaken identity point undermining pure harm principle arguments. Less sure about whether the brute problem proves anti-subordination—maybe courts just see selective bigotry as more dangerous? But politically, it's hard to imagine enhancing sentences for general misanthropy.

