answer: |-
  Here are seven numbered points addressing your queries:

  1.  **Core presupposition: Expressive anti-subordination.** Hate crime enhancements primarily presuppose that crimes targeting groups based on protected characteristics inflict distinct societal harm by reinforcing patterns of discrimination and subordination. This aligns more with an expressive view (third thing) than pure Devlin moralism or Hartian harm. *Confident.*
  2.  **Mistaken identity favors expressive/anti-subordination.** Statutes enhancing punishment even when the victim lacks the characteristic demonstrate the focus is on the *perpetrator's motive and the message sent* (attacking a group), not solely the direct harm to the individual victim. This undermines a narrow "harm-to-this-victim" Hartian reading. *Confident.*
  3.  **The "unselective brute" problem exposes anti-subordination.** The lack of enhancement for indiscriminate misanthropy suggests the practice targets crimes that *specifically exploit and perpetuate systemic inequalities* tied to protected characteristics, not just any morally repulsive attitude. It points strongly towards anti-subordination as the core justification. *Confident.*
  4.  **Protected characteristics list is politically contingent.** The list fundamentally reflects which groups have secured recognition of their historical/subordinated status through political/legal processes, not an objective measure of inherent "real" vulnerability or moral desert. *Confident.*
  5.  **Devlin moralism is secondary/tangential.** While societal condemnation of bigotry facilitates passage, the *doctrinal justification* centers on unique harms (fear, insecurity within groups, societal division) tied to targeting protected statuses, not purely enforcing shared morality for societal cohesion per Devlin. *Confident.*
  6.  **Literal Hartian harm principle would likely scrap or radically reframe.** Strict adherence would demand proof each enhanced crime causes measurably *greater primary or secondary harm* than similar non-bias crimes. This might lead to abolishing enhancements or refocusing solely on empirically demonstrable elevated individual harm/community fear, irrespective of motive's moral valence. *Confident on the principle's implication; less so on exact outcome.*
  7.  **Mind-changing evidence: Equal secondary harm from indiscriminate violence.** My anti-subordination read (points 1, 3) would weaken significantly if robust empirical evidence emerged proving crimes by "unselective brutes" generate *identical levels* of group-based fear, vulnerability, and societal division as those targeting specific protected groups. *Confident this is the key vulnerability.*
