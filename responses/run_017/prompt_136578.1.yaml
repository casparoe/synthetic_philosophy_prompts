answer: |-
  ### Democratic Integrity Monitoring Protocol  
  **Version 1.0**  
  *Designed for quarterly assessment by country specialists with no formal political theory training. Half-day time constraint. Focus on institutional changes, not policy shifts or informal norms. Publicly defensible, non-partisan, and convergent across analysts.*  

  ---

  #### **Core Principles**  
  1. **Convergence Priority**: Steps 3–7 include symmetry checks (Mirror Test) and objective thresholds to minimize partisan bias.  
  2. **Public Defensibility**: Code changes *before* labeling; use multi-source evidence (Step 2); avoid reliance on motive.  
  3. **No Motive Adjudication**: Intent inferred from institutional design (Steps 4–5); ambiguous cases default to no flag (Step 8).  
  4. **Federal/Non-Democratic Handling**: Explicit rules for subnational changes (Step 6) and eroded baselines (Step 7).  

  **Retained Tests** (in order):  
  - **Turnover Test** (Step 4): Core to backsliding. Kept.  
  - **Irreversibility Test** (Step 5): Adds severity. Kept.  
  - **Mirror Test** (Step 7): Critical for non-partisanship. Kept.  
  - **Latent-Capacity Test**: **Dropped**. Requires speculation; folded into Turnover/Irreversibility via design analysis.  

  **Dropped Test**:  
  - *Latent-Capacity*: Quantifying "unused powers" is speculative. Replaced by assessing whether a change’s **design** inherently lowers electoral contestability (Step 4).  

  **Critical Distinctions** (Never Collapse):  
  1. **Rules vs. Policy**: Only changes to electoral/oversight *rules* (not policy) are coded.  
  2. **Legality vs. Democratic Valence**: Legality is noted but irrelevant to democratic impact.  
  3. **Capacity vs. Exercise**: Code only if capacity’s *design* objectively undermines checks (e.g., arbitrary dismissal powers).  
  4. **National vs. Subnational**: Subnational changes coded only if they impact >25% of population or national institutions.  
  5. **Baseline Sensitivity**: Backsliding possible from any baseline; severity adjusted for existing erosion.  

  ---

  ### **Protocol: Ordered Steps**  
  *Analysts must document sources for each step (official records, international orgs, domestic opposition/govt statements, voter surveys).*  

  **Step 1: Identify Institutional Changes**  
  - **Question**: Did any law, regulation, or formal institutional change occur this quarter?  
  - **Evidence**: Parliamentary votes, executive orders, court rulings, or electoral body decisions from public records.  
  - **Halt if**: No changes → Flag = 0, Severity = 0.  
  - **Proceed if**: Change(s) found → Document each.  
  - *Why*: Filters out quarters with no material shifts.  

  **Step 2: Assess Democratic Relevance**  
  - **Question**: Does the change alter:  
    (a) Electoral rules (e.g., districting, voter access),  
    (b) Independence of oversight bodies (e.g., courts, media, election boards), or  
    (c) Power distribution between branches/levels of government?  
  - **Evidence**: Compare pre/post-change rules; use opposition/government statements *only* to identify *what changed*, not whether it’s democratic.  
  - **Halt if**: Change is policy-only (e.g., tax reform) → Flag = 0, Severity = 0.  
  - **Proceed if**: Rules/oversight altered → List changes.  
  - *Why*: Excludes policy disputes; focuses on contest rules.  

  **Step 3: Verify Multi-Source Consensus**  
  - **Question**: Is the change uncontested in factual terms?  
  - **Evidence**: Agreement across ≥2 independent sources (e.g., govt gazette + international monitor + opposition report).  
  - **Escalate to Director if**: Sources conflict irreconcilably on facts (e.g., "Did the law pass?").  
  - **Proceed if**: Facts agreed → Proceed to impact coding.  
  - *Why*: Ensures coding rests on verifiable facts, not partisan claims.  

  **Step 4: Apply Turnover Test**  
  - **Question**: Does the change, by design, *objectively*:  
    (a) Raise the incumbent’s cost of losing power (e.g., weaken opposition resources),  
    (b) Lower the probability of incumbents leaving office if defeated, or  
    (c) Reduce opposition’s ability to win future elections?  
  - **Evidence**: Mechanical effects (e.g., gerrymandered maps reduce competitive seats; at-will appointments enable partisan purges). *Ignore* govt rhetoric.  
  - **Default**: Ambiguous → Flag = 0 for this change.  
  - **Halt if**: All changes fail → Flag = 0, Severity = 0.  
  - **Proceed if**: 1+ changes pass → Retain for severity scoring.  
  - *Why*: Core backsliding criterion; focuses on electoral contestability.  

  **Step 5: Apply Irreversibility Test**  
  - **Question**: Is the change hard to reverse under a new government (e.g., requires supermajority, constitutional amendment, or creates long-term facts like judicial appointments)?  
  - **Evidence**: Legal thresholds for reversal; tenure lengths; ratchet mechanisms.  
  - **Severity Boost**: +1 level if irreversible (e.g., mild → moderate).  
  - *Why*: Captures entrenchment; adjusts severity.  

  **Step 6: Handle Federal/Subnational Changes**  
  - **Question**: Is the change subnational? If yes:  
    (a) Does it affect >25% of the population? OR  
    (b) Does it undermine national institutions (e.g., federal election boards)?  
  - **Halt if**: Subnational and fails (a)/(b) → Not coded.  
  - **Proceed if**: National or subnational with impact → Include.  
  - *Why*: Avoids over/under-counting in federal systems.  

  **Step 7: Apply Mirror Test (Symmetry Check)**  
  - **Question**: If the opposition made *this exact change* using neutral descriptors (e.g., "transferred election board control to governors"), would it still meet Step 4?  
  - **Escalate to Director if**: Analyst answers "no" → Possible partisan bias.  
  - **Proceed if**: "Yes" → Include in final coding.  
  - *Why*: Forces non-partisan consistency; analysts’ political views cancel out.  

  **Step 8: Final Coding**  
  - **Binary Flag**: 1 if any change passes Steps 4–7; else 0.  
  - **Severity (0–3)**:  
    - **0**: No change.  
    - **1 (Mild)**: Reversible change with marginal impact (e.g., minor voter ID tweak).  
    - **2 (Moderate)**: Reversible change with major impact (e.g., gerrymandering) *or* irreversible with marginal impact.  
    - **3 (Severe)**: Irreversible change with major impact (e.g., court-packing, media shutdown).  
  - **Values Judgment Escalation**: If a change passes tests but raises unresolved philosophical disputes (e.g., "Is a unicameral legislature inherently undemocratic?"), escalate to Director.  

  ---

  ### **Convergence Testing**  
  - **Method**: All analysts code the same 10% sample of country-quarters annually.  
  - **Metric**: Cohen’s κ ≥0.8 for binary flags; intraclass correlation ≥0.7 for severity.  
  - **Resolution**: Disagreements trigger protocol refinement (not analyst retraining).  

  ---

  ### **Case Applications**  
  *Using stipulated facts only. Half-day research limit respected.*  

  **Case A**  
  - **Step 1/2**: Confirmed changes to electoral districting, media regulator, judicial tenure, ministry contracts.  
  - **Step 4 (Turnover Test)**:  
    - SMD increase → Gerrymanders future elections (pass).  
    - Media regulator → Ends independence (pass).  
    - Judicial retirement age → Court-packing (pass).  
    - Ministry contracts → Enables partisan purges (pass).  
  - **Step 5 (Irreversibility)**: Media/judicial changes irreversible (+1 severity each).  
  - **Step 6**: National → Proceed.  
  - **Step 7 (Mirror Test)**: All changes pass (e.g., opposition gerrymandering still backsliding).  
  - **Step 8**: **Flag = 1**. Severity: Media/judicial = severe (3); others moderate (2). **Highest severity = 3**.  
  - *Note*: "Established democracies do this" ignored; design determines impact.  

  **Case B**  
  - **Step 1/2**: Six states change districting, voter ID, election board control.  
  - **Step 4 (Turnover Test)**: All changes reduce opposition’s electoral access (pass).  
  - **Step 5 (Irreversibility)**: Reversible by future state legislatures → Mild severity.  
  - **Step 6 (Subnational)**: Affects 6/20 states (30% of population) → Pass.  
  - **Step 7 (Mirror Test)**: Gerrymandering/voter ID by opposition still backsliding (pass).  
  - **Step 8**: **Flag = 1**. Severity: Moderate (2) due to multi-state impact.  

  **Case C**  
  - **First Country (Below Threshold)**  
    - *TV Closure*:  
      - **Step 4**: Eliminates opposition media → Pass Turnover Test.  
      - **Step 5**: Irreversible → +1 severity.  
      - **Step 7**: Mirror Test passed → **Flag = 1, Severity = 3**.  
    - *Lifted Emergency*: Not a rule change → **Flag = 0**.  
  - **Second Country (Restoration)**  
    - *Reversed Changes*: Not backsliding → **Flag = 0**.  
    - *Protocol Note*: Restoration after erosion is not backsliding; no flag.  

  **Case D**  
  - **Step 1/2**: Abolished upper chamber, judicial appointments politicized, presidential power removed.  
  - **Step 4 (Turnover Test)**:  
    - Abolishing upper chamber → Removes legislative check (pass).  
    - Judicial appointments → Ends independent vetting (pass).  
    - Presidential power removal → Reduces executive constraint (pass).  
  - **Step 5 (Irreversibility)**: Abolishing chamber irreversible → +1 severity.  
  - **Step 7 (Mirror Test)**: Escalate to Director (analyst may see opposition doing this as "reform").  
  - **Director Ruling**: All changes pass Mirror Test (opposition abolishing checks is still backsliding).  
  - **Step 8**: **Flag = 1**. Severity: Chamber abolition = severe (3); others moderate (2). **Highest severity = 3**.  
  - *Honest Unwanted Output*: Despite reform commission endorsements, design removes checks → Flagged.  

  ---

  ### **Your Priors vs. Protocol**  
  1. **"Legal changes in established democracies aren’t backsliding"**:  
     - **Fails**: Design/impact > legality/precedent (Case A).  
  2. **"No flag without intent to entrench"**:  
     - **Fails**: Motive ignored; inferred from institutional design (Cases A, D).  
  3. **"Case D is reform"**:  
     - **Fails**: Removal of checks triggers backsliding flags regardless of stated goals.  
  4. **"No backsliding below threshold"**:  
     - **Fails**: Further erosion is codable (Case C’s TV closure).  

  ---

  ### **What This Protocol Cannot Do**  
  1. **Capture Non-Institutional Erosion**: Norm violations (e.g., refusing concessions) require qualitative supplements.  
  2. **Assess Motive or Legitimacy**: Calls about "justified" changes left to political theorists.  
  3. **Measure Democratic Health Holistically**: Only flags discrete backsliding *events*; not a democracy index.  
  4. **Predict Future Harm**: Focuses on executed changes; unused powers not coded.  
  5. **Resolve Deep Disagreements**: Values disputes (e.g., "Is judicial populism democratic?") escalated to Director.  

  **Final Advice**: Publish severity scales with explicit thresholds. For contested cases (e.g., Case D), disclose the protocol and escalation steps to preempt accusations of bias. Credibility lies in transparency, not neutrality.
