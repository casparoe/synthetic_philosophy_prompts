  Okay, the user is a chief of staff in a mayor's office dealing with ethical dilemmas where they have to choose between doing something morally wrong or allowing harm to the city. They need a practical decision procedure, not theoretical discussions. Let me unpack their main points.

  First, they mentioned "load-bearing wrong"—whether the unethical element is essential or just convenient. They want to ensure that the wrong isn't replaceable by a slower or costlier alternative. Then there's delegation: they can't pass the ethical buck down the chain. The mayor or higher-ups own the moral responsibility even if they didn't directly order it.

  They also want to distinguish between genuine dirty-hands situations and lesser-evil scenarios where no rights are violated but there are costs. The acknowledgment condition is crucial—if secrecy is necessary, it might disqualify the action. Plus, frequency: they're worried about habituation, where repeated compromises make each one seem more acceptable.

  The user needs a step-by-step procedure with clear questions, hard stops, and assigned sign-offs. They provided three test cases: wildfire, housing deal, undercover policing. Each tests different aspects. They want honesty about where the procedure might fail.

  Deep needs: They’re overwhelmed, time-pressed, and need to avoid rationalization. They’re the ethics person by default, so they need tools to push back against senior pressure. The procedure must be defensible later, possibly in public hearings. They need something that forces explicit decisions, especially from the mayor, to prevent plausible deniability.

  For the framework, I'll structure it into phases: Pre-Screen, Core Test, Decision Protocol. Pre-Screen weeds out non-dirty-hands cases. Core Test tackles the key criteria. Decision Protocol handles sign-offs and documentation. 

  Load-bearing wrong: Must verify necessity. If alternatives exist, it’s not dirty hands. Delegation: The originator of the chain bears responsibility. Lesser-evil: If no intrinsic wrong, it’s a policy trade-off. Acknowledgment: Secrecy as a requirement fails the test. Frequency: Track cases and escalate if recurring.

  For sign-offs, the chief of staff runs the test, the mayor must approve dirty-hands actions. Legal counsel checks legality separately. Documentation is minimal but crucial for accountability.

  Test cases: Wildfire—emergency, but alternatives? If no time, mayor approves, but must acknowledge. Housing deal—process rigging is intrinsic wrong, fails delegation and acknowledgment. Undercover policing—participation in crime is load-bearing, but secrecy requirement fails acknowledgment condition, so blocked.

  Misfires: Might clear cases where harm seems imminent but alternatives exist. Might block necessary actions due to secrecy. Habituation risk remains if tracking isn’t maintained. The procedure relies on honest answers, which is a vulnerability.

  Need to ensure steps are ordered to prevent rationalization. For example, checking alternatives early, requiring mayor's explicit sign-off. The "Dirty Hands Disclosure" memo forces ownership. Frequency tracking adds a checkpoint against normalization.

  In the undercover case, the procedure blocks it because of secrecy, which aligns with the user's suspicion. They prefer an honest outcome over smoothing edges. The housing deal fails delegation and acknowledgment, which makes sense. Wildfire passes if no alternatives, but requires mayor's public stance.

  Overall, the procedure addresses their need for clarity, reduces ambiguity, and forces tough decisions upward. It’s designed to be time-efficient with clear hard stops. The test cases demonstrate its application, showing both approvals and rejections based on criteria.
answer: |-
  Here’s a **Dirty Hands Decision Protocol (DHDP)** designed for speed, defensibility, and anti-rationalization. It forces explicit ownership, distinguishes true dilemmas from bad choices, and flags habituation. **Total runtime: 45 minutes max.**

  ---

  ### **PHASE 0: PRE-SCREEN (5 min)**  
  *Run this on every proposal before deeper analysis. Goal: Weed out non-dilemmas.*  
  **Question 1: "Is there an intrinsic moral wrong?**  
     - *Sufficient:* "Yes, this violates a core ethical principle (e.g., deception, coercion, rights violation, betrayal of trust)."  
     - *Non-answer:* "It’s uncomfortable/risky/unpopular" or "It skirts the rules."  
     - **Hard Stop:** If "no," **exit DHDP** — this is a lesser-evil policy trade-off (document and proceed).  
  **Question 2: "Is the harm imminent and concrete?**  
     - *Sufficient:* "Specific, severe harm to identifiable people/groups will occur within days/weeks if we don’t act."  
     - *Non-answer:* "It might prevent future problems" or "It avoids political fallout."  
     - **Hard Stop:** If "no," **reject** — not urgent enough for dirty hands.  

  ---

  ### **PHASE 1: CORE TEST (25 min)**  
  *Answer sequentially — failure at any step kills the proposal.*  
  **Question 3 (Load-Bearing Wrong): "If we remove the morally wrong element, does the good outcome collapse?**  
     - *Test:* Propose 1–2 alternatives (e.g., pay market value for the houses; run a sham bid for the garage).  
     - *Sufficient:* "Yes, the good outcome is impossible without the wrong (e.g., no time for eminent domain; undercover op fails if officer doesn’t commit crime)."  
     - *Non-answer:* "It’s slower/more expensive" or "We’d have to negotiate."  
     - **Hard Stop:** If "no," **reject** — this is convenience, not necessity.  

  **Question 4 (Delegation): "Who originated the necessity for this act?**  
     - *Test:* Trace the chain. Did leadership create the situation (e.g., underfunding, vague orders) forcing subordinates to choose?  
     - *Sufficient:* "Mayor/Chief of Staff/Cabinet created the policy/pressure leading to this."  
     - *Non-answer:* "Field staff decided independently" (unless leadership knowingly enabled it).  
     - **Judgement Call:** Mayor must confirm ownership: **"I own the necessity of this act."**  

  **Question 5 (Acknowledgement): "Can the Mayor publicly admit this action post-crisis?"**  
     - *Test:* Draft a hypothetical press release: "I ordered [action] to prevent [harm], knowing it was wrong. I take responsibility."  
     - *Sufficient:* "Yes, and we’ll document it internally now."  
     - *Non-answer:* "Only if exposed" or "We’d use euphemisms."  
     - **Hard Stop:** If "no," **reject** — secrecy invalidates dirty hands.  

  **Question 6 (Frequency): "Is this the same core wrong we’ve used before?"**  
     - *Test:* Check DHDP log (you’ll maintain). If same *type* of wrong (e.g., "rigged process") >2x/year, escalate.  
     - *Sufficient:* "New dilemma" or "First time this year."  
     - *Non-answer:* Ignoring the log.  
     - **Judgement Call:** If >2x/year, Mayor must explain in writing: **"Why this won’t become standard practice."**  

  ---

  ### **PHASE 2: DECISION PROTOCOL (15 min)**  
  **Sign-offs:**  
  1. **Chief of Staff:** Runs DHDP, documents answers.  
  2. **Corp Counsel:** Confirms legality *after* DHDP (so ethics drive the ask).  
  3. **Mayor:** Must personally approve Phase 1 answers (Q4 & Q6) and Q5 press release. **No delegation.**  
  **Documentation:**  
     - One-page DHDP worksheet with bullet-point answers.  
     - Mayor’s signed attestation: **"I confirm this meets DHDP criteria and I accept responsibility."**  
     - Filed in encrypted "Ethics Actions" log (audited quarterly by independent ethics board).  

  ---

  ### **TEST CASES**  
  ***(a) Wildfire Firebreak***  
  - **Q1:** *Yes* (property destruction without due process).  
  - **Q2:** *Yes* (imminent harm to neighborhood).  
  - **Q3:** **Fail** — Alternatives exist: Use city equipment to flood yards instead of demolish, or pay owners instantly via emergency fund. *Not load-bearing.* **REJECTED.**  

  ***(b) Housing Deal***  
  - **Q1:** *Yes* (deception, rigging process).  
  - **Q2:** *Yes* (harm: housing shortage continues without deal).  
  - **Q3:** *Pass* — Without rigged contract, developer walks.  
  - **Q4:** *Pass* — Mayor’s office initiated the "quid pro quo."  
  - **Q5:** **Fail** — Mayor cannot admit: "I lied to council to get affordable housing." **REJECTED.**  
  - **Q6:** Flagged if similar deals occurred.  

  ***(c) Undercover Crime Participation***  
  - **Q1:** *Yes* (officer commits crime).  
  - **Q2:** *Yes* (specific lives at risk).  
  - **Q3:** *Pass* — No cover without participation.  
  - **Q4:** *Pass* — Police command authorized operation.  
  - **Q5:** **Fail** — City *must* deny knowledge to protect operation/officer. **REJECTED.**  

  ---

  ### **WHERE THIS MISFIRES**  
  1. **Wrongly Clears:**  
     - "Sophisticated rationalizers" who game Q3 (e.g., overstate alternatives' costs).  
     - True emergencies with no *practicable* alternatives (but DHDP errs toward blocking these).  
  2. **Wrongly Blocks:**  
     - Actions where publicity *itself* causes harm (e.g., exposing a vulnerable informant). DHDP is too rigid here.  
  3. **Rubber-Stamps:**  
     - Subjective harm assessments (Q2). A determined mayor can overclaim "imminent harm."  
  4. **Critical Vulnerability:**  
     - **Habituation:** If leadership ignores Q6 or the ethics log isn’t maintained, the system fails.  
     - **Mayoral Courage:** If the mayor won’t sign Q5, *everything* gets rejected.  

  ---

  ### **KEY DESIGN FEATURES**  
  - **Anti-Rationalization:** Load-bearing test (Q3) comes *before* mayoral judgement calls (Q4/Q6). Forces proof before ownership.  
  - **Accountability:** Mayor’s Q5 press release and attestation create a "paper trail for conscience."  
  - **Speed:** Concrete yes/no tests dominate; only 2 judgement calls (both requiring mayor).  
  - **Defensibility:** Independent audit of the log exposes patterns.  

  **Bottom line:** This won’t eliminate tragedy, but it forces dirty hands to be *rare, owned,* and *unlaundered*. If the mayor won’t sign, you shouldn’t do it.
