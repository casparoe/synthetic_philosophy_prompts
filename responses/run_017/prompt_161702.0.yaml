prompt: |-
  I teach a second-year undergraduate module on moral responsibility, and the first session of next term is on moral luck. I open each lecture with a short joke, and I want this one to do real work rather than merely serve as a warm-up: it should be funny on first hearing to students who have not yet met the material, and it should become more obviously structural once, later in the same hour, they have been through the standard cases — the two drivers, only one of whom kills a child; the assassin whose shot goes wide; the official who is never placed in the situation that would have revealed what he would have done.

  The distinction I want the joke to turn on is one I introduce under the label counterfactual salience luck. Resultant moral luck, as standardly understood, concerns what actually happened; circumstantial luck concerns the situations into which one is placed. Counterfactual salience luck, in my usage, concerns whether the outcome one narrowly avoided is epistemically available to the people doing the blaming: how close the near miss was, whether anyone saw it, whether there is footage of it, how easy the alternative is to picture. A driver who misses a child by a metre and is never observed is, through nothing within his control, in a very different position from one whose near miss is caught on a doorbell camera and replayed on the evening news. The blame in the two cases differs, and what drives the difference is not the outcome itself but the vividness with which the outcome that did not occur is present to whoever is judging.

  Please write me the joke, subject to the following constraints.

  It should be a single joke of no more than about 120 words, composed in British English, and written to be read aloud at the top of a lecture: a set-up and a punchline rather than a sequence of one-liners, and nothing that requires props, voices, or elaborate delivery.

  The punchline must turn on the distinction set out above. Someone who has grasped the difference between resultant luck and counterfactual salience luck should be laughing at the mechanism, not merely at the topic; swapping in a different philosophical distinction should break the joke, and a colleague who works on responsibility should find it genuinely funny rather than merely neat.

  It may not rest on a pun, nor on an ambiguity in the words luck or blame, and it may not be a generic joke about philosophers, academics, or students.

  It must not presuppose knowledge of, or name, any author, text, or publication: it has to land for students a week before they have read anything at all, and answering it should not require looking anything up.

  The register should be dry and understated, and nothing in it should embarrass me in front of a large lecture theatre.

  After the joke, add two or three sentences, in the same register and also in British English, identifying which feature of the distinction the punchline exploits and where the joke is most likely to fall flat — in particular, what a student who has misunderstood the distinction would take it to be about.
reasoning: |-
  Okay, the user is teaching a second-year undergrad module on moral responsibility and needs a joke for the first lecture on moral luck. The joke must illustrate "counterfactual salience luck"—how the vividness of near-misses affects blame, not just outcomes. 

  Hmm, the constraints are tight: British English, dry wit, no puns/names, ~120 words. Needs to work for newcomers but deepen after lecture. Key is making the distinction structurally funny—swapping philosophical concepts should break it. 

  First, the core mechanism: blame shifts based on how *observable* the avoided harm is, not the harm itself. A standard joke about drunk drivers won't work—too reliant on resultant luck. Need something where identical near-misses are judged differently purely due to visibility. 

  Ah, the pub scenario! Two patrons leave drunk, both nearly hit cyclists. One's near-miss is dramatic and public; the other's is unseen. The punchline: "The second patron merely drove home drunk, which seems almost respectable by comparison." Perfect. The blame discrepancy hinges entirely on counterfactual salience—the first outcome is *vivid*, so his identical recklessness feels worse. 

  Why this works:  
  - Setup mirrors "two drivers" case but flips focus to observers.  
  - Punchline exploits how salience warps moral perception, not actions.  
  - If students confuse it with resultant luck later, they'll think it's about harm occurring—but it's really about the *spectacle* of avoidance.  

  Risk: If students miss that both patrons had equal near-misses, they might misattribute blame to outcomes. But that’s teachable—the joke’s fragility is its strength.  

  Now the dry British tone: "pavement," "cyclist," "merely respectable" nails it. Colleagues will chuckle at how the joke dissects epistemic accessibility.  

  Final check: No props, no jargon, just two fools and an invisible bicycle. Nails the brief.
answer: |-
  Here's the joke, designed for your specifications:

  **Joke:**  
  Two patrons leave the same pub after one too many. The first, stepping off the pavement, stumbles directly into the path of a cyclist. The cyclist swerves dramatically, skids, and narrowly avoids catastrophe, scattering groceries everywhere. The second patron, leaving moments later, trips on the kerb in precisely the same way – but the road is empty. He regains his balance unseen, walks home, and goes to bed.  
  The next day, the first patron is widely condemned as a reckless menace. The second patron? He merely drove home drunk, which seems almost respectable by comparison.

  **Explanation (for your reference, to be delivered after the lecture material):**  
  The punchline exploits how the vivid *observability* of the near-miss, not the reckless act itself or any actual harm, amplifies blame for the first patron. Where it might fall flat is if students conflate it with resultant luck, focusing on the scattered groceries as a 'result' rather than recognising the crucial difference is the *salience* of the avoided cyclist collision for the observers. A misunderstanding might lead them to think it's simply about differing outcomes (scattered groceries vs nothing) rather than the epistemic availability of the counterfactual disaster.
