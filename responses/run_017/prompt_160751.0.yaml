prompt: |-
  im trying to do my own bit of reflective equilibrium for an essay on the boundary problem — who actually belongs to the demos — and ive written down my gut verdicts on who should get a vote, and i want to know what principle, if any, they add up to.

  - someone who's lived and paid tax here ten years but never took citizenship: yes, definitely
  - a citizen who's lived abroad eight years, pays no tax here and doesnt follow the news: no, even though the law still binds him if he moves back
  - a commuter who lives over the border, works here and pays income tax here: yes, i think
  - a tourist on a two week holiday: no, obviously
  - a stateless person who's been stuck here three years and can't be deported: yes, but i'm shakier about this one
  - a citizen born abroad who's never set foot here and doesn't speak the language: no — and this is the one that worries me, because it feels like it can't both survive alongside the last one
  - a sixteen year old: yes. A nine year old: no
  - someone in a persistent vegetative state: no, but I can't say why without wrecking the rest of my list
  - a company headquartered here: no, obviously
  - people downstream in another country who'd lose their homes to a dam we build: they should be consulted, but not given votes

  the principle i keep trying to make work is: you get a say just in case you're subject to the coercive power of the state. but that seems to hand a vote to the tourist, the nine year old and the woman in a coma, and it doesn't explain why i'm less sure about the stateless person than about the ten year resident. is there one principle — or two or three i have to weigh against each other — that gets most of these, stated precisely enough that i can test it, and which of my verdicts does it force me to drop? please also tell me what it says about cases i haven't listed: prisoners serving life sentences, dual citizens who vote in two countries, and people who own land here but live abroad. no reading lists, i just want the principle and where it bites.
reasoning: |-
  Okay, the user is working on an essay about the boundary problem—figuring out who should be part of the demos (the voting population). They've listed their intuitive responses to various scenarios and want to know if there's a consistent principle that explains their judgments. They mentioned the "all subjected principle" but realized it includes people like tourists and children, which they don't want. 

  First, I need to analyze their specific cases. They include long-term residents without citizenship, non-resident citizens, cross-border workers, tourists, stateless individuals, non-resident citizens by birth, teenagers, comatose patients, companies, and affected foreigners. Each has a yes/no with some uncertainty, especially the stateless person versus the non-resident citizen.

  The user's struggle with the stateless person (yes) versus the citizen never in the country (no) is a key conflict. The all-subjected principle fails because it would include too many, like tourists. So, what other principles could work? Maybe combining subjected to coercion with ongoing societal integration. That might explain long-term residents and workers who are integrated, while excluding tourists. 

  For non-resident citizens, they're not currently integrated, hence no vote. The stateless person is present and affected daily, so maybe integration matters more than legal status. The comatose patient is subjected but can't participate, so mental capacity becomes a factor. Teenagers at 16 might be deemed capable, unlike younger kids.

  Cases like prisoners: they're subjected and integrated (in a way), so under integration + subjected, they should vote. But the user might not have considered this. Dual citizens voting in two places? If they're integrated in both, maybe yes, but that could be problematic. Landowners abroad aren't integrated, so no vote.

  The user might need to adjust some intuitions, like the stateless person being a firm yes if integration is key. Or reconsider non-resident citizens if subjection is sufficient. But their hesitation suggests integration is crucial. They need a principle precise enough to test, so phrasing it as "subject to ongoing coercion AND integrated into society" could work. It handles most cases but might require them to accept prisoners voting or drop the comatose patient exemption. Highlighting the conflict points helps them decide where to refine their principle.
answer: |-
  Your gut verdicts suggest a principle that combines **subjection to ongoing coercive authority** with **enduring societal integration**, while requiring **minimum agency**. Here's a precise principle derived from your judgments:

  **"Individuals are entitled to vote if they are (a) subject to the state’s ongoing coercive authority in their daily lives, AND (b) enduringly integrated into the society governed by that state, AND (c) possess sufficient cognitive agency to engage in political decision-making."**

  ---

  ### How This Principle Matches Your Verdicts:
  1. **10-year resident non-citizen**  
     ✅ *Subject to laws/taxes daily + deeply integrated.*  
  2. **Non-resident citizen**  
     ❌ *Subject to some laws but NOT enduringly integrated (no daily life/participation).*  
  3. **Cross-border worker**  
     ✅ *Subject to economic/tax rules daily + integrated via labor/community ties.*  
  4. **Tourist**  
     ❌ *Subject to laws temporarily but NOT enduringly integrated.*  
  5. **Stateless person (3+ years)**  
     ✅ *Subject to laws daily + integrated by prolonged residence/community ties (your hesitation may stem from ambiguous integration).*  
  6. **Non-resident citizen (never visited)**  
     ❌ *Subject to some laws (e.g., inheritance) but NOT enduringly integrated.*  
  7. **16yo vs. 9yo**  
     ✅❌ *Both subject to authority, but only 16yo deemed to have sufficient agency (aligns with lowered voting ages in some democracies).*  
  8. **Comatose patient**  
     ❌ *Subject to authority but lacks agency (resolves your conflict without wrecking the list).*  
  9. **Company**  
     ❌ *Not an individual; lacks human agency.*  
  10. **Foreigners affected by dam**  
      ❌ *Subject to cross-border harm but NOT integrated into society; consultation ≠ voting rights.*  

  ---

  ### Where the Principle *Bites* (Forces Revisions):
  - **Prisoners (life sentence):**  
    ➠ **Verdict: YES**  
    *They are intensely subjected to state coercion daily and enduringly integrated (confined within society).*  
    *If this clashes with your intuition, you must drop either the stateless person or revise "integration" to exclude forced presence.*  

  - **Dual citizens voting abroad:**  
    ➠ **Verdict: NO (if not resident)**  
    *Lacks enduring integration in *both* societies simultaneously. Voting rights require active societal participation.*  

  - **Absentee landowners:**  
    ➠ **Verdict: NO**  
    *Subject to property laws but not enduringly integrated (no daily life/community ties).*  

  ---

  ### Conflicts in Your Current Intuitions:
  - **Stateless person (✅) vs. Non-resident citizen (❌):**  
    Your principle resolves this: the stateless person is **integrated via daily presence**, while the non-resident citizen is not. If you feel uneasy about the stateless person, you might be weighting *legal vulnerability* (which they have) against *social belonging* (which may feel incomplete without citizenship).  

  - **Comatose patient (❌):**  
    The **agency criterion** cleanly excludes them without affecting others.  

  - **16yo (✅):**  
    Agency is threshold-based, not gradual—so 16yo qualifies while a 9yo does not.  

  ---

  ### Refined Principle Statement:
  > **"The demos comprises all cognitively capable individuals enduringly integrated into a society and subject to its daily coercive authority."**  

  ### Key Definitions:
  - **Enduringly integrated:**  
    Regular physical presence + participation in social/economic structures (work, education, community) for a significant period (not transient).  
  - **Daily coercive authority:**  
    Bound by laws governing routine life (taxation, property, civil rights, criminal justice).  
  - **Sufficient agency:**  
    Capacity to understand political choices (excludes young children, severe cognitive impairments).  

  ### What You Might Need to Drop/Revise:
  - **Stateless person hesitation:** Your principle demands a firm **YES** if they’re integrated. If you resist this, add a *stability* condition (e.g., "legal pathway to remain").  
  - **Prisoners:** Accept they should vote or redefine "integration" to exclude incarcerated individuals (undermining the stateless person’s claim).  

  This framework captures 9/10 of your intuitions precisely and forces clarity on edge cases. Use it to test new scenarios or adjust definitions for consistency.
