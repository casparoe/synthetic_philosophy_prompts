  So two philosophers walk into a lab where they've wired up Daphne and Delia, two remarkably tolerant sea slugs, to a single, rather cheap, "Consciousness-O-Matic" unit. This unit, the experimenter explains with a slightly nervous cough, monitors both slugs' rudimentary nociceptive pathways. Whenever *either* slug experiences something we'd loosely call 'pain', the box lights up and tokens a single, undifferentiated higher-order representation: "SUBJECT EXPERIENCING PAIN NOW." Crucially, the box has absolutely no clue *which* slug sent the signal; it just broadcasts the thought indiscriminately into the theoretical ether applicable to both organisms. Daphne then gets a carefully administered poke. The box lights up. "Ah!" cries the first philosopher, a staunch HOT theorist, "Consciousness achieved! The higher-order thought 'SUBJECT EXPERIENCING PAIN NOW' is tokened and suitably directed!" "But directed *at whom*?" asks the second, gesturing at the two placid slugs. "Well," stammers the first, "It's about *the* subject in pain... which, in this case, is clearly Daphne." "Except," counters the second, "the mechanism delivers the *exact same* representational state, fulfilling all your criteria for conferring consciousness, to Delia too. By your lights, doesn't Delia now also consciously experience Daphne's pain, or perhaps they jointly possess a single, multiply-subjected conscious pain state?" The HOT theorist stares at the slugs, then the box, then his colleague, and sighs, "Look, the theory is perfectly clear: consciousness *just is* a first-order state accompanied by the right kind of higher-order thought. So... yes? I suppose they're both consciously in pain now? Or rather, Daphne is consciously in pain *and* Delia is consciously aware of *that* pain? Honestly, it’s a bit like cheap wifi – once the signal’s broadcasting, everyone on the network gets the content, whether it’s meant for them or not. Maybe we should just bill them for mutual consciousness and call it a feature?"

  The humor here turns on the higher-order theory's core commitment that consciousness is exhaustively constituted by a first-order state being targeted by a specific kind of higher-order representation. The shared monitor scenario forces this commitment into an absurdity: because the identical, undifferentiated higher-order state is delivered to both organisms simultaneously upon *either* experiencing pain, the theory lacks the resources to explain why only the actual pain-sufferer should be conscious of the pain, or to avoid the conclusion that both become conscious of the same pain state. It highlights the theory's inability to intrinsically fix the referent or the subjective 'owner' of the conscious state based solely on the higher-order representational mechanism itself, mirroring the misrepresentation problem but with two valid targets instead of none, exposing the same explanatory gap concerning the first-person perspective.
