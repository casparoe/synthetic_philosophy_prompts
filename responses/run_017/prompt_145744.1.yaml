prompt: |-
  For a piece I am writing on how institutions quietly accumulate something very like case law while insisting that every decision is sui generis, I have been following the restitution and shared-stewardship committee of one of the large encyclopedic museums; I have anonymised the institution and altered the details of the objects themselves, because its deliberations are confidential. Here is the track record I have reconstructed. (1) A corpus of court regalia and ancestral altar pieces carried off during the sacking of a West African capital by a European punitive expedition — the Benin kind of case — was returned outright, title and all, to the successor state's national heritage authority, subject to written guarantees of conservation, permanent public display, and no onward sale. (2) Architectural sculpture removed from a standing temple-monument with the permission of the authorities then in power — the Parthenon kind of case — was not returned: the committee found the removal lawful at the time and not theft, and offered a long-term renewable loan instead. (3) Ancestral remains taken from a burial ground by a colonial-era surgeon were returned directly to the descendant community, bypassing the state, and the committee accepted that community's stipulation that they be reburied without study or display; it has since indicated in public statements that human remains run on a separate track from objects. (4) A claim by a religious confraternity for liturgical pieces bought at a Brussels sale in the mid-1990s, with a valid export licence from the country of origin, was rejected: a documented post-independence commercial transaction, no coercion, nothing wrongful. (5) A sacred staff handed over as a gift during a treaty negotiation conducted under military pressure was returned to a community trust chartered by the successor state, on the reasoning that the giver's consent had not been free.

  The case now before them is the one I cannot call. Two ivory armlets and a brass commemorative head were bought by the museum's own curator at an Antwerp auction in the early 1900s, in the immediate aftermath of a colonial military campaign against the river kingdom the objects come from; the campaign's records show that the royal compound was entered and burned, and the consignor at the auction was a retired officer who served in it, but nothing ties these particular pieces to that campaign rather than to some earlier circulation. What the museum's files do contain is a letter from the curator to the dealer, written a fortnight before the sale, saying in substance that he would rather not be told how the pieces reached the market and advising that nothing about their origin be put in writing. The claim is a joint one, and the jointness is the difficulty: the successor state's heritage authority wants the objects for a new national museum under the standard public-access guarantees; the descendant royal house, which is on bad terms with that authority, argues that the pieces are not artifacts at all but the regalia of an office, that a museum cannot own them, that they must be veiled and not photographed for part of each year, and that it should keep them in its own shrine-house, which has good climate control but very limited public access; and a third, weaker claim comes from a regional museum in the province of origin that already cares for a related corpus. One further complication is that the museum's governing statute permits permanent disposal only in defined circumstances, so a decision to return may have to be dressed up as something else, as the committee has done at least once before.

  What I want from you is not a verdict on who is morally right, but a reconstruction of the decision the committee should reach if it wants to be consistent with itself, and a prediction of the one it probably will reach. Concretely: what two or three rules fit all five precedents about equally well — some variant of a trace-this-object-to-a-discrete-wrong standard, some variant of a colonial-context standard that puts the burden on the museum to show a genuinely free transfer, perhaps a categorical rule about sacred or inalienable things — and where exactly do those rules come apart on this case? Which earlier decision is the closer analog: the access-and-conservation conditions attached in (1), or the deference to a receiving community's own norms in (3), or the invalidity-of-consent reasoning in (5)? What does each candidate rule predict about title, about which of the three claimants should receive, and about whether conditions such as veiling or a photography ban can be accepted at all? What is your single best guess at the outcome and the reasons for preferring it? If the precedents genuinely underdetermine the case, say so plainly and tell me what principle the committee would be adopting with each of the live options. And finally, since I get to interview two of its members next month: what one hypothetical further claim, and what one question put directly to them, would best expose which rule they are actually running?
reasoning: |-
  Hmm, the user is writing a piece about how institutions build case law-like precedents while claiming each decision is unique. They’ve shared anonymized cases from a museum’s restitution committee and need help analyzing a complex new case with three competing claimants.  

  First, I need to unpack the precedents to extract implicit rules. Case (1) shows colonial violence triggers unconditional return with access/conservation strings. Case (2)’s “lawful removal” standard protects acquisitions without coercion. Case (3) prioritizes descendant communities over states for human remains, accepting their ritual constraints. Case (4) upholds clean commercial transactions. Case (5) voids consent under duress, returning to community trusts.  

  The current case is messy: ivory armlets and a brass head bought post-conquest, with a shady curator letter hinting at dodgy provenance. Three claimants: the state (wants museum display), the royal house (demands ritual use with veiling), and a regional museum. The committee must juggle colonial context vs. lack of direct loot proof, while navigating legal constraints on disposals.  

  For consistency, I see two clashing rules emerging:  
  - **Rule A (colonial-context standard)**: Burden shifts to museum to prove clean acquisition when objects surface right after violence. Would favor return, but to whom? Precedent (1) points to state, but (3)/(5) support non-state actors.  
  - **Rule B (discrete-wrong standard)**: Requires smoking-gun evidence of theft. The letter is suspicious but circumstantial—might lean toward rejecting like case (4).  

  The curator’s “don’t tell me” letter is key. It echoes case (5)’s coercion vibe but lacks a direct tie like “taken at gunpoint.” Precedent (3) is tempting for the royal house’s ritual claims, but these aren’t human remains. Precedent (1)’s access requirements clash with veiling demands.  

  Prediction: Committee will split the baby. They’ll return based on colonial context (Rule A) but send to the regional museum—a compromise that satisfies “return” symbolism while avoiding state/royal feud and honoring precedent (1)’s access norms. They’ll frame it as a “loan” to skirt disposal rules, citing case (2)’s playbook.  

  For the user’s interview prep:  
  - **Hypothetical claim test**: Pose a case with identical colonial violence but immaculate paperwork. If they still return, Rule A dominates; if not, Rule B does.  
  - **Killer question**: Ask whether the curator’s letter alone meets their threshold for “tainted acquisition.” Their answer reveals if circumstantial evidence suffices (Rule A) or not (Rule B).  

  The precedents genuinely underdetermine this because:  
  - Choosing royal house means adopting a new “sacred inalienables” rule.  
  - Choosing state means ignoring community norms from (3)/(5).  
  - Keeping objects prioritizes legalism over ethics.  

  Ultimately, committees like this reveal their true principles through gaps and compromises—exactly what the user’s piece is about.
answer: |-
  Based on your reconstructed precedents and the complexities of the current case, here's a breakdown of the implicit rules, their application, and predicted outcomes for the committee:

  ---

  ### **Reconstructed Rules from Precedents**
  1. **Colonial Violence Standard**: Objects linked to *documented military looting or punitive expeditions* (e.g., sacked capitals) warrant unconditional restitution to the state or recognized successor authority, with conservation/access conditions.  
     - *Source*: Case (1) – Benin-type looting.  
     - *Threshold*: Direct evidence of forcible removal during conflict.  

  2. **Invalid Consent Standard**: Transfers under duress (military pressure, occupation) void title, favoring return to descendant communities.  
     - *Source*: Case (5) – treaty "gift" under coercion.  

  3. **Lawful Acquisition Standard**: Objects obtained via *documented legal transactions* (state permission, clean post-independence sale) are retained.  
     - *Source*: Cases (2) (Parthenon: lawful removal) & (4) (post-independence sale).  

  4. **Communal/Sacred Status Exception**: Human remains or culturally inalienable items bypass state claims, deferring to community norms (e.g., reburial, ritual restrictions).  
     - *Source*: Case (3) – ancestral remains returned directly to descendants.  

  ---

  ### **Where the Rules Conflict in the Current Case**
  - **Colonial Context vs. Lawful Acquisition**:  
    - The 1900s auction occurred *immediately after* a violent campaign, with the seller a participant and the curator’s letter implying awareness of dubious provenance. This pressures the committee toward Rule 1 (colonial violence).  
    - **But** no direct evidence links these *specific objects* to looting (unlike Case 1). The auction had legal trappings (public sale, no theft claim), invoking Rule 3 (Case 4).  
  - **Communal Sacredness vs. State Authority**:  
    - The royal house claims ritual status (veiling, no photos), echoing Rule 4 (Case 3). Yet these are objects, not remains, and the state demands public access (Rule 1).  
  - **Consent Ambiguity**:  
    - The curator’s letter suggests coercive origins (Rule 2/Case 5), but lacks explicit proof like Case 5’s "military pressure."  

  ---

  ### **Closest Analog: Case (5)**
  - The curator’s attempt to obscure provenance parallels Case 5’s "consent under duress." Both imply a cover-up of unethical acquisition, shifting the burden to the museum to prove legitimacy.  

  ---

  ### **Predictions Under Each Rule**
  | **Rule Applied**       | **Title Outcome**       | **Recipient**          | **Conditions Accepted?**                |  
  |-------------------------|--------------------------|------------------------|-----------------------------------------|  
  | **Colonial Violence**   | Return to state         | National heritage authority | Yes (public access, no sale) – veiling rejected |  
  | **Invalid Consent**     | Return to community     | Royal house            | Yes (veiling, no photos) – public access waived |  
  | **Lawful Acquisition**  | Retain                  | N/A                    | N/A                                     |  
  | **Sacred Exception**    | Return to community     | Royal house            | Yes (ritual restrictions)               |  

  ---

  ### **Predicted Outcome & Reasoning**
  **Best Guess**: **Conditional return to the regional museum**, framed as a "permanent custodial loan" to bypass disposal statutes (as hinted in your note).  
  - **Why?**  
    1. **Avoids State/Royal Feud**: The regional museum is a neutral compromise, satisfying "provenance ties" (Rule 1 light) while sidestepping political conflict.  
    2. **Preserves Access**: Aligns with Case 1’s conservation/display ethos, rejecting the royal house’s veiling demands (unlike Case 3’s remains exception).  
    3. **Leverages Ambiguity**: No smoking gun links objects to looting, so outright return to state/royals is risky. The curator’s letter taints legitimacy but doesn’t *prove* theft, enabling a middle path.  
    4. **Procedural Fix**: "Loan" structure mirrors Case (2)’s workaround for disposal limits.  

  **Committee’s Likely Justification**:  
  > *"While colonial context raises ethical concerns, evidentiary gaps preclude assigning these objects to a specific wrongful act. Transferring stewardship to the regional museum—which shares conservation capacity and cultural ties—balances ethical responsibilities with public trust obligations."*  

  ---

  ### **Underdetermination & Live Options**  
  The precedents **genuinely underdetermine** this case. The committee must choose between:  
  - **Option A (Rule 1 Lite)**: "Proximity to violence + provenance opacity = restitution." Favors state/regional return.  
  - **Option B (Rule 4 Expansion)**: "Ritual significance overrides state/museum claims." Favors royal house.  
  - **Option C (Rule 3 Strict)**: "No proof of theft = retain." Favors museum.  

  Each choice creates new precedent:  
  - **A** extends colonial-violence claims to circumstantial cases.  
  - **B** elevates "sacred inalienables" beyond human remains.  
  - **C** shields museums from claims without direct looting evidence.  

  ---

  ### **Interview Strategy: Exposing Their Logic**
  1. **Hypothetical Claim**:  
     > *"Imagine a sacred mask purchased legally in 1920 from a colonially appointed chief. The chief’s authority is now contested, and descendants demand return for ritual use (non-display). How would you weigh lawful acquisition vs. post-colonial legitimacy?"*  
     - **Why**: Tests if they prioritize Rule 3 (clean transaction) or Rule 4 (community norms), revealing their tolerance for re-evaluating "legality."  

  2. **Key Question**:  
     > *"In Case (5), the treaty ‘gift’ was voided due to military pressure. Would the curator’s letter alone—hinting at suppressed provenance—meet your threshold for invalid consent, even without proof these objects were looted?"*  
     - **Why**: Forces them to define if "suspicion of coercion" suffices (leaning Rule 2) or if direct evidence is required (leaning Rule 3).  

  ---

  This framework should help you decode the committee’s unspoken jurisprudence. Their struggle here epitomizes your thesis: even as they disavow precedent, their need for consistency will force a rule-bound outcome—likely one that papers over contradictions with procedural creativity.
