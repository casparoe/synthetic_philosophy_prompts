  The core tension I see is between their desire for a natural joint-carving boundary and the inherent gradualism of dissipative systems. Thermodynamics doesn't deal in sharp cutoffs - entropy gradients are continuous, self-organization exists on a spectrum. Yet they want composition to be determinate. This seems fundamentally unstable.

  Let me structure the objections by severity. The threshold problem feels most damaging because it attacks the very motivation for the view - avoiding arbitrariness. If "enough self-maintenance" is vague, we've just moved the vagueness elsewhere. And unlike universalism/nihilism which are at least precisely vague, this view claims precision while smuggling in fuzziness.

  For the temporal dimension issue, I need to consider whether insisting on composition holding over intervals rather than instants forces temporal parts ontology. That might be acceptable if they're willing to accept a weaker form of four-dimensionalism. But their commitment to "determinate composition" suggests they want synchronic unity.

