  The requested table-ready sentence must carry the ancient claim: "My only move is choosing how to play my range; the rest is deck mechanics." This forces ownership of judgment while accepting all outcomes as indifferent. If this feels alien to poker thinking, that reveals Stoicism's radical core - it's not about winning hands, but about winning agency.

