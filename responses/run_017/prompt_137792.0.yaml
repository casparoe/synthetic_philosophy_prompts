prompt: |-
  I write novels — four out, fifth one in revisions, the usual — and I've somehow let myself be talked into running a 75-minute session at a writers' festival this spring, nominally on "writing characters who decide." About 12 people, all novelists or wanting to be, which means they're word people who will visibly check out the second anything looks like a math problem or a philosophy seminar. So: no Greek letters, no expected-utility notation on a whiteboard, no lecture up front, and ideally nothing that requires me to say "decision theory" until the last ten minutes. They should do something, get a result they didn't expect, and only afterwards find out they've walked into an argument.

  The thing I actually want them to feel is a gap I keep tripping over in my own drafts: the difference between asking "what should I do, here, now, given everything I now know" and asking "what should the thing that is me have settled on in advance, before it knew which situation it would land in." My version of it is the dead-mother promise — my protagonist swore to her dying mother that she'd do X, the mother is now dead, the whole reason for doing X evaporated with her, and the interesting question is whether "the reason is gone" actually settles it or whether there's a separate question about what kind of person she is being when she decides. I've read a little of this online under names like updateless or policy-first decision theory, including the coin-flip case where you're asked to hand over money after the coin has already come up the wrong way and the payoff is gone either way, and the one about the driver who can't tell which of two identical exits he's at. What I'd love is a game that stages this without naming it: something where participants write down a sealed answer before a coin is flipped, then a second round where they get to decide on the spot after seeing the flip, and most of them notice that their own two answers disagree — and then one more beat that shows the sealed envelope isn't what's doing the work, because it isn't really about physically binding yourself, it's about what your answer now tells you about what you'd have said in the branch you're not in. (One variant I toyed with: tell them they're one of two copies of the same character, separated, each seeing a different card, and that only one of them is ever asked to pay. Do with that what you like, or throw it out.)

  What I need is the actual runnable thing: rules, what I have to bring (index cards, envelopes, a coin, chips or paper points — no real money, and nothing that requires arithmetic harder than "would you give up 3 to get 8"), a minute-by-minute timeline for 75 minutes, and a debrief that maps specific moments in the room onto specific parts of the idea, including which move each round is supposed to make them walk into. Tell me honestly what will go wrong the first time I run it — my guess is someone refuses to play on the grounds that the setup is impossible, or half the room just picks whichever option sounds nicer and nothing bites — and how I should handle that. Also be frank about what the game can't reproduce and I'll have to say out loud myself, because I'd rather know now than discover it in front of twelve people. If there's time left at the end I'd like them to go back to their own manuscripts and find one scene where a character keeps or breaks a commitment whose rationale has already expired, so the last stretch shouldn't be pure talk. And please lead with the bottom line in your first sentence — the one-line version of the activity, or the sentence I'd put at the top of the handout — then give me the details; no preamble and no restating what I just asked for.
reasoning: |-
  We are going to run an interactive exercise called "The Sealed Envelope Game" to explore how decisions made in advance (like promises) can conflict with what seems best in the moment. 

  **Bottom Line:** Participants will write down a binding decision for a future scenario (before knowing key details) and then face the same scenario with full information, revealing a tension between pre-commitment and situational choice.

  ---

  ### **What You Need to Bring:**
  - Index cards (at least 2 per participant)  
  - Envelopes (1 per participant)  
  - A coin (to flip)  
  - Poker chips or paper tokens (about 20 per participant; use 3 colors: e.g., red for "points", blue for "tokens", white for "nothing" — but adjust as needed)  
  - A timer  
  - Handout (optional, with rules and reflection prompts)  

  ---

  ### **Game Rules: The Sealed Envelope Game (3 Rounds)**

  **Premise:**  
  You are an agent in a two-stage game. In Stage 1, you must decide in advance (without knowing a key coin flip) whether to pay 3 points to secure a chance at 8 points later. In Stage 2, you learn the coin flip and decide again whether to pay 3 points for the same 8-point chance — but the rules change slightly each round to probe the tension.

  ---

  ### **Setup (5 minutes)**  
  - Distribute:  
    - 10 points (red chips) to each participant.  
    - 1 envelope and 2 index cards per person.  
  - Explain: *"We’re going to play a short game about decision-making. You start with 10 points. Your goal is to end with as many as possible. There will be two stages. First, you’ll write a decision on a card, seal it in an envelope, and hand it to me. Then, I’ll flip a coin and reveal the outcome. After that, you’ll make a second decision for the same scenario. I’ll collect both and pay out points at the end."*

  ---

  ### **Round 1: The Basic Tension (20 minutes)**  
  1. **Stage 1: Pre-Commitment (5 min)**  
     - *Instruct:* "Write on your first card: **YES** or **NO**. If you write YES, it means: *‘I agree to pay 3 points now to buy a ticket. If the coin lands HEADS, I get 8 points. If TAILS, I get nothing.’* If NO, you pay nothing and get nothing. Seal the card in the envelope and hand it to me."  
     - Collect envelopes.  

  2. **Stage 2: The Coin Flip (2 min)**  
     - Flip a coin publicly. Announce result (e.g., HEADS).  
     - *Instruct:* "Now, on your second card, write **YES** or **NO** for the same deal: Pay 3 points. If the coin is HEADS, you get 8 points (so net +5). If TAILS, you get nothing (net -3). But note: the coin has *already been flipped*. You know it’s HEADS."  

  3. **Payout (5 min)**  
     - Open envelopes. For each participant:  
       - If Stage 1 was YES: Deduct 3 points. If coin was HEADS, add 8.  
       - If Stage 1 was NO: No deduction, no gain.  
     - Now apply Stage 2 decision:  
       - If Stage 2 was YES: Deduct 3 points. Since coin is HEADS, add 8.  
       - If Stage 2 was NO: Nothing.  
     - *Crucially:* Pay out BOTH stages. Participants see two separate transactions.  
     - Have participants calculate total points.  

  4. **Debrief Round 1 (8 min)**  
     - Ask:  
       - *"How many of you wrote YES in Stage 1?"* (Likely most: pre-commitment to +5 expected value.)  
       - *"How many wrote YES in Stage 2?"* (Likely all: it’s a guaranteed +5.)  
       - *"Notice: In Stage 1, you didn’t know the coin flip. In Stage 2, you did. Does anyone feel conflicted about having to honor the Stage 1 decision?"*  
     - **Key Point:** *"In Stage 1, you were buying a ticket to a gamble. In Stage 2, you were buying a known result. But what if the coin was TAILS? Would you still want to pay 3 for nothing?"*  

  ---

  ### **Round 2: The Dead Mother Promise (20 minutes)**  
  *Modify the rules to mirror the "promise" scenario: Only one stage is binding, but which one?*  

  1. **Stage 1: The Promise (5 min)**  
     - *Instruct:* "Same as before, but now imagine: You made a promise to your dying mother to always buy this ticket. Write **YES** or **NO** on your card. Seal it."  
     - Collect envelopes.  

  2. **Stage 2: The Moment of Truth (3 min)**  
     - Flip coin (e.g., TAILS).  
     - *Instruct:* "The reason for the promise (your mother) is gone. Write **YES** or **NO** now: Will you pay 3 points for a ticket that gives 8 points only if HEADS? (Coin is TAILS — so if you pay, you lose 3 and get nothing.)"  

  3. **Payout (5 min)**  
     - Pay out ONLY ONE decision per participant:  
       - Randomly select half the room to have their Stage 1 decision honored.  
       - The other half uses Stage 2.  
     - (This randomness forces them to consider: *Which version of ‘you’ do you want to be?*)  

  4. **Debrief Round 2 (7 min)**  
     - Ask:  
       - *"If your Stage 1 was YES but the coin was TAILS, how did it feel to be forced to pay 3 for nothing? If you used Stage 2 and wrote NO, how did it feel to break the promise?"*  
       - *"If you had to choose ONE of these two decision-rules to live by forever, which would you pick? Why?"*  
     - **Key Point:** *"The ‘promise’ (Stage 1) was made when you didn’t know the coin flip. Now, in Stage 2, the reason (mother) is gone, and you see TAILS. Is breaking the promise about being practical? Or is it about who you are?"*  

  ---

  ### **Round 3: The Copycat Paradox (15 minutes)**  
  *Introduce the "two copies" idea to show pre-commitment isn’t about physical binding.*  

  1. **Stage 1: The Twin Scenario (5 min)**  
     - *Instruct:* "Imagine you’re cloned. You and your twin are separated. Each sees a coin flip: one HEADS, one TAILS. Only one of you will be asked to pay 3 points for the ticket. But you must decide NOW: If asked, will you pay? Write **YES** or **NO** for both copies. Seal it."  
     - Collect envelopes.  

  2. **Stage 2: The Reveal (3 min)**  
     - Flip coin. Tell participants: *"If the coin is HEADS, the ‘HEADS copy’ is asked. If TAILS, the ‘TAILS copy’ is asked."*  
     - *Instruct:* "Now that you know which copy you are (e.g., if coin is HEADS, you’re the HEADS copy), write **YES** or **NO**: Will you pay 3 points? Remember: Only the copy in the matching world is asked."  

  3. **Payout (4 min)**  
     - Pay out BOTH:  
       - Stage 1: If you wrote YES, and you are the copy who is asked, deduct 3 and add 8 if your world matches (e.g., HEADS copy in HEADS world gets 8).  
       - Stage 2: Your decision now.  
     - *But note:* In Stage 1, you bound both copies. In Stage 2, only the asked copy decides.  

  4. **Debrief Round 3 (3 min)**  
     - Ask:  
       - *"Did your Stage 1 and Stage 2 answers differ? Why?"*  
       - *"In Stage 1, when you bound both copies, were you trying to protect the copy in the TAILS world? Or maximize overall points?"*  
     - **Key Point:** *"The sealed envelope wasn’t magic. It was about what you think your HEADS-self and TAILS-self should do, before knowing which you are. When you later become one of them, you might want to defect — but if both defect, both lose."*  

  ---

  ### **Final Debrief: The Big Picture (15 minutes)**  
  - **Name the Concept (5 min):**  
    - *"What we’ve been playing with is called ‘updateless decision theory’ or ‘policy-first choice’. It asks: What rule would you set for all versions of you, in all possible situations, before you know which one you’ll be?"*  
    - Map the rounds:  
      - Round 1: Conflict between advance vs. spot decisions.  
      - Round 2: The ‘dead mother promise’ — when the reason expires, is the rule still you?  
      - Round 3: It’s not about envelopes — it’s about coordinating with your other selves.  

  - **Application to Writing (10 min):**  
    - *"Turn to your manuscript. Find a scene where a character faces a choice like this: a promise made in the past, but the reason for it is gone. Does the character ask: ‘What should I do now?’ or ‘What kind of person am I?’"*  
    - Have them jot notes (2 min), then share with a partner (3 min).  
    - Volunteers share insights (5 min).  

  ---

  ### **What Will Go Wrong (and How to Handle It):**  
  1. **"This is unrealistic / I’d never be in this situation!"**  
     - *Response:* "Absolutely. It’s a metaphor. In real life, we don’t flip coins for life choices — but we do make rules for ourselves (diets, vows, insurance) and then face moments where breaking them seems harmless. Think of it as a fable."  

  2. **Half the room always picks the "nice" option (e.g., keeping promises).**  
     - *Lean in:* "Great! That’s a valid choice. But let me ask: In Round 3, if you’re the TAILS copy and you know your HEADS twin will pay and win, why not let them cover for you and save your 3 points?"  

  3. **Confusion about payouts.**  
     - Use chips for visual math. Walk through one example publicly each round.  

  4. **Someone refuses to play.**  
     - *Response:* "No problem. You can observe and participate in discussion. Your real-world examples are valuable!"  

  ---

  ### **What the Game Can’t Do (and You Must Say):**  
  - It simplifies morality to points. Real promises involve guilt, identity, social consequences.  
  - It assumes rational self-interest. Characters (and people) aren’t always rational.  
  - The "copies" scenario is sci-fi. In fiction, this might manifest as flashbacks, alternate POVs, or internal conflict.  

  ---

  ### **Timeline Summary:**  
  - **0:00–0:05:** Setup  
  - **0:05–0:25:** Round 1 (Basic Tension)  
  - **0:25–0:45:** Round 2 (Dead Mother Promise)  
  - **0:45–1:00:** Round 3 (Copycat Paradox)  
  - **1:00–1:15:** Final Debrief & Writing Application  

  You’ve got this. The moment they see their own Stage 1 and Stage 2 answers clash, they’ll feel the gap — and your novels will feel richer for it.
answer: |-
  ### **Bottom Line:** Participants play a 3-round game where they first pre-commit to a decision (via sealed envelope), then face the same choice with full information, revealing a conflict between advance planning and in-the-moment reasoning—mirroring the "dead mother promise" dilemma.

  ---

  ### **What You Need**  
  - **Supplies:**  
    - 1 coin (visible to all).  
    - Index cards (3 per person).  
    - Envelopes (1 per person).  
    - Poker chips or paper "points" (10 per person; 1 chip = 1 point).  
    - Timer.  
  - **Setup:**  
    - Chairs in a circle.  
    - Distribute 10 chips, 1 envelope, and 3 index cards to each person.  

  ---

  ### **Game Rules & Script**  
  **Total Time:** 75 minutes (strictly timed).  

  #### **Round 1: The Basic Conflict** (25 min)  
  *Goal: Expose the gap between pre-commitment and situational choice.*  
  1. **Stage 1: Pre-Commit (5 min)**  
     - *Script:* "Write **YES** or **NO** on Card 1. **YES** = *‘I agree to pay 3 chips now for an 80% chance to win 10 chips later.’* **NO** = *‘I pay nothing and get nothing.’* Seal Card 1 in your envelope and hand it to me. *Don’t overthink—go with your gut.*"  
     - *Collect envelopes.*  

  2. **Stage 2: Decide in the Moment (5 min)**  
     - Flip coin publicly. Announce: "Heads = you get the 80% win chance; Tails = 0% chance."  
     - *Script:* "On Card 2, write **YES** or **NO** *again* for the same deal: Pay 3 chips now. But now you know the coin result."  

  3. **Payout & Reveal (10 min)**  
     - Open envelopes. For each person:  
       - If Stage 1 was **YES**: Take 3 chips. If coin was **Heads**, add 10 chips (net +7). If **Tails**, add 0 (net -3).  
       - If Stage 1 was **NO**: Do nothing.  
     - Then apply Stage 2: Same rules (deduct 3 if YES, add 10 only if Heads).  
     - *Result:* Most pre-commit **YES** (expecting profit), but if coin is Tails, their Stage 2 is **NO** (avoiding loss).  

  4. **Debrief (5 min)**  
     - Ask: *"Who had different answers in Stage 1 vs. Stage 2? Why?"*  
     - *Key Point:* "Stage 1 was ‘What should I lock in, not knowing the coin?’ Stage 2 was ‘What should I do now I see the coin?’ Your answers disagreed. That’s the gap."  

  ---

  #### **Round 2: The "Dead Mother Promise"** (25 min)  
  *Goal: Show that binding yourself isn’t about the envelope—it’s about identity.*  
  1. **Stage 1: The Promise (5 min)**  
     - *Script:* "Imagine you swore to your dying mother you’d do this. On Card 1, write **YES** or **NO**. Seal it. *This is who you are—someone who keeps promises.*"  
     - *Collect envelopes.*  

  2. **Stage 2: The Broken Rationale (5 min)**  
     - Flip coin (ensure **Tails** this round—rig if needed). Announce: "Your mother is gone. Paying 3 chips gives you 0% chance of winning (since Tails)."  
     - *Script:* "On Card 2, write **YES** or **NO**. *The reason for the promise is gone. What do you do now?*"  

  3. **Payout & Reveal (10 min)**  
     - Pay out ONLY Stage 2 decisions (ignore envelopes).  
     - *Result:* Most say **NO** (no gain in paying).  

  4. **Debrief (5 min)**  
     - Ask: *"If you broke the promise, did it feel like betraying yourself? If you kept it, why?"*  
     - *Key Point:* "The envelope didn’t force you—it symbolized a prior ‘you.’ When the reason expired, you faced: ‘Am I the kind of person who keeps promises, or the kind who adapts?’"  

  ---

  #### **Round 3: The Copycat Paradox** (15 min)  
  *Goal: Prove pre-commitment is about coordinating with "other selves," not physical binding.*  
  1. **Stage 1: The Twin Scenario (5 min)**  
     - *Script:* "You and your identical twin were separated. One sees Heads, one sees Tails. Only one twin will be asked to pay 3 chips. On Card 1, write **YES** or **NO** for *both* twins. Seal it."  
     - *Collect envelopes.*  

  2. **Stage 2: The Isolated Choice (5 min)**  
     - Flip coin. Announce: "Heads = you’re the twin in Heads-world; Tails = Tails-world."  
     - *Script:* "On Card 2, write **YES** or **NO** *only for your twin’s world*. If you pay, you lose 3 chips. Only Heads-world wins 10 chips."  

  3. **Payout & Reveal (5 min)**  
     - Pay based on Stage 2.  
     - *Result:* Stage 1 often **YES** (maximizes group gain). Stage 2 often **NO** if Tails (self-interest).  

  ---

  ### **Final Debrief & Writing Application** (10 min)  
  - **Name the Concept (3 min):**  
    - *Script:* "This is ‘updateless decision theory.’ Your pre-commitment asked: ‘What should all versions of me do, before I know which one I am?’ The conflict arises because once you’re ‘you,’ you ignore the other branches."  
  - **Map to Fiction (7 min):**  
    - *Activity:* "Take 3 minutes to find a scene in your manuscript where a character faces an expired-commitment dilemma (e.g., a vow, oath, or plan). Did they ask ‘What should I do now?’ or ‘What would the me-who-made-this-promise expect?’"  
    - *Discuss:* Volunteers share (4 min).  

  ---

  ### **What Will Go Wrong (and How to Fix It)**  
  1. **"This is unrealistic!"**  
     - *Response:* "It’s a metaphor. In fiction, think of it as a ghost of the past self judging the present self. Does your character feel haunted?"  
  2. **Players optimize for "niceness" (e.g., always keep promises).**  
     - *Force the bite:* In Round 2, rig the coin to Tails. Ask: "If paying 3 chips does nothing, is keeping the promise self-respect or self-sabotage?"  
  3. **Analysis paralysis.**  
     - *Solution:* Use timers (1–2 min per decision). Say: "Gut choices only—we’re mining for instinct, not math."  
  4. **Confusion about payouts.**  
     - *Prevent:* Use chips for visual math. Demo one example publicly.  

  ---

  ### **What the Game Can’t Do**  
  - **Morality vs. rationality:** The game frames it as points, but real dilemmas involve guilt, honor, or love. *Say:* "In fiction, amplify the emotional stakes. The ‘points’ are your character’s self-worth."  
  - **The "why" of pre-commitment:** It can’t show why we make promises (love, fear, duty). *Say:* "The game isolates the conflict, but your job is to give it teeth through backstory."  
  - **Group dynamics:** Solo decisions miss social pressure (e.g., reputation). *Say:* "Add witnesses to the scene—breaking a vow hits harder when someone’s watching."  

  --- 

  ### **Timeline Cheat Sheet**  
  - **0:00–0:05:** Distribute supplies, explain Round 1.  
  - **0:05–0:30:** Round 1 (Pre-commit → Coin flip → Decide → Debrief).  
  - **0:30–0:55:** Round 2 (Promise → Broken rationale → Decide → Debrief).  
  - **0:55–1:10:** Round 3 (Twin scenario → Isolated choice → Debrief).  
  - **1:10–1:15:** Final debrief → Writing application.  

  You’ll force the gap open when Round 1’s envelope and in-the-moment decisions clash. The rest is making them stare into it.
