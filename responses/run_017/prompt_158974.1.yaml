answer: |-
  **MEMORANDUM**  
  **TO:** Newly Appointed Assessors, Office for the Assessment of Prodigies (OAP)  
  **FROM:** Senior Assessor, Verification & Uniformity Division  
  **SUBJECT:** Standard Operating Procedure for Prodigy Claims Assessment  

  Welcome to the Office for the Assessment of Prodigies. Your role is to evaluate claims of anomalous events (hereafter "Prodigies") against established natural law. Our methodology, refined over decades, ensures objectivity by weighting uniform experience above testimonial evidence. Adherence to procedure is paramount; deviation risks compromising the **Uniformity Reserve** – the foundational stockpile of unbroken experiential consensus upon which all rational assessment depends.  

  **Core Principle:** Natural law is a summary of uniform experience. Testimony alleging exceptions must therefore be measured against this accumulated weight. Your task is not to investigate *whether* an alleged event occurred, but to determine whether testimony *can*, in principle, outweigh the Reserve.  

  **Key Procedures:**  

  1.  **The Uniformity Reserve (UR):** Consider the UR the office’s capital. It represents the totality of unviolated natural law, accrued through centuries of observation. Every prodigy we *certify* constitutes a debit against this Reserve. Certification is thus a significant decision, diminishing the very resource that grants our assessments authority. Should the UR fall below critical levels (determined actuarially), an **Emergency Restoration of Uniform Experience (ERUE)** is triggered. During ERUE, previously certified prodigies are retroactively reclassified. Common outcomes include: re-categorisation as "unusual but lawful" (e.g., "spontaneous remission, not divine healing") or "insufficiently witnessed" (due to newly identified flaws in original testimony standards). This restores UR integrity. Expect ERUE drills quarterly.  

  2.  **Witness Calibration - Retrospective Barbarism Index (RBI):** Not all testimony carries equal weight. We calibrate witness reliability using the RBI. Points are assigned based on:  
      *   **Century of Occurrence:** Earlier centuries attract higher barbarism penalties (pre-Enlightenment = significant burden).  
      *   **Latitude:** Distance from major centres of established natural philosophy increases RBI. Tropical zones generally score higher than temperate.  
      *   **Perceived Gain:** Points escalate based on witnesses' potential benefit from being associated with the prodigy (e.g., elevation to sainthood, founding a sect, acquiring land/wealth). Holy orders automatically receive a moderate gain penalty. High RBI scores drastically reduce testimonial weight, often rendering it insufficient against the UR baseline.  

  3.  **The Offset Rule:** Prodigy claims frequently cluster within competing ideological frameworks. The evidential value of such claims is mutually corrosive. When rival traditions report prodigies supporting their specific doctrine, these claims **offset**. Assessors are authorised to declare two or more sects, regardless of their mutual animosity or doctrinal differences, a **Single Offset Group** for assessment purposes. Prodigies within the group cancel each other out, preserving the UR. Documentation should cite "Cross-doctrinal experiential nullification" as the rationale.  

  4.  **The Testimony Equilibrium Protocol:** Occasionally, documentation for an alleged prodigy is exceptionally rigorous – multiple credible witnesses (post-RBI adjustment), physical traces, contemporary verification. Here, the core question arises: *Which is more miraculous – the alleged event occurring, or this entire body of testimony being false?* **Crucially, you are forbidden from investigating the event itself.** Should the equilibrium tip towards the testimony's falsehood appearing *less* credible than the prodigy, **Senior Assessors** (Level 3+) are activated. Their sole task is to generate increasingly sophisticated, naturalistic explanations for the *testimony's existence and coherence*, not the event. Standard models include:  
      *   **Mass Suggestion Cascade:** Self-reinforcing group delusion.  
      *   **Pious Forgery Network:** Coordinated fabrication for doctrinal/political gain.  
      *   **Herd Delusion with Anomalous Environmental Triggers:** Unexplained atmospheric phenomena inducing shared hallucination.  
      The goal is to construct a narrative where the *falsehood of the testimony*, however complex its genesis, remains marginally *less* incredible than the prodigy breaching the UR. Complexity is acceptable; breaching the UR is not.  

  **Summary:** Your duty is the preservation of the Uniformity Reserve. Certify sparingly. Apply the RBI rigorously. Invoke the Offset Rule proactively. Utilise the Testimony Equilibrium Protocol defensively. Remember: every certified prodigy weakens the Reserve. ERUE is operationally costly and administratively embarrassing. Rigorous application of these procedures ensures that testimony, particularly that flourishing among the historically remote or ideologically invested, is held in its proper equilibrium against the immutable weight of uniform experience. Maintain deadpan professionalism at all times. Welcome aboard.  

  **Senior Assessor, V&U Div.**  
  **Office for the Assessment of Prodigies**
