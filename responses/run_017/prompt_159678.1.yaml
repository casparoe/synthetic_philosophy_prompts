prompt: |-
  Hi — I'm a retired field hydrologist, thirty years of stream gauges, nutrient budgets and arguing with landowners, and since I retired I've drifted into philosophy. I'm currently auditing a graduate reading group on classical Indian epistemology at the local university, and we just did the Nyāya theory of the pramāṇas — the "sources or instruments of knowledge" business. As I understood the reading: Nyāya standardly recognises four — perception, inference, comparison or analogy (the stock classroom case being someone who's never seen a gavaya but is told it's like a cow, and then picks one out in the forest), and verbal testimony, which the Nyāya authors apparently treat as a genuine source in its own right rather than inference from "she said so, and she's usually right" dressed up. I also gather that rival schools add one or two more, notably some kind of cognition of absence — knowing that the cow is *not* in the barn — which Nyāya supposedly tried to absorb into perception rather than grant separately. I may be garbling that last bit, my notes are a mess, but please take it as roughly what I'm working from and correct me gently if I've got it wrong.

  Here's why I care. I volunteer as data-quality coordinator for our state Rare Species Atlas: ordinary people submit sightings of rare plants, dragonflies, mussels, breeding birds, and we vet maybe eight thousand records a month with a rota of six volunteer reviewers, none of whom is a taxonomist, and realistically about two minutes per record because the queue never stops. The output goes into the state's species-of-concern list and gets cited in land-use and conservation-easement hearings, so a bad record genuinely can trigger survey obligations on someone's property, and a missed good record can mean a population nobody knew about gets ploughed under. So the epistemic stakes are weirdly asymmetric and I've been making it up as I go along. What I want from you is a triage protocol my reviewers could actually run: the questions in order, and crucially a step that classifies *what kind of warrant* each record is offering — direct observation, something inferred from habitat/signs/phenology, something recognised by similarity to a field-guide image or a remembered specimen, or just somebody's word — with a rule for what counts as a sufficient instance of each, when a record needs a second, independent source of a different kind before it can be accepted, where the protocol terminates in "unverifiable, set aside" rather than either accepting or rejecting, and where it has to stop and hand the call to a person because the real question is about how much false-positive versus false-negative risk we're willing to run. I'd also like your view on where an automated image or sound identification app belongs in that scheme, since in practice a lot of records are now "the app said so," and it feels like neither testimony nor inference nor analogy quite fits.

  Please act as someone who is genuinely expert both in classical Indian epistemology and in how evidential standards are actually written down for real-world data, and think this through carefully rather than giving me a generic data-quality checklist with Sanskrit words glued onto the headings. Before you write the protocol itself, do a short brainstorm — five or six bullets — on which of the Nyāya distinctions actually do work in this setting and which are idle wheels that should be dropped, because I'd rather have a protocol that's faithful to the important part of the theory than one that cargo-cults all four categories. Then write the protocol, as something I could hand to a volunteer with no philosophy and no taxonomy, and run it on three of my real cases: (1) a very sharp, clearly identifiable photograph of a rare moth submitted with no date and no locality, well outside its known range; (2) a beginner's record of a rare marsh bird in the wrong month backed only by a phone app's audio identification; (3) a first-state-record sedge from Dorothy, who has been our single most reliable contributor for twenty years and who lost her phone in the swamp, so all we have is a very careful written description of the plant in her own words. I'll warn you that I have a strong instinct that nothing without a photo should ever count, and I also have a strong instinct that Dorothy is basically never wrong, so I want at least one of these three to come out the way I *don't* want it to, and I want you to say plainly which of my two instincts the protocol forces me to give up, and why. Finally, be honest about where the protocol can't settle things — where a human has to decide, and where running any such protocol will systematically misfire.
reasoning: |-
  Okay, let me approach this systematically. The hydrologist-turned-philosopher needs a practical epistemic triage protocol rooted in Nyāya epistemology for verifying rare species records. 

  First, I need to mentally map Nyāya pramāṇas to field data verification:
  - Pratyakṣa (perception) = direct evidence like photos/videos
  - Anumāna (inference) = logical deductions from indirect signs
  - Upamāna (comparison) = ID via field guide/app matching
  - Śabda (testimony) = trusted expert reports

  The key insight is that Nyāya's refusal to treat absence as separate pramāna actually helps here - we can classify "no photo" cases under inference or testimony rather than creating a separate "absence" category.

  For the protocol design, I'm considering a decision tree where each branch terminates in:
  - Accept (single source sufficient)
  - Verify (needs second pramāṇa)
  - Escalate (human judgment needed)
  - Reject (insufficient evidence)

  The real challenge is Dorothy's case - it forces confrontation between my instinct for photo-only verification and śabda's validity. Nyāya would prioritize the reliability of the source over the evidence type, so if Dorothy is truly infallible, her testimony must stand. 

  For the test cases:
  1. The moth photo without metadata fails on anumāna (habitat mismatch) despite pratyakṣa - needs date/location verification
  2. The app ID combines upamāna (sound match) with untested śabda (app reliability) - requires expert review
  3. Dorothy's description is pure śabda - acceptable only if she's vetted as "āpta" (authoritative source)

  The protocol must explicitly define when testimony suffices, which means accepting Dorothy means rejecting photo-only absolutism. I'll have to justify this using Nyāya's criteria for valid śabda: competence, honesty, and corroborative likelihood.

  For the app issue, I'll categorize it as upamāna but with caveats about algorithmic reliability needing śabda-like vetting. The key is requiring secondary verification when the "comparison" tool isn't certified.

  Finally, I need to highlight where human judgment is unavoidable: when evidence conflicts, when source reliability is contested, or when conservation stakes create asymmetric risks. The protocol can't eliminate these - it can only flag them for human review.
answer: |-
  Here’s a Nyāya-inspired triage protocol for your Rare Species Atlas, designed to balance epistemic rigor with practical constraints. I’ll first clarify which Nyāya distinctions *work* in this context, then present the protocol, apply it to your cases, and confess its limits.

  ---

  ### **Key Nyāya Distinctions Applied to Species Records**  
  1. **Perception (Pratyakṣa) = Direct Sensory Evidence**  
     *Relevant*: Photos, videos, or firsthand observations (if witnessed by reviewer).  
     *Threshold*: Unambiguous visual/audio evidence matching diagnostic features.  
     *Idle Wheel?*: Nyāya’s "absence cognition" is absorbed here. "No photo" isn’t absence—it’s *lack* of pratyakṣa, pushing us to other pramāṇas.  

  2. **Inference (Anumāna) = Habitat/Sign-Based Reasoning**  
     *Relevant*: Indirect clues (e.g., nest in typical habitat, host plant for larvae).  
     *Threshold*: Strong ecological consistency (e.g., bog plant in a fen).  
     *Idle Wheel?*: Nyāya’s formal syllogism is overkill—use "plausible ecological inference."  

  3. **Comparison (Upamāna) = Pattern Matching**  
     *Relevant*: ID via field guide, app, or remembered specimen.  
     *Threshold*: Clear match to reference *with no key ambiguities* (e.g., wing pattern unique).  
     *Idle Wheel?*: Nyāya’s "gavaya" analogy works perfectly here—no need to drop.  

  4. **Testimony (Śabda) = Trusted Source**  
     *Relevant*: Expert/submitter credibility.  
     *Threshold*: Requires track record (e.g., >95% accuracy in past submissions).  
     *Idle Wheel?*: This is Nyāya’s crown jewel—*don’t* reduce it to inference.  

  **Automated App IDs**: Treat as **upamāna** (comparison), *not* testimony or inference. Apps match patterns, not testify. But apps lack human discernment—so require secondary validation unless certified error-free.  

  ---

  ### **Triage Protocol: The Four-Pramāṇa Filter**  
  *Rules for reviewers (2 min/record):*  
  1. **Start with Perception (Photo/Audio/Video)**:  
     - ✅ **Accept if**: Diagnostic features unambiguous (e.g., rare orchid’s fused petals visible).  
     - ⚠️ **Flag if**: Blurry, partial, or ambiguous (e.g., "looks like" but key mark obscured).  
     - ❌ **Reject if**: Clearly misidentified (e.g., common mimic species).  

  2. **No Perception? Check Inference (Habitat/Context)**:  
     - ✅ **Accept if**: Strong indirect evidence (e.g., mussel shells below known host fish dam).  
     - ⚠️ **Flag if**: Plausible but weak (e.g., "suitable habitat" with no signs).  
     - ❌ **Reject if**: Habitat implausible (e.g., desert cactus in wetland).  

  3. **No Inference? Check Comparison (Field Guide/App Match)**:  
     - ✅ **Accept if**: Match unique + no lookalikes (e.g., dragonfly with distinct abdominal bands).  
     - ⚠️ **Flag if**: Match possible but confusable (e.g., app IDs similar birdsong).  
     - ❌ **Reject if**: Generic match (e.g., "white egret" in heron territory).  

  4. **Only Testimony? Vet the Source**:  
     - ✅ **Accept if**: Submitter is "āpta" (trusted expert: >95% past accuracy, 20+ records).  
     - ⚠️ **Flag if**: New submitter or mixed record (e.g., 80% accuracy).  
     - ❌ **Reject if**: Anonymous or known inaccuracies.  

  **Cross-Checks**:  
  - **Single Source?** Accept *only* if perception/comparison is diagnostic OR testimony is flawless.  
  - **Two Weak Sources?** Combine (e.g., ⚠️upamāna + ⚠️anumāna → verify with human).  
  - **Conflicting Evidence?** Escalate immediately.  

  **Termination Points**:  
  - **"Unverifiable"**: Insufficient evidence + no credible testimony (e.g., anonymous record with blurry photo).  
  - **Human Judgment Needed**: When stakes are asymmetric (e.g., development pending) or pramāṇas conflict.  

  ---

  ### **Case Applications**  
  **Case 1: Rare moth photo, no date/locality, outside range**  
  - **Perception**: ✅ Diagnostic photo.  
  - **Inference**: ❌ Range/habitat mismatch → *strong negative anumāna*.  
  - **Verdict**: ❌ **Reject**. *Why?* Nyāya prioritizes inference over perception when context invalidates direct evidence. Your "no photo should count" instinct is *wrong* here—perception alone isn’t infallible if contradicted.  

  **Case 2: Marsh bird in wrong month, app audio ID only**  
  - **Perception**: ❌ No raw audio provided.  
  - **Comparison**: ⚠️ App ID (upamāna), but apps err with confusable species.  
  - **Inference**: ❌ Phenology mismatch → negative anumāna.  
  - **Verdict**: ⚠️ **Unverifiable**. *Why?* Weak upamāna + negative anumāna. Escalate for expert review if conservation-critical.  

  **Case 3: Dorothy’s sedge description, no photo, reliable history**  
  - **Perception**: ❌ No visual.  
  - **Testimony**: ✅ Dorothy is *āpta* (trusted source).  
  - **Verdict**: ✅ **Accept**. *Why?* Nyāya holds śabda from a reliable source as valid *pramāṇa*. You must abandon your "no photo" instinct—testimony *can* stand alone if source integrity is proven.  

  ---

  ### **What You Must Surrender**  
  **Give up the "nothing without a photo" rule.**  
  - *Why?* Nyāya validates testimony (śabda) as independent knowledge. Dorothy’s record isn’t "inference" or "guess"—it’s *direct knowledge* via language from a verified source. Rejecting this undermines śabda’s epistemic role.  

  **But keep your "Dorothy is never wrong" instinct.**  
  - *Why?* It aligns with Nyāya’s requirement for source competence (*viśvāsapātram*). Track records matter.  

  ---

  ### **Where the Protocol Fails**  
  1. **Systemic Bias**: Relies on past data to vet testimony. Novel species from new observers may be wrongly rejected.  
  2. **App Limitations**: Treating apps as upamāna ignores algorithmic opacity. A "certified reliable app" list is essential.  
  3. **Edge Cases**:  
     - *Absence records* (e.g., "no frogs heard"): Requires human-driven inference + context.  
     - *Hybrid Evidence* (e.g., photo + dubious testimony): Forces arbitrary weighting.  
  4. **Stakes-Driven Decisions**: When false negatives risk extinction (e.g., last-known population), protocol defaults to human judgment.  

  **Final Advice**: Use this protocol to *sort*, not judge. Escalate 10% highest-stake/highest-ambiguity records for expert review. Nyāya gives you categories, not calculus—your hydrologist’s sense for "preponderance of evidence" still rules.  

  Let me know if you want the protocol condensed into a flowchart for volunteers.
