prompt: |-
  I keep running into a difficulty of a particular shape, and I would like to know whether it has been named and carved, or whether it is one of those things everyone gestures at and nobody has separated.

  The situation I work with is the familiar one: you want to get at what is good for a person, or what they really want, and you are not willing to take their present wants at face value. So you clean them up. You supply the facts they lack, subtract the influence of exhaustion, fear, low mood, addiction, misleading framing, and you reconcile the conflicts among their desires. Call the output the cleaned-up version of the person.

  What I keep noticing is that the cleaning seems to work in two quite different ways, and I cannot tell whether they are two operations or one.

  First case. A woman who eats meat learns, in detail and without defensiveness, what that involves. She does not conclude that she wants to eat less meat. She stops wanting meat. There is no moment at which she both wants it and judges that, all things considered, she should not; the desire itself disappears and is replaced by a different arrangement of tastes. It seems wrong to say she had an all-things-considered preference against meat that she simply did not know about.

  Second case. A man has spent fifteen years on a demanding project, a small business say, which costs him his health and most of his relationships. Asked to imagine himself fully informed about the costs and deliberating well, he gives it up. But the man who gives it up is already a man changed by knowing the costs; the man who has not been changed wants to continue and also wants not to become someone who would stop. A procedure that says supply the facts and leave the agent alone, and a procedure that says let the agent keep thinking until he settles, will disagree here, and their disagreement is not about how much he knows.

  The general shape: informing and reflecting are normally treated as two inputs to one idealization, but over a lot of real material they appear not to commute, and if reflection is pushed far enough there may be several resting points rather than one, with which one is reached depending on where the person started.

  Adjacent things I have come across do not seem to settle it. The sour-grapes or deformed-desire phenomenon is close but reversed in a way I cannot quite state: there the deformed desire is supposed to be discounted, while here the desires that survive full information are the ones the earlier self would call deformed. Weakness of will is plainly different, since nobody is failing to do what they judge best. The phrase what you would want under ideal conditions is the very phrase I am trying to split open, because it does not say whether the ideal conditions are a filter applied to a fixed agent or a process the agent undergoes. And coherent extrapolated volition, which I have seen used in roughly this neighbourhood, looks to me like a proposal for what to do about the difficulty rather than an account of it, and it arrives attached to a different problem altogether.

  So: does the thing I am pointing at have a name, and is it one phenomenon or two? If nothing established fits, say so and give me a name with a definition. Either way I want the carving rather than the label. In particular I would like the nearest concepts and, for each, the respects in which it is not this; boundary cases that decide whether the two halves belong together, such as addiction, religious conversion, and the difference between a child's wants and the adult's; and some indication of whether the distinction has any teeth, that is, whether it forces a real choice between specifying an idealization as a corrected snapshot of an agent and specifying it as the endpoint of a process the agent is allowed to move through.
reasoning: |-
  Hmm, this user presents a sophisticated philosophical dilemma about idealization procedures in desire theory. They're clearly well-versed in ethics and decision theory, using precise terminology like "coherent extrapolated volition" while rejecting adjacent concepts like weakness of will. The core tension is between two models of desire refinement: information-as-filter versus reflection-as-transformation.

  The meat-eater case demonstrates what I'd call epistemic desire shift - new facts directly reconfigure preferences without internal conflict. Whereas the entrepreneur case shows volitional metamorphosis - the process of deliberation alters the agent's fundamental stance toward their project. The key differentiator is whether the agent experiences alienation from their transformed desires.

  For boundary cases: addiction fits the transformation model (recovery creates new preferences), religious conversion depends on type (sudden revelation vs gradual conviction), and child/adult development clearly involves metamorphosis. The teeth of this distinction appear in practical applications - addiction treatment must choose between suppressing cravings (filter) versus building new identities (process).

  Existing frameworks seem inadequate. Elster's adaptive preferences address the inverse problem. Frankfurt's second-order desires capture conflict but not transformation. Griffin's informed desires conflate the two models. The most promising lead is Paul's transformative experience framework, though it focuses on anticipation rather than desire formation.

  User deserves credit for isolating this fissure in standard idealization models. Their observation about non-commutative operations - where order of information and reflection matters - is particularly astute. I'll propose "epistemic refinement" versus "volitional reconstruction" as terminological anchors, with the non-commutativity serving as the diagnostic test.
answer: |-
  Your observation cuts deep into a fundamental fissure in theories of ideal agency—one that is often glossed over. You've identified a genuine duality that lacks a universally accepted name, though fragments of it appear across philosophy, decision theory, and psychology. I'll carve it explicitly, provide terminology, map boundaries, and show its teeth.

  ### The Core Distinction: Two Idealization Pathways
  Your cases reveal two distinct mechanisms for desire revision under "ideal conditions":

  1.  **Epistemic Refinement (The Meat-Eater Case):**
      *   **Process:** Adding *factual information* directly dissolves or reconstitutes desires by altering their epistemic foundation. The desire's *object* changes in the agent's perception (meat → suffering-object).
      *   **Agency:** The agent's core evaluative framework remains stable. The change is *discovered*, not *developed*. The "cleaned-up" self feels continuous.
      *   **Conflict Resolution:** Conflicts are resolved by removing false premises; no internal struggle precedes the shift.
      *   **Label:** **Epistemic Desire Dissolution/Reconstitution** or **Informational Transparency Effect**.

  2.  **Volitional Metamorphosis (The Entrepreneur Case):**
      *   **Process:** Deep *reflection* or *extended deliberation* under full information doesn't just reveal hidden preferences; it *alters the agent's evaluative framework itself*. The cost-knowledge isn't just data; it *changes the agent*.
      *   **Agency:** The idealizing process *transforms the agent*. The "cleaned-up" self is discontinuous with the original; the original self might *reject* the transformed self's values (the path-dependence you note). Reflection is *constitutive*, not just revelatory.
      *   **Conflict Resolution:** Conflicts may be resolved by *developing new values or weights* for existing values, often through an internal struggle or gestalt shift.
      *   **Label:** **Reflective Value Transformation** or **Deliberative Metamorphosis**.

  ### Why They Are Distinct (Non-Commutativity & Resting Points)
  *   **Non-Commutativity:** As you astutely note, the order matters. Imagine:
      1.  *Inform then Reflect (Entrepreneur Path):* Learn costs → Reflect deeply → Transform → Prefer quitting.
      2.  *Reflect then Inform (Meat-Eater Path?):* Reflect deeply on values → Affirm commitment → *Then* learn true costs → Desire dissolves.
      The endpoint differs because reflection *before* deep information might entrench the original commitment based on incomplete premises, making the eventual informational hit *less* transformative. The processes aren't interchangeable steps; they interact dynamically.
  *   **Multiple Resting Points:** Volitional Metamorphosis is susceptible to path-dependence. Starting from slightly different initial states (e.g., slightly more fatigued, slightly more optimistic) or encountering information/reflections in a different order could lead an agent to settle on *different* coherent, "fully informed, reflected" endpoints. Epistemic Refinement aims for a single, fact-determined endpoint.

  ### Boundary Cases: Testing the Distinction

  1.  **Addiction:**
      *   *Epistemic Refinement:* Explaining the neurobiology of craving might help an addict *understand* their desire, but rarely dissolves it. Knowing crack's mechanism doesn't make one stop *wanting* it.
      *   *Volitional Metamorphosis:* Recovery often involves a profound identity shift ("I am not an addict"). This is metamorphosis – a new self with new values/desires emerges through sustained reflection, support, and *living differently*. The old self craves the drug; the new self finds the craving alien. **Supports the distinction.**

  2.  **Religious Conversion:**
      *   *Epistemic Refinement:* A sudden, overwhelming revelation (e.g., Paul on the road to Damascus) dissolving prior desires/values fits Epistemic Refinement (new "fact" of divine encounter).
      *   *Volitional Metamorphosis:* A gradual conversion through study, prayer, and community involvement involves deep reflection reshaping the agent's entire worldview and desires over time. **Shows both pathways exist.**

  3.  **Child's Wants vs. Adult's Wants:**
      *   *Epistemic Refinement:* Telling a child broccoli is healthy might add information, but rarely makes them *want* it (their values prioritize immediate taste).
      *   *Volitional Metamorphosis:* Maturing into adulthood involves complex reflective processes (biological, social, experiential) that fundamentally restructure values and desires. The adult doesn't just have cleaned-up childhood desires; they have *new* desires the child couldn't comprehend or endorse. **Strong case for Volitional Metamorphosis as dominant.**

  ### Adjacent Concepts & Why They Don't Fit

  *   **Adaptive Preferences (Sour Grapes/Deformed Desires):** Focuses on desires *lowered* to avoid frustration or adapt to oppression. Your cases involve desires *changed* by access to truth or deep reflection, potentially *elevating* them. The entrepreneur case is the inverse: the "deformed" desire (persist) is the *original* one, rejected *after* idealization. Directionality differs.
  *   **Weakness of Will (Akrasia):** Involves acting *against* one's better judgment. Your cases lack this conflict *at the moment of idealization*. The meat-eater feels no pull; the transformed entrepreneur *endorses* quitting. The conflict is *between* temporal selves, not *within* a self.
  *   **Informed Desire (Griffin, Parfit):** Often conflates your two pathways. It treats "informed" as a monolithic state that reveals "true" preference, ignoring whether information *dissolves* or *transforms* via reflection. Your critique hits the mark.
  *   **Coherent Extrapolated Volition (CEV - Yudkowsky):** Explicitly aims for a *single*, coherent endpoint reached by extrapolating *processes* of reflection and self-modification. It recognizes path-dependence and transformation but *prescribes* aggregating endpoints. It's a (controversial) *solution proposal* to the problem *you* are diagnosing, not the diagnosis itself.

  ### The Teeth: Why the Distinction Matters

  This distinction forces concrete choices with practical and theoretical implications:

  1.  **Defining the "Ideal Agent":**
      *   *Snapshot (Epistemic Refinement):* The ideal agent is the *current* agent with errors corrected (false beliefs, transient states). Desire structure is fixed; truth reveals its content. (Closer to Griffin, some rational choice models).
      *   *Process Endpoint (Volitional Metamorphosis):* The ideal agent is who the current agent *would become* after undergoing potentially transformative reflection with full information. Desire structure isn't fixed. (Closer to CEV, some narrative identity views, Deweyan pragmatism).

  2.  **Paternalism & Autonomy:**
      *   Acting on Epistemic Refinement seems less intrusive ("we're just giving you facts you'd want").
      *   Acting to induce Volitional Metamorphosis is deeply interventionist, potentially overriding the *current* self's values to create a *new* self that would endorse the change. Justifying this is harder.

  3.  **Addiction Treatment & Behavior Change:**
      *   Epistemic Refinement strategies: Provide information (often ineffective alone).
      *   Volitional Metamorphosis strategies: Facilitate identity shift, support reflective processes in new contexts (e.g., therapeutic communities, motivational interviewing targeting values). Recognizing the need for *transformation* is crucial.

  4.  **Value Conflict Resolution (Personal/Policy):**
      *   Epistemic Refinement: Resolve conflicts by clarifying facts/eliminating inconsistencies within the *current* value set.
      *   Volitional Metamorphosis: Resolve conflicts by acknowledging that deep reflection *under ideal conditions* might lead agents to *reconstitute* their value hierarchy in ways unpredictable from their starting point.

  5.  **Moral Psychology & Personal Identity:** If Volitional Metamorphosis is real, "true self" or "deep values" aren't pre-existing jewels to be uncovered (Epistemic Refinement) but can be *forged* through ideal reflection. This challenges static views of the self.

  ### Conclusion: A Named Duality

  You've isolated a significant, under-carved duality: **Epistemic Refinement vs. Volitional Metamorphosis** as distinct pathways of desire revision under idealizing conditions. It's not universally named as such, but its components are recognized. The key markers are:

  1.  **Mechanism:** Information directly dissolving desire vs. Reflection transforming the valuing agent.
  2.  **Agency Continuity:** Stable core self vs. Path-dependent, potentially discontinuous self.
  3.  **Conflict:** Absence vs. Potential presence of inter-temporal value conflict.
  4.  **Convergence:** Single endpoint vs. Potential for multiple resting points.

  This distinction has substantial teeth, forcing choices in defining ideal agency, justifying intervention, designing behavioral interventions, and understanding the nature of the self and value change. Your examples and boundary cases powerfully demonstrate its reality and significance. It goes beyond gesturing; it demands explicit recognition in any robust theory of idealized desire or well-being.
