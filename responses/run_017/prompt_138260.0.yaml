answer: |-
  ### Final Examination Question: Consequentialism and the Problem of Cluelessness  
  **Answer one question. Time allowed: 90 minutes.**  

  > **Cluelessness in Consequentialist Decision-Making**  
  > Consequentialism requires agents to choose actions that maximize expected value. However, the *problem of cluelessness* arises when long-term effects of an act are vast but epistemically inaccessible: our evidence about their sign (positive/negative) or magnitude is indeterminate or symmetric. A standard defense argues that cluelessness is merely a severe case of ordinary uncertainty: we should still maximize expected value (EV) with available evidence, treating symmetric noise as canceling out.  
  >  
  > **Critically evaluate this defense** using the following two devices:  
  > 1. **Articulation Asymmetry**: Our models of causal mechanisms are systematically biased toward near-term, measurable, and easily narratable effects (e.g., economic growth, direct health outcomes). Effects that are complex, nonlinear, or morally opaque (e.g., institutional trust, cultural shifts) are underrepresented. Thus, our EV estimates for long-run consequences may carry *unidentified directional bias* (e.g., consistently overvaluing measurable outcomes) rather than mere high variance.  
  > 2. **Self-Endorsement Test**: A decision rule for clueless contexts must, when reflexively applied to *selecting a decision rule itself*, endorse its own use and not recommend abandonment.  
  >  
  > Apply these to a choice facing "Gamma Foundation":  
  > - **Option A**: Distribute malaria bednets. Near-term effects: save ~1,000 lives/year; high-certainty EV.  
  > - **Option B**: Advocate for radical democratic reform in region X. Long-term effects: could catalyze institutional stability or civil war, affecting millions over centuries. Your evidence suggests P(positive) ≈ P(negative) ≈ 0.5; expected magnitude is 100× larger than A’s effects, but directionally clueless.  
  > - **Option C**: Fund research to reduce cluelessness about Option B’s effects (e.g., historical/political studies). Costs 10% of A’s resources; may resolve directional uncertainty in 5 years.  
  >  
  > **What should a clueless consequentialist choose? Justify your answer, addressing:**  
  > - Whether articulation asymmetry undermines the EV defense.  
  > - Whether EV maximization passes the self-endorsement test.  
  > - Whether cluelessness uniquely threatens consequentialism.  

  ---

  ### Model Answer (798 words)  
  The cluelessness objection contends that when long-term effects dominate but resist reliable estimation, consequentialism fails to guide action. The standard defense—that we should maximize expected value (EV) despite symmetric noise—is superficially robust but collapses under scrutiny of *articulation asymmetry* and the *self-endorsement test*. I argue that Gamma Foundation should choose **Option C (research)**, as EV maximization cannot navigate cluelessness without self-undermining assumptions, and C offers the only stable path to resolving systemic bias.  

  **First, reconstructing cluelessness formally** clarifies its challenge. Let \( V(A) \) be the total value of Option A, decomposable as \( V_{near}(A) + V_{long}(A) \). For A, \( V_{near}(A) \) dominates and is measurable; for B, \( V_{long}(B) \) dominates but \( E[V_{long}(B)] \approx 0 \) due to P(positive) ≈ P(negative). The objector claims that when \( |V_{long}| \gg |V_{near}| \) and \( E[V_{long}] \approx 0 \), the *variance* of \( V_{long} \) swamps near-term effects. Thus, B’s EV is indeterminate: \( E[V(B)] \approx 0 \pm \sigma \), where σ is enormous. Consequentialism then either demands we ignore B (despite its stakes) or ad hoc prioritizes \( V_{near} \). The EV defender replies that symmetric noise implies \( E[V_{long}(B)] = 0 \), so Gamma should compare \( E[V(A)] \) and \( E[V(B)] \) directly: if \( E[V_{near}(A)] > 0 \), choose A. But this assumes two conditions:  
  > (1) *Unbiased Estimability*: Our EV calculations access all morally relevant variables.  
  > (2) *Linearity*: The expectation operator commutes with value summation (i.e., \( E[V_{near} + V_{long}] = E[V_{near}] + E[V_{long}] \) is meaningful).  

  **Articulation asymmetry violates (1) and (2)**. Our models ignore hard-to-narrate mechanisms (e.g., how B might erode communal trust or enable latent extremism). Thus, \( E[V_{long}(B)] \) is not zero with high variance—it is *biased*. For example, if measurable effects (GDP, lifespans) are overrepresented, \( E[V_{long}(B)] \) could be +500 utilons when true value is -1,000. Crucially, this bias is *directional but unquantifiable*: we cannot compute its size or sign. EV maximization then fails because:  
  > - If the bias’s *expectation* is symmetric (e.g., P(overestimate) = P(underestimate)), EV remains “unbiased” in a technical sense. But articulation asymmetry likely generates *skewed* bias (e.g., we more often overlook tail risks from institutional collapse).  
  > - When bias magnitude is unknown, we cannot compute EV at all. \( E[V_{long}(B)] \) becomes undefined—not a number we can compare to A’s 1,000 lives.  

  Thus, between A and B, the consequentialist faces a dilemma: A ignores vast potential value; B risks catastrophe with unquantifiable probability. Option C mitigates this by reducing articulation asymmetry. Research might reveal, say, that democratic reforms in X’s context have 70% chance of collapse due to unmodeled ethnic tensions. This transforms B from clueless to risky-but-quantifiable.  

  **The self-endorsement test exposes deeper instability**. Suppose Gamma applies EV maximization to choose a decision rule *R* for clueless contexts. Candidates include:  
  > - \( R_{EV} \): Maximize expected value with current evidence.  
  > - \( R_{Precaution} \): Avoid options with unbounded downside risk.  
  > - \( R_{Research} \): Invest in reducing cluelessness first (i.e., Option C).  

  \( R_{EV} \) *fails its own test*: given articulation asymmetry, \( E[V(R_{EV})] \) is incalculable—it may systematically ignore catastrophic risks. If research (C) reveals that \( R_{EV} \) has a 40% chance of enabling disasters, \( R_{EV} \) would tell Gamma to *abandon itself* for \( R_{Precaution} \) or \( R_{Research} \). Conversely, \( R_{Research} \) passes: if Gamma evaluates rules *after* reducing cluelessness via C, \( R_{Research} \) will endorse itself (since information improves EV maximization) or switch to a better-informed rule. Thus, only research strategies are reflexively stable.  

  **Is cluelessness uniquely consequentialist?** Non-consequentialist views (e.g., deontology) avoid cluelessness by ignoring consequences, but this is a vice: willful ignorance of downstream harm is immoral. Consequentialism’s commitment to *all* effects is correct—but it must handle cluelessness without illusion. Option C embodies this: buying information respects the moral gravity of long-term effects while acknowledging current ignorance. Choosing A (bednets) surrenders to myopia; choosing B (reform) gambles recklessly when bias is uncontrolled.  

  In sum, the EV defense fails because articulation asymmetry makes long-run EV incalculable, not merely noisy. Gamma should fund research (C) to resolve bias, then re-evaluate B. This passes self-endorsement and respects the core consequentialist insight: that what we cannot measure might still drown all we can.  

  ---

  ### Marking Scheme (20 points total)  
  **A: Reconstructs cluelessness formally** (4 pts)  
  - **4**: Correctly models B as \( E[V] ≈ 0 \pm \sigma \) with σ >> |A|; distinguishes dominance-by-variance from sign-indefiniteness.  
  - **2**: Describes but does not formalize the problem.  
  - **0**: Asserts cluelessness without technical grounding.  
  > *Common error (strong candidates): Equates "E[V] ≈ 0" with "no reason to act," missing variance swamping.*  

  **B: Diagnoses EV defense assumptions & defeaters** (4 pts)  
  - **4**: States EV requires (1) unbiased estimability & (2) linearity; explains how articulation asymmetry breaches them.  
  - **2**: Identifies bias but not structural assumptions.  
  - **0**: Treats bias as merely "more uncertainty."  
  > *Common error: Claims "any bias breaks EV," missing that symmetric bias preserves EV validity.*  

  **C: Applies articulation asymmetry without overclaiming** (4 pts)  
  - **4**: Notes unquantifiable directional bias voids EV; argues why non-zero skew or incalculability defeats EV (not bias itself).  
  - **2**: Describes asymmetry but concludes vaguely that EV is "unreliable."  
  - **0**: Asserts EV is invalidated by all uncertainty.  
  > *Common error: Demands "absolute certainty," ignoring that EV handles quantifiable risk.*  

  **D: Tests self-endorsement reflexively** (4 pts)  
  - **4**: Applies test at rule-selection level; shows \( R_{EV} \) fails (may reject itself post-research); \( R_{Research} \) passes.  
  - **2**: Tests only at action level (e.g., "C endorses itself").  
  - **0**: Ignores reflexivity or conflates rules/acts.  
  > *Common error: Claims \( R_{EV} \) passes because "it maximizes EV now," ignoring future self-repudiation.*  

  **E: Normative upshot & scope** (4 pts)  
  - **4**: Judges cluelessness as uniquely *consequentialist* (due to its commitment to consequences); defends research as stable; rejects non-consequentialist "immunity" as evasion.  
  - **2**: Discusses cluelessness generally or superficially prefers "caution."  
  - **0**: No normative conclusion.  
  > *Common error: Treats cluelessness as generic decision-theoretic problem.*  

  ---

  ### A vs. B Differentiation Note  
  An **A answer** (16–20 pts) recognizes that articulation asymmetry’s threat is **epistemic rupture**: when bias is *unquantifiable*, EV is undefined, not just noisy. It thus ties C’s necessity to restoring calculability. Crucially, it applies the self-endorsement test *metatheoretically* (to rule selection), proving \( R_{EV} \) is self-undermining under cluelessness.  

  A **B answer** (12–15 pts) accurately explains both devices and prefers C but misses the **incalculability point**: it treats bias as a "reason against B" without voiding EV, or applies self-endorsement only to actions (e.g., "C is good"). It often states normative views without rooting them in structural analysis.  

  > **Summary**: A answers show *why* EV collapses under articulation asymmetry; B answers describe *that* it is compromised.
