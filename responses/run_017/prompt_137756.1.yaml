prompt: |-
  I've been reading the rationalist blogs since the Sequences days, and I help run a small local effective-altruism group; a friend from that group — the one who always wants to shut up and multiply — sent me an argument last month that I have not been able to find an exit from, and it is starting to make me suspect that the cost-effectiveness style of thinking I have sunk years into rests on a mistake. His claim, in brief, is that once you take seriously the possibility that the world is immense — spatially infinite and statistically uniform, or possessed of an endless value-bearing future, or both — then for *any* nonzero credence in that possibility every finite, checkable thing we know about doing good drops out of the calculation, and all that is left is paralysis or a kind of monomaniacal long-termism whose verdicts are completely insensitive to the size of that credence. I cannot accept this, and I also cannot say which line of his argument to cross out. Here it is, numbered so we can be precise.

  Call a world immense if, for each act available to me, the sum of the welfare differences that act makes — taken over everyone ever affected — is not a finite real number. His two routes to thinking we might be in one: first, that in an endless future the effects of any act with a lasting residue never stop accumulating, because in a chaotic world differences in the state of the world do not wash out but compound, so acts like funding a charity, having a child, or voting leave footprints whose totals never converge; second, that in an infinite uniform space there are infinitely many subjectively indistinguishable agents in my situation whose choices are correlated with mine. (He anticipates the causal decision theorist: even granting that correlation is not causation, the endless-future route restores the infinite footprint on its own, and imperfect correlation does not help either, since a fixed positive fraction of infinitely many agents is still infinitely many.) Given that stipulation:

  (1) I ought to perform whichever available act maximizes expected total welfare difference, aggregating across everyone affected.
  (2) The hypothesis that the world is immense has nonzero credence p — it does not matter how big: 0.3, 10⁻⁶, 10⁻⁴⁰ — since nothing below depends on the size.
  (3) In an immense world, each available act's total welfare difference is infinite in magnitude, not merely very large.
  (4) Expected value is p times the immense-branch difference plus (1−p) times the finite-branch difference; a positive multiple of an infinite magnitude exceeds every finite magnitude, so for any p > 0 the ranking between acts is settled entirely inside the immense branch, and the finite branch — the branch my evidence is almost entirely about — contributes nothing at all.
  (5) But inside the immense branch the totals are divergent, so no act's total exceeds another's: comparing two of them is subtracting infinities, which is undefined. So (1) issues no verdict. Call this the paralysis horn.
  (6) The obvious repair is to compare rates rather than totals: truncate the world — a ball of radius R around me, or everything up to time T — compute the finite difference between the two acts' effects inside the truncation, and rank A above B when that difference stays positive for all sufficiently large truncations; equivalently, compare limiting densities of value rather than sums.
  (7) He says the repair fails twice over. There is no canonical truncation: sum the welfare differences in order of distance from me, or in order of time, or over expanding regions of one shape rather than another, and where the sums are not absolutely convergent you can get different signs for the same pair of acts, so the verdict is an artifact of an arbitrary limiting procedure. And even granted a procedure, the long-run sign is exactly what my evidence is silent about: the asymptotic difference depends on effects centuries or eons downstream that I cannot forecast and that chaos makes fluctuate, so the rate comparison hands me nothing I could act on.
  (8) Therefore, for any nonzero credence in an immense world, however tiny, either practical reason is silent, or it is silent in a subtler way (the answer depends on an arbitrary limiting procedure I have no way to choose), or it is monomaniacal: the only thing that matters is the asymptotic profile of the immense branch, and everything checkable — cost per life saved, whether the intervention works at all, whether the organization is competent — is irrelevant, even at p = 10⁻⁴⁰, even when the finite branch favors one option by a factor of a billion. He thinks this shows that either longtermism is the whole of ethics or nothing is.

  I want the diagnosis, not a reading list: I have read the usual blog posts and most of them just announce that infinities are counterintuitive, which I already knew. Tell me which step to reject and what rejecting it costs, and explain why the step you reject looked innocent — where exactly does the slide happen, if there is one, between the finite and the infinite branch? If the fault is in the arithmetic of (4), what replaces it, and does the replacement let p matter in the way my evidence should make it matter? If the fault is in (6)–(7), is there a principled truncation or limiting procedure, or a reason the ordering sensitivity and the cluelessness do not actually arise for comparisons like the ones I face? If the fault is in (1), what goes in its place that still underwrites ordinary cost-effectiveness reasoning in a small, finite world? If your answer is eventual dominance, tell me what I am supposed to do when the truncated difference keeps changing sign no matter how large the truncation gets, since that is what I would expect in a chaotic world. For what it is worth, I would rather keep (3) and something like (6) than keep unrestricted expected-value maximization, and what I would most like to keep is the claim that evidence about the finite branch is not worthless — but I would rather know what I am paying than keep any of it for free.
reasoning: |-
  Okay, the user is deeply entrenched in rationalist and effective altruism communities, presenting a sophisticated argument from a friend that challenges the foundations of cost-effectiveness analysis. The core issue revolves around infinite ethics—specifically, how to make decisions when there's any nonzero probability the universe is infinite in space or time. The friend's argument suggests that under such conditions, all finite considerations become irrelevant, leading to paralysis or extreme longtermism. 

  The user wants a precise diagnosis, not just references. They've clearly done their homework—mentioning familiar concepts like causal decision theory, divergence issues, and truncation methods. Their frustration is palpable: years of EA-style cost-effectiveness calculations might collapse if this argument holds. They're emotionally invested ("I cannot accept this") but intellectually honest ("tell me what I’m paying").

  Breaking down the friend's argument: Premise (1) assumes standard expected value maximization. (2) assigns nonzero credence to an immense world. (3) claims infinite welfare differences in such worlds. (4) argues that any nonzero p makes the immense branch dominate. (5) notes paralysis due to undefined infinite comparisons. (6-7) attack rate-based solutions (truncation arbitrariness + cluelessness). (8) concludes with a false dilemma: monomaniacal longtermism or paralysis.

  The user’s hidden needs emerge between lines: They want to preserve the *practicality* of EA work ("everything checkable—cost per life saved... is irrelevant") without denying theoretical possibilities. There's fear that longtermism might swallow all other ethics whole. Also, unspoken is likely discomfort with how this could destabilize their local EA group's work if the friend's view prevails.

  The solution must surgically dismantle the argument while preserving everyday cost-effectiveness. The weakest link is premise (3)—it oversimplifies "infinite magnitude." Immense worlds don’t guarantee divergent welfare differences; they could be conditionally convergent. This is key: convergence allows finite comparisons to hold meaning even under truncation. 

  For instance, if welfare differences decay sufficiently (e.g., inverse square of distance/time), the infinite sum converges. Then, immense worlds wouldn’t automatically erase finite evidence. The user’s intuition about decay rates ("what I would expect in a chaotic world") is correct—but chaos doesn’t preclude convergence; it just makes convergence harder to prove. The response should emphasize that (3) is an assumption, not a necessity.

  Premise (4) also fails because dominance arguments break when infinities aren't comparable. But fixing (3) avoids this. The user’s preference for keeping (6)-style truncation is salvageable if we reject (3)’s blanket claim. 

  Practical implications: The user can retain cost-effectiveness analyses by noting that for *conditionally convergent* immense worlds, finite evidence dominates unless p is large enough to outweigh it—which, given astronomical finite differences (e.g., billion-fold effects), might require unreasonably high p. This restores relevance to "checkable" factors. 

  The cost? We must accept that some immense world models *could* force paralysis, but these are specific failures of the model (e.g., poor decay rates), not universal features. The burden shifts to the friend: Why assume divergent rather than convergent infinities? 

  Emotionally, this reassures the user their work isn't futile. The response validates their unease while offering escape without burning down EA epistemology. It also subtly defends moderate longtermism: immense futures matter, but not monomaniacally.
answer: |-
  Your friend's argument is clever and structurally sound *if* we grant its premises—but the critical flaw is **premise (3)**, which falsely assumes that "immense" worlds necessarily yield *divergent* welfare differences. Rejecting (3) dismantles the paralysis/monomania dilemma while preserving cost-effectiveness reasoning. Here's the diagnosis:

  ### The Core Flaw: Premise (3) is Not Always True
  **(3) claims:** In an immense world, *every act*'s total welfare difference is infinite and divergent (i.e., lacks a well-defined sum).  
  **Why this fails:** Immensity (infinite space/time) does **not** imply that welfare differences *diverge*. They could be **conditionally convergent**—meaning the *order* of summation matters, but a sensible ordering yields a finite value. Crucially:  
  - **Convergence is plausible**: If welfare impacts decay with distance/time (e.g., your influence on a galaxy 10¹⁰⁰ light-years away is negligible), or if chaotic dynamics exhibit *mixing* (local effects dissipate over long timescales), sums can converge under a natural ordering (e.g., spatiotemporal proximity).  
  - **Divergence isn't guaranteed**: The argument assumes your acts create *unboundedly accumulating* differences (e.g., "funding a charity alters cosmic history forever"). But if impacts are *localized* (e.g., your charity saves 1,000 lives, then its effects dampen), sums converge. Chaos might cause fluctuations, but *cancellation* (positive/negative differences averaging out) can still yield convergence.  

  ### How Rejecting (3) Resolves the Problem
  1. **Expected value (EV) becomes tractable**:  
     - If welfare differences are *finite* in immense worlds (due to convergence), EV = p·(finite) + (1-p)·(finite).  
     - Your finite-world evidence dominates unless p is large *and* the immense-world values are vast. At p = 10⁻⁴⁰, finite evidence (e.g., "this charity saves lives at $5,000 each") easily outweighs immense-world effects.  

  2. **Truncation (6) works when convergence holds**:  
     - If welfare differences are convergent under a natural ordering (e.g., summing by spacetime distance), truncation gives consistent results for large R or T.  
     - **Order-dependence isn't fatal**: We have physical reasons to prefer spatiotemporal order (e.g., causality light-cones). If sums converge absolutely (impacts decay fast enough), order doesn’t matter. If conditionally convergent, the "natural" ordering reflects causal structure.  

  3. **Cluelessness (7) is mitigated**:  
     - Long-term unpredictability *does* make immense-world estimates highly uncertain—but uncertainty ≠ infinite value. You can:  
       - Discount distant effects (if justified by chaos/mixing).  
       - Use *bounds* (e.g., "this act's immense-world impact is between −X and +X").  
       - Focus on *robustly positive* acts (e.g., preventing extinction has convergent positive value; running a fraud charity has convergent negative value).  

  ### Why Premise (3) Looked Innocent
  - **Intuitive error**: We picture immensity as "everything matters forever," ignoring that impacts can decay or cancel. Chaos feels like "butterfly effects amplify," but in many systems, entropy *erases* fine-grained differences over time.  
  - **Physics oversight**: In an expanding universe, regions beyond the cosmological horizon are causally disconnected—your acts *cannot* affect them. Spatially uniform correlations (e.g., Boltzmann brains) are possible but fantastically improbable; assigning them significant weight is dubious.  

  ### Costs of Rejecting (3)
  1. **You must justify convergence assumptions**:  
     - For a given act, argue that its impacts decay sufficiently (e.g., "donating to malaria nets has no measurable effect beyond 10,000 years due to chaos/technological disruption").  
     - Acknowledge that *some* acts (e.g., altering Earth's long-term trajectory) might have divergent effects—but these are exceptions, not the rule.  

  2. **Longtermism isn't trivialized**:  
     - If an act *does* have divergent effects (e.g., founding a stable civilization), its immense-world EV could dominate—but only if you assign nontrivial credence to divergent models *and* cannot bound the effects. This justifies *targeted* longtermism without forcing monomania.  

  ### Practical Verdict
  - **Keep cost-effectiveness**: In a finite world (1-p) or convergent immense world, your evidence matters. At p = 10⁻⁴⁰, a billion-fold finite advantage overwhelms any plausible immense-world estimate.  
  - **Address true divergences surgically**: Worry about divergence only for high-leverage, long-lasting acts (e.g., AI governance), not routine interventions.  
  - **Toolbox adjustment**: Use:  
    - **Sensitivity analysis**: "How large must immense-world effects be to change my decision?"  
    - **Domain-specific convergence arguments**: "In cosmology, superhorizon regions are irrelevant; in chaos theory, Lyapunov timescales suggest decay after 10⁴ years."  

  ### Bottom Line
  **Paralysis arises only if you insist that *every* act has divergent effects in immense worlds—but this is physically unjustified. By rejecting premise (3), you restore the weight of finite evidence and make immense worlds a *manageable* uncertainty rather than an epistemic black hole.** The cost is accepting that some acts require extra scrutiny for divergence—but this refines, rather than destroys, cost-effectiveness reasoning.
