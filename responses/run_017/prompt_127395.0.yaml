    - Segment 1: From (3, 0) to (1, 1), defined by \(v = (3 - u)/2\) for \(u \in [1, 3]\).
    - Segment 2: From (1, 1) to (0, 2), defined by \(v = 2 - u\) for \(u \in [0, 1]\).
  - **Ideal point**: Max \(u = 3\) (at (3, 0)), max \(v = 2\) (at (0, 2)), so (3, 2).

  **Why this case**:
