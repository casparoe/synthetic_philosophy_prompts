prompt: |-
  hey so I'm a junior and for my independent project this year I'm building a little simulated critter — grid world, a camera-ish sensor on a movable neck, and one light it can switch on and off — and I want it to learn to do interesting stuff with no reward function anywhere in it, only prediction. I've been reading about predictive processing and the free energy principle and I keep hitting the same wall: every version I find sounds like it explains absolutely everything and therefore nothing. So before I write any code I want an actual spec.

  Can you write me the desiderata: what any theory of this kind has to deliver to count as adequate for my purpose (good enough to implement on a small agent and get non-boring behavior out of, not good enough to sound profound)? For each requirement give me the case or consideration behind it — like, what breaks, or what goes wrong, for a theory that blows it off — and mark each one as non-negotiable or as a taste thing that only one camp insists on.

  Here's the stuff I want the list to definately deal with, but please don't just turn my list into your list — add the requirements I'm missing, and reorder however makes sense:

  - the dark room problem: if the agent's whole job is to make its predictions come true, why doesn't it go curl up in the most boring corner it can find? And the flip side, which I think is harder: real animals go looking for things that surprise them, but only up to a point — they like novelty and play and they totally freak out in chaos. So the theory has to seperate prediction error worth approaching from prediction error worth avoiding, and I don't want the answer to be that we bolt on a curiosity term, because that's cheating — the whole point of this for me was no reward function. It has to fall out of the same principle, or the theory has to say honestly that it doesn't.
  - self-stimulation: my critter shouldn't be able to surprise itself by moving its own sensor. Input caused by its own action has to be treated differently from identical input coming from outside, and if I add a delay or make the cause look external, the effect should flip back. Whatever the theory is, it has to say which knob does that, how big the effect should be, and give me something I can actually measure in my sim — I want a prediction I could fail, not a story about why it makes sense.
  - precision / attention: some signals get trusted more than others. Is the weight itself predicted? If yes, why isn't there an infinite regress of meta-meta-predictions, and if no, what sets it and why isn't that just a reward function wearing a fake mustache.
  - architecture: my network is flat and recurrent, not a tidy stack of layers with predictions going down and errors going up. Does the theory actually need a hierarchy, or is that just how people draw it? If it needs one, say that loudly, because that decides whether I can use this at all.
  - being small: my thing has a tiny compute budget, it cannot do exact Bayesian inference over everything. The theory has to say what the approximation is and what the approximation costs it, not just gesture at being roughly Bayesian.
  - the vacuity worry: I read somewhere that any system that stops minimizing its free energy is simply dead, and that made me suspicious, because it sounds like the theory can never lose. Help me phrase that as a requirement the theory has to pass — one that forces it to stick its neck out. This is the one I care about most.
  - the name: half the time I can't tell whether I'm supposed to be impressed because free energy sounds like thermodynamics. Requirement: state plainly what the variational bound thing has to do with real physics, metabolism, or staying alive, or admit it's a math trick with a cool name. Don't let the label do any work.

  And the part I actually want most: I have a feeling some of these can't all hold at once. One principle covering perception, action, attention and learning versus making a risky prediction I could fail to reproduce. Explaining everything from surprise minimization versus not smuggling a goal back in somewhere. If some subset is jointly unsatisfiable, say so explicitly, tell me which one to drop and what that costs me. And tell me which single requirement does the most filtering — the one that kills the most candidate theories.

  After that, and keep this short, like two sentences each, I care way more about the list: score three flavors against it. The hierarchical predictive coding picture. The active inference / expected free energy one. And the boring engineering one where you just do model-predictive control with a curiosity bonus. Just where each one crashes into my requirements.

  Please don't give me a reading list or paper titles or links, I can't get into a library database from here and I don't want to chase citations anyway. Your own words, plain english is fine, I'd rather understand it than be impressed. But don't dumb it down either — I can do calculus and I've built a kalman filter before.
reasoning: |-
  We are going to construct a list of desiderata for a theory to be implemented in a small simulated agent without reward functions, only prediction. The requirements are derived from your concerns and expanded where necessary. Each requirement is marked as non-negotiable (N) or taste (T), and includes the case/consideration behind it.

  ### Desiderata for the Theory

  1. **Avoidance of the Dark Room Problem (N)**  
     - *Requirement*: The theory must explain why the agent does not seek a state of minimal sensory input (like a dark room) and instead engages in exploratory behavior, but avoids chaotic environments. It must distinguish between "good" and "bad" prediction errors without introducing an extrinsic reward (like curiosity) as a bolt-on.
     - *Case*: Without this, the agent would become inert. The theory must derive exploration and novelty-seeking from the same principle that drives prediction error minimization, without dual mechanisms.

  2. **Self-Stimulation Handling (N)**  
     - *Requirement*: The theory must differentiate between self-generated and externally generated sensory input. It must specify a mechanism (e.g., efference copy, proprioceptive prediction) that cancels or discounts self-caused sensations. The mechanism must be testable (e.g., by introducing delays and observing behavioral flips).
     - *Case*: Without this, the agent would be perpetually "surprised" by its own actions (e.g., moving its sensor) and could not learn stable world models. A delay test must break the cancellation and make self-movement feel external.

  3. **Precision/Attention without Regress or Reward Smuggling (N)**  
     - *Requirement*: The theory must explain how some prediction errors are weighted more than others (precision) without infinite regress (i.e., without requiring meta-predictions about precision ad infinitum). The setting of precision must not be a reward function in disguise.
     - *Case*: If precision is set extrinsically (like a reward), it violates the "no reward function" premise. Infinite regress is computationally intractable for a small agent.

  4. **Architectural Flexibility (T, but critical for you)**  
     - *Requirement*: The theory must not require a strict hierarchical architecture (e.g., layered cortical hierarchies) to function. It must be implementable in a flat recurrent network.
     - *Case*: Your agent's network is flat. If the theory demands hierarchy, it's unusable for you. However, some theories may work without it (taste because some camps insist on hierarchy).

  5. **Computational Tractability for Small Agents (N)**  
     - *Requirement*: The theory must specify an approximation to Bayesian inference that is computationally feasible (e.g., variational inference, predictive coding with simple neurons). It must state the cost of approximation (e.g., overconfidence, slower learning).
     - *Case*: Exact Bayesian inference is intractable. Without a clear approximation, the theory is unimplementable on your resource-limited agent.

  6. **Falsifiability / Non-Vacuity (N)**  
     - *Requirement*: The theory must make testable predictions that can fail in your simulation. It must not be so broad that any behavior is explained (e.g., "minimizing free energy" cannot explain both seeking and avoiding novelty without additional, testable mechanisms).
     - *Case*: A theory that is consistent with any outcome is unscientific. You must be able to design an experiment where the agent behaves in a way that contradicts the theory.

  7. **Clarity on "Free Energy" and Physics (N)**  
     - *Requirement*: The theory must clarify whether "free energy" is a metaphor for a variational bound (math trick) or has a direct link to thermodynamics/metabolism. If the latter, it must state how metabolic constraints are modeled.
     - *Case*: The name "free energy" can be misleading. If it's just a math tool, admit it. If not, the theory must tie it to survival (e.g., avoiding states that increase thermodynamic free energy and lead to death).

  ### Tensions and Trade-offs

  - **The Core Tension**: The same principle (e.g., prediction error minimization) must drive both perception (inference) and action (control), but without smuggling in a reward function (which would violate the "no reward" premise). This is hard because:
    - Without a distinction between "good" and "bad" surprise, the agent falls into the dark room (requirement 1).
    - If precision weighting is set by an external reward, it violates the spirit of the project (requirement 3).
    - The requirement for falsifiability (6) forces the theory to make specific, testable claims about behavior, which may conflict with the desire for a single principle (e.g., free energy minimization) to explain everything.

  - **Joint Unsatisfiability?**: 
    - Requirements 1 (avoid dark room) and 3 (no reward smuggling) are the hardest to satisfy together. Many theories add "intrinsic motivation" (curiosity) as a separate module, which feels like cheating. A pure prediction-based theory must break the symmetry between reducing surprise (stasis) and increasing it (exploration) from within.
    - **What to drop?**: If you drop requirement 1 and allow a curiosity term, you violate "no reward function". If you drop requirement 3 and allow precision to be set by a hardcoded reward, you also violate the premise. Neither is acceptable. The solution must come from the theory itself.

  - **Most Filtering Requirement**: 
    - **Requirement 1 (Avoidance of Dark Room)** is the killer. It forces the theory to explain exploration endogenously, without dualism. Most naive predictive processing models fail here.

  ### Scoring Three Flavors Against the Requirements

  1. **Hierarchical Predictive Coding (HPC)**  
     - *Dark Room*: Fails. Without additional mechanisms, it drives the agent to minimize prediction error, leading to the dark room.  
     - *Self-Stimulation*: Passes. Uses efference copies to cancel self-caused input. Delay tests would disrupt cancellation.  
     - *Precision*: Fails. Precision is often modeled as hyperparameters, but how they are set is underspecified (risk of reward smuggling). Regress is stopped by fixed priors.  
     - *Architecture*: Fails. Requires hierarchy.  
     - *Tractability*: Passes. Uses local message passing (predictive coding) which is efficient.  
     - *Vacuity*: Fails. "Minimizing prediction error" explains both action and perception, but can be twisted to explain anything.  
     - *Free Energy Clarity*: Fails. Free energy is a variational bound (math trick) with no necessary link to physics.  

  2. **Active Inference / Expected Free Energy (AIF/EFE)**  
     - *Dark Room*: Passes (with caveat). Agents minimize *expected* free energy, which includes epistemic (information-seeking) and pragmatic (goal-seeking) terms. Exploration emerges from reducing uncertainty (epistemic value).  
     - *Self-Stimulation*: Passes. Same as HPC.  
     - *Precision*: Mixed. Precision is often fixed or learned slowly. Still a risk of reward smuggling in the "pragmatic" term of EFE.  
     - *Architecture*: Mixed. Often hierarchical, but flat implementations exist.  
     - *Tractability*: Passes. Uses variational inference, tractable for small agents.  
     - *Vacuity*: Fails. EFE can be tuned to produce any behavior by adjusting priors (e.g., "preferences" as priors on observations), which feels like reward.  
     - *Free Energy Clarity*: Fails. Still a variational bound.  

  3. **Model-Predictive Control with Curiosity Bonus (MPC+Curiosity)**  
     - *Dark Room*: Passes. Curiosity (e.g., prediction error bonus) drives exploration.  
     - *Self-Stimulation*: Fails. Without explicit modeling, self-caused input causes surprise (unless curiosity ignores it).  
     - *Precision*: Fails. Curiosity is an extrinsic reward. Precision might be set by reward.  
     - *Architecture*: Passes. Works with flat networks.  
     - *Tractability*: Passes. MPC is online and approximate.  
     - *Vacuity*: Passes. Curiosity can be measured and falsified (e.g., remove bonus → agent stops exploring).  
     - *Free Energy Clarity*: Passes. Admits curiosity is engineered, not derived from physics.  

  ### Summary of Crashes

  - **HPC**: Crashes on dark room, architecture, vacuity, and free energy clarity.  
  - **AIF/EFE**: Best on dark room (due to epistemic drive) but crashes on vacuity (smuggled rewards) and free energy clarity.  
  - **MPC+Curiosity**: Crashes on self-stimulation and precision (because curiosity is a reward) but is falsifiable and tractable.  

  ### Recommendation

  For your project, **Active Inference** is the most promising if you can:  
  - Accept that "expected free energy" includes an intrinsic drive (epistemic value) that avoids the dark room.  
  - Implement a flat version (possible with state-space models).  
  - Admit that "preferences" (e.g., avoiding chaos) are priors, not rewards.  

  But it risks reward smuggling (in the prior). To minimize cheating:  
  - Derive the exploration drive purely from uncertainty reduction (epistemic EFE).  
  - Make the agent's prior that the world is predictable (so chaos is "bad surprise").  

  This satisfies requirement 1 endogenously and meets most others. It's the least cheaty among the options.
answer: |-
  Below is a distilled list of desiderata for your theory, derived from your concerns and expanded with critical additions. Each requirement is marked **N** (non-negotiable) or **T** (taste/camp-specific), with the core problem it solves and what breaks if ignored. I then resolve tensions and score the three approaches.

  ---

  ### **Desiderata for the Theory**  
  1. **Solve the Dark Room Problem Endogenously (N)**  
     - **Why**: Without this, agents collapse into boring, predictable states (dark room). Must explain *why* some surprises are sought (newness/play) and others avoided (chaos/overload) using the *same* core principle.  
     - **What breaks**: Bolting on "curiosity" is cheating; a theory that can't distinguish "good" vs. "bad" surprise fails action selection.  

  2. **Self-Stulation Cancellation with Testable Flip (N)**  
     - **Why**: Agents must differentiate self-generated vs. external sensations (e.g., moving its sensor). Must specify a measurable mechanism (e.g., efference copy gain) and flip behavior when causality is obscured (e.g., added delay).  
     - **What breaks**: Without this, agents hallucinate or freeze from self-induced noise. Untestable theories are hand-wavy.  

  3. **Precision Weighting Without Regress or Reward Smuggling (N)**  
     - **Why**: Attention (trusting some sensors more) must emerge without infinite meta-predictions or hidden rewards. Must say *how* precision is set (e.g., via prediction error variance).  
     - **What breaks**: Fixed precision is biologically implausible; meta-regress is computationally fatal; external weights = reward in disguise.  

  4. **Flat Architecture Compatibility (T)**  
     - **Why**: Your network is recurrent and flat. Theory must not require strict hierarchies (e.g., cortical layers) to work.  
     - **What breaks**: Hierarchical mandates exclude simple agents. *But*: Some camps insist hierarchies are essential (taste).  

  5. **Tractable Approximation with Stated Cost (N)**  
     - **Why**: Small agents can’t do exact Bayes. Must specify the approximation (e.g., variational inference) and its cost (e.g., overconfidence in predictions).  
     - **What breaks**: Vague "Bayesian" claims are unimplementable; no free lunch — approximations have tradeoffs.  

  6. **Falsifiability via Asymmetric Failure Cases (N)**  
     - **Why**: To avoid vacuity ("any living system minimizes free energy"), the theory must predict *specific* behaviors that can fail in sim (e.g., "agent will explore when uncertainty is high but avoid chaos").  
     - **What breaks**: Unfalsifiable theories explain everything post-hoc (e.g., "it minimized free energy" for any behavior).  

  7. **No Free Lunch on "Free Energy" (N)**  
     - **Why**: Must clarify if "free energy" ties to thermodynamics/metabolism (e.g., surprise minimization as a proxy for avoiding system dissolution) or is purely a variational math trick.  
     - **What breaks**: Ambiguity lets the label do heavy lifting; real physics claims require testable links to energy costs.  

  8. **Unified Perception-Action-Learning (T)**  
     - **Why**: Core appeal of these theories: one principle for all. Must not decouple perception (inference) from action (control).  
     - **What breaks**: Modular designs feel engineered; *but* some camps accept perception-action as distinct (taste).  

  ---

  ### **Tensions and Trade-offs**  
  - **The Unsatisfiable Triad**: You can’t have all three:  
    (1) *One unified principle* (e.g., free energy minimization),  
    (2) *No reward smuggling*,  
    (3) *Solving the dark room*.  
    **Why**: Pure surprise minimization (1) *requires* boringness (dark room). Avoiding this demands *either* exogenous rewards (violating 2) *or* modifying the principle (e.g., adding epistemic terms).  
    - **What to drop**: Drop strict (1). Allow the core principle to have *two components* (e.g., "expected free energy" with pragmatic + epistemic terms). Cost: Feels less elegant, but retains no-reward and dark-room solution.  

  - **Most Filtering Requirement**: **#1 (Dark Room)**. It kills theories that can’t endogenously explain exploration without curiosity boltons or hidden goals.  

  ---

  ### **Approach Report Card**  
  *(Against your requirements; ✘ = major fail, ~ = partial, ✓ = pass)*  

  1. **Hierarchical Predictive Coding (HPC)**  
     - **Dark Room**: ✘ — Seeks to *minimize* prediction errors → drives agent to dark room. No endogenous exploration.  
     - **Self-Stimulation**: ✓ — Uses efference copies to cancel self-generated input. Testable via added delays.  
     - **Precision**: ~ — Precision set by prediction error variance (no regress), but often hand-tuned → risks reward smuggling.  
     - **Architecture**: ✘ — Requires strict hierarchy for top-down predictions.  
     - **Tractability**: ✓ — Local prediction errors efficient; cost: poor uncertainty handling.  
     - **Falsifiability**: ✘ — "Minimize error" explains any behavior post-hoc.  
     - **Free Energy**: ✘ — Purely variational math (no physics).  

  2. **Active Inference / Expected Free Energy (AIF)**  
     - **Dark Room**: ✓ — Minimizes *expected* free energy (EFE), which includes *epistemic* value (seeking info). Explores novelty, avoids chaos.  
     - **Self-Stimulation**: ✓ — Efference copies + proprioceptive predictions. Delay flips cause misattribution.  
     - **Precision**: ~ — Precision from expected uncertainty; but often parameterized → possible smuggling.  
     - **Architecture**: ~ — Works flat (e.g., with recurrent state-space models); hierarchies optional.  
     - **Tractability**: ~ — Variational approximation feasible; cost: EFE calculation scales with action space.  
     - **Falsifiability**: ✓ — Predicts exploration in uncertain states; falsifiable if agent hides in dark room.  
     - **Free Energy**: ~ — EFE linked to "surprise" as metabolic cost (e.g., unpredictable states drain resources).  

  3. **MPC + Curiosity Bonus (Engineering Approach)**  
     - **Dark Room**: ✓ — Curiosity as prediction-error bonus drives exploration.  
     - **Self-Stimulation**: ✘ — No inherent cancellation; curiosity may amplify self-noise → erratic behavior.  
     - **Precision**: ✘ — Curiosity is an *explicit reward function*; attention weights often heuristic.  
     - **Architecture**: ✓ — Trivially flat/recurrent.  
     - **Tractability**: ✓ — MPC standard; curiosity cheap to add.  
     - **Falsifiability**: ✓ — Remove bonus → agent stops exploring.  
     - **Free Energy**: ✓ — Admits curiosity is engineered (no pretense to physics).  

  ---

  ### **Recommendation**  
  **Use Active Inference (AIF)**: It best addresses the dark room (#1) and self-stimulation (#2) without rewards, works flat (#4), and is falsifiable (#6). Downsides: EFE calculation may strain your compute budget (#5), and "expected free energy" is still a math trick (#7) — but it *does* link surprise avoidance to metabolic costs implicitly.  

  **To avoid vacuity**: Implement a test where the agent *should* explore (e.g., in a structured environment with learnable patterns) but doesn’t — e.g., if it hides in a dark corner despite uncertainty, AIF fails.  

  **If AIF is too heavy**: Fall back to MPC + Curiosity, but you’ll violate no-reward (#3) and self-stimulation (#2).
