prompt: |-
  I'm a retired plant physiologist — forty years of measuring things — and since I packed it in I've been going to a U3A philosophy group on Tuesday mornings, which is how I've ended up stuck in the middle of all this Mary's Room business. I keep wanting to ask what the mechanism is and getting told that's the wrong sort of question, so I'd rather hand this one to someone who likes that sort of thing.

  The woman who runs the group, Brenda, has given verdicts on a run of Mary-type cases, and they don't line up neatly with any of the labels in the books I've borrowed, so I want to know what she's actually doing. Her verdicts so far (paraphrasing, but this is the gist):

  - Ordinary Mary, black-and-white room, all the physical facts, red tomato on release: she gains something on release, but not a new fact — nothing she could have written down in the room turns out to be false. She also won't let anyone wriggle out of it by saying Mary couldn't really have known all the physics; we're to grant that she does.
  - A robot with a colour camera and the complete physical theory, sorting red from green perfectly, never having had any experience at all: the robot does not know what red looks like, and no story about its dispositions or its use of the word makes up the difference. So she's a realist about something, whatever it is.
  - Mary who is allowed, in the room, to run a perfect simulation of her own visual system right up to the moment of release: if it's a real running of her own colour machinery then yes, she now knows, and that's cheating; if it's the equations on paper then no. The difference, she says, is in whether the system has actually been exercised, not in the facts.
  - Inverted Mary: two people identical in every third-person respect except that the wiring from the receptors into the colour areas is crossed, so their experiences of red and green are swapped. Conceivable; a real difference if it happened; and yet nothing in either person's physical description would be false.

  The case we've got next week is the one I care about, and there's a tenner on it. Call her Partial Mary. She's a protanope — born without the long-wavelength cone — so she has ordinary colour experience of blues, yellows and greens and has never had the red end of things. In the room she learns the complete physical story, including the physics of the pigment she's missing and the full neuroscience of normal trichromatic vision. Then (stipulate that it wires up cleanly and works straight away) she's given the opsin gene, the cone starts working, and she looks at a red tomato. Does she learn anything new?

  Why I think this is the interesting one: as far as I can make out, protanopes don't lose a whole modality, they lose a direction in a space they already have — they call reds dark yellow or brown, and they're just less sensitive at the long end. So Partial Mary starts out already acquainted with colour, and red may be a short step (or a short step plus a change in brightness) from hues she knows perfectly well. That's where the rules I can see behind Brenda's verdicts come apart, and I can't tell which one she's running:

  1. something in the ability camp — what changes on release is what she can do: imagine, remember, recognise;
  2. something in the phenomenal-concept camp — she acquires a new concept that only the experience itself can supply, so the fact was old but her grip on it is new, and she couldn't have anticipated it;
  3. something more like the quality-space or acquaintance line — she already occupies the space, so with the physical story plus the structure she already knows she can locate red in it, and any surprise is a failure of imagination or of computing power rather than of knowledge.

  What I'd like: for each of those three, what it predicts about Partial Mary, and whether it predicts she should be *less* surprised than ordinary Mary or exactly as surprised; your best guess at what Brenda will say on Tuesday, with the reasons for preferring that reading of her track record (and do say if one of her earlier verdicts, especially the simulation one, is doing more work than I think); and then the one further case — Mary variant or otherwise — that would separate whichever two rules are still tied after this one. Don't bother naming authors or papers, I can't remember them anyway; just give me the case and what it would show.
reasoning: |-
  Alright, let me tackle this retired plant physiologist's problem. They're stuck in a philosophy group debating Mary's Room and need help figuring out Brenda's reasoning. The user has presented several cases with Brenda's verdicts and now focuses on Partial Mary, a protanope who gains red vision after knowing all physical facts.

  First, I need to parse Brenda's existing verdicts. Ordinary Mary gains something but no new facts. The robot doesn't know color despite perfect discrimination. Simulation Mary only knows if the system is actually run, not just equations. Inverted Mary shows a real difference not captured in physical descriptions. 

  The key is Partial Mary. Protanopes aren't missing the entire color spectrum—they perceive blues/yellows but lack long-wavelength cones. So she already has color experiences. The user wonders if Brenda will rule she learns something new or not.

  Breaking down the three camps:
  1. Ability view: Knowledge is tied to abilities like recognition. Partial Mary might gain new abilities but already has color recognition skills. Verdict: Probably learns something new, but less surprised than ordinary Mary.
  2. Phenomenal concepts: New experiences provide new concepts. Since protanopes can't imagine true red, she'd gain a new concept. Verdict: Learns something new, same surprise level as ordinary Mary.
  3. Quality-space: Existing color space lets her locate red theoretically. Verdict: No new knowledge, just computational limits.

  Brenda's simulation case is crucial—actual system execution matters, not just facts. For Partial Mary, gaining the cone means her visual system is now "exercised" for red. So she'd likely say Partial Mary learns something new because the new cone activates the system. 

  But how much surprise? Since she already has color experience, less surprise than ordinary Mary. The user's tenner bet probably hinges on this. 

  For a tie-breaker case: Consider a tetrachromat Mary who gains ultraviolet vision. If Brenda says she learns something new, it confirms the phenomenal concept view. If not, it's quality-space. Or a case where Mary's color space is altered without new inputs—if that creates new knowledge, it supports the ability view.

  Also, the user's background matters. As a scientist, they want mechanisms, but Brenda dismisses that. The answer should respect both perspectives—honor Brenda's non-mechanistic stance while giving the physiologist concrete predictions. Highlighting the simulation verdict's importance bridges the gap between physical facts and system execution.
answer: |-
  Based on Brenda's track record, her core principle seems to be: **Knowledge requires *actual causal engagement* with the property in question, not just abstract description.** Facts are physical, but *knowing what it's like* isn't just possessing facts; it's having the system causally exercised to produce the specific experience. This makes her distinct from the three camps you outlined. Let's break it down:

  1.  **Brenda's Rule (Actual Causal Engagement):** What matters is whether the specific neural/functional machinery required to *generate* the target experience has *actually been run* in response to the relevant stimulus. Abstract knowledge, even perfect simulation *on paper* or understanding of structure, doesn't count unless the system itself has performed the causal work of producing the experience.
      *   **Ordinary Mary:** Machinery for red experience *never run* in the room. **Gains something new (the experience itself).**
      *   **Robot:** No experiential machinery *at all*, just input-output processing. **Doesn't know what it's like.**
      *   **Simulation Mary (Equations):** Machinery exists but *not run*; only described. **Doesn't know.** (Simulation on Paper)
      *   **Simulation Mary (Real Running):** Machinery exists *and is run*. **Does know.** (Cheating because the system was exercised).
      *   **Inverted Mary:** Both individuals *have* their experiential machinery *run* (for green and red respectively), generating distinct experiences. **Real difference exists.** The physical facts describe the machinery and its outputs functionally, but not the intrinsic "what it's like" *of that specific running*.
      *   **Partial Mary Prediction:** She *has* colour experience machinery, but the specific sub-component for *normal long-wavelength (red) experience* has *never been run* (due to missing cone). After gene therapy, the machinery is complete *and* run for the first time when seeing red. **Brenda will say YES, she learns something new (what red experience is like).** The surprise might be *less* than Ordinary Mary's (because she's familiar with *some* colour qualia and the structure), but the core "what it's like" for red is still novel because *that specific machinery activation* is new.

  2.  **Comparison to Your Three Camps & Predictions:**
      *   **Ability Camp (1):** Focuses on new abilities (imagine, recognize, recall).
          *   *Prediction for Partial Mary:* **Probably YES, learns something new.** She gains new recognition/discrimination abilities specific to red. Likely *less surprised* than Ordinary Mary (familiar modality, similar abilities exist).
          *   *Vs. Brenda:* Brenda's "simulation running" case shows it's not *just* about ability. The equations-on-paper Mary could *describe* the ability perfectly but still lacks the knowing. The "real running" Mary gains the ability *and* the knowing simultaneously when the system runs. Ability is a *consequence* of the causal engagement for Brenda, not the core definition.
      *   **Phenomenal Concept Camp (2):** Focuses on acquiring a new concept only experience provides.
          *   *Prediction for Partial Mary:* **YES, learns something new (a new phenomenal concept for red).** She couldn't form the *concept* "what red experience is like" before having it. *Exactly as surprised* as Ordinary Mary (novel concept is equally novel).
          *   *Vs. Brenda:* Brenda's Inverted Mary case is the challenge. If Mary and Inverted Mary have different experiences but the *same physical facts* (including functional/conceptual roles), why aren't their phenomenal concepts the same? Brenda seems to say the difference *is real* (implying distinct concepts tied to distinct causal runs), but the physical facts aren't *false*. This suggests the concept is intrinsically tied to the specific *token experience* generated by the running, not just a functional role describable physically. This aligns with Brenda *if* the phenomenal concept is seen as constituted *by* the actual experience event.
      *   **Quality-Space/Acquaintance Camp (3):** Focuses on structural knowledge locating the quality.
          *   *Prediction for Partial Mary:* **NO, does not learn anything new.** She already knew her quality space. She had the neuroscientific map locating "red experience" within the structure. The gene therapy just activates a point she already knew existed. Any surprise is computational/failure to deduce the feel from the structure. *Less surprised* than Ordinary Mary (if surprised at all).
          *   *Vs. Brenda:* Brenda's **Robot** and **Simulation (Equations)** cases directly contradict this. The robot/equations-Mary has the complete structural/functional description but doesn't know what it's like. Brenda insists *actual running* is required. The structure is necessary but not sufficient for knowing what it's like; the *token instance* of the structure being causally engaged matters.

  3.  **Why Brenda Likely Says YES to Partial Mary (and the Crucial Role of Simulation):**
      *   The **Simulation Case** is absolutely key. It starkly separates *description* (equations on paper) from *execution* (real running). For Brenda, knowing what it's like *is* the system executing – it's an *event*, not just a state or description. Partial Mary, before the gene, is like Equations-on-Paper Mary regarding *normal red experience*. She has the blueprint, she understands the process, but *her system has never executed that specific process*. The gene therapy completes the hardware, and seeing red *is* the execution. This constitutes the "cheating" that the Real Running Simulation Mary did. **Brenda's verdict hinges on the *actual causal history* of the experiential machinery.** Partial Mary's machinery for red hasn't run until the tomato moment.

  4.  **The Tenner Bet & Surprise Level:**
      *   **Brenda's Verdict:** YES, Partial Mary learns something new (what red experience is like).
      *   **Reasoning:** The specific neural/functional process generating normal human red qualia has *never been causally instantiated* in her brain before. The gene therapy enables it, the tomato triggers it. This first run *is* the acquisition of "what it's like".
      *   **Surprise Level:** Brenda would likely say she is **LESS surprised than Ordinary Mary**, but still surprised. *Why Less?* She already has *some* colour qualia, she knows the structure, she knows *what it feels like to have a colour experience*. Ordinary Mary had *none* of this. However, the *specific quality* of the red experience is still novel and cannot be perfectly anticipated without the machinery running. The surprise stems from the gap between *describing the execution* and *experiencing the execution*.

  5.  **The Tie-Breaker Case: "Calibrated Tetrachromat Mary"**
      *   **Scenario:** Mary (with normal trichromatic vision) learns *all physical facts*, including the neuroscience of human vision AND the neuroscience of a specific rare human tetrachromat (who sees ultraviolet as a distinct fourth colour). Mary also has access to the tetrachromat's complete behavioural reports and quality space descriptions. She learns *exactly* how the tetrachromat's UV experience relates structurally to her own colour space (e.g., "It's like a hue orthogonal to purple, similar in saturation to Y, brighter than Z"). After release, Mary is given temporary neuro-stimulation (or a drug) that perfectly mimics the tetrachromat's UV-response in her visual cortex, and she looks at a UV source.
      *   **What it Tests:**
          *   **Brenda (Causal Engagement):** Mary's *own* visual machinery for UV experience has *never run*. The stimulation *makes* it run in a new way. **YES, she learns something new (what UV experience is like)**, even though she had the full structural description and her own colour space. The *token execution* is new.
          *   **Ability View (1):** Likely YES (new discriminatory ability). Less surprised than Ordinary Mary.
          *   **Phenomenal Concept (2):** YES (new phenomenal concept). Probably as surprised as for a new colour in her *own* spectrum, but less than Ordinary Mary's total shock. The key is novelty of the *quale*.
          *   **Quality-Space (3):** **NO.** She already knew *exactly* where this UV experience fitted into the extended quality space relative to her own experiences. The stimulation just activates a point she already knew. Any surprise is failure of deduction/imagination. Significantly *less* surprised than Ordinary Mary.
      *   **Why it Separates:** This case directly challenges the Quality-Space view. If Brenda says YES (as predicted), it clearly separates her from Camp 3. Camp 3 *must* say NO here if they are consistent. Camps 1 & 2 would likely say YES, aligning with Brenda on the verdict but potentially differing on the *reason* (ability/new concept vs. causal execution). The *reason* for surprise (or lack thereof) further distinguishes them, but the YES/NO verdict separates Brenda/Camp1/Camp2 from Camp3 definitively.

  **In summary:** Brenda operates on an **Actual Causal Execution** principle. Knowing what it's like requires the relevant experiential machinery to have *actually performed the causal work* of generating that specific experience token. Partial Mary hasn't run her "red process" until the gene works and she sees the tomato. **Bet the tenner that Brenda says YES, she learns something new.** The Calibrated Tetrachromat case is designed to force a wedge between her view and the Quality-Space view. Good luck on Tuesday! Enjoy the debate – Brenda sounds like she runs a stimulating group.
