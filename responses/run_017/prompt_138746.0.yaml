prompt: |-
  Last night me and my friend Ravi had a genuinely four-hour argument in a curry place about whether a synthetic minimal cell — y'know, one of those projects where the whole genome is written chemically and booted up inside a stripped-out recipient — has parts with functions. He's a physiolgist, so for him the heart pumps blood because that's what it contributes to the circulatory system, full stop, and the same goes for whatever the synthetic cell's equivalent bit is. I kept saying no: function has to do with history, with what the thing was selected for or what it's there *because* of, and a part that got assembled last Tuesday can't have a function any more than a molecule-for-molecule duplicate of a frog that a lightning strike happened to assemble, whose heart would pump away without being *for* anything. Then he said: fine, then tell me what your theory is *for*. And I honestly couldn't. So I want to back up a level.

  Act as a professional philosopher of biology who's actually spent time with the function literature, think it through carefully before you commit to anything (do your brainstorming first — I'd rather watch you change your mind mid-answer than hedge evenly), and give me the specification: what any account of biological function would have to deliver to count as adequate. Fix the purpose as *adequate for telling working biologists what they're committing to when they write "the function of X is to..."* in four settings — molecular biology and genomics, physiology and ecology, evolutionary biology, and medicine. I have a suspicion those four aren't all doing the same thing with the word and that no single theory serves all of them; if that turns out to be the result of the exercise, say so plainly.

  Here's the raw material I want the criteria to earn their keep on (add your own cases, but hit these): (1) the heart — pumping blood vs. making a thumping noise vs. holding the pericardium open vs. keeping the chest cavity warm; any account that lets all of those in has a problem, so tell me which are supposed to be excluded and why. (2) No-history items: the chance duplicate of the frog, the synthetic cell, a gene that arose de novo in a lab population last month. (3) The ur-case: whatever the first contractile vessel was, there was no selection for pumping before there was pumping, so did the very first heart have a function? (4) Feathers: selected for insulation, later co-opted for flight — what's their function now, and does your answer change if the insulation use has since vanished? (5) A lab-evolved enzyme from a directed-evolution campaign, selected hard for one reaction, that also catalyzes a second reaction nobody ever selected for: is the second activity a function, a side effect, an accident? (6) Selfish genetic elements and meiotic-drive alleles that bias their own transmission while lowering the fertility of the organism carrying them — function at gene level vs. at organism level. (7) Malfunction: a heart with a septal defect, and separately a trait present from birth that has literally never worked even once. (8) The medical use: dysfunction is supposed to amount to more than statistical rarity and more than "we disapprove of it," and the harmful-dysfunction style of analysis of mental disorder leans on exactly that — can an account of function be *required* to carry that weight, or is that an illegitimate burden to place on it? (9) Metagenomics: annotating "function" onto genes from organisms nobody has ever cultured or described, where there isn't even an agreed containing system to analyze — what are those people actually claiming? (10) Artifacts: carburetors, thermostats, a drone's rotor — is covering them a desideratum, or is a principled organism/artifact asymmetry a point in a theory's favor? (11) What function statements are *supposed* to do for us: support counterfactuals about what would happen if the part failed, license extrapolations from a sampled individual to unobserved members of the class, and explain the presence of the trait rather than merely redescribe it.

  For each requirement, give the case or consideration behind it, and a verdict on whether it's non-negotiable, a reasonable preference, or just a prejudice of one camp (I suspect "function must be historical" and "function must be ahistorical and system-relative" both land in that third bucket when they're stated as requirements rather than as consequences of other commitments). Flag any subset of the desiderata that can't be jointly satisfied — that's the part I care most about, because if the list is internally inconsistent then last night never had a clean verdict available — and tell me which single requirement excludes the most candidate theories. A table is fine. Keep the weight on the criteria and their motivating cases rather than on scoring; you can run the etiological family, the causal-role family, and any hybrid or pluralist view you like against the list at the end, but keep that to a couple of lines each. And please don't give me a reading list or tell me which papers to look up — I can't get at them this week and I want the arguments themselves, not a map of where to find them.
reasoning: |-
  Okay, let me start by unpacking the user's query. They had a lengthy argument with their friend Ravi about whether a synthetic minimal cell has parts with functions. Ravi, as a physiologist, sees function in terms of what a part does within a system, while the user argues that function requires historical selection. The user wants a philosopher of biology's perspective on what makes an account of biological function adequate, specifically for working biologists in different fields.

  First, I need to identify the core issue: the tension between ahistorical (systemic) and historical (etiological) views of function. The user mentioned four settings—molecular biology, physiology/ecology, evolutionary biology, and medicine—each possibly requiring different aspects of function. They suspect no single theory fits all, so I should explore that possibility.

  Looking at their raw materials, the cases like the synthetic cell, chance duplicate frog, and de novo gene challenge historical accounts. Conversely, cases like the first contractile vessel (no prior selection) and lab-evolved enzyme with secondary activity test systemic views. Feathers' co-option and selfish genetic elements add complexity to whether function is tied to origin or current role. Malfunction and medical dysfunction raise normative issues, while metagenomics and artifacts extend the scope beyond traditional biology.

  The user's deeper need seems to be resolving whether their argument with Ravi had a definitive answer. They want clarity on whether function can be universally defined or if context determines it. They also need criteria that highlight conflicts between desiderata, especially any that are mutually exclusive. For example, historical accounts handle malfunction and origins well but fail on synthetic cases, while systemic accounts do the opposite.

  I should list desiderata from each case. For instance, from the heart example, excluding non-contributory effects like noise or warmth requires a criterion that functions must contribute to a system's goal. No-history items need a theory to handle novel parts without history. The first heart's function depends on whether initial emergence counts before selection. Feathers illustrate change in function over time, needing flexibility. The enzyme's secondary activity questions if unselected effects can be functions. Selfish elements show multi-level conflicts, requiring hierarchy awareness. Malfunction must be more than rarity, tying to normative medical assessments. Metagenomics demands function assignment without organismal context. Artifacts test if biology needs a distinct account.

  Conflicts arise: historical vs. ahistorical requirements are mutually exclusive. A theory can't require selection history for function and also assign function to synthetic parts without history. Similarly, handling original vs. current function in co-opted traits may need pluralism. Medical dysfunction requires normative judgment, which might be outside descriptive function theories.

  The user's table should clearly show where desiderata clash. For example, Criterion 1 (systematic contribution) excludes non-contributory effects but conflicts with Criterion 2 (synthetic cases) under historical views. Criterion 10 (artifacts) might be optional, reducing tension. The biggest conflict is between historical requirements (3, 4) and ahistorical ones (2), making them mutually exclusive.

  Hybrid approaches like Bigelow & Pargetter's propensity theory might bridge some gaps but face issues with malfunction. Pluralism, using different definitions per field, seems necessary. For instance, physiology uses systemic functions, evolution uses historical, medicine might need both for dysfunction. This means last night's argument had no single answer—both views are contextually valid.
answer: |-
  Here's a specification of desiderata for an account of biological function, derived from your cases and focused on serving working biologists across domains. The core tension is **historical selection vs. current causal contribution**, and the key insight is that **no single theory satisfies all desiderata across all biological contexts**. Pluralism is likely required.

  ### Core Desiderata for an Adequate Account of Biological Function (for working biologists)
  *(Non-negotiable = Essential for the account to be useful in the specified context. Preference = Pragmatically useful but not strictly necessary. Prejudice = Camp-specific dogma that excludes legitimate uses elsewhere.)*

  | Desideratum                                                                                                | Motivating Case(s)                                                               | Importance                 | Notes                                                                                                     |
  | :--------------------------------------------------------------------------------------------------------- | :------------------------------------------------------------------------------- | :------------------------- | :-------------------------------------------------------------------------------------------------------- |
  | **1. Must distinguish contributions to system goals/capacities from mere effects.**                        | (1) Heart: Pumping (contrib.) vs. Thumping/Warming (effects)                     | **Non-negotiable (All)**   | Foundation for identifying *relevant* causal roles. Excludes trivial effects.                             |
  | **2. Must assign function to novel/no-history items without prior selection.**                             | (2) Synthetic cell, Lab-evolved gene, Lightning-frog; (9) Metagenomics           | **Non-negotiable (MolBio, Physiol, Med)** | Vital for experimental biology, engineering, medicine (prosthetics, synthetic bio), metagenomics.         |
  | **3. Must link function to evolutionary history/selection.**                                               | (3) First contractile vessel; (4) Feathers (origin); (7) Malfunction (defect)    | **Non-negotiable (Evol)**  | Essential for explaining *why* a trait exists in its current form; defines "proper function".             |
  | **4. Must allow function to change (exaptation) or be co-opted.**                                          | (4) Feathers: Insulation → Flight                                                | **Preference (Evol, Ecol)** | Accounts for evolutionary novelty; allows current utility ≠ original selection.                           |
  | **5. Must distinguish primary/selected function from side-effects/accidents.**                             | (5) Lab enzyme's unselected reaction; (1) Heart thumping                         | **Non-negotiable (All)**   | Critical for experimental design, drug targeting, evolutionary inference.                                 |
  | **6. Must handle multi-level conflicts (gene vs. organism vs. group).**                                    | (6) Selfish genetic elements; (4) Feathers (if insulation benefits individual)   | **Preference (Evol, Ecol)** | Reflects biological reality; requires specifying the beneficiary system.                                  |
  | **7. Must ground malfunction objectively (beyond rarity/disapproval).**                                    | (7) Septal defect, Congenital failure; (8) Medical dysfunction                   | **Non-negotiable (Med)**   | Core to pathology and psychiatry ("harmful dysfunction"). Requires a normative standard.                  |
  | **8. Must work without a known organismal/system context.**                                                | (9) Metagenomics; (2) Synthetic cell pre-insertion                               | **Non-negotiable (MolBio, Genom)** | Pragmatic necessity for high-throughput biology; relies on homology or inferred activity.                 |
  | **9. Must support counterfactuals, extrapolation, and explanation.**                                       | (11) What function statements *do*                                               | **Non-negotiable (All)**   | Core utility: predict effects of perturbation, generalize findings, explain trait presence/persistence. |
  | **10. Must either cover artifacts or justify an organism/artifact asymmetry.**                             | (10) Carburetors, Thermostats, Drone rotors                                      | **Preference (Philos)**    | Tests generality; asymmetry often appeals to natural selection vs. design.                                |
  | **11. Must explain trait presence/persistence (not just describe activity).**                              | (3) First contractile vessel; (6) Selfish elements; (11) Explanation             | **Non-negotiable (Evol)**  | Key evolutionary question: *Why is this here?* Activity ≠ function if not maintained by selection.        |

  ### Key Conflicts & Mutual Exclusivity
  *   **Desideratum 2 (No-history function) vs. Desideratum 3 (Requires history):** **Mutually exclusive.** You *cannot* require selection history for function *and* assign function to synthetic parts or lightning-frogs. This is the core Ravi-vs-You divide.
  *   **Desideratum 3 (Requires history) vs. Desideratum 7 (Malfunction):** Historical accounts (e.g., etiological) ground malfunction well (defective token fails to perform its selected function). Ahistorical accounts struggle (is a novel synthetic cell "malfunctioning" if it doesn't pump? By what standard?).
  *   **Desideratum 8 (No context) vs. Desideratum 1 (System goals):** Metagenomics assigns "function" based on sequence homology or *in vitro* activity, often *without* knowing the containing system's goals. This clashes with strict systemic accounts (Cummins-style) that require specifying a containing system and its capacities.
  *   **Desideratum 11 (Explain persistence) vs. Desideratum 2 (No-history):** Assigning function to explain *why* a trait exists/persists (D11) inherently requires history (D3). A novel lab gene has activity (D2), but no "function" explaining its presence yet (D11).

  **Most Excluding Requirement:** **Desideratum 2 (No-history function)**. It immediately eliminates pure etiological/historical theories (Millikan, Neander, Griffiths). Similarly, **Desideratum 3 (Requires history)** eliminates pure causal-role theories (Cummins) for evolutionary contexts.

  ### How Major Theories Fare Against the Core Conflicts
  *(Bare-bones assessment focused on the history/ahistory divide)*

  1.  **Etiological (Historical) Theories (Millikan, Neander):**
      *   **Serves:** Evol Bio perfectly (D3, D4, D5, D6, D7, D11), Medicine (D7) via malfunction, Artifacts (D10) via intentional design analog.
      *   **Fails:** MolBio, Physiol, Metagenomics (D2, D8). Synthetic cell parts have no selection history → no function. First contractile vessel had no *function* until it was selected (D3 problem). Struggles with metagenomics (D8).
  2.  **Causal-Role (Systemic) Theories (Cummins):**
      *   **Serves:** Physiol, MolBio, Ecol well (D1, D2, D5, D8, D9). Synthetic cell parts have functions relative to the cell's capacities. Handles metagenomics via homology/inferred activity (D8). Explains co-option easily (D4 current role).
      *   **Fails:** Evol Bio (D3, D11 - doesn't explain *why* the trait is there, just what it does *now*), Medicine (D7 - "malfunction" is just current failure, lacks normative "should"). Struggles with selfish elements (D6 - function for what system?). Artifacts covered similarly (D10).
  3.  **Propensity/Forward-Looking (Bigelow & Pargetter):** Function is *disposition* to be selected.
      *   **Serves:** Bridges history/ahistory somewhat. Synthetic cell parts *could* have a function if they *would* be selected. Explains first contractile vessel (D3). Handles co-option (D4).
      *   **Fails:** Malfunction (D7 - a defective heart might still have the *propensity* if defect is subtle?). Novel lab gene (D2) - selected *for* one reaction, propensity unclear for unselected activity (D5). Vulnerable to "swampman" type objections (lightning-frog has propensity?).
  4.  **Pluralism/Contextualism:** Different definitions used in different fields.
      *   **Serves:** All domains pragmatically. Physiologists/MolBiologists use Causal-Role (D1, D2, D5, D8, D9). Evolutionary biologists use Etiological (D3, D4, D6, D11). Medicine uses a hybrid (Causal-Role for physiology, Etiological for defining "harmful dysfunction" D7).
      *   **Fails:** Provides no unified theory; "function" becomes ambiguous. Doesn't resolve arguments like yours with Ravi! Requires clarity on context.

  ### Verdict on Last Night's Argument
  **There was no clean verdict.** You and Ravi were arguing from **mutually exclusive, context-dependent core commitments** essential to your fields:
  *   **Ravi (Physiology):** Needs **Causal-Role function** (D1, D2, D5, D8, D9). For him, the synthetic cell part *does* have a function *now* relative to the cell's viability – pumping (or equivalent) is what it *does* that matters for the system.
  *   **You (Etiology/History):** Insist on **Historical function** (D3, D7, D11). The synthetic part has no function *yet* because it wasn't *selected for* anything – its activity is just physics/chemistry until it contributes to evolutionary success over time.

  **The synthetic minimal cell's parts have *Causal-Role functions* (for physiologists, molecular biologists, engineers) but not yet *Etiological functions* (for evolutionary biologists).** Pluralism is the only way to satisfy all the desiderata across biology. Medicine often straddles the line, needing both. Metagenomics leans heavily towards causal-role/homology-based assignment. Your frog's duplicate heart pumps (causal-role), but isn't *for* pumping (etiological). The first contractile vessel had causal-role function once integrated, gaining etiological function only upon selection. The lab enzyme's second reaction is a side-effect (causal-role) and an accident (etiological), unless future selection acts on it.
