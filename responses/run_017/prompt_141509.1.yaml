prompt: |-
  I have supported myself by writing novels for thirty years, and a pattern in the way my colleagues reason about career decisions has begun to bother me.

  Two cases. A friend was offered the choice between a modest guaranteed advance for a dependable book in a series she had already established, and no advance but a far larger share of royalties on a riskier one. She multiplied the share by her agent's estimates, found the second option worth considerably more on average, and took it. So did several of us, on the stated ground that a writing life contains many such choices and that the averages will look after themselves. She has now taken that bet four times, been unlucky twice, and cannot place the fifth book on the terms the first would have secured. Another writer of my acquaintance, who has never once taken the option with the larger average payout, has had a steadily widening career and is now offered more than either of us.

  What bothers me is the direction of the argument. The defence of averaging — there will be many decisions, so expect the average — seems to get weaker, not stronger, the more decisions there are. Over many choices, the person who takes the higher average every time becomes nearly certain to end up worse than the person who does not, and the gap widens with each additional decision. That inversion is the thing I cannot name.

  I should say what I take it not to be. It is not caution about large losses: no single one of these choices threatened to ruin anyone, and nobody was risking money already in hand. It is not that her estimates were poor; suppose them exactly right. And it is not a matter of spreading risk: she could not take both options and had no one to share them with.

  A friend in finance, hearing this, said something about geometric averages that I did not follow, and then gave an account which assumed one is reinvesting money and can lose the whole of one's stake on any single bet. Neither is my situation. In a writing career the floor is soft: a poorly selling book does not bankrupt you, it reduces the print run, the review coverage and the shelf space available to the next one, so that the rate at which a career grows depends on where it currently is, and there is a level below which it decays slowly towards nothing without ever quite arriving.

  Does the phenomenon I have described have an established name, and does the standard treatment of it survive the soft floor? If the nearest established concept fits only imperfectly, I would rather have the mismatches spelled out — including how the thing differs from ordinary aversion to risk, and from ruin in the usual sense — than be handed a label I can repeat. One boundary case matters to me especially: does any of this still apply to a writer who intends to write exactly three more books and then stop, so that there is no long run to appeal to? Please answer in British English.
reasoning: |-
  Hmm, the user is a novelist with thirty years of experience, troubled by a pattern in career decisions among colleagues. They describe two writers: one who consistently takes riskier options with higher expected value but faces declining opportunities after some failures, and another who avoids such risks and sees steady growth. The paradox is that the "averaging" defense seems to weaken with more decisions, leading to near-certain disadvantage for the risk-taker over time.

  Key points from their query:
  - Not about risk aversion: No ruinous losses, money isn't reinvested.
  - Soft floor concept: Poor sales don't bankrupt but erode future opportunities (print runs, reviews, shelf space), creating path dependency.
  - Specific questions: Name for this phenomenon? Does standard analysis handle soft floors? How does it differ from risk aversion or ruin? Relevance to finite cases (e.g., exactly three books).

  The finance friend mentioned geometric averages and reinvestment, which don't apply here. The core issue is multiplicative degradation—each failure compounds by reducing the base for future growth. 

  I recall concepts like "compounding of small disadvantages" or "ergodicity economics" (Ole Peters' work). The key mismatch with standard expected value is that it assumes additive outcomes, whereas here outcomes multiply (e.g., a 20% royalty drop might mean 20% less visibility, harming the next book's baseline). 

  For the three-book case: Path dependency still matters because early failures constrain later opportunities. The safer strategy likely dominates unless the risky option's upside is astronomical. 

  British English phrasing is needed—terms like "royalties," "print run," and "shelf space" align with this. Must avoid Americanisms (e.g., "math" → "maths"). 

  The user values precision over labels, so I'll clarify mismatches:
  - Vs. risk aversion: This isn't psychological; it's structural (non-linear scaling).
  - Vs. ruin: No abrupt failure, just irreversible decay ("glacial decay toward obscurity"). 

  Final framing: Name it "compounding career risk" or "path-dependent decay," but emphasize that no perfect label exists. Stress that soft floors make it *worse* than standard models by dragging out the decline.
answer: |-
  What you've described is a beautifully observed case of **multiplicative path dependence under non-linear scaling**, exacerbated by a "soft floor". While no single term perfectly captures every nuance, the closest established concept is **compounding of small disadvantages** (or **geometric degradation**), often discussed within **ergodicity economics** as a failure of the **ensemble average** to represent **time-average growth**.

  ### Why "Expected Value" Misleads & The Inversion Occurs
  1.  **Non-Linear Scaling (The Multiplicative Effect):** Your career isn't additive; it's multiplicative. A book's success (or failure) doesn't just add/subtract money; it *scales* your career's *trajectory*. A flop doesn't cost £X; it reduces your *baseline* for the next book (smaller print run, less visibility, lower bargaining power). Conversely, a hit amplifies the next baseline. This makes growth *geometric*, not arithmetic.
  2.  **Path Dependence:** Where you end up depends *critically* on the *sequence* of outcomes, not just the proportion of wins/losses. Two early flops (even if followed by wins) create a much lower baseline than two early wins followed by flops. Your risk-taking friend suffered unlucky sequences that permanently degraded her position *before* the "long run" could average out.
  3.  **The Soft Floor Amplifies the Problem:** This is crucial. The soft floor means:
      *   There's no absorbing ruin state (no hard stop), so the model isn't classic "gambler's ruin".
      *   **Degradation is persistent and compounding.** A reduced baseline makes recovery *harder*, requiring disproportionately *more* success just to get back to square one. Each setback isn't just a loss; it's a *handicap* for future rounds. Recovery slows down as you decline.
      *   The decline towards obscurity ("glacial decay") means the *cost* of bad luck accumulates over time without a definitive endpoint, eroding the potential benefit of future good luck.
  4.  **The Fallacy of the Ensemble Average:** The standard "expected value" calculation (average outcome per decision) assumes:
      *   Outcomes are *additive* (like independent coin flips for money).
      *   You can average across many *parallel* instances (an "ensemble" of identical writers taking the bet once).
      *   Capital is perfectly fungible and can be reinvested arbitrarily.
      Your real career is a *single*, *sequential* path through time, where outcomes *multiply* on your existing career capital (reputation, audience size, publisher confidence). The average of many *parallel* paths (ensemble average) tells you little about the likely outcome of your *single sequential* path (time-average). The friend chasing the higher average payout each time increases the *variance* of her *growth rate*. In multiplicative processes, high variance *reduces* long-term growth even if the expected *arithmetic* return is high. Her strategy maximised the chance of a *good* outcome per book, but *minimised* her chance of sustained *growth* over the sequence.

  ### How This Differs From Standard Concepts
  *   **Ordinary Risk Aversion:** This is *not* primarily psychological aversion to loss. It's a *structural* consequence of the multiplicative, path-dependent environment *with persistent degradation*. Even a perfectly rational, risk-neutral writer maximising *long-term wealth* should avoid these high-variance bets *because* they harm the *growth rate* of their career capital. It's rational aversion to volatility in a multiplicative system.
  *   **Ruin (Gambler's Ruin):** Classic ruin involves a *hard floor* (zero capital) where the game stops. Your "soft floor" is different:
      *   **No Absorption:** You never hit zero and stop; you decay slowly.
      *   **Degradation, Not Bankruptcy:** Losses reduce *future potential*, not just current cash. The damage is persistent and compounds.
      *   **Slow Death vs. Sudden Stop:** The risk is a gradual slide into irrelevance, not an abrupt bankruptcy. This makes it harder to recover and less obvious when to stop, but the *underlying multiplicative degradation* is similar in effect to ruin models.

  ### The Boundary Case: Three Books and Stop
  **Yes, the phenomenon still applies strongly.**

  1.  **Path Dependence is Paramount:** With only three decisions, the *sequence* is everything. An early flop dramatically reduces the potential upside of later books. A safer book 1 secures a solid baseline for books 2 and 3. A risky book 1 that flops cripples books 2 and 3 before they're written. The safer strategy minimises the risk of an early catastrophe that poisons the whole short sequence.
  2.  **No Long Run to Recover:** The core argument *for* averaging – "bad luck will even out" – completely vanishes over three books. There simply isn't time. One significant flop, especially early on, dominates the outcome and cannot be "averaged out" by subsequent successes within the sequence. The risk-taker is betting on needing *fewer* successes within the three books to hit their target, but the penalty for each failure is amplified by its timing and the lack of recovery time.
  3.  **Maximising the *Product*, Not the Sum:** The writer needs to maximise the *product* of the scaling factors from each book (e.g., Baseline * Book1_Scale * Book2_Scale * Book3_Scale). High-variance choices (high potential scale, low minimum scale) are dangerous because a single low scale factor drastically reduces the final product. More consistent, moderate scaling factors (the safer option) usually lead to a higher *expected product* and a higher *probability* of an acceptable outcome over a short sequence, even if the maximum *potential* product is lower.

  ### The Established Label & The Mismatches
  The most pertinent label is **Non-Ergodicity** (specifically, non-ergodicity of growth). An ergodic system is one where the time-average (your single path) equals the ensemble average (many parallel paths). Your writing career is profoundly non-ergodic.

  *   **Mismatches with Standard Geometric Mean Analysis (Finance Friend):**
      *   **No Reinvestment:** Your friend isn't betting her *entire accumulated capital* on each book. She's betting her *future career trajectory*. The scaling effect is similar to reinvestment, but the "capital" is intangible (reputation, reach) and the "loss" isn't total bankruptcy but degradation.
      *   **Soft Floor != Zero:** Geometric mean analysis often assumes outcomes >0 (no total loss). Your soft floor means outcomes can be very close to zero asymptotically, but never quite hit it, making the decay persistent but slow – the geometric mean becomes very small, but isn't undefined.
      *   **Non-Monetary Scaling:** The "return" isn't purely monetary; it's the scaling factor applied to complex career capital.
  *   **Why "Compounding Career Risk" is Apt (but imperfect):** It captures the multiplicative, path-dependent degradation of *opportunity* and *potential*. The imperfection is that "risk" often implies only the *chance* of loss, not the *mechanism* of persistent degradation. "Geometric Degradation of Opportunity" is more precise but less common.

  ### In Summary
  Your unease is justified. The standard "maximise expected value per decision" logic fails in sequential, multiplicative environments with persistent degradation (soft floor). The inversion occurs because volatility *harms* long-term growth rates in such systems. Your cautious acquaintance understood, intuitively or explicitly, that preserving and steadily building her baseline was paramount. Her strategy minimised the *variance of her growth rate*, maximising the probability of sustained, compounding improvement – the true engine of career widening. The phenomenon is best understood as **path-dependent compounding of career capital under multiplicative scaling with a soft floor**, a specific case of **non-ergodic growth**. For three books, avoiding early degradation remains critical as there's no time for recovery.
