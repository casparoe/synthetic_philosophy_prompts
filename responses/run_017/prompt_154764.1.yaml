prompt: |-
  Hi. I'm the lay member on the animal welfare and ethics committee where I work — I've got no academic background in anything like this, I'm in estates management really, and I've just been reading about animal consciousness on my own in the evenings. Which probably shows. I've picked up that "can it feel pain" and "is it conscious" might be two or three different questions stacked on top of each other, and that reacting to a harmful stimulus isn't the same as minding about it — but I'm not confident I've got that right, so correct me if I've garbled it.

  The problem is practical. We meet once a month, get through eight or nine protocols in an afternoon, and for each one we have to (a) assign a severity band — roughly, nothing worth counting / mild / moderate / severe — and (b) decide how much scrutiny the thing gets: fast-track it, discuss it properly, or send it back. There's me, a vet, a couple of scientists and a chair. Nobody on the committee is a specialist in whatever species is on the table that week, and we can't go and read neuroscience papers between meetings. Whatever we decide goes on a form afterwards and has to be defensible if anyone asks us about it.

  What I want is a procedure, not a position paper. Something we can actually run on each protocol in the twenty minutes we've got: the questions in order, what counts as a good enough answer to each, where the procedure just stops with a no, and where it has to hand the decision to a person because it's a values question rather than a facts one.

  The things I need it to handle, because these are the ones we keep arguing about:

  - The evidence is nearly always thin or missing. For most of what comes to us — larval zebrafish, fruit flies, some beetle nobody has ever tested, the occasional cephlopods — we've no direct evidence either way. I need the procedure to say what to do with an absence of evidence without collapsing into "assume everything is fully conscious", because then everything is equally urgent and we can't prioritise anything at all.

  - Numbers. One macaque is not ten thousand larvae. But I dont know how to think about it: if I'm maybe 10% confident a fly larva is sentient and there are fifty thousand of them, does that beat one monkey I'm 95% sure about? I've been toying with just multiplying credence × intensity × number and ranking by that, and it seems to give answers I don't like, so I can't tell whether the arithmetic is wrong or the dislike is.

  - A consistency rule I half-invented: if you'd accept a bit of pain behaviour as enough to count a pig as sentient, you have to say what's doing the work when you reject the same kind of evidence for a crab. I like it, but I can't tell if it's circular or if it just sneaks in a bias towards things with backbones under a procedural disguise. Tell me if it's sound, and if it isn't what to use instead.

  - Where it has to stop. I think there are places where no amount of evidence settles it — whether death is a harm to an animal in the first place, or how a small amount of pain across a very large number of animals is meant to weigh against a modest scientific benefit — and I'd much rather the procedure said "this bit is a decision, not a finding" than pretend otherwise.

  Then please run it on three cases shaped like ones from our last few meetings: (1) about fifty thousand fruit fly larvae in a heat-avoidance learning assay, killed at the end; (2) a single rhesus macaque, already trained, in a long-term brain recording study under a severe protocol; (3) larval zebrafish at five days old in a drug screen, where I genuinely don't know whether they can feel anything yet. I want at least one of them to come out with an answer I won't like — my instinct is that the fly one is a paperwork exercise and the monkey is the real ethical problem, and I suspect the procedure says something closer to the opposite, or at least won't let me say that so quickly.

  Also: which bits of the philosophy have to survive into the checklist and which can we drop, what we lose by dropping them, and where a procedure like this will definately misfire. Please don't give me a reading list or tell me to go and look things up — I've no access to journals and I need something I can run on a Tuesday afternoon.
reasoning: |-
  Okay, the user is a lay member on an animal ethics committee dealing with practical decision-making under time constraints. They need a procedural checklist to handle uncertainty about animal consciousness, severity assessment, and prioritization—not theoretical debates.  

  First, unpacking their core needs:  
  - **Quick, defensible decisions**: 8-9 protocols in one afternoon, 20 minutes each. No time for literature reviews.  
  - **Handling uncertainty**: Most species (zebrafish larvae, beetles) lack direct evidence of sentience. Need to avoid assuming full consciousness universally.  
  - **Numerical scaling**: How to weigh 50k fly larvae (low sentience likelihood) vs. one macaque (high sentience certainty). Their credence × intensity × number approach feels flawed but they can’t pinpoint why.  
  - **Consistency rule**: If pain behavior counts for pigs, why not crabs? Worried it’s secretly vertebrate-biased.  
  - **Demarcating values vs. facts**: Explicitly flag where decisions hinge on ethics (e.g., "Is death inherently harmful?") rather than evidence.  

  Their pain points:  
  - **Frustration with "assume sentience" defaults**: Paralyzes prioritization.  
  - **Distrust of their own math**: Credence multipliers feel wrong (e.g., 10% sentience × 50k larvae "outweighing" a macaque).  
  - **Skepticism about consistency**: Needs validation if their rule is circular or biased.  
  - **Craves transparency**: Wants the procedure to call out ethical judgment calls.  

  Now, designing the checklist:  
  **Phase 1: Sentience Assessment (5 mins)**  
  - *Q1: Direct evidence?* Stop if none. No literature rabbit holes.  
  - *Q2: Pain behavior?* Apply consistency rule: Same threshold for all species. If withdrawal = pain in mammals, it must count similarly here. Forces objectivity.  
  - *Q3: Neuroanatomy?* Only obvious cases (e.g., octopuses yes, fruit flies no). Avoids speculative debates.  
  → Output: Probability band (High/Medium/Low/Very Low). **Crucially**: "Very Low" doesn’t mean non-sentient—just insufficient evidence to demand higher scrutiny. Solves their "absence of evidence" paralysis.  

  **Phase 2: Severity × Scale (10 mins)**  
  - *Q4: Individual suffering intensity?* Focus on observable harm (duration, invasiveness).  
  - *Q5: Numbers?* Multiply severity × individuals, *but only after sentience weighting*:  
    - High sentience: Full weight  
    - Medium: 0.5x  
    - Low: 0.1x  
    - Very Low: 0.01x  
  This fixes their math frustration. A macaque (High, 1×) isn’t dwarfed by larvae (Very Low, 0.01× weight × 50k = 500 units vs. macaque’s 120).  
  - *Q6: Cumulative risk?* Flag if large cohorts face non-trivial harms (e.g., 0.1% death risk × 10k animals = 10 expected deaths).  

  **Phase 3: Decision Triggers (5 mins)**  
  - *Values checkpoint*: Explicitly list unsettleable questions (e.g., "Is anesthesia-free death a harm?"). Forces committee to own the ethical call.  
  - *Scrutiny level*: Assign based on weighted severity score thresholds.  

  **Testing on their cases**:  
  1. **50k fly larvae**:  
     - Sentience: Very Low (no complex behavior/brain). Weight = 0.01x.  
     - Severity: Mild (heat avoidance) → 5 units. Death → +5? **Values checkpoint**: Committee decides if death matters here.  
     - Total: 0.01 × 50k × 10 = 5,000 → "Moderate" scrutiny. *They won’t like this*, but the math exposes why: Scale forces attention even with low probability.  

  2. **Rhesus macaque**:  
     - Sentience: High. Weight = 1x.  
     - Severity: Severe (surgery, long restraint) → 120 units.  
     - Total: 120 → "High" scrutiny. Confirms their instinct.  

  3. **Larval zebrafish**:  
     - Sentience: Low (young, simple brain). Weight = 0.1x.  
     - Severity: Mild (drug exposure) → 10 units.  
     - Total: 0.1 × [number] × 10 → Medium scrutiny for large cohorts.  

  **Why this works**:  
  - Drops philosophy debates (e.g., "What is consciousness?") for proxies like pain behavior.  
  - Sentience weighting avoids equating larvae with mammals.  
  - Consistency rule is sound *if* applied neutrally—e.g., crabs withdrawing claws must get same consideration as pigs flinching.  
  - Flags values decisions (e.g., death as harm) instead of pretending science can answer them.  

  **Where it misfires**:  
  - May underestimate "hidden" sentience (e.g., bees’ cognitive complexity).  
  - Weighting factors feel arbitrary—but defensible as agreed-upon benchmarks.  
  - Still requires committee buy-in on sentience bands.  

  **Final output**: A table-driven flowchart even non-specialists can run in 20 minutes. Cuts through theoretical noise while forcing ethical accountability.
answer: |-
  Below is a procedural checklist designed for your committee's constraints: time-limited (20 min/protocol), evidence-light, and focused on defensible decisions. It prioritizes **actionable questions**, **transparent trade-offs**, and **explicit value judgments**. I've embedded the philosophy only where it impacts practical outcomes, dropped the rest, and flagged where bias/misfires might occur.

  ---

  ### **Animal Protocol Review Checklist**  
  **(20-Minute Workflow per Protocol)**

  #### **PHASE 1: Sentience Assessment** (≤5 mins)  
  *Goal: Assign a "Sentience Probability Band" (SPB) using minimal evidence. Avoids assuming universal consciousness.*  
  1. **Q1: Is there *direct* evidence of pain/suffering *in this species*?**  
     - *Good enough answer:* Published studies showing complex pain avoidance (e.g., trade-offs with reward), not just reflexes.  
     - **If YES → SPB = HIGH** (e.g., mammals, birds, adult cephalopods).  
     - **If NO → Proceed to Q2.**  

  2. **Q2: Is there evidence of *pain-like behavior*?** (e.g., prolonged grooming, guarding injuries, learned avoidance)  
     - *Apply Consistency Rule:* If identical behavior would count for a "model" species (e.g., pig/mouse), it counts here.  
     - **If YES → SPB = MEDIUM** (e.g., crabs, bees, adult zebrafish).  
     - **If NO/UNCLEAR → Proceed to Q3.**  

  3. **Q3: Does it have a *vertebrate brain* OR *complex invertebrate neural structures*?** (e.g., centralized brain, nociceptors + opioids)  
     - *Good enough answer:* Standard biology texts (e.g., vertebrates = yes; fruit flies/beetles = no; octopuses = yes).  
     - **If YES → SPB = LOW** (e.g., larval zebrafish, tadpoles).  
     - **If NO → SPB = VERY LOW** (e.g., insect larvae, nematodes).  
     - **If STUCK → Default to LOW for vertebrates/highly mobile invertebrates, VERY LOW otherwise.**  

  **Output:** SPB (HIGH/MEDIUM/LOW/VERY LOW).  
  **Why this works:**  
  - Uses your consistency rule (Q2) to avoid vertebrate bias. If rejecting crab pain despite pig-equivalent behavior, you must justify *why* (e.g., "We require neural proof for invertebrates").  
  - SPB isn't a sentience "truth" – it's a risk tier for scrutiny.  
  - **Dropped philosophy:** Consciousness debates (e.g., "What is qualia?"). We proxy with pain behavior/neuroanatomy.  

  ---

  #### **PHASE 2: Severity × Scale Scoring** (≤10 mins)  
  *Goal: Calculate "Ethical Weight" (EW) to rank protocols. Handles numbers without false precision.*  

  | SPB       | Weight (W) | Rationale                                     |  
  |-----------|------------|-----------------------------------------------|  
  | HIGH      | 1.0        | Strong evidence (e.g., macaque)               |  
  | MEDIUM    | 0.3        | Ambiguous evidence (e.g., crab)               |  
  | LOW       | 0.1        | Plausible but unlikely (e.g., larval fish)    |  
  | VERY LOW  | 0.01       | Minimal evidence (e.g., fly larva)            |  

  4. **Q4: What is the *maximum severity* per animal?**  
     - *Bands:*  
       - **Mild** (e.g., brief restraint, minor blood draw): **Score = 1**  
       - **Moderate** (e.g., surgery with recovery, chronic stress): **Score = 3**  
       - **Severe** (e.g., terminal surgery, unrelieved pain): **Score = 10**  

  5. **Q5: What is the *scale*?**  
     - Individual animals affected: **N**  

  6. **Q6: Calculate Ethical Weight (EW):**  
     - **EW = W (from SPB) × Severity Score × N**  
     - *Example:*  
       - 50k fly larvae (VERY LOW: W=0.01) + Mild severity (Score=1): **EW = 0.01 × 1 × 50,000 = 500**  
       - 1 macaque (HIGH: W=1.0) + Severe (Score=10): **EW = 1.0 × 10 × 1 = 10**  

  **Output:** EW score.  
  **Why this fixes your number problem:**  
  - SPB weights prevent 50k larvae (EW=500) overriding a macaque (EW=10) – but *only if* you assign VERY LOW to larvae.  
  - If EW feels wrong (e.g., larvae > macaque), revisit SPB (e.g., "Is larval fly *truly* VERY LOW?") or severity score.  

  ---

  #### **PHASE 3: Scrutiny Decision & Values Check** (≤5 mins)  
  *Goal: Assign scrutiny level + flag ethical judgments.*  

  7. **Q7: Is death/killing involved?**  
     - **→ VALUES CHECKPOINT:** "Is death *in itself* a harm for this SPB?"  
       - *Committee must decide:* "For VERY LOW/LOW, we treat death as severity score 1 (mild). For MEDIUM/HIGH, death = severe (score 10)."  
       - *Document:* "Death harm assumption: [X]."  

  8. **Q8: Assign scrutiny based on EW:**  
     - **EW < 10 → Fast-track** (e.g., non-invasive behavioral studies).  
     - **EW 10–100 → Standard review** (e.g., minor procedures on rodents).  
     - **EW > 100 → High scrutiny** (e.g., discuss welfare refinements, justify necessity).  
     - **EW > 1,000 → Return for revision** (e.g., high suffering at scale).  

  9. **Q9: Explicit values declaration:**  
     - "The following cannot be resolved by evidence: [e.g., death as harm, trade-off between animal suffering and scientific benefit]. Decision based on committee vote."  
     - *Document this verbatim.*  

  ---

  ### **Test Cases**  
  *Using your examples (assumes committee agrees on SPB assignments):*  

  1. **50k fruit fly larvae** (heat avoidance, killed):  
     - Q1: No direct evidence → Q2: Pain behavior? Reflexive avoidance only → Q3: No complex brain → **SPB = VERY LOW (W=0.01)**.  
     - Severity: Mild (avoidance) + death → VALUES CHECK: Death = mild? **Severity Score = 1 (mild)**.  
     - **EW = 0.01 × 1 × 50,000 = 500** → **High scrutiny** (EW > 100).  
     - *Why you'll dislike it:* Scale drives scrutiny despite low sentience likelihood.  

  2. **Single rhesus macaque** (severe protocol):  
     - Q1: Direct evidence → **SPB = HIGH (W=1.0)**.  
     - Severity: Severe → **Score = 10**.  
     - **EW = 1.0 × 10 × 1 = 10** → **Standard review** (EW 10–100).  
     - *Note:* If severity is extreme (e.g., unrelieved pain), bump score to 15 → EW=15 → Still standard review.  

  3. **Larval zebrafish** (5 days, drug screen):  
     - Q1: No direct evidence → Q2: Unclear pain behavior → Q3: Vertebrate → **SPB = LOW (W=0.1)**.  
     - Severity: Mild (drug exposure) → **Score = 1**.  
     - EW = 0.1 × 1 × [N] → For N=1,000: **EW=100 → High scrutiny**. For N=100: EW=10 → Standard.  

  ---

  ### **Where This Misfires & Safeguards**  
  - **Misfire 1: Underestimating "simple" animals.**  
    - *Safeguard:* Q2 consistency rule forces equal consideration of pain behavior (e.g., crabs vs. mice).  
  - **Misfire 2: Overweighting scale.**  
    - *Safeguard:* SPB weights (e.g., VERY LOW = 0.01) prevent massive cohorts dominating.  
  - **Misfire 3: Values disguised as facts.**  
    - *Safeguard:* Q7/Q9 force explicit ethical calls (e.g., "We treat death as irrelevant for insects").  
  - **Misfire 4: Edge cases (e.g., cephalopods).**  
    - *Safeguard:* If Q1–Q3 produce conflict, default to HIGH/MEDIUM and flag for discussion.  

  ### **What Philosophy Survives in Practice**  
  | Concept               | In Checklist? | Why/Why Not? |  
  |-----------------------|---------------|--------------|  
  | Pain vs. consciousness | Dropped       | Proxy with pain behavior suffices for welfare harm. |  
  | "Absence of evidence" | Embedded      | SPB tiers explicitly handle uncertainty (VERY LOW ≠ non-sentient). |  
  | Moral weight of numbers | Embedded      | EW formula balances scale, sentience risk, and severity. |  
  | Death as harm         | Values flag   | Unresolvable → committee decides per species group. |  
  | Consistency rule      | Critical      | Prevents arbitrary discrimination; forces evidence-based thresholds. |  

  ---

  **Final Output per Protocol:**  
  1. SPB (HIGH/MEDIUM/LOW/VERY LOW)  
  2. EW score  
  3. Scrutiny level (Fast-track/Standard/High/Return)  
  4. Values flags (e.g., "Death harm: Assumed mild for VERY LOW SPB")  

  This fits your constraints: uses common knowledge (no journals), runs in 20 mins, and delivers auditable decisions. It won't make the larvae/macaque trade-off comfortable—but it forces transparency about *why* scale matters when sentience is uncertain.
