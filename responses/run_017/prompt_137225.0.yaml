  You're a professional philosopher who's graded a lot of upper-year essays in philosophy of action and rational choice. Please go slowly and carefully here: work through the answer line by line before you settle on a number, and start by writing out everything the answer gets right before you decide anything about the mark. I'd rather have a picky, argument-by-argument read than a confident gut call.

  Context: I'm the TA for a third-year seminar on practical rationality and I'm on the last stack of take-homes. The rubric I was handed splits question 4 (worth 20 of the 100 marks) into 5 marks for stating the formal difference between exponential and (quasi-)hyperbolic discounting correctly, 7 for applying it properly to the case, 5 for making something of the sophistication/naivete distinction, and 3 for overall argumentative clarity. This particular answer I've read four times and I keep flip-flopping between a high 2:1 and a low 2:2 — it's very fluently written and I don't trust that I'm not just rewarding the prose. It's also a bit close to home: I've been running the exact pattern in part (b) with my own thesis chapter for about eight months now, which is its own reason not to trust my reaction. The course hasn't done any formal work beyond the beta-delta form, so please don't penalise the answer for not engaging with the literature, and don't give me citations or a reading list — I want the reasoning only.

  Here's the question I set:

  Q4 (about 600 words). Sam has a chapter due in five days. On each of four evenings, E1 through E4, he settles on the same plan: skip work tonight, do two hours tomorrow evening instead. Each time he forms this plan it is his all-things-considered judgment about what to do that evening — he doesn't judge that skipping tonight is worse, because he believes (falsely, and against the evidence of the preceding evenings) that tomorrow he will definitely work. He never gives up the standing judgment that getting the chapter done this week matters more to him than an evening of television, and on each evening he would pay some real cost to make the whole week's sequence come out differently. On E4 he can no longer postpone: he judges he must work tonight, and he does, badly, and submits something he's ashamed of. Call this the Rolling Plan.

  Some philosophers hold that modelling temporal discounting as hyperbolic rather than exponential makes akrasia look less mysterious; others hold that it changes the subject, replacing the question of why an agent freely and intentionally acts against his own better judgment with a different question about consistency over time.

  (a) Set out the formal difference between exponential and (quasi-)hyperbolic discounting — you may use the simple beta-delta form, in which a reward available now has value 1 and a reward at delay t has value beta-delta-to-the-t, with beta between 0 and 1 — and say why one of these is time-consistent and the other is not.

  (b) Apply this to the Rolling Plan. In particular: does Sam, anywhere in the sequence, act akratically in the strict sense — freely and intentionally doing A while judging, all things considered, that B would be better? If not, is there still something here that needs explaining, and is hyperbolic discounting the right thing to invoke to explain it?

  (c) Say what difference it would make if Sam were sophisticated (correctly predicting his future selves' preferences) rather than naive, and whether the availability of Ulysses-style commitment devices settles the matter.

  And here's the answer, unedited except for typos I've silently fixed:

  Discounting is just the fact that we value goods less the further away in time they are. Under exponential discounting the value of a reward at delay t is delta-to-the-t, so the ratio between the values of any two adjacent periods is constant. Under quasi-hyperbolic discounting the value is beta times delta-to-the-t for any t of at least 1, so everything that isn't happening right now gets an extra shave. This is best thought of as a difference of degree rather than kind: a hyperbolic discounter simply cares more about the present than about the future, and beta is just a way of writing down that he discounts the future more steeply than an exponential discounter does.

  This is what produces the reversal. At E1, choosing between one unit of pleasure tonight and two units at E5, the delayed option wins, because at that distance beta multiplies both options and cancels out. Once tonight arrives, the immediate option keeps its full value while the delayed one still gets multiplied by beta, so with a small enough beta the smaller sooner option wins. That is why Sam keeps reversing: from the standpoint of any evening, working tomorrow looks fine, and from the standpoint of tomorrow it looks worse than the television.

  Applied to the Rolling Plan, though, Sam is not acting akratically at any point. He never does A while judging that B would be better; on every evening his all-things-considered judgment is that he should skip tonight and work tomorrow, and that is exactly what he does. So the traditional puzzle of akrasia doesn't even get going here, which supports the first of the two views in the question. What we have instead is a change of preference over time, and a change of preference over time is not irrational — if I prefer coffee on Monday and tea on Tuesday, nobody says I'm being irrational. So there is no irrationality anywhere in the Rolling Plan, and the only practical upshot is that Sam should use a commitment device before E1, e.g. delete the streaming apps or give his laptop to a friend. It's also worth noting that because his discount function is hyperbolic, his preferences are formally inconsistent, so he is vulnerable to a money pump: a bookie could offer him a sequence of trades that leaves him worse off however things turn out, which is the same kind of incoherence you get from intransitive preferences, and that is where the real irrationality lies.

  Finally, sophistication. A sophisticated agent knows his future self will reverse, so he precommits at E1 and gets the outcome he wants, whereas a naive agent wrongly expects his future self to cooperate and ends up with nothing. Sophistication is therefore what turns the Rolling Plan from a trap into a solved problem; being sophisticated is always better than being naive, and the availability of commitment devices is all that's needed for that.

  What I want from you: a mark out of 20 with a breakdown across the four rubric items, and the specific margin comments I could paste back to the student — quote the sentence you're responding to, say exactly what's wrong or right with it, and skip the general impressions. Also, two extras: first, flag anything here that a grader working fast would let slide but shouldn't; second, give me a one-paragraph sketch of what a first-class answer to Q4 would actually say, so I can calibrate the rest of the stack against it. And please don't let the fluency of the writing push the mark up on its own.
