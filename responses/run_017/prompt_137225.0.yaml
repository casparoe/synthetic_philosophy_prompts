  ### Grading Breakdown & Margin Comments  
  **Total: 13/20** (Solid 2:2 / B-)  
  *(Rubric: Formal Difference 3/5, Application 5/7, Sophistication 3/5, Clarity 2/3)*  

  ---

  #### **Part (a): Formal Difference (3/5)**  
  **What’s correct:**  
  - "Under exponential discounting the value of a reward at delay t is delta-to-the-t" → Correctly defines exponential discounting.  
  - "Under quasi-hyperbolic discounting the value is beta times delta-to-the-t for any t of at least 1" → Accurately states β-δ formalism.  
  - "Exponential discounting has a constant ratio between adjacent periods" → Right about time-consistency.  

  **Errors needing correction (quote-specific):**  
  > "This is best thought of as a difference of degree rather than kind."  
  **→ Incorrect.** Exponential is time-*consistent* (preferences don’t reverse over time), while hyperbolic is time-*inconsistent* (reversals are structural). This is a categorical difference in rationality implications, not merely degree. *[Major omission: Fails to explicitly state why exponential is time-consistent (no preference reversals) vs. hyperbolic’s inconsistency (reversals inevitable when t=0)].*  

  > "Beta is just a way of writing down that he discounts the future more steeply."  
  **→ Misleading.** β isn’t just "steeper discounting"; it’s a *present bias* that disproportionately devalues *all* delayed rewards vs. immediate ones. Exponential can be steep (low δ) without inconsistency.  

  **Grade:** 3/5 (Misses core conceptual distinction; oversimplifies rationality implications).  

  ---

  #### **Part (b): Application (5/7)**  
  **What’s correct:**  
  - "Sam is not acting akratically at any point" → Correctly notes no strict akrasia (no A-ing while judging B better).  
  - "What we have instead is a change of preference over time" → Rightly identifies preference reversal.  
  - "His preferences are formally inconsistent... vulnerable to a money pump" → Excellent point about dynamic inconsistency as irrationality.  

  **Errors needing correction (quote-specific):**  
  > "A change of preference over time is not irrational — if I prefer coffee on Monday and tea on Tuesday, nobody says I'm being irrational."  
  **→ False analogy.** Sam’s "preference changes" are *time-inconsistent*: His E1 plan (work later) is reversed *by his own reasoning* at E2–E4. This violates rationality norms (e.g., plan stability), unlike harmless taste shifts. *[Critical: Fails to distinguish innocuous preference changes from dynamically inconsistent ones.]*  

  > "The only practical upshot is that Sam should use a commitment device before E1."  
  **→ Incomplete.** While true, misses that hyperbolic discounting *explains why* the reversal happens (present bias at each Ei when "tomorrow" becomes "today"). Also ignores that commitment devices *address symptoms* but don’t resolve the underlying inconsistency.  

  **Grade:** 5/7 (Strong on akrasia and money-pump insight, but undersells irrationality and explanatory role of hyperbolic discounting).  

  ---

  #### **Part (c): Sophistication/Naiveté (3/5)**  
  **What’s correct:**  
  - "A sophisticated agent knows his future self will reverse, so he precommits at E1" → Accurate core definition.  
  - "A naive agent wrongly expects his future self to cooperate" → Correct contrast.  

  **Errors needing correction (quote-specific):**  
  > "Sophistication is therefore what turns the Rolling Plan from a trap into a solved problem; being sophisticated is always better than being naive."  
  **→ Overstated.** Sophistication can lead to *worse* outcomes if no commitment device exists (e.g., Sam might preemptively procrastinate on E1 knowing he’ll fail later). Naiveté isn’t always worse (e.g., if Sam luckily faces no temptations). *[Key nuance missed: Sophistication without commitments may cause pessimism-driven failure.]*  

  > "The availability of commitment devices is all that’s needed."  
  **→ Incomplete.** Commitment devices "settle" the practical issue but don’t resolve the *rationality puzzle*: Sophisticated Sam still *experiences conflict* (his E1 self overrules later selves’ preferences), which some philosophers argue retains an element of agency fragmentation.  

  **Grade:** 3/5 (Adequate distinction but ignores trade-offs of sophistication and oversimplifies commitments).  

  ---

  #### **Overall Clarity (2/3)**  
  - **Strengths:** Logically structured, fluent prose, coherent narrative.  
  - **Weaknesses:** Errors in key arguments (e.g., irrationality claim, sophistication) undermine clarity. The money-pump point is clear but partially redeems only one section.  
  - **Rubric Penalty:** –1 for substantive inaccuracies affecting comprehensiveness.  

  ---

  ### **"Fast Grader" Traps Flagged**  
  1. **"Difference of degree" claim:** Sounds plausible but fundamentally misrepresents time-consistency.  
  2. **"No irrationality" assertion:** Easily missed due to confident tone; contradicts money-pump argument later.  
  3. **Sophistication "always better":** Oversimplification that’s rhetorically smooth but ignores literature on sophistication costs.  

  ---

  ### **First-Class Answer Sketch**  
  A top response would:  
  - **Formal Difference:** Explicitly contrast time-consistency (exponential: constant discount *rate*) vs. time-inconsistency (hyperbolic: disproportionate present bias via β). Emphasize that exponential agents never reverse plans, while hyperbolic agents inevitably do when delays become immediate.  
  - **Application:** Argue Sam exhibits *dynamic inconsistency*, not akrasia: At each Ei, his "skip tonight" plan aligns with his judgment, but reversals stem from β distorting value at t=0. Stress that this *is* irrational (violates diachronic rationality norms) and that hyperbolic discounting explains *why* the cycle occurs structurally.  
  - **Sophistication/Naiveté:** Note sophistication enables precommitment but may cause preemptive failure if commitments are costly/unavailable. Naiveté perpetuates cycles via false optimism. Commitment devices "solve" the practical problem but don’t eliminate preference conflict, leaving philosophical questions about fractured agency unresolved.  
  - **Clarity:** Use Sam’s timeline to map discounting math (e.g., at E1: βδ⁴ > δ⁵ [work later]; at E4: 1 > βδ [TV now]), explicitly defining terms.  

  ---  
  **Final Note:** This answer’s fluency masks conceptual gaps (e.g., rationality status, sophistication trade-offs). 13/20 is fair: Above passing but below 2:1 due to substantive errors in core sections. If polished, it’s a high 2:2.
