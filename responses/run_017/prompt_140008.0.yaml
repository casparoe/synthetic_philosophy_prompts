     - (C) Both, but qualified (e.g., "from this perspective empty space, from that solid").
     - (D) Neither; it would not describe the table in either way.

  7. **Same sentence in same respect**: Can the statement "The knife is good" be both true and false at the same time and in the same respect?
     - (A) Yes.
     - (B) No.

  8. **Self-application**: Is the statement "Every claim is true only in some respect" itself true only in some respect?
     - (A) Yes.
     - (B) No.

  9. **Smashed pot describable?**: Can we fully describe what happened to the pot when it smashed?
     - (A) Yes.
     - (B) No, the full reality is beyond what we can put into words.

  10. **Seven-mode for pot**: Which of these best captures the smashed pot situation?
      - (A) The pot is (still exists).
      - (B) The pot is not (does not exist).
      - (C) The pot both is and is not.
      - (D) The pot is indescribable.

  Scoring Key for Positions:

  - **Jain view**: 
     - Q1: C
     - Q2: C
     - Q5: B or C
     - Q6: D
     - Q8: A (self-applicable)
     - Q9: B
     - Q10: D

  - **Framework relativism**:
     - Q5: A
     - Q6: C
     - Q8: A

  - **Domain-specific truth** (truth is different in different domains):
     - Q3: C
     - Q5: A
     - Q6: C or D (if D, then they might be in ineffability) -> typically C
     - Q8: A or B (often A)

  - **Plain monism** (one complete true description):
     - Q2: A
     - Q3: A or B (not C)
     - Q5: B
     - Q6: A or B
     - Q8: B (not self-applicable)
     - Q9: A

  - **Contradiction-tolerant (dialetheism)**:
     - Q7: A

  - **Deflationary/quietist** (dispute is merely verbal):
     - Q5: A
     - Q6: A or B or C (but often they might say the dispute is resolved by clarification, so no need for omniscience to say both)
     - Q7: B

  - **Ineffability (determinate)**: 
     - Q6: D
     - Q9: B
     - Q10: D (or sometimes C, but D is more pure ineffable)

  - **Ineffability (indeterminate)**:
     - Q6: D
     - Q9: B
     - Q10: D
     and also they might say that there is no fact of the matter, so for Q1, not C but A or B might not fit. They might choose C because they think it's both and also ineffable.

  We'll also note that some combinations are incoherent or unattractive, e.g., choosing Q5 A and Q7 A (resolvable by clause but also contradiction in same respect) might be rare.

  For the 75-minute session:

  - Distribute the handout (10 questions) and give students 20 minutes to answer.
  - Then, provide the scoring key and have them tally their position. (10 minutes)
  - Group students by position and have them discuss: what are the strengths and weaknesses of their position? (20 minutes)
  - Then, have a representative from each group present their position and the key points of their discussion. (20 minutes)
  - Conclude with a brief overview of the Jain view and how it fits into the landscape. (5 minutes)

  This should help them see the logical space.

  Note: The scoring might not be perfect, but the point is to trigger reflection.
answer: |-
  Below is a diagnostic handout designed to help students map their intuitions about truth and disagreement onto concrete positions in logical space. The questions use only case-based scenarios, avoiding all forbidden terms and direct metaphysical queries. The taxonomy is built from the branching structure of the underlying distinctions, with positions assigned to the resulting leaves. Empty/incoherent branches and indistinguishable positions are flagged.

  ---

  ### **Diagnostic: Truth in Cases**
  **Instructions:** For each scenario, select the answer that best reflects your view. There are no "right" answers—this diagnoses your intuitive inclinations. Answer honestly.

  1. **Smashed Pot**: A clay pot is shattered into pieces. All its material still exists, but it can no longer hold water. Is the pot still there?  
     (A) Yes, it’s still a pot (just broken).  
     (B) No, it’s no longer a pot.  
     (C) It’s both there and not there in different ways, and this can’t be captured in words.  

  2. **Eyewitnesses**: Two honest witnesses see the same protest. One says, “The police acted violently.” The other says, “The police showed restraint.” What should we conclude?  
     (A) Only one is correct—they contradict each other.  
     (B) Both could be correct, depending on what they focused on.  
     (C) Neither is fully correct—the whole truth can’t be put into words.  

  3. **Table Description**: A physicist calls a table “mostly empty space.” A carpenter calls it “solid wood.” Which is right?  
     (A) The physicist is right (it’s atoms and void).  
     (B) The carpenter is right (it’s sturdy for use).  
     (C) Both are right, but in different senses.  

  4. **Knife Utility**: A knife excels at cutting bread but fails at filleting fish. Is the knife good?  
     (A) Yes (it’s great for bread).  
     (B) No (it’s terrible for fish).  
     (C) It’s both good and not good, depending on the task.  

  5. **Adding Context**: For the eyewitnesses (Q2), if we rephrase their claims as “The police acted violently in some respects” and “The police showed restraint in some respects,” does this resolve the conflict?  
     (A) Yes—they’re now compatible.  
     (B) No—the conflict runs deeper.  
     (C) It helps, but the full truth is still beyond words.  

  6. **Omniscient Being**: If a being knew *everything* about the table (Q3), how would it describe it?  
     (A) As “mostly empty space” (that’s fundamental).  
     (B) As “solid wood” (that’s practically relevant).  
     (C) With both descriptions, qualified (e.g., “in this way… in that way…”).  
     (D) It wouldn’t use either description—words fall short.  

  7. **Knife Statement**: Could “This knife is good” be *true* and *false* at the same time, in the exact same sense?  
     (A) Yes.  
     (B) No.  

  8. **Self-Application**: Consider the claim: “All claims depend on some perspective or condition.” Does this claim itself depend on a perspective or condition?  
     (A) Yes.  
     (B) No.  

  9. **Pot Destruction**: After smashing (Q1), can we fully describe what happened using words like “clay exists” and “pot is gone”?  
     (A) Yes—that’s the whole story.  
     (B) No—something crucial escapes description.  

  10. **Eyewitness Ineffability**: For the protest (Q2), if we can’t fully capture the truth, is this because...  
      (A) ...there’s a definite reality words can’t reach?  
      (B) ...nothing settles which witness is right?  

  ---

  ### **Taxonomy: Logical Space & Positions**
  The tree branches based on your answers, mapping to named positions. Combinations are generated by five key questions derived from your responses:  
  - **Branch 1 (Conflict Location)**: Is conflict in the *object* (reality has incompatible aspects) or *us* (our limitations)? → **Q5** (A: *us*; B/C: *object*).  
  - **Branch 2 (Total Standpoint)**: Is there a non-partial standpoint (e.g., for an omniscient being)? → **Q6** (A/B: *yes*; C: *no*; D: *yes, but ineffable*).  
  - **Branch 3 (Same Respect)**: Can one sentence be true/false identically? → **Q7** (A: *yes*; B: *no*).  
  - **Branch 4 (Operator Scope)**: Is “in some respect” a *shorthand for parameters* or an *irreducible modifier*? → **Q5** + **Q3** (A in Q5: *shorthand*; B/C in Q5 + C in Q3: *modifier*).  
  - **Branch 5 (Self-Application)**: Does the doctrine apply to itself? → **Q8**.  
  - **Branch 6 (Ineffability Type)**: Is the unsayable *beyond language* or *indeterminate*? → **Q10**.  

  #### **Decision Tree & Positions**  
  ```  
  1. Conflict in US (Q5=A)?  
     ├── Yes → 2. Total standpoint? (Q6)  
     │    ├── A/B: 3. Shorthand params? (Q5=A + Q3=A/B) → **Deflationary Quietist** (dispute is verbal; add clauses to resolve)  
     │    ├── C: 4. Self-applies? (Q8=A) → **Framework Relativism** (truth relative to frameworks; no privileged view)  
     │    └── D: [EMPTY: Incoherent. If conflict is in us, no ineffable totality needed.]  
     └── No (Q5=B/C) → 5. Total standpoint? (Q6)  
          ├── A/B: **Plain Monism** (one complete truth; we’re ignorant of it)  
          ├── C: 6. Same respect? (Q7)  
          │    ├── A: **Contradiction-Tolerant** (e.g., dialetheism; reality admits true contradictions)  
          │    └── B: **Domain-Specific Truth** (different "truth-makers" in different domains, e.g., physical vs. practical)  
          └── D: 7. Self-applies? (Q8)  
               ├── A: 8. Ineffability type? (Q10)  
               │    ├── A: **Ineffability (Determinate)** (reality is fixed but language fails; an omniscient being "knows" it)  
               │    └── B: **Ineffability (Indeterminate)** (nothing to know; reality unsettled)  
               └── B: 9. Seven-mode intuition? (Q1=C, Q2=C, Q10=A) → **Jain Anekāntavāda** (reality multi-sided; total view ineffable; qualified assertions)  
                       ├── Subsidiary leaf: **Seven-Mode Scheme** (Q1=C, Q2=C, Q9=B, Q10=A)  
                       └── [Q5=B/C + Q6=D + Q8=B + Q10=A required]  
  ```  

  #### **Position Descriptions**  
  - **Deflationary Quietist**: Conflicts arise from ambiguous language. Add parameters (e.g., “for purpose X”) to resolve disputes.  
  - **Framework Relativism**: Truth is framework-dependent. No neutral standpoint; all claims require a perspective.  
  - **Plain Monism**: One complete, unified truth exists. Apparent conflicts stem from human ignorance.  
  - **Contradiction-Tolerant**: Reality includes true contradictions; “A and not-A” can hold identically.  
  - **Domain-Specific Truth**: Truth has different bases (e.g., science vs. ethics). Claims true only within domains.  
  - **Ineffability (Determinate)**: A definite reality exists beyond language. Words point to it but fail.  
  - **Ineffability (Indeterminate)**: No fact of the matter exists; reality is incomplete or unsettled.  
  - **Jain Anekāntavāda**: Reality has infinite aspects; all claims are partial. The total truth is ineffable, knowable only to an omniscient being.  
    - *Seven-Mode Scheme*: A substate of Jain view. Uses systematic qualifiers (is/is not/both/inexpressible/etc.) to navigate partial truths.  

  #### **Notes on the Tree**  
  - **Empty Branches**:  
    - *Q5=A + Q6=D*: Incoherent. If conflict is resolvable by adding clauses (Q5=A), an ineffable total standpoint (Q6=D) is redundant.  
    - *Q6=D + Q8=B + Q10=B*: Unattractive. An ineffable but knowable total standpoint (Q6=D, Q10=A) that doesn’t apply to itself (Q8=B) is unstable.  
  - **Indistinguishable Positions**:  
    - *Domain-Specific Truth vs. Framework Relativism*: Both answer Q3=C and Q5=A. Separated by **Q6** (C: relativism; A/B: domain-specific) and **Q8** (A: both; but domain-specific may reject self-application).  
    - *Ineffability (Determinate) vs. Jain View*: Both answer Q6=D and Q10=A. Separated by **Q8** (A: ineffability; B: Jain) and **Q1/Q2** (C: Jain; mixed answers for ineffability).  
  - **Key Distinctions Achieved**:  
    - “Both” vs. “Ineffable”: **Q1** (C: “both” for pot; not ineffable) vs. **Q9** (B: ineffable) and **Q2** (B: “both” for witnesses; C: ineffable).  
    - Conflict location: **Q5** (A: *us*; B/C: *object*).  
    - Self-application: **Q8**.  
    - Operator scope: **Q5=A** (shorthand) vs. **Q5=B/C + Q3=C** (modifier).  

  ---

  ### **How to Run the Session (75 mins)**  
  1. **Diagnostic (20 mins)**: Hand out the questionnaire. Students answer individually.  
  2. **Scoring & Grouping (15 mins)**: Provide the taxonomy. Students:  
     - Trace their path through the tree using answers.  
     - Identify their position(s). Note if they straddle branches (triggering reflection).  
  3. **Group Discussion (25 mins)**: Form small groups by position (merge rare positions if needed). Discuss:  
     - *Strengths*: How does your view handle the cases?  
     - *Weaknesses*: Where does it struggle? (e.g., Quietism on Q6; Monism on Q4).  
     - *Jain Challenge*: How is your view similar/different from anekāntavāda?  
  4. **Share & Synthesize (15 mins)**: Groups report key insights. Highlight:  
     - How labels emerge *from cases* (e.g., “ineffable” via Q9).  
     - That positions answer the same cases differently (e.g., Q6 options).  
     - That Jainism is one coherent option in a crowded space.  
  5. **Wrap-Up**: Emphasize: The goal isn’t consensus—it’s seeing the map.  

  This structure avoids lecturing, roots abstraction in cases, and uses disagreement productively. The Jain view emerges as a distinctive leaf (not the trunk), countering the “relativism with incense” caricature.
