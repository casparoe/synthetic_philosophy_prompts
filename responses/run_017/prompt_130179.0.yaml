  We are addressing two main parts: 

  Part 1: Critiquing the blog post's claims about Kelly betting.
  Part 2: Adapting the Kelly framework to the user's specific situation.

  Let's break down Part 1:

  The blog post claims:
  1. Maximizing expected logarithm of wealth is the only rational strategy because wealth compounds.
  2. As the number of bets grows, the Kelly bettor ends up richer than any other fixed strategy with probability approaching 1, and any other strategy either goes broke or falls behind irrecoverably.
  3. Betting more than Kelly reduces growth and adds risk, while betting less than Kelly gives up growth without any benefit (so fractional Kelly is "cowardice").
  4. The Kelly fraction is scale-free (does not depend on current wealth) and hence is rational because any other utility function would arbitrarily change with bankroll.
  5. Expected value maximization is a category mistake because it averages over parallel copies that don't exist (as illustrated by the coin flip example).

  What is accepted by experts:
  - Maximizing the expected logarithm of wealth (Kelly criterion) does maximize the long-run growth rate of wealth in the limit of many repeated bets. This is a mathematical fact under the assumptions of independent and identically distributed (i.i.d.) bets and when the bettor can reinvest the entire bankroll.
  - The Kelly strategy has the property that it asymptotically dominates any other essentially different strategy in the following sense: for any other strategy, the ratio of the Kelly bettor's wealth to the other bettor's wealth goes to infinity almost surely (with probability 1) as the number of bets goes to infinity. This is known as the "Kelly rule maximizes the exponential rate of growth" and the dominance result.
  - Betting more than the Kelly fraction (overbetting) does lead to a reduction in the growth rate and an increase in risk (variance of the growth rate, and also the chance of ruin). Betting less than Kelly (underbetting) reduces the growth rate but also reduces risk (variance and drawdowns). The blog post's claim that underbetting "just hands the difference to whoever is on the other side" is an oversimplification. It is true that if you underbet, then you are leaving some growth on the table, but that does not necessarily mean that the other side gets it; it's more that you are not taking full advantage of the edge.

  What is controversial or incorrect:
  - The claim that fractional Kelly is "cowardice with a story attached" is too strong. In practice, fractional Kelly (betting a fixed fraction of the Kelly bet) is often used because:
    a) The true edge is uncertain (the user's situation: edge estimated from finite data).
    b) The bets are not perfectly i.i.d. and there might be correlations (e.g., market crashes that affect many bets at once).
    c) The investor may have other sources of wealth (like the user's salary) or other liabilities.
    d) The investor may have a finite horizon (the user has only a few hundred bets) and may care about drawdowns or the chance of a large loss in the interim.
  - While the Kelly criterion maximizes long-run growth, it may not be optimal for finite horizons or for investors who care about more than just the asymptotic growth rate. For example, an investor might prefer a strategy that has a lower growth rate but a lower chance of a large drawdown.
  - The claim that expected value maximization is a "category mistake" is philosophical. The coin flip example does show that expected value maximization can lead to ruin with probability 1 in repeated play. However, in a one-shot bet, expected value maximization might be appropriate if the bet size is small relative to total wealth. The blog post is correct that for repeated bets with reinvestment, expected value maximization is not appropriate because it ignores the compounding.

  Clarification on maximizing expected log wealth vs. long-run growth rate:
  - In the limit of many bets, the long-run growth rate is the expectation of the logarithm of the multiplicative factor per bet. So for a single bet, maximizing the expected log wealth is equivalent to maximizing the growth rate for that bet. For multiple bets, if the bets are independent and the fraction is fixed, then the growth rate is the expected log return per bet. So the two are equivalent for i.i.d. bets.

  Going broke:
  - The blog post says that non-Kelly bettors either go broke or fall behind. This is true for strategies that overbet (bet more than Kelly) because they have a positive probability of ruin (going broke). However, for underbetting (betting less than Kelly), the bettor does not go broke (if the fraction is positive and less than Kelly) but grows at a slower rate. So the blog post overstates when it says that non-Kelly bettors go broke or fall behind: underbetters do not go broke, they just grow more slowly.

