  Verdict on the blog post:

     The core insight that expected-value maximization is flawed for repeated bets with reinvestment is correct and important. The Kelly criterion is the rational benchmark for such scenarios. However, the blog post's dismissal of fractional Kelly and its absolute claims about non-Kelly strategies are too strong. In practice, fractional Kelly is often justified by uncertainty, risk aversion, and finite horizons. The user's constraints (cap, finite opportunity) naturally lead to a fractional Kelly strategy, which is sensible.

