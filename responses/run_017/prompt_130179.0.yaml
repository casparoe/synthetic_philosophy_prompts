  ### Your Config Rule  
  **Assumptions**:  
  - Top-ups allowed, so \( C = \$400K \) (current bankroll) is conservative.  
  - Bets are small relative to \( C \) (max 1.25%), so no bankroll correlation adjustments.  
  - Edge uncertainty requires a safety buffer.  

  **Position Sizing Formula**:  
  \[ \text{bet} = \min\left( \text{cap},  \frac{0.5 \cdot \hat{\epsilon}}{o} \cdot C \right) \]  
  - \( \hat{\epsilon} \): Your model's edge estimate for the bet.  
  - \( o \): Net odds (e.g., 1.0 for even money).  
  - \( \text{cap} \): Venue max (e.g., $5K).  
  - \( C \): Current bankroll.  
  - **Why 0.5?** Half-Kelly buffer for edge uncertainty + decaying opportunities.  

  **Example**:  
  - \( \hat{\epsilon} = 3\% \), \( o = 1.0 \), \( C = \$400K \), cap = $5K.  
  - Full Kelly: \( 0.03 \times 400K = \$12K \).  
  - Half-Kelly: \( 0.5 \times 12K = \$6K \).  
  - Capped: \( \min(6K, 5K) = \$5K \).  

  **When to deviate**:  
  - If \( \hat{\epsilon} \) is extremely precise (e.g., liquid markets), use 0.75x.  
  - For one-offs with high uncertainty, use 0.25x.  

  **Edge Decay Adjustment**:  
  - Reduce \( \hat{\epsilon} \) by decay factor over time. If you expect edges to halve in 2 years, cut \( \hat{\epsilon} \) by 8% per 100 bets.  

  ---  

  ### Verdict on the Philosophical Claim  
  **"Expected value reasoning is a category mistake under compounding"**:  
  - **Survives**: The coin-flip demo and asymptotic theory show EV fails catastrophically for repeated bets. Rationality *must* account for compounding.  
  - **But**: The post overclaims by dismissing fractional Kelly, ignoring utility functions, and conflating asymptotics with finite worlds. Kelly is the rational *benchmark*, not the universal law.  

  **Your gut feeling**: Correct that EV is "wrong" for your bot, but Kelly isn't a panacea. With your constraints, capped fractional Kelly is optimal.  

  **Final word**: Use the config rule above, monitor performance monthly, and read Ed Thorp's [paper](https://www.eecs.harvard.edu/cs286r/courses/fall12/papers/Thorpe_KellyCriterion2007.pdf) for practical nuances. Your setup is textbook half-Kelly once caps bind—embrace it.
