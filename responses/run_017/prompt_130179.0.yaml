     But note: if the edge is overestimated by 50%, then the true edge is 0.015. Then the full Kelly fraction would be 1.5%. The desired bet at a bankroll of 400k would be 6k. Then the cap of 5k would be 83% of the true Kelly. This is acceptable (underbetting by 17%). The growth rate would be slightly reduced but safe.

     However, if the edge is overestimated by 100% (true edge=0.015, but estimated as 0.03) then the true Kelly is 1.5% and the estimated Kelly is 3%. The bot would want to bet 12k, but capped to 5k (about 1.25% of bankroll) which is below the true Kelly (1.5%). So it's underbetting and safe.

     Therefore, the cap provides a natural protection against overestimation.

  Final config rule:

