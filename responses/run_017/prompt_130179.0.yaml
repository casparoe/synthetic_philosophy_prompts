  ### Part 1: Dissecting the Blog Post's Claims  
  I'll break this down line-by-line, separating mathematical reality from philosophical overreach. Key terms:  
  - **Expected Log Wealth (ELW)**: Maximizes \( E[\log(\text{wealth after bet})] \).  
  - **Long-Run Growth Rate (LRGR)**: \(\lim_{N\to\infty} \frac{1}{N} \log(\text{wealth after N bets})\).  

  | Claim                                                                 | Verdict                                                                                                                               | Why?                                                                                                                                                                                                                                                                                           |  
  |-----------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------------------------|------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|  
  | "Maximize expected log wealth, not expected money."                   | **Mostly correct**                                                                                                                    | For repeated bets, ELW maximizes LRGR under i.i.d. assumptions. This is proven ([Kelly 1956](https://www.princeton.edu/~wbialek/rome/refs/kelly_56.pdf)).                                                                                                                                  |  
  | "Anyone not doing it is making a mistake you can prove."              | **Overreach**                                                                                                                         | True *only* for risk-neutral, infinite-horizon, i.i.d. bets with known edge. Fails with uncertainty, risk aversion, or correlated bets.                                                                                                                                                     |  
  | "Kelly bettor ends up richer than any other strategy w.p. →1."        | **Correct asymptotically**                                                                                                            | Follows from the [Law of Large Numbers](https://en.wikipedia.org/wiki/Kelly_criterion#Proof). But "richer" is misleading—it means \(\text{wealth}_{\text{Kelly}} / \text{wealth}_{\text{other}} \to \infty\) almost surely. Non-Kelly doesn't necessarily go broke (see below).          |  
  | "Betting >Kelly lowers growth and adds risk."                         | **Correct**                                                                                                                           | Overbetting reduces LRGR *and* increases ruin probability. See [MacLean et al. 2011](https://www.jstor.org/stable/23076172).                                                                                                                                                                |  
  | "Betting <Kelly hands growth to the other side."                      | **Misleading**                                                                                                                        | Underbetting sacrifices growth but reduces risk. The "other side" doesn't gain your forfeited growth—it's a suboptimal trade for *you*, not a transfer.                                                                                                                                    |  
  | "Fractional Kelly is cowardice."                                      | **Flat wrong**                                                                                                                        | Fractional Kelly (e.g., half-Kelly) is standard for edge uncertainty. It cuts risk by ~75% for only ~25% growth reduction ([Thorp 2006](https://www.eecs.harvard.edu/cs286r/courses/fall12/papers/Thorpe_KellyCriterion2007.pdf)). "Cowardice" ignores real-world parameter uncertainty. |  
  | "Wealth cancels out → scale-free → rational."                         | **Correct but overextended**                                                                                                          | Scale-invariance is mathematically elegant, but human utility isn't log-linear (e.g., subsistence needs). Rationality depends on goals.                                                                                                                                                     |  
  | "Expected-value reasoning averages over parallel copies that don’t exist." | **Philosophically defensible**                                                                                                        | The coin demo shows EV fails under serial compounding. But calling it a "category mistake" is hyperbolic—EV is valid for one-off, non-compounding bets.                                                                                                                                     |  
  | "Non-Kelly bettors go broke or fall behind irrecoverably."            | **Half-wrong**                                                                                                                        | Only overbettors go broke w.p.1. Underbettors (e.g., half-Kelly) *never* go broke and grow exponentially, just slower. Your intuition is correct.                                                                                                                                          |  

  #### Key Distinction: ELW vs. LRGR  
  - **ELW**: Objective function for a single bet: \( f^* = \arg\max_f E[\log(1 + f \cdot X)] \), where \( X \) is the return.  
  - **LRGR**: Long-term growth rate \( G(f) = E[\log(1 + f \cdot X)] \) for i.i.d. bets.  
  **Why it matters**: They're equivalent *only* for i.i.d. repeated bets. For one-off bets, ELW is just a utility function. For non-i.i.d. bets (e.g., decaying edges), ELW may not maximize long-term growth.  

  #### "Going Broke" Reality Check  
  - Betting fraction \( f \) of Kelly: Ruin probability is 0 if \( f \leq 1 \) (underbetting), and >0 if \( f > 1 \) (overbetting). Half-Kelly has **zero** probability of ruin.  

  ---  

  ### Part 2: Your Concrete Setup  
  **Constraints**:  
  - Bankroll \( B = \$400K \), max bet \( M = \$2K–\$5K \) → Effective cap \( f_{\text{cap}} = M/B = 0.5–1.25\% \).  
  - Edge \( \epsilon = 2–4\% \), finite bets (~200/yr, decaying over 2–3 yrs).  
  - External salary (top-ups possible, blowups non-fatal).  
  - Mixed bet types (repeatable + one-offs).  

  #### 1. **Can't Size Up → Forced Fractional Kelly**  
  - Kelly fraction for a bet with edge \( \epsilon \) and net odds \( o \):  
    \[ f_{\text{Kelly}} = \frac{\epsilon}{o} \]  
    (For even odds \( o=1 \), \( f_{\text{Kelly}} = \epsilon \)).  
  - Your typical \( f_{\text{Kelly}} = 2–4\% \), but \( f_{\text{cap}} = 0.5–1.25\% \) → You're forced to bet \( \frac{1}{4} \) to \( \frac{1}{2} \) of Kelly.  
  - **Is bankroll the right denominator?** For pure gambling, yes. But with salary top-ups, total risk capital \( C \) is \( B + \text{PV}(\text{salary}) \). If you're willing to risk 50% of annual salary ($50K?), then \( C \approx \$450K \). Still, \( f_{\text{cap}} = M/C \approx 0.44–1.1\% \) → still fractional Kelly.  

  #### 2. **Salary Top-Ups: More Aggressive or Safer?**  
  - **Pull 1 (Bigger Stakes)**: Top-ups increase \( C \), so full Kelly $ amount \( f_{\text{Kelly}} \cdot C \) rises.  
  - **Pull 2 (Safer)**: Top-ups reduce ruin risk, allowing more aggression.  
  - **Net effect**: If you pre-commit to topping up, you can bet more *as a % of B* (since blowups are covered). But with your cap, you're bottlenecked by \( M \).  

  #### 3. **One-Off Bets vs. Repeatable Bets**  
  - For one-offs: Kelly (ELW) maximizes median wealth, but *not necessarily* utility.  
  - For repeatables: Kelly maximizes LRGR.  
  - **Practical rule**: Use Kelly for both, but size one-offs conservatively (edge uncertainty dominates).  

  #### 4. **Edge Uncertainty: How Wrong Can You Be?**  
  - Growth penalty for misestimating edge \( \epsilon \) as \( \epsilon' \):  
    \[ \Delta G \approx \frac{(\epsilon - \epsilon')^2}{2 \epsilon o} \]  
    (Derived from Taylor expansion of \( G(f) \)).  
  - **Critical point**: If you overestimate edge by \( \delta \), the "bad side" (where \( G(f) < 0 \)) starts when \( \epsilon' > \epsilon + o \cdot f_{\text{cap}} \).  
  - Your case: \( \epsilon = 2–4\% \), \( o=1 \) (assumed), \( f_{\text{cap}} \approx 1\% \). If you bet \( f_{\text{cap}} \):  
    - True edge needed for ruin: \( \epsilon_{\text{ruin}} > \epsilon + 1 \cdot 0.01 \).  
    - If estimated \( \epsilon = 4\% \), true edge \( >5\% \) → ruin. But with your cap, you're underbetting, so \( G > 0 \) even if \( \epsilon \) is overestimated by 1–2%.  
  - **Safety margin**: With 1500 samples, std error \( \sigma_\epsilon \approx \sqrt{\frac{\epsilon(1-\epsilon)}{1500}} \leq 0.5\% \). Overestimation by \( 2\sigma \approx 1\% \) is unlikely.  

