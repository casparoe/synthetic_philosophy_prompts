  I recall that grounding does prioritize directness, but why? Maybe it's about explanatory economy—grounding seeks minimal sufficient grounds. Causal chains are diachronic, so intermediates are necessary for the sequence. But grounding is synchronic, making intermediaries redundant. 

  The ethics exception is telling. When we care about normative salience (like pain's wrongness), we stop at relevant levels. This hints that grounding collapse isn't universal—it depends on explanatory interests. 

  No existing term fits perfectly. "Grounding compactification" captures the flattening effect, but needs boundaries. For example: when does a "level" count as middle? The user's composite object case shows structure being absorbed, but in ethics, pain isn't absorbed by neurons—it's treated as terminal. 

  My shakiest point? Whether fundamentality's role here is about ontology or explanation. If grounding reveals what's *really* real, collapse makes sense—but then why preserve ethical grounds? Maybe normativity resists reduction. Or perhaps "fundamental" is context-sensitive. 

  User's skepticism about "levels" being bookkeeping feels astute. If middles vanish, is fundamentality monolithic? That threatens pluralism. Yet ethics seems pluralist-friendly. Tension here. 

  I should define the phenomenon tightly: "Systematic elimination of mediating grounds in metaphysical explanations, except where pragmatic/prescriptive interests intervene." Test case: mathematical grounding. Does "7+5=12" collapse to set theory, or is arithmetic a stable middle? I'd lean toward collapse, but intuitionists might disagree. 

  Biggest doubt: Am I conflating epistemology and metaphysics? What if middles *exist* but aren't explanatorily essential? But user cites cases where they get "absorbed," suggesting ontological elimination. Needs finer distinction. 

  User's depth-as-vice observation is sharp. Grounding's anti-layering might stem from its demand for ultimate responsibility. Causation lacks that—hence middles persist. But then ethics grounds aren't ultimate, yet we accept them. So is "ultimate" flexible? 

  ...I think coining is justified. Existing terms like "grounding minimalism" don't capture the middle-squelching pattern. But the definition must exclude causal chains and accommodate ethics. Call it "grounding collapse" with a caveat: it's default but interest-relative. 

  Boundary case: emergent properties. If consciousness emerges from neurons but isn't reducible, is it a middle or endpoint? Hard to say—some philosophers would collapse it, others wouldn't. That's where the definition strains. 

  Final note to user: Your ethics example might reveal that *normative* grounding resists collapse. That's a clue—maybe the phenomenon is about descriptive vs. prescriptive explanation. But I'm not confident; metaethicists debate whether wrongness *really* grounds in pain or physics. 

  Phew. User's onto something subtle. If they push back, I'd want to hear their take on mathematical grounding—it might expose where collapse is mandatory versus negotiable.
answer: |-
  Based on your description, there isn't a single established term for this phenomenon. It's a sharp observation of a pervasive pattern in grounding discourse that isn't fully captured by existing distinctions like "immediate vs. mediate grounding" or "contrastive explanation." Here's a conceptual carving:

  **The Phenomenon:** **Grounding Collapse (Proposed Term)**  
  *Definition:* The systematic tendency in metaphysical grounding explanations to eliminate or ontologically absorb mediating grounds ("middles") in a chain (F ← H ← G), treating them as explanatorily redundant or derivative, resulting in a flattened explanation directly linking the grounded fact (F) to a more fundamental ground (G). This occurs even when H is prima facie a distinct level or entity.

  **Key Features (For Identification):**  
  1.  **Chain Compression:** A grounding chain F ← H ← G is consistently shortened to F ← G.  
  2.  **Middle Elimination/Absorption:** H is either:  
      *   **Eliminated:** Dismissed as a mere "stepping stone" with no genuine grounding role.  
      *   **Absorbed:** Reduced to a non-explanatory aspect, epiphenomenon, or logical consequence of G, losing its status as an independent grounding relatum.  
  3.  **Contrast with Causation:** Unlike causal chains (where intermediates are essential links in a temporal sequence explaining *how* the effect came about), grounding intermediates are deemed ontologically or explanatorily inert for *why* F holds *at all*.  
  4.  **Fundamentality Pressure:** The collapse is driven by the quest for the *most fundamental* ground, treating any intermediate as suspect or non-contributory to the ultimate ontological "why."  

  **Boundaries & Test Cases (Where Collapse Might *Not* Occur):**  
  *   **The Ethics Exception (Your Case):** Proximate normative grounds (e.g., pain grounding wrongness) resist collapse *precisely because* the explanatory interest is normative salience, not physical fundamentality. The collapse pressure exists (why *is* pain wrong? → physics?), but is contextually blocked by the *explanatory purpose*. Here, H (pain) *is* treated as carrying weight relative to the question "Why is *this* wrong?" even if not ultimately fundamental. **Boundary:** Collapse occurs when seeking *ultimate* ontological grounds; it stalls when seeking *salient* grounds relative to a specific domain or question type (like normative "why?").  
  *   **Functional/Teleological Levels:** Explaining why a heart beats (F) might ground in "to circulate blood" (H), grounded in evolutionary advantage (G). While a hardcore reductionist might collapse F←G (physics), a biologist might treat H ("circulate blood") as an irreducible functional ground resisting full absorption into G, as it captures a distinct level of biological organization. **Boundary:** Collapse is strong for purely constitutive/structural grounding; weaker for functional/teleological grounding where levels of organization are explanatorily robust.  
  *   **Emergence (Contested):** If strong emergence is true, a property H might genuinely ground F while being grounded in G, yet resist *complete* absorption into G (H has novel causal/explanatory power). Most grounding frameworks *assume* collapse is possible/required here, making strong emergence incompatible with standard grounding views. **Boundary:** Collapse is assumed unless strong emergence (often seen as mysterious) is explicitly defended.  

  **Why Existing Concepts Don't Fully Fit:**  
  *   **Immediate/Mediate Grounding:** Acknowledges the chain but doesn't explain *why* the mediate ground (H) is invariably treated as non-explanatory or eliminable. Your point is precisely *about* the fate of the mediate.  
  *   **Contrastivity:** Explains *which* ground is cited for a *specific* question (e.g., "Why wrong? Pain, not dishonesty"). It doesn't explain why, when tracing the chain deeper, H *itself* gets collapsed *into* G when grounding H.  
  *   "**Nothing Over and Above**" / **Ontological Free Lunch:** These describe the *result* of the collapse (H is "nothing over and above" G), not the *process* or *tendency* of eliminating the middle in chains.  
  *   **Grounding Fundamentality:** The collapse *is* driven by this, but the concept itself doesn't name the pattern of middle-elimination in chains.  

  **Where I'm Shakier (and Why):**  
  1.  **The Universality of the Ethics Exception:** You're right that proximate grounds *seem* stable in ethics. But is this stability ontological or merely pragmatic/epistemic? A proponent of grounding collapse might argue: "The *ultimate* ground of wrongness *is* still microphysics; citing pain is just useful shorthand or relates to our normative concepts, not a truly fundamental ontological layer." This hinges on whether normative properties are *sui generis* or reducible. My confidence that "salience blocks collapse" wavers if one insists all grounding must trace to the absolutely fundamental.  
  2.  **The Role of "Levels":** You mention levels treated as "bookkeeping." Is the collapse *causing* the levels to be seen as merely conceptual/epistemic, or is the prior assumption that only the fundamental level is *real* causing the collapse? It feels circular. My definition assumes the collapse pattern is observable, but the *reason* for it might be a deep commitment to ontological reductionism baked into much grounding talk.  
  3.  **Is it *Always* G Doing the Work?** In F ← H ← G, collapse says F is grounded *directly* in G, bypassing H. But is G *alone* sufficient? Or does the *type* of G matter? Suppose G is particle physics, H is atomic structure, F is chemical bonding. Collapse says F is grounded in G. But is "particle physics" *by itself* sufficient to ground chemical bonding *without* the concept of atomic structure (H) being implicitly contained? If H is "absorbed" into G, does G now *include* structural info? This blurs the line between elimination and absorption. My definition needs refinement on what "directly linking F to G" means ontologically post-collapse.  

  **Conclusion:**  
  You've identified a robust pattern – **Grounding Collapse** – characterized by the systematic elimination or absorption of mediating grounds in chains driven by the pressure to identify the most fundamental ontological explanation. It contrasts sharply with causal explanation and highlights a tension within grounding-based metaphysics: if middles collapse, fundamentality risks being monolithic (one true fundamental level) or contextually slippery ("fundamental relative to what?" if collapse stops at ethics). The key boundary lies in **explanatory purpose**: collapse dominates searches for *ultimate ontological grounds*, but stalls for *domain-salient grounds* (like normative ones), revealing that grounding's "depth as vice" applies primarily to the project of finding the rock-bottom furniture of reality. Your doubt about the ethics case is well-founded; it's the primary pressure point testing whether collapse is absolute or interest-relative. This pattern deserves a name – "Grounding Collapse" captures the dynamic well.
