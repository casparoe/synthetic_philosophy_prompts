prompt: |-
  I chair the weekly signal-triage meeting at a regional public health agency. Every Monday me and five others (two epidemiologists, a lab lead, a comms person, and a rotating field officer) spend 45 minutes deciding whether each flagged signal — a cluster of lab results, a spike in school absenteeism, a handful of GP calls — gets sent to field investigation or gets closed. We get eight or so a week and investigations are expensive, so most get closed. I sign off on the closes myself; anything above a certain cost goes to the director. About six months later we usually find out whether we were right, so I can score last year's calls.

  I can tell we herd. I speak first because I'm the chair and I'v read the briefing, and by the third or fourth signal everyone is just saying "agree". What I want is a procedure I can actually run in the room: questions in order, what counts as a good enough answer to each, where it stops with a no, where it hands the decision to a person because it's a values question (what a false alarm costs us vs what a missed outbreak costs) rather than a facts question, and when a case should go up to the director undecided instead of being settled in the room. It has to work at about two minutes a signal, so tell me which step is the cheap screen that clears most of them, and which step only runs on the one or two near the threshold.

  Three things about the room that I think break the textbook story, and I want the procedure to deal with them rather than assume them away: we already do an anonymous written poll before the meeting that I read out at the start, and I genuinely don't know whether that helps or just starts the cascade earlier; we have a standing devil's advocate whose job is to argue against whatever I say, so her dissent carries no information any more; and two of my members look at the same dashboard I do, so when they "agree" with me it's often not an independent check at all, while the field officer usually has something nobody else has. Tell me roughly how much to discount an agreement from someone whose information overlaps mine — I don't need a formula, but "count it as nothing" and "count it as half" are very different instructions.

  Please also keep seperate three things I keep conflating: a real cascade, honest convergence because everyone saw the same genuinely strong evidence, and a value disagreement pretending to be a factual one. Say what I should do differently in each.

  Then run it on three cases. (1) The pre-meeting poll split 4–2 to investigate, I opened by saying I thought it was noise, everyone then said close, and the field officer said nothing but mentioned afterwards that she'd heard from a local pharmacist about a second school. (2) The same confirmed strain in three patients with no link between them — I want the procedure to tell me not to bother with whatever anti-cascade ritual you invent, because I can't waste the meeting on unanimous cases; show me the 30-second screen that clears it. (3) The one I'll hate: I'm personally about 90% sure a signal is a real outbreak, I've seen the pattern before, and the room is lukewarm. Show the procedure telling me that my gut isn't independent evidence and that I either shut up or lose the vote — and then tell me honestly whether that's right or whether the procedure is just bullying me.

  Finally, flag which steps are judgment calls dressed up as procedure, and say plainly what a procedure like this cannot do for me. Don't point me at papers or reading lists — I want something I can run on Monday.
reasoning: |-
  We are designing a decision procedure for a signal-triage meeting with the following constraints:
  - Time: ~2 minutes per signal (8 signals in 45 minutes)
  - Participants: Chair (you), two epidemiologists, lab lead, comms person, rotating field officer
  - Pre-meeting: Anonymous written poll (results read at start)
  - Standing devil's advocate (argues against the chair regardless of belief)
  - Information overlap: Two members (likely the epidemiologists) see the same dashboard as the chair, so their agreement is not independent. The field officer has unique information.

  Goals:
  - Break herding by having a structured procedure.
  - Separate cascade, honest convergence, and value disagreements.
  - Have a quick screen for clear cases and a more detailed process for borderline ones.
  - Clarify when a decision is based on values (which might require escalation) vs facts.

  Structure:
  We'll break the decision into steps. Most signals will be cleared in the first step (the cheap screen). Only borderline cases (1-2 per meeting) go through the full steps.

  Step 0: Pre-meeting poll (already exists) - we note the result but do not let it dictate.

  Procedure for each signal (to be done in 2 minutes or less):

  1. **Signal Presentation (15 seconds)**
     - Chair (or designated presenter) states the signal briefly: e.g., "Cluster of 5 norovirus cases in school A, no known link."

  2. **Initial Quick Screen (15 seconds)**
     - Chair asks: "Is there any immediate reason to investigate? (e.g., known outbreak in the area, high-risk setting, severe illness)"
     - If any member says "yes", skip to step 3. If not, then:
     - Chair asks: "Is there any immediate reason to close? (e.g., clearly explained by reporting delay, lab error, or benign cause)"
     - If any member says "yes", then the signal is tentatively marked for closing. But then move to step 3 for a quick check.

     *Rationale*: This step is meant to catch the clear cases (both obvious investigates and obvious closes) in 30 seconds. We expect most signals to be closed at this step.

  3. **Factual Questions (45 seconds for borderline cases)**
     - For signals not cleared in step 2, we ask a set of factual questions. The order is fixed to avoid bias. The chair does not express an opinion until the end.
     - Questions (each member is called in a fixed order, e.g., field officer first, then lab lead, then epi1, epi2, comms, devil's advocate, then chair):
          a. Field Officer: "Do you have any local intelligence that we haven't seen? (e.g., from schools, pharmacies, other field reports)" 
          b. Lab Lead: "Is there any lab anomaly that could explain this? (e.g., contamination, testing change)"
          c. Epidemiologist 1: "Is the pattern statistically unusual? (e.g., compared to baseline, after accounting for known factors)"
          d. Epidemiologist 2: "Is there a plausible exposure or transmission mechanism?"
          e. Comms: "Is there public concern or media interest that we are aware of?"
          f. Devil's Advocate: "What is the strongest reason to doubt the signal? (Must provide one, even if weak)"
          g. Chair: Summarizes and states own factual assessment (without saying "I think we should close/investigate").

     *Rationale*: By having a fixed order and specific questions, we force independent input. The devil's advocate is last to avoid anchoring the others. The field officer goes first to surface unique information early.

  4. **Vote and Decision (30 seconds)**
     - After the factual round, the chair calls for a vote (by show of hands, or if time by voice):
          - Investigate?
          - Close?
          - Undecided (meaning we need more info or it's a values issue)?
     - If unanimous (or near-unanimous) for one option, then that's the decision.
     - If split (e.g., 3-3) or if there are undecided votes, then:
          - Chair determines if the disagreement is about facts or values.
          - Factual disagreement: Assign a quick follow-up (e.g., "Epi1 and Lab, check the data and report back by tomorrow") and defer the decision to the next day (or a quick email chain). This should be rare and only for borderline cases.
          - Values disagreement (e.g., cost of false alarm vs. missed outbreak): Escalate to the director. The chair summarizes the facts and the value trade-off.

     *Rationale*: Forces explicit recognition of disagreement and separates fact vs value.

  **Dealing with the room's specific issues:**

  - **Pre-meeting poll**: We read it but then ignore it until after the decision. After the vote in step 4, we compare the meeting vote with the pre-meeting poll. If there's a significant shift (e.g., from 4-2 investigate to 6-0 close), we note it and ask if anyone changed their mind because of new information. This is for learning, not for changing the decision.

  - **Devil's advocate**: Since they always dissent, the group should discount their vote. We treat their input as a required check (to surface doubts) but not as evidence. The chair should note: "The devil's advocate is doing their job, but we have to weigh the actual evidence."

  - **Information overlap**: 
     - For the two epidemiologists who see the same dashboard as the chair, their agreement with the chair on factual matters is expected and should be discounted. 
     - How much? We say: Count their agreement on factual questions as half (because they might have noticed something you didn't, but likely not). But if they disagree, that's important (because they saw the same data and came to a different conclusion). 
     - The field officer's information is unique and counts fully.

  **Separating cascade, honest convergence, and value disagreements:**

  - **Cascade**: If you see everyone agreeing after the chair speaks, but then later evidence shows it was wrong, that's a cascade. The procedure fights it by having a fixed order of speaking (so the field officer and lab lead speak before the chair) and by requiring specific input.

  - **Honest convergence**: Everyone sees strong evidence and independently agrees. The procedure should allow this to happen quickly (step 2) and not force disagreement.

  - **Value disagreement**: When the facts are clear but the group disagrees on the action because of different risk tolerances. The procedure identifies this in step 4 and escalates to the director.

  **Running the cases:**

  Case 1: Pre-meeting poll 4-2 investigate, chair opened by saying "noise", then everyone said close, and field officer had additional info.

  - In the procedure:
     - Step 2: Quick screen - chair does not express opinion. Instead, asks: "Any immediate reason to investigate?" Given the pre-meeting poll, someone might say yes. If not, then ask: "Any immediate reason to close?" If someone says yes, we mark for close but then go to step 3.
     - Step 3: Fixed order. Field officer goes first: "I heard from a local pharmacist about a second school with similar symptoms." This new information would likely change the discussion.
     - Then others speak. The chair does not lead with an opinion. 
     - Step 4: Vote. The field officer's input might lead to a vote to investigate. 
     - After the decision, we note the shift from the pre-meeting poll (if any) and discuss why (e.g., new info from field officer).

  Case 2: Three unlinked cases of the same strain.

  - Step 2: Quick screen.
     - Chair: "Any immediate reason to investigate?" (e.g., is this a rare strain? high risk?) 
     - If not, then: "Any immediate reason to close?" (e.g., common strain, no unusual pattern). 
     - Likely, someone (lab lead) will say: "This strain is common, and three unlinked cases in a week is within expected." Then we mark for close.
     - We then do a minimal step 3: Only ask the field officer and lab lead. 
          Field officer: "Any local info?" (No)
          Lab lead: "Any lab issue?" (No)
     - Then vote: Close. Time: 30 seconds.

  Case 3: Chair 90% sure, room lukewarm.

  - Step 2: Not cleared (because chair doesn't express opinion in step 2).
  - Step 3: Fixed order. Field officer, lab lead, epi1, epi2, comms, devil's advocate.
     - The epidemiologists might express doubt (e.g., "statistically not significant").
     - Devil's advocate will argue against.
  - Step 4: Vote. The room votes to close (or is split). 
     - The chair must accept the vote unless there is a value disagreement. 
     - The procedure tells you: Your gut feeling is not independent evidence. If you have a strong prior based on pattern recognition, you should have presented it as a fact in step 3 (when it's your turn) by saying: "This pattern matches previous outbreak X." But if you don't have data to back it, it's not a fact. 
     - If the vote is to close, then you sign off. 
     - Is this bullying? No, because the procedure is designed to pool independent information. However, if you have a strong belief that this is a value issue (e.g., the group is too risk-averse), then you can escalate to the director as a values question. But if it's about facts, you are overruled.

  **What the procedure cannot do and judgment calls:**

  - Judgment calls:
     - Step 2: Deciding what counts as an "immediate reason" is subjective but quick.
     - Step 4: Deciding whether a disagreement is about facts or values is a judgment call by the chair.

  - Limitations:
     - It cannot create independent information. If the field officer doesn't speak up, we miss that.
     - It cannot eliminate the chair's influence entirely (you set the agenda and run the meeting).
     - It cannot fix a culture where people are afraid to dissent (though the fixed order and specific questions help).
     - It cannot make the decision for you when values are in conflict; it only flags for escalation.

  **Final Procedure for Monday:**

  1. **Signal Presentation (15 sec)**: Brief description.

  2. **Quick Screen (15-30 sec)**:
     - "Any immediate reason to investigate?" (If yes, skip to step 3).
     - "Any immediate reason to close?" (If yes, mark tentatively for close and then do step 3, but quickly).

  3. **Factual Round (45 sec for borderline, 15 sec for clear)**:
     - Go in fixed order (field officer, lab lead, epi1, epi2, comms, devil's advocate, chair) with specific questions.
     - For clear cases, only ask field officer and lab lead.

  4. **Vote and Decision (30 sec)**:
     - Vote: Investigate, Close, Undecided.
     - If split or undecided:
        - Fact disagreement: Defer for quick follow-up (24 hours).
        - Value disagreement: Escalate to director.

  After the meeting, compare the votes with the pre-meeting poll for learning.

  **Discounting agreements**:
  - For the two epidemiologists: If they agree with the chair on a factual point, count it as half (meaning it's less surprising). But if they disagree, it's significant. 
  - In voting, each member gets one vote regardless, but the chair should be aware of the overlap and probe more if only the overlapping members agree.

  This should run in 2 minutes per signal, with most cleared in step 2 and step 3 (quick version). The full step 3 and step 4 are for 1-2 signals per meeting.
answer: |-
  Below is a practical, step-by-step procedure designed for your Monday meetings. It's built around your constraints: 45 minutes for 8 signals (~5.5 minutes per signal, but we'll allocate 2 minutes for most and 3–4 for borderline cases), pre-existing anonymous polls, a devil's advocate, information overlaps, and your need to separate cascades, honest convergence, and value disputes. The goal is to reduce herding while respecting time limits by using a **tiered approach**: a quick screen for clear cases (resolving 80–90% in 30 seconds) and a full process only for borderline signals (1–2 per meeting).

  I'll start with the core procedure, then address your room's specific challenges, separate the three conflated issues, run your three cases, and end with limitations/judgment calls. **This is designed to run on Monday—no theory, just actionable steps.**

  ---

  ### **The Procedure: Tiered Signal Triage (2-Minute Max per Signal)**
  **Structure:**  
  - **Step 1: Quick Screen (30 seconds)** – Cheap filter for obvious decisions.  
  - **Step 2: Fact Round (60 seconds, borderline only)** – Factual questions to force independent input.  
  - **Step 3: Vote & Escalate (30 seconds, borderline only)** – Vote, then split fact vs. value disputes.  

  **Roles:**  
  - **Chair (you):** Facilitate, enforce time, speak last in discussions.  
  - **Field officer:** Always speaks first (unique info).  
  - **Devil's advocate:** Always speaks last (so dissent isn't amplified).  
  - **Others:** Fixed order (e.g., lab lead → epi1 → epi2 → comms).  

  **Key Rules:**  
  - **No opinions from anyone until Step 2.** You (chair) don't speak first—use the quick screen to bypass discussion for clear cases.  
  - **Pre-meeting poll:** Reveal it *after* Step 1 to avoid anchoring. Only use it for reflection at the end.  
  - **Discounting overlaps:** Treat agreements from dashboard viewers (e.g., epi1/epi2) as **half-weight** if they align with you. If they disagree, treat it as full-weight (it's significant). Field officer input is always full-weight.  
  - **Devil's advocate:** Ignore their vote (it's noise), but their arguments are a "sanity check" for risks.  
  - **Time saver:** 6–7 of 8 signals will exit at Step 1. Only borderline signals get Steps 2–3.  

  #### **Step 1: Quick Screen (30 Seconds)**  
  **Goal:** Clear obvious "investigate" or "close" cases without discussion.  
  - **Chair asks two yes/no questions (10 seconds):**  
    1. *"Is this signal time-sensitive? (e.g., high-risk setting, severe symptoms, or public concern?)"*  
    2. *"Is this signal explainable by noise? (e.g., lab error, baseline fluctuation, or benign cause?)"*  
  - **Outcomes:**  
    - If **anyone** says "yes" to time-sensitive → **Auto-investigate** (no further steps).  
    - If **anyone** says "yes" to explainable noise → **Auto-close** (no further steps).  
    - If **no consensus** → Flag as "borderline" and go to Step 2.  
  - **Why it works:** Most signals are unambiguous. This leverages group intuition without discussion. Saves 70%+ of time.  

  #### **Step 2: Fact Round (60 Seconds, Borderline Only)**  
  **Goal:** Surface independent facts and force diverse input. Stop herding by silencing the chair until the end.  
  - **Chair asks fixed questions in order (strict 15-second responses):**  
    1. **Field officer:** *"What local intel do you have? (e.g., schools, pharmacies, community reports)"*  
    2. **Lab lead:** *"Could lab anomalies explain this? (e.g., contamination, testing changes)"*  
    3. **Epi1 (dashboard viewer):** *"Is this statistically unusual? (vs. baseline or expected noise)"*  
    4. **Epi2 (dashboard viewer):** *"Is there a plausible transmission mechanism?"*  
    5. **Comms:** *"Is there public/media concern we haven't addressed?"*  
    6. **Devil's advocate:** *"What's the strongest counterargument?"* (Argues against investigation, per role.)  
    7. **Chair:** *"Summarize facts only—no opinion."* (e.g., "Field reports X, lab says Y, stats show Z.")  
  - **Rules:**  
    - No interruptions. Stick to facts—no "I agree" or opinions.  
    - Discount overlaps: If epi1/epi2 agree with you, note it but **don't count it as new info** (half-weight). Focus on contradictions or field officer input.  
    - If the devil's advocate raises a valid fact (e.g., "outbreak X had different patterns"), note it. Otherwise, ignore.  
  - **Exit early:** If all factual answers point clearly to "close" or "investigate," skip to vote.  

  #### **Step 3: Vote & Escalate (30 Seconds, Borderline Only)**  
  **Goal:** Vote, then separate fact disputes (defer) from value disputes (escalate).  
  - **Vote:** Anonymous show of hands (use cards if faster):  
    - Options: Investigate, Close, Undecided.  
    - **Threshold:** Majority wins. If tied, go to escalation.  
  - **Chair assesses disagreement:**  
    - If unanimous/high agreement → **Accept vote.**  
    - If split/tied → Ask: *"Is this about missing facts or cost/risk values?"*  
      - **Fact dispute** (e.g., "We need more data on transmission"): **Defer for 24h.** Assign one person to gather info (e.g., field officer checks schools). Decide via email tomorrow.  
      - **Value dispute** (e.g., "False alarms cost $X, but missed outbreak risks lives"): **Escalate to director.** Summarize facts and trade-offs in 2 sentences.  
  - **Pre-poll comparison:** After deciding, share the pre-meeting poll. Discuss shifts briefly (e.g., "We closed 4–2, but pre-poll was 5–1 investigate—any new insights?").  

  ---

  ### **Dealing with Your Room's Specifics**
  - **Pre-meeting poll:** Revealing it at the start anchors the group. **Fix:** Share results **after Step 1** (or even after the vote). Use it only for group learning (e.g., "Last week's poll was wrong because...").  
  - **Devil's advocate:** Their dissent carries no signal. **Fix:** Ignore their vote entirely, but use their argument in Step 2 as a "risk check." If they surface new facts, treat those seriously.  
  - **Information overlap:**  
    - **Dashboard viewers (epi1/epi2):** Discount agreements with you as **half-weight** (e.g., if they say "agree" after your summary, it's weak). If they disagree, it's **full-weight** (they saw the same data and dissent—pay attention).  
    - **Field officer:** Always full-weight. Their input is unique.  
    - **Others (lab, comms):** Full-weight unless their response is generic (e.g., "no concerns").  
  - **Example:** If you say "This looks like noise," and epi1 agrees, treat it as +0.5 toward close. If field officer says "Pharmacy reports sick kids," treat it as +1.0 toward investigate.  

  ---

  ### **Separating Cascades, Honest Convergence, and Value Disputes**
  - **Real cascade (group follows you blindly):**  
    **What to do:** Enforce **Step 1 silence** (no chair opinions) and **Step 2 fixed order** (field officer speaks first). Cascades break when unique info surfaces early.  
  - **Honest convergence (evidence is clear):**  
    **What to do:** **Step 1 will catch it.** If everyone independently sees strong evidence, it resolves in 30 seconds. Don't force debate—convergence is efficient.  
  - **Value dispute (cost vs. risk trade-off):**  
    **What to do:** **Step 3 escalation.** If facts are agreed but votes split (e.g., "This is norovirus, but is 3 cases worth $50K?"), escalate to the director. Chair says: *"We agree on facts, but this hinges on cost tolerance—director will decide."*  

  ---

  ### **Running Your Three Cases**
  **Case 1: Pre-poll 4–2 investigate, you called it noise, everyone agreed, field officer had hidden info.**  
  - **Step 1 (Quick Screen):**  
    - You ask: "Time-sensitive?" Silence. "Explainable noise?" Silence → Borderline (proceed).  
  - **Step 2 (Fact Round):**  
    - Field officer (first): "Heard from a local pharmacist about a second school with similar symptoms."  
    - Others: Epi1 says "Stats borderline," lab says "No issues," devil's advocate argues risk.  
    - You (last): Summarize: "Field reports second school, stats inconclusive."  
  - **Step 3 (Vote & Escalate):**  
    - Vote: Likely 5–1 investigate (field officer's info tips it).  
    - Outcome: Investigate.  
    - **Why it works:** Field officer speaks first, preventing herding. Pre-poll is ignored until after.  

  **Case 2: Same strain, three unlinked patients (unanimous close).**  
  - **Step 1 (Quick Screen):**  
    - You ask: "Time-sensitive?" Silence. "Explainable noise?" Lab lead says: "Yes, common strain—baseline is 5/week."  
    - Outcome: **Auto-close** (30 seconds).  
  - **Why it works:** Quick screen catches obvious cases. No ritual needed.  

  **Case 3: You're 90% sure it's real, room is lukewarm.**  
  - **Step 1 (Quick Screen):**  
    - Borderline (no consensus on quick questions).  
  - **Step 2 (Fact Round):**  
    - Field officer: "No local reports."  
    - Epi1: "Stats not significant."  
    - Epi2: "No clear transmission."  
    - You (last): "Pattern matches past outbreak X, but no new data."  
  - **Step 3 (Vote & Escalate):**  
    - Vote: 5–1 to close (you're outvoted).  
    - **Procedure says:** "Your gut isn't independent evidence—it's based on the same dashboard as epi1/epi2. If no new facts, accept the vote. If value dispute (e.g., you think the group is too risk-averse), escalate."  
    - **Is this bullying?** No—it's pooling *independent* info. Your pattern recognition is valid, but if it's not backed by data others can assess, it's not a fact. However:  
      - If you have **private experience** (e.g., "Outbreak X started exactly like this"), share it in Step 2 as a fact.  
      - If the vote feels wrong, ask: *"Is this about facts or values?"* If values, escalate (e.g., "I think we're underestimating outbreak risk").  

  ---

  ### **Limitations and Judgment Calls**  
  **Judgment Calls Dressed as Procedure:**  
  1. **Step 1 thresholds:** Deciding what's "time-sensitive" or "explainable noise" is subjective. Mitigation: Use clear examples (e.g., "High-risk = nursing homes, severe symptoms").  
  2. **Step 3 fact vs. value split:** Chair decides—this is inherently subjective. Mitigation: Err on deferring if facts are missing, escalate if costs are debated.  
  3. **Discounting overlaps:** "Half-weight" is a heuristic. If epi1 always parrots you, count it as zero; if they add insights, count it higher.  

  **What This Cannot Do:**  
  - **Create independence:** If field officers don't share intel, or dashboard viewers dominate, herding may persist.  
  - **Fix culture:** If people are afraid to dissent, fixed questions help but won't eliminate fear.  
  - **Replace expertise:** Gut feelings from experienced chairs (like you) matter—but they must be shared as facts in Step 2.  
  - **Guarantee accuracy:** This reduces herding but won't catch every outbreak. Use your 6-month feedback to tweak questions (e.g., "Why did Step 1 miss X?").  

  ---

  **For Monday:**  
  1. **Prep:** Brief the team on the new steps (email in advance).  
  2. **In the room:**  
     - Use a timer.  
     - For Quick Screen, ask the two questions rigidly.  
     - For Fact Round, enforce speaking order (field officer first, you last).  
  3. **Pilot:** Run it on 1–2 signals, then adjust.  

  This balances rigor with speed—aiming to make herding visible while respecting your clock. If it feels clunky at first, simplify (e.g., skip pre-poll comparisons until you're comfortable). Good luck!
