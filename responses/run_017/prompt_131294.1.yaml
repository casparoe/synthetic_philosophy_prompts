  ## INTERLINGUAL STANDARDS BUREAU  
  **Standard Operating Procedure 41-B (Revision 7)**  
  **CERTIFICATION OF FIELD MANUALS FOR PREVIOUSLY UNCONTACTED LANGUAGES (PULa)**  
  **Effective Date:** [REDACTED]  
  **Supersedes:** SOP 41-B (Revision 6)  

  **1. PURPOSE AND SCOPE**  
  1.1. This Standard Operating Procedure (SOP) establishes the mandatory framework for the audit and certification of Field Manuals (FMs) purporting to provide initial translation equivalencies for lexical items within a PULa.  
  1.2. Certification under SOP 41-B signifies that the FM demonstrates operational adequacy for facilitating basic communication and further linguistic analysis, meeting all criteria herein.  
  1.3. Applicability: All Bureau-sanctioned First Contact Linguistics Teams (FCLT). Non-compliance voids certification eligibility (See ISB Reg. 12.4f).

  **2. DEFINITIONS**  
  2.1. **Field Manual (FM):** The document under audit, containing proposed translation equivalencies (e.g., PULa expression `X` ≈ English expression `Y`), grammatical notes, and ostensive definition protocols.  
  2.2. **Ostensive Evidence (OE):** Data gathered per Clause 5, recording native speaker assent/dissent to utterances under specific stimulus conditions.  
  2.3. **Stimulus Condition (SC):** The observable situation co-occurring with the utterance of a target expression (e.g., presence of a rabbit, rabbit part, rabbit-stage, etc.).  
  2.4. **Operational Simplicity (OS):** The principle favouring the FM requiring the fewest compensatory adjustments to auxiliary linguistic apparatus (e.g., identity markers, pluralization, spatio-temporal continuity predicates) to maintain coherence with OE. (See Appendix A).  
  2.5. **Compensatory Adjustment (CA):** A modification to the interpretation of auxiliary linguistic apparatus within the FM necessary to reconcile OE with the core lexical hypothesis.  
  2.6. **Certification Mark:** The official Bureau seal (ISB-CM-41B) affixed to certified FMs.

  **3. OSTENSIVE EVIDENCE REQUIREMENTS (OER)**  
  3.1. The FCLT *shall* collect OE for the target expression under audit (e.g., `gavagai`).  
  3.2. OE *shall* involve multiple, varied SCs, including but not limited to:  
      3.2.1. Whole organisms/objects.  
      3.2.2. Parts of organisms/objects.  
      3.2.3. Temporal stages of organisms/objects.  
      3.2.4. Absence of the presumed referent.  
      3.2.5. Similar but non-identical referents.  
  3.3. Native assent/dissent *must* be recorded for utterances pairing the target expression with deictic gestures (e.g., pointing) under each SC.  
  3.4. Native responses to queries involving identity *must* be recorded (e.g., "Is *this* `gavagai` the *same* as *that* `gavagai`?").  
  3.5. **Certification Criterion OER-1:** The proposed FM equivalency (e.g., `gavagai` = `rabbit`) *must* predict native assent/dissent patterns under all documented SCs with ≥ 95% accuracy.  
  3.6. **Note:** Accuracy is calculated solely against recorded OE data points. Inference beyond OE is non-compliant.

  **4. AUXILIARY APPARATUS CONSISTENCY (AAC)**  
  4.1. The FM *must* provide a coherent framework for interpreting native expressions related to:  
      4.1.1. Identity and difference (`same`, `different`, `that one again`).  
      4.1.2. Quantification (`one`, `two`, `many`, plural markers).  
      4.1.3. Spatio-temporal continuity (`here`, `there`, `now`, `then`, `still`).  
  4.2. **Certification Criterion AAC-1:** The interpretation of auxiliary apparatus *must* remain consistent across all usages documented within the OE corpus.  
  4.3. **Certification Criterion AAC-2:** Inconsistencies revealed by OE *must* be resolvable solely via CAs documented within the FM or its approved Appendices.

  **5. OPERATIONAL SIMPLITY ASSESSMENT (OSA)**  
  5.1. Where multiple FMs achieve OER-1 and AAC-1/AAC-2 compliance for the same target expression and OE corpus, the FM exhibiting superior OS *shall* be prioritized for certification.  
  5.2. OS is measured by the aggregate complexity score of documented CAs required (See Appendix A, Complexity Metric Table).  
  5.3. Example FM Comparisons (Illustrative):  
      *   FM-A: `gavagai` = `rabbit`. CA: None (Baseline). OS Score: 0.  
      *   FM-B: `gavagai` = `undetached rabbit part`. CA: Redefines identity markers to denote part-contiguity under specific conditions. OS Score: +15.  
      *   FM-C: `gavagai` = `rabbit-stage`. CA: Redefines spatio-temporal continuity predicates to denote instantaneous cross-sections. OS Score: +22.  
      *   FM-D: `gavagai` = `universal rabbithood`. CA: Redefines quantification apparatus to exclude counting of individuals. OS Score: +35.  
  5.4. **Certification Criterion OSA-1:** The FM submitted for certification *must* possess the lowest valid OS Score among all compliant alternatives documented by the audit team.

  **6. DISPUTE RESOLUTION AND MULTIPLE CERTIFICATION (DRMC)**  
  6.1. Should competing FMs achieve identical OS Scores while meeting OER-1 and AAC-1/AAC-2, or if OS Score calculation yields indeterminacy per Appendix A.7, the following applies:  
  6.2. **Procedure DRMC-1:** The Bureau *shall* certify all FMs achieving compliance under Clauses 3-5.  
  6.3. **Procedure DRMC-2:** Each certified FM *must* bear the ISB-CM-41B mark without qualification.  
  6.4. **Procedure DRMC-3:** The project sponsor *will* be billed for the full certification process for each FM certified under DRMC-1.  
  6.5. **Rationale:** Bureau certification verifies procedural compliance and operational adequacy against OE, not ontological validity. Multiple operationally adequate frameworks are permissible per ISB Doctrine 8 ("Pluralism of Functionally Equivalent Schemata").

  **7. AUDITOR CONDUCT AND REPORTING**  
  7.1. Auditors *must* utilize only the linguistic apparatus defined within the FM under audit when formulating queries or interpreting responses during OE collection and analysis (Ref. AAC-1).  
  7.2. Appeals to pre-supposed concepts external to the FM/CA framework (e.g., "obvious meaning," "native speaker intuition," "metaphysical reality") are categorically non-compliant and grounds for auditor retraining (ISB HR Policy 15.3).  
  7.3. **Fieldworker Admonition:**  
      > *"Auditor K. Finch (Team Gamma-7) received a Level 2 Reprimand for persistent non-compliance with Clause 7.1 and SOP 41-B Core Principles. Finch insisted during the audit debrief for PULa-334 that FM-Beta (`gavagai` = `rabbit-stage`) was 'objectively wrong' compared to FM-Alpha (`gavagai` = `rabbit`), despite both achieving identical OE prediction scores (100%) and requiring valid, documented CAs of equivalent complexity (OS Score +18). Finch erroneously claimed the Bureau was 'certifying contradictions.' Auditor Finch failed to recognize that ontological claims fall outside the SOP 41-B remit. Certification signifies functional equivalence within the documented framework, not unique truth."*  
  7.4. **Footnote 7.3(b):** For completeness, it is noted that this Standard (SOP 41-B) is itself available in Bureau-certified variant editions implementing distinct CA frameworks for its *own* terminology (e.g., "Standard," "Certification," "Apparatus" interpreted under part-whole or stage-whole paradigms per Appendix A.9). All variant editions bear the valid ISB-CM-41B mark.

  **8. CERTIFICATION ISSUANCE**  
  8.1. Upon satisfactory completion of the audit report demonstrating compliance with Clauses 3, 4, and 5 (or 6), the Bureau *shall* issue certification within 5 working days.  
  8.2. The ISB-CM-41B mark *must* be affixed to the FM cover page and title sheet.

  **9. APPENDICES**  
  9.1. **Appendix A: Compensatory Adjustment (CA) Complexity Metric and OS Score Calculation.**  
      *   A.1 Base Complexity Values for CA Types (e.g., Identity Redefinition: +10, Quantification Shift: +12, Spatio-Temporal Adjustment: +8).  
      *   A.2 Multipliers for Scope (e.g., Universal: x1.5, Conditional: x1.0).  
      *   A.3 **Appendix A.7: Indeterminacy Clause:** If competing CAs yield identical complexity scores after calculation, or if the interaction of CAs creates unresolvable scoring ambiguity, OS Score is deemed indeterminate. Proceed to DRMC (Clause 6).  
      *   A.4 **Appendix A.9: Bureau Self-Application:** List of CAs applied in variant editions of SOP 41-B (e.g., Edition B-1: "Clause" ≡ `temporal stage of regulatory instruction`; Edition B-2: "Standard" ≡ `undetached bureau protocol part`). All Editions: OS Score +28, Certified ISB-CM-41B.  
  9.2. **Appendix B: Dispute Resolution and Multiple Certification Billing Schedule (Confidential - Project Sponsors Only).**

  **10. CROSS-REFERENCES**  
  ISB Reg. 12.4f (Certification Voidance), ISB Doctrine 8 (Pluralism), ISB HR Policy 15.3 (Auditor Conduct), This Document: Clauses 3.5, 4.2, 4.3, 5.4, 6.2, 7.1, 7.3, Appendix A.

  ---
  **ISB-CM-41B**  
  *Interlingual Standards Bureau - Ensuring Predictable Communication Across Worlds*
