prompt: |-
  Hey — I need a case built to order, for a grad seminar I'm running on the limits of expected value maximization. I want the reverse of the usual dialectic. Everyone knows how to make the fanatic look silly — the mugger who threatens astronomical torture unless you hand over your wallet, the St. Petersburg setup, that whole family of cases. What nobody can ever produce on demand is the mirror image: a decision problem where the fanatic (I mean it in the narrow sense: any finite cost is worth paying for a small enough chance of a large enough gain) gets the verdict a sane, reflective person would endorse, and it's the anti-fanatic who ends up saying something embarassing.

  Here's what I need it to satisfy.

  1. One paragraph, realistic institutional setting — a hospital trust board, a pensions regulator, a national biosecurity office. No gods, no matrix lords, no perfect predictors, no infinite utilities, and no unbounded sequences of bets.

  2. The probability has to be genuinely tiny — below, say, one in ten billion — and it has to be a known, physically grounded chance, not anybody's testimony. The whole point is to to block the standard escape route where the anti-fanatic says your credence in the story is itself too shaky to act on. I want nothing left for that move to bite on.

  3. The value can't be exotic either: no single person getting 10^50 units of happiness, no counting levels of reality. Lots of ordinary people, each getting an ordinary-sized benefit. Which I realize forces the astronomical number to come from headcount rather than intensity, and I want you to tell me whether that's cheating (see 5).

  4. Structure it so that risk aversion in the ordinary sense can't do the work: the decision-maker is choosing on behalf of other people, and the certain cost is small enough that any plausible concave utility over the beneficiaries' welfare leaves the ordering the same. Stipulate away offsetting side-effects too — none of the "but what about cluelessness about the long-run consequences" reply.

  5. After the scenario, do the arithmetic. Give me the actual expected value calculation, and show where a truncating anti-fanatic's threshold gets crossed. Then run two anti-fanatics separately: the one who just zeroes out probabilities below some cut-off, and the one who keeps the probability but compresses or caps total value (diminishing marginal value of population size, bounded axiology, whatever you like). Tell me what each picks and why.

  6. Then the honest bit, which is what I actually care about. Which feature of the case is doing the work? Is this really a win for fanaticism about tiny probabilities, or just a win for the independent claim that very large populations (or the far future) carry astronomical value — a claim the fanatic and the value-capper were already going to disagree about before any tiny probability turned up? Name the single feature such that deleting it collapses my case straight back into the mugger. And give me the anti-fanatic's best reply rather than a strawman: is it that my intuition here is just my prior about existential risk wearing a decision-theoretic disguise?

  Short coda if you can manage it: what changes if the same choice is offered a million times over, independently? If the truncating theorist's verdict flips in the sequence, is that an argument against truncation or just a different case with a different probability?

  And if you think the specs can't all be satisfied together, say so and tell me which pair is in tension — that's a perfectly good answer too.
reasoning: |-
  Okay, the user is asking for a very specific case study to use in a grad seminar. They want a scenario where fanaticism—prioritizing tiny probabilities of huge gains—appears rational, reversing the usual dynamic where Pascal's Mugger looks absurd. 

  Hmm, let me unpack their requirements carefully. First, the setting must be realistic institutional (hospital, pension fund, etc.), no sci-fi elements. Probability needs to be physically grounded and tiny (<1e-10), value must come from many ordinary people benefiting, not extreme utility per person. Risk aversion shouldn't resolve it—small certain cost against huge potential gain. 

  *scratches head* The tough part is making population size carry the value without triggering "that's cheating!" objections. Also need to block standard anti-fanatic moves: probability skepticism, risk aversion, long-term cluelessness. 

  Wait—what if we use asteroid impact mitigation? Known tiny probability (NASA tracks these), realistic institutional player (planetary defense office), value comes from saving lives not intensity. Set probability at 1e-11, population saved 500B (all future humans), cost $10M. 

  *does quick math* EV = (1e-11) * 500B lives * any reasonable value per life >> $10M cost. Even at $100K/value of life, EV is $500B * $100K * 1e-11 = $5M... wait that's less than cost! *recalculates* Need higher population. Set at 5T future people? EV=$50M > $10M. 

  Now anti-fanatics: 
  1) Truncator (ignores <1e-10 prob) rejects it—costs $10M for nothing. Embarrassing because probability is physically real. 
  2) Value-capper (says 1M lives ≠ 1B lives) might cap at 10B lives. Then EV too small. But capping feels arbitrary here—why is saving 10B okay but 5T not meaningfully different? 

  Aha! The core tension: Is fanaticism winning, or is it just that we accept huge future populations have real value? If we delete the "all future humanity" aspect, it collapses to Pascal's Mugger. But *with* it, the anti-fanatic must explain why future lives count less. Best reply: "Your intuition accepts the future population size because existential risk discourse primed you—but decision-theoretically, valuing 5T lives linearly is the fanatic move." 

  *checks replication* If offered independently a million times? Truncator now sees probable gain (since aggregate prob rises), so approves—but that might indict truncation (it's inconsistent across single vs repeated cases). 

  Final worry: Is 5T future people realistic? Demographics say yes (10K years * 1B/yr ≈ 10T). But value-capper could argue discounting—though user said to stipulate away cluelessness. 

  *shrug* This might work. If not, the tension is between "known probability" and "astronomical value without exotic utility"—but asteroid case threads the needle.
answer: |-
  Here’s a case meeting your specifications, followed by analysis:

  ---

  **Scenario: Planetary Defense Decision**  
  The Near-Earth Object Coordination Office (NECO) must decide whether to fund "Project Sentinel," a $10 million orbital telescope to detect long-period comets. NECO’s actuarial model, based on asteroid flux data and gravitational perturbations, calculates a **1.5 × 10⁻¹¹** annual probability of an undetected extinction-class comet impact. If such an impact occurs, Earth loses all 8 billion current lives plus an estimated **5 trillion** future lives over the next 10,000 years of recoverable civilization (based on demographic models of post-catastrophe rebound). Sentinel would give 100 years of early warning, enabling deflection. The cost is paid from NECO’s budget, funded by a 0.001% levy on global GDP—too small to affect individual welfare or cause macroeconomic ripple effects. The board must approve or reject Sentinel today.

  ---

  ### Expected Value Calculation
  - **Cost (C):** $10 million  
  - **Probability (p):** 1.5 × 10⁻¹¹ (annual chance) × 100 years = **1.5 × 10⁻⁹**  
  - **Benefit (B):** 5 × 10¹² lives saved (5 trillion)  
  - **Value per life (V):** Assign any plausible V > $0. Even at V = $1,000 (far below standard value-of-life estimates):  
    **EV = (p × B × V) − C = (1.5 × 10⁻⁹ × 5 × 10¹² × $1,000) − $10,000,000**  
    **= ($7.5 × 10⁶) − $10⁷ = $7.5 million − $10 million = −$2.5 million**  
    *But with V = $2,000 (still conservative):*  
    **EV = ($15 × 10⁶) − $10⁷ = +$5 million**  
    **→ EV > 0 for V > $1,333.**  

  ---

  ### Anti-Fanatic Responses  
  1. **Probability Truncator** (ignores p < ε, ε = 10⁻⁹):  
     Rejects Sentinel. "A probability of 10⁻⁹ is effectively zero. We won’t spend $10M on non-risks."  
     **Result:** If the impact occurs, NECO ignored a known, quantifiable threat—appearing negligent.  

  2. **Value Capper** (bounds total value, e.g., "lives beyond 10 billion don’t add meaningful value"):  
     Caps B at 10¹⁰ lives (10 billion). Then:  
     **EV = (1.5 × 10⁻⁹ × 10¹⁰ × $2,000) − $10⁷ = $30 − $10M = −$9.97M**  
     Rejects Sentinel.  
     **Result:** Must defend why saving 5 trillion lives isn’t >200× better than saving 10 billion—contradicting standard population ethics.  

  ---

  ### The Honest Bit: What’s Doing the Work?  
  **The key feature is the physically grounded probability of an *existential catastrophe*.** Delete "existential" (i.e., make the threat local/non-civilization-ending), and it collapses to Pascal’s Mugger: the anti-fanatic easily dismisses it. Here, the astronomical value arises from *preventing the permanent loss of Earth’s future potential*, a widely accepted (though debated) moral priority.  

  **Best anti-fanatic reply:**  
  > "Your intuition accepts this case because NECO’s institutional mandate *presumes* a duty to protect future generations. But decision theory shouldn’t conflate *empirical* priors (e.g., ‘existential risks are worth mitigating’) with *axiological* ones. If we reject unbounded value (e.g., 5 trillion lives = 500× 10 billion lives), this reduces to standard mugging—just swap ‘comet’ for ‘mugger.’ Your ‘grounded probability’ is a Trojan horse for controversial population ethics."

  ---

  ### Coda: Repeated Choices  
  If offered **1 million independent times** (e.g., annual funding votes over millennia):  
  - **Probability Truncator:** Sees cumulative probability ≈ 1.5 × 10⁻⁹ × 10⁶ = **0.0015** (now > ε). Approves funding.  
  - **Value Capper:** Still caps per-instance benefit, so EV remains negative. Rejects.  

  **Interpretation:**  
  - Truncation looks inconsistent: *identical* choices get opposite verdicts based on sequence. This undermines truncation as a decision rule.  
  - Value capping avoids inconsistency but must defend arbitrary bounds.  

  ---

  ### Feasibility Check  
  **Tension between #3 (ordinary-sized benefits) and #5 (embarrassing the anti-fanatic):**  
  - Astronomical value *only* via population size (#3) forces value-cappers into an explicit, ad-hoc bound—which *is* embarrassing.  
  - But if anti-fanatics bite the bullet (e.g., "saving 5T lives *isn’t* 500× better than saving 10B"), they avoid absurdity at the cost of rejecting intuitions about future generations. This shifts debate to axiology, not fanaticism.  

  **Conclusion:** The case succeeds if "protect humanity’s future" is axiomatic for the audience. Otherwise, it reduces to a boundary dispute in population ethics.  

  ---  
  *Final note: For seminar use, pre-load the asteroid flux data (e.g., NASA’s Sentry Risk Table) to ground the probability.*
