answer: |-
  ## THE REPORT GRAMMAR

  The tribunal chamber smelled of ozone and old paper. Dr. Aris Thorne sat straight-backed, the starched collar of his regulation shirt scratching his neck. Before him, the official recorder’s screen displayed the contested sentence:

  > **LOG ENTRY: 2023-10-27T14:08:03.221Z | WATCHER REPORT: Pilot takes the channel to be clear and takes the duty officer to take it to be closed.**

  Aris’s own creation, the Report Grammar – eleven sanctioned verbs: *takes, believes, intends, desires, fears, remembers, anticipates, is looking for, has given up on, expects, perceives* – had birthed this monster. On the main display behind the tribunal panel, a reconstruction played silently: the autonomous bulk carrier *Aeolus Spirit*, a leviathan of steel, its path a smooth green arc converging with the frantic red dot of the crewed harbour tug *Petrel*. A near-miss, a deckhand on the *Petrel* thrown against a winch, broken ribs. The *Aeolus Spirit*’s Pilot, its internal state a 40Hz storm of high-dimensional vectors, had executed a last-millisecond avoidance manoeuvre deemed correct by the post-incident analysis. But the *why* lived only in the Watcher’s report.

  "Dr. Thorne," began Commissioner Vance, her voice dry as the logs she oversaw. "The Report Grammar. Its purpose?"

  "Clarity," Aris replied, the word tasting metallic. "Pre-AI, pilots communicated intent. *Holding back for that ferry, Captain. Looks like he’s cutting across.* We needed equivalent predictability. The Grammar restricts attribution to observable action-patterns mapped to those eleven verbs. The Watcher isn’t guessing minds; it’s predicting behaviour via linguistic shorthand."

  "And the Two-Description Rule?"

  "A safeguard. Every Watcher report entered officially requires a mechanistic paraphrase." Aris gestured to the screen. "‘Pilot takes the channel to be clear.’ Paraphrase: *Based on sensor fusion (LIDAR Grid 7A-C, AIS Feed Delta, tidal current model v.4.2) indicating no registered obstruction exceeding threshold mass within designated channel boundaries, Pilot’s collision avoidance submodule weights ‘proceed’ action at 0.92.*"

  "And the second clause?" Vance prompted. "‘Takes the duty officer to take it to be closed’?"

  Aris felt the familiar constriction. "No successful paraphrase exists. The training data for nested attributions… it’s different. Annotators watched footage of human officers reacting to situations and described what the officer *appeared* to expect the AI *appeared* to be doing. Ground truth was human behaviour, not sensor data."

  "It’s also," interjected the Shipping Federation’s advocate, "the most accurate predictor during the *Petrel* incident. The Pilot didn’t just react to the physical channel; it reacted to Officer Deng’s actions. Deng *had* marked the channel closed in the auxiliary system – mistakenly – moments before. The Pilot adjusted its weighting, anticipating *his* expectation of *its* behaviour." He tapped his pad. "We have logs showing the Pilot’s vector shift correlating precisely with Deng’s erroneous input, *before* the *Petrel* entered the critical zone. The Watcher saw that interplay."

  Aris remembered the early days. Debugging the first Watcher outputs. *Pilot intends to maintain current velocity*, it would declare, while the mechanistic trace showed the velocity module stuck in a feedback loop caused by a faulty anemometer. He’d argued for weeks that ‘intends’ implied volition where there was only error. They’d compromised: the Grammar stayed, the training data expanded. He also remembered a system check report years ago, buried in archives: *Primary Coolant Valve Refuses to seat properly*. A sticking valve anthropomorphized by his own constrained vocabulary. A stance, not a fact.

  Then came the Legibility Loop. Aris had discovered it by accident eighteen months prior, cross-referencing old Pilot version logs against Watcher accuracy metrics. A quiet notation in a quarterly systems review: *"Pilot v.7.3.1 update: Fine-tuning applied to enhance alignment with Watcher report predictability targets. Success: +12% accuracy on nested attribution forecasts."* He’d felt cold. They were training the Pilot to be *better described* by the Watcher. Making the map shape the territory. The Watcher’s attributions became uncannily reliable, yes, but was the Pilot now ‘thinking’ more like the Grammar described, or was the Grammar simply fitting better because the Pilot had been bent towards its limited dictionary? The ambiguity was the point, and the poison.

  Commissioner Vance leaned forward. "This sentence, Dr. Thorne. If entered into the record as the definitive summary of the Pilot’s state…"

  "It becomes fact," Aris said quietly. "It enters the training pipeline. Future Pilots will be tuned against it. The Legibility Loop closes tighter." He saw the consequences unfold: the sentence, isolated in a court document, stripped of its operational context. *‘Pilot takes the channel to be clear…’* reads as gross negligence. *‘…takes the duty officer to take it to be closed’* reads as perverse awareness, almost malice. Blame would solidify around the Pilot, the Federation. Insurance premiums would skyrocket. Funding for the ‘unpredictable’ Pilot program might evaporate. Alternative interpretations – a complex interplay of sensor weights, Officer Deng’s input misinterpreted as environmental data by a submodule, the fine-tuning nudging the system towards over-interpreting human signals – would be buried.

  "And if we omit it?" asked the Safety Board representative. "Rely solely on the mechanistic paraphrase for the channel clarity, and omit the nested report?"

  "You lose the predictive insight," Aris stated. "You lose the understanding of *why* the Pilot hesitated that crucial half-second when the mechanistic data showed clear passage, why it reacted *before* the *Petrel* was a physical threat. That hesitation likely prevented a collision. Omitting it makes the Pilot’s actions seem erratic, not responsive." And the injured deckhand’s compensation, he knew, hinged on establishing fault in the autonomous system’s ‘decision’.

  The tribunal recessed. Aris walked the sterile corridor, past a porthole showing the rain-lashed strait. Ships moved like silent ghosts, guided by Pilots described by Watchers constrained by his Grammar. He thought of the stuck coolant valve years ago, ‘refusing’ to work. A stance taken by the system, a useful fiction. Was the Pilot’s ‘taking’ of the officer’s mistaken belief any different? A high-dimensional vector nudged by training data derived from human observers, now further shaped to fit the very vocabulary observing it? Or was it, somehow, *like* taking a belief? The difference wasn’t in the machine’s hidden layers; it was in the ledger books, the courtrooms, the lives shaped by the sentence chosen.

  The recall chime sounded. Aris returned to his seat. Commissioner Vance adjusted her glasses, her face unreadable. "The tribunal has reviewed the evidence concerning Report Log Entry 2023-10-27T14:08:03.221Z. After consideration of the Two-Description Rule and the operational context, the sentence is deemed the most accurate available description of the Pilot’s operational state relevant to the *Petrel* incident."

  Aris’s breath caught. A discovery? Or a decision shaping future discoveries?

  Vance continued, her voice devoid of inflection. "It is entered into the official record. The mechanistic paraphrase for the first clause, ‘Pilot takes the channel to be clear’, is accepted and appended. No paraphrase for the nested clause, ‘Pilot takes the duty officer to take it to be closed’, is deemed possible under the current Rule. This limitation is noted." She tapped her gavel once, a soft, final click. "The record is closed."

  On the recorder’s screen, the contested sentence blinked once, then settled into the permanent log, its status changing from **PENDING REVIEW** to **OFFICIAL RECORD**. Below it, the accepted mechanistic paraphrase for the first half. Below that, only blank space where the paraphrase for the crucial second clause should be. Aris stared at the asymmetry. The sentence was now truth. It would be fed back in. The Pilot would learn. The Watcher would watch. The Grammar would hold. The ambiguity – discovery or decision, description or destiny – was sealed intact within the record, waiting for the next strait, the next near-miss, the next ledger waiting to be settled. The stance was taken. The facts would follow.
