  Hmm, they've clearly done their homework - they're aware of the triviality argument (any physical system can be mapped to any computation), the grain problem (how fine-grained should states be?), and the representation debate. I appreciate how they're trying to separate substantive requirements from "camp prejudices." Smart.

  Their frustration is palpable - they don't want to waste time on literature until they have proper evaluation criteria. That's fair. And they're especially keen on knowing if the requirements are mutually incompatible - which is the most philosophically interesting part. 

  Let me structure this carefully. First, the non-negotiable requirements seem to be: avoiding trivial mappings (must rule out gerrymandered interpretations), specifying grain/timing (can't dodge the "how coarse?" question), and handling perturbations (real systems get noisy). These are make-or-break for any serious theory.

  The negotiable ones are more ideological: intrinsic vs relative implementation (that's a metaphysical choice), causal powers (depends if you're a reductionist), and representation (big split between cognitivists and anti-representationalists). 

  Ah, and they're absolutely right that some pairs might be incompatible. Like if you demand intrinsic computation AND avoid triviality, you might need to smuggle in "proper function" which brings teleology. Or if you want both non-triviality AND every-system-computes, that's logically impossible. 

  For existing views: the systematic mapping approach (like Putnam) fails triviality spectacularly. Mechanistic views (Piccinini etc.) handle grain and perturbations well but struggle with intrinsic-ness. Pancomputationalism just embraces the triviality. 

  The user's sharpest insight is recognizing that unsatisfiable requirements turn the debate into a choice about which axiom to drop. That's exactly right - and why this isn't settled science. I should emphasize that in the response.
answer: |-
  Here's a requirements list for a substantive theory of physical computation implementation, the rationale behind each, and how they interact:

  ### Core Requirements (Non-Negotiable for Substance)
  1.  **Non-Triviality Constraint:** Must prevent *any* arbitrary physical system from implementing *any* arbitrary computation under *some* gerrymandered mapping.  
      *   *Why:* Without this, the claim is vacuously true (a rock computes WordStar). A substantive theory needs criteria to rule out degenerate mappings that don't reflect the system's causal structure or behavior meaningfully.
  2.  **Grain & Timing Specification:** Must explicitly address the level of abstraction (spatial grain of "states") and temporal grain (discrete steps, continuous flow, clocking).  
      *   *Why:* Halving speed or blurring state distinctions shouldn't arbitrarily change the implemented computation. Neuroscience needs to know *which* computation at *which* scale/timing is relevant to brain function.
  3.  **Perturbation Robustness:** Must account for physical events (noise, damage, non-input stimuli) that aren't formal inputs but affect the system's state transitions.  
      *   *Why:* Real systems (like brains) are noisy and subject to myriad influences. The theory must explain why some perturbations "count" as inputs/errors within the computation and others break the implementation entirely.

  ### Contested Requirements (Where Camps Diverge)
  4.  **Intrinsicness vs. Relativity:** Must state whether implementation is an intrinsic physical property of the system *itself* or is relative to an external *description/purpose*.  
      *   *Why:* If intrinsic, how does computation exist without an interpreter? If relative, does this smuggle in designer intentions, undermining objectivity? Neuroscience needs clarity on whether computation is "in the brain" or in the model.
  5.  **Causal Power:** Must clarify if the computational description adds explanatory power *beyond* the underlying physics/biology, or is merely a redescription.  
      *   *Why:* If computation has no causal efficacy, claiming "the brain is a computer" is just a metaphor. If it does, how does it avoid dualism or overdetermination?
  6.  **Representational Requirement:** Must state whether computational states must bear representational/contentful properties ("semantics") or if syntax/structure alone suffices.  
      *   *Why:* Cognitivism (Fodor, Pylyshyn) demands representations; anti-representational views (radical enactivism, some connectionism) reject this. Neuro explanations often rely on representational talk (e.g., "face cells").

  ### Key Tensions & Trade-offs
  *   **Non-Triviality + Intrinsicness is Hard:** Trivial mappings are avoided by requiring mappings to respect the system's *causal structure* (e.g., Chalmers, Copeland). But grounding "correct" causal structure intrinsically, without appeal to function/purpose, is extremely difficult. Most non-trivial accounts implicitly or explicitly rely on teleology (system's *function*).
  *   **Non-Triviality + Pancomputationalism is Impossible:** The "every system computes everything" view (pancomputationalism, stemming from trivial mappings) directly violates Non-Triviality. You must reject one.
  *   **Intrinsicness + Causal Power + Non-Triviality is Fraught:** An intrinsic, causally potent computation that isn't trivial risks being a "new" fundamental property or requiring strong emergence. Most physicalist accounts avoid this by collapsing computational causation into physical causation (violating distinct causal power) or embracing relativity.
  *   **Representation + Grain is Messy:** Specifying the "right" grain for syntactic states is hard; specifying it for *representational* states (what counts as tokening "dog"?) is vastly harder and context-dependent.

  ### Which Requirement Knocks Out Popular Accounts?
  *   **Non-Triviality** knocks out: Simple mapping views (Putnam's original triviality argument), strong pancomputationalism.
  *   **Grain & Timing** knocks out: Vague analogies ("brain is like a neural network") without specifying the exact model and scale.
  *   **Intrinsicness** knocks out: Most interpretation-relative views (e.g., Searle's observer-dependent computation).

  ### How Major Views Fare Against the List
  1.  **Systematic Causal Mapping (e.g., Chalmers):**  
      *   *Good:* Explicitly addresses **Grain/Timing** and **Non-Triviality** by requiring isomorphic mapping to causal structure.
      *   *Weak:* Struggles with **Perturbation Robustness** (is noise part of the structure?) and **Intrinsicness** (is the isomorphism discovered or imposed?). Ambiguous on **Causal Power** and **Representation**.
  2.  **Mechanistic/Functional (e.g., Piccinini, Milkowski):**  
      *   *Good:* Strong on **Non-Triviality** (functional mechanisms), **Grain** (mechanistic levels), **Perturbation Robustness** (error, noise within mechanism). Handles **Causal Power** via mechanistic explanation.
      *   *Weak:* Typically requires teleology (**Intrinsicness** compromised - computation tied to system's *function*). Often incorporates **Representation** (functional role semantics).
  3.  **Pancomputationalism / Trivial Mapping (e.g., Putnam, later Searle):**  
      *   *Good:* Technically satisfies **Grain/Timing** (choose any mapping) and **Intrinsicness** (computation is observer-relative).
      *   *Weak:* **Fails Non-Triviality utterly.** Makes **Causal Power** irrelevant (everything computes everything). **Perturbation Robustness** and **Representation** become meaningless.

  ### The Upshot
  The claim "the brain is a computer" **is substantive only if you accept constraints like Non-Triviality, Grain Specification, and Perturbation Handling.** However, satisfying these jointly, especially without appealing to teleology (which challenges Intrinsicness) or collapsing into physics (challenging Causal Power), is profoundly difficult. **No current account satisfies all non-negotiable requirements without leaning on contested assumptions (like teleology) or creating new tensions.** The debate often hinges on which requirement(s) one is willing to relax or reinterpret. Knowing this helps you see where each author's "camp" draws its lines.
