answer: |-
  Here’s your targeted Q&A prep sheet, designed for your audience and thesis. I’ve structured it by likely challenger groups, ordered by probability of objection, with concise replies, weaknesses, and strategic concessions.

  ---

  ### **Prep Sheet: Performance Legitimacy Q&A**  
  **Core Thesis:** Performance legitimacy is a *degenerate case of consent theory* where rulers control both outcomes and metrics. Legitimacy requires *contestability* of the scoreboard and recognition of *moral hazard* in the "insurance" bargain.  

  ---

  ### **1. Normative Theorists (Skeptics of Measured Legitimacy)**  
  **Likely Q:** *"How can you call this ‘legitimacy’ if it’s not grounded in normative principles like justice or autonomy? Isn’t this just measuring belief, not legitimacy?"*  
  **Your Reply (2 min):**  
  > "I distinguish *descriptive legitimacy* (belief in the right to rule) from *normative legitimacy* (moral justification). My work analyzes the former: how regimes *claim* legitimacy via performance, not whether they *should*. But crucially, I argue that without contestability, these claims collapse into propaganda—they lack the reflexive validation consent theory requires. Even consent needs a mechanism to withdraw agreement; here, contestability is that mechanism."  
  **Weakness:** Doesn’t fully satisfy theorists who reject descriptive legitimacy as conceptually coherent.  
  **Preemptive Concession:** "I concede normative legitimacy requires more than belief—but my focus is how regimes *engineer* belief through institutional monopolies on performance narratives."  

  ---

  ### **2. China Survey Researchers (Empiricists)**  
  **Likely Q₁:** *"You dismiss ‘performance legitimacy’ as measured in surveys (e.g., high trust correlated with GDP growth). But if people *believe* the regime is legitimate, doesn’t that make it legitimate? How is your ‘contestability’ anything but a Western bias?"*  
  **Your Reply (2 min):**  
  > "Survey data captures *perceived* legitimacy, but my argument is that performance claims lack *justificatory force* if people can’t debate the metrics. Take China: if citizens can’t question whether GDP growth justifies pollution or inequality, their ‘trust’ reflects acquiescence, not endorsement. This isn’t about elections—it’s whether institutions allow feedback on *what counts as performance*. China’s petitions system or local consultations (*xietiao*) are designed to absorb dissent, not permit scoreboard challenges."  
  **Weakness:** Hard to prove "acquiescence ≠ endorsement" with survey data.  
  **Preemptive Move:** Pre-cite studies showing suppressed dissent (e.g., Chen & Dickson) to reframe "trust" as risk-aversion.  

  **Likely Q₂:** *"How would you operationalize ‘contestability’ without elections? Isn’t this hopelessly idealistic in authoritarian contexts?"*  
  **Your Reply (2 min):**  
  > "Contestability isn’t all-or-nothing. Look for:  
  > - **Institutional channels** to debate metrics (e.g., Singapore’s PAP forums allowing pushback on housing policy).  
  > - **Elite factions** competing over performance definitions (e.g., ‘stability vs. innovation’ debates in China).  
  > - **Policy reversals** responding to public backlash (e.g., China backtracking on COVID zero).  
  > If no channels exist, or backlash is punished, it’s evidence of degeneracy."  
  **Weakness:** Requires granular case knowledge; difficult to quantify.  
  **Concession:** "I concede operationalization is challenging—but we already code ‘accountability’ in autocracies; this is a subset."  

  ---

  ### **3. Singapore Specialist**  
  **Likely Q:** *"Singapore’s PAP has delivered prosperity with limited contestability. By your logic, it’s illegitimate—yet it’s stable and surveys show high trust. Isn’t this a counterexample?"*  
  **Your Reply (2 min):**  
  > "Singapore is the *exception that tests the rule*. The PAP permits constrained contestability: citizens can sue the state, debate policies in state-media forums, and vote out underperforming MPs (e.g., 2011 Aljunied loss). My ‘insurance’ argument also applies: Singaporeans traded political voice for low-risk prosperity, but the PAP *credibly commits* to performance by allowing some pushback. Where China silences critics, Singapore co-opts them—a key difference."  
  **Weakness:** Risks overstating PAP’s tolerance for dissent.  
  **Preemptive Move:** Highlight J.B. Jeyaretnam’s lawsuits or Thum Ping Tjin’s deplatforming to show contestability’s limits.  

  ---

  ### **4. General Comparativists**  
  **Likely Q:** *"Isn’t your ‘insurance’ analogy just a rebranding of the ‘performance legitimacy’ you critique? All states trade outputs for inputs—that’s social contracting 101."*  
  **Your Reply (2 min):**  
  > "Classic social contracts assume neutral arbitration. My ‘insurance’ model emphasizes *asymmetric control*: the ruler sets the terms, *creates* the risks (e.g., framing protests as ‘chaos’), and profits from ‘solving’ them. Like a fire chief arsonist, they manufacture the need for their own protection. This isn’t contracting—it’s a protection racket masquerading as mutual aid."  
  **Weakness:** Requires accepting the "arsonist" metaphor as empirically sound.  
  **Concession:** "Yes, all states leverage performance—but moral hazard escalates when rulers monopolize threat definitions."  

  ---

  ### **The Question You Hope Nobody Asks (But Prepare For)**  
  **Q:** *"If contestability is necessary, doesn’t your framework imply all non-democracies are illegitimate? Isn’t this just democratic theory in disguise?"*  
  **Reply Strategy:**  
  > "Not necessarily. I argue that *performance claims alone* are insufficient without mechanisms to challenge them. But non-democracies can host contestability via legislatures, courts, or party feedback loops—*if* they allow genuine metric debates. My goal isn’t to prescribe democracy, but to show that regimes claiming legitimacy *solely* from outcomes they control are engaged in self-deception."  
  **Soft Spot:** Smuggles in liberal assumptions.  
  **Damage Control:** Cite non-Western examples (e.g., Oman’s *majlis*) to show contestability ≠ democracy.  

  ---

  ### **Strategic Summary**  
  1. **Concede Early:**  
     - To theorists: "I study *descriptive* legitimacy, not normative."  
     - To empiricists: "Surveys capture perceptions, but perceptions can be manufactured."  
  2. **Reframe Their Terms:**  
     - Use "input/output legitimacy" language but insist "input" requires contesting outputs.  
     - Anchor "contestability" to *their* work (e.g., "Like your ‘vertical accountability’ measures but for performance indicators").  
  3. **Leverage China Expertise:**  
     - Invoke Xi’s "performance contracts" for officials as scoreboard-rigging.  
     - Note how surveys omit repressed groups (Uyghurs, feminists) who can’t contest.  
  4. **When Stuck:**  
     - Pivot to the moral hazard argument—it’s intuitive and vivid.  
     - "Even if you reject contestability, the insurance analogy shows performance legitimacy is unstable."  

  **Final Tip:** Start your Q&A by saying, "I distinguish *descriptive legitimacy* (my focus) from normative claims," to preempt theorists. Then watch the Singapore specialist’s body language—if they lean in during your PAP reply, you’ve nailed it.
