prompt: |-
  I've been asked to run a 45-minute internal session on the eng side of the company about why our risk score can't be fair in every way at once — the kind of result where you show that calibration within each group and equal false positive / false negative rates across groups can't both hold when the underlying outcome rates differ, unless the model is already perfect. I don't need the explanation for me, I need a plan for explaining it to them, and I need the plan to survive contact with this particular room.

  Who's in the room: about twelve people, mostly backend engineers plus two data scientists, stats knowledge stops at "I once fit a logistic regression", zero philosophy, and zero appetite for being told they're bad people. Two of them built the model we'll be talking about. One guy has definately read a pop writeup of the recidivism-scoring controversy and will bring it up in the first five minutes if I don't get there first.

  The model: we score applicants for a subsidised job-training program, the score is their predicted chance of finishing the course, the top scorers get offered a seat. And here's the wrinkle I don't know how to place: we only observe whether someone finishes for the people we actually admitted, so our historical outcome rates are partly an artifact of last year's admission policy rather than a fact about the world.

  What I want from you:

  - The order the pieces have to go in, and what depends on what. My instinct is that calibration has to land before error-rate parity, because calibration is the thing they already believe in ("of course a 0.7 should mean 70%"), but I'm not sure, and I don't know where the idea of a score as a probability at all has to be nailed down or whether I can just assume it.
  - The one example that should carry the whole session, built on our own model or something close to it, and what that example has to have and not have. I'm fairly convinced I should NOT use a criminal-justice case — they'll spend twenty minutes arguing about crime and race and I'll lose the room — but tell me what else it needs: does it need numbers small enough to do in their heads, does it need the stakes to be a benefit being handed out rather than a punishment being imposed, does it need the two groups to be a protected attribute or should I use something blander like referral channel.
  - The misconceptions, in the order they'll actually form them, and the point in the sequence where each should be headed off. The ones I'm expecting: "just delete the group column and we're fine"; "this is only the accuracy-fairness tradeoff dressed up"; "it's a knife-edge result, approximate fairness is fine"; "our outcome rates differ only because of past discrimination, so the fix is to equalise the scores"; "randomising at the threshold fixes it". Tell me which of those I've got wrong, which ones show up later than I think, and the one I'm not anticipating.
  - Where in the arc the selective-labels thing should go. If I open with it I think they file the whole session as a data-quality problem; if I close with it I think they conclude the theorem was beside the point. So: where, and in what form.
  - What I should flat-out refuse to get into at this level, and say out loud that I'm refusing. I'm guessing the actual proof, anything causal, and which criterion is the morally right one — but tell me if I'd be cutting something I shouldn't.
  - How I'll know at the end whether it landed. I don't want a show of hands on "does everyone get it". Give me something they have to produce. My idea was to hand them a variant where the two groups do have the same outcome rate and ask them what's still impossible — but I'm not sure that tests the right thing.

  Last thing: they are going to ask, in the final ten minutes, which criterion we should actually ship. Tell me how the sequence should set that up so it comes out as a decision with an owner rather than a question I answer on the spot, because I really don't want to be the person who picked.
reasoning: |-
  We are going to explain the impossibility theorem: that calibration within groups and equal false positive/negative rates cannot both hold when base rates differ, unless the model is perfect.

   Key constraints:
   - Audience: backend engineers, 2 data scientists. Stats knowledge: fitted logistic regression once. Zero philosophy. Don't want to be called bad people.
   - Model: predict chance of finishing a subsidized job-training program. Only observe outcomes for admitted (selected) applicants.
   - Avoid criminal justice example to prevent derailing.

   Plan:

   1. **Goal**: Make them understand that we cannot have both calibration by group and equal error rates across groups when the base rates (outcome rates) differ.

   2. **Order of Pieces**:
      a. Start with what they know: the model outputs a probability. They believe in calibration: if we say 70%, then about 70% of those should actually finish. This is a core principle they accept.
      b. Then introduce the idea of base rates: the overall proportion of people who would finish if admitted. But note: we only observe outcomes for the admitted. However, for the sake of the initial explanation, we will assume we have a way to know the base rates (or we will later address the selective labels issue).
      c. Now introduce two groups (e.g., Group A and Group B) and show that if the base rates differ, then we cannot have both:
          - Calibration within each group: for each score, the observed outcome rate in that group matches the score.
          - Equal false positive rates (FPR) and false negative rates (FNR) across groups.
      d. Use a concrete example with numbers.

   3. **The Example**:
      - Use the job-training program context.
      - Groups: Let's use two referral channels (e.g., "Online" vs. "Community Center") to avoid protected attributes initially. But we can later note that the same applies to protected groups.
      - Numbers: small and easy to follow.

      Example Setup:
      - Group A (Online): 1000 applicants. Base rate (true probability of finishing if admitted): 60%.
      - Group B (Community Center): 1000 applicants. Base rate: 40%.

      We build a model that outputs scores. We want:
        (a) Calibration: In Group A, among people with score s, about s*100% finish. Similarly for Group B.
        (b) Equal FPR and FNR: We set a threshold (say 50%) to admit. Then:
            FPR = P(score >= threshold | actually would not finish) -> we want this equal across groups.
            FNR = P(score < threshold | actually would finish) -> we want this equal across groups.

      Now, let's assume we have a perfect model for each group? But note: if the model is perfect, then base rates don't matter because the model perfectly predicts. So we assume the model is not perfect.

      Instead, we show: if we have calibration and the base rates are different, then the error rates must be different.

      How?
      - Suppose we set a threshold t (e.g., 0.5). 
      - In Group A, the proportion of positives (score >= t) is, say, p_A. Similarly, p_B for Group B.
      - But because of calibration, the proportion of true positives in Group A at threshold t is the expected value of the score for those above t? Actually, we need to think in terms of the distribution.

      Alternatively, we can use a simpler example with a binary classifier (but our model outputs scores). We can discretize the scores into two bins: above and below threshold. But note: calibration is about the entire score distribution.

      Let's use a coarser view: two score levels.

      Example with two score levels (to keep it simple):

      Suppose we have two score levels: High (0.7) and Low (0.3). We admit only High.

      Group A (Base rate 60%):
        - Suppose we have 1000 applicants.
        - We assign scores: 
            - Let the proportion of true positives (finishers) that get High score be the true positive rate (TPR_A) and false positives (non-finishers) that get High score be FPR_A.
        - Because of calibration:
            - Among those in Group A with High score (0.7), 70% are finishers and 30% are not.
            - Among those with Low score (0.3), 30% are finishers and 70% are not.

      Similarly for Group B (Base rate 40%):
        - Calibration: 
            - High score: 70% finishers, 30% non-finishers.
            - Low score: 30% finishers, 70% non-finishers.

      Now, let's compute the base rates from the model:

      For Group A:
        Let H_A = number of High scores in A, L_A = number of Low scores in A.
        Then, the number of finishers in A = (0.7 * H_A) + (0.3 * L_A)
        The base rate is (0.7 * H_A + 0.3 * L_A) / 1000 = 0.6.

      Similarly, for Group B:
        (0.7 * H_B + 0.3 * L_B) / 1000 = 0.4.

      Now, let's compute FPR and FNR.

      FPR (false positive rate): 
        For Group A: 
          Non-finishers in A: 400 (because base rate 60% finishers, so 40% non-finishers -> 400 non-finishers)
          How many non-finishers got High score? From the High score group: 30% of the High scores are non-finishers -> 0.3 * H_A.
          So FPR_A = (0.3 * H_A) / 400.

        Similarly, for Group B:
          Non-finishers in B: 600 (because 40% finishers, so 60% non-finishers -> 600 non-finishers)
          FPR_B = (0.3 * H_B) / 600.

      We want FPR_A = FPR_B. So:
          (0.3 * H_A) / 400 = (0.3 * H_B) / 600
          => H_A / 400 = H_B / 600
          => H_A / H_B = 400/600 = 2/3.

      Similarly, FNR (false negative rate):
        Finishers who got Low score.
        Group A: 
          Finishers: 600
          Finishers with Low score: 0.3 * L_A? No: in the Low score group, 30% are finishers -> so the number of finishers in Low score is 0.3 * L_A. But note: these are the false negatives (because they are finishers but we gave low score and wouldn't admit).
          So FNR_A = (0.3 * L_A) / 600.

        Group B:
          Finishers: 400
          FNR_B = (0.3 * L_B) / 400.

      We want FNR_A = FNR_B:
          (0.3 * L_A) / 600 = (0.3 * L_B) / 400
          => L_A / 600 = L_B / 400
          => L_A / L_B = 600/400 = 3/2.

      Now, we also know that H_A + L_A = 1000 and H_B + L_B = 1000.

      From base rate equations:
        Group A: 0.7 H_A + 0.3 L_A = 600   [because 60% of 1000 = 600]
        Group B: 0.7 H_B + 0.3 L_B = 400

      And from FPR equality: H_A = (2/3) H_B.
      From FNR equality: L_A = (3/2) L_B.

      Now, let H_B = x, then H_A = (2/3)x.
      Let L_B = y, then L_A = (3/2)y.

      For Group A: 
          H_A + L_A = (2/3)x + (3/2)y = 1000
          Also: 0.7*(2/3)x + 0.3*(3/2)y = 600   => (1.4/3)x + (0.9/2)y = 600 => (14/30)x + (9/20)y = 600 -> simplify: (7/15)x + (9/20)y = 600.

      For Group B:
          x + y = 1000
          0.7x + 0.3y = 400

      Solve Group B:
          0.7x + 0.3y = 400
          and x+y=1000 -> y=1000-x
          0.7x + 0.3(1000-x)=400
          0.7x + 300 - 0.3x = 400
          0.4x = 100 -> x=250, then y=750.

      Then for Group A:
          H_A = (2/3)*250 = 500/3 ≈ 166.67
          L_A = (3/2)*750 = 1125
          Then total in A: 166.67+1125 = 1291.67, which is not 1000 -> contradiction.

      Therefore, we cannot have calibration and equal FPR and FNR when base rates are different.

   4. **Selective Labels Issue**:
      - We only observe outcomes for admitted (High score). So we don't know the outcome for the Low score group.
      - How to handle? 
          - We must acknowledge that our historical data is biased because we only admit the High scores. 
          - We don't know the true base rates for the entire population, and we don't know the outcome for the Low score group.
          - This complicates model training and evaluation.
      - Where to place this? 
          - After the theorem. Why? Because the theorem is about the fundamental trade-off. The selective labels issue is an additional practical challenge that makes it even harder to achieve fairness, but the theorem holds even if we had full data.

      So sequence:
          a. Explain the ideal scenario (with full data) and the theorem.
          b. Then say: "But in our case, we don't even have full data. We only observe outcomes for the admitted. So we have an extra layer of difficulty."

   5. **Misconceptions and How to Head Them Off**:
      a. "Just delete the group column and we're fine."
          - This is the first one that will come up. Head it off by explaining that even without the group column, the model might learn to use proxies, and the base rates are different so the problem still occurs. Also, without the group column, we cannot even measure calibration by group.

      b. "This is only the accuracy-fairness tradeoff dressed up"
          - It is a tradeoff between two fairness criteria. Explain that both calibration and error rate parity are fairness criteria, and we can't have both when base rates differ.

      c. "It's a knife-edge result, approximate fairness is fine"
          - We can show in the example that even with approximate equality, the numbers don't add up. The example we did leads to a contradiction (non-integer numbers and total not 1000). Also, the theorem says it's impossible unless base rates are equal or the model is perfect.

      d. "Our outcome rates differ only because of past discrimination, so the fix is to equalise the scores"
          - But note: equalizing scores without regard to the true outcome would break calibration. We want the score to reflect the true probability. If we artificially equalize scores, then the scores are no longer interpretable as probabilities.

      e. "Randomising at the threshold fixes it"
          - Randomization at the threshold might help with equalizing selection rates, but it doesn't fix the calibration or error rate parity. It might even make calibration worse.

      f. One you might not anticipate: "We can use separate thresholds for each group to fix the error rates." 
          - But note: if we use separate thresholds, then we break the meaning of the score (because the same score in two groups leads to different decisions). Also, we still have calibration, but now we are making decisions differently by group. This is a different fairness criterion (equalized odds) but then we break parity in the threshold. Also, we might violate the policy (if we are required to use the same threshold).

   6. **What to Refuse to Get Into**:
      - The actual mathematical proof (beyond the example). We are showing by example, not proving in general.
      - Causal questions: why the base rates differ? (We take the base rates as given.)
      - Which fairness criterion is morally right? (We are engineers, we are showing what is possible. The choice of criterion should be a business/policy decision.)

   7. **How to Know if it Landed**:
      - Give them a variant: 
          "Suppose we have two groups, and the base rates are the same (say 50% for both). Now, can we have both calibration and equal error rates?"
          - Answer: Yes, if the model is perfect? Actually, even if the model is not perfect, it is possible. For example, if the model is the same for both groups and the base rates are equal, then we can have both.

          Then ask: "But what if the model is not perfect? Can we still have both?" 
          - Actually, even if the model is not perfect, we can have calibration and equal error rates when base rates are equal? Not necessarily. But the theorem doesn't say it's impossible when base rates are equal. The impossibility only arises when base rates are different.

          Alternatively, give a scenario: 
            Group A: base rate 50%, Group B: base rate 50%. 
            We have a model that is calibrated and has the same error rates? It is possible. For example, use the same model for both.

          Then ask: "What if the model is better at predicting for Group A than Group B?" 
            Then we might not have the same error rates. But the point is: the theorem does not forbid having both when base rates are equal.

      - Alternatively, give a scenario where base rates are different and ask them to sketch why both conditions cannot hold. They don't have to do the math, but explain in words.

   8. **The Final Question: Which criterion to ship?**
      - The sequence should set up that:
          - We have shown that we cannot have both.
          - We have also shown that we have selective labels, which complicates everything.
          - Therefore, we must choose one criterion to prioritize, and this choice has implications.

      - How to make it a decision with an owner:
          - "This is a policy decision that requires input from the business, legal, and impacted communities. Our job as engineers is to:
               a. Explain the trade-offs (which we did today).
               b. Build the system to support the chosen criterion.
               c. Work with the product/business owners to make the choice explicit and documented."

      - So when asked, respond:
          "I can't make that call alone. What I can do is help us understand the implications of each choice. For example:
            - If we prioritize calibration, then our scores can be interpreted as probabilities within each group, but our error rates (and therefore the impact of our mistakes) will differ across groups.
            - If we prioritize equal error rates, then we break calibration: a score of 0.7 in group A might not mean the same thing as 0.7 in group B.

          We need to know what the program values more. I recommend we schedule a follow-up with the product and policy teams to decide, and we can then implement accordingly."

   9. **Overall Session Structure** (45 minutes):

       - [5 min] Introduction: 
            - The model: we predict the probability of finishing. 
            - We care about fairness. Two common fairness criteria: 
                 (a) Calibration: the score means the same thing in every group (e.g., 0.7 means 70% chance of finishing in every group).
                 (b) Error rate parity: the rate at which we make mistakes (false positives and false negatives) should be the same across groups.
            - Today we'll see that we can't have both when the underlying success rates (base rates) differ.

       - [10 min] Calibration and Base Rates:
            - Explain calibration: they already believe in it. 
            - What is the base rate? The overall proportion of people who would finish if admitted. 
            - In our data, we only observe the admitted, so we don't know the true base rate for the entire applicant pool? But for the sake of argument, assume we know (or from historical data before we had the model?).

       - [15 min] The Example with Two Groups and Two Scores:
            - Walk through the example step by step (as above). 
            - Show that if base rates are different (60% vs 40%), then requiring calibration and equal error rates leads to a contradiction (the numbers don't add up).

       - [5 min] The Selective Labels Issue:
            - But wait: in reality, we only observe outcomes for those we admit (High score). 
            - So we don't know what would have happened to the Low score group.
            - This means we don't even know the true base rates? And we can't measure calibration for the Low score group? 
            - So we are already on thin ice. This makes achieving fairness even harder.

       - [5 min] Misconceptions Addressed:
            - Go through the list quickly and debunk.

       - [5 min] How to Decide What to Do?
            - We must choose which criterion to prioritize. 
            - This is a business/policy decision. Our role is to build the system accordingly and make the trade-off explicit.

       - [5 min] Check for Understanding:
            - Give a scenario: "Suppose we have two groups with the same base rate (say 50%). Can we have both calibration and equal error rates?" 
            - Let them discuss in pairs for 1 minute, then take answers. 
            - Then: "What if the model is perfect? Then we have both. What if the model is not perfect? It is possible to have both? (Yes, for example if the model is the same for both groups and the base rates are equal, then we can achieve both.)"

       - [Remaining] Q&A.

   10. **Materials**:
        - Slides with the example broken down step by step.
        - Handout with the example and the contradiction.

   11. **Anticipating the Recidivism Controversy**:
        - At the beginning, when introducing the topic, say: "You might have heard about similar issues in criminal justice risk scores. We're going to focus on our own context to avoid getting sidetracked, but the underlying math is the same."

   12. **Two Model Builders in the Room**:
        - Acknowledge their work: "We have a model that does a good job at prediction, and we're now thinking about how to ensure it's fair. This is an additional layer of complexity that we must address."

   13. **Key Message**:
        - We are not saying anyone is bad. We are saying that the world is complex, and we have to make trade-offs. Our job is to make these trade-offs explicit and then let the organization decide.

   This plan should survive the room because it stays concrete, uses their context, avoids sensitive attributes (initially), and focuses on the math they can follow.
answer: |-
  ### **Session Plan: The Impossibility of Simultaneous Fairness Criteria**

  #### **Order of Pieces & Dependencies** (10 minutes)
  1. **Start with Calibration** (5 min)  
     - **Why first?** It's intuitive and aligns with their existing mental model ("a 0.7 score should mean ~70% chance of finishing").  
     - **Key hook:**  
       - *"We all agree a well-calibrated model is trustworthy. But what if I told you calibration might force unfair error rates?"*  
     - **Define calibration:**  
       - Show simple examples (e.g., "Among 100 people scored 0.7, ~70 finish").  
       - Emphasize: **Calibration must hold *within each group*.**  

  2. **Introduce Base Rates** (3 min)  
     - **Dependency:** Calibration must be understood before base rates.  
     - **Define base rate:** "True probability of finishing *if admitted*."  
     - **Critical point:** Base rates often differ between groups (e.g., due to systemic barriers). **Example:**  
       - Group A (referral: "Online"): Base rate = 60%  
       - Group B (referral: "Community Center"): Base rate = 40%  

  3. **Define Error Rates** (2 min)  
     - **False Positive Rate (FPR):** % of non-finishers incorrectly admitted.  
     - **False Negative Rate (FNR):** % of finishers incorrectly rejected.  
     - **Goal:** Equal FPR/FNR across groups.  

  ---

  #### **The Core Example** (15 minutes)  
  **Why this example?**  
  - **Avoids sensitive attributes:** Use "referral channel" (Online vs. Community Center) instead of race/gender.  
  - **Stakes are positive:** Focuses on access to a benefit (training), not punishment.  
  - **Small numbers:** Easy mental math.  
  - **Uses our model context:** Job-training program.  

  **The Scenario**  
  - **Group A (Online):** 100 applicants, base rate = 60% → 60 would finish if admitted.  
  - **Group B (Community Center):** 100 applicants, base rate = 40% → 40 would finish if admitted.  
  - **Model:** Perfectly calibrated within each group.  
  - **Threshold:** Admit if score ≥ 0.5.  

  **Step 1: Calibration in Action**  
  - **Group A (Online):**  
    - 50 applicants scored ≥ 0.5 → Since calibrated, 50% *should* be non-finishers.  
    → 25 finishers, 25 non-finishers admitted.  
  - **Group B (Community Center):**  
    - 50 applicants scored ≥ 0.5 → 50% non-finishers.  
    → 25 finishers, 25 non-finishers admitted.  

  **Step 2: Calculate Error Rates**  
  - **False Positive Rate (FPR):**  
    - Group A: Non-finishers = 40 total. FPR = 25 false positives / 40 non-finishers = **62.5%**.  
    - Group B: Non-finishers = 60 total. FPR = 25 false positives / 60 non-finishers = **41.7%**.  
    → **FPR not equal!**  
  - **False Negative Rate (FNR):**  
    - Group A: Finishers = 60 total. FNR = (60 - 25) false negatives / 60 finishers = **58.3%**.  
    - Group B: Finishers = 40 total. FNR = (40 - 25) false negatives / 40 finishers = **37.5%**.  
    → **FNR not equal!**  

  **Step 3: The Tradeoff Revealed**  
  - *"Even with perfect calibration, error rates *must* differ when base rates differ. The only way to avoid this is if base rates are equal OR the model is perfect (0% error)."*  

  ---

  #### **Handling Selective Labels** (5 minutes)  
  **Where to place it:** **After** the core example.  
  **Why?** The theorem is foundational; selective labels are a practical complication.  

  **How to present:**  
  - *"In our real-world data, we only observe outcomes for admitted applicants. This means our 'base rates' are skewed by past admission policies."*  
  - **Key implication:**  
    - Our historical data **understates true base rate differences** (if past policies excluded high-risk groups).  
    - *"This doesn't invalidate the theorem—it makes achieving fairness harder. We can't trust observed base rates."*  

  ---

  #### **Misconceptions & How to Debunk Them**  
  Address these **in order** as they naturally arise:  

  | Misconception | When to Address | How to Debunk |
  |---------------|-----------------|--------------|
  | **"Delete the group column = fairness."** | After core example | *"Without group data, we can't measure calibration by group. Proxies (e.g., zip code) may cause hidden bias."* |
  | **"This is just accuracy vs. fairness."** | When defining error rates | *"No—both calibration and error rate parity are *fairness* goals. We're trading two types of fairness."* |
  | **"Approximate fairness is fine."** | After FPR/FNR calculation | *"Small base rate differences cause small imbalances, but large differences (like 40% vs. 60%) create glaring gaps. Would we accept 62.5% vs. 41.7% FPR?"* |
  | **"Equalize scores to fix past bias."** | When discussing selective labels | *"Artificially equalizing scores breaks calibration. A score of 0.7 must mean 70% chance of finishing—otherwise, we lose model integrity."* |
  | **"Randomize at the threshold."** | During Q&A | *"Randomization reduces disparities, but doesn't solve the core tradeoff: calibrated scores *require* unequal error rates if base rates differ."* |
  | **The one you missed:** <br> **"We need better features."** | When discussing selective labels | *"Better features improve accuracy but don't resolve the tradeoff. Even with perfect features, unequal base rates force a choice between calibration and error rate parity."* |

  ---

  #### **What to Refuse to Discuss**  
  State upfront:  
  - *"We won’t dive into the mathematical proof, causal inference, or philosophy today. Why? Our goal is to grasp the tradeoff, not prove it from scratch or debate morality."*  
  - **Explicitly exclude:**  
    1. The general proof (we’re using concrete examples).  
    2. Whether base rate differences are "caused by discrimination" (focus on *existence*).  
    3. Which criterion is "right" (that’s a policy decision).  

  ---

  #### **How to Test Understanding** (5 minutes)  
  **Don’t ask:** *"Does everyone get it?"*  
  **Do this:**  
  - **Hand out a scenario:**  
    - *"Group A and B now have the same base rate (50%). We have perfect calibration. Can we achieve equal FPR/FNR?"*  
  - **Ask them to discuss in pairs (2 min), then share.**  
    - **Correct answer:** *Yes.* With equal base rates, calibration implies equal error rates.  
  - **Why it works:** Tests if they grasp the theorem’s conditions (base rate difference is key).  

  ---

  #### **Handling the Final Question: "Which Criterion Should We Ship?"**  
  **Set this up during the tradeoff discussion:**  
  1. **Map implications:**  
     - *"Prioritizing calibration: Scores are interpretable, but Group B faces higher FPR (more non-finishers admitted)."*  
     - *"Prioritizing error rate parity: Equal mistakes, but a score of 0.7 means different things for Group A vs. B."*  
  2. **Ownership transfer:**  
     - *"This isn’t an engineering decision. It depends on our program's goals: Should we optimize for trust in scores (calibration) or equitable impact (error rates)?"*  
     - *"Next step: I’ll draft a 1-pager for the product/policy team laying out tradeoffs. They’ll own the choice."*  

  ---

  ### **Session Flow & Timing**  
  - **0-10 min:** Calibration → Base Rates → Error Rates.  
  - **10-25 min:** Core example (walk through numbers).  
  - **25-30 min:** Selective labels + misconceptions.  
  - **30-40 min:** Test understanding (scenario activity).  
  - **40-45 min:** Q&A → Transition to ownership ("We’ll escalate to product").  

  ### **Why This Works for Your Room**  
  - **Engineers trust concrete numbers:** The example avoids abstraction.  
  - **Neutral groups:** "Referral channel" sidesteps culture-war triggers.  
  - **Preempts recidivism debate:** *"We’ve all heard of similar debates in criminal justice—today, we focus on our problem."*  
  - **Model-builders feel respected:** Frame as *"This is a systems problem, not a model flaw."*  

  **Final Tip:** If someone mentions recidivism early, acknowledge it briefly: *"Yes, this tradeoff appears in many domains. Let’s see how it plays out in ours."* → Pivot to the example.
