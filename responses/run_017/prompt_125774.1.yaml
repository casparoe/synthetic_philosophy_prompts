prompt: |-
  hey — so I'm taking a practical rationality seminar this term and there's a pattern I keep noticing that I can't find a name for, and it's starting to annoy me because it feels like it should already have one. We went over Parfit's hitchhiker last week, so I know that case, but what I'm after seems like a bigger family and the hitchhiker is only one member of it.

  The pattern is: traits that pay off *only because* you can't switch them off at the moment they cost you.

  Three instances I've actually seen:

  1. My roommate is basically incapable of not paying people back — small amounts, people who'd never chase him for it, times when he's completely broke. Because of it people trust him with money, with keys, with their laptops, and he gets offered a lot of stuff. But if he could decide case by case whether to be like that, he'd obviously turn it off in half those cases, and I think the whole thing would evaporate — people seem to be picking up somehow on the fact that it isn't a decision for him.

  2. Me and running. If I skip a scheduled run I feel genuinely awful for the rest of the day, guilt-awful, not just "oh well". It works way better than any app or stake I've tried, and those failed precisely because I could switch them off or just ignore them. Nobody is watching in this case, it's totally private, and I'd still rather have the guilt than not have it.

  3. A guy I work shifts with at a coffee place gives refunds no questions asked, including to people who are obviously scamming him, and he's visibly hacked off about it every single time. The regulars all know, and the place does much better than the chain two doors down.

  Conditions as I'd tentatively list them: (a) the trait makes you do something that on that occasion is against your own interests and that you'd rather not do; (b) it's not under voluntary control at the moment — and that's load bearing, not incidental; (c) it pays off across many occasions, and only if it's strong enough to win in each individual one, so being "a bit" like this is worth nothing; (d) the payoff normally runs through other people being able to rely on you — except in case 2, where it doesn't.

  Is there an established concept this is an instance of? A friend says it's just costly signalling / the handicap principle, but case 2 has no audience at all, and in signalling the agent *chooses* to send the signal whereas here the point is that you can't choose at the moment. Someone else said "commitment device", but that's something you install on purpose and it works by messing with your options or your payoffs; this doesn't touch either. It isn't akrasia (that's a failure with no upside) and it isn't "rational irrationality" as I've seen it used, which is about holding false beliefs because being wrong is cheap — being disposed like this is expensive, that's the whole trick.

  If there's no name for it, I want one, plus a definition and boundary cases: is an ordinary habit (brushing your teeth without deciding to) an instance? An addiction? A rigid principle you could in principle revise but won't? And is it part of the same thing or a separate thing that these traits seem to matter less where an institution does the job — like if everyone had a public reliability score, my roommate's disposition would be worth a lot less. Please don't just hand me a label: I want the nearest established concepts, exactly how each one misses, and where you'd draw the edges.
reasoning: |-
  Okay, the user is in a practical rationality seminar and has identified a pattern they want to name. Let me start by understanding the pattern they described. The key points are traits that pay off only because they can't be switched off when they cost you. The examples are the roommate who always pays back, the user's running guilt, and the coworker who gives refunds no questions asked.

  First, I need to recall relevant concepts from rationality, game theory, and philosophy. Parfit's Hitchhiker comes to mind—it's a scenario where pre-committing to a behavior ensures a better outcome. But the user says this is a broader pattern. They mentioned costly signaling and commitment devices, but those don't fit perfectly. Costly signaling requires an audience and voluntary action, but the running example has no audience. Commitment devices are intentional, whereas these traits are not under voluntary control at the moment.

  Breaking down the user's conditions: (a) the trait causes actions against self-interest in the moment; (b) involuntary at the time; (c) only pays off if it always wins; (d) payoff often through others' reliance. The running example is tricky because the payoff is personal, not social. So the core is the compulsory nature and the cross-temporal benefits.

  Existing concepts that come to mind: Schelling's idea of self-command, where you bind yourself to overcome temptation. But intentionality is a problem here. Biological preparedness and inflexible heuristics in evolutionary psychology might apply—behaviors that are hardwired because flexibility would undermine their effectiveness. Hyperbolic discounting and akrasia are related to self-control but focus on failure, whereas this pattern has a strategic upside.

  The user needs the closest established terms and why they don't fit. Commitment strategies are intentional, but these traits might develop without conscious design. Costly signaling requires signaling to others, which the running example lacks. Precommitment involves deliberate setup, whereas the roommate's behavior might be innate or habitual.

  The user might also want to understand boundary cases: habits, addictions, rigid principles. For example, brushing teeth as a habit is automatic but doesn't have the cross-temporal payoff. Addiction has costs but lacks the strategic benefit. Rigid principles could fit if they're inflexible and provide reliability.

  Another angle is the institutional aspect. The user mentioned that if there were reliability scores, the roommate's trait would be less valuable. This ties into how external systems can replace the need for such traits, highlighting that these traits thrive where information asymmetry exists and trust is crucial.

  The user's deeper need might be to formalize this concept for academic work, possibly to contribute to the seminar or literature. They want precise definitions and boundaries to avoid misclassification. They might also be interested in the evolutionary or psychological mechanisms behind such traits.

  I should synthesize a new term. "Compulsory advantage" emphasizes the involuntary aspect and the benefit. "Cross-temporal trait rigidity" highlights the inflexibility over time. "Robustness through compulsivity" focuses on the strength from being unchanging.

  The user needs clarity on why existing terms fall short and a coherent framework to place this concept within practical rationality. Ensuring that the term captures both social and personal examples, emphasizing the necessity of the trait's uncontrollability at the moment of action for its overall payoff.
answer: |-
  This is an excellent observation – you've pinpointed a fascinating and strategically crucial pattern that sits at the intersection of rationality, game theory, evolutionary psychology, and self-management. You're right that it's distinct from the concepts you listed, though related. It doesn't have a single, universally accepted name, but let's break it down and find the closest fits, see where they miss, and define the edges.

  **Core Pattern:** A behavioral disposition or trait that:
  1.  **Incurs Immediate Costs:** Forces an action that, *in the specific instance*, appears against the agent's self-interest and is undesirable at that moment.
  2.  **Is Compulsory at T1:** Is *not* under direct, moment-to-moment voluntary control when the triggering situation arises. This inflexibility is *essential* to its function, not accidental.
  3.  **Yields Long-Term Benefits:** Provides significant benefits *across multiple interactions or over time*.
  4.  **Requires Invariance:** Only provides these benefits *if it reliably wins in every applicable instance*. Partial or probabilistic adherence often destroys the value ("a bit like this is worth nothing").
  5.  **Benefit Mechanism:** Benefits often arise from *signaling reliability* to others (enabling cooperation/trust), but can also arise from *internal self-management* (overcoming short-term temptation for long-term goals).

  **Your Cases Revisited:**
  1.  **Roommate (Trust):** Costs: Paying back when broke/pointless. Compulsory: "Incapable of not paying." Benefit: Earns exceptional trust (loans, keys, laptops, opportunities). Mechanism: Signaling reliability to others. Requires invariance: If he skipped even once strategically, the signal crumbles.
  2.  **Running (Self-Management):** Costs: Suffering guilt when skipping. Compulsory: The guilt is automatic/powerful ("feel genuinely awful"). Benefit: Consistent running habit. Mechanism: Internal self-enforcement (overcoming akrasia via negative reinforcement). Requires invariance: The guilt *must* reliably punish skipping to maintain the habit; weak guilt would fail.
  3.  **Coworker (Reputation):** Costs: Giving refunds to scammers, feeling "hacked off." Compulsory: "Gives refunds no questions asked" – policy overrides desire. Benefit: Strong reputation, better business than competitor. Mechanism: Signaling fairness/reliability to customers. Requires invariance: Denying one obvious scammer could destroy the "no questions asked" reputation.

  **Established Concepts & Why They Miss:**

  1.  **Costly Signalling / Handicap Principle:**
      *   **What it is:** Investing in a costly or risky signal to credibly convey an unobservable quality (e.g., peacock's tail = good genes).
      *   **Why it misses:** While your examples *are* costly signals, the core concept focuses on the *cost* proving quality. It doesn't inherently require the *compulsory, non-voluntary nature at the moment of action*. A peacock *could* theoretically choose not to grow the tail (if it magically could), but the tail itself isn't "compulsory behavior" moment-to-moment. Crucially, **costly signalling requires an audience.** It fails for Case 2 (Running) where there is no signal receiver.
      *   **Overlap:** Your roommate and coworker cases *are* costly signals *enabled by* the compulsory trait. The compulsory nature *is what makes the signal credible and costly*.

  2.  **Commitment Device:**
      *   **What it is:** A *deliberately chosen* mechanism (external or internal) that restricts future options or alters future payoffs to overcome time-inconsistency (e.g., Ulysses tying himself to the mast, saving in an illiquid account).
      *   **Why it misses:** The key difference is **intentionality and mechanism**. Commitment devices are *consciously set up in advance* precisely *to* remove choice later. Your examples focus on a *pre-existing disposition/trait* that *happens to function like* a commitment device *because* it's compulsive. The agent may not have chosen to *be* this way. Case 2 (guilt) is closest – it's an internal commitment device – but the guilt isn't necessarily *installed* on purpose; it might be a personality quirk or learned association. Commitment devices work by manipulating *options* or *payoffs*; your examples work through a *compulsion to act* despite conflicting desires.

  3.  **Precommitment (Schelling):**
      *   **What it is:** A specific type of commitment device where you strategically restrict your own future freedom of choice to gain an advantage, often in bargaining or cooperation (e.g., burning your ships).
      *   **Why it misses:** Similar to commitment devices – emphasizes *strategic, deliberate choice* to bind oneself. Your pattern describes a *state* or *trait* that *has the effect* of binding, regardless of original intent. It's the *result* (inflexibility) that matters, not necessarily the *means* (deliberate restriction).

  4.  **Parfit's Hitchhiker:**
      *   **What it is:** A specific paradox where it's rational to *intend* to pay later to get rescued *now*, but irrational to *actually pay* later once rescued. A commitment device (like a reputation for honesty) can solve it.
      *   **Why it misses:** It's a single, illustrative *instance* of the problem (time-inconsistency) that commitment devices solve. Your pattern describes the *enduring trait/disposition* (the reputation for honesty, the compulsive guilt) that *functions* as the solution across many instances. Hitchhiker is one scenario where such a trait would be beneficial.

  5.  **Rational Irrationality:**
      *   **What it is:** Holding irrational beliefs because the cost of being wrong is low, while the belief provides psychological benefits (e.g., ideological beliefs).
      *   **Why it misses:** This is about *beliefs*, not *behavioral dispositions*. It emphasizes "cheap" falsehoods, whereas your pattern involves *costly* actions. The mechanism is different.

  6.  **Akrasia (Weakness of Will):**
      *   **What it is:** Acting against one's better judgment due to a failure of self-control (e.g., eating cake while dieting).
      *   **Why it misses:** Akrasia is a *failure* state with negative consequences. Your pattern describes a *functional inflexibility* that *overcomes* akrasia (Case 2) or prevents it in social contexts (Cases 1 & 3) by making the "better judgment" (long-term benefit) the *only* option via compulsion. It turns potential akrasia into impossible akrasia for specific actions.

  **Closest Fits & Synthesizing a Term:**

  *   **"Biological Preparedness" / "Inflexible Heuristics" (Evolutionary Psych):** Evolution often hardwires inflexible responses because flexibility would be exploited or lead to worse outcomes (e.g., disgust preventing pathogen exposure, even when irrational). This captures the *compulsory, invariant* nature well. **Miss:** Doesn't easily cover learned/internal self-management like Case 2, or the conscious understanding of the benefit. More focused on innate biology.
  *   **"Self-Command" (Schelling-esque):** Schelling discussed the ability to bind oneself. A *trait* of self-command could manifest as the compulsions you describe. **Miss:** "Self-command" often implies successful *volition*, not compulsion. It's more about the *capacity* than the specific *mechanism* of inflexibility.
  *   **"Robust Strategy" / "Invariant Strategy" (Game Theory):** Strategies like "Tit-for-Tat" in Iterated Prisoner's Dilemma are powerful *because* they are simple, predictable, and retaliatory – inflexibility is key to deterring exploitation. **Miss:** Primarily framed for interactions between agents, less so for internal self-management. Focuses on the strategic rule, not necessarily the *psychological compulsion* enforcing it.

  **Proposed Term & Definition:**

  Given the gaps in existing terminology, a new synthetic term is justified. I propose:

  **Compulsory Advantage (or Compulsory Benefit Trait):**

  *   **Definition:** A behavioral disposition, psychological trait, or ingrained rule that reliably produces actions contrary to the agent's immediate self-interest in specific situations, *because* it is not subject to direct voluntary control at the moment of action, thereby generating significant long-term benefits that depend critically on its invariant application.
  *   **Key Elements:** Compulsion, Immediate Cost, Invariance, Long-Term Benefit.
  *   **Mechanism Agnostic:** Can be innate, deeply learned, consciously adopted as a principle knowing it will become compulsive, or an emergent property of personality.

  **Drawing the Edges: Boundary Cases**

  1.  **Ordinary Habit (Brushing Teeth):**
      *   **Is it Compulsory Advantage?** **Usually No.** While automatic and beneficial, brushing teeth rarely involves a *significant immediate cost against self-interest* that you'd actively want to avoid *in the moment*. You might be lazy, but skipping doesn't usually impose a strong negative feeling *guilt equivalent to skipping a run*, nor does skipping *once* destroy a valuable reputation. It's beneficial automation, but lacks the crucial elements of *costly compulsion* and *invariance being load-bearing* for a major benefit.
  2.  **Addiction:**
      *   **Is it Compulsory Advantage?** **Generally No, but...** Addiction involves powerful compulsion and immediate cost (using despite harmful consequences). However, it typically *lacks* the **long-term benefit** and critically, **destroys value** rather than creating it. The compulsion isn't strategically advantageous. *Exception:* If an addiction somehow functioned like your examples (e.g., a compulsion to work that guarantees career success despite misery, where *any* lapse would destroy the reputation), it *could* fit, but this is pathological and rare. Normally, addiction is pure cost.
  3.  **Rigid Principle (Could Revise, Won't):**
      *   **Is it Compulsory Advantage?** **Often Yes.** This is a core instance! The principle feels "non-negotiable" *in the moment* ("I *must* pay them back", "I *must* give the refund", "I *must* run or feel awful"). The agent *could* theoretically revise the principle later, but in the specific situation, the principle dictates action compulsively. The rigidity *is* the source of the long-term benefit (trust, reputation, fitness). This captures the "voluntary at T0 (adopting the principle), involuntary at T1 (acting on it)" aspect.
  4.  **Phobia/Irrational Fear:**
      *   **Is it Compulsory Advantage?** **Usually No.** While compulsive and costly (avoidance), the benefit (avoiding perceived threat) is usually illusory or disproportionate. It lacks the *strategic, long-term benefit* derived from *reliable signaling* or *effective self-management*. It's maladaptive inflexibility.
  5.  **Institutional Replacement (Reliability Score):**
      *   **Impact:** You're absolutely right. Formal institutions (scores, contracts, courts) *reduce the value* of individual Compulsory Advantage traits *for generating trust/reliability signals*. Why rely on inferring someone's compulsive honesty if you can see their credit score? However:
      *   **Internal Self-Management Persists:** Compulsions like your running guilt remain valuable where institutions can't enforce (private habits).
      *   **Shifts Form:** Compulsory Advantage might manifest as inflexible adherence to *institutional rules* (e.g., a compulsive rule-follower in a bureaucracy, even when bending rules seems beneficial short-term, because their reputation for rigidity is valuable).
      *   **Doesn't Eliminate:** Even with scores, subtle forms might persist – e.g., a compulsive aversion to *any* mark on the score, even when rational calculation might suggest accepting a minor ding is optimal.

  **Conclusion:**

  You've identified **Compulsory Advantage** – a powerful pattern where strategic inflexibility, enforced by compulsion, unlocks significant benefits precisely *because* it overrides short-term temptations in a reliably invariant way. It's distinct from costly signaling (requires audience/choice), commitment devices (requires deliberate setup), and akrasia (is a failure, not a solution). It explains why traits that seem irrational moment-to-moment can be profoundly rational overall, and why "being a little bit reliable" often fails where "being compulsively reliable" succeeds. This concept deserves a place in practical rationality discussions. Great catch!
