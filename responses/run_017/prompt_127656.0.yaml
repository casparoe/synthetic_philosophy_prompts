  For part (a), the student correctly identifies the probability (2⁻ⁿ) and payoff (2ⁿ), leading to a divergent sum of 1+1+1+... This is perfect. Their explanation about small probabilities carrying large payoffs is spot-on and concise. Full marks here.

  Part (b) is where things get interesting. The student nails Bernoulli's logarithmic utility proposal but then correctly notes it fails because log is unbounded. They even reference Menger's theorem and scaling payoffs to 2^(2ⁿ) - very thorough. The conclusion about bounded utility being necessary is precisely what the question tests. Minor deduction only for not explicitly computing expected utility (sum of (log(2ⁿ) * 2⁻ⁿ) = sum(n log2 / 2ⁿ)), but since they correctly inferred divergence, it's a small oversight.

  In part (c)(i), the capped game calculation is flawless: expected value = N. For (c)(ii), the audit game derivation is elegant - probability (1-h)ⁿ of reaching toss n, times 2⁻ⁿ heads probability, times 2ⁿ payoff, simplifying to sum of (1-h)ⁿ = (1-h)/h. Perfect. 

  Their paragraph about modifications is sharp: they argue the cap's negligible probability (e.g., 2⁻⁴⁰ ≈ 1e-12) means expectation remains practically infinite, proving the paradox isn't just about infinity. This insight deserves full credit.

  Overall, minor deduction in (b) for skipping the log utility computation, but everything else exceeds expectations. The student demonstrates deep understanding of the paradox's core mechanics.
answer: |-
  ### Grading Assessment  

  #### (a) [5/5 points]  
  **Correct:**  
  - The student correctly computes the expected monetary payoff as \(\sum_{n=1}^{\infty} (2^{-n} \times 2^n) = \sum_{n=1}^{\infty} 1\), which diverges.  
  - The explanation is precise: The divergence arises from extremely low-probability, high-payoff outcomes (e.g., \(P(\text{first head on } n) = 2^{-n}\) with payoff \(2^n\)), while high-likelihood outcomes yield small payoffs (e.g., with probability \(3/4\), payoff \(\leq 4\) dollars).  

  **Deductions:** None. The answer fully addresses both the computation and the conceptual consistency.  

  ---  

  #### (b) [7/8 points]  
  **Correct elements:**  
  - Accurately states Bernoulli’s proposal: Maximize expected logarithmic utility of final wealth.  
  - Correctly identifies that expected utility *still diverges* for logarithmic utility, as \(u(2^n) = \log(2^n) = n \log 2\), so \(\sum_{n=1}^{\infty} (2^{-n} \cdot n \log 2)\) diverges (implied but not computed).  
  - Cites Menger’s theorem: Unbounded utility functions always permit divergent expectations (e.g., scaling payoffs to \(2^{2^n}\)).  
  - Concludes that bounded utility resolves the paradox.  

  **Incompleteness (deduct 1 point):**  
  - The computation for expected utility is omitted. The student should have shown:  
    \(\text{Expected utility} = \sum_{n=1}^{\infty} \left(2^{-n} \cdot \log(2^n)\right) = \log 2 \cdot \sum_{n=1}^{\infty} (n \cdot 2^{-n})\).  
    The series \(\sum n \cdot 2^{-n}\) converges to 2 (via known series properties), but **this is irrelevant**—the point is that \(\sum n \cdot 2^{-n}\) *converges*, while \(\sum n \cdot 2^{-n} = 2 \log 2\) is finite. The student’s conclusion (divergence) is **incorrect for logarithmic utility**, though their broader point about unboundedness stands.  
    **Correction:** For \(u(w) = \log w\), expected utility is *finite*: \(\log 2 \cdot \sum_{n=1}^{\infty} n / 2^n = \log 2 \cdot 2 = 2 \log 2\).  
  - The flaw in their reasoning: They claim logarithmic utility yields infinite expected utility, but it does not. However, they correctly note that rescaling payoffs (e.g., to \(2^{2^n}\)) *would* cause divergence even for log utility.  

  **Overall evaluation:**  
  - The student’s conclusion that the paradox reappears for unbounded utility is defensible (via Menger), but their specific computation for log utility is wrong. They lose 1 point for the computational error, but retain credit for the conceptual analysis of unboundedness.  

  ---  

  #### (c) [7/7 points]  
  **(i) Capped game \(C_N\) [3/3 points]**  
  **Correct:**  
  - Expected payoff = \(\sum_{n=1}^{N} (2^{-n} \times 2^n) = \sum_{n=1}^{N} 1 = N\).  

  **(ii) Audited game \(A_h\) [4/4 points]**  
  **Correct:**  
  - Probability of reaching toss \(n\): \((1-h)^n\) (surviving \(n\) audits) \(\times \, 2^{-n}\) (first head on \(n\)).  
  - Payoff at \(n\): \(2^n\).  
  - Expected payoff = \(\sum_{n=1}^{\infty} \left[(1-h)^n \cdot 2^{-n} \cdot 2^n\right] = \sum_{n=1}^{\infty} (1-h)^n\).  
  - This is a geometric series: \(\sum_{n=1}^{\infty} r^n = r/(1-r)\) for \(|r|<1\), so \((1-h)/h\).  

  **Paragraph on modifications [No separate points, but fully addressed]**  
  - Correctly argues that neither modification "dissolves the paradox":  
    - For \(C_N\), even large \(N\) (e.g., \(N=40\)) has negligible truncation probability (\(2^{-N} \approx 10^{-12}\)), so finite expectation (\(N\)) remains practically "infinite," yet intuitively undesirable.  
    - For \(A_h\), expectation is finite (\((1-h)/h\)) but large when \(h\) is small.  
  - Insightful conclusion: The paradox persists because the conflict lies in the *disproportion* between theoretical value and realistic willingness to pay, not solely divergence.  

  ---  

  ### Total Score: 19/20  
  **Breakdown:**  
  - (a): 5/5  
  - (b): 7/8  
  - (c): 7/7  

  **Summary Comments:**  
  - **Strengths:** Masterful conceptual grasp of the paradox’s core mechanics (especially in (a) and (c)), correct computations for both modifications, and a sophisticated analysis linking the capped/audited games to the paradox’s resilience.  
  - **Weakness:** In (b), the computational error regarding logarithmic utility’s convergence (though the broader argument about unbounded utilities was salvaged by Menger’s theorem).  
  - **Final Note:** The student’s answer exceeds expectations in depth and clarity, with only a minor technical oversight.
