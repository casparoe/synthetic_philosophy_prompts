  The user teaches a lottery model variant where:
  - There might be zero or one exam
  - Surprise is defined probabilistically (credence ≤ t)
  - Students know the exact selection distribution
  - Part (a) should ask for feasible t-values and optimal exam probability
  - Part (b) should discuss philosophical implications

  Key constraints from the user:
  - Must be self-contained (no citations)
  - Doable in 45 minutes
  - Must catch common errors in marking scheme
  - Model answer must explicitly handle:
    - Certainty case (probability 1 exam → only vacuous surprise possible)
    - Role of (A3) in fixing the distribution

  For part (a):
  I recall the recursive solution for surprise probabilities. Let p_k be the maximum exam probability achievable from day k onward. The constraint requires:
  p_k ≤ t * (1 - cumulative probability of exams before k)

  This gives p_k ≤ t * (1 - ∑_{i<k} p_i) with base case p_1 ≤ t
  The recursion solves to p_k = t(1-t)^{k-1}
  Total exam probability is 1 - (1-t)^N
  Attained by geometric distribution: P(exam on day k) = t(1-t)^{k-1}, P(no exam) = (1-t)^N

  For part (b) philosophy:
  - Certainty requirement (P(exam)=1) forces (1-t)^N=0 → only possible if t=1 (vacuous surprise)
  - Thus classical paradox appears when we add certainty
  - (A3) matters because without known distribution, surprise could be maintained through uncertainty about the policy itself

  Common errors to flag in marking:
  - Assuming exactly one exam (when zero is allowed)
  - Uniform prior assumption
  - Incorrect probability bounds (e.g., linear in N)
  - Forgetting no-exam probability in denominators
  - Conflating credence bound with impossibility of knowledge

  Marking scheme should reward:
  - Correct recursive formulation
  - Closed-form solution
  - Extremal policy construction
  - Clear analysis of certainty case
  - Insight about (A3)'s role

  Model answer needs to demonstrate:
  - Technical solution with geometric distribution
  - Explanation why classical case fails only when exam is certain
  - Distinction between probabilistic surprise and knowledge
  - How (A3) fixes the epistemic context
answer: |-
  ### Exam Question: Surprise Exam Paradox Variant  
  **Time Allowed:** 45 minutes  
  **Total Marks:** 20  

  #### Background  
  A teacher announces the following policy at the start of a term with \(N\) teaching days:  
  - **(A1)** At most one exam will occur: it takes place on one of the \(N\) days or not at all.  
  - **(A2)** On the morning of any day, if no exam has occurred yet, a student who accepts (A1)–(A3), recalls past days without exams, and conditionalizes correctly must assign probability \(\leq t\) to an exam occurring *that day*.  
  - **(A3)** The student knows the teacher’s selection procedure (i.e., the joint probability distribution over days \(1,\dots,N\) and "no exam").  

  A policy is **\(t\)-surprising** if it satisfies (A2) for every day on which an exam could occur.  

  #### Part (a) (12 marks)  
  1. For which thresholds \(t \in [0,1]\) does a \(t\)-surprising policy exist?  
  2. For such \(t\), what is the maximum probability with which such a policy can schedule an exam? Express this probability as a function of \(t\) and \(N\).  
  3. Give an explicit probability distribution (i.e., selection procedure) that achieves this maximum.  

  #### Part (b) (8 marks)  
  Does this "lottery model" resolve the classical surprise exam paradox, or does it merely relocate the issue? Defend your position by addressing:  
  - What happens if the teacher must schedule an exam with probability 1?  
  - Whether a morning credence \(\leq t\) truly captures "surprise."  
  - The role of (A3) in defining the paradox.  

  **Instructions:**  
  - No citations are needed. Use only the information provided.  
  - Show all reasoning. Correct answers without justification may receive minimal credit.  

  ---

  ### Model Answer (≈700 words)  

  #### Part (a)  
  A \(t\)-surprising policy exists if and only if \(t \in [0,1]\). The maximum probability of scheduling an exam is \(1 - (1 - t)^N\), achieved by the following distribution:  
  - \(P(\text{exam on day } k) = t(1 - t)^{k-1}\) for \(k = 1, \dots, N\),  
  - \(P(\text{no exam}) = (1 - t)^N\).  

  **Justification:**  
  For a policy to be \(t\)-surprising, (A2) requires that on each morning \(k\), conditional on no prior exam, the student’s credence of an exam on day \(k\) is \(\leq t\). By (A3), the student knows the distribution, so this credence equals the conditional probability:  
  \[
  P(\text{exam on } k \mid \text{no exam before } k) = \frac{P(\text{exam on } k)}{P(\text{no exam before } k)} \leq t.
  \]  
  Let \(q_k = P(\text{exam on } k)\). Then \(P(\text{no exam before } k) = 1 - \sum_{i=1}^{k-1} q_i\). Thus:  
  \[
  \frac{q_k}{1 - \sum_{i=1}^{k-1} q_i} \leq t \quad \text{for all } k = 1, \dots, N. \tag{1}
  \]  
  Maximizing the exam probability \(P(\text{exam}) = \sum_{k=1}^N q_k\) requires saturating the inequalities (1) to equality. Define \(s_k = 1 - \sum_{i=1}^k q_i\) (the probability no exam occurs on or before day \(k\)). From (1):  
  \[
  q_k = t \left(1 - \sum_{i=1}^{k-1} q_i\right) = t s_{k-1}.
  \]  
  Since \(s_k = s_{k-1} - q_k = s_{k-1}(1 - t)\), and \(s_0 = 1\) (no exam before day 1), we recursively obtain:  
  \[
  s_k = (1 - t)^k, \quad q_k = t(1 - t)^{k-1}.
  \]  
  Thus, \(P(\text{exam}) = \sum_{k=1}^N q_k = t \sum_{k=0}^{N-1} (1 - t)^k = 1 - (1 - t)^N\).  
  The probability of no exam is \(s_N = (1 - t)^N\). This policy is \(t\)-surprising because:  
  \[
  P(\text{exam on } k \mid \text{no exam before } k) = \frac{q_k}{s_{k-1}} = \frac{t(1 - t)^{k-1}}{(1 - t)^{k-1}} = t.
  \]  

  #### Part (b)  
  The lottery model resolves the structural flaw in the classical paradox but relocates the surprise requirement to a probabilistic constraint, revealing that impossibility arises only when the exam is certain.  

  **Resolution vs. relocation:**  
  - The classical paradox assumes an exam *must* occur (\(P(\text{exam}) = 1\)) and demands absolute surprise (no day can be ruled out). Here, setting \(P(\text{exam}) = 1\) forces \((1 - t)^N = 0\), which requires \(t = 1\) (since \(t < 1\) implies \((1 - t)^N > 0\)). But \(t = 1\) means the student’s morning credence can be 1, violating surprise. Thus, the classical case is embedded as the limit \(P(\text{exam}) = 1\), where \(t\)-surprise is impossible unless \(t = 1\). The backward induction in the classical paradox is the degenerate terminal case of our recursion: when \(P(\text{exam}) = 1\), the final day’s conditional probability \(q_N / s_{N-1}\) becomes \(1 / 1 = 1\) if \(s_{N-1} > 0\), conflicting with \(t < 1\).  
  - By allowing \(P(\text{no exam}) > 0\), the model avoids contradiction: the exam might not happen, so the student cannot rule out any day. The "surprise" is probabilistic: a credence \(\leq t\) permits doubt but not certainty.  

  **Credence bound vs. surprise:**  
  - A credence \(\leq t\) is necessary but insufficient for genuine "surprise." If \(t = 0.5\), the student is unsurprised on average if exams occur frequently at credence \(0.5\). True surprise requires low credence *and* high stakes, but (A2) only enforces the former. However, (A3) mitigates this: since the student knows the distribution, they anticipate the geometric scheduling, so a morning credence of \(t\) is consistently unexpected.  

  **Role of (A3):**  
  - (A3) fixes the student’s priors, making surprise a property of the *procedure*, not the student’s beliefs. Without (A3), the teacher could exploit the student’s ignorance of the distribution to induce low credence (e.g., by making the policy itself ambiguous). Here, surprise is objective (a feature of the distribution), aligning with the classical paradox’s spirit.  

  **Conclusion:** The model dissolves the classical paradox by showing that its impossibility stems from requiring \(P(\text{exam}) = 1\), which forces \(t = 1\) and vacates surprise. By accepting probabilistic uncertainty, surprise becomes feasible but diluted.  

  ---

  ### Marking Scheme (Total: 20 marks)  
  **Part (a) (12 marks)**  
  - **Correct conditional probability for (A2)** (2 marks):  
    \(P(\text{exam on } k \mid \text{no exam before } k) = \frac{q_k}{1 - \sum_{i=1}^{k-1} q_i} \leq t\).  
  - **Recursive relation and solution** (4 marks):  
    Derive \(q_k = t(1 - t)^{k-1}\) via recursion on \(s_k = (1 - t)^k\) (or equivalent).  
  - **Maximum exam probability** (2 marks):  
    \(1 - (1 - t)^N\).  
  - **Explicit policy** (2 marks):  
    \(P(\text{exam on } k) = t(1 - t)^{k-1}\), \(P(\text{no exam}) = (1 - t)^N\).  
  - **Verification that policy satisfies (A2)** (2 marks):  
    Show conditional probability equals \(t\) for all \(k\).  

  **Part (b) (8 marks)**  
  - **Certainty case analysis** (3 marks):  
    Note \(P(\text{exam}) = 1 \implies (1 - t)^N = 0 \implies t = 1\), making surprise vacuous. Links to classical paradox.  
  - **Credence vs. surprise** (2 marks):  
    Distinguish low credence (necessary) from psychological surprise; note (A3) ensures objectivity.  
  - **Role of (A3)** (2 marks):  
    Without (A3), surprise could be manipulated via epistemic uncertainty; with (A3), it is distributional.  
  - **Overall position** (1 mark):  
    Clear claim (e.g., "resolves structurally but relocates to probability").  

  **Deductions for Errors (A = 17–20, B = 14–16, C = 10–13, D = 7–9)**  
  - **-3 marks:** Assuming exactly one exam (ignoring "no exam" possibility).  
  - **-2 marks:** Uniform prior assumption or neglecting recursion (e.g., linear bound \(N(1-t)\)).  
  - **-2 marks:** Conflating credence \(\leq t\) with "student cannot know."  
  - **-2 marks:** Forgetting \(P(\text{no exam})\) in denominators (e.g., on day \(N\)).  
  - **-2 marks:** Incorrect exam probability (e.g., \(1 - t\) or \(Nt\)).  
  - **-1 mark per part:** Missing explicit extremal policy or certainty analysis.  

  **Top Answers (A grade):** Correct recursion, closed-form probability, valid policy, and part (b) addressing all constraints.  
  **B Answers:** Minor errors (e.g., arithmetic in recursion) or partial part (b) (e.g., omitting (A3) role).  
  **C/D Answers:** Fundamental flaws (e.g., backward induction without probability, or misdefining surprise).
