  ### Decision Tree: Positions in the Adaptationism Debate

  **Design Philosophy**  
  The tree starts from the shared commitment that traits evolve. It branches on methodological, empirical, and conceptual questions about trait explanation, using concrete cases to illustrate nodes. The three core questions—etiological (origin), maintenance (current frequency), and design (current fitness contribution)—are embedded in the nodes. Maintenance-laundering (inferring origin from current utility) and the palimpsest problem (mismatch between origin and maintenance) appear in Nodes 2 and 5. The tree forces distinctions between adaptation judgments for the three questions (e.g., panda's thumb at Node 5). Traits are drawn from the list: peacock's train (sexual selection), panda's thumb (exaptation), human chin (byproduct), male nipples (neutral), redness of blood (physical byproduct), human navel (developmental byproduct), and feathers (exaptation). All seven are used, with feathers at Node 5 illustrating the palimpsest problem.

  **Key for Nodes**  
  - Each node is a question answerable without labels.  
  - Answers are binary (Yes/No) except Node 8 (multiple choice).  
  - Traits illustrate answers.  
  - 8 nodes → 10 leaves.  

  ---

  ### (1) Indented Tree (8 Nodes, 10 Leaves)

  1. **When you observe a trait with clear current utility, is that utility sufficient evidence to conclude it was originally shaped by natural selection?**  
     *(Maintenance-laundering: inferring origin from current utility)*  
     - *Illustration: Peacock's train (current utility: mate attraction).*  
     - **Yes**: Go to Leaf 1 (Panglossian).  
     - **No**: Go to Node 2.  

  2. **Should a trait's current function be explained only by its present fitness contribution, ignoring evolutionary history?**  
     *(Design question prioritized; etiological question declined)*  
     - *Illustration: Redness of blood (current function: oxygen transport; origin is physical constraint).*  
     - **Yes**: Go to Leaf 8 (Deflationary).  
     - **No**: Go to Node 3.  

  3. **Must an adaptive hypothesis be tested against a null (e.g., drift/constraint) using an optimality model before acceptance?**  
     *(Abstentionism: no verdict without explicit modeling)*  
     - *Illustration: Human chin (no consensus on function; null model: developmental constraint).*  
     - **Yes**: Go to Leaf 9 (Abstentionist).  
     - **No**: Go to Node 4.  

  4. **Do you default to assuming a trait is an adaptation until evidence contradicts it?**  
     *(Heuristic adaptationism: adaptation as starting point)*  
     - *Illustration: Feathers (assume flight adaptation first, then consider thermoregulation origin).*  
     - **Yes**: Go to Node 5.  
     - **No**: Go to Node 6.  

  5. **If a trait's current function differs from its origin, is it still an "adaptation"?**  
     *(Palimpsest problem: origin vs. current function mismatch; exaptation vs. spandrel distinction)*  
     - *Illustration: Panda's thumb (origin: wrist bone for locomotion; current function: bamboo manipulation; adaptation?)*  
     - **Yes**: Go to Leaf 6 (Exaptation-centred). *Distinction: Exaptations gain new functions; byproducts lack original function. Contested case settled: Feathers are exaptations (origin: thermoregulation; current: flight).*  
     - **No**: Go to Leaf 7 (Byproduct-or-spandrel). *Distinction: Byproducts/spandrels are side effects (e.g., human navel).*  

  6. **Are most traits in nature primarily explained by natural selection?**  
     *(Empirical claim about frequency)*  
     - *Illustration: Male nipples (non-functional; if rare, selection dominates; if common, not).*  
     - **Yes**: Go to Leaf 3 (Frequency/empirical adaptationist).  
     - **No**: Go to Node 7.  

  7. **Are non-adaptive traits best explained by developmental constraints?**  
     *(Constraint-first view)*  
     - *Illustration: Human chin (byproduct of jaw evolution; no current function).*  
     - **Yes**: Go to Leaf 5 (Constraint-or-structure-first).  
     - **No**: Go to Node 8.  

  8. **Are non-adaptive traits best explained by drift, or as side effects of other processes?**  
     - *Illustration: Human navel (developmental byproduct; no function).*  
     - **Drift or noise**: Go to Leaf 4 (Drift-and-noise-first).  
     - **Byproducts (spandrels)**: Go to Leaf 7 (Byproduct-or-spandrel). *Note: Already reached, but this path re-emphasizes the category.*  
     - **Multiple factors (no primary)**: Go to Leaf 10 (Pluralist).  

  **Leaves (10 Positions)**  
  - **Leaf 1: Panglossian**  
    *Most awkward commitment: Must deny cases like panda's thumb, where current utility (bamboo manipulation) does not explain origin (wrist bone).*  
  - **Leaf 2: Heuristic/methodological adaptationist** (from Node 5 "No")  
    *Most awkward commitment: Risks misallocating resources to adaptive hypotheses for traits like male nipples, which are developmental byproducts.*  
  - **Leaf 3: Frequency/empirical adaptationist** (from Node 6 "Yes")  
    *Most awkward commitment: Must explain away widespread non-adaptive traits (e.g., redness of blood) as rare exceptions.*  
  - **Leaf 4: Drift-and-noise-first** (from Node 8)  
    *Most awkward commitment: Attributes seemingly functional traits (e.g., subtle color variations) to noise, potentially ignoring selection.*  
  - **Leaf 5: Constraint-or-structure-first** (from Node 7 "Yes")  
    *Most awkward commitment: May overattribute traits (e.g., human chin) to constraints even when selection is plausible.*  
  - **Leaf 6: Exaptation-centred** (from Node 5 "Yes")  
    *Most awkward commitment: Treats co-opted traits (e.g., feathers for flight) as "adaptations" despite non-adaptive origins, blurring the etiological definition.*  
  - **Leaf 7: Byproduct-or-spandrel** (from Node 5 "No" or Node 8)  
    *Most awkward commitment: Must explain complex traits (e.g., panda's thumb) as side effects without invoking selection, which can seem contrived.*  
  - **Leaf 8: Deflationary** (from Node 2 "Yes")  
    *Most awkward commitment: Cannot explain vestigial traits (e.g., whale pelvis) that lack current function but have historical origins.*  
  - **Leaf 9: Abstentionist** (from Node 3 "Yes")  
    *Most awkward commitment: Demands optimality models for obvious adaptations (e.g., peacock's train), slowing inquiry.*  
  - **Leaf 10: Pluralist** (from Node 8)  
    *Most awkward commitment: Lacks clear criteria for prioritizing explanations, potentially leading to ad hoc storytelling. Note: This is the standard reading of Gould & Lewontin 1979. I believe this reading is largely correct, as they emphasize multiple factors (constraints, byproducts) but not to the exclusion of selection.*  

