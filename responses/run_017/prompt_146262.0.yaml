  ### Unoccupied Combinations (2 of 2)
  The tree generates 32 logically possible paths (8 binary nodes), but only 10 are occupied. Two unoccupied combinations:

  1. **Path: Node 1=No, Node 2=No, Node 3=No, Node 4=Yes, Node 5=–, Node 6=–, Node 7=–, Node 8=Multiple**  
     - *Diagnosis: Incoherent*. Combines heuristic adaptationism (Node 4=Yes) with pluralism (Node 8=Multiple). Heuristic adaptationism privileges selection as the default, while pluralism rejects default priorities. A heuristic user cannot consistently endorse "multiple factors" as primary without abandoning the heuristic.

  2. **Path: Node 1=No, Node 2=Yes, Node 3=Yes, ... (all else)**  
     - *Diagnosis: Abandoned*. Combines deflationism (Node 2=Yes) with abstentionism (Node 3=Yes). Deflationism rejects historical analysis, while abstentionism demands rigorous historical modeling. Early 20th-century biologists sometimes used deflationary language (e.g., "function as current role") but abandoned it when modern synthesis emphasized history. No contemporary position holds both.

  ---

  ### Indistinguishable Leaves and Required Separation
  - **Problem Pair**: Leaf 6 (Exaptation-centred) and Leaf 7 (Byproduct-or-spandrel) are not always separable.  
    - *Why?* Both answer Node 5 "No" to "Is it an adaptation if current function ≠ origin?" but diverge only in Node 5's prior answer. However, a trait like the panda's thumb could be classified as exaptation (Leaf 6) by some or byproduct (Leaf 7) by others, as its origin involves both selection (for wrist function) and constraint. The tree does not force a choice between "modified by selection" (exaptation) vs. "unmodified side effect" (byproduct).  
  - **Further Question Needed**: "If a trait's current function differs from its origin, was it modified by selection for the new function?"  
    - Yes → Exaptation-centred (Leaf 6).  
    - No → Byproduct-or-spandrel (Leaf 7).  
    - *Illustration: Panda's thumb*: If modified by selection for thumb-like use, it is an exaptation. If merely co-opted without modification, it is a byproduct.

