  Switching cases: Oscar moving between Earths. Burge’s arthritis example shows reference can shift without internal change. External factors override individual states. The pointer analogy handles this if the environment changes, causing the same address to point elsewhere. But the process doesn’t control the memory space, so external dependency remains.

  Disanalogies are crucial. The user suspects three issues. First, addresses as structural descriptions might sneak descriptivism in. But in computing, addresses aren’t descriptions; they’re fixed links. Causal chains in reference are similar—direct, not descriptive. So that disanalogy doesn’t hurt the argument.

