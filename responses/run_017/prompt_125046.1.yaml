answer: |-
  ### Where it breaks  
  Step (3) misapplies the Pareto criterion. The "everyone" in scope includes *merely possible* people who exist only in one outcome. For future people in the surviving world, existence under risk reduction isn't *better for them* than nonexistence under catastrophe—it's *different people entirely*. Claiming they "gain" assumes existence is a benefit *to them*, but this requires comparing existence to their nonexistence (a state with no subject). This is a "person-affecting" error: you can't say *specific* future people are better off under survival because those exact people don't exist in the catastrophe scenario. Only existing people (e.g., present generations) unambiguously gain (via reduced death risk). Future people’s "gains" are actually gains *of creating them*—a move that smuggles in totalist utilitarianism, violating (2)’s "no contested axiology" claim.  

  ### Why it looked fine  
  The argument exploits a framing illusion: treating future populations as fixed sets experiencing different outcomes. If future people were identical across choices (like fixed individuals facing different risks), (3) would hold. But in reality, different policies create different future people (via "time of birth" or "selection effects"). The scope clause in (1) masks this by defining "everyone" counterfactually, making it seem like future people *lose out* in catastrophe—but they don’t "lose"; they never exist. The astronomical stakes in (6) make this slippage easy to overlook.  

  ### What the alternatives cost  
  - **Abandon "safe" for future people**: Restrict Pareto to *currently existing* people. Then x-risk reduction benefits present people (lower death risk), but future welfare gains become axiology-dependent. Cost: (6) collapses; near-term work isn’t automatically dominated.  
  - **Embrace person-affecting constraints**: Only welfare changes for *actual* people count. Future people’s creation isn’t a Pareto gain. Cost: X-risk reduction’s strongest justification evaporates; you must defend creating future lives via other axioms (e.g., totalism).  
  - **Accept fanaticism**: Keep (6) but drop (2)’s "axiology-free" claim. Admit that astronomical stakes rely on utilitarian aggregation and no time discounting. Cost: Opens debates about utility functions, priority for the worst-off, etc.—losing (4)’s uncontroversial status.  
  - **Weaken transitivity**: Reject (5)’s insensitivity to magnitude. Small losses for some might outweigh vast gains for others. Cost: Invites contested interpersonal comparisons, undermining (2).  

  ### What survives  
  The core Pareto intuition for *present people* holds: reducing their extinction risk *is* a genuine Pareto improvement (they face lower mortality). Longtermism can still argue for x-risk reduction via:  
  1. **Prudential concern**: Existing people may value future generations instrumentally or intrinsically.  
  2. **Expected total welfare**: If one accepts impersonal aggregation (e.g., total utilitarianism), stakes remain vast.  
  3. **Avoiding guaranteed harm**: Extinction harms existing people by depriving them of potential futures.  
  But the "axiology-free" argument evaporates; population ethics is inescapable for future people.  

  ### Bottom line  
  The break is at step (3): treating *creating* future people as making *them* better off assumes a controversial impersonal view. No "safe" Pareto principle can simultaneously include merely possible people, avoid population ethics, and preserve transitivity. The argument’s strength for present people doesn’t extend to the future without contestable metaphysics.
