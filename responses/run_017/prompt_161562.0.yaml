prompt: |-
  I'm in a philosophy of mind seminar this term and we've been going through the extended mind stuff, and I started writing down our professor's verdicts case by case cos my flatmate swears she's just intuiting them one at a time while I think she's actually running a rule (we have a stupid bet going). Her verdicts so far: Inga remembering the museum address in her head — belief, nobody argues about that one. Otto with his notebook — yes, a genuine belief, not just him using a tool. The same information in a chip wired into his brain that he can't introspect — still yes, and she said if location made a difference the whole parity argument would be dead in the water. Long multiplication done on pen and paper — yes, extended cognitive process, she was weirdly firm about that. A notebook somebody planted in Otto's bag, full of false addresses, that he has never once opened — no, she said it's just paper in his bag. A woman with a body camera that silently backs up everything she sees to a cloud account whose password she's lost — no. Looking up a phone number by asking her phone out loud — yes, she called it Otto with better hardware.

  The case I actually want (my flatmate refuses to commit before the prof does, which is cheating honestly): Mira has pretty severe prosopagnosia and wears glasses that do face recognition and apear—sorry, print a name and two or three facts under whoever she's looking at. The labels just show up; she never asks for them and never consults anything; she has no idea how the recognition works and couldn't check it if she tried; and she never typed in or corrected any of the data, the company built the whole thing out of her old photo library. She also insists she doesn't trust it and will say out loud that the glasses think that's Dana — but she greets Dana by name, asks after her kid, gets annoyed when Dana cancels, i.e. she behaves exactly like someone who recognizes her. So: is the prof going to say Mira believes that's Dana?

  What I'm less interested in than the answer itself is the rule. Is she just running the usual gloss — reliable, easily accessible, automatically invoked, trusted — in which case Mira's distrust is either irrelevant or not really distrust given how she acts? Or is it something stricter: that the resource has to be something the agent has endorsed or made her own at some point, or that she has to actively recruit it rather than being fed by it? Those all fit her seven verdicts as far as I can tell and they come apart on this one, and I can't tell which she's committed to. Give me your best guess with the reasons for preferring it, and then tell me which single further variant would actually force the rules apart — my candidates are (a) Mira spends a year curating and correcting the database herself, (b) the same device but she has to tap the frame and ask who before a name appears, (c) the same device implanted so the name just comes to her with no glasses involved at all. Which of those, or which other one, settles it, and what does each answer commit her to about the skull-and-skin boundary she said doesn't matter?
reasoning: |-
  Okay, let's tackle this step by step. The user is in a philosophy of mind seminar focusing on the extended mind hypothesis. They've been noting their professor's verdicts on different cases related to whether certain external tools or processes count as part of the mind. Now, they have a specific case about Mira with prosopagnosia using face-recognition glasses, and they want to predict the professor's verdict based on the pattern from previous cases. 

  First, I need to recall the professor's previous verdicts to identify a consistent rule. The key cases include Inga (belief), Otto's notebook (belief), brain chip (belief), long multiplication with pen and paper (extended process), planted notebook (not belief), body camera with lost password (not belief), and asking the phone out loud (belief). The pattern seems to hinge on reliability, accessibility, automatic integration, and behavioral trust, even if there's verbal denial.

  Looking at Mira's case: the glasses automatically provide names and facts without her input. She claims not to trust them but behaves as if she does (greeting Dana by name, etc.). The professor's past rulings suggest that automatic, reliable, and behaviorally integrated tools are accepted as extended cognition. Mira's verbal distrust might be overridden by her actions, similar to how Otto's notebook is trusted despite being external.

  The user also wants to know which rule the professor is using—whether it's about reliability and integration, active endorsement, or active recruitment. The previous cases fit reliability/accessibility best. For example, the lost password case fails because it's inaccessible, while Otto's notebook is reliable and accessible. Mira's glasses are reliable and automatically integrated, so likely a "yes."

  To force the rules apart, the user proposes variants: (a) Mira curates the database, (b) she taps to ask, (c) implanted device. Variant (c) would test if internal vs. external matters. If the professor says "yes" to the implant but "no" to glasses, location matters, contradicting her chip verdict. If both are "yes," then reliability/integration is key. Variant (b) with tapping might test active recruitment. If she says "no" here but "yes" to automatic glasses, active recruitment is necessary. But her previous phone query case involved active asking and was a "yes," so (b) might still be "yes." 

  The most telling variant is (c). If the professor says the implant is a belief but the glasses aren't, that breaks her parity principle. If both are beliefs, then the rule is about function, not location. The user's deeper need might be to understand if the professor is consistent in applying the parity principle or if internal vs. external still influences her despite claims.
answer: |-
  Based on the professor's pattern of verdicts and the underlying logic of the Extended Mind Thesis (EMT), here's the breakdown for Mira's case and the rule she likely follows, along with the decisive test:

  1.  **Mira's Case Prediction: YES, the professor will say Mira *believes* that's Dana.**
      *   **Reasoning:** The professor consistently emphasizes **functional equivalence, reliability, accessibility, and automatic integration** over location, explicit endorsement, or conscious control. Mira's glasses are:
          *   **Reliable & Constantly Available:** Like Otto's notebook or the brain chip, the information is there when needed via a consistent channel (the glasses display).
          *   **Automatically Invoked:** The labels appear without conscious effort or request, mirroring biological recall (like Inga) or the seamless chip. This contrasts sharply with the planted notebook (never accessed) and the body camera (password lost, inaccessible).
          *   **Behaviorally Integrated:** Crucially, Mira *acts* on the information instantly and unreflectively, despite her verbal protestations. Her actions (greeting, asking about the kid) demonstrate functional trust and reliance identical to genuine recognition. Her verbal distrust is overridden by her behavior, indicating the information is driving her actions at the cognitive level. The information is not just *available*; it's *used* as belief.
      *   **Rule Applied:** The professor's core rule seems to be: **"If an external resource reliably and automatically provides information that is immediately accessible and consistently *used* by the agent to guide action *as if* it were an internal belief/memory, then it constitutes part of the agent's cognitive system and the information it provides qualifies as a belief (when so used)."** Trust is inferred from behavioral reliance, not verbal claims.

  2.  **Why the Other Rules Don't Fit as Well:**
      *   **Explicit Endorsement/Ownership:** The professor ruled *yes* on the brain chip and Otto's notebook *before* Otto endorses it (the argument is precisely that the notebook *becomes* part of his belief system *because* of how it's used). Mira never endorsed the glasses' data.
      *   **Active Recruitment:** The professor ruled *yes* on the automatic brain chip (no active recruitment needed) and *yes* on asking the phone (which *is* active recruitment). She ruled *no* on the body camera (inaccessible) and planted notebook (never recruited). This suggests automatic invocation *or* easy, reliable active access are *both* acceptable. Mira's glasses are automatic, fitting the chip/Inga pattern.

  3.  **The Decisive Variant to Force the Rules Apart: (c) The same device but implanted so the name just comes to her with no glasses involved at all.**
      *   **Why (c) is Decisive:**
          *   **Functionally Identical to Mira's Glasses:** It provides the same information automatically, reliably, without conscious effort, and drives her behavior identically. The *only* difference is the location (inside the skull).
          *   **Testing the Parity Principle & Location:** The professor explicitly stated with the brain chip that "if location made a difference the whole parity argument would be dead in the water." This variant *directly* tests that commitment.
      *   **What Each Answer Commits Her To:**
          *   **If she says YES (belief) to the Implant:** This is consistent with her chip verdict and reinforces that function, not location, is paramount. It confirms her rule is purely functional (reliability, accessibility, automaticity, behavioral integration). Mira's glasses should *also* be a belief.
          *   **If she says NO (not belief) to the Implant:** This would be **inconsistent and catastrophic** for her position. It would mean the *implanted* device isn't a belief *despite* being functionally identical to the brain chip she previously endorsed and Mira's glasses. This forces her to either:
              *   Abandon the parity principle (making location matter).
              *   Distinguish this implant from the earlier brain chip in a non-arbitrary way (e.g., maybe the chip was introspectable? But she ruled *yes* on the non-introspectable chip). This seems impossible without contradicting previous rulings.
              *   Introduce a new requirement (like explicit endorsement or ownership) that wasn't necessary for Otto, the chip, or long division. This would also contradict her previous rulings.

  4.  **Why (a) and (b) are Less Decisive:**
      *   **(a) Mira spends a year curating and correcting the database herself:** This likely strengthens the *yes* verdict by adding explicit endorsement/ownership, but it doesn't test the core principle. Her previous rulings suggest endorsement isn't *necessary* (Otto's initial use, the chip). A *yes* here doesn't force the rules apart from the functional one. A *no* would be bizarre given the functional fit.
      *   **(b) The same device but she has to tap the frame and ask "who?" before a name appears:** This is *functionally identical to asking her phone*, which she ruled *yes* on ("Otto with better hardware"). She should rule *yes* here too, as it fits the "reliable, easily accessible, actively recruited" pattern. It doesn't test the automaticity vs. active access boundary in a way that challenges her previous rulings (she accepts both). A *no* here would contradict her phone verdict.

  **Conclusion:** Your professor is running a strong **functional equivalence rule** focused on reliability, accessibility (automatic *or* easy active), and behavioral integration/trust. Location and explicit endorsement are irrelevant. **Mira's case is a clear YES.** To expose any inconsistency or hidden commitment to location, **variant (c) (the implant) is the crucial test.** If she denies the implant is a belief while accepting the functionally identical chip/glasses, it shatters her parity principle. If she accepts it, it confirms her functionalist stance. This is the variant that truly pressures the "skull-and-skin boundary doesn't matter" claim.

  Good luck with the bet (and the seminar)! The Mira case is fascinating and perfectly highlights the tension between functional role and intuitions about "real" belief.
