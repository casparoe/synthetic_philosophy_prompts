  2. They must decide whether to fire on an "enemy" position (which in the activity will be represented by a target, but without actual shooting - perhaps a written decision?).
  3. After the firing decision, they learn which side was actually in the right and the nature of their own role (deceived, reckless, or knowing).
  4. Then, in a later phase, they have to rule on other people's cases (from a set of anonymized cases) on two questions: 
     a) Was this person blameworthy? (i.e., morally at fault for participating in an unjust war)
     b) Was this person liable to be shot? (i.e., was it permissible to target them)
