answer: |-
  Below is a complete, runnable design for your 90-minute session. It centers on a **role-play and tribunal activity** that forces students to confront the gap between blameworthiness and liability through experiential learning. The activity avoids lectures, uses only printed materials, and has no monetary stakes. The debrief explicitly connects their experience to the target concepts.

  ---

  ### **Activity Overview: "Fog of War Tribunal"**
  **Core Mechanics:**  
  - Students become soldiers in a fictional war between two nations (**Arcadia** and **Borealia**).  
  - Each receives a *sealed briefing* with biased intel about the war. They must decide whether to **fire on an enemy position** based on limited information.  
  - After decisions, they learn which side was objectively unjust and their own "epistemic type" (deceived, reckless, or knowing).  
  - In a tribunal phase, they rule on anonymized cases from peers, judging **blameworthiness** ("Was this soldier at fault?") and **liability** ("Was it permissible to shoot them?").  
  - The reveal shows these answers diverge, exposing the limits of epistemic excuses.

  **Key Insights Uncovered:**  
  1. **Excuse vs. Justification**: An excuse (e.g., "I was deceived") doesn’t negate liability to be targeted.  
  2. **Epistemic Equality Argument**: Soldiers appear morally equal due to fog of war—but this only addresses blame, not liability.  
  3. **Identification Problem**: Distinguishing deceived vs. knowing soldiers is impossible in real combat, making individualized judgments unworkable.

  ---

  ### **What to Print**
  **1. Role Briefings (16 unique sheets, sealed in envelopes):**  
     - **8 for Arcadia (unjust side)**, 8 for Borealia (just side). Each includes:  
       - **Background**: Biased intel (e.g., "Borealia plans genocide!" for Arcadia; "Arcadia invaded us!" for Borealia).  
       - **Scenario**: Identical for all: *"You see enemy soldiers setting up a mortar. If you don’t fire, your squad dies. No civilians present."*  
       - **Epistemic Type Clues** (subtle; not labeled):  
         - **Deceived (D)**: "All reports confirm your cause is just. No contradictory intel exists."  
         - **Reckless (R)**: "Some allies questioned the intel, but command says it’s reliable."  
         - **Knowing (K)**: "You’ve seen evidence your side started the war, but orders are orders."  
     - **Second Sealed Section**: To be opened after firing decisions. Reveals:  
       - Which side was truly just/unjust (Arcadia = unjust).  
       - Their epistemic type (D/R/K) and what it means.  
       - Example (Arcadia-K): *"Arcadia was the aggressor. YOU KNEW this but fought anyway."*  

  **2. Firing Decision Forms (16 sheets):**  
     - "Your decision: 🔫 FIRE / ✋ HOLD FIRE. Brief reason: __________."  

  **3. Tribunal Case Cards (8 pre-written, anonymized examples):**  
     - Each card describes a soldier’s side (Arcadia/Borealia), type (D/R/K), decision (fire/hold), and a neutral summary of their reasoning.  
     - **Sample Cases**:  
       - Case 1 (Arcadia-D): "Fired. Believed intel that enemy was genocidal; had no reason to doubt."  
       - Case 2 (Arcadia-K): "Fired. Knew Arcadia was aggressor but followed orders."  
       - Case 3 (Borealia-D): "Fired. Believed intel that enemy invaded first."  
       - Case 4 (Arcadia-R): "Held fire. Suspected intel was flawed but didn’t investigate; hesitated."  
       - *(4 more with combinations)*  

  **4. Tribunal Voting Sheets (4 sheets, one per group):**  
     - For each case:  
       - **Question 1**: "Blameworthy? (Should they be morally blamed for being there?) YES / NO"  
       - **Question 2**: "Liable? (Was it permissible to shoot them?) YES / NO"  
       - **Reason**: "Brief justification: __________."  

  **5. Summary Poster (1 sheet for debrief):**  
     - Blank grid for recording tribunal results:  
       | Case | Side/Type/Decision | Blameworthy? | Liable? |  

  ---

  ### **Timeline (90 Minutes Total)**
  **I. Setup & Role Assignment (15 min)**  
  - **0-5 min**: Introduce the scenario. *"You’re soldiers in a war between Arcadia and Borealia. Your briefing holds intel on why your side is just. Make a life-or-death decision alone."*  
  - **5-15 min**: Distribute sealed envelopes. Students read briefings and complete **Firing Decision Forms**. *Rules: No talking. Focus on your intel and the mortar threat.*  

  **II. Decision & Reveal (15 min)**  
  - **15-20 min**: Collect decision forms. Reveal the truth: *"Arcadia was the unjust aggressor; Borealia defended itself."*  
  - **20-30 min**: Students open the **second sealed section**, learning their epistemic type (D/R/K). *No discussion yet.*  

  **III. Tribunal Phase (30 min)**  
  - **30-35 min**: Divide into **4 groups of 4**. Give each group:  
     - 2 **Tribunal Case Cards** (pre-written; mix of sides/types/decisions).  
     - 1 **Tribunal Voting Sheet**.  
  - **35-55 min**: Groups discuss and vote on **blameworthiness** and **liability** for each case. *"Judge based on the soldier’s knowledge at the time, not hindsight."*  
  - **55-60 min**: Groups report results. Instructor records votes on **Summary Poster**.  

  **IV. Debrief (15 min)**  
  - **60-75 min**: Discuss patterns using the poster:  
    > **Q1:** *"Which soldiers were consistently seen as* not blameworthy *but* liable *to be shot?"*  
      - *(Students notice Arcadia-D cases: "They were deceived, but we said shoot them.")*  
    > **Q2:** *"Could you tell a ‘deceived’ soldier from a ‘knowing’ one in the moment?"*  
      - *(Students admit cases looked identical during firing decisions.)*  
  - **75-90 min**: Connect to theory:  
    - **Excuse vs. Justification**: *"An excuse (e.g., ‘I was deceived’) absolves blame, but doesn’t justify your role in a threat. Liability isn’t about guilt—it’s about being part of the fight."*  
    - **Epistemic Equality**: *"We say soldiers are ‘moral equals’ because both sides think they’re right. But this only excuses blame—it doesn’t answer whether shooting them is permissible."*  
    - **Identification Problem**: *"Even if liability depended on evidence, the fog of war makes judging impossible. A deceived conscript and a knowing aggressor look the same down your sights."*  
    - **Introduce "moral equality of combatants"** here. Contrast with their tribunal outcomes.  

  ---

  ### **Scoring Scheme (No Money, Low Stakes)**
  - **"Ethical Cohesion Points"**: Groups earn 1 point per tribunal case where their vote matches the majority. This rewards consensus-building, not "winning."  
  - **Outcome**: The group with the most points gets first pick of snacks (bring cheap cookies) or symbolic "Honor in the Fog" certificates (printed). Focuses on engagement, not competition.  

  ---

  ### **Predictable Problems & Mitigation**
  1. **Students "Gaming" the System**:  
     - **Risk**: They might suspect briefings are rigged and hold fire to "be moral."  
     - **Mitigation**: Use urgent, life-threatening scenarios (e.g., "your squad dies if you hesitate"). Emphasize *"This is about your immediate reaction—not what you think I want."* Most will fire to save peers.  

  2. **Ex-Army or Military-Family Students**:  
     - **Risk**: The ex-army student may shut down (triggers trauma) or dominate (over-rely on experience).  
     - **Mitigation**: **Pre-brief them privately**: *"Your insights are valued, but I’ll ask you to share only in the debrief so all voices are heard."* If they disengage, allow them to step out respectfully.  

  3. **Time Crunch**:  
     - **Risk**: Tribunal discussions run long.  
     - **Mitigation**: Use a timer. Give groups only 2 cases (not 4). Cut report-backs to 1 min per group.  

  4. **Oversimplification Backlash**:  
     - **Risk**: Students say, "Real war is more complex!"  
     - **Mitigation**: Acknowledge this upfront: *"We’re simplifying to isolate one dilemma. Real soldiers face chaos we can’t replicate."*  

  ---

  ### **What the Activity Can’t Reproduce**
  - **The Stakes of Real Violence**:  
    - **Limitation**: Students aren’t risking death. The visceral fear, trauma, and weight of killing are abstract.  
    - **How to Address**: In debrief, say: *"In real war, the cost of misjudging liability isn’t points—it’s lives. No exercise captures that. But this gap—between blame and liability—is why soldiers feel trapped: they’re excused but not absolved."*  

  - **The Fog of War’s Full Chaos**:  
    - **Limitation**: Briefings simulate epistemic limits but lack true uncertainty (e.g., panic, misinformation in real time).  
    - **How to Address**: Note: *"We gave you clean intel. Real combat adds confusion we can’t simulate. That’s why the identification problem is insurmountable."*  

  - **Moral Emotions**:  
    - **Limitation**: Guilt, shame, or righteous anger are intellectualized, not felt.  
    - **How to Address**: Use the ex-army/family students in debrief: *"[Name], you’ve seen this. How do soldiers live with these choices?"*  

  ---

  ### **Why This Works**
  - **Experiential Gap**: Students *feel* the tension when they realize their tribunal votes excuse a soldier but still mark them as targetable.  
  - **No Early Theory**: Concepts like "moral equality" are withheld until debrief, forcing students to generate the dilemma organically.  
  - **Inclusive Design**: The ex-army student is a resource, not a prop. Pre-briefing ensures they contribute without hijacking or withdrawing.  

  **First Run Tip**: Do a dry run with colleagues to adjust timing. Focus on keeping the firing decision urgent and tribunal phase tight. The activity thrives on controlled chaos—lean into the discomfort!
