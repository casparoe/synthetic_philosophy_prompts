  The user mentioned an escape hatch with making options expensive rather than removing them, like waiting periods. But the friend countered that such mechanisms don't reliably distinguish between impaired and rational decisions. The convert vs. addict example shows the challenge. So that approach doesn't fully solve the autonomy issue.

  For constitutional precommitment, the dead-hand objection comes up. The user is worried that if they accept the welfare arithmetic, it leads to paternalism, but rejecting it might invalidate precommitments. The solution might lie in the continuity of agency. Even though individuals change, the collective "we" persists through time. Precommitments are decisions made by the same entity (the people) binding their future selves, unlike third-party impositions.

