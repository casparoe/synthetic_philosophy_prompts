  Here’s a complete game design for your 90-minute session, optimized for experiential learning and robust debriefing. The game is called **"Wealth Builder"** and deliberately avoids technical jargon until the debrief.

  ---

  ### **Game Setup**
  1. **Participants**: 18 undergrads (9 play as **sequential bettors**, 9 as a **pooled group**).  
  2. **Starting Bankroll**: $100 per player.  
  3. **Bet Structure**:  
     - Win: Double your bet (net gain = bet amount).  
     - Lose: Lose your bet.  
     - Example: Bet $10 → Win = +$10, Lose = -$10.  
  4. **Fixed Fraction**: Each player/pool commits upfront to bet a **fixed fraction** (e.g., 10%, 50%, 100%) of their *current* bankroll each round.  
  5. **Coin Bias**:  
     - **Rounds 1-10**: Biased coin with **60% win chance** (favorable).  
     - **Rounds 11-20**: Biased coin with **40% win chance** (unfavorable) — changed secretly.  
  6. **Tools**: 
     - 10-sided die (or digital RNG) for coin flips:  
       - Win = 1-6 (first 10 rounds), 1-4 (last 10 rounds).  
       - Lose = 7-10 (first 10), 5-10 (last 10).  
     - Spreadsheet/whiteboard to track bankrolls.  

  ---

  ### **Game Flow**  
  #### **Intro (5 min)**  
  - _"You’re investors making 20 repeated bets. Your goal: grow your wealth. Rules:  
    1. Pick a fixed % of your bankroll to bet each round (e.g., 20% = bet $20 of $100).  
    2. Win: double your bet. Lose: lose your bet.  
    3. Sequential players play 20 rounds alone.  
    4. Pooled group: Each member bets individually each round, then combines and splits the total equally."_  
  - **Assign Groups**: 9 sequential, 9 pooled. Pooled group agrees on **one fixed fraction** together.  

  #### **Betting Commitment (5 min)**  
  - Each sequential player chooses their fraction **privately** (suggested: 10%, 20%, 50%, 100%).  
  - Pooled group **negotiates one fraction** (will likely choose 50-100%).  

  #### **Rounds 1-20 (25 min)**  
  - **Each Round**:  
    1. **Flip**: Roll die for all players.  
       - Sequential group: **One roll** applies to all 9 sequential players (same outcome).  
       - Pooled group: **9 independent rolls** (one per member).  
    2. **Update Bankrolls**:  
       - Sequential: `New bankroll = Old × (1 ± fraction)` (win: `+`, lose: `-`).  
       - Pooled:  
         - Each member calculates their outcome (e.g., win: `+fraction`, lose: `-fraction`).  
         - **Total pool $ = Sum of all 9 bankrolls after bets**.  
         - **Split equally**: New bankroll per member = Total pool $ / 9.  
    3. **Record**: Track one sequential player per fraction (e.g., 10%, 50%, 100%) and the pool on a whiteboard.  
  - **Secret Change**: After Round 10, switch bias to 40% win chance (no announcement).  

  ---

  ### **Predicted Outcomes**  
  | **Group**         | **Rounds 1-10 (p=60%)**                     | **Rounds 11-20 (p=40%)**                  |  
  |-------------------|---------------------------------------------|-------------------------------------------|  
  | **Sequential (100%)** | High growth → likely **broke by Round 10** | Stays at $0 (if broke) or crashes further |  
  | **Sequential (50%)**  | Grows → peaks at ~$1,000                   | Crashes to ~$1-$10                        |  
  | **Sequential (10%)**  | Steady growth → ~$200                       | Slow decline → ~$150                      |  
  | **Pooled (e.g., 50%)** | Smooth growth → ~$200                     | Smooth decline → ~$80                     |  

  **Key Conflict**:  
  - Sequential high-bettors (50-100%) **hate the bet** after Round 20 (many broke).  
  - Pooled group **likes the bet** ("We averaged out!").  

  ---

  ### **Debrief (50 min)**  
  **Step 1: Elicit Reactions**  
  - _"Show of hands: Who felt this was a good bet? Bad bet?"_  
  - **Sequential high-bettors**: "We got wrecked!"  
  - **Pooled group**: "It worked for us!"  

  **Step 2: Map Experiences to Concepts**  
  | **Game Moment**             | **Concept**                                  | **Key Insight**                                                                 |  
  |-----------------------------|---------------------------------------------|--------------------------------------------------------------------------------|  
  | Sequential 100% → Broke     | **Risk of ruin**                            | "Max EV" ignores compounding risk. One loss can wipe you out.                  |  
  | Pooled group’s steady path  | **Law of large numbers**                    | Pooling averages outcomes → behaves like expected value (arithmetic mean).     |  
  | Sequential 50%: Boom → bust | **Geometric growth**                        | Sequential wealth compounds: **growth rate = geometric mean** of multipliers.  |  
  | Post-Round 10 collapse      | **Uncertainty & robustness**                | Betting "optimal" fraction without knowing true odds → overbetting → disaster. |  

  **Step 3: Formalize Insights**  
  - **Growth > EV**:  
    - Sequential players: Maximize **growth rate** (geometric mean), not EV.  
    - Formula: Growth rate = \( p \ln(1+f) + (1-p) \ln(1-f) \) → max at \( f^* = 2p-1 \).  
      - p=60% → f*=20% (not 100%!).  
  - **Uncertainty → Shade Down**:  
    - True p changed from 60% → 40%. Betting f*=20% for p=60% led to ruin when p dropped.  
    - **Moral**: When unsure, bet **less than "optimal"** (fractional Kelly) to avoid fragility.  

  **Step 4: Caveats**  
  _"This game assumes:  
  1. **Multiplicative bets**: Wealth scales proportionally (not true for one-off investments).  
  2. **Known probabilities**: Real life has uncertainty (shade down!).  
  3. **Infinite divisibility**: Bets can be tiny fractions of bankroll (not $1 minimum bets).  
  4. **Long horizons**: Asymptotics need 100s of bets. For short runs/one-shots, EV matters more.  
  5. **All wealth reinvested**: No consumption or external cashflows."_  

  ---

  ### **Predictable Problems & Fixes**  
  1. **"I bet 100%!" → Broke Round 1**:  
     - **Fix**: Use as teaching moment. Ask: _"Why did this feel rational? What did you miss?"_ → Discuss compounding.  

  2. **"I bet 0%!" → $100 forever**:  
     - **Fix**: Compare to pooled group ("You avoided risk, but missed gains"). Discuss risk-return tradeoffs.  

  3. **"It’s just utility functions!" (Minute 10)**:  
     - **Fix**: "Yes! But here, ‘utility’ is growth rate. We’ll formalize later." → Postpone to debrief.  

  4. **Pooled group too noisy**:  
     - **Fix**: Pre-calculate their outcomes with a script/spreadsheet. Use a helper to compute totals fast.  

  5. **Bookkeeping chaos**:  
     - **Fix**: Track only 3 sequential players (10%, 50%, 100%) + the pool. Use calculators/pre-rolled dice.  

  ---

  ### **Why This Works**  
  - **Experiential dissonance**: Sequential players *feel* regret; pooled players feel cheated.  
  - **Bias change**: Forces self-driven insight ("Why did our strategy fail *later*?").  
  - **Debrief links**: Concrete game moments → abstract principles (no jargon-first).  
  - **Time-efficient**: 20 rounds in 25 min via batched rolls and simplified tracking.  

  **Final Tip**: Bring a coin, whiteboard, and a killer poker face when changing the bias. For maximum engagement, let the pooled group celebrate their "genius" until the big reveal.
