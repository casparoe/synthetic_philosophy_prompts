prompt: |-
  I've been forecasting seriously for about a decade — calibration training, prediction logs, the usual habits — and I've lately tried to write down the epistemology I'm actually running on rather than the one I'd defend on request. It is mostly a reductionist line about chance plus a fairly hard-nosed outside-view practice, but when I lay the pieces out together I can't tell which ones are load-bearing and which are colliding. Here is the set.

  (1) Reductionism about chance. To say that the chance of a kind of event is p is to say something about the pattern of actual outcomes in some class or sequence of events, and nothing more; there is no further primitive propensity fact over and above how things actually go.

  (2) Realism about single-case chance, plus the principal principle. I am willing to assert that this patient's chance of surviving this surgery is 0.83 and mean something determinately true about that one surgery, not a remark about a class it happens to belong to. I also take it as a constraint on rationality that an agent who knows the chance of E and has no inadmissible evidence sets credence in E equal to that chance. This is not idle for me: chance is the thing I take my credences to be tracking, and calibration, measured over my logged forecasting record, is my main evidence that I am tracking it.

  (3) No privileged reference class. Every event lies in indefinitely many classes with different frequencies, and I do not think one of them is the objectively correct one; I reject appeals to natural kinds or to the causally homogeneous class as ways of singling out the one real frequency, and I think relevance is question- and interest-relative.

  (4) Narrowest-adequate-class rule as my working rule of direct inference: among the classes for which I have statistically reliable frequency data, use the narrowest one.

  (5) Outside-view default, with suspicion of narrowing. Default to the base rate for the broad class and treat any move to a narrower subclass as something to be suspicious of, since subclass-shopping is where overfitting and motivated reasoning get in. I also hold, and this is the part that looks flatly inconsistent with the rest of (5), that deliberately setting aside evidence one possesses is irrational, and that one should condition on one's total evidence.

  (6) Precision. I reject imprecise credence: somewhere between 0.2 and 0.6 is either laziness or a particular number in disguise. Decision theory needs one number, and if I cannot produce one I should go get more evidence rather than report an interval.

  (7) A candidate repair for the (1)/(2)/(3) cluster that I have been toying with, call it chance relativism: there is no such thing as the chance of a single case, only the chance of the case relative to a class; all such relativized chances are equally real; and the principal principle becomes a conditional instruction — when you know that the chance of E relative to class C is p, and nothing makes some other class more relevant to your question, set credence in E to p.

  Two case verdicts, since they are the part I trust least and they seem to me to pull in opposite directions:

  (8) A friend who I think is genuinely unusually capable is starting a company. I forecast the base rate for seed-stage companies in that sector — low single digits — and decline to adjust upward for her, even though I have real evidence about her.

  (9) For the next run of a well-characterized process at work — same machine, same input spec, the post-maintenance protocol in place — I put 0.99 on success, where the base rate across all runs of all machines is about 0.9, and I feel no pull at all toward 0.9.

  What I want is an audit rather than a survey. Go through these and tell me which pairs genuinely collide and which only look like they do, ordered by how much damage the collision does rather than all flagged equally. In (8) and (9) I appear to ignore specifics in one case and ignore base rates in the other, and I cannot tell whether that is an inconsistency or the rules working as intended. In (4) and (5) I seem to have two different instructions for choosing a class, and I suspect they do not agree, but I also suspect the disagreement is really about something I have not stated. (7) is the piece I most want stress-tested: I think it buys me consistency at some cost I have not priced, and I would like the bill stated precisely, including whether some variant of it is survivable. For each real tension, say what would have to give and what the cheapest revision costs me downstream — I would rather give up something small than rebuild the whole picture, but I do not know which of these is the small one.
reasoning: |-
  Okay, let me start by really understanding what this forecaster is struggling with. They've been doing this for a decade, so they're experienced, but now they're trying to formalize their epistemology and finding inconsistencies. The core tension seems to be between their reductionist view of chance and their need for single-case probabilities in practice.

  First, I need to unpack their stated principles. Reductionism about chance (1) says chance is just patterns in actual outcomes—no propensities. But then (2) claims single-case chances are real and should guide credences via the Principal Principle. How can both be true? If chance is only about classes, how can a single event have its own chance? That feels like a direct clash.

  Then there's (3): no privileged reference class. Every event belongs to multiple classes, and none is objectively "correct." But in practice, they use the narrowest adequate class (4) while also being suspicious of narrowing (5). Hmm, that's interesting. In case (8), they stick with the broad base rate for their friend's startup, ignoring individual evidence. But in case (9), they narrow to a specific machine and protocol. So when is narrowing okay? Seems arbitrary.

  The (7) proposal—chance relativism—might resolve (1)/(2)/(3) by making chance relative to a class. But then the Principal Principle becomes conditional: use the class that's most relevant. Relevance is interest-relative though, which introduces subjectivity. Is that a problem? They want objectivity via calibration, but now chance depends on the classifier's goals. That might undermine their evidence for being well-calibrated.

  Looking at (5) and (6): they demand precise credences and conditioning on total evidence. But in (8), they deliberately ignore evidence about their friend. That violates (5)! Yet they feel it's necessary to avoid overfitting. So maybe their epistemology needs an exception for high-stakes overfitting risks? But that feels ad hoc.

  The calibration evidence (from prediction logs) relies on frequentist success over many predictions. But if single-case chances are class-relative, calibration might measure how well they choose relevant classes, not some objective truth. That could be workable if they define success as choosing useful reference classes, but does that fit their reductionism?

  Stress-testing (7): if chances are relative, two people using different classes could both be "correct" with different probabilities for the same event. Does that make sense? And how do they decide which class to use? If it's about relevance to the question, but relevance is subjective, that clashes with their hard-nosed, evidence-based approach. Also, in high-stakes decisions, this relativism might feel unsatisfying—like there's no actual fact of the matter.

  For the case verdicts: (8) and (9) seem inconsistent. Why reject specifics in one case but embrace them in the other? The key might be the quality of the narrowing evidence. For the machine (9), there's a clear, stable protocol; for the friend (8), individual capability might be noisy or hard to assess. But their stated principles don't include this distinction—it's an unstated heuristic. They need to explicitly add criteria for when narrowing is reliable.

  The cheapest fix might be to tweak (5): allow ignoring evidence when its reliability is questionable. But that feels slippery. Embracing (7) with clearer relevance criteria (e.g., causal homogeneity) could help, but they reject natural kinds in (3). Maybe they can define relevance pragmatically—based on predictive utility in similar past cases. That might align with their calibration focus.

  Overall, the biggest tension is between (1)/(2)/(3) and the need for actionable single-case probabilities. (7) offers a way out but costs objectivity. The second biggest is between (4)/(5) and (6)—demanding precision while wrestling with when to use broad vs. narrow classes. Case verdicts highlight that their practice relies on unstated rules about evidence quality. To resolve, they should either adopt (7) and refine relevance, or soften (1) to allow pragmatic single-case chances, or add explicit reliability metrics to (4) and (5). The cheapest path is probably refining (7) and adding heuristics for when narrowing is safe, even if it sacrifices some philosophical purity.
answer: |-
  Here's an audit of your epistemological framework, ordered by severity of collision and impact on coherence. I'll identify genuine inconsistencies, surface hidden tensions, stress-test your candidate repair, and propose minimal-cost revisions. The core issue is reconciling reductionism with single-case objectivity while avoiding arbitrariness in reference class selection.

  ### **Catastrophic Collisions (Threaten Core Coherence)**
  1. ***(1) Reductionism + (2) Single-Case Realism* → Logical Contradiction**  
     - **Collision**: (1) denies primitive propensities, reducing chance *only* to class frequencies. (2) asserts a determinate single-case chance (e.g., "this surgery: 0.83") that cannot be reduced to any class frequency (per (3)).  
     - **Damage**: Undermines the ontology of chance itself. If chance is *only* patterns in classes (1), single-case chances (2) are either illusory or must secretly appeal to a non-reductionist propensity.  
     - **Cheapest Revision**: **Abandon (2)'s realism**. Treat "this surgery: 0.83" as shorthand for "the narrowest reliable reference class I've identified has frequency 0.83". This preserves (1) and (7). Cost: You lose the intuition that single-case chances are *ontologically fundamental*.  

  2. ***(5) Outside-View Default + (5) "Condition on Total Evidence"* → Self-Contradiction**  
     - **Collision**: (5) endorses two conflicting imperatives:  
       - *Default to broad base rates and distrust narrowing* (to avoid overfitting).  
       - *Always condition on total evidence* (which includes specifics like your friend's capability).  
     - **Damage**: In (8), you *violate conditioning on total evidence* by ignoring individual evidence. This isn't a tension—it's a direct breach of your stated rule.  
     - **Cheapest Revision**: **Reformulate (5)** as: *"Default to broad base rates; narrow only with rigorous, non-motivated justification (e.g., causal stability or high predictive validity)."* Cost: Admits that "total evidence" isn't always actionable; some evidence must be deliberately discounted when unreliable or prone to bias.  

  ---

  ### **Major Tensions (Operational Inconsistency)**
  3. ***(4) Narrowest-Adequate-Class + (5) Suspicion of Narrowing* → Unresolved Criterion Conflict**  
     - **Collision**: (4) says "use the narrowest reliable class", while (5) says "be suspicious of narrowing". No meta-rule specifies *when* (4) overrides (5) or vice versa.  
     - **Hidden Driver**: The tension is resolved *in practice* by an unstated heuristic: **"Narrow only when the subclass has high causal homogeneity or mechanistic predictability."**  
       - In (9) (machine run), narrowing feels justified because inputs/process are controlled.  
       - In (8) (startup), narrowing feels suspicious because individual "capability" lacks a stable causal link to outcomes.  
     - **Revision**: **Make this heuristic explicit**. Add: *"(4) applies only when the subclass has high causal stability or isolation from confounding variables."* Cost: Weakens your anti-realist stance in (3) by smuggling in causal objectivity.  

  4. ***(8) and (9): Inconsistent Case Verdicts* → Reveal Unstated Epistemic Priorities**  
     - **Collision**: You reject specifics in (8) (startup) but embrace them in (9) (machine). This *appears* inconsistent, but the difference is defensible:  
       - (9) uses a **causally insulated system** (same machine, protocol, inputs).  
       - (8) involves **noisy, non-isolated evidence** (individual "capability" in a chaotic market).  
     - **Damage**: Your framework lacks criteria to justify this distinction, making decisions feel arbitrary.  
     - **Revision**: **Adopt a causal-stability threshold for narrowing**. Narrowing is permitted only when:  
       - (a) The subclass is *causally homogeneous* (all instances share relevant mechanisms),  
       - (b) Evidence is *high-precision* (low measurement error).  
       Cost: Conflicts with (3)'s rejection of "natural kinds" by implying some classes *are* objectively privileged.  

  ---

  ### **Stress-Testing (7) Chance Relativism**
  **Proposal**: *"Chance is relative to a class; all relativized chances are real; use class-relative chance p when no more relevant class exists."*  
  - **Strengths**: Resolves (1)/(2)/(3) collision by eliminating single-case realism. Aligns with (3)'s anti-privilege stance.  
  - **Fatal Flaws**:  
    - **Principal Principle Undermined**: If chances are multiply real (e.g., surgery survival is 0.8 relative to hospitals, 0.9 relative to surgeons), the Principal Principle cannot guide credence without a *relevance criterion*. But relevance is "question-relative" (per (3)), making rationality subjective.  
    - **Calibration Evidence Unmoored**: Your prediction logs track *your chosen reference classes*. If chances are class-relative, good calibration only shows you pick *useful* classes, not that you track mind-independent facts. This weakens calibration's epistemic force.  
    - **Decision Risk**: In high-stakes cases (e.g., surgery), two equally "real" chances (e.g., 0.8 vs. 0.9) could lead to different actions. You need a unique credence for decisions (per (6)).  
  - **Survivable Variant?** Yes, but with costs:  
    - **Add a relevance selector**: *"Use the chance relative to the class most predictively reliable for similar cases in your log."*  
    - **Costs**: (a) Relevance is still interest-relative, risking motivated selection; (b) Conflicts with (1) by implying predictive reliability is a primitive fact.  

  ---

  ### **Minor Quibbles (Manageable with Clarification)**
  5. ***(6) Precision + (5) Suspicion of Narrowing* → No Collision**  
     - **Resolution**: Precision is enforced *after* reference-class selection. Suspicion of narrowing is a guardrail *during* selection. They operate at different stages.  
  6. ***(3) No Privileged Classes + (4) Narrowest-Adequate-Class* → Coherent**  
     - **Resolution**: (3) denies *objective* privilege; (4) is a *subjective* rule for action ("reliable" = reliable for your purposes). No conflict if (4) is pragmatic.  

  ---

  ### **Minimal-Cost Repair Package**
  To achieve consistency with minimal disruption:  
  1. **Abandon single-case realism (2)**. Replace with: *"Single-case chance ascriptions are elliptical for claims about a selected reference class."*  
  2. **Revise (5)** to: *"Default to broad base rates; narrow only with evidence of causal stability or high predictive validity. Deliberately ignore evidence prone to overfitting or low reliability."*  
  3. **Adopt a causal-stability heuristic** for (4)/(8)/(9): Use narrow classes only when the system is causally insulated (e.g., machines, not startups).  
  4. **Accept (7) Chance Relativism** with the addendum: *"In decisions, use the chance relative to the class with the highest validated predictive accuracy for analogous cases."*  

  **Downstream Costs**:  
  - **Philosophical**: Sacrifices the "truth" of single-case chances (now pragmatic tools). Weakens reductionism by leaning on causal stability.  
  - **Practical**: Adds cognitive load to assess causal stability. May feel less "objective" than original framework.  
  - **Benefit**: Resolves all major collisions, aligns with your case verdicts, and preserves calibration as a core evidence source.  

  **Final Note**: Your approach in (8) and (9) is **not inconsistent**—it reflects sound epistemic hygiene. Startups lack the causal regularity of machines, so resisting narrowing is rational. The framework just needs explicit rules to formalize this intuition.
