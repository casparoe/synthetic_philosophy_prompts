prompt: |-
  I work in the economics office of a regulatory agency, and I am drafting an internal methods note on our benefit–cost practice. I do not want a verdict on whether the practice is good; I want the theory it is implicitly committed to reconstructed, and I want the places where it is philosophically underdetermined flagged as underdetermined.

  The practice, as it actually operates. To score a proposed rule we monetize every consequence in dollars and add: households' willingness to pay for each benefit, firms' compliance costs, and mortality risk reductions valued at a single figure per statistical life applied to the expected number of deaths averted. A reduction of one-in-ten-thousand in the annual risk of each of ten thousand people is costed exactly as one life saved, and exactly as the certain avoidance of one identifiable death. Rules are ranked by net benefits with no weights attached to whose benefits and costs they are; when a rule's costs fall on one income group and its benefits on another, our guidance asks for a separate distributional statement but instructs us not to fold equity weights into the net-benefit calculation. The value-of-life figure itself is revised upward over time as real incomes rise, on the ground that willingness to pay for safety increases with income.

  I have been reading about Harsanyi's aggregation theorem, and the practice looks as though it were built to match that result's conclusion — social welfare as a weighted sum of individual expected utilities — while quietly failing to match its premises. I want that suspicion tested piece by piece, in the following order.

  First, reconstruct the social welfare function the practice must be using if it is coherent, and tell me what it strictly presupposes as opposed to what merely fits it. In particular, does the practice need each of the theorem's premises — expected-utility rationality for individuals, expected-utility rationality for the social ranking itself, the unanimity condition, and the impartiality or equiprobability step that converts free weights into equal ones — or does it need only the conclusion? My own suspicion is that the instruction not to use equity weights is doing work that nothing in the aggregation result requires, since the result leaves the weights undetermined; confirm or dislodge that.

  Second, the currency problem. The weights in the theorem are weights on von Neumann–Morgenstern utility functions, and those functions are determined only up to positive affine transformation, with the weights absorbing any rescaling, so that the resulting ranking is invariant to how each person's utility is normalized. Our currency is dollars, and a person's utility is an affine function of dollars only if that person is risk-neutral with respect to money. Work out what the practice therefore implies: if a dollar is counted as worth the same wherever it lands, what is being said about the weight on each person's well-being? I think the answer is that equal treatment per dollar amounts to unequal treatment per unit of utility in a determinate direction, and that the direction is the opposite of what the impartial framing of the practice suggests — but I want the argument made properly, including whether the practice might instead be defended as a weighted sum with unequal yet principled weights rather than dismissed as a botched equal-weight sum.

  Third, a diagnostic I would like you to apply. Because the Harsanyian sum is invariant to positive affine rescaling of each individual's utility, any aggregation method whose rankings shift when you change units or baselines is not a Harsanyian sum. Is dollar-metric aggregation invariant in that sense, given that the dollar value assigned to a person's gain depends on the income or consumption level at which the conversion into money is made? If two analysts who convert at different reference levels can reverse the ranking of the same pair of rules, say what that establishes: is the practice committed to universal risk-neutrality in money, or only to a particular cardinalization that it never explicitly chose?

  Fourth, ex ante or ex post. Under the practice as described, a prospect that imposes certain death on one person and one that imposes a one-in-ten-thousand risk on each of ten thousand people are costed identically. Is the practice therefore committed to evaluating prospects by the sum of expected utilities rather than by how outcomes look once the uncertainty is resolved, and to indifference between concentrated and dispersed fatal risk at equal expected value? Tell me what the best-known objection to that indifference is, what it would take for the practice to register it, whether any scoring rule we actually use would have to change, and whether our separate handling of identifiable lives — the refusal to score a named worker facing a known hazard the way we score a statistical one — is a genuine inconsistency or a defensible division of labor.

  Fifth, suppose an internal review found that stated willingness to pay per unit of risk reduction is systematically larger for large risk reductions than for small ones, so that the single value-of-life figure is not a constant marginal rate of substitution at all. Which premise of the reconstruction would that break, and would we then still be aggregating expected utilities, or something that merely resembles them? Does anything in the argument for the aggregation result tell us which way to go once that premise fails?

  Finally, and most usefully for my note: if we took the result seriously as a constraint on our practice, what exactly would have to change? Separate the changes that are forced by the aggregation result itself, the changes that follow only if one adds an equal-weight or impartial-observer premise, and the changes that follow only if one rejects ex ante evaluation in favour of an ex post one. And be explicit about where the practice is underdetermined: if several different welfare functions would generate the same scores, the note should say so rather than announcing that we have uncovered a hidden utilitarianism in our spreadsheets.
reasoning: |-
  Hmm, this is a sophisticated methodological inquiry from an economics professional. The user works in regulatory policy and wants a philosophical dissection of their agency's benefit-cost analysis (BCA) practice, specifically probing its implicit theoretical commitments through the lens of Harsanyi's aggregation theorem. 

  First, I need to unpack the core tension: The practice resembles Harsanyi's utilitarian conclusion (sum of expected utilities) but likely violates its axioms. The user suspects this and wants systematic verification. Their framing suggests deep familiarity with welfare economics but seeks external validation of their suspicions - classic "expert seeking peer review" behavior.

  Key aspects to address:
  - The dollar aggregation implies cardinal interpersonal comparisons masked as monetary neutrality
  - The "no equity weights" rule contradicts Harsanyi's weight-indeterminacy
  - Mortality risk valuation exposes tension between ex ante and ex post evaluation
  - Income-adjusted VSL reveals hidden assumptions about utility functions

  I should proceed precisely as requested: reconstruct the implied social welfare function, then test each operational feature against Harsanyi's premises. The mortality risk example is particularly telling - it forces confrontation with the "ex ante indifference" that Harsanyi requires but that contradicts moral intuitions about dispersed vs concentrated harms.

  The user's suspicion about equity weights is spot-on. Harsanyi's weights are arbitrary scaling factors, while the practice's dollar metric accidentally makes them proportional to marginal utility of income. This creates perverse redistribution: weighting the rich more heavily precisely because they value money less. Irony worthy of highlighting.

  For the diagnostic test: Dollar-metric BCA fails Harsanyi's invariance requirement spectacularly. Changing reference points alters rankings because dollars don't linearly map to utility. The practice implicitly assumes universal risk-neutrality in money - an absurd premise that deserves emphasis.

  The "large vs small risk reductions" question is crucial. If marginal WTP isn't constant, the entire edifice crumbles: we're not summing linear utilities anymore. This breaks the von Neumann-Morgenstern rationality premise. I should note this could push them toward rank-dependent utility models.

  Finally, the "what would change" section must distinguish:
  1) Forced changes: Axiomatic violations that invalidate the utilitarian interpretation
  2) Optional changes: Choices about weighting or evaluation timing
  3) Underdetermined aspects: Multiple welfare functions could produce identical scores

  The user's professional need is clarity for policymakers, so I'll avoid jargon where possible and flag every "underdetermined" point explicitly. Their note will likely influence real regulations, so precision matters.
answer: |-
  Based on your description, your benefit-cost practice implicitly commits to a specific theoretical framework while exhibiting significant philosophical underdetermination and potential inconsistencies with Harsanyi's premises. Below is a systematic reconstruction, flagged uncertainties, and diagnostic analysis:

  ---

  ### **1. Reconstructed Social Welfare Function & Harsanyi Premises**
  - **Implied SWF**: \( W = \sum_{i} \beta_i E[u_i(\text{wealth})] \), where:
    - \( u_i \) = Individual \( i\)'s **risk-neutral** von Neumann-Morgenstern (vNM) utility over wealth (linear in money).
    - \( \beta_i \) = Implicit weight on individual \( i\), proportional to \( \frac{1}{\text{marginal utility of wealth at reference income}} \).
  - **Strict Presuppositions**:
    - **Expected-Utility Rationality (Individuals)**: Required. Monetization assumes individuals maximize *expected* utility (e.g., WTP for risk reduction reflects EU calculations).
    - **Expected-Utility Rationality (Social Ranking)**: Required. Ranking rules by net benefits implies social preferences satisfy EU axioms (linearity in probabilities).
    - **Unanimity (Pareto)**: Required. If all individuals prefer policy A to B, net benefits of A > B.
    - **Impartiality/Equal Weights**: **Not required**. Harsanyi's theorem permits *any* positive weights \( \beta_i \). Your practice **rejects** impartiality by forbidding equity weights, instead letting \( \beta_i \) be determined by *monetary units*.
  - **Your Suspicion Confirmed**: The "no equity weights" rule *is* doing work Harsanyi does not require. His theorem leaves weights arbitrary; your practice fixes them implicitly via monetary aggregation. This is a **philosophical choice** (prioritizing monetary efficiency over welfare equality), not a logical implication.

  ---

  ### **2. The Currency Problem: Dollars vs. Utility**
  - **Implication**: Counting each dollar equally implies:
    - \( \beta_i \propto \frac{1}{u_i'(y_i)} \), where \( y_i \) is individual \( i\)'s income.
    - **Unequal Welfare Weights**: A dollar to a poor person (high \( u_i' \)) receives a *smaller* \( \beta_i \) than a dollar to a rich person (low \( u_i' \)). **This is anti-egalitarian**.
  - **Defense?** The practice *could* be defended as a weighted utilitarian SWF with "wealth-sensitive" weights (\( \beta_i \propto u_i'(y_i)^{-1} \)). However:
    - This weights the welfare of the rich **more heavily** than the poor (since \( u_i' \) decreases with income).
    - It contradicts the *impartial framing* of saving "statistical lives" equally, as richer lives implicitly count for more in welfare terms.

  ---

  ### **3. Diagnostic: Invariance Test**
  - **Failure of Invariance**: Dollar-metric aggregation is **not invariant** to affine transformations of utility. If two analysts use different reference incomes (\( y \)) to monetize utility:
    - Monetized gains \( \Delta u_i \) become \( \frac{\Delta u_i}{u_i'(y)} \).
    - Changing \( y \) alters the dollar value (e.g., WTP for risk reduction rises with income).
    - **Rank reversals** are possible if policies affect groups with different incomes.
  - **What This Establishes**:
    - The practice is **committed to universal risk-neutrality in money** (linear \( u_i \)) *or* to a **specific cardinalization** where \( u_i \) is pinned down by WTP at observed incomes.
    - It is **not** a Harsanyi sum (which requires invariance). The practice *never explicitly chose* this cardinalization; it emerged from ad hoc monetization conventions.

  ---

  ### **4. Ex Ante vs. Ex Post Evaluation**
  - **Commitment**: Your practice is strictly **ex ante**:
    - "1 death with certainty" vs. "10,000 facing 1/10,000 risk" are costed identically → Sum of individual *expected* utilities.
    - Indifference between concentrated/dispersed risk at equal expected fatalities.
  - **Key Objection**: The **ex post Pareto principle**. A society might prefer the dispersed risk ex post (only one dies randomly) over certain death for one (violating ex ante Pareto if identities matter). 
  - **Can the Practice Register This?** Only if:
    - You abandon expected-utility social rationality (e.g., adopt rank-dependent or ex post egalitarian criteria).
    - **No change** is needed to current scoring if you accept ex ante evaluation as normatively valid.
  - **Identifiable vs. Statistical Lives**: Not inconsistent. Identifiable lives may involve non-risk parameters (e.g., dread, equity concerns) handled separately. **Defensible** if viewed as addressing non-welfarist values *outside* the BCA framework.

  ---

  ### **5. Non-Constant Marginal WTP for Risk Reduction**
  - **Premise Broken**: **vNM Expected Utility Theory** (specifically, linearity in probabilities). If WTP is non-linear in risk reduction, individuals violate EU axioms.
  - **Implications**:
    - You are **not aggregating expected utilities**. You are summing a non-EU construct (e.g., rank-dependent utility or prospect theory valuations).
    - The aggregation theorem **no longer applies**; net benefits lack welfare-theoretic justification.
  - **Path Forward**: Harsanyi offers no guidance. Options include:
    - Adopt a non-EU social aggregation (e.g., weighted sum of rank-dependent utilities).
    - Treat BCA as purely accounting exercise (no welfare claims).

  ---

  ### **6. Changes Required to Align with Harsanyi**
  | **Requirement**                     | **Changes to Practice**                                                                 | **Motivation**                          |
  |-------------------------------------|-----------------------------------------------------------------------------------------|-----------------------------------------|
  | **Aggregation Result (SWF = ∑βᵢE[uᵢ])** | None strictly *forced*. Current practice is a special case (βᵢ ∝ 1/uᵢ', linear uᵢ).    | Status quo is coherent under Harsanyi. |
  | **Add Equal Weights/Impartiality**  | Equity weights: Weight net benefits by per-capita utility (e.g., βᵢ = 1) → Requires interpersonal utility comparisons. | Forces impartiality; weights poor > rich. |
  | **Reject Ex Ante for Ex Post**      | Score *realized* outcomes, not prospects. Value dispersed risk > concentrated risk.     | Avoids "ex ante tyranny"; respects ex post fairness. |

  **Underdetermined Aspects**:
  1.  **Weights (βᵢ)**: Current practice implies βᵢ ∝ 1/uᵢ', but *any* positive weights are compatible with Harsanyi. **No unique welfare function** is uncovered.
  2.  **Risk Attitudes**: Practice assumes risk-neutrality in money. Harsanyi permits any risk attitudes, but monetization forces linearity.
  3.  **Ex Ante/Ex Post**: Harsanyi is ex ante; your practice matches this, but alternatives exist.

  ---

  ### **Recommendations for Your Note**
  - **Explicitly State**: The practice commits to a **weighted utilitarian SWF with wealth-sensitive weights**, relying on **ex ante evaluation** and **individual risk-neutrality**.
  - **Flag as Underdetermined**:
    > *"While net benefit calculations resemble a Harsanyi sum, they do not uniquely specify a social welfare function. Multiple specifications (e.g., different welfare weights or risk attitudes) can generate identical scores under specific assumptions. The refusal to incorporate equity weights reflects a policy choice to prioritize monetary efficiency over distributional concerns, not a requirement of welfare economics."*
  - **Highlight Tensions**:
    - Monetary invariance failure undermines welfare interpretations.
    - Non-constant VSL breaks the EU foundation.
    - Ex ante mortality valuation conflicts with moral intuitions about fairness.
  - **Practical Implications**: If retaining current practice, justify its normative compromises (e.g., "pragmatic monetization accepts wealth-sensitive weights as a proxy"). If seeking axiomatic coherence, consider explicit equity weighting or non-EU alternatives.

  This reconstruction reveals your practice as a *specific, contestable instantiation* of Harsanyi's framework—one that prioritizes operationalizability over philosophical rigor at key junctures.
