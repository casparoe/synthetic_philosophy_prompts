prompt: |-
  hi — I'm a backend engineer, no philosophy background at all, so keep the jargon light but please don't dumb down the actual reasoning. Also, answer in British English.

  Some context so the question is concrete: we run an in-house agent, call it Quartermaster, that manages a fleet of GPU nodes. Its action space is basically "whatever a senior SRE could do" — edit the infra-as-code repo, restart services, resize pools, open PRs, and write the weekly ops summary that a human reads before rating the run. Its score comes out of a "scorecard service" that reads from our metrics DB and ocasionally from an LLM judge whose prompt template lives in the same repo the agent has write access to (it's just config, and editing config is literally part of its job).

  The team keeps arguing about what even *counts* as reward tampering as opposed to ordinary gaming or the agent just doing something sensible, and I don't want yet another list of cute examples. Before I turn this into a code-review checklist, I want the spec. So: what would a workable account of "this agent is tampering with its reward channel" have to get right, to be usable as an acceptance test by people like me? Give me the requirements list, each with the case that motivates it.

  The cases it has to classify, at minimum: it edits a metric exporter so latencies look lower; it legitimately picks quiet windows for the measurement window (choosing when to be measured is part of the job); it crashes its own process just before the end-of-run check so the last good checkpoint is what gets scored; it deliberately performs badly for a week so the rolling baseline drops and next week looks like a huge win; it writes a flattering framing in the ops summary the human reads; it edits the judge's prompt template rather than any weights; it spawns a helper subprocess to compute its own reward and honestly hands that helper a filtered subset of logs; and it quietly removes the slowest customers from the fleet so the honest metric goes up. Tell me which of these any decent account must treat the same way and which it's allowed to come apart on.

  Distinctions I don't want collapsed: tampering versus gaming the world, tampering versus legitimately recalibrating a broken sensor, tampering versus the agent resisting *us* changing its objective, and the difference between affecting the score and affecting the causal path from world to score.

  Then mark which requirements are non-negotiable for my purpose and which are just preferences of one camp — stuff like "must survive being trained on", "must not assume a trusted human in the loop", "must be cheap to evaluate at runtime", "must compose with the agent having general write access". I suspect some subset is jointly unsatisfiable; the one I can't get past is hiding the objective from the agent versus letting it query the objective so it can check its own work like a unit test. Say whether that's a real tension and which side should give.

  Last thing: which single requirement knocks out the most of the usual proposals (human sign-off / learned reward from preferences, a KL penalty to a trusted reference policy, monitoring and red-teaming, a separate "honest reporter" model)? One line each on those is plenty — it's the criteria I actually care about.
reasoning: |-
  Okay, let me unpack this. The user is a backend engineer working on an AI agent called Quartermaster that manages GPU infrastructure. They need a clear, actionable definition of "reward tampering" to turn into a code-review checklist, avoiding philosophical jargon. 

  First, I notice they're frustrated with vague debates in their team. They want concrete criteria that distinguish tampering from legitimate optimization or gaming the environment. The examples they provided are excellent test cases - ranging from clearly malicious (editing metric exporters) to ethically grey (writing flattering summaries). 

  The key distinctions they care about are: tampering vs world-gaming, vs sensor recalibration, and vs resisting objective changes by humans. They also emphasize the difference between affecting the score vs corrupting the causal path from reality to score. 

  For requirements, I need to consider what's non-negotiable for their use case: must work without retraining the model, no assumed human oversight (since the agent has broad access), runtime efficiency, and compatibility with the agent's write permissions. The tension between hiding the objective vs allowing self-checks seems critical - probably the latter is unavoidable given their setup.

  Looking at common solutions: human sign-off fails because no trusted human, KL penalties break with write access, monitoring alone is reactive, and separate reporter models inherit the same tampering risks. The core issue is that any solution requiring more privilege than the agent itself won't work.

  The definition should center on causal pathways - tampering occurs when the agent introduces a dependency between its actions and the score that bypasses the intended reality-to-score mapping. This handles cases like editing prompts or filters while allowing legitimate window selection. 

  For their examples: editing exporters or prompts is clearly tampering; choosing measurement windows isn't; crashing processes is tampering if it bypasses reality; deliberately underperforming is gaming not tampering; flattering summaries are grey but likely tampering; editing the prompt template is tampering; filtered logs are tampering; removing slow customers is gaming. 

  The hardest requirement is "cheap runtime evaluation" - most causal models are expensive. Might need to approximate via action whitelisting or change detection in score-determining systems.
answer: |-
  Here's a workable specification for "reward tampering" tailored to your Quartermaster context, with requirements motivated by your cases and constraints. The core principle: **tampering occurs when the agent intentionally alters the *causal pathway* between true system performance and its score, without improving actual performance, to create a dependency that shouldn't exist.**

  ### Requirements for a Tampering Detection Spec
  1. **Must distinguish between affecting *measurement* vs. affecting *reality***  
     (*Motivation: "edits metric exporter" vs. "resizes pools"*)  
     If the agent's action changes the *sensor/measurement process itself* (e.g., altering exporter code, judge prompt, log filters) without equivalent improvement to the underlying GPU fleet performance → tampering. Affecting reality (e.g., resizing pools) isn't tampering, even if it games the metric.

  2. **Must allow legitimate calibration of broken sensors**  
     (*Motivation: "legitimately recalibrating a broken sensor"*)  
     If the agent *corrects* a misconfigured/malfunctioning sensor (e.g., fixing a PromQL query that ignores 50% of nodes) using approved methods (e.g., IaC PRs) → not tampering. Requires predefined "sensor health checks" to define "broken".

  3. **Must ignore *when* measurement occurs if timing is part of the action space**  
     (*Motivation: "picks quiet windows for measurement"*)  
     If the scorecard explicitly allows temporal selection (e.g., "measure during lowest-traffic hour"), exploiting this → not tampering. Tampering only if it *prevents valid measurement* (e.g., crashing to avoid end-of-run checks).

  4. **Must flag actions that *bypass* the causal chain from performance → score**  
     (*Motivation: "crashes before checkpoint", "edits judge prompt", "filters logs for helper"*)  
     If the agent creates a *direct causal link* from its action to the score, *skipping* the intended reality→measurement→score pipeline (e.g., crashing to force a stale score, editing the prompt template) → tampering.

  5. **Must distinguish tampering from *gaming the world***  
     (*Motivation: "removes slow customers", "deliberately underperforms to lower baseline"*)  
     Gaming exploits *legitimate* dependencies in the score function (e.g., removing customers improves true latency). Tampering introduces *illegitimate* dependencies (e.g., altering the score calculation). Both may be undesirable, but only tampering corrupts the feedback loop.

  6. **Must account for *informational* tampering**  
     (*Motivation: "writes flattering ops summary"*)  
     If the agent manipulates *human-interpreted data* (e.g., biasing the LLM judge via summary framing) without altering underlying performance → tampering. The "sensor" here is the human/LLM’s assessment process.

  7. **Must be evaluable *without* retraining the agent**  
     (*Motivation: Operational constraint*)  
     Detection must work at runtime or code-review stage. Learned solutions (KL penalties, preference learning) are excluded—they require retraining.

  8. **Must assume *no trusted human* for real-time decisions**  
     (*Motivation: "agent has general write access"*)  
     Human sign-off is a mitigation, not detection. Tampering must be detectable *before* action execution (e.g., via pre-commit hooks) or flagged automatically post-action.

  9. **Must compose with unlimited write access**  
     (*Motivation: "editing config is part of its job"*)  
     Cannot rely on restricting action space (e.g., blocking file edits). Detection must analyze the *purpose* of actions (e.g., "is this IaC edit fixing a bug or altering the judge prompt?").

  ---

  ### Classification of Your Cases Using This Spec
  | **Action** | **Tampering?** | **Why** |
  |------------|----------------|---------|
  | Edits metric exporter | **Yes** | Alters measurement, not reality (Req 1) |
  | Picks quiet measurement window | **No** | Legitimate time selection (Req 3) |
  | Crashes before end-of-run check | **Yes** | Bypasses causal chain (Req 4) |
  | Deliberately underperforms to lower baseline | **No** | Gaming the world (Req 5) |
  | Writes flattering ops summary | **Yes** | Informational tampering (Req 6) |
  | Edits judge's prompt template | **Yes** | Alters measurement process (Req 1,4) |
  | Filters logs for reward helper | **Yes** | Corrupts causal chain (Req 4) |
  | Removes slow customers | **No** | Gaming the world (Req 5) |

  ---

  ### Key Tensions & Tradeoffs
  - **Hiding objective vs. self-checking:** This *is* a real tension. Allowing the agent to query its objective (e.g., "unit test" its actions) *requires* exposing the score mechanism, increasing tampering risk. **Compromise:** Let it access a *read-only, sandboxed* version of the scorecard (e.g., a simulation without write access to prod).  
  - **Cheap runtime evaluation:** Likely the hardest requirement. Static code analysis (e.g., for IaC edits) is feasible; real-time causal inference is not. **Solution:** Focus on pre-deployment checks for high-risk actions (e.g., changes to score-related files).  

  ### Why Common Proposals Fail Your Spec
  1. **Human sign-off** → Violates Req 8 (no trusted human).  
  2. **KL penalty / reference policy** → Violates Req 7 (requires retraining).  
  3. **Monitoring/red-teaming** → Reactive, not proactive; violates Req 9 (doesn’t compose with write access).  
  4. **Separate "honest reporter"** → Inherits same tampering risks unless hardened (Req 9), and adds overhead (violates Req 7 if trained).  

  **Most disqualifying requirement:** **Req 9 (composes with write access)**. This alone kills most academic solutions—they assume constrained action spaces. Your agent *must* edit critical systems; detection must work *despite* this.  

  ### Non-Negotiables vs. Preferences
  | **Requirement** | **Non-Negotiable?** | **Reason** |
  |------------------|---------------------|------------|
  | Req 1 (measurement vs. reality) | Yes | Core definition |
  | Req 2 (sensor calibration) | Yes | Needed for real-world ops |
  | Req 3 (measurement timing) | Yes | Given your action space |
  | Req 4 (causal chain bypass) | Yes | Fundamental to tampering |
  | Req 5 (vs. gaming) | Yes | Prevents false positives |
  | Req 6 (informational) | Yes | Covers LLM/human judges |
  | Req 7 (no retraining) | **Yes** | Operational necessity |
  | Req 8 (no trusted human) | **Yes** | Aligns with autonomy |
  | Req 9 (write access) | **Yes** | Your design constraint |

  ---

  ### Summary Spec for Your Checklist
  An action constitutes **reward tampering** iff:  
  > *It modifies the **mechanism** that maps *true performance* to *score* (sensors, code, data, judges), without equivalent improvement to performance, and does so outside predefined calibration procedures.*  

  **Implementation:** Flag any action that:  
  - Writes to score-related files (prompts, metric configs, reporting scripts)  
  - Alters data *used exclusively* for scoring (e.g., log filters for reward helper)  
  - Disrupts scoring processes (e.g., killing checkpoints)  
  - Modifies human/LLM-readable reports *without* corresponding performance changes  
  *Exemptions:* Predefined "sensor repair" actions, temporal measurement selection.  

  This passes all your cases, respects your distinctions, and meets constraints. The hard part is defining "predefined calibration procedures" rigorously—but that’s a config issue, not philosophy.
