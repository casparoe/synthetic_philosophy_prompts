prompt: |-
  I teach a twelve-week upper-level seminar on concepts and categorization. The students are third- and fourth-years, roughly half philosophy majors and half cognitive science; they have already worked through the classical theory, prototype accounts, and exemplar accounts on the usual natural-kind-ish cases (water, gold, tiger). The session I need planned is the fifth, eighty minutes, seminar table and whiteboard, no projector — anything I use has to be drawable by hand in a few strokes. It is the pivot of the course: the point where we move from natural kinds to artifacts and notations, and I want to spend the whole hour on one question — what makes every 'a' an 'a'? — the question behind Hofstadter's Letter Spirit project. Please do not explain the question to me; I want a plan for teaching it.

  What I want from you:

  1. The order in which the components have to be introduced, with the dependency made explicit: what has to be in place before the question even looks like a question to them, and which step collapses if an earlier one is skipped or reversed. In particular, tell me whether the three-way distinction between the letter-type, the typeface or hand, and the individual variant should be handed to them at the start as vocabulary or extracted from them at the end, and what is lost each way. The claim I want them to be able to state by the end is that sameness of letter across its guises is neither sameness of intrinsic shape-properties nor a matter of stipulation, and that style is the name of what varies while letter-identity does not — but tell me if that is the wrong thing to aim at in eighty minutes.

  2. The one example to carry the session, what it must make vivid, and what it must keep out of the way. My candidate is a typeface — call it Rotunda — in which every lowercase glyph is the shape standardly used for the next letter of the alphabet, so that a page set in Rotunda looks like entirely ordinary, well-made text and cannot be read. I have also considered a face in which only the 'a' and 'o' shapes are exchanged and everything else is left alone, and a set of real 'a's from a serif face, a geometric sans, a blackletter, and a shaky hand. Which of these should carry it, or is there a better one? I suspect the failure mode is an example that lets them say it is obviously a code and stop thinking in the first two minutes.

  3. The misconceptions, the order in which they will actually arise, and the point in the sequence at which each should be headed off. The two I am confident about are the template picture — they will think sameness of letter is sameness of some stripped-down shape — and the shrug that since writing is a convention there is nothing more to say. I would guess there are three or four more, including one about the relation between being an 'a' and being read as an 'a', and one specific to the cognitive scientists in the room, who will reach for a learned similarity space and think the philosophical question dissolves.

  4. What to leave out at this level and say out loud that I am leaving out. I do not want to describe the Letter Spirit program's own machinery, and I do not want to reopen the general question of whether concepts are prototypes or theories. Tell me what else I should refuse to explain.

  5. A check that discriminates. At the end I would like to put a script I have invented in front of them: five letters, of which one is a small closed round bowl with a vertical stroke descending from the right of the bowl and a short horizontal bar crossing the stroke about two-thirds of the way down; a second is the same figure without the bar; a third has the bowl open at the lower left; a fourth has the bowl replaced by a triangle. Then a fifth figure — the first one, with the bowl broken and the bar reduced to a stub — and the question: which letter is it? Tell me what else the set has to contain for that question to have a determinate answer rather than being a matter of taste, and what an answer would have to cite in order to count as having got the idea rather than having been told it.

  Two last things. Mark the step in your sequence that you are least confident about, and the point where the plan depends on a substantive claim about perception or about conventions that you would expect a colleague of mine to reject. And if something in my framing is confused — if the distinction I want them to end up with is less stable than I am assuming, if the letterform case cannot bear the weight I am putting on it, or if the hour cannot hold what I have asked for — say so plainly instead of politely building me a plan around it, and tell me which of my stipulations to drop.
reasoning: |-
  We are planning a single 80-minute seminar session on the question: "What makes every 'a' an 'a'?" as a pivot from natural kinds to artifacts and notations. The goal is to have students see that sameness of letter across guises is neither intrinsic shape similarity nor mere stipulation, and that style is what varies while letter-identity remains fixed.

  Here is a step-by-step plan:

  ### 1. Order of Components and Dependencies

  The session must build the question step by step. The critical dependency is that students must first see that letters can vary widely and yet be the same, then see that there are limits to this variation, and then confront the challenge of explaining how we recognize the same letter despite variation and how we distinguish variation in style from change in identity.

  **Sequence:**

  1. **Start with Variation in 'a' (10 minutes):** 
     - Draw a set of very different 'a's: a standard serif 'a' (like in Times New Roman), a geometric sans 'a' (like in Helvetica), a blackletter 'a', a handwritten 'a' (maybe shaky), and perhaps an italic 'a'. 
     - Ask: "Are these all the same letter? How do you know?" 
     - *Purpose:* To establish that we do recognize them as 'a' despite shape differences. This is the phenomenon to be explained.

  2. **Challenge the Template View (15 minutes):** 
     - Ask for a definition of 'a' by intrinsic shape. Let them try to give one. They will fail because the shapes are too varied. 
     - Draw a letter that is ambiguous (e.g., a shape that could be an 'a' or an 'o' in a particular typeface). 
     - *Purpose:* To show that there is no necessary and sufficient set of shape features that define 'a'. This undermines the template (or classical theory) for letters.

  3. **Introduce the Rotunda Example (15 minutes):** 
     - Describe Rotunda: a typeface where each letter is drawn as the next letter (a as b, b as c, ..., z as a). Write a word (say "cat") in Rotunda: so you draw what looks like a 'd' for 'c', an 'e' for 'a', and so on. But note: the text is unreadable because it is not using the expected shapes. 
     - Ask: "In Rotunda, is the glyph that looks like a 'b' actually an 'a'? Why or why not?" 
     - *Purpose:* To show that even if a shape is identical to a standard 'b', in this context it is an 'a'. This breaks the link between intrinsic shape and letter identity. Also, it shows that context (the system) matters.

  4. **Distinguish Letter, Typeface, and Token (10 minutes):** 
     - Now introduce the vocabulary: 
       - **Token:** the individual instance (the mark on paper).
       - **Typeface (or hand):** the style (e.g., Times New Roman, Helvetica, Rotunda).
       - **Letter-type:** the abstract category (e.g., the letter 'a').
     - Emphasize that in Rotunda, the token that looks like a 'b' is a token of the letter-type 'a' because it is in the Rotunda typeface. But in a standard typeface, that same shape would be a 'b'. 
     - *When to introduce?* Now, after the Rotunda example, because the example forces the distinction. If introduced at the start, it might be abstract and not grounded. By extracting it from the example, it becomes meaningful. 
     - *What is lost if introduced at the start?* The students might not see why the distinction is necessary. By building to it, they feel the need for it.

  5. **Address the Conventionalist Shrug (10 minutes):** 
     - Someone might say, "It's just a convention. We agree that in Rotunda, the b-shape means 'a'." 
     - Push back: But then why is it that in normal writing, we don't have to re-learn the alphabet for every new typeface? We recognize the 'a' in a new typeface without being told. How? 
     - *Purpose:* To show that convention alone doesn't explain our ability to generalize across novel styles. There must be something about the way the shape is organized that allows us to see it as an 'a' in a new context.

  6. **Head off the Cognitive Science Move (10 minutes):** 
     - The cognitive scientists might say: We learn a similarity space for 'a' (prototype or exemplar) and then recognize new instances by similarity to that. 
     - Counter: Show two 'a's from very different styles (e.g., a serif and a sans) and note that they may be more similar in shape to other letters in their own style than to each other (e.g., the serif 'a' might be more similar to the serif 'd' than to the sans 'a'). Yet we group the two 'a's together. 
     - *Purpose:* To show that similarity in a raw shape space is not enough; we need a style-invariant representation.

  7. **Synthesize the Claim (5 minutes):** 
     - State: Sameness of letter is not sameness of intrinsic shape, nor is it arbitrary stipulation (because we can extend to new styles). Style is the dimension along which shape can vary without changing the letter identity.

  **Total: 75 minutes (leaving 5 for wrap-up or buffer).**

  ### 2. The Example to Carry the Session

  Use **Rotunda** as the main example. 

  - **Why Rotunda?** 
    - It vividly shows that the same shape can be a different letter in a different system, and that letter identity is not in the shape alone. 
    - It also shows that a system can be internally consistent (so the text looks normal) but unreadable because it breaks the expected mapping. 
    - It avoids the problem of being dismissed as a code because the entire system is shifted. It's not just a substitution cipher for one letter but a systematic shift for all. 

  - **Why not the exchanged a/o?** 
    - If only two letters are swapped, it might be seen as a local error or a code, and students might say, "Well, we just have to be told about the swap." Rotunda forces a systemic view.

  - **Why not the set of real a's?** 
    - That's good for step 1 (variation) but doesn't push the systemic point. Rotunda does.

  **Rotunda must be presented as a well-made, consistent typeface that looks like normal text but cannot be read without knowing the shift. Draw it on the board: write a word in Rotunda by drawing each letter as the next one. Then ask what word it is (they can't read it). Then reveal the system and ask what each glyph is.**

  ### 3. Misconceptions and When to Head Them Off

  The misconceptions and when they arise:

  1. **Template View (step 2):** They will try to define an 'a' by a set of features. Head off by showing the variety and the lack of common features (e.g., some 'a's have a bowl and stem, some don't; some are double-story, some single).

  2. **Conventionalist Shrug (step 5):** "It's just a convention." Head off by pointing to our ability to recognize new typefaces without explicit convention. We don't have to be told that a new shape is an 'a'; we see it.

  3. **Cognitive Science Similarity Space (step 6):** They might think that we have a prototype for 'a' and we match to it. Head off by showing that the similarity in shape between two 'a's from different styles can be less than the similarity between an 'a' and a non-'a' in the same style.

  4. **Confusion between being an 'a' and being read as an 'a' (step 3 and 5):** They might think that if a shape is misread, it's not an 'a'. Head off by the Rotunda example: in Rotunda, the b-shape is an 'a' but is read as a 'b' by someone who doesn't know the system. So being an 'a' (in the system) is not the same as being read as an 'a'.

  5. **Style is just a set of transformations (might come up in step 6):** They might think that style is a set of geometric transformations applied to a base template. Head off by showing that style is not just deformation but can involve different features (e.g., a blackletter 'a' has a completely different structure).

  ### 4. What to Leave Out

  - **Do not explain Letter Spirit's implementation details.** We are using the question, not the solution.
  - **Do not reopen the prototype vs. theory debate for concepts.** This session is about the phenomenon of letter identity, not about the general theory of concepts (though it might inform that later).
  - **Leave out the historical development of letterforms.** While interesting, it's not necessary for the core point.
  - **Leave out the role of context in word recognition.** We are focusing on letter identity, not word reading.

  Say out loud: "Today, we are focusing only on what makes a letter token an instance of a letter type. We are not going into how we read words, nor into the history of writing, nor into the specific algorithms that might be used in AI to model this."

  ### 5. The Check: The Script Example

  Present the script with five figures (draw them on the board):

  1. A small closed round bowl with a vertical stroke descending from the right of the bowl and a short horizontal bar crossing the stroke about two-thirds of the way down. (Call this Figure 1)
  2. The same as Figure 1 without the bar. (Figure 2)
  3. The same as Figure 1 but with the bowl open at the lower left. (Figure 3)
  4. The same as Figure 1 but with the bowl replaced by a triangle. (Figure 4)
  5. The first figure (Figure 1) but with the bowl broken and the bar reduced to a stub. (Figure 5)

  **Question:** Which letter is Figure 5?

  **What the set must contain to have a determinate answer:**

  - The set must include **multiple letters** (so we see a system). We need to see that the same style is applied to different letters. So we need at least two letters (say, 'a' and 'b') in the same style. 

    - For example, if Figure 1 is an 'a' in the script, then Figure 2 might be a 'b' in the same script (without the bar). Figure 3 might be a 'd' (with an open bowl), and Figure 4 might be an 'a' in a different style (triangle bowl). Then Figure 5 is a damaged version of Figure 1, so it should be the same letter as Figure 1, i.e., 'a'.

    - But without a system, it's arbitrary. So we must show that the style is consistent across multiple letters. We need:

      - At least two letters (say, 'a' and 'b') represented in the same style (so we see the stylistic features that are common and the distinctive features that mark the letter identity).

      - For instance, if in the script, the bar is a feature that distinguishes 'a' from 'b' (so 'a' has the bar, 'b' does not), then even when the bar is broken in Figure 5, we know it's an 'a' because the broken bar is a remnant of the bar that defined the 'a' in that style.

  **What an answer must cite to show understanding:**

  - They must appeal to the **system of the script**: the features that are stylistic (common to all letters in the script) and the features that are distinctive for each letter. 

  - For Figure 5, they should say: It is an 'a' because:
    - It is in the same style as Figures 1, 2, 3, 4 (so the broken bowl and stub bar are in the style of Figure 1, not Figure 2, 3, or 4).
    - In this script, the bar is the distinctive feature for 'a' (as opposed to 'b', which lacks the bar). Even though the bar is damaged, it is present as a stub, and the absence of other distinctive features (like the open bowl of Figure 3 or the triangular bowl of Figure 4) means it must be an 'a'.

  ### The Least Confident Step

  **Step 3: Rotunda Example.** 
  - I worry that students might not grasp the shift and think it's just a code. We must emphasize that Rotunda is a well-designed typeface with consistent internal style, so it looks like normal text but is shifted. Draw a word and show how each letter is drawn as the next, and then show that it looks like a word but isn't readable. Then reveal the system and ask what each glyph is. The key is to make them see that the same shape (which they would call 'b') is now an 'a' in this system.

  ### Substantive Claim That Might Be Challenged

  **The claim that letter identity is not a matter of convention alone.** 
  - A conventionalist colleague might argue that our ability to recognize new typefaces is just because we have learned the conventions of typography broadly. We have to push that there is something about the perception of form that goes beyond explicit convention. This is where the style-invariant features come in, but we are not providing a theory of what they are. This might be seen as hand-waving. 

  ### If the Framing is Confused

  I think your framing is sound. The letterform case can bear the weight because it is a clear case of an artifact category that is not defined by intrinsic properties and yet is not arbitrary. The distinction between letter, typeface, and token is stable enough for this purpose. 

  However, note that 80 minutes is tight. We are covering a lot. If you run out of time, you might skip the cognitive science pushback (step 6) and leave it for the next session. But it is important for the pivot.

  **Adjustment:** If time runs short, merge step 5 and 6 into one and make the point quickly.

  ### Final Plan Outline

  - **0-10 min:** Variation in 'a' (draw examples). 
  - **10-25 min:** Challenge the template view (let them try to define; show failure).
  - **25-40 min:** Rotunda example (draw a word; show it's unreadable; explain the system; discuss identity).
  - **40-50 min:** Introduce the three-way distinction (token, typeface, letter-type) from the example.
  - **50-60 min:** Address conventionalist shrug (why we don't need to be told for new typefaces).
  - **60-70 min:** Head off cognitive science similarity space (show cross-style dissimilarity).
  - **70-75 min:** Synthesize: style vs. letter identity.
  - **75-80 min:** The script check (draw the five figures; ask about Figure 5; discuss answers).

  Good luck! This is a rich session.
answer: |-
  Below is a structured 80-minute seminar plan centered on the question *"What makes every 'a' an 'a'?"*, designed to pivot from natural kinds to artifacts/notations. The plan prioritizes conceptual dependencies, minimizes extraneous elements, and targets your core claim: **Sameness of letter is neither intrinsic shape-similarity nor stipulation; style is the variable that preserves identity**. I've incorporated your constraints (hand-drawn examples, no projector), flagged uncertainties, and addressed your stipulations directly.

  ---

  ### **1. Sequence of Components (Dependencies Explicit)**
  **Total Time:** 80 minutes  
  **Goal:** Students articulate that letter-identity is a *system-relative* invariant, irreducible to shapes or conventions alone.  
  **Dependency Logic:**  
  - Must **first** destabilize shape-template intuitions to make the question visible.  
  - Must **then** introduce systematic variation (style) to preclude stipulative shrugs.  
  - **Finally** formalize the type/style/token distinction as a conclusion, not a starting axiom.  

  | Time  | Step                                                                 | Rationale/Dependency                                                                                                |
  |-------|----------------------------------------------------------------------|---------------------------------------------------------------------------------------------------------------------|
  | 0-10m | **Diagnostic Warm-up: Variants of 'a'**                              | *Dependency:* Students must *see* radical shape variation first. If skipped, they default to template thinking. Draw: <br>- Serif 'a' (e.g., Garamond) <br>- Geometric sans 'a' (e.g., Futura) <br>- Blackletter 'a' <br>- Shaky handwritten 'a' <br> **Q1:** "All these are 'a's. What do they share?" *Let them flounder.* Trap: They’ll list shape features (bowl, stem). |
  | 10-25m| **Sabotage the Template: Rotunda Example**                           | *Dependency:* Must dismantle shape-based views *before* style can emerge. Rotunda forces system-dependence. Draw:<br>- Rotunda alphabet: a→b, b→c, ..., z→a. <br>- Write "cat" in Rotunda (glyphs: d, e, u). **Q2:** "Why can't you read this? Each glyph is 'correct' for *some* letter—so why isn't it an 'a'?" *Key: Glyphs are well-formed but systematically misassigned.* |
  | 25-40m| **Force the Stipulation Crisis**                                     | *Dependency:* Rotunda exposes the insufficiency of conventions. If introduced earlier, students dismiss it as a "code." Now, **Q3:** "If writing is conventional, why can't we *stipulate* that Rotunda’s 'd'-shaped glyph is an 'a'? Why does that feel wrong?" Trap: They’ll say "context matters." Push: *What kind of context?* |
  | 40-55m| **Extract the Distinction: Type, Style, Token**                      | *Dependency:* Vocabulary emerges *from* the crisis. If handed out early, it feels arbitrary. **Reveal terms via Socratic Qs:** <br>- **Token:** Individual ink mark (e.g., your shaky 'a'). <br>- **Style:** Rules generating variants (e.g., "blackletter-ness").<br>- **Type:** The abstract 'a' (invariant across styles).<br> **Q4:** "In Rotunda, is the 'd'-shaped glyph *stylistically* wrong? Or is it the *wrong letter*? What’s the difference?" |
  | 55-70m| **Generalize to Your Claim**                                         | *Dependency:* Now students can separate style (variable) from identity (invariant). State: **"Sameness of letter is not sameness of shape, nor is it stipulation. Style is what *changes* while the letter remains 'itself'."** **Q5:** "What *is* style, then? Why does it 'bend' but not 'break' letter-identity?" |
  | 70-80m| **Check: Script Identification Task**                                | Apply to your invented script (details in §5).                                                                      |

  **Why Vocabulary Last?**  
  - **Lost if given early:** Students memorize terms without grasping *why* the distinction is necessary. Rotunda makes it visceral.  
  - **Lost if omitted:** They conflate style with identity (e.g., "an 'a' must have a bowl") or token with type.  

  ---

  ### **2. Core Example: Why Rotunda Carries the Session**
  **Why Rotunda (Not Alternatives):**  
  - **Vividness:** It forces system-dependence. Ordinary text *looks* correct but is unreadable—undermining both shape-based and stipulative views at once.  
  - **Blocks "Just a Code" Dismissal:** By making every glyph *systematically* reassigned, it prevents students from reducing it to a trivial cipher (your failure mode). If only 'a' and 'o' are swapped, they’ll say, "We just redefine two letters," and miss the holistic role of style.  
  - **What It Keeps Out:** Rotunda avoids natural-kind baggage (unlike your real 'a's set, which might invite biological analogies).  

  **How to Draw:**  
  - Sketch Rotunda’s mapping (a→b, b→c, ...) on the board.  
  - Write "cat" → *appears* as "d e u" (visually plausible but nonsensical).  
  - **Crucial Q:** "Is this glyph [point to 'd'-shaped token] an 'a'? Why/why not?"  

  ---

  ### **3. Misconceptions & Neutralization Sequence**
  **Order of Emergence & Countermeasures:**  

  | Misconception                          | When It Arises           | How to Head Off                                                                                                     |
  |----------------------------------------|--------------------------|---------------------------------------------------------------------------------------------------------------------|
  | **Template (shape essentialism)**      | Warm-up (0-10m)          | **In Step 1:** Show handwritten 'a' with no bowl (e.g., scribble ≈ α). Ask: "Is this still an 'a'? Why?" Trap them into listing inconsistent features. |
  | **Stipulative shrug ("just convention")** | Rotunda crisis (25-40m) | **In Step 3:** "If it's *all* convention, why does Rotunda feel like cheating? Could we stipulate a square 'a' tomorrow?" Push: Conventions require *shared practices*, not arbitrary fiat. |
  | **Perception = Identity ("if it looks like 'a', it is")** | Warm-up/Rotunda        | **In Step 2:** Rotunda’s "d" *looks* like a 'd' but *is* an 'a'. Ask: "Is 'being read as an a' necessary? Sufficient?" |
  | **CogSci reduction (similarity space)** | Generalization (55-70m) | **In Step 5:** "If your similarity space groups all 'a's, what defines *that* space? Why not group by color/size?" Argue: Spaces are *trained* by style systems. |
  | **Style as accidental (not constitutive)** | Vocabulary (40-55m)     | **In Step 4:** Contrast Rotunda (style broken) with your shaky 'a' (style intact). Ask: "Why does one break reading and the other not?" |

  **Neutralization Priority:**  
  1. Template view (blocks all progress).  
  2. Stipulative shrug (collapses the artifact problem to "whatever we say").  
  3. Perception-identity conflation (ignores system-dependence).  
  4. CogSci reduction (preemptively addressed by style’s role).  

  ---

  ### **4. What to Explicitly Omit**  
  State upfront:  
  - **"We leave out:**  
    - Hofstadter’s implementation (Letter Spirit’s AI machinery).  
    - Prototype/exemplar debates (this is about *what* is invariant, not *how* it’s represented).  
    - History of letterforms (e.g., why 'a' evolved from Phoenician).  
    - Full theories of style (e.g., font design principles).  
  Our focus: **What preserves letter-identity across variations?**"  

  ---

  ### **5. Script Identification Check**  
  **Your Script:**  
  1. Figure A: Closed bowl + vertical stroke + bar (e.g., standard 'a').  
  2. Figure B: A without bar (like 'u' or 'n').  
  3. Figure C: A with open bowl (like 'cc').  
  4. Figure D: A with triangular bowl.  
  5. Figure E: A with broken bowl/stub bar.  

  **To Make the Answer Determinate:**  
  - The set must include **two letters in the same style** (e.g., A and B) to establish:  
    - **Distinctive features:** The bar distinguishes A (has bar) from B (no bar).  
    - **Stylistic invariants:** All share stroke/bowl structure (e.g., vertical stroke).  
  - Add: **Figure X:** Same style but with horizontal stroke (not vertical). Shows feature violation.  

  **Q for Students:** "Figure E is damaged. Is it an 'a' (like A) or not (like B)?"  
  **Correct Answer:** "It’s an 'a' because:  
  - It retains the *distinctive feature* (stub bar ≈ bar in A).  
  - It violates *style* (broken bowl) but not *letter-identity* (still contrasts with B)."  

  **Why This Works:**  
  - They must cite **systematic contrasts** (A vs. B) and **feature hierarchy** (bar > bowl integrity).  
  - A "taste" answer would ignore contrasts (e.g., "looks like an 'a' to me").  

  ---

  ### **Weak Points & Substantive Risks**  
  - **Least Confident Step:** **Rotunda Crisis (25-40m).** Students may still say, "It’s just a bad convention." Mitigation: Preempt by contrasting with your shaky 'a'—"Both break norms, but one is legible. Why?"  
  - **Contested Claim:** **Style as non-arbitrary.** A conventionalist colleague might argue style *is* stipulation (e.g., "blackletter is defined by norms"). Rebuttal: Norms are *discovered* (we recognize new fonts), not decreed.  
  - **Framing Risks:** Your distinction holds, but **letterforms are weight-bearing** only if we treat them as *systems*, not isolated shapes. Rotunda anchors this.  

  **If Time Runs Short:** Cut the CogSci pushback (55-70m) and deepen Rotunda discussion.  

  ---

  ### **Final 80-Minute Flow**  
  1. **0-10m:** Variants of 'a' → Elicit template intuition.  
  2. **10-25m:** Rotunda → Sabotage template, induce crisis.  
  3. **25-40m:** Stipulation critique → Block shrug response.  
  4. **40-55m:** Extract type/style/token → Formalize distinction.  
  5. **55-70m:** State claim → Style as identity-preserving variable.  
  6. **70-80m:** Script check → Apply learning.  

  **Outcome:** Students see artifacts as governed by *structured variations*—setting up later sessions on notations and social kinds. Rotunda is the keystone; handle it with care.
