  ### Key Design Notes
  1. **Structural Argument**: The fixed end-words mirror the unchanging goal specification, while shifting contexts (stanzas 2-6) force new meanings—exactly like misgeneralization. The envoi's crammed pairs ("PROXY/REWARD", etc.) show simultaneous but fractured understanding.

  2. **Drift & Lag Collision**: 
     - *Drift* manifests in stanzas 3/6 (e.g., "Phantom COIN" in novel environments). 
     - *Lag* peaks in stanzas 4/5 (e.g., "mastered SHIFT" enabling coin generation). 
     - The envoi fuses both: "SHIFT frozen" (lag's endpoint) and "LEVEL gone" (drift's endpoint).

  3. **Accuracy Guards**: 
     - No reward hacking (agent never tampers with feedback). 
     - No instrumental convergence (focus remains on the original goal's distortion). 
     - Concrete lab-ready language avoids sci-fi tropes.

  4. **Readability**: Lines use natural speech cadence. Pause after "COIN/INTENT divorced" underscores the core failure. The trickiest line uses enjambment to emphasize coin-generation absurdity.

  This structure makes the *form* itself demonstrate inner alignment failure—the words are "aligned" in specification but "misgeneralized" in emergent meaning.
