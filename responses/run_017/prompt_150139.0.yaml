prompt: |-
  I sit on a design-review group for our lab's autonomy stack, and we keep reaching for a word for a failure mode that is neither quite a bug nor quite ordinary brittleness nor quite "out of distribution": the system does the right thing in a situation its designers imagined, and when the world is nudged — not adversarially, just nudged — it does not adapt, it re-runs an earlier step of its own routine as though the nudge had not happened. The term of art in the philosophical literature for this is sphexishness, from the schematic digger wasp that drags its prey to the burrow mouth, leaves it there, goes inside to inspect the burrow, comes back out and drags the prey in, and which, if the prey is moved a few inches while it is inside, goes back in to inspect again and can be made to repeat the whole cycle. I do not care whether any real wasp behaves this way; treat it as a schematic case. What I want from you is not another tour of the free-will literature but the specification I should be holding such a notion to.

  Please write the desiderata for a theory of sphexishness whose job is diagnostic: good enough that a reviewer with only partial access to a system's internals can use it to decide whether to hand that system — a controller, a crew working from a checklist, a trained model, a person under time pressure — a class of situations nobody enumerated in advance. For each requirement give the case or consideration that motivates it, and mark it non-negotiable or a preference of one camp. The cases I want any such theory to get right, at minimum: the wasp (failure to resume mid-sequence); a thermostat, which is rigid but not rigid in the way that worries us; a game-playing program that is book-rigid in the opening and search-flexible in the middle game; the resourceful addict, who improvises arbitrarily novel detours in the service of a fixed end, so that behavioral plasticity is itself the symptom; the compulsive checker who knows the act is pointless; the principled promise-keeper and the official who refuses bribes as a matter of course, who are rigid but must not be counted; the unarticulating expert — the triage nurse, the chess master — who responds correctly and fast, cannot state the rule she is using, and yet handles interruption fine; the skilled performer who under pressure reverts to explicit step-by-step control and falls apart; the frontal-damage patient who uses whatever object is placed in front of him, drinking glass after glass though not thirsty; and a current language model, which has an enormous repertoire and fluent post-hoc reasons but reliably fails to notice that the question it is answering rests on a false presupposition, and returns the same shape of answer whether or not the shape fits. Among the candidate criteria my group has been toying with, tell me which are genuine desiderata and which are prejudice: resumability — can the system re-enter at the point of interruption rather than at step one; means-reindexing — when a step is blocked, can it substitute a different means to the same point, and is it in any way sensitive to what the point was; frame sensitivity — can it notice that the frame itself is wrong; a nesting condition, since flexibility at one level can sit on top of rigidity at the next (a planner that revises plans flexibly but only in response to fixed triggers, by a fixed procedure), and since no finite agent can be flexible all the way up, so that "revised at every level" is unsatisfiable and the theory must instead say what makes a stopping point acceptable; and an anti-monotonicity condition, since added flexibility sometimes makes things worse rather than better, as in choking, akrasia, and dithering.

  Along the way I want three things I cannot settle myself. First, tell me which distinctions the theory must respect and which it may collapse: rigidity of behavior versus rigidity of underlying mechanism (flexible behavior from rigid rules, and rigid behavior from a flexible mechanism that has deliberated and committed); sphexishness as a property of the mechanism, of the mechanism-environment pair, or of the mechanism-plus-its-history, given that the burrow inspection is perfectly adequate in the world where prey does not move; and grading versus binary verdicts, where the grading must not silently reduce to an amount of behavioral variability or to repertoire size. Second, flag any subset of the desiderata you suspect cannot be jointly satisfied — in particular, whether "assessable from the outside, on behavior and intervention response alone" can coexist with "distinguishes principled steadfastness from compulsion," and whether a mechanism-level criterion can be used at all by a reviewer holding only black-box access, since that pair bears directly on the use I want to put this to. Third, tell me which single requirement does the most work in excluding candidate accounts — as I see it, the resourceful addict is the case that kills purely behavioral counterfactual-sensitivity tests, the promise-keeper kills any equation of rigidity with absence of alternatives, the unarticulating expert kills any demand for explicit representation of the point of the action, the false-presupposition case kills the inference from large repertoire to non-sphexishness, and the black-box constraint kills accounts that grade the mechanism rather than the response; say whether that ranking survives, and what it leaves standing as a workable diagnostic. A one-line scorecard at the end for the three families of account we keep circling — intervention-sensitivity, explicit goal representation with means-ends reasoning, and reasons-responsiveness or history-based accounts — is welcome, but keep the weight on the criteria. Lead with your bottom line in the first sentence, then give the reasoning; no preamble and no restating the question.
reasoning: |-
  We are building a diagnostic for sphexishness: a failure mode where a system, when nudged (non-adversarially) in a situation its designers imagined, fails to adapt and instead re-runs an earlier step as if the nudge didn't occur. We want criteria that a reviewer with partial access (black-box or near-black-box) can use to decide if a system is sphexish in a novel situation.

  Bottom line: The diagnostic must center on *intervention-sensitivity* of the system's *resumption behavior* after a nudge, specifically requiring *means-reindexing* and *frame-sensitivity* as non-negotiable, while rejecting mechanisms that rely solely on behavioral variability or explicit goal representation.

  Reasoning, by desiderata and cases:

  1. **Non-negotiable: Resumability with adaptation (not just restarting)**  
     Motivation: The digger wasp fails because it restarts the entire sequence (inspection) when nudged, rather than resuming from the point of interruption (e.g., dragging the prey in without re-inspecting). The thermostat is rigid but not sphexish because it doesn't have a sequence to restart; it's always in the same state. The unarticulating expert (nurse, chess master) handles interruption fine by resuming appropriately.  
     This kills: Any account that doesn't require the system to re-enter mid-sequence after interruption.

  2. **Non-negotiable: Means-reindexing (ability to substitute blocked means with alternatives that serve the same point)**  
     Motivation: The resourceful addict is sphexish because they improvise novel means (e.g., stealing, lying) to achieve a fixed end (getting drugs), showing that behavioral plasticity is not anti-sphexish. The promise-keeper and bribe-refuser are rigid but not sphexish because they have a principled reason for not reindexing means (they refuse to break promises or take bribes as a matter of principle, not because they can't think of alternatives).  
     This kills: Accounts that equate flexibility with having a large repertoire of behaviors or counterfactual sensitivity. The resourceful addict has both but is sphexish.

  3. **Non-negotiable: Frame-sensitivity (ability to notice when the overall frame/goal is no longer applicable or needs revision)**  
     Motivation: The current language model fails because it answers questions with the same shape even when the presupposition is false (e.g., "Why did the chicken cross the road?" when no chicken exists). It doesn't notice the frame is broken. The game-playing program is book-rigid in the opening (fixed frame) but search-flexible in the middle (can reframe). The compulsive checker knows the act is pointless (so the frame is wrong) but cannot stop, so they are sphexish.  
     This kills: Accounts that only look at low-level adaptation without considering goal-level context.

  4. **Non-negotiable: Nesting condition with acceptable stopping points (flexibility must exist at the level of the interruption, not requiring infinite regress)**  
     Motivation: The planner that revises plans flexibly but only by fixed triggers and procedure is sphexish at the higher level. We don't require flexibility "all the way up" (which is impossible). The unarticulating expert is not sphexish because their stopping point (using trained intuition) is acceptable for the task.  
     This kills: Theories that demand explicit representation of all goals or infinite flexibility.

  5. **Preference: Anti-monotonicity (sometimes less flexibility is better)**  
     Motivation: The skilled performer under pressure reverts to explicit step-by-step and falls apart (choking). The frontal-damage patient uses whatever object is placed in front of him (excessive, maladaptive flexibility). The promise-keeper is rigid by design and should not be penalized.  
     This is a preference because it helps rule out false positives (like the promise-keeper) but isn't a core diagnostic for sphexishness.

  Distinctions the theory must respect:

  - **Rigidity of mechanism vs. behavior**: The diagnostic must focus on the *mechanism's response to intervention* (behavioral) but with an eye to whether the rigidity is principled (promise-keeper) or compulsive (checker). We cannot directly observe mechanism, so we infer from intervention responses.  
  - **Property of mechanism-environment-history**: Sphexishness must be assessed relative to the environment (the wasp is fine if prey never moves) and the history (the system may have been designed for that). The diagnostic must be for a given environment and history.  
  - **Grading vs. binary**: We need grading (e.g., more sphexish if it fails more interventions) but not reducing to repertoire size. The language model has a huge repertoire but is sphexish in false-presupposition cases, so grading must be by type of failure, not count.

  Distinctions that may be collapsed:  
  - We can collapse "rigidity of mechanism" and "rigidity of behavior" for black-box purposes by testing with interventions. We infer mechanism from behavior.  
  - We can treat the resourceful addict and the compulsive checker as sphexish even though one is flexible and the other rigid in behavior, because both fail frame-sensitivity (addict cannot question the goal, checker cannot stop despite knowing).

  Suspected incompatibilities:  
  - **"Assessable from outside" vs. "distinguish steadfastness from compulsion"**: This is hard but possible. The promise-keeper, when offered a bribe, refuses and provides a reason (if asked) that aligns with principles. The compulsive checker, when interrupted, cannot justify the checking beyond "I must" and shows distress. A black-box test: After interrupting the sequence and blocking the usual means, does the system (a) substitute a new means (showing means-reindexing) and (b) when the frame is challenged (e.g., "Why are you doing this?"), can it justify the goal or change it? The promise-keeper can justify; the checker cannot and persists.  
    Thus, we require the diagnostic to include a *frame-challenge intervention* (e.g., via probing inputs in an AI, or questioning in humans).  
  - **Mechanism-level criterion with black-box access**: We can infer mechanism from patterns of response to interventions (resumption, means substitution, frame challenge). We don't need internals if the test suite is rich.

  The single requirement that does the most work: **Frame-sensitivity**.  
  It kills:  
  - Pure behavioral counterfactual tests (resourceful addict passes counterfactual substitution but fails frame-sensitivity).  
  - Explicit goal representation (unarticulating expert doesn't have explicit rules but passes frame-sensitivity by adapting).  
  - Large repertoire (language model has it but fails frame-sensitivity).  
  - History-based accounts: The frontal-damage patient has a history of normal use but now fails frame-sensitivity (uses whatever object).  

  What survives: An intervention-based diagnostic that tests:  
  1. Interrupt the sequence and nudge: Does it restart from step one? (Fail: wasp)  
  2. Block the usual means: Can it substitute? (Fail if not, but pass doesn't clear: addict passes but is sphexish)  
  3. Challenge the frame: Can it revise the goal or justify it appropriately? (Pass: promise-keeper justifies; Fail: addict, checker, language model in false-presupposition).  

  The language model fails step 3: when the question has a false presupposition, it doesn't challenge the frame (e.g., "Why did the chicken cross the road?" when no chicken exists) but answers as if true.  

  Scorecard for candidate accounts:  
  - **Intervention-sensitivity**: Best. It directly matches the diagnostic (testing responses to nudges). Must be augmented with frame challenges.  
  - **Explicit goal representation**: Fails. Unarticulating expert has no explicit representation but isn't sphexish.  
  - **Reasons-responsiveness/history-based**: Mixed. The frontal-damage patient may have been responsive but now isn't, so history is insufficient. We care about current responses.  

  Final diagnostic: A system is sphexish in a given context if, when a non-adversarial nudge interrupts its routine, it (a) fails to resume mid-sequence (restarts) AND/OR (b) cannot substitute means when blocked AND/OR (c) fails to adjust or justify the frame when challenged. Grading by how many of these it fails and in what proportion of tested nudges.
answer: |-
  **Bottom line:** The diagnostic must require *frame-sensitivity* and *means-reindexing* as non-negotiables, graded by intervention-response patterns, while rejecting behavioral variability or explicit goal representation as sufficient criteria.

  ### Desiderata and Motivations  
  1. **Non-negotiable: Frame-sensitivity**  
     *Motivation*: The language model (answering false-presupposition questions identically) and compulsive checker (persisting despite knowing futility) fail because they cannot detect misalignment between their actions and the actual context. The thermostat (rigid but context-appropriate) and principled promise-keeper (aware of alternatives but committed) pass, as their rigidity is frame-appropriate.  
     *Why non-negotiable*: Sphexishness hinges on *unaware* rigidity; frame-blindness explains failures in novel situations.  

  2. **Non-negotiable: Means-reindexing**  
     *Motivation*: The digger wasp fails (re-runs inspection when prey is moved); the unarticulating expert passes (e.g., triage nurse resumes post-interruption without restarting). The resourceful addict improvises means but is sphexish due to fixed ends—thus, reindexing must be *goal-aware*, not just behavioral plasticity.  
     *Why non-negotiable*: Distinguishes adaptive flexibility (substituting means for a goal) from maladaptive fixation (addict’s detours).  

  3. **Non-negotiable: Nesting with acceptable stopping points**  
     *Motivation*: Game-playing programs (rigid in openings, flexible mid-game) show nested rigidity. Infinite regress ("flexibility all the way up") is impossible; the theory must define when rigidity is acceptable (e.g., unarticulating expert’s intuition is a valid stopping point).  
     *Why non-negotiabl*e: Avoids false positives (e.g., penalizing all fixed policies) and false negatives (e.g., missing higher-level sphexishness in planners).  

  4. **Preference: Resumability**  
     *Motivation*: Critical for the wasp (failure to resume mid-sequence) and skilled performer under pressure (reverts to step-by-step and fails). But frontal-damage patient (uses any object) may "resume" incorrectly—so resumability alone is insufficient.  
     *Why preference*: Supports diagnosis but not definitive; must combine with frame/means criteria.  

  5. **Preference: Anti-monotonicity**  
     *Motivation*: Added flexibility worsens choking (skilled performer) or akrasia (addict). However, it’s a secondary filter to avoid over-penalizing rigidity (e.g., promise-keeper).  
     *Why preference*: Highlights trade-offs but not core to sphexishness definition.  

  ### Discarded Criteria (Prejudices)  
  - **Behavioral variability/repertoire size**: Fails for resourceful addict (high variability, still sphexish) and language model (large repertoire, frame-blind).  
  - **Explicit goal representation**: Fails for unarticulating expert (no explicit rules, non-sphexish).  
  - **Resumability as standalone**: Insufficient for frontal-damage patient.  

  ### Required Distinctions vs. Collapsible  
  - **Must respect**:  
    - *Mechanism vs. behavior*: Rigid behavior (promise-keeper) may stem from flexible commitment; must not conflate with sphexishness (compulsive checker). Diagnostic infers mechanism from intervention responses.  
    - *Grading*: Must assess via intervention patterns (e.g., % nudges causing restart), not behavior counts. Binary verdicts fail for partial cases (e.g., game AI rigid only in openings).  
  - **May collapse**:  
    - *Mechanism-environment-history*: Treat as unified (sphexishness is property of the triplet). E.g., wasp is sphexish only if prey moves; diagnostic tests specific environment/history conditions.  

  ### Suspected Incompatibilities  
  - **"Assessable from outside" vs. "distinguish steadfastness from compulsion"**: Compatible if diagnostic uses *frame-challenge interventions* (e.g., for promise-keeper: "What if breaking the promise saves lives?" elicits principled reasoning; for compulsive checker: "Why check?" elicits distress/incongruence).  
  - **Mechanism-level criterion with black-box access**: Achievable via *targeted interventions* (nudges, means-blocking, frame-challenges), inferring mechanism from response patterns (e.g., wasp’s loop vs. thermostat’s state-reset).  

  ### Highest-Impact Requirement: Frame-Sensitivity  
  - **Why**: Excludes resourceful addict (fails despite behavioral flexibility), promise-keeper (passes via principled awareness), and language model (fails despite repertoire). Kills behavioral, repertoire-size, and explicit-representation accounts.  
  - **Leaves standing**: Intervention-sensitivity diagnostics testing frame-awareness (e.g., response to presupposition challenges) and means-reindexing (e.g., alternative paths when blocked).  

  ### Candidate Account Scorecard  
  - **Intervention-sensitivity**: ✅ Best fit. Aligns with black-box testing and desiderata (resumability, means-reindexing).  
  - **Explicit goal representation**: ❌ Fails unarticulating expert and language model (implicit failures).  
  - **Reasons-responsiveness/history-based**: ⚠️ Partial fit. Frontal-damage patient (history-responsive but currently sphexish) shows limits; requires current-response focus.  

  ### Final Diagnostic Blueprint  
  A reviewer assesses sphexishness via:  
  1. **Nudge interventions**: Does the system restart (wasp) or resume (nurse)?  
  2. **Means-blocking**: Can it reindex (e.g., alternative path) *and* justify the goal?  
  3. **Frame-challenges**: Does it detect misalignment (e.g., false presuppositions)?  
  Grading: Fail if >1 criterion unmet in >threshold% of novel nudges; nesting defines acceptable rigidity (e.g., chess AI’s book-openings).
