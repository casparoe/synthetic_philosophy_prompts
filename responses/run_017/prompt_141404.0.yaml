prompt: |-
  I'm a PhD student in political theory working on intergenerational ethics, and I'm trying to decide whether to accept the strong longtermist package: that, given the expected size of humanity's future, the effects of our actions on the very long run should dominate near-term considerations in almost every choice we face. Rather than read further into the literature, I want the specification first. Write the desiderata that a theory of the value of affecting the far future would have to satisfy for that conclusion to be warranted, with the case or consideration behind each requirement.

  Fix the purpose as follows: the theory is to serve someone who must choose, with a fixed budget, between a near-term intervention with well-understood benefits and an intervention that raises the probability that humanity survives to a vastly larger future by some small, disputed margin. Given that purpose, the list has to do at least this much work:

  Say what carries the value in the first place — the existence of future people, their welfare, or the character of the civilisation that results — and make the choice matter, since the three come apart in the case where an action slightly increases the chance of survival while slightly degrading the expected quality of the future conditional on surviving. I want that case, or a better one, placed at the centre and stated precisely enough to be reusable.

  Handle the fact that which people exist later depends on what we do now, so that most of the value produced is value for people who would not otherwise have existed; any requirement that an outcome can only be better if someone is better off will therefore do a great deal of work, and I want it made explicit whether that is a genuine desideratum or a party-line commitment of person-affecting views.

  Distinguish extinction from other permanent losses: a future permanently capped at a fraction of its potential, a future in which humanity is replaced by successors who do not value what we value, a slow decline rather than a sudden end, and a case in which the future is large but we have strong reason to think it will be bad.

  Say whether the theory must deliver determinate expected-value verdicts from astronomical stakes under severe cluelessness about flow-through effects, or whether refusing to do so is itself an acceptable answer — and mark this as negotiable or not.

  Finally, flag any pair of requirements you think cannot be jointly satisfied, since if the list is internally unsatisfiable that is the result I most want; tell me which single requirement does the most to exclude the strong longtermist conclusion; and tell me which items on the list are really just preferences of one camp that I should be free to drop. Skip scoring the standard families of views against the list — I will do that myself once I have the standard.
reasoning: |-
  We are constructing a set of desiderata for a theory of the value of affecting the far future that would support the strong longtermist conclusion: that the effects on the very long run dominate almost every choice. We fix the purpose: choosing between a near-term intervention with well-understood benefits and an intervention that slightly increases the probability of humanity surviving to a vastly larger future (with a disputed margin). The theory must guide such a choice.

  We'll list the desiderata, each with a case or consideration that motivates it. We'll address:
  1. What carries the value (existence, welfare, or character of civilization) and how they come apart.
  2. Handling the non-identity problem (value for people who wouldn't otherwise exist).
  3. Distinguishing extinction from other permanent losses.
  4. Handling severe cluelessness (whether we must have determinate expected value or can refuse).
  5. Flag any conflicting requirements, identify the requirement that most excludes strong longtermism, and note which items are camp-specific and droppable.

  We structure each desideratum with:
  - A label.
  - The requirement.
  - The motivating case or consideration.

  ---

  **Desiderata for a Theory of the Value of Affecting the Far Future**

  **D1. Specification of the Value-Bearing Element (The "What" of Value)**
     - *Requirement*: The theory must specify what exactly carries value: the existence of future people, their welfare, or the character of the resulting civilization (or some combination). It must also resolve how these elements interact, especially when they conflict.
     - *Motivating Case*: Consider an intervention that slightly increases the probability of humanity surviving to a vast future (say, by reducing existential risk by an absolute 0.0001%) but, conditional on survival, slightly degrades the expected quality of that future (e.g., by making it slightly more likely that the future civilization is authoritarian rather than liberal, or by slightly reducing average welfare). The near-term intervention has well-understood, significant benefits for existing people (e.g., curing a disease that affects 10 million people). The theory must be able to compare these options. If value is carried solely by the number of future people, then the survival-increasing intervention might dominate. If value is carried solely by average welfare, then the degradation might tip the balance toward the near-term intervention. If it's the character of civilization (e.g., the realization of justice), then the degradation might be decisive. The theory must specify and justify the weighting.

  **D2. Non-Identity Robustness (Handling the Creation of New People)**
     - *Requirement*: The theory must be able to assign value to outcomes in which the people who exist are different from those who would have existed otherwise. It must not require that an outcome is better only if it makes some particular person better off (a condition that would fail for most future-affecting actions because the future people wouldn't exist otherwise).
     - *Motivating Consideration*: The survival-increasing intervention creates a vast number of people who would not otherwise exist. If the theory requires that an outcome can only be better if it benefits at least one person without harming any (the Person-Affecting Principle in its strong form), then it might be unable to assign value to the survival scenario because there is no one who exists in both scenarios to compare. This would make the survival-increasing intervention incomparable or neutral, which might rule out strong longtermism. The theory must either reject the strong Person-Affecting Principle or provide an alternative way to handle non-identity cases.

  **D3. Extinction-Distinction (Differentiating Extinction from Other Permanent Losses)**
     - *Requirement*: The theory must distinguish between (a) extinction (humanity ends), (b) a future permanently capped at a fraction of its potential (e.g., a catastrophic event reduces the maximum possible population to 1 billion forever), (c) a future in which humanity is replaced by successors with different values (e.g., an AI-driven civilization that does not value human flourishing), (d) a slow decline (e.g., a long period of stagnation followed by extinction), and (e) a large future that we have strong reason to believe is bad (e.g., full of suffering). It must assign different values to these scenarios and explain why.
     - *Motivating Case*: The survival-increasing intervention might only avert extinction, but what if the alternative is one of the other losses? For instance, if the intervention only prevents extinction but leaves a high chance of a capped future, while the near-term intervention improves the quality of a capped future, then the choice is unclear. Moreover, if the future is large but bad (e.g., a "dystopia"), then increasing its probability might be negative. The theory must specify how it values these scenarios relative to extinction and near-term benefits.

  **D4. Cluelessness Tolerance (Handling Severe Uncertainty)**
     - *Requirement*: The theory must state whether it is acceptable to refuse to assign a determinate expected value to an intervention due to severe cluelessness about its long-term effects. Alternatively, it must provide a method for assigning expected value even under extreme uncertainty about the flow-through effects of interventions over the very long term.
     - *Motivating Consideration*: The survival-increasing intervention's effect on the far future is highly uncertain (disputed margin). There might be unknown second-order effects: e.g., reducing one existential risk might increase another, or the intervention might change the trajectory of civilization in ways that are hard to predict. The near-term intervention has well-understood effects. If the theory requires determinate expected value assignments, then it must provide a way to handle this uncertainty (e.g., by using a default such as the "neutrality" of unknown effects). If it allows refusal, then strong longtermism might not be warranted in practice because we are too clueless to justify prioritizing long-term interventions.

  **D5. Astronomical Stakes Sensitivity (Dominance of Large-Scale Futures)**
     - *Requirement*: The theory must be sensitive to the vast scale of the potential future. Specifically, if the potential future population is large enough (e.g., 10^20 people over the cosmic future), then even small changes in the probability of achieving that future should dominate any near-term effect that is not on a similar scale, unless the theory provides a discounting mechanism that is not arbitrary.
     - *Motivating Case*: The near-term intervention has a fixed, large benefit (e.g., saving 10 million lives). The long-term intervention has a very small absolute increase in the probability of survival (say, 0.0001%) but would, if successful, enable a future of 10^20 people. The expected number of lives saved by the long-term intervention is 0.0001% * 10^20 = 10^12, which is 100,000 times the near-term benefit. The theory must either endorse this kind of multiplication (making the long-term intervention dominate) or provide a principled reason not to (e.g., discounting for time, uncertainty, or moral relevance).

  **D6. Axiological Comparability (Making the Choice Matter)**
     - *Requirement*: The theory must ensure that the choice between the near-term and long-term intervention is non-trivial and that one can be better than the other. It must avoid incommensurability or incomparability between the two types of value (near-term and long-term) that would make the choice indeterminate.
     - *Motivating Case*: Using the same case as in D1, if the value of the long-term future is incommensurable with near-term welfare (e.g., because they are of different kinds, like justice vs. welfare), then the theory might not be able to say which intervention is better. But the strong longtermist conclusion requires that the long-term intervention is almost always better. The theory must establish a common currency (e.g., a utility measure) or a structured comparison (e.g., lexical priority) that allows for a verdict.

  **Conflicts, Exclusions, and Optionality**

  **Flagged Conflicts**:
  - *D2 (Non-Identity Robustness) and Strong Person-Affecting Views*: If D2 requires rejecting the strong Person-Affecting Principle, then it conflicts with any theory that holds that principle as fundamental. This might be unavoidable because the strong Person-Affecting Principle is incompatible with valuing the creation of new people in non-identity cases.
  - *D4 (Cluelessness Tolerance) and D5 (Astronomical Stakes Sensitivity)*: If we require determinate expected value (rejecting the refusal option in D4) and also require sensitivity to astronomical stakes (D5), then we must commit to multiplying tiny probabilities by huge stakes. But if we allow refusal (accepting cluelessness as a reason for inaction), then D5 might be undermined because we cannot justify the dominance.

  **The Requirement That Most Excludes Strong Longtermism**:
  - *D4 (Cluelessness Tolerance)*: If the theory allows that severe cluelessness about long-term effects is a reason to refuse to assign a positive expected value to the long-term intervention, then strong longtermism is blocked. This is because the entire case for the long-term intervention rests on our ability to assign a meaningful expected value to affecting the far future despite massive uncertainty.

  **Camp-Specific Desiderata (Optional)**:
  - *D2 (Non-Identity Robustness)*: The rejection of the strong Person-Affecting Principle is a commitment of total utilitarianism and other impersonal views but is rejected by some person-affecting views. If you are sympathetic to person-affecting views, you might drop this requirement or modify it to allow for a weaker person-affecting principle.
  - *D5 (Astronomical Stakes Sensitivity)*: This is a core commitment of strong longtermism. If you are skeptical of the idea that the vast scale of the future automatically dominates, you might drop this requirement and allow for discounting or other limits.

  **Conclusion**:
  This list is designed to be a standard against which you can evaluate theories. Note that the strong longtermist conclusion requires satisfying D1 in a way that emphasizes sheer scale (e.g., total utilitarianism), D2 (impersonal), D3 (valuing existence and scale over quality in some cases), D4 (assigning expected value under cluelessness), and D5 (dominance by astronomical stakes). The most critical point of contention is D4: if we are too clueless to assign expected values, then strong longtermism fails.

  Now, you can take this list and score various theories (e.g., total utilitarianism, average utilitarianism, person-affecting views, critical-level theories, etc.) to see which, if any, satisfy the desiderata sufficiently to warrant strong longtermism.
answer: |-
  Below is a structured list of desiderata for a theory of the value of affecting the far future to warrant the **strong longtermist conclusion** (i.e., that long-term effects dominate near-term considerations in almost every choice). Each desideratum is tied to a specific case or consideration, with explicit reasoning for its inclusion. The list addresses your core requirements: specification of value-bearing elements, non-identity problems, extinction distinctions, cluelessness tolerance, and internal coherence checks. The focal case for divergence is explicitly defined and centered.

  ---

  ### **Core Focal Case for Divergence**  
  **The Survival-Quality Tradeoff (SQT)**:  
  *An intervention that increases the probability of humanity surviving to a vast future by a small, disputed margin (e.g., reducing extinction risk by 0.001%) but, conditional on survival, slightly degrades the expected quality of the future (e.g., by increasing the probability of permanent civilizational flaws like tyranny, stagnation, or lower average welfare). This is compared to a near-term intervention with well-understood benefits (e.g., saving 1 million lives from malaria).*  
  **Why it matters**: The three value-bearing elements (existence, welfare, civilization character) come apart here. A theory must resolve whether the survival boost outweighs the quality degradation, or vice versa, to make the choice non-arbitrary.

  ---

  ### **Desiderata List**  
  1. **Explicit Axiological Specification (What Carries Value?)**  
     - **Requirement**: The theory must specify whether value derives from:  
       (i) The *existence* of future people (e.g., total utilitarianism),  
       (ii) Their *welfare* (e.g., average utilitarianism), or  
       (iii) The *character of civilization* (e.g., achievement of justice, knowledge, or other non-welfarist goods).  
       It must also clarify how these elements interact when they conflict (e.g., via aggregation, lexical priority, or thresholds).  
     - **Case-Driven Reason**: Without this, the SQT is unresolvable. For example:  
       - If value comes only from *existence*, the survival boost dominates.  
       - If value comes only from *average welfare*, the quality degradation may favor the near-term intervention.  
       - If value comes from *civilizational character*, the degradation might be decisive.  
     - **Non-Negotiable**: Yes. Without this, the theory cannot guide the focal choice.

  2. **Non-Identity Robustness (Handling Different Future People)**  
     - **Requirement**: The theory must assign value to outcomes where future populations would not exist at all if not for present actions (the non-identity problem). It must explicitly accept or reject the **Person-Affecting Restriction** (PAR): *"An outcome can only be better if it is better for particular individuals."*  
     - **Case-Driven Reason**: In the SQT, the survival-increasing intervention creates trillions of people who would otherwise never exist. If PAR is enforced, the intervention cannot be said to benefit these people (since they wouldn't exist otherwise), making it impossible to justify the survival boost as "better." This could nullify longtermism.  
     - **Non-Negotiable**: Yes. PAR is a foundational choice: accepting it undermines strong longtermism; rejecting it enables impersonal aggregation (e.g., "the world is better with more happy people").  
     - **Camp-Specific Flag**: PAR is a commitment of *person-affecting views* (e.g., Narveson, Harman). You may drop this requirement if you reject PAR, but it must be explicit.

  3. **Extinction-Distinction (Differentiating Catastrophic Losses)**  
     - **Requirement**: The theory must assign distinct values to:  
       - (A) **Extinction**: Humanity ends permanently.  
       - (B) **Capped Potential**: Survival with civilizational potential permanently reduced (e.g., a catastrophic event limits Earth's carrying capacity to 1 billion humans).  
       - (C) **Value Displacement**: Humanity replaced by alien or AI successors with radically different values (e.g., they preserve "life" but not human rights, art, or morality).  
       - (D) **Gradual Decline**: Slow trajectory toward extinction or irrelevance (e.g., centuries of stagnation).  
       - (E) **Large but Bad Future**: Survival with vast scale but low average welfare (e.g., dystopian suffering).  
     - **Case-Driven Reason**: In the SQT, the survival-boosting intervention might avert (A) but risk (B)–(E). A theory must explain why averting (A) is uniquely urgent (e.g., extinction is total value loss) or why it isn't (e.g., (C) or (E) are worse).  
     - **Non-Negotiable**: Yes. If the theory cannot rank these, it cannot justify prioritizing extinction risk over other catastrophic outcomes.

  4. **Cluelessness Protocol (Handling Uncertainty)**  
     - **Requirement**: The theory must state whether it requires determinate expected-value (EV) calculations under **severe cluelessness** (i.e., high uncertainty about long-term causal effects). If not, it must specify when refusal to assign EV is acceptable (e.g., if flow-through effects are unpredictable).  
     - **Case-Driven Reason**: In the SQT, the survival-boosting intervention has "disputed" effects: we may be clueless about whether it *actually* increases survival chances or inadvertently enables futures (B)–(E).  
       - *If determinate EV required*: The theory must aggregate tiny probabilities with vast stakes (e.g., 0.001% chance of enabling 10²⁰ lives).  
       - *If refusal allowed*: The theory may deem longtermist interventions too speculative to justify.  
     - **Negotiable Flag**: Yes. This is a meta-requirement about epistemology. Strong longtermism requires determinate EV; skepticism may reject this.  
     - **Conflict Warning**: Combines explosively with **Desideratum 5** (if EV is required, cluelessness may force arbitrary precision).

  5. **Astronomical Stakes Sensitivity (Scale Dominance)**  
     - **Requirement**: Given a vast potential future (e.g., 10²⁰ lives over cosmic time), the theory must ensure that small survival-probability changes dominate bounded near-term effects, *unless* it provides a principled discounting mechanism (e.g., time discounting, risk aversion, or threshold deontology).  
     - **Case-Driven Reason**: The survival boost in the SQT has an expected value proportional to [probability increase × future scale]. If the future is large enough, this dwarfs the near-term intervention (e.g., 0.001% × 10²⁰ lives = 10¹⁵ expected lives saved, vs. 10⁶ actual lives saved). The theory must either endorse this dominance or justify why it doesn’t apply (e.g., if quality degradation in the SQT outweighs scale).  
     - **Non-Negotiable**: For strong longtermism. If the theory rejects scale dominance, it cannot support the core conclusion.  
     - **Camp-Specific Flag**: This is a *distinctive commitment of longtermism*. Drop it if you reject the idea that scale trumps all else.

  6. **Axiological Comparability (Making the Choice Matter)**  
     - **Requirement**: The theory must ensure that near-term and long-term values are comparable (e.g., via a common currency like welfare, or a decision rule like lexical priority). It must avoid categorical incommensurability (e.g., "civilizational character is incomparable to individual welfare").  
     - **Case-Driven Reason**: In the SQT, the near-term intervention saves lives (welfare), while the long-term intervention affects existence and civilizational quality. If these are incommensurable, the choice is indeterminate. Strong longtermism requires commensurability to assert dominance.  
     - **Non-Negotiable**: Yes. Without comparability, no choice can be "dominant."

  ---

  ### **Conflict and Coherence Analysis**  
  - **Key Conflict**: **Desideratum 4 (Cluelessness Protocol)** and **Desideratum 5 (Stakes Sensitivity)** cannot be jointly satisfied without controversy.  
    - *Why*: Stakes Sensitivity demands that tiny probabilities of vast futures dominate decisions, but Cluelessness Protocol highlights that we lack reliable probabilities. Enforcing determinate EV (per 4) under cluelessness may require arbitrary assumptions (e.g., using uninformed priors), while refusing EV (per 4) blocks Stakes Sensitivity.  
    - *Implication*: This conflict is the **Achilles' heel of strong longtermism**. Resolving it requires privileging one desideratum over the other (e.g., accept arbitrary EV calculations, or reject scale dominance under uncertainty).  

  - **Most Exclusionary Requirement**: **Desideratum 2 (Non-Identity Robustness)**.  
    - *Why*: If the theory enforces the Person-Affecting Restriction (PAR), it cannot assign value to creating future people who wouldn’t otherwise exist. This eliminates the core case for strong longtermism (which relies on valuing potential future populations). PAR is a major obstacle.  

  - **Camp-Specific Desiderata (Optional/Droppable)**:  
    - **Desideratum 2 (PAR)**: Drop this if you reject person-affecting ethics (e.g., if you accept impersonal total utilitarianism).  
    - **Desideratum 5 (Stakes Sensitivity)**: Drop this if you deny that large-scale futures automatically dominate (e.g., if you prioritize near-term certainty, endorse average utilitarianism, or accept time discounting).  
    - **Desideratum 4 (Cluelessness determinate-EV)**: Drop the requirement for determinate EV if you embrace moral or epistemic uncertainty (e.g., if you think cluelessness should paralyze long-term action).  

  ---

  ### **Summary for Your Purpose**  
  This list provides a reusable standard to test theories (e.g., total utilitarianism, person-affecting views, prioritarianism). The **SQT case** forces specificity on value conflicts, **non-identity robustness** exposes PAR commitments, and **cluelessness-stakes conflict** highlights the deepest tension. Strong longtermism likely fails if any of **2 (PAR)**, **4 (cluelessness)**, or **5 (scale)** are unsatisfied or conflicting. The most vulnerable point is **cluelessness**: if you reject determinate EV calculations under uncertainty, strong longtermism lacks a decision procedure. Use this framework to score theories systematically, starting with the SQT.
