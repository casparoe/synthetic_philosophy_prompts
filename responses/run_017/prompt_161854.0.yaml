  First, I need to parse both camps. The friend's view is rooted in the Efficient Market Hypothesis (EMH) framework. They see any trading volume as evidence of external factors like risk-sharing or new information, but still believe prices are the best estimators. The impossibility argument about information costs makes sense here. On the other hand, the user sees high volume without news as proof that behavioral factors and noise dominate, with arbitrage constrained by capital. 

  The user mentions that every anomaly they bring up gets rebuffed as a risk premium or transaction cost artifact. Their friend counters that efficiency can't be tested without an expected returns model. Both are using the same formal result (like no-trade theorem) in opposite ways—as a null model and as a reductio. The user suspects three things: the phrase "market efficient" is ambiguous, they disagree on what counts as data, and underneath is an empirical question about deviation sizes and arbitrage capital.

  Now, the user proposes an experiment: a reference market with machine-checkable settlement, published data process, pre-trading elicited priors, and scoring to categorize trade motives. Would this resolve the dispute?

  I need to break down the disagreement structure. The verbal aspect is clear—"best estimator" vs. "no exploitable edge" are different claims. Methodologically, they prioritize different anomalies. Empirically, the key is the size and persistence of deviations. The user's experiment is clever but may not settle everything because measuring miscalibration as error assumes rational priors, which the friend might dispute. Also, arbitrage constraints and risk preferences are still subjective.

  The user's deeper need might be to move beyond a stalemate by clarifying the debate's structure. They might want validation that their experiment is a step forward, even if not conclusive. They're seeking a framework to understand the disagreement rather than winning the argument. Progress here involves distinguishing the EMH variants, accepting empirical questions, and perhaps redefining the debate around measurable deviations and arbitrage capital limits.
answer: |-
  Your disagreement is a **three-layered conflict**—verbal, methodological, and empirical—with the empirical layer being the anchor. Here's the diagnosis:

  ### 1. **Verbal Layer: "Efficiency" is Polysemous**  
     Your friend defends **relative efficiency**: Prices are the *best available estimator* given constraints (information costs, risk aversion). You attack **absolute efficiency**: Prices are *unmoored from fundamentals* due to behavioral noise and arbitrage limits. These are compatible claims! A market can be relatively efficient (no easy arbitrage) while absolutely inefficient (persistent deviations from fundamentals). You’re arguing past each other because "efficiency" is overloaded.

  ### 2. **Methodological Layer: Anomaly-Spotting vs. Systemic Skepticism**  
     - **Friend’s approach**: Treats EMH as a *falsifiable null model*. Anomalies require ad-hoc explanations (risk premia, costs), preserving efficiency as the default.  
     - **Your approach**: Treats EMH as a *strawman*. Persistent volume/noise proves the model’s assumptions (common priors, rationality) are fundamentally broken.  
     This is a **Bayesian priors conflict**: Your friend assigns high prior probability to efficiency; you assign high prior to market irrationality. Anomalies are filtered through these priors.

  ### 3. **Empirical Core: The Size and Persistence of Deviations**  
     Beneath the rhetoric lies a testable question: *How large, frequent, and long-lived are price deviations from fundamentals when arbitrage capital is finite?*  
     - Your friend believes deviations are small/short-lived (arbitrage corrects them).  
     - You believe they can be large/persistent (arbitrage is constrained, fundamentals are contested).  
     **This is measurable**—but requires defining "fundamentals" and arbitrage costs. Your prediction market data *could* test this, but you lack consensus on what constitutes a deviation ("contested fundamentals" sabotage agreement).

  ---

  ### Would Your Experiment Settle Anything?  
  Your proposed reference market **advances the empirical layer** but **fails to resolve the core conflict**. Here’s why:

  #### **Strengths**:  
  - **Priors measured, not assumed**: Eliminates "common priors" as an excuse for volume.  
  - **Categorizes trade drivers**: Splits volume into information/miscalibration/risk.  
  - **Miscalibration as error**: Scores probabilistic overconfidence (e.g., 80% confidence events that occur 50% of the time), distinguishing it from legitimate prior differences.  

  #### **Weaknesses**:  
  - **Risk preferences remain contested**: Your friend will still attribute unexplained volume to unobserved risk aversion.  
  - **"Machine-checkable fundamentals" ≠ uncontested**: Even with a published DGP, participants may disagree on model relevance (e.g., "This DGP ignores latent variables!").  
  - **Arbitrage constraints unaddressed**: Shows *why* deviations exist but not *how quickly capital corrects them*.  
  - **Friend’s escape hatches remain**:  
    - "Residual volume is compensation for liquidity risk."  
    - "Miscalibration *is* a prior!" (if priors include self-doubt).  

  **Result**: The experiment would quantify noise/share of irrational trading but **not prove prices "know nothing"**. Your friend would concede deviations exist but argue they’re small/non-exploitable; you’d cite them as evidence of systemic fragility. The verbal/methodological stalemate persists.

  ---

  ### Paths to Progress  
  1. **Reframe the Question**:  
     Replace *"Do prices know anything?"* with:  
     *"Under what conditions do prices deviate persistently from fundamentals, and what fraction of trading is noise-driven?"*  
     This sidesteps verbal traps and focuses on measurables.

  2. **Formalize the Stakes**:  
     Use your experiment to quantify:  
     - The **half-life of deviations** from elicited priors.  
     - The **proportion of volume** attributable to miscalibration vs. risk.  
     - The **capital required** to suppress deviations below threshold *X*.  

  3. **Embrace the EMH’s Nuance**:  
     Acknowledge three efficiency levels:  
     - **Weak**: Prices reflect past data (you both reject this).  
     - **Semi-Strong**: Prices reflect public data (your friend’s view).  
     - **Strong**: Prices reflect all data (both reject).  
     **Your battleground is semi-strong efficiency with friction**.

  4. **Shift to Exploitability**:  
     Ask: *"If your model is right, show me a trading strategy (post-costs) beating the market using your anomaly framework."*  
     Forces your friend to put capital at risk on their theory.

  ---

  ### Bottom Line  
  Your stalemate is **fundamentally empirical** but obscured by **conceptual blur**. The experiment clarifies the *mechanics* of trading but not the *epistemology* of prices. To break the deadlock:  
  - **Distinguish** relative vs. absolute efficiency explicitly.  
  - **Measure** deviation half-lives and noise volume.  
  - **Demand** testable trading strategies.  

  Progress lies in converting philosophical tussles into quantitative benchmarks—like any good engineer would. The market may not know everything, but your experiment can force the disagreement to put its money where its mouth is.
