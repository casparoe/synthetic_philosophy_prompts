prompt: |-
  you are a decision theorist who's taught rational choice to grad students something like a dozen times, and you're unusually good at spotting the exact point where peoples intutions go off the rails. Please brainstorm for a bit in bullet points before you commit to anything, and think carefully about the *dependency structure* — what has to be in place before what — rather than just dumping the textbook proof at me.

  I've got a 50-minute slot next week with about fifteen first-year public-policy masters students. They've had exactly one lecture on expected utility: they can read a decision tree, compute an expected value, and they've seen Bayes' rule once but they're shaky on it. They have never seen a value-of-information calculation. Most of them arrive thinking "more information is good, obvs," and at least a couple arrive thinking "but I'd actively not want to know my genetic risk score, so isn't that a counterexample?" I need them to come out actually getting Good's theorem — the result that for an expected-utility maximizer, an extra piece of free information has non-negative expected value, i.e. you can't, from the ex ante standpoint, be made worse off by being handed the option to look — and I need them to get *why* it holds and *where it breaks*. Don't explain the theorem to me and please don't give me a reading list; plan how I should teach it.

  1. The order the pieces have to go in, and what depends on what. My current instinct is: small acts/states table with a prior → value of acting now → "now suppose a signal arrives first" → the convexity bit (max of a mixture is at least the mixture of the maxes) → the punchline that the value is zero unless the signal can actually flip your act. But I keep going back and forth on whether the flipping point should come before the convexity point as the intuition, with convexity as the proof afterwards. Argue for an ordering and tell me what breaks if I do it the other way.

  2. One example to carry the whole session. I was thinking umbrella + weather forecast, because with two acts and two states I can draw the value of information as a function of the prior and it's that tent-shaped curve — zero near the ends, kinked, peaking right at the indifference prior. Tell me what the example has to have and what it has to lack. I'm worried a *perfect* forecast short-circuits the "how good does the information have to be" question, and I don't want any cost of acting, any repeated-play element, or anything strategic in the base case.

  3. The misconceptions, in the order they'll actually form them, and where in my sequence to defuse each. The ones I expect: "the theorem says you won't regret looking" (the ex ante / ex post slide); "the value of information is just how likely it is to change my mind"; "a more accurate test is always worth more"; conflating "I'd be better off if the world were a certain way" with "I'd be better off knowing which way it is"; and "free information is free, so there's never a reason not to look," which ignores that the act of finding out can perturb the world (asking your manager whether you're being made redundant makes it more likely; the diagnostic procedure itself has a complication risk). Which of these is the actually dangerous one — the one that'll silently corrupt their later work — and what am I missing from the list?

  4. Two failure cases I want to close on, and I need help sequencing them. (a) An agent who updates wrong in a particular way: she acts as if the likelihood ratio were raised to the power 1.5, so she over-reacts to signals. For her, more information can be actively harmful and she'd pay to stay ignorant. (b) An agent whose utility depends on her own credence — she likes suspense, or she hates the anxiety of knowing. Are these the same kind of failure of the theorem's assumptions, or structurally different failures? Which one first? And can I reuse the umbrella numbers from item 2 to make (a) concrete rather than hand-wavy?

  5. One question I can put on the board at the end that tells me whether they got the theorem rather than just the arithmetic — something that separates a student who's internalised "ex ante, about the option to look, for an expected-utility maximizer" from one who's internalised "information is good."

  6. What I should openly refuse to explain in fifty minutes, and say out loud that I'm skipping.
reasoning: |-
  Okay, the user is teaching a class on decision theory to first-year public policy master's students. They have basic knowledge of expected utility but are new to value-of-information calculations. The main goal is to make them understand Good's theorem—why free information can't have negative expected value for an expected-utility maximizer—and where it breaks.

  First, the user wants a logical sequence. The dependency structure is crucial. Start with a simple decision problem without information. Then introduce a signal. Show that the expected value of acting after the signal is at least as good as acting without it. The convexity part (max of mixtures) should come after establishing the baseline but before the flipping point. If convexity comes first, it might seem abstract. After that, explain when the value is positive—only when the signal can change the decision. The key is building step-by-step: prior acts → signal → convexity → flipping condition.

  For the example, the umbrella and weather forecast works. Two acts, two states. The forecast should be imperfect to avoid the "perfect information" shortcut. Use a binary signal like "rain likely" or "sunny forecast." Draw the tent-shaped curve to show value peaks at the indifference prior. Avoid costs, repeated plays, or strategic elements. Make sure students see that without the possibility of changing the action, the value is zero.

  Misconceptions need addressing. The dangerous one is confusing ex ante and ex post. Students might think the theorem says you won't regret looking, but ex post regret is possible. Emphasize that ex ante, the expected value is non-negative. Other misconceptions: info value isn't just the chance of changing your mind; accuracy isn't always better; and knowing vs. the world state being different. Also, mention that free info isn't free if it affects the world, but that's a later point.

  Failure cases: First, the agent who updates wrong (over-reacts). Use the umbrella example to show how over-reaction makes information harmful. Then, the agent who cares about credence states (anxiety or suspense). These are different: the first violates rational updating (EU framework), the second violates state-independent utility. Do the updating error first with the same numbers, then credence-dependent utility as a separate issue.

  The exit question should test understanding of the theorem's conditions. Ask if an agent with non-EU preferences might refuse free information. This checks if they grasp the assumptions.

  Skipping: Strategic interactions, costly information, repeated decisions, and non-binary cases. Explicitly state these are out of scope to manage expectations.

  Overall, structure the class to build intuition step-by-step, use a consistent example, address misconceptions in order, and clarify failure modes. Ensure students differentiate ex ante expectation from ex post outcomes and understand the theorem's boundaries.
answer: |-
  Here’s a battle-tested plan for your 50-minute slot, optimized for intuition-building and misconception-squashing. I’ve taught this exact crowd before—policy students cling to "more info is good" until you break it surgically.

  ### 1. **Order of Concepts (Dependency Structure)**
     **Sequence: Prior Acts → Signal Arrives → Convexity → Flipping Condition → Punchline**  
     *Why this order?*  
     - **Start with the status quo (prior acts):** "Here’s your choice *without* extra info." Builds baseline intuition.  
     - **Introduce the signal:** "Now a forecast arrives *before* you choose." Makes info’s role concrete.  
     - **Convexity (max of mixture ≥ mixture of max):** Show *why* acting after the signal dominates. Uses familiar EU math.  
     - **Flipping condition:** *Then* reveal when value is >0. Delays the "aha" to reinforce why convexity matters.  
     - **Punchline:** Value of info = Expected improvement from switching acts when signal flips your choice.  

     *What breaks if you reverse convexity and flipping?*  
     If you lead with flipping ("info helps only if it changes your mind"), students fixate on *frequency* of switching, not the *EU gain per switch*. They’ll miss why weak signals can still have positive value (e.g., a noisy test that rarely changes your action but saves you when it does). Convexity first forces them to see the structural dominance.

  ### 2. **The One Example to Rule Them All: Imperfect Umbrella Forecast**
     **What it MUST have:**  
     - **2 acts (take umbrella/leave it), 2 states (rain/sun), imperfect binary signal (e.g., "rain forecast"/"sun forecast")**.  
     - **Explicit utilities:** e.g., Umbrella in rain: -2 (annoying but dry), No umbrella in rain: -10 (soaked), Sun either way: 0.  
     - **Prior not at 0/1:** e.g., P(rain) = 0.4 → EU(take) = -2, EU(leave) = -4 → optimal to take.  
     - **Signal accuracy ≠ perfect:** e.g., P("rain forecast"|rain) = 0.8, P("sun forecast"|sun) = 0.7.  

     **What it MUST lack (for the base case):**  
     - No cost of acting (umbrella is free to deploy).  
     - No causal link (forecast doesn’t *cause* rain).  
     - No repeated decisions or regret dynamics.  

     **Why umbrella works:**  
     - Draw the tent curve: Value of info = 0 when prior is 0 or 1 (no flip possible), peaks at indifference prior (P(rain)=0.2 in this util setup).  
     - Imperfect signal avoids the "perfect info = always valuable" trap. Ask: *"Would a 51% accurate forecast ever be worth anything?"* (Yes, if prior is near indifference).

  ### 3. **Misconceptions & When to Defuse Them**
     **Order of emergence + defusing:**  
     1. **"Info is good if it changes my mind"** (arises during flipping condition):  
        - *Defuse:* Show a weak signal that rarely changes your act but has high value when it does (e.g., P(rain)=0.19 → leave umbrella, but if "rain forecast" (rare), switch to take and avoid -10).  
        - *Danger level:* High—corrupts cost-benefit analysis of real-world tests (e.g., medical screening).  
     
     2. **"More accurate info is always better"** (when drawing tent curve):  
        - *Defuse:* Contrast a 95% accurate test vs. 80% accurate. Show regions where the *less* accurate one has higher value (e.g., near prior=0.5, if 95% test is more expensive).  
     
     3. **"I’d regret looking"** (ex post vs. ex ante):  
        - *Defuse:* After computing ex ante value, simulate: *"You looked, saw 'sun forecast,' left umbrella, got soaked. Was looking wrong? Ex ante, no: most times you save hassle."*  
        - *Danger level:* Critical. Policy students will misapply VoI if they don’t grasp this.  
     
     4. **"Free info is free, so always look"** (during punchline):  
        - *Defuse:* Explicitly state assumptions: "Holds *only* if (a) info is free, (b) you update rationally, (c) learning doesn’t change the world." Tease failure cases.  
     
     **Missing misconception:** *"VoI is just the expected reduction in uncertainty."* Nope—it’s about *improving decisions*. Defuse by asking: *"If I tell you a random fact about Antarctica, does that have VoI?"* (Only if it affects an action with stakes).

  ### 4. **Failure Cases: Sequencing and Structure**
     - **First: Updating Error (Agent with likelihood ratio ^1.5)**  
       - *Use umbrella numbers:* Prior P(rain)=0.4. Signal "rain forecast" (true LR=0.8/0.3≈2.67). She updates P(rain|signal) ∝ (0.4) * (2.67)^1.5 ≈ 0.85 → overreacts, takes umbrella even when EU says leave.  
       - *Harm:* Ex ante, she pays more attention than needed, takes umbrella too often.  
       - *Failure type:* Violates **EU rationality** (updating not Bayesian).  
     
     - **Second: Credence-Dependent Utility (Suspense-Lover)**  
       - *Example:* Agent gets utility from *not knowing* her cancer risk (avoids anxiety).  
       - *Failure type:* Violates **state-independent utility** (utility depends on belief state, not just world state).  
     
     *Why this order?* Updating error reuses the math they just learned, making it concrete. Credence-dependency is a deeper philosophical break—save it for last. They’re **structurally distinct**: one is miscalculation *within* EU, the other rejects EU entirely.

  ### 5. **Exit Question to Test Understanding**
     > **"An EU-maximizing genie offers to tell you tomorrow's lottery number for free. You hate gambling and will never play the lottery. Should you accept the genie's offer?"**  
     - *Why it works:*  
       - Correct answer (Yes, but value = 0) checks they see VoI requires *action-relevance*.  
       - Distinguishes "info is good" from "VoI ≥0".  
       - If they argue "no, it’s worthless," they get it. If they say "yes, because more info is good," they missed the flipping condition.

  ### 6. **What to Openly Skip (Declare Upfront)**  
     > *"Today, we’re assuming: (1) information is truly free (no money, time, or risk), (2) no repeated decisions, (3) no game theory (your enemy can’t see your signal), and (4) you update beliefs perfectly. Real world breaks these—but you need this pristine case first."*  
     - **Do NOT touch:** Costly information, signaling games, info hazards (e.g., genetic discrimination), or non-Bayesian heuristics beyond the one failure case. Saying this upfront disarms "but what about..." tangents.

  ---

  **Minute-by-Minute Flow:**  
  - (0-5): Umbrella setup without info → compute prior optimal act.  
  - (6-15): Add imperfect signal → compute EU if you see signal first (convexity). Contrast with prior EU.  
  - (16-25): Plot tent curve → emphasize flipping condition. Defuse misconceptions 1-2.  
  - (26-35): Punchline (VoI formula) → ex ante/ex post distinction. Defuse misconception 3.  
  - (36-40): Updating error failure (same umbrella).  
  - (41-45): Credence-dependency failure (new example).  
  - (46-48): Exit question + discussion.  
  - (49-50): "What we skipped" disclaimer + key takeaway: *"Free relevant info can’t harm an EU-maximizer ex ante. But humans aren’t EU-maximizers."*  

  **Why this works:** Meets policy students where they live (concrete stakes), forces them to confront intuitions via a single evolving example, and isolates the theorem’s engine (convexity) from its corollaries (flipping).
