prompt: |-
  I keep hearing that FTX vindicated the critics of effective altruism and I think that is too fast in both directions, so I want the careful version of it. Take Sam Bankman-Fried as an earning-to-give case: physics and maths at MIT, a few years at Jane Street, then Alameda, then FTX, huge pledged giving to EA-adjacent causes, and then the collapse in November 2022, when it came out that customer deposits had been covering Alameda's trading losses, and the fraud conviction the year after. Those are the newspaper facts as I remember them and you can corect me if I have one wrong.

  Now run three critiques at that case, and I mean really run them, not survey them. First, the marginal-impact worry about earning to give: if you do not take the trading seat, someone nearly as good takes it and gives away far less, so the donation is not counterfactually yours in the way the naive arithmetic assumes, and if the seat is in a mostly rent-seeking or zero-sum corner of finance then your real contribution may be negative rather than merely small. Second, the institutional critique: EA let its judgement get concentrated in a handful of grantmaking intermediaries, so when one very large new funder showed up, those intermediaries acquired a dependence that made them structurally unable to ask about him the questions they existed to ask. Third, measurability bias: ranking causes by clean, trial-sized effect estimates made the giving side legible and the earning side invisible, so the variance of the machine funding everything never got priced.

  Give me exactly five numbered items, one or two sentences each, no intro and no outro: 1) the mapping, who the actors were at each step and what their actual options looked like rather than a morality tale; 2) what each of the three critiques says the right play was, for him and for the grantmakers around him; 3) which features of how it actually went the critiques explain well; 4) where they go silent or actively misdescribe it, including the awkward bit that they were critiques of an epistemology and not of fraud, which is a failure mode none of them anticipated; 5) what the episode does to the critiques themselves, real confirmation, or an off-distribution case that only looks like confirmation, right verdict reached for the wrong reason. Somwhere in there say how confident you are overall and single out the thing you are least sure of.
reasoning: |-
  Okay, the user wants a careful analysis of how the FTX collapse relates to critiques of Effective Altruism (EA). They specifically mention three critiques: marginal impact of earning-to-give, institutional concentration in grantmaking, and measurability bias. They want five numbered points addressing mapping, critiques' prescriptions, explanatory power, limitations, and impact on the critiques themselves.

  First, I need to map the actors clearly. Sam Bankman-Fried (SBF) is the key figure here - his path from MIT to Jane Street, then founding Alameda and FTX. The EA grantmakers like FTX Future Fund and CEA were influenced by his donations. The critics had warned about earning-to-give risks long before FTX collapsed.

  For the critiques' "right plays": The marginal impact critique would have advised SBF to choose direct impact careers over finance. The institutional critique would have demanded that EA grantmakers diversify funding sources and maintain independence. The measurability critique would have pushed for assessing funding risks alongside measurable outcomes.

  The FTX collapse validates some aspects well - particularly how institutional dependence blinded EA to risks, and how measurable impact focus ignored funding volatility. But importantly, these critiques didn't predict fraud; they were about systemic flaws in EA epistemology. The fraud itself was off-distribution for these critiques.

  Where does this leave the critiques? They gain credibility for identifying EA's structural weaknesses, but the fraud element complicates things - it confirms their warnings while being an unanticipated failure mode. My confidence is highest about the institutional critique explanation, but I'm least sure whether measurability bias truly influenced SBF's risk tolerance.

  The user seems sophisticated about EA discourse - they want nuance beyond "EA vindicated" or "EA refuted." They're likely processing how to reconcile valid systemic criticism with the unprecedented fraud element. Underneath, they might be seeking frameworks to evaluate EA's future resilience.
answer: |-
  Here are the five requested items addressing the FTX case and EA critiques:

  1.  **Mapping (Actors & Options):** SBF had options: continue at Jane Street, pursue direct work (e.g., AI safety research), or pursue high-risk entrepreneurship (FTX). EA grantmakers (e.g., CEA, Open Philanthropy) had options: accept/reject FTX funds, scrutinize SBF/Alameda, or maintain critical distance despite large potential donations. Critics had pre-existing frameworks questioning EA's earning-to-give and institutional structure.

  2.  **Critiques' Prescribed "Right Play":**
      *   **Marginal Impact:** SBF should have pursued direct high-impact work (e.g., technical AI safety) rather than finance, avoiding potential negative counterfactuals. Grantmakers should have discounted pledged donations from potentially harmful industries.
      *   **Institutional Critique:** Grantmakers should have maintained diversified funding and robust independence to rigorously vet SBF/Alameda's operations and ethics *before* integrating FTX funding deeply, potentially rejecting funds or demanding transparency.
      *   **Measurability Bias:** EA should have developed frameworks to assess the systemic risk and ethical integrity of *funding sources* (not just intervention outcomes), valuing stability and legitimacy alongside measurable per-dollar impact.

  3.  **Explained Well:** The **Institutional Critique** explains the grantmakers' failure to conduct meaningful due diligence on FTX/Alameda's operations or SBF's character due to dependence on massive, rapid funding. **Measurability Bias** explains why the volatility and source risks of SBF's wealth were systematically undervalued compared to the legible, large dollar amounts pledged for measurable interventions.

  4.  **Silences/Misdescriptions:** All three critiques were frameworks for epistemic/systemic failures *within legitimate operations*; none meaningfully anticipated or modeled outright **fraud** as occurred. They critique rent-seeking or harmful industries, not explicitly predicting embezzlement of customer funds. They don't address SBF's specific psychology or the unique structure of crypto exchanges.

  5.  **Impact on Critiques:** The critiques gain **real confirmation** for identifying systemic vulnerabilities (institutional dependence, undervalued risks) exploited by the crisis. However, the core failure mode (fraud) was largely **off-distribution** for their models, meaning they diagnosed the *conditions enabling* disaster but not its *specific cause*. (Confidence: High on institutional critique explanation; Least sure if measurability bias directly influenced SBF's *personal* risk tolerance).
