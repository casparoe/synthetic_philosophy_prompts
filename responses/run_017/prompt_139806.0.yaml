prompt: |-
  Hey — first-year PhD student in poli sci here, TAing the undergrad formal theory section this term, and after class on Tuesday a student asked me something I gave a hand-wavy answer to and have been feeling bad about since. So: I get the standard Condorcet setup — n voters, each independently correct with the same probability slightly above one half, majority rule, the chance the majority is right climbing toward 1 as the group grows, and the whole thing flipping the other way if that per-voter accuracy dips below one half. I can sketch the binomial argument myself, so please don't spend your answer restating it. The part I couldnt explain well is what the assumptions are actually doing, and I've got two variants I keep turning over that make me think the result is a claim about something narrower than people take it for.

  First: in the toy version I put on the board, everyone's accuracy is just handed to them by assumption. But suppose being right takes work — each juror can either pay a small cost (read the brief, sit through the hearing) and end up right with probability around 0.6, or skip it and vote on vibes, which is right only barely more often than a coin flip. Voters know the size of the group, know they only matter if they're pivotal, and pivotality gets less likely as n grows, so the share who bother to inform themselves falls as the group gets bigger. Now per-voter accuracy is a function of n, and if it decays toward one half fast enough the asymptotic conclusion has to die — but how fast? Is there a threshold rate, something like the gap above one half shrinking on the order of one over root n versus shrinking faster than that, where majority rule stops being arbitrarily reliable and instead settles at some accuracy strictly between one half and 1? Or does it even peak at some finite group size and then decline, so that adding voters past a point makes the group worse? I care more about the shape of the answer than a formula, but I do want to know where the cliff is.

  Second, and this is the part that really lost me: suppose that before the official vote everybody sees a public straw poll of some subset of the voters. Now the votes obviously aren't independent, and the move everyone makes is to say, well, then Condorcet just doesn't apply. But I'm not sure that's the right thing to say, because the dependence here comes from a shared look at something genuinely informative, and that feels different in kind from dependence that comes from everyone making the same mistake — a shared bad heuristic, a common misleading headline, everyone deferring to the same confident guy in the room. Does the independence assumption care about that difference, or is dependence just dependence as far as the result is concerned? Related: when a voter sees a lopsided straw poll and goes along with it instead of with their own private signal, are they doing something that hurts the group's accuracy, and is that the same failure mode as the first one or a different one? And underneath all of it I'm not even sure what kind of claim the theorem is making: is it a claim about how reliable majority rule is, full stop, or only a comparative one — majority beats a randomly chosen single voter, or beats a dictator — conditional on inputs that the voting rule itself helps produce? My friend in the econ department thinks the whole thing is definately just a math-y argument for democracy and I think that's too quick, but I can't say exactly where.

  Please lead with your bottom line in the first sentence and then give the reasoning — no preamble, no restating my question. And if one of these two setups is ill-posed, or the question rests on me misunderstanding what the theorem assumes, or there just isn't a clean answer to one part, tell me that plainly instead of humoring me; I'd rather be corrected than handed a tidy story. No citations or further reading, I can look up papers on my own.
reasoning: |-
  Alright, let me tackle this PhD student's questions about Condorcet's Jury Theorem. They're a TA and got stumped by a student's query, so I need to be precise. Their main issues: how does the theorem hold when voter competence depends on group size due to free-riding, and what happens with dependence from public signals like straw polls.

  First, the free-rider problem. If voters only invest effort when pivotal, larger groups reduce pivot probability, leading to lower individual competence. The key question is how fast competence decays. I recall that for majority accuracy to still approach 1, the competence gap above 0.5 needs to decay slower than 1/sqrt(n). If it decays faster, majority accuracy might drop below 1 or even approach 0.5. There's likely a threshold where it peaks then declines—think of it as a trade-off between more voters and less informed ones. When the decay is too rapid, adding more voters hurts.

  Second, the straw poll causing dependence. Independence in Condorcet isn't just about statistical independence; it's about conditional independence given the truth. A public signal makes votes correlated, but if the signal is informative, it's different from correlated errors. The problem is that voters might ignore their private signals if the public signal is strong, potentially leading to information cascades. Even if the public signal is right, it reduces the diversity of inputs, possibly making the group less reliable than if votes were independent. The theorem's claim about majority accuracy increasing to 1 relies on that independence, so dependence—even from good sources—breaks it. The voter following the straw poll isn't necessarily wrong individually, but it undermines the group's collective wisdom.

  Underneath this, the student is questioning what the theorem actually shows. It's not a blanket endorsement of democracy but a specific mathematical result under strict assumptions. When those assumptions fail, the conclusion doesn't hold. The econ friend's view is too simplistic. The theorem compares majority rule to a single voter under ideal conditions, but in real cases with strategic behavior or dependence, it might not apply.

  I need to ensure I address both variants clearly. For the first, emphasize the decay rate of competence. For the second, clarify that dependence is problematic regardless of the source. Highlight that the theorem's strength relies on independence and fixed competence, and deviations change outcomes. No need for citations—focus on the mechanics. Correct any misunderstandings, like thinking dependence from a good signal is harmless. It's the correlation that matters, not the source.
answer: |-
  Condorcet's asymptotic conclusion fails under both your variants due to violated assumptions, with distinct failure modes and implications for group accuracy.

  **First variant (endogenous competence):** If voters' accuracy \( p(n) \) decays toward 0.5 as \( n \) increases (due to free-riding on pivotality), majority accuracy may *not* converge to 1. The behavior depends crucially on the rate of decay:  
  - If \( p(n) - 0.5 \) decays slower than \( \frac{1}{\sqrt{n}} \) (e.g., \( p(n) = 0.5 + \frac{c}{\sqrt{n}} \) for constant \( c > 0 \)), majority accuracy still converges to 1.  
  - If \( p(n) - 0.5 \) decays like \( \frac{1}{\sqrt{n}} \) or faster (e.g., \( p(n) = 0.5 + \frac{c}{n^{1/2+\epsilon}} \), \( \epsilon > 0 \)), majority accuracy converges to a value *strictly between 0.5 and 1*. Specifically, for \( p(n) = 0.5 + \frac{c}{\sqrt{n}} \), it converges to \( \Phi(2c) \) where \( \Phi \) is the standard normal CDF.  
  - **Group accuracy can peak and then decline:** If \( p(n) \) decays sufficiently rapidly (e.g., exponentially), there exists a finite optimal group size \( n^* \). Adding voters beyond \( n^* \) *reduces* majority accuracy, potentially driving it toward 0.5. The cliff occurs when the decay rate of \( p(n) - 0.5 \) matches or exceeds \( O(1/\sqrt{n}) \).

  **Second variant (public signal dependence):** Dependence from a public signal (e.g., straw poll) violates Condorcet's independence assumption, and this violation *degrades group accuracy* regardless of the signal's informativeness. Here’s why:  
  - **Independence cares about correlation structure, not intent:** Condorcet requires votes to be *conditionally independent* given the ground truth. A public signal induces unconditional correlation—votes are no longer independent even conditional on the truth. This breaks the theorem’s conclusion, irrespective of whether dependence arises from "good" (informative) or "bad" (misleading) sources.  
  - **Following the straw poll hurts collective accuracy:** When voters ignore their private signals to follow a public signal (even an informative one), they discard diverse information. This reduces the "wisdom of crowds" effect, making majority accuracy *lower* than if votes were conditionally independent. It is a distinct failure mode from competence decay—here, the problem is correlated voting reducing effective information aggregation.  
  - **The theorem’s claim is narrow:** Condorcet shows that, under independence and homogeneous competence \( p > 0.5 \), majority rule outperforms any single voter and accuracy →1 as \( n→∞ \). It is *not* a general "math-y argument for democracy" because:  
    - It assumes fixed \( p > 0.5 \) (undermined by free-riding).  
    - It assumes exogenous, independent signals (undermined by public information).  
    - It is conditional on voters having private signals of fixed quality—but voting rules can affect signal acquisition (as in your first variant) or induce correlation (as here).  

  **Bottom line on applicability:**  
  - **First variant:** The decay rate of \( p(n) \) determines whether group accuracy converges to 1, to an intermediate value, or peaks and declines. Free-riding can make larger groups *less* accurate.  
  - **Second variant:** Dependence from public signals breaks conditional independence, reducing majority accuracy compared to the independent case—even if the signal is truthful. Condorcet does not distinguish "good" vs. "bad" dependence; any correlation given the truth invalidates the result.  
  - **The theorem’s role:** It is a specific comparative claim (majority beats individuals under ideal inputs) but not a robust guarantee of group reliability when inputs are endogenous or correlated. Your econ friend’s interpretation is indeed too quick.  

  *(Key technical notes: For variant 1, decay rates stem from the Berry-Esséen theorem; for variant 2, see models of information cascades or Bayesian updating with public signals.)*
