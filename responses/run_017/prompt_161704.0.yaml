    1. ML alignment: "Why not just use critique-revision?"
    2. Formal epistemology: "Where's the dominance proof?"
    3. Debate expert: "Strawman accusation"
    4. Complexity theorist: "Ignoring PSPACE results"
    5. Interpretability: "Transcripts are black boxes"
    6. STS critic: "Truth claims as power moves"
    7. ML alignment redux: "RLHF on transcripts"
