  The audience composition is crucial - I need to simulate objections from each specialty group: ML alignment folks will care about training signals, formal epistemologists will demand rigor, interpretability skeptics see opacity, STS critics question framing, complexity theorists cite PSPACE results, and debate paper experts will call misrepresentation. 

  For the prep sheet structure, I'm considering:
