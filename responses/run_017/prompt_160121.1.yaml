  For (ii): This is where it gets juicy. Under partial probability ordering, traditional decision rules break down. But if "evidential exposure" quantifies how much a probability might move, it creates a new axis for comparison. The user's implied insight – that weight-as-exposure could guide evidence collection – is sharp. We could model decisions as: when actions have incomparable expected utilities, compare their weight to decide whether to delay choice. High exposure (low weight) means waiting pays off; low exposure (high weight) means delaying is pointless. That elegantly resolves Keynes's unresolved problem of choice under uncertainty. 

