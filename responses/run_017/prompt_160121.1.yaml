answer: |-
  Your proposed reading of weight as "evidential exposure" (expected absolute change in probability after one more unit of relevant evidence) has profound implications for Keynes's framework:

  **I. Implications for Independence of Probability and Weight (Keynes's Independence Dimension):**
  Under this definition, **probability and weight are intrinsically linked and cannot remain genuinely independent dimensions.**

  1.  **Mathematical Entanglement:** The expected shift in probability (weight) *depends* on the current probability itself. For example:
      *   If current probability P(H|E) is 0.99, it's inherently difficult for new evidence to cause a large *absolute* shift (e.g., to 0.01). The maximum possible shift is small (0.01). The *expected* absolute shift will be constrained by this proximity to the boundary.
      *   If P(H|E) is 0.5, new evidence has much greater potential to cause large absolute shifts (e.g., to 0.1 or 0.9). The maximum possible shift is large (0.5).
      *   Therefore, weight (evidential exposure) becomes a *function* of the current probability value and the nature of the evidence space. It cannot be varied independently of the current probability estimate.

  2.  **Loss of Independence:** Keynes desired weight and probability to be truly separate axes: you could have high probability/low weight, low probability/high weight, etc. Evidential exposure undermines this:
      *   **High Weight (Low Exposure) becomes associated with Extreme Probabilities:** As P(H|E) approaches 0 or 1, evidential exposure *must* decrease. High weight (in Keynes's sense of being "well-supported") coincides with low evidential exposure.
      *   **Low Weight (High Exposure) becomes associated with Intermediate Probabilities:** When P(H|E) is middling, evidential exposure is potentially higher. Low weight (Keynes: "little evidence") coincides with high evidential exposure.
      *   **Correlation, Not Independence:** This creates a strong *inverse correlation* between the magnitude of the probability and its evidential exposure. They are no longer freely combinable independent properties.

  **II. Implications for Decision-Making under Partial Ordering & Evidence Gathering:**
  This reading provides a powerful, **actionable criterion for deciding when to postpone a decision to gather more evidence**, especially when probabilities are incomparable.

  1.  **Quantifying the Value of Waiting:** Evidential exposure directly measures the *potential instability* of the current probabilistic judgment. High exposure means the current probability is highly susceptible to change with new evidence.
      *   **Decision Rule:** If the evidential exposure (expected |ΔP|) for a critical hypothesis is *high*, postponing the decision to gather that next unit of evidence is potentially highly valuable. The judgment is "in play."
      *   Conversely, if evidential exposure is *low* (even if the probability is intermediate), gathering more evidence is less likely to significantly alter the judgment. The cost of delay may outweigh the minimal expected benefit.

  2.  **Resolving Incomparability via Weight:** When probabilities for outcomes of actions A and B are incomparable (neither P(H_A|E) > P(H_B|E) nor vice versa), traditional expected utility maximization fails. Evidential exposure offers a new axis for comparison:
      *   **Compare Exposure:** Calculate/estimate the evidential exposure (expected |ΔP|) for the key hypotheses H_A and H_B driving the utility difference between actions A and B.
      *   **Prioritize Gathering Evidence for High-Exposure Hypotheses:** If H_A has significantly higher evidential exposure than H_B, then gathering evidence relevant to H_A is likely to yield more decisive information *for resolving the incomparability* than gathering evidence relevant to H_B. Postponing the decision to gather evidence targeting the hypothesis *with the highest exposure* (where the judgment is most unstable) is the rational strategy to reduce uncertainty effectively.
      *   **Basis for Postponement:** The decision to postpone is justified by the high *expected resolvability gain* associated with reducing the exposure of the most volatile, critical probability judgment.

  3.  **"Unit of Evidence" and Cost:** The definition hinges on "one more unit of ideally relevant evidence." This implies:
      *   **Operationalization Challenge:** Defining a practical, measurable "unit" of relevant evidence is crucial for application but non-trivial.
      *   **Cost-Benefit Analysis:** The *expected benefit* of gathering evidence (quantified by the evidential exposure it targets) must be weighed against the *cost* (time, resources, opportunity cost of delay) of acquiring that "unit" of evidence. High exposure justifies higher cost tolerance. The agent should gather the next unit *only if the expected reduction in exposure (improved stability) justifies the cost of acquisition*.

  **Key Synthesis:**

  *   **Independence Lost:** Your reading fundamentally undermines Keynes's desired independence. Weight (as exposure) becomes mathematically and conceptually entangled with the current probability magnitude.
  *   **Decision-Making Revolutionized:** The strength of your reading lies in decision theory. It transforms weight from a passive measure of accumulated evidence into an *active, forward-looking metric for valuing information acquisition*. It provides a clear, quantifiable rationale for when delaying a decision under uncertainty (especially incomparable probabilities) is rational: **delay when the critical probabilities involved have high evidential exposure (are unstable), and the cost of acquiring the next unit of evidence is less than the expected value of stabilizing those probabilities.** It directly addresses the challenge Keynes left open regarding choice under non-numeric or incomparable probabilities by using weight itself as the guide for evidence gathering. The core implication is that **rational choice under uncertainty involves managing evidential exposure.**
