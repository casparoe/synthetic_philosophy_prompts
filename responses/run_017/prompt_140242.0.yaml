prompt: |-
  I do health-economic modelling for a public funder — mostly cost-effectiveness analysis: QALYs, DALYs, discount rates, equity weights, the reference-case rule that we only count health effects and ignore costs falling on other sectors. I'm fluent enough in all that; philosophy-wise I've got one undergrad course behind me and its fuzzy now.

  I keep bumping into philosophers arguing about speciesism and I want the argument in the vocabulary I actually work in. Take three claims — equal consideration of interests, the argument from marginal cases, and the claim that species membership is morally irrelevant in roughly the way that race or sex is — and translate each as faithfully as you can into my machinery: whose health gains get to enter the calculation at all, what gets weighted and by how much, what an equity weight would even be doing, what work the societal perspective is doing.

  Then the bit I actually care about: the residue report. Say which claims only translated with distortion, and which have no expression in CEA at all. My suspicion is that the moral-status question quietly collapses into just a question about which weights I'm allowed to enter, and that something gets lost in that collapse — but I can't say what. A live case that might anchor it: we're costing a zoonotic-disease control programme where one of the arms is culling wild badgers, and the harm to the badgers currently enters only as human willingness-to-pay for there being fewer badger deaths. Is that a bug in my framework, or is it the philosophers asking a question my framework has no way of asking?

  Tempting as it is to just tell me what to think about animals, please don't — I want the translation and the residue, not the verdict. And write it in American English.
reasoning: |-
  Okay, let me break this down. The user is a health economist working on cost-effectiveness analysis for public funding, using tools like QALYs, DALYs, discount rates, etc. They're encountering philosophical arguments about speciesism and want to understand how concepts like equal consideration of interests, argument from marginal cases, and moral irrelevance of species translate into their health-economic modeling framework. They specifically want to know what gets lost in translation and point to a real-world case of badger culling in disease control.

  First, I need to map the three philosophical claims to CEA components:
  1. Equal consideration of interests → whose health gains count in the model? Currently only humans are included as "subjects" in CEA, while animals appear only as costs via WTP. This is a fundamental mismatch.
  2. Argument from marginal cases → if we give weight to severely cognitively impaired humans, consistency demands similar consideration for animals. But CEA avoids this by having human/non-human as binary eligibility criteria.
  3. Species as morally irrelevant trait → this would require using characteristics like sentience as weighting criteria. But current equity weights are only applied to humans, with species itself being the exclusionary factor.

  The residue analysis shows two big gaps:
  - The framework can't handle animals as subjects of health gain, only as objects affecting human costs
  - The "who counts" decision happens before modeling begins, making it invisible in the calculations

  The badger culling example perfectly illustrates the problem: badger welfare enters only as a cost via human WTP, not as health loss to badgers themselves. The user suspects this collapses moral status into mere weighting, and they're right - the framework fundamentally can't ask "should badgers' health gains count?" because it presupposes they don't.

  I should emphasize how the societal perspective acts as a boundary that excludes non-human interests by definition. The translation shows CEA is structurally anthropocentric. What gets lost is the entire question of whether animals should be subjects in the model at all - that decision happens in the pre-analytic phase where philosophy lives, invisible to the spreadsheet.
answer: |-
  Here's a translation of the three philosophical claims into your health-economic modeling framework, followed by the residue report on what gets distorted or lost. The badger culling case will anchor the analysis.

  **Core Translation into CEA Machinery:**

  1.  **Equal Consideration of Interests:**
      *   **Translation:** All entities capable of experiencing welfare (positive or negative states) should have those welfare changes quantified and included in the CEA's main outcome measure (e.g., QALYs, DALYs) on an equal footing, per unit of welfare change. Sentience becomes the criterion for "subjecthood" in the model.
      *   **In Your Machinery:** This directly challenges the **"whose health gains get to enter the calculation at all"** rule. Currently, only humans are "subjects" whose health gains (QALYs gained, DALYs averted) populate the numerator. Equal consideration demands adding rows to the spreadsheet: Badger-Years (or similar sentient-animal-adjusted life years) would be included alongside Human-QALYs. Their gains/losses from the intervention (e.g., suffering/death from culling vs. disease reduction) would enter the aggregated health effect calculation directly, not just via costs.

  2.  **Argument from Marginal Cases:**
      *   **Translation:** If we grant full moral status/subjecthood in CEA to humans with cognitive capacities (e.g., severe intellectual disabilities, advanced dementia) comparable to or lower than many non-human animals, then consistency requires granting equivalent status/subjecthood to those animals in the model. The relevant characteristic for inclusion/weighting isn't species, but a capacity like sentience.
      *   **In Your Machinery:** This targets the **implicit eligibility rule** for whose health effects count. Currently, the rule is binary: *Homo sapiens* = included as subjects; *All others* = excluded as subjects. The AMC argues this rule is arbitrary if the *justification* for including all humans (sentience, capacity for suffering/well-being) also applies to non-humans. It implies the eligibility line should be drawn at sentience, not species membership. If a human with profound dementia gets their QALYs counted (even if heavily discounted or weighted differently due to condition), a similarly sentient badger should have its "BALYs" counted too.

  3.  **Species Membership as Morally Irrelevant (like race/sex):**
      *   **Translation:** Species membership itself should not be a determinant of the weight given to welfare changes in the CEA model. Once an entity is included as a subject (based on sentience), differential weighting *based solely on species* is unjustified discrimination. Differential weighting could only be justified by other characteristics relevant to welfare (e.g., intensity of experience, perhaps), not the species label itself.
      *   **In Your Machinery:** This focuses on the **"what gets weighted and by how much"** stage *after* subjecthood is established. Currently, equity weights (e.g., for disease severity, socioeconomic status, age *within humans*) are applied to human QALYs. Speciesism-as-irrelevant argues that adding a "species weight" (e.g., Human QALY = 1.0, Badger QALY/BALY = 0.1 *just because it's a badger*) would be unethical, akin to applying a race or sex weight. If badgers are included as subjects, their welfare changes should receive weight based on the *character of their experience* (e.g., intensity/duration of suffering), not their taxonomic classification. The societal perspective's boundary *excludes non-humans entirely*; this claim says that boundary itself embodies the speciesism.

  **The Societal Perspective's Role:** This defines the boundary of "society" whose costs and benefits count. Currently, it's implicitly (often explicitly) "human society." This perspective *does the heavy lifting* of exclusion. It pre-emptively answers "whose health gains count?" with "humans only," rendering the weighting question for non-humans moot by denying them subjecthood. Speciesism critiques argue this boundary-setting *is itself* the act of speciesism.

  **The Residue Report: What Doesn't Translate Cleanly or At All**

  1.  **Subjecthood vs. Weighting:**
      *   **Distortion:** The core philosophical debate about *whether non-humans are moral subjects at all* (the "who counts" question) is forced into the CEA framework's later stage of "weighting." Your suspicion is correct: The framework structurally collapses the fundamental question of *inclusion as a subject* into the question of *weighting magnitude* (even a weight of zero). But a weight of zero *within* the model is different from *exclusion from subjecthood* by the model's foundational rules.
      *   **Residue Lost:** The profound philosophical disagreement about the *existence* or *recognition* of non-human moral status is obscured. CEA's structure presupposes an answer ("only humans are subjects") before modeling begins. The framework has no internal mechanism to *challenge* that presupposition; it can only adjust weights *within* the human boundary.

  2.  **The Nature of the "Equity" in Equity Weights:**
      *   **Distortion:** Applying an "equity weight" to non-human welfare gains *if they were included* feels conceptually strained within standard CEA. Equity weights typically address fairness *among members of the moral community* (humans). Granting non-humans subjecthood raises questions beyond equity *among* subjects – it's about the *constitution of the community itself*. Is weighting a badger's BALY lower than a human's QALY an "equity" adjustment (like severity weighting) or a fundamental denial of equal moral standing?
      *   **Residue Lost:** The distinction between *intra-community fairness* (traditional equity weights) and *inter-species moral status* becomes blurred. The framework struggles to represent the idea that assigning a lower weight *solely due to species* is the *core injustice* (speciesism), not merely an issue of equitable distribution *within* an already justly constituted community.

  3.  **Direct vs. Instrumental Value:**
      *   **Distortion:** The philosophical claims emphasize the *direct moral status* and *intrinsic value* of non-human interests. CEA, as you practice it, *only* captures non-human interests through their *instrumental value to humans* (WTP).
      *   **Residue Lost:** The entire notion of an animal's welfare having *intrinsic* moral significance that should be counted *for its own sake* finds no direct expression. The framework inherently reduces non-human interests to how much humans care about them (WTP), which is fundamentally different from counting the *animal's own experience* as a direct input to the health outcome calculation. This is the crux of the badger case.

  **The Badger Culling Case: Bug or Unaskable Question?**

  *   **Current Framework:** Harm to badgers enters *only* as a human cost (WTP to avoid badger deaths). This is perfectly consistent with the standard societal perspective and subjecthood rule (only humans count).
  *   **Is it a Bug?** Only if you accept the philosophical premises (1, 2, 3) as compelling. If you believe badgers' suffering has *direct moral significance* that should influence the evaluation *independently* of human preferences, then yes, it's a bug – a structural limitation that excludes relevant moral information. The framework cannot represent the badger's suffering *as bad for the badger* within its core health outcome measure.
  *   **Is it an Unaskable Question?** Within the *strict confines* of reference-case CEA as currently defined (human-centric societal perspective, QALYs/DALYs for humans only), **the question "Should the badgers' own suffering count directly as a health loss?" is indeed unaskable.** The framework's foundational assumptions (who "society" is, what "health effects" mean) prevent this question from being formulated *within the model's internal logic*. The question exists entirely in the philosophical/political space *defining* the model's scope *before* the cost-effectiveness calculation runs. Your framework has no vocabulary for "subjecthood" beyond the human; it only has vocabulary for "costs" and "human health effects."

  **In essence:** The residue is the fundamental question of **subjecthood**. CEA's machinery brilliantly handles costs, human health effects, discounting, and weighting *among included subjects*. However, the decision of **who qualifies as a subject** – whose experiences are counted *directly* in the outcome measure – is predetermined by the societal perspective and lies outside the model's operational reach. The philosophers are arguing about who should be on the list of subjects in the first column of your spreadsheet. Your framework takes that list (currently: *Homo sapiens*) as a given input, not a variable it can calculate. The badger case highlights that the framework cannot internally question why the badger isn't on the list; it can only quantify how much humans care that badgers aren't on the list.
