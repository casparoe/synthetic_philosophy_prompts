prompt: |-
  I had a long and unsatisfying argument with a friend last night about refugees, and I think I now see why it went nowhere: we were each answering a different question and calling it by the same name. I want to try it the other way round. Below are my case-by-case verdicts, given as honestly as I can. What I want from you is the principle, if there is one, that they add up to.

  The first thing I noticed is that "refugee" seems to be doing two jobs at once: it marks a fact about a person (something has gone badly wrong for them) and it triggers a duty on someone else's part (you must let them in and not send them back). My verdicts below suggest those two come apart, and I don't know whether to conclude that there are two principles or that I am confused.

  On who counts:

  1. A shopkeeper who refuses to pay the local gang's extortion, is shot at, and finds the police uninterested because the gang has bought them. Counts. My friend says no, because there is no state persecutor; I say the state's refusal to protect is the whole problem.

  2. A family leaving a delta region where the salt water has reached their fields and their village will be gone within a decade. No one is targeting anyone. Doesn't count — but I resist the inference from "not a refugee" to "we owe them nothing," and I can't say why that inference fails here while it seems fine in the next case.

  3. A woman who would be confined, beaten and socially destroyed by her own family and community for leaving a marriage. The law is on her side; the police are not. Counts. My friend says this is private violence and therefore not the state's business; that strikes me as drawing the line in exactly the wrong place.

  4. A man who fled a city under indiscriminate bombardment. Nobody targeted him; he just lived there. Counts — and, curiously, I feel this more strongly than case 1, even though there is less in the way of anyone *doing* anything to him.

  5. An eighteen-year-old from a poor, peaceful, badly governed country who would simply do much better here. Doesn't count. And unlike in case 2, I do think this answer settles the practical question.

  6. A mixed case: a family that left after the drought killed their herd *and* after being pushed out of local office because they belong to a disfavoured minority. I think each factor alone would have been enough. Counts — but my confidence drains away as I imagine the persecution getting pettier and the drought getting worse, which suggests I am doing something like adding up harms, and I don't know whether that is legitimate.

  7. A former party loyalist who arrives here and, over two years, genuinely converts to a faith his home regime persecutes. Counts. A second man who, before leaving, posted videos denouncing that regime precisely in order to build a claim: doesn't count. A third who converted on the cynical advice of an agent, but who now would genuinely be in danger if returned: I find myself saying no, and then immediately noticing that I have no consistent story about *what* has to be genuine — the belief or the risk.

  8. A woman harassed and dispossessed in her home province who could live safely in the capital, nine hundred kilometres away, at the cost of her land, her language community and her livelihood. Counts, in my judgment — but this is the verdict I am least sure of, and it is the one my friend pressed hardest on.

  9. A former intelligence officer of a fallen brutal regime, now wanted by its successor; the new government would like to try him, and would torture him. Doesn't count. My reason is that he forfeited the claim — but a principle that is otherwise entirely about what will happen to the person has no obvious slot for forfeiture, and I want to know whether I have imported a second idea.

  10. A sixteen-year-old born here to parents whose claim was never resolved; speaks the homeland language poorly, has never lived there. Sending the family back feels wrong, but not, I think, because the child has a claim of the kind in cases 1 to 9. It feels like a different kind of reason altogether.

  On who must take them in:

  11. A neighbouring country hosting two million people from the same war, with schools on double shifts and a collapsed labour market; a rich country four thousand kilometres away hosting forty thousand. I think the rich country is doing far less than it owes — but I don't think the individual has a claim to be admitted *there*, which is apparently consistent with my thinking that they have a claim to be admitted somewhere.

  12. A person who transited four safe countries and claimed in the one with the most generous support and a large community from home. Much weaker claim, perhaps none. What troubles me is that this is case 11 with the choice made explicit, and I dislike the verdict less when the choice is hidden.

  13. A country that armed one of the factions in the war. I want to say its duty is greater, but not that it owes more *to this claimant* in particular — the wrong seems to be a fact about which duty-bearer should act, not about the content of anyone's claim.

  14. Forty million people denied citizenship and barred from most work across a whole region. I cannot accept that admission is the only way to discharge anything here; I equally cannot accept that therefore none of them count. My friend says this shows any individual-level principle fails to scale, and I suspect he is right.

  15. A group of citizens here who offer to fund and host two hundred families. I don't know whether that discharges a duty, transfers one, or merely changes who bears a cost, and my principle has no view.

  The best I have managed on my own is a kind of protection-deficit view: what matters is the size of the gap between the rights a person can actually exercise where they are and the rights they could exercise here, with duties of admission falling on whoever can close that gap at least cost. But I can't make it produce my verdict in case 8, it says nothing about case 10, and it silently assumes the answer in case 14. My friend's candidate is different: you count if your own state will not secure your basic rights, and the duty falls on whichever state is best placed to secure them, weighted by capacity and by causal contribution to the failure.

  So: give me a principle, or a short list of candidates, stated precisely enough that I could apply it myself. Tell me which clause each of my cases is doing the work for, and which verdicts you would overturn. Then tell me what it implies for cases I haven't listed, including at least two you generate yourself and think I would find uncomfortable, and at least one where you expect the principle to give a verdict I would reject. I don't want a survey of the legal categories or of what the literature says — I want the principle underneath, and the price of having one.
reasoning: |-
  Okay, the user presents a sophisticated ethical puzzle about refugee status and duties of admission. They've clearly done deep reflection on 15 specific cases and want a coherent principle that explains their intuitive judgments. 

  First I notice their core insight: "refugee" conflates descriptive fact (person in danger) and prescriptive duty (others must help). Their cases show these don't always align. Cases 1-10 test who qualifies; 11-15 test who must act. 

  Looking at their judgments: they recognize persecution without state actors (cases 1,3), reject environmental displacement alone (2), accept indiscriminate violence victims (4), reject economic migrants (5), and struggle with compound cases (6). Case 7 reveals their "genuine danger" criterion conflicts with requiring "genuine belief." Case 8's internal displacement dilemma shows tension between safety and identity preservation. Case 9 introduces forfeiture - a wholly new element. Case 10 hints at membership-based claims beyond danger.

  For duty-bearers: they distinguish individual claims from state obligations (11), dislike "asylum shopping" (12), recognize causal responsibility (13), and hit the scalability problem (14). Private sponsorship (15) puzzles them as it seems outside the state-duty framework.

  Their self-proposed "protection deficit" theory has three gaps: it can't explain why internal relocation isn't sufficient in case 8 (since rights gap persists), ignores case 10's membership claim, and assumes rather than solves case 14's mass displacement problem. Their friend's "state failure + capacity" model better handles case 8 but still misses forfeiture and membership.

  I construct a dual-principle framework: one for status (threat + non-avoidability) and one for duty (capacity + connection). For status, persecution isn't required - what matters is severe threat the person can't reasonably avoid. This covers gang victims (1), domestic violence (3), bombardment (4), but not pure economics (5). It explains their environmental migration hesitation (2 vs 6) - the drought alone is avoidable via adaptation; persecution alone requires escape; combined they create unavoidable threat. 

  For duties, I add three duty-intensifiers beyond capacity: proximity (for speed), connection (historical/cultural ties), and causal contribution. This makes case 11's rich country more obligated than neighbors by capacity, case 12's "asylum shopping" weak due to prior safety access, and case 13's arms-supplier specially responsible. 

  The hard cases reveal limits: case 7's "genuine conversion" dilemma shows we care about objectively verifiable risk, not subjective belief. Case 9's torturer forfeits claims because he created the system he now flees - this imports corrective justice. Case 10's child belongs through socialization, not danger - here refuge transitions to immigration policy. Case 14's scale requires burden-sharing systems beyond individual claims. Case 15's private sponsorship works through transferring responsibility, not removing it.

  I stress that any principle has moral costs: rejecting environmental migrants (case 2), accepting internal relocation when identity is destroyed (case 8), or permitting "asylum shopping" if we focus narrowly on safety (case 12). The forfeiture doctrine in case 9 could dangerously expand. The test will be whether these costs align with the user's core intuition that refuge is about unbinding people from unlivable situations, not administering perfect justice.
answer: |-
  Here's a principle distilled from your verdicts, designed to be testable against your cases. It has two core components addressing your observation that "refugee" does two jobs:

  **The Principle of Unavoidable Threat & Compensatory Duty (PUT-CD):**

  1.  **Status (Unavoidable Threat):** A person qualifies for refuge *status* if they face a **severe threat to fundamental rights or survival** in their home territory, **which they cannot reasonably avoid through relocation within that territory or non-migratory means**, *and* this threat arises from:
      *   **Persecution** (targeted harm by state or quasi-state actors, including deliberate state failure to protect),
      *   **Generalized Violence** (indiscriminate harm rendering an area unsafe), or
      *   **Catastrophic Collapse** (state/societal failure creating pervasive, life-threatening deprivation).
      *   *(Key: Avoidability is central. Threat must be severe, imminent or ongoing, and escape must be the only reasonable option.)*

  2.  **Duty (Compensatory Admission):** States have a duty to grant refuge (admit and not return) to such persons. The **strength of this duty** for a *specific state* regarding a *specific claimant* depends on:
      *   **Capacity:** The state's ability to provide refuge without undermining its own fundamental obligations to citizens.
      *   **Connection:** Proximity, historical/cultural ties, or specific causal contribution to the threat.
      *   **Burden Sharing:** The extent to which other capable states are already sharing the burden.
      *   *(Key: The duty is global, but assignment to specific states is contextual and proportional. No state has an absolute duty to admit every qualifying person regardless of context.)*

  **Applying PUT-CD to Your Cases (Status Component):**

  1.  **Shopkeeper:** **Counts.** Severe threat (death), state deliberately fails protection (quasi-state actor), cannot avoid locally (police bought). *Clause: Persecution (state failure) & Unavoidability.*
  2.  **Delta Family:** **Doesn't Count (Status).** Severe threat (eventually), but avoidable through *non-migratory* means (adaptation, internal relocation) *long before* survival is imminently threatened. *Clause: Avoidability (non-migratory/internal options likely exist for years).*
  3.  **Escaping Marriage:** **Counts.** Severe threat (violence, destruction), state deliberately fails protection (police inactive), cannot avoid locally (pervasive community/family control). *Clause: Persecution (state failure) & Unavoidability.*
  4.  **Bombardment:** **Counts.** Severe threat (death), Generalized Violence, cannot avoid locally (indiscriminate). *Clause: Generalized Violence & Unavoidability.*
  5.  **Economic Migrant:** **Doesn't Count (Status).** No severe threat to fundamental rights/survival, just lack of opportunity. Avoidable via non-migratory means (staying put). *Clause: Severity & Avoidability.*
  6.  **Drought + Minority:** **Counts.** Combined creates severe, imminent threat to survival/livelihood *and* persecution prevents internal relocation/adaptation. Each alone *might* not qualify: drought avoidable (case 2 logic), petty persecution avoidable locally? Combined = unavoidable threat. *Clause: Persecution + Collapse creating Unavoidability.*
  7.  **Converters:**
      *   **Genuine Convert:** **Counts.** Would face persecution *now* if returned. Risk is genuine and severe.
      *   **Cynical Poster:** **Doesn't Count (Status).** Created the risk *only* to claim status. *Not* an unavoidable threat *existing prior* to claim-building action. Avoidable by not posting.
      *   **Cynical Convert, Real Risk:** **Counts.** The *risk* upon return is genuine and severe *now*, regardless of original motive. The threat is real and unavoidable *now*. *Clause: Persecution & Unavoidability (current risk).* (Your verdict overturned: Motive affects credibility assessment, but current genuine risk defines status).
  8.  **Internal Relocation:** **Counts.** Relocation demands sacrificing fundamental aspects of identity/autonomy (land, livelihood, language community). This constitutes a severe threat to her ability to live a minimally decent life *within her own context*. State failure to protect her rights *in her home region* makes relocation unreasonable. *Clause: Persecution, Severity (loss of core identity/livelihood), Unavoidability (within home region).*
  9.  **Intelligence Officer:** **Doesn't Count (Status).** The threat (torture/trial) is a foreseeable consequence of his own *direct, voluntary actions* in service of the brutal regime. He created the machinery he now flees. Refuge status protects victims, not perpetrators from the consequences of their own culpable acts. *Clause: Forfeiture through culpable contribution to the system creating the threat.* (This *is* a distinct 'slot' - corrective justice/personal responsibility).
  10. **Child Born Here:** **Doesn't Count (Status under PUT-CD).** No current severe threat in homeland (only potential future hardship). Status is based on threat *in home territory*, not membership here. *Clause: Severity & Location of Threat.* (Agrees with you - different reason: membership/immigration policy).

  **Applying PUT-CD to Your Cases (Duty Component):**

  11. **Neighbor vs. Rich Country:** The *global* duty is unmet. The *individual* has a claim against *some* state(s) capable of refuge. The neighbor's duty is *stronger* due to **Proximity (Connection)** and perhaps diminished **Capacity**. The rich country's duty is *significant* due to high **Capacity** and likely **Burden Sharing** deficit. The individual doesn't have a primary claim *specifically* to the rich country, but the rich country has a strong secondary duty to share the burden. *Clause: Duty strength (Capacity, Connection/Proximity, Burden Sharing).*
  12. **Transiting Safe Countries:** **Weaker/Met Claim.** By transiting safe countries where the threat was neutralized, the claimant accessed safety. The duty of the first safe country was triggered. Claiming in a subsequent, more desirable country doesn't create a *new* or *stronger* duty for that country, absent other **Connections**. The initial duty was met by the safe transit countries. *Clause: Duty met (safety achieved), no strong Connection to preferred country.* (Overturns your discomfort: the choice being explicit clarifies that safety was available earlier).
  13. **Country Arming Faction:** Its **Connection** (causal contribution) *intensifies* its duty to provide refuge for victims of *that conflict*, relative to other equally capable states. This strengthens the duty *to the group*, making it more responsible for taking a fair share *of that specific group*. *Clause: Duty strength (Connection - Causal Contribution).*
  14. **40 Million Stateless:** PUT-CD *grants status* to individuals facing severe threats they cannot avoid locally. The *duty* problem (scale) is immense. No principle operating *only* at the individual claim level can solve this. PUT-CD implies:
      *   Individuals *do* qualify if they meet the status test (e.g., facing persecution/violence/collapse they cannot avoid).
      *   The *global duty* is massive and unmet.
      *   Discharge requires systemic solutions: burden-sharing treaties, regional processing, paths to citizenship in situ, international pressure on persecuting states. *Admission* is *one* tool, not the *only* one. Your friend is right: individual-level principles identify claims but don't solve systemic crises alone. *Clause: Status applies individually; Duty discharge requires collective, systemic action beyond individual admission.*
  15. **Private Sponsorship:** This *transfers the cost* of fulfilling the state's duty to the group, but does *not* remove the state's ultimate responsibility for admission and protection. It leverages private **Capacity** to make fulfilling the state's duty more feasible, potentially allowing the state to admit more than it otherwise could. The duty itself remains the state's. *Clause: Duty bearer (State); Private action facilitates duty fulfillment/cost-sharing.*

  **Uncomfortable Implications & Your Potential Rejections:**

  1.  **The "Merely" Persecuted Neighbor:** A person faces credible, severe, targeted persecution in Country A. They flee directly to peaceful, moderately capable Country B next door. Country B admits them. PUT-CD says they have *no claim whatsoever* against hyper-rich Country C 10,000km away. Country C has no compensatory duty *to this individual*, even if it has high capacity, because the threat was avoidable by fleeing to B, and B fulfilled the duty. *You might reject:* Feeling Country C still has *some* obligation due to its wealth, even if B acted.
  2.  **The "Avoidable" Famine Victim:** A severe, government-negligence-induced famine ravages Region X. Millions face starvation. Internal relocation is impossible (whole region affected). PUT-CD grants status (Collapse + Unavoidability). *But:* If credible international food aid *could* reliably reach Region X and avert starvation without migration, PUT-CD suggests the *duty of admission weakens or vanishes* for distant states. The primary duty shifts to providing aid in situ. Admission is only required if in-situ survival is truly impossible. *You might reject:* Insisting admission remains a core duty even if aid *could* work, due to distrust of implementation or the right to a "fresh start."
  3.  **Your Likely Rejection Point (Case 2 - Delta Family):** PUT-CD firmly says "Doesn't Count (Status)". The threat is future, avoidable via adaptation or planned relocation within the country. Granting refugee status now would fundamentally alter the concept into a general climate migration right. *You resist the "owe nothing" inference.* PUT-CD *agrees* you may owe assistance (aid, adaptation tech, planned relocation support) *but not refuge status/admission*. You seem to want refuge status to cover pre-emptive flight from environmental doom, even if avoidable internally. PUT-CD draws a harder line: refuge requires *imminent, severe, and unavoidable* threat.

  **The Price of PUT-CD:**

  *   **Clarity Over Compassion (Sometimes):** It denies refuge status to people in terrible, life-diminishing situations (like the Delta Family pre-catastrophe, some severe economic hardship) if the threat isn't imminent/severe/unavoidable. This feels harsh.
  *   **Complexity in Application:** Judging "reasonable avoidability," "catastrophic collapse," "quasi-state actors," and causal "connection" is inherently messy and context-dependent.
  *   **Forfeiture is Ugly but Necessary:** Case 9 shows we *do* withhold refuge from some facing severe threats due to their own culpability. This imports corrective justice, making the principle less "pure."
  *   **Doesn't Solve Scale:** Like all individual-focused principles, it identifies claims in Case 14 but offers no magic bullet for 40 million; it demands politically difficult systemic solutions.
  *   **Membership is Separate:** It excludes Case 10 children born here, relegating them to immigration policy, which may feel unsatisfying if you see their claim as equally strong.

  PUT-CD attempts to systematize your intuitive judgments, prioritizing **unavoidable severe threat** for status and **contextual capacity/connection** for duty assignment. It explains most of your verdicts (overturning only 7c and refining 12), embraces forfeiture (9), separates status from membership (10), and acknowledges the limits of individual claims for systemic problems (14). Its strength is reconciling your core intuitions across diverse cases; its cost is excluding some deeply sympathetic situations from "refugee" status.
