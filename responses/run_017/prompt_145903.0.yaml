prompt: |-
  Hi — I'm a science-and-ideas journalist and I'm trying to finish a piece about how computer scientists actually decide that a problem is hopeless, and I keep hitting a weird double practice that I'd like a philosopher to unpack. On the one hand, the field runs on something like the Cobham–Edmonds move: a problem is "efficiently solvable" only if there's a polynomial-time algorithm for it, and once somebody proves a problem NP-hard, that's treated as a license to stop looking for exact methods and go do approximations, heuristics, or a hardness-of-approximation paper instead — referees accept this move without asking anything further. On the other hand, the very same community's engineers solve "intractable" problems to proven optimality every day: verification and scheduling and routing instances with six-figure variable counts fall to branch-and-bound plus clever preprocessing in seconds, and the papers that report this are full of benchmark tables rather than asymptotics. There's even a standing joke about "galactic algorithms," the ones that are polynomial but with constants and exponents nobody will ever run. So the practice seems to contain two opposite attitudes toward the same formal notion at once.

  The bit that really puzzles me is an inconsistency across neighboring fields. Cryptographers designing a key-generation routine go out of their way to randomize, to avoid landing on structured or special instances that factoring or discrete-log attacks handle easily — they behave as though the hard instances are special and have to be aimed at deliberately. But the asymptotic worst-case framing that licenses the "give up, it's NP-hard" move behaves as though hard instances are what you'd be likely to meet anyway, and worst case is the honest accounting. It can't be that both are right in the same sense, or maybe it can and I'm missing something.

  Here's the thing I want to inject into the discussion, because nobody I interviewed would engage with it: almost no real workload is a single instance. It's a family of instances shat out by the same compiler, the same chip design flow, the same logistics pipeline, over and over, so you can preprocess once, cache, tune or learn a heuristic on the family's distribution, and the marginal cost per instance collapses even though any one fresh instance from scratch is NP-hard. I've been calling this the amortization escape hatch and the corresponding notion family-tractability: tractable per instance within a recurring family, intractable in the textbook per-instance-from-scratch sense. So: what philosophical commitments about tractability, feasibility, or the nature of computational difficulty does the existing practice (polynomial = feasible, NP-hardness = stop, asymptotics = the real object, constants = mere engineering) presuppose? Is it a thesis about problems, or about instances, or about distributions, or about what a community can know? Which parts does the practice strictly need and which does it merely sit well with, and where is it underdetermined enough that several rival accounts — worst-case, average-case, smoothed, parameterized, fixed-constant resource bounds, my family-level one — would license exactly the same behavior? And if you swapped in a family-level notion of tractability as the official one, what would actually have to change in how the field allocates its effort and what counts as a result? Give me exactly five numbered points, one or two sentences each, no intro, no sign-off.
reasoning: |-
  Hmm, the user is a science-and-ideas journalist working on a piece about how computer scientists decide problems are hopeless. They're struggling with what appears to be a contradiction in the field's practices. On one hand, computer scientists accept NP-hardness as a reason to stop looking for exact solutions, while on the other, they regularly solve large instances of these "intractable" problems in practice. There's also an inconsistency with cryptography where hard instances are treated as special rather than typical.

  The journalist has identified what they call the "amortization escape hatch" or "family-tractability" - the idea that real-world problems often involve recurring instances from the same source, allowing for preprocessing and optimization that makes individual instances tractable. They want me to unpack the philosophical commitments behind current practice and explore what would change if "family-tractability" became the standard.

  I need to provide exactly five numbered points about this without introduction or sign-off. Each point should be one or two sentences addressing the philosophical presuppositions, what parts of current practice are essential versus contingent, and how adopting a family-level notion of tractability would change things.

  The core tension here is between the theoretical worst-case framework that dominates complexity theory and the practical reality where instances have exploitable structures. Current practice presupposes that computational feasibility is inherent to abstract problems rather than instance distributions. This is useful for universal claims but ignores how real problems cluster into families with shared structures.

  If we switched to family-tractability, we'd see significant shifts in research priorities - more work on preprocessing, distribution-aware algorithms, and learning from instance streams. The NP-hardness "stop sign" would become more nuanced, applying mainly to worst-case scenarios rather than practical ones. Validation methods would also need to change, emphasizing distributional benchmarks over worst-case proofs.

  This journalist has clearly done their homework - they've identified a genuine paradox in how different subfields treat computational hardness and proposed a compelling alternative framework. My five points should help them articulate the philosophical underpinnings and practical implications of this idea in their article.
answer: |-
  Here are five numbered points addressing your query:

  1.  **Presupposed Commitment:** The practice presupposes computational feasibility is an *inherent property of abstract problems*, decoupled from specific instance distributions or real-world context, viewing worst-case complexity as the definitive measure of inherent difficulty.
  2.  **Core Need vs. Contingency:** The practice strictly needs the *formal separation* between asymptotic worst-case complexity (for classification/licensing the "stop") and practical engineering (for solving instances) to function; the specific *equivalence of polynomial-time with feasibility* is a contingent, historically entrenched axiom that simplifies discourse but isn strictly necessary for the core licensing move.
  3.  **Underdetermined Framework:** The practice is underdetermined regarding *instance distributions*; worst-case, average-case, smoothed analysis, parameterized complexity, and your family-tractability could *all* theoretically coexist within the same research ecosystem, licensing different approaches for different goals without inherently contradicting the NP-hardness "stop sign" for the worst-case view.
  4.  **Shift with Family-Tractability:** Adopting family-tractability as the primary notion would shift focus to *characterizing "problem families"* (defined by generative processes/distributions) and *amortized complexity*, making NP-hardness a weaker "stop sign" applicable only to novel, unstructured instances within a family, not the preprocessed recurring workload.
  5.  **Changed Validation:** Validation would prioritize *distributional benchmarks* and proofs of *amortized efficiency* over worst-case asymptotics alone, and "solving" a problem would mean designing the *full pipeline* (preprocessing + solver) for a specific family's instance stream, marginalizing purely asymptotic NP-hardness proofs as insufficient for practice.
