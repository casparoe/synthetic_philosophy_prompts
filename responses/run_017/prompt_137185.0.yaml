prompt: |-
  I'm in a small reading group that's slowly working through some metaphysics, and last night we got completely stuck on two cases and I realised I don't even know what we were arguing about anymore. Case one: a 90s band called The Potholers split up in 1998, and last year three fifths of the original line-up reunited with two new people, kept the name, and put out an album; Maya says it's the same band, Ross says it's a tribute act trading on a name. Case two: my university was founded in 1841 as a tiny seminary and has since changed its name four times, moved campus twice, been re-chartered under a totally different legal structure, and dropped all religious affiliation; Maya says the thing that exists now is literally the same institution founded in 1841, so the 184-years-old claim on the website is fine, Ross says no single entity survived all that, 'the university' is a convenient fiction, and there's nothing further to be true or false. Neither would budge, and eventually Ross threw up his hands and said: this is a merely verbal dispute — we agree on all the facts, so there's no fact of the matter, it's just a matter of what 'same band' and 'same institution' mean. Then someone else chimed in with the line I've definitely heard a hundred times: if you agree on every non-linguistic fact and still disagree, you're just arguing about words. Maya shot back that this is backwards, that knowing what the words mean just is knowing which facts matter, so that test can't get any grip.

  So I don't want a verdict on the band or the university, I want the slogan taken apart. What are the distinct precise claims 'there's no fact of the matter / it's merely verbal' could be making here? Give me a menu from the boring to the wild, and for each one say whether it's trivial, substantive and defensible, or actually false or incoherent. Please cover at least these: (a) both sides would stop disagreeing once 'same' is disambiguated into 'same-as-x' and 'same-as-y'; (b) the disputed sentence's truth varies with a choice of conceptual or linguistic framework, and no framework-neutral fact selects between the frameworks; (c) the sentence isn't really truth-apt at all, so the question is a pseudo-question rather than a hard one; (d) the world itself is indeterminate here and the dispute tracks real vagueness or indeterminacy in things rather than in our words; (e) there is a perfectly determinate answer, but it's the kind of answer you could get just from competence with your own words, so it's a fact of the matter that nobody should find interesting. Also: does the 'we agree on all the facts' test even get off the ground in the university case? Try stating what the shared non-linguistic facts would have to be without helping yourself to the very notion in dispute — my notes say this is where Ross's move falls apart but I can't make it precise. Someone mentioned 'internal versus external questions', which I half remember from a lecture; if that's a real distinction that lines up with one of the readings above, say which and say what it adds that the others don't. And most importantly: tell me which of these readings would actually do the work Ross needs — which ones genuinely license 'so stop arguing, there's nothing here to be right about' — and which ones leave Maya's position completely intact, because I suspect the slogan only sounds decisive on a reading nobody would defend.

  Since I'm bringing this list back to the group, please say how confident you are in each verdict (rough numbers or just high/medium/low is fine) and single out the one claim you're least sure about and why — I'd way rather have the shaky bit flagged than have it presented as settled.
reasoning: |-
  Okay, the user is part of a reading group stuck on metaphysical disputes about identity over time—specifically whether a band reunion is the same band and whether a university that's changed significantly is the same institution. They want the phrase "merely verbal dispute" analyzed, not a verdict on the cases.  

  First, I need to unpack what "no fact of the matter" could mean. The user listed options (a) through (e). Let me tackle each:  

  For (a), disambiguating "same" into types like numerical vs. qualitative identity might resolve it. If Ross and Maya mean different things by "same," clarifying terms could end the debate. But they might still disagree on which standard applies, making it not entirely verbal.  

  Onto (b), the framework-relative claim. Here, truth depends on the conceptual scheme. If both frameworks are coherent and no neutral fact chooses one, the dispute might be verbal. But Maya could argue certain frameworks are objectively better, so it's not just about words.  

  For (c), if the sentence isn't truth-apt, it's a pseudo-question. But statements like "same band" seem truth-evaluable in context, so this probably doesn't apply.  

  For (d), real-world indeterminacy. If the world is vague here, the dispute reflects that. But vagueness might still be linguistic, so this is tricky.  

  Lastly, (e), a determinate but uninteresting answer. If competence with language gives the answer, it's trivial. But Ross and Maya might disagree on what competence requires, so it might not settle things.  

  The user also asks if the "agree on all facts" test works for the university case. To state non-linguistic facts without using "same institution" is hard. Facts like legal documents or name changes are agreed upon, but calling it the same university requires interpretation.  

  The internal/external question distinction (from Carnap) might help. Internal questions are within a framework (e.g., "Is this the same band under our criteria?"), while external questions are about choosing frameworks. The dispute might be external, so no fact settles it.  

  Which readings let Ross say "stop arguing"? If it's (a) and they mean different things, or (b) with no neutral fact, or external questions. Maya's position holds if she thinks there's an objective standard (d) or if (e) is wrong.  

  Confidence levels: (a) is high, (b) medium, (c) low, (d) medium, (e) medium. Least sure about (c) because "same band" seems truth-apt.  

  The key is whether the dispute persists after disambiguation. If it does, it's not merely verbal. The university case shows stating non-linguistic facts without the disputed concept is challenging, making Ross's move shaky.
answer: |-
  Here’s a systematic breakdown of the "merely verbal dispute" slogan, tailored to your cases. I’ll evaluate each claim, flag confidence levels, and identify which readings support Ross’s "stop arguing" stance versus Maya’s position. **The least confident verdict is (d)** (explained later).

  ---

  ### **The Core Slogan: "If you agree on non-linguistic facts but disagree, it’s merely verbal"**
  **The Problem:** "Non-linguistic facts" are fiendishly hard to specify *without* smuggling in contested concepts (like "same band" or "same institution"). In the university case, we might agree on:  
  - *Timeline facts*: "Entity X was founded in 1841 as a seminary; it relocated in 1920 and 1965; it adopted name Y in 1950; its charter was replaced in 1978; it severed religious ties in 1990."  
  - *But* calling this timeline "the university" **presupposes** persistence through change—the very issue in dispute.  
  **Verdict:** Ross’s test **fails to launch cleanly** in cases involving identity-over-time. Stating "all non-linguistic facts" requires describing the world *without* using the disputed concept—which is impossible here. Maya’s retort ("knowing what words mean *is* knowing which facts matter") has traction.  
  - **Confidence:** High (90%)

  ---

  ### **Menu of Claims: What "No Fact of the Matter" Could Mean**
  #### **(a) Ambiguity Resolution**  
  *Claim:* Disagreement vanishes if "same" is disambiguated (e.g., "numerically identical" vs. "functionally equivalent" vs. "legally continuous").  
  - **Verdict:** **Plausible but incomplete.** In the band case:  
    - *Numerical identity* (same enduring entity) → Ross wins (likely a new band).  
    - *Legal/brand identity* (same trademark/name) → Maya wins.  
    - *Cultural identity* (same artistic lineage) → Ambiguous.  
    **But:** Ross and Maya might *still* disagree on *which* disambiguation is relevant. That deeper dispute isn’t verbal.  
  - **Ross’s "stop arguing"?** Only if both accept disambiguation.  
  - **Maya intact?** Yes, if she insists her disambiguation is objectively correct.  
  - **Confidence:** High (85%)

  #### **(b) Framework Relativity**  
  *Claim:* Truth of "same band/university" varies with conceptual frameworks (e.g., legal, cultural, material-continuity). No framework-neutral fact selects between them.  
  - **Verdict:** **Substantive and defensible** (draws on Carnap’s "internal/external" distinction).  
    - *Internal question:* "Is this the same band *given framework F*?" (Answerable by facts + framework rules).  
    - *External question:* "Which framework *should* we adopt?" (Not truth-apt; pragmatic/political).  
    In your cases, the dispute is *external*—no fact forces a choice between "legal continuity" or "original membership" frameworks.  
  - **Ross’s "stop arguing"?** **Yes—if** the disagreement is about framework choice.  
  - **Maya intact?** Only if she argues one framework is *objectively privileged* (e.g., "institutions just *are* their legal continuity").  
  - **Adds:** Distinguishes answerable questions *within* systems from unanswerable questions *about* systems.  
  - **Confidence:** Medium-High (80%)

  #### **(c) Non-Truth-Aptness**  
  *Claim:* Statements like "This is the same band" aren’t genuinely true/false; they’re expressions of attitude (e.g., "I endorse this as authentic").  
  - **Verdict:** **Likely false/overreaching.** Such claims function as truth-apt in ordinary discourse (we cite evidence, give reasons). Denying this risks dismissing all contingent identity claims as "pseudo-questions."  
  - **Ross’s "stop arguing"?** Only if he embraces radical non-cognitivism (unlikely).  
  - **Maya intact?** Yes—she clearly thinks her claim is factual.  
  - **Confidence:** Low (20%) for applying to these cases.

  #### **(d) Real-World Indeterminacy**  
  *Claim:* The world itself is vague; there’s no determinate fact about band/university identity.  
  - **Verdict:** **Defensible but speculative.** Metaphysical vagueness (vs. semantic vagueness) is controversial. In the band case: Is the vagueness in *what bands are* or in *our concept* of bands?  
  - **Ross’s "stop arguing"?** Yes—if reality is fuzzy, no "right answer" exists.  
  - **Maya intact?** Only if she insists reality is sharp here.  
  - **Confidence:** **Lowest (35%)** — I’m least sure because it’s hard to distinguish from semantic vagueness without deeper metaphysics. *Why?* We lack clear criteria for when vagueness is "in the world." This claim often collapses into (b) or (e).

  #### **(e) Trivial Linguistic Fact**  
  *Claim:* There’s a determinate answer, but it’s knowable via semantic competence alone (e.g., "by ‘same band,’ competent speakers mean X").  
  - **Verdict:** **False for these cases.** Competent speakers *disagree* on "same band" application (as your group shows!). Semantic competence fixes *paradigms* (The Beatles 1965 = The Beatles) but not *borderline cases* (your reunion band).  
  - **Ross’s "stop arguing"?** Only if he wrongly assumes linguistic facts settle it.  
  - **Maya intact?** Yes—she’d argue meaning doesn’t resolve this alone.  
  - **Confidence:** Medium (70%)

  ---

  ### **Which Readings Support Ross? Which Leave Maya Intact?**
  - **Ross’s "stop arguing" wins if:**  
    - (a) + both accept disambiguation (unlikely),  
    - (b) the dispute is external/framework choice,  
    - (d) reality is genuinely indeterminate.  
  - **Maya intact if:**  
    - She claims one disambiguation is objectively correct (a),  
    - She rejects framework-relativity (b),  
    - She asserts determinacy (d),  
    - Or she denies triviality (e).  

  ### **Crucial Takeaway**  
  **Ross’s slogan only works decisively on reading (b) — the framework-relativity view.** Even then, Maya could reject it by claiming her framework is metaphysically privileged (e.g., "institutions *are* their legal continuity, full stop"). **The slogan collapses if the dispute is about *which facts are relevant* (per Maya’s point) or semantic competence alone can’t resolve it.**

  ---

  ### **Recommendation for Your Group**
  1. **Test Ross’s slogan:** Ask each side to list "non-linguistic facts" about the university *without* using identity-presupposing terms ("the seminary *became*..."). Watch them struggle.  
  2. **Focus on (b):** Discuss Carnap’s internal/external distinction. Is the disagreement about *what institutions are* (external) vs. *whether this satisfies a criterion* (internal)?  
  3. **Pressure Maya:** What makes her preferred framework (legal continuity? core purpose?) objectively "correct"?  
  4. **Pressure Ross:** If it’s "merely verbal," why do people *care*? (Hint: Frameworks have ethical/practical stakes.)

  This isn’t just wordplay—it’s about what we value in persistence: material continuity, functional role, legal identity, or something else. That’s why it’s metaphysics, not semantics.
