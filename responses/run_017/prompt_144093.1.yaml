prompt: |-
  I write historical novels set in periods and among events whose shape most of my readers already know. The manuscript I am currently outlining concerns a real and well-documented mercantile expedition that failed, and anyone who opens the book will know within thirty pages that it failed. A review of my last novel complained, fairly I thought, that the book moved as though the catastrophe had been fated: every chapter laid another brick on a road that led to only one place, and the characters' decisions read as stage directions rather than as gambles. I do not think the remedy is to stop telling stories with known endings. I am not going to give up dramatic irony, and my readers do not want me to; the pleasure of the form is precisely that we watch people walk toward an outcome we can already see. What I want is to keep the outcome known while making the route to it feel like one that could have gone otherwise, and to do that without falsifying the record or manufacturing uncertainty nobody had.

  The difficulty is that I cannot see, from inside my own drafting, when I am doing the thing I am trying to avoid. I know how it ends; so does my reader; and the archive I work from is not neutral, since documents survive in part because they later mattered, and the people who wrote them were frequently explaining themselves after the fact. I have begun separating out three or four failure modes, and I would like a procedure that handles them, though I would rather you sharpen or replace my distinctions than simply adopt them. First, my own foreknowledge leaking into causation: treating something as a cause mainly because, given the outcome, it looks like one. Second, retrofitted motive: giving a character a reason that fits what they later did, and then experiencing that reason as though it explained the action rather than being inferred from it. Third, archival selection: promoting whatever survived in the record, and above all whatever was uncovered, litigated, or confessed afterwards, into the engine of the plot, when its prominence in the file may be an effect of the disaster rather than a cause of it. Fourth, a problem that belongs to the reader rather than to me: an explanation can be scrupulously fair and still land as inevitable, because the person reading it knows the ending and supplies the rest. A related worry is that when I try to restore contingency by dramatizing alternatives, I may be inventing options that were never in the air: logically available, but not ones anyone at the time proposed, feared, or could have acted on. I have been calling these dead alternatives, as opposed to live ones, and I want the procedure to draw that line and to say what would count as evidence that an alternative was live.

  So please turn what is actually known about hindsight bias and the narrative fallacy into a procedure I can run on a plotline before I draft it: the questions in order, what counts as a sufficient answer to each, where the answer is a stop or a rewrite, and where the question comes back to me because it is a judgment about the novel rather than a fact about the past. The constraints are these. I have roughly an afternoon per plotline. I work with a research assistant who reads the period hands and knows nothing of the theory, and a fact-checker who must sign off on anything the book asserts about the world; so most steps have to be executable by the assistant, and the procedure should say which steps cannot be delegated. It must not ask me to withhold the outcome or to feign ignorance I do not have, and it has to leave room for the reader's foreknowledge as a fixed condition rather than a defect to be engineered away. Then run it on three subplots from the current outline: a purser's embezzlement, recorded in the sources because it was discovered during the post-mortem into the failure, which I have been using as the main causal hinge and as my villain; a lieutenant's change of allegiance, for which the surviving letters give no reason at all and to which I have supplied a childhood grievance; and the loss of the expedition's fortified trading post, which on the military facts looks genuinely overdetermined, since the garrison was too small, the relief was not coming, and the siege works were competently built. At least one of the three should return a verdict I will not like, and I would rather have it from you than from my editor. I should also say that I have been toying with a device for restoring contingency from the reader's side: a scene dramatizing an outcome that did not occur, staged as a rumour running through the camp, a letter that argues for the other course, or a chapter from the perspective of someone who expected things to go differently. Tell me whether your procedure licenses that device, on what conditions, and where it degenerates into manufacturing a contingency the period did not contain. Finally, be plain about what the procedure cannot do: I would rather know now which of these questions it can only re-describe.
reasoning: |-
  Okay, the user is a historical novelist facing a significant challenge. They write about well-known historical events where readers already know the outcome, but they've received criticism that their narratives feel too predetermined, like the catastrophe was inevitable. They want to maintain dramatic irony but make the journey feel contingent—like things could have gone differently—without falsifying history or creating false uncertainty.

  The user has identified four failure modes: their own foreknowledge leaking into causation, retrofitted motives, archival selection bias, and the reader's hindsight bias. They're seeking a practical procedure to check their plotlines against these issues, with specific constraints: limited time, a research assistant who can handle period documents but lacks theoretical knowledge, and a fact-checker for accuracy.

  They've provided three subplots to test: a purser's embezzlement (which they're using as a causal hinge), a lieutenant's unexplained change of allegiance (where they've invented a childhood grievance), and the loss of a trading post that seems genuinely overdetermined. They also want to know if dramatizing alternative outcomes (like rumors or hypothetical letters) is a valid technique and where it might cross into fabrication.

  The user needs a structured, efficient method that respects historical accuracy while restoring narrative contingency. The solution must work within their workflow—delegating tasks where possible, preserving dramatic irony, and avoiding artificial suspense. They're clearly experienced and self-aware, having already analyzed their own pitfalls, so the procedure should build on that insight rather than offer generic advice.

  The core tension here is between historical inevitability (as perceived post-fact) and the lived uncertainty of the past. The user wants readers to feel the weight of possible alternatives that were genuinely considered at the time, not just plausible in hindsight. The challenge is to systematize this without oversimplifying.

  For the procedure, it should be a checklist-like workflow with clear questions, delegated tasks, and decision points. It needs to flag when the novelist is importing hindsight or overprivileging archival survivors. For the "live alternatives" question, evidence could include period documents showing contemporaries discussing or fearing those outcomes. The dramatized-alternatives device could work if anchored to historical evidence of such rumors or debates.

  Testing the subplots: the purser's embezzlement likely fails the archival selection test (it's prominent because discovered post-failure, not necessarily pivotal). The lieutenant's grievance needs evidence it was a live motive at the time. The trading post's loss might be truly overdetermined, so contingency should focus on smaller choices (e.g., how long they held out). One of these should return a "rewrite" verdict—probably the purser plot as the main villain.

  The procedure won't solve reader psychology (hindsight bias is innate) or manufacture evidence where none exists. It can only structure the interrogation of choices against period sources. The dramatized-alternatives device is licensed if rooted in attested contemporary fears or proposals.
answer: |-
  Here is a procedure designed to combat hindsight bias and the narrative fallacy in your historical fiction, built for efficiency within your constraints. It focuses on **identifying and preserving *period-contingency*** – the uncertainty experienced *at the time* by the people involved – without falsifying history or undermining dramatic irony.

  **The Contingency Audit Procedure**

  **Core Principle:** Treat every significant decision, event, or condition leading to the known failure *as if it were happening in real-time for the characters*, interrogating the evidence for the *contemporaneous perception* of risk, alternatives, and likelihoods.

  **Who Does What:**
  *   **RA (Research Assistant):** Handles steps marked **(RA)**. Requires sourcing specific evidence from period documents.
  *   **Author (You):** Handles steps marked **(Author)**, especially judgment calls about narrative function.
  *   **Fact-Checker (FC):** Verifies final historical assertions *after* the procedure informs the draft. Not part of the audit itself.

  **The Steps (Run per Plotline or Key Decision Point):**

  1.  **Identify the Critical Element:** What is the decision, action, event, or condition being examined? (e.g., "Purser decides to embezzle," "Lieutenant defects," "Commander refuses to evacuate the trading post"). *(Author - 5 mins)*
  2.  **State the Presumed Narrative Role:** How is this element *currently intended* to function in the plot? (e.g., "Primary cause of failure," "Motivates X's betrayal," "Demonstrates doomed overconfidence"). *(Author - 2 mins)*
  3.  **Evidence Hunt: Contemporaneous Perception (RA):**
      *   **(RA Task):** Find *period documents* (letters, logs, orders, diaries, pamphlets) created **BEFORE the outcome was known** that mention:
          *   *This specific element:* How was it described? Was it seen as unusual, risky, normal, beneficial?
          *   *Perceived alternatives:* What other courses of action were **explicitly discussed, proposed, feared, or hoped for** regarding this situation *at the time*? (This defines **Live Alternatives**).
          *   *Perceived risks & likelihoods:* What were the documented fears or predictions about potential outcomes *stemming from this element or its alternatives*? What was seen as likely/probable vs. unlikely/disaster?
          *   *Motives given at the time:* If relevant, what reasons did the actors *themselves state* (or others attribute to them) **before the outcome** for their actions?
      *   **Sufficient Answer:** At least 2-3 distinct period sources (or one highly detailed/reliable source like a key participant's journal) addressing these points. *If none exist*, flag this starkly: **"No Contemporaneous Evidence Found."** (RA - 1-2 hours)
  4.  **Evidence Hunt: Post-Hoc Attribution (RA):**
      *   **(RA Task):** Find key sources created **AFTER the failure was known** that discuss this element (e.g., inquiry reports, confessions, memoirs, later histories).
      *   **Sufficient Answer:** Identify sources. Note any shifts in emphasis, new causal claims, or motives attributed that *aren't* present in the pre-outcome evidence. (RA - 30 mins)
  5.  **Interrogate Causation & Motive (Author using RA findings):**
      *   **Q1 (Leaking Foreknowledge):** Does my plot over-rely on sources/interpretations *from Step 4*? Does it treat an element as *the* cause primarily because hindsight makes it look pivotal? **Stop/Rewrite:** If Step 3 evidence shows this element was minor, routine, or seen as low-risk *at the time*, but Step 4 sources elevate it. *Scale back its causal weight to match period perception.*
      *   **Q2 (Retrofitted Motive):** Is the motive I've assigned (or heavily implied) for an action **supported by Step 3 evidence**? Or is it primarily inferred from the outcome (Step 4)? **Stop/Rewrite:** If Step 3 shows *different* stated motives, *no* clear motive, or if my invented motive lacks *any* period grounding (even in broader cultural/psychological norms). *Adjust motive to fit evidence OR make its uncertainty part of the narrative.*
      *   **Q3 (Archival Selection):** Is this element's prominence in my plot justified by its **Step 3 significance**, or is it inflated because it's prominent in *post-mortem* records (Step 4)? **Stop/Rewrite:** If Step 3 evidence shows it was minor/unremarkable *at the time* but Step 4 made it a scapegoat/focus. *Demote its plot role OR explicitly show its post-hoc inflation within the narrative.*
  6.  **Assess Contingency & Live Alternatives (Author using RA findings):**
      *   **Q4 (Dead vs. Live Alternatives):** What **Live Alternatives** (Step 3) existed? Does my narrative adequately dramatize these *as they were perceived at the time* (hopeful, risky, plausible, desperate)? **Stop/Rewrite:** If I've invented alternatives never discussed/feared (Dead Alternatives) OR if I've omitted significant Live Alternatives that heighten contingency. *Integrate Live Alternatives based on Step 3 evidence.*
      *   **Q5 (Perceived Risk):** Does my narrative convey the *actual range of outcomes anticipated at the time* based on Step 3? Does it show why the *chosen* path might have seemed reasonable, or at least not doomed? **Stop/Rewrite:** If the narrative presents the path to failure as obvious or the only logical choice *from the start*. *Emphasize the perceived likelihood of success/other outcomes per Step 3.*
  7.  **Reader Foreknowledge & Dramatic Device Check (Author):**
      *   **Q6 (Inevitability Landing):** Even with accurate contingency, could the *reader's* hindsight still make this feel fated? **Judgment Call:** Yes, inevitably. The procedure mitigates *your* bias, not the reader's. *This is where dramatic irony lives. Accept this limit.*
      *   **Dramatizing Alternatives Device:**
          *   **Licensed If:** The dramatized alternative (rumour, letter, POV) represents a **Live Alternative** (Step 3 evidence!).
          *   **Degenerates If:** It invents a Dead Alternative (no Step 3 evidence) purely to create "what if" tension. It becomes manufactured contingency.
          *   **Best Use:** To vividly illustrate a **Live Alternative** that was seriously considered or feared, deepening understanding of the *contemporaneous* stakes and uncertainty. Anchor it firmly in Step 3 evidence.

  **What the Procedure CANNOT Do:**
  1.  **Eliminate Reader Hindsight Bias:** The reader *knows* it failed. Some sense of trajectory is inherent. The procedure ensures this trajectory isn't *falsely* presented as the *only possible* one from the start, but it can't make the reader forget the ending.
  2.  **Manufacture Evidence:** If Step 3 finds "No Contemporaneous Evidence," the procedure flags a major risk. You can't invent contingency where the record shows none was perceived. You can only *show* the complacency or lack of foresight.
  3.  **Resolve Genuine Overdetermination:** If Step 3 shows multiple independent factors *all* pointed strongly to failure *at the time* (e.g., the trading post), the procedure confirms this. Contingency then exists in *how* it played out, smaller choices, or the timing, not in avoiding the outcome.
  4.  **Judge Pure Narrative Effectiveness:** It flags historical fidelity issues affecting contingency perception. Whether the *resulting* narrative is compelling is your artistic domain.

  ---

  **Application to Your Subplots (Applying the Procedure):**

  **1. Purser's Embezzlement (Your "Villain" & Causal Hinge)**
  *   **Step 3 (RA):** Search pre-failure logs, purser's own reports, ship's council minutes, private letters *before* disaster struck. Was the embezzlement *suspected*? Was financial strain noted *without* attributing it to malfeasance? Were audits routine or lax? Were other financial risks discussed?
  *   **Step 4 (RA):** Focus on the post-mortem inquiry records detailing the discovery.
  *   **Interrogation:**
      *   **Q1 (Leaking Foreknowledge):** **HIGH RISK.** If Step 3 shows no pre-failure suspicion or focus on finances *beyond normal risks*, but Step 4 makes it the primary cause found by the inquiry – your plot is likely falling into this trap. **VERDICT: STOP/REWRITE.** Demote its causal role. Show it as *a* factor discovered later, not *the* hinge. The inquiry needed a villain; your narrative shouldn't uncritically adopt that.
      *   **Q2 (Retrofitted Motive):** Depends on evidence. Greed is perennial, but was there *specific* evidence (e.g., debts mentioned pre-voyage) in Step 3? If not, avoid deep psychoanalysis; present it as an opportunity taken.
      *   **Q3 (Archival Selection):** **VERY HIGH RISK.** Its prominence is *directly* from Step 4. **VERDICT: STOP/REWRITE.** Its plot role must be drastically scaled back unless Step 3 provides strong evidence it was a major *contemporaneous* issue.
  *   **Contingency:** Embezzlement itself might not have been a live alternative (no one planned to get caught), but financial mismanagement *risk* might have been. Focus on that.
  *   **Device:** A scene where a junior officer *suspects* funds are off but is ignored (only if Step 3 evidence suggests such suspicion existed) heightens contingency. Inventing a complex embezzlement scheme *only* revealed post-failure does not.

  **2. Lieutenant's Change of Allegiance (Childhood Grievance Invented)**
  *   **Step 3 (RA):** Search his letters pre-defection, letters *to* him, commander's reports, ally intelligence. Any hint of discontent, ideological shift, personal grudges mentioned? What alternatives were discussed regarding his loyalty/role? Was defection feared?
  *   **Step 4 (RA):** Later accounts explaining his betrayal.
  *   **Interrogation:**
      *   **Q1 (Leaking Foreknowledge):** Lower risk if his defection had immediate impact. Ensure its impact isn't overstated *because* of the failure.
      *   **Q2 (Retrofitted Motive):** **CRITICAL RISK.** If Step 3 shows *no* mention of this childhood grievance, or any motive beyond perhaps vague discontent, your invention is retrofitted. **VERDICT: STOP/REWRITE.** Either:
          *   Find a period-plausible motive supported by Step 3 evidence (e.g., ideological shift mentioned, conflict with commander).
          *   Make the motive ambiguous *in the narrative*, reflecting the lack of evidence. Show others speculating (based on period attitudes).
          *   *If* the childhood event is documented (e.g., in his early life records), show it as background *without* asserting it as the direct cause unless Step 3 links it.
      *   **Q3 (Archival Selection):** Lower risk; his defection was likely significant when it happened.
  *   **Contingency:** Were there attempts to placate him, watch him, or counter his influence *before* he defected? (Live Alternatives). If Step 3 shows no such concerns, his defection might have been a genuine shock, reducing contingency *around the act itself* but increasing it in the *response*.
  *   **Device:** A letter *from him* expressing discontent (if Step 3 found such) makes the motive feel live. Inventing a dramatic childhood flashback he has while defecting is likely fabrication.

  **3. Loss of the Trading Post (Genuinely Overdetermined?)**
  *   **Step 3 (RA):** Commander's dispatches requesting reinforcements, council of war minutes discussing options (hold, evacuate, negotiate), intelligence reports on enemy strength/siege preparations, engineer's assessments, letters home expressing hope/fear. What alternatives were *seriously debated*?
  *   **Step 4 (RA):** Post-mortem analyses, blame assignment.
  *   **Interrogation:**
      *   **Q1 (Leaking Foreknowledge):** Risk comes from presenting the fall as inevitable *from the outset*. Step 3 evidence likely shows debate: "We can hold with relief," vs. "We must negotiate now." **VERDICT:** Contingency likely existed in *how long* they held out, *terms* of surrender, or a breakout attempt. Ensure the narrative focuses on *those* debates and hopes.
      *   **Q2 (Retrofitted Motive):** Less relevant unless assigning specific blame for decisions.
      *   **Q3 (Archival Selection):** Post-mortems will dissect reasons. Ensure your narrative emphasizes the *pre-failure* understanding of the risks (garrison size, relief chances) rather than just the post-hoc autopsy.
  *   **Contingency:** **HINGES ON STEP 3.** What were the **Live Alternatives**? Evacuation? Negotiation? A desperate sortie? Holding firm believing relief *might* come? **The procedure forces you to dramatize THESE debates and their perceived chances of success/failure based on Step 3 evidence.** Even if military reality was grim, the *human* contingency lies in these choices.
  *   **Device:** **IDEAL CANDIDATE.** A scene depicting a heated council of war debating the Live Alternatives (evacuate/negotiate/hold) based on Step 3 minutes. A rumour spreading that relief *is* coming (if Step 3 shows such rumours existed or were hoped for). A chapter from an optimistic officer's POV. All licensed if grounded in Live Alternatives.

  **Verdict You Won't Like:** The **Purser's Embezzlement** subplot, as currently conceived as the main causal hinge and villain, almost certainly fails the audit (Q1 & Q3). Its prominence stems from hindsight (the post-mortem). You must significantly reduce its causal weight and avoid making the purser a simplistic villain unless Step 3 provides extraordinary evidence.

  **Key Takeaway:** This procedure forces you and your RA to rigorously separate the *past-as-experienced* (Step 3) from the *past-as-explained* (Step 4). By grounding causality, motive, and perceived alternatives firmly in the contemporaneous evidence, you restore the authentic contingency of the moment, allowing dramatic irony to arise from the *reader's* knowledge contrasting with the *characters'* hopes and fears, not from your narrative implying they were blind to an obvious fate.
