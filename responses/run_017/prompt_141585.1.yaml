  We are drafting a joint statement after a good-faith adversarial collaboration between an endurantist and a perdurantist. Both are eternalists. We need:

  1. Agreed Claims (numbered, substantive)
  2. Each side's position restated in their own words.
  3. Disagreements table (with rows for each residual disagreement, columns: Endurantist's Formulation, Perdurantist's Formulation, Crux, Case/Argument, and Predictions).
  4. Note on verbal disputes.

  We also have two cases: (A) Splicing and (B) Hypothetical successor physics.

  Finally, a bottom line.

  Let's structure the document:

  I. Agreed Claims (Numbered)

  We'll list agreed claims about:
  - Change
  - Temporary properties
  - Coincidence
  - Fission
  - What an account of persistence is supposed to do.

  II. Restatement of Positions

  A. Endurantist's position
  B. Perdurantist's position

  III. Disagreements Table

  We'll have rows for the following cruxes (and any others we see fit):

  1. Whether "x is F at t" can be primitive or must be analyzed.
  2. The argument from temporary intrinsics (once the endurantist has time-relative properties).
  3. Unrestricted composition and overpopulation.
  4. The analogy between time and space.

  Columns:
  - Endurantist's Formulation (of the disagreement)
  - Perdurantist's Formulation
  - Crux (sub-question)
  - Case/Argument (both accept as bearing on the crux, e.g., Splicing or the physics case)
  - Endurantist's Prediction
  - Perdurantist's Prediction

  IV. Note on Verbal Disputes

  V. Cases A and B: Each side's answers and what they reveal.

  VI. Bottom line: one sentence.

  Let's draft.

  ---

  **Joint Statement on Persistence**

  **I. Agreed Claims**

  We, the endurantist and perdurantist, after extensive discussion, agree on the following:

  1. **Change**: An object can undergo genuine change by having incompatible properties at different times. For example, an apple can be green at t1 and red at t2, and this is a real alteration in the apple.

  2. **Temporary Properties**: The having of a property by an object at a time is a fundamental feature of reality, and any account of persistence must accommodate it. We agree that the truth of "x is F at t" does not require that x is F at all times, and that such truths are objective.

  3. **Coincidence**: In cases of apparent coincidence (e.g., a statue and the lump of clay that constitutes it), we agree that there are two objects that share the same spatial location at a given time, but we also agree that they are not identical (because they have different persistence conditions). We agree that such cases must be explained without contradiction.

  4. **Fission**: In a fission case (e.g., an amoeba splitting into two), we agree that the original object does not survive as both of the resulting objects. We also agree that the persistence conditions of an object (what it takes for it to survive) are determined by its kind.

  5. **Role of a Persistence Account**: A theory of persistence must explain how an object can be the same object over time despite changes in its properties, and it must do so without contradiction, while also accounting for our judgments about identity through time in cases such as coincidence and fission.

  **II. Restatement of Positions**

  A. **Endurantist Position**: 
     A persisting object is wholly present at each moment of its existence. That is, at each time it exists, the entire object is located at that time. The object is strictly identical across the times it occupies. The fact that the object is located at a time is primitive and not analyzable in terms of having a part at that time. Properties are instantiated by the object at a time, and this instantiation is time-relative (e.g., "x is F at t").

  B. **Perdurantist Position**: 
     A persisting object is a four-dimensional whole, extended in time, and it persists by having different temporal parts at different times. At each time it exists, it has a temporal part that is located at that time. The object is not wholly present at any time; instead, only a part of it is present. The object has properties at a time in virtue of its temporal part at that time having the property simpliciter. The whole object is the mereological sum of its temporal parts.

  **III. Residual Disagreements**

  We have identified the following residual disagreements. For each, we state the crux and a case or argument that both accept as bearing on it, along with our predictions.

  | Endurantist's Formulation | Perdurantist's Formulation | Crux | Case/Argument | Endurantist's Prediction | Perdurantist's Prediction |
  |---------------------------|----------------------------|------|--------------|--------------------------|---------------------------|
  | Whether the having of a property at a time must be analyzed in terms of the properties of parts, or whether it can be taken as primitive. | Whether the having of a property at a time is derivative upon the properties of temporal parts, or whether it is irreducible. | Can "x is F at t" be treated as an unanalyzable primitive, or must it be analyzed in terms of the properties of a part? | Splicing (Case A): Does O survive the swap? | Endurantist: O survives because it is strictly identical across times, and the swap does not break identity. The question of survival is determinate: O is the object that exists at t1 and continues through the swap because the object is wholly present at each time and the identity relation is primitive. | Perdurantist: O does not survive. The object after t3 is a different four-dimensional whole because the temporal parts from t2-t3 have been replaced. The question is determinate: the object that exists from t1 to t5 with the swapped segment is not O but a different entity composed of different temporal parts. |
  | The argument from temporary intrinsics (e.g., shape change) does not force us to accept temporal parts because time-relative instantiation is coherent. | The argument from temporary intrinsics shows that without temporal parts, we must either accept incoherence (an object having incompatible properties) or introduce primitive temporal indexing, which is less parsimonious. | Does the argument from temporary intrinsics retain force when the endurantist uses time-relative properties? | The case of temporary intrinsics (e.g., a bent and then straight object) | Endurantist: The object having incompatible properties at different times is unproblematic because properties are instantiated relative to a time. The argument loses force because the properties are not had simpliciter. | Perdurantist: The argument still shows that the endurantist must introduce primitive temporal indexing, which is less explanatory and more complex than having temporal parts that instantiate properties simpliciter. |
  | Unrestricted composition of temporal parts is not required for perdurantism and would indeed overpopulate the world. | Unrestricted composition is necessary and does not overpopulate because it merely reflects the structure of reality; we can restrict what we count as an object pragmatically. | Must we accept unrestricted mereological composition of temporal parts, and if so, does it overpopulate the world? | Consider a random collection of temporal slices: is there an object composed of them? | Endurantist: We do not need unrestricted composition. Perdurantism, if it requires unrestricted composition, leads to an explosion of objects that are not grounded in our ordinary concept of an object. | Perdurantist: Unrestricted composition is a virtue because it provides a uniform account of composition. The overpopulation is only apparent because we can use sortals to pick out the objects we care about. |
  | The analogy between time and space is not merely heuristic; it is essential to show that location at a time is as fundamental as location at a place. | The analogy between time and space is misleading because temporal parts are required to handle change over time in a way that spatial parts do not. | Is the analogy between being located at a time and being located at a place fundamental to the endurantist view? | Hypothetical physics (Case B): A privileged global simultaneity is restored. | Endurantist: The analogy is fundamental. The restoration of a privileged simultaneity would strengthen the analogy because it would make time more like space. However, the endurantist view does not depend on it. | Perdurantist: The analogy is misleading and not fundamental. The restoration of a privileged simultaneity would not affect perdurantism because temporal parts are needed regardless of the structure of time. |

  **IV. Cases**

  **Case A: Splicing**  
  - Endurantist: O survives the swap because the object at each time is wholly present and identical over time. The swap does not break identity. For the question to have a determinate answer, we must have a criterion of identity that is not violated by the swap (e.g., if the swap preserves the object's identity conditions).  
  - Perdurantist: O does not survive. The object after the swap is a different four-dimensional whole because it has a different temporal part during t2-t3. The question is determinate: the object that exists from t1 to t5 with the swapped segment is not O.  

  **Case B: Hypothetical Successor Physics**  
  - Endurantist: The restoration of a privileged global simultaneity would help the endurantist case by making the analogy to space more robust, but it is not essential. The endurantist view does not draw support from the structure of time in relativity.  
  - Perdurantist: This change in physics would make no difference to perdurantism. Perdurantism is compatible with any temporal structure. The view does not rely on the absence of a privileged simultaneity.  
  Both agree that the fact that this change makes no difference to either view (or only a minor one to endurantism) shows that neither view was ever fundamentally dependent on the structure of time as given by relativity.  

  **V. Note on Verbal Disputes**  
  We agree that some of our past dispute was verbal. In particular, when we spoke of an object "existing at a time," the endurantist meant that the whole object is present at that time, while the perdurantist meant that the object has a part at that time. This difference in meaning led to apparent disagreement about whether an object is "wholly present" at a time. However, we now see that the issue is not merely verbal because it leads to substantive differences in how we handle cases of change and identity (as in the Splicing case).  

  **Bottom line:** The core disagreement that remains is whether the identity of a persisting object over time is strict identity (endurantism) or is grounded in the mereological composition of temporal parts (perdurantism).
answer: |-
  ### Joint Statement on Persistence  
  **Endurantist and Perdurantist Adversarial Collaboration**  

  #### I. Agreed Claims  
  We, the endurantist and perdurantist, concur on the following substantive theses:  

  1. **Change**: An object can genuinely change by possessing incompatible intrinsic properties (e.g., shape or mass) at different times without contradiction. Neither theory eliminates change; both ground it in objective reality.  
  2. **Temporary Properties**: Attributions of the form “x is F at t” are irreducible truthmakers for persistence. Denying such truths (e.g., “The apple is green at noon”) is untenable, regardless of one’s account of how they are realized.  
  3. **Coincidence**: In cases of material coincidence (e.g., a statue and its constituent clay at time t), two numerically distinct objects can occupy the same spatial region at t without sharing all properties or persistence conditions. Neither theory reduces these to one object.  
  4. **Fission**: In symmetric fission (e.g., an amoeba splitting into two), the pre-fission object does not survive as both descendants. Both theories must explain why identity is not transitive here while preserving intuitive judgments of non-identity.  
  5. **Adequacy Conditions**: A theory of persistence must:  
     - Explain how objects retain their identity despite property change.  
     - Resolve paradoxes of coincidence and fission without ad hoc stipulations.  
     - Ground the truth of ordinary temporal claims (e.g., “The car was dusty yesterday”).  

  #### II. Restated Positions  
  - **Endurantist**: A persisting object is wholly present at every moment it exists. Its being located at a time is primitive and unanalyzable in terms of parthood. The object is strictly identical across time; temporal variation in properties is accounted for by time-relative instantiation (e.g., “x is bent-at-t₁” and “x is straight-at-t₂”).  
  - **Perdurantist**: A persisting object is a four-dimensional aggregate of distinct temporal parts. At each time t, only a proper temporal part of the object is present. “x is F at t” is analyzed as “x’s t-part is F simpliciter.” Persistence is the maximal sum of these parts under unrestricted mereological composition.  

  #### III. Disagreements Table  
  | Endurantist’s Formulation                              | Perdurantist’s Formulation                               | Crux                                                                 | Case/Argument Bearing on Crux | Endurantist’s Prediction       | Perdurantist’s Prediction      |  
  |--------------------------------------------------------|---------------------------------------------------------|----------------------------------------------------------------------|--------------------------------|--------------------------------|--------------------------------|  
  | “x is F at t” cannot be analyzed; it is a primitive relation. | “x is F at t” must be analyzed in terms of temporal parts having F simpliciter. | Can temporal predication be treated as primitive without loss of explanatory power? | **Case A (Splicing)**: Does O survive the swap? | O survives: Identity is primitive and unbroken by the swap. For determinacy, O’s kind must specify that identity depends on continuity of existence, not part-history. | O does not survive: Post-swap, O’s t₂–t₃ part is numerically distinct, so the whole is new. Determinacy requires unrestricted composition to fix reference to the pre-/post-swap aggregates. |  
  | Temporary intrinsics are unproblematic with time-indexed properties; no need for parts. | Time-indexed properties are ontologically costly; temporal parts resolve intrinsics cleanly. | Does the argument from temporary intrinsics retain force against primitivism? | A bent-then-straight object: Must we avoid attributing incompatible properties to the whole object? | No force: Time-indexing (bent-at-t) avoids contradiction. The argument fails once indexing is granted. | Force remains: Indexing hides the problem; only parts allow F to be had simpliciter without contradiction. |  
  | Unrestricted composition multiplies entities beyond necessity and intuition. | Unrestricted composition is virtuous; overpopulation concerns are pragmatic, not ontological. | Does perdurantism require unrestricted composition, and if so, is it ontologically profligate? | Arbitrary sums (e.g., “trumpet-1900-to-banana-2020”): Must such fusions exist? | Yes: Perdurantism entails unrestricted composition, multiplying entities without grounding in causal or explanatory needs. | No: Overpopulation is illusory; composition is trivial, and we ignore gerrymandered sums in practice. |  
  | Time-space analogy is essential: location at t is as fundamental as at a place. | Time-space analogy is heuristic; temporal parts are needed due to dynamic constraints (e.g., change). | Is the analogy between temporal and spatial location ontologically load-bearing? | **Case B (Physics)**: Does restoring a privileged simultaneity affect the debate? | Helps slightly: Privileged time strengthens the analogy, but endurantism never relied on relativistic time. | Untouched: Temporal parts solve change regardless of time’s structure; space-time disanalogies remain. |  

  #### IV. Cases  
  **Case A (Splicing)**:  
  - **Endurantist**: O survives. The object is wholly present and strictly identical at each time; swapping a segment is irrelevant to identity. Determinacy requires that O’s kind (e.g., “organism”) specifies identity conditions indifferent to part-replacement.  
  - **Perdurantist**: O does not survive. The post-swap entity is a distinct four-dimensional aggregate due to the new temporal part. Determinacy requires that temporal parts exist and compose uniquely under unrestricted mereology.  

  **Case B (Physics)**:  
  - **Endurantist**: Privileged simultaneity helps by reinforcing the time-space analogy but is not essential. Endurantism draws no support from relativistic time.  
  - **Perdurantist**: Leaves perdurantism untouched; temporal parts address change, not time’s structure.  
  - **Shared Conclusion**: Both agree the physics change makes no substantive difference, revealing that neither theory ever depended on time’s relativistic structure.  

  #### V. Verbal Disputes  
  We identify one primarily verbal dispute: The term “wholly present.” For the endurantist, it denotes primitive, unanalyzed location at a time. For the perdurantist, it conflates parthood with location, making it incoherent. This is verbal because it stems from divergent definitions rather than substantive disagreement about reality—both agree objects are located at times and have properties at times. The dispute dissolves when we specify that “wholly present” is a theoretical term for the endurantist’s primitive relation.  

  **Bottom line**: The disagreement persists over whether strict identity or temporal part-mereology best grounds persistence through change.
