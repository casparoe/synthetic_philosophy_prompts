  Okay, let me try to unpack Aristotle's argument about money and then tackle this perishable scrip scenario. The user is working through Politics Book 1 and has specific questions about Aristotle's concept of money. They mention key passages where Aristotle explains money's origin as a convention for facilitating trade, yet criticizes wealth accumulation as unnatural. The user's group has proposed a thought experiment: a city with currency that expires daily ("perishable scrip"), and they want to know how this fits Aristotle's framework.

  First, I need to recall Aristotle's core arguments. He distinguishes between natural household management (oikonomia) and unnatural wealth-getting (chrematistike). Natural wealth has limits tied to household needs, while unnatural wealth via money is limitless. Money emerges to solve barter's inefficiencies but becomes problematic when treated as an end in itself.

  The user has three main questions. For the first, about whether perishable scrip counts as money: Aristotle defines money by its conventional acceptance and utility in exchange. Storability isn't explicitly required; portability and mutual compact are key. So perishable scrip could still function as money during its valid period, fulfilling the exchange role despite lacking durability.

  For the second question, the tension between money's conventional nature and the unnaturalness of wealth-getting: Aristotle's critique isn't about money itself but how it's used. When money shifts from a means of exchange to an infinite end, that's unnatural. The convention allows this distortion because money's abstract value has no natural limit, unlike goods which satisfy specific needs.

  On the third and most crucial question—whether perishable scrip would eliminate unlimited accumulation—I see two possible readings. If Aristotle's "unlimitedness" stems from money's nature as a pure exchange token, then perishable scrip might mitigate it by forcing daily reset. But if the deeper issue is human confusion of means and ends (desiring infinite life leading to infinite means), scrip changes nothing; people would hoard grain instead. The text seems to point to the latter, as Aristotle links limitless desire to life itself. The medicine analogy suggests any "art" seeks unlimited perfection of its end, so even with scrip, the wealth-getting art could persist via other stores of value.

  The shoe example clarifies that money's proper use is exchange facilitation, not accumulation. But perishable scrip, while preventing money hoarding, doesn't address the root error of misplacing life's purpose. The Midas story emphasizes that mistaking money for real wealth is folly—a lesson scrip might highlight but not solve.

  In conclusion, perishable scrip might technically count as money and curb monetary hoarding, but Aristotle would likely argue the unnatural unlimitedness persists through other means. The core issue is psychological and teleological, not merely technical. The text underdetermines whether money's properties alone cause the problem, but strongly suggests human error in desiring infinity is primary.
answer: |-
  Let's break down Aristotle's argument step-by-step to address your perishable-scrip thought experiment. I'll follow your three questions, grounding each in the text you provided (1257a–1258a) while flagging interpretive ambiguities.

  ### 1. **Does perishable scrip count as money for Aristotle?**
     Aristotle defines money by two key features in your second block:
     - **Usefulness as a commodity itself** ("a useful commodity" like iron/silver).
     - **Conventional compact** ("a mutual compact to give and accept" it).
     - *Additionally*, he notes **portability** ("easy to handle") and later **standardization** (stamps to avoid measuring).

     Crucially, **storability is never explicitly mentioned**. Aristotle emphasizes portability as a solution to the problem that "natural necessaries are not readily portable." The compact establishes money as a *medium* to overcome barter's inefficiencies. Perishable scrip:
     - Fulfills the **compact requirement**: The city agrees to accept it daily.
     - Is **portable and standardized**.
     - BUT lacks intrinsic usefulness (like silver) and **durability/storability**.

     **Interpretive tension:**
     - Aristotle calls money "entirely convention" in your third block, suggesting *any* mutually accepted token qualifies, regardless of material properties. Perishable scrip would count.
     - Yet his historical account implies money *originates* from useful commodities (metal). Scrip lacks this "natural" basis and is purely symbolic.
     - **Textual verdict:** Aristotle likely *would* classify scrip as money. The "convention" argument is explicit, and portability (not storability) solves the problem he identifies. Storability is a *practical consequence* of metal's properties but not a defining feature. Scrip serves money's core function: facilitating exchange when "natural necessaries" aren't portable.

  ### 2. **The tension between "money as convention" and "wealth-getting as unnatural"**
     Aristotle's critique isn't about money *itself* but its *misuse*:
     - Money is **conventional** because its value depends on social agreement ("when those who use it change the currency, it is worth nothing").
     - Wealth-getting is **unnatural** when it treats money (a means) as an *end in itself*. This perverts the purpose of exchange, which is to acquire goods for household needs (the "natural" use). 

     **Why is this unnatural?**
     - Natural wealth (household management) has a **limit**: the needs of the household ("the end is a limit to the means").
     - Unnatural wealth-getting (commerce) has **no limit** because money is abstract and infinitely accumulable ("riches... are truly unlimited"). 

     **The Midas story illustrates the confusion:**  
     Midas treats gold (money) as the *end* of desire, starving because he mistakes the *means* (money) for the *end* (subsistence/good life). The "nonsense" is that money, being conventional and useless for direct consumption, is worthless if divorced from its function as a means to real goods.

     **Resolution:**  
     The unnaturalness lies in the *teleological error* (confusing means and ends), not in money's conventional nature per se. Money’s conventionality *enables* this error because it lacks inherent use-value or natural limits. Scrip doesn’t resolve this—it’s still a conventional means mistaken for an end.

  ### 3. **Would perishable scrip eliminate "unlimitedness"?**
     Aristotle gives two explanations for unlimitedness:
     - **A. Money's nature:** As a pure exchange-token, it has no intrinsic limit ("this wealth-getting has no limit in respect of its end").
     - **B. Human desire:** "The desire for life is unlimited," so people endlessly pursue means (goods/money) to sustain it.

     **How scrip affects (A):**  
     If unlimitedness stems from money’s *abstract, non-perishable nature*, then scrip (which perishes daily) *would* impose a limit. You cannot accumulate it, forcing daily "resets." This aligns with Aristotle’s analogy to *techne* (art): Medicine pursues health without limit, but its *means* (e.g., specific drugs) are limited. Scrip makes money a limited *means*, not an infinite *end*.

     **How scrip affects (B):**  
     If unlimitedness stems from *desire for life*, scrip changes nothing. People would hoard grain, tools, or land instead (as you note). Aristotle explicitly links this to bodily pleasure: "They desire without limit the means productive of life" because they conflate "life" with "bodily enjoyment." Scrip doesn’t touch this psychological error.

     **Textual priority:**  
     - Aristotle emphasizes **desire** as the root: "as therefore the desire for life is unlimited..." (your last block).  
     - The *techne* analogy shows that any art pursues its end limitlessly—but unnatural wealth-getting has a *false end* (money).  
     - **Thus, the deeper issue is psychological/teleological:** People pursue money limitlessly because they mistake it for the good life. Scrip might prevent *monetary* hoarding, but the *desire* would redirect to hoarding grain, land, etc. The Midas problem persists: someone could hoard grain until it rots, still lacking "the bare necessities" if they misallocate resources.  

     **The shoe analogy applied to money:**  
     - A shoe’s "proper use" (telos) is wearing, not barter.  
     - Money’s "proper use" is facilitating exchange for household needs, not accumulation.  
     - Perishable scrip *prevents accumulation*, forcing money back toward its "proper use" (daily exchange). But it doesn’t fix the *desire* to hoard other goods limitlessly.  

  ### Conclusion: Where Aristotle Stands on Your Thought Experiment
  1. **Scrip is money**—it fulfills the compact/convention criterion and solves portability.  
  2. **Unnaturalness is about ends, not money's conventionality**—it’s the error of pursuing money (or any means) as an infinite end.  
  3. **Scrip might curb monetary accumulation but not unlimited desire**—Aristotle’s text prioritizes the psychological root (limitless desire for life/pleasure). Scrip would not cure the disease; it would merely shift symptoms to hoarding grain or land. The "medicine" analogy suggests any art (including wealth-getting) *can* pursue its end limitlessly—and if people define "wealth" as material surplus, even scrip won’t stop them.  

  **Where the text underdetermines the answer:**  
  - Aristotle doesn’t explicitly consider a *non-storable* medium of exchange. His historical account assumes durable money.  
  - He doesn’t clarify whether the *techne* of wealth-getting is unnatural *because* of money’s properties, or whether money is merely a tool that *enables* a preexisting error of desire. The Midas story and the "desire for life" passage suggest the latter is primary.  

  **Final verdict:** In your perishable-scrip city, Aristotle would likely say unnatural wealth-getting persists—just without coin hoards. People would endlessly pursue grain, land, or other storable goods, still confusing means (material surplus) for the end (the good life). The core error is in the soul, not the currency.
