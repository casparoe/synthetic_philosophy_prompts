answer: |-
  ## Ask the Growth Rate  
  *Your questions answered by Logarithmica Jones, champion of the geometric mean and defender of the long run.*

  **Dear Growth Rate,**
  *My weekly poker group has a few predictable “fish.” After careful tracking, I estimate a 5% edge on my bankroll per game. How much of my $10,000 poker bankroll should I bet each week? – Cautious Card Shark*

  **Dear Shark,**
  Your instinct for quantification is laudable. The core principle is the Kelly Criterion: bet a fraction *f* of your bankroll equal to your *edge* divided by the *odds*. Here, you risk your bet to win an amount equal to your bet (assuming 1:1 odds). Your edge (probability of win minus probability of loss) is 5% (0.05). The formula is *f* = *edge* / *odds* = 0.05 / 1 = 0.05. The "full Kelly" answer is 5% of your bankroll.

  However, heed the **Fractional Rule!** Your edge is *estimated*, not known with certainty. Overestimation leads to ruin; underestimation merely leaves growth on the table. Prudence demands we bet a *fraction* of the calculated Kelly stake. The standard fraction is 1/4th to 1/2nd. Apply 1/4th: 0.05 * 0.25 = 0.0125. Bet **1.25%** of your current bankroll each week. This maximizes your long-run growth rate while accounting for estimation error. Starting with $10,000, your first bet is $125. Recalculate using your updated bankroll each week. Remember the experiment: given $25 and a 60% favorable coin, most subjects betting aggressively went bust. Fractional Kelly prevents that multiplicative suicide.

  **Dear Growth Rate,**
  *A developer offered me a chance to invest $80,000 (a big chunk of my savings) flipping a condo. They say there’s a 60% chance I double my money ($160k) in 6 months and a 40% chance I lose it all. Expected value looks positive! Should I do it? – Flipping Out*

  **Dear Flipping,**
  Absolutely not. This is a classic trap of confusing the *ensemble average* (expected value) with the *time-average growth rate*. The ensemble average is indeed positive: (0.6 * $160,000) + (0.4 * $0) = $96,000. A $16,000 profit! But this is a fiction for a single, unrepeatable bet. The *growth rate* tells the true story. Success multiplies your wealth by 2 ($160k / $80k). Failure multiplies it by 0. Your expected log wealth change is: (0.6 * ln(2)) + (0.4 * ln(0)). But ln(0) is negative infinity! While the mathematical expectation of the log is undefined here due to ruin, the practical implication is catastrophic: a 40% chance of *irreversible financial annihilation*. Your "reup number" is 1. You cannot play this game repeatedly. Maximizing growth rate requires avoiding bets where ruin is possible and you cannot rebet to recover. Pass. Seek repeated, smaller opportunities instead. Single massive, ruin-risking bets are geometrically irrational.

  **Dear Growth Rate,**
  *I’m 71 and in good health. My advisor wants me largely in stocks for “long-term growth.” But how long is my “long term”? Should I keep most of my $500k nest egg invested aggressively? – Golden Years Guesser*

  **Dear Guesser,**
  This exposes a crucial tension: the *asymptotic* dominance of the log-optimal strategy requires *time*. While it beats any other strategy with probability 1 *in the infinite limit*, the median Kelly path often spends significant periods underwater. At 71, your personal timeline for drawing down wealth is likely shorter than the recovery periods embedded in those median paths. However, abandoning the growth-maximizing strategy entirely is suboptimal for the *legacy* of your capital.

  Think multiplicatively across generations. Your true “bankroll” isn’t just *your* consumption fund; it’s the seed capital for your lineage’s long-term prosperity. Viewed this way, the time horizon extends dramatically. The log-optimal allocation for stocks vs. bonds depends critically on the estimated equity risk premium and volatility. Given your age, a prudent fractional application is wise. Calculate the full Kelly allocation based on reasonable long-term market estimates (e.g., 5% ERP, 18% vol → *f* ≈ ERP / Var ≈ 0.05 / (0.18^2) ≈ 1.54 → 154% stocks? Clearly too high!). Apply a severe fractional haircut (perhaps 1/8th or less) due to estimation risk *and* your personal need for stability over the next decade. Aim for an allocation (e.g., 30-50% stocks?) that significantly dampens volatility while still harnessing multiplicative growth for your heirs, acknowledging that the pure asymptotic guarantee is less relevant for your personal spending horizon than for the capital's multi-generational journey.

  **Dear Growth Rate,**
  *My spouse and I are debating a second child. Financially, it’s a huge cost. How does this fit into maximizing our household’s growth rate? – Pondering Progeny*

  **Dear Pondering,**
  Children are not a wager with a clear multiplicative payoff in currency. They represent a fundamental diversification and covariance shift within your household’s *overall utility stream*, which likely includes non-financial returns (fulfillment, legacy, care in old age) that are multiplicative in nature over time. Critically, adding a child increases the number of future decision-makers operating on the family’s collective "bankroll."

  Think of your household as an infinitely-lived entity (a lineage). Adding members diversifies the genetic and cultural "portfolio," reducing the risk of total lineage extinction (ruin) and increasing the potential paths for future growth. While the upfront costs are high and multiplicative (doubling daycare, larger housing), the long-term benefits are multiplicative across generations: two potential earners contributing to the family capital, two paths for advantageous marriages or opportunities, two sources of support, and diversification against the risk of any single child experiencing misfortune. The covariance of their outcomes (hopefully less than perfectly correlated!) enhances the stability of the lineage's growth trajectory. From a pure geometric rationality perspective applied to a multi-generational, multi-utility stream, diversification through a second child generally *reduces* the probability of catastrophic decline (lineage extinction or extreme poverty) and increases the robustness of long-term growth, making it a rational choice for the truly long run. Bet on diversification.

  **Logarithmica Jones** has maximized the expected log of her net worth since 2003, employs a strict 1/4th fractional rule, and has a reup number exceeding 10^7 for writing this column. Send your queries to growth.rate@chronicle.com.
