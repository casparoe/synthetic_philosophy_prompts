  Epistemic flags are essential here. The zero PRTP argument is academically established but politically contentious. The correlated survival point is theoretically sound but empirically undeveloped - that's where auditors will pounce. I should note where consensus exists (ηg separation) versus where the user is pushing boundaries (state-dependent discounting).

  For objections, finance economists will attack hardest on implementation ("show me the spreadsheet"). The "revelation principle" objection could be most damaging if not countered immediately - it speaks directly to defensibility. The concession about administrative burden is smart; better to sacrifice bureaucratic convenience than ethical foundations.

