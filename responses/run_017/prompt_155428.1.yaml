answer: |-
  Below is a complete, runnable plan for your 90-minute session on statutory interpretation. The design addresses your goals: students build the problem (rather than react to it), textualism/purposivism terms are withheld until debrief, and the exercise emphasizes institutional choice and predictability over "correct" outcomes. I've incorporated your concerns (e.g., drafting overruns, "unseeing" purpose) and flagged limitations.

  ### **Phase Overview & Timing (90 Minutes Total)**
  - **Phase 1: Drafting Mischiefs & Statutes** (20 minutes + 5-minute buffer = **25 min**)  
  - **Phase 2: Mangling & Setup** (5 minutes)  
  - **Phase 3: Case Analysis in Two Rooms** (40 minutes)  
  - **Debrief** (15 minutes)  
  - **Buffer**: 5 minutes embedded in Phase 1. Total: 90 minutes.  

  ---

  ### **PHASE 1: Drafting Mischiefs & Statutes (25 min)**
  **Goal**: Students draft simple statutes based on concrete mischiefs.  
  **Materials**: 6 sealed mischief cards (one per committee), blank cards for statutes, envelopes.  
  **Instructions to Class (Verbatim)**:  
  > "Split into six committees of three. Each committee gets a card describing a problem in Central Park. Your task: (1) Write a one-sentence statute (≤30 words) to stop this problem. (2) Write the problem on the back of your statute card and seal it in an envelope. You have 12 minutes. Statutes must be precise—assume judges will apply them literally."  

  **Mischief Cards (Print one per committee)**:  
  - **Committee 1**: "People are riding bicycles dangerously fast on crowded paths, causing collisions with pedestrians."  
  - **Committee 2**: "Loud gasoline-powered lawnmowers are disturbing peaceful park visits, especially near quiet areas like the rose garden."  
  - **Committee 3**: "Vendors leave food carts unattended for hours, attracting rats and creating health hazards."  
  - **Committee 4**: "Drones flown low over picnic areas are invading privacy and causing noise complaints."  
  - **Committee 5**: "Park benches are being defaced with permanent graffiti, damaging public property."  
  - **Committee 6**: "Feeding bread to ducks is polluting the pond and making birds sick."  

  **Time Management**:  
  - 0:00–0:12: Drafting (circulate to keep groups on task).  
  - 0:12–0:17: Collect statutes, ensure envelopes are sealed (use buffer if needed).  
  - 0:17–0:25: Buffer/transition.  

  **Why This Works**:  
  - Mischiefs are concrete, relatable, and narrowly scoped to avoid ambiguity during drafting.  
  - Sealing the mischief prevents immediate cross-referencing.  

  ---

  ### **PHASE 2: Mangling & Setup (5 min)**  
  **Goal**: Create a single, ambiguous statute by mangling drafts from Committees 1 and 2.  
  **Materials**: Drafts from Committees 1 and 2.  

  **Mangling Process**:  
  1. Take Committee 1’s statute (e.g., "No person shall ride a bicycle faster than 10 mph in Central Park").  
  2. Take Committee 2’s statute (e.g., "No person shall operate a gasoline-powered lawnmower in Central Park").  
  3. **Mangle them**: Swap "bicycle" (Com 1) and "lawnmower" (Com 2), then staple into one statute:  
     > **"No person shall ride a lawnmower faster than 10 mph or operate a gasoline-powered bicycle in Central Park."**  

  **Why Committees 1 and 2?**  
  - Their mischiefs (safety vs. tranquility) are related but distinct, creating natural tension when mangled. Other committees are decoys; ignore their drafts.  

  **Setup for Rooms**:  
  - Print **case cards** (one set per room, see below).  
  - Prepare room assignments: Split 18 students into two rooms of 9 (pre-assign to avoid chaos).  

  ---

  ### **PHASE 3: Case Analysis (40 min)**  
  **Split into Two Rooms** (0:25–0:30):  
  - **Room A (Text-Only)**: Gets the mangled statute + case cards.  
  - **Room B (Text + Purpose)**: Gets the mangled statute + case cards + **unsealed mischief cards for Committees 1 and 2**.  

  **Instructions (Verbatim, Print for Each Room)**:  
  > **Room A (Text-Only)**: "Decide if the statute applies to each case using ONLY the text. Do not guess the purpose. Focus on the words. After deciding, predict Room B’s decision."  
  > **Room B (Text + Purpose)**: "Decide if the statute applies by focusing on the problems described on your mischief cards. Do not let the wording stop you from achieving the law’s purpose. After deciding, predict Room A’s decision."  

  **Case Cards (Print one set per room; 5 cases)**:  
  1. **Squarely Inside**: *"A teenager rides a gasoline-powered bicycle at 15 mph on a crowded path."*  
     - Text: Violates (gasoline-powered bicycle + >10 mph).  
     - Purpose: Violates both mischiefs (safety + noise).  

  2. **Text Covers, Mischief Doesn’t (Over-Inclusion)**: *"A gardener slowly pushes a silent, electric lawnmower (not gasoline) at 5 mph in a deserted rose garden."*  
     - Text: Violates (lawnmower >10 mph? Ambiguous, but "ride a lawnmower" covers any motion).  
     - Purpose: No mischief (no danger, no noise).  

  3. **Mischief Covers, Text Doesn’t (Under-Inclusion)**: *"A cyclist rides a quiet, non-motorized bicycle at 15 mph through a quiet rose garden."*  
     - Text: No violation (not a "gasoline-powered bicycle").  
     - Purpose: Violates Committee 1’s mischief (safety risk).  

  4. **Compromise Statute (No Single Purpose)**: *"A person rides a gasoline-powered bicycle at 5 mph in a deserted area."*  
     - Text: Violates (gasoline-powered bicycle, regardless of speed).  
     - Purpose: Committee 1’s mischief (safety) not triggered; Committee 2’s mischief (noise) is.  

  5. **Unforeseen Application**: *"A child rides a loud, gasoline-powered toy scooter (invented in 2024) at 8 mph."*  
     - Text: Ambiguous (is a scooter a "bicycle"?).  
     - Purpose: Likely violates both mischiefs (safety + noise), but scooter is new.  

  **Scoring Sheet (Print one per room)**:  
  | Case | Our Decision (Y/N) | Prediction of Other Room (Y/N) |  
  |------|---------------------|-------------------------------|  
  | 1    |                     |                               |  
  | 2    |                     |                               |  
  | 3    |                     |                               |  
  | 4    |                     |                               |  
  | 5    |                     |                               |  

  **Process**:  
  - 0:30–1:05: Rooms discuss cases (8 min/case). Moderator circulates to answer procedural questions.  
  - At 1:05: **Room A writes down their guess of the statute’s purpose** (2 min).  

  **Why This Works**:  
  - Cases mirror your requirements (over/under-inclusion, compromise, unforeseen).  
  - Scoring incentivizes meta-thinking (predicting the other room) over "winning."  
  - Room A may "know" the purpose if Committee 1/2 members are present, but mangling makes it unrecoverable ("gasoline-powered bicycle" is nonsensical).  

  ---

  ### **DEBRIEF (15 min)**  
  **Goal**: Link exercise to real-world disputes without using "textualism/purposivism" until minute 12.  

  **Step-by-Step Script**:  
  1. **Report Results** (0:00–5:00):  
     - For each case, ask:  
       - "Room A, what did you decide? Room B, what did you predict for them?"  
       - "Room B, what did you decide? Room A, what did you predict?"  
     - Record outcomes on board.  

  2. **Reveal Mischiefs & Drafting History** (5:00–7:00):  
     - Show sealed mischief cards for Committees 1 and 2.  
     - Highlight the mangling process: "We swapped words and stapled sentences. The text isn't what *any* committee intended."  

  3. **Map to Core Disputes** (7:00–12:00):  
     - **Case 2 (Over-Inclusion)**: "Room B likely said no, Room A said yes. This shows text can include harmless acts. Should judges fix this, or is it the legislature's job?"  
     - **Case 3 (Under-Inclusion)**: "Room B likely said yes, Room A said no. Purpose covers things text misses. But how can citizens know the law in advance?"  
     - **Case 4 (Compromise)**: "The statute merged two purposes. Room B might have split—this reveals how purpose is messy when legislators compromise."  
     - **Case 5 (Unforeseen)**: "New technology breaks the text. Should meaning evolve, or stay fixed to enactment?"  
     - **Room A’s Purpose Guess**: "How close was it to the real mischiefs? Purpose is hard to recover from text alone."  

  4. **Introduce Terminology & Bigger Picture** (12:00–15:00):  
     - "What Room A did is **textualism**: meaning comes only from words. Room B did **purposivism**: meaning comes from goals. The debate isn’t about cases—it’s about *who decides* when words and purpose clash. Legislatures? Judges? And what can citizens rely on?"  
     - **Key Insight**: "Textualism isn’t ‘stupid literalism’—it’s a theory of institutional roles. Purposivism isn’t ‘making it up’—it’s fixing legislative mistakes."  

  ---

  ### **What Will Go Wrong (and Fixes)**  
  1. **Drafting Overruns**: Students over-edit statutes.  
     - **Fix**: Enforce 12-minute timer; provide examples ("No vehicles in the park").  

  2. **Text-Only Room Can’t "Unsee" Purpose**: If Committee 1/2 students are in Room A, they may recall their mischief.  
     - **Fix**: Assign Rooms 1/3/5 to Room A, 2/4/6 to Room B to dilute experts. Emphasize: "You’re playing a role—textualists ignore purpose."  

  3. **Demand for "Correct Answer"**: A student insists outcomes matter.  
     - **Fix**: Preempt: "No ‘right’ answers today. We’re testing methods, not cases." Redirect to prediction scoring.  

  4. **Confusing Outcome/Method**: Student says, "Textualism is bad because Case 3 is unfair."  
     - **Fix**: In debrief, separate: "Did you dislike the *outcome* or the *constraint*? Textualists accept ‘bad’ outcomes to preserve predictability."  

  5. **Time Crunch in Case Analysis**: Groups stall on one case.  
     - **Fix**: Announce time per case (e.g., "7 minutes left for Case 3").  

  ---

  ### **What the Exercise Cannot Reproduce (and How to Address)**  
  1. **Base Rate of Easy Cases**: 95% of real cases are unambiguous; this focuses on the 5% that create disputes.  
     - **Address in Lecture**: "Hard cases make bad law. Today’s exercise is the exception, not the norm."  

  2. **Precedent and Canons**: Textualists use canons (e.g., "expressio unius"); purposivists use legislative history.  
     - **Address in Lecture**: "Add precedent by having Room A/B argue past cases. Add canons by giving Room A a ‘rules of interpretation’ cheat sheet."  

  3. **Judge’s Epistemic Position**: Real judges may have unreliable legislative history (e.g., cherry-picked speeches).  
     - **Address in Debrief**: "Room B had ‘pure’ purpose. Real purposivists face messy history—should they use it?"  

  4. **Textualist Disagreements**: Textualists debate fixed enactment meaning vs. evolving ordinary meaning.  
     - **Address in Debrief**: "In Case 5, should ‘bicycle’ include scooters? Originalists say no; modernists ask what ‘bicycle’ means today."  

  5. **Short Variant with Time Gap**: Running the same statute "decades later" (e.g., for Case 5) is powerful but time-prohibitive.  
     - **Alternative**: "For homework, rewrite Case 5 as if it’s 2050. Does textualism/purposivism change the outcome?"  

  ---

  ### **Materials Checklist**  
  - **For Phase 1**: 6 mischief cards, blank cards/envelopes.  
  - **For Phase 2**: Stapler, printed mangled statute.  
  - **For Phase 3**:  
    - Room A: 5 case cards + scoring sheet.  
    - Room B: 5 case cards + scoring sheet + unsealed mischief cards (Com 1 and 2).  
  - **For Debrief**: Whiteboard, markers.  

  This plan builds ambiguity from student input, forces methodological tradeoffs, and culminates in a structured debrief. It balances realism with teachability—focusing on why we disagree about interpretation, not just how. Run it as-is, and adjust mangling/cases based on student drafts.
