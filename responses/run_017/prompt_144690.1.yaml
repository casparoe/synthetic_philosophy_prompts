      "Covert awareness deemed non-harmful (if undetectable, no moral weight).",
      "Withdrawal of care based solely on access tests."
    ],
    "underdetermined": "Whether absence of access evidence implies absence of phenomenality; precautionary sedation is compatible with all theories except those denying phenomenality entirely or asserting strict access-phenomenal identity."
  }
