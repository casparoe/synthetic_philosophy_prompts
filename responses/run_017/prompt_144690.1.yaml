      },
      "orphaned_island": {
        "gwt_verdict": "Unconscious (no broadcast).",
        "phenomenal_first_verdict": "Conscious and suffering.",
        "practice_implicit_verdict": "Unconscious (no evidence; suffering ignored)."
      }
    },
    "load_bearing_case": "Orphaned island, as it exposes the practice's reliance on evidence availability (not metaphysical necessity) and justifies precautionary measures despite theoretical underdetermination.",
