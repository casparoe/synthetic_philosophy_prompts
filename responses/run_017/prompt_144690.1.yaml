  ### Key Clarifications
  - **GWT vs. Practice**: GWT *predicts* misdiagnosis in "silent broadcast" (practice’s false negatives), but practice doesn’t *require* GWT—it only needs access as evidence. GWT makes the tension visible but doesn’t invalidate practice.
  - **Orphaned Islands**: Practice ignores them not by denying their possibility, but by judging them actionably irrelevant (no evidence → no intervention target). Precautionary sedation addresses *any* undetectable risk, not specifically orphaned islands.
  - **Metaphysical Silence**: The practice works because it prioritizes evidence and risk management over ontology. Swapping theories only changes bedside actions if they alter the link between evidence and moral stakes (e.g., strict identity eliminates precaution).
