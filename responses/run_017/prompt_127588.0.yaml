     *   **Established Body?** Work on causal models in conditionals exists, often focusing on counterfactuals or specific puzzles. Work within a broadly Kratzerian framework using causal structure is also known. However, the *combination* of: (1) explicit unification under one `if`, (2) the intervention/conditioning dichotomy as the core engine, and (3) the exploitation of Case B as a *mirror image* test case distinguishing the theory, constitutes a novel synthesis and argument. You're refining and extending, not reinventing the wheel wholesale.

