answer: |-
  Here's a decision tree structured around concrete cases, designed to map the logical space of "dirty hands" while prioritizing student accessibility. The questions are phrased as case-verdicts, forcing choices that reveal underlying principles.

  **The Dirty Hands Decision Tree**

  **Start:** Consider a political official facing a severe moral crisis: doing/permitting something seemingly wrong to prevent something worse or achieve a significant good.

  1.  **Is this situation fundamentally different from everyday moral trade-offs?**
      *   *(A) NO, it's just a hard choice like any other (e.g., lying to save a life).* → **Go to 2A**
      *   *(B) YES, there's a unique moral taint or paradox here specific to political power.* → **Go to 2B**

  **Branch A (No Distinct Problem):**

  2.  **A legislator must vote for a badly flawed bill (e.g., compromises civil liberties) to block a worse one (e.g., eliminating those liberties entirely). Should she vote for the flawed bill?**
      *   *(A1) YES, it's the lesser evil; she did the best she could.* → **Leaf 1: Ordinary Moral Conflict (e.g., Utilitarianism/Consequentialism)**
          *   *Awkward:* Must accept that *some* deeply repugnant acts (if truly the lesser evil) are morally right/required.
          *   *Public Treatment:* Praise or tolerance for making the tough but correct choice; punishment only if calculation was flawed.
      *   *(A2) NO, one must never directly endorse/participate in fundamental injustice, regardless of consequences.* → **Leaf 2: Refusal Required (e.g., Kantian Absolutism, some Pacifism)**
          *   *Awkward:* Must accept potentially catastrophic outcomes as the price of individual moral purity.
          *   *Public Treatment:* Praise for integrity if refusal succeeds; condemnation or removal if refusal leads to disaster deemed avoidable.

  **Branch B (Unique Problem):**

  2.  **A Mayor authorizes a police raid she knows has a high risk of killing an innocent bystander to capture a terrorist planning an imminent mass attack. Did she act wrongly?**
      *   *(B1) NO, the action was necessary and justified given the stakes.* → **Go to 3**
      *   *(B2) YES, killing the innocent is always wrong, even to prevent worse.* → **Leaf 2: Refusal Required** (Same as A2 above - path converges)

  3.  **If the Mayor's action (B1) was justified, does she bear any special moral burden because *she* chose to act?**
      *   *(B1a) NO, a justified act leaves no moral residue; she is blameless.* → **Go to 4**
      *   *(B1b) YES, she is personally guilty despite the act being necessary.* → **Leaf 3: Justified but Guilty (e.g., Walzer, Williams)**
          *   *Awkward:* Holds the agent responsible for an act deemed politically necessary/justified.
          *   *Public Treatment:* Tolerate the act itself but demand public confession/atonement; willingness to accept punishment or removal is a mark of integrity.

  4.  **A Minister *fails* to act, allowing preventable deaths (e.g., doesn't divert funds to avert famine), because acting would violate procedural rules or alienate a key ally needed for a greater long-term good. Is the Minister's *inaction* significantly different from the Mayor's *action*?**
      *   *(B1a1) YES, permitting harm is less culpable than actively causing it.* → **Leaf 4: Unnamed (Permissive Asymmetry)**
          *   *Awkward:* Risks excusing passivity in the face of preventable suffering if the cost of acting is high.
          *   *Public Treatment:* Tolerance if the greater good was real; pressure to resign only if passivity was excessive or the calculation wrong.
      *   *(B1a2) NO, the moral responsibility is equivalent; both involve choosing an avoidable bad outcome.* → **Go to 5**

  5.  **A Campaign Strategist quietly benefits from a key supporter's smear campaign against an opponent, knowing it's unethical but believing winning is crucial. If the Strategist didn't orchestrate the smear, is she tainted?**
      *   *(B1a2a) YES, her complicity (even passive) in the unethical act creates dirty hands.* → **Go to 6**
      *   *(B1a2b) NO, she is only responsible for her own direct choices; benefiting from others' acts is irrelevant.* → **Leaf 5: Unnamed (Strict Direct Agency)**
          *   *Awkward:* Absolves officials who deliberately turn a blind eye or create permissive environments for others' dirty work.
          *   *Public Treatment:* Tolerance unless proven she actively encouraged it; removal if direct involvement is shown.

  6.  **Could the dirty hands dilemma faced by the Mayor/Minister/Strategist have been avoided by better choices *before* the crisis? (e.g., better policing policies, stronger alliances, ethical campaign rules she supported)**
      *   *(B1a2a1) YES, significant responsibility lies in creating or upholding systems leading to the dilemma.* → **Leaf 6: Dilemma Dissolved by Design (e.g., Institutionalist Focus)**
          *   *Awkward:* May downplay the immediacy of unavoidable tragic choices within *existing* flawed systems.
          *   *Public Treatment:* Focus on institutional reform; removal only if the official *personally* blocked reform. Tolerance for acting within broken systems.
      *   *(B1a2a2) NO, the dilemma was genuinely imposed by circumstances beyond her control.* → **Go to 7**

  7.  **A Civil Servant leaks classified documents to derail a lawful but (she believes) deeply unjust policy, accepting personal ruin. Should she be shielded from punishment because her motive was just?**
      *   *(B1a2a2a) NO, the act remains wrong and punishment is required to uphold the office/rule of law, even if her conscience is clear.* → **Leaf 7: Guilt Attaches to the Office (e.g., Weberian Bureaucratic Ethic)**
          *   *Awkward:* Requires punishing individuals for acts motivated by sincere conscience against perceived injustice.
          *   *Public Treatment:* Punish the individual (e.g., prosecution, firing) to protect the integrity/authority of the office and its future holders.
      *   *(B1a2a2b) YES, the act can be justified *if done publicly*, accepting the consequences; the core wrong was secrecy.* → **Leaf 8: Publicity as Requirement (e.g., Some Democratic Transparency Views)**
          *   *Awkward:* May legitimize harmful acts if the actor is brazen enough to do them openly and accept fallout.
          *   *Public Treatment:* Demand public confession/justification; punishment or removal depends on public judgment of the justification, not the act itself. Refusal to go public condemns the act.
      *   *(B1a2a2c) NO, BUT the official refusing a dirty job, knowing a worse person will take it and cause more harm, bears some responsibility for *that* outcome.* → **Leaf 9: Unnamed (Consequentialist Refusal Burden)**
          *   *Awkward:* Suggests one might be *obligated* to take a dirty job to prevent someone worse from doing it dirtier.
          *   *Public Treatment:* Tolerance for officials who undertake necessary dirt *specifically* to block worse alternatives; pressure on "purists" whose refusal enables worse outcomes.

  **Key & Notes:**

  *   **Flagged Convergence:** Leaves 2 ("Refusal Required") is reached from both the "No Distinct Problem" path (A2) and the "Unique Problem" path (B2). This highlights that absolutist refusal can stem from denying the uniqueness *or* accepting uniqueness but prioritizing prohibition.
  *   **Unoccupied Combinations & Diagnosis:**
      *   **"Action justified & guiltless" + "Dilemma self-created" + "Punishment required"**: Incoherent. If justified and guiltless, punishment makes no sense. If the dilemma is self-created, justifying the act becomes much harder. (Occupied paths: "Action justified & guiltless" leads to *avoiding* punishment paths).
      *   **"Permission equivalent to action" + "No taint from benefiting" + "Dilemma imposed" + "Publicity required"**: Unattractive/Unexplored. Affirming moral equivalence of action/permission *and* benefiting, yet demanding publicity seems arbitrary and doesn't resolve the core guilt. Focuses on a procedural fix (publicity) for a deep moral equivalence claim without explaining *why* publicity cleanses the equivalent taint. Most publicity-focused views start from the act itself being the core wrong if covert.
  *   **Case Coverage:** The legislator (Q2A), mayor (Q2B), minister (Q4), strategist (Q5), leaker (Q7), and refusal scenario (Q7c) are all explicitly addressed as nodes.

  This tree forces students to confront the core tensions (action/permission, responsibility, guilt, institutions, publicity) through concrete choices before revealing the theoretical labels and their implications. The "unnamed" leaves highlight under-theorized or hybrid positions within the logical space.
