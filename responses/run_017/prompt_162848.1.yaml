  I'm writing a term paper for a graduate seminar in philosophy of physics, and I've reached a point where I genuinely cannot tell whether my disagreement with a friend in the seminar is about the physics, about the metaphysics of spacetime, or merely about what an argument is allowed to take for granted. The proposition I want a number on is this: the hole argument, in its standard contemporary reconstruction, is a sound and non-question-begging argument against some position that an actual spacetime substantivalist is committed to — that is, that it does real metaphysical work, rather than merely re-describing the fact that diffeomorphism-related models of a generally covariant theory are isomorphic and so have to be identified as representing the same world. My credence is roughly 0.3; my friend's is roughly 0.75. For resolution: I would count the question as settled if it became clear either that every version of substantivalism that survives the argument collapses into some form of relationalism or structuralism about spacetime, or that there is at least one stable version of substantivalism that can deny Leibniz equivalence without being independently implausible.

  What I want from you is your own number, but mainly the decomposition. The terms I think are in play, though please add, drop, or re-cut them as you see fit: (a) the probability that anti-haecceitism about spacetime points is true, i.e. that two models related by a diffeomorphism represent one and the same physical state, with no genuine difference over which points play which roles; (b) conditional on anti-haecceitism being false, the probability that substantivalism as philosophers actually defend it — as opposed to a crude view on which bare manifold points have their identity independently of any fields — is committed to those haecceitistic differences; (c) the probability that what the argument outputs, if it succeeds, is really an indeterminism verdict rather than a distinction-without-a-difference verdict, and that these are not simply the same verdict in different clothing; (d) the probability that what is doing the work is general covariance as such rather than the absence of fixed, non-dynamical background structure, given the familiar line of objection that general covariance on its own is physically vacuous; and (e) the probability that some analogous argument can be run against the relationalist or structuralist — say against substantivalism about the metric field itself, or about any other entity whose individuals one might take to have primitive identity — in which case the argument overgeneralises and proves too much. Give each term a number and one line of justification, then combine them explicitly, telling me where you are assuming independence and where you are not, which single term your final number is most sensitive to, and what one consideration would move it furthest.

  One further thing, which is specifically at issue between us and which I'd like you to adjudicate as part of the decomposition rather than in passing: my friend's preferred variant drops the requirement that the hole be a matter-free region, and instead applies a diffeomorphism everywhere, dragging the matter fields along with the metric, so that the resulting models differ only in which points occupy which roles. She thinks this strengthens the argument, by showing that it does not depend on any special feature of empty regions; I think it weakens it, because making the haecceitism premise explicit turns the argument into something the substantivalist can simply reject, and hence into something close to question-begging. Tell me which of us has the better of that exchange, what it does to your number, and where you think the gap between a 0.3 and a 0.75 most likely lives. Finally, since I have to defend this in front of people who know the literature: please mark clearly which premises are settled mathematics and which are genuinely contested among specialists, and do not present a contested reading of the argument as the consensus one.
