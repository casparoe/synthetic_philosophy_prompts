prompt: |-
  I'm marking a stack of take-home exams for my modern ethics course (we just finished the Groundwork) and I want a second pair of eyes on this one so I don't get lazy. Grade it out of 20 and give me the actual margin comments you'd write — what's right, what's shaky, and where the reasoning stops working. Please key your comments to the parts of the question rather than just giving me an overall impression.

  The exam question was:

  (a) Kant's Formula of Universal Law says roughly: act only on a maxim that you could at the same time will to become a universal law. His Formula of the Law of Nature says the same sort of thing but adds that the maxim is to hold as if, through your will, it were to become a law of nature. What work is that extra bit doing, and is it a second, separate test? Then: distinguish a contradiction in conception from a contradiction in the will, and say which kind of duty each is supposed to ground. (8 points)

  (b) Here's a test that isn't in the literature, so you have to think it through yourself. Call it the Double-Negation Test (DNT). For any action you're considering in circumstances C, let M be your maxim for doing it in C, and let M⁻ be the maxim of never doing it when you're in C. DNT says: the action is permissible iff you can will M as a universal law AND you can will M⁻ as a universal law. Is DNT equivalent to the Formula of Universal Law, is it stricter, or is it weaker? Argue for your answer and use at least one of Kant's four examples (suicide, the false promise, neglected talents, refusing to help) to show how the difference plays out. And is DNT a better test than Kant's? (12 points)

  The student's answer:

  (a) A maxim for Kant isn't just the bare action, it's the agent's principle of volition — circumstance, end and action taken together. That matters, because the universal law formula isn't asking "what if everybody did that thing"; it's asking whether the agent's own principle can be willed to hold for everyone. Two people can perform the same outward action and their maxims can come out differently, which is also why the test isn't a disguised consequentialist filter: the failure isn't in the aggregate outcome, it's in whether the willing is consistent.

  The law of nature version adds the bit about the maxim becoming, by your will, a law of nature. I take it that clause is doing two things. First, universality and necessity: laws of nature hold without exception, so it blocks reading universalization as most people, most of the time. Second, it gives you a world to picture, and you need a world to picture before any contradiction can show up. It's the same test in a metaphor, not a second and stricter test: nothing is added to what's required, only the imagery.

  The two ways a maxim can fail are different. Contradiction in conception: you can't even so much as think the universalized version, because the practice the action depends on dissolves and so the maxim cancels itself. The false promise is the case — universal deceit makes promising impossible, so a maxim of promising falsely could not be a universal law. Contradiction in will: the world is conceivable fine, but a rational agent could not will it, because willing it would mean giving up something that reason necessarily wills. Neglected talents and refusing to help are those cases. The first kind grounds perfect, narrow duties, with no latitude; the second grounds imperfect, wide duties, where you get some latitude about how and how much.

  Really, though, all of this is the golden rule with the theology stripped out and a consistency constraint bolted on: treat others only as you would be willing to be treated in return.

  (b) DNT is equivalent to the Formula of Universal Law, just run twice. FUL takes a maxim and asks whether it can be willed as universal; DNT asks that question of M and then again of M⁻, so nothing new is demanded of M itself. It can't be stricter than FUL, since M⁻ is only another maxim going through the very same test.

  Check it on the man who won't help. His maxim — when others are in need and helping would cost me little, I won't — fails by contradiction in will: I can't will a world in which no one ever helps, since I may need help myself. His M⁻ — when others are in need and helping costs little, I will — is willable, and it's what the imperfect duty of beneficence recommends anyway. So DNT says refusing is impermissible and helping is permissible, exactly what FUL says. Same verdicts, no difference in strictness.

  If anything DNT is the better test, because FUL can only tell you that the maxim you actually formed fails. DNT also makes you check the option you didn't take up, so it catches people who pass by accident, merely because they never considered acting otherwise.
reasoning: |-
  Okay, let me approach this grading systematically. The professor wants detailed comments tied to specific parts of the question, so I'll break down my analysis section by section.

  Hmm, starting with part (a). The student nails the definition of maxims - they correctly emphasize it's not just the action but the full principle of volition with circumstances and ends. That's crucial context. Their explanation of the Law of Nature formula is mostly strong too - they identify the universality/non-contingency aspect and the role in visualization. Though... I notice they miss that the law of nature metaphor also introduces teleology, which Kant uses to explain contradictions in will. Should probably mention that in comments.

  Ah, here's the first real issue. They claim it's "the same test in a metaphor" but actually Kant presents these as four distinct formulations with different emphases. The law of nature version specifically helps with conceiving universalization concretely. Need to flag that it's not merely imagery but serves distinct conceptual purposes.

  Moving to contradictions - they perfectly distinguish conception vs will and link to duty types with correct examples. But then they undermine it all with that bizarre "golden rule" comment at the end! That's dangerously reductive - Kant explicitly rejects equating his framework with the golden rule in Groundwork II. Major red flag.

  For part (b)... The student's understanding of DNT seems superficial. Their equivalence claim holds only if we assume M⁻ is properly formed, but maxim formulation is tricky. Take their own example: the M⁻ "I will help when..." isn't actually the proper negation of the original maxim. The real negation would be "I will not refuse to help" which is importantly different. This affects their whole argument.

  Interesting - they correctly identify the beneficence case outcome but miss how DNT could produce false positives. Consider suicide: Kant says maxim fails in conception, but M⁻ ("I will preserve life") passes. DNT might incorrectly permit suicide since both "will" and "won't" seem universalizable? That shows DNT isn't equivalent.

  The "better test" argument is thoughtful but flawed. While checking alternative maxims is useful, Kant's framework already requires testing the maxim you actually act on - considering alternatives isn't necessary for the test itself. And their "accidental conformity" point misunderstands Kant's focus on actual maxims, not hypotheticals.

  On grading... Part (a) has strong fundamentals marred by the golden rule error (6/8). Part (b) shows engagement but has logical flaws in equivalence claim and misses counterexamples (8/12). Total 14/20 feels right - good comprehension but significant errors in interpretation and application.
answer: |-
  ### Graded: 14/20 (7/10 for a, 7/12 for b)  
  **Comments Keyed to Question Parts**  

  ---

  ### (a) Comments (6/8 points)  
  **What’s Right:**  
  - **Maxim definition:** Correctly identifies a maxim as the agent’s principle of volition (circumstance + end + action), distinguishing it from bare action (✔).  
  - **Universal Law vs. Consequentialism:** Clear explanation that FUL tests the *consistency* of willing, not aggregate outcomes (✔).  
  - **Law of Nature clause:** Accurately notes the emphasis on *necessity* (no exceptions) and the need for a conceivable world (✔).  
  - **Contradictions & Duties:** Perfect distinction between contradiction in conception (e.g., false promise → perfect duty) and contradiction in will (e.g., neglected talents → imperfect duty) (✔✔).  

  **What’s Shaky:**  
  - **"Same test in a metaphor"**: Understates the Law of Nature’s role. It isn’t *just* imagery; it forces us to imagine the maxim as a *necessary, deterministic law* (like gravity), highlighting conflicts with human nature/agency (e.g., talents/help cases depend on natural needs). Kant treats it as a distinct formulation (Groundwork II).  
  - **"Theology stripped out"**: The golden rule comparison is misleading. Kant *explicitly rejects* the golden rule (Groundwork II, 430n) because it lacks a consistency test and relies on subjective wishes. FUL is objective and rational, not reciprocity-based.  

  **Where Reasoning Stops:**  
  - **Golden Rule Claim**: This misrepresents Kant’s project. FUL is *not* a modified golden rule; it’s a formal test of rational consistency. The comment undermines the core innovation of Kant’s ethics.  

  **Score:** 6/8 (Strong on mechanics, but misstep on golden rule costs 2 points.)  

  ---

  ### (b) Comments (8/12 points)  
  **What’s Right:**  
  - **DNT Structure:** Correctly describes DNT as testing both M and M⁻ under FUL (✔).  
  - **Beneficence Example:** Accurately applies FUL to the refusal-to-help case (contradiction in will) and notes M⁻ ("I will help") is universalizable (✔).  
  - **Verdict Equivalence:** Correctly observes identical outcomes for this example (✔).  
  - **"Catches accidental conformity"**: Insightful point that DNT forces agents to test alternatives, avoiding maxims that pass FUL due to unconsidered options (✔).  

  **What’s Shaky:**  
  - **"Equivalent & Not Stricter"**: Overstates equivalence. DNT *is* structurally stricter by requiring *two* maxims to pass FUL. While outcomes *might* align, DNT imposes an additional procedural burden.  
  - **M⁻ Definition**: Assumes M⁻ is simply the *opposite action* (e.g., "help" vs. "refuse help"). But maxims include *ends* and *circumstances*. A proper M⁻ for "refuse help when easy" might be "help *whenever asked*," which could fail FUL (e.g., if help enables harm).  

  **Where Reasoning Stops:**  
  1. **False Promise Counterexample**:  
     - **M** (False promise): "When I need money, I’ll lie to repay." → **FUL**: Fails (contradiction in conception).  
     - **M⁻** (Never lie to repay): "When I need money, I’ll *never* lie to repay." → **FUL**: Passes (duty of honesty).  
     - **DNT Verdict**: Permissible (both M⁻ and M pass? No! M fails, so action is impermissible).  
     Here, DNT *coincides* with FUL, but **equivalence isn’t proven**.  

  2. **Suicide Counterexample**:  
     - **M** (Suicide from self-love): "If life brings misery, I’ll end it to avoid pain." → **FUL**: Fails (contradiction in conception: self-love destroyed by self-destruction).  
     - **M⁻** (Never suicide): "If life brings misery, I’ll *never* end it." → **FUL**: Passes (preserves life).  
     - **DNT Verdict**: Suicide is *permissible*? (Since M⁻ passes, and M is tested separately). But Kant says suicide is *always impermissible*. **DNT fails here** by not blocking M.  

  **DNT vs. FUL**:  
  - **Weaker?**: In suicide case, DNT permits what FUL forbids → DNT is *weaker* (lets some impermissible acts pass).  
  - **Not Equivalent**: Outcomes diverge in key cases.  
  - **"Better Test"?**: DNT’s strength (testing alternatives) is offset by false permissions (suicide). FUL focuses on the maxim *you actually act on*, which is ethically primary.  

  **Score:** 8/12 (Good analysis of beneficence, but misses counterexamples and overclaims equivalence.)  

  ---

  ### Overall  
  **Strengths:** Clear grasp of maxims, contradictions, and duties. Strong application to beneficence case.  
  **Weaknesses:** Misreading of Law of Nature’s role, golden rule error, incomplete DNT analysis.  
  **Final:** 14/20 (B-) — Solid but needs tighter Kant exegesis and counterexample consideration.
